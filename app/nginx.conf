# Bot detection for SEO — these bots get pre-rendered HTML with og:tags from
# /seo-proxy/, social bots (no JS) and search-engine bots alike. Google
# explicitly says serving prerendered HTML to crawlers is fine as long as the
# content matches what humans see; for a content-driven catalogue with ~3000
# spec/impl pages, having every URL claim the homepage's title/canonical/og:url
# (the SPA shell) costs weeks of indexing latency on new pages and risks the
# wrong title/description being indexed when client-side rendering fails.
map $http_user_agent $is_bot {
    default 0;
    # Search engines — historically excluded "because they render JS since 2019",
    # but in practice the prerendered HTML produces faster, more reliable
    # indexing for a content-driven catalogue. This path is invisible to human
    # traffic, so it is monitored continuously by
    # .github/workflows/bot-serving-check.yml (daily curl with bot UAs); after
    # any change here, also verify manually with
    # `curl -A "Googlebot" https://anyplot.ai/scatter-basic` — should return
    # the per-route title/canonical/og:url, not the empty SPA shell.
    ~*googlebot 1;
    # Search Console's URL inspection (Google-InspectionTool) and Google's
    # misc crawler (GoogleOther) do NOT contain "googlebot" in their UA —
    # without these entries they fell through to the SPA shell, so URL
    # inspection showed the wrong page (audit 2026-07-16).
    ~*google-inspectiontool 1;
    ~*googleother 1;
    ~*bingbot 1;
    ~*duckduckbot 1;
    ~*yandexbot 1;
    ~*baiduspider 1;
    ~*applebot 1;
    # AI assistants, AI search and citation crawlers. Same failure mode as the
    # search engines: none of them execute JavaScript, so without these entries
    # an AI answer citing anyplot describes the empty SPA shell. Claude-User /
    # ChatGPT-User / Perplexity-User are USER-directed fetches — a human asked
    # their assistant to open the page — and matter most.
    # This map only decides WHAT a crawler gets once it arrives, never whether
    # it may: the allow/deny policy is robots.txt plus the Cloudflare AI Crawl
    # Control zone setting (docs/reference/seo.md). Under the current policy
    # everything except Bytespider may crawl, so an agent missing from this map
    # is not thereby declined — it just gets the empty SPA shell, which is the
    # failure this list exists to prevent.
    ~*claudebot 1;
    ~*claude-user 1;
    ~*claude-searchbot 1;
    ~*gptbot 1;
    ~*oai-searchbot 1;
    ~*chatgpt-user 1;
    ~*perplexitybot 1;
    ~*perplexity-user 1;
    # User-directed fetchers that arrive when a human asks their assistant to
    # open a page. Google documents its own as "generally ignoring robots.txt"
    # (developers.google.com/search/docs/crawling-indexing/google-user-triggered-fetchers),
    # so robots.txt cannot govern what they fetch — leaving this map to decide
    # what they receive, and Cloudflare AI Crawl Control as the only lever that
    # can still refuse them outright at the edge. Every one of these was
    # verified live on 2026-08-18 receiving the empty SPA shell, i.e. an
    # assistant asked about a plot page could describe nothing at all.
    ~*gemininotebook 1;
    ~*notebooklm 1;
    ~*gemini-deep-research 1;
    ~*googleagent 1;
    ~*google-agent 1;
    ~*meta-externalfetcher 1;
    ~*meta-webindexer 1;
    ~*mistralai-user 1;
    ~*mistralai-index 1;
    ~*duckassistbot 1;
    ~*amzn-searchbot 1;
    ~*amzn-user 1;
    # Amazon's documented crawler token is "Amazonbot" — the two amzn-* entries
    # above never matched it, so the documented crawler got the empty shell
    # (AI-access audit 2026-08-19). Same for Meta: "meta-externalagent" is the
    # documented AI-training crawler, distinct from meta-externalfetcher.
    ~*amazonbot 1;
    ~*meta-externalagent 1;
    # Community-reported assistants: no vendor documentation exists for these
    # tokens, so they are best-effort. Mapping them is harmless — this map only
    # decides WHAT an agent receives, never whether it may crawl; that is
    # robots.txt plus Cloudflare. Under-mapping is the failure mode that put
    # seven fetchers on the empty shell, so err toward listing.
    #
    # ~*grok subsumes the previously listed grokbot / xai-grok /
    # grok-deepsearch AND the bare "Grok" token xAI's fetcher was seen sending
    # — which fell through to the empty shell and produced Grok's
    # "insufficient relevant content" (AI-access audit 2026-08-19). No common
    # browser UA contains the substring.
    ~*grok 1;
    # xAI's company token, for fetcher UAs that carry "xAI" but not "grok"
    # (verified 2026-08-28: a UA "xAI-Bot" fell through ~*grok to the empty
    # shell). No common browser UA contains the substring.
    ~*xai 1;
    ~*youbot 1;
    ~*cohere-ai 1;
    ~*diffbot 1;
    ~*firecrawl 1;
    # Social Media
    ~*twitterbot 1;
    ~*facebookexternalhit 1;
    ~*linkedinbot 1;
    ~*pinterestbot 1;
    ~*redditbot 1;
    ~*tumblr 1;
    ~*mastodon 1;
    # Messaging Apps
    ~*slackbot 1;
    ~*discordbot 1;
    ~*telegrambot 1;
    ~*whatsapp 1;
    ~*signal 1;
    ~*viber 1;
    ~*skypeuripreview 1;
    ~*microsoft\ teams 1;
    ~*snapchat 1;
    # Link Preview Services
    ~*embedly 1;
    ~*quora\ link\ preview 1;
    ~*outbrain 1;
    ~*rogerbot 1;
    ~*showyoubot 1;
}

# Headless/automation clients for the analytics shield below. Distinct from
# $is_bot (which routes crawlers to prerendered HTML): these are the
# unfiltered synthetic waves — headless Chrome farms, scraper libraries —
# that fired real Plausible events and inflated visitor counts ~40%
# (audit 2026-07-08 High#7). An empty UA is never a real browser.
map $http_user_agent $is_headless_client {
    default 0;
    "" 1;
    ~*headlesschrome 1;
    ~*phantomjs 1;
    ~*puppeteer 1;
    ~*playwright 1;
    ~*selenium 1;
    ~*electron 1;
    ~*python-requests 1;
    ~*python-httpx 1;
    ~*aiohttp 1;
    ~*go-http-client 1;
    ~*okhttp 1;
    ~*(^|\s)curl/ 1;
    ~*wget/ 1;
}

server {
    listen 8080 default_server;
    server_name _;

    # Origin gate. The verdict and every variable behind it come from
    # app/origin-gate.conf.template, which the entrypoint renders with the
    # secret before nginx starts; this is the whole enforcement side.
    #
    # First in the block, before the trailing-slash rewrite below, so a refused
    # request never gets as far as generating a redirect. Server level, not
    # per-location: `if` at server level runs in the server-rewrite phase, i.e.
    # BEFORE a location is chosen, so one line covers every location this block
    # has and every location a later change adds. `return` is one of the two
    # directives that are safe inside `if` (the `$is_bot` blocks below use the
    # same shape).
    #
    # 421 rather than a direct `return 403`: an `error_page 403` would send the
    # refusal back through the server-rewrite phase, hit this same `if` again
    # and lose the custom page. A distinct internal code also keeps this trick
    # and the crawler's 418 from ever being confused for one another. nginx
    # generates a 421 of its own only for a coalesced HTTP/2 connection with a
    # mismatched authority, which cannot happen here — Cloud Run speaks HTTP/1.1
    # to this container (the port is declared `http1`, not `h2c`).
    error_page 421 = @origin_denied;
    if ($origin_gate_deny) {
        return 421;
    }

    # Use Google DNS for dynamic upstream resolution (prevents startup crash when domain not yet in DNS)
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Declare UTF-8 on text responses. llms.txt and robots.txt contain UTF-8
    # em dashes and arrows but were served as bare `text/plain` — a strict
    # client may decode them as Latin-1 mojibake. Applies to nginx's default
    # charset_types (text/html, text/plain, ...); responses that already
    # declare a charset (the proxied API pages) keep theirs.
    charset utf-8;

    # Root directory for serving files
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (server-level; re-included in locations below that
    # declare their own add_header, since add_header does not merge across
    # levels — see security-headers.conf).
    include /etc/nginx/security-headers.conf;

    # The delivery half of the CSP nonce; the header half and the whole
    # reasoning are in security-headers.conf. Stamp the SAME `$request_id` the
    # policy names onto every `<script` tag of the HTML we serve. A nonce makes
    # 'unsafe-inline' inert, so a tag that misses the stamp is a tag that stops
    # running — and the first one in the shell is the theme resolver.
    #
    # Server level rather than per-location, deliberately: four locations can
    # end up serving index.html — the exact match, the SPA fallback, and in the
    # python server block below two regex routes whose `try_files /index.html
    # =404` serves the file IN PLACE, without the internal redirect that would
    # re-run location matching. A stamp missing from one of those is a blank
    # page on exactly those routes and nowhere else.
    #
    # `<script` cannot match `</script>`, and sub_filter's default type list is
    # text/html alone, so this never reaches into a .js chunk or a JSON body.
    # It does also pass over the proxied crawler pages from @seo_proxy, which
    # carry no executable script of ours — one JSON-LD data block, which no
    # browser executes — and crawlers run no JS either way.
    sub_filter '<script' '<script nonce="$request_id"';
    sub_filter_once off;

    # Compression - serve pre-compressed gzip files from Vite build when available
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    # Serves `<file>.gz` untouched when it exists, which is exactly what
    # sub_filter cannot rewrite. index.html is therefore excluded from
    # precompression in app/vite.config.ts — the nonce depends on it.
    gzip_static on;

    # Vite-fingerprinted assets — filename changes on every build, safe to cache forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Stable-named static assets from /public (favicon.svg, logo.svg, og-image.png, fonts)
    # Short TTL so redeploys propagate within a week; revalidation allowed.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/security-headers.conf;
    }

    # Trailing slashes are not canonical: /box-basic/ and /box-basic are the
    # same page, and only the second appears in the sitemap and in the page's
    # own canonical tag. Left alone, a crawler asking for the slashed form is
    # proxied to the seo-proxy, matches no route there, and FastAPI's
    # redirect_slashes answers with an absolute URL rebuilt from the PROXIED
    # request — leaking the internal host and path as
    # http://api.anyplot.ai/seo-proxy/box-basic, over plain http, to a host
    # whose robots.txt disallows everything. Verified live 2026-08-18: a
    # three-hop chain ending on a crawl-blocked URL, which is how some of the
    # 48 "Redirect error" URLs in Search Console got there.
    #
    # `/` itself cannot match: after `^/` there is nothing left for `/$`.
    #
    # absolute_redirect off is load-bearing, not tidiness. nginx builds the
    # Location of a `permanent` rewrite from $scheme://$host:$server_port, and
    # behind Cloud Run that is http and port 8080 — so the first version of
    # this fix emitted `http://anyplot.ai:8080/box-basic`, trading the
    # api-host leak it removed for an internal-port one. A relative Location
    # is resolved by the client against the URL it actually requested, which
    # is the only value here that is guaranteed correct.
    absolute_redirect off;
    rewrite ^/(.*)/$ /$1 permanent;

    # Disable caching for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # The refusal, as a page rather than nginx's stock one — which would
    # otherwise announce the exact nginx version to anyone knocking on the raw
    # origin. A named location is entered without re-running the server-rewrite
    # phase, so it cannot loop back into the gate, and it is unreachable from
    # outside by construction. `default_type` is what gives a `return` body its
    # content type; the snippet is re-included because this location declares an
    # add_header of its own and would otherwise drop every inherited one.
    #
    # It reports the verdict, never the value — `missing` and `mismatch` are the
    # difference between "this path was never stamped" and "a rotation was only
    # half applied", and telling a caller which of the two it is tells it
    # nothing it did not already know about its own request.
    location @origin_denied {
        default_type text/html;
        add_header X-Origin-Gate $origin_gate_status always;
        include /etc/nginx/security-headers.conf;
        return 403 '<!doctype html><meta charset="utf-8"><title>403 — not the front door</title><h1>403</h1><p>This is the origin of <a href="https://anyplot.ai">anyplot.ai</a>, and it answers only requests that came through the edge.</p>';
    }

    # Named location for bot SEO proxy
    location @seo_proxy {
        set $seo_backend https://api.anyplot.ai;
        proxy_pass $seo_backend/seo-proxy$request_uri;
        proxy_set_header Host api.anyplot.ai;
        # Consumed here, never forwarded — the rule every proxy_pass in this
        # file follows; see location = /js/script.js for what it prevents.
        proxy_set_header X-Origin-Secret "";
        # Without this the upstream sees a plain-http request and any redirect
        # it generates is emitted as http://, downgrading the crawler's next
        # hop. The other proxied locations already set it.
        proxy_set_header X-Forwarded-Proto https;
        # The CRAWLER's address must reach the API: it reports each read to
        # the bot Plausible site with the visitor IP, and Plausible drops
        # events whose forwarded IP is a hosting-provider address. On this
        # hop cf-connecting-ip at the API is this container's Google egress
        # IP, so the crawler is only ever visible in X-Forwarded-For —
        # Cloudflare put it first at the edge; $proxy_add_x_forwarded_for
        # appends our hop instead of replacing the list (kurrentschrift
        # measured 1 counted read in 20 without this, 2026-08-28;
        # api/request_context.py::visitor_ip reads the list leftmost-first).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        # api.anyplot.ai serves a 4-deep Let's Encrypt chain (leaf -> YE1 ->
        # ISRG Root YE cross-sign -> ISRG Root X2); nginx's default verify
        # depth of 1 rejected it (SSL error 20) and every crawler got a 502.
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # Serve robots.txt directly (must not go through bot proxy)
    location = /robots.txt {
        try_files $uri =404;
    }

    # Serve llms.txt directly — its consumers ARE bots, so without this exact
    # match a mapped crawler UA would be proxied to /seo-proxy/llms.txt (404)
    # instead of getting the file.
    location = /llms.txt {
        try_files $uri =404;
    }

    # IndexNow key file (docs/reference/seo.md "IndexNow"). Bing verifies a
    # submission by fetching it with a crawler UA, which the map above would
    # otherwise send to /seo-proxy/<key>.txt and a 404. Same key as
    # .github/workflows/indexnow-submit.yml; rotate both together.
    location = /anyplot-indexnow-ab738f04ea92446a.txt {
        try_files $uri =404;
    }

    # llms.txt has no registered .well-known name, but agents guess this path
    # (docs/reference/seo.md "Discoverability") — answer with the file's
    # canonical location instead of the SPA shell, which soft-404'd it with
    # 200 + the home page until 2026-08-28.
    location = /.well-known/llms.txt {
        return 302 /llms.txt;
    }

    # llms-full.txt is generated from the DB (one line per spec), so unlike
    # llms.txt it cannot be a static file — proxy it to the API's
    # /llms-full.txt endpoint for EVERY client, mapped crawler UA or not.
    # Before this, the URL was a soft-404: the SPA catch-all answered it with
    # 200 + the homepage shell (AI-access audit 2026-08-19).
    location = /llms-full.txt {
        set $seo_backend https://api.anyplot.ai;
        proxy_pass $seo_backend/llms-full.txt;
        proxy_set_header Host api.anyplot.ai;
        # Consumed here, never forwarded — see location = /js/script.js.
        proxy_set_header X-Origin-Secret "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        # Same 4-deep chain as @seo_proxy above — default depth 1 breaks it.
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # SPA routing - serve index.html for all routes
    # Social media bots get redirected to backend for proper og:tags
    location / {
        # Redirect bots to SEO proxy via error_page trick (nginx-safe pattern)
        error_page 418 = @seo_proxy;
        if ($is_bot) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Cloud Run — and the origin gate's measuring
    # instrument, the counterpart of the API's `GET /health`. It is the one path
    # the gate exempts, so it answers on every route into this container
    # whatever the gate is doing, and `X-Origin-Gate` reports the verdict for
    # the request it was asked with (never the value). Ask it through the edge,
    # through each hostname and on the raw `run.app` URL, and the rollout stops
    # being a leap: arm only once every path that must keep working answers
    # `off-seen`. `no-store` because a verdict cached at the edge is a lie about
    # the next request.
    location /_health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
        add_header X-Origin-Gate $origin_gate_status always;
        add_header Cache-Control "no-store" always;
        # This location's own add_header drops every inherited one, which is
        # the rule the top of security-headers.conf states and the one place in
        # this file that had missed it (found by tests/unit/api/test_csp_policy.py).
        include /etc/nginx/security-headers.conf;
    }

    # Proxy sitemap.xml to backend API (dynamic generation)
    location = /sitemap.xml {
        set $sitemap_backend https://api.anyplot.ai;
        proxy_pass $sitemap_backend/sitemap.xml;
        proxy_set_header Host api.anyplot.ai;
        # Same rule as the Plausible hops: consumed here, never forwarded. This
        # one goes to our own API, so the value would not have leaked — but the
        # hop leaves this container over the public internet and re-enters
        # through the edge, which stamps the header for that host itself. One
        # rule for every proxy_pass is a rule that survives a new location.
        proxy_set_header X-Origin-Secret "";
        proxy_ssl_server_name on;
    }

    # Plausible Analytics Proxy (bypass ad blockers)
    location = /js/script.js {
        proxy_pass https://plausible.io/js/pa-VsZKkJS49nA8_SUzShW2z.js;
        proxy_set_header Host plausible.io;
        # THIRD PARTY. nginx forwards incoming request headers to an upstream by
        # default, so once the edge stamps X-Origin-Secret on this host, every
        # proxied script fetch would hand the shared secret to plausible.io —
        # and with it the API's gate, since both services take the same value
        # (Copilot review). An empty value means nginx sends no such header at
        # all. The rule for this file is that the gate header is CONSUMED here
        # and never forwarded, so every proxy_pass in both server blocks clears
        # it and a test refuses one that does not.
        proxy_set_header X-Origin-Secret "";
        proxy_ssl_server_name on;
        proxy_buffering on;
    }

    location = /api/event {
        # Analytics shield: crawler and headless/automation UAs never reach
        # Plausible — they inflated visitors ~40% and broke trend lines
        # (audit 2026-07-08 High#7). 202 mirrors Plausible's accepted
        # response so clients don't retry.
        if ($is_bot) { return 202; }
        if ($is_headless_client) { return 202; }
        # The gate's second measuring point, and the only one that can see the
        # apex Worker. `anyplot.ai/api/event` is the ONE path that Worker
        # (infra/cloudflare/anyplot-api-proxy.js) sends to this container —
        # everything else under /api/* goes to the API host — and a Worker
        # subrequest to a host in the same zone skips that zone's Transform
        # Rules, so there the header can only come from the Worker's own
        # binding. Arming without having checked it would answer every Plausible
        # pageview on the site with a 403, quietly. A mapped crawler UA gets the
        # 202 above, so the probe costs no analytics event.
        #
        # Both server blocks carry it, though only the apex has that Worker
        # route: a divergence between two copies of one location is how the copy
        # nobody looks at rots.
        add_header X-Origin-Gate $origin_gate_status always;
        include /etc/nginx/security-headers.conf;
        proxy_pass https://plausible.io/api/event;
        proxy_set_header Host plausible.io;
        # Third party, same rule as /js/script.js above: the gate header is
        # consumed by this server and never forwarded.
        proxy_set_header X-Origin-Secret "";
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# python.anyplot.ai — language-filtered marketing subdomain.
#
# Strategy: serve identical content to anyplot.ai. The canonical tag always
# points back to the main-domain hub (anyplot.ai/{spec_id}) so Google
# consolidates link equity on a single URL while the subdomain stays available
# for marketing campaigns.
#
# Bot path (SEO crawlers): nginx proxies the hub to /seo-proxy/{spec} (no
# language segment — the language-filtered hub is /{spec}?language=python on
# the main domain, with the same canonical as the unfiltered hub). Library
# detail URLs keep the /python segment because those are content-unique.
#
# Human path: serves index.html for any spec route. The SPA may detect
# `window.location.hostname === 'python.anyplot.ai'` and append
# `?language=python` on spec routes so the grid renders filtered without
# changing the canonical.
server {
    listen 8080;
    server_name python.anyplot.ai;

    # Origin gate, same shape and same reasoning as the main block above.
    # Gated even though this hostname has neither a DNS record nor a Cloud Run
    # domain mapping today (checked 2026-09-04), so nothing currently reaches
    # this block at all: a gate that covers "every server block" is a rule
    # someone can keep, while "every server block that is live" is a question
    # nobody re-asks on the day the subdomain is switched on. Whoever switches
    # it on adds the hostname to the Cloudflare Transform Rule in the same
    # breath — the checklist is in infra/cloudflare/README.md.
    error_page 421 = @origin_denied;
    if ($origin_gate_deny) {
        return 421;
    }

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Same UTF-8 declaration as the main block (llms.txt/robots.txt are
    # served from this block too).
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (same include-per-add_header-location rule as the
    # main server block above).
    include /etc/nginx/security-headers.conf;

    # CSP nonce, same as the main server block — and this block is the reason
    # it sits at server level: the two spec-route regex locations below serve
    # `/index.html` through `try_files` as a FILE, so they never reach the
    # `location = /index.html` block and would carry no stamp at all.
    sub_filter '<script' '<script nonce="$request_id"';
    sub_filter_once off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    gzip_static on;

    # Vite-fingerprinted assets — filename changes on every build, safe to cache forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Stable-named static assets from /public (favicon.svg, logo.svg, og-image.png, fonts)
    # Short TTL so redeploys propagate within a week; revalidation allowed.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/security-headers.conf;
    }

    # The refusal page, same as the main block — a named location belongs to one
    # server block, so it has to exist in both or `error_page 421` here points
    # at nothing.
    location @origin_denied {
        default_type text/html;
        add_header X-Origin-Gate $origin_gate_status always;
        include /etc/nginx/security-headers.conf;
        return 403 '<!doctype html><meta charset="utf-8"><title>403 — not the front door</title><h1>403</h1><p>This is the origin of <a href="https://anyplot.ai">anyplot.ai</a>, and it answers only requests that came through the edge.</p>';
    }

    # Bot SEO proxy — proxy to backend.
    # /scatter-basic              -> /seo-proxy/scatter-basic            (hub, no language segment)
    # /scatter-basic/matplotlib   -> /seo-proxy/scatter-basic/python/matplotlib (detail, language in path)
    location @seo_proxy_python {
        set $seo_backend https://api.anyplot.ai;
        proxy_pass $seo_backend$python_seo_uri;
        proxy_set_header Host api.anyplot.ai;
        # Consumed here, never forwarded — see location = /js/script.js.
        proxy_set_header X-Origin-Secret "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        # Same 4-deep chain as @seo_proxy above — default depth 1 breaks it.
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Unlike the main server block this is not strictly required (this block's
    # `location /` fallback has no bot proxy and the spec-route regexes don't
    # match dotted paths) — kept as an explicit exact match so llms.txt serving
    # stays guaranteed even if a bot catch-all is added here later.
    location = /llms.txt {
        try_files $uri =404;
    }

    # Reserved/static frontend routes are served directly without rewrite
    location ~ ^/(plots|specs|libraries|palette|about|legal|mcp|stats|debug)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    # /:specId -> hub on main domain (no language segment; canonical is /{spec_id})
    #
    # `try_files /index.html =404` serves the shell as a FILE, in THIS location —
    # no internal redirect, so `location = /index.html` and its headers are never
    # reached. That is why the two routes below repeat the shell's Cache-Control
    # instead of inheriting it: the shell now carries a per-request CSP nonce, and
    # a stored copy would pair an old `nonce="…"` in the body with a fresh one in
    # the header. Measured before the fix: these two routes answered with no
    # Cache-Control at all while anyplot.ai/<spec> answered `no-store`.
    location ~ "^/(?<spec_id>[A-Za-z0-9][A-Za-z0-9-]*)/?$" {
        set $python_seo_uri /seo-proxy/$spec_id;
        error_page 418 = @seo_proxy_python;
        if ($is_bot) { return 418; }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }

    # /:specId/:library -> detail on main domain (language stays in path)
    location ~ "^/(?<spec_id>[A-Za-z0-9][A-Za-z0-9-]*)/(?<library>[A-Za-z0-9][A-Za-z0-9-]*)/?$" {
        set $python_seo_uri /seo-proxy/$spec_id/python/$library;
        error_page 418 = @seo_proxy_python;
        if ($is_bot) { return 418; }
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same as the main block, gate verdict included: this hostname would be
    # measured through its own edge route, so it needs its own instrument.
    location /_health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
        add_header X-Origin-Gate $origin_gate_status always;
        add_header Cache-Control "no-store" always;
        # Same as the main block: an own add_header drops the inherited ones.
        include /etc/nginx/security-headers.conf;
    }

    location = /sitemap.xml {
        set $sitemap_backend https://api.anyplot.ai;
        proxy_pass $sitemap_backend/sitemap.xml;
        proxy_set_header Host api.anyplot.ai;
        # Same rule as the Plausible hops: consumed here, never forwarded. This
        # one goes to our own API, so the value would not have leaked — but the
        # hop leaves this container over the public internet and re-enters
        # through the edge, which stamps the header for that host itself. One
        # rule for every proxy_pass is a rule that survives a new location.
        proxy_set_header X-Origin-Secret "";
        proxy_ssl_server_name on;
    }

    location = /js/script.js {
        proxy_pass https://plausible.io/js/pa-VsZKkJS49nA8_SUzShW2z.js;
        proxy_set_header Host plausible.io;
        # THIRD PARTY. nginx forwards incoming request headers to an upstream by
        # default, so once the edge stamps X-Origin-Secret on this host, every
        # proxied script fetch would hand the shared secret to plausible.io —
        # and with it the API's gate, since both services take the same value
        # (Copilot review). An empty value means nginx sends no such header at
        # all. The rule for this file is that the gate header is CONSUMED here
        # and never forwarded, so every proxy_pass in both server blocks clears
        # it and a test refuses one that does not.
        proxy_set_header X-Origin-Secret "";
        proxy_ssl_server_name on;
        proxy_buffering on;
    }

    location = /api/event {
        # Analytics shield: crawler and headless/automation UAs never reach
        # Plausible — they inflated visitors ~40% and broke trend lines
        # (audit 2026-07-08 High#7). 202 mirrors Plausible's accepted
        # response so clients don't retry.
        if ($is_bot) { return 202; }
        if ($is_headless_client) { return 202; }
        # The gate's second measuring point, and the only one that can see the
        # apex Worker. `anyplot.ai/api/event` is the ONE path that Worker
        # (infra/cloudflare/anyplot-api-proxy.js) sends to this container —
        # everything else under /api/* goes to the API host — and a Worker
        # subrequest to a host in the same zone skips that zone's Transform
        # Rules, so there the header can only come from the Worker's own
        # binding. Arming without having checked it would answer every Plausible
        # pageview on the site with a 403, quietly. A mapped crawler UA gets the
        # 202 above, so the probe costs no analytics event.
        #
        # Both server blocks carry it, though only the apex has that Worker
        # route: a divergence between two copies of one location is how the copy
        # nobody looks at rots.
        add_header X-Origin-Gate $origin_gate_status always;
        include /etc/nginx/security-headers.conf;
        proxy_pass https://plausible.io/api/event;
        proxy_set_header Host plausible.io;
        # Third party, same rule as /js/script.js above: the gate header is
        # consumed by this server and never forwarded.
        proxy_set_header X-Origin-Secret "";
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
