review:
  strengths:
  - The finder L, the alternating clock edges and the 2-module quiet zone follow the
    Data Matrix layout and stay in step with the module grid in both renders
  - coord_fixed(ratio = 1) with geom_tile on a tidy expand.grid frame keeps every
    module square and the same size
  - Module colors are constants while only the chrome follows the theme, so the dark
    render shows the symbol on its own white quiet-zone tile
  weaknesses:
  - 'DQ-01 (both): the data region is sample(0:1) noise, so the symbol does not carry
    the content ''MED-DEVICE:SN-2024-08751'' that the subtitle says it encodes → encode
    the content into the modules (ECC 200 codewords placed in the data region), or
    state no content the modules do not carry. Likely cause: mat[2:(N - 1), 2:(N -
    1)] <- sample(0:1, ...).'
  - 'DQ-03 (both): the subtitle pairs a 24-character content with a 16x16 ECC 200
    symbol, which holds 12 data codewords (about 12 ASCII characters), so the stated
    size cannot hold the stated content → a size whose capacity fits the content (e.g.
    20x20 or 22x22), or a shorter content for 16x16. Likely cause: N <- 16L fixed
    independently of the content string.'
  - 'Suggestion: tighten the gap between the subtitle and the symbol so the composition
    sits more evenly on the square canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title "datamatrix-basic · r · ggplot2 · anyplot.ai" in near-black ink and a grey subtitle 'Content: "MED-DEVICE:SN-2024-08751" | 16x16 | ECC 200', both centred and readable. No axes, ticks, grid or legend (theme_void).
      Data: a 16x16 symbol of near-black #1A1A17 square modules on #FAF8F1. Solid finder L down the left column and along the bottom row meeting in the lower-left corner; alternating clock modules along the top row (dark at the left) and the right column (light at the top, dark at the bottom), in step with the grid; noise-like data region; a 2-module quiet zone that merges with the page.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title in light #F0EFE8 and subtitle in #B8B7B0, both readable; no dark-on-dark text.
      Data: module colors identical to the light render; the 2-module quiet zone shows as an off-white tile around the symbol, so the code reads black on white on the dark page.
      Legibility verdict: PASS
