review:
  strengths:
  - Exact 2400x2400 square canvas with fig.subplots_adjust instead of a tight bbox
  - 'Quiet zone and modules are pure #FFFFFF/#000000 in both themes while the page
    and chrome follow the theme tokens, so the symbol keeps scanner contrast on the
    dark page'
  - Finder and clock built with numpy slice assignments; size parsed from the data
    frame
  weaknesses:
  - 'SC-02 (both): the top-left module is white, so the left solid finder edge stops
    one module short of the top and the top clock row starts with white → the top-left
    corner module black, the left edge solid over all 10 rows, the top row alternating
    from black at the left. Likely cause: grid[0, :] = np.arange(n_cols) % 2 runs
    after grid[:, 0] = 1 and overwrites grid[0, 0] with 0.'
  - 'DQ-03 (both): the caption claims ''ANYPLOT'' (7 characters) in a 10x10 ECC 200
    symbol, which holds only 3 data codewords (3 ASCII characters) → a size that fits
    the content (14x14 holds 8 codewords) or a content of at most 3 characters for
    10x10. Likely cause: size ''10x10'' set independently of the content string.'
  - 'Suggestion: derive the data region from the content (or label it as a fixed example
    pattern) so the caption does not claim an encoding the modules do not carry.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; a pure-white square tile (axes) carries the symbol with a one-module white quiet zone on every side
      Chrome: title "datamatrix-basic · python · seaborn · anyplot.ai" in dark ink at top centre; caption "Encoded: 'ANYPLOT' · ISO/IEC 16022 ECC 200 · 10×10" in soft dark grey below; both readable; no ticks, spines or grid
      Data: 10x10 black/white modules; solid left column (rows 2-10) and solid bottom row form the L finder; top row alternates starting white at the left, right column alternates; 8x8 data region looks like noise; top-left corner module is white
      Legibility verdict: PASS

    Dark render (plot-dark.png):
