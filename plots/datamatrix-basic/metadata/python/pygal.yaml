review:
  strengths:
  - Complete ECC 200 codeword pipeline written out (ASCII encoding, padding, GF(256)
    Reed-Solomon) since no barcode package is installed
  - 'Theme handling correct in both renders: page and text tokens flip, the symbol
    stays black on a light tile for scan contrast'
  - 'Real, neutral context: an NDC drug code with a human-readable caption and symbol
    size line'
  - Clean quiet zone of two modules on all sides, free of text
  weaknesses:
  - 'SC-02 (both): the L finder''s bottom row stops one module short of the bottom-right
    corner, and the top clock row ends in two adjacent black modules at the top-right,
    so C1 and C2 break at the right edge → solid bottom row through the corner and
    a right clock column phased so the bottom-right module is black and the top-right
    white. Likely cause: matrix[:, cols-1] = np.arange(rows) % 2 == 0 overwrites the
    corner modules with the wrong phase after the finder row is set.'
  - 'SC-03 (code): codeword bits are written row by row into the interior (module_num
    // data_cols, module_num % data_cols) although the comment says ''column-major
    diagonal''; the ECC 200 placement (diagonal 8-module ''utah'' shapes with the
    corner cases) is not applied, so module positions do not follow the symbology
    and the symbol does not decode → implement the ISO/IEC 16022 placement algorithm.
    Likely cause: the placement loop in generate_datamatrix.'
  - 'VQ-03 (both): faint lighter seams are visible between adjacent black modules
    (finder column, bottom row, dense blocks), so the finder does not read as one
    solid edge → seamless modules, e.g. draw runs of modules as one rect or snap cell_size
    and offsets to whole pixels / set shape-rendering=crispEdges. Likely cause: fractional
    cell_size with anti-aliased per-module rects.'
  - 'CQ-01 (code): three helper functions (gf_mul, rs_encode, generate_datamatrix)
    and a Graph subclass break the Imports → Data → Plot → Save structure → inline
    the encoding steps at module level and keep only the minimal subclass pygal needs
    for custom drawing. Likely cause: helper-function decomposition.'
  - 'Suggestion: the gap between title and tile (~350 px) is larger than the space
    below the captions; nudging the tile up would balance the column.'
  image_description: |-
