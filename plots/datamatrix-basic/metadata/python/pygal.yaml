  strengths:
  - 'Complete ECC 200 pipeline at module level: ASCII codewords, ISO pseudo-random
    padding, GF(256) Reed-Solomon with roots alpha^1..alpha^n, and the ISO/IEC 16022
    Annex F placement with its corner cases'
  - 'Finder and clock exactly as the symbology defines them: solid left column and
    bottom row meeting in the lower-left, top row and right column alternating with
    the top-right white and bottom-right black'
  - 'Seamless crisp modules: whole-pixel cell size, all dark modules in one SVG path,
    shape-rendering crispEdges'
  - 'Theme handling correct in both renders: page and text tokens flip, the symbol
    stays black on a light tile for scan contrast'
  - Caption derived from the symbol itself (matrix size and EC codeword count), outside
    the quiet zone
  weaknesses:
  - 'CQ-01 (code): line 206 `class DataMatrixChart(Graph)` holds the whole drawing
    (tile, module path, captions) in `_plot()` and `_compute()` → draw at the top
    level without a class, e.g. render a plain pygal chart for title and background,
    then append the tile, the module path and the captions to `chart.render_tree()`
    (or the SVG string) and convert with cairosvg. Likely cause: Graph subclass used
    as the drawing hook.'
  - 'Suggestion: the gap between the title and the tile (~370 px) is larger than the
    space below the captions; moving the tile up would balance the column.'
