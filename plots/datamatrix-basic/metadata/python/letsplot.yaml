review:
  strengths:
  - Square canvas painted edge to edge in the page color through gggrid, with the
    symbol framed by a one-module white quiet zone
  - theme_void + coord_fixed keeps modules square and removes all non-symbol chrome,
    as the spec permits
  - layer_tooltips() exposes each module's structural region and the encoded content
    in the HTML output
  - Deterministic data region seeded from the content with numpy's Generator API
  weaknesses:
  - 'SC-02 (both): the clock pattern is out of phase: the top row ends with two black
    modules (columns 12 and 13) and the bottom-right corner of the finder row is white,
    so the bottom finder edge stops one module short → the right column alternates
    white at the top and black at the bottom, joining the solid bottom row. Likely
    cause: matrix[:, -1] = clock, indexed from the top row, overwrites the corners;
    index the right column from the bottom (clock[::-1]).'
  - 'DQ-03 (both): a 14x14 ECC 200 symbol holds 8 data codewords, but ''MED-SN:A7B2C9D1''
    needs about 15 → an 18x18 symbol (+4 modules per side) or content of at most about
    6 characters. Likely cause: SIZE = 14 fixed independently of CONTENT.'
  - 'Suggestion: encode the content for real with pylibdmtx, which the spec recommends,
    so the module pattern follows the symbology.'
