review:
  strengths:
  - Finder, clock and quiet zone are built with numpy slicing (grid[:, 0], grid[-1,
    :], np.pad) and land on the correct edges of the ISO/IEC 16022 layout
  - Ordinal band scales with paddingInner=0 and paddingOuter=0 make the modules touch
    with no seams, so the symbol reads as a clean grid
  - The side padding is widened by the title band height so the white symbol tile
    stays square inside the 2400x2400 canvas
  - The data modules are seeded deterministically from the content bytes, so a different
    CONTENT gives a different, reproducible pattern
  weaknesses:
  - 'Suggestion: encode CONTENT with an available encoder (pylibdmtx or treepoem,
    as the Notes recommend) so the data region is a scannable ECC 200 symbol rather
    than seeded bits'
  - 'Suggestion: an Altair tooltip naming each module''s row and column would add
    value in the HTML view without changing the PNG'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page with a pure white tile holding the symbol and its quiet zone, correct.
