      Data: 16x16 black-on-white modules. Solid finder on the left column and bottom row meeting at the lower left. Clock alternates along the top (black at left) and right edge (white at top, black at the lower right). Noise-like data region. One-module white quiet zone on all sides. No axes, grid or legend.
