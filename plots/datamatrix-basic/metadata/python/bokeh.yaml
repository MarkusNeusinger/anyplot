review:
  strengths:
  - L-shaped finder on left and bottom and clock pattern on top and right are in step
    with the 16x16 grid
  - Correct ECC 200 size selection with digit-pair compaction and Reed-Solomon codewords
  - HoverTool bound to the module renderer exposes module type, row and column in
    the HTML
  weaknesses:
  - 'SC-01 (both): translucent tints over the finder (blue), clock (violet) and data
    region (green) add highlighted regions the -basic spec excludes → remove the three
    overlay rect groups. Likely cause: the ''Structural zone overlays'' p.rect calls.'
  - 'SC-02 (both): ''L-finder'', ''Timing'' and ''Data'' callout labels sit inside
    the quiet zone, which must be blank → remove them. Likely cause: the zone-label
    Label loop.'
  - 'SC-02 (dark): the code is inverted to light modules on a dark green-black field
    instead of black on white → draw black modules on a light tile in both themes.
    Likely cause: modules filled with INK, which flips to #F0EFE8 in the dark theme.'
  - 'SC-02 (both): modules drawn at 95 % of their cell leave visible gaps, so the
    L finder is a row of separate squares instead of two solid edges → full-cell modules
    (width=1, height=1). Likely cause: p.rect(width=0.95, height=0.95).'
  - 'SC-03 (code): data bits are written row by row and every pad is randomised, so
    module positions do not follow ECC 200 and the symbol will not decode → ECC 200
    diagonal placement (ISO/IEC 16022 Annex F) and a plain first pad of 129. Likely
    cause: the row-by-row placement loop and the pad loop.'
  - 'Suggestion: the callout labels at 18pt read small beside the 50pt title.'
  - 'Suggestion: the overlay hues do not follow Imprint''s canonical order.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'datamatrix-basic · python · bokeh · anyplot.ai' centred in dark ink; subtitle 'Content: "SERIAL:12345678"' at the bottom in INK_SOFT; small boxed callouts 'Timing' (violet, above the symbol), 'L-finder' (blue, rotated, left) and 'Data' (green, rotated, right) in the quiet zone. No axes or grid. All text readable.
      Data: 16x16 Data Matrix of near-black modules drawn at 95 % of their cell, leaving thin gaps; the data region is tinted mint green, the top row and right column violet, the corner a stronger violet. Finder solid left and bottom, clock alternating top and right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and subtitle in light ink, readable; the same colored callouts, readable; no dark-on-dark text.
      Data: polarity inverted: modules are light #F0EFE8 on a dark green-black data region and dark violet clock tints, so the symbol reads as white on black; same 95 % gaps between modules.
      Legibility verdict: PASS
