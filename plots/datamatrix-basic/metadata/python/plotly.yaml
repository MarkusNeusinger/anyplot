review:
  strengths:
  - 'Clean single symbol: sharp, gap-free square modules on a regular grid with a
    solid bottom finder and an alternating clock pattern on the top and right edges'
  - Square modules guaranteed by scaleanchor/constrain on a square 2400x2400 canvas
    with a generous quiet zone
  - Plotly-native hover via customdata + hovertemplate labels each module as Finder,
    Timing or Data in the HTML view
  weaknesses:
  - 'SC-02 (dark): the symbol is inverted, light #F0EFE8 modules on the #1A1A17 page,
    so the finder and clock pattern are light and the quiet zone is dark, against
    the spec''s black-on-white modules and white quiet zone → black modules on a white
    tile with a quiet-zone margin in both themes (a white tile behind the symbol in
    dark is permitted). Likely cause: CELL_ON/CELL_OFF switch per theme and CELL_OFF
    = PAGE_BG.'
  - 'SC-02 (both): the top-left module of the left finder column is white, so the
    L finder is broken at its top end → that module black, with the top clock row
    starting black at column 0. Likely cause: the top-row loop matrix[0, i] = i %
    2 overwrites matrix[0, 0] after the finder is set.'
  - 'DQ-03 (code): the data region is random noise from np.random.seed(sum of the
    characters) and does not encode ''SERIAL:12345678'' with ECC 200, so the symbol
    does not decode to its content → generate the modules from the content with an
    ECC 200 encoder (the spec recommends pylibdmtx or treepoem). Likely cause: the
    simulated-data loop.'
  - 'CQ-04 (code): element-by-element loops fill the timing row/column and the 14x14
    data region (the two timing loops and the nested randint loop) → matrix[0, :]
    = np.arange(n) % 2 style slicing and one np.random.randint(0, 2, size=(n-2, n-2))
    call (or the encoder). Likely cause: scalar-loop construction.'
  - 'Suggestion: a visible white tile behind the symbol in the dark theme would read
    as a printed label, which the spec permits.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: centered title 'datamatrix-basic · python · plotly · anyplot.ai' in dark ink, clearly readable; no axes, ticks or legend (spec permission).
      Data: a 16x16 Data Matrix of near-black square modules on the off-white page, sharp edges, no gaps. Solid finder along the bottom row and left column, except the top-left module, which is white; alternating clock pattern along the top row and right column; noise-like data region; blank page margin as quiet zone, about 3 modules wide.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title in light ink #F0EFE8, clearly readable; no dark-on-dark text.
      Data: the same module pattern with the roles inverted: light #F0EFE8 modules on the near-black page, so the finder and clock pattern are light and the quiet zone is dark instead of a white tile with black modules.
      Legibility verdict: PASS (chrome); the symbol's inversion is a spec defect, not a legibility failure
