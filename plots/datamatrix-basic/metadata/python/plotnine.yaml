review:
  strengths:
  - 'The L-shaped finder is unbroken: the left column is solid from the top-left to
    the bottom-left module and the bottom row is solid to the bottom-right corner'
  - The right clock edge alternates in step with the rows and ends in the black finder
    corner
  - Square modules via geom_tile + coord_fixed, black on white in both themes, with
    a 2-module quiet zone
  - Chrome threads the INK / INK_SOFT theme tokens, so title, subtitle and caption
    read in both themes
  - Compact vectorised matrix construction (slice assignment, np.unpackbits, np.pad,
    np.indices) and column constants in aes()
  weaknesses:
  - 'SC-02 (both): the top clock edge is out of phase: columns 0 and 1 are both black
    at the top-left and columns 10 and 11 both white at the top-right, so the alternation
    breaks at both ends (C2) → column 1 white, then strict alternation ending white
    in column 11. Likely cause: line 47 `matrix[0, :] = np.arange(SIZE) % 2` starts
    the clock at 0 instead of `1 - np.arange(SIZE) % 2`.'
  - 'DQ-03 (both): the subtitle calls the symbol "12×12 ECC 200 symbol", but the data
    region is the payload''s raw ASCII bits followed by random pad bits, with no ECC
    200 codewords, Reed-Solomon blocks or module placement, so the drawn symbol does
    not decode to PT-0482-7316 → encode real ECC 200 codewords into the data region,
    or drop the ECC 200 claim from the subtitle. Likely cause: lines 53-56 fill the
    data region with `np.unpackbits` + `rng.integers`.'
  - 'Suggestion: placing the caption inside the canvas margin a little higher would
    give it the same breathing room as the subtitle.'
