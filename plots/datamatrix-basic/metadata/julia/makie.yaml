review:
  strengths:
  - 'Correctly implements the ISO/IEC 16022 structural conventions: solid L-shaped
    finder pattern on the left column + bottom row, and alternating clock/timing track
    on the top row + right column, matching the spec''s mandatory requirements'
  - 'Documents and applies an explicit, well-reasoned exception to the theme-adaptive
    chrome rule: the barcode itself stays fixed black-on-white (DM_BG/DM_INK) across
    themes because a printed Data Matrix must stay scanner-legible under any lighting,
    while all surrounding chrome (title, caption, page background) correctly follows
    the Imprint theme tokens'
  - 'Both renders are theme-correct: warm off-white page background in light, warm
    near-black in dark, with title/caption text using INK/INK_SOFT and remaining fully
    legible in both themes'
  - Visible quiet zone (3-module border) around the matrix, satisfying the spec's
    minimum quiet-zone requirement
  - Clean KISS structure with `Random.seed!(42)` for reproducibility, dynamic title-fontsize
    scaling formula to keep the long mandated title well-proportioned, and a descriptive
    caption that reports the encoded content, module count, and the applicable standard
  - Realistic, neutral use case (pharmaceutical serialization) drawn directly from
    the spec's own Applications list
  weaknesses:
  - No visual differentiation between the finder pattern, clock track, and data region
    — all modules render as uniform black, so a reader can only learn the ISO/IEC
    16022 structure by reading the caption text rather than seeing it in the image.
    Consider a subtle secondary-color outline or annotation marking the L-shaped finder
    border and the clock track to visually teach the structure (would raise Data Storytelling
    and Distinctive Features).
  - Library usage is a fairly generic `heatmap!` call — leverage a more distinctive
    Makie feature (e.g. `poly!` for crisp per-module cell borders, or `text!` annotations
    calling out the finder/clock zones) to make stronger use of Makie's layered plotting
    model.
  - Data region fill is uniform random noise with no semantic pattern, which is an
    honest and reasonable simplification (documented in a comment) since real ECC200
    encoding is out of scope, but a slightly more structured fill (e.g. reflecting
    some real byte-like clustering) would sell the illustration a bit more convincingly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Pharmaceutical Serialization · datamatrix-basic · julia · makie · anyplot.ai" in bold dark ink at top, clearly readable and not clipped; caption below the matrix ("Encodes "RX-88451-2024-A7" · 20×20 modules + quiet zone · ISO/IEC 16022 finder + clock track") in a softer dark gray, fully legible.
      Data: The Data Matrix itself renders on a near-white card (#FFFDF6-ish) with black modules — high contrast black-on-white as the spec mandates. A solid black column runs down the left edge and a solid black row along the bottom edge (the L-shaped finder pattern); the top row and right column show alternating black/white modules (the clock/timing track); the interior is a dense random black/white fill (the data region). A visible quiet zone (light border) surrounds the whole matrix before the card edge.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and caption both render in light ink (INK / INK_SOFT tokens), clearly visible against the dark page background — no dark-on-dark failures observed.
      Data: The Data Matrix card and its black/white modules are pixel-identical to the light render (fixed DM_BG/DM_INK, intentionally not theme-adaptive since a printed barcode must stay black-on-white for scanner contrast regardless of ambient theme) — same finder pattern, clock track, and data-region layout.
      Legibility verdict: PASS — all title/caption text is clearly readable against the dark background; no dark-on-dark text found.
