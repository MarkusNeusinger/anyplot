review:
  strengths:
  - 'Dark-mode quiet zone fixed exactly as the attempt-1 review requested: DM_BG now
    uses t.elevatedBg instead of t.pageBg, verified pixel-level as visibly distinct
    from the page background in both themes (dark: bg #1A1A17 vs quiet-zone #242420;
    light: bg #FAF8F1 vs quiet-zone #FFFDF6)'
  - 'Structurally credible ECC 200 Data Matrix: solid L-shaped finder pattern on the
    entire left column and bottom row, alternating timing pattern on row 0 and the
    last column, shared corners correctly resolved per ISO/IEC 16022 conventions rather
    than a generic checkerboard placeholder'
  - 3-module quiet zone exceeds the spec's 'at least 1 module' minimum for reliable
    scanning
  - 'Perfect theme adaptation: MODULE_COLOR = t.ink and transparent chart background
    so t.pageBg shows through — modules and text correctly flip contrast between renders
    with pixel-identical structure'
  - High-contrast black-on-white/white-on-black rendering matches the spec's explicit
    'high contrast black on white' requirement
  - 'Idiomatic use of the Highcharts SVG renderer (chart.renderer.rect with shape-rendering:
    crispEdges) for pixel-perfect module edges'
  - Descriptive subtitle communicates encoded content, module count, and ECC level
  - Square canvas (2400x2400) is the correct orientation for this symmetric visualization
  - Clean, fully deterministic, hardcoded matrix — trivially reproducible
  weaknesses:
  - Matrix is hardcoded rather than generated by a Data Matrix encoding library, so
    scannability cannot be mechanically verified in review — acceptable given the
    SVG-renderer approach, but flagging for awareness
  - Design Excellence still has limited headroom given the inherently minimal binary-barcode
    format; the optional annotation/caption suggested in attempt 1 (pointing at the
    finder or timing pattern) was not pursued, leaving DE-03 storytelling capped by
    the subtitle text alone
