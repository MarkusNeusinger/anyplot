review:
  strengths:
  - 'Structurally credible ECC 200 Data Matrix: solid L-shaped finder pattern verified
    on the entire left column and bottom row, alternating timing pattern on row 0
    and the last column, with the shared corners correctly resolved to the finder
    value — matches ISO/IEC 16022 conventions rather than a generic checkerboard placeholder'
  - 3-module quiet zone correctly implemented (exceeds the spec's 'at least 1 module'
    minimum) for reliable scanning
  - 'Perfect theme adaptation: MODULE_COLOR = t.ink and chart background transparent
    so t.pageBg shows through — modules and text correctly flip contrast between light
    and dark renders with identical structural data'
  - High-contrast black-on-white/white-on-black rendering matches the spec's explicit
    'Use high contrast black on white for maximum readability' requirement
  - 'Idiomatic use of the Highcharts SVG renderer (chart.renderer.rect with shape-rendering:
    crispEdges) for pixel-perfect module edges — an elegant, library-specific technique
    for a non-standard chart type'
  - Descriptive subtitle communicates encoded content, module count, and ECC level
    — useful metadata beyond a bare-minimum title
  - Square canvas (2400×2400) is the correct orientation choice for this symmetric
    visualization
  - Clean, fully deterministic, hardcoded matrix with no external randomness — trivially
    reproducible
  weaknesses:
  - 'Dark-mode quiet zone uses DM_BG = t.pageBg (#1A1A17), identical to the page background,
    so the quiet-zone rectangle is invisible in the dark render and the matrix appears
    to float without a defined boundary — same issue previously flagged on qrcode-basic/highcharts;
    consider t.elevatedBg (#242420) for a subtle, theme-consistent boundary in dark
    mode (and its light equivalent t.elevatedBg #FFFDF6 for parity) so the quiet zone
    reads as a distinct region in both themes'
  - Matrix is hardcoded rather than generated by a Data Matrix encoding library, so
    scannability cannot be mechanically verified in review — acceptable per the library's
    SVG-renderer approach, but any future scan-based validation could flag a mismatch
  - Design Excellence is capped by the inherent minimalism of a binary barcode format
    — there is limited headroom for additional visual hierarchy or storytelling beyond
    the current subtitle; consider a small caption/annotation calling out the finder
    pattern or ECC level region if the repair loop wants to push Design Excellence
    higher
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — correct for light theme, not pure white.
      Chrome: Title "datamatrix-basic · javascript · highcharts · anyplot.ai" in bold dark ink (t.ink) at top-center, clearly legible; subtitle "Encodes: SERIAL:12345678 | 16×16 modules · ECC 200" in muted ink (t.inkSoft) below it, also readable.
      Data: A 16×16-module Data Matrix rendered in near-black (t.ink) squares on the same warm off-white quiet-zone rectangle (so the quiet zone blends with the page, which is harmless in light mode). Solid black column on the left edge and solid black row on the bottom edge form the L-shaped finder pattern; the top row and right column show an alternating black/white timing pattern. The matrix is centered with balanced margins, occupying roughly two-thirds of the canvas width/height.
      Legibility verdict: PASS — all text is readable against the light background, and the matrix modules are high-contrast and crisply rendered (crispEdges).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — correct for dark theme, not pure black.
      Chrome: Title in light cream (t.ink, theme-flipped) at top-center, clearly legible against the dark background; subtitle in muted light gray (t.inkSoft), also readable. No dark-on-dark failures — all text is light-colored and stands out from the background.
      Data: The Data Matrix modules render in light near-white (t.ink, theme-flipped) on the dark background — the module pattern is pixel-identical in position to the light render (same finder pattern, same timing pattern, same data region), only the fore/background contrast has flipped, exactly as required. The quiet-zone rectangle (t.pageBg) is the same color as the page background, so no separate quiet-zone boundary is visible in dark mode — a minor cosmetic difference from light mode, but the modules themselves remain fully legible.
      Legibility verdict: PASS — text is fully readable in dark mode, and matrix modules are clearly distinguishable from the background; no dark-on-dark text issues found.
