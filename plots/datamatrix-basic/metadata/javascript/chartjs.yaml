review:
  strengths:
  - 'Structurally correct Data Matrix layout: solid L-shaped finder pattern and alternating
    clock/timing track match ISO/IEC 16022 exactly, verified visually in both renders.'
  - Fully deterministic, in-memory data generation with no RNG — content string bits
    map cleanly into interior modules.
  - Generous quiet zone and well-balanced canvas fill (~70%), correct square orientation
    directive.
  - Theme-adaptive title/subtitle chrome is correctly readable in both light and dark
    renders; animation:false and the mount-node contract are followed correctly.
  - Subtitle communicates the encoded content, adding useful context beyond a bare
    grid.
  weaknesses:
  - The module fill color uses t.ink (the theme text token) instead of a fixed black-on-white,
    so the dark render inverts the matrix to light modules on a near-black background.
    This breaks the spec's explicit "Use high contrast black on white for maximum
    readability" note and diverges from the already-approved qrcode-basic chartjs
    implementation (plots/qrcode-basic/implementations/javascript/chartjs.js), which
    deliberately keeps a fixed white card + black modules across both themes for scan-validity,
    flipping only the surrounding page chrome. Repair should paint a fixed light card
    behind the grid and fill modules in a fixed dark color in both themes, leaving
    only background/title/subtitle theme-adaptive.
  - 'Design Excellence is functional but plain — no accent framing or brand touch
    (contrast with the qrcode-basic sibling''s thin #009E73 accent border around its
    white card). A similar subtle brand accent would lift DE-01/DE-02.'
  - Interior module bits are derived by directly chunking the content string's raw
    ASCII bits in raster order rather than genuine ECC 200 / Reed-Solomon placement
    — understandable given no browser-available Data Matrix library, and the code's
    own comments are honest about this being a stylized representation. No action
    needed beyond keeping that honesty intact.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct light theme surface, not pure white.
      Chrome: Title "datamatrix-basic · javascript · chartjs · anyplot.ai" in bold dark ink (~55% canvas width), clearly readable. Subtitle "Encodes "SERIAL:12345678"" in smaller muted ink beneath it, readable.
      Data: 16x16 module grid in solid dark ink on the light background. Left column + bottom row solid (L-shaped finder pattern); top row + right column alternating (clock/timing track); interior cells form the data region derived from the content string's bits. Quiet zone margin on all sides, grid fills ~70% of canvas.
      Legibility verdict: PASS - all text and modules clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct dark theme surface.
      Chrome: Title and subtitle switch to light cream / muted-light text, clearly readable - no dark-on-dark issues.
      Data: Module positions are pixel-identical to the light render, BUT the module fill color also flips (via t.ink) to light cream squares on the near-black background - i.e. the matrix polarity inverts to light-on-dark instead of staying black-on-white. Still fully legible/high-contrast, but this breaks the spec's literal "black on white" requirement and diverges from the qrcode-basic precedent, which keeps its code fixed white/black in both themes.
      Legibility verdict: PASS for text; FLAG for data-module polarity inversion (see weaknesses).
