review:
  strengths:
  - Structural (finder + timing) modules now render in Imprint brand green (palette[0])
    while payload modules stay on the ink token, directly resolving the prior review's
    VQ-07 finding without losing the spec's L-shaped finder / alternating timing pattern.
  - Deterministic mulberry32 RNG seeded from the content string gives fully reproducible
    payload noise across runs.
  - 'Correct mount-node contract: echarts.init with no explicit width/height or devicePixelRatio,
    animation: false, and window.__anyplotReady set from the ''finished'' event.'
  - 'Both renders are theme-correct: #FAF8F1 / #1A1A17 backgrounds, brand green constant
    across themes, ink token flips for payload contrast, no dark-on-dark or light-on-light
    text.'
  - 'Canvas gate passed cleanly at 2400x2400 with the //# anyplot-orientation: square
    directive, matching the natural square aspect of a Data Matrix symbol.'
  - Realistic, neutral example payload (industrial part/lot serial string) fits the
    spec's stated use cases.
  weaknesses:
  - 'Design excellence is capped by the format itself: a single accent color plus
    a binary grid leaves limited room for typographic hierarchy or compositional flourish
    beyond the structure/payload color split already applied — acceptable for this
    plot type, not a defect.'
  - Only one distinctive ECharts technique is exercised (custom series with renderItem);
    reasonable given ECharts has no native barcode chart type, but leaves LM-02 short
    of a second differentiator.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "datamatrix-basic · javascript · echarts · anyplot.ai" is centered near the top in dark ink text, clearly legible, not overflowing the canvas. No axis lines, ticks, or grid are shown (correctly hidden for this plot type).
