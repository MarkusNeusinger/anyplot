review:
  strengths:
  - 'Faithful ISO/IEC 16022 structure: solid L-shaped finder pattern occupies the
    full left column and bottom row, with the alternating clock/timing track correctly
    placed on the top row and right column — verified pixel-exact in both renders.'
  - 'Exact theme-token compliance: sampled pixel values confirm plot background is
    precisely #FAF8F1 (light) and #1A1A17 (dark), with modules using the corresponding
    ink token — no drift from the style guide''s chrome hex values.'
  - Honest, well-reasoned code comment documents the deliberate tradeoff of using
    ink/page-background instead of the Imprint categorical palette for the modules,
    directly citing the spec's own 'high contrast black on white' requirement rather
    than silently deviating.
  - Deterministic, seeded pseudo-random payload generation (mulberry32 seeded from
    the content string) keeps the interior pattern reproducible without a real barcode
    encoder, which the library rules explicitly note is unavailable in the browser
    sandbox.
  - Clean use of ECharts' custom series with `renderItem` to draw exact square modules
    on a category/category cartesian grid — a legitimate, idiomatic way to render
    an exact pixel-grid pattern without relying on a heatmap's continuous color legend.
  - Quiet zone, canvas margins, and title placement are well-balanced; the square
    2400×2400 canvas format is the correct choice for this grid-based, symmetric plot
    type.
  weaknesses:
  - 'VQ-07 Palette Compliance: the modules use the theme ink token rather than the
    Imprint categorical palette''s brand green (#009E73) for the ''first series''.
    The tradeoff is well-justified by the spec''s explicit high-contrast black-on-white
    requirement and is not a defect to fix reflexively, but it is a deliberate departure
    from the hard ''first series is always #009E73'' rule and is noted here for visibility
    rather than silently awarded full marks.'
  - 'Design Excellence is modest (11/20): the render is faithful and clean but doesn''t
    add much beyond the literal ISO 16022 structure — e.g. no subtle visual hierarchy
    cue (like a faint corner marker or module-size legend) to help a human reader
    parse finder-pattern vs. payload region at a glance. This is a soft, optional
    polish note, not a correctness issue given a barcode''s aesthetic goal is technical
    fidelity.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (250, 248, 241) = #FAF8F1 exactly — matches the required light-theme plot background.
      Chrome: Title "datamatrix-basic · javascript · echarts · anyplot.ai" is centered at the top in dark ink (#1A1A17), clearly readable, comfortably within the canvas with generous margin above the matrix. No axis labels/ticks/legend/grid are present, which is correct — a Data Matrix barcode has no axes.
      Data: A square 24x24-module grid (20 encoded modules + 2-module quiet zone on each side) rendered as black (#1A1A17) squares on the cream background. The left column and bottom row form a solid, unbroken L-shaped finder pattern; the top row and right column show a clean alternating (checkerboard) clock/timing pattern; the interior is a pseudo-random black/white payload pattern. A clear quiet zone margin separates the matrix from the canvas edge on all sides.
      Legibility verdict: PASS — title and matrix are both crisp and high-contrast, no overlap, no clipping at any edge (verified via a cropped pixel inspection of the canvas borders).

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel (26, 26, 23) = #1A1A17 exactly — matches the required dark-theme plot background.
      Chrome: Same title text, now in light ink (#F0EFE8), clearly readable against the dark background. Same layout and margins as the light render — no dark-on-dark or light-on-light issues found.
      Data: Identical module layout to the light render (same finder pattern, same timing pattern, same pseudo-random interior — confirmed pixel-identical grid), but with polarity flipped: modules are now light (#F0EFE8) on the near-black background, preserving the barcode's required high-contrast readability in dark mode. This is a deliberate, spec-driven choice to use the ink token rather than the Imprint palette's brand green for the "data," documented in the implementation's code comments.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; title and matrix both read clearly; a cropped inspection of the bottom canvas edge confirms no clipped/ghost text.
