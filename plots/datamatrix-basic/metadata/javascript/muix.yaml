      Data: A 24×24 module grid rendered in brand green (#009E73) on the cream background. Solid green border along the left column and bottom row (L-shaped finder pattern), alternating green/cream cells along the top row and right column (timing/clock pattern), and a pseudo-random green/cream fill in the interior data region. A visible cream quiet-zone margin surrounds the matrix on all sides.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; the green modules have strong contrast against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and caption text, now rendered in light ink/soft-light gray, clearly legible against the dark background. No dark-on-dark issues observed on any text element.
      Data: The exact same 24×24 module grid in the identical brand green (#009E73) — finder pattern, timing pattern, and data region positions match the light render pixel-for-pixel; only the surrounding chrome (background, text color) flipped to the dark theme. The green modules remain highly visible against the near-black background.
      Legibility verdict: PASS — no dark-on-dark text, data color is identical to the light render, contrast is strong in both themes.
