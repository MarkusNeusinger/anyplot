review:
  strengths:
  - 'Uses the v9 composition idiom: an empty ChartsContainer with hidden axes and
    a custom child that reads useDrawingArea() to place the modules, so module size
    follows the drawing area instead of hard-coded pixels'
  - L-shaped finder pattern is solid and unbroken along the left and bottom edges
    and meets in the lower-left corner; square modules of one size sit on a regular
    24×24 grid with sharp edges
  - Generous quiet zone (2 modules plus card padding) on all four sides, free of text
    and marks
  - Elevated rounded card with a hairline border frames the symbol, and a soft-ink
    caption naming the content and symbol size gives a clear title / symbol / caption
    hierarchy
  - Deterministic data region (FNV hash seeding a fixed LCG); skipAnimation set; square
    orientation directive; title and caption readable in both themes
  weaknesses:
  - 'SC-02 (both): modules are drawn in brand green #009E73 instead of black, and
    in the dark render the symbol sits on the dark #242420 card, so the code is green-on-cream
    / green-on-near-black rather than the high-contrast black on white the Notes and
    the ''A good version shows'' bullet require → black (or the darkest ink) modules
    on a white/near-white tile in both themes (a white tile behind the symbol in the
    dark theme is explicitly permitted). Likely cause: fill={t.palette[0]} on the
    module rects and backgroundColor: t.elevatedBg on the card.'
  - 'SC-02 (both): the clock pattern is out of phase at both ends — the top row is
    dark at col 0 and col 1 (a two-module dark block next to the finder corner) and
    the right column is dark at rows 0 and 1 (a two-module dark block in the top-right
    corner), so the alternation is not in step with the grid → top row dark on even
    columns (col 0, 2, 4 …), right column dark on odd rows, which leaves the top-right
    corner light on an even-sized symbol. Likely cause: grid[0][c] = c % 2 === 1 in
    buildMatrix (should be c % 2 === 0).'
  - 'DQ-03 (both): the caption states ''Encodes "PCB-SN:48291X7A" · ECC 200'', but
    the data region is the raw 8-bit ASCII of the text followed by hash-seeded LCG
    noise with no ECC 200 codewords, Reed-Solomon blocks or module placement, so the
    symbol does not encode what the caption claims → either generate a real ECC 200
    symbol or drop the ''Encodes … ECC 200'' claim from the caption. Likely cause:
    encodeBits() padding with an LCG instead of ECC 200 encoding.'
  - 'CQ-01 (code): three module-level helper functions (hashString, encodeBits, buildMatrix)
    besides the required component structure → inline the matrix construction as straight-line
    module-level code. Likely cause: function-wrapped matrix build.'
  - 'Suggestion: a slightly larger title (about 26–28 px) would balance the large
    square symbol.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1, sampled 250,248,241) with a slightly lighter rounded card with a hairline border centred on the 2400x2400 square canvas.
      Chrome: title "datamatrix-basic · javascript · muix · anyplot.ai" top-left in dark ink, about 40% of the width; caption 'Encodes "PCB-SN:48291X7A" · 24×24 modules · ECC 200' centred at the bottom in soft ink. No axes, ticks, grid or legend (expected for this type). All text readable.
      Data: 24x24 grid of square modules filled brand green #009E73 (sampled 0,158,115) on the cream card — not black on white. Solid L finder on left and bottom edges; clock pattern on top and right edges, but with two-module dark blocks at the top-left (cols 0–1) and top-right (rows 0–1) corners. Data region looks like random noise. Quiet zone of 2 modules plus card padding on all sides.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17, sampled 26,26,23) with a slightly lighter dark card (elevatedBg) and subtle border.
      Chrome: title in light ink, caption in soft light ink — both clearly readable; no dark-on-dark text.
      Data: module colors identical to the light render (#009E73) and identical module layout; green on near-black, so the symbol is inverted in contrast relative to black-on-white.
      Legibility verdict: PASS
