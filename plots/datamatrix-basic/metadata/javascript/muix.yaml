review:
  strengths:
  - L-shaped finder pattern is two unbroken solid edges (left column, bottom row)
    meeting in the lower-left corner, and the clock pattern alternates module-for-module
    along the top row and right column, in step with the 24×24 grid (both renders)
  - Square modules of one size on a regular grid with shapeRendering="crispEdges"
    and a 0.6 px overlap that removes anti-aliasing seams between adjacent black modules
    — sharp, gradient-free cells
  - Generous quiet zone (2 modules plus the tile padding) on all four sides, free
    of text; the symbol stays black on a light tile in the dark theme while title
    and caption flip to theme tokens (t.ink / t.inkSoft)
  - 'Composes the symbol as a custom child of ChartsContainer and positions it with
    the useDrawingArea hook — the MUI X v9 composition idiom for custom SVG marks,
    with axes hidden via position: "none" and skipAnimation set'
  - Rounded symbol tile with a subtle t.grid border, a left-aligned title and a centred
    muted caption give the single symbol a clean presentation hierarchy
  - Plausible, neutral industrial part-marking scenario (PCB serial number) at a valid
    ECC 200 square size (24×24)
  weaknesses:
  - 'DQ-01 (both): the data region is not an ECC 200 encoding of the content — the
    code places the raw 8-bit ASCII of "PCB-SN:48291X7A" row-major and fills the rest
    with LCG noise, so there are no ECC 200 codewords, no Reed-Solomon error correction
    and no standard module placement, and the symbol would not decode (the Notes name
    ECC 200 as the standard) → encode the content as ECC 200: ASCII codewords (digit
    pairs as 130+value), pad codewords, Reed-Solomon ECC over GF(256) with polynomial
    301, and the standard utah placement into the 22×22 data region. Likely cause:
    lines 38–63 build dataBits from charCodeAt bits plus an LCG instead of computing
    the symbology.'
  - 'CQ-04 (code): the header is duplicated — lines 6–9 repeat the anyplot header
    with a stale "Library: muix 7.29.1 | JavaScript 22.23.2" that contradicts the
    pinned muix 9.16 the code is written against → delete lines 6–9 so a single header
    remains. Likely cause: a header from an earlier generation that was prepended
    to instead of replaced.'
  - 'Suggestion: once the data region is a real ECC 200 encoding, the caption''s "illustrative
    data region" qualifier can be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1), 2400×2400 square canvas; the symbol sits on a rounded tile of the same off-white with a faint grey 1 px border.
      Chrome: title "datamatrix-basic · javascript · muix · anyplot.ai" top-left in dark ink, ~40 % of the width; muted dark-grey caption centred at the bottom: 'Part marking "PCB-SN:48291X7A" · 24×24 modules · illustrative data region'. All text readable.
      Data: a 24×24 Data Matrix in near-black (#1A1A17) square modules: solid left column and bottom row form the L finder meeting at the lower-left corner; top row and right column alternate black/white; interior is a noise-like data region. Quiet zone of ~2 modules plus tile padding on all sides. Single-colour symbology, no palette series.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17); the symbol tile stays off-white (#FAF8F1) as a light card, as the spec permits.
      Chrome: title in light ink top-left and caption in light-grey muted ink at the bottom — both clearly readable, no dark-on-dark text.
      Data: the module grid is pixel-identical to the light render (same near-black modules on the off-white tile); only page background and text flipped.
      Legibility verdict: PASS
