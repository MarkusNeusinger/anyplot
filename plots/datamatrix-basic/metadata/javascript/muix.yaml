review:
  strengths:
  - Correct L-shaped finder pattern (solid left column + bottom row) and alternating
    timing pattern (top row + right column), matching ISO/IEC 16022 conventions exactly
    as described in the spec
  - Fully deterministic content encoding (FNV-1a seed + fixed-seed LCG filler) with
    no external RNG — reproducible pixel-for-pixel across renders
  - 'Idiomatic, distinctive MUI X usage: composes ChartContainer purely for its sized
    SVG coordinate space and drives custom module rects via useDrawingArea, rather
    than forcing the data into a scatter/heatmap series it doesn''t fit'
  - 'Correct Imprint palette application — brand green (#009E73) is the module color,
    both theme backgrounds (#FAF8F1 / #1A1A17) are correct, and the data color is
    identical between light and dark renders'
  - Visible quiet zone margin, informative caption stating encoded content, module
    count, and ECC level; title matches the required '{spec-id} · {language} · {library}
    · anyplot.ai' format
  weaknesses:
  - Real Data Matrix codes are conventionally black-on-white for scanner contrast;
    using Imprint brand green correctly follows anyplot's mandatory first-series-is-#009E73
    design rule, but it's worth noting as an inherent (and correctly resolved) tension
    with the spec's literal 'black on white for maximum readability' note — no action
    needed
  - Horizontal margin around the matrix (outer flex centering plus quiet zone) is
    visibly larger than the vertical margin (quiet zone only, no outer flex margin),
    giving a slightly asymmetric frame — reserve a small vertical outer margin so
    top/bottom balances left/right
  - Composition is correct but visually static/mechanical, as a barcode pattern has
    little room for a focal point; Design Excellence scores stay near baseline because
    there isn't much intentional visual hierarchy beyond the title/matrix/caption
    stack
  image_description: |-
