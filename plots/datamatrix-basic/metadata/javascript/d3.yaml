review:
  strengths:
  - 'Correctly reproduces the three defining structural regions of an ISO/IEC 16022
    Data Matrix: solid L-shaped finder pattern on the left/bottom edges, alternating
    timing (clock) pattern on the top/right edges, and a >=1-module quiet zone, with
    the finder deliberately drawn last so it wins the shared corners.'
  - Deterministic pseudo-random interior fill via a tiny content-seeded LCG (hashString
    + makeRng), exactly the pattern the d3.md library guide recommends for reproducibility
    in a browser with no seeded RNG.
  - 'Thoughtful ''physical label'' design: rounded-corner quiet-zone plate with a
    subtle 15%-opacity ink border, monospace caption for the encoded content string,
    and a well-justified, documented decision to keep the barcode plate high-contrast
    dark-on-light in both themes (required for real-world scannability) while the
    title/caption still correctly flip with the theme tokens.'
  - Realistic, neutral example data ('PN-88214-REV3', a plausible manufacturing/part-serialization
    code) matching the spec's stated applications, with a valid ISO symbol size (24x24)
    and correct ECC 200 labeling.
  - 'Clean, idiomatic D3 usage: single svg mount sized from window.ANYPLOT_SIZE, canonical
    selectAll(...).data(...).join(''rect'') data-join for the modules, no animations,
    no extraneous imports.'
  weaknesses:
  - Title ('datamatrix-basic · javascript · d3 · anyplot.ai') fills only ~46% of the
    plate/canvas width on the square 1200x1200 mount, a bit under the ~50-70% sweet
    spot for a shorter custom title -- a slightly larger title fontsize would strengthen
    the visual hierarchy without risking overflow.
  - The interior payload region is a pseudo-random fill standing in for real ECC 200-encoded
    data rather than an actual Data Matrix encoding of the content string -- acceptable
    for a 'basic' representative viz, but a future revision could note in-code that
    this is intentionally illustrative, not a literal encoder, more prominently for
    maintainers.
  - Design excellence is inherently capped by the plot type (binary black/white grid
    leaves little room for palette or color-hierarchy work) -- consider a very subtle
    accent (e.g. a small Imprint-green corner marker or legend chip identifying the
    finder/timing/payload regions) to push Data Storytelling further without harming
    scannability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme page surface -- not pure white.
      Chrome: Title "datamatrix-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered top, clearly legible. Caption '"PN-88214-REV3"  ·  24x24 modules · ECC 200' in soft-grey monospace beneath the plate, clearly legible.
      Data: A centered, rounded-corner off-white "label" plate (same #FAF8F1 tone as the page, distinguished by a subtle 15%-opacity border) holds a 24x24 grid of black/white modules. The left column and bottom row are solid black (L-shaped finder). The top row and right column show a regular alternating black/white timing pattern. The interior is an irregular black/white pseudo-random fill representing the encoded payload + ECC 200 parity. A clear quiet-zone margin of blank modules separates the code from the plate border.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme page surface -- not pure black.
      Chrome: Title in light/off-white ink, tick/caption text in soft light-grey monospace -- both fully legible against the dark background, no dark-on-dark text anywhere.
      Data: The same off-white plate (intentionally kept at the fixed light-theme tone, per the in-code rationale that a Data Matrix must stay high-contrast dark-on-light to remain "scannable," like a physical printed label) now stands out as a bright card against the dark page. The black/white module pattern inside -- finder, timing pattern, quiet zone, interior fill -- is pixel-for-pixel identical to the light render, confirming the "data" colors do not change between themes while only the surrounding chrome (title/caption ink, page background) flips.
      Legibility verdict: PASS
