review:
  strengths:
  - coord_fixed() with symmetric, level-derived limits keeps the 16-QAM geometry true
    and centered on the origin
  - gggrid([plot]) paints the whole canvas in the page color behind the fixed-aspect
    panel, so both renders are edge-to-edge theme-correct
  - Decision boundaries, limits and ticks are computed from the ideal levels rather
    than typed, so the plot adapts to other square constellations
  - EVM is computed from the data (9.9%) and shown in a lets-plot geom_label badge
    (label_r, label_padding) in the empty corner, clear of the clouds
  - Imprint green received dots and ochre crosses differ in hue, lightness and shape;
    identical in both themes
  weaknesses:
  - 'SC-04 (both): the green received dots and the ochre ideal crosses have no key
    or direct label, so a reader must already know which mark is which → a legend
    (or a direct label) naming ''Received symbols'' and ''Ideal points''. Likely cause:
    both geom_point layers use constant color/shape outside aes(), so lets-plot draws
    no legend; map a series column to color/shape with scale_*_manual.'
  - 'Suggestion: the 2D density contours spread far beyond the clouds and add many
    lines in the light render; fewer bins or a lower alpha would keep the focus on
    the received dots.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the full 2400x2400 canvas; panel framed in INK_SOFT
      Chrome: bold dark title '16-QAM Constellation · scatter-constellation-diagram · python · letsplot · anyplot.ai' (~78% width), axis titles 'In-Phase (I)' and 'Quadrature (Q)', integer ticks -4..4 in dark grey - all readable
      Data: alternating beige checkerboard decision regions, dashed dark boundary lines at -2/0/2 plus solid origin axes, translucent green (#009E73) density contours and 1000 semi-transparent green dots in 16 clouds, 16 large ochre (#BD8233) crosses at +/-1, +/-3, 'EVM = 9.9%' badge top right clear of the clouds
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the full canvas; checkerboard regions (#2B2B27 / #201F1C) visible but subtle
      Chrome: title and axis titles in light off-white, ticks in light grey, light dashed boundaries and frame; no dark-on-dark text
      Data: green dots and ochre crosses identical to the light render; contours read as dim green lines; EVM badge with elevated fill and light text
      Legibility verdict: PASS
