review:
  strengths:
  - Composes the chart from ChartsDataProvider + ChartsSurface with ChartsReferenceLine
    for the six dashed decision boundaries at ±2 and 0, exactly midway between the
    ideal levels and kept subordinate (inkSoft, 60 % opacity, 1.5 px)
  - 'Equal aspect ratio is computed, not assumed: the margins make the drawing area
    square and both axes share one symmetric extent around the origin, so the 16-QAM
    grid geometry is true'
  - EVM is computed from the data (RMS error vector over mean ideal power, 6.5 % for
    sigma 0.15, matching the theoretical 6.7 %) and drawn through the useDrawingArea
    hook as a haloed SVG label in the empty top-left corner, clear of every cloud
  - Ideal points are large matte-red circles with a page-coloured outline that keeps
    them recognizable on top of the semi-transparent green received clouds in both
    themes
  - Received symbols (992, inside the 500–2000 range) sit at their own noisy I/Q values
    with alpha 0.45, styled per series via the v9 [data-series] .MuiScatterChart-marker
    selector
  - Theme chrome threads ANYPLOT_TOKENS through title, subtitle, axes and label halo;
    both renders are fully legible
  - Library-native tooltips on both series in the HTML output
  weaknesses:
  - 'VQ-03 (both): the legend glyphs do not match the marks they explain: the ''Received
    symbols'' dot is drawn fully opaque while the markers sit at alpha 0.45, and the
    ''Ideal points'' dot lacks the page-coloured outline of its markers → legend marks
    with the same fill opacity and outline as the plotted series. Likely cause: the
    fillOpacity and stroke overrides target only ''.MuiScatterChart-marker'' inside
    ChartsSurface, not the ChartsLegend mark.'
  - 'Suggestion: a light I/Q impairment (a small phase rotation) would let the diagram
    show what a constellation diagnoses beyond plain noise.'
  - 'Suggestion: the left margin between the Q axis title and the plot is wider than
    the right one; trimming it would centre the square plot on the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: bold title "scatter-constellation-diagram · javascript · muix · anyplot.ai" centred at the top, a grey subtitle "992 received symbols around 16 ideal points · dashed lines: decision boundaries", a horizontal legend (Received symbols, Ideal points), axis titles "In-Phase (I)" and "Quadrature (Q)", ticks −4…4 on both axes, left and bottom axis lines only. Dashed grey decision boundaries at I = −2, 0, 2 and Q = −2, 0, 2. "EVM = 6.5%" in bold dark ink in the top-left corner. All text dark on light and readable.
      Data: 16 large matte-red ideal circles with a page-coloured outline on the 4x4 grid at ±1, ±3; around each, a compact cloud of semi-transparent #009E73 green dots. The square plot area keeps the grid geometry true.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, axis titles, ticks and EVM label all flip to light ink; axis lines light; dashed boundaries light grey and subordinate. No dark-on-dark text anywhere.
      Data: identical colours to the light render — #009E73 received dots (read darker through the alpha on the dark page but clearly visible) and the same matte-red ideal circles, now outlined in the dark page colour.
      Legibility verdict: PASS
