review:
  strengths:
  - Composes the chart from MUI X v9 primitives (ChartsDataProvider, ChartsWrapper,
    ChartsSurface, ChartsXAxis/YAxis, ScatterPlot) so the drawing area is forced square
    and px-per-unit is equal on both axes — the constellation geometry is true at
    1:1
  - Decision boundaries are computed from the data (midpoints between neighbouring
    ideal levels) and drawn with native ChartsReferenceLine at -2/0/2 in a soft dashed
    inkSoft stroke that stays subordinate to the symbols
  - EVM is computed as RMS error vector over mean ideal power (6.5%, consistent with
    sigma 0.15 per axis) and placed in the empty top-left corner via the useDrawingArea
    hook, with a page-colored halo so it reads in both themes
  - Ideal points are large matte-red markers with a page-colored outline that separates
    them from the green cloud; the legend glyphs repeat the received symbols' opacity
    and the ideal markers' outline via data-series selectors
  - Symmetric extent derived from the data and centered on the origin; 992 seeded-LCG
    symbols keep each cloud at its own I/Q values without snapping or jitter
  - Native scatter tooltips and hover highlighting are available in the interactive
    HTML output
  weaknesses:
  - 'Suggestion: thin the y-axis-left/x-axis-bottom spine pairing toward an origin-centered
    look (e.g. lighter axis lines) so the symmetric I/Q frame reads more like a classic
    constellation display.'
  - 'Suggestion: a small cross or ring glyph for the ideal points (the spec''s ''red
    crosses'') would let the received symbols directly underneath stay visible at
    the cloud centres.'
