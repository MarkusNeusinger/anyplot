      Data: 16 tight clouds of semi-transparent brand-green (#009E73) dots on a 4x4 grid at ±1, ±3; large matte-red (#AE3030) ideal markers with a cream outline at each grid point. Dashed grey decision-boundary lines at I = -2, 0, 2 and Q = -2, 0, 2 separate the 16 regions. Square drawing area, symmetric limits about ±4.4.
