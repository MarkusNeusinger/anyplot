review:
  strengths:
  - 'All four curves follow the theory: Bias² falls, Variance rises, Irreducible Error
    is flat at 0.1, and Total Error is their sum, a U that lies above the other three'
  - Optimal complexity is taken from df[TOTAL].idxmin(), so the star, the dashed red
    vline and the shading boundary sit exactly at the minimum of the Total Error curve
  - 'Text is placed in clear space: the legend ends above the Total Error curve''s
    start at 0.61, the Underfitting label sits below the legend, the Optimal Complexity
    label sits in the empty band above the curves, and the formula box sits between
    the zone labels clear of every curve'
  - 'Line weights rank the series: Total Error is the thickest solid line (5 px),
    Bias² and Variance are 4 px dashed, and Irreducible Error is a thin 3 px dotted
    line in INK_MUTED'
  - 'Idiomatic Plotly: add_vrect for the zones, add_vline with its built-in annotation,
    and direct curve labels at xref=''paper'' with yref=''y'' in the right margin'
  - Theme tokens are applied throughout. The legend and formula box use ELEVATED_BG,
    and the star's outline is PAGE_BG, so it stands out from the red curve in both
    themes
  - 'Adaptable structure: column constants, one Data block that ends by binding df,
    and every position (zones, labels, ticks, ranges) taken from df'
  weaknesses:
  - 'SC-02 (both): Bias² and Variance are both drawn with the same ''dash'' style,
    so only color separates them, but the spec asks for four curves in distinct colors
    and line styles → give Variance its own style, such as ''dashdot'' or ''longdash''.
    Likely cause: curve_styles assigns dash=''dash'' to both BIAS and VARIANCE.'
  - 'SC-02 (both): the formula reads ''Total Error = Bias² + Variance + ε'', and ε
    is defined nowhere on the plot, but the Notes ask for ''+ Irreducible Error''
    → write the term out, or as ''ε (Irreducible Error)''. Likely cause: the formula
    f-string ends in a literal ε instead of the IRREDUCIBLE constant.'
  - 'Suggestion: the legend repeats the direct right-margin labels for all four curves.
    The right-margin labels alone could carry the key, which would free the upper-left
    corner.'
  - 'Suggestion: the red ''Optimal Complexity'' and ''Total Error'' labels are the
    dimmest text in the dark render. A slightly heavier weight would give them more
    presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area. A faint green tint covers the underfitting zone left of the optimum, and a faint lavender tint covers the overfitting zone right of it.
      Chrome: the title "curve-bias-variance-tradeoff · python · plotly · anyplot.ai" is centered in dark ink and fills about 50 % of the width. The axis titles "Model Complexity" and "Prediction Error" are dark. The tick labels Low / Medium / High and 0–1 are in INK_SOFT. The legend in the upper left has an elevated background and five entries. All text is readable.
      Data: Bias² is a #009E73 dashed curve, falling from 0.51. Variance is a #C475FD dashed curve, rising to 0.63. Irreducible Error is a gray dotted line at 0.1. Total Error is the thickest #AE3030 solid U-curve, with a star at its minimum of about 0.33 and a dashed red vline there. "Optimal Complexity" stands in red at the top, right of the vline. The bold green "Underfitting (High Bias)" and lavender "Overfitting (High Variance)" labels sit in their zones. The boxed formula "Total Error = Bias² + Variance + ε" is in the middle, clear of the curves. Direct labels in the right margin sit level with each curve's end. Nothing overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, with the same faint green and lavender zone tints.
      Chrome: the title, axis titles and tick labels are light (INK / INK_SOFT). The legend and formula box use the elevated dark #242420 background with light text and a light border. There is no dark-on-dark text. The red "Optimal Complexity" and "Total Error" labels are the dimmest text but still readable.
      Data: the curve colors are identical to the light render (#009E73, #C475FD, #AE3030). The muted gray of Irreducible Error comes from the INK_MUTED token for this theme, and the star's outline switches to the page color. Brand green stays clearly visible.
      Legibility verdict: PASS
