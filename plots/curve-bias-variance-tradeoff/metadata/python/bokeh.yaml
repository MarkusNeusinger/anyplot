      Data: green #009E73 U-shaped Total Error with a minimum dot and dotted vertical guide at complexity ≈ 2.7; blue #4467A3 Bias² falling; purple #C475FD Variance rising; dashed grey floor at 0.5. Labels: Bias² sits beside the Total Error curve rather than its own, Total Error floats about 1.5 units above its curve, Variance between the variance and total curves, plain 'Optimal' near the minimum. The italic formula's end runs into the dotted optimal line. Zone sub-labels at 20pt read small.
      Legibility verdict: PASS

