review:
  strengths:
  - Optimal complexity computed from the data (argmin) and marked with a bokeh Span
    plus a dot at the total-error minimum
  - Uses bokeh's native BoxAnnotation for the light underfitting/overfitting zones
  - 'Clear weight hierarchy: thick green total curve, thinner components, dashed neutral
    noise floor'
  - Theme tokens threaded through all chrome; both renders readable with identical
    data colors
  weaknesses:
  - 'VQ-02 (both): the end of the formula ''Total Error = Bias² + Variance + Irreducible
    Error'' runs into the dotted optimal-complexity line → end the text at least a
    few px left of the guide. Likely cause: the formula Label at x=0.3, y=4.88 with
    24pt text reaching the Span at x ≈ 2.7.'
  - 'VQ-01 (both): annotations are below the 34pt tick-label reference and read small:
    zone sub-labels at 20pt (−14 pt), formula and zone labels at 24pt (−10 pt), Irreducible
    Error at 22pt (−12 pt) → about 34pt. Likely cause: the Label text_font_size values.'
  - 'VQ-03 (both): the legend keys are bokeh''s default 20 px specks beside the 34pt
    labels → glyph_width and glyph_height about 40 px (+20 px). Likely cause: p.legend.glyph_width
    / glyph_height not set.'
  - 'VQ-05 (dark): a 1 px light line runs along the top and left edge of the canvas
    → page color to the edge. Likely cause: the browser page is not painted in PAGE_BG
    before the screenshot.'
  - 'SC-02 (both): the Bias² label sits beside the Total Error curve, and the Total
    Error label floats about 1.5 units above its own curve, so not every label is
    next to its curve (C2) → place each label from its curve''s value at the label''s
    x. Likely cause: hard-coded Label coordinates (0.7, 2.85) and (5.8, 3.85).'
  - 'SC-02 (both): Bias², Variance and Total Error are all solid, so the four curves
    lack distinct line styles (C2) → own dash patterns for Bias² and Variance. Likely
    cause: line_dash only on the irreducible line.'
  - 'Suggestion: give the optimum annotation more weight so the minimum reads as the
    key point.'
  - 'Suggestion: loosen the vertical spacing of the formula and zone-label stack in
    the top-left.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 with a faint blue tint over the underfitting zone and a faint purple tint over the overfitting zone.
