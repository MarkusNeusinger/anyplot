review:
  strengths:
  - All four components come from one melted tidy frame with mapped color, linetype
    and size scales; Total Error is computed as the exact sum, so the U lies above
    the other three curves
  - Four distinct line styles (dashed, dashdot, dotted, thick solid) plus four Imprint
    hues make every curve separable without a legend
  - The optimal-complexity line sits at the argmin of Total Error, computed from the
    data, and the zones split exactly there
  - Every annotation, including the formula and the two zone labels, renders at a
    readable size near the tick text in both themes
  - x axis fitted to the data with expand=(0, 0), so curves start and end at the panel
    edges under the Low/High ticks
  weaknesses:
  - 'Suggestion: the shaded zones stop at the y limit while the panel extends slightly
    below 0 and above 1.22; letting the rectangles span the full panel would remove
    the thin unshaded strips.'
  - 'Suggestion: the unlabeled minor tick in the middle of the Low–High axis could
    be dropped (minor_breaks=None) for a cleaner complexity axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; two INK_MUTED shaded zones split at the optimum, the left (Underfitting) very faint, the right (Overfitting) a little stronger.
      Chrome: title 'curve-bias-variance-tradeoff · python · plotnine · anyplot.ai' (~62% width), axis titles 'Model Complexity' / 'Prediction Error' in dark ink, ticks 'Low'/'High' and 0.00–1.25 readable; subtle y-only grid; zone labels 'Underfitting' / 'Overfitting' in muted grey at the top corners; formula 'Total Error = Bias² + Variance + Irreducible Error' in the upper right clear of all curves; 'Optimal Complexity' beside the dashed vertical line.
      Data: Bias² #009E73 dashed falling, Variance #C475FD dashdot rising, Irreducible Error #4467A3 dotted at 0.20, Total Error #BD8233 thick solid U with minimum ≈0.79 at the dashed vertical; each curve labeled in its own color next to it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; overfitting zone slightly lighter, underfitting barely visible.
      Chrome: title, axis titles, ticks, zone labels, formula and optimum label all in light ink tokens, readable; no dark-on-dark text.
      Data: identical Imprint colors and line styles to the light render; only chrome flipped.
      Legibility verdict: PASS
