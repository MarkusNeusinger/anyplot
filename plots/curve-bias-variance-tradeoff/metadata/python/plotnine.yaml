review:
  strengths:
  - All four components plotted from one melted tidy frame with mapped color, linetype
    and size scales; the total is computed as the exact sum, so the U lies above the
    other curves
  - Optimal-complexity line sits exactly at the argmin of Total Error, computed from
    the data
  - Theme tokens threaded through all chrome; Imprint positions 1–4 identical in both
    renders
  - Flat, deterministic script with data-derived label positions
  weaknesses:
  - 'VQ-01, SC-02 (both): the four curve labels, the ''Optimal Complexity'' label
    and the formula (C4) render at about 3.2–3.5 pt, far below the style guide''s
    8 pt tick-label reference, so the formula and labels read small next to 8 pt ticks
    → about 8–9 pt (+5 pt). Likely cause: annotation size=3.2/3.5 treated as mm while
    plotnine renders it close to pt.'
  - 'SC-02 (both): Bias² and Variance share the same dashed line style, so the four
    curves are not in distinct line styles (C2) → give one of them its own pattern
    (e.g. dashdot or longdash). Likely cause: linetypes [''dashed'', ''dashed'', ''dotted'',
    ''solid''].'
  - 'SC-02 (both): the underfitting and overfitting zones are drawn but carry no labels,
    and both use the same INK_MUTED fill so they read as one shaded box (C5) → label
    each zone (''Underfitting'' / ''Overfitting'') and tell them apart. Likely cause:
    the rect annotation has no text and one fill.'
  - 'SC-03 (both): the x axis runs to 1.15 × the data maximum (11.5) while the data
    ends at 10, leaving about 13 % of the panel empty and the shaded zone spilling
    past the curves → limits from the data range, e.g. x_max plus a small margin (−1.5).
    Likely cause: limits=(x_min, x_max * 1.15) and xmax=x_max * 1.15.'
  - 'Suggestion: a small marker at the Total Error minimum would make the optimum
    read faster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, panel with a faint INK_MUTED 7% shaded rectangle split at the optimum.
      Chrome: title 'curve-bias-variance-tradeoff · python · plotnine · anyplot.ai' (~75% width), axis titles 'Model Complexity' / 'Prediction Error' in dark ink, ticks 'Low'/'High' and 0.00–1.25 readable. Curve labels, 'Optimal Complexity' and the formula are tiny (~3.5 pt) but dark/colored enough to make out.
      Data: Bias² #009E73 dashed falling, Variance #C475FD dashed rising, Irreducible Error #4467A3 dotted at 0.20, Total Error #BD8233 thick solid U with minimum ≈0.79 at the dashed grey vertical line; x axis extends empty to ~11.5.
      Legibility verdict: PASS (annotations small, see weaknesses)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, shaded zone slightly lighter.
      Chrome: title, axis titles and ticks in light ink, readable; no dark-on-dark text. Annotation text tiny as in light.
      Data: identical Imprint colors and line styles to the light render; only chrome flipped.
      Legibility verdict: PASS (annotations small, see weaknesses)
