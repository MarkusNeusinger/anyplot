review:
  strengths:
  - Every curve is directly labelled next to its own curve in its curve colour, clear
    of all lines, in both themes
  - One factor drives colour, linetype and linewidth through coordinated scale_*_manual
    named vectors, so the curves differ without relying on hue
  - The optimum is computed with which.min(total_error) and drives the vline, the
    zone boundary and the 'Optimal' x tick together
  - Grid at INK 15 % alpha, y-only, stays subtle on both backgrounds; zone shading
    at alpha 0.05 keeps the curves dominant
  weaknesses:
  - 'Suggestion: the in-plot "Optimal" note repeats the x-axis tick label of the same
    name; replacing it with the minimum total error value would add information.'
  - 'Suggestion: build the data as a tibble with column constants as in the library
    prompt''s data block, so the script adapts to a user''s table.'
  - 'Suggestion: drop the unused ELEVATED_BG token and the set.seed call, since the
    data is fully deterministic.'
