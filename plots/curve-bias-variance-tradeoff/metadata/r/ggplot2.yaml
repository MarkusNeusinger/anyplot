      Data: Bias² solid #009E73 falling, Variance long-dashed #C475FD rising, Total Error thick solid #4467A3 U-curve with minimum about 0.30, Irreducible Error dotted #BD8233 flat at 0.15; dashed grey vline at the optimum; each curve labelled in its colour next to it, clear of the lines; "Underfitting"/"Overfitting" labels at the top of the zones.
