      Data: Pixel-sampled the four end-of-curve on-plot labels directly: Bias²=(0,158,115)=#009E73 (brand green, correct first-series color), Variance=(68,103,163)=#4467A3 (blue), Total Error=(174,48,48)=#AE3030 (matte red), Irreducible Error=(149,68,119)=#954477 (rose). All four are now distinct — the attempt-1 collision (Irreducible Error and Total Error both rendering as #AE3030 due to a nonexistent t.muted token) is confirmed fixed.
