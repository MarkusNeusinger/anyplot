review:
  strengths:
  - 'All four curves follow the spec''s shape: bias² falls (2.4/(1+0.3c)), variance
    rises (0.005c²), the irreducible error stays flat at 0.15, and the total error
    is their computed sum. It is U-shaped and lies above the other three across the
    whole range.'
  - 'Each curve has its own color and stroke: total in brand green #009E73 with a
    solid 4 px line, bias² in lavender with long dashes, variance in blue with dots,
    and the irreducible noise floor in the theme-adaptive neutral ink with short dashes.
    Every curve is labeled in its own color at its right end, and the labels move
    apart only when two ends are close.'
  - The optimum is computed as the argmin of the total error. A ChartsReferenceLine
    marks it exactly at the curve's minimum, at c = 7.3 with error 1.17. That matches
    the analytic check 0.752 + 0.266 + 0.15 = 1.168.
  - The underfitting and overfitting zones are drawn through useXScale/useDrawingArea
    and split at the optimum. They use low-opacity inkSoft fills and letter-spaced
    uppercase labels, so the curves stay dominant in both themes.
  - The decomposition formula sits as an inkSoft subtitle under the title. It is generated
    from the column constants, so it stays legible and clear of every curve.
  - 'Idiomatic MUI X v9 composition: ChartsContainer with LinePlot, ChartsXAxis/ChartsYAxis,
    ChartsReferenceLine and custom SVG layers that read the chart''s scales through
    hooks. Per-series stroke styling uses the v9 data-series selectors, and skipAnimation
    is set.'
  weaknesses:
  - 'Suggestion: the irreducible-error line (ink, 4 4 dash, 1.5 px) and the optimum
    reference line (ink, 6 4 dash, 1.5 px) share color and weight; a distinct dash
    or weight for the reference line would separate the structural marker from the
    data curve faster.'
  - 'Suggestion: the two zone fills differ in opacity (0.07 vs 0.13), which gives
    the overfitting side more visual weight than the underfitting side without a data
    reason; equal opacities or two lightly tinted hues would read as symmetric zones.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800.
      Chrome: bold dark title "curve-bias-variance-tradeoff · javascript · muix · anyplot.ai" centered at top, with the formula "Total error = Bias² + Variance + Irreducible error" in inkSoft below it. Left and bottom axis lines only, no grid. Y-axis "Prediction error" runs 0.0–2.6 and the x-axis "Model complexity (low → high)" runs 1–20; all ticks are dark and readable. A left zone labeled "UNDERFITTING" and a right zone labeled "OVERFITTING", both in letter-spaced inkSoft caps, are split by a dashed ink vertical line at 7.3, captioned "Optimum at 7.3 (minimum total error 1.17)" near the bottom.
      Data: total error is a solid #009E73 U-curve (2.0 → min 1.17 → 2.5), bias² a lavender dashed falling curve (1.85 → 0.34), variance a blue dotted rising curve (0 → 2.0), and the irreducible error a thin dashed ink horizontal line at 0.15. Right-end labels in matching colors: Total error, Variance, Bias², Irreducible error. Bias² and variance cross near c ≈ 10.7.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, formula, axis titles, ticks, zone labels and the optimum caption all render in light ink or inkSoft and are readable. There is no dark-on-dark text, and the optimum and irreducible dashed lines flip to light ink. The zone fills are subtle lighter tints.
      Data: the green, lavender and blue curve colors are identical to the light render; only the chrome and the neutral irreducible line flip. The blue variance curve and its label have lower contrast on the dark surface but stay clearly visible. Brand green reads well.
      Legibility verdict: PASS
