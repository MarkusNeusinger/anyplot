review:
  strengths:
  - 'Correct Imprint palette usage: brand green (#009E73) for Total Error, semantic
    amber tint for the overfitting zone, and the theme-adaptive neutral ink for the
    constant Irreducible Error baseline.'
  - Custom SVG overlay built with useXScale/useYScale/useDrawingArea (community @mui/x-charts
    hooks) implements zone shading, zone labels, and direct end-of-line curve labels
    with anti-overlap stacking — genuine mastery of the library beyond basic props.
  - 'Every spec-required element is present: 4 distinctly colored/dashed curves, an
    optimal-complexity reference line with annotation, the Total Error = Bias² + Variance
    + Irreducible Error formula as a subtitle, and shaded underfitting/overfitting
    zones.'
  - Both light and dark renders are fully legible with theme-adaptive chrome and no
    dark-on-dark or light-on-light failures; data colors are identical across themes.
  - Deterministic, formula-driven data generation (no RNG needed) with the optimal
    complexity computed dynamically as the argmin of total error rather than hardcoded.
  - No overlap or edge clipping anywhere in either render, including the 'Optimal
    ≈ 7.3' annotation near the x-axis and the right-edge end-of-line labels (verified
    via close crops).
  weaknesses:
  - No grid lines at all, not even a subtle y-axis grid; given the plot's quantitative
    nature (readers estimating approximate error values), a faint horizontal grid
    would aid precision without adding clutter.
  - Title and subtitle use plain default MUI Typography styling with no custom letter-spacing/weight
    refinement, which reads slightly less 'designed' than the custom SVG-overlay parts
    of the chart.
  - End-of-line curve labels are set at 15px — fine at full resolution, but worth
    double-checking legibility when the image is scaled down to the ~400px mobile
    thumbnail.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 as required.
      Chrome: Centered dark title "curve-bias-variance-tradeoff · javascript · muix · anyplot.ai" with a smaller "Total Error = Bias² + Variance + Irreducible Error" subtitle underneath. X-axis "Model Complexity (Low → High)" from 1-20, y-axis "Prediction Error" from 0-2.6. All axis titles and tick labels render in dark ink, clearly readable against the light background.
      Data: Four curves share the same shapes as in dark mode. Total Error is a thick solid brand-green (#009E73) U-shaped curve; Bias² is a dashed lavender/purple line decreasing from ~1.85 to ~0.35; Variance is a dotted blue line increasing from ~0 to ~2.0; Irreducible Error is a thin dotted ink-colored horizontal line at 0.15. A vertical dashed reference line marks "Optimal ≈ 7.3" near the total-error minimum. Two soft shaded zones (muted gray-tan left of the optimal line labeled "UNDERFITTING", pale amber right of it labeled "OVERFITTING") divide the plot. Direct end-of-line labels (color-matched text) replace a legend, and are non-overlapping thanks to a stacking algorithm.
      Legibility verdict: PASS — no light-on-light text found anywhere; verified no clipping/overlap via pixel crops around the optimal annotation and the right-edge end labels.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 as required.
      Chrome: Same title/subtitle/axis-label layout, now rendered in light ink (#F0EFE8-family) against the dark background — fully legible, no dark-on-dark issues. Zone labels "UNDERFITTING"/"OVERFITTING" remain in a muted gray, clearly visible.
      Data: All four curve colors are pixel-identical to the light render (brand green, lavender dashed, blue dotted, ink-colored dotted irreducible line) — confirms only chrome flips between themes, not data colors. The optimal reference line switches to a light dashed stroke for contrast against the dark background, consistent with the theme-adaptive ink token.
      Legibility verdict: PASS — no dark-on-dark failures found; tick labels, axis titles, zone labels, and end-of-line curve labels are all clearly readable.
