    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "curve-bias-variance-tradeoff · javascript · d3 · anyplot.ai" in bold dark ink, italic formula subtitle "Total Error = Bias² + Variance + Irreducible Error" below it, dark axis titles "Model Complexity (Low → High)" and "Prediction Error", dark tick labels on both axes, subtle horizontal gridlines. All text is clearly readable against the light background.
