review:
  strengths:
  - 'Asia, the first entity, is drawn in brand green #009E73 and the other five continents
    follow the Imprint palette in canonical order. Ring arcs and chords keep identical
    colors in both themes.'
  - 'Chord geometry is built with geom_polygon: arc lengths are proportional to each
    entity''s total flow, the ring has gaps between arcs, and ribbon widths are proportional
    to flow at both ends. Bidirectional pairs (Asia→Europe 45 / Europe→Asia 22) show
    as separate chords.'
  - Entity labels wrap two-word names and set hjust/vjust from the arc angle, so every
    label sits outside the ring next to its arc. Short leader ticks link each label
    to the middle of its arc.
  - layer_tooltips shows 'source → target' and the flow value on hover in the HTML
    export. gggrid paints the full square canvas with the theme page color.
  - 'Chrome flips correctly in both themes (#FAF8F1 / #1A1A17): the title, labels,
    legend frame and caption are readable, with no dark-on-dark text.'
  weaknesses:
  - 'SC-01 (both): chords are split into three value tiers with alpha 0.38/0.58/0.82,
    and a caption explains that ''Opacity indicates relative strength''. This adds
    an opacity encoding that the basic spec does not ask for, on top of width → one
    alpha for all chords (about 0.6–0.7) and a caption without the opacity clause.
    Likely cause: the chord_low/chord_mid/chord_high split and the three geom_polygon
    layers.'
  - 'VQ-03 (dark): low-tier chords at alpha 0.38 in the darker hues (e.g. the navy
    Africa→North America and Africa→Asia ribbons) nearly merge with the #1A1A17 background
    → raise their opacity so they read as clearly as on light (about +0.25 alpha).
    Likely cause: alpha=0.38 on the chord_low layer.'
  - 'VQ-02 (both): the legend title ''Continent'' runs straight into the key tile
    of the first swatch column, with no gap → leave at least ~8 px between the title
    and the keys. Likely cause: the horizontal legend with the title on its left;
    set legend_title margin or put the title on top.'
  - 'VQ-05 (both): the circle fills only about 60 % of the canvas width, with a wide
    empty band (~15 % of the height) between the title and the Oceania label → shrink
    the axis limits (about ±1.45 instead of ±1.7) so the ring uses more of the square.
    Likely cause: scale_x/y_continuous limits=(-1.7, 1.7).'
  - 'Suggestion: a slightly heavier seam between the chords'' page-colored outlines
    would separate stacked chords at the arc ends more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas; the legend frame is elevated cream #FFFDF6 with a soft-ink border.
      Chrome: bold near-black title "chord-basic · python · letsplot · anyplot.ai" at top-left; bold dark continent labels (Asia, Oceania, South America and North America wrapped onto two lines, Africa, Europe) outside the ring with soft-ink leader ticks; a horizontal "Continent" legend at the bottom with six keys; an italic muted caption at bottom-right. All text is readable, and no label touches the ring.
      Data: the outer ring has six arcs whose lengths are proportional to total flow. Asia is brand green #009E73, Europe lavender #C475FD, Africa blue #4467A3, North America ochre #BD8233, South America red #AE3030, Oceania cyan #2ABCCD. Bezier ribbons take the source color, with widths proportional to flow, in three opacity tiers. Bidirectional pairs show as separate chords. There is a large empty band between the title and the circle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; the legend frame is #242420 with a light border.
      Chrome: the title, continent labels, legend text and caption are in light ink and clearly readable, with no dark-on-dark text. The leader ticks are light grey.
      Data: arc and chord colors are identical to the light render; only the chrome flipped. The low-opacity tier in dark hues (navy Africa→North America and Africa→Asia ribbons) is dim and nearly merges with the background, though it is still faintly traceable.
      Legibility verdict: PASS (text); the low-tier chords are dim in dark.
