review:
  strengths:
  - Bidirectional pairs drawn as one ribbon whose width at each end equals that direction's
    flow, anchored on per-target sub-arcs, exactly as the spec allows
  - Each ribbon takes the color of the pair's dominant sender, so net direction reads
    without arrows
  - 'Composition API used idiomatically: ChartsContainer with a custom layer whose
    geometry comes from useDrawingArea'
  - Anchor-aware radial labels with a bold entity name over a softer outbound total,
    readable in both themes
  - Theme tokens threaded through all chrome; page-colored separator strokes keep
    crossing ribbons distinguishable on both backgrounds
  - Hover tooltips in the HTML output give both directional values per ribbon and
    the outbound total per arc
  weaknesses:
  - 'DQ-03 (code): the 30 flows sum to 50.0 M migrants per year, with Asia to N. America
    at 7.8 M/yr, several times real annual inter-continental migration (UN/Abel estimates
    put global flows at roughly 40–60 M per five years) → either relabel the measure
    as per five-year period or scale the values down about fivefold (total ≈ 10 M/yr).
    Likely cause: the VALUE column name "Migrants per year (millions)" combined with
    five-year-scale numbers in the data block.'
  - 'Suggestion: the subtitle repeats ''15 connected pairs (15 with flows in both
    directions)''; a shorter subtitle would leave the title more room to lead.'
  - 'Suggestion: MUI X''s own tooltip slot styling (or a custom tooltip content) would
    match the theme better than the native SVG title tooltips in the HTML output.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: dark bold title "chord-basic · javascript · muix · anyplot.ai" centred at top, grey subtitle "6 entities · 15 connected pairs (15 with flows in both directions) · Total 50.0", grey footer note explaining that each chord carries both directions and arc length is total outbound migrants per year (millions). Six entity labels (Asia, Africa, Europe, N. America, S. America, Oceania) in bold dark ink with a grey "X.X out" total beneath, placed radially outside the ring — all readable.
      Data: ring of six solid arcs — Asia #009E73 (largest, right), Africa lavender, Europe blue, N. America ochre, S. America matte red, Oceania cyan (smallest, top) — separated by small gaps. Translucent ribbons (≈0.62 opacity, thin off-white outlines) connect every pair; wide green ribbons from Asia to N. America and Europe, a wide lavender Africa–Europe ribbon, hair-thin Oceania chords. Crossings blend but remain distinguishable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, entity labels in light ink, subtitle, value sublabels and footer in light grey — all readable, no dark-on-dark text.
      Data: arc colors identical to the light render; ribbons use the same hues at the same opacity, appearing deeper against the dark page, with dark outlines separating them. Brand green clearly visible.
      Legibility verdict: PASS
