review:
  strengths:
  - Bidirectional flows drawn as one ribbon whose width at each end equals that direction's
    flow (matrix[i][j] at the source arc, matrix[j][i] at the target arc), exactly
    as the spec allows
  - Uses the MUI X v9 composition API (ChartsContainer + useDrawingArea) to add a
    chord layer the community package lacks, sized to the drawing area and with skipAnimation
  - Native SVG <title> tooltips on ribbons and arcs give both directional values in
    the interactive HTML
  - 'Theme tokens threaded through every text and separator stroke: entity names,
    value sublabels, subtitle and footer all readable on #FAF8F1 and #1A1A17, data
    colors identical across themes'
  - Two-level arc labels (bold name over soft outbound total) with side-aware text
    anchors keep labels clear of the ring
  weaknesses:
  - 'Suggestion: the subtitle''s ''(15 with flows in both directions)'' repeats ''15
    connected pairs'' for this data; dropping it would tighten the header.'
  - 'Suggestion: MUI X''s ChartsTooltip slot styled from the theme could replace the
    native SVG <title> tooltips for a tooltip that matches the MUI chrome.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: centred bold title "chord-basic · javascript · muix · anyplot.ai", muted subtitle "6 entities · 15 connected pairs (15 with flows in both directions) · Total 50.0", footer caption naming the value and its units. Entity labels (Asia, Africa, Europe, N. America, S. America, Oceania) in bold dark ink with "X.X out" sublabels in soft ink beside each arc. All readable.
      Data: six solid outer arcs in Imprint order — Asia #009E73 (largest, right side), Africa purple, Europe blue, N. America ochre, S. America red, Oceania cyan — separated by even gaps. 15 translucent ribbons through the interior, each colored by its dominant direction, with unequal end widths for asymmetric pairs (e.g. Asia–N. America wide at Asia, narrow at N. America). Thin page-colored outlines separate overlapping ribbons.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, entity names in light ink, subtitle, sublabels and footer in light soft ink; no dark-on-dark text.
      Data: arc and ribbon colors identical to the light render; ribbons read darker because the 0.62 opacity blends with the dark page, but each remains distinguishable, with dark separator outlines. Brand green arc clearly visible.
      Legibility verdict: PASS
