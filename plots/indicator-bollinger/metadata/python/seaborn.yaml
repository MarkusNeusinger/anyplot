review:
  strengths:
  - Bollinger math computed in the data block from pandas rolling windows (close.rolling(window=20).mean()/.std(),
    SMA ± 2σ), and the leading rows without a full period are dropped, so every band
    sits at its computed value and starts only where a full 20-day window exists
  - 'The price is drawn prominently in Imprint green #009E73 (1.6 pt, the heaviest
    stroke, drawn last on top), the bands share one color (#4467A3) with a semi-transparent
    fill (alpha 0.2), and the SMA is a dashed purple line, so price and middle band
    stay readable through the fill in both themes'
  - 'Theme tokens are threaded through sns.set_theme rc (page, ink, soft ink, elevated
    legend face), so the chrome flips correctly between #FAF8F1 and #1A1A17 while
    the data colors stay identical'
  - The parameters are stated in the legend labels ('20-Day SMA', 'Upper Band (+2σ)',
    'Lower Band (−2σ)'), and the seeded synthetic series shows the bands widening
    in the volatile February–March stretch and narrowing into a squeeze in April and
    May
  - Canvas is exactly 3200×1800 (figsize 8×4.5 at dpi 400, no bbox_inches='tight'),
    and the layout is set with subplots_adjust
  weaknesses:
  - 'Suggestion: Upper and Lower Band have identical legend glyphs, so one ''Bands
    (±2σ)'' entry beside ''Band Range'' would make the legend shorter.'
  - 'Suggestion: the short ''YYYY-MM'' tick labels fit horizontally, so the 30° rotation
    from fig.autofmt_xdate could be dropped.'
  - 'Suggestion: plot the series in long form with one sns.lineplot(hue=..., style=...)
    call instead of four separate calls. That is the more idiomatic seaborn approach.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold near-black title 'indicator-bollinger · python · seaborn · anyplot.ai' at the top (about 58 % of the width). Axis titles 'Date' and 'Price (USD)' in dark ink. Soft dark-grey ticks (125–165 on y, 2024-02…2024-06 on x, rotated 30°). Subtle horizontal grid only. Top and right spines removed. Legend at the top right on an elevated off-white face with a soft-ink frame. All text is readable.
      Data: blue (#4467A3) upper and lower band lines with a light blue-grey semi-transparent fill between them. Dashed purple (#C475FD) 20-day SMA midway between the bands. Green (#009E73) close-price line, the heaviest stroke, on top. The bands are wide in February/March, narrow in April–May, and the price rides the lower band in Feb–Mar and touches the upper band in mid-April and early May. The series runs from late Jan to mid-June 2024 (101 days after the 20-day warm-up).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
