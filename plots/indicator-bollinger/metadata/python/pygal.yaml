review:
  strengths:
  - 'Clear stroke hierarchy: the close is a 7 px Imprint-green line, the 20-day SMA
    a thin dashed ink line, the bands one shared purple (#C475FD) with an 18 % fill,
    so price and middle band stay visible through the fill in both themes'
  - The bands are computed from the close with a 20-day rolling window and start only
    where a full window exists; the legend label 'Bollinger bands (±2σ)' and '20-day
    SMA' notes the parameters
  - 'pygal-native techniques: DateTimeLine with an x_value_formatter for month ticks,
    per-series stroke_style dasharray, inline CSS to give single series their own
    stroke widths, and a closed polygon series for the band fill'
  - 'Theme tokens threaded through the Style object: warm off-white and near-black
    backgrounds, legible ink text in both renders, and the SMA flips from ink-dark
    to ink-light with the theme'
  - Interactive HTML output with pygal's native hover tooltips
  weaknesses:
  - 'VQ-05 (both): each legend swatch sits flush against its label with no gap (''■Bollinger
    bands'', ''■Close''), and the three entries are spread across the full width so
    ''Close'' sits far right, detached from the others → about 0.5 em between swatch
    and label and a tighter grouping of the entries. Likely cause: legend_box_size=40
    with legend_at_bottom_columns=3 over the 3200 px width.'
  - 'DQ-02 (both): the series names no instrument, only ''Price (USD)'', so the stock
    reads as a generic random walk → name a fictional ticker or company in the y-axis
    title or the Close legend entry. Likely cause: the CLOSE constant and the legend
    label ''Close''.'
  - 'Suggestion: a squeeze annotation where the bands narrow in late March to April
    would add the storytelling layer the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title 'indicator-bollinger · python · pygal · anyplot.ai' centered at top in dark ink; y-axis 'Price (USD)', x-axis 'Trading date'; y ticks 128–164 in steps of 4, x ticks Feb 2024–Jun 2024; subtle horizontal guides only; legend at bottom with three entries. All text readable.
      Data: close price as a thick #009E73 line across all 120 trading days; upper and lower bands in purple #C475FD with a light purple semi-transparent fill, starting at the 20th day (late January); 20-day SMA as a thin dashed dark-ink line midway between the bands. Bands widen during the February sell-off and narrow from late March, price pierces the upper band in mid-April.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend in light ink, all readable; no dark-on-dark text; guides subtle.
      Data: green close and purple bands identical to the light render; fill reads as a muted purple over the dark surface; the SMA flips to a light dashed ink line and remains visible.
      Legibility verdict: PASS
