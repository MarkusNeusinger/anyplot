review:
  strengths:
  - The close price is drawn prominently as a 7 px Imprint-green line, the upper and
    lower bands share one purple (#C475FD) with an 18 % fill between them, and the
    20-day SMA is a dashed neutral ink line; all three stay visible through the fill
    in both themes
  - Bands are computed from the close price with pandas rolling(20) mean and population
    std, and start only where a full 20-day window exists, so every line sits at its
    computed value
  - Uses pygal DateTimeLine with a per-series stroke_style dasharray, allow_interruptions
    and None-titled series so the lower band and the fill polygon share the single
    'Bollinger (±2σ)' legend entry
  - Theme tokens are threaded through Style (background, foreground, guide colors),
    so chrome flips correctly while the data colors stay identical
  - 'Native pygal interactivity: the HTML output carries per-point tooltips for close,
    SMA and bands'
  weaknesses:
  - 'Suggestion: a slim band-width panel or a note at the late-April/May squeeze would
    add the secondary indicator the Notes mention.'
  - 'Suggestion: the gap between the x tick labels, the ''Trading date'' title and
    the legend row could be tightened to give the plot area more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "indicator-bollinger · python · pygal · anyplot.ai" in dark monospace at about 61 % of the width; y-axis title "Northwind Rail (NWRL) close, USD" (rotated), x-axis title "Trading date"; y ticks 128–164 in steps of 4, monthly x ticks Feb–Jun 2024; subtle horizontal guides only; legend row at the bottom. All readable.
      Data: close price as a thick #009E73 line over 120 business days starting about 151, peaking about 161 in mid-January and falling to about 128 in April before recovering to about 136; upper and lower bands in #C475FD with a light purple fill from late January; dashed near-black 20-day SMA midway between them. The price pierces the lower band in March and the upper band in mid-April. The bands narrow clearly in late April/May.
      Legibility verdict: PASS

