review:
  strengths:
  - Bitcoin hourly scenario with a calm squeeze, a single sharp overnight gap and
    a choppy regime shows band contraction, explosive widening and a band pierce in
    one view
  - Bands computed with pandas rolling mean/std and drawn with geom_ribbon plus dashed
    edges and a dotted middle band, clearly told apart from the green price
  - Theme tokens threaded through every chrome element; both renders fully legible
    on the correct surfaces
  - Adaptable column constants with role comments, so the same code plots a user's
    own table
  - Subtitle states the 20-period / ±2σ parameters
  weaknesses:
  - 'VQ-07 (both): the bands, the second series, are drawn in Imprint position 3 #4467A3
    while position 2 #C475FD is skipped with no semantic reason → use positions in
    canonical order (IMPRINT_PALETTE[1] for the bands). Likely cause: band_color =
    IMPRINT_PALETTE[2].'
  - 'Suggestion: the seven daily date ticks fit horizontally; dropping the 45° rotation
    would read more easily.'
  - 'Suggestion: thousands separators on the price ticks (65,000) would ease reading
    the BTC prices.'
