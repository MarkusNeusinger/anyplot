review:
  strengths:
  - 'Imprint positions 1-3 with a clear hierarchy: prominent 1.75 px green price,
    dashed purple SMA, thin blue band edges over a 0.2 translucent fill, identical
    in both themes'
  - Native alt.layer composition with mark_area y/y2 for the envelope sharing one
    escaped x encoding and one data-derived y scale
  - Bands computed with pandas rolling(20) mean/std and the warm-up rows dropped,
    so every line sits at its computed value
  - Canvas padded (never cropped) to exactly 3200x1800; theme tokens threaded through
    all chrome
  - Column constants with Vega-Lite field escaping, so the data block can be swapped
    for a real CSV
  weaknesses:
  - 'SC-04 (both): no legend identifies the three series — the green price, the dashed
    purple 20-day SMA and the blue band envelope are told apart only by color and
    stroke, so a reader cannot tell which line is the SMA → a legend (or direct labels)
    naming Close price, 20-day SMA and Upper/lower band. Likely cause: every layer
    sets a fixed mark color instead of a color encoding with a legend.'
  - 'DE-02 (both): a vertical grid line at every weekly tick (about 20 lines) on a
    line chart, against the style guide''s y-axis-grid-only rule for line charts →
    horizontal grid only. Likely cause: configure_axis gridColor applies to the x
    axis too; set alt.Axis(grid=False) on x_enc.'
  - 'CQ-01 (code): lines 63-64 define a helper function y_enc for the y encodings
    → inline the five alt.Y(...) encodings or use one shared base chart. Likely cause:
    a helper used to share the y scale.'
  - 'Suggestion: tooltips on the price layer (date, close, SMA, bands) would make
    the HTML view inspectable.'
