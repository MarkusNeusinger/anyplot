  strengths:
  - Native bokeh Band annotation draws the semi-transparent envelope between upper
    and lower bands from the same ColumnDataSource
  - HoverTool in vline mode with a datetime formatter gives per-day close, SMA and
    band values in the HTML output
  - Price line in brand green at width 5 is the clear focal series; dashed SMA in
    the band color tells it apart
  - 'Theme tokens threaded through every chrome element: both renders fully readable
    with identical data colors'
  - 'Adaptable structure: column constants, one data block, plot code reading only
    df'
  weaknesses:
  - 'Suggestion: place the legend inside the empty upper-right corner of the plot
    area so the price chart can use the full width instead of leaving an empty column
    below the legend.'
  - 'Suggestion: a slightly brighter band edge in the dark render would separate the
    envelope from the background more clearly.'
