review:
  strengths:
  - Close price drawn clearly thicker than the band edges, which sit at alpha 0.7
    behind it
  - Translucent shared-color fill keeps price and SMA visible in both themes
  - Theme tokens threaded through all chrome; both renders readable
  - Example data shows band expansion, a May squeeze and band piercings
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2700, not one of the canonical sizes → 3200x1800
    (−1600 × −900). Likely cause: ggsize(1600, 900) with ggsave scale=3 instead of
    ggsize(800, 450) with scale=4.'
  - 'SC-04 (both): the title reads ''indicator-bollinger · letsplot · anyplot.ai''
    without the language segment → ''indicator-bollinger · python · letsplot · anyplot.ai''.
    Likely cause: the labs(title=...) string.'
  - 'SC-04 (both): no legend is drawn, so the price, the SMA and the band lines cannot
    be identified → a legend naming the close price, the 20-day SMA and the ±2σ bands.
    Likely cause: aes(color="...") mappings overridden by fixed color= and fill= arguments
    in every geom.'
  - 'DE-02 (both): the panel is boxed on all four sides and a dense full-opacity INK
    grid with minor lines runs on both axes, short of the L-frame and subtle-grid
    baseline → no top/right frame and a y-only grid at about 15 % opacity. Likely
    cause: panel_background element_rect default border and panel_grid_major/minor
    color=INK.'
  - 'CQ-03 (code): ''from lets_plot import *'' with ''# ruff: noqa: F403, F405'' imports
    every name → explicit imports of the used functions. Likely cause: the star import
    on line 17.'
  - 'CQ-04 (code): lines 6–11 repeat the docstring header, and the aes(color=...,
    fill=...) mappings on lines 61–70 are overridden by fixed colors and have no effect;
    the comments call the palette ''Okabe-Ito'' → remove the second header and the
    dead mappings, name the palette Imprint. Likely cause: leftovers from an earlier
    version.'
  - 'Suggestion: classic Bollinger Bands use the population standard deviation (ddof=0).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on a 4800x2700 canvas.
      Chrome: title 'indicator-bollinger · letsplot · anyplot.ai' top-left in dark ink; 'Date' and 'Price (USD)' axis titles; weekly date ticks (Jan 22–Jun 17) and price ticks every 2 USD; all readable. Four-sided panel frame and a dense black major+minor grid on both axes. No legend.
      Data: thick green #009E73 close price, thin blue #4467A3 band edges at alpha 0.7 with a translucent blue fill, dashed blue SMA. Bands widen in Feb–Mar and squeeze in May.
