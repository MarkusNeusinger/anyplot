review:
  strengths:
  - Bands share Imprint purple with a 0.18-alpha tonexty fill, so the green price
    and the dashed blue SMA read clearly through it in both themes
  - Exact 3200x1800 canvas with title, legend and plot area cleanly separated
  - Standard 20-period / 2σ parameters stated in the legend labels and driven by WINDOW
    and NUM_STD constants
  - hovermode='x unified' with per-trace $ hovertemplates gives one readout of price,
    SMA and both bands in the HTML
  weaknesses:
  - 'DQ-02 (both): the series is an unnamed ''Close price ($)'' with no instrument
    or ticker, so the scenario reads as a generic stock → name a plausible fictional
    instrument in the axis or legend label (e.g. a sector ETF). Likely cause: the
    CLOSE column label.'
  - 'Suggestion: plotly rangebreaks (bounds=[''sat'',''mon'']) would remove the straight
    weekend segments on the business-day series.'
  - 'Suggestion: the separate ''Upper band'' and ''Lower band'' legend entries share
    one glyph; one legend entry (legendgroup) for both lines would shorten the legend.'
