review:
  strengths:
  - 'Correct Bollinger structure: prominent solid price line, dashed 20-day SMA, shared-color
    upper/lower bands with a 0.15 alpha ribbon, all on one price axis'
  - Theme tokens threaded through every chrome element; data colors identical in light
    and dark
  - Graded line weight and alpha separate price, middle band and band edges without
    extra colors
  - 'Follows the adaptable-code layout: column constants, a tibble built with !!COL
    :=, plot reads .data[[...]]'
  - scale_x_date(date_labels = '%b') gives clean month ticks
  weaknesses:
  - 'DQ-03 (both): the bands for dates 2-19 come from partial windows (2 to 19 prices)
    rather than the 20-period SMA and standard deviation the chart claims; window_start
    = pmax(i - 19, 1) draws a ribbon from Jan 2 that is not a 20-day Bollinger band
    → start SMA and bands at the 20th period (NA before; the spec permits bands beginning
    only where a full period is available). Likely cause: the pmax(seq_len(n_periods)
    - sma_period + 1, 1) partial-window start.'
  - 'Suggestion: label the price, 20-day SMA and ±2σ bands (a compact legend or direct
    labels at the right edge) so readers outside finance can tell the three green
    lines apart.'
