review:
  strengths:
  - Clean idiomatic Makie composition (Figure/Axis, band!, lines!, Legend with explicit
    handles, colsize! for the legend column) with no functions/classes
  - 'Engineered data tells a clear technical-analysis story: a calm opening, a volatility
    squeeze (narrow bands), and a breakout where price pierces the upper band repeatedly'
  - 'Theme-adaptive chrome correctly threaded through every element (title, axis labels,
    ticks, spines, grid) and identical between light/dark renders; first series is
    the mandated brand green #009E73'
  - 20-day SMA rendered with the theme-adaptive INK token as a dashed reference line
    -- a correct, idiomatic use of the 'neutral' semantic anchor rather than spending
    a categorical palette slot on it
  - All font sizes explicitly set (titlesize=20, xlabelsize/ylabelsize=14, tick label
    sizes=12); L-shaped spines (top/right removed); generous whitespace; no clipping
    at any canvas edge
  weaknesses:
  - Band envelope uses IMPRINT_PALETTE[3] (blue) while IMPRINT_PALETTE[2] (lavender)
    is skipped entirely -- with only 2 true categorical series (price=pos1, bands=pos3)
    this reads as cherry-picking rather than canonical 1->N order; either use IMPRINT_PALETTE[2]
    for the bands or drop to a single categorical series plus the neutral anchor with
    a documented semantic reason for jumping to blue
  - Both xgridcolor and ygridcolor are enabled; the style guide recommends Y-axis-only
    grid for line/time-series charts -- set xgridvisible=false (or omit xgridcolor)
    to reduce visual noise from the vertical gridlines
  - Design storytelling is good but stops at 'default + hierarchy' -- the spec explicitly
    suggests 'showing band width as a secondary indicator or noting squeeze patterns';
    a small linked sub-panel (band width = upper_band .- lower_band) or a lightweight
    annotation marking the squeeze/breakout zones would push this from good to publication-quality
    and raise DQ-01/DE-03
  - Library Mastery usage is solid but generic relative to Makie's distinctive strengths
    -- consider a linked multi-panel layout (e.g. price+bands on top, band-width or
    volume on a second linked Axis) to showcase Makie's GridLayout/linkxaxes! capabilities,
    which are hard to replicate as directly in other libraries
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "indicator-bollinger · julia · makie · anyplot.ai" in bold dark ink, clearly visible; "Date" and "Price (USD)" axis labels in dark ink; tick labels in a softer gray -- all readable. L-shaped spines (top/right removed). Subtle vertical + horizontal gridlines at low opacity, not competing with data. Legend at right ("Close price", "20-day SMA", "Bands (±2σ)") with no visible frame, text in dark ink, readable.
      Data: Brand-green (#009E73) close-price line is prominent and unambiguous; a black dashed 20-day SMA line (theme ink, not a categorical color) runs through the middle; a blue (#4467A3) semi-transparent band envelope (~18% alpha) fills the ±2σ range with matching blue border lines. The chart shows a calm opening, a mid-chart volatility squeeze (narrow bands), and a late breakout where the green line pierces the upper band repeatedly.
      Legibility verdict: PASS -- no dark-on-light or overlap issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light tones (near-white for primary text, lighter gray for tick labels) and remain clearly legible against the dark background. Spines/gridlines flipped to light-on-dark equivalents at the same subtle opacity. Legend text is light-colored and readable.
      Data: Close-price line is the identical brand green (#009E73), band envelope is the identical blue (#4467A3) with matching alpha -- confirmed unchanged from the light render. The SMA reference line flips from black to white (correct, since it uses the theme-adaptive INK/neutral token rather than a fixed categorical color).
      Legibility verdict: PASS -- no dark-on-dark failures found; all text and data elements are clearly distinguishable from the near-black surface.
