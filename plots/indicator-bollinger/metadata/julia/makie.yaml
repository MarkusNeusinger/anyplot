review:
  strengths:
  - 'All three attempt-1 weaknesses cleanly fixed: band envelope now uses IMPRINT_PALETTE[2]
    (lavender) in canonical 1→N order, grid is now y-axis-only, and a new linked band-width
    sub-panel visualizes the squeeze/breakout pattern the spec suggested'
  - Linked multi-panel layout (linkxaxes!, GridLayout with rowsize!/colsize!) is genuinely
    idiomatic Makie usage that showcases the library's layout strengths
  - 'Engineered data tells a clear technical-analysis story: calm opening, volatility
    squeeze (narrow bands), then breakout with price piercing the upper band — now
    made explicit by the band-width sub-panel'
  - 'Theme-adaptive chrome correctly threaded through both panels and identical between
    light/dark renders; first series is the mandated brand green #009E73; SMA correctly
    uses the theme-adaptive INK/neutral token rather than a categorical color'
  - All font sizes explicitly set, L-shaped spines, generous whitespace, no clipping
    at any canvas edge in either theme
  weaknesses:
  - Band-width sub-panel y-axis label ('Band width') has no unit suffix even though
    the value is in the same USD units as the price panel — a minor missed opportunity
    for full VQ-06 polish
  - Legend column leaves a small strip of unused whitespace to its right; tightening
    colsize! slightly would let the plot area breathe a touch more
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "indicator-bollinger · julia · makie · anyplot.ai" centered at top; dark "Price (USD)" / "Date" / "Band width" axis labels; softer gray tick labels on both panels. L-shaped spines (top/right removed) on both the price panel and the band-width sub-panel. Grid is now y-axis-only (subtle, low-opacity horizontal lines) — the x-grid seen in attempt 1 has been removed. Legend at right ("Close price", "20-day SMA", "Bands (±2σ)"), frameless, dark readable text. All text is clearly readable against the light background.
      Data: Brand-green (#009E73) close-price line is prominent (linewidth=3); a black dashed 20-day SMA (theme ink/neutral token, not a categorical color) runs through the middle; a lavender (#009E73-palette position 2, #C475FD) semi-transparent band envelope fills the ±2σ range, matched by a lavender line in the new lower band-width sub-panel showing the squeeze (Mar–Apr) and two expansion/breakout phases (mid-Feb, late-May/Jun) where price pierces the upper band.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light tones (white/light-gray) and remain clearly legible on both panels. Spines and gridlines flipped to their light-on-dark equivalents at the same subtle opacity. Legend text is light-colored and readable, no frame.
      Data: Data colors are confirmed identical to the light render — the brand-green close-price line and lavender band envelope/band-width line are unchanged; only the SMA reference line flips from black to near-white, correct since it uses the theme-adaptive ink/neutral token rather than a fixed categorical hex. No dark-on-dark failures anywhere — all chrome and data are clearly distinguishable from the near-black surface.
      Legibility verdict: PASS
