review:
  strengths:
  - New squeeze/breakout callout plugin directly resolves the prior review's data-storytelling
    gap - clean dashed leader lines and labels that don't collide with any data or
    axis text in either theme
  - Band fill alpha raised from 0.15 to 0.2 gives the Bollinger envelope more visual
    weight without competing with the bold close-price line
  - Y-axis grid now uses an explicit, tuned rgba(ink,0.1) instead of the flat default
    token, matching the polish already applied to the removed x-axis grid
  - Theme-adaptive chrome remains fully correct in both renders; Imprint palette data
    colors (green close price, lavender SMA, blue band) are identical across light
    and dark
  - Deterministic fixed-seed LCG random walk produces a realistic BTC/USD series that
    shows both a genuine squeeze (narrow band) and a genuine breakout (price piercing
    the upper band)
  weaknesses:
  - DE-01 could still edge higher with an even more distinctive palette/typography
    treatment - marginal, non-blocking polish note
