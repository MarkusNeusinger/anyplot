review:
  strengths:
  - 'Idiomatic Chart.js area-between-lines technique (fill: "-1") correctly renders
    the Bollinger envelope from the upper/lower band datasets'
  - Deterministic fixed-seed LCG random-walk generates realistic BTC/USD price data
    that both squeezes (Mar 19-Apr 6) and expands/breaks out (Apr 15+, May 12), showing
    the full range of Bollinger Band behavior
  - Theme-adaptive chrome is fully correct in both renders; Imprint palette data colors
    (green close price, lavender SMA, blue band) are identical across light and dark,
    only chrome flips
  - 'Clear visual hierarchy through line weight: bold 3px green close-price line reads
    as the focal series over the thinner dashed SMA and 1.5px band border'
  - Legend filter callback collapses the upper/lower band datasets into a single "Bollinger
    Band (±2σ)" entry, avoiding a redundant legend item
  weaknesses:
  - Design Excellence reads as well-configured and thoughtfully colored rather than
    publication-ready — no annotation or callout marks the visible squeeze period
    or a breakout point, which would sharpen the data storytelling
  - Grid/spine refinement is good (x-axis grid removed) but not maximal — the y-axis
    grid still uses a fairly standard weight; could be pushed more subtle
  - Band fill alpha (0.15) is quite light — a touch more visual weight on the envelope
    (without competing with the close-price line) would improve element visibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Bold dark title "indicator-bollinger · javascript · chartjs · anyplot.ai" centered at top; legend row below title with three swatches (Bollinger Band filled box, SMA dashed lavender line, Close Price green line); "Date" and "Price (USD)" axis titles in dark ink; y-axis tick labels ($34,000-$46,000) and x-axis date ticks (Mar 1-May 21) in slightly softer dark gray; horizontal grid lines subtle, x-axis grid removed. All chrome text is clearly legible against the light background.
      Data: Green (#009E73) close-price line is the boldest element; dashed lavender (#C475FD) SMA line; blue (#4467A3) band border lines with a light blue-gray semi-transparent fill between them. Band is absent for the first ~18 days (20-day warm-up window), which is expected/correct behavior.
      Legibility verdict: PASS - no light-on-light issues, all text readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title and legend layout, now in light/white text; axis titles in light ink, tick labels in a softer light gray; grid lines subtle and visible against the dark surface. No dark-on-dark failures observed - every title, axis label, and tick label is clearly visible.
      Data: Same green close-price line, lavender dashed SMA, and blue band border/fill as the light render - colors are identical between themes, confirming only chrome (background, text, grid) flipped. The band fill reads as a darker navy overlay appropriate for the dark surface.
      Legibility verdict: PASS - all text and data elements clearly legible, brand green remains vivid on the dark background.
