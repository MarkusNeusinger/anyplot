review:
  strengths:
  - Bollinger statistics computed in the data block (20-day window, population σ,
    2σ multiple) so every band sits at its computed value, and bands begin only where
    a full period exists
  - 'Clear line-weight hierarchy: 3.5 px green price over a 2.5 px dashed purple SMA
    over 1.5 px blue bands, with the 0.16-opacity shared band fill letting price and
    SMA show through in both themes'
  - Custom BandFill SVG layer composed inside ChartsSurface via useXScale/useYScale,
    handling null runs, plus data-series CSS selectors for per-series stroke styling
    — idiomatic MUI X v9 composition
  - Squeeze note in the subtitle is computed from the data (narrowest band 1.4 % of
    SMA on Apr 8, 2024) and agrees with where the bands visibly pinch
  - Axis-triggered ChartsTooltip and ChartsAxisHighlight give per-date inspection
    of all four values in the HTML view
  weaknesses:
  - 'VQ-06 (both): the y-axis title reads ''MRDN close (USD)'' although the axis carries
    the close, the SMA and both bands → a title for the shared price axis, e.g. ''MRDN
    price (USD)''. Likely cause: yAxis label set to the CLOSE column constant.'
  - 'Suggestion: the upper and lower band legend entries are identical blue line swatches;
    a single ''Bollinger bands (SMA ± 2σ)'' entry with a fill swatch would read faster.'
  - 'Suggestion: a ''Jan'' label at the left edge of the time axis would anchor the
    first four weeks, which currently have no tick.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1), not pure white.
      Chrome: bold dark title "indicator-bollinger · javascript · muix · anyplot.ai" centred at top, soft-ink subtitle "120 periods, Jan 2, 2024 – Jun 17, 2024 · narrowest band 1.4 % of the SMA on Apr 8, 2024", horizontal legend of four line swatches, y-axis "MRDN close (USD)" with ticks 162–182, x-axis "Trading date" with month ticks Feb 1 … Jun 1. Subtle horizontal grid only. All text readable.
      Data: thick #009E73 close line, dashed purple 20-day SMA, thin blue upper/lower bands with a translucent blue-grey fill starting Jan 29; bands pinch around early April and widen strongly in May–June; price pierces the bands a few times.
      Legibility verdict: PASS

