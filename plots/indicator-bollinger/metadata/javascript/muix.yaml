review:
  strengths:
  - Uses the MUI X v9 composition API (ChartsDataProvider + ChartsWrapper + ChartsSurface)
    with a custom BandFill layer that reads useXScale/useYScale, so the semi-transparent
    fill between the bands sits in the chart's own coordinate system and lines up
    with the band lines on every date
  - Bollinger values are computed from the generated closes (20-day window, 2σ, population
    SD), and the bands start only where a full window exists, at Jan 29
  - 'Clear stroke hierarchy: the close at 3.5 px in brand green, the SMA at 2.5 px
    dashed in lavender, both bands at 1.5 px in one shared blue with 0.16 fill opacity,
    so price and SMA stay visible through the fill in both themes'
  - The data shows a calm stretch that visibly squeezes the bands (around late March/early
    April) and a volatile run in May–June that widens them, with the price piercing
    the bands several times
  - The subtitle states the period range and the computed tightest squeeze (1.4 %
    of the SMA on Apr 8, 2024), and that date matches where the bands narrow in the
    render
  - Native axis tooltip and x-axis highlight (ChartsTooltip trigger="axis", ChartsAxisHighlight)
    give per-date values in the HTML view; series are styled with v9 data-series CSS
    selectors
  weaknesses:
  - 'Suggestion: a light marker at the Apr 8 squeeze (the spec allows a squeeze annotation)
    would show where the subtitle''s narrowest band sits on the chart.'
  - 'Suggestion: no January tick label means the first month on the x axis is unlabeled;
    a Jan tick or domainLimit "nice" would anchor the start date.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: bold dark title "indicator-bollinger · javascript · muix · anyplot.ai" centered at top, grey subtitle "120 periods, Jan 2, 2024 – Jun 17, 2024 · narrowest band 1.4 % of the SMA on Apr 8, 2024", horizontal legend of four line entries (MRDN close, 20-day SMA, Upper band SMA + 2σ, Lower band SMA − 2σ), y axis "MRDN price (USD)" with ticks 162–182, x axis "Trading date" with month ticks Feb 1–Jun 1, subtle horizontal grid lines. All text dark and readable.
      Data: close as a thick #009E73 line across all 120 days; dashed lavender (#C475FD) SMA from Jan 29; upper and lower bands as thin blue (#4467A3) lines with a semi-transparent blue-grey fill between them, starting at Jan 29. Bands narrow in late March/early April and widen in May–June; the price pierces the bands several times.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, axis titles and tick labels flip to light ink and are all readable; grid lines are dim but visible; no dark-on-dark text.
      Data: identical colors to the light render (green close, lavender dashed SMA, blue bands with translucent fill); the fill reads as a dark navy veil and the price and SMA stay clearly visible through it.
      Legibility verdict: PASS
