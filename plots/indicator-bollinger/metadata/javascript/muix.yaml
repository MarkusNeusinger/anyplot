review:
  strengths:
  - Creative use of a stacked-area pair (invisible lowerBand base + visible bandWidth
    delta) to render a translucent Bollinger band fill, since MUI X community LineChart
    has no native range/band series — a genuine distinctive-feature use of the library.
  - 'Correct, deliberate Imprint color hierarchy: brand green (#009E73) reserved for
    the primary MRDN Close line (the semantically most important series), lavender
    dashed for the 20-day SMA, blue translucent fill for the band — plus a dashed
    stroke on the SMA as a redundant (non-color) differentiator for accessibility.'
  - Deterministic fixed-seed LCG data generation with explicit squeeze (days 40-65,
    low volatility) and breakout (days 90+, high volatility) regimes, so the bands
    visibly narrow and then widen — directly demonstrates the spec's 'Notes' guidance
    about squeeze/breakout patterns.
  - 'Clean theme handling in both renders: warm off-white / near-black backgrounds,
    fully legible chrome, identical data colors between light and dark, subtle horizontal-only
    grid, minimal spines (only left/bottom axis lines).'
  - No edge clipping, no text/data overlap, balanced axis label and tick sizing between
    X and Y axes.
  weaknesses:
  - Title occupies only ~35-40% of plot width at fontsize 22 — below the style guide's
    ~50-70% comfortable range (no deduction taken since it is fully legible and not
    squeezed, but a slightly larger fontsize would give it more visual weight consistent
    with other implementations).
  - The legend swatch for 'Bollinger Band (SMA ± 2σ)' renders as a fully opaque blue
    square while the actual area fill uses 16% alpha — a minor mismatch between the
    legend affordance and the rendered fill; consider a lighter/semi-transparent custom
    legend swatch if MUI X's slotProps allow it.
  - The spec's 'consider showing band width as a secondary indicator or noting squeeze
    patterns' is only implicitly conveyed through the data's visible narrowing/widening
    — no explicit annotation or reference line calls out the squeeze/breakout regions
    for a viewer scanning without prior context.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme surface — not pure white, not dark.
      Chrome: Title "MRDN · indicator-bollinger · javascript · muix · anyplot.ai" in bold dark text, top-left, fully visible and not clipped. Legend centered below the title with three entries: a blue swatch for "Bollinger Band (SMA ± 2σ)", a lavender swatch for "20-Day SMA", and a green swatch for "MRDN Close". Y-axis titled "Price (USD)" with $-formatted ticks from $156 to $184; X-axis titled "Trading Date" with weekly date ticks from Dec 31 to Jun 23. Subtle horizontal gridlines only, dark ink axis lines on the left/bottom only (no top/right frame). All text is clearly readable against the light background — dark ink on cream, no light-on-light issues anywhere.
      Data: A thick green line (MRDN Close, #009E73 brand green) is the most visually prominent series, tracing a volatile price path. A dashed lavender line (20-Day SMA) runs smoothly beneath/through it. A translucent blue-gray band (Bollinger Band, SMA ± 2σ) envelopes both, starting at day 20 (Jan 28, once the rolling window is filled) and clearly narrowing during the "squeeze" period (~Feb) and widening during the "breakout" period (~May-Jun), matching the spec's technical-indicator intent.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme surface — not pure black, not light.
      Chrome: Same title, now in bright off-white text, fully visible and not clipped. Same three-entry legend, now with light-colored text labels. Axis titles and $-formatted tick labels render in light ink, clearly legible against the dark background — no dark-on-dark failures observed anywhere (all text/ticks are light-colored). Gridlines remain subtle but visible as faint light horizontal lines.
      Data: Colors are identical to the light render — brand green Close line, lavender dashed SMA, blue translucent band fill — confirming only chrome (background/text/grid) flips between themes while data colors stay fixed, as required. The blue band fill remains distinguishable against the near-black background without appearing washed out or invisible.
      Legibility verdict: PASS.
