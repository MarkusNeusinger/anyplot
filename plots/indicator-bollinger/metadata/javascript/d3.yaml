review:
  strengths:
  - 'First series (close price) correctly uses brand green #009E73; upper/lower bands
    share one Imprint lavender (#C475FD) with a consistent semi-transparent fill,
    exactly as the spec asks'
  - SMA reference line uses the theme-adaptive 'neutral' semantic anchor (t.ink) rather
    than a categorical color — a sophisticated choice that matches the style guide's
    'baseline / reference line' role and correctly flips between black (light) and
    white (dark) while the two categorical data colors stay identical across themes
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    legible ink/inkSoft text, subtle grid, no dark-on-dark or light-on-light failures'
  - Realistic, plausible synthetic price series with a genuine deterministic LCG seed;
    band shows both an upper-touch (overbought, ~May 19–Jun 2) and lower-touch (oversold,
    ~Mar 17, Jun 16) plus a volatility contraction/expansion pattern, covering the
    applications called out in the spec
  - 'Idiomatic, current d3 v7 API usage: scaleTime/scaleLinear, d3.area + d3.line
    generators with curveMonotoneX, d3.deviation for the rolling stdev, d3.axisBottom/Left
    with theme-token styling'
  - Title format, legend labels, and axis labels (with units) all match the spec exactly;
    layout is well-balanced with the plot filling roughly 60-65% of canvas area and
    the legend anchored near the plot rather than floating
  weaknesses:
  - 'Design Excellence is only at the ''well-configured default'' tier (DE-01=4/8):
    the chart is correct and clean but visually generic — no distinctive typography
    treatment, custom font-family, or extra polish beyond the semantic-color choice
    for the SMA line. Consider a more refined title/legend typographic hierarchy or
    subtle emphasis on the price line to lift it toward publication quality.'
  - Data storytelling (DE-03=4/6) relies only on line-weight/color hierarchy. The
    spec explicitly suggests 'noting squeeze patterns' — a light annotation or callout
    marking the visible volatility-squeeze window (~day 55-70 in the data) would sharpen
    the narrative and is spec-sanctioned, not decorative chartjunk.
  - Band boundary lines (stroke-width 1.75) are comparatively thin against the medium-density
    120-point series; a touch heavier (2-2.25px) would improve VQ-03 element visibility
    without overpowering the primary close-price line.
  - Two small helper functions (lcg(), bandLine()) exist purely for RNG and line-generator
    factoring — acceptable idiomatic D3, but keeping the script as flat as possible
    (e.g. inlining bandLine's config into the two call sites) would tighten KISS structure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "indicator-bollinger · javascript · d3 · anyplot.ai" in bold dark ink, centered top. X-axis "Trading Date" and Y-axis "Closing Price (USD)" labels in medium-gray ink, both clearly readable. Tick labels ($180-$220, Mar 10-Jun 16) in soft gray, legible. Subtle horizontal gridlines barely visible behind the data, non-competing. Legend at right (Close price / 20-day SMA / ±2σ band) with dark-ink text, no box border.
      Data: Close price line is thick brand green (#009E73), most prominent element. 20-day SMA is a dashed dark-ink (near-black) line acting as a structural reference. ±2σ band is a lavender (#C475FD) semi-transparent fill (~16% opacity) bounded by thin lavender lines on both edges — same color used for both edges per spec.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Title, axis labels, and tick labels all rendered in light ink/soft-gray tones, clearly visible against the dark surface. Gridlines still subtle but visible. Legend text is light-colored and readable, no dark-on-dark issues anywhere.
      Data: Close price line remains the identical brand green (#009E73) and the ±2σ band remains the identical lavender (#C475FD) fill/lines — confirming data colors are unchanged from the light render. The 20-day SMA dashed line flips to white/light-gray (theme-adaptive "neutral" anchor, by design, since it represents chrome/reference rather than a categorical series) — correctly distinguishable and legible on the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome legible, data colors consistent with light render.
