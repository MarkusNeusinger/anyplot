      Data: Close price line remains the identical brand green (#009E73) and the ±2σ band remains the identical lavender (#C475FD) fill/lines — confirming data colors are unchanged from the light render. The 20-day SMA dashed line flips to white/light-gray (theme-adaptive "neutral" anchor, by design, since it represents chrome/reference rather than a categorical series) — correctly distinguishable and legible on the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome legible, data colors consistent with light render.
