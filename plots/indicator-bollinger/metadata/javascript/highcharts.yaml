review:
  strengths:
  - Clever fill-masking technique to emulate a Bollinger Band envelope without the
    unavailable arearange module (an upper tinted area drawn under a page-background-colored
    area) — a correct, creative workaround given the core-bundle-only constraint.
  - 'Theme-adaptive chrome is fully correct in both renders: the SMA line correctly
    switches from near-black to white via t.ink, the band fill/outline reads clearly
    on both surfaces, and the background flips to warm off-white / near-black as required.'
  - Realistic squeeze/expansion cycles in the data (tight bands mid-year, wide bands
    during the March-April decline) give good coverage of the indicator's core value
    proposition.
  - Explicit, well-proportioned typography in both renders — no overlap, clipping,
    or unreadable text; layout uses the canvas well with balanced margins.
  - Title, subtitle, and legend exactly match the required format and accurately describe
    the three plotted series.
  weaknesses:
  - 'VQ-07: The Bollinger Bands series is colored with t.palette[2] (#4467A3, blue)
    instead of the next canonical position t.palette[1] (#C475FD, lavender) — the
    style guide requires sequential palette order 1→N by default and only allows skipping
    ahead for a strong, widely-shared semantic color match, which isn''t clearly established
    for a generic ''bands'' series. Reassign to palette[1], or keep palette[2] only
    if you note the semantic justification (e.g. blue as a conventional financial-band
    color) in a comment.'
  - 'Design Excellence is solid but not exceptional: the chart is clean and correctly
    styled but reads as a well-configured, conventional finance chart rather than
    having a standout visual hierarchy or focal point. Consider a subtle emphasis
    (e.g. a slightly bolder treatment at a specific overbought/oversold touch) to
    sharpen the storytelling beyond ''display the indicator correctly.'''
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "indicator-bollinger · javascript · highcharts · anyplot.ai" in bold dark text, subtitle "20-day SMA · ±2σ bands" in medium-gray text, both clearly legible. Y-axis title "Price (USD)" rotated, dark-gray tick labels on both axes, subtle horizontal-only gridlines. Legend at bottom with three entries: "Bollinger Bands (±2σ)", "SMA (20)", "Close".
      Data: Green (#009E73) Close price line drawn boldly on top; a black dashed SMA(20) line runs through the middle of a light blue-gray tinted band; the band's upper/lower boundary lines are a medium blue. All colors read clearly against the light background.
      Legibility verdict: PASS — all text is clearly readable, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle text now rendered in white / light-gray, fully legible. Tick labels and axis title are light gray on the dark surface. Gridlines are subtle and still visible. Legend text is light-colored and readable.
      Data: The Close price line is the identical #009E73 green as the light render. The SMA line correctly flips to white (dashed) via the t.ink theme token — no dark-on-dark failure. The band fill becomes a dark navy tint with the same blue outline color as the light render, still clearly distinguishable from the black background.
      Legibility verdict: PASS — no dark-on-dark text; the SMA line is the one theme-dependent element and it correctly adapts from black to white between renders.
