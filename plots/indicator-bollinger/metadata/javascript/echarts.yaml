review:
  strengths:
  - 'Idiomatic ECharts band-fill technique: two stacked, symbol-less line series with
    a transparent lower boundary and a 15%-opacity fill for the spread, giving a clean
    semi-transparent envelope between the bands as the spec requests'
  - Helper fill series ('... (band fill)') are correctly excluded from the legend
    and filtered out of the tooltip formatter, keeping the UI clean
  - Correct Imprint brand green (#009E73) on the Close price line in both renders;
    theme chrome (background, title, legend, axis text, gridlines) is fully correct
    and readable in both plot-light.png and plot-dark.png
  - SMA rendered as a dotted neutral-ink line and bands as dashed, giving three visually
    distinct line styles that stay legible without relying on hue alone
  - Deterministic in-memory data via a tiny seeded LCG + Box-Muller gaussian, matching
    the echarts library guide's recommendation for the browser runtime
  - Title and legend exactly match the required format and data labels; canvas is
    the correct 3200x1800 landscape size with no edge clipping
  - Data shows both a clear volatility expansion (Feb, band widens) and contraction/squeeze
    (Mar-Apr, band narrows), covering the two key Bollinger Band patterns called out
    in the spec
  weaknesses:
  - Y-axis is fixed to $0-$100 while the data lives entirely in the $60-$85 range,
    so roughly half the vertical canvas is empty whitespace and the band-width squeeze/expansion
    patterns are compressed into a narrow horizontal strip. Auto-scale the y-axis
    to the data range (e.g. yAxis.scale = true, or explicit min/max a few dollars
    beyond the min/max of lowerBand/upperBand) so the volatility patterns read clearly
    at full canvas height.
  - Upper/Lower Band color uses t.palette[2] (#4467A3, canonical position 3, blue),
    skipping t.palette[1] (#C475FD lavender, canonical position 2) without an explicit
    semantic justification. Either use palette[1] for the second series per the canonical-order
    default, or keep blue only if there's a stated semantic reason (e.g. 'blue = statistical
    envelope' convention) noted in a comment.
  - 'Design excellence is only moderate: the chart is well-executed but visually reads
    as a competent default rather than a piece with strong visual hierarchy — consider
    emphasizing the squeeze/expansion zones or the relationship between price and
    the bands more deliberately (e.g. subtle shading intensity tied to band width,
    or a small annotation marking the tightest squeeze) to create a clearer focal
    point.'
  - SMA line uses the theme-adaptive 'ink' chrome token rather than a palette color;
    this is a defensible convention (neutral reference line distinct from data series)
    but blurs the line between 'chrome' and 'data series' color usage — worth a one-line
    justification in review notes if kept.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "indicator-bollinger · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Legend below it ("Close", "SMA (20)", "Upper Band", "Lower Band") in dark text. Y-axis titled "Price (USD)" with $-prefixed tick labels ($0-$100). X-axis shows sparse date ticks (Jan 2 through Jun 4-ish) in medium-gray. Subtle horizontal gridlines only, no vertical gridlines. All chrome text is clearly legible against the light background.
      Data: Close price is a solid brand-green (#009E73) line, prominent and thick. SMA (20) is a black dotted line, clearly distinguishable. Upper/Lower Band lines are a muted blue, dashed, with a light gray-blue semi-transparent fill between them. The band visibly widens in mid-February (volatility expansion) and narrows around March-April (squeeze) before widening again in May. The data occupies roughly the upper-middle third of the vertical axis range ($60-$85 within a $0-$100 axis), leaving a large empty band of whitespace below the chart lines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend text, now rendered in white/light gray, fully readable against the dark background. Axis labels and tick labels are light gray, gridlines are subtle and still visible. No dark-on-dark text anywhere.
      Data: Close line remains the identical brand green (#009E73) — confirmed unchanged from the light render. SMA (20) flips to a white dotted line (theme-adaptive ink token), still clearly visible against the dark background. Upper/Lower Band lines and fill remain the same blue hue as light mode (data colors unchanged, only the chrome flipped). The same volatility expansion/squeeze pattern is visible in the same locations.
      Legibility verdict: PASS
