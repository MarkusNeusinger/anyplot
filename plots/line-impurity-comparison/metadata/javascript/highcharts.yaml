review:
  strengths:
  - Correct Imprint palette usage (brand green first, canonical lavender second) with
    fully theme-adaptive chrome in both renders
  - Clear focal-point storytelling via the vertical p=0.5 reference line plus labeled
    peak values (0.50, 1.00) on both curves
  - Correctly handles the p=0 and p=1 entropy edge cases exactly as the spec requires
  - Legend labels include the explicit mathematical formulas requested by the spec
  - Dashed line style for entropy gives CVD-safe redundant encoding beyond color alone
  - Clean 3200x1800 canvas with no clipped or overlapping elements in either theme
  weaknesses:
  - Entropy line uses lavender (#C475FD), which falls below WCAG 3:1 contrast on the
    cream background per the style guide; mitigated by the dashed style but a thin
    ink-color outline stroke on the line would further improve accessibility
  - Several small helper functions (giniImpurity, entropy, seriesData) are used instead
    of fully inline data generation — a minor KISS/CQ-01 deduction, though justified
    here for readability with per-point marker/label overrides
  - Could lean further into Highcharts-distinctive interactivity (e.g. a tooltip formatter
    surfacing both formulas on hover) to deepen the library-mastery showing in the
    HTML detail view
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "line-impurity-comparison · javascript · highcharts · anyplot.ai" centered at top; dark-gray axis titles "Probability p" / "Impurity Measure (normalized)"; soft-gray tick labels on both axes; subtle light-gray gridlines; legend at bottom with formula-labeled entries; a dashed vertical reference line at p=0.5 labeled "p = 0.5 · maximum impurity". All chrome elements are clearly readable against the light background.
      Data: Solid brand-green (#009E73) curve for Gini impurity peaking at 0.50 (labeled), dashed lavender (#C475FD) curve for entropy peaking at 1.00 (labeled). Both curves start and end at 0, symmetric bell shapes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis titles, and tick labels rendered in light/off-white tones, clearly legible; gridlines are faint light lines; the p=0.5 reference line and its label are rendered in a light tone; legend text is light gray. No dark-on-dark or hard-to-read text found anywhere.
      Data: Same brand-green solid curve and lavender dashed curve as the light render, confirming data colors are identical across themes and only chrome adapts.
      Legibility verdict: PASS
