review:
  strengths:
  - Both curves are computed from the spec formulas, and the entropy edge case is
    closed explicitly with its limit 0 at p = 0 and p = 1, so both arches reach zero
    at both ends with no gap or spike
  - The legend states both formulas as readable Unicode mathematics (2p(1 − p), −p
    log₂p − (1 − p) log₂(1 − p)), with glyph fills matched to the peak marks
  - The peak annotation uses MUI X's native ChartsReferenceLine plus a custom SVG
    layer positioned with the useXScale/useYScale hooks, so the 'Maximum 1.00' and
    'Maximum 0.50' labels sit beside the peaks in data coordinates
  - showMark as a per-index predicate draws markers only at the p = 0.5 peaks, and
    the [data-series] sx selectors style each line, area and mark through the v9 CSS
    classes
  - The layered area washes put Gini's fill under entropy's, so the entropy-only band
    shows exactly where the two criteria differ
  - Theme tokens drive all chrome; data colours (#009E73 green, Imprint purple) are
    identical in both renders and all text is readable in both themes
  - The interactive HTML has per-series tooltips with 3-decimal value formatters
  weaknesses:
  - 'Suggestion: draw the dashed p = 0.5 reference line beneath the peak marks, or
    stop it short of them, so it does not run across the two dots.'
  - 'Suggestion: use the same decimal count on both axes (x ticks show 0.00, y ticks
    show 0.0) for a calmer tick rhythm.'
  - 'Suggestion: the bottom label ''Maximum impurity at p = 0.50'' repeats what the
    two peak labels and the line already say; a shorter ''p = 0.50'' would reduce
    text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "line-impurity-comparison · javascript · muix · anyplot.ai" top-left (~43% of width) with a softer subtitle "101 evaluation points, p = 0.00 to 1.00 in steps of 0.01"; horizontal legend centered above the plot with formulas; y-axis "Impurity" (ticks 0.0–1.0), x-axis "Probability of class 1 (p)" (ticks 0.00–1.00); subtle horizontal grid lines; all text dark and readable.
      Data: Gini impurity arch in brand green #009E73 peaking at 0.50, entropy arch in Imprint purple peaking at 1.00, both reaching 0 at p = 0 and p = 1; translucent area washes under each (blue-grey under Gini, lavender between the curves); filled peak markers at p = 0.5 with bold "Maximum 1.00" / "Maximum 0.50" labels; dashed vertical reference line at p = 0.5 labelled "Maximum impurity at p = 0.50" near the x axis.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
