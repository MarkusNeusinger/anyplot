review:
  strengths:
  - Correctly implements Gini and entropy with proper edge-case handling at p=0/1
    (0*log(0):=0 convention)
  - First series uses Imprint brand green (#009E73), second uses palette[1] lavender,
    identical across light/dark themes
  - Dashed vertical markLine plus circular markPoint markers on both curves highlight
    the shared p=0.5 maximum-impurity point, with a clear annotation label
  - Legend labels embed the actual formulas (Gini = 2p(1-p), Entropy = -p*log2 p -
    (1-p)*log2(1-p)), directly satisfying the spec's legend requirement
  - Y-axis-only grid (splitLine off on x-axis) matches the style guide's line-chart
    grid guidance
  - Clean, dependency-free code; deterministic data generation; correct mount-node/animation:false
    contract
  weaknesses:
  - Y-axis max=1.15 with interval=0.25 produces an uneven final tick gap (1.0 to 1.15
    is 0.15 vs the uniform 0.25 elsewhere) - use max=1.25 or reserve annotation space
    differently
  - Design excellence is only moderately elevated above baseline - consider an extra
    refinement (e.g. subtle area fill under one curve, more deliberate typographic
    weight contrast) to lift polish further
  - Library-distinctive-feature usage is fairly basic (markLine + markPoint) - could
    showcase more idiomatic echarts capabilities to raise Library Mastery
  - The max-impurity annotation label uses a hardcoded pixel offset ([95, -4]) rather
    than a data-relative anchor; works at the current canvas size but is not robust
    to layout changes
