review:
  strengths:
  - Gini plotted unscaled at its true 0.5 peak against normalized entropy at 1.0,
    so the two criteria's real heights are visible on one shared axis
  - line.simplify=False draws all 200 points, giving genuinely smooth arches
  - Separate peak callouts for Gini and entropy with values computed from the arrays
    (argmax), arrows landing on each peak without covering it
  - Legend formulas set as readable Unicode mathematics (log₂, −), not raw markup
  - Fully themed chrome (INK / INK_SOFT / ELEVATED_BG) readable in both renders; Imprint
    positions 1 and 2 identical across themes
  - Per-trace hovertemplates tailored to p and impurity for the HTML view
  weaknesses:
  - 'SC-02 (both): the dashed entropy line ends in a dash gap about 0.03 above zero
    at p = 1 instead of reaching 0 (C2) → end the dashed line exactly on (1, 0). Likely
    cause: the dash pattern phase of line.dash=''dash'' leaves the last stretch blank;
    use a dash length that lands on the endpoint (e.g. line.dash=''14px,7px'' tuned)
    or draw the final segment solid.'
  - 'Suggestion: with Gini now unscaled, ''Entropy is wider than Gini'' reads oddly
    at p = 0.5, where entropy is simply higher; ''Entropy runs above Gini'' says what
    the band shows.'
  - 'Suggestion: fill=''tonexty'' on the entropy trace would replace the concatenated
    toself polygon for the shaded band.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area
      Chrome: centered title 'line-impurity-comparison · python · plotly · anyplot.ai', axis titles 'Probability (p)' and 'Impurity (entropy normalized to 1)', ticks 0-1 by 0.1 (x) and 0.2 (y) in dark ink, subtle grid, left/bottom axis lines; all readable
      Data: solid green #009E73 Gini arch peaking at 0.5, dashed lavender #C475FD entropy arch peaking at 1.0, light lavender band between them, dotted vertical line at p = 0.5; callouts 'Entropy peak: 1.0 at p = 0.5' (above, arrow to the peak), 'Gini peak: 0.5 at p = 0.5' (below, arrow up to the peak) and 'Divergence region / Entropy is wider than Gini' in the band; legend box bottom center with both formulas. The dashed entropy line ends slightly above 0 at p = 1
      Legibility verdict: PASS

