review:
  strengths:
  - 'Imprint palette applied correctly: Gini #009E73 first, Entropy #C475FD second,
    identical across themes, with every chrome token theme-branched'
  - Redundant encoding (solid vs dashed) keeps the two curves apart without relying
    on hue
  - Legend states both formulas as readable Unicode mathematics (log₂, −), not raw
    markup
  - Entropy edge cases at p = 0 and p = 1 handled with np.where so both curves reach
    the ends without NaN gaps
  - Per-trace hovertemplate gives p and impurity values in the HTML view
  - Callouts and legend sit in open space, clear of the curves and of each other
  weaknesses:
  - 'DQ-01, DQ-03 (both): Gini is divided by its maximum, so its peak reads 1.0 on
    the axis instead of the 0.5 that 2p(1-p) gives (+0.5), and the peak callout states
    ''both measures = 1.0'' → plot gini = 2*p*(1-p) unscaled (peak 0.5) and let the
    callout name both peak values (Gini 0.5, entropy 1.0). Likely cause: `gini = gini_raw
    / gini_raw.max()` and the hard-coded callout text.'
  - 'SC-02 (both): the curves show visible straight-segment kinks (for example near
    p = 0.05-0.2) instead of smooth arches (C1), and the dashed entropy line ends
    in a dash gap a little above 0 at p = 1 (C2) → draw the full 200 points without
    simplification and end the dash on the endpoint. Likely cause: Plotly''s default
    `line.simplify=True` and the ''dash'' pattern; set `line={''simplify'': False}`.'
  - 'Suggestion: a y-only grid would quiet the background for two smooth curves.'
  - 'Suggestion: fill=''tonexty'' on the entropy trace would replace the concatenated
    toself polygon for the shaded band.'
