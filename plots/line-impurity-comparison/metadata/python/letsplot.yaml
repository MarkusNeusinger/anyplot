review:
  strengths:
  - 'Gini #009E73 and entropy #C475FD in canonical Imprint order with theme-adaptive
    chrome in both renders'
  - Entropy edge cases handled with np.errstate plus nan_to_num, so both curves reach
    0 at p = 0 and p = 1
  - Hollow page-filled shape=21 markers mark both maxima at p = 0.5
  - layer_tooltips() with .format()/.line() chains gives formatted hover readouts
    in the HTML
  weaknesses:
  - 'VQ-02 (both): the ''Maximum uncertainty at p = 0.5'' label (centred at y=0.97)
    is drawn across the entropy curve directly under the peak marker → place it above
    the maximum, clear of the curve (y above 1.05, with the axis limit raised). Likely
    cause: main_label_df impurity=0.97 with scale_y limits [-0.06, 1.05].'
  - 'SC-02 (both): the arrow runs from y=0.93 down to y=0.86, pointing into empty
    ribbon below the entropy peak rather than at a maximum, and its label covers the
    peak (C5) → point the arrow from the label down to the peak marker. Likely cause:
    arrow_df y=0.93, yend=0.86.'
  - 'SC-02 (both): the entropy legend entry reads ''Entropy (normalized)'' without
    its formula, while the Notes ask for both formulas (C4) → e.g. ''Entropy: −p log₂p
    − (1−p) log₂(1−p)''. Likely cause: the metric label string.'
  - 'DE-02 (both): the major grid is drawn in solid INK_SOFT at size 0.2 and reads
    heavy, above the style guide''s subtle grid → INK at 15 % (rgba(26,26,23,0.15)
    / rgba(240,239,232,0.15)). Likely cause: panel_grid_major=element_line(color=INK_SOFT).'
  - 'VQ-01 (both): the edge notes ''p → 0: both → 0'' / ''p → 1: both → 0'' are set
    at geom_text size=3 (~8.5 pt) in INK_MUTED, under the 10 pt tick-label reference,
    and read faint → about 10 pt (size≈3.5) in INK_SOFT. Likely cause: geom_text(data=boundary_df,
    size=3, color=INK_MUTED).'
  - 'Suggestion: differentiated line widths could give one curve focal priority.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; 3200x1800.
      Chrome: bold mandated title, italic subtitle, axis titles and ticks in dark ink, all readable; major grid in solid INK_SOFT reads heavy across the panel.
