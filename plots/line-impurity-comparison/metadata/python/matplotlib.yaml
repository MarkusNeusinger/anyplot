review:
  strengths:
  - 'Imprint palette with #009E73 for Gini and #C475FD for entropy, plus solid vs
    dashed line style, so the curves stay apart even where they converge at the ends'
  - matplotlib patheffects Stroke halos in the page color separate both lines from
    the shaded gap in both themes
  - Legend formulas set as mathtext (2p(1-p), -p log2 p - (1-p) log2(1-p)) read as
    real mathematics
  - Entropy computed with a mask so both curves reach exactly 0 at p = 0 and p = 1
    with no gap or spike
  - Maxima annotations color-matched to their curves, with arrows landing on ringed
    peak markers
  weaknesses:
  - 'VQ-02 (both): the upper-left legend box covers the entropy curve between about
    p = 0.36 and 0.42 (y 0.93-0.98) and the curved arrow of the entropy annotation
    → keep the legend clear of both curves, e.g. a placement under the entropy arch
    or a y limit with headroom above 1.0. Likely cause: ax.legend(loc="upper left")
    with ylim top 1.08.'
  - 'Suggestion: the arrow to the entropy peak runs along the curve''s crest; a shorter,
    straighter arrow from above would point at the marker more cleanly.'
