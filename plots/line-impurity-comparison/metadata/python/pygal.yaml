review:
  strengths:
  - Both curves are computed from the Data formulas over the full [0, 1] range; entropy
    reaches 0 at both ends cleanly because np.errstate plus np.nan_to_num handle p
    = 0 and p = 1
  - 'Imprint order is correct: Gini in #009E73, Entropy in #C475FD, the peak dots
    matched to their curves, the same data colors in both themes'
  - All chrome uses theme tokens, and the injected text.value CSS rule keeps the peak
    labels in INK in the dark render
  - The legend carries both formulas as readable Unicode mathematics (2p(1−p), −p
    log₂p − (1−p) log₂(1−p))
  - Peak positions and label values come from argmax/max of the computed curves rather
    than being hard-coded
  - Pygal-native per-point label dicts with print_labels annotate the peaks, and the
    softened axis lines come from CSS injected into pygal's SVG
  weaknesses:
  - 'VQ-05 (both): about 200 px of empty band sits below the legend row at the bottom
    of the canvas, while the plot area could use that height → give that height to
    the plot (about −150 px of bottom space). Likely cause: pygal reserves the legend_at_bottom
    block plus the margin=80 default below it; margin_bottom=0 alone does not reclaim
    the band.'
  - 'Suggestion: a slightly thicker curve stroke would give the two arches more presence
    on the 3200 px canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct theme surface.
      Chrome: the title "line-impurity-comparison · python · pygal · anyplot.ai" sits centered at the top in dark ink. The rotated y-axis title "Impurity measure" and the x-axis title "Probability p" are readable. The y ticks 0–1 step 0.2 and the x ticks 0.0–1.0 step 0.1 are dark and equal in size. The horizontal grid is subtle and dotted, with a solid line at y = 1; the y axis has headroom to 1.15. The left and bottom axis lines are softened. A two-column legend sits at the bottom, with an empty band of about 200 px below it.
      Data: the Gini curve in #009E73 arches from 0 to 0.5 at p = 0.5 and back to 0; the Entropy curve in #C475FD arches from 0 to 1.0 and back, steeper at the ends. A muted dashed vertical guide runs from 0 to the entropy peak at p ≈ 0.5. Peak dots in matching colors sit on both maxima, and the labels "Gini peak = 0.50" and "Entropy peak = 1.00" sit above-right of each dot, clear of both curves. The legend reads "Gini: 2p(1−p)" and "Entropy: −p log₂p − (1−p) log₂(1−p)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct theme surface.
      Chrome: title, axis titles, ticks, legend text and both peak labels render in light ink; no dark-on-dark failures. Grid and softened axis lines are subtle but visible.
      Data: green and lavender curve colors identical to the light render; only the chrome flipped. Guide, dots and label positions match the light render.
      Legibility verdict: PASS
