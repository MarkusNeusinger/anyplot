review:
  strengths:
  - Both curves are computed from the Data formulas and drawn over the full [0, 1]
    range; entropy reaches 0 at both ends cleanly because np.errstate plus np.nan_to_num
    handle p = 0 and p = 1
  - 'Imprint order is correct: Gini in #009E73, Entropy in #C475FD, the peak dots
    matched to their curves, and the same data colors in both themes'
  - All chrome uses theme tokens, and the injected `text.value` CSS rule keeps the
    peak labels readable in INK in the dark render
  - The legend carries both formulas as readable Unicode mathematics (2p(1−p), −p
    log₂p − (1−p) log₂(1−p))
  - Peak positions and peak label values come from argmax/max of the computed curves
    rather than being hard-coded
  - Pygal-native per-point label dicts with print_labels annotate the peaks; cubic
    interpolation and the softened SVG axis lines are pygal idioms
  weaknesses:
  - 'VQ-02, SC-02 (both): the ''Entropy peak = 1.00'' label is crossed by the lavender
    curve through ''peak'', and the ''Gini peak = 0.50'' label by the green curve
    through ''= 0.50'', so the annotation covers the peaks it explains (spec C5) →
    put each label above its peak dot, clear of the curve (about +40 px upward). Likely
    cause: pygal''s default value-label placement just below-right of the dot.'
  - 'VQ-05 (both): about 110 px of empty band sits below the legend row at the bottom
    of the canvas, while the plot area could use that height → shrink the bottom margin
    (about −80 px). Likely cause: margin_bottom=120 on top of the legend_at_bottom
    block.'
  - 'Suggestion: a slightly thicker curve stroke would give the two arches more presence
    on the 3200 px canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct theme surface.
      Chrome: the title "line-impurity-comparison · python · pygal · anyplot.ai" sits centered at the top in dark ink. The y-axis title "Impurity measure" (rotated) and the x-axis title "Probability p" are readable. The y ticks 0–1 step 0.2 and the x ticks 0.0–1.0 step 0.1 are dark and the same size on both axes. The horizontal grid is subtle and dotted, with a solid line at y = 1. The left and bottom axis lines are softened. A two-column legend sits at the bottom.
      Data: the Gini curve in #009E73 arches from 0 to a peak of 0.5 at p = 0.5 and back to 0. The Entropy curve in #C475FD arches from 0 to 1.0 and back to 0, steeper at the ends. A muted vertical dashed guide runs at p ≈ 0.5. Peak dots in the matching colors carry the labels "Gini peak = 0.50" and "Entropy peak = 1.00" to their lower right, and each label is crossed by its own curve. The legend reads "Gini: 2p(1−p)" and "Entropy: −p log₂p − (1−p) log₂(1−p)".
      Legibility verdict: PASS (all text readable; the curves cross the two peak labels)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct theme surface.
