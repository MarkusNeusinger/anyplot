review:
  strengths:
  - Imprint green solid Gini and lavender dashed entropy, redundantly encoded via
    color and strokeDash scales
  - Both maxima marked exactly at p=0.5 with a dashed rule and bold labels
  - Theme tokens threaded through all chrome; both renders readable
  - Edge cases at p=0 and p=1 handled with nan_to_num so both curves reach zero
  - Layered Altair composition with a y/y2 band between the curves
  weaknesses:
  - 'VQ-02 (both): the bottom-right legend box covers the right ends of both curves
    (p≈0.75–1.0) and the entropy entry''s trailing '')'' touches the legend border
    → legend clear of the data with inner padding. Likely cause: alt.Legend(orient=''bottom-right'')
    without padding.'
  - 'VQ-05 (both): the 620x320 view padded to 3200x1800 leaves a wide empty frame
    and the drawing uses well under the canvas → fill the canvas. Likely cause: .properties(width=620,
    height=320) without autosize=fit, then PIL padding.'
  - 'SC-02 (both): the entropy legend entry reads ''−p·log₂(p) (scaled)'', dropping
    the (1−p)·log₂(1−p) term, so the formula the Notes ask for is incomplete → the
    full binary entropy formula. Likely cause: ENTROPY_LABEL string.'
  - 'Suggestion: the peak labels could sit above or below their dots rather than at
    a fixed dx offset.'
