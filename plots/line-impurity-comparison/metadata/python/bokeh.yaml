review:
  strengths:
  - Formula legend set as readable mathematics (2p(1−p), −p log₂p − (1−p) log₂(1−p))
    with solid vs dashed lines matching the curves
  - 'Correct Imprint order (#009E73 then #C475FD) with redundant line-style encoding,
    CVD-safe'
  - Fully theme-adaptive chrome; no dark-on-dark or light-on-light text in either
    render
  - Peak position and maxima derived from the data (idxmax), and entropy edge cases
    handled with errstate + nan_to_num so both arches reach 0 at p = 0 and 1
  - 'Bokeh-native interactivity: HoverTool in vline mode reading both metrics, click_policy=''hide''
    legend, HTML artifact'
  weaknesses:
  - 'VQ-02 (both): the ''p = 0.5 (maximum impurity)'' callout box''s bottom-left edge
    sits on the dashed entropy curve just right of the peak (box baseline at y = 1.0
    where the curve is at about 0.99) → lift the box clear of the curve by at least
    ~0.03 in y. Likely cause: Label y=entropy_max with the default bottom anchor.'
  - 'Suggestion: place the ''Gini max = 0.5'' value label next to its peak marker
    rather than at p ≈ 0.18, so each value reads with its dot.'
  - 'Suggestion: give the callout text a little padding inside its box; the bold text
    runs right to the border.'
