review:
  strengths:
  - 'Correct Imprint order: Gini in #009E73 (position 1), entropy in #C475FD (position
    2), identical in both renders; chrome fully theme-adaptive (#FAF8F1 / #1A1A17
    backgrounds, INK/INK_SOFT text, elevated legend fill)'
  - Color and linetype mapped to the same variable with shared limits, so plotnine
    merges them into one legend and the curves stay apart by solid vs dashed even
    where they converge near p = 0 and p = 1
  - Legend moved below the panel as a horizontal strip, so no data is covered; formulas
    set as readable Unicode mathematics (log₂, −)
  - Peaks and annotation position computed from df (idxmax per group, peak_p in an
    f-string), and p sampled on 201 points so p = 0.5 is an exact sample and both
    maxima sit on the guide
  - Edge cases at p = 0 and p = 1 handled with np.where; both curves reach zero at
    both ends without gaps
  - Axis titles come from the column constants, the plotnine idiom, with no redundant
    labs()
  weaknesses:
  - 'VQ-01 (both): the annotation ''Both maxima at p = 0.5'' is set at 5.5 pt and
    reads small beside the 8 pt tick labels → about 8 pt (+2.5 pt). Likely cause:
    annotate("text", size=5.5).'
  - 'VQ-02 (both): the dashed p = 0.5 guide line runs straight through the ''Both
    maxima at p = 0.5'' text, crossing its letters → keep the text clear of the line
    (end the guide below the text, or set the text with ha=''left'' beside it). Likely
    cause: geom_vline spans the full panel height while the annotate text is centred
    on x=peak_p.'
  - 'Suggestion: draw the legend background without the INK_SOFT frame (color="none"),
    as the plotnine prompt''s legend recipe does, for a quieter bottom strip.'
