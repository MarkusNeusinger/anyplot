review:
  strengths:
  - 'Correct Imprint order: Gini in #009E73, entropy in #C475FD, identical in both
    renders; chrome fully theme-adaptive (#FAF8F1 / #1A1A17, INK/INK_SOFT text, elevated
    legend fill)'
  - Color and linetype mapped to the same column with shared limits, so plotnine merges
    them into one guide and the curves stay apart by solid vs dashed even where they
    converge near p = 0 and p = 1
  - Formulas set as readable Unicode mathematics (log₂, −) in the legend, below the
    panel so no data is covered
  - Peaks and annotation position computed from df (groupby idxmax, f-string); 201
    samples make p = 0.5 exact
  - Edge cases at p = 0 and 1 handled with np.where; both curves reach zero without
    gaps
  weaknesses:
  - 'VQ-03 (both): the entropy legend sample is drawn as a short solid lavender bar,
    so the key does not show the dashed style the curve carries → a key long enough
    to show the dash pattern. Likely cause: default legend_key_width with geom_line(size=2.5);
    set legend_key_width (e.g. 40) in theme().'
  - 'Suggestion: draw the legend background without the INK_SOFT frame (color="none"),
    as the plotnine prompt''s legend recipe does, for a quieter bottom strip.'
  - 'Suggestion: tighten the empty band between the x-axis title and the legend strip.'
