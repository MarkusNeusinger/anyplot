review:
  strengths:
  - 'Idiomatic seaborn: long-format DataFrame drawn with sns.lineplot hue+style, giving
    merged color+dash legend handles'
  - Both curves reach zero at p = 0 and p = 1 thanks to the masked entropy computation
  - Every chrome element uses theme tokens; both renders read cleanly
  - Formula legend in readable Unicode math and a boxed peak callout placed beside
    the peak
  weaknesses:
  - 'DQ-01 (both): Gini is divided by its maximum and peaks at 1.0 instead of 0.5,
    so it does not show the shape its Data formula 2p(1−p) gives (C1: Gini peaking
    at 0.5, entropy at 1) → plot Gini unnormalized with its peak at 0.5 (−0.5) and
    keep only entropy normalized. Likely cause: `gini_normalized = gini / gini.max()`
    (line 31).'
  - 'VQ-02 (both): the legend box covers both curves over p ≈ 0.63–0.72 → keep the
    legend clear of the curves (for example the empty area under the arch or above
    it with a little headroom). Likely cause: `loc="upper right"` with ylim top at
    1.1 (lines 127, 136).'
  - 'Suggestion: a stronger band alpha would make the between-curves region readable
    in the dark render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title in dark ink; 'Probability (p)' and 'Impurity (normalized)' labels; ticks 0.0–1.0 in INK_SOFT; legend 'Splitting Criterion' with formula entries in the upper right. All readable.
      Data: solid green #009E73 Gini and dashed lavender #C475FD Entropy arches, both peaking at 1.0 at p = 0.5; a faint green band between them; black peak dot with a boxed 'Max impurity p = 0.5' callout; italic 'Max divergence' pointer near p = 0.1. The legend box covers both curves over p ≈ 0.63–0.72.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, labels and legend text in light ink; ticks in light gray; annotation box and legend on #242420; no dark-on-dark.
      Data: curve colors identical to the light render; the band is a faint dark green; the peak dot flips to light ink.
      Legibility verdict: PASS
