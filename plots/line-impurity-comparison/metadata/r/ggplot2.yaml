review:
  strengths:
  - Legend formulas set as real mathematics via plotmath expression() with log₂ subscripts,
    satisfying the readable-formula requirement
  - Redundant color + linetype encoding merged into a single legend through shared
    scale name and labels
  - Theme tokens threaded through every chrome element; both renders read cleanly
  - Entropy edge cases handled by the limit convention, curves reach 0 at both ends
    without gaps
  - Annotation now sits above both peaks, clear of the curves
  weaknesses:
  - 'VQ-02 (both): the dotted p = 0.5 reference line runs through the word ''max''
    of the ''p = 0.5 (max impurity)'' annotation → keep the label clear of the line
    (stop the line below the label, or set the text on its own page-colored label).
    Likely cause: geom_vline spans the full panel while annotate(''text'') is centered
    at x = 0.5.'
  - 'VQ-03 (both): geom_area inherits the color and linetype mapping and draws a thin
    dashed outline under the thick entropy dashes, so thin fragments show in the dash
    gaps and the legend keys get colored frames → no outline on the area layer. Likely
    cause: geom_area(aes(fill = metric)) without color = NA (and show.legend = FALSE
    for its key).'
  - 'CQ-04 (code): lines 83-101 key three named value vectors by retyping the long
    label strings → unnamed vectors in factor order (values = IMPRINT_PALETTE[1:2],
    c(''solid'', ''dashed'')). Likely cause: named-vector habit after labels moved
    to LEGEND_LABELS.'
  - 'Suggestion: small markers at the two peaks would tie the annotation to both maxima.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title 'line-impurity-comparison · r · ggplot2 · anyplot.ai' top-left in dark ink; axis titles 'Probability p' and 'Impurity (normalized to [0, 1])'; ticks 0-1 and 0.00-1.00 in soft dark ink; Y-only subtle grid; bottom legend 'Splitting Criterion' on an elevated box with plotmath formulas 'Gini: 2p(1 − p)' and 'Entropy: −p log2(p) − (1 − p) log2(1 − p)' with subscript 2. All readable
      Data: solid green #009E73 Gini arch peaking at 0.50, dashed lavender #C475FD entropy arch peaking at 1.00, both with faint area fills and reaching 0 at p = 0 and 1; dotted reference line at p = 0.5 with 'p = 0.5 (max impurity)' above the entropy peak, the line crossing the word 'max'. Thin dash fragments from the area outline show in the entropy dash gaps
      Legibility verdict: PASS

    Dark render (plot-dark.png):
