      Data: Two arches over p = 0–1, both peaking at 1.0 at p = 0.5: Gini as a solid #009E73 line, entropy as a dashed #C475FD line above it. A grey-blue band (#4467A3 at 0.2 alpha) fills the gap between them. A dotted grey vertical line at p = 0.5, with the muted label "max at p = 0.5" at y ≈ 0.82, well clear of the curves. Both curves reach 0 at p = 0 and p = 1.
