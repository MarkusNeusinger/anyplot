review:
  strengths:
  - 'Correct Imprint order: Gini in #009E73, entropy in #C475FD, with solid vs dashed
    as a redundant, CVD-safe second channel that keeps the curves apart near p = 0
    and p = 1'
  - 'Edge cases handled: entropy is set to 0 at p = 0 and p = 1, so both curves reach
    zero at the ends with no gap or spike'
  - Legend formulas typeset as readable Unicode mathematics (log₂, −) in a Makie layout
    cell beside the axis
  - The p = 0.5 annotation (dotted vlines! plus text!) sits clear of both peaks
  - 'Complete theme adaptation: PAGE_BG, INK, INK_SOFT, INK_MUTED and ELEVATED_BG
    threaded through Figure, Axis, text and Legend; both renders are readable'
  weaknesses:
  - 'DQ-01, DQ-03 (both): the Gini curve peaks at 1.0 because it is divided by its
    own maximum, while the spec''s formula 2p(1−p) peaks at 0.5 (C1: Gini peaking
    at 0.5 and entropy at 1) → plot gini_raw unnormalized so its peak reads 0.5 (−0.5).
    Likely cause: `gini = gini_raw ./ maximum(gini_raw)` and the ''[normalized]''
    legend label.'
  - 'Suggestion: once Gini peaks at 0.5, a marker at each curve''s maximum at p =
    0.5 would make the two peak heights explicit.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
