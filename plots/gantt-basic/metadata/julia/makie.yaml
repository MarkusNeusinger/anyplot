review:
  strengths:
  - Correct Imprint palette usage — category color order matches canonical assignment
    (Planning=#009E73 brand green first), identical data colors across both themes
  - Theme tokens (PAGE_BG, INK, INK_SOFT) threaded through every chrome element —
    title, axis labels, ticks, spines, gridlines, and legend all render correctly
    on both the warm off-white and warm near-black surfaces
  - '"Today" reference vline with label directly satisfies the spec''s project-management
    requirement and adds genuine practical value'
  - Tasks ordered chronologically top-to-bottom by start date with adequate bar spacing
    (width=0.6) for readability
  - Title format, canvas size (3200x1800), and legend semantics (title "Category",
    labels matching data categories) all match the spec/style-guide exactly
  - Minimal, uncluttered chrome — top/right spines removed, y-gridlines hidden, only
    subtle month gridlines retained
  weaknesses:
  - Limited data storytelling beyond category color and chronological order — no duration/progress
    indication, milestone markers, or critical-path emphasis to give the chart a stronger
    focal point (DE-03)
  - Relies on standard barplot!/vlines!/text! primitives without showcasing more distinctive
    Makie capabilities (e.g. DataInspector-style annotations, layered milestone markers)
    — competent but not distinctive (LM-02)
  - Y-axis has no explicit axis label; task names function as implicit labels, which
    is acceptable, but a subtle "Task" ylabel would reinforce the mapping for readers
    unfamiliar with Gantt charts
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "Software Launch Plan · gantt-basic · julia · makie · anyplot.ai" is clearly readable and comfortably sized (~55% of plot width). Y-axis task labels (Requirements Gathering, System Design, ... Production Deployment) render in dark ink and are fully legible. X-axis month ticks (Jan/Feb/Mar/Apr) and axis title "Project Timeline (2026)" are dark-gray and readable. Vertical gridlines at month boundaries are subtle. A dashed "Today" vline with label sits near mid-March, clearly visible against the light background.
      Data: Four category colors — green (Planning), lavender/purple (Development), blue (Testing), ochre (Deployment) — each horizontal bar clearly distinguishable from the background and from each other. First category (Planning) correctly uses Imprint brand green #009E73. Legend on the right, titled "Category", lists all four categories with matching swatches, unframed.
      Legibility verdict: PASS — no text is light-on-light; all chrome elements read clearly against the off-white surface.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in near-white ink, fully legible. Y-axis task labels and x-axis tick labels render in a soft light-gray tone (INK_SOFT), clearly visible against the dark surface. Gridlines remain subtle but visible. The "Today" dashed vline switches to a light gray/white dash with matching label text, still clearly visible.
      Data: Bar colors are pixel-identical to the light render — green, lavender, blue, and ochre are unchanged, confirming only chrome (not data colors) adapts to theme. Legend renders with light text on the dark background, fully legible.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, ticks, legend, "Today" annotation) is clearly readable against the near-black surface.
