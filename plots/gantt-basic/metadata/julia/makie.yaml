review:
  strengths:
  - Idiomatic use of barplot!(direction=:x, fillto=start_nums) to build the Gantt
    bars per category — a clean way to express a chart type Makie has no dedicated
    recipe for
  - 'Correct Imprint palette application: first unique category ("Planning") gets
    brand green #009E73, and colors stay identical between light/dark renders'
  - 'Effective data storytelling: dashed "Today" vline plus a star + "In Progress"
    annotation on the currently active task gives the chart a clear focal point beyond
    a static timeline'
  - Duration labels ("11d", "32d", ...) add useful context without cluttering the
    bars
  - Clean theme-adaptive chrome throughout (title/axis/tick/legend colors, grid alpha)
    with L-shaped spines and a subtle x-only grid appropriate for a Gantt layout
  - Tasks ordered top-to-bottom by start date, matching the spec's request for logical
    ordering
  weaknesses:
  - Duration annotation text (fontsize=10) is noticeably smaller than the tick labels
    (12-13) — fine at full resolution but the first element to disappear when scaled
    to mobile width; could bump to ~11-12
  - '`using Random; Random.seed!(42)` is vestigial since all data (tasks/categories/dates)
    is hardcoded rather than randomly generated — harmless but not doing any work'
  - Legend swatches/labels are a touch small relative to the rest of the chrome; could
    grow slightly for better mobile legibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Software Launch Plan · gantt-basic · julia · makie · anyplot.ai" is bold dark text, comfortably sized and fully within the canvas (confirmed via a top-edge crop — no clipping). Y-axis task labels (10 tasks, e.g. "Requirements Gathering", "Production Deployment") and x-axis month ticks (Jan-May) are dark/soft-dark and clearly legible. "Today" label and dashed vertical line are visible near March. Legend ("Category": Planning/Development/Testing/Deployment) sits at the right edge with generous margin (confirmed via a right-edge crop — swatches and text fully inside the canvas, not clipped).
      Data: Horizontal bars colored by category — Planning is brand green (#009E73, first unique category), Development is lavender, Testing is blue, Deployment is ochre. A star marker + "In Progress" label highlights the currently active task (Frontend Development). Small duration labels ("11d", "18d", "32d", etc.) sit to the right of each bar.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, tick labels, and legend text all flip to light tones (white title, light-gray secondary text) and remain clearly legible. The "Today" dashed line and label render in light gray against the dark background. No dark-on-dark failures observed anywhere (title, ticks, legend, duration labels, "In Progress" annotation all readable).
      Data: Bar colors are pixel-identical to the light render (green/lavender/blue/ochre) — only chrome (background, text, grid, spines) changed between themes, as required.
      Legibility verdict: PASS — all text reads clearly against the dark background, confirmed no dark-on-dark text.
