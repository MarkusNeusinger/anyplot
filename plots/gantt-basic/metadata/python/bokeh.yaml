review:
  strengths:
  - One hbar renderer per category with legend_label, so bokeh builds the titled 'Phase'
    legend natively
  - 'Theme tokens threaded through title, axis, grid and legend: both renders read
    cleanly'
  - Tasks sorted by start date, giving a clear staircase from Planning to Deployment
  - Canvas exactly 3200x1800 with toolbar disabled and CDP viewport override
  weaknesses:
  - 'VQ-05 (both): the x-range starts about 24 % of the span before the first task
    (≈ Dec 10) to make room for task names drawn as data-space text, so the Jan 01
    gridline and the axis run under the labels → put the names on a categorical y-axis
    (FactorRange of task names, y tick labels) and start the x-range at the first
    start date minus a few days. Likely cause: Range1d(df[START].min() - span * 0.24,
    …) plus p.text labels.'
  - 'VQ-06 (both): neither the axis title ''Timeline'' nor the ticks ''Jan 01'' …
    ''Apr 01'' state the year 2025 → axis title such as ''Date (2025)'' or a year
    in the tick format. Likely cause: x_axis_label=''Timeline'' with formatter ''%b
    %d''.'
  - 'Suggestion: weekly minor ticks or gridlines would make each bar''s start and
    end easier to read than four monthly ticks.'
  - 'Suggestion: a month-only tick format (''%b'') would drop the redundant ''01''
    on monthly ticks.'
  image_description: |-
