review:
  strengths:
  - 'Every bar sits at its own task''s dates: the bar-shift loop reads each patch''s
    row from its y-centre, so it stays correct when seaborn draws its patches per
    hue level'
  - Tasks sorted by start date top-down give a clean staircase from Site Preparation
    to Final Inspection
  - 'Seven phases in canonical Imprint order, starting with #009E73, with a titled
    legend (Phase) and a theme-ink dashed Today line'
  - Canvas is exactly 3200x1800 in both themes, with explicit font sizes at the library
    reference (12/10/8 pt)
  - Theme tokens are threaded through sns.set_theme rc, so both renders are fully
    legible
  - Adaptable structure with column constants and an x-only grid on biweekly Monday
    ticks
  weaknesses:
  - 'VQ-07, VQ-03 (both): sns.barplot''s default saturation=0.75 desaturates every
    bar (e.g. Systems bars read around #9E3F3F instead of #AE3030, Foundation around
    #148B6B instead of #009E73), so the bars are not exact Imprint hexes and no longer
    match their full-saturation legend swatches → draw bars at the exact palette colors
    (saturation=1). Likely cause: sns.barplot call without saturation=1.'
  - 'Suggestion: the date ticks show month and day only; naming the year in the axis
    title (e.g. ''Date (2026)'') would anchor the schedule.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "gantt-basic · python · seaborn · anyplot.ai" in dark ink, axis titles "Task" / "Timeline", dark-grey tick labels (task names at left, biweekly "Feb 16" … "Jun 22" dates rotated 45°), subtle x-only grid, top/right spines removed, legend "Phase" upper right on elevated off-white box. All readable.
      Data: 12 horizontal bars sorted by start date in a staircase, colored by phase: Foundation #009E73, Structure #C475FD, Exterior #4467A3, Interior #BD8233, Systems #AE3030, Finishing #2ABCCD, Finalization #954477 (bars slightly desaturated vs legend swatches). Dashed ink "Today" line at May 10 crossing the Systems bars.
