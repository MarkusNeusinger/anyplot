review:
  strengths:
  - One bar per task from start to end date on a shared monthly time axis, ordered
    by start date so the schedule steps down as a staircase
  - 'Phases coloured by the Imprint palette in canonical order (first phase #009E73)
    with identical data colours in both themes and a named legend'
  - Plot area read from pygal's rendered SVG instead of hard-coded pixel constants,
    so bars stay aligned to the canvas
  - 'Theme tokens threaded through every injected element: month guides, tick labels
    and axis title flip correctly between light and dark'
  - Bars carry SVG <title> tooltips with task name, dates and duration in the HTML
    output
  - Realistic office-construction schedule with overlapping trades and varied durations
  weaknesses:
  - 'VQ-03 (both): the legend swatches are drawn at pygal''s default series opacity,
    so they read paler than the solid bars in the light render (Interiors looks pink
    against the #AE3030 bars) and murkier in the dark render → swatches at the bars''
    full opacity. Likely cause: Style() without opacity="1" while the injected bars
    have no opacity.'
  - 'VQ-05 (both): the task labels drift against their bars from top to bottom: about
    15 px below the bar centre in the first row and about 30 px above it in the last
    row → each label on its bar''s centre line (0 px). Likely cause: row_h = plot_h
    / n_tasks from the plot background rect, while pygal places the x_labels on its
    own band positions; read the label y positions from the rendered SVG or place
    the bars at them.'
  - 'CQ-01 (code): a helper function x_at (lines 115-116) for a one-line date-to-pixel
    mapping → inline the expression in the two loops. Likely cause: the helper.'
  - 'Suggestion: the legend sits in the far top-left corner away from the plot; placing
    it nearer the task column or above the plot would tie it to the bars.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "Office Building Construction · gantt-basic · python · pygal · anyplot.ai" in dark monospace across ~83% of the width; 11 task names right-aligned in a left column; dashed muted month guides with "Mar 2026" ... "Dec 2026" tick labels and a "Date" axis title below; five-entry phase legend in the top-left corner. All dark text, all readable.
      Data: 11 rounded horizontal bars stepping down from Site Survey & Permits (Mar) to Fit-out & Handover (Dec), coloured by phase: Site Works #009E73, Foundation #C475FD, Structure #4467A3, Envelope #BD8233, Interiors #AE3030. Legend swatches are paler than the solid bars. Task labels sit slightly below their bar centres at the top and slightly above at the bottom.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, task labels, month ticks, axis title and legend text all switch to light ink #F0EFE8; month guides in muted grey. No dark-on-dark text.
      Data: bar colours identical to the light render; brand green clearly visible. Legend swatches render darker than the bars (pygal default opacity over the dark page).
      Legibility verdict: PASS
