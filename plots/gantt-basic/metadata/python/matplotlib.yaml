review:
  strengths:
  - Exact 3200x1800 canvas from figsize=(8, 4.5), dpi=400 with the default bbox, so
    nothing is trimmed and the layout breathes inside the frame
  - 'All chrome threaded through theme tokens (INK, INK_SOFT, ELEVATED_BG legend frame):
    every label, tick and legend entry is readable on both #FAF8F1 and #1A1A17, and
    the Imprint category colors stay identical across themes'
  - Tasks sorted by start date with ax.invert_yaxis(), giving the expected staircase
    from top-left to bottom-right, one row per task with uniform 0.6 bar height and
    clear gaps
  - Date axis built with mdates.WeekdayLocator(byweekday=MO, interval=2) and DateFormatter('%b
    %d'), a format suited to the four-month range so starts and ends read against
    Monday gridlines
  - 'Adaptable data zone: tidy pandas DataFrame read through column constants, category
    colors assigned from the data''s own order, the today marker and axis year derived
    from the data rather than hard-coded'
  weaknesses:
  - 'Suggestion: the per-row barh loop could be a single ax.barh(range(len(tasks)),
    (tasks[END] - tasks[START]).dt.days, left=tasks[START], color=tasks[CATEGORY].map(category_colors),
    height=0.6) call.'
