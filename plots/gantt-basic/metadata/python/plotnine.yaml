review:
  strengths:
  - 'Idiomatic geom_segment Gantt: bars run exactly from start to end on a shared
    date axis, sorted by start date into a clean staircase'
  - Full eight-position Imprint palette with scale_color_manual limits in data order,
    so the legend reads Planning → Deployment in schedule order
  - Theme tokens threaded through every chrome element; both renders readable with
    identical data colors
  - 'Adaptable structure: column constants and a self-contained Data block; the current-date
    line is computed from the data'
  weaknesses:
  - 'VQ-05 (both): the legend entry ''Development'' runs into the right edge of the
    legend frame, leaving no padding, while the frame itself sits about 20 px from
    the canvas edge → keep at least a few px of padding inside the frame (for example
    legend_key_spacing or a slightly smaller legend_text, -1 pt). Likely cause: legend_position=''right''
    with the framed legend_background and no legend padding set.'
  - 'Suggestion: the legend key backgrounds draw faint rectangles behind each swatch
    (visible in the dark render); legend_key=element_rect(fill=ELEVATED_BG, color=ELEVATED_BG)
    would remove them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: bold dark title "gantt-basic · python · plotnine · anyplot.ai" centered; axis titles "Date" and "Task" in dark ink; task names and 45°-rotated ISO date ticks (2025-01-15 … 2025-03-15) in soft ink; subtle vertical grid; framed legend "Phase" on the right on an elevated background. All readable.
      Data: 10 horizontal bars stepping down by start date: Requirements green #009E73 (Planning), UI Design and Backend Architecture purple (Design), Database Setup to Integration blue (Development), Testing and Documentation ochre (QA), Deployment red (Deployment). Dashed semi-transparent vertical today line at about Feb 12/13 crossing API and Frontend Development.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, ticks and task names in light grey; legend frame light grey on #242420. No dark-on-dark text; the 'Development' legend entry touches the legend frame's right edge, as in the light render.
      Data: bar colors identical to the light render; brand green clearly visible; dashed today line in light ink at the same position.
      Legibility verdict: PASS
