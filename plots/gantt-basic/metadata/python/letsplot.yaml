review:
  strengths:
  - Calendar date ticks every 7 days ('Jan 06' … 'Mar 10') with a 'Date (2025)' axis
    title, generated from df so each bar's start and end read against the grid
  - Tasks sorted by start date into a clean staircase, phases mapped chronologically
    so Planning gets the Imprint green and the legend reads in project order (scale_color_manual
    limits)
  - Theme tokens thread through every chrome element; both renders are fully readable
    with identical data colors
  - 'Adaptable structure: column constants, a self-contained Data block, palette with
    all eight Imprint positions, today line derived from the data'
  - Interactive HTML export alongside the PNG gives lets-plot hover tooltips on each
    bar
  weaknesses:
  - 'DE-02 (both): the panel is enclosed by all four spines, a full dark frame on
    light and a grey frame on dark, where nothing in a Gantt chart requires them →
    left and bottom spines only (or none). Likely cause: theme_minimal() plus axis_line=element_line(...)
    draws the full panel border; remove it (e.g. panel_border=element_blank()) and
    keep only the bottom/left axis lines.'
  - 'VQ-05 (both): the Phase legend box ends flush with the right canvas edge (about
    10 px of margin at 3200 px) while the plot area has room to spare → at least about
    40 px of right margin. Likely cause: legend_position=''right'' with no plot_margin
    set.'
  - 'Suggestion: wider bars (size about 7-8) would fill more of each row while keeping
    the visible gap.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct; 3200x1800 landscape.
      Chrome: title "gantt-basic · python · letsplot · anyplot.ai" top-left in dark ink; y-axis title "Task" and x-axis title "Date (2025)"; task names and weekly date ticks (Jan 06 … Mar 10) in INK_SOFT, all readable. Subtle grid. The panel is enclosed by a full four-sided dark frame. Legend "Phase" on an elevated off-white box at the right edge.
      Data: 12 horizontal bars sorted by start date as a staircase: Planning #009E73 (Requirements Gathering, System Design), Design #C475FD, Development #4467A3, Testing #BD8233, Documentation #AE3030, Deployment #2ABCCD. Dashed INK_SOFT current-date line at Feb 17 crosses Frontend Development and Unit Testing.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title and axis titles in light ink, task names and date ticks in light grey, all readable; no dark-on-dark text. Grid subtle; full four-sided grey panel frame; legend on #242420 elevated box; dashed today line in light grey.
      Data: bar colors identical to the light render; brand green clearly visible.
      Legibility verdict: PASS
