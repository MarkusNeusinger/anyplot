review:
  strengths:
  - Progress-to-date shading (full-duration bar at alpha 0.35 overlaid with an alpha-1
    segment from start to min(end, today)) gives a real dual-state signal for elapsed
    vs. remaining work — a genuinely distinctive touch beyond a plain Gantt bar
  - Vertical dashed 'Today' line with a clear label satisfies the spec's optional
    current-date marker without crowding the chart
  - 'Workstream color coding via the Imprint palette is correctly mapped, with the
    first alphabetical category (Design) landing on #009E73 and the rest following
    canonical order'
  - Theme tokens (PAGE_BG/INK/INK_SOFT) are threaded consistently through panel, legend,
    grid, and text elements in both renders — no dark-on-dark or light-on-light failures
  - Rounded-cap geom_segment bars with generous y-axis expansion give clean, well-spaced
    rows across 13 tasks, well within the 5-30 task range
  - Title format matches the mandated pattern with a sensible descriptive prefix ('Product
    Launch Plan')
  weaknesses:
  - Legend order (Design, Discovery, Engineering, Launch — alphabetical factor default)
    doesn't match the top-to-bottom visual flow of the chart (Discovery -> Design
    -> Engineering -> Launch), which slightly undercuts the narrative read; set explicit
    factor levels on workstream in project order so the legend mirrors the chart flow
  - X-axis title 'Timeline' is generic — 'Project Timeline' or 'Schedule' would carry
    a touch more context without adding length
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Dark title "Product Launch Plan · gantt-basic · r · ggplot2 · anyplot.ai" is clearly legible; legend ("Workstream": Design, Discovery, Engineering, Launch) reads cleanly in dark ink against the light background; x-axis month/year tick labels (Feb 2026 - Jul 2026) and y-axis task names (13 tasks, e.g. "Market research", "General availability") are all dark and fully readable; subtle vertical gridlines are visible without competing with data; the dashed "Today" line and its label read clearly in muted ink-soft gray.
      Data: First categorical series (Design, alphabetically first) renders in brand green #009E73; Discovery is lavender, Engineering is blue, Launch is ochre/tan — consistent with the Imprint palette in canonical order. Elapsed portions of in-progress/past tasks (Market research, Backend architecture, the pre-today slice of API development/Frontend build) render at full opacity; not-yet-started or not-yet-reached portions render as a lighter alpha-0.35 wash, producing a clear "progress to date" read.
      Legibility verdict: PASS — no light-on-light or illegible text found; no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and legend text render in light off-white/gray and are clearly legible against the dark background; axis tick labels (month/year and task names) render in a soft light gray, fully readable; gridlines are faint but visible; the dashed "Today" line and label are light gray, easily distinguishable from the dark background.
      Data: Data colors are pixel-identical to the light render — same green/lavender/blue/ochre categorical hues and the same alpha-based progress-shading contrast (solid vs. faded bars for elapsed vs. remaining task duration). Only chrome (background, ink, grid) flipped between renders, as required.
      Legibility verdict: PASS — no dark-on-dark failures detected; all text and data elements are clearly distinguishable from the near-black background.
