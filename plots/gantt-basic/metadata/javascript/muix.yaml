review:
  strengths:
  - 'Floating bars built with the community BarChart: a transparent stacked offset
    segment up to each start, then one series per phase for the duration, so every
    bar runs from its start to its end date on a shared time axis'
  - Tasks sorted by start date give a clean staircase; one thickness per bar (categoryGapRatio
    0.35) leaves a visible gap between rows
  - Weekly-multiple tick step computed from the schedule span (two-week ticks for
    79 days) with short 'Jan 5' labels; the year and the full range go into a computed
    subtitle
  - The status-date line uses ChartsReferenceLine composed as a child of BarChart,
    with a bold 'As of Feb 20' label in the ink token, so it reads in both themes
  - Per-series valueFormatter shows each task's date range in the HTML tooltip and
    hides the offset segment (returns null)
  - Phase colors are Imprint positions 1-4 in order, with the legend at top center;
    chrome is threaded from ANYPLOT_TOKENS, and data colors match in both themes
  weaknesses:
  - 'Suggestion: because borderRadius applies only to the outer ends of a stack, every
    bar is rounded on its right end and square on its left; giving the bars matching
    ends (borderRadius 0, or rounding both ends) would look more even.'
  - 'Suggestion: the 68 px x-axis band leaves a wide gap between the date ticks and
    the ''Date'' title; a tighter band would sit the title closer to its ticks.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "gantt-basic · javascript · muix · anyplot.ai" at top center, with a soft-ink subtitle "11 tasks colored by Phase · Jan 5, 2026 – Mar 25, 2026 (79 days)" under it and a horizontal legend (Design, Development, Testing, Launch) under that. 11 task names right-aligned on the y axis; date ticks Jan 5, Jan 19, Feb 2, Feb 16, Mar 2, Mar 16 at two-week steps; x-axis title "Date". Subtle vertical grid lines at each tick. All text is dark and readable.
      Data: 11 horizontal bars in a start-date staircase: Design in green #009E73, Development in purple, Testing in blue, Launch in ochre (Imprint positions 1-4). A dashed ink line at Feb 20 is labelled "As of Feb 20" in bold at the top; Backend development ends exactly on it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, task names, ticks and axis title are all light ink; the grid is a faint gray and still visible; the axis lines are light. There is no dark-on-dark text. The as-of line and its label flip to light ink.
      Data: the bar colors and positions are identical to the light render; brand green stays clearly visible.
      Legibility verdict: PASS
