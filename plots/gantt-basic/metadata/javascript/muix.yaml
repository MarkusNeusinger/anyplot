review:
  strengths:
  - Clever offset-stack technique (invisible offset segment + per-category duration
    segment) renders a true start-to-end Gantt from MUI X's community BarChart, which
    has no native Gantt component
  - 'Correct Imprint palette usage — first category (Design) is brand green #009E73,
    remaining three categories follow canonical positions 2-4'
  - Fully theme-adaptive chrome verified in both renders (pixel-level check of the
    reference-line label confirms white text on the dark render and dark text on the
    light render — no dark-on-dark or light-on-light)
  - 'Status reference line (''Status: Feb 20'') adds real data storytelling by showing
    project progress against the current date'
  - Realistic, well-scaled project data — 11 tasks across 4 logically ordered phases
    spanning ~10 weeks
  - No edge clipping in either render; title, legend, axis labels and bars all sit
    comfortably inside the canvas with generous margins
  weaknesses:
  - Design excellence stays close to library defaults — no visual hierarchy differentiates
    completed vs. in-progress vs. upcoming tasks relative to the status line (e.g.
    dimming/hatching the portion of a bar before or after the status date)
  - Title occupies only ~40% of canvas width, on the low side of the 50-70% guideline
    given the room available after the descriptive prefix — could use a slightly larger
    fontsize
  - Only one distinctive MUI X feature (ChartsReferenceLine) is used beyond the base
    BarChart; no exploration of e.g. per-bar labels or a highlighted phase band to
    further showcase library capability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Website Redesign Timeline · gantt-basic · javascript · muix · anyplot.ai" in dark ink, clearly legible; four-item swatch legend (Design/Development/Testing/Launch) below the title; y-axis task names and x-axis date ticks (Jan 5 … Mar 16) in medium-grey ink, all readable; subtle vertical grid lines every ~2 weeks; dashed black reference line labeled "Status: Feb 20" in bold dark text.
      Data: 11 horizontal bars, one per task, colored by category — Design = brand green #009E73, Development = lavender, Testing = blue, Launch = ochre. Bars are offset horizontally to align with each task's actual start/end date via an invisible leading segment. All text is readable against the light background — no legibility issues found.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, axis labels and ticks now rendered in light ink/off-white, clearly legible against the dark surface; grid lines subtle and still visible; dashed white reference line labeled "Status: Feb 20" in bold light text — pixel-level inspection confirms this label renders in a light color here (not dark-on-dark).
      Data: Same 11 bars in identical category colors as the light render (green/lavender/blue/ochre) — confirmed only chrome flipped, data colors unchanged. All text is readable against the dark background — no dark-on-dark failures found anywhere (title, legend, axis, tick labels, and reference-line label all checked).
      Legibility verdict: PASS
