review:
  strengths:
  - Clever use of a stacked horizontal BarChart (invisible offset segment + per-category
    segments) to fake a native Gantt layout in a library with no Gantt primitive —
    bars land at the correct start/end days.
  - 'ChartsReferenceLine gives a clean dashed ''Status: Feb 20'' marker exactly as
    the spec''s ''vertical line for current date'' requirement asks for, labelled
    and readable in both themes.'
  - 'Categorical colors follow the Imprint canonical order exactly (Design=brand green
    #009E73, Development=lavender, Testing=blue, Launch=ochre) and are pixel-identical
    between light and dark renders — only chrome flips.'
  - Tasks are logically grouped by phase and ordered by start date, with generous
    category gap ratio (0.35) giving each bar clear breathing room.
  - Date axis uses a plain day-offset linear scale with a valueFormatter rendering
    calendar dates ('Jan 5', 'Feb 16', ...) at a sensible 14-day tick interval — clean
    and uncluttered for a ~2.5 month project.
  - Title, axis labels and legend are all explicitly sized and fully legible in both
    light and dark renders; no clipping, overlap, or dark-on-dark/light-on-light failures.
  weaknesses:
  - 'The ''Done'' vs ''Remaining vs. status date'' progress encoding is non-functional:
    every bar renders as a single full-opacity solid color, with zero visible transition
    at the status date, in BOTH themes. Verified by pixel sampling: Frontend Development
    (Development series, expected done=22d solid / remaining=4d at rgba(...,0.4))
    is uniform (196,117,253) across its entire width with no lighter tail; Unit Testing
    (Testing series, expected done=0 / remaining=8d, i.e. the WHOLE bar should render
    at 0.4 alpha) instead renders fully opaque (68,103,163), identical to a ''done''
    segment. The second legend row (''Done'' solid swatch / ''Remaining vs. status
    date'' faded swatch) therefore promises a distinction the chart never shows —
    likely because MUI X BarChart resolves per-segment styling by the shared `label:
    category` rather than the per-series `color`/`id`, so the ''-done'' and ''-remaining''
    series for the same category collapse to one visual style. Either fix the color
    resolution so the 0.4-alpha ''remaining'' segments actually render lighter (e.g.
    verify per-series `color` truly overrides when two series share a `label`, or
    differentiate via a distinguishing prop), or drop the done/remaining split and
    its legend row entirely — the Gantt chart already fully satisfies the spec via
    the status reference line alone.'
  - Because the progress split does nothing visually, the ~35 lines of supporting
    code (OFFSET_SERIES, hexToRgba, PROGRESS mapping, 8 extra done/remaining series
    feeding CATEGORIES.flatMap) add real complexity for zero delivered value — this
    is dead/misleading complexity rather than appropriate sophistication.
  - 'Data Storytelling only partially lands: the status reference line does useful
    work, but the intended ''which tasks are ahead/behind schedule'' visual hierarchy
    (via done/remaining shading) is completely absent from the rendered output.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Website Redesign Timeline · gantt-basic · javascript · muix · anyplot.ai" in dark ink at top-left, fully visible and not clipped. A category legend row (Design/Development/Testing/Launch swatches + labels) and a second row (Done / Remaining vs. status date swatches + labels) sit below the title. X-axis shows date labels (Jan 5, Jan 19, Feb 2, Feb 16, Mar 2, Mar 16) with subtle vertical gridlines; axis title "Project Timeline" below. Y-axis lists 11 task names in dark-soft ink. A black dashed vertical reference line labeled "Status: Feb 20" crosses the chart. All text is clearly readable against the light background — no light-on-light issues.
      Data: 11 horizontal bars positioned at their correct start/end day offsets, colored by category using the Imprint palette (Design=brand green #009E73, Development=lavender #C475FD, Testing=blue #4467A3, Launch=ochre #BD8233) — first category correctly uses the mandatory brand green. However, pixel sampling confirms every bar renders as a single flat, full-opacity color regardless of whether the task is fully complete, fully upcoming, or split by the status date — the "Remaining vs. status date" lighter-tint segment promised by the second legend row never actually appears (e.g. Unit Testing, which starts after the Feb 20 status date and should render entirely in the pale "remaining" tint, instead renders as the same solid blue as any "done" bar).
      Legibility verdict: PASS (readability), but the done/remaining data encoding itself is broken — see weaknesses.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend rows, axis labels and task names as the light render, now rendered in light ink/white against the dark background — all clearly legible, no dark-on-dark failures anywhere (title, ticks, legend text, task names all confirmed readable). The status reference line and its "Status: Feb 20" label render in white/light ink with a dashed white line, correctly adapted from the light render's black line.
      Data: Bar colors are pixel-identical to the light render (verified: Development bar = rgb(196,117,253) in both renders, Testing bar = rgb(68,103,163) in both renders) — only chrome flips between themes, as required. The same done/remaining rendering bug is present here too: Unit Testing (entirely "remaining") still renders as the same solid full-opacity blue seen in tasks that are fully "done," with no alpha-blended lighter segment in either theme.
      Legibility verdict: PASS (readability), but same broken progress-encoding as the light render.
