review:
  strengths:
  - 'Complete Campbell diagram: four named modes (two rising bending modes, a falling
    torsional mode, a near-flat axial mode), three engine-order lines from the origin
    with slope n/60, and red diamond critical-speed markers on the analytic intersections.'
  - 'Clear layering: engine-order lines in the muted ink token and dashed, so the
    Imprint-colored mode curves and the red critical-speed diamonds read first.'
  - 'Full theme-adaptive chrome in both renders: correct backgrounds, INK/INK_SOFT
    text and spines, elevated legend background, identical categorical colors.'
  - Short, linear CairoMakie script with idiomatic lines!/scatter!/text! and a side
    Legend sized with colsize!.
  weaknesses:
  - 'SC-02 (both): the 2× engine-order line crosses the 1st Torsional curve at about
    5581 RPM / 186 Hz with no critical-speed marker, so one of the seven in-range
    intersections is unmarked → mark every in-range intersection (7 markers, +1).
    Likely cause: crit_spd/crit_frq are a hand-typed list that omits Mode 3 + 2×;
    compute them from n·s/60 = f(s) for every mode/order pair instead.'
  - 'VQ-01 (both): the inline 1×/2×/3× engine-order labels at fontsize 11 sit below
    the 12 px tick-label reference and read small beside the 14 px axis titles → at
    least 12 px (+1 to +3 px). Likely cause: text!(...; fontsize = 11).'
  - 'Suggestion: placing the order labels near the upper end of each engine-order
    line would tie them to the line more clearly than the shared x = 2100 column.'
  image_description: |-
    Light render (plot-light):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title 'campbell-basic · julia · makie · anyplot.ai' centered top; 'Rotational Speed (RPM)' and 'Frequency (Hz)' in dark ink; dark-grey ticks 0-6000 and 0-300; top/right spines removed; subtle y-only grid at 100 Hz steps; side legend on an elevated off-white box with six entries. All readable; the inline 1×/2×/3× labels are small.
      Data: 1st Bending #009E73 (50→75 Hz), 2nd Bending lavender #C475FD (120→145 Hz), 1st Torsional blue #4467A3 (200→185 Hz), Axial ochre #BD8233 (310→318 Hz); three grey dashed engine-order lines from the origin to 100/200/300 Hz at 6000 RPM; six red #AE3030 diamonds on the intersections at about 1091, 1714, 2618, 3810, 4000, 4114 RPM. The 2× line crosses 1st Torsional near 5580 RPM without a marker.
      Legibility verdict: PASS

    Dark render (plot-dark):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles and legend text in light ink, ticks in soft light grey, spines light grey, grid faint but visible, legend on #242420. No dark-on-dark text.
      Data: mode-curve and diamond colors identical to the light render; engine-order lines switch to the light muted grey; green and red marks remain clearly visible.
      Legibility verdict: PASS
