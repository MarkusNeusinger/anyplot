review:
  strengths:
  - Critical speeds found by vectorised sign-change detection with linear interpolation,
    so each diamond sits exactly on its EO/mode crossing
  - Modes told apart by Imprint hue and by dash style (solid, dash, dot, dashdot);
    EO lines kept in muted grey dashes as the reference layer
  - Theme tokens threaded through every chrome element; both renders readable, data
    colors identical across themes
  - customdata-driven hovertemplate names the mode × order pair of each critical speed
    in the HTML
  - Shaded critical speed zones (the Notes' optional feature) drawn with add_vrect
    below the traces
  weaknesses:
  - 'SC-01, VQ-02 (both): two callout annotations (''71 Hz / Axial × 3x'' and ''1st
    critical / 489 RPM'') and the ''All Modes'' / ''Modes Only'' updatemenus buttons
    are additions the basic variant excludes (C5: no further callouts); the ''1st
    critical'' box also sits over the EO 2x/3x lines near the origin → remove both
    callouts and the buttons. Likely cause: the add_annotation block after the critical
    speed markers and layout updatemenus.'
  - 'SC-02, VQ-02 (both): the ''3x'' engine order label is hidden behind the ''71
    Hz'' callout box at about 1600 RPM / 80 Hz, so the 3x line carries no visible
    order label → the label visible beside its line. Likely cause: the callout''s
    ax=50, ay=-45 placing its box over the label drawn at 75 % of the 3x segment;
    removing the callout clears it.'
  - 'VQ-02 (both): the legend box in the upper left covers the Axial curve from 0
    to about 1050 RPM (73–75 Hz) → legend clear of all data, e.g. in the empty upper-right
    area or a horizontal legend below the plot. Likely cause: legend x=0.01, y=0.99,
    xanchor=''left'', yanchor=''top''.'
  - 'DQ-01 (both): 12 critical speed markers, above the spec''s 6–10 → 6–10 (−2 or
    more). Likely cause: all four modes lie below 100 Hz, so every one of the three
    orders crosses every mode inside 0–6000 RPM; place a mode (e.g. Axial) above the
    1x line''s reach or below the crossings so some mode/order pairs do not intersect.'
  - 'Suggestion: the active ''All Modes'' button keeps plotly''s pale-blue active
    fill with near-white text in the dark theme; the buttons themselves are the SC-01
    defect, removing them is the fix.'
  - 'Suggestion: the three identical grey ''EO 1x/2x/3x'' legend entries could be
    one ''Engine order'' entry, since the direct labels name the orders.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on paper and plot area.
      Chrome: title 'campbell-basic · python · plotly · anyplot.ai' centered in dark ink; axis titles 'Rotational Speed (RPM)' and 'Frequency (Hz)' and ticks 0-6000 / 0-110 in dark/INK_SOFT; legend upper-left on elevated fill with border; 'All Modes' / 'Modes Only' buttons upper-right; the active 'All Modes' button has a pale-blue fill with dark text.
      Data: 1st Bending solid #009E73 (rising 22→45 Hz), 2nd Bending dashed #C475FD (falling 49→29), 1st Torsional dotted #4467A3 (flat ~55-57), Axial dashdot #BD8233 (falling 75→50); EO 1x/2x/3x grey dashed lines from the origin with '1x' and '2x' direct labels on chips; 12 red #AE3030 diamonds with page-colored outline at the crossings; three faint red zones at ~1430, ~2060, ~3590 RPM; two red-bordered callouts ('71 Hz / Axial × 3x', '1st critical / 489 RPM'). The '3x' label is hidden behind the 71 Hz callout; the legend covers the start of the Axial curve.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink; legend and 'Modes Only' button on #242420 fill with light text; the active 'All Modes' button keeps a pale-blue fill with near-white text that is barely readable (an element of the excluded button control); grid subtle.
      Data: mode colors, red diamonds and callout colors identical to the light render; EO lines switch to light grey INK_SOFT dashes and stay clearly visible; red zones read as faint dark-red bands.
      Legibility verdict: PASS
