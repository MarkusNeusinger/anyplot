review:
  strengths:
  - End-of-line mode labels in each curve's own Imprint color identify all five mode
    shapes directly
  - Engine order labels rotated to the angle of their line, on elevated chips that
    keep them legible over the dashes
  - Critical speeds computed by linear interpolation at the true crossings, so every
    marker sits on its line and curve
  - 'Fully theme-adaptive chrome: both renders pass the readability check with identical
    mode colors'
  weaknesses:
  - 'SC-01 (both): unasked layers the basic variant excludes — an operating-range
    band with dotted boundary lines and ''Operating Range'' text, amber-vs-gray marker
    split by that range, and mode-name callout boxes with arrows on four critical
    speeds → drop the band, the in/out split and the callouts; one marker style for
    all critical speeds. Likely cause: the axvspan/axvline block, the in_op split
    and the annotate loop.'
  - 'VQ-02, SC-02 (both): the upper-left legend covers the 3x and 2x lines and the
    3rd Bending curve between ~1,800 and 2,600 RPM and hides the 3x × 3rd Bending
    critical speed marker at ~2,010 RPM / 100 Hz → no data under the legend (for example
    place it outside the axes or in the empty lower-right region). Likely cause: ax.legend(loc="upper
    left").'
  - 'DQ-03 (both): 14 critical speed crossings are marked against the spec''s 6–10
    → 6–10 (−4 or more). Likely cause: five modes all crossing all three orders inside
    0–6,000 RPM; lower the higher modes'' base frequency or narrow the speed range.'
  - 'CQ-04 (code): lines 123–138 rebuild the engine order label angle from hard-coded
    axes fractions (ax_w_frac=0.75 while subplots_adjust gives 0.77) → annotate(...,
    rotation=np.degrees(np.arctan(eo/60)), transform_rotates_text=True) lets matplotlib
    rotate in data space. Likely cause: manual display-slope arithmetic.'
  - 'Suggestion: a single critical-speed marker style in red or amber with a thin
    ink outline would read as one distinct class in both themes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
