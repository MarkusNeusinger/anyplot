  strengths:
  - Critical speeds found by a sign-change search, markers sit on the crossings
  - alt.Detail groups the engine order lines without a legend entry
  - Theme tokens threaded through all chrome; both renders read cleanly
  - Tooltips on the critical-speed markers in the HTML output
  weaknesses:
  - 'SC-01 (both): the basic variant gets unasked additions — an operating range band
    (2500-4500 RPM) with its label, critical-speed markers split into filled and outlined
    by an in-range flag, and three critical-speed callouts → remove the band, the
    label, the split and the callouts; draw all critical speeds with one marker. Likely
    cause: op_band, op_label, df_crit_in/df_crit_out and annot_chart layers.'
  - 'VQ-02 (both): the ''Axial / 3x'' callout is drawn across the 3rd Bending curve
    and under the 3rd Bending / 3x diamond, which hides its slash → no text over curves
    or markers (removing the callout per the SC-01 line clears it). Likely cause:
    annot_chart dy=-20.'
  - 'VQ-02 (both): the ''3x'' order label is drawn on its own dashed line near 5,800
    RPM → place it clear of the line at the line end. Likely cause: eo_labels capped
    at Hz=283 with dx=4, dy=-8.'
  - 'VQ-05 (both): a fixed 620x320 view padded to 3200x1800 with PIL leaves wide empty
    margins, and the legend frame hugs its text → autosize fit with contains=''padding''
    at width=800, height=450, and legend padding. Likely cause: width=620, height=320,
    padding 0 and the PIL paste.'
  - 'SC-04 (both): the critical-speed diamonds have no key or direct label, so the
    reader is not told what they or their filled/outlined difference mean → one keyed
    critical-speed marker in the legend. Likely cause: crit charts use alt.value color
    with no legend.'
  - 'CQ-04 (code): lines 41-51 build the mode and engine order tables row by row from
    nested loops of dicts → one pd.DataFrame per series from the arrays. Likely cause:
    the mode_rows/eo_rows loops.'
  - 'Suggestion: the critical-speed red #AE3030 is also the 3rd Bending curve''s color;
    markers on that curve separate only by their stroke.'
