review:
  strengths:
  - 'Complete Campbell diagram: five named modes (two rising bending/torsional, falling
    2nd Bending and Axial), three dashed 1x/2x/3x lines from the origin with slope
    order/60, and markers at the interpolated crossings'
  - Colour-matched direct mode labels at the curve ends, kept apart by a computed
    minimum gap
  - 'Idiomatic seaborn: melt to long form, sns.lineplot with hue/hue_order/palette,
    sns.scatterplot on data frames, set_theme rc and despine'
  - Theme tokens threaded through all chrome; both renders fully readable
  - Legend row below the axes now tells natural-frequency curves from engine order
    lines
  weaknesses:
  - 'SC-01 (both): on a -basic id the plot adds an amber operating-range band (2800-4200
    RPM) with two dashed boundary lines and an ''Operating Range'' callout, and splits
    the critical markers into in-range red and outside grey; C5 excludes further highlighted
    bands, reference lines and callouts → remove the band, its boundary lines, the
    callout and its legend entry, and draw every critical speed with the same marker.
    Likely cause: ax.axvspan/axvline/ax.text for OPERATING_RANGE and the cs_in_df/cs_out_df
    split.'
  - 'SC-04 (both): #AE3030 colours both the 3rd Bending curve and the in-range critical
    markers, so the two markers at ~3900 RPM read as belonging to that mode → give
    the critical markers a colour no mode curve uses (or a distinct marker shape with
    an ink outline). Likely cause: color=IMPRINT_PALETTE[4] on the critical-speed
    scatterplot while MODE_COLS also takes palette position 5.'
  - 'VQ-03 (both): the legend draws the critical speeds as rectangular patches although
    they are circles on the plot, and ''Natural frequency mode'' as a single INK line
    no curve has → use circular Line2D markers (marker=''o'', linestyle=''none'')
    for the critical speeds and a neutral but representative sample for the modes.
    Likely cause: mpatches.Patch handles in legend_handles.'
  - 'DQ-01 (both): the data yields 17 critical-speed markers against the spec''s 6-10
    → tune the mode curves or the speed range so 6-10 crossings fall in range. Likely
    cause: five modes at 15-95 Hz crossing all three orders below 6000 RPM.'
  - 'Suggestion: a 100 Hz tick at the top of the y axis would close the frequency
    scale (the 5 % headroom leaves the top tick unlabeled).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'campbell-basic · python · seaborn · anyplot.ai' dark ink at top; 'Rotational Speed (RPM)' and 'Frequency (Hz)' axis titles, 0-6000 / 0-80 ticks in INK_SOFT; L-spine, subtle grid. All readable.
      Data: five mode curves in Imprint order — 1st Bending #009E73 (15->25 Hz), 2nd Bending #C475FD (45->28 Hz falling), 1st Torsional #4467A3 (52->73), Axial #BD8233 (68->62 falling), 3rd Bending #AE3030 (82->95); colour-matched bold labels right of the axis. Three grey dashed engine order lines from the origin with boxed 3x/2x/1x labels; 2x and 3x leave through the top. Amber operating-range band 2800-4200 RPM with dashed edges and 'Operating Range' text; two large red circles at ~3900 RPM / 65 Hz (1x with Torsional and Axial), 15 small grey circles at the other crossings. Legend row below the axes: Natural frequency mode, Engine order line, Critical (in range), Critical (outside), Operating (2800-4200 RPM).
      Legibility verdict: PASS

