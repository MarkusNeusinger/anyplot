review:
  strengths:
  - 'Complete Campbell diagram: four named modes (1st Bending and 1st Torsional rising,
    2nd Bending and Axial falling), three dashed 1x/2x/3x lines from the origin with
    slope order/60, and 10 markers at the interpolated crossings'
  - Critical speeds in ink with a page-colour outline, a colour no mode curve uses,
    so they read as their own layer in both themes
  - Colour-matched bold direct mode labels at the curve ends, kept apart by a computed
    minimum gap
  - 'Idiomatic seaborn: melt to long form, sns.lineplot with hue/hue_order/palette,
    sns.scatterplot on a data frame, set_theme rc and despine'
  - Theme tokens threaded through all chrome; both renders fully readable
  weaknesses:
  - 'Suggestion: optional shaded critical-speed zones around the intersections (allowed
    by the Notes) would show the resonance margins.'
