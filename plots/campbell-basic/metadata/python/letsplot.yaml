review:
  strengths:
  - Critical speeds computed by linear interpolation of each engine order line against
    each mode curve, so every red diamond sits exactly on its crossing
  - Muted-ink engine order lines with three distinct dash patterns stay behind the
    colored mode curves, and the two-section legend separates them cleanly
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with identical mode colors
  - layer_tooltips() with .format() gives formatted hover cards for modes and critical
    speeds in the HTML output
  weaknesses:
  - 'SC-01 (both): an ''Axial × 3× (1997 RPM)'' callout above the highest critical
    speed is a further callout the basic variant excludes (C5) → remove the callout
    layer. Likely cause: the annot_df geom_text layer.'
  - 'VQ-02 (both): the ''3×'' engine order label near the origin is touched by the
    3× dash-dot line itself → place it clear of every line. Likely cause: the hard-coded
    label position (250 RPM, 14.5 Hz) sits on the 3× line.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel; elevated off-white legend boxes.
      Chrome: bold dark mandated title, grey subtitle, axis titles 'Rotational Speed (RPM)' and 'Frequency (Hz)', dark-grey ticks, italic caption; all readable.
      Data: five thick mode curves on Imprint positions 1,2,3,4,6 with #009E73 first; three grey engine order lines from the origin in dashed, long-dash and dash-dot; small bold 1×/2×/3× labels near the origin; 17 red #AE3030 diamonds at the crossings with very faint red zones; small red italic callout 'Axial × 3× (1997 RPM)' above the top crossing, crossed by the 3× line. The '3×' label is touched by its line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: light title, axis titles and ticks; grey subtitle and caption; no dark-on-dark text.
      Data: mode colors and diamonds identical to light; engine order lines and labels light grey; zones barely perceptible.
      Legibility verdict: PASS
