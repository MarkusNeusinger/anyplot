review:
  strengths:
  - 'Critical speeds computed by linear interpolation at the true crossings and drawn
    as hollow #AE3030 diamonds with a page-colored fill, so they stay distinct even
    on the red Axial curve'
  - Engine order labels 1×/2×/3× sit at the upper end of each line, clear of the dense
    crossing zone, in bold italic at a readable size
  - One shared color and linetype scale with a breaks/labels subset merges the three
    engine order lines into a single dashed legend entry
  - 'Theme tokens threaded through every chrome element: both renders read cleanly'
  weaknesses:
  - 'DQ-03 (both): 14 critical speed markers are drawn, above the 6-10 the spec''s
    Data section gives → 6-10 markers (about −4 to −8). Likely cause: the base_hz
    values put all five modes inside the 1×-3× range below 6000 RPM; raise the highest
    mode(s) above 3 × 6000 / 60 or lower the top of the fan.'
  - 'Suggestion: give the critical speed markers a hue no mode curve uses, so the
    Axial mode''s #AE3030 and the marker red are not the same color.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, legend on the slightly elevated #FFFDF6 surface without a frame.
      Chrome: bold centered title "campbell-basic · python · plotnine · anyplot.ai", axis titles "Rotational Speed (RPM)" and "Natural Frequency (Hz)" in dark ink, ticks 0-6000 / 0-100 in INK_SOFT, subtle grid, left and bottom axis lines only. All readable.
      Data: five solid mode curves in Imprint order - 1st Bending #009E73 (18→27 Hz rising), 2nd Bending #C475FD (45→33 falling), 1st Torsional #4467A3 (52→67 rising), 2nd Torsional #BD8233 (75→81), Axial #AE3030 (90→88 nearly flat). Three dashed grey engine order lines from the origin, labeled 3×, 2×, 1× in bold italic at their upper ends (3× leaves at ~2000 RPM, 2× at ~3000). 14 hollow red diamonds with page fill at the crossings. Bottom legend: five modes plus "Engine Order (1×, 2×, 3×)" with a dashed key.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, legend on #242420.
