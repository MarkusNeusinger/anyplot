review:
  strengths:
  - Imprint palette in canonical order for modes and EO lines, amber warning anchor
    for the critical speeds
  - Solid mode curves against three distinct dash patterns for the engine order lines
  - Critical speeds computed by sign-change detection with linear interpolation, each
    marker on its crossing
  - Both themes fully readable
  weaknesses:
  - 'VQ-01 (both): y-axis tick labels render in two sizes - the major ticks 100.0,
    50.0 and 0.0 at 44 px, the others at 56 px -> one tick size (44 for both). Likely
    cause: label_font_size=56 vs major_label_font_size=44.'
  - 'VQ-03 (both): mode curves and engine order lines are about 2 px wide on the 3200
    px canvas and the dashed EO lines read as hairlines -> about 6 px (+4 px). Likely
    cause: Style stroke_width=2.5 overriding the per-series stroke_style width.'
  - 'DQ-01 (both): 14 critical-speed markers against the spec''s 6-10 -> 6-10 crossings
    (-4 or more). Likely cause: five modes all crossed by all three orders below 6000
    RPM.'
  - 'Suggestion: a small gap between the legend swatches and their labels would make
    the legend read cleaner.'
