review:
  strengths:
  - 'All spec Notes met: EO lines from the origin with slope order/60, five named
    modes with some rising and some falling, amber diamond critical-speed markers
    computed by sign-change interpolation, 1x/2x/3x direct labels'
  - 'Clear hierarchy: muted dashed excitation lines recede behind the Imprint-coloured
    mode curves; amber diamonds with ink outline read in both themes'
  - Legend placed outside the plot area on the right, leaving every curve unobstructed
  - Single shared ColumnDataSource and LegendItem-built Legend are idiomatic Bokeh;
    HoverTool exposes intersection name, RPM and frequency in the HTML
  - Theme tokens threaded through all chrome; both renders theme-correct
  weaknesses:
  - 'DQ-01 (both): the 1st Bending mode rises from 25 Hz to about 75 Hz (about +200
    %) and 3rd Bending from 126 to 188 Hz across 0-6000 RPM, not the slight speed
    dependence the spec asks for → keep each mode within roughly ±10-15 % of its 0-RPM
    value (1st Bending slope about 0.002 Hz/RPM instead of 0.008). Likely cause: the
    0.008 and 0.010 linear terms in MODES[0] and MODES[4] (lines 44, 48).'
  - 'Suggestion: collapse the three identical grey ''1x/2x/3x EO'' legend entries
    into one ''Engine order'' entry, since the direct labels already name each order.'
  - 'Suggestion: the order labels at 24pt are smaller than the 34pt tick labels; matching
    them would make the 1x/2x/3x identification stronger.'
  image_description: |-
