review:
  strengths:
  - 'Legend now keys every encoding: ''Natural Frequency Mode'', ''Excitation'' (dashed
    engine order) and ''Resonance'' (critical speed diamond), ordered with guides(order
    =)'
  - 'Imprint palette in canonical order for the four modes, with #AE3030 used semantically
    for resonance and theme-correct chrome in both renders'
  - Critical speeds computed in closed form from the mode and order equations, so
    every diamond sits exactly on its crossing
  - 'Clear hierarchy: colored solid mode curves over muted dashed engine orders with
    italic direct labels'
  - Clean top-to-bottom ggplot2 code with one data frame per layer and named manual
    scales
  weaknesses:
  - 'VQ-02 (both): the italic ''2x'' engine order label at about (3550 RPM, 122 Hz)
    sits on its own dashed 2x line, which runs through the ''x'' → place the label
    clear of the line by a few px (e.g. ~6 Hz higher or further left of the line),
    as the ''3x'' label already is. Likely cause: order_labels offset of +4 Hz for
    2x, smaller than the +10 Hz used for 3x.'
  - 'Suggestion: the critical-zone shading at alpha 0.09 is barely perceptible on
    the dark background; a theme-dependent alpha would keep the optional zones equally
    visible in both renders.'
  - 'Suggestion: mode_params repeats the mode coefficients already written in mode_data;
    defining them once would keep curves and markers in sync.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title "campbell-basic · r · ggplot2 · anyplot.ai" in dark ink, left-aligned at about half the width; axis titles "Rotational Speed (RPM)" and "Frequency (Hz)" in dark ink, tick labels 0–6000 and 0–120 in soft dark ink; L-shaped axis lines, subtle major grid. Three frameless elevated legend boxes on the right: "Natural Frequency Mode" (four modes), "Excitation" (dashed "Engine order (1x, 2x, 3x)") and "Resonance" (red diamond "Critical Speed"). All text readable.
      Data: four nearly flat solid mode curves — 1st Bending #009E73 (30→36 Hz, rising), 1st Torsional #C475FD (52→55 Hz, rising), 2nd Bending #4467A3 (78→72 Hz, falling), Axial #BD8233 (108→103 Hz, falling). Three grey dashed engine order lines fan out from the origin, 3x and 2x leaving through the top, labelled with italic 1x/2x/3x; the 2x label sits on its own line. Twelve red #AE3030 diamonds at the crossings, faint red vertical zone bands (±150 RPM) behind each, overlapping between about 500 and 2400 RPM.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light ink, tick and legend labels in light soft ink, legend boxes on the dark elevated fill; grid subtle but visible. No dark-on-dark text.
      Data: mode colors, red diamonds and layout identical to the light render; engine order lines and labels switch to the light muted ink and stay visible; zone shading is very faint on the dark surface but present. Brand green clearly visible.
