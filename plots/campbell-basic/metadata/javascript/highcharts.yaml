review:
  strengths:
  - 'Complete feature set: 4 natural-frequency mode curves (forward/backward whirl),
    3 engine-order excitation lines with the correct order/60 RPM-to-Hz slope, and
    critical-speed markers computed via numerical intersection with linear interpolation.'
  - 'Correct Imprint palette application: first series is #009E73, remaining mode
    curves follow canonical positions 2-4, and critical speeds use the matte-red semantic
    anchor (position 5) rather than the next ordinal slot.'
  - 'Theme-adaptive chrome is correct in both renders: engine-order lines use t.ink
    so they read as black-on-cream in light and white-on-near-black in dark, and all
    text/grid/legend tokens flip correctly with no dark-on-dark or light-on-light
    failures.'
  - Deterministic, reproducible data generation with clean KISS structure and explicit
    font sizing (title 22px, axis titles 16px, tick/legend 14px) matching the style
    guide.
  - Mode curves show realistic gyroscopic behavior (some increasing, some decreasing
    with speed) and the mandated title format and units-bearing axis labels are both
    correct.
  weaknesses:
  - 'Design Excellence is close to a well-configured library default: fontFamily is
    left as ''inherit'' (generic sans, no typographic personality) and the grid is
    styled purely via the standard token with no additional refinement beyond the
    baseline contract.'
  - Two pairs of critical-speed diamonds nearly touch/overlap near RPM 400 and RPM
    600 (where 1x/2x order lines cross closely spaced modes) - consider a small radial
    offset or slightly smaller marker radius in that cluster so the two intersections
    stay visually distinct.
  - The spec's optional 'shade or highlight critical speed zones' is not used - adding
    a subtle plotBands/plotLines highlight around the critical-speed clusters (or
    per-point data labels for the RPM value) would strengthen data storytelling and
    give the chart a stronger focal point beyond the diamond markers alone.
  - Y-axis range (0-110 Hz) leaves a fairly empty band above ~90 Hz for most of the
    RPM range once the 2x/3x order lines exit the frequency window - not incorrect
    (this is realistic Campbell-diagram behavior) but a tighter max (e.g. 100) would
    improve canvas utilization slightly.
  - Library Mastery is generic Highcharts usage (chart() with a mixed line/scatter
    series array) - no library-distinctive feature (e.g. plotBands for critical zones,
    custom point formatter, or data labels on the critical-speed markers) is used
    to earn extra credit here.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "campbell-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top-center, clearly readable. X-axis "Rotational Speed (RPM)" and Y-axis "Natural Frequency (Hz)" titles in soft dark gray, both readable with units. Tick labels dark gray, legible. Grid lines are very subtle horizontal lines, present but unobtrusive. Legend sits below the plot in a single horizontal row (4 mode curves, 3 order lines, 1 critical-speed marker), all dark-ink text on the light surface.
      Data: First mode curve "1st Bending (Forward)" renders in brand green #009E73, "1st Bending (Backward)" in lavender, "2nd Bending" in blue, "1st Torsional" in ochre - correct canonical Imprint order. Three dashed black lines radiate from the origin (1x/2x/3x engine orders). Red diamond markers sit at each curve/order intersection.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, axis titles, tick labels, and legend text all render in light off-white/gray tones, clearly visible against the dark surface. Grid lines are faint light lines, subtle but present. No dark-on-dark text anywhere.
      Data: Mode curve colors are pixel-identical to the light render (green, lavender, blue, ochre) - only the chrome flipped. The engine-order lines flip from black to white (they're bound to the theme-adaptive ink token rather than a fixed color), which is the correct behavior for a chrome/reference element. Critical-speed diamonds remain the same matte red in both renders.
      Legibility verdict: PASS - all text is clearly readable against the dark background, no dark-on-dark failures; brand green remains legible on the near-black surface.
