review:
  strengths:
  - 'Excellent semantic palette usage: matte red reserved for critical/error markers,
    theme-adaptive ink/neutral token used for engine-order reference lines, matching
    the style guide''s documented semantic roles precisely'
  - plotBands critical-zone shading is a distinctive, well-motivated Highcharts feature
    that directly serves the spec's optional zone-highlighting suggestion
  - Numerically robust critical-speed detection (sign-change scan + linear interpolation)
    rather than hard-coded intersection points
  - Both themes fully readable, data colors verified identical across light/dark
  weaknesses:
  - Critical-speed diamonds cluster tightly near 380-650 RPM (low-order, low-frequency
    crossings); consider a slightly smaller marker radius or a subtle offset in that
    zone to keep them individually legible
  - Chart chrome (axis lines, grid) still reads close to a well-configured default
    rather than a fully bespoke treatment; axis lines/grid could be lightened further
    for extra polish
