review:
  strengths:
  - Correct Imprint palette order (green/lavender/blue/ochre for the 4 modes) with
    a smart semantic use of matte red (palette[4]) for the critical-speed diamond
    markers — a danger/warning association that matches the style guide's semantic-exception
    rule.
  - Fully theme-adaptive chrome — both light and dark renders are readable with no
    dark-on-dark/light-on-light failures, and the data colors are identical between
    themes.
  - Engine order excitation lines are intelligently labeled at their actual visible
    exit point (right edge for 1x, top edge for 2x/3x) instead of a fixed default
    position — a nice touch beyond the basic API.
  - Clean L-shaped spines, single-axis (Y) subtle grid, generous legend spacing, and
    no clipping/overflow anywhere on the canvas.
  - Deterministic, self-contained data generation with physically plausible gyroscopic
    mode drift (some modes rise, some fall with speed) and a genuine linear-interpolation
    root-finder for the critical-speed intersections — no RNG needed, fully reproducible.
  weaknesses:
  - LM-02 distinctive-features usage is fairly minimal — only a symbol generator and
    a clip-path are used beyond standard scaleLinear/axis/line APIs; a more idiomatic-D3
    flourish (e.g. curve interpolation, d3-transition-free layering tricks) would
    raise Library Mastery further.
  - Three critical-speed diamonds cluster closely between ~1150-1700 RPM (2nd Bending
    / 1st Bending crossings near 25-58 Hz) — not overlapping today, but a small nudge
    or connector annotation would make them easier to individually read at a glance.
  - The findIntersections helper is a genuine root-finding routine (justified use
    of a function), but it's the only function in an otherwise flat KISS script —
    consider a short comment noting why it's an exception to the flat-script convention.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "campbell-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered top. X-axis "Rotational Speed (RPM)" and Y-axis "Natural Frequency (Hz)" labels in dark ink, both clearly readable. Tick labels on both axes are legible dark-gray text. Only left/bottom spines shown (L-shaped frame). Subtle horizontal Y-axis gridlines only.
      Data: Four solid natural-frequency curves in Imprint order — brand green "1st Bending" (lowest, ~25-35 Hz), lavender "2nd Bending" (~52-60 Hz, slightly decreasing), blue "1st Torsional" (~110-122 Hz), ochre "Axial" (~155-160 Hz, highest). Three dashed neutral-gray engine-order excitation lines from the origin, labeled "1x", "2x", "3x" at their visible exit points. ~10 matte-red diamond markers at curve/order-line intersections mark critical speeds. First series is confirmed #009E73 brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light/off-white ink, fully legible against the dark surface. Gridlines and axis spines switch to a light, subtle tone. No dark-on-dark text anywhere — title, axis titles, and tick labels are all bright enough to read clearly.
      Data: Identical curve and marker colors to the light render — brand green, lavender, blue, ochre solid curves; neutral dashed engine-order lines; matte-red diamond critical-speed markers. Only the chrome (background, text, grid, spines) flipped; the data-color identity is preserved as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures observed.
