review:
  strengths:
  - 'Critical speeds are computed, not placed: every sign change of mode minus engine-order
    line is linearly interpolated (lines 92-110), so the 10 red markers sit exactly
    on their crossings (1st Bending x 1x at about 3007 RPM / 50 Hz, as 42/(1/60-0.0027)
    gives)'
  - Engine-order lines get a three-step dash and opacity hierarchy in a neutral inkSoft
    tone, clearly distinct from the solid palette-colored mode curves, with 1x/2x/3x
    labels on small page-colored plates near the right end
  - 'Mode curves are identified twice without crowding: a header legend separating
    the four modes, the three EO dash styles and the critical-speed marker, plus direct
    end labels with color ticks to the right of the plot'
  - Composes ChartsContainer with LinePlot, ScatterPlot, ChartsGrid and explicit axes,
    and draws the order and mode labels in an in-chart SVG layer positioned through
    the useXScale/useYScale/useDrawingArea hooks
  - Per-series styling through sx selectors on data-series attributes (dash, width,
    opacity per engine order) and a page-colored marker outline that keeps the red
    markers crisp on both themes
  - 'Theme tokens threaded through every text and stroke: all chrome flips cleanly
    while the Imprint data colors stay identical, and skipAnimation is set'
  weaknesses:
  - 'Suggestion: the header carries a legend for the four modes that the direct end
    labels already name; dropping the mode entries from the header legend would shorten
    it to the line-style key the reader actually needs.'
  - 'Suggestion: the empty band between the legend row and the top of the plot (about
    50 CSS px) plus the 8 % y padding above 300 Hz could be tightened to give the
    crossings more vertical room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: bold dark title "campbell-basic · javascript · muix · anyplot.ai" centered at the top, a gray subtitle "4 rotor modes · 3 engine orders (1x, 2x, 3x) · 10 critical-speed intersections", and a one-line HTML legend (1st Bending, 1st Torsional, 2nd Bending, Axial as solid colored strokes; 1x/2x/3x EO as dashed/dotted gray samples; a red dot for "Critical Speeds (10)"). X axis "Rotational speed (RPM)" 0-6,000 with thousands separators, y axis "Natural frequency (Hz)" 0-300; dark tick labels, faint dashed grid in both directions. All text readable.
      Data: four nearly flat mode curves — 1st Bending green #009E73 rising 42→58 Hz, 1st Torsional purple rising slightly 88→93 Hz, 2nd Bending blue falling 125→110 Hz, Axial ochre falling 152→145 Hz — with bold direct end labels to the right. Three gray engine-order lines fan from the origin (1x to 100 Hz, 2x to 200 Hz, 3x to 300 Hz) with "1x/2x/3x" labels near the right end. Ten red circles with a page-colored outline sit exactly on the crossings.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend, axis titles, tick labels and end labels all render in light ink; grid dashed and subtle but visible; no dark-on-dark text.
      Data: mode curve colors, the red critical-speed markers and the gray EO lines are identical to the light render; only chrome flipped. Green #009E73 reads well; the dotted 3x EO line is the faintest element but clearly visible.
      Legibility verdict: PASS
