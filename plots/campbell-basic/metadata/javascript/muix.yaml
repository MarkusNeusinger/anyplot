review:
  strengths:
  - 'Perfect Imprint palette compliance: first series is brand green #009E73, modes
    2-4 follow canonical order (lavender, blue, ochre), and critical-speed markers
    use palette position 5 (matte red #AE3030) as an intentional semantic exception
    for ''danger/critical'' rather than an arbitrary color choice.'
  - All 10 critical-speed markers are physically correct — verified by recomputing
    the engine-order/mode-curve intersections (linear interpolation) against the plotted
    values; every marker lands exactly where the math says a resonance crossing should
    occur.
  - 'Natural frequency curves show realistic gyroscopic behavior per the spec: 1st
    Bending and 1st Torsional stiffen (increase) with speed, 2nd Bending and Axial
    soften (decrease) with speed — not a flat or arbitrary trend.'
  - Fully deterministic, in-memory data generation (closed-form functions, no RNG)
    satisfying CQ-02 trivially and keeping the implementation reproducible.
  - 'Clean composable MUI X usage: ChartContainer + LinePlot + ScatterPlot sharing
    one coordinate system, with per-series dash-array styling applied via the sx prop
    targeting `.MuiLineElement-series-{id}` — a legitimate library-specific technique
    for distinguishing the three engine-order lines.'
  - Theme chrome is fully correct in both renders — light ink on the cream background,
    light-colored ink on the near-black background, no dark-on-dark or light-on-light
    failures.
  weaknesses:
  - The three engine-order lines (1x/2x/3x) are differentiated only by dash pattern
    (12 6 / 6 4 / 2 3) at the same ink color and 0.75 opacity. In the plot body the
    differing dash lengths are traceable, but the legend swatches are only itemMarkWidth=20px
    wide — too short to show more than one dash/gap cycle, so '1x', '2x', and '3x'
    look nearly identical in the legend and are hard to tell apart without tracing
    each line back from the axis. Consider assigning distinct opacity/weight per order
    line, or widening itemMarkWidth for those three entries specifically.
  - Design Excellence is solidly above a bare default (semantic red critical-speed
    markers, dash-differentiated order lines, restrained horizontal-only grid) but
    stops short of a truly polished/publication-ready treatment — e.g. no visual grouping
    or subtle shading to call out the 'critical speed zone' clusters the spec calls
    out as optional, and line weights for the natural-frequency curves read a little
    thin/uniform rather than using weight to reinforce which curves matter most.
  - Natural-frequency line weight does not vary by importance — all 4 mode curves
    and the critical-speed overlay use the same visual weight as the reference engine-order
    lines, so the eye has to rely entirely on color plus the red markers to find the
    story; a slightly heavier stroke on the mode curves relative to the order-line
    references would sharpen the hierarchy further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — correct, not pure white, not dark.
      Chrome: Title "campbell-basic · javascript · muix · anyplot.ai" centered top, dark ink, clearly legible. X-axis label "Rotational Speed (RPM)" and Y-axis label "Natural Frequency (Hz)" dark and readable. Tick labels dark gray, legible. Legend (right side, column layout) lists "Critical Speeds", the 4 mode curves, and "1x"/"2x"/"3x" order lines — all readable against the warm background. Horizontal grid lines subtle.
      Data: First series (1st Bending) is #009E73 brand green; 2nd Bending is lavender/purple (#C475FD); 1st Torsional is blue (#4467A3); Axial is ochre (#BD8233) — matches Imprint canonical order positions 1-4. Critical-speed markers are large matte-red (#AE3030, palette position 5) circles, a correct semantic-exception use for "critical/danger" — clearly distinguishable from the curve colors. Three gray dashed/dotted diagonal engine-order lines radiate from the origin, differentiated by dash pattern.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — correct, not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light ink, clearly legible against the dark surface — no dark-on-dark failures observed. Legend text is light and readable. Grid lines subtle and visible.
      Data: All data colors (mode curves, order lines, critical-speed markers) are pixel-identical to the light render — only the chrome (background, text, grid) flipped, exactly as required. Brand green (1st Bending) and matte red (critical speeds) both read clearly on the dark surface.
      Legibility verdict: PASS
