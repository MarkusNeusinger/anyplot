review:
  strengths:
  - 'Correct, thoughtful palette use: first series is brand green (#009E73), and the
    implementation deliberately skips palette slot 5 (matte red, the deferred semantic
    error/bad anchor) for the 5th mode, using cyan (slot 6) instead — exactly the
    nuanced application the style guide calls for.'
  - 'Strong semantic color choices beyond the base palette: amber (#DDCC77, the warning
    anchor) for critical-speed markers and the theme-adaptive ink/neutral token for
    dashed engine-order reference lines, both matching the anchors'' documented roles.'
  - 'All required spec features present: 5 labeled natural-frequency mode curves with
    realistic gyroscopic drift (some rising, some falling), 3 labeled engine-order
    excitation lines with correct slope = order/60, and critical-speed markers found
    by genuine crossing-point interpolation rather than hard-coded data.'
  - 'Clean theme-adaptive chrome — both light and dark renders are fully legible with
    no dark-on-dark or light-on-light issues, backgrounds match #FAF8F1/#1A1A17, and
    data colors are pixel-identical across themes.'
  - 'No edge clipping: verified via pixel crop that the ''1x''/''2x''/''3x'' end-of-line
    labels sit comfortably inside the canvas with margin to spare.'
  - 'Idiomatic ECharts usage: containLabel + generous grid margins, scroll legend,
    endLabel for line-end labeling, and z-index layering to keep critical-speed diamonds
    on top of the curves.'
  weaknesses:
  - 'Minor decoration: small axis tick marks are still visible on both x- and y-axes;
    the style guide''s decoration-removal checklist recommends keeping tick labels
    but removing the tick marks themselves (axisTick: { show: false }) for a cleaner
    L-shaped frame.'
  - The spec's optional 'shade or highlight critical speed zones' enhancement isn't
    used — a light markArea band around each critical-speed intersection (using the
    muted or amber token at low alpha) would strengthen the data-storytelling focal
    point beyond the diamond markers alone.
  - Library mastery stays close to a standard line+scatter combination; ECharts-specific
    features like markLine/markArea for the resonance zones, or a custom tooltip formatter
    for the critical-speed diamonds, aren't used to showcase deeper API capabilities
    (acceptable given the PNG is a static preview, but would elevate the HTML detail
    view).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — correct.
      Chrome: Title "campbell-basic · javascript · echarts · anyplot.ai" in dark ink, centered top, ~40% of plot width (comfortable). X-axis "Rotational Speed (RPM)" and Y-axis "Natural Frequency (Hz)" titles are dark and balanced in size (16px). Tick labels (14px, soft ink) are clearly readable. Bottom-anchored scrolling legend lists all 8 series names in soft ink text. Y-axis-only subtle gray gridlines; no x-axis gridlines. Small tick marks are present on both axes (minor decoration note).
      Data: 5 solid natural-frequency curves in distinct Imprint hues — green (#009E73, "1st Bending"), lavender (#C475FD, "2nd Bending"), blue (#4467A3, "1st Torsional"), ochre (#BD8233, "2nd Torsional"), cyan (#2ABCCD, "Axial") — correctly skipping the reserved red slot. 3 dashed neutral-ink engine-order lines ("1x"/"2x"/"3x") radiate from the origin with correct slopes and end labels fully inside the canvas. ~9 amber diamond markers with dark outlines mark critical-speed intersections, sitting visibly on top of the curves.
      Legibility verdict: PASS — all text is clearly readable against the light background, no clipping detected at any label (verified via pixel crop of the 1x/2x/3x end labels).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — correct.
      Chrome: Title, axis titles, and tick labels all switch to light ink tones (title/axis titles near-white, tick labels/legend a lighter soft gray) — fully readable, no dark-on-dark failures found anywhere (title, axis names, tick labels, legend, engine-order end labels all checked).
      Data: All 5 mode-curve colors and the amber critical-speed markers are pixel-identical to the light render — only the chrome (background, text, gridlines, dashed reference-line color) adapts to the theme, exactly as required.
      Legibility verdict: PASS — no dark-on-dark or illegible elements found.
