review:
  strengths:
  - Correct Imprint palette usage, including properly skipping the semantic-red anchor
    (position 5) since no error/loss category applies here
  - 'All required spec features present: 5 labeled natural frequency curves, 3 labeled
    engine order lines, and diamond-marked critical speed intersections (~10, within
    the spec''s 6-10 range)'
  - Effective use of distinctive ECharts features (markArea zone highlighting, endLabel)
    that reinforce the diagram's storytelling purpose by drawing the eye to resonance
    zones
  - Full theme-adaptive chrome — both renders are clean and legible, no clipping or
    dark-on-dark/light-on-light failures
  - Clean, deterministic, KISS-structured code with a correct mount-node contract
    (no explicit size/devicePixelRatio, animation disabled)
  weaknesses:
  - Legend swatches for the '1x/2x/3x' engine-order series render as plain circles
    rather than reflecting the dashed line style used in the plot itself — a custom
    legend icon (short dash) would let the legend distinguish order lines from natural-frequency
    curves at a glance, matching the spec's ask for a legend that separates the two
    families
  - Two critical-speed markArea highlight boxes near ~2600 RPM (2nd Torsional x1 and
    2nd Bending x1 intersections) sit close together vertically — tightening the markArea
    half-height slightly would reduce visual crowding at high critical-speed density
  - Title fontsize (22px) leaves the title comfortably small relative to the 3200px
    canvas — not a legibility issue, but there's room to lean into more visual weight
    for the headline
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "campbell-basic · javascript · echarts · anyplot.ai" in dark ink, centered top. Axis titles "Rotational Speed (RPM)" (x) and "Natural Frequency (Hz)" (y, rotated) in dark ink. Tick labels and legend text in softer dark gray. Subtle horizontal gridlines only (y-axis). All chrome elements clearly readable.
      Data: 5 solid natural-frequency curves in Imprint palette order (green "1st Bending", lavender "2nd Bending", blue "1st Torsional", ochre "2nd Torsional", cyan "Axial" — correctly skipping the reserved red slot 5). 3 dashed gray/ink engine-order lines from the origin, each labeled "1x"/"2x"/"3x" at their line ends. Amber diamond markers (ink-bordered) mark ~10 critical-speed intersections, each surrounded by a faint amber highlight box. First series is confirmed brand green #009E73.
      Legibility verdict: PASS — all text and data elements are clearly distinguishable against the light background; no clipping at any edge (checked top-right "2x"/"3x" end labels and bottom legend row).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light/off-white ink; tick labels and legend text in a softer light gray. Gridlines remain subtle. No dark-on-dark or light-on-light failures observed anywhere.
      Data: Same 5 curve colors as the light render (green, lavender, blue, ochre, cyan) — confirmed identical hex values, only chrome flipped. Dashed order lines and amber diamond critical-speed markers remain clearly visible against the dark surface; the amber markArea highlight boxes read as a warm olive tint that stays distinguishable from the background.
      Legibility verdict: PASS — all text and data elements are clearly readable against the dark background; no clipping observed.
