review:
  strengths:
  - 'All three attempt-1 weaknesses are fixed: the legend now renders dashed-line
    swatches for the 1x/2x/3x engine-order entries (generateLabels override with pointStyle:''line'')
    instead of indistinguishable circles, the critical-speed marker color is sourced
    from t.palette[4] instead of a hardcoded hex, and a custom orderLabelPlugin now
    draws ''1x''/''2x''/''3x'' text directly on the excitation lines'
  - 'Palette compliance is exemplary: first series is brand green #009E73, all four
    natural-frequency curves follow canonical Imprint order (positions 1-4), and data
    hues are pixel-identical between light and dark renders while chrome correctly
    flips'
  - Critical speeds are computed algebraically as exact line-line intersections (mode.a
    / (slope - mode.b)), not approximated, then sorted and capped at 10 per the spec's
    6-10 range
  - The custom afterDatasetsDraw plugin and generateLabels legend override demonstrate
    genuine Chart.js plugin-API mastery beyond basic dataset configuration
  - Fully deterministic, in-memory data generation with no RNG anywhere - reproducible
    by construction
  - 'Theme-adaptive chrome is fully correct: title/axis/tick colors follow t.ink/t.inkSoft,
    grid uses t.grid, backgrounds are the warm #FAF8F1/#1A1A17 surfaces, canvas saved
    at the exact 3200x1800 landscape target'
  weaknesses:
  - Two clusters of critical-speed diamonds still sit close together (~1700-1800 RPM
    near 60 Hz and near 85 Hz) - not overlapping badly, but a small radial offset
    would improve clarity at that density
  - The spec's optional enhancement - shading or highlighting the critical-speed zones
    around intersection points - is still not implemented; only the point markers
    and on-line order labels carry the storytelling
  - Chart.js default axis border/tick marks remain at default weight with no explicit
    spine refinement (e.g. removing tick marks, thinning the axis line) beyond the
    token-based color mapping, keeping visual refinement at a good-but-not-exceptional
    level
  - The on-line '1x'/'2x'/'3x' text labels are drawn with a flat fill color and no
    background pill or halo, so where a label crosses a gridline or another curve
    near the top of the chart the contrast is slightly reduced
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "campbell-basic · javascript · chartjs · anyplot.ai" in dark ink, centered, comfortably within plot width. Axis titles "Rotational Speed (RPM)" and "Natural Frequency (Hz)" in dark ink. Tick labels in softer gray-ink, comma-formatted (e.g. "6,000"). Subtle light gridlines on both axes, clearly visible but not competing with data. Bottom legend with 8 entries (4 mode names as circle swatches, 3 engine-order labels as dashed-line swatches matching their on-plot dash pattern, "Critical Speeds" as a diamond swatch), all in dark ink text.
      Data: Four solid mode curves in canonical Imprint order - green (1st Bending), lavender/violet (2nd Bending), blue (1st Torsional), ochre (Axial). Three black diagonal reference lines from the origin with distinct dash patterns (dotted/dashed/dash-dot) for 1x/2x/3x engine order, each labeled directly on the line near its upper end ("1x", "2x", "3x" in dark ink). Red rotated-square (diamond) markers with a light edge ring mark critical-speed intersections. First series confirmed #009E73 green.
      Legibility verdict: PASS - all title, axis, tick, legend, and on-line order-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Same title and axis titles rendered in light ink (near-white), tick labels in a softer light-gray. Gridlines are faint light lines on the dark surface. Engine-order reference lines flip from black to white/off-white (theme-correctly), keeping the same dash patterns, and their on-line "1x"/"2x"/"3x" labels flip to light ink text, staying legible. Legend text and dashed-line swatches are light-colored and fully legible.
      Data: The four mode curve colors (green, lavender, blue, ochre) and the red critical-speed diamonds are pixel-identical to the light render - only chrome elements (background, text, grid, engine-order line/label color) flipped, as required. No dark-on-dark failures were found; text stays high-contrast against the near-black surface.
      Legibility verdict: PASS - no dark-on-dark title/label/tick/legend issues; brand green and matte-red markers remain clearly visible.
