review:
  strengths:
  - 'First categorical series is brand green #009E73 and all four mode curves use
    canonical Imprint palette order (positions 1-4), identical between light and dark
    renders'
  - Critical speeds computed algebraically as exact line-line intersections (mode.a
    / (slope - mode.b)) rather than approximated/simulated, then sorted and capped
    at 10 per the spec's 6-10 range
  - Natural frequency curves correctly show mixed gyroscopic behavior - 2nd Bending
    softens (negative slope) while the other three modes stiffen (positive slope),
    matching the spec's 'some increase, some decrease' requirement
  - Fully deterministic, in-memory data generation with no RNG at all - reproducible
    by construction
  - Engine order lines are visually distinguished from natural-frequency curves by
    color (ink/white vs Imprint hues) and by distinct dash patterns (dotted/dashed/dash-dot),
    with critical-speed diamonds using a semantic matte-red marker with a page-background
    edge ring for definition
  - 'Theme-adaptive chrome fully correct: title/axis/tick colors follow t.ink / t.inkSoft,
    grid uses t.grid, backgrounds are the warm #FAF8F1 / #1A1A17 surfaces, canvas
    saved at exact 3200x1800 landscape target'
  - 'Clean mount-node contract compliance: single canvas appended to #container, animation:
    false set, no fixed canvas sizing'
  weaknesses:
  - Legend swatches for the three engine-order lines (1x/2x/3x) render as identical
    solid circles (Chart.js usePointStyle defaults to a circle, ignoring borderDash)
    - a reader can only tell 1x from 2x from 3x by tracing the dash pattern on the
    plot itself, not from the legend. Consider a custom legend (generateLabels override)
    that renders a short dashed-line swatch matching each dataset's borderDash.
  - Critical-speed marker color is the hardcoded literal "#AE3030" instead of referencing
    t.palette[4] (the same semantic-red slot) - functionally identical output but
    drifts from the token-based pattern used everywhere else in the file
  - 'Design excellence is solid but generic for a Campbell diagram: no on-line ''1x''/''2x''/''3x''
    text labels near the line ends and no optional shading/highlighting around the
    critical-speed intersections, both called out as spec suggestions to strengthen
    the visual storytelling'
  - Two clusters of critical-speed diamonds sit close together (~1700-1800 RPM near
    60 Hz and near 85 Hz) - not overlapping badly, but a small repulsion/offset would
    improve clarity at that density
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "campbell-basic · javascript · chartjs · anyplot.ai" in dark ink, centered, ~45% of plot width. Axis titles "Rotational Speed (RPM)" and "Natural Frequency (Hz)" in dark ink. Tick labels in softer gray-ink, comma-formatted (e.g. "6,000"). Subtle light-gray gridlines on both axes. Bottom legend with 8 entries (4 mode names, 3 engine-order labels, "Critical Speeds"), all in dark ink text.
      Data: Four solid mode curves in canonical Imprint order - green (1st Bending), lavender/violet (2nd Bending), blue (1st Torsional), ochre (Axial). Three black diagonal reference lines from the origin with distinct dash patterns (dotted/dashed/dash-dot) for 1x/2x/3x engine order. Red rotated-square (diamond) markers at critical-speed intersections. First series confirmed #009E73 green.
      Legibility verdict: PASS - all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Same title and axis titles now rendered in light ink (near-white), tick labels in a softer light-gray. Gridlines are faint light lines on the dark surface. Engine-order reference lines flip from black to white/off-white (theme-correctly), keeping the same dash patterns. Legend text is light-colored and fully legible.
      Data: The four mode curve colors (green, lavender, blue, ochre) and the red critical-speed diamonds are pixel-identical to the light render - only chrome elements (background, text, grid, engine-order line color) flipped, as required. No dark-on-dark failures were found; text stays high-contrast against the near-black surface.
      Legibility verdict: PASS - no dark-on-dark title/label/tick issues; brand green and matte-red markers remain clearly visible.
