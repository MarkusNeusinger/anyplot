review:
  strengths:
  - Pixel-accurate custom renderItem histogram bars using echarts.graphic.clipRectByRect,
    correctly clipped to the coordinate system
  - Density-scaled histogram + Gaussian KDE with a Silverman's-rule bandwidth, both
    mathematically correct
  - 'Clean theme-adaptive chrome: correct pageBg/ink/inkSoft tokens, y-axis-only gridlines,
    no vertical splitlines'
  - Semi-transparent histogram bars (alpha 0.5) let the KDE curve read clearly on
    top, exactly as the spec requests
  - Correct Imprint palette usage - brand green for the histogram, lavender (#C475FD,
    palette position 2) for the KDE line - identical across light/dark renders
  - Deterministic, self-contained data generation (fixed-seed LCG + Box-Muller) with
    no network calls
  weaknesses:
  - KDE legend icon shows a mismatched green dot inside a purple line - the KDE series
    only sets lineStyle.color, not itemStyle.color, so the legend symbol falls back
    to the palette's first (green) color instead of matching the line
  - Design Excellence is competent but generic - no additional visual emphasis (e.g.,
    a mean/median reference line or peak annotation) to elevate storytelling beyond
    the baseline histogram+KDE combination
  - Library Mastery could go further by using an ECharts-distinctive feature (e.g.,
    markLine for the mean, or dataZoom for the interactive HTML detail view) beyond
    the custom-series bars
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white
      Chrome: title "histogram-kde · javascript · echarts · anyplot.ai" centered top in dark ink; axis titles "Session Duration (min)" and "Density" with units; tick labels dark gray; only horizontal (y-axis) gridlines shown, subtle; legend top-right with "Histogram" and "KDE" entries; all readable
      Data: histogram bars semi-transparent brand green (#009E73, alpha ~0.5); KDE curve lavender (#C475FD, palette position 2); first series correctly green
      Defect: KDE legend swatch shows a green dot inside the purple line icon, inconsistent with the all-purple KDE curve in the chart body (itemStyle.color not set on the line series)
      Legibility verdict: PASS (legend color-consistency defect noted, not a legibility failure)

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black
      Chrome: title, axis titles, and tick labels switch to light gray/white and remain fully legible against the dark surface; gridlines remain subtle; no dark-on-dark failures
      Data: histogram and KDE colors are pixel-identical to the light render, confirming correct theme-adaptive chrome-only flip
      Defect: same KDE legend green-dot/purple-line mismatch as the light render
      Legibility verdict: PASS
