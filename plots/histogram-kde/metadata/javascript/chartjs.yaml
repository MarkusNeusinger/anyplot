review:
  strengths:
  - Correct, spec-exact mandated title and accurate legend labels
  - Deterministic, seeded data generation (LCG) with a realistic fat-left-tail financial-returns
    distribution
  - Correct Imprint palette usage (green bars, lavender KDE line) and fully correct
    theme-adaptive chrome in both light and dark renders
  - Density-scaled histogram with Silverman's-rule KDE bandwidth implemented correctly
    per spec
  weaknesses:
  - 'KDE line dataset draws underneath the semi-transparent bar dataset instead of
    on top: wherever the purple line crosses a bar, alpha-blending shifts its rendered
    color to a muddy blue-gray, most visible near the distribution''s peak in both
    light and dark renders. Fix: set order: 1 on the bar dataset and order: 0 on the
    line dataset so the line paints last/on top and keeps its #C475FD color across
    its full length.'
  - 'X-axis auto-pads well beyond the actual data range (shows roughly -8 to 6 while
    histogram + KDE tails only span about -7 to 4.6), leaving noticeable wasted whitespace
    at both edges. Fix: set explicit scales.x.min/max near gridMin/gridMax.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target.
      Chrome: Title, legend, axis labels ("Daily Return (%)", "Density"), and tick labels are all dark ink and clearly readable against the light background. Subtle y-axis-only grid.
      Data: First series (histogram bars) is #009E73 green at ~0.5 alpha with a darker green border, matching the brand-first-series rule. Second series (KDE line) is #C475FD lavender per canonical palette order — BUT the line's rendered color visibly shifts to blue-gray wherever it passes behind a bar, due to the bar dataset painting on top of the line dataset (missing explicit Chart.js `order`).
      Legibility verdict: PASS (all chrome legible; the color-shift issue is a data-color-fidelity bug, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target.
      Chrome: Title, legend, axis labels, and tick labels correctly flip to light-colored text and are fully readable against the dark background. No dark-on-dark failures observed.
      Data: Same #009E73 green bars and #C475FD lavender KDE line as the light render, confirming identical data colors across themes. Same z-order defect reproduces: KDE line turns blue-gray under the bars.
      Legibility verdict: PASS (all chrome legible; same KDE color-shift defect as light render)
