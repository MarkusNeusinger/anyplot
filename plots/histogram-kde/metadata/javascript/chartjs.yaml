review:
  strengths:
  - Idiomatic Chart.js mixed dataset (bar + line, controlled via `order`) is exactly
    the recommended pattern for a histogram+KDE overlay, since Chart.js has no native
    geom-layer composition
  - 'Correct Imprint palette: histogram uses #009E73 (palette[0]) with alpha 0.5 fill,
    KDE line uses palette[1] (#C475FD) — identical data colors across light and dark
    renders, with theme-correct chrome (background, text, grid) in both'
  - Realistic, neutral financial-returns scenario with density-normalized y-axis (not
    raw counts) and a fat left tail from an 8% drawdown-day mixture, matching the
    spec's stated skewness/tail-behavior application
  - Deterministic data generation via a seeded LCG (seed=42) plus a from-scratch Gaussian
    KDE with Silverman's-rule bandwidth — reproducible and technically correct
  weaknesses:
  - Design Excellence is generic — the chart reads as a well-configured default rather
    than a polished, intentional design; add refinement (e.g. thinner/more subtle
    bar borders, more deliberate spine/grid treatment) to lift DE-01/DE-02.
  - No visual hierarchy or emphasis calls out the fat left tail / drawdown-day regime
    that is the point of the financial example — consider a subtle annotation, shaded
    region, or reference line distinguishing calm vs. drawdown days to give the plot
    a clearer story (DE-03).
  - The KDE grid extends 3 bandwidths past dataMin/dataMax on each side, so roughly
    the leftmost ~15% and a smaller slice on the right of the x-axis show only a near-flat
    curve with no histogram bars — tightening gridMin/gridMax (e.g. 1.5-2x bandwidth
    padding) would improve canvas utilization (VQ-05).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-kde · javascript · chartjs · anyplot.ai" in bold dark ink at top, centered legend below it ("KDE" outline swatch, "Histogram (density)" filled swatch), dark axis titles ("Daily Return (%)", "Density"), medium-gray tick labels on both axes, subtle horizontal gridlines only (no vertical gridlines). All text is clearly legible against the light background.
      Data: Histogram bars in semi-transparent brand green (#009E73, alpha ~0.5) with a solid green outline, bell-shaped with a visible fat left tail (small bump near x=-5.5). KDE line in lavender/purple (palette position 2, #C475FD), smooth, tracks the histogram shape closely with a slightly higher, smoother peak. First series correctly uses the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light/white text; axis titles in light ink, tick labels in light gray. Gridlines are faint light horizontal lines. No dark-on-dark text — every chrome element is clearly visible against the dark surface.
      Data: Histogram bars render as a darker, more saturated green due to the alpha blend over a black background, but the underlying series color is identical to the light render (#009E73) — only the chrome flipped, as required. KDE line remains the same lavender purple, clearly visible against the dark background.
      Legibility verdict: PASS
