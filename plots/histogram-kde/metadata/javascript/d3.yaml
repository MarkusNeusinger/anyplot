review:
  strengths:
  - Correct, well-implemented Gaussian KDE (manual kernel + Silverman's rule bandwidth
    1.06*std*n^-0.2) since d3 has no built-in KDE — a genuine library-mastery touch
  - Histogram and KDE are both scaled as density (b.length / (n * binWidth)) so the
    two curves are directly comparable, exactly matching the spec's y-axis requirement
  - Semi-transparent (fill-opacity 0.5) histogram bars per spec, with a contrasting
    Imprint palette[1] (lavender) KDE line clearly distinguishable from the palette[0]
    (green) bars in both themes
  - Clean y-axis-only gridlines, no chart border/frame, generous margins — no text/data
    overlap and no edge clipping in either render
  - Theme-adaptive chrome correctly implemented — identical data colors between renders,
    correctly flipped ink/inkSoft/grid/pageBg tokens
  - Realistic, neutral QC dataset (bolt head diameter around a 12.00mm target) with
    a plausible mechanism (tool-wear drift) producing a naturally skewed distribution
  - Deterministic and reproducible via a fixed-seed LCG driving a Box-Muller-style
    normal transform
  weaknesses:
  - 'Design Excellence is largely generic: the QC narrative baked into the data (target
    12.00mm, tool-wear drift causing the left-skewed tail) is invisible to the viewer
    — a subtle dashed reference line at 12.00mm labeled ''Target'' would turn this
    into real data storytelling instead of a plain histogram+KDE'
  - No distinctive visual refinement beyond meeting the spec's minimum requirements
    — e.g. a light rug of tick marks along the x-axis showing raw observations, or
    a refined legend swatch treatment, would add texture without adding clutter
  - Legend and axis typography strictly follow the base template sizes (14/16/22px)
    with no extra hierarchy — acceptable but leaves no visual emphasis differentiating
    this implementation from a minimal default
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "histogram-kde · javascript · d3 · anyplot.ai" centered at top; dark axis labels "Bolt Head Diameter (mm)" (x) and "Density" (y, rotated); dark tick labels on both axes; subtle light-gray horizontal gridlines (y-axis only); thin bottom/left axis spines only (no full border box). All text clearly readable against the light background.
      Data: Histogram bars filled with Imprint palette[0] green (#009E73) at ~50% opacity, roughly bell-shaped with a mild left tail (11.75–12.20mm range, peak near 12.00mm). A smooth lavender (palette[1], #C475FD) KDE line overlays the bars, tracking the bar heights closely and clearly distinguishable from the green fill. Legend top-right lists "Observed frequency" (green swatch) and "KDE estimate" (lavender line).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now rendered in light/white text, clearly visible; axis labels and tick labels rendered in light gray, clearly legible; gridlines remain subtle but visible against the dark surface; spines rendered in the theme-adaptive soft-ink tone.
      Data: Histogram bars use the same Imprint palette[0] green (#009E73, unchanged from light render) at the same opacity; KDE line uses the same lavender (#C475FD), unchanged. No dark-on-dark or light-on-light failures observed — all chrome flipped correctly while data colors stayed identical between renders.
      Legibility verdict: PASS
