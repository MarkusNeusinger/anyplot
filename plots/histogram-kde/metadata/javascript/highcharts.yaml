review:
  strengths:
  - 'Y-axis grid density fix (tickAmount: 6) landed cleanly — six evenly-spaced horizontal
    gridlines instead of the previous 13, giving the chart a much more polished, minimal
    look'
  - 'New peak annotation (dashed plotLine + "Peak: 13.7 min" label at the KDE mode)
    adds a genuine focal point and visual hierarchy that was missing before'
  - 'Correct Imprint palette usage: brand green (#009E73) histogram at alpha 0.5 with
    lavender (#C475FD) KDE line, identical data colors across both themes'
  - 'Statistically sound implementation: density-scaled histogram plus Gaussian-kernel
    KDE with Silverman''s-rule bandwidth, matching the spec''s exact requirements'
  - Clean theme-adaptive chrome (title/axis/tick/grid all threaded from ANYPLOT_TOKENS)
    and a realistic, neutral marketing-analytics scenario (right-skewed customer session
    durations)
  weaknesses:
  - Title fontsize bump (22px -> 26px) helped but only reaches ~46% of canvas width,
    still below the ~50-70% target for a title this length — a further bump toward
    ~30-32px would strengthen visual hierarchy
  - Several small helper functions (LCG PRNG, quantile, hexToRgba) still deviate from
    strict linear KISS structure, though reasonably justified by the lack of a numpy-equivalent
    in the browser runtime
  - Distribution is a single unimodal right-skewed shape — a slightly more complex
    (e.g. bimodal) distribution could better showcase the KDE's smoothing behavior,
    though not required by the spec
