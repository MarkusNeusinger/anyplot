review:
  strengths:
  - 'Correct Imprint palette usage: brand green (#009E73) histogram at alpha 0.5 with
    lavender (#C475FD) KDE line, identical data colors across both themes'
  - 'Statistically sound implementation: proper density-scaled histogram plus Gaussian-kernel
    KDE with Silverman''s-rule bandwidth, matching the spec''s exact requirements'
  - 'Clean theme-adaptive chrome: title/axis/tick/grid all correctly threaded from
    ANYPLOT_TOKENS, L-shaped axis frame (bottom + left only), subtle single-axis grid'
  - Realistic, neutral marketing-analytics scenario (right-skewed customer session
    durations) that plausibly explains the distribution shape shown
  - 'Correctly follows the JS/Highcharts mount-node contract: animation disabled on
    chart and series, credits disabled, no explicit width/height, deterministic seeded
    LCG'
  weaknesses:
  - Title occupies only ~30% of plot width at 22px, well below the typical 50-70%
    target for a title this length — a modest fontsize bump would strengthen visual
    hierarchy
  - Y-axis has 13 gridlines at a dense 0.005 step interval — set an explicit coarser
    tickInterval for a cleaner, more polished look
  - No visual emphasis or annotation calling out the distribution's mode/skew — a
    subtle highlight of the peak region would elevate data storytelling beyond 'display
    the data'
  - Several small helper functions (LCG PRNG, quantile, hexToRgba) deviate from strict
    linear KISS structure, though reasonably justified by the lack of a numpy-equivalent
    in the browser runtime
