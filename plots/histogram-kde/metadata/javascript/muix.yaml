review:
  strengths:
  - Realistic, well-motivated dataset (daily portfolio returns with occasional shock
    days) produces a genuine left-skewed, fat-tailed shape that the KDE overlay reveals
    clearly
  - 'Solves MUI X''s band-scale-vs-continuous-axis constraint elegantly: draws histogram
    bars via useDrawingArea + raw SVG rects mapped onto the same continuous x-axis
    the KDE LinePlot uses, so bars and curve share one coordinate space'
  - 'Follows the spec notes precisely: density-scaled y-axis, alpha 0.5 semi-transparent
    bars, Silverman''s-rule bandwidth for the KDE, contrasting green/blue colors'
  - Both themes render correctly with identical data colors (verified via pixel sampling)
    — only chrome flips; canvas is exactly 3200x1800 with no clipping or overlap
  - Clean custom legend, descriptive axis labels with units, and legible text even
    at 400px thumbnail scale
  weaknesses:
  - Design excellence is fairly plain/default — no additional visual emphasis (e.g.
    a callout on the shock-day tail region, or a mean/median reference line) to elevate
    storytelling beyond the base histogram+KDE
  - The manual bar-drawing workaround (HistogramBars component with useDrawingArea)
    adds code complexity (extra lcg/randn/kernelDensity/HistogramBars helpers) beyond
    a minimal script — justified by the library constraint but worth noting for KISS
    scoring
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-kde · javascript · muix · anyplot.ai" in dark ink, top-left, ~46% of plot width. Custom legend below title with two swatches ("Observed density" green square, "KDE estimate" blue line segment) and soft-ink labels. X-axis "Daily Return (%)" with percentage tick labels from -6.0% to 3.0%; Y-axis "Density" (rotated) with tick labels 0.00–0.60. Horizontal grid lines only, subtle warm-gray. Only left+bottom axis lines drawn, no boxed frame.
      Data: Green (#009E73) semi-transparent histogram bars (alpha ~0.5) covering ~30 bins from about -6.5% to 3%, distribution is right-heavy/peaked near 0% with a long left tail and a small secondary bump around -3% to -6% (shock days). Navy-blue (#4467A3) smooth KDE line overlaid, tracking the bar heights closely including the small left-tail bump. First series correctly uses Imprint brand green.
      Legibility verdict: PASS — all title, legend, and axis text is clearly readable against the light background; no overlap or clipping observed (verified with crops of title/legend, y-axis label, and left/right/bottom margins).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title and legend in light ink, axis labels/ticks in light soft-ink, horizontal grid lines subtle and visible against the dark surface.
      Data: Confirmed via pixel sampling that both the histogram bar fill (base color 0x009E73 blended at 0.5 alpha over each background) and the KDE line RGB (68,103,163 = #4467A3) are identical between light and dark renders — only the chrome (background/text/grid) flips as required.
      Legibility verdict: PASS — no dark-on-dark issues; all text (title, legend, axis labels, tick labels) is clearly legible in light ink against the near-black background. Brand green and the KDE blue both remain clearly visible.
