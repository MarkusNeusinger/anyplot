review:
  strengths:
  - 'Correct density normalisation: bars are count/(n·binWidth) and the Gaussian KDE
    (Silverman h = 0.34%) is on the same scale, so the curve runs at the level of
    the bar tops; the KDE peak of ~0.43 matches the analytic mixture density 0.91/(0.85·√(2π))
    ≈ 0.427'
  - 'Idiomatic MUI X v9 composition: ChartsContainer with LinePlot, ChartsGrid, ChartsXAxis/ChartsYAxis
    plus a custom SVG bar layer positioned through the useDrawingArea hook, since
    community BarChart only offers band scales'
  - Contiguous semi-transparent (fillOpacity 0.5) brand-green bars with a 1 px seam
    and a 3.5 px Imprint-blue KDE line that reads as its own layer in both themes
  - 'Realistic data story: 500 daily stock returns with 9% shock days, giving a fat
    left tail that the histogram and KDE both show while the curve tails stop near
    the data range'
  - 'Clear typographic hierarchy: 22 px title, 15 px inkSoft subtitle carrying n,
    mean, SD and bandwidth, and a bold top-left legend aligned with the title'
  - Theme tokens threaded through every chrome element (ink, inkSoft, grid); data
    colours identical in both renders; skipAnimation set on container and LinePlot
  weaknesses:
  - 'Suggestion: the dashed mean reference line is an annotation layer the spec does
    not request; the distribution reads fully without it, and dropping it would let
    the KDE peak be the single focal point.'
  - 'Suggestion: the hand-built HTML legend could be replaced by ChartsLegend fed
    from series definitions, so legend glyphs stay tied to the rendered marks.'
  - 'Suggestion: in the dark render the #4467A3 KDE line over the dark-green bar fill
    has modest contrast; a slightly heavier stroke (about 4 px) would keep it as prominent
    as in the light render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "histogram-kde · javascript · muix · anyplot.ai" top-left (~37% of width), inkSoft subtitle with n = 500, mean -0.03%, SD 1.10%, Silverman h = 0.34%; HTML legend row ("Observed density (30 bins)" green swatch, "Gaussian KDE estimate" blue line). Y axis "Probability Density" 0.00–0.60 in 0.05 steps, x axis "Daily return (%)" -6.0% … 3.0%. Subtle horizontal grid only. All text dark and readable.
      Data: 30 contiguous brand-green #009E73 bars at 0.5 opacity with thin page-coloured seams, density-scaled; peak bar 0.54 at ~0%, long sparse left tail to -6%; smooth #4467A3 KDE line peaking ~0.43 that follows the skew and ends near the data range; dashed inkSoft mean line at -0.03% with a bold "Mean -0.03%" label at the top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend labels, axis titles and tick labels all render in light ink; grid lines subtle but visible; no dark-on-dark text. Mean line and its label in light inkSoft.
      Data: identical colours to the light render — the same 0.5-opacity brand green (reads as darker green over the dark page) and the same #4467A3 KDE line; the curve stays visible along its full length over the bars.
      Legibility verdict: PASS
