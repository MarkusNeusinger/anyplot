review:
  strengths:
  - Correct histogram + KDE overlay with y-axis scaled as density (after_stat(density)),
    matching the spec's requirement that histogram and KDE share a comparable scale
  - Realistic, neutral finance dataset (Student-t mixed with chi-squared skew) produces
    genuine fat tails and mild negative skew, plus a small secondary bump around +2.5%
    — exactly the kind of shape a KDE overlay is meant to reveal
  - 'Theme-adaptive chrome is correctly threaded through in both renders: title, axis
    labels, tick labels, grid, and legend box all flip appropriately with no dark-on-dark
    or light-on-light failures'
  - Legend clearly distinguishes the two layers ("Observed frequency" fill swatch
    vs. "KDE estimate" line swatch) via the aes(fill=/color="label") manual-legend
    trick, correctly labeled and placed inside the plot without colliding with data
  - All font sizes explicitly set via theme(), and semi-transparent histogram bars
    (alpha = 0.5) keep the KDE curve fully visible as instructed by the spec notes
  weaknesses:
  - KDE line uses Imprint palette position 3 (#4467A3, blue) instead of the canonical
    position 2 (#C475FD, lavender) for the second series, with no semantic justification
    for skipping a slot — the sibling matplotlib implementation for this same spec
    correctly uses position 2 for the KDE curve. Change scale_color_manual's "KDE
    estimate" value to IMPRINT_PALETTE[2].
  - Horizontal gridlines (panel.grid.major.y) are drawn in full-opacity INK color,
    not a faint tint — they read as fairly bold/high-contrast lines rather than the
    subtle 15-25%-opacity grid the style guide calls for. Since ggplot2 doesn't expose
    alpha on grid lines, blend INK toward PAGE_BG (e.g. a light gray hex) instead
    of using the same full-strength ink token used for title/axis text.
  - library(dplyr) is imported but never used anywhere in the script (data frame is
    built with tibble::tibble only, no dplyr verbs or pipes) — remove the unused import.
  - 'Design Excellence / storytelling is at the default level: the plot displays the
    distribution but doesn''t call out the fat-tail / skew insight visually (e.g.
    no subtle emphasis on the tail region) — optional polish for a higher score, not
    a required fix.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "histogram-kde · r · ggplot2 · anyplot.ai" top-left (~35-40% of plot width, comfortably sized, no overflow/clipping). X-axis title "Daily Return (%)" and Y-axis title "Density" in dark ink, both similarly sized. Tick labels (-2, 0, 2 on X; 0.0, 0.2, 0.4, 0.6 on Y) in a slightly softer dark gray, well balanced between axes. Horizontal-only gridlines at each Y tick, rendered in full dark ink — visible but on the bold side rather than subtle. Legend sits inside the plot, upper right, in a cream "elevated" box with a thin border, containing a green filled swatch ("Observed frequency") and a blue-outlined swatch ("KDE estimate"); it does not collide with the histogram peak. All text is clearly readable against the light background.
      Data: Green (#009E73) semi-transparent histogram bars (40 bins) form a right-leaning bell shape with visible fat left/right tails and a small secondary bump near +2.5%; a thick blue (#4467A3) KDE line traces the smoothed density on top, clearly visible through the semi-transparent bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white and soft light-gray tones respectively, fully legible against the dark background — no dark-on-dark failures observed. Gridlines are lighter (light ink at low apparent contrast against the dark surface) and still readable but, symmetrically with the light render, look like a fairly solid single-weight line rather than a faint tint. Legend box now has a dark "elevated" fill with a lighter border, same green/blue swatches and text, positioned identically to the light render with no overlap issues.
      Data: Same green (#009E73) bars and same blue (#4467A3) KDE line — confirmed identical to the light render; only the chrome (background, text, grid, legend box) flipped as required.
      Legibility verdict: PASS
