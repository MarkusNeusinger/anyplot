review:
  strengths:
  - 'Correct plot type: histogram with semi-transparent bars (alpha 0.5) plus a contrasting-color
    KDE overlay, y-axis normalized to density so both series are on a comparable scale,
    exactly as the spec''s Notes require'
  - 'Theme-adaptive chrome is fully wired through: both light and dark renders use
    correct Imprint background tokens, ink/ink-soft text tokens, and theme-correct
    grid opacity — no dark-on-dark or light-on-light failures in either render'
  - Realistic, neutral, well-scaled example data (right-skewed marketing session-duration
    distribution, n=600) that clearly demonstrates why a KDE overlay adds value over
    binning alone
  - 'Idiomatic Makie usage: native density! recipe computes the KDE directly (no external
    stats dependency needed), clean KISS Imports/Data/Plot/Save structure, explicit
    font-size tokens, and Random.seed!(42) for reproducibility'
  - 'Solid visual refinement: top/right spines removed, single subtle y-axis grid
    (x grid off), frameless legend with elevated-surface background — clearly above
    raw library defaults'
  weaknesses:
  - 'VQ-07: The KDE line uses IMPRINT_PALETTE[3] (#4467A3, blue), skipping IMPRINT_PALETTE[2]
    (#C475FD, lavender) with no semantic justification — style guide requires canonical
    1→N order for non-first series unless a real-world color cue applies, which does
    not exist for a generic ''KDE'' label. Change density!''s strokecolor to IMPRINT_PALETTE[2].'
  - 'Title proportion is undersized: at titlesize=20 (40 native px after px_per_unit=2),
    the ~42-character mandated title fills only ~25-30% of the plot width, well under
    the ~50-70% guideline for a title of this length. Bump titlesize to roughly 24-26
    to give the title more visual presence and improve legibility at mobile scale.'
  - Design Excellence sits at 'well-configured defaults' level — the histogram+KDE
    combination doesn't add any storytelling emphasis (e.g., no callout on the peak/mode
    or the long tail). A small annotation highlighting the skew or peak session length
    would lift DE-03 without introducing fake interactivity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "histogram-kde · julia · makie · anyplot.ai" centered at top, clearly visible against the light background. X-axis label "Session Duration (minutes)" and y-axis label "Density" (rotated) are dark and readable. Tick labels (0/5/10/15 on x, 0.0/0.1/0.2 on y) are a softer dark gray, legible. Only left and bottom spines are visible (L-shaped frame); a single subtle horizontal gridline set (~15% opacity) marks 0.1/0.2 density. Legend in the top-right shows a green swatch labeled "Observed sessions" and a blue-outlined swatch labeled "KDE", set on a slightly elevated frameless panel.
      Data: Histogram bars are semi-transparent brand green (#009E73 at alpha 0.5), right-skewed with a sharp peak around 2 minutes and a long thin tail out past 15 minutes. The KDE line is a smooth blue (#4467A3) stroke tracking the histogram shape closely.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light tones (white/light-gray) and remain fully legible against the dark background. The same L-shaped spine layout and subtle gridline are present, now in a light-toned low-opacity stroke. The legend panel background has flipped to a dark elevated tone with light text, still fully readable.
      Data: The histogram bars remain the identical brand green (#009E73, alpha 0.5) and the KDE line remains the identical blue (#4467A3) as in the light render — only the chrome (background, text, grid, legend panel) changed between themes, confirming data-color consistency.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick text is clearly visible against the near-black surface.
