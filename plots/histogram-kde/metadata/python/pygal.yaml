review:
  strengths:
  - 'Correct Imprint palette with theme-adaptive chrome: brand green #009E73 histogram
    + lavender #C475FD KDE curve are identical across renders, and both plot-light.png
    and plot-dark.png background/text/legend colors are theme-correct and fully readable.'
  - Creative technique for combining a step-path histogram with a continuous-scale
    KDE overlay inside a single pygal.XY chart, working around pygal's Histogram chart
    type not supporting an overlaid line series on the same x-scale.
  - Realistic, neutral injection-molding QC dataset (target set-point 205C with cold-start
    and overheat tails) that visibly shows multimodal bumps around 196C and 216C,
    supporting good DQ-01 feature coverage.
  - All font sizes explicitly set (title, axis, tick, legend) and legible at full
    3200x1800 resolution in both themes.
  - Clean KISS script structure with a fixed np.random.seed(42) for reproducibility.
  weaknesses:
  - 'Design Excellence still reads close to a configured library default: nothing
    visually calls out the target set-point (205C) or the cold-start/overheat excursions
    that make this dataset interesting. A subtle reference line or shaded band at
    205C would turn this into a story instead of a plain distribution (DE-01, DE-03).'
  - The KDE curve is a thin, muted lavender line that gets visually close to lost
    against the tall green histogram peaks (e.g. around 204-208C). Consider a heavier
    stroke width or higher-contrast treatment to keep it prominent above the bars
    in both themes (VQ-03).
  - 'Library Mastery is generic: the implementation doesn''t lean on any pygal-distinctive
    capability. Using `interpolate=''cubic''` on the KDE series (or another pygal-specific
    feature) would smooth the curve and meaningfully improve LM-02 without affecting
    the static PNG (LM-02).'
  - Both show_x_guides and show_y_guides are disabled entirely; a very subtle horizontal
    guide tied to foreground_subtle would help readers estimate density values at
    a glance without adding clutter (DE-02).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface, not pure white.
      Chrome: Title "Injection Molding Barrel Temperature · histogram-kde · python · pygal · anyplot.ai" sits fully visible at the top with generous whitespace above and below, no clipping at the canvas edge. Axis titles "Barrel Temperature (C)" (x) and "Probability Density" (y) are dark, clearly legible. Y-axis tick labels (0, 0.01 ... 0.1) and x-axis tick labels (192, 196, ... 220) are dark ink on the light background, fully readable. Legend ("Histogram", "KDE Curve") sits at the bottom-left with dark, readable text.
      Data: Histogram bars render as a semi-transparent brand-green (#009E73 at alpha 0.5) step-filled area over the light background, giving a muted sage-green tone from alpha compositing. The KDE curve is a thin lavender (#C475FD) line tracing over the bar tops. First series is the mandated #009E73.
      Legibility verdict: PASS - all text is clearly readable against the light surface, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface, not pure black.
      Chrome: Same title, axis titles, and tick labels now render in light ink, fully legible against the dark background. No dark-on-dark text anywhere - title, axis labels, and tick labels are all clearly visible. Legend text is light-colored and readable at the bottom-left.
      Data: Histogram bars are the same #009E73 green series, now alpha-composited against the near-black background giving a deeper forest-green tone (this is expected alpha-blending behavior, not a palette violation - the underlying series color is unchanged). The KDE curve remains the same lavender (#C475FD) line, clearly distinguishable from the green fill and the dark background.
      Legibility verdict: PASS - all text is clearly readable against the dark surface, no dark-on-dark failures observed.

    Both renders use identical data colors (#009E73 histogram, #C475FD KDE curve); only the chrome (background, text ink, legend box) flips between themes as required.
