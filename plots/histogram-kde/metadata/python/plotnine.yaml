review:
  strengths:
  - 'Histogram uses the exact BRAND #009E73 fill at alpha=0.5 as the spec''s ''semi-transparent
    bars'' requirement calls for, with a contrasting solid ink-colored KDE line'
  - Y-axis correctly mapped to density via after_stat('density') so the histogram
    and KDE curve sit on a directly comparable scale
  - Dashed mean-return reference line (geom_vline) adds a genuine storytelling focal
    point highlighting central tendency against the skewed distribution
  - 'Realistic financial data: a 3-component normal mixture (calm/volatile/low-vol
    regimes) produces authentic skew, fat tails, and a secondary tail bump — good
    distributional feature coverage for DQ-01'
  - All theme font sizes explicitly set (title=12pt, axis_title=10pt, axis_text=8pt)
    and correctly threaded through theme tokens for both light and dark renders
  - Clean, idiomatic ggplot/plotnine composition (KISS layering of geom_histogram
    + geom_density + geom_vline), no manual density computation needed
  weaknesses:
  - Title omits the 'language' segment of the mandated format — currently 'histogram-kde
    · plotnine · anyplot.ai', should be 'histogram-kde · python · plotnine · anyplot.ai'
    per SC-04
  - panel_border draws a full four-sided box around the panel, contradicting the style
    guide's default L-shaped spine convention (remove top/right) — remove panel_border
    or restrict to left/bottom axis lines unless there's a specific reason to keep
    the plot fully enclosed
  - Design Excellence is solid but not yet distinctive — consider a small numeric
    annotation on the mean line (e.g. the mean value itself) or slightly more refined
    typography to push DE-01/DE-03 further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-kde · plotnine · anyplot.ai" in dark ink, centered top, clearly readable. Axis titles "Daily Return (%)" (x) and "Density" (y) in dark ink. Tick labels in muted grey-ink, subtle horizontal/vertical gridlines at low opacity. A thin four-sided panel border in muted grey-ink frames the plot area.
      Data: Histogram bars in semi-transparent brand green (#009E73 @ alpha 0.5, reading as light mint-green with a green outline) over ~35 bins, showing a right-skewed, fat-tailed distribution centered near 0. A smooth black KDE line overlays the bars, closely tracking the histogram shape including a small secondary bump in the left tail. A grey dashed vertical line marks the mean return just above the peak.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white and muted light-grey ink respectively, all clearly legible. Gridlines and panel border are faint light lines. No dark-on-dark issues found — text is uniformly light-colored where the background is dark.
      Data: Histogram bars are the same underlying #009E73 green (alpha-blended over the darker background so they read as a deeper saturated teal-green, which is the expected effect of alpha compositing over a different backdrop, not a palette violation) with a bright white KDE line for contrast — data colors are identical in hue/identity to the light render, only the chrome and the alpha-blend backdrop differ as designed.
      Legibility verdict: PASS — all text and data elements are clearly distinguishable from the dark background.
