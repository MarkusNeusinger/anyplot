review:
  strengths:
  - 'First categorical series is #009E73 with theme-correct chrome in both renders
    — background, grid, ticks, and text all flip correctly between #FAF8F1 (light)
    and #1A1A17 (dark) while data colors stay identical.'
  - Amber (#DDCC77) semantic anchor is used correctly for its intended role — a 'stress
    tail' callout band — rather than as a categorical color slot, and the mapping
    is legible via the annotation text.
  - 'Genuine data storytelling: the dashed mean line + ''+0.1%'' label and the shaded
    stress-tail region give the histogram a clear point of view (left-skew, fat tail)
    instead of just displaying raw bins.'
  - KDE overlay via geom_area(stat='density') with a contrasting ink-toned border/fill
    against the semi-transparent (alpha=0.55) green histogram bars — both series stay
    clearly distinguishable and the fill highlights where the smooth curve departs
    from the binned histogram.
  - 'Distinctive lets-plot feature: a hand-built layer_tooltips() with per-field number
    formatting and labeled lines (Return / Density / Count), which showcases the library''s
    HTML-interactivity strength beyond the generic geom API.'
  - Realistic, neutral finance scenario (simulated daily stock returns mixing a calm
    regime, a stress regime, and a rally) with np.random.seed(42) for reproducibility.
  - Canvas is exactly 3200x1800 via ggsize(800,450) + scale=4, and the title follows
    the mandated 'histogram-kde · letsplot · anyplot.ai' format exactly.
  weaknesses:
  - Tertiary annotation text ('stress tail', 'mean +0.1%' at geom_text size=3.2) is
    noticeably smaller than the axis/tick chrome — bump to ~3.6-4.0 for stronger legibility
    at mobile widths.
  - The simulated stress-regime tail (mean -2%, std 3%, scaled to daily %) pushes
    into the -8% to -10% daily-return range, which is more characteristic of a single-stock
    crash/circuit-breaker day than a generic 'stock daily returns' series — consider
    narrowing the stress-regime spread slightly or labeling the scenario as a single
    volatile stock for tighter factual framing.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white surface, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-kde · letsplot · anyplot.ai" in dark ink at top-left, clearly readable. X-axis "Daily Return (%)" and Y-axis "Density" labels in dark ink, tick labels in a slightly softer dark gray. Grid is a subtle light-gray horizontal/vertical rule, not competing with data. A pale amber-tinted rectangle spans the left "stress tail" region with a small gray label inside it. A black dashed vertical line marks the mean with a "mean +0.1%" label just to its right.
      Data: Histogram bars are brand green (#009E73) at alpha ~0.55 with matching green edges; a bold gray density (KDE) curve overlays the bars with a light gray fill beneath it, clearly visible above and distinct from the green bars. First (only) series correctly uses #009E73.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, annotations) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black surface, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light/off-white ink, fully legible against the dark background. Grid lines are faint light-gray, subtle but visible. The stress-tail band now reads as a dark olive-tinted rectangle with a light "stress tail" label inside it. The mean line is now a white dashed line with a white "mean +0.1%" label.
      Data: Histogram bars remain the identical brand green (#009E73) as in the light render; the KDE curve is now rendered in a light gray/off-white tone (INK_SOFT for dark theme) so it stays visible against the dark background while still contrasting with the green bars.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (title, axis labels, ticks, annotations) is light-colored and clearly legible against the near-black background, and the brand green data color is identical to the light render.
