review:
  strengths:
  - Multimodal test-score data (three overlapping normal components) genuinely demonstrates
    the KDE-vs-histogram value proposition from the spec — the smooth curve reveals
    the underlying trimodal shape that binning artifacts obscure
  - 'Correct spec-mandated technique choices: alpha=0.5 semi-transparent histogram
    bars, stat="density" y-scaling, and contrasting brand green (#009E73) vs lavender
    (#C475FD) for histogram vs KDE line'
  - 'Distinctive seaborn touches beyond generic defaults: sns.rugplot() surfaces individual
    observations beneath the histogram, and sns.despine(offset=6, trim=True) gives
    trimmed, offset spines instead of a plain L-frame'
  - Theme-adaptive chrome correctly threaded through rc params, tick_params, spine
    colors, and legend facecolor/edgecolor — both light and dark renders are fully
    readable with identical data colors
  - 'Clean KISS script: seeded data generation, explicit fig/ax, no functions/classes,
    correct plot-{THEME}.png output'
  weaknesses:
  - 'Title is missing the required {language} segment: code sets "histogram-kde ·
    seaborn · anyplot.ai" but the mandated format is "{spec-id} · {language} · {library}
    · anyplot.ai" — for this Python implementation it must read "histogram-kde · python
    · seaborn · anyplot.ai". Fix line 83 in plots/histogram-kde/implementations/python/seaborn.py.'
  - Legend order is visually reversed from data/plot order — "KDE" appears above "Histogram"
    in the legend box even though the histogram (green, first Imprint series) is drawn
    first and is the primary series; consider passing explicit handles/labels or reordering
    so Histogram lists first for a cleaner visual hierarchy.
  - Histogram uses 35 bins for ~420 points, producing a visibly noisy/jagged bar profile
    in the 60-80 range; a slightly coarser bin count (e.g. 25-28) would smooth the
    bars without losing the multimodal shape, letting the KDE and histogram tell a
    more consistent story together.
  - Design storytelling is good but not exceptional — no explicit visual callout (e.g.
    subtle annotation or color emphasis) draws the eye to the three underlying subpopulations
    (struggling / typical / high-performing) that motivated the multimodal data choice;
    this is optional polish, not a requirement.
