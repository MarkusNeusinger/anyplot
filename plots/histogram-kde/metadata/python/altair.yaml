review:
  strengths:
  - Canvas is correctly sized (3200x1800 landscape, no gate flag) with the exact anyplot
    title format
  - Full theme-adaptive chrome — title, axis labels, ticks, and grid are legible in
    both light and dark, and the histogram/KDE colors are pixel-identical across themes
  - Bimodal synthetic dataset (two overlapping normal distributions) genuinely demonstrates
    the value of the KDE overlay — it reveals the two-peak structure that a coarser
    binning could obscure
  - 'Polished mark styling: rounded bar corners, semi-transparent histogram fill,
    and a monotone-interpolated KDE line for a smooth contrast to the discrete bars'
  - Idiomatic altair layered-chart composition (mark_bar + mark_line via x2/y2 banding)
    with formatted tooltips on both layers
  weaknesses:
  - 'KDE line uses Imprint position 7 (rose #954477) instead of the canonical position
    2 (lavender #C475FD) as the second series color — a minor palette-order deviation.
    It''s a defensible accent choice since the KDE curve is a different visual role
    than the histogram, but strict canonical order would favor position 2 for the
    second element.'
  - Synthetic test-score data ranges to roughly 108, slightly past the conventional
    0-100 test-score scale — a minor realism nit that doesn't affect legibility or
    the KDE demonstration.
  - No legend distinguishes 'histogram' from 'KDE curve' by label — the encoding is
    visually self-evident (bars vs. line) so this is a minor nice-to-have, not a defect.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold black title "histogram-kde · altair · anyplot.ai" centered at top; dark "Test Score" x-axis title and "Density" y-axis title; secondary dark-gray tick labels along both axes; subtle light-gray gridlines at low opacity. All fully legible.
      Data: Teal-green (#009E73, Imprint position 1) semi-transparent histogram bars showing a clearly bimodal distribution (peak near 45-50, secondary bump near 65-75); a smooth rose/purple (#954477, Imprint position 7) KDE line traces the same bimodal shape on top, staying visible through the bar fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Bold off-white title, light axis titles, light-gray tick labels, subtle light gridlines at low opacity against the dark surface. All fully legible — no dark-on-dark text anywhere.
      Data: Identical teal-green histogram bars and rose KDE line as the light render — same hues, same bimodal shape, confirming only chrome (not data colors) flipped between themes.
      Legibility verdict: PASS
