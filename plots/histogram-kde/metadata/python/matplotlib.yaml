      Data: Histogram bars in brand green (#009E73) at alpha 0.5, KDE line in accent purple (#C475FD) with a soft purple fill_between beneath it giving the curve visual weight. Dashed gray mean line with "mean 0.10%" annotation near the peak. First series correctly uses #009E73.
