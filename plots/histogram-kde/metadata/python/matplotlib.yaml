review:
  strengths:
  - Correct histogram+KDE combination with proper density scaling (density=True) and
    semi-transparent bars (alpha=0.5) so the KDE curve stays visible per spec notes
  - fill_between under the KDE curve (accent purple, alpha=0.15) adds layered visual
    depth and separates the smooth density estimate from the discrete bars beneath
    it
  - Mean reference line (axvline) with annotation gives the distribution a clear focal
    point, supporting the spec's stated goal of identifying skewness/tail behavior
  - Theme tokens (PAGE_BG, INK, INK_SOFT, ELEVATED_BG) are threaded through every
    chrome element consistently; both light and dark renders are fully legible
  - Canvas saved at exact 3200x1800 landscape target, no clipping of title/labels/legend
    in either render
  - 'Clean, reproducible, KISS-structured code: single seed (42), only used imports,
    no functions/classes, correct plot-{THEME}.png output'
  weaknesses:
  - Mean annotation ('mean 0.10%') sits directly at/crosses the KDE curve peak with
    only a small (6,-2) point offset, crowding the plot's busiest visual area — nudge
    it further up/right or add a short leader so it doesn't compete with the curve
    line for attention.
  - KDE-via-scipy + fill_between is a solid, correct technique but fairly standard;
    no additional matplotlib-distinctive flourish (e.g., a secondary annotation calling
    out the tail-risk region the spec's 'Applications' section highlights) to push
    Library Mastery beyond baseline.
  - Design Excellence is good but not exceptional — grid/spine treatment is close
    to the style-guide defaults; a slightly more custom visual hierarchy (e.g., shading/labeling
    the tail region) would strengthen the storytelling given the stock-returns tail-risk
    narrative in the code comments.
