review:
  strengths:
  - Switched to the native go.Histogram trace (histnorm="probability density", nbinsx=35)
    instead of manually binning with np.histogram + go.Bar, directly addressing the
    attempt-1 LM-01 feedback — bars now carry clean page-bg edge lines characteristic
    of the built-in trace
  - 'Correct Imprint palette in both renders: brand green #009E73 histogram, lavender
    #C475FD KDE line, identical hex values across light/dark, theme-correct #FAF8F1/#1A1A17
    backgrounds and fully legible chrome in both themes'
  - KDE fill opacity was bumped for dark mode (rgba alpha 0.12 light vs 0.22 dark)
    and the difference is visible on inspection — the fill no longer reads as near-invisible
    on the dark surface
  - 'Realistic, well-scaled financial return data: mixture distribution with explicit
    left-tail (drawdowns) and right-tail (gains) components producing a genuine skew/shoulder
    shape'
  - Clean KISS structure, seeded RNG, explicit font sizing throughout, correct 3200x1800
    canvas via write_image(width=800, height=450, scale=4), and both PNG + HTML outputs
    saved
  weaknesses:
  - 'The two fig.add_annotation() calls ("Left tail: market drops" at x=-1.5 and "Right
    tail: gains" at x=1.2) that this repair added to address the attempt-1 DE-03 feedback
    do NOT appear in either plot-light.png or plot-dark.png — verified by cropping
    the full plot area in horizontal strips and zooming on the expected annotation/arrow
    coordinates: no text, no arrow line, nothing renders. The tail story is still
    untold visually despite the code changes.'
  - The legend still renders with a full solid border box in both themes even though
    the code now sets legend.borderwidth=0 — the intended DE-02 fix (remove the border
    for a more minimal legend chip) did not visually take effect either.
  - Because both targeted repair fixes are silently non-functional in the actual rendered
    output, DE-02 and DE-03 remain at the same level as attempt 1 — investigate why
    kaleido's static export is dropping the annotations (check ax/ay + arrow properties,
    or a version-specific export quirk) and why borderwidth:0 isn't suppressing the
    legend border, then re-verify against the actual PNG pixels, not just the source
    code, before the next submission.
  - 'DQ-01 feature coverage is still capped by the same subtlety as attempt 1: the
    multimodal left/right tail shoulders are present in the histogram shape but small
    and easy to miss without the (currently invisible) callouts.'
