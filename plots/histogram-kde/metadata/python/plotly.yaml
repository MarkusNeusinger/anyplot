review:
  strengths:
  - 'Correct Imprint palette: histogram is brand green #009E73 (position 1), KDE line
    is lavender #C475FD (position 2), identical hex values in both light and dark
    renders'
  - 'All spec requirements met: semi-transparent bars (opacity 0.5), y-axis normalized
    to density (not counts), contrasting histogram/KDE colors, KDE fill (''tozeroy'')
    that reveals the shape without hiding the bars'
  - 'Realistic, well-scaled financial data: mixture of a main return distribution
    plus explicit left-tail (market drops) and right-tail (gains) components, producing
    a visible skew/shoulder that supports the spec''s ''skewness and tail behavior''
    use case'
  - Explicit font sizing throughout (title 16px, axis titles 12px, ticks/legend 10px)
    and theme-adaptive chrome correctly threaded through xaxis/yaxis/legend/paper/plot
    backgrounds for both themes
  - Clean KISS structure, seeded RNG, only used imports, correct write_image dimensions
    (800x450 scale=4 -> 3200x1800) and write_html output
  weaknesses:
  - Histogram + KDE is bypassed in favor of manually computing np.histogram/gaussian_kde
    and drawing them as go.Bar + go.Scatter — plotly ships figure_factory.create_distplot
    specifically for this histogram+curve combination, and go.Histogram is the native
    trace type; the manual approach is valid but not the library's most idiomatic
    pattern for this exact plot type (LM-01, LM-02).
  - No annotation or visual callout marks the left-tail (market-drop) or right-tail
    (gains) components the spec calls out as the analytical point of a histogram+KDE
    (identifying skewness/tail behavior) — the shape is visible but unexplained, so
    the plot displays the data without actively telling that specific story (DE-03).
  - Legend keeps a full bordered box (bordercolor + borderwidth) rather than the more
    refined borderless/minimal legend chip suggested by the style guide's decoration-removal
    checklist — a small, easy DE-02 polish item.
  - KDE curve's soft fill ('rgba(196,117,253,0.12)') is a good touch but is quite
    faint at this contrast in the dark render — consider nudging the fill opacity
    up slightly on dark so it doesn't read as almost pure background there.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "histogram-kde · python · plotly · anyplot.ai" in dark ink, centered, fully visible, no clipping. X-axis title "Daily Return (%)" and y-axis title "Density" in dark ink, both clearly legible. Tick labels in a softer dark gray, legible. Subtle horizontal gridlines only (y-axis grid, x-axis grid off, as recommended). Legend box top-right with elevated cream fill and a thin border, both entries ("Histogram", "KDE") legible.
      Data: Histogram bars are semi-transparent brand green (#009E73, opacity 0.5) with thin light-colored edges for bar separation; KDE line is a solid lavender/purple (#C475FD, width ~3.5) with a very light purple fill under the curve. First series is the brand green as required by the palette rule.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white and soft light gray respectively — clearly visible against the dark background. Gridlines are still faint horizontal lines, correctly inverted-opacity for the dark surface. Legend box uses the dark elevated fill (#242420) with a light border, both entries legible.
      Data: Histogram bars and KDE line use the identical underlying hex values (#009E73 green, #C475FD lavender) as the light render — only the perceived blended color of the semi-transparent bars differs because the alpha=0.5 fill is composited against a different (darker) background, which is expected alpha-blending behavior, not a palette violation. KDE curve and its faint fill remain visible, though the fill is quite subtle against the near-black surface.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is light-colored and reads clearly against the near-black background.
