      Data: Semi-transparent brand-green (#009E73, opacity 0.5) histogram bars with thin page-bg edge lines from the native go.Histogram trace; a lavender (#C475FD) KDE line (width ~3.5) with a very faint lavender "tozeroy" fill tracks the density shape closely, peaking near x=0.2-0.3 with a visible left shoulder (~x=-1.5 to -2.5) and right shoulder (~x=1-1.5) corresponding to the tail mixtures. No annotation text or arrows are visible anywhere on the canvas despite two fig.add_annotation() calls in the source labeling these tails — confirmed by cropping and zooming on the exact expected coordinates.
