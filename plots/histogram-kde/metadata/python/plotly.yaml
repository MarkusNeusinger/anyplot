    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title/axis titles/tick labels now render in light ink / soft light-gray, clearly legible against the dark surface — no dark-on-dark failures. Legend box flips to a dark elevated fill with light text, but still shows a visible light-colored solid border (again, borderwidth=0 in code did not suppress it).
