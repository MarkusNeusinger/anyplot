review:
  strengths:
  - 'Composes the grid on ChartsContainer with two hidden band axes (categoryGapRatio:
    0) and reads cell positions through useXScale / useYScale / useDrawingArea, so
    the custom SVG layer is driven by MUI X''s own scales rather than hand-computed
    coordinates'
  - 'Two-level line hierarchy: thin 1 px cell lines in the inkSoft token and 4 px
    box borders in the ink token, with the thin layer painted first and square linecaps
    so the thick borders meet cleanly at every corner; both weights stay distinct
    in light and dark'
  - Digits are sized as a share of the cell side (DIGIT_SHARE = 0.56) and centered
    with textAnchor middle / dominantBaseline central, so every given sits optically
    centered and clear of the grid lines in both themes
  - Empty cells render truly blank, and the givens are a valid puzzle state (no digit
    repeats in any row, column or 3×3 box)
  - 'Fully theme-adaptive through window.ANYPLOT_TOKENS: chrome and digits flip between
    #FAF8F1 and #1A1A17 with no hard-coded colors; skipAnimation is set'
  weaknesses:
  - 'Suggestion: the header band leaves a noticeably larger gap above the grid (~90
    px) than the bottom margin (~60 px); trimming HEADER_H or PAD would centre the
    grid more evenly on the square canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400×2400 canvas.
      Chrome: centered bold title "sudoku-basic · javascript · muix · anyplot.ai" in dark ink, with a smaller inkSoft subtitle "9 × 9 grid in 3 × 3 boxes · 30 givens · 51 empty cells"; no axes, ticks or legend (expected per spec). All text crisp and readable.
      Data: 9×9 grid of equal cells; thin gray cell lines and thick near-black 3×3 box borders, the two weights clearly distinct. 30 bold dark digits centered in their cells, empty cells blank. Monochrome — no palette colors needed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and subtitle flip to light ink / light inkSoft and read cleanly; no dark-on-dark text anywhere.
      Data: identical layout and givens; thin light-gray cell lines and thick off-white box borders, still clearly distinguishable; digits in off-white, centered and clear of the lines. Only chrome/ink flips between themes.
      Legibility verdict: PASS
