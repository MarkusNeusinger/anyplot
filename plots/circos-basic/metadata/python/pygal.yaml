review:
  strengths:
  - 'Faithful circos construction in pygal.XY: segmented outer ring with gaps, a radial
    expression track, and ribbons whose stroke width is proportional to connection
    value'
  - Ribbon ends are partitioned into per-segment slots and ordered by partner position,
    which keeps crossings down
  - All eight Imprint positions used in canonical order, ribbons colored by source
    segment at 0.6 alpha, identical data colors across themes
  - Clean theme-token Style and adaptable column constants with a single tidy df
  - Interactive HTML output alongside the PNG (pygal tooltips and legend toggling)
  weaknesses:
  - 'CQ-01 (code): three helper functions polar(), arc() and with_alpha() at lines
    92-97 and 129-131 → inline the polar math in the loops and build the rgba strings
    in one expression. Likely cause: helper functions for repeated geometry.'
  - 'CQ-04 (code): the series tuple carries a dots field that is always 0 and unpacked
    as _dots, RIBBON_ALPHA is documented as the arc-slot share that RIBBON_FILL actually
    holds, and print_values=False / include_x_axis=False restate defaults → drop the
    dead field and the default options, fix the comment. Likely cause: leftovers from
    an earlier iteration.'
  - 'DE-02 (both): the label series draws a visible 3 px dot at each of the eight
    label anchors (e.g. above Chr2 and left of Chr4/Chr5), stray marks with no data
    meaning → hide them (dots_size=0 or show_dots=False on the label series). Likely
    cause: chart.add(None, labels, stroke=False, dots_size=1).'
  - 'Suggestion: the left-side labels (Chr4, Chr5) sit about 5 px from their arcs
    while the right-side labels keep about 20 px; a radial label offset instead of
    the fixed LABEL_DX/LABEL_DY would balance them.'
