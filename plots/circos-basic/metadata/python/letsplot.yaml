review:
  strengths:
  - Arc lengths follow the segment lengths (120 to 50 Mb) with even gaps, so the outer
    ring reads as a chromosome layout in natural Chr1-Chr8 order
  - Ribbon widths share one angle-per-unit scale at both anchors, so every ribbon
    is equally wide at both ends and proportional to its rearrangement count
  - Two inner expression tracks sit on faint full-height bands that show each track's
    scale, aligned to the segment spans and kept clear of the ribbon field; a caption
    names the track order and the ribbon encoding
  - One Imprint colour per segment used consistently for ring, track bars and outgoing
    ribbons; ribbons at alpha 0.5 stay distinguishable where they cross in both themes
  - Built from lets-plot's grammar (geom_polygon layers grouped by polygon id, coord_fixed,
    scale_fill_manual) with theme tokens threaded through every chrome element; exports
    PNG and interactive HTML
  weaknesses:
  - 'Suggestion: the fill legend repeats the direct Chr1-Chr8 ring labels; dropping
    it (legend_position=''none'') would give the circle more of the square canvas.'
  - 'Suggestion: lets-plot tooltips on the ribbon and track polygons (layer_tooltips
    with the link count or expression value) would make exact values readable in the
    HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400x2400 canvas.
      Chrome: bold title "circos-basic · python · letsplot · anyplot.ai" top-left (~65% width); bold dark segment labels Chr1-Chr8 outside the ring; right-hand legend Chr1-Chr8 in INK_SOFT; two-line right-aligned caption at the bottom naming the inner tracks (liver, then brain) and the ribbon encoding. All text dark and readable.
      Data: outer ring of eight arcs separated by gaps, sized by length (Chr1 longest, Chr8 shortest), coloured in Imprint order starting with #009E73; two inner tracks of radial bars in segment colours on faint grey bands; ten translucent ribbons of varying width cross the interior between segments, anchored inside the innermost track. No text overlap, nothing clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and segment labels in light ink, legend text and caption in light grey INK_SOFT; no dark-on-dark text. Track bands render as subtle dark-grey bands.
      Data: segment, track and ribbon colours identical to the light render; ribbons blend darker over the near-black surface but stay visible and distinguishable where they cross; brand green Chr1 reads clearly.
      Legibility verdict: PASS
