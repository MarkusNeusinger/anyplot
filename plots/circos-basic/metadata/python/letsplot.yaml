review:
  strengths:
  - Arc lengths follow the segment lengths and the gaps separate the eight chromosomes
    cleanly; segments run in natural chromosome order
  - Ribbon width is proportional to the rearrangement count at both ends (one angle
    per link unit), each ribbon anchored on the angular span of its two segments
  - Two concentric expression tracks sit inside the outer ring, aligned with each
    segment's span, on faint background bands that make the bar heights readable,
    and the caption names them outer to inner
  - Ribbons at alpha 0.5 with page-colored outlines stay distinguishable where they
    cross in both themes; ring, track bars and ribbons step down in opacity for a
    clear hierarchy
  - 'Theme tokens threaded through title, labels, legend, caption and outlines: both
    renders readable, data colors identical'
  - Exports an interactive HTML alongside the PNG, so the polygons carry lets-plot
    hover in the detail view
  weaknesses:
  - 'VQ-01 (both): the caption that explains the two inner tracks is set at 9 pt and
    drops to about 6 px in the 400 px thumbnail, so the track key is unreadable there
    → about 11 pt (+2 pt). Likely cause: plot_caption=element_text(size=9).'
  - 'VQ-05 (both): the caption runs flush to the right canvas edge (about 20 px margin
    at 2400 px) while about 300 px of empty space sits between the ring and the legend
    → a caption that fits with a margin, and less dead space under the circle. Likely
    cause: the right-aligned caption string length at plot_caption, and the y limit
    padding from PANEL_ASPECT/limit.'
  - 'CQ-04 (code): lines 46 and 191-192 keep the circle round with a hand-tuned PANEL_ASPECT
    = 1.11 stretching the x limits to the panel shape, which breaks as soon as the
    title, legend or caption changes height → coord_fixed(ratio=1) with symmetric
    limits. Likely cause: PANEL_ASPECT constant in scale_x_continuous limits.'
  - 'Suggestion: a short value scale or the range (e.g. 0-1 normalized) in the caption
    would let readers read the track bars as numbers, not only as relative heights.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold dark title "circos-basic · python · letsplot · anyplot.ai" top left (~64% width); bold dark chromosome labels Chr1–Chr8 outside the ring; one-row legend of eight swatches at the bottom in soft ink; small soft-ink caption bottom right ("Inner tracks, outer to inner: Expression, liver · Expression, brain | Ribbon width: Rearrangements"). All readable; caption small.
      Data: outer ring of eight arc segments with gaps, Chr1 in #009E73 then lavender, blue, ochre, red, cyan, rose, lime in Imprint order; two inner tracks of segment-colored bars on faint grey bands; ten translucent ribbons colored by source chromosome cross the interior, widths proportional to the counts.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and segment labels in light ink, legend text and caption in soft light grey; no dark-on-dark text.
      Data: segment, track and legend colors identical to the light render; track bands become subtle dark-grey bands; ribbons at the same alpha read darker against the near-black but stay distinguishable where they cross; brand green visible.
      Legibility verdict: PASS
