review:
  strengths:
  - 'Segment ring uses Imprint positions 1-8 in canonical order, identical in both
    themes, with #009E73 first'
  - Arc lengths follow the segment sizes with even 2° gaps, and quadrant-aware anchors
    keep every horizontal label clear of the ring
  - A caption names both data layers with units, so the inner GDP track is explained
    without a legend
  - Per-ribbon hovertext in the HTML view reports each flow's exact value
  - Column-constant header and a single Data block make the script easy to point at
    a new edge list
  weaknesses:
  - 'SC-02 (both): the ribbon ends start at r=0.80 and run across the inner track
    ring (0.60-0.78), and the track bars are drawn on top of them, so the GDP track
    reads as more ribbon ends instead of a separate ring (C4) → keep ribbons inside
    the track, e.g. ribbon_r below track_r_inner. Likely cause: ribbon_r = 0.80 above
    track_r_outer.'
  - 'SC-03 (both): ribbon end width is value / max_flow * segment_angles[i] * 0.3,
    so the same flow is wider at the larger segment and equal flows differ in width
    between segments (C2) → one angular width per unit of flow at both ends. Likely
    cause: the segment_angles factor in width_i / width_j.'
  - 'VQ-07 (both): ribbon fills are hex midpoints of the two segment colours (greys,
    olives, mauves) outside the Imprint palette and tied to neither segment → colour
    each ribbon by one of its segments (e.g. the source) at reduced opacity. Likely
    cause: the mix list comprehension.'
  - 'CQ-01 (code): two helper functions, arc_band and a bezier redefined inside the
    ribbon loop on every iteration → inline the polygon math or compute it vectorised
    in the loop body. Likely cause: def arc_band / def bezier.'
  image_description: |-
