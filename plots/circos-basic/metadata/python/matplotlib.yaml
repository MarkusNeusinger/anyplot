review:
  strengths:
  - Path with CURVE3 bezier codes and PathPatch build smooth ribbons whose width follows
    the synteny-block count
  - Full eight-position Imprint palette with one distinct color per chromosome, used
    consistently for segment, track bar, ribbon and legend swatch
  - Theme tokens threaded through title, labels, legend frame and caption; both renders
    read cleanly
  - Data zone with column constants and a tidy df; the plot code derives segments,
    spans and gaps from the data
  - Caption names what the outer ring, inner ring and ribbons encode
  weaknesses:
  - 'SC-02 (both): ribbon ends are anchored at r = 0.83, just inside the outer ring,
    so every ribbon crosses the inner expression track (r 0.70-0.82) and covers its
    bars at the anchor → anchor the ribbons inside the track ring, about r = 0.67
    (−0.16), so track and ribbons stay visually separate (C4). Likely cause: R_RIBBON
    = R_INNER - 0.02.'
  - 'CQ-01 (code): the helper function ring_sector (lines 109-114) breaks the Imports
    → Data → Plot → Save structure with no functions → draw the sectors inline. Likely
    cause: a helper written for the two ring loops.'
  - 'CQ-04 (code): lines 109-114 and the two ax.fill calls build annular sectors from
    50 sampled arc points by hand → mpatches.Wedge((0, 0), r_out, ends[i], starts[i],
    width=r_out - r_in) per segment and per track bar. Likely cause: the annulus written
    out instead of the available patch.'
  - 'Suggestion: anchor each ribbon on its own sub-span of the segment instead of
    the segment midpoint, so the four chr1 ribbons do not start on top of each other.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: title 'circos-basic · python · matplotlib · anyplot.ai' in dark ink at the top; bold chr1-chr8 labels around the circle; framed 'Chromosome' legend in 4 columns below the circle and an INK_SOFT caption 'Outer ring: Size (Mb) · inner ring: Expression level · ribbons: Synteny blocks' at the bottom. All readable.
      Data: outer ring of 8 segments with arc lengths by size (chr1 #009E73 largest down to chr8 #99B314 smallest), small gaps, a second ring of lighter bars with heights by expression, and 14 translucent bezier ribbons coloured by source segment crossing the interior. Ribbon ends sit just inside the outer ring and cross the inner track bars.
      Legibility verdict: PASS

