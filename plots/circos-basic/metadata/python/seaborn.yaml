review:
  strengths:
  - Ribbon ends are slotted contiguously inside each segment with width = value /
    total_flow x span, so every ribbon is proportional to its movers value and anchored
    on both cities
  - All eight Imprint positions in canonical order, one per city, used consistently
    for the ring, the rent track and the origin-colored ribbons; identical across
    both themes
  - Ribbons built as native matplotlib Path CURVE3 patches with alpha 0.45, so crossing
    flows stay distinguishable on both backgrounds
  - Theme tokens threaded through sns.set_theme rc, suptitle, labels and legend; both
    renders fully legible
  - Exact 2400x2400 canvas via figsize=(6,6), dpi=400 and subplots_adjust instead
    of bbox_inches='tight'
  weaknesses:
  - 'CQ-01 (code): two helper functions polar() (lines 140–143) and ring_sector()
    (lines 146–151) wrap a few numpy expressions → inline the radius*cos/sin points
    and the annular-sector fill at the call sites. Likely cause: geometry factored
    into functions instead of the flat Imports → Data → Plot → Save structure.'
  - 'Suggestion: print the dearest rent (Munich, 21.5 EUR/m2) in the legend caption
    so the track''s bar heights have a value reference.'
