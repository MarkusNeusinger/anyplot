review:
  strengths:
  - 'Correct circos structure: an outer ring of six segments with gaps, arc lengths
    proportional to each region''s combined trade flow'
  - Ribbons are translucent (alpha 0.45) and keep the source segment's color, so crossing
    ribbons stay distinguishable in both themes
  - Inner GDP-growth track is aligned with each segment's angular span and explained
    by a caption
  - 'Theme tokens threaded through title, labels, legend and caption: no dark-on-dark
    text in the dark render'
  - 'Adaptable-code zones are clean: column constants with roles, one Data block,
    the plot reads only df'
  weaknesses:
  - 'VQ-01 (both): the Europe and Africa segment labels render upside down (rotated
    about 180°) → upright, readable rotation for every label. Likely cause: the flip
    condition `if 90 < angle < 270` is wrong for tangential text rotated by `angle
    - 90`; flip when the label sits in the lower half (`np.sin(mid_angle) < 0`).'
  - 'VQ-03 (dark): the inner GDP track bars at alpha 0.4 nearly disappear on #1A1A17,
    the N. America bar is barely distinguishable from the background → a higher track
    alpha (about 0.6-0.7) so every bar reads in both themes. Likely cause: `p.patches(...,
    alpha=0.4)` for the track.'
  - 'VQ-05 (both): an empty band of about 350 px (about 15 % of the height) sits between
    the title and the top of the circle while the circle and legend crowd the lower
    part → center the circle and legend block vertically. Likely cause: the symmetric
    `y_range=(-LIMIT, LIMIT)` while the legend occupies y ≈ -1.27 to -1.53 only below
    the circle.'
  - 'CQ-01 (code): a nested `def bezier(a0, a1)` is defined inside the ribbon loop
    → inline the two curve computations, no function. Likely cause: the bezier helper
    inside the `for j` loop.'
  - 'Suggestion: bokeh''s native `annular_wedge` glyph could draw the segment ring
    and the track bars instead of hand-built polygons.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold title 'circos-basic · python · bokeh · anyplot.ai' in dark ink at top, about 55 % of the width; six segment labels in dark ink around the ring (Europe and Africa rotated upside down); caption 'Inner track: GDP growth (%)' and a 2x3 swatch legend in INK_SOFT below the circle. All text readable.
      Data: outer ring segments Asia #009E73, Europe #C475FD, N. America #4467A3, S. America #BD8233, Africa #AE3030, Oceania #2ABCCD with gaps; inner track bars in the same colors at alpha 0.4 of varying height; translucent ribbons colored by the lower-index region crossing the interior.
      Legibility verdict: PASS (Europe and Africa labels upside down but legible)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, segment labels light, caption and legend in light gray INK_SOFT; no dark-on-dark text. Same upside-down Europe and Africa labels.
      Data: data colors identical to the light render; ribbons read well; the inner track bars at alpha 0.4 are dim, the N. America bar barely separates from the background.
      Legibility verdict: PASS
