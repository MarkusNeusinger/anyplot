review:
  strengths:
  - Faithful custom circos/chord implementation built entirely from ECharts' declarative
    graphic primitives (ring, polygon, bezier-sampled ribbons) — a genuinely hard
    feat since ECharts has no native circos chart type.
  - 'Correct Imprint palette usage: first module (API Gateway) is brand green #009E73,
    remaining modules follow canonical palette order, and data colors are pixel-identical
    between light and dark renders.'
  - Inner coverage track now carries a clear legend (gradient swatch + caption) explaining
    what it encodes, resolving the attempt-1 weakness.
  - 'Visual hierarchy added: the 3 strongest connections are drawn last with brighter
    fill and a colored stroke, giving the reader a focal point instead of a uniform
    hairball, while width already encodes value via the chord-diagram angle allocation.'
  - 'Both renders are fully theme-correct with no dark-on-dark or light-on-light failures;
    backgrounds match #FAF8F1 / #1A1A17.'
  - Deterministic, realistic, neutral data (software module call graph with plausible
    calls/sec and coverage percentages).
  weaknesses:
  - With 16 ribbons still crossing the center, the emphasis on the top 3 connections
    helps but the plot remains visually busy — a brief callout or label on the single
    strongest connection would push storytelling further.
  - 'CQ-01 KISS: several geometry helper functions (arcPoints, quadBezierPoints, sectorPoints,
    ribbonPoints, hexToRgb, lerpColor) deviate from the plain imports->data->plot->save
    structure — justified here since ECharts has no native chord/circos primitive,
    but still a minor code-quality deduction relative to library-native implementations.'
  - Title sits around ~45% of plot width — comfortably inside the readable range,
    but on the low end; not a deduction, just noting there's headroom for a slightly
    larger title if desired.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "circos-basic · javascript · echarts · anyplot.ai" centered at top; a small gradient legend swatch with caption "Inner track: test coverage % (low -> high)" beneath it; eight module labels (API Gateway, Auth Service, Database, Cache Layer, Job Queue, Web UI, Analytics, Notifications) around the circle in dark ink text. All chrome text is clearly readable against the light background.
      Data: Outer ring uses 8 distinct Imprint colors in canonical order (API Gateway = brand green #009E73 first, then lavender, blue, ochre, matte red, cyan, rose, lime). Middle track is a green-to-blue imprint_seq gradient sized by each module's test-coverage %. Ribbons connect modules with width proportional to connection value; the 3 strongest connections are drawn on top with brighter fill and a colored outline, giving a visible focal point against the fainter weaker ribbons.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, legend caption, and module labels, now rendered in light/white text, fully legible against the dark background. No dark-on-dark failures observed.
      Data: Segment ring, coverage track, and ribbon colors are pixel-identical to the light render (only chrome flipped, as required) — the same brand green, lavender, blue, ochre, matte red, cyan, rose, and lime hues, and the same top-3 ribbon emphasis pattern.
      Legibility verdict: PASS
