review:
  strengths:
  - Faithful custom implementation of a circos/chord diagram entirely from ECharts'
    declarative `graphic` primitives (ring, polygon, bezier-sampled ribbons) — a genuinely
    difficult feat since ECharts has no native chord/circos chart type, and the library
    rules explicitly call for exactly this workaround.
  - 'Correct Imprint palette usage: the first module (API Gateway) renders as brand
    green #009E73, remaining modules follow canonical palette order (lavender, blue,
    ochre, matte red, cyan, rose, lime), and data colors are pixel-identical between
    light and dark renders.'
  - Inner coverage track correctly uses the imprint_seq (green→blue) continuous colormap
    for the coverage-percentage data via min-max normalization, in line with the style
    guide's continuous-data rule — no arbitrary gradient.
  - 'Both renders are fully theme-correct: warm off-white / near-black backgrounds,
    all title and module-label text clearly readable, no dark-on-dark or light-on-light
    failures.'
  - Angle allocation is chord-diagram-idiomatic — each module's arc span is proportional
    to its total connection value, with consistent 4° gaps for visual separation between
    segments.
  - Deterministic, self-contained, realistic data (a software module call graph with
    plausible calls/sec and test-coverage values) — neutral business/tech scenario.
  weaknesses:
  - The inner coverage track has no legend/label explaining what it encodes — a viewer
    can see a gradient ring but has no way to know it represents test-coverage percentage
    without reading the source; add a small legend entry or annotation identifying
    the track.
  - 'No visual hierarchy or storytelling emphasis: all 16 ribbons render at the same
    fixed opacity (0.5) regardless of connection strength or importance, so the busy
    center reads as a uniform ''hairball'' with no guided focal point — consider emphasizing
    the strongest 2-3 connections (higher opacity/thicker stroke, or a brief callout)
    to give the reader an entry point into the data.'
  - Design polish is solid but standard for a chord diagram (Imprint palette, subtle
    baseline ring, generous whitespace) without additional refinement beyond the expected
    default treatment — e.g. no subtle drop/inner shadow or refined hover-adjacent
    static cue that would push this toward publication-grade distinctiveness.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "circos-basic · javascript · echarts · anyplot.ai" in bold dark text, centered top, comfortably sized (~35% of canvas width, well under the 90% overflow threshold). Eight module labels (API Gateway, Auth Service, Database, Cache Layer, Job Queue, Web UI, Analytics, Notifications) arranged around the circle in dark ink text, all clearly legible with no overlap between adjacent labels. A thin light-gray baseline ring separates the coverage track from the ribbon area.
      Data: Outer ring segments in 8 distinct Imprint colors (API Gateway = brand green #009E73 first, then lavender, blue, ochre, matte red, cyan, rose, lime — canonical order). A middle track of green-to-blue gradient bars (imprint_seq) sized by each module's test-coverage percentage. Semi-transparent ribbons (opacity 0.5) connect modules, width proportional to connection value, colored by source module.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and eight module labels, now rendered in light/white text, fully legible against the dark background. No dark-on-dark failures — every label and the title are crisp and high-contrast. The baseline ring remains subtly visible.
      Data: Segment ring, coverage track, and ribbon colors are pixel-identical to the light render (same 8 Imprint hues, same imprint_seq gradient stops) — confirming only chrome (background, text) flipped between themes, as required. Ribbons remain distinguishable from the dark background at 0.5 opacity.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures observed.
