review:
  strengths:
  - 'Composes the native ChartsContainer + PiePlot API: two pie series with paddingAngle
    form the gapped outer segment ring (arc length follows Code size) and the concentric
    coverage track, and both line up with the segment spans'
  - A custom SVG overlay reads the drawing area through the useDrawingArea hook to
    place the ribbons and labels on the same geometry as the pie rings
  - Ribbon widths follow the call volume through one shared degrees-per-unit scale,
    every ribbon ends on the two segments it connects, and fill opacity 0.45 keeps
    crossing ribbons distinguishable in both themes
  - 'The coverage track uses the imprint_seq ramp and the header explains it with
    an inline gradient legend (58 to 95); segments use the Imprint palette in canonical
    order, starting at #009E73'
  - Segment labels are rotated radially and flipped on the left half so they never
    read upside down; all chrome uses the theme tokens and reads correctly in both
    renders
  weaknesses:
  - 'VQ-06 (both): the subtitle says ''inner track ∝ Test coverage (%)'', but the
    track encodes coverage by color on a fixed-thickness ring, not by size → describe
    it as color, for example ''inner track color = Test coverage (%)''. Likely cause:
    the SUBTITLE template string.'
  - 'Suggestion: the green-to-blue imprint_seq track colors match the categorical
    colors of Gateway (#009E73) and Catalog (blue), so Inventory''s track reads like
    a Gateway element. Radial bar heights on the track would keep color reserved for
    segment identity.'
  - 'Suggestion: about 120 px of empty space between the header legend and the top
    labels, plus a similar band below ''Orders'', could go to a slightly larger circle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas.
      Chrome: top-left title "circos-basic · javascript · muix · anyplot.ai" in bold dark ink, a gray subtitle explaining the encodings, and an inline legend "Test coverage (%): 58 [green→blue gradient] 95". Bold dark segment labels (Gateway, Auth, Catalog, Orders, Payments, Inventory, Notify, Analytics) are rotated radially around the ring. Everything is readable.
      Data: the outer ring has 8 gapped segments in Imprint order (Gateway #009E73 green, Auth purple, Catalog blue, Orders ochre, Payments red, Inventory cyan, Notify mauve, Analytics olive), with arc length set by code size (Orders the longest, Notify the shortest). Inside it is a thicker coverage track colored on the green-to-blue sequential ramp. 23 translucent ribbons, colored by their source segment, cross the interior with widths proportional to the flow. The Gateway fan-out is the dominant green bundle, and thin ribbons stay visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and labels flip to light ink and the subtitle to a light gray; all of it reads well. No dark-on-dark text anywhere.
      Data: segment and track colors are identical to the light render. The ribbons keep the same hues at the same opacity and look darker over the dark page, but they stay distinguishable where they cross. The brand green reads clearly.
      Legibility verdict: PASS
