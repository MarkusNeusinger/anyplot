review:
  strengths:
  - 'Composes MUI X natively: two community pie series (paddingAngle gaps, innerRadius/outerRadius)
    form the segment ring and the coverage track, and a custom SVG overlay placed
    with the useDrawingArea hook draws the ribbons inside the same ChartsContainer'
  - Outer ring arc lengths follow segment code size, and ribbon width is proportional
    to API call volume through one shared degrees-per-unit scale, so both ends of
    each ribbon have the same width and sit inside the two segments they connect
  - 'Every segment takes one Imprint palette color, starting with brand green #009E73
    for Gateway, and the ribbons take their source segment''s color at 0.45 fill opacity,
    so crossings stay readable in both themes'
  - The inner coverage track uses the imprint_seq ramp (t.seq), lines up with each
    segment's span and gap, and a compact gradient legend in the header explains it
  - A subtitle under the title states every encoding (ribbon width, ring size, track
    color), and the header sets a clear title, subtitle, and legend hierarchy
  - Realistic, neutral microservice scenario (8 services, 23 call flows) with plausible
    kLOC and coverage values; skipAnimation is set and the data block follows the
    adaptable-code layout
  weaknesses:
  - 'Suggestion: the imprint_seq ramp of the coverage track starts at the same brand
    green as Gateway''s segment color, so a low-coverage track (Inventory) briefly
    reads as another segment color; a slightly thinner track or a thin ink outline
    would separate the two encodings more clearly.'
  - 'Suggestion: near-vertical radial labels (Orders, Analytics, Gateway) could be
    drawn tangentially or flipped to read left to right more easily.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
      Chrome: title "circos-basic · javascript · muix · anyplot.ai" in bold dark ink at the top left (~46% of width), a soft-ink subtitle explaining the encodings, and a "Test coverage (%): 58 [green→blue gradient] 95" legend row. Eight bold dark segment labels (Gateway, Auth, Catalog, Orders, Payments, Inventory, Notify, Analytics) are placed radially outside the ring. All text is readable.
      Data: an outer ring of 8 segments with gaps, arc lengths following code size (Orders and Catalog largest, Notify smallest), colored with the Imprint palette (Gateway #009E73, Auth purple, Catalog blue, Orders ochre, Payments red, Inventory cyan, Notify mauve, Analytics olive). Inside it, a thicker coverage track per segment, colored green→blue by coverage and aligned with the segment spans. Translucent ribbons in the source segment's color cross the interior, with widths following call volume (Gateway→Auth widest). Ribbons stay distinguishable where they overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend label and segment labels all switch to light ink and read clearly; no dark-on-dark text.
      Data: segment, track and ribbon colors match the light render; only the translucent ribbons look darker because they blend with the dark page. The ribbons stay visible and distinguishable, and brand green is clearly visible.
      Legibility verdict: PASS
