review:
  strengths:
  - 'Correct Imprint palette throughout: first segment is brand green #009E73, remaining
    segments follow canonical order, coverage track correctly uses imprint_seq — verified
    identical across both themes.'
  - 'Clever engineering: reuses MUI X''s actual d3 pie() layout (via two real PiePlot
    series) to render both rings, and mathematically reconciles the resulting angles
    with the hand-drawn ribbon geometry so everything lines up exactly — a resourceful
    way to work around the community package''s missing chord/ribbon mark.'
  - 'All three plot layers required by the spec are present and correctly encoded:
    segments (sized by code size), ribbons (widths by call volume), and a concentric
    test-coverage track.'
  - Clean, deterministic, realistic dataset with genuine variation across every dimension.
  - Title format and legend documentation exactly match spec requirements.
  weaknesses:
  - Dense chord crossings near the circle's center create visual muddiness where multiple
    translucent ribbons overlap — consider slightly lower ribbon opacity or curvature
    tuning to reduce clutter in the busiest region.
  - No explicit visual emphasis singles out an insight (e.g., the highest-volume connection
    or the lowest-coverage service) — a small callout or subtle highlight would strengthen
    data storytelling (DE-03).
  - Segment label font size (15px) is on the smaller side relative to the 2400px canvas;
    could be nudged up slightly for stronger mobile legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title ("circos-basic · javascript · muix · anyplot.ai"), italic subtitle explaining the ribbon/ring/track encoding, and a small gradient legend ("Test coverage track: 58% -> 95%") are all dark ink and clearly readable. Radially rotated segment-name labels (Gateway, Auth, Catalog, Orders, Payments, Inventory, Notify, Analytics) sit just outside the outer ring and are fully legible.
      Data: Eight outer-ring segments in distinct Imprint hues, first segment (Gateway) is brand green #009E73. A green->blue sequential gradient track (imprint_seq) sits just inside the outer ring, encoding test coverage. 21 translucent ribbons (colored by source segment, width proportional to call volume) connect segments through the center.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/segment labels, now rendered in light-colored text against the dark background. No dark-on-dark failures observed — every label, including the small legend percentages, is clearly legible.
      Data: Segment colors, ribbon colors, and the coverage-track gradient are identical to the light render — only the chrome (background + text) flipped, as required.
      Legibility verdict: PASS
