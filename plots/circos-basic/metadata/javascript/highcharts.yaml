review:
  strengths:
  - Fully hand-drawn circos/chord diagram built from Highcharts' raw SVG renderer
    (chart.renderer.path/text/rect) since no dependency-wheel/chord module is loaded
    — arcs, ribbons, and a second concentric data track are all correctly geometry-computed
    with consistent inter-segment gaps.
  - 'Correct Imprint palette application: Gateway is #009E73 (always-first brand green)
    and the remaining 7 modules follow the canonical Imprint order exactly (lavender,
    blue, ochre, matte red, cyan, rose, lime); the latency track correctly uses the
    imprint_seq gradient (t.seq[0] -> t.seq[1]) for single-polarity continuous data.'
  - 'Genuine two-dimensional storytelling: ribbon width and outer-ring arc length
    encode call volume while the inner ring''s color encodes average latency, and
    the result instantly reveals Gateway as the dominant hub of the microservice graph.'
  - Clean, deterministic, realistic microservices dataset (call volumes 5-42 K/day,
    latencies 25-120ms) with meaningful variation across both dimensions and no external
    network calls.
  - 'Theme-correct chrome in both renders: identical data colors between light/dark,
    backgrounds match #FAF8F1/#1A1A17, all text flips to remain readable, credits
    watermark disabled, animation disabled for clean screenshots.'
  weaknesses:
  - Inner latency track ring is fairly thin (~15% of radius) and its teal-to-blue-grey
    gradient is subtle against the similarly-toned ribbons directly behind it -- widening
    the ring slightly or adding a thin page-background gap between the ribbon layer
    and the track would make the second data dimension read more clearly at a glance.
  - Ribbons converge into a slightly muddy blended-color cluster near the circle's
    center where many chords cross -- lowering ribbon opacity a bit further at dense
    crossing points, or drawing higher-value ribbons after (on top of) lower-value
    ones, would keep the hub area more legible.
  - Geometry is built with four helper functions (polar, wedgePath, ribbonPath, lerpColor)
    rather than pure top-to-bottom script flow -- justified by the custom-drawn chart
    type, but still a KISS-structure deduction versus a flat script.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "circos-basic · javascript · highcharts · anyplot.ai" in bold dark ink, fully readable. Subtitle "Outer ring & ribbons: call volume (K/day) · Inner ring: avg. latency (ms)" in softer dark-grey ink, readable. Eight module labels (Gateway, Auth, Users, Orders, Payments, Inventory, Search, Notify) rendered in dark text, rotated to follow the circle and flipped to stay upright on the left half -- all legible. Bottom color-scale legend ("Avg. latency per module", "25 ms", "120 ms") in dark-grey text, fully visible near the bottom edge with no clipping.
      Data: Eight outer-ring wedges in the Imprint palette (Gateway=#009E73 green first, then lavender/Auth, blue/Users, ochre/Orders, matte red/Payments, cyan/Inventory, rose/Search, lime/Notify -- exact canonical order). Semi-transparent ribbons in matching source-module colors connect segments through the center, width proportional to connection value. A thin inner ring shows a teal-to-blue-grey gradient encoding average latency per module.
      Legibility verdict: PASS -- all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title and subtitle both flip to light/white text, fully readable against the dark background. All eight module labels render in white text, clearly legible with no dark-on-dark failures. Bottom legend text also flips to light grey, fully readable.
      Data: All ribbon and outer-ring colors are pixel-identical to the light render (verified by hue/position match for all 8 modules) -- only the chrome (background, title, subtitle, labels, legend text) flipped. Brand green (#009E73, Gateway) remains clearly visible and vivid on the dark surface.
      Legibility verdict: PASS -- no dark-on-dark text; all chrome elements correctly flipped while data colors stayed constant.
