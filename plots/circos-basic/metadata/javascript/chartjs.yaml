review:
  strengths:
  - Chromosome segment lengths (248, 242, 198, 190, 181, 170, 159, 145 Mb) match the
    real human chr1-chr8 karyotype, and structural-variant read counts and log2FC
    expression values fall in realistic ranges for genomic data
  - 'Correct Imprint palette usage: Chr1 is #009E73, segments follow canonical order,
    and the differential-expression track correctly uses the diverging imprint_div
    colormap (appropriate given the signed log2FC data has a meaningful zero midpoint)'
  - 'Genuinely creative use of the Chart.js plugin API: circosRibbons reads the live
    doughnut-arc geometry (start/end angles, inner radius) from getDatasetMeta() to
    draw proportionally-sized ribbons bowing through the centre - a technique that
    could not be replicated with basic Chart.js configuration, and the only viable
    path since Chart.js has no native circos/chord type'
  - Exact mandated title format, clear bottom legend, well-utilized canvas, correct
    theme-adaptive chrome and identical data colors in both light and dark renders,
    no edge clipping
  weaknesses:
  - The centre ribbon area is visually dense with many overlapping semi-transparent
    ribbons, making individual connections hard to trace and reducing overall polish
    - consider capping simultaneous overlap opacity, adding a subtle sort/layering
    strategy, or thinning the lowest-value ribbons so crossings read more cleanly
  - No single connection or segment is emphasized as a focal point - the highest-value
    link (Chr2–Chr4, 55 reads) reads the same visual weight as the rest; a distinct
    stroke or slightly higher opacity on the top 1-2 links would give the plot a clearer
    story
  - Thinnest ribbons (value=8, e.g. Chr1–Chr7) risk getting visually lost under denser
    overlapping ribbons - consider a small minimum ribbon width/opacity floor so low-value
    links stay legible
  - The custom ribbon-drawing plugin and small color-math helpers (hexToRgb/rgbToHex/lerpRgb)
    add function-based structure beyond the simplest KISS script shape - necessary
    here since Chart.js has no native circos/chord chart type, but keep an eye on
    whether any of it can be simplified further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "circos-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top, clearly legible. Bottom legend (Chr1-Chr8) with colored swatches, dark readable text. All chrome text is dark-on-light and fully readable.
      Data: Outer ring shows 8 chromosome segments in 8 distinct Imprint hues, first segment (Chr1) is brand green #009E73, arc widths proportional to chromosome size (Mb), thin light-colored gaps between segments. A second concentric ring (differential expression track) sits just inside, colored with the diverging imprint_div colormap (muted red-to-blue depending on sign of log2FC). Ribbons bow through the centre connecting segments, colored by the dominant node's segment hue at ~50% alpha, width proportional to link value. Data colors read clearly against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title and legend text render in light/white ink, clearly legible against the dark background. No dark-on-dark text found anywhere (title, legend, or any other chrome element).
      Data: Segment colors, track colors, and ribbon colors are visually identical to the light render - only the background and text chrome flipped as expected. Brand green Chr1 segment still reads clearly on the dark surface.
      Legibility verdict: PASS
