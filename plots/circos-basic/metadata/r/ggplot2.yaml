review:
  strengths:
  - 'Correct Imprint palette usage: first series is #009E73, and all 7 segment colors
    follow canonical palette order 1-7, identical between light and dark renders'
  - Genuinely custom circos geometry (bezier ribbon chords, arc polygons, angular
    gap spacing) built entirely from ggplot2 primitives despite the library having
    no native chord/circos support
  - Segment labels are flipped upright on the left hemisphere of the circle so no
    text renders upside-down
  - Ribbon widths and segment arc spans are proportional to the underlying flow values,
    matching the spec's core requirement
  - Diverging track ring adds a genuine second data layer (net trade balance) using
    a red-neutral-blue ramp consistent with the Imprint diverging scheme
  - theme_void() + PAGE_BG-colored polygon borders + generous margins give a clean,
    chartjunk-free composition in both themes
  weaknesses:
  - 'The thin inner track ring encodes net trade balance via a diverging red-cream/black-blue
    ramp, but there is no legend or caption anywhere on the plot explaining this —
    a first-time viewer cannot decode the second data layer without reading the source
    code. Add a small legend/caption, e.g. ''Inner ring: net trade balance (red =
    deficit, blue = surplus)''.'
  - Dense ribbon overlap near the circle's center (alpha = 0.55, 18 chords) creates
    muddy alpha-blended patches where 3+ ribbons cross, making individual connections
    hard to trace through the middle. Consider a slightly lower alpha (~0.4-0.45)
    or drawing order tuned by value to reduce clutter.
  - The script relies on several custom geometry helper functions (deg2rad, arc_path,
    bezier_path, polar_xy, ribbon_polygon, net_to_color) that depart from the simple
    Imports -> Data -> Plot -> Save structure — largely unavoidable since ggplot2
    has no native circos support, but still worth flagging for KISS scoring.
  - The descriptive-prefixed title already spans roughly 85-88% of the plot width
    at the current auto-scaled font size; there is little headroom left before it
    would start to look crowded for a longer spec-id or language name.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Inter-regional Trade Flows · circos-basic · r · ggplot2 · anyplot.ai" renders in dark ink, centered at the top, fully visible with no clipping. The 7 region labels (North America, Latin America, Europe, Africa, South Asia, East Asia, Oceania) are dark ink, rotated tangentially around the ring, flipped upright on the left hemisphere for legibility.
      Data: Outer ring shows 7 distinctly colored segments (green North America, lavender/purple Latin America, blue Europe, ochre Africa, red South Asia, cyan East Asia, rose/plum Oceania) — first series is #009E73 (brand green) as required. A thinner pastel "track" ring sits just inside the segment ring, colored by a red-cream-blue diverging scale representing net trade balance. Semi-transparent bezier ribbons fill the interior, colored by source segment, with width proportional to flow value.
      Legibility verdict: PASS — all title and label text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and all 7 region labels render in light ink, clearly legible against the dark background. No dark-on-dark failures observed anywhere (title, labels all light-colored).
      Data: The 7 segment colors and ribbon colors are visually identical to the light render (same green/lavender/blue/ochre/red/cyan/rose hues) — only the chrome (background, ink, and the track ring's diverging midpoint, which uses PAGE_BG) flipped between themes, matching the spec's theme-adaptive chrome requirement.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or light-on-light issues found.
