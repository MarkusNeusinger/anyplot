review:
  strengths:
  - 'Both attempt-1 weaknesses are fixed: a caption now explains the diverging inner
    track ring ("red = deficit, cream = balanced, blue = surplus"), and ribbon alpha
    was lowered from 0.55 to 0.42 with explicit largest-value-first draw order, noticeably
    reducing the muddy crossing zone at the circle''s center'
  - 'Correct Imprint palette usage: first segment (North America) is exactly #009E73,
    all 7 segments follow canonical order 1-7, and colors are pixel-identical between
    light and dark renders — only chrome flips'
  - Genuinely custom circos geometry (bezier ribbon chords, arc polygons, angular
    gap spacing, sub-arc allocation proportional to per-connection value) built entirely
    from ggplot2 primitives, despite the library having no native chord/circos support
  - 'Diverging track ring correctly implements the imprint_div spec: colorRamp(c(''#AE3030'',
    PAGE_BG, ''#4467A3'')) uses the theme-adaptive midpoint exactly as prescribed
    by the style guide'
  - Segment labels are flipped upright on the left hemisphere so no text ever renders
    upside-down, and title fontsize auto-scales with title length via the prescribed
    linear formula
  - theme_void() + PAGE_BG-colored polygon borders + generous margins give a clean,
    chartjunk-free composition; no clipping at any canvas edge in either theme
  weaknesses:
  - Several custom geometry helper functions (deg2rad, arc_path, bezier_path, polar_xy,
    ribbon_polygon) depart from the simple Imports -> Data -> Plot -> Save structure
    — largely unavoidable given ggplot2 has no native circos/chord support, but still
    a KISS deduction
  - The bezier-curve chord approximation (quadratic bezier through the circle center)
    is a common cross-library technique for faking chord diagrams rather than a distinctive
    ggplot2-specific feature, capping Library Mastery
  - With 18 connections funneling through the circle's center, a few thin low-value
    ribbons are still hard to trace individually even with the improved alpha and
    draw order — acceptable but not perfect
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Inter-regional Trade Flows · circos-basic · r · ggplot2 · anyplot.ai" renders in dark ink at the top, fully visible with generous margin to the canvas edge (verified via edge crop). Seven segment labels (North America, Latin America, Europe, Africa, South Asia, East Asia, Oceania) render in dark ink, rotated tangentially and flipped upright on the left hemisphere for legibility. Caption "Inner ring: net trade balance (red = deficit, cream = balanced, blue = surplus)" renders in soft gray ink at the bottom, fully visible with margin below it.
      Data: Seven distinctly colored outer-ring segments (green North America = #009E73, lavender Latin America, blue Europe, ochre Africa, red South Asia, cyan East Asia, rose Oceania). A thinner track ring inside the segment ring is colored on a red-cream-blue diverging scale representing net trade balance. Semi-transparent bezier ribbons (alpha 0.42) fill the interior, colored by source segment, width proportional to flow value.
      Legibility verdict: PASS — all text (title, 7 labels, caption) is clearly readable against the light background; no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and all 7 region labels render in light ink, clearly legible against the dark background — no dark-on-dark failures anywhere. Caption renders in light gray ink, fully visible.
      Data: The 7 segment/ribbon colors are pixel-identical to the light render (same green/lavender/blue/ochre/red/cyan/rose hues) — only chrome (background, ink, and the track ring's diverging midpoint, which uses PAGE_BG per the imprint_div spec) flips between themes.
      Legibility verdict: PASS — both renders pass the theme-readability checklist; brand green is visible and identical in both themes.
