review:
  strengths:
  - Implements a from-scratch binned-beeswarm jitter algorithm since ECharts has no
    native SHAP/beeswarm chart type — a genuinely distinctive use of the library (visualMap
    continuous dimension-coloring + customValues pseudo-categorical value-axis + markLine)
  - Feature ordering by descending mean |SHAP| (most important at top) exactly matches
    the spec
  - 'Diverging blue-white/black-red color scale matches imprint_div exactly (#4467A3
    / theme-adaptive midpoint / #AE3030), and each feature''s color direction correctly
    reflects its real-world relationship (e.g. high Distance to Center -> red -> negative
    SHAP; high Living Area -> red -> positive SHAP)'
  - Floor Level is deliberately modeled with a non-linear effect (both very low and
    very high floors hurt price) — strong DQ-01 feature coverage beyond simple linear
    relationships
  - Deterministic LCG + Box-Muller PRNG (seed=42), clean KISS-style code with no fake
    interactivity
  - Vertical dashed reference line at x=0 present in both renders; both themes are
    chrome-correct with identical data colors and fully readable text
  weaknesses:
  - Uniform marker size/opacity (symbolSize 8, opacity 0.72) across all rows causes
    heavy overlap in dense discrete-valued features (Has Balcony, Bathrooms, Energy
    Rating) where only a few unique feature values exist — reduce symbolSize (~6)
    or opacity for these rows, or widen the jitter band, to keep the beeswarm readable
    at high density
  - The colorbar legend labels only 'High'/'Low' with no title — a first-time viewer
    has to infer this encodes the feature value (not the SHAP value); adding a short
    label such as 'Feature value' above the colorbar would remove that ambiguity
  - Data storytelling relies entirely on the implicit top-to-bottom importance ordering;
    no visual emphasis (e.g. a subtle callout or highlighted focal point) draws the
    eye to the single most impactful feature/pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) across the full canvas — not pure white.
      Chrome: Title "shap-summary · javascript · echarts · anyplot.ai" in dark ink, centered, ~45% of width. X-axis title "SHAP value (impact on predicted price, USD)" clearly readable below the axis with units. Y-axis shows 9 feature names ("Living Area (sqm)" down to "Has Balcony"), ordered by importance. Light gray gridlines are subtle but visible. A dashed vertical reference line marks x=0. A vertical diverging colorbar on the right reads "High" (red) at top, "Low" (blue) at bottom.
      Data: Each feature row is a horizontal beeswarm of ~260 dots, colored on a blue-white-red diverging scale by the feature's own (normalized) value. Color direction is semantically correct per feature (e.g. high Living Area -> red dots on the positive/right side; high Distance to Center -> red dots on the negative/left side).
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) across the full canvas — not pure black.
      Chrome: Same title, axis titles, and 9 feature labels now rendered in light ink/soft-gray, fully legible against the dark background. Gridlines are a dim gray, still visible without dominating. The dashed zero-reference line and colorbar remain in the same position with light-colored ancillary text ("High"/"Low").
      Data: The blue-white-red diverging point colors are identical to the light render (only the chrome — background, gridlines, text — flips); the diverging scale's midpoint correctly shifts to the dark background tone rather than staying white.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data markers are clearly distinguishable from the near-black background.
