review:
  strengths:
  - Hand-rolled beeswarm collision-avoidance layout in idiomatic D3 (no off-the-shelf
    helper) produces a clean, mostly non-overlapping swarm per feature row
  - Manually built SVG linearGradient legend, correctly oriented (High at top/blue,
    Low at bottom/green) — a distinctive polish touch beyond the library skeleton
  - 'Full theme-adaptive chrome in both renders: backgrounds, ink, grid, and axis
    colors all correctly sourced from ANYPLOT_TOKENS with no dark-on-dark or light-on-light
    issues'
  - Deterministic, realistic used-car resale-price dataset with per-feature slopes
    and noise producing plausible, non-trivial SHAP distributions
  - Correctly sorts features by mean |SHAP value|, includes the dashed zero-reference
    line, and labels the x-axis with units (USD)
  weaknesses:
  - Feature-value legend uses the Imprint sequential ramp (green -> blue) rather than
    the diverging blue-red convention the spec's Notes explicitly call out for SHAP
    summary plots; imprint_div (red <-> neutral <-> blue) would satisfy both the spec's
    domain-convention ask and the no-custom-color rule while still reading as low-to-high.
  - In layoutSwarm, when maxSteps is exhausted the point falls back to a fixed halfSpan
    offset without re-checking for collisions, which can occasionally let two dots
    touch in the densest clusters (e.g. the binary 'Prior Accidents' row) — a wider
    row height or a second collision-relaxation pass would close this edge case.
  - colorFor is called as raw d3.interpolateRgbBasis(t.seq) fed a manually pre-normalized
    0-1 value instead of the documented d3.scaleSequential(...).domain([min,max])
    wrapper from prompts/library/d3.md — functionally equivalent here but diverges
    from the documented pattern.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching the required #FAF8F1 surface — not pure white.
      Chrome: Title "Used Car Resale Price · shap-summary · javascript · d3 · anyplot.ai" in bold dark ink, subtitle "Features ranked by mean |SHAP value| — gradient boosting model, n = 170 samples" in softer ink below it. Y-axis lists 8 features (Car Age, Prior Accidents, Brand Prestige Score, Mileage, Engine Size, Horsepower, Fuel Efficiency, Previous Owners) ordered top-to-bottom by importance. X-axis "SHAP value (impact on predicted resale price, USD)" with numeric ticks from -4,000 to 4,000. A dashed vertical zero-reference line runs through all rows. A vertical gradient color-bar legend at the right reads "Feature value" with "High" (blue) at top and "Low" (green) at bottom. All chrome text is clearly legible against the light background — no light-on-light issues.
      Data: Each row is a beeswarm of ~170 dots colored on a continuous green (low)-to-blue (high) Imprint sequential scale representing the underlying feature value, positioned horizontally by SHAP value. Points cluster tightly but stay individually distinguishable; binary "Prior Accidents" splits into two clear left/right clumps by color.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching the required #1A1A17 surface — not pure black.
      Chrome: Same title/subtitle now in light ink (title white/near-white, subtitle in the lighter secondary-text tone), tick labels and axis text switched to light-on-dark, dashed zero line rendered in light gray, gradient legend swatch and "High"/"Low"/"Feature value" text all rendered in light ink. No dark-on-dark failures observed — every text element is clearly readable against the near-black surface.
      Data: Data point colors (the green-to-blue feature-value gradient) are visually identical to the light render — only the chrome (background, text, axis lines) flipped, exactly as required.
      Legibility verdict: PASS.
