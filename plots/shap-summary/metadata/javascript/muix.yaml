review:
  strengths:
  - Beeswarm layout keeps every dot at its exact SHAP value on x and only offsets
    it vertically within its own row (±0.4 row height), so density piles up honestly
    and rows never bleed into each other
  - Features are sorted by computed mean |SHAP| (not a typed order), top-20 cap via
    MAX_FEATURES matches the Notes, and the dashed zero reference line (ChartsReferenceLine,
    inkSoft) sits under the dots in both themes
  - Color uses the Imprint diverging endpoints (div[2] blue → div[0] red) through
    a zAxis continuous colorMap, so mid-scale purple dots stay visible on both page
    colors; ContinuousColorLegend with Low/High extremes and a 'Feature value' title
    acts as the color bar
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + ChartsWrapper + ChartsSurface
    with ScatterPlot, ChartsGrid (vertical only), axes and an HTML legend in the wrapper''s
    legend grid area; skipAnimation set'
  - Signed tick formatter (+0.10 / -0.10) and a two-tier header (ink title, inkSoft
    subtitle that explains the encoding) give a clear typographic hierarchy
  - Plausible churn-model scenario with feature names in real units and a deterministic
    LCG with Box-Muller noise
  weaknesses:
  - 'Suggestion: one feature with a non-monotonic or bimodal effect (e.g. both low
    and high values pushing churn up) would showcase the interaction/non-linearity
    reading the spec''s Applications describe.'
  - 'Suggestion: the vertical grid at every 0.05 (23 lines) could be thinned to every
    0.10 so the dots carry more of the visual weight.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "shap-summary · javascript · muix · anyplot.ai" centred at top with a grey subtitle explaining samples/features/ranking/color; 9 feature names on the y axis in dark ink (Support tickets (30 d) at top down to Onboarding sessions); x ticks -0.55 … +0.55 with signed labels; x-axis title "SHAP value (impact on churn risk)"; subtle vertical grid; L-shaped axis lines. All readable.
      Data: 80 dots per row in a beeswarm, colored from Imprint blue (#4467A3, low) through purple to matte red (#AE3030, high); dashed vertical zero line visible behind the dots; top rows widely spread, bottom rows clumped near zero. Vertical color bar on the right titled "Feature value" with High (red, top) / Low (blue, bottom). Single continuous encoding, so no categorical #009E73 series applies.
