review:
  strengths:
  - Custom pixel-space collision-avoidance beeswarm layout fans overlapping points
    vertically per feature row, producing the canonical SHAP-summary swarm silhouette
    instead of a naive jittered scatter.
  - Correct sort order (descending mean |SHAP value|, most important feature at top)
    and a dashed ChartsReferenceLine at x=0 clearly separating positive/negative impact,
    exactly as the spec notes ask.
  - 'Theme-adaptive chrome is clean in both renders: correct #FAF8F1/#1A1A17 backgrounds,
    no clipped or overlapping text, canvas at the exact 3200x1800 target.'
  - 'Idiomatic, distinctive MUI X usage: continuous zAxis colorMap plus ContinuousColorLegend
    for the feature-value encoding, rather than faking a colorbar.'
  weaknesses:
  - 'Feature-value color encoding uses the sequential Imprint scale (t.seq: brand
    green -> blue) instead of the blue-to-red convention the spec states twice (Description:
    ''colored by the feature''s value (typically low=blue to high=red)''; Notes: ''Use
    diverging color scale (blue-red)''). This is the standard SHAP-plot color convention
    and the sibling chartjs.js implementation for this same spec already gets it right
    using t.div (t.div[2] for low/blue, t.div[0] for high/red). Fix: change the zAxis
    colorMap.color stops from [t.seq[0], t.seq[1]] to [t.div[2], t.div[0]] so low
    feature values read blue and high values read red; keep the min/max domain mapping
    unchanged.'
  - Because green and blue are both cool hues, the current low/high color contrast
    is noticeably weaker than the mandated blue-red scale would give -- at a glance
    it is harder to tell which dots are 'high' feature value, undermining the plot's
    core interpretability purpose.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "shap-summary · javascript · muix · anyplot.ai" is bold, dark, centered, fully readable. X-axis label "SHAP value (impact on predicted churn risk)" and 9 y-axis feature names (Support Tickets (30d) down to Onboarding Sessions) render in dark-ink and soft-ink respectively, all legible. Subtle vertical grid lines at each 0.05 tick. Dashed reference line at x=0 in soft ink. "Feature value" legend title plus a vertical continuous color bar labeled "Low"/"High" sits at the right margin.
      Data: Beeswarm scatter of ~720 dots (80 samples x 9 features), each dot colored along a green-to-blue continuous scale keyed to that sample's normalized feature value. Points fan out vertically within each feature row to avoid overlap; density increases near x=0 for lower-importance features, as expected. No red is present anywhere in the color scale.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis labels, and 9 feature names now render in light ink / soft light-gray ink, fully legible against the dark surface. Grid lines and the x=0 reference line are visible but subtle (white dashed line, not overpowering). Legend title and Low/High labels are legible light text.
      Data: Same beeswarm layout and the SAME green-to-blue data colors as the light render (colors are identical between themes -- only chrome flipped), confirming the marks are theme-invariant as required.
      Legibility verdict: PASS -- no dark-on-dark failures; all text/tick labels are clearly visible against the dark background.

    Cross-render color-encoding note: both renders confirm the low/high feature-value scale is sequential green->blue (Imprint imprint_seq), not the blue->red diverging scale the specification explicitly requests twice (Description + Notes). This is a spec-compliance and readability issue, not a theme-legibility issue -- flagged separately in review_weaknesses.json.
