review:
  strengths:
  - 'Correct SHAP-summary semantics: features sorted by mean |SHAP value| with the
    most important at top, per-sample beeswarm dots jittered vertically, and a black
    zero-impact reference line drawn via a custom Chart.js plugin'
  - Custom canvas-drawn diverging colorbar legend (Low -> High, labeled 'Feature value')
    fills the gap Chart.js has no built-in colorbar for -- a genuinely idiomatic use
    of the plugin API (afterDraw/afterDatasetsDraw hooks) rather than a generic scatter
    config
  - Data is fully deterministic (fixed-seed LCG) and models a realistic, neutral loan-default
    scenario where every feature's SHAP direction is factually sensible (higher credit
    score -> lower risk, higher DTI/utilization/late-payments -> higher risk, longer
    employment -> lower risk)
  - 'Explicit font sizes throughout (title 22px, axis title 16px, ticks 14px), theme-adaptive
    chrome correctly threaded through both renders, background colors match #FAF8F1
    / #1A1A17 exactly, spines removed for a clean minimal frame'
  - Top-10 feature trim and a mild non-linear kink baked into 3 features (utilization,
    late payments, recent inquiries) directly reflect the spec's 'detect non-linear
    relationships' and 'top 10-20 features' guidance
  weaknesses:
  - 'Diverging colorbar midpoint (t.div[1]) is set by the render harness to exactly
    the page background color (#FAF8F1 light / #1A1A17 dark). valueToColor() blends
    toward that midpoint for feature values near 0.5, so points in the mid-range render
    at very low contrast against the plot background in both themes -- especially
    visible in rows like ''Loan amount'' and ''Employment length'' where pale dots
    are hard to distinguish from the surface. Add a thin pointBorderColor (e.g. t.inkSoft
    or t.grid) with pointBorderWidth: 1 so every dot keeps a visible edge regardless
    of fill color -- the style guide''s ''optional outline pattern'' is the recommended
    fix for exactly this case.'
  - The vertical jitter is uniform random rather than density-packed, so within a
    feature row dots can still coincide fairly densely near x=0 (e.g. 'Applicant age',
    'Recent credit inquiries'); a narrower jitter range or slightly smaller marker
    radius at high local density would read closer to a true beeswarm pack.
  - 'Design excellence is solid but stops short of publication-grade: the row separator
    gridlines add a bit of visual noise that a subtler (or omitted) horizontal grid
    would remove, and the color legend''s ''Low''/''High'' labels could be tied more
    explicitly to the y-axis-adjacent color meaning for readers unfamiliar with SHAP
    plots.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold black title "shap-summary · javascript · chartjs · anyplot.ai" centered at top, fully readable. Y-axis lists 10 feature names (Credit score down to Applicant age) in dark gray, all legible with no overlap. X-axis "SHAP value (impact on model output)" in dark ink with tick labels -0.6 to 0.6 in medium gray. Subtle light-gray vertical gridlines and horizontal row separators. A bold dark vertical zero-reference line cuts through all rows. A custom diverging colorbar legend (blue -> white -> red, labeled "Low"/"High"/"Feature value") sits in the top-right whitespace, not overlapping the title or data.
      Data: Beeswarm dot swarms per feature row, colored on a blue(low)-to-red(high) diverging scale keyed to each sample's normalized feature value. Rows are sorted top-to-bottom by importance (Credit score most important, Applicant age least). Dots near the diverging midpoint (feature value ~0.5) render pale/low-contrast against the cream background -- visible but harder to distinguish than the saturated blue/red extremes.
      Legibility verdict: PASS (all text readable; the only issue is data-marker contrast for mid-range values, not text legibility).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title now in light off-white, fully readable against the dark surface. Y-axis feature names in light gray, X-axis title and ticks in light gray, all clearly legible -- no dark-on-dark text anywhere. Zero-reference line now light-colored, correctly inverted from the light render. Colorbar legend labels ("Low"/"High"/"Feature value") render in light gray, legible in the top-right.
      Data: Same blue-to-red diverging scale and dot layout as the light render -- confirmed identical hues per data point (only chrome flipped). As in the light render, dots near the diverging midpoint are low-contrast against the dark background, consistent with the same design trade-off (midpoint color is theme's own background color).
      Legibility verdict: PASS (all chrome text readable in dark theme; same mid-value marker-contrast caveat as light).
