review:
  strengths:
  - Correctly implements a SHAP beeswarm summary sorted by mean |SHAP| importance
    (most important feature at top), matching the spec exactly
  - Builds a hand-rolled colorbar via chart.renderer SVG primitives to work around
    the missing coloraxis module, with clear code comments documenting the constraint
    and the workaround
  - Dashed zero-reference vertical line cleanly separates positive/negative impact
    as the spec requests
  - Models 'House Age' as a non-linear (quadratic) SHAP contribution, directly illustrating
    the spec's 'non-linear relationships' application with both low and high values
    pushing predictions the same direction
  - Theme-correct chrome in both renders with identical data colors between light/dark,
    and no clipping at either canvas edge (verified colorbar label and y-axis category
    labels both sit comfortably inside the frame)
  weaknesses:
  - Design excellence is fairly generic beyond the manual colorbar workaround — no
    additional focal-point styling (e.g. emphasizing the top feature row, or subtly
    shading the positive/negative half-planes) to strengthen the data story
  - Marker radius (4px) with fillOpacity 0.78 is on the conservative side for a beeswarm
    carrying 180 samples per row — bumping to ~5-6px would improve dot visibility
    per the data-density sizing guideline without materially increasing overplotting
    given the jitter spread
  - The four small helper functions (zscore, minMaxNorm, hexToRgb, valueColor) are
    reasonable given the custom color-mapping requirement, but push slightly past
    a minimal KISS structure
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like cream), not pure white.
      Chrome: Title "shap-summary · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Gradient-boosted house-price model · 180 samples" in soft gray, both clearly readable. Seven y-axis feature category labels (Living Area (sqft), Bathrooms, Distance to Downtown (km), House Age (years), Garage Spaces, Walk Score, Lot Size (acres)) in dark ink, fully visible with no clipping at the left edge. X-axis title "SHAP value (impact on predicted price, $1,000s)" and numeric tick labels (-70 to 90) in soft gray, all legible. Thin horizontal separators between feature rows and a dashed vertical zero-reference line in dark ink.
      Data: Beeswarm scatter dots colored by a green-to-blue sequential gradient (imprint_seq) representing low-to-high feature value, matching a hand-drawn colorbar on the right with "High"/"Low" labels and a rotated "Feature value" title — all fully inside the canvas, no clipping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Title and subtitle rendered in light ink/soft-gray text, clearly readable against the dark surface. Y-axis feature labels and x-axis tick/title text switch to light gray, fully legible — no dark-on-dark failures observed. Dashed zero line rendered in light ink, still visible against the dark background.
      Data: Same green-to-blue sequential dot colors and colorbar gradient as the light render — confirmed identical; only the chrome (background, text, gridlines) flipped between themes.
      Legibility verdict: PASS
