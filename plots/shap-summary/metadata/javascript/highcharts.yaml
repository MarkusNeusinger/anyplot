review:
  strengths:
  - Correctly implements a SHAP beeswarm summary sorted by mean |SHAP| importance
    (most important feature at top), matching the spec exactly
  - Builds a hand-rolled colorbar via chart.renderer SVG primitives to work around
    the missing coloraxis module, with clear code comments documenting the constraint
    and the workaround
  - Marker radius increased to 5px per the attempt-1 feedback, improving beeswarm
    dot visibility at 180 samples/row
  - New plotBand on the top-importance feature row (Living Area) adds a clear focal
    point, directly addressing the attempt-1 storytelling feedback
  - Dashed zero-reference vertical line cleanly separates positive/negative impact
    as the spec requests
  - Models House Age as a non-linear (quadratic) SHAP contribution, illustrating the
    spec's 'non-linear relationships' application
  - Theme-correct chrome in both renders with identical data colors between light/dark,
    and no clipping at either canvas edge
  - Correctly chooses imprint_seq (sequential) over a diverging colormap since feature-value
    color has no meaningful zero-midpoint, just a low-to-high ordering
  weaknesses:
  - 'Header block is missing the required ''// License: Highcharts — commercial license,
    free for non-commercial use (highcharts.com/license)'' line that prompts/library/highcharts.md
    mandates keeping visible in every generated snippet — every other highcharts.js
    implementation in the repo carries this line'
  - The four small helper functions (rand, randNormal, zscore, minMaxNorm, hexToRgb,
    valueColor) are justified by the custom color-mapping workaround but still push
    past a minimal KISS structure
  - Living Area (sqft) row is dense enough that dots overlap significantly even after
    the jitter/opacity tuning — a slightly wider jitter band or smaller marker radius
    specifically for the top row would improve readability without losing the sparser
    rows' visibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "shap-summary · javascript · highcharts · anyplot.ai" and subtitle "Gradient-boosted house-price model · 180 samples" render in dark ink / soft gray, both clearly legible. Seven y-axis feature labels (Living Area (sqft), Bathrooms, Distance to Downtown (km), House Age (years), Garage Spaces, Walk Score, Lot Size (acres)) are fully visible with no clipping at the left edge. X-axis title "SHAP value (impact on predicted price, $1,000s)" and numeric ticks (-70 to 90) are legible in soft gray. A dashed vertical zero-reference line separates positive/negative impact. A faint plotBand highlights the top-importance row (Living Area).
      Data: Beeswarm dots colored on a green-to-blue sequential gradient (imprint_seq) for low-to-high feature value, matched by a hand-drawn colorbar with "High"/"Low" labels and a "Feature value" axis label on the right, fully inside the canvas.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Title, subtitle, axis labels, tick labels, and colorbar labels all flip to light ink / soft-gray and remain clearly legible — no dark-on-dark failures found. The dashed zero line and the focal-point plotBand remain visible against the dark surface.
      Data: Dot colors and the colorbar gradient are pixel-identical to the light render; only chrome flipped, as required.
      Legibility verdict: PASS
