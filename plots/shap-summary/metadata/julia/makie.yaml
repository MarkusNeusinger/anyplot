review:
  strengths:
  - Features correctly sorted by mean |SHAP| with the most important at the top, matching
    the spec.
  - Beeswarm-style vertical jitter (binned + alternating offsets) meaningfully reduces
    overlap versus a naive strip plot.
  - Synthetic data encodes a realistic, direction-aware feature/SHAP correlation (e.g.
    higher tenure pushes churn risk down), so the color-vs-position pattern is semantically
    coherent, not random noise.
  - Correct use of the Imprint sequential colormap (`#009E73` -> `#4467A3`) for the
    continuous feature-value encoding, with a clearly labeled Low/High colorbar.
  - 'Clean chrome: top/right spines removed, subtle gridlines, dashed zero-reference
    line, theme tokens correctly threaded through all text/spine colors for both renders.'
  weaknesses:
  - Per-row point density (~220 samples in a narrow jitter band) causes moderate marker
    overlap in the busiest rows (Contract Type, Tenure); a slightly smaller markersize
    (~7) or lower alpha (~0.7) would improve individual-point separation.
  - The spec's suggested blue-red diverging scale was reinterpreted as the Imprint
    sequential green-blue scale to satisfy the palette rule — reasonable, but the
    review should confirm this reads as clearly 'low-to-high' to a first-time viewer
    unfamiliar with anyplot's palette convention.
  - Data storytelling is functional but understated — no annotation or visual emphasis
    calls out the top feature or the positive/negative split beyond the plain zero-line.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Bold dark title "shap-summary · julia · makie · anyplot.ai" centered at top; x-axis label "SHAP value (impact on model output)" in dark ink; y-axis feature-name labels (Contract Type, Tenure (Months), ... Senior Citizen) in soft ink, sorted by importance top-to-bottom; subtle vertical gridlines at -2/0/2; dashed zero-reference line; right-side colorbar labeled "Feature value" with Low/High ticks. All text is clearly readable against the light background.
      Data: Beeswarm scatter per feature row, jittered vertically to reduce overlap; dot color runs green (low feature value) to blue (high feature value), first-stop green matching brand `#009E73`. Direction of the color gradient relative to SHAP sign differs sensibly per feature (e.g. Tenure: blue/high on the negative side, green/low on the positive side).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title and axis labels rendered in light ink, tick labels in a softer light gray, gridlines and zero-line switched to light-on-dark equivalents, colorbar labels legible in light text. No dark-on-dark text was observed anywhere (title, axis labels, tick labels, colorbar labels all clearly legible).
      Data: Same green-to-blue point colors as the light render — confirmed identical data-color mapping across themes, only chrome (background/text/grid) flipped.
      Legibility verdict: PASS
