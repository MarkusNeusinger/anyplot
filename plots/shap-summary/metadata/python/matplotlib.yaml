review:
  strengths:
  - 'Imprint blue-to-red diverging scale with a near-neutral midpoint keeps mid-scale
    dots visible on both #FAF8F1 and #1A1A17'
  - Feature importance computed from the tidy table with groupby and the top 10 rows
    sorted most important on top
  - Zero line drawn beneath the dots (zorder=0) so it separates signs without covering
    data
  - Colorbar reduced to Low/High end labels, matching the SHAP convention
  - Exact 3200x1800 canvas with theme tokens threaded through title, ticks, spines,
    grid and colorbar
  weaknesses:
  - 'DQ-02 (both): every feature raises the predicted price at high values, so a high
    Crime Rate Index, a long Distance to City and an old Age of House all push price
    up (red dots right of zero), which a reader of a house-price model will find implausible
    → give those features a negative relationship (high value, negative SHAP). Likely
    cause: base_shap = (feature_values[:, i] - 0.5) * importance_scale[i] with one
    positive sign for all features.'
  - 'Suggestion: one feature with a non-linear (U-shaped) effect would show the ''both
    colours on one side'' pattern the spec''s Applications mention.'
