review:
  strengths:
  - Long table plotted directly with sns.stripplot(data=df, order=..., hue=..., hue_norm=(0,
    1)) — continuous feature-value colour on a categorical strip with seaborn's built-in
    jitter
  - Blue-to-red imprint_div ramp with a neutral grey midpoint keeps mid-scale dots
    visible on both backgrounds; colorbar ends labelled Low and High
  - Zero line drawn behind the dots (zorder=0) separates negative and positive impact
    without covering data
  - Theme tokens threaded through chrome and colorbar; both renders fully legible
    at the style-guide text sizes on an exact 3200x1800 canvas
  weaknesses:
  - 'DQ-03 (both): the feature names contradict the directions the data gives them:
    high Annual Income sits at negative SHAP down to about -0.52 while low income
    reaches +0.74, and high Previous Defaults and high Inquiries push approval up
    (+0.1 to +0.6) → higher income, fewer defaults and fewer inquiries raise approval.
    Likely cause: the 12 credit names are assigned in list order to make_classification''s
    anonymous features, so each name inherits an arbitrary sign.'
  - 'Suggestion: a muted rule under the top feature or a slightly heavier weight for
    the top rows'' labels could make the importance ranking read faster.'
