review:
  strengths:
  - 'Correct structure in both themes: rows sorted by mean |SHAP| with Inquiries at
    the top, blue-to-red color by feature value, dashed zero line beneath the dots'
  - Color bar built as an injected SVG linearGradient with High/Low ends and a title,
    filling pygal's missing colorbar feature cleanly
  - 'Theme tokens threaded through pygal Style; text readable on both #FAF8F1 and
    #1A1A17'
  - Mid-tone of the diverging scale chosen so mid-value dots stay visible on both
    pages
  - pygal XY with labelled y_labels dicts and HTML output keeps hover tooltips for
    the detail view
  weaknesses:
  - 'DQ-01 (both): feature values are drawn independently of the SHAP values, so every
    row mixes blue and red evenly on both sides of zero and no feature shows a direction
    of effect → generate SHAP values that depend on the feature value for most features
    (e.g. shap = slope * (value - 0.5) + noise, a negative slope for some), keeping
    one or two noise-like rows. Likely cause: value_i = np.random.uniform(0, 1, n_samples)
    unrelated to shap_i.'
  - 'CQ-01 (code): two helper functions lerp_hex and diverging → inline the color
    blend as a vectorised numpy interpolation over the bin centres. Likely cause:
    def lerp_hex / def diverging.'
  - 'CQ-04 (code): IMPRINT_PALETTE is defined but never used → delete it. Likely cause:
    leftover constant block.'
  - 'Suggestion: draw the zero line in a slightly stronger ink so it reads at a glance
    in the busy centre.'
