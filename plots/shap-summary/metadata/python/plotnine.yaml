  weaknesses:
  - 'VQ-07, SC-02 (both): dots colored by the BrBG colormap (brown low, teal high),
    which is neither an Imprint continuous map nor the blue-to-red scale the spec
    asks for → Imprint diverging stops #4467A3 (low) and #AE3030 (high). Likely cause:
    scale_color_cmap(cmap_name="BrBG").'
  - 'SC-02 (both): the most important feature (Concave Points) sits at the bottom
    and the least important (Smoothness) at the top, inverting the order the spec
    asks for → most important on top. Likely cause: categories listed in descending
    importance while ggplot draws the first category at the bottom.'
  - 'VQ-03, SC-02 (light): mid-scale dots (feature value near 0.5) are near-white
    and almost vanish on #FAF8F1 → a mid color visible on both pages, such as a muted
    grey. Likely cause: the BrBG midpoint.'
  - 'VQ-05 (both): canvas is 4800x2700 instead of 3200x1800 → 3200x1800 (−1600 x −900).
    Likely cause: figure_size=(16, 9) with ggsave(dpi=300, width=16, height=9).'
  - 'SC-04 (both): title "shap-summary · plotnine · anyplot.ai" lacks the language
    segment → "shap-summary · python · plotnine · anyplot.ai". Likely cause: the labs()
    title string.'
  - 'DQ-01 (code): feature values are drawn independently of the SHAP values, so every
    row mixes colors randomly and no feature shows the direction of its effect the
    spec''s description names → generate SHAP values as a function of the feature
    value for most features. Likely cause: unrelated np.random.normal / np.random.uniform
    draws in the data loop.'
  - 'DE-01 (both): a colormap outside Imprint falls short of the style-guide baseline
    → the Imprint diverging stops. Likely cause: scale_color_cmap(cmap_name="BrBG").'
  - 'Suggestion: vertical jitter inside each row (position_jitter with width=0) would
    show where SHAP values are dense.'
