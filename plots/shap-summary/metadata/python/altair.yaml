review:
  strengths:
  - 'Uses the Imprint diverging ramp (#4467A3 -> page color -> #AE3030) with domainMid
    0.5 and a framed color bar marking 0.0 and 1.0, theme-correct in both renders'
  - 'All four characteristic properties met: rows sorted by mean |SHAP| from the data,
    one dot per sample in its own row, blue-to-red coloring, dashed zero rule in INK_SOFT'
  - 'Idiomatic Altair: layered zero rule + scatter, yOffset jitter from transform_calculate,
    escaped field names with explicit type= and title='
  - Native tooltips with feature, SHAP value and feature value in the HTML output
  - PAD-only save lands exactly on 3200x1800 in both themes
  weaknesses:
  - 'VQ-05 (both): the jitter offsets each row from the band''s top edge, so every
    feature label sits at the bottom edge of its dot cluster and the top row''s dots
    rise above the y-axis domain toward the title → centre the jitter on the band
    so labels align with their clusters. Likely cause: yOffset with a quantitative
    scale range [-12, 12] on a band y scale (use a band-centred y, e.g. alt.Y(...,
    scale=alt.Scale(paddingInner=...)) with yOffset range [0, bandwidth], or a point
    scale).'
  - 'SC-01 (both): dot size by |SHAP| and opacity by importance rank are derived channels
    the spec does not ask for (x already shows |SHAP|, row order already shows rank)
    → drop both and use one fixed size and opacity. Likely cause: size=alt.Size(''Abs
    SHAP:Q'') and opacity=alt.Opacity(''Importance rank:Q'').'
  - 'CQ-02 (both): the vertical jitter comes from Vega''s unseeded random(), so the
    dot layout differs between the light and dark renders and between runs → compute
    the jitter in pandas with the seeded numpy generator. Likely cause: transform_calculate(jitter=''random()
    * 2 - 1'').'
  - 'CQ-04 (code): IMPRINT_PALETTE is defined but never used, and the ''Abs SHAP''
    and ''Importance rank'' helper columns exist only for the unrequested channels
    → delete them. Likely cause: leftover constants from the template.'
  - 'Suggestion: a slightly tighter row gap would let the top features'' spread read
    larger.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800, chart centred with page-color padding.
      Chrome: title 'shap-summary · python · altair · anyplot.ai' in dark ink; x title 'SHAP Value (Impact on Model Output)'; ten feature names on the left (Account Age (months) at top ... Support Tickets at bottom); ticks -0.8..0.8; subtle vertical grid; framed 'Feature Value' color bar 0.0-1.0 on the right. All text readable.
      Data: ~300 jittered dots per row, blue (#4467A3) for low feature values through off-white to red (#AE3030) for high, thin INK_SOFT outlines; dashed INK_SOFT zero rule. Rows narrow from +/-0.8 at the top to a tight clump at the bottom. Feature labels sit at the bottom of their clusters; top row reaches above the axis domain.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis title in light ink, tick and feature labels in light grey, legend on elevated #242420 with light text; no dark-on-dark text.
      Data: same blue and red poles; the ramp midpoint flips to the page color as imprint_div prescribes, so mid-scale dots appear as outlined rings and stay visible; light dashed zero rule. Jitter positions differ from the light render (unseeded random()).
      Legibility verdict: PASS
