review:
  strengths:
  - Color mapping uses a Bokeh field transform with a LinearColorMapper built on imprint_div,
    and the ColorBar shares the same mapper with Low/High label overrides
  - Per-feature min-max normalization via groupby.transform colors every row across
    the full blue-to-red range
  - Rows sit on FixedTicker positions with major_label_overrides, sorted by mean |SHAP|
    with the most important feature on top
  - Theme tokens are threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'DQ-01 (both): SHAP values are drawn independently of the feature values, so in
    every row blue and red dots scatter evenly on both sides of zero and no feature
    shows a direction of effect → derive each feature''s SHAP value from its standardized
    feature value (monotone for most features, e.g. Square Footage high → positive,
    Age high → negative, one non-linear feature) plus noise. Likely cause: shap_matrix
    = np.random.normal(...) generated separately from value_matrix.'
  - 'Suggestion: in the dark render the imprint_div midpoint equals the page color,
    so mid-value dots read as hollow rings; a slightly heavier outline would give
    them more body.'
  - 'Suggestion: a HoverTool with feature, SHAP value and raw feature value would
    add inspection in the HTML output.'
