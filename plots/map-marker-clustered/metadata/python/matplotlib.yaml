review:
  strengths:
  - 'Static adaptation of zoom-level clustering: grid cells collapsed to count badges
    at their members'' mean position with log-scaled size, plus an ax.inset_axes panel
    that shows the London area expanded into individual markers'
  - Single-store cells drawn as plain category-colored markers at their own coordinates,
    so clusters and isolated stores read differently
  - Coastline basemap that places every city group on land, in theme-adaptive ocean
    and land tokens that stay quieter than the markers in both renders
  - Imprint positions 1-3 for Retail, Grocery and Electronics with a titled Store
    Type legend; page-colored halos separate the badges from the map in both themes
  - 'Clean linear code: seeded, strict zips, Axes API only, savefig without bbox_inches'
  weaknesses:
  - 'Suggestion: give the inset all four spines (or ax.indicate_inset_zoom) so its
    land fill no longer runs into the main map''s France at its top edge.'
  - 'Suggestion: add coarse national borders to the coastline basemap so each cluster
    reads against its country.'
