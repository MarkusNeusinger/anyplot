review:
  strengths:
  - 'Static adaptation of zoom-level clustering: grid-based clusters at their members''
    mean position with log-scaled markers and bold counts, plus an ax.inset_axes panel
    that shows the London area expanded into individual markers'
  - The inset now sits in the empty Bay of Biscay / western Mediterranean area (set_zorder(10)),
    so no cluster marker or count is hidden behind it in either render
  - Theme-adaptive basemap tokens (ocean, land, borders) and chrome tokens flip cleanly;
    cluster halos use PAGE_BG so markers separate from the map in both themes
  - Dominant-category coloring of cluster markers with a titled 'Store Type' legend,
    and a faint alpha=0.20 backdrop of all 280 stores that keeps the underlying distribution
    visible
  - 'Clean linear code: seeded, strict zips, Axes API only, savefig without bbox_inches=''tight'''
  weaknesses:
  - 'SC-02 (both): the hand-drawn land polygon leaves Madrid (-3.7°, 40.4°) and Rome
    (12.5°, 41.9°) in the sea and drops Iberia''s interior and the Italian peninsula,
    so the basemap (C5) gives wrong geographic context → a coastline in which those
    cities lie on land, e.g. a coarse but correct outline of Iberia and Italy. Likely
    cause: the europe_coast_lon/lat vertex lists.'
  - 'SC-02 (both): seven isolated stores are drawn as count-''1'' cluster badges of
    full cluster size instead of individual markers at their own coordinates (C2)
    → draw single-member cells as plain category-colored points. Likely cause: the
    cluster loop treats size==1 like any cluster.'
  - 'VQ-01 (both): inset tick labels at 5.5 pt, district labels at 5 pt and the callout
    at 6 pt read small beside the 8 pt main ticks → at least 7 pt (+1.5 to +2 pt).
    Likely cause: ax_inset.tick_params labelsize=5.5, the district text fontsize=5,
    the annotate fontsize=6.'
  - 'VQ-02 (both): in the inset ''Central'' and ''East End'' run into each other and
    a red marker sits on ''North''; on the main map the ''9'' and ''8'' and the ''7''
    and ''16'' cluster discs overlap by about a third → drop or enlarge-space the
    district labels; for the clusters, a coarser grid that merges the Rome cells.
    Likely cause: district label positions; grid_size_lat/lon splitting cities across
    cells.'
  - 'VQ-07 (both): Electronics, the third category, is drawn in #AE3030 (position
    5, the red bad/loss anchor) although nothing about electronics means red → the
    third Imprint position #4467A3. Likely cause: the cat_colors dict.'
  - 'DQ-03 (both): the callout reads ''London hub · 19 stores'' while the generated
    London group has 50 stores split across the 19, 31 and 6 clusters, and the code
    comment calls it the highest-count city although the 40 cluster is larger → state
    the cluster honestly (e.g. ''London west cluster · 19 stores'') or count all London-cell
    stores. Likely cause: the annotate text and the largest_idx comment.'
  - 'Suggestion: connect the dashed London box to the inset with ax.indicate_inset_zoom(ax_inset)
    so the zoom relation reads without the title.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 figure; plot area light blue ocean with warm beige land polygons (crude Europe, Great Britain, Ireland).
      Chrome: title "map-marker-clustered · python · matplotlib · anyplot.ai" dark and readable; "Longitude (°)" / "Latitude (°)" dark; tick labels dark grey; "Store Type" legend (Retail, Grocery, Electronics) on elevated frame; "London hub · 19 stores" callout box left of Britain with arrow to the 19 cluster; italic "Atlantic Ocean", "Mediterranean Sea"; north arrow at lower right; "Total: 280 locations · 27 clusters" box bottom right; inset "London → expanded" at bottom centre over empty sea with ~50 individual points and small district labels.
      Data: 27 cluster markers sized by log count with white bold counts (1–40), colored by dominant category: Retail #009E73, Grocery #C475FD, Electronics #AE3030; faint alpha 0.2 backdrop points. Rome clusters 9/8 and 7/16 overlap partially; inset 'Central'/'East End' labels touch.
      Legibility verdict: PASS (inset ticks and district labels small at 5–5.5 pt but readable)

