review:
  strengths:
  - Cluster markers carry legible white bold counts in both themes, sized by count
    with a matching size legend
  - Theme tokens threaded through all chrome; no dark-on-dark text
  - guide_legend(override_aes=...) gives visible legend glyphs in both themes
  - coord_fixed keeps a geographic aspect for the state outlines
  weaknesses:
  - 'VQ-01, VQ-02 (both): city labels placed 0.65° above each city collide with the
    cluster markers — ''San Diego'', ''San Francisco'' and ''Portland'' are partly
    covered and ''Seattle'' touches its marker → labels clear of the markers. Likely
    cause: city_label_df lat + 0.65 with va=''bottom'' for markers about 1° tall.'
  - 'VQ-05 (both): the tall West Coast map with coord_fixed fills only the middle
    third of a 3200x1800 landscape canvas, leaving wide empty margins → a square 2400x2400
    canvas. Likely cause: figure_size=(8, 4.5).'
  - 'VQ-07 (both): Service is drawn in #AE3030, the red anchor for bad or loss, with
    only four meaningless categories while slot 4 (#BD8233 ochre) is skipped → Service
    in #BD8233. Likely cause: CATEGORY_COLORS.'
  - 'CQ-04 (code): the convex-hull block (ConvexHull, try/except, hull_df, geom_polygon
    alpha 0.13) draws polygons hidden under the markers and invisible in both renders
    → delete it. Likely cause: point spread sd=0.04°.'
  - 'Suggestion: a few isolated store locations would show single markers next to
    clusters.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800 canvas.
      Chrome: title, axis titles and ticks in dark ink, readable; framed legend with Category and Points in cluster.
      Data: five cluster circles with white counts (Seattle 67 green, Portland 66 lavender, San Francisco 68 red, Los Angeles 42 blue, San Diego 57 green) over simplified WA/OR/CA outlines; city labels above each cluster, partly covered by the markers ('Seattle', 'Portland', 'San Francisco', 'San Diego'). The map fills only the middle third of the canvas.
      Legibility verdict: PASS (labels partly covered)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: light ink text throughout, no dark-on-dark; legend on #242420 with light frame.
      Data: identical categorical colors; same label collisions with markers.
      Legibility verdict: PASS (labels partly covered)
