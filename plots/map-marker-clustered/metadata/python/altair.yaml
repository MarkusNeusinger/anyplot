review:
  strengths:
  - Uses alt.topo_feature with the albersUsa projection for a quiet state-boundary
    basemap whose fill and stroke flip with the theme
  - Declarative selection_point(on='mouseover') gating transform_filter on two layers
    reveals member points and spider lines in the HTML
  - autosize fit at 800x450 fills the 3200x1800 canvas exactly; markers sized 40-500
    by log count keep neighboring clusters readable
  - Cluster colors follow the dominant category in canonical Imprint order, with a
    legend naming the three categories
  weaknesses:
  - 'VQ-02 (both): in New England the ''26'' cluster circle covers the right edge
    of the ''23'' count label → keep each count label clear of neighboring circles
    (shrink the top of the size range by about 100, or merge neighbors with a larger
    grid_size). Likely cause: grid_size=2.5 splits the Boston/New York groups into
    adjacent clusters drawn with size range up to 500.'
  - 'SC-02 (code): the Notes ask for click-to-zoom on clusters; the HTML only offers
    hover reveal → add a click interaction that zooms to the cluster (e.g. a selection_interval
    bound to scales or a click selection driving the projection scale/center). Likely
    cause: only a mouseover selection_point is defined.'
  - 'DQ-02 (both): several store points sit in the ocean (the food singleton east
    of Miami, the retail ''2'' off Cape Cod, Gulf points south of Houston) → keep
    the stores on land, e.g. smaller noise (std ≈ 0.4°) or a land check. Likely cause:
    Gaussian noise std=0.8° around coastal cities with only a rectangular CONUS clip.'
  - 'CQ-04 (code): lines 77-91 build the spider-line segments row by row with iterrows
    → two vectorized frames combined with pd.concat (centroid rows and point rows
    sharing link_id). Likely cause: the explicit iterrows loop.'
  - 'Suggestion: count labels on the smallest singleton-sized markers could be dropped
    in favor of a slightly smaller marker for count-1 points to separate individual
    stores from clusters more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; US basemap (lower 48 plus Alaska/Hawaii insets via albersUsa) in light grey fill #E8E6DF with thin grey state borders, quieter than the markers.
      Chrome: title 'map-marker-clustered · python · altair · anyplot.ai' bold dark ink top-left, subtitle '500 US store locations · hover cluster to reveal members via spider lines (size = count)' in INK_SOFT; legend 'Category' (retail, food, services) bottom-right in an elevated off-white box with dark frame. All readable.
      Data: ~45 cluster circles around ten US metros: retail #009E73 (Seattle, LA, NYC, Boston), food #C475FD (Chicago, Houston, Miami), services #4467A3 (Phoenix, Denver, Washington DC); sizes grow with count (2 to 39), bold near-white count labels on each; a few count-1 singletons without label. Page-colored rings separate neighbors; the '26' circle slightly covers the '23' label in New England. Some points fall in the ocean.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; basemap fill #2A2A27 with darker borders, quiet.
      Chrome: title in light ink, subtitle in #B8B7B0, legend box with #242420 fill and light frame/labels; no dark-on-dark text.
      Data: identical categorical colors and positions to the light render; rings switch to the dark page color; count labels near-white and legible.
      Legibility verdict: PASS
