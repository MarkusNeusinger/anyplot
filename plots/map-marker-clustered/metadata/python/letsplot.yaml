review:
  strengths:
  - Real clustering via scipy complete linkage with a 3-degree diameter on latitude-corrected
    coordinates; each cluster marker sits at the mean position of its stores and the
    8 isolated stores stay at their own coordinates
  - Cluster diameter grows with the square root of the count (8 to 24), so New York
    (200), Chicago (162) and Los Angeles (175) stand out while the 2- and 3-store
    town clusters stay small
  - 'Count labels pick dark or light ink per fill by WCAG contrast (light on #4467A3,
    dark on green and purple) and shrink with their marker, so every number is legible
    inside its circle in both themes'
  - Markers carry a page-colored ring that separates touching clusters (Reno 3 against
    San Francisco 110) on both backgrounds
  - Quiet Natural Earth US-48 state basemap whose fill and border flip with the theme
    and stay well below the markers
  - 'Store type legend in the Imprint order (Retail #009E73, Warehouse #C475FD, Service
    Center #4467A3) with cluster color reflecting the dominant type and a per-cluster
    type mix in the layer_tooltips hover'
  - 'Native lets-plot interactivity in the HTML: layer_tooltips with store label and
    type for singles, count plus type mix for clusters, and the ggtb() toolbar for
    zoom and pan'
  weaknesses:
  - 'Suggestion: the HTML view keeps one precomputed zoom level, so zooming with ggtb()
    enlarges the same clusters instead of splitting them; noting this in the caption
    would set expectations for the interactive view.'
  - 'Suggestion: name the column roles once as constants (for example LAT = "lat",
    LON = "lon", CATEGORY = "category") and derive xlim/ylim from the basemap bounds
    instead of typing -127/-65 and 23/51, so the code adapts to another region''s
    stores.'
  - 'Suggestion: the band between the title and the northern border is wider than
    the space below Florida; trimming the top limit slightly would let the map sit
    more centrally.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; theme_void, no axes or grid; legend box on the elevated #FFFDF6 surface with a soft ink border.
      Chrome: bold title "map-marker-clustered · python · letsplot · anyplot.ai" centred at the top (~60 % of width), legend "Store type" at the right, caption "1,249 store locations · 28 clusters of nearby stores (count on the marker, color = most common type) · 8 single stores" in INK_SOFT at the bottom. All text dark on light and readable.
      Data: US-48 state polygons in light grey #E0DDD6 with grey borders as a quiet basemap; 28 cluster circles sized by count (2 up to 200 for New York) with bold counts, colored by dominant type: Retail #009E73 (first series), Warehouse #C475FD, Service Center #4467A3; 8 small single-store dots. Page-colored rings separate touching markers. Light count text on blue, dark on green and purple.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend box on #242420 with a light border.
