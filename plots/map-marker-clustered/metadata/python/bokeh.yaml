review:
  strengths:
  - Native WMTSTileSource basemap (USGS topo) with mercator axis types gives real
    street, boundary and water context; drawn translucent (alpha 0.55 light / 0.30
    dark) so it takes the theme's tone and stays quieter than the markers
  - Cluster markers sit at the mean Web-Mercator position of their member stores,
    sized by the square root of the count, so the 43-, 39- and 38-store groups clearly
    dominate while singletons stay at their own coordinates
  - Bold white count labels via LabelSet are legible on every marker in both themes,
    and the white marker rings separate neighbouring clusters
  - Clusters are colored by their dominant store type in canonical Imprint order with
    a 'Store Type' legend placed outside the map frame
  - HoverTool on the cluster renderers reports store count, dominant type and neighbourhood
    in the HTML artifact
  - Realistic NYC coffee-chain scenario with neighbourhood-seeded store locations;
    theme tokens threaded through every chrome element
  weaknesses:
  - 'SC-02 (code): the clustering is computed once in Python on a fixed 3500 m grid,
    so the HTML artifact neither re-clusters on zoom, nor expands clusters with a
    zoom transition, nor zooms in on a clicked cluster, as the Notes ask → recompute
    the clusters in a CustomJS callback on x_range/y_range changes and add a TapTool
    callback that zooms the ranges to the clicked cluster (with WheelZoomTool active).
    Likely cause: static grid clustering at lines 83-99 with no JS callbacks.'
  - 'Suggestion: the stores span about 0.08° of longitude but 0.12° of latitude, so
    on the 16:9 canvas the clusters fill only the central ~45% of the map width; the
    2400×2400 square canvas would let them fill the frame.'
  - 'Suggestion: the off-screen phantom-point branch (lines 157-161) never runs with
    this data and the bare try/except screenshot fallback could go, trimming a few
    lines.'
  - 'Suggestion: the faint individual store dots are all drawn in the first Imprint
    color regardless of category; coloring them by store type would hint at the mix
    inside each cluster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the frame; inside, a USGS topo street map (blue water, pink highways, grey street grid, place names) of Manhattan, Brooklyn, Queens and Jersey City at alpha 0.55.
      Chrome: bold title "map-marker-clustered · python · bokeh · anyplot.ai" top left at ~50% width; italic "Longitude (°)" / "Latitude (°)" axis titles and degree tick labels in dark ink; "Store Type" legend in an elevated box right of the frame (Coffee, Express, Roastery, Reserve). All readable.
      Data: 19 white-ringed circular cluster markers, sized by count (1 to 43), with bold white counts; most are green #009E73 (Coffee dominant), one large lavender #C475FD "29" in Midtown and a lavender "1" in Brooklyn, a blue #4467A3 "1" singleton on the Upper East Side and an ochre #BD8233 "1" in Hoboken. Faint green dots mark individual stores beneath the clusters.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; the same topo map at alpha 0.30 reads as a muted dark-grey map with dark-red roads, clearly quieter than the markers.
      Chrome: title, axis titles and tick labels in light ink; legend on the dark elevated box with light labels. No dark-on-dark text in the chart chrome.
      Data: identical marker colors, positions, sizes and counts as the light render; white counts stay legible on every marker.
      Legibility verdict: PASS
