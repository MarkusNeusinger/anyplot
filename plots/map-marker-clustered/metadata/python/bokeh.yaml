review:
  strengths:
  - Clustering runs in the browser through a CustomJS callback bound to the x/y range
    start/end and to DocumentReady, so the HTML genuinely re-clusters as the reader
    zooms — the dynamic behaviour the spec describes, not a frozen snapshot
  - TapTool callback performs an eased 600 ms animated zoom to the box around a cluster's
    members, covering both the click-to-zoom and the smooth-transition Notes bullets
  - Cluster markers sit at the centroid of their members, scale with sqrt(count) from
    55 to 130 px so the 47-store Midtown cluster dominates, and carry bold white centered
    counts readable in both themes
  - USGS topo WMTSTileSource on mercator axes with a theme-dependent tile alpha (0.55
    light / 0.30 dark) keeps the basemap clearly quieter than the markers on both
    surfaces
  - HoverTool on the cluster renderers reports store count, dominant store type and
    dominant neighborhood in the HTML view
  - 'Imprint palette in canonical order with Coffee (most common) in #009E73; legend
    sits outside the map on an elevated, theme-correct box'
  weaknesses:
  - 'DQ-01 (both): the category feature is barely exercised — Coffee is the dominant
    type in 14 of 17 clusters and Express (30 % of stores) never wins a cluster, so
    the purple legend entry has no mark on the map and only three small clusters (one
    Reserve, two Roastery) show a non-green color → give some neighborhoods a different
    dominant store type so several large clusters render in purple, blue and ochre.
    Likely cause: every neighborhood draws its types from the same p=[0.5, 0.3, 0.15,
    0.05] distribution.'
  - 'VQ-03 (both): the individual-store underlay dots at size 8 and fill_alpha 0.20
    are barely visible and are all drawn #009E73 whatever their type, so Roastery/Express/Reserve
    stores show in the Coffee legend color → color each dot by its store type from
    the palette index, or drop the underlay. Likely cause: p.scatter(... fill_color=IMPRINT_PALETTE[0],
    fill_alpha=0.20) for store_source.'
  - 'Suggestion: a convex hull of a cluster''s members on hover (the Notes mention
    it as an option) would show the spread each marker stands for in the HTML view.'
  - 'Suggestion: in the dark render the 0.30-alpha tiles turn the water and land into
    a similar slate grey; a slightly higher tile alpha would keep the shoreline legible.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around the map frame; USGS topo tiles (pale blue water, light land, pink-red highways) drawn translucent over it.
      Chrome: title "map-marker-clustered · python · bokeh · anyplot.ai" top-left in dark bold text (~55 % of width); axis titles "Longitude (°)" / "Latitude (°)" and degree tick labels (-74.1 … -73.85, 40.68 … 40.8) in dark ink, all readable; legend "Store Type" (Coffee, Express, Roastery, Reserve) outside the map on the right on an elevated off-white box.
      Data: 17 circular cluster markers over Manhattan/Brooklyn with white outlines and bold white counts (47, 35, 33, 31, 27, 24, 23, 14, 12, 8, 7, 4, 2, 1, 1, 1); 14 in #009E73 (Coffee), two Roastery clusters in #4467A3, one Reserve singleton in #BD8233 at Hoboken; marker size grows with count; faint small green store dots under the clusters. Express (#C475FD) appears only in the legend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 around the frame; tiles at lower alpha read as a muted slate map with dim red-brown highways, clearly quieter than the markers.
      Chrome: title, axis titles and tick labels in light ink, all readable; legend box dark elevated with light labels — no dark-on-dark text.
      Data: identical cluster positions, counts and colors to the light render (#009E73, #4467A3, #BD8233); white count labels remain crisp; brand green clearly visible.
      Legibility verdict: PASS
