review:
  strengths:
  - sns.scatterplot maps count to size (sizes=(50, 500)) and dominant category to
    hue through a palette dict, so the largest groups stand out
  - Cluster markers sit at the mean of their member points and each prints its count
  - 'Count labels follow their fill: dark ink on the light Restaurant lilac, white
    on the darker Imprint fills'
  - sns.set_theme(rc=...) threads the theme tokens through chrome; both renders are
    theme-correct with identical categorical colors
  - Size-legend labels are computed from the actual cluster-count quantiles
  weaknesses:
  - 'VQ-03 (both): the size-legend circles have a blue outline (the default color
    cycle) that no cluster marker has; the markers are outlined in the page color
    → markeredgecolor=PAGE_BG to match the marks. Likely cause: Line2D handles without
    markeredgecolor.'
  - 'VQ-02 (both): cluster discs overlap and partly cover each other in the south-west
    group (11 over 19 and 12, 15 over 18) and the south-east group (11 over 14, 9
    over 17), which a clustered map exists to avoid → no two cluster markers overlapping
    by more than their outline. Likely cause: distance_threshold=0.18 in AgglomerativeClustering
    is small for marker sizes up to 500 (raise the threshold or lower sizes=(50, 500)).'
  - 'SC-02 (both): the basemap (C5) is three hand-drawn polylines and a land rectangle
    at alpha 0.3 that is barely visible; no boundaries, streets or terrain a reader
    can orient by → real coastline or borough boundaries, quieter than the markers.
    Likely cause: the stylized hudson_river / li_sound / coast segments in place of
    real geometry.'
  - 'DQ-03 (both): one neighborhood of businesses is centered near 40.25°N, -73.55°,
    which lies in the Atlantic south of Long Island (its south shore is at about 40.6°N)
    → neighborhood centers on land. Likely cause: neighborhood_centers drawn uniformly
    from ±0.5° around (40.7, -74.0).'
  - 'Suggestion: the KDE contours are drawn darker than the basemap and compete with
    it; a lighter contour would leave the markers clearer.'
