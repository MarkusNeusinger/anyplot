      Data: 56 cluster discs sized by count (2-19) in Imprint colors - Coffee Shop #009E73, Restaurant #C475FD, Bookstore #AE3030, Gym #4467A3 - with page-colored outlines and bold counts (dark on lilac, white elsewhere); gray KDE contours under them. Discs overlap in the south-west and south-east groups; size-legend circles have a blue outline.
