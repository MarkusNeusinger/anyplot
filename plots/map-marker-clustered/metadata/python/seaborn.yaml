review:
  strengths:
  - sns.scatterplot maps count to size and dominant category to hue through a palette
    dict, so the largest groups stand out
  - Cluster markers sit at the mean of their member points and each prints its count,
    dark on the light Restaurant lilac and white on the darker fills
  - Basemap of simplified NJ, Manhattan, Staten Island, Long Island and Westchester
    outlines in a theme-tinted land fill, quieter than the markers in both themes
  - Business hubs placed at real NYC-region land coordinates, with a cos(latitude)
    aspect so the map is not stretched
  - sns.set_theme(rc=...) threads the theme tokens through chrome; both renders are
    theme-correct with identical categorical colors
  weaknesses:
  - 'VQ-02 (both): neighboring cluster discs overlap and partly cover each other —
    20 over 17 in the east (Nassau) group, 12 against 19 and 9 against 12 in the west
    (Newark/Jersey City) group → no two cluster markers overlapping by more than their
    outline. Likely cause: distance_threshold=0.1 in AgglomerativeClustering leaves
    sub-clusters whose centers sit closer than their marker diameters (raise the threshold
    or lower sizes=(50, 250)).'
  - 'VQ-03 (both): the size-legend circles are drawn at markersize 5/8/11 pt while
    the cluster marks they explain span about 7-16 pt (sizes=(50, 250) in pt²), so
    the legend''s ''13-22 pts'' circle is about a third smaller than a 22-point cluster
    → legend glyphs at the marks'' diameters (about +2 to +5 pt). Likely cause: hand-set
    Line2D markersize values instead of sqrt of the mapped sizes (or seaborn''s own
    size legend).'
  - 'Suggestion: the KDE density contours are a layer the spec does not ask for and
    run across the land outlines like extra boundaries; dropping them would leave
    the basemap easier to read.'
  - 'Suggestion: a few more coastline vertices (Hudson, Upper Bay, Jamaica Bay) would
    make the basemap read as NYC at a glance.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; land polygons (NJ, Manhattan, Staten Island, Long Island/Brooklyn/Queens, Bronx/Westchester) in a slightly darker beige #ECE8D9 with thin gray outlines; water left in the page color.
      Chrome: title 'map-marker-clustered · python · seaborn · anyplot.ai' in dark ink, 'Longitude (°)' / 'Latitude (°)' axis titles, degree ticks in dark gray, subtle grid; 'Business Type' legend upper left, 'Cluster Size' legend (3-8, 9-12, 13-22 pts) lower left, italic caption '500 locations · 47 clusters' lower right. All readable.
      Data: 47 cluster discs sized by count (3-22) in Imprint colors — Coffee Shop #009E73, Restaurant #C475FD, Bookstore #AE3030, Gym #4467A3 — with page-colored outlines and bold counts (dark on lilac, white elsewhere); faint gray KDE contours and near-invisible raw points underneath. A few discs touch or overlap (20/17 east, 12/19 and 9/12 west). Size-legend circles are smaller than the marks.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, land polygons in #24241F with #4A4A44 outlines — subtle but visible.
      Chrome: title, axis titles and ticks in light ink, legend panels on #242420 with light text; no dark-on-dark text.
      Data: categorical colors identical to the light render; counts dark on lilac, white on the other fills, all legible; KDE contours in muted gray.
      Legibility verdict: PASS
