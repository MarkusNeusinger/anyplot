review:
  strengths:
  - Uses Plotly's native Scattermap cluster option, giving real zoom-to-expand and
    hover details per store in the HTML output
  - Theme-matched carto-positron / carto-darkmatter basemaps; all chrome threads INK/INK_SOFT/ELEVATED_BG
    and reads well in both themes
  weaknesses:
  - 'VQ-07 (both): Clothing is drawn in #AE3030 (Imprint position 5) as the third
    category and Hardware in #4467A3 → the canonical order #009E73, #C475FD, #4467A3,
    #BD8233. Likely cause: the IMPRINT list skips positions 3–4.'
  - 'SC-02, VQ-03, SC-04, DQ-01 (both): every cluster renders as one muted blue-purple
    disc with only thin rims of green, purple or red, so no cluster reflects its dominant
    or mixed category (C4) and the legend colors are barely found on the marks → cluster
    markers in the category colors. Likely cause: one clustered trace per category
    drawn at the same size at the same city, the last trace covering the others.'
  - 'SC-02 (both): the count on each visible cluster is one category''s count (17
    at Chicago, which has 50 stores; 13 at Los Angeles, which has 60), not the count
    of the points the marker stands for (C1) → the count of all grouped stores. Likely
    cause: per-category clustering, so only the top trace''s count label shows.'
  - 'SC-03, VQ-05 (both): the map viewport (center -100/39, zoom 3.5) spans only about
    -122° to -78° longitude, so New York (80 stores, the densest city), Boston, Miami
    and Seattle are off the map and Houston is cut at the bottom edge — about 195
    of 440 stores unseen → a viewport that contains all ten cities (zoom about 2.8–3.0,
    center near -96/38). Likely cause: layout.map zoom/center.'
  - 'VQ-02 (both): the bottom-right data-context annotation box covers the top half
    of the basemap attribution text and half of the bottom-right cluster''s count
    → keep the box clear of both. Likely cause: annotation at y=0.04 anchored bottom-right.'
  - 'Suggestion: set the cluster count font size explicitly to match the rest of the
    typography.'
