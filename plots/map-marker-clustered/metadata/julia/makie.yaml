review:
  strengths:
  - 'Basemap built from Makie primitives: poly!(ax, Rect2f(...)) water bodies, a block-spaced
    hlines!/vlines! street grid and per-theme land/water/street tokens, quieter than
    the markers in both themes'
  - Cluster bubbles sized by count with fill and matching stroke in the dominant category's
    color, count text chosen per fill (dark on lavender, white on green and blue)
    so every count is legible in both themes
  - Imprint positions 1-3 in canonical order, identical across themes; all chrome
    threaded through PAGE_BG / ELEVATED_BG / INK / INK_SOFT
  - 'Simple, seeded grid clustering: clusters at the mean of their members, cells
    with fewer than 4 points drawn as individual markers at their own coordinates'
  weaknesses:
  - 'DQ-03 (both): three solo venues, the ''9'' cluster and the west half of the ''15''
    cluster sit inside the drawn Hudson River (lon below -74.007), so cafés and bakeries
    appear on the water → every venue on the drawn land (lon between about -74.006
    and -73.979). Likely cause: the Financial District (-74.0060) and Tribeca (-74.0010)
    centers with randn() * 0.0033 spread spill west past the Hudson rectangle Rect2f(-74.017,
    ..., 0.010, ...); shift those centers east or narrow the spread, or move the shoreline
    to the data.'
  - 'LM-01 (code): the data is built in loose lats/lons/cat_ids vectors and the axis
    limits are typed numbers, not the library prompt''s column constants + DataFrame
    data block with limits read from the data → a `# Columns` block (LAT, LON, CATEGORY),
    one `df = DataFrame(...)`, plot code reading df[!, LAT], limits from extrema of
    the data. Likely cause: the push! loop and limits = ((-74.017f0, -73.963f0), (40.702f0,
    40.760f0)).'
  - 'Suggestion: a Manhattan shoreline polygon in place of the two water rectangles
    would make the basemap read as a real coastline.'
  - 'Suggestion: a small size key (e.g. bubbles for 5 / 20 / 35 venues) would tie
    bubble area to the count without reading each label.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 page; the axis area is a beige land color with pale-blue Hudson River (left ~19 %) and East River (right ~28 %) rectangles, labelled in muted blue at 12 pt.
      Chrome: Title "map-marker-clustered · julia · makie · anyplot.ai" bold dark ink, centered; "Longitude" / "Latitude" axis titles dark; tick labels in INK_SOFT; only left and bottom spines; faint white street grid plus a subtle axis grid. Legend bottom-right on an elevated off-white box with a soft frame: Coffee Shop, Bakery, Tea House.
      Data: ~25 cluster bubbles (counts 4-37) sized by count, colored by dominant category in #009E73 (Coffee Shop), #C475FD (Bakery), #4467A3 (Tea House) at 80 % alpha with a matching stroke; white counts on green/blue, dark counts on lavender. About 14 individual markers at size 18 with a page-colored outline. Some solo markers and the 9 and 15 clusters sit in the Hudson River rectangle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 page; land is a dark olive-grey, both rivers deep navy, river labels in light muted blue.
      Chrome: Title, axis titles in light #F0EFE8; tick labels in light grey INK_SOFT; legend on dark elevated #242420 with light labels. No dark-on-dark text anywhere. Street grid drawn as dark lines on the land.
      Data: Categorical colors identical to the light render (#009E73, #C475FD, #4467A3); counts equally legible (dark on lavender, white on green and blue); solo markers outlined in the dark page color.
      Legibility verdict: PASS
