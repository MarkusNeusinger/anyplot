review:
  strengths:
  - 'Basemap built from Makie primitives: poly!(ax, Rect2f(...)) Hudson and East River
    strips, a block-spaced hlines!/vlines! street grid and per-theme land/water/street
    tokens, quieter than the markers in both themes'
  - Map extent, river strips, street grid and river labels all derive from extrema
    of the data, so every venue now sits on the drawn land between the two rivers
  - Cluster bubbles in the dominant category's color with a matching stroke, count
    text chosen per fill (dark on lavender, white on green and blue), every count
    legible in both themes
  - Library prompt's column-constant block (LAT, LON, CATEGORY) plus one DataFrame;
    plot code reads df[!, LAT] and category order follows Imprint positions 1-3
  - 'Simple seeded grid clustering: clusters at the mean of their members, cells with
    fewer than 4 venues drawn as individual markers at their own coordinates'
  weaknesses:
  - 'SC-02 (both): cluster bubble size saturates at the 72 px clamp for every count
    from about 20 up, so the 43, 29, 24, 21 and 20 clusters are drawn the same size
    and the largest group does not stand out (spec bullet C3) → size that keeps growing
    through the largest count, e.g. area proportional to count between about 28 and
    80 px. Likely cause: clamp(npts * 2.8 + 18, 28, 72), a linear diameter that hits
    the cap at npts ≈ 19.'
  - 'CQ-04 (code): lines 137-142 call hlines!/vlines! once per street line and lines
    177-191 call scatter!/text! once per cluster, where both accept vectors → one
    hlines!(ax, collect(y_lo:0.0025:y_hi)), one vlines!(...), one scatter! with per-cluster
    markersize/color vectors and one text! with a vector of counts. Likely cause:
    per-element loops around vectorized Makie calls.'
  - 'Suggestion: a shoreline polygon in place of the two straight water strips would
    read more like Manhattan''s real coastline.'
  - 'Suggestion: a small size key (bubbles for, say, 5 / 20 / 40 venues) would tie
    bubble area to count at a glance.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 page; the axis area is a beige land color with two equal pale-blue river strips (Hudson left, East right), labelled "Hudson River" / "East River" in muted blue at 12 pt.
      Chrome: Title "map-marker-clustered · julia · makie · anyplot.ai" in bold dark ink, centered; "Longitude" / "Latitude" axis titles dark; tick labels in INK_SOFT; left and bottom spines only; faint white street grid plus a subtle axis grid. Legend bottom-right on an elevated off-white box with a soft frame: Coffee Shop, Bakery, Tea House.
      Data: 17 cluster bubbles (counts 5-43) colored by dominant category in #009E73 (Coffee Shop), #C475FD (Bakery), #4467A3 (Tea House) at 80 % alpha with a matching stroke; white counts on green and blue, dark counts on lavender. About 16 individual markers at size 18 with a page-colored outline. Every marker sits on the land, none on the rivers. Bubbles for 20, 21, 24, 29 and 43 are the same size (clamped).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 page; land is a dark olive-grey, river strips deep navy, river labels in light muted blue.
      Chrome: Title and axis titles in light #F0EFE8; tick labels in light grey INK_SOFT; legend on the dark elevated #242420 box with light labels. No dark-on-dark text anywhere. Street grid drawn as dark lines on the land, quiet.
      Data: Categorical colors identical to the light render (#009E73, #C475FD, #4467A3); counts equally legible (dark on lavender, white on green and blue); solo markers outlined in the dark page color.
      Legibility verdict: PASS
