review:
  strengths:
  - map_data('state') basemap with themed land/water fills and hairline state boundaries
    stays quieter than the markers in both renders
  - Cluster area proportional to count via scale_size_area makes NYC, Chicago, LA
    and Texas stand out
  - Each cluster takes its dominant category color, as the Notes ask
  weaknesses:
  - 'VQ-01, SC-02 (light): the white ''1'' and ''2'' counts of the smallest clusters
    overflow their near-invisible markers onto the pale land and water and barely
    read → every count on its own filled marker. Likely cause: scale_size_area(max_size
    = 18) with no minimum size.'
  - 'VQ-03 (both): count-1/2 clusters shrink to near-zero-area dots, and the Venue
    Type legend keys are tiny dots → a minimum marker size (scale_size(range = c(4,
    18))) and legend keys at marker scale (guide_legend(override.aes = list(size =
    5))). Likely cause: scale_size_area and the default fill-guide key size.'
  - 'VQ-02 (both): the largest circles overlap their grid neighbours (64 over 15 and
    19, 39 over 16) → keep adjacent clusters clear with a smaller max size or a coarser
    grid. Likely cause: max_size = 18 against 3.5 deg grid spacing.'
  - 'SC-02, SC-03 (both): clusters are drawn at fixed 3.5 deg grid nodes, not at the
    center of their points, and single venues sit off their own coordinates, some
    in the ocean → mean lat/lon of each cluster''s members and own positions for singletons.
    Likely cause: aes(x = clon, y = clat).'
  - 'VQ-07 (both): the neutral third category Arts uses matte red #AE3030 → Imprint
    position 3 #4467A3. Likely cause: the IMPRINT vector.'
  - 'VQ-06 (both): ''Longitude''/''Latitude'' without a unit → add (°). Likely cause:
    labs().'
  - 'Suggestion: a size-legend break near the largest cluster (64) would make the
    top of the scale easier to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map panel in pale blue water with pale green US states and thin grey state boundaries (map_data('state')).
      Chrome: bold dark title 'Venue Clusters · map-marker-clustered · r · ggplot2 · anyplot.ai', axis titles Longitude/Latitude, grey ticks, subtle grid; legend cards Venue Type (tiny dots) and Venues (5/20/50 grey circles). Readable.
      Data: cluster markers on a regular 3.5 deg grid sized by area (scale_size_area), Music #009E73, Sports #C475FD, Arts #AE3030, white bold counts; count-1/2 clusters shrink to near-invisible dots so their white '1'/'2' labels sit on the pale map and barely read.
      Legibility verdict: PASS (chrome); small-cluster counts weak

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page, dark navy water, dark olive states with light boundaries.
      Chrome: light title, axis titles, ticks, legend text; no dark-on-dark text.
      Data: categorical colors identical to the light render; small-cluster white counts read better on the dark map but their markers are still near-invisible.
      Legibility verdict: PASS
