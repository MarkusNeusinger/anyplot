review:
  strengths:
  - Genuine pixel-space clustering algorithm rebucketed on afterSetExtremes, so clusters
    actually expand/collapse with zoom level as the spec requires — not a static pre-baked
    layout.
  - Dominant-category coloring plus a tooltip breakdown for mixed clusters, spider-line
    hover reveal, and click-to-zoom-to-extent are all wired through real Highcharts
    events/renderer calls — no faked interactivity.
  - Simplified Italy coastline outline gives real geographic basemap context without
    any add-on module, respecting the core-bundle-only constraint for this library.
  - 'Correct Imprint palette usage — first categorical series is #009E73, all four
    categories stay visually distinct, and theme tokens are threaded through every
    chrome element in both renders.'
  - 'Realistic, appropriately scaled synthetic data: 655 stores across 10 real Italian
    cities with per-city category skew, matching the spec''s 100-5000 point range
    and staying commercially neutral.'
  weaknesses:
  - Cluster circles in dense hubs (e.g. the Milan group with counts 3/12/34/8/6/78/17/10)
    touch and slightly overlap at their edges — increase CELL_PX or add a small minimum-gap
    nudge between nearby cluster centers so tightly-packed regions read more cleanly.
  - 'Cluster marker border (marker.lineWidth: 2, color t.ink) is noticeably heavier
    than the rest of the otherwise refined chrome (thin dotted gridlines, no spines)
    — a 1px border would match the overall visual weight better.'
  - The legend only shows plain circular swatches per category; it doesn't visually
    distinguish a cluster marker (larger, dark-bordered, with a count label) from
    an individual store dot, so a first-time viewer relies on the subtitle text alone
    to understand that distinction — consider a small caption or a distinct legend
    entry for clusters.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light theme.
      Chrome: Title "Store Locations Across Italy · map-marker-clustered · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle explaining drag/click/hover interactions in soft ink, longitude/latitude axes with °E/°N tick labels, dotted subtle gridlines, and a bottom legend with four category swatches (Electronics green, Grocery purple, Clothing blue, Home & Garden orange). A thin grey outline of mainland Italy and Sicily gives geographic basemap context. All text is clearly legible against the light background — no light-on-light issues found.
      Data: Clustered circles of varying radius sized by member count (numeric count label inside each cluster, e.g. "78", "61", "52"), colored by dominant category using the Imprint palette (green/purple/blue/orange), plus small unlabeled dots for un-clustered single stores. First series color is the brand green #009E73 (Electronics).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark theme.
      Chrome: Same title/subtitle/axis/legend content, now rendered in light ink/soft-ink tones against the dark background; gridlines and coastline outline switch to lighter, semi-transparent strokes so they remain visible without dominating. No dark-on-dark failures — all title, axis, tick, and legend text is clearly readable.
      Data: Identical cluster layout, radii, and category colors as the light render (green/purple/blue/orange data colors unchanged) — only chrome (background, text, grid, coastline, marker outline/label contrast color) adapts to the dark theme, confirming theme-adaptive tokens are correctly separated from data colors.
      Legibility verdict: PASS
