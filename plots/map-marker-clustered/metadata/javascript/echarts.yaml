review:
  strengths:
  - Real click-to-zoom plus scroll/drag interactivity driven by echarts dataZoom,
    not simulated
  - 'Uses the Imprint categorical palette in exact canonical order (brand green, lavender,
    blue, ochre) with the first series correctly on #009E73'
  - Custom screen-space union-find clustering re-runs on every zoom/pan so clusters
    genuinely split and re-merge instead of just rescaling fixed dots
  - Both renders are theme-correct with no legibility failures -- warm off-white/near-black
    backgrounds, readable chrome, identical data colors
  - Manual legend graphic correctly explains the dominant-color convention since per-point
    categories don't map to an ECharts series legend, and cluster tooltips reveal
    the full category breakdown to mitigate the dominant-only simplification
  - Low-fidelity but real, hardcoded US outline gives geographic basemap context despite
    the offline/no-CDN rendering constraint
  weaknesses:
  - 4 of the 7 visible clusters share the same dominant "Partner" (ochre) color, which
    reduces visual category diversity in this particular data draw -- a statistical
    artifact of the per-point RNG assignment, not a bug, but it flattens the color
    storytelling
  - The spec's optional "consider showing a convex hull or spider lines when hovering
    over clusters" affordance is not implemented -- not required, but would add polish
  - Basemap is an intentionally low-fidelity hardcoded outline (documented in-code
    as a tradeoff for the offline render harness) -- acceptable but coarse compared
    to real street/terrain context
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "map-marker-clustered · javascript · echarts · anyplot.ai" and subtitle "Scroll to zoom, drag a cluster into view, click a cluster to expand it" are dark, centered, and fully legible. Right-side "Store type" legend (Flagship/Outlet/Kiosk/Partner) and explanatory caption text are dark ink on the light background, clearly readable. A thin gray US outline gives geographic context.
      Data: Seven circular cluster markers of varying size (sqrt-scaled by count) sit over their metro locations, each labeled with a white bold count number with a dark text border for contrast. Colors: teal/green (Flagship, #009E73) top-left (Seattle, 21), blue (Kiosk) far-left (LA, 46), two ochre/brown (Partner) markers mid-map (Chicago 36, Denver 17), purple/lavender (Outlet) right (NY, 58), and two more ochre (Partner) markers lower-right (Houston 31, Miami 26).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, subtitle, legend text, and caption all render in light ink, fully legible against the dark background -- no dark-on-dark failures observed. The US outline switches to a light gray stroke, still subtle but visible.
      Data: Same seven clusters, same positions, same sizes, and confirmed identical data colors to the light render (teal, blue, ochre x4, purple) -- only chrome (background, outline, text) flipped as expected.
      Legibility verdict: PASS
