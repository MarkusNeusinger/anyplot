review:
  strengths:
  - Donut-ring cluster glyph now encodes the full category mix per cluster (canonical
    angular order, hole punched to page background for a legible count) instead of
    a single dominant color — directly resolves the attempt-1 DE-03 weakness without
    requiring hover
  - Real click-to-zoom plus scroll/drag interactivity driven by echarts dataZoom,
    not simulated; clusters genuinely re-split and re-merge via screen-space union-find
    clustering re-run on every zoom/pan
  - 'Uses the Imprint categorical palette in exact canonical order (brand green, lavender,
    blue, ochre), first series correctly on #009E73'
  - Both renders are theme-correct with no legibility failures — warm off-white/near-black
    backgrounds, readable chrome, identical data colors between light and dark
  - Manual legend graphic correctly explains the ring-segment convention since per-point
    categories don't map to an ECharts series legend; tooltip still exposes the exact
    numeric breakdown on hover
  - Low-fidelity but real, hardcoded US outline gives geographic basemap context despite
    the offline/no-CDN rendering constraint
  weaknesses:
  - The smallest cluster (Denver, count=17) has a small outer radius, so its four
    ring segments are thin and slightly harder to distinguish at a glance than on
    the larger clusters, though the center count label stays legible
  - The spec's optional 'consider showing a convex hull or spider lines when hovering
    over clusters' affordance is still not implemented — not required, but would add
    polish
  - Basemap remains an intentionally low-fidelity hardcoded outline (documented in-code
    as a tradeoff for the offline render harness) — acceptable but coarse compared
    to real street/terrain context
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "map-marker-clustered · javascript · echarts · anyplot.ai" and subtitle "Scroll to zoom, drag a cluster into view, click a cluster to expand it" render in dark ink, centered, fully legible. Right-side "Store type" legend (Flagship/Outlet/Kiosk/Partner swatches) plus an explanatory caption about the ring-segment convention render in dark ink, clearly readable. Thin gray US outline gives geographic context.
      Data: Seven donut-ring cluster glyphs, sqrt-scaled by count, sit over their metro locations. Each ring is split into segments in canonical category order (green=Flagship, purple=Outlet, blue=Kiosk, ochre=Partner) sized by that category's share of the cluster, with a page-background-colored hole in the center holding a bold count label (e.g. 58 for New York, 46 for LA, 36 for Chicago, 31 for Houston, 26 for Miami, 21 for Seattle, 17 for Denver). First categorical color confirmed as #009E73 (Flagship). No stray singleton markers are visible at this zoom level — all points collapse into the seven metro clusters, as expected for the full-US view.
      Legibility verdict: PASS — all text is readable against the light background; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, subtitle, legend text, and caption all render in light ink, fully legible — no dark-on-dark failures. The US outline switches to a light gray stroke, still subtle but visible.
      Data: Same seven cluster glyphs, same positions, sizes, and ring-segment proportions; colors confirmed identical to the light render (green, purple, blue, ochre) — only chrome (background, outline, text) flipped, as expected. The ring hole matches the dark page background so count labels stay legible on the dark surface too.
      Legibility verdict: PASS — all text is readable against the dark background; no dark-on-dark failures detected.

    Both renders confirm the Imprint data colors are unchanged across themes and only chrome elements adapt.
