review:
  strengths:
  - Cluster markers sized in three count tiers and colored by dominant store format
    through a zAxis ordinal colorMap, with the count centered on each marker in ink
    chosen by fill luminance (light text on the blue Kiosk cluster, dark on green/purple)
  - Equal-distance framing scales longitude by cos(latitude), so the Pacific Northwest
    geography is not stretched
  - Quiet basemap — tinted Pacific and Puget Sound plus dashed Canada and WA/OR borders
    at low opacity — stays behind the markers in both themes, drawn via useXScale/useYScale
    in data coordinates
  - Category and cluster-size legends name both encodings; item tooltip adds detail
    in the HTML
  weaknesses:
  - 'SC-02, VQ-02 (both): the fixed lat/lon grid (LAT_CELL 0.55°, LON_CELL 0.75°)
    splits single metro areas along cell edges into several touching or overlapping
    clusters — Seattle into 34 + 17 + 4 + 4, Bellingham into 15 + 3 (the 3 sits half
    under the 15), Eugene into 6 + 4 + 3 + 3 — so nearby points are not merged → merge
    clusters whose markers would overlap (e.g. distance-based clustering in pixel
    space, or merge adjacent cells whose centroids lie within one large-marker diameter).
    Likely cause: Math.floor grid keys in the cells Map.'
  - 'SC-02 (code): the Notes ask for click-to-zoom on clusters; the HTML only offers
    a tooltip, and the clustering is fixed at one level → handle ScatterPlot onItemClick
    with React state that narrows the axis min/max around the clicked cluster and
    recomputes clusters at a smaller cell size. Likely cause: no click handler or
    zoom state.'
  - 'VQ-05 (both): the 7+ stores size-legend circle (54 px diameter) fills the 56
    px legend band and touches the bottom canvas edge → leave ~10 px of bottom margin
    (LEGEND_HEIGHT +12 px, or a smaller legend glyph). Likely cause: LEGEND_HEIGHT
    = 56 with SIZE_LEGEND diameter 2 × MARKER_SIZE.large.'
  - 'Suggestion: the eastern third of the map (119–118°W) is nearly empty; tightening
    the longitude framing would give the clusters more room.'
  - 'Suggestion: faint city or state labels on the basemap would anchor the geography
    for readers who do not know the coastline.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: centered bold title 'TrailBrew Coffee Co. · map-marker-clustered · javascript · muix · anyplot.ai'; y axis 44°N–49°N with title 'Latitude (°)', x axis 126°W–118°W with title 'Longitude (°)'; subtle grid; dark ink text, all readable. Bottom legend: 'Store format:' Flagship/Standard/Kiosk swatches and 'Cluster size:' 1 store / 2–6 stores / 7+ stores grey circles (largest touches bottom edge).
      Data: Pacific Ocean and Puget Sound tinted light grey, dashed borders at 49°N and 46°N. Cluster markers in three sizes with bold counts: green #009E73 (15, 4, 17, 34, 4, 4, 2), purple (3, 2, 10, 4, 27, 6, 4, 3, 3), blue (22, light count text); small single-store dots scattered. Adjacent clusters overlap near Bellingham and Eugene.
      Legibility verdict: PASS

