review:
  strengths:
  - Deterministic, well-commented clustering pipeline (grid-based spatial binning
    + an explicit overlap-resolution pass that converts pixel-space bubble separation
    back through the axis scale) that produces a genuinely non-overlapping, size-accurate
    cluster map.
  - Idiomatic use of MUI X's composable chart API and useXScale/useYScale hooks to
    layer custom SVG (geographic backdrop, count labels) directly in the chart's coordinate
    space.
  - Correct Imprint palette usage including a well-judged semantic exception (water
    -> blue) and a clear, well-organized custom legend explaining both color and size
    encodings.
  - Identical data colors and fully legible theme-adaptive chrome across both light
    and dark renders.
  weaknesses:
  - Several x- and y-axis tick labels are duplicated (e.g., '49°N' appears twice,
    '48°N' appears twice) because valueFormatter's Math.abs(v).toFixed(0) rounds two
    distinct 0.5°-spaced gridline values to the same integer -- reduce the tick step
    to whole degrees (or show one decimal) so every rendered label is unique.
  - The Puget Sound backdrop polygon (PUGET_SOUND array in GeographicBackdrop) renders
    as a self-intersecting, twisted ribbon shape rather than a recognizable water-body
    outline -- the listed points don't trace a simple non-self-intersecting perimeter
    when connected in order; reorder them to follow the actual coastline consistently
    (e.g., clockwise around the inlet) so the filled polygon doesn't cross itself.
  - The rotated 'Latitude (°)' axis title sits very close to / slightly overlaps the
    '47°N' tick label near the vertical center of the y-axis in both renders -- increase
    the left margin slightly or add axis label offset spacing to separate them.
  - '''Smooth zoom transitions'' and ''click-to-zoom'' cluster expand/collapse from
    the spec are not implemented (a fixed single clustering level is shown); acceptable
    given MUI X community''s lack of an interactive re-clustering framework, but worth
    a brief code comment acknowledging the trade-off.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Dark title, dark axis titles/tick labels, all clearly readable against the cream background. Legend below the chart (store format colors + cluster size bubbles) also dark/readable.
      Data: Bubble scatter map of Pacific NW coffee-store locations. First category (Flagship) is #009E73 green, Standard is lavender, Kiosk is blue -- matches canonical Imprint order. Cluster count labels drawn in a cream/off-white fill centered on bubbles, legible against the saturated bubble colors.
      Legibility verdict: PASS, with two non-legibility defects noted separately: (1) duplicate axis tick labels (e.g. "49°N" appears twice) from integer-rounding of 0.5°-spaced ticks, (2) the Puget Sound backdrop polygon self-intersects and renders as a twisted ribbon shape instead of a coastline outline.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, axis titles, and tick labels flip to light ink and are fully legible against the dark background. No dark-on-dark failures found anywhere (title, axis labels, ticks, legend all check out).
      Data: Colors identical to the light render (green/lavender/blue unchanged) -- confirmed via side-by-side comparison. Cluster count labels use fill=t.pageBg, which in dark mode is near-black text sitting on the bright bubble fills; this remains legible because the bubble hues are much lighter than the near-black page background, so it reads correctly despite not being literally "white text".
      Legibility verdict: PASS. Same duplicate-tick-label and self-intersecting-polygon issues persist identically, confirming both are code/geometry bugs rather than theme-specific rendering failures.
