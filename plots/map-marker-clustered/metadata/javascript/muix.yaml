review:
  strengths:
  - Grid-cell clustering computed from the data, with cluster color set to each cell's
    dominant store format through an ordinal zAxis colorMap — a native MUI X way to
    drive category color from data
  - Three-tier marker size (single store, 2–6, 7+) with the count printed on every
    cluster makes the Seattle (34), Portland (27) and Tacoma (22) groups stand out
    immediately
  - Composed ChartsContainer with custom SVG layers (GeographicBackdrop, ClusterCountLabels)
    drawn through useXScale/useYScale, so the basemap and labels share the chart's
    scales exactly
  - Combined two-part legend names both store formats and the cluster size tiers,
    with size glyphs visible in both themes
  - Plausible fictional scenario (TrailBrew Coffee Co. stores around Pacific Northwest
    cities, 179 points) generated deterministically with a seeded LCG; ChartsTooltip
    adds item inspection in the HTML
  - 'Theme chrome threaded through tokens: title, axis labels, ticks, grid and legend
    text are readable in both renders'
  weaknesses:
  - 'SC-03, SC-02 (both): a 40-pass pairwise collision relaxation pushes cluster and
    single-store markers apart by up to ~34 px each (radius 30 + 30 + 8 px gap) after
    the clusters are computed, so markers no longer sit at the centroid of their members
    or at their own lat/lon (violates the ''A good version shows: each cluster marker
    at the center of the points it stands for'' bullet) → draw every marker at its
    computed centroid; if large clusters touch, use a coarser grid cell (LAT_CELL/LON_CELL)
    or smaller cluster radii instead. Likely cause: the `for (let pass = 0; pass <
    40; pass++)` relaxation loop, lines 133–157.'
  - 'SC-03 (both): the map is stretched about 3.3× east–west: one degree of longitude
    spans ~278 px while one degree of latitude spans ~121 px, but at ~46°N a longitude
    degree is only ~0.69 of a latitude degree (target px/lat ÷ px/lon ≈ 1.45, observed
    ≈ 0.44), so the coastline, Puget Sound and the cluster spacing are geographically
    distorted → fix the aspect so px/° lat ≈ px/° lon ÷ cos(mean latitude), e.g. widen
    the longitude range or narrow the plot area to match. Likely cause: LON_RANGE/LAT_RANGE
    both fitted to the full chart width and height independently.'
  - 'VQ-01 (dark): cluster count labels are filled with t.pageBg, which is near-black
    #1A1A17 in the dark theme; the 11 px counts on the purple and blue markers (e.g.
    ''22'' on Kiosk blue, ''2''/''3'' on Standard purple) read as dark-on-mid-tone
    with weak contrast → white-ish text (#FAF8F1 in both themes, or ink chosen per
    marker luminance) at about 13 px for small clusters (+2 px). Likely cause: `fill={t.pageBg}`
    and `fontSize={c.count > 6 ? 13 : 11}` in ClusterCountLabels.'
  - 'VQ-07 (both): the ocean and Puget Sound fills use t.palette[2], the same Imprint
    data color that encodes the Kiosk category, so non-data basemap chrome shares
    a hue with a data series (style guide: non-data elements use theme-adaptive tokens)
    → fill the water with a theme-adaptive neutral such as the muted anchor or t.grid
    at low opacity. Likely cause: `const waterColor = t.palette[2]` in GeographicBackdrop.'
  - 'CQ-04 (code): the 25-line collision loop (lines 133–157) and the duplicated tickLabelStyle/labelStyle
    settings (set both in the xAxis/yAxis configs, lines 337–338 and 350–351, and
    again on <ChartsXAxis>/<ChartsYAxis>, lines 364–365) add code with no needed effect
    → delete the loop and keep the styles in one place. Likely cause: layout workaround
    and redundant axis styling.'
  - 'CQ-01 (code): helper functions dominantCategory and radiusPxFor (lines 103–126)
    wrap one-off logic that could be inlined; the two React layer components are needed
    for the scale hooks, the helpers are not → inline the dominant-category reduce
    into the cluster map and drop radiusPxFor along with the collision loop. Likely
    cause: helper extraction.'
  - 'Suggestion: label the major hubs (Seattle, Portland, Eugene) or the state names
    quietly on the basemap to give the geography more context.'
  - 'Suggestion: a thin page-colored outline on cluster markers would separate the
    Seattle-area clusters more crisply over the Puget Sound fill.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title "TrailBrew Coffee Co. · map-marker-clustered · javascript · muix · anyplot.ai" centered at top (~42% width); y-axis "Latitude (°)" with ticks 44°N–49°N, x-axis "Longitude (°)" with ticks 124°W–120°W; subtle gray grid; dashed gray lines at 49°N (Canada border) and 46°N (WA/OR border); a schematic gray-blue Pacific coastline polygon on the left and a Puget Sound polygon near Seattle. Bottom HTML legend: "Store format: Flagship / Standard / Kiosk" and "Cluster size: 1 store / 2–6 stores / 7+ stores" with gray size circles. All text dark and readable.
      Data: circles in three sizes — large clusters 34, 17, 15 (green), 22 (blue), 27, 10 (purple); small clusters 2–6 with white counts; small single-store dots scattered. First category Flagship is brand green #009E73, Standard purple, Kiosk blue. Counts in page-colored text on markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis labels, tick labels and legend text in light ink, all readable; grid and dashed borders subtle light gray; water polygons render as a dark slate fill.
      Data: marker colors and positions identical to the light render (green, purple, blue). Cluster counts switch to near-black page color — readable on green and purple but low-contrast on the Kiosk blue "22" and on the 11 px small-cluster counts.
      Legibility verdict: PASS (with weak count-label contrast on mid-tone markers, flagged under VQ-01)
