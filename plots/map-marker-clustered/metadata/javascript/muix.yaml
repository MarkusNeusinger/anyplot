review:
  strengths:
  - 'Grid-based proximity clustering is genuinely computed (not faked): stores are
    grouped into lat/lon cells, centroids and dominant categories are derived, and
    bubble radius scales with member count (individual/small-cluster/large-cluster
    tiers)'
  - Custom SVG overlay (ClusterCountLabels) uses useXScale/useYScale to draw exact
    count labels centered on each cluster bubble at the live axis scale, a sophisticated
    compositional use of ChartContainer beyond the simplified ScatterChart wrapper
  - Reproducible seeded LCG (seed 42) with no Math.random(), and a two-part legend
    (store format by color, cluster size by bubble diameter) that clearly documents
    the encoding
  - 'Theme handling is correct and clean: Imprint palette positions 1-3 used in canonical
    order for the three store categories, backgrounds and chrome are theme-correct
    in both renders, and the cluster count text color (t.pageBg) intelligently stays
    legible against the colored bubbles in both themes'
  weaknesses:
  - No basemap or geographic context of any kind (no coastline/land-ocean shading,
    no state/country boundaries, no place labels) — the spec's Notes explicitly require
    'a basemap with appropriate geographic context (boundaries, streets, or terrain)'.
    Right now the chart reads as a generic bubble scatter with axes labeled 'Longitude
    (deg)'/'Latitude (deg)'; without prior knowledge of Pacific Northwest coordinates
    a reader cannot tell this is a map. Since MUI X has no tile/geo layer, add a lightweight
    static approximation the way the matplotlib version does (theme-adaptive ocean/land
    background fill plus a simple state-boundary line), reusing the same custom-SVG-overlay
    technique already proven in ClusterCountLabels.
  - Several cluster bubbles visibly overlap (the '13' and '9' clusters near -122.7/45.5-46,
    and the '16'/'3' clusters near -123/46) so the smaller cluster's circle is partly
    hidden behind the larger one — reduce LAT_CELL/LON_CELL slightly or nudge overlapping
    centroids apart so every bubble's full circumference stays visible.
  - Axis tick labels use bare negative degrees ('-125°', '-122°') instead of conventional
    geographic notation (e.g. '125°W', '49°N') — the latter reads more naturally as
    a map and reduces the need to mentally negate longitude values.
  - Cluster-size legend swatch diameters (9/19/30 px) don't quite match the actual
    chart's markerSize values (7/17/30) — align the two so the legend accurately previews
    on-chart bubble sizes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) plot background, correct per style guide.
      Chrome: Title "TrailBrew Coffee Co. · map-marker-clustered · javascript · muix · anyplot.ai" in dark ink, clearly readable and appropriately sized; axis labels "Longitude (°)" / "Latitude (°)" and tick labels ("-125°"..."49°") in soft dark gray, all legible; subtle light gridlines visible without dominating; two-row footer legend (store format by color, cluster size by bubble diameter) fully readable in dark ink/soft ink.
      Data: Flagship=#009E73 (green, first series, correct), Standard=lavender/purple, Kiosk=blue — canonical Imprint order; bubble sizes scale from small individual dots to large 7+ store clusters; white/cream count numbers rendered inside colored bubbles, legible against every bubble color; a few adjacent cluster bubbles partially overlap (e.g. "13"/"9" near -122.7°, "16"/"3" near -123°) but counts remain readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) plot background, correct per style guide.
      Chrome: Title flips to light cream text, clearly readable; axis labels and tick labels flip to light gray, all legible; no dark-on-dark failures anywhere — gridlines, axis lines, and legend text all remain visible against the dark surface.
      Data: Colors identical to the light render (green/lavender/blue), confirming the categorical data palette does not shift between themes; cluster count numbers render in dark ink against the colored bubbles (same t.pageBg-based fill logic, correctly inverted for the dark theme) and stay legible; the same bubble overlaps present in the light render persist here but do not affect legibility.
      Legibility verdict: PASS
