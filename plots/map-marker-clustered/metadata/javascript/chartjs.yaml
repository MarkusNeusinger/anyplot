review:
  strengths:
  - Deterministic, seeded synthetic data generation (LCG) with plausible retail-store
    scenario and realistic US metro coordinates.
  - Correct Imprint palette assignment (Flagship=#009E73 always first) and fully theme-correct
    chrome in both renders — no legibility failures.
  - Custom beforeDatasetsDraw/afterDatasetsDraw Chart.js plugins produce a serviceable
    geographic backdrop and in-bubble count labels without any fake/simulated interactivity.
  weaknesses:
  - The implementation renders a single static clustering state and never engages
    Chart.js's onClick/interaction hooks — none of the spec's defining interactive
    behaviors (zoom-level-dependent re-clustering, smooth zoom transitions, click-to-expand
    a cluster into its member markers, hover-driven spider lines/convex hull) exist
    anywhere in the code, even for the interactive HTML detail view. Add a click handler
    on cluster bubbles that re-runs the existing CLUSTER_RADIUS_DEG-based grouping
    at a tighter radius (or reveals the underlying stores for that region) so the
    HTML output demonstrates real cluster-to-marker drill-down, since this is checked
    in the HTML output, not just the static PNG.
  - The hand-drawn US outline is visibly polygonal/low-fidelity (jagged, straight-segment
    coastline) — increase the number of coordinate points or smooth the path for a
    more convincing basemap, since this is the primary geographic-context element
    the spec calls for.
  - Axis titles ('Longitude'/'Latitude') carry no unit text; consider 'Longitude (°)'
    / 'Latitude (°)' to match VQ-06's full-credit bar, since the current unit hint
    only lives in the tick formatter.
  - Title occupies only ~35% of canvas width for a title this length — there is headroom
    to grow the title fontsize slightly for better visual weight without risking overflow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white.
      Chrome: Title "map-marker-clustered · javascript · chartjs · anyplot.ai" in dark ink at top; "Longitude"/"Latitude" axis titles and degree-suffixed tick labels dark-on-light; bottom legend (Flagship/Standard/Outlet) fully readable. All chrome clearly legible.
      Data: Eight bubbles over a hand-drawn US outline at real metro locations, colored green (#009E73, Flagship), lavender (Standard), or blue (Outlet) by dominant category, each with a bold white count label centered inside (e.g. "35", "65", "80"). First series confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black.
      Chrome: Title, axis titles, tick labels, and legend text all flip to light ink and remain fully readable. US outline renders as a dark charcoal fill with a lighter grey stroke, still distinguishable from the page background. No dark-on-dark failures found.
      Data: Bubble fill colors (green/lavender/blue) and white count labels are pixel-identical to the light render — only chrome flipped, confirming Imprint palette consistency across themes.
      Legibility verdict: PASS
