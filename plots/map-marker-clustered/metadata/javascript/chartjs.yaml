review:
  strengths:
  - 'Real interaction now implemented via onClick/onHover: clicking a cluster re-runs
    buildClusters at a tighter CLUSTER_RADIUS_DEG/3 over just that cluster''s members
    and recentres the view (applyView), and clicking empty space resets to the full
    continental view — the spec''s zoom-dependent clustering and click-to-expand requirements
    are genuinely functional in the interactive HTML output, not faked.'
  - Hover now drives a live spiderLinesPlugin connecting the hovered cluster centroid
    to every member point, directly matching the spec's 'spider lines when hovering
    over clusters' suggestion, with a pointer cursor swap for affordance.
  - US basemap outline is now smoothed via quadratic-curve-through-midpoints instead
    of raw straight segments, reading as a legitimate basemap rather than a jagged
    polygon, in both themes.
  - Axis titles now carry explicit unit suffixes ('Longitude (°)' / 'Latitude (°)')
    matching the degree-suffixed tick labels.
  - Deterministic, seeded synthetic data (LCG) with a plausible multi-hub retail scenario;
    correct Imprint palette assignment (Flagship=#009E73 first, Standard/Outlet following
    canonical order) and fully theme-correct chrome in both renders.
  weaknesses:
  - Title still occupies only ~35-36% of canvas width at font size 24 for a 55-char
    string — well under the ~70-85% expected for the mandated title format; grow the
    title font size for better visual weight (this was flagged in the prior review
    and not addressed this attempt).
  - The 'zoom-dependent' clustering is really a discrete click-to-drill re-cluster
    (radius / 3 per click, reset on empty-space click) rather than a continuous zoom-level
    response — reasonable given Chart.js has no native map/zoom widget, but it does
    not literally track a zoom level.
  - 'DQ-01/DE-03: the static PNG only shows one clustering state, so cluster splitting/merging
    and the hover spider-lines/click-drill story are only demonstrable in the HTML
    detail view, not the gallery thumbnail — acceptable per the interactive-library
    fairness rule, but still limits the at-a-glance storytelling of the static preview.'
  - Gridlines (0.5px, low alpha) are present across the whole map area and add minor
    visual clutter over the landmass fill; consider dropping the cartesian grid entirely
    for a cleaner basemap look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec - not pure white.
      Chrome: Title "map-marker-clustered · javascript · chartjs · anyplot.ai" in dark ink at top (though narrow relative to canvas width); "Longitude (°)"/"Latitude (°)" axis titles now carry unit suffixes; degree-suffixed tick labels; bottom legend (Flagship/Standard/Outlet) fully readable. All chrome clearly legible against the light background.
      Data: Eight bubbles over a smoothed US outline at real metro locations, colored green (#009E73, Flagship), lavender (#C475FD, Standard), or blue (#4467A3, Outlet) by dominant category, each with a bold white count label centered inside (e.g. "35", "65", "80"). First series confirmed #009E73. Bubble radii scale with sqrt(cluster count).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec - not pure black.
      Chrome: Title, axis titles (with unit suffixes), tick labels, and legend text all flip to light ink and remain fully readable. US outline renders as a dark charcoal fill with a lighter grey stroke, still distinguishable from the page background. No dark-on-dark failures found.
      Data: Bubble fill colors (green/lavender/blue) and white count labels are pixel-identical to the light render - only chrome flipped, confirming Imprint palette consistency across themes.
      Legibility verdict: PASS
