review:
  strengths:
  - 'EMV rollback math is verified correct at every node: c1 = 0.6×395 + 0.4×(-100)
    = 197, c2 = 0.7×500 + 0.3×150 = 395, c3 = 0.5×120 + 0.5×40 = 80, and the root
    correctly rolls up to 197 as the max of the three top-level options.'
  - 'Excellent data storytelling: the optimal decision path (Launch Full → High Demand
    → Expand → Continues) is drawn full-opacity and solid, while every pruned/rejected
    alternative is faded, dashed, and marked with a red cross — the reader immediately
    sees the recommended path.'
  - Distinct node shapes (square/circle/right-pointing triangle) plus the canonical
    Imprint palette order (decision=#009E73, chance=#C475FD, terminal=#4467A3) give
    redundant, colorblind-safe encoding beyond hue alone.
  - 'Theme-adaptive chrome is correct in both renders — identical data colors, correct
    #FAF8F1/#1A1A17 backgrounds, and readable ink/inkSoft text in both themes.'
  - 'Idiomatic Chart.js extension: uses the library''s plugin hook (afterDatasetsDraw)
    to draw branch labels, EMV/payoff text, and pruned cross-marks, rather than faking
    the tree with an incompatible chart type.'
  weaknesses:
  - 'Whitespace is unevenly distributed: there is a large empty pocket in the bottom-right
    quadrant of the canvas (right of the pruned ''Maintain'' branch, below ''Expand''),
    while content clusters left/center — tighten vertical leaf spacing or rebalance
    the layout so the tree fills the canvas more evenly.'
  - Branch-probability annotation text (13px, e.g. 'High Demand (60%)') is the smallest
    text on the chart yet carries the most critical numeric information — increase
    it by 1-2px so probabilities stay legible when the PNG is scaled down to ~400px
    mobile width.
  - A few helper/recursive functions (layout(), withAlpha(), fmtMoney(), edgeLabel())
    are used — reasonably justified by the tree-layout computation, but slightly beyond
    a pure top-to-bottom KISS script; consider inlining where feasible without hurting
    readability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — matches spec, not pure white.
      Chrome: Title "tree-decision · javascript · chartjs · anyplot.ai" in dark ink, top-right legend (Decision/Chance/Terminal (payoff)) in dark ink, all clearly readable. Branch labels, EMV/payoff text, and the footnote ("✕ dashed, faded branch = pruned (rejected) option") render in soft dark ink — all legible against the light background.
      Data: Decision nodes are green (#009E73) squares, chance nodes are lavender (#C475FD) circles, terminal nodes are blue (#4467A3) right-pointing triangles — first series is correctly brand green. The optimal path (Launch Full → High Demand → Expand → Continues, EMV $197K → $395K) is drawn solid/full-opacity; pruned alternatives (Launch Regional, Don't Launch, Maintain) are faded, dashed, and marked with a red ✕.
      Legibility verdict: PASS (all text readable; smallest text — 13px branch-probability labels — is legible at full resolution but would benefit from a slight size bump for mobile scaling).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — matches spec, not pure black.
      Chrome: Title and legend render in light ink (near-white), fully readable against the dark background. Branch labels, EMV text, and the footnote render in light-grey ink — no dark-on-dark failures observed anywhere.
      Data: Same green/lavender/blue node colors and red pruned cross-marks as the light render — confirmed identical to light (only chrome flipped, as required). Optimal path still traced solid/full-opacity vs. faded/dashed pruned branches.
      Legibility verdict: PASS (no dark-on-dark text; all chrome elements correctly flipped to light-on-dark).
