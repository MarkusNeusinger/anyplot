review:
  strengths:
  - Excellent EMV rollback correctness — every displayed EMV matches the probability-weighted
    calculation from its children (e.g. c1 = 0.6*395 + 0.4*(-100) = 197, c2 = 0.7*500
    + 0.3*150 = 395, c3 = 0.5*120 + 0.5*40 = 80), and all chance-node probabilities
    sum to exactly 1.0
  - 'Outstanding data storytelling: the optimal path (Launch Full -> High Demand ->
    Expand) reads as solid/full-opacity while every rejected branch is simultaneously
    dashed, faded (alpha 0.3-0.4), and cross-marked with a semantically correct matte-red
    (#AE3030) X — triple redundant encoding that makes the optimal path immediately
    obvious without reading a single label'
  - 'Correct node-shape mapping per spec: squares for decision, circles for chance,
    right-pointing triangles (pointRotation: 90) for terminal — plus distinct Imprint
    colors per type (palette[0]/[1]/[2]) for a second, independent identification
    channel'
  - 'Clever engineering to render a tree diagram natively in Chart.js: a custom recursive
    layout function computes post-order (x, y) coordinates, a scatter chart carries
    the node/edge geometry, and an afterDatasetsDraw plugin renders branch labels,
    EMV/payoff text, and pruned cross-marks — all through Chart.js''s supported plugin
    API, no unpinned dependency or workaround'
  - Right-aligning shallow terminal nodes into one outcome column via faint dotted
    leader lines is a thoughtful layout touch that avoids ragged empty pockets in
    the tree while keeping the leader visually subordinate (alpha 0.22) to real tree
    edges
  - 'Palette usage is fully compliant and semantically sound in both themes: #009E73
    for decision (first series), #C475FD for chance, #4467A3 for terminal, matte red
    #AE3030 reserved for the pruned/rejected semantic role — verified identical across
    plot-light.png and plot-dark.png with only chrome (background, text) flipping'
  - 'All spec data fields are represented and legible: branch_label, probability (formatted
    as e.g. "High Demand (60%)"), payoff (fmtMoney), emv, pruned — with decision-branch
    labels showing option names and chance-branch labels showing probability, exactly
    as the spec''s Notes section specifies'
  weaknesses:
  - 'Text density is high for a ~5.76M-pixel canvas scaled to mobile (~400px width):
    12 node labels plus 11 branch labels at 12-15px CSS mount size will compress significantly
    on a phone screen — consider a touch more vertical spacing between the tightly-packed
    terminal rows (e.g. around the c2/d2 cluster) if a future revision revisits layout.'
  - The tree-layout logic (recursive `layout()` function, `withAlpha`/`fmtMoney`/`edgeLabel`
    helpers) departs from the strict KISS 'imports -> data -> plot -> save, no functions'
    pattern; this is justified here since Chart.js has no native tree-diagram primitive,
    but keep it in mind as a deliberate exception rather than a default pattern for
    simpler chart types.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "tree-decision · javascript · chartjs · anyplot.ai" in dark ink at top center; legend top-right with three swatches (green square "Decision", lavender circle "Chance", blue triangle "Terminal (payoff)"); footnote bottom-left explaining the pruned-branch convention. All chrome text is dark and clearly legible against the light background.
      Data: A left-to-right decision tree — root decision node (green square, EMV $197K) branches via solid "Launch Full" edge to a chance node (lavender circle, EMV $197K), which splits 60%/40% into a further decision node (EMV $395K, chooses "Expand" over faded/pruned "Maintain") and a terminal payoff of -$100K. The "Expand" chance node (EMV $395K) resolves 70%/30% into terminal payoffs of $500K and $150K. Two further options off the root — "Launch Regional" (chance node EMV $80K) and "Don't Launch" (terminal $0K) — are rendered dashed, faded (~30-40% opacity), and each carries a matte-red ✕ cross mark, clearly signaling the rejected branches. Node colors are Imprint: #009E73 (decision), #C475FD (chance), #4467A3 (terminal). Faint dotted leader lines bridge shallower terminal nodes out to a common right-aligned outcome column.
      Legibility verdict: PASS — every title, legend entry, branch label, EMV/payoff annotation, and the footnote is clearly readable against the light background; even the intentionally de-emphasized pruned-branch text remains legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and footnote content, now rendered in light ink (white/near-white) — clearly visible against the dark background. No dark-on-dark text was found anywhere in the render.
      Data: Identical tree structure and identical node/edge colors to the light render (#009E73 / #C475FD / #4467A3, matte-red ✕ marks on pruned branches) — only the chrome (background, text ink) has flipped as required. The faded/pruned nodes and edges remain distinguishable from the active path against the dark background.
      Legibility verdict: PASS — all text (title, legend, node/edge labels, footnote) is rendered in light ink and reads clearly against the near-black background; no dark-on-dark or light-on-light failures observed.
