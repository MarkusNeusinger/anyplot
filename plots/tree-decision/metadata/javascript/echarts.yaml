review:
  strengths:
  - 'EMV rollback is arithmetically correct at every node: c2 = 0.3(150) + 0.7(850)
    = 640, c1 = 0.4(-80) + 0.6(640) = 352, d1 = max(352, 0) = 352 — all verified by
    hand against the rendered labels'
  - 'Pruned/optimal-path storytelling is genuinely effective: the winning path is
    solid dark lines with full opacity, rejected branches are dashed, faded (opacity
    0.4-0.6), and the footnote spells out the convention — a viewer immediately sees
    the recommended decision without reading the numbers'
  - Correct node-shape mapping (square/circle/right-pointing triangle for decision/chance/terminal)
    via ECharts symbol + symbolRotate, with hand-tuned fixed x/y coordinates that
    avoid any label collisions across a 9-node, 4-level tree
  - 'Idiomatic use of the graph series for a genuinely graph-shaped chart type: categories
    wired into the legend, rich-text label formatter (bold name + smaller EMV/payoff
    line) for information hierarchy, edgeSymbol arrows on links'
  - 'Clean mount-node contract: chart.on(''finished'', ...) sets window.__anyplotReady
    before the harness screenshots, animation disabled, no explicit width/height/devicePixelRatio
    passed to echarts.init'
  weaknesses:
  - Spec asks pruned branches to be marked with 'a double-strike or cross mark AND
    reduced opacity or a dashed line' — the implementation only does the dashed+faded
    half; add a small cross/X glyph near the pruned edge midpoint (or on the de-emphasized
    terminal node) for a more literal match, even though the footnote caption already
    communicates the convention
  - Tree has 9 nodes, at the low end of the spec's '10-30 nodes typical' guidance
    — a slightly richer example (e.g. a third decision stage, or a second chance branch
    off d2) would show more of the schema's range in one view
  - Node markers (52px decision/chance, 40px terminal) are on the modest side given
    how sparse the tree is (9 nodes) and how much canvas is available — could go slightly
    larger (~60-64px) to use the generous whitespace more assertively
  - Legend row sits close under the title (top:70 vs title top:24+22px) — a touch
    more vertical breathing room between them would read cleaner
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "tree-decision · javascript · echarts · anyplot.ai" centered at top in dark ink, fully legible. Legend row below it ("Decision node" green square, "Chance node" purple circle, "Terminal node" blue triangle) in medium-gray text, clearly readable. Bottom-left footnote "Dashed, faded branches = rejected alternative (not on the optimal path)" in muted gray, fully legible.
      Data: Five-level left-to-right decision tree. First categorical series (decision nodes, squares) is #009E73 brand green; chance nodes (circles) are lavender #C475FD; terminal nodes (right-pointing triangles) are blue #4467A3. Each non-terminal node shows a bold name line plus a smaller "EMV $Xk" line below; terminal nodes show name + payoff. Optimal path (Invest -> High demand -> Expand -> Sustained/Declines) is solid dark connecting lines with full-opacity labels; rejected branches (Don't invest, Don't expand) are dashed gray lines with faded, lower-opacity nodes and labels. Chance-branch labels include both the branch name and "p = 0.XX".
      Legibility verdict: PASS — all title, legend, node, and branch-label text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend, and footnote text all render in light ink/gray tones, fully legible against the dark surface. No dark-on-dark failures observed anywhere (title, node labels, branch labels, legend, footnote all checked).
      Data: All data colors are pixel-identical to the light render — brand green squares, lavender circles, blue triangles unchanged. Only chrome (background, text tones, line grays) flipped to the dark palette, exactly as expected. Solid/dashed line distinction and opacity-based de-emphasis for pruned branches carries over correctly.
      Legibility verdict: PASS — every text element remains readable on the dark surface; no black-on-black or washed-out elements found.
