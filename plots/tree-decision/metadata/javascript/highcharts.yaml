review:
  strengths:
  - Hand-verified EMV rollback math is exactly correct at every node — a real analytical
    decision tree, not just decorative numbers
  - 'Clear, consistent semantic color language: brand green for "go" decisions, lavender
    for chance, neutral ink for terminal reference points, and Imprint''s semantic-red
    anchor reserved specifically for pruned/rejected branches'
  - 'Creative, correct workaround for Highcharts'' missing networkgraph module: custom
    right-pointing triangle symbol + render-event-driven connector/label overlay kept
    in sync with the scatter axes via toPixels()'
  - Redundant encoding (shape + dash-pattern + cross-mark + opacity) makes the chart
    robust for colorblind readers
  - Both renders pass theme-readability with identical data colors and fully flipped
    chrome
  weaknesses:
  - A few branch-probability labels (e.g. "High Demand (p=0.50)", "Medium Demand (p=0.30)")
    sit directly on the connector line rather than being offset or given a small background
    chip, which is legible but slightly less crisp
  - The script uses four small helper functions (fmtMoney, hexToRgba, toPoint, drawBranches)
    rather than a fully flat top-to-bottom script
  - The diagonal tree layout leaves the top-left and bottom-right canvas corners comparatively
    empty — inherent to left-to-right tree layouts, not a defect
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white
      Chrome: title "tree-decision · javascript · highcharts · anyplot.ai" and subtitle are dark and fully legible; node-name labels, EMV/payoff labels, and branch-probability labels are dark/dark-soft text, all readable against the light background
      Data: decision nodes (squares) are brand green #009E73 (first series); chance nodes (circles) are lavender (Imprint position 2); terminal nodes (triangles) are near-black (theme-adaptive "neutral" anchor); pruned branches are dashed matte red (Imprint position 5) with a red cross mark, faded terminal fill
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black
      Chrome: title and node-name labels are near-white; subtitle, EMV/payoff, and branch-probability labels are light gray; connector lines flipped from dark gray to light gray; no dark-on-dark text found anywhere
      Data: decision nodes still #009E73, chance nodes still the same lavender, pruned branches still the same matte red — identical to light render; terminal-node fill flips to a light neutral tone (theme-adaptive) and remains clearly visible
      Legibility verdict: PASS
