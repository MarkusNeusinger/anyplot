review:
  strengths:
  - EMV rollback math is verified correct at every node (C3=8.7, D1=8.7, C1=4.42,
    C2=2.5, D0=4.42) — rare level of domain rigor
  - Node-type shape encoding (square=decision, circle=chance, right triangle=terminal)
    matches the spec exactly, with an ink stroke on chance nodes for extra contrast
  - Pruned branches are marked with BOTH a dashed stroke and reduced opacity AND an
    explicit cross mark, exceeding the spec's 'double-strike or cross mark' minimum
  - 'Idiomatic D3: d3.hierarchy + d3.tree with a tuned separation function, d3.linkHorizontal
    for branch curves, proper selection.data().join() pattern throughout'
  - 'Smart semantic-exception use of the Imprint palette: the negative terminal payoff
    (-$2.00M) is rendered in matte red (#AE3030) instead of the default ink color,
    signalling loss immediately'
  - Correct canonical Imprint palette order (green→lavender→blue) for decision/chance/terminal,
    identical across both themes
  - Title format and 4-item legend (Decision/Chance/Terminal/Pruned branch) fully
    match spec requirements
  weaknesses:
  - Branch-label text overlaps the link curve itself at several branches (e.g. 'License',
    'Do Nothing', 'High Demand (p=0.60)', 'Low Demand (p=0.40)', 'Expand') — the fixed
    -12px vertical offset from the link midpoint isn't enough clearance where the
    curve bows steeply; offset further perpendicular to the local curve tangent, or
    nudge labels along the link's control point.
  - Numeric labels (EMV, payoff, probability text) become illegible at the 400px mobile
    thumbnail — the diagram's ~20 small text elements at 13-14px don't survive the
    scale-down; consider slightly larger font sizes on the most important labels (EMV,
    payoff) or trimming secondary label text for mobile legibility.
  - 'Canvas utilization is unbalanced: the pruned lower subtree (License/Do Nothing)
    is much shorter than the Invest branch, leaving roughly the entire bottom-right
    quadrant of the canvas empty; rebalance vertical separation or shift the tree
    to better center content and reduce the dead zone.'
  image_description: |-
