      Chrome: Same title, node titles, EMV labels, and legend all rendered in light ink tones (#F0EFE8 / #B8B7B0), clearly legible against the dark background. No dark-on-dark failures observed.
      Data: Same green/lavender/blue/red colors as the light render — confirmed identical data-color values, only chrome (text, stroke) flipped to light tones as expected.
      Legibility verdict: PASS — all text is readable against the dark background with no dark-on-dark issues. Same branch-label/curve overlap and mobile-scale legibility concerns as the light render apply identically here.
