      Data: Decision nodes are brand green (#009E73) squares, chance nodes are lavender (#C475FD) circles with an ink stroke, terminal nodes are blue (#4467A3) triangles. Negative payoff (-$2.00M) is rendered in matte red. Pruned branches are dashed, reduced-opacity, and cross-marked.
      Legibility verdict: PASS at full resolution — all text is readable against the light background. Some branch-label text (e.g. "License", "High Demand (p=0.60)") visually crosses the link curve underneath it, which is a minor overlap but does not make the text unreadable. At the 400px mobile thumbnail, secondary numeric labels (EMV, payoff, probability) become too small to read clearly.

    Dark render (plot-dark.png):
