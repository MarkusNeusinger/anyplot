review:
  strengths:
  - 'EMV rollback is computed from the records (deepest nodes first: probability-weighted
    mean at chance nodes, best branch at decision nodes), so every EMV label and every
    pruned mark falls out of the data rather than being typed: C2 655, D1 655, D2
    150, C1 453, root 453, all checked.'
  - All three node shapes match the Notes (green squares for decisions, purple circles
    for chance, right-pointing outlined triangles for terminals), with decision and
    chance in the first two Imprint positions and identical data colors in both themes.
  - 'Pruned branches carry both marks the spec asks for: a dashed, thinner, 0.55-opacity
    line plus a double-strike at the midpoint, and the rejected terminal and its payoff
    fade with it, so the optimal path reads as the solid route.'
  - Branch labels are placed along each edge's normal with an offset derived from
    the label width and the edge angle, so no label is struck through by its branch
    in either render.
  - Composes a custom SVG layer inside ChartsContainer and positions it with the useXScale/useYScale
    hooks on hidden linear axes (reversed y), the documented MUI X v9 extension pattern
    for a chart type the community package lacks.
  - 'Clear typographic hierarchy: bold node questions in ink, semibold EMV labels
    in soft ink, bold payoffs, and a subtitle that names the unit and the root EMV.'
  weaknesses:
  - 'Suggestion: a tooltip on the node marks (via MUI X''s interaction layer) could
    expose the node id, type and probability in the HTML view.'
  - 'Suggestion: the 15 px regular-weight branch labels are the lightest text on the
    canvas; a 16 px size would bring them level with the question and payoff labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no axes or grid.
      Chrome: title "tree-decision · javascript · muix · anyplot.ai" top-left in dark ink, a soft-ink subtitle (11 nodes, 6 terminal payoffs, USD thousand, root EMV 453), and an HTML legend row (Decision node square, Chance node circle, Terminal payoff triangle, Pruned branch dashed double-strike). All readable.
      Data: left-to-right tree from "Launch product?" (green #009E73 square, EMV 453) through "Initial demand" (purple circle, EMV 453) to "Expand capacity?" (EMV 655) and "Discount price?" (EMV 150), then "Sustained demand" (purple circle, EMV 655) to terminals 850 and 200. Branch labels show option names on decision branches and "name · p = 0.xx" on chance branches. Pruned branches (Don't launch → 0, Don't expand → 500, Hold price → 80) are dashed, faded and carry a double-strike; their triangles and payoffs are greyed. No text collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, node questions, EMV labels, branch labels and payoffs all flip to light ink and are clearly readable; no dark-on-dark text. Edges render in light soft ink; terminal triangles are light-outlined.
      Data: green decision squares and purple chance circles are identical to the light render; pruned branches keep the same dashed, faded, double-struck treatment.
      Legibility verdict: PASS
