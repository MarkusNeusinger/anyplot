review:
  strengths:
  - 'Mathematically correct EMV rollback with accurate pruning: chance nodes keep
    both branches live while decision nodes correctly prune every non-optimal child
    (verified against the tree by hand: Launch $453 > Don''t Launch $0; Expand $655
    > Don''t Expand $500; Discount $150 > Hold Price $80).'
  - Distinctive, idiomatic MUI X usage — custom SVG marks built on ChartContainer's
    useXScale/useYScale hooks, the library's documented pattern for chart types the
    built-in components can't express.
  - 'Clear visual storytelling: the solid, full-opacity optimal path is immediately
    distinguishable from the dashed, muted, cross-marked pruned branches, so the viewer
    sees the optimal decision path at a glance.'
  - Correct node semantics (square/circle/right-pointing-triangle for decision/chance/terminal)
    plus a self-arranging tree layout (child-average y-positioning) that avoids overlap
    without hardcoded coordinates.
  - Realistic, neutral business scenario (product-launch investment) with internally
    consistent probabilities (each chance node's branches sum to 1.0) and payoffs.
  - Theme-correct rendering in both light and dark renders — identical data colors,
    fully legible chrome, warm off-white/near-black backgrounds.
  weaknesses:
  - Edge probability/option labels at 13.5px are the smallest text in the diagram
    and the first to lose crispness at reduced sizes — bump to ~14-15px to match the
    weight of the EMV/payoff text.
  - The tree has only 11 nodes (spec range is 10-30) and every internal node has exactly
    2 children — a 3-outcome chance node or a 3rd decision stage would better showcase
    the diagram's scalability.
  - The pruned-branch cross mark is two plain crossed lines; a slightly thicker or
    rounded stroke would read a touch more polished at full resolution.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "tree-decision · javascript · muix · anyplot.ai" centered at top in dark bold text, fully legible. Legend top-left (Decision node / Chance node / Terminal payoff / Pruned branch) with matching swatches, all readable. Node titles ("Launch Product?", "Discount Price?", "Expand Capacity?", "Initial Demand", "Sustained Demand") in bold dark ink, EMV values below each in slightly softer dark ink, edge/branch labels (option names and "· p=0.XX" probabilities) in small soft-ink text along each connector. All text reads clearly against the light background.
      Data: Decision nodes are green (#009E73-class) squares, chance nodes are violet/purple circles (Imprint palette position 2), terminal nodes are outlined triangles pointing right with payoff values beside them. Chosen-path edges are solid dark lines; pruned edges are dashed, muted gray, reduced opacity, and marked with an "X" cross at the midpoint.
      Legibility verdict: PASS — no light-on-light or unreadable text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, node titles, EMV values, and edge labels as the light render, all rendered in light ink and clearly visible against the dark background. No dark-on-dark text observed anywhere (titles, EMV, edge/branch labels, legend text all flip to light ink correctly).
      Data: Decision-node green and chance-node violet are visually identical to the light render (only the chrome — text, muted-gray tone, page background — adapts to the theme). Terminal triangles use the dark theme's elevated-surface fill with light ink strokes, remaining clearly visible.
      Legibility verdict: PASS — all text and shapes remain legible in dark mode, confirming correct theme-adaptive chrome with identical data colors.
