    both themes; bands take the color of their target block
  - 'Clean label placement: labels left of the first column and right of the others,
    with ''name · value'' typography and knock-out geom_label boxes'
  - Smoothstep band curves never overshoot their endpoints and page-colored hairlines
    keep adjacent bands separable
  - 'Theme tokens threaded through every text and outline; all text readable on both
    #FAF8F1 and #1A1A17'
  weaknesses:
  - 'VQ-01 (both): the block labels at geom size 4 (about 11 pt) blur and become hard
    to read in the 400 px thumbnail → geom size about 5 (+1 mm, about +3 pt). Likely
    cause: size=4 on the two block-label geom_text/geom_label layers.'
  - 'VQ-02 (both): the middle-column labels ("Annual plan · 81k", "Free trial · 10k",
    "Inactive · 69k") sit with their opaque boxes on the first ~90 px of the outgoing
    bands and hide where those bands leave their blocks → label boxes clear of the
    bands, for example a lower box alpha or a narrower node gap so the bands remain
    visible behind the text. Likely cause: geom_label fill=PAGE_BG, alpha=0.85 at
    xmax + 0.008.'
  - 'VQ-06 (both): nothing in the render names the quantity — the labels read "65k"
    without saying it counts accounts → state the measure, for example a descriptive
    title prefix ''Subscription Plan Transitions (accounts) · ''. Likely cause: the
    ACCOUNTS column name is never shown.'
  - 'Suggestion: the value labels could drop the ''k'' and carry the unit once in
    the title to shorten the middle-column labels.'
