review:
  strengths:
  - 'Block heights and band widths fall out of the flow table: every middle block''s
    incoming total equals its outgoing total (Jul 2024: Annual 81k, Monthly 71k, Free
    trial 10k, Inactive 69k), so both band stacks fit their blocks exactly'
  - Bands are stacked inside their source block by target order and inside their target
    block by source order, so every band attaches cleanly to the blocks it leaves
    and enters
  - Labels at every column carry category and value (e.g. 'Annual plan · 81k'), placed
    left of the first column and right of the others, with bold column headers for
    each snapshot
  - Theme tokens threaded through every text layer and block outline; the Imprint
    fills are identical in both renders and the translucent bands stay distinguishable
    on both backgrounds
  - 'Layered grammar with one data frame per layer: geom_polygon grouped by band,
    geom_rect blocks, geom_text and geom_label for headers and labels on theme_void'
  weaknesses:
  - 'VQ-02 (both): the middle column''s labels (''Free trial · 10k'', ''Inactive ·
    69k'', ''Monthly plan · 71k'') sit on top of the outgoing bands, and ''Free trial
    · 10k'' crosses the green, purple and blue bands that leave that block, so text
    and data marks collide (readable only through the 50 % label box) → keep the labels
    off the bands, e.g. widen the gap between the middle blocks and the band start
    or give the label box a fully opaque PAGE_BG fill. Likely cause: others label_x
    = xmax + 0.008 places the labels inside the band region, with geom_label alpha=0.5.'
  - 'Suggestion: configure lets-plot tooltips on the bands (source plan → next plan,
    accounts moved) for the HTML detail view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid (theme_void).
      Chrome: bold near-black title "alluvial-basic · python · letsplot · anyplot.ai" at top left, INK_SOFT subtitle "Block heights and band widths: Accounts (thousands)", bold column headers Jan 2024 / Jul 2024 / Jan 2025; category labels with values at every block (left of the first column, right of the others; the middle labels on a translucent page-colored box over the bands). All readable.
      Data: three columns of four stacked blocks — Annual plan #009E73, Monthly plan #C475FD, Free trial #4467A3, Inactive #BD8233 — with INK_SOFT outlines; translucent bands (alpha 0.55) colored by target category, width proportional to flow, smooth S-curves, thin bands for rare transitions.
