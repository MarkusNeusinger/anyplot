review:
  strengths:
  - 'Correct alluvial structure: four columns (2021–2024) left to right, each a stack
    of category blocks whose heights come from the data, with cubic Bezier bands (Path
    CURVE4) between neighbouring columns only, stacked inside their source and target
    blocks so every band keeps one width end to end and the inflows fill each block
    exactly'
  - Category labels at every block in every column on rounded elevated-surface chips
    (ELEVATED_BG, alpha 0.9), readable on every block colour in both themes; bold
    year headers above each column
  - 'Imprint palette in canonical order (Technology #009E73, Finance #C475FD, Healthcare
    #4467A3, Manufacturing #BD8233), identical in both renders; bands carry their
    source colour at alpha 0.4 and stay distinguishable where they cross'
  - 'Fully theme-adaptive chrome: page background, title, headers, label chips and
    the footnote all switch tokens, with no dark-on-dark text'
  - Tidy long table with column constants; block sizes are derived from the data with
    pandas groupby (outflow per source, inflow per target for the last column) rather
    than typed in, and the flow matrices are internally consistent (each column totals
    1300k)
  - Canvas exactly 3200×1800 with no bbox_inches='tight'; seaborn's set_theme and
    despine set the base style
  weaknesses:
  - 'Suggestion: the block labels are 7.5 pt, half a point below the 8 pt legend reference;
    8 pt would match the style guide''s label size (they read clearly in the full-size
    render, so this costs no points)'
  - 'Suggestion: block values (for example ''Technology 450k'') could sit on the label
    chips, which the spec allows'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200×1800 canvas
      Chrome: title "alluvial-basic · python · seaborn · anyplot.ai" in dark ink at the top centre (~46 % of the width); bold dark year headers 2021, 2022, 2023, 2024 above the four columns; a footnote in INK_SOFT at the bottom: "Sector employees (thousands): block height and band width are proportional to the number of employees". No axes, ticks or grid (despined). All text is readable.
      Data: four stacked columns of blocks, from the bottom: Technology #009E73, Finance #C475FD, Healthcare #4467A3, Manufacturing #BD8233. Each block is labelled with its sector name on a pale rounded chip. Curved bands at alpha 0.4 in the source colour link neighbouring columns. Wide stable bands (Technology→Technology, etc.) dominate, and thinner switching bands cross between them (Manufacturing→Technology is the most prominent). Technology grows and Manufacturing shrinks from left to right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: the title, year headers and block labels switch to light ink; the label chips switch to the dark elevated surface #242420; the footnote is in light-grey INK_SOFT. No dark-on-dark text anywhere.
      Data: block colours are identical to the light render. The alpha-0.4 bands read as deeper tints over the dark page but stay distinguishable from each other and from the background, and the thin crossing bands are still visible.
      Legibility verdict: PASS
