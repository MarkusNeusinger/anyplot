review:
  strengths:
  - Translucent bands colored by source category keep overlapping flows distinguishable
    in both themes
  - Category labels colored like their blocks tie the labels to the stacks
  weaknesses:
  - 'VQ-01 (both): the title is drawn at 28 units on a 4800 px canvas and reads tiny
    → the library prompt''s 66 on the 3200x1800 canvas. Likely cause: title_font_size=28.'
  - 'VQ-05 (both): canvas is 4800x2700 → 3200x1800 (−1600 × −900). Likely cause: pygal.XY(width=4800,
    height=2700).'
  - 'SC-02 (both): category labels appear only at the first and last columns → labels
    at every column, as the Notes and the spec''s label bullet ask. Likely cause:
    label loops only for the first and last year.'
  - 'SC-03 (both): each column is normalized to its own year total, so a band''s width
    differs at its two ends and the 2020 Other bands spill below their block → one
    scale for the whole diagram. Likely cause: source_height and target_height divided
    by year0_total and year1_total.'
  - 'SC-04 (both): title ''alluvial-basic·pygal·anyplot.ai'' lacks the language →
    ''alluvial-basic · python · pygal · anyplot.ai''. Likely cause: the title string.'
  - 'DQ-02 (both): the scenario is real politics, Democratic and Republican voters
    across the 2012-2024 US elections → a neutral scenario of the same shape, for
    example customers moving between subscription tiers across quarters. Likely cause:
    the parties and years lists.'
  - 'DQ-03 (both): block counts disagree with their flows (2020 Other holds 2.8 but
    sends 3.3; 2020 Democratic holds 81.3 but receives 71.0) → block sizes derived
    from the flows. Likely cause: the hand-typed voter_counts array.'
  - 'CQ-01 (code): no column-0 # Data and # Plot markers separate data from plotting,
    and no column constant exists for the roles time_point, category, value, flow
    → one Data block ending in df and one constant per role with a # role: comment.
    Likely cause: data typed as arrays and dicts where they are used.'
  - 'CQ-04 (code): np.random.seed(42) seeds a generator that is never used and ELEVATED_BG
    is never read → delete both. Likely cause: leftover template lines.'
  - 'CQ-05 (code): plot-{THEME}.html embeds plot-{THEME}.svg, which the script never
    writes, so the HTML shows nothing → write the SVG or inline it. Likely cause:
    the missing SVG save.'
