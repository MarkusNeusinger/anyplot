review:
  strengths:
  - Fixed node x/y positions in go.Sankey give strict, evenly spaced year columns
    with a consistent browser order, which is the alluvial layout the spec asks for
  - Bands in the source browser's color at alpha 0.3 stay distinguishable where they
    cross in both themes, and the node colors are identical across themes
  - Year headers in bold sit cleanly above each column, and every block is labelled
    in every column
  - The tidy DataFrame with column constants drives the whole plot, so the data block
    can be swapped for a real table
  - Native hover templates in the HTML show source → target and the flow size
  weaknesses:
  - 'VQ-05 (both): an empty band of about 12 % of the canvas height lies between the
    title (y=0.97) and the year headers, plus about 10 % unused below the legend,
    so the diagram fills only about 60 % of the height → close the gap so the title
    sits about 4 % above the headers (about −60 px at 800x450). Likely cause: margin
    t=100 together with the headers at y=1.02 and the legend at y=-0.12 with b=80.'
  - 'DQ-03 (code): FLOW is labelled ''Users moving (%)'' and SHARE ''Market share
    (%)'', but each column sums to 1000, so the HTML hover reports ''Users moving
    (%): 420'' → per-column values that sum to 100 (divide the flows by 10), or a
    label without ''%''. Likely cause: the flow values on a per-mille scale under
    a percent label.'
  - 'Suggestion: the legend repeats what the labels at every block already say; dropping
    it would free vertical space for the diagram.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800.
      Chrome: centered title "Browser Market Share · alluvial-basic · python · plotly · anyplot.ai" in dark ink across about 58 % of the width; bold year headers 2015, 2018, 2021 and 2024 above the four columns; dark node labels (Chrome, Firefox, Safari, Edge) beside every block, and on the left of the blocks in the last column; a horizontal legend in an elevated box with a soft border below the diagram. An empty band lies between the title and the headers.
      Data: four columns of blocks: Chrome #009E73 (largest, growing), Firefox #C475FD (shrinking), Safari #4467A3, Edge #BD8233. Translucent bands at alpha 0.3 in the source color connect neighboring columns: wide bands for stable users, thin crossing bands for switchers.
