review:
  strengths:
  - 'Block heights and band widths are exact: every block''s value is the outflow
    (or, at Q4, the inflow) of its tier, and the data conserves flow, so Q2 Basic
    = 43k both in and out, Q3 Premium = 27k both in and out, each quarter totalling
    100k'
  - Bands leave and enter their blocks at running offsets, so every band attaches
    flush to its source and target block with no gaps or overshoot; the smoothstep
    easing gives clean S-curves
  - Block labels choose dark or light ink per fill by WCAG contrast, so Basic and
    Standard read in near-black and Premium in off-white in both themes
  - 'Band alpha is tuned per theme (0.5 light, 0.7 dark), keeping translucent bands
    saturated enough on #1A1A17 while overlaps stay distinguishable'
  - Page-colored block outlines cleanly separate blocks from the bands that touch
    them; theme_void plus a subtitle that states both encodings replaces axes and
    legend
  - 'Idiomatic grammar layering: geom_polygon with a group aesthetic for bands, geom_rect
    for blocks, scale_color_identity for per-row label ink, coord_cartesian(expand=False)
    for exact framing'
  weaknesses:
  - 'VQ-07 (both): the plan tiers Basic, Standard, Premium are ordered categories
    but are colored with categorical positions 1–3 (#009E73, #C475FD, #4467A3), so
    the lavender middle tier breaks the tier order → three ordered steps of imprint_seq
    from #009E73 through its midpoint to #4467A3, in tier order. Likely cause: fill_colors
    = dict(zip(tiers, IMPRINT_PALETTE)).'
  - 'Suggestion: the subtitle reads ''Subscribers (thousands) … subscribers moving
    (thousands)'' with inconsistent capitalization from SUBSCRIBERS vs MOVED.lower();
    lower-casing both would read more evenly.'
  - 'Suggestion: the block labels at size 6.5 are the smallest text on the canvas
    and nearly vanish in the 400 px thumbnail; slightly wider blocks would leave room
    for a larger label.'
  - 'Suggestion: the hex parsing in the srgb dict could use matplotlib.colors.to_rgb
    instead of the manual int(c[i:i+2], 16) slicing.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid (theme_void).
      Chrome: bold near-black left-aligned title "alluvial-basic · python · plotnine · anyplot.ai" (~52% of width), soft-grey subtitle explaining that block height = subscribers (thousands) per plan tier and band width = subscribers moving to the next quarter; bold column headers Q1 2025 … Q4 2025 above each column. All readable.
      Data: four columns of three stacked blocks — Basic (#009E73), Standard (#C475FD), Premium (#4467A3) — labelled with tier and value (Basic 50k→43k→36k→31k, Standard 35k→37k→37k→35k, Premium 15k→20k→27k→34k). Translucent bands (alpha 0.5) colored by source tier connect neighbouring columns, widths proportional to flow; thick self-flows plus thin cross-tier bands that cross. Block labels dark on green/lavender, off-white on blue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and column headers in off-white, subtitle in light grey; no dark-on-dark text anywhere.
      Data: identical block fills to the light render (#009E73, #C475FD, #4467A3); bands at alpha 0.7 read as deeper green, purple and slate blue but stay distinguishable where they cross; block labels keep the same contrast-chosen inks.
      Legibility verdict: PASS
