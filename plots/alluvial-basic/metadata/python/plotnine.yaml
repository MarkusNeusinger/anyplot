review:
  strengths:
  - 'Faithful alluvial layout: four quarter columns left to right, stacked plan-tier
    blocks whose heights are the tier totals, and bands only between neighboring columns,
    each attached to the blocks it leaves and enters at running offsets so widths
    equal the flows (block values are consistent: e.g. Q2 Basic in 38+4+1 = out 32+8+3
    = 43k)'
  - 'Each tier keeps one Imprint color across all columns (Basic #009E73, Standard
    #C475FD, Premium #4467A3), bands are colored by their source tier, and data colors
    are identical in both renders'
  - Every column is named by a bold header and every block carries its tier name and
    value, so no legend is needed (legend_position='none')
  - 'Built from the grammar: geom_polygon with group= for the smoothstep-eased bands,
    geom_rect for blocks, scale_fill_manual with data-order limits, theme_void plus
    a vectorized annotate() for the headers'
  - Page-colored block outlines and a subtitle that spells out both encodings (block
    height vs band width, with units) make the chart readable without axes
  - 'Realistic subscription-migration scenario with a clear story in the data itself:
    Basic shrinks 50k → 31k while Premium grows 15k → 34k'
  weaknesses:
  - 'VQ-03 (dark): the Premium bands, drawn in #4467A3 at alpha 0.5 over #1A1A17,
    blend to a dull navy (about #2F3E5D) with little contrast against the page; the
    thin Premium→Basic and Premium→Standard bands almost vanish → raise their contrast
    on the dark page, e.g. a higher band alpha in the dark theme (about 0.65–0.7,
    +0.15 to +0.2). Likely cause: geom_polygon(alpha=0.5) used for both themes.'
  - 'VQ-01 (both): the bold block labels in #1A1A17 on the #4467A3 Premium blocks
    reach only about 3:1 contrast and read noticeably weaker than on the green and
    purple blocks → at least 4.5:1, e.g. light text (#F0EFE8) on the blue block fill.
    Likely cause: a single BLOCK_TEXT color for all block fills.'
  - 'Suggestion: plan tiers (Basic < Standard < Premium) have a natural order; steps
    of one Imprint ramp would let the color carry that order.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid (theme_void).
      Chrome: left-aligned bold title "alluvial-basic · python · plotnine · anyplot.ai" (~55% of width) in near-black, grey subtitle explaining block height (Subscribers (thousands) per plan tier) and band width (subscribers moving (thousands) to the next quarter), bold column headers Q1 2025 – Q4 2025 above each column. All readable.
      Data: four columns of stacked blocks — Basic #009E73 (50k → 43k → 36k → 31k), Standard #C475FD (35k → 37k → 37k → 35k), Premium #4467A3 (15k → 20k → 27k → 34k) — each labelled with tier name and value in bold dark text; page-colored outlines separate blocks. Translucent (alpha 0.5) smoothstep-curved bands in source-tier color connect neighbouring columns, wide retention bands plus thin crossing upgrade/downgrade bands. Dark labels on the blue Premium blocks have weaker contrast than on green/purple.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and headers in light #F0EFE8, subtitle in light grey; no dark-on-dark text in the chrome.
      Data: block colors identical to light (#009E73, #C475FD, #4467A3); block labels stay dark on the fixed fills and remain readable (weakest on blue). Bands at alpha 0.5 blend toward the dark page: green and purple bands read clearly, but the Premium blue bands become a dull navy with low contrast, and the thinnest Premium→Basic/Standard bands are barely visible.
      Legibility verdict: PASS
