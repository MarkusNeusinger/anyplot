review:
  strengths:
  - Exact 3200x1800 canvas with a length-scaled title that carries the full mandated
    format including the language segment
  - Bands are cubic-Bezier PathPatches whose widths are proportional to flow, attached
    to the blocks they leave and enter, with flows that conserve into the next column's
    block values
  - Consistent Imprint colors per party at every time point (positions 1-4 in canonical
    order) with translucent bands that stay distinguishable in both themes
  - 'Adaptable structure: column constants, a tidy one-row-per-band DataFrame and
    a plot zone that reads only df'
  - Legend placed as one row below the diagram, clear of every mark
  weaknesses:
  - 'VQ-02 (both): the 2012 ''Independent (50K)'' label is wider than its 50K block
    and runs over the block edges onto the outgoing bands → keep the label inside
    its block''s slot (wrap it like the other thin blocks, or drop the value for blocks
    under about 0.5 units high). Likely cause: the one-line label branch `height <
    0.5` keeps name and value on one 7 pt bold line.'
  - 'DQ-02 (both): the parties are labelled ''Party A'', ''Party B'', ''Party C''
    → fictional but named parties (for example ''Green Alliance'', ''Labour Union'',
    ''Civic Party''). Likely cause: the `parties` list.'
  - 'Suggestion: block labels could take the theme-adaptive INK only where it contrasts
    with the fill and a page-colored label on the darker fills.'
