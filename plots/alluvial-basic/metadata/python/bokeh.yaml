    at 2016 and 2020) sit on top of crossing bands, readable only through a 0.7 halo
    → place them where no band passes, e.g. inside the block. Likely cause: Label
    x = t_idx + node_width/2 + 0.03 for the middle columns.'
  - 'CQ-01 (code): no column constant for the required role `value` → one string constant
    per required column role above the Data block, each with a trailing # role: <role>
