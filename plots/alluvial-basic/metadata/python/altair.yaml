  strengths:
  - Ribbons drawn natively with mark_line(filled=True) plus an order channel, so bands
    are true polygons in Vega-Lite, with block tooltips and zoom in the HTML
  - Flows conserved at every middle column, so every band starts and ends inside its
    blocks
  - Theme tokens threaded through title, headers, labels and legend; Imprint data
    colors identical in both renders
  - Canonical 3200x1800 canvas reached with a pad-only step; nothing clipped in either
    theme
  weaknesses:
  - 'VQ-04 (both): the bold block labels share one ink color for every block, so contrast
    falls to about 2.6:1 for the light text on the #C475FD Liberal block (dark) and
    about 3:1 for the dark text on the #4467A3 Progressive block (light), below the
    3:1 floor for bold text → pick the label color per block from its fill so each
    label clears 4.5:1. Likely cause: label_layer mark_text(color=INK) for all blocks.'
  - 'Suggestion: the legend repeats the in-block category labels; dropping it would
    give the diagram more width.'
