  strengths:
  - 'Exact flow conservation: every source-node''s outgoing flows and every destination-node''s
    incoming flows sum precisely to the adjacent column''s category totals'
  - Clean, idiomatic theme-token handling (PAGE_BG/INK/INK_SOFT/INK_MUTED) with correct
    Imprint palette use and a well-justified semantic exception for Undecided mapped
    to the muted anchor
  - Smooth, professional-looking cosine-eased flow bands built from first principles
    with poly!, well beyond basic Makie usage
  - Both renders pass the theme-readability and edge-clipping checks cleanly — no
    chrome or clipping defects in either theme
  weaknesses:
  - Legend label/title font sizes rely on Makie defaults rather than being explicitly
    set — set labelsize/titlesize on the Legend(...) call for full VQ-01 marks
  - No explicit annotation or visual callout highlighting the key insight (steep Undecided
    attrition) — a small callout or bolder emphasis on that band would strengthen
    data storytelling
  - Category labels/values only appear at the first and last columns; middle columns
    rely solely on the legend for color identification — acceptable for alluvial diagrams
    but an optional per-node value label would push feature coverage further
