review:
  strengths:
  - 'Correct Imprint palette usage: first series is #009E73, remaining categories
    follow canonical order (lavender, blue, ochre), identical data colors across light
    and dark renders'
  - 'Fully theme-adaptive chrome in both renders: warm off-white/near-black backgrounds,
    dark/light ink text, no dark-on-dark or light-on-light failures'
  - 'Mathematically well-formed alluvial data: each node''s total inflow equals its
    total outflow across all four semesters, producing a clean sankey with no orphaned
    or mismatched segments'
  - Strict adjacent-column link structure matches the spec's requirement that alluvial
    diagrams enforce ordered transitions between consecutive time points
  - Thoughtful custom column-header overlay via graphic.elements, going beyond the
    default ECharts sankey to satisfy the spec's requirement that both time points
    and categories be labeled
  - Canvas gate passed; chart fills the canvas well with no clipped text at any edge
  - Clean, deterministic, KISS-structured code with no fake interactivity
  weaknesses:
  - Heavy crossing of flow bands (every category can transition to any other) makes
    the diagram read as somewhat busy/spaghetti-like; the underlying 'students improving
    over time' story requires actively tracing bands rather than being immediately
    obvious. Consider emphasizing the trend more directly (e.g. slightly higher opacity
    or a subtle color/weight boost on the dominant improving flows) without adding
    extra chart junk.
  - In regions where several translucent (opacity 0.45) bands overlap mid-diagram,
    the blended colors get slightly muddy and harder to attribute to a single source
    category. Consider tuning link opacity/curveness or nodeGap to reduce visual clutter
    in the busiest crossing zones.
  - Node/category label font size (14px) is on the smaller side for a diagram this
    dense with 16 labels plus 4 column headers; a modest bump (e.g. 16px) would improve
    legibility when the PNG is scaled down for mobile.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "alluvial-basic · javascript · echarts · anyplot.ai" centered top in bold dark ink. Four bold column headers ("Semester 1"–"Semester 4") sit above each column. Sixteen node labels ("Advanced", "Proficient", "Developing", "Needs Support" repeated per column) render in dark ink text above each node segment. All chrome text is clearly readable against the light background.
      Data: Four persistent categories rendered as vertical node bars with flow bands connecting each column to the next. Colors are, in order, brand green (#009E73, Advanced), lavender (Proficient), blue (Developing), and ochre/tan (Needs Support) — matching the Imprint canonical categorical order. Band widths are proportional to transition magnitude and use ~0.45 opacity, source-colored, with curved (curveness 0.5) paths. The green "Advanced" band visibly grows from semester 1 to semester 4 relative to the others, while "Needs Support" stays comparatively flat/shrinks slightly.
      Legibility verdict: PASS — all title, header, and node-label text is clearly legible against the light background; no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, column headers, and node labels as the light render, now rendered in light/white ink text. All chrome elements are clearly visible against the dark surface; no dark-on-dark text was found anywhere in the render.
      Data: Same four categories in the same order with identical hex colors to the light render (#009E73 green first, then lavender, blue, ochre) — only the chrome (background, text) has flipped between themes, exactly as required. The translucent bands read slightly darker/richer against the near-black surface but remain distinguishable by hue.
      Legibility verdict: PASS — all text remains fully readable in the dark theme, and data colors are confirmed identical to the light render.
