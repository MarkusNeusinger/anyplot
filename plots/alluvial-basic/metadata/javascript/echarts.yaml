review:
  strengths:
  - Strict alluvial column structure (no cross-generation links) faithfully matches
    the spec's ordering requirement, unlike a generic Sankey
  - Link opacity encodes transition direction (0.72 improving, 0.2 declining, 0.45
    stable) — a genuine data-storytelling device that lets the viewer read the 'students
    trending upward' narrative without tracing every band
  - 'Transition matrices are internally consistent: each semester''s inbound totals
    exactly match the prior semester''s outbound totals (verified by summing rows/columns),
    giving the data real structural integrity'
  - Imprint palette applied in canonical order (Advanced=#009E73, Proficient, Developing,
    Needs Support) and identical across light/dark renders; only chrome flips correctly
  - Column headers rendered via a custom `graphic` text overlay in addition to per-node
    category labels, giving both axes of the alluvial (time point + category) clear
    identification per the spec's labeling note
  - 'Idiomatic ECharts sankey usage: `lineStyle.color: "source"` gradient coloring,
    `nodeAlign: "justify"`, `emphasis.focus: "adjacency"` for hover highlighting in
    the interactive HTML view'
  - Fully deterministic, hardcoded data with no RNG; clean KISS structure with no
    unnecessary imports
  weaknesses:
  - The mandated title sits around ~35% of plot width — comfortably inside bounds,
    but on the lower end of expected proportion for the long mandated string; no functional
    issue, just noted for calibration
  - No traditional legend swatch list; category identity relies entirely on per-node
    text labels, which works here but offers no single at-a-glance color key for a
    reader who lands mid-chart at Semester 3 or 4
  - Only 4 time points / 4 categories used, at the lower end of the spec's 3-6 time
    point / 3-8 category range — a wider example would show off more crossing/branching
    complexity
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "alluvial-basic · javascript · echarts · anyplot.ai" centered top in bold dark ink; four bold column headers ("Semester 1"..."Semester 4") sit above each sankey column; per-node category labels ("Advanced", "Proficient", "Developing", "Needs Support") repeat above every node in every column. All text renders in dark ink and is clearly readable against the light background.
      Data: Four vertically-stacked node columns connected by curved flow bands. First category (Advanced) renders in Imprint green #009E73, followed by purple, blue, and ochre — canonical Imprint order. Flow bands vary in opacity: bands moving toward "Advanced" (improving) are strongly saturated, bands moving toward "Needs Support" (declining) are faint, and same-category (stable) bands sit in between. Band width is visibly proportional to student count.
      Legibility verdict: PASS — no overlap, no clipping, all labels crisp at full resolution.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, column headers, and node labels, all re-rendered in light/white ink. Fully legible against the dark background — no dark-on-dark text anywhere.
      Data: Identical green/purple/blue/ochre band colors and identical opacity encoding as the light render — only the chrome (background, text color) flipped, confirming theme-adaptive tokens were threaded through correctly rather than the data palette.
      Legibility verdict: PASS — all text and flow bands remain clearly distinguishable from the dark canvas.
