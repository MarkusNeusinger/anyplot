review:
  strengths:
  - 'Genuinely creative engineering: implements an alluvial-style flow diagram from
    Chart.js''s stacked-bar primitive plus a custom bezier-ribbon plugin — no workaround
    libraries, fully idiomatic use of the plugin API.'
  - Clean, correct theme-adaptive chrome — both renders pass the light/dark legibility
    checklist with no dark-on-dark or light-on-light issues.
  - First series correctly uses brand green; "Needs Support" sensibly maps to the
    semantic red anchor for a "bad" status category.
  - Deterministic, minimal, clean code with a conserved-population dataset (240 students
    every semester) that reads as a believable, neutral academic scenario.
  weaknesses:
  - 'Palette order: `Proficient` (palette[2], blue) and `Developing` (palette[1],
    lavender) are swapped from canonical order with no semantic justification — reassign
    to canonical order (`Proficient`→palette[1], `Developing`→palette[2]) or document
    a semantic reason if intentional.'
  - The flow ribbons only show each tier's own segment width changing over time; no
    ribbon crosses into a different tier's vertical position, so the chart doesn't
    visually depict students actually transitioning between categories (only aggregate
    per-tier size change). Consider whether a true cross-tier flow (or sub-band splits)
    is achievable within Chart.js's plugin system, or clarify in a comment that this
    is an intentional net-change approximation.
  - 'Minor: the "Semester" x-axis title is redundant given the "Semester 1"–"Semester
    4" tick labels directly below it; consider removing for a slightly cleaner layout.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Dark-ink title "alluvial-basic · javascript · chartjs · anyplot.ai" centered at top; "Students in tier" y-axis title and "Semester" x-axis title in dark ink; tick labels (0-250, Semester 1-4) in soft dark ink; bottom horizontal legend (Honors/Proficient/Developing/Needs Support) in dark ink. All clearly visible.
      Data: Four stacked-bar columns (Semester 1-4), tiers colored Honors=#009E73 (green, brand/first series), Proficient=blue, Developing=lavender/purple, Needs Support=matte red. Smooth bezier flow ribbons connect each tier's segment across adjacent columns at ~45% alpha, colored per tier.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black.
      Chrome: Title, axis titles, tick labels, and legend all render in light ink and are clearly visible against the dark surface. No dark-on-dark failures found.
      Data: Same four tier colors as the light render (green/blue/lavender/red) — confirmed identical; only the chrome (background, text) flipped between themes, exactly as required.
      Legibility verdict: PASS
