review:
  strengths:
  - 'Cross-tier flows are now genuinely computed and rendered: ribbon bands visibly
    cross between different tier vertical positions, correctly reflecting the transition
    matrices instead of the attempt-1 net-change-only approximation.'
  - Palette order fixed to canonical Imprint order (Proficient→palette[1] lavender,
    Developing→palette[2] blue), while Needs Support keeps the semantic-red anchor
    — a well-justified semantic exception for a 'bad/at-risk' category.
  - Redundant 'Semester' x-axis title removed, tightening the layout since the tick
    labels already say Semester 1-4.
  - 'Fully verified conserved-population dataset: every row and column of every per-gap
    transition matrix sums exactly to the adjacent semester''s tier totals (240 students
    every semester) — a rigorous, believable academic-tracking scenario.'
  - Clean theme-adaptive chrome in both renders with identical data colors between
    light and dark; no dark-on-dark or light-on-light failures.
  weaknesses:
  - Overlapping semi-transparent ribbons create visually busy crossing regions in
    places (e.g. the Semester 1→Semester 2 gap) where several bands overlap and blend
    colors; a subtle stroke or drawing larger flows first could reduce clutter, though
    this is a minor refinement rather than a defect.
  - The bezier-ribbon math itself is still fairly generic canvas geometry rather than
    a Chart.js-distinctive feature; not required for this spec, but a further distinctive
    touch (e.g. highlighting a band on legend hover) could raise Library Mastery in
    a future pass.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Dark-ink title "alluvial-basic · javascript · chartjs · anyplot.ai" centered at top; "Students in tier" y-axis title in dark ink; tick labels (0-250, Semester 1-4) in soft dark ink; bottom horizontal legend (Honors/Proficient/Developing/Needs Support) in dark ink. All clearly readable, no light-on-light issues.
      Data: Four stacked-bar columns (Semester 1-4). Tier colors: Honors=#009E73 (brand green, first series), Proficient=lavender (palette[1]), Developing=blue (palette[2]), Needs Support=matte red (semantic "bad" anchor, palette[4]). Bezier flow ribbons now visibly cross between different tier vertical positions between adjacent columns at ~45% alpha, correctly depicting students moving between tiers (not just each tier's own segment resizing).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black.
      Chrome: Title, y-axis title, tick labels, and legend all render in light ink and are clearly visible against the dark surface. No dark-on-dark failures found.
      Data: Same four tier colors as the light render (green/lavender/blue/red) — confirmed identical; only the chrome (background, text) flipped between themes, exactly as required. Cross-tier ribbon crossings match the light render.
      Legibility verdict: PASS
