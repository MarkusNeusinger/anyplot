review:
  strengths:
  - 'Correct Imprint palette (first series #009E73) with fully theme-correct chrome
    in both light and dark renders'
  - Genuinely custom, mathematically laid-out alluvial diagram - sub-stacked ribbons
    prevent flow crossings within a single node
  - Deterministic, realistic education-domain data with exact conservation of totals
    (240 students) across all four semesters
  - Clean, idiomatic D3 usage with no unnecessary dependencies; correctly built for
    a bundle that lacks d3-sankey
  - Clear title, stage headers, and explicit font sizing throughout
  weaknesses:
  - Middle stages (Semester 2, Semester 3) show no node labels (no category names,
    no counts) - a viewer can only infer values there by matching ribbon colors back
    to the first/last stage labels. Add compact labels to the middle nodes, or a shared
    legend, so all four stages are self-explanatory.
  - Dense ribbon-crossing zones between columns blend the semi-transparent colors
    into muddy gray/brown patches, making individual flows hard to trace through the
    middle of the diagram. Tune ribbon opacity/z-order or layout so flows stay more
    distinguishable where many ribbons cross.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "alluvial-basic · javascript · d3 · anyplot.ai" centered at top; dark bold "Semester 1"-"Semester 4" stage headers; node labels (category name + "N students") at first/last stage in dark ink (name) and softer ink (count). All clearly readable against the light background.
      Data: Four categories - STEM (green #009E73), Business (light purple), Humanities (blue-gray), Undeclared (tan) - as solid node bars connected by semi-transparent bezier ribbons whose width encodes flow magnitude. First series confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title, stage headers, and node labels all render in light/white text, fully legible against the dark background. No dark-on-dark failures observed.
      Data: Same four category colors as the light render (STEM green, Business purple, Humanities blue-gray, Undeclared tan), confirmed identical - only chrome (background, text) flipped for theme.
      Legibility verdict: PASS
