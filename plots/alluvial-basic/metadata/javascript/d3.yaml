review:
  strengths:
  - Correctly builds a true alluvial diagram (fixed vertical category ordering per
    stage) rather than a reorderable Sankey, matching the spec's explicit distinction
  - Category colors persist identically across all 4 stages and both themes, satisfying
    both the spec's 'consistent colors' note and Imprint palette rules
  - Total cohort count (240 students) is conserved exactly across every stage - factually
    sound flow accounting
  - 'Elegant handling of the two interior stages, which have no room for full labels:
    haloed white count labels stamped directly on the node bars keep them self-explanatory
    without a redundant legend lookup'
  - Ribbon transparency (fill-opacity 0.62) plus a thin page-background stroke per
    the spec's 'use transparency for overlapping flows' note keeps individual bands
    separable in the dense middle crossings
  - All text sizes are explicitly set (11-22px) and remain legible in both light and
    dark renders with no dark-on-dark or light-on-light failures
  weaknesses:
  - The two interior stages have heavy ribbon crossing with no annotation or highlight
    calling out a specific insight (e.g. Undeclared shrinking from 60 to 35 students)
    - viewer must derive the story from the node count labels themselves
  - A handful of the smallest transitions (~2-3 students) render as very thin ribbons
    that are hard to trace individually through the crossing pattern
  - Interior-stage count labels (11px) are noticeably smaller than the edge category
    labels (15px) - legible but could be nudged up slightly for stronger mobile-width
    readability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "alluvial-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered at top. Four stage headers ("Semester 1" through "Semester 4") in bold dark text above each column. Category + count labels ("STEM / 70 students", etc.) in dark ink (primary) and softer gray (secondary "N students" line) flank the first and last columns. A horizontal legend (STEM, Business, Humanities, Undeclared swatches + labels) sits below the diagram. All chrome text is clearly readable against the light background.
      Data: Four node columns (Semester 1-4), each with 4 stacked category bars in Imprint colors - STEM green (#009E73), Business lavender/purple, Humanities blue, Undeclared ochre. Curved ribbons connect nodes across stages, colored by source category with ~62% opacity and a thin light stroke, sized proportional to transition value. Interior stages (Semester 2, Semester 3) carry white haloed count labels directly on the bars. First categorical series is confirmed #009E73 green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, stage headers, category/count labels, and legend, now rendered in light/white ink. All chrome text is clearly readable against the dark background - no dark-on-dark instances found (interior count labels keep their white text + black halo, which still reads fine against the colored ribbons, not the dark page background).
      Data: Identical node and ribbon colors to the light render (STEM green, Business lavender, Humanities blue, Undeclared ochre) - only the background and text chrome flipped, confirming theme-adaptive tokens were used correctly for chrome while data colors stayed constant.
      Legibility verdict: PASS
