review:
  strengths:
  - 'Correct alluvial semantics: strict per-column vertical stacking (not a free-form
    Sankey layout) with band widths exactly proportional to flow magnitude, matching
    the spec''s alluvial-vs-Sankey distinction'
  - 'Sound engineering workaround for the missing sankey module: hand-draws the diagram
    with chart.renderer path/rect/text primitives inside a series-less chart rather
    than reaching for another library or faking the feature, and documents the rationale
    in code comments'
  - 'Well-reasoned semantic color mapping: Customer (the desired outcome) uses brand
    green #009E73 and Churned (the loss state) uses the semantic-anchor red, consistent
    with the style guide''s status/quality semantic-exception rule, and identical
    across light/dark renders'
  - 'Comprehensive, realistic SaaS-funnel data: shows conversion, retention, decline,
    and an absorbing Churned→Churned state across all four quarters with conserved
    column totals'
  - 'Theme-adaptive chrome correctly implemented: title/subtitle/labels/legend all
    read from t.ink/t.inkSoft tokens, both renders show correct #FAF8F1/#1A1A17 backgrounds
    with matching text-color flips and no dark-on-dark or light-on-light failures'
  weaknesses:
  - 'The ''Q2'' and ''Q3'' column-header labels (drawn at chart.plotTop - 24) visually
    overlap the subtitle text directly beneath them in BOTH light and dark renders:
    ''Q2'' sits on top of the ''S'' in ''SaaS trial funnel...'' and ''Q3'' sits on
    top of ''quarters'', partially obscuring both. Fix by increasing chart.spacingTop
    (currently 70) and/or moving the column-header y-offset further above chart.plotTop
    so the headers clear the subtitle''s baseline with a visible gap - Q1/Q4 already
    sit clear of the subtitle since it doesn''t extend that far horizontally.'
  - The bottom legend order (Lead, Trial, Customer, Churned - CATEGORIES order) doesn't
    match the visual top-to-bottom stacking order (Customer, Trial, Lead, Churned
    - STACK_ORDER) shown in the columns, which slows matching a legend swatch to its
    band. Reorder the legend loop to iterate STACK_ORDER instead of CATEGORIES.
  - The Q3->Q4 'Lead' flow (value=10) renders as a hairline sliver only ~1-2px wide,
    at the edge of visibility even though it is correctly labeled at the endpoint
    - consider a small minimum-width floor for near-zero flows so they stay visible
    at all render/export scales.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "alluvial-basic · javascript · highcharts · anyplot.ai" reads clearly. Directly below it, the gray subtitle "SaaS trial funnel · 1,000-lead cohort tracked across four quarters" is PARTIALLY OVERLAPPED by the "Q2" and "Q3" column-header labels, which are placed right on top of "SaaS" and "quarters" respectively. Q1 and Q4 headers sit clear of the subtitle (it doesn't extend that far horizontally) and are fully legible. Endpoint labels ("Lead · 1,000" on the left; "Customer · 430", "Trial · 100", "Lead · 10", "Churned · 460" on the right) and the bottom legend (Lead/Trial/Customer/Churned) are all fully legible with generous margin to every canvas edge - no clipping.
      Data: Four vertically-stacked columns (Q1-Q4) connected by curved, semi-transparent flow ribbons. Colors: Lead = lavender (#C475FD), Trial = blue (#4467A3), Customer = brand green (#009E73), Churned = matte red (#AE3030) - first Imprint slot correctly reserved for the "good outcome" category per the semantic-exception rule, not raw ordinal position.
      Legibility verdict: FAIL for the Q2/Q3-vs-subtitle collision (VQ-02); PASS for every other chrome element - title, endpoint labels, legend, and Q1/Q4 headers are all cleanly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title and column headers render in white/light ink, subtitle in muted light-gray - fully legible against the dark surface, no dark-on-dark failures anywhere. The SAME Q2/Q3-overlaps-subtitle defect from the light render reproduces identically here (it's a fixed pixel-offset layout bug, not theme-dependent). Endpoint labels and legend are fully legible with the same generous margins as light.
      Data: Colors are pixel-identical to the light render (lavender/blue/green/red bands and nodes) - only the chrome (background + text colors) flipped, exactly as required.
      Legibility verdict: FAIL for the same Q2/Q3-vs-subtitle collision (VQ-02, theme-independent); PASS for dark-on-dark/light-on-light checks - all text has correct contrast against the near-black surface.
