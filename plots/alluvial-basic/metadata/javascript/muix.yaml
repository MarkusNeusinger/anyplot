review:
  strengths:
  - 'Faithful alluvial layout built from community MUI X: ChartsContainer with custom
    SVG bands and blocks positioned through useXScale/useYScale, and a top point-scale
    ChartsXAxis as column headers'
  - Band widths and block heights are exact data values on a linear 0..total scale;
    flows conserve the 1,000 customers across all four quarters
  - Imprint palette in canonical order with Enterprise in brand green and Churned
    landing on the matte-red loss anchor; colors identical in both themes
  - Translucent bands (0.55) keep crossing flows distinguishable on both backgrounds;
    page-colored block strokes and pill backings keep stacked blocks and middle labels
    legible
  - Values on the first and last columns only show the net migration without cluttering
    the middle columns
  weaknesses:
  - 'VQ-01 (both): node category labels, middle-column pill labels and the ''Customers''
    value-axis title render at 13 px, below the 14-16 px guidance, and blur in the
    400 px thumbnail → about 15 px (+2 px). Likely cause: fontSize={13} on the end-column
    <text>, MID_LABEL_FONT = 13 and fontSize={13} in ValueAxisTitle.'
  - 'Suggestion: the ~70 px of empty space between the legend row and the column headers
    could be given back to the diagram height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: title "alluvial-basic · javascript · muix · anyplot.ai" top-left in dark ink (~35% width), italic subtitle "Simulated SaaS subscription-tier migration · 1,000 customers across 4 quarters", HTML legend row (Enterprise, Pro, Basic, Free, Churned + italic "Band width ∝ transition count"), bold column headers Q1–Q4 2024, rotated "Customers" title at the far left. All dark text, clearly readable.
      Data: four stacked node columns; Enterprise #009E73, Pro lavender, Basic blue, Free ochre, Churned matte red. Bands at ~0.55 opacity colored by source tier, widths proportional to flow, crossing between neighboring columns only. First column labels "Free · 500" etc., last column "Churned · 180" etc., middle columns name categories on page-colored pills.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, column headers and node labels flip to light ink; middle pills flip to dark backing with light text. No dark-on-dark text.
      Data: block and band colors identical to the light render (green, lavender, blue, ochre, red); translucent bands read darker over the dark page but remain distinguishable, overlaps blend as permitted.
      Legibility verdict: PASS
