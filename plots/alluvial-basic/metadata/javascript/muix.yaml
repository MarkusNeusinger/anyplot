      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "alluvial-basic · javascript · muix · anyplot.ai" in bold dark ink, clearly legible; italic subtitle "Simulated SaaS subscription-tier migration · 1,000 customers across 4 quarters" in soft gray, legible; legend row with 5 color swatches (Enterprise/Pro/Basic/Free/Churned) plus an italic "Band width ∝ transition volume" note, all legible; bold column headers "Q1 2024".."Q4 2024" above each node column, legible; node value labels ("Free · 500", "Churned · 185", etc.) at the first and last columns in soft ink, legible.
      Data: Five categories rendered as stacked node rectangles (ochre=Enterprise, blue=Pro, lavender=Basic, green=Free, red=Churned) connected by semi-transparent bezier ribbons whose width is proportional to transition volume; first category (Free) correctly uses brand green #009E73, and Churned correctly uses the semantic-exception red #AE3030 for the loss state.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, legend text, column headers, and node value labels all render in light ink (white/light-gray) and are clearly legible against the dark background; no dark-on-dark failures observed anywhere (title, legend, node labels, column headers all checked).
      Data: Same five node/ribbon colors as the light render — ochre, blue, lavender, green (#009E73), and red (#AE3030) are pixel-identical to the light render; only the background and text chrome flipped to the dark tokens, exactly as required.
