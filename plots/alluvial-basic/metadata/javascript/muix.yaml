review:
  strengths:
  - 'Builds the alluvial with the MUI X composition API (Sankey is Pro-only): ChartsContainer
    with a top-positioned point x axis as column headers and custom SVG layers positioned
    through useXScale / useYScale, so block heights and band widths share one linear
    value scale'
  - 'Flow conservation is computed, not typed: populations come from a row-stochastic
    transition matrix, so every column sums to 1,000 customers and the end labels
    (50/150/300/500 → 136/217/230/238/180) are consistent'
  - 'Theme-correct in both renders: Imprint colors identical across themes, all chrome
    from ANYPLOT_TOKENS (ink, inkSoft, pageBg), page-colored block separators and
    label pills flip with the theme'
  - 'Clear typographic hierarchy: title, italic computed subtitle, bold quarter headers,
    outward end labels with values and a ''Band width ∝ transition count'' note in
    the legend row'
  - Bands translucent at 0.55 and colored by source tier, keeping crossing flows distinguishable
    in both themes as the Notes suggest
  weaknesses:
  - 'VQ-01 (both): the middle-column block labels are set at 10 px, against 13 px
    for the end-column labels and 15 px for the column headers, and blur in the 400
    px thumbnail → about 13 px (+3 px) to match the end labels. Likely cause: MID_LABEL_FONT
    = 10.'
  - 'SC-02 (both): the Q2 and Q3 columns name categories as truncated ''Ent'' and
    ''Chu'' instead of ''Enterprise'' and ''Churned'', so the spec''s category labels
    at every column are not clearly readable as category names → full names (the 18
    px blocks with pill backings have room for them). Likely cause: `cat.length >
    5 ? cat.slice(0, 3) : cat`.'
  - 'Suggestion: the `titleFontSize` branch can never fire for the fixed short title
    and could be dropped.'
  - 'Suggestion: the empty band between the legend row and the column headers could
    be tightened so the diagram starts closer to its legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: title "alluvial-basic · javascript · muix · anyplot.ai" top-left in dark ink (~35 % of width), italic subtitle "Simulated SaaS subscription-tier migration · 1,000 customers across 4 quarters", an HTML legend row (Enterprise, Pro, Basic, Free, Churned + italic "Band width ∝ transition count"), bold column headers Q1 2024 – Q4 2024, rotated "Customers" title at the far left. End labels "Enterprise · 50", "Pro · 150", "Basic · 300", "Free · 500" on the left and "Enterprise · 136", "Pro · 217", "Basic · 230", "Free · 238", "Churned · 180" on the right. Middle columns carry small pill labels "Ent", "Pro", "Basic", "Free", "Chu". All text dark on light and readable; the 10 px pills are the smallest text.
      Data: four columns of stacked blocks — Enterprise #009E73, Pro #C475FD, Basic #4467A3, Free #BD8233, Churned #AE3030 — with translucent (0.55) Bézier bands colored by source tier between neighboring columns. Large stable flows, thin upgrade/downgrade bands crossing down to Churned. First category in #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, column headers, end labels and "Customers" all in light ink; middle-column pills flip to dark page-colored backings with light text. No dark-on-dark text anywhere.
      Data: block colors identical to the light render; translucent bands read darker over the near-black page and blend where they overlap (e.g. Basic bands over Free read grey-beige), still distinguishable. Brand green clearly visible.
      Legibility verdict: PASS
