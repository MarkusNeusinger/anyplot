review:
  strengths:
  - 'Correct semantic-exception palette use: Free (the base/starting tier) takes brand
    green #009E73 and Churned takes matte red #AE3030 for the loss/negative state
    — exactly matches the Imprint semantic-exception guidance, and the mapping is
    identical across light and dark renders.'
  - Well-executed custom alluvial diagram built directly on MUI X's `useXScale`/`useYScale`
    composition hooks plus `ChartContainer` — the correct idiomatic pattern since
    MUI X community has no native alluvial/Sankey chart type, and a genuinely distinctive
    use of the library's low-level API surface.
  - Deterministic Markov-chain data generation keeps node populations and flow magnitudes
    consistent by construction (no separate bookkeeping) — fully reproducible and
    structurally elegant.
  - 'Theme-adaptive chrome is flawless: title, subtitle, legend, node labels, and
    column headers are all clearly readable in both the light and dark renders; node-rect
    strokes use `t.pageBg` for clean visual separation between adjacent segments.'
  - Ribbon opacity (0.55) and cubic-bezier interpolation produce a legible, professional-looking
    flow diagram with a clear top-to-bottom hierarchy — higher tiers rise to the top
    of each column, churn sinks to the bottom, reinforcing the narrative.
  weaknesses:
  - Category labels appear only at the first and last time-point columns (Q1 2024,
    Q4 2024) — the spec explicitly asks for labels that clearly identify categories
    at each node. Consider adding compact labels (or short value callouts) at Q2/Q3
    too, since a reader who doesn't cross-reference the legend can't identify mid-diagram
    nodes.
  - No axis title on the value axis — the y-scale (customer count) is only inferred
    from the node value labels and the subtitle text. Add a short axis label such
    as 'Customers' near the value axis so VQ-06 scores full marks for descriptive
    axes with units.
  - Churned is modeled as a fully absorbing state (TRANSITION.Churned.Churned = 1,
    no reactivation flow). A small win-back path (e.g. Churned -> Free) would show
    a richer, more realistic set of transition patterns and improve feature coverage.
  - 5 categories sit at the ΔE_CVD borderline (10.7-13.7) per the style guide's color-restraint
    table for n=5-6 series; the current text labels and legend already provide redundant
    encoding, but a distinct dash pattern or edge stroke on the visually closest hues
    (blue Pro vs. lavender Basic) would make the diagram more robust under color-vision
    deficiency.
