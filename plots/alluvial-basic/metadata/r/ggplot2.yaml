review:
  strengths:
  - Built a fully custom alluvial diagram from primitive geoms (geom_ribbon + geom_rect
    with smoothstep S-curve band interpolation) instead of falling back to ggalluvial
    or another library — correctly follows ggplot2.md's 'no workarounds' rule since
    ggalluvial is not installed
  - 'Correct Imprint palette: first series (STEM) is #009E73, with a semantically
    motivated grey (INK_MUTED) for ''Undeclared'' as an ''other'' anchor rather than
    a fifth arbitrary hue'
  - 'Theme-adaptive chrome verified correct in both renders: #FAF8F1 light / #1A1A17
    dark backgrounds, all visible text legible with no dark-on-dark or light-on-light
    failures'
  - No edge clipping (checked left/right canvas borders at pixel level) and generous,
    balanced margins; canvas is well utilized
  - Direct node labels at the first/last stage plus consistent color and stacking
    order across all three stages let a viewer decode the unlabeled middle column
    by color-matching — a clean, low-clutter alternative to a floating legend
  - Realistic, neutral academic-track dataset (STEM/Business/Arts/Undeclared) with
    plausible magnitudes and a believable mix of persistence and switching flows
  weaknesses:
  - 'The mini-legend meant to label the middle stage (Year 2) — built from geom_point
    + geom_text around x≈2, y≈1.09×max_y — never appears in either rendered PNG. Verified
    by cropping and zooming the region directly above the Year 2 column in both themes:
    nothing is drawn there. This ~15-line block is dead code; either fix why it falls
    outside the rendered panel range, or remove it since the edge labels plus consistent
    color/order already identify every category.'
  - With 16 flows per stage transition (4x4 category matrix), the interior diagonal
    crossing bands get visually dense — still traceable via alpha blending, but tracing
    one thin band across all three stages takes more effort than a diagram with fewer
    categories.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light-theme spec target.
      Chrome: Title "alluvial-basic · r · ggplot2 · anyplot.ai" in dark ink, top-left, fully readable, not clipped. "Year 1 / Year 2 / Year 3" x-axis labels below each column in soft grey ink, clearly legible. Category node labels ("Undeclared", "Arts", "Business", "STEM") sit directly left of the Year 1 column and right of the Year 3 column in dark ink — clearly readable, no clipping at the canvas edges. No y-axis ticks/gridlines (intentionally blank, appropriate for this chart type).
      Data: Three stacked node columns (Year 1/2/3) connected by curved ribbon bands. First/primary category (STEM) renders in Imprint green #009E73; Business in lavender #C475FD; Arts in blue #4467A3; Undeclared in a muted grey (semantic "other" anchor). Bands use alpha transparency (~0.45) so overlapping flows stay distinguishable. Band width is visibly proportional to flow magnitude (the STEM-to-STEM and Business-to-Business self-flows are the widest bands).
      Legibility verdict: PASS — all rendered text is clearly legible against the light background. Note: a small legend intended above the Year 2 column (per source code) does not actually render in this image (see Weaknesses) — this is a code bug, not a legibility failure, since no text/marks are drawn there at all.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark-theme spec target.
      Chrome: Title in light ink (#F0EFE8-ish), fully readable against the dark background. "Year 1 / Year 2 / Year 3" labels in soft light-grey ink, clearly legible, no dark-on-dark issues. Category node labels ("Undeclared", "Arts", "Business", "STEM") in light ink next to the outer columns, fully readable, no clipping.
      Data: Identical data colors to the light render — STEM green #009E73, Business lavender #C475FD, Arts blue #4467A3, Undeclared grey — confirmed unchanged; only the chrome (background/text) flipped to the dark tokens as required. Ribbon alpha blending still reads well against the dark surface.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements found in either theme. Same missing middle-stage legend as the light render (code bug, not a theme-specific legibility failure).
