review:
  strengths:
  - Fully custom alluvial construction built from native ggplot2 primitives (geom_ribbon
    + geom_rect) with a smoothstep S-curve interpolation for the flow bands — a sophisticated
    solution given ggplot2 has no native alluvial/Sankey geom, and correctly avoids
    falling back to another plotting backend per the library rules.
  - Flow totals are perfectly conserved between adjacent stages (e.g. 460 units enter
    and leave the Year 2 STEM node), reflecting careful, factually consistent data
    construction rather than approximate placeholder values.
  - 'Thoughtful semantic use of the Imprint palette: brand green #009E73 for STEM
    as the first series, and the theme-adaptive `muted` anchor for "Undeclared" (an
    other/disengaged category) instead of spending another ordinal palette slot —
    data colors stay identical between light and dark renders, only chrome flips correctly.'
  - 'Clean minimalist chrome: no grid, no axis ticks/spines, direct node labeling
    instead of a legend, and generous explicit margins — reads as a deliberate design
    choice rather than an unstyled default.'
  weaknesses:
  - Category labels appear only at the Year 1 and Year 3 nodes — the Year 2 nodes
    are unlabeled, relying solely on color-matching to identify categories mid-flow.
    Consider adding compact labels (or a small legend) for the middle stage(s) too.
  - Where flow ribbons overlap (the heavy crossing region between STEM/Business/Undeclared
    bands), the alpha=0.55 blending produces muddied intermediate hues that make it
    harder to trace an individual band's source category by color alone, especially
    in the dark render where blended purples/grays lose contrast against each other.
  - The node category label font (geom_text size=3.2mm ≈ 9pt) is noticeably smaller
    than the title and may become hard to read once the PNG is scaled down to a ~400px
    mobile thumbnail — consider bumping to ~4mm for better mobile legibility.
  - A dedicated smooth_band() helper function (called via lapply) is used to build
    the ribbon interpolation — a reasonable exception given the geometric complexity
    of alluvial curves, but it deviates from the plain Imports → Data → Plot → Save
    KISS structure expected elsewhere in the catalog.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "alluvial-basic · r · ggplot2 · anyplot.ai" in dark ink top-left, clearly readable. "Year 1 / Year 2 / Year 3" stage labels below each column in a softer ink tone, readable. No axis ticks, no grid, no legend box - four category node bars (Undeclared/gray-muted, Arts/blue, Business/lavender, STEM/green) are labeled directly at the first and last stage only.
      Data: Flow ribbons connect nodes across the three stages, colored by their origin category with ~0.55 alpha, width proportional to flow magnitude. First series (STEM) renders in brand green #009E73. All text is dark-on-light and clearly legible; no light-on-light issues found.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title and "Year 1/2/3" labels render in light ink, clearly legible against the dark surface. Node category labels ("Undeclared", "Arts", "Business", "STEM") at the first/last stage are also light-colored and readable. No dark-on-dark text found anywhere.
      Data: Node bar colors and ribbon colors are identical to the light render (STEM green #009E73, Business lavender, Arts blue, Undeclared using the theme-adaptive muted anchor) - only the chrome (background, text) flipped as expected. Brand green remains clearly visible on the dark surface.
      Legibility verdict: PASS
