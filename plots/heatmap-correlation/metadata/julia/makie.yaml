review:
  strengths:
  - 'Directly resolved both attempt-1 weaknesses: near-zero cells now get a thin PAGE_BG
    stroke via poly!/Rect2f (heatmap! doesn''t expose per-cell strokewidth/strokecolor
    in this Makie version), giving clean cell separation in both themes'
  - 'New focal-point device: the strongest off-diagonal correlation (US Equities /
    Int''l Equities, 0.83) is rendered with a larger, bold annotation, giving the
    matrix a clear visual hierarchy beyond the standard diagonal-at-1.0 pattern'
  - 'Correct diverging Imprint colormap (#AE3030 -> theme-adaptive midpoint -> #4467A3)
    with colorrange fixed to (-1, 1) exactly as the spec requires, identical between
    light and dark'
  - Upper triangle masked while keeping variable names on both axes, exactly matching
    the spec's redundancy-reduction suggestion
  - Per-cell annotation color chosen from actual cell luminance, keeping the 2-decimal
    correlation labels legible against both saturated extremes and the near-neutral
    middle of the colormap in both themes
  - Realistic portfolio-diversification dataset (8 asset classes driven by two latent
    macro factors plus idiosyncratic noise) producing a plausible, non-controversial
    spread of correlations
  - Canvas lands exactly on the 2400x2400 square target with no edge clipping on rotated
    x labels or the colorbar
  - Theme-adaptive chrome fully threaded through background, title, tick labels, and
    spines while data colors stay identical between themes
  weaknesses:
  - '`using ColorSchemes` is imported but never referenced directly in the script
    — cgrad(...) and get(...) on the resulting gradient are provided via PlotUtils
    (re-exported by Makie), so this is an unused import; remove it for CQ-03 cleanliness'
  - Layout is still a conventional masked-triangle correlation heatmap with a full
    four-sided spine frame retained rather than more minimal chrome; the poly!-based
    per-cell rendering is a solid workaround but heatmap! remains the more idiomatic
    Makie primitive for this plot type
  - Design excellence, while improved, still relies mainly on the two devices added
    this round (cell stroke, single bolded focal cell) — a further pass could vary
    annotation weight/size across a small tier of top correlations, or use spine removal
    for a cleaner frame, to push refinement further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-correlation · julia · makie · anyplot.ai" at top, centered, comfortably sized. Rotated (45°) x tick labels and horizontal y tick labels list all 8 asset names (US Equities, Int'l Equities, Corp Bonds, Treasuries, Real Estate, Commodities, Gold, Cash) in a soft dark grey. A four-sided ink-soft spine frames the plot area. Colorbar on the right labeled "Pearson correlation" with ticks from -1.0 to 1.0.
      Data: Masked lower-triangle correlation matrix (incl. diagonal). Diverging Imprint scale — deep blue at the diagonal (1.00) and for positive correlations, near-white/cream for near-zero, dusty red for negative. Each filled cell has a thin cream stroke separating it from its neighbors, and every cell is annotated with its value to 2 decimal places in dark or light text chosen per-cell for contrast. The strongest off-diagonal pair (US Equities / Int'l Equities, 0.83, bottom-left) is rendered in a visibly larger, bold typeface as a focal point.
      Legibility verdict: PASS — all title, tick, and cell-annotation text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, tick labels, spines, and colorbar all flip to light-ink / soft-grey tokens and remain fully legible; same layout and content as the light render.
      Data: Colors are identical to the light render — same diverging colormap and fixed (-1, 1) colorrange, confirming only chrome flipped. Cell strokes now use the near-black PAGE_BG token, which keeps individual cells (including near-zero ones close to the theme-adaptive diverging midpoint) visually separated instead of blending into the background — this directly addresses the attempt-1 weakness about faint cell boundaries in dark mode. The bolded 0.83 focal cell is equally prominent here in white bold text.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome and per-cell annotation text reads clearly against the dark background.
