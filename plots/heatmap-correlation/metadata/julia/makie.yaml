review:
  strengths:
  - 'Correct diverging Imprint colormap (#AE3030 → theme-adaptive midpoint → #4467A3)
    with colorrange fixed to (-1, 1) exactly as the spec requires'
  - Upper triangle masked (nan_color = :transparent) to remove the redundant mirrored
    half while keeping variable names on both axes
  - Per-cell annotation color is chosen from the actual cell luminance, so the 2-decimal
    correlation labels stay legible against both the saturated red/blue extremes and
    the near-neutral middle of the colormap, in both themes
  - 'Realistic portfolio-diversification dataset: 8 asset classes driven by two latent
    macro factors plus idiosyncratic noise, producing a plausible spread of correlations
    from ~0.83 (US/Int''l Equities) down to near-zero (Cash)'
  - Canvas lands exactly on the 2400x2400 square target with no edge clipping on the
    rotated x tick labels or the colorbar
  - 'Theme-adaptive chrome fully threaded through: background, title, tick labels,
    and spines correctly flip between the FAF8F1 light and 1A1A17 dark tokens while
    data colors stay identical'
  weaknesses:
  - In the dark render, several near-zero correlation cells (e.g. 0.03, -0.01, -0.09)
    sit so close to the theme-adaptive midpoint that they nearly blend into the page
    background, making individual cell boundaries harder to distinguish at a glance
    — a subtle 1px stroke between cells (e.g. `strokewidth = 1, strokecolor = PAGE_BG`
    on the heatmap) would restore separation without touching the palette
  - Design execution is competent but fairly conventional for a masked correlation
    heatmap — no additional visual-hierarchy device (e.g. ordering assets by cluster
    similarity, or subtly emphasizing the strongest off-diagonal correlations) beyond
    the standard triangle mask and diagonal-at-1.0 pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-correlation · julia · makie · anyplot.ai" reads clearly at top; rotated (45°) x-axis category labels and horizontal y-axis category labels for all 8 asset classes are dark/soft-grey and fully legible; colorbar on the right is labeled "Pearson correlation" with ticks from -1.0 to 1.0, all readable.
      Data: Masked lower-triangle correlation matrix in the Imprint diverging colormap — deep blue at the diagonal (1.00), blues for positive correlations (e.g. 0.83 US/Int'l Equities), near-white for near-zero cells, and dusty red for negative correlations (e.g. -0.22 Treasuries/Commodities). Each filled cell is annotated with its value to 2 decimal places, in either dark or light text chosen for contrast against that cell's fill color.
      Legibility verdict: PASS — no light-on-light or unreadable text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis/tick labels flip to light ink/soft-grey tones and remain clearly visible against the dark surface; colorbar and its ticks/label are equally legible.
      Data: Data colors are identical to the light render — same blue/white/red diverging scale and colorrange (-1, 1), confirming only chrome flipped. Per-cell text again adapts to light or dark based on the cell's own luminance, so labels stay readable even where the diverging colormap approaches the dark-theme midpoint (which is deliberately close to the page background, per the theme-adaptive diverging spec).
      Legibility verdict: PASS — no dark-on-dark failures found; all annotation text remains readable, including in the near-midpoint cells where contrast is tightest.
