review:
  strengths:
  - 'Correct diverging imprint_div palette using the exact style-guide recipe (#AE3030
    -> theme-adaptive midpoint -> #4467A3) with a fixed -1..1 colorbar range for consistent
    cross-plot interpretation.'
  - Smart per-cell text-contrast logic (scale_color_manual keyed on abs(correlation)
    > 0.55) keeps every annotation legible against both saturated and pale tile fills,
    in both themes.
  - Upper-triangle masking cleanly reduces redundancy per the spec's suggestion, coord_fixed
    keeps cells square, and descriptive display_labels replace terse mtcars variable
    codes (e.g. 'Horsepower' instead of 'hp') for readability.
  - Clean, idiomatic tidyverse pipeline (cor() -> pivot_longer() -> filter()) that
    is reproducible and easy to follow, using a real, neutral dataset (mtcars) appropriate
    for a multicollinearity-detection use case.
  weaknesses:
  - Near-zero-correlation cells (e.g. '0.09', '-0.09', '-0.13') fill to a color identical
    to the page background (theme-adaptive midpoint), and tile borders also use PAGE_BG,
    so those specific cells' boundaries nearly disappear into the surrounding canvas,
    especially in dark mode -- a subtle hairline stroke in a fixed neutral tone (independent
    of PAGE_BG) around every tile would preserve the grid structure at near-zero values
    without breaking the mandated midpoint recipe.
  - Diagonal cells (self-correlation = 1.00) carry no analytical information but receive
    the same full-saturation blue treatment as the most informative off-diagonal cells;
    de-emphasizing them (e.g. a muted gray fill) would sharpen the storytelling focus
    on the relationships that actually matter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "heatmap-correlation · r · ggplot2 · anyplot.ai" in dark ink, clearly legible. Y-axis
        labels (MPG, Displacement, Horsepower, Axle Ratio, Weight, 1/4 Mile Time, Gears, Carburetors) in
        soft dark gray, horizontal and legible. X-axis labels rotated ~35 degrees, same soft gray, legible,
        not clipped at the bottom edge. Colorbar legend "Correlation" on the right with clear 1.0/0.5/0.0/
        -0.5/-1.0 tick labels.
      Data: Lower-triangle-only correlation matrix (upper triangle masked per spec suggestion). Diagonal
        cells all read "1.00" in saturated blue with white text. Off-diagonal cells range from matte red
        (negative correlation, e.g. Weight/MPG = -0.87) through a near-background midpoint (near-zero
        correlation, e.g. Axle Ratio/1-4 Mile Time = 0.09) to saturated blue (strong positive correlation,
        e.g. Displacement/Weight = 0.89). Each cell is annotated with its value to 2 decimal places; text
        color flips between dark ink and near-white depending on fill saturation, and every value observed
        is legible against its cell.
      Legibility verdict: PASS. All titles, axis labels, tick labels, and cell annotations are readable
        against the light background. The only softness is that near-zero cells (fill ~= page background)
        have low boundary contrast against the canvas -- text inside them stays legible, only the tile edge
        is faint.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Title, y-axis labels, and rotated x-axis labels all render in light ink/gray, clearly visible
        against the dark background -- no dark-on-dark failures observed. Colorbar legend and its tick
        labels are equally legible in light gray/white.
      Data: Same correlation values and same cell colors as the light render (positions in the diverging
        imprint_div scale, e.g. Weight/MPG still -0.87 in matte red, Displacement/Weight still 0.89 in
        blue) -- data colors are correctly identical between themes; only chrome flipped. The theme-adaptive
        midpoint is now near-black, so near-zero cells (e.g. Axle Ratio/1-4 Mile Time = 0.09, Horsepower/
        Gears = -0.13) fill to a color very close to the page background -- this is the mandated imprint_div
        behavior (midpoint = PAGE_BG per the style guide), and cell text stays legible (light ink), but the
        tile boundary for those specific cells is faint against the surrounding canvas.
      Legibility verdict: PASS. No dark-on-dark text failures. All annotation text remains readable; the
        only nuance is the intentionally near-invisible tile boundary at the theme-adaptive midpoint for
        near-zero correlations, which is a design consequence of the required midpoint recipe rather than a
        bug.
