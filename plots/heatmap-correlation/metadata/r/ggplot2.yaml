review:
  strengths:
  - Fixed hairline tile borders (color = HAIRLINE, ink at 15% alpha, theme-independent)
    now correctly resolve attempt 1's weakness — near-zero-correlation cells stay
    visually anchored to the grid in both themes instead of fading into the page background
  - 'Correct diverging imprint_div palette using the exact style-guide recipe (#AE3030
    to theme-adaptive midpoint to #4467A3), with a fixed -1..1 colorbar range for
    consistent cross-plot interpretation'
  - Smart per-cell text-contrast logic (scale_color_manual keyed on abs(correlation)
    > 0.55) keeps every annotation legible against both saturated and pale tile fills,
    in both themes
  - Lower-triangle masking cleanly reduces redundancy per the spec's suggestion, coord_fixed
    keeps cells square, and descriptive display_labels replace terse mtcars variable
    codes
  - Clean, idiomatic tidyverse pipeline (cor() -> pivot_longer() -> filter()), reproducible,
    using a real, neutral dataset (mtcars) appropriate for a multicollinearity-detection
    use case
  - 'Backgrounds verified pixel-exact against the style guide: light corner samples
    to #FAF8F1, dark corner samples to #1A1A17'
  weaknesses:
  - 'Diagonal-cell desaturation does not render: the code sets a second geom_tile
    layer with a literal fill = DIAG_FILL ("#5C5B54") for is_diag rows, intended to
    mute the uninformative self-correlation cells (per the inline comment). Pixel-sampled
    directly from the saved PNGs, every diagonal cell in BOTH plot-light.png and plot-dark.png
    comes back RGB(68,103,163) = #4467A3 -- exactly scale_fill_gradient2''s ''high''
    stop, not the intended gray. All 8 diagonal cells were sampled independently (MPG,
    Displacement, Horsepower, Weight, Gears, Carburetors) with identical results,
    so this is not a one-off render glitch. The visual effect is unchanged from attempt
    1: diagonal 1.00 cells still carry the same full-saturation blue as genuine high
    off-diagonal correlations, undercutting the storytelling intent the comment claims
    to achieve. For the next revision: verify with ggplot_build(p)$data[[2]]$fill
    (or an equivalent build-time inspection) whether the literal fill is actually
    reaching the draw step before assuming the ggplot2 call is correct -- a fixed-color
    layer mixed with an active continuous fill scale on the same aesthetic can require
    an identity mapping (aes(fill = I(DIAG_FILL))) or a separate scale (e.g. via ggnewscale::new_scale_fill())
    to reliably bypass scale_fill_gradient2, since apparently the plain `fill = DIAG_FILL`
    parameter is being swallowed here.'
  - 'Related palette point for whichever fix is applied: DIAG_FILL ("#5C5B54") is
    a custom hex not in the Imprint categorical palette or the 3 semantic anchors.
    It happens to not violate VQ-07 today only because it never actually renders.
    If the diagonal-fill bug gets fixed, swap the hardcoded gray for the theme-adaptive
    `muted` anchor (#6B6A63 light / #A8A79F dark) -- built exactly for this ''other/rest/disabled,
    recede behind the data'' role -- instead of a fixed custom hex, to stay palette-compliant.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at the canvas corner as RGB(250,248,241) = #FAF8F1 exactly matching the style guide.
      Chrome: Title "heatmap-correlation · r · ggplot2 · anyplot.ai" in dark ink, clearly legible. Y-axis category labels (MPG, Displacement, Horsepower, Axle Ratio, Weight, 1/4 Mile Time, Gears, Carburetors) in soft dark gray, horizontal, not overlapping. X-axis labels rotated ~35 degrees, same soft gray, not clipped at the bottom or side edges. Colorbar legend "Correlation" on the right with clear 1.0/0.5/0.0/-0.5/-1.0 ticks.
      Data: Lower-triangle-only correlation matrix (upper triangle masked, per spec). Off-diagonal cells range from matte red (negative, e.g. Weight/MPG = -0.87) through a near-background midpoint (near-zero, e.g. Axle Ratio/1-4 Mile Time = 0.09) to saturated blue (strong positive, e.g. Displacement/Weight = 0.89), each annotated to 2 decimal places with contrast-aware text color. Every cell now carries a thin, theme-independent hairline border (new since attempt 1), so even near-zero cells stay visually anchored to the grid instead of blending into the page background. Diagonal cells all read "1.00" in the same saturated blue as genuine high off-diagonal correlations (pixel-verified as #4467A3) -- the code's attempt to desaturate them (DIAG_FILL = "#5C5B54") does not actually render; see Weaknesses.
      Legibility verdict: PASS (all text readable; the one open issue is a color-mapping bug, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at the canvas corner as RGB(26,26,23) = #1A1A17 exactly matching the style guide.
      Chrome: Title, axis labels, and colorbar text all render in light ink/gray (#F0EFE8 / #B8B7B0 tokens) -- no dark-on-dark failures found anywhere, including the low-correlation cells whose fill is close to the page background (e.g. "-0.09", "-0.17", "0.09" all render in clearly legible light text against their near-black or dark-maroon fills, confirmed via cropped close-ups).
      Data: Data colors are identical to the light render (e.g. Weight/MPG still -0.87 in matte red, Displacement/Weight still 0.89 in blue) -- only chrome flipped, as required. Hairline borders (theme-adaptive rgba ink at 15% alpha) are now visible around every tile, including near-zero cells, resolving attempt 1's "boundaries nearly disappear" weakness. Diagonal cells again read "1.00" in the same #4467A3 blue as genuine strong positive correlations rather than the intended muted gray -- identical defect to the light render.
      Legibility verdict: PASS (all text readable in both themes; no theme-adaptation failures)
