review:
  strengths:
  - Masks the upper triangle (including reflecting only the lower half) exactly as
    the spec note suggests, reducing redundancy while keeping the diagonal visible
    for reference
  - 'Diverging fill scale uses the canonical Imprint imprint_div anchors (#AE3030
    low, page-background mid, #4467A3 high) with limits fixed to (-1, 1), matching
    the spec''s ''fixed colorbar range'' requirement precisely'
  - Per-cell annotation text color is computed from each cell's actual rendered luminance
    (relative-luminance formula) rather than a single static color, so every '0.XX'
    label stays legible against light and dark fills in both themes
  - Bold outline layer (geom_tile subset) highlights |r| >= 0.7 relationships, giving
    the viewer an immediate focal point on the strongest correlations instead of a
    flat data dump
  - Diagonal cells are masked to a neutral ink tone instead of the hottest color-scale
    endpoint, avoiding a misleading visual read that the trivial self-correlation
    is the most 'extreme' value on the map
  - 'Correlation matrix covers the full realistic range for a portfolio use case:
    strong positive (stocks vs. tech index 0.75-0.91), negative (bonds vs. stocks
    -0.18 to -0.35), and near-zero (gold vs. stocks) relationships'
  - Title matches the mandated '{spec-id} · {language} · {library} · anyplot.ai' format
    exactly, and both renders share identical data colors with only chrome (background/text/border)
    flipping between themes
  weaknesses:
  - 'CQ-01 KISS violation: the script defines five helper functions (_hex_to_rgb,
    _lerp_hex, _relative_luminance, cell_fill_hex, text_color_for) instead of the
    flat Imports -> Data -> Plot -> Save structure; consider precomputing the annotation
    text colors more directly or accepting a simpler two-tone contrast rule to cut
    the function count'
  - cell_fill_hex() manually re-implements scale_fill_gradient2's low/mid/high interpolation
    outside the ggplot grammar purely to guess each cell's rendered color for contrast
    purposes -- this duplicated logic could silently drift out of sync if the scale's
    low/mid/high/midpoint arguments are ever retuned in a repair pass
  - On the square 2400x2400 canvas the long mandated title fills close to ~85-90%
    of the plot width (wider than it would on a landscape canvas) -- still inside
    the canvas with no clipping, but there is little breathing room left on either
    side
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "heatmap-correlation · python · plotnine · anyplot.ai" at top, fully visible and centered. X-axis label "Portfolio Asset" (rotated 45 deg tick labels: Stock_A...Tech_Index) and Y-axis label "Portfolio Asset" (Tech_Index...Stock_A) both dark/soft-ink and clearly readable. Colorbar legend "Correlation Coefficient" sits in the masked upper-right region with a clear -1.0 to 1.0 scale.
      Data: Lower-triangular matrix (incl. diagonal) of tiles. Diagonal cells are a neutral grey (masked, annotated 1.00). Off-diagonal cells use a red (#AE3030) <-> off-white <-> blue (#4467A3) diverging scale; the first strong positive relationships (Stock_A/B/C vs. Tech_Index, and Stock_A vs. Stock_B/C) are outlined with a bold dark border. Each cell's numeric label (2 decimals) automatically switches between dark and light text depending on the cell's own fill luminance, and all labels are legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title and both axis titles/tick labels render in light ink tones, clearly visible against the near-black background. The strong-correlation outline switches from dark to a light/white stroke so it still stands out against the dark tiles. Colorbar legend box and text are light-colored and fully readable.
      Data: Same red/off-white/blue diverging fill colors as the light render -- confirmed identical data-color anchors, only the chrome (background, borders, text, outline color) flips for the theme. Diagonal neutral-grey cells and per-cell adaptive text color both carry over correctly with no dark-on-dark or light-on-light failures anywhere on the matrix.
      Legibility verdict: PASS
