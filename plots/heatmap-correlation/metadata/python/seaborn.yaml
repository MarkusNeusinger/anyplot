review:
  strengths:
  - imprint_div built with the theme-adaptive midpoint, centered at 0 and fixed to
    -1..1, so sign and strength read from color in both themes
  - Cell values switch between light and dark theme ink by the cell's luminance, keeping
    every number legible at both ends of the colormap in both renders
  - One sns.heatmap call carries mask, square cells, annotations, fixed colorbar ticks
    and page-colored cell gutters
  - Exact 2400x2400 square canvas with balanced matrix, colorbar and rotated labels;
    nothing clipped
  - Plausible real-estate data with strong, weak, near-zero and negative correlations
  weaknesses:
  - 'Suggestion: the top and bottom margins leave about a quarter of the canvas empty;
    a slightly larger matrix would use the square better.'
  - 'Suggestion: a bolder weight or outline on the strongest off-diagonal cells (Bedrooms–Bathrooms
    0.84, Distance–Crime 0.81) could give the matrix a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: title 'heatmap-correlation · python · seaborn · anyplot.ai' in dark ink, centered, ~70% width; y tick labels (Price ($K) ... Crime index) horizontal and x tick labels rotated 45 deg in INK_SOFT; colorbar on the right with ticks -1.0 to 1.0 and the label 'Correlation coefficient'. All readable.
      Data: lower-triangle 9x9 correlation matrix with page-colored gutters; imprint_div red (#AE3030) for negatives, blue (#4467A3) for positives, page-colored near zero. Diagonal 1.00 cells in solid blue with light ink; other values in dark ink. Strongest off-diagonal 0.84 (Bedrooms–Bathrooms), most negative -0.33 (Age–Price). No categorical series, so no #009E73 needed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and colorbar label in light ink, tick labels in light INK_SOFT; no dark-on-dark text.
      Data: same matrix and colormap anchors; the midpoint flips to #1A1A17, so near-zero cells read dark and the value ink flips to light. Red and blue pole colors identical to the light render.
      Legibility verdict: PASS
