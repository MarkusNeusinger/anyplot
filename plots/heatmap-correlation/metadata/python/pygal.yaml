review:
  strengths:
  - 'Diverging colormap is hand-built to match the Imprint imprint_div spec exactly:
    matte-red (#AE3030) ↔ theme-adaptive midpoint (PAGE_BG) ↔ blue (#4467A3), with
    the midpoint correctly flipping between #FAF8F1 (light) and #1A1A17 (dark) while
    keeping data colors identical across themes.'
  - Fixed -1..+1 colorbar range with clear +1.00 / 0.00 / -1.00 tick labels and a
    "Correlation" title, exactly matching the spec's requirement for a consistent,
    fixed-range colorbar.
  - Per-cell text color is computed from background luminance (_get_text_color), so
    the 2-decimal correlation values stay readable against both light and dark cell
    fills without manual tuning.
  - Row-label width and column-label drop are computed dynamically from the longest
    label string, so long variable names never collide with the axis titles — a genuinely
    robust layout technique.
  - 'Realistic, neutral cheminformatics dataset (molecular descriptors: Mol. Weight,
    LogP, TPSA, H-Bond Donors/Acceptors, Rotatable Bonds, Aromatic Rings, LogS) with
    chemically plausible correlation signs and a full spread from -0.80 to 1.00.'
  weaknesses:
  - 'VQ-05: Excess blank vertical space between the title and the heatmap grid — roughly
    the top ~18-20% of the 2400x2400 canvas is empty. The custom _plot() adds label_margin_top=60
    on top of the chart''s own margin_top=200, and pygal separately reserves its own
    automatic title-height band above that, so three sources of top padding stack.
    Reduce margin_top to roughly 60-100 and/or drop the separate label_margin_top=60
    term so the grid grows to fill the reclaimed space and the whitespace is balanced
    top-to-bottom rather than concentrated above the title.'
  - 'CQ-01: The correlation matrix is fully hand-authored (no np.random usage despite
    np.random.seed(42) being called) — the seed call is vestigial dead code since
    nothing random is generated. Either remove the unused seed line or actually derive
    the matrix from a seeded random process for genuine reproducibility signal.'
  - 'LM-01/LM-02: The cell grid, labels, and colorbar are drawn entirely via low-level
    self.svg.node(...) SVG calls rather than through any pygal higher-level data/series
    API, so beyond the Style theming and the Graph-subclass extension point, little
    of pygal''s own chart machinery is exercised — consider leveraging more of pygal''s
    box/view/scale utilities where possible to make the library usage feel less like
    raw SVG drawing.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "heatmap-correlation · pygal · anyplot.ai" in dark ink, clearly legible, centered near the top with a large blank band beneath it before the grid begins. Row labels (left, dark text) and rotated 45° column labels (bottom, dark text) for the 8 molecular descriptors are all fully visible with no clipping. "Molecular Descriptors" axis titles appear on both the x- and y-axis in bold dark text. Colorbar to the right of the grid is labeled "+1.00", " 0.00", "-1.00" with a "Correlation" title above it, all in readable dark/muted tones.
      Data: 8x8 symmetric correlation matrix, diagonal = 1.00 (darkest blue), off-diagonal cells interpolated between matte-red (negative, e.g. LogP/LogS = -0.80) through a near-cream midpoint (near-zero, e.g. Aromatic Rings/H-Bond Acceptors = 0.05) to blue (positive, e.g. TPSA/H-Bond Acceptors = 0.85). Each cell shows its value to 2 decimal places, with white or dark text automatically chosen per cell for contrast.
      Legibility verdict: PASS — all title, axis, tick, cell-value, and colorbar text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title, now rendered in light ink, clearly legible against the dark background. Row labels, rotated column labels, and both "Molecular Descriptors" axis titles switch to light/muted gray tones and remain fully readable. Colorbar labels and title also switch to light tones and stay legible. The same top-of-canvas blank band before the grid is present here too.
      Data: Cell fill colors are pixel-identical to the light render — same matte-red → near-neutral → blue diverging scale, same values in the same positions (e.g. LogP/LogS still -0.80, TPSA/H-Bond Acceptors still 0.85, diagonal still 1.00). Only the page background, text/label colors, and cell-border stroke color (which follows PAGE_BG) have flipped for the theme; the data-color mapping itself is unchanged.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome text (title, labels, tick/colorbar text) uses light ink and reads clearly against the near-black surface.
