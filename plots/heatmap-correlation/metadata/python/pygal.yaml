review:
  strengths:
  - 'Imprint diverging field ramp (#AE3030 -> page color -> #4467A3) with the midpoint
    flipping to the page color per theme, as the style guide asks for fields'
  - Fixed -1..+1 color bar with +1.00 / 0.00 / -1.00 ticks and a 'Correlation' title,
    so sign and strength read from color alone
  - 'Cell text switches between #FAF8F1 and #1A1A17 by fill luminance, keeping every
    2-decimal value legible at both ends of the ramp in both themes'
  - Label margins scale with the longest variable name, so the 45-degree column labels
    and row labels never collide with the axis titles
  - Realistic, neutral QSAR descriptor matrix with a full spread of strong, weak and
    near-zero correlations of both signs
  weaknesses:
  - 'VQ-05 (both): the 8x8 grid fills only about half the canvas height, leaving a
    blank band of about 15% of the height between the title and the grid and another
    below the x-axis title → grow the grid until the vertical bands are a few percent.
    Likely cause: cell = min(available_width, available_height) is bound by the width
    after margin_left plus margin_right=340, so the free height stays empty.'
  - 'CQ-01 (code): line 92 `class CorrelationHeatmap(Graph)` holds the whole drawing
    in `_plot()` → draw at the top level without a class (the agent chat''s validator
    refuses class definitions). Likely cause: subclassing pygal''s Graph to get an
    SVG canvas.'
  - 'Suggestion: the ''Correlation'' color bar title starts only a few pixels right
    of the grid''s last column; centering it over the bar with a little more room
    would read cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'heatmap-correlation · python · pygal · anyplot.ai' in dark ink at the top; bold row labels and 45-degree column labels in INK_SOFT; 'Molecular Descriptors' axis titles on both axes in bold dark ink; color bar on the right titled 'Correlation' with +1.00 / 0.00 / -1.00 ticks. All readable; no clipping or overlap.
      Data: 8x8 symmetric matrix of molecular descriptors, rounded cells with page-colored gaps; red (#AE3030) for negative, near-cream at zero, blue (#4467A3) for positive; diagonal 1.00 in full blue. Values to 2 decimals, light text on dark fills (1.00, -0.80, 0.85) and dark text on pale fills. Grid occupies about half the canvas height with blank bands above and below.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles, row and column labels, color bar title and ticks all in light tones; no dark-on-dark text.
      Data: same red and blue endpoint hues as light; the ramp's midpoint is the dark page color, so near-zero cells read near-black; all cell values in light text and readable, including 0.05 and 0.10.
      Legibility verdict: PASS
