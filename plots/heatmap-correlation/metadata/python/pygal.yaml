review:
  strengths:
  - 'Diverging colormap is hand-built to match the Imprint imprint_div spec exactly:
    matte-red (#AE3030) ↔ theme-adaptive midpoint (PAGE_BG) ↔ blue (#4467A3), with
    the midpoint correctly flipping between #FAF8F1 (light) and #1A1A17 (dark) while
    keeping data colors identical across themes.'
  - Fixed -1..+1 colorbar range with clear +1.00 / 0.00 / -1.00 tick labels and a
    "Correlation" title, exactly matching the spec's requirement for a consistent,
    fixed-range colorbar.
  - Per-cell text color is computed from background luminance (_get_text_color), so
    the 2-decimal correlation values stay readable against both light and dark cell
    fills without manual tuning — verified down to the near-zero 0.05 cell in both
    renders.
  - Row-label width and column-label drop are computed dynamically from the longest
    label string, so long variable names never collide with the axis titles.
  - 'Attempt-2 fix: the vestigial np.random.seed(42)/numpy import flagged in the previous
    review is gone — the matrix is now fully hand-authored with zero dead code.'
  - 'Attempt-2 fix: margin_top (200→60) and label_margin_top (60→20) were reduced,
    and the vertical whitespace is now balanced — roughly ~16% blank above the grid
    and ~15% below the rotated column labels, instead of the previous top-heavy imbalance.'
  - 'Realistic, neutral cheminformatics dataset (molecular descriptors: Mol. Weight,
    LogP, TPSA, H-Bond Donors/Acceptors, Rotatable Bonds, Aromatic Rings, LogS) with
    chemically plausible correlation signs and a full spread from -0.80 to 1.00.'
  weaknesses:
  - 'VQ-05: The margin fix balanced the whitespace top-to-bottom, but the total blank
    vertical space is still large — ~380px (~16%) between title and grid, ~373px (~15%)
    below the rotated column labels. Consider growing cell_size / grid_size to reclaim
    more of the freed vertical space into the grid itself (e.g. relax the 0.95 shrink
    factor or reduce margin_right=320) rather than only recentering the same amount
    of blank space.'
  - 'LM-01/LM-02: The cell grid, labels, and colorbar are still drawn entirely via
    low-level self.svg.node(...) SVG calls rather than through any pygal higher-level
    data/series API — unchanged from the previous review, though this is a known constraint
    of pygal lacking a native heatmap type.'
  - 'CQ-01: The custom Graph subclass with hand-rolled _plot()/_compute() still deviates
    from the plain imports-data-plot-save KISS shape — justified by pygal''s lack
    of a native heatmap type, but still a minor structural deduction.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly (sampled RGB 250,248,241) — not pure white, not dark.
      Chrome: Title "heatmap-correlation · pygal · anyplot.ai" in dark ink, clearly legible, centered near the top. Row labels (left, dark text) and rotated 45° column labels (bottom, dark text) for the 8 molecular descriptors are all fully visible with no clipping. "Molecular Descriptors" axis titles appear on both x- and y-axis in bold dark text. Colorbar to the right of the grid is labeled "+1.00", " 0.00", "-1.00" with a "Correlation" title above it, all in readable dark/muted tones. A blank band (~16% of canvas height) separates the title from the grid, and a similar blank band (~15%) sits below the rotated column labels — now balanced top-to-bottom rather than concentrated at the top.
      Data: 8x8 symmetric correlation matrix, diagonal = 1.00 (darkest blue), off-diagonal cells interpolated between matte-red (negative, e.g. LogP/LogS = -0.80) through a near-cream midpoint (near-zero, e.g. Aromatic Rings/H-Bond Acceptors = 0.05) to blue (positive, e.g. TPSA/H-Bond Acceptors = 0.85). Each cell shows its value to 2 decimal places, with white or dark text automatically chosen per cell for contrast — confirmed via pixel crop that the near-zero 0.05 cell (pale background) still renders legible black text.
      Legibility verdict: PASS — all title, axis, tick, cell-value, and colorbar text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly (sampled RGB 26,26,23) — not pure black, not light.
      Chrome: Same title, now rendered in light ink, clearly legible against the dark background. Row labels, rotated column labels, and both "Molecular Descriptors" axis titles switch to light/muted gray tones and remain fully readable. Colorbar labels and title also switch to light tones and stay legible. Same balanced blank bands above/below the grid as the light render.
      Data: Cell fill colors are pixel-identical to the light render's endpoint hues (matte-red #AE3030 and blue #4467A3 stay constant), only the theme-adaptive midpoint (PAGE_BG) shifts from cream to near-black as specified for imprint_div — this is the correct, spec-mandated behavior, not a theme-compliance violation. Same values in the same positions (e.g. LogP/LogS still -0.80, TPSA/H-Bond Acceptors still 0.85, diagonal still 1.00).
      Legibility verdict: PASS — no dark-on-dark failures; the near-zero 0.05 cell (near-background fill in dark mode) still renders white text at full contrast, confirmed via pixel crop. All chrome text reads clearly against the near-black surface.
