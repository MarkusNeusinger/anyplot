review:
  strengths:
  - 'Excellent use of the Imprint diverging colormap (imprint_div: #AE3030 -> theme-adaptive
    midpoint -> #4467A3) with a fixed -1 to 1 colorbar range, exactly matching the
    spec''s fixed-scale requirement'
  - Per-cell adaptive text color (white on saturated cells, INK on near-zero cells)
    via scale_color_identity keeps every correlation value legible regardless of the
    underlying tile color, in both themes
  - 'Clean, minimal-chrome design: no grid, no axis ticks/lines, no spines, generous
    whitespace, and fully theme-correct chrome (backgrounds, text) in both light and
    dark renders'
  - Realistic, coherent business dataset (revenue, marketing spend, employees, satisfaction,
    profit, market share, innovation, debt ratio) with an intentionally independent
    variable (Innovation) and a full spread of correlation strengths and signs
  weaknesses:
  - 'The triangle-masking loop (`if var_pos[var_x] > var_pos[var_y]: continue`) and
    the strongest-correlation highlight layer (`highlight_df` with alpha=0 outline)
    have no visible effect in either render -- both plot-light.png and plot-dark.png
    show the FULL unmasked 8x8 symmetric matrix (e.g. the Revenue x Marketing cell
    at 0.78 appears in both the Revenue row and the Marketing row, which the mask
    should have removed from one side). Not a spec violation (masking is only ''considered'',
    and a full symmetric matrix is an explicitly valid display per the spec notes),
    but it is dead/misleading code -- either make the filtering and highlight actually
    take effect, or remove the non-functional logic and its comments so the code matches
    what it visibly renders'
  - Because the intended focal-point highlight doesn't render, there's no visual hierarchy
    singling out the standout Revenue<->Marketing relationship (0.78) -- Data Storytelling
    stays at the default 'just displays data' level; a working outline, a bolder/larger
    label on the strongest cell, or a short annotation callout would genuinely guide
    the reader's eye
  - The colorbar has noticeably more empty space above and below it than the plot
    height uses -- lengthening it closer to the full plot height (or centering it
    more tightly) would balance the layout better
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Bold dark title "heatmap-correlation · python · letsplot · anyplot.ai" spans ~65-70% of canvas width, clearly readable. Y-axis label "Financial Metric" (rotated) and x-axis label "Financial Metric" both dark ink, readable. Tick labels (variable names) on both axes rendered at 45 degrees, medium-gray ink, all legible with no overlap. Legend titled "Correlation" with a colorbar from -1 to 1, legend text and border readable against the elevated off-white legend box.
      Data: Full symmetric 8x8 correlation matrix (Revenue, Marketing, Employees, Satisfaction, Profit, Market Share, Innovation, Debt Ratio). Diagonal cells are 1.00 in saturated blue. Positive correlations shade toward blue (e.g. Revenue-Marketing 0.78), negative correlations shade toward red (e.g. Profit-Debt Ratio -0.45), near-zero cells (Innovation vs. others) sit close to the neutral off-white midpoint. Every cell is annotated with its value to 2 decimals; text color adapts (white on strongly saturated cells, dark ink on near-neutral cells) for contrast. First data color family used is the diverging Imprint pair (#AE3030 / #4467A3), correctly reserved for correlation polarity rather than the categorical palette.
      Legibility verdict: PASS -- all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title, both axis titles, and both sets of tick labels render in light ink (white/light-gray), clearly visible against the dark background. Legend box uses the dark elevated surface (#242420-ish) with light text and a light border.
      Data: Identical correlation values and identical diverging red/blue data colors as the light render -- only the chrome (background, text, legend box) flips theme. Near-zero cells sit on a very dark neutral tone with light text overlaid, so no cell is invisible against the page background. No dark-on-dark or light-on-light failures observed anywhere in the grid, title, axes, ticks, or legend.
      Legibility verdict: PASS -- all text clearly readable against the dark background; no dark-on-dark failures.

    Cross-render check: Data colors (diverging red-neutral-blue scale and cell values) are pixel-identical in polarity and hue between the two renders; only background, text, and legend-box chrome adapt to theme, as required.
