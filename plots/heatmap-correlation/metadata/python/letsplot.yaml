review:
  strengths:
  - Per-cell adaptive text color (white when |r| > 0.5, INK otherwise) computed in
    the data layer and applied via scale_color_identity — keeps every correlation
    label legible against both saturated and near-neutral tile backgrounds, in both
    themes.
  - 'Correct imprint_div diverging palette (matte-red #AE3030 negative, theme-adaptive
    midpoint, #4467A3 positive) with hard-coded limits=[-1, 1], matching the spec''s
    ''fixed colorbar range'' requirement precisely.'
  - 'Clean minimal-chrome heatmap: axis lines, ticks, and panel grid all removed;
    thin background-colored tile borders (geom_tile color=PAGE_BG) create cell separation
    without extra visual weight.'
  - Realistic, plausible business-metric dataset (revenue, marketing spend, employees,
    profit, etc.) generated via correlated linear combinations, producing a believable
    spread of positive, negative, and near-zero correlations, including an intentionally
    independent variable (Innovation).
  - Square 2400x2400 canvas is the right format choice for a symmetric matrix, and
    both renders land exactly on the canonical size.
  weaknesses:
  - Full symmetric 8x8 matrix is shown without masking either triangle — the spec
    explicitly suggests considering this to reduce redundancy, and every off-diagonal
    correlation is duplicated, diluting the at-a-glance scan value.
  - No visual emphasis calls out the strongest relationships (e.g. Revenue-Marketing
    0.78, Profit-Debt Ratio -0.45) — the chart is comprehensive but flat, missing
    a clear storytelling focal point.
  - Beyond the geom_tile + geom_text + scale_color_identity combo, the implementation
    leans on a fairly standard ggplot/lets-plot heatmap recipe rather than exercising
    more lets-plot-distinctive features.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme page surface — not pure white.
      Chrome: Bold dark title "heatmap-correlation · python · letsplot · anyplot.ai" at top, dark "Financial Metric" axis titles on x and y, medium-gray tick labels (x-axis rotated 45°, y-axis horizontal), colorbar titled "Correlation" with ticks at 1/0.5/0/-0.5/-1 on the right. All chrome text is dark-on-light and clearly readable.
      Data: 8x8 grid of tiles colored via the diverging red-white-blue (imprint_div) scale, diagonal cells at 1.00 in saturated blue, off-diagonal cells ranging from saturated red (Profit/Debt Ratio -0.45) to saturated blue (Revenue/Marketing 0.78) to near-neutral cream near zero (Innovation row). Each cell is annotated with its correlation value to 2 decimals; annotation text switches between white (on saturated cells) and dark ink (on near-neutral cells) for contrast.
      Legibility verdict: PASS — no light-on-light text found anywhere, including on the near-white midpoint cells (which use dark ink text).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme page surface — not pure black.
      Chrome: Title, axis titles, and colorbar title render in light ink (#F0EFE8); tick labels and colorbar tick text render in the lighter secondary gray. All chrome is light-on-dark and clearly readable, with no dark-on-dark failures.
      Data: Same imprint_div gradient and same correlation values as the light render — data colors are identical between themes (confirmed: e.g. Revenue/Marketing 0.78 is the same blue in both, Profit/Debt Ratio -0.45 is the same red in both). Only the chrome (background, tick/axis/title colors) flips between themes, as required.
      Legibility verdict: PASS — annotation text remains white on saturated cells and near-white ink on near-neutral (near-black midpoint) cells; no dark-on-dark text found.
