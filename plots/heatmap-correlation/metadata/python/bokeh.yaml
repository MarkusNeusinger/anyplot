review:
  strengths:
  - Fixed -1..1 colorbar range with a hand-built 256-stop Imprint diverging ramp (matte-red
    -> theme-adaptive midpoint -> blue), matching the spec's request for a diverging
    colormap centered at zero
  - Upper triangle masked via np.triu/np.where(nan) to remove redundant mirrored cells,
    exactly as the specification's notes suggest
  - Per-cell adaptive annotation text color (white on saturated cells, INK on near-zero
    cells) keeps all 2-decimal correlation labels legible across the full color range
    in both themes
  - Data colors (the diverging ramp) are identical between plot-light.png and plot-dark.png;
    only chrome (background, ticks, axis labels, colorbar) flips per theme
  - 'Idiomatic, non-generic bokeh usage: ColumnDataSource-driven rect glyphs, LinearColorMapper
    + ColorBar, LabelSet for annotations, and a custom theme-aware HTML card HoverTool
    tooltip (a real interactive feature, not decoration)'
  - Realistic, plausible economic-indicator correlation matrix (GDP/unemployment/inflation/etc.)
    with internally consistent signs and magnitudes (e.g. GDP vs Unemployment -0.72,
    GDP vs Stock Index 0.85)
  - Canvas correctly reserves min_border_* space and disables the toolbar, so title,
    rotated tick labels, and the colorbar title all render fully inside the 2400x2400
    frame with no clipping
  weaknesses:
  - np.random.seed(42) is set but never consumed — the correlation matrix (base_corr)
    is a fully hardcoded literal array, so the seed call is dead code; either remove
    it or actually drive the data through a seeded random step
  - Text-color threshold (abs(val) > 0.55 -> white, else INK) leaves borderline mid-saturation
    cells (e.g. 0.55, 0.58) with dark INK text on a fairly saturated blue fill — lower
    the threshold to ~0.45 for a safer contrast margin
  - Data storytelling is limited to the triangle mask and diagonal — no additional
    emphasis (e.g. outlining or bolding the strongest off-diagonal correlations) to
    guide the viewer to the most important relationships
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark — matches the required light-theme surface.
      Chrome: Bold dark title "heatmap-correlation · python · bokeh · anyplot.ai" centered at top, fully visible, not clipped. Italic dark "Economic Indicators" axis labels on both x and y. Dark-gray tick labels for the 8 variable names (GDP, Unemployment, Inflation, Interest Rate, Stock Index, Consumer Conf., Housing, Exports), x-tick labels rotated ~45deg, y-tick labels horizontal. Colorbar on the right labeled "Correlation" with ticks from -1 to 1, rotated title fully inside the canvas.
      Data: Lower-triangle correlation matrix (upper triangle masked/blank), diagonal = 1.00 in solid blue. Diverging red-white/cream-blue ramp: negative correlations render red (e.g. Unemployment/GDP -0.72, Consumer Conf./Unemployment -0.82), positive correlations render blue (e.g. GDP/Stock Index 0.85). Each cell is annotated with its value to 2 decimal places; text color adapts per cell (white on strongly saturated cells, dark ink on near-zero cells) and stays legible everywhere observed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light — matches the required dark-theme surface.
      Chrome: Same title, now rendered in light/off-white text, fully visible and not clipped. Axis labels and tick labels flipped to light-gray/off-white tones, all legible against the dark background. Colorbar chrome (title, ticks) also flipped to light text, no leftover white boxes.
      Data: Identical diverging red/blue data colors and identical correlation values/positions as the light render — only the background, text, and colorbar chrome changed. Per-cell adaptive text color (light ink on near-zero cells, white on saturated cells) continues to read correctly against the darker cell fills near the theme-adaptive midpoint; no dark-on-dark failures observed on any of the 36 visible cells.
      Legibility verdict: PASS
