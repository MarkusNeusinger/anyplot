review:
  strengths:
  - 'All three weaknesses flagged in Attempt 1 are fixed cleanly: the dead `np.random.seed(42)`
    call is gone, the white/ink text-color threshold is tightened from 0.55 to 0.45
    for safer contrast on mid-saturation cells, and the two strongest off-diagonal
    correlations (GDP/Stock Index 0.85, Unemployment/Consumer Conf. -0.82) now get
    a bold outline that gives the viewer a clear focal point'
  - Fixed -1..1 colorbar range with a hand-built 256-stop Imprint diverging ramp (matte-red
    -> theme-adaptive midpoint -> blue), exactly matching the spec's diverging-colormap
    requirement
  - Upper triangle masked via np.triu/np.where(nan) to remove redundant mirrored cells,
    per the spec's notes
  - Per-cell adaptive annotation text color keeps all 2-decimal labels legible across
    the full color range in both themes, including near-zero cells that blend close
    to the theme-adaptive midpoint
  - Data colors are pixel-identical between plot-light.png and plot-dark.png; only
    chrome flips per theme, and both renders pass the theme-readability checklist
    with no dark-on-dark or light-on-light failures
  - 'Idiomatic, non-generic bokeh usage: ColumnDataSource-driven rect glyphs with
    per-glyph line_color/line_width fields, LinearColorMapper + ColorBar, LabelSet,
    and a real themed HTML hover tooltip card'
  - Realistic, internally-consistent economic-indicator correlation matrix (e.g. GDP
    vs Unemployment -0.72, GDP vs Stock Index 0.85, Unemployment vs Consumer Confidence
    -0.82)
  - min_border_* reservations and a disabled toolbar keep the title, rotated tick
    labels, and colorbar title fully inside the 2400x2400 frame with no clipping
  weaknesses:
  - The bold-outline highlight on the two strongest correlations is a good storytelling
    cue but is unlabeled — a small legend note (e.g. 'strongest relationships outlined')
    would make the intent explicit rather than left for the viewer to infer
  - Both axis titles read identically ('Economic Indicators') which is correct for
    a symmetric matrix but adds no extra information beyond the tick labels themselves
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "heatmap-correlation · python · bokeh · anyplot.ai" centered at top, fully visible with no clipping. Italic dark "Economic Indicators" axis labels on both axes; dark-gray tick labels for the 8 variable names (GDP, Unemployment, Inflation, Interest Rate, Stock Index, Consumer Conf., Housing, Exports), x-ticks rotated ~45°. Colorbar on the right labeled "Correlation", ticked from -1 to 1, chrome text legible.
      Data: Lower-triangle correlation matrix (upper triangle masked/blank) with a diverging matte-red-to-blue ramp centered at the near-white midpoint. Diagonal = 1.00 in solid blue. Every cell is annotated to 2 decimal places with per-cell adaptive text color (white on saturated cells >0.45 magnitude, dark ink on near-zero cells). The two strongest off-diagonal correlations — GDP/Stock Index (0.85) and Unemployment/Consumer Conf. (-0.82) — are outlined with a bold dark border, clearly distinguishing them from the other cells' thin near-background borders.
      Legibility verdict: PASS — all title, axis, tick, colorbar, and cell-annotation text is clearly readable against the light background; no light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, tick labels, and colorbar chrome all flip to light/off-white text and remain fully readable — no leftover white boxes or stray light-theme chrome anywhere.
      Data: The diverging red/blue cell colors and correlation values are pixel-identical to the light render; only chrome flipped, as required. Per-cell adaptive text color continues to work correctly near the theme-adaptive midpoint (now near-black) — no dark-on-dark failures observed on any of the 36 visible cells. The same two strongest-correlation cells are outlined, now with a light-colored bold border that stands out against the dark surface.
      Legibility verdict: PASS — all title, axis, tick, colorbar, and cell-annotation text is clearly readable against the dark background; no dark-on-dark failures observed.
