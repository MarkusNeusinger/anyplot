review:
  strengths:
  - 'Diverging colormap correctly centered at zero with a theme-adaptive midpoint
    (built via LinearSegmentedColormap from #AE3030 through PAGE_BG to #4467A3), exactly
    matching the matplotlib library guide''s imprint_div pattern'
  - Solid teal-green / dashed maroon emphasis borders on |correlation| > 0.75 cells
    add real visual hierarchy and a focal point, reusing Imprint palette positions
    1 and 5 instead of introducing off-palette colors
  - Per-cell text color picked from actual cell luminance (WCAG-style weighted formula),
    keeping annotations legible against both saturated correlation colors and the
    near-neutral midpoint in both themes
  - Upper-triangle masking removes redundant mirrored cells as the spec suggests,
    and blends seamlessly into the page background in both themes
  - Colorbar is fixed to the full -1..1 range as required, cleanly styled (no outline,
    muted tick color) and correctly labeled 'Correlation Coefficient'
  - Canvas, title format, and theme-adaptive chrome (background, ink, spines, ticks)
    all comply with the style guide in both renders
  weaknesses:
  - The solid teal-green / dashed maroon emphasis boxes on strong correlations have
    no legend or caption explaining their meaning — a viewer who hasn't read the code
    has no way to know why some cells are outlined; add a small legend entry or figure-level
    caption
  - np.random.seed(42) is set but never consumed — the correlation matrix is built
    entirely from a hardcoded dict, so the seed call is vestigial (harmless, but remove
    or replace with a comment if intentional)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 — not pure white, not dark. Correct.
      Chrome: Title "heatmap-correlation · python · matplotlib · anyplot.ai" centered at top in dark ink (~65% of canvas width), clearly readable. "Weather Variables" axis labels on both the x (bottom) and y (left) sides in dark ink. 45°-rotated x tick labels and horizontal y tick labels in muted gray, all legible. Colorbar on the right labeled "Correlation Coefficient" with fixed -1.00..1.00 ticks in muted gray.
      Data: Lower-triangular 8x8 matrix (Temperature, Humidity, Wind Speed, Precipitation, Air Pressure, Solar Radiation, UV Index, Cloud Cover) using a red(-1)-to-blue(+1) diverging scale through a near-white midpoint. Every filled cell is annotated with its 2-decimal value in either white or dark text (adaptive per-cell luminance) — all annotations are legible. Cells with |r| > 0.75 carry a solid teal-green border (positive) or dashed maroon border (negative). The masked upper triangle is background-colored and blends in seamlessly.
      Legibility verdict: PASS — no light-on-light issues; every title, label, tick, colorbar, and annotation is clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 — not pure black, not light. Correct.
      Chrome: Same title, now in light ink, clearly readable against the dark background. Axis labels and tick labels rendered in light/muted gray, all legible. Colorbar label and ticks flip to light-on-dark and remain readable.
      Data: Identical diverging scale endpoints to the light render (#AE3030 to #4467A3) — confirmed unchanged; only the midpoint neutral and all chrome (background, text, grid) flipped for the dark theme. Cell annotation colors adapt correctly (mostly white text, consistent with the darker perceived luminance of the shifted midpoint). Emphasis borders (teal-green solid / maroon dashed) remain visible and consistent with the light render. The masked upper triangle again blends into the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome and annotation text is clearly visible against the near-black surface.
