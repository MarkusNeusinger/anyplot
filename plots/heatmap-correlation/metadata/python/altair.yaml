review:
  strengths:
  - 'Theme-adaptive imprint_div diverging colormap: the midpoint uses PAGE_BG (FAF8F1
    light / 1A1A17 dark) per the style guide, and pixel-sampling confirms the r=1.00
    diagonal renders byte-identical #4467A3 in both light and dark PNGs -- only chrome
    and the midpoint flip.'
  - 'Genuine data storytelling: cells with |r| > 0.6 get a thicker ink-colored stroke
    plus contrast-flipped text color, drawing the eye to the strongest relationships
    (Profit-Market Cap 0.66, Profit-Assets -0.67, Revenue-Expenses -0.64) instead
    of a flat data dump.'
  - 'Distinctive, idiomatic Altair usage: alt.condition() drives per-cell conditional
    stroke/strokeWidth/text-color from a Vega-Lite data predicate (alt.datum.Correlation
    > 0.6), a declarative pattern that is not easily replicated in matplotlib/seaborn.'
  - Clean KISS structure with np.random.seed(42), no functions/classes, sensible mark_rect
    + mark_text layering, and a guarded PNG canvas check (raises on overshoot, pads
    to exactly 2400x2400 -- never crops).
  - Upper-triangle masking (spec-recommended to reduce redundancy) is implemented
    correctly while keeping consistent variable ordering on both axes.
  weaknesses:
  - Correlation values come from a purely random symmetric matrix rather than a domain-informed
    structure, producing some implausible pairings for real financial metrics -- e.g.
    Revenue vs Expenses = -0.64 (real companies almost always show these positively
    correlated across firm size), and Employees is barely correlated with anything
    including Revenue (0.04) despite headcount normally scaling with revenue.
  - Legend text (titleFontSize=11, labelFontSize=10) is on the small side relative
    to the 2400x2400 canvas -- readable but not generous; bumping 1-2pt would improve
    mobile legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), confirmed by pixel sample at (60,60) = (250,248,241) -- matches target, not pure white.
      Chrome: Bold dark title "heatmap-correlation · python · altair · anyplot.ai" centered at top, clearly readable dark-ink text; "Financial Metrics" bold axis titles on both X (rotated -40 deg tick labels) and Y; tick labels in soft ink gray; thin dark stroke separates cells; "Correlation" legend with gradient bar top-right, dark title/labels on an elevated cream swatch. All text is clearly legible against the light background -- no light-on-light issues.
      Data: Lower-triangular correlation matrix, 8 financial variables (Revenue, Profit, Expenses, Employees, Market Cap, Debt, Assets, R&D Spend). Diagonal cells are solid blue (#4467A3, r=1.00). Positive correlations trend cream -> teal -> blue with magnitude; negative correlations trend cream -> tan/orange -> red-brown with magnitude (coolwarm-style diverging behavior, consistent with the spec's explicit "blue-white-red or coolwarm" allowance). Cells with |r| > 0.6 (Profit-MarketCap 0.66, Profit-Assets -0.67, Revenue-Expenses -0.64) get a thicker dark outline and white text for emphasis; other cells use dark ink text. Every cell is annotated with its correlation value to 2 decimals.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches target, not pure black.
      Chrome: Title, axis titles, and tick labels all render in light ink (#F0EFE8 / #B8B7B0), clearly readable against the dark background -- no dark-on-dark failures detected on title, axis labels, ticks, or legend.
      Data: Diagonal blue confirmed pixel-identical to the light render (#4467A3 at r=1.00) -- data colors hold across themes. Midtone colors on both diverging arms render darker overall (theme-adaptive midpoint anchor is #1A1A17 instead of #FAF8F1, per the style guide's explicit direction that the imprint_div midpoint is theme-adaptive), so the gradient look shifts between renders while the two endpoint hues stay fixed -- this is the correct, spec-mandated behavior, not a defect. Strong-correlation cells keep their thicker outline and contrast-aware text coloring.
      Legibility verdict: PASS
