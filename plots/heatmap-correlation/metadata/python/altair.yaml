review:
  strengths:
  - Revenue vs Expenses now correlates at +0.61 and Revenue vs Employees at +0.58
    -- the latent-factor model (scale/profitability/leverage factors) directly fixes
    the attempt-1 DQ-03 finding (previously -0.64 and 0.04, both implausible for real
    firms) and every pairing in the matrix now reads as economically sensible.
  - Legend title/label font sizes bumped to 13/12 (from 11/10 in attempt 1), directly
    addressing the prior 'legend text on the small side' weakness -- clearly legible
    at the 2400x2400 canvas.
  - 'Theme-adaptive imprint_div diverging colormap: range=[''#AE3030'', PAGE_BG, ''#4467A3'']
    with domainMid=0, matching the style guide''s exact recipe; the r=1.00 diagonal
    cells render identical #4467A3 in both light and dark renders -- only the midpoint
    and chrome flip.'
  - 'Genuine data storytelling: cells with |r| > 0.6 (Revenue-Expenses 0.61, Profit-Market
    Cap 0.66) get a thicker ink-colored stroke plus contrast-flipped text, creating
    a clear focal point beyond a flat data dump.'
  - 'Distinctive, idiomatic Altair usage: alt.condition() drives per-cell conditional
    stroke/strokeWidth/text-color from a single Vega-Lite predicate (alt.datum.Correlation
    > 0.6), a declarative pattern not easily replicated in matplotlib/seaborn.'
  - 'Clean KISS structure: np.random.seed(42), no functions/classes, guarded PNG canvas
    check that raises loudly on overshoot and pads (never crops) to exactly 2400x2400.'
  weaknesses:
  - X-axis tick labels (fontSize=11) are noticeably smaller than the bold 13pt axis
    titles -- readable but could be bumped 1-2pt for better balance on the 2400x2400
    canvas.
  - 'Design excellence is solid but not maximal: only the |r|>0.6 threshold drives
    visual hierarchy -- a secondary emphasis tier (e.g. subtly muting near-zero cells)
    could sharpen the storytelling further.'
  - 'LM-02: alt.condition() is a nice distinctive touch but the chart otherwise uses
    fairly standard mark_rect + mark_text layering; a more Altair-unique feature (e.g.
    interactive selection binding for the HTML view) would push this further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white -- matches target.
      Chrome: Bold dark title "heatmap-correlation · python · altair · anyplot.ai" centered at top, clearly readable. Bold "Financial Metrics" axis titles on both X (rotated -40 deg tick labels) and Y axes; tick labels in soft ink gray. Thin light stroke separates cells. "Correlation" legend with vertical gradient bar top-right on an elevated cream swatch, dark bold title and labels. All text is clearly legible against the light background -- no light-on-light issues.
      Data: Lower-triangular 8x8 correlation matrix (Revenue, Profit, Expenses, Employees, Market Cap, Debt, Assets, R&D Spend). Diagonal cells are solid blue (#4467A3, r=1.00). Positive correlations trend cream -> teal -> blue with magnitude; the two negative cells (Profit-Debt -0.23, Market Cap-Debt -0.20) render as light tan/orange. Cells with |r| > 0.6 (Revenue-Expenses 0.61, Profit-Market Cap 0.66) get a thicker dark outline and white text for emphasis; other cells use dark ink text. Every cell is annotated with its correlation value to 2 decimals.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black -- matches target.
      Chrome: Title, axis titles, and tick labels all render in light ink (#F0EFE8 / #B8B7B0), clearly readable against the dark background -- no dark-on-dark failures on title, axis labels, ticks, or legend.
      Data: Diagonal blue is pixel-identical to the light render (#4467A3 at r=1.00) -- data colors hold across themes as required. The diverging midpoint anchors to the dark background instead of the light one (per the style guide's theme-adaptive imprint_div midpoint), so the overall gradient reads darker, but the two endpoint hues (#AE3030 red, #4467A3 blue) are unchanged. Strong-correlation cells keep their thicker outline and contrast-aware text coloring.
      Legibility verdict: PASS
