review:
  strengths:
  - Per-cell annotation text color is derived by re-interpolating the actual Imprint
    diverging colorscale (not a fixed threshold), so '0.XX' labels stay legible whether
    the cell renders near the theme midpoint or fully saturated red/blue
  - Masks the strict upper triangle to show each variable pair once, exactly as the
    spec's 'consider masking' note suggests, while keeping variable names on both
    axes
  - Rich hovertemplate/customdata gives strength ('Strong'/'Moderate'/'Weak') and
    direction interpretation per cell, a genuine use of Plotly interactivity rather
    than a static-only heatmap
  - Realistic, domain-plausible health-metrics correlation structure (Heart Rate/Blood
    Pressure, Sleep/Stress, Exercise inversely tied to Heart Rate and Stress) with
    a fixed seed for reproducibility
  - 'Correct theme-adaptive chrome throughout: backgrounds, ink tokens, and the diverging
    colorscale''s theme-adaptive midpoint all match the style guide in both renders'
  weaknesses:
  - 'Strong-pair highlight border is invisible in the light render for the Blood Pressure/Heart
    Rate cell (r=0.83, the single strongest correlation in the whole matrix): cell_text_color()
    picks the border color by contrasting only against the interpolated cell fill,
    and for this cell that resolves to cream (#FAF8F1) — which is also the page background
    and xgap/ygap color, so the 10px-wide highlight rect disappears into the surrounding
    gap. The same logic works fine in dark mode (cream contrasts against the dark
    page/gaps) and for the other highlighted pair (r=0.70, which resolves to dark
    ink). Fix: pick the highlight-rect stroke color for contrast against the PAGE_BG/gap
    color (e.g. always INK in light theme, always the light ink token in dark theme)
    instead of re-deriving it from the cell fill — the annotation text can keep using
    cell_text_color() since that one only needs to contrast against the fill, not
    the gap.'
  - Two module-level helper functions (hex_to_rgb, cell_text_color) deviate from the
    strict Imports → Data → Plot → Save KISS structure; they are small and justified
    by the repeated per-cell color math, but a fully flat script would inline or vectorize
    this instead of defining functions.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "heatmap-correlation · python · plotly · anyplot.ai" in dark ink, centered and fully visible. "Health Metrics" axis titles on both x and y in dark ink. Tick labels (variable names: Heart Rate, Blood Pressure, Cholesterol, BMI, Sleep Hours, Exercise (hrs), Stress Level, Resting O2) in soft dark gray, 45°-rotated on the x-axis, horizontal on the y-axis — all legible. Colorbar titled "Pearson r" with legible tick labels.
      Data: Diverging red (negative) → cream midpoint → blue (positive) Imprint scale fills a lower-triangular 8x8 grid (upper triangle masked/blank per spec's "consider masking" note); every visible cell is annotated with its Pearson r to 2 decimals in adaptively chosen ink-or-cream text for contrast against that cell's own fill. One strong pair (Sleep Hours × Resting O2, r=0.70) shows a clearly visible dark outline emphasizing it. The strongest pair in the matrix (Blood Pressure × Heart Rate, r=0.83) is also outlined in code, but that outline renders in the same cream tone as the page background and the inter-cell gaps, so it is not visible in this render — see Weaknesses.
      Legibility verdict: PASS — all title/axis/tick/colorbar text is clearly readable against the light background; the only issue is the invisible highlight border on the r=0.83 cell, which is a shape/emphasis defect, not a text-legibility one.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all flip to light ink (#F0EFE8) / soft light gray (#B8B7B0), fully legible against the dark background — no dark-on-dark anywhere. Colorbar text is likewise legible.
      Data: Same Imprint diverging red/blue endpoints as the light render (only the theme-adaptive midpoint token changes, as intended). Cell annotation text again adapts to per-cell luminance and stays legible on every cell. In this render BOTH strong-pair highlights (r=0.83 and r=0.70) are clearly visible as bright cream outlines that contrast well against the dark-blue cells and the dark background/gaps.
      Legibility verdict: PASS — all text reads clearly, no dark-on-dark failures. Data colors are identical to the light render (only chrome and border-contrast choices flip), confirming palette parity apart from the light-mode highlight-visibility defect noted above.
