review:
  strengths:
  - Correct diverging Imprint colorscale (imprint_div) centered exactly at zero, with
    the strict upper triangle masked so each unique variable pair is shown once, satisfying
    the spec's symmetric-matrix and redundancy-reduction notes
  - 'Theme-adaptive cell-text contrast is computed correctly: cell_text_color() re-derives
    the actual interpolated RGB for each cell (accounting for the theme-adaptive midpoint
    stop) and picks ink vs. off-white text by luminance, so annotations stay legible
    on both the lightest and most saturated cells in both themes'
  - 'Genuine data storytelling: outlined rectangles highlight |r| >= 0.7 pairs (Heart
    Rate/Blood Pressure = 0.83, Sleep Hours/Resting O2 = 0.70) with a theme-adaptive
    INK stroke, giving the viewer an immediate focal point instead of a flat data
    dump'
  - Realistic, domain-plausible healthcare correlation data with meaningful directional
    relationships (Blood Pressure ~ Heart Rate, Sleep Hours ~ -Stress, Exercise inversely
    related to Heart Rate/Stress) and a fixed -1..1 colorbar range as required
  - All font sizes explicitly set (title 18, axis titles 13, tick labels 10, colorbar
    9-11, cell annotations 11) and both PNG/HTML outputs saved with theme-suffixed
    filenames per the plotly output contract
  weaknesses:
  - Near-zero correlation cells (e.g. r=0.02, -0.03, -0.01) interpolate almost exactly
    to PAGE_BG, so they render as nearly blank squares distinguishable from the page
    background only by the thin 2px gap/border — an inherent property of a zero-centered
    diverging scale on weakly-correlated pairs rather than a bug, but worth a light
    touch (e.g. a hairline cell border) if a future pass wants to make the full matrix
    boundary more legible at a glance.
  - The two small helper functions (hex_to_rgb, cell_text_color) mildly depart from
    a strict single-script KISS structure — justified here by the theme-adaptive contrast
    requirement, but worth remembering as a minor CQ-01 deduction.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-correlation · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Health Metrics" below rotated tick labels (45deg: Heart Rate, Blood Pressure, Cholesterol, BMI, Sleep Hours, Exercise (hrs), Stress Level, Resting O2); Y-axis title "Health Metrics" rotated on the left with the same variable names as row labels. Colorbar on the right titled "Pearson r" with ticks at -1, -0.5, 0, 0.5, 1.
      Data: Lower-triangular 8x8 correlation matrix (strict upper triangle masked/empty). Diagonal cells are all dark blue (r=1.00). Off-diagonal cells range from moderate blue (positive, e.g. 0.83, 0.70, 0.55) through near-white/background (weak, e.g. 0.02, -0.04) to muted red (negative, e.g. -0.54, -0.47, -0.40). Each cell is annotated with its 2-decimal correlation value in a text color that auto-contrasts against that cell's fill. Two cells (Blood Pressure/Heart Rate = 0.83 and Resting O2/Sleep Hours = 0.70) carry a black outlined rectangle to highlight the strongest pairs.
      Legibility verdict: PASS — all title, axis, tick, and cell-annotation text is clearly readable against the light background; no light-on-light text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels as the light render, now rendered in light ink/gray, clearly legible against the dark background. Colorbar labeling and ticks are also light-colored and readable.
      Data: Identical cell colors and correlation values to the light render (blue-white-red diverging scale unchanged) — confirming the palette itself does not flip with theme. The two highlighted-pair rectangles now use a light/white stroke instead of black, correctly following the theme-adaptive INK token so the border remains visible against the dark chrome.
      Legibility verdict: PASS — no dark-on-dark failures found; tick labels, axis titles, colorbar text, and cell annotations are all legible against the near-black background.
