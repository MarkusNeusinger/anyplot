review:
  strengths:
  - Custom canvas plugin correctly renders a full correlation heatmap despite Chart.js
    having no native matrix/heatmap type -- an elegant, idiomatic workaround (hidden
    scatter chart as category-axis scaffold + afterDraw plugin for cell painting)
  - Correct Imprint imprint_div diverging palette with proper polarity (positive correlations
    render blue, negative render red) and a genuinely fixed -1..1 colorbar range,
    exactly matching the spec's 'fixed colorbar range' requirement
  - Per-cell luminance-based text color computation guarantees every correlation value
    label stays legible regardless of fill saturation, in both light and dark renders
  - Clean lower-triangle + diagonal masking reduces redundancy per the spec's own
    suggestion, without the chart feeling sparse -- the colorbar and cell grid still
    fill the vast majority of the canvas
  - Realistic, neutral business/finance dataset (Revenue, Profit Margin, R&D Spend,
    Debt Ratio, Market Cap, Volatility) with a good spread of strong positive (0.81),
    weak (0.10), and negative (-0.52) correlations
  weaknesses:
  - Colorbar tick labels ('1', '0', '-1') are set to 14px, slightly smaller than the
    axis tick labels (15px) and noticeably smaller than the cell value labels (20px)
    -- bumping to ~16px would tighten the typographic hierarchy
  - The masked upper triangle leaves a large blank region in the upper-right; an optional
    emphasis on the single strongest relationship (Revenue / Market Cap, r=0.81) would
    push data storytelling further
  - The cell separator stroke (3px, page-background color) reads a touch heavy against
    the otherwise refined flat-fill cells; 1-2px would feel more polished
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "heatmap-correlation · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible. Row labels (Revenue, Profit Margin, R&D Spend, Debt Ratio, Market Cap, Volatility) on the left and matching column labels along the bottom, rendered in a soft dark-gray ink -- all fully readable. Colorbar on the right labeled "1" / "0" / "-1" with a vertical "Correlation" title, legible in muted gray/dark ink.
      Data: Lower-triangle (incl. diagonal) of a 6x6 correlation matrix. Diagonal cells = 1.00 in saturated blue. Off-diagonal cells span from saturated red (most negative, -0.52) through near-white/neutral (near zero, e.g. 0.10) to saturated blue (most positive, 0.81), matching the Imprint imprint_div diverging scale. Each cell's numeric value is overlaid in bold text, colored black or off-white per-cell depending on the fill's luminance -- every value is clearly legible against its own cell background. Upper triangle intentionally left blank (masked) to reduce redundancy.
      Legibility verdict: PASS -- no text is light-on-light; all chrome and cell-value text is readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title and axis labels rendered in light ink (off-white/light-gray), fully visible against the dark surface. Colorbar numeric labels and "Correlation" title also render in light gray, legible against black.
      Data: Same lower-triangle correlation matrix with identical cell fill colors to the light render (diagonal blue 1.00, strongest positive 0.81 blue, strongest negative -0.52 red, near-zero 0.10 near-neutral) -- confirmed the data colors are unchanged between themes, only chrome flipped. Per-cell text color again adapts correctly to each cell's fill luminance, so no cell shows dark-on-dark or light-on-light text.
      Legibility verdict: PASS -- no dark-on-dark failures; all chrome and cell-value text reads clearly against the near-black background.
