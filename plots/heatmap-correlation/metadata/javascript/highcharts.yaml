review:
  strengths:
  - Clever, well-executed manual grid renderer that fully substitutes for the unavailable
    core-bundle heatmap module — clean cell borders, correct diverging color computation
    for both positive and negative correlations
  - WCAG-conscious per-cell text color chosen via a relative-luminance formula, keeping
    text readable against every colored cell in both themes
  - Freed upper-triangle void (rows 0-1 x cols 3-5) used effectively to host the diverging
    colorbar instead of being wasted blank space
  - Theme-adaptive chrome throughout — diagonal cell fill, ink/inkSoft tokens, and
    the theme-adaptive imprint_div midpoint all swap correctly; both renders pass
    the legibility check
  - Title correctly formatted and font-size scaled to length; masking the upper triangle
    follows the spec's explicit suggestion to reduce redundancy
  - Fixed -1..1 colorbar range with clear axis ticks, matching the spec's requirement
    for consistent interpretation
  weaknesses:
  - 'Bypasses Highcharts'' native series/tooltip system entirely (empty `series: []`,
    `tooltip: { enabled: false }`) and hand-draws every cell via `chart.renderer`
    — a legitimate core-bundle-only workaround for the missing heatmap module, but
    it forfeits the interactive value normally expected from an ''interactive library''
    pick; consider re-evaluating whether a data-driven approach (e.g. scatter/columnrange
    abuse with tooltip) could recover some interactivity in the HTML view.'
  - Generous top chart margin (145px CSS) leaves a large blank gap between the subtitle
    and the top of the grid on both renders — tighten vertical spacing so the grid
    carries more visual weight relative to the empty header area.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light surface.
      Chrome: Title "Air-Quality Sensor Correlations · heatmap-correlation · javascript · highcharts · anyplot.ai" in bold dark ink, fully readable; subtitle in softer gray beneath it, readable. Row labels (Temperature, Humidity, CO2 Level, PM2.5, Noise Level, Wind Speed) right-aligned to the left of the grid in dark ink; column labels rotated -40 degrees below the grid, also dark ink and readable. Colorbar title "Correlation (r)" and tick labels -1/0/1 in dark ink, readable.
      Data: Lower-triangle + diagonal 6x6 grid. Diagonal cells (1.00) filled with a near-white elevated background and soft dark text. Off-diagonal cells use the diverging red-white-blue scale: strong red for the most negative values (e.g. -0.60, -0.50), strong blue for the most positive (e.g. 0.55), near-white/cream for values close to zero (0.05, -0.05). Each cell's numeric value is set in either near-black or near-white text depending on the fill's computed luminance, and every value is legible against its own cell.
      Legibility verdict: PASS — no light-on-light text found; all title, subtitle, axis labels, cell values, and colorbar text are clearly visible against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark surface.
      Chrome: Title and subtitle render in light ink, fully readable against the dark background. Row/column labels also switch to light ink and stay legible, including the rotated column labels. Colorbar title and -1/0/1 ticks are light-colored and readable.
      Data: Same 6x6 lower-triangle grid with identical correlation values. Diagonal cells now use a dark elevated background (slightly lighter than the page) with soft light text. Off-diagonal cell colors are visibly the same hue family as the light render (same reds and blues), confirming the diverging scale endpoints are held constant; only the zero-midpoint of the diverging scale itself shifts from cream to near-black per the diverging-colormap theme-adaptive rule, and the surrounding chrome flips as expected. Cell text again switches between near-black and near-white per cell based on computed luminance, and remains legible on every cell — no dark-on-dark failures observed.
      Legibility verdict: PASS — all chrome and data-cell text is clearly readable against the dark background; no black-on-black or unreadable elements found.
