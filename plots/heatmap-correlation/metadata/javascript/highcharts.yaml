review:
  strengths:
  - 'Fixed the attempt-1 weakness: the invisible scatter overlay now carries `enableMouseTracking`,
    `stickyTracking: false`, and a real tooltip formatter, recovering genuine native
    Highcharts hover interactivity in the HTML view on top of the hand-drawn grid
    — no longer an empty series/disabled tooltip.'
  - 'Fixed the attempt-1 margin weakness: top chart margin tightened (145px to 100px),
    removing the large blank gap between the subtitle and the grid on both renders.'
  - Clever, well-executed manual grid renderer that fully substitutes for the unavailable
    core-bundle heatmap module — clean cell borders, correct diverging color computation
    for both positive and negative correlations.
  - WCAG-conscious per-cell text color chosen via a relative-luminance formula, keeping
    every cell's numeric value legible against its own fill in both themes.
  - Freed upper-triangle void (rows 0-1 x cols 3-5) used effectively to host the diverging
    colorbar instead of being wasted blank space.
  - Theme-adaptive chrome throughout — diagonal cell fill, ink/inkSoft tokens, and
    the theme-adaptive imprint_div midpoint all swap correctly; both renders pass
    the legibility check with no dark-on-dark or light-on-light failures.
  - Emphasis stroke on the strongest positive and negative off-diagonal correlations
    gives the matrix a clear focal point beyond a raw grid of numbers.
  - Masking the upper triangle plus a fixed -1..1 colorbar range directly follows
    the spec's explicit notes for reducing redundancy and consistent interpretation.
  weaknesses:
  - Several helper functions (hexToRgb, lerp, corrRgb, corrFill, corrTextColor, isStrongest,
    drawAll, clearDrawn) push code structure past bare KISS — justified by the manual-renderer
    workaround for the missing core-bundle heatmap module, but still more machinery
    than a typical implementation.
  - Design layer (cell borders, diagonal styling, whitespace) is functional but still
    fairly close to the base grid concept — no additional data-storytelling device
    (e.g. sorted/clustered variable order, secondary emphasis) beyond the two strongest-correlation
    borders.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light surface.
      Chrome: Title "Air-Quality Sensor Correlations · heatmap-correlation · javascript · highcharts · anyplot.ai" in bold dark ink, fully readable and comfortably within the canvas (~55-60% width). Subtitle in softer gray beneath it, readable. Row labels (Temperature, Humidity, CO2 Level, PM2.5, Noise Level, Wind Speed) right-aligned to the left of the grid in dark ink; column labels rotated -40 degrees below the grid, also dark ink and fully visible with margin to spare above the canvas bottom edge — no clipping. Colorbar title "Correlation (r)" and tick labels -1/0/1 in dark ink, readable, placed in the freed upper-right void.
      Data: Lower-triangle + diagonal 6x6 grid. Diagonal cells (1.00) filled with a near-white elevated background and soft dark text. Off-diagonal cells use the diverging red-white-blue scale: strong red for the most negative values (-0.60, -0.50), strong blue for the most positive (0.55), near-white/cream for values close to zero (0.05, -0.05). The two strongest correlations (0.55 and -0.60) carry a heavier dark border, giving the matrix a clear focal point. Every cell's numeric value is set in near-black or near-white text depending on the fill's computed luminance, and remains legible against its own cell.
      Legibility verdict: PASS — no light-on-light text found; all title, subtitle, axis labels, cell values, and colorbar text are clearly visible against the light background. Top margin between subtitle and grid is now tight and well-proportioned (previously flagged as too generous in attempt 1).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark surface.
      Chrome: Title and subtitle render in light ink, fully readable against the dark background. Row/column labels also switch to light ink and stay legible, including the rotated column labels, with the same generous margin from the canvas bottom edge. Colorbar title and -1/0/1 ticks are light-colored and readable.
      Data: Same 6x6 lower-triangle grid with identical correlation values. Diagonal cells now use a dark elevated background (slightly lighter than the page) with soft light text. Off-diagonal cell colors are visibly the same hue family as the light render (same reds and blues at the -1/+1 endpoints), confirming the diverging scale endpoints are held constant; only the zero-midpoint of the diverging scale itself shifts from cream to near-black per the theme-adaptive imprint_div rule (sanctioned by the style guide), and the surrounding chrome flips as expected. Cell text again switches between near-black and near-white per cell based on computed luminance, and remains legible on every cell — no dark-on-dark failures observed.
      Legibility verdict: PASS — all chrome and data-cell text is clearly readable against the dark background; no black-on-black or unreadable elements found.
