review:
  strengths:
  - 'Builds the community-surface heatmap from MUI X composition primitives: ChartsContainer
    with band xAxis/yAxis, a zAxis continuous colorMap fixed to -1..1, and a custom
    layer reading useXScale/useYScale/useZColorScale/useDrawingArea, so cell colors
    come from the library''s own color scale'
  - 'Three-stop Imprint diverging ramp (t.div: #AE3030 -> theme-adaptive page midpoint
    -> #4467A3) centered on zero, with a gradient color bar spanning the full -1..1
    range and a 0.0 tick marking the midpoint in both themes'
  - Cell value text switches between dark and light ink from the computed luminance
    of each fill, so every 2-decimal label stays legible from the saturated blue diagonal
    to near-neutral cells in both renders
  - Square cells on a symmetric lower-triangle matrix with identical variable order
    on both axes; the mirrored upper triangle is masked, and the matrix is centered
    in the square canvas
  - 'Realistic portfolio scenario (six asset classes, monthly-return correlations)
    with a genuine mix: moderate-strong positive (Gold-Commodities 0.65, Real Estate-Equities
    0.55), negative (Bonds-Equities -0.35) and near-zero pairs'
  - Subtitle computed from the data names the strongest off-diagonal pair, giving
    the reader an entry point without adding a layer over the marks
  weaknesses:
  - 'Suggestion: the color-bar tick labels (14 px) could match the 16 px axis tick
    labels so the scale reads as clearly as the axes in the 400 px thumbnail.'
  - 'Suggestion: the luminance-switched cell text uses the literals #1A1A17 / #FAF8F1;
    reading them from t.ink-equivalents of the opposite theme would keep the code
    on tokens.'
  - 'Suggestion: the empty band between the subtitle and the matrix top could shrink
    slightly so the matrix sits closer to its title.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled (250, 248, 241) = #FAF8F1.
      Chrome: bold dark title "heatmap-correlation · javascript · muix · anyplot.ai" centered at top (~45% of width), grey subtitle "6 × 6 matrix, lower triangle shown (the upper one mirrors it) · strongest pair: Gold – Commodities, r = 0.65". Y tick labels Equities…Cash at left, the same names in the same order along the bottom, all horizontal and untruncated. Vertical gradient color bar on the right with ticks 1.0 / 0.5 / 0.0 / -0.5 / -1.0 and rotated title "Correlation (Pearson r)". All text dark and readable.
      Data: lower-triangle 6×6 matrix of square cells with thin grid-colored outlines; diagonal 1.00 cells in Imprint blue #4467A3 with light text; positive cells in lighter blues (0.65, 0.55, 0.30…), negative cells in pale reds (-0.35, -0.20, -0.15…), near-zero cells close to the cream midpoint. Values shown to 2 decimals in bold dark text on light cells. Imprint diverging ramp red #AE3030 → #FAF8F1 → blue #4467A3.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, sampled (26, 26, 23) = #1A1A17.
      Chrome: title in light ink, subtitle and tick labels in light grey, color-bar ticks and title in light ink — no dark-on-dark text anywhere.
      Data: same layout and same diverging end stops (blue diagonal, red at -1); the midpoint flips to #1A1A17 as the theme-adaptive imprint_div prescribes, so near-zero cells are dark and separated from the page by their grid outlines. All cell values switch to light text on these dark fills and stay readable; diagonal blue identical to light.
      Legibility verdict: PASS
