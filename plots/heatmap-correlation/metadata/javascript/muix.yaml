review:
  strengths:
  - Correct, theme-adaptive Imprint diverging colormap (imprint_div) built from tokens.div,
    with a per-cell luminance check that switches text color for contrast against
    every cell fill in both themes
  - Faithful implementation of the spec's lower-triangle masking suggestion, keeping
    the matrix legible without redundant mirrored values
  - Creative, correct use of MUI X community APIs (custom slots.scatter cell renderer,
    zAxis continuous colorMap, ContinuousColorLegend) to build a heatmap the community
    package has no native component for
  - Clean theme-adaptive chrome (ticks/lines disabled, ink/inkSoft tokens threaded
    through title, axis labels, legend) verified legible in both light and dark renders
    with no clipping at any edge
  - Deterministic, realistic portfolio-diversification dataset with plausible correlation
    values spanning the full -1..1 range and a fixed -1/1 colorbar domain
  weaknesses:
  - The masked upper triangle combined with the flex-start layout leaves a large blank
    quadrant in the top-right/right side of the square canvas in both renders — center
    the triangular matrix or grow the cell size to use the available canvas more fully
  - No explicit 'Correlation' label near the colorbar legend — only bare -1/1 endpoint
    values; a short legend title would remove any residual ambiguity about what the
    color encodes
  - Data storytelling is functional but flat — no additional emphasis (e.g. highlighting
    the strongest correlation pair) to guide the reader's eye beyond the raw grid
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "heatmap-correlation · javascript · muix · anyplot.ai" centered top in dark ink, fully legible. Column headers (top) and row headers (left) — Equities, Bonds, Real Estate, Commodities, Gold, Cash — rendered in medium-grey (inkSoft), all legible, none clipped at the canvas edges (verified via crop). Colorbar legend at bottom-right shows a smooth red→near-white→blue gradient with "-1" and "1" endpoint labels, both fully visible with margin to the right canvas edge.
      Data: Lower-triangular grid of filled square cells, diagonal = 1.00 (deep blue). Negative correlations render as salmon/pink, positive as blue, magnitude scaling correctly with color intensity. Cell text color switches per-cell (white on dark blue, black on light pink) via a luminance check — every value stays legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, column/row headers all render in light ink/inkSoft tokens, clearly legible against the dark background — no dark-on-dark failures found (checked left-column labels and top header crop directly). Colorbar legend gradient and endpoint labels ("-1", "1") remain fully visible and legible.
      Data: Same lower-triangular grid; data colors are visually identical to the light render (deep blue diagonal, salmon negatives, blue positives) — only the chrome (background, headers, cell text on the mid-range cells) adapted to the dark theme. Cell text again switches white/black per-cell via the luminance check for contrast against every fill.
      Legibility verdict: PASS
