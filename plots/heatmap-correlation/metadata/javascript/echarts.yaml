review:
  strengths:
  - Per-cell text color is computed dynamically via a WCAG contrast check against
    the interpolated imprint_div fill, so every correlation value stays legible across
    the whole diverging range instead of relying on one fixed ink color
  - Upper-triangle masking removes the redundant mirrored half of the matrix as the
    spec notes suggest, keeping attention on the unique information
  - Colorbar is fixed to [-1, 1] with clear end labels and uses the theme-adaptive
    imprint_div midpoint correctly
  - Title fontsize scales with title length via the linear formula, avoiding overflow
    for the mandated title string
  - Realistic, neutral wellness-metrics dataset (sleep, resting HR, VO2 max, etc.)
    with a good mix of correlation strengths and signs
  weaknesses:
  - Masking the upper triangle leaves a large blank quadrant in the top-right of the
    square canvas; tightening the grid margins or repositioning chrome so the matrix
    fills more of the frame would improve canvas utilization
  - KISS structure is diluted by five helper functions (hexToRgb, lerpRgb, relLuminance,
    contrast, labelColorFor) for the label-contrast calculation; justified for accessibility
    but a departure from the flat imports->data->plot pattern
  - Diagonal self-correlation cells (1.00) are rendered identically to real correlations,
    missing a chance to mute them and strengthen visual hierarchy toward the meaningful
    off-diagonal values
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "heatmap-correlation · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Y-axis variable names (Sleep Hours, Resting HR, Daily Steps, VO2 Max, Body Fat %, Stress Score, Hydration) in soft dark gray, fully legible. X-axis labels are the same variable names rotated ~40°, also legible with no overlap. Colorbar on the right labeled "1.0" / "-1.0" in soft dark gray.
      Data: Lower-triangle matrix of cells shaded via a red-white-blue diverging scale (imprint_div): diagonal cells (1.00) are solid blue, strong negative correlations (e.g. -0.71) are deep red, weak correlations near white/pale. Each cell is annotated with its correlation value to 2 decimals; text color flips between near-black and near-white per cell so it always contrasts against that cell's fill.
      Legibility verdict: PASS — all title, axis, tick, and cell-label text is clearly readable against the light background; no light-on-light instances found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light ink, clearly readable. Axis variable names rendered in light gray, fully legible on the dark surface. Colorbar labels "1.0"/"-1.0" also in light gray, readable.
      Data: The diverging cell colors are visually identical to the light render (same red/white/blue endpoints and identical value-to-color mapping) — only the chrome (background, axis text, colorbar text) flipped to the dark theme. Cell value labels again alternate between dark and light text per cell to preserve contrast; no dark-on-dark instances found (e.g. the near-white diagonal-adjacent cells use dark text, deep red/blue cells use light text).
      Legibility verdict: PASS — all chrome and data-label text reads clearly on the dark background.
