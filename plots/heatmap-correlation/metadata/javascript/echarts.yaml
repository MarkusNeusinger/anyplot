review:
  strengths:
  - Diagonal self-correlation cells are now muted (opacity 0.4) and unlabeled, sharpening
    visual hierarchy toward the meaningful off-diagonal correlations exactly as the
    prior review requested
  - Grid margins were tightened (right margin 190→ 60) and the visualMap colorbar
    repositioned/enlarged (itemHeight 480→ 650) into the blank upper-right triangle
    the mask leaves behind, meaningfully improving canvas utilization
  - Label-contrast helper code was flattened from five small functions to two, closer
    to a KISS imports→data→plot structure while still preserving the genuinely useful
    WCAG-contrast-based per-cell text coloring
  - Per-cell text color is computed dynamically via a WCAG contrast check against
    the interpolated imprint_div fill, so every correlation value stays legible across
    the whole diverging range
  - Upper-triangle masking removes the redundant mirrored half of the matrix as the
    spec suggests, and the fixed [-1, 1] colorbar with theme-adaptive midpoint is
    correctly implemented
  - Realistic, neutral wellness-metrics dataset (sleep, resting HR, VO2 max, body
    fat, stress, hydration) with a good, physiologically sensible mix of correlation
    strengths and signs
  weaknesses:
  - Even after tightening margins, the masked upper-triangle wedge still leaves a
    sizeable blank area beyond the colorbar strip in the top-right of the square canvas
    — could shrink further or grow cell size to use that space
  - 'Library Mastery is only generic-to-moderate: the continuous visualMap piecewise
    coloring is standard ECharts heatmap usage rather than a feature unique to the
    library'
  - Diagonal muting helps focus but the plot still doesn't call out or emphasize the
    single strongest correlation (VO2 Max vs Resting HR, -0.71) — a subtle highlight
    (border, bolder text) would push data storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-correlation · javascript · echarts · anyplot.ai" centered at top in dark ink at explicit fontsize, clearly readable. Y-axis variable names (Sleep Hours, Resting HR, Daily Steps, VO2 Max, Body Fat %, Stress Score, Hydration) render in soft dark gray, fully legible with no overlap. X-axis labels are the same variable names rotated ~40°, legible with no collisions. Colorbar sits inside the masked upper-right wedge, labeled "1.0" / "-1.0" in soft dark gray.
      Data: Lower-triangle matrix shaded via the red-white-blue imprint_div diverging scale. Diagonal (self-correlation, 1.00) cells are now visibly muted/faded (opacity 0.4) and carry no text label, clearly de-emphasized relative to the off-diagonal cells. Strong negative correlations (e.g. -0.71 VO2 Max vs Resting HR) render deep red; weak correlations render near-white. Each off-diagonal cell is annotated with its correlation value to 2 decimals; text color flips between near-black and near-white per cell to preserve contrast against that cell's fill.
      Legibility verdict: PASS — all title, axis, tick, colorbar, and cell-label text is clearly readable against the light background; no light-on-light instances found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now rendered in light ink, clearly readable. Axis variable names render in light gray, fully legible on the dark surface. Colorbar labels "1.0"/"-1.0" also render in light gray, readable.
      Data: The diverging cell colors are visually identical to the light render (same red/white/blue endpoints and identical value-to-color mapping) — only chrome (background, axis text, colorbar text) flipped to the dark theme. Diagonal cells remain muted/unlabeled, matching the light render's hierarchy. Cell value labels again alternate between dark and light text per cell to preserve contrast; no dark-on-dark instances found.
      Legibility verdict: PASS — all chrome and data-label text reads clearly on the dark background; brand-adjacent diverging colors are consistent across both themes.
