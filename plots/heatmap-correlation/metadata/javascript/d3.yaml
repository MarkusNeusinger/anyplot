review:
  strengths:
  - Correct imprint_div diverging colormap with fixed -1..1 domain, centered exactly
    at zero as required
  - Lower-triangle masking removes redundant symmetric cells while variable names
    remain on both axes
  - Per-cell text color is computed from the interpolated fill's relative luminance,
    so annotations stay legible against every color step in both themes
  - All font sizes explicitly set (22/18/16px); text remains crisp even scaled down
    to ~400px mobile preview
  - Synthetic data uses two latent factors (explosive power, aerobic fitness) to produce
    physiologically plausible correlation clusters (e.g. VO2 Max vs. Resting HR =
    -0.53) instead of random noise
  - Deterministic seeded LCG since the browser has no RNG, matching the D3 reproducibility
    requirement
  - 'Clean idiomatic D3: selection.data().join(), scaleSequential + interpolateRgbBasis,
    axisRight for the colorbar legend'
  weaknesses:
  - Colorbar keeps the default d3.axisRight look (visible domain line + tick marks)
    which reads slightly more 'generic' than the fully custom-built matrix cells —
    a borderless bar with just tick text would match the polish level of the rest
    of the chart
  - No explicit visual callout of the two correlated clusters (Sprint Speed/Vertical
    Jump/Agility/Strength vs. Body Fat %/Resting HR) — an optional subtle highlight
    or ordering by cluster could push data storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "heatmap-correlation · javascript · d3 · anyplot.ai" in dark ink, centered, fully visible. Row labels (variable names) left of the matrix in soft dark gray; column labels rotated -40deg beneath the matrix, fully contained within the canvas with no clipping. Colorbar on the right labeled "r" with ticks at -1.0/-0.5/0.0/0.5/1.0 in dark ink.
      Data: Lower-triangle 8x8 matrix. Diagonal cells (r=1.00) are saturated Imprint blue; strong negative cells (e.g. -0.53, -0.46) are saturated Imprint red; near-zero cells (-0.02, 0.10) fade toward the page background. Cell text switches between dark ink and light text based on the fill's luminance and stays readable on every cell, including the near-neutral ones.
      Legibility verdict: PASS — all title/axis/tick/cell text is clearly readable against the light background; verified again at the 400px mobile-scaled preview.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title, row/column labels, and colorbar, all rendered in light ink/gray that reads clearly against the dark background. No dark-on-dark text found anywhere, including on the darkest near-zero correlation cells (checked at pixel-crop zoom).
      Data: Diagonal and positive-correlation cells are the identical Imprint blue as the light render; negative cells are the identical Imprint red — confirmed pixel-for-pixel same data hues as light, only chrome (background/text/gridline) flipped.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed in either theme.
