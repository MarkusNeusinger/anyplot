review:
  strengths:
  - 'Energy axis is to scale and every level falls out of the data: reactants at 50,
    transition state at 120, products at 20 kJ/mol, with Ea = 70 and ΔH = −30 kJ/mol
    computed from the records (lines 77–94), not typed into the labels'
  - Ea and ΔH are drawn as double-headed arrows whose tips sit exactly on the reactant
    level, the peak height and the product level, each labeled with its value and
    unit
  - 'Clear hierarchy between the two arrows: Ea in solid ink as the primary quantity,
    ΔH dashed in INK_SOFT as secondary, with reactant and product reference lines
    lighter than the curve'
  - 'Idiomatic MUI X composition: ChartsContainer with LinePlot, ChartsReferenceLine
    for the dashed levels, and the useXScale/useYScale hooks so all custom SVG annotations
    are placed in data coordinates'
  - Theme tokens threaded through every element (ink, inkSoft, pageBg, palette[0]);
    both renders are fully legible with the brand-green curve identical in light and
    dark
  - 'Clean, minimal scientific style: axis lines, ticks and grid removed, explicit
    font sizes, skipAnimation set'
  weaknesses:
  - 'CQ-04 (code): the energy curve is drawn twice — once by the series via <LinePlot
    /> (line 341) and again as a hand-built SVG path assembled point by point in EnergyAnnotations
    (lines 120–137), with no visible effect in either render → keep only the LinePlot
    series (style its stroke width through the series or sx on .MuiLineChart-line)
    and delete the manual path. Likely cause: a styling workaround that was layered
    on instead of replacing the series line.'
  - 'Suggestion: the Ea arrow at x ≈ 0.54 crosses the descending branch of the curve;
    placing it at the peak''s x (from the reactant line up to the peak marker) would
    read more directly as ''reactant level to transition state''.'
  - 'Suggestion: name a concrete reaction (e.g. a substitution step) in the stage
    labels so the textbook example carries real-world context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: centered title "line-reaction-coordinate · javascript · muix · anyplot.ai" in dark ink; y axis "Potential energy (kJ/mol)" with ticks 0–140 every 10; x axis "Reaction coordinate" with ticks 0.00–1.00 every 0.05; axis lines, tick marks and grid removed. All text dark and readable.
      Data: one smooth brand-green (#009E73) curve: flat reactant shelf at 50 until ~0.14, rising to a single maximum at 120 kJ/mol at x = 0.40 (hollow green circle marker, "Transition State ‡" label above it), falling to a flat product shelf at 20 from ~0.72. Grey dashed horizontal lines at 50 and 20 span the plot. A solid dark double-headed arrow at x ≈ 0.54 runs from 50 to 120 labeled "Ea = 70 kJ/mol"; a dashed grey double-headed arrow at x ≈ 0.86 runs from 50 to 20 labeled "ΔH = −30 kJ/mol". "Reactants (50 kJ/mol)" sits above the left shelf, "Products (20 kJ/mol)" below the right shelf. No clipping at any edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, axis labels and tick labels in light ink, all readable; no dark-on-dark text.
      Data: curve, peak marker and layout identical to the light render, brand green #009E73 unchanged; Ea arrow and its label flip to light ink, ΔH arrow and dashed level lines in light grey, all clearly visible; peak marker hollow fill flips to the dark page color.
      Legibility verdict: PASS
