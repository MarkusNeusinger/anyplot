review:
  strengths:
  - 'Every element the spec asks for is present: labeled reactants, products and transition
    state, labeled double-headed Ea and ΔH arrows with ends exactly on their levels,
    dashed reactant/product levels lighter than the curve'
  - Energies, Ea and ΔH are computed from the records (peak search, level difference)
    rather than typed, so the annotations follow the data
  - 'Uses MUI X composition idioms: ChartsContainer with LinePlot, ChartsReferenceLine
    for the levels, and useXScale/useYScale hooks to anchor custom SVG annotations
    to data coordinates'
  - 'Clear hierarchy: solid ink Ea arrow versus dashed inkSoft ΔH arrow, hollow green
    marker focusing the transition state'
  - Theme tokens threaded through all chrome and annotations; both renders read cleanly
  weaknesses:
  - 'VQ-02 (both): the Ea arrow shaft at reaction coordinate 0.54 cuts through the
    descending branch of the curve at about 80 kJ/mol → draw the arrow where no curve
    crosses it, directly under the peak at xPeak (offset 0, −0.14) with the Ea label
    to its side. Likely cause: EA_X_OFFSET_FRAC = 0.14.'
  - 'Suggestion: the title renders in the MUI inherited font while all chart text
    uses system-ui; set fontFamily: FONT on the title Typography for one typeface.'
  - 'Suggestion: the band between the title and the 140 tick is wide; a smaller Y_PAD_TOP_FRAC
    would give the curve more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no grid, axis lines and ticks disabled.
      Chrome: centered title "line-reaction-coordinate · javascript · muix · anyplot.ai" in dark ink; y-axis title "Potential energy (kJ/mol)" with ticks 0–140 step 10; x-axis title "Reaction coordinate" with ticks 0.00–1.00 step 0.05; all in dark inkSoft and readable.
      Data: one #009E73 curve, flat at 50 kJ/mol to 0.14, rising smoothly to a peak of 120 at 0.40 (hollow green circle, label "Transition State ‡" above), falling to a flat 20 kJ/mol shelf from 0.72. Gray dashed lines at 50 and 20 span the plot. Solid ink double-headed Ea arrow at x≈0.54 from 50 to 120 labeled "Ea = 70 kJ/mol" (its shaft crosses the descending curve near 80 kJ/mol); dashed inkSoft ΔH arrow at x≈0.86 between 50 and 20 labeled "ΔH = −30 kJ/mol". "Reactants (50 kJ/mol)" above the left shelf, "Products (20 kJ/mol)" below the right shelf.
      Legibility verdict: PASS

