review:
  strengths:
  - 'Clean theme-adaptive chrome: day-label chips use an elevated background box so
    ''Mon''..''Sun'' stay legible over whatever cell color sits underneath, correctly
    z-ordered above the data layer in both themes.'
  - 'Correct colormap choice: uses the sequential imprint_seq gradient (not a diverging
    or custom colormap) for single-polarity visit-count data, with a clear High/Low
    visualMap legend.'
  - 'Faithful polar grid geometry: 7 evenly-divided radial day-rings x 24 evenly-divided
    hourly sectors, with angular tick labels shown only at the readable 6-hour interval
    the spec recommends (12am/6am/12pm/6pm).'
  - Deterministic, seeded synthetic data generation (small LCG) and clean, minimal,
    single-purpose code with no fake/simulated interactivity.
  - Reasonable use of a 'custom' series + renderItem sector drawing as the documented
    ECharts workaround for a plot type (polar heatmap) with no native series support.
  weaknesses:
  - 'CRITICAL DATA-MAPPING BUG: the color rendered for each polar cell does not align
    with its labeled hour position. Pixel-sampling both plot-light.png and plot-dark.png
    at the exact (day, hour) coordinates implied by the chart''s own declared geometry
    (polar center [''50%'',''56%''], radius [''16%'',''80%''], radiusAxis Mon->Sun
    inner-to-outer confirmed via the visible day-label chip order, angleAxis 24 hourly
    categories starting at top/12am going clockwise confirmed via the visible 12am/6am/12pm/6pm
    tick labels) shows: for weekday rings (Mon-Fri) the ''high traffic'' (blue) band
    actually renders around hours 18:00-02:00 instead of the intended 9:00-17:00 business-hours
    window (~9-hour angular displacement); for weekend rings (Sat-Sun) the ''high
    traffic'' band renders around hours 12:00-17:00 instead of the intended 18:00-23:00
    evening window (~6-hour displacement in the opposite direction). The displacement
    is byte-for-byte identical between the light and dark renders, so it is a deterministic
    property of the value-to-color mapping, not a sampling artifact. The 7x24 grid
    GEOMETRY itself is correctly and evenly divided (ring/sector boundaries match
    the axis labels exactly), so the defect is isolated to how each cell''s VALUE
    is resolved for coloring, not to the shape math. Likely cause: the polar ''custom''
    series has no explicit `encode`, so ECharts'' default dimension binding for a
    polar custom series may not guarantee that visualMap''s `dimension: 2` reads the
    same data row as the one renderItem draws via `api.value(0)`/`api.value(1)`. Fix
    by adding an explicit `encode: { radius: 0, angle: 1, value: 2 }` (or equivalent)
    to the series so the shape and its color are guaranteed to reference the same
    (dayIdx, hourIdx, visits) row, then re-verify that weekday lunch hours (12-13)
    and weekend evening hours (20-21) actually render as the most saturated blue at
    their correct angular position.'
  - 'DQ-03: visit counts (range ~2-110 per cell) read a little low for ''website visits''
    by hour; a few hundred to a few thousand would feel more realistic for a site
    with a visible daily/weekly traffic rhythm, though the current scale isn''t implausible
    for a small site.'
  - 'The legend/colorbar sits close to the right canvas edge (right: 24) with fairly
    tight breathing room; a touch more margin would match the generous-whitespace
    guidance elsewhere in the chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Website Traffic by Hour & Day · heatmap-polar · javascript · echarts · anyplot.ai" is centered at top in dark ink, clearly readable. Angular tick labels (12am top, 6am right, 12pm bottom, 6pm left) render in soft dark gray, legible against the light background. Radial day labels (Mon..Sun, Mon innermost near the center hole, Sun outermost) sit inside white "chip" boxes with dark bold text, staying legible regardless of the cell color underneath. The "High"/"Low" visualMap legend at the right renders in soft dark gray text next to a vertical blue-to-green gradient bar.
      Data: A 7 (day) x 24 (hour) grid of pie-slice/annulus cells fills the ring from ~16% to ~80% of the radius, colored on the green (low) to blue (high) sequential scale, separated by thin light dividing lines. The colored region visually resembles two large "wedge" fields — a blue field roughly covering the evening/midnight hours across the inner (weekday) rings and a distinct, smaller blue field roughly covering midday hours on the outer (weekend) rings — rather than a small, sharply-bounded blue patch precisely centered on the intended peak hours per ring.
      Legibility verdict: PASS — all text is readable, no light-on-light issues.
      Correctness verdict (see Weaknesses): pixel-level sampling of this same PNG at the coordinates implied by the polar/axis configuration shows the colored "high" bands are angularly displaced from the hours they are meant to represent (~9h displacement for weekday rings, ~6h for weekend rings) — the chart's own data-to-color mapping does not line up with its own hour-axis labels.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light ink (#F0EFE8-ish), clearly readable against the dark surface. Angular tick labels render in a lighter soft gray, legible. Radial day-label chips use a dark elevated-background box (~#242420) with light text, legible against any surrounding cell color. Legend text renders in light gray against the dark background, colorbar unchanged.
      Data: Same grid structure and identical cell colors as the light render (confirmed by direct pixel comparison — the sampled RGB triples at matching (day, hour) coordinates are identical between the two PNGs), i.e., only chrome flipped between themes as required; the data-color layer did not change.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome text and the brand-green/blue/teal data colors read clearly against the near-black background.
      Correctness verdict: same displacement bug as the light render (expected, since it stems from the shared option/data, not from theme-specific code).
