review:
  strengths:
  - Explicit peak-traffic annotation (bold outline on the highest-traffic cell, leader
    line, and "Peak traffic / Tue 8pm · 890 visits" label) now gives the chart a clear
    focal point and states its insight instead of relying on color alone
  - Refined colorbar legend with rounded-cap gradient bar and intermediate tick marks
    at 25/50/75% gives the legend a more graduated, polished feel
  - 'Correct polar-heatmap geometry via d3.arc(): hour-of-day wraps continuously as
    the angular axis, day-of-week forms concentric rings from Mon (innermost) to Sun
    (outermost)'
  - Sequential Imprint colormap (brand green → blue) is correctly single-polarity
    for positive visit counts and identical across both themes
  - Theme-adaptive chrome is fully correct in both renders — background, text, spokes,
    and cell-separator strokes all pull from window.ANYPLOT_TOKENS
  - Angular axis labeled at readable 6-hour intervals with spokes; day labels use
    a stroke halo for legibility over any cell color
  - Deterministic reproducibility via a tiny seeded LCG (Math.random() correctly avoided
    since it isn't seedable in-browser)
  - 'Clean idiomatic D3: canonical selection.data().join() pattern, no fake interactive
    elements'
  weaknesses:
  - 'CQ-01: three small helper functions (formatHour, lcg, trafficShape) deviate slightly
    from a strict flat KISS script, though justified by deterministic data generation
    needs'
  - 168 densely packed wedges are all individually distinguishable but the chart remains
    visually busy at a glance — an optional coarser radial value tick could aid quick
    value estimation beyond the legend
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Bold dark title "heatmap-polar · javascript · d3 · anyplot.ai" centered at top, fully visible. Angular tick labels (12am, 6am, 12pm, 6pm) in soft grey ink around the circle with thin spokes. Day labels (Mon-Sun) in dark ink with a light stroke halo along the upper-right spoke, legible over the varying wedge colors beneath. Bottom colorbar legend has a rounded-cap gradient bar, intermediate tick marks, "25 visits" / "890 visits" min/max labels, and a descriptive caption below — all readable.
      Data: 168 wedge cells colored on the Imprint sequential scale (brand green #009E73 → blue) show a clear low-traffic majority (green) with two elevated bands (blue) at morning-commute and evening-peak hours. The single highest-traffic cell (Tue 8pm, 890 visits) is outlined in dark ink with a leader line and "Peak traffic" annotation, giving the chart an explicit focal point.
      Legibility verdict: PASS - all text is readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Title, tick labels, and day labels all flip to light/white ink and remain fully legible. Cell-separator strokes and spokes flip to match the dark page background while remaining visible. Peak annotation leader line and outline flip to light ink, still clearly visible against the dark surface. Legend text and gradient bar remain clearly readable.
      Data: Wedge colors are identical to the light render (brand green → blue), confirming only chrome (background, text, strokes) changed between themes. Peak cell is the same Tue 8pm wedge as in light mode.
      Legibility verdict: PASS - no dark-on-dark failures found; all chrome elements are light-colored against the near-black background.
