review:
  strengths:
  - Correctly builds a true polar heatmap from Chart.js's doughnut primitive by stacking
    7 rings (one per day) and reversing dataset order so Monday lands innermost as
    the spec requires
  - Custom afterDraw plugin adds angular hour ticks at readable cardinal intervals
    (12am/6am/12pm/6pm), radial day-ring pill labels placed on a dedicated spoke to
    avoid any collision with the hour ticks, and a hand-built gradient colorbar with
    labeled min/max — all matching the spec's suggested chrome (colorbar, borders
    between cells, readable angular labels)
  - imprint_seq (brand green → blue) used correctly for this single-polarity continuous
    metric, with identical data colors between light and dark renders and fully theme-adaptive
    chrome (title, ticks, colorbar text, pill backgrounds)
  - Deterministic fixed-seed LCG generates a realistic e-commerce traffic scenario
    with distinct weekday (after-hours peak) vs. weekend (broad afternoon peak) patterns,
    matching the valueMin/valueMax shown on the colorbar
  - 'Clean adherence to the mount-node contract: animation disabled, no canvas sizing,
    single canvas appended, tooltip callbacks wired for the interactive HTML view'
  weaknesses:
  - Colorbar min/max labels ('132', '3,103') and the radial day-ring pill text sit
    at the smaller end (14-15px CSS in the mount) — bumping them up slightly would
    add extra legibility margin at the 400px mobile thumbnail
  - The peak-traffic band (weekend afternoon) is only conveyed through color intensity;
    a small direct callout/annotation on the darkest cell would push data storytelling
    from 'good' to 'excellent'
  - The 8% cutout leaves the innermost ring (Monday) quite thin, making its band harder
    to compare at a glance against the outer rings — a slightly larger cutout (~12-15%)
    would even out ring widths
  - Data pattern is smooth/gaussian-only across all 168 cells; a touch of real-world
    irregularity (e.g. one anomalous spike) would demonstrate fuller feature coverage
    of the value range
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — not pure white, matches the Imprint light surface.
      Chrome: Title "Hourly Website Traffic · heatmap-polar · javascript · chartjs · anyplot.ai" in dark ink at the top, fully readable. Four angular hour tick labels (12am top, 6am right, 12pm bottom, 6pm left) in soft dark ink outside the ring. Seven day-name pills (Mon innermost through Sun outermost) on a diagonal spoke, dark text on a light elevated-background pill, all legible. Colorbar at the bottom with "132" / "3,103" endpoint labels and a "Visits per hour" caption, all in soft dark ink. Thin light-colored (page-bg-colored) borders separate every cell.
      Data: 7 concentric rings × 24 angular wedges rendered in the imprint_seq green-to-blue continuous scale. A clear darker-blue band is visible in the outer (weekend) rings around the 12pm-6pm arc, consistent with the coded weekend-afternoon traffic peak; inner (weekday) rings show a subtler band near 6pm-12am (evening peak).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — not pure black, matches the Imprint dark surface.
      Chrome: Same title now in light ink, fully readable against the dark background. Angular hour ticks in soft light ink. Day-name pills now use a dark elevated-background pill with light text, remaining legible. Colorbar endpoint labels and caption rendered in soft light ink. Cell border lines rendered in the dark page-background color, still providing visible separation against the surrounding hue-saturated cells.
      Data: Colors are pixel-identical to the light render — same green-to-blue imprint_seq gradient, same weekend-afternoon dark-blue band and weekday evening band. Confirms data colors are held constant across themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title, tick, pill, and colorbar text is clearly visible against the near-black surface.
