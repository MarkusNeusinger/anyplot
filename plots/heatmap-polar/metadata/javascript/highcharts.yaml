review:
  strengths:
  - Faithfully hand-implements a true polar heatmap using only the core Highcharts
    renderer (chart.renderer.arc/rect/text) since neither highcharts-more nor the
    heatmap module is loaded — exactly the workaround the library prompt calls for,
    rather than reaching for another library.
  - Data shape (7 days x 24 hours = 168 cells) matches the specification's own suggested
    example precisely, with a realistic weekday bimodal commute pattern (~9am/~7pm
    peaks) versus a single broad weekend afternoon peak.
  - 'Full theme-adaptive chrome: day-label halo boxes, hour labels, and the custom
    colorbar all correctly flip between light/dark tokens while the imprint_seq (green-to-blue)
    data colors stay pixel-identical between renders.'
  - 'Genuine interactivity is preserved despite the hand-drawn wheel: an invisible
    scatter layer aligned to each wedge centroid recovers real native Highcharts tooltips
    (day, hour, value) rather than faking hover states.'
  - Custom sequential colorbar with correct min/max value labels and units ("Visits
    / hr") directly satisfies the spec's "include a colorbar legend for value interpretation"
    requirement, and thin cell borders satisfy the spec's gridline suggestion.
  weaknesses:
  - Day-of-week ring labels sit in plain rounded-rect halo boxes; slightly more typographic
    refinement (e.g. a thin border matching the theme's rule color) would lift Design
    Excellence further.
  - The workaround needs several helper functions (baseline, hexToRgb, lerp, rgbToCss,
    hourAngle, drawAll) which is more structure than a minimal KISS snippet — justified
    by the missing polar/heatmap modules, but worth simplifying if those modules ever
    become available.
  - The weekday-commute vs weekend-afternoon story is only visible through color intensity;
    no explicit callout highlights the two peak regimes for a reader scanning quickly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-polar · javascript · highcharts · anyplot.ai" in bold dark ink at top, centered; subtitle "Simulated hourly visits · Mon (inner ring) to Sun (outer ring)" in softer grey below it. Hour labels (12am/6am/12pm/6pm) sit outside the wheel in soft grey. Day-of-week labels (Mon..Sun) sit on light halo boxes along the 12am spoke, dark text on near-white box fill so they stay legible over any wedge color beneath. Colorbar on the right labeled "Visits / hr" with "153" (top, blue) and "11" (bottom, green) in grey text.
      Data: A ring-and-wedge wheel of 7 rings (Mon inner to Sun outer) x 24 angular sectors (hours), colored via the Imprint imprint_seq gradient (brand green #009E73 at low values -> blue #4467A3 at high values). A clear blue (high-value) cluster appears in the 3pm-8pm arc across the rings, consistent with the weekday evening commute peak and the weekend afternoon peak; a secondary blue patch near 9am is visible in the inner (weekday) rings only.
      Legibility verdict: PASS — all text (title, subtitle, hour labels, day labels, colorbar) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light ink/grey, clearly visible against the dark background. Hour labels outside the wheel are light grey. Day-of-week halo boxes flip to a dark elevated-surface fill with light text, keeping the same legibility pattern as the light render. Colorbar labels ("153", "11", "Visits / hr") render in light grey, fully readable.
      Data: The wedge colors are identical to the light render — same green-to-blue imprint_seq gradient, same high-value cluster positions (weekday commute peaks near 9am/7pm, weekend afternoon peak) — confirming only chrome flips between themes, not data color.
      Legibility verdict: PASS — no dark-on-dark failures found; every title/label/tick is clearly visible against the near-black surface.
