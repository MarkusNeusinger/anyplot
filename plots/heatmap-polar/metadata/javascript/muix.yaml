review:
  strengths:
  - Fully custom SVG polar-wedge composition built directly on ChartContainer/useDrawingArea
    since community MUI X has no polar coordinate system or Heatmap component -- genuinely
    solves the 'MUI X can't express this' problem instead of faking it
  - Correct Imprint sequential palette (imprint_seq stops) with identical data colors
    between light and dark renders; only chrome flips
  - Real, data-bound ContinuousColorLegend wired to MUI X's zAxis colorMap (not a
    drawn stand-in), with meaningful min/max value labels
  - Deterministic, realistic hourly-traffic data generator (gaussian-based weekday/weekend/nightlife
    structure), fully reproducible with no RNG
  - Correct mandated title format, skipAnimation set, default export, sized from window.ANYPLOT_SIZE
    per the harness contract
  weaknesses:
  - A deliberate 10-degree angular gap is inserted between hour 23 and hour 0 to hold
    the day-of-week labels, which visually breaks the '0 degrees and 360 degrees are
    adjacent' cyclic-continuity guarantee that is the spec's stated reason a polar
    heatmap beats a rectangular one -- the midnight nightlife peak the code comments
    call out as demonstrating continuity sits right next to this visible seam. Relocate
    the day labels (e.g. a thin radial spoke line or an external label column) so
    the wedges can tile the full 360 degrees.
  - Radial (day-of-week) contrast is visually subtle at a glance -- weekday rings
    blend closely together at a given hour, making the second data dimension harder
    to read than the angular (hour) dimension. Consider sharpening the weekday/weekend
    value separation or ring borders.
  - The ContinuousColorLegend sits very close to the bottom canvas edge in both renders
    (tight margin, though no pixels are clipped) -- add a bit more bottom margin for
    breathing room.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "Website Traffic by Hour & Day · heatmap-polar · javascript · muix · anyplot.ai" in dark ink at top, clearly readable. Day-of-week labels (Mon-Sun) run in a narrow gap column from center (Mon, innermost) to outer edge (Sun, outermost), rendered in bold dark ink, readable. Hour tick labels (12am, 6am, 12pm, 6pm) placed around the circle at their clock positions in soft dark gray, readable. A horizontal gradient colorbar legend sits below the chart with "14 visits/hr" / "121 visits/hr" end labels in dark ink, readable but close to the bottom canvas edge.
      Data: 7 concentric rings (Mon innermost -> Sun outermost) x 24 angular wedges (hours), colored on a green-to-teal-to-blue sequential scale (imprint_seq) with a visible bright-green band near the 12am/6am arc (nightlife + morning peaks) and darker blue-teal bands near midday/afternoon. Thin background-colored strokes separate each wedge.
      Legibility verdict: PASS -- no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title, day labels, hour tick labels, and legend labels as the light render, but rendered in light/white ink against the dark background -- all clearly legible. No dark-on-dark text found; tick and legend labels are a soft light gray, day labels a brighter near-white.
      Data: Same wedge geometry and identical green-to-blue sequential colors as the light render -- confirms only chrome (background + text color) flipped between themes, data colors held constant as required.
      Legibility verdict: PASS -- no dark-on-dark text found.

    Shared observation (not a legibility failure, but a spec-compliance issue): both renders show a ~10-degree blank gap at the 12am boundary (used to host the day-of-week labels), which visually breaks the continuous 360-degree wrap the spec calls out as the core reason to use a polar heatmap over a rectangular one.
