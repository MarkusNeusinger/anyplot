review:
  strengths:
  - Composes the polar heatmap through MUI X's ChartsContainer with the useDrawingArea
    hook, so the 168 ring segments are laid out from the chart's own drawing area
    instead of hard-coded pixel offsets
  - 'The angular axis closes cleanly: 24 equal 15° sectors run clockwise from 12am
    at the top, and 11pm sits directly next to 12am with no seam; the Fri/Sat late-night
    traffic block spans midnight and shows the cyclic continuity'
  - Rings run Mon (inner) to Sun (outer) and are labelled inside the 12pm sector,
    with each label's fill switched between dark and light ink from the luminance
    of the cell under it
  - 'The sequential imprint_seq gradient (#009E73 → #4467A3) is built from window.ANYPLOT_TOKENS.seq,
    and a horizontal color bar with rounded ticks (14–134) is drawn from the same
    stops; data colors are identical in both themes'
  - Cell borders use the theme page color at 2 px, so they stay thin and subordinate
    to the cell colors on both the light and the dark surface
  - skipAnimation is set and the component is a default export sized to window.ANYPLOT_SIZE
    with the square orientation directive
  weaknesses:
  - 'Suggestion: the mandated title fills only about 40 % of the width; a slightly
    larger title size (about 26 px) would give it more presence over the large disc.'
  - 'Suggestion: MUI X tooltips are not wired up, so the HTML view gives no per-cell
    value on hover; a ChartsTooltip-style hover readout of day, hour and visits would
    add value in the interactive output.'
  - 'Suggestion: the ring and sector bins are collected with Array.includes loops;
    [...new Set(data.map(...))], as the library prompt shows, would be shorter.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "heatmap-polar · javascript · muix · anyplot.ai" at the top, a soft-ink subtitle ("Visits per hour by Hour of day (24 sectors) & Day of week (Mon inner → Sun outer) · Peak 134 (Sat 1pm)"), angular labels every 3 hours (12am, 3am, 6am, 9am, 12pm, 3pm, 6pm, 9pm) in bold soft ink around the outside, ring labels Mon–Sun inside the 12pm sector in white text, and a horizontal color bar titled "Visits per hour" with ticks 14, 44, 74, 104, 134 at the bottom. All text is readable.
      Data: a donut-shaped polar heatmap of 7 concentric rings × 24 equal sectors, filled along the imprint_seq ramp from brand green #009E73 (low, the night hours of Mon–Thu) to blue #4467A3 (high, the Sat/Sun afternoon and the weekday 8–9am peak). Cells are separated by thin page-colored borders. The ring closes at 12am with no gap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle, angular labels and color-bar ticks in light soft ink; ring labels stay white on the mid-tone cells. No dark-on-dark text anywhere.
      Data: cell colors and the color-bar gradient are identical to the light render; only the cell borders flip to the dark page color and the chrome inverts.
      Legibility verdict: PASS
