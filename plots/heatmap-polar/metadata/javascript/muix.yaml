review:
  strengths:
  - 'Correct polar heatmap: 7 concentric day rings (Mon innermost to Sun outermost)
    × 24 equal 15° hour sectors drawn as SVG annular paths inside a community ChartsContainer
    via the useDrawingArea hook, so geometry follows MUI X''s drawing area'
  - 'Cyclic continuity is real and visible: the 11pm and 12am sectors meet with no
    seam, and the data is built so the Fri/Sat nightlife bump straddles midnight (cyclic
    distance min(h, 24−h)), which shows exactly what a rectangular heatmap would split'
  - Sequential imprint_seq gradient (t.seq[0] → t.seq[1]) is used for both the cells
    and the horizontal colorbar, with a titled colorbar and five value ticks; cell
    borders in the page color stay subordinate to the cell colors in both themes
  - Ring labels placed along the 12pm spoke pick dark or light ink from the cell's
    luminance, so each day label stays legible on its cell in both themes
  - Subtitle states the ring orientation (Mon inner → Sun outer) and the computed
    peak (134, Sat 1pm), giving the viewer a reading key and a focal point derived
    from the data
  - Fully deterministic data, theme tokens threaded through every text element, skipAnimation
    set
  weaknesses:
  - 'VQ-02 (both): the ''Mon'' ring label is wider than its narrow innermost cell
    and its final ''n'' runs across the 180° cell border (the page-colored separator
    cuts through the letter) → the label fits inside its cell with a few px to spare
    (about −2 px font or a spoke angle where the innermost cell is wider). Likely
    cause: fontSize={14} fontWeight={700} for every ring label regardless of the inner
    ring''s arc width at DAY_LABEL_ANGLE.'
  - 'Suggestion: colorbar ticks at 14, 44, 74, 104, 134 come from min/max fractions;
    round values (25, 50, 75, 100, 125) would read faster.'
  - 'Suggestion: the HTML output could expose each cell''s value on hover (a ChartsTooltip
    or SVG <title>) since the PNG shows color only.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400×2400 square canvas.
      Chrome: bold dark title "heatmap-polar · javascript · muix · anyplot.ai" centered at top, softer subtitle "Visits per hour by Hour of day (24 sectors) & Day of week (Mon inner → Sun outer) · Peak 134 (Sat 1pm)"; hour labels 12am, 3am, 6am, 9am, 12pm, 3pm, 6pm, 9pm in bold soft ink around the circle; day labels Mon–Sun stacked along the 12pm spoke in light ink; horizontal colorbar "Visits per hour" at the bottom with ticks 14/44/74/104/134. All text readable; the 'Mon' label's last letter is crossed by the white cell border.
      Data: 7 rings × 24 sectors of annular cells with a small center hole, colored on the imprint_seq gradient from brand green #009E73 (low, night hours on weekdays) to blue #4467A3 (high, Sat/Sun late morning–afternoon). White 2 px separators between cells. 11pm and 12am sectors meet seamlessly at the top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle, hour labels and colorbar ticks in light soft ink — all clearly readable, no dark-on-dark text. Cell separators switch to the dark page color.
      Data: cell and colorbar colors identical to the light render (green → blue); only chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
