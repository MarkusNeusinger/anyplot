review:
  strengths:
  - Correct PolarAxis polar heatmap with angular = hour-of-day, radial = day-of-week,
    matching the spec exactly, including the readable-interval angular ticks (12am/6am/12pm/6pm)
    it suggests.
  - Smart theme-invariant "label-on-data" halo-stroke technique keeps radial day labels
    legible in both light and dark themes despite sitting directly on top of the data
    cells.
  - 'Sequential Imprint colormap (#009E73 -> #4467A3) correctly chosen for single-polarity
    "avg hourly visits" data, and pixel-identical across themes.'
  - 'Clean, idiomatic Makie code: KISS structure, reproducible seed, current size=
    API (not deprecated resolution=), and a Colorbar properly tied to the heatmap
    plot object.'
  weaknesses:
  - The 5 weekday radial rings (Mon-Fri) render in nearly identical shades, making
    the 7-way day-of-week comparison hard to read - increase the spread of day_scale
    across weekdays, or otherwise strengthen the radial encoding, so all 7 days are
    individually discernible.
  - No stroke/border is drawn between heatmap cells (heatmap! has no strokewidth/strokecolor),
    so adjacent hours blend into smooth blob-like regions instead of a legible grid;
    the spec explicitly suggests "thin gridlines or borders between cells for readability"
    - try strokewidth ~= 0.5, strokecolor = (PAGE_BG, 0.4) on the heatmap! call.
  - The radial day labels ("Mon"..."Sun") are all clustered tightly along the single
    vertical 12am spoke, right through the busiest, most convergent part of the plot
    near the center - consider a small angular offset for that label column, or lightening
    it slightly, to reduce visual clutter near the core.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "heatmap-polar · julia · makie · anyplot.ai" in dark ink above the plot; hour ticks (12am/6am/12pm/6pm) in soft dark ink around the circle; colorbar "Avg. Hourly Visits" with dark label and softer tick labels. All clearly readable.
      Data: Sequential green (#009E73, low) to blue (#4467A3, high) heatmap cells; radial day labels (Mon...Sun) rendered as dark text with a light halo directly on top of the data cells, staying legible over both green and blue regions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, hour ticks, and colorbar label/ticks all flipped to light ink; spines and gridlines lightened to match the dark surface. All clearly readable, no dark-on-dark text found.
      Data: Confirmed identical green-to-blue heatmap cell colors to the light render (no data-color drift between themes). Radial day labels use the same dark-ink + light-halo styling as the light render (intentional, since they sit on data rather than page background) and remain fully legible on both hues.
      Legibility verdict: PASS
