review:
  strengths:
  - Widened day_scale spread (0.75-1.35 weekday, 0.55/0.45 weekend) now produces a
    visible star-shaped blue/green boundary, so the 5 weekday rings read as genuinely
    distinct bands instead of a uniform blob.
  - 'Correct sequential Imprint colormap (#009E73 -> #4467A3) for single-polarity
    avg-visits data, pixel-identical across light and dark themes.'
  - Theme-invariant dark-ink/light-halo styling keeps the radial day labels legible
    sitting directly on top of the data cells in both themes.
  - 'Clean, idiomatic Makie implementation: PolarAxis + heatmap! + Colorbar tied to
    the plot object, KISS structure, reproducible seed, current size= API.'
  - 'Correct polar heatmap mapping: hour-of-day to angle (with readable 12am/6am/12pm/6pm
    ticks), day-of-week to radius (Mon innermost, Sun outermost), all 168 cells represented.'
  weaknesses:
  - The cell-boundary overlay lines added this attempt (spoke_pts/ring_pts at color=(PAGE_BG,
    0.4), linewidth=1) are nearly imperceptible in both renders -- the 7x24 grid still
    reads as smoothly blended color regions rather than a legible cell grid. Try a
    higher alpha (~0.7-0.8) or a slightly thicker linewidth (~1.2-1.5), or switch
    the overlay color to the fixed ink tone (INK at low alpha) instead of PAGE_BG
    so it reads as a border regardless of which cell color it crosses.
  - The radial day-label column (Mon...Sun) still sits stacked directly along the
    12am spoke, running straight through the visual core of the plot; the rtickangle=pi/8
    offset is too subtle to visibly separate the labels from the busiest area -- consider
    a larger offset (e.g. pi/4) or lightening the label track.
  - Mon/Tue/Wed weekday rings are still fairly close in shade to one another even
    with the widened day_scale -- the improvement mainly shows at the Fri (peak) and
    weekend (trough) ends of the range.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "heatmap-polar · julia · makie · anyplot.ai" centered above the plot in dark ink; angular (hour) ticks at 12am/6am/12pm/6pm in soft dark gray; radial (day) tick labels Mon-Sun stacked along the 12am spoke, rendered light/white-filled with a thin dark accent, sitting on top of the data cells; colorbar on the right labeled "Avg. Hourly Visits" with tick values 20-100, label and ticks in dark ink/soft gray. All readable.
      Data: Sequential green (#009E73, low) to blue (#4467A3, high) ramp. A large blue-ish central disk (Mon-Fri core hours) surrounded by a green outer band (lower-traffic Sat/Sun rings and off-peak hours). The blue/green boundary is now a visible jagged "star" shape -- it bulges outward around the Fri position (highest day_scale) and pulls inward at Sat/Sun (lowest), so weekday-to-weekday variation is discernible, though Mon/Tue/Wed remain close to one another in shade. Faint overlay gridlines meant to mark individual hour/day cell boundaries are present in the code but essentially invisible in the render -- cells still blend into smooth regions rather than a crisp grid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same layout with theme-flipped chrome -- title and hour-tick labels render in light ink, spines/gridlines lighten to match the dark surface, colorbar label/ticks in light ink/soft light gray. Radial day labels retain the same fixed dark-ink/light-halo styling as the light render (by design, since they sit on data, not page background) and stay legible.
      Data: Heatmap cell colors (green-to-blue ramp) are pixel-identical to the light render -- confirmed no data-color drift between themes. Same star-shaped weekday/weekend boundary pattern visible. Same near-invisible cell-boundary overlay lines as in the light render.
      Legibility verdict: PASS -- no dark-on-dark or light-on-light failures detected.
