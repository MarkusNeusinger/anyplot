review:
  strengths:
  - 'Polar heatmap built the grammar way: geom_tile on hour+0.5 centres with coord_polar(theta=''x'')
    closes the cycle at midnight with no seam'
  - 'Continuous fill on imprint_seq with the theme''s field stops (sampled through
    ramp_color into scale_fill_gradientn): low hours recede into the page and the
    business-hour peak stands out in both themes'
  - Whole canvas painted the page colour with the one-panel gggrid wrap, so the square
    render has no transparent strips
  - Cell borders in the page colour stay subordinate to the fills and flip with the
    theme; rings Mon..Sun with Mon innermost
  - Angular breaks and labels computed from the data every 6 hours; PNG plus interactive
    HTML output
  weaknesses:
  - 'Suggestion: place the day labels next to their rings (for example along the 12am
    spoke) instead of on the detached left axis, so each ring is read without tracing
    across the canvas.'
  - 'Suggestion: a slightly wider colour bar would give the value scale more presence
    beside the large disc.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400x2400 canvas (corners verified).
      Chrome: bold dark-ink title 'Website Traffic · heatmap-polar · python · letsplot · anyplot.ai' (~82% width); angular labels 12am (top), 6am (right), 12pm (bottom), 6pm (left) in INK_SOFT; radial labels Mon..Sun on the left axis at the ring radii; axis titles 'Hour of day' and 'Day of week'; colour bar 'Hourly visits' (200-800) in an elevated box. All readable.
      Data: 7 concentric rings (Mon innermost) x 24 equal segments on imprint_seq light field stops: mint #66E2B2 for night lows through #009E73 and #4467A3 to navy #002850 at the weekday 9am-5pm peak in the lower half; weekend outer rings show a midday-evening band; thin off-white borders; no seam at midnight.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the whole canvas.
      Chrome: title, axis titles and labels in light ink; legend box #242420 with light text; outer guide circle soft grey. No dark-on-dark text.
      Data: same layout on the dark field stops of imprint_seq: night lows in dark green #00573D receding into the page, #009E73 mid, peak cells bright pale blue #CDD9FF; borders in the near-black page colour. The ramp flips per theme as the style guide requires.
      Legibility verdict: PASS
