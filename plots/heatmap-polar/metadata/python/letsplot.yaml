review:
  strengths:
  - 'Polar heatmap built the grammar way: geom_tile on hour+0.5 centres with coord_polar(theta=''x'')
    closes the cycle at midnight with no seam'
  - 'Continuous fill on the Imprint sequential ramp (scale_fill_gradient #009E73 ->
    #4467A3) with a colour bar, correct in both themes'
  - Cell borders in the page colour stay subordinate to the fills and flip with the
    theme
  - Angular breaks and labels computed from the data (every 6 hours), rings labelled
    Mon..Sun with Mon innermost
  - Square 2400x2400 canvas with explicit text sizes matching the lets-plot reference;
    PNG + interactive HTML output
  weaknesses:
  - 'Suggestion: place the day labels next to their rings (for example along the 12am
    spoke) instead of on a detached left axis, so each ring is read without tracing
    across the canvas.'
  - 'Suggestion: a slightly wider colour bar would give the value scale more presence
    beside the large disc.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole chart area (the PNG's top and bottom ~120 px rows are transparent padding from the pipeline).
      Chrome: bold dark-ink title 'Website Traffic · heatmap-polar · python · letsplot · anyplot.ai'; angular labels 12am (top), 6am (right), 12pm (bottom), 6pm (left) in INK_SOFT; radial labels Mon..Sun on the left axis aligned to ring radii; axis titles 'Hour of day' and 'Day of week'; colour bar 'Hourly visits' (200-800) in an elevated box with a soft outline. All readable.
      Data: 7 concentric rings (Mon innermost) x 24 equal segments, filled on the imprint_seq ramp from brand green #009E73 (night lows) to blue #4467A3 (weekday 9am-5pm peak in the lower half); weekend outer rings show the midday-to-evening band on the left; thin off-white borders; no seam at midnight.
      Legibility verdict: PASS

