review:
  strengths:
  - Builds a true polar heatmap from pygal Pie in donut mode, one single-series ring
    per year, with 2017 innermost and equal 30-degree sectors that close seamlessly
    at Dec/Jan
  - imprint_seq green-to-blue ramp applied per cell with a matching color bar; cell
    colors identical across both themes
  - 'Theme-adaptive chrome: page-colored cell borders, INK/INK_SOFT text, all readable
    on #FAF8F1 and #1A1A17'
  - 'Per-slice titles (''Jan 2017: 23k'') become hover tooltips in the HTML output'
  - 'Clear data story: summer peak and steady growth outward are visible at a glance;
    adaptable-code data block with column constants'
  weaknesses:
  - 'VQ-02 (both): the year labels 2017-2022 are centered on the 12 o''clock Dec/Jan
    radial seam, so the 5 px border line runs through the middle of each label → place
    them clear of the seam, for example text-anchor start a few px right of it inside
    the Jan cells. Likely cause: year label x = CX with text-anchor middle.'
  - 'DQ-02 (both): the rings are real years 2017-2022 yet tourist arrivals grow 4
    % every year with no 2020/2021 collapse, which no real resort saw → use a year
    span without the pandemic (for example 2012-2017) or let 2020-2021 drop. Likely
    cause: year_list and the uniform 1 + 0.04 * i growth factor.'
  - 'Suggestion: a midpoint tick on the color bar would make the mid-season greens
    easier to read off.'
  - 'Suggestion: a focal cue on the August peak would give the chart a clear entry
    point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "heatmap-polar · python · pygal · anyplot.ai", INK_SOFT subtitle "Monthly tourist arrivals; rings run from 2017 (inner) to 2022 (outer)", 12 month labels Jan..Dec clockwise from 12 o'clock outside the rim, bold year labels 2017..2022 stacked along the 12 o'clock seam, horizontal color bar at the bottom titled "Visitors (thousand)" with 19 and 195. All text readable.
      Data: 6 concentric rings x 12 equal sectors around a center hole, colored with imprint_seq (#009E73 green for low winter months to #4467A3 blue for the July/August peak); page-colored borders between cells. The year labels sit on the Dec/Jan seam line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
