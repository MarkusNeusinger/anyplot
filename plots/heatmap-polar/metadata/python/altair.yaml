review:
  strengths:
  - Ring segments drawn natively with mark_arc theta/theta2 + radius/radius2 on identity
    scales, so every cell sits exactly on its month and year and Dec closes onto Jan
    with no seam
  - imprint_seq colour ramp with a horizontal colour bar titled with units, identical
    data colours in both themes
  - Year labels set into the Dec cells in bold near-white read on every cell colour
    and identify each ring without a separate axis
  - Theme-adaptive chrome throughout (title, month labels, legend frame and text)
    and a pad-only step that lands exactly on the 2400x2400 canvas
  - HTML output carries month/year/energy tooltips for cell inspection
  weaknesses:
  - 'VQ-05 (both): the colour-bar legend box is anchored at the bottom-left (about
    x 200-1220 of 1932) under a centred ring, leaving the bottom-right quarter empty
    → centre the legend under the ring. Likely cause: Legend(orient=''bottom'') aligns
    left in Vega-Lite; set legendX/legendY with orient=''none'' or a centred direction/title
    anchor.'
  - 'Suggestion: a slightly wider gradient (gradientLength) would spread the 165-270
    kWh range and make neighbouring cells easier to tell apart.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the 2400x2400 canvas.
      Chrome: Title 'heatmap-polar · python · altair · anyplot.ai' bold dark INK at top, centred. Twelve bold month labels (Jan-Dec) in INK_SOFT around the ring, Jan just right of 12 o'clock, Dec just left. Year labels 2019-2023 in bold near-white stacked inside the Dec column, 2019 innermost. Colour-bar legend at bottom-left on an elevated off-white box with dark title 'Energy (kWh/month)' and ticks 180-260. All readable.
      Data: 5 concentric rings x 12 equal 30 deg segments around a centre hole, coloured by the imprint_seq ramp from #009E73 (low) to #4467A3 (high); thin page-coloured cell borders. Dec/Jan cells of the outer rings are the bluest (winter peak), Apr-May and Oct the greenest; outer rings bluer than inner (upward trend).
      Legibility verdict: PASS

