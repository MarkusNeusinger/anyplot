review:
  strengths:
  - Cyclic angular axis closes with no seam, hours clockwise from the top
  - Wedges built as geom_polygon cells give equal angular widths and concentric rings
    with Mon innermost
  - Theme tokens threaded through all chrome
  weaknesses:
  - 'VQ-07 (both): continuous traffic is colored with scale_fill_cmap(''viridis''),
    a forbidden colormap → imprint_seq, scale_fill_gradient(low=''#009E73'', high=''#4467A3'').
    Likely cause: scale_fill_cmap(cmap_name=''viridis'').'
  - 'VQ-05 (both): canvas is 3600x3600, not a canonical size → 2400x2400 (-1200 x
    -1200); stray axis tick marks show at the left edge and bottom → none. Likely
    cause: figure_size=(12, 12) with dpi=300, and axis_ticks not set to element_blank().'
  - 'SC-04 (both): title ''Website Traffic · heatmap-polar · plotnine · anyplot.ai''
    lacks the language segment → ''… · heatmap-polar · python · plotnine · anyplot.ai''.
    Likely cause: labs(title=...).'
  - 'VQ-01 (light): ring labels Sun, Sat and Thu in dark ink over dark-purple cells
    read faintly, and the peak caption at size 12 sits below the 16 pt hour labels
    → a contrasting ink or plate for ring labels, caption at the tick-label size (+4).
    Likely cause: geom_text(color=INK) and annotate(size=12).'
  - 'Suggestion: a stronger typographic hierarchy between title, hour labels and ring
    labels.'
  image_description: |-
