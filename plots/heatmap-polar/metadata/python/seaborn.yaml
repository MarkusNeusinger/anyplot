review:
  strengths:
  - Clock orientation (midnight at top, clockwise) suits hourly data
  - Polar mesh closes seamlessly at 12am with equal-width sectors
  - Both themes render with correct backgrounds and readable chrome
  weaknesses:
  - 'VQ-07 (both): the cells use the viridis colormap, which the style guide forbids
    → imprint_seq (#009E73 to #4467A3). Likely cause: cmap="viridis".'
  - 'VQ-05 (both): canvas is 5265x2932, neither 3200x1800 nor 2400x2400 → 2400x2400
    square (figsize 6x6 at dpi 400). Likely cause: figsize=(12, 12) with bbox_inches="tight"
    and a second panel.'
  - 'SC-01 (both): a companion rectangular heatmap panel the spec does not ask for
    fills the right half → remove it. Likely cause: an extra sns.heatmap subplot.'
  - 'SC-04 (both): title ''Website Traffic · heatmap-polar · seaborn · anyplot.ai''
    lacks the ''python'' language segment → ''Website Traffic · heatmap-polar · python
    · seaborn · anyplot.ai''. Likely cause: the title string.'
  - 'VQ-02 (both): bold boxed day labels sit on the cells of the 00:00-03:00 sectors
    and hide them, and ''6am'' collides with the polar rim → unboxed labels in a clear
    slot, hour labels padded off the rim. Likely cause: set_yticklabels at the default
    rlabel position and no x tick pad.'
  - 'CQ-05 (code): savefig uses bbox_inches="tight" and dpi=300, which the library
    prompt forbids → dpi=400 with the default bbox. Likely cause: the savefig call.'
  - 'CQ-01 (code): the Data block ends with `traffic = np.clip(...)` instead of a
    tidy df, with no column constants, and the plot reads n_hours, n_days, traffic
    and days from the block → end the block in a tidy df and derive the grid with
    pivot_table below it. Likely cause: data built as a numpy matrix.'
  - 'Suggestion: label the angular axis at a denser readable interval (every 3 h)
    to ease reading the hour of each peak.'
