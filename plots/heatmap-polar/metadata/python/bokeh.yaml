review:
  strengths:
  - annular_wedge over a ColumnDataSource with LinearColorMapper + transform draws
    all 168 cells in one glyph
  - 'Clock-like layout: 12am at the top, hours clockwise, labels every 3 hours, midnight
    cells adjacent to 11pm'
  - Realistic website-traffic data with weekday double peaks and a weekend afternoon
    plateau
  weaknesses:
  - 'AR-09 (both): the colorbar extends past the bottom canvas edge; its lowest tick
    label is chopped in the last rows and its ''Hourly Visits'' title is entirely
    off the canvas → keep the whole colorbar on the canvas. Likely cause: the screenshot
    viewport is 139 px shorter than the 3600 px figure (no CDP Emulation.setDeviceMetricsOverride).'
  - 'VQ-05 (both): canvas is 3600x3461, not a canonical size → 2400x2400 square (W,
    H = 2400, 2400). Likely cause: W, H = 3600, 3600 plus the missing CDP viewport
    pin.'
  - 'VQ-07 (both): cells use Viridis256, which the style guide forbids for continuous
    data → the Imprint sequential ramp #009E73 to #4467A3. Likely cause: LinearColorMapper(palette=Viridis256).'
  - 'VQ-01 (both): title 28px, hour labels 24px, colorbar ticks 20px on a 3600 px
    canvas read small, far below the style guide''s bokeh sizes (title ~50pt, ticks
    ~34pt) → roughly +40 px each. Likely cause: px font sizes in Label, ColorBar and
    p.title.'
  - 'VQ-06, SC-02 (both): the color bar has no visible title in the render, so the
    value channel is unlabelled → a visible ''Hourly visits'' colorbar title. Likely
    cause: the title is drawn below the clipped canvas edge.'
  - 'SC-04 (both): title ''Website Traffic · heatmap-polar · bokeh · anyplot.ai''
    lacks the language segment → ''Website Traffic · heatmap-polar · python · bokeh
    · anyplot.ai''. Likely cause: the title string.'
  - 'Suggestion: spoke lines in a neutral ink token instead of PAGE_BG would read
    the same in both themes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on a 3600x3461 canvas.
      Chrome: small title 'Website Traffic · heatmap-polar · bokeh · anyplot.ai' with an italic subtitle 'Weekday peaks: 9 am & 8 pm · Weekend: afternoon plateau'; small INK_SOFT hour labels every 3 hours; white bold day labels Mon-Sun in the midnight cells; colorbar on the right edge with tiny 200-800 ticks; the colorbar runs off the bottom edge, its lowest tick label is chopped and its title is not visible.
      Data: 7 rings x 24 equal wedges in Viridis (purple low to yellow high), weekday peaks at 9am and 8pm, weekend afternoon rise; page-colored borders.
      Legibility verdict: PASS for contrast; text far below the style-guide sizes.

