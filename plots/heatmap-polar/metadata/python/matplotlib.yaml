review:
  strengths:
  - Clock-face orientation (set_theta_zero_location('N'), set_theta_direction(-1))
    makes the hour axis read like a clock, with 12am at the top and a seamless wrap
    across midnight
  - pcolormesh with theta/r edges and page-colored edgecolors tiles every ring in
    equal segments with borders that stay subordinate to the cell colors
  - imprint_seq on single-sign visit counts with a matching colorbar, identical in
    both themes; all chrome threaded through theme tokens
  - Tidy DataFrame with role-named column constants, pivoted with pivot_table(sort=False)
    so ring order and labels come from the data
  - Data shows weekday twin peaks (9am, 7pm) against a broad weekend 2pm peak, so
    the inner/outer ring contrast tells the story without annotation
  weaknesses:
  - 'VQ-02 (both): the seven boxed day labels sit on the 1am column at alpha 0.9 and
    hide most of that column''s cell colors in every ring → the label boxes leave
    the cells'' colors readable (smaller pad or a lower box alpha, so the hour-1 values
    can still be read). Likely cause: ax.text bbox with alpha=0.9 and pad=0.2 placed
    at label_angle = theta_edges[1] * 1.5 (lines 85–104).'
  - 'Suggestion: an hour tick every 3 hours (12am, 3am, 6am, …) would make the 9am
    and 7pm peaks easier to locate on the clock face.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: title 'Website Traffic · heatmap-polar · python · matplotlib · anyplot.ai' in dark ink at the top (~78% width); angular labels 12am (top), 6am (right), 12pm (bottom), 6pm (left) in INK_SOFT; day labels Mon (innermost) to Sun (outermost) in light rounded boxes along the 1am column; vertical colorbar on the right titled 'Hourly Visits' with ticks 100-800. All readable.
      Data: 7 rings x 24 hour segments around a hollow center, imprint_seq from #009E73 (low) to #4467A3 (high), thin off-white borders between cells. Inner five rings show blue peaks at ~9am and ~7pm; outer two rings peak blue around 1-4pm; nights are green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and colorbar label in light ink, hour labels and colorbar ticks in light grey INK_SOFT; day labels light text in dark elevated boxes; colorbar outline light grey. No dark-on-dark text.
      Data: cell colors identical to the light render (same green-to-blue ramp); cell borders flip to the dark page color.
      Legibility verdict: PASS
