review:
  strengths:
  - 'Faithful, statistically correct replication of R''s plot(lm) four-panel layout:
    hat-matrix leverage, studentized residuals, Cook''s distance, a hand-rolled inverse-normal-CDF
    for the Q-Q plot, and a Gaussian-kernel LOWESS smoother, all implemented without
    external stats packages.'
  - Consistent point styling and clear influential-point flagging (transparent red-ringed
    markers + observation-index text labels) applied identically across all four panels,
    precisely matching the spec's 'label the 2-3 most influential points' and 'consistent
    point styling' notes.
  - Theme-adaptive chrome is correctly threaded through every Axis (backgrounds, ink,
    grid, spines); both light and dark renders are legible with identical data colors
    and only chrome flipping.
  - 'Palette compliance: first series is Imprint #009E73, LOWESS trend uses ochre,
    flagged points use matte red, Cook''s distance contours use the documented semantic
    amber — all per the style guide''s semantic-exception rules.'
  - 'Realistic, neutral dose-response dataset engineered specifically to exercise
    every diagnostic panel: a plateauing non-linear mean, dose-dependent heteroscedastic
    noise, and injected high-leverage/large-residual points create genuine visual
    signal in all four subplots.'
  - 'Clean, reproducible script: fixed seed, only used imports (CairoMakie, Colors,
    Random, LinearAlgebra), no fake interactivity, correct plot-$(THEME).png save
    call with px_per_unit=2.'
  weaknesses:
  - 'Residuals vs Leverage panel (bottom-right): the ''D=1.0'' Cook''s-distance contour
    label sits directly on top of the dotted amber line it annotates, so the ''D''
    glyph is bisected by the line and reads like a struck-through ''Ð'' in both light
    and dark renders. Nudge that label''s offset further right/up (e.g. offset = (-2,
    10) instead of (-2, 3), or place it just past where the curve exits the axis)
    so the line clears the glyph; the ''D=0.5'' label a bit lower has more clearance
    and does not have this problem.'
  - Two hand-written helper functions (norm_quantile, lowess_smooth) are needed since
    Julia's base/allowed packages lack an inverse-normal-CDF and LOWESS, which is
    a reasonable justification, but it does move away from the strict single-flow
    KISS ideal — keep them as tightly scoped, clearly-separated math utilities as
    they are now if kept.
  - 'Library Mastery is solid but generic: only common Axis/scatter!/lines!/hlines!/text!
    primitives and a GridLayout-spanning Label are used. A genuinely Makie-distinctive
    touch (e.g. a shared Legend/Colorbar, linkyaxes! between the two ''Fitted Values''
    panels, or a Makie recipe) would raise this further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 across the full canvas and all four subplot backgrounds.
      Chrome: Bold dark title "diagnostic-regression-panel · julia · makie · anyplot.ai" is clearly readable at the top. Each of the four subplot titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage") is bold dark text, fully legible. Axis titles ("Fitted Values (% relief)", "Residuals", "Theoretical Quantiles", "Standardized Residuals", "Leverage", "√|Standardized Residuals|") are dark and legible. Tick labels are a softer dark gray, still clearly readable. Top/right spines are removed; left/bottom spines and gridlines are subtle warm-gray.
      Data: Green (#009E73) scatter points in all four panels — residuals vs fitted, Q-Q, scale-location, and residuals vs leverage. An ochre LOWESS trend line runs through panels 1 and 3. Observations 1, 9, and 43 (highest Cook's distance) are ringed in matte red and labeled with their index in every panel where they appear. Panel 4 shows two dotted amber Cook's-distance contour curves (D=0.5, D=1.0); the "D=1.0" label is bisected by the dotted line it names, a minor overlap.
      Legibility verdict: PASS (aside from the minor "D=1.0"/line overlap noted above, which is a VQ-02 overlap issue, not a legibility failure — the text is still readable).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 across the canvas and all subplot panels.
      Chrome: Title and all four subplot titles are rendered in light/off-white text, fully legible against the dark background. Axis titles are light-colored and legible; tick labels use a lighter soft gray, clearly distinguishable from the background — no dark-on-dark failures observed anywhere in the panel.
      Data: All data colors are identical to the light render — same brand green scatter, same ochre smoother, same matte-red rings/labels on observations 1, 9, 43, and the same amber dotted Cook's-distance contours with the same D=1.0/line overlap. Only the chrome (background, ink, grid, spines) flipped between renders, as required.
      Legibility verdict: PASS.
