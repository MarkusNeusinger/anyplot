review:
  strengths:
  - Faithful, complete replication of the classic R plot(lm) four-panel diagnostic
    layout, with every spec-required element present in every panel.
  - 'Consistent, semantically correct color usage: brand green for data, ochre for
    LOWESS trend, matte red for the 3 most-influential points (same indices, labeled
    identically across all four panels), and amber for Cook''s-distance warning contours.'
  - Well-constructed synthetic data that surfaces all four diagnostic failure modes
    simultaneously (heteroscedasticity, mild non-linearity, a high-leverage point,
    and a separate large-residual outlier) in a realistic pharma dose-response scenario.
  - Correct theme-adaptive chrome in both renders with identical data colors; no legibility
    failures in either theme.
  - Implements leverage/hat-matrix, standardized residuals, Cook's distance, a from-scratch
    Gaussian-kernel LOWESS smoother, and an Acklam normal-quantile approximation,
    all in pure Julia without extra statistics packages.
  weaknesses:
  - using Statistics is imported but never called anywhere in the script - remove
    it or use mean/std where the manual sum-based formulas currently stand in for
    it.
  - Tick-label font size (10pt, ~20px effective on the 2400px canvas) is smaller than
    ideal - bump xticklabelsize/yticklabelsize slightly (e.g., to 11-12) for more
    mobile-scale legibility.
  - Default tick marks remain visible on all four axes and grid lines run on both
    axes; trimming tick marks and/or narrowing to fewer gridlines would sharpen visual
    refinement.
  - markersize=11 could be nudged up slightly (e.g., to ~13) given n=90 sits toward
    the sparser end of the medium-density band.
  - The '9'/'43' labels sit quite close together in the Scale-Location and Residuals-vs-Leverage
    panels - a small manual vertical stagger would give them more breathing room.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold shared title "diagnostic-regression-panel · julia · makie · anyplot.ai" at top in dark ink; each of the 4 subplot titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage") in dark ink; axis titles in dark ink; tick labels in softer ink-gray; faint gridlines. All readable.
      Data: First/only categorical series rendered in brand green (#009E73) across all four panels; ochre LOWESS smoother lines in panels 1 and 3; amber dotted Cook's-distance contours labeled "D=0.5"/"D=1.0" in panel 4; matte-red circles + red index labels (1, 9, 43) consistently marking the same 3 most-influential points in every panel.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title and axis/tick text now rendered in light cream/off-white and soft light-gray tones; gridlines flipped to a faint light tint; dashed/dotted reference lines switched to light/amber tones as appropriate. All chrome elements clearly legible - no dark-on-dark failures found on any title, axis label, tick label, or contour label.
      Data: Confirmed pixel-identical hues to the light render for brand green, ochre, matte red, and amber - only the chrome (background, text, grid, spines) flipped between themes.
      Legibility verdict: PASS
