review:
  strengths:
  - gggrid composes the four ggplot panels into one 2x2 figure
  - Consistent point styling across panels with Imprint positions 1-4 for points,
    smoothers, reference and contours in both themes
  - LOWESS smoothers follow their own points; Q-Q points at their computed quantiles
  - Salary regression with injected influential observations gives every panel a diagnostic
    signal
  weaknesses:
  - 'VQ-05 (both): canvas is 2700x1800, matching neither 3200x1800 nor 2400x2400 →
    3200x1800 (+500 px width). Likely cause: ggsave scale=3 on the default gggrid
    size instead of ggsize(800, 450) with scale=4.'
  - 'VQ-05 (both): labels ''2'' (Residuals vs Fitted, Scale-Location) and ''14'' (Scale-Location)
    are cut by the top panel frame, and the 24 pt panel titles dominate the panels
    → keep labels inside the panel and bring panel titles to about 12 pt. Likely cause:
    nudge_y without y-scale expansion; plot_title size=24.'
  - 'VQ-02 (both): in the Normal Q-Q panel the ''14'' label sits on the reference
    line and ''123'' touches the upper-tail points → place each label clear of line
    and points. Likely cause: hard-coded nudge_y of +0.65/-0.55.'
  - 'VQ-07 (both): the gggrid outer background (credit strip and gutters) is pure
    white #FFFFFF, not #FAF8F1 / #1A1A17 → fill it with PAGE_BG. Likely cause: gggrid()
    theme without plot_background.'
  - 'SC-04 (both): the figure title is a small muted subtitle ''diagnostic-regression-panel
    · letsplot · anyplot.ai'', missing the ''python'' segment → a bold shared title
    ''diagnostic-regression-panel · python · letsplot · anyplot.ai''. Likely cause:
    labs(subtitle=CREDIT) on the grid.'
  - 'SC-02 (both): the Q-Q panel labels observations 2, 14 and 123 (largest |std residual|)
    instead of the top Cook''s distance observations 14, 2 and 1 labeled elsewhere
    (C5) → label the same observations in every panel. Likely cause: abs_rank from
    np.abs(sorted_std).'
  - 'SC-02 (both): the Cook''s contours carry no level and only the D=0.5 pair is
    visible (C4) → mark each with its level and show the D=1.0 pair. Likely cause:
    anonymous dashed groups clipped at std_lim.'
  - 'CQ-04 (code): lines 50-59 hand-roll the OLS fit, hat values, standardized residuals
    and Cook''s distance → statsmodels OLS(y, X).fit().get_influence(). Likely cause:
    manual linear algebra.'
  - 'Suggestion: dropping the axis lines would match the refined grid treatment.'
