review:
  strengths:
  - LOWESS smoothers from statsmodels follow their points in the residual and scale-location
    panels
  - gggrid assembles the four panels in a 2x2 grid
  - Consistent green point styling across all four panels
  - Theme tokens give readable text in both themes
  weaknesses:
  - 'VQ-05 (both): canvas is 2700x1800, matching neither 3200x1800 nor 2400x2400 →
    3200x1800 (+500 px width). Likely cause: ggsave scale=3 without ggsize(800, 450)
    on the grid.'
  - 'VQ-05 (both): labels ''2'' (Residuals vs Fitted, Scale-Location) and ''14'' (Scale-Location)
    are cut by the top panel frames, and the 24 pt bold panel titles dominate the
    panels → keep labels inside the panel with y-scale expansion and bring panel titles
    to about 12 pt. Likely cause: nudge_y without expansion; plot_title size=24.'
  - 'VQ-02 (both): in the Normal Q-Q panel the ''14'' label sits on the reference
    line, ''123'' touches the upper-tail points, and in Residuals vs Fitted the ''1''
    label sits on the smoother → clear each label of lines and points. Likely cause:
    hard-coded nudge_x/nudge_y offsets.'
  - 'VQ-07 (both): the gggrid gutters and title strip are pure white #FFFFFF instead
    of #FAF8F1 / #1A1A17 → fill the composite with PAGE_BG. Likely cause: gggrid()
    without theme(plot_background=...).'
  - 'SC-04 (both): the figure title is a small muted subtitle ''diagnostic-regression-panel
    · letsplot · anyplot.ai'' missing the ''python'' segment → a shared title ''diagnostic-regression-panel
    · python · letsplot · anyplot.ai''. Likely cause: labs(subtitle=CREDIT) on the
    grid.'
  - 'SC-02 (both): the Q-Q panel labels observations 2, 14 and 123 (largest |std residual|)
    instead of the top Cook''s distance observations 1, 2, 14 labelled elsewhere (C5)
    → label the same observations in every panel. Likely cause: abs_rank from np.abs(sorted_std).'
  - 'SC-02 (both): the Cook''s contours carry no level and only the D = 0.5 pair is
    visible (C4) → label each contour with its level and extend the leverage range
    so the D = 1 pair shows. Likely cause: anonymous dashed groups, h_seq ending at
    1.25 × max leverage.'
  - 'DQ-03 (both): fitted log(Salary) runs from about −9 to 16, a range no log salary
    takes → generate the response on a realistic log scale. Likely cause: y = 3.0
    + 2.0*x1 - 1.2*x2 + noise with outliers at 16 and 19.'
  - 'CQ-04 (code): lines 47-59 hand-roll the OLS fit, hat values, standardized residuals
    and Cook''s distance → statsmodels OLS(y, X).fit().get_influence(). Likely cause:
    manual linear algebra.'
  - 'Suggestion: smaller observation labels (geom_text size 4-5 instead of 12) would
    sit more lightly on the panels.'
  image_description: |-
