review:
  strengths:
  - All four diagnostic panels under one pygal-rendered shared title in the mandated
    format, same point styling throughout
  - Cook's distance contours mirrored above and below zero, one color per level, labeled
    inline by level
  - print_values with a formatter puts the observation index beside each influential
    point in every panel
  - 'Theme tokens threaded through the Style object: both renders fully readable,
    data colors identical'
  - Native SVG panels nested into one 3200x1800 composite; interactive HTML grid alongside
  weaknesses:
  - 'VQ-02 (both): the ''Cook''s D = 0.5'' and ''Cook''s D = 1'' labels sit on their
    contour lines, which strike through the text → place each label clear of its line
    (at least ~10 px above it). Likely cause: the label is attached to the first upper
    contour point with print_values_position=''top'', which lands on the descending
    curve.'
  - 'VQ-05, SC-02 (both): in Residuals vs Fitted and Scale-Location the label of observation
    19 (the point at the largest fitted value) is cut at the panel''s right edge and
    reads ''1'' → keep the whole index inside the panel. Likely cause: the point sits
    at the x-axis maximum with margin=20 and the nested <svg> clips the overflow;
    pad the x range (xrange) or widen margin_right.'
  - 'CQ-01 (code): four helper functions (make_style, line_xy, panel, nested) → inline
    the single-use ones (nested, line_xy) and keep at most one panel builder. Likely
    cause: function-based structure instead of flat script.'
  - 'Suggestion: the empty right half of the leverage panel beyond the data could
    be tightened by ending the contour grid closer to the maximum leverage.'
