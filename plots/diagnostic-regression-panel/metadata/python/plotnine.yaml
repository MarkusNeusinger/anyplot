review:
  strengths:
  - All four classic diagnostic panels computed correctly, with the top-3 Cook's distance
    observations labelled in every panel including the Q-Q panel
  - Cook's distance contours mirrored around zero and labelled by level (D = 0.5,
    D = 1)
  - Q-Q quantiles mapped back to each observation by rank, so highlighted points and
    labels sit on their own points
  - Both renders theme-correct with Imprint colours identical between light and dark
  - Idiomatic facet_wrap(scales='free') composition with per-layer panel-routed data
    frames
  weaknesses:
  - 'VQ-06 (both): labs(x='''', y='''') leaves all four panels without axis titles
    (Fitted values, Residuals, Theoretical quantiles, Standardized residuals, sqrt(|Standardized
    residuals|), Leverage) → a per-panel x and y description. Likely cause: the empty
    labs() with facet_wrap; put the axis names into the strip text or use per-panel
    labels.'
  - 'VQ-02 (both): in the Normal Q-Q panel the ''99'' label sits on top of the dense
    point band near (-1.2, -0.9), and each Cook''s dotted contour starts on the ''D''
    of its own ''D = 0.5''/''D = 1'' label → labels clear of points and lines by a
    few px. Likely cause: va=''bottom'', ha=''left'' with no offset for the obs labels;
    contour label x at h_grid[keep][0], exactly the curve start.'
  - 'VQ-01 (both): the Cook''s contour labels at geom_text size 5 read noticeably
    smaller than the 8 pt tick labels → about the tick size (+1 to +2). Likely cause:
    geom_text(data=df_cook_labels, size=5).'
  - 'CQ-01 (code): an on_panel() helper function wraps a one-line assign → inline
    the panel column. Likely cause: def on_panel(frame, name).'
  - 'CQ-04 (code): lines 72-87 hand-roll the OLS fit, hat matrix, standardized residuals
    and Cook''s distance that statsmodels, already imported, computes → sm.OLS(strength,
    design).fit().get_influence() (hat_matrix_diag, resid_studentized_internal, cooks_distance[0]).
    Likely cause: manual linear algebra.'
  - 'Suggestion: the LOWESS smoothers share the purple of the highlighted influential
    points; a neutral ink smoother would keep purple meaning ''influential'' only.'
