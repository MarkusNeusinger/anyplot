  weaknesses:
  - 'VQ-05 (both): the saved canvas is 4733x2655 px, not one of the canonical sizes
    → 3200x1800 (−1533 × −855 px). Likely cause: figsize=(16, 9) with savefig(dpi=300,
    bbox_inches=''tight'').'
  - 'VQ-02 (both): the obs-42 label in the Scale-Location panel runs into the panel
    title, and in the Residuals vs Fitted panel it touches the title row → keep labels
    inside the axes, clear of titles (smaller offset or more y headroom). Likely cause:
    annot_kw xytext=(14, 10) on the topmost point with default y limits.'
  - 'VQ-02 (both): the leverage-panel legend box covers the Cook''s D = 0.5 and 1.0
    contours near the upper right → a spot no contour or point crosses. Likely cause:
    legend(loc=''upper right'').'
  - 'SC-04 (both): the title reads ''diagnostic-regression-panel · seaborn · anyplot.ai''
    without the language → ''diagnostic-regression-panel · python · seaborn · anyplot.ai''.
    Likely cause: the suptitle string.'
  - 'CQ-01 (code): the file has no column-0 # Data marker → one block between column-0
    # Data and # Plot markers that ends by binding df. Likely cause: the data generation
    is not marked as one block.'
  - 'CQ-01 (code): no column constant for the roles fitted, residuals, std_residuals,
    leverage, cooks_d → one string constant per role above the Data block with a #
    role: comment. Likely cause: column names typed where they are used.'
  - 'CQ-04 (code): the eight-line axis styling block (labels, title, tick_params,
    despine, spine colors, grid) is repeated for all four axes, lines 83–90, 102–109,
    117–124, 151–158 → one loop over axes.ravel(). Likely cause: per-subplot copy-paste.'
  - 'CQ-05 (code): savefig uses dpi=300 and bbox_inches=''tight'', which the seaborn
    prompt forbids → savefig(f''plot-{THEME}.png'', dpi=400) with figsize=(8, 4.5).
    Likely cause: the save call.'
  - 'Suggestion: use sns.residplot(lowess=True) for the residuals-vs-fitted panel.'
