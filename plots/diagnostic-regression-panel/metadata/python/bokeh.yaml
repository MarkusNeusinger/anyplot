review:
  strengths:
  - Theme tokens threaded through every element; no dark-on-dark text
  - 'Statistics computed properly: hat matrix, studentized residuals, Cook''s D, probplot
    quantiles, LOWESS'
  - 'Imprint palette order respected: green points, purple smoothers, blue contour'
  weaknesses:
  - 'AR-09, VQ-05 (both): the bottom edge of the lower two panels is cut off by the
    canvas, so the x-axis tick labels and the titles ''Fitted values'' and ''Leverage''
    are missing → keep the whole grid inside the canvas. Likely cause: the Selenium
    window size W_SCR x H_SCR does not match the layout height.'
  - 'VQ-05 (both): the canvas is 4800x2611 instead of 3200x1800, with an empty header
    band and a stray Bokeh toolbar logo at the top right → 3200x1800 and toolbar_location=None
    on the gridplot. Likely cause: W_SCR/H_SCR and gridplot(..., merge_tools=False)
    without toolbar_location=None.'
  - 'VQ-01, DE-01 (both): the figure title is a 28px Div, smaller than the 22pt panel
    titles, and the ticks are 15pt on a 4800px canvas, far below the 34pt bokeh reference
    → title about 56px, ticks about 26pt (+11pt). Likely cause: the Div font-size
    and major_label_text_font_size=''15pt''.'
  - 'SC-02 (both): only the upper Cook''s 0.5 contour enters the leverage panel; the
    1.0 contour and the mirrored lower contours are not visible → draw both levels
    above and below zero within the y-range. Likely cause: the y-range and the contour
    leverage grid.'
  - 'SC-04 (both): the title ''diagnostic-regression-panel · bokeh · anyplot.ai''
    lacks the language segment → ''diagnostic-regression-panel · python · bokeh ·
    anyplot.ai''. Likely cause: the Div text.'
  - 'VQ-03 (both): points at size 9 and the legend glyph come out tiny on the 4800px
    canvas → about size 10 on a 3200px canvas. Likely cause: the oversized canvas.'
  - 'VQ-02 (both): in the Scale-Location panel the label ''1'' sits on a neighbouring
    point instead of beside obs 1 → offset it clear of other marks. Likely cause:
    the fixed Label offsets.'
  - 'CQ-04 (code): the same figure and axis styling block is copied for each of the
    four panels (about 160 lines) → one loop over the panel specs. Likely cause: the
    per-panel p1..p4 blocks.'
  - 'DE-02 (both): every panel keeps a full box outline → outline_line_color=None
    for the L-frame. Likely cause: outline_line_color=INK_SOFT.'
  - 'Suggestion: a ColumnDataSource with a HoverTool would show observation index
    and Cook''s distance in the HTML.'
