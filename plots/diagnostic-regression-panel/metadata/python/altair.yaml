review:
  strengths:
  - Real OLS diagnostics (studentized residuals, hat values, Cook's distance) with
    planted outliers flagged in every panel
  - LOWESS smoothers in panels 1 and 3 and a mirrored Cook's contour with detail-encoded
    branches
  - Theme tokens throughout; both renders readable
  weaknesses:
  - 'VQ-05 (both): the saved canvas is 5073×3144, not one of the canonical sizes →
    3200×1800 (−1873 × −1344). Likely cause: scale_factor=3.0 on oversized views with
    no pad-to-target step.'
  - 'VQ-02 (both): the fitted-value tick labels of Residuals vs Fitted and Scale–Location
    run together (''120,000160,000200,000…''), and the Q-Q ticks ''−3.0'' and ''−2.6''
    touch → ticks at least one label width apart (about 5 per axis). Likely cause:
    default tick count on a zero-based fitted-value scale at this width.'
  - 'SC-02 (both): only the D = 0.5 Cook''s contour enters the leverage panel; D =
    1.0 never shows, so the contours are not identifiable as two levels → extend the
    leverage domain until the D = 1.0 contour enters the residual range. Likely cause:
    the leverage axis ends at about 0.08.'
  - 'SC-04 (both): the title reads ''diagnostic-regression-panel · altair · anyplot.ai''
    without the language → ''diagnostic-regression-panel · python · altair · anyplot.ai''.
    Likely cause: the title string.'
  - 'VQ-06 (both): ''Fitted Values'' and ''Residuals'' carry no unit for a house-price
    model → ''Fitted price ($)'' and ''Residual ($)''. Likely cause: the axis title
    strings.'
  - 'CQ-01 (code): no column constants for the roles fitted, residuals, std_residuals,
    leverage, cooks_d and no # Data / # Plot block markers → one string constant per
    role above a marked Data block. Likely cause: column names typed where used.'
  - 'Suggestion: set zero=False on the fitted-value scales so the points fill the
    panel width.'
  - 'Suggestion: larger, bolder outlier labels in INK instead of INK_MUTED would read
    more clearly.'
