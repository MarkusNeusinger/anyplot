review:
  strengths:
  - 'Faithfully replicates R''s plot(lm) four-panel layout: Residuals vs Fitted (with
    LOWESS), Normal Q-Q (with 45-degree reference), Scale-Location (with LOWESS),
    and Residuals vs Leverage with manually derived Cook''s distance contours (D=0.5,
    D=1.0).'
  - Uses statsmodels' OLS + get_influence() for real studentized residuals, hat-matrix
    leverage, and Cook's distance rather than approximating them by hand — genuine
    library mastery.
  - The same top-3 influential observations (by Cook's distance) are consistently
    ring-highlighted and index-labeled across all four subplots, using one shared
    point_kw/highlight_kw/label_kw style dictionary.
  - 'Synthetic dose-response dataset is purpose-built to exercise every diagnostic:
    mild non-linearity (quadratic term), heteroscedastic noise scaling with dose,
    and three deliberately injected influential points, so all four panels show meaningful,
    non-trivial patterns.'
  - 'Clean theme handling: PAGE_BG/INK/INK_SOFT/INK_MUTED tokens threaded through
    facecolor, title, labels, ticks, spines and grid; Imprint palette used correctly
    (brand green primary series, palette-position-2 purple for LOWESS, amber semantic
    anchor for Cook''s D warning contours) and identical across light/dark.'
  - Square 2400x2400 canvas is a well-reasoned choice for this symmetric 2x2 grid,
    and the mandated title scales its fontsize by the exact title-string length as
    documented in the library rules.
  - Single flat script, no functions/classes, np.random.seed(42) for reproducibility,
    only used imports — clean KISS code.
  weaknesses:
  - 'Normal Q-Q panel: the influence label for observation 7 (the point nearest the
    bottom-left corner, at theoretical quantile ~-2.5) uses the fixed offset (-15,
    5) from label_offsets, which pushes the text left into the y-axis spine''s corner
    and directly on top of the x-axis ''-2'' tick mark. The digit collides with the
    tick line and renders as an illegible fused glyph (looks like ''7|''), unlike
    the same point''s label in the other three subplots where it reads cleanly. Fix:
    either give this corner point a different offset (e.g. (10, 10), up-and-right,
    away from the axis corner) or compute per-point offsets that push away from whichever
    axis edge the point is closest to, instead of reusing one fixed offset triple
    keyed only by Cook''s-distance rank across all four subplots.'
  - 'Design Excellence: data storytelling (DE-03) is solid but stays at the level
    of ''careful replication of the standard R diagnostic layout'' rather than adding
    an extra layer of visual hierarchy beyond ring-highlighting (e.g. color- or size-coding
    the influential points by their actual Cook''s distance value rather than uniform
    ring styling).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Title "diagnostic-regression-panel · python · matplotlib · anyplot.ai" fully visible at top, dark ink, not clipped. Each of the four subplot titles (Residuals vs Fitted, Normal Q-Q, Scale-Location, Residuals vs Leverage), axis labels, and tick labels render in dark ink (INK/INK_MUTED) against the light surface — all clearly legible. Grid lines are subtle horizontal gray lines, visible but not dominant. Top/right spines removed on every panel; left/bottom spines a soft dark gray.
      Data: First (and only) categorical series is brand green (#009E73) at alpha 0.6 with light-bg-colored edges to separate overlapping points. LOWESS trend lines in the Imprint position-2 purple (#C475FD). Cook's distance contour lines and their "D=1"/"D=0.5" labels in the amber semantic anchor (#DDCC77). The three most-influential points (indices 33, 43, 7) are ring-highlighted and index-labeled in every subplot; labels are legible except for point 7 in the Normal Q-Q panel, where the label collides with the x-axis "-2" tick mark (see weaknesses) — this is a localized overlap defect, not a background/text-color legibility failure.
      Legibility verdict: PASS (the one flagged issue is an overlap collision, not unreadable text against the background).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black.
      Chrome: Title and all subplot titles/axis labels/tick labels render in light ink (INK/INK_MUTED tokens flipped for dark theme) — clearly readable against the dark surface, no dark-on-dark failures anywhere. Grid lines are subtle light-gray horizontal lines. Spines and dashed reference lines correctly flip to lighter tones (e.g. the QQ 45-degree reference line and zero-reference lines are light gray/off-white instead of the light theme's darker gray).
      Data: Data colors are pixel-identical to the light render — brand green points, purple LOWESS lines, amber Cook's distance contours all unchanged, confirming only chrome (not data) flips between themes. Same localized label/tick-mark overlap for point 7 in the Normal Q-Q panel, present identically in both themes (a code-level offset issue, not theme-specific).
      Legibility verdict: PASS (no dark-on-dark text; the flagged issue is the same cross-theme overlap noted above, not a dark-mode-specific readability failure).
