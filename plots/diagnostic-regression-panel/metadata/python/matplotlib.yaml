review:
  strengths:
  - 'Excellent Imprint palette compliance and theme-adaptive chrome — brand green
    #009E73 for data, lavender #C475FD (position 2) for LOWESS smoothers, and amber
    #DDCC77 used deliberately as the semantic warning anchor for Cook''s distance
    contours; both light and dark renders are fully theme-correct.'
  - 'Comprehensive spec coverage: all four canonical diagnostic subplots (Residuals
    vs Fitted, Normal Q-Q, Scale-Location, Residuals vs Leverage), zero-reference
    line, LOWESS smoothers, 45-degree Q-Q reference line, and Cook''s distance contours
    at D=0.5/1.0 with inline labels.'
  - The 3 most influential observations (by Cook's distance) are consistently labeled
    with the same index across all four subplots, letting the reader trace the same
    outliers through every diagnostic view.
  - Clean, idiomatic axes-level matplotlib code (explicit fig/axes, shared point_kw/label_kw
    dicts for consistent styling, spines removed, subtle y-axis grid) with correct
    2400x2400 square canvas for the grid-based layout.
  - Realistic, appropriately-scaled dose-response dataset with deliberately engineered
    heteroscedasticity, mild non-linearity, and influential/high-leverage points —
    covers the full diagnostic feature space (DQ-01).
  - Reproducible (np.random.seed(42)), KISS single-pass structure, clean imports,
    correct plot-{THEME}.png output.
  weaknesses:
  - Scatter marker size s=45 is slightly below the density-appropriate range (50-100)
    for n=120 points on VQ-03's sizing guidelines — bump to ~60 for a touch more prominence
    without adding clutter.
  - The three influential-point labels (33/43/7) cluster tightly at the top of the
    Scale-Location subplot with only a small offset — stagger the annotate offsets
    further apart (or add short leader lines) to reduce crowding risk.
  - 'Data storytelling (DE-03) is good but not yet exceptional: the flagged influential
    points are distinguished only by a small text label, with no visual emphasis (e.g.,
    a thin ink-color outline or slightly larger marker) on the points themselves —
    adding that would make the cross-panel narrative pop immediately.'
  - Design excellence is already above generic defaults via the semantic color choices,
    but typographic hierarchy between the shared figure title, subplot titles, and
    axis labels could be sharpened further (e.g., slightly bolder/larger subplot titles)
    to push toward publication-level polish.
