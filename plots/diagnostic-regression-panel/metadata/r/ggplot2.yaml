      Background: warm off-white, matches #FAF8F1
      Chrome: title "diagnostic-regression-panel · r · ggplot2 · anyplot.ai" and all four subplot titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage"), axis titles, and tick labels render in dark ink — all clearly readable
      Data: green (#009E73) observation points, matte-red (#AE3030) top-3 Cook's-distance outliers (labeled 137, 16, 128), blue (#4467A3) LOESS trend line, amber (#DDCC77) Cook's-distance contours labeled D=0.5/D=1.0 in panel 4
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title, subplot titles, axis titles, and tick labels flip to light ink (#F0EFE8/#B8B7B0); grid lines flip to faint light lines; caption text flips to light gray — no dark-on-dark failures found
      Data: colors are identical to the light render (green, matte-red, blue, amber) — confirmed no shift
      Legibility verdict: PASS

    Both renders additionally checked at the 400px mobile-scaled thumbnail — title, subplot titles, axis labels, tick labels, and the D=0.5/D=1.0 contour labels all remain legible in both themes. No AR-09 edge clipping found in either render; no canvas-dimension gate file present (2400x2400 confirmed).
