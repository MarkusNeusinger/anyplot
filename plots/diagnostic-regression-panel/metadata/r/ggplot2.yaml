review:
  strengths:
  - Deliberately misspecified regression (quadratic true relationship + heteroscedastic
    noise) produces textbook-realistic diagnostic patterns in all four panels rather
    than a clean/uninteresting fit
  - Cook's-distance contour math (D=0.5 and D=1.0 curves) is correctly derived and
    both curves are guaranteed visible via the y-axis floor calculation
  - Influential-point labels (137, 16, 128) are consistently identified and displayed
    across all four subplots with collision-avoiding nudge + vjust staggering
  - Theme-adaptive chrome correctly implemented — light/dark renders are pixel-identical
    in data colors, only chrome flips
  - Legible even at the 400px mobile-scaled thumbnail in both themes
  weaknesses:
  - Densest region of the residual scatter (around fitted ≈ 1500-2000) still shows
    moderate marker overlap despite alpha=0.6 — could tighten alpha slightly or reduce
    point size marginally in that regime
  - Design Excellence is solid but not exceptional — the four-panel layout is functional
    and clean but doesn't add extra visual hierarchy beyond the red/green/blue/amber
    color coding
  - LOESS smoother is a fairly standard technique available in most plotting libraries;
    the ggplot2-distinctive element is really the grid-graphics composition (arrangeGrob/textGrob),
    which could be leaned into further for a stronger Library Mastery showing
  image_description: |-
