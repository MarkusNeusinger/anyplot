review:
  strengths:
  - Faithful, well-organized recreation of R's classic plot(lm) 2x2 diagnostic layout
    — all four required subplots (Residuals vs Fitted, Normal Q-Q, Scale-Location,
    Residuals vs Leverage) present with correct statistics (LOESS smoother, standardized
    residuals, Cook's distance contours)
  - 'Thoughtful semantic color use: brand green for routine observations, semantic
    red (Imprint position 5) for the top-3 influential points, and the amber warning
    anchor for Cook''s distance threshold lines — exactly matching the style guide''s
    intended semantic roles'
  - Deliberately misspecified linear fit (mild curvature + heteroscedastic noise)
    produces realistic diagnostic signal (visible curvature in the LOESS smoother,
    fanning residual spread) instead of a trivially clean textbook fit — strong feature
    coverage
  - Both themes correctly flip chrome tokens (background, ink, grid) while keeping
    all data colors identical — no dark-on-dark or light-on-light failures in either
    render
  - Clean, explicit theme system (anyplot_theme) applied consistently across all four
    ggplot objects, with subtle alpha-based gridlines and minimal spines
  weaknesses:
  - 'Panel 4 (Residuals vs Leverage): only the D=0.5 Cook''s distance contour is visible/labeled
    — the D=1.0 threshold curve falls outside the plotted y-range given this dataset''s
    leverage values, so the label filter silently drops it without explanation. Widen
    y_limit slightly further or add a caption note confirming no observation approaches
    D=1.0'
  - Index labels for the top-3 Cook's-distance points ('16' and '128') sit very close
    together in panels 1, 3, and 4 — nudge_fitted/nudge_leverage spread them by rank,
    but the underlying fitted/leverage values for these two points are close enough
    that the labels still visually cluster. Increase label_spread or use a perpendicular
    (vjust) offset instead of purely horizontal nudging
  - point_size=2.1 is slightly below the 2.5 starting value recommended in prompts/library/ggplot2.md
    for this observation count — a small bump would give a touch more presence once
    scaled down to a 400px mobile thumbnail
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "diagnostic-regression-panel · r · ggplot2 · anyplot.ai" in dark ink, fully visible and not clipped. Each of the four panel titles (Residuals vs Fitted, Normal Q-Q, Scale-Location, Residuals vs Leverage) is dark and legible. Axis titles and tick labels render in dark/soft-dark ink respectively, all clearly readable against the light surface. Grid lines are faint, subtle, non-competing. Bottom caption text (green/red/blue/amber color key) is soft-dark and readable.
      Data: Routine observations are brand green (#009E73) with alpha blending for overlap; the three highest-Cook's-distance points (137, 16, 128) are highlighted in semantic red and labeled with their observation index in every panel; LOESS/45° reference lines render in blue (Imprint position 3); the Cook's distance contour in panel 4 is amber, dashed, labeled "D=0.5" in the upper-right corner.
      Legibility verdict: PASS — no light-on-light text found; all titles, axis labels, tick labels, and annotations read clearly.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title and four panel titles now render in light ink (#F0EFE8-equivalent), fully legible against the dark surface. Axis/tick labels use the lighter soft-ink tone. Grid lines are faint and subtle, visible but not dominant. Caption text at the bottom is legible in soft light ink.
      Data: Identical data colors to the light render — brand green routine points, semantic red for the three flagged influential points (137, 16, 128) with matching index labels, blue LOESS/reference lines, amber dashed "D=0.5" Cook's distance contour. No hue shifted between themes.
      Legibility verdict: PASS — no dark-on-dark failures; every title, label, and annotation is clearly readable against the dark background, and the brand green + semantic red + amber remain visible and distinguishable on the dark surface.
