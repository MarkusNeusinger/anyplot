review:
  strengths:
  - 'Correct, from-scratch statistics: OLS regression, hat-matrix leverage, studentized
    residuals, Cook''s distance, and Acklam''s inverse-normal-CDF approximation for
    the Q-Q plot — all mathematically sound with no shortcuts.'
  - 'Consistent influential-point labeling: the same 3 highest-Cook''s-distance observations
    (#47, #73, #78) are identified once and reused across all four panels via shared
    indices, exactly as the spec asks.'
  - 'Correct semantic color use: influential points use the matte-red semantic anchor
    (palette[4]) per the style guide''s ''bad/error/influence'' exception, while ordinary
    points stay brand green (palette[0]) — first-series rule respected.'
  - 'Clean theme-adaptive chrome: title, axis titles, tick labels, gridlines, and
    Cook''s-distance contour labels all pull from ANYPLOT_TOKENS and remain fully
    legible on both the light and dark renders.'
  - Cook's distance contours (D=0.5, D=1.0) are computed correctly and labeled at
    the correct relative positions (D=1.0 farther from the zero-line than D=0.5),
    with textOutline halos preventing label-on-line illegibility.
  - Realistic, neutral agricultural dataset (fertilizer vs. yield with diminishing
    returns and heteroscedastic noise) gives every diagnostic plot genuine signal
    to reveal instead of pure noise.
  weaknesses:
  - Scatter panels only render horizontal gridlines; the style guide recommends grid
    on both axes for scatter-type plots — add subtle vertical gridlines (same t.grid
    color/opacity) to xAxis in baseOptions.
  - The implementation leans on many helper functions (lcg, randNormal, lowess, cookContour,
    scatterPoints, baseOptions, labelLast, normInv) — necessary given the from-scratch
    statistics, but consider inlining the smallest ones (e.g. normInv could stay top-level
    but randNormal/lcg could be one combined generator) to reduce indirection for
    a 'no functions/classes' ideal.
  - 'Highcharts'' interactivity is fully disabled (tooltip: enabled:false, enableMouseTracking:false)
    across all four panels — for a static diagnostic grid this is a defensible call,
    but consider enabling tooltips in the HTML output (they don''t affect the PNG)
    so the interactive detail view still lets a reader inspect exact fitted/residual/leverage
    values per point.'
  - Panel-level titles ('Residuals vs Fitted', 'Normal Q-Q', etc.) sit close in size
    to the shared header — increasing the visual weight gap between the header (22px)
    and panel titles (currently 16px) slightly would sharpen the hierarchy, though
    current sizes are already legible and not overlapping.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), matches the required light-theme surface — not pure white.
      Chrome: Bold dark title "diagnostic-regression-panel · javascript · highcharts · anyplot.ai" top-left, four bold dark panel titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage"), dark axis titles and tick labels, subtle light-gray horizontal gridlines. All chrome text reads clearly against the light background.
      Data: First-series points are brand green (#009E73) diamonds across all four panels; the 3 most influential observations (#47, #73, #78) are enlarged matte-red diamonds with black text labels haloed for legibility. The LOWESS smoother in panels 1 and 3 is a blue (#4467A3) spline. Panel 4's Cook's-distance contours are a gray dashed pair (D=0.5) and an amber dashed pair (D=1.0), each labeled on the right edge without clipping.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere; all four panels are clean and readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: The same title and four panel titles now render in light/white text, axis titles and tick labels flip to light gray, gridlines flip to a subtle light-on-dark tone. No dark-on-dark failures observed — every title, axis label, and tick label is clearly legible against the dark surface.
      Data: Green diamonds, red influential-point diamonds, blue LOWESS spline, and gray/amber Cook's-distance contour lines are pixel-identical in hue to the light render — only the chrome (background, text, grid) flipped, exactly as required.
      Legibility verdict: PASS — all text and data elements are clearly distinguishable from the dark background; brand green and matte red both remain visible.
