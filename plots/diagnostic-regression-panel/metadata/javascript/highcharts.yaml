review:
  strengths:
  - Data is deliberately generated to violate regression assumptions (diminishing-returns
    curvature + heteroscedastic noise scaling with x), giving every diagnostic panel
    something genuine to reveal.
  - 'Correct statistical machinery implemented from scratch: LOWESS via tricube-weighted
    local linear regression, Acklam''s inverse-normal-CDF approximation for the Q-Q
    plot, hat-value leverage, and Cook''s distance.'
  - 'Thoughtful semantic color use: red (palette[4]) for influential points and amber
    for the more severe Cook''s-D=1.0 threshold, matching the style guide''s semantic-exception
    guidance.'
  - Consistent shared point styling (diamond marker, same size/fill rules) across
    all four subplots as the spec requests.
  - 'Both renders are fully theme-correct: identical data-ink colors, correctly flipped
    chrome, no legibility failures.'
  weaknesses:
  - 'In the Normal Q-Q panel all three influential points (#47, #78, #73) are labeled,
    but panels 1, 3, and 4 only show two red diamonds/labels (#47 and #73) -- #78''s
    label/marker appears hidden by Highcharts'' default overlap-avoidance since it
    sits close to another influential point in that panel''s coordinate space. Force
    all three influential labels visible in every panel (e.g. dataLabels.allowOverlap:
    true, or per-point y-offset nudges).'
  - Axis titles (13px) and tick labels (12px) sit slightly below the Highcharts guide's
    suggested CSS baseline (axis titles ~16px, tick labels ~14px) given each 2x2 quadrant
    renders at roughly a full single-chart's device-pixel size -- bump axis titles
    to ~14-15px and tick labels to ~13-14px for better mobile-width legibility.
  - Contour line labels ("0.5", "1.0") in the Residuals vs Leverage panel sit right
    at the data's right edge -- add a touch more right-side padding/xAxis.max headroom
    so they never crowd the panel boundary as data ranges shift.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Shared bold header "diagnostic-regression-panel · javascript · highcharts · anyplot.ai" plus four per-panel dark-ink titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage"). Axis titles and tick labels in soft ink, all readable.
      Data: Base points are green (#009E73) diamonds; 2-3 most-influential points (by Cook's distance) render as larger red (#AE3030) diamonds with "#NN" index labels. Panels 1 and 3 carry a blue LOWESS smoother; panel 2 a dashed 45-degree reference line; panel 4 carries dashed grey (D=0.5) and amber (D=1.0) Cook's-distance contours with inline labels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Header, panel titles, axis titles, tick labels, and grid lines all correctly flip to light ink / soft-light tones. No dark-on-dark failures observed anywhere.
      Data: Colors are identical to the light render -- same green base markers, red influential-point diamonds, blue LOWESS line, and amber D=1.0 contour. Only chrome changed.
      Legibility verdict: PASS
