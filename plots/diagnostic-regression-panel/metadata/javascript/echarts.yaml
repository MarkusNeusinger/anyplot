review:
  strengths:
  - 'Repair loop directly addressed the prior VQ-03 finding: the Residuals vs Leverage
    panel now uses symbolSize 11 / opacity 0.65 (down from 15 / 0.8), visibly reducing
    marker fusion in the dense low-leverage cluster while the other three panels keep
    prominent, clearly separated markers appropriate for ~80 points.'
  - Complete, correct implementation of all four canonical regression diagnostic plots
    (Residuals vs Fitted with LOWESS + zero line, Normal Q-Q with 45-degree reference,
    Scale-Location with LOWESS, Residuals vs Leverage with Cook's distance D=0.5/1.0
    contours).
  - 'Deliberate, semantic use of the Imprint palette: brand green for all data points,
    blue (palette[2]) for LOWESS smoothers, amber reserved specifically for the more
    severe D=1.0 Cook''s-distance threshold vs. muted gray for D=0.5 — a genuine warning-severity
    distinction rather than an arbitrary color pick.'
  - 'Consistent labeling of the same 3 most-influential observations (#78, #29, #80)
    by Cook''s distance across all four subplots, letting a reader track one influential
    point across every diagnostic view.'
  - Fully deterministic, seeded synthetic data (custom LCG + Box-Muller Gaussian)
    with a crafted heteroscedastic, mildly curved regression plus one genuinely influential
    high-leverage point and one high-leverage-but-not-influential point — a textbook-quality
    diagnostic story.
  - Both light and dark renders are fully legible with theme-correct chrome (title,
    subplot titles, axis names, tick labels, gridlines) and identical data colors
    between themes.
  weaknesses:
  - 'DE-01: Aesthetic polish is solid but still stops short of exceptional — there
    is no brief caption/annotation on any panel clarifying what it diagnoses (e.g.
    ''flat LOWESS = linearity OK''), which would help readers unfamiliar with regression
    diagnostics extract more value from the composite view.'
  - 'CQ-01: The statistical helper functions (LCG PRNG, Box-Muller Gaussian, Acklam''s
    qnorm approximation, custom LOWESS, Cook''s-distance contour solver) remain the
    most code-heavy part of this implementation. This is justified by the absence
    of a stats library in the browser runtime and was not meaningfully reduced by
    this repair pass (only reformatted) — acceptable, but still a complexity outlier
    relative to sibling JS implementations.'
  - 'Residuals vs Leverage panel: even after the marker-size/opacity fix, the tight
    low-leverage cluster (leverage < 0.02) still has some marker overlap simply due
    to data density — inherent to the data rather than a styling defect, but a reader
    zooming into that region loses individual-point resolution.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Main title "diagnostic-regression-panel · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Four subplot titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage") in medium-weight dark text above each quadrant, fully legible. Axis names (Fitted values, Residuals, Theoretical Quantiles, Standardized Residuals, √|Standardized Residuals|, Leverage) and numeric tick labels render in a softer dark gray, all readable against the light background. Gridlines are thin and subtle.
      Data: All four panels use the same green (#009E73) circular markers, with the Residuals vs Leverage panel now using a visibly smaller/more transparent marker (symbolSize 11, opacity 0.65) than the other three panels (symbolSize 15, opacity 0.8) — a deliberate fix for the previously-flagged marker-merging issue in that denser panel. Subplots 1 and 3 show a blue LOWESS smoother line with an inline "LOWESS" end-label. Subplot 1 has a dashed muted-gray zero-reference line. Subplot 2 has a dashed muted-gray 45-degree reference line tracking the point cloud closely (near-normal residuals with light tail deviation). Subplot 4 shows two pairs of dashed Cook's-distance contour lines — gray for D=0.5, amber for D=1.0 — bracketing the point cloud, with inline end-labels. The three most influential points are consistently labeled #78, #29, #80 in bold dark text across all four panels.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-label/tick-label structure as the light render, now rendered in light off-white/light-gray tones. Title and subplot titles are clearly bright against the dark background; axis names and tick labels use a softer light-gray that remains legible. Gridlines are faint light lines, subtle but visible.
      Data: Data colors are identical to the light render — same green markers (#009E73) with the same size/opacity differentiation in the Residuals vs Leverage panel, same blue LOWESS line, same gray/amber Cook's-distance contour dashes, and the same #78/#29/#80 influential-point labels now in light text (correctly flipped from dark ink to light ink for contrast on the dark background). Only the chrome (background, text, grid) flipped; the categorical/semantic data colors themselves are unchanged.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and annotation text is clearly visible against the near-black surface.
