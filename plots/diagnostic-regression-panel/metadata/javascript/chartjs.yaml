review:
  strengths:
  - Correct, from-scratch implementations of Cook's distance, leverage/hat-values,
    standardized residuals, LOWESS smoothing, and the Q-Q probit transform — real
    statistical rigor within Chart.js's constraints.
  - 'Thoughtful semantic color use: amber for Cook''s-distance warning contours, theme-adaptive
    ink for reference lines, keeping the categorical green reserved for actual data.'
  - 'The influential-point labeling (#3, #10, #119) ties all four panels into one
    coherent diagnostic story, exactly matching the spec''s intent.'
  - Both themes are fully readable with pixel-identical data colors — clean theme-adaptation
    work.
  weaknesses:
  - In the Normal Q-Q panel, the "#119" label overlaps its own data marker (trailing
    digit partially obscured) in both renders — nudge the label-avoidance logic to
    also offset when a label's own point sits directly on the placement line, or increase
    the offset slightly for points near the panel corner.
  - Visual refinement stays close to Chart.js defaults beyond the theme/color work;
    could differentiate further (e.g., slightly larger gaps between panels, or subtler
    gridlines) for extra polish.
