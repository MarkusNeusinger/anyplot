review:
  strengths:
  - Uses MUI X's composition API (ChartsContainer with ScatterPlot, LinePlot, ChartsGrid,
    ChartsReferenceLine) per panel and draws the Q-Q line, Cook's contours and index
    labels in a custom overlay through useXScale/useYScale/useDrawingArea, clipped
    to the drawing area
  - 'Diagnostics are computed honestly from an OLS fit: hat values, standardized residuals
    and Cook''s distance follow the textbook formulas, and the contours use sqrt(level·p·(1−h)/h)
    mirrored above and below zero with their 0.5/1.0 levels labelled'
  - 'The synthetic dose-response data is designed to exercise every panel: curvature
    in Residuals vs Fitted, rising spread, a heavy lower tail in the Q-Q plot, and
    one high-leverage observation (55) that falls beyond the Cook''s 1.0 contour'
  - 'Theme handling is complete: all text, reference lines and contours use ink/inkSoft
    tokens, labels carry page-coloured halos, and the green points and blue smoother
    are identical in both renders'
  - Shared title with a compact key line (n, p, point, smoother and contour glyphs)
    plus numbered panel titles gives a clear hierarchy; scatter tooltips stay available
    in the HTML output
  weaknesses:
  - 'SC-02, VQ-02 (both): in panels 1 (Residuals vs Fitted) and 3 (Scale-Location)
    observations 1 (fitted 54.1) and 2 (fitted 57.3) sit about 15 CSS px apart; the
    collision pass pushes label "2" up-left and label "1" down-right, so "2" ends
    up next to observation 1''s marker and "1" next to observation 2''s marker (panel
    3: "1" also sits on the neighbouring marker at fitted ~62), breaking the spec''s
    ''each label beside its own point'' → each label within its own marker''s halo
    radius and nearer to it than to any other labelled marker, e.g. anchor both labels
    on the outer side of the pair (the left/lower-fitted point labelled on its left,
    the right one on its right). Likely cause: PanelOverlay''s swap rule (lines 263–281)
    sets fixed dx/dy for ''other'' and ''point'' regardless of which of the two lies
    left or above.'
  - 'CQ-04 (code): the four panel blocks (lines 524–751) repeat the same ~55-line
    ChartsContainer scaffold with only axis ids, limits, labels and series changing,
    and the positive/negative Cook''s contour paths and their labels are written out
    twice (lines 309–320, 345–372) → one panels config array rendered with panels.map,
    and one loop over the sign [1, -1] for the contours. Likely cause: copy-paste
    per panel instead of a config-driven render.'
  - 'Suggestion: the vertical grid in all four panels could be dropped or lightened
    so the horizontal zero line and the Cook''s contours carry more of the reading.'
  - 'Suggestion: the Q-Q panel could use an equal data range on both axes so the 45-degree
    reference line reads as an actual diagonal of the plot area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1) across the full 2400×2400 square canvas.
      Chrome: bold dark title "diagnostic-regression-panel · javascript · muix · anyplot.ai" (~60 % of the width), a grey key line below it (OLS diagnostics n = 56, p = 2; green dot = observations, top 3 by Cook's distance labelled; blue line = LOWESS smoother; dashed = Cook's distance 0.5, 1.0). Four numbered panel titles in bold dark ink; axis titles bold dark, tick labels grey, all clearly readable. Light grey horizontal and vertical grid; dashed grey zero lines in panels 1 and 4 and a dashed y = x line in panel 2.
      Data: all points brand green #009E73 at the same size in all four panels; LOWESS smoothers in Imprint blue in panels 1 and 3 (bending down to −65 and up to 1.6 at the sparse right end, where only observation 55 lies). Panel 2: Q-Q points follow the diagonal with a heavy lower tail (55 at −5.2). Panel 4: dashed Cook's contours at 0.5 and 1.0 mirrored above and below zero, labelled at the right edge; observation 55 at leverage 0.123 lies beyond the lower 1.0 contour. Labels 55, 2 and 1 appear in every panel with page-coloured halos; in panels 1 and 3 the labels "2" and "1" sit closer to each other's markers than to their own.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black (#1A1A17).
      Chrome: title, panel titles and axis titles in light ink, tick labels and key line in light grey; grid, zero lines, Q-Q diagonal and Cook's contours flip to light grey dashes and remain visible. No dark-on-dark text anywhere; the point labels and contour labels carry dark halos and read clearly.
      Data: green points and blue smoothers identical to the light render; only chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
