review:
  strengths:
  - 'All four canonical diagnostic panels present with the correct statistics: zero-reference
    line + LOWESS smoother on Residuals vs Fitted, 45-degree reference line on the
    Normal Q-Q, LOWESS smoother on Scale-Location, and correctly-derived Cook''s distance
    contours (0.5 and 1.0) on Residuals vs Leverage.'
  - 'Regression math is genuinely correct: hat values, internally studentized residuals,
    and Cook''s distance are all textbook formulas, and the Cook''s contour curves
    are algebraically derived from the same D formula rather than eyeballed.'
  - Consistent brand-green point styling across all four subplots as required by the
    spec, with the LOWESS smoother in a distinct blue and Cook's contours in semantic
    amber so the three roles (data, trend, threshold) are visually separable.
  - Idiomatic use of MUI X's composition API (ChartContainer + ScatterPlot/LinePlot/ChartsGrid/ChartsReferenceLine)
    plus useXScale/useYScale hooks to place custom influential-observation labels
    in live chart coordinates — goes beyond the wrapper-component (BarChart/LineChart)
    API.
  - 'Both light and dark renders are fully theme-correct: warm off-white / near-black
    backgrounds, all text legible, data colors identical between themes, no clipping
    at any canvas edge.'
  - Deterministic, seed-based data generation (LCG + Box-Muller) with a plausible
    dose-response biomarker narrative and two deliberately engineered influential
    points so the panel has something real to diagnose.
  weaknesses:
  - Influential-point index labels ('1'/'2') are placed close enough together in the
    Normal Q-Q and Residuals vs Leverage panels that they visually crowd each other
    — still legible but not comfortably spaced; consider a small alternating vertical
    offset when two labeled points are within a few pixels of each other.
  - The panel relies on several bespoke helper functions (LOWESS, Acklam's inverse-normal-CDF
    approximation, Cook's contour branch) — necessary for statistical correctness
    here, but keep an eye on KISS as a baseline; no simplification requested, just
    noting the complexity floor for this spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the full canvas and all four subplot panels.
      Chrome: Main title "diagnostic-regression-panel · javascript · muix · anyplot.ai" in bold dark ink, centered at top. Four subplot titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage") in medium-gray, left-aligned above each panel. Axis titles (Fitted Values, Residuals, Theoretical Quantiles, Standardized Residuals, √|Standardized Residuals|, Leverage) and tick labels are dark and fully legible against the light background. Grid lines are light gray, subtle but visible.
      Data: All scatter points are brand green (#009E73) and consistent across all four subplots. Panel 1 and 3 show blue LOWESS smoothers; panel 2 shows a gray dashed 45-degree reference line; panel 4 shows amber dashed Cook's-distance contour curves at D=0.5 and D=1.0. Zero-reference dashed lines appear in panels 1 and 4. The three most influential points (indices 1, 2, 55) are labeled with small gray index numbers next to the corresponding markers in each subplot — point 55 (large residual + high leverage) is clearly the dominant outlier in all four panels.
      Legibility verdict: PASS — no light-on-light text, all labels and titles crisp.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the full canvas and all four subplot panels.
      Chrome: Same title and subplot-title structure as the light render, now rendered in light ink / soft light-gray text against the dark background — fully legible, no dark-on-dark failures. Grid lines are a subtle dark gray, still visible without dominating.
      Data: Scatter point color, LOWESS blue, and Cook's-contour amber are pixel-identical to the light render — confirms data colors are theme-invariant and only chrome (background, text, grid) flipped. Influential-point index labels (1, 2, 55) are rendered in light gray and remain readable against the dark background.
      Legibility verdict: PASS — no dark-on-dark text, brand green and amber both read clearly on the dark surface.
