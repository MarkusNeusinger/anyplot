review:
  strengths:
  - Composes the four panels from MUI X primitives inside ChartsContainer (ScatterPlot,
    LinePlot, ChartsGrid, ChartsReferenceLine, ChartsXAxis/ChartsYAxis) with explicit
    axis bands sized for the 15 px labels, so nothing is truncated
  - The Q-Q line, Cook's distance contours and point labels are drawn in a PanelOverlay
    that reads useXScale, useYScale and useDrawingArea, so every overlay sits in the
    chart's own coordinate system and is clipped to the drawing area
  - 'All statistics fall out of an actual OLS fit: leverage, standardized residuals,
    Cook''s distance (p recovered as the sum of hat values), tricube-weighted LOWESS
    and Acklam normal quantiles; Cook''s contours use r = ±sqrt(D·p·(1−h)/h) and close
    in on zero as leverage grows'
  - Cook's contours mirrored above and below zero and identified in-plot by their
    level (0.5, 1.0) with page-colored halos; the top three observations by Cook's
    distance (55, 1, 2) are labeled in all four panels
  - Chrome is threaded from ANYPLOT_TOKENS (ink, inkSoft, pageBg) so both themes are
    fully legible, and the data colors are identical between renders
  - 'Clear hierarchy: numbered panel titles, bold axis titles, muted tick labels and
    one header line carrying n, p and a key for the point, smoother and contour styles'
  weaknesses:
  - 'VQ-07 (both): the LOWESS smoother, the second data series, is drawn in palette
    slot 3 (blue) while slot 2 (purple) is skipped with no semantic reason → use the
    next canonical position, t.palette[1]. Likely cause: SMOOTH_COLOR = t.palette[2]
    (line 227).'
  - 'CQ-01 (code): two helper functions (labelBox, boxCircleGap) and an eight-candidate
    scoring search (lines 238–315) place only three labels per panel → a fixed offset
    per label inside PanelOverlay, with the anchor flipped near the drawing-area edge.
    Likely cause: a generic label-collision engine written for a case that needs none.'
  - 'Suggestion: the zero reference line and the Cook''s contours in the leverage
    panel share the same dashed inkSoft style; a solid thin zero line would separate
    them at a glance.'
  - 'Suggestion: the header could name what was modelled (response against dose) so
    the reader knows the context behind the diagnostics.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: centered bold title "diagnostic-regression-panel · javascript · muix · anyplot.ai"; one muted header line "OLS diagnostics (n = 56, p = 2)" with a key (green dot = observations, top 3 by Cook's distance labeled; blue line = LOWESS smoother; dashed = Cook's distance 0.5, 1.0). Four numbered panel titles (1. Residuals vs Fitted values, 2. Normal Q-Q, 3. Scale-Location, 4. Residuals vs Leverage), bold dark axis titles, muted grey tick labels, subtle grid. All text dark on light, readable.
      Data: green (#009E73) circles in all four panels with identical styling; blue LOWESS curve in panels 1 and 3 (panel 1 arches up then dives toward the lone point 55 at fitted 222, residual -89; panel 3 dips then rises toward 55); dashed grey zero line in panels 1 and 4; dashed 45-degree line in the Q-Q panel with 55 far below at (-2.4, -5.2); mirrored dashed Cook's contours labeled 0.5 and 1.0 in panel 4, with 55 at leverage 0.123 beyond the 1.0 contour. Observations 55, 1 and 2 labeled in bold ink with page-colored halo in every panel.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, header key, panel titles and axis titles in light ink; tick labels light grey; grid subtle but visible; dashed reference lines and Cook's contours switch to a light grey. No dark-on-dark text; point labels readable with dark halos.
      Data: green markers and blue smoother identical to the light render; only chrome flipped.
      Legibility verdict: PASS
