review:
  strengths:
  - Faithful, complete replication of R's classic plot(lm) four-panel diagnostic layout
    with all four required subplot types (Residuals vs Fitted, Normal Q-Q, Scale-Location,
    Residuals vs Leverage)
  - 'Deliberately engineered synthetic data (heteroscedastic dose-response with two
    injected influential points) that exercises every diagnostic feature: mild non-linearity,
    growing variance, non-normal tails, and high-leverage/high-residual outliers'
  - Sophisticated custom InfluentialLabels component using useXScale/useYScale hooks
    with a genuine collision-avoidance stagger algorithm, so labels for observations
    1, 2, and 55 never overlap across any of the four panels
  - 'Thoughtful, semantically correct color usage: brand green (#009E73) for all data
    points, amber (#DDCC77) for Cook''s-distance threshold contours (a warning/threshold
    role), and ink-neutral dashed reference lines — identical data colors across light/dark
    renders'
  - Clean, generous 2x2 layout with balanced whitespace and no clipping at any canvas
    edge; correct square-orientation canvas for this grid-based plot
  weaknesses:
  - Tick labels in each of the four subplots become quite small once the PNG is scaled
    to a ~400px mobile width (each panel is only a quarter of the canvas) — consider
    bumping TICK_LABEL_STYLE fontSize slightly (e.g., 12) for more mobile headroom
  - The LOWESS smoother in 'Residuals vs Fitted' swings sharply downward at the rightmost
    fitted values, driven almost entirely by the single high-leverage outlier (#55)
    at the boundary — mathematically expected behavior for a local smoother with sparse
    boundary data, but it visually overstates the 'trend'; a larger bandwidth fraction
    near the boundary would tone this down
  - Subplot title treatment (SubplotTitle) is plain medium-weight text; a slightly
    more editorial touch (e.g., smaller caps or a subtler weight/color step) would
    push Visual Refinement a bit closer to a fully polished look
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "diagnostic-regression-panel · javascript · muix · anyplot.ai" centered at top; four dark-gray subplot titles ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage"); dark axis labels and tick labels throughout, all clearly legible against the cream background; subtle light-gray gridlines on both axes of every panel.
      Data: All scatter points render in brand green (#009E73), identical marker size/style across all four panels; a blue (#4467A3) LOWESS smoother line in the Residuals-vs-Fitted and Scale-Location panels; a gray dashed zero-reference line and Q-Q 45° diagonal; amber (#DDCC77) dashed Cook's-distance contours (0.5 and 1.0 levels) in the Residuals-vs-Leverage panel. Observations 1, 2, and 55 are labeled with small dark-gray index numbers, staggered to avoid overlap; observation 55 is clearly visible as a strong outlier in three of the four panels.
      Legibility verdict: PASS — all text is readable against the light background at full resolution; tick labels remain readable (though smaller) when the composite is scaled to ~400px mobile width.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light ink; subplot titles and tick labels render in light gray, all clearly legible against the dark surface; gridlines are subtle light-gray at low opacity, still visible.
      Data: Green markers, blue smoother line, and amber Cook's-distance contours are pixel-identical to the light render — only the chrome (background, text, grid) flipped as expected. No dark-on-dark failures observed anywhere — every axis label, tick label, and subplot title is clearly legible, and the amber contour lines remain distinctly visible against the near-black background.
      Legibility verdict: PASS — no theme-adaptation failures found; both renders are fully readable and the data colors match exactly between themes.
