review:
  strengths:
  - 'Correct, real statistics: OLS fit, standardized residuals, hat-matrix leverage,
    Cook''s distance, and a probit-based normal Q-Q — matches R''s plot(lm) diagnostics
    faithfully'
  - 'All four required subplots present with the correct features: zero-reference
    line + LOWESS on Residuals vs Fitted, 45-degree reference line on Q-Q, LOWESS
    on Scale-Location, and Cook''s D=0.5/1.0 contour curves on Residuals vs Leverage'
  - Consistent identification of the top-3 influential points (by Cook's distance)
    across all four panels, both via a larger marker radius and an index label — a
    genuine cross-panel storytelling device
  - Synthetic data deliberately engineered to show heteroscedasticity (variance growing
    with fitted value), a high-leverage point, and two large-residual outliers — hits
    DQ-01 feature coverage well
  - 'Thoughtful, semantic color roles: brand green (#009E73) for data points, Imprint
    blue for the LOWESS trend, and the amber semantic anchor for the Cook''s D warning
    contour — theme-correct in both renders'
  - Deterministic LCG + Box-Muller RNG (seed=42) gives fully reproducible data with
    no external dependencies
  weaknesses:
  - 'Normal Q-Q panel: the ''56'' index label sits almost exactly on top of the 45-degree
    reference line, making the two-digit label partially merge with the dashed line
    — nudge the label offset (e.g. increase the +8/-8 px offset or flip it based on
    which side of the line the point falls) so it never crosses the reference line.'
  - Tick labels and axis labels are sized at 13px CSS (within a 1200px square mount)
    across 4 dense subplots — legible at desktop size but proportionally small once
    the composite panel is scaled to a ~400px mobile thumbnail; consider bumping to
    ~14-15px or trimming a tick or two per axis for breathing room.
  - The code relies on several bespoke helper functions (probit, lowess, styleAxis,
    panelChrome, labelInfluential) - justified by the genuine statistical complexity
    of a 4-panel diagnostic display, but it does move away from the library's typical
    flat KISS structure; consider whether panelChrome/styleAxis could be simplified
    now that all 4 panels share identical geometry.
  - No gridlines on any subplot - a defensible minimalist choice, but a very subtle
    y-axis (or both-axes) grid at ~10-15% opacity would help the reader compare point
    positions across the four differently-scaled panels, which is exactly the kind
    of subtle refinement that separates a good diagnostic panel from an excellent
    one.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "diagnostic-regression-panel · javascript · d3 · anyplot.ai" centered at top, clearly readable. Each of the 4 subplots has its own bold dark panel title ("Residuals vs Fitted", "Normal Q-Q", "Scale-Location", "Residuals vs Leverage") plus soft dark-gray axis titles and tick labels. All text reads cleanly against the light background.
      Data: Green (#009E73) circular markers throughout, consistent styling across all 4 panels; a blue LOWESS smoother line on panels 1 and 3; a black dashed zero/45-degree reference line on panels 1 and 2; amber dashed Cook's-distance contour curves (D=0.5, D=1.0) with an amber "Cook's D = 0.5 / 1.0" label on panel 4. The 3 most Cook's-distance-influential points (indices 30, 56, 57) are drawn larger and labeled with their index in every panel, giving a consistent cross-panel narrative thread. One minor issue: in the Q-Q panel, the "56" label overlaps the 45-degree reference line, making it slightly harder to read.
      Legibility verdict: PASS (one minor label/line overlap noted above, does not block reading the plot)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and all panel titles render in light off-white, axis labels and tick labels render in a soft light gray — all clearly legible against the dark background. No dark-on-dark text found anywhere in the panel.
      Data: Same green (#009E73) markers, same blue LOWESS line, same amber Cook's-D contours and label as the light render — data colors are pixel-identical between themes, confirming only chrome (background/text/axis lines) flips.
      Legibility verdict: PASS
