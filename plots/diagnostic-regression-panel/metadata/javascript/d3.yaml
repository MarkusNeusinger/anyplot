review:
  strengths:
  - All four required diagnostic subplots present with correct statistics (LOWESS,
    45-degree QQ reference, Cook's D contours) and consistent point styling/sizing
    across panels
  - Top-3 influential observations (by Cook's distance) are consistently enlarged
    and index-labeled in every panel, with a smart perpendicular-offset heuristic
    in the Q-Q panel to avoid labels merging into the reference line
  - Both themes are fully readable; data colors are identical between light/dark,
    only chrome flips
  - Canvas gate passed (2400x2400 square, correct for this spec)
  weaknesses:
  - Panel 4's "Cook's D = 0.5 / 1.0" annotation sits on top of the D=1.0 dashed contour
    curve, so the dash strokes visually cut through the digits in both themes. Move
    the label to a clearer spot away from the curve crossing.
  - Axis titles ("Fitted values", "Residuals", "Leverage") omit units; a minor nit
    since it matches common R plot(lm) convention.
