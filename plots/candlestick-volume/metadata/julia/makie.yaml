review:
  strengths:
  - Correct 70-75%/25-30% price/volume pane split via rowsize!(Relative(0.72)) / rowsize!(Relative(0.28)),
    with linkxaxes! keeping the two panes perfectly synchronized on a shared date
    axis.
  - 'Semantic finance color exception applied correctly and consistently: up=#009E73
    (Imprint position 1), down=#AE3030 (Imprint position 5), identical data colors
    between light and dark renders, only chrome flips.'
  - 'Idiomatic Makie usage: linesegments! for OHLC wicks, barplot! with fillto for
    candle bodies, a custom ytickformat closure for millions-formatted volume ticks,
    and theme-adaptive chrome tokens threaded through both axes.'
  - Clean, realistic OHLCV data generation with volume correlated to the magnitude
    of the daily price move, giving the volume pane real explanatory value alongside
    price action.
  - Correctly and silently omits the spec's interactive crosshair request per the
    CairoMakie static-only policy instead of faking a tooltip/cursor (avoids AR-08).
  weaknesses:
  - Up/down status is conveyed by color alone (green vs. red) with no secondary channel
    (e.g. hollow vs. filled body outline) — readers with red-green color-vision deficiency
    have only the semantic convention to rely on.
  - The legend sits top-left where the earliest (Mar 01-03) candles reach into the
    same vertical band; the semi-opaque legend background keeps the 'Up'/'Down' text
    readable, but nudging the legend down slightly or tightening the y-axis top limit
    would remove the visual crowding.
  - Volume y-axis label is just 'Volume' — the values are only self-describing via
    the 'M' suffix on tick labels; an explicit '(millions)' in the ylabel would make
    the axis fully self-contained without reading the ticks.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "candlestick-volume · julia · makie · anyplot.ai" in bold dark ink, centered and comfortably sized. Y-axis "Price (USD)" and "Volume" labels, X-axis "Date" label, rotated date tick labels (Mar 01 ... Apr 26) on the shared bottom axis. All text renders in dark ink against the light background and is clearly legible. Grid lines are thin, subtle horizontal/vertical guides aligned across both panes. Legend box ("Up" / "Down") sits top-left with a slightly elevated cream background and soft border-free framing.
      Data: 60 daily OHLC candlesticks with thin wicks and wide bodies, colored green (#009E73) for up days and matte red (#AE3030) for down days; a matching-colored volume bar for every day sits in the lower pane, y-axis formatted as "X.XM". Data trends downward with local rallies, plausible for a technology stock.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and rotated date ticks now rendered in light ink (near-white for title/axis labels, softer warm gray for tick labels), fully legible against the dark background. Grid lines remain subtle but visible as faint light-on-dark guides. Legend box now uses a dark elevated background with light label text, still clearly readable and non-overlapping.
      Data: Candlestick and volume-bar colors are pixel-identical to the light render — same #009E73 up / #AE3030 down — confirming only chrome (background, text, grid, legend surface) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and grid elements remain visible against the near-black background.
