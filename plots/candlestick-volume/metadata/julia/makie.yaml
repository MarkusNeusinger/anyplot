review:
  strengths:
  - Hollow-vs-filled candle body convention now added (up = hollow outline, down =
    solid fill), giving CVD readers a secondary shape channel independent of the green/red
    hue — directly resolves the VQ-04 gap from attempt 1.
  - Extra top-of-axis headroom (0.18x price span) computed from the actual price range
    keeps the top-left legend clear of the earliest candles regardless of where the
    series peaks — resolves the legend/data proximity weakness from attempt 1.
  - Volume y-axis label is now the fully self-contained "Volume (millions)" instead
    of bare "Volume" — resolves the axis-labeling weakness from attempt 1.
  - 'Idiomatic Makie dual-pane composition: linkxaxes! for a synchronized shared date
    axis, rowsize!/rowgap! with Relative(0.72/0.28) for the spec''s mandated pane
    split, linesegments! for wicks + barplot!(fillto=...) for bodies, and a manually
    constructed PolyElement Legend.'
  - Correct Imprint semantic-exception palette (up=#009E73 position 1, down=#AE3030
    position 5) with identical data colors and correctly flipped theme-adaptive chrome
    (#FAF8F1/#1A1A17 backgrounds) in both renders.
  - Correctly and silently omits the spec's interactive crosshair request per the
    CairoMakie static-only policy instead of faking a tooltip/cursor, avoiding AR-08.
  weaknesses:
  - The tallest early up-candle's wick tip still comes close to the bottom of the
    "Down" legend label (small but non-zero margin) — a touch more headroom or shifting
    the legend right by one candle width would make the clearance more robust across
    re-renders.
  - 'Design Excellence still reads as solid-but-standard: the dual-pane layout communicates
    the price/volume correlation but has no additional emphasis (e.g., highlighting
    the largest single-day volume spike or a notable price move) to sharpen the storytelling.'
  - The legend's elevated background (#FFFDF6 at 0.85 alpha in light mode) is nearly
    indistinguishable from the page background (#FAF8F1), so the legend currently
    relies on that small headroom gap rather than a visibly contrasting surface to
    stay legible over data.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark-ink title "candlestick-volume · julia · makie · anyplot.ai" centered at top; "Price (USD)" y-axis label on the upper pane; "Volume (millions)" y-axis label and "Date" x-axis label (rotated ~30°, Mar 01–Apr 26) on the lower pane. Subtle horizontal grid lines aligned across both panes. Top-left "Up"/"Down" legend with hollow-green and solid-red swatches. All title, axis, and tick text renders in dark ink and is clearly readable against the light background.
      Data: 60 daily OHLC candlesticks — up candles are hollow (page-background fill, #009E73 outline), down candles are solid #AE3030 fill — plus matching-colored volume bars below, sharing the same date axis via linkxaxes!.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same layout; title and axis labels now render in light ink (#F0EFE8), tick labels in a softer warm gray (#B8B7B0) — all clearly legible, no dark-on-dark failures. Grid lines remain faint but visible. Legend flips to a dark elevated surface with light text, still readable and clear of the earliest candles.
      Data: Candlestick and volume-bar colors are pixel-identical to the light render (#009E73 hollow-up / #AE3030 solid-down) — confirming only chrome flips between themes, not data encoding.
      Legibility verdict: PASS
