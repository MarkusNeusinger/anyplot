review:
  strengths:
  - 'Dual-pane layout is genuinely synchronized: ggplotGrob() + unit.pmax() width
    alignment keeps the price and volume panes column-perfectly aligned on the shared
    date axis, and the 2.5:1 height ratio matches the spec''s 70-75%/25-30% split
    almost exactly (71.4%/28.6%).'
  - Realistic OHLC generation via cumulative log-normal-ish returns produces authentic
    price action, including thin/doji-like candles and volume that scales with the
    magnitude of the day's price move — this is exactly the kind of feature coverage
    DQ-01 rewards.
  - 'Both themes are fully theme-correct: identical data colors (#009E73 up / #AE3030
    down) across light and dark, with all chrome (title, subtitle, axis text, gridlines)
    correctly inverted and legible in both renders.'
  - Clean, idiomatic ggplot2 candlestick construction via geom_segment (wicks) + geom_rect
    (bodies), with scales::label_dollar()/label_number()/label_date() for clean axis
    formatting.
  - Subtitle doubles as an implicit legend explaining the green/red semantics, avoiding
    a redundant legend box for a simple two-category encoding.
  weaknesses:
  - Crosshair/cursor spanning both panes from the spec's Notes is infeasible in a
    static PNG and was correctly omitted per ggplot2's static-library rules — no action
    needed, but noting it as an intentionally-unimplemented spec detail.
  - Design execution is strong but not maximally distinctive to ggplot2/R specifically
    — the grob-alignment technique, while idiomatic R/grid programming, has close
    analogs in other libraries (e.g. matplotlib GridSpec), so Library Mastery tops
    out at 'uses some library-specific features' rather than 'couldn't easily be replicated
    elsewhere'.
  - A thin visual divider or slightly larger gap between the price and volume panes
    would sharpen the pane separation further, though current spacing is already clean.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "NovaTech Inc. · candlestick-volume · r · ggplot2 · anyplot.ai" in dark ink, fully legible, spans ~60% of plot width (comfortably within the 50-70% target). Subtitle explaining green/red semantics in soft grey ink, clearly readable. Y-axis "Price (USD)" and "Volume" labels, X-axis "Trading Date" label, and tick labels ($170/$160/$150, 0M-5M, Feb 05...Apr 23) all rendered in dark/soft-dark ink against the light background — all clearly legible. Horizontal gridlines are subtle and aligned across both panes.
      Data: First categorical color (Up) is Imprint brand green #009E73; Down candles use Imprint matte red #AE3030 (position 5, the semantic loss/down anchor) — this matches the sanctioned finance semantic-exception (profit/up→green, loss/down→red). Wicks (thin segments) and bodies (rects) both render correctly, including thin/doji-like bodies. Volume bars share the same up/down coloring for visual consistency, correlating visibly with large price moves (e.g., the big red candle near Apr 28 lines up with the tallest volume bar, ~5M).
      Legibility verdict: PASS — no light-on-light text, no clipping observed at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle now render in light ink (#F0EFE8 / #B8B7B0-equivalent), fully legible against the dark background. Axis titles, tick labels, and volume labels are all light-colored and readable — no dark-on-dark failures detected anywhere (title, axis labels, tick labels, subtitle all inverted correctly).
      Data: Candle body/wick colors and volume bar colors are pixel-identical to the light render (#009E73 green, #AE3030 red) — only the chrome (background, text, gridlines) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark text, no clipping observed at any canvas edge.
