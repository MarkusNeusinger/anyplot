review:
  strengths:
  - Correctly solves the 'no native candlestick in MUI X community' problem via the
    documented ChartContainer + useXScale/useYScale composition pattern, drawing real
    OHLC candles against the shared band scale rather than faking it or reaching for
    Pro.
  - 'Genuine dual-pane synchronization: price (72%) and volume (28%) panes share an
    identical band domain and left/right margins, matching the spec''s 70-75/25-30
    split exactly, with columns landing under the matching candle.'
  - Real cross-pane crosshair driven by actual mouse position (not a simulated/static
    annotation) spans both panes and drives a live OHLCV + volume tooltip readout
    — correctly absent from the static PNG per the interactive-library fairness rules,
    and live in the emitted HTML.
  - 'Data is realistic and fully covers the plot type: both bullish and bearish candles,
    varying spreads/wick lengths, and volume magnitudes that plausibly correlate with
    the size of each day''s price move.'
  - Deterministic in-memory data generation (fixed-seed LCG, fixed calendar anchor)
    with correct OHLC invariants (high ≥ max(open,close), low ≤ min(open,close)).
  - 'Palette correctly follows the finance semantic exception: brand green (#009E73)
    for bullish, matte red (#AE3030) for bearish, applied consistently to both candlesticks
    and volume bars, identical across light/dark renders.'
  - All font sizes are explicitly set (title, axis labels, tick labels, legend, tooltip)
    and `skipAnimation` is set on both ChartContainers.
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level: the layout is functional
    but visually plain — plain title/legend typography, no subtle refinements (e.g.,
    a faint separator or elevated background tint delineating the price pane from
    the volume pane, refined legend chip styling) that would elevate it past a standard
    dashboard look.'
  - 'No visual hierarchy or storytelling beyond raw color-coding: the chart displays
    the full 60-day series without emphasizing any specific insight (e.g., the sharp
    Feb 19-21 selloff/reversal or the volume spike that accompanies it). Consider
    a subtle emphasis technique (e.g., a light callout or slightly bolder treatment
    on the largest single-day move) to guide the viewer''s eye — the spec''s own framing
    (''identify volume-confirmed trends or reversals'') offers a natural candidate.'
  - 'Bullish/bearish encoding relies solely on red vs. green hue (VQ-04): while this
    is the sanctioned finance semantic exception and the two hues have some luminance
    separation, there is no secondary encoding (e.g., a subtle texture, outline weight,
    or opacity difference) to reinforce the distinction for color-vision-deficient
    readers.'
  - Title ('candlestick-volume · javascript · muix · anyplot.ai') renders comfortably
    small relative to the canvas (~30-35% of width) — not a violation, but there is
    room to size it slightly larger for a stronger visual anchor without approaching
    overflow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "candlestick-volume · javascript · muix · anyplot.ai" centered at top; a two-item legend row below it ("Bullish (close ≥ open)" green swatch, "Bearish (close < open)" red swatch); upper price pane with a "Price (USD)" y-axis labeled in $XX.00 increments and subtle horizontal gridlines; lower volume pane with a "Volume" y-axis labeled in M increments and a shared "Date" x-axis (Feb 1 … Mar 26) below it. All title, axis-label, and tick-label text renders in dark ink and is clearly legible against the light background.
      Data: 60 daily candlesticks with visible wicks and bodies, colored brand green (#009E73) for bullish days and matte red (#AE3030) for bearish days; the volume bars directly below use the same two colors, aligned under their corresponding candle. The series traces a plausible down-then-up-then-down price cycle with varying spread widths and wick lengths.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis structure as the light render, all text now rendered in light ink (white/off-white) and clearly legible against the dark background. Gridlines are faint light lines, still subtle but visible.
      Data: Candlestick and volume bar colors are pixel-identical to the light render (#009E73 bullish / #AE3030 bearish) — confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; no title/axis/tick text is unreadable in either theme.
