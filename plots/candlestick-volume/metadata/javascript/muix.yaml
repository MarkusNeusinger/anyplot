review:
  strengths:
  - Composes the candlesticks and volume bars as custom SVG layers inside two ChartsContainer
    instances, reading positions from the useXScale/useYScale/useDrawingArea hooks,
    so every candle body, wick and volume bar sits at its exact data value on community
    @mui/x-charts (which has no native candlestick series)
  - Both panes share one band scale over the same keys and the same tickInterval,
    so vertical grid lines and every volume bar line up exactly beneath their candles;
    the pane split is computed on the plot areas (not the containers) to land the
    price pane at 73% of the stacked height
  - Bearish candles and volume bars carry a diagonal hatch on top of the matte red,
    giving a redundant non-color up/down cue that survives CVD and grayscale, mirrored
    in the header legend swatch
  - 'Semantic finance colors from the Imprint palette (brand green #009E73 up, matte
    red down), identical in both renders, with theme tokens threaded through every
    text, axis line and grid line'
  - 'Library-native interactivity in the HTML: a synchronized dashed cursor runs through
    both panes at the hovered date with an OHLCV readout box'
  - Trading weekends are skipped with a band axis, so the series reads as continuous
    sessions with dated ticks in a compact 'Feb 9' format and the year in the subtitle
  weaknesses:
  - 'VQ-06 (both): the volume pane''s y-axis title reads only ''Volume'', without
    the unit the price axis carries (''Price ($)'') → ''Volume (shares)''. Likely
    cause: the VOLUME column constant used as the axis label.'
  - 'CQ-04 (code): the bear-hatch <pattern> definition (lines 152-170 and 239-257),
    the dashed cursor <line> (lines 171-182 and 258-269) and the axis/grid sx block
    (lines 439-447 and 503-511) are each written out twice with identical values →
    define each once (one shared pattern element or constant, one cursor helper, one
    sx constant) and reuse it in both panes. Likely cause: the volume layer copied
    from the candle layer.'
  - 'Suggestion: the price y-axis domain padding leaves a band below the lowest tick
    (135) without a label; a tick near the bottom edge would anchor the lowest wicks
    more clearly.'
  - 'Suggestion: lift the volume bars to full opacity so their green and red match
    the candles'' fill exactly in the light render, where the 0.78 alpha reads a shade
    paler.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no pure white.
      Chrome: bold title "candlestick-volume · javascript · muix · anyplot.ai" centered at ~38% width, grey subtitle "60 periods (Feb 1 – Apr 24, 2024) · Price 133.93–153.78", header legend with a green "Bullish (close ≥ open, n=34)" swatch and a hatched red "Bearish (close < open, n=26)" swatch. Price pane y-axis "Price ($)" with ticks 135–155, volume pane y-axis "Volume" with ticks 0 / 2.0M / 4.0M / 6.0M, shared x-axis "Trading date" with ticks Feb 1 … Apr 17. All text dark ink, clearly readable. Dotted grid lines subtle but visible, aligned across both panes; a thin divider separates the panes.
      Data: 60 candles in the upper ~73% (brand green #009E73 bullish, matte red #AE3030 bearish with a diagonal hatch and darker outline), wicks low→high; doji candles collapse to thin lines. Lower pane: 60 volume bars from a zero baseline, same green/red (slightly translucent), each directly under its candle. Price dips to ~134 at end of February then climbs to ~153 in early April.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, subtitle, legend text, axis titles and tick labels in light ink, all clearly readable; no dark-on-dark text. Grid lines subtle dotted, still visible; pane divider visible.
      Data: identical green and red as the light render (only the hatch stroke flips to light ink, reading as a light diagonal on the red bodies and bars). Volume bars read a touch darker than the candles because of their alpha over the dark page. Brand green clearly visible.
      Legibility verdict: PASS
