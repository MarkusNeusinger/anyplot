review:
  strengths:
  - Candles drawn as a custom SVG layer inside ChartsContainer with useXScale/useYScale/useDrawingArea,
    so bodies (open–close) and wicks (low–high) sit exactly at their data values on
    the price axis
  - Two ChartsContainers share one band x-axis over the same keys and margins, so
    every volume bar sits directly beneath its candle and the vertical grid lines
    align across both panes
  - 'Volume bars reuse the candle colors (brand green #009E73 up, matte red #AE3030
    down), and bearish marks carry a diagonal hatch as a redundant, CVD-safe second
    cue in both themes'
  - Weekend gaps removed by a band scale over trading days, with short 'Feb 9' style
    date ticks thinned via tickInterval
  - Theme tokens threaded through every text, axis line, grid and divider element;
    both renders read cleanly
  - HTML output carries a single vertical cursor spanning both panes plus an OHLCV
    readout on hover, as the Notes ask, while staying absent from the static PNG
  weaknesses:
  - 'SC-02 (both): the price plot area takes about 80 % and the volume plot area about
    20 % of the stacked data height (roughly 675 px vs 160 px in the 1125 px preview)
    → price 72–75 %, volume 25–28 % (about +5 to +8 percentage points for volume).
    Likely cause: PRICE_PANE_SHARE = 0.72 splits the container heights, but the volume
    container also holds the 60 px x-axis band and margins, so its drawing area ends
    up much shorter.'
  - 'VQ-06 (both): the price axis is titled ''Close price ($)'' although it carries
    open, high, low and close values, and the volume axis bottom tick reads ''0K''
    → title the axis ''Price ($)'' and label zero as ''0''. Likely cause: yAxis label:
    CLOSE and formatVolume returning `${Math.round(v / 1e3)}K` for 0.'
  - 'Suggestion: the hatch pattern defs and the cursor line are written out twice,
    once per layer; one shared component taking the axis ids would shorten the file
    by about 30 lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; not pure white.
      Chrome: centered bold title "candlestick-volume · javascript · muix · anyplot.ai" in dark ink, a soft-ink subtitle "60 periods (Feb 1 – Apr 24, 2024) · Price 133.93–153.78", and an HTML legend with a green swatch "Bullish (close ≥ open, n=34)" and a hatched red swatch "Bearish (close < open, n=26)". Price pane y-axis "Close price ($)" with ticks 135–155; volume pane y-axis "Volume" with ticks 0K–6.0M; shared x-axis "Trading date" with ticks Feb 1 … Apr 17. Dashed subtle grid in both panes, thin divider line between panes. All text dark on light, readable.
      Data: 60 candles, bullish in #009E73, bearish in #AE3030 with a diagonal hatch and darker outline; wicks low–high. Volume bars below in the matching up/down color (slightly translucent), each under its candle. Price pane takes ~80 % of the stacked data height, volume ~20 %.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17; not pure black.
      Chrome: title, subtitle, legend, axis titles and tick labels all in light ink; axis lines and dashed grid visible but subtle; no dark-on-dark text.
      Data: same #009E73 / #AE3030 candle and volume colors as the light render; the bearish hatch flips to light ink strokes and stays visible; green volume bars read slightly deeper due to their alpha over the dark page. Layout identical to the light render.
      Legibility verdict: PASS
