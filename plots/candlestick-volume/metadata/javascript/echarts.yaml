review:
  strengths:
  - Idiomatic dual-grid/dual-axis ECharts pattern with axisPointer.link synchronizing
    the crosshair across the price and volume panes — a genuine distinctive-feature
    use rather than a generic default.
  - 'Correct Imprint semantic-exception mapping: brand green (#009E73) for gains,
    matte red (#AE3030, palette position 5) for losses, applied consistently to both
    candlestick bodies and volume bars as the spec requires.'
  - Deterministic, realistic OHLC random-walk data (mulberry32 seeded PRNG) with plausible
    price ($147-$159) and volume (700K-1.6M) ranges over 60 weekday-only trading dates.
  - 'Clean value formatting: ''$'' prefix on price ticks, custom K/M suffix formatter
    on volume ticks.'
  - Both renders pass the theme-readability check — no dark-on-dark or light-on-light
    failures, chrome correctly flips while data colors stay identical.
  weaknesses:
  - 'The price pane''s bottom axis line (xAxis[0].axisLine, gridIndex 0) renders at
    full-opacity t.inkSoft, creating a bold horizontal divider that lands right at
    the $144 gridline position — much heavier than the 15%-opacity t.grid split lines
    used everywhere else in both panes. It reads visually like a bold data gridline,
    which the style guide explicitly disallows (''Never: Bold grid lines... very subtle'').
    Hide it (axisLine: {show:false}) or match it to the same low-opacity grid token
    — the pane separation is already implied by the vertical whitespace gap between
    grid[0] and grid[1].'
  - Up/down encoding for both candlesticks and volume bars relies solely on green
    (#009E73) vs. matte red (#AE3030) hue — a classic red-green confusion pair for
    deuteranopia/protanopia readers. This is an accepted finance convention and the
    spec explicitly requests the shared up/down color scheme, so it's not a blocker,
    but a redundant cue (e.g. a thin ink-colored outline on down bars, per the style
    guide's optional outline pattern) would strengthen CVD accessibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "Tech Stock 2024 · candlestick-volume · javascript · echarts · anyplot.ai" is centered, dark ink, clearly readable. "Price ($)" and "Volume" axis names sit above their respective panes in soft ink. Y-axis tick labels ($147-$162, 0K-1.8M) and rotated 45° date labels along the bottom (2024-01-02 through late March) are all legible dark-gray text against the light background. Value gridlines are thin and subtle (~15% opacity); one bolder horizontal line (the price pane's implicit x-axis line) sits at the pane boundary near the $144 position — noted as a weakness below.
      Data: First-series green is #009E73 (up candles/volume bars), down candles/volume bars are matte red #AE3030 — consistent between the two panes. Candlestick wicks and bodies are clearly distinguishable; volume bars beneath align with the same dates.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Same title, axis names, and tick labels now render in light ink/gray tones, clearly visible against the dark background. Gridlines remain subtle (low-opacity light gray); the same bold pane-divider line is present, now rendered as a lighter gray line, equally prominent relative to the subtle gridlines.
      Data: Candlestick and volume colors are pixel-identical to the light render — #009E73 green and #AE3030 red — confirming only chrome (not data colors) flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly visible against the near-black background.
