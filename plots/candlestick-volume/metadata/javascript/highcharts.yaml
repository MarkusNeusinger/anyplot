review:
  strengths:
  - Builds a correct candlestick from Floor + Body stacked columns and null-separated
    up/down wick lines — a spec-compliant workaround for the missing core-bundle candlestick
    series, with no forbidden add-on modules.
  - Native dual-pane layout via a secondary yAxis top/height split sharing one xAxis
    gives synchronized crosshair and gridlines across price and volume panes automatically,
    with no manual sync code.
  - 'Correct Imprint finance semantic exception: green (#009E73) for bullish/profit,
    matte red (#AE3030) for bearish/loss, applied consistently to candle bodies, wicks,
    volume bars, and legend swatches, identical across both themes.'
  - 'All three attempt-1 weaknesses were fixed precisely: volume pane widened from
    23% to 27% (spec''s 25-30% band), volume axis formatter now rolls over to an ''M''
    unit above 1,000,000, and the four-sided plotBorderWidth/plotBorderColor was removed
    in favor of the style guide''s minimal L-shaped axis frame.'
  - 'Theme-adaptive chrome is fully threaded through (title, axis titles, tick labels,
    grid, legend) — both renders are clean, legible, and use the correct #FAF8F1/#1A1A17
    backgrounds.'
  weaknesses:
  - Price pane is now 68% of vertical space, just under the spec's 70-75% target (volume
    correctly landed at 27% within its 25-30% band) — nudge price pane height back
    up slightly, e.g. 70%/25% with a smaller gap, to satisfy both bounds simultaneously.
  - Bullish/bearish direction still relies on red/green hue alone with no redundant
    shape/texture cue — an accepted candlestick convention and the spec's own request,
    but not ideal for a deuteranopia/protanopia viewer.
  - The header block omits the '// License:' line that prompts/library/highcharts.md
    asks every Highcharts snippet to keep visible (commercial license disclosure)
    — a minor compliance gap, not a scoring blocker this round.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "candlestick-volume · javascript · highcharts · anyplot.ai" in bold dark text at top, comfortably sized and not overflowing; "Price (USD)" and "Volume" y-axis titles and "Trading Date" x-axis title in dark/soft-dark text; tick labels dark and legible; grid lines thin and subtle, aligned across both panes; legend at bottom with two circular swatches ("Bullish (Close ≥ Open)", "Bearish (Close < Open)") in soft-dark text. Only left+bottom axis lines are drawn (minimal L-shaped frame, no boxed border). All chrome elements clearly readable against the light background.
      Data: Candles and volume bars use two colors only — brand green (#009E73) for bullish/close≥open, matte red (#AE3030) for bearish/close<open. Both bullish and bearish candles present with varying body sizes (including near-doji thin bodies) and visible wicks above/below bodies. Volume bars beneath track the same per-period color and visually correlate with price swings (e.g. the late-June rally and mid-July pullback both show volume-confirmed moves). Volume axis correctly rolls over to "1M" at the top tick.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels rendered in light/off-white text, fully readable against the dark background; grid lines thin, subtle light-gray, aligned across both panes; legend swatches and text in the same layout as the light render, text light-colored and legible. No dark-on-dark text found anywhere. Same minimal L-shaped axis frame as the light render.
      Data: Candle and volume bar colors are pixel-identical to the light render — same brand green (#009E73) and matte red (#AE3030) — confirming only chrome (not data colors) flips between themes.
      Legibility verdict: PASS
