review:
  strengths:
  - Builds a real candlestick from Floor + Body stacked columns and null-separated
    up/down wick lines — a correct, spec-compliant workaround for the missing core-bundle
    candlestick series, with no forbidden add-on modules.
  - Native dual-pane layout via a secondary yAxis top/height split sharing one xAxis,
    giving synchronized crosshair and gridlines across price and volume panes for
    free, with no manual sync code.
  - 'Correct Imprint finance semantic exception: green (#009E73) for bullish/profit,
    matte red (#AE3030) for bearish/loss, applied consistently to candle bodies, wicks,
    volume bars, and legend swatches.'
  - Theme-adaptive chrome is fully threaded through (title, axis titles, tick labels,
    grid, legend, plot border) — both renders are clean and legible with correct backgrounds.
  - Deterministic seeded PRNG (mulberry32) produces a realistic ETH-style price random
    walk with volume correlated to price movement, showing both bullish and bearish
    candles of varying body size.
  weaknesses:
  - Volume pane occupies ~23% of vertical space vs the spec's 25-30% target (price
    pane is correctly ~72%); widen the volume pane slightly.
  - Volume axis tick labels render as '1,000k' for values ≥ 1,000,000 instead of rolling
    over to an 'M' unit (e.g. '1M') — the formatter only divides by 1000 with a fixed
    'k' suffix.
  - Bullish/bearish direction relies on red/green hue alone with no redundant encoding
    — an accepted candlestick convention and the spec's own request, but a deuteranopia/protanopia
    viewer cannot distinguish direction from color alone.
  - 'Full four-sided plot border (plotBorderWidth: 1) frames both panes rather than
    the style guide''s default minimal L-shaped (left+bottom) frame, slightly reducing
    visual refinement.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "candlestick-volume · javascript · highcharts · anyplot.ai" in bold dark text at top; "Price (USD)" and "Volume" axis titles and "Trading Date" x-axis title in dark/soft-dark text; tick labels dark; grid lines thin, subtle warm-gray, aligned across both panes; legend at bottom with two circular swatches ("Bullish (Close ≥ Open)", "Bearish (Close < Open)") in soft-dark text. All chrome elements clearly readable against the light background.
      Data: Candles and volume bars use two colors only — brand green (#009E73) for bullish/close≥open, matte red (#AE3030) for bearish/close<open. Both bullish and bearish candles present with varying body sizes (including near-doji thin bodies), wicks visible above/below bodies. Volume bars beneath track the same color per period and visually correlate with price swings.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels rendered in light/off-white text, fully readable against the dark background; grid lines thin, subtle light-gray, aligned across both panes; legend swatches and text same layout as light render, text light-colored and legible. No dark-on-dark text found anywhere.
      Data: Candle and volume bar colors are pixel-identical to the light render — same brand green (#009E73) and matte red (#AE3030) — confirming only chrome (not data colors) flips between themes.
      Legibility verdict: PASS
