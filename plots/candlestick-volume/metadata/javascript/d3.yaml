review:
  strengths:
  - Dual-pane layout matches the spec's 70-75%/25-30% price/volume split exactly (72%/28%),
    with a shared time axis drawn once beneath the volume pane
  - Crosshair and OHLC/volume tooltip are driven by real pointer events (d3.pointer
    + pointermove), not faked hover states, and correctly span both panes
  - Vertical gridlines are built once from shared tick indices and drawn across the
    full price+volume height, keeping both panes visually aligned per the spec's grid
    requirement
  - A phantom domain-only axis layer (ticks removed, only the stroke kept) gives a
    clean chrome edge instead of default D3 tick clutter
  - Deterministic fixed-seed LCG data generation, no fetch/network calls, self-contained
    per the D3 offline-runtime rule
  - 'Correct Imprint palette and theme handling: up=palette[0] (#009E73), down uses
    the semantic red anchor, identical data colors between light/dark, only chrome
    flips'
  - 'Idiomatic D3 patterns throughout: scaleBand/scaleLinear, axisLeft/axisBottom
    with the tickSize(-width) gridline trick, .join(), d3.format/d3.timeFormat'
  weaknesses:
  - Up/down state is encoded solely via green/red hue on both candles and volume bars,
    with no secondary cue (border style, hatch, shape) — a red-green CVD viewer cannot
    distinguish up from down days without the legend
  - Design storytelling is solid but conventional for a financial chart; there is
    no emphasis device (e.g. a subtle annotation on the largest volume spike or the
    sharpest reversal) to guide the viewer to a specific insight
  - Chrome refinement is clean but fairly utilitarian — legend swatches and tooltip
    box are plain rectangles with no further polish (e.g. rounded/soft styling consistent
    with the rest of the design)
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: title "NovaTech 2024 · candlestick-volume · javascript · d3 · anyplot.ai" is bold dark text, clearly visible top-center; "Up close"/"Down close" legend swatches top-right are readable; y-axis labels ($130-$165 on the price pane, 0.0M-3.0M on the volume pane) and x-axis date labels (Jan 02 ... Mar 20) are all dark text on the light background, fully legible; axis titles "Price (USD)" and "Volume" rotated on the left are readable; horizontal gridlines are subtle light-gray, vertical gridlines span both panes and align them.
      Data: 60 daily OHLC candles (green up-closes, red down-closes) in the top ~72% pane with thin high-low wicks and solid bodies; volume bars in the same up/down colors at 0.85 opacity in the bottom ~28% pane; first series color is #009E73 as required.
      Legibility verdict: PASS — no light-on-light or unreadable text found anywhere in this render.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: title and legend text render in light/white and are clearly visible against the dark background; y-axis, x-axis, and pane-title text are all light-colored and legible; gridlines remain subtle but visible against the dark surface.
      Data: candle and volume bar colors are pixel-identical to the light render (same green #009E73 for up, same red for down) — only the chrome (background, text, axis lines, grid) flipped to dark-theme tokens, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text remains clearly readable against the near-black background.
