review:
  strengths:
  - Candlesticks built via the idiomatic Chart.js floating-bar technique (two overlaid
    `bar` datasets with `[low, high]` and `[min(open,close), max(open,close)]` ranges)
    since Chart.js has no native candlestick type without a community plugin — exactly
    the correct native approach per the library's no-workarounds rule.
  - Dual-pane layout matches the spec's 70-75%/25-30% split precisely (72%/28% via
    flexbox), and both panes pin their y-axis width to 76px via `afterFit`, keeping
    the shared category gridlines pixel-aligned across panes.
  - Bullish/bearish coloring follows the documented finance semantic exception (palette[0]
    green for close ≥ open, palette[4] matte red for close < open) applied consistently
    to both candlesticks and volume bars.
  - A custom `syncCrosshair` Chart.js plugin synchronizes a hover-driven crosshair
    across both chart instances, satisfying the spec's cross-pane cursor requirement
    as a genuine interactive feature (explicitly guarded to never appear in the static
    screenshot).
  - 'Data shows real variety: both bullish and bearish candles, doji-like narrow-range
    days, and a plausible uptrend-consolidation-pullback arc with volume that visually
    correlates with larger price moves.'
  - Deterministic LCG-seeded data generation; theme-adaptive chrome (ink, inkSoft,
    grid tokens) correctly threaded through both chart configs so light/dark renders
    both pass legibility.
  - Title correctly follows the mandated format with a descriptive company prefix,
    and its font size is scaled down via the length-based formula to avoid overflow.
  weaknesses:
  - Volume y-axis title 'Volume' has no explicit unit (e.g., 'Volume (shares)') while
    the price axis does ('Price (USD)') — minor inconsistency in axis-label completeness.
  - Three helper constructs (lcg, pruneTicks, the syncCrosshair plugin object) go
    slightly beyond a pure top-to-bottom KISS script — justified by the dual-pane
    sync requirements, but still adds structure.
  - The cross-pane crosshair sync, while a nice touch, is a fairly common charting-library
    pattern (axisPointer sync in echarts, manual sync in D3) rather than something
    uniquely irreplicable outside Chart.js — caps Library Mastery's distinctiveness
    score.
  - At the 400px mobile-preview scale, the smallest tick labels (13px CSS, volume
    y-axis 'M' values and price y-axis '$' values) are legible but noticeably tight
    — still readable, not a failure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "TechNova Inc. (TCNV) · candlestick-volume · javascript · chartjs · anyplot.ai" in dark ink at top, clearly readable. Top-right legend with two swatches, "Bullish (close ≥ open)" (green) and "Bearish (close < open)" (red), readable. Price pane y-axis shows "$170"–"$205" in $-prefixed dark-soft labels with "Price (USD)" axis title. Volume pane y-axis shows "0.0M"–"3.0M" with "Volume" axis title. X-axis shows sparse date labels (Jan 2, Jan 14, Jan 24, Feb 5, Feb 17, Feb 27, Mar 11, Mar 21) under "Trading Date" title, only on the bottom (volume) pane — the price pane's x-axis ticks are intentionally hidden but its gridlines remain aligned with the volume pane's. Subtle vertical/horizontal gridlines visible in both panes without competing with data.
      Data: 60 daily OHLC candlesticks (green bullish, matte-red bearish bodies with thin wicks) tracing an uptrend from ~$180 (early Jan) to a peak of ~$201 (mid-March) followed by a pullback to ~$192 (late March); several narrow-bodied/doji-like days are visible mid-trend. Volume bars below use identical per-day up/down coloring and range roughly 1.1M–2.3M shares, with visually higher volume on some of the larger price-move days.
      Legibility verdict: PASS — all title, legend, axis-title, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/off-white ink, fully readable against the dark background. Tick labels use a lighter soft-ink tone, also readable. Gridlines are faint and theme-adaptive (light, low-alpha lines instead of dark ones).
      Data: Candlestick and volume bar colors are pixel-identical to the light render — same bullish green (#009E73) and bearish red (#AE3030) hues, same shapes, same values — confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, axis label, tick label, and legend entry is clearly visible against the near-black surface.

    Both renders were also checked at the 400px mobile-preview scale (plot-light_400.png / plot-dark_400.png): all text remains legible, though the smallest tick labels are visually tight at that scale — not a failure, just the plot's densest text.
