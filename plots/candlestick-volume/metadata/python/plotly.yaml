review:
  strengths:
  - make_subplots with shared_xaxes=True and row_heights=[0.75, 0.25] gives the 75/25
    price/volume split on one date axis
  - Volume bars colored per day from the same is_up mask as the candles, so every
    bar agrees with the candle above it
  - A single global update_xaxes sets spikes, grid and tick styling for both panes,
    so the grid is subtle and aligned across panes in both themes
  - 'Library-native interactivity in the HTML: spikemode=''across'' vertical crosshair
    plus hovermode=''x unified'' for reading OHLC and volume at one date'
  - d3 tickformats '$.0f' and '.2s' give clean price and SI volume ticks
  weaknesses:
  - 'Suggestion: xaxis rangebreaks (bounds=[''sat'', ''mon'']) would close the weekend
    gaps; the gaps are permitted by the spec.'
  - 'Suggestion: the band between the title and the top of the price pane is wide;
    a smaller top margin or title y would tighten the layout.'
