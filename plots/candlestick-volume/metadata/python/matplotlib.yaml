review:
  strengths:
  - Candles drawn with one vectorized ax.vlines (wicks) and one ax.bar (bodies) call,
    colored per period from a single is_up mask shared with the volume bars
  - plt.subplots(sharex=True, gridspec_kw height_ratios [3, 1]) gives the 75/25 split
    with aligned grids and one shared date axis
  - Theme tokens thread through every chrome element; both renders are fully legible
    and the data colors are identical
  - mdates.AutoDateLocator + DateFormatter('%b %d') and a FuncFormatter for millions
    keep the axes readable
  weaknesses:
  - 'VQ-05 (both): the volume y-label ''Volume (shares)'' is about 1.35x taller than
    the volume pane and runs up beside the price pane''s lower ticks → keep it within
    the volume pane''s height (about −30 %, e.g. a shorter label text or a two-line
    label). Likely cause: ax_volume.set_ylabel(VOLUME, fontsize=10) on a pane only
    25 % of the height.'
  - 'CQ-04 (code): lines 55–59 build highs and lows as body_top + np.zeros(n_days)
    and then overwrite every element in a per-day loop → highs = body_top + np.random.uniform(0.5,
    2.0, n_days), lows = body_bottom - np.random.uniform(0.5, 2.0, n_days). Likely
    cause: a loop carried over instead of a vectorized draw.'
  - 'Suggestion: hollow up-candle bodies would add a cue beyond color for the up/down
    distinction.'
