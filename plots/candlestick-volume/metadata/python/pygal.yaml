      Background: warm off-white #FAF8F1 across the whole canvas
      Chrome: title 'Tesla Stock OHLC with Volume · candlestick-volume · python · pygal · anyplot.ai' at top in dark ink; y title 'Volume (shares) · Price (USD)'; price ticks 96-112 in the upper pane, 0M-3M in the lower pane; dates Jan 02 ... Mar 12 every ten sessions; x title 'Date · green: close at or above open, red: close below open'; dotted subtle guides; all readable
      Data: 60 candlesticks, up in #009E73, down in #AE3030, thin wicks and wide bodies; 60 volume bars below in the matching colors, rising from 0
