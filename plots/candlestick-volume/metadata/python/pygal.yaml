review:
  strengths:
  - 'True candlesticks: 36 px bodies from open to close and 6 px wicks from low to
    high, at their data values, in both themes'
  - Volume bars rise from a zero baseline directly beneath each candle and carry the
    candle's up/down color
  - One coordinate system split into a ~70 % price pane and a ~25 % volume pane with
    per-pane custom y_labels (USD and M shares), so grid lines align across both panes
  - Theme tokens threaded through the pygal Style; chrome flips cleanly, data colors
    identical in light and dark
  - Interactive HTML output with pygal tooltips per series
  weaknesses:
  - 'DQ-02 (both): the title names the real company Tesla but the prices (about $96-112)
    and volumes are invented; Tesla traded near $240 in early 2024 → a fictional ticker
    (for example ''Northwind Robotics'') or a generic large-cap label. Likely cause:
    the title string.'
  - 'CQ-01, CQ-04 (code): the helper segments() (lines 73-78) and the array vol_zero
    are defined but never used → delete both. Likely cause: an approach with None-separated
    series that was replaced by one series per candle part but not removed.'
  - 'Suggestion: the x-axis title doubles as the color key; a short legend-like note
    outside the axis title would keep ''Date'' as a plain axis name.'
  - 'Suggestion: a volume tick at the 4M level would label the tallest bars directly.'
  image_description: |-
