review:
  strengths:
  - facet_grid('pane ~ .', scales='free_y') gives a true shared date axis so every
    volume bar sits beneath its candle
  - Volume bars reuse the candle up/down fill mapping, so colors always agree across
    panes
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with identical data colors
  - Compact linear code with named column constants and a seeded random walk
  weaknesses:
  - 'SC-02 (both): the price and volume panes have equal height (about 50/50) instead
    of the ~70-75 / 25-30 split the Notes give → price pane about 2.5x the volume
    pane. Likely cause: facet_grid without space/height ratios; use facet_grid(...,
    space=''free_y'') with scaled data or theme(panel_spacing) plus a height ratio,
    or compose two plots.'
  - 'VQ-06 (both): volume ticks print raw integers (3000000, 2000000) and the price
    axis carries no unit → readable volume units (e.g. 1M/2M/3M or ''Volume (M shares)'')
    and ''Price ($)''. Likely cause: no scale_y labels formatter on the volume facet
    and strip text ''Price (OHLC)''.'
  - 'DQ-02 (both): the instrument is unnamed — ''Price (OHLC)'' around 100 with no
    ticker reads as an abstract random walk → name a plausible fictional stock (ticker
    in the strip or title prefix). Likely cause: strip label text and the data block.'
  - 'Suggestion: a thicker wick (size ~0.8) would give the thin-bodied candles more
    presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: title 'candlestick-volume · python · plotnine · anyplot.ai' in dark ink (~52% width); x-axis 'Date' with ISO date ticks; right-side strips 'Price (OHLC)' and 'Trading Volume'; soft-gray tick labels; faint horizontal grid; thin panel borders. All readable.
      Data: 60 daily candles, up #009E73 green, down #AE3030 red, thin wicks; volume bars below in matching colors from zero; panes of equal height. Price trends from ~111 down to ~83.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
