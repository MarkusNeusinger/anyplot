review:
  strengths:
  - Candles built idiomatically from two geom_segment layers (wick low-high, body
    open-close), each of the 60 candles distinct
  - gggrid(heights=[0.7, 0.3], hspace=0) with shared scale_x_continuous limits and
    expand=[0, 0] stacks the panes in the spec's proportions with gridlines and bars
    exactly under their candles
  - 'Volume bars share the exact up/down Imprint colors of their candles (#009E73
    / #AE3030) in both themes'
  - The composite itself carries the page color, so both canvases are theme-correct
    edge to edge
  - Column constants and a clean Data block make the chart adaptable to a real OHLCV
    table
  weaknesses:
  - 'Suggestion: gggrid(..., align=True) would align the two panels'' inner areas
    without the hand-tuned left plot_margin values (21 vs 8).'
  - 'Suggestion: a cursor/crosshair tooltip spanning both panes in the HTML output
    would cover the Notes'' interaction bullet.'
  - 'Suggestion: a zero-labelled volume axis (0, 5M, 10M) would read more naturally
    than min/mid/max breaks.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the entire canvas, edges included, and both panels
      Chrome: title 'Stock Trading · candlestick-volume · python · letsplot · anyplot.ai' in dark ink at top-left (~64% width); 'Price ($)' and 'Volume (shares)' y-titles, 'Date (2024)' x-title; date ticks Jan 02 … Mar 12 every 10 trading days under the volume pane; horizontal 'Direction: Up / Down' legend on an elevated box at top-centre of the price pane; subtle grey grid aligned across both panes; all text readable
      Data: 60 candles, green #009E73 up and red #AE3030 down, thin wicks and wider bodies; price climbs to ~170, drops sharply to ~140 around Jan 23, drifts to ~113 by mid-March and recovers to ~122; volume pane (~30% height) with same-colored bars 3.9M-10.1M from zero, each directly beneath its candle
      Legibility verdict: PASS

