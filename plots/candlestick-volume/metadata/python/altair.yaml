review:
  strengths:
  - Layered mark_rule wicks and mark_bar bodies give a faithful candlestick, with
    bodies open-close and wicks low-high at their data values
  - Hover crosshair from one selection_point param drawn in both vconcat panes, so
    a single vertical guide marks one date across price and volume in the HTML
  - Volume bars share the candles' Color scale, so up/down colors always agree, and
    both panes share the weekly %b %d tick cadence with aligned subtle grid
  - Theme tokens threaded through configure_axis/title/view; Imprint colors identical
    in both renders
  - PNG padded (never cropped) to exactly 3200x1800
  weaknesses:
  - 'Suggestion: the price pane repeats the date tick labels already shown under the
    volume pane; hiding them (labels=False on the top x-axis) would tighten the stack.'
  - 'Suggestion: a named ticker or sector in the title prefix would give the synthetic
    series more context.'
