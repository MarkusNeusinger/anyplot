review:
  strengths:
  - Candle wicks drawn with sns.lineplot units=day_idx and estimator=None, one segment
    per day, colored by the same hue mapping as the volume barplot
  - Volume bars from sns.barplot with hue and saturation=1 match the candle colors
    exactly, and each bar sits beneath its candle
  - Exact 3200x1800 canvas with a 3:1 price/volume split and a shared, rotated date
    axis
  - Theme tokens threaded through sns.set_theme so both renders are fully legible
  - Data story with a downtrend, a mid-series bounce and volume that grows with the
    size of the move
  weaknesses:
  - 'VQ-05 (both): the volume y-axis title ''Volume (M shares)'' at 10 pt is taller
    than the volume pane and runs about 25 % above its top edge, beside the price
    pane''s lower spine → fit it inside the pane''s height (about 8 pt, or a shorter
    title such as ''Volume (M)''). Likely cause: ax_vol.set_ylabel(VOLUME, fontsize=10)
    on a pane only about 1 in tall.'
  - 'Suggestion: a light vertical grid on the date ticks, drawn in both panes, would
    tie the panes together further.'
