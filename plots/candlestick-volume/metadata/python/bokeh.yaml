review:
  strengths:
  - Real datetime x-axis shared through x_range=p_candle.x_range, so every volume
    bar sits exactly beneath its candle and the date ticks format themselves (Jun
    01 2024, Jun 15, ...)
  - A single color column in the ColumnDataSource drives wicks, bodies and volume
    bars, so bar and candle colors always agree
  - Pane split 72/28 with the price pane's x-axis hidden reads as one technical-analysis
    chart
  - Theme tokens threaded through every chrome element; both renders are fully legible
  - HoverTool with datetime and currency formatters plus NumeralTickFormatter('0.0a')
    for compact volume ticks
  weaknesses:
  - 'SC-02 (code): two separate CrosshairTool instances, one per figure, draw a guide
    only inside the hovered pane → one vertical guide spanning both panes at one date
    (C5). Likely cause: CrosshairTool added per figure in the styling loop; share
    one Span(dimension=''height'') overlay through a single CrosshairTool(overlay=(width_span,
    height_span)) added to both figures.'
  - 'VQ-07 (both): a 1px off-theme seam (#C5C5C4 in dark, near-white in light) runs
    across the full canvas width between the two panes and along the top and left
    canvas edges → the page color #1A1A17 / #FAF8F1 everywhere. Likely cause: the
    HTML body/layout background is not themed and the default body margin shows through
    around the column layout.'
  - 'Suggestion: a capital ''M'' (format ''0.0 a'' with a custom suffix or ''0.0a''
    uppercased via a CustomJSTickFormatter) would avoid reading ''m'' as milli.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and both panes; a 1px near-white seam between the panes and at the top/left edge
      Chrome: bold title 'candlestick-volume · python · bokeh · anyplot.ai' top left (~53% width); italic axis titles 'Price (USD)', 'Volume (shares)', 'Date' in dark INK; tick labels in INK_SOFT; date ticks 'Jun 01 2024', 'Jun 15', 'Jul 01', 'Jul 15', 'Aug 01', 'Aug 15' on the shared axis; volume ticks 0.0-4.0m; subtle grid aligned across panes
      Data: 60 candles, up #009E73 and down #AE3030, wicks low-high, bodies open-close, weekend gaps; volume bars beneath each candle in the matching color from a zero baseline; price pane ~72%, volume ~28%
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; a 1px light-gray seam (#C5C5C4) runs across the full width between the panes and along the top/left canvas edge
      Chrome: title and axis titles in light INK, ticks in light INK_SOFT, all clearly readable; no dark-on-dark text; grid subtle but visible
      Data: identical #009E73 / #AE3030 candles and volume bars as the light render; only chrome flips
      Legibility verdict: PASS
