review:
  strengths:
  - Correct imprint_seq fields ramp per theme (mint → green → deep blue → violet light;
    olive → green → pale blue dark) sampled through np.interp into a 1024-entry LUT
  - Smooth normalized-iteration coloring with bailout 256 removes stepped bands; log
    scaling puts the color change onto the boundary
  - Equal Re/Im scale computed from the ranges, so the set is not stretched; coordinate
    ticks with i suffix on the imaginary axis
  - Vectorized NumPy escape-time iteration over a 1400×1000 grid resolves filaments
    and minibrots cleanly
  - Theme tokens threaded to every text node; both renders fully readable
  weaknesses:
  - 'VQ-01 (both): colorbar tick labels at 34 px, the ''In set'' legend label at 32
    px and the ''Im = 0'' / ''Period-2 bulb'' annotations at 25 px sit below the 44
    px legend and 36 px value references beside 44 px ticks → colorbar ticks and legend
    44 px (+10/+12 px), annotations 36 px (+11 px). Likely cause: hard-coded font-size
    values in the colorbar, legend and annotation svg.node calls.'
  - 'VQ-05 (both): the 1.4:1 complex-plane field fills only about the middle 55 %
    of the 2400×2400 canvas height, with empty bands of roughly 330 px above and 480
    px below → use the 3200×1800 landscape canvas so the equal-scale field fills it.
    Likely cause: width=2400, height=2400 with the aspect-preserving plot_h.'
  - 'CQ-01 (code): line 93 `def _draw_heatmap_overlay(self)` holds the whole drawing
    (image, axes, ticks, colorbar, legend) and runs as the `_plot` method of the `_HeatmapGraph`
    class at line 291 → draw at the top level and drop the class. Likely cause: hooking
    the drawing into pygal''s Graph pipeline.'
  - 'LM-01 (code): pygal itself draws nothing: `_HeatmapGraph` stubs the private `_compute*`
    methods with lambdas and every axis, tick and legend is hand-written `svg.node`
    → keep to pygal''s public chart API for chrome where it can, and do not override
    private Graph internals. Likely cause: forcing a raster heatmap through pygal''s
    private rendering pipeline.'
  - 'Suggestion: the Im = 0 hairline label could move to the right edge, away from
    the -2.5 tick column.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "heatmap-mandelbrot · python · pygal · anyplot.ai" in dark ink at the top; italic serif formula subtitle above the plot frame; "Real Axis (Re)" and "Imaginary Axis (Im)" bold dark; ticks at 44 px in INK_SOFT; "Iterations" colorbar at right with log-placed ticks 5-100; "In set" black swatch with ink outline below. Wide empty bands above and below the 1.4:1 field. All text readable.
      Data: exterior on imprint_seq fields light stops — pale mint far from the set, through brand green to deep blue/violet at the boundary; interior solid black. Cardioid, period-2 bulb, secondary bulbs, filaments and the antenna to -2 are clearly resolved. Im = 0 dashed hairline and "Period-2 bulb" annotation (small text).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles and ticks in light tokens, all readable; no dark-on-dark text. Colorbar frame and ticks light.
      Data: imprint_seq fields dark stops — dark olive far exterior, brand green mid, pale blue at the boundary, so the filaments glow; interior black, clearly apart from the exterior. "In set" swatch has a visible 3 px light outline.
      Legibility verdict: PASS
