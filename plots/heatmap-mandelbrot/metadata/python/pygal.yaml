review:
  strengths:
  - Imprint imprint_seq fields ramp per theme sampled through np.interp into a 1024-entry
    LUT, with a solid black interior
  - Smooth normalized-iteration coloring with bailout 256 removes stepped bands; log
    normalization puts the color change on the boundary
  - Equal Re/Im scale computed from pygal's own plot rectangle, so the set is not
    stretched; coordinate ticks with an i suffix via value_formatter
  - pygal.XY with public Style, x_title, y_title, xrange and range draws title, axes,
    ticks and axis titles; landscape canvas filled by the field
  - Vectorized NumPy escape-time iteration over a 1400×1000 grid resolves filaments
    and minibrots cleanly
  - Theme tokens threaded to every text node; both renders fully readable, interactive
    HTML saved alongside the PNG
  weaknesses:
  - 'Suggestion: the y-axis title sits about 250 px left of its tick labels; moving
    it closer would tighten the left side.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white, not dark.
      Chrome: title "heatmap-mandelbrot · python · pygal · anyplot.ai" in dark ink at the top; italic serif formula subtitle "zₙ₊₁ = zₙ² + c · escape time, smooth coloring" in muted ink above the framed field; axis titles "Real Axis (Re)" and "Imaginary Axis (Im)" and coordinate ticks (-2.5…1.0, -1.0i…+1.0i) in dark ink; "Iterations" colorbar at the right with log-placed ticks 5–100 and a black "In set" swatch below it. All text readable.
      Data: 3200×1800 landscape canvas; the equal-scale 1.4:1 field fills the height. Exterior on the imprint_seq fields light stops (pale mint far out, brand green, deep blue and violet at the boundary); interior solid black. Cardioid, period-2 bulb, secondary bulbs, filaments and the antenna to -2 are resolved without seams; faint dashed Im = 0 line labelled at the right edge, "Period-2 bulb" label with a leader line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black, not light.
      Chrome: title, subtitle, axis titles, ticks, colorbar labels and the key in light tokens; no dark-on-dark text. The field and colorbar frames are light.
      Data: same layout; the continuous ramp uses the dark fields stops (olive far out, brand green, pale blue at the boundary) so the filaments glow; interior black, clearly apart; the "In set" swatch carries a visible light outline.
      Legibility verdict: PASS
