review:
  strengths:
  - Correct smooth normalized-iteration computation with a black interior layer
  - Theme tokens threaded through title, axes and legend; readable in both themes
  - Layered interior/exterior rects with tooltips and zoom/pan in the HTML
  weaknesses:
  - 'VQ-07 (both): the exterior uses a two-stop #009E73→#4467A3 ramp, the same in
    both themes → the imprint_seq field stops of each theme. Likely cause: alt.Scale(range=[''#009E73'',
    ''#4467A3'']).'
  - 'SC-02 (light): the interior shows gray-black vertical stripes instead of one
    solid black (C2) → uniform black cells. Likely cause: rects exactly one step wide
    leave anti-aliasing gaps.'
  - 'SC-02 (both): the set is stretched vertically, the cardioid taller than wide,
    because a 3.5x2.5 domain sits in a square 395x395 view (C4) → equal units per
    axis, e.g. a view of about 1.4:1. Likely cause: width=395, height=395.'
  - 'SC-02 (both): regular vertical seams stripe the whole exterior (C5) → a continuous
    pixel field. Likely cause: rect cells exactly one grid step wide rendered by vl-convert
    with sub-pixel gaps.'
  - 'VQ-05 (both): empty bands of about 10 % of the canvas above the title and below
    the x-axis title → let the chart fill the canvas (autosize fit). Likely cause:
    fixed 395x395 view padded onto the 2400x2400 canvas.'
  - 'Suggestion: a horizontal legend under the plot would leave more width for the
    field.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; legend box on elevated #FFFDF6; wide empty bands above the title and below the x-axis title.
      Chrome: mandated title and formula subtitle, axis titles 'Real (Re)' / 'Imaginary (Im)', ticks every 0.5 / 0.2; all readable.
      Data: exterior on a two-stop green→blue ramp, almost entirely green; regular vertical stripes run across the whole field; the interior shows as gray-black vertical stripes rather than solid black; the set is stretched vertically (cardioid taller than wide) by the square view. Vertical gradient legend 'Escape Iterations' at the right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
