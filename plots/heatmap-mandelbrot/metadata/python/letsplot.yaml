review:
  strengths:
  - Exterior colored with the Imprint sequential field ramp in each theme's own stops,
    sampled at 256 steps for scale_fill_gradientn
  - Smooth normalized iteration count (i + 1 − log2 log2|z|) removes stepped bands;
    interior is solid black via na_value
  - coord_fixed keeps the complex plane undistorted, and the one-panel gggrid paints
    the whole canvas in the page color in both themes
  - layer_tooltips with .format()/.line() gives a c = re + im·i readout in the interactive
    HTML
  - 'Full theme-adaptive chrome: title, subtitle, caption, ticks and colorbar box
    all readable on both surfaces'
  weaknesses:
  - 'SC-02 (code): the grid is 800×571 pixels, below the spec''s Data minimum of 800×600
    → at least 600 rows (+29), keeping the aspect with more columns (e.g. 841×600
    or 1050×750). Likely cause: width, height = 800, 571.'
  - 'Suggestion: the light ramp''s navy high end (#002850) sits close to the black
    interior along the boundary; a slightly wider fringe would read more clearly when
    zoomed.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas (measured), no unpainted strips.
      Chrome: bold title 'heatmap-mandelbrot · python · letsplot · anyplot.ai', italic subtitle, muted caption with the formula, 'Real Axis' / 'Imaginary Axis' titles and ticks -2.5..1 / -1..1 in dark ink; colorbar 'Iterations' 20-80 on an elevated box — all readable.
      Data: exterior on the Imprint sequential field ramp, light mint (#66E2B2) far from the set through #009E73 and blue to navy in the thin boundary fringe; interior solid black; cardioid, period-2 bulb, secondary bulbs, filaments and the real-axis antenna resolved, mirror-symmetric, uncropped. Equal axis scales.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full canvas.
