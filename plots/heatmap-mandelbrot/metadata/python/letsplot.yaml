      Data: same layout; exterior on the dark field stops (#00573D deep green → #009E73 → pale blue #CDD9FF in the boundary fringe), which correctly differ from light as a continuous ramp; interior solid black and clearly apart from the fringe.
      Legibility verdict: PASS
