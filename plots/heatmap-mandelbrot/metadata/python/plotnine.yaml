review:
  strengths:
  - Vectorized escape-time computation with a large bailout radius (2**8) so the normalized
    iteration count is continuous across the whole exterior — no stepped bands
  - imprint_seq fields stops chosen per theme through scale_fill_gradientn(values=...),
    so low values recede into the page in both renders
  - na_value paints the never-escaping interior one uniform near-black, cleanly apart
    from the exterior
  - coord_fixed(ratio=1) with expand=(0,0) keeps the complex plane undistorted and
    the field flush with the axes
  - Colorbar breaks placed in log space and labelled with the original iteration counts
    (0, 9, 100)
  weaknesses:
  - 'Suggestion: a fourth colorbar break (e.g. 3 or 30) would make the log scale easier
    to read off.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on a 3200x1800 canvas.
      Chrome: bold dark title 'heatmap-mandelbrot · python · plotnine · anyplot.ai' centered; axis titles Re(c) and Im(c) and tick labels (-2..1, -1.0..1.0) in dark ink, all readable. Colorbar 'Escape Iterations' (0, 9, 100) on an elevated off-white card at the right.
      Data: exterior in the imprint_seq light fields ramp — mid green with a smooth radial gradient, no arc seams, deep blue/violet in the thin boundary fringe; interior near-black #0D0D0A, uniform. Full set with cardioid, period-2 bulb, secondary bulbs, filaments and antenna, mirror-symmetric, not cropped. Italic near-white 'Cardioid' and 'Period-2 Bulb' labels inside the interior at about tick-label size.
      Legibility verdict: PASS

