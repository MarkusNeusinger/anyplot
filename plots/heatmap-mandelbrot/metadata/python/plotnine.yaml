review:
  strengths:
  - Correct vectorized escape-time computation with normalized-iteration smooth coloring
    and a log-spaced fill scale that spreads color across the boundary fringe
  - imprint_seq fields stops chosen per theme through scale_fill_gradientn(values=...),
    so low values recede into the page in both renders
  - na_value paints the never-escaping interior one uniform near-black, cleanly apart
    from the exterior
  - coord_fixed(ratio=1) with expand=(0,0) keeps the complex plane undistorted and
    the field flush with the axes
  - Colorbar breaks placed in log space and labelled with the original iteration counts
    (0, 9, 100)
  weaknesses:
  - 'SC-02 (both): sharp concentric arc seams cross the outer exterior (e.g. the arc
    from about Re -1.6 at the top and bottom edges and the ring around |c|≈2), stepped
    bands between the first whole iteration counts that C3 excludes → continuous transitions
    across the exterior. Likely cause: bailout radius 2 in the smooth formula `i +
    1 - log2(log2|z|)`; escape at a larger radius (e.g. |z| > 2**8) makes the normalized
    count continuous.'
  - 'VQ-01 (both): the ''Cardioid'' and ''Period-2 Bulb'' annotations render at roughly
    6 pt italic, smaller than the 8 pt tick labels they sit beside → at least 8 pt
    (about +2 pt). Likely cause: annotate(size=5) in a scale smaller than element_text
    points.'
  - 'Suggestion: a fourth colorbar break (e.g. 3 or 30) would make the log scale easier
    to read off.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around a 3200x1800 canvas.
      Chrome: bold dark title 'heatmap-mandelbrot · python · plotnine · anyplot.ai' centered; axis titles Re(c) and Im(c) and tick labels (-2..1, -1.0..1.0) in dark ink, all readable. Colorbar 'Escape Iterations' (0, 9, 100) on an elevated off-white card at the right.
      Data: exterior in the imprint_seq light fields ramp — pale mint far from the set, brand green #009E73 nearer, deep blue/violet in the thin boundary fringe; interior near-black #0D0D0A, uniform. Full set with cardioid, period-2 bulb, secondary bulbs, filaments and antenna, mirror-symmetric, not cropped. Faint concentric arc seams in the outer exterior. Small italic near-white labels 'Cardioid' and 'Period-2 Bulb' inside the interior.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink, tick labels in soft light grey — no dark-on-dark text; colorbar card in #242420 with light labels.
      Data: continuous ramp correctly flips to the dark fields stops — dark olive far exterior, brand green mid, pale blue fringe at the boundary; same uniform near-black interior; same arc seams. Brand green clearly visible.
      Legibility verdict: PASS
