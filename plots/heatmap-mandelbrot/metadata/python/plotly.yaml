review:
  strengths:
  - Exterior colored with the theme's imprint_seq fields stops via a stop-position
    colorscale, with a dedicated near-black band for the interior
  - Normalized-iteration smooth coloring with gamma 0.3 gives continuous transitions
    without iteration banding
  - Boundary filaments and minor bulbs are resolved and stand out in the bright end
    of the ramp in both themes
  - Theme tokens thread through title, axes, colorbar and annotations; all text reads
    in both renders
  - Hovertemplate with Re/Im coordinates and HTML zoom make the boundary explorable
    interactively
  weaknesses:
  - 'SC-02 (both): the plot area is about 1367 px wide by 1449 px tall while both
    axes span 3.5 units, so the imaginary axis is stretched by about 6 % and the cardioid
    reads slightly tall → equal scale on both axes (0 % stretch). Likely cause: no
    yaxis scaleanchor=''x'', scaleratio=1; the unequal margins (l=80, r=90, t=80,
    b=70) set the plot area instead.'
  - 'SC-03 (both): the colorbar titled ''Escape count'' is ticked only ''Interior
    / Mid / Boundary'' on a gamma-0.3-normalized scale, so no escape count can be
    read off a color → round escape-count ticks (e.g. 2, 5, 20, 100, 256) placed at
    their normalized positions. Likely cause: colorbar tickvals=[0, 0.5, 1] with qualitative
    ticktext.'
  - 'Suggestion: point the ''Period-2 bulb'' arrow at the bulb''s centre (-1, 0) rather
    than its junction with the period-4 bulb at -1.25.'
  - 'Suggestion: drop the unused ELEVATED_BG token.'
