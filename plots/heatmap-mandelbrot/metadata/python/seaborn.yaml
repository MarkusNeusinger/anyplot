review:
  strengths:
  - Uses the Imprint imprint_seq fields ramp with the correct per-theme stops, so
    the boundary fringe reads dark in light mode and bright in dark mode
  - Smooth normalized-iteration coloring (log2 log2 with bailout 256) leaves no banding
    between iteration counts
  - sns.heatmap mask= hides never-escaping points so the near-black axes face shows
    as one uniform interior color
  - Theme tokens threaded through sns.set_theme and explicit colorbar styling; all
    text readable in both renders
  - Fine 1000x714 grid resolves small bulbs, filaments and the real-axis antenna without
    blockiness
  weaknesses:
  - 'VQ-05 (both): the ''Real Axis'' label sits about 5 px above the bottom canvas
    edge, with no breathing room → at least 25 px clear (+20 px). Likely cause: fig.subplots_adjust(bottom=0.11)
    with xlabel labelpad=10.'
  - 'SC-02 (both): C4 — the axes box is about 1.46:1 while the complex window is 3.5:2.5
    = 1.40:1, so the set is stretched about 4 % horizontally → equal scale on both
    axes. Likely cause: sns.heatmap without square=True (or ax.set_aspect(''equal'')).'
  - 'SC-03 (both): y tick labels read 1.2 / 0.6 / -0.6 / -1.2 at positions whose values
    are 1.25 / 0.625 / -0.625 / -1.25 → labels that state the actual coordinate (e.g.
    ticks at -1.0, -0.5, 0, 0.5, 1.0). Likely cause: f''{v:.1f}'' on np.linspace(y_max,
    y_min, 5).'
  - 'Suggestion: in the light render the dark-violet high end of the ramp sits right
    next to the near-black interior; an interior in a distinct solid color would set
    the boundary apart more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the axes face is the near-black interior color #0A0A08.
      Chrome: title 'heatmap-mandelbrot · python · seaborn · anyplot.ai' in dark ink at the top; 'Real Axis' / 'Imaginary Axis' labels and tick labels (-2.5..1.0, 1.2..-1.2) in dark ink; colorbar 'Escape Iterations' with ticks 5..40 — all readable. 'Real Axis' sits close to the bottom edge but is fully visible.
      Data: exterior in pale mint (#66E2B2 end) darkening through brand green and deep blue to dark violet along the boundary fringe; interior near-black; full cardioid, period-2 bulb, smaller bulbs, filaments and antenna, mirror-symmetric. No categorical series.
