review:
  strengths:
  - Uses the Imprint imprint_seq fields ramp with the correct per-theme stops, so
    the boundary fringe reads dark in light mode and bright in dark mode
  - Smooth normalized-iteration coloring (log2 log2 with bailout 256) leaves no banding
    between iteration counts
  - sns.heatmap mask= hides never-escaping points so the near-black axes face shows
    as one uniform interior color
  - Fine 1000x714 grid resolves small bulbs, filaments and the real-axis antenna without
    blockiness
  - Equal aspect and ticks at round complex-plane coordinates computed from the grid
    step, so the set is undistorted and every tick states its true value
  weaknesses:
  - 'Suggestion: in the light render the dark-violet high end of the ramp sits right
    next to the near-black interior; an interior in a distinct solid color would set
    the boundary apart more.'
  - 'Suggestion: tick labels could use the typographic minus sign (matplotlib''s default
    formatter) instead of the ASCII hyphen from f''{v:.1f}''.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the axes face is the near-black interior color #0A0A08.
      Chrome: title 'heatmap-mandelbrot · python · seaborn · anyplot.ai' in dark ink; 'Real Axis' / 'Imaginary Axis' labels and tick labels (-2.5..1.0 by 0.5, -1.0..1.0 by 0.5) in dark ink; colorbar 'Escape Iterations' 5..40 — all readable, 'Real Axis' well clear of the bottom edge.
      Data: exterior pale mint (#66E2B2 end) darkening through brand green and deep blue to dark violet in the boundary fringe; uniform near-black interior; full cardioid, period-2 bulb, smaller bulbs, filaments and antenna, mirror-symmetric and at equal scale. No categorical series.
