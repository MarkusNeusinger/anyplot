review:
  strengths:
  - 'Efficient, idiomatic technique: renders the 480K-pixel escape-time raster once
    on an offscreen canvas and drops it into ECharts via a custom series + api.coord,
    instead of a huge heatmap series data array'
  - Smooth (continuous) escape-iteration coloring with a gamma curve avoids the discrete
    banding the spec explicitly warns against
  - Correct aspect-ratio preservation of the complex plane and full spec-default ranges/iteration
    count
  - Correct mandated title format; all chrome text (title, subtitle, axis labels,
    ticks) is legible and theme-correct in both renders
  weaknesses:
  - 'Interior ("never escapes") fill color is derived from t.ink (insideRgb = hexToRgb(t.ink)),
    which is theme-adaptive chrome — it renders solid black in the light theme but
    near-white/cream in the dark theme, so the plot''s dominant visual element (main
    cardioid + bulbs, ~35-40% of the plot area) changes character between themes instead
    of staying identical. Fix: use a single fixed color for the interior fill, independent
    of window.ANYPLOT_THEME/t.ink.'
  - No color-scale legend/colorbar ties the gradient to numeric iteration counts (optional,
    would strengthen data storytelling)
  - Design excellence is close to style-guide defaults; nothing distinctively 'designed'
    beyond the mandated color scheme
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "heatmap-mandelbrot · javascript · echarts · anyplot.ai" centered in dark ink; subtitle "Color: smooth escape-iteration count · Solid fill: bounded orbit (never escapes)" in softer gray; axis names "Real axis (Re)" / "Imaginary axis (Im)"; tick labels at 2 decimals. All readable.
      Data: Escaping region is a smooth green-to-blue gradient (Imprint imprint_seq, first color #009E73-ish). Bounded interior (main cardioid, period-2 bulb, satellite bulbs) is solid black.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, axis names and tick labels all rendered in light cream text on the dark background — no dark-on-dark failures.
      Data: Escaping-region gradient is identical to the light render (green-to-blue, same stops). BUT the bounded interior, which was solid black in the light render, is now near-white/cream — it is colored via the theme-adaptive t.ink token instead of a fixed value, so it flips from black to white/cream between themes. This is the plot's largest visual element and it does not stay identical across themes as required.
      Legibility verdict: PASS (chrome text) / FAIL (data-color theme consistency — interior fill not identical to light render)
