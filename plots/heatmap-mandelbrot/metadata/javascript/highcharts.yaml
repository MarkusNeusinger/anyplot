review:
  strengths:
  - New feature callouts ('Cardioid', 'Period-2 bulb') resolve attempt 1's DE-03 weakness
    — a Highcharts renderer 'callout' label shape with a leader line points precisely
    at the cusp/bulb, adding real data storytelling on top of the visual.
  - 'Clever, well-documented workaround for the core-bundle constraint: computes the
    escape-time raster into an off-screen canvas and embeds it as a single renderer.image
    instead of thousands of SVG rects, avoiding both the missing heatmap module and
    a DOM-size/perf problem.'
  - Smooth/continuous escape-time coloring (renormalized iteration count via log-log
    formula) fully satisfies the spec's 'avoid discrete color banding' requirement
    — no visible banding in either render.
  - 'Shows the complete classic view: main cardioid, period-2 bulb, satellite bulbs,
    and the negative-real spike/tendrils, matching the spec''s required features.'
  - Custom-built colorbar (Fast/Slow/In-set) drawn with the Imprint sequential ramp
    (t.seq[0] -> t.seq[1]), correctly distinguishing the continuous escape-time gradient
    from the solid in-set color.
  - Square 2400x2400 canvas achieved cleanly via symmetric margins that force plotWidth
    === plotHeight, so the square complex-plane data maps onto the plot area with
    no distortion.
  - Data raster, colorbar, and callout content are visually identical between light
    and dark renders — only chrome (background, title, axis, callout box fill/border)
    flips, exactly as required.
  weaknesses:
  - 'Header block is missing the mandated ''// License:'' line — prompts/library/highcharts.md
    explicitly requires ''Keep the // License: line in the header block ... so it
    ships in every generated snippet.'' Add e.g. ''// License: Highcharts — commercial
    license, free for non-commercial use (highcharts.com/license)'' after the Library
    line.'
  - The invisible zero-opacity scatter series used purely to force Cartesian axis
    rendering is a clever but non-obvious trick; a one-line comment already explains
    it, but consider whether a lighter-weight axis-forcing approach exists for future
    maintainers.
  - Several helper functions (hexToRgb, clearDrawn, drawAll, addCallout) push structure
    beyond the simplest possible KISS shape — justified here by the raster + custom-colorbar
    + callout requirements, but worth flagging since most highcharts snippets in this
    catalog are flatter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matching the required light chrome surface.
      Chrome: Bold black title "heatmap-mandelbrot · javascript · highcharts · anyplot.ai" centered at top, gray subtitle "z(n+1) = z(n)² + c · max iterations = 100" below it, dark axis titles "Re(c)" / "Im(c)", gray tick labels on both axes, gray "Iterations" colorbar label with "Fast"/"Slow"/"In set" swatch labels on the right. Two new callout boxes (white fill, dark border, dark text) with leader lines: "Cardioid" pointing into the cusp of the main cardioid, and "Period-2 bulb" pointing into the circular bulb to its left. All text clearly legible against the light background.
      Data: The full Mandelbrot set rendered as a dense raster — solid black cardioid and period-2 bulb (and smaller satellite bulbs) surrounded by a green (#009E73) field that blends toward blue (#4467A3) near the fractal boundary via smooth/continuous escape-time coloring. First/near-boundary color is Imprint green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the required dark chrome surface.
      Chrome: White title, light-gray subtitle, light axis titles and tick labels, light-gray colorbar labels — same layout and content as the light render. The two callout boxes now flip to a dark fill with a light border and light text, so they remain legible against the dark surface (no dark-on-dark).
      Data: Identical raster to the light render — black in-set regions, same green-to-blue continuous gradient for escape-time coloring. Only chrome (background, text colors, axis line colors, callout box fill/border) flipped; no shift in data colors.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text, including the new callout labels, reads clearly against the near-black surface.
