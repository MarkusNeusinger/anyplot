review:
  strengths:
  - Correctly works around Chart.js's lack of a native heatmap/matrix type by using
    the library's own `plugins` afterDraw hook to paint a raster onto a real linear
    scatter coordinate system — no forbidden community plugin, honest complex-plane
    axes with true Re(c)/Im(c) tick values.
  - Smooth (continuous) escape-time coloring with a gamma-lift (`Math.pow(ft, 0.6)`)
    avoids the discrete color banding the spec explicitly warns against.
  - Correct Imprint `imprint_seq` continuous colormap (green→blue) with the right
    single-polarity semantics for escape-time data; data colors are pixel-identical
    between light and dark renders, chrome is theme-correct in both.
  - Precomputed 256-step palette lookup table (`buildPalette`) keeps the per-pixel
    hot loop free of hex parsing — clean, deliberate engineering for a computationally
    heavy render.
  - Widens only the real-axis range to match the chart area's aspect ratio (never
    touching the imaginary range), directly satisfying the spec's 'aspect ratio should
    preserve the mathematical proportions of the complex plane' requirement.
  - Hand-built colorbar + solid-black 'in the set' swatch clearly communicates the
    escape-time scale despite Chart.js having no native colorbar/heatmap legend.
  weaknesses:
  - Title occupies only ~30-35% of the canvas width — well under the 50-70% the style
    guide targets for a title of this length. At 22px it reads a bit small relative
    to the 3200x1800 canvas; bumping to ~26-28px would give it more visual weight
    without risking overflow.
  - X-axis ticks show irregular, non-round endpoint values (-3.59, 2.09) produced
    by the aspect-preserving range widening — consider an explicit tick step (e.g.
    `ticks.stepSize`) so the extremes read as clean numbers instead of auto-generated
    decimals.
  - No callout/annotation names the cardioid or the period-2 bulb even though the
    spec frames this as a teaching visualization — a small text label pointing at
    each would raise the educational value and give the plot a clearer visual hierarchy/focal
    point.
  - The colorbar width is capped at `min(420, areaW*0.4)`, which looks a little small
    relative to how much canvas width is available on a 3200px-wide render — could
    grow slightly for better balance with the chart above it.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "heatmap-mandelbrot · javascript · chartjs · anyplot.ai" in bold dark ink at top-center; "Real axis — Re(c)" / "Imaginary axis — Im(c)" axis titles in dark ink; tick labels (-3.59 to 2.09 on x, -1.25 to 1.25 on y) in a softer dark gray; a thin dark frame encloses the plot area (all four spines, intentional for the enclosed heatmap grid). All chrome text is clearly readable against the light background.
      Data: The full Mandelbrot set is rendered — large cardioid, period-2 bulb on top/bottom, smaller bulb to the left, plus fine self-similar boundary detail. Escape-time region is a smooth green-to-blue gradient (Imprint imprint_seq, brand green #009E73 at 0 escape iterations transitioning to blue at 100+). Points inside the set (never escape) are solid black, per spec. A colorbar gradient + black swatch legend sits below the plot, labeled "Escape iterations (smooth-colored)" with "0" / "100+" endpoints and "In the set (bounded, never escapes)".
      Legibility verdict: PASS — all text is clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white against the dark background; frame border rendered in a light soft tone. All chrome text reads clearly, no dark-on-dark failures observed.
      Data: Identical green-to-blue gradient and black "in-set" region as the light render — data colors are pixel-for-pixel unchanged, confirming only chrome flipped between themes. The fractal shape (cardioid, period-2 bulb, boundary fringe) matches the light render exactly.
      Legibility verdict: PASS — all text and legend elements are legible against the dark surface; brand green remains vivid on the dark background.
