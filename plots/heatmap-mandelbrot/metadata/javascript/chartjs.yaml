review:
  strengths:
  - 'All four weaknesses from the attempt-1 review are directly addressed: title font
    bumped 22px→28px and now sits at a legible ~44% of canvas width, x-axis ticks
    use an explicit stepSize so endpoints read as clean integers (-3… 2) instead of
    aspect-widened decimals (-3.59, 2.09), leader-line callouts now label the Cardioid
    and Period-2 bulb, and the colorbar cap was widened (420→560px) for better balance
    under the chart.'
  - Correctly works around Chart.js's lack of a native heatmap/matrix type by using
    the library's own `plugins` afterDraw hook to paint a raster onto a real linear
    scatter coordinate system — no forbidden community plugin, honest complex-plane
    axes with true Re(c)/Im(c) tick values.
  - Smooth (continuous) escape-time coloring with a gamma-lift (`Math.pow(ft, 0.6)`)
    avoids the discrete color banding the spec explicitly warns against.
  - Correct Imprint `imprint_seq` continuous colormap (green→blue) with the right
    single-polarity semantics for escape-time data; data colors are pixel-identical
    between light and dark renders, chrome is theme-correct in both.
  - Widens only the real-axis range to match the chart area's aspect ratio (never
    touching the imaginary range), directly satisfying the spec's 'aspect ratio should
    preserve the mathematical proportions of the complex plane' requirement.
  - New callouts anchor at mathematically verified points (-0.3, 0.35 inside the cardioid;
    -1, 0.2 inside the period-2 bulb) with leader lines that don't collide with any
    other chrome, raising the educational value of the teaching-tool framing.
  weaknesses:
  - Title still occupies only ~44% of canvas width — better than attempt 1's ~30-35%
    but still under the 50-70% soft target. Not a deduction-worthy overflow/squeeze
    case per the style guide's counter-example rule, but there is still headroom to
    grow the fontsize a couple more points for extra visual weight.
  - The `hexToRgb`/`buildPalette`/`renderMandelbrot`/`drawCallout` helper-function
    split is a deviation from strict single-block KISS structure; justified by the
    per-pixel computation but keeps CQ-01 shy of full marks.
  - LM-02 (Distinctive Features) is solid but not maximal — the canvas-overlay-on-real-axes
    technique is clever, but nothing here is unique to Chart.js beyond its plugin/draw-hook
    API (the same raster-overlay trick would work in any canvas-based library).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark-ink title "heatmap-mandelbrot · javascript · chartjs · anyplot.ai" centered at top (~44% of canvas width, no overflow/clipping). "Real axis — Re(c)" / "Imaginary axis — Im(c)" axis titles in dark ink. Tick labels are now clean round integers/decimals (-3, -2, -1, 0, 1, 2 on x; 1.25, 1.00, 0.50, 0.00, -0.50, -1.00, -1.25 on y) — fixed from attempt 1's irregular aspect-widened endpoints. A thin dark frame encloses the plot area on all four sides (intentional, reads well for an enclosed heatmap grid). Two new leader-line callouts labeled "Cardioid" and "Period-2 bulb" point into the correct fractal structures without overlapping any other element. All chrome text is clearly readable against the light background.
      Data: Full Mandelbrot set rendered — large cardioid, period-2 bulb top/bottom, smaller bulb to the left along the real axis, plus fine self-similar boundary fringe detail. Escape-time region is a smooth green-to-blue gradient (Imprint imprint_seq, brand green #009E73 at 0 escape iterations transitioning to blue at 100+), no banding. Points inside the set (never escape) are solid black, per spec. A colorbar gradient + black swatch legend sits directly below the plot, labeled "Escape iterations (smooth-colored)" with "0" / "100+" endpoints and "In the set (bounded, never escapes)".
      Legibility verdict: PASS — all text and legend elements are clearly readable, no light-on-light issues, no edge clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Identical title, axis titles, tick labels, and callout text, all rendered in light ink/off-white against the dark background; the enclosing frame border switches to a light soft tone. No dark-on-dark failures — every label is clearly legible against the dark surface.
      Data: Identical green-to-blue gradient and black "in-set" region as the light render — confirms only chrome flipped between themes, data colors are pixel-for-pixel unchanged. The fractal shape, callout leader lines, and colorbar all match the light render exactly in position and content.
      Legibility verdict: PASS — all text and legend elements legible against the dark surface; brand green remains vivid on the dark background.
