review:
  strengths:
  - Smooth (renormalized) escape-time coloring avoids discrete banding, and the gamma=0.42
    curve pulls filamentary boundary detail out of what would otherwise be a flat
    green field — genuinely thoughtful use of the sequential ramp.
  - 'Clean creative solution to the community-only constraint: MUI X''s Heatmap is
    Pro-only, so the fractal is rasterized onto a plain <canvas> sized/positioned
    via useDrawingArea() to exactly fill the real ChartContainer axes rectangle —
    axes, ticks and legend stay genuine MUI X/Imprint pieces.'
  - Full classic Mandelbrot silhouette (main cardioid + period-2 bulb + surrounding
    satellite bulbs and filaments) is clearly visible and well-composed within the
    cropped square window.
  - Custom legend clearly separates the continuous escape-time gradient from the discrete
    'bounded (never escapes)' swatch, with readable end labels ('fast escape' / 'slow
    escape') and no overlap with the plot or axis chrome.
  - Title format, axis labeling (Re(c)/Im(c) with proper math notation), and deterministic/seed-free
    computation all match spec and code-quality expectations.
  weaknesses:
  - Y-axis label 'Im(c)' collides with the '0.0' tick label in BOTH renders — the
    label's closing parenthesis and 'c' glyph visually merge with the '0' digit right
    at the vertical center of the axis. Confirmed by pixel-level crop of both plot-light.png
    and plot-dark.png at the y=0.0 tick. Increase the y-axis label's offset from the
    tick labels (e.g. via ChartsYAxis's axis `labelStyle`/margin/tickLabelStyle padding
    or a larger left margin allocation) so the rotated label clears the widest tick
    text ('-0.2'/'0.2') with visible whitespace.
  - The 'bounded (never escapes)' interior fill is built from `t.ink`, a theme-adaptive
    CHROME token, not a fixed data value — so the fractal's interior renders solid
    black in the light theme but solid near-white/cream in the dark theme. This breaks
    the hard rule that data colors (here, the escape-time series including its bounded-point
    sentinel) must stay identical between themes; only chrome (background, text, grid)
    should flip. Fix by picking one fixed hex for the interior (e.g. a constant near-black,
    independent of ANYPLOT_THEME) and keeping it identical across plot-light.png and
    plot-dark.png — the legend swatch should follow the same fixed color.
  - 'The complex-plane window was narrowed from the spec''s default (x: -2.5 to 1.0)
    to (x: -2.0 to 0.5) to force a square aspect ratio; while the cardioid and period-2
    bulb are fully captured, this sits right at the edge of clipping the spec-mentioned
    needle tip at Re(c)=-2 and diverges from the documented default range without
    it being strictly necessary (a wider landscape canvas could have preserved the
    spec''s default window).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "heatmap-mandelbrot · javascript · muix · anyplot.ai" and subtitle centered above the plot, both clearly readable dark-on-cream. X-axis "Re(c)" and Y-axis "Im(c)" labels and tick labels are dark/soft-gray and legible EXCEPT the y-axis label visually overlaps the "0.0" tick label at the vertical center (the "c" of "Im(c)" merges into the "0" glyph) — a real collision, not just proximity. Legend below the plot ("Escape-time colour scale", the green-to-blue gradient bar, "fast escape"/"slow escape" end labels, and the "bounded (never escapes)" swatch + caption) is cleanly laid out with no overlap anywhere.
      Data: Continuous escape-time gradient runs brand green (#009E73, fast escape near the boundary) to blue (slow escape, near-boundary halo), matching imprint_seq. The bounded interior (main cardioid, period-2 bulb, satellite bulbs) is solid black. Full classic Mandelbrot silhouette is visible with filamentary boundary detail pulled out by the gamma-adjusted ramp.
      Legibility verdict: FAIL — the y-axis label/tick-label overlap at "0.0" is a real, visible collision in the busiest reading zone of the axis (confirmed via pixel crop).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light ink, clearly readable against the dark background. Tick labels and axis labels are light-gray/soft-white and legible against dark, EXCEPT the same y-axis label/"0.0" tick collision reproduces here too (light-on-dark glyphs overlapping, same location as the light render). No dark-on-dark failures — all chrome text is appropriately inverted for the dark surface. Legend is unchanged in layout and fully readable.
      Data: Green-to-blue escape-time gradient is pixel-identical to the light render, as required. However, the bounded interior fill is NOT identical between renders — it renders solid near-white/cream here (versus solid black in light), because the implementation sources this fill from the theme-adaptive `ink` token instead of a fixed data color. This is a palette-compliance violation: data colors (including the bounded-point sentinel) must stay constant across themes; only chrome should flip.
      Legibility verdict: FAIL — same axis-label/tick-label overlap as the light render, plus the interior fill color inconsistency (a palette-compliance issue, not a legibility one, but it does mean the "distinct solid color" required by the spec for the interior differs by theme).
