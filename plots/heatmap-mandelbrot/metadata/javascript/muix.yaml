review:
  strengths:
  - 'Composes the plot natively in MUI X: a ChartsContainer with linear real/imaginary
    axes and a custom layer that reads useDrawingArea(), so the fractal canvas sits
    exactly inside the axis-scaled drawing area and the tick coordinates are true
    complex-plane coordinates'
  - 'Equal complex-plane scale enforced in code: the margin is derived from (X_MAX−X_MIN)/(Y_MAX−Y_MIN),
    so 0.2 units span the same ~113 px on both axes and the cardioid and period-2
    bulb are undistorted'
  - 'Smooth normalized iteration count (n + 1 − log2(log|z|)) with the Imprint seq
    ramp (#009E73 → #4467A3) gives continuous exterior transitions with no stepped
    bands; data colors are identical in both themes'
  - 'Full set resolved at device-pixel resolution (~2200 px canvas): cardioid, period-2
    bulb, period-3 bulbs, satellite bulbs at −1.75 and filament specks are crisp and
    mirror-symmetric about the real axis'
  - 'Mathematically correct geometry: cardioid cusp at Re = 0.25, period-2 bulb spanning
    −1.25 to −0.75, antenna tip at Re = −2.0, all inside the window'
  - Theme tokens threaded through all chrome (title, subtitle, ticks, axis titles,
    legend labels, frame) so both renders are fully legible
  weaknesses:
  - 'Suggestion: the escape-time color bar is a hand-built SVG linearGradient; MUI
    X''s ContinuousColorLegend driven by a zAxis colorMap could carry it natively.'
  - 'Suggestion: about 120 px of empty page below the legend row could go to the drawing
    area or be balanced against the top margin.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around a square plot area framed by a thin grid-colored rule.
      Chrome: bold dark title "heatmap-mandelbrot · javascript · muix · anyplot.ai" (~45 % of width), a soft-ink subtitle with the iteration formula, ranges and max 100 iterations; tick labels −2.0…0.4 (x) and −1.2…1.2 (y) in soft ink; axis titles "Real Part Re(c)" and "Imaginary Part Im(c)". All readable.
      Data: Mandelbrot set over Re ∈ [−2.0, 0.5], Im ∈ [−1.25, 1.25] with equal axis scale; near-black (#1A1A17) interior of cardioid, period-2 bulb, period-3 bulbs and satellites; exterior colored from brand green #009E73 (fast escape) through teal to the blue end #4467A3 in a thin fringe along the boundary, smooth with no banding. Legend row below: gradient bar "Smooth escape-time scale (1–100 iterations)" with "Fast escape (1)" / "Slow escape (100)", and a black swatch "Bounded interior – Never escapes (|z| ≤ 2)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
