review:
  strengths:
  - 'Y-axis label/tick collision from Attempt 1 is fixed: ''Im(c)'' now sits clear
    of the ''0.0'' tick label with visible whitespace in both themes'
  - Bounded-interior fill is now a fixed hex (#1A1A17) instead of the theme-adaptive
    `ink` token, so the data color is identical between light and dark; a theme-adaptive
    stroke keeps the legend swatch visible even when the fill matches the dark page
    background
  - Smooth (renormalized) escape-time coloring with a gamma=0.42 curve pulls filamentary
    boundary detail out of the ramp instead of leaving a flat green field
  - 'Clever, well-integrated solution to the community-only Heatmap gap: fractal rasterized
    onto a `<canvas>` sized/positioned via `useDrawingArea()` to exactly fill the
    real MUI X axes rectangle'
  - Full classic Mandelbrot silhouette (cardioid, period-2 bulb, satellites) clearly
    visible and well-composed
  - Correct title format, descriptive Re(c)/Im(c) axis labels, deterministic computation
  weaknesses:
  - 'Plotted window is still narrowed from the spec''s default (x: -2.5 to 1.0) to
    (x: -2.0 to 0.5) to force a square aspect ratio — captures the cardioid/bulb fine
    but diverges from the documented default (minor, unresolved from Attempt 1)'
  - A modest strip of empty whitespace remains below the legend swatch at the bottom
    of the canvas
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Bold dark title "heatmap-mandelbrot · javascript · muix · anyplot.ai" with subtitle "z(n+1) = z(n)² + c · escape-time coloured over the complex plane", both clearly readable. Re(c)/Im(c) axis labels and tick labels are dark/soft-gray and legible. The Attempt-1 y-axis label/"0.0" tick collision is fixed: a pixel-level crop around the vertical center confirms "Im(c)" now sits with clear whitespace to the left of the tick labels, no merging. Legend below (gradient bar, "fast escape"/"slow escape", "bounded (never escapes)" swatch) is cleanly laid out with no overlap; the swatch renders as a solid near-black square with a thin dark border.
      Data: Continuous escape-time gradient runs brand green → blue (imprint_seq). Bounded interior (cardioid, period-2 bulb, satellites) is solid near-black (#1A1A17), full classic Mandelbrot silhouette with filament detail pulled out by the gamma-adjusted ramp.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Title/subtitle/axis text correctly inverted to light ink, no dark-on-dark failures. Same y-axis label region checked via pixel-level crop: "Im(c)" and "0.0" no longer collide — clear gap visible, same fix holds in this theme. Legend swatch for "bounded" now renders as an outline-only square (light-ink stroke) because its fixed fill color (#1A1A17) matches the dark page background — this is the intended behavior for keeping the underlying data color identical across themes; the stroke (theme-adaptive chrome) keeps it visible.
      Data: Green → blue escape-time gradient is pixel-identical to the light render. Bounded-interior fill is now the same fixed hex in both renders (verified via source: INTERIOR_HEX = "#1A1A17" is a hard-coded constant, no longer sourced from the theme-adaptive `t.ink` token) — the Attempt-1 VQ-07 issue (black in light vs. near-white in dark) is resolved.
      Legibility verdict: PASS
