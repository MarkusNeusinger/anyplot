review:
  strengths:
  - 'Directly addressed prior review feedback: lowered COLOR_GAMMA from 0.45 to 0.3,
    spreading more perceptual detail across the escape zone near the fractal boundary
    (confirmed via close-up inspection: a smooth, banding-free gradient from teal
    to blue right at the boundary)'
  - Added landmark annotations for the 'Main cardioid' and 'Period-2 bulb' with leader
    lines and dynamically-sized pill labels (via getBBox), directly satisfying the
    spec's call-out of these two features and strengthening data storytelling
  - 'Unified font sizing: colorbar tick labels now match the main axis tick labels
    (14px), fixing the previous size imbalance'
  - Correct Mandelbrot math with smooth (renormalized) escape-count coloring that
    avoids discrete banding; the colorbar gradient uses the same gamma contrast curve
    as the raster so the legend accurately represents the displayed colors
  - Data-aspect-preserving layout keeps the bulbs circular, precomputed 256-step LUT
    keeps the hot per-pixel loop free of string allocation, and theme-adaptive chrome
    is threaded through every text/stroke element
  weaknesses:
  - The far-field background (most of the canvas area away from the fractal boundary)
    is still a near-uniform flat green — pixel sampling confirms RGB shifts by only
    a few units across hundreds of pixels. This is largely inherent to Mandelbrot
    escape-time coloring at this zoom level, since most background points escape within
    1-3 iterations; further improvement would need a fundamentally different remap
    (e.g. per-region log-log normalization) rather than a simple gamma tweak
  - Only two landmark annotations are present ('Main cardioid', 'Period-2 bulb');
    a callout on one of the visible satellite bulbs or a brief note on the smooth-coloring
    technique itself could deepen the storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills the canvas outside the plot frame, consistent with the light theme spec.
      Chrome: Title "heatmap-mandelbrot · javascript · d3 · anyplot.ai" in dark bold text at top, clearly readable and comfortably sized (~53% of canvas width). "Real Axis — Re(c)" and "Imaginary Axis — Im(c)" axis labels plus numeric tick labels (-2.5 to 1.0 / -1.25 to 1.25) render in dark ink, fully legible against the light background. A thin frame outlines the raster. A colorbar on the right, labeled "Escape iterations" with ticks 0-100, uses dark tick labels at the same 14px size as the main axis ticks — all readable, no clipping near the right or top canvas edges (verified by close crop of the "100" tick).
      Data: The fractal interior (points that never escape) is filled solid near-black, standing out sharply against the surrounding green-to-blue gradient. The main cardioid and period-2 bulb are explicitly labeled with leader-line callouts on pill-shaped backgrounds ("Main cardioid", "Period-2 bulb"), plus visible satellite bulbs and filament/seahorse-valley detail along the boundary. A close-up crop of the boundary confirms a smooth, banding-free gradient from teal to blue right at the escape edge. The far-field background is a near-uniform brand green — confirmed by pixel sampling (RGB shifts only a few units across hundreds of pixels) — which is an inherent property of Mandelbrot escape coloring at this zoom rather than an implementation defect.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the canvas outside the plot frame, consistent with the dark theme spec.
      Chrome: Same title, axis labels, tick labels, and annotation pill labels now render in light/off-white text, clearly legible against the dark background. The colorbar frame, its "Escape iterations" label, and tick values are also rendered in light ink and fully readable, with no clipping at the top-right "100" tick (verified by close crop).
      Data: The fractal raster itself (green background, black interior, blue boundary ring, landmark markers) is pixel-identical to the light render — only the surrounding chrome (background, text, frame stroke color, annotation pill fill) flipped to the dark-theme tokens. The brand green base color and black "inside the set" fill are unchanged, confirming data-color consistency across themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, colorbar, and annotation text is clearly visible against the dark background.
