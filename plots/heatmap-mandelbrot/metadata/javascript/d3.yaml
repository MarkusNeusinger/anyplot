review:
  strengths:
  - Correct Mandelbrot math with smooth (renormalized) escape-count coloring that
    avoids discrete banding, exactly matching the spec's smoothing requirement
  - Data-aspect-preserving layout keeps the bulbs circular instead of stretching the
    fractal to fill the mount
  - Theme-adaptive chrome is threaded through every text/stroke element via tok.*,
    and the colorbar gradient uses the same t^0.45 contrast curve as the raster so
    the legend accurately represents the displayed colors
  - Precomputed 256-step LUT keeps the hot per-pixel loop free of string allocation/parsing
    — a genuinely performance-conscious technique
  - Correct title format, descriptive Re(c)/Im(c) axis labels, and imprint_seq (green→blue)
    used correctly for the continuous escape-iteration scale per the style guide
  weaknesses:
  - The two-stop green-to-blue ramp combined with most background points escaping
    in 1-2 iterations leaves most of the canvas a flat, near-uniform green field,
    with visual interest concentrated in a thin ring near the fractal boundary — consider
    a lower gamma exponent (below 0.45) or a non-linear iteration remap to spread
    more perceptual detail into the escape zone
  - No annotation calls out the cardioid or the visible period-2 bulb even though
    the spec highlights them as notable features — a small label or leader line would
    strengthen data storytelling
  - Colorbar tick/label text (13px) is the smallest text in the composition; nudging
    it up 1-2px would balance it better against the 16px axis labels
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) fills the canvas outside the plot frame, consistent with the light theme spec.
      Chrome: Title "heatmap-mandelbrot · javascript · d3 · anyplot.ai" in dark bold text at top, clearly readable. "Real Axis — Re(c)" and "Imaginary Axis — Im(c)" axis labels and numeric tick labels (-2.5 to 1.0 / -1.25 to 1.25) all render in dark ink, clearly legible against the light background. A thin frame outlines the raster. A colorbar on the right, labeled "Escape iterations" with ticks 0-100, uses dark tick labels — all readable.
      Data: The fractal interior (points that never escape) is filled solid near-black, standing out sharply against the surrounding green-to-blue gradient. The main cardioid and period-2 bulb, plus smaller satellite bulbs and filament detail along the boundary, are all clearly visible. Background field (points outside the set) is mostly uniform brand green (#009E73), with a thin band shifting toward blue right at the escape boundary — matching the imprint_seq sequential ramp.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) fills the canvas outside the plot frame, consistent with the dark theme spec.
      Chrome: Same title, axis labels, and tick labels now render in light/off-white text, clearly legible against the dark background. The colorbar frame and its "Escape iterations" label and tick values are also rendered in light ink and are fully readable.
      Data: The fractal raster itself (green background, black interior, blue boundary ring) is pixel-identical to the light render — only the surrounding chrome (background, text, frame stroke color) flipped to the dark-theme tokens. The brand green base color and black "inside the set" fill are unchanged, confirming data-color consistency across themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and colorbar text is clearly visible against the dark background.
