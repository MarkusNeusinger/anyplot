review:
  strengths:
  - Applies the imprint_seq fields stops per theme, so the boundary glows dark-violet
    on light and pale-blue on dark while the far exterior recedes into the page
  - Smooth normalized iteration count (escape + 1 − log2(log2|z|)) removes integer
    banding; exterior transitions are continuous in both renders
  - geom_raster(interpolate = TRUE) with coord_fixed(ratio = 1) keeps the complex
    plane undistorted and the pixel grid seamless
  - Interior carried by the fill scale's na.value as one solid near-black, uniform
    and clearly apart from the exterior
  - Vectorized escape loop that shrinks the active set each iteration
  weaknesses:
  - 'VQ-05 (both): the 3.5:2.5 complex-plane panel sits on the square 2400x2400 canvas,
    leaving empty page bands of about 20 % of the height above the title and below
    the x-axis title → use the landscape canvas 3200x1800 so the panel fills the width
    and height. Likely cause: ggsave width = 6, height = 6.'
  - 'SC-03 (both): colour-bar ticks 5 and 10 are square roots of the smooth escape
    count, so a reader cannot read an iteration count off the bar → map the smooth
    count itself and let the scale transform it, with breaks in iterations (e.g. 10,
    50, 100, 200). Likely cause: esc = sqrt(escape_smooth) instead of trans = "sqrt"
    in scale_fill_gradientn.'
  - 'DQ-03 (code): the grid is 800x572, below the spec''s 800x600 minimum resolution
    (−28 rows) → at least 840x600 at the same 3.5:2.5 aspect. Likely cause: NX = 800,
    NY = 572.'
  - 'Suggestion: a legend title that names the quantity in words (''Escape iterations'')
    reads more clearly than ''Escape (√)''.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; panel filled edge to edge by the raster.
      Chrome: bold dark title 'heatmap-mandelbrot · r · ggplot2 · anyplot.ai', 'Real axis' / 'Imaginary axis' in dark ink, ticks -2..1 and -1.0..1.0 in soft ink, framed colour bar 'Escape (√)' with ticks 5 and 10. All readable. The landscape panel leaves wide empty page bands above the title and below the x-axis title on the square canvas.
      Data: far exterior pale mint, darkening to brand green and deep blue/violet in a thin fringe at the boundary; filaments, satellite bulbs and the real-axis antenna resolved; interior solid near-black.
