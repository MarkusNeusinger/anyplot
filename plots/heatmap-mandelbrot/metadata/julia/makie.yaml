review:
  strengths:
  - Smooth normalized iteration count with a 256 bailout radius gives continuous exterior
    transitions without bands or the arc near |c| = 2
  - Log-scaled colorrange with power-of-two ticks makes the colorbar readable in escape
    iterations while concentrating the ramp on the boundary fringe
  - 'nan_color = #0A0A0A draws the set interior as one solid near-black directly through
    heatmap!, distinct in both themes'
  - DataAspect() plus colsize! with Aspect keeps the complex plane at one scale and
    places the colorbar right against the field
  - imprint_seq fields stops per theme and fully theme-adaptive chrome; readable in
    both renders
  weaknesses:
  - 'Suggestion: the colorbar label at 12 pt could match the 14 pt axis titles for
    a more even hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the plot; top/right spines off, no grid on the field.
      Chrome: title 'heatmap-mandelbrot · julia · makie · anyplot.ai' in dark ink at top centre; 'Re(c)' and 'Im(c)' axis titles with ticks -2, -1, 0, 1 and -1.0..1.0 in dark grey; colorbar right against the field, labelled 'Smoothed escape iteration (log scale)' with ticks 4, 8, 16, 32, 64, 128, 256. All readable.
      Data: full Mandelbrot set with cardioid, period-2 bulb, smaller bulbs, filaments and the antenna to -2, mirror-symmetric and uncropped; interior solid near-black; exterior a continuous imprint_seq fields ramp from pale mint far away through brand green #009E73 to deep blue/violet in a thin fringe at the boundary; no bands, seams or arcs.
      Legibility verdict: PASS

