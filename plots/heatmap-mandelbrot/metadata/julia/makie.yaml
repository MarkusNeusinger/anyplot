review:
  strengths:
  - Uses the Imprint sequential fields ramp with each theme's own stops (pale mint
    to dark violet on light, dark olive to pale blue on dark)
  - 'nan_color = #0A0A0A renders the whole set interior as one solid color straight
    from heatmap!'
  - DataAspect() keeps Re and Im on one scale, so the cardioid and bulbs are undistorted
  - Smooth normalized iteration count iter + 1 - log2(log2|z|) avoids integer banding
  - All chrome threaded through INK / INK_SOFT; legible in both themes
  weaknesses:
  - 'VQ-05 (both): the DataAspect axis is narrower than its layout cell, leaving about
    350 px of empty page between the heatmap''s right edge (x about 2700 px) and the
    colorbar (x about 3050 px) plus a wide left margin → close the gap so heatmap
    and colorbar span the canvas width. Likely cause: Axis(aspect = DataAspect())
    in fig[1, 1] without resize_to_layout!(fig) or a colsize!/colgap! on the layout.'
  - 'SC-02 (both): escape = mod(smooth, 8)/8 wraps a non-cyclic sequential ramp every
    8 iterations, so the color jumps from its high end (#351E45 light, #CDD9FF dark)
    straight back to its low end, drawing hard seams along the boundary fringe, and
    a sharp arc near |c| = 2 comes from the small bailout radius → map the smoothed
    count monotonically (for example log(smooth) / log(MAX_ITER)) and bail out at
    a larger radius (|z|^2 > 256^2) so transitions stay continuous (C3). Likely cause:
    mod(smooth, 8.0) / 8.0 and the zx2 + zy2 > 4.0 test.'
  - 'SC-03 (both): the colorbar runs 0.0-1.0 under ''Escape speed'', a fraction of
    an 8-iteration cycle, so no escape count can be read off it → ticks in smoothed
    iteration counts. Likely cause: the cyclic normalisation with colorrange = (0.0,
    1.0).'
  - 'Suggestion: drop the unused ELEVATED_BG constant.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the plot; no grid, top/right spines off.
      Chrome: title 'heatmap-mandelbrot · julia · makie · anyplot.ai' in dark ink at top center; 'Re(c)' / 'Im(c)' axis titles and tick labels (-2, -1, 0, 1; -1.0..1.0) in dark grey; colorbar 'Escape speed' 0.0/0.5/1.0 at the far right. All readable.
      Data: full Mandelbrot set, interior solid near-black; exterior in the light imprint_seq field ramp (pale mint, brand green #009E73, deep blue, violet) with a dark navy/violet fringe abutting pale mint at the boundary where the mod-8 cycle wraps, and faint concentric arcs near |c|=2. Set mirror-symmetric, uncropped; about 350 px of empty page between heatmap and colorbar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink; ticks and colorbar text in light grey INK_SOFT; no dark-on-dark text.
      Data: same set geometry and black interior; exterior uses the dark field stops (dark olive -> brand green -> pale blue #CDD9FF), so the boundary glows pale blue next to olive at the wrap seam. Continuous ramp correctly takes the dark stops; no categorical colors.
      Legibility verdict: PASS
