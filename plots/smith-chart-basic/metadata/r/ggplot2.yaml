review:
  strengths:
  - 'Physically correct series-RLC antenna model: resonance exactly at 2 GHz lands
    near the centre (Γ ≈ -0.05), capacitive below and inductive above the real axis'
  - 'Correct Smith geometry: r circles at r/(1+r) with radius 1/(1+r), reactance arcs
    clipped to the unit disc, coord_fixed keeps the boundary a true circle'
  - Theme tokens threaded through every text and grid layer; both renders fully readable
  weaknesses:
  - 'VQ-02 (both): ''VSWR = 2'' is grazed by the -0.2 reactance arc, the resistance
    labels ''0.5'' and ''2'' are crossed by the dashed VSWR circle and ''1'' by the
    r=1 circle → place each resistance label in a gap clear of the other lines (e.g.
    above the axis on its own circle) and the VSWR label where no arc passes. Likely
    cause: annotate(''text'', y = -0.03) and the VSWR label at (-0.37, -0.2).'
  - 'VQ-05 (both): xlim = c(-1.15, 1.35) is asymmetric, so the disc sits left of centre
    with an empty band on the right and the Cartesian tick labels float ~0.15 units
    away from the disc → symmetric limits hugging the unit circle (about ±1.1). Likely
    cause: coord_fixed(xlim = c(-1.15, 1.35)).'
  - 'SC-02 (both): Cartesian axes are drawn around the Smith grid (Re(Γ)/Im(Γ) titles,
    -1.0…1.0 ticks), against the spec''s ''grid in place of Cartesian axes'' property
    → drop axis.text and axis.title (element_blank()). Likely cause: theme() keeps
    axis.title/axis.text and labs() sets x/y.'
  - 'SC-01 (both): an unrequested sweep-direction arrow and an end marker in a second
    colour (#C475FD triangle) add a callout and a colour the basic variant does not
    ask for; the triangle also covers the arrowhead → remove the arrow and draw the
    end marker in the locus green. Likely cause: annotate(''segment'', arrow = …)
    and geom_point(color = IMPRINT[2], shape = 17).'
  - 'Suggestion: label a few reactance arcs (±j0.5, ±j1, ±j2) at the boundary so the
    upper and lower halves read as inductive/capacitive.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: title 'smith-chart-basic · r · ggplot2 · anyplot.ai' dark ink at top left (~57% width); Cartesian axes Re(Γ)/Im(Γ) with -1.0…1.0 ticks in INK_SOFT; resistance labels 0, 0.2, 0.5, 1, 2, 5 under the real axis. All readable.
      Data: grey Smith grid (r circles + reactance arcs), dark boundary circle, blue dashed VSWR=2 circle labelled lower left; green #009E73 locus from 1 GHz (dot, lower right) through '2 GHz (res.)' (label left of the curve, clear of it) to 3 GHz (purple triangle + arrowhead, upper). Disc sits left of centre with an empty right band.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and labels in light ink, ticks in light grey; no dark-on-dark text.
      Data: identical colours to light (green locus, purple end triangle, blue dashed VSWR circle); grid lines light grey, subtle but traceable.
      Legibility verdict: PASS
