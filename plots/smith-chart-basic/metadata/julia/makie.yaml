review:
  strengths:
  - Correct, complete Smith chart construction from first principles — constant-resistance
    circles, constant-reactance arcs trimmed to the unit disk, chart boundary, and
    matched-condition point — mathematically accurate impedance-to-reflection-coefficient
    mapping
  - 'Full theme-adaptive chrome: identical brand-green (#009E73) locus in both renders,
    correct #FAF8F1/#1A1A17 backgrounds, all chrome text legible in both themes'
  - Correct 2400x2400 square canvas — the right orientation choice for a circular
    diagram with no preferred horizontal axis
  - Realistic RF engineering scenario (parallel-RLC antenna feed impedance across
    a 1-6 GHz sweep) with plausible resistance/reactance values and a sensible 50
    ohm reference impedance
  - 'Clean, idiomatic Makie code: DataAspect() for true circular geometry, fully deterministic
    data (no RNG needed), minimal-chrome Axis (no ticks/spines/gridlines from Axis
    itself), single-file dual-theme pattern'
  - Visual hierarchy via marker size — larger, outlined markers at the three labeled
    frequency points vs. small trajectory dots along the rest of the curve
  weaknesses:
  - Grid circles/arcs carry no printed r/x values (0.2, 0.5, 1, 2, 5) as conventional
    Smith charts do — a viewer without an external reference cannot read quantitative
    resistance/reactance directly off the grid; small numeric labels where each circle/arc
    crosses the horizontal axis would fix this
  - Only 3 of 40 frequency points are labeled (start, mid, end) — acceptable under
    the spec's 'key points' wording, but an additional label near the curve's steepest
    bend (~2.5 GHz) would better convey the sweep trajectory
  - Reactance arcs converge into a visually dense cluster near |Gamma| approx 1 (right
    edge) — inherent to Smith-chart geometry and not a bug, but a slightly thinner
    linewidth for the higher-|x| arcs there would reduce visual noise
  - No VSWR (constant reflection-coefficient magnitude) circle included — listed as
    optional in the spec, but would have added a useful extra layer of RF context
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Antenna S11 Sweep · smith-chart-basic · julia · makie · anyplot.ai" in dark ink, clearly legible, ~60% of plot width. No axis ticks/labels (intentionally omitted — standard for Smith charts, whose grid itself is the coordinate system). Constant-resistance circles and constant-reactance arcs rendered in a subtle mid-gray, visible but not dominant. Frequency labels "1.0 GHz", "3.4 GHz", "6.0 GHz" in dark ink, all readable against the light background.
      Data: Single brand-green (#009E73) impedance locus with small trajectory dots and three larger labeled markers with light-background strokes. Matched-condition point (Z=Z0) marked with a small gray dot at chart center.
      Legibility verdict: PASS — all text and grid elements clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title rendered in light/off-white ink, clearly legible against the dark background. Grid circles/arcs in a lighter gray tone that remains visible without overpowering the data curve. Frequency labels "1.0 GHz", "3.4 GHz", "6.0 GHz" in light ink, all clearly readable — no dark-on-dark failures observed.
      Data: Impedance locus is the identical brand-green (#009E73) as the light render — confirmed unchanged between themes, only chrome (background, grid gray value, text ink, marker stroke color) flipped.
      Legibility verdict: PASS — all text and grid elements clearly readable, no dark-on-dark issues.
