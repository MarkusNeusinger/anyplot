review:
  strengths:
  - 'Mathematically correct Smith-chart geometry: constant-resistance circles and
    constant-reactance arcs (both signs) are properly derived and clipped to the unit
    circle.'
  - Correct complex-number impedance-to-reflection-coefficient transformation with
    proper Z0 normalization.
  - Clean, realistic, neutral RF engineering scenario (mismatched antenna feed impedance
    sweep).
  - Theme-adaptive chrome correctly threaded through tokens — identical data color
    across light/dark, correct backgrounds, all text legible in both themes.
  - Small pure helper functions (cSub, cDiv, toPixel, boundaryPoint) keep the complex
    math readable without over-abstracting.
  weaknesses:
  - A few grid/frequency labels (13px resistance/reactance labels, the '2.7 GHz' marker
    label) sit close to the boundary circle or the locus curve — a touch more padding
    would improve breathing room.
  - Grid circles are built with per-value forEach + .append() instead of D3's selection.data().join()
    idiom.
  - No directional cue on the impedance locus beyond the ordered frequency labels.
  - Optional VSWR circle from the spec notes is omitted, which would have added another
    layer of visual storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: bold dark title and gray subtitle both fully legible; subtle gray constant-resistance circles and constant-reactance arcs correctly clipped to the unit circle; bold dark boundary circle (|gamma|=1); small dark center dot marks the matched condition.
      Data: green (#009E73) impedance locus with four bold dark frequency labels (1.0, 2.7, 4.3, 6.0 GHz) at labeled markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: title and subtitle flip to white/light-gray, grid and boundary circle flip to light gray strokes; all fully legible, no dark-on-dark text.
      Data: green impedance locus and frequency labels are pixel-identical in color and position to the light render; only chrome flipped.
      Legibility verdict: PASS
