review:
  strengths:
  - Fully custom, geometrically-correct Smith chart grid (constant-resistance circles,
    constant-reactance arcs, VSWR reference circle) hand-drawn via Chart.js plugin
    hooks — a genuine engineering feat since Chart.js has no native Smith-chart or
    polar-impedance support.
  - Equal-aspect-ratio correction plugin measures px-per-unit on both axes after layout
    and expands the tighter one so the resistance/reactance circles render as true
    circles instead of ellipses — a correctness detail many hand-rolled Smith charts
    get wrong.
  - 'Realistic, physics-grounded RF data: a series-inductance + parasitic-capacitance
    antenna feed model drives the impedance sweep, with the self-resonant frequency
    computed analytically and the best-match point highlighted.'
  - Theme-adaptive chrome is executed cleanly — data color (#009E73) and layout are
    identical between light and dark renders, while text, grid, and the matched-condition
    crosshair correctly flip token colors.
  - 'Strong data storytelling: the matched-condition crosshair, the emphasized best-match
    marker with callout label, and evenly spaced frequency labels along the locus
    guide the viewer straight to the insight.'
  weaknesses:
  - No descriptive axis title clarifies that the grid numbers (0.2, 0.5, 2, 5 / +j1,
    +j0.5, ...) are normalized resistance and reactance values — a viewer unfamiliar
    with Smith-chart convention has no textual anchor for what the numbers mean.
  - The smallest canvas-drawn labels (13px CSS reactance-arc labels) are on the small
    side; at ~400px mobile scale-down they may become hard to read — consider bumping
    the smallest labels to 14-15px.
  - The '4.0 GHz' frequency label sits very close to the dashed VSWR reference circle,
    causing minor visual crowding at that point on the curve.
  - The implementation defines a helper function plus two multi-method plugin objects;
    justified by Chart.js's plugin architecture (the only way to draw custom geometry),
    but it moves further from a minimal 'no functions' structure than a simpler chart
    type would need.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "smith-chart-basic · javascript · chartjs · anyplot.ai" in dark ink at top, clearly readable. The Smith chart's constant-resistance circles and constant-reactance arcs are drawn in subtle light-gray grid lines, with numeric labels (0.2, 0.5, 2, 5 on the real axis; +j1, +j0.5, +j0.2, +j2, +j5 and their negative counterparts around the boundary) in dark ink. A dashed amber VSWR=2 reference circle is clearly distinct from the gray grid. A small crosshair marks the "Z0 matched" center point.
      Data: Impedance locus is a solid green (#009E73) curve with circular markers of varying size — small dots for regular sweep points, larger dots at labeled 1.0-6.0 GHz frequency points, and the largest (dark-filled) marker at the best-match point (3.17 GHz), called out with a bold text label.
      Legibility verdict: PASS — all title, grid-value, and frequency-label text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, grid geometry, and VSWR dashed circle, now rendered in light ink / light gray so they read clearly against the dark surface. The best-match marker fill flips from black to white (a theme-adaptive highlight, not a data color) while its position and the green locus color are unchanged.
      Data: The impedance locus and all markers are the identical #009E73 green as the light render — confirming palette compliance between themes.
      Legibility verdict: PASS — all text (title, grid labels, frequency labels, "Z0 matched" and "best match" callouts) is rendered in light color against the dark background; no dark-on-dark failures observed. Brand green remains clearly visible on the dark surface.
