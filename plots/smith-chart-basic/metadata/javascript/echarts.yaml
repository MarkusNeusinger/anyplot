review:
  strengths:
  - 'Mathematically correct Smith-chart geometry: resistance circles (cx=r/(1+r),
    cr=1/(1+r)) and reactance arcs (cy=1/x, cr=1/|x|) use the standard gamma-plane
    formulas, and the boundary circle correctly represents |gamma|=1'
  - Impedance locus is a physically plausible antenna-feed sweep (skin-effect-like
    resistance rise plus a series L-C reactance crossing from capacitive to inductive)
    verified against the underlying formulas
  - Frequency labels (1.0/2.3/3.7/5.0 GHz) are offset radially outward from each point
    using vector math, avoiding overlap with the curve or the Z0 marker in both themes
  - Z0 (matched-condition) reference point at the chart center is clearly marked,
    giving the viewer an immediate visual reference for how close the locus is to
    a perfect match
  - Theme-adaptive chrome (ink/inkSoft/grid tokens) is threaded through every text
    and line element, and the data curve color (#009E73) is pixel-identical between
    light and dark renders
  - 'Clean, minimal-chrome layout: axes hidden, no cartesian frame, generous whitespace,
    boundary circle emphasized with a slightly heavier stroke than the interior grid'
  - Deterministic, in-memory data generation with clear domain-driven parameters (z0=50,
    4 nH series inductance, 1 pF series capacitance) — fully reproducible, no RNG
    needed
  weaknesses:
  - Constant-resistance circles and constant-reactance arcs have no numeric labels
    (e.g. 0.2, 0.5, 1, 2, 5) — conventional Smith charts label these so a reader can
    identify a specific circle/arc; right now the grid is decorative rather than readable
  - Frequency labels (fontSize 15) and the Z0 label (fontSize 13) are on the small
    side once the 2400x2400 PNG is scaled down to a ~400px mobile width — consider
    bumping both by a few px for mobile legibility
  - No axis/units label equivalent for the Smith-chart grid itself (VQ-06) — the subtitle
    mentions 'Z0 = 50 Ω' but the resistance/reactance circles carry no value annotation
  - resistanceCircle()/reactanceArc() are named functions, which deviates from the
    KISS 'no functions' guidance — justified here by the repeated parametric-circle
    math, but worth noting
  - No distinctively ECharts-specific feature is used (e.g. graphic component, custom
    series, visualMap) — the grid-as-many-line-series approach could be replicated
    in most other charting libraries with similar effort
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "smith-chart-basic · javascript · echarts · anyplot.ai" (bold, dark ink) and subtitle "Antenna feed impedance, 1-5 GHz · normalized to Z0 = 50 Ω" (softer grey) are both centered above the chart and fully readable. The Smith-chart grid (constant-resistance circles, constant-reactance arcs, the horizontal zero-reactance line, and the outer |gamma|=1 boundary circle) renders in a subtle light grey, clearly visible but not competing with the data. "Z0" label and its grey dot sit at the chart center. Frequency labels ("1.0 GHz", "2.3 GHz", "3.7 GHz", "5.0 GHz") are placed just outside the curve at labeled points, in dark ink, all legible.
      Data: The impedance locus is a single connected green (#009E73) line with matching green circular markers (11px, 13 points total), starting near the bottom-right (1.0 GHz, near the outer boundary, indicating a poor match) and curving counter-clockwise up through the left side of the chart to the top-right (5.0 GHz), ending closer to — but still outside — the matched center.
      Legibility verdict: PASS — all title, subtitle, frequency-label, and Z0-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle now rendered in light ink (white/near-white) and soft grey respectively, both fully legible against the dark background. The Smith-chart grid lines and boundary circle flip to light grey, remaining subtle but visible. "Z0" label and dot are light grey, readable at the center. Frequency labels flip to light ink text, all legible with no dark-on-dark failures.
      Data: The impedance locus curve and markers are the identical #009E73 green as the light render — same shape, same positions, confirming data-color consistency across themes. Brand green reads clearly against the dark surface.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all chrome elements correctly flipped for the dark theme while data color stayed constant.
