review:
  strengths:
  - Grid value labels are now present for both constant-resistance circles (0.2, 0.5,
    1, 2, 5) and constant-reactance arcs (j0.2...j5, -j0.2...-j5), placed via ECharts'
    `graphic` component using `chart.convertToPixel` for pixel-exact positioning against
    the data-space grid geometry — this directly fixes the prior attempt's VQ-06/LM-02
    weaknesses and is a genuinely ECharts-specific technique.
  - 'Mathematically correct Smith-chart geometry: resistance circles (cx=r/(1+r),
    cr=1/(1+r)) and reactance arcs (cy=1/x, cr=1/|x|) use the standard gamma-plane
    formulas, and the boundary circle correctly represents |gamma|=1.'
  - Impedance locus is a physically plausible antenna-feed sweep (skin-effect-like
    resistance rise plus a series L-C reactance crossing from capacitive to inductive),
    with frequency labels (1.0/2.3/3.7/5.0 GHz) offset radially outward from each
    point using vector math.
  - Z0 (matched-condition) reference point at the chart center gives the viewer an
    immediate visual anchor for how close the locus is to a perfect match.
  - Theme-adaptive chrome (ink/inkSoft/grid tokens) is threaded through every text
    and line element, including the newly added grid labels, and the data curve color
    (#009E73) is pixel-identical between light and dark renders.
  - Frequency-label and Z0-label font sizes were bumped (15->17px, 13->15px) since
    the prior review, improving legibility once the 2400x2400 PNG is scaled down for
    mobile.
  - 'Clean, minimal-chrome layout: axes hidden, no cartesian frame, generous whitespace,
    boundary circle emphasized with a slightly heavier stroke than the interior grid.'
  - Deterministic, in-memory data generation with clear domain-driven parameters (z0=50,
    4 nH series inductance, 1 pF series capacitance) — fully reproducible, no RNG
    needed.
  weaknesses:
  - The '1.0 GHz' frequency label collides with the |Gamma|=1 boundary circle in both
    light and dark renders — the boundary stroke visibly cuts through the 'G' of 'GHz'
    because the radial 46px offset isn't enough clearance for a locus point that sits
    close to the chart boundary. Increase the offset (or clamp the label radius so
    it never exceeds ~1.12) specifically for points near |gamma|=1.
  - The '0.5' resistance-circle grid label sits almost flush against a locus marker/line
    segment near the top of the chart (very tight vertical gap) — not a hard overlap
    but crowded; nudge the label's textVerticalAlign/offset up a few more px where
    a grid label's point falls near the data curve.
  - resistanceCircle()/reactanceArc() remain named helper functions, which deviates
    from the KISS 'no functions' guidance — still justified by the repeated parametric-circle
    math used for 12 grid curves, but worth a mention.
  - Optional VSWR circles (constant reflection-coefficient magnitude) from the spec's
    notes are still not included — explicitly optional, not a deduction, but would
    add extra data-density polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "smith-chart-basic · javascript · echarts · anyplot.ai" (bold, dark ink) and subtitle "Antenna feed impedance, 1-5 GHz · normalized to Z0 = 50 Ω" (softer grey) are centered above the chart and fully readable. The Smith-chart grid (constant-resistance circles labeled 0.2/0.5/1/2/5, constant-reactance arcs labeled j0.2-j5 and -j0.2--j5, the horizontal zero-reactance line, and the outer |gamma|=1 boundary circle) renders in subtle light grey with dark-grey grid-value labels, clearly visible but not competing with the data. "Z0" label and its grey dot sit at the chart center. Frequency labels ("1.0 GHz", "2.3 GHz", "3.7 GHz", "5.0 GHz") are placed just outside the curve at labeled points, in dark ink; all are legible except "1.0 GHz", whose "G" is visibly bisected by the boundary-circle stroke passing through it (readable but a genuine minor overlap).
      Data: The impedance locus is a single connected green (#009E73) line with matching green circular markers (11px, 13 points total), starting near the bottom-right (1.0 GHz, near the outer boundary, indicating a poor match) and curving counter-clockwise up through the left side of the chart to the top-right (5.0 GHz), ending closer to — but still outside — the matched center.
      Legibility verdict: PASS (with one minor flaw) — all title, subtitle, and grid-label text is clearly readable against the light background with no light-on-light issues; the "1.0 GHz" label is readable but crossed by the boundary line.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle now rendered in light ink (white/near-white) and soft grey respectively, both fully legible against the dark background. The Smith-chart grid lines, boundary circle, and grid-value labels flip to light grey, remaining subtle but visible. "Z0" label and dot are light grey, readable at the center. Frequency labels flip to light ink text, all legible with no dark-on-dark failures — except the same "1.0 GHz" / boundary-circle collision observed in the light render, reproduced identically here.
      Data: The impedance locus curve and markers are the identical #009E73 green as the light render — same shape, same positions, confirming data-color consistency across themes. Brand green reads clearly against the dark surface.
      Legibility verdict: PASS (with one minor flaw) — no dark-on-dark or light-on-light failures; chrome elements correctly flipped for the dark theme while data color stayed constant; the same boundary/label collision as the light render persists.
