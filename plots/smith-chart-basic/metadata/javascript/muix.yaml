review:
  strengths:
  - 'Mathematically correct Smith-chart grid: constant-resistance circles and constant-reactance
    arcs are derived analytically, with each reactance arc''s angular span found by
    walking outward from the open-circuit point until it re-crosses |Gamma|=1 rather
    than assuming a fixed half-circle'
  - Careful anti-overlap label placement - grid value labels and frequency waypoint
    labels are nudged outward along the radial direction from the chart origin, with
    text-anchor/baseline flipped based on direction; no label collisions found anywhere
    in the grid across both themes
  - Fully theme-correct chrome in both renders, with the brand-green locus color identical
    between light and dark
  - Idiomatic use of ChartContainer + useXScale/useYScale composition hooks to sync
    custom SVG geometry to the container's coordinate system - the documented MUI
    X pattern for chart types the built-in components don't cover
  - Deterministic, realistic antenna-feed RLC dataset producing a full 1-6 GHz sweep
    that visibly crosses resonance
  weaknesses:
  - 'Stale duplicate header block: lines 1-4 are a leftover header (stale Quality:
    89/100 score, mismatched ''Library: muix 7.29.1 | JavaScript 22.23.2'' line) sitting
    above the //# anyplot-orientation: square directive, followed by a second canonical
    header block. The directive must be the very first line of the file - strip the
    stale first 4-line block entirely.'
  - Title occupies only ~45-50% of the plotting-area width at the current 22px size
    - on the low end of the comfortable 50-70% range; not a violation but there's
    room to grow it slightly for more visual presence
  - 'DQ-03: the 1 GHz waypoint''s reactance swing (~-366 ohms unnormalized) is quite
    extreme for an illustrative matched-network sweep; a gentler L/C pairing would
    keep the locus a bit more centered while still crossing resonance clearly'
  - Several standalone geometry helpers (circlePoints, reactanceArcPoints, pathFromPoints)
    add structure beyond a flat imports-to-data-to-plot layout; justified by the chart's
    math, but worth keeping in check in future repair passes
