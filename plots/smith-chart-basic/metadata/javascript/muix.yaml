review:
  strengths:
  - Composes the Smith chart on a ChartsContainer with hidden linear axes and draws
    every grid element in Γ coordinates through useXScale/useYScale, so the boundary
    is a true circle and all resistance circles and reactance arcs meet exactly at
    the open-circuit point (1, 0)
  - Impedance is normalized to Z0 = 50 Ω and mapped with Γ = (z − 1)/(z + 1); the
    series R-L-C antenna model resonates near 3.56 GHz, where the locus crosses the
    real axis just left of the matched centre at r ≈ 0.85
  - Frequency labels sit radially outside their dot markers, with anchors chosen from
    the outward direction and a page-colored halo, so the 1 → 6 GHz sweep reads clearly
    over the grid in both themes
  - 'The grid is drawn in inkSoft at 0.55 opacity under a heavier ink boundary and
    the brand-green locus: a clear three-level hierarchy that adapts to both themes'
  - Reactance values (±j0.2 … ±j5) sit just outside the boundary at each arc's end
    and resistance values sit on the real axis at each circle's left crossing, each
    tied to its own grid line
  weaknesses:
  - 'Suggestion: a slightly larger grid value font (14 → 15–16 px) would hold up better
    in the 400 px thumbnail.'
  - 'Suggestion: the 0.55-opacity grid could drop a little in the dark render, where
    it reads slightly more prominent than in the light one.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400×2400 square canvas.
      Chrome: bold dark title "smith-chart-basic · javascript · muix · anyplot.ai" centered at the top (about 42 % of the width), with a gray subtitle below it: "n = 41 points · Frequency (GHz) 1 to 6 · impedance normalized to Z₀ = 50 Ω, matched point at the centre". The unit-circle boundary is drawn in heavy near-black ink. The constant-resistance circles (0.2, 0.5, 1, 2, 5) and constant-reactance arcs (±0.2 … ±5) are thin, mid-gray and subtle, and they converge at the right-hand point. Resistance labels sit along the real axis, reactance labels (+j0.2 … −j5) sit just outside the boundary. A small open ring marks the matched centre. There are no Cartesian axes. All text is readable.
      Data: one connected #009E73 locus running from 1 GHz near the lower-right boundary (capacitive), sweeping clockwise through the lower half, crossing the real axis just left of the centre and ending at 6 GHz in the upper right (inductive). Six green dot markers with page-colored outlines carry bold dark labels "1 GHz" … "6 GHz", placed radially outward.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title and frequency labels flip to light ink, the subtitle and grid labels to light gray, the boundary to near-white, and the grid to a subtle light gray. No text is dark on dark, and every label is readable.
      Data: the locus and markers are the same #009E73 as in the light render, and the marker outlines follow the dark page color. The geometry is identical to the light render; only the chrome flipped.
      Legibility verdict: PASS
