review:
  strengths:
  - 'Correct Smith chart geometry computed from first principles: resistance circles
    at center r/(1+r) with radius 1/(1+r) and reactance arcs of radius 1/|x| from
    the open-circuit point, all converging at the right end of the real axis inside
    a true-circle |Γ|=1 boundary held square by equal margins'
  - Impedance normalized to Z0 = 50 Ω and mapped through Γ = (z−1)/(z+1); the series
    R-L-C antenna model swings through resonance near 3.56 GHz, so the locus crosses
    the real axis just left of the matched center (Γ ≈ −0.08) and runs clockwise with
    frequency as a passive load must
  - Six frequency labels (1–6 GHz) are each tied to an ink-ringed dot on the locus
    and placed on the side of the curve normal that keeps them clear of the locus,
    the rim and the grid values; a page-colored halo keeps them legible where grid
    arcs pass behind
  - 'Clear visual hierarchy: heavy ink rim, soft inkSoft grid at 0.55 opacity, saturated
    #009E73 locus at 3.5 px; normalized resistance values sit beside their circles
    on the real axis and ±jx values outside the rim at each arc''s end'
  - 'Uses the MUI X composition API idiomatically: ChartsContainer with hidden linear
    axes provides the coordinate system and a custom child component reads it through
    useXScale/useYScale, with skipAnimation set'
  - Both themes are fully theme-adaptive through ANYPLOT_TOKENS (ink, inkSoft, pageBg),
    with identical data colors
  weaknesses:
  - 'Suggestion: a few more frequency points near the tightest bend (around 1.5–2.5
    GHz) would smooth the slight polygonal kinks visible along the lower arc of the
    locus.'
  - 'Suggestion: native MUI X tooltips are absent from the HTML view; a hover readout
    of frequency and Z per point would add value in the interactive detail page.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: bold dark title "smith-chart-basic · javascript · muix · anyplot.ai" (about 42% of width) with a softer subtitle "n = 41 points · Frequency (GHz) 1 to 6 · impedance normalized to Z₀ = 50 Ω, matched point at the centre"; heavy near-black rim circle; soft grey resistance circles (0.2, 0.5, 1, 2, 5) labelled on the real axis and reactance arcs (±j0.2 … ±j5) labelled outside the rim; small ink ring marks the matched center. All text readable dark-on-light.
      Data: one connected #009E73 locus starting at 1 GHz near the lower-right rim, sweeping clockwise through the lower half, crossing the real axis just left of center, and ending at 6 GHz in the upper-right; six green dots with bold dark labels 1–6 GHz placed clear of the curve and rim.
