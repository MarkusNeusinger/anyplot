review:
  strengths:
  - 'Verified-correct RF math: gamma = (z_norm - 1) / (z_norm + 1) is computed by
    hand and the resulting locus geometry (e.g. |Γ| ≈ 0.975 near the 1 GHz point)
    matches the rendered curve exactly'
  - Builds a fully custom Smith-chart grid (resistance circles + reactance arcs +
    boundary) via MUI X's `useXScale`/`useYScale` composition hooks — an idiomatic,
    distinctive use of the library's low-level API for a chart type MUI X has no native
    component for
  - Brand green (#009E73) is the only data series and is pixel-identical between light
    and dark renders; all chrome (grid, boundary, tick labels, Z0 marker) correctly
    flips theme tokens with no dark-on-dark/light-on-light failures
  - 'All spec-required features present: constant-resistance circles, constant-reactance
    arcs re-derived per-circle (not a fixed half-circle assumption), |Γ|=1 boundary,
    matched-center Z0 marker, and frequency-labeled impedance locus'
  - Realistic, neutral RF antenna-feed scenario (series R-L-C model) with physically
    plausible component values that verifiably produce the plotted trajectory
  - Square canvas margins are derived programmatically (`sideMargin = (width - squareSide)
    / 2`) specifically to keep the Γ-plane circles perfectly circular rather than
    elliptical at any size
  weaknesses:
  - 'The ''1 GHz'' frequency label collides with the outer |Γ|=1 boundary circle and
    several converging reactance-arc grid lines in both renders — the 1 GHz locus
    point sits very close to the chart edge (|Γ|≈0.975), so the label''s leading ''1''
    digit is visually crossed by the boundary stroke and thin grid lines, hurting
    legibility. Fix: push frequency labels further outward along their radial direction
    when the locus point is near the boundary (similar to the *1.06 outward nudge
    already used for the reactance-arc labels), or add a small background/halo behind
    the label text.'
  - 'Minor: the resistance-circle label ''1'' (placed at the exact center, since (r-1)/(1+r)=0
    for r=1) sits directly beneath the ''Z0'' label and matched-center marker — not
    overlapping, but the cluster is tight; a slightly larger vertical offset would
    read more cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "smith-chart-basic · javascript · muix · anyplot.ai" in dark ink, centered, clearly readable. The |Γ|=1 boundary is a bold dark circle; the horizontal resistance axis is a medium-dark line; constant-resistance circles and constant-reactance arcs are thin, subtle gray (opacity ~0.55). Resistance labels (0.2, 0.5, 1, 2, 5) and reactance labels (±j0.2 … ±j5) are dark ink, legible against the cream background. "Z0" label and open-circle marker sit cleanly at the chart center.
      Data: Single locus curve in Imprint brand green (#009E73), frequency waypoints (1–6 GHz) marked with filled green circles with a light-colored stroke ring, labels in dark ink.
      Legibility verdict: FAIL (localized) — the "1 GHz" label's leading digit is visually crossed by the boundary circle and converging grid arcs because that locus point sits almost exactly on |Γ|=1; every other label (2–6 GHz, Z0, resistance/reactance grid values) is fully legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now in light ink, clearly readable. Boundary circle and axis line render in light-toned strokes; grid circles/arcs remain thin, subtle gray. All resistance/reactance/Z0 labels flip to light ink and remain clearly legible against the dark surface — no dark-on-dark failures anywhere.
      Data: Locus color and marker styling are pixel-identical to the light render (confirmed #009E73 green, same positions) — only chrome flipped, as required.
      Legibility verdict: FAIL (localized) — same "1 GHz" label / boundary-circle collision reproduces identically in the dark render (theme-independent geometry issue, not a chrome/token problem); all other text is clearly readable in this theme.
