review:
  strengths:
  - Fully custom Smith-chart grid built from raw circle/arc geometry — correctly worked
    around the missing Highcharts polar module rather than reaching for a forbidden
    add-on or a different library.
  - Physically accurate S11 locus from a real series-RLC feedpoint model; the resonance
    crossing near 3.5 GHz matches the code's own tuning comment (verified by hand).
  - Clean, fully theme-correct chrome in both renders — Imprint green locus, subtle
    grid, correct backgrounds/text colors, no dark-on-dark or light-on-light issues.
  - Clever chart.events.load + setExtremes trick keeps the resistance circles perfectly
    circular regardless of how title/subtitle margins reshape the plot area.
  - Frequency labels at six key points give the locus a clear narrative progression
    across the 2-5 GHz sweep.
  weaknesses:
  - Reactance arcs carry no numeric labels (unlike the resistance circles), so the
    chart isn't fully self-labeled the way a reference Smith chart usually is — add
    labels such as "+j0.5"/"-j0.5" near the boundary or axis intersections for each
    reactance value.
  - The matched condition (Z = Z0, center of the chart) is never explicitly marked
    — consider a small center marker or annotation.
  - The grid renders at uniform weight/opacity throughout; a touch more visual refinement
    (e.g., slightly heavier weight on the r=1 circle and reactance=0 axis, which are
    the most diagnostically important contours) would strengthen Design Excellence.
  - resistanceCircle/reactanceArc are small helper functions for the grid math — reasonable
    given the geometry, but worth flagging against the strict KISS/no-functions guideline.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title ("smith-chart-basic · javascript · highcharts · anyplot.ai") and subtitle ("Antenna feedpoint S11, 2-5 GHz · Z0 = 50 Ω") in dark ink at top, clearly readable. Resistance-axis numbers (0.2, 0.5, 1, 2, 5) along the real axis and six frequency labels (2.0-5.0 GHz) along the locus are all dark, legible text. Grid (resistance circles + reactance arcs + boundary circle) renders as a subtle dark-grey line, visible but not competing with the data.
      Data: Single S11 impedance locus in Imprint green (#009E73), 3px line width, with 6 filled green marker dots (radius 6) at labeled frequency points. First (and only) series correctly uses palette position 1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle flip to light text, clearly readable against the dark background. Resistance-axis numbers and frequency labels are light-colored and fully legible — no dark-on-dark failures observed anywhere (title, subtitle, tick/frequency labels all checked). Grid flips to a lighter grey, still subtle relative to the data.
      Data: S11 locus and markers are the identical #009E73 green as the light render — confirmed unchanged; only chrome (background, text, grid) flipped between themes as required.
      Legibility verdict: PASS
