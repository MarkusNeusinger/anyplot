review:
  strengths:
  - LineCollection with Normalize feeds a continuous gradient locus straight into
    plt.colorbar
  - Smith grid computed from the closed-form circle equations with a unit-disk mask,
    converging on Γ = 1 inside a true circle
  - Theme tokens threaded through title, labels, legend and colorbar in both renders
  - Frequency labels tied to their points with arrows
  weaknesses:
  - 'VQ-05 (both): the canvas is 2360x2212 instead of the 2400x2400 square target
    (signed delta -40 x -188 px) → 2400x2400. Likely cause: savefig(..., bbox_inches=''tight'').'
  - 'CQ-05 (code): savefig uses bbox_inches=''tight'', which the matplotlib library
    prompt forbids → default bbox. Likely cause: the savefig call.'
  - 'VQ-07 (both): the locus and its colorbar use the cividis colormap, outside the
    Imprint maps; the matched marker is #4467A3 instead of the first Imprint color
    #009E73; the colorbar tick marks render pure black on the dark page → imprint_seq,
    #009E73 and INK_SOFT ticks. Likely cause: cmap=''cividis'', OI_3 on the matched
    marker, cbar.ax.tick_params without color.'
  - 'VQ-02, SC-02 (both): every resistance value 0.2–5 is drawn at Γ = 1 and they
    pile into an illegible stack beside ''Open'', not on their own circles (C4); ''6.0
    GHz'' overlaps the 3.4 GHz marker and the locus → each value at its own circle''s
    real-axis crossing and frequency labels clear of the locus. Likely cause: label_x
    = center + radius, which is 1 for every r.'
  - 'VQ-03, SC-04 (both): the legend''s ''Impedance Locus'' glyph is matplotlib''s
    default blue #1f77b4, a colour that appears nowhere on the cividis locus, and
    the locus'' butt-capped segments notch every joint → a legend glyph in the locus
    colormap and continuous joints. Likely cause: label on the LineCollection without
    a matching handle; no capstyle.'
  - 'VQ-01 (both): resistance, reactance and VSWR labels at 6 pt, below the 8 pt tick
    reference, read small → 8 pt (+2 pt). Likely cause: fontsize=6 on those ax.text
    calls.'
  - 'DE-02 (both): all four spines draw a rectangular frame around the circular chart
    → remove the spines. Likely cause: the spine loop sets a colour instead of set_visible(False).'
  - 'SC-01 (both): the cardinal callouts Short/Open/+jX (Inductive)/-jX (Capacitive)
    are an annotation layer the basic variant excludes → remove them. Likely cause:
    the cardinal-direction ax.text block.'
  image_description: |-
