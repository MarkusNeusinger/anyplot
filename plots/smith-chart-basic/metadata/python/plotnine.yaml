review:
  strengths:
  - 'Correct Smith geometry: resistance circles all tangent at Γ=1, |Γ|=1 boundary
    as a true circle via coord_fixed, impedance normalized to Z0=50 before mapping
    to Γ'
  - Grid layered by weight (boundary solid, resistance circles alpha 0.6, reactance
    arcs 0.4) so the green locus stays in front in both themes
  - Fully theme-adaptive chrome through INK/INK_SOFT/INK_MUTED tokens; data colors
    identical across renders
  - Realistic patch-antenna S11 scenario over 1-6 GHz
  weaknesses:
  - 'VQ-02 (both): the ''2.5 GHz'' label is drawn on top of the locus line and markers,
    and locus markers cover parts of the ''0.5'' and ''1'' resistance labels → no
    text on data marks; choose label anchors/offsets where the text sits in empty
    grid space. Likely cause: fixed LABEL_NUDGE_X/Y offsets and resistance labels
    at y=0.09 directly where the locus crosses the real axis.'
  - 'SC-02 (both): the x=±0.2 and ±0.5 reactance arcs end at the vertical center line
    (Re Γ = 0) as short stubs instead of curving to the |Γ|=1 boundary, so the grid
    is not the standard Smith grid (C1) → draw each arc over its full in-disc extent.
    Likely cause: the extra mask term `arc_x >= -0.01` in the reactance loop.'
  - 'SC-02 (both): frequency labels float ~0.15 above their points with no tie, and
    ''1.0 GHz'' is separated from its point by the ''Z=Z₀'' text, so the sweep start
    is hard to locate (C3) → place each label directly beside its point (or mark the
    labelled points). Likely cause: LABEL_NUDGE_Y = 0.15 and center_df placed at (0.15,
    -0.20).'
  - 'SC-01 (both): a ''Z=Z₀'' text callout and a mid-locus arrow are layers the -basic
    scope excludes (the spec allows only a mark at the matched center) → remove both,
    keep the center point. Likely cause: center_df geom_text and the arr_df geom_segment.'
  - 'Suggestion: label a few reactance values (±0.5j, ±1j, ±2j) at the boundary so
    the arcs can be read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: bold dark title 'smith-chart-basic · python · plotnine · anyplot.ai' centered at top; resistance values 0/0.2/0.5/1/2/5 in smaller muted gray text above the real axis; frequency labels 1.0/2.5/4.5/6.0 GHz in bold dark ink; no Cartesian axes. All readable.
      Data: impedance locus in #009E73 (thick path + semi-transparent markers) looping from lower-right (1.0 GHz) through the left (4.5 GHz) up to 6.0 GHz; purple #C475FD center dot with purple 'Z=Z₀' text below-right. Grid: solid dark boundary circle, resistance circles in medium gray, reactance arcs lighter; the x=±0.2/±0.5 arcs stop as stubs at the vertical center line. '2.5 GHz' label sits on the locus.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black
      Chrome: title, frequency labels and boundary in light ink #F0EFE8; resistance values in light gray; grid lines in light gray at low alpha, traceable. No dark-on-dark text.
      Data: locus green #009E73 and center dot #C475FD identical to the light render; only chrome flipped.
      Legibility verdict: PASS
