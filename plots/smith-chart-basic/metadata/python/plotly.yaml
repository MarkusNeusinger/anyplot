review:
  strengths:
  - Reactance labels sit exactly at each arc's boundary endpoint (+j0.2 … ±j5), computed
    from the arc equation
  - 'Imprint palette throughout: #009E73 locus, #C475FD matched marker, imprint_seq
    ramp; every chrome element on theme tokens, readable in both renders'
  - scaleanchor/scaleratio keep the boundary a true circle and the grid traces skip
    hover, so the HTML hover shows only the locus
  - Per-point hover text with frequency and complex impedance in ohms for the interactive
    HTML
  - Adaptable data block with column constants and a tidy df; flat, seeded script
  weaknesses:
  - 'SC-02, VQ-02 (both): resistance values are printed at each circle''s center,
    not on its circle — ''0'' sits at the chart center on the locus (the r=0 circle
    is the boundary), ''1'' at Re(Γ)=0.5 where the r=1 circle does not pass → place
    each label where its circle crosses the real axis, at Re(Γ)=(r−1)/(r+1) (r=0 →
    −1, r=1 → 0). Likely cause: annotation x=r/(r+1), the circle center, while the
    comment says ''crossing''.'
  - 'SC-02 (both): Cartesian Re(Γ)/Im(Γ) axes with ticks, tick labels and axis lines
    frame the Smith grid, against the spec''s ''grid in place of Cartesian axes''
    → hide them (showticklabels=False, showline=False, no axis titles), keeping the
    equal-aspect range. Likely cause: xaxis/yaxis dicts keep title, tickfont and linecolor.'
  - 'SC-01 (both): on a -basic spec the locus markers carry a frequency colour channel
    with its own colorbar, an encoding the spec neither requires nor offers → single-colour
    markers in the locus green; the frequency labels already show the sweep. Likely
    cause: marker color=freq_ghz, colorscale=imprint_seq, showscale=True.'
  - 'DQ-02 (both): 5 Ω of random noise on every resistance sample makes the locus
    zigzag between neighbouring frequencies, which a measured antenna sweep does not
    do → generate a smooth impedance model (e.g. a series RLC or resonant antenna
    formula). Likely cause: `+ 5 * np.random.randn(50)` in Z_REAL.'
  - 'Suggestion: place a frequency label at the point of closest match to Γ = 0 so
    the key resonance is named.'
