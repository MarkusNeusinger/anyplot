      Data: Smith grid in thin translucent grey, dark boundary circle, #009E73 locus line with markers on the imprint_seq ramp (green 1 GHz → blue 6 GHz) and page-coloured outlines; purple #C475FD X at the chart center; four frequency boxes (1.0, 2.6, 4.3, 6.0 GHz) with green arrows. The '0' resistance label sits on the locus just below the center.
