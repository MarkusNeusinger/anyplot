review:
  strengths:
  - 'Mathematically correct Smith grid: resistance circles centred at r/(r+1) and
    reactance arcs centred at (1, 1/x), converging at the right-hand point inside
    a true circular boundary'
  - Impedance normalised to Z/Z0 and mapped to Γ from the data frame, so the locus
    sits at its true reflection coefficients
  - Frequency labels at 1.0, 3.5 and 6.0 GHz each sit beside their ink-marked point,
    so the sweep direction reads clearly
  - layer_tooltips() shows frequency, complex impedance and VSWR per point in the
    HTML output
  - Theme tokens threaded through every text and line element; both renders readable
  weaknesses:
  - 'SC-02 (both): the constant-reactance arcs stop short of the boundary circle —
    the ±j0.2, ±j0.5 and ±j2 arcs end a visible gap inside the rim and the ±j0.2 arcs
    show straight polygon segments — so they do not run from the boundary into the
    right-hand point as C1 asks → draw each arc from its boundary intersection to
    (1, 0) with dense sampling. Likely cause: 120 samples over the full 2π of each
    arc circle, filtered by the mask x²+y² ≤ 1.001, so the last kept sample falls
    short of the rim.'
  - 'Suggestion: drop the thin rectangular frame around the panel so the disc floats
    on the page like the other theme_void charts.'
  - 'Suggestion: the dense hover points along the locus give it a beaded edge; a smaller
    or transparent hover point would keep the line smooth.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas, thin grey frame around the panel.
      Chrome: title 'smith-chart-basic · python · letsplot · anyplot.ai' in dark ink at top; resistance values 0.2-5 at the tops of their circles and 0 at the left rim; reactance values ±j0.2-±j5 outside the boundary in INK_SOFT; frequency labels 1.0 / 3.5 / 6.0 GHz in ink. All readable.
      Data: heavy dark boundary circle, faint grey resistance circles and reactance arcs, real axis, + at the centre; smooth #009E73 locus from 1 GHz near Γ = -0.4 arcing up and looping back below the axis to 6 GHz, with ink dots at the three labelled points.
