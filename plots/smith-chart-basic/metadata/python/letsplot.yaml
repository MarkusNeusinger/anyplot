review:
  strengths:
  - 'Mathematically exact Smith grid: resistance circles centred at r/(r+1), reactance
    arcs centred at (1, 1/x) and now traced from (1, 0) to their exact rim intersection,
    inside a true circular boundary'
  - Impedance normalised to Z/Z0 and mapped to Γ, so the locus sits at its true reflection
    coefficients
  - Frequency labels at 1.0, 3.5 and 6.0 GHz each sit beside an ink-marked point,
    so the sweep direction reads clearly
  - layer_tooltips() shows frequency, complex impedance and VSWR per point in the
    HTML output
  - Theme tokens threaded through every text and line element; both renders fully
    readable
  weaknesses:
  - 'DE-02 (both): a thin four-sided rectangular frame encloses the whole panel, all
    four spines where a Smith chart needs none (the style guide''s spine rule; the
    boundary circle is the chart''s only frame) → no panel frame. Likely cause: the
    panel border drawn around the plot inside the one-panel gggrid wrapper; set panel_border=element_blank()
    on the inner plot.'
  - 'Suggestion: the 60 hover points at size 3 give the locus a beaded edge; a smaller
    or fully transparent hover point would keep the line smooth.'
  - 'Suggestion: geom_text sizes 9-10 sit above the library prompt''s ~3-5 annotation
    range; a slightly smaller frequency-label size would let the title lead more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the full 2400x2400 square canvas; a thin grey rectangular frame encloses the panel.
      Chrome: title 'smith-chart-basic · python · letsplot · anyplot.ai' in dark ink at top; resistance values 0.2, 0.5, 1, 2, 5 above the tops of their circles and 0 at the left rim; reactance values ±j0.2 to ±j5 just outside the boundary in INK_SOFT; frequency labels 1.0 / 3.5 / 6.0 GHz in ink. All readable.
      Data: heavy dark boundary circle, half-alpha grey resistance circles and smooth reactance arcs that run from the rim all the way into the right-hand point, real axis, a + mark at the centre; #009E73 locus from 1 GHz near Γ = -0.4 arcing up into the inductive half and looping down below the axis to end at 6 GHz just above it, with ink dots at the three labelled points.
