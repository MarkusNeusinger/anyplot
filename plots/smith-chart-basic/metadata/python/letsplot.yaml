review:
  strengths:
  - 'Mathematically correct Smith grid: resistance circles centred at r/(r+1) and
    reactance arcs centred at (1, 1/x), all converging at the right-hand point inside
    a true circular boundary'
  - Impedance normalised to Z/Z0 and mapped to Γ from the data frame, so the locus
    sits at its true reflection coefficients
  - layer_tooltips() shows frequency, complex impedance and VSWR per point in the
    HTML output
  - Theme tokens threaded through every text and line element; both renders readable
  weaknesses:
  - 'VQ-02 (both): the ''3.5 GHz'' label sits directly on the locus line, the start
    marker covers the ''0.5'' resistance value and the locus covers the ''2'' value
    → keep every label clear of the locus and markers. Likely cause: label_nudges
    for 3.5 GHz (-0.18, 0.28) and the resistance labels placed exactly on the real
    axis under the data.'
  - 'VQ-03 (both): the size-3.2 locus forms sharp triangular spikes at the bunched
    4-6 GHz vertices so the end of the sweep reads as a tangle → a thinner line (about
    size 2) with round joins. Likely cause: geom_path size=3.2 over noisy, closely
    spaced points.'
  - 'VQ-05 (both): the Smith disc fills only about 60 % of the canvas width and an
    empty band of roughly 10 % of the height separates it from the bottom legend →
    enlarge the disc (tighter xlim/ylim around ±1.25). Likely cause: coord_fixed xlim=(-1.58,
    1.58), ylim=(-1.7, 1.4).'
  - 'SC-01 (both): coloured start and end highlight markers with their own legend
    are an addition the basic variant does not list (C5) → drop the highlight markers;
    the frequency labels already show the sweep direction. Likely cause: df_start/df_end
    geom_point layers and df_legend.'
  - 'SC-02 (both): the ''6.0 GHz'' label sits about 0.3 Γ below-right of the end point,
    nearer the locus tail cluster than the end marker, so it is not tied to its point
    (C3) → place it beside the 6 GHz point. Likely cause: label_nudges (0.26, -0.22).'
  - 'DQ-02 (both): independent random noise of ±3 Ω / ±2 Ω on every point turns the
    antenna sweep into a zigzag no VNA sweep of an antenna shows → a smooth sweep
    (noise well below the point spacing or none). Likely cause: 3 * np.random.randn
    and 2 * np.random.randn added to r_base and x_base.'
  - 'CQ-04 (code): lines 148-155 and 209-212 hand-build the legend from geom_point
    and geom_text at fixed coordinates → map the series through aes(color=...) with
    scale_color_manual. Likely cause: manual legend instead of the scale system.'
  - 'Suggestion: give the title more weight than the frequency labels so the text
    hierarchy reads top-down.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
