      Chrome: all text in light ink, readable; no dark-on-dark.
      Data: same colours as the light render (red boundary, cyan resistance grid, grey arcs, green locus, purple/blue/ochre markers); same ellipse and faceted circles.
      Legibility verdict: PASS
