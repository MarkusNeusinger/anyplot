review:
  strengths:
  - 'Complete Smith chart structure on the gamma plane: unit boundary, resistance
    circles, reactance arcs, real axis and one locus'
  - 'Locus in #009E73 with theme-adaptive chrome; both renders readable'
  - (None, None) segment breaks carry multi-segment grids in single pygal series
  weaknesses:
  - 'SC-02 (both): the frequency labels 1 GHz, 3.5 GHz and 6 GHz appear only as legend
    entries; the chart carries no text at the key points, so the sweep direction has
    to be decoded through the legend → a text label beside each key point. Likely
    cause: frequency markers added as separate series instead of labelled points.'
  - 'SC-02, VQ-05 (both): the 8-entry legend column takes about a quarter of the canvas
    width and squeezes the plot area, so the |Γ| = 1 boundary renders as a tall ellipse
    instead of a true circle → a square plot area. Likely cause: legend_at_bottom=False.'
  - 'SC-02 (both): the resistance circles render as faceted polygons (the r=0 circle
    is visibly an octagon) → smooth circles. Likely cause: 100 linearly spaced reactance
    samples mapped through (z-1)/(z+1).'
  - 'SC-02 (both): the resistance grid in saturated cyan #2ABCCD and the boundary
    in red #AE3030 compete with the locus instead of staying behind it → one muted
    ink tone for the grid. Likely cause: structural series given Imprint positions
    5 and 6.'
  - 'SC-02 (both): Cartesian x/y tick labels and both axis titles stand where the
    Smith grid should replace the Cartesian axes → hide them. Likely cause: x_labels,
    x_title and y_title set.'
  - 'VQ-01 (both): the y-axis shows two tick sizes — 1, 0 and -1 at 44 px beside 0.8,
    0.6 … at 56 px → one size on each axis. Likely cause: label_font_size=56 with
    major_label_font_size=44.'
  - 'DQ-02 (both): per-point Gaussian noise (±3 ohm resistance, ±5 ohm reactance)
    makes the locus zigzag like scatter rather than a measured antenna sweep → a smooth
    resonant impedance model. Likely cause: the np.random.randn(n) terms.'
  - 'Suggestion: collapsing the three grid series into one legend entry would shorten
    the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: title in dark ink at top; 8-entry legend in a column on the left (Antenna Z(f), 1 GHz, 3.5 GHz, 6 GHz, Unit Circle, Resistance Grid, Reactance Grid, Real Axis); y-axis ticks and title, x-axis ticks and title in Cartesian style; y ticks 1, 0, -1 smaller than the others. All text readable.
      Data: unit boundary in red #AE3030 drawn as a tall ellipse (plot area squeezed by the legend column); resistance circles in saturated cyan #2ABCCD drawn as faceted polygons; reactance arcs in grey; locus in #009E73 with dots; frequency markers as large purple (1 GHz), blue (3.5 GHz) and ochre (6 GHz) dots with no text on the chart.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
