review:
  strengths:
  - 'Grid is mathematically exact: resistance circles (r+e^{jθ})/(r+1) and reactance
    arcs swept from r=0 to r→∞, all converging on the right-hand point inside a true-circle
    boundary'
  - Resistance values 0–5 sit exactly where each circle crosses the real axis
  - Theme tokens threaded through every text and line layer; both renders read cleanly
  - Native Altair tooltips (frequency, resistance, reactance) and .interactive() zoom/pan
    in the HTML output
  - alt.layer composition with detail and order encodings draws all grid groups from
    one tidy frame
  weaknesses:
  - 'VQ-02 (both): the "2.6 GHz" label''s right edge runs into the vertical locus
    segment at about Γ = −0.12+0.22j → keep the whole label clear of the curve by
    a few px (about +10 px further outward). Likely cause: the fixed 26 px radial
    offset in the freq_layers loop is too small for this point.'
  - 'CQ-01 (code): a helper function gamma_of() is defined (lines 59–61) → inline
    (z - 1) / (z + 1) at its two call sites. Likely cause: the def gamma_of block.'
  - 'Suggestion: the 6.0 GHz label sits about 50 px from its endpoint; a smaller offset
    would tie it more visibly to the last point.'
