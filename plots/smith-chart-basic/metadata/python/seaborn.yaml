review:
  strengths:
  - 'Complete Smith grid: constant-R circles r=0…5 all touching (1,0) and ±x arcs
    clipped to the unit circle, with a true-circle boundary in equal aspect'
  - Correct normalization Γ=(Z/Z0−1)/(Z/Z0+1) computed from a tidy df with column
    constants, so the matched point sits at the center '+' marker
  - Key frequency markers with a page-colored halo read clearly against the trace
    in both themes
  - Theme tokens threaded through sns.set_theme rc, legend frame, colorbar ticks and
    outline; both renders fully legible
  - Exact 2400×2400 square canvas with default bbox, as the library prompt requires
  weaknesses:
  - 'SC-01 (both): the locus points are colored by frequency through seaborn hue with
    an imprint_seq colorbar, an encoding the -basic spec neither requires nor offers
    (the Notes ask for frequency labels) → one solid locus color (#009E73) with the
    labeled key points carrying the frequency, colorbar removed. Likely cause: sns.scatterplot(hue=FREQUENCY,
    palette=imprint_seq) plus fig.colorbar(sm).'
  - 'VQ-02 (both): the ''1.0 GHz'' annotation overlaps the ''r=2'' grid label on the
    real axis, the ''r=0.2'' and ''r=1'' labels sit under locus points, and ''4.7
    GHz'' runs into the trace beside its marker → every text clear of other text and
    of the locus by a few px. Likely cause: fixed label_offsets in points and r-labels
    fixed at y=0.03 regardless of where the locus crosses.'
  - 'VQ-05 (both): about 250 px of empty page above the title and a similar gap below
    the x-axis title, with the colorbar column pulling the square axes into a short
    centered box → chart and title using the vertical space (top margin under ~100
    px). Likely cause: tight_layout with set_aspect(''equal'') and a side colorbar
    on a square figure.'
  - 'SC-02 (both): the Cartesian frame (left/bottom spines, −1.0…1.0 ticks, Real(Γ)/Imag(Γ)
    titles) stays around the Smith grid, where C1 asks for the grid in place of Cartesian
    axes → hide spines and ticks (ax.axis(''off'')) and let the unit circle frame
    the chart. Likely cause: ax.set_xlabel/set_ylabel and the spine styling block.'
  - 'SC-02 (both): the ''1.0 GHz'' label sits about 0.1 Γ below-right of its marker,
    beside the 3 GHz part of the trace, so it is not clearly tied to its point (C3)
    → label adjacent to the 1.0 GHz marker, away from other trace sections. Likely
    cause: label_offsets[0] = (8, -18).'
  - 'Suggestion: a lighter weight or italic for the r=/x= grid values would separate
    them further from the bold frequency labels.'
