review:
  strengths:
  - The Smith grid replaces the Cartesian axes entirely, inside a true-circle boundary
    on a square 2400x2400 canvas (match_aspect=True)
  - Physically plausible series-RLC antenna sweep normalised to Z0=50 Ω, with resonance
    landing beside the matched centre
  - Frequency labels placed radially outward from each key point with Label screen-pixel
    offsets, so the sweep direction reads from 1.0 to 6.0 GHz
  - HoverTool on a ColumnDataSource gives frequency, R, X and Γ per point in the HTML
  - Theme tokens threaded through title, grid and labels; both renders fully readable
  weaknesses:
  - 'SC-02 (both): the reactance arcs for x=±0.2 and x=±0.5 stop at the vertical centre
    line (Re Γ = 0) instead of reaching the boundary, and every arc is closed by a
    straight chord from its boundary end to the right-hand point, so the grid is not
    the standard Smith grid (C1) and the x=0.5 label sits where no arc arrives (C4)
    → draw each arc in full inside the unit circle with no chord. Likely cause: the
    mask `ax >= -0.001` and the argsort over `arctan2` angles that wrap at ±π in the
    reactance-arc loop.'
  - 'SC-02 (both): the r=0.2/0.5/1/2 labels sit at each circle''s centre r/(1+r) instead
    of on the circle, so ''r=2'' lands at Re Γ=0.67 where the r=5 circle crosses the
    axis (C4) → place each at the circle''s left crossing (r−1)/(r+1). Likely cause:
    `x=r / (1 + r)` in the resistance-label loop.'
  - 'VQ-02 (both): the 2.3 GHz, 4.8 GHz and 6.0 GHz labels are struck through by the
    boundary circle and the converging arcs, and the x=0.5/x=−0.5 labels are crossed
    by the boundary → clear the lines by at least a few pixels. Likely cause: the
    fixed 90 px radial offset puts labels for points near |Γ|=1 right on the boundary;
    the reactance labels'' 10 px offsets.'
  - 'Suggestion: a slightly shorter radial offset for near-centre labels would keep
    3.5 GHz tighter to its point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas, no Cartesian axes or frame.
      Chrome: title 'smith-chart-basic · python · bokeh · anyplot.ai' in dark ink at top-left (~62% width); muted grey grid labels r=0.2..2 below the horizontal axis and x=±0.5, ±1, ±2 at the boundary; all readable.
      Data: blue (#4467A3) unit-circle boundary, grey resistance circles and reactance arcs at low alpha, green (#009E73) locus with 60 markers looping from 1.0 GHz (lower right edge) through 2.3 and 3.5 GHz (beside the centre) up to 4.8 and 6.0 GHz (upper right), bold blue frequency labels, purple matched-centre dot with 'Z=Z₀' and dashed purple VSWR=1.5 circle. Arcs for x=±0.2/±0.5 stop at the vertical centre line and straight chords run from boundary points to the right-hand point.
      Legibility verdict: PASS

