      Data: Training curve is brand green (#009E73), Validation curve is lavender/purple (#C475FD) — matches Imprint palette positions 1 and 2. A light lavender ribbon shades the generalization gap between the curves from epoch 48 onward. A hollow purple-ringed marker sits at the minimum validation loss point. Both curves decay from ~2.5 toward near-zero, with validation loss diverging upward past epoch ~48 — the classic overfitting signature.
