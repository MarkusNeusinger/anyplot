review:
  strengths:
  - Theme-adaptive pygal Style threads PAGE_BG / INK / INK_MUTED through every chrome
    element, so both renders read cleanly with identical Imprint data colors
  - Font sizes, stroke width and dot size set at the library prompt's values for the
    3200x1800 canvas, giving balanced, legible text
  - 'Data shows the full training story: steep early drop, a growing gap, and validation
    loss turning upward after its minimum near epoch 30 while training loss keeps
    falling'
  - 'Adaptable structure: column-role constants above one Data block that binds df,
    with pygal lists built from df via .tolist()'
  - Interactive HTML output keeps pygal's native per-point hover tooltips
  weaknesses:
  - 'VQ-05 (both): the legend sits in the top-left canvas corner about 8 px from the
    left edge, above the y-axis title and detached from the plot area → place it next
    to the plot with a margin of at least 40 px, e.g. legend_at_bottom=True with legend_at_bottom_columns=2.
    Likely cause: legend_at_bottom=False, which puts pygal''s legend column at the
    far left of the canvas.'
  - 'DE-02 (both): a dashed grid on both axes with a vertical guide at each of the
    50 epochs, most visible in the light render, where the style guide asks line charts
    for a y-only, solid, subtle grid → drop the vertical guides and keep the horizontal
    ones. Likely cause: show_x_guides=True combined with an x_label (including the
    empty strings) for every epoch.'
  - 'Suggestion: the integer y ticks ''1'' and ''2'' render smaller than ''0.8'' or
    ''1.2'' because pygal draws major labels at major_label_font_size=44 — matching
    it to label_font_size would even out the tick column.'
  - 'Suggestion: the optional marker the Notes allow at the minimum-validation-loss
    epoch (about epoch 30) would point at the early-stopping point.'
