review:
  strengths:
  - 'First series uses brand green #009E73 and second uses canonical Imprint position
    2 (lavender) — correct, non-cherry-picked palette order in both themes.'
  - ChartsReferenceLine marks the true minimum-validation-loss epoch (computed from
    the data, not hard-coded) with a clear 'Early-stop point · epoch N' label — directly
    satisfies the spec's optional early-stopping callout and gives the chart a clear
    narrative focal point.
  - 'Deterministic LCG-seeded data with a realistic training/validation divergence
    shape: smooth joint descent through ~epoch 25, then validation loss visibly diverges
    upward past the reference line while training loss keeps decaying — a textbook,
    readable overfitting signature.'
  - 'Both renders are fully legible: warm off-white / near-black backgrounds are correct,
    all text (title, axis labels, ticks, legend, reference-line label) reads cleanly
    with no dark-on-dark or light-on-light failures, and data colors are pixel-identical
    between themes.'
  - 'Clean, idiomatic MUI X usage: skipAnimation set, sized from window.ANYPLOT_SIZE,
    horizontal-only grid via grid={{horizontal:true}}, sensible sx overrides for axis/legend/line
    font sizes and stroke width.'
  weaknesses:
  - Design Excellence is largely default MUI X styling beyond the reference line and
    horizontal grid — no custom typography, no additional visual hierarchy (e.g. emphasizing
    the post-early-stop divergence region), so DE-01/DE-02 stay near their conservative
    defaults.
  - Library Mastery is solid but only reaches for one distinctive community feature
    (ChartsReferenceLine) — no valueFormatter customization on axes/tooltip, no area/gradient
    fill under the curves, no custom legend markers — leaving LM-02 with room to grow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-loss-training · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. X-axis label "Epoch" and rotated Y-axis label "Cross-Entropy Loss" both dark and legible. Tick labels (0-2.6 on Y, 0-60 on X) are dark and crisp against the light background. Horizontal-only gridlines are subtle gray, visible but not dominant. Legend at bottom center ("Training loss" green swatch, "Validation loss" lavender swatch) is fully legible.
      Data: First series (Training loss) is brand green #009E73, second series (Validation loss) is a lavender/violet consistent with Imprint palette position 2. Both curves decay smoothly together to ~epoch 25, then validation loss (lavender) diverges upward after the dashed vertical "Early-stop point · epoch 35" reference line while training loss (green) keeps decreasing — a clear overfitting signature.
      Legibility verdict: PASS — no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, "Epoch" and "Cross-Entropy Loss" axis labels, and all tick labels render in light/off-white ink, clearly legible against the dark background. Gridlines are a dim gray, subtle but visible. Legend text and swatches at the bottom are legible. Reference-line label "Early-stop point · epoch 35" renders in a soft light gray, readable against the dark background.
      Data: Training loss (green #009E73) and Validation loss (lavender) are pixel-identical in hue to the light render — only the chrome (background, text, grid) flipped, as required. The same overfitting divergence pattern past the epoch-35 reference line is equally visible.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element reads clearly against the near-black surface.
