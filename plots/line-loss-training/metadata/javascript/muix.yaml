      Data: training loss in brand green #009E73 falling from ~2.3 to ~0.15; validation loss in lavender #C475FD falling from ~2.45 to its minimum ~0.41 at epoch 35, then rising to ~1.04 at epoch 60. Both have faint vertical gradient area fills to 0; a very faint amber band shades epochs 35-60.
