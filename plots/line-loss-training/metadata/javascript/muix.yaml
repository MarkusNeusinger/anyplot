review:
  strengths:
  - Both loss curves share one epoch axis from epoch 1 to 60, drawn through every
    logged value in epoch order; the monotoneX interpolation cannot overshoot the
    logged values
  - 'Brand green #009E73 for training and lavender #C475FD for validation, identical
    in both renders; chrome (ticks, axis titles, legend, reference-line label) is
    threaded through t.ink / t.inkSoft / t.grid and reads cleanly on #FAF8F1 and #1A1A17'
  - The early-stop epoch is computed from the data (argmin of validation loss = epoch
    35) and marked with a native ChartsReferenceLine whose dashed line meets the validation
    curve at its lowest point
  - A faint amber band from the early-stop epoch to the last epoch frames the overfitting
    window, so the widening train/validation gap (0.15 vs 1.04 at epoch 60) becomes
    the focal point of the chart
  - 'Idiomatic MUI X v9 composition: children inside LineChart, useXScale/useDrawingArea
    hooks for the custom SVG layer, SVG <defs> gradients bound through [data-series]
    sx selectors, explicit axis bands, skipAnimation'
  - Linear loss axis from 0 keeps the late-epoch gap readable without being flattened
    by the epoch-1 loss of ~2.4
  - 'Realistic, deterministic data (fixed-seed LCG): exponential decay, slight noise,
    validation loss turning upward past epoch ~35 while training loss keeps falling'
  weaknesses:
  - 'Suggestion: the two overlapping gradient area fills mix into a grey-blue tint
    under the curves in both renders; dropping the training-loss fill (or both) would
    keep the two line colors purer.'
  - 'Suggestion: the `as any` cast on useXScale() is unnecessary in a bundle-only
    snippet and could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, not pure white.
