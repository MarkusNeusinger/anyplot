      Data: Training loss is #009E73 (Imprint green, palette[0]) with a soft gradient fill to baseline; validation loss is a violet (Imprint palette[1]) with a matching gradient fill. Both are clearly distinguishable from each other and the background. A dashed ink-colored reference line marks the best-val-loss epoch (35), with a light amber-tinted band shading the post-early-stop divergence zone through epoch 60.
