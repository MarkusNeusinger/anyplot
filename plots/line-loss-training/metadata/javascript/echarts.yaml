      Data: Training loss remains the identical brand green (#009E73); validation loss remains the identical lavender-purple (#C475FD) — confirmed pixel-identical data colors between the two renders, only chrome flipped.
      Legibility verdict: PASS — title, axis labels, tick labels, and legend are all light-colored and clearly legible against the dark background; no dark-on-dark failures found.
