    Light render (plot-light.png):
      Background: Warm off-white, confirmed pixel-exact #FAF8F1 (sampled RGB 250,248,241).
      Chrome: Title "line-loss-training · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Legend below title ("Training loss", "Validation loss") in soft dark gray. X-axis "Epoch" (1-60) and Y-axis "Cross-Entropy Loss" (0-2.5) labels and tick labels all dark/soft-dark and crisp against the light background. A dashed vertical reference line at epoch 43 has a small rotated label "Min val loss · epoch 43".
      Data: Two lines — training loss in brand green (#009E73) dropping smoothly from ~2.1 to ~0.15; validation loss in lavender-purple (#C475FD) tracking closely early on, then plateauing and drifting back up after ~epoch 28-30, visibly diverging from the training curve (overfitting). A small open circle marks the minimum validation loss point (~epoch 43).
