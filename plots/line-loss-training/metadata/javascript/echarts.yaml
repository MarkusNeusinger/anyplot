review:
  strengths:
  - Implements the spec's optional 'mark the epoch with minimum validation loss' feature
    via a markLine + scatter overlay with an auto-positioned label
  - 'Perfect Imprint palette compliance: first series is exactly #009E73, second is
    palette position 2 (#C475FD), both identical across light/dark renders'
  - 'Backgrounds are pixel-exact #FAF8F1 (light) / #1A1A17 (dark); all chrome (title,
    legend, ticks, grid) is theme-correct in both renders'
  - Realistic, deterministic training/validation loss curves (seeded LCG) that clearly
    show the overfitting divergence pattern after ~epoch 28
  - Title and legend exactly match the mandated format and data labels; no clipping
    or overlap in either render
  weaknesses:
  - 'DE-01/DE-02: reads as a well-configured chart rather than design-forward — the
    x-axis spine is kept while the y-axis spine is hidden (inconsistent choice); pick
    one treatment (both hidden, or both present as an L-frame) for a more polished
    look'
  - 'DE-03: the dashed marker + label calls out the minimum-val-loss epoch, but the
    actual overfitting story (the growing gap between train and val loss after ~epoch
    28) isn''t otherwise emphasized — consider shading the gap region between the
    two curves past the stopping point, or a subtle color/opacity shift, to make the
    divergence the clear visual focal point'
  - 'VQ-01: font sizes are all explicitly set and well-proportioned, but there''s
    room to push title/legend typography further for a more distinctive hierarchy'
