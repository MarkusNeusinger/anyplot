    via a scatter ring + dashed markLine + auto-positioned label, and now reinforces
    it with the shaded generalization-gap area
  - Realistic, deterministic (seeded LCG) training/validation loss curves that clearly
    show both the shared exponential decay and the post-epoch-28 overfitting divergence
