review:
  strengths:
  - Composes a custom SVG map layer inside ChartsContainer through the useXScale/useYScale/useDrawingArea
    hooks, so land masses, arcs and markers share MUI X's own linear lon/lat scales,
    grid and axes
  - Routes crossing the antimeridian (LAX–SYD, SFO–HKG, LAX–NRT, PEK–LAX) are split
    at ±180° and continue on the opposite edge instead of streaking across the map
  - Line thickness (3–9 px) and opacity (0.45–0.70) both follow annual passengers,
    so the JFK–LHR/CDG and DXB–LHR corridors read as the busiest while thin routes
    stay visible
  - Arcs bow toward the nearer pole as quadratic curves, giving a geodesic look; endpoint
    markers carry a page-colored ring that separates them from the lines meeting there
  - 'Base map is quieter than the data: land in the grid token at 0.6 opacity with
    a soft inkSoft outline, identical treatment in both themes'
  - Airport codes are placed on the side away from their routes and from close neighbors
    (LHR/CDG/FRA cluster stays readable); title, axes and caption are all theme tokens
    and readable in both renders
  weaknesses:
  - 'SC-02 (both): the base map is too coarse to place the airports — Britain, Japan,
    Indonesia, New Zealand and Greenland are missing, so LHR sits just outside the
    Europe outline and NRT on the bare Asian edge → coastline vertices detailed enough
    that every endpoint airport lands on its land mass (add the British Isles and
    Japan at least). Likely cause: the hand-written CONTINENTS polygons with 10–24
    vertices each.'
  - 'Suggestion: a small key with three reference line widths (e.g. 260 / 540 / 820
    thousand passengers) would make the thickness encoding readable as values, not
    only as the caption sentence.'
  - 'Suggestion: a Robinson or Natural Earth projection of the lon/lat inputs, as
    the Notes suggest, would make the world map read less stretched at high latitudes
    than the plate carrée frame.'
  - 'Suggestion: line 375 has the valueFormatter on the same line as the label after
    a run of spaces; one property per line would match the rest of the file.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: centered title "map-connection-lines · javascript · muix · anyplot.ai" (~31 % of width) in dark ink; x axis "Longitude (°)" with ticks -180° to 180° every 10°, y axis "Latitude (°)" with ticks -40° to 60°; dashed Equator and Prime Meridian lines with soft labels; bottom-left caption "Line thickness and opacity encode Annual passengers (thousands); marker size encodes route degree." All text dark on light and readable; subtle grid visible.
      Data: simplified grey continents (North/South America, Europe, Africa, Asia, Australia) under 16 brand-green #009E73 translucent curved routes of varying width between 14 airports (JFK, LHR, CDG, LAX, SFO, NRT, SYD, HKG, ORD, FRA, DXB, SIN, GRU, JNB, DEL, PEK); trans-Pacific routes leave one edge and re-enter at the other. Green endpoint circles sized by route count with a cream ring; airport codes in dark ink next to each. No clipped text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels, Equator/Prime Meridian labels, airport codes and caption all switch to light ink and are clearly readable; no dark-on-dark text. Grid subtle grey, land masses a slightly lighter warm grey with a soft outline.
      Data: identical #009E73 routes and markers at the same widths and opacities as the light render (translucent lines appear deeper green over the dark surface); markers ringed in the dark page color. Brand green clearly visible.
      Legibility verdict: PASS
