review:
  strengths:
  - Brand-green Imprint palette and theme-correct backgrounds/chrome hold identically
    across both light and dark renders
  - Thoughtful dual encoding of passenger volume via arc thickness AND opacity, plus
    hub-circle radius scaled by route degree, creates a clear visual hierarchy (JFK/LHR/DXB/SYD
    read immediately as major hubs)
  - Manual label-nudging (labelNudge map) prevents the LHR/CDG/FRA labels from colliding
    in the dense European cluster while keeping the markers at true coordinates —
    real attention to detail
  - Creative, idiomatic use of ChartContainer plus the useXScale/useYScale/useDrawingArea
    hooks to build a custom SVG connection-arc overlay — a chart type MUI X does not
    offer natively, achieved without leaving the community package
  - 'Realistic, factually accurate data: real airport coordinates and plausible real-world
    passenger volumes for the routes shown'
  weaknesses:
  - 'Title is horizontally off-center in BOTH renders: measured pixel bounding box
    is x=1613-2608 out of the 3200px canvas (center ~2110), while the canvas/plot-area
    center is ~1600 - a ~510px (16% of width) rightward shift that leaves a large
    empty quadrant at top-left. The MapTitle x calculation (drawingArea.left + drawingArea.width/2)
    is not landing at the true center; center it explicitly against window.ANYPLOT_SIZE.width/2
    instead, or debug why the drawingArea-based center is off.'
  - Spec explicitly asks to 'show a base map with country borders or coastlines for
    geographic context' - this implementation renders only a bare longitude/latitude
    grid with Equator/Prime Meridian reference lines, no coastline or country-border
    geography at all. Since MUI X community has no map component, add a simplified,
    manually-drawn world-coastline SVG path (even a low-detail continent outline)
    as a background layer behind the connection arcs so the chart reads as a map rather
    than an abstract scatter grid.
  - 'Line opacity slightly exceeds the spec''s suggested alpha range: code computes
    strokeOpacity = 0.35 + ratio * 0.35, maxing at 0.70, versus the spec''s suggested
    ~0.3-0.6 - tighten the formula to stay within that band.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "map-connection-lines · javascript · muix · anyplot.ai" is dark ink, clearly legible, but sits noticeably right of the horizontal center (measured bbox x=1613-2608 of 3200px canvas), leaving a large blank area at top-left. Axis labels ("Longitude (°)", "Latitude (°)") and tick labels are dark/soft-dark ink, fully readable. Grid lines are thin and subtle. Dashed Equator/Prime Meridian reference lines with small gray labels are visible and unobtrusive. Caption at bottom-left ("Line thickness and opacity encode annual passenger volume...") is legible in soft ink.
      Data: All connection arcs and airport markers render in the single brand green (#009E73), with arc thickness and opacity scaled to passenger volume and marker radius scaled to route-count (hub size). Airport code labels (JFK, LHR, SYD, etc.) are dark and legible, with LHR/CDG/FRA manually nudged apart to avoid collision.
      Legibility verdict: PASS (title readable despite being off-center; all other text clearly readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title text now rendered in light ink, same off-center position as the light render (identical pixel bbox, confirming a reproducible, deterministic layout defect rather than a one-off rendering fluke). Axis labels and tick labels are light-colored and clearly legible against the dark background - no dark-on-dark failures observed. Grid lines and reference-line dashes remain subtle but visible. Caption text is legible in soft light ink.
      Data: Connection arcs and airport markers are still the identical brand green #009E73 as the light render - only the chrome (background, text, grid) flipped, as required. Airport code labels remain legible in light ink.
      Legibility verdict: PASS (no dark-on-dark issues; data colors identical to light render; same title centering defect carries over).
