review:
  strengths:
  - Composes the map as a custom SVG layer inside ChartsContainer via useXScale/useYScale/useDrawingArea,
    so land masses, arcs and markers share the MUI X axis scales and grid exactly
  - Line thickness (2.5-8.5 px) and opacity (0.3-0.6) both scale with annual passengers,
    so the JFK-LHR / JFK-CDG / DXB-LHR transatlantic corridor reads as the busiest
    bundle
  - Aspect-preserving extent (cos(mean lat) correction) keeps continents undistorted
    in an equirectangular frame
  - Land masses drawn in the grid token at 0.6 opacity sit clearly beneath the green
    routes in both themes
  - Endpoint markers carry a page-colored outline, keeping them distinct from the
    arcs that meet at hubs
  - 'Realistic scenario: 16 real long-haul routes between real airports at true coordinates
    with plausible passenger volumes'
  weaknesses:
  - 'SC-03 (both): the trans-Pacific routes (LAX-NRT, LAX-SYD, SFO-HKG, PEK-LAX) are
    split at ±180° but the x-axis only spans about -145° to 172°, so each of them
    leaves the frame at one edge and re-enters at the other with its middle section
    invisible → an extent that shows every route whole (e.g. a Pacific-centred longitude
    range or a -180° to 180° frame). Likely cause: LON_MIN/LON_MAX derived from airport
    longitudes only while the arcs are wrapped at the antimeridian.'
  - 'VQ-03 (dark): the thinnest routes (GRU-CDG, JNB-DXB, HKG-SYD, LAX-SYD) render
    at 2.5 px with opacity 0.30 and almost dissolve into the #1A1A17 background →
    a floor of about 0.45 opacity (+0.15) or 3.5 px width so every route stays traceable.
    Likely cause: strokeOpacity = 0.3 + ratio * 0.3 with the low end tuned for the
    light surface.'
  - 'VQ-02 (both): the GRU label sits where the GRU-JFK and GRU-CDG arcs leave the
    marker, so both lines cross the letters → place the label on the side away from
    the departing routes (e.g. below the marker). Likely cause: the default label
    offset dy = -(radius + 9) puts every isolated label above its marker.'
  - 'VQ-06 (both): the axis titles read ''Origin latitude (°)'' and ''Origin longitude
    (°)'' although the axes position both origins and destinations and the land mass
    → ''Latitude (°)'' and ''Longitude (°)''. Likely cause: the axis label taken from
    the ORIGIN_LAT/ORIGIN_LON column names.'
  - 'VQ-05 (both): the latitude band from -40° to -65° (about a fifth of the plot
    height) is empty while the routes are cut at the left and right edges → a tighter
    latitude range that gives the freed height to the map. Likely cause: the aspect
    correction expands LAT span symmetrically around the data centre.'
  - 'Suggestion: a more detailed coastline (UK, Japan, Indonesia, separate Arabian
    peninsula) would make the base map read as a world map rather than abstract polygons.'
  - 'Suggestion: a Robinson-like projection, which the Notes suggest for world maps,
    would give the arcs a more natural geographic frame than the latitude/longitude
    grid.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title "map-connection-lines · javascript · muix · anyplot.ai" centred at top in dark ink; y-axis "Origin latitude (°)" with ticks -60° to 80° every 10°, x-axis "Origin longitude (°)" with ticks -140° to 170° every 10°; dashed Prime Meridian and Equator reference lines with soft-ink labels; caption at bottom-left explaining that line thickness/opacity encode annual passengers and marker size encodes route degree. Subtle grey grid. All text readable.
      Data: simplified continents as light-grey polygons with thin outlines; 16 routes drawn as poleward-bowing curves in #009E73 with varying width and opacity; the JFK-LHR/JFK-CDG/DXB-LHR corridor is the thickest. Green endpoint markers with page-colored outline, sized by route degree (JFK, DXB, LHR, SYD, LAX largest), labelled with IATA codes. Trans-Pacific routes exit at the left/right frame edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, axis titles, tick labels, reference-line labels, airport codes and caption all in light ink; grid subtle grey; no dark-on-dark text.
      Data: identical #009E73 routes and markers; continents in a dark-grey fill with lighter outlines. The thinnest low-opacity routes (GRU-CDG, JNB-DXB, HKG-SYD) are noticeably fainter than in light mode but still traceable.
      Legibility verdict: PASS
