review:
  strengths:
  - Hub markers sized by route degree, plus line thickness and opacity mapped to passenger
    volume within the spec's suggested 0.3-0.6 alpha range - a coherent multi-variable
    encoding.
  - Hand-traced continent outlines and Equator/Prime Meridian reference lines give
    real geographic context despite MUI X having no native map/geo chart type.
  - Idiomatic, creative use of MUI X's compositional model - useXScale/useYScale/useDrawingArea
    hooks drive the quadratic-bezier arcs and continent paths as custom overlays layered
    on ChartContainer.
  - 'Both themes render correctly: identical #009E73 data color in light and dark,
    theme-adaptive chrome, canvas exactly 3200x1800.'
  - Manual label-nudge handling for the tightly clustered LHR/CDG/FRA hub successfully
    avoids overlap there.
  weaknesses:
  - SFO and LAX are geographically close; LAX's default label-nudge (dy = -(radius+8),
    dx = 0, since it isn't in the manual labelNudge map) places the 'L' of the 'LAX'
    text directly overlapping the SFO circle marker in both light and dark renders.
    Add an SFO/LAX entry to labelNudge (same technique already used for LHR/CDG/FRA)
    to separate them.
  - The spec's optional `label` field (route name/identifier for tooltips) isn't surfaced
    anywhere - not even as a native SVG <title> on each route path. Since the custom
    overlay paths bypass MUI X's own tooltip system, add a <title> child per route
    arc so the interactive HTML exposes route names on hover.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent cream), not pure white.
      Chrome: Title "map-connection-lines · javascript · muix · anyplot.ai" in dark ink, centered, fully visible. Longitude/Latitude axis titles and tick labels in dark/soft-dark ink, clearly legible. Grid lines are subtle light gray. Dashed Equator and Prime Meridian reference lines with small gray labels are visible but unobtrusive. Caption at bottom-left in soft ink explains the thickness/opacity encoding.
      Data: Continent outlines rendered as light gray filled polygons with soft borders, giving map context. Sixteen green (#009E73) bezier-arc connection lines vary in thickness (2.5-8.5px) and opacity (0.3-0.6) by passenger volume. Sixteen green circular airport markers, sized by route-degree (hub importance), each with a white halo stroke and a dark IATA-code label positioned to avoid the marker.
      Legibility verdict: PASS. All text reads clearly against the light background. One minor exception: the "LAX" label text overlaps the adjacent SFO marker circle (not a legibility failure of the text itself, but a collision with a data element - see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title and axis titles/ticks render in light ink, fully legible against the dark background - no dark-on-dark text anywhere. Grid lines are subtle light gray, visible without dominating. Reference-line labels and caption are in a soft light gray, readable.
      Data: Identical #009E73 green used for arcs and markers - confirmed unchanged from the light render, only the chrome (background, text, grid, continent fill/stroke) flipped tone. Continent polygons render as dark gray masses with lighter gray outlines, still legible as landmasses against the near-black ocean/background.
      Legibility verdict: PASS. All text is clearly readable in the dark theme; no dark-on-dark or light-on-light failures. Same LAX/SFO marker-label collision as in the light render (layout-level issue, present in both themes).
