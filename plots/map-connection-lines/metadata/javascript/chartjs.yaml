review:
  strengths:
  - Fully custom world-map rendering built from scratch with a beforeDatasetsDraw
    canvas plugin, since Chart.js has no native geo chart type — a genuinely distinctive
    technique, not a generic scatter chart in disguise.
  - Connection arcs are quadratic bezier curves (not straight lines) with both line
    thickness and alpha opacity scaled to passenger volume via min-max normalization,
    correctly implementing the spec's 'thickness or color represents value' and 'alpha
    ~0.3-0.6' requirements.
  - Airport markers are sized by route-degree (hub centrality), adding an extra, unrequested
    but valuable visual-hierarchy signal that clearly highlights major hubs (London/Paris/Frankfurt
    cluster).
  - 'Theme-adaptive chrome is correctly threaded through: title/axis/tick colors from
    tokens, continent fill/stroke uses semi-transparent ink so it works on both light
    and dark backgrounds without a separate branch.'
  - Data is realistic and neutral — real named airports (JFK, LHR, DXB, HND, SYD,
    ...) with plausible passenger-volume figures (280-620), fully deterministic and
    hardcoded.
  weaknesses:
  - 'Antimeridian wraparound is not handled: LAX-HND, PEK-LAX, and LAX-SYD are all
    trans-Pacific pairs whose longitudes are more than 180 degrees apart, but the
    quadratic-curve midpoint is computed directly from raw pixel coordinates, so the
    drawn arcs sweep the ''long way'' around the globe through the Atlantic/Europe/Africa
    instead of across the Pacific — the opposite of the real geodesic path for these
    three routes. Fix: when |dest_lon - origin_lon| > 180, shift one endpoint by ±360
    before projecting (or split the arc at the +/-170 boundary) so the curve bulges
    toward the shorter side.'
  - No visual key/legend explains that arc thickness and opacity encode passenger
    volume — a reader has no way to translate line weight into an actual number without
    guessing; consider a small 2-3 stop thickness legend near a corner.
  - The three closely-spaced European airports (LHR/CDG/FRA, all within ~8 degrees
    of each other) render as nearly overlapping circles, making it hard to tell there
    are three distinct hubs rather than one — acceptable given real geography, but
    a tiny radial offset or halo could improve legibility at this zoom level.
  - Passenger-volume range across routes (280-620) is fairly narrow, so the thickness/opacity
    encoding is present but doesn't show dramatic contrast between a clearly major
    artery and a clearly minor route — widening the range would better demonstrate
    DQ-01 feature coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Global Flight Routes · map-connection-lines · javascript · chartjs · anyplot.ai" is dark and fully legible across the top. "Longitude"/"Latitude" axis titles and the degree-suffixed tick labels (-170° ... 170°, -58° ... 78°) are dark-gray/near-black and clearly readable against the light surface. Gridlines form a subtle graticule, visible but not competing with the data. Stylized continent silhouettes are a faint warm-gray fill with a thin grid-colored outline, giving geographic context without dominating.
      Data: All connection arcs and airport markers render in the same brand green (#009E73). Arc thickness and opacity visibly vary with route passenger volume (thin/faint for lower-volume routes, thick/opaque for the JFK-LHR/CDG cluster). Markers are sized by hub degree — large circles at LHR/JFK/FRA-area hubs, small dots at single-route airports (e.g. GRU, JNB). No text overlaps data or other text.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and both axis titles render in light/off-white text, fully legible against the dark surface. Tick labels are a lighter secondary gray, still clearly readable — no dark-on-dark failures observed. Gridlines are a faint light-on-dark graticule, subtle but visible. Continent silhouettes use a lighter semi-transparent fill appropriate for the dark surface.
      Data: Arcs and markers remain the identical brand green (#009E73) as the light render — confirmed same hue, same relative thickness/opacity pattern per route, same marker-size hierarchy. Only the chrome (background, text, grid, continent fill) flipped between themes.
      Legibility verdict: PASS.
