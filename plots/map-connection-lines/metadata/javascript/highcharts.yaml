review:
  strengths:
  - Sophisticated hand-drawn coastline base map (stylized land bands + subtle ocean
    tint) gives real geographic context despite the core Highcharts bundle having
    no maps module.
  - Bezier-arc routes with alpha blending (0.45) correctly implement the spec's guidance
    to curve long-distance connections and handle overlap via transparency.
  - 'Dual encoding of connection volume: route line width AND port marker radius (by
    connection degree) both scale with the data, reinforcing the hub-and-spoke story
    (Nordhaven / Tidemark labeled as hubs).'
  - Custom hand-drawn width legend (via chart.renderer) fills a real gap — Highcharts
    core has no built-in size legend for line width — and reads clearly in both themes.
  - 'Theme handling is clean: brand green (#009E73) route/port color is identical
    light vs dark, while background, grid, and text chrome correctly flip per token.'
  weaknesses:
  - With 16 overlapping arcs converging on a few hub ports, the mid-chart reads as
    visually dense/cluttered — tracing any single route is hard. Consider widening
    the bow separation or slightly reducing route count for clarity.
  - The route-width legend shows only 'Lower volume' / 'Higher volume' labels without
    the actual TEU value range (e.g. '45k' / '310k') — adding numeric endpoints would
    make the encoding self-contained without needing the tooltip.
  - 'CQ-01: the script relies on ~8 helper functions (coastline curves, arc geometry,
    degree counting, plus three separate renderer-annotation functions) — justified
    by the geometric complexity, but drawHubLabels/drawOceanLabel could be merged
    into one annotation helper for a slightly leaner structure.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec target — not pure white.
      Chrome: Title "map-connection-lines · javascript · highcharts · anyplot.ai" and subtitle in dark ink, both fully legible top-left. Axis titles "Longitude (°)" / "Latitude (°)" and tick labels in soft dark gray, clearly readable against the light background and against the light-gray plot fill. Bottom width-legend text ("Route width ∝ annual cargo volume", "Lower volume", "Higher volume") also legible.
      Data: Route arcs and port markers render in the brand green (#009E73) at ~0.45 alpha; hub ports (Nordhaven, Tidemark) are visibly larger circles with bold black labels. Stylized land bands (light gray) frame a lighter open-ocean channel where the "Open ocean" italic label sits. Line widths visibly vary with cargo volume.
      Legibility verdict: PASS — no text is light-on-light; all chrome elements are dark and readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec target — not pure black.
      Chrome: Title, subtitle, axis titles, and tick labels all render in light/near-white text, clearly legible against the dark background. Grid lines are subtle but visible. Bottom width-legend text is light-colored and readable against the dark canvas.
      Data: Route arcs and port markers use the identical brand green (#009E73) at the same 0.45 alpha as the light render — confirmed unchanged. Only the chrome (background, land-band grays, grid, text) flips to the dark palette; hub labels remain legible in light text.
      Legibility verdict: PASS — no dark-on-dark failures; all tick labels, axis titles, and annotation text are clearly visible against the near-black surface.
