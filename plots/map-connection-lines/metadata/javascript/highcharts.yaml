review:
  strengths:
  - 'First categorical series is the correct brand green #009E73, and every chrome
    element (background, title, axis labels, ticks, grid, legend text) flips correctly
    between the #FAF8F1 light surface and #1A1A17 dark surface with no dark-on-dark
    or light-on-light failures.'
  - 'Genuinely creative workaround for the highcharts core bundle''s missing maps
    module: a hand-drawn stylized coastline built from real lon/lat coordinates keeps
    the axes geographically meaningful instead of faking a real basemap.'
  - Route line width is proportionally encoded by cargo volume (1.5-6.5px) with alpha
    0.45 to manage the 16 overlapping arcs, and a custom hand-drawn width legend (via
    chart.renderer) explains the encoding clearly.
  - 'Strong data storytelling: Nordhaven and Tidemark are labeled as hubs and rendered
    with larger markers (radius scales with connection degree), so the hub-and-spoke
    structure of the shipping network is immediately visible.'
  - 'Idiomatic and distinctive Highcharts usage: correct series-type composition (area
    for coastlines, line for arcs, scatter for ports) plus direct chart.renderer text/path
    calls in the onLoad callback for custom annotations.'
  - Clean, deterministic, dependency-free code with animation disabled on both chart
    and series, credits removed, and no explicit width/height passed to Highcharts.chart.
  weaknesses:
  - The 16 crossing arcs create a fairly dense web near Nordhaven/Tidemark; the hub-and-spoke
    story reads clearly once the viewer notices the labeled hubs and larger markers,
    but a first glance is busier than it needs to be — thinning the lowest-volume
    routes' opacity slightly further would sharpen the focal point.
  - The stylized land fill (a flat neutral-gray tint above/below the coastline curve)
    reads as generic shading rather than a convincing landmass; a subtle secondary
    texture or slightly stronger contrast against the water tint would sell the map
    metaphor better within the library's constraints.
  - MARGIN_BOTTOM (195px, ~22% of mount height) is dedicated to the custom width legend
    — functional and not isolated from the plot, but leaves the bottom area feeling
    a bit heavy compared to the tighter top/side margins.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "map-connection-lines · javascript · highcharts · anyplot.ai" in bold dark ink, fully readable; subtitle in medium-gray, readable; "Longitude (°)" / "Latitude (°)" axis titles and numeric tick labels in soft dark gray, all clearly legible against the cream background; subtle light-gray gridlines visible but not competing with data; custom "Route width ∝ annual cargo volume" legend text and hub labels ("Nordhaven", "Tidemark", "Open ocean") all readable dark text.
      Data: Route arcs and port markers render in the correct brand green #009E73 (translucent for arcs, solid for ports); land bands above/below the coastline are a soft neutral-gray tint; the plot area carries a faint blue (Imprint palette position 3, water semantic exception) tint standing in for open ocean.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, subtitle, axis titles, tick labels, hub labels, and the custom width-legend text all render in light/soft-light tones, fully readable against the dark surface — no dark-on-dark text anywhere; gridlines are still subtle but visible.
      Data: Route arcs and port markers are the identical #009E73 green as the light render (confirmed unchanged); land tint and water tint are still present, appropriately adjusted for the dark surface but not altering the data color.
      Legibility verdict: PASS
