review:
  strengths:
  - Line width AND opacity both scale with passenger volume (1.2-6.2px, opacity 0.28-0.60)
    — falls squarely inside the spec's recommended 0.3-0.6 transparency band and makes
    high-traffic routes visually dominant
  - Node marker size scales with total hub traffic (sqrt scaling), so major hubs (LHR,
    DXB, SIN) read as visually larger without a separate legend
  - 'Curved great-circle-style arcs (curveness: 0.2) with directional arrow symbols
    avoid straight-line overlap and hint at flow direction'
  - 'Deterministic, realistic dataset: 12 real-world major airports with accurate
    lon/lat coordinates and plausible passenger-volume magnitudes'
  - 'Clean theme-adaptive chrome: identical brand-green data color in both renders,
    correct #FAF8F1/#1A1A17 backgrounds, all text readable in both themes'
  - Honest code comment explaining why a lon/lat graticule substitutes for a basemap
    (no bundled GeoJSON, no network fetch allowed per the echarts library rules) rather
    than silently omitting geographic context
  weaknesses:
  - Spec explicitly asks to 'show a base map with country borders or coastlines for
    geographic context'; the implementation instead renders a bare longitude/latitude
    Cartesian grid with no coastlines, borders, or landmass shading, so the plot reads
    more like a scatter/line chart than a map — this is the single biggest gap versus
    the spec.
  - LHR and FRA markers/labels sit very close together (~9 degrees of longitude apart)
    and their top-positioned text labels crowd each other slightly — consider offsetting
    overlapping-cluster labels (e.g. alternate label position between 'top' and 'bottom')
    when two hubs are this close.
  - The hub cluster around DXB/DEL/HKG/SIN also gets visually dense with converging
    arcs — a touch more curveness or slightly thinner secondary-route lines would
    help disambiguate individual routes in that region.
  - '''Routes'' and ''Airports'' series carry no legend; while a single-hue palette
    makes this a low-severity omission, a compact legend or in-title note distinguishing
    ''line = route, circle = airport'' would remove any residual ambiguity for first-time
    viewers.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Global Flight Routes · map-connection-lines · javascript · echarts · anyplot.ai" centered at top in dark ink, subtitle below in softer gray explaining the width/opacity/size encoding. X-axis "Longitude" and Y-axis "Latitude" with degree-formatted tick labels (e.g. "150°W", "30°N"). Light, subtle gridlines every 30 degrees. All chrome text is dark-on-light and clearly legible.
      Data: 12 airport nodes (JFK, LAX, GRU, LHR, FRA, JNB, DXB, DEL, SIN, HKG, HND, SYD) rendered as brand-green (#009E73) filled circles sized by hub traffic, connected by brand-green curved arcs whose width and opacity scale with route passenger volume. Directional arrowheads mark the destination end of each route. No basemap/coastlines are present — geographic context comes only from the lon/lat graticule and airport-code labels.
      Legibility verdict: PASS — all title, subtitle, axis, and tick text is clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle layout, now rendered in light ink (#F0EFE8) and soft gray subtext, both clearly visible against the dark background. Axis labels and tick labels are light gray and legible. Gridlines are subtle and visible without competing with the data.
      Data: Data colors are identical to the light render — same brand-green (#009E73) nodes and arcs, same width/opacity/size encoding, same arrow markers. Confirms the Imprint rule that only chrome flips between themes, not data color.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, subtitle, axis names, tick labels, airport code labels) is clearly visible against the near-black background.
