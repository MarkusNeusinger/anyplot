review:
  strengths:
  - 'True great-circle arcs computed by spherical interpolation every 2° and split
    at the antimeridian: LAX–LHR bows over Greenland and HND–SYD runs as a near-straight
    north-south line, exactly what the spec asks for'
  - Natural Earth projection passed to ECharts' geo component as a custom project/unproject
    pair, with a self-contained registered GeoJSON base map (land, graticule, outline)
    so the render is offline and global
  - Line width and opacity both scale with passenger volume, and translucent overlap
    builds visibly denser corridors (JFK–LHR/JFK–FRA, LHR/FRA–DXB) rather than an
    opaque mass
  - 'Quiet base map: land tint derived with echarts.color.lerp from the theme tokens,
    graticule hidden under the land, coastlines in the grid tone — chrome flips correctly
    between themes while route and marker green stays identical'
  - 'Realistic, neutral scenario: twelve real hub airports at their true coordinates
    with plausible annual passenger volumes in thousands'
  - 'Native interactivity in the HTML output: item tooltips for routes and airports
    with passenger counts'
  weaknesses:
  - 'VQ-02 (both): the GRU and JNB airport labels sit on the incoming route lines
    — the JFK–GRU and LHR–JNB arcs run through the first letters of ''GRU'' and ''JNB''
    → labels clear of the lines that arrive at their marker. Likely cause: label position
    ''top'' with distance 6 on endpoints where routes arrive from directly above.'
  - 'VQ-03 (dark): the lowest-volume routes (FRA–DEL, GRU–LHR, LHR–JNB, JFK–GRU) at
    opacity ~0.35 and ~1.5 px read as dim olive strokes that barely separate from
    the #33332E land tint → raise the floor of the opacity ramp (about 0.28 → 0.4,
    +0.12) so the thinnest arcs stay visible on the dark surface. Likely cause: lineStyle
    opacity 0.28 + share * 0.32.'
  - 'Suggestion: a small width key (two or three sample strokes with their passenger
    values) would let the reader read volumes off the map instead of only from the
    tooltip.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: centered dark title "Global Flight Routes · map-connection-lines · javascript · echarts · anyplot.ai" with a softer-ink subtitle explaining that line width & opacity scale with annual passenger volume (thousands) and marker size with hub traffic. Natural Earth world map (60°S–84°N) with light-grey land, thin grid-tone coastlines and a subtle 30° graticule visible over the ocean only. Airport codes (LAX, JFK, GRU, LHR, FRA, JNB, DXB, DEL, SIN, HKG, HND, SYD) in dark ink above their markers — all readable.
      Data: 18 routes drawn as translucent #009E73 great-circle arcs of varying width/opacity (thickest JFK–LHR, DXB–SIN, SIN–HKG); LAX–LHR arcs high over Greenland; green circular hub markers with page-colored outline sized by traffic (DXB, SIN, LHR largest). GRU and JNB labels are touched by incoming arcs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title in light ink, subtitle in soft light grey, land in a dark warm grey tint, graticule and coastlines subtle but visible. Airport labels in light ink — no dark-on-dark text anywhere.
      Data: identical #009E73 routes and markers as the light render (markers outlined in the dark page color); only chrome flipped. Thinnest low-volume arcs are dim against the dark land tint but still traceable.
      Legibility verdict: PASS
