review:
  strengths:
  - Landmass base map (hand-simplified continent silhouettes rendered via a custom
    ECharts series) now gives genuine geographic context, directly addressing attempt
    1's biggest gap versus the spec's 'show a base map with country borders or coastlines'
    requirement
  - FRA label repositioned to 'bottom' resolves the LHR/FRA label crowding flagged
    in the prior review; the two node labels no longer overlap
  - Overlapping node markers near LHR/FRA stay individually distinguishable thanks
    to the theme-adaptive borderColor (matches page background), so hub-cluster density
    doesn't collapse marker identity
  - Dense-cluster routes (DXB/DEL/HKG/SIN) get extra curveness and thinned line width
    via the denseCluster set, visibly reducing arc congestion versus attempt 1
  - Line width AND opacity both scale with passenger volume (1.2-6.2px, opacity 0.28-0.60),
    squarely inside the spec's recommended 0.3-0.6 transparency band; node marker
    size scales with total hub traffic
  - 'Clean theme-adaptive chrome: identical brand-green data color and landmass tint
    in both renders, correct #FAF8F1/#1A1A17 backgrounds, all text readable in both
    themes'
  weaknesses:
  - Landmass silhouettes are hand-simplified low-vertex approximations rather than
    true coastline/country-border data - recognizable as continents but visually rough
    (Europe/Asia render as one merged blob, Africa's outline is angular); acceptable
    given the offline no-GeoJSON constraint but keeps SC-01 short of full marks
  - LHR and FRA node markers still visually overlap (circles intersect roughly 30%)
    even though their labels no longer collide - consider a small positional offset
    for close hub pairs
  - No legend distinguishing 'line = route' vs 'circle = airport' - low severity given
    the single-hue palette and now-present basemap, but still an easy add to remove
    residual ambiguity
  - The DXB/DEL/HKG/SIN cluster remains the visually busiest part of the plot; despite
    the curveness/width tweaks, several arcs still cross closely together there
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "Global Flight Routes · map-connection-lines · javascript · echarts · anyplot.ai" centered at top in dark ink, subtitle below in softer gray explaining the width/opacity/size encoding. X-axis "Longitude" and Y-axis "Latitude" with degree-formatted tick labels (e.g. "150°W", "30°N"). Light, subtle gridlines every 30 degrees. All chrome text is dark-on-light and clearly legible.
      Basemap: New in this attempt - simplified light-gray continent silhouettes (North America, South America, Europe/Asia as one merged landmass, Africa, Australia) fill the graticule as a soft polygon layer beneath the routes, giving genuine geographic framing that was missing in attempt 1.
      Data: 12 airport nodes (JFK, LAX, GRU, LHR, FRA, JNB, DXB, DEL, SIN, HKG, HND, SYD) rendered as brand-green (#009E73) filled circles sized by hub traffic, connected by brand-green curved arcs whose width and opacity scale with route passenger volume. Directional arrowheads mark the destination end of each route. LHR and FRA markers overlap slightly but each retains a page-background-colored border ring, keeping them visually distinct. The FRA label now sits below its marker (repositioned from attempt 1) so it no longer collides with the LHR label above.
      Legibility verdict: PASS - all title, subtitle, axis, and tick text is clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Same title/subtitle layout, now rendered in light ink (#F0EFE8) and soft gray subtext, both clearly visible against the dark background. Axis labels and tick labels are light gray and legible. Gridlines are subtle and visible without competing with the data.
      Basemap: Continent silhouettes render as a slightly darker gray-on-black fill with a soft stroke, still clearly legible as landmasses without overpowering the route data.
      Data: Data colors are identical to the light render - same brand-green (#009E73) nodes and arcs, same width/opacity/size encoding, same arrow markers. Confirms the Imprint rule that only chrome flips between themes, not data color.
      Legibility verdict: PASS - no dark-on-dark failures; all text (title, subtitle, axis names, tick labels, airport code labels) is clearly visible against the near-black background.
