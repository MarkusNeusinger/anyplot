review:
  strengths:
  - Great-circle arcs computed by spherical interpolation every 2° of arc and split
    at the antimeridian, so long routes (LAX–LHR, JFK–GRU, HND–SYD) curve as geodesics
    rather than straight segments
  - ECharts geo coordinate system with a custom Natural Earth projection object passed
    to geo.projection and a registered map of outline, graticule and land, giving
    a quiet global base map in both themes
  - 'Two-level encoding: route width and opacity follow annual passengers, hub marker
    area follows total hub traffic, so DXB, LHR and SIN read as the focal hubs'
  - Label side chosen per airport away from its steepest route, plus labelLayout moveOverlap,
    keeps every airport code clear of lines and markers
  - 'Theme tokens threaded through title, subtitle, labels, land tint (echarts.color.lerp
    of page and ink) and grid tone; data color identical #009E73 in both renders'
  - Native tooltip formatter gives route and hub passenger figures in the HTML view
  weaknesses:
  - 'CQ-01 (code): a `northward` bearing helper function plus a label-side pass that
    adds and then deletes `north`/`south` properties on every hub (lines 205–234)
    adds structure beyond the flat script → derive the label position inline in the
    hub loop without the temporary fields, or drop the pass and rely on `labelLayout`.
    Likely cause: the label-placement heuristic written as a separate helper and post-pass.'
  - 'Suggestion: a small key for line width (two or three reference widths with passenger
    values) would make the encoding readable without the subtitle.'
  - 'Suggestion: the heaviest routes reach opacity 0.7; capping at about 0.6 would
    keep the busiest corridor (JFK–LHR) building up through overlap as the Notes describe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "Global Flight Routes · map-connection-lines · javascript · echarts · anyplot.ai" centered in dark ink, grey subtitle explaining that line width/opacity scale with annual passengers and marker size with hub traffic; Natural Earth projected world map (60°S–84°N) with a grey outline, a 30° graticule in the grid tone and land in a light grey tint with thin coastline borders. Airport codes (LAX, JFK, GRU, LHR, FRA, JNB, DXB, DEL, SIN, HKG, HND, SYD) in dark ink, all readable.
      Data: 18 great-circle arcs in #009E73 with translucent varying widths (JFK–LHR, DXB–SIN, SIN–HKG thickest), 12 green hub markers with page-colored outline sized by traffic (DXB, LHR, SIN largest). LHR and FRA markers touch but both stay distinguishable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title in light ink, subtitle in soft light grey, land in a dark grey tint, graticule and outline subtle grey lines; airport codes in light ink, all readable — no dark-on-dark text.
      Data: same #009E73 arcs and markers as the light render; markers outlined in the dark page color. Only chrome flips.
      Legibility verdict: PASS
