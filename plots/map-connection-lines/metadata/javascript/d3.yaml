review:
  strengths:
  - 'Map-interior theme bug from Attempt 1 is fully fixed: the ocean/globe area now
    correctly shows the theme-adaptive page background in both renders, with continents
    lightly tinted via t.inkSoft at 0.3 opacity on top of it — the winding-rule fix
    (ring.reverse()) and the t.muted -> t.inkSoft token correction both verified visually.'
  - 'Idiomatic, distinctive d3-geo usage: geoNaturalEarth1 + fitExtent for the projection,
    and d3.geoPath adaptively resampling simple 2-point LineStrings into genuine great-circle-curved
    routes — a technique unique to D3 among the catalog''s charting libraries.'
  - Dual encoding of passenger volume via arc color (imprint_seq green->blue) and
    arc stroke-width, plus hub markers sized by total connected traffic — clear data
    storytelling beyond the spec's minimum ask.
  - Arc opacity (0.3-0.6) and hub marker radius (5-12px) now match the spec's suggested
    ranges exactly, addressing the Attempt 1 feedback on overlap and opacity.
  - Fully deterministic, hardcoded flight-route dataset with realistic hub airports
    and plausible passenger volumes (260k-1200k), well within the spec's 10-100 connection
    guidance (22 routes, 16 hubs).
  - Real interactive hover tooltips on both arcs and hub markers for the HTML export,
    with no faked interactivity in the static PNG.
  - 'First categorical series is the correct brand green #009E73; continuous route-value
    encoding correctly uses imprint_seq (green -> blue), not a foreign colormap.'
  weaknesses:
  - Hub markers still overlap slightly in the dense Europe cluster (LHR/CDG/FRA) —
    the white stroke keeps them distinguishable, but a small additional offset or
    radius trim would clean this up further.
  - The abstract hand-drawn continent blobs (a reasonable workaround given D3's no-network/no-bundled-atlas
    constraint) provide geographic context but not accurate coastlines/borders as
    the spec's Notes section suggests — acceptable given the offline constraint, but
    a lower-fidelity approximation than a real topojson atlas would give.
  - The optional `label` field from the spec (route name/identifier) is unused; not
    required, but tooltips could surface it for richer hover context.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — correct, not pure white, not dark.
      Chrome: Title "map-connection-lines · javascript · d3 · anyplot.ai" and subtitle "International flight routes between major hub airports" render in dark ink and soft ink respectively, both clearly legible against the cream background. Right-side legend ("Passenger volume (000s/yr)" title, gradient bar, tick labels 400-1200, "Hub, sized by total traffic" note) is fully legible, positioned well inside the canvas with no clipping at the right edge. The Attempt-1 bug is fixed: the map interior (inside the Natural-Earth Sphere outline) now correctly shows the light page background instead of a near-solid dark fill; the abstract continent blobs read as a soft warm gray, clearly distinguishable from the ocean/background.
      Data: Hub markers are brand green (#009E73) with cream strokes, sized by total connected traffic. Connection arcs use a green-to-blue sequential gradient (imprint_seq) with width and opacity scaled by passenger volume, alpha in the 0.3-0.6 range as the spec recommends — overlapping low-value routes stay unobtrusive while high-value routes (e.g. JFK-LHR) stand out as a thick blue arc.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — correct, not pure black, not light.
      Chrome: Title and subtitle render in light ink / soft ink, clearly legible with no dark-on-dark issues. Legend text (title, tick labels, hub-size note) is light-colored and fully legible against the dark background. Map interior correctly resolves to the dark page background (verified distinct from the light render's fill, confirming true theme-adaptation rather than a fill that merely "looks OK because everything is dark"); continent blobs are visible as a subtly lighter gray tint.
      Data: Hub marker color, arc color/width/opacity scale, and legend gradient are pixel-identical to the light render — only chrome (background, text, grid, continents) flipped, as required.
      Legibility verdict: PASS.
