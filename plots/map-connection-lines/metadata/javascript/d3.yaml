review:
  strengths:
  - 'Correct, idiomatic d3-geo implementation: geoNaturalEarth1 + fitExtent, and d3.geoPath
    adaptively resampling simple 2-point LineStrings into genuine great-circle-curved
    routes — solid distinctive D3 usage.'
  - Dual encoding of passenger volume via arc color (imprint_seq green->blue) and
    arc stroke-width, plus hub markers sized by total connected traffic (nodeTotals)
    — clear data storytelling beyond the spec's minimum ask.
  - Fully deterministic, hardcoded flight-route dataset with realistic hub airports
    and plausible passenger volumes (260k-1200k), well within the spec's 10-100 connection
    guidance (22 routes, 16 hubs).
  - Real interactive hover tooltips on both arcs and hub markers for the HTML export,
    with no faked interactivity in the static PNG.
  - 'Title, legend, and chrome outside the map correctly theme-adapt between light
    and dark; first categorical series is the correct brand green #009E73.'
  weaknesses:
  - 'Critical - map interior does not theme-adapt: the ocean/globe area renders as
    a near-solid dark fill in BOTH themes (light render measured ~RGB(40,40,39) inside
    the sphere vs. the correct page background ~RGB(250,248,241) just outside it;
    dark render measured ~RGB(3,3,2)). The Sphere path is coded fill:''none'' and
    continents use t.muted at 0.3 opacity, so this dark base is unintended. Inspect
    the rendered DOM/computed styles for the sphere and graticule elements and confirm
    no unintended fill/opacity stacking is happening; the ocean region should show
    the actual t.pageBg in both themes, with continents only marginally distinguishable
    via t.muted on top of that.'
  - Hub markers overlap noticeably in the dense Europe cluster (LHR/CDG/FRA) - consider
    slightly tightening the nodeRadius range or nudging overlapping markers apart.
  - Arc opacity range (0.4-0.7) sits slightly above the spec's suggested 0.3-0.6 -
    minor, but trimming the low end would help low-value routes stay unobtrusive in
    the busy Europe/Middle-East cluster.
  - The abstract hand-drawn continent blobs (a reasonable workaround given D3's no-network/no-bundled-atlas
    constraint) currently provide little geographic legibility because of the fill
    bug above - once the background is fixed, re-check that the blobs read clearly
    as landmasses against the correct ocean color.
  image_description: |-
    Light render (plot-light.png):
      Background: Outer canvas background is correctly warm off-white (measured ~RGB(250,248,241), matches #FAF8F1).
      Chrome: Title "map-connection-lines · javascript · d3 · anyplot.ai" and subtitle "International flight routes between major hub airports" render in dark/soft ink and are clearly legible. Legend ("Passenger volume (000s/yr)", gradient bar, tick labels 400-1200, hub-size note) sits on the correct cream background and is fully legible.
      Data: First/hub markers use brand green #009E73 with cream strokes. Arcs use imprint_seq (green->blue) color scale plus value-scaled stroke-width, all clearly visible.
      Defect: The world-map interior (inside the Natural-Earth "Sphere" outline) renders as a near-solid dark fill instead of the page background - measured ~RGB(40,40,39) inside the globe vs. ~RGB(250,248,241) just outside it. Continent blobs are only marginally lighter (~58,58,56), so ocean and land are barely distinguishable, and the map area looks like an incongruous dark disc on the cream canvas. This is a chrome/background theme-adaptation bug, not a text-legibility issue.
      Legibility verdict: PASS for all text; FAIL for map-interior theme-chrome (VQ-07).

    Dark render (plot-dark.png):
      Background: Outer canvas background is correctly warm near-black (measured ~RGB(26,26,23), matches #1A1A17).
      Chrome: Title/subtitle legible in light ink, no dark-on-dark issues. Legend fully legible.
      Data: Hub marker color and arc color/width scale are identical to the light render, as required.
      Defect: Map interior also renders near-solid black (~RGB(3,3,2)) - the same underlying bug as the light render, but here it coincidentally looks acceptable because the whole page is already dark, masking the defect. Continents are similarly hard to distinguish from ocean.
      Legibility verdict: PASS for all text; the map-interior fill issue is present but visually less obvious in this theme.
