review:
  strengths:
  - Great-circle arcs computed with SLERP and split with NaN at the antimeridian,
    so LA–Tokyo wraps correctly
  - Volume double-encoded by line width and the imprint_seq marks ramp with per-theme
    stops, keyed by a colorbar with units
  - Theme-adaptive land fill, coastline and graticule sit quietly beneath the routes
    in both renders
  weaknesses:
  - 'VQ-02 (both): the ''Paris'' label is drawn at (6.4°E, 52.4°N), right beside the
    Frankfurt marker and across the London–Dubai/London–Singapore arcs, so Paris''s
    own marker reads unlabeled and Frankfurt''s label sits farther from it → place
    each Western-Europe label unambiguously next to its own marker, clear of the arcs.
    Likely cause: label_offsets for Paris (4.0, 3.5) and Frankfurt (4.0, -5.5).'
  - 'VQ-03 (dark): the lowest-volume arcs (Singapore–Sydney, LA–Tokyo across the antimeridian)
    are 1 px lines of #007755 at alpha 0.6 and nearly vanish on #1A1A17 → a thicker
    minimum line width (about 1.8–2 px, +0.8 px). Likely cause: linewidth = 1.0 +
    3.5 * nv.'
  - 'SC-02 (both): the base map is a set of hand-sketched continent polygons with
    no country borders; Europe and Asia meet at a visible vertical seam at 30°E and
    coastlines are off by several degrees (Japan, Arabia, Scandinavia) → real coastline/country
    geometry (e.g. Natural Earth via GeoMakie/NaturalEarth) drawn quieter than the
    lines. Likely cause: _CONTINENTS_RAW.'
  - 'DQ-02 (both): real airport pairs carry invented passenger counts (London–New
    York 12.5 M/yr, several times the real figure) → counts plausible for those routes,
    or route labels that are not real city pairs. Likely cause: the connections table.'
  - 'Suggestion: a Natural Earth or Robinson projection (GeoMakie GeoAxis) would follow
    the Notes'' projection hint more closely than plain lon/lat axes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'Global Air Routes · map-connection-lines · julia · makie · anyplot.ai' bold dark ink, ~70% width; Longitude/Latitude axis titles and 14 px ticks in dark/soft ink; colorbar 'Passengers (M / year)' 4–12 at right. All readable.
      Data: 15 great-circle arcs from #009E73 (low) through #4467A3 to navy #002850 (high) at alpha 0.6, width 1–4.5 px; London–New York–LA trunk dominant; 10 green airport markers with dark outline, labels in soft ink; beige continent polygons with tan outline and faint 30° graticule. Paris label sits beside the Frankfurt marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and colorbar text in light ink; no dark-on-dark text.
      Data: same geometry; the ramp uses the dark marks stops #007755→#009E73→#CDD9FF so the high-volume London–New York arc is pale blue and stands out; markers keep #009E73 fill with light outline; low-volume 1 px arcs (Singapore–Sydney) are faint. Land in dark grey polygons.
      Legibility verdict: PASS
