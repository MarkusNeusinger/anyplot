review:
  strengths:
  - Great-circle arcs computed with SLERP and split with NaN at the antimeridian,
    so the LA–Tokyo route wraps correctly
  - Volume double-encoded by line width and the imprint_seq marks ramp with per-theme
    stops, keyed by a colorbar with units
  - Theme-adaptive land fill, coastline and graticule sit quietly beneath the routes
    in both renders
  - Every city label sits next to its own marker, and the passenger volumes are plausible
    for the real routes
  weaknesses:
  - 'VQ-02 (both): the London–Hong Kong arc runs through the top of the ''Frankfurt''
    label at about 10°E, 53°N → place the label where no arc crosses it, for example
    below-right of the Frankfurt marker. Likely cause: label_offsets for Frankfurt
    (7.0, 4.0).'
  - 'SC-02 (both): the base map is hand-sketched continent polygons with no country
    borders; the Mediterranean and Black Sea are filled as land and Japan and Arabia
    sit several degrees off their real coastlines → coastline polygons that follow
    the real shorelines, quieter than the lines. Likely cause: _CONTINENTS_RAW.'
  - 'Suggestion: a Robinson or Natural Earth-style projection would follow the Notes''
    projection hint more closely than plain lon/lat axes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold title 'Global Air Routes · map-connection-lines · julia · makie · anyplot.ai' in dark ink at about 70 % width; Longitude / Latitude axis titles and 14 pt ticks in dark / soft ink; colorbar 'Passengers (M / year)' 0.9–3.4 at right. All readable.
      Data: 15 great-circle arcs at alpha 0.6, width 2–5 px, colored from #009E73 (low) through #4467A3 to navy (high); London–New York–Los Angeles trunk is thickest and darkest; 10 #009E73 airport markers with dark outlines; city labels in soft ink each beside its own marker (Paris below-left, Frankfurt above-right, London above-left); the London–Hong Kong arc crosses the top of the 'Frankfurt' label. Beige hand-sketched continent polygons with a thin tan coastline, no seam at 30°E, and a faint 30° graticule.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks, city labels and colorbar text in light ink; no dark-on-dark text.
      Data: same geometry; marker fill #009E73 identical to light with a light outline; the ramp uses the dark marks stops #007755→#009E73→#CDD9FF, so the high-volume London–New York arc is pale blue; the 2 px low-volume arcs (Singapore–Sydney, LA–Tokyo wrap) stay visible. Land in dark grey polygons.
      Legibility verdict: PASS
