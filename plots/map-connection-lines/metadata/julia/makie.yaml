review:
  strengths:
  - Great-circle arcs computed with SLERP between the true coordinates and split with
    NaN at the antimeridian, so the LA–Tokyo route wraps correctly at ±180°
  - Passenger volume double-encoded by line width and the imprint_seq marks ramp with
    the current per-theme stops, keyed by a colorbar with units
  - Hand-digitised coastlines now follow the real shores, with the Mediterranean,
    Black Sea and Caspian cut out and Britain, Ireland, Japan and Indonesia drawn
    as islands, in a theme-tuned fill quieter than the routes
  - Every city label sits beside its own marker and the Frankfurt label is now clear
    of the European arcs
  - Real airport pairs with plausible two-way passenger volumes (London–New York 3.4
    M/yr)
  weaknesses:
  - 'VQ-02 (both): the ''Singapore'' label at about 109°E, 4°S sits on the Singapore–Sydney
    arc, so the arc runs under the letters → place the label where no arc passes,
    for example left of the Singapore marker. Likely cause: label_offsets for Singapore
    (5.0, -5.5).'
  - 'VQ-03 (dark): the lowest-volume arcs (LA–Tokyo, London–Hong Kong, Dubai–Hong
    Kong) in the olive low end at alpha 0.6 over a land fill about 1.6:1 from the
    page read dim → opaque low end with the opacity falling to 0.6 only at the high
    end, and a dark land fill within about 1.25:1 of the page, as the style guide''s
    map rule asks. Likely cause: the constant 0.60f0 alpha in arc_color and LAND_FILL
    RGBAf(0.24, 0.24, 0.22).'
  - 'Suggestion: a Robinson-style projection would follow the Notes'' projection hint
    more closely than plain lon/lat axes.'
  - 'Suggestion: the unused INK_MUTED constant could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold title 'Global Air Routes · map-connection-lines · julia · makie · anyplot.ai' in dark ink at about 70 % width; Longitude / Latitude axis titles and 14 pt ticks in dark / soft ink; colorbar 'Passengers (M / year)' 1.0–3.0 ticks at right. All readable.
      Data: 15 great-circle arcs at alpha 0.6, width 2–5 px, colored by the imprint_seq marks ramp #009E73 → #024582 → #351E45; the London–New York trunk is thickest and darkest (violet-grey), LA–New York and Hong Kong–Tokyo blue; 10 #009E73 airport markers with dark outlines; city labels in soft ink beside their markers (Frankfurt now below-right, clear of the arcs); the Singapore–Sydney arc runs under the 'Singapore' label. Beige land with real coastlines (Mediterranean, Black Sea, Caspian, Hudson Bay, Britain, Ireland, Japan, Indonesia, New Zealand), thin tan coastline and a faint 30° graticule.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks, city labels and colorbar text in light ink; no dark-on-dark text.
      Data: same geometry; marker fill #009E73 identical to light with a light outline; the ramp uses the dark marks stops #6F7E20 → #009E73 → #CDD9FF, so the London–New York trunk is pale blue and the low-volume arcs olive; those olive arcs read dim over the dark-grey land fill. Land in dark grey polygons with a grey coastline.
      Legibility verdict: PASS
