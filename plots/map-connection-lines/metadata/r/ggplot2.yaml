review:
  strengths:
  - Natural Earth projection applied to base map, graticule, arcs and markers, with
    the map outline drawn on an elevated surface
  - Great-circle arcs by spherical interpolation, split cleanly at the antimeridian
    (cumsum on longitude jumps) so trans-Pacific routes wrap without artifacts
  - Passenger volume dual-encoded in imprint_seq marks color (per-theme stops) and
    line width, keyed by a compact colorbar
  - Theme tokens threaded through every chrome element; city labels in INK read well
    in both themes
  weaknesses:
  - 'VQ-02 (both): the ''London'' label''s right edge ends on the London marker and
    the ''Tokyo'' label starts on the Tokyo marker''s ring → keep about 2 px clearance
    from the marker (hjust 1.15 → about 1.3 for London, -0.15 → about -0.3 for Tokyo).
    Likely cause: per-airport hjust values too close to the marker radius at size
    2.8.'
  - 'CQ-01 (code): two top-level helper functions natural_earth() and great_circle_arc()
    → inline the formulas into the arc and map pipelines (vectorised over the route
    rows). Likely cause: helper-function structure instead of a flat script.'
  - 'Suggestion: a direct label or emphasis on the busiest corridor (Los Angeles-Tokyo,
    5.1 M) would give the map a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the Natural Earth map outline is filled with the elevated #FFFDF6 surface and framed by a thin INK_SOFT line.
      Chrome: title 'Global Flight Routes · map-connection-lines · r · ggplot2 · anyplot.ai' in dark ink, centered; no axes (map); colorbar 'Passengers (millions)' 1-5 on an elevated box; 12 city labels in dark ink, all readable.
      Data: 15 great-circle arcs in the imprint_seq marks ramp (green #009E73 for ~1 M to navy for ~5 M) with width scaling, alpha 0.6; trans-Pacific arcs split at the antimeridian; brand-green #009E73 airport markers with a page-colored ring; land in translucent grey, 30-degree graticule.
      Legibility verdict: PASS (London and Tokyo labels touch their markers)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page, map surface #242420 with a light outline.
      Chrome: title, city labels and legend text in light ink, all readable; no dark-on-dark.
      Data: same arcs and widths; the continuous ramp uses the dark stops (#007755 -> #009E73 -> #CDD9FF), so heavy routes read pale blue; markers keep #009E73 with a dark ring; land lighter grey on the dark surface.
      Legibility verdict: PASS
