review:
  strengths:
  - True great-circle arcs by spherical interpolation, split cleanly at the antimeridian
    (Los Angeles-Tokyo, Sydney-Los Angeles)
  - Natural Earth projection with a bounded graticule and an elevated globe surface;
    land kept quiet beneath the arcs
  - Passenger volume encoded in both color (imprint_seq marks stops per theme) and
    width, keyed by a colorbar
  - Endpoint markers ringed in the page color stay distinct from the arcs that meet
    there
  weaknesses:
  - 'VQ-03 (both): every arc is drawn at a flat alpha 0.6, so the thin low-value arcs
    (London-Sao Paulo 1.4 M, Cape Town-Dubai 1.1 M) fade into the land, most in the
    dark render where the olive low end mixes with the ground → opacity falling from
    1 at the low end to 0.6 at the high end, as the style guide''s Opacity rule asks
    for ramp-colored lines. Likely cause: geom_path(alpha = 0.6) constant instead
    of mapping alpha to passengers_m (scale_alpha_continuous(range = c(1, 0.6))).'
  - 'Suggestion: a direct label or emphasis on the busiest corridor (Los Angeles-Tokyo,
    5.1 M) would give the map a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the Natural Earth globe sits on a slightly lighter elevated surface with a thin dark outline.
      Chrome: title "Global Flight Routes · map-connection-lines · r · ggplot2 · anyplot.ai" in dark ink, centred, about 65 % of the width; city labels in dark ink; colorbar "Passengers (millions)" with ticks 2-5 at right. All readable.
      Data: 15 great-circle arcs from brand green #009E73 (low) through deep blue to dark violet (high), width growing with value, alpha 0.6; 12 airport markers in #009E73 with a page-colored ring; light grey land and a faint 30-degree graticule. Los Angeles-Tokyo and Sydney-Los Angeles split at the antimeridian. The New York label sits above-left of its marker, clear of the arc.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; globe on a #242420 surface with a light outline.
      Chrome: title, city labels and legend title in light ink, ticks in soft light ink; no dark-on-dark text.
      Data: same arcs with the dark marks stops (olive #6F7E20 -> #009E73 -> pale blue #CDD9FF for high values); the low-value olive arcs (London-Sao Paulo, Cape Town-Dubai) read dim at alpha 0.6; markers #009E73, identical to light, ringed in the dark page color; land in muted grey.
      Legibility verdict: PASS
