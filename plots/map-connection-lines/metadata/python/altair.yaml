review:
  strengths:
  - 'Mathematically correct SLERP great-circle arcs: every route follows its geodesic
    from origin to destination'
  - Value encoded twice (color and stroke width) so heavy corridors like JFK–LHR and
    LHR–DXB stand out
  - Complete theme adaptation of land fill, borders, hub labels, legend surface and
    title
  - 'Altair-native geo stack: topo_feature base map, naturalEarth1 projection and
    detail+order path encoding in one layered chart, with route and airport tooltips
    in the HTML'
  weaknesses:
  - 'VQ-02 (both): the legend title ''Passengers (k/yr)'' is wider than the legend
    box and runs into its left and right border → fit inside with ~8 px padding. Likely
    cause: no legend padding / title wider than symbol column.'
  - 'VQ-05 (both): the 620×320 view padded to 3200×1800 leaves an empty band of ~200
    px above the title and wide side margins; the map uses about 70% of the width
    → size the whole chart with autosize fit at 800×450. Likely cause: .properties(width=620,
    height=320) without autosize type="fit".'
  - 'VQ-07 (both): the volume ramp is a two-stop #009E73→#4467A3 scale, identical
    in both themes, not imprint_seq''s marks stops → light (0 #009E73, 0.338 #4467A3,
    1 #002850), dark (0 #007755, 0.32 #009E73, 1 #CDD9FF). Likely cause: alt.Scale(range=["#009E73",
    "#4467A3"]) without per-theme stops (use domain/range stops at the ramp positions
    over the volume extent).'
  - 'VQ-03 (both): the color legend draws hollow rings while the encoded marks are
    lines; the 1,000 ring nearly vanishes on the dark legend surface → line-sample
    glyphs matching the arcs. Likely cause: symbolType="stroke" not producing a line
    glyph here; set symbolType to a horizontal path such as "M-1,0L1,0".'
  - 'Suggestion: hub labels at 9 px could go to 11–12 px for more presence beside
    the markers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, land #DDD9CC with hairline ink borders.
      Chrome: bold dark title placed low with a wide empty band above; legend 'Passengers (k/yr)' top-right whose title runs into the box border; 9 px bold hub labels LHR, NRT, DXB. All readable.
      Data: 25 great-circle arcs green→blue by volume, width 0.3–2.5 px, opacity 0.5 so corridors build up; 12 brand-green #009E73 airport circles sized by connectivity; map uses about 70% of the canvas width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, land #2A2A26 with light borders.
