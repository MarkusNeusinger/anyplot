review:
  strengths:
  - Great-circle arcs computed with slerp at 50 points per route and split at the
    antimeridian, so transpacific routes leave one edge and continue on the other
  - Passenger volume double-encoded as color and line width via scale_color_gradientn
    with stop positions and scale_size_continuous
  - Theme-adaptive land fill and border tokens keep the base map quieter than the
    routes in both themes
  - Real airports with correct coordinates and plausible route volumes
  - North America outline now covers the continent's interior, so the JFK and ORD
    markers sit on land
  weaknesses:
  - 'VQ-07 (both): the route lines use SEQ_MARKS stops the style guide no longer lists
    (light #009E73 → #4467A3 at 0.338 → #002850; dark #007755 → #009E73 at 0.32 →
    #CDD9FF) → the current imprint_seq marks stops: light (0, #009E73), (0.687, #024582),
    (1, #351E45); dark (0, #6F7E20), (0.21, #009E73), (1, #CDD9FF). Likely cause:
    the SEQ_MARKS token block.'
  - 'VQ-04 (dark): the low-volume routes (GRU-MIA, JNB-LHR, MIA-GRU) in the dark low
    stop at alpha 0.55 read faint against the #1A1A17 page and the #282824 land, and
    no route matches the opaque colorbar → opacity falling from 1 at the low end to
    about 0.55 at the high end (style guide, Continuous Data → Opacity). Likely cause:
    the constant alpha=0.55 in geom_path.'
  - 'Suggestion: a Robinson-like pseudo-projection of the coordinates would follow
    the spec''s projection hint more closely than the equirectangular view.'
  - 'Suggestion: the Europe and Asia polygons overlap, leaving a visible seam across
    eastern Europe; one Eurasia outline would read cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title 'Global Flight Routes · map-connection-lines · python · plotnine · anyplot.ai' at about 80% width; Longitude (°) / Latitude (°) axis titles and ticks in dark ink; faint major grid; colorbar 'Passengers (thousands/yr)' 1500-4000 on an elevated panel. All readable.
      Data: 25 great-circle arcs, width 0.8-2.2, alpha 0.55, on a green → blue → navy ramp (JFK-LHR darkest navy); transpacific routes split at the antimeridian; 15 #009E73 airport markers with a dark outline over coarse gray continent polygons. North America now covers the interior, with a Hudson Bay notch, Florida and the Gulf coast, and JFK and ORD sit on land.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and colorbar text in light ink; no dark-on-dark text.
      Data: same arcs on a dark green → green → pale blue ramp, busiest corridors (JFK-LHR, LHR-DXB, LAX-HND) bright pale blue, low routes dark green and faint at alpha 0.55; markers #009E73 (identical to light) with a light gray outline; land #282824.
      Legibility verdict: PASS
