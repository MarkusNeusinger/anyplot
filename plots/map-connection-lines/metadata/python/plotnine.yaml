review:
  strengths:
  - Great-circle arcs computed with slerp at 50 points per route, split at the antimeridian
    so every transpacific route ends at the map edge and continues on the other side
  - Passenger volume double-encoded as color and line width, explained by a titled
    colorbar
  - Theme-adaptive land fill and border tokens keep the base map quieter than the
    routes in both themes
  - Real airports and plausible route volumes with correct coordinates
  weaknesses:
  - 'VQ-07 (both): line colors use the legacy two-stop ramp #009E73 → #4467A3, the
    same in both themes → the theme''s SEQ_MARKS stops (light #009E73/#4467A3/#002850
    at 0/0.338/1, dark #007755/#009E73/#CDD9FF at 0/0.32/1) via scale_color_gradientn(colors=...,
    values=...). Likely cause: scale_color_gradient(low="#009E73", high="#4467A3").'
  - 'Suggestion: the hand-drawn continent outlines are very coarse (Europe and Asia
    overlap, Africa is a rough wedge); a more detailed outline set would give stronger
    geographic context.'
  - 'Suggestion: a Robinson-like pseudo-projection of the coordinates would follow
    the spec''s projection hint more closely than the equirectangular view.'
