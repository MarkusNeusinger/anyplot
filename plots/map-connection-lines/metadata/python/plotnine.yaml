review:
  strengths:
  - Great-circle arcs computed with slerp at 50 points per route and split at the
    antimeridian, so transpacific routes leave one edge and continue on the other
  - Passenger volume double-encoded as color and line width, with the theme's SEQ_MARKS
    stops passed to scale_color_gradientn so high-volume routes read navy on light
    and pale blue on dark
  - Theme-adaptive land fill and border tokens keep the base map quieter than the
    routes in both themes
  - Real airports with correct coordinates and plausible route volumes
  weaknesses:
  - 'SC-02 (both): the base map (C5) misdraws North America: the hand-drawn polygon
    runs from Alaska down the west coast and back along the Gulf, so the continental
    US interior is bare page and the ORD and JFK markers sit off land → an outline
    that covers the continent''s interior with the east coast near -75..-80° lon,
    25..45° lat. Likely cause: the N. America vertex list (the -125/48 → -117/33 and
    -125/50 vertices make the ring self-intersect).'
  - 'Suggestion: a Robinson-like pseudo-projection of the coordinates would follow
    the spec''s projection hint more closely than the equirectangular view.'
  - 'Suggestion: the Europe and Asia polygons overlap, leaving a visible seam across
    eastern Europe; one Eurasia outline would read cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title 'Global Flight Routes · map-connection-lines · python · plotnine · anyplot.ai' at about 80% width; axis titles Longitude (°) / Latitude (°) and tick labels in dark ink; faint major grid; colorbar 'Passengers (thousands/yr)' 1500-4000 on an elevated panel. All readable.
      Data: 25 great-circle arcs, width 0.8-2.2, alpha 0.55, colored on the light marks ramp #009E73 → #4467A3 → #002850 (JFK-LHR darkest navy); transpacific routes split at the antimeridian; 15 #009E73 airport markers with a dark outline over coarse gray continent polygons (North America drawn as a thin west-coast/Gulf ring, US interior empty).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and colorbar text in light ink; no dark-on-dark text.
      Data: same arcs on the dark marks ramp #007755 → #009E73 → #CDD9FF, so the low routes are dark green and the busiest corridors (JFK-LHR, LHR-DXB, LAX-HND) bright pale blue; markers #009E73 (identical to light) with a light gray outline; land in #282824.
      Legibility verdict: PASS
