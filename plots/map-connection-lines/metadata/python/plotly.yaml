review:
  strengths:
  - Passenger volume encoded redundantly in line width, color and opacity, so the
    JFK-LHR corridor leads
  - go.Scattergeo lines render as true great-circle arcs, including antimeridian-crossing
    routes
  - Full Natural Earth globe with theme-adaptive land, ocean, coastline and country
    colors kept quieter than the routes
  - Ochre airport markers with an ink outline stand apart from the routes
  - Rich hover text in the HTML output
  weaknesses:
  - 'VQ-02 (both): the LHR, CDG and FRA markers (size 12 with a 2 px outline) overlap
    each other and partly hide one another at the European hub → smaller markers (about
    9, −3) so each endpoint stays distinct. Likely cause: marker size=12.'
  - 'VQ-07 (dark): the routes use the same two-stop #009E73 → #4467A3 ramp as the
    light render instead of the dark theme''s imprint_seq marks stops (#007755 → #009E73
    → #CDD9FF) → take SEQ_MARKS per theme. Likely cause: the hard-coded RGB endpoints
    in the route loop.'
  - 'CQ-04 (code): the per-channel RGB interpolation is written out twice (route loop
    and legend loop) → plotly.colors.sample_colorscale(SEQ_MARKS, t) in both places.
    Likely cause: hand-rolled rc/gc/bc arithmetic.'
  - 'Suggestion: raise the opacity floor of the low-volume routes on the dark page
    so the thin green arcs read against the navy ocean.'
  - 'Suggestion: wider side margins would give the globe outline more breathing room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; full rounded Natural Earth globe with pale blue ocean, light warm-grey land and Antarctica at the bottom.
      Chrome: centered title "Global Flight Routes · map-connection-lines · python · plotly · anyplot.ai" in dark ink; airport codes in dark ink; legend bottom-left on an elevated warm-white box with Low/Medium/High line samples and an Airports dot. All readable.
      Data: 15 great-circle routes from brand green #009E73 (low) to blue #4467A3 (high), 2-9 px wide, opacity 0.45-0.80; JFK-LHR thickest; LAX-NRT and SYD routes wrap at the globe edge. Ochre #BD8233 airport markers with ink outline; LHR/CDG/FRA markers overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; navy ocean and dark charcoal land on the same full globe.
      Chrome: title and airport codes in light cream ink, legend on #242420 with soft light text; no dark-on-dark text.
      Data: same route colors as light (the dark theme's marks stops are not used); low-volume routes at 0.45 opacity are dim but visible against the navy ocean; ochre markers with light outline.
      Legibility verdict: PASS
