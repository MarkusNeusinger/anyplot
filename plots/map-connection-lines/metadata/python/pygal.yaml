review:
  strengths:
  - Separate route arcs and coastline polylines are broken apart with allow_interruptions=True
    and (0, None) gaps, so each connection is one isolated curve
  - Airport markers use the INK token and flip from black to white dots, distinct
    from the lines in both themes
  - Translucent strokes (opacity 0.55-0.65) let overlapping corridors around London
    and Singapore build up visibly
  - Native pygal HTML output carries per-point tooltips naming each route and its
    passenger volume
  - 'Chrome and backgrounds are fully theme-correct: #FAF8F1 / #1A1A17 pages, readable
    cream text on dark'
  weaknesses:
  - 'SC-03 (both): the five trans-Pacific routes (LAX-HND, LAX-SYD, PEK-LAX, HND-LAX,
    SYD-LAX) run about 250° of longitude east across the Atlantic and Africa instead
    of about 110° across the Pacific → draw them across the antimeridian, splitting
    each arc where it crosses ±180°. Likely cause: the Bezier control point flip changes
    only the bulge direction, not the longitude path.'
  - 'SC-02 (both): the volume tiers are drawn with stroke widths 3/5/8 but every route
    renders at about the same 2-3 px, so thickness does not follow the value (C2)
    → make the widths visibly differ (about 2/5/10 px at this canvas). Likely cause:
    the per-series stroke_style width is not taking effect over the style''s stroke_width=2.5.'
  - 'VQ-03 (dark): the >3M tier, the busiest routes, is drawn in #4467A3 at opacity
    0.65, the lowest-contrast line on the #0C1822 ocean, and all routes are thin for
    a 3200 px canvas → thicker strokes with the busiest tier the most prominent. Likely
    cause: stroke widths not applied and the tier-to-color order.'
  - 'VQ-07 (both): three ordered volume tiers (<2M, 2-3M, >3M) are colored with categorical
    Imprint hues green/lavender/blue → ordered steps of one Imprint ramp, light to
    dark with volume. Likely cause: the colors tuple in Style.'
  - 'VQ-01 (both): the y ticks 50, 0 and -50 render at about 44 px while the other
    y ticks render at about 56 px, so the axis mixes two sizes → one size for all
    ticks (+12 px on the major ticks, or set both sizes equal). Likely cause: major_label_font_size=44
    vs label_font_size=56.'
  - 'CQ-01 (code): build_bezier_curves() is a helper function in a script that should
    be flat Imports→Data→Plot→Save → inline the curve loop over the three tiers. Likely
    cause: the function wrapper at lines 188-214.'
  - 'DQ-01 (both): the hand-drawn coastline set leaves out northern Eurasia, Southeast
    Asia and most of Canada, so the base map reads as disconnected fragments → a fuller
    coastline outline. Likely cause: the coastlines list.'
  - 'Suggestion: a short city code beside each airport marker would make the static
    PNG readable without hover.'
  - 'Suggestion: a Robinson-like or equal-earth aspect would read more like a world
    map than the stretched equirectangular axes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page with a pale-blue ocean tint inside the plot area.
      Chrome: title 'map-connection-lines · python · pygal · anyplot.ai' top centre, 'Longitude (°)' and 'Latitude (°)' axis titles, ticks -160..160 and -60..80 in dark ink, dotted guides, a bottom legend with five entries; all readable. The y ticks 50/0/-50 are smaller than the rest.
      Data: 28 curved routes in three tiers, green #009E73 (<2M), lavender #C475FD (2-3M), blue #4467A3 (>3M), all about the same thin width; 14 black airport dots; grey hand-drawn coastline fragments. Each route is an isolated arc; the trans-Pacific routes from Los Angeles run east across the whole map.
      Legibility verdict: PASS

