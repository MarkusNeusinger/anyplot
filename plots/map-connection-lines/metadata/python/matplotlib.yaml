review:
  strengths:
  - Correct great-circle arcs from spherical interpolation, with date-line splitting
    so the Pacific routes wrap cleanly
  - Line width and alpha jointly follow passenger volume, explained by a three-tier
    legend whose glyphs match the routes
  - Theme-adapted ocean and land layers keep the base map quieter than the routes
    in both renders
  - Per-airport label offsets keep every airport name in clear space beside its marker
  - Real airports at accurate coordinates with a neutral, familiar aviation scenario
  weaknesses:
  - 'Suggestion: a rounded projection outline (or a Robinson-like projection) would
    read more like a world map than a lat/lon chart frame.'
  - 'Suggestion: the thinnest 1.5M routes at alpha 0.4 sit quietly on the dark ocean;
    a slightly higher floor alpha would let them carry more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map axes with a soft blue ocean and warm beige simplified continent polygons (Americas, Greenland, Eurasia, Africa, Britain, Japan, Indonesia, Australia, New Zealand).
