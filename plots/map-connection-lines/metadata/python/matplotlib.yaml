review:
  strengths:
  - Correct great-circle arcs from spherical interpolation, with date-line splitting
    so the Pacific routes wrap cleanly
  - Line width and alpha jointly follow passenger volume, explained by a three-tier
    legend
  - Theme-adapted ocean and land layers keep the base map quieter than the routes
    in both renders
  - Real airports at accurate coordinates with a neutral, familiar aviation scenario
  weaknesses:
  - 'VQ-02 (both): the Dubai–Singapore route runs through the bold ''Hong Kong'' label
    (placed lower-left of its marker, on the corridor) and the Singapore–Sydney route
    crosses the first letters of ''Singapore'' → labels clear of every route line.
    Likely cause: the per-airport (offset_x, offset_y) values for Hong Kong (-4, -8)
    and Singapore (4, -8) point the labels onto the routes.'
  - 'VQ-03 (both): the ''Major Airport'' legend glyph draws a white line segment through
    the marker, which the airport markers on the map do not have (most visible on
    the dark render) → a marker-only glyph. Likely cause: Line2D(..., color="w") without
    linestyle="none".'
  - 'Suggestion: a rounded projection outline (or dropping the lat/lon tick frame)
    would read more like a world map than a chart axis.'
  - 'Suggestion: the thinnest 1.5M routes at alpha 0.4 sit quietly on the dark ocean;
    a slightly higher floor alpha would let them carry more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map axes filled with a soft blue ocean and warm beige land polygons shaped like rough coastlines (Americas, Greenland, Eurasia, Africa, Britain, Japan, Indonesia, Australia, New Zealand).
      Chrome: title 'Major International Flight Routes · map-connection-lines · python · matplotlib · anyplot.ai' in dark ink at ~70% width; 'Longitude (°)' / 'Latitude (°)' axis titles and 8 pt ticks in dark/soft ink; bold dark airport labels; legend lower-left on #FFFDF6 with soft frame. All readable.
      Data: 15 great-circle routes in #009E73 with width and alpha by volume (NYC–London thickest), Pacific routes split at the date line; 10 airport markers in Imprint blue #4467A3 with page-colored edges. 'Hong Kong' label sits on the Dubai–Singapore corridor and the Singapore–Sydney line crosses 'Singapore'.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; dark teal ocean and dark warm-brown land, low contrast but visible and quieter than the routes.
      Chrome: title and axis titles in light ink, ticks and legend text in soft light ink, airport labels near-white bold; legend on #242420. No dark-on-dark text.
      Data: routes identical #009E73, markers identical #4467A3; thinnest routes faint but visible. The legend's airport glyph shows a white line segment through the marker.
      Legibility verdict: PASS
