review:
  strengths:
  - Antimeridian handling unwraps longitudes and splits the Pacific routes at ±180°,
    so the transpacific corridor reads as one continuous lane
  - Line width encodes annual cargo with a normalized 1.2–6.2 pt range and a key that
    names the min/mid/max values with units
  - Translucent arcs (alpha 0.55) build up into visibly busier corridors where Rotterdam
    and Shanghai routes overlap
  - 'Full theme adaptation: land fill, land edges, label ink and the callout box flip
    cleanly between light and dark'
  - Port markers via sns.scatterplot with a page-colored ring keep endpoints distinct
    from the lines meeting there
  weaknesses:
  - 'SC-04 (both): direct city labels sit nearer another port''s marker than their
    own — "New York" (offset -65, +8 pt) lands beside the Los Angeles dot, "Dubai"
    beside the Mumbai dot and "Mumbai" beside the Dubai dot, "Shanghai" under the
    Busan dot → each label adjacent to its own marker on the side away from its neighbour.
    Likely cause: the label_offsets dict (New York, Mumbai, Shanghai, Dubai entries).'
  - 'SC-02 (both): the arcs are quadratic Bézier curves with a fixed 13 % northward
    bow in lon/lat space, not great circles (C1) — Shanghai→Rotterdam peaks near 52°N
    where the great circle reaches 61.5°N, Busan→Rotterdam near 53°N vs 65°N, Shanghai→Los
    Angeles near 42°N vs 52°N (about −10° each) → sample the great-circle path (slerp
    between the two unit vectors) instead of the Bézier control point. Likely cause:
    curve_height = dist * 0.13 and the Bézier formula.'
  - 'VQ-03 (both): the cargo legend''s line samples are drawn at alpha 0.7 and widths
    1.5/3.5/6.0 while the routes use alpha 0.55 and widths 1.2/3.7/6.2 pt, so the
    key reads darker than the arcs it explains → the same alpha (0.55) and the widths
    the line_width formula gives for 3.5/8.3/13.2. Likely cause: hard-coded linewidth
    and alpha in legend_elements.'
  - 'Suggestion: the hand-drawn six-polygon continents are very coarse (no India,
    no Japan, Europe and Asia distorted); a Natural Earth coastline would read as
    a real base map.'
  - 'Suggestion: Mumbai has a port marker but no route, and the Singapore→Dubai arc
    runs straight through it, so it reads as connected; give it a route or drop the
    marker.'
  - 'Suggestion: the callout arrow tip ends on the "Busan" label; end it on the Pacific
    arc east of Japan, clear of the label.'
