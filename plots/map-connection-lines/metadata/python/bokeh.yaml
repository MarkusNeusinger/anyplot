review:
  strengths:
  - Line width and alpha both rise with passenger volume, so the busiest corridors
    read heaviest and darkest
  - Translucent arcs build visibly busier corridors where routes bundle at LHR, DXB
    and SIN
  - HoverTool on the arc renderer with line_policy='interp' shows route and traffic
    in the HTML
  - Theme tokens threaded through all chrome; both renders fully legible, data colors
    identical across themes
  - Quiet low-alpha base map stays beneath the lines
  weaknesses:
  - 'VQ-02 (both): the LHR code sits on top of the transatlantic arcs converging into
    LHR, so line strokes cross the letters → place the LHR label where no arcs enter
    (e.g. below-left of its dot). Likely cause: LABEL_OFFSETS[''LHR''] = (-65, 8).'
  - 'SC-03 (both): the trans-Pacific routes LAX-HND, SFO-SIN and LAX-SYD run eastward
    across the Atlantic, Europe and Africa, roughly twice their real length, because
    longitudes are interpolated without crossing the antimeridian → draw them across
    the Pacific (split at ±180° or shift the destination longitude by 360° and wrap).
    Likely cause: arc_lons = o_lon + (d_lon - o_lon) * t with no antimeridian handling.'
  - 'SC-02 (both): the arcs are symmetric parabolic offsets in lon/lat space, not
    great-circle arcs, so long routes such as JFK-LHR and SIN-SYD do not follow geodesic
    paths (C1) → compute the arc points by spherical interpolation between the endpoints.
    Likely cause: the perpendicular 4t(1-t) offset in the arc loop.'
  - 'CQ-04 (code): the width key is hand-built from three multi_line glyphs and four
    text glyphs at hard-coded data coordinates (lines 544-556) → bokeh''s Legend with
    LegendItem entries for three sample renderers. Likely cause: manual legend block.'
  - 'Suggestion: a global projection such as Robinson or Natural Earth instead of
    plain lon/lat would make the base map read as a world map (the Notes suggest it).'
  - 'Suggestion: a more detailed coastline base map (e.g. Natural Earth outlines)
    would replace the coarse hand-drawn continent polygons.'
  image_description: |-
