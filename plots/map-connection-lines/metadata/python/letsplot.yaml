review:
  strengths:
  - Passenger volume encoded twice, in line thickness and in the imprint_seq marks
    ramp with the theme's own stops, explained by one merged size-and-color legend
  - 'Airport markers in #009E73 with a page-colored ring stay distinct from the routes
    meeting at hubs in both themes'
  - geom_text_repel keeps the ten city labels apart on the crowded European and Gulf
    hubs
  - Real airports with correct coordinates and plausible annual passenger volumes;
    alpha 0.6 lets the London–Dubai–Singapore corridor build up visibly
  - Full theme adaptation through PAGE_BG/ELEVATED_BG/INK/INK_SOFT tokens; HTML export
    keeps lets-plot's native tooltips
  weaknesses:
  - 'VQ-01 (both): the ten city labels are drawn at geom_text_repel size 3 (about
    8.5 pt), below the 10 pt tick/legend-text reference, and read small beside the
    10 pt legend entries → size 3.5 (about 10 pt, +1.5 pt). Likely cause: geom_text_repel(size=3).'
  - 'VQ-05 (both): the typed ylim(-60, 85) leaves an empty band of about 10 % of the
    height between the title and the top of the map (lat 75–85) and another below
    South America → take the latitude limits from the base-map polygons with a small
    margin. Likely cause: ylim(-60, 85).'
  - 'SC-02 (both): routes are generic geom_curve bows (curvature=-0.3), not great-circle
    arcs, and LAX–Tokyo and LAX–Sydney run eastward across the Atlantic, Africa and
    Asia instead of across the Pacific; the base map is seven coarse polygons with
    Arabia and India missing and Dubai in the sea (C1, C5) → compute great-circle
    points per route (spherical interpolation in numpy) drawn with geom_path, split
    or recenter at the antimeridian so Pacific routes cross the Pacific, and use a
    more detailed coastline outline. Likely cause: geom_curve(curvature=-0.3) on a
    -180..180 equirectangular frame and the hand-typed world_coords.'
  - 'Suggestion: thinner INK_SOFT leader segments for the repelled city labels would
    quiet the heavy black strokes that cross several routes.'
  - 'Suggestion: a global projection such as Robinson (coord_map projection) would
    match the Notes'' recommendation for world maps.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800; continents as coarse light-grey (#E8E4DF) polygons with a thin grey outline.
      Chrome: title 'Global Flight Routes · map-connection-lines · python · letsplot · anyplot.ai' in dark ink at the top, about 65 % of the width; legend 'Passengers (millions)' at the right on an elevated panel, entries 1.5–4; small dark city labels with black repel leaders; bold callout 'Busiest route / JFK–LHR · 4.2M pax' above the North Atlantic. All readable; city labels small.
      Data: 16 curved routes from 0.5 to 6 px, colored along the imprint_seq marks ramp (#009E73 green for low volumes through #4467A3 to dark navy for the busiest JFK–LHR), alpha 0.6; ten #009E73 airport markers with a page-colored ring. LAX–Tokyo and LAX–Sydney arc eastward across the whole map.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; continents in dark grey #2D2D29.
      Chrome: title, legend title and city labels in light ink, legend entries in INK_SOFT on a #242420 panel, white leader lines; no dark-on-dark text.
      Data: the routes use the dark-theme marks stops (#007755 dark green for low volumes through #009E73 to pale lavender #CDD9FF for JFK–LHR); airport markers the same #009E73 as light, with a dark ring.
      Legibility verdict: PASS
