review:
  strengths:
  - Great-circle arcs computed by spherical interpolation and split at the antimeridian,
    so LAX-Tokyo and LAX-Sydney cross the Pacific
  - Natural Earth projection with densified coastline edges and inland seas in the
    page color gives a recognisable, quiet base map
  - Passenger volume encoded in both line width and the imprint_seq marks ramp with
    each theme's stops, explained by one merged size-and-color legend
  - Map extent derived from the land outlines fills the canvas; legend sits under
    the map on an elevated panel
  - geom_text_repel with a fixed seed keeps the ten city labels apart at the crowded
    London/Paris hub; HTML keeps lets-plot tooltips
  weaknesses:
  - 'Suggestion: thinner INK_SOFT leader segments for the repelled city labels would
    quiet the heavy black strokes crossing the routes.'
  - 'Suggestion: the busiest-route callout could sit closer to the JFK-LHR arc it
    names.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape; continents in Natural Earth projection as light grey #E8E4DF polygons with thin #C5C0BA outlines, Black and Caspian Seas cut out in the page color.
      Chrome: title 'Global Flight Routes · map-connection-lines · python · letsplot · anyplot.ai' centered in dark ink (~65 % width); legend 'Passengers (millions)' below the map on an elevated panel with six line samples 1.5-4; city labels in dark ink with black repel leaders; bold callout 'Busiest route / JFK-LHR · 4.2M pax' in the North Atlantic. All text readable.
      Data: 16 great-circle routes, width 0.5-6 px, color from #009E73 (low) through blue to dark aubergine (JFK-LHR), alpha 0.6; LAX-HND and LAX-SYD leave the left edge and re-enter at the right over the Pacific; ten #009E73 airport markers with a page-colored ring.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; continents #2D2D29 with #404040 outlines.
      Chrome: title, legend title, city labels and callout in light ink, legend entries in INK_SOFT on a #242420 panel, white leader lines; no dark-on-dark text.
      Data: routes use the dark marks stops (olive #6F7E20 for the lowest volumes through #009E73 to pale lavender #CDD9FF for JFK-LHR); airport markers the same #009E73 as light with a dark ring.
      Legibility verdict: PASS
