    descriptive prefix to close the gap.
  - 'Design Excellence remains close to well-configured default: no additional visual
    hierarchy beyond the region sort (e.g., emphasizing the leading product line,
    or a subtle background band per group) — a data-storytelling refinement that could
    be added.'
