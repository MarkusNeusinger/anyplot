review:
  strengths:
  - geom_linerange(aes(ymin = 0)) and geom_point share one position_dodge(width =
    0.6), so every stem ends exactly at its marker and groups are evenly offset
  - Regions sorted by total revenue computed from the data (South, West, North, East),
    meeting the spec's meaningful-order property
  - 'Theme tokens threaded through every chrome element; Imprint palette identical
    in both renders with #009E73 first'
  - Canonical 3200x1800 canvas with style-guide font sizes; clean y-only grid
  weaknesses:
  - 'DQ-02 (both): the three series are labelled ''Product A'', ''Product B'', ''Product
    C'', which reads as generic placeholder data → name real product lines (e.g. ''Laptops'',
    ''Tablets'', ''Accessories''). Likely cause: the PRODUCT values in the tibble.'
  - 'Suggestion: data in which one product overtakes another in some region would
    give the grouped comparison more to show.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: title 'lollipop-grouped · r · ggplot2 · anyplot.ai' top-left in dark ink; y-axis title 'Revenue ($ millions)', x-axis title 'Region', tick labels 0-3 and South/West/North/East in soft dark grey; subtle horizontal grid only; legend 'Product' on the right. All readable.
      Data: four region groups sorted by total (South, West, North, East), each with three thin stems from zero to circular markers: Product A #009E73 (green, first), Product B #C475FD (lavender), Product C #4467A3 (blue); same order in every group, wider gaps between groups than within.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick labels and legend text in light grey, grid lines light grey and subtle; no dark-on-dark text.
      Data: identical colors, positions and sizes to the light render; green, lavender and blue all stand out on the dark surface.
      Legibility verdict: PASS
