review:
  strengths:
  - Correct lollipop simulation via a bar-plus-plugin technique that follows the library-recommended
    workaround (afterDatasetsDraw circular markers on top of thin category-grouped
    bars), giving genuine side-by-side grouped offset positioning for free from the
    category scale.
  - Imprint palette is fully correct and in canonical order (Hardware=#009E73 brand
    green, Software=lavender, Services=blue), identical across both themes; backgrounds
    are correctly warm off-white (light) and warm near-black (dark).
  - All theme-adaptive chrome (title, axis titles, tick labels, legend text, and the
    callout annotation) correctly threads t.ink / t.inkSoft / t.grid tokens — both
    renders are fully legible with no dark-on-dark or light-on-light failures.
  - 'Clean, minimal composition: single y-axis-only subtle grid, one axis border removed,
    generous whitespace, legend placed close to the plot rather than isolated.'
  - 'Top-performer emphasis (larger marker + ''Top: $42.5M'' callout) creates a clear,
    honest focal point without simulating any fake interactivity.'
  - Data is realistic (quarterly revenue by product line across sales regions) and
    sorted by a meaningful metric (descending total revenue per region), matching
    the spec's explicit guidance.
  weaknesses:
  - Legend swatches render as squares (boxWidth/boxHeight) while the actual data marks
    are circular dots — set legend.labels.pointStyle/usePointStyle to circles so the
    legend visually matches the lollipop markers.
  - The three lollipops within a group sit very close together (categoryPercentage/barPercentage
    produce only a slight horizontal offset) — a touch more spread would make the
    'side by side' grouping read more clearly at a glance, especially in the Latin
    America group where values are closest together.
  - The mandated title occupies only ~30% of the canvas width at the current fontsize
    — not a violation, but there is headroom to grow it slightly for more visual presence
    at the top of a 3200px-wide canvas without approaching the overflow threshold.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "lollipop-grouped · javascript · chartjs · anyplot.ai" in dark ink, centered top. X-axis title "Region", Y-axis title "Quarterly Revenue ($M)" in dark ink. Tick labels in a softer dark gray. Legend (Hardware/Software/Services) top-right with square color swatches. A single subtle horizontal (y-axis-only) gridline set. "Top: $42.5M" callout in dark bold text above the tallest North America Hardware marker. All chrome text is clearly readable against the light background.
      Data: Four region groups (North America, Europe, Asia Pacific, Latin America) sorted descending by combined revenue, each with three thin vertical stems topped by circular dots — green (#009E73, Hardware), lavender (Software), blue (Services). The top value (North America Hardware, $42.5M) has a visibly larger dot than the rest.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/soft-light gray, fully legible against the dark surface. Legend text is light-colored and readable. Gridline is a faint light rule. "Top: $42.5M" callout renders in light text above the tallest marker — no dark-on-dark failure.
      Data: Identical marker colors and positions to the light render — green (#009E73), lavender, and blue dots are unchanged, confirming only chrome flipped between themes, not data colors.
      Legibility verdict: PASS
