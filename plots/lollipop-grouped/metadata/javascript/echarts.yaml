review:
  strengths:
  - Correctly builds a grouped lollipop chart via a custom renderItem series (the
    only native way in ECharts), with clean per-series offset logic so the three series
    sit side by side within each category band
  - Data sorted by total revenue descending, giving the chart a clear visual hierarchy
    from top to bottom
  - 'Perfect Imprint palette compliance: first series is #009E73, remaining series
    follow canonical order, and both renders keep identical data colors with fully
    theme-correct chrome'
  - 'Clean layout: no overlapping text or marks, generous whitespace, all font sizes
    explicitly set and well-balanced between axes'
  - White stroke around each marker cleanly separates dots from stems and background,
    improving legibility
  weaknesses:
  - 'CQ-01: the makeRenderItem() closure factory is a function, deviating slightly
    from a flat top-to-bottom KISS structure — justified by the ECharts custom-series
    API but still a minor structural deduction'
  - 'DE-01/DE-03: design is clean but stops at sorted-order hierarchy; direct value
    labels next to markers or a highlighted top region would push storytelling further'
  - 'LM-02: the renderItem-based lollipop is distinctive to ECharts among the JS libraries
    but is a fairly standard community pattern for this exact chart type, not a rare
    feature'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "lollipop-grouped · javascript · echarts · anyplot.ai" centered at top in bold dark ink; legend (Hardware/Software/Services) centered below title with colored swatches; y-axis region labels (North America, Asia Pacific, Europe, Latin America, Middle East & Africa) in dark-gray ink; x-axis "Revenue ($M)" label and 0-70 tick labels in soft dark gray; subtle vertical gridlines. All fully readable against the light background.
      Data: Three lollipop series per region — Hardware (brand green #009E73), Software (lavender), Services (blue) — thin stems from x=0 to circular markers with a light stroke outline. Values decrease from North America (highest) to Middle East & Africa (lowest), sorted by total revenue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light/off-white ink, fully legible against the dark background; gridlines are subtle light lines at low opacity. No dark-on-dark text anywhere.
      Data: Confirmed identical data colors to the light render (green, lavender, blue) — only chrome (background, text, grid) flipped, exactly per the theme-adaptive chrome rule.
      Legibility verdict: PASS
