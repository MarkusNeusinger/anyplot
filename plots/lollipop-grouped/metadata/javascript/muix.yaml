review:
  strengths:
  - 'Every spec property shows: thin stems from one shared zero baseline, an untruncated
    value axis, side-by-side offset within each region with clearly wider gaps between
    regions, and the same series order and colors in every group'
  - Regions sorted by total revenue computed from the records (North America 158 >
    Asia-Pacific 130 > Europe 121 > Latin America 62)
  - Uses the v9 ChartsContainer composition API with useXScale/useYScale hooks to
    draw lollipops as a custom SVG layer on MUI X band/linear axes
  - Page-colored ring around each marker separates dot from stem, and the '$xxM' format
    is derived from the value column name and shared by ticks and value labels
  - 'Theme-correct in both renders: Imprint colors identical, chrome (ticks, labels,
    grid, legend text) flips cleanly'
  weaknesses:
  - 'VQ-06 (both): the category axis carries no title, so the four tick labels are
    not named as regions → add the axis label from the CATEGORY constant (''Region''),
    with the x-axis height raised to fit it. Likely cause: xAxis config without label:
    CATEGORY.'
  - 'Suggestion: drive the legend from MUI X''s own ChartsLegend (series declared
    with labels and colors) instead of the hand-built HTML legend, which would also
    give hover tooltips in the HTML output.'
  - 'Suggestion: the 25% headroom above the tallest marker leaves the $75M-$85M band
    empty; a smaller pad would give the stems more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: centered dark title "lollipop-grouped · javascript · muix · anyplot.ai"; horizontal legend below it (Hardware, Software, Services with circular swatches); y axis "Revenue ($M)" with ticks $0M-$85M every $5M; region tick labels North America, Asia-Pacific, Europe, Latin America; subtle horizontal grid. All text dark and readable.
      Data: 12 lollipops in 4 groups of 3 - Hardware #009E73 green, Software purple, Services blue - thin stems from $0M to circular markers with page-colored rings, value labels ($48M, $71M, ... $17M) above each marker. Regions sorted by total.
      Legibility verdict: PASS

