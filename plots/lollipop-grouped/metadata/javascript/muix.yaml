review:
  strengths:
  - 'Correct grouped-lollipop construction: thin stems + circular markers with a cream/near-black
    stroke, drawn as SVG on top of ChartContainer''s own band/linear scales so marks
    line up exactly with the axes.'
  - 'Imprint palette applied correctly: Hardware (series 1) is brand green #009E73,
    Software is lavender, Services is blue, in canonical order and identical across
    both themes.'
  - Both light and dark renders are fully legible with theme-adaptive title/axis/tick/legend
    text — no dark-on-dark or light-on-light failures.
  - Manual Y-axis title component thoughtfully works around ChartsYAxis's built-in
    label-offset formula overlapping the wide "$NNM" tick labels.
  - Realistic, neutral business dataset (quarterly revenue by product line across
    four regions) with sensible geographic scale (North America highest, Latin America
    lowest).
  weaknesses:
  - Missing `skipAnimation` on <ChartContainer> — the muix library rules mandate it
    on every chart component so the screenshot always captures the final frame; add
    it even though the custom SVG marks aren't part of MUI's own animated series.
  - 'Data storytelling is minimal: the Software > Hardware > Services ranking is identical
    in all four regions, so the chart never reveals a cross-group pattern — sort categories
    by total revenue or vary the ranking in at least one region per the spec''s own
    suggestion ("Sort categories by a meaningful metric to reveal patterns").'
  - Aesthetic polish is at the 'well-executed default' level — default MUI axis chrome,
    single-direction grid, no value labels or size/emphasis variation — push further
    to distinguish from a good baseline (e.g., value labels on markers, a highlighted
    focal series/region).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "lollipop-grouped · javascript · muix · anyplot.ai" centered at top in dark ink. Legend row below the title with three circular swatches (Hardware=green, Software=lavender, Services=blue). Y-axis "Revenue ($M)" rotated label in soft dark ink with $0M-$75M gridlines every $5M. X-axis shows four region category labels (North America, Europe, Asia-Pacific, Latin America) in dark ink, centered under their lollipop groups.
      Data: Twelve lollipops (4 regions x 3 series), thin colored stems from baseline to circular marker heads with a light stroke outline. First series (Hardware) is brand green #009E73, Software is lavender #C475FD, Services is blue #4467A3 — matches the canonical Imprint order.
      Legibility verdict: PASS — all title/axis/tick/legend text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis layout as the light render, now rendered in light ink/off-white text against the dark surface. Gridlines are subtle light hairlines.
      Data: Same lollipop layout and marker colors as light render — green, lavender, and blue markers are pixel-identical hues to the light version; only the chrome (background, text, grid, stroke around markers) flipped to the dark theme.
      Legibility verdict: PASS — all text is light-colored and clearly readable against the near-black background; no dark-on-dark failures observed.
