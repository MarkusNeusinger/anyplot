review:
  strengths:
  - Categories sorted by descending total revenue, and Asia-Pacific's Hardware-led
    mix breaks the flat "Software always wins" pattern from attempt 1 - directly resolves
    the attempt 1 DE-03/DQ-01 feedback
  - skipAnimation added to <ChartContainer>, fixing the attempt 1 CQ-05 auto-deduction
  - Focal-region highlight band and per-marker $NNM value labels add data storytelling
    without cluttering the chart
  - Correct, idiomatic use of MUI X's low-level composition hooks (useXScale, useYScale,
    useDrawingArea) to build a chart type with no built-in community-package equivalent
  - 'Both themes fully theme-correct: identical data colors, correct chrome flip,
    no legibility failures'
  weaknesses:
  - Focal-highlight band opacity (0.07) is quite subtle - could read more clearly
    at a glance (and at mobile scale) with slightly higher opacity, e.g. ~0.10-0.12
  - Visual refinement is still fairly close to MUI X defaults (single-direction grid,
    standard axis lines) - a bit more customization would push Design Excellence further
  - Legend swatches are plain filled circles with no stroke, while data markers use
    a stroke outline - a small inconsistency in visual language between legend and
    chart
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark)
      Chrome: Title "lollipop-grouped · javascript · muix · anyplot.ai" centered at top in dark ink; legend row below with three circular swatches (Hardware=green, Software=lavender, Services=blue); rotated "Revenue ($M)" y-axis label; $0M-$85M gridlines every $5M; region labels (North America, Asia-Pacific, Europe, Latin America) on the x-axis, sorted by descending total revenue. All chrome text clearly readable against the light background.
      Data: Twelve lollipops (4 regions x 3 series) with thin colored stems and circular marker heads (light stroke outline), each annotated with its exact $NNM value. First series (Hardware) is #009E73 (Imprint brand green). A subtle translucent green band highlights the North America column (top-revenue region).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light)
      Chrome: Same title, legend, focal-highlight band, and axis layout as the light render, now in light ink/off-white text against the dark surface, with subtle light gridlines. No dark-on-dark issues - all text (including the small $NNM value labels) is clearly legible.
      Data: Lollipop stem/marker colors (green, lavender, blue) are pixel-identical to the light render - only chrome (background, text, grid, marker stroke) flipped.
      Legibility verdict: PASS
