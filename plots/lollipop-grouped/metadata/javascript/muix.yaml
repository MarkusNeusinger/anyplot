review:
  strengths:
  - 'Uses MUI X''s composition API idiomatically: a custom SVG lollipop layer reads
    the band and linear scales through useXScale/useYScale inside ChartsContainer,
    with ChartsGrid and ChartsXAxis/ChartsYAxis supplying theme-adaptive chrome'
  - 'Faithful to the spec''s characteristics: thin stems from a shared, untruncated
    zero baseline, the same series order in every group, a wider gap between groups
    than within them, and regions sorted by total revenue'
  - Page-colored ring around each marker separates it cleanly from its stem in both
    themes, and the legend circles match the markers
  - The data shows rank swaps (Software leads North America and Europe, Hardware leads
    Asia-Pacific) and a near-tie group, which suits the chart's purpose
  - 'Imprint palette applied through t.palette with #009E73 first; chrome flips correctly
    between #FAF8F1 and #1A1A17'
  weaknesses:
  - 'Suggestion: build the legend with MUI''s ChartsLegend (for example from declared
    series whose own marks are hidden) instead of the hand-built HTML flex row, so
    legend layout and theming come from the library.'
  - 'Suggestion: a $10M tick step would halve the 18 horizontal gridlines and calm
    the background without losing readability, since the value labels already carry
    the exact numbers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: centered title "lollipop-grouped · javascript · muix · anyplot.ai" in dark ink; a horizontal legend below it (Hardware, Software, Services with circular swatches); left axis "Revenue ($M)" with ticks $0M–$85M in $5M steps; bottom axis "Region" with North America, Asia-Pacific, Europe, Latin America; subtle horizontal gridlines; L-shaped axis lines. All text dark and readable.
      Data: four region groups sorted by total revenue, each with three lollipops side by side — Hardware #009E73 (green), Software purple, Services blue — thin stems from $0 to 12 px circular markers ringed in the page color, with a dollar value label above each marker ($48M/$71M/$39M, $52M/$45M/$33M, $33M/$58M/$30M, $21M/$24M/$17M). First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend labels, axis titles, tick labels and value labels all render in light ink; gridlines subtle light lines; axis lines light. No dark-on-dark text.
      Data: green, purple and blue markers and stems are identical to the light render; only the chrome and the marker ring (page color) flip.
      Legibility verdict: PASS
