review:
  strengths:
  - Top-performer storytelling (highlighted band, accent bar, bold row label, star
    callout) creates a genuine focal point instead of a flat comparison, directly
    rewarding DE-03
  - 'Correct Imprint palette with theme-adaptive chrome: first series is #009E73,
    categorical data colors are pixel-identical between light and dark renders, only
    chrome (background/text/grid) flips'
  - Nested scaleBand (y0 for category, y1 for series) produces clean grouped-lollipop
    offsets with no overlap across 5 categories x 3 series
  - Direct value labels next to each dot remove the need to eyeball gridlines, improving
    legibility at a glance
  - Legend width/position is computed dynamically via getBBox() and centered, instead
    of a hardcoded offset
  - Sorted categories ascending by mean score so the strongest model naturally lands
    at the top row, reinforcing the highlight
  weaknesses:
  - Vertical gridlines run through the highlighted top-performer band at the same
    opacity as elsewhere, slightly diluting the isolation of the highlight wash —
    consider suppressing or fading gridlines within the highlighted row band
  - Design embellishment is limited to a single storytelling device (top-performer
    highlight); DE-01 aesthetic sophistication would read stronger with one more layer
    of intentional hierarchy (e.g. subtle value-label color coding or a secondary
    annotation)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "lollipop-grouped · javascript · d3 · anyplot.ai" is centered, bold, dark ink, clearly readable. A 3-item legend (Accuracy/Precision/Recall) sits below the title with colored dot swatches. X-axis "Score (%)" label and 0%-100% tick labels are dark and legible. Y-axis shows 5 model names (SVM (RBF), Logistic Regression, Random Forest, Gradient Boosting, Neural Network) in dark text, with "Neural Network" bolded. Subtle vertical gridlines are visible but do not dominate.
      Data: Each category row has three horizontal stems (thin, ~70% opacity) ending in circular dots — green (#009E73, Accuracy), violet (Precision), and slate-blue (Recall) — each with a white-stroked halo separating it from the stem, plus a bold numeric value label to the right of each dot. The top row ("Neural Network") has a soft green highlight wash, a green accent bar on the left edge, and a "★ Top performer — highest accuracy (96.2%)" callout above it. First series is confirmed #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend labels, axis titles, and tick labels all render in light/white text, clearly visible against the dark background. Gridlines are subtle dark-gray, visible but unobtrusive. The top-performer highlight wash uses a darker green tint appropriate for the dark surface, with the same green accent bar and callout text (in green, still legible).
      Data: Data colors (green, violet, slate-blue for Accuracy/Precision/Recall) are identical in hue and saturation to the light render — only the chrome (background, text, grid, highlight tint) has flipped. No dark-on-dark failures observed; every tick label, axis label, legend label, and value label is clearly distinguishable from the near-black background.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures.
