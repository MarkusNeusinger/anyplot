review:
  strengths:
  - 'Correct grouped lollipop chart: thin stems from baseline plus circular markers,
    side-by-side offset within each category group, exactly matching the spec''s structural
    requirements.'
  - Categories sorted ascending by accuracy (SVM at bottom to Neural Network at top),
    matching the spec's 'sort categories by a meaningful metric' guidance and making
    the ranking easy to read.
  - Horizontal orientation chosen because category labels ('Logistic Regression',
    'Gradient Boosting') are long — matches the spec's explicit suggestion.
  - 'Imprint palette applied in correct canonical order (green/lavender/blue) and
    identical between light and dark renders; both themes have correct #FAF8F1 / #1A1A17
    backgrounds and theme-adaptive chrome.'
  - 'Clean, idiomatic D3: KISS top-to-bottom structure, deterministic in-memory data,
    proper data-join usage (selection.data().join()) for stems/dots/value labels,
    nested scaleBand for grouping.'
  - Legend is clear, centered, and close to the title/plot rather than floating isolated.
  weaknesses:
  - Value labels beside each dot (13px, t.inkSoft) become hard to make out once the
    PNG is scaled down to the ~400px mobile thumbnail (verified against plot-light_400.png)
    — increase to ~16-18px or otherwise strengthen contrast/weight so they survive
    downscaling.
  - The three metrics (Accuracy/Precision/Recall) move in strict lockstep for every
    single model — no rank reversals or trade-offs — which makes the dataset feel
    one-dimensional; vary one model's relative precision/recall slightly to show a
    more realistic trade-off and improve feature coverage.
  - 'Design Excellence is at the ''well-configured, standard'' level rather than distinctive:
    no visual emphasis on the top performer or other insight (e.g., a subtle highlight
    band, callout, or size/weight emphasis on the best model) — add a deliberate focal
    point to strengthen the data storytelling.'
  - The y0/y1 nested band-scale grouping is a fairly generic 'textbook' D3 pattern;
    consider a more distinctive D3-only technique (e.g., value-driven encoding via
    d3.interpolate, layered annotation, or custom easing-free transitions) to better
    showcase D3's unique flexibility versus a higher-level charting library.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "lollipop-grouped · javascript · d3 · anyplot.ai" in bold dark ink at top; a centered legend below it with three circular swatches (green/lavender/blue) labeled Accuracy, Precision, Recall; five horizontal category groups (SVM (RBF), Logistic Regression, Random Forest, Gradient Boosting, Neural Network, sorted ascending bottom-to-top) on the y-axis; x-axis 0%-100% with "Score (%)" label and subtle vertical gridlines at each 20% tick. All chrome text is dark and clearly readable against the light background at full resolution.
      Data: Each category shows three thin colored stems running from x=0 to a circular dot at the model's score, with a small numeric value label to the right of each dot. First series (Accuracy) renders in #009E73 (brand green), Precision in the Imprint lavender, Recall in the Imprint slate blue — correct canonical order.
      Legibility verdict: PASS at full resolution. Minor caveat: at the ~400px mobile thumbnail (plot-light_400.png), the small numeric value labels next to the dots become difficult to read, though title, legend, axis ticks, and category names remain legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Identical layout to the light render; title, legend text, category labels, tick labels, and value labels all switch to light-colored ink and remain clearly readable against the dark background. No dark-on-dark failures observed anywhere.
      Data: Stem/dot colors are pixel-identical to the light render (green/lavender/blue) — only the chrome (background, text, gridlines) flips between themes, as required.
      Legibility verdict: PASS. Same mobile-scale caveat as the light render applies to the value labels.
