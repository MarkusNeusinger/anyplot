review:
  strengths:
  - Uses bokeh.transform.dodge on a categorical x range so each series is offset within
    its region without hand-computed positions
  - Stems as segment glyphs from a shared zero baseline on an untruncated 0-105 axis,
    so stem lengths compare directly
  - 'Theme tokens threaded through every chrome element: both renders are fully readable,
    data colors identical'
  - Page-colored marker ring cleanly separates each dot from its stem in both themes
  - Column constants with role comments and the full eight-position Imprint palette
    make the code adaptable to new data
  weaknesses:
  - 'VQ-03 (both): legend glyphs render as ~6 px dots next to 30 px data markers,
    so the swatches are barely visible → glyphs near marker size (~24-30 px, about
    +20 px). Likely cause: the legend draws the scatter renderer with its line_color=PAGE_BG
    ring scaled into glyph_height/glyph_width=30, leaving only a tiny fill; raise
    glyph_height/glyph_width or render the legend from a dedicated larger glyph.'
  - 'SC-02 (both): regions are shown in the fixed North, South, East, West order (totals
    230, 243, 229, 244 $M), so the C4 property ''categories in a meaningful order''
    is missed → sort the regions by total revenue (e.g. West, South, North, East).
    Likely cause: regions = list(df[REGION].unique()) without sorting by a metric.'
  - 'Suggestion: a HoverTool showing region, product line and revenue would add exact
    values in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold title 'lollipop-grouped · python · bokeh · anyplot.ai' in near-black at top left (~50% of width); italic axis titles 'Region' and 'Revenue ($ million)'; tick labels North/South/East/West and 0-100 in dark gray; faint horizontal grid, no vertical grid; legend top right on #FFFDF6 with italic title 'Product line'. All text readable.
      Data: four regions, each with four vertical lollipops (Electronics #009E73, Clothing #C475FD, Food #4467A3, Home #BD8233) in the same order, thin stems from 0 to circular markers with a page-colored ring; wider gaps between regions than within. Legend glyphs are tiny dots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink, tick labels in light gray, faint grid, legend on #242420 with light text. No dark-on-dark text.
      Data: identical data colors and geometry to the light render; brand green clearly visible; only chrome flips.
      Legibility verdict: PASS
