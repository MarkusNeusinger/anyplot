review:
  strengths:
  - Every lollipop is its own XY series with a radius-0 base node, so stems stay separate
    and start from one shared zero baseline
  - Within-group offsets are computed from the series count, giving a clear wider
    gap between groups than within them
  - Inline CSS through pygal's css config keeps the 6 px stems from being thinned
    by pygal's .reactive rule
  - Theme tokens threaded through Style; both renders readable with identical Imprint
    data colors
  - Columns as constants and a tidy df pivoted with pivot_table(sort=False) keep the
    data block adaptable
  weaknesses:
  - 'VQ-03 (both): legend swatches render as ~13 px squares beside 44 px legend text
    and do not match the r=26 circular markers → swatch size closer to the text height.
    Likely cause: pygal''s default legend_box_size with the large legend_font_size.'
  - 'VQ-05 (both): an empty band of about 200 px (≈11 % of the height) sits below
    the single-row legend, leaving the bottom of the canvas unused → reclaim it for
    the plot area. Likely cause: legend_at_bottom with default bottom margin/legend
    spacing.'
  - 'Suggestion: a distinct visual cue (e.g. sorting groups descending so the largest
    total leads) could guide the reader''s first glance.'
