review:
  strengths:
  - Every lollipop is a 2 px stem from one shared zero baseline (ax.axhline(0) replacing
    the bottom spine) to a circular marker at its value, with an untruncated y-axis
    from 0 to 6.5, so stem lengths compare directly across all four regions
  - Within-group offset (0.22) is clearly narrower than the gap between groups (0.56),
    and the series keep the order Electronics, Furniture, Clothing in every region
  - Regions are sorted by total revenue (East 11.5, North 10.5, West 10.1, South 9.5)
    via table.sum(axis=1).sort_values(), computed from the data rather than typed,
    and the x-axis title says so
  - 'Theme tokens threaded through title, labels, ticks, spine, grid and legend frame:
    both renders are fully legible, with Imprint positions 1-3 identical across themes'
  - Marker edges in the page color give each dot a clean cap where it meets its stem,
    in both themes
  - pivot_table(sort=False) + vectorised ax.vlines/ax.scatter per series keeps the
    plot block short and data-driven; limits and ticks all come from the table
  weaknesses:
  - 'Suggestion: the horizontal legend sits on the 6 gridline in the headroom; giving
    it a slightly larger ylim margin or placing it above the axes would let the grid
    run uninterrupted.'
  - 'Suggestion: a light emphasis on the leading series per region (for example a
    slightly larger marker for each group''s maximum) could guide the eye to the rank
    swaps, which the spec calls the point of the chart.'
