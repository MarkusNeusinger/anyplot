review:
  strengths:
  - Regions are sorted by total revenue via pivot_table and row sums, so the strongest
    markets lead and the long Latin America / Middle East tail reads at a glance
  - All stems of a series are one gap-separated line trace, keeping the figure to
    six traces with matching legend entries
  - Theme tokens threaded through title, ticks, grid, zeroline and legend; both renders
    are fully legible with identical data colors
  - Hover template built from customdata names region, product line and value, while
    stems are excluded from hover
  - Value axis pinned to a zero baseline computed from the data, so stem lengths compare
    directly
  weaknesses:
  - 'Suggestion: align the ''Product line'' legend title vertically with the entries
    (legend.title.side=''left'') so the legend reads as one row.'
  - 'Suggestion: drop the redundant NaN fill in stem_y, since the gap slots are overwritten
    with None anyway.'
