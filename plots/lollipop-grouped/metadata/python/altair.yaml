review:
  strengths:
  - Native Vega-Lite xOffset encoding groups the lollipops side by side, with paddingInner/paddingOuter
    giving clearly wider gaps between regions than within them
  - Stems and markers come from one shared encoded base layered as mark_rule + mark_circle,
    with y2=alt.datum(0) anchoring every stem to a shared zero baseline on an untruncated
    axis
  - Regions sorted by total score, with the x-axis title stating the sort
  - Page-coloured marker outline separates each dot cleanly from its stem in both
    themes
  - Theme tokens thread through all chrome; both renders are fully readable and data
    colours are identical
  - HTML output carries tooltips for region, quarter and score
  weaknesses:
  - 'DQ-02 (both): the value is labelled only ''Performance Score'', which names no
    concrete measure, so the regional scenario reads as generic → a concrete, named
    metric (e.g. ''Customer Satisfaction Index'' or ''Net Promoter Score'') with values
    on its real scale. Likely cause: the SCORE column name and the value list.'
  - 'Suggestion: the boxed legend sits far above the plot with a wide empty band below
    it; a lighter or unboxed legend closer to the plot would tighten the layout.'
  - 'Suggestion: a direct label on the leading region''s peak quarter could give the
    chart a focal point.'
