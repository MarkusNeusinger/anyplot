review:
  strengths:
  - Native xOffset encoding builds the side-by-side groups from one shared base chart;
    paddingInner=0.35 on the category scale and paddingOuter=0.6 on the offset scale
    make the gap between regions clearly wider than within them
  - Stems are mark_rule layers with y2=alt.datum(0), so every lollipop starts from
    the shared zero baseline on an untruncated 0-110 axis
  - Regions are sorted by total revenue (North, West, East, South), computed from
    the data with groupby, and the x-axis title says so
  - Markers carry a page-colored outline that separates each dot cleanly from its
    stem in both themes
  - Theme tokens are threaded through title, axes, grid and the legend frame; both
    renders are fully legible and the Imprint colors are identical across themes
  - Tooltips with readable titles add value inspection in the HTML output
  weaknesses:
  - 'Suggestion: the boxed legend sits left-aligned under a centered title; anchoring
    it to the plot''s right edge or dropping the frame would balance the header.'
  - 'Suggestion: the lower half of the plot is empty grid by necessity of the zero
    baseline; a lighter grid (fewer y ticks, e.g. every 20) would let the marker heights
    read faster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: centered bold title "lollipop-grouped · python · altair · anyplot.ai" in dark ink; y-axis "Revenue ($M)" 0-110 with ticks every 10 and subtle horizontal grid; x-axis "Region (sorted by total revenue)" with North, West, East, South; boxed horizontal legend "Quarter" top-left on an elevated fill. All text dark on light and readable.
      Data: four groups of three lollipops each: thin stems from the zero baseline to circular markers; Q1 2024 #009E73 green, Q2 2024 #C475FD purple, Q3 2024 #4467A3 blue, same order in every group; wider gaps between groups than within.
