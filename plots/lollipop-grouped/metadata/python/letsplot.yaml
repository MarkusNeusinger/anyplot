review:
  strengths:
  - Regions sorted by total revenue computed from the data, with one series order
    in every group, so the East-to-South decline reads at a glance
  - 'Clean theme-token threading: chrome flips correctly between #FAF8F1 and #1A1A17
    while the Imprint data colors stay identical'
  - Canonical lets-plot canvas (ggsize 800x450, scale 4) with the library prompt's
    text sizes and a y limit derived from the data
  - Interactive HTML export gives hover tooltips on every lollipop in the detail view
  weaknesses:
  - 'DE-02 (both): all four panel borders are drawn as a full rectangle around the
    plot area (dark ink in light, grey in dark) where the style guide removes top
    and right spines by default → remove the frame (no spines, or left and bottom
    only). Likely cause: panel_background=element_rect(fill=PAGE_BG) without color=PAGE_BG,
    which lets the rect''s default border draw; set color or add panel_border=element_blank().'
  - 'DQ-02 (both): the regions are the generic compass labels North, South, East,
    West, which read as placeholders → named sales regions (e.g. Pacific Northwest,
    Southeast, Midwest, Northeast). Likely cause: the keys of the raw data dict.'
  - 'CQ-04 (code): the side-by-side offset is computed by hand (lines 63-70: X_POS,
    BASELINE, offset, series index arithmetic) where lets-plot computes it → map x=REGION
    and use position_dodge(width=0.75) on geom_point and on the stem layer (e.g. geom_linerange(ymin=0)
    or geom_lollipop). Likely cause: hand-rolled dodge.'
  - 'Suggestion: a subtle y-only grid (15 % ink) would make the values easier to read
    off the axis for the stems far from it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: title 'lollipop-grouped · python · letsplot · anyplot.ai' top left in dark ink (about half the width); y-axis 'Revenue ($ thousands)' 0-300 in steps of 50; x-axis 'Region' with East, West, North, South; legend 'Product Line' on an elevated #FFFDF6 box at the right. A full dark rectangle frames the panel on all four sides; no grid. All text readable.
      Data: 12 lollipops in 4 groups of 3: Electronics #009E73 (highest in every region, East 267), Furniture #C475FD, Clothing #4467A3; thin stems from zero to round markers; wider gaps between groups than within.
      Legibility verdict: PASS

