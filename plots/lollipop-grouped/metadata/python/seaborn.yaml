review:
  strengths:
  - Regions are sorted by total revenue (North 147 > West 133 > East 126 > South 101),
    computed from the data with groupby().sum().sort_values(), and the product lines
    keep the same order in every group
  - Stems drawn with ax.vlines from a shared zero baseline on an untruncated y axis,
    so stem lengths compare directly within and across regions
  - Seaborn scatterplot with hue/hue_order/palette produces the markers and a legend
    whose glyphs match the marks in both themes
  - Markers carry a thin page-colored ring (edgecolor=PAGE_BG) that separates them
    from their stems, and x tick marks are removed on the categorical axis
  - Theme tokens are threaded through sns.set_theme rc, so the chrome flips correctly
    while the Imprint data colors stay identical
  weaknesses:
  - 'Suggestion: a slightly wider within-group offset (e.g. 0.8 / n_lines) would give
    the three lollipops of a group a little more separation while keeping the between-group
    gap clearly wider.'
  - 'Suggestion: real region names (e.g. EMEA, APAC, Americas, LATAM) would make the
    retail-revenue scenario feel more concrete.'
  image_description: |-
