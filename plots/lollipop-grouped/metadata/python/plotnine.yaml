review:
  strengths:
  - One shared position_dodge(width=0.6) object places stems and markers together,
    giving tight within-group spacing and clear gaps between regions
  - Series order is fixed with pd.Categorical and scale_color_manual(limits=...),
    so Software, Hardware, Services read in the same order and colour in every group
  - Regions run in descending total revenue, so the decline from North America to
    Latin America reads left to right
  - Theme tokens thread through every chrome element including legend background and
    keys; both renders are fully readable
  weaknesses:
  - 'Suggestion: a slightly heavier marker outline or size step could give the values
    a little more presence against the stems.'
  - 'Suggestion: horizontal orientation would leave more room if longer region names
    are used with own data.'
