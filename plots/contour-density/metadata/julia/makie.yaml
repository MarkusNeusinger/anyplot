review:
  strengths:
  - Classic, real-world bimodal dataset (Old Faithful geyser eruption duration vs.
    waiting time) perfectly showcases density contour clusters and gradient levels
    — an ideal, factually accurate example for this spec.
  - Correct use of the Imprint `imprint_seq` sequential colormap (brand green → blue)
    for single-polarity density data, with data colors identical across both themes.
  - 'Thoughtful layered composition: filled contours + subtle bg-colored contour outlines
    + translucent scatter overlay for point-level context, all with explicit font
    sizes and fully theme-adaptive chrome (backgrounds, spines, ticks, colorbar).'
  - Title format, axis labels with units, canvas dimensions, and spine/grid minimalism
    are all spec- and style-guide-compliant.
  weaknesses:
  - 'The ''Short eruptions'' / ''Long eruptions'' text!() annotations do not render
    in either theme. Verified with full-resolution crops around the data coordinates
    (2.0, 40) and (4.3, 100), plus a full-canvas quadrant scan of both plot-light.png
    and plot-dark.png — no text glyphs appear anywhere near those points or elsewhere
    on the canvas. This is dead/non-functional code: either fix why text!() produces
    no visible output (check axis limits vs. padded xgrid/ygrid range, z-order relative
    to contourf!/scatter!, or a Makie API argument issue) or remove the two text!()
    blocks and the ANNOTATION_INK/ANNOTATION_HALO constants entirely.'
  - The scatter overlay (markersize=6, alpha=0.35) reads a little too faint against
    the density fill — bumping to markersize~8 and alpha~0.45 would make the point-level
    context easier to see, especially at mobile scale.
  - 'Library Mastery is solid but generic: beyond the custom colsize!/Colorbar layout,
    no Makie-distinctive feature (e.g. Legend, faceted GridLayout, custom Colorbar
    tick formatting) sets the implementation apart from a generic contour+scatter
    plot.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "Old Faithful Geyser · contour-density · julia · makie · anyplot.ai" clearly visible; dark-ink axis labels "Eruption Duration (min)" / "Waiting Time to Next Eruption (min)" readable; softer-ink tick labels on both axes and the colorbar ("Density", 0.005-0.020) all legible; top/right spines removed, left/bottom spines in soft ink; no grid lines.
      Data: Filled contours run from Imprint brand green (low density) to blue (high density) via the imprint_seq sequential colormap, revealing two clear density clusters (short vs. long eruption regimes) connected by a low-density "bridge". Semi-transparent dark scatter dots overlay the raw 272 Old Faithful data points for context. Two text!() annotations ("Short eruptions", "Long eruptions") are present in the source code but DO NOT actually render anywhere on the canvas — confirmed via full-resolution crops around their intended data coordinates and a full quadrant scan of the image.
      Legibility verdict: PASS (all rendered text is readable; the missing annotations are a functional/code bug, not a legibility failure, since no text pixels exist there at all).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis labels in light ink, tick labels in softer light-gray ink, colorbar labels light and readable — no dark-on-dark issues found. Spines flip to the light soft-ink tone correctly.
      Data: Density colormap is pixel-identical to the light render (green → blue), confirming data-color consistency across themes. Scatter overlay dots use the theme's INK token (so they appear light-colored against the fill in dark mode) — an intentional, theme-adaptive contextual overlay rather than a categorical data color, so this does not violate palette consistency. The same two annotation labels are again completely absent from the render.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures for any text that actually renders).
