review:
  strengths:
  - Uses the classic Old Faithful geyser dataset (via RDatasets) — a genuinely bimodal,
    scientifically real bivariate distribution that is the textbook use case for a
    density contour plot.
  - Correct imprint_seq sequential colormap (brand green -> blue) for the single-polarity
    density surface, identical data colors between light and dark renders, theme-correct
    chrome in both.
  - 'Thoughtful layered composition: filled contourf for the density surface, contour!
    lines tinted to the page background as subtle band separators, plus a semi-transparent
    scatter overlay for individual-point context — goes beyond a bare contourf call.'
  - 'Title length was managed well: the optional descriptive prefix (''Old Faithful
    Geyser · '') brings the total title to ~67 characters, landing right at the style
    guide''s calibration target, so titlesize=20 renders proportionally without overflow.'
  - All font sizes explicitly set (title/axis/tick/colorbar), top/right spines removed,
    axis labels are descriptive with units.
  - 'Clean KISS script structure: theme tokens -> data -> KDE grid -> plot -> save,
    all imports (CairoMakie, Colors, RDatasets, Statistics) are actually used.'
  weaknesses:
  - Scatter overlay uses strokewidth=0 with no marker edge, contrary to the style
    guide's 'white edge for definition, especially with overlapping points' guidance
    — in the dense cluster centers the semi-transparent dark/light dots blend into
    each other and into the blue fill. Add a thin theme-adaptive stroke (e.g. PAGE_BG
    at low alpha) to keep individual points distinguishable where they overlap.
  - 'Design Excellence is solid but not yet exceptional: no annotation calls out the
    two eruption regimes (Old Faithful''s well-known ''short'' vs ''long'' eruption
    clusters), so the storytelling relies entirely on color contrast rather than an
    explicit insight callout — would elevate DE-03 from ''good'' to ''excellent''.'
  - Library Mastery usage (contourf!/contour!/scatter!/Colorbar/colsize!) is correct
    and well-composed but not distinctively Makie-specific — the same layered contour+scatter+colorbar
    approach is straightforward to replicate in matplotlib or plotly with only syntax
    changes. Consider a feature that is harder to replicate outside Makie's grid-layout
    system for extra Library Mastery credit.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) visible in the margins around the axis; the plot interior itself is fully covered by the filled density surface (expected for a filled-contour density plot).
      Chrome: Title "Old Faithful Geyser · contour-density · julia · makie · anyplot.ai" in bold dark ink, fully visible with margin above, not clipped. X-axis label "Eruption Duration (min)" and Y-axis label "Waiting Time to Next Eruption (min)" both dark, descriptive, with units, fully readable. Tick labels in soft dark gray, legible. Colorbar labeled "Density" with numeric ticks (0.005-0.020), readable.
      Data: Sequential Imprint colormap running from brand green (#009E73, low density) through blue (#4467A3, high density) reveals two clear elliptical density peaks (short-duration/short-wait cluster near (2, 55) and long-duration/long-wait cluster near (4.3, 80)), connected by a low-density "waist". Thin light-toned contour separator lines delineate density bands. Semi-transparent dark scatter dots overlay the surface for individual-point context, most visible in the lower-density outer bands; in the densest cluster centers the dark, low-alpha dots blend into the blue fill and are hard to distinguish individually.
      Legibility verdict: PASS (all text readable; scatter overlay legibility in dense regions is a minor visibility issue, not a text legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) visible around the axis; plot interior again fully covered by the same filled density surface.
      Chrome: Title, axis labels, and tick labels have all flipped to light ink (near-white/light-gray) and remain fully readable against the dark background — no dark-on-dark failures observed. Colorbar label and ticks likewise flipped to light tones and legible.
      Data: Identical green-to-blue density surface and cluster shapes as the light render — data colors are unchanged between themes, confirming only chrome flipped. Scatter dots are now light-toned (INK flips to near-white) at the same low alpha; visibility in the dense cluster centers has the same minor blending issue as in the light render, now against the blue fill rather than black-on-blue.
      Legibility verdict: PASS (no dark-on-dark text; only the same minor scatter-overlay visibility issue as light render).
