review:
  strengths:
  - Genuine from-scratch bivariate KDE + marching-squares contour extraction (not
    faked) — implements the algorithm the spec requires despite the Highcharts core
    bundle having no built-in contour support
  - 'Correct use of the Imprint sequential colormap (green -> blue) for the 5 density
    levels, with the outermost/lowest-density contour anchored at brand green #009E73'
  - Bimodal dataset (main batch + tool-wear drift cluster) delivers genuine data storytelling
    that matches the spec's 'finding clusters and patterns' use case
  - Scatter overlay adds context without clutter — small radius (2.5) + alpha blending
    (0.35) is well-chosen for ~700 dense points
  - Both light and dark renders are fully readable, theme-adaptive chrome correctly
    implemented via ANYPLOT_TOKENS, canvas dimensions pass the gate
  weaknesses:
  - 'DE-02: y-axis line is still visible; removing it for a fully spine-free minimalist
    look would push visual refinement further, consistent with the style guide''s
    chrome guidance'
  - 'The contour computation (~10 helper functions: RNG, KDE grid, marching squares,
    path stitching) is justified by the library''s lack of native contour support,
    but a one-line top-of-file comment summarizing the pipeline (KDE grid -> marching
    squares -> path stitching) would help future maintainers navigate it faster'
  - The middle three contour bands (28%, 46%, 64%) are visually close in hue in the
    legend swatches; slightly wider color-lerp spacing between levels would make mid-range
    bands easier to tell apart at a glance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme surface — not pure white, not dark.
      Chrome: Title "Process QC · contour-density · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable. Axis titles "Part Diameter (mm)" and "Part Weight (g)" in soft dark ink. Tick labels and legend text ("Density 12%" ... "Density 82%") all clearly legible against the light background. Grid lines are subtle horizontal rules, visible but not dominant.
      Data: Five nested contour lines running from brand green #009E73 (outermost, lowest density, 12%) through teal/blue tones to a darker blue-indigo (innermost, highest density, 82%) — matches the Imprint imprint_seq sequential colormap (green -> blue). Grey semi-transparent scatter points (measured parts) sit underneath the contours for context, revealing both a dense main cluster and a smaller secondary cluster (tool-wear drift) to the upper right.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme surface — not pure black, not light.
      Chrome: Title and axis titles render in light ink (near-white), tick labels and legend text in soft light grey — all clearly legible against the dark background. Grid lines remain subtle and visible.
      Data: Contour line colors are pixel-identical to the light render (green -> blue-indigo gradient, same 5 density levels), confirming only chrome flipped between themes. Scatter points remain grey/semi-transparent and are clearly visible against the dark background. Same two-cluster (main batch + drift) shape is legible.
      Legibility verdict: PASS — no dark-on-dark failures; no text or data element is unreadable.
