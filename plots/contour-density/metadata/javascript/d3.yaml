review:
  strengths:
  - Correct, idiomatic use of d3.contourDensity() + d3.geoPath() to compute and render
    true KDE contours — a distinctly d3-specific feature not easily replicated in
    most libraries
  - Filled contour + semi-transparent scatter overlay combines density bands with
    individual-point context, directly matching the spec's suggested 'combine with
    scatter plot overlay' note
  - Sequential Imprint colormap (green→blue) correctly used for continuous density
    data instead of the categorical palette
  - Realistic, well-known bimodal dataset (Old Faithful eruption duration vs. waiting
    time) with domain-appropriate scale and values
  - Theme-adaptive chrome throughout (axis text, ticks, spines, scatter ink, contour
    stroke) — both renders pass legibility checks with no dark-on-dark/light-on-light
    issues
  - Clean deterministic LCG + Box-Muller data generation, no external dependencies,
    KISS top-level script structure
  weaknesses:
  - Legend gradient's 'High'/'Low' labels and axis tick labels are on the smaller
    side (14-15px) — bump slightly for better mobile legibility
  - Context-scatter markers (r=2.5, fill-opacity=0.25) are quite subtle inside the
    denser blue core — fine as auxiliary context but a touch more contrast/size would
    improve visibility without competing with the contour fill
  - No grid lines on either axis; the style guide suggests a grid on both axes can
    aid precise value reading on scatter-like plots — acceptable AI discretion here,
    not a hard defect
  - Design execution is solid but fairly standard d3 idiom without extra visual flourishes
    (e.g. a highlighted density-peak annotation) that would elevate it further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "contour-density · javascript · d3 · anyplot.ai" in dark ink, centered top, clearly legible. X-axis label "Eruption Duration (minutes)" and Y-axis label "Waiting Time to Next Eruption (minutes)" in dark ink, both readable. Tick labels in medium-gray ink, legible against the light background. Only left/bottom axis lines drawn (L-shaped frame), no grid.
      Data: Two clearly separated bimodal clusters of filled density contours, colored with the Imprint sequential ramp (brand green #009E73 at low density, transitioning to blue at the high-density core) — matches the imprint_seq spec for continuous data. A semi-transparent dark-ink scatter overlay shows individual data points for context, plus a handful of light-gray outlier points outside the contour bands. A vertical gradient legend on the right reads "High" at top and "Low" at bottom, labeled "Point density," using the same green→blue ramp.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Title in light/off-white ink, clearly legible against the dark background. Axis labels in light ink, tick labels in lighter gray — all readable, no dark-on-dark failures observed. Axis lines and legend border rendered in a soft light tone, visible against the dark surface.
      Data: Contour fills use the identical green→blue sequential ramp as the light render — data colors did not shift between themes, only the chrome (background, text, gridless axes, legend border) flipped. Scatter overlay dots now render in light ink (theme-adaptive token), remaining visible against both the dark background and the colored contour fills. Legend gradient and "High"/"Low"/"Point density" labels are legible in light-colored text.
      Legibility verdict: PASS.
