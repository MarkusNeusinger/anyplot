review:
  strengths:
  - 'Genuinely sophisticated composition: a real 2D KDE evaluated on a grid, contour
    vertices extracted via a from-scratch marching-squares implementation, and the
    paths drawn through MUI X''s own useXScale/useYScale hooks over a ScatterChart
    — the documented community composition pattern, not a workaround, for a chart
    type MUI X community has no native primitive for.'
  - Continuous density encoded with the Imprint sequential ramp (t.seq[0] to t.seq[1])
    via a custom mixHex interpolation, and the resulting colors are pixel-identical
    between the light and dark renders as required.
  - Realistic, appropriately scaled bearing QC data (24 mm outer diameter, ~46 g weight)
    with a plausible correlated bivariate spread across two overlapping production
    batches.
  - All font sizes explicitly set (title, subtitle, axis labels/ticks, legend), deterministic
    seeded LCG data generation, clean single-purpose imports.
  - Title format complies with the spec (`Descriptive Title · contour-density · javascript
    · muix · anyplot.ai`), and axis labels carry units (mm, g).
  weaknesses:
  - 'Critical overlap in BOTH renders: the vertical y-axis title ''Weight (g)'' is
    centered on the full axis span (43.0-50.5) and lands directly on top of the ''46.5''
    tick label, visually merging the two — the tick value and part of the axis-title
    lettering are unreadable at that intersection. Root cause is that the axis title
    has no horizontal offset from the tick-label column. Fix by increasing the gap
    between the rotated axis label and the tick labels (e.g. raise margin.left further
    and/or set an explicit offset on the yAxis label so it clears the tick-label text
    at every position along the axis).'
  - The density legend's three middle swatches carry no label at all (only the top
    'Highest' and bottom 'Lowest' rows are captioned) — an approximate fraction or
    level number on the middle rows would remove ambiguity about how many discrete
    levels exist and where the current gradient sits.
  - The subtitle promises 'two production batches' but the two clusters overlap almost
    completely into one elongated blob in the contours — the two-batch story isn't
    actually visible in the chart. Consider separating the batch means further or
    adding a light annotation/second color cue so the density plot itself communicates
    the two-cluster structure it claims to reveal.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold title "Bearing QC: Diameter vs. Weight · contour-density · javascript · muix · anyplot.ai" (~80% of canvas width, fits without clipping) plus an italic subtitle, both in dark ink, clearly readable. X-axis "Outer Diameter (mm)" and tick labels (23.5-24.9) are clean and legible. The y-axis tick labels (43.0-50.5) are legible EXCEPT the "46.5" label, which is directly overlapped by the rotated y-axis title "Weight (g)" (the axis title is vertically centered on the whole axis and its middle glyphs land exactly on top of that tick number) — both the tick value and part of the axis-title text are unreadable at that specific spot. Everything else is clean.
      Data: Gray sampled scatter points (n=1,400) with five nested contour lines ramping from teal/green (outer, lowest density) to indigo/blue (inner, highest density) — matches the Imprint sequential ramp, first-series green intact. A discrete legend ("KDE density", Highest/Lowest labeled swatches) sits to the right of the plot.
      Legibility verdict: FAIL (the axis-title/tick-label overlap at "46.5" makes that value unreadable; every other text element is fine).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle in light ink, clearly readable against the dark background. Axis tick labels light gray and legible, again EXCEPT the same "46.5" position, where the light-colored rotated "Weight (g)" title overlaps the tick number identically to the light render — same defect, same location, confirming it is a layout issue independent of theme.
      Data: Identical contour colors (teal-to-indigo ramp) and identical gray scatter points as the light render — confirms data colors are theme-invariant; only chrome (background/text) flipped correctly. No dark-on-dark or light-on-light failures elsewhere.
      Legibility verdict: FAIL (same axis-title/tick-label collision as the light render; no other legibility issues, no dark-on-dark text).
