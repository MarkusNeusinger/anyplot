review:
  strengths:
  - Critical VQ-02 defect from Attempt 1 (rotated "Weight (g)" y-axis title overlapping
    the "46.5" tick label) is fully fixed in both renders — verified pixel-crop of
    the left axis shows clean separation at every tick position.
  - 'The "two production batches" story promised by the subtitle is now visually legible:
    the batch means were separated further apart, so the density contours show two
    clearly distinct, well-separated clusters instead of one merged blob.'
  - Density legend now labels all five levels (Highest, ~65%, ~46%, ~28%, Lowest)
    instead of only the two endpoints, removing the prior ambiguity on the middle
    rows.
  - 'Genuinely sophisticated composition: a real 2D KDE evaluated on a grid, contour
    vertices extracted via a from-scratch marching-squares implementation (with saddle-case
    resolution), drawn through MUI X''s documented useXScale/useYScale composition
    hooks over a ScatterChart — the correct community pattern for a chart type MUI
    X has no native primitive for.'
  - Imprint sequential ramp (t.seq[0] green -> t.seq[1] blue) correctly applied to
    the single-polarity continuous density data, pixel-identical between light and
    dark renders; deterministic seeded LCG data; explicit font sizing throughout;
    clean imports.
  weaknesses:
  - 'Design Excellence is solid but not top-tier: grid/legend styling reads as well-executed
    rather than exceptional — a subtle annotation identifying the two batches (e.g.
    small "Batch A"/"Batch B" labels near each cluster) would push Data Storytelling
    further since the legend only encodes density, not batch identity.'
  - The file carries a larger-than-typical amount of helper-function structure (KDE
    grid, marching-squares extractor, color mixing) versus a flat Import -> Data ->
    Plot script — justified here by the from-scratch contour implementation MUI X
    community lacks natively, but still worth noting for CQ-01.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark-ink title "Bearing QC: Diameter vs. Weight · contour-density · javascript · muix · anyplot.ai" (auto-scaled to ~18px given its 82-char length, comfortably fits without clipping) plus an italic dark-ink subtitle "Contours trace KDE density across two production batches (n = 1,400 parts)". X-axis "Outer Diameter (mm)" with ticks 23.5-25.0, Y-axis "Weight (g)" with ticks 43.0-51.0, both dark ink, clearly legible. Verified via pixel crop: the rotated y-axis title no longer overlaps any tick label (the Attempt 1 "46.5" collision is fixed — margin.left increased to 150 and tickFontSize widened to 46 to clear the offset). Grid lines are thin and subtle.
      Data: Gray semi-transparent sampled scatter (n=1,400, two clusters visible) underneath five nested contour lines ramping green -> blue (outer/lowest -> inner/highest density), matching the Imprint sequential ramp (t.seq[0] -> t.seq[1]). Two distinct, well-separated density clusters are clearly visible (batch A lower-left, batch B upper-right), correctly telling the "two production batches" story from the subtitle. A "KDE density" legend at the right labels all five levels: Highest, ~65%, ~46%, ~28%, Lowest.
      Legibility verdict: PASS — all text readable, no overlaps, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle rendered in light ink, clearly readable against the dark background. Axis labels and tick labels in light ink, same layout as light render — the y-axis title/tick-label clearance holds identically in this theme (confirmed via pixel crop, no dark-on-dark collision). Grid lines subtle but visible.
      Data: Data colors (green -> blue contour ramp, gray scatter dots) are pixel-identical to the light render — only the chrome (background, text, grid) flipped, exactly as required. The brand green end of the ramp is still clearly visible against the dark surface.
      Legibility verdict: PASS — no dark-on-dark text anywhere; all chrome elements correctly threaded through theme tokens.
