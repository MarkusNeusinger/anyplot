review:
  strengths:
  - Real Gaussian KDE with per-axis Silverman bandwidths on a 70 × 70 grid, contoured
    by marching triangles. Contours sit on the data's own axes, nest cleanly, and
    give each of the two batches its own set of rings, with no islands around single
    points and no merging of the two clusters.
  - The contour layer is a custom child component that reads the chart's coordinate
    system through useXScale/useYScale. Composing a layer inside ScatterChart this
    way is the native MUI X idiom, and the contours stay aligned with the axes and
    grid.
  - Density is encoded twice, by color along the sequential Imprint ramp (t.seq) and
    by stroke width rising toward the peak. A matching legend titled 'Density contours'
    lists the levels as a share of peak, so the direction of rising density is unambiguous.
  - The scatter overlay is small (3 px), faint (alpha 0.3) and drawn in the inkSoft
    token at exact values, so the contours stay the main signal in both themes.
  - 'Plausible bearing-QC scenario: an on-spec batch and a batch that drifted high
    on both dimensions, with correlated diameter and weight. The units are realistic,
    and the subtitle states n, the bandwidths and the grid resolution.'
  - All chrome is threaded from ANYPLOT_TOKENS (pageBg, ink, inkSoft, grid). Both
    themes are correct, the contour colors are identical across themes, and skipAnimation
    and disableVoronoi are set.
  weaknesses:
  - 'Suggestion: the 12 % padding on the y axis leaves an empty band above 50.5 g
    and below 44 g. A slightly smaller PAD_SHARE would give the two clusters more
    of the canvas.'
  - 'Suggestion: the 28 % and 46 % levels are close in hue on the teal part of the
    ramp. Spacing the colors by perceived lightness rather than by linear RGB interpolation
    would make adjacent rings easier to tell apart by color alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, #FAF8F1. Not pure white.
      Chrome: The bold title 'Bearing QC · contour-density · javascript · muix · anyplot.ai' spans about 55 % of the width. Below it, a grey subtitle reads 'n = 1,400 · Gaussian KDE, Silverman bandwidths 0.084 and 0.37 · 70 × 70 grid'. The axis titles are 'Outer diameter (mm)' and 'Weight (g)'. Tick labels at 0.1 mm and 0.5 g steps are dark grey and readable. The grey grid in both directions is subtle but visible. A right-hand legend titled 'Density contours' lists 85/65/46/28/12 % of peak with line swatches of matching width and color. All text is readable.
      Data: About 1,400 faint grey points (alpha 0.3) form two correlated clusters: one around (23.92 mm, 45.6 g) and one around (24.58 mm, 48.4 g). Five contour levels run along the sequential Imprint ramp from green #009E73 (12 %, thin) through teal to blue (85 %, thick). The lower-left cluster shows all five rings. The upper-right cluster, the smaller batch, reaches up to the 46 % ring. The rings are nested and smooth, and each cluster has its own set.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, #1A1A17. Not pure black.
      Chrome: The title and axis titles are near-white. The subtitle, tick labels and legend entries are light grey. The grid is a subtle light grey. There is no dark-on-dark text anywhere.
      Data: The contour colors and stroke widths are identical to the light render: the same green-to-blue ramp. The scatter points switch to the light inkSoft token and stay faint, and the contours remain the dominant signal. Brand green on the outer rings is clearly visible.
      Legibility verdict: PASS
