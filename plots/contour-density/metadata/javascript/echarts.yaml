review:
  strengths:
  - Custom marching-triangles contour extraction correctly implements density contours
    natively unavailable in ECharts, showing genuine library creativity to overcome
    the missing built-in contour chart type
  - Density-based line-width scaling (thicker at higher density levels) combined with
    the imprint_seq colormap on the contour visualMap communicates density gradients
    clearly and correctly
  - 'Clear comparative storytelling: the tight, high-density ''morning rush'' cluster
    and the broader, lower-density ''afternoon work'' cluster are immediately distinguishable
    via the shared color/width mapping'
  - Both light and dark renders are fully readable with no dark-on-dark or light-on-light
    failures; data colors (scatter muted underlay + imprint_seq contour gradient)
    are identical across themes; background and chrome are theme-correct
  - Deterministic fixed-seed LCG data generation ensures reproducibility
  weaknesses:
  - Scatter underlay markers (symbolSize=5, opacity=0.35) blend into solid patches
    at the dense cluster cores, losing individual-point visibility where the contour
    lines already carry the density signal — a touch larger or a slightly higher opacity
    at the low-density fringe would help without competing with the contours
  - The KDE/RNG/marching-triangles helper functions move away from a strict flat KISS
    script, though this is justified since ECharts has no native contour chart type
    and the algorithm has to be implemented by hand
  - The contour-drawing approach (lines series + visualMap) is a workable generic
    technique rather than one of ECharts' hallmark distinctive features (e.g. a custom
    series renderer) — a `custom` series with a render function would showcase more
    ECharts-specific capability
  - Only two clusters are shown; a third overlapping or skewed cluster would exercise
    more edge-case contour behavior (e.g. merging contours, saddle points) for fuller
    feature coverage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "contour-density · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible and not clipped. Axis titles "Arrival Time (hour of day)" and "Dwell Time (minutes)" in dark ink, tick labels in a softer grey — all clearly legible against the light background. Continuous legend on the right reads "High density" (top) / "Low density" (bottom) in soft grey text, positioned close to the plot with no isolation.
      Data: Two clusters of raw scatter points rendered in a muted grey underlay (context layer), overlaid with KDE contour rings colored via the imprint_seq gradient (brand green → blue), line width increasing with density level. The tight bottom-left cluster ("morning rush") reaches the darkest blue/densest rings; the broader top-right cluster ("afternoon work") stays mostly in the green/teal range, correctly showing it is comparatively less dense. No red-green-only encoding, colors are the Imprint sequential colormap.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles and tick labels have flipped to light-colored text (light ink / soft light grey), fully readable against the dark background — no dark-on-dark failures observed. Legend text is light grey and legible. Axis lines are a muted grey, subtle but visible.
      Data: Identical scatter and contour colors to the light render (muted grey underlay points, imprint_seq green→blue contour gradient with matching line-width scaling) — confirming only the chrome flipped between themes, not the data-ink.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no overlap, no clipping at canvas edges.
