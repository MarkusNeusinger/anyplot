review:
  strengths:
  - Creative from-scratch marching-squares contour renderer built purely on Chart.js's
    mixed scatter+line dataset types — genuine library mastery since Chart.js has
    no native contour chart type and the alternative would have been NOT_FEASIBLE
  - Correct Imprint imprint_seq continuous colormap (green→blue) applied across the
    5 density levels, matching the spec's requirement that 'multiple contour levels
    show density gradients'
  - Deterministic, seeded LCG + Box-Muller data generation — fully reproducible with
    no external RNG dependency
  - Realistic, neutral bivariate scenario (reactor temperature vs. pressure across
    two operating modes) that naturally produces a bimodal density surface, showcasing
    exactly what a density-contour plot is for
  - Theme-adaptive chrome correctly threaded through title, subtitle, axis titles,
    ticks, and grid — both renders are clean and the data colors (scatter + contour
    gradient) are pixel-identical between light and dark
  - 'Correct mandated title format and full mount-node contract compliance (animation:
    false, single canvas append, no fixed sizing)'
  weaknesses:
  - 'No density-scale legend/colorbar: the subtitle explains direction ("light green
    → blue") but a viewer cannot map a specific contour to an exact density percentage
    — add a compact colorbar or level labels to reach publication polish'
  - The two operating-mode clusters are visually distinguishable via the contours
    but are never called out (the code's own comments say 'stable operation' / 'high-load
    operation') — a callout/annotation naming the two modes would turn 'visible' into
    'told' and raise data storytelling
  - Raw scatter points use pointRadius 2.5 with ~0.25 alpha, which is slightly on
    the faint side for 1100 points — nudging alpha to ~0.35 or radius to ~3 would
    keep the raw texture legible without competing with the contour lines
  - The from-scratch marching-squares implementation is necessarily helper-function-heavy
    (lcg, gaussian, edgeInterp, marchingSquares, hexToRgb, lerpColor); the complexity
    is justified by the algorithm but grouping the geometry helpers into one clearly
    delimited block (or a short header comment marking the section) would improve
    scanability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (not pure white, not dark).
      Chrome: Title "contour-density · javascript · chartjs · anyplot.ai" centered at top in dark ink; subtitle "Contours light green → blue as point density rises" below it in secondary gray. Axis titles "Reactor Temperature (°C)" (x) and "Reactor Pressure (bar)" (y) are descriptive with units. Tick labels and subtle gridlines on both axes are all clearly visible against the light background.
      Data: ~1100 semi-transparent gray scatter points (muted ink-soft tone) form the raw-data context layer, revealing two overlapping clusters — one centered near 70°C/4.3 bar, one near 86°C/6.1 bar. Five nested contour lines per cluster follow a green-to-blue gradient (outer = lightest green, inner = most blue), correctly using the Imprint imprint_seq sequential colormap for the continuous density signal.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (not pure black, not light).
      Chrome: Same title/subtitle now rendered in light text (white/light-gray), axis titles and tick labels also light-colored and fully legible against the dark background — no dark-on-dark failures observed. Gridlines are faint light lines, still visible but subtle, matching the light render's grid role.
      Data: Scatter points and the green→blue contour gradient are visually identical in hue/position to the light render — confirms only chrome (background, text, grid) flips between themes while the 5 contour levels' colors stay fixed.
      Legibility verdict: PASS — no dark-on-dark or unreadable text found.
