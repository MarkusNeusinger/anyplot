review:
  strengths:
  - Uses the Imprint sequential colormap imprint_seq for the filled density bands,
    identical in both themes
  - Seaborn's native kdeplot color bar (cbar=True, cbar_kws) relabelled to low/high
    so it says which way density rises without meaningless raw density numbers
  - Filled bands and contour lines share the same 10 KDE levels, so each cluster sits
    inside its own nested rings
  - Faint, small scatter overlay at the exact values keeps the contours the main signal
  - Exact 3200x1800 canvas and a clean data block that reads only df and the column
    constants
  weaknesses:
  - 'VQ-06, DQ-02 (both): the axes are titled ''X Variable (units)'' and ''Y Variable
    (units)'', placeholders that name no quantity and no unit, so the density story
    has no real-world context → a concrete neutral bivariate scenario with real quantities
    and units, e.g. ''Height (cm)'' vs ''Weight (kg)'' or ''Temperature (°C)'' vs
    ''Pressure (hPa)'' as the spec''s Data example suggests, with the data scaled
    to match. Likely cause: the column constants X and Y keep the template placeholder
    names.'
  - 'Suggestion: the two cluster cores reach almost the same blue, so the larger cluster''s
    higher peak is hard to read; more levels near the top (e.g. levels as quantiles
    weighted toward high density) would separate the peaks.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas
      Chrome: title "contour-density · python · seaborn · anyplot.ai" in dark ink (12 pt, ~48% of width), axis titles "X Variable (units)" / "Y Variable (units)" at 10 pt, gray 8 pt ticks, subtle horizontal grid, L-shaped spines; color bar on the right titled "Relative density" with "low"/"high" end labels; all readable
      Data: 10 filled KDE bands in imprint_seq (brand green #009E73 outer -> blue #4467A3 core) at alpha 0.85, thin dark-gray contour lines on the same levels, 450 small faint gray scatter points; two clusters (around 5,5 and 9,8), each inside its own nested rings, a few tail points outside every contour
      Legibility verdict: PASS

