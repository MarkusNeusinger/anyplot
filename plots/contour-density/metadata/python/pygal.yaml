review:
  strengths:
  - Gaussian KDE on per-axis standardised scales with a narrow bandwidth (bw_method=0.32)
    keeps the three housing segments as separate peaks with their own inner rings,
    while the outer rings still show how the starter and mid-range segments connect
  - 'Six iso-density levels drawn as stacked translucent fills in discrete imprint_seq
    steps (#009E73 to #4467A3), so the bands deepen toward each peak and the innermost
    rings carry the strongest color'
  - Scatter overlay of all 400 sales as small faint INK_SOFT points at their exact
    values keeps the contours the main signal and lets the reader check them against
    the data
  - Legend labels give each level as a share of peak density and mark the outer and
    inner ends, so the direction density rises is stated
  - Uses pygal's allow_interruptions with (None, None) breaks to draw every ring of
    a level in one series, plus value_formatter / x_value_formatter for $k / $M and
    thousands-separated ticks
  - 'Theme tokens threaded through Style: warm page backgrounds, INK/INK_SOFT chrome
    and 15% rule guides read cleanly in both renders'
  - Contours come from contourpy on a grid padded 12% past the data, so every ring
    closes inside the plot
  - 'Library-native interactivity: the HTML version gives hover tooltips on each observation
    and each level'
  weaknesses:
  - 'VQ-03 (both): the six legend swatches all carry the single-layer 17% fill, so
    they read as near-identical pale tints (and in the dark render the 62% and 80%
    boxes nearly vanish into #1A1A17, only their outline visible), while the plot
    shows the stacked bands deepening to dark teal/blue → swatches whose fill steps
    visibly from light to strong like the bands they explain (for example a higher
    fill-opacity on the legend boxes only). Likely cause: Style opacity=0.17 applied
    unchanged to the legend rects.'
  - 'CQ-04 (code): lines 81-83 interpolate the imprint_seq hex stops by hand (parsing
    hex pairs and mixing RGB channels) → `matplotlib.colors.LinearSegmentedColormap.from_list("imprint_seq",
    [SEQ_LOW, SEQ_HIGH])` with `matplotlib.colors.to_hex(cmap(t))` per level. Likely
    cause: the gradient written out instead of using matplotlib''s non-plotting color
    utilities.'
  - 'Suggestion: a little more space between each legend swatch and its label text
    would make the bottom legend read less cramped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "contour-density · python · pygal · anyplot.ai" centered in dark ink (~56% of width); y-axis "Sale price (USD)" with $100k–$1.1M ticks, x-axis "Living area (sq ft)" with 800–4,000 ticks; subtle light grid on both axes; 6-entry legend in 3 columns at the bottom. All text dark and readable.
      Data: three density clusters (starter ~1,200 sq ft/$250k, mid ~2,000/$450k, premium ~3,200/$750k) shown as nested filled contours stepping from brand green #009E73 outlines (outer 8% level) to blue #4467A3 (inner 80% level); stacked translucent fills deepen toward each peak. 400 small faint grey points overlay at their exact values. The starter and mid clusters share the outer rings and have separate inner rings; the premium cluster has its own 8%/18% rings.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, all clearly readable; grid subtle; legend text light. No dark-on-dark text.
      Data: same contour line colors and level steps as the light render (green to blue), fills translucent over the dark page so the bands read as dark green-teal deepening inward; scatter points light grey and faint. Data colors identical to light; only chrome flips. Legend swatches for the 62%/80% levels are nearly the page color, visible mainly by their outline.
      Legibility verdict: PASS
