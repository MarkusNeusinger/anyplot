review:
  strengths:
  - Nested, filled KDE contours in the imprint_seq ramp (green outer → blue inner)
    at low opacity, so the bands deepen towards each peak, and the levels stay distinguishable
    in both themes
  - Each of the three housing segments sits inside its own set of rings; the bandwidth
    (0.32 on standardised axes) keeps the clusters apart without breaking into islands
  - The scatter overlay is small, faint and neutral grey at the exact values, so the
    contours stay the main signal
  - pygal XY with allow_interruptions=True and (None, None) separators draws every
    ring of a level as one series with fill=True; per-series stroke=False/dots_size
    and an inline CSS rule style the overlay
  - Legend labels state the density share and which way density rises (outer/inner);
    value formatters give readable $k/$M and comma ticks
  - Theme tokens are threaded through Style, and both renders are theme-correct
  weaknesses:
  - 'CQ-04 (code): lines 66–114 write out a ~48-line marching-squares contour tracer
    (edge interpolation, saddle handling, ring chaining) → `contourpy.contour_generator(x=gx,
    y=gy, z=density).lines(level)` (contourpy, matplotlib''s non-plotting contour
    engine, installed with matplotlib) returns the same closed rings per level in
    a few lines. Likely cause: a hand-rolled iso-line extraction instead of the installed
    contour generator.'
  - 'Suggestion: the 8 % outer ring merges the mid-range and premium segments through
    a thin neck around 2,600 sq ft; a slightly higher outermost level would keep the
    premium cluster''s rings visually separate.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
      Chrome: dark-ink title "contour-density · python · pygal · anyplot.ai" (~56% width), axis titles "Living area (sq ft)" / "Sale price (USD)", comma and $k/$M ticks, subtle grid, 3-column bottom legend of six density levels marked outer/inner. All readable.
      Data: six nested filled KDE contours from #009E73 (outer, 8% of peak) to #4467A3 (inner, 80%) at low opacity, deepening towards the peaks; three housing segments with their own rings; ~400 small faint grey points at exact values.
