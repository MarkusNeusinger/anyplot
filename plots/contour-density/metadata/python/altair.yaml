review:
  strengths:
  - 'imprint_seq two-stop range #009E73→#4467A3 with blue at the highest density,
    per the altair prompt''s continuous-color pattern'
  - 'Theme tokens thread through title, axis, tick and legend colors: chrome is correct
    and readable in both renders'
  - KDE via scipy gaussian_kde with a smoothing that keeps the three climate clusters
    apart without islands
  - Pads the vl-convert PNG to the canonical 3200x1800 canvas without cropping
  weaknesses:
  - 'SC-01, SC-02 (both): the density is drawn as a continuous 80x80 binned heatmap
    with no contour lines or contour bands, so there are no nested rings around each
    cluster (C1) and no discrete density levels (C2) → draw contours of the KDE: compute
    iso-lines or filled level bands (e.g. matplotlib.contour/contourpy levels on z)
    and render them as mark_line paths or mark_geoshape polygons, 6-8 levels in imprint_seq
    steps. Likely cause: mark_rect over the raw grid instead of contour levels.'
  - 'VQ-02 (both): the legend title ''Density'' sits on the legend frame''s top-left
    stroke and ''0.0010'' touches its right edge → give the legend padding of about
    8 px or drop the frame. Likely cause: alt.Legend fillColor/strokeColor without
    padding.'
  - 'VQ-03 (both): hairline seams between the rect cells draw a visible lattice over
    the density field (light lines on the light render, dark on the dark) → seamless
    cells. Likely cause: mark_rect cells sized by bin step with antialiased edges;
    set mark_rect(strokeWidth=0) and x2/y2 cell edges, or replace the rects with contour
    bands.'
  - 'VQ-05 (both): every bin edge carries a tick and the labels land on non-round
    values (2.7, 5.3, 8.0 … on x; −6, 0, 6, 11, 17 … on y) → round ticks every 5 °C
    / 10 % without minor ticks. Likely cause: alt.Bin(step=...) on the axes drives
    the ticks; use x/x2 on unbinned fields with axis values or tickCount on a plain
    quantitative scale.'
  - 'DQ-03 (both): the humidity axis runs from −6 % to 105 %, outside the physical
    0–100 % range → clamp the y domain to 0–100 (−6 / +5 points). Likely cause: GRID_MARGIN
    extending the grid 10 % beyond the data without bounds.'
  - 'CQ-04 (code): IMPRINT_PALETTE on line 31 is defined and never used → delete it.
    Likely cause: leftover template constant.'
  - 'Suggestion: a faint scatter overlay of the 500 points (Notes allow it) would
    let the contours be checked against the data.'
