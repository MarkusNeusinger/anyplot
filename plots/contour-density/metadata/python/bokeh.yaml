review:
  strengths:
  - Native Bokeh 3 p.contour(...) ContourRenderer draws the KDE iso-lines directly
    from the grid, and construct_color_bar() builds a matching contour colour bar
    that states which way density rises.
  - 'scipy.stats.gaussian_kde with the default bandwidth fits the data: two clusters
    keep their own nested ring sets, the outer rings merge them, and no islands form
    around single points.'
  - Contour levels in discrete steps of imprint_seq (green low to blue high), identical
    in both themes; theme tokens threaded through every text and axis element.
  - Scatter overlay as small faint points at exact values, behind the contours, so
    the contours stay the main signal.
  weaknesses:
  - 'DQ-02 (both): the variables are labelled "Measurement A (units)" and "Measurement
    B (units)", abstract labels with no scenario → name a real bivariate pair from
    the spec''s examples (e.g. "Height (cm)" / "Weight (kg)" with matching cluster
    means). Likely cause: the MEASUREMENT_A / MEASUREMENT_B constants.'
  - 'VQ-06 (both): the axis titles carry the placeholder "(units)" instead of a unit
    → descriptive titles with real units. Likely cause: the MEASUREMENT_A / MEASUREMENT_B
    constant strings.'
  - 'Suggestion: a HoverTool on the scatter points would add value inspection to the
    HTML view.'
  - 'Suggestion: the unused ELEVATED_BG token could be dropped.'
