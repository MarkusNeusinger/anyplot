review:
  strengths:
  - Uses bokeh 3's native contour renderer (p.contour on the KDE grid) and contours.construct_color_bar(),
    so the color bar's level samples are generated from the same renderer as the rings,
    not a hand-built legend
  - Density computed with scipy.stats.gaussian_kde and normalised to a peak of 1;
    the color bar title 'Relative density (peak = 1)' and %.2f level labels state
    plainly which way density rises
  - Two height/weight groups each sit inside their own nested rings, with a visible
    saddle between them; the smoothing keeps both peaks apart without islands around
    single points
  - Scatter overlay drawn as small, faint INK_MUTED points (size 9, alpha 0.35) behind
    the contours, so the rings stay the main signal and can be checked against the
    points
  - Contour colors step through imprint_seq from brand green (lowest level) to blue
    (highest), identical in both renders; chrome flips cleanly through the theme tokens
  - Uses ColumnDataSource built from the tidy df and the column-name constants for
    axis titles, per the adaptable-code layout
  weaknesses:
  - 'Suggestion: a HoverTool on the scatter overlay showing height and weight would
    add value in the HTML detail view.'
  - 'Suggestion: a thin rule or slightly wider padding between the plot area and the
    color bar would separate the level legend more clearly from the data region.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and border; no outline frame, subtle grid at ~10 % ink.
      Chrome: bold title "contour-density · python · bokeh · anyplot.ai" top-left (~50 % width); italic axis titles "Height (cm)" and "Weight (kg)"; tick labels 150–200 and 40–100 in INK_SOFT; color bar on the right with level samples 0.11–0.89 and the rotated title "Relative density (peak = 1)". All text dark on light and readable.
      Data: eight KDE contour lines stepping from brand green #009E73 (outermost, 0.11) to blue #4467A3 (innermost, 0.89); two nested ring sets, a higher peak near (162 cm, 62 kg) and a second near (177 cm, 81 kg), joined by a saddle; ~500 faint gray points behind the rings, with tail points outside the outermost ring.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; grid faint but visible.
      Chrome: title, axis titles, tick labels and color bar labels in light ink tokens; no dark-on-dark text anywhere.
      Data: contour colors identical to the light render (green outer → blue inner); scatter points in the lighter muted ink, faint but visible; brand green outer ring reads well.
      Legibility verdict: PASS
