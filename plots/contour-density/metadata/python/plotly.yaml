review:
  strengths:
  - Native go.Contour with coloring='fill' and explicit start/end/size draws 12 nested
    density levels from a scipy gaussian_kde on a grid padded by 10 % of the data
    range, so the outer rings close inside the frame and the two concentrations (about
    160 cm / 62 kg and 178 cm / 74 kg) each sit inside their own set of rings
  - 'imprint_seq (brand green to blue) with a transparent floor below 4 % relative
    density: empty space stays the page color and the strongest blue marks the peak,
    identical in both themes'
  - Contour separators drawn in the page color (cream lines on light, near-black on
    dark) keep the adjacent, similar-hued bands distinguishable in both renders
  - Colorbar titled 'Relative density (peak = 1)' on the elevated surface states which
    way density rises; density normalised to the peak makes the scale read 0–1 on
    any units
  - 'Scatter overlay at exact values as 4 px points at 30 % ink opacity: the contours
    stay the main signal and sparse tail points outside every contour remain checkable'
  - 'Library-native interactivity: hovertemplates report relative density on the contour
    and the exact height/weight on each point in the HTML output'
  - 'All chrome threads the theme tokens: title, axis titles, ticks, colorbar text
    and grid are readable on #FAF8F1 and #1A1A17'
  weaknesses:
  - 'Suggestion: the data block generates three groups, but clusters 2 (175 cm / 80
    kg) and 3 (180 cm / 70 kg) overlap so far that the KDE shows only two peaks; moving
    the third group further apart would make the third concentration readable as its
    own set of rings.'
  - 'Suggestion: the top colorbar tick label ''1'' sits just below the two-line colorbar
    title; a few pixels more spacing (colorbar title side or ypad) would let it breathe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area; colorbar on a slightly lighter elevated box with an INK_SOFT border.
