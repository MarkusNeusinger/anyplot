review:
  strengths:
  - Uses plotly's native go.Histogram2dContour, which computes the density surface
    from the raw points inside the trace — no hand-rolled estimation code
  - 'Filled contours on the Imprint sequential ramp (brand green → #4467A3) with the
    strongest blue at the two density peaks, and a colorbar that states which way
    density rises'
  - Contour separators drawn in the page color (white on light, near-black on dark)
    keep the bands distinguishable in both themes
  - Faint 4 px scatter overlay at alpha 0.30 sits at the exact values, so the contours
    stay the main signal and the tail points remain checkable
  - The lowest band fades into the page, so empty space stays background and the cluster
    outlines read cleanly
  - Theme tokens threaded through title, axes, ticks, grid and an elevated colorbar
    panel; both renders fully legible
  - Hover templates with units on both the density surface and the measurements for
    the HTML view
  weaknesses:
  - 'SC-02 (both): the surface is a 2D histogram (go.Histogram2dContour bin counts)
    rather than the kernel density estimate the Notes name, and its binning leaves
    a small detached island ring around (175 cm, 82 kg) next to the main peak → a
    smooth KDE surface (scipy.stats.gaussian_kde evaluated on a grid and drawn with
    go.Contour, or a coarser/smoothed binning) with nested rings and no islands. Likely
    cause: go.Histogram2dContour with default nbinsx/nbinsy.'
  - 'VQ-06 (both): the colorbar is titled ''Density'' but its ticks (0–35) are raw
    points-per-bin counts with no unit → either label it ''Points per bin'' or plot
    a true density. Likely cause: colorbar title text with histogram-count z values.'
  - 'Suggestion: the gap between the title and the plot area is generous; trimming
    the top margin slightly would give the contours more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area.
      Chrome: centered title "contour-density · python · plotly · anyplot.ai" in dark ink (~38% of width); axis titles "Height (cm)" and "Weight (kg)" in dark ink; tick labels 140–200 and 40–100 in INK_SOFT; subtle grid; colorbar "Density" (0–35) in an elevated off-white panel with an ink-soft border. All text readable.
      Data: filled density contours from brand green #009E73 (outer band) to blue #4467A3 at the peaks, separated by white page-colored contour lines; two main concentrations (around 157 cm / 62 kg and 177 cm / 72 kg) with a small detached ring near 175 cm / 82 kg; ~500 faint dark-gray scatter points overlaid, sparse tail points outside the contours.
      Legibility verdict: PASS

