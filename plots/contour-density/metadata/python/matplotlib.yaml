review:
  strengths:
  - Filled KDE bands from scipy.stats.gaussian_kde (bw_method=0.3) keep the two geyser
    clusters in separate nested ring sets without breaking into islands around single
    points, matching the spec's smoothing characteristic.
  - imprint_seq bands with a per-band alpha ramp (0.45 to 1.0) make the densest band
    both the strongest color and the most opaque, so density rises unmistakably toward
    the blue core in both themes.
  - Page-colored contour lines drawn over the filled bands separate adjacent levels
    crisply on either background, and cbar.add_lines(rings) repeats those separators
    on the color bar.
  - The color bar reads in % of peak via PercentFormatter, with a reader-facing label,
    no outline and zero-length ticks, so the 10%-100% scale is immediately interpretable.
  - The scatter overlay is small (s=5), faint (alpha 0.4) and drawn in the theme ink
    at exact values, so the points remain checkable against the contours without competing
    with them.
  - Theme tokens are threaded through title, labels, ticks, spines and colorbar; both
    renders are fully legible and the data colors are identical across themes.
  weaknesses:
  - 'Suggestion: a light outermost contour line (e.g. at 5% of peak) could hint at
    where the sparse tails begin without filling them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across figure and axes.
      Chrome: bold title "contour-density · python · matplotlib · anyplot.ai" (~58% width) in dark ink; axis labels "Eruption duration (min)" and "Waiting time to next eruption (min)" in dark ink; tick labels in INK_SOFT; L-shaped spines; no grid. Right-side color bar "Point density (% of peak)" from 10% to 100% in 10% steps. All text readable; nothing clipped.
      Data: two filled density clusters (short eruptions ~2 min / ~52 min wait, long eruptions ~4.3 min / ~80 min wait) in imprint_seq bands from brand green #009E73 (mint at reduced alpha on the outside) to blue #4467A3 at the long-cluster peak; thin cream separator rings between bands; ~450 small dark faint points overlaid, a few tail points outside every contour.
