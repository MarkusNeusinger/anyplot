review:
  strengths:
  - Native geom_density_2d with stat_density_2d(levels=12) computes the KDE and draws
    twelve nested contour levels; each of the three clusters sits inside its own set
    of rings and the bridging saddles between them stay visible
  - 'Smoothing fits the data: no islands around single points, and the three clusters
    of different size and spread stay separate'
  - Scatter overlay drawn as small faint INK_SOFT points (alpha 0.15) at their exact
    values, so the contours remain the main signal in both themes
  - 'Canonical 3200x1800 canvas and the full mandated title, with theme tokens threaded
    through every chrome element; data color #009E73 identical in both renders'
  - Short, linear, seeded script with the axis titles taken from the column constants
  weaknesses:
  - 'DE-02 (both): all four panel spines are drawn as a closed box where nothing in
    a density contour plot requires an enclosed frame → L-shaped frame (left and bottom)
    or none. Likely cause: panel_border=element_rect(color=INK_SOFT, fill=None).'
  - 'DQ-02 (both): the scenario reads as generic: ''Temperature (°C)'' against ''Pressure
    (kPa)'' names no process or system the three clusters belong to → name the concrete
    source, e.g. ''Reactor temperature (°C)'' / ''Vessel pressure (kPa)''. Likely
    cause: the TEMPERATURE and PRESSURE column constants.'
  - 'Suggestion: varying the contour weight or alpha by level would make the density
    gradient readable at a glance without a color channel.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on canvas and panel; 3200x1800 landscape
      Chrome: title "contour-density · python · plotnine · anyplot.ai" in dark INK, ~55% of the width; axis titles "Temperature (°C)" and "Pressure (kPa)" in dark ink, tick labels (25/50/75, 20-80) in INK_SOFT; very faint grid; closed INK_SOFT panel border on all four sides
      Data: twelve #009E73 density contour lines forming three nested ring systems (large cluster near 50 °C/44 kPa, tighter one near 75/70, small one near 30/76) joined by outer saddle contours; ~600 faint grey points at alpha 0.15; outer contours cut at the panel edge
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 on canvas and panel
      Chrome: title and axis titles in light #F0EFE8, ticks in light grey #B8B7B0, light panel border; no dark-on-dark text
      Data: same #009E73 contours as the light render; points in light grey at the same alpha, faint but visible
      Legibility verdict: PASS
