    1.3, alpha = 0.35 -- a slightly lower alpha (~0.15-0.2) in the densest core would
    further sharpen individual-point resolution without losing the overlay's value
  - Design Excellence is solid but not exceptional -- the two-cluster composition
    is clean and correctly polished now, but nothing (e.g. a peak-pointing annotation
    or emphasis technique) pushes it beyond "well-executed" into genuinely distinctive
    storytelling territory
