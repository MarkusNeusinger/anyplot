review:
  strengths:
  - Uses the real Old Faithful geyser dataset (base R `faithful`), a textbook-perfect
    real-world showcase for bivariate density contours since the eruption/waiting
    relationship is famously bimodal
  - 'Correct Imprint continuous colormap: `scale_fill_gradient(low = "#009E73", high
    = "#4467A3")` matches `imprint_seq` exactly for this single-polarity density metric'
  - Filled contours (`geom = "polygon"`) plus a low-alpha `geom_point()` overlay give
    density gradient AND raw-data context in one view, exactly matching the spec's
    optional "combine with scatter overlay" note
  - Both clusters show internal density gradients (green outer rings to blue core),
    clearly conveying "inner = higher density" as required by the spec
  - Clean theme-token setup (PAGE_BG/INK/INK_SOFT) correctly threaded through plot/panel
    background, grid, axis text, and legend across both themes
  - 'KISS code structure: no functions, explicit font sizes, `set.seed(42)`, correct
    `ragg::agg_png` save at the mandated 8×4.5in/400dpi landscape canvas'
  weaknesses:
  - 'Both renders show a wedge-shaped gap/notch cut into the outermost contour band
    of the smaller (left) cluster, around eruption_duration≈1.7-1.9, waiting_time≈62-66
    — the filled density polygon fails to close there and the plot background shows
    through, in the identical spot in both light and dark PNGs. Likely cause: `stat_density_2d(...,
    bins = 9)` computing shared absolute density breaks across a strongly bimodal
    2D KDE, so the sparser cluster''s outer isoband self-intersects near its boundary.
    Fix: increase the KDE grid resolution (`n = 200` or higher inside `stat_density_2d`),
    or switch `contour_var` to `"ndensity"`, or reduce `bins` to force fewer/simpler
    nested isobands so both clusters get clean, closed outer polygons.'
  - 'Design Excellence is solid but not exceptional: the gradient fill and point overlay
    show clear intent, but nothing (e.g. direct density-peak annotation, subtitle
    framing the bimodality insight) pushes it into publication-tier territory — the
    polygon-closure glitch above also reads as unpolished.'
  - '`geom_point()` uses a fixed size/alpha (1.1 / 0.25) regardless of local density;
    with ~272 points this is workable but slightly small/faint over the light-green
    outer bands — a touch more opacity or size would keep the scatter overlay legible
    without competing with the contour fill.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Old Faithful Eruptions · contour-density · r · ggplot2 · anyplot.ai" in bold dark ink, fully visible, not clipped. Axis titles "Eruption Duration (min)" and "Waiting Time to Next Eruption (min)" in dark ink, tick labels in a softer dark-gray ink. Legend "Density" with numeric stops (0.005-0.020) rendered as a vertical color-bar-style discrete legend, fully visible near the right edge. Grid lines are faint, subtle, visible without competing with data.
      Data: Two filled density contour "islands" (bimodal clusters) using a green (#009E73) to blue (#4467A3) gradient — outer rings green (low density), inner core blue (high density). Raw data points overlaid in dark ink at low alpha, visible as small dots on top of and around the filled contours; some isolated low-density points render as unfilled gray dots outside the contour islands (expected — they fall below the lowest computed density level).
      Legibility verdict: PASS — all text is clearly readable against the light background. One visual defect (not a text-legibility issue): a small wedge-shaped notch is cut into the outer green band of the smaller cluster near eruption≈1.7-1.9, waiting≈62-66, exposing the page background through the polygon.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles rendered in light ink (near-white), tick labels in a softer light-gray ink — all clearly legible against the dark background, no dark-on-dark failures observed. Grid lines faint but visible. Legend "Density" text and numeric stops fully legible in light ink.
      Data: Same two-cluster green-to-blue filled density contours as the light render — colors are pixel-identical to the light version (only chrome flipped). The raw-data point overlay now renders in light ink (INK flips to #F0EFE8 for dark theme), appearing as small pale dots on top of the colored contours — clearly distinguishable from the dark background and from the fill colors.
      Legibility verdict: PASS — no dark-on-dark text failures; brand green and blue read identically to the light render. Same notch/gap artifact present at the identical location as the light render, confirming it is a genuine density-polygon rendering issue rather than a compression artifact.
