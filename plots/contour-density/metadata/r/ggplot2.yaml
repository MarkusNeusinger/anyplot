    context, matching the spec's optional scatter-overlay note
  - Theme-adaptive chrome (background, ink, grid, legend) correctly threaded through
    both renders; canvas size gate passed (3200x1800)
  - Well-documented padding rationale (25% scale-range padding) explaining why the
    KDE grid needs slack beyond the raw data range for both clusters to close
