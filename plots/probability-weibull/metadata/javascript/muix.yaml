review:
  strengths:
  - 'Correct Weibull probability paper: ChartsContainer x axis uses scaleType "log"
    and the y axis is the linearized ln(-ln(1-F)) scale with tickInterval/valueFormatter
    mapping back to readable percentage ticks (1%…99%, including 63.2%)'
  - Median-rank plotting positions (i-0.3)/(n+0.4) with Johnson adjusted ranks for
    the suspensions, a proper treatment of right-censored data rather than simply
    dropping it
  - Rank-regression fit gives beta ≈ 2.09 and eta ≈ 453 kcycles; the dashed fit line
    visibly crosses the 63.2% ChartsReferenceLine at about 450 kcycles, so the annotated
    values agree with the line
  - Censored observations are hollow Imprint-green rings against filled failures,
    and the difference reads clearly in both themes
  - Composes the chart from ChartsContainer + LinePlot + ChartsReferenceLine + ChartsGrid
    and draws the markers through useXScale/useYScale/useDrawingArea, so marks sit
    exactly at their data values
  - 'Fully theme-token driven: fit line in ink, reference line in inkSoft, callout
    on elevatedBg, so both renders are legible with identical data colours'
  - Deterministic LCG-generated turbine-blade fatigue data (24 units, 4 suspensions)
    in a realistic kcycle range
  weaknesses:
  - 'VQ-05 (both): the log x axis uses 50-kcycle linear tick steps, so the labels
    bunch together on the right ("750 800 850 900" sit about 10–15 px apart and the
    950/1050 ticks carry no label) while the left third has a single "100" label →
    log-friendly ticks (e.g. 100, 150, 200, 300, 500, 700, 1000) with roughly even
    spacing. Likely cause: no tickInterval set on the log x axis, so MUI''s default
    linear-step ticks are used.'
  - 'Suggestion: draw the failures and suspensions as two ScatterPlot series (hollow
    via slotProps/sx) so MUI''s native ChartsLegend and tooltips cover them instead
    of the hand-built HTML legend.'
  - 'Suggestion: anchor the 63.2% callout near the fit/reference-line crossing at
    eta instead of the far right edge so the eye connects the label with the crossing.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1), not pure white.
      Chrome: bold dark title "probability-weibull · javascript · muix · anyplot.ai" top-left; HTML legend top-right (dashed "Fit: β ≈ 2.09, η ≈ 453 kcycles", filled "Failure", hollow "Suspended (censored)"); y-axis "Cumulative Failure Probability (%)" with ticks 1%…99% incl. 63.2%; x-axis "Cycles to Failure (kcycles)" log scale 100–1100 (labels crowd on the right: 750 800 850 900). Subtle grid. All text readable dark-on-light.
      Data: 20 filled #009E73 failure markers and 4 hollow green suspension rings around a black dashed fit line spanning the plot; dotted horizontal reference at 63.2% with a boxed callout "63.2% · η ≈ 453 kcycles" at the right; line crosses the reference near 450.
      Legibility verdict: PASS

