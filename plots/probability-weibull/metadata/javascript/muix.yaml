review:
  strengths:
  - 'Rigorous statistical implementation: logarithmic x-axis, correctly linearized
    Weibull y-axis (ln(-ln(1-F))) with non-uniform probability gridlines (1%..99%),
    and Johnson''s rank-adjustment method combined with Benard''s median-rank approximation
    to correctly handle right-censored observations.'
  - Correct, idiomatic use of MUI X's slots API to render hollow-ring markers for
    censored (suspended) units and filled markers for failures via a custom StatusMarker
    scatter slot component.
  - Fitted regression line with annotated shape (beta) and scale (eta) parameters,
    plus the spec-required 63.2% characteristic-life reference line, both rendered
    with theme-adaptive semantic tokens (ink for the fit line, muted for the reference
    line) instead of spending a categorical hue on non-data elements.
  - Both renders are fully readable, theme-correct, and free of clipping; canvas is
    exactly 3200x1800 with generous, balanced margins.
  - Realistic, neutral reliability-engineering dataset (turbine blade fatigue-life
    test in kcycles) with a sensible mix of failures and suspensions and physically
    plausible beta/eta values.
  weaknesses:
  - Legend swatches for 'Failure' and 'Suspended (censored)' both render as identical
    solid green squares — the hollow-vs-filled encoding used on the actual chart markers
    isn't reflected in the legend, so a reader can't tell the two series apart from
    the legend alone (only from the text labels). Render a custom legend (e.g. via
    ChartsLegend slotProps, or two hand-drawn SVG circles mirroring the on-chart marker
    style) so the swatch shapes match the marker shapes.
  - Scatter markerSize=9 is on the small side for a sparse 24-point dataset — the
    style guide recommends larger, more prominent markers for datasets under 50 points
    (~11-14 would read more confidently at the 3200x1800 canvas size).
  - Overall visual treatment is technically correct but restrained — a single hue
    plus two neutral accent lines. A slightly bolder callout around the eta/characteristic-life
    crossing (e.g. a small elevated box for the '63.2% . eta ~ 453 kcycles' annotation)
    would sharpen the data-storytelling focal point beyond the current thin dashed
    line + text.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "probability-weibull · javascript · muix · anyplot.ai" centered at top; top-right legend with "Failure", "Suspended (censored)" (both green squares) and "Fit: β≈2.09, η≈453 kcycles" (black square swatch); dark axis titles ("Cycles to Failure (thousands)" on x, "Cumulative Failure Probability" rotated on y); dark tick labels on both axes; subtle light-grey gridlines on both axes. All chrome text is dark-on-light and clearly legible, no clipping at any canvas edge.
      Data: Green (#009E73) circular markers — filled for failure observations, hollow rings for censored/suspended units — following a diagonal trend from lower-left to upper-right on a log-x / linearized-Weibull-y grid. A black dashed fitted line runs through the point cloud with annotated β and η in the legend. A grey dashed horizontal reference line marks the 63.2% cumulative-probability level, labeled "63.2% · η ≈ 453 kcycles" near the right edge, well clear of the canvas border.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, legend, reference-line label) is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same layout as the light render, but title, axis titles, tick labels, and legend text are rendered in light off-white/grey tones, fully legible against the dark background. Gridlines are faint light lines, still visible but subtle. The fitted-line legend swatch and the fitted line itself switch to white/near-white (theme-adaptive ink), and the 63.2% reference line + label switch to a light grey (theme-adaptive muted token).
      Data: The green (#009E73) markers (filled failure / hollow censored) are pixel-identical in hue and shape to the light render — only the surrounding chrome flipped, confirming the Imprint data color did not change between themes.
      Legibility verdict: PASS — no dark-on-dark failures found; every title, label, tick, and legend entry is clearly visible against the near-black background, and the brand green markers stand out well on the dark surface.
