review:
  strengths:
  - Correctly implements median-rank plotting positions via Johnson's rank-adjustment
    method for censored data (not a naive median-rank shortcut) — a genuinely reliability-engineering-accurate
    technique for handling suspensions.
  - Custom StatusMarker (filled circle for failures, hollow ring for suspensions)
    encodes censoring by shape/fill, not color alone — CVD-safe and matches the hand-rolled
    legend swatches exactly.
  - Reference-line callout at 63.2% cleanly surfaces the fitted characteristic life
    (eta) with a real least-squares fit computed in-code (beta and eta both annotated),
    not hard-coded values.
  - Correct log x-axis and Weibull-linearized y-axis (ln(-ln(1-F))) with percentage
    tick labels — the nonlinear, non-evenly-spaced y-grid is exactly what real Weibull
    probability paper looks like.
  - 'Data colors (brand green #009E73) are identical across light and dark renders;
    only chrome (background, grid, ink, callout box) adapts via ANYPLOT_TOKENS.'
  weaknesses:
  - Grid lines (both axes) are on the more visible side rather than a subtle backdrop
    — could be lightened/thinned slightly for a cleaner probability-paper look without
    losing the reference gridlines' function.
  - A few adjacent points (~250 kcycles and ~380-400 kcycles clusters) sit close enough
    that their 12px markers nearly touch — not a real overlap, but a touch more separation
    or slightly smaller markers in dense clusters would improve individual-point readability.
  - 'LM-02 headroom: the implementation already goes beyond the composable ChartContainer
    API with custom slots and hooks; a further distinctive touch (e.g. a subtle tooltip
    customization visible only in the interactive HTML) would round it out, though
    this is a nice-to-have, not a defect.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "probability-weibull · javascript · muix · anyplot.ai" centered at top; x-axis labeled "Cycles to Failure (thousands)" (log scale, ticks 100/200/300/500/700/1000); y-axis labeled "Cumulative Failure Probability" (rotated, hand-placed) with percentage ticks from 1% to 99% on the Weibull-linearized scale; three-row hand-rolled legend top-right (dashed fit line, filled "Failure" swatch, hollow "Suspended (censored)" swatch); horizontal dotted reference line at 63.2% with an elevated callout box reading "63.2% · η ≈ 453 kcycles". All chrome text renders in dark ink against the light background.
      Data: Brand green (#009E73) filled circles for failures and hollow green rings for censored/suspended units, roughly following a straight dashed fit line across the log-x / linearized-y plot — exactly the expected "straight line on Weibull paper" signature. First/only categorical series correctly uses palette[0].
      Legibility verdict: PASS — title, axis labels, tick labels, legend text, and the reference callout are all clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Identical layout and text content to the light render, now rendered in light ink (title, axis labels, tick labels, legend text, callout text) against the dark background. Grid lines are dim gray, still visible but not dominant.
      Data: Same brand green (#009E73) filled/hollow markers and dashed fit line as the light render — data colors are pixel-identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (including the small legend and callout labels) remains legible against the near-black surface.
