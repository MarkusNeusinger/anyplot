review:
  strengths:
  - 'Correct Weibull probability paper: log-scaled time axis (scaleType ''log'') and
    a linearized ln(-ln(1-F)) y axis with reliability-standard probability ticks (1
    %…99 %, plus 63.2 %) placed via tickInterval and a valueFormatter, so the fit
    is a straight line.'
  - Plotting positions follow the median rank (i-0.3)/(n+0.4) with Johnson's adjusted
    rank for suspensions; the first failure sits at 2.87 % as computed, and the fitted
    beta/eta (2.09 / 453 kcycles) agree with the line, which crosses the 63.2 % reference
    line at about 450 kcycles.
  - Censored observations are hollow brand-green rings against filled failures, clearly
    distinct in both themes; all data colors are identical between renders and chrome
    flips cleanly.
  - 'Uses MUI X v9 composition idiomatically: ChartsContainer with a log x axis, LinePlot
    for the fit, ChartsReferenceLine for the 63.2 % line, ChartsGrid, and the useDrawingArea/useXScale/useYScale
    hooks to draw the point overlay in data coordinates; skipAnimation is set.'
  - Compact header row puts the title on the left and the legend (with the fit's beta
    and eta in the fit entry) on the right, leaving the full height to the plot.
  weaknesses:
  - 'Suggestion: anchor the eta callout at the crossing of the fit line and the 63.2
    % reference line (about 453 kcycles) instead of the right edge, so the characteristic
    life is read where it occurs.'
  - 'Suggestion: the fit line and the reference line are both dashed; a solid fit
    line would separate the model from the reference more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "probability-weibull · javascript · muix · anyplot.ai" top-left (about a third of the width); legend top-right ("Fit: β ≈ 2.09, η ≈ 453 kcycles" dashed line, filled green "Failure", hollow green "Suspended (censored)"); y-axis "Cumulative Failure Probability (%)" with ticks 1 %–99 % plus 63.2 %; x-axis "Cycles to Failure (kcycles)" with log ticks 70–1000; subtle grey grid in both directions. All text dark and readable.
      Data: 20 filled #009E73 failure dots and 4 hollow green censored rings along a dark dashed fit line from ~1.8 % at 65 kcycles to 99 % at ~950; thin dotted 63.2 % reference line with a boxed callout "63.2% · η ≈ 453 kcycles" at the right; fit crosses the reference line near 450 kcycles. Nothing clipped or overlapping.
      Legibility verdict: PASS

