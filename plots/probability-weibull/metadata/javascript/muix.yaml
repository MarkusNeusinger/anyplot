      Background: warm near-black #1A1A17.
      Chrome: title, legend text, axis titles and tick labels all light ink and readable; grid subtle grey; callout box on elevated dark surface with light text. No dark-on-dark text.
      Data: identical #009E73 filled dots and hollow rings at the same positions; fit line flips to light ink as chrome; brand green clearly visible.
