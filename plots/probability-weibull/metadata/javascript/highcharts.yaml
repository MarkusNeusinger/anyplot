review:
  strengths:
  - Correctly implements Johnson's rank-increment median-rank regression, adjusting
    probability estimates for right-censored (suspended) units rather than naive sequential
    ranking — a genuinely advanced reliability-engineering technique.
  - Distinguishes censored (hollow) from failed (filled) points via marker fill, a
    redundant shape encoding that keeps the chart colorblind-safe without relying
    on a second hue.
  - Y-axis uses true Weibull-linearized values (ln(-ln(1-F))) with a custom tickPositions
    + formatter so the axis displays clean probability percentages (1%...99%) while
    the underlying scale stays linear for the fit — correct 'Weibull paper' construction.
  - 63.2% characteristic-life reference line is present with a clear label, and beta/eta
    are both computed via least-squares on the linearized failures and surfaced in
    the subtitle.
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    chrome text readable, and the single brand-green data color is identical across
    themes.'
  weaknesses:
  - X-axis tick labels crowd together near the right edge of the logarithmic scale
    — '180k' and '190k' render with no visible gap between them (log compression packs
    more ticks into the upper decade). Thin the labels above ~100k (e.g. a larger
    tickPixelInterval, explicit tickPositions every 20k only up to 150k then wider
    spacing, or tickAmount) so no two labels touch.
  - Fit-line and reference-line annotations rely entirely on the subtitle and a small
    plotLine label for beta/eta/characteristic-life — consider a lightweight on-chart
    annotation near the fit line itself so the parameters are legible even without
    reading the subtitle.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark.
      Chrome: Title "probability-weibull · javascript · highcharts · anyplot.ai" and subtitle with β/η values are dark ink, clearly readable. X-axis title "Cycles to Failure (log scale)" and y-axis title "Cumulative Failure Probability" are legible secondary-ink text. Tick labels (1%-99% on y, 40k-190k on x) are readable, though the rightmost x tick labels ("180k", "190k") are crowded with no gap. Grid lines are subtle, light gray, not competing with data. Legend at bottom ("Failures", "Suspensions (censored)", "Weibull fit") is fully visible with adequate margin.
      Data: First and only categorical data color is brand green (#009E73) — filled circles for failures, hollow (page-bg fill, green outline) circles for suspensions. Fit line is a dashed ink-colored (theme-neutral) line, appropriate since it's a reference/model line rather than a data category. A horizontal dashed reference line marks 63.2% cumulative probability, labeled "63.2% · η".
      Legibility verdict: PASS (all text readable; only the tick-label crowding at the right edge is a minor legibility concern, not a failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light.
      Chrome: Title and subtitle render in light/off-white ink, clearly legible against the dark background. Axis titles and tick labels use lighter secondary-ink tones and remain fully readable — no dark-on-dark failures observed. Grid lines are subtle light-on-dark, appropriately faint. Legend text is light-colored and readable at the bottom.
      Data: Same brand-green (#009E73) markers and hollow/filled distinction as the light render — confirmed identical data colors, only chrome (background, grid, text) flipped. Fit line switches to a light dashed line (still theme-neutral ink), correctly adapting to the dark surface.
      Legibility verdict: PASS (no dark-on-dark text; same minor x-axis tick crowding issue as light render, not a legibility failure).
