review:
  strengths:
  - X-axis tick-label crowding from attempt 1 ("180k"/"190k" touching) is fully resolved
    — explicit tickPositions now thin the labels above 100k (40k, 60k, 80k, 100k,
    150k), each with a generous visible gap in both renders.
  - Correctly implements Johnson's rank-increment median-rank regression, adjusting
    probability estimates for right-censored (suspended) units rather than naive sequential
    ranking — a genuinely advanced reliability-engineering technique.
  - Distinguishes censored (hollow) from failed (filled) points via marker fill, a
    redundant shape encoding that keeps the chart colorblind-safe without relying
    on a second hue.
  - Y-axis uses true Weibull-linearized values with a custom tickPositions + formatter
    so the axis displays clean probability percentages while the underlying scale
    stays linear for the fit — correct "Weibull paper" construction.
  - 63.2% characteristic-life reference line is present and clearly labeled; beta/eta
    are computed via least-squares on the linearized failures and surfaced in the
    subtitle.
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, all chrome
    text readable, single brand-green data color identical across themes.'
  weaknesses:
  - Fit-line and reference-line annotations still rely entirely on the subtitle and
    a small plotLine label for beta/eta/characteristic-life — a lightweight on-chart
    annotation near the fit line itself would raise Design Excellence further, though
    this is a polish suggestion, not a defect.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "probability-weibull · javascript · highcharts · anyplot.ai" and subtitle "β (shape) = 2.73 · η (scale) = 109,709 cycles — characteristic life at 63.2% cumulative probability" render in dark ink, fully readable. Axis titles ("Cycles to Failure (log scale)", "Cumulative Failure Probability") and both axes' tick labels are legible secondary-ink text. X-axis ticks (40k, 60k, 80k, 100k, 150k) are now evenly spaced with clear gaps — the attempt-1 crowding at the right edge is gone. Grid lines (horizontal and vertical, appropriate for a scatter plot) are subtle but visible.
      Data: Brand-green (#009E73) filled circles for failures, hollow (page-bg fill, green-outlined) circles for suspensions/censored — a shape-redundant encoding, no reliance on color alone. A black dashed Weibull fit line and a black dashed 63.2% reference line (labeled "63.2% · η") complete the picture. Legend at bottom lists all three series correctly.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels all switch to light/off-white ink and remain fully readable — no dark-on-dark failures anywhere. Grid lines are faint and unobtrusive. X-axis tick spacing matches the light render (40k/60k/80k/100k/150k, no crowding).
      Data: Confirmed identical to light render — same brand green (#009E73) for both failure and suspension markers; only chrome (background, grid, text, fit-line/reference-line color) flips to the light-on-dark scheme.
      Legibility verdict: PASS
