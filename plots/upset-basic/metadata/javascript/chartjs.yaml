review:
  strengths:
  - 'Perfectly synchronized triple-canvas layout: the top intersection-cardinality
    bar chart, left set-size bar chart, and dot matrix each reserve pixel-identical
    axis widths/heights (Y_AXIS_RESERVE, X_AXIS_RESERVE, LEFT_LABEL_WIDTH), so all
    three panels line up exactly, including column-to-dot and row-to-label alignment.'
  - 'Verified data-mapping fidelity: re-running the LCG data generation independently
    confirms the rendered bar values (122, 94, 22, 22, 19, 15...) and dot patterns
    (00001, 11110, 00100...) exactly match the chart''s computed intersections, degree
    colors, and connector spans.'
  - 'Genuine data storytelling: the single largest intersection gets a bold outline
    plus an exact-count callout, and bars are colored along the Imprint sequential
    ramp by degree (sets combined), adding a second meaningful data dimension beyond
    bar height.'
  - 'Clean, theme-correct chrome in both renders: light (#FAF8F1) and dark (#1A1A17)
    backgrounds are correct, data colors (green-to-blue degree gradient, brand green
    set-size bars) are identical across themes, and all text is legible.'
  - Realistic, neutral dataset directly reflecting the spec's own suggested use case
    (RNA-seq/ChIP-seq/ATAC-seq/Proteomics/Methylation gene sets), with a correlated
    'activity' latent variable producing plausible, unevenly sized overlaps rather
    than uniform random noise.
  weaknesses:
  - The dot matrix has no on-chart legend distinguishing the large dark 'in intersection'
    dots from the small faint 'not in intersection' dots — a viewer unfamiliar with
    UpSet plots has no explicit cue for this encoding. Add a short caption (e.g. below
    the existing degree-gradient legend in the corner cell) naming the two dot states.
  - Set sizes across the five sets (RNA-seq 172, ChIP-seq 170, ATAC-seq 169, Proteomics
    142, Methylation 130) vary only modestly, so the left 'Set Size' bar panel reads
    as fairly uniform bars. Widening the per-set LCG thresholds slightly would make
    that panel visually earn its place in the story.
  - The corner-cell legend captions ('Bar color = intersection degree', 'sets combined')
    are set at 11-12px, noticeably smaller than the rest of the chrome (13-16px elsewhere)
    — bump them up a point or two for visual consistency.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Bold serif title "upset-basic · javascript · chartjs · anyplot.ai" centered at top, dark ink text. "Intersection Size" y-axis title (top bar chart, 0-140) and "Set Size" x-axis title (left bar chart, reversed 200-0 scale) both dark ink, clearly readable. Set-name row labels (RNA-seq, ChIP-seq, ATAC-seq, Proteomics, Methylation) in dark ink to the right of the horizontal bars. A small corner legend reads "Bar color = intersection degree" with a green-to-blue gradient swatch labeled 1 and 4, and "sets combined" beneath it.
      Data: Left horizontal bars are solid Imprint brand green (#009E73). Top vertical bars are colored along a green-to-blue sequential ramp by intersection degree; the largest bar (Methylation-only, 122 elements) has a black outline and an exact count "122" drawn above it. The dot matrix shows large dark dots for set membership, small faint gray dots for non-membership, and black connector lines joining member dots within each column.
      Legibility verdict: PASS — all titles, axis labels, tick labels, row labels, and legend text are clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Same title, axis titles, row labels, and corner legend, all now rendered in light/off-white ink for contrast against the dark background. Grid lines remain subtle.
      Data: Data colors are identical to the light render — the same brand-green set-size bars, the same green-to-blue degree gradient on the intersection bars (including the "122" count and black-outlined top bar), and the same dot/connector encoding, now rendered with off-white non-member dots and member dots for contrast on dark.
      Legibility verdict: PASS — all text is light-colored against the near-black background with no dark-on-dark failures; tick labels, row labels, and legend captions are all clearly visible.
