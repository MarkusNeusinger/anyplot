review:
  strengths:
  - Faithful multi-panel UpSet composition — horizontal set-size bars, vertical intersection-cardinality
    bars, and a dot-matrix with connector lines, pixel-aligned across three independent
    Chart.js instances via a shared reserve-width technique
  - 'Correct Imprint palette: brand green (#009E73) for the single-series set-size
    bars; continuous imprint_seq gradient correctly used to encode intersection degree'
  - 'Theme-correct chrome in both renders — #FAF8F1/#1A1A17 backgrounds, all text
    and grid tokens flip correctly, data colors identical across themes'
  - 'Realistic, biologically plausible synthetic data: five correlated differential-expression
    assays with Methylation intentionally anti-correlated with the shared activity
    signal'
  - 'Distinctive engineering: afterFit-driven axis-reserve syncing plus mixed line+scatter
    dataset types to draw connector segments — a technique not trivially portable
    to another library'
  - Deterministic seeded LCG for reproducibility; member/non-member dots use redundant
    size+shade encoding, not hue alone
  weaknesses:
  - No legend or caption explains what the intersection-bar color gradient encodes
    (degree) — a first-time viewer cannot decode it without reading the source; add
    a small caption or 2-3-stop mini color-scale near the top-right of the intersection
    panel
  - Mid-range degrees (2, 3, 4) render as visually similar teal/green-blue tones under
    the 2-stop imprint_seq gradient, making exact degree hard to distinguish by color
    alone without the missing legend
  - The empty top-left corner cell (~6% of canvas) is standard for UpSet plots but
    is otherwise wasted space that could host the missing degree-color legend
  - Design polish is technically correct but reads as scientific/utilitarian rather
    than editorial — consider one added touch of visual hierarchy (e.g. highlighting
    or annotating the single largest intersection) to push Data Storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "upset-basic · javascript · chartjs · anyplot.ai" centered at top in dark bold text, clearly readable. "Intersection Size" y-axis title/ticks (top panel) and "Set Size" x-axis title/ticks (left panel, reversed 200→0 scale) and set-name labels (RNA-seq, ChIP-seq, ATAC-seq, Proteomics, Methylation) all render in dark ink/soft-ink tones, fully legible against the light background. Subtle horizontal gridlines visible on the intersection-size axis.
      Data: Left bar chart (set sizes) uses brand green #009E73 throughout. Top bar chart (12 intersections, sorted descending from ~122 to ~5) uses a green-to-blue gradient keyed to intersection degree — single-set bars are green, the 5-way intersection is blue, in-between combinations are teal. Matrix below shows large dark dots for set membership, small faint grey dots for non-membership, connected by bold dark vertical line segments spanning each intersection's member rows.
      Legibility verdict: PASS — no light-on-light text, no clipped or overlapping elements observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, tick labels, and set-name labels now render in light/off-white ink tones (INK / INK_SOFT flipped), fully legible against the dark background. Gridlines are still subtly visible.
      Data: Data colors are identical to the light render — set-size bars still brand green #009E73, intersection bars still the same green-to-blue degree gradient. Matrix dots flip to light/near-white fills (member dots bright white, non-member dots soft grey) with white connector lines, correctly contrasting against the dark surface.
      Legibility verdict: PASS — no dark-on-dark text, all chrome and data elements clearly distinguishable from the background.

    Both renders confirm data colors (brand green, and the imprint_seq degree gradient) are pixel-identical between themes; only background, text, grid, and dot fill/connector colors flip as expected.
