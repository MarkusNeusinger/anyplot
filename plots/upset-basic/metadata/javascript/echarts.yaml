review:
  strengths:
  - 'Correct multi-grid ECharts composition (topBar, leftBar, matrix grids) reproduces
    the canonical UpSet layout exactly: horizontal set-size bars on the left, vertical
    intersection-size bars on top, dot matrix with connecting lines in between.'
  - Degree-based sequential color gradient on the intersection bars is a genuine value-add
    matching the spec's suggestion to 'distinguish intersection degree' — interpolates
    between the two imprint_seq stops.
  - Custom `renderItem` series for the connecting lines and membership dots is the
    idiomatic ECharts approach given there is no native UpSet chart type; filled vs.
    open circle convention faithfully reproduces canonical UpSet plots.
  - Fully deterministic, reproducible data generation via a seeded LCG; clean, dependency-free,
    KISS top-level script structure.
  - Theme-adaptive chrome correctly implemented — data colors (green bars, sequential
    gradient) are identical between light and dark renders, only chrome (background,
    ink, grid) flips, and both renders pass the legibility check.
  weaknesses:
  - No legend or annotation explains the intersection-degree color gradient on the
    top bars (bright green for degree-1 intersections fading to teal for degree-5)
    — a viewer can't decode what the color encodes without reading the source. Add
    a small discrete color-scale legend or an inline annotation labeled 'Intersection
    degree'.
  - Design relies almost entirely on default token styling with little additional
    polish (no secondary visual hierarchy beyond sort order, no supporting annotations)
    — functional but plain; a touch more refinement (e.g. highlighting the top intersection,
    subtle spacing/typography tweaks) would raise it from competent to distinctive.
  - Grid layout uses hard-coded pixel offsets (left/right/top/bottom in the grid array)
    rather than ECharts' containLabel/percentage sizing — acceptable for this fixed-size
    render harness, but less robust/idiomatic than a self-adjusting layout.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matching the light-theme spec.
      Chrome: Title "upset-basic · javascript · echarts · anyplot.ai" is centered at the top in dark ink, clearly legible. The rotated "Intersection size" axis label on the far left and the "Set size" axis label at the bottom-left are both dark, readable text. Tick labels (0-500 on the intersection axis; 1,200/600/0 on the set-size axis; Email/App/Loyalty/Social/Newsletter row labels) are all rendered in a softer ink tone with clear contrast against the light background.
      Data: Twelve intersection bars across the top, sorted descending by size, colored on a green-to-teal sequential gradient keyed to intersection degree (single-set intersections are bright #009E73 green, higher-degree intersections shift toward teal). Five horizontal set-size bars on the left are solid brand green. The dot matrix below uses solid black-ink filled circles for set membership and open (white-fill, gray-stroke) circles for non-membership, connected by black vertical lines where an intersection spans multiple sets.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the dark-theme spec.
      Chrome: Same title, axis labels, and tick labels are now rendered in light ink tones, clearly legible against the dark background. Grid lines remain subtle but visible.
      Data: The intersection bars and set-size bars use the identical green-to-teal gradient and brand-green fill as the light render — confirmed unchanged. The membership dots flip from black-ink fill/stroke to a light off-white fill/stroke (theme-adaptive ink token), while still following the same filled-vs-open convention and connecting-line pattern as the light render.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed (no black-on-black text or elements).
