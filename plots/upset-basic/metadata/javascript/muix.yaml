review:
  strengths:
  - 'Genuinely faithful UpSet plot construction: horizontal set-size bars, vertical
    intersection-size bars, and a dot matrix with connecting lines are laid out in
    a coordinated 2x2 grid with shared TOP_MARGIN/LEFT_MARGIN so dots stay pixel-aligned
    under their bars.'
  - 'Degree-based color gradient (Imprint imprint_seq: brand green to blue) is correctly
    implemented and verified pixel-accurate against the intended interpolation formula,
    with an explanatory ''Degree'' legend key that addresses the prior review''s SC-04
    feedback.'
  - 'Theme-adaptive chrome is correct in both renders, first series is #009E73, intersections
    sorted by descending size, and the genomics dataset (decreasing per-assay hit
    rates) produces a realistic long-tail distribution of intersection sizes.'
  - Alternating row banding aids matrix row-tracking, and data generation uses a deterministic
    seeded LCG.
  weaknesses:
  - 'Overlap bug: the rotated ''Intersection size'' y-axis title text directly crosses
    through the ''300'', ''400'', and ''500'' tick number labels on the top bar chart
    in BOTH light and dark renders (confirmed via pixel inspection at plot-light.png/plot-dark.png
    around x=480-650, y=500-600). Increase TOP_MARGIN.left or add axis label spacing
    so the rotated label clears the tick text.'
  - 'Dead code: the ChartsReferenceLine mean-value marker (dashed line + ''Mean: XX''
    label) added in the previous repair round does not render at all in either theme
    -- a full-region pixel scan of the top bar chart area found zero dashed-line pixels
    or ''Mean'' text anywhere. Either fix the ChartsReferenceLine configuration (check
    axis-id binding and that it is supported nested inside <BarChart> for the installed
    @mui/x-charts version) so it actually displays, or remove it to avoid shipping
    non-functional code.'
  - 'Minor: no alternative degree-based sort mode is offered (the spec lists it as
    an alternative to size-sort), though a single static view is acceptable for this
    library.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Bold centered title "upset-basic · javascript · muix · anyplot.ai" in dark ink. "Intersection size" (rotated) and "Set size" axis labels, tick labels, and annotation text ("2,000 genes / 6 assays · top 15 of 57 intersections", "Degree" legend) all render in dark/soft-grey ink and are legible against the light background. DEFECT: the rotated "Intersection size" axis title overlaps and crosses through the "300", "400", and "500" tick number labels -- confirmed by pixel inspection, not just visual impression.
      Data: Vertical intersection-size bars and horizontal set-size bars use brand green (#009E73). Dot-matrix markers use a green-to-blue sequential ramp (imprint_seq) keyed to intersection degree -- pixel-verified to match the intended mixHex interpolation. Inactive dots are muted grey, connecting lines align exactly under their bars/dots.
      Legibility verdict: PASS overall (all text discernible), but the axis-title/tick-label overlap noted above is a real defect, not a false alarm.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/off-white, fully legible against the dark background; row bands switch to dark-grey shading; annotation text renders in light grey. The SAME "Intersection size" / "300"/"400"/"500" overlap defect is present identically in this render (verified via matching pixel crop).
      Data: Brand-green bars and the degree color ramp are pixel-identical to the light render -- only chrome flipped, no theme-adaptation failures.
      Legibility verdict: PASS overall, no dark-on-dark failures, but same overlap defect as light render.

    Additional pixel-level check: scanned the full top bar chart region (x=500-3190, y=180-820) in both renders for the ChartsReferenceLine mean marker (dashed line + "Mean: XX" label) that the source code adds. No dashed-line pixels or "Mean" text were found anywhere -- the reference line does not render in either theme.
