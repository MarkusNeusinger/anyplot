review:
  strengths:
  - 'Alignment discipline: TOP_MARGIN and LEFT_MARGIN are shared between the two BarCharts
    and the raw-SVG matrix, so dots line up exactly under the intersection bars and
    beside the set-size bars'
  - Deterministic, realistic genomics dataset (RNA-seq/ChIP-seq/ATAC-seq/Proteomics/Methylation/CRISPR
    with decreasing per-assay hit rates) produces a plausible non-degenerate size/degree
    distribution instead of uniform noise
  - 'Theme-correct rendering: backgrounds, alternating row bands, and all text flip
    cleanly between light and dark while every data color (brand-green bars, degree
    color ramp) stays byte-identical'
  - Respects the community-only constraint by combining two @mui/x-charts BarCharts
    with a hand-rolled SVG matrix instead of reaching for an out-of-scope library
    or a fake UpSet component, while still delivering the full matrix + dual-bar layout
  weaknesses:
  - The degree-based dot/line color ramp (single-set green -> multi-set blue-green)
    has no legend or key, so a reader can't decode what the subtle color shift between
    columns actually encodes
  - Inactive-set dots (r=4) are noticeably smaller than the review target for sparse
    data (15 columns x 6 rows); bumping to ~r=5-6 would read more confidently as deliberate
    'off' markers rather than stray dots
  - Library mastery is fairly generic (labelStyle/tickLabelStyle/sx overrides) - no
    use of MUI X features like a ChartsReferenceLine or richer legend/tooltip configuration
    that would showcase deeper community-surface capability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Bold centered title "upset-basic · javascript · muix · anyplot.ai" in dark ink; "Intersection size" and "Set size" axis labels and tick labels rendered in dark/soft-grey ink; alternating tan/cream row bands behind the dot matrix aid row tracking; small annotation text ("2,000 genes / 6 assays · top 15 of 57 intersections") in soft grey. All chrome text is clearly readable against the light background.
      Data: Vertical intersection-size bars and horizontal set-size bars both use brand green (#009E73); dot-matrix markers use a green-to-teal ramp keyed to intersection degree, with inactive dots in muted grey. Connecting lines are visible and align exactly under their respective bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/off-white, fully legible against the dark background; alternating row bands switch to dark-grey shades; annotation text renders in light grey. No dark-on-dark or light-on-light failures observed.
      Data: Bar colors and the degree color ramp are pixel-identical to the light render — only the chrome (background, bands, text) flipped, as required.
      Legibility verdict: PASS
