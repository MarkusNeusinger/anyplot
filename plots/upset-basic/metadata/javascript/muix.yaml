review:
  strengths:
  - The dot matrix is drawn in a ChartsContainer that shares band axes with both BarCharts
    (useXScale/useYScale hooks), so every matrix column sits exactly under its intersection
    bar and every row beside its set-size bar in both renders
  - Intersections are computed as exact set combinations from the element-level data
    and sorted by size descending with degree as tie-break; bars rise from zero against
    labelled count axes
  - Participating dots are filled and joined by a 4 px line in the degree color; non-member
    dots stay present as small muted inkSoft circles, distinguishable in both themes
  - 'Degree shading uses steps of the Imprint sequential ramp (seq[0] to seq[1]) in
    natural order, with a compact degree key; chrome flips cleanly between #FAF8F1
    and #1A1A17'
  - Alternating subtle row bands across the matrix make it easy to trace each set
    row to its set-size bar; a subtitle states 2,000 genes, 6 assays and that the
    15 largest of 57 intersections are shown
  - Realistic genomics scenario (RNA-seq, ChIP-seq, ATAC-seq, Proteomics, Methylation,
    CRISPR screen) with a seeded LCG, deterministic output
  weaknesses:
  - 'Suggestion: the empty upper-left corner above the set-size bars could hold the
    degree key closer to the matrix, or the set-size panel could be narrowed to give
    the matrix more width.'
  - 'Suggestion: count labels on top of the intersection bars would let readers read
    the small tail values without the axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold title "upset-basic · javascript · muix · anyplot.ai" top-left with a grey subtitle "2,000 genes across 6 assays · the 15 largest of 57 intersections, sorted by size"; top panel y-axis "Genes per intersection" with ticks 0-700 and subtle horizontal grid; left panel set names (RNA-seq, ChIP-seq, ATAC-seq, Proteomics, Methylation, CRISPR screen) and x-axis "Genes per assay" 0-1,500; "Intersection degree" key with 1/2/3 swatches. All text dark and readable.
      Data: 15 intersection bars in #009E73 sorted descending (~665 down to ~25), six horizontal set-size bars in #009E73 (RNA-seq ~1,170 largest), dot matrix with filled member dots joined by vertical lines colored by degree (green 1, teal 2, blue 3) and muted grey non-member dots, alternating light row bands. Columns align with bars, rows with set bars.
