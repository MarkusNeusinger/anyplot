review:
  strengths:
  - 'Correct, idiomatic UpSet plot structure: horizontal set-size bars, vertical intersection-cardinality
    bars, and a dot-matrix with connecting lines, matching the UpSet convention precisely.'
  - Sets are sorted by size (descending) and intersections are sorted by count (descending),
    exactly matching the spec's default sort requirement.
  - Degree-based color legend (continuous gradient with '1 set' / '3 sets' endpoints)
    adds real analytical value beyond a flat single-color bar chart.
  - Both light and dark renders are fully legible with no clipping; theme tokens (background,
    ink, grid, palette[0]) are threaded through correctly.
  - Realistic, neutral bug-tracking dataset (Crash, UI/UX, Performance, Security,
    Data Loss, Compatibility) with element/set counts inside the spec's ranges.
  - Alternating row stripes and generous margins keep the dense 6-row x 18-column
    matrix readable.
  weaknesses:
  - Matrix dots and connecting lines are built with imperative forEach + append calls
    rather than D3's idiomatic .data().join() binding pattern — functionally correct
    but doesn't showcase D3's core data-binding paradigm.
  - Design excellence is solid but not exceptional — the layout and legend are competent
    rather than visually striking; consider a bolder focal treatment for the top 2-3
    intersections to sharpen the storytelling.
  - Minor tick-label size mismatch between the 'Set Size' axis (12px) and 'Intersection
    Size' axis (13px) — negligible but worth aligning.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the spec target exactly.
      Chrome: Title "upset-basic · javascript · d3 · anyplot.ai" is bold, centered, dark ink, fully within bounds. Row labels (Crash, UI/UX, Performance, Security, Data Loss, Compatibility) are dark and legible on the left. Axis labels "Set Size" and "Intersection Size" and their tick numbers are soft dark gray, all readable. Degree-color legend top right ("1 set" / "3 sets" with a green-to-blue gradient bar and "Intersection degree" caption) is fully visible, not clipped.
      Data: First categorical series (horizontal set-size bars) uses Imprint green #009E73. Vertical intersection bars are colored by degree along a green→teal→blue sequential gradient. Filled black dots + connecting lines in the matrix show set membership per intersection; hollow dots with light gray outlines show non-membership. Alternating light row stripes aid matrix readability.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the spec target exactly.
      Chrome: Title, row labels, axis labels, and tick numbers all render in light/soft-white ink and are clearly legible against the dark background. No dark-on-dark failures observed. The degree-color legend text and gradient remain fully visible.
      Data: Data colors are identical to the light render — same green #009E73 set-size bars, same green→teal→blue degree gradient for intersection bars. Filled dots switch to an off-white fill and connecting lines to off-white (chrome-appropriate), while hollow dot outlines use the dark-theme grid tone — only chrome adapts, not the categorical/sequential data colors.
      Legibility verdict: PASS — all text and matrix elements are clearly readable against the dark background.
