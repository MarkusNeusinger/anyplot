review:
  strengths:
  - Highcharts has no native UpSet series; composing three separately-instantiated
    charts (column, bar, scatter+line) with matching pixel margins into one aligned
    matrix is a clever, correctly-executed solution
  - Degree-based color gradient on the intersection bars (built from t.seq[0]-t.seq[1],
    i.e. imprint_seq) is a correct, on-brand implementation of the spec's optional
    'shading by degree' suggestion
  - Data generation uses two correlated biological signatures (activePromoter, chromatinLoop)
    rather than flat independent draws, producing realistic, sizeable, varied overlaps
    (degrees 1 through 4 all represented)
  - 'Both renders are fully theme-correct: identical data colors, correctly flipped
    chrome, no legibility failures in either theme'
  - MUTED background dots vs. NEUTRAL connector dots/lines is a correct, deliberate
    use of the two theme-adaptive semantic anchors rather than arbitrary custom hexes
  weaknesses:
  - The top-bar color gradient (green to blue, encoding intersection degree) has no
    legend or scale explaining what it means - a first-time reader can't decode it
    without reading the tooltip or code. Add a small color-scale/legend annotation
    near the top panel.
  - The x-axis tick labels under the matrix ('1, 1, 1, 3, 2, 2, 2, 1, 1, 4, 2, 2')
    repeat non-monotonically and could read as a broken/duplicated numeric axis rather
    than a per-column degree indicator. Consider removing this row or styling it as
    an annotation strip instead of xAxis.categories.
  - WGBS (the smallest set, 98 elements) never appears as a filled dot in any of the
    top-12 shown intersections - its entire matrix row is all background dots. Consider
    tuning the correlated-signal probabilities so every set participates in at least
    one visible intersection.
  - Several small helper functions (makeLCG, hexToRgb, lerpColor, degreeColor, makeDiv)
    are used; justified here given three-instance composition and reproducible-RNG
    needs, but it's a step away from the flat Imports -> Data -> Plot -> Save KISS
    baseline other JS snippets follow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "upset-basic · javascript · highcharts · anyplot.ai" in bold dark text top-left; subtitle in muted grey below it; axis titles "Set size", "Intersection size", "Sets per intersection" all dark-ink/soft-ink readable; all tick labels (set names, numeric ticks, degree numbers) and data labels (392, 379, ... , 70, 60, ...) readable against the light background.
      Data: Top bar chart uses a green-to-blue sequential gradient (imprint_seq) encoding intersection degree; left bar chart and matrix connector dots/lines use the theme-adaptive NEUTRAL (ink) color; background matrix dots use the theme-adaptive MUTED color. First/largest bars are #009E73-family green as expected.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title/subtitle/axis-title/tick-label/data-label elements, all flipped to light-colored text, clearly legible against the dark background. Checked title, both axis titles per panel, all six set-name row labels, all tick labels, and all data-value labels individually - no dark-on-dark failures found.
      Data: Top-bar gradient colors are pixel-identical to the light render (confirmed green-to-blue imprint_seq unchanged). Left bars and matrix connectors flip from black to off-white as expected; background dots flip to the dark-theme MUTED hex.
      Legibility verdict: PASS
