review:
  strengths:
  - 'The degree color gradient on the top bars is now decoded by a compact swatch
    legend ("Degree: 1 set / 2 sets / 3 sets / 4 sets") placed in the top panel''s
    own margin, fully resolving the prior attempt''s unexplained-gradient weakness'
  - 'Removing the non-monotonic per-column tick-label row under the matrix (now `labels:
    { enabled: false }` with a documented rationale comment) eliminates the broken-axis
    misread while keeping the descriptive "Sets per intersection" axis title'
  - WGBS (the smallest set) now appears as a filled dot in one of the top-12 shown
    intersections, giving full six-set feature coverage in the displayed data
  - Highcharts has no native UpSet series; composing three separately-instantiated
    charts (column, bar, scatter+line) with matching pixel margins into one aligned
    matrix remains a clever, correctly-executed solution
  - 'Both renders are fully theme-correct: identical data colors (degree gradient,
    set-size bars), correctly flipped chrome, no legibility failures in either theme'
  - Data generation uses two correlated biological signatures rather than flat independent
    draws, producing realistic, varied overlaps across degrees 1 through 4
  weaknesses:
  - Several small helper functions (makeLCG, hexToRgb, lerpColor, degreeColor, makeDiv)
    remain in use; justified given the three-instance composition and reproducible-RNG
    needs, but it is a step away from the flattest KISS baseline other JS snippets
    follow
  - The new degree legend text is quite small (12px) and sits close to the top-right
    canvas edge; still fully legible in both renders, but there is little margin for
    a lower-resolution export before it starts to crowd the edge
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "upset-basic · javascript · highcharts · anyplot.ai" in bold dark text top-left; subtitle in muted grey below it ("Top 12 of 62 observed intersections among 774 genes across 6 assays, sorted by size"). Axis titles ("Set size", "Intersection size", "Sets per intersection"), tick labels, data labels, and the new "Degree: 1 set / 2 sets / 3 sets / 4 sets" swatch legend (top-right) are all dark-on-light and clearly readable. No light-on-light failures observed.
      Data: Top vertical bar chart shows intersection cardinality (67 down to 19), bars colored on a green→blue sequential gradient keyed to intersection degree (1 to 4 sets), matching the new legend exactly. Left horizontal bars show set sizes in solid ink-black, sorted largest-first (RNA-seq 392 → WGBS 146). The 6×12 dot matrix shows grey background dots with filled black dots connected by black vertical lines indicating set membership per intersection; WGBS now has a filled dot in column 11, confirming full six-set coverage in the displayed intersections. First categorical/brand color (#009E73) appears on the degree-1 bars as expected.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title, subtitle, axis titles, tick labels, data labels, and degree legend, all flipped to light-colored text on the dark background. No dark-on-dark failures observed — every text element (title, subtitle, both axis titles per panel, all six set-name row labels, tick labels, data-value labels, legend text) was checked individually and reads clearly.
      Data: The green→blue degree gradient on the top bars is pixel-identical to the light render, confirming the data-color palette does not shift with theme. Left bars and matrix dots/connectors flip from black to off-white, matching the theme-adaptive chrome contract. WGBS's filled dot in column 11 is visible against the dark background.
      Legibility verdict: PASS
