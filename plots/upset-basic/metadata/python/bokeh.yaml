review:
  strengths:
  - 'Complete UpSet layout: intersection bars, dot matrix and set-size bars aligned
    through shared Range1d objects, so the panels also pan and zoom together in the
    HTML output'
  - 'Membership reads at a glance in both themes: filled #009E73 dots joined by 10px
    connectors against hollow, muted non-member dots'
  - Intersections computed with Counter(memberships).most_common(MAX_INTERSECTIONS)
    from a tidy element/sets table, so the counts fall out of the data
  - 'Theme tokens threaded through every chrome element; both renders fully legible
    with correct #FAF8F1 / #1A1A17 surfaces'
  weaknesses:
  - 'VQ-01 (both): tick labels at 28pt and axis titles at 34pt sit below the bokeh
    reference of 34pt / 42pt and read small beside the 50pt title → 34pt ticks (+6pt)
    and 42pt axis titles (+8pt). Likely cause: major_label_text_font_size=''28pt''
    and axis_label_text_font_size=''34pt'' on p_bar and p_sets.'
  - 'DQ-01 (both): all 12 shown intersections have degree 1 or 2, so no column shows
    a combination of three or more sets → generate memberships where at least one
    3-set intersection ranks among the 12 largest. Likely cause: independent membership
    draws with probabilities 0.21-0.38.'
  - 'DQ-02 (both): the sets are labelled Exp A-Exp F, which reads generic → name the
    experiments by condition (e.g. ''Heat Shock'', ''Hypoxia'', ''Drought''). Likely
    cause: the experiments list.'
  - 'Suggestion: a HoverTool on bars and dots could show the exact set combination
    and count in the HTML view.'
  - 'Suggestion: shading the matrix dots or bars by intersection degree, as the Notes
    allow, would separate the single-set columns from the pairs.'
