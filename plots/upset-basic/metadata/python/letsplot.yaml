      Data: Top: 12 intersection bars sorted descending (101 to 33), degree 1 #009E73, degree 2 #C475FD, degree 3 #4467A3, thin white outlines; the bars are shifted left of the matrix columns (bar 0 at ~14 % of the width, column 0 at ~38 %). Bottom left: green set-size bars aligned with the matrix rows. Bottom right: green filled dots joined by green segments, light grey muted dots.
      Legibility verdict: PASS

