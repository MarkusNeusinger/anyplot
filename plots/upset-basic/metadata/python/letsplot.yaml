review:
  strengths:
  - ggbunch composes intersection bars, set-size bars and dot matrix on one 3200x1800
    canvas with shared y-limits, so the set-size bars line up with their matrix rows,
    and the matrix repeats the set names
  - Theme tokens reach every chrome element; muted dots use a theme-specific INACTIVE
    color that stays visible but clearly secondary in both renders
  - Intersections sorted by size descending; the legend lists only the degrees actually
    drawn
  - Neutral, plausible user-acquisition-channel scenario, seeded and reproducible,
    with native HTML export
  weaknesses:
  - 'SC-02 (both): the intersection bars do not sit above their matrix columns: bar
    0 is at about 14 % of the width while matrix column 0 is at about 38 % (C1) →
    give the top panel the matrix panel''s horizontal region and plot width (offset
    about 24 % of the width, target 0). Likely cause: the ggbunch region (0, 0, 1.0,
    top_h) for p_top against (left_w, top_h, 1 - left_w, …) for p_matrix.'
  - 'VQ-07 (both): a pure-white #FFFFFF frame about 5 px wide surrounds the canvas,
    glaring on the #1A1A17 dark render → fill the whole canvas with PAGE_BG. Likely
    cause: the ggbunch figure''s own background is never themed.'
  - 'VQ-07 (both): intersection degree (1, 2, 3), an ordered count, takes the unrelated
    categorical hues #009E73, #C475FD, #4467A3, hiding its order → discrete steps
    of the imprint_seq marks ramp in degree order, with the theme''s stops. Likely
    cause: degree_palette indexes IMPRINT_PALETTE by degree.'
  - 'DE-02 (both): every panel is enclosed by all four borders against the style guide''s
    spine rule → an L-shaped frame (left and bottom) or none. Likely cause: panel_border
    not blanked, with axis_line drawn on top.'
  - 'CQ-04 (code): line 81 counts each set''s members with a per-set lambda over df[SETS],
    which df[SETS].explode().value_counts() replaces, and line 70 df.dropna(subset=[SETS])
    is dead after the empty-tuple filter → use explode().value_counts() and delete
    line 70. Likely cause: hand-rolled counting.'
  - 'Suggestion: the 0-11 index ticks under the matrix carry no information a reader
    needs and could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 in all three panels; a pure-white frame about 5 px wide runs around the canvas edge.
