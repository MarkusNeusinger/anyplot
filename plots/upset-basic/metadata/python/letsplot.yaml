review:
  strengths:
  - ggbunch composes intersection bars, set-size bars and dot matrix on one 3200x1800
    canvas with shared y-limits, so set-size bars line up with their matrix rows
  - Theme tokens reach every chrome element; muted dots use a theme-specific INACTIVE
    color that stays visible but clearly secondary in both renders
  - Intersections sorted by size descending, colored by degree from the Imprint palette
    in canonical order, with the legend listing only the degrees actually drawn
  - Neutral, plausible user-acquisition-channel scenario, seeded and reproducible
  - Native HTML export alongside the PNG
  weaknesses:
  - 'SC-02 (both): the intersection bars do not sit above their matrix columns: the
    top panel spans the full canvas width, so bar 0 is at about 14 % of the width
    while matrix column 0 is at about 38 %, breaking the spec''s bar-to-column alignment
    (C1) → give the top panel the matrix panel''s horizontal region and plot width
    so each bar lines up with its column (offset now about 24 % of the width, target
    0). Likely cause: the ggbunch region (0, 0, 1.0, top_h) for p_top against (left_w,
    top_h, 1 - left_w, …) for p_matrix, plus differing y-axis label widths in the
    two panels.'
  - 'VQ-07 (both): a pure-white #FFFFFF frame about 5 px wide surrounds the canvas,
    glaring on the #1A1A17 dark render → fill the whole canvas with PAGE_BG. Likely
    cause: the ggbunch figure''s own background is never themed; only the sub-plots
    carry plot_background.'
  - 'DE-02 (both): every panel is enclosed by all four borders although nothing in
    an UpSet layout requires them → an L-shaped frame (left and bottom) or none. Likely
    cause: the panel border of the default theme is not blanked (panel_border=element_blank()),
    with axis_line drawn on top.'
  - 'CQ-04 (code): line 81 counts each set''s members with a per-set lambda over df[SETS],
    which df[SETS].explode().value_counts() replaces, and line 70 df.dropna(subset=[SETS])
    is dead after the empty-tuple filter on line 67 → use explode().value_counts()
    and delete line 70. Likely cause: hand-rolled counting.'
  - 'Suggestion: the 0-11 index ticks under the matrix carry no information a reader
    needs and could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 in all three panels; a pure-white frame about 5 px wide runs around the canvas edge.
      Chrome: Bold title "upset-basic · python · letsplot · anyplot.ai" top left (~53 % of the width); axis titles "Intersection Size", "Set Size", "Intersection" in dark ink; ticks 0-100, 0/500, 0-11 and set names Social/Email/Search/Direct/Referral in INK_SOFT; "Degree" legend (1, 2, 3) on an elevated box at the right. All four panel borders drawn on each panel. All text readable.
      Data: Top panel: 12 intersection bars sorted descending (101 down to 33), degree 1 in #009E73, degree 2 in #C475FD, degree 3 in #4467A3, thin white outlines. Bottom left: horizontal set-size bars in #009E73 (Social ~530 largest, Referral ~260 smallest). Bottom right: dot matrix with green filled dots joined by green segments for members, light grey muted dots for non-members. The top bars are shifted left relative to the matrix columns (bar 0 at ~14 % of the width, matrix column 0 at ~38 %).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 in all panels; the same pure-white frame around the canvas edge, much more visible here.
      Chrome: Title and axis titles in light ink, ticks and set names in light grey INK_SOFT, legend on a slightly elevated dark box. No dark-on-dark text; everything readable.
      Data: Data colors identical to the light render (green/lilac/blue bars, green set bars and active dots); muted dots switch to a dark grey #404038 that is still visible against the background. Same bar-to-column misalignment as in the light render.
      Legibility verdict: PASS
