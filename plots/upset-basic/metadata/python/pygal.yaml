review:
  strengths:
  - Real pygal charts (StackedBar, HorizontalBar, XY) composited with their plot areas
    aligned to shared edges, so each intersection bar sits over its matrix column
    and each set bar beside its row
  - One StackedBar series per degree yields degree coloring and a native legend in
    Imprint order
  - Exact-combination counting via frozenset per subscriber; columns sorted by size
    descending
  - Both themes readable; muted non-member dots stay present and distinct from filled
    member dots
  weaknesses:
  - 'VQ-05 (both): the ''Intersection size'' y-axis title wraps onto two lines and
    sits about 450 px left of its tick labels, next to a legend that floats in the
    empty top-left corner → one line, set close to the tick labels (about −400 px
    gap). Likely cause: pygal reserves the left margin solved by place() for the legend
    and y_title, so the title is laid out at the far edge of that margin; set legend_at_bottom
    or move the legend into the bar chart''s right side.'
  - 'CQ-01 (code): seven helper functions (style, plot_rect, place, build_bars, build_matrix,
    build_sets, inner) wrap what could be three flat chart blocks → inline the builders
    and the style construction, keeping at most the alignment step. Likely cause:
    the charts are built inside functions so place() can rebuild them each iteration.'
  - 'Suggestion: an axis title on the set-size bars'' horizontal count axis (instead
    of a vertical ''Set size'' title on the category side) would read more directly.'
