      Data: 10 intersection bars sorted descending (196 … 47) colored by degree — #009E73 (1), #C475FD (2), #4467A3 (3) — with count labels; green set-size bars with page-colored counts inside (744/634/452/307/259); matrix of large filled member dots joined by degree-colored lines, small muted beige dots for non-members; bars aligned with their columns and rows.
