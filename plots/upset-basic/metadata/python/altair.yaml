    language → ''upset-basic · python · altair · anyplot.ai''; the legend also lists
    degrees 4 and 5 that no column shows → only the degrees present. Likely cause:
    the title string and a fixed domain [1..5].'
  - 'VQ-01 (both): the Degree legend''s title and labels render far smaller than the
