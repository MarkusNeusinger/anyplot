  strengths:
  - Canonical UpSet layout via make_subplots with shared_xaxes, so every intersection
    bar sits exactly over its matrix column and every set bar on its row
  - Exact combination counts from pd.crosstab(...).value_counts(), sorted by size
    descending, with zero-based count axes carrying units
  - Theme-adaptive chrome and theme-specific muted dot colour keep active and non-member
    dots distinguishable in both renders
  - 'Follows the adaptable six-zone structure: column constants, a Data block ending
    in a tidy df, and a Plot section that reads only df'
  - HTML output adds hover counts per intersection and per segment through hovertemplate
    and customdata
  weaknesses:
