review:
  strengths:
  - Correct three-panel UpSet composition (horizontal set-size bars, top intersection-cardinality
    bars, dot-matrix) assembled with patchwork::plot_layout, matching the canonical
    UpSet layout precisely
  - Intersection degree is encoded through a genuine continuous imprint_seq gradient
    (brand green → blue) on the connected dots and lines, giving real visual hierarchy
    without chartjunk
  - Realistic genomics dataset built from a shared latent liability so higher-order
    intersections naturally emerge — good coverage across degrees 1–6, from single-set
    exclusives to the full 6-way overlap
  - Theme-adaptive chrome and Imprint palette are fully correct and identical in structure
    across both renders; no clipping, no overlap, no dark-on-dark/light-on-light failures
  - Subtle alternating row striping in the matrix panel aids row-tracking readability
    without adding visual clutter
  weaknesses:
  - Axis titles "Set Size" and "Elements" could add explicit units/context (e.g. "Set
    Size (genes)") for full clarity, though the implied count semantics are acceptable
    for this plot type
  - Data storytelling relies mainly on size-sorting plus degree-color; no callout
    highlights the single most notable intersection (not spec-required, but would
    push distinctiveness further)
  - The degree legend uses a continuous colorbar for an inherently discrete integer
    variable (1–6); a discretely stepped legend would communicate “degree” slightly
    more precisely, though the current gradient is still clear and spec-compliant
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "upset-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left; horizontal set-size bar chart on the left ("Set Size" axis, reversed 750→0 scale); vertical intersection-size bar chart on top ("Elements" axis); dot-matrix in the center with set-name row labels (RNA-seq, ATAC-seq, ChIP-seq, Proteomics, Methylation, SNP-array); a boxed "Sets combined" gradient legend (1–6) on the right.
      Data: First/lowest-degree dots and all set-size/intersection bars render in brand green (#009E73); connected-dot lines shift from green to blue (#4467A3) as intersection degree increases, culminating in a deep-blue 6-way intersection column on the right; unconnected dots are shown as small muted-gray circles with alpha ~0.28 to indicate non-membership.
      Legibility verdict: PASS — title, axis titles, tick labels, row labels, and legend text are all clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, same panel layout (set-size bars left, intersection bars top, dot-matrix center, legend right), all text and axis lines now rendered in light ink/gray tones appropriate for the dark surface; matrix row striping shows as a slightly lighter charcoal band on alternating rows.
      Data: Data colors are pixel-identical to the light render — green for low-degree/single-set bars and dots, transitioning to blue for higher-degree intersections; unconnected dots remain muted gray, still distinguishable against the dark background.
      Legibility verdict: PASS — all titles, axis labels, tick labels, row labels, and legend text are clearly visible in light color against the dark background; no dark-on-dark failures detected; brand green and blue both remain visually distinct from the near-black surface.
