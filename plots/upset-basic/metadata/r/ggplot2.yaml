review:
  strengths:
  - 'Realistic synthetic data: a shared latent liability variable correlates set membership
    across the six assays, producing genuinely UpSet-worthy structure (meaningful
    high-degree intersections) instead of uniform random noise.'
  - 'Correct grammar-of-graphics composition via patchwork: blank corner, top intersection-size
    bars, left set-size bars, and dot matrix assembled cleanly with an asymmetric
    grid layout, matching the classic UpSet arrangement.'
  - 'Effective degree encoding: connected dots/lines use the imprint_seq gradient
    (brand green to blue) to show how many sets combine per intersection, directly
    answering the spec''s ''consider color/shading for intersection degree'' note,
    with a correctly labeled legend.'
  - 'Thoughtful readability touch: alternating row background stripes make it easy
    to trace a dot''s row across 15 intersection columns.'
  - 'Theme-adaptive chrome is fully correct in both renders: identical data colors
    between light and dark, correctly flipped background/text/gridline tokens, no
    dark-on-dark or light-on-light failures.'
  weaknesses:
  - Set Size axis tick labels (750/500/250/0) render tightly packed in the narrow
    left panel — widen spacing or use fewer breaks (e.g. 0/400/800) so the digits
    have more room.
  - Intersection bars and matrix columns carry no numeric labels — consider adding
    element counts above each top bar (geom_text) for at-a-glance reading, as many
    reference UpSet plots do.
  - Design Excellence is solid but stays close to a standard UpSet template — consider
    a stronger focal-point treatment for the top 1-2 intersections (e.g. highlighting
    the largest bar) to sharpen the data storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "upset-basic · r · ggplot2 · anyplot.ai" top-left in dark ink, clearly legible. Left panel axis title "Set Size" and category labels (RNA-seq, ATAC-seq, ChIP-seq, Proteomics, Methylation, SNP-array) in dark/soft-dark text, all readable. Top panel axis title "Elements" with numeric ticks (0-150) readable. Legend "Sets combined" box with soft border, readable text.
      Data: Set-size bars and single-set intersection dots use brand green (#009E73). Multi-set intersection dots/connecting lines use a green-to-blue gradient keyed to intersection degree (1-6). Non-member dots are neutral gray. Alternating row stripes (slightly lighter warm background) aid row tracing across the matrix.
      Legibility verdict: PASS (minor tick-label crowding on the Set Size axis noted as a weakness, but no unreadable text).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title, axis titles, category labels, and legend text all rendered in light ink (near-white/soft-light), clearly legible against the dark surface. No dark-on-dark failures detected anywhere — tick labels, axis titles, and legend text all correctly flipped to light tokens.
      Data: Identical green (#009E73) and green-to-blue gradient data colors as the light render — confirmed unchanged between themes. Non-member dots use a slightly lighter neutral gray appropriate for the dark surface. Row stripes use the dark elevated background token.
      Legibility verdict: PASS.
