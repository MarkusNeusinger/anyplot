review:
  strengths:
  - 'All three attempt-1 weaknesses are cleanly fixed: explicit per-axis font sizes
    (ylabelsize/xlabelsize/yticklabelsize/xticklabelsize) replace the flat Figure-level
    cascade, the unused `using ColorSchemes` import is gone, and the membership model
    now surfaces a degree-5 intersection (visible as the distinct blue bar) among
    the top 15.'
  - 'Correct, complete UpSet anatomy: horizontal set-size bars (brand green, reversed
    x-axis), vertical intersection-cardinality bars colored by degree via imprint_seq,
    dot-matrix with connecting lines, alternating row bands, and a degree colorbar.'
  - Callout label on the single largest intersection ("365") sharpens the story's
    focal point without faking interactivity.
  - 'Theme-adaptive chrome is fully correct in both renders: identical brand-green/imprint_seq
    data colors, correct FAF8F1/1A1A17 backgrounds, all text legible with no dark-on-dark
    or light-on-light failures.'
  - 'Idiomatic Makie composition: linkxaxes!/linkyaxes! keep panels aligned, colsize!/rowsize!
    with Relative() cleanly partitions the four-panel grid layout.'
  weaknesses:
  - Title occupies only ~24% of canvas width — noticeably narrower than the ~70-85%
    typical for the mandated title string on a landscape canvas this wide, though
    per style-guide 5d rules this is a design choice (not overflow/clipping/squeezing)
    and is not penalized.
  - 'LM-02 (Distinctive Features) is unchanged from attempt 1: the grid-layout composition
    and Colorbar usage are solid but not pushed further into more distinctive Makie-only
    territory (e.g. custom Legend layoutable, interactive-style linked selections
    would be out of scope, but a more elaborate degree-legend or custom tick formatting
    could differentiate further).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "upset-basic · julia · makie · anyplot.ai" centered at top. Axis labels ("Intersection size", "Set size") in dark ink with explicit ylabelsize/xlabelsize=14; tick labels and the five row category labels (RNA-seq, ChIP-seq, ATAC-seq, Proteomics, Methylation) in a softer dark gray at explicit size=12. All clearly readable against the light background.
      Data: Set-size bars render in brand green #009E73. Intersection bars follow the imprint_seq gradient (green → blue) keyed to intersection degree (1 through 5, including one clearly blue degree-5 bar), matching the "Sets in intersection" colorbar. Member dots are near-black/filled, non-member dots faded gray (alpha), connecting lines solid dark gray, alternating light-gray row bands for readability. A callout "365" labels the single largest intersection bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, and row labels now render in light ink (white/light-gray) — fully legible, no dark-on-dark failures anywhere.
      Data: Identical to light render — set-size bars stay brand green #009E73, intersection bars use the same imprint_seq gradient and colorbar range/ticks. Member dots render bright/near-white against the dark matrix, non-member dots faded at low alpha, connecting lines light gray — clearly visible against the dark row bands. The "365" callout is present and readable.
      Legibility verdict: PASS

    Both renders pass legibility; only chrome flips between themes as expected, and all data colors (categorical and continuous) are pixel-identical between the two renders.
