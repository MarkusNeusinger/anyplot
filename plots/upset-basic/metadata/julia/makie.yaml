review:
  strengths:
  - 'Correct UpSet anatomy: horizontal set-size bars (left), vertical intersection-cardinality
    bars (top), dot-matrix with connecting lines (center), and a degree colorbar —
    every structural element the specification calls for is present.'
  - Smart use of the sequential Imprint colormap (imprint_seq, brand green → blue)
    to encode intersection degree, directly answering the spec's suggestion to 'use
    color or shading to distinguish intersection degree.'
  - 'Clean theme-adaptive chrome: correct light/dark backgrounds, INK/INK_SOFT/INK_MUTED
    tokens threaded through every axis, alternating row bands for readability, and
    identical data colors between the light and dark renders.'
  - 'Idiomatic Makie composition: linkxaxes!/linkyaxes! keep the bar charts and matrix
    aligned, and the grid-based Figure layout (colsize!/rowsize!) cleanly separates
    the four panels.'
  weaknesses:
  - 'Font-size hierarchy is flat: only the title gets an explicit fontsize (22); the
    y-axis label ''Intersection size'', x-axis label ''Set size'', the matrix row
    labels (set names), and all tick labels fall back to the Figure-level fontsize=14
    cascade with no per-element ylabelsize/xlabelsize/yticklabelsize/xticklabelsize
    override, so axis labels and tick labels render at the same size instead of stepping
    down per the typography hierarchy.'
  - '`using ColorSchemes` is imported but never referenced — `cgrad` used to build
    IMPRINT_SEQ is Makie''s own re-export, not a ColorSchemes call. Remove the unused
    import.'
  - Among the top-15 intersections shown, the largest degree present is 3 even though
    5 sets are defined — no degree-4 or degree-5 combination is visible, so the plot
    doesn't fully demonstrate the higher-order overlaps an UpSet plot is meant to
    surface for a 5-set example. Nudge the membership-probability model (or the element
    count) so at least one higher-order intersection survives into the top 15.
  - Degree-colored bars and the descending sort establish ranking, but there's no
    direct callout (e.g. a value label on the largest bar) to sharpen the 'aha' —
    consider a light annotation on the single most striking bar to strengthen data
    storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "upset-basic · julia · makie · anyplot.ai" centered at top; y-axis label "Intersection size" (top bar panel) and x-axis label "Set size" (bottom-left bar panel) in dark ink; tick labels and the five row category labels (RNA-seq, ChIP-seq, ATAC-seq, Proteomics, Methylation) in a softer dark gray. All text is clearly legible against the light background.
      Data: Set-size bars (single series) render in brand green #009E73. Intersection-size bars are colored along the imprint_seq gradient (green → blue) keyed to intersection degree (1–3), matching the colorbar labeled "Sets in intersection." Member dots in the matrix are near-black/filled; non-member dots are faded gray at low alpha; connecting lines between member dots in the same column are a solid dark gray. Alternating light-gray row bands aid row tracking.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, and row category labels now render in light ink (white/light-gray), fully legible against the dark background. No dark-on-dark text observed anywhere — title, labels, and ticks are all light-colored.
      Data: Set-size bars remain the identical brand green #009E73; intersection bars use the identical imprint_seq gradient and colorbar as the light render — confirmed no data-color drift between themes. Member dots render as bright near-white/off-white fills against the dark matrix background, with the same faded low-alpha treatment for non-member dots; connecting lines are a light gray, clearly visible against the dark row bands.
      Legibility verdict: PASS.
