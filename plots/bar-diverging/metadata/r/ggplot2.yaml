review:
  strengths:
  - Correct diverging horizontal bar chart, sorted descending by NPS score, with a
    clearly distinguished zero baseline (thicker INK_SOFT vline vs. the thinner INK
    major gridlines)
  - 'Proper semantic-exception use of the Imprint palette: brand green #009E73 for
    ''Promoters lead'' (first series), matte red #AE3030 for ''Detractors lead'' —
    both categorical anchors match the style guide'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink/soft-ink text, subtle x-only major gridlines, no dark-on-dark
    or light-on-light failures'
  - 'Clean, idiomatic KISS ggplot2 script: single flat file, theme_minimal() base
    with explicit overrides, ragg::agg_png device, exact 3200×1800 canvas, legend
    placed top-left near the plot'
  - 'Realistic, neutral, appropriately scaled data: 16 departments, NPS values from
    -49 to +62, a plausible business scenario with clear positive/negative variation'
  weaknesses:
  - 'Both annotate(''text'', ...) calls meant to direct-label the two extreme bars
    (Product Design +62, Field Service -49) render nothing in either theme. Verified
    by pixel-level inspection of plot-light.png: scanning the full region to the right
    of the Product Design bar (x=3054..3200, y=250..350) and to the left of the Field
    Service bar (x=300..608, y=1560..1650) finds zero INK-colored glyph pixels — only
    gridline anti-aliasing and the ''Field Service'' axis category label are present,
    no ''+62'' or ''-49'' text. Likely cause: scale_x_continuous(expand = expansion(mult
    = 0.08)) only reserves ~8.8 data units of panel headroom past the data extremes,
    and the extra hjust=-0.25 / hjust=1.25 offset pushes the text glyphs past that
    expanded panel edge, so ggplot2''s default coord_cartesian(clip = ''on'') silently
    drops them. Fix: either grow the scale_x_continuous expansion enough to fit the
    label width, switch to coord_cartesian(clip = ''off''), or remove the two annotate()
    calls (and the comment describing them) since they currently ship as dead code
    with no visual payoff.'
  - Legend order lists 'Detractors lead' before 'Promoters lead' (alphabetical scale_fill_manual
    default) — reading positive-first would read more intuitively given promoters
    are the top-sorted, green, right-extending bars. Minor, not spec-required.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: title "bar-diverging · r · ggplot2 · anyplot.ai" top-left in bold dark ink; legend swatches ("Detractors lead" red, "Promoters lead" green) top-left below title; y-axis department category labels in dark ink; x-axis "Net Promoter Score" label and tick labels (-40..60) in soft ink; vertical gridlines at -40/-20/0/20/40/60, with the 0 line rendered visibly heavier/darker than the others as the baseline indicator. All chrome text is clearly readable against the light background.
      Data: 16 horizontal bars sorted from Product Design (+62, longest green bar, top) down to Field Service (-49, longest red bar, bottom), diverging from the zero baseline. First/positive series uses Imprint green #009E73, negative series uses Imprint matte red #AE3030. No numeric value labels are visible near the top or bottom bar despite the source code containing annotate() calls intended to label those two extremes — confirmed absent by direct pixel inspection.
      Legibility verdict: PASS (all core chrome text legible; the two annotation labels are simply not rendered at all, not illegible)

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: same title, legend, axis labels and ticks now in light ink (#F0EFE8) / soft light ink (#B8B7B0), fully readable against the dark background. No dark-on-dark text anywhere. Gridlines and the heavier zero baseline are still visible at the same positions.
      Data: identical bar geometry and identical data colors to the light render (green #009E73 / red #AE3030 unchanged) — only chrome flipped, as required. Same absence of the "+62"/"-49" annotation text as in the light render.
      Legibility verdict: PASS (all core chrome text legible in both themes; the annotation labels are absent, not unreadable)
