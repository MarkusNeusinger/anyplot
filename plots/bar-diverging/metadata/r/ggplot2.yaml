review:
  strengths:
  - Correct semantic-exception color mapping (green = promoters/positive, red = detractors/negative)
    with bar direction as redundant non-color encoding, mitigating CVD risk
  - Data sorted by value creates a clean 'funnel' pattern from best to worst department,
    a genuine visual hierarchy
  - Explicit zero-baseline geom_vline exactly as the spec's notes recommend
  - Theme-adaptive chrome correctly threaded through every non-data element (title,
    axis text, tick text, gridlines, legend); data colors identical across light/dark
  - Canvas dimensions exactly on target (3200x1800), no edge clipping in either render
  weaknesses:
  - The geom_text layer intended to direct-label the two extreme bars ('+62' beside
    Product Design, '-49' beside Field Service, per the code's own comment) renders
    no visible glyphs in either theme -- confirmed by pixel-level inspection at both
    bar tips in plot-light.png and plot-dark.png, only background pixels are present
    where the labels should be. This is dead/non-functional code, not a fake-UI issue,
    but it must not ship broken.
  - Design Excellence remains close to a default theme_minimal() look -- the direct-label
    annotations were meant to be the one bespoke differentiator this attempt added,
    and they don't render
  - No functioning ggplot2-distinctive technique is actually on display, since the
    one distinctive addition (direct value labels) doesn't work
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "bar-diverging · r · ggplot2 · anyplot.ai" top-left in dark ink; unboxed two-swatch legend ("Detractors lead" red, "Promoters lead" green) directly below the title; x-axis labeled "Net Promoter Score" with tick labels -40/-20/0/20/40/60; y-axis shows 16 department names as categorical labels, no y-axis title; subtle vertical gridlines every 20 units. All of this chrome is dark ink against the light background and is clearly readable.
      Data: Horizontal diverging bars, sorted from Product Design (highest, ~+62) down to Field Service (lowest, ~-49). Bars right of the zero baseline are brand green (#009E73, "Promoters lead"); bars left of zero are matte red (#AE3030, "Detractors lead"). A vertical zero-baseline line is drawn in the soft-ink tone.
      Missing content: The implementation's own code comment says it "direct-labels only the two extremes" with their exact score (e.g. "+62", "-49") via a geom_text layer. Pixel-level crops at both the Product Design bar's right tip and the Field Service bar's left tip show only plain background -- no digits, no "+" or "-" glyphs, nothing. The labeling layer produces zero visible output.
      Legibility verdict: PASS for every element that is actually rendered (title, legend, axis label, tick labels, department names). The missing extreme-value labels are a content/functionality defect, not a legibility failure, since there is no text present to judge as legible or not.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same layout as the light render with chrome flipped -- title and axis label in near-white ink, tick/legend/department text in a lighter soft gray, gridlines faint and light. All comfortably readable, no dark-on-dark failures anywhere.
      Data: Bar fill colors (#009E73 green, #AE3030 red) are pixel-identical to the light render; only chrome changed, as required.
      Missing content: Same crops repeated on plot-dark.png at the Product Design and Field Service bar tips show only background -- the "+62"/"-49" direct labels are absent here too, confirming the defect is not theme-specific.
      Legibility verdict: PASS for every rendered element; same missing-labels defect as the light render.
