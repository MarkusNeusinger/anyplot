review:
  strengths:
  - Correct semantic-exception color mapping (green=promoters/positive, red=detractors/negative)
    per the style guide's sentiment-polarity exception, with bar direction providing
    redundant non-color encoding
  - Data sorted by value, creating a clean visual funnel that guides the eye and reinforces
    the diverging story
  - Explicit zero-baseline geom_vline exactly as the spec's notes recommend
  - Theme-adaptive chrome correctly threaded through every non-data element (title,
    axis text, tick text, gridlines, legend) with data colors held identical across
    light/dark
  - Canvas dimensions exactly on target (3200x1800), no edge clipping in either render
  weaknesses:
  - Design Excellence is largely generic theme_minimal() application without much
    bespoke polish - consider value labels on the extreme bars or tighter legend/plot
    spacing to lift DE-01/DE-02
  - No distinctive ggplot2-specific technique on display beyond the standard grammar
    (LM-02) - correct but fairly plain use of the library
  - Y-axis has no axis title; acceptable here since department names are self-explanatory,
    but worth a design note for future similar specs
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "bar-diverging · r · ggplot2 · anyplot.ai" top-left in dark ink; unboxed
