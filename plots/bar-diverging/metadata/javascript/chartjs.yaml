      Data: 8 horizontal bars extending left or right from zero. Top four bars (Career Growth, Work-Life Balance, Team Collaboration, Remote Flexibility) are brand green (#009E73) extending right (positive net agreement, 62/48/31/14). Bottom four (Job Security, Training & Development, Management Support, Compensation) are matte red (#AE3030) extending left (negative net agreement, -8/-19/-33/-45). Bars have subtly rounded corners.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now rendered in light/off-white ink, fully visible and not clipped. Category labels and axis tick/title text are rendered in light gray tones, clearly legible against the dark background. The zero-baseline rule is now a bright near-white vertical line, and grid lines are faint light strokes. No dark-on-dark text was observed anywhere (title, category labels, tick labels, and axis title all use light ink).
      Data: Same 8 bars, same green (#009E73) for positive values and matte red (#AE3030) for negative values — colors are pixel-identical to the light render; only the chrome (background, text, grid, zero-line color) flipped as expected.
