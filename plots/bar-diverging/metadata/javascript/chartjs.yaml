review:
  strengths:
  - Custom canvas-drawn value-label plugin (afterDatasetsDraw) gives every bar an
    explicit numeric focal point (e.g. "+62", "-45") that reinforces the color encoding
    with a redundant, colorblind-safe signal.
  - 'Correct semantic-exception color mapping: brand green #009E73 (palette[0]) for
    positive/agree, matte red #AE3030 (palette[4], the designated bad/loss/error anchor)
    for negative/disagree — exactly matches the Imprint style guide''s sentiment/polarity
    exception.'
  - Zero baseline is visually emphasized with a thicker, ink-colored gridline (scriptable
    grid.color/lineWidth keyed on tick.value === 0) plus a labeled "0" tick — directly
    satisfies the spec's "clear visual indicator at the zero baseline" requirement.
  - Bars are sorted descending by net score (explicitly documented in a code comment),
    creating a clean visual hierarchy from strongest agreement to strongest disagreement.
  - Theme-adaptive chrome is threaded correctly through title/axis/tick/grid tokens
    (t.ink, t.inkSoft, t.grid); data colors are pixel-identical between light and
    dark renders.
  - Adaptive title-fontsize formula avoids overflow for the long mandated title suffix
    combined with the descriptive prefix, without ever needing to shrink below a readable
    size here.
  weaknesses:
  - No explicit color-key/legend stating the green=agree / red=disagree convention;
    it's inferable from the +/- signed labels but a small legend or subtitle would
    make it instantly clear without reading individual values.
  - Bottom margin under the x-axis tick row is comparatively tight (~44px of 1800px
    canvas height) versus the generous left/top margins — could use slightly more
    breathing room for full margin balance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Employee Engagement Survey · bar-diverging · javascript · chartjs · anyplot.ai" in dark ink, centered, clearly readable and occupying ~57% of canvas width. Y-axis category labels (Career Growth, Work-Life Balance, ... Compensation) in dark-grey ink, fully legible, none clipped at the left edge (checked pixel-level, ~30px margin remaining). X-axis title "Net Agreement Score (%)" includes units. X-axis tick labels (-70..70) legible, "0" tick is explicitly labeled and the zero gridline is rendered thicker/darker than the other subtle vertical gridlines. Y-axis has no gridlines (categorical), consistent with style-guide grid guidance.
      Data: 8 horizontal bars, sorted descending by net score. Positive bars (Career Growth +62, Work-Life Balance +48, Team Collaboration +31, Remote Flexibility +14) render in brand green #009E73. Negative bars (Job Security -8, Training & Development -19, Management Support -33, Compensation -45) render in matte red #AE3030. Each bar has a signed numeric value label at its outer end, colored to match its bar. No text/element overlap; no clipping at any canvas edge (verified programmatically: right-edge text margin 72px, left-edge 30px, top 68px, bottom 44px).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now in light/off-white ink, fully readable against the dark background. Y-axis category labels in light grey, all legible, no dark-on-dark issues. X-axis tick labels and "Net Agreement Score (%)" title also legible in light ink. Zero gridline is rendered in bright ink-white and thicker than the subtle grey gridlines, clearly marking the baseline.
      Data: Same 8 bars in identical positions and identical colors to the light render — brand green #009E73 for positive, matte red #AE3030 for negative — confirming the data-color identity rule (only chrome flips between themes).
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed in either render.
