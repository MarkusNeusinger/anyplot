review:
  strengths:
  - 'Idiomatic ECharts diverging-bar pattern: two stacked bar series (Positive/Negative)
    with null-padded data, so bars grow from a shared zero baseline without manual
    coordinate math.'
  - 'Semantic color mapping is exactly right: brand green (#009E73, palette[0]) for
    positive scores and matte red (#AE3030, palette[4]) for negative scores, matching
    the Imprint style guide''s documented sentiment/polarity semantic exception.'
  - Categories are sorted by score, producing an immediately readable diverging fan
    from the best-performing feature at the top to the worst at the bottom (spec explicitly
    calls for sorting to enhance pattern recognition).
  - Explicit +/- signed value labels placed outside each bar reinforce exact magnitude
    without adding clutter or overlap.
  - Zero-baseline is explicitly reinforced via a markLine at x=0, satisfying the spec's
    'clear visual indicator at the zero baseline' requirement.
  - Horizontal orientation correctly chosen to accommodate the long category labels
    (e.g. 'Mobile App Experience', 'Checkout Experience'), per the spec's guidance.
  - Theme tokens are threaded through every chrome element (title, legend, axis labels,
    axis lines, grid, value labels) and both light/dark renders are fully legible
    with correctly flipped chrome and identical data colors.
  weaknesses:
  - Design excellence is solid but stops at 'thoughtful defaults' rather than 'publication-ready'
    — there's no extra visual emphasis (e.g. a subtle highlight, larger marker, or
    annotation on the top/bottom extreme bars) to sharpen the storytelling beyond
    the sort order and color split.
  - 'Visual refinement reads as well-configured rather than exceptional: the composition
    is clean but generic — consider slightly more generous spacing between legend
    and plot, or a touch of bar corner rounding, to lift it further.'
  - Library-mastery usage is correct but moderate — only markLine and a label formatter
    go beyond basic bar/stack usage; a more ECharts-distinctive touch (e.g. visualMap-driven
    color intensity by magnitude) would raise LM-02.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bar-diverging · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend "Positive"/"Negative" with green and red swatches below the title. X-axis (value axis, "Net Promoter Score") runs -60 to 60 with dark tick labels and a subtle vertical gridline every 20 units. Y-axis lists 11 feature category labels in dark text, fully readable, no truncation.
      Data: 11 horizontal bars diverging from a shared zero baseline — green bars (#009E73) extend right for positive scores (Checkout Experience +8 through Mobile App Experience +52), red bars (#AE3030) extend left for negative scores (Price Value -4 through Technical Reliability -41). Each bar has an explicit signed value label (+52, -41, etc.) placed just outside its tip. A thin dark vertical line marks the zero baseline where positive and negative bars meet.
      Legibility verdict: PASS — all text (title, legend, axis labels, tick labels, category labels, value labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and legend text now rendered in light ink/off-white, clearly legible against the dark background. Axis lines and tick labels use the lighter secondary-text tone, still easily readable. Gridlines are subtle and visible without competing with the data.
      Data: Bar colors are pixel-identical to the light render — green #009E73 for positive, matte red #AE3030 for negative — confirming only chrome flipped, not data colors. Value labels remain dark ink-colored text placed just outside each bar tip; against the dark page background this reads as light text next to the bar (label color is theme-adaptive "ink"), fully legible with no dark-on-dark failures observed anywhere (title, legend, axis, category labels, value labels all pass).
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; every text element is clearly readable.
