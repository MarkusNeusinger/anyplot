review:
  strengths:
  - 'Correct Imprint palette use: brand green #009E73 for growth (position 1) and
    semantic matte red #AE3030 for decline — a legitimate finance semantic-exception
    (profit/up=green, loss/down=red), not an arbitrary color pick'
  - Zero baseline is explicit (vertical rule at x=0) and bars sort by value descending,
    exactly matching the spec's 'sort by value' and 'clear visual indicator at baseline'
    notes
  - 'Data colors are pixel-identical between light and dark renders; only chrome (background,
    text, grid) flips correctly to #FAF8F1/#1A1A17'
  - Direction is doubly encoded (color AND bar position relative to the zero line),
    so the red/green choice isn't a colorblind sole-signal problem
  - Value labels at each bar tip (+24%, -21%, etc.) add readability without cluttering
    the chart
  - 'Clean, idiomatic KISS-structured D3 code: no functions/classes, explicit font
    sizes, deterministic hardcoded data, correct #container/ANYPLOT_SIZE mount contract'
  weaknesses:
  - 'Design Excellence is at library-default level: the layout, typography, and color
    use are all correct but not distinctive — nothing here would read as a deliberate
    ''design'' choice beyond following the prompt defaults. Consider a focal-point
    technique: bold/larger label on the top grower and top decliner, a subtle background
    band highlighting the strongest performers, or a light divider/shading between
    the growth and decline groups.'
  - 'Data storytelling is default-level: the chart displays sorted data but doesn''t
    visually emphasize an insight (e.g., which product line matters most). A short
    callout or emphasized styling on the extremes (Cloud Services / Print Media) would
    push this from ''displays data'' to ''tells a story.'''
  - 'Library Mastery is generic: the diverging-bar technique (min(x(0),x(value)) for
    bar x/width) is standard and easily replicated in any charting library — nothing
    here is distinctively D3 (e.g., no custom tick formatting beyond a basic %, no
    d3-specific layout/interpolation trick). Consider leveraging something D3-idiomatic
    that a declarative library couldn''t do as easily, like a custom axis tick generator
    or fine-grained per-bar transform logic.'
  - Title occupies only ~26% of the plot width at 22px — well under the style guide's
    50-70% target for a short (non-prefixed) mandated title. Not a hard violation,
    but a slightly larger title (e.g. 24-26px) would strengthen the visual hierarchy
    per the style guide's typography priority (title = largest, first thing readers
    see).
  - Grid styling (vertical gridlines spanning the full inner height) is functional
    but plain — consider dropping gridlines except at major ticks, or reducing opacity
    further, to sharpen the 'visual refinement' polish the style guide calls for.
  - Data values step down almost linearly (24, 19, 15, 11, 8, 4, -3, -7, -10, -13,
    -16, -21) — realistic but suspiciously uniform in spacing; a touch more natural
    variance between consecutive categories would read as less synthetic.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-diverging · javascript · d3 · anyplot.ai" centered top in bold dark ink, clearly readable. Y-axis category labels (Cloud Services, Data Analytics, ... Print Media) in dark secondary ink, fully legible. X-axis tick labels (-25% to 25%) and axis label "Year-over-Year Revenue Growth (%)" readable in dark-gray ink. Subtle vertical gridlines at 5% intervals, low opacity, do not compete with data. Legend ("Growth" green swatch, "Decline" red swatch) top-right, readable dark text.
      Data: First 6 bars (positive values, sorted descending from +24% to +4%) render in Imprint brand green #009E73; last 6 bars (negative, -3% to -21%) render in Imprint semantic red #AE3030. Value labels (+24%, -21%, etc.) sit at each bar tip in dark ink, all legible. Zero baseline is a clear dark vertical rule at x=0.
      Legibility verdict: PASS — all text elements (title, axis labels, tick labels, category labels, legend, value labels) are clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, category labels, tick labels, and legend text all render in light ink (off-white/light-gray), clearly visible against the dark background. Gridlines are faint light lines at low opacity, still visible but unobtrusive. Zero baseline rule is a light-colored vertical line, clearly visible.
      Data: Same bars, same colors — green #009E73 for growth, red #AE3030 for decline — pixel-identical to the light render as required. Value labels at bar tips are light-colored and fully readable against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, ticks, category labels, legend, value labels) is clearly legible against the near-black surface.
