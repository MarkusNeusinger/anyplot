review:
  strengths:
  - Uses Highcharts' `negativeColor` series option to auto-split bars into brand green
    (#009E73) above zero and matte red (#AE3030, the style guide's semantic bad/loss
    anchor) below zero — genuinely idiomatic use of a library feature purpose-built
    for diverging bars.
  - Zero baseline is marked with an explicit `plotLines` rule at value 0, giving a
    clear, unambiguous divergence axis.
  - Categories are pre-sorted ascending by value (most negative to most positive),
    which is exactly the spec's 'sort bars by value to enhance pattern recognition'
    guidance.
  - Direction is redundantly encoded three ways (bar position left/right of zero,
    hue, and explicit +/- sign in the data label), so the red/green choice never relies
    on hue alone for colorblind readers.
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    chrome text uses inkSoft/ink tokens, and the two brand data colors are pixel-identical
    between light and dark.'
  - Clean, minimal code — single `Highcharts.chart()` call, hardcoded deterministic
    data, no unused imports or fake interactivity.
  weaknesses:
  - 'Bars use borderWidth: 0 — the style guide''s ''Data Element Styling'' section
    recommends a subtle white/darker edge on bars for definition; a thin edge would
    sharpen the boundary between adjacent bars and the background slightly further.'
  - No annotation or legend hint spells out the red = below zero / green = above zero
    convention for a first-time viewer — mitigated by the explicit +/- signed labels
    on every bar, but a one-line caption or tiny swatch legend would remove any ambiguity
    for a reader who only glances at bar color.
  - Visual hierarchy is solid but fairly conservative — no additional emphasis (e.g.,
    subtle callout on the extreme values, or muted treatment of near-zero bars) to
    sharpen the storytelling beyond sort order and color.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-diverging · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Net satisfaction score by product category, sorted low to high" in a lighter secondary tone directly below it. Ten category labels (e.g. "DVD Rental Service", "Wireless Earbuds") run down the left side in dark, easily readable text. X-axis ticks from -80 to 80 in soft gray-brown, with a y-axis title "Net Satisfaction Score" below them. All text is clearly legible against the light background — no light-on-light issues.
      Data: Ten horizontal bars diverge from a bold black zero baseline — six red bars (matte red, semantic "bad" anchor) extend left for negative categories (DVD Rental Service -61 down to Physical Retail Store -12), four green bars (#009E73, brand green) extend right for positive categories (Mobile Banking App +34 up to Wireless Earbuds +66). Each bar carries an explicit signed numeric data label just outside its end, in dark ink, fully readable on the light surface. Subtle vertical gridlines mark the value axis every 10 units.
      Legibility verdict: PASS — every title, subtitle, category label, tick label, and data label is clearly readable against the off-white background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and subtitle now rendered in light ink/inkSoft tones, clearly visible against the dark surface. Category labels on the left and axis tick labels are rendered in a soft light gray, fully legible with no dark-on-dark issues anywhere. The zero-baseline plotLine remains a clearly visible light-toned vertical rule.
      Data: The same six red / four green bars in identical hex values to the light render — confirming the Imprint data colors (brand green #009E73, matte red #AE3030) are unchanged between themes; only the chrome (background, gridlines, text) flipped. Data labels are rendered in light ink and read clearly against both the dark background and the saturated bar fills.
      Legibility verdict: PASS — all text is legible in the dark theme; no dark-on-dark or contrast failures observed.
