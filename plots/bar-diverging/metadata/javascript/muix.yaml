      Background: warm off-white #FAF8F1, no pure white.
      Chrome: semibold dark title "bar-diverging · javascript · muix · anyplot.ai" top left, with a soft-ink subtitle "10 categories, sorted by value · 5 above zero, 5 below". Ten survey statements as y-axis category labels in dark ink; x axis from -75 to +75 with signed ticks -60 … +60 and the axis title "Net agreement score (percentage points)". Subtle light-grey vertical grid; a 2 px dark zero line runs the full height. All text is readable.
      Data: five brand-green (#009E73) bars extend right (+68, +52, +41, +22, +9) and five matte-red (#AE3030) bars extend left (-8, -19, -34, -41, -55), sorted from largest to most negative, each with a bold signed value label outside its end.
