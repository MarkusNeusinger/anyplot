review:
  strengths:
  - Two sign-split series (null on the other side) in one shared stack give exactly
    one bar per row, coloured by its direction, without per-bar colour hacks
  - ChartsReferenceLine at x=0 in the ink token marks the zero baseline across the
    full bar span and adapts to both themes
  - Native barLabel with barLabelPlacement 'outside' puts signed (+68 / -55) value
    labels at the bar ends; the symmetric axis limit is padded from the data so the
    labels never clip
  - 'Semantic colour choice: brand green for net agreement, the Imprint red anchor
    for net disagreement'
  - Signed valueFormatter on the series and the axis makes the HTML tooltip and the
    ticks read in the same signed form
  weaknesses:
  - 'Suggestion: the negative labels and ticks use an ASCII hyphen ("-55"); a typographic
    minus (U+2212) would match the width of the "+" sign.'
  - 'Suggestion: the mandated title fills only about 30 % of the width; a slightly
    larger title size would anchor the header better.'
  image_description: |-
