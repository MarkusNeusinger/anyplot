review:
  strengths:
  - 'Correct chart type: horizontal diverging bar chart with bars sorted by value
    for immediate pattern recognition, per spec''s explicit recommendation.'
  - Zero baseline is marked with a clear vertical reference line (ax.axvline), and
    value labels with explicit +/- signs give a redundant encoding beyond color alone.
  - 'Semantic color mapping is deliberate and correct: positive = Imprint position-1
    brand green (#009E73), negative = Imprint position-5 matte red (#AE3030) — a valid
    semantic exception (sentiment positive/negative -> green/red) rather than an arbitrary
    override.'
  - 'Theme-adaptive chrome is threaded through consistently: PAGE_BG/INK/INK_SOFT
    tokens applied to background, spines, ticks, grid, legend frame, and text in both
    plot-light.png and plot-dark.png; data colors are identical across themes.'
  - 'Clean, deterministic code: KISS structure (no functions/classes), fully deterministic
    hardcoded data (no seed needed), only used imports, uses Axes-based idiomatic
    API (ax.barh, not pyplot.bar), correct plt.savefig(f''plot-{THEME}.png'') with
    no bbox_inches=''tight''.'
  - Data is realistic and neutral (product satisfaction survey), covers a good spread
    of both positive and negative magnitudes including a near-zero case (Sustainability
    -8) and clear extremes (Brand Trust +85, Mobile App -52).
  weaknesses:
  - 'Design Excellence is competent but not exceptional (14/20): the chart reads as
    a well-executed standard diverging bar rather than a publication-grade piece.
    Consider adding a subtle visual emphasis on the extremes (e.g. a callout/annotation
    on the best ''Brand Trust +85'' and worst ''Mobile App -52'' bars) to push Data
    Storytelling from ''good'' to ''excellent''.'
  - 'Library Mastery is generic (5/10, LM-02=1): the Patch-based custom legend and
    np.argsort sorting are common patterns portable to almost any plotting library
    with minor syntax changes. Leverage a feature more distinctive to matplotlib''s
    Axes API (e.g. ax.annotate with arrow/connectionstyle for the extremes, or a Formatter/transform-based
    touch) to raise Distinctive Features.'
  - 'Minor VQ-01 polish: value labels (''+85'', ''-52'') sit close to the plot''s
    right/left extremes near the x-limits — double check they stay comfortably inside
    the axis padding at all data extremes as the repair loop tunes other elements.'
