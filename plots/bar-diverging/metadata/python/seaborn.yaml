review:
  strengths:
  - 'Correct semantic Imprint palette use: Profit uses brand green #009E73 (position
    1), Loss uses matte red #AE3030 (position 5) per the style guide''s documented
    finance semantic exception, and the code comments explicitly justify the choice.'
  - Zero baseline drawn as a clear theme-adaptive vertical rule, bars sorted ascending
    by value for pattern recognition, and direct value labels at every bar tip (both
    matching the spec's explicit notes).
  - 'Data storytelling touches beyond the minimum: bolded value labels for the best/worst
    performer and a ''Net Q1'' summary callout in an elevated card, giving the chart
    a clear focal point.'
  - Theme-adaptive chrome is threaded correctly through every element (title, axes,
    ticks, grid, legend, callout box) and the data colors are pixel-identical between
    light and dark renders.
  - 'Idiomatic seaborn usage: hue-mapped palette dict with dodge=False instead of
    a manual per-bar color loop.'
  - Canvas is exactly 3200x1800, bbox_inches left at the safe default, deterministic
    hardcoded data, clean KISS structure.
  weaknesses:
  - 'Title omits the required {language} component: it renders ''bar-diverging · seaborn
    · anyplot.ai'' but the SC-04 format is ''{spec-id} · {language} · {library} ·
    anyplot.ai'' — fix to ''bar-diverging · python · seaborn · anyplot.ai'' (and re-check
    the title fontsize/proportion once the string is longer).'
  - Y-axis tick marks are still drawn (small dashes before each category label) —
    the style guide's decoration checklist asks to remove tick marks while keeping
    the tick labels (e.g. ax.tick_params(axis='y', length=0)).
  - 'Design Excellence is good but stops short of ''publication-ready'': the callout
    box and bold extremes create hierarchy, but there''s no additional refinement
    (e.g., a subtler legend frame, or de-emphasizing mid-range bars) that would push
    it into top-tier polish.'
