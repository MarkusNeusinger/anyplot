review:
  strengths:
  - Alpha-mapped |score| magnitude layered on top of the positive/negative hue split
    adds a genuinely useful second encoding dimension — the strongest sentiment (highest
    actionable signal) visually dominates mild responses.
  - Bars are sorted by value (descending top-to-bottom) with a clear zero-baseline
    vline, giving the chart an immediate, scannable narrative from best to worst.
  - Direct end-of-bar value labels (split into left-aligned positive / right-aligned
    negative layers) let readers read exact scores without cross-referencing the axis.
  - Color mapping (green=Positive, red=Negative) correctly uses the Imprint palette's
    semantic-exception rule for sentiment/polarity data, backed by a redundant positional
    encoding (bar direction from zero) so hue is never the sole signal.
  - 'Both light and dark renders are fully theme-correct: matching #FAF8F1/#1A1A17
    backgrounds, theme-adaptive INK/INK_SOFT chrome, and identical data colors across
    themes.'
  - All font sizes are explicitly set and match the style-guide's scale-based defaults
    (title 16, axis_title 12, axis_text 10, legend 10) with no reliance on library
    defaults.
  - Title format is exactly correct and legend labels ('Positive'/'Negative') match
    the Sentiment data precisely.
  weaknesses:
  - Legend has a visible box border (legend_background=element_rect(fill=ELEVATED_BG,
    color=INK_SOFT)) — the style guide's Decoration Removal Checklist recommends removing
    box frames around legends; drop the `color=` (or set it to match the plot background)
    to keep only the fill.
  - Library Mastery is fairly generic — the ggplot-grammar layering is nearly identical
    to what a plotnine implementation would produce (the letsplot library-guide itself
    notes this closeness under 'Key Differences from plotnine'). To better showcase
    lets-plot specifically, use a feature plotnine can't replicate, e.g. custom `tooltips=`
    config on geom_bar for the HTML export, or built-in pan/zoom interactivity.
  - The geom_text value labels (size=3.2mm annotation) sit fairly close in visual
    weight to the axis tick labels rather than reading as a distinct, slightly bolder
    secondary layer — a touch more size or weight would sharpen the label/tick hierarchy,
    especially for the short negative bars (e.g. Technical Support at -8) where the
    label sits close to the zero line.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-diverging · letsplot · anyplot.ai" centered at top; dark "Category" y-axis title (rotated) and gray category tick labels (Payment Options, Product Quality, ... Mobile App) down the left; "Net Promoter Score (-100 to +100)" x-axis title with gray numeric ticks (-40 to 80) below; subtle vertical gridlines at each x tick; a bolder dark vertical rule marks the zero baseline; boxed legend "Sentiment" (Positive/Negative swatches) sits at the right, near the plot.
      Data: Bars extend right (green, #009E73 family) for positive scores and left (matte red, #AE3030 family) for negative scores, with fill opacity scaling by |score| so stronger sentiment reads darker/more saturated. Small gray value labels ("68", "62", ... "-38") sit just past each bar's tip. First/dominant series color is #009E73 as required.
      Legibility verdict: PASS — all title, axis, tick, legend, and value-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same layout and text content as the light render, now in light-gray/off-white (#F0EFE8 primary, #B8B7B0 secondary) — title, axis titles, tick labels, and legend text are all light-colored and clearly legible; legend box now shows a dark elevated fill (#242420) with a visible border.
      Data: Same green/red bars with the same alpha-by-magnitude scaling; bars additionally show a thin white keyline in this render (visible against the dark background, effectively invisible against the light background's near-white tone — consistent with the style guide's "subtle white bar edge" recommendation, not a theme bug). Data colors are pixel-identical to the light render (#009E73 positive / #AE3030 negative family) — only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all tick labels, axis titles, title, and value labels remain clearly visible against the near-black background.
