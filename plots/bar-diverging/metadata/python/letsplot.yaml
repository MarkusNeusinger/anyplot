review:
  strengths:
  - 'Fixed the prior legend-border weakness: legend_background is now fill-only (no
    color= stroke), so both renders show a clean, frameless legend box.'
  - Added layer_tooltips() with Category/Score/Sentiment lines on geom_bar — a genuine
    lets-plot-specific interactive feature that a static grammar-of-graphics library
    like plotnine cannot replicate, directly addressing the prior Library Mastery
    feedback.
  - Value labels were bumped from 3.2mm to 3.6mm and kept bold, creating a clearer
    visual hierarchy against the 10pt tick labels, especially for short bars near
    the zero line (e.g. Technical Support at -8).
  - Alpha-mapped |score| magnitude layered on top of the positive/negative hue split
    remains a genuinely useful second encoding dimension — the strongest sentiment
    visually dominates mild responses.
  - Sorted bars, a clear zero-baseline vline, and direct end-of-bar value labels give
    an immediately scannable best-to-worst narrative.
  - 'Both renders are fully theme-correct: matching #FAF8F1/#1A1A17 backgrounds, correct
    INK/INK_SOFT chrome, and pixel-identical data colors across themes.'
  - Semantic-exception color mapping (green=Positive/red=Negative) is backed by a
    redundant positional encoding (bar direction from zero), so hue is never the sole
    signal.
  weaknesses:
  - 'Library Mastery still has room: the core grammar (geom_bar + geom_vline + geom_text
    + scale_fill_manual) remains largely portable to plotnine. The added tooltips
    config is a good step, but a bigger lets-plot-only feature (e.g. built-in pan/zoom,
    or an interactive legend) would differentiate the HTML output further.'
  - Aesthetic sophistication is solid but stops short of a truly bespoke, publication-grade
    look — e.g. no custom typography treatment or additional micro-annotation (such
    as score-band grouping) beyond the alpha encoding.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-diverging · letsplot · anyplot.ai" centered at top; dark "Category" y-axis title (rotated) with gray category tick labels (Payment Options, Product Quality, ... Mobile App) down the left; "Net Promoter Score (-100 to +100)" x-axis title with gray numeric ticks (-40 to 80) below; subtle vertical gridlines at each x tick; a bolder dark vertical rule marks the zero baseline; a clean, frameless legend "Sentiment" (Positive/Negative swatches) sits at the right, near the plot, with no visible border box.
      Data: Bars extend right (green, #009E73 family) for positive scores and left (matte red, #AE3030 family) for negative scores, with fill opacity scaling by |score| so stronger sentiment reads darker/more saturated. Bold gray value labels ("68", "62", ... "-38") sit just past each bar's tip, clearly distinct in weight from the tick labels — confirmed no overlap with the zero-baseline rule even for the smallest bar (Technical Support, -8). First/dominant series color is #009E73 as required.
      Legibility verdict: PASS — all title, axis, tick, legend, and value-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same layout and text content as the light render, now in light-gray/off-white (#F0EFE8 primary, #B8B7B0 secondary) — title, axis titles, tick labels, and legend text are all light-colored and clearly legible. The legend panel shows a subtly lighter elevated fill (#242420) against the near-black plot background but carries no stroked border, matching the light render's frameless treatment.
      Data: Same green/red bars with the same alpha-by-magnitude scaling; bars additionally show a thin white keyline in this render (visible against the dark background, effectively blending into the light background's near-white tone). Data colors are pixel-identical to the light render (#009E73 positive / #AE3030 negative family) — only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all tick labels, axis titles, title, and value labels remain clearly visible against the near-black background.
