review:
  strengths:
  - 'Correctly implements the diverging structure: bars sorted by value, extending
    from a clear zero baseline (Span) with opposite alignment for positive/negative
    value labels'
  - Semantic color choice (brand green for positive, matte red for negative) matches
    the documented Imprint 'sentiment/polarity' exception and is reinforced by bar
    direction and signed +/- value labels, so color is never the sole signal
  - Theme-adaptive chrome is threaded through consistently — both plot-light.png and
    plot-dark.png are fully legible with correct backgrounds, ink tokens, and identical
    data colors
  - Direct value labels at each bar end make a legend unnecessary and improve at-a-glance
    readability
  - 'Idiomatic bokeh usage: ColumnDataSource, HoverTool for HTML-only interactivity,
    LabelSet for direct labeling, Span for the zero baseline'
  - Deterministic, seed-free data; clean imports; no fake UI; correct plot-{theme}.png/.html
    output contract
  weaknesses:
  - Y-axis label 'Category' is largely redundant with the self-explanatory category
    tick labels directly beside it (Product Quality, Tech Support, etc.) — consider
    dropping it per the style guide's 'redundant axis labels' guidance to reclaim
    a little left margin
  - Value labels use the secondary INK_SOFT gray for both positive and negative bars
    — legible in both themes, but a touch more contrast (or matching each label to
    its bar's hue) would make the labels pop slightly more at a glance, especially
    at mobile scale
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white and not dark.
      Chrome: Bold dark title "bar-diverging · bokeh · anyplot.ai" top-left, clearly visible. Italic axis titles "Net Satisfaction Score" (x) and "Category" (y) in dark ink. Category tick labels (Return Policy, Product Quality, ... Tech Support) in soft gray, fully readable. Subtle vertical gridlines at -40/-20/0/20/40/60 on the value axis only; no horizontal gridlines. A solid black vertical line marks the zero baseline.
      Data: 10 horizontal bars sorted descending by value from +52 (Return Policy, top) to -35 (Tech Support, bottom). Positive bars are brand green (#009E73), negative bars are matte red (#AE3030). Each bar has a signed value label ("+52", "-35", etc.) in soft gray positioned just past the bar end, aligned away from the zero baseline.
      Legibility verdict: PASS — all title, axis, tick, and data-label text is clearly readable against the light background; no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black and not light.
      Chrome: Title and axis titles render in light off-white ink; tick and value labels in the lighter secondary gray token. Gridlines and zero-baseline line flip to light-on-dark equivalents. Layout, spacing, and label positions are identical to the light render.
      Data: Same bar colors and same sorted order as the light render — brand green for positive, matte red for negative — confirming the Imprint categorical data colors are held constant across themes; only chrome (background, text, grid, outline) adapts.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; every text element (title, axis labels, category ticks, value labels) is clearly legible against the near-black background.
