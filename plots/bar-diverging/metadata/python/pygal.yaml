review:
  strengths:
  - Correctly applies the Imprint style guide's sentiment-polarity semantic exception
    (positive→#009E73 brand green, negative→#AE3030 matte red) instead of default
    canonical ordering, exactly matching the documented use case
  - Zero baseline is visually clear via the axis line at x=0, and bars are sorted
    by value so satisfied/dissatisfied departments group naturally at top/bottom
  - Inline value labels with a custom +/- formatter add a redundant encoding channel
    beyond color and bar direction, reinforcing colorblind-safe readability
  - Theme-adaptive tokens (PAGE_BG, INK, INK_SOFT, INK_MUTED) are threaded through
    the whole Style object and both plot-light.png and plot-dark.png render correctly
    with no dark-on-dark or light-on-light failures
  - Data shows a realistic, neutral customer-satisfaction survey scenario with a wide,
    plausible spread of positive and negative scores (-45 to +72) within the -100/+100
    scale
  - Clean, deterministic, KISS-structured code with explicit font sizing throughout
    and no unused imports
  weaknesses:
  - Category row labels (label_font_size=56) are visibly larger than the numeric X-axis
    tick labels (major_label_font_size=44) — about 27% bigger with no semantic reason
    (no rotation, not exceptionally long text) — reduce label_font_size toward ~46-48
    to bring the two axes into closer visual balance.
  - x_title 'Satisfaction Score' is descriptive but carries no explicit unit/scale
    cue (e.g. 'Satisfaction Score (-100 to +100)') — the tick range does communicate
    scale, but an explicit qualifier would remove any ambiguity.
  - Distinctive pygal features are used lightly (value_formatter, print_values_position,
    legend_at_bottom_columns) but nothing that leverages a truly pygal-unique capability
    beyond what most interactive charting libraries could replicate.
  - Data storytelling relies on sort order + color + in-bar labels alone; no annotation
    or callout highlights the standout departments (e.g. 'Customer Support' as the
    strongest, 'Return Process' as the weakest).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Customer Satisfaction Survey · bar-diverging · python · pygal · anyplot.ai" in dark ink, fully visible, not clipped at any edge. X-axis tick labels (-100..+100) and category row labels (Customer Support, Response Time, ..., Return Process) render in dark/soft-dark ink, all clearly legible against the light background. Grid is a subtle dotted vertical rule per x-tick. Legend ("Satisfied" / "Dissatisfied") sits centered below the plot in two columns, close to the chart, not isolated.
      Data: 10 horizontal bars diverge from a visible zero baseline. Positive bars (Customer Support +72 down to Price Value +31) render in brand green #009E73; negative bars (Mobile App -12 down to Return Process -45) render in matte red #AE3030. In-bar value labels use a +/- formatted number. Bars are sorted by value, grouping satisfied and dissatisfied departments together.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis ticks, category labels, and legend, all re-rendered in light ink (title/labels near-white, secondary text light gray) — fully legible against the dark background. Grid dots are faint and theme-adapted (light, low-opacity) rather than the light render's dark dots.
      Data: Same two data colors as the light render — #009E73 green for positive bars, #AE3030 red for negative bars — confirming the categorical data colors stay constant across themes while only chrome flips. In-bar value labels remain legible.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible against the dark surface.
