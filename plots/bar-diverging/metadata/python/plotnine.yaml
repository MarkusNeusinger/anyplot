review:
  strengths:
  - Semantic red/green encoding matches sentiment (positive vs negative) exactly as
    the spec suggests, with a clear zero-baseline geom_hline separating the two directions
  - coord_flip with an ordered categorical axis gives clean horizontal bars for the
    long category labels, and rows are sorted by value so the pattern reads top-to-bottom
    without extra effort
  - 'Theme-adaptive chrome is correctly threaded through: backgrounds, grid, axis
    text, and title all flip between #FAF8F1/#1A1A17 while the data colors (#009E73
    / #AE3030) stay identical across renders'
  - Deterministic, dependency-light code — hardcoded data, no functions/classes, only
    the imports that are actually used
  - Axis titles are descriptive with units ("Net Satisfaction Score (%)", "Product
    Category") and the mandated title format is exact
  weaknesses:
  - Positive/negative encoding relies on the classic red/green pair, which is a known
    CVD-confusable combination; direction (left vs right of zero) makes it non-sole-signal
    so this isn't disqualifying, but a colorblind-safer pair or a value-label redundancy
    would strengthen VQ-04
  - Design is competent but generic theme_minimal styling — no annotation calling
    out the standout categories (e.g. the +72 Mobile App leader or -62 Warranty laggard)
    that would sharpen the data storytelling
  - Library mastery is standard grammar-of-graphics usage (geom_bar + geom_hline +
    coord_flip); nothing distinctly plotnine-specific (e.g. stat layers, facets) is
    showcased beyond what any ggplot2-family library would do the same way
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "bar-diverging · python · plotnine · anyplot.ai" in dark ink, centered top. Y-axis category labels (Mobile App ... Warranty) and X-axis "Net Satisfaction Score (%)" title are both dark and clearly legible against the light background. Subtle vertical gridlines at -40/0/40. Legend box ("Sentiment": Negative/Positive) sits outside the plot area on the right with a thin border, fully readable.
      Data: 12 horizontal bars sorted from +72 (Mobile App, top) to -62 (Warranty, bottom). Positive bars are Imprint green (#009E73), negative bars are Imprint red (#AE3030). A darker vertical line marks the zero baseline, clearly separating positive and negative regions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same title, axis labels, and tick labels rendered in light ink (off-white/light gray), clearly legible against the dark background. No dark-on-dark text observed. Legend box border and text also legible in this theme.
      Data: Same 12 bars, same colors (#009E73 positive / #AE3030 negative) and same sort order as the light render — confirmed identical to the light render, only chrome (background, text, grid, legend frame) flipped.
      Legibility verdict: PASS
