review:
  strengths:
  - Magnitude-driven opacity encoding (alt.Opacity("magnitude:Q", ...)) creates genuine
    visual hierarchy — bars near zero fade while extreme scores pop, pulling the eye
    to the strongest signals
  - 'Correct application of the sentiment semantic-color exception per the Imprint
    palette rules: Positive maps to #009E73, Negative maps to #AE3030, with bar direction
    from the zero baseline as a redundant non-color cue'
  - Genuine (non-faked) interactivity via alt.selection_point on pointerover, producing
    a real hover highlight in the HTML export plus a proper tooltip encoding — legitimate
    use of Altair/Vega-Lite's grammar, not a static-image simulation
  - Rounded bar corners (cornerRadius=3) and a legend tucked into unused whitespace
    near the top-right avoid any overlap with the data bars
  - Theme-adaptive chrome correctly threaded through configure_axis/configure_legend/configure_title/configure_view
    — both light and dark renders are fully legible with identical data colors and
    theme-correct backgrounds
  - Data is sorted by value, realistic (customer-satisfaction survey by department),
    and spans the full positive/negative range a diverging bar chart needs to demonstrate
  - Canvas padding logic correctly follows the altair library rules (pad-only, never
    crop) and produced an exact 3200x1800 landscape PNG
  weaknesses:
  - configure_view(stroke=INK_SOFT) draws a full four-sided box around the plot area
    instead of the style guide's default L-shaped (left+bottom) or spineless chrome
    — a minor departure from the 'remove top/right spines' guideline that keeps the
    design from feeling fully refined
  - Title occupies only ~35% of the plot width at fontSize=16 — noticeably narrower
    than the 50-70% (or 70-85% for the long mandated string) the style guide describes
    as typical; not a defect, but there is headroom to grow the title slightly for
    more visual presence without risking overflow
  - Y-axis omits a title (title=None) relying on department names alone — a reasonable
    choice since the categories are self-explanatory, but 'Net Satisfaction Score'
    on the X-axis could optionally note the scale range (e.g. an index from -100 to
    100) for a reader unfamiliar with NPS-style scores
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold centered title "bar-diverging · python · altair · anyplot.ai" in dark ink, clearly visible. X-axis title "Net Satisfaction Score" (bold, dark) and tick labels (-60 to 60) are legible. Y-axis shows 12 department category labels in soft dark gray, all readable with no rotation or truncation. A "Sentiment" legend box (Positive/Negative swatches) sits in the empty upper-right region of the plot, bordered and filled with the elevated cream tone, not overlapping any bar. A thin vertical zero-baseline rule separates negative (left) from positive (right) bars. Faint vertical gridlines at each major tick are visible but subtle.
      Data: 12 horizontal bars sorted ascending by value, from Logistics (-45, deep red) at top to Customer Service (+42, deep green) at bottom. Bar opacity scales with magnitude — near-zero bars (Finance, HR) are pale/washed out while extreme bars (Logistics, Customer Service) are fully saturated. First/primary categorical color (Positive) is #009E73 brand green; Negative uses the semantic red anchor #AE3030, consistent with the sentiment-polarity exception in the style guide.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, tick labels, and legend now rendered in light ink/soft-gray tones, fully legible against the dark surface. Gridlines remain faint and unobtrusive. Legend box now uses the dark elevated fill (#242420) with a light border, still positioned in the same empty region without overlapping the bars.
      Data: Identical bar colors, ordering, values, and opacity treatment as the light render — #009E73 green for Positive, #AE3030 red for Negative, unchanged across themes. Only the chrome (background, text, grid, legend fill/border) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all text is light-colored against the near-black background, and the brand green remains clearly visible.
