review:
  strengths:
  - 'Correct semantic color mapping per the Imprint style guide''s polarity exception:
    positive bars use brand green (#009E73, slot 1), negative bars use matte red (#AE3030,
    slot 5) — matching the spec''s ''contrasting colors for positive and negative
    values'' requirement.'
  - Bars are sorted by value (ascending, most negative to most positive), exactly
    matching the spec Notes recommendation for pattern recognition.
  - Explicit zero baseline via add_vline gives an unambiguous divergence point, and
    horizontal orientation accommodates the longer department labels as the spec suggests.
  - 'Redundant encoding beyond color alone: bar direction (left/right of zero) plus
    explicit +/- signed data labels both convey polarity, mitigating red-green colorblind
    risk (VQ-04).'
  - 'Both light and dark renders are fully theme-compliant: correct #FAF8F1/#1A1A17
    backgrounds, all chrome (title, axis labels, ticks, gridlines, zero-baseline)
    threaded through theme tokens, identical data colors across themes.'
  - 'Verified via pixel-level crops: no text clipping at any canvas edge, no overlap
    between value labels and the zero-baseline line or adjacent bars, generous margins
    on both sides.'
  - Canvas gate passed (3200x1800 confirmed via file inspection), correct title format,
    deterministic hardcoded data (no seed needed), clean minimal imports, correct
    dual PNG+HTML output pattern.
  weaknesses:
  - Design excellence is solid but conventional — a well-executed standard diverging
    bar treatment without additional visual emphasis (e.g., a subtitle/annotation
    summarizing net sentiment, or highlighting the most extreme bar) that would elevate
    it further.
  - Library mastery relies on core go.Bar + add_vline + hovertemplate; doesn't showcase
    more distinctive Plotly capabilities (e.g. pattern_shape for redundant non-color
    encoding, richer shape/annotation layering, or custom hover cards with additional
    context fields) that would demonstrate deeper mastery of the library.
  - The green/red sentiment mapping is self-evident from the +/- signed data labels,
    but a one-line note or subtitle could make the color convention explicit for readers
    who skim past the labels — very minor, not required by spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-diverging · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Satisfaction Score (-100 to +100)" and y-axis title "Department" both dark ink, readable. Tick labels (department names on y, -100..100 on x) in softer grey-ink, legible. Subtle vertical gridlines at each x tick. Thicker zero-baseline line at x=0.
      Data: 10 horizontal bars, one per department, sorted ascending by value. Bars right of zero (Customer Support +72, Payment Options +68, Product Quality +58, Website Experience +45, Price Value +31, Product Variety +22) are brand green (#009E73, Imprint slot 1). Bars left of zero (Checkout Process -8, Mobile App -15, Delivery Speed -25, Return Policy -42) are matte red (#AE3030, Imprint slot 5). Each bar has a signed value label ("+72", "-42", etc.) in the same color as its bar, positioned just outside the bar end.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, department names, data labels) reads clearly against the light background; pixel-crop inspection confirmed no clipping at the left (department labels), right (+72 label), or zero-baseline (-8/-15 labels) regions.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light ink (#F0EFE8), clearly legible against the dark background. Axis titles in light ink, tick labels in lighter grey-ink (#B8B7B0), all legible. Gridlines are subtle light lines at low opacity, visible but not competing with data. Zero-baseline line rendered in the theme's soft-ink tone, clearly visible.
      Data: Identical bar values, ordering, and colors to the light render — brand green #009E73 for positive, matte red #AE3030 for negative, confirming data colors are held constant across themes. Value labels retain their bar's color and remain fully legible.
      Legibility verdict: PASS — no dark-on-dark failures found; all text elements (title, axis titles, tick labels, department names, data labels) are clearly readable against the near-black surface, and brand green/matte red both read well on the dark background.
