review:
  strengths:
  - 'Correct semantic color exception (brand green #009E73 for positive, matte red
    #AE3030 for negative) clearly documented in code comments, matching the Imprint
    palette''s documented semantic-anchor guidance'
  - Categories sorted ascending by value, creating an immediate visual hierarchy from
    worst to best net agreement
  - 'Clean, idiomatic Makie usage: horizontal barplot! via direction=:x, vlines! for
    the zero baseline, custom yticks tuple mapping categories to positions'
  - Theme-adaptive chrome correctly threaded through every element (title, axis labels,
    ticks, spines, grid) via INK/INK_SOFT/PAGE_BG tokens — both renders are fully
    readable
  - Realistic, neutral business scenario (employee engagement survey net-agreement
    scores) with plausible, factually sound values (-42 to +47 percentage points)
  - Spines minimized (only bottom spine visible, softly colored), subtle low-alpha
    x-gridlines, generous whitespace — polished, uncluttered layout
  weaknesses:
  - Positive/negative encoding leans on a red/green hue pairing; it is redundantly
    reinforced by bar direction relative to the zero baseline so it is not a sole
    signal, but a texture or shape cue would make it fully robust for color-vision-deficient
    readers
  - No value labels on the bars — annotating each bar with its exact net-agreement
    percentage would sharpen the data storytelling further (not required by spec,
    but would add polish)
  - The horizontal diverging-bar technique (direction=:x, vlines! baseline) is straightforward
    and could be reproduced with only minor syntax changes in another library — no
    strongly Makie-distinctive feature is leveraged
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Employee Engagement Survey · bar-diverging · julia · makie · anyplot.ai" is bold dark ink, clearly legible, comfortably sized (~40% of canvas width, well within the canvas with no clipping). Y-axis category labels (Compensation, Onboarding Process, Recognition, Workload Balance, Remote Flexibility, Team Collaboration, Management Support, Career Growth, Learning Resources, Company Culture) render in soft dark gray, fully readable. X-axis "Net Agreement (percentage points)" label and tick labels (-30, 0, 30) are dark/soft-gray and legible. A solid dark vertical line marks the zero baseline; subtle light vertical gridlines mark -30/0/30.
      Data: Ten horizontal bars, sorted ascending by value. Bars extending left of zero (Compensation -42, Onboarding Process -29, Recognition -15, Workload Balance -9) render in matte red (#AE3030). Bars extending right of zero (Remote Flexibility +6 through Company Culture +47) render in brand green (#009E73).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, category labels, axis label, and tick labels all render in light/soft off-white tones, clearly legible against the dark background. No dark-on-dark failures observed — every text element is distinctly visible. Zero-baseline line is a solid light/white vertical stroke; gridlines are subtle and visible.
      Data: Same ten bars in identical colors to the light render — matte red (#AE3030) for the four negative categories, brand green (#009E73) for the six positive categories. Confirmed identical hex values between themes; only chrome (background, text, grid, spine) flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background, brand green and matte red both read well on the dark surface.
