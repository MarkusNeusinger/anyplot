review:
  strengths:
  - 'All five Ichimoku lines are computed from the generated OHLC with the standard
    9/26/52 parameters and placed at the correct displacement: Senkou A/B start 26
    periods after their lookback fills and run 26 periods past the last candle, Chikou
    repeats the closes 26 periods to the left and stops short of the last candle'
  - Kumo segments are split at exact interpolated crossover points, so the tint switches
    cleanly from green to red where Span A and Span B cross (around May 10 and Jun
    20)
  - Composes ChartsContainer + LinePlot + ChartsGrid with a custom SVG layer driven
    by useXScale/useYScale, so candles, cloud and Chikou share the MUI band scale
    and axes with the native Tenkan/Kijun line series
  - Up/down candles carry a second cue beyond hue (hollow vs filled bodies), and Span
    B / Chikou are dashed, so the red-green encoding never rests on color alone
  - 'Both themes are correct: #FAF8F1 and #1A1A17 surfaces, theme-token ink for title,
    subtitle, axis titles and ticks, and identical Imprint data colors in both renders'
  weaknesses:
  - 'VQ-01, VQ-05 (both): every y tick label is truncated to ''162 U…'', ''150 U…''
    because the ''USD'' unit suffix does not fit the 84 px y-axis band, so the price
    ticks read as clipped text → full labels (''162 USD'') or the bare number with
    the unit only in the axis title. Likely cause: yAxis valueFormatter appending
    priceUnit with width: 84 (widen to about 110 px or drop the suffix).'
  - 'CQ-04 (code): the 9/26/52 rolling high-low midpoint is written out three times
    (lines 79–85, 91–97, 109–115) and the legend repeats eight near-identical item
    divs (lines 549–659) → one midpoint helper expression reused per period and an
    array of legend items mapped to one swatch+label template. Likely cause: copy-pasted
    blocks.'
  - 'Suggestion: the x axis draws a tick mark for every one of the 156 band positions,
    which reads as a dense comb under the dates; ticks only at the labelled positions
    would calm the axis.'
  - 'Suggestion: Senkou Span A shares the bullish-candle green; a slightly heavier
    stroke would separate it from the green candles where the cloud and candles overlap
    (Apr–Jun).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold title "indicator-ichimoku · javascript · muix · anyplot.ai" top-left, monospace subtitle "Ichimoku Kinko Hyo (9, 26, 52) · 130 trading periods (Jan 2 to Jul 1) + 26-period Kumo cloud projection"; y-axis title "Close price (USD)", x-axis title "Trading date"; dark ink text, subtle horizontal grid. Y tick labels are truncated to "162 U…" etc. (MUI band truncation), x ticks Jan 2 … Jul 19 in mono. Bottom HTML legend with 8 entries.
      Data: 130 candles, bullish hollow #009E73 outlines, bearish filled #AE3030; Tenkan-sen purple, Kijun-sen blue step lines; Senkou A solid green / Senkou B dashed red bounding a translucent cloud that starts ~Apr 17, turns red ~May 10, green again ~Jun 20 and runs ~26 periods past the last candle to late July; Chikou dashed amber shifted 26 bars left, ending ~late May.
      Legibility verdict: PASS (all text visible; y tick values truncated but the numbers remain readable)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and ticks in light ink, no dark-on-dark text; grid subtle but visible. Same y tick truncation "162 U…".
      Data: identical colors to the light render — green/red candles, purple Tenkan, blue Kijun, amber Chikou, green/red cloud (bearish cloud slightly more opaque, reads as dark maroon). Brand green clearly visible.
      Legibility verdict: PASS
