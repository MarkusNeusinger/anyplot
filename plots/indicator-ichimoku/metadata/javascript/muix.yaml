review:
  strengths:
  - All five Ichimoku components (Tenkan-sen, Kijun-sen, Chikou Span, Senkou Span
    A/B via the Kumo cloud) are correctly implemented, distinctly colored, and clearly
    legended
  - Correct forward-shift of Senkou spans (+26 periods) and backward-shift of Chikou
    span (-26 periods) — matches the spec's shift requirements precisely
  - Kumo cloud color flips at every A/B crossover (bullish green / bearish red), delivering
    exactly the 'at-a-glance' trend signal the spec calls for
  - 'Correct Imprint palette usage: candlesticks/Kumo use the finance semantic exception
    (brand green #009E73 for bullish, matte red #AE3030 for bearish); indicator lines
    use canonical palette order (lavender, blue, ochre)'
  - Theme-correct backgrounds and chrome in both light and dark renders, no text overlap,
    no edge clipping, descriptive axis labels with units
  - Idiomatic use of MUI X's ChartContainer + useXScale/useYScale composition pattern
    — the documented approach for chart types (candlesticks) outside the built-in
    community surface
  - Deterministic LCG-seeded data generation, no fetch/network calls, self-contained
    output
  weaknesses:
  - 'VQ-04: Bullish/bearish direction (candles AND Kumo cloud) is signaled solely
    via red/green hue with no redundant shape or pattern encoding — a deuteranopia/protanopia
    viewer loses the core ''at-a-glance'' trend signal the indicator exists to provide.
    Consider a subtle stroke, texture, or luminance differentiation between the bullish/bearish
    pairs.'
  - 'VQ-03: With 130 trading periods packed into the mount width, candlestick bodies
    render quite thin (~6-7 CSS px) — widen slightly (e.g. bandwidth * 0.7-0.75) for
    stronger visibility, especially at mobile scaling.'
  - 'Dark render: the ''Kumo (Bearish)'' red cloud fill (fillOpacity 0.22) reads much
    more subtly against the near-black background than the bullish green does — the
    two cloud states aren''t equally legible across themes. Consider a theme-adaptive
    opacity bump or a stroke on the dark render.'
  - 'DE-02: Axis lines are still drawn at close to MUI''s default weight/visibility
    rather than fully minimized — could be lightened further or removed in favor of
    the horizontal grid alone for a more refined look.'
  - 'CQ-01: Uses custom React components (Candlesticks, KumoCloud) beyond a flat script
    structure — reasonably justified since MUI X has no native candlestick and the
    ChartContainer composition pattern requires this, but noting for the record.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "TechCo Daily Price · indicator-ichimoku · javascript · muix · anyplot.ai" centered at top, fully readable. "Trading Date" (x) and "Price (USD)" (y) axis titles in dark ink, clearly readable. Tick labels ($145-$162 on y, "Jan 2"-"May 24" on x) in a softer dark gray, all legible. Subtle horizontal grid lines, faint axis lines. Legend row at bottom with 7 labeled swatches (Bullish/Bearish Candle, Tenkan-sen, Kijun-sen, Chikou Span, Kumo Bullish/Bearish), all readable.
      Data: Green (#009E73) and red (#AE3030) candlesticks for up/down days; lavender Tenkan-sen line; blue Kijun-sen line; dashed ochre Chikou Span line (visible for the first ~2/3 of the date range, as expected for a -26 period lag); Kumo cloud fills green when Senkou Span A is above B and red when B is above A, with the cloud correctly projected 26 periods into the future past the last candle.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, fully readable against the dark background. Axis titles and tick labels rendered in light gray tones, clearly legible — no dark-on-dark failures observed. Grid lines subtle but visible. Legend text light-colored and readable.
      Data: Candle, Tenkan-sen, Kijun-sen, Chikou Span, and Kumo cloud colors are identical to the light render (data hues do not shift with theme) — confirmed. One softer note: the bearish (red) Kumo cloud segment is noticeably more subtle against the near-black page than the bullish (green) segment is, making the two cloud states slightly less symmetric in legibility on dark vs. light.
      Legibility verdict: PASS — all text readable in the dark theme; data colors confirmed identical to light. Minor legibility asymmetry noted for the bearish Kumo fill (not a chrome/text failure).
