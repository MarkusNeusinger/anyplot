review:
  strengths:
  - Composes the chart with ChartsContainer + LinePlot and draws candles, Kumo and
    Chikou in a custom SVG layer that reads the shared band and linear scales through
    useXScale/useYScale, so every mark sits exactly on the MUI axes
  - Kumo tint changes at the interpolated crossover point of Span A and Span B rather
    than at the nearest bar, so the green/red boundaries sit where the spans actually
    cross
  - Senkou spans run 26 periods past the last candle into an empty future stretch
    of the date axis, and the Chikou Span ends 26 periods before the last candle,
    exactly as the spec describes
  - Hollow green up-candles versus filled red down-candles add a shape cue on top
    of the conventional green/red color
  - Header with a monospaced subtitle naming the parameters (9, 26, 52), the history
    window and the projection length gives clear typographic hierarchy; chrome is
    theme-correct in both renders
  weaknesses:
  - 'SC-03 (both): Senkou Span A is drawn only inside Kumo segments, so its first
    26 computed values (plotted from about Mar 14, where Kijun''s lookback is filled)
    are missing until Span B starts at about Apr 19 → draw Span A over every period
    where it has a value (−26 hidden points → 0). Likely cause: the Span A polyline
    is built from kumoSegments.spanAPts instead of from spanAArr.'
  - 'SC-02 (both): Senkou Span A uses the same #009E73 as the bullish candles and
    Span B the same red as the bearish candles, so inside the Apr 19–May cloud the
    Span A line merges with the green candle outlines and wicks, against the ''all
    five lines distinguishable from one another and from the candles'' property →
    give the spans line colors (or a weight/dash) that the candles do not use. Likely
    cause: stroke={BULL_COLOR} / stroke={BEAR_COLOR} on the span polylines.'
  - 'VQ-06 (both): the y-axis title reads ''Close price (USD)'' while the axis carries
    open/high/low/close candles and all five indicator lines → a title for the whole
    axis, e.g. ''Price (USD)''. Likely cause: yAxis label: CLOSE.'
  - 'Suggestion: the hollow bullish bodies are filled with the page color, which punches
    opaque boxes into the cloud; a transparent fill would let the Kumo show through
    them.'
  - 'Suggestion: a ChartsTooltip / axis highlight on the composed chart would add
    OHLC and indicator readouts in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold title "indicator-ichimoku · javascript · muix · anyplot.ai" top-left, monospaced subtitle "Ichimoku Kinko Hyo (9, 26, 52) · 130 trading periods (Jan 2 to Jul 1) + 26-period Kumo cloud projection"; y axis "Close price (USD)" 145–162, x axis "Trading date" with Jan 2 … Jul 19 ticks every 13 bars, subtle horizontal grid; HTML legend row at the bottom with nine entries. All text dark ink, readable.
      Data: 130 candles (hollow green #009E73 up, filled red down) with wicks; purple Tenkan-sen, blue Kijun-sen (stepped), green Senkou Span A solid and red dashed Senkou Span B bounding a translucent cloud (green Apr 19–May 10 and from late Jun to the end, red May 10–Jun 20); ochre dashed Chikou Span ending ~26 bars before the last candle; the cloud runs 26 periods past Jul 1 into an empty stretch to late Jul.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and legend text all in light ink; grid subtle; no dark-on-dark text.
      Data: identical colors to the light render (green, red, purple, blue, ochre); bullish candle bodies are hollow with the dark page color; red cloud slightly more opaque but same hue; Kijun blue lower in contrast but clearly visible.
      Legibility verdict: PASS
