review:
  strengths:
  - 'Excellent candlestick convention: hollow bullish / solid bearish bodies, a pattern
    cue redundant with hue for CVD accessibility.'
  - Kumo cloud is correctly segmented at every Span A/B crossover, with solid (bullish)
    vs. dashed (bearish) borders and a theme-adaptive opacity bump so the bearish
    fill reads as clearly on the dark page as the bullish fill.
  - Senkou Span A/B are shifted exactly 26 periods forward and Chikou Span exactly
    26 periods backward, matching the spec's definitions precisely.
  - Clean 7-item legend covers every plotted element (both candle types, both indicator
    lines, Chikou, both cloud states) without crowding.
  - Faithful use of the documented ChartContainer + useXScale/useYScale composition
    pattern for drawing candlesticks and cloud fills outside MUI X's native series
    types.
  weaknesses:
  - Title renders at only ~40% of plot width (fontsize auto-shrunk by the length formula)
    — readable and not a violation, but has room to sit closer to the 50-70% target
    for stronger visual hierarchy.
  - Tenkan-sen's lavender line falls below the style guide's own 3:1 WCAG contrast
    note on the light background; a thin ink-color stroke (as already used for the
    hollow candle bodies) would tighten the margin further.
  - Dense unlabeled daily tick marks along the x-axis baseline add minor visual noise;
    thinning to weekly minor ticks would clean up the axis.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "TechCo Daily Price · indicator-ichimoku · javascript · muix · anyplot.ai" is dark, bold, centered, fully visible with no clipping. Y-axis "Price (USD)" and x-axis "Trading Date" labels are dark and clearly legible. Tick labels ($145-$162, dated x-ticks every ~13 days) are readable dark-gray text. Legend row (7 items) at the bottom is fully readable dark-gray text on the cream background.
      Data: Candlesticks alternate hollow-green (bullish, outline #009E73 with page-colored fill) and solid matte-red (bearish, #AE3030) bodies with thin high-low wicks. Tenkan-sen is a lavender line, Kijun-sen a blue line, Chikou Span a dashed ochre line trailing the price action. The Kumo cloud fills green where Span A > Span B and a dashed-bordered red/pink where Span B > Span A, correctly re-segmenting at each crossover, with the cloud projecting into blank future dates beyond the last candle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all switch to light cream/gray text, clearly legible against the dark surface. No dark-on-dark text found anywhere (title, axes, ticks, legend all confirmed light-colored). Grid lines are faint and unobtrusive.
      Data: All data colors (candle green/red, Tenkan lavender, Kijun blue, Chikou ochre dashes, cloud green/red fills) are pixel-identical to the light render — only the chrome flipped, as required. The bearish (red) cloud fill uses a visibly higher opacity than in the light render so it stays equally legible against the near-black page; zoomed inspection confirms it is a clean solid fill, not a rendering artifact.
      Legibility verdict: PASS
