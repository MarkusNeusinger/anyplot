review:
  strengths:
  - Cloud coloring correctly flips green/red depending on whether Senkou Span A or
    B leads, exactly matching the bullish/bearish requirement in the spec notes.
  - Chikou Span (26 periods back) and Senkou Span A/B (26 periods forward) shifts
    are implemented precisely via the candleX/chikouX/senkouX index offsets, matching
    the spec's temporal-shift requirement.
  - 'Thoughtful, documented color semantics: red is reserved for bearish candles/cloud
    (finance convention), and the 5 Ichimoku lines fill the remaining Imprint palette
    slots in canonical order.'
  - Deterministic seeded LCG data generation with a two-cycle price walk that produces
    several genuine cloud color flips, giving a representative Ichimoku demo rather
    than a monotonic trend.
  - Both themes render correctly — background, chrome, and text adapt while all data
    colors (candles, lines, cloud tints) stay identical between light and dark.
  weaknesses:
  - Several helper functions (rollingMidpoint, drawAll, hexToRgba, addTradingDays)
    are used instead of a flat script — necessary since candlesticks/cloud aren't
    a native series in the core Highcharts bundle, but it still costs points against
    the KISS ideal.
  - Candlesticks and the Kumo cloud are manually drawn via renderer.path/rect rather
    than a native Highcharts series type — a justified workaround (highcharts-more/modules
    aren't loaded) but non-idiomatic base-series usage.
  - Candlestick up/down colors have no legend entry — relies on the reader knowing
    the green=up/red=down convention rather than an explicit label.
  - The cloud gives good general trend/hierarchy cues but there's no specific callout
    (e.g. the most recent Tenkan/Kijun crossover) to sharpen the storytelling focal
    point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matching the required light-theme surface — not pure white.
      Chrome: Title "Solara Robotics (SLRA) · indicator-ichimoku · javascript · highcharts · anyplot.ai" and subtitle in dark ink, clearly legible. X-axis "Trading Date" (rotated -35° tick labels, Jan 2 -> Nov 5) and Y-axis "Price (USD)" ($174-$208, $-prefixed ticks) both readable with soft gray-brown ink. Gridlines are subtle horizontal lines. Legend at bottom lists Tenkan-sen, Kijun-sen, Senkou Span A, Senkou Span B, Chikou Span in matching line colors.
      Data: Candlesticks in green (#009E73, up) / red (#AE3030, down); Tenkan-sen green, Kijun-sen purple, Senkou Span A blue, Senkou Span B orange, Chikou Span dashed cyan. Kumo cloud fills green when Span A leads, red/pink when Span B leads (visible flip around Aug-Sep). First series (Tenkan-sen) is the brand green #009E73 as required.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matching the required dark-theme surface — not pure black.
      Chrome: Title and subtitle render in light/white ink, clearly legible. Axis titles and tick labels use a lighter soft-gray ink that reads well against the dark background. Gridlines remain subtle but visible. Legend text is light-colored and legible.
      Data: All data colors (candles, five indicator lines, cloud tints) are visually identical to the light render — only the chrome (background, text, grid) has flipped, as required. No dark-on-dark issues; every tick label, axis title, and legend entry is clearly distinguishable from the near-black background.
      Legibility verdict: PASS - all text is clearly readable against the dark background, no dark-on-dark failures observed.
