review:
  strengths:
  - 'Close price drawn as a 6px solid #009E73 line that stays the dominant series,
    with the three SMAs overlaid at 5px in Imprint positions 2-4 and a distinct dash
    pattern each'
  - SMAs computed with pandas rolling().mean() so each starts only once its window
    is full; SMA 200 appears in October as expected
  - Theme tokens threaded through title, axes, ticks, legend and grid; both renders
    readable
  - Native Bokeh HoverTool in vline mode with datetime and currency formatters gives
    exact values in the HTML output
  - Regime-shift data makes a death-cross dip and a later golden cross of SMA 50 over
    SMA 200 visible
  weaknesses:
  - 'VQ-03 (dark): the SMA 50 dash-dot line in #4467A3 and the SMA 200 dotted line
    break into short faint segments on the #1A1A17 background, and the SMA 200 legend
    sample is barely visible → longer dash segments (e.g. ''dashed'' or a [24, 12]
    pattern) for the two longer SMAs so their ink coverage matches SMA 20. Likely
    cause: line_dash ''dashdot'' and ''dotted'' at line_width=5.'
  - 'Suggestion: a slightly wider legend glyph_width with longer dash samples would
    make each pattern easier to match to its line.'
