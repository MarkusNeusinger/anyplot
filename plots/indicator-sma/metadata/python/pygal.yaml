review:
  strengths:
  - Close drawn solid in brand green with SMAs as dashed overlays whose dash length
    grows with the period, so the four series separate by hue and pattern in both
    themes
  - Warm-up NaNs become None, so SMA 20/50/200 start exactly where their windows fill
    (C4)
  - Grid colored from INK_MUTED via guide_stroke_color, visible but subtle on both
    pages
  - value_formatter gives dollar-formatted tooltips in the interactive HTML
  weaknesses:
  - 'VQ-03 (both): the close line at stroke width 5 reads barely heavier than the
    4-px SMA 200, so the price''s dominance (C1) rests on color alone → close about
    7-8 px (+2 to +3). Likely cause: chart.add(CLOSE, ..., stroke_style={''width'':
    5}).'
  - 'CQ-01 (code): a def to_list() helper function breaks the flat imports → data
    → plot → save structure → inline it, e.g. df[col].astype(object).where(df[col].notna(),
    None).tolist(). Likely cause: the to_list helper.'
  - 'Suggestion: the ''Lowest close'' tooltip label only shows in the HTML; a static
    reader sees no focal point.'
