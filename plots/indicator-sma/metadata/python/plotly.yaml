review:
  strengths:
  - Close line drawn heavier (2.5 px) than the SMAs (1.75 px), so the price stays
    the dominant series in both themes
  - Each SMA begins only where its window is full (rolling().mean() leaves the warm-up
    NaN), so SMA 50 and SMA 200 visibly start later
  - Imprint positions 1-4 in canonical order, identical in both renders; all chrome
    threaded through theme tokens
  - Legend placed in the empty lower-right region so no line is covered
  - hovermode='x unified' with per-trace hovertemplates gives a synced price/SMA readout
    in the HTML
  weaknesses:
  - 'Suggestion: drop the legend''s box frame (the style guide''s decoration checklist
    lists it) and let the legend sit on the page.'
  - 'Suggestion: plotly''s rangeselector or rangeslider would let HTML viewers zoom
    into the crossover stretches.'
