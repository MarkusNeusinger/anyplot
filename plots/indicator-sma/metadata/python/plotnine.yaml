      Data: price #009E73 drawn thickest on top; SMA 20 lavender #C475FD, SMA 50 blue #4467A3, SMA 200 ochre #BD8233. Range-bound phase to about June 2023 where the lines braid, then a rally to about 3,200 with the SMAs fanning out in period order. SMA 200 begins late March 2023. Two amber dashed verticals (golden crosses, late March and early July 2023) and one grey dashed vertical (death cross, mid-May 2023).
