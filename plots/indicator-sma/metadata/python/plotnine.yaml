review:
  strengths:
  - Every SMA is a pandas rolling mean that stays NaN until its window is full and
    is dropped, so SMA 20/50/200 start later in order and never join the axis
  - Price drawn last and thicker than the SMAs, keeping the close the dominant series
    in both themes
  - Theme tokens threaded through title, axis titles, ticks, axis lines, grid and
    the elevated legend card; data colors identical across themes
  - 'Idiomatic plotnine: tidy melt, scale_color_manual with limits for legend order,
    scale_x_datetime with date_breaks and date_labels'
  - 'Data scenario follows the change request: daily crypto close from 2022-09-01
    over 480 days, range-bound then an exponential rally, so the SMAs cross in the
    flat phase and fan out in period order in the rally'
  weaknesses:
  - 'Suggestion: the golden/death-cross dashed lines carry no key or label, so a reader
    cannot tell what the amber and grey lines mean; a legend entry or short label
    would make them readable.'
  - 'Suggestion: the legend card leaves a band of empty space above its first entry;
    tightening the legend''s top margin would balance it.'
