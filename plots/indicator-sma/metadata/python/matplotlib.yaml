review:
  strengths:
  - Legend placed in reserved y headroom as a single four-column row, so it never
    sits on the price or SMA lines in either theme
  - SMAs computed with pandas rolling().mean(); each starts only when its window is
    full, SMA 200 covering the last third as the spec permits
  - Column constants with role comments keep the plot block data-agnostic
  - Exact 3200x1800 canvas through figsize/dpi and subplots_adjust, no bbox_inches
    trimming
  - mdates MonthLocator/DateFormatter with autofmt_xdate give a clean monthly date
    axis
  weaknesses:
  - 'Suggestion: the 30 % headroom leaves an empty band above 170; a tighter headroom
    sized to the legend''s height would give the data more vertical room.'
