  - 'Close price drawn solid and heaviest in #009E73 while the SMAs use thinner, period-graded
    dash patterns, so the price stays the dominant series and every line is distinguishable
    without hue'
  - 'Correct rolling windows: each SMA starts only where its window is full (SMA 200
    from mid-July 2025), with null gaps rather than back-fill'
