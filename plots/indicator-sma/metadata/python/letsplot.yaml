review:
  strengths:
  - Close drawn at size 1.8 against SMAs at 1.0, so the price stays the dominant series
    in both themes
  - 'Imprint palette in canonical order with Close as #009E73 and each SMA in its
    own distinct color'
  - pandas rolling(20/50/200) leaves the warm-up rows empty, so each SMA starts only
    where its window fills and SMA 200 begins in October
  - 'Full theme-token chrome: text, grid (INK at 15 %) and legend frame flip correctly
    between #FAF8F1 and #1A1A17'
  - Tidy melt into one Series column with scale_color_manual(breaks=...) keeps the
    legend order Close, SMA 20, SMA 50, SMA 200
  - HTML export carries lets-plot's native hover tooltips for reading exact prices
  weaknesses:
  - 'DE-02 (both): the panel is enclosed by all four spines (top and right lines visible)
    where nothing requires them → keep only the left and bottom axis lines, or none.
    Likely cause: theme_minimal() plus axis_line=element_line(color=INK_SOFT) leaves
    a panel border; set panel_border=element_blank().'
  - 'Suggestion: the subtitle invites the reader to watch for golden/death cross signals,
    but SMA 50 never crosses SMA 200 in this window; a subtitle that describes what
    the chart actually shows would read more honestly.'
  - 'Suggestion: an x-axis tick at Jan ''24 would anchor the start of the series,
    which currently begins before the first labelled tick.'
