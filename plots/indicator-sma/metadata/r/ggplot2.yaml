review:
  strengths:
  - 'Tidy long-format pipeline: one geom_line with color and linewidth mapped to series,
    scale_linewidth_manual plus guides(linewidth = ''none'') keeps the price dominant
    with a single legend'
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with identical data colors
  - SMAs computed with stats::filter(sides = 1), so each starts only where its window
    is full and the NA warm-up is simply not drawn
  - Date axis via scale_x_date(date_breaks = '3 months') and dollar-formatted price
    ticks
  weaknesses:
  - 'CQ-01 (code): line 38 defines a trailing_mean() helper function, against the
    no-functions structure → compute the three SMA columns inline with as.numeric(stats::filter(close_price,
    rep(1 / k, k), sides = 1)) for k = 20, 50, 200 inside the tibble() call. Likely
    cause: wrapping the filter call to avoid repeating it.'
  - 'Suggestion: a descriptive ticker-style context (e.g. a named fictional company)
    in the title prefix would make the scenario read less generic.'
