review:
  strengths:
  - Theme-adaptive chrome is implemented perfectly — both light and dark renders swap
    background, ink, tick, spine, and grid tokens correctly while all four data series
    (Close green + SMA 20/50/200) keep bit-identical hex colors across themes.
  - Correct canonical Imprint palette order (green → lavender → blue → ochre) with
    the brand green always on the Close series (first series rule).
  - 'Data faithfully demonstrates the spec''s core teaching point: SMA 200 only appears
    after trading day 200 due to its 200-period window, and the noisy Close line vs.
    the three smoothed SMA overlays gives a natural, readable visual hierarchy with
    visible SMA20/SMA50 crossovers.'
  - 'Clean, idiomatic KISS-structured code: explicit theme constants, list-comprehension
    SMA calculation, no functions/classes, reproducible via Random.seed!(42), and
    uses the current Makie `size=` kwarg rather than the deprecated `resolution=`.'
  - Legend (top-left) never collides with the Close line's early peak or any other
    series — verified by pixel-cropping the region; no overlap in either render.
  weaknesses:
  - 'Design Excellence is competent but generic: correct Imprint colors and clean
    spine/grid removal, but no visual emphasis on the golden-cross/death-cross crossover
    moments that are the entire point of a multi-period SMA overlay per the spec''s
    Applications section. Consider a subtle crossover marker/annotation or emphasis
    technique to give the chart a clearer story (raises DE-03), plus a touch more
    typographic/layout refinement (raises DE-01/DE-02).'
  - Title occupies only ~20% of the plot width at titlesize=20 — well under the ~50-70%
    guideline band for a title this short. Not a legibility failure, but growing it
    slightly (titlesize ≈ 22-24) would give the header more visual presence and better
    balance the generous whitespace above the plot.
  - Library Mastery is generic — only the most common Makie constructs are used (Axis
    + lines! + axislegend), nothing distinctive to Makie (e.g. a Legend as its own
    layoutable block, text!/annotate! call-outs at the crossover points, or an Observables-driven
    touch). Leaning into a Makie-specific capability would raise LM-02 from its default
    floor.
  - Spec's Data section lists `date (datetime)` as the time field, but the implementation
    plots an integer `Trading Day` index (1..300) instead of literal calendar dates.
    This is a common, readable convention for technical-indicator charts and not a
    mapping error, but it's a minor step away from the literal spec schema — real
    calendar dates (even synthetic ones via a date range) would sharpen realism.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "indicator-sma · julia · makie · anyplot.ai" centered at top; "Trading Day" x-axis label and "Closing Price ($)" y-axis label in dark ink; secondary tick labels in a softer gray-brown; subtle horizontal y-axis-only gridlines; top/right spines removed, left/bottom spines kept in a muted tone; frameless top-left legend listing Close, SMA 20, SMA 50, SMA 200. All chrome elements are clearly readable against the light background.
      Data: Close line in brand green (#009E73), noisy/jagged, spanning the full 300-trading-day range from ~$180 up to a ~$200 peak, down to a ~$135 trough, and back up near the end. SMA 20 (lavender), SMA 50 (blue), and SMA 200 (ochre) are smooth overlays; SMA 200 only appears from trading day ~200 onward, consistent with its 200-period window needing that many prior points. Crossovers between the Close line and the SMA lines, and between the SMAs themselves, are visible throughout.
      Legibility verdict: PASS — all text sizes are explicit and legible at full resolution; no overlap between the legend and the data (confirmed via a pixel crop of the top-left region).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/axis-label/tick-label layout as the light render but flipped to light-colored text (off-white title/axis labels, softer light-gray tick labels); gridlines and spines flipped to light, low-opacity tones; legend text also flipped to light color.
      Data: All four series render in the identical hex colors as the light render (#009E73 Close, lavender SMA 20, blue SMA 50, ochre SMA 200) — only the chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark text; every title/axis-label/tick-label/legend element is clearly legible against the near-black background. Brand green remains vivid on the dark surface.
