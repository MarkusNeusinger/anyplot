review:
  strengths:
  - Canonical Imprint palette correctly applied — the AURA Close line is brand green
    (#009E73), and the three SMA overlays use the next palette positions in canonical
    order (lavender SMA 20, blue SMA 50, ochre SMA 200) — fully identical between
    light and dark renders, only chrome flips.
  - 'Correct title format: descriptive "AURA" prefix plus the mandated `indicator-sma
    · javascript · muix · anyplot.ai` suffix; legend labels exactly match the spec''s
    suggested naming ("SMA 20", "SMA 50", "SMA 200").'
  - 'Longer SMA windows correctly show delayed onset (connectNulls: false) matching
    the spec''s note that ''longer SMAs will have more initial null values'' — visibly
    SMA 200 only starts around March in a chart beginning in June.'
  - Deterministic, seeded synthetic data (fixed-seed LCG) tells a real three-regime
    story — uptrend, then a choppy pullback (death cross), then a recovery uptrend
    (golden cross) — visibly demonstrating the crossover signals called out in the
    spec's Applications section.
  - 4-series differentiation uses color AND linestyle (dashed/dotted/solid) plus a
    thicker stroke for the primary Close line, a good CVD-safe redundant encoding
    at this series count.
  - Explicit font sizing throughout (title 22px, axis labels 16px, ticks/legend 14px)
    and idiomatic MUI X Charts usage — time xAxis scale, $-formatted yAxis, slotProps
    for legend placement, per-series sx targeting for stroke styling.
  weaknesses:
  - Title occupies only ~33% of canvas width even with the descriptive "AURA" prefix
    — below the ~50-70% target for a custom-prefixed title. Consider a slightly larger
    title fontSize (e.g. 24-26px) to give it more visual weight and improve the typography
    hierarchy (DE-01).
  - Design still reads close to a well-configured library default rather than a strongly
    art-directed chart — consider a stronger DE-03 storytelling touch, e.g. a subtle
    annotation or marker at the golden-cross / death-cross moments the synthetic data
    already encodes, since the spec's Applications section calls those out explicitly.
  - 'LM-02: the sx-based per-series dasharray targeting is a genuine MUI X-specific
    mechanism, but the visible result (dashed/dotted overlay lines) is easily replicated
    in any charting library — a more MUI X-distinctive touch (e.g. richer tooltip/axis-highlight
    configuration visible in the HTML output) would raise distinctiveness further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "AURA · indicator-sma · javascript · muix · anyplot.ai" in bold dark ink, top-left. Legend (SMA 200 / SMA 50 / SMA 20 / AURA Close) centered top with color swatches. Y-axis "Price (USD)" with $-formatted ticks ($66-$90), X-axis "Trading Date" with month ticks (Jun 1-Aug 1). Subtle horizontal gridlines only. All chrome text is dark and clearly readable against the light background.
      Data: AURA Close is a thick solid brand-green (#009E73) line showing daily volatility across an uptrend/pullback/recovery pattern. SMA 20 is a dashed lavender/purple line, SMA 50 a dotted blue line, SMA 200 a solid ochre line that only begins around March (correctly delayed due to its 200-period window). Lines are clearly distinguishable via both color and dash pattern.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
