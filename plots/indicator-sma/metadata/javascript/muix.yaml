      Data: Line colors are pixel-identical to the light render (brand green close line, lavender/blue/ochre SMA overlays) — only the chrome (background, text, gridlines) flipped, as required. Gridlines are a subtle light-on-dark horizontal pattern, not competing with the data.
      Legibility verdict: PASS
