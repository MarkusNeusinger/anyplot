review:
  strengths:
  - 'Clear line hierarchy: the 3 px solid close is drawn on top, and the three SMAs
    are told apart by hue (Imprint 2–4) and by dash pattern, which keeps them distinguishable
    under CVD'
  - SMAs are computed from running sums and left null until their windows fill, so
    SMA 50 and SMA 200 start visibly later and are never back-filled
  - The pullback-and-recovery scenario produces both upward and downward SMA 20/50
    crossovers, marked with theme-adaptive triangles drawn through the useXScale/useYScale
    hooks and counted in the subtitle
  - Uses the v9 composition API (ChartsDataProvider, ChartsWrapper, ChartsSurface)
    with a time axis whose valueFormatter shows months on ticks and full dates in
    the axis tooltip (HTML output)
  - The legend order is reversed to read close first, then SMAs by ascending period,
    while the draw order keeps the close on top
  weaknesses:
  - 'VQ-03 (both): the legend shows solid swatches for SMA 20 and SMA 50, while the
    plotted lines are dashed (8 5) and dotted (2 4), so the legend glyphs do not match
    the marks they explain → legend samples carrying the same dash pattern as each
    line. Likely cause: labelMarkType "line" renders a plain bar; the strokeDasharray
    rules only target .MuiLineChart-line inside ChartsSurface, not the legend mark.'
  - 'Suggestion: the dotted SMA 50 (#4467A3, 2–4 px dots) reads dimmest of the four
    lines on the dark background; a slightly denser dot pattern would give it more
    presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "indicator-sma · javascript · muix · anyplot.ai", grey subtitle with period range and crossover counts (▲ 2×, ▼ 2×), centred horizontal legend, y axis "AURA close (USD)" 64–78, x axis "Trading date" with month ticks Jun 2023 – Jul 2024, subtle horizontal grid. All text is readable.
      Data: close in brand green #009E73 (3 px solid, top layer); SMA 20 lavender dashed from late Jun 2023; SMA 50 blue dotted from Aug 2023; SMA 200 ochre solid from Mar 2024. Four black triangles with page-coloured outlines mark the SMA 20/50 crossovers (Sep 2023 ▼, Mar 2024 ▲, May 2024 ▼, Jun 2024 ▲). Legend swatches are solid bars, not dashed or dotted.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and ticks flip to light ink; grid lines subtle but visible. No dark-on-dark text.
      Data: identical colours to the light render (green, lavender, blue, ochre); crossover triangles flip to light fill. The dotted blue SMA 50 is the dimmest line but still traceable.
      Legibility verdict: PASS
