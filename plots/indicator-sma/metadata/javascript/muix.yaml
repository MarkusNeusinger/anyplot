review:
  strengths:
  - New ChartsReferenceLine annotations mark the Death Cross / Golden Cross moments
    the synthetic data already encodes, directly answering attempt 1's DE-03 feedback
    and the spec's Applications section — a real, native MUI X feature, not a simulated
    tooltip.
  - Title fontSize increased from 22px to 28px, giving the descriptive "AURA" prefix
    more visual weight per attempt 1's VQ-01/DE-01 feedback.
  - Canonical Imprint palette correctly applied — AURA Close is brand green (#009E73),
    SMA overlays use the next palette positions in canonical order — fully identical
    between light and dark renders, only chrome flips.
  - 'Longer SMA windows correctly show delayed onset (connectNulls: false); SMA 200
    visibly only starts around March, matching the spec''s note about initial null
    values.'
  - 4-series differentiation via color AND linestyle (dashed/dotted/solid) plus a
    thicker Close stroke — CVD-safe redundant encoding at this series count.
  - Deterministic, seeded synthetic data tells a real three-regime story (uptrend
    -> pullback/death-cross -> recovery/golden-cross) that the new annotations now
    explicitly label.
  weaknesses:
  - Title still occupies only ~43% of canvas width (up from ~33% at fontSize 22, still
    short of the ~50-70% target for a custom-prefixed title) — a further fontSize
    nudge (e.g. 30-32px) could close the remaining gap, though this is a minor, non-blocking
    deduction.
  - DE-02 visual refinement (grid styling, spine/frame treatment) is unchanged from
    attempt 1 — still reads close to a well-configured default rather than fully art-directed.
