review:
  strengths:
  - 'The close is the dominant series in both renders: 3 px solid brand green #009E73
    drawn last, on top of the three SMAs, which use Imprint positions 2-4 with distinct
    dash patterns (dashed, dotted, solid) so they stay apart even without color.'
  - 'Each SMA is computed from running sums over the last 20, 50 and 200 closes and
    stays null until its window is full: SMA 20 starts late Jun 2023, SMA 50 mid Aug
    2023, SMA 200 only in Mar 2024, never back-filled or drawn from zero; the short
    SMA hugs the price while SMA 200 is the flattest line.'
  - Legend samples carry each series' own dash pattern through labelMarkType, so the
    legend glyphs match the plotted lines exactly in both themes; the legend reads
    close, then SMA 20/50/200 by ascending period.
  - 'Composed MUI X API used idiomatically: ChartsDataProvider + ChartsSurface with
    LinePlot, ChartsGrid horizontal, axis-trigger ChartsTooltip and ChartsAxisHighlight
    for the HTML view, and a valueFormatter that switches between month ticks and
    full dates via context.location.'
  - 'All chrome is threaded from ANYPLOT_TOKENS (pageBg, ink, inkSoft, grid): both
    renders are theme-correct with identical data colors, animations are skipped,
    and the data is deterministic via a seeded LCG.'
  weaknesses:
  - 'Suggestion: the y-axis title repeats the close column (''AURA close (USD)'')
    although the axis also carries the three SMAs; a shared title such as ''AURA price
    (USD)'' would describe all four lines.'
  - 'Suggestion: the dotted SMA 50 in Imprint blue is the quietest line on the dark
    background; a slightly longer dot pattern would give it more presence next to
    the dashed SMA 20.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area, not pure white.
      Chrome: bold title "indicator-sma · javascript · muix · anyplot.ai" centered at top, a soft-ink subtitle with the date range and crossover counts, a horizontal legend (AURA close, SMA 20, SMA 50, SMA 200 in USD) with dash-matched line samples, y-axis "AURA close (USD)" 64-78, x-axis "Trading date" with monthly ticks Jun 2023 - Jul 2024, subtle horizontal grid lines. All text dark and readable.
      Data: close as a thick solid brand-green #009E73 line; SMA 20 dashed purple, SMA 50 dotted blue, SMA 200 solid ochre. SMA 20 starts late Jun 2023, SMA 50 mid Aug 2023, SMA 200 in Mar 2024. Price peaks ~77 in Aug, falls to ~64.5 in Feb 2024 and recovers to ~75. Four small ink triangles mark SMA 20/50 crossovers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend, axis titles and tick labels in light ink, all clearly readable; grid lines subtle but visible; no dark-on-dark text.
      Data: identical colors to the light render (green close, purple/blue/ochre SMAs); the crossover triangles flip to light ink with a page-colored outline and remain visible. Dotted SMA 50 is the quietest line but clearly visible.
      Legibility verdict: PASS
