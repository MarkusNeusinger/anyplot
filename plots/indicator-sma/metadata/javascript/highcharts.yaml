review:
  strengths:
  - Correct Imprint palette compliance (green Close, canonical purple/blue/ochre SMAs)
    with theme-correct chrome in both light and dark renders
  - Explicit font sizing throughout (title 22px, axis titles 16px, ticks/legend 14px)
    with no overlap or overflow in either theme
  - SMA math is correct (rolling-window average) and null-gaps appear exactly where
    windows haven't filled yet (SMA 200 starts ~Oct 2023), matching the spec's note
    about longer SMAs having more initial nulls
  - Realistic, neutral stock-price data with visible uptrends/downtrends and multiple
    SMA crossovers (golden/death cross moments visible around Jul 2023 and Jan 2024)
  - Deterministic seeded LCG + Box-Muller data generation, clean imports, no fake
    interactivity
  weaknesses:
  - Design Excellence sits at "well-configured default" level — grid, spines, and
    legend only meet the mandatory theme baseline with no bespoke polish beyond the
    required tokens
  - No visual hierarchy/storytelling calls out the golden-cross / death-cross moments
    that the spec's Applications section names as the primary use case — consider
    a plotLine/annotation at 1-2 crossover dates to spotlight the trend signal
  - Library Mastery doesn't leverage a Highcharts-distinctive feature — the current
    option set (colors, xAxis/yAxis, legend, series) would translate almost 1:1 to
    Chart.js or ECharts; consider xAxis.plotBands for a notable trend regime or a
    richer custom tooltip formatter
