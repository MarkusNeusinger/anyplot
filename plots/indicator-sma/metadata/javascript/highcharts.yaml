review:
  strengths:
  - 'Directly addresses the attempt-1 headline weakness: xAxis.plotLines now spotlight
    the golden-cross / death-cross moments the spec calls the primary application,
    computed dynamically from the actual generated SMA-50/SMA-200 series so the label
    always matches what the lines really do'
  - 'Distinctive Highcharts usage: declarative plotLines with styled labels plus a
    custom shared tooltip formatter that reports each SMA''s percent delta versus
    Close, not just raw values'
  - Thoughtful semantic color use for the crossover markers -- golden cross uses brand
    green (bullish), death cross uses the amber anchor (cautionary) rather than an
    arbitrary palette slot
  - Visual depth hierarchy added via line width and zIndex layering (Close thickest
    and frontmost at zIndex 4, SMAs progressively behind) plus distinct dash styles
    per SMA period
  - Imprint palette compliance and theme-correct chrome preserved in both renders
    (identical data colors, correct backgrounds, all text legible)
  - SMA math remains correct with null-gaps appearing exactly where each window hasn't
    filled, deterministic seeded data generation, clean code with no fake interactivity
  weaknesses:
  - Only a Death Cross plotLine appears in this generated series (no Golden Cross
    occurs in the 300-period window), so the golden-cross styling path is never visually
    demonstrated -- acceptable since it's data-driven and honest, but the chart only
    tells half of the spec's headline story
  - Design Excellence is still closer to an enhanced default than a bespoke composition
    -- grid, spacing, and typography are unchanged from the baseline theme tokens
    beyond the new crossover callout and line hierarchy
  - The tooltip's SMA-vs-Close delta formatter is a nice touch but is invisible in
    the static PNG preview -- it only pays off in the HTML detail view
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "indicator-sma · javascript · highcharts · anyplot.ai" in bold dark ink is fully legible; y-axis title "Closing Price (USD)" and tick labels in dark gray are readable; subtle horizontal gridlines on the y-axis only; legend below the plot (Close, SMA 20, SMA 50, SMA 200) with color swatches is fully legible; a dashed amber vertical plotLine near Dec 2023 is labeled "Death Cross" in dark bold text, clearly readable and not overlapping any other element.
      Data: Close renders in brand green (#009E73), SMA 20 in lavender, SMA 50 in blue (dotted/short-dash), SMA 200 in ochre (long-dash) -- matching canonical Imprint order. Close is visually prominent (thicker line, highest zIndex) over the three SMA lines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title, axis title, tick labels, and legend text all render in light gray/off-white, clearly legible against the dark background; gridlines remain subtle but visible; the "Death Cross" plotLine label renders in light text against the dark background, fully readable -- no dark-on-dark failure.
      Data: Colors are identical to the light render (green/lavender/blue/ochre and the amber plotLine) -- confirming only chrome flipped.
      Legibility verdict: PASS
