review:
  strengths:
  - 'Exact Imprint theme compliance: background pixel-sampled at #FAF8F1 (light) and
    #1A1A17 (dark), first series #009E73, canonical palette order (green/lavender/blue)
    preserved identically across both themes'
  - 'Correct SMA warm-up handling: connectNulls=false with a manual sma() window function
    correctly truncates each line''s start (day 20/50/200) instead of drawing a flat
    or interpolated lead-in, matching the spec''s note about initial null values'
  - 'Thoughtful visual hierarchy: the raw Close line is rendered thin and at 55% opacity
    while the three SMA overlays are bold and fully opaque, letting the smoothed trend
    lines read as the focal point'
  - 'Clean, deterministic, KISS-structured code: seeded LCG for price generation,
    no unused imports, correct mount-node contract (no explicit width/height/devicePixelRatio
    on echarts.init), animation disabled'
  - No edge clipping and no overlap in either render; y-axis gridlines present as
    requested by the spec, x-axis gridlines correctly suppressed to reduce clutter
  weaknesses:
  - Only 260 periods are generated, which is the bare minimum of the spec's 250-500
    range — the 200-period SMA is only valid for the last ~60 points (about 3 months),
    too short a window to demonstrate 'meaningful long-term SMA behavior' as the spec
    requires; increase to 400-500 periods so SMA 200 has substantial history
  - None of the three SMAs ever cross each other (SMA 200 stays below SMA 50/20 for
    its entire visible range) — the spec's own Applications section highlights golden-cross/death-cross
    detection as a core use case for this chart type; tune the price drift/noise so
    at least one crossover between SMA lines (or between Close and an SMA) is visible
  - The Close line is de-emphasized (55% opacity, 1.5px width) relative to the spec's
    instruction to 'display the price/close line prominently' — consider raising its
    opacity/width slightly (e.g. opacity 0.7-0.8) so it still reads as the primary
    series while the SMA overlays remain the trend highlight
  - The legend swatch for 'Close' renders as a fully opaque dark circle (itemStyle
    uses t.ink with no opacity) while the actual line is drawn at 55% opacity — align
    the legend swatch opacity with the line style for visual consistency
  - 'Library Mastery is generic: the chart could be reproduced nearly identically
    in Highcharts/Chart.js/D3 with the same structure; consider an ECharts-distinctive
    touch such as a markLine/markPoint to flag a crossover event, or markArea to shade
    a golden-cross zone, which would also help address the crossover-visibility weakness
    above'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at RGB(250,248,241) = #FAF8F1 — exact match, not pure white.
      Chrome: Title "indicator-sma · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible; legend below it ("Close", "SMA 20", "SMA 50", "SMA 200") in soft dark gray; y-axis title "Price (USD)" and tick labels in soft dark gray, all crisp against the light background; x-axis time ticks (Mar/May/Jul/Sep/Nov) legible; horizontal y-axis gridlines subtle and visible, x-axis gridlines intentionally suppressed.
      Data: Close line is a thin, semi-transparent dark-gray line showing daily noise; SMA 20 is a bold brand-green (#009E73) line; SMA 50 is a bold lavender/purple line; SMA 200 is a bold blue line appearing only for the final ~60 points (Nov onward) since it needs 200 prior periods to compute. All four lines trend upward from ~$148 to ~$190 over the year, with SMA 20 tracking closest to Close and SMA 50/200 progressively smoother/lagged.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlap, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB(26,26,23) = #1A1A17 — exact match, not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light/soft-white ink, clearly legible against the dark background; gridlines remain subtle; no dark-on-dark text anywhere.
      Data: Same four series in identical colors to the light render — Close (dark-gray/faded), SMA 20 (#009E73 green), SMA 50 (lavender), SMA 200 (blue) — confirming data colors are unchanged between themes and only chrome (background/text) flipped.
      Legibility verdict: PASS — all chrome text is clearly readable against the dark background; brand green remains highly visible; no dark-on-dark or light-on-light failures observed.
