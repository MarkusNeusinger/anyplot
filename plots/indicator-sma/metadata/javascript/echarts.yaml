review:
  strengths:
  - 'Correct Imprint palette order: SMA 20 = #009E73 (brand green, first categorical
    series), SMA 50 = lavender, SMA 200 = blue; Close line uses the theme-adaptive
    ink token as a neutral baseline/reference layer rather than competing for a palette
    slot'
  - 'Both renders are fully theme-correct: #FAF8F1/#1A1A17 backgrounds, all text readable,
    no dark-on-dark or light-on-light failures'
  - 'Distinctive ECharts touch: markLine crossover annotations ("Golden Cross"/"Death
    Cross") directly visualize the technical-analysis signal the spec''s Applications
    section calls out, giving the chart a clear focal point instead of just three
    overlaid lines'
  - Synthetic data uses three deliberate regimes (climb, slide, recovery) so all three
    SMAs visibly diverge, cross, and reconverge -- exercises the full behavior space
    the spec asks for, including the longer initial null window for SMA 200
  - Deterministic data generation via a fixed-seed LCG, clean single-purpose helpers
    (sma, toSeries), no external dependencies beyond the echarts global
  - Explicit font sizing throughout (title 22px, legend/axis/tick 14px) with balanced
    axis label sizing and no overflow or clipping in either render
  weaknesses:
  - The 'Golden Cross'/'Death Cross' markLine annotations are computed from SMA 20
    vs SMA 200, but the spec's own Applications section defines that terminology as
    the 50-day vs 200-day crossover -- consider computing the crossover from smaMedium/smaLong
    (or relabeling to something like 'Fast/Long Cross') so the annotation matches
    the conventional definition it names
  - Design Excellence is solid but still reads close to a well-configured default
    line chart outside of the crossover annotations -- e.g. no distinct linestyle/marker
    redundancy as SMA lines get close together, and the legend/grid styling doesn't
    go much beyond baseline ECharts chrome
  - Y-axis grid is present but the plot otherwise relies entirely on line color to
    separate four overlapping series near the crossover zones; a subtle white/ink
    stroke or slightly different z-order emphasis on Close vs the SMAs could sharpen
    the read further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "indicator-sma · javascript · echarts · anyplot.ai" centered in dark ink text, clearly legible. Legend row (Close, SMA 20, SMA 50, SMA 200) directly below in secondary-ink grey, all readable. X-axis time ticks (Apr, Jul, Oct, 2024, ...) and Y-axis "Price (USD)" label with numeric ticks (120-240) all rendered in soft dark grey, fully legible. Horizontal grid lines are subtle and don't compete with the data. Two vertical dashed reference lines labeled "Death Cross" and "Golden Cross" in soft ink text near the top of the plot area.
      Data: Close price rendered as a thin, semi-transparent dark-ink line (baseline/reference layer). SMA 20 in brand green (#009E73, thickest), SMA 50 in lavender/purple, SMA 200 in blue -- all clearly distinguishable from each other and from the Close line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title and legend now render in light text (white/light grey) against the dark background, fully legible. Axis ticks and the "Price (USD)" label are light grey and easily readable. Grid lines remain subtle. "Death Cross"/"Golden Cross" labels render in light grey, clearly visible against the dark background -- no dark-on-dark failure.
      Data: SMA 20 (green), SMA 50 (lavender), SMA 200 (blue) are pixel-identical in hue to the light render -- only the chrome (background, text, axis lines) flipped. Close line now renders as a light/white semi-transparent line, correctly using the theme-adaptive ink token as its color source.
      Legibility verdict: PASS
