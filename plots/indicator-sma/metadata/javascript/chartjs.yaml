review:
  strengths:
  - 'Golden-cross/death-cross storytelling is genuinely excellent: the Close line''s
    per-segment color (Chart.js `segment` callback) plus the fill band to SMA 50 (`fill:
    2`) turns the bullish/bearish signal into the chart''s focal point instead of
    a decorative line overlay'
  - 'Correct Imprint palette application: Close defaults to brand green #009E73 with
    the bearish segments legitimately using the semantic-anchor matte red #AE3030
    (finance profit/loss convention), while SMA 20/50/200 follow the canonical palette
    order (#C475FD / #4467A3 / #BD8233)'
  - SMA null-handling is honest — SMA 200 visibly only starts partway through the
    series, matching the spec's note that longer windows have more initial null values
  - 'Theme-adaptive chrome is clean in both renders: warm #FAF8F1/#1A1A17 backgrounds,
    all text readable, data colors identical between light and dark'
  - 'Realistic, deterministic data: a 320-day LCG-seeded random walk with an explicit
    uptrend-then-pullback regime shift, giving the chart real crossover behavior in
    both directions (DQ-01 coverage)'
  - Title, axis titles ("Date", "Price (USD)"), and legend labels ("SMA 20/50/200")
    all follow spec and format conventions, with title fontsize scaling logic for
    the long mandated string
  weaknesses:
  - The 'Close' legend swatch always renders solid brand green, even though the actual
    line alternates green/red via the segment callback — a reader skimming the legend
    alone won't know red also means 'Close' (bearish state), only the in-chart fill/line
    teaches that
  - 'LM-02: the fill-between-series + conditional segment coloring is a nice technique
    but is achievable with moderate effort in other libraries (Plotly `fill=''tonexty''`,
    ECharts `areaStyle`) — not fully unique to Chart.js'
  - Axis border lines (left/bottom scale borders) are left at Chart.js defaults rather
    than explicitly restyled — fine as an L-shaped frame, but slightly less deliberate
    than the rest of the chart's polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "TechCorp Stock · indicator-sma · javascript · chartjs · anyplot.ai" in dark ink, top-right legend ("Close", "SMA 20", "SMA 50", "SMA 200") in dark ink, axis titles "Date" / "Price (USD)" dark and legible, tick labels in a slightly softer dark gray, subtle horizontal y-axis gridlines only (x-axis grid off).
      Data: Close line rendered in brand green (#009E73) when price sits above SMA 50, switching to matte red (#AE3030) when below — with a light green/light red fill band between Close and SMA 50 visualizing the spread. SMA 20 is lavender/purple, SMA 50 is blue, SMA 200 is ochre/tan, appearing only after day 200 as expected from the rolling-window null-handling. All four series distinguishable.
      Legibility verdict: PASS — no overlapping or clipped text, all labels and legend entries fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/off-white ink, tick labels in a lighter soft gray, gridlines subtle and still visible against the dark surface. No dark-on-dark text anywhere.
      Data: Identical data colors to the light render — brand green / matte red segment split on Close, lavender/blue/ochre SMA lines, fill bands present with the same reduced-opacity tinting. Confirms only chrome (background + text) flipped, not the data palette.
      Legibility verdict: PASS — all text, gridlines, and data series remain clearly legible on the dark surface; no unreadable elements.
