review:
  strengths:
  - 'First series (Close) uses brand green #009E73 with the three SMA overlays following
    the canonical Imprint order (#C475FD, #4467A3, #BD8233), identical across light
    and dark renders'
  - Data is deliberately regime-shifted (sustained uptrend then pullback) so the SMA
    lines actually cross each other, demonstrating golden/death-cross-style behavior
    rather than three parallel flat lines
  - Longer SMAs correctly show more leading null values (SMA 200 only starts plotting
    after ~200 trading days), exactly matching the spec's note about calculation windows
  - Line weight increases with SMA period (2 / 2.5 / 2.5 / 3 px) giving a subtle visual
    hierarchy that separates short- from long-term trend lines
  - X-axis grid is disabled while Y-axis grid is kept, matching the spec's explicit
    request for 'grid lines on the y-axis' without cluttering the dense daily time
    series
  - Theme chrome (title, ticks, axis titles, legend) is fully token-driven and reads
    cleanly in both light and dark renders with no dark-on-dark or light-on-light
    failures
  - Deterministic LCG-seeded random walk plus a hand-rolled SMA function keep the
    implementation reproducible and dependency-free
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level: the chart is a clean
    but plain multi-line overlay with no fill/area shading, no emphasis on the golden/death-cross
    moments, and no distinctive visual flourish beyond correct palette and line-width
    hierarchy'
  - No data storytelling device highlights the crossover signals that are central
    to the indicator-sma spec's applications (golden cross / death cross) — a viewer
    has to find the crossing points themselves
  - 'Library Mastery is generic: the implementation only uses the standard `type:
    ''line''` + multi-dataset API. Chart.js''s per-point `segment` styling (e.g. coloring
    the Close line''s segments by whether price is above/below SMA 50) would be a
    genuinely distinctive, hard-to-replicate-elsewhere feature that fits this exact
    spec'
  - Legend uses default flat swatches; grouping/ordering price vs. SMAs or adding
    a subtle divider would reinforce the visual hierarchy already established by line
    width
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "TechCorp Stock · indicator-sma · javascript · chartjs · anyplot.ai" is dark and crisp at top center; "Date" and "Price (USD)" axis titles are dark and clearly legible; tick labels are a softer dark gray, fully readable; legend (Close, SMA 20, SMA 50, SMA 200) sits top-right with clear swatches; horizontal gridlines are faint but visible, vertical gridlines are absent by design.
      Data: Close line is brand green (#009E73), SMA 20 is purple, SMA 50 is blue, SMA 200 is ochre/brown — matches canonical Imprint categorical order. All four lines are clearly distinguishable, with SMA 200 appropriately starting later in the series (fewer leading points) than SMA 20/50.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all render in light tones (white/soft gray) and remain fully legible against the dark background; no dark-on-dark text anywhere; legend swatches and labels are equally readable; gridlines are faint but present.
      Data: Close, SMA 20, SMA 50, and SMA 200 use the exact same hex colors as the light render (green, purple, blue, ochre) — only the chrome (background/text/grid) flipped, as required.
      Legibility verdict: PASS.
