review:
  strengths:
  - 'Correct standard recurrence plot: logistic map (r = 3.95, 300 steps) time-delay
    embedded (dimension 2, tau = 5), Euclidean distance against a 0.15 threshold,
    every recurrent pair (i, j) drawn as a mark'
  - Square plot area with identical 0-294 ranges on both axes (1024 x 1024 CSS px),
    the main diagonal filled along its whole length and the pattern mirrored across
    it
  - 'Threshold and resolution give a readable matrix: diagonal line segments, short
    laminar vertical/horizontal runs and small blocks (around i = 5-10, 20-30, 110-115)
    are all distinguishable without a nearly full or nearly empty matrix'
  - 'Idiomatic MUI X composition API: ChartsContainer with ChartsGrid, ScatterPlot,
    ChartsXAxis and ChartsYAxis, axis bands sized explicitly (height/width 72) per
    the library rules, skipAnimation set'
  - 'Theme-correct in both renders: Imprint #009E73 marks unchanged between themes,
    ink/inkSoft/grid tokens threaded into axis lines, ticks, labels and grid'
  - Native MUI scatter tooltips give per-pair inspection in the interactive HTML
  weaknesses:
  - 'Suggestion: the y-axis title sits about 50 CSS px left of its tick labels and
    the x-axis title about 45 px below its ticks; a slightly narrower axis band (around
    56 px) would tighten the frame around the square without truncating the 15 px
    ticks.'
  - 'Suggestion: grid lines every 20 steps run through the dense mark field; a sparser
    grid (every 50 steps) or none would let the recurrence texture read more cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold dark title "recurrence-basic · javascript · muix · anyplot.ai" centered at top; x-axis title "Time Index i" and y-axis title "Time Index j" in dark ink; tick labels 0-280 in steps of 20 on both axes in inkSoft; subtle light-grey grid every 20 steps; dark axis lines on left and bottom only. All text readable.
      Data: several thousand small #009E73 dots forming a symmetric recurrence matrix; the main diagonal runs unbroken from (0,0) to (294,294); parallel diagonal segments, short vertical/horizontal runs, a dense block near (5-10, 5-10) and checkerboard textures around (20-30) and (110-115) are visible. Square plot area with equal scales.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, clearly readable; grid lines subtle dark grey; light axis lines. No dark-on-dark text.
      Data: identical #009E73 dots in identical positions to the light render; only chrome flipped. Brand green reads well on the dark surface.
      Legibility verdict: PASS
