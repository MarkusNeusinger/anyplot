review:
  strengths:
  - Flow conservation is exact at every node (inflows sum to outflows), giving the
    diagram real analytical credibility
  - 'Correct Imprint palette with #009E73 as the first series; theme-adaptive chrome
    verified correct on both renders'
  - Clean, idiomatic use of core D3 primitives given the documented constraint that
    the d3-sankey plugin isn't in the pinned bundle
  - Mandated title string present verbatim, paired with a clear descriptive headline
    and subtitle
  - Well-balanced canvas utilization and generous, even margins
  weaknesses:
  - Node color assignment uses i % palette.length, which wraps around at 11 nodes
    and an 8-color palette -- Commercial ends up the same green as Coal, Industrial
    the same lavender as Gas, and Transport the same blue as Nuclear, even though
    these are unrelated categories. Use a distinct/fixed treatment for destination-column
    nodes instead of continuing the modulo cycle across unrelated categories.
  - The hand-rolled layout keeps nodes in their nodeDefs declaration order with no
    crossing-minimization pass, so the source-to-carrier region (5 sources feeding
    2 hubs) is more visually tangled than a standard Sankey layout would produce.
    A simple reorder-by-weighted-link-position heuristic per column would reduce crossings.
  - The secondary 'TWh' value labels (13px) get quite small when the PNG is scaled
    to mobile width (~400px) -- consider ~14-15px or bold weight for better mobile
    legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white
      Chrome: Title "National Energy Flow: Sources to End Use" (dark ink, bold), subtitle in secondary ink, node name/value labels in dark/secondary ink, footer "sankey-basic · javascript · d3 · anyplot.ai" in tertiary ink -- all clearly readable
      Data: 11 nodes (5 sources, 2 carriers, 4 end uses) colored via the Imprint palette; Coal (first source encountered) renders in #009E73 as mandated; link ribbons colored by source node at ~42% opacity
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black
      Chrome: Same title/subtitle/labels/footer, all switched to light ink tokens -- clearly legible, no dark-on-dark failures observed
      Data: Node and link colors identical to light render (Coal still #009E73, Gas still lavender, etc.) -- only chrome flipped
      Legibility verdict: PASS
