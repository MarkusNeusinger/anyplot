review:
  strengths:
  - 'Correct Imprint palette assignment: Product Sales is #009E73 (brand green, always
    first), Subscriptions/Services follow canonical order 2-3, and the matte-red semantic
    anchor (palette[4]) is deliberately skipped since none of the categories represent
    bad/loss/error — exactly per the style guide''s semantic-exception rule.'
  - 'Flow values are internally consistent: every intermediate node''s inbound total
    exactly equals its outbound total (Engineering 320+150=470 in, 380+90=470 out;
    Sales 180+70=250 in, 180+70=250 out; Operations 60+140=200 in, 120+60+20=200 out;
    Marketing 90 in, 40+50=90 out) — a real budget-flow Sankey would balance like
    this, so DQ-03 is excellent.'
  - 'Clean idiomatic echarts sankey series usage: nodeWidth/nodeGap/layoutIterations
    for layout quality, emphasis.focus:''adjacency'' for meaningful hover interactivity,
    curveness for smooth ribbons, borderWidth:0 for a refined flat look, animation:false
    correctly set to avoid mid-animation screenshots.'
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    chrome (title, node labels) legible in both themes, terminal expense nodes (Salaries,
    Infrastructure, Travel, Marketing Spend) use the theme-adaptive ink/neutral token
    rather than a categorical color — an appropriate semantic choice for aggregation
    endpoints.'
  - No circular flows, no edge clipping, no text overlap in either render; title format
    matches the mandated `sankey-basic · javascript · echarts · anyplot.ai` pattern
    exactly.
  - 'Clean, minimal code: no functions/classes, deterministic hardcoded data, no fake
    interactivity, correct mount-node contract usage.'
  weaknesses:
  - Node label fontSize is 16px within the 1600px-wide CSS mount (~1% of width) —
    legible at full 3200px resolution but likely to become hard to read once scaled
    to the ~400px mobile preview width; consider bumping to ~18-20px for more mobile
    headroom.
  - In the crossing region between the middle department column and the right-hand
    expense column, several 50%-opacity ribbons overlap (e.g. ochre Engineering flow
    crossing the lime Sales flow), producing blended colors that are harder to trace
    and reduce CVD distinguishability at the crossing points — consider slightly higher
    lineStyle.opacity for the source-linked color or nudging node order/curveness
    to reduce the amount of crossing.
  - Design Excellence is only at the 'well-configured, thoughtfully tuned default'
    tier (curveness, opacity, borderWidth:0, layoutIterations) — there is no visual
    emphasis or storytelling device (e.g. highlighting the single largest flow, a
    subtitle calling out the dominant expense category) that would lift this toward
    a clear focal point.
  - 'The right-side margin (right: 200) leaves a visibly wider empty strip after the
    black terminal-node bars than the left margin (left: 40) before the source bars
    — asymmetric enough to be noticeable; could be tightened slightly now that sink
    labels are short.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sankey-basic · javascript · echarts · anyplot.ai" is centered top in dark ink, clearly legible. All 11 node labels (Product Sales, Subscriptions, Services, Engineering, Sales, Operations, Marketing, Salaries, Infrastructure, Travel, Marketing Spend) render in dark ink text, positioned outside their node bars (right side for source/mid nodes, left side for the four terminal expense nodes), all fully readable with no overlap.
      Data: Three source nodes (Product Sales = brand green #009E73, Subscriptions = lavender, Services = blue) flow through four department nodes (Engineering = ochre, Sales = lime, Operations = rose, Marketing = cyan — the semantic-red palette slot is correctly skipped since no category is an error/loss state) into four terminal expense nodes rendered as dark ink bars. Ribbon widths are clearly proportional to flow value; ribbons take their source node's color at 50% opacity, producing visible color blending where multiple flows cross en route to the expense column.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and all node labels render in light/cream ink, clearly legible against the dark surface; no dark-on-dark failures observed. The terminal expense-node bars flip from black (light theme) to near-white/cream (dark theme), correctly using the theme-adaptive ink token rather than a static color.
      Data: All eight categorical node colors (green, lavender, blue, ochre, lime, rose, cyan) are pixel-identical to the light render — only the chrome (background, text, terminal-node ink) flipped, as required. Ribbon color-blending pattern in the crossing region is the same as the light render.
      Legibility verdict: PASS.
