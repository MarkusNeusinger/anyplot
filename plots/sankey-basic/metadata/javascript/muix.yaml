review:
  strengths:
  - 'Correct three-stage Sankey: every link keeps its value''s width end to end on
    one shared px-per-unit scale, and every bar is as tall as its larger of in- and
    outflow (Electricity 116 = 116, Heat 21 = 21 TWh)'
  - Links stack along each node edge in the order of the nodes at their other end,
    and barycentre sweeps order each stage, so only two crossings remain and both
    stay easy to follow
  - 'Links carry their sender''s Imprint hue at 0.45 opacity, Coal first in brand
    green #009E73, and the matte-red slot is skipped; sink nodes stay neutral in the
    inkSoft token, so the colors name the sources'
  - 'Two-level node labels (16 px bold name in ink, 14 px total in inkSoft) with a
    page-colored halo stroke: they sit left of stage 0, right of the last stage and
    above the middle bars, clear of every link in both themes'
  - 'Uses MUI X composition idiomatically: a custom SVG layer inside ChartsContainer
    reads useDrawingArea, the axes are hidden with position: ''none'', and skipAnimation
    is set'
  - Native SVG <title> tooltips on every link and node give source → target values
    in the interactive HTML
  weaknesses:
  - 'Suggestion: the Imprint canonical order puts Coal in brand green and Renewables
    in ochre; the semantic-exception order (Renewables in green) would match readers''
    color expectations for energy sources.'
  - 'Suggestion: about 90 px of empty band between the subtitle and the top nodes
    could be reduced to give the diagram a little more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no frame and no axes.
      Chrome: centred bold title "sankey-basic · javascript · muix · anyplot.ai" in dark ink, with an inkSoft subtitle "Link width and bar height proportional to Energy flow (TWh) · 12 flows across 3 stages". Node names in bold dark ink with totals in soft gray: Coal 42, Nuclear 22, Renewables 27, Gas 46 to the left of the stage-0 bars; Electricity 116 and Heat 21 above the middle bars; Commercial 30, Transport 12, Industrial 47, Residential 48 to the right of the sink bars. All readable.
      Data: source bars and links in Imprint order: Coal #009E73 green, Gas #C475FD lavender, Nuclear #4467A3 blue, Renewables #BD8233 ochre, Electricity #2ABCCD cyan, Heat #954477 rose. Links at 0.45 opacity. The sink bars are a neutral dark gray. There are two visible crossings: Renewables→Heat over Gas→Electricity, and Heat→Industrial over Electricity→Residential.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and node names in light ink, subtitle and totals in light gray. No dark-on-dark text; the halo stroke switches to the dark page color.
      Data: bar colors are identical to the light render. Translucent links blend toward the dark page (deeper green, navy, brown, purple, teal and maroon) but stay distinct, and the crossings remain distinguishable. The sink bars switch to light gray (inkSoft). Brand green is clearly visible.
      Legibility verdict: PASS
