  image_description: |-
    NOTE ON ARTIFACTS: The plot_images/plot-light.png and plot-dark.png files provided for this review attempt were stale — they rendered the pre-repair code (5 separate source nodes: Coal, Gas, Nuclear, Wind, Solar), not the current HEAD commit (ffdc08fd0), which merges Wind+Solar into "Renewables" per the attempt-1 fix. I confirmed this by diffing the committed .tsx (matches HEAD exactly, md5 identical) against the data implied by the stale PNGs, then re-ran the harness locally (`ANYPLOT_THEME=light/dark node automation/js-render/render.mjs plots/sankey-basic/implementations/javascript/muix.tsx --library=muix`) to produce accurate renders. The description below is of those freshly-regenerated, code-accurate renders.

    Light render (plot-light.png, regenerated):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "sankey-basic · javascript · muix · anyplot.ai" and a gray subtitle are clearly readable. Three uppercase gray column headers (PRIMARY SOURCES / ENERGY CARRIERS / END-USE SECTORS) sit above each node column. A footnote at the bottom explains the width/height encoding. All chrome text is dark-on-light and fully legible.
      Data: Four source nodes — Coal (green #009E73, 42 TWh), Nuclear (blue, 22 TWh), Renewables (ochre/tan, 27 TWh), Gas (lavender, 46 TWh) — reordered top-to-bottom by a barycenter heuristic rather than input order, feeding two carrier nodes (Electricity cyan 116 TWh, Heat maroon 21 TWh), which fan out to four muted-gray end-use nodes (Commercial 30, Transport 12, Industrial 47, Residential 48 TWh). Ribbons are alpha-blended (~42% opacity) and scaled to flow value. Palette position 5 (#AE3030, reserved for error/loss) is not used anywhere. Every node carries a bold name + gray value label.
      Legibility verdict: PASS

    Dark render (plot-dark.png, regenerated):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, subtitle, column headers, and every node label switch to light-colored text and stay fully legible — no dark-on-dark failures anywhere, including inside the busiest ribbon-crossing zone (right-half Electricity/Heat overlap).
      Data: Identical categorical hues to the light render (green/lavender/blue/ochre/cyan/maroon); only the alpha-blended ribbons read visually darker against the black background, which is expected compositing, not a palette change. End-use nodes correctly switch to the theme-adaptive muted-gray anchor.
      Legibility verdict: PASS

    Both renders pass the readability check; both are theme-correct and AR-09 clipping-free (title, all node labels, and the footnote all have visible margin from every canvas edge).
