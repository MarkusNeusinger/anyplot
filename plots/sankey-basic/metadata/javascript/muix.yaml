review:
  strengths:
  - 'Clever, well-executed escape hatch for a chart type the community @mui/x-charts
    tier doesn''t natively support: hand-rolled node stacking and cubic-bezier ribbon
    geometry built entirely on ChartContainer + useXScale/useYScale, with no Pro imports
    and no second charting library'
  - 'Flow conservation is exact and realistic: source totals (42+46+22+15+12=137 TWh)
    equal carrier totals (116+21=137 TWh) equal end-use totals (48+47+30+12=137 TWh),
    giving the diagram real physical credibility'
  - Every node is labeled with its own magnitude ('Coal · 42 TWh', etc.) and a footer
    caption states 'Link width and node height ∝ flow value (TWh/yr)', making the
    diagram self-explanatory without a separate legend
  - Column headers (PRIMARY SOURCES / ENERGY CARRIERS / END-USE SECTORS) give the
    three-stage flow a clear narrative structure
  - Both renders are fully theme-adaptive — background, ink, and the muted end-use-node
    color all flip correctly between light and dark while the categorical source/carrier
    colors stay pixel-identical
  - skipAnimation is set and the chart is sized from window.ANYPLOT_SIZE as required
    by the harness contract
  weaknesses:
  - 'VQ-07: The Solar node is assigned Imprint palette position 5 (#AE3030, matte
    red), which the style guide reserves as the deferred semantic anchor for bad/loss/error
    roles, not for ordinal position 5 on an arbitrary category. Solar is a positive/renewable
    source, so red is a semantic mismatch — and it breaks catalog consistency: every
    other sankey-basic implementation (plotly, altair, plotnine, bokeh, letsplot)
    deliberately caps at 4 source categories (merging Wind+Solar into a single ''Renewables''
    node) specifically to avoid landing on the red anchor for a non-error category.
    Fix: either merge Wind and Solar into one ''Renewables'' source node (matching
    the sibling implementations, staying within palette positions 1-4), or keep 5
    distinct sources but skip red entirely for this chart (e.g. reuse a later canonical
    slot or hold red out of rotation) since no node here represents a loss/error role.'
  - 'VQ-03/DE-02: Between the Sources and Carriers columns, several links cross (Gas→Heat
    crosses Nuclear→Electricity and Wind→Electricity; Solar→Electricity crosses Gas→Heat),
    producing a visually muddy overlap band around the diagram''s vertical center
    where translucent colors blend into indistinct purple-gray patches in both renders.
    Consider sorting each column''s nodes by the position of their dominant counterpart,
    or bundling/ordering links to reduce the crossing count and keep individual flows
    easier to trace.'
  - 'LM-02: Hover affordances are plain SVG <title> elements (native browser tooltips)
    rather than MUI X''s own <ChartsTooltip> / highlight interaction props — using
    the library''s native tooltip system would be a more distinctive, idiomatic use
    of the interactive surface MUI X provides in its HTML output.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "sankey-basic · javascript · muix · anyplot.ai" and gray subtitle "National energy flow: primary sources → carriers → end-use sectors" both clearly legible at the top. Three uppercase gray column headers (PRIMARY SOURCES / ENERGY CARRIERS / END-USE SECTORS) sit above each node column. Every node has a bold dark name label plus a smaller gray "N TWh" value label, all fully readable with no overlap. A small gray footnote ("Link width and node height ∝ flow value (TWh/yr)") sits at the bottom, fully visible.
      Data: Five source nodes (Coal green #009E73, Gas lavender, Nuclear blue, Wind ochre, Solar matte red), two carrier nodes (Electricity cyan, Heat rose), four end-use nodes in a shared muted gray. Ribbons are filled with the source node's color at ~42% opacity, so overlapping ribbons blend into softer, secondary hues — most visibly in the crossing zone between the Sources and Carriers columns. Ribbon widths and node heights scale proportionally to flow value.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, column headers, and all node name/value labels switch to light-colored text (white/light-gray) and remain fully legible against the dark surface. No dark-on-dark text found anywhere, including inside the crossing/overlap zone.
      Data: The same seven categorical hues appear in the same positions as the light render — Coal green, Gas lavender, Nuclear blue, Wind ochre, Solar red, Electricity cyan, Heat rose — confirming the underlying fill colors are identical between themes; only the alpha-blended appearance over the darker background shifts (translucent ribbons read as deeper, more saturated tones against black, which is an expected compositing effect, not a palette violation). End-use nodes use the theme-adaptive muted gray anchor (#A8A79F on dark vs #6B6A63 on light).
      Legibility verdict: PASS.
