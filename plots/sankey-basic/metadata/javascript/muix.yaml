review:
  strengths:
  - 'Faithful sankey geometry: every link keeps its value as width end to end, node
    bars equal max(inflow, outflow), and the energy balance holds (Electricity 116
    in = 116 out, Heat 21 in = 21 out)'
  - Links carry their source node's Imprint hue at 0.45 opacity, so each flow can
    be followed from Coal, Nuclear, Renewables or Gas through Electricity/Heat to
    the end-use sectors; crossings stay distinguishable in both themes
  - 'Imprint palette applied correctly: Coal starts at #009E73, the matte-red slot
    is skipped as the reserved loss anchor, and receive-only sector bars take the
    theme-adaptive inkSoft neutral so the colored sources lead the eye'
  - Labels placed by stage (left of the first column, above the middle column, right
    of the last) with a pageBg halo stroke; bold names over softer totals give a clear
    two-level hierarchy, nothing collides with links
  - 'Uses the MUI X v9 composition pattern correctly: ChartsContainer with hidden
    axes, a custom layer reading useDrawingArea, skipAnimation, theme tokens from
    window.ANYPLOT_TOKENS, and native SVG <title> tooltips per link and node for the
    HTML view'
  - 'Data block follows the adaptable-code zones: role constants, records keyed by
    them, stages, colors and the unit all derived from the data'
  weaknesses:
  - 'Suggestion: Renewables could take the green Imprint hue and Coal a later position,
    matching the reader''s common color association for these energy sources (semantic
    exception in the style guide).'
  - 'Suggestion: the empty band between the subtitle and the top nodes (about 90 px)
    could be tightened so the diagram fills more of the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "sankey-basic · javascript · muix · anyplot.ai" centered at top, softer subtitle "Link width and bar height proportional to Energy flow (TWh) · 12 flows across 3 stages"; node names in bold ink with TWh totals in inkSoft beside/above each bar. No axes (correct for a sankey). All text readable.
      Data: three stages. Left: Coal (#009E73 green, 42), Nuclear (blue, 22), Renewables (ochre, 27), Gas (lilac, 46). Middle: Electricity (cyan, 116), Heat (plum, 21). Right: Commercial 30, Transport 12, Industrial 47, Residential 48 as dark-neutral bars. Translucent links in the source color; the thin Renewables→Heat link and the Heat→Industrial link cross other links and remain distinguishable.
