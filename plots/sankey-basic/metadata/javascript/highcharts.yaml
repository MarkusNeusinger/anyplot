review:
  strengths:
  - 'Correct, spec-faithful Sankey structure: proportional cubic-bezier ribbons whose
    width encodes flow value, node heights sum consistently, and no circular flows
    (source never equals target)'
  - 'Energy conservation holds exactly: source totals (190+190+240+140) sum to the
    same 760 TWh as sink totals (280+180+260+40), a nice factual-rigor touch not required
    by the spec'
  - Labels sit cleanly in the outer margins on both sides and never overlap a ribbon
    or node in either theme, directly satisfying the spec's 'node labels should not
    overlap links' requirement
  - 'Thoughtful semantic color mapping: each source gets a distinct Imprint hue (canonical
    order, first = brand green) while sink nodes stay neutral ink since they aggregate
    multiple sources — avoids a misleading second color dimension'
  - 'Theme-adaptive chrome is fully correct: identical data hex values in light/dark
    (verified node color patches pixel-for-pixel), theme-correct background/text tokens,
    no dark-on-dark or light-on-light failures'
  - Realistic, neutral, business/science-appropriate scenario (energy generation routed
    to end-use sectors) with plausible relative magnitudes
  weaknesses:
  - In the busy crossing zone (middle third of the diagram), overlapping 0.55-alpha
    ribbons blend into muddy secondary colors (e.g. blue+purple, blue+ochre) that
    aren't part of the Imprint palette — add a thin ink-colored stroke on each ribbon
    path (per the style guide's 'Optional outline pattern') or a subtle per-ribbon
    z-order/opacity tweak so individual flows stay traceable even where several cross
  - No real hover interaction is wired up for the HTML view beyond a native SVG <title>
    tooltip — since chart.renderer elements support .on('mouseover'/'mouseout', ...),
    add a genuine highlight-on-hover (e.g. dim other ribbons, bring the hovered one
    to full opacity) to make better use of the interactive HTML output without faking
    anything in the PNG
  - Data storytelling relies entirely on ribbon width with no emphasis device — consider
    a small direct callout or bolder stroke on the single largest flow (Coal → Industrial,
    120 TWh) so the diagram makes its main point at a glance rather than requiring
    the viewer to compare band widths
  - The hand-drawn chart.renderer approach (necessary since the sankey/dependency-wheel
    module isn't vendored) means no Highcharts series, tooltip, or dataLabel API is
    actually exercised — functionally this is closer to generic SVG drawing than idiomatic
    Highcharts usage; if a future Highcharts release or bundle change ever vendors
    the sankey module, migrating to the native series would raise both idiomatic usage
    and library-mastery scores
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "sankey-basic · javascript · highcharts · anyplot.ai" centered at top, gray-ish subtitle below it explaining the flow encoding. Four source-node labels ("Solar & Wind · 190 TWh", "Coal · 190 TWh", "Natural Gas · 240 TWh", "Nuclear · 140 TWh") sit right-aligned in the left margin; four sink-node labels ("Residential · 280 TWh", "Commercial · 180 TWh", "Industrial · 260 TWh", "Transportation · 40 TWh") sit left-aligned in the right margin. All text is dark ink on the light surface and fully legible; edge crops confirm no label is clipped at the canvas border.
      Data: Four source node bars in distinct Imprint hues (green #009E73, lavender, blue, ochre) on the left; four neutral dark-gray sink bars on the right. 14 semi-transparent bezier ribbons connect them, width proportional to flow value, colored by their source node. Ribbons cross in the middle third of the canvas, blending into secondary hues where multiple flows overlap.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle, now in light/off-white text; same node labels, now in light text, still fully legible with no dark-on-dark failures. Sink node bars render as light-gray (t.ink at 0.85 opacity) rather than the dark-gray used in the light theme — correct theme-adaptive chrome behavior.
      Data: Source node colors are pixel-identical to the light render (verified via cropped side-by-side comparison — green/lavender/blue/ochre unchanged), confirming only chrome flipped. Ribbon blending in the crossing zone is again present, now reading as deeper/darker blended tones against the dark backdrop.
      Legibility verdict: PASS.
