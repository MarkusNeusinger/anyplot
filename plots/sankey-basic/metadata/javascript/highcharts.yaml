review:
  strengths:
  - 'Ribbon-crossing legibility fix applied exactly as requested: every ribbon path
    now carries a thin ink stroke, so individual flows stay traceable through the
    busy middle crossing zone even where 0.55-alpha fills blend into secondary hues'
  - Genuine hover-highlight interactivity added via chart.renderer element event handlers
    (mouseover dims every ribbon but the hovered one to 0.12 and restores on mouseout)
    - real functionality for the HTML view, not a simulated affordance
  - 'Dominant-flow emphasis added: the single largest link (Coal -> Industrial, 120
    TWh) gets a bolder stroke and higher fill-opacity, visibly bolder in both renders
    and giving the diagram an explicit focal point'
  - 'Correct, spec-faithful Sankey structure: proportional cubic-bezier ribbons, no
    circular flows, energy conservation holds exactly (both source and sink totals
    sum to 760 TWh)'
  - 'Theme-adaptive chrome fully correct in both renders: identical source-node hex
    values in light/dark, correct background/text tokens, no dark-on-dark or light-on-light
    failures, no edge clipping'
  - Realistic, neutral energy-sector scenario (Solar & Wind / Coal / Natural Gas /
    Nuclear routed to Residential / Commercial / Industrial / Transportation) with
    plausible relative magnitudes
  weaknesses:
  - The dense middle crossing zone still blends several ribbons into muddy off-palette
    secondary colors (e.g. green+tan olive, purple+blue indigo) - the new ink stroke
    helps trace edges but doesn't fully resolve fill-color muddiness; a per-ribbon
    z-order pass (draw thinner/lower-value ribbons on top) could sharpen it further
  - The approach still bypasses Highcharts' series/options API entirely (necessary
    since the sankey module isn't vendored), so idiomatic-usage credit remains capped
    even with the added renderer-level interactivity
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Bold dark title "sankey-basic · javascript · highcharts · anyplot.ai" centered at top, gray subtitle below explaining the encoding. Four source-node bars (Solar & Wind, Coal, Natural Gas, Nuclear) on the left with right-aligned dark-text labels including TWh totals; four neutral dark-gray sink-node bars (Residential, Commercial, Industrial, Transportation) on the right with left-aligned labels. All text is dark-on-light and clearly readable; no clipping at any canvas edge.
      Data: 14 semi-transparent cubic-bezier ribbons, width proportional to flow value, colored by source (green/lavender/blue/ochre - Imprint positions 1-4, first series = #009E73 brand green as required). Each ribbon now carries a thin ink-colored stroke, keeping individual flows traceable through the crossing zone. The single largest flow (Coal -> Industrial, 120 TWh) is visibly bolder (higher opacity + thicker stroke) than the rest, giving the diagram a clear focal point.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Same title/subtitle/labels now rendered in light text, fully legible with no dark-on-dark failures. Sink-node bars correctly flip to a lighter neutral gray (theme-adaptive ink token) while remaining distinct from the page background.
      Data: Source node and ribbon colors are identical hex values to the light render - only chrome (background, text, sink-node fill) flipped, as required. The dominant Coal -> Industrial flow reads as the boldest ribbon here too, confirming the emphasis survives the theme flip.
      Legibility verdict: PASS
