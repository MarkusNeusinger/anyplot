review:
  strengths:
  - Fully hand-rolled Sankey diagram built from pure ggplot2 primitives (geom_ribbon
    + geom_rect + geom_text) with a custom smoothstep-eased curve algorithm for the
    flow ribbons — a genuinely creative solution given ggplot2 has no native Sankey
    geom and the library rules forbid falling back to another backend.
  - 'Clean, uncluttered layout: theme_void() strips all chrome, node labels sit directly
    beside their bars (''Coal · 380 PJ'') instead of a separate legend, and coord_cartesian(clip=''off'')
    with generous plot.margin gives the labels room without touching the canvas edge.'
  - 'Imprint palette applied correctly and canonically: first source (Coal) is #009E73,
    remaining sources follow palette positions 2-5 in canonical order, target nodes
    use the theme-adaptive INK_SOFT tone to visually distinguish ''sink'' nodes from
    source categories.'
  - 'Theme-adaptive chrome is fully correct — backgrounds match #FAF8F1/#1A1A17, title
    and node-label text flip from dark-on-light to light-on-dark, and the flow colors
    are pixel-identical between the two renders.'
  - Realistic, neutral energy-flow dataset (17 flows, 5 sources -> 4 sectors, values
    10-220 PJ) within the spec's 5-50 flow range, with plausible real-world proportions
    (coal/gas dominating industrial and residential use, renewables smaller shares).
  weaknesses:
  - 'CQ-01 KISS Structure: the script defines two helper functions (stack_nodes(),
    make_curve()) instead of a flat imports -> data -> plot -> save script. Understandable
    given ggplot2 has no native Sankey geom and the layout math has to live somewhere,
    but it''s still a deduction under the strict ''no functions/classes'' rule — consider
    inlining if it can be done without hurting readability, otherwise this is an accepted
    tradeoff for this plot type.'
  - 'DE-01 Aesthetic Sophistication: ribbons are flat, uniform alpha=0.6 fills with
    no additional depth (e.g. a subtle gradient along the ribbon length, or a slightly
    higher opacity/stroke on the single largest flow) — a bit more visual richness
    would push this from ''strong'' to genuinely publication-ready.'
  - 'VQ-03 Element Visibility: with 17 flows crossing between 5 sources and 4 targets,
    several ribbons overlap and their alpha=0.6 fills blend into a slightly muddy
    color in the crossing zone (most visible around the Gas/Nuclear/Wind crossing
    band). A subtle stroke on ribbon edges, or reordering the source/target stacking
    to reduce crossings, would improve individual-flow legibility.'
  - 'DE-03 Data Storytelling: the per-node value labels are a nice touch, but the
    dominant flow (Coal -> Industrial, the widest ribbon) isn''t otherwise emphasized
    — a slightly higher opacity or a thin highlight stroke on the largest flow would
    sharpen the visual hierarchy and make the chart''s main insight even more immediate.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "sankey-basic · r · ggplot2 · anyplot.ai" in dark ink near the top-left, comfortably sized (~40% of canvas width), not clipped or overflowing. Node labels ("Coal · 380 PJ" ... "Transport · 50 PJ") in dark ink flank the diagram on both sides, clearly legible against the light background.
      Data: Five source nodes (Coal, Gas, Nuclear, Wind, Solar) stacked on the left as solid color bars, four target nodes (Industrial, Residential, Commercial, Transport) stacked on the right as dark-gray bars. Flow ribbons connect them with widths proportional to value, colored by source: Coal = brand green #009E73, Gas = lavender, Nuclear = blue, Wind = ochre, Solar = matte red — matching the Imprint palette in canonical order. Ribbons use ~0.6 alpha so overlapping flows remain distinguishable, though some crossing bands blend slightly.
      Legibility verdict: PASS — all title and node-label text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and all node labels render in light ink (near-white), clearly legible against the dark background. Target-node bars flip to a light-gray tone (INK_SOFT for dark theme) instead of the dark-gray used in the light render, correctly following the theme-adaptive chrome rule.
      Data: Flow ribbon colors are pixel-identical to the light render — same green/lavender/blue/ochre/red source colors — confirming only chrome (background, text, target-node fill) flips between themes, not the categorical data colors.
      Legibility verdict: PASS — no dark-on-dark failures; all title and node-label text is clearly visible against the near-black background, and the brand green remains visible on both surfaces.
