review:
  strengths:
  - Correct canvas (3200x1800, pixel-verified) and exact Imprint palette + theme background
    compliance (#FAF8F1/#1A1A17 pixel-verified, data colors identical across themes)
  - Fully hand-built Sankey via bezier ribbons and stacked-node segment allocation
    -- a real engineering solution given Makie's lack of a native Sankey primitive
    and the ban on NetworkLayout.jl
  - Clean, deterministic, single-file script with no functions, only used imports,
    and a plausible/neutral energy-flow dataset
  weaknesses:
  - Title occupies only ~23% of canvas width (measured 726px of 3200px) -- well under
    the 50-70% guideline; increase titlesize substantially (roughly 2.5-3x from the
    current 20) so the title reads as the dominant visual element
  - Source and target node orderings are left in raw list order with no crossing-minimization,
    producing a dense tangle of overlapping ribbons in the middle of the diagram;
    overlapping semi-transparent fills blend into off-palette hues (e.g. green+lavender
    to olive) that reduce per-flow traceability -- consider a barycenter-style reordering
    of sources/targets to reduce crossings
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-verified exactly #FAF8F1.
      Chrome: Bold dark title "sankey-basic · julia · makie · anyplot.ai" centered at top; 5 source node labels (Coal, Natural Gas, Nuclear, Wind, Solar) right-aligned left of their bars, 4 target node labels (Residential, Commercial, Industrial, Transportation) left-aligned right of their bars; all in dark ink, all clearly readable.
      Data: Source node rectangles and their flow ribbons colored via Imprint palette positions 1-5 (Coal=#009E73 green, Natural Gas=lavender, Nuclear=blue, Wind=ochre, Solar=matte-red); target node rectangles are uniform muted gray. Ribbons are semi-transparent (alpha 0.55) bezier curves that cross heavily in the middle, blending into secondary hues where they overlap.
