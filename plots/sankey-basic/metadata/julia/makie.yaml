review:
  strengths:
  - Hand-built Sankey from CairoMakie primitives (poly! ribbons + text! labels) since
    Makie has no native sankey recipe — exactly the approach the library rules call
    for
  - Barycenter-ordering algorithm reorders both source and target columns to minimize
    ribbon crossings, applied iteratively (source -> target -> source) while keeping
    the palette-to-source assignment fixed
  - Cubic-bezier ribbons with alpha=0.55 fill make overlapping flows readable, matching
    the spec's 'link opacity helps when flows cross over' guidance
  - 'First categorical series (Coal) is Imprint brand green #009E73; data colors are
    pixel-identical between light and dark renders, only chrome (background, title/label
    ink, node stroke) flips'
  - Canvas lands exactly on the 3200x1800 landscape target with no clipping; realistic,
    spec-matching energy-flow dataset (Coal/Natural Gas/Nuclear/Wind/Solar -> Residential/Commercial/Industrial/Transportation)
    with plausible relative magnitudes
  weaknesses:
  - Diagram is visually busy — with 5 sources x 4 targets and barycenter reordering,
    many ribbons still cross near the middle, making it hard to trace a single flow
    start-to-end at a glance; consider a stronger focal-flow emphasis (e.g. slightly
    higher alpha or highlight on the largest flow) to aid storytelling
  - Node label fontsize (15pt) is small relative to the 52pt title — legible in both
    full-size renders and the 400px mobile crop, but there's little breathing room
    if the catalog ever needs a smaller thumbnail size
  - barycenter_order helper function deviates from the KISS 'no functions' default;
    justified here since it's genuinely reused (computed twice for sources, once for
    targets) rather than an unnecessary abstraction, but noted per CQ-01
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "sankey-basic · julia · makie · anyplot.ai" centered at top, ~78% of plot width, clearly readable. Five source node labels (Solar, Nuclear, Wind, Natural Gas, Coal) right-aligned to the left of their colored bars; four target node labels (Residential, Commercial, Transportation, Industrial) left-aligned to the right of gray target bars. All labels render in dark ink, clearly legible against the light background, and confirmed still readable at the 400px mobile crop.
      Data: Source node bars and their outgoing ribbons are colored by the Imprint palette — Coal is brand green #009E73 (first-assigned series), Natural Gas is lavender, Nuclear is blue, Wind is ochre, Solar is matte red. Target node bars are a neutral muted gray. Ribbons are semi-transparent (alpha ≈ 0.55) cubic-bezier fills with widths proportional to flow value; Natural Gas's four flows visibly form the largest aggregate band, matching its largest total value in the underlying data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and node-label layout, now in light ink (near-white) against the dark background. Node bar separators use background-colored strokes so they read correctly in both themes. No dark-on-dark or light-on-light failures observed — every title, node label, and target label is clearly legible.
      Data: Confirmed pixel-identical hues to the light render (Coal green, Natural Gas lavender, Nuclear blue, Wind ochre, Solar red) — only the chrome (background, ink, node stroke color) flips between themes, as required.
      Legibility verdict: PASS
