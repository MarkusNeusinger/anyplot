review:
  strengths:
  - Creative, correct Sankey implementation built from bokeh primitives (patches +
    quad + ColumnDataSource) since bokeh has no native Sankey glyph — bezier flow
    ribbons are mathematically sound and proportional to flow value
  - 'First encountered source category (Coal) uses #009E73 and remaining sources follow
    canonical Imprint order; target (sector) nodes use the theme-adaptive neutral
    INK token, a sensible structural-vs-categorical color distinction'
  - 'Theme handling is thorough: background, ink, node borders, and even flow opacity
    (FLOW_ALPHA 0.45 light / 0.65 dark) are tuned per theme so ribbons stay legible
    on both the warm off-white and near-black canvases, with identical hue values
    in both renders'
  - Deliberate x_range margin (-40 to 150) reserves room for the outward-facing node
    labels so nothing clips at the canvas edge, and toolbar_location=None + min_border_top=110
    keep the 3200x1800 canvas exact
  - Per-flow and per-node HoverTool tooltips add real interactive value in the HTML
    detail view (flow source/target/value, node totals) without harming the static
    PNG
  - Realistic, neutral energy-flow dataset (Coal/Gas/Nuclear/Hydro/Solar → Residential/Commercial/Industrial,
    11 flows, 5-65 TWh) matches the spec's suggested example almost exactly, with
    no circular flows
  weaknesses:
  - Node vertical order (Solar, Hydro, Nuclear, Gas, Coal top-to-bottom on the left;
    Commercial, Residential, Industrial on the right) is not optimized to reduce ribbon
    crossings — the diagram reads as visually busy with many overlapping ribbons in
    the middle. Reordering sources/targets by a barycenter or largest-flow-adjacency
    heuristic would reduce crossings and give the chart a clearer focal point (helps
    VQ-02/VQ-03/DE-03).
  - Where 2-3 semi-transparent ribbons overlap (e.g. the Gas/Nuclear/Hydro crossing
    band in the middle), the alpha blending shifts the perceived hue enough that it's
    momentarily hard to trace which ribbon belongs to which source without hovering
    — consider a slightly lower overlap zone or nudging node order to shrink these
    crossing bands.
  - 'Minor cosmetic artifact: a 1px light-gray line is visible along the top and left
    canvas edges in the dark render (RGB ~(197,197,196) at the very first row/column
    vs. the (26,26,23) background), even though outline_line_color is set to None
    — likely a Chrome/bokeh root-div default border bleeding through the screenshot.
    Not visually disruptive, but worth a repair-loop check (e.g. explicit border/outline
    styling on the root div) so it doesn''t regress into something more visible.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold, centered title "sankey-basic · python · bokeh · anyplot.ai" in dark ink, clearly visible. Source node labels (Solar, Hydro, Nuclear, Gas, Coal, each annotated with a "(N TWh)" total) sit in dark ink text to the left of narrow colored node bars; target node labels (Commercial, Residential, Industrial with totals) sit in dark ink text to the right of narrow near-black node bars. No axes, ticks, or grid are drawn (appropriate for a Sankey). No text clipped at any canvas edge.
      Data: Five source-colored ribbon families run from left to right — green (Coal), violet (Gas), blue (Nuclear), amber/brown (Hydro), red (Solar) — with widths proportional to flow value, converging and crossing into the three target nodes. First source encountered (Coal) is #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now in light/cream text, clearly legible against the dark backdrop. Source and target node labels are rendered in light ink text and remain fully readable — no dark-on-dark failures observed. Target node bars flip to a light cream fill (theme-adaptive neutral), which reads clearly against the dark background.
      Data: Ribbon hues are pixel-identical to the light render (same five source colors), only the fill/line alpha increases slightly (0.65 vs 0.45) to keep ribbons visible on the darker surface — no chrome/data color confusion.
      Legibility verdict: PASS (minor cosmetic note: a 1px light-gray line is visible along the top/left canvas edge, likely a root-div rendering artifact — does not affect text or data legibility)
