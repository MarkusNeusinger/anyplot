review:
  strengths:
  - Barycenter crossing-minimization heuristic (_barycenter_reorder, 4 iterations
    alternating source/target order) directly addresses the attempt-1 weakness about
    visual clutter — node stacking order now converges toward each node's weighted-average
    connection position, giving the diagram a noticeably calmer read than an unordered
    layout
  - 'The attempt-1 cosmetic weakness (a 1px light-gray line bleeding through at the
    top/left canvas edge in the dark render) is fixed by explicitly zeroing document.documentElement/body
    background and margin before the Selenium screenshot — pixel-sampled at (0,0)
    in the new dark render: RGB (25,25,22), matching the #1A1A17 background almost
    exactly, no stray border'
  - 'Palette compliance is pixel-verified, not just visually plausible: sampling the
    five source-node fills against the expected Imprint hexes composited at fill_alpha=0.92
    over the page background reproduces the measured RGB values almost exactly for
    all five sources (Coal=#009E73, Gas=#C475FD, Nuclear=#4467A3, Hydro=#BD8233, Solar=#AE3030)
    — first-encountered source (Coal) is confirmed #009E73'
  - 'Theme-adaptive chrome is thorough and pixel-verified: target-node neutral fill
    and both backgrounds land within 1 RGB unit of their spec hex in both themes;
    flow opacity is tuned per theme (0.45 light / 0.65 dark) to keep ribbons legible
    on both surfaces with identical underlying hues'
  - Creative, mathematically sound Sankey construction from bokeh primitives (bezier
    patches + quad nodes + ColumnDataSource) since bokeh has no native Sankey glyph,
    with a slightly more opaque/thicker ribbon stroke so a ribbon's own edge stays
    traceable through alpha-blended crossings
  - Realistic, neutral energy-flow dataset (Coal/Gas/Nuclear/Hydro/Solar → Residential/Commercial/Industrial,
    11 flows, 5-65 TWh) with no circular flows, closely matching the spec's own suggested
    example
  weaknesses:
  - The 5-source/3-target fan-out is structurally busy — even after barycenter reordering,
    one long diagonal ribbon (Nuclear → Commercial) still crosses through the Gas/Hydro/Solar
    band, and alpha-blended overlaps in that middle crossing zone momentarily blur
    which ribbon belongs to which source without hovering. A true minimum-crossing
    bipartite ordering (or accepting some crossings as inherent to this many-to-many
    structure) is the ceiling here; further reordering tweaks would only yield marginal
    gains.
  - 'CQ-01 (KISS Structure): the code now defines a helper function (_barycenter_reorder)
    called in a loop, which is a reasonable way to avoid duplicating the reorder logic
    for sources and targets across 4 iterations, but it is a deviation from the strict
    ''Imports → Data → Plot → Save, no functions/classes'' KISS ideal scored under
    this criterion.'
  - 'Data Storytelling could go further: color-by-source and width-by-value provide
    some hierarchy, but with 3 similarly-sized targets (45/53/58 TWh) there isn''t
    a single obvious focal point the viewer''s eye is drawn to first — a subtle emphasis
    technique (e.g. slightly higher opacity or a highlight on the single largest flow,
    Gas→Residential at 30 TWh) would sharpen the story.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at RGB (250,248,241) — an exact match to #FAF8F1. Not pure white, not dark.
      Chrome: Bold, centered title "sankey-basic · python · bokeh · anyplot.ai" in dark ink, clearly visible and comfortably within the canvas (no clipping at any edge). Source node labels (Solar, Hydro, Gas, Nuclear, Coal — each annotated with a "(N TWh)" total) sit in dark ink text to the left of narrow colored node bars; target node labels (Commercial, Residential, Industrial with totals) sit in dark ink text to the right of narrow near-black node bars. No axes, ticks, or grid are drawn, which is correct for a Sankey.
      Data: Five source-colored ribbon families run left to right with widths proportional to flow value, converging into the three target nodes via the barycenter-reordered stacking (Solar, Hydro, Gas, Nuclear, Coal top-to-bottom on the left; Commercial, Residential, Industrial top-to-bottom on the right). Pixel-sampling each source node against the expected Imprint hexes (composited at fill_alpha=0.92 over the page background) reproduces the measured colors almost exactly: Coal=#009E73 (measured 20,166,125 vs expected 20,165,124), Gas=#C475FD, Nuclear=#4467A3, Hydro=#BD8233, Solar=#AE3030 — confirming the first-encountered source (Coal) is the required brand green.
      Legibility verdict: PASS — all text readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB (26,26,23) — an exact match to #1A1A17. Not pure black, not light.
      Chrome: Same title now in light/cream text, clearly legible against the dark backdrop. Source and target node labels are rendered in light ink text and remain fully readable — no dark-on-dark failures observed anywhere. Target node bars flip to a light cream fill (theme-adaptive neutral), reading clearly against the dark background. The attempt-1 cosmetic weakness (a stray 1px light-gray line along the top/left canvas edge) is confirmed fixed: pixel-sampling (0,0) through (10,0) and (0,0) through (0,10) now returns RGB (25,25,22) in every case, matching the background rather than a bleed-through page border.
      Data: Ribbon hues are pixel-identical to the light render (same five source colors); only the fill/line alpha increases (0.65 vs 0.45) to keep ribbons visible on the darker surface — no chrome/data color confusion.
      Legibility verdict: PASS — all text readable, no dark-on-dark issues, no edge artifact.
