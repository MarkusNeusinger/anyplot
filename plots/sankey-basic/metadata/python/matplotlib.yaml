review:
  strengths:
  - 'All four overlap issues flagged in the previous review are now resolved: ''Commercial
    45 TWh'' no longer pierced by the arrowhead, ''Coal'' and ''Losses'' labels no
    longer sit on their ribbon''s curved bend, and ''Renewables''/''Nuclear 60 TWh''
    now have a clear gap — the manual LABEL_OFFSETS technique worked.'
  - The gray seam-line rendering artifacts that previously cut across the green and
    purple ribbons are gone — both diagrams now render as clean, continuous ribbon
    shapes.
  - 'Correct Imprint palette (brand green #009E73 for the generation stage, lavender
    #C475FD for the distribution stage), fully theme-adaptive chrome, and identical
    data colors between light and dark renders.'
  - Realistic, neutral energy-flow dataset (TWh scale) with a programmatically verified
    conservation balance (assert total_primary == net_delivered + losses).
  - Clean, fully reproducible KISS code with no fake interactivity and no unused imports.
  weaknesses:
  - 'New label collision: the ''Industrial / 80 TWh'' label directly touches the ''Transport
    / 20 TWh'' label immediately to its right — the bottom of ''80 TWh'' abuts the
    top of ''Transport'' with no gap, visible in both light and dark renders. Apply
    the same manual LABEL_OFFSETS technique already used for Residential/Coal/Losses/Renewables/Commercial
    to nudge one of these two labels clear.'
  - '''Natural Gas / 90 TWh'' label is overlapped by its own ribbon''s downward bend
    (the same seam where the Nuclear/Renewables ribbons curve into the hub) — the
    green ribbon fill visually crosses through the text at the ''Gas''/''90 TWh''
    boundary. Nudge this label''s position (or adjust the pathlengths for the flows
    bending in from above) so the ribbon clears the text.'
  - Only two colors (brand green for all four primary sources, lavender for all four
    end-use sectors) differentiate the flows, rather than distinguishing the individual
    source categories the spec explicitly calls out ('Use distinct colors for different
    source categories or flow types'). Consider giving each primary source its own
    Imprint palette color (still positions 1→N) once the remaining label overlaps
    are fixed, or keep the two-stage scheme but note it's an intentional simplification
    given matplotlib's Sankey API constraints.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - correct, not pure white.
      Chrome: Title "sankey-basic · python · matplotlib · anyplot.ai" is dark, centered, clearly readable. Node labels (Coal, Natural Gas, Nuclear, Renewables, Losses, Residential, Commercial, Industrial, Transport) are bold dark text, readable against the cream background.
      Data: Two-stage Sankey - brand green (#009E73) ribbons carry the four primary sources (Coal 120, Natural Gas 90, Nuclear 60, Renewables 30 TWh) into a generation hub, splitting into Losses (100 TWh) and a lavender (#C475FD) net-delivered flow that fans out to Residential (55), Commercial (45), Industrial (80), and Transport (20 TWh). First series correctly uses brand green, second stage correctly uses Imprint position 2. Ribbons render as clean continuous shapes with no seam artifacts.
      Legibility verdict: PASS with minor issues - all text is readable and no letters are missing/obscured, but the "80 TWh"/"Transport" label pair touch with no gap, and the ribbon bend behind "Natural Gas / 90 TWh" visually crosses the text. Previously-flagged severe overlaps (Commercial "45 TWh" pierced by arrowhead, Coal/Losses on ribbon bends, Renewables/Nuclear crowding) are all fixed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - correct, not pure black.
      Chrome: Title and node labels render in light ink (#F0EFE8-equivalent), clearly readable against the dark background - no dark-on-dark failures observed.
      Data: Same brand green and lavender flow colors as the light render - data colors are identical between themes, confirming only chrome flips as required. Ribbons are clean and seam-free here too.
      Legibility verdict: PASS with minor issues - identical to the light render since the remaining overlap issues are geometry-driven (not theme-driven): the Industrial/Transport label touch and the Natural Gas/ribbon-bend overlap persist in both themes, but no text is unreadable.
