review:
  strengths:
  - Correct Sankey plot type using matplotlib's native Sankey class with a proper
    two-stage add()/connect() pattern (generation stage → distribution stage)
  - Energy balance is verified programmatically (assert total_primary == net_delivered
    + losses), a nice reproducibility/data-integrity touch
  - Title format, Imprint palette (brand green + lavender), and theme-adaptive ink/background
    tokens are correctly applied and consistent between light and dark renders
  - Realistic, neutral real-world energy-flow dataset (TWh scale) with a clear source
    → generation → sector structure
  - 'Fully reproducible: no randomness, deterministic hardcoded values'
  - No edge clipping — title and all outer labels stay comfortably within the canvas
    bounds
  weaknesses:
  - 'Severe overlap: the ''Commercial'' flow''s label ''45 TWh'' is directly pierced
    by the purple flow''s arrowhead — the arrow tip cuts through the ''4'' and ''5''
    characters, making both the number and the arrow hard to read. This also violates
    the spec''s explicit note ''Node labels should be clearly visible and not overlap
    with links.'' Reposition this label (e.g. increase the pathlength for that specific
    sub-flow, or apply a manual text-position offset after sankey.finish(), the same
    technique already used for the Residential label) so it clears the arrowhead.'
  - '''Coal'' and ''Losses'' node labels sit on top of / are visually merged with
    their own flow ribbon''s curved bend — letters (the ''o''/''a'' in Coal, the ''s''/''e''
    in Losses) overlap the teal ribbon fill. Increase pathlengths or nudge these two
    label positions clear of the ribbon curve.'
  - '''Renewables'' and the neighboring ''Nuclear''/''60 TWh'' label are packed edge-to-edge
    with almost no gap — the final ''s'' of Renewables touches the ''6'' of ''60 TWh''.
    Increase horizontal spacing between these two flow labels (larger pathlength delta
    or manual offset, as already done for Residential).'
  - Thin gray horizontal seam lines cut across the green (generation) and purple (distribution)
    flow ribbons at several points where sub-paths meet inside Sankey.add(). These
    read as rendering glitches rather than smooth continuous ribbons — they appear
    to be unstyled/default-colored internal patch boundaries. Investigate merging
    the sub-path boundaries or forcing a consistent edgecolor/linewidth on all internal
    seams so each ribbon renders as one continuous shape.
  - Only two colors differentiate the 'generation' vs 'distribution' stage rather
    than distinguishing the individual source categories the spec calls out (Coal,
    Gas, Nuclear, Renewables) — consider giving each primary source its own Imprint
    palette color (still positions 1→N) for stronger visual differentiation, or explicitly
    justify the two-stage color scheme as the chosen semantic mapping.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — correct, not pure white.
      Chrome: Title "sankey-basic · python · matplotlib · anyplot.ai" is dark, centered, clearly readable. Node labels (Coal, Natural Gas, Nuclear, Renewables, Losses, Residential, Commercial, Industrial, Transport) are bold dark text, readable against the cream background in isolation — but several collide with flow shapes (see below).
      Data: Two-stage Sankey — brand green (#009E73) ribbons carry the four primary sources (Coal 120, Natural Gas 90, Nuclear 60, Renewables 30 TWh) into a generation hub, splitting into Losses (100 TWh) and a lavender (#C475FD) net-delivered flow that fans out to Residential (55), Commercial (45), Industrial (80), and Transport (20 TWh). First series correctly uses brand green, second stage correctly uses Imprint position 2.
      Legibility verdict: FAIL — the "45 TWh" label for Commercial is pierced through by the purple flow's arrowhead (the arrow tip cuts across the "4" and "5" glyphs). "Coal" and "Losses" labels overlap their own ribbon's curved bend. "Renewables" and "60 TWh" (Nuclear's value line) are packed edge-to-edge, nearly touching. Additionally, thin gray seam lines cut across the green and purple ribbons at several internal path-merge points, reading as rendering artifacts rather than clean continuous flows.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — correct, not pure black.
      Chrome: Title and node labels render in light ink (#F0EFE8-equivalent), clearly readable against the dark background — no dark-on-dark failures observed.
      Data: Same brand green and lavender flow colors as the light render — data colors are identical between themes, confirming only chrome flips as required.
      Legibility verdict: FAIL — same overlap issues as the light render (Commercial "45 TWh" pierced by the arrowhead, Coal/Losses label-on-ribbon overlap, Renewables/60 TWh crowding, gray seam-line artifacts across the ribbons), since these are geometry-driven issues that persist across both themes.
