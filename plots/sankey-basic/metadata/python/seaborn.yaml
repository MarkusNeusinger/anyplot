review:
  strengths:
  - Fully custom Sankey rendering (cubic Bezier flow paths with a smoothstep taper)
    built from raw matplotlib primitives, since seaborn/matplotlib have no native
    Sankey — a substantial engineering effort
  - Per-source flow shading via sns.light_palette ranks flows by value within each
    source, a genuine seaborn palette feature layered onto the Imprint categorical
    colors
  - Data is perfectly flow-conserving (each source's outflows and each target's inflows
    sum exactly to the totals shown in the node labels) and uses a plausible, neutral
    energy-sector scenario
  - 'Clear data storytelling: the dominant Gas source is emphasized via increased
    alpha and called out explicitly in a colored subtitle callout'
  - 'Correct Imprint categorical palette in canonical order, first series #009E73,
    and fully theme-correct chrome (background, text, node edge colors) in both light
    and dark renders'
  - Clean, deterministic, KISS-structured code with no functions/classes and no fake
    interactive elements
  weaknesses:
  - Overlapping semi-transparent flow ribbons blend into muddied intermediate hues
    where multiple flows cross (e.g. green/purple/blue overlaps) — under CVD simulation
    these blended zones are harder to attribute to a single source than the unblended
    node colors are; consider slightly higher alpha or thin ink-colored flow edges
    at crossings
  - Seaborn's own plotting API contributes only sns.set_theme + sns.light_palette;
    nearly all of the visual (flow beziers, node boxes, labels) is raw matplotlib,
    so Library Mastery is capped by how little idiomatic seaborn surface is exercised
    — a byproduct of seaborn having no native Sankey support rather than a flaw in
    this specific implementation
  - No formal legend; source/target identity relies on adjacent text labels next to
    each colored node, which works here but is worth double-checking readability at
    very small (mobile) scale
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "sankey-basic · python · seaborn · anyplot.ai" and the italic green subtitle callout are dark/near-black on the cream background and fully readable; node labels ("Gas / 120 TWh", "Residential / 95 TWh", etc.) render in bold dark text, clearly legible and not overlapping any flow ribbons or each other.
      Data: Three source nodes (Gas #009E73, Coal #C475FD, Nuclear #4467A3) on the left and three target nodes (Residential #BD8233, Industrial #AE3030, Commercial #2ABCCD) on the right — first series is the brand green as required. Flow ribbons use value-ranked tints of each source's color via seaborn's light_palette, with the dominant Gas flows drawn at higher alpha for emphasis.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle flip to light/green-on-dark and remain fully readable; node labels render in light cream text, no dark-on-dark instances found; text tested against both cream background and colored node boxes, all readable.
      Data: Node and flow colors are pixel-identical to the light render (green/purple/blue sources, ochre/red/cyan targets) — only the background, text, and node edge colors flipped, exactly as expected.
      Legibility verdict: PASS

    Edge check: cropped the top/bottom/left/right strips of both renders — title clears the top margin, node value labels ("120", "Residential 95 TWh", "Commercial 65 TWh", etc.) have full whitespace margin to the canvas border in every direction. No AR-09 edge clipping found.
