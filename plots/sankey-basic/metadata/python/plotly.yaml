review:
  strengths:
  - 'Correct Imprint palette applied to source nodes in canonical order, with #009E73
    assigned to the first source (Coal)'
  - Theme tokens (PAGE_BG, INK, INK_SOFT) correctly threaded through paper/plot background,
    title/tick fonts, and node border color, producing fully readable text in both
    light and dark renders
  - Link colors derived from each source node's color at alpha=0.4, directly implementing
    the spec's note that 'link opacity can help when flows cross over each other'
  - Canvas dimensions correct at 3200x1800 (landscape) via explicit width=800/height=450/scale=4
    and autosize=False
  - Clean, deterministic, KISS-style script with no unused imports and no fabricated
    interactivity
  - 'Title format compliant: descriptive prefix ''Energy Distribution'' followed by
    the mandated spec-id/language/library/anyplot.ai suffix'
  - Footnote annotation clarifies the flow unit (TWh) without cluttering the diagram
  weaknesses:
  - No manual node arrangement (x/y or ordering) was set, so Plotly's automatic layout
    produces a heavily crossing, 'hairball'-like diagram (especially between Residential/Commercial/Industrial)
    that makes individual flows harder to trace — reduces data-storytelling clarity
  - In regions where 3+ translucent (alpha=0.4) link bands overlap, the blended colors
    become muddier and harder to attribute to a single source at a glance
  - No library-distinctive Plotly Sankey features used beyond the basics (e.g. custom
    hovertemplate/valueformat, explicit node arrangement) — implementation stays at
    a generic Sankey usage level
