review:
  strengths:
  - 'Correct Imprint palette: source flows use #009E73/#C475FD/#4467A3/#BD8233 (canonical
    positions 1-4) with target nodes on the theme-adaptive neutral (INK) anchor, and
    both light/dark renders keep the data hues identical while chrome flips correctly'
  - Custom hand-built Sankey via layered smoothstep bezier link bands (mark_line filled=True)
    instead of a generic bar chart substitute — genuinely reads as a Sankey diagram,
    with node widths and link widths both proportional to flow value
  - Clean theme-adaptive chrome throughout (background, title, subtitle, legend fill/stroke,
    node stroke) with no pure-white/pure-black backgrounds
  - Deterministic, realistic energy-flow dataset covering 4 sources x 4 targets with
    varied magnitudes (10-45) and no circular flows, matching the spec's data requirements
  weaknesses:
  - 'Legend box (orient=''bottom-right'') overlaps the largest target node''s label
    in both renders — the ''Residential'' node (the bottommost target after Altair''s
    default y-axis inversion, total flow 95, second-largest of the four targets) has
    no visible text label; the legend panel (title ''Energy Source'' + 4 rows) sits
    directly on top of where that label would render. Only Transport, Industrial,
    and Commercial labels are legible. This directly violates the spec''s own Notes
    requirement: ''Node labels should be clearly visible and not overlap.'' Fix: move
    the legend outside the plotting bounds (e.g. as a separate concatenated legend
    chart, or reposition source_labels/target_labels so the right-side label column
    never falls under the bottom-right legend anchor — e.g. shrink node_padding/fill_ratio
    further or move the legend to top-right / outside via alt.Legend(orient=''none'',
    legendX=..., legendY=...) placed clear of the target label column).'
  - 'LM-02 (Distinctive Features): usage is fairly generic Vega-Lite layering (mark_rect,
    mark_line, mark_text) — none of Altair''s more distinctive capabilities (interactive
    selections/params, faceting, transform_fold, etc.) are used beyond a static tooltip
    encoding.'
  - DE-02 visual refinement is undercut by the legend/label collision — otherwise
    clean minimal chrome (no grid, no axes) is let down by this one sloppy overlap.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "sankey-basic · python · altair · anyplot.ai" and subtitle "Energy Flow from Sources to Sectors" render in dark ink, centered, clearly legible. Source node labels on the left (Renewable, Nuclear, Gas, Coal, top to bottom) are bold dark text, clearly legible. Target-side labels "Transport", "Industrial", "Commercial" (top to bottom) are legible, but the fourth (bottommost, largest) target node has NO visible label — its position is occupied by the "Energy Source" legend box, which overlaps it.
      Data: Four source node bars (ochre/Renewable, blue/Nuclear, lavender/Gas, green/Coal) on the left flow via curved translucent bands into four dark neutral-colored target bars on the right. First series (Coal) is confirmed #009E73 brand green.
      Legibility verdict: FAIL — one target node label ("Residential") is completely hidden behind the legend panel.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title and subtitle render in light ink (near-white / soft gray), clearly legible against the dark background — no dark-on-dark failures observed. Source and "Transport"/"Industrial"/"Commercial" target labels are light-colored and legible.
      Data: Confirmed identical hues to the light render — same ochre/blue/lavender/green source flows, target nodes on the theme-adaptive neutral (light ink) anchor. Only chrome (background, text, legend box fill/stroke) flipped, as required.
      Legibility verdict: FAIL for the same reason as the light render — the fourth (largest, bottommost) target node's label is hidden behind the "Energy Source" legend box; every other text element is readable.
