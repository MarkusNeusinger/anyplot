review:
  strengths:
  - 'Source-column colors follow the canonical Imprint order exactly, first series
    is #009E73 as required'
  - Dominant-flow emphasis (higher opacity + inline MLD label) directly implements
    the spec's own suggestion to use link opacity to manage crossing flows
  - Fully deterministic, single-source-of-truth Style-token-driven code with no unused
    imports and no functions/classes
  - Both themes render correctly with identical data colors and correct theme-adaptive
    chrome — no dark-on-dark or light-on-light failures
  - Native SVG <title> tooltips plus CSS hover states give real interactivity in the
    HTML output despite pygal having no native Sankey chart class
  - Canvas is exactly 3200x1800 with no edge clipping and generous margins around
    both node-label columns
  weaknesses:
  - Node ordering (source and target columns) isn't optimized to minimize link crossings
    — with 15 many-to-many flows the middle of the diagram becomes a dense crossing
    'hairball', making individual flow paths harder to trace even with the opacity
    weighting; a barycentric/median reorder heuristic would reduce clutter
  - Thinnest non-dominant ribbons (~18px at the 2 MLD flow, computed scale ~8.8 px/MLD)
    shrink to only ~2px when the image is scaled to the 400px mobile width — consider
    a minimum-width floor so the smallest flows stay visible on mobile
  - pygal has no native Sankey class, so the implementation never touches pygal's
    actual chart-building API — Style is used only to source color/font tokens, which
    caps how much idiomatic library usage the code can demonstrate (not really avoidable
    given the library gap, but scored accordingly under Library Mastery)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Water Distribution Network · sankey-basic · python · pygal · anyplot.ai" centered at top, clearly readable against the light bg. Four source node labels (Mountain Reservoir, Groundwater Wells, River Intake, Desalination Plant) with per-node MLD totals in a softer gray-brown to the left; four target node labels (Residential, Agriculture, Industrial, Municipal) with totals to the right. All chrome text is dark ink on the light surface — fully legible.
      Data: Source node bars colored green/lavender/blue/ochre in canonical Imprint order (first = #009E73). Target node bars are a neutral dark-gray (INK_SOFT), not part of the categorical pool, which is an appropriate choice since they aggregate multiple source colors. Flow ribbons are colored by source with two opacity tiers — dominant flows (≥20 MLD) drawn on top at ~0.72 alpha with an inline "XX MLD" value label, non-dominant flows underneath at ~0.48 alpha with no inline label (available via hover tooltip in the HTML). Ribbon widths are visibly proportional to flow value.
      Legibility verdict: PASS — no illegible or overlapping text found; all node labels, totals, title, and dominant-flow value labels are clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title now rendered in off-white, fully legible against the dark bg. Node labels flip to light ink (#F0EFE8) and totals to a softer light-gray (#B8B7B0) — no dark-on-dark issue anywhere; target node bars flip to a light gray (INK_SOFT dark-theme value) so they remain distinguishable from the near-black background.
      Data: All flow ribbon colors and the four source node bar colors are pixel-identical to the light render (only chrome — background, node-bar gray, and text — flips with theme), confirming the Imprint data palette stayed constant across themes as required. Dominant-flow value labels remain fully legible in the darker off-white ink used for data-adjacent text.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome and data-adjacent text reads clearly against the near-black surface.
