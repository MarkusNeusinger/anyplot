      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Water Distribution Network · sankey-basic · python · pygal · anyplot.ai" is bold dark text, fully visible, not clipped. Node labels (source names left, target names right) and their MLD totals are dark/muted-grey text respectively, both clearly legible against the light background.
      Data: Four source nodes colored in Imprint order — Mountain Reservoir #009E73 (green, first series correct), Groundwater Wells (purple), River Intake (blue), Desalination Plant (ochre). Flow ribbons match their source node's color at reduced alpha; dominant flows (>=20 MLD) are drawn at higher opacity with a "XX MLD" value label (28 MLD, 32 MLD, 22 MLD visible). Target nodes (Residential, Agriculture, Municipal, Industrial) are neutral grey bars.
      Legibility verdict: PASS — all text readable, no dark-on-light or light-on-light failures, no clipping at canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and node labels now rendered in light/off-white text, clearly legible against the dark background. Value labels (46 MLD, 62 MLD, etc.) render in a lighter muted grey, still readable, no dark-on-dark text found anywhere.
      Data: Node and ribbon colors are pixel-identical to the light render (#009E73 green first, same purple/blue/ochre order) — only the chrome (background, text) flipped as expected. Dominant-flow value annotations remain legible against the ribbon colors.
      Legibility verdict: PASS — no dark-on-dark failures, brand green #009E73 remains vivid on the dark surface, all chrome theme-correct.
