review:
  strengths:
  - Genuine hand-built Sankey via geom_polygon with cubic Hermite-interpolated ribbons
    — a real grammar-of-graphics workaround for plotnine's lack of native Sankey support,
    not a matplotlib fallback
  - 'Canvas utilization fix landed: the diagram core now spans ~89-93% of the 3200x1800
    canvas (measured via pixel bounding box), resolving the prior narrow-central-column
    critique'
  - Title now correctly reads 'Energy Flow · sankey-basic · python · plotnine · anyplot.ai'
    — the missing language token from the previous attempt is fixed
  - 'Correct Imprint palette usage: Coal is #009E73 (first series), Gas/Nuclear/Renewables
    follow canonical positions 2-4; theme-adaptive chrome (title, node labels, ''Sources''/''Sectors''
    captions, target-node fill) flips correctly between light and dark renders with
    data colors identical across themes'
  - Flow value labels are staggered per source so co-sourced flows don't collide,
    remain fully legible in both themes even where ribbons overlap
  - Data respects the 'no circular flows' rule, shows realistic sparsity (not every
    source feeds every sector), and depicts a neutral, plausible energy-flow scenario
    with proportional node/ribbon widths
  weaknesses:
  - 'DE-02: At ribbon-crossing zones (e.g. Gas/Nuclear/Renewables crossings around
    the diagram center) the semi-transparent overlaps still blend into off-palette
    muddy hues (teal, olive, rust) even after the alpha reduction from 0.62 to 0.44;
    try alpha ~0.3 or reorder node stacking to shrink the overlap area further'
  - 'LM-02: The manual polygon/Hermite-curve construction remains a generic ''draw
    shapes'' technique replicable in any plotting library — it doesn''t lean on anything
    distinctive to plotnine''s ggplot2-style grammar (e.g., faceting, stat layers)'
