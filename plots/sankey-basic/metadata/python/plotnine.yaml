review:
  strengths:
  - Genuine custom Sankey built via geom_polygon with cubic Hermite-interpolated ribbon
    curves — a real grammar-of-graphics workaround for plotnine's lack of native Sankey
    support, not a matplotlib fallback
  - 'Correct Imprint palette usage: Coal is #009E73 (first series), Gas/Nuclear/Renewables
    follow canonical positions 2-4; theme-adaptive chrome (title, node labels, ''Sources''/''Sectors''
    captions) flips correctly between light and dark renders'
  - Flow value labels are only drawn for larger flows and staggered along each source's
    outgoing ribbons so co-sourced flows don't collide
  - Data respects the 'no circular flows' rule, shows realistic sparsity (not every
    source feeds every sector), and depicts a neutral, plausible energy-flow scenario
  - Node and ribbon widths are correctly proportional to flow values, with alpha blending
    used to keep overlapping ribbons legible
  weaknesses:
  - 'SC-04: Title is ''Energy Flow · sankey-basic · plotnine · anyplot.ai'' — missing
    the mandated language token. Correct format is ''{Descriptive Title} · {spec-id}
    · {language} · {library} · anyplot.ai''; should read ''Energy Flow · sankey-basic
    · python · plotnine · anyplot.ai''.'
  - 'VQ-05: Horizontal canvas utilization is modest — the diagram core (nodes + links)
    sits in a fairly narrow central column with large empty margins on both sides
    before the canvas edge; widen the x_left/x_right spread or trim outer margins
    so the chart fills more of the 3200×1800 canvas.'
  - 'DE-02: At ribbon-crossing zones (e.g. Renewables vs. Gas/Nuclear crossings) the
    semi-transparent overlaps blend into muddy olive/brown hues outside the Imprint
    palette; consider slightly reducing alpha or adjusting node stacking order to
    shrink the overlap area.'
  - 'LM-02: The manual polygon/Hermite-curve construction is a generic ''draw shapes''
    technique replicable in any plotting library — it doesn''t lean on anything distinctive
    to plotnine''s ggplot2-style grammar (e.g., faceting, stat layers).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Energy Flow · sankey-basic · plotnine · anyplot.ai" is bold dark text, clearly legible and centered at the top. "Sources" and "Sectors" captions below the diagram are medium-gray, readable. Node labels (Coal, Gas, Nuclear, Renewables, Industrial, Commercial, Residential) are bold dark text, right/left-aligned outward from their nodes, no overlap with links.
      Data: Four source nodes colored in Imprint order (Coal=#009E73 green, Gas=lavender, Nuclear=blue, Renewables=ochre); three target nodes rendered in a neutral dark-gray block. Semi-transparent ribbons connect sources to targets with bold value labels (35, 25, 20, 18, 15, 15, 12, 12) placed on the ribbons, all readable against their host ribbon color.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues found. Title omits the required "python" language token (see weaknesses), which is a spec-compliance issue, not a legibility one.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, node labels, and value labels all render in light/off-white text, clearly visible against the dark background. "Sources"/"Sectors" captions are light gray, readable. Target nodes flip to a light silver-gray block (theme-adaptive), sources keep identical hues to the light render.
      Data: Source colors (green/lavender/blue/ochre) are pixel-identical to the light render — only the chrome (background, target-node fill, text colors) flips. No dark-on-dark text found anywhere, including at ribbon crossings.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements detected in either render.
