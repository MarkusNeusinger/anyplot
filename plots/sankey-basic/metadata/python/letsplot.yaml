review:
  strengths:
  - Smooth cubic-bezier flow curves (ease = t*t*(3-2t)) give the ribbons a professional,
    polished look instead of straight-line links
  - Dominant flow (Natural Gas → Residential, 35 TWh) is explicitly called out via
    a darker border, higher opacity, and a subtitle callout, creating a clear focal
    point and a real storytelling moment
  - Imprint palette applied in canonical order (Coal=#009E73, Natural Gas, Nuclear,
    Renewable) and identical across both renders; only chrome (background, node ink,
    text) flips between light and dark
  - Realistic, neutral energy-flow data matching the spec's own suggested example
    almost exactly, with plausible source/sector magnitudes
  - layer_tooltips() gives real flow- and node-level tooltips (flow id + value, node
    name + total) in the HTML export — genuine interactivity rather than a simulated
    one
  weaknesses:
  - Node/flow-total labels use geom_text(size=16) — roughly 3x the library guide's
    recommended 3-5mm for annotation text (prompts/library/letsplot.md). Measured
    cap-height is ~90px on the 1800px-tall canvas, so labels like 'Natural Gas (75
    TWh)' visually dominate the diagram and crowd out the actual flow ribbons. Reduce
    to size=5-6.
  - The 'Energy Source' legend title touches the Coal color swatch with zero gap in
    both renders (no space between the text and the box) — add legend spacing/padding
    so the title doesn't run into the first swatch.
  - Flow ribbons that cross (e.g. Renewable → Industrial crossing Natural Gas → Commercial)
    blend into slightly muddy intermediate colors at the overlap — acceptable given
    the alpha is used intentionally per the spec note on crossing flows, but keep
    an eye on it if more sources/targets are ever added.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold black title "sankey-basic · python · letsplot · anyplot.ai" and gray subtitle "Largest flow: Natural Gas → Residential (35 TWh)" both fully visible, not clipped at the top edge. A thin dark rectangle frames the diagram area. Node labels (Renewable/Nuclear/Natural Gas/Coal on the left, Commercial/Residential/Industrial on the right) render in dark gray with their TWh totals, but are notably oversized relative to the rest of the chart (see weaknesses). Bottom legend "Energy Source" plus four color swatches (Coal/Natural Gas/Nuclear/Renewable) sits on a slightly lighter background band; the legend title text touches the first swatch with no gap.
      Data: Four source nodes (black bars) on the left flow via curved, bezier-smoothed ribbons into three target nodes (black bars) on the right. Coal=teal green (#009E73), Natural Gas=light purple (#C475FD), Nuclear=slate blue (#4467A3), Renewable=ochre/brown (#BD8233) — matches canonical Imprint order, first series is #009E73. The Natural Gas → Residential ribbon is drawn with a darker outline and higher opacity to mark it as the dominant flow.
      Legibility verdict: PASS (all text readable against the light background; no dark-on-dark or light-on-light failures)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle now render in light/cream text, fully legible against the dark background, not clipped at the top. Node bars flip to a light cream/off-white fill (theme-adaptive ink token), replacing the black bars from the light render — correct theme adaptation. Node/legend labels render in light gray, same oversized-relative-to-chart issue as light render, and the same legend-title-touches-swatch spacing issue persists.
      Data: Flow ribbon colors are identical to the light render (Coal green, Natural Gas purple, Nuclear blue, Renewable ochre) — confirmed unchanged data-color mapping across themes; only chrome (background, node fill, text) flipped as required.
      Legibility verdict: PASS (all text is light-on-dark and clearly readable; no dark-on-dark failures found)
