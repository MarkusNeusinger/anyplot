review:
  strengths:
  - Correct, mathematically sound PCA implemented from scratch in the browser (standardization,
    correlation matrix, Jacobi eigendecomposition) since no numpy/sklearn is available
    client-side
  - Loading arrows are scaled sensibly against score extent (85% of max score range)
    so scores and arrows share the same visual space without one dominating
  - Custom label-declutter algorithm keeps the nearly-parallel Throughput/Temperature/Pressure
    arrow labels legible instead of stacking them
  - 'Imprint palette applied correctly in canonical order (Line A = #009E73 brand
    green, Line B = lavender, Line C = blue), identical across both themes'
  - Axis labels include PC1/PC2 variance-explained percentages as required by the
    spec
  - 'Idiomatic, distinctive MUI X composition: ChartContainer + useXScale/useYScale
    hooks to draw a custom SVG overlay (loading arrows) in data space, a pattern unique
    to MUI X''s composable chart architecture'
  - Realistic, neutral production-line QC sensor dataset (temperature/pressure/vibration/throughput)
    with plausible correlated variance structure across 3 groups
  weaknesses:
  - Missing `skipAnimation` on `<ChartContainer>` — the muix library rules mark this
    as mandatory ('always set both belts') alongside the harness's prefers-reduced-motion
    emulation; add `skipAnimation` to the ChartContainer props to not rely solely
    on the harness's reduced-motion belt.
  - No unit circle reference for the loading vectors even though correlation-biplot
    scaling (eigenvector × sqrt(eigenvalue)) is used — the spec explicitly suggests
    this for that scaling type; would strengthen interpretability of loading magnitudes.
  - Throughput and Temperature loading-arrow labels sit close together (near-parallel
    arrows) — legible but crowded; consider leader lines or a slightly larger MIN_LABEL_GAP
    for that cluster.
  - 'Design Excellence is solid but not yet publication-level: the grid and legend
    use MUI X defaults with no distinctive typographic or compositional flourish beyond
    the color-coded groups and arrow overlay.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "biplot-pca · javascript · muix · anyplot.ai" in bold dark ink, centered top. Axis labels "PC1 (70.7%)" and "PC2 (24.1%)" in dark ink, tick labels in softer gray-ink, all clearly legible. Subtle gray gridlines (horizontal + vertical) plus a slightly bolder pair of origin cross-lines. Legend (Line A / Line B / Line C) centered below the plot with square color swatches, readable dark-gray text.
      Data: Three scatter series in Imprint order — Line A = brand green #009E73, Line B = lavender/purple, Line C = blue — identical hues to the dark render. Four black loading-vector arrows (Vibration, Throughput, Temperature, Pressure) radiate from the origin with bold black labels; arrowheads and text are crisp against the light background.
      Legibility verdict: PASS — every title, axis label, tick label, arrow label, and legend entry is clearly readable with no dark-on-light or contrast problems.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light off-white ink, tick labels in a softer light-gray, all clearly legible against the dark surface. Gridlines are subtle light-gray at low opacity, still visible but not competing with data. Legend text is light-gray, matching the theme.
      Data: Same three series colors as the light render (green/lavender/blue) — confirmed identical, only chrome inverted. Loading-vector arrows and their labels are rendered in white/light ink (flipped from black in light mode via the `t.ink` token), fully legible with no dark-on-dark failures anywhere (title, axis text, tick labels, arrow labels, legend all pass).
      Legibility verdict: PASS — no dark-on-dark or unreadable elements; the theme token was correctly threaded through the custom SVG overlay as well as the built-in axis/legend chrome.
