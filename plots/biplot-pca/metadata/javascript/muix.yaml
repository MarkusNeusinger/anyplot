review:
  strengths:
  - 'Correct biplot construction: observation scores as colored points and variable
    loadings as labeled arrows from the origin, exactly matching the spec'
  - From-scratch Jacobi eigendecomposition and correlation-biplot scaling — genuine
    PCA computation rather than a canned library call
  - Custom label-decluttering algorithm keeps nearly-parallel loading labels (Throughput/Temperature)
    from overlapping
  - Distinctive use of MUI X's useXScale/useYScale hooks to draw a custom SVG overlay
    (arrows, unit circle, origin gridlines) precisely synced to the chart's data-to-pixel
    scale
  - Correct Imprint palette assignment in canonical order (green/lavender/blue), with
    theme-correct chrome in both light and dark renders
  - Realistic, neutral manufacturing QC dataset with two latent drivers producing
    genuine, plausible group separation
  weaknesses:
  - The dashed unit-circle reference renders as a visible ellipse, not a circle, because
    PC1 and PC2 share the same data-unit range but the landscape canvas gives them
    unequal pixels-per-unit — compute separate x/y radii from the actual pixel-per-unit
    ratio (or accept as a landscape trade-off) so the correlation-magnitude reference
    reads as a true circle
  - Both-axis grid plus the default MUI X axis frame gives a fairly busy technical-plot
    look; lightening or removing the axis tick marks would push Design Excellence
    further
  - Data storytelling relies solely on color separation between production lines;
    a short callout on which line clusters toward which loading direction would sharpen
    the insight
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "biplot-pca · javascript · muix · anyplot.ai" in bold dark ink at top-center, clearly legible. Axis labels "PC1 (70.7%)" / "PC2 (24.1%)" and tick labels in dark/soft-dark ink, all readable. Legend ("Line A", "Line B", "Line C") at bottom-center with color swatches, readable. Subtle light-gray grid on both axes. Loading arrows and their variable-name labels (Vibration, Throughput, Temperature, Pressure) drawn in solid black ink, clearly visible against the cream background. Dashed gray unit-circle (rendered as an ellipse due to the landscape aspect ratio) surrounds the origin.
      Data: First series (Line A) is brand green #009E73, second (Line B) is lavender #C475FD, third (Line C) is blue #4467A3 — correct canonical Imprint order. Points are clearly distinguishable by color and reasonably sized for ~60 observations.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels flip to light ink (near-white/soft-light), fully readable against the dark background. Legend text is light and legible. Grid lines are subtle light strokes at low opacity. Loading arrows and their labels flip to white/light ink, remaining clearly visible against the dark surface. The dashed unit-circle overlay is drawn in a light gray tone, still visible.
      Data: Colors are identical to the light render (#009E73 green, #C475FD lavender, #4467A3 blue) — only chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome elements are correctly inverted for the dark surface.
