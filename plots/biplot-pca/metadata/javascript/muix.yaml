review:
  strengths:
  - Loading vectors are true correlation loadings (eigenvector × √eigenvalue) scaled
    by one common factor, and the dashed unit circle uses the same factor, so arrow
    length reads directly against the correlation circle; equal x/y scaling keeps
    the circle round
  - Composes ChartsContainer with ScatterPlot, ChartsGrid, axes and an item-triggered
    ChartsTooltip, and draws the arrows, circle and origin cross-hairs as a custom
    SVG layer positioned via useXScale/useYScale, so every overlay lives in the chart's
    own data coordinates
  - Arrow labels sit at their own tips on semi-opaque page-colored pills, attributable
    even for the near-parallel Throughput and Temperature arrows
  - Axis labels carry the computed variance share (PC1 70.7 %, PC2 24.1 %) and a subtitle
    summarizes the 94.8 % explained by both
  - Plausible manufacturing QC scenario (three facilities, temperature/pressure/vibration/throughput)
    with a deterministic Park–Miller LCG; theme tokens drive all chrome in both renders
  weaknesses:
  - 'Suggestion: the equal-aspect x range of −6 to 6 leaves wide empty bands left
    of −4.5 and right of 3.5; narrowing the 200 px side margins would give the scatter
    more width while keeping the circle round.'
  - 'Suggestion: the native ChartsLegend could carry the three facility entries, keeping
    only the unit-circle key as custom markup.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold dark title "biplot-pca · javascript · muix · anyplot.ai", grey subtitle "60 observations · Production facility: 3 · 4 standardized features · PC1 + PC2 explain 94.8% variance", HTML legend row (three facilities + dashed "Correlation unit circle"), axis titles "PC1 (70.7% variance)" and "PC2 (24.1% variance)", ticks −6…6 and −4…4, subtle grey grid with slightly stronger origin cross-hairs. All readable.
      Data: 60 score points in #009E73 (Munich Assembly), #C475FD (Stuttgart Press), #4467A3 (Dresden Optics), separating along PC1; four near-black arrows from the origin with arrowheads (Vibration up-left, Throughput and Temperature up-right nearly parallel, Pressure right slightly down), bold labels at the tips on page-colored pills; dashed round unit circle of radius ~3.5 that the Pressure/Throughput/Temperature tips nearly reach.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and ticks flip to light ink; grid and dashed circle in soft grey, visible. No dark-on-dark text.
      Data: point colors identical to the light render; arrows and their labels flip to light ink and remain clearly visible.
      Legibility verdict: PASS
