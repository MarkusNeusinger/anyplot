review:
  strengths:
  - Implements a real Jacobi-eigenvalue PCA from scratch (correlation matrix, eigen-decomposition,
    projection) with a deterministic seeded LCG — no shortcuts or fake data given
    the browser has no PCA library.
  - 'Correct correlation-biplot construction: loadings scaled by sqrt(eigenvalue)
    then rescaled to match the score cloud''s magnitude, plus a dashed unit-circle
    reference exactly as the spec''s ''Notes'' section suggests.'
  - Loading arrows are hand-drawn with proper arrowheads and outward-anchored text
    labels for all 6 variables (Temperature, Pressure, Humidity, FlowRate, Vibration,
    ToolWear) — matches spec's 'label each loading arrow' requirement.
  - 'Full Imprint palette + theme-chrome compliance verified in both renders: Line
    A/B/C use palette positions 1-3 (#009E73 green first), backgrounds are the correct
    warm off-white/near-black, and all text/grid/arrow colors flip correctly with
    no dark-on-dark or light-on-light failures.'
  - Axis titles show 'PC1 (55.1%)' / 'PC2 (38.9%)' — variance-explained percentages
    included exactly as the spec requires.
  - Clean idiomatic Chart.js plugin architecture (beforeDraw for background, afterDatasetsDraw
    for spines/unit-circle/arrows) cleanly separates concerns instead of hacking everything
    into one plugin.
  weaknesses:
  - Title fills only ~33% of plot width at the default 22px fontsize — well under
    the 50-70% guideline for a 47-char title on a 3200px-wide canvas; a slightly larger
    fontsize would give it more visual presence relative to the chart body.
  - Data storytelling (DE-03) is functional but flat — no emphasis technique (e.g.
    a callout on the most-separated group, or fading the unit circle further) draws
    the eye to the biplot's key insight beyond the raw arrow directions.
  - Seven top-level helper functions/plugin objects (lcg, randn, jacobiEigen, bgPlugin,
    spinePlugin, unitCirclePlugin, loadingArrowPlugin) push code complexity higher
    than the KISS ideal — largely unavoidable for an in-browser PCA implementation,
    but bgPlugin and spinePlugin could be merged into one draw plugin to trim one
    function.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white — correct light-theme surface.
      Chrome: Title "biplot-pca · javascript · chartjs · anyplot.ai" in bold dark ink at top-center; axis titles "PC1 (55.1%)" and "PC2 (38.9%)" in dark ink; tick labels in softer dark gray; subtle light-gray gridlines on both axes; legend "Line A / Line B / Line C" top-right with circular swatches; an L-shaped left+bottom spine frame in soft ink; six loading-vector labels (Humidity, Vibration, FlowRate, ToolWear, Temperature, Pressure) in bold dark text at each arrow tip. All fully readable against the light background.
      Data: ~90 scatter points across 3 groups — Line A green (#009E73), Line B lavender/purple, Line C blue — matches Imprint palette positions 1-3 with brand green first. Six dark-gray arrows radiate from the origin to each loading, with a dashed ellipse (unit circle) as magnitude reference.
      Legibility verdict: PASS — no light-on-light issues; all text and data are clearly distinguishable from the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black — correct dark-theme surface.
      Chrome: Same title, axis titles, tick labels, and loading-arrow labels, now rendered in light/off-white ink, fully legible against the dark surface; gridlines are faint light-gray; the L-shaped spine and loading arrows render in light gray (theme-adaptive ink-soft token) instead of the light render's dark gray, remaining clearly visible; legend swatches and text also flip to light ink.
      Data: Point colors are pixel-identical to the light render — same green/lavender/blue for Line A/B/C — confirming only chrome (not data colors) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, tick label, legend entry, and loading label is clearly legible against the near-black background. Brand green remains vivid and distinguishable on the dark surface.
