review:
  strengths:
  - Implements a genuine PCA (correlation matrix + Jacobi eigenvalue decomposition)
    entirely client-side rather than faking loadings — real dimensionality reduction,
    not a lookalike.
  - Dominant-loading visual emphasis (full ink + heavier stroke on the strongest loading
    vector) is a thoughtful data-storytelling touch that doesn't reuse a data/group
    color.
  - Synthetic data has genuine low-rank correlation structure (per-line latent offsets
    + shared noise), producing a realistic and recoverable PCA signal.
  - Clean theme handling — verified no dark-on-dark or light-on-light issues, and
    no clipping at any canvas edge.
  weaknesses:
  - Arrow-label font (sans-serif) doesn't match Chart.js's own default font family
    used for ticks/title/legend — minor typographic inconsistency between plugin-drawn
    canvas text and Chart.js-rendered text.
  - Grid lines are a bit more prominent than the "barely-there" ideal described in
    the style guide; consider a slightly lower-opacity grid color for a more refined
    look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "biplot-pca · javascript · chartjs · anyplot.ai" in bold dark ink at top; legend top-right (Line A/B/C with circular swatches); axis titles "PC1 (55.1%)" / "PC2 (38.9%)" and tick labels in ink-soft gray; L-shaped spine (left+bottom only); six loading-arrow labels (Humidity, Vibration, FlowRate, ToolWear, Temperature, Pressure) in dark ink. All clearly readable against the light background.
      Data: ~90 scatter points colored green (Line A, #009E73), magenta/purple (Line B), blue-gray (Line C); loading arrows mostly muted ink-soft gray with the dominant loading (Temperature) in full-ink bold; dashed gray unit-circle reference ellipse.
