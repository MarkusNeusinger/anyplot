review:
  strengths:
  - 'Correct correlation-biplot construction from scratch: standardizes columns, builds
    the correlation matrix, and diagonalizes it with a Jacobi eigenvalue routine —
    a legitimate approach given d3 has no linear-algebra library'
  - Dashed unit circle correctly scaled to the same arrowScale as the loading vectors,
    giving a real reference for loading magnitude as the spec suggests
  - 'Data storytelling: the italic subtitle names the strongest PC1 driver and the
    corresponding arrow is rendered bolder/thicker than the rest — a genuine visual
    hierarchy, not just a data dump'
  - Text halos (paint-order stroke in page-bg color) behind loading labels keep them
    legible where they cross arrows or the unit circle, in both themes
  - 'Imprint palette applied in canonical order (#009E73, #C475FD, #4467A3) and fully
    theme-correct chrome in both renders (warm off-white / warm near-black backgrounds,
    ink-adaptive arrows and axis text)'
  - Axis labels include variance-explained percentages per PC, matching the spec's
    example format
  - Square canvas is the right call here — an equal-aspect plot area is required for
    loading-vector angles to read correctly, and the layout code explicitly computes
    a square plotSize before scaling
  weaknesses:
  - Title occupies only ~50% of canvas width at 26px — on the low end of the 50-70%
    target for a short, non-prefixed mandated title; a touch more font size would
    use the whitespace better without risking overflow
  - PCA helper functions (lcg, gaussian, jacobiEigen) push the file structure away
    from strict flat KISS Imports->Data->Plot->Save shape; justified since d3 has
    no eigen-decomposition primitive, but still a minor deviation from the ideal
  - Only one loading arrow (top PC1 driver) gets visual emphasis — a second callout
    on the top PC2 driver, or direct percentage labels on the loading arrows, would
    deepen the storytelling further
  - No axis grid lines; acceptable minimalist choice for a biplot with many arrows
    already crossing the origin, but a very faint y-axis-only or both-axes grid at
    10-15% opacity could help readers line up score points against the axis ticks
    without competing with the arrows
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "biplot-pca · javascript · d3 · anyplot.ai" centered at top, italic dark-gray subtitle below it calling out the top PC1 driver ("Sepal Length loads most strongly on PC1 — the axis separating growth-habit groups"). Axis titles "PC1 (65.1%)" and "PC2 (20.0%)" in dark ink, tick labels in soft dark gray, L-shaped axis frame (only left/bottom domain lines). A "Growth habit" legend with three color swatches (Compact/Standard/Vigorous) sits to the right of the plot, vertically centered. All text is clearly readable against the light background — no light-on-light failures observed.
      Data: Six black arrows radiate from the origin (Sepal Length, Petal Length, Petal Width, Sepal Width, Leaf Area, Stem Height), each labeled with a halo-stroked text label; the Sepal Length arrow is visibly thicker/bolder than the others per the top-driver emphasis. A dashed gray unit circle surrounds the arrows as a magnitude reference. ~90 semi-transparent circular score points are colored by group: green (#009E73, Compact), lavender/purple (Standard), and blue (Vigorous) — first series is the mandated brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis titles/tick labels, now rendered in light ink (white/off-white) and soft light gray for secondary text and legend labels. Axis frame lines are light-colored. All text is clearly readable against the dark background — no dark-on-dark failures; tick labels, axis titles, legend text, and arrow labels all flip correctly to light ink.
      Data: The six loading arrows and their halo-stroked labels flip to white/light ink (chrome), while the unit circle stays a subtle light-gray dash. The three group colors (green, lavender, blue) are visually identical to the light render — confirming the Imprint categorical palette data colors are constant across themes, only chrome flipped.
      Legibility verdict: PASS
