review:
  strengths:
  - From-scratch correlation-matrix PCA via a cyclic Jacobi eigenvalue solver, entirely
    in vanilla D3/JS with a seeded LCG for deterministic reproducibility — a genuinely
    hard feature to implement without numpy/sklearn.
  - Imprint palette applied in canonical order (green/lavender/blue) and fully theme-adaptive
    chrome (arrows, axis text, halo strokes) verified identical data colors across
    both light and dark renders.
  - Correlation-biplot unit circle correctly implemented as a loading-magnitude reference,
    matching the specification's optional recommendation.
  - Quadrant-aware text-anchor/baseline logic on the loading labels (text-anchor and
    dominant-baseline branch on arrow sign) avoids most label collisions despite 6
    arrows fanning in different directions.
  - Clean, correctly formatted title, accurate PC1/PC2 variance-percentage axis labels,
    and a legend that matches the group labels exactly.
  weaknesses:
  - A score point sits directly on top of the 'Sepal Width' loading label in both
    renders (near the label's trailing 'd'/'th') — nudge the label's offset multiplier
    or increase its background-stroke width slightly so it clears any nearby point.
  - Several score points overlap heavily in the dense center-left cluster where Standard
    and Vigorous groups meet — lower fill-opacity slightly (e.g. 0.65) or reduce marker
    radius by 1px to reduce overplotting in that region.
  - Title occupies only ~35-38% of the square canvas width, well under the ~50-70%
    guideline for a short mandated title — there's ample top whitespace, so increasing
    the title font-size a few px (e.g. 22px to 25-26px) would strengthen the visual
    hierarchy without risking overflow.
  - 'Design Excellence is solid but generic: the chart relies entirely on color-coded
    group separation for its story with no additional emphasis (e.g. a subtle annotation
    or size/weight variation calling out which loadings best explain the group split)
    — consider a small enhancement to elevate storytelling beyond default grouping.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "biplot-pca · javascript · d3 · anyplot.ai" in bold dark ink at top-center. Axis titles "PC1 (65.1%)" (bottom, centered) and "PC2 (20.0%)" (left, rotated) in dark ink. Tick labels (-4 to 4 on both axes) in soft dark gray. Axis domain lines dark, L-shaped (no top/right spine). Dashed unit-circle reference in light gray. Legend "Growth habit" with three swatches (Compact/Standard/Vigorous) at right, all text and labels clearly legible against the light background.
      Data: Six black loading arrows radiate from the origin (Sepal Length, Petal Length, Petal Width, Sepal Width, Leaf Area, Stem Height), each labeled in bold black text with a light halo stroke for contrast. ~90 score points colored green (#009E73, Compact), lavender/purple (Standard), and steel blue (Vigorous) — first series is correctly the Imprint brand green. Points show clear separation along PC1: green cluster on the left, blue cluster on the right, purple in between.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues found. One minor defect: a stray point sits directly against the "Sepal Width" label text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light/off-white tones, clearly visible against the dark background. Axis domain lines are light-colored. The unit circle is a subtle light-gray dashed stroke, visible but not competing with data. Legend swatches and text are all legible in white/light-gray.
      Data: Loading arrows flip to white (from t.ink token) with light-on-dark halo strokes on their labels — fully legible. Score point colors are identical to the light render (green #009E73, lavender, blue) — confirms data colors are theme-independent; only chrome flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures found; every title/label/tick is clearly visible against the dark background.
