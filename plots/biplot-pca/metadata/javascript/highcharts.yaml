review:
  strengths:
  - 'Correct Imprint palette: brand green (#009E73) is the first series (Cultivar
    A), canonical order continues for the other two groups, and chrome (background,
    text, grid, legend) is theme-correct in both renders'
  - 'Full spec coverage: PC1/PC2 observation scores colored by group, scaled loading
    arrows from the origin labeled with variable names, variance-annotated axis titles
    (''PC1 (64.1%)'', ''PC2 (19.5%)''), and a dashed unit circle for correlation-biplot
    scaling'
  - Genuine from-scratch PCA (Jacobi eigenvalue decomposition on the correlation matrix)
    with a deterministic seeded LCG/Box-Muller PRNG — solid engineering given no PCA
    library is available in the browser
  - Distinctive use of Highcharts' low-level chart.renderer SVG API to draw the loading
    arrows, arrowheads, labels, and unit circle since the annotations module isn't
    loaded
  - Clean typography hierarchy with explicit font sizes throughout (title 22px, subtitle
    14px, axis titles 16px, ticks/legend 14px), legible in both light and dark renders
    including at mobile scale
  weaknesses:
  - 'Design Excellence stays at ''good, not exceptional'': the plot area still reads
    close to a well-configured Highcharts default (standard grid on both axes, no
    extra visual refinement like reduced tick marks or a stronger focal emphasis)
    — consider trimming the grid further or adding one deliberate emphasis technique'
  - The three right-side loading labels (Alcohol, Phenols, Flavanoids) sit close together
    vertically near y=0 to y=0.9 — at mobile width (~400px) they crowd toward each
    other; nudge their placement or angle slightly apart to guarantee separation at
    small sizes
  - 'LM-01: the arrow/label rendering happens through manual renderer.path/text calls
    (necessary since the annotations module isn''t loaded) rather than a higher-level
    Highcharts construct — correct given the constraint, but keeps idiomatic-usage
    score from maxing out'
  - 'DE-03: color-separated clusters and radiating arrows create structure, but the
    chart doesn''t call out a specific interpretive takeaway (e.g. which cultivar
    correlates most with which chemical variable) — a touch more emphasis would elevate
    the storytelling'
  image_description: |-
