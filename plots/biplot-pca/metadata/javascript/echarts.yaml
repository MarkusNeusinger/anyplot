review:
  strengths:
  - Correct correlation-loading scaling (loadings = eigenvector * sqrt(eigenvalue))
    paired with a matching unit-circle reference — a mathematically proper correlation
    biplot, not a naive coefficient-vector plot.
  - Power-iteration PCA with Hotelling deflation implemented from scratch in the browser
    (no ML library available in this runtime) — solid engineering given the echarts/JS
    constraints.
  - Auto sign-orientation (flips PC1/PC2 sign so Line A reads positive-PC1, Line B
    reads positive-PC2) is a thoughtful reproducibility/interpretability touch since
    PCA sign is otherwise arbitrary.
  - Loading-arrow labels use theme-matched background chips (t.pageBg) so text stays
    legible over the split-line grid in both themes.
  - Title format, PC1/PC2 axis labels with variance-explained percentages, and legend
    all match the specification precisely.
  - 'Palette fully compliant: first group is #009E73, data colors identical across
    light/dark, and all chrome (background, text, grid, legend) is theme-correct in
    both renders.'
  weaknesses:
  - The 'Variable loadings' legend entry renders as a plain black/white rounded rectangle
    that doesn't read as an arrow/vector — either give it a custom legend icon or
    drop it from the legend, since the vectors and their text labels already convey
    the meaning on the plot itself.
  - 'Design polish stops short of publication level: the origin axis lines (axisLine
    onZero, inkSoft, width 1.5) are similar weight to the loading vectors (ink, width
    2.5) and compete visually near the origin where several arrows converge — dim
    the origin cross lines or lighten their opacity so the loading vectors read as
    the clear focal element.'
  - 'Data storytelling is good but not excellent: the layout supports interpretation
    but requires the viewer to synthesize which vector explains which group''s separation
    themselves — a subtle emphasis technique (e.g. bolding/coloring the vector most
    aligned with the dominant group split) would raise this further; not required
    by the spec, but would strengthen the story.'
  - With 90 total points at a fixed opacity of 0.85, the densest cluster near the
    origin (where all three groups overlap) shows tight marker overlap — a slightly
    lower alpha (~0.75) in that region, or marginally smaller markers, would separate
    points better per the data-density heuristic.
  image_description: |-
