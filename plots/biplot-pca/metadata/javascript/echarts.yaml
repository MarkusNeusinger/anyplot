review:
  strengths:
  - Correct correlation-loading scaling (loadings = eigenvector * sqrt(eigenvalue))
    paired with a matching unit-circle reference — a proper correlation biplot, not
    a naive coefficient-vector plot
  - Power-iteration PCA with Hotelling deflation implemented from scratch in the browser
    (no ML library available in this runtime), with deterministic seeded LCG data
    generation
  - Auto sign-orientation (flips PC1/PC2 sign so Line A reads positive-PC1, Line B
    reads positive-PC2) — thoughtful since PCA sign is otherwise arbitrary
  - 'Repair attempt cleanly resolved all three prior weaknesses: legend now shows
    only the three score-group swatches (mismatched ''Variable loadings'' rectangle
    removed), origin axis lines are visibly dimmed (opacity 0.35) so loading vectors
    read as the clear focal element, and marker opacity (0.75) now separates the densest
    cluster near the origin'
  - Title, PC1/PC2 axis labels with variance %, and legend all match the specification
    precisely; palette fully compliant with identical data colors across light/dark
    and theme-correct chrome in both renders
  weaknesses:
  - 'Loading-arrow labels overlap their own arrowheads: the ''Pressure'', ''Humidity'',
    and ''Vibration'' arrows terminate with the arrowhead symbol drawn directly on
    top of the first 1-2 letters of the label (confirmed by close-up crop in both
    renders). Only ''Temperature'' (near-horizontal vector) clears cleanly; ''Throughput''
    just grazes the label top. Root cause: the fixed `distance: [cos(angle)*34, -sin(angle)*34]`
    offset is too small for steeper vector angles combined with the `symbolSize: [0,
    14]` arrowhead — increase the offset magnitude (e.g. scale by a larger constant
    or add the arrow''s half-length) so the label clears the arrowhead for all five
    angles, not just near-horizontal ones.'
  - Data storytelling is solid but not excellent — no explicit emphasis (e.g. bolding/coloring)
    on the vector most aligned with the dominant group split, so the reader has to
    infer the key driver themselves
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "biplot-pca · javascript · echarts · anyplot.ai" centered at top in dark ink. Legend shows only the three score-group swatches (Line A/B/C) — the mismatched "Variable loadings" rectangle swatch from the previous attempt has been removed. PC1 (63.1%) and PC2 (34.5%) axis titles with variance percentages, dark-ink axis names, soft-ink tick labels, subtle light-gray gridlines. Origin cross-hair axis lines are now visibly dimmed (thin, low opacity) so they no longer compete with the loading vectors.
      Data: Three scatter groups — Line A in brand green (#009E73), Line B in lavender, Line C in blue-gray — with 0.75 opacity giving good separation in the dense cluster near the origin. Five black loading-arrow vectors (Temperature, Pressure, Vibration, Humidity, Throughput) radiate from the origin with bold labels on theme-matched background chips, plus a dashed unit circle for magnitude reference. Close-up inspection shows the Pressure, Humidity, and Vibration arrowheads are drawn directly over the first letter(s) of their own labels (arrow-into-glyph overlap), while Temperature and Throughput are clear.
      Legibility verdict: PASS (all text is readable against the light background; the arrow/label overlap noted above is a visual collision, not an illegibility issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend, axis titles, and tick labels render in light/off-white ink, fully legible. Dimmed origin axis lines remain subtle. Grid lines are visible but unobtrusive.
      Data: Data colors are identical to the light render (green/lavender/blue-gray, same series positions) — only chrome flipped. Loading-arrow strokes and labels flip from black/dark-ink to white/light-ink and remain fully legible against the dark background — no dark-on-dark failures. Same Pressure/Humidity/Vibration arrowhead-over-label overlap reproduces identically in this theme (confirmed via close-up crop), consistent with it being a geometry issue rather than a theme-specific rendering bug.
      Legibility verdict: PASS (no dark-on-dark failures; same arrow/label overlap present as in the light render).
