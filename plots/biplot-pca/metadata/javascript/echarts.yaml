      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "biplot-pca · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Legend below title shows a "Variable loadings" swatch plus three colored group swatches (Line A/B/C), all readable. PC1/PC2 axis lines, tick labels, and axis titles ("PC1 (63.1%)", "PC2 (34.5%)") are dark ink/soft-ink and clearly legible against the light background. Subtle light-gray split-line grid is visible but does not compete with data.
      Data: Three groups of scatter points — Line A in brand green (#009E73), Line B in lavender/purple, Line C in blue — each distinguishable. Five black loading-arrow vectors (Temperature, Pressure, Vibration, Humidity, Throughput) radiate from the origin, labeled in bold dark text with a light background chip for contrast against the grid. A dashed unit circle provides a reference for loading magnitude. First series is confirmed brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and legend text render in light/off-white ink, fully legible against the dark background. Axis tick labels and axis titles use a lighter soft-ink tone, still clearly readable. Grid lines are subtle but visible (light, low-opacity split lines).
      Data: Same three group colors as the light render (green, lavender, blue) — confirmed identical positions and hues, only chrome flipped. Loading-arrow vectors and their labels switch from black/dark-ink strokes and text to white/light-ink strokes and text, remaining fully legible against the dark background with no dark-on-dark failures. The dashed unit circle remains visible at a similar subtle contrast.
      Legibility verdict: PASS — all text and vector labels are clearly readable against the dark background; no dark-on-dark or contrast failures observed.
