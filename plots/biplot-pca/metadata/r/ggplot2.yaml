review:
  strengths:
  - Correct PCA on standardized iris with prcomp; variance explained is computed with
    summary() and shown in both axis titles (73.0 %, 22.9 %)
  - All four loadings share one scale factor, so arrow directions and relative lengths
    are faithful; coord_fixed keeps the circle round
  - Theme tokens threaded through every chrome element; data colors identical in both
    renders
  weaknesses:
  - 'VQ-02 (both): the Petal.Length and Petal.Width labels are drawn on top of virginica
    score points around PC1 ≈ 2, PC2 ≈ 0 to -0.6 → lift the label text clear of the
    points, e.g. a page-colored label background (geom_label with fill = PAGE_BG,
    linewidth = 0) or a slightly larger offset beyond the tips. Likely cause: geom_text
    with no background at PC1*1.15 + 0.35.'
  - 'VQ-05 (both): coord_fixed on the 16:9 canvas shrinks the panel to about half
    of the canvas width, leaving empty bands of roughly 20 % on the left and 15 %
    beside the legend → fill more width, e.g. the 2400x2400 square canvas or the legend
    moved inside/below the panel. Likely cause: coord_fixed() with width = 8, height
    = 4.5 and a right-hand legend.'
  - 'SC-03 (both): the dashed reference circle has radius 1 in score units while every
    loading is drawn x3.2, so it marks a loading magnitude of about 0.31 instead of
    1 → radius 3.2 (the loading scale factor, +2.2). Likely cause: annotate(''path'',
    x = cos(...), y = sin(...)) not multiplied by the loading scale.'
  - 'CQ-03 (code): library(dplyr) is loaded but no dplyr function is called → remove
    it. Likely cause: leftover import.'
  - 'Suggestion: write the arrow labels for a reader ("Petal length") instead of the
    raw R column names with dots.'
