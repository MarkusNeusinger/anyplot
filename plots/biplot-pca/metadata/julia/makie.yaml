review:
  strengths:
  - The 'Sepal Width' loading label no longer crowds the neighboring setosa point
    cluster — the tip-vs-label spacing fix from Attempt 1 feedback is visually confirmed
    in both renders
  - Correct, deterministic correlation-matrix PCA (standardize → cor() → eigen(),
    sorted by descending eigenvalue) with DataAspect() keeping the unit-circle reference
    circular, plus full spec coverage (variance-% axis labels, labeled loading arrows,
    unit circle, group coloring)
  - Loading-arrow linewidth is scaled by loading magnitude (arrow_linewidth = 1.8
    + 1.8 * relative magnitude), a genuine, visually-confirmed hierarchy cue that
    makes the dominant Sepal Length/Sepal Width drivers read as thicker arrows than
    Petal Length/Petal Width
  - Clean theme-adaptive chrome and Imprint palette compliance identical across both
    renders; backgrounds, text, and legend swatches are theme-correct with no dark-on-dark
    or light-on-light failures
  weaknesses:
  - 'The per-group 1.5σ density ellipses (poly! block, lines ~99-111) render zero
    visible pixels in EITHER theme — verified by pixel-level inspection of the exact
    predicted ellipse bounding box (e.g. setosa: cols 1565-1727, rows 745-1477 on
    the 2400x2400 canvas), which shows only background and marker anti-aliasing, no
    fill tint or stroke arc. The math (covariance eigendecomposition, radii, rotation)
    is correct and the ellipse extent is well within the visible axis range, so this
    is a rendering/API bug, not a data-range issue. Likely cause: the `color = (IMPRINT_PALETTE[i],
    0.10)` / `strokecolor = (IMPRINT_PALETTE[i], 0.35)` tuple-alpha syntax on `poly!`
    may not apply the way it does on `hlines!`/`vlines!` in this Makie version. Fix
    by switching to explicit `RGBAf(c.r, c.g, c.b, alpha)` (as already used for the
    gridlines/hlines in this same file) and re-render to CONFIRM the ellipses are
    actually visible before relying on them for DE-03 credit — or remove the dead
    code if it can''t be made to render.'
  - '`Legend(fig[1, 2], ax, "Species"; framevisible = false, ...)` still produces
    a clearly visible bordered box around the legend in both renders (confirmed by
    direct crop inspection) — the borderless-legend fix requested after Attempt 1
    did not take effect. Investigate whether this Makie/CairoMakie version needs a
    different attribute (e.g. explicit `framecolor = :transparent` or a GridLayout
    box style) to actually remove the frame, and visually verify the rendered PNG
    before claiming the fix landed.'
  - Because neither of the two headline Attempt-1-feedback fixes (density ellipses,
    borderless legend) is visually present in the output, Design Excellence (DE-01/DE-02/DE-03)
    is scored on the unchanged actual appearance rather than the code's intent — the
    plot still relies primarily on species color plus the new (working) arrow-weight
    cue for its visual hierarchy
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly (measured RGB 250,248,241) — not pure white.
      Chrome: Title "biplot-pca · julia · makie · anyplot.ai" bold dark ink, centered near the top; axis labels "PC1 (73.0%)" / "PC2 (22.9%)" with variance-explained percentages; tick labels and the four loading-vector labels (Sepal Length, Sepal Width, Petal Length, Petal Width) all in dark ink, clearly readable; "Species" legend to the right in an elevated cream box with a visible black border/frame (despite the source setting framevisible=false — this border is still rendered). All text is legible against the light background with no light-on-light issues.
      Data: 150 iris points colored by species — setosa = brand green #009E73 (first series, correct), versicolor = lavender #C475FD, virginica = blue #4467A3 (canonical Imprint order). Four black loading arrows radiate from the origin with a dashed unit-circle reference; arrow linewidth visibly varies by loading magnitude (Sepal Length/Sepal Width arrows read thicker than Petal Length/Petal Width). Pixel-level inspection of the predicted per-group density-ellipse bounding boxes found NO visible fill or stroke pixels — the ellipse code does not produce a visible effect in this render.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly (measured RGB 26,26,23) — not pure black.
      Chrome: All chrome (title, axis labels, tick labels, loading-vector labels, gridlines, legend box/text) correctly flips to light ink; no dark-on-dark failures observed. The legend still shows the same visible border (now light-colored) as the light render — same non-functional framevisible=false issue, just theme-correct in color.
      Data: Species point colors (green/lavender/blue) and loading-arrow color logic are identical to the light render, confirming the categorical palette is held constant across themes. Same absence of any visible density-ellipse pixels as in the light render.
      Legibility verdict: PASS
