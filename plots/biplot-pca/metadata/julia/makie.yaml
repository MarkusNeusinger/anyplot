review:
  strengths:
  - 'Full spec coverage: unit-circle reference, variance-% axis labels, and label-collision
    avoidance (label_dy nudging) go beyond the spec''s minimum requirements'
  - Correct, deterministic correlation-matrix PCA implementation (standardize → cor()
    → eigen(), sorted by descending eigenvalue) with DataAspect() keeping the reference
    circle circular
  - Clean theme-adaptive chrome and Imprint palette compliance identical across both
    renders
  weaknesses:
  - 'Design Excellence is the main gap to publication quality: consider a stronger
    focal point (e.g., subtle per-group density hulls/ellipses, or emphasizing the
    dominant loading vectors with slightly heavier line weight than the shorter ones)
    to push DE-03 storytelling further'
  - Tighten the square canvas's top/bottom whitespace and the plot-to-legend gap slightly
    to raise canvas utilization (VQ-05)
  - Nudge the 'Sepal Width' loading label further from the neighboring setosa point
    cluster in the upper-right to remove the last bit of visual crowding
  - Consider a borderless (or lighter-weight) legend frame for a more refined look
    (DE-02)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "biplot-pca · julia · makie · anyplot.ai" bold black, axis labels "PC1 (73.0%)" / "PC2 (22.9%)", tick labels, loading-vector labels (Sepal Length, Sepal Width, Petal Length, Petal Width), and legend ("Species": setosa/versicolor/virginica) all rendered in dark ink — clearly readable against the light background.
      Data: 150 iris points colored by species — setosa = brand green #009E73 (first series, correct), versicolor = lavender #C475FD, virginica = blue #4467A3 (canonical Imprint order). Four black loading arrows radiate from the origin with a dashed unit-circle reference.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: All chrome elements (title, axis labels, tick labels, loading-vector labels, gridlines, legend box/text) correctly flip to light ink (white/off-white). No dark-on-dark failures observed. Loading arrows are chrome (theme-adaptive INK token), so they correctly render white in dark mode.
      Data: Species point colors (green/lavender/blue) are identical to the light render — confirms categorical palette held constant across themes.
      Legibility verdict: PASS
