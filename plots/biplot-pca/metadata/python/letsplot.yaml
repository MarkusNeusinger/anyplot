review:
  strengths:
  - Real PCA pipeline with StandardScaler and sklearn PCA; variance percentages carried
    into the axis titles
  - Theme tokens threaded through every chrome element; data colors identical in both
    renders
  - Interactive HTML export alongside the PNG gives native lets-plot hover on the
    score points
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700 → 3200x1800 (−1600 × −900). Likely cause: ggsize(1600,
    900) with scale=3 instead of ggsize(800, 450) with scale=4.'
  - 'SC-02 (both): the reference circle renders as a flat ellipse (about 1 unit tall
    but wider on screen) of radius 1, while the arrows are scaled by 1.5 × the largest
    score, so it neither is round nor relates to the loading magnitudes (C4) → a round
    circle whose radius equals the common loading scale. Likely cause: no coord_fixed
    / equal-aspect limits, and circle_df built with radius 1.'
  - 'SC-04 (both): title ''biplot-pca · letsplot · anyplot.ai'' lacks the language
    segment → ''biplot-pca · python · letsplot · anyplot.ai''. Likely cause: the title
    string in labs().'
  - 'VQ-02 (both): the ''Petal Width'' label is drawn over virginica points near PC1
    2.8, PC2 0.8 → clear of the points or on a page-colored backing. Likely cause:
    the hard-coded +0.4 offset for Petal Width in geom_text.'
  - 'DE-02 (both): all four panel spines form a closed frame where the plot type needs
    none → left and bottom only, or none. Likely cause: axis_line plus the panel frame
    of the theme; set panel_border=element_blank().'
  - 'Suggestion: a letsplot-specific feature such as a tailored tooltip layout on
    the score points would showcase the library.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 4800x2700 canvas.
      Chrome: title 'biplot-pca · letsplot · anyplot.ai' top-left in dark ink; axis titles 'PC1 (73.0%)' and 'PC2 (22.9%)'; ticks every 0.5 from -3.5 to 4 and -3.5 to 6.5 in soft ink; dark grid; dashed zero lines; four-sided panel frame; legend 'Species' on an elevated card at the right. All text readable.
      Data: 150 Iris scores, setosa #009E73, versicolor #C475FD, virginica #4467A3; four grey open arrows from the origin reaching far beyond the points (Sepal Width up to PC2 4.6, the others to PC1 about 2.8); large grey labels at the tips, 'Petal Width' over virginica points; a reference 'unit circle' drawn as a flat ellipse of radius 1, unrelated to the arrow scale; empty upper third of the panel.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full canvas.
      Chrome: title, axis titles, ticks and legend in light ink tokens; light grid; legend card #242420. No dark-on-dark text.
      Data: point colors identical to the light render; arrows, labels and ellipse flip to light grey.
      Legibility verdict: PASS
