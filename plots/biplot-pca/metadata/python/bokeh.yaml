review:
  strengths:
  - Loading arrows built from bokeh's Arrow + VeeHead annotation models with one common
    scale factor, labels at each tip in bold with a page-colored halo
  - Axis titles carry the explained variance of each component (73.0% / 22.9%)
  - Theme tokens threaded through every chrome element; both renders readable
  - Groups drawn from an eight-position Imprint list with a legend titled from the
    column constant
  - Standalone HTML output keeps bokeh's interactive pan/zoom in the detail view
  weaknesses:
  - 'VQ-02 (both): the ''Petal width (cm)'' label and its 0.75-alpha page-colored
    box cover about three virginica points near PC1 1.9-2.5, PC2 0.4 → keep the label
    clear of the score points or make its box fully transparent so no point is hidden.
    Likely cause: Label background_fill_alpha=0.75 at the arrow tip inside the virginica
    cluster.'
  - 'VQ-03 (both): the legend glyphs are small dots of about 6 px beside 24 px score
    markers → glyphs at about the marker size (+18 px). Likely cause: default p.legend.glyph_width/glyph_height
    and no label_height increase.'
  - 'Suggestion: a dotted unit circle would help read loading magnitudes, as the Notes
    suggest for correlation scaling.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'biplot-pca · python · bokeh · anyplot.ai' bold top-left; axis titles 'PC1 (73.0% of variance)' and 'PC2 (22.9% of variance)' in dark ink; dark-grey tick labels; subtle grid; dashed origin lines; legend 'Species' top-left on an elevated box. All readable.
      Data: 150 points in #009E73 (setosa), #C475FD (versicolor), #4467A3 (virginica); four dark-grey arrows from the origin labelled in bold at their tips (Sepal width up-left, Sepal length, Petal width, Petal length to the right). 'Petal width (cm)' label sits over a few virginica points. Legend glyphs are tiny dots.
