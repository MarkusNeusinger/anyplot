review:
  strengths:
  - Fixed 1:1 aspect via coord_fixed keeps the dashed unit circle round and centred
    on the origin
  - One common scale factor for all four loading arrows, sized alongside the score
    cloud
  - Arrow labels anchored left or right by side so each name sits at its own arrow
    tip, clear of the arrowheads
  - Theme tokens threaded through every chrome element; data colors identical in both
    renders
  - Axis labels carry the variance explained (73.0% / 22.9%)
  weaknesses:
  - 'VQ-01 (both): the four loading-arrow labels, the plot''s key annotation, are
    set at 5.5 pt and read small beside the 8 pt tick labels → 8 pt (+2.5 pt). Likely
    cause: text_size = 5.5 in geom_text (plotnine''s geom_text size is in points here).'
  - 'Suggestion: the symmetric ±limit leaves wide empty bands above and below the
    scores; limits per axis from the data range would give the clusters more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas
      Chrome: title 'biplot-pca · python · plotnine · anyplot.ai' dark ink at top; axis titles 'PC1 (73.0% of variance)' and 'PC2 (22.9% of variance)'; ticks -4..4 in INK_SOFT; subtle grid; panel border; legend 'Species' at the bottom in an elevated box. All readable.
      Data: 150 points — setosa #009E73 on the left, versicolor #C475FD and virginica #4467A3 on the right, alpha 0.7. Four near-black arrows from the origin (Sepal width up-left, Sepal length up-right, Petal width and Petal length nearly horizontal right) with bold labels at their tips; dashed grey unit circle, round, centred on the origin.
