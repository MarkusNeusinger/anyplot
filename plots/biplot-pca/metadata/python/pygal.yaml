review:
  strengths:
  - Every loading arrow is named at its tip through pygal's per-point value dicts
    with print_labels, so each name is attributable even for the near-parallel Alcohol
    and Proline arrows
  - One common scaling factor for all loadings keeps relative arrow lengths and directions
    faithful to the PCA
  - Theme tokens threaded through the pygal Style; both renders readable, data colors
    identical across themes
  - Real wine cultivar data with five interpretable variables shows correlated, opposed
    and orthogonal loadings and three separated groups
  - 'Adaptable structure: column constants and a single Data block ending in df; interactive
    HTML output with tooltips'
  weaknesses:
  - 'VQ-02 (both): the right barb of the Malic acid arrowhead runs into the ''M''
    of the ''Malic acid'' label at the tip → the label clear of the head by at least
    10 px. Likely cause: the print_labels label anchored on the tip point while the
    head barbs fan out from it; anchor the label on a point slightly beyond the tip
    along the arrow direction.'
  - 'VQ-05 (both): the Flavanoids arrow tip reaches about −3.0 on PC2, below the lowest
    −2 gridline, and its head and label sit in the x tick-label row beside the ''2''
    tick → keep every arrow tip inside the score range (about −10 % length). Likely
    cause: loading_scale = 0.85 × the largest absolute score of either axis, which
    exceeds the PC2 score range.'
  - 'Suggestion: drop the units from the arrow legend entries or the legend entries
    for arrows altogether, since each arrow is already named at its tip.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: title "biplot-pca · python · pygal · anyplot.ai" centered at top; x-axis "PC1 (42.9%)", y-axis "PC2 (32.8%)"; tick labels -2..4 and -2..3; dotted horizontal guides only, thin origin axes; two-row legend at bottom (Cultivar 1-3, then the five variables with units). All dark text, clearly readable.
      Data: 178 wine observations as dots — Cultivar 1 #009E73 (right), Cultivar 2 #C475FD (left-lower), Cultivar 3 #4467A3 (upper); five open-headed arrows from the origin: Alcohol (#BD8233), Malic acid (#AE3030, up-left), Flavanoids (#2ABCCD, down-right), Color intensity (#954477, up-right), Proline (#99B314, right), each named at its tip. Malic acid head barb touches its label; Flavanoids tip runs below the -2 gridline into the x tick-label row.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
