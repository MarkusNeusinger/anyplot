review:
  strengths:
  - One common scale for all loading arrows (C4)
  - Equal aspect keeps arrow directions true
  - Theme tokens applied; chrome flips cleanly with identical class colors
  weaknesses:
  - 'VQ-05 (both): canvas is 2584x2653, not a canonical size → 2400x2400 square (-184
    x -253 px). Likely cause: figsize=(16, 9) with bbox_inches=''tight'' on savefig.'
  - 'VQ-02 (both): the total_phenols label is hidden behind the proanthocyanins plate,
    and the flavanoids and alcalinity_of_ash labels are partly covered by neighbouring
    plates → no label plate over another. Likely cause: labels placed at 1.12x the
    tip with 12 pt bordered plates and no spacing for bunched arrows.'
  - 'SC-02 (both): the covered total_phenols label cannot be attributed to its arrow
    (C3) → each name readable at its own tip. Likely cause: the same label placement.'
  - 'SC-04 (both): title ''biplot-pca · seaborn · anyplot.ai'' lacks the language
    segment → ''biplot-pca · python · seaborn · anyplot.ai''. Likely cause: the set_title
    string.'
  - 'DQ-02 (both): the groups are labelled ''Class 0'', ''Class 1'', ''Class 2'' →
    name them as the three cultivars. Likely cause: the class_names list.'
  - 'CQ-01 (code): the file has no column-0 # Data marker → one block between column-0
    # Data and # Plot markers that ends by binding df. Likely cause: the data generation
    is not marked as one block.'
  - 'CQ-01 (code): no column constant for the required role `features` and `IMPRINT`
    lists 5 of 8 positions sliced with IMPRINT[:3] → one constant per column role
    with a # role: comment, all eight Imprint positions looked up per category. Likely
    cause: column names and palette sized to the sample.'
  - 'Suggestion: readable feature names instead of raw identifiers such as od280/od315_of_diluted_wines.'
