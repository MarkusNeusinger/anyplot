review:
  strengths:
  - Loadings drawn with ax.annotate and arrowprops from the origin, all scaled by
    one common factor so relative arrow lengths follow the loadings
  - Labels for the nearly parallel Petal width / Petal length arrows are split above
    and below their tips, so each name stays attributable to its own arrow
  - patheffects.withStroke halo in the page color keeps the variable names readable
    over grid and points in both themes
  - Axis labels carry the variance explained (73.0 % and 22.9 %), computed from PCA.explained_variance_ratio_
    on standardized data
  - set_aspect('equal', adjustable='datalim') keeps PC1 and PC2 on the same scale,
    so arrow directions are geometrically true
  - Real Iris data via sklearn with species groups in Imprint order and theme tokens
    threaded through every chrome element
  weaknesses:
  - 'VQ-02 (both): the ''Petal width (cm)'' label sits on top of a Virginica point
    at about PC1 1.9, PC2 0.3 (the point shows behind the ''P''), and the ''Petal
    length (cm)'' label runs along the PC2 = 0 reference line, which shows between
    its words → label text clear of data points and the reference line by a few points
    (about +4 pt of vertical offset). Likely cause: the label offset `xytext=direction
    * 6` gives near-horizontal arrows almost no vertical clearance.'
  - 'Suggestion: a correlation-circle style reference (unit circle scaled by the same
    factor) would give the arrow lengths a magnitude reference, as the Notes suggest.'
  - 'Suggestion: a slightly larger label font (9 pt) for the variable names would
    give the arrows more presence against 150 points.'
