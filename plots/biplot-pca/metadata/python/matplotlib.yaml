      Data: 150 score points — Setosa #009E73 on the left (PC1 ≈ -2.5), Versicolor #C475FD and Virginica #4467A3 overlapping on the right. Four dark-ink arrows from the origin: Sepal width up-left (long), Sepal length up-right, Petal width and Petal length nearly parallel along +PC1, each labeled at its tip (Petal width above, Petal length below). The label boxes of the petal labels cover a few Virginica points.
