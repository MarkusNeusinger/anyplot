review:
  strengths:
  - Loadings scaled by one common factor (ARROW_REACH of the largest score distance),
    so relative arrow lengths follow the loadings and the arrows span the score cloud
  - Equal aspect with adjustable='datalim' keeps arrow directions geometrically true
  - Angle-aware label placement splits the near-parallel Petal width / Petal length
    labels above and below their tips, so each name stays attributable
  - Explained variance in the axis labels comes straight from pca.explained_variance_ratio_
    (73.0 % / 22.9 %)
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'VQ-02 (both): the 85 %-opaque page-colored label boxes of ''Petal width (cm)''
    and ''Petal length (cm)'' sit on the Virginica cluster at PC1 ≈ 1.8–2.9 and hide
    several score points (around (1.9, 0.4), (2.3, 0.45), (2.9, 0.4) and (1.85, −0.15))
    → no label box may cover a data mark; drop the bbox and keep only the stroke halo,
    or a fully transparent box. Likely cause: the bbox={... ''alpha'': 0.85} on the
    arrow-label annotate, on top of the withStroke path effect.'
  - 'Suggestion: the unit circle the Notes suggest is optional; a correlation-scaled
    circle would give the arrow lengths a reference.'
