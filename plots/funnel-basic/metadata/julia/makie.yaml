review:
  strengths:
  - Continuous-taper trapezoid geometry (boundary averaging between adjacent stage
    widths) produces a smooth, professional funnel silhouette rather than disjointed
    stacked blocks
  - Correct Imprint palette in canonical order with brand green as the first series,
    and identical data colors between light and dark renders with only chrome flipped
  - Clear typographic hierarchy — bold stage names paired with muted value/percentage
    labels directly beside each segment, avoiding the need for a separate legend
  - Axes and spines fully hidden, an appropriate minimal-chrome choice for this chart
    type that keeps full visual focus on the funnel shape
  - Correct square canvas (2400×2400) and exact required title format
  weaknesses:
  - Secondary value/percentage labels (fontsize=16) become hard to read at the 400px
    mobile thumbnail scale — consider bumping their fontsize slightly or increasing
    weight/contrast so they hold up better when scaled down
  - The last two segments (Entered Payment → Completed Purchase) taper very little
    because the boundary-averaging formula flattens out once values are already small
    relative to the first stage, reading as a near-rectangular strip rather than a
    wedge — consider a minimum-width floor or a non-linear (e.g. sqrt) width scale
    to keep the taper visible through the tail of the funnel
  - Implementation relies only on generic Makie primitives (poly!, text!) with no
    distinctive library-specific feature beyond basic composition
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "funnel-basic · julia · makie · anyplot.ai" in bold dark ink, centered at top, fully visible with no clipping. Six stage labels (bold dark text) and their value/percentage lines (muted grey) sit to the right of the funnel, all clearly legible.
      Data: Six trapezoidal segments narrowing continuously from top to bottom, colored (in order) green #009E73, lavender, blue, ochre, red, cyan — matching the canonical Imprint categorical order, first series is the brand green. Thin background-colored strokes separate the segments.
      Legibility verdict: PASS (all title/stage/value text reads clearly against the light background; secondary value/percentage text is comparatively small and gets harder to read only at the smallest 400px thumbnail export).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title now in bold off-white/light ink, fully visible. Stage labels are bold light text, value/percentage lines are muted light-grey — no dark-on-dark issue anywhere.
      Data: Identical six segment colors and identical proportions as the light render — only the chrome (background, text ink, segment separator strokes) flipped to the dark-theme tokens.
      Legibility verdict: PASS (all text reads clearly against the dark background; same minor small-text-at-thumbnail-scale caveat as the light render, not a dark-mode-specific defect).
