review:
  strengths:
  - Clean, correctly ordered trapezoidal funnel with the Imprint palette in canonical
    order (brand green first)
  - Value and percentage labels next to every stage satisfy the spec's labeling requirement
    clearly and legibly
  - 'Theme-adaptive chrome is correctly threaded through: both renders share identical
    data colors and only chrome (background, text, stroke separators) flips'
  - Custom poly!-based funnel construction (with hidedecorations!/hidespines!) is
    idiomatic, minimal Makie code and demonstrates real library mastery beyond default
    chart primitives
  - Correct canvas size (2400x2400), correct save pattern, clean imports, no fake
    interactivity
  weaknesses:
  - Segment width uses sqrt(value/value[1]) instead of a direct linear ratio, but
    the spec explicitly requires 'the width of each segment should be proportional
    to its value relative to the first stage'. This visually exaggerates lower-stage
    widths — e.g. the final stage (4,750 / 48,000 = 9.9% of the first stage) renders
    at ~32% of the max half-width — softening how dramatic the real drop-off looks.
    Switch to a linear ratio (values ./ values[1]) for the half-widths, or apply a
    much gentler compression than sqrt if some tail-visibility easing is still wanted.
  - Large unused whitespace band across the bottom ~25-30% of the square canvas in
    both renders — the funnel and its labels occupy roughly the top two-thirds of
    the frame, leaving the canvas underused. Enlarge max_half_width / stage heights
    or vertically re-center the layout so the funnel fills the square canvas more
    fully.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "funnel-basic · julia · makie · anyplot.ai" bold and dark, clearly readable at top center. Six stage labels (bold dark headings: "Site Visitors", "Product Page Views", "Added to Cart", "Started Checkout", "Entered Payment", "Completed Purchase") sit to the right of each funnel segment, each followed by a softer gray "value · percentage" line (e.g. "48,000 · 100%", "4,750 · 10%"). No axes/gridlines — appropriately hidden for a funnel chart.
      Data: Six trapezoidal segments narrowing top to bottom, separated by thin off-white stroke lines. Colors follow the Imprint palette in canonical order: green (#009E73, first/largest stage), lavender, blue, ochre, matte red, cyan — all distinct and easy to tell apart.
      Legibility verdict: PASS — all title, stage-name, and value/percentage text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title and stage-label layout, now in light/white text against the dark background. Stroke separators between segments are now dark (matching PAGE_BG), giving thin near-black dividing lines instead of off-white ones — correct theme-adaptive behavior.
      Data: Same six-color sequence and same segment shapes as the light render — data colors are identical between the two themes; only chrome (background, text, separator strokes) has flipped.
      Legibility verdict: PASS — title and all stage/value text render in light ink against the dark background with clear contrast; no dark-on-dark failures observed.

    Both renders otherwise match apart from chrome color reversal, confirming correct theme-adaptive implementation. One shared, non-theme issue in both: the funnel + labels occupy roughly the top two-thirds of the square canvas, leaving a noticeable empty band at the bottom in both images.
