review:
  strengths:
  - 'Width encoding follows the spec exactly: each segment''s top edge is its value
    relative to the first stage (1,000 → 600 → 400 → 200 → 100 render at 100/60/40/20/10
    % of the widest edge), all centered on one vertical axis'
  - 'Clear two-level label hierarchy: bold INK stage names on the left, INK_SOFT value-plus-share
    labels (''1,000  (100%)'') on the right, each placed a constant gap off the slanted
    segment edge at mid-height, readable in both themes'
  - Page-colored 8 px seams with round joins separate the stages in both themes, and
    the outline is set to the page color so no frame line shows; axes and grid are
    deliberately dropped for this non-Cartesian chart
  - 'Idiomatic bokeh: one vectorized p.patches call and two p.text glyphs all driven
    by column names from a single ColumnDataSource'
  - HoverTool on the patches renderer gives stage, formatted visitor count and share
    of the first stage in the interactive HTML
  weaknesses:
  - 'Suggestion: the measured quantity (''Visitors'') only appears in the hover tooltip;
    a descriptive title prefix such as ''Website Visitor Funnel · '' would tell the
    static reader what the counts are.'
  - 'Suggestion: the left stage names and right value labels stand at slightly different
    distances from the funnel''s outer silhouette on the upper stages; aligning both
    columns on fixed x positions would give the labels a cleaner vertical rhythm.'
  image_description: |-
