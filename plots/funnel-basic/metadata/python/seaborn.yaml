review:
  strengths:
  - 'sns.barplot with hue=STAGE, palette and legend=False colors each stage from the
    Imprint palette in canonical order, starting at #009E73'
  - Bars are re-centered on x=0 and joined by trapezoid connectors into a symmetric
    funnel whose widths stay proportional to the first stage
  - Value and percentage labels sit beside each stage in the INK token and read cleanly
    in both themes, even beside the narrow Purchase stage
  - Title, canvas (3200x1800) and theme chrome follow the contract in both renders;
    data colors are identical across themes
  weaknesses:
  - 'VQ-07 (both): every rectangular stage core renders desaturated (Awareness core
    about #148A6A instead of #009E73), so each stage shows a muted rectangle over
    a full-strength connector → draw the cores in the exact Imprint hexes. Likely
    cause: sns.barplot''s default saturation=0.75; pass saturation=1.'
  - 'VQ-05 (both): the stage names sit at the far left edge, about 650–1300 px from
    their segments (Purchase farthest), leaving an empty band between labels and funnel
    and pushing the funnel right of the canvas center → bring the names next to the
    funnel, about a third less left margin. Likely cause: ax.set_xlim(-max_value *
    0.95, ...) with the names drawn as y tick labels at the axes edge.'
  - 'Suggestion: placing the value labels inside the wider segments would tie each
    number more tightly to its stage.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the whole 3200x1800 canvas, not pure white.
      Chrome: Title 'funnel-basic · python · seaborn · anyplot.ai' in dark ink, centered over the funnel. Stage names Awareness, Interest, Consideration, Intent, Purchase as right-aligned dark labels at the far left. No axes, spines or grid. All text readable.
      Data: Five stacked stages centered on one vertical axis, widths 100/60/40/20/10% of the first: green #009E73, lavender #C475FD, blue #4467A3, ochre #BD8233, red #AE3030 in canonical Imprint order. Each stage is a rectangle (visibly muted by seaborn's default saturation) over a full-strength trapezoid connector tapering to the next stage; a short tail closes the funnel below Purchase. Value · percentage labels ('1,000 · 100%' ... '100 · 10%') in dark ink right of each stage.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title, stage names and value labels in light ink #F0EFE8; no dark-on-dark text anywhere.
      Data: Segment colors identical to the light render (same muted cores, same full-strength connectors); only chrome flips.
      Legibility verdict: PASS
