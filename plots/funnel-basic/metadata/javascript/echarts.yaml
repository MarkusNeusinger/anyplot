review:
  strengths:
  - 'Fixed the attempt-1 contrast defect: label colors are now hard-coded per segment
    based on that segment''s own luminance (dark ink on green/lavender/ochre, white
    on blue/matte-red) rather than tied to the page-background token, so contrast
    stays ~5:1-6.4:1 on every segment in BOTH themes instead of collapsing on dark
    mode'
  - Tooltip re-enabled with a themed formatter (value + percent-of-first-stage), restoring
    interactivity value in the generated HTML that attempt 1 had disabled outright
  - Inline labels now show percent-of-first-stage per segment (100%, 60%, 26%, 10%,
    6%), adding a real storytelling signal beyond raw counts
  - Correct Imprint canonical palette order across all 5 stages, identical data colors
    between light and dark renders; funnel widths are genuinely value-proportional
    (min:0, max:counts[0]), not evenly spaced
  - 'Clean KISS structure, deterministic hard-coded data, correct mount-node contract
    (no explicit width/height/devicePixelRatio, animation: false)'
  weaknesses:
  - Still no delta-from-previous-stage indicator (e.g. '-40% from Screened') -- the
    percent-of-first-stage label is a good addition but doesn't show stage-to-stage
    drop-off, which is the sharper funnel storytelling device
  - Design remains close to a straightforward idiomatic funnel with no extra polish
    (no gradient/shadow refinement, no subtitle) -- functional but leaves Design Excellence
    on the table
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "funnel-basic · javascript · echarts · anyplot.ai" is centered, dark ink text, clearly legible. No axes, no legend (appropriate for a single-dimension funnel with inline labels). No grid.
      Data: Five trapezoidal funnel segments narrowing top to bottom: Applications (2,400, 100%, brand green #009E73), Screened (1,450, 60%, lavender #C475FD), Interviewed (620, 26%, blue #4467A3), Offer Extended (240, 10%, ochre #BD8233), Hired (150, 6%, matte red #AE3030) -- exact Imprint canonical order. Each segment carries a centered two-line label (stage name + value + percent-of-first-stage) in a per-segment fixed color: dark ink on green/lavender/ochre, white on blue/matte-red. Segment widths are visibly proportional to value relative to the first stage, with a thin light-colored border separating segments.
      Legibility verdict: PASS -- all labels read with strong contrast (~5:1-6.4:1 estimated) against every segment color.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title renders in light ink text, clearly legible against the dark background. Same layout as light render, no axes/legend/grid.
      Data: Same five segments in the identical Imprint colors as the light render (green, lavender, blue, ochre, matte red) -- confirms data colors are theme-invariant. Label colors are now ALSO identical to the light render per segment (dark ink on green/lavender/ochre, white on blue/matte-red), because label color is tied to each segment's own fixed luminance rather than the page-background token. This resolves the attempt-1 dark-on-dark failure on the matte-red "Hired" and blue "Interviewed" segments -- both now show white text at strong contrast in this theme, same as before.
      Legibility verdict: PASS -- no dark-on-dark or light-on-light failures observed; contrast is consistent with the light render since it no longer depends on the page background.
