review:
  strengths:
  - Correct Imprint canonical palette order across all 5 stages (green, lavender,
    blue, ochre, matte red), identical between light and dark renders
  - 'Funnel widths are genuinely proportional to value (min: 0, max: counts[0]) rather
    than an evenly-spaced fake funnel, matching the spec''s ''width proportional to
    value relative to first stage'' requirement'
  - Inline value labels with toLocaleString() thousands separators, theme-adaptive
    plot background, and title format all match the style guide exactly
  - Realistic, neutral recruiting-funnel data (Applications 2,400 -> Hired 150) with
    a sensible descending scale
  - 'Clean KISS structure: no functions/classes, deterministic hard-coded data, correct
    mount-node contract (no explicit width/height/devicePixelRatio on echarts.init,
    animation: false set)'
  weaknesses:
  - Label color is hard-coded to t.pageBg, which flips the SAME segment colors between
    near-white text (light theme) and near-black text (dark theme). Since the Imprint
    data colors don't change between themes, this makes dark-mode labels low-contrast
    on the matte-red 'Hired' segment (#AE3030, ~2.7:1 contrast, below WCAG's 3:1 large-text
    floor) and marginal on the blue 'Interviewed' segment (#4467A3, ~3.1:1) -- fix
    by using a fixed high-contrast label color (e.g. white, or t.pageBg only on the
    lighter segments) rather than tying label color to the page background token.
  - 'tooltip is fully disabled (show: false) with no fallback -- this drops all interactivity
    value from the generated plot-{theme}.html with no benefit to the static PNG (labels
    already show the values); enable a themed tooltip formatter instead of disabling
    it outright.'
  - No conversion-rate or delta-from-previous-stage indicator, which is the standard
    funnel storytelling device (e.g. '-40% from Applications') -- would meaningfully
    raise Data Storytelling without cluttering the static render.
  - Design is functional but fairly close to library defaults (no gradient/shadow
    refinement, no subtitle) -- acceptable but leaves Design Excellence on the table
    for a mid-attempt score.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "funnel-basic · javascript · echarts · anyplot.ai" is centered, dark ink text, clearly legible. No axes, no legend (appropriate for a single-dimension funnel with inline labels). No grid.
      Data: Five trapezoidal funnel segments narrowing top to bottom: Applications (2,400, brand green #009E73), Screened (1,450, lavender #C475FD), Interviewed (620, blue #4467A3), Offer Extended (240, ochre #BD8233), Hired (150, matte red #AE3030) -- exact Imprint canonical order. Each segment carries a centered two-line label (stage name + comma-formatted value) in near-white text. Segment widths are visibly proportional to value relative to the first stage, with a thin light-colored border separating segments.
      Legibility verdict: PASS -- all labels read with strong contrast against every segment color in this theme.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title renders in light ink text, clearly legible against the dark background. Same layout as light render, no axes/legend/grid.
      Data: Same five segments in the identical Imprint colors as the light render (green, lavender, blue, ochre, matte red) -- confirms data colors are theme-invariant. However, the label color is now near-black (tied to t.pageBg for this theme) instead of white, and it is rendered on the SAME saturated segment colors as the light render. On the green, lavender, and ochre segments this still reads fine (moderate-to-good contrast), but on the matte-red "Hired" segment and, to a lesser extent, the blue "Interviewed" segment, the near-black text sits on a similarly dark-toned background, producing a noticeably lower-contrast, borderline "dark-on-dark" effect for those two labels specifically (measured contrast ~2.7:1 on red and ~3.1:1 on blue, both under or at the WCAG large-text 3:1 floor).
      Legibility verdict: FAIL (partial) -- text remains technically decipherable but has materially reduced contrast on 2 of 5 segments (Hired, Interviewed) in this theme; this is the theme-adaptation issue flagged as the primary weakness.
