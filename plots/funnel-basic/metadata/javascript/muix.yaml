review:
  strengths:
  - 'Composes the funnel inside ChartsContainer from community MUI X building blocks:
    the useXScale, useYScale and useDrawingArea hooks give each stage''s polygon a
    width on a linear 0–max scale, so each segment''s width is proportional to its
    value against the first stage (30,000 spans 974 of the 1,625 px top width, 0.60).
    This avoids the Pro-only FunnelChart.'
  - A band y axis (ChartsYAxis, categoryGapRatio 0.3, line and ticks disabled) places
    the stage names in process order and spaces the five segments evenly.
  - 'Each segment has a two-level label: the value in bold 18 px and ''% of initial
    stage'' in 14 px below it. Label ink switches by fill luminance (dark on lavender
    and ochre, cream on green, blue and red), so every label is readable in both themes.'
  - 'The theme is wired correctly: the title and subtitle use t.ink and t.inkSoft,
    the ticks use t.inkSoft, a page-colored hairline stroke separates the segments,
    and the data colors are identical in both renders.'
  - The scenario is a plausible e-commerce checkout funnel (Product Views 50,000 →
    Order Completed 5,500) with drops of different sizes, and the code follows the
    six-zone layout of role constants, a data block and a plot block.
  weaknesses:
  - 'VQ-07 (both): the success stage ''Order Completed'' is filled with #AE3030, the
    matte-red anchor the Imprint palette reserves for bad, loss or error roles. It
    is reached only because it is the fifth ordinal slot, so the best outcome of the
    funnel reads as a failure → give the fifth stage the next non-anchor Imprint hue,
    #2ABCCD (cyan). Likely cause: `const color = t.palette[i]` takes the slots in
    order without skipping the semantic anchor at index 4.'
  - 'Suggestion: the stage names sit in a fixed column at the left edge, about 740
    px from the narrow bottom segments. Labels closer to their segments, or inside
    them, would shorten the path the eye travels on the lower stages.'
  - 'Suggestion: the funnel is centered in the drawing area right of the 210 px label
    column, so it sits about 100 px right of the centered title. Balancing the right
    margin against the label column would align the two.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; no pure white.
      Chrome: centered bold title "funnel-basic · javascript · muix · anyplot.ai" in dark ink. Below it, a softer-ink subtitle "5 Stages · Shoppers from 50,000 to 5,500 (11.0% end-to-end conversion)". Stage names (Product Views, Added to Cart, Checkout Started, Payment Submitted, Order Completed) are right-aligned in a left column in soft dark ink. No numeric axis, no grid. All text is readable.
      Data: five centered trapezoids stacked top to bottom, each tapering from its own value's width to the next stage's width. The last stage is a rectangle. Fills: #009E73 green (first), #C475FD lavender, #4467A3 blue, #BD8233 ochre, #AE3030 red. Each segment has a bold value (50,000 / 30,000 / 16,000 / 9,000 / 5,500) and "N% of initial stage" (100/60/32/18/11) in cream or dark ink matched to its fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17; no pure black.
      Chrome: the title is cream-white and the subtitle and stage names are light gray-beige, all clearly readable. There is no dark-on-dark text.
      Data: segment geometry, fills and in-segment label colors are identical to the light render; only the page and chrome flip. Brand green reads well.
      Legibility verdict: PASS
