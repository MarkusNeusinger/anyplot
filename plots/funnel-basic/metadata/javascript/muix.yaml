review:
  strengths:
  - 'Builds the funnel the community way: a ChartsContainer with a linear x scale
    and a band y scale, and a custom FunnelPlot child that draws trapezoids from useXScale,
    useYScale and useDrawingArea. Funnel is Pro-only in MUI X, and this stays on the
    MIT surface.'
  - Each segment's top edge is exactly value/first × drawing width, centred on one
    vertical axis, so widths are true to the data (50,000 → 5,500, 100 % → 11 %).
  - Label ink is chosen per fill by luminance (light on green and blue; dark on lavender,
    ochre and cyan), so every value and percentage label stays readable against its
    own segment in both themes.
  - A two-level label hierarchy (bold 18 px value over a 14 px share line) plus a
    computed end-to-end conversion subtitle gives a clear reading order.
  - 'Stage colours follow Imprint order and skip the semantic red anchor #AE3030,
    as the style guide allows; the data colours are identical in light and dark, and
    only the chrome flips.'
  - skipAnimation is set, and the y-axis band is sized explicitly (width 210), so
    the stage names are not truncated.
  weaknesses:
  - 'Suggestion: the stage names sit in a fixed left column about 740 px from the
    narrow bottom segments; right-aligning each name just left of its own segment
    edge would tie name and segment more closely.'
  - 'Suggestion: the funnel is centred on the drawing area, not the canvas, so it
    sits about 100 px right of the centred title; balancing the left axis band with
    an equal right margin would align the two.'
  - 'Suggestion: the subtitle''s ''5 Stages'' is built from the column name plus ''s'';
    a constant for the plural noun would read better with other column names.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "funnel-basic · javascript · muix · anyplot.ai" centred at the top, a soft-ink subtitle "5 Stages · Shoppers from 50,000 to 5,500 (11.0% end-to-end conversion)", and stage names in soft dark ink in a left column (Product Views, Added to Cart, Checkout Started, Payment Submitted, Order Completed). No axes and no grid. All text is readable.
      Data: five centred trapezoids narrowing top to bottom: #009E73 green (50,000 / 100%), #C475FD lavender (30,000 / 60%), #4467A3 blue (16,000 / 32%), #BD8233 ochre (9,000 / 18%), #2ABCCD cyan (5,500 / 11%, a rectangle). Each carries a bold value and an "x% of initial stage" line in contrast-chosen ink. The first series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and stage names in light soft ink, all clearly readable. No dark-on-dark text.
      Data: the same five fills and the same in-segment label colours as the light render; only the page and chrome flipped. Brand green is clearly visible.
      Legibility verdict: PASS
