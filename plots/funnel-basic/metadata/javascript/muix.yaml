review:
  strengths:
  - 'Palette-perfect: canonical Imprint order across all 5 stages, correct in both
    themes'
  - Luminance-based adaptive text color per segment guarantees legibility regardless
    of fill brightness
  - Well-justified low-level composition (ChartContainer + useXScale/useYScale/useDrawingArea)
    to build a funnel chart that @mui/x-charts@7.29.1's community package doesn't
    natively support
  - Realistic, fully-featured e-commerce funnel data with sensible proportions
  weaknesses:
  - Wide gaps between segments (categoryGapRatio 0.35) read slightly more like separated
    bars than a continuous funnel silhouette
  - Only "% of total" is shown per stage; adding stage-to-stage conversion rate would
    sharpen the storytelling
  - Drop-off ratios between consecutive stages are fairly uniform (~55-60%); more
    variation would better showcase feature coverage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "funnel-basic · javascript · muix · anyplot.ai" in dark ink, centered, fully legible. Stage names (Product Views, Added to Cart, Checkout Started, Payment Submitted, Order Completed) in soft ink to the left of each band, all readable.
      Data: 5 trapezoids narrowing top-to-bottom. First series is #009E73 (brand green), followed by #C475FD, #4467A3, #BD8233, #AE3030 — exact canonical Imprint order. In-segment value/percentage labels use luminance-based adaptive white/near-black text, all legible.
