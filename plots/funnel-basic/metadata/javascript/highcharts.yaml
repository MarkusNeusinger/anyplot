review:
  strengths:
  - Hand-drawn trapezoid funnel via chart.renderer.path/text/g, correctly following
    the library's sanctioned workaround since the core bundle ships no funnel module
    — never reaches for a forbidden add-on module or another library.
  - 'Thoughtful semantic color choice: explicitly skips the matte-red anchor (palette
    position 5) for the final ''Completed Purchase'' stage since it''s a success not
    a failure, documented with a clear code comment referencing the style guide''s
    semantic-exception rule.'
  - Computed per-segment label text color via relative luminance (labelColorFor) so
    in-band value labels stay legible against both light and dark segment fills.
  - Narrative subtitle framing the overall conversion (48,000 visitors -> 3,850 purchases,
    8.0% overall), plus per-segment count+percentage labels reinforcing the funnel's
    drop-off story.
  - Title font size scales dynamically with title length via a documented linear formula,
    keeping the long mandated title readable at ~57% canvas width without overflow.
  - All font sizes explicitly set; theme tokens (ink, inkSoft, pageBg) correctly threaded
    through every chrome element; data colors identical between light and dark renders.
  weaknesses:
  - 'Layout imbalance: the funnel+label composition reads visually left-shifted. Measured
    content bounding box (excluding title/subtitle) spans only x=288-1565 of the 2400px
    canvas (~53% width, centered at x=926 vs. the canvas center at x=1200), leaving
    roughly 35% of canvas width empty on the right. The block''s geometry (blockLeft/BLOCK_W)
    is computed to be centered in the plot area, but the label column''s text is left-aligned
    at a fixed labelX and its actual rendered width doesn''t extend anywhere near
    the block''s nominal right edge the way the value-proportional funnel fills its
    left column — so the visible content doesn''t reach the intended balanced margins.
    Fix: measure the actual max rendered width of the stage-name/value/percentage
    label strings (or use renderer.text(...).getBBox().width) before computing centerX/labelX,
    so the whole composition is centered using real text extents rather than the abstract
    BLOCK_W split, or rebalance the funnelZoneW vs label-gutter split so labels fill
    more of their allotted column.'
  - Two helper functions (addTooltip, labelColorFor) deviate slightly from the strict
    flat imports->data->plot KISS structure, though the deviation is reasonably justified
    by the hand-drawn nature of this chart.
  - 'Library Mastery: the SVG path/text drawing technique, while correctly applied,
    isn''t unique to Highcharts — any SVG-capable library (e.g. D3) could replicate
    it directly. No Highcharts-distinctive feature (e.g. native dataLabels/connector
    styling, exporting hooks) is showcased.'
  - 'Data storytelling stops just short of calling out the single steepest drop-off
    (Product Views -> Added to Cart: 55.0% -> 23.3%, the largest percentage-point
    loss in the funnel) — a small emphasis technique here (e.g. a callout on the biggest
    gap) would sharpen the at-a-glance insight.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target closely (measured top-left pixel ~(250,248,241)).
      Chrome: Title "Checkout Conversion · funnel-basic · javascript · highcharts · anyplot.ai" in bold dark ink, comfortable margin above it (no clipping); subtitle in medium-gray ink-soft directly below. Five stage labels (bold dark name + lighter gray "count · pct" line) sit in a right-hand gutter, each connected to its segment by a thin ink-soft leader line. All chrome text is clearly readable against the light background.
      Data: Five trapezoidal funnel segments stacked top-to-bottom, narrowing per value: brand green (Site Visitors, 48,000), lavender-purple (Product Views, 26,400), blue (Added to Cart, 11,200), ochre (Started Checkout, 6,100), cyan (Completed Purchase, 3,850) — matte red (palette position 5) intentionally skipped for the successful final stage. First series is #009E73 as required. The two widest segments (green, purple) carry an additional in-band value label (white-on-green, near-black-on-purple) chosen via computed luminance contrast.
      Legibility verdict: PASS — all text readable, no dark-on-light or overlap issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target (measured top-left pixel ~(26,26,23)).
      Chrome: Same title/subtitle/stage-label layout, now in light ink (#F0EFE8-family) and light-gray secondary text against the dark background — fully legible, no dark-on-dark failures observed anywhere (title, subtitle, stage names, value/percentage lines, leader lines all clearly visible).
      Data: Identical segment colors and identical proportions to the light render (green/lavender/blue/ochre/cyan) — confirmed pixel-identical hues, only the chrome (background, text, leader-line color) flipped as required. In-band value labels still contrast correctly against their segment fills.
      Legibility verdict: PASS — all text readable, brand green still reads clearly on the dark surface.

    Layout note (both renders): a pixel bounding-box check of the funnel+label block found it spans only ~53% of canvas width, off-center to the left (centered around x=926 of 2400 rather than x=1200), leaving a large uninterrupted whitespace band on the right side of the canvas below the title. This is a real, if moderate, layout balance issue — see weaknesses.
