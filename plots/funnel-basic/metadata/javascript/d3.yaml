review:
  strengths:
  - 'Correct funnel geometry: trapezoids taper top-to-bottom in proportion to the
    linear value scale, and the terminal stage renders as a straight bar (topW ==
    bottomW) since there''s no next stage to taper into.'
  - 'Pixel-verified Imprint palette compliance: light background sampled at exactly
    #FAF8F1, dark background sampled at exactly #1A1A17, and the first series is the
    mandated brand green #009E73 with the remaining five stages following canonical
    palette order.'
  - 'All derived numbers check out: drop-off percentages (60%, 56%, 55%, 45%, 35%)
    and percent-of-first labels (100/40/18/8/4/3%) are all correctly computed from
    the raw stage values.'
  - Clean, minimalist composition — no axes/grid needed for a funnel, leader lines
    connect each segment to its label block cleanly with generous whitespace, and
    per-stage drop-off callouts between bands add genuine storytelling value beyond
    the spec's minimum ask.
  - Canvas is exactly 3200×1800 in both renders with no clipped or cut-off text at
    any edge.
  weaknesses:
  - 'Library mastery is a bit generic for D3: number formatting uses vanilla .toLocaleString()
    instead of d3-format, and the trapezoid path is built with a manual template-string
    instead of a d3-shape generator (e.g. d3.line/d3.area) — both are valid but don''t
    showcase D3-specific idioms.'
  - The linear width scale makes the two smallest stages (Offer Extended, Hired) collapse
    into very thin slivers given the steep real-world drop-off — still legible and
    colored correctly, but a sqrt-based width scale or a small minimum-width floor
    would keep the tail segments more readable without misrepresenting the proportions.
  - Design excellence is solid but fairly plain — no subtle secondary accents (e.g.
    an overall-conversion annotation, alternating label-row shading) that would push
    the storytelling further given how much whitespace is available in the label column.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, pixel-sampled at (250, 248, 241) = #FAF8F1 exactly — matches the mandated light surface, not pure white.
      Chrome: dark title "funnel-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable; six dark stage-name labels ("Applications" ... "Hired") and lighter secondary value/percent lines ("1,200 · 100%" etc.) on the right, all rendered in dark ink against the cream background — fully legible. Thin gray leader lines connect each trapezoid to its label without crossing or overlapping other elements. Small "↓ NN%" drop-off callouts sit centered between consecutive bands in a muted gray, also legible.
      Data: Six trapezoidal bands narrowing top-to-bottom (Applications → Resume Screened → Phone Interview → Onsite Interview → Offer Extended → Hired), colored green, lavender, blue, ochre, red, cyan in that order — first series is the mandated brand green #009E73, and the sequence follows the canonical Imprint palette order positions 1-6. The final "Hired" band renders as a narrow rectangle rather than a taper, which is correct since it has no following stage to shrink into.
      Legibility verdict: PASS — no light-on-light text anywhere, all title/labels/values clearly readable.

    Dark render (plot-dark.png):
      Background: warm near-black, pixel-sampled at (26, 26, 23) = #1A1A17 exactly — matches the mandated dark surface, not pure black.
      Chrome: title and stage-name labels render in light/white ink against the dark background, secondary value/percent lines in a softer light gray — all clearly readable, no dark-on-dark failures. Leader lines and drop-off callouts switch to a lighter gray tone appropriate for the dark surface.
      Data: Same six trapezoidal bands in identical colors as the light render (green, lavender, blue, ochre, red, cyan) — confirmed the data-color hexes are unchanged between themes; only the chrome (background, text, leader-line color) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark text, all chrome elements read clearly against the near-black surface.
