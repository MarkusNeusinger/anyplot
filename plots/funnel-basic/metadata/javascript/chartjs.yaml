review:
  strengths:
  - Custom Chart.js plugin (afterDatasetsDraw) renders true tapering trapezoids by
    sharing the top/bottom edge between consecutive segments, correctly using scales.x.getPixelForValue()
    and bar.getProps() — a technically sound way to build a funnel with a library
    that has no native funnel type, fully within the plugin API (no community plugin,
    no shelling out to another library).
  - First categorical color is Imprint brand green (#009E73), subsequent stages follow
    the canonical palette order; data colors are pixel-identical between light and
    dark renders, only chrome flips.
  - Value + percentage labels (bold white text with a subtle drop shadow) stay legible
    over every fill color in both themes, including the lighter lavender and ochre
    segments.
  - 'Deterministic in-memory data, animation: false, single canvas appended to #container
    — respects the JS mount-node contract exactly.'
  - 'Restrained layout: hidden x-axis, no legend (redundant since each stage already
    carries its own label), thin divider strokes between segments for separation without
    clutter.'
  weaknesses:
  - Title text occupies only ~27% of canvas width, leaving the top of the canvas visually
    light — a modest fontsize increase would strengthen the hierarchy without risking
    overflow.
  - Only cumulative percent-of-first-stage is labeled; an optional stage-to-stage
    drop-off number would add analytical value, though the spec only requires a value
    or percentage label, which is already met.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "funnel-basic · javascript · chartjs · anyplot.ai" in dark ink, centered top, clearly legible. Five stage labels ("Website Visitors", "Product Page Views", "Added to Cart", "Checkout Started", "Purchase Completed") in soft dark grey down the left margin, all readable. No axis lines, no grid, no legend — appropriate for a funnel.
      Data: Five tapering trapezoidal segments stacked top-to-bottom, widest at top narrowing to a flat rectangle at the bottom. Colors in canonical Imprint order: brand green (#009E73, 12,000/100%), lavender (6,400/53%), blue (3,100/26%), ochre (1,450/12%), matte red (820/7%). Each segment carries a bold white value+percentage label with a subtle drop shadow, readable against every fill color. Thin light divider lines separate segments.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and stage labels switch to light grey/off-white tones, fully legible against the dark surface. No dark-on-dark text anywhere.
      Data: Identical five-color sequence and identical segment proportions/values as the light render (green/lavender/blue/ochre/red at the same percentages) — confirms only chrome flipped, not data colors. White bold value labels remain legible over every segment color; thin dark divider lines (drawn in the page-background color) separate segments without disappearing into them.
      Legibility verdict: PASS
