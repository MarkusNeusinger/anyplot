review:
  strengths:
  - Correct Imprint palette in canonical order, byte-identical data colors across
    light/dark, theme-correct chrome in both renders
  - Idiomatic "floating bar" technique to build a funnel shape from Chart.js's core
    bar type without reaching for an unavailable plugin
  - Custom afterDatasetsDraw plugin renders value+percentage labels with a shadow,
    keeping them legible over every stage color in both themes
  - Realistic e-commerce checkout funnel with varied (non-uniform) stage-to-stage
    drop-off rates
  weaknesses:
  - The funnel reads as 5 separated rectangular blocks rather than one continuous
    tapering shape - reduce or remove categoryPercentage/barPercentage gaps (or draw
    connecting diagonal fills between adjacent segment edges in the segmentLabels
    plugin) so the silhouette actually tapers like a funnel
  - The inter-segment gaps waste a meaningful share of the vertical canvas - tightening
    them would also improve canvas utilization (VQ-05)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "funnel-basic · javascript · chartjs · anyplot.ai" in dark ink text at top, clearly readable. Category labels (Website Visitors, Product Page Views, Added to Cart, Checkout Started, Purchase Completed) in dark-gray text to the left of each bar, clearly readable.
      Data: Five horizontal floating bars of decreasing width. First series is #009E73 (brand green), followed by lavender #C475FD, blue #4467A3, ochre #BD8233, matte red #AE3030 - matches Imprint canonical order. Each bar has a centered white bold value+percentage label with a subtle shadow for contrast.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title and category labels flip to light-gray/off-white text, clearly readable against the dark background. No dark-on-dark failures.
      Data: Colors identical to light render (green/lavender/blue/ochre/red bars unchanged). Value labels remain white-on-color and stay legible in both themes.
      Legibility verdict: PASS
