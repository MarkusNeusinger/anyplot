review:
  strengths:
  - 'Correct funnel construction: each trapezoid''s top/bottom half-width is derived
    directly from value/value[1], so segment width is genuinely proportional to stage
    value relative to the first stage, exactly as the spec requires.'
  - Both value and percentage-of-first-stage are shown per stage ('4,200 (100%)' ...
    '340 (8%)'), and stages are ordered largest-to-smallest top-to-bottom per the
    spec's Notes.
  - Imprint palette used correctly in canonical order (green, lavender, blue, ochre,
    red) with the brand green first; identical data colors between light and dark
    renders, only chrome (title/label ink, background) flips correctly with no dark-on-dark
    or light-on-light failures.
  - theme_void() strips all axis/grid chrome appropriately for a funnel diagram; the
    mandated title string is exact and correctly sized/centered without overflow or
    clipping in either render.
  - 'Clean, minimal R: no unnecessary functions/classes beyond one small lapply to
    build the polygon segments, set.seed(42) present, only used imports (ggplot2/dplyr/tibble/ragg),
    correct ragg::agg_png save with plot-{theme}.png naming.'
  weaknesses:
  - 'Significant unused whitespace on the right ~35-40% of the canvas: the funnel
    + label block only extends to roughly 60% of the plot width in both renders, leaving
    a large empty region that unbalances the landscape composition. Consider widening
    the funnel, increasing left/right margins symmetrically, centering the composition,
    or switching to the square 2400x2400 canvas to reduce dead space.'
  - 'The design is competent but fairly plain: a single value/percentage label pair
    per segment with no additional storytelling cue (e.g. a subtle drop-off/conversion
    delta between consecutive stages, or a connecting guide line from funnel edge
    to label) — would raise Design Excellence and Data Storytelling above the current
    baseline.'
  - geom_polygon is the only viable ggplot2 path for a funnel (no native funnel geom
    exists), so Library Mastery credit is capped — LM-02 stays modest since the manual-polygon
    technique is the expected workaround rather than a distinctive value-add beyond
    it.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "funnel-basic · r · ggplot2 · anyplot.ai" centered near top in dark ink, clearly legible. Five stage labels (bold name + "value (percent%)" in softer ink) sit to the right of the funnel, all fully readable against the light background with good contrast. No axes/grid (theme_void), appropriate for this chart type.
      Data: Five trapezoidal segments narrowing top-to-bottom, colored in Imprint canonical order: brand green (#009E73, Applications), lavender (Screened), blue (Interviewed), ochre (Offer Extended), matte red (Hired). Segment width tracks each stage's value relative to the first stage. Thin background-colored dividers separate segments cleanly.
      Legibility verdict: PASS — all text (title, bold stage names, value/percent lines) is clearly readable against the warm off-white surface, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and five stage labels, now rendered in light ink (title/names) and soft light-gray ink (value/percent lines), both clearly legible against the dark surface. Thin dark dividers between segments read as subtle seams rather than gaps.
      Data: Identical five segment colors and identical proportions to the light render — only the chrome (title/label ink, background) flipped as expected; data colors did not shift.
      Legibility verdict: PASS — no dark-on-dark failures; every title, stage name, and value/percent label is clearly visible against the near-black background.

    Cross-render check: Data colors (green/lavender/blue/ochre/red) are pixel-identical between the two renders; only ink and background tokens changed, matching the theme-adaptive chrome contract.
