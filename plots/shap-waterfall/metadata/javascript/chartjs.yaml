review:
  strengths:
  - 'Both attempt-1 weaknesses were correctly fixed: value labels now use Chart.defaults.font.family
    instead of hardcoded Arial, and the x-axis max padding was tightened from *1.2
    to *1.1, giving bars more of the canvas width.'
  - Custom canvas plugin (afterDatasetsDraw) renders dashed cumulative-flow connectors
    and per-bar value labels — an idiomatic, native-API use of Chart.js rather than
    an external plugin.
  - 'Correct floating-bar technique (data: [start, end]) faithfully implements the
    cumulative waterfall flow.'
  - 'Full theme-adaptive chrome: title, ticks, grid, and neutral base/final bars all
    flip correctly between light and dark, while red/blue data colors stay pixel-identical.'
  - Realistic, neutral loan-approval data with 12 features, correctly sorted by descending
    |SHAP| magnitude, and internally consistent (base + sum(shap) = final).
  weaknesses:
  - 'Row spacing across the 14 rows (categoryPercentage: 0.85) is still on the denser
    side — a touch more headroom would give slightly more breathing room, though it''s
    not currently a legibility problem.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Bold dark-ink title "shap-waterfall · javascript · chartjs · anyplot.ai" top-centered; legend with red/blue/black swatches; subtle vertical gridlines; dark axis tick labels and x-axis title "Predicted Approval Probability" with % suffix. All clearly legible.
      Data: Twelve feature bars flow from a black "Base value" bar (45.0%) through alternating red positive segments (Income +18.5, Credit Score +12.8, ...) and blue negative segments (Missed Payments -14.2, Debt-to-Income Ratio -9.6, ...), connected by dashed grey connector lines, to a black "Final prediction" bar (54.6%). First categorical color intentionally red/blue per spec's SHAP convention, not #009E73 (semantic exception, legend-labeled). X-axis max now tops out at 70% (tightened from 80% in attempt 1), so bars fill more of the canvas.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title/legend/axis structure rendered in light cream ink; ticks and axis title flip to soft cream; gridlines subtle light-on-dark. No dark-on-dark failures found.
      Data: Base/Final total bars flip from black to a cream/off-white fill (theme-adaptive t.ink token); red (#AE3030) and blue (#4467A3) segment colors are pixel-identical to the light render, confirming only chrome flipped.
      Legibility verdict: PASS
