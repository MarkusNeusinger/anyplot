review:
  strengths:
  - Custom canvas plugin (afterDatasetsDraw) renders dashed cumulative-flow connectors
    and per-bar value labels — an idiomatic use of Chart.js's native plugin API that
    a plain horizontal bar config couldn't achieve.
  - 'Correct floating-bar technique (data: [start, end] pairs) for the waterfall segments,
    faithfully implementing the spec''s cumulative-flow requirement.'
  - 'Full theme-adaptive chrome: title, ticks, grid, and the neutral base/final bars
    all flip correctly between light and dark, while the red/blue data colors stay
    identical across themes.'
  - Legend explicitly labels the semantic color mapping ('Positive contribution' /
    'Negative contribution' / 'Base value / prediction'), making the red-for-positive
    / blue-for-negative choice self-explanatory and directly matching the spec's explicit
    color instruction (mirrors the real SHAP library's RdBu convention).
  - Realistic, neutral loan-approval domain data with 12 features, sensible SHAP magnitudes
    sorted by descending |shap|, and correctly computed base/final percentages.
  weaknesses:
  - Value-label font drawn by the custom plugin ('600 15px Arial, sans-serif') doesn't
    match Chart.js's default label font family used for axis ticks and the legend,
    creating a small typographic inconsistency — reuse the chart's default font stack
    in the plugin's ctx.font.
  - X-axis max is padded to ~80% while the data only spans to ~65%, leaving a wide
    unused band on the right of every row — tighten the padding multiplier (e.g. 1.1
    instead of 1.2) so bars use more of the available width.
  - With 14 rows in a fixed-height mount, bar/row spacing is on the denser side —
    a touch more categoryPercentage headroom would give the segments more breathing
    room.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "shap-waterfall · javascript · chartjs · anyplot.ai" in bold dark ink, top-centered legend with three swatches (red/blue/black), subtle vertical gridlines, dark tick labels on both axes, dark axis title "Predicted Approval Probability" below the x-axis. All chrome is dark-on-light and clearly legible.
      Data: 12 feature bars flow horizontally from a black "Base value" bar (45.0%) through alternating red (positive, e.g. Income +18.5) and blue (negative, e.g. Missed Payments (12mo) -14.2) segments, connected by dashed grey connector lines, down to a black "Final prediction" bar (54.6%). Numeric value labels sit to the right of each bar. First categorical data color is matte red #AE3030 (positive) and blue #4467A3 (negative) — matches the spec's explicit red/blue SHAP convention rather than the generic brand-green-first rule, which is an appropriate semantic exception since polarity is explicitly labeled in the legend.
      Legibility verdict: PASS — no light-on-light text, no overlap, no clipped elements observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title/legend/axis structure as light, now rendered in light cream ink (~#F0EFE8) and soft cream tick labels (~#B8B7B0). Gridlines are subtle light-on-dark. The "Base value" / "Final prediction" bars flip from black to a cream/off-white fill (neutral anchor token), matching the theme-adaptive "neutral" semantic role from the style guide.
      Data: Red (#AE3030) and blue (#4467A3) segment colors are pixel-identical to the light render — only chrome flipped, as required. Value labels remain legible in cream against the dark bars/background; no dark-on-dark text found anywhere (all bar labels and axis text use the light ink token).
      Legibility verdict: PASS — no dark-on-dark failures, all text and data clearly distinguishable from the near-black surface.
