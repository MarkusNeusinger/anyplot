review:
  strengths:
  - Implements a genuine waterfall chart using only the core Highcharts bundle (no
    highcharts-more/waterfall module) via an invisible-spacer stacked-bar technique
    plus hand-drawn connector lines through chart.renderer.path() — exactly respects
    the library's constraint that add-on modules aren't loaded, and is a creative,
    correct workaround.
  - 'Data is fully realistic and internally consistent: the ten SHAP contributions
    sum exactly from the stated base value (18.0%) to the stated final prediction
    (13.8%), and features are correctly ordered by descending absolute magnitude (largest
    contribution at top, as required by the spec).'
  - Both base-value and prediction reference lines are clearly labeled and visually
    distinguished (dashed vs. solid, muted vs. bold), giving the viewer an immediate
    anchor for the waterfall's start and end points.
  - Legend uses domain-meaningful labels ('Increases risk' / 'Decreases risk') rather
    than generic terms, making the semantic red/blue color mapping self-explanatory
    and satisfying the spec's explicit 'red for positive, blue for negative' requirement.
  - Clean theme-token usage throughout (ink/inkSoft/grid) with correct light/dark
    chrome in both renders — no dark-on-dark or light-on-light failures, and no edge
    clipping on either render.
  weaknesses:
  - 'Data labels (''+X.X pp'') and the two reference-line labels (''Base value: 18.0%'',
    ''Prediction: 13.8%'') are set to 13px, smaller than the 14px baseline used for
    tick/legend text elsewhere on the chart. Verified against the generated 400px
    mobile thumbnail: these are the first text elements to blur into illegibility
    at mobile scale. Bump to 14-15px to match the rest of the type scale.'
  - 'Design Excellence / storytelling could go further: nothing visually calls out
    which single feature (Credit Score, -8.6pp) is the dominant driver of the prediction;
    a subtle emphasis (bolder label weight, or slight color-intensity variation by
    magnitude) on the largest-magnitude segment would sharpen the immediate insight.'
  - The value-axis grid lines are drawn at every 1% increment across the full chart
    width, which is slightly busier than necessary for a 10-category horizontal layout
    — consider thinning to major ticks only (every 2-5%) for a cleaner background.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface — not pure white.
      Chrome: Title "shap-waterfall · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable. Ten feature-name category labels on the left (Credit Score down to Age of Credit History) in dark ink, all legible. X-axis (value axis) percentage ticks 0%-19% in soft dark gray, legend "Increases risk" (red swatch) / "Decreases risk" (blue swatch) at the bottom, all readable. Y-axis title "Contribution to Predicted Default Probability" clearly visible below the tick row.
      Data: First (top, largest-magnitude) segment is Credit Score at -8.6pp in blue (decreases risk); Debt-to-Income Ratio +5.2pp in matte red (increases risk); segments alternate color by sign down to Age of Credit History at -0.9pp. Dashed connector lines link the end of each segment to the start of the next, visually confirming the cumulative flow. A dashed reference line labeled "Base value: 18.0%" sits at the right edge; a solid black reference line labeled "Prediction: 13.8%" sits near the chart's horizontal center, matching the final cumulative value.
      Legibility verdict: PASS for all primary chrome (title, category labels, axis, legend). Minor exception: the small 13px per-segment "pp" data labels and the two reference-line labels are noticeably smaller than the rest of the type scale and become hard to read once the image is scaled down to mobile width (see Weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface — not pure black.
      Chrome: Title and category labels render in light off-white ink, tick labels and axis title in a softer light gray — all clearly legible against the dark background, no dark-on-dark failures observed anywhere (title, category names, tick labels, legend, reference-line labels, and pp data labels are all rendered in light-colored text).
      Data: Colors are pixel-identical to the light render — same matte red (#AE3030) for "Increases risk" segments and same blue (#4467A3) for "Decreases risk" segments; only the chrome (background, text, grid, reference lines) flipped to the dark palette. The dashed base-value line and solid prediction line are still clearly visible (light-colored strokes against dark background) with their labels legible.
      Legibility verdict: PASS for all primary chrome; same minor small-label caveat as the light render (13px pp/reference labels), which is a legibility issue equally present in both themes rather than a theme-specific defect.
