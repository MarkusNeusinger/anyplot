review:
  strengths:
  - 'Correct SHAP waterfall semantics: features ordered by descending |SHAP| from
    the final-prediction bar down to the base-value bar, exactly matching the reference
    shap.plots.waterfall convention'
  - Cumulative flow is mathematically correct — verified base (0.320) + sum of all
    10 SHAP contributions = final (0.385), and each bar's invisible placeholder offset
    is derived from min(start, end) so segments stack precisely
  - 'Idiomatic ECharts waterfall pattern: transparent placeholder stacked-bar series
    plus an overlaid dashed line series for the connector, which is the library''s
    own documented recipe for this chart type'
  - 'Legitimate semantic color exception: red for positive / blue for negative SHAP
    contributions matches both the spec''s explicit instruction and the widely recognized
    SHAP-library color convention, using palette positions 5 (matte red, semantic
    bad/loss anchor) and 3 (blue) rather than the default ordinal sequence'
  - Base/final anchor bars use the theme-adaptive ink token, correctly flipping from
    near-black on light to near-white on dark, functioning as a 'neutral/baseline'
    role
  - 'Clean, legible chrome in both themes: no dark-on-dark or light-on-light issues,
    subtle single-axis gridlines, generous right margin sized to fit the outermost
    value label without overflow'
  - Per-bar numeric SHAP labels (+/−) and labeled base/final reference bars fully
    satisfy the spec's annotation requirements
  weaknesses:
  - Legend and axis typography lean on ECharts defaults (no custom font family, no
    removed frame elements beyond what ECharts omits by default) — a bit more typographic
    refinement would lift Design Excellence further
  - The placeholder-stack + line-overlay technique, while correctly executed, is the
    standard documented ECharts waterfall recipe rather than a distinctive library
    feature — consider a small unique touch (e.g. subtle bar corner radius, a highlighted
    focal segment) to raise Library Mastery on a future pass
  - Value labels (14px) are noticeably smaller than the title (22px); at the 400px
    mobile thumbnail scale they will be the first element to become hard to read —
    verify legibility at small render sizes
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "shap-waterfall · javascript · echarts · anyplot.ai" centered in dark near-black text; legend with three swatches (red "Increases prediction", blue "Decreases prediction", dark "Base / final value") centered below the title; x-axis "Predicted default probability" with tick labels 0.00-0.75; y-axis lists 12 category rows (Final prediction, 10 features ordered by descending |SHAP|, Base value). All text is dark and clearly legible against the light background.
      Data: 10 horizontal bar segments stacked as a waterfall, connected by a dashed grey flow line tracing the cumulative path from Base value (0.320, dark bar) up through each feature to Final prediction (0.385, dark bar). Positive-SHAP features (Recent Late Payments, Debt-to-Income Ratio, Credit Utilization, Loan Amount, Number of Open Accounts, Existing Loans) are matte red; negative-SHAP features (Credit Score, Income, Employment Length, Age) are blue. Each bar carries a signed numeric label (e.g. "+0.150", "−0.220"). Base/final bars are solid dark bars spanning 0 to their respective values, labeled "Base: 0.320" / "Final: 0.385".
      Legibility verdict: PASS — no light-on-light issues, all bar labels and axis text readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis structure as the light render, now rendered in light/off-white text (title and axis labels), clearly visible against the dark surface. The "Base / final value" legend swatch and the Base/Final bars themselves flip to a light near-white fill (theme-adaptive ink token), preserving their role as the neutral/reference-line elements. Grid lines remain subtle but visible.
      Data: Colors are pixel-identical to the light render for both data series — matte red for positive contributions, blue for negative — confirming only chrome (background, text, base/final bar fill) flips between themes, not the categorical/semantic data colors.
      Legibility verdict: PASS — no dark-on-dark failures; all tick labels, bar value labels, title, and legend text are clearly readable against the dark background.
