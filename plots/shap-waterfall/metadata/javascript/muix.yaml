review:
  strengths:
  - 'Correct cumulative chain: 14 segments from the base value 0.550 down to 0.135,
    each starting where its neighbour ends, with dashed connectors tracing the flow'
  - Stacked horizontal BarChart with a transparent offset series is the native MUI
    X route to a floating waterfall; native ChartsReferenceLine marks the base value
  - Custom SVG layer composed inside BarChart through useXScale/useYScale places value
    labels on each segment's free side with page-colour halos, readable even for the
    0.006 sliver
  - 'Semantic red #AE3030 / blue #4467A3 from the Imprint palette, identical in both
    themes, with theme tokens on all chrome'
  weaknesses:
  - 'LM-01 (code): the transparent ''offset'' series is a stacking helper but stays
    a normal series, so the HTML axis tooltip lists an unlabeled offset value next
    to each SHAP contribution → hide it from the tooltip (valueFormatter: () => null
    on the offset series). Likely cause: series id ''offset'' without a valueFormatter.'
  - 'Suggestion: the 0.02-step x ticks (29 labels) are dense; a 0.05 step would calm
    the axis.'
  - 'Suggestion: the prediction reference line runs through the ''+0.025'' and ''−0.012''
    labels; the halos keep them readable, but the line could stop at the last row.'
