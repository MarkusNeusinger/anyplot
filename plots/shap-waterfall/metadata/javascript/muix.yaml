review:
  strengths:
  - 'The waterfall is built idiomatically from a stacked BarChart: a transparent ''offset''
    series carries each segment to where its neighbour ends, and a null valueFormatter
    keeps that helper out of the HTML tooltip'
  - A custom SVG layer reads the chart's own scales through useXScale/useYScale to
    draw dashed connectors between segment ends and signed value labels with a page-colored
    halo, so every value stays readable where the prediction reference line crosses
    it (+0.025, -0.012) and on the 0.006 sliver
  - 'Both reference values are labeled at their end of the chain: ChartsReferenceLine
    marks the base value above the top row, and the prediction label sits on the last
    row on the side its value label leaves free; the prediction line in ink against
    the base line in inkSoft sets a quiet hierarchy'
  - 'The chain is computed, not typed: 0.550 + the 14 SHAP values lands exactly on
    0.135, features are sorted by |SHAP| with the largest at the top, and red #AE3030
    / blue #4467A3 follow the semantic up/down convention in both themes'
  - A plausible credit-scoring scenario whose alternating signs and slivers make the
    chain double back, exercising the plot type fully
  weaknesses:
  - 'Suggestion: the vertical grid at every 0.02 draws about 29 lines; a coarser tick
    interval (0.05) would quiet the background behind the segments.'
  - 'Suggestion: the subtitle repeats the base and prediction values that the two
    reference annotations already show; it could carry the model context (credit-scoring
    default risk) instead.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: centered bold title "shap-waterfall · javascript · muix · anyplot.ai" with a soft-ink subtitle "Base value 0.550 → Predicted default probability 0.135 · 14 features ordered by |SHAP value|, largest at the top"; 14 feature names on the y axis in dark ink (Credit score at the top, Existing loan count at the bottom); x ticks 0.04–0.60 every 0.02; x title "Predicted default probability (base value + cumulative SHAP)"; legend at the bottom "Pushes the prediction up" (red) / "Pushes the prediction down" (blue). Subtle vertical gridlines. All text readable.
      Data: horizontal waterfall segments chained from the dashed base line at 0.550 (labeled "Base value 0.550" above the top row) down to the dashed prediction line at 0.135 (labeled "Predicted default probability 0.135" beside the last row). Blue #4467A3 segments for negative contributions (-0.140 … -0.006), red #AE3030 for positive ones (+0.025, +0.020, +0.015, +0.008); the chain doubles back where signs alternate. Thin dashed connectors join segment ends; bold signed value labels sit at each segment's end with a page-colored halo, readable where the prediction line crosses them.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, feature names, ticks, axis title and legend all flip to light ink; gridlines dim grey; no dark-on-dark text anywhere.
      Data: identical segment colors (#AE3030 red, #4467A3 blue), identical geometry, labels and reference lines (now light dashed); value-label halos use the dark page color.
      Legibility verdict: PASS
