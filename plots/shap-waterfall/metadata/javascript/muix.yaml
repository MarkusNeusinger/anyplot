review:
  strengths:
  - 'Data is internally consistent: the 14 SHAP contributions sum exactly from base_value
    (0.55) to final_value (0.135), correctly ordered by descending absolute SHAP magnitude'
  - Correctly implements a floating-bar waterfall via MUI X's stacked-bar workaround
    (transparent offset series topped by a colored increase/decrease series) — the
    standard technique given the library has no native floating-bar mode
  - Base value and final prediction are both shown as labeled dashed reference lines
    (ChartsReferenceLine), directly satisfying the spec's 'labeled reference lines'
    requirement
  - Custom SVG connector lines built via useXScale/useYScale hooks trace the cumulative
    staircase between segments — a distinctive, idiomatic use of MUI X's lower-level
    hook API satisfying the spec's connector-line suggestion
  - Red/blue color mapping for positive/negative SHAP values matches both the spec's
    explicit instruction and the real-world SHAP library convention, using the Imprint
    palette's semantic-red anchor (#AE3030) and blue (#4467A3) correctly
  - 'Both renders use theme-correct backgrounds (#FAF8F1 light / #1A1A17 dark) with
    all chrome (title, axis labels, ticks, reference-line labels, legend) correctly
    flipped and legible — no dark-on-dark or light-on-light issues'
  - Clean, deterministic in-memory data; no unused imports; skipAnimation set correctly
    per the harness contract
  weaknesses:
  - About 5 of the 14 bar segments (Delinquencies, Loan Purpose, Home Ownership, Public
    Records, Existing Loan Count) are narrower than the 30px barLabel cutoff and render
    with no visible SHAP value at all — the spec requires the numeric value 'on or
    beside each bar segment', so these should get a value placed beside the bar (e.g.
    an offset text label to the right of the segment, or a leader line) instead of
    being suppressed entirely. This was flagged in the previous review and the repair
    pass did not change the implementation.
  - The smallest bar segments (a few px wide) are hard to individually distinguish
    without their value labels — consider a minimum visible segment width or leader-line
    labels for very small SHAP magnitudes
  - 'Design excellence is solid but not exceptional: the layout is a fairly conventional
    stacked horizontal bar chart with two reference lines; there isn''t much additional
    visual hierarchy or emphasis technique beyond that'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Loan Default Risk · shap-waterfall · javascript · muix · anyplot.ai" is clearly legible. The 14 y-axis feature names (Credit Score down to Existing Loan Count) are dark gray and all readable. The x-axis "Predicted Default Probability" label and tick values (0.00-0.70) are readable. Dashed reference lines labeled "Base rate 0.55" and "Prediction 0.135" are visible with soft dark-gray/black text. Bottom legend shows red "Increases risk" and blue "Decreases risk" swatches with readable labels.
      Data: The 7 largest segments (Credit Score -0.140 through Employment Length -0.030) are blue bars with white numeric value labels. Two red bars follow (+0.025, +0.020) with white labels. The remaining 5 small segments (Delinquencies, Loan Purpose, Home Ownership, Public Records, Existing Loan Count) render as thin colored slivers with NO visible value text (label suppressed below the 30px bar-width cutoff). Faint dashed gray connector lines link consecutive segment ends, tracing the cumulative staircase from base to prediction.
      Legibility verdict: PASS (all rendered text is readable against the light background; the only gap is the intentionally-suppressed labels on the smallest bars, a data-completeness/SC-02 issue, not a legibility/contrast issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Title, y-axis feature names, x-axis label/ticks, reference-line labels, and legend text all render in light gray/white and remain clearly legible against the dark background — no dark-on-dark failures observed.
      Data: Data colors (red for "Increases risk", blue for "Decreases risk") are identical to the light render — only the chrome (background, text, grid) flipped, as required. The same 5 smallest segments lack visible value labels, mirroring the light render.
      Legibility verdict: PASS (no dark-on-dark or contrast issues found; theme adaptation is correctly threaded through title, axes, legend, and reference lines).
