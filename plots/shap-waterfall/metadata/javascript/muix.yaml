review:
  strengths:
  - Data is internally consistent — the 14 SHAP contributions sum exactly from base_value
    (0.55) to final_value (0.135), and rows are correctly ordered by descending absolute
    SHAP magnitude
  - Correctly implements a floating-bar waterfall using MUI X's stacked-bar workaround
    (transparent offset series + colored increase/decrease series), which is the standard
    technique given the library has no native floating-bar mode
  - Base value and final prediction are both shown as labeled dashed reference lines
    (ChartsReferenceLine), directly satisfying the spec's 'labeled reference lines'
    requirement
  - Custom SVG connector lines (via useXScale/useYScale hooks) trace the cumulative
    staircase between segments, a distinctive and idiomatic use of MUI X's lower-level
    hook API
  - Red/blue color mapping for positive/negative SHAP values matches both the spec's
    explicit instruction and the real-world SHAP library convention
  - 'Both renders use exact theme-correct backgrounds (#FAF8F1 light / #1A1A17 dark
    verified by pixel sample), and canvas is exactly 3200x1800'
  - Clean, deterministic in-memory data; no unused imports; skipAnimation set correctly
    per the harness contract
  weaknesses:
  - About 5 of the 14 bar segments (Delinquencies, Loan Purpose, Home Ownership, Public
    Records, Existing Loan Count) are narrower than the 30px barLabel cutoff and render
    with no visible SHAP value at all — the spec requires the numeric value 'on or
    beside each bar segment', so these should get a value placed beside the bar (e.g.
    an offset text label to the right of the segment) instead of being suppressed
    entirely.
  - The smallest bar segments (a few px wide) are hard to individually distinguish
    without their value labels — consider a minimum visible segment width or a leader-line
    label for very small SHAP magnitudes.
  - 'Design excellence is solid but not exceptional: the layout is a fairly conventional
    stacked horizontal bar chart with two reference lines; there isn''t much beyond
    that in terms of visual hierarchy or emphasis technique.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1, verified by pixel sample) — matches the style guide exactly.
      Chrome: Title "Loan Default Risk · shap-waterfall · javascript · muix · anyplot.ai" is bold dark text, clearly legible. Y-axis feature names (Credit Score, Payment History, ... Existing Loan Count) are dark gray, all readable. X-axis "Predicted Default Probability" label and tick values (0.00-0.70) are readable. Dashed reference lines labeled "Base rate 0.55" and "Prediction 0.135" are visible with soft dark-gray text. Bottom legend shows red "Increases risk" and blue "Decreases risk" swatches with readable labels.
      Data: First 7 rows (largest |SHAP|) show blue bars (Credit Score -0.140 down to Employment Length -0.030) with white value labels. Two red bars follow (+0.025, +0.020) with white labels. The remaining 5 small segments (Delinquencies, Loan Purpose, Home Ownership, Public Records, Existing Loan Count) are thin colored slivers with NO visible value text (label suppressed below 30px bar width). Faint dashed gray connector lines link consecutive segment ends, tracing the cumulative staircase.
      Legibility verdict: PASS (all rendered text is readable against the light background; the only gap is the intentionally-suppressed labels on the smallest bars, which is a data-completeness issue, not a legibility/contrast issue).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17, verified by pixel sample) — matches the style guide exactly, not pure black.
      Chrome: Title, y-axis feature names, x-axis label/ticks, reference-line labels, and legend text all render in light gray/white and are clearly legible against the dark background — no dark-on-dark failures observed.
      Data: Data colors (red for "Increases risk", blue for "Decreases risk") are visually identical to the light render — only the chrome (background, text, grid) flipped, as required. Same 5 smallest segments lack visible value labels, mirroring the light render.
      Legibility verdict: PASS (no dark-on-dark or contrast issues found; theme adaptation is correctly threaded through title, axes, legend, and reference lines).
