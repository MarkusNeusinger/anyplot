review:
  strengths:
  - 'Correct cumulative waterfall math: bars flow start→end exactly matching base_value
    + cumsum(shap_values), verified visually against the printed +/- labels'
  - Features ordered by descending absolute SHAP magnitude with largest at top, matching
    the spec requirement
  - Semantic red/blue color mapping for increase/decrease is explicit in the legend
    text ("Increases prediction" / "Decreases prediction"), satisfying the Imprint
    semantic-exception rule rather than misusing the ordinal palette
  - Dotted connector lines between consecutive bar segments make the cumulative flow
    easy to trace
  - Base value and final prediction are both marked with theme-adaptive dashed reference
    lines and readable annotations
  - 'Clean theme-adaptive chrome: bottom-only spine, subtle gridlines, correct PAGE_BG/INK/INK_SOFT
    tokens in both renders'
  - Idiomatic use of Makie's floating-bar API (`barplot!` with `direction = :x` and
    `fillto = starts`) for the waterfall geometry
  - Realistic, non-controversial credit-scoring dataset with plausible feature names
    and magnitudes
  weaknesses:
  - 'The ''Base value: 18.4%'' and ''Prediction: 28.1%'' annotations are center-aligned
    directly on top of their own vertical dashed reference lines, so the dashed line
    visibly cuts through the text in both renders — offset the text horizontally (e.g.
    align = (:left, :bottom) with a small x nudge) or shorten the vlines so they stop
    below the label row.'
  - No y-axis label; while the feature names on the tick axis are self-explanatory,
    a short axis title (e.g. 'Feature') would match the x-axis's descriptive labeling
    convention.
  - Distinctive Makie-specific features are modest — the implementation leans on generic
    annotation/legend/vlines primitives rather than showcasing anything unique to
    the library beyond the floating-bar waterfall technique.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with spec.
      Chrome: Title "shap-waterfall · julia · makie · anyplot.ai" in bold dark ink, clearly visible. X-axis label "Predicted Default Probability (%)" and tick labels legible in dark/soft-dark ink. Feature names on the y-axis are dark and readable. Legend at bottom ("Increases prediction" / "Decreases prediction") is legible with matching color swatches.
      Data: Ten horizontal floating bars cascade left-to-right from a "Base value: 18.4%" dashed line to a "Prediction: 28.1%" dashed line, ordered by descending |SHAP| magnitude (Debt-to-Income Ratio at top, Number of Credit Inquiries at bottom). Red bars (#AE3030) push the prediction up, blue bars (#4467A3) pull it down; each bar has a signed numeric label (+7.2, +5.1, +4.3, -3.8, -3.1, -2.4, +1.8, -1.5, +1.2, +0.9) and dotted vertical connectors link consecutive segments.
      Legibility verdict: PASS overall, with one caveat — the vertical dashed reference lines for base value and prediction pass directly through the center of their own text labels ("Base value: 18.4%" and "Prediction: 28.1%"), which is a minor overlap flaw (text remains readable, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with spec.
      Chrome: Title, axis labels, and tick labels flip to light ink (#F0EFE8 primary / #B8B7B0 secondary) and remain fully legible against the dark background — no dark-on-dark failures observed. Legend text and swatches are clearly visible.
      Data: Identical bar geometry, red/blue data colors (#AE3030 / #4467A3), and numeric labels as the light render — data colors match exactly, only chrome (background, text, grid, dashed reference-line color) flipped.
      Legibility verdict: PASS overall, same minor caveat as light render — dashed reference lines cross through the "Base value" and "Prediction" annotation text.
