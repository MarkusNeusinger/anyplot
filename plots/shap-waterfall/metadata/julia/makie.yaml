review:
  strengths:
  - Features are correctly ranked by descending absolute SHAP magnitude, with the
    largest contributor (Debt-to-Income Ratio) at the top, matching the spec's ordering
    requirement.
  - 'Cumulative waterfall math is verifiably correct: base_value (18.4) + sum of shap_values
    (9.7) = final_value (28.1), and the displayed ''Prediction: 28.1%'' matches exactly.'
  - Base value and final prediction are shown as clearly labeled dashed reference
    lines with triangle markers, satisfying the spec's 'labeled reference lines or
    annotations' requirement.
  - Dotted connector lines between consecutive segments effectively emphasize the
    cumulative flow, exactly as suggested in the spec notes.
  - 'Semantic red/blue bar coloring for positive/negative SHAP values directly matches
    the spec''s explicit color mandate, drawn from Imprint palette anchors (#AE3030,
    #4467A3) rather than arbitrary colors.'
  - Numeric SHAP value labels are adaptively aligned (left for positive, right for
    negative) beside each bar, avoiding collision with the bar itself.
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded through every chrome element
    — title, axis labels, ticks, grid, and text annotations — and both renders are
    fully legible.
  - Clean, deterministic, single-file script with correct canonical title format and
    correct save API (plot-$(THEME).png, px_per_unit=2).
  weaknesses:
  - 'The ''Base value: 18.4%'' and especially ''Prediction: 28.1%'' labels sit extremely
    close above their own dashed reference line and triangle marker (only ~0.1-0.5
    data units of vertical gap, since line_top = n+0.4 while the labels sit at n+0.5
    and n+0.9). In both renders the marker/line visually touches or intrudes into
    the text (most visible as the line cutting between ''Predict'' and ''ion''). Increase
    the gap — e.g. raise line_top to n+0.7 or move the text further up to n+1.1/n+1.3
    — so the marker and text no longer visually collide.'
  - The y-axis label 'Feature' is somewhat redundant since the tick labels already
    display each feature name directly; consider omitting it or replacing it with
    something more specific.
  - Library Mastery is fairly generic — beyond barplot!(fillto=...) for the floating
    bars, the implementation doesn't showcase much Makie-distinctive capability (e.g.
    more advanced GridLayout composition, custom recipes). Fine for this spec, but
    leaves room for a more idiomatic-Makie flourish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "shap-waterfall · julia · makie · anyplot.ai" in bold dark ink, clearly legible. X-axis label "Predicted Default Probability (%)" and y-axis feature-name ticks are dark/soft-dark and fully readable. Subtle vertical gridlines at 20/30/40. Bottom spine visible, top/left/right spines hidden.
      Data: 10 horizontal floating bars ranked by descending |SHAP| from top (Debt-to-Income Ratio) to bottom (Number of Credit Inquiries). Positive-contribution bars are matte red (#AE3030), negative-contribution bars are blue (#4467A3) — consistent with the spec's explicit red/blue mandate. Dotted connector lines link consecutive cumulative segments. Dashed reference lines with upward triangle markers mark "Base value: 18.4%" and "Prediction: 28.1%" (bold). Numeric SHAP labels (e.g. "+7.2", "-3.8") sit beside each bar, aligned away from the bar body. Legend at the bottom reads "Increases prediction" / "Decreases prediction" with matching swatches.
      Legibility verdict: PASS (all text readable; minor concern — the "Base value"/"Prediction" labels sit very close to their own reference-line marker, close to touching but not unreadable).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and ticks now rendered in light ink (#F0EFE8) / soft light-grey (#B8B7B0), clearly legible against the dark background. Gridlines remain subtle. No dark-on-dark or light-on-light failures observed.
      Data: Identical bar colors, layout, connector lines, reference-line markers, and numeric labels as the light render — confirms data colors are theme-invariant, only chrome flipped.
      Legibility verdict: PASS (same minor label/marker proximity concern as the light render, otherwise fully readable).
