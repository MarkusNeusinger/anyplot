review:
  strengths:
  - 'Every spec-required feature is present: magnitude-descending order, cumulative
    flow from base_value to final_value, red=positive/blue=negative semantic coloring,
    labeled base-value and prediction reference lines, per-bar numeric SHAP labels,
    and dotted connector lines between segments.'
  - 'SHAP arithmetic is internally consistent: the cumulative sum ends exactly at
    final_value (27.5%), and each bar''s xmin/xmax correctly chains to the previous
    bar''s cumulative endpoint.'
  - 'Idiomatic, distinctive ggplot2 construction: geom_rect for the bars (no native
    waterfall geom exists), scale_y_continuous with manual breaks/labels used as a
    categorical axis substitute, layered annotate() for base/prediction callouts.'
  - 'Theme-adaptive chrome is fully correct in both renders (identical Imprint-position
    red/blue data colors, correct #FAF8F1/#1A1A17 backgrounds, correct ink tokens
    for text).'
  - All font sizes explicitly set per the style-guide defaults (text=8, axis.title=10,
    axis.text=8/9, plot.title=12, legend.text=8); no clipping, overlap, or dark-on-dark/light-on-light
    issues in either render.
  - Realistic, neutral credit-scoring example with a plausible mix of positive and
    negative contributions across 10 features of varying magnitude.
  - 'Clean KISS code: no functions/classes, clear top-to-bottom flow, only used imports
    (ggplot2/dplyr/ragg/scales all exercised), no fake interactivity.'
  weaknesses:
  - Design polish is strong but not at the very top tier (DE-01/DE-02) — e.g. grid
    lines use full INK color rather than a lighter/faint shade, relying only on thin
    linewidth for subtlety.
  - LM-02 distinctive-feature usage is good (geom_rect waterfall + scale_y_continuous
    categorical trick) but doesn't reach a fully unique-to-ggplot2 flourish (e.g.
    coord_flip variant, custom stat) that would be materially harder to replicate
    in another library.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "shap-waterfall · r · ggplot2 · anyplot.ai" in dark ink at top-left, fully visible, no clipping. Y-axis shows 10 feature names (Credit Score, Debt-to-Income Ratio, Late Payments (12mo), Employment Length, Annual Income, Loan Amount, Credit Utilization, Age, Open Credit Accounts, Home Ownership) ordered by descending |SHAP|. X-axis "Predicted Default Probability" with percent-formatted ticks (20%, 30%, 40%). Thin vertical major gridlines only, no y-gridlines. A dashed vertical line labeled "Base value E[f(x)] = 35.0%" and a solid vertical line labeled "Prediction f(x) = 27.5%" (bold) mark the start/end of the cumulative flow. Bottom legend reads "Increases risk" (red swatch) / "Decreases risk" (blue swatch).
      Data: Horizontal bar segments in matte red (#AE3030, positive SHAP) and blue (#4467A3, negative SHAP), each labeled with its signed value (e.g. "-0.22", "+0.15"), connected by thin dotted step lines between consecutive bars, cumulatively tracing from base value to final prediction.
      Legibility verdict: PASS — all title, axis, tick, and annotation text is clearly readable against the light background; no overlaps or overflow observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render. Title, axis labels, tick labels, and both reference-line annotations are rendered in light ink (white/light gray), fully legible against the dark background. Gridlines are faint light-colored verticals, still visible but subtle. Legend text and swatches read clearly at the bottom.
      Data: Bar colors are identical to the light render — matte red (#AE3030) for positive contributions and blue (#4467A3) for negative contributions — confirming only chrome (background, text, grid) flips between themes, not data colors.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, ticks, feature names, SHAP value labels, base/prediction annotations, legend) remains clearly readable against the near-black surface.
