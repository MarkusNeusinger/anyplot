review:
  strengths:
  - 'Complete waterfall: 12 segments chained from the dashed base line (0.15) to the
    solid predicted line (0.28), ordered by |SHAP| with the largest at the top'
  - Signed value labels sit outside each bar on the side it moves toward (+ right,
    − left), readable even on the ±0.01 slivers
  - 'Theme tokens threaded through every chrome element: both renders pass the readability
    check with identical red/blue data colors'
  - 'Adaptable code: column constants with role comments, a self-contained Data block,
    and the chain derived from df via cumsum'
  weaknesses:
  - 'DE-02 (both): a full four-sided frame surrounds the panel, so all four spines
    show where nothing requires them → no frame, only the bottom axis line. Likely
    cause: panel_background=element_rect(fill=PAGE_BG) without color=PAGE_BG (or panel_border
    not taking effect after theme_minimal()).'
  - 'VQ-06 (both): the x-axis is titled ''SHAP value (change in readmission probability)''
    but its ticks show the cumulative model output (0.10–0.32 readmission probability)
    → a title naming the predicted probability, e.g. ''Predicted readmission probability''.
    Likely cause: labs(x=SHAP_VALUE).'
  - 'VQ-05 (both): x limits pad the chain by 45 % of its span on each side, so roughly
    45 % of the panel width (0.09–0.15 and 0.28–0.34) holds no data → padding of about
    10–15 % of the span (−30 %), enough for the value labels. Likely cause: scale_x_continuous(limits=[chain.min()
    - 0.45 * span, chain.max() + 0.45 * span]).'
  - 'Suggestion: the dotted connectors are only a few pixels long in the narrow gap
    between bars and nearly invisible; a slightly heavier stroke would make the flow
    cue readable.'
  - 'Suggestion: the heavy dark bar outlines in the light render could be lightened
    or removed for a cleaner fill.'
