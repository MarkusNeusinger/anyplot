review:
  strengths:
  - 'Every characteristic of a SHAP waterfall is in place: a chained segment per feature
    from Base = 0.34 to Pred = 0.63, largest |SHAP| on top, red for positive and blue
    for negative, a signed value beside each bar'
  - Native geom_rect over computed start/end columns builds the waterfall in the grammar
    without a custom stat; vectorized cumsum/shift for the chain and connectors
  - Theme tokens threaded through every chrome element; both renders are fully readable
    and the data colors identical
  - Correct 3200x1800 canvas with style-guide font sizes (12/10/8 pt)
  weaknesses:
  - 'VQ-02 (both): the dotted final-prediction line at x=0.63 runs through the ''+0.060''
    (Payment History) and ''+0.050'' (Savings Balance) bar labels, striking the second
    digit → no label crossed by a reference line (0 crossings, now 2). Likely cause:
    positive labels placed at end + nudge_x with ha=''left'' where the bar end (0.61)
    sits just left of final_value; draw the reference vlines below the labels and
    give those labels a page-colored backing (geom_label with fill=PAGE_BG, no border)
    or a data story whose bar ends do not sit next to the prediction.'
  - 'VQ-06 (both): the x axis is titled ''SHAP Value (Feature Contribution)'', but
    it shows the cumulative model output from the base value 0.34 to the prediction
    0.63, not SHAP values → a title for what the axis carries, e.g. ''Model output
    (approval probability)''. Likely cause: the SHAP column name reused as the x label
    in labs(x=SHAP).'
  - 'Suggestion: a stronger visual weight for the Pred = 0.63 annotation than for
    Base would put the focus on the outcome.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'Loan Approval · shap-waterfall · python · plotnine · anyplot.ai' in dark ink at top left; x-axis title 'SHAP Value (Feature Contribution)' and ticks 0.3-0.7 readable; feature names on the y axis in dark ink; subtle vertical grid only; legend 'Contribution' (Negative blue, Positive red) on an elevated box at right. 'Base = 0.34' above the top bar and 'Pred = 0.63' below the bottom bar, both beside dotted reference lines.
      Data: 12 horizontal segments chained from 0.34 to 0.63, Annual Income +0.180 on top down to Home Ownership -0.010; positive in matte red #AE3030, negative in blue #4467A3; short dashed connectors between neighbors; signed values right of positive and left of negative bar ends. The dotted 0.63 line crosses the '+0.060' and '+0.050' labels. No green series (semantic red/blue required by the spec).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
