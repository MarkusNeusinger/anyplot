review:
  strengths:
  - 'The waterfall chain is built with pygal''s own stacking idiom: HorizontalStackedBar
    with an unpainted spacer series up to each segment''s left edge, so every segment
    starts exactly where its neighbor ends and the chain runs unbroken from 0.25 to
    0.48'
  - Base value and prediction are drawn as pygal major y_labels guides (dashed, heavier
    stroke) with bold 'Base 0.25' / 'Prediction 0.48' labels in the tick row; nearby
    ticks are dropped so the labels never collide
  - 'Per-point dict values carry each segment''s color (#AE3030 up, #4467A3 down)
    and its signed label, printed beside every segment via print_labels, readable
    even for the +0.02 sliver'
  - Features sorted by |SHAP| with Monthly Charges at the top, chain climbing from
    the base at the bottom to the prediction next to the largest bar
  - 'Theme tokens threaded through Style and inline CSS: all chrome flips cleanly,
    data colors identical in both renders; HTML export keeps native pygal tooltips'
  weaknesses:
  - 'Suggestion: thin connector lines between consecutive segment ends (the Notes''
    optional ''consider a connector line'') would make the doubling-back flow easier
    to trace, for example through a pygal XY overlay or inline CSS on the spacer edges.'
  - 'Suggestion: the ''Prediction 0.48'' label sits at the bottom of a chain that
    ends at the top; a label near the Monthly Charges end would tie it closer to the
    segment it closes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
