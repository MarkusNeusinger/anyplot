      Data: 10 horizontal waterfall segments, matte red #AE3030 for positive and blue #4467A3 for negative contributions, chained from Streaming TV (+0.02, bottom, starting at 0.25) up to Monthly Charges (+0.20, top, ending at 0.48); signed value labels beside each segment's right end. No brand-green series (the spec mandates red/blue).
