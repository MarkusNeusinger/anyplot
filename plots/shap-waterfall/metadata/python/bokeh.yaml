review:
  strengths:
  - 'Cumulative chain computed with cumsum/shift in pandas and drawn as hbar from
    a ColumnDataSource: every segment starts where its neighbor ends, running unbroken
    from 0.35 to 0.28'
  - Features ordered by |SHAP| with the largest at the top via a reversed categorical
    y range
  - Base value (dashed soft ink) and prediction (solid ink, bold label) reference
    lines with labels in dedicated headroom, readable in both themes
  - Signed value labels inside every bar, legible even for the ±0.02 segments
  - Theme tokens threaded through all chrome; Imprint red/blue identical in both renders
  weaknesses:
  - 'VQ-03 (both): the dashed connector segments between bars are drawn at line_width=2
    with alpha 0.7 in INK_SOFT and read as hairlines on a 3200 px canvas, worst on
    the dark surface, → about line_width 3-4 at alpha 0.9 (+1 to +2 px). Likely cause:
    p.segment line_width=2, line_alpha=0.7.'
  - 'VQ-05 (both): the longest y tick labels (''Employment Duration'', ''Debt-to-Income
    Ratio'') start 3-5 px from the left canvas edge, and the y range padding leaves
    an empty band of about 100 px below the last bar → at least 30 px left margin
    (+25 px) and a smaller bottom padding. Likely cause: min_border_left=40 with y_range.range_padding=0.25
    applied to both ends.'
  - 'Suggestion: a HoverTool listing the feature, its SHAP value and the running total
    would add value to the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no outline box.
      Chrome: bold dark title 'Credit Default Risk · shap-waterfall · python · bokeh · anyplot.ai' (~63 % of width); y tick labels (12 feature names) in soft gray; x ticks 0.2-0.4 and italic axis title 'Cumulative Default Probability' in dark ink; faint vertical x grid. All readable.
      Data: 12 horizontal waterfall bars, Imprint blue #4467A3 for negative and Imprint red #AE3030 for positive SHAP, ordered by |SHAP| (Credit Score -0.18 at top, Education Level -0.02 at bottom); bold near-white signed value labels inside each bar; thin dashed connectors; dashed base line at 0.35 labeled 'Base value: 0.35' to its right, solid dark prediction line at 0.28 labeled bold 'Prediction: 0.28' to its left, both labels above the first bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light cream, tick labels and axis title light gray; no dark-on-dark text. Prediction line flips to light ink, base line light dashed.
      Data: bar colors identical to the light render; near-white value labels readable on both bar colors; connectors very faint.
      Legibility verdict: PASS
