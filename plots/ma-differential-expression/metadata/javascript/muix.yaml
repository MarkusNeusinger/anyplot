review:
  strengths:
  - 'Direction is double-encoded: up-regulated genes are upward triangles in brand
    green #009E73 and down-regulated genes are downward triangles in the matte-red
    semantic anchor #AE3030, so the split survives colour-vision deficiency and greyscale'
  - Non-significant genes are drawn small (markerSize 2.5) in the theme-adaptive inkSoft
    token at about 33 % alpha, so the 5,500 grey genes read as density and the significant
    genes sit on top, not buried
  - 'Reference lines are layered above the point cloud: a solid ink line at M = 0
    and dashed lines at M = ±1 span the whole expression range and stay visible through
    the points in both themes, with right-margin labels log₂FC = ±1 that keep the
    plot area clear'
  - Uses MUI X v9 composition (ChartsContainer + ScatterPlot + ChartsGrid + ChartsXAxis/ChartsYAxis)
    and the useXScale/useYScale hooks to draw the triangles, LOESS path and reference
    lines in data coordinates inside the chart's own SVG
  - The grey cloud is a native MUI X scatter series, so the HTML version gets hover
    tooltips for the non-significant genes
  - 'Theme threading is complete: page background, title, axis labels, tick labels,
    grid and legend text all come from ANYPLOT_TOKENS and read cleanly on #FAF8F1
    and #1A1A17'
  weaknesses:
  - 'SC-02, VQ-03 (both): the up- and down-regulated triangles are fully opaque at
    about 13 px wide (R = 6.5) and fuse into solid green and red bands above an expression
    of 2, so the density of significant genes cannot be read, against the spec''s
    transparency-on-the-points property → give the triangles transparency as well
    (fillOpacity about 0.5–0.6) and/or shrink them to R ≈ 4.5 (−2 px). Likely cause:
    the polygons'' fill at lines 158 and 169 has no fillOpacity, and R = 6.5 at line
    142.'
  - 'DQ-02 (both): 4,511 of the 10,000 genes (45 %) are significant, and mean expression
    is uniform over its range, so the funnel has hard straight edges and the coloured
    bands are as dense as the grey cloud. That reads as synthetic, not like a DESeq2
    result → about 5–15 % significant genes and a right-skewed mean-expression distribution.
    Likely cause: the padj formula `Math.exp(-Math.abs(m) * (a + 0.3) * 0.8) * r4`
    at line 59 and the uniform `a = r1 * 6` at line 56.'
  - 'DQ-03 (both): mean expression spans only 0–6 log₂ units (baseMean of about 1–64
    counts), while a whole-transcriptome RNA-seq experiment spans about 0–15 log₂
    units → widen the A range to about 0–15 (+9). Likely cause: `a = r1 * 6` at line
    56.'
  - 'Suggestion: the smoother is a tricube-weighted local mean (local-constant), not
    local-linear LOESS, which explains the slight upturn at the left edge. A local-linear
    fit per window would match the ''LOESS trend'' legend label exactly.'
  - 'Suggestion: draw the up/down genes as two more MUI X scatter series (with a custom
    triangle marker slot) and use <ChartsLegend /> so the significant genes also get
    native hover tooltips and the legend comes from the series.'
  - 'Suggestion: label a handful of the top differentially expressed genes by name,
    which the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: title "ma-differential-expression · javascript · muix · anyplot.ai" centred at the top in dark ink (about 34 % of the width); y axis "Log₂ fold change (M)" with ticks −8 to 8; x axis "Mean expression (log₂ A)" with ticks 0 to 6; subtle horizontal grid lines; right-margin labels "log₂FC = +1" and "log₂FC = −1"; a bottom HTML legend: Not significant (grey dot), Up-regulated (green triangle), Down-regulated (red down triangle), LOESS trend (lavender line). All text is dark and readable.
      Data: about 10,000 genes. Non-significant genes are small translucent grey dots forming a dense band around M = 0. Significant genes are upward green #009E73 triangles above and downward red #AE3030 triangles below, forming a funnel that is widest (±7) at low expression and narrows to about ±1 at high expression; at higher expression the triangles fuse into solid bands. A solid ink line at M = 0, dashed lines at ±1 across the full x range, and a lavender LOESS curve lying almost on the zero line (a slight upturn at the far left).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels, tick labels, threshold labels and legend text all flip to light ink and are clearly readable; grid lines are subtle dark grey; no dark-on-dark text anywhere.
      Data: green and red triangles and the lavender LOESS curve are identical to the light render; the grey dots switch to the light inkSoft token and remain translucent; the reference lines become light dashed/solid lines and stay visible through the cloud.
      Legibility verdict: PASS
