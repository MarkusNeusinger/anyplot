review:
  strengths:
  - 'All spec Notes met: significant genes highlighted against gray, solid M = 0 line
    and dashed ±1 thresholds across the full expression range, a tricube-weighted
    local trend, and translucent points that make the dense band read as density'
  - 'Semantic Imprint use: up-regulated in brand green #009E73, down-regulated in
    the matte-red loss anchor, not-significant in the theme-adaptive muted ink, trend
    in the next free Imprint hue'
  - 'Realistic simulated RNA-seq data: 10,000 genes, gamma-distributed baseMean, standard
    error shrinking with counts, so the cloud funnels in at high expression the way
    real MA plots do'
  - 'Idiomatic MUI X v9 composition: ChartsContainer with ScatterPlot, ChartsGrid
    and axis components plus a custom overlay drawn through the useXScale/useYScale
    hooks'
  - Threshold lines labelled in a reserved right margin, clear of the data, with theme-adaptive
    soft ink
  weaknesses:
  - 'Suggestion: draw the significant genes as native scatter series with a custom
    marker slot and use ChartsLegend instead of raw SVG polygons and a hand-built
    legend, so they get MUI X tooltips and highlighting in the HTML view.'
  - 'Suggestion: label a few of the top differentially expressed genes by name, as
    the Notes allow.'
  - 'Suggestion: a slightly higher fill opacity on the down-regulated triangles would
    make them stand out more on the dark background.'
