review:
  strengths:
  - 'Clear three-level hierarchy: bold Imprint-green cumulative curve, near-transparent
    tinted individual-variance bars behind it, muted ink threshold labels'
  - Threshold labels now sit cleanly above their dashed 90 %/95 % lines, and the bars
    are named by a direct label
  - Elbow detected by maximum distance from the chord rather than hard-coded, and
    the 90 % crossing component (PC6) called out
  - Theme tokens threaded through every chrome element; both renders read correctly
    with identical data colors
  - Clean top-to-bottom R script with set.seed, prcomp/cumsum and ragg output
  weaknesses:
  - 'VQ-07 (both): the y grid lines are drawn in full-strength INK (#1A1A17 light
    / #F0EFE8 dark) and read as hard rules, against the style guide''s grid tone of
    INK at 15 % → alpha(INK, 0.15) at linewidth 0.3. Likely cause: panel.grid.major.y
    = element_line(color = INK, linewidth = 0.18) without alpha().'
  - 'SC-02 (both): the elbow is annotated at the bottom of the plot (y = 5 %) far
    from its curve marker at about 82 %, and the PC3 marker itself looks like every
    other marker (C4 asks for the elbow on the curve''s own marker) → place the ''PC3
    elbow'' label beside the PC3 marker and emphasize that marker (larger, ringed).
    Likely cause: annotate(''text'', x = elbow_pc + 0.35, y = 5, ...).'
  - 'VQ-02 (both): the ''elbow'' text overlaps the low PC4 bar (bar top near 3.6 %,
    text spanning about 0-8 %) → keep the label clear of the bars. Likely cause: the
    elbow annotate at y = 5, which the SC-02 fix moves up to the marker.'
  - 'Suggestion: annotation text at 3.8 mm (about 10.8 pt) is larger than the 10 pt
    axis titles; about 3.2 mm would keep the callouts below the axis titles in the
    hierarchy.'
  - 'Suggestion: name a concrete sensor domain in the code comments and data so the
    scenario reads less generic.'
