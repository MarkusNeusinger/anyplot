review:
  strengths:
  - Elbow drawn as a hollow ring on the curve's own PC3 marker with a green label
    beside it, a clear focal point
  - Individual-variance bars stay subordinate behind the cumulative curve and are
    named by a direct label
  - 'Theme tokens threaded through every element: grid at alpha(INK, 0.15), INK_SOFT
    dashed thresholds readable in both themes'
  - prcomp + cumsum compute the variance from a generated 3-factor dataset; threshold
    component and elbow are derived, not hard-coded
  weaknesses:
  - 'VQ-02 (both): the stacked ''95%'' and ''90%'' labels at x = 1.2 sit with their
    glyphs on the dashed lines below them, the ''95%'' top touches the 100 % grid
    line, and the ''PC6 / 90%'' call-out''s top touches the 90 % dashed line → keep
    each label clear of the lines by a few px, e.g. place them to the right edge at
    the line''s own height with vjust = -0.3 and the PC6 call-out lower (y about 82).
    Likely cause: annotate(y = 90.7 / 95.7, vjust = 0) and annotate(y = 85) for the
    call-out.'
  - 'VQ-03 (dark): the individual-variance bars for PC4-PC15 at alpha 0.13 on #1A1A17
    nearly vanish → raise the bar alpha in the dark theme (about 0.25) so all bars
    stay visible while subordinate. Likely cause: geom_col(alpha = 0.13) used for
    both themes.'
  - 'DQ-03 (code): the data comment says the elbow lies around components 5-7, but
    the computed elbow is PC3 (render and elbow_pc agree on 3) → correct the comment
    to the computed elbow. Likely cause: a stale comment above n_obs.'
  - 'Suggestion: annotation text at 3.8 mm (about 10.8 pt) is a touch larger than
    the 10 pt axis titles; about 3.2 mm would keep call-outs below the axis titles
    in the hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
