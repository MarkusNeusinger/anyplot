review:
  strengths:
  - Dual-panel figure with linkxaxes!, rowsize!(Relative) and rowgap! keeps the cumulative
    curve dominant and the individual-variance bars on their own named axis
  - Elbow detected by the maximum distance from the diagonal and marked on the curve's
    own PC5 marker in Imprint blue, echoed by a matching line in the bar panel
  - Dotted drop lines tie the 90% and 95% crossings to PC4 and PC5
  - All chrome threaded through theme tokens; data colors identical in both renders,
    no dark-on-dark text
  - PCA computed with eigen(Symmetric(C)) on the sample covariance, giving a cumulative
    curve that ends at exactly 100%
  weaknesses:
  - 'SC-03 (both): the cumulative panel labels only 0, 50 and 100 on its y axis, so
    the values of PC1-PC4 (about 38, 65, 81, 90%) cannot be read off → labelled ticks
    every 10 or 20% (for example 0:20:100). Likely cause: no yticks set on ax1, Makie''s
    default picked a 50-step.'
  - 'Suggestion: a thin ink stroke under the amber threshold lines would lift their
    1.5:1 contrast on the light page, as the style guide''s optional outline pattern
    describes.'
  - 'Suggestion: the top panel''s ''0'' tick and the bar panel''s ''40'' tick sit
    close together at the panel seam; a slightly larger row gap would separate them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title 'line-pca-variance-cumulative · julia · makie · anyplot.ai' centered in dark ink; y label 'Cumulative Variance (%)' (top), 'Individual (%)' (bottom), x label 'Number of Components'; ticks 0/50/100 (top), 0-40 (bottom), 1,4,7,...,16 (x) in soft ink; L-shaped spines, faint y-only grid. All readable.
      Data: brand green #009E73 cumulative line with small round markers from ~38% at PC1 to ~98% at PC5 then flat to 100% at PC18; amber #DDCC77 dashed lines at 90% and 95% with a faint amber band between them and right-end labels '90%' / '95%'; dotted amber drop lines at PC4 and PC5; blue #4467A3 enlarged elbow marker at PC5 with 'PC5 (elbow)' set inside the band, clear of the curve. Bottom panel: green bars 38, 26, 16, 9, 7.5% for PC1-PC5, near-zero tail, blue dashed line at PC5.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis labels and ticks flip to light ink (#F0EFE8 / #B8B7B0); grid subtle; no dark-on-dark text anywhere.
      Data: green line, markers and bars, amber thresholds and band, blue elbow marker identical to the light render; amber reads clearly on the dark surface.
      Legibility verdict: PASS
