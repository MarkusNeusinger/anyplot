review:
  strengths:
  - Dual-panel figure with linkxaxes!, rowsize!(Relative) and rowgap! keeps the cumulative
    curve dominant and the individual-variance bars on their own named axis
  - Elbow detected by maximum distance from the diagonal and marked on the curve's
    own PC5 marker in Imprint blue, echoed by a matching line in the bar panel
  - Dotted drop lines tie the 90% and 95% crossings to PC4 and PC5
  - All chrome threaded through theme tokens; data colors identical in both renders,
    no dark-on-dark text
  - PCA computed with eigen(Symmetric(C)) on the sample covariance, giving a cumulative
    curve that ends at exactly 100%
  - Cumulative panel y axis labelled every 20% (0:20:100), so each component's cumulative
    value can be read off
  weaknesses:
  - 'Suggestion: a thin ink stroke under the amber threshold lines would lift their
    low contrast on the light page.'
  - 'Suggestion: the top panel''s ''0'' tick and the bar panel''s ''40'' tick sit
    close together at the panel seam; a slightly larger row gap would separate them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title 'line-pca-variance-cumulative · julia · makie · anyplot.ai' centered in dark ink; y labels 'Cumulative Variance (%)' (top) and 'Individual (%)' (bottom), x label 'Number of Components'; top y ticks 0-100 every 20, bottom 0-40, x ticks 1,4,7,...,16 in soft ink; L-shaped spines, faint y-only grid. All readable.
      Data: brand green #009E73 cumulative line with round markers from ~38% at PC1 to ~98% at PC5, then flat to 100% at PC18; amber #DDCC77 dashed lines at 90% and 95% with a faint amber band and right-end labels '90%'/'95%'; dotted amber drop lines at PC4 and PC5; enlarged blue #4467A3 elbow marker at PC5 labelled 'PC5 (elbow)' inside the band. Bottom panel: green bars ~38, 26, 16, 9, 7.5% for PC1-PC5, near-zero tail, blue dashed line at PC5.
      Legibility verdict: PASS

