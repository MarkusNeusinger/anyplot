review:
  strengths:
  - Dual y-axis combo chart (bar + line) with left (0-55%) and right (0-110%) axis
    gridlines mathematically aligned so a single set of horizontal grid rows serves
    both scales — a meticulous, non-default detail
  - Automatic elbow-point detection (max perpendicular distance from the chord connecting
    first/last cumulative points) correctly identifies component 6 and marks it with
    a distinct diamond marker plus an 'Elbow' data label
  - 90%/95% threshold reference lines rendered as dashed plotLines with inline labels,
    directly satisfying the spec's guidance requirement
  - Individual variance bars included as the spec's suggested 'optional enhancement,'
    rendered at reduced opacity (0.55) so they read as secondary to the cumulative
    line
  - Theme-adaptive chrome correctly threaded through ANYPLOT_TOKENS; data colors are
    identical between light and dark renders, only chrome flips
  - Clean, deterministic in-memory data generation grounded in a plausible 15-sensor
    manufacturing QC scenario
  weaknesses:
  - 'Palette hard-rule violation (VQ-07): the style guide mandates the FIRST series
    always uses #009E73 (brand green) across every library/plot type, no exception
    applies here. In this implementation, the first series in the array (''Individual
    variance'', column type, line 110) uses t.palette[1] (lavender #C475FD), while
    the SECOND series (''Cumulative variance'', line type, line 124) uses t.palette[0]
    (brand green). Fix: assign t.palette[0] to the ''Individual variance'' columns
    and t.palette[1] (or another non-green slot) to the ''Cumulative variance'' line,
    OR reorder the series array so the line series is declared first — either way,
    the series that ends up first must render in #009E73.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "line-pca-variance-cumulative · javascript · highcharts · anyplot.ai" centered at top, clearly readable. Left y-axis "Individual Variance Ratio" (0-55%) and right y-axis "Cumulative Explained Variance" (0-110%) both in soft dark-gray text, fully legible. X-axis "Number of Components" (1-15) legible. Two amber dashed horizontal threshold lines labeled "90%" and "95%" are visible and readable, not overlapping each other or the data line. Legend at bottom ("Individual variance", "Cumulative variance") is readable.
      Data: Individual-variance bars are lavender/purple (t.palette[1]) at reduced opacity, descending from ~30% to ~1%. Cumulative-variance line is brand green (t.palette[0]) with circular markers, rising smoothly from ~15% to 100%, crossing the 90%/95% thresholds near components 9-11. A diamond marker with "Elbow" label highlights component 6. NOTE: the first-declared series (bars) is NOT #009E73 — the palette hard rule (first series = brand green) is violated; green is instead used on the second series (line). Flagged as a weakness.
      Legibility verdict: PASS (all text readable; the palette-order issue is a design-system compliance defect, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: White bold title, clearly visible against the dark background. Axis titles and tick labels render in light gray, fully legible — no dark-on-dark failures observed anywhere (title, axis titles, tick labels, legend, threshold-line labels, elbow label all pass contrast). Amber dashed threshold lines remain clearly visible.
      Data: Colors are identical to the light render — lavender bars, brand-green cumulative line with circular markers, diamond elbow marker — confirming only chrome flipped between themes, not data colors.
      Legibility verdict: PASS (no dark-on-dark issues found).
