review:
  strengths:
  - Real kneedle-style elbow-detection algorithm (perpendicular distance from the
    chord) rather than a hardcoded guess
  - 'Deliberate visual hierarchy: brand green for the hero cumulative curve, muted
    alpha-blended lavender bars for the secondary overlay'
  - Distinct dash patterns differentiate the 90% vs. 95% threshold lines
  - Fully theme-adaptive; Imprint data colors identical between light and dark renders
  - Idiomatic Chart.js mixed-chart construction using per-dataset type and order for
    z-index control
  weaknesses:
  - Two small utility functions (lcg, findElbowIndex) push slightly past minimal KISS
    structure, though justified by the elbow-detection requirement
  - No optional 99% threshold line included (spec listed it as optional, so not a
    compliance miss)
  - Legend swatches for dashed/dotted threshold lines render as hollow bordered boxes
    rather than visible dash strokes (Chart.js default legend-rendering quirk)
