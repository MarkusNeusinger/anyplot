review:
  strengths:
  - Composes the chart from MUI X v9 building blocks (ChartsDataProvider, ChartsWrapper,
    ChartsSurface, BarPlot, LinePlot, MarkPlot) so the optional per-component bars
    sit behind the cumulative curve and share one band x axis that starts at 1 with
    whole-number ticks
  - Threshold lines use the native ChartsReferenceLine with computed labels ('90.0%
    reached at 9 components', '95.0% reached at 11 components') that fall out of the
    data, dashed and readable in both themes
  - The elbow is detected by the chord-distance method and ringed on its own marker
    at 6 components with a value label, using the useXScale/useYScale hooks for exact
    placement
  - Bars are lavender at 0.55 opacity, clearly subordinate to the 3.5 px Imprint-green
    curve, and both are named in a legend whose glyphs (square, line+mark) match the
    marks
  - Library-native axis tooltip and ChartsAxisHighlight add per-component inspection
    in the HTML output; skipAnimation is set on every plot
  weaknesses:
  - 'Suggestion: the subtitle could state the selection result (for example the components
    needed for 95 %) instead of the largest and smallest single shares, so the header
    carries the chart''s conclusion.'
  - 'Suggestion: the elbow ring and its label could use the curve''s green or a heavier
    weight to tie the annotation to the series it marks.'
