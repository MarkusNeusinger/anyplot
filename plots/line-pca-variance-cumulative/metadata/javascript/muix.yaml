review:
  strengths:
  - Threshold lines use native ChartsReferenceLine children whose labels state the
    component count at which 90 % (9) and 95 % (11) are reached, computed from the
    data
  - The elbow is detected with a max-distance-to-chord rule and ringed on the curve's
    own marker at 6 components via a useXScale/useYScale composition child
  - Monotone interpolation keeps the cumulative curve non-decreasing with no overshoot;
    prominent markers at all 16 whole-number component counts
  - 'Theme tokens threaded through every chrome element: both renders are fully readable,
    data colours identical'
  - Legend glyphs restyled with data-series selectors to match the filled cumulative
    marker and the dashed secondary line
  - 'Library-native interactivity: per-series valueFormatter gives percentage tooltips
    in the HTML view'
  weaknesses:
  - 'SC-01 (both): the optional individual-variance overlay is drawn as a dashed lavender
    line with markers, not as the secondary bar overlay the Notes allow → draw the
    per-component ratios as subordinate bars behind the cumulative curve, or leave
    the overlay out. Likely cause: the second LineChart series `individual` instead
    of a bar series in a ChartContainer composition.'
  - 'VQ-06 (both): the only y-axis title reads ''Cumulative explained variance (%)''
    while the per-component series, which is not cumulative, is plotted on the same
    axis → an axis title that covers both series (e.g. ''Explained variance (%)'')
    or the per-component series on its own named axis. Likely cause: yAxis label built
    as `Cumulative ${RATIO}` for a shared axis.'
  - 'Suggestion: the mandated title at 22 px fills only about 45 % of the width; 24–26
    px would give the header more presence.'
