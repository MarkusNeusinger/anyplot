review:
  strengths:
  - Reference-line labels are computed from the actual data ("90% → 9 components")
    rather than hard-coded — genuine data storytelling that directly answers the plot's
    purpose
  - Explicit font sizing throughout, redundant line-style encoding (solid vs. dashed)
    alongside color for accessibility
  - Both themes render correctly with identical data colors and fully legible chrome
  - Realistic, neutral sensor-PCA data scenario with correctly summing variance ratios
  weaknesses:
  - 'Second series color skips a palette slot: uses t.palette[2] (blue) instead of
    the canonical next position t.palette[1] (lavender) — fix by using palette positions
    in order for the two series'
  - Y-axis label "Explained Variance" doesn't include a unit suffix like "(%)" even
    though the axis ticks are formatted as percentages
  - The spec's suggestion to mark/annotate the elbow point isn't implemented as its
    own explicit annotation (the 90%/95% threshold lines are a reasonable partial
    substitute, but a dedicated elbow marker would fully satisfy this note)
