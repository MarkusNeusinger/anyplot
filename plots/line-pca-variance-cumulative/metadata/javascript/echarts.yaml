review:
  strengths:
  - 'Comprehensive feature coverage: cumulative line, individual-variance bar overlay,
    90%/95% dashed threshold lines, and an algorithmically-detected elbow marker (perpendicular-distance-from-chord
    heuristic) — hits every spec requirement including the optional secondary bar
    overlay.'
  - 'Idiomatic ECharts composition: a line+bar dual series sharing one axis, markLine
    for the threshold references, and markPoint for the elbow annotation — genuine
    library mastery rather than a bare line chart.'
  - 'Clean theme-adaptive chrome: hidden y-axis line, hidden x-axis ticks/splitLine,
    subtle horizontal-only gridlines, and a consistent Imprint green (#009E73) for
    the primary series identical across both renders.'
  - Deterministic, realistic synthetic data (a 15-sensor industrial monitoring PCA
    spectrum with geometric eigenvalue decay) that sums to 100% and produces a plausible,
    visually clear elbow.
  weaknesses:
  - Threshold labels ("90% threshold" / "95% threshold") are set at fontSize 13, the
    smallest text on the chart — borderline legibility once scaled down to a ~400px
    mobile thumbnail; bump to 14-15pt to match the rest of the chrome.
  - Individual-variance bars for components ~10-15 shrink to near-invisible slivers
    on the shared 0-100% axis — consider a minimum-visibility treatment so the secondary
    series still reads at a glance that far along the tail.
  - The elbow marker (hollow ring, markPoint) sits directly on top of the identical-color
    data marker at the same point, creating a slightly redundant double-circle look
    — a small offset or distinct fill would read cleaner.
  - Aesthetic treatment leans on default Imprint tokens without much extra customization
    (e.g. no area-fill under the curve, no distinct end-of-series callout) — solid
    but not exceptional visual differentiation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light surface.
      Chrome: Title "line-pca-variance-cumulative · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Legend ("Cumulative variance" line swatch, "Individual variance" bar swatch) below the title. Axis names "Number of Components" (x) and "Explained Variance" (y) in dark ink; tick labels in a softer gray-brown. Two dashed horizontal reference lines labeled "90% threshold" and "95% threshold" near the top of the plot area. All chrome is clearly legible against the light background.
      Data: Cumulative variance line in Imprint green (#009E73) with circular markers at all 15 components, rising from ~23% to 100%. A hollow-ring "Elbow (n=6)" marker sits on the curve at component 6 (~80%). Individual-variance bars in a muted gray with reduced opacity sit beneath the line, decreasing from ~23% at component 1 to near-zero past component 10.
      Legibility verdict: PASS — no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark surface.
      Chrome: Same title, legend, and axis structure as the light render, now rendered in white/light-gray ink against the dark background. Threshold lines and their labels remain dashed light-gray, clearly visible. Tick labels are a lighter warm gray, easily distinguishable from the background.
      Data: The cumulative-variance line, markers, and elbow annotation are the identical Imprint green (#009E73) and white-ring styling as the light render — only the chrome (background, text, grid, bar fill tone) has flipped, as required. Individual-variance bars are a mid-gray, visible against the dark background with no dark-on-dark issue.
      Legibility verdict: PASS — all text (title, axis names, tick labels, legend, threshold labels, elbow annotation) is clearly readable; no dark-on-dark failures observed.
