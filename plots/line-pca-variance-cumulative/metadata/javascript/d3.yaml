review:
  strengths:
  - 'Complete feature coverage: cumulative % curve, 90%/95% dashed threshold lines
    with inline crossing-count labels, ring-marker callouts at each crossing, an automatically
    detected (Kneedle heuristic) elbow annotation, and an optional scree-bar overlay
    for individual variance — every spec requirement plus the optional enhancement
    is present.'
  - Threshold labels are folded directly into the line text ("95% threshold (n=15)")
    instead of a separate floating label or legend, which avoids clutter and collisions
    near the closely spaced 90/95 lines.
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    grid, text, axis domain) flips, exactly per the theme-adaptive contract.
  - 'Realistic, neutral data story: a 22-channel industrial sensor array with correlated
    channel groups producing a textbook PCA decay/elbow shape, deterministic via a
    fixed-seed LCG.'
  - 'Idiomatic D3: proper data joins (`selectAll().data().join()`) for bars/points/circles,
    d3-shape line generator, d3-array cumulative sum, and manual tick filtering to
    avoid x-axis crowding at n=22.'
  weaknesses:
  - The gray scree bars (individual variance per component) have no legend or inline
    label distinguishing them from the green cumulative line — a first-time viewer
    has to infer what the secondary bars represent. Consider a small muted-color legend
    entry or a short axis-adjacent caption.
  - In the dark render, the scree bars (t.inkSoft at opacity 0.25) are noticeably
    fainter than in the light render, especially for higher component counts where
    bars are already tiny — bump opacity slightly (e.g. 0.3-0.35) for the dark theme
    to keep the secondary encoding equally legible in both themes.
  - Typography relies on the default sans-serif stack throughout; a touch more weight/size
    differentiation between the elbow annotation and axis tick labels would sharpen
    the tertiary-vs-secondary text hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Sensor Array PCA · line-pca-variance-cumulative · javascript · d3 · anyplot.ai" centered at top, clearly readable. X-axis "Number of Principal Components" and Y-axis "Cumulative Explained Variance (%)" labels in medium-gray ink, tick labels (1-22, 0%-100%) crisp against the light surface. Subtle horizontal-only gridlines. Amber dashed threshold lines at 90% and 95% each labeled with their crossing component count ("90% threshold (n=12)", "95% threshold (n=15)"). Italic tertiary annotation "elbow ≈ 9 components" near the curve's bend.
      Data: Brand-green (#009E73) line with matching filled circular markers at all 22 discrete component counts — the primary cumulative-variance series. Muted light-gray bars behind it show the individual (per-component) variance on the same 0-100% scale. Two black-stroked open rings highlight the exact points where the curve crosses 90% (n=12) and 95% (n=15).
      Legibility verdict: PASS — all text is dark-on-light and clearly legible; amber threshold labels have good contrast against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in near-white ink, still centered and fully legible. Axis labels and tick labels rendered in light gray, clearly visible against the dark surface. Gridlines and axis domain lines flipped to light, low-opacity strokes. Threshold and elbow annotation text unchanged in role, rendered in amber/muted-light tones, both readable.
      Data: The cumulative-variance line and markers are the identical #009E73 green as the light render — confirmed unchanged. The 90%/95% dashed threshold lines are the same amber hex. The threshold-crossing ring markers are stroked in light ink (theme-adaptive) rather than black, appropriately flipped. No dark-on-dark or light-on-light failures detected anywhere; the muted scree bars are visible but noticeably fainter than in the light render (see weaknesses).
      Legibility verdict: PASS — all text and data elements remain distinguishable from the near-black background; only the secondary scree-bar contrast is a soft weakness, not a legibility failure.
