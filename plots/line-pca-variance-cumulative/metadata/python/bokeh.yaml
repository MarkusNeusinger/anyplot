review:
  strengths:
  - Real scikit-learn Wine PCA gives an authentic steep-then-flat cumulative curve
    that reaches exactly 100%
  - Threshold crossings are computed from the data and emphasized with color-matched
    markers, halos and value callouts
  - 'Idiomatic Bokeh: ColumnDataSource field references, Band for the area under the
    curve, Span thresholds, HoverTool in vline mode restricted to the cumulative line'
  - Fully theme-adaptive chrome with dark-tuned bar opacity; Imprint palette in canonical
    order
  weaknesses:
  - 'Suggestion: the ''8 components (92.0%)'' callout sits about one component and
    15 points away from its marker; placing it next to the blue marker would tie them
    together more directly.'
  - 'Suggestion: the band starts and ends at the first and last component, so the
    first and last bars show a two-tone split; starting the band at the bar edge or
    keeping bars outside it would look cleaner.'
  - 'Suggestion: a kneedle-style detection could mark an elbow on its own marker where
    one is detectable.'
