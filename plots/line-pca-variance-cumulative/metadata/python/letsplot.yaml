review:
  strengths:
  - Real scikit-learn digits PCA (64 pixel features, first 30 components) gives a
    genuine long, flat approach toward full variance
  - 'Semantic threshold colors: amber caution at 90%, matte red target at 95%, each
    labelled and followed by a dotted drop line at the component count that first
    reaches it'
  - Elbow marked by an ink ring around the curve's own green marker with a clear offset
    'PC 10' label
  - Native layer_tooltips() hover shows component, cumulative and individual variance
    in the HTML output
  - Theme-adaptive chrome correct in both renders; bar alpha tuned per theme keeps
    the overlay subordinate
  weaknesses:
  - 'VQ-01 (light): the amber ''90%'' threshold label (#DDCC77, about 1.5:1 on #FAF8F1)
    reads faint on the light page → a text color with at least 3:1 on the page (the
    line itself can stay amber). Likely cause: geom_text color=ANYPLOT_AMBER for the
    90% label in both themes.'
  - 'SC-04 (both): the individual-variance bars are named neither in a legend nor
    on an axis — the y-axis title names only the cumulative series, so a reader cannot
    tell what the grey bars measure (C5) → name them, e.g. a two-entry legend or a
    y title covering both layers. Likely cause: geom_bar with a fixed fill and no
    key, labs(y=CUMULATIVE).'
  - 'Suggestion: the bars'' default white outline reads bright on the dark page; an
    outline from the page color would keep them quieter.'
