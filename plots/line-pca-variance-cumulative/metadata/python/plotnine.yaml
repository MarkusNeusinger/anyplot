review:
  strengths:
  - Real Wine-dataset PCA computed with scikit-learn; deterministic, and the elbow
    (2 components, 55.4%) and threshold crossings fall out of the computation
  - 'Clean layered plotnine grammar: per-layer data frames for the elbow and threshold
    labels, one vector geom_hline for all three thresholds'
  - Hollow page-filled markers and a red elbow marker with dotted drop-line give a
    clear focal point; bars stay subordinate behind the curve
  - Theme-correct chrome in both renders with an L-shaped axis frame and only a subtle
    horizontal grid
  - Threshold labels placed in the left gutter, clear of all data marks
  weaknesses:
  - 'VQ-01 (both): the threshold labels ''90%'', ''95%'', ''99%'' at geom_text size=5.5
    and the elbow annotation at size=6 sit below the 8 pt tick-label reference and
    read small beside the 8 pt ticks → about 8 pt (+2.5 pt and +2 pt). Likely cause:
    geom_text(size=5.5) and geom_text(size=6.0).'
  - 'SC-02, SC-04 (both): the translucent individual-variance bars are named nowhere
    (no legend entry, no label, no own axis) on a y axis titled ''Cumulative Explained
    Variance (%)'', so a reader cannot tell what they show (spec bullet C5) → name
    them, e.g. a direct label ''Individual variance per component'' near the first
    bar or a fill legend entry. Likely cause: geom_col(..., show_legend=False) with
    no mapping or annotation.'
  - 'Suggestion: a plotnine-specific touch (e.g. a mapped fill with scale_fill_manual
    giving the bars and curve a two-entry legend) would show more of the library than
    generic layering.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'line-pca-variance-cumulative · python · plotnine · anyplot.ai' left-aligned in dark ink (~62% width); axis titles 'Number of Principal Components' and 'Cumulative Explained Variance (%)' and ticks 1-13 / 0%-100% in dark ink, all readable. Left and bottom axis lines only, subtle horizontal grid. Three grey dashed threshold lines at 90/95/99% labelled '90%', '95%', '99%' in small muted text at the left, above each line.
      Data: #009E73 cumulative line with hollow page-filled ring markers at each of 13 components; pale green translucent bars for individual variance (36%, 19%, 11% ... <1%); large #AE3030 elbow marker at component 2 (55.4%) with a dotted red drop-line to 0 and a bold red 'Elbow: 2 components (55.4%)' label below-right, clear of the curve.
      Legibility verdict: PASS (threshold and elbow labels small but readable)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light ink, ticks in light grey; all readable, no dark-on-dark text. Threshold lines and labels in light grey remain visible.
      Data: green line/markers and red elbow identical to light; ring markers filled with the dark page; bars render as dim dark-green translucent columns, still visible.
      Legibility verdict: PASS
