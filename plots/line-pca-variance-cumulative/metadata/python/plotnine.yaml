review:
  strengths:
  - 'Real Wine-dataset PCA computed with scikit-learn: the elbow (2 components, 55.4%)
    and threshold crossings fall out of the computation'
  - 'Clean layered plotnine grammar: per-layer data frames for the elbow, bar name
    and threshold labels, one vector geom_hline for all three thresholds'
  - Hollow page-filled ring markers and a red elbow marker with a dotted drop-line
    give a clear focal point while the translucent bars stay subordinate behind the
    curve
  - All annotation text (threshold labels 8 pt, elbow label 8.5 pt bold) matches the
    tick-label scale and reads cleanly in both themes
  - The individual-variance bars are named by a direct label, so every mark on the
    chart is explained without a legend
  weaknesses:
  - 'Suggestion: a mapped fill with scale_fill_manual giving the curve and the bars
    a two-entry legend would show plotnine''s scale system instead of a free-floating
    bar label.'
  - 'Suggestion: the bar name could sit nearer the tallest bars at components 1-3
    so the eye links label and bars faster.'
