review:
  strengths:
  - Real PCA on the standardized scikit-learn wine dataset, computed in the script,
    so every cumulative value and threshold crossing is genuine
  - 'Clean theme adaptation: every chrome element (title, ticks, spines, grid, legend
    frame, callout boxes) uses the theme tokens; both renders fully legible'
  - Threshold lines in Imprint positions 2 and 3 with color-matched crossing diamonds
    and read-out callouts answer the component-selection question directly
  - Elbow detected from the second difference of the cumulative curve and marked on
    the curve's own PC2 point
  - matplotlib path-effect halo and open page-filled markers keep the cumulative line
    dominant over the subordinate bar overlay
  weaknesses:
  - 'VQ-02 (both): the ''8 components → 90%'' callout box sits on the cumulative curve
    between PC5 and PC6 (box spans about 80–85 % at x≈4.5–6.5) and the legend box
    covers the individual-variance bars of PC11–PC13 → keep both boxes clear of curve
    and bars, e.g. place the 90% callout below the curve to the right (around x≈9,
    y≈0.80) and the legend at loc=''center right'' in the empty area under the curve
    tail. Likely cause: text_x = n_comp - 3.5, text_y = t - 0.07 for i == 0, and ax.legend(loc=''lower
    right'').'
  - 'SC-02 (both): C2 asks for a clear marker at every component count, but the PC6
    marker is hidden behind the 90% callout box (only its top edge shows) → every
    marker visible. Likely cause: the same 90% callout position (text_x = n_comp -
    3.5).'
  - 'Suggestion: label the y axis ''Cumulative Explained Variance'' so the axis itself
    names the cumulative quantity, not only the legend.'
