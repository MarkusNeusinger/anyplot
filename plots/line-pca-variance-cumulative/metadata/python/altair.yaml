review:
  strengths:
  - 'Real PCA of the scikit-learn wine dataset: deterministic, neutral and scientifically
    grounded'
  - Elbow detected by the kneedle distance and marked with a red triangle on the curve's
    own PC 5 marker
  - Threshold crossings computed with searchsorted and called out as '8 components'
    / '10 components' in the threshold's own color
  - Altair-native nearest-point hover (selection_point + transform_filter rule + alt.condition
    highlight) for the HTML view
  - Fit autosize fills the 3200x1800 canvas with balanced title, axes and legend in
    both themes
  - Theme tokens threaded through title, axes, legend frame and marker outlines; Imprint
    palette correct
  weaknesses:
  - 'Suggestion: the crossing diamonds and the elbow triangle use Vega-Lite''s default
    point opacity, so the 95 % diamond blends with the green marker beneath into olive
    rather than the ochre of its line and label; opacity=1 on those marks would match
    them.'
  - 'Suggestion: x_enc and x_axis (and y_enc / y_axis) repeat the same field, title
    and scale; one encoding each with the axis settings would be shorter.'
