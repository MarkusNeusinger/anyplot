review:
  strengths:
  - Real PCA on the standardized sklearn wine dataset, with threshold crossings and
    the elbow computed from the data rather than placed
  - Dotted drop lines from the 90% and 95% crossings to PC8 and PC10 read the component-selection
    answer straight off the x axis
  - Elbow marked by a hollow diamond on PC4's own marker with an arrowed callout on
    an elevated-surface box
  - Theme tokens threaded through every chrome element; categorical data colors identical
    in both renders
  - Legend placed in the empty band between the bars and the curve, clear of all data
  - Per-trace hovertemplates give component-level readouts in the interactive HTML
  weaknesses:
  - 'VQ-02 (both): the elbow callout box sits on top of the 90% and 95% dashed reference
    lines between about PC2 and PC4, hiding a segment of both → place the callout
    where it covers no line or mark, e.g. below-right of the curve in the empty area
    above the bars. Likely cause: add_annotation ax=-65, ay=-55.'
  - 'VQ-01 (light): the ''90%'' threshold label is drawn in amber #DDCC77 on the #FAF8F1
    page at about 1.5:1 contrast and reads faint → draw the label text in INK_SOFT
    (keep the amber line) or a darker text color. Likely cause: annotation_font color=AMBER
    on the 90% add_hline.'
  - 'Suggestion: a 99% reference line, which the Notes allow, would show the cost
    of retaining nearly all variance.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'line-pca-variance-cumulative · python · plotly · anyplot.ai' centered in dark ink; axis titles 'Principal Component' / 'Explained Variance (%)' in dark ink; ticks 1-13 and 0-100 in soft ink, all readable. Subtle y-only grid. Legend box (elevated fill, soft border) at right-middle, in the empty band between bars and curve. '95%' label in red at top-left, '90%' label in amber at top-right — the amber label reads faint on the light page.
      Data: brand green #009E73 cumulative spline line with 13 circular markers rising from ~36% to 100%; translucent Imprint-blue bars for individual variance behind it; dashed amber 90% and red 95% lines with dotted drop lines at PC8 and PC10; hollow purple diamond on PC4 with an arrowed callout 'Elbow — PC4 / 74% variance' whose box covers a segment of both threshold lines.
      Legibility verdict: PASS (amber 90% label faint but legible)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles in light ink; ticks and legend text in soft light ink, all readable; no dark-on-dark text. Legend box in elevated #242420 with light border.
      Data: green line, purple elbow, amber and red thresholds identical to the light render; bars drawn at higher alpha (0.45) and visible down to PC13; '90%' amber label reads well here.
      Legibility verdict: PASS
