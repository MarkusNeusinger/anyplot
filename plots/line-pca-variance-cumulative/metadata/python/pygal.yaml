    the individual-variance series cannot be read off an axis and the 90/95% lines
    are only identified through the legend → numeric tick labels on both axes. Likely
    cause: value_formatter=lambda x: '''' also blanks the axis labels.'
  - 'VQ-01 (dark): the value and annotation labels (''36.7%'', ''Elbow (75%)'', ''90%:
    n=7'') render near-black on the dark green fill and the #1A1A17 page → light text
    from the INK token. Likely cause: Style without value_colors, so pygal''s default
    dark value color is kept.'
  - 'VQ-02 (both): the ochre individual-variance line passes through its own ''11.3%''
    value label at PC3 → label clear of the line. Likely cause: print_values_position=''top''
    with the cubic-interpolated line descending through the label box.'
  - 'Suggestion: the individual variance could be drawn as subordinate bars behind
    the curve.'
