  strengths:
  - Cumulative line and per-component bars share seaborn's categorical positions,
    so every hollow marker sits exactly at its component count and the amber spotlight
    lands on the curve's own marker at 4 components
  - 'All five ''A good version shows'' properties met: monotonic cumulative curve,
    marker per count from 1 with whole-number ticks, labelled dashed 90/95% lines,
    marked 95%/elbow crossing, subordinate bars named in the legend'
  - One amber thread (95% line, label, spotlight, annotation box) builds a clear focal
    point against the green curve
  - Clean theme adaptation through a sns.set_theme rc dict; both renders theme-correct
    with identical data colors
  - Marker styling passed directly to sns.lineplot; readable top-to-bottom script
    with adaptable column constants
  weaknesses:
  - 'VQ-01 (light): the bold ''95%'' threshold label and the ''4 components explain
    98.6%'' annotation text are set in amber #DDCC77, about 1.5:1 against the #FAF8F1
    page and the #FFFDF6 box, and read faint → set the text in INK (keep amber for
    the box edge, arrow and line) or another color with at least 3:1 on the light
    page. Likely cause: color=ANYPLOT_AMBER on the text of both ax.annotate calls.'
  - 'Suggestion: a slightly heavier dash on the 90% line would let it read as firmly
    as the 95% line in the dark render.'
