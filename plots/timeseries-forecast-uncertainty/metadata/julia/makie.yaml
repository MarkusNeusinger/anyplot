review:
  strengths:
  - Nested 80%/95% confidence bands with thin edge-stroke lines that clearly distinguish
    the band boundaries from each other, on top of the semi-transparent fills
  - Vertical dotted marker plus a 'Forecast start' text callout gives a clean, unambiguous
    historical/forecast transition point
  - Uncertainty spread grows realistically with the forecast horizon (spread_80/spread_95
    scale with horizon), which is the core storytelling requirement of this spec
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, all chrome
    (title, ticks, grid, legend) readable in both themes, data colors identical across
    themes'
  - Clean, flat, single-script implementation using idiomatic Makie primitives (band!,
    lines!, vlines!, text!, axislegend) with the current `size` API rather than the
    deprecated `resolution` kwarg
  - Title matches the mandated format exactly and canvas lands precisely on 3200×1800
    (landscape)
  weaknesses:
  - 'Forecast line and both confidence bands use IMPRINT_PALETTE[3] (blue, #4467A3)
    instead of the canonical second series slot IMPRINT_PALETTE[2] (lavender, #C475FD).
    Blue-for-forecast isn''t a strong enough widely-shared real-world association
    (unlike blood→red or sky→blue) to justify skipping the ordinal palette order —
    switch the forecast line and both band!/lines! calls to IMPRINT_PALETTE[2].'
  - X-axis label reads 'Month' but the tick labels actually show formatted calendar
    dates (yyyy-mm) spanning three-plus years — 'Date' would describe the axis more
    accurately.
  - 'Design polish is solid but not exceptional: the spine/grid treatment is mostly
    baseline theme compliance rather than distinctive refinement beyond the nice band
    edge-stroke touch.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "timeseries-forecast-uncertainty · julia · makie · anyplot.ai" in bold dark ink, clearly visible; "Month" x-axis label and "Sales (units)" y-axis label in dark ink; rotated x tick labels (yyyy-mm dates from 2023-01 to 2026-06) and y tick labels (900-1600) in a softer dark gray; horizontal/vertical gridlines are faint but visible; top/right spines removed; legend (top-left, no frame) lists "95% interval", "80% interval", "Historical", "Forecast" in soft dark text.
      Data: Solid green (#009E73) historical line from 2023-01 through late 2025, a vertical dotted marker with a "Forecast start" callout at the transition, then a dashed blue forecast line with two nested semi-transparent blue bands (darker/narrower 80% band inside a lighter/wider 95% band) that widen progressively toward the end of the 6-month horizon.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now in light/white text, clearly visible; axis labels in light ink; tick labels in a lighter gray-white tone, all legible against the dark background; gridlines remain faint but visible; legend text renders in light gray, readable against the dark panel.
      Data: Historical line is the identical brand green (#009E73), forecast line and bands use the identical blue (#4467A3) at the same alpha levels as the light render — only the chrome (background, text, grid) flipped, confirming the data-color-consistency requirement.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title/axis/tick/legend element is clearly visible against the dark panel, and the brand green remains vivid on the dark surface.
