  strengths:
  - 'All required spec features present: solid historical line, dashed forecast line,
    dotted vertical marker at forecast start, and nested 80%/95% confidence bands
    via alpha-blended fills'
  - Theme-adaptive chrome correctly threaded through Axis (title, labels, ticks, spines,
    grid) — both light and dark renders are fully legible with no dark-on-dark or
    light-on-light failures
  - 'First series is brand green #009E73 (Historical) with forecast/bands in Imprint
    blue (#4467A3), consistent color family and CVD-safe per the palette'
  - Canvas lands exactly on 3200x1800 with px_per_unit=2, title format matches the
    mandated `{spec-id} · {lang} · {lib} · anyplot.ai` convention
  - 'Idiomatic Makie usage: band!() for nested intervals, vlines!() for the forecast-start
    marker, manually positioned/rotated date xticks, axislegend with frame disabled'
  - 'Realistic synthetic data: 3 years of monthly sales with trend + seasonality +
    noise, 6-month forecast with growing uncertainty spread — plausible and neutral'
  weaknesses:
  - '`using Statistics` is imported but never called anywhere in the script (no mean/std/cor
    usage) — remove the unused import (CQ-03).'
  - 'Design Excellence is generic: the implementation applies the required theme tokens
    correctly but adds no bespoke polish beyond that baseline (e.g. no annotation
    labeling the forecast-start line, no data-driven emphasis at the transition point,
    bands share a single hue at two alphas rather than any additional visual distinction)
    — consider a small text annotation near the vlines! marker (e.g. ''Forecast start'')
    to sharpen the storytelling focal point.'
  - 'Library Mastery is only baseline-idiomatic: band!/vlines!/axislegend are used
    correctly but the implementation doesn''t showcase a more distinctive Makie capability
    (e.g. custom legend entry ordering, annotate!/text! callout, or a two-band stroke
    to visually separate the 80% and 95% edges) — LM-02 scored low as a result.'
