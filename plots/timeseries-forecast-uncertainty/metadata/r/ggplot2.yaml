review:
  strengths:
  - The forecast line starts at the last observation, so the dashed purple forecast
    visibly picks up where the solid green history ends (both renders)
  - Nested geom_ribbon bands in one Imprint hue (#C475FD) with per-theme alpha keep
    the 80% band darker inside the lighter 95% band in both themes, and the dashed
    forecast stays visible through them
  - Named literal mappings (fill = "95% CI", color = "Forecast") with scale_fill_manual/scale_color_manual
    breaks give one top legend that identifies history, forecast and both confidence
    levels
  - 'Theme tokens threaded through every chrome element; text sizes at the style-guide
    reference (12/10/8 pt), all readable on #FAF8F1 and #1A1A17'
  - 'Statistically sound bands: qnorm(0.9)/qnorm(0.975) bounds around a sqrt(horizon)
    standard error, deterministic with set.seed(42)'
  weaknesses:
  - 'Suggestion: the legend groups swap order between the renders (bands first in
    light, lines first in dark); fixing the guide order with guides(color = guide_legend(order
    = 1), fill = guide_legend(order = 2)) would keep them consistent.'
  - 'Suggestion: y tick labels such as 80000 would read faster with thousands separators
    or a dollar format (scales::label_dollar()).'
  - 'Suggestion: the 95% band at alpha 0.10 on the light page is faint; a slightly
    higher light-theme alpha would give it more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: title "timeseries-forecast-uncertainty · r · ggplot2 · anyplot.ai" in dark ink at top-left (~58% of width); axis titles "Date" and "Monthly Sales ($)" in dark ink; year ticks 2022–2025 and y ticks 60000/70000/80000 in soft grey; thin horizontal y-grid only; top legend "95% CI, 80% CI, Historical, Forecast" in soft grey. All readable.
      Data: solid green #009E73 history line (Jan 2022–Dec 2024, ~52k rising to ~70.5k), dashed purple #C475FD forecast starting at the last observation and running to Jun 2025, nested purple bands (80% darker inside the lighter 95%) widening with horizon, dotted grey vertical line at Dec 2024 marking the forecast start.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, ticks and legend text in light grey, y-grid in light grey; no dark-on-dark text. Legend order here is Historical, Forecast, 95% CI, 80% CI.
      Data: identical hues — green #009E73 history, purple #C475FD dashed forecast; bands use higher alpha so the 95% band reads as muted plum and the 80% band as brighter violet, clearly told apart; dotted light-grey vertical marker.
      Legibility verdict: PASS
