review:
  strengths:
  - 'All five characteristic properties shown: solid green history, dashed lilac forecast
    continuing from it via a dotted bridge, dashed forecast-start line, nested 80
    %/95 % bands (darker inside lighter), legend naming all four'
  - Band opacities (0.18 / 0.38) keep the two confidence levels distinct and the forecast
    line visible through them in both themes
  - Theme tokens threaded through every chrome element — both renders fully legible,
    data colors identical across themes
  - 'Idiomatic plotly: fill=''toself'' polygons for bands, paper-referenced shape
    and annotation, date-formatted hovertemplates and unified x hover for the HTML
    view'
  - Concrete, neutral battery-capacity-fade scenario with an exponential-decay shape
    and horizon-dependent uncertainty
  weaknesses:
  - 'VQ-02 (both): the dashed forecast-start line reaches y=1 (paper) and runs up
    through the ''Forecast start'' label centred on it at y=1.02, cutting between
    its letters → line ends below the label, or the label sits clear of the line (e.g.
    xanchor=''left'' with a small x shift). Likely cause: add_shape y1=1 together
    with add_annotation x=forecast_start, y=1.02, centred.'
  - 'VQ-05 (both): the 28 px title spans about 91 % of the canvas width, past the
    ~90 % bound with only ~4 % margin each side → about 75-85 % (about 24-26 px, -2
    to -4 px). Likely cause: title font size=28.'
  - 'CQ-01 (code): two helper functions, rgba() (lines 28-30) and band() (lines 78-87),
    break the flat Imports -> Data -> Plot -> Save structure → inline the two band
    traces and write the two fill colors as rgba string constants. Likely cause: band
    construction factored into a function.'
  - 'Suggestion: a fade plateauing near 62 % sits below the commonly cited 80 % end-of-life
    range; a gentler decay would keep the battery story closer to typical field data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, plot and paper alike
      Chrome: centred title 'timeseries-forecast-uncertainty · python · plotly · anyplot.ai' in dark ink; x-axis 'Month', y-axis 'Battery capacity (% of rated)'; Jan 2022 to Jul 2025 and 60-100 tick labels in soft dark grey; subtle y grid; bordered legend lower left on #FFFDF6; 'Forecast start' label above the dashed grey vertical line at Jan 2025 (the line runs into the label). All readable.
      Data: solid #009E73 history decaying from 100 to ~68 %, dotted green bridge to the dashed #C475FD forecast ending ~66 %; 80 % band lilac (alpha 0.38) inside the paler 95 % band (alpha 0.18), both visible
