review:
  strengths:
  - Observed and forecast are melted into one long frame and mapped to both color
    and linetype, so plotnine merges them into a single legend whose Forecast key
    is itself dashed, matching the line on the chart
  - 'Nested 80%/95% ribbons in one Imprint hue (#4467A3) at two alpha levels: the
    narrower band is visibly darker, both stay apart in the legend and in both themes,
    and the forecast line and grid show through'
  - The forecast and its bands start at the last observed week, so the forecast picks
    up exactly where the history ends with zero initial uncertainty
  - Weekly website-traffic scenario with a visible campaign step change and a damped-growth
    forecast; 104 + 16 weeks sits inside the spec's size range
  - 'All chrome is threaded through theme tokens (INK, INK_SOFT, INK_MUTED, ELEVATED_BG)
    and reads cleanly on both #FAF8F1 and #1A1A17'
  - 'The data block follows the adaptable-code contract: one column constant per role,
    a single tidy df, everything else derived below it'
  weaknesses:
  - 'Suggestion: the 45° rotation on only five x tick labels (''Jan 2023'' … ''Jan
    2025'') is not needed at this width; horizontal labels would read more easily.'
  - 'Suggestion: the gap between the top legend and the panel is wider than the gap
    between subtitle and legend; tightening it would give the data more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 for page and panel.
      Chrome: title "timeseries-forecast-uncertainty · python · plotnine · anyplot.ai" in dark ink, muted subtitle "Weekly traffic after the campaign step change; bands widen with forecast horizon", top legend on an elevated off-white strip (Observed solid green, Forecast dashed purple, "Confidence band" with 80% and 95% interval swatches), y title "Website visits (thousand per week)", x title "Week", tick labels Jan 2023 to Jan 2025 rotated 45°, a dashed INK_SOFT vertical line at the forecast start with a small muted "Forecast →" label. Everything readable.
      Data: Observed line in #009E73 from about 39k to about 50k, a step to about 75–80k in spring 2024, then a slow drift down to about 70k before rising to 80k; dashed #C475FD forecast rising from 80k to about 91k over 16 weeks; nested #4467A3 ribbons starting at zero width and widening to about 79–103k (80%) and 72–110k (95%), the 80% band visibly darker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels, legend text and the "Forecast →" label switch to light ink tokens; legend strip on #242420; vertical divider in light grey. No dark-on-dark text.
      Data: same green, purple and blue as the light render; the 95% ribbon is subtle on the dark surface but still distinct from the 80% ribbon and the background.
      Legibility verdict: PASS
