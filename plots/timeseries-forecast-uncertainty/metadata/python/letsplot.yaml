review:
  strengths:
  - 'All four required legend roles present: Historical, Forecast, 80% CI and 95%
    CI, built by mapping fill and alpha to the band column'
  - Theme-correct chrome in both renders with identical data colors; dark theme raises
    band alpha so the two bands stay apart
  - Dual encoding of history vs forecast (green solid vs purple dashed) and a dotted
    forecast-start marker at Jan 2026
  - layer_tooltips() gives formatted MWh hover values in the HTML output
  weaknesses:
  - 'DE-02 (both): all four panel spines are drawn, a full box around the panel where
    the plot type needs none → only the left and bottom axis lines. Likely cause:
    panel_background=element_rect(fill=PAGE_BG) keeps the default border color; set
    color=PAGE_BG or panel_border=element_blank().'
  - 'VQ-03 (both): the 80% CI and 95% CI legend swatches have a thick dark INK_SOFT
    outline that the outline-free ribbons do not have → swatches without an outline,
    matching the bands. Likely cause: geom_ribbon size=0 does not reach the legend
    key; set color=None/''transparent'' on the ribbons or override the key outline.'
  - 'Suggestion: theme the legend keys (legend_key fill = ELEVATED_BG) so the Historical
    and Forecast line keys do not sit on visibly different tiles inside the legend
    frame.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, panel framed by a full four-sided dark box.
      Chrome: title "timeseries-forecast-uncertainty · python · letsplot · anyplot.ai" in dark ink (~66% width), axis titles "Date" and "Energy Demand (MWh)", ticks 2023-2027 and 400-620, subtle horizontal grid; legend at the bottom on an elevated tile with 80% CI, 95% CI, Historical, Forecast. All text readable.
      Data: historical #009E73 solid line Jan 2023-Dec 2025; dashed #C475FD forecast 2026 inside nested purple ribbons (80% darker inside 95% lighter), widening with the horizon; dotted grey vertical line at Jan 2026.
