review:
  strengths:
  - Exact 3200×1800 canvas in both themes with balanced margins and no clipping
  - Canonical fill_between nesting (95% first, 80% on top) with proxy legend patches
    whose alphas match the stacked band appearance, so 80% and 95% stay distinct in
    both themes
  - 'Full theme threading: INK/INK_SOFT/INK_MUTED tokens on title, labels, ticks,
    spines and an elevated legend frame — no dark-on-dark text'
  - 'Adaptable structure: column-role constants, a Data block ending in one tidy df,
    and plotting derived only from df with has_forecast guards'
  weaknesses:
  - 'VQ-07 (both): the confidence bands are the third legend series but use Imprint
    position 6 (#2ABCCD), skipping positions 3–5 → the canonical third position #4467A3.
    Likely cause: CI_COLOR = IMPRINT_PALETTE[5].'
  - 'DQ-01 (both): the forecast does not pick up where the history ends (C1): in Dec
    2024 the history sits at about 128k and the forecast starts at about 121k, a visible
    step of about −7.5k → forecast first value equal to the last actual (+7.5k). Likely
    cause: forecast_values = actual[-1] + … + 15*sin(2π(t[-1]+t_forecast)/12) adds
    sin(2π·35/12)·15 = −7.5 at t_forecast=0; subtract the seasonal value of the last
    month instead.'
  - 'Suggestion: offset the unrequested ''Forecast →'' label a few points right so
    the dotted start line no longer runs through its ''F'' (or drop the label; the
    line and region already mark the start).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200×1800.
      Chrome: title 'timeseries-forecast-uncertainty · python · matplotlib · anyplot.ai' in dark ink (~67% width); axis titles 'Date' and 'Monthly Sales (thousands)' dark; tick labels (rotated 'Jan 2022'…'Jul 2025', 80–180) in soft dark gray; y-only subtle grid; top/right spines removed; legend upper-left on elevated frame. All readable.
      Data: history solid #009E73 2022–Dec 2024; forecast dashed purple #C475FD Dec 2024–Oct 2025 with a peak dot and italic 'Peak ≈ 148k'; nested cyan bands (darker 80%, lighter 95%) widening with horizon; dotted gray forecast-start line plus faint region tint and italic 'Forecast →'. Forecast starts ~7k below the last actual.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
