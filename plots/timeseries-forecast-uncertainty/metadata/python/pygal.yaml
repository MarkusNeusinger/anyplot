review:
  strengths:
  - Bands are built as polygons that start at the last observation, so history, forecast
    and both intervals hand off seamlessly with no gap
  - Nested bands are split into one 80% region and two 95% strips, so each tint covers
    exactly one region and the bands read as clearly nested in both themes
  - 'Imprint palette applied semantically: brand green for observed history, lavender
    for the forecast and its translucent bands, chrome-colored dashed forecast-start
    line'
  - Per-series dollar formatter gives readable tooltips in the interactive HTML output
  weaknesses:
  - 'VQ-02 (both): each legend swatch touches the first letter of its label (e.g.
    the swatch abuts the ''9'' of ''95% interval'') with no gap → leave about 10–16
    px between swatch and text. Likely cause: legend_box_size=36 with legend_font_size=42
    leaves pygal''s default swatch-to-text spacing too tight; reduce legend_box_size
    or add a CSS translate/padding on .legends text.'
  - 'VQ-03 (both): the legend shows solid squares for ''Forecast'' and ''Forecast
    start'', which are drawn as dashed lines, so the glyphs do not match their marks
    → make the dashed styles recognizable in the legend (e.g. inline CSS giving the
    legend rects of those series a dashed stroke and no fill). Likely cause: pygal''s
    default square legend glyph for line series.'
  - 'Suggestion: an 80% band at alpha 0.45 (light) sits just above the Notes'' 0.2–0.4
    range; 0.38–0.40 would keep the same contrast step while matching the Notes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold title "timeseries-forecast-uncertainty · python · pygal · anyplot.ai" centred at top (~70% width); y-axis "Monthly sales ($)" with ticks 1000–3000 every 200; x-axis "Month" with Jan/Jul ticks Jan 22–Jan 25; subtle horizontal grid; single-row legend at the bottom (95% interval, 80% interval, Forecast start, Observed history, Forecast). All dark text, all readable.
      Data: green #009E73 solid line with small dots for 36 months of history rising from ~1,010 to ~2,660 with seasonal wiggles; lavender #C475FD dashed forecast with dots from Dec 24 to Jun 25 reaching ~2,840; nested lavender bands (darker 80%, lighter 95%) fanning out from the last observation; dark-grey dashed vertical line at Jan 25 with bold "Forecast →" label above the bands. Legend swatches touch their label text; dashed series show solid squares.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, axis titles, ticks and legend text in light ink (#F0EFE8 / #B8B7B0), all readable; grid subtle but visible; the forecast-start line flips to light grey. No dark-on-dark text.
      Data: identical colors to the light render — green history, lavender forecast; bands are the same lavender tints, the 95% band darker-looking on black but still distinguishable from the 80% band and the background.
      Legibility verdict: PASS
