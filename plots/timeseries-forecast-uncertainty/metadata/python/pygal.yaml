review:
  strengths:
  - 'Every Notes bullet is drawn: a solid Imprint-green history, a dashed lavender
    forecast that starts at the last observation (origin point, line 74), a dashed
    INK_SOFT forecast-start line at Jan 25, and nested 80%/95% bands with a five-entry
    legend'
  - The 95% band is drawn as two strips outside the 80% band (lines 82-87), so each
    tint covers exactly one region instead of stacking alpha; the two bands stay apart
    in both themes
  - 'Legend swatches for the dashed series are dashed outline boxes (CSS on #activate-serie-4/6)
    that match the lines they explain, instead of pygal''s default solid squares'
  - pygal-native polygon fills on an XY chart stand in for the missing fill-between,
    with inline CSS injected into the SVG to zero the outline strokes of the band
    series
  - Per-series formatter gives $-formatted hover tooltips in the interactive HTML
  - 80%/95% half-widths of 100/150 keep the normal-quantile ratio (1.28 vs 1.96, about
    1.5), so the intervals are internally consistent
  weaknesses:
  - 'VQ-04 (light): the dashed #C475FD forecast line runs inside the 80% band tinted
    with the same lavender at 0.45 alpha, so line and band separate only by a small
    luminance step and the forecast reads faintly against its band → lighten the 80%
    band to the Notes'' 0.2-0.4 range (about 0.30) or give the forecast stroke more
    weight, so the line stands clear of its band. Likely cause: BAND_80 = rgba(196,117,253,0.45)
    in light (line 29).'
  - 'Suggestion: a forecast horizon of 10-12 months (the Data range asks for 10-50
    forecast points) would give the uncertainty region more of the width; it now takes
    about 12% of the x axis.'
  - 'Suggestion: bands that widen with the horizon (e.g. half-width growing with sqrt
    of the step) would show the typical growth of forecast uncertainty.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, matching the page.
      Chrome: bold monospace title "timeseries-forecast-uncertainty · python · pygal · anyplot.ai" centred at the top, about 70% of the width; y-axis title "Monthly sales ($)", x-axis title "Month"; y ticks 1000-3000 in steps of 200, x ticks Jan 22 … Jan 25 every six months; subtle horizontal grid only; left and bottom spines only. All text dark ink, fully readable. One-row legend below the axis: 95% interval, 80% interval, Forecast start (dashed outline box), Observed history (green), Forecast (dashed lavender outline box).
      Data: 36 monthly observations as a solid #009E73 line with small dots rising from about 1,010 to 2,660 with seasonal wiggles; at Dec 24 a dashed #C475FD forecast picks up from the last observation and runs to about 2,840 by Jun 25; around it a darker lavender 80% band (about ±100) nested in a lighter 95% band (about ±150), both pinching to the last observation; a dashed INK_SOFT vertical line at Jan 25 with a bold "Forecast →" caption at the top. The forecast line is visible but low-contrast against its same-hue 80% band.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and legend text in light ink, all readable; no dark-on-dark text; grid lines subtle but visible; the forecast-start line in light-grey INK_SOFT.
      Data: identical colors to the light render — #009E73 history, #C475FD forecast; the lavender band tints read as muted purples on the dark page and the 80% and 95% bands stay distinguishable; the forecast line stands out more clearly against its band than in the light render.
      Legibility verdict: PASS
