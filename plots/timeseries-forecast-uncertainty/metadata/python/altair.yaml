review:
  strengths:
  - 'All spec features present: solid green history, dashed purple forecast, vertical
    rule at the forecast start, nested 80%/95% bands with the darker band inside'
  - Idiomatic Altair layering with Y2-encoded area bands and OverlayMarkDef points
    that give native HTML tooltips including the 80% bounds
  - Theme-tuned band opacities keep the purple bands equally light on both surfaces
  - 'Clean time axis: year-only ticks, x-grid off, subtle y-grid'
  - Canonical 3200x1800 canvas reached by padding, never cropping
  weaknesses:
  - 'VQ-03 (both): every legend entry is a hollow circle, so the history line, the
    dashed forecast line and the two filled bands are not represented by matching
    glyphs, and the 95% CI circle is nearly invisible on the light page → line samples
    for the two lines (dashed for the forecast) and filled square swatches at the
    band opacities. Likely cause: the legend comes from a mark_point(size=0) layer
    with the default circle symbol and no symbolType / symbolFillColor (or symbolStrokeDash)
    settings.'
  - 'VQ-02 (both): the legend title ''Series'' overlaps the legend frame''s left border
    and the ''Historical Data'' label touches its right border → keep at least ~5
    px between text and frame. Likely cause: configure_legend sets fillColor/strokeColor
    but no padding.'
  - 'CQ-01 (code): a helper function band() (lines 76-86) wraps the two area layers,
    against the no-functions rule → define band_95 and band_80 inline as two alt.Chart(projected).mark_area(...)
    charts. Likely cause: factoring the duplicated band definition into a function.'
  - 'Suggestion: start the forecast line at the last observed month so the history
    and forecast join visually across the rule.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
