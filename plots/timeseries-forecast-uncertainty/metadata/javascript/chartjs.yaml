review:
  strengths:
  - 'Correct, theme-consistent Imprint palette use: historical series is brand green
    #009E73 (always-first rule) and forecast + both confidence bands use a coherent
    blue family (palette[2]), giving the chart a legible color family exactly as the
    spec suggests.'
  - 'Nested confidence bands built with Chart.js''s `fill: "+1"` relative-fill idiom
    (95% dataset fills to its paired lower-bound dataset, 80% dataset fills to its
    own pair) so the 80% band renders visibly darker/denser than the wider 95% band
    — matches the spec''s ''darker for 80%, lighter for 95%'' requirement.'
  - Forecast-start marker implemented as a genuine Chart.js plugin (`afterDraw` hook)
    that reads `chart.scales.x.getPixelForValue()` — a native, idiomatic technique
    rather than a static annotation guess, and it is placed and labeled without colliding
    with any other chart element in either render.
  - 'Legend is deliberately filtered (`filter: (item) => !item.text.includes("lower")`)
    to hide the two invisible helper datasets (80%/95% CI lower bounds), leaving exactly
    the four legend entries a reader needs: Historical, Forecast, 80% Confidence,
    95% Confidence.'
  - 'Data is realistic and complete: 40 months of noisy trend+seasonality SaaS revenue
    history followed by a 12-month forecast whose 80%/95% bands widen with horizon
    (linear growth in spread), correctly dramatizing increasing forecast uncertainty
    over time.'
  - 'Both renders are fully theme-correct: identical data colors, `#FAF8F1`/`#1A1A17`
    backgrounds, and all text (title, ticks, axis titles, legend, forecast-start label)
    uses theme tokens with no dark-on-dark/light-on-light failures.'
  weaknesses:
  - 95% confidence band uses alpha 0.12, below the spec's suggested 0.2-0.4 range
    — it still reads clearly in both renders, but nudging it toward 0.18-0.2 would
    align with the spec's guidance while remaining visually subordinate to the 80%
    band.
  - The mandated title renders at only ~40% of plot width instead of the ~70-85% naturally
    expected for this length of mandated string at the library default 22px — not
    a defect (still fully legible, not cramped), but there is unused visual weight
    available for the title if a future pass wants slightly larger/bolder typography
    for more aesthetic punch.
  - Typography is uniformly default sans-serif across every text element; a touch
    more hierarchy (e.g., a heavier weight for the title vs. regular for ticks, which
    Chart.js already partially does by default) or a subtitle summarizing the forecast
    horizon would push Design Excellence further above 'good.'
  - No direct numeric callout of the forecast values or CI width at key milestones
    (e.g., end-of-horizon point estimate) — would add a stronger data-storytelling
    focal point beyond the color/line-style distinction already in place.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "timeseries-forecast-uncertainty · javascript · chartjs · anyplot.ai" in bold dark ink at top-center; X-axis title "Month" and Y-axis title "Monthly Revenue ($ thousands)" in dark ink; tick labels (Jan 2022 ... Apr 2026 on X, 400-750 on Y) in a softer grey; bottom legend with swatches for 95% Confidence, 80% Confidence, Historical, Forecast; a grey dashed vertical rule at the historical/forecast boundary labeled "Forecast start" near the top of the plot area. All text is clearly legible against the light background.
      Data: Historical line (Jan 2022-Apr 2025) is solid brand green (#009E73) showing an upward trend with seasonal wiggle from ~415 to ~615. From the forecast-start line onward, a dashed blue line (forecast) dips then rises toward ~660 by Apr 2026, enclosed in two nested blue-tinted bands: a denser/darker inner band (80% CI) and a lighter, wider outer band (95% CI) that both widen with the forecast horizon.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, tick labels, legend, and "Forecast start" marker, all recolored to light/soft-light tones (white title, light-grey ticks and axis titles) and clearly visible against the dark background; gridlines are faint light-on-dark, subtle but present.
      Data: Historical line remains the identical brand green #009E73; forecast dashed line and both confidence bands remain the identical blue family and alpha values as the light render — confirming data colors are theme-invariant while only chrome (background/text/grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; every label, tick, and legend entry is readable.
