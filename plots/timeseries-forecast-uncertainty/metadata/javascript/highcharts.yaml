review:
  strengths:
  - Correct, idiomatic core-bundle-only technique for confidence bands (stacked area
    + invisible base) — avoids the forbidden highcharts-more module entirely.
  - 'Band alpha/width relationship is data-driven and visually correct: 95% band is
    both lighter and wider than the 80% band, and both widen with forecast horizon.'
  - Palette usage is fully canonical (position 1 green for historical, position 2
    lavender for forecast + bands) and identical across both themes.
  - Clean, legible chrome in both light and dark renders with no legibility failures.
  weaknesses:
  - Total data point count (48) is slightly below the spec's stated 50-200 range —
    consider extending the forecast horizon a couple of months or adding a few more
    historical points to comfortably clear the minimum.
  - Title occupies a fairly small share of the plot width relative to the visual weight
    of the rest of the chart; a touch larger fontsize could better balance it against
    the axis label sizes (not a defect, just a polish opportunity).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "timeseries-forecast-uncertainty · javascript · highcharts · anyplot.ai" in bold dark text; y-axis title "Website sessions (thousands)"; dark tick labels on both axes; four-item legend (Historical, Forecast, 80% confidence, 95% confidence) in dark text. All clearly readable against the light background.
      Data: Green (#009E73) solid historical line from Oct 2023 to ~Jul 2026 with realistic trend/seasonality/noise. Dashed dark vertical line + "Forecast start" label marks the transition. From there, a lavender (#C475FD) dashed forecast line continues, wrapped in a darker/tighter 80% confidence band and a lighter/wider 95% confidence band, both widening with forecast horizon. First series is the brand green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, tick labels, and legend, now rendered in light gray/white against the dark background. "Forecast start" label and gridlines are dimmed appropriately but remain visible. No dark-on-dark issues found — no black-on-black text anywhere.
      Data: Confirmed identical to the light render — same green historical line, same lavender forecast line and confidence bands at the same alpha levels. Only chrome (background, text, grid) flipped between renders.
      Legibility verdict: PASS
