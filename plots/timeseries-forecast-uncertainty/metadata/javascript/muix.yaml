review:
  strengths:
  - Nested 80%/95% bands are drawn as a custom SVG layer inside the MUI X composition
    API, using the useXScale/useYScale hooks so the bands share the chart's exact
    scales and sit beneath the LinePlot, keeping the forecast line and grid visible
    through them
  - The forecast starts at the last observed month (its first value repeats the last
    actual), so the dashed forecast picks up exactly where the solid history ends,
    and ChartsReferenceLine marks that month with a labelled dashed rule in the ink-soft
    token
  - Interval bounds fall out of the computation (forecast ± 1.2816σ and ± 1.96σ with
    σ growing per horizon step), so the bands widen with the horizon and the 80% band
    always lies inside the 95% band
  - Title, derived subtitle (history length, last observed month, horizon) and legend
    form a clear three-level header; the 80% legend swatch uses the composite opacity
    of both overlapping fills, so it matches the band exactly as rendered
  - Single-hue Imprint green with line style and fill opacity as the distinguishing
    channels keeps the chart CVD-safe; chrome is fully theme-adaptive and both renders
    read cleanly
  - Axis-triggered ChartsTooltip gives month-by-month values in the HTML view; skipAnimation
    is set and the axis bands are sized explicitly so no tick label is truncated
  weaknesses:
  - 'Suggestion: the bands could be native stacked area series (a transparent lower-bound
    series with the band width stacked on top), so the native ChartsLegend and the
    axis tooltip would cover the intervals instead of a hand-built header legend.'
  - 'Suggestion: the 95% band at 0.18 opacity reads dim on the #1A1A17 page; a slightly
    higher outer-band opacity (for example 0.22) would give it more presence in the
    dark render while keeping the two bands apart in light.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "Monthly Demand Forecast · timeseries-forecast-uncertainty · javascript · muix · anyplot.ai" (~62% of the width), grey subtitle "42 months of history to Jun 2026 · 12-month forecast with 80% and 95% intervals", horizontal header legend (Demand solid line, Forecast dashed line, 80% interval swatch, 95% interval swatch). Y axis "Demand (units)" with ticks 2,900–4,600, x axis "Month" with quarterly ticks Jan 2023–Apr 2027. Subtle horizontal grid only. All text dark and readable; nothing clipped.
      Data: solid #009E73 history line Jan 2023–Jun 2026 with seasonal swings around a slight upward trend; dashed #009E73 forecast from Jun 2026 to May 2027; a darker 80% band nested inside a lighter 95% band, both widening with the horizon (roughly 3,000–4,590 at the end). A dashed ink-soft vertical line labelled "Forecast start" at Jun 2026.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all in light ink and clearly readable; no dark-on-dark text. Grid lines subtle but visible; the "Forecast start" rule and label flip to light grey.
      Data: identical #009E73 lines, dash pattern and band opacities as the light render; the 80% band reads as mid green, the 95% band as a darker green halo, still distinguishable from each other and from the background.
      Legibility verdict: PASS
