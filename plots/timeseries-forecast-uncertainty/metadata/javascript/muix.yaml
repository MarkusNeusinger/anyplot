review:
  strengths:
  - Forecast horizon extended to 12 months (from 9), now cleanly inside the spec's
    10-50 month guidance
  - Y-axis floor now derived from the actual plotted minimum instead of a hand-picked
    constant, removing the previously flagged wasted margin below the data
  - Correct theme-adaptive chrome in both light and dark renders — no dark-on-dark
    or light-on-light legibility failures anywhere
  - Brand green (#009E73) correctly used as the sole categorical color across historical,
    forecast, and both bands; identical hex in both themes
  - Nested 80%/95% confidence bands with correct opacity ordering (more opaque inner
    80%, more translucent outer 95%), fanning out realistically with forecast horizon
  - Clear solid-vs-dashed line distinction between historical and forecast, plus a
    labeled vertical reference line marking the forecast start
  - Deterministic seeded (LCG) data generation — fully reproducible
  - Title correctly formatted with descriptive prefix plus spec-id/language/library/anyplot.ai
    suffix, with fontsize scaled down for the long string
  - Hand-rolled legend clearly communicates all four series/bands, compensating for
    the native MUI X legend's inability to express nested-band + line-style distinctions
  - The internal-DOM-class-name fragility of the stacked-band trick is now explicitly
    documented in a code comment for future maintainers
  weaknesses:
  - Confidence-band rendering still depends on hiding internal MUI X DOM class names
    via sx selectors (e.g. .MuiAreaElement-series-band95, .MuiLineElement-series-lower95-base)
    — functional and now documented, but remains fragile across future @mui/x-charts
    version bumps since these are not part of the public API
  - All series (historical, forecast, both bands) share a single brand-green hue differentiated
    only by opacity/line-style; a richer treatment (e.g. leaning further into the
    Imprint semantic anchors for the bands) would raise the design ceiling further
  - Title occupies roughly 45-50% of the plot width — comfortably legible with no
    overflow, but on the lower end of the ~50-70% guidance range, leaving some unused
    header space
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark-ink title "Monthly Demand Forecast · timeseries-forecast-uncertainty · javascript · muix · anyplot.ai" is fully visible and readable, comfortably sized (no overflow/clipping). A hand-rolled legend row beneath the title shows a solid line (Historical demand), dashed line (Forecast (point estimate)), and two green fill swatches at different opacities (80% / 95% confidence interval), all in dark ink and clearly readable. Y-axis label "Demand (units / month)" (rotated) and X-axis label "Month" with date ticks (Jan 23 - Jul 27) are dark ink on the light surface, fully legible. Gridlines are subtle horizontal lines. An italic "Forecast start" label sits beside a thin dashed vertical reference line.
      Data: A solid brand-green (#009E73) line traces 42 months of seasonal historical demand with realistic noise, transitioning at the forecast-start marker into a dashed green forecast line. Two nested translucent green bands (more opaque/darker 80% CI hugging the forecast line, more translucent/lighter 95% CI as the outer envelope) widen visibly with forecast horizon, correctly conveying growing uncertainty.
      Legibility verdict: PASS - no readability issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, legend text, axis labels, and tick labels all render in light ink and remain fully readable against the dark surface - no dark-on-dark failures anywhere. The "Forecast start" label and its dashed reference line are light-colored and legible. Gridlines remain subtle and low-opacity.
      Data: The historical/forecast line color and the confidence-band hue are identical #009E73 green to the light render - only the chrome (background, text, grid) flips between themes, exactly as required. The 95% band appears visually darker relative to the 80% band on this near-black page (an artifact of low-alpha blending against a dark background rather than a color change), but the two bands remain clearly distinguishable and the nesting is still legible.
      Legibility verdict: PASS - no dark-on-dark or unreadable elements found.
