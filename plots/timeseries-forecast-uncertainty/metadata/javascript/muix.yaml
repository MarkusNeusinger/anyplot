review:
  strengths:
  - Correct theme-adaptive chrome in both light and dark renders — no dark-on-dark
    or light-on-light legibility failures anywhere
  - Brand green (#009E73) correctly used as the sole categorical color across historical,
    forecast, and both bands — consistent with the 'one hue for the whole series family'
    design choice
  - Nested 80%/95% confidence bands rendered with correct opacity ordering (darker
    inner 80%, lighter outer 95%) via a documented double-stack trick that produces
    exact [lower, upper] fills
  - Clear solid-vs-dashed line distinction between historical and forecast, matching
    the spec's notes
  - Vertical dashed reference line with 'Forecast start' label cleanly marks the historical/forecast
    boundary
  - Deterministic seeded data generation (LCG) — fully reproducible
  - Title correctly formatted with a descriptive prefix plus spec-id/language/library/anyplot.ai
    suffix, with fontsize properly scaled down for the long title length
  - Hand-rolled legend clearly communicates all four series/bands, working around
    the native MUI X legend's inability to express nested-band + line-style distinctions
  weaknesses:
  - 'Forecast horizon is 9 months, one below the spec''s stated 10-50 month range
    for the forecast period (''Size: 50-200 total points (30-150 historical + 10-50
    forecast)'') — extend FORECAST_HORIZON to at least 10'
  - Confidence-band rendering depends on hiding internal MUI X DOM class names via
    `sx` selectors (e.g. `.MuiAreaElement-series-band95`, `.MuiLineElement-series-lower95-base`)
    — fragile since these are unstable internal class names that could break on a
    library version bump
  - All series (historical, forecast, both CI bands) use a single brand-green hue
    differentiated only by opacity/line-style; accessible via redundant encoding,
    but a slightly richer visual treatment (e.g. leaning on the `muted` anchor for
    the outer band) would raise the design ceiling
  - Fixed y-axis minimum (2500) leaves a visually empty margin below the lowest data
    point (~2970), some wasted vertical space though defensible as breathing room
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Monthly Demand Forecast · timeseries-forecast-uncertainty · javascript · muix · anyplot.ai" in bold dark ink, clearly readable. Legend row (line/dashed-line/two fill swatches) directly under the title, dark ink text. Y-axis label "Demand (units / month)" rotated 90°, dark ink, readable. X-axis label "Month" and tick labels (Jan 23 ... Apr 27) in dark ink, readable. Horizontal gridlines subtle and unobtrusive. Vertical dashed reference line with italic "Forecast start" label near the historical/forecast boundary, clearly visible.
      Data: Solid green (#009E73) line for historical demand with clear seasonal oscillation; dashed green line for the forecast point estimate; two nested green fills — a darker, more opaque band for the 80% CI and a lighter, more translucent band for the 95% CI, fanning out with horizon as expected for a growing-uncertainty forecast.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend text, axis labels, and tick labels all render in light ink (white/near-white), clearly readable against the dark background — no dark-on-dark failures observed. Gridlines are subtle light lines at low opacity. The "Forecast start" reference line and label render in light ink, legible.
      Data: Same brand green (#009E73) line, dashed forecast line, and nested confidence bands as the light render — confirmed identical data colors between themes; only chrome (background, text, grid) flips.
      Legibility verdict: PASS
