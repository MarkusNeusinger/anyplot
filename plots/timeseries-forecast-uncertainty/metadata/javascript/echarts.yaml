review:
  strengths:
  - Genuine stacked-area technique (invisible floor series + visible span series)
    correctly renders nested 80%/95% confidence bands, with the 80% band visibly darker
    and drawn on top of the lighter 95% band, exactly matching the spec's nesting
    requirement
  - Historical (solid green) vs. forecast (dashed blue) line distinction is clear,
    and a dashed markLine with an 'Forecast start' label cleanly marks the transition
    point
  - Deterministic in-memory data generation via a tiny seeded LCG + Box-Muller gaussian,
    with forecast uncertainty (sigma) widening with the square root of the horizon
    — a realistic touch that mirrors real ARIMA/Prophet-style forecast output
  - First data series correctly uses Imprint brand green (#009E73); theme-adaptive
    chrome (title, legend, axis labels, grid) is correctly threaded through window.ANYPLOT_TOKENS
    and both renders are theme-correct
  - 'Clean idiomatic ECharts usage: option-based line series, stack for the band technique,
    markLine for the reference line, animation disabled, no explicit width/height/devicePixelRatio
    passed to echarts.init'
  weaknesses:
  - 'Palette ordering skips Imprint position 2 (lavender #C475FD): Forecast and both
    CI bands use palette[2] (#4467A3, blue) while palette[1] is never used. There
    is no strong semantic color association (like sky/water) that justifies reassigning
    away from canonical order here — use palette[1] for the Forecast series (with
    the CI bands as tinted/alpha variants of that same hue) to follow the canonical
    1→N default.'
  - Y-axis is fixed to a 0–250 range while the data only spans roughly 100–215, so
    the plotted line/band occupies well under a third of the vertical grid — the historical
    trend and the widening forecast band get visually compressed into a narrow horizontal
    strip with large empty margins above and below. Consider tightening the y-axis
    max (e.g. ~220) or using a scaled/non-zero-start axis to give the data more vertical
    breathing room, since this is a line/band chart (not a bar chart) where the zero-baseline
    convention matters less.
  - The 80% CI and 95% CI legend swatches are small, pale, and very close in shade
    — while the two bands are clearly distinguishable within the chart itself (nested
    darker/lighter), the legend markers alone barely differentiate the two confidence
    levels at a glance.
  - 'No markers on the Actual/Forecast lines (symbol: ''none'') — acceptable for a
    ~54-point monthly series, but a subtle marker at the actual/forecast boundary
    point would reinforce the transition alongside the markLine.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "timeseries-forecast-uncertainty · javascript · echarts · anyplot.ai" in bold dark text, clearly readable and comfortably sized (well under overflow, plenty of margin). Legend ("Actual", "Forecast", "80% CI", "95% CI") sits centered below the title in dark text on light swatches. Y-axis title "Revenue ($k)" and tick labels ($0k–$250k) are dark gray, clearly legible. X-axis month/year tick labels (Jan 2022 … May 2026, every 4th month) are legible and evenly spaced with no overlap. A vertical dashed gray line labeled "Forecast start" (rotated text) marks the historical/forecast boundary, fully readable.
      Data: Solid green (#009E73) line for Actual revenue (Jan 2022–May 2025) showing an upward trend with seasonal wiggle. From the forecast-start marker onward, a dashed blue line (#4467A3) continues the trend, flanked by two nested semi-transparent blue bands — a darker inner band (80% CI) and a lighter, wider outer band (95% CI) that visibly widen toward the end of the forecast horizon.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend, y-axis title, and tick labels all render in light/white-ish text, clearly visible against the dark background. Grid lines are faint but visible. The "Forecast start" dashed line and its rotated label remain legible in light gray/white.
      Data: Actual line remains the identical brand green (#009E73), forecast line and CI bands remain the identical blue (#4467A3) at the same opacities as the light render — only the chrome (background, text, grid) flipped, confirming theme-adaptive tokens were threaded through correctly and data colors are unchanged across themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome elements are clearly visible against the near-black surface.
