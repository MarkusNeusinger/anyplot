review:
  strengths:
  - 'Correct Imprint palette usage: brand green (#009E73) for the Actual series, lavender
    (#C475FD, palette[1]) for Forecast and both CI bands, identical data colors across
    light and dark renders'
  - Idiomatic ECharts stacked-area technique (invisible floor series + visible span
    series with stack) cleanly renders nested, non-overlapping 80%/95% confidence
    bands without a custom plugin
  - markLine with an 'insideEndTop' label clearly marks the historical/forecast boundary
    ('Forecast start') as required by the spec
  - Solid line for historical Actual vs. dashed line for Forecast gives an immediate
    visual distinction per the spec notes
  - Y-axis is dynamically scaled to the actual data range (dataMin/dataMax padded
    to nearest 10) rather than a fixed span, fixing the compressed-band look from
    attempt 1
  - Deterministic LCG + Box-Muller Gaussian noise generator keeps the data fully reproducible
    with no browser RNG dependency
  - Confidence interval width widens monotonically with forecast horizon (sigma =
    4 + 2.1*sqrt(h)), which is realistic forecasting behavior
  - 'Theme-adaptive chrome is threaded through correctly: title/legend/tick colors,
    grid, and axis lines all use ANYPLOT_TOKENS, backgrounds transparent over the
    correct page surface'
  weaknesses:
  - 95% CI band areaStyle opacity is 0.15, slightly below the spec's suggested 0.2-0.4
    semi-transparency range for confidence bands — current value still reads clearly
    against the 80% band but has less margin before becoming hard to see on smaller/mobile
    renders
  - X-axis has no explicit axis title (only tick labels like 'Jan 2022'), which is
    acceptable since dates are self-evident but is asymmetric with the Y-axis's explicit
    'Revenue ($k)' title
  - Legend swatch alpha values (0.45/0.85 via hexToRgba) are a reasonable approximation
    for distinguishing the two CI bands in the legend, but are hardcoded rather than
    derived from the same 0.15/0.32 opacities used in the chart body — a future maintenance
    risk if band opacities change without updating the legend swatches in tandem
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "timeseries-forecast-uncertainty · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Legend below title reads "Actual", "Forecast", "80% CI", "95% CI" in dark text with green line swatch, purple dashed-line swatch, and two purple dot swatches (darker for 80%, lighter for 95%). Y-axis titled "Revenue ($k)" with tick labels $90k-$230k in soft dark gray. X-axis tick labels (Jan 2022 ... May 2026) in soft dark gray, evenly spaced with no overlap. Subtle horizontal gridlines. A vertical dashed reference line at the historical/forecast boundary is labeled "Forecast start" in soft dark text.
      Data: Solid green (#009E73) line for the ~4.5-year historical "Actual" series with clear rises/dips (seasonality + noise visible). At the forecast boundary, a purple dashed "Forecast" line continues, flanked by two nested purple confidence bands (darker/narrower 80% band nested inside a lighter/wider 95% band) that widen with the forecast horizon, dip mid-forecast, then widen further toward the end of the horizon.
      Legibility verdict: PASS — all title, legend, axis, and tick text is clearly readable against the light background; no light-on-light text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend content, now rendered in light/white text (title bold white, legend labels light gray) against the dark background. Y-axis "Revenue ($k)" and tick labels rendered in light soft-gray. X-axis tick labels also light soft-gray, evenly spaced, no overlap. Gridlines subtle and visible against the dark surface. The "Forecast start" vertical dashed line and its label are rendered in light gray, clearly visible.
      Data: Data colors are identical to the light render — same green (#009E73) Actual line, same purple/lavender Forecast line and CI bands (80% darker-nested-inside-95%-lighter), confirming only chrome flipped between themes and data-ink stayed constant.
      Legibility verdict: PASS — no dark-on-dark failures; all title/label/tick text remains clearly legible against the near-black background, and the confidence bands stay visually distinguishable from the dark surface.
