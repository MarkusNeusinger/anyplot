review:
  strengths:
  - Hexagonal grid at bins=38 balances detail and aggregation; the Midtown core, Brooklyn,
    Jersey City, LGA and JFK clusters read as distinct zones
  - Theme tokens thread through all chrome, the base map and the legend box in both
    themes
  - Midtown hotspot arrow gives the viewer a focal point on the densest cells
  weaknesses:
  - 'VQ-07 (both): the fill uses scale_fill_gradient(low=#009E73, high=#4467A3), the
    legacy two-stop ramp identical in both themes → the imprint_seq fields stops of
    each theme (light #66E2B2/#009E73/#4467A3/#002850 at 0/0.368/0.582/1; dark #00573D/#009E73/#CDD9FF
    at 0/0.467/1). Likely cause: scale_fill_gradient low/high instead of scale_fill_gradientn(colours,
    values).'
  - 'VQ-02 (both): the ''Midtown hotspot'' label is printed over the hexagon cells
    east of Manhattan (around 73.95°W, 40.775°N) → place it over empty water or land
    clear of the cells. Likely cause: annotate(''text'', x=-73.968, y=40.776).'
  - 'Suggestion: a slightly larger annotation (about 3.5 mm) would match the axis
    text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; light blue water panel with tan land polygons and grey outlines.
      Chrome: bold dark title in the mandated format, Latitude/Longitude axis titles, degree tick labels, subtle grid, bordered 'Pickup Count' colour bar (100-400) on an elevated fill, italic 'Midtown hotspot' annotation with arrow — all readable.
      Data: ~38-bin hexagon grid over Manhattan, Jersey City, Brooklyn, LaGuardia and JFK clusters; cells run brand green #009E73 at low counts to blue #4467A3 at the Midtown core; alpha 0.88 lets outlines show faintly through.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; dark navy water and dark brown land.
      Chrome: near-white title, light grey ticks and axis titles, colour bar with light border and labels, light annotation — no dark-on-dark text.
      Data: same hexagon colours as the light render (the same two-stop ramp in both themes).
      Legibility verdict: PASS
