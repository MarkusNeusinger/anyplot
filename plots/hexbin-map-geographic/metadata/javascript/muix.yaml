review:
  strengths:
  - Real hex-binning math implemented from scratch in pixel space (axial coordinates
    + cube-round nearest-hex snapping), giving genuinely regular, isotropic hexagons
    rather than a square-grid approximation — a strong technical choice given @mui/x-charts
    has no built-in hexbin primitive.
  - 'Custom `slots={{ scatter: HexMarks }}` marker override plus `useXScale`/`useYScale`
    hooks for the coastline/land overlay is idiomatic, advanced usage of MUI X''s
    extension points — exactly the kind of library-specific technique LM-02 rewards.'
  - Hand-rolled SVG density legend (gradient + min/max labels) correctly mirrors the
    `imprint_seq` two-stop gradient passed to the chart's `zAxis` colorMap, compensating
    for MUI X community's lack of a built-in colorbar.
  - Deterministic mulberry32 PRNG with no network/CDN dependency, self-contained and
    reproducible.
  - 'Both renders are fully theme-adaptive: backgrounds, ink tokens, land tint, and
    coastline stroke all flip correctly between light/dark while the green-to-blue
    data gradient stays identical, per the Imprint contract.'
  weaknesses:
  - 'Geographic data-generation bug: `coastLonAt(lat)` only interpolates when `lat`
    falls strictly between two traced vertices'' latitudes (32.55–34.45). For the
    ~12 synthetic background points with `lat > 34.45` (north of Point Conception,
    the top of the traced range), the loop finds no matching segment and falls through
    to `return COASTLINE[COASTLINE.length - 1][0]` — the SOUTHERNMOST vertex (Point
    Loma, San Diego, lon -117.13) instead of the correct northernmost one (Point Conception,
    lon -120.47). This drags those points'' longitudes ~3° east of where they belong,
    producing a visible cluster of ~7 disconnected hexagons floating over the land
    polygon near 34.5°N/117–118°W (inland high-desert territory, nowhere near the
    coast or any whale-watching hotspot) in BOTH renders. Fix: change the fallback
    to pick the nearest endpoint by comparing `lat` against the first vs. last vertex''s
    latitude, e.g. `return lat > COASTLINE[0][1] ? COASTLINE[0][0] : COASTLINE[COASTLINE.length
    - 1][0];`.'
  - No explicit 'Longitude' / 'Latitude' axis-title text — only per-tick °W/°N suffixes
    via `valueFormatter`. The sibling matplotlib implementation of this same spec
    adds `ax.set_xlabel("Longitude")` / `ax.set_ylabel("Latitude")` in addition to
    degree-formatted ticks; add equivalent axis titles here for consistency and clarity.
  - Hexagons packed along the coastal band leave almost no gap between adjacent cells
    in the densest stretches (e.g. La Jolla / San Diego cluster), which is acceptable
    given the medium data density but could use a touch more `fillOpacity` contrast
    or a thin gap to keep individual cells crisp at mobile scale.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white — correct.
      Chrome: Title "hexbin-map-geographic · javascript · muix · anyplot.ai" bold and dark, clearly readable; subtitle "Southern California coast · gray whale & dolphin sighting reports, hex-binned by count" in softer gray, readable; longitude ticks (120.0°W ... 117.0°W) and latitude ticks (32.5°N ... 34.5°N) in muted gray, readable; bottom-left legend "Sightings per hex cell" with a green-to-blue gradient bar and "1" / "40" endpoint labels, all readable.
      Data: Hexagonal cells trace the Southern California coastline from Point Conception (top-left) down to San Diego (bottom-right), colored on a green (#009E73-ish) to blue-gray gradient by sighting count, with a light-gray land polygon and a thin coastline stroke behind them. Denser/darker (bluer) hexagons cluster near the three whale-watching hotspots (Santa Barbara Channel, Dana Point, La Jolla), consistent with the synthetic data design. One anomaly: a small detached cluster of ~7 hexagons sits over the land polygon near 34.5°N / 117–118°W, disconnected from the coastline and any hotspot — this is a data-generation bug (see weaknesses), not a rendering/legibility defect.
      Legibility verdict: PASS — all text readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black — correct.
      Chrome: Title and subtitle render in light ink, clearly legible against the dark background; axis ticks and legend text are in a lighter muted gray, legible; no dark-on-dark failures — the theme tokens (t.ink, t.inkSoft) are correctly threaded through every text element.
      Data: Same hexagon layout and identical green-to-blue data colors as the light render (confirmed — only chrome/land-tint/coastline-stroke colors flip between themes, as required). The same anomalous inland hexagon cluster near 34.5°N/117–118°W is present here too, confirming it is a data bug rather than a theme-specific rendering issue.
      Legibility verdict: PASS — all text readable against the dark background; no dark-on-dark failures observed.
