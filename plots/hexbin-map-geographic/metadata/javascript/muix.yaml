review:
  strengths:
  - True hexagonal binning in projected units (axial coordinates with cube rounding,
    longitude scaled by cos of the mid latitude), so the cells are regular, equal
    and share edges on screen, and each one sits over the points it aggregates
  - 'The custom hexagon polygons read their colours from the zAxis continuous colorMap
    through useZColorScale(), and the same z axis drives ContinuousColorLegend, so
    the cells and the legend share one imprint_seq scale (#009E73 to #4467A3) with
    a title that names the statistic (count)'
  - A clipped base map with a land tint, the coastline from Pismo Beach to Ensenada
    and the Channel Islands, Catalina, San Nicolas and San Clemente, drawn under hexagons
    at 0.62 opacity so the island outlines show through the cells
  - The legend gradient uses the cells' opacity, so the bar shows the colours as they
    are drawn, and the page-coloured hexagon edges separate neighbouring cells in
    both themes
  - Composition API (ChartsDataProvider, ChartsWrapper, ChartsSurface, ChartsGrid,
    ChartsXAxis/YAxis) with custom SVG layers inside the drawing area, plus a scatter
    series of cell centres whose valueFormatter feeds ChartsTooltip with count, sum,
    mean and coordinates in the HTML output
  - 'The hexagon size (HEX_RADIUS_SHARE) and the statistic (AGGREGATION: count, sum
    or mean) are configurable constants, with labels and the legend title that follow
    the chosen statistic'
  - 'A plausible, neutral scenario: 1,520 whale and dolphin sightings clustered off
    the Santa Barbara Channel, Dana Point and La Jolla, kept at sea by a distance-to-shore
    filter, with seeded, reproducible generation'
  weaknesses:
  - 'VQ-05 (both): the point extent is about 1.4:1 wide in projected units, but the
    square canvas stretches the latitude span from the padded 32.3–34.7°N to 32.0–34.8°N,
    which leaves an empty band of sea below 32.4°N and an empty south-west corner.
    Together they fill about a third of the drawing area → a drawing area whose aspect
    matches the data extent (landscape orientation, about 0.3° less latitude padding).
    Likely cause: the `//# anyplot-orientation: square` directive combined with spanY
    = spanX / (DRAW_W / DRAW_H).'
  - 'Suggestion: intermediate tick values on the colour bar (for example 50, 100,
    150) would make the counts of the mid-tone cells readable without hovering.'
  - 'Suggestion: in the dark render the 0.62 opacity over #1A1A17 darkens the high-count
    cells toward navy, which narrows the visible step from low to high. A slightly
    higher opacity in the dark theme would keep the gradient''s range.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area; the land east of the coastline is a pale grey tint (grid token) with a dark ink-soft coastline and island outlines.
      Chrome: bold title "Gray Whale & Dolphin Sightings · hexbin-map-geographic · javascript · muix · anyplot.ai" in dark ink, subtitle "1,520 points binned into 68 hexagons of 11 km radius · equirectangular map scaled at 33.4°N", axis titles "Longitude" and "Latitude", ticks 120.6°W–117.4°W and 32.0°N–34.6°N, light grey grid. All readable.
      Data: 68 flat-top hexagons of equal size with page-coloured edges along the coast from Point Conception to below San Diego, filled from the imprint_seq ramp: most cells brand green #009E73, the dense cells in the Santa Barbara Channel, off Dana Point and off La Jolla shifting toward blue #4467A3 (darkest about 32.8°N 117.5°W). The island outlines show through the translucent cells. Horizontal colour bar at the bottom titled "Sightings per hex cell (count)", from 1 to 175.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; land is a dark grey tint with a light coastline and island outlines.
      Chrome: title, subtitle, axis titles and tick labels in light ink, subtle grid. No dark-on-dark text.
      Data: the same hexagons with the same fill colours and 0.62 opacity; over the dark page they read as deeper green to navy, with dark page-coloured edges. The colour bar has the same title and the 1–175 range, and its labels are light.
      Legibility verdict: PASS
