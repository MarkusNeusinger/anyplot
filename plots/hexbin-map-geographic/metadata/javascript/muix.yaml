review:
  strengths:
  - Uses the MUI X composition API (ChartsDataProvider + ChartsSurface) with custom
    SVG layers drawn through useXScale/useYScale/useZColorScale, so the hexagons,
    land polygon and coastline all sit in true data coordinates
  - 'A zAxis continuous colorMap built from the Imprint imprint_seq tokens (#009E73
    → #4467A3) drives both the cell fills and the native ContinuousColorLegend, titled
    ''Count per hex cell'''
  - Equal-area-looking flat-top hexagonal grid with shared edges, cube-rounded binning
    in an equirectangular projection scaled at the mid latitude, so cells keep their
    shape on screen; 72 cells of 11 km radius balance detail against aggregation
  - Base map of a recognisable Southern California coastline with a tinted land polygon,
    clipped to the drawing area; translucent cells (0.62) let the coastline and grid
    show through
  - Subtitle reports point count, cell count, cell radius and projection, a clear
    secondary hierarchy under the mandated title
  - Cell centres registered as a scatter series with a valueFormatter for item tooltips
    (count and coordinates) in the HTML view
  - Theme tokens threaded through every chrome element; both renders fully legible
  weaknesses:
  - 'VQ-03 (both): the color legend gradient is drawn fully opaque while the cells
    are drawn at 0.62 opacity, so the cells do not match the legend: the 110-count
    cells read lavender on light and dark navy on dark against a #4467A3 legend end
    → make the legend show the colors as drawn (same opacity on the legend bar, or
    opaque cells with a mixed color). Likely cause: fillOpacity={HEX_OPACITY} on the
    hex polygons with no matching opacity on ContinuousColorLegend.'
  - 'SC-02 (code): the Notes ask to support the aggregation methods count, sum and
    mean, but the code only counts points and has no setting or value column to switch
    to sum or mean → add an aggregation constant (count | sum | mean) next to HEX_RADIUS_SHARE,
    with an optional value column, and name the chosen statistic in STAT_LABEL. Likely
    cause: the binning loop only increments bin.count.'
  - 'DQ-02 (both): the base map omits the Channel Islands, and the Santa Barbara Channel
    hotspot (centre -119.72, 34.16, sd 0.3° lon) spreads sightings over where Santa
    Cruz and Santa Rosa Islands lie (about 33.9–34.07°N), so a reader who knows the
    coast sees reports on land → add the larger Channel Islands to the land geometry
    and apply the same minimum-distance-from-shore filter to them. Likely cause: COASTLINE/LAND
    only contain the mainland coast.'
  - 'Suggestion: the square extent leaves the south-west third of the map as empty
    ocean; a tighter latitude range or landscape canvas would give the band of cells
    more room.'
  - 'Suggestion: intermediate tick values on the color legend (e.g. 25, 50, 75, 100)
    would make individual cell counts easier to read off the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; land east of the coastline tinted light grey with a dark-grey coastline polyline from Point Arguello to Ensenada.
      Chrome: bold dark title "Gray Whale & Dolphin Sightings · hexbin-map-geographic · javascript · muix · anyplot.ai" (~75% width), soft-ink subtitle with point/cell counts, y-axis "Latitude" with 32.2–34.6°N ticks, x-axis "Longitude" with 120.6–117.4°W ticks, subtle grid, legend title "Count per hex cell" over a horizontal gradient bar labelled 1 and 110. All readable.
      Data: 72 translucent flat-top hexagons with page-coloured outlines following the coast; low counts brand green #009E73, three hot spots (Santa Barbara Channel, off Dana Point, off La Jolla) shifting to lavender-blue toward #4467A3.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; land tinted dark grey, coastline light grey.
      Chrome: title, subtitle, axis titles, tick labels and legend text all in light ink; no dark-on-dark text; grid subtle but visible.
      Data: same hexagon geometry and the same colormap values; the translucent cells blend with the dark page and read darker (deep green to navy), while the legend bar stays opaque green→blue; brand green is clearly visible.
      Legibility verdict: PASS
