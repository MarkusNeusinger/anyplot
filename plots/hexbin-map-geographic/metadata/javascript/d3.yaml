review:
  strengths:
  - Continuous PM2.5 aggregate is correctly mapped through imprint_seq (d3.interpolateRgbBasis(t.seq))
    — the sequential Imprint colormap, not a viridis/turbo substitute — and the hex
    fill colors are pixel-identical between the light and dark renders, only chrome
    flips.
  - Real hex-grid binning is implemented from first principles (pixel-to-axial projection
    + cube rounding, pointy-top hexagon polygons) rather than a bar/square-grid shortcut
    — a genuinely distinctive, low-level D3 technique that a high-level charting library
    could not replicate as directly.
  - 'Thoughtful double-encoding: fill color maps mean PM2.5 while fill-opacity maps
    sample count (hexOpacity scale 0.55-0.92), letting sparsely-sampled cells recede
    and let the river context layer show through — matches the spec''s ''apply transparency
    to allow base map features to show through'' requirement.'
  - The tooltip is a real, functioning hover interaction (count, sum, mean, and lon/lat
    all shown on mousemove) rather than a simulated/faked one — appropriate use of
    d3's event handling for an interactive library.
  - Theme-adaptive chrome is correctly threaded through every non-data element (axis
    text/lines/domain, title, legend text, map frame) via window.ANYPLOT_TOKENS with
    no dark-on-dark or light-on-light failures in either render.
  - Legend is a well-constructed vertical color-bar with its own axis, title, and
    unit sublabel, positioned close to the map rather than floating isolated in whitespace.
  weaknesses:
  - Base-map geographic context is limited to a single semi-transparent river line.
    The spec calls for 'a base map showing geographic context (coastlines, country
    boundaries, or street map)' — one water-feature line reads as thin context on
    its own; consider adding a second cue (e.g. a couple of thin road/street lines
    crossing the hotspots, or a subtle coastline curve) so the map reads less like
    an empty coordinate grid with a single decoration.
  - 'The spec asks the implementation to ''support aggregation methods: count (default),
    sum, and mean'' — count and sum are computed but only ever surface in the tooltip
    (invisible in the static PNG); the primary visible encoding is entirely mean-based
    (color) plus a secondary count cue (opacity). Consider a small caption/subtitle
    under the title clarifying the double encoding (e.g. ''Color: mean · Opacity:
    sample count'') so PNG viewers without hover access can read the encoding without
    guessing.'
  - 'DE-02 visual refinement is solid but not fully polished: the four-sided rectangular
    map frame (t.inkSoft, 1.5px) and the per-hex stroke against the page background
    are both plain defaults with no additional hierarchy (e.g. a lighter/thinner frame,
    or varying hex-stroke opacity by density) — small refinements here would elevate
    the perceived craft further.'
  - The river uses the categorical Imprint palette slot (`t.palette[2]`, the canonical
    blue) for a purely decorative geographic feature rather than a semantic/neutral
    token — it happens to read fine visually, but reserving a categorical slot for
    non-data chrome is a slightly imprecise use of the palette; a `neutral`/`muted`
    token (or a plain gray) would be the more semantically correct choice for base-map
    decoration that isn't itself a data series.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "hexbin-map-geographic · javascript · d3 · anyplot.ai" centered at top, clearly readable. Longitude/Latitude axis titles and degree-formatted tick labels (e.g. "-74.30°", "40.90°") render in dark ink against the light background, fully legible. A thin dark rectangular frame outlines the map area. The vertical "Mean PM2.5 (µg/m³)" legend sits just right of the map with readable dark tick labels (5-25).
      Data: Hexagonal cells tile the map area, colored on a green-to-blue sequential scale (Imprint imprint_seq) — pale green/teal for low-mean cells, deeper blue-teal for high-mean cells concentrated along a diagonal band (river/highway corridor) and in a cluster in the lower-right (downtown hotspot). A translucent lavender-gray diagonal river line runs beneath the hexagons, visible through the semi-transparent fills. First-touch color at the low end of the scale is the Imprint brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/white text, fully legible against the dark background. Axis titles and tick labels render in light gray, clearly legible. The map frame outline is faintly visible in light ink. Legend title, unit sublabel, and tick labels are all light-colored and readable.
      Data: The same green-to-blue hex fill colors as the light render appear identically placed — the diagonal high-density corridor and the lower-right cluster are unchanged in color and position, confirming data colors are theme-independent. Gaps between hexagons with very low sample density show the near-black page background rather than being filled cells (expected sparse-bin behavior, not a defect). The river line is now a darker slate-blue translucent stripe, still visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, and legend text remains clearly visible against the near-black background.
