review:
  strengths:
  - 'Base-map geographic context is now genuinely multi-cue: the river line is joined
    by two thin, dashed street lines crossing the hotspot corridor, so the map reads
    as an urban context layer rather than a single decorative line — directly resolves
    the attempt-1 weakness.'
  - 'A new subtitle (''Color: mean PM2.5 · Opacity: sample count'') under the title
    makes the double encoding legible from the static PNG alone, so viewers without
    hover access can decode the chart without guessing — directly resolves the attempt-1
    ambiguity around count/sum only being available in the tooltip.'
  - The river and street lines now use the neutral t.inkSoft token instead of a categorical
    Imprint palette slot, correctly reserving the categorical palette for actual data
    series and using a semantic/neutral token for non-data basemap chrome.
  - The map frame is now a thinner, lower-opacity rectangle (stroke-opacity 0.5) instead
    of a plain full-opacity default border, a small but real visual-refinement improvement.
  - Real hex-grid binning from first principles (pixel-to-axial projection + cube
    rounding, pointy-top hexagon polygons) is a genuinely distinctive, low-level D3
    technique not easily replicated in a high-level charting library.
  - 'Thoughtful double-encoding is preserved: fill color maps mean PM2.5 while fill-opacity
    maps sample count, letting sparsely-sampled cells recede and the basemap context
    show through, matching the spec''s transparency requirement.'
  - The tooltip is a real, functioning hover interaction (count, sum, mean, lon/lat)
    rather than simulated — appropriate use of d3 event handling for an interactive
    library.
  - Theme-adaptive chrome is correctly threaded through every non-data element (axis
    text/lines/domain, title, subtitle, legend text, map frame) with no dark-on-dark
    or light-on-light failures in either render.
  - imprint_seq is used correctly for the single-polarity continuous PM2.5 aggregate,
    with hex fill colors pixel-identical between light and dark renders — only chrome
    flips.
  weaknesses:
  - The diagonal river band (46px stroke, opacity 0.22) is quite wide and, where it
    crosses hex-grid gaps in the upper-right of the map, reads as a bright light-gray
    glare/highlight cutting across the map rather than a subtle waterway — consider
    narrowing the stroke or lowering opacity further so it stays clearly secondary
    to the hexagon data.
  - Sum aggregation is still only exposed via the tooltip and never surfaces in the
    static PNG (color=mean, opacity=count); this is a minor, not disqualifying gap
    since interactive libraries are not penalized for hover-only detail, but a compact
    'Σ' or count/sum crosscheck in the legend area would make the aggregation story
    fully self-contained without hovering.
  - DE-02 visual refinement, while improved (lighter frame), still relies on a plain
    rectangular map border and default hex-stroke treatment rather than a more distinctive
    frame treatment (e.g. rounded corners, drop shadow-free elevation cue, or removing
    the frame entirely in favor of the hex edges as the natural boundary).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "hexbin-map-geographic · javascript · d3 · anyplot.ai" centered at top, with a new lighter subtitle "Color: mean PM2.5 · Opacity: sample count" directly beneath it, both clearly readable. Longitude/Latitude axis titles and degree-formatted tick labels (e.g. "-74.30°", "40.90°") render in dark ink against the light background, fully legible. A thin, low-opacity dark rectangular frame outlines the map area. The vertical "Mean PM2.5 (µg/m³)" legend sits just right of the map with readable dark tick labels (5-25).
      Data: Hexagonal cells tile the map area on a green-to-blue sequential scale (Imprint imprint_seq) — pale green/teal for low-mean cells, deeper blue-teal for high-mean cells concentrated along a diagonal corridor and in a lower-right cluster. A translucent light-gray river line and two thin dashed street lines cross the map beneath the hexagons, visible through the semi-transparent fills and through gaps between sparsely-populated cells — giving multi-cue basemap context rather than a single decoration. First-touch color at the low end of the scale is the Imprint brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light/white and light-gray text, fully legible against the dark background. Axis titles and tick labels render in light gray, clearly legible. The map frame outline is faintly visible in light ink. Legend title, unit sublabel, and tick labels are all light-colored and readable.
      Data: The same green-to-blue hex fill colors as the light render appear identically placed — the diagonal high-density corridor and the lower-right cluster are unchanged in color and position, confirming data colors are theme-independent. Empty/sparse bins show the near-black page background as expected gaps in the hex grid. The river and street lines are now darker slate-gray translucent strokes, still visible against the dark background and crossing through the hex gaps.
      Legibility verdict: PASS — no dark-on-dark failures; all title, subtitle, axis, tick, and legend text remains clearly visible against the near-black background.
