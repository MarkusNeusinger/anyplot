review:
  strengths:
  - Genuine axial hex-binning implemented from raw lat/lon coordinates (cube-rounding
    algorithm), not a scatter dressed up as hexbin — matches the spec's emphasis on
    discrete geographic aggregation over KDE-style heatmaps
  - 'imprint_seq gradient (#009E73 -> #4467A3) applied identically across both themes,
    with a custom canvas-drawn colorbar plugin compensating for Chart.js''s lack of
    a native continuous legend'
  - 'Realistic, neutral ecological scenario: gray whale sightings clustered near real
    Central California feeding grounds (Cordell Bank, Monterey Bay Canyon, Big Sur,
    Point Conception) with a simplified coastline for geographic context'
  - Tooltip surfaces all three aggregation methods called out in the spec notes (count,
    sum, mean) plus cell center coordinates
  - Deterministic fixed-seed LCG + Box-Muller PRNG, no external dependencies beyond
    the Chart.js global
  weaknesses:
  - A handful of hex-bin icons at the extreme edges of the lat/lon range (e.g. near
    the top border around 38.4-38.5 N) are partially clipped by the chart-area boundary
    because scales.x/y min/max are set to exactly LAT_MIN/LAT_MAX/LON_MIN/LON_MAX,
    the same bounds used to generate the data — expand the axis min/max by roughly
    one hex circumradius (~0.15-0.2 degrees) on each side so edge-bin icons render
    fully inside the plot area instead of being cut by the axis clip.
  - Adjacent hexagons render edge-to-edge with no separating stroke; combined with
    alpha=0.82 fill this makes neighboring high-density cells visually bleed together
    — a thin 0.5-1px stroke in the page background color around each hex icon would
    sharpen the cell boundaries that are hexbin's key advantage over continuous heatmaps.
  - 'DE-01/DE-03 have room to grow: the color gradient alone carries the storytelling;
    consider a small numeric label or callout on the single highest-density cell (Monterey
    Bay, count=78) to give the viewer an explicit focal point rather than relying
    purely on hue contrast.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "hexbin-map-geographic · javascript · chartjs · anyplot.ai" in dark ink, centered, ~55% of canvas width, fully legible. "Coastline" legend entry below title. Axis titles "Longitude (°W)" / "Latitude (°N)" in dark ink with degree-unit labels. Tick labels dark gray, subtle cream gridlines. Colorbar in bottom-right with dark "78" / "0" labels and a rotated "Sightings / hex" caption, fully readable.
      Data: Hexagon markers colored via an imprint_seq gradient (brand green #009E73 for low density up through a blue-purple #4467A3 for high density), a dark gray coastline curve running diagonally through the point cloud from northwest to southeast.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues. Minor defect: a couple of hex icons at the top edge of the lat/lon range are partially clipped by the plot-area boundary (see weaknesses), but this is a marker-visibility issue, not a text-legibility one.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis titles now rendered in light/off-white ink against the dark background — fully legible, no dark-on-dark failures. The coastline curve flips to a light gray/white stroke (theme-adaptive ink-soft token), and grid lines are subtle light lines on the dark surface. Colorbar labels ("78"/"0") are light-colored and readable.
      Data: Hexagon fill colors are visually identical to the light render (same green-to-blue-purple gradient, same bin sizes and positions) — confirms only chrome flipped, not data colors.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures detected. Same minor top-edge marker clipping as the light render (consistent placement, not theme-dependent).
