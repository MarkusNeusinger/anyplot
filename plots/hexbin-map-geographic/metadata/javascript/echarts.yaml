review:
  strengths:
  - Genuine custom hexagonal binning engine implemented via ECharts' custom series
    renderItem — a real (not faked) hexbin computed with axial hex-grid nearest-cell
    assignment, since ECharts has no native hexbin chart type.
  - Continuous imprint_seq color mapping (green to blue) correctly reflects pickup
    density with a clear 'More pickups' / 'Fewer pickups' visualMap legend; data colors
    are identical across light and dark renders.
  - Realistic, neutral synthetic dataset — five named San Francisco neighborhoods
    as gaussian hotspots, plausible taxi fare values, deterministic fixed-seed LCG
    generation.
  - Clean theme-adaptive chrome — title, axis names, tick labels, and legend text
    all correctly use ink/inkSoft tokens; both renders pass the light/dark readability
    check with no dark-on-dark or light-on-light issues.
  - Tooltip formatter exposes count, mean fare, and cell-center coordinates, adding
    real interactive value beyond the static PNG.
  weaknesses:
  - Hexagon fill opacity is 0.85 — quite opaque. The spec explicitly asks to 'apply
    transparency to hexagons to allow base map features to show through', but at this
    opacity the coastline curve is barely visible where hexagons overlap it. Reduce
    fill opacity to roughly 0.6-0.7.
  - 'Only count (color) and mean fare (tooltip) are demonstrated; the spec asks to
    ''support aggregation methods: count (default), sum, and mean of values'' — add
    a sum-of-fare stat to the tooltip so all three aggregations are represented.'
  - Base map / geographic context is minimal — a single thin unlabeled coastline curve
    with no land/water fill. A subtle water tint on the ocean side (west of the coastline)
    would make the geographic framing much clearer at a glance.
  - Title font is shrunk via the length-scaling formula and sits on the smaller end
    of legible — still readable, but a shorter descriptive prefix would give it more
    visual weight relative to the 3200px canvas.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Dark-ink title "Bay Area Taxi Pickups · hexbin-map-geographic · javascript · echarts · anyplot.ai" centered at top, clearly readable. "Longitude" / "Latitude" axis names and lighter-gray tick labels (degree-formatted) along both axes, all legible against the light surface. Vertical color legend on the right labeled "More pickups" (top) / "Fewer pickups" (bottom).
      Data: Dense field of small hexagons on a green (sparse) to blue (dense) sequential gradient (imprint_seq), with a clear blue/purple cluster over the Financial District / Mission area fading to green toward the periphery. A thin gray coastline curve runs through the northwest portion of the plot, mostly under the hexagon layer.
      Legibility verdict: PASS — no light-on-light issues; all text stays dark and readable against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render, with title, axis names, tick labels, and legend text all flipped to light ink tones (ink/inkSoft), clearly visible against the dark surface. The coastline stroke also flips to a lighter gray tone.
      Data: The hexagon color gradient (green to blue) is visually identical to the light render — only the chrome flipped, confirming the Imprint data-color rule.
      Legibility verdict: PASS — no dark-on-dark failures; every label (title, axis names, ticks, legend) remains clearly legible against the near-black background.
