review:
  strengths:
  - The Waterfront Promenade hex cluster now dips into the water polygon, finally
    showing the alpha=0.85 fill blending with the base map underneath -- the single
    biggest gap from attempt 1 is fixed.
  - '"Downtown" and "Transit Hub" are now labeled directly above the chart, turning
    the color-contrast story into a named, legible narrative (fixes the DE-03 weakness
    from attempt 1).'
  - A faint schematic street grid was added in the gaps between hex clusters, giving
    the base map a bit more geographic texture beyond the single coastline curve.
  - Hand-built axial hex binning (pixelToAxial/cubeRound) and a custom SVGRenderer
    hexagon symbol remain a clean substitute for the missing heatmap/hexbin module
    in the core Highcharts bundle.
  - 'Both renders remain fully theme-correct: text, grid, tooltip, legend, and the
    new hotspot labels are all readable in light and dark, with identical data colors
    between themes.'
  - Deterministic LCG-based PRNG and a realistic, neutral ride-hailing scenario are
    unchanged and still strong.
  weaknesses:
  - Sum/mean aggregation is still exposed only in the tooltip -- cell color always
    encodes count, so these required aggregation methods remain invisible in the static
    PNG preview.
  - The new street grid is very subtle (alpha=0.45, drawn behind the hex cells at
    zIndex 0) -- it registers on close inspection but doesn't read as an obvious "base
    map" element at a glance.
  - Only 2 of the 4 named hotspots (Downtown, Transit Hub) are labeled on the chart;
    Waterfront Promenade and North Residential are visually distinguishable but unnamed.
  - Axis lines are still present (not removed/minimized), leaving some room for further
    visual refinement (DE-02).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "hexbin-map-geographic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle in softer gray-brown, axis titles "km east of downtown" / "km north of downtown" in dark ink, tick labels and subtle gridlines in soft gray, plus new bold "Downtown" / "Transit Hub" hotspot labels above the main cluster -- all clearly legible against the light background.
      Data: Hexagonal cells tiled across two groups (a large merged cluster on the left, a smaller "Waterfront Promenade" cluster on the right) colored on a green-to-blue sequential scale (Imprint imprint_seq: #009E73 low -> #4467A3 high) matching a hand-drawn gradient legend ("Pickups per cell", range 1-477). The Waterfront cluster now visibly overlaps the pale blue-gray "Meridian Bay (water)" polygon, demonstrating the alpha=0.85 hex transparency over the base map. Faint dashed street-grid lines are visible in the gaps between clusters.
      Legibility verdict: PASS -- all text is clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title/subtitle/axis titles/hotspot labels now rendered in light cream/off-white ink, tick labels and gridlines in a softer light gray, fully legible against the dark background. No dark-on-dark text observed.
      Data: The hex cells, water polygon, and water-overlap effect show the identical green-to-blue color scale and identical Imprint blue water fill as the light render -- only the chrome (background, text, grid) flipped, confirming data-color consistency across themes.
      Legibility verdict: PASS -- all text is clearly readable, brand green remains visible, no dark-on-dark failures.
