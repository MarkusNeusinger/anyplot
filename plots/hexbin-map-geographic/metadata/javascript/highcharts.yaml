review:
  strengths:
  - Hand-built axial hex binning (pixelToAxial/cubeRound) and a custom SVGRenderer
    hexagon symbol substitute cleanly for the missing heatmap/hexbin module in the
    core Highcharts bundle.
  - Correct imprint_seq gradient (green -> blue) for the continuous count data, and
    the water polygon reuses Imprint blue (#4467A3) at low alpha instead of an arbitrary
    custom hex -- a well-justified semantic exception (water -> blue).
  - 'Both renders are fully theme-correct: title/axis/tick text, grid, tooltip, and
    hand-drawn legend all readable in light and dark, with identical data colors between
    themes.'
  - Custom hand-drawn gradient color-bar legend (with min/max labels) effectively
    substitutes for the unavailable colorAxis module.
  - Deterministic LCG-based PRNG gives fully reproducible data generation despite
    the browser having no seeded RNG.
  - Realistic, neutral ride-hailing scenario with plausible fare values and multiple
    demand hotspots of varying density.
  weaknesses:
  - 'Base-map context is minimal: the ''coastline'' is a single hand-drawn sine-wave
    curve, not real geographic detail (coastlines, boundaries, or street grid) --
    the spec asks for a base map showing geographic context; consider adding a second
    contour, a schematic street grid, or shoreline texture.'
  - Aggregation methods (sum, mean) required by the spec are only exposed in the tooltip
    -- cell color always encodes count, so sum/mean are invisible in the static PNG
    preview.
  - Hex fill alpha=0.85 is meant to let the base map show through, but hexagons never
    sit over water (pickups are filtered out south of the coastline), so the transparency-over-basemap
    effect is never actually demonstrated -- let at least one cluster overlap the
    water polygon slightly.
  - The four named hotspots (Downtown, Transit Hub, Waterfront Promenade, North Residential)
    exist in the data model but are never labeled on the chart -- labeling the top
    hotspot(s) directly would add real data storytelling and visual hierarchy.
  - Large empty gaps between hex clusters (e.g. between x~-0.6 and x~0, and x~1 to
    x~1.3) read as slightly awkward dead space in the plot area -- tightening hotspot
    placement or narrowing the x-range would improve layout balance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "hexbin-map-geographic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle in softer gray-brown, axis titles "km east of downtown" / "km north of downtown" in dark ink, tick labels and subtle gridlines in soft gray -- all clearly legible against the light background.
      Data: Hexagonal cells tiled across three clusters (a large one on the left/center, two smaller ones to the right) colored on a green-to-blue sequential scale (Imprint imprint_seq: #009E73 low -> #4467A3 high) matching a hand-drawn gradient legend ("Pickups per cell", range 1-527). A pale blue-gray "Meridian Bay (water)" polygon with a wavy coastline sits along the bottom, labeled in italic gray text.
      Legibility verdict: PASS -- all text is clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title/subtitle/axis titles now rendered in light cream/off-white ink, tick labels and gridlines in a softer light gray, fully legible against the dark background. No dark-on-dark text observed.
      Data: The hex cells and water polygon show the identical green-to-blue color scale and identical Imprint blue water fill as the light render -- only the chrome (background, text, grid) flipped, confirming data-color consistency across themes.
      Legibility verdict: PASS -- all text is clearly readable, brand green remains visible, no dark-on-dark failures.
