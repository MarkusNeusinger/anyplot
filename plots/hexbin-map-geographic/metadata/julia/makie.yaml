  strengths:
  - Native Makie hexbin! recipe with cellsize and threshold, linked to a Colorbar
    through the plot handle
  - imprint_seq fields ramp built with the current per-theme stop positions via cgrad
  - Ride starts masked to land with the same polygons that draw the water, so the
    hexagons sit over the city
  - Translucent cells (alpha 0.82) over a water/coastline base map drawn with poly!,
    so the shoreline shows through in both themes
  - All chrome threaded through theme tokens; both renders fully readable
  weaknesses:
  - 'Suggestion: a few neighborhood labels on the base map would help the reader place
    the clusters.'
  - 'Suggestion: setting the axis aspect to about 1/cos(37.77°) would keep the SF
    outline in true proportion.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and axis; land is the page color, SF Bay (top/right) and the Pacific (left strip) filled light blue with a darker blue coastline.
      Chrome: bold title "SF Bike-Share · hexbin-map-geographic · julia · makie · anyplot.ai" in dark ink; "Longitude"/"Latitude" labels and tick labels (-122.50…-122.40, 37.70…37.80) dark gray, readable; left/bottom spines only, subtle grid; colorbar "Ride Count" with ticks 200–600.
      Data: ~130 equal hexagons with shared edges and thin page-colored strokes, pale mint (low) through brand green #009E73 and deep blue to dark violet (high, ~650) at the Downtown/SoMa core; cells sit over land, only edge cells reach across the waterfront; coastline shows through the translucent cells.
