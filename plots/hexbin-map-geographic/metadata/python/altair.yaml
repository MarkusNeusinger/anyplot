review:
  strengths:
  - 'Idiomatic Vega-Lite geo stack: topo_feature land basemap, inline GeoJSON hexagons
    and a text layer all share one Mercator projection'
  - imprint_seq fields stops placed at their ramp positions on a log scale, so 1-count
    and 1,500-count cells both read
  - 'Theme-adaptive basemap: land fill and coastline tones switch per theme along
    with the chrome'
  - Hexagons with shared edges and thin page-colored outlines, translucent over the
    land
  - Native tooltips on every cell in the HTML output
  weaknesses:
  - 'SC-01 (both): an annotation layer of hub labels (Seattle, Chicago, NYC Metro)
    that the spec does not ask for → remove the text layer. Likely cause: the ann_data
    / annotation mark_text layer.'
  - 'SC-02 (code): the tooltip shows the count only; the Notes ask for cell statistics
    including coordinates → add the cell centre lon/lat to the tooltip. Likely cause:
    properties carry only Sightings, not lon_c/lat_c.'
  - 'VQ-02 (both): the legend title ''Sightings'' at 13 px is wider than the legend
    frame and runs into its left and right border → keep the title inside the frame
    (smaller title or legend padding/minimum width). Likely cause: titleFontSize=13
    with the default legend padding.'
  - 'Suggestion: the base map could show state boundaries so the clusters read against
    more geographic context.'
