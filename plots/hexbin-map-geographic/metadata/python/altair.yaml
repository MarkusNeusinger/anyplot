review:
  strengths:
  - 'Idiomatic Vega-Lite geo stack: a topo_feature land basemap and inline GeoJSON
    hexagons drawn with mark_geoshape share one Mercator projection'
  - imprint_seq fields stops of each theme placed at their ramp positions on a log
    scale, so single-sighting cells and ~2,000-sighting cores both read against one
    legend
  - 'Theme-adaptive basemap: land fill and coastline tones switch with the chrome'
  - Equal hexagons with shared edges and thin page-colored outlines at 0.85 opacity,
    legend titled by the statistic drawn (Sightings)
  - Native tooltips in the HTML output show each cell's count and its centre longitude
    and latitude
  weaknesses:
  - 'CQ-04 (code): line 98''s comment says the projection is ''tuned to fit inner
    620×320 view'', but the chart is 800×450 with autosize fit → correct or drop the
    comment. Likely cause: a comment left from the old view size.'
  - 'Suggestion: assign each point to the nearer of the two candidate hex centres
    instead of rounding column and row separately, so points near a cell''s corners
    land in the cell that lies over them.'
  - 'Suggestion: draw country borders (the world-110m ''countries'' object) for more
    geographic context.'
