review:
  strengths:
  - 'imprint_seq with the theme''s fields stops: pale mint→navy on light, deep green→pale
    blue on dark, so the Seattle and Portland hotspots stand out in both themes'
  - sns.jointplot(kind='hex') with joint_kws C=richness and reduce_C_function=np.mean
    is the idiomatic seaborn path to mean aggregation
  - Colorbar in a dedicated axes outside the y-marginal keeps the joint and marginal
    axes aligned
  - 'Fully theme-adaptive chrome: all text readable on #FAF8F1 and #1A1A17, label
    boxes take ELEVATED_BG per theme'
  - Colorbar label names the statistic (Mean Species Richness)
  weaknesses:
  - 'VQ-02 (both): the boxed ''Seattle'' label sits on the top row of the Seattle
    hotspot cells and the WA, OR and Canada boxes cover hex cells, hiding the very
    cells the labels point to → place the labels where no cells are, or drop the boxes
    so cells stay visible. Likely cause: ax.text positions (-122.33, 47.83), (-119.0,
    48.5/44.5), (-125.6, 49.15) with bbox_props.'
  - 'VQ-01 (both): colorbar tick labels at 7 pt, below the style guide''s 8 pt tick
    reference → 8 pt (+1 pt). Likely cause: cbar.ax.tick_params(labelsize=7).'
  - 'SC-01 (both): marginal histograms of longitude and latitude are drawn although
    the spec asks for a hexbin map only → draw the hexbin on a single axes (e.g. ax.hexbin
    or JointGrid without marginals). Likely cause: sns.jointplot marginals.'
  - 'SC-02 (both): the base map is a 9-vertex coastline and two border lines without
    Puget Sound or Vancouver Island, thin geographic context for the ''base map of
    coastlines'' property (C4) → a more detailed coastline polyline. Likely cause:
    coast_lon/coast_lat lists.'
  - 'DQ-03 (both): the broad background Gaussian (sd 1.4° lon) places many land-bird
    observations far offshore west of the drawn coastline (lon -126 to -124.5) → keep
    generated points on land (narrower spread or clip at the coast). Likely cause:
    np.random.normal(center_lon, 1.4, n_points).'
  - 'Suggestion: demonstrating the count default alongside mean would show the aggregation
    choice.'
