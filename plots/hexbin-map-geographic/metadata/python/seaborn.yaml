review:
  strengths:
  - Single-axes ax.hexbin with gridsize rows derived from the latitude-corrected aspect,
    so hexagons are regular on screen over a map that is not stretched
  - Base map covers the Pacific coast, Strait of Juan de Fuca, Puget Sound, Vancouver
    Island and dashed US-Canada and WA-OR borders, drawn over the translucent cells
    so it reads in both themes
  - Observations clipped to land with np.interp against the coastline, so no cells
    sit offshore
  - Current imprint_seq fields stops per theme with a colorbar that names the statistic
    (Mean Species Richness)
  - City labels on empty ground with thin leaders to the Seattle and Portland hotspots;
    no boxes covering data
  weaknesses:
  - 'VQ-06 (both): the x-axis title ''Longitude (°W)'' is paired with negative tick
    values (−126 … −118), so the ticks read as −126 °W = 126 °E → either ''Longitude
    (°)'' with signed ticks or ''°W'' with positive tick labels (126 … 118). Likely
    cause: ax.set_xlabel(''Longitude (°W)'') with untransformed negative longitudes.'
  - 'Suggestion: a second panel or a count-aggregated variant would show the aggregation
    choice the Notes describe.'
  - 'Suggestion: closing the Vancouver Island outline at its northern end would make
    the island read as land rather than two open lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and axes, square 2400x2400 canvas.
      Chrome: dark title 'hexbin-map-geographic · python · seaborn · anyplot.ai' (~76% width), axis titles 'Longitude (°W)' / 'Latitude (°N)', INK_SOFT ticks, L-shaped spines, colorbar 'Mean Species Richness' with 1.5-3.5 ticks; italic 'Seattle'/'Portland' with leaders, 'Canada', 'WA', 'OR' labels. All readable.
      Data: ~28-column hexbin grid over the Pacific NW, pale mint → brand green #009E73 → deep blue → dark violet; darkest violet cells at Seattle and Portland, mostly green interior, sparse fringe cells with gaps. Dark grey coastline, Strait, Puget Sound and Vancouver Island lines, dashed 49°N and WA-OR borders drawn over the cells.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
