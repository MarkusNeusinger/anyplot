review:
  strengths:
  - 'True data-space hexagons: pygal''s circle markers are replaced by flat-top hexagons
    computed from the bin geometry, tiling a regular grid with shared edges'
  - Equal-distance aspect correction (cos of mean latitude) keeps both California's
    shape and the hexagons undistorted
  - imprint_seq fields stops per theme, sampled with ramp_color, with page-colored
    cell borders; the outline shows through the 0.8-opacity cells
  - Legend names the statistic and the observed count range of each class
  - Tooltips carry count, FRP sum, FRP mean and coordinates per cell in the HTML output
  - Realistic wildfire-hotspot scenario around five real California fire regions
  weaknesses:
  - 'CQ-01 (code): three helper functions besides the mandated ramp_color — build_chart
    (lines 199–235, called twice at 266 and 272), fit_axes (238) and circles_to_hexagons
    (248) — plus a probe render to measure the plot area break the flat Imports →
    Data → Plot → Save flow → inline the chart build once and the SVG rewrite as top-level
    statements. Likely cause: the two-pass equal-aspect fit wrapped in functions.'
  - 'Suggestion: a faint outline of the neighbouring states or the Pacific coast beyond
    California would give the cells that spill past the border more geographic context.'
  - 'Suggestion: the legend sits close to the bottom edge; a little more bottom margin
    would let it breathe.'
