review:
  strengths:
  - 'True data-space hexagons: pygal''s circle markers are replaced by flat-top hexagons
    computed from the bin geometry, tiling a regular grid with shared edges'
  - Equal-distance aspect correction (cos of mean latitude) keeps California's shape
    and the hexagons undistorted
  - imprint_seq fields stops per theme sampled with ramp_color, with page-colored
    cell borders; the outline shows through the 0.8-opacity cells
  - Legend names the statistic and the observed count range of each class
  - Tooltips carry count, FRP sum, FRP mean and coordinates per cell in the HTML output
  - Realistic wildfire-hotspot scenario around five real California fire regions
  weaknesses:
  - 'Suggestion: a faint outline of the neighbouring states or the Pacific coastline
    beyond California would give the cells that spill past the border more geographic
    context.'
  - 'Suggestion: the legend row sits close to the bottom edge; a little more bottom
    margin would let it breathe.'
