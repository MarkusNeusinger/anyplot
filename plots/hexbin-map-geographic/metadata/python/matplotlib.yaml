review:
  strengths:
  - Hand-built base map with water and simplified coastline polygons for NJ, Manhattan,
    the Bronx and Long Island gives geographic context in theme-adapted tones
  - 'Correct imprint_seq fields stops per theme: pale mint to navy on light, deep
    green to pale blue on dark'
  - ax.hexbin with C and reduce_C_function=np.mean aggregates natively; GRIDSIZE and
    extent make the hexagon size configurable
  - Degree-formatted °W/°N ticks via FuncFormatter add cartographic polish
  - Every chrome element (ticks, labels, colorbar, spines, annotation boxes) flips
    correctly between themes
  weaknesses:
  - 'DQ-01 (both): the color encodes the mean of i.i.d. exponential fares, so cell
    colors are noise with no spatial structure and single-trip cells produce the extremes
    → generate fares that depend on location (e.g. trip distance from the pickup)
    so the aggregated value shows a pattern. Likely cause: FARE = np.random.exponential(15,
    n_points) + 5 independent of position.'
  - 'DQ-02 (both): roughly a third of the ''Manhattan'' cluster''s pickups land in
    New Jersey west of the Hudson (dense cells at about 74.03-74.01°W), an implausible
    taxi hot spot → keep the Manhattan cluster inside the Manhattan outline (e.g.
    accept only Manhattan-polygon points for that cluster). Likely cause: one shared
    on-land test over all LAND polygons with lon spread 0.015 around -73.985.'
  - 'Suggestion: placing each borough label over its own borough (the Manhattan box
    sits over the East River) would read more naturally.'
  image_description: |-
