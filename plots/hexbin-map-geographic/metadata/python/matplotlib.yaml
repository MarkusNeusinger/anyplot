review:
  strengths:
  - Hand-built base map with water and simplified coastline polygons for New Jersey,
    Manhattan, the Bronx and western Long Island, in theme-adapted water and land
    tones, gives geographic context the translucent cells (alpha 0.65) let show through
  - ax.hexbin with C, reduce_C_function=np.mean, extent and mincnt aggregates natively,
    and GRIDSIZE makes the hexagon size configurable
  - 'The hexbin uses the style guide''s imprint_seq fields stops in both themes: pale
    mint to deep blue and violet on light, dark olive to brand green to pale blue
    on dark'
  - Fare grows with the distance from Midtown, so the mean-fare cells show a clear
    spatial gradient from Manhattan to outer Queens and southern Brooklyn
  - Each cluster is rejection-sampled inside its own borough outline with Path.contains_points,
    so pickups sit on plausible land
  - Degree-formatted °W/°N ticks via FuncFormatter, and every chrome element flips
    correctly between themes
  weaknesses:
  - 'Suggestion: placing the Manhattan label over Manhattan itself (its box sits over
    the East River at the (25, 19) pt offset) would read more naturally.'
  - 'Suggestion: the colorbar label ''Mean Trip fare ($)'' mixes capitalisation; ''Mean
    trip fare ($)'' would read more cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map area light-blue water with beige land polygons (New Jersey, Manhattan, the Bronx, western Long Island) and grey coastline outlines
