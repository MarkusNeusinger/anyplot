      Data: about 550 translucent hexagons (alpha 0.65, thin grey edges) over Manhattan, Brooklyn and Queens; pale mint in Midtown Manhattan grading through brand green to deep blue in southern Brooklyn and outer Queens, a few dark violet cells at the far ends; coastlines visible through the cells; three borough label boxes
      Legibility verdict: PASS

