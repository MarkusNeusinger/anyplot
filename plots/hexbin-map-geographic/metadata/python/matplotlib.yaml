review:
  strengths:
  - Hand-built base map with water and simplified coastline polygons for NJ, Manhattan,
    the Bronx and Long Island gives geographic context in theme-adapted tones
  - ax.hexbin with C and reduce_C_function=np.mean aggregates natively; GRIDSIZE and
    extent make the hexagon size configurable
  - Fare grows with distance from Midtown, so the mean-fare colors show a clear spatial
    gradient from Manhattan to outer Queens and southern Brooklyn
  - Each cluster is rejection-sampled inside its own borough outline with Path.contains_points,
    so pickups sit on plausible land
  - Degree-formatted °W/°N ticks via FuncFormatter and every chrome element flipping
    correctly between themes
  weaknesses:
  - 'VQ-07 (both): the hexbin colormap uses outdated SEQ_FIELDS stops (light: #4467A3
    at 0.582 and #002850 at 1.0; dark: #00573D at 0 and #009E73 at 0.467) instead
    of the style guide''s imprint_seq fields stops → light (0, #66E2B2), (0.369, #009E73),
    (0.803, #024582), (1, #351E45); dark (0, #404C02), (0.487, #009E73), (1, #CDD9FF).
    Likely cause: the SEQ_FIELDS lists at the top of the file.'
  - 'Suggestion: placing the Manhattan label over Manhattan itself (its box sits over
    the East River at the (25, 19) pt offset) would read more naturally.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map area light-blue water with beige land polygons (NJ, Manhattan, Bronx, Long Island) and grey coastline outlines
      Chrome: title, Longitude/Latitude axis titles, degree ticks and colorbar 'Mean Trip fare ($)' (about 12-65) in dark ink, all readable
      Data: about 550 translucent hexagons (alpha 0.65) over Manhattan, Brooklyn and Queens; pale mint in Midtown Manhattan grading through green to slate blue in southern Brooklyn and outer Queens; no cells in New Jersey; coastlines visible through cells; three borough label boxes
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; dark navy water, dark olive land, light grey coastlines
      Chrome: title, axis titles, ticks and colorbar text light, readable; no dark-on-dark
      Data: same cells with the dark ramp (deep green in Manhattan, brand green in Brooklyn/western Queens, pale blue-grey in the outer cells); borough boxes on dark elevated fill with light text
      Legibility verdict: PASS
