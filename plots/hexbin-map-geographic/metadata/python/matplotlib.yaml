review:
  strengths:
  - Hand-built base map with water and simplified coastline polygons for NJ, Manhattan,
    the Bronx and Long Island gives real geographic context in theme-adapted tones
  - 'Correct imprint_seq fields stops per theme: pale mint to navy on light, deep
    green to pale blue on dark'
  - ax.hexbin with C and reduce_C_function=np.mean aggregates natively; GRIDSIZE and
    extent make the hexagon size configurable
  - Degree-formatted °W/°N ticks via FuncFormatter add cartographic polish
  - Every chrome element (ticks, labels, colorbar, spines, annotation boxes) flips
    correctly between themes
  weaknesses:
  - 'VQ-02 (both): the bold Manhattan, Brooklyn and Queens label boxes (alpha 0.88)
    hide about 4-5 hex cells each in the densest part of the map → let the cells show,
    e.g. a box alpha of about 0.6 or a smaller font so each label covers 1-2 cells.
    Likely cause: annotate bbox alpha=0.88 at fontsize=9 bold.'
  - 'SC-02 (both): under the dense cells the coastlines and rivers barely show through
    at alpha 0.85, against C4''s ''translucent enough for its features to show through''
    → hexbin alpha about 0.6-0.7 (-0.15 to -0.25). Likely cause: hexbin alpha=0.85.'
  - 'DQ-02 (both): many simulated pickups and their cells sit in the Hudson and the
    East River, where no taxi trip starts → draw the points so they fall on land (e.g.
    reject points outside the land polygons). Likely cause: unconstrained np.random.normal
    clusters.'
  - 'CQ-04 (code): lines 174-175 compute title_fs from the title length, but the 57-char
    title always yields 12 → fontsize=12 directly. Likely cause: copied size-scaling
    boilerplate.'
  - 'Suggestion: a count-based or more structured fare field (e.g. airport trips costlier)
    would give the color a spatial story.'
