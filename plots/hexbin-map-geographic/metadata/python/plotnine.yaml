  strengths:
  - Imprint sequential field ramp with the theme's own stops, sqrt-transformed so
    the skewed counts spread across it
  - coord_fixed(ratio=1/cos(mid-latitude)) and binning in stretched x keep the hexagons
    regular on screen over a proportional map
  - 'Theme-specific base-map tokens: the state is lighter than the surrounding terrain
    in light mode and lifted from it in dark mode, and the outline shows through the
    alpha-0.88 cells'
  - 'Clean Data block and column constants: the binning reads only df and HEX_COLUMNS,
    so the hex size is one constant'
  weaknesses:
  - 'Suggestion: the colorbar labels only 100 and 200; explicit breaks (e.g. 10, 50,
    100, 200) would let the pale low end be read off too'
  - 'Suggestion: the city labels cover one or two cells each; placing them beside
    their clusters would keep every cell visible'
  - 'Suggestion: IMPRINT_PALETTE (line 41) is defined but never used and can go'
