review:
  strengths:
  - 'Idiomatic Bokeh hexbin pipeline: hexbin() -> hex_tile() with transform() and
    a LinearColorMapper on mercator axes'
  - Theme-switched CartoDB Positron / Dark Matter basemap gives street and coastline
    context through the 0.78-alpha cells
  - Realistic NYC taxi pickup scenario around real Manhattan hot spots
  - HoverTool exposes per-cell pickup counts in the interactive HTML
  weaknesses:
  - 'VQ-01 (dark): the colorbar title ''Pickup Count'' renders in light ink on a light
    grey colorbar panel and cannot be read → the panel on PAGE_BG so the INK title
    reads. Likely cause: ColorBar without background_fill_color, leaving bokeh''s
    light default.'
  - 'VQ-07 (dark): the colorbar panel is light grey in the dark render, wrong-theme
    chrome → background_fill_color=PAGE_BG (#1A1A17). Likely cause: ColorBar background_fill_color
    not set.'
  - 'VQ-07 (both): the cells use a two-stop #009E73 → #4467A3 ramp, the same in both
    themes, instead of imprint_seq with the theme''s fields stops → SEQ_FIELDS sampled
    at 256 steps with ramp_color. Likely cause: the hand-built c0/c1 linear ramp.'
  - 'Suggestion: an annotation for the Midtown peak would give the map a focal point.'
  - 'Suggestion: a value column with a sum or mean aggregation switch would show the
    other aggregation methods the Notes mention.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; plot area filled by the CartoDB Positron basemap of the NYC area with place names (Newark, Jersey City, New York, Queens).
      Chrome: bold dark title 'hexbin-map-geographic · python · bokeh · anyplot.ai'; 'Longitude' / 'Latitude' in dark ink; degree ticks in dark grey; subtle grid; colorbar on the right with bold 'Pickup Count' title and 20-140 labels, on a near-white panel. All readable.
      Data: regular hexagon grid over Manhattan at alpha 0.78, colored by a two-stop ramp from brand green #009E73 (low) to blue #4467A3 (high); the low and high ends are close in lightness, so the cores read only as a slightly bluer patch.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; plot area filled by the CartoDB Dark Matter basemap.
      Chrome: title, axis titles and ticks in light ink, readable. The colorbar sits on a light grey panel (bokeh's default fill, not the page color): its light-ink 'Pickup Count' title is near-invisible on that panel and the grey tick labels read weakly.
      Data: same hex grid and the same green-to-blue two-stop ramp as the light render (not the dark fields stops); cores are a muted blue patch.
      Legibility verdict: FAIL (colorbar title unreadable on the light panel)
