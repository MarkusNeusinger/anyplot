review:
  strengths:
  - 'geom_hex computes the hexagonal binning natively (bins=[40, 40]): equal hexagons
    with shared edges at a size that shows each cluster''s shape'
  - imprint_seq fields ramp with the theme's stops sampled by ramp_color for scale_fill_gradientn,
    with a log10 transform and a 'Pickup Count' colour bar
  - Square canvas with a map window computed from the basemap extent, so boroughs
    and clusters fill the canvas
  - Manhattan cluster follows the island's NNE axis inside the outline; translucent
    hexes let the borough outlines show through
  - layer_tooltips hover counts in the HTML export; seeded flat script with only used
    imports
  weaknesses:
  - 'DQ-02 (both): a few pale fringe cells still sit over water beyond the drawn outlines
    — the LGA cluster''s top cells (about lat 40.79–40.80, lon −73.88) lie north of
    the Queens edge (~40.785), and two Manhattan cells near lon −74.01, lat 40.69
    lie in the harbour below the island''s tip → keep every cell on land: move the
    LGA centre about −0.004° lat south (40.765 → 40.761) and trim the Manhattan lat
    sd 0.018 → about 0.016. Likely cause: lga_lat centre 40.765, manhattan_lat sd
    0.018.'
  - 'Suggestion: the tooltip could add cell coordinates next to the count, as the
    Notes list.'
  - 'Suggestion: coord_map() (or ratio ≈ 1.32) would show the boroughs with their
    true proportions.'
