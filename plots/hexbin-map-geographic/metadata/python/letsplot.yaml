review:
  strengths:
  - 'geom_hex computes the hexagonal binning natively (bins=[40, 40]): equal hexagons
    with shared edges, a size that shows each cluster''s shape'
  - imprint_seq fields ramp with the theme's current stops sampled by ramp_color for
    scale_fill_gradientn, with a log10 transform and a 'Pickup Count' colour bar
  - Square canvas with a map window computed from the basemap extent, so the boroughs
    and clusters fill the canvas
  - Manhattan cluster follows the island's NNE axis; translucent hexes over borough
    polygons whose outlines show through
  - layer_tooltips hover counts in the HTML export; seeded flat script with only used
    imports
  weaknesses:
  - 'DQ-02 (both): the Manhattan band''s south-west cells (about lat 40.68–40.70,
    lon −74.03 to −74.01) lie south and west of the drawn Manhattan outline over the
    harbour, and the LGA cluster''s top rows (above lat ~40.79) lie north of the Queens
    outline over the water, so pickups read as off-shore → centre the Manhattan cluster
    about +0.008° lon east and cut its lat spread (sd 0.025 → about 0.02), and move
    the LGA centre about −0.008° lat south. Likely cause: manhattan_lon offset −73.987
    with lat sd 0.025, lga_lat centre 40.773.'
  - 'Suggestion: the tooltip could add cell coordinates next to the count, as the
    Notes list.'
  - 'Suggestion: coord_map() (or ratio ≈ 1.32) would show the boroughs with their
    true proportions.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400x2400 square canvas.
      Chrome: title 'NYC Taxi Pickups · hexbin-map-geographic · python · letsplot · anyplot.ai' in dark ink at top-left (~74 % of width), axis titles 'Longitude (°)' / 'Latitude (°)', dark-grey ticks (-74 … -73.7, 40.55 … 40.9), subtle muted grid, full panel frame; horizontal 'Pickup Count' colour bar (log ticks 1, 10, 100) in a cream box under the map. All readable, no collisions.
      Data: three hex clusters — a narrow NNE band along Manhattan with dark-violet cores, a round LGA cluster and an oval JFK cluster — on the imprint_seq light fields ramp (pale mint fringe → brand green #009E73 → deep blue → dark violet), over translucent light-grey Manhattan, Brooklyn and Queens polygons whose outlines show through the hexes. Some Manhattan cells spill south-west of the outline, LGA's top rows sit north of Queens.
      Legibility verdict: PASS

