review:
  strengths:
  - geom_hex computes the hexagonal binning natively (bins=[40, 40]) — equal hexagons
    with shared edges, balanced between detail and aggregation, over all four pickup
    clusters
  - imprint_seq fields ramp with the theme's own stops (sampled at 256 steps with
    ramp_color for scale_fill_gradientn) and a log10 colour transform with a 'Pickup
    Count' legend
  - 'Correct theme adaptation: whole canvas painted with the page colour through the
    one-panel gggrid; all chrome readable in both renders'
  - Translucent hexes (alpha 0.85) layered over translucent borough polygons, plus
    layer_tooltips hover counts in the HTML export
  - Seeded, flat script with column constants and only used imports
  weaknesses:
  - 'VQ-02 (both): the bottom-left corner tick labels ''40.55'' (y) and ''-74.05''
    (x) run into each other at the panel origin → keep the corner ticks apart by at
    least a few px, e.g. y limits/breaks that do not end on the x-axis corner. Likely
    cause: coord_fixed ylim=[40.55, 40.90] placing a y break exactly at the bottom
    edge next to the first x break.'
  - 'VQ-05 (both): the near-square map (0.37° × 0.35° at ratio 1) fills only about
    the middle half of the 3200×1800 landscape canvas, with roughly 450 px empty page
    on each side → a square 2400×2400 canvas (ggsize(600, 600)) or a lon/lat window
    whose shape matches the landscape canvas. Likely cause: ggsize(800, 450) combined
    with coord_fixed(ratio=1.0, xlim=[-74.05, -73.68], ylim=[40.55, 40.90]).'
  - 'DQ-02 (both): the Manhattan pickup cluster (centre -73.985, lon sd 0.015) puts
    about half its cells west of the drawn Manhattan outline, over the unmapped Hudson/New
    Jersey side, so pickups read as off-island → centre the cluster on the island
    (about -73.97) with a narrower lon spread. Likely cause: manhattan_lon = np.random.normal(-73.985,
    0.015, ...).'
  - 'Suggestion: coord_map() (or ratio ≈ 1/cos(40.7°) ≈ 1.32) would show the boroughs
    with their true proportions.'
  - 'Suggestion: the tooltip could add cell coordinates next to the count, as the
    Notes list.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas (one-panel gggrid paints the strips beside the fixed-aspect map).
      Chrome: title 'NYC Taxi Pickups · hexbin-map-geographic · python · letsplot · anyplot.ai' in dark ink, axis titles 'Longitude (°)' / 'Latitude (°)', dark-grey ticks, subtle muted grid, full panel border; legend 'Pickup Count' (log10 ticks 1, 10, 100) in a cream frame on the right. All readable; the corner ticks '40.55' and '-74.05' touch at the bottom-left.
      Data: four clusters (Manhattan, Midtown overlap, LGA, JFK) of equal hexagons on the imprint_seq light fields ramp — pale mint fringe cells through brand green #009E73 to blue and navy cores — over translucent light-grey borough polygons (Manhattan sliver, Brooklyn, Queens). The map fills the middle half of the canvas.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the whole canvas.
      Chrome: light title and axis titles, light-grey ticks, subtle grid, legend in a dark elevated frame with light text. No dark-on-dark text.
      Data: same cell geometry; the continuous ramp uses the dark fields stops (deep green fringe → brand green → pale blue cores), so high counts stand out from the dark page. Borough polygons dark grey with mid-grey outlines, still visible.
      Legibility verdict: PASS
