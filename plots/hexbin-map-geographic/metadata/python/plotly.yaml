review:
  strengths:
  - Map view fitted to the extent of all hexagon corners (center and Web Mercator
    zoom computed from the ring bounds), so every binned cell is in frame
  - Per-cluster fare levels make the mean-fare colour show a real spatial pattern
    across the pickup clusters
  - Vectorized axial (cube-rounded) hex binning and GeoJSON polygon construction on
    the current MapLibre choropleth_map API
  - Imprint sequential field ramp with per-theme stops; title, colorbar box, ticks
    and the CARTO basemap all flip with the theme
  - Library-native hover tooltips with $-formatted mean and total fare and comma-formatted
    trip counts in the HTML
  weaknesses:
  - 'DQ-02 (both): a contiguous band of pickup cells lies over the Hudson River between
    Fort Lee/North Bergen and Manhattan, where no taxi pickup can occur → keep the
    generated pickup points on land. Likely cause: cluster centers drawn uniformly
    within ±0.10° lon of Times Square with 0.02° lon spread, ignoring the river.'
  - 'Suggestion: the MapLibre attribution box keeps its light-grey default in the
    dark render; a theme-matched attribution would sit more quietly on the dark page.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around a carto-positron street basemap (Clifton, Newark, Fort Lee, North Bergen, Union City, New York labels).
      Chrome: title 'NYC Taxi Fares · hexbin-map-geographic · python · plotly · anyplot.ai' centered in dark ink; colorbar 'Avg Fare ($)' with $10–$50 ticks on an elevated warm-white box with a soft border — all readable.
      Data: ~300 pointy-top hexagons at opacity 0.75 with dark 1.5 px borders, all in frame, colored with the light Imprint field ramp (#66E2B2 → #009E73 → #4467A3 → #002850): a blue high-fare cluster in the west, mint low-fare cells in the north, teal mid-range cells to the south; streets show through.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page around a carto-darkmatter basemap with light place labels.
      Chrome: title in light ink, colorbar box in #242420 with light ticks and title — no dark-on-dark text.
      Data: same hexagons with light translucent borders, colored with the dark field stops (#00573D → #009E73 → #CDD9FF) as the continuous ramp should; high-fare west cluster now pale blue; brand green present.
      Legibility verdict: PASS
