review:
  strengths:
  - Vectorized axial (cube-rounded) hex binning and GeoJSON polygon construction on
    the current MapLibre choropleth_map API
  - Imprint sequential field ramp with per-theme stops; all chrome (title, colorbar
    box, border, ticks) and the CARTO basemap flip with the theme
  - 'All Notes met: configurable HEX_SIZE, count/sum/mean aggregation in the hover,
    opacity 0.75 over the basemap, colorbar naming the statistic'
  - Library-native hover tooltips with $-formatted mean and total fare and comma-formatted
    trip counts in the HTML
  weaknesses:
  - 'SC-03 (both): the hexagons run off the map viewport on all four sides, so part
    of the binned data is outside the view → fit the map view to the data extent so
    every cell is in frame. Likely cause: fixed zoom=11 in px.choropleth_map instead
    of a zoom derived from the lat/lon span.'
  - 'DQ-01 (both): the color is the mean of i.i.d. exponential fares, so neighbouring
    cells differ only by noise and no spatial pattern is visible (C2) → generate fares
    that vary with location (e.g. a per-cluster fare level) or color by trip count.
    Likely cause: FARE drawn as rng.exponential(15, n_points) + 5 independent of the
    cluster.'
  - 'Suggestion: a slightly smaller HEX_SIZE would show the eight pickup clusters
    with more internal detail.'
