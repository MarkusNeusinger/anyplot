review:
  strengths:
  - Fruchterman-Reingold layout with a fixed seed separates the three teams into distinct
    clusters joined by sparse bridge edges, showing the irregular structure of a real
    network
  - Node size scaled to a range that keeps every node in the dense Engineering and
    Marketing clusters distinguishable
  - Edges thinner and lighter than the nodes, with width and opacity encoding friendship
    weight, so weak inter-team bridges recede
  - One-panel gggrid wrapper paints the page color across the whole square canvas
    in both themes
  - Imprint palette in canonical order with theme-adaptive edge ink, legend fill and
    text
  - layer_tooltips() exposes team and connection count per node in the HTML view;
    edges carry no tooltip
  weaknesses:
  - 'SC-02, SC-04 (both): node size encodes degree and edge width/opacity encode weight,
    but no legend or caption says so (C4) → a size key or a short caption naming degree
    for node size and weight for edge width. Likely cause: scale_size_identity(guide="none")
    and scale_alpha_identity(guide="none") with no caption in labs().'
  - 'SC-02 (both): no node carries a label, so the hubs (largest nodes in each team)
    are anonymous (C5) → label the few highest-degree nodes with a geom_text/geom_label
    layer, readable clear of the clusters. Likely cause: no node names in the data
    and no text layer.'
  - 'Suggestion: give legend_key the elevated legend fill so the darker key column
    inside the legend box disappears, most visibly on the dark render.'
  - 'Suggestion: vectorize the repulsion loop with numpy broadcasting to shorten the
    layout block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, no white strips.
      Chrome: bold title "network-force-directed · python · letsplot · anyplot.ai" in dark ink at top left, about 80% of the width; no axes, ticks or grid. Legend "Team" in an elevated #FFFDF6 box at upper left with Engineering, Marketing, Sales entries in INK_SOFT; a slightly greyer key column sits inside the box.
      Data: 50 nodes in three clusters - Engineering green #009E73 (top right), Marketing lavender #C475FD (bottom right), Sales blue #4467A3 (left/center) - sized by degree; grey edges with weight-scaled width and opacity, lighter bridges between teams. Nodes in clusters overlap partially but each is distinguishable. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full canvas, no white strips.
      Chrome: title in light ink #F0EFE8, legend box #242420 with light title and INK_SOFT entries; the key column is darker than the box. No dark-on-dark text.
      Data: node colors identical to the light render; edges flip to light ink with the same weight-scaled opacity and remain thinner and lighter than the nodes. Brand green clearly visible.
      Legibility verdict: PASS
