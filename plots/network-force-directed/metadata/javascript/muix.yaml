review:
  strengths:
  - 'Genuine Fruchterman-Reingold force simulation with a fixed-seed LCG start: connected
    researchers cluster tightly, unconnected fields sit apart, and no axes or grid
    are drawn'
  - 'One property per channel, all explained: color = research field (legend), node
    size = degree, edge width = co-authored papers (caption)'
  - Hub labels on page-colored plates stay readable among converging edges in both
    themes; peripheral nodes stay unlabeled to avoid clutter
  - Edges are thin, translucent inkSoft lines, clearly lighter than the nodes, and
    page-colored node outlines keep marks separated in light and dark
  - Custom SVG overlay drawn through MUI X's useXScale/useYScale hooks inside ChartsContainer,
    with skipAnimation and hidden v9 axes
  weaknesses:
  - 'SC-03 (both): the seven cross-group edges are drawn at a fixed 1.2 px regardless
    of weight (1-2 papers), while the caption states edge width = co-authored papers
    → scale bridge widths by wRatio like the intra-group edges (dash pattern and lower
    opacity can stay). Likely cause: strokeWidth={edge.isBridge ? 1.2 : 1.1 + edge.wRatio
    * 2.2}.'
  - 'VQ-01 (both): the encoding caption is set at 13 px and becomes about 4 px in
    the 400 px thumbnail, below the 14-15 px of legend and hub labels → about 15 px
    (+2 px). Likely cause: caption div fontSize: 13.'
  - 'VQ-05 (both): the tall layout spans only about 55 % of the square canvas width,
    leaving roughly 22 % empty bands on each side → rotate the layout to its principal
    axis or pad less so the network fills about 80 % of the width. Likely cause: square
    domain built from the larger (vertical) raw span with PAD_SHARE = 0.14.'
  - 'DQ-02 (both): every field follows the same template (member 0 tied to all others
    plus a short chain; bridges almost all hub-to-hub) and node IDs are ML-0..CR-5
    → vary hub degree and add a few member-to-member bridges so the data reads like
    a real co-authorship network. Likely cause: the templated edge list in the data
    block.'
  - 'Suggestion: render the legend with MUI X''s ChartsLegend instead of hand-built
    HTML spans.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
      Chrome: bold dark title "network-force-directed · javascript · muix · anyplot.ai" top-left (~57 % width); a one-row legend below it (Machine Learning, Robotics, Bioinformatics, Network Science, Cryptography) in inkSoft gray; a centered caption at the bottom explaining node size = degree, halo & label = hub, edge width = co-authored papers, dashed = cross-group link. No axes or grid. All text readable; the caption is the smallest text.
      Data: 32 nodes in five clusters: green Machine Learning (center right, first group = #009E73), lavender Robotics (top), blue Bioinformatics (upper left), ochre Network Science (lower left), red Cryptography (bottom). Each cluster has one larger hub with a translucent halo and a dark label on a cream plate. Intra-group edges are gray, width varying with weight; seven dashed faint gray bridges link the clusters. The network spans about 55 % of the canvas width with empty side bands.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, legend and caption in light gray inkSoft, hub labels in light ink on dark plates. No dark-on-dark text anywhere.
      Data: node colors identical to the light render; node outlines flip to the dark page color; edges remain visible as mid-gray translucent lines, halos remain visible as darker tints of each group hue. Layout is identical.
      Legibility verdict: PASS
