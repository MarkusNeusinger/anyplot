review:
  strengths:
  - Bespoke Fruchterman-Reingold force simulation implemented in-browser with a deterministic
    seeded LCG, producing a clean, well-separated 5-community layout with a natural
    bridge structure between hubs.
  - Correct Imprint palette applied in canonical order (green/lavender/blue/ochre/red)
    across both themes; both backgrounds and all chrome (title, legend text, tick-free
    axes) are theme-correct in both light and dark renders.
  - 'Precise spec coverage: node radius scales by degree, edge stroke width scales
    by co-authorship weight, and labels are drawn only on hub nodes to avoid clutter
    — matching the specification''s Notes section exactly.'
  - 'Idiomatic MUI X usage: layers custom SVG (`GraphEdges`/`GraphNodes`) on top of
    `ChartContainer` via `useXScale`/`useYScale`, the correct community-surface pattern
    for a chart type with no built-in MUI X series.'
  - Excellent canvas utilization (~80% coverage) with balanced margins; no clipping,
    no overlap, and consistent square framing appropriate for a symmetric graph layout.
  weaknesses:
  - Title occupies only ~40% of the canvas width at the default 22px fontsize — below
    the ~50-70% guideline for a short custom title on a 2400x2400 canvas; a modest
    fontsize bump would give it more visual weight relative to the large square format.
  - Edge styling is uniform (single stroke-opacity=0.35 for every edge) — differentiating
    intra-group edges from the thin inter-group bridge edges (e.g. dashed strokes
    or a further-reduced opacity on bridges) would add another layer of storytelling
    about the network's modular structure.
  - MUI X is used purely as a coordinate-scale provider (ChartContainer + useXScale/useYScale)
    — correct for this unsupported chart type, but no MUI X-specific interactive affordance
    (tooltip, animated legend, etc.) is layered on top to showcase the library beyond
    its scale system.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "network-force-directed · javascript · muix · anyplot.ai" top-left in dark ink, fully legible. Legend row below it with 5 colored dot + label pairs (Machine Learning, Robotics, Bioinformatics, Network Science, Cryptography), all readable in dark secondary-ink text. No axes or grid (appropriate for a network graph).
      Data: Five clearly separated clusters of circular nodes joined by thin grey edges (stroke = inkSoft, alpha 0.35). First series (Machine Learning) renders in brand green #009E73, followed by lavender (Robotics), blue (Bioinformatics), ochre (Network Science), and matte red (Cryptography) — matching canonical Imprint order. Hub nodes are visibly larger (degree-scaled radius) and labeled with their group name in dark ink; edge thickness varies with co-authorship weight. Thin bridge edges connect hub-to-hub across clusters.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light ink (#F0EFE8 title, lighter secondary tone for legend labels) — fully legible against the dark surface. No dark-on-dark failures observed.
      Data: Node and edge colors are pixel-identical to the light render (same green/lavender/blue/ochre/red positions, same edge greys) — confirming the palette is theme-independent as required; only the chrome (title/legend ink, background) flips.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark text found.
