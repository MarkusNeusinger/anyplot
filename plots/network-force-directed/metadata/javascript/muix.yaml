review:
  strengths:
  - Genuine client-side Fruchterman-Reingold force simulation (300 iterations with
    a cooling schedule and mild centering gravity) — a real computed layout, not a
    static/fake one
  - 'Community structure reads instantly: five clearly separated clusters, hub nodes
    emphasized with a soft halo, larger radius, and a label so the viewer can find
    central nodes at a glance'
  - 'Correct Imprint palette: first series (Machine Learning) is brand green #009E73,
    remaining four groups follow canonical order 2-5, identical across both themes'
  - Deterministic reproducibility via a small fixed-seed LCG since the browser has
    no seeded RNG
  - Theme-adaptive chrome verified correct in both renders (warm off-white / near-black
    backgrounds, ink/inkSoft text, identical data colors)
  - Idiomatic and creative use of MUI X's ChartContainer + useXScale/useYScale extension
    hooks to render fully custom SVG layers — the correct fallback since community
    MUI X has no native graph/network chart type
  - Square canvas orientation is the right call for this radially symmetric multi-cluster
    layout
  - Both edge weight (line thickness) and node degree (node radius) are encoded visually
    per the spec's optional notes, and inter-group bridge edges are visually distinguished
    (dashed, lower opacity) from intra-group ties
  weaknesses:
  - 'LM-02: everything is drawn as bespoke <line>/<circle> SVG layered on ChartContainer;
    no native MUI X chart component or ChartsTooltip is ever touched, so distinctive
    library features (built-in tooltip/highlight interactions) go unused in the HTML
    output — an acceptable fallback given MUI X community has no graph chart, but
    it caps the library-mastery score'
  - No legend or annotation tells the viewer that edge thickness encodes co-authorship
    weight or that dashed edges mean an inter-group bridge — that mapping only exists
    in code comments, not in the chart itself
  - Aside from the hub halo, edges get little additional visual refinement (uniform
    gray stroke for all intra-group ties) — a touch more depth (e.g. weight-based
    opacity) would sharpen the design further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-force-directed · javascript · muix · anyplot.ai" in dark ink, top-left, clearly legible. Legend row below title shows 5 circular swatches + labels (Machine Learning, Robotics, Bioinformatics, Network Science, Cryptography) in dark secondary-ink text, all readable against the light background. Hub node labels (group names) render in dark ink above each hub circle, fully legible.
      Data: Five spatially separated node clusters, each a distinct Imprint color (green/lavender/blue/ochre/red) matching the legend swatches. Hub nodes are visibly larger with a soft halo ring. Edges are subtle gray, thicker near hubs (encoding weight/degree), with dashed lighter-opacity edges bridging clusters. First series (Machine Learning) is brand green #009E73 as required.
      Legibility verdict: PASS — no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and legend text render in light ink/inkSoft tones, clearly visible against the dark background. Hub labels are in light-colored text and remain legible over the dark surface.
      Data: Same five clusters in the identical Imprint hues as the light render (green/lavender/blue/ochre/red) — only the chrome (background, text, node stroke outline color which matches page background) flipped, confirming data-color consistency across themes. Edge styling (thickness/dash/opacity) also matches the light render's encoding.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black surface.
