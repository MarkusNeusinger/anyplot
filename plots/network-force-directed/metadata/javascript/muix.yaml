review:
  strengths:
  - Composes the network inside ChartsContainer with hidden linear axes and draws
    edges and nodes as a custom SVG overlay positioned through MUI X's useXScale/useYScale
    hooks, so the community package carries a chart type it has no ready component
    for
  - 'Deterministic Fruchterman-Reingold layout (seeded LCG start, 300 cooling iterations,
    weight-scaled attraction) separates the five research fields into clear communities
    with irregular, realistic structure: a Bioinformatics star, a Network Science
    loop with an outlier, a Cryptography chain'
  - The layout is rotated to the angle that fills the square drawing area best, so
    the network uses nearly the whole canvas without crowding
  - Node size encodes degree, edge width encodes co-authored papers, and a centered
    caption states every encoding; edges are thin, translucent ink and stay behind
    the nodes in both themes
  - Halos on the top hub of each field give the eye one anchor per community, and
    dashed cross-field edges make the bridges between communities readable
  - 'All chrome comes from ANYPLOT_TOKENS: title, legend, caption and hub labels flip
    correctly between the #FAF8F1 and #1A1A17 surfaces while the Imprint data colors
    stay identical'
  weaknesses:
  - 'VQ-02 (both): each hub label''s backing rectangle overlaps the top of its hub
    halo by about 3 px, flattening the halo''s top edge (clearly visible on Bioinformatics,
    Machine Learning and Cryptography) → keep the rectangle''s bottom edge at least
    2 px above the halo (raise it by about 5 px). Likely cause: rect y = yScale(y)
    - radius - 24 with height 20 ends 4 px above the node while the halo extends HUB_HALO_OFFSET
    = 7 px beyond it.'
  - 'Suggestion: label each hub with the researcher''s name (e.g. ''Okafor'') instead
    of the field name, which the color legend already gives, so the labels add information
    about the key nodes.'
  - 'Suggestion: render the field legend with MUI X''s ChartsLegend instead of a hand-built
    HTML row.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas, no axes or grid.
      Chrome: bold dark title "network-force-directed · javascript · muix · anyplot.ai" top-left (~55% of width); a horizontal legend row below it with five colored dots (Machine Learning, Robotics, Bioinformatics, Network Science, Cryptography) in soft dark ink; a centered caption at the bottom explaining node size = degree, halo & label = top hub, edge width = co-authored papers, dashed = cross-field link. Hub labels in dark ink on pale backing pills. All text readable.
      Data: 32 nodes in five communities: green #009E73 Machine Learning in the center, purple Robotics top, blue Bioinformatics left (a star around a large hub), ochre Network Science bottom (loop plus a peripheral node), red Cryptography right (trio trailing into a chain). Node radius scales with degree; each field's top hub carries a translucent halo and a field-name label. Edges are thin grey lines, width by weight; cross-field bridges are dashed and lighter. The label pills slightly cut the top of the hub halos.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no axes or grid.
      Chrome: title in light ink, legend labels and caption in light soft ink, hub labels in light ink on dark backing pills; no dark-on-dark text anywhere.
      Data: identical layout and identical Imprint node colors to the light render; node outlines switch to the dark page color, edges are mid-grey and still lighter than the nodes; halos are dimmer but visible. Brand green reads well.
      Legibility verdict: PASS
