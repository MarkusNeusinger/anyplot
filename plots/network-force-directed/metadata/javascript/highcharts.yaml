review:
  strengths:
  - 'Correct workaround for the missing networkgraph module: hand-rolled Fruchterman-Reingold
    force layout computed in-memory, exactly matching the guidance in prompts/library/highcharts.md,
    then plotted as plain scatter + line series'
  - Hub differentiation via a second visual channel (radius scaled by degree, heavier
    ink-colored stroke, selective dataLabels for degree >= 6) creates a clear visual
    hierarchy pointing to the central modules (logger, db-client, core-utils, config,
    user-service, cache)
  - Radial gradient node fill (Highcharts.color().brighten()) gives subtle depth without
    introducing extra hues, keeping the single-series palette rule intact
  - 'Both renders keep node/edge colors identical (#009E73 family) and correctly flip
    only chrome: node stroke uses t.ink (hub) / t.pageBg (leaf) in light and their
    dark-theme equivalents, title/subtitle/labels all readable in both themes'
  - Deterministic LCG-seeded layout (seed 42), no imports, single self-contained top-to-bottom
    script with no functions/classes
  - Title format exact, credits disabled, chart+series animation disabled, transparent
    background, no add-on modules used
  weaknesses:
  - The busiest central cluster (around db-client/logger/config) has heavy edge-line
    crossings that read as a mild 'hairball' — increasing the repulsion constant k
    slightly or lowering edge line opacity (e.g. Highcharts.color(t.grid).setOpacity(0.6))
    would declutter this region and sharpen the visual hierarchy further
  - 'Edge thickness is uniform (lineWidth: 1.5) for every connection; the spec allows
    edge thickness to optionally encode weight/connection strength, which would add
    a second data-storytelling channel (not required, but a missed opportunity for
    higher Design Excellence / Data Storytelling)'
  - Header comment block omits the '// License:' line that prompts/library/highcharts.md
    asks every Highcharts snippet to carry (commercial-license visibility) — cosmetic
    only, does not affect the rendered output, and is a repo-wide gap shared by most
    existing highcharts.js implementations rather than something unique to this PR
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold dark title "network-force-directed · javascript · highcharts · anyplot.ai" (~50% of canvas width, well within bounds) and a gray subtitle "Software module dependency graph — node size scales with degree", both clearly readable against the light background. No axes (intentionally hidden — correct for a force-directed layout). Edge lines render as subtle light-gray strokes.
      Data: 24 green (#009E73) circular nodes connected by 56 gray edges. Six hub nodes (core-utils, user-service, config, logger, db-client, cache) are visibly larger, carry a dark ink stroke, and are labeled in dark text directly above the node; the remaining 18 peripheral nodes are smaller, thin-stroked, and unlabeled (matches the spec guidance to label only key nodes). Node fills use a subtle radial gradient (light-to-brand-green) for depth. No text overlaps another text element or is clipped at the canvas edge (checked all four borders and the densest node cluster).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Same title/subtitle now in light/white text, clearly readable against the dark background — no dark-on-dark failures anywhere (title, subtitle, and all six hub labels checked individually). Edge lines remain a subtle mid-gray, still visible but not dominant.
      Data: Identical node/edge geometry and identical green (#009E73) data color to the light render — only chrome (background, title/label ink color, hub node stroke color, which flips from dark ink to a light stroke) adapts to the theme, exactly as required.
      Legibility verdict: PASS
