review:
  strengths:
  - Deterministic Fruchterman-Reingold force-directed layout computed in-memory with
    a seeded LCG (fully reproducible) — a genuine physics simulation, not a canned
    layout.
  - 'Both renders are fully theme-correct: Imprint brand green (#009E73) nodes identical
    across light/dark, correct #FAF8F1 / #1A1A17 backgrounds, and no dark-on-dark
    or light-on-light chrome failures.'
  - Hub nodes (core-utils, config, logger, db-client, cache, user-service) are sized
    and labeled by degree, giving the viewer an immediate read on which modules are
    structurally central.
  - Tooltip formatter reports connection counts per node, and the edge series correctly
    disables mouse tracking so tooltips only fire on nodes, not line segments.
  - Clean, well-commented code that explains every non-obvious decision (bounding-box
    centering vs. mean, hard boundary wall, cooling schedule) — a thoughtful workaround
    for Highcharts core lacking a networkgraph module.
  weaknesses:
  - 'Node markers use Highcharts'' default diamond symbol (inherited from series index)
    rather than an explicit marker.symbol choice — set symbol: ''circle'' explicitly
    so the shape reads as an intentional design decision, not a lucky default.'
  - Leaf nodes (degree=1) render at only ~6px radius on a 2400x2400 canvas, which
    is small for a sparse 24-node graph — raise the minimum radius (e.g. 8-9px) so
    peripheral nodes stay prominent per the data-density heuristic.
  - The layout leaves noticeable empty space in the top third of the canvas above
    the node cluster and in the far left/right corners (single stray edges) — tighten
    the gravity/bound parameters or reframe the extent so the graph fills a more even
    50-80% of the canvas.
  - 'Design Excellence sits at ''well-configured default'': edges are a single flat
    grey with no variation and node color doesn''t differentiate hub vs. leaf beyond
    size — consider a subtle stroke or opacity treatment on hub nodes for stronger
    visual hierarchy.'
  - Library Mastery is generic — the scatter+line combo is a reasonable workaround
    for the missing networkgraph module, but doesn't showcase Highcharts-distinctive
    capabilities (custom marker symbols, zones, gradient fills) beyond the tooltip
    formatter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-force-directed · javascript · highcharts · anyplot.ai" in bold dark ink (~50% of plot width, comfortably within range), subtitle "Software module dependency graph — node size scales with degree" in softer dark-grey below it. Hub node labels (core-utils, config, logger, db-client, cache, user-service) render in dark ink above their nodes. All text is clearly legible against the light background.
      Data: 24 diamond-shaped nodes in Imprint brand green (#009E73), connected by thin light-grey edge lines. Node size scales visibly with degree — "logger" and "db-client" are the largest, isolated leaf nodes are smallest. Layout is an organic force-directed spread with no overlapping clusters.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle text now rendered in light ink/grey, fully readable against the dark background. Hub node labels also flip to light text and remain legible — no dark-on-dark failures anywhere.
      Data: Node and edge colors are pixel-identical to the light render (#009E73 green nodes, same grey edge lines) — only the chrome (background, text) flipped as expected.
      Legibility verdict: PASS.
