review:
  strengths:
  - Genuine physics simulation (Fruchterman-Reingold with weighted edge attraction
    and gentle gravity centering) driven by a deterministic seeded LCG, not a static
    preset layout
  - Custom Chart.js plugins (beforeDatasetsDraw/afterDatasetsDraw) draw directional
    arrowheads and background-boxed hub labels on top of the scatter API — a distinctive
    use of the plugin lifecycle
  - 'Both spec-suggested encodings are present and legible: node radius scales with
    degree, edge thickness and opacity scale with coupling weight'
  - Correct Imprint palette in canonical order across the 4 architecture layers (green/lavender/blue/ochre),
    identical data colors between light and dark, theme-adaptive chrome (title, legend,
    hub-label boxes) throughout
  - Realistic, neutral software-dependency dataset with a clear layered structure
    (infrastructure to domain to application to UI) that plausibly explains the topology
  weaknesses:
  - The central checkout-svc/catalog-svc/domain-layer cluster has dense edge crossing
    that makes individual low-weight connections hard to trace — a slightly stronger
    repulsion constant or extra fade on low-weight edges would improve legibility
    there (VQ-03)
  - Only 3 of 24 nodes are labeled (the top hubs), which is correct per the spec's
    'label only key nodes' guidance, but the domain-layer node cluster is still visually
    crowded enough that a couple of markers nearly touch — a touch more spacing in
    that region would help
  - The `lcg` and `nodeRadius` helper functions move slightly away from the pure KISS
    'imports → data → plot → save' shape (CQ-01) — understandable given the force-directed
    math, but worth noting
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: title "network-force-directed · javascript · chartjs · anyplot.ai" in dark ink at top, clearly legible; bottom legend (Infrastructure/Domain/Application/UI) in dark text with matching swatches, clearly legible; three hub labels (catalog-svc, checkout-svc, user-svc) rendered in bold dark text on light background boxes that sit cleanly over the edges beneath them.
      Data: 24 circular nodes colored by layer — green (Infrastructure), lavender (Domain), blue (Application), ochre (UI) — sized by connection degree; gray directed edges with arrowheads point from dependent to dependency, thickness/opacity scaling with coupling weight. First series (Infrastructure) is the brand green #009E73 as required.
      Legibility verdict: PASS — all text is dark-on-light and fully readable; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: title, legend, and all three hub labels flip to light/off-white text, clearly legible against the dark background; hub-label background boxes flip to the dark page background so they still separate the label from the edges beneath.
      Data: node and edge colors are identical to the light render (same green/lavender/blue/ochre palette, same gray edges) — only the chrome (background, text, label-box fill) flipped, confirming theme-adaptive tokens are threaded correctly.
      Legibility verdict: PASS — no dark-on-dark text found; all labels and legend entries remain legible.
