review:
  strengths:
  - Implements a genuine Fruchterman-Reingold force-directed layout from scratch (deterministic
    fixed-seed LCG) since Chart.js has no native graph/network chart type — real physics
    simulation with 400 cooling iterations, not a faked layout.
  - Node radius scales with degree and edge thickness/opacity scale with coupling
    weight, directly satisfying the spec's optional degree- and weight-encoding notes.
  - Custom Chart.js plugins draw directed edges with arrowheads (beforeDatasetsDraw)
    and hub labels with theme-adaptive background pills (afterDatasetsDraw) for the
    top-3 highest-degree modules — matches the spec's guidance to label only key nodes
    in denser networks.
  - Correct canonical Imprint palette order across the 4 architecture layers (green/lavender/blue/ochre)
    with clean, theme-adaptive chrome; data colors are identical between light and
    dark renders.
  - Realistic, neutral dataset — a 24-node layered software dependency graph (Infrastructure/Domain/Application/UI)
    — matching the spec's own 'software dependencies' application example.
  - Title format, legend, mount-node contract (#container, single canvas), and animation:false
    are all followed correctly.
  weaknesses:
  - The hub area around catalog-svc/checkout-svc/user-svc and their shared infrastructure
    dependencies is visually dense — many edges cross at sharp angles and a few nodes
    sit close together, making individual dependency chains hard to trace at a glance;
    consider a slightly larger repulsion constant (k) or more iterations to open up
    the hairball.
  - The stabilized layout leaves noticeable empty space in the upper-right quadrant
    of the square canvas while most nodes cluster lower-left/center, giving a mildly
    unbalanced visual weight; a post-layout recentering pass (shift the centroid toward
    canvas center before computing xRange/yRange) would balance this better.
  - Only the top-3 hub nodes carry text labels; this matches the spec's guidance for
    larger networks but means the 21 remaining nodes are identifiable only via tooltip
    (fine for interactivity, but slightly limits the static PNG's standalone readability
    for viewers who can't hover).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white and not dark.
      Chrome: Title "network-force-directed · javascript · chartjs · anyplot.ai" reads clearly in dark ink at the top; the bottom legend ("Infrastructure", "Domain", "Application", "UI") is fully legible with matching colored point swatches; the three hub labels (catalog-svc, checkout-svc, user-svc) sit on a light background pill so they stay readable even over crossing edges.
      Data: Node fill colors are the canonical Imprint order — green (#009E73, Infrastructure), lavender/purple (Domain), blue (Application), ochre/amber (UI) — with a thin off-white/cream stroke around each marker for edge separation. Edges are gray, directional (small arrowheads pointing at the depended-upon module), with width/opacity scaled by coupling weight. Node radius scales visibly with degree — catalog-svc, checkout-svc, and user-svc are clearly the largest, and the labeled hubs.
      Legibility verdict: PASS — no text collides with other text, and all chrome and hub labels are readable against the light surface.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black and not light.
      Chrome: Title and legend text render in light ink, clearly legible against the dark surface; hub labels now sit on a dark background pill (theme-adaptive fill via t.pageBg) so there is no dark-on-dark or light-on-light failure.
      Data: Node and edge colors are pixel-identical to the light render — same green/lavender/blue/ochre categorical hues, same edge weighting and arrowheads, same layout coordinates — confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark text; all labels, ticks-equivalent chrome, and legend remain clearly visible.
