review:
  strengths:
  - Implements a genuine custom Fruchterman-Reingold force-directed layout (matrix-based
    repulsion/attraction, 400 iterations with cooling) since ggplot2 has no native
    graph layout and ggraph is out of scope
  - Node size correctly scales by degree and edge linewidth correctly scales by weight,
    both visibly differentiated across the graph
  - 'Correct Imprint categorical palette in canonical order (#009E73, #C475FD, #4467A3,
    #BD8233) for the four architectural layers, identical between light and dark renders'
  - 'Both renders are fully theme-correct: warm off-white / warm near-black backgrounds,
    all chrome (title, legend, hub labels) readable with proper contrast in both themes'
  - 'Hub-node labels (highest-degree nodes: orders, auth, gateway, mobile, web) create
    a clear visual focal point and guide the reader to the most connected services'
  - Realistic, neutral microservice dependency graph (Frontend/Backend/Data/Infra
    layers) with plausible intra- and cross-layer edges
  - 'Clean KISS-style script: single set.seed(42), only used imports (ggplot2, dplyr,
    ragg), correct ragg::agg_png save with theme-parameterized filename'
  weaknesses:
  - 'Hub-node labels overlap their own node markers: the ''auth'' label box sits directly
    on top of roughly half of the auth node circle, and the ''gateway'' label box
    covers part of the gateway node circle (both edges and both themes) — increase
    nudge_y further or switch to a repel-style offset so the label sits fully clear
    of its node.'
  - 'Canvas whitespace is imbalanced: the network fills the center but leaves a visibly
    empty band along the right edge and top-right corner (confirmed empty in a targeted
    right-edge crop) while the left/bottom margins are tighter — consider widening
    the x anchor spread or trimming scale_x_continuous expansion to rebalance.'
  - The lone degree-0 node (small dot with no visible edges, right of the Backend
    cluster near 'auth') renders very small and could be trivially confused for visual
    noise — a slightly larger minimum size or dropping true isolates would read cleaner.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-force-directed · r · ggplot2 · anyplot.ai" is dark, bold-weight-adjacent, centered, ~55-60% of canvas width, fully readable. Bottom legend "Layer" with four swatches (Frontend/Backend/Data/Infra) is dark text, clearly legible. Hub node labels (orders, auth, gateway, mobile, web) use dark bold text on a light label-box background — readable, though the auth and gateway boxes visibly overlap their own node's marker circle.
      Data: Four node clusters colored #009E73 (Frontend, green), #C475FD (Backend, lavender), #4467A3 (Data, blue), #BD8233 (Infra, ochre) — matches Imprint canonical order 1-4, first series is the brand green. Edges are muted gray with alpha, thickness scaled by weight; node size scaled by degree, largest nodes (gateway, orders, auth) clearly the visual hubs.
      Legibility verdict: PASS (all title/legend/label text reads clearly against the light background; the only defect is label boxes partially covering node markers, not text illegibility).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and legend text render in light off-white, fully legible against the dark background — no dark-on-dark failures observed. Hub node labels use light bold text on a dark label-box background, readable; same auth/gateway node-overlap issue as the light render.
      Data: Identical node/edge colors to the light render (#009E73, #C475FD, #4467A3, #BD8233 for the four layers) — confirms only chrome flipped between themes, data colors held constant.
      Legibility verdict: PASS (no dark-on-dark or light-on-light text failures in either theme; label/node overlap is a layout defect, not a legibility defect).
