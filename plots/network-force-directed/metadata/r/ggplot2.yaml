review:
  strengths:
  - Native ggplot2 implementation of a Fruchterman-Reingold force-directed layout
    computed from scratch — respects the library rule against falling back to ggraph
    or another plotting backend while still delivering a fully functional network
    graph via geom_segment/geom_point.
  - 'Meaningful dual data encoding: node size maps to degree, edge linewidth maps
    to weight.'
  - Realistic microservice-architecture dataset (Frontend/Backend/Data/Infra layers)
    with sensible, domain-plausible cross-layer connections (e.g. web/mobile/admin
    -> gateway -> auth/orders).
  - Top-5 hub nodes labeled directly on the plot, giving the reader an immediate focal
    point without cluttering the full node set.
  - Correct canonical Imprint palette (green/lavender/blue/ochre) with identical data
    colors between light and dark renders; only chrome (background, text, legend)
    flips theme-appropriately.
  weaknesses:
  - 'Unused import: library(tidyr) is loaded but no tidyr function (pivot_longer,
    unite, separate, complete, crossing, etc.) is called anywhere in the script —
    remove it.'
  - Several degree-0/degree-1 nodes render as very small dots (e.g. the isolated node
    above the Data cluster, the tiny Infra node near 'gateway') that are hard to spot,
    especially at mobile scale — raise the minimum of scale_size_continuous's range
    slightly so low-degree nodes stay visible.
  - The force-directed layout is diagonal (Frontend/top-right to Backend/bottom-left)
    and leaves noticeably empty triangular regions in the top-left and bottom-right
    canvas corners — consider tuning repulsion/temperature or the plot's aspect ratio
    so the layout fills the canvas more symmetrically.
  - 'Design Excellence is solid but not yet publication-grade: hub node labels sit
    directly on busy edge crossings in a couple of spots (e.g. ''auth''/''orders'')
    with no background halo, so contrast could be tightened further for extra polish.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-force-directed · r · ggplot2 · anyplot.ai" is centered, dark, fully readable. Hub node labels (mobile, web, gateway, orders, auth) are bold dark text, clearly legible against the light background and against the edge lines behind them. The horizontal "Layer" legend at the bottom (Frontend/Backend/Data/Infra) uses dark title text and slightly softer label text, both readable.
      Data: Four clearly distinguishable clusters colored via the Imprint palette in canonical order — green (Frontend), lavender (Backend), blue (Data), ochre (Infra). The green cluster (#009E73) is the visually anchored first series. Node size scales with degree (gateway and web are visibly the largest); edge thickness scales with weight; edges are a soft muted grey at low alpha so they don't compete with the nodes.
