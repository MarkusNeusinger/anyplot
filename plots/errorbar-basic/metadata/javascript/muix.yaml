review:
  strengths:
  - 'Error bars are composed natively inside ChartsContainer: a small custom SVG layer
    reads the band and linear scales through useXScale/useYScale, so whiskers, caps
    and markers sit exactly at their data values on MUI X''s own axes and grid'
  - Every marker sits on top of its whisker with a page-colored ring, so each reads
    as a point with whiskers; caps share one width and the 3 px line weight across
    all seven groups, visible in both themes
  - Value axis is derived from the data (lowest lower bound to highest upper bound
    plus 14 % padding), so every error bar is shown in full without typed limits
  - 'A subtitle states what the bars encode (± standard deviation, units) and the
    y-axis title carries units (cm / week): the chart is self-explanatory'
  - Plausible, neutral plant-growth scenario with seven conditions and SDs of 0.5–0.9
    cm/week; data hard-coded and fully deterministic
  - 'Single brand-green series (t.palette[0]) identical in both renders; chrome uses
    ink / inkSoft tokens and reads cleanly on #FAF8F1 and #1A1A17'
  weaknesses:
  - 'Suggestion: a 0.5 major tick step on the y axis (instead of 0.2, 21 gridlines)
    would lighten the grid and let the whiskers carry the panel.'
  - 'Suggestion: the `as any` casts on useXScale/useYScale are unnecessary because
    the snippet is only bundled by esbuild, never type-checked; dropping them would
    tidy the code.'
  - 'Suggestion: lowerBounds/upperBounds could reuse the already-extracted means and
    errors arrays instead of re-reading the records.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "errorbar-basic · javascript · muix · anyplot.ai" centered at top (~30 % width), softer subtitle "Error bars: ± Standard deviation (cm / week) · 7 Growth conditions"; y-axis title "Mean stem elongation (cm / week)" rotated, x-axis title "Growth condition"; tick labels 1.0–5.0 in 0.2 steps and seven category names (Control, Low Temp, High Temp, Low pH, High pH, Drought, Flood) all dark and readable; light grey horizontal grid; left and bottom axis lines only.
      Data: seven brand-green #009E73 points with vertical whiskers and horizontal caps of equal width, each filled circle on top of its whisker with a thin page-colored ring; Control highest (4.2 ± 0.5), Drought lowest (1.9 ± 0.6); all bars fully inside the axis range.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles and tick labels flip to light ink / soft light grey and are all clearly readable; no dark-on-dark text; grid lines are subtle dark grey but visible.
      Data: identical #009E73 markers, whiskers and caps at the same positions as the light render; marker ring now in the dark page color.
      Legibility verdict: PASS
