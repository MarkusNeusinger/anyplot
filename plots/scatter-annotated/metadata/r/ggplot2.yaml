review:
  strengths:
  - Points use the correct Imprint brand green (#009E73) with alpha=0.7 transparency,
    exactly matching the spec's request to reveal overlap via moderate transparency
  - 'Clever geom_segment technique: connector lines use a shorter offset (nudge *
    0.7) than the label position, producing clean short connectors from only the 8
    highlighted companies to their points'
  - Point size is aesthetically mapped to is_named (2.5 vs 3.5), making highlighted
    companies stand out without needing an extra legend (guide="none" correctly suppresses
    a confusing size legend)
  - Conditional hjust based on nudge_x sign correctly right/left-aligns each label
    away from its point, avoiding text sitting on top of the marker
  - 'Both light and dark renders are theme-correct: backgrounds (#FAF8F1 / #1A1A17),
    gridlines, and text all flip appropriately while the data color stays identical
    between themes'
  - Realistic, neutral fictional company names with a plausible R&D-spend-vs-revenue
    scale ($8M-$110M vs $35M-$440M) for a tech-sector scatter
  weaknesses:
  - In the densest cluster (top-right, around R&D spend 85-100 / revenue 300-380),
    the short connector lines for Nimbus Systems and Solace AI pass close to neighboring
    unlabeled points -- widen the offset slightly or nudge those two labels further
    to guarantee zero ambiguity about which point they belong to
  - Design relies on a single hue (brand green) plus point-size as the only encodings;
    a touch more visual sophistication (e.g. a subtle stroke on named points, or a
    faint background-cloud color de-emphasis) would raise the aesthetic ceiling further
  - Annotation text (geom_text size=3.2mm, roughly 9pt) is on the smaller side relative
    to the 3200x1800 canvas -- a slightly larger size would give more breathing room
    when the image is scaled down for thumbnails
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- confirmed not pure white, not dark.
      Chrome: Title "R&D Spending vs. Revenue · scatter-annotated · r · ggplot2 · anyplot.ai" in dark ink at top, clearly readable. Axis titles "R&D Spending ($M)" and "Annual Revenue ($M)" in dark ink, axis tick labels (30/60/90 and 100/200/300/400) in a slightly softer gray ink. Sparse light-gray major gridlines, subtle but visible. 8 named-company text labels (e.g. "Nimbus Systems", "Solace AI", "Quanta Devices", "Fenwick Labs") in dark ink connected to their points via thin muted-gray segments.
      Data: 32 points total (24 unlabeled background + 8 labeled companies), all in Imprint brand green (#009E73), rendered with visible alpha transparency (~0.7) so overlapping points blend slightly. Labeled/named points are drawn slightly larger than background points.
      Legibility verdict: PASS -- all title, axis, tick, and annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- confirmed not pure black, not light.
      Chrome: Same title and axis titles now in light ink (near-white), tick labels in a softer light gray, gridlines rendered as a subtle darker-gray on the near-black surface. All 8 label texts flipped to light ink and remain attached to their points via muted-gray connector segments.
      Data: Same 32 points in the identical brand green (#009E73) as the light render -- confirmed the data color did not shift with theme, only chrome (background/text/grid) flipped.
      Legibility verdict: PASS -- title, axis labels, tick labels, and all 8 annotation texts are clearly readable light-on-dark; no dark-on-dark failures observed anywhere on the canvas.
