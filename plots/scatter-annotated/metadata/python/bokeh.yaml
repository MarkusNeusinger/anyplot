review:
  strengths:
  - Markers stay at their exact (x, y) values; only labels are offset, each tied to
    its point by a thin INK_SOFT leader at alpha 0.45 that stays subtler than markers
    and text
  - Labels alternate lower-right / upper-left perpendicular to the rising diagonal,
    keeping text clear of the point cloud
  - Two data-space LabelSets with matching text_align/text_baseline make each label
    grow away from its point - an idiomatic Bokeh anchoring
  - 'Translucent markers (alpha 0.7) with page-colored outline, identical #009E73
    in both themes; chrome flips cleanly with all text readable'
  - Tidy df plus column-name constants drive every glyph and the axis titles; ranges
    derive from the data
  weaknesses:
  - 'VQ-02, SC-02 (both): DigiCore (6.9, 25.4) and AppLogic (7.4, 22.3) alternate
    sides in x order, so the ''AppLogic'' text ends beside the DigiCore marker and
    ''DigiCore'' sits beside the AppLogic marker, with their two leaders crossing
    in one line between the markers; which label names which point is ambiguous (C2)
    → each label on the side away from its neighbour (DigiCore upper-left, AppLogic
    lower-right), leaders not crossing. Likely cause: right_side = order % 2 == 0
    picks the side by x rank only, ignoring which neighbour is above or below.'
  - 'DQ-02 (both): some company names read as generic terms rather than firms, e.g.
    ''DevOps'' (a practice) and ''CodeBase'' / ''InfoTech'' (common nouns) → names
    that read as fictional companies (e.g. ''Kestrel Systems''). Likely cause: the
    COMPANY list.'
  - 'Suggestion: a faint 1 px top and right frame line (about #52524F) still shows
    around the plot area in the dark render; dropping it would make the L-shaped frame
    exact.'
  - 'Suggestion: a slightly larger label offset in the dense 5-10 B cluster would
    give the text more air from neighbouring markers.'
  image_description: |-
