      Data: 15 translucent #009E73 circles with page-colored outline on a rising diagonal; company labels in dark ink alternate lower-right / upper-left of their points, each joined by a thin gray leader. The DigiCore/AppLogic pair near (7, 24) has crossing leaders with each name beside the other marker.
