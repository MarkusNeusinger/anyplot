review:
  strengths:
  - Native sns.scatterplot on the tidy df with column constants; seaborn titles both
    axes from the constant values, so the axis titles carry units without extra calls
  - Log-scaled x axis with readable 1/3/10/30/100 ticks spreads the 0.9–82 thousand
    USD range evenly and turns the GDP–life-expectancy relationship into a near-linear
    band
  - Every one of the 16 points carries a label with a thin INK_SOFT leader line at
    alpha 0.5, subtler than the markers and the text, in both themes
  - Markers at alpha 0.7 with a page-colored edge stay at their exact data values;
    only text moves
  - 'Theme tokens threaded through sns.set_theme rc; chrome flips cleanly while #009E73
    stays identical in both renders, on the exact 3200×1800 canvas'
  weaknesses:
  - 'VQ-02 (both): the ''Mexico'' label sits against the lower edge of Turkey''s marker
    and its right end touches the start of ''Saudi Arabia'' in the 10–30k cluster
    → clear both by at least 2 px. Likely cause: the hand-built candidate search scores
    marker boxes at a fixed 6 pt radius and accepts the first position whose small
    residual overlap cost beats the alternatives.'
  - 'CQ-04, CQ-01 (code): lines 106–163 write out a 12-candidate greedy label-placement
    search with a helper function `overlap()` although adjustText (installed, and
    the Notes ask for it) computes this → `texts = [ax.text(...) for ...]` plus `adjust_text(texts,
    x=..., y=..., arrowprops=..., ax=ax)`. Likely cause: hand-rolled placement in
    place of the library call.'
  - 'Suggestion: a slightly heavier weight or INK color on the two outlier labels
    (Nigeria, Japan) would give the reader a first stop.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "scatter-annotated · python · seaborn · anyplot.ai" in dark ink, ~55% of width; axis titles "GDP per capita (thousand USD)" (log x, ticks 1/3/10/30/100) and "Life expectancy (years)" (50–85) in dark ink; INK_SOFT tick labels; subtle horizontal grid; top/right spines removed. All readable.
      Data: 16 #009E73 markers at alpha 0.7 with page-colored edges, each labelled with a country name in INK_SOFT 8 pt and a thin grey leader line; labels on varying sides. The 10–30k cluster is tight: 'Mexico' touches Turkey's marker and the start of 'Saudi Arabia'.
      Legibility verdict: PASS

