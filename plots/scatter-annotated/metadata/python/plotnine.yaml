review:
  strengths:
  - Every label is attached to its point by a fixed vertical nudge (nudge_y with va='bottom'/'top');
    only the labels move, and every marker sits at its exact (x, y) value
  - A short nearest-neighbour rule moves a label below its point when a close neighbour
    sits above it (CodeBase under InfoSys), so no labels collide without needing adjustText,
    which is not installed
  - Translucent Imprint-green markers (alpha 0.7) with a thin page-coloured outline
    keep neighbouring points distinct in both themes
  - 'Theme tokens reach every chrome element; ink and soft-ink text is readable on
    #FAF8F1 and #1A1A17 alike'
  - 'Idiomatic grammar: column-name strings in aes() title the axes automatically,
    and per-layer data= subsets split the label placement into two geom_text layers'
  weaknesses:
  - 'DQ-02 (both): ''InfoSys'' is the name of a real company (Infosys) shown with
    an invented $65M revenue and 9 % margin → replace it with a clearly fictional
    name (e.g. ''InfoGrid''). Likely cause: the companies list.'
  - 'Suggestion: spread the margins around the trend a little (the ten points sit
    almost on a straight line), so the annotated outliers carry more of the story.'
  - 'Suggestion: a slightly smaller label size would give the denser lower-left cluster
    more breathing room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole canvas and panel.
      Chrome: a bold dark title "scatter-annotated · python · plotnine · anyplot.ai" (about 58 % of the width), the axis titles "Annual Revenue ($ Millions)" and "Profit Margin (%)" in dark ink, soft-grey tick labels (50–200; 5–25), a subtle major grid, and thin left and bottom axis lines. All of it is readable.
      Data: ten #009E73 circles at alpha 0.7 with a thin off-white outline, rising from TechCorp (≈33, 5.5) to AI Labs (≈201, 22.7). Each has a dark company label just above it, except CodeBase, whose label sits below its point to clear InfoSys. No labels collide, and none covers a marker.
      Legibility verdict: PASS

