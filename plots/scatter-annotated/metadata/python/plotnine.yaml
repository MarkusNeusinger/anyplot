review:
  strengths:
  - Labels sit directly above their points and switch below only when the nearest
    neighbour is close above (CodeBase under its marker, clear of InfoGrid), so no
    label collides with another label or a marker in either render, and every point
    stays at its exact (x, y)
  - 'Translucent markers (alpha 0.7) with a thin page-colored outline, so they stay
    distinct on both #FAF8F1 and #1A1A17 while keeping the same #009E73 fill'
  - Per-layer data subsets (geom_text with data=above_df / below_df) and nudge_y with
    va anchoring are idiomatic grammar-of-graphics placement instead of drawing text
    by hand
  - Theme tokens threaded through every chrome element; title, axis titles and tick
    labels are crisp in both themes with a clear size hierarchy (bold 12 pt title,
    10 pt axis titles, 8 pt ticks)
  weaknesses:
  - 'DQ-02 (both): the company names TechCorp, DataFlow, CloudNet, AI Labs, InfoGrid,
    AppWorks, SoftCore, CodeBase, SmartSys, WebDev read as generic placeholder names,
    and the margins rise almost perfectly linearly with revenue → named, plausible
    firms of one sector (or a real public dataset) with scatter around the trend.
    Likely cause: the companies list and the hand-typed revenue/profit_margin arrays
    with ±0.5 noise.'
  - 'Suggestion: varying the data so a few points cluster tightly would exercise the
    label-avoidance and leader lines the spec describes.'
  - 'Suggestion: a focal point (e.g. the highest-margin firm emphasized) would give
    the chart a hierarchy beyond plain labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas and panel.
      Chrome: bold title "scatter-annotated · python · plotnine · anyplot.ai" centred at the top (~57% of width); axis titles "Annual Revenue ($ Millions)" and "Profit Margin (%)" in dark ink; tick labels 50/100/150/200 and 5–25 in soft dark grey; subtle major grid on both axes, left and bottom axis lines only. All readable.
      Data: 10 #009E73 markers at alpha 0.7 with a thin off-white outline, rising from TechCorp (~33, 5.5) to AI Labs (~201, 22.7). Each carries a dark company label just above it; CodeBase sits below its marker so it clears InfoGrid. No label collides with another label or a marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink #F0EFE8, tick labels in light grey; grid subtle but visible; axis lines light grey. No dark-on-dark text.
      Data: same #009E73 fill at alpha 0.7 (reads deeper on the dark page, as translucency implies), same positions and label placement as the light render; labels in light ink. Brand green clearly visible.
      Legibility verdict: PASS
