review:
  strengths:
  - 'Uses lets-plot''s native geom_text_repel with tuned point_padding/box_padding
    and a fixed seed: all 15 labels clear of each other and of the markers, with leader
    lines where offset'
  - Theme tokens threaded through every chrome element; both renders are fully readable
    and the Imprint green is identical across themes
  - Axis titles come straight from the descriptive column constants, so the axes carry
    units without a labs() override
  - Canvas follows the 800x450 @ scale 4 rule and the y limit is derived from the
    data
  - Interactive HTML output from the same plot object
  weaknesses:
  - 'SC-02 (both): leader lines are drawn as solid INK_SOFT strokes about as heavy
    as the label text, so they are not subtler than the markers and text (C3) → thinner
    and lighter segments, e.g. segment_size about 0.3-0.5 and a GRID- or INK_SOFT-at-alpha
    color. Likely cause: geom_text_repel segment_color/segment_size left at their
    defaults (text color, default width).'
  - 'VQ-05 (both): a four-sided frame encloses the panel, against the style guide''s
    L-shaped spine default → keep only the left and bottom axis lines. Likely cause:
    the panel border drawn by the theme stack (theme_minimal + axis_line) - set panel_border=element_blank()
    and keep axis_line for x and y only.'
  - 'Suggestion: an unused ELEVATED_BG constant could be dropped, since no legend
    or callout box is drawn.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, subtle light-gray grid on both axes, thin dark-gray frame around the panel on all four sides.
      Chrome: bold dark title "scatter-annotated · python · letsplot · anyplot.ai" top-left; axis titles "Annual Revenue ($ millions)" and "Profit Margin (%)" in dark ink; tick labels in INK_SOFT - all readable.
      Data: 15 translucent #009E73 markers; each company name in dark-gray text, repelled to various sides with short dark-gray leader lines; no label collides with another label or a marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, subtle dark-gray grid, gray frame on all four sides.
      Chrome: title and axis titles in light ink, ticks in light gray INK_SOFT - no dark-on-dark text.
      Data: same #009E73 markers and same label layout as the light render; labels and leader lines in light gray, readable.
      Legibility verdict: PASS
