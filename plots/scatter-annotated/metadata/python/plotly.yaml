review:
  strengths:
  - Every point labeled in a bold annotation box on the elevated surface, tied to
    its marker by a thin INK_SOFT leader line with standoff; markers stay at their
    exact values
  - 'Theme tokens threaded through all chrome, label boxes and leader lines: both
    renders fully legible with identical data colors'
  - Top-3 companies by market cap emphasized with Imprint purple, larger markers and
    accent label borders, derived from the data via nlargest
  - 'Adaptable structure: column constants with roles, a Data block binding df, axis
    ranges derived from the data'
  - hovertemplate with customdata adds a revenue/market-cap ratio in the interactive
    HTML view
  weaknesses:
  - 'SC-02 (both): in the low-left cluster the Netflix and Oracle leader lines cross
    each other between x=250 and x=300, so which label names which of the three nearby
    markers takes tracing (C2) → offsets that keep the cluster''s leaders from crossing
    (Netflix above-left of its point, Oracle below-right of its own). Likely cause:
    LABEL_OFFSETS assigned cyclically by row index instead of by each point''s neighbourhood.'
  - 'SC-04 (both): the purple color and larger size of Apple, Microsoft and Alphabet
    encode ''top 3 by market cap'', but no legend or key says so → a legend entry
    or a short key naming the highlight group. Likely cause: showlegend=False with
    a single trace carrying both groups.'
  - 'Suggestion: a slightly lighter leader-line opacity in the dark render would push
    the lines further behind the labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, canvas 3200x1800.
      Chrome: title 'scatter-annotated · python · plotly · anyplot.ai' centered in dark ink; axis titles 'Market Cap (Billion USD)' and 'Annual Revenue (Billion USD)' in dark ink, ticks in INK_SOFT; subtle grid; left and bottom axis lines. All readable.
      Data: 12 companies; 9 in #009E73 at 10 px, Apple/Microsoft/Alphabet in #C475FD at 13 px, opacity 0.8 with page-colored outline. Each point carries a bold label in an off-white box (purple border for the top 3) tied by a thin dark-grey leader line. No label boxes collide; Netflix and Oracle leaders cross in the low-left cluster; Netflix and Salesforce markers nearly coincide.
