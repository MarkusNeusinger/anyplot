review:
  strengths:
  - Correct Imprint palette (#009E73) identical across themes; theme-correct backgrounds
    and text in both renders
  - 'Idiomatic, distinctive ECharts usage: labelLayout (hideOverlap/moveOverlap) for
    automatic label decluttering plus custom graphic connector lines for offset labels'
  - Selective annotation of representative outlier cities (small-area/high-density
    vs large-area/lower-density) gives the chart a clear point of interest
  - Clean, deterministic, hardcoded dataset with KISS code structure and no fake interactivity
  - Descriptive axis titles with units, correct mandated title format
  weaknesses:
  - Sao Paulo and Mexico City markers sit almost exactly on top of each other, merging
    into a single blob that is hard to read as two distinct cities even with alpha=0.75
    - nudge one marker or add a small manual offset/label to disambiguate
  - Log x-axis leaves roughly the top third of the axis range (10,000-100,000 km2)
    completely empty since no city exceeds ~16,410 km2, producing unbalanced whitespace
    concentrated on the right side of the plot - consider narrowing the max (e.g.
    ~30,000) or checking whether a linear axis fits better
  - 'y-axis line is hidden (axisLine.show: false) while the x-axis line is kept, creating
    a minor chrome asymmetry - hide or show both consistently'
  - Single-hue minimalist styling is competent but not yet publication-level - consider
    a second visual dimension (e.g. subtle size or opacity signal tied to a third
    variable) to raise Design Excellence
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "scatter-annotated · javascript · echarts · anyplot.ai" centered top in dark ink, clearly legible. Axis titles "Metropolitan Area (km²)" (log scale, x) and "Population (millions)" (y) in dark ink with visible units. Tick labels in a softer dark gray, all legible. Subtle light-gray gridlines at major log decades and at 10/20/30/40 population lines.
      Data: 23 green (#009E73) circular markers with a thin light-colored border, opacity ~0.75 revealing overlap. Seven markers carry a text label (Dhaka, Mumbai, Beijing, New York, Lagos, Los Angeles, Paris) in dark ink; Dhaka, Mumbai, and New York have a thin connecting line from an offset label back to the point.
      Legibility verdict: PASS - all title, axis, tick, and annotation text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title and axis titles now rendered in light/white text, clearly legible against the dark background. Tick labels in a lighter soft gray. Gridlines are a subtle dark gray, still visible without dominating.
      Data: Same 23 markers in identical #009E73 green with the same opacity and border treatment as the light render - data colors are unchanged between themes, only chrome (background, text, grid) flipped. The same seven labels and three connector lines are present, rendered in light-colored text.
      Legibility verdict: PASS - no dark-on-dark or light-on-light failures observed; all text and connector lines are clearly visible against the dark background.
