review:
  strengths:
  - 'Log-scale bubble chart with a second visual dimension (marker size = population
    density, sqrt-mapped) that tells a clear story: Dhaka''s outsized marker immediately
    reads as ''most densely populated'' despite a mid-range population'
  - Selective annotation of only 9 of 23 cities avoids clutter, exactly matching the
    spec's guidance to annotate a subset for larger datasets
  - Subtle connecting lines (opacity 0.5) link offset labels back to their points
    for the tightly clustered Dhaka/Mumbai/São Paulo/Mexico City/New York markers,
    and ECharts' labelLayout (hideOverlap/moveOverlap) declutters the rest
  - Moderate marker transparency (opacity 0.75) plus a light border in the page background
    color follows the spec's note to reveal overlapping points
  - Explicit font sizing throughout (title 22, subtitle 13, axis names 16, ticks/labels
    14) with identical Imprint green data color and correctly flipped theme chrome
    across both renders
  - 'Clean idiomatic ECharts usage: log xAxis, formatter for thousands separators,
    axisTick disabled for a minimal-chrome look, deterministic hardcoded data'
  weaknesses:
  - São Paulo and Mexico City markers sit almost exactly on top of each other near
    (1500, 22) — even with alpha 0.75 the pair reads as a single blob at a glance;
    consider a small deliberate jitter or a slightly larger label offset that makes
    clear two separate cities are stacked there
  - Tokyo's density figure (area 2,194 km² for 'Tokyo' paired with the 37.4M Greater
    Tokyo Area population) mixes two different geographic boundary definitions, producing
    an inflated implied density (~17,000/km²) relative to commonly cited Greater Tokyo
    Area density (~2,700-3,000/km²) — pick area/population pairs from the same geographic
    definition (either both city-proper or both metro-area) for a couple of the largest
    cities
  - No small size-legend or annotation calls out what the marker-size encoding maps
    to numerically (e.g., a reference bubble or density value) — the subtitle names
    the encoding but a reader can't gauge absolute density from marker size alone
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-annotated · javascript · echarts · anyplot.ai" centered top in bold dark ink, subtitle "Marker size scales with population density" in soft gray beneath it. X-axis "Metropolitan Area (km²)" (log scale, 100-20,000) and Y-axis "Population (millions)" (0-40) both labeled with units in dark ink; tick labels in a lighter ink-soft tone. Gridlines are thin and subtle at the 1,000/10,000 x-positions and every 10 units on y. All text is clearly legible against the light background.
      Data: All markers render in the same Imprint brand green (#009E73) with ~0.75 opacity and a thin light-colored border. Marker size varies with population density — Dhaka is visibly the largest bubble, matching its very high real-world density. Nine cities carry text labels (Dhaka, Mumbai, São Paulo, Mexico City, Beijing, New York, Los Angeles, Lagos, Paris), some connected to their point via a short thin gray line where the label sits offset from a crowded cluster.
      Legibility verdict: PASS — all title, axis, tick, and annotation text is readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light/off-white text, fully readable against the dark background. Axis names in light ink, tick labels in a slightly softer light-gray tone, gridlines subtle but visible. No dark-on-dark text anywhere — every chrome element flipped correctly.
      Data: Marker colors are identical Imprint green (#009E73) to the light render — only the chrome (background, text, grid) changed. Bubble sizes, positions, and the connecting lines for offset labels match the light render exactly.
      Legibility verdict: PASS — no dark-on-dark or illegible elements observed; brand green remains vivid and distinguishable from the near-black background.
