review:
  strengths:
  - 'Theme-adaptive chrome is correctly threaded through: title/axis/tick text and
    grid lines flip color between light and dark while the single green data series
    (#009E73) stays identical, and both backgrounds match the FAF8F1/1A1A17 spec.'
  - Log-log axes are the right call for the wide-range revenue vs. market-cap data
    (Adobe ~$19B to Amazon ~$575B revenue) — avoids squashing small companies into
    a corner.
  - 'Data labels for all 15 points stay legible and mostly non-overlapping with `allowOverlap:
    false`, including graceful inward placement for the Amazon point near the right
    edge.'
  - Realistic, neutral company dataset (well-known tech firms) with plausible illustrative
    revenue/market-cap figures.
  - 'Clean, minimal implementation: no unused imports, deterministic hardcoded data,
    correct mount-node/animation contract for the JS harness.'
  weaknesses:
  - Spec notes call for 'subtle connecting lines or arrows from labels to points when
    offset' — labels are simply offset to the right (x:10, y:4) with no leader line,
    so a label whose position gets nudged by Highcharts' overlap avoidance can read
    as ambiguously attached to its point. Consider a thin connector (e.g. `dataLabels.connectorColor`/manual
    line) when the label is displaced from the marker.
  - 'Design excellence is generic: axis styling, marker treatment, and layout all
    follow the library defaults from the style guide with no additional customization
    (no accent styling, no size/emphasis variation to create a focal point) — functional
    but not distinctive.'
  - All 15 points share identical size and color, so there's no visual hierarchy highlighting
    any particular company as a focal point beyond the text labels themselves.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold dark title "scatter-annotated · javascript · highcharts · anyplot.ai" centered at top; dark-gray axis titles ("Annual Revenue (USD billions, log scale)" / "Market Cap (USD billions, log scale)"); medium-gray tick labels on both log-scaled axes; subtle light-gray gridlines on both axes. All chrome text is clearly readable against the light background.
      Data: 15 green (#009E73) circular markers at ~70% opacity, each with a black text label naming the company (Apple, Microsoft, Alphabet, Amazon, Nvidia, Meta, Tesla, Broadcom, Oracle, Adobe, Salesforce, IBM, Intel, Cisco, Uber) placed just to the right of its point. First (and only) series correctly uses the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and axis titles render in light off-white; tick labels in light gray; gridlines in a subtle light-on-dark tone. No dark-on-dark or light-on-light failures observed — all text is clearly legible.
      Data: Same 15 green (#009E73) markers at the same positions and same opacity as the light render — data colors are identical between themes, only chrome (background, text, grid) flipped as required.
      Legibility verdict: PASS
