review:
  strengths:
  - 'Distinctive scale-synced overlay: PointAnnotations reads the chart''s live x/y
    scales via useXScale/useYScale/getValueToPositionMapper, so the label + leader-line
    layer is a real child of ScatterChart that stays perfectly aligned to the same
    coordinate system the ScatterPlot itself uses — an idiomatic community-only technique,
    not a hack.'
  - 'Strong data storytelling: only the 12 ''highlighted'' companies that deviate
    from the general revenue-to-cap trend (green, markerSize 16, alpha 0.78) carry
    labels, while 18 unlabeled ''peers'' (gray, markerSize 9, alpha 0.6) quietly establish
    the baseline trend — matches the spec''s guidance to annotate only a subset on
    a moderately dense scatter and gives the chart a clear focal point.'
  - Hand-tuned per-point dx/dy offsets plus subtle leader lines keep all 12 labels
    fully legible with zero overlaps across a fairly dense cluster, in both themes.
  - 'Fully palette/theme compliant: first series is brand green #009E73, the muted
    gray uses the documented ''other/rest'' semantic-anchor exception, chrome is FAF8F1/1A1A17,
    and data colors are identical between light and dark renders.'
  weaknesses:
  - 'yAxis `tickFontSize: 54` is used purely as an undocumented spacing hack to push
    the rotated axis label away from the tick numbers (the actual rendered tick font
    size comes from `tickLabelStyle.fontSize: 14`, not this prop) — fragile since
    it leans on legacy label-offset behavior instead of an explicit margin/gap prop;
    a future muix release could change how tickFontSize maps to labelRefPoint and
    silently reintroduce the overlap it''s working around.'
  - Y-axis label font-size (13px via sx override) and x-axis label font-size (16px)
    differ noticeably without a strong semantic reason.
  - The chosen axis domains (0-165 x, 0-430 y) leave a large empty region in the upper-right
    of the canvas since no data falls there — not wrong, but a tighter domain or annotation
    in that space would use the frame more efficiently.
  - Title occupies only ~40% of the plot width at fontsize 19 despite a generous top
    margin — legible but could carry a touch more presence.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Tech Company Valuations · scatter-annotated · javascript · muix · anyplot.ai" is dark ink, centered top, fully visible with no clipping. X-axis label "Annual Revenue ($B)" and rotated Y-axis label "Market Cap ($B)" are dark and clearly readable. Tick labels (0-165 on x, 0-420 on y) are dark and legible against the light background. Grid lines are light gray, subtle but visible. Legend ("Highlighted" green swatch, "Peer companies" gray swatch) sits below the x-axis, fully legible.
      Data: First series (12 highlighted companies) renders in translucent brand green (#009E73 at alpha 0.78), larger markers (16px). Second series (18 peer companies) renders in translucent muted gray (alpha 0.6), smaller markers (9px). Each highlighted point has a thin gray leader line to its company-name label, all 12 labels legible with no overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now rendered in light ink, fully visible with no clipping. Axis labels and tick labels are light-colored and clearly readable against the dark background — no dark-on-dark failures observed. Grid lines are a subtle light gray, visible without dominating. Legend swatches and text are legible.
      Data: Same brand green (#009E73, alpha 0.78) for highlighted points and muted gray (alpha 0.6, theme-adjusted to a lighter gray for dark mode) for peers — data hues are identical to the light render as required; only chrome (background/text/grid) flipped. All 12 leader lines and labels remain legible with no overlaps.
      Legibility verdict: PASS
