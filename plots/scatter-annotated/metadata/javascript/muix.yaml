review:
  strengths:
  - All 12 labels sit beside their points with thin muted leader lines (opacity 0.65,
    1.2 px) that stay subtler than both markers and text; no label collides with another
    label or a marker in either render
  - Labels on the 12 notable companies only, with the 18 peer companies drawn smaller
    in the muted anchor, so the labeled outliers read first while every point stays
    at its exact (x, y)
  - 'Edge-aware label sides: points near the left or right axis bound flip their label
    inward (nearLeft/nearRight), so no label leaves the plot area'
  - Annotations are drawn as a composed child of ScatterChart using the useXScale/useYScale
    hooks, so leaders and labels share the chart's own scales instead of hand-computed
    pixel positions
  - 'Theme tokens threaded through every chrome element (t.ink, t.inkSoft, t.grid,
    t.pageBg); markers at fillOpacity 0.7 as the Notes ask; first series is #009E73
    and identical in both renders'
  weaknesses:
  - 'VQ-05 (both): the title sits about 8 CSS px below the top canvas edge (all pixels
    visible, but cramped) while the 56 px title band is meant to center it → about
    20 px clearance above the title (+12 px). Likely cause: the flex column shrinks
    the title div because the ScatterChart (height - titleHeight) plus its legend
    overflows; set flexShrink: 0 on the title div or reduce the chart height.'
  - 'Suggestion: an x-axis tick step of 10 instead of 5 would halve the 34 tick labels
    and vertical grid lines and quiet the background.'
  - 'Suggestion: a legend entry such as "Notable companies" would tell the reader
    more than "Highlighted".'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: title "Tech Company Valuations · scatter-annotated · javascript · muix · anyplot.ai" in dark bold ink at the top (close to the top edge, fully visible); y-axis "Market Cap ($B)" 0–420 step 20, x-axis "Annual Revenue ($B)" 0–165 step 5; tick labels in soft dark ink; subtle grid on both axes; horizontal legend at the bottom ("Highlighted", "Peer companies"). All text readable.
      Data: 12 larger translucent brand-green #009E73 markers, each labeled with a company name (Aurora Semiconductors, Vertex Analytics, Nimbus Software, NexaCloud, Lumen Bioworks, Zephyr Mobility, Solstice Robotics, Halcyon Games, Granite Payments, Ferrotech Dynamics, Ridgeline Hardware, Cascade Networks) via thin gray leader lines, labels on both sides; 18 smaller muted gray (#6B6A63) peer markers forming a rising band. No label overlaps another label or a marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, grid subtle light lines, legend text light. No dark-on-dark text.
      Data: same #009E73 green markers as the light render (identical data color); peers in the dark muted anchor #A8A79F; leader lines and labels in light tones; label positions identical to the light render.
      Legibility verdict: PASS
