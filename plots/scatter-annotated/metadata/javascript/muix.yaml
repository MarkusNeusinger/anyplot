review:
  strengths:
  - Annotation layer composed as a ScatterChart child with useXScale/useYScale, so
    labels and leader lines are positioned in the chart's own data scales
  - No label collides with another label or marker; labels near the plot edges flip
    inward, and thin muted leader lines (1.2 px, 65% opacity) tie every offset label
    to its point
  - 'Clear focal hierarchy: named outliers in brand green at 9 px, the peer cohort
    in the muted anchor at 5.5 px, both translucent'
  - Theme tokens threaded through every chrome element; both renders are fully legible
    and data colors are identical across themes
  weaknesses:
  - 'DQ-02 (both): the 22 unlabeled peers sit on an evenly stepped straight diagonal
    (x +7-10, y +10-15 per point), which reads as synthetic, and Cascade Freight,
    Halcyon Energy, Ridgeline Materials and Granite Financial are not tech companies
    under a ''Tech Company Valuations'' title → scatter the peers around the trend
    with irregular spacing and give the outliers tech-sector names. Likely cause:
    the hand-typed peer rows and label list in the data block.'
  - 'CQ-04 (code): the hexToRgba helper (lines 55-60) only applies alpha to the series
    colors → pass t.palette[0] / MUTED directly and set opacity with ''& .MuiScatterChart-marker'':
    { fillOpacity: 0.7 } in sx. Likely cause: alpha baked into color strings.'
  - 'Suggestion: a coarser x tick step (every 10 or 20 $B) would thin the 33 vertical
    grid lines and 34 tick labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold title "Tech Company Valuations · scatter-annotated · javascript · muix · anyplot.ai" centered at top (~45% width); y axis "Market Cap ($B)" 0-420 step 20, x axis "Annual Revenue ($B)" 0-165 step 5; dark ink text, soft-ink ticks, subtle both-axes grid; legend "Highlighted" / "Peer companies" centered at bottom. All text readable.
      Data: 12 named companies as larger translucent #009E73 circles, each with a dark label and a thin gray leader line (labels left or right, e.g. Aurora Semiconductors top, Cascade Freight bottom-right labeled to the left); 22 smaller gray peer markers rising diagonally from (10,45) to (145,235). No label overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks, annotation labels and legend in light ink; grid subtle light lines; no dark-on-dark text.
      Data: identical green #009E73 markers and positions; peers in the lighter muted gray of the dark theme; leader lines light gray, visible but subtle.
      Legibility verdict: PASS
