review:
  strengths:
  - Custom greedy 8-direction label placement algorithm (an adjustText equivalent)
    avoids all label/marker overlaps across all 18 annotated points, in both themes
  - Correct Imprint theme tokens threaded through every chrome element (axes, gridlines,
    title, tick/axis labels) with clean light/dark parity and identical data color
  - Leverages the real Chromium render harness's getBBox() to measure actual text
    width for collision detection instead of estimating widths — a genuinely D3-specific
    technique enabled by the browser-based harness
  - 'Faithfully implements the spec''s notes: 10-50 point range (18 used), moderate
    marker transparency (alpha 0.7), and subtle leader lines connecting offset labels
    back to their points'
  - Canvas gate passed cleanly; no clipping at any edge (verified title, y-axis title,
    and rightmost/leftmost labels via pixel-level crops)
  weaknesses:
  - At the 400px mobile thumbnail, individual company name labels shrink to near-illegible
    size due to the 18-point density — consider labeling only a subset of key/outlier
    points as the spec notes suggest, so mobile previews stay legible
  - Visual design is fairly plain — a single marker hue, uniform size, and uniform
    opacity throughout with no emphasis on any particular point — a bit more hierarchy
    (e.g. size or color emphasis on a standout company) would strengthen data storytelling
  - Axis domain lines are kept on both x and y axes; the style guide favors minimal
    chrome so consider removing or lightening them for a more refined look
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "scatter-annotated · javascript · d3 · anyplot.ai" centered at top in bold dark ink; x-axis "R&D Spending ($M)" and y-axis "Annual Revenue ($M)" labels both descriptive with units; tick labels and gridlines in a soft gray-brown ink, subtle but visible; axis domain lines present in the same soft ink. All chrome text is clearly legible against the light background.
      Data: 18 green (#009E73) circular markers at fill-opacity 0.7, each connected via a thin leader line to a text label placed in one of 8 compass directions around the point, avoiding overlap with other labels and markers. Labels use a slightly softer ink tone than axis chrome, still clearly readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Same title, axis labels, tick labels, and gridlines as the light render, but rendered in light ink tones (off-white/light gray) that read clearly against the dark background — no dark-on-dark failures observed.
      Data: Same 18 green (#009E73) markers at the same positions and opacity as the light render — data colors are identical between themes, confirming only chrome flipped. Leader lines and point labels remain legible in light gray against the dark surface.
      Legibility verdict: PASS
