review:
  strengths:
  - 'AR-09 edge-clipping regression from the previous attempt is fixed: pixel-level
    inspection of both renders confirms comfortable margins on all four edges (right
    132px, left 47px, top 74px, bottom 53px) — the label-placement search now correctly
    avoids pushing boxes past the canvas bounds'
  - Greedy 8-direction label placement uses real browser SVG getBBox() measurement
    (only possible because the D3 harness renders in an actual Chromium instance)
    to place all 9 labels collision-free against both markers and each other
  - 'Clear data storytelling: a least-squares trend line identifies the biggest revenue-per-R&D-dollar
    over-performer ("Cobalt Interactive") and renders it larger, fully opaque, and
    bold as a deliberate focal point'
  - 'Faithful to the spec''s own guidance: alpha ~0.7 for moderate marker transparency,
    subtle leader lines connecting offset labels to their points, and only a curated
    subset of points labeled (extremes + biggest trend residuals) to keep the chart
    legible'
  - 'Theme-adaptive chrome correctly threaded through tokens: identical #009E73 data
    color in both renders, correct backgrounds, all text readable, spines removed
    on both axes for a clean minimal look'
  weaknesses:
  - At the 400px mobile thumbnail, the 13px company-name labels are still fairly small
    and dense in the lower-left cluster (5 unlabeled + 2 labeled points close together
    around x=50-120) — legible but not comfortable; consider a slightly larger label
    fontsize or trimming one more label from that cluster
  - Design remains single-hue by necessity (one categorical series) — the standout
    emphasis on "Cobalt Interactive" is the only hierarchy cue; a secondary subtle
    cue (e.g. a faint trend line) could reinforce the story further without adding
    a second color
  - Two of the small helper functions (labelBox, overlaps, inCanvasBounds) push the
    file away from strict linear KISS structure — justified here since D3 has no adjustText
    port, but keep an eye on this if the algorithm grows further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "scatter-annotated · javascript · d3 · anyplot.ai" centered at top; dark axis labels "R&D Spending ($M)" / "Annual Revenue ($M)"; subtle light-gray gridlines on both axes; dark, legible tick labels; both axis domain/spine lines removed for a clean look.
      Data: 18 brand-green (#009E73) circles at fill-opacity 0.7 (1.0 for the standout) showing a positive R&D-spend-vs-revenue trend. 9 points carry text labels connected by thin (opacity 0.5) leader lines placed via a collision-avoiding greedy algorithm. "Cobalt Interactive" renders larger, fully opaque, bold, and dark-ink as the deliberate focal point (biggest revenue-per-R&D-dollar over-performer versus the trend). Pixel-level scan confirms no ink within 40px of any canvas edge — the previous attempt's "Solstice Tech" right-edge clipping is fixed (132px right margin, 47px left, 74px top, 53px bottom).
      Legibility verdict: PASS — all text (title, axis labels, ticks, point labels) is clearly readable against the light background; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/axis labels/ticks now rendered in light ink, clearly legible against the dark surface — no dark-on-dark failures anywhere. Gridlines flip to a subtle light-on-dark tone. Spines removed identically to the light render.
      Data: Same 18 circles at identical positions, sizes, and opacity as the light render, colored identically at #009E73 — confirms only chrome flipped, not data color. Same 9 labels, same leader lines, same standout treatment on "Cobalt Interactive" (bold, light-ink text here). Pixel scan confirms identical margins to the light render (132/47/74/53px) — no edge clipping.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures.
