review:
  strengths:
  - Greedy label-placement algorithm uses real SVG getBBox() measurement (only possible
    because the D3 harness renders in an actual browser) to avoid overlaps between
    labels, markers, and leader lines — no collisions anywhere in either render.
  - 'Clear data storytelling: a trend-relative residual calculation identifies the
    biggest over-performer (''Cobalt Interactive'') and renders it larger, fully opaque,
    and bold, creating an immediate focal point instead of a flat data dump.'
  - Subtle leader lines connect offset labels back to their points exactly as the
    spec's notes request, and point opacity (0.7, 1.0 for the standout) matches the
    spec's 'moderate transparency to reveal overlap' guidance.
  - Only a curated subset of points is labeled (extremes + biggest residuals) rather
    than all 18, keeping the chart legible per the spec's guidance for larger datasets.
  - 'Theme-adaptive chrome is correctly threaded through tokens: identical brand-green
    (#009E73) data color, correct #FAF8F1/#1A1A17 backgrounds, and readable text in
    both light and dark renders.'
  - Deterministic LCG-based data generation (seeded, no Math.random()) with a plausible
    R&D-spend-vs-revenue business scenario.
  weaknesses:
  - 'AR-09 edge clipping (both renders): the ''Solstice Tech'' label at the top-right
    of the chart is cut off at the canvas''s right border — pixel-level inspection
    confirms label ink extends into the very last column (x=3199 of 3200) of both
    plot-light.png and plot-dark.png, isolated to rows ~198-208 (the label''s y-position).
    The final letter ''h'' of ''Solstice Tech'' is chopped off outside the saved PNG
    bounds. Cause: the labeled point for ''Solstice Tech'' sits near the maximum x-domain
    value, and the greedy label-placement algorithm chose a rightward (dx=1) compass
    direction/radius that pushes the label''s right edge past the canvas edge — margin.right
    (90 css px) is not enough clearance for a ~13px-per-char label at this data position.
    Fix: bias the compass/radius search to prefer leftward or downward placements
    for points near the right/top domain edges (e.g. skip dx>0 directions once anchorX
    + labelWidth > iw - margin.right, or clamp the chosen box''s x1 to stay within
    the mount width), or increase margin.right slightly to give the rightmost labels
    room.'
  - Title 'scatter-annotated · javascript · d3 · anyplot.ai' occupies only ~30% of
    the plot width at 22px — noticeably smaller than the typical ~50-70% (or 70-85%
    for the full mandated string length) expected proportion; a slightly larger title
    fontsize would improve visual hierarchy without risking overflow, since there's
    clearly headroom.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-annotated · javascript · d3 · anyplot.ai" in bold dark text, centered top. Axis labels "R&D Spending ($M)" (x) and "Annual Revenue ($M)" (y) in dark ink, both axes gridlines subtle light gray. Tick labels dark, readable.
      Data: 18 green (#009E73) circles scattered showing a positive R&D-spend-vs-revenue correlation. 9 points carry text-label annotations with thin gray leader lines connecting offset labels to their markers. The point "Cobalt Interactive" is rendered larger, at full opacity, with a bold dark label — a clear focal point (the biggest revenue-per-R&D-dollar over-performer). Other points use fill-opacity 0.7.
      Defect found: the "Solstice Tech" label at the top-right corner is clipped at the canvas's right edge — pixel inspection shows ink at the very last column (x=3199 of 3200 px) confined to the label's row band, meaning the final letter of "Solstice Tech" is cut off outside the saved PNG. This is an AR-09 edge-clipping violation.
      Legibility verdict: FAIL (edge-clipped label "Solstice Tech"; all other text is otherwise clearly readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink, clearly legible against the dark background — no dark-on-dark failures observed. Gridlines flip to a subtle light-on-dark tone.
      Data: Identical marker positions, sizes, and the same brand-green (#009E73) fill as the light render — confirms data colors are unchanged between themes, only chrome flipped.
      Defect found: the same "Solstice Tech" label is clipped at the identical right-edge pixel columns (verified programmatically) — the defect reproduces in both themes since it stems from the label-placement geometry, not from theme-specific styling.
      Legibility verdict: FAIL (same edge-clipped "Solstice Tech" label; all other chrome and data are correctly theme-adapted and legible).
