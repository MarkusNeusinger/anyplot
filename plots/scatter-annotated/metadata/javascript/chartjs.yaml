review:
  strengths:
  - Custom afterDatasetsDraw plugin implements label placement with fan-out from the
    point-cloud centroid plus a greedy x-sorted de-collision pass, all drawn with
    subtle leader lines — a genuinely idiomatic use of Chart.js's plugin architecture
    to solve the spec's core requirement (avoid overlapping labels) without reaching
    for an external library.
  - Two hand-placed outliers (Origami Cloud, Tundra Works) are visually promoted with
    bold labels, full opacity, and a larger point radius, while the trend cloud sits
    at ~70% alpha — this directly matches the spec's 'highlight outliers' use case
    and creates a clear focal point (DE-03).
  - Deterministic fixed-seed LCG stands in for Math.random() with a code comment explaining
    why (browser has no seeded RNG) — CQ-02 handled correctly for the JS runtime.
  - Theme tokens (t.ink, t.inkSoft, t.grid, t.pageBg) are threaded through title,
    axis titles, ticks, grid, marker borders, and the label/leader-line plugin; both
    renders are legible with correct backgrounds and identical data colors.
  weaknesses:
  - 'The greedy de-collision pass only compares each label against previously-placed
    labels'' bounding boxes — it doesn''t check a label''s leader line against other
    labels'' text. Result: Driftline''s leader line is drawn directly through the
    ''Pixelforge'' label text (visible in both themes, bottom-left cluster around
    x=8-15, y=65-90). Route leader lines around already-placed label boxes, not just
    resolve label-vs-label box overlap.'
  - Meadowstack's own marker and its neighbor Brightloom's leader line both cross
    directly through the 'Meadowstack' label text (the label sits immediately above
    its own point with no vertical offset, so the connecting line clips the letters
    'ows'). Increase LEADER_PX or add a minimum label-to-marker clearance check for
    points that are close together vertically.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-annotated · javascript · chartjs · anyplot.ai" in dark ink, centered, clearly legible. Axis titles "Annual Revenue ($M)" and "Valuation ($M)" in dark ink at balanced sizes. Tick labels in a softer gray-brown, subtle horizontal/vertical gridlines visible but not dominant.
      Data: 16 startup points in Chart.js green (#009E73), ~70% alpha for the 14 trend points and full opacity + larger radius for the 2 outliers (Origami Cloud, Tundra Works), which also get bold black labels. Each point has a thin gray leader line to its name label. Points trace a near-linear revenue-to-valuation trend with the two outliers clearly separated above/below it.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background. Two label/leader-line overlaps found in the crowded bottom-left cluster (Driftline's leader line crosses the "Pixelforge" text; the Brightloom leader line and Meadowstack's own marker cross the "Meadowstack" text) — a VQ-02 deduction, but no text is fully obscured or unreadable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light/white ink, clearly legible against the dark background. Tick labels in a lighter soft gray. Gridlines subtle and visible.
      Data: Identical green marker colors, alpha levels, radii, and outlier emphasis as the light render — only chrome (text, grid, background) flipped, data colors unchanged as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text is clearly visible against the near-black surface. The same two label/leader-line overlaps present in the light render recur here (same layout, theme-independent issue).
