review:
  strengths:
  - Custom greedy de-collision algorithm (labels placed in x-order, nudged upward
    on overlap) keeps all 16 point labels readable with zero text-on-text collisions
    in both renders.
  - 'Idiomatic Chart.js usage: custom drawing goes through the native `afterDatasetsDraw`
    plugin hook instead of faking interactivity or reaching for an unsupported chartjs-chart-*
    plugin.'
  - 'Implements every spec note explicitly: ~70% marker alpha to reveal overlap, subtle
    leader lines from point to offset label, and all 16 points labeled (within the
    10-50 recommended range).'
  - Theme tokens are threaded through every chrome element (title, axis titles, ticks,
    grid, leader-line color) and the brand-green data color is pixel-identical between
    light and dark renders.
  weaknesses:
  - valuation = revenue * 3.4 + noise (noise range only ±15) produces an almost perfectly
    linear cloud; the code comment claims 'two clear outliers deserve their labels
    most' but no point actually deviates meaningfully from the trend line, undercutting
    the annotation narrative the spec's use cases describe (labeling outliers/top
    performers). Widen the noise or hand-place 1-2 genuine outliers so the labels
    earn their keep.
  - Point-label font (13px) is smaller than the tick-label font (14px) even though
    the per-point label is the primary content the spec asks for — bump it to ~14-15px
    for a clearer hierarchy.
  - Every point is labeled with identical size/weight/color, so there is no visual
    emphasis on the points that matter most (per the spec's 'outlier cities', 'top
    performers' applications) — consider differentiating a highlighted subset.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark.
      Chrome: Title "scatter-annotated · javascript · chartjs · anyplot.ai" in dark ink, centered, comfortably sized, not clipped. Axis titles "Annual Revenue ($M)" / "Valuation ($M)" in dark ink, balanced sizes. Tick labels in soft grey, subtle light grid lines on both axes. All chrome text clearly legible against the light background.
      Data: 16 brand-green (#009E73, ~70% alpha) circular markers with a subtle cream/pageBg edge stroke, tracing a roughly linear revenue-vs-valuation trend from bottom-left to top-right. Every point has a text label in dark ink connected by a thin grey leader line, fanned outward from the point cloud so no label overlaps another label or a marker. No clipping at any canvas edge (checked bottom-left cluster and the top-right "Vantage Grid" point closely).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light.
      Chrome: Same title and axis titles now rendered in light ink (near-white), tick labels in light soft grey, grid lines subtle and still visible against the dark surface. No dark-on-dark text anywhere — every label, tick, and leader line is clearly visible.
      Data: Same 16 brand-green (#009E73) markers at the same positions and same alpha as the light render — confirmed identical data color and layout; only the chrome (text, grid, leader-line color reference) flipped to the dark-theme tokens.
      Legibility verdict: PASS
