review:
  strengths:
  - Theme-adaptive chrome is correctly wired through Axis/Figure tokens — both renders
    pass the light/dark legibility check, and the canvas is exactly 3200x1800 (landscape
    gate).
  - 'First series correctly uses Imprint brand green #009E73 with alpha=0.7 markers,
    matching the spec''s ''moderate transparency to reveal overlap'' note.'
  - Selectively labels only outlier/notable points (highest/lowest growth, highest/lowest
    spend, biggest trend deviation) with offset placement plus subtle INK_SOFT connector
    lines, avoiding label/data overlap and matching the spec's guidance on connecting
    lines and avoiding overlapping labels.
  - Clean, idiomatic Makie usage — theme tokens threaded into Axis kwargs, scatter!/lines!/text!
    used directly with no custom recipes or fake UI.
  - Realistic, plausible, reproducible data (fictional company R&D spend vs. revenue
    growth, Random.seed!(42)).
  weaknesses:
  - The NextWave point (rd_spend ~= 37) sits far right of the rest of the cluster
    (~4-25), leaving roughly 40% of the plot area nearly empty on the right side and
    unbalancing the canvas — consider a less extreme outlier or tightening the x-range
    so the primary cluster fills more of the canvas.
  - labeled_idx computes 6 candidate extremes (argmax/argmin of growth, spend, and
    trend residual) but unique() collapses them to only 4 visible labels because the
    same points double up as multiple extremes (e.g. VectorFlow is simultaneously
    min-growth, min-spend, and min-residual) — fewer highlighted companies than intended;
    pick indices that don't collapse, or explicitly pad the selection to guarantee
    ~6 distinct labels.
  - Visual hierarchy relies solely on text labels/connector lines; there's no secondary
    encoding (e.g. slightly larger marker or higher opacity for highlighted points)
    reinforcing which points are 'notable' — a stronger focal point would sharpen
    the data storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-annotated · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. Axis labels "R&D Spend ($M)" (x) and "Revenue Growth (%)" (y) in dark ink, fully legible. Tick labels in soft dark gray, legible against the light background. Grid lines are faint dashed off-white/gray, subtle but visible. Top/right spines removed, left/bottom spines soft gray.
      Data: ~24 green (#009E73) markers with alpha ~0.7 and a thin light-background stroke (subtle halo). Four points carry offset text labels (PrimeCode, RedShift, NextWave, VectorFlow) connected to their marker by a thin soft-gray line. Labels are dark soft-gray text, clearly readable, positioned in open space away from marker clusters, no overlap with other text or markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title in light off-white ink, clearly visible. Axis labels in light ink, fully legible. Tick labels in light gray, legible against the dark background. Grid lines are faint light gray, subtle but visible. Spines match the light-render treatment (top/right hidden, left/bottom soft gray).
      Data: Same 24 green (#009E73) markers at the same coordinates and same alpha/stroke treatment — data colors are identical to the light render, confirming only chrome flipped. The same four labels (PrimeCode, RedShift, NextWave, VectorFlow) render in light soft-gray text with matching connector lines, fully readable against the dark background — no dark-on-dark failures observed.
      Legibility verdict: PASS
