review:
  strengths:
  - 'Theme-adaptive chrome is implemented correctly in both renders: light background
    is warm off-white (#FAF8F1), dark background is warm near-black (#1A1A17), and
    all text/tick/grid colors flip appropriately with no dark-on-dark or light-on-light
    failures.'
  - 'Data color is identical between light and dark renders (brand green #009E73 for
    every marker), matching Imprint palette rules for single-series scatter.'
  - Canvas is exactly 3200x1800 (landscape target), title follows the mandated '{spec-id}
    · {language} · {library} · anyplot.ai' format, and axis labels include units ('R&D
    Spend ($M)', 'Revenue Growth (%)').
  - Data-driven point selection (top/bottom by growth, spend, and trend residual,
    with distinct-index backfill) is a thoughtful, idiomatic way to pick which points
    deserve callouts rather than hardcoding indices.
  - Clean spines (top/right removed), subtle gridlines, and moderate marker transparency
    (alpha=0.7) give the base scatter cluster a legible, uncluttered look that reveals
    overlapping points as the spec's Notes section requests.
  weaknesses:
  - Only 4 of the 6 companies the code intends to highlight actually show a text label
    + connector line in either render (PrimeCode, RedShift, NextWave, VectorFlow are
    visible; the other two labeled_idx entries produce no annotation anywhere on the
    3200x1800 canvas — confirmed by scanning the full image in both themes, not just
    a crop). The spec's core feature ('each data point can have a text label annotation...
    highlighting outliers, named entities, or key data points') is only two-thirds
    delivered.
  - 'The ''highlighted'' scatter!() layer (alpha=1.0, markersize=22, strokewidth=1.5)
    is visually indistinguishable from the regular unlabeled layer (alpha=0.7, markersize=16)
    in the saved PNG: pixel measurement across all 24 markers shows identical blob
    diameter (~19px) and identical median fill color (~rgb(75,185,152), which is exactly
    the alpha=0.7 blend of #009E73 over the page background) at every marker location,
    including the 4 that do have labels. The code''s own comment (''larger, fully-opaque
    marker so the labeled subset reads as a focal point even without the text/connector
    lines'') does not hold up in the rendered output — verify the second scatter!()
    call''s alpha/markersize arguments are actually taking effect (check for argument
    shadowing, unit/version mismatches, or a call-order issue where the highlight
    layer isn''t actually drawing at the stated size).'
  - Two markers near (10.5, 14) sit close enough to visually fuse into a darker double-blob
    purely from alpha-stacking of two ordinary (alpha=0.7) points — easy to mistake
    for one of the intended highlighted markers at a glance; worth nudging the label-selection/jitter
    logic to avoid this optical confusion, though it is not itself a bug.
  - 'Design Excellence is generic beyond the label/connector idea: no additional visual
    hierarchy (e.g., size or color encoding for a third variable) beyond the flat
    single-series scatter, so it reads as a solid but not distinctive implementation
    once the highlight mechanism is fixed.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-annotated · julia · makie · anyplot.ai" is bold dark ink, clearly readable top-center. Axis titles "R&D Spend ($M)" / "Revenue Growth (%)" and tick labels are dark/soft-ink gray, all legible against the light background. Gridlines are faint but visible. Top and right spines are removed; left/bottom spines are soft gray.
      Data: 24 green (#009E73) markers at alpha~0.7 forming a rough positive-trend cluster (R&D spend vs. revenue growth), plus one clear low-spend/negative-growth outlier. Exactly 4 markers (PrimeCode, RedShift, NextWave, VectorFlow) have a thin gray connector line running to an offset text label with the company name. The other markers (including 2 that the code intends to also highlight via a larger/more-opaque marker style) show no visible size or opacity difference from the rest — pixel-level check confirms all 24 markers share the same diameter and same alpha-blended fill color, and no additional labels are present anywhere in the canvas.
      Legibility verdict: PASS (all rendered text is legible) but FEATURE INCOMPLETE — 2 of 6 intended annotations are entirely absent from the render, and the highlighted-marker style never visually differs from the unlabeled style.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis titles render in light ink (near-white), tick labels in a softer light gray — all clearly legible against the dark background, no dark-on-dark failures. Gridlines are faint light lines, appropriately subtle.
      Data: Same 24 green markers at the same positions and same brand-green color as the light render (confirmed identical data color across themes, only chrome flipped). Same 4 labels (PrimeCode, RedShift, NextWave, VectorFlow) appear with connector lines in light-gray ink; the same 2 missing annotations and lack of highlighted-marker differentiation are reproduced identically, confirming this is a data/logic issue rather than a theme-specific rendering artifact.
      Legibility verdict: PASS for text contrast; same FEATURE INCOMPLETE issue as the light render.
