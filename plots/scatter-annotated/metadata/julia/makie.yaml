review:
  strengths:
  - 'Theme-adaptive chrome is correctly wired end-to-end: identical Imprint brand
    green (#009E73) data color in both renders, only background/text/grid/spine tokens
    flip between #FAF8F1 and #1A1A17.'
  - 'Genuinely thoughtful data storytelling: the six highlighted companies are chosen
    algorithmically as distinct extremes across growth, spend, and trend-residual,
    giving the annotations real analytical purpose instead of arbitrary picks.'
  - 'Robust label-collision handling: offset direction is computed from centroid quadrant,
    axis limits are padded to fit every label anchor, and a same-quadrant/near-neighbor
    pass pushes overlapping label pairs further apart.'
  - 'Clear two-tier visual hierarchy: translucent small markers for unlabeled points
    vs. opaque, larger, dark-ringed markers for the six highlighted/labeled companies.'
  - Correct canvas (3200x1800), canonical title format, descriptive axis labels with
    units ('R&D Spend ($M)', 'Revenue Growth (%)').
  weaknesses:
  - 'Library Mastery is thin: only baseline primitives (scatter!, lines!, text!) are
    used — no showcase of a Makie-distinctive feature (e.g. a custom recipe, Legend/Colorbar
    composition, or layout grid) that would differentiate it from a generic scatter-plus-annotate
    implementation.'
  - Visual refinement matches the style-guide baseline (spines removed, subtle grid,
    generous padding) but doesn't go beyond it with additional polish.
  - Only 6 of 24 points carry labels; acceptable per the spec's 'annotate a subset
    for large datasets' guidance, but on the low side — 8-10 labeled points would
    demonstrate feature coverage more fully without crowding the layout given the
    padding headroom already reserved.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "scatter-annotated · julia · makie · anyplot.ai" in bold dark ink, top/right spines removed, left/bottom spines and tick labels in soft muted ink, subtle light-gray gridlines. All chrome text is clearly readable against the light background.
      Data: 24 R&D-spend-vs-revenue-growth points in Imprint brand green (#009E73). 18 unlabeled points are smaller and semi-transparent (alpha 0.7); 6 highlighted points (VectorFlow, EdgeStack, BrightPath, RedShift, PrimeCode, NextWave) are larger, fully opaque, with a dark ring, each connected by a thin gray line to an offset text label. First (and only) series is correctly the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Same title now in light ink, spines/ticks in light-gray-soft ink, gridlines subtle against the dark background. No dark-on-dark or light-on-light failures observed — all title, axis labels, tick labels, and annotation text are clearly legible.
      Data: Same 24 points in the identical brand green as the light render; the two-tier translucent/opaque+ring marker treatment and label/connector-line layout are unchanged, confirming only chrome (not data color) flips between themes.
      Legibility verdict: PASS
