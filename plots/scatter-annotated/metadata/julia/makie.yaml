review:
  strengths:
  - 'Correct theme-adaptive chrome: backgrounds, ink tones, spines, and grid all flip
    correctly between light (#FAF8F1) and dark (#1A1A17) with identical data colors'
  - 'Thoughtful visual hierarchy: highlighted points use larger, fully-opaque markers
    with a dark ring while the rest stay smaller and alpha=0.7, making the annotated
    subset read as an intentional focal point'
  - Realistic, neutral synthetic dataset (24 named tech companies, R&D spend vs. revenue
    growth) with a deliberately capped outlier gap so the far-right point doesn't
    strand the axis
  - Careful axis-limit padding logic that accounts for label anchor positions so most
    offset labels stay inside the viewport with room for connector lines
  - 'Clean, idiomatic Makie usage: Axis kwargs for theme tokens, scatter!/lines!/text!
    layering, align/valign for label anchoring'
  weaknesses:
  - 'CONFIRMED BUG: one of the six highlighted (ringed, alpha=1.0, markersize=24)
    points near R&D Spend ≈ 10.3-10.7 / Revenue Growth ≈ 14 has NO visible label text
    or connector line in EITHER render (verified in both plot-light.png and plot-dark.png
    via pixel-level crops). The ring marker sits there unexplained, overlapping an
    adjacent unlabeled point, while the other 5 labeled points (VectorFlow, RedShift,
    PrimeCode, NextWave, and one more) render correctly with text + connector line.
    Root cause is likely in the label placement logic for points very close to the
    data centroid (cx, cy): the `rd_spend[i] >= cx` / `revenue_growth[i] >= cy` sign
    checks that pick label_dx/label_dy direction can put two nearby labels'' anchors
    on top of each other or on top of the marker cluster itself, and/or two labeled
    points that are extremely close in data space end up with anchors so close together
    that one label is effectively drawn under something else. Investigate: print/inspect
    label_x, label_y, label_dx, label_dy for all 6 entries in labeled_idx, and verify
    all 6 `lines!`/`text!` calls actually produce visible output distinct from each
    other and from the marker cluster; consider nudging apart label anchors that would
    otherwise coincide instead of relying purely on the centroid-relative sign.'
  - Because one annotation silently fails, the 'annotated scatter' plot's core required
    feature (a visible text label for every highlighted point of interest) is only
    partially delivered -- this is the headline feature of the spec, not a cosmetic
    detail
  - 'The data-storytelling payoff of the highlight system is undermined: a viewer
    sees an emphasized ringed dot with no explanation next to correctly-labeled peers,
    which reads as an unfinished/broken element rather than an intentional design
    choice'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: title "scatter-annotated · julia · makie · anyplot.ai" in dark ink, bold, centered top; axis labels "R&D Spend ($M)" and "Revenue Growth (%)" with units, dark ink; tick labels in a softer gray-brown; subtle light gridlines; top/right spines removed, left/bottom spines visible in a muted tone.
      Data: 24 green (#009E73) circular markers, most at alpha≈0.7/markersize≈15, six emphasized markers larger/fully opaque with a dark ring. Four of those six carry a text label (VectorFlow, RedShift, PrimeCode, NextWave) connected to their point via a thin gray line offset outward from the data centroid. A fifth ringed marker sits in a small cluster near R&D≈10.5 / Growth≈14 with NO visible label or connector line — confirmed via pixel-level crop, not a rendering artifact of my viewing.
      Legibility verdict: PASS for all rendered text (title/axes/ticks/the four visible labels all read cleanly against the light background). The missing label is a completeness/feature bug, not a legibility failure.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black.
      Chrome: same layout and content as light, ink flipped to a light off-white for title/axis labels, softer light gray for ticks; connector lines and label text in the same softened light tone. Grid subtle and visible.
      Data: identical green (#009E73) marker colors to the light render — confirmed no shift in data hue. Same four labels visible (VectorFlow, RedShift, PrimeCode, NextWave); the same fifth ringed marker near R&D≈10.5 / Growth≈14 again has no label or connector line, reproducing the same defect seen in the light render (theme-independent, confirms it's a data/logic bug rather than a theme-specific rendering issue).
      Legibility verdict: PASS for all rendered text — no dark-on-dark issues found. Same missing-label defect as the light render.
