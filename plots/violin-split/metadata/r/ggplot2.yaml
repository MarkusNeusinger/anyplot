review:
  strengths:
  - Clean, correctly-closed split-violin geometry built from a KDE polygon per subject/cohort
    half, with the two halves meeting exactly on the category center line as the spec
    requires
  - 'Both themes are fully theme-adaptive: chrome (title, axis text, grid, legend)
    flips correctly between #FAF8F1/#1A1A17 surfaces while the Imprint data colors
    (#009E73 Control, #C475FD Tutoring) stay identical'
  - Storytelling callout identifies and labels the subject with the largest Tutoring-vs-Control
    median gap, giving the chart a clear focal point instead of leaving the comparison
    to the reader
  - Median markers per half enable direct quantitative comparison between cohorts
    within each violin, not just a shape comparison
  - 'Correct output pipeline: ragg::agg_png device, linewidth (not deprecated size),
    set.seed(42) for reproducibility, all imports (ggplot2/dplyr/ragg) actually used'
  weaknesses:
  - Y-axis is expanded up to 125 via expansion(mult = c(0.05, 0.15)) purely to make
    room for the top callout, but no data or annotation reaches above ~114 — leaves
    a visibly empty band between the callout and the 125 gridline; tighten the upper
    expansion or move the callout closer to the violin tops.
  - Only a median line is drawn inside each half-violin; the spec explicitly suggests
    an inner box plot or quartile markers, and only the 50th percentile is shown with
    no IQR/quartile indication — consider adding thin quartile ticks (Q1/Q3) alongside
    the median for a fuller distributional summary.
  - The manual KDE-to-polygon technique is a reasonable workaround for ggplot2's lack
    of a native split-violin geom, but it is exactly the workaround the library prompt
    anticipates rather than a distinctive idiomatic pattern — no deduction beyond
    LM-01/02 defaults, just noting it isn't 'idiomatic ggplot2 grammar' in the strictest
    sense.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "violin-split · r · ggplot2 · anyplot.ai" in bold dark ink, clearly readable. "Cohort" legend (top center) with green/purple swatches and dark-ink labels "Control"/"Tutoring", legible. Y-axis "Exam Score" and X-axis "Subject" titles in dark ink; tick labels (25/50/75/100/125, Math/Science/English/History) in softer gray-ink, all legible. Horizontal gridlines only, thin and subtle, don't compete with data.
      Data: Four split violins (Math, Science, English, History), left half green (#009E73, Control) and right half lavender/purple (#C475FD, Tutoring), meeting exactly on the category center line. A dark horizontal median line sits inside each half. A callout "Largest gain: English +7.0 pts" with an underline bracket sits above the English violin, in bold dark ink.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend text, axis titles, and tick labels all flip to light ink (white/light-gray), clearly readable against the dark surface. Gridlines flip to a faint light color, still subtle. No dark-on-dark text anywhere — median lines and the callout bracket/label also flip to light ink so they remain visible against the green/purple fills and dark background.
      Data: Same violin shapes and layout as the light render; Control is still #009E73 green and Tutoring is still #C475FD lavender — identical hues to the light render, confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS — all text and chrome elements are clearly visible against the dark background, no dark-on-dark failures observed.
