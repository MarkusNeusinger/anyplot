review:
  strengths:
  - Solved ggplot2's lack of a native split-violin geom with a correct, well-documented
    KDE-polygon construction — outer edge traces the density curve, inner edge runs
    straight down the category center, so both halves meet exactly on the shared axis
    as the spec requires
  - Imprint palette used in canonical order (brand green for Control, lavender for
    Tutoring), identical across both themes, with a clear legend
  - Theme-adaptive chrome is threaded correctly through every element (title, axis
    text, grid, legend, and even the median segment color), producing two fully readable
    renders
  - Median markers per half satisfy the spec's 'inner quartile/box markers' suggestion
    and add a clear point of comparison between cohorts
  - Realistic, neutral data (exam scores across 4 subjects, Control vs Tutoring cohort,
    180 points per group) with sensible score ranges clamped to 0-100
  weaknesses:
  - The mandated title is noticeably smaller than the 50-70% width guidance (~35%
    of plot width at fontsize 12) — not a violation per the style guide's overflow/squeeze
    rule, but there's headroom to size it up slightly for visual weight as the first
    thing readers see
  - 'Design excellence is solid but standard: beyond the median segments there''s
    no additional visual hierarchy or annotation calling out the Control→Tutoring
    shift (e.g. a subtle arrow/callout on one category, or bolding the larger gaps)
    to strengthen the data storytelling'
  - The nested lapply/do.call construction for both data generation and polygon geometry
    is denser than a typical ggplot2 script — justified by the lack of a native split-violin
    geom, but worth a short comment block explaining the geometry trick for future
    maintainers (partially present already)
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: title "violin-split · r · ggplot2 · anyplot.ai" in dark ink top-left, legend "Cohort" with "Control"/"Tutoring" swatches top-center, y-axis "Exam Score" and x-axis "Subject" labels, tick labels 40/60/80/100 in soft gray, subtle horizontal gridlines only. All chrome clearly readable against the light background.
      Data: four split violins (Math, Science, English, History), green (Control) on the left half and lavender/purple (Tutoring) on the right half of each category, meeting exactly at the category's vertical center line. A black horizontal median segment sits inside each half. First series is Imprint brand green #009E73, second is lavender #C475FD, matching canonical palette order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: same title, legend, and axis labels now rendered in light ink/off-white, tick labels in soft light gray, gridlines in light color — all clearly legible against the dark background. No dark-on-dark or light-on-light failures observed.
      Data: identical green/purple violin halves and geometry as the light render; the median segments correctly flip to a light color (white) instead of black so they remain visible against the dark violin fills. Data colors are identical to the light render — only chrome flipped, as required.
      Legibility verdict: PASS
