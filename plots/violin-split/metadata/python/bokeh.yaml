review:
  strengths:
  - Each half is its own group's KDE, Placebo always on the left, halves closed along
    the shared center line (C1, C2)
  - Per-half median (solid) and quartile (dotted) segments drawn in INK so they read
    on both fills in both themes
  - 'Clean theme threading: every chrome element takes PAGE_BG/ELEVATED_BG/INK/INK_SOFT;
    no dark-on-dark'
  - Library-native HoverTool exposes median, Q1, Q3 and N per half in the HTML
  - Adaptable data block with column constants; legend and axis titles come from them
  weaknesses:
  - 'CQ-01 (code): a gaussian_kde() helper function breaks the flat Imports → Data
    → Plot → Save structure → inline the density computation. Likely cause: def gaussian_kde
    at lines 51-59.'
  - 'CQ-04 (code): lines 51-59 write out a Gaussian KDE with a Scott-style bandwidth
    by hand → scipy.stats.gaussian_kde(values)(grid). Likely cause: hand-rolled kernel
    sum instead of the available SciPy call.'
  - 'Suggestion: tails of halves whose data is clipped at 0 or 100 (Severe and Moderate
    Placebo) are drawn a few points past the scale; clipping the grid to the 0-100
    domain would keep them inside it.'
