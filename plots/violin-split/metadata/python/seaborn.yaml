  strengths:
  - Native seaborn split violins (hue + split=True) with inner='quart' quartiles drawn
    at each half's own quartiles
  - cut=0 ends every half at its data range, so tails do not trail beyond the observed
    values
  - inner_kws threads the INK token into the quartile lines, so they read on both
    fills in both themes
  - 'Data built to compare: bimodal Nordic and Alpine winters, and a Mediterranean
    region whose summer half outweighs winter'
  - 'Clean adaptable layout: column constants with role comments, palette sliced from
    the counted hue levels, exact 3200x1800 canvas'
  weaknesses:
