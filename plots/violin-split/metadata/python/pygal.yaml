      Data: four split violins, Before (#009E73 green) on the left, After (#C475FD lavender) on the right of each center line; hairline ink IQR lines and median ticks per half; tails extend past the data, Clinic D Before dips below 0 and its top reaches the title row; thin stray lines from 0 to the bottom of the A, B, C violins; legend bottom-left 'Before' / 'After'
