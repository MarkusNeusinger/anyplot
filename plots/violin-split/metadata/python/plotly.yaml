review:
  strengths:
  - 'Native plotly split violins: one go.Violin trace per gender with side=''negative''/''positive''
    and violinmode=''overlay'', so both halves meet exactly on a shared center line
    and Male stays on the left in every category'
  - 'Each half is the density of its own group: Software Engineering and Sales show
    visibly multimodal halves, Product Management and Operations single-peaked ones,
    with medians at different heights on the two sides'
  - Inner box plots with median and mean line sit inside their own half at that half's
    quartiles and are outlined in INK_SOFT, so they read on both backgrounds
  - spanmode='hard' ends each half at its data range instead of trailing KDE tails,
    and the value axis is not forced to zero
  - 'Theme tokens threaded through every chrome element: title, axis titles, ticks,
    grid, axis lines and legend frame all flip correctly between #FAF8F1 and #1A1A17'
  - 'Imprint palette in canonical order (#009E73 Male, #C475FD Female), with a legend
    titled Gender; HTML export keeps plotly''s native hover with quartiles per half'
  weaknesses:
  - 'DQ-03 (both): np.clip(salaries, 40000, 200000) piles every simulated salary below
    $40,000 onto exactly $40,000, so the Sales, Operations and Product Management
    halves end in flat, wide floors at $40k that the domain does not have → generate
    values that stay above the floor (e.g. a lognormal or a truncated draw that resamples)
    instead of clipping. Likely cause: np.clip on the normal mixture.'
  - 'VQ-03 (both): the median and mean lines inside the inner boxes are drawn at about
    1 px (box line width=1, meanline width=1.5, dotted) and vanish in the 400 px thumbnail,
    so the quartile markers lose their centre → about 2–2.5 px (+1 px) for the box/median
    line. Likely cause: box=dict(line=dict(width=1)) and meanline width=1.5.'
  - 'Suggestion: the legend title ''Gender'' sits above the baseline of its entries;
    title side=''top left'' or a vertically centred title would align it.'
  - 'Suggestion: the gap between the title and the legend box is large; a slightly
    smaller top margin would tighten the header.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across paper and plot area.
