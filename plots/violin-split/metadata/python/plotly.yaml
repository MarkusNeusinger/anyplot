      Data: four split violins, Male (#009E73, 0.75 opacity) on the left half, Female (#C475FD) on the right, meeting at a shared center line. Software Engineering halves are bimodal, Sales halves long and multimodal, Product Management and Operations single-peaked. Each half carries a narrow near-white inner box with thin median and dotted mean lines. Sales, Operations and the Product Management male half end in flat floors at $40,000 (clip artifact).
      Legibility verdict: PASS

