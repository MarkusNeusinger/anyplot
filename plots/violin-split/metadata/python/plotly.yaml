review:
  strengths:
  - Native go.Violin split with side='negative'/'positive' and violinmode='overlay'
    gives each category two independent half densities that meet at a shared center
    line, Male always on the left and Female always on the right
  - Inner box plot per half (box=dict(visible=True)) sits at the quartiles of its
    own half, with an ELEVATED_BG fill and INK_SOFT outline that stay visible on the
    fill in both themes, plus a dashed mean line
  - spanmode='hard' ends every half at its own data range, so no tail trails past
    the observed salaries; value axis is shared and not forced to zero
  - Mixture-based synthetic data (bimodal Software Engineering, trimodal Sales, unimodal
    Product Management and Operations) shows the lopsided, multimodal halves the chart
    exists to compare
  - 'Theme tokens threaded through every chrome element; Imprint #009E73 / #C475FD
    identical in both renders; $ tick formatting via tickformat=''$,.0f'''
  - HTML export keeps Plotly's native hover (quartiles, mean, KDE extents per half)
    and legend toggling for the interactive view
  weaknesses:
  - 'Suggestion: the legend title ''Gender'' sits above the baseline of the ''Male''/''Female''
    entries; legend.title.side=''top left'' or a vertically centred title would align
    it with the entries.'
  - 'Suggestion: the dashed mean line (width=6) next to the solid median line inside
    small boxes reads busy in Operations; a thinner mean line would keep the median
    the clear focal mark.'
