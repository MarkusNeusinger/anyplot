review:
  strengths:
  - Native split via geom_violin(show_half=-1/1), with each half the density of its
    own group and Before always on the left
  - Inner boxplots nudged into each half mark that half's quartiles and stay visible
    against the fill in both themes
  - trim=True ends every half at its data range on an automatic axis that is not forced
    to zero
  - 'Imprint positions 1 and 2 (#009E73 Before, #C475FD After) identical across themes,
    with fully theme-adaptive text and grid'
  - Correct 3200x1800 canvas from ggsize(800, 450) and scale=4, with library-prompt
    font sizes
  - HTML export keeps letsplot's native hover tooltips for the densities and boxes
  weaknesses:
  - 'VQ-03 (dark): the violin outlines, box whiskers and outlier dots are drawn in
    the library-default dark gray (#474747) and nearly vanish on the #1A1A17 background
    → theme-adaptive INK_SOFT outlines. Likely cause: geom_violin and geom_boxplot
    have no color= set from INK_SOFT.'
  - 'DE-02 (both): a four-sided #474747 panel frame keeps the top and right spines
    the style guide removes by default → left and bottom axis lines only. Likely cause:
    no panel_border=element_blank() in theme().'
  - 'Suggestion: clipping the normal samples at 20 and 100 piles values on the bounds,
    so Sales and Design end in flat full-width cuts at 100; a bounded distribution
    (beta scaled to 0-100) would taper naturally.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled), 3200x1800.
      Chrome: bold title "violin-split · python · letsplot · anyplot.ai" top left at about 50% width; axis titles "Department" and "Satisfaction Score (0-100)" in dark INK; ticks 20-100 and the four department names in INK_SOFT; subtle horizontal grid; a gray four-sided panel frame; legend "Period" (Before, After) on the right in a light frame. All text readable.
      Data: four split violins (Engineering, Marketing, Sales, Design), Before in #009E73 on the left, After in #C475FD on the right, meeting at a shared center line; trimmed halves end at their data range (20-100), Sales and Design flat at 100; narrow inner boxplots inside each half with median lines; a few small outlier dots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled).
      Chrome: title and axis titles in light INK, ticks in light INK_SOFT, grid faint but visible, legend on #242420. No dark-on-dark text. The panel frame, violin outlines, whiskers and outlier dots stay in default dark gray #474747 and are barely visible against the background.
      Data: same #009E73 / #C475FD colors as the light render (the alpha 0.75 fill reads darker on the dark page); boxes clearly visible.
      Legibility verdict: PASS (text), with low-contrast outlines and outlier dots
