review:
  strengths:
  - Each half is its own gaussian_kde evaluated only across its group's data range,
    so tails stop at the data and the two sides differ honestly (C1, C5)
  - A shared density peak scales all eight halves, so widths are comparable across
    categories and groups
  - Theme tokens reach every text element including the legend title and labels; both
    renders fully readable
  - Median (long, bold) and quartiles (short, thin) drawn on the half they describe,
    readable on both fills in both themes (C4)
  - Exact 3200x1800 canvas with subplots_adjust margins and the adaptable column-constant
    structure
  weaknesses:
  - 'Suggestion: the bold median bars are a fixed 0.30 wide and run slightly past
    the outline of narrow halves (Middle School and High School Control); length them
    by the local density so they stay inside the half.'
  - 'Suggestion: ax.violinplot(..., side=''low''/''high'') (matplotlib 3.9+) draws
    native half violins; it would need a common width scale to keep the cross-category
    width comparison.'
  - 'Suggestion: the full-height center lines could stop at the violin extent instead
    of spanning the whole axis.'
