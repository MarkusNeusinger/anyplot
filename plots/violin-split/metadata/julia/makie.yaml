review:
  strengths:
  - Native CairoMakie split-violin implementation via violin!(side=:left/:right) called
    twice per category — idiomatic and distinctive to Makie's plotting recipe system
  - Full theme-adaptive chrome correctly threaded through Figure and Axis (background,
    title, axis labels, ticks, spines, grid, median-line color) — both renders pass
    the theme-readability check with no dark-on-dark or light-on-light failures
  - 'Imprint palette correctly applied in canonical order — Irrigated is brand green
    #009E73, Rain-fed is #C475FD lavender, identical between light and dark renders'
  - The two halves meet cleanly at the center line for every category as required
    by the spec, with alpha=0.85 fill plus a matching stroke to keep the split boundary
    crisp
  - Custom Legend built from PolyElement swatches that mirror the actual violin fill/stroke
    exactly, placed inside the plot's empty upper-left region without overlapping
    any data or text
  - All font sizes are explicitly set (titlesize=20, xlabelsize/ylabelsize=16, tick
    label sizes=14) and remain readable in both themes with no overlap or clipping
  - Realistic, neutral agricultural dataset (crop yield under irrigated vs. rain-fed
    conditions) with plausible tons-per-hectare magnitudes and sensible relative gaps
    between crops
  weaknesses:
  - 'Design Excellence is close to library-default execution: correct palette/theme
    tokens are applied, but there is no bespoke visual-hierarchy element (e.g., annotating
    or emphasizing the crop with the largest irrigated-vs-rain-fed gap) that would
    lift it above a well-configured default into a genuine storytelling piece'
  - All four crop/split-group distributions are similarly-shaped unimodal normals
    differing mainly in mean and spread — consider giving at least one group a distinct
    shape (skew, bimodality, or a visible outlier tail) to more fully demonstrate
    the split-violin's ability to contrast distribution shape, not just level
  - The KDE tails for Soybean (rain-fed) and Rice (rain-fed) dip slightly below y=0,
    implying a physically impossible negative crop yield — a minor artifact of the
    density estimate's bandwidth rather than the underlying data, but worth trimming
    or noting since yield cannot be negative
  - The mandated title occupies only ~25-30% of the plot width at titlesize=20, well
    under the ~50-70% comfortable range for a title of this length — a larger titlesize
    would give the title more visual presence without risking overflow
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "violin-split · julia · makie · anyplot.ai" in bold dark ink, centered at top and fully visible. X-axis label "Crop" and Y-axis label "Yield (tons per hectare)" in dark ink, both explicitly sized and readable. Tick labels (crop names on X, 0/5/10 on Y) in a softer dark grey, clearly legible. A subtle horizontal grid line sits at y=5 (and near y=10), barely visible, not competing with the data. Legend ("Irrigated" / "Rain-fed" swatches) sits inside the upper-left of the plot area, fully readable, not overlapping any violin.
      Data: Four categories (Wheat, Corn, Soybean, Rice) each show a split violin — green (#009E73) left half for Irrigated, lavender (#C475FD) right half for Rain-fed, both at alpha ≈0.85 with a matching stroke. A dark median line crosses each half at its own median value. The two halves meet cleanly at the center line for every category. Rice shows the widest spread and highest yields; Soybean the lowest.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (title/axis labels near-white, tick labels a softer light grey) — all clearly legible against the dark surface. Grid line at y=5 (and near y=10) is a faint light line, subtle. Legend box and swatches remain fully readable in the same upper-left position.
      Data: The two violins per category use the identical green (#009E73) and lavender (#C475FD) fills and alpha as the light render — data colors did not shift with the theme. Median lines are now rendered in light ink (white) rather than black, so they remain visible against the fills in this theme.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text and the median lines are clearly visible against the near-black background.
