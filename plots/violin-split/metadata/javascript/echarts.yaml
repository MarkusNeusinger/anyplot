review:
  strengths:
  - Correct split-violin structure via two ECharts custom series rendering left/right
    halves per category, meeting cleanly at the center line
  - 'Statistically careful: each half''s KDE is evaluated over its own local data-driven
    range (not the full axis span), avoiding the ''stretched needle'' artifact seen
    when a tight distribution shares the taller group''s range'
  - Axis range derived from the 1st/99th percentile with padding, so a rare outlier
    draw doesn't shrink every well-behaved violin
  - Deterministic in-memory data generation via a seeded LCG normal sampler, no external
    RNG or network calls
  - Theme-adaptive chrome (title, legend, axis, median-tick color) correctly threaded
    through window.ANYPLOT_TOKENS — legible in both light and dark renders
  - Imprint palette used in canonical order (brand green then lavender), identical
    data colors across both themes
  - Per-half median tick lines add a quantile reference without cluttering the density
    shapes
  weaknesses:
  - Spec's 'consider adding inner box plot or quartile markers' is only partially
    addressed — a single median tick is shown per half, with no IQR/box overlay
  - 'Minor tick-label size imbalance: x-axis category labels are 16px vs y-axis value
    ticks at 14px'
  - Local KDE range is capped at axisMin/axisMax, which can flatten a violin's tail
    right at the axis boundary instead of tapering to zero density (visible at the
    top of the Teens/Young Adults weekend violins near y=11) — mostly cosmetic but
    worth a slightly wider padding or a visible taper
  - Overall styling follows the library skeleton fairly closely (standard grid/legend
    placement) rather than a distinctly bespoke visual treatment
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Sleep Duration: Weekday vs Weekend · violin-split · javascript · echarts · anyplot.ai" in dark ink, centered at top; legend below it with "Weekday" (green swatch) and "Weekend" (lavender swatch); x-axis shows four category labels (Teens, Young Adults, Adults, Seniors) in soft dark gray; y-axis shows "Sleep Duration (hours)" plus numeric ticks 4-11; subtle horizontal gridlines only.
      Data: Four split violins, each with a green left half (Weekday) and lavender right half (Weekend), meeting at a vertical center line per category. A dark horizontal median tick sits inside each half. Weekend halves are visibly shifted higher (later/longer sleep) and slightly wider than Weekday halves, with the effect shrinking from Teens to Seniors.
      Legibility verdict: PASS — all text (title, legend, axis label, ticks) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis structure as the light render, now rendered in light ink/gray text against the dark surface; gridlines are faint light lines.
      Data: Same green (Weekday) / lavender (Weekend) violins with the same shapes, positions, and proportions as the light render — data colors are identical between themes, only the chrome (background, text, grid) flipped. Median tick lines are rendered in light ink and remain clearly visible against the dark fills and background.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues; all title/axis/tick/legend text is clearly visible against the dark background.
