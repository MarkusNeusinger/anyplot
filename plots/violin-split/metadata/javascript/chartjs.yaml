review:
  strengths:
  - 'Correct split-violin technique: hand-drawn KDE silhouettes meet cleanly at each
    category''s center line, using Chart.js''s own scales for pixel mapping — the
    code comment correctly explains why Chart.js''s line-fill can''t produce a horizontally-varying
    silhouette, so drawing it directly in an afterDraw plugin is the right call.'
  - 'First series is the mandated brand green #009E73 (Control) and the second series
    uses Imprint position 2 (#C475FD lavender) for the New method cohort, identical
    across both themes; chrome (background, text, grid) flips correctly between light
    and dark.'
  - Quartile/median markers (IQR tick + median circle) satisfy the spec's 'inner box
    plot or quartile markers' note and read clearly against both fills.
  - Realistic, neutral dataset (exam scores, control vs. new teaching method) with
    genuine comparative variation — Math shows no measurable difference while Science
    shows a clear gain, giving the split violin real analytical value instead of every
    category looking the same.
  - Deterministic seeded LCG PRNG, animation disabled per the mount-node contract,
    no stray DOM nodes.
  weaknesses:
  - Y-axis title 'Exam score' has no unit (e.g., '/100' or 'points') — VQ-06 wants
    an explicit unit for full marks.
  - The violin and marker rendering is entirely custom canvas drawing in an afterDraw
    plugin hook with an empty data.datasets — functionally correct and justified by
    Chart.js's lack of a native violin type, but it means Chart.js's own data-binding/legend
    machinery is bypassed, which caps idiomatic-usage credit.
  - Heavy helper-function decomposition (PRNG, stats, KDE, quantile, two draw functions)
    is reasonable given the custom-violin requirement but moves away from the KISS
    'imports → data → plot → save' ideal.
  - No explicit callout of the standout Science-subject gap, which is the chart's
    clearest story beat — a small annotation or emphasis there would push Data Storytelling
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "violin-split · javascript · chartjs · anyplot.ai" and italic subtitle explaining the encoding are dark and crisp near the top; legend swatches ("Control" green, "New method" purple) sit centered below the subtitle; x-axis category labels (Reading, Writing, Math, Science, History) and "Subject" title are dark and legible; y-axis tick labels (10-110) and "Exam score" title are dark and legible; subtle horizontal gridlines are visible but unobtrusive.
      Data: Five split violins, left half green (#009E73, Control), right half purple/lavender (#C475FD, New method) — halves meet exactly at each category's center line with no gap or seam. Black IQR ticks with white-filled, colored-stroke median circles sit inside each half. Math shows the two halves nearly identical (no treatment effect); Science shows the purple half clearly shifted higher (largest effect).
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, legend text, axis titles, and tick labels all render in light/off-white tones, clearly visible against the dark surface. IQR ticks switch to white for contrast against the dark background while the median-circle fill uses the dark page background so it reads as a hollow ring. Gridlines are faint but present.
      Data: Same green (#009E73) and purple (#C475FD) fills as the light render — colors are identical between themes, only chrome flipped. Same shapes, same relative center-line meeting, same Math/Science contrast.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the near-black background.
