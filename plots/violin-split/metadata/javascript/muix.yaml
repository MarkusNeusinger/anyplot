review:
  strengths:
  - 'All four weaknesses from the attempt-1 review are fixed: skipAnimation is now
    set on ChartContainer, GRID_N raised 140→220 for smoother KDE outlines, a center
    spine line anchors each pair of halves, and a ''Largest gap'' callout annotation
    now anchors the data-storytelling focal point.'
  - Correctly recognizes that community @mui/x-charts has no native violin mark and
    composes one from ChartContainer's cartesian scales via useXScale/useYScale —
    a genuinely distinctive, hook-driven pattern rather than reaching for a Pro feature
    or a different library.
  - Real Gaussian KDE with Silverman's-rule bandwidth per category/split-group, trimmed
    to its support so tails pinch cleanly to the center spine instead of drawing near-invisible
    slivers across the full y-range.
  - Inner IQR bars and median dots inside each half directly satisfy the spec's 'consider
    adding inner box plot or quartile markers' note, colored from the theme's page
    background so they read against either fill in both themes.
  - Deterministic LCG + Box-Muller sampling with a clear comment on why only the physical
    floor (0) is clamped while the axis caps at 100, so the KDE tail decays naturally
    instead of piling up on a hard boundary.
  weaknesses:
  - A couple of violin lobes (e.g. Mathematics/History right halves) still show a
    faint secondary bump — an artifact of KDE sampling noise at n=140 rather than
    the grid resolution; not a defect, but a slightly higher N_PER_GROUP (e.g. 200)
    would make the silhouettes read as more clearly unimodal.
  - The gap-callout annotation is only added for the single largest-gap category;
    a small numeric label on the other three panels (or a shared subtitle) could reinforce
    the comparison further, though this is a nice-to-have, not a gap versus the spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the full canvas, no white or dark leakage.
      Chrome: Title "violin-split · javascript · muix · anyplot.ai" is bold dark text, clearly readable and comfortably sized. Legend swatches ("Control group" green, "Experimental group" lavender) with dark labels are readable. X-axis "Subject" and Y-axis "Test score (points)" titles are bold and dark; tick labels (Mathematics/Science/Language Arts/History, and 35-100 numeric ticks) are dark and legible. Horizontal grid lines are subtle light-gray, visible but not dominant. A bold dark "Largest gap: +8.2 pt" callout sits above the Science violin, clear of any tick labels or gridlines.
      Data: Control group uses Imprint brand green (#009E73) on the left half of each violin; Experimental group uses Imprint lavender (#C475FD) on the right half. A thin muted spine line anchors each pair of halves at the center. Median dots and IQR bars are drawn in the page-background cream color, outlined in the group color, clearly visible against both fills. KDE outlines are smooth (GRID_N=220) with only a very faint secondary bump on a couple of lobes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the full canvas, no pure-black or light leakage.
      Chrome: Title, legend text, axis titles/tick labels, and the "Largest gap" callout all switch to light text via the harness's ThemeProvider — all clearly readable against the dark background. No dark-on-dark text found anywhere. Grid lines remain subtle but visible.
      Data: Control-group green and Experimental-group lavender are pixel-identical to the light render — only the chrome (background, text, grid, spine) flipped, as required. Median dots and IQR bars now render as near-black (page-background) markers outlined in the group color, reading clearly against the fills, mirroring the light render's treatment.
      Legibility verdict: PASS
