review:
  strengths:
  - Each half is its own Gaussian KDE normalized to its own peak, so the asymmetry
    between Control and Experimental reads directly; both halves meet on a shared
    centre spine with Control always on the left
  - Custom SVG layer composed inside ChartsContainer through useXScale/useYScale,
    so the hand-drawn halves share the band and linear scales, the axes and the grid
    of the community chart
  - Inner Q1–Q3 bars drawn in the page colour with a ringed median dot stay visible
    against both fills in both themes, and the subtitle explains the encoding
  - Value axis is not forced to zero and each half's tail ends 1.5 bandwidths past
    its data, clipped at the 0–100 score range
  - 'Theme tokens threaded through every text and chrome element; data colours identical
    in both renders (Imprint #009E73 and #C475FD)'
  weaknesses:
  - 'Suggestion: the headroom reserved above the 100 tick for the median-gap callout
    leaves an empty band between legend and plot; without the callout the violins
    could use that height.'
  - 'Suggestion: the x-axis band (height 72) leaves a wide gap between the category
    ticks and the ''Subject'' label; a tighter band would sit the label closer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "violin-split · javascript · muix · anyplot.ai" bold dark ink top-left, grey subtitle "1,120 test scores across 4 subjects · bar: Q1–Q3 of each half, dot: its median", HTML legend "Control (left half)" green / "Experimental (right half)" lavender; y axis "Test score (points)" ticks 35–100 every 5, x axis "Subject" with Mathematics, Science, Language Arts, History; subtle horizontal grid; left and bottom axis lines only. Bold callout "Largest median gap: Experimental +8.3 points" above Science. All text readable.
      Data: four split violins, left halves brand green #009E73, right halves lavender #C475FD at 0.7 fill opacity with solid outlines, meeting on a thin centre spine. Each half has a page-coloured Q1–Q3 bar and a ringed median dot. Control halves sit lower (medians ~67–75) with long lower tails (Mathematics down to ~35); Experimental halves are higher and tighter (medians ~73–81).
      Legibility verdict: PASS

