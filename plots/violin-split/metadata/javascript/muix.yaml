review:
  strengths:
  - Correctly recognizes that community @mui/x-charts has no native violin mark, and
    falls back to a composed solution — ChartContainer plus useXScale/useYScale hooks
    driving hand-drawn SVG paths — instead of reaching for a forbidden Pro feature
    or a different library.
  - Implements a real Gaussian KDE with Silverman's rule bandwidth per category/split-group,
    and trims each density curve to its support so tails pinch cleanly to the center
    spine instead of drawing near-invisible slivers across the full y-range.
  - Adds inner IQR bars and median markers inside each half, directly satisfying the
    spec's 'consider adding inner box plot or quartile markers' note, and colors those
    markers from the theme's page background so they read against either colored fill
    in both themes.
  - Uses fillOpacity 0.75 on the violin halves so the center-line meeting point stays
    legible per the spec's alpha-transparency guidance.
  - Deterministic tiny-seed LCG plus Box-Muller Gaussian sampling, with an explicit
    code comment explaining why only the physical floor (0) is clamped and the axis
    (not the data) caps at 100 so the KDE tail decays naturally instead of piling
    up on a hard boundary.
  weaknesses:
  - The <ChartContainer> does not set `skipAnimation`, which the muix library guide
    calls a mandatory belt on every chart component. It causes no visible defect here
    only because `series={[]}` leaves nothing built-in to animate, but add it anyway
    for correctness/consistency with the documented contract.
  - The KDE silhouettes show slight faceted/jagged bumps on some lobes (e.g. Mathematics
    and History right halves) from the 140-point evaluation grid — raising GRID_N
    to ~200-250 would smooth the outline without a real performance cost.
  - The two violin halves meet only where their path outlines abut; a thin center
    spine stroke would visually anchor the split more crisply, especially where the
    two fills are similar in value near the median.
  - No annotation or emphasis calls out the largest control-vs-experimental gap across
    subjects — a small callout would sharpen the data-storytelling focal point beyond
    'four similar-looking panels'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the full canvas, no white/dark leakage.
      Chrome: Title "violin-split · javascript · muix · anyplot.ai" is bold dark text, clearly readable. Legend swatches ("Control group" green, "Experimental group" purple) with dark-gray labels are readable. X-axis "Subject" and Y-axis "Test score (points)" titles are bold and dark; tick labels (Mathematics/Science/Language Arts/History, and 35-100 numeric ticks) are dark and legible. Horizontal grid lines are subtle light-gray, visible but not dominant.
      Data: First split group (Control group) uses Imprint brand green (t.palette[0], #009E73-family) on the left half of each violin; second split group (Experimental group) uses a purple (t.palette[1]) on the right half. Median dots and IQR bars are drawn in the page-background cream color outlined/stroked in the group color, clearly visible against both fills. Violin halves meet cleanly at a center spine for all four categories.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the full canvas, no pure-black or light leakage.
      Chrome: Title, legend text, and both axis titles/tick labels switch to light/white text via the harness's ThemeProvider — all clearly readable against the dark background. No dark-on-dark text found anywhere (title, ticks, axis labels, legend all checked). Grid lines remain subtle but visible.
      Data: Control-group green and Experimental-group purple are pixel-identical to the light render — only the chrome (background, text, grid) flipped, as required. Median dots and IQR bars now render as near-black (page-background) markers outlined in the group color, which read clearly against the green/purple fills, mirroring the light render's treatment.
      Legibility verdict: PASS
