review:
  strengths:
  - 'Correct Imprint palette: ''Before treatment'' renders in #009E73 and ''After
    treatment'' in the next palette color, identical between light and dark renders'
  - 'Theme-adaptive chrome is fully correct: #FAF8F1 light / #1A1A17 dark backgrounds,
    all title/axis/tick/legend text is legible in both themes with no dark-on-dark
    or light-on-light failures'
  - 'Clever, self-contained workaround for the core-bundle-only constraint: builds
    the split violin from plain ''area'' series with per-category ''threshold'', avoiding
    highcharts-more/boxplot entirely, plus a from-scratch deterministic LCG + Box-Muller
    + Gaussian KDE implementation'
  - Adds inner median markers (diamond scatter points) per half-violin, directly answering
    the spec's suggestion to 'consider adding inner box plot or quartile markers'
  - Realistic, neutral data story (patient recovery scores before/after treatment
    across 4 clinics) with sensible 0-100 scale and plausible before/after shift
  - Title format and legend labels match the spec/style-guide requirements exactly
  weaknesses:
  - 'Edge-category half-violins are effectively invisible: for the bottom-most category
    (Clinic A), the ''Before treatment'' half (which dips below the category baseline)
    renders as a flat line with no visible density dome, and for the top-most category
    (Clinic D), the ''After treatment'' half (which rises above the baseline) is likewise
    flattened. Both middle categories (Clinic B, Clinic C) show both halves with full,
    correctly proportioned amplitude in both light and dark renders. Since every half
    is normalized to the same HALF_WIDTH peak, all eight half-violins should look
    equally prominent — investigate why the yAxis min/max (-0.6 to length-1+0.6) isn''t
    giving the two outer rows the same visible room as the inner rows (check startOnTick/endOnTick
    interaction with the explicit tickPositions, or increase the outer padding directly)
    so all 4 categories show both comparison halves clearly.'
  - 'Design excellence is solid but not yet distinctive: the area fills read as a
    clean but fairly literal reuse of a standard KDE ridge plot; consider a stronger
    visual anchor (e.g. a data label on each median marker, or a subtle connector
    between the before/after medians) to sharpen the before/after storytelling once
    the clipping bug above is fixed'
  - Several small hand-written statistics helpers (rand, normal, std, median, kde)
    are unavoidable given the no-import/self-contained constraint, but this pushes
    Code Elegance/KISS toward the lower end versus specs that can call a library function
    directly
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-split · javascript · highcharts · anyplot.ai" in bold dark ink at top-center, subtitle "Patient recovery scores before vs. after treatment, by clinic" below it in soft grey. X-axis "Recovery Score" (0-100, gridded every 5) at the bottom in soft grey. Y-axis has no title; instead four category labels ("Clinic A" through "Clinic D") sit at each row's baseline. Legend ("Before treatment" green swatch, "After treatment" purple swatch) is centered below the x-axis title. All text is dark-on-light and clearly readable; no light-on-light issues.
      Data: Four horizontal rows (one per clinic), each row split into a green "Before treatment" density that bulges below its baseline and a purple "After treatment" density that bulges above its baseline, meeting cleanly at the row's centerline. Small dark diamond markers sit on each baseline marking the before/after medians. Clinic B and Clinic C show both the green dip and the purple bump clearly and proportionally. Clinic A (bottom row) shows a large purple "after" bump but its green "before" half is essentially flat/invisible; Clinic D (top row) shows a large green "before" dip but its purple "after" half is essentially flat/invisible.
      Legibility verdict: PASS (all text readable) but with a data-visibility defect on the two edge categories (see above).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis/legend content as the light render, now rendered in light grey/white ink against the dark background. Grid lines are subtle vertical lines, still visible but unobtrusive. No dark-on-dark failures — every label is clearly legible.
      Data: Identical green (#009E73) and purple hues to the light render — confirmed unchanged between themes, only chrome flipped. The same asymmetry repeats: Clinic B and Clinic C show both halves with equal, visible amplitude; Clinic A's green "before" half and Clinic D's purple "after" half are again flattened to a thin line rather than a visible dome.
      Legibility verdict: PASS for text; the half-violin visibility defect is identical to the light render (confirms it is a data/axis issue, not a theme-rendering issue).
