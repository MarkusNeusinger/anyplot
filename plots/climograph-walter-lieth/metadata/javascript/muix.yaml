review:
  strengths:
  - Composes the chart from ChartsContainer primitives and a custom WalterLiethFill
    component that reads the chart's own scales through useXScale/useYScale/useDrawingArea,
    so the humid/arid polygons sit exactly on the plotted lines in both renders
  - The humid and arid fills switch exactly at the interpolated crossover points (late
    April/May and mid-September), which is the diagram's defining feature
  - The right axis shares the temperature scale and relabels it through a valueFormatter
    (×2 below 100 mm, 10:1 above), so 10 °C aligns with 20 mm and both zeros share
    one baseline
  - Header subtitle computes the annual mean (17.5 °C) and annual total (567 mm) from
    the data instead of typing them
  - Frost-month blocks and the perhumid band are data-driven and appear only when
    the data has such months, so the code adapts to other stations
  weaknesses:
  - 'CQ-04 (code): both curves are drawn twice — LinePlot renders the temp and precip
    series, and lines 223–248 redraw every segment as SVG <line> elements in the same
    colors at 3 px, with no visible effect → delete the manual line loop (or drop
    LinePlot). Likely cause: the redraw was added to put lines above the fills instead
    of ordering <WalterLiethFill /> before <LinePlot />, which the JSX already does.'
  - 'SC-02 (both): the Notes ask for the conventional ticks at 0, 10, 20, 30 °C and
    0, 20, 40, 60 … mm; the render ticks every 5 °C / 10 mm and runs the temperature
    axis up to 45 °C → ticks at multiples of 10 °C on the left and 20 mm on the right
    (halve the tick count). Likely cause: no tickInterval/tickNumber on the two y
    axes.'
  - 'DQ-02 (both): the data is labelled as Lisbon, Portugal 1991–2020 normals but
    sums to 567 mm a year, well below the roughly 700+ mm of Lisbon''s published normals
    (e.g. Nov 93 mm vs about 120 mm) → use the published monthly normals for the named
    station and period, or a station name that does not claim real normals. Likely
    cause: hand-typed precipitation values.'
  - 'Suggestion: the hand-built HTML legend could carry the line series through ChartsLegend
    inside ChartsDataProvider, keeping only the fill swatches custom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "climograph-walter-lieth · javascript · muix · anyplot.ai" centered (~35% width), soft-ink subtitle "Lisbon, Portugal (77 m a.s.l.) · Annual mean 17.5 °C · Annual total 567 mm · Normals period: 1991–2020"; left axis "Temperature (°C)" ticks 0–45 every 5, right axis "Precipitation (mm)" ticks 0–90 every 10, aligned 10 °C ↔ 20 mm with a shared zero; month ticks Jan–Dec; subtle horizontal grid; legend row below (Temperature, Precipitation line samples, Humid/Arid period swatches). All text dark and readable.
      Data: matte-red #AE3030 temperature line (11–24.5 °C), Imprint blue #4467A3 precipitation line (4–93 mm); translucent blue fill Jan–early May and mid-Sep–Dec where precipitation lies above temperature, translucent red fill May–mid-Sep (arid summer); fills switch at the crossings. No frost marks (all months > 0 °C) and no perhumid band (no month > 100 mm), both permitted. First-series green not used: the red/blue semantic pair the spec names.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and legend text in light ink, all clearly readable; grid subtle dark gray; no dark-on-dark text.
      Data: identical red and blue lines and fills as the light render; the translucent fills read darker on the dark surface but both humid and arid areas remain clearly visible.
      Legibility verdict: PASS
