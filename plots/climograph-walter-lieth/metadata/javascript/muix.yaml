review:
  strengths:
  - Composes the chart from ChartsContainer + LinePlot + ChartsXAxis/ChartsYAxis and
    injects a custom SVG layer (WalterLiethFill) that reads the shared scales through
    useDrawingArea/useXScale/useYScale, so the humid/arid/perhumid polygons sit exactly
    on the plotted curves
  - Humid and arid fills switch at the exact interpolated crossing of the two curves
    (May–Jun and Sep), and the >100 mm band is compressed 10:1 and filled solid blue,
    as the spec asks
  - Both y axes share one scale (10 °C ↔ 20 mm) with a valueFormatter on the right
    axis that maps scaled values back to millimetres, zeros on one baseline
  - Header subtitle computes annual mean (17.4 °C) and annual total (724 mm) from
    the data rather than hard-coding them, alongside station, elevation and normals
    period
  - 'Semantic red/blue (Imprint #AE3030 / #4467A3) for temperature/arid and precipitation/humid,
    identical in both themes; chrome uses theme tokens and reads cleanly on #FAF8F1
    and #1A1A17'
  - Legend entries for perhumid and frost appear only when the data has such months
  weaknesses:
  - 'Suggestion: limit the left-axis tick labels to the temperature range actually
    used (0–30 °C, as the Notes call conventional) so the 40 and 50 °C labels do not
    suggest temperatures the station never reaches.'
  - 'Suggestion: tint the left and right axis titles in the temperature red and precipitation
    blue to tie each curve to its axis without the legend.'
  - 'Suggestion: the perhumid band is a thin sliver at 10:1 for 103–120 mm; a short
    note or a right-axis tick inside the compressed range could signpost the scale
    change more visibly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: bold title "climograph-walter-lieth · javascript · muix · anyplot.ai" centred at top; a soft-ink subtitle "Lisbon, Portugal (77 m a.s.l.) · Annual mean 17.4 °C · Annual total 724 mm · Normals period: 1991–2020"; left axis "Temperature (°C)" 0–50, right axis "Precipitation (mm)" 0–100 aligned 10 °C ↔ 20 mm; Jan–Dec x-axis; subtle horizontal grid. All text dark and readable.
      Data: red (#AE3030) temperature line rising from 11.6 °C to 23.5 °C in August; blue (#4467A3) precipitation line falling from 99 mm in January to 4 mm in July and back above 100 mm Oct–Dec. Translucent blue humid fill Jan–May and Sep–Dec, translucent red arid fill Jun–Sep switching at the curve crossings, a thin solid-blue perhumid band above 100 mm for Oct–Dec. Bottom legend: Temperature, Precipitation, Humid, Arid, Perhumid (> 100 mm, 10:1 scale). No frost months (Lisbon). No first-series green: semantic red/blue per the spec.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink, grid subtle but visible; no dark-on-dark text.
      Data: same red and blue line colours and fills as the light render; the humid fill reads as a muted navy and the arid fill as a dark maroon, both clearly distinct from the page; perhumid band visible as brighter blue strip.
      Legibility verdict: PASS
