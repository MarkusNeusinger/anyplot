review:
  strengths:
  - 'Walter-Lieth scaling computed from the data: the right-axis tickPositions are
    exactly 2× the left-axis ticks, so 10 °C lines up with 20 mm and both zeros share
    one baseline'
  - The humid (P > 2T) and arid (2T > P) fills are stacked areas over knots that include
    every exact crossing of the temperature line with a bar top, so the fills switch
    precisely where the curves cross
  - The temperature line closes the annual cycle at the outer bar edges with the December–January
    midpoint, so the fills cover the full year without a gap
  - Axis lines carry the series colours (red temperature, blue precipitation) while
    labels stay in the theme ink, making each series attributable to its axis in both
    themes
  - 'Header subtitle derived from the records: station, elevation, annual mean temperature
    and annual precipitation total'
  - Frost blocks are drawn with the SVG renderer in chart.events.render (redraw-safe
    group destroy/re-add) and would mark sub-zero months for user data; correctly
    absent for frost-free Seville
  - Real Seville 1991–2020 normals give a pronounced, plausible Mediterranean summer
    arid period
  - 'Native Highcharts interactivity: a shared tooltip with °C / mm value suffixes
    in the HTML output'
  weaknesses:
  - 'Suggestion: the grid lines at 10, 20 and 30 °C disappear behind the opaque fills
    across most of the plot; a grid drawn above the fills (yAxis gridZIndex) would
    keep the scale readable inside the fills.'
  - 'Suggestion: the humid band in full-strength blue outweighs the precipitation
    bars in the 50 % tint; a closer pairing would keep the bars as the primary precipitation
    mark.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: left-aligned bold title "Seville Climate · climograph-walter-lieth · javascript · highcharts · anyplot.ai" (~46 % width) in dark ink; subtitle header "Seville (Aeropuerto) · 34 m a.s.l. · T̄: 18.9 °C · P: 511 mm/yr"; left axis "Temperature (°C)" 0–40 °C, right axis "Precipitation (mm)" 0–80 mm, month ticks Jan–Dec; legend at bottom (Temperature, Precipitation, Humid period (P > 2T), Arid period (2T > P)). All text dark and clearly readable. Left axis line red, right axis line blue.
      Data: precipitation as light-blue tinted columns with page-colored separators; temperature as a red (#AE3030) line with markers; area above the temperature line up to each bar top filled Imprint blue #4467A3 (Jan–Apr, Oct–Dec humid); area between bar tops and the temperature line filled light red (May–Sep arid), switching at the crossings. No months > 100 mm and no frost months (both permitted). No brand-green series: semantic red/blue exception per spec.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles, tick and legend labels in light ink, all clearly readable; no dark-on-dark text. Grid lines subtle grey, visible above 70 mm. Column separators now dark (page color).
      Data: colors identical to the light render (same red line, same blue humid fill, same tints for bars and arid fill); only chrome flipped.
      Legibility verdict: PASS
