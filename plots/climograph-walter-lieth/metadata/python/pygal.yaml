review:
  strengths:
  - Walter-Lieth 1:2 scaling is done with pygal's native secondary axis (secondary_range
    = 2 × the primary tick span), so 10 °C, 20 °C and 30 °C sit exactly on 20, 40
    and 60 mm with both zeros on one baseline, and the precipitation series keeps
    its real mm values for the tooltips
  - Humid and arid fills are polygons split at the exact linear crossings of the two
    curves (Mar/Apr and Sep/Oct), so the blue and red periods switch precisely where
    the curves meet in both themes
  - 'Two-tier header via injected CSS: bold mandated title over a lighter station
    line with name, elevation, annual mean 18.4 °C and total 343 mm computed from
    the data'
  - Realistic Athens Mediterranean normals give a clear summer arid period and winter
    humid period, the canonical example the spec names
  - Per-series formatters give °C / mm tooltips in the interactive HTML output
  weaknesses:
  - 'VQ-03 (both): the legend shows the Temperature and Precipitation lines as translucent
    filled squares identical to the Arid and Humid period swatches, so the line entries
    cannot be told apart from the fill entries → line-like glyphs (opaque stroke,
    no fill) or a visibly different swatch for the two curve series. Likely cause:
    pygal''s default legend box for every series under the shared opacity=0.45/0.6
    style.'
  - 'VQ-05 (both): the left tick labels (''0 °C'' … ''30 °C'') end right on the y-axis
    spine with no gap, the ''°C'' of ''0 °C'' touching the line → a few px clearance
    between label and spine. Likely cause: label text width at label_font_size=44
    against pygal''s default left-label offset.'
  - 'Suggestion: a ''Precipitation (mm)'' title on the right axis would mirror the
    left ''Temperature (°C)'' title instead of relying on the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: bold title "climograph-walter-lieth · python · pygal · anyplot.ai" with a second header line "Athens, Greece · 107 m a.s.l. · mean 18.4 °C · total 343 mm"; left axis "Temperature (°C)" with ticks 0–30 °C, right axis ticks 0–60 mm aligned to them, x axis "Month" Jan–Dec; subtle horizontal grid; 2-column legend at bottom. All dark text, readable.
      Data: red temperature line (#AE3030) and blue precipitation line (#4467A3) with dots; translucent blue humid fill Jan–Mar and Oct–Dec, translucent red arid fill Apr–Sep, switching at the curve crossings. No frost months, no month > 100 mm.
