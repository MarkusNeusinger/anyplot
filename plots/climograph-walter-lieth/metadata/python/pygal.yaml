review:
  strengths:
  - 'Correct Walter-Lieth 1:2 scaling: secondary_range is derived from the temperature
    ticks (MM_PER_DEGREE * temp_ticks), so 10/20/30 °C line up exactly with 20/40/60
    mm and both zeros share one baseline'
  - Humid/arid fills are computed as polygons between the straight month-to-month
    segments and split at the exact crossing points (Mar–Apr and Sep–Oct), so blue
    and red switch precisely where the curves cross in both renders
  - 'Two-line header: bold mandated title over a normal-weight station line with name,
    elevation, annual mean 18.4 °C and total 343 mm, both computed from the data'
  - Semantic red (temperature) / blue (precipitation) from the Imprint palette, with
    legend entries that name the axis each curve belongs to ('left axis' / 'right
    axis') and the curve swatches restyled into opaque line strokes via injected CSS
  - Native pygal XY chart with secondary=True axis, per-series value formatters ('°C'
    / 'mm') for the HTML tooltips, and both PNG and interactive HTML output
  - Realistic Athens 1991–2020 normals showing the textbook Mediterranean summer drought;
    theme tokens threaded through Style so chrome flips cleanly between light and
    dark
  weaknesses:
  - 'Suggestion: the code handles neither the >100 mm compression nor frost-month
    marks; Athens needs neither, but a user swapping in a wet or continental station
    would get neither the solid-blue perhumid band nor the baseline frost blocks.'
  - 'Suggestion: the legend labels start flush against their swatches; a few pixels
    of gap would let them breathe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: bold title "climograph-walter-lieth · python · pygal · anyplot.ai" with a normal-weight header line "Athens, Greece · 107 m a.s.l. · mean 18.4 °C · total 343 mm"; left axis "Temperature (°C)" with ticks 0/10/20/30 °C, right ticks 0/20/40/60 mm aligned to the same gridlines, x-axis "Month" with Jan–Dec; subtle horizontal guides; two-column legend at the bottom. All text dark and readable.
      Data: red #AE3030 temperature line with dots, blue #4467A3 precipitation line with dots; translucent blue humid fill Jan–Mar and Oct–Dec, translucent red arid fill Apr–Sep, switching at the curve crossings. No frost months and no month above 100 mm (permitted).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, header line, axis titles, tick labels and legend text in light ink, all clearly readable; no dark-on-dark text; guides subtle.
      Data: identical red and blue line colors; fills use the same hues at higher opacity, which reads as darker navy/maroon on the dark page and stays clearly distinguishable.
      Legibility verdict: PASS
