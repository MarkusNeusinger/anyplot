review:
  strengths:
  - Idiomatic Altair composition of two hconcat rows in a vconcat
  - Binning and counting done in the encoding (alt.Bin, count())
  - Sales vs Target told apart by color and dash
  - Theme tokens threaded through configure_axis, configure_legend and configure_view;
    both renders theme-correct
  - Tooltips add inspection in the HTML output
  weaknesses:
  - 'VQ-05 (both): the render is 5328x3354, off both canonical canvases, and the right
    column''s plot areas do not line up (the line panel''s y-axis sits about 70 source
    px right of the histogram''s) → 3200x1800 with aligned plot areas. Likely cause:
    width=750/height=420 panels saved at scale_factor=3.0 with no pad-to-target step.'
  - 'SC-04 (both): the title reads ''subplot-grid · altair · anyplot.ai'' without
    the language → ''subplot-grid · python · altair · anyplot.ai''. Likely cause:
    the title string.'
  - 'SC-03 (both): the monthly points are month-end dates, so the month axis starts
    at February and every month is labelled one late → month-start dates. Likely cause:
    pd.date_range(..., freq=''ME'').'
  - 'SC-01 (both): bars at or above 80 are green and the rest purple, a derived highlight
    the spec does not ask for and that no legend explains → one color for all bars.
    Likely cause: alt.condition(alt.datum.Performance >= 80, ...).'
  - 'DQ-02 (both): a unitless ''Performance Score'' per region and product revenue
    drawn independently of units sold read generic → a named metric with a unit and
    revenue that follows the units. Likely cause: hard-coded scores and np.random.uniform
    revenue.'
  - 'Suggestion: place the line panel''s legend inside the panel''s empty area instead
    of against the canvas edge.'
  image_description: |-
