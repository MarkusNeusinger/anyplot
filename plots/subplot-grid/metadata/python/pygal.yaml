review:
  strengths:
  - 'Single vector composite: each pygal chart''s SVG is nested into one 3200x1800
    canvas SVG, so the HTML keeps pygal''s native hover tooltips in every cell'
  - All four cells are aggregated from one tidy daily table, so the bar totals add
    up to the line chart's annual revenue and the cells read as one shop
  - Theme tokens threaded through Style (foreground, foreground_strong, foreground_subtle);
    both renders fully legible
  - Native pygal.Histogram with (count, start, end) bins from np.histogram
  weaknesses:
  - 'VQ-05 (both): the plot areas do not line up along the grid: the left column''s
    y axes sit at about x=240 px (line) and x=180 px (scatter), the right column''s
    at about x=1815 px (bar) and x=1735 px (histogram), and the top row''s x axes
    end at about y=820 px vs y=790 px → one shared left offset per column and one
    bottom per row (about ±60 px). Likely cause: each pygal cell sizes its own y-tick
    label gutter and title block (12000 vs 40 tick widths, Revenue ($K) title), so
    the inner plot box floats; fix with equal margin_left / margin_bottom per cell
    or y_labels_major formatting of the same width.'
  - 'CQ-01 (code): two helper functions cell_style() and make_cell() wrap chart construction
    → build one Style object once and call the chart classes directly with the shared
    kwargs dict. Likely cause: def cell_style / def make_cell.'
  - 'Suggestion: the bar cell''s 13 y ticks at 1000 steps are dense; a coarser step
    would quiet the axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas, no cell borders
      Chrome: bold dark title 'subplot-grid · python · pygal · anyplot.ai' centred on top; four cell titles (Monthly revenue, Revenue by category, Ad spend vs return, Daily order volume), axis titles and tick labels in dark ink; dashed subtle guides; all readable
      Data: 2x2 grid — top-left green line with dots (12 months, 1.9 to 3.6 M$), top-right five green bars sorted descending (Electronics 12000 to Books 3200), bottom-left 240 green scatter dots of ad spend vs ROI with upward trend, bottom-right green 15-bin histogram of orders per day peaking at 130-150; all marks #009E73
      Legibility verdict: PASS

