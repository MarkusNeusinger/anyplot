review:
  strengths:
  - make_subplots with per-cell specs combines a line, bar, histogram and scatter
    into one aligned 2x2 grid with even gaps
  - Independent axes each carry their own tick labels and unit-bearing title, so every
    cell reads alone
  - The Price / 20-day MA legend sits inside the price cell, so it is clear which
    subplot it explains
  - Theme tokens threaded through every axis, annotation and the legend; both renders
    fully legible with identical data colors
  - Native plotly hover and zoom in the HTML output
  weaknesses:
  - 'SC-04 (both): the Trading Volume bars switch between green #009E73 and purple
    #C475FD by up/down day, but no legend or label says what the two colors mean,
    and purple also means the 20-day MA in the neighbouring cell → explain the encoding
    inside the volume cell (legend entries ''Up day'' / ''Down day'') or draw the
    bars in one color. Likely cause: up_down color list on the go.Bar trace with showlegend=False.'
  - 'Suggestion: hide the x=0 zero line in the histogram cell so it does not run through
    the bars.'
