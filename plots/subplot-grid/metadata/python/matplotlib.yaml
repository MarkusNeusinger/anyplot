review:
  strengths:
  - Four distinct plot types (line with moving average, signed-color volume bars,
    return histogram, colour-mapped scatter) form one coherent single-stock dashboard,
    so the cells read as related views of one scenario
  - plt.subplots(2, 2, layout="constrained") with tuned layout-engine pads keeps plot
    areas aligned along rows and columns with even gaps; no tick labels or axis titles
    collide with a neighbour
  - Colorbar is attached with fig.colorbar(points, ax=scatter_ax) so it sits directly
    beside the one subplot it explains; legends stay inside their own cells
  - TwoSlopeNorm(vcenter=0) centres the theme-adaptive imprint_div map on zero return,
    and the volume bars reuse the semantic red for down days, linking panels
  - 'Theme tokens threaded through every element: legend frames on ELEVATED_BG, colorbar
    outline removed, INK/INK_SOFT text, both renders fully legible'
  - Grid density chosen per panel (y-only for bars and histogram, both axes for the
    scatter) and histogram headroom keeps its legend clear of the tallest bins
  weaknesses:
  - 'SC-02 (both): the Notes bullet ''Support both shared axes (for comparison) and
    independent axes'' is not shown — all four subplots use independent axes, even
    the two top panels that plot the same Trading day 1–100 x-variable → link the
    two Trading-day panels with a shared x-axis (e.g. sharex for that row) and keep
    the other cells independent. Likely cause: plt.subplots(2, 2, ...) without sharex/sharey.'
  - 'VQ-01 (both): legend text at 7.5 pt and colorbar tick labels at 7 pt fall below
    the 8 pt baseline of the library prompt and blur in the 400 px thumbnail of the
    2×2 grid → 8 pt (+0.5 to +1 pt). Likely cause: legend(fontsize=7.5) calls and
    cbar.ax.tick_params(labelsize=7).'
  - 'Suggestion: up days are green in the volume panel but blue on the imprint_div
    scatter; a sentence-level note or matching legend wording could make the two encodings
    of the same up/down signal easier to connect.'
  - 'Suggestion: grid dimensions are literals in plt.subplots(2, 2); named NROWS/NCOLS
    constants would make the configurable layout the Notes mention more visible.'
  image_description: |-
    Light render (plot-light.png):
