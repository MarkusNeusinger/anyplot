review:
  strengths:
  - Four distinct plot types (line with moving average, up/down-coloured volume bars,
    return histogram, volume-vs-return scatter) read as one coherent stock dashboard
  - Shared x-axis on the top row via Axes.sharex shows both cells on the same 0-100
    trading-day scale while the bottom row keeps independent axes, demonstrating both
    modes the spec asks for
  - Constrained layout with tuned pads aligns every plot area along rows and columns
    with even gaps; the colourbar sits directly beside the scatter it explains
  - Diverging return colour uses imprint_div with a theme-adaptive midpoint and TwoSlopeNorm
    centred on zero; outlined markers keep near-zero points visible in both themes
  - Theme tokens threaded through titles, labels, ticks, spines, grid, legend frames
    and colourbar; both renders fully legible
  weaknesses:
  - 'Suggestion: up days are green in the volume bars but blue on the scatter''s imprint_div
    colourbar; a sign-coloured scatter in the same green/red as the bars would keep
    one colour meaning across the grid.'
  - 'Suggestion: volume is generated independently of returns, so the ''Volume vs
    return size'' cell shows no relationship; tying volume to the absolute return
    in the data would give that panel something to show.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across figure and all four axes.
      Chrome: bold dark suptitle "subplot-grid · python · matplotlib · anyplot.ai"; left-aligned bold panel titles (Stock price, Trading volume, Return distribution, Volume vs return size); dark axis titles with units, soft-ink tick labels, subtle grid, top/right spines removed; legend frames on elevated off-white. All readable.
      Data: 2x2 grid. Top-left green #009E73 close line with purple #C475FD dashed 20-day MA. Top-right 100 volume bars, green up days / matte red #AE3030 down days, shared 0-100 trading-day x scale with top-left. Bottom-left green return histogram with soft-ink zero line and purple dashed mean (-0.16%). Bottom-right scatter of volume vs absolute return coloured by signed return via imprint_div (red-offwhite-blue) with colourbar beside it.
      Legibility verdict: PASS

