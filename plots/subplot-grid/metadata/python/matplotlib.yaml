      Data: top-left green #009E73 close-price line with dashed purple #C475FD 20-day MA and framed legend; top-right 100 volume bars green (up) / red #AE3030 (down) with two-column legend; bottom-left green histogram of daily returns with grey zero line and dashed purple mean line (-0.16%), legend top-right; bottom-right scatter of volume vs absolute return coloured by signed return on red–off-white–blue imprint_div with a colorbar "Daily return (%)" beside it. Two-by-two grid evenly spaced and aligned.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
