review:
  strengths:
  - gggrid(..., ncol=2, align=True) composes four independent ggplot objects (line,
    bar, histogram, scatter with lm fit) into one regular 2x2 grid whose plot areas
    line up along rows and columns
  - One tidy DataFrame with column constants drives every panel; lets-plot titles
    the axes from the column names, so labs() only sets the subplot titles
  - 'Theme tokens threaded through one reusable theme object: both renders theme-correct
    with identical Imprint data colors'
  - Interactive HTML output alongside the PNG gives hover inspection in every cell
  weaknesses:
  - 'VQ-07 (dark): the 60 volume bars keep lets-plot''s default near-white outline,
    which glares around the #4467A3 fill on the #1A1A17 page and is not a theme token
    → outline in PAGE_BG (or none). Likely cause: geom_bar(stat=''identity'', ...)
    without color=.'
  - 'SC-04 (both): the price cell draws a solid green price line and a dashed lilac
    10-day moving average with no key or direct label; only the cell title hints at
    the second series → a legend beside that cell or direct labels at the line ends.
    Likely cause: both geom_line layers use fixed colors, so no legend is generated.'
  - 'Suggestion: the scatter cell shows only two y ticks (1.5, 2) over a 1.1-2.35
    range; a denser break set would make values easier to read.'
  - 'Suggestion: subplot titles at 11 pt equal the axis titles; a slightly larger
    or bolder subplot title would separate the cells more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas and all four panels.
      Chrome: top-left title 'subplot-grid · python · letsplot · anyplot.ai' in dark ink; subplot titles 'Stock Price with 10-Day Moving Average', 'Daily Trading Volume', 'Distribution of Daily Returns', 'Volume vs Price Movement'; axis titles Trading Day, Price ($), Volume (Millions), Frequency, Daily Return (%), Absolute Return (%); dark-grey ticks and thin grid, all readable. Plot areas and subplot titles line up along both columns and both rows.
      Data: 2x2 grid; green #009E73 price line with dashed lilac #C475FD 10-day moving average (no key); blue #4467A3 volume bars; ochre #BD8233 histogram with a green dashed zero line; red #AE3030 scatter points with a green linear fit and grey confidence band. First series #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across canvas and panels.
      Chrome: same titles and axis titles in light ink, light-grey ticks, subtle grid; no dark-on-dark text.
      Data: categorical colors identical to the light render; the volume bars carry a bright near-white outline that glares on the dark page; histogram bins get light outlines; confidence band turns a dark grey.
      Legibility verdict: PASS
