review:
  strengths:
  - gggrid([...], ncol=2, align=True) composes four independent ggplot objects (line,
    bar, histogram, scatter with lm fit) into one regular 2x2 grid whose plot areas
    line up along both columns and rows
  - The price cell reshapes price and moving average into one long frame and maps
    a single Series column to color and linetype, so lets-plot generates the key itself;
    the legend sits directly beside its own cell
  - 'Theme tokens threaded through one reusable anyplot_theme object, including the
    volume-bar outline in PAGE_BG: both renders theme-correct with identical Imprint
    data colors'
  - One tidy DataFrame with column constants drives every panel; lets-plot titles
    the axes from the column names
  - Interactive HTML output alongside the PNG gives hover inspection in every cell
  weaknesses:
  - 'Suggestion: theme(legend_position="bottom") on the price plot is overridden by
    the theme_minimal() added after it and has no effect on either render; drop the
    line or move it after theme_minimal().'
  - 'Suggestion: the grid uses solid INK_SOFT at size 0.15 rather than the style guide''s
    15 %-opacity grid token; the vertical grid on the line, bar and histogram cells
    could be dropped for a quieter page.'
  - 'Suggestion: the lm confidence band turns a near-background dark grey in the dark
    render; a fill from a theme token at low alpha would keep it visible.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas and all four cells; no white strips at the edges.
      Chrome: top-left title 'subplot-grid · python · letsplot · anyplot.ai' in dark ink; subplot titles 'Stock Price with 10-Day Moving Average', 'Daily Trading Volume', 'Distribution of Daily Returns', 'Volume vs Price Movement'; axis titles Trading Day, Price ($), Volume (Millions), Frequency, Daily Return (%), Absolute Return (%); dark-grey ticks and thin grid, all readable. Plot areas line up along both columns and rows; the top-left cell's legend (solid green 'Price', dashed lilac '10-day average') sits on an elevated panel directly right of its plot area.
      Data: 2x2 grid; green #009E73 price line with dashed lilac #C475FD 10-day moving average; 60 blue #4467A3 volume bars with page-colored outlines; ochre #BD8233 histogram (20 bins) with a green dashed zero line; red #AE3030 scatter points with a green linear fit and grey confidence band. First series #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across canvas and cells.
      Chrome: same titles, axis titles and legend text in light ink, light-grey ticks, subtle grid; legend panel in the dark elevated tone; no dark-on-dark text.
      Data: categorical colors identical to the light render; volume bars now outlined in the page color (no glare); histogram bins get light outlines; the confidence band turns a dark grey that is barely visible.
      Legibility verdict: PASS
