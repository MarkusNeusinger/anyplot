review:
  strengths:
  - Exact 3200x1800 canvas with a figure heading composed via column(heading, gridplot),
    and every panel's plot area aligned along rows and columns with even gaps
  - Theme tokens threaded through every chrome element; both renders fully readable,
    data colours identical across themes
  - Four distinct plot types (line+markers, bars, scatter, histogram) reading as related
    views of one financial dashboard
  - Tidy df with column-name constants read through ColumnDataSource, and np.histogram
    for binning
  weaknesses:
  - 'VQ-01 (both): tick labels at 18pt and axis titles at 22pt sit far below bokeh''s
    34pt/42pt reference and read small on the 3200x1800 canvas → tick labels about
    26-34pt (+8 to +16 pt), axis titles about 32-42pt (+10 to +20 pt), panel titles
    to match. Likely cause: the font sizes set in make_panel().'
  - 'DE-02 (both): every panel draws all four spines as a closed box plus major and
    minor tick marks → drop the outline and keep the L-shaped left/bottom axis lines.
    Likely cause: p.outline_line_color = INK_SOFT.'
  - 'VQ-07 (both): the Risk vs Return tiers (return below 5 %, 5-8 %, above 8 %) are
    ordered categories but are drawn in unrelated categorical hues blue, lavender
    and green, which also repeat the volume and histogram colours → ordered steps
    of one Imprint ramp in their natural order with green at the high-return end.
    Likely cause: the np.where tier mapping to IMPRINT_PALETTE[0..2].'
  - 'SC-04 (both): the three tier colours in the Risk vs Return panel have no legend,
    so the colour encoding cannot be read → a legend inside or beside that panel naming
    the tiers. Likely cause: p3.scatter without legend_field.'
  - 'SC-02 (both): all four panels have independent axes although the Notes ask to
    support shared axes; price and volume both run over Trading Day but their x ranges
    are not linked → share the x range between the two top panels. Likely cause: separate
    default ranges per figure(); set p2.x_range = p1.x_range.'
  - 'CQ-01 (code): two helper functions, padded() (lines 57-60) and make_panel() (lines
    78-110), break the flat Imports-Data-Plot-Save structure → create the four figures
    inline and style them in one loop over [p1, p2, p3, p4]; build each panel''s source
    from its own arrays. Likely cause: the helper-based structure.'
  - 'Suggestion: a HoverTool per panel would give the HTML view value inspection.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the heading and all four panels.
