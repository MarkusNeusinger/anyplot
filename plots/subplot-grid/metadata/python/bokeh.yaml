      Data: top-left #009E73 price line with markers over 60 trading days (94-117 $); top-right 60 lavender #C475FD volume bars (0.84-1.41 M); bottom-left 40 assets scatter coloured green/lavender/blue by return tier, no legend; bottom-right 25-bin blue #4467A3 histogram of daily returns.
