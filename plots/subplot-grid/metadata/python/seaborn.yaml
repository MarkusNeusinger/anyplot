review:
  strengths:
  - Four related views of one monitoring station, each a self-contained plot with
    titled independent axes, aligned along rows and columns
  - Theme tokens threaded through all chrome; readable in both themes
  - Imprint categorical colors in canonical order for the four series
  weaknesses:
  - 'VQ-05 (both): canvas is 4745x2655, not a canonical size → 3200x1800 (−1545 ×
    −855). Likely cause: figsize=(16, 9) at dpi=300 with bbox_inches=''tight''; use
    figsize=(8, 4.5), dpi=400 and no bbox_inches.'
  - 'VQ-07 (both): the continuous Hour hue uses viridis, which the style guide forbids
    → imprint_seq (#009E73 → #4467A3). Likely cause: palette=''viridis'' in sns.scatterplot.'
  - 'SC-04 (both): title ''subplot-grid · seaborn · anyplot.ai'' misses the language
    segment → ''subplot-grid · python · seaborn · anyplot.ai''. Likely cause: the
    fig.suptitle string.'
  - 'VQ-02 (both): the boxed Hour legend covers scatter points near (7 °C, 55 %) and
    the AQI/Pressure legend covers the tops of the first AQI bars → no legend over
    data. Likely cause: loc=''best''/''upper left'' inside the data area without headroom;
    use a colorbar beside the scatter and raise the AQI y-limit.'
  - 'CQ-04 (code): an unused DateTime column (pd.date_range) and unused bars/line
    assignments → delete them. Likely cause: leftovers from an earlier draft.'
  - 'Suggestion: link the two time-based panels with a shared hour axis to show the
    shared-axes mode the Notes mention.'
