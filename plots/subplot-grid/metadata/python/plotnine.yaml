review:
  strengths:
  - Builds the 2x2 grid with plotnine's native composition operators (| and /), each
    cell a complete ggplot with its own independent, fully labelled axes
  - 'Theme tokens threaded through every chrome element: subplot titles, axis text
    and legend read correctly on both #FAF8F1 and #1A1A17'
  - Product legend placed inside the Sales Trend cell (legend_position='inside'),
    so it clearly belongs to that subplot
  - Even spacing and aligned plot areas across all four cells on the 3200x1800 canvas
  weaknesses:
  - 'DQ-02 (both): the products are labelled ''A'' and ''B'' in the legend and the
    histogram title ''Sales Distribution (Product A)'', which reads as abstract →
    real product names (e.g. ''Trail Runner'', ''Road Pro''). Likely cause: the (''A'',
    100, 0.5), (''B'', 85, 0.8) tuples in the data block.'
  - 'CQ-04 (code): line 64 unpacks the panels with a generator over panels[i % len(panels)]
    and line 112 derives the histogram breaks from np.linspace(..., len(groups) +
    1).round(-1), coupling the histogram''s tick count to the number of products →
    plain df[df[PANEL] == ''trend''] filters and scale_x_continuous(breaks=[90, 110,
    130]) or the default breaks. Likely cause: over-generalised data-adapter code.'
  - 'Suggestion: the Frequency axis shows fractional counts (2.5, 7.5); integer breaks
    would read more naturally for a count.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800, thin dark divider lines between the four cells.
      Chrome: bold suptitle 'subplot-grid · python · plotnine · anyplot.ai' centred at top (~60% width); bold subplot titles Sales Trend, Quarterly Revenue, Sales Distribution (Product A), Units vs Margin; dark axis titles with units and soft-dark tick labels; subtle grid. All readable.
      Data: top-left line+point chart of products A (#009E73) and B (#C475FD) over 40 days with a dashed grey linear trend and an inset horizontal 'Product' legend; top-right bars Q1-Q4 in #009E73, #C475FD, #4467A3, #BD8233; bottom-left green histogram of Product A sales (10 bins, page-colored outlines); bottom-right green scatter of units vs margin with a purple lm fit and translucent band.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: suptitle, subplot titles and axis titles in light ink, tick labels soft-light, legend box on elevated dark with light text; no dark-on-dark text.
      Data: identical colors to the light render; brand green clearly visible; trend line flips to light grey.
      Legibility verdict: PASS
