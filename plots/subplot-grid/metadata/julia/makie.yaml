review:
  strengths:
  - 'Correct Imprint palette usage across all four panels — the price-line panel (the
    figure''s primary series) uses #009E73 brand green, and data colors are byte-identical
    between the light and dark renders; only chrome flips.'
  - Theme-adaptive chrome (background, title, axis labels, ticks, spines, grid) is
    fully correct in both renders — no dark-on-dark or light-on-light failures, warm
    off-white / warm near-black backgrounds match spec.
  - Well-organized 2x2 grid combining four genuinely distinct plot types (line, histogram,
    bar, scatter) with linkxaxes! sharing the trading-day axis between Price Trend
    and Trading Volume — satisfies the spec's 'shared or independent axes' requirement
    directly.
  - 'Clean, idiomatic Makie code: GridLayout addressing (fig[row,col]), a reusable
    namedtuple for common chrome options instead of repeating it per Axis, and a spanning
    Label for the title.'
  - Realistic, well-scaled financial dataset (price ~$135-175, daily volume ~1-2M
    shares, ~1.5% daily volatility) with a return distribution and volume-vs-return
    scatter correctly derived from the same underlying series.
  weaknesses:
  - 'Design Excellence is only moderate: the four panels are equal-weight with no
    emphasis, callout, or annotation pointing at an insight (e.g. the price peak around
    day 33, or the volume spike near day 18) — a stronger version would create a clear
    focal point (DE-03).'
  - Trading Volume panel renders all 90 daily bars at full opacity with no edge treatment,
    giving a slightly busy, undifferentiated block compared to the more considered
    histogram panel (strokewidth/strokecolor); a touch of alpha or a thinner bar width
    would read cleaner at this density (VQ-03).
  - 'LM-02: the grid layout and axis linking are solid Makie idioms but don''t yet
    showcase a feature that''s hard to replicate elsewhere (e.g. a nested GridLayout,
    a colorbar, or an Observable-driven annotation) — currently reads as a well-executed
    but fairly generic subplot grid.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold black title "subplot-grid · julia · makie · anyplot.ai" centered at top, spanning both columns. Four panel titles ("Price Trend", "Return Distribution", "Trading Volume", "Volume vs. Return") in dark, bold text. Axis labels ("Price (USD)", "Trading Days", "Daily Return (%)", "Volume (shares)", "Trading Day") in dark ink, tick labels in a slightly softer gray. Subtle horizontal gridlines at ~15% opacity. Top/right spines removed on all four axes.
      Data: Top-left is a green (#009E73) line chart of price trend; top-right is a lavender (#C475FD) histogram of daily returns; bottom-left is a blue (#4467A3) bar chart of trading volume; bottom-right is an ochre (#BD8233) scatter of volume vs. return. Price and Volume panels share the x-axis (Trading Day), the top price panel has its x tick labels hidden since it's linked to the volume panel below.
      Legibility verdict: PASS — all titles, axis labels, and tick labels are clearly readable against the light background, no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and four panel titles, now rendered in light/white text. Axis labels light ink, tick labels softer light-gray. Gridlines subtle white at ~15% opacity. Spines identical treatment (top/right removed).
      Data: Same four panels in the same colors as the light render — green line, lavender histogram, blue volume bars, ochre scatter — confirming data colors are identical across themes and only chrome (background/text/grid) flipped.
      Legibility verdict: PASS — all text is clearly visible against the dark background; no dark-on-dark or unreadable elements found in either panel.
