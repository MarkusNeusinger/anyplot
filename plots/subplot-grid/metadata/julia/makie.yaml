review:
  strengths:
  - linkxaxes! between Price Trend and Trading Volume creates a genuine shared-axis
    dashboard comparison, directly satisfying the spec's shared-vs-independent-axes
    requirement
  - Per-panel grid strategy (y-only grid for the line/bar/histogram panels, both-axes
    grid for the scatter panel) follows the style guide's grid guidance exactly
  - Focal-point storytelling via the peak-price marker (white stroke) and the highlighted
    volume-spike bar, without resorting to text annotations
  - Theme-adaptive chrome is fully correct in both renders — no dark-on-dark or light-on-light
    failures, and the Imprint data colors are pixel-identical between light and dark
  - 'Idiomatic CairoMakie: Figure/Axis grid layout, band! fill under the price line,
    Label spanning fig[0, 1:2] for the figure-level title, colgap!/rowgap! for spacing
    control'
  weaknesses:
  - Volume vs. Return scatter markers use ochre (#BD8233) with strokewidth=0 — one
    of the five Imprint hues that fall below WCAG 3:1 contrast on the cream background;
    a thin ink-colored stroke (strokewidth≈1, strokecolor=INK) would tighten accessibility
    margin per the style guide's optional-outline guidance
  - Subplot title sizes (15pt) sit close to the tick-label weight in the type hierarchy
    — a touch more differentiation between panel titles and tick labels would sharpen
    the hierarchy, though current sizes are fully legible
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target exactly (not pure white).
      Chrome: Title "subplot-grid · julia · makie · anyplot.ai" in bold dark ink, fully legible. Each of the four panel titles (Price Trend, Return Distribution, Trading Volume, Volume vs. Return) is dark and crisp. Axis labels (Price (USD), Daily Return (%), Trading Days, Trading Day, Volume (shares)) are dark ink; tick labels are softer gray-brown, all readable. Subtle y-only grid on the line/bar/hist panels, both-axes grid on the scatter panel.
      Data: First series (price line + band fill + peak marker) is Imprint green #009E73. Histogram is lavender, volume bars are blue (spike day full-opacity, rest at ~60% alpha), scatter points are ochre. Colors read clearly against the light surface.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target exactly (not pure black).
      Chrome: Title and panel titles render in light ink (#F0EFE8), fully legible against the dark surface — no dark-on-dark failures anywhere. Tick labels use the softer light-gray secondary-text token and remain clearly readable. Grid lines are faint and non-competing.
      Data: Price line/band/marker, histogram, volume bars, and scatter markers are pixel-identical in hue to the light render — only the chrome (background, text, grid, spines) flipped, as required.
      Legibility verdict: PASS
