review:
  strengths:
  - Combines four genuinely distinct plot types (line, bar, histogram, scatter+trend)
    in a 2x2 grid, directly matching the spec's core definition of a subplot grid
    (heterogeneous panels, not repeated facets).
  - Custom theme-adaptive tokens (PAGE_BG/INK/INK_SOFT) are threaded consistently
    through all four panels and the outer title in both renders -- text, grid, and
    axis line all flip correctly between light and dark.
  - 'Full Imprint palette compliance: temperature line and scatter use #009E73 (position
    1), rainfall bar uses #4467A3 (position 3, blue for water association), histogram
    uses #C475FD (position 2) -- all canonical, data colors identical across themes.'
  - The four panels form a coherent weather-station narrative (daily temperature ->
    weekly rainfall -> humidity distribution -> temp/humidity correlation with regression
    line) rather than four unrelated demo charts.
  - All font sizes are explicitly set via a shared anyplot_theme, axis labels carry
    units everywhere (deg C, %, mm, Days), and marker/line density choices (linewidth
    1.0 for 84-point line, alpha 0.7 scatter, 14-bin histogram) are well matched to
    the data volume.
  - 'Clean, reproducible KISS code: single script, set.seed(42), all imports (ggplot2,
    dplyr, scales, ragg, gridExtra) are actually used, saved via ragg::agg_png at
    the correct 2400x2400 square canvas.'
  weaknesses:
  - Spec explicitly requires the grid to 'support both shared axes (for comparison)
    and independent axes (for different scales)' -- this implementation only demonstrates
    fully independent axes across all four panels. Add at least one shared-axis linkage
    (e.g., align the y-axis range between two comparable panels, or use a common x-range)
    so both modes described in the spec are represented.
  - plot.margin is fairly tight (t=8, r=12, b=6, l=8) -- a touch more breathing room
    around each panel, especially between the top title and the first row of panels,
    would push visual refinement further.
  - Verify the grid::textGrob() font family used for the outer anyplot title matches
    the ggplot2 device font family used inside the panels, so the whole figure reads
    as one consistent typographic system rather than mixing families.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) across the full 2400x2400 canvas, consistent with the anyplot light-theme surface.
      Chrome: Outer title "subplot-grid · r · ggplot2 · anyplot.ai" reads clearly in dark ink at the top. Each of the four panel titles ("Daily Temperature", "Weekly Rainfall", "Humidity Distribution", "Temp vs Humidity") and their axis titles/tick labels ("Date"/"Temp (°C)", "Week"/"Rain (mm)", "Humidity (%)"/"Days", "Temp (°C)"/"Humidity (%)") are dark ink on the light surface, fully legible. Subtle horizontal gridlines are visible but unobtrusive; axis lines are thin and soft-toned; no tick marks.
      Data: Top-left is a green (#009E73) daily temperature line over ~12 weeks (Jun-Aug), rising then falling seasonally with day-to-day noise. Top-right is a blue (#4467A3) bar chart of weekly rainfall totals (weeks 1-12), mostly low with a late-season spike. Bottom-left is a purple (#C475FD) histogram of humidity percentage, roughly bell-shaped with a slight right tail. Bottom-right is a green (#009E73) scatter of temperature vs. humidity with a dashed gray regression line showing a mild negative trend. First categorical series is confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) across the full canvas, consistent with the anyplot dark-theme surface.
      Chrome: The same outer title and all four panel titles/axis titles/tick labels now render in light ink (off-white/light gray) against the dark surface, fully legible with no dark-on-dark elements anywhere. Gridlines and axis lines are still subtle but visible.
      Data: All four panels show identical data-ink colors to the light render -- green line/scatter (#009E73), blue bars (#4467A3), purple histogram (#C475FD), and the same dashed gray regression line -- confirming only chrome (background + text + grid) flipped between themes, not the data palette.
      Legibility verdict: PASS
