review:
  strengths:
  - 'Well-executed asymmetric dashboard layout: a full-width hero combo chart (spline
    + column, dual y-axis, shared tooltip) spans the top row above three independently-scaled
    panels, giving the grid a genuine focal point instead of four equally-weighted
    cells.'
  - 'Correct Imprint palette compliance across all four panels: first series is consistently
    #009E73, the colorByPoint bar chart follows the canonical palette order (green/lavender/blue/ochre/red),
    and data colors are identical between the light and dark renders.'
  - 'Theme-adaptive chrome (title, axis labels, gridlines, legend) reads clearly in
    both renders with correct #FAF8F1/#1A1A17 backgrounds — no dark-on-dark or light-on-light
    failures.'
  - Deterministic, seeded data generation (fixed-seed LCG) producing realistic, varied
    datasets across four distinct chart types (combo/dual-axis, horizontal bar, scatter,
    histogram) — strong feature-coverage demonstration for the spec's 'different plot
    type per cell' requirement.
  - 'Clean multi-chart mount handling for a grid spec: a custom DOM grid is built
    inside #container and four independent Highcharts.chart() calls render into it,
    with animation disabled everywhere so the harness never screenshots mid-animation.'
  weaknesses:
  - The 'Revenue by Category' panel's value axis (bottom, ticks 0-350) has no axis
    title/unit label — the 'Revenue (thousand $)' string is set in baseOptions() but
    then explicitly nulled on xAxis.title and never applied to yAxis (the true value
    axis for a 'bar' type), so the unit is only discoverable via tooltip. Set panel2.yAxis.title.text
    to a units label instead of leaving both axis titles null.
  - The scatter panel ('Price vs. Customer Rating') only renders horizontal gridlines
    — the style guide recommends grid on both axes for scatter plots so precise x-values
    are easier to read. panel3's xAxis never gets a gridLineWidth, only baseOptions()'s
    yAxis grid applies; add a subtle vertical gridLineColor/gridLineWidth to panel3.xAxis.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Top-left custom header "subplot-grid · javascript · highcharts · anyplot.ai" in bold dark ink. Four panel titles ("Monthly Visits & New Signups", "Revenue by Category", "Price vs. Customer Rating", "Order Value Distribution") are dark, bold, centered, and clearly legible. Axis titles and tick labels render in a softer dark-gray ink, all readable against the light surface. Gridlines are faint horizontal lines, subtle and non-competing.
      Data: First/primary series (Visits line, Electronics bar, scatter dots, histogram bars) is the Imprint brand green #009E73. Second series (New signups columns, Apparel bar) is lavender. Home & Garden bar is blue, Sporting Goods is ochre, Books is matte red — canonical Imprint order. All colors read clearly against the cream background.
      Legibility verdict: PASS — every title, axis label, and tick label is legible; no light-on-light text found. One exception (not a legibility issue): the Revenue panel's value axis has no title text at all (see weaknesses), but the numbers themselves are still fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same header and four panel titles now render in light/off-white ink, clearly legible against the dark surface. Axis titles and tick labels use a lighter soft-gray tone that stays readable. Gridlines are faint light-colored horizontal lines, subtle against the dark background.
      Data: Colors are pixel-identical to the light render — brand green, lavender, blue, ochre, matte red all unchanged, confirming only chrome (not data hues) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (header, panel titles, axis titles, tick labels, legend) is clearly visible against the near-black surface.
