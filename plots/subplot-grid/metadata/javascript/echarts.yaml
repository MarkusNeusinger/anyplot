review:
  strengths:
  - Clean 2x2 subplot-grid layout with four genuinely different chart types (line,
    bar, histogram, scatter) sharing a coherent financial-dashboard narrative
  - Top row (price/volume) shares x-axis date domain and column width for direct visual
    comparison, while the bottom row correctly uses independent axes for unrelated
    domains (return bins vs. volume) per the spec's shared/independent axes requirement
  - 'Correct Imprint palette usage: brand green first, theme-correct chrome in both
    renders, identical data colors across light/dark'
  - Thoughtful, well-justified semantic color exception (finance profit/loss green/red)
    that is redundant with x-axis position rather than being the sole signal
  - Deterministic Mulberry32-seeded data generation, formatted axis labels ($, M,
    %), and clean KISS script structure with no dead imports
  weaknesses:
  - 'The ''Period high'' markPoint on the price line and the ''Peak volume'' markPoint
    on the volume bars never render — verified by pixel-sampling both PNGs (no white
    label pixels anywhere near the price peak at ~1/2 or the 2.6M volume spikes in
    either theme). The code and comments describe these as intentional highlight features
    but they are 100% invisible; investigate whether `animation: false` combined with
    markPoint''s default enter-animation is suppressing them entirely, or fix/remove
    the dead config.'
  - The intended 'guide the viewer to the peak' storytelling device is absent because
    of the broken markPoints, leaving the four panels informative but without the
    emphasis the code clearly intended to add.
  - Main title occupies only ~28% of canvas width, noticeably smaller than the other
    panel titles suggest is available — consider a modest size bump for better top-of-canvas
    balance (soft/cosmetic, not a hard violation).
  - '''Shared axes'' between the top-row price and volume charts is only implicit
    (same date categories, same column width) — no visual cue (e.g. aligned gridlines,
    shared crosshair) makes that relationship explicit to a casual viewer.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full 3200x1800 canvas including behind all four subplot cells.
      Chrome: Main title "subplot-grid · javascript · echarts · anyplot.ai" in dark ink, centered top. Each of the 4 cells has its own left-aligned dark-ink subtitle ("Closing Price ($)", "Daily Volume", "Daily Returns Distribution", "Volume vs. Return"). Axis tick labels are medium-gray, gridlines are faint gray horizontal lines. All text is clearly readable against the light background — no light-on-light issues found.
      Data: Top-left is a green (#009E73) line with a light green area fill tracing a stock's closing price over ~60 trading days ($135-$153 range). Top-right is a blue/indigo bar chart of daily trading volume (0-3.0M). Bottom-left is a 10-bin histogram of daily returns, colored red for negative bins and green for positive bins (finance semantic convention, redundant with x-axis position). Bottom-right is a cyan scatter of volume vs. return. First series color is confirmed #009E73 green.
      Verified defect: pixel-sampled the region around the price-line peak (~1/2, ~$152.7) and the two >2.5M volume bars for pure-white (255,255,255) pixels, which the code's markPoint label color (`#fff`) would produce — zero found in either region. The "Period high" and "Peak volume" markPoint annotations configured in the code do not render at all.
      Legibility verdict: PASS (all chrome text legible; the missing markPoints are a content/feature bug, not a legibility issue)

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the canvas.
      Chrome: Same title and subtitle text now rendered in light ink (near-white/off-white), clearly legible against the dark background — no dark-on-dark failures found anywhere (title, subtitles, tick labels, axis names all readable). Gridlines are faint light-gray, correctly inverted from the light theme.
      Data: Identical colors to the light render — green price line/area, blue volume bars, red/green histogram bins, cyan scatter dots — confirming data colors are theme-invariant as required. Brand green #009E73 remains clearly visible against the dark surface.
      Verified defect: same pixel-sampling method applied to the dark render's price-peak and volume-peak regions — zero pure-white pixels found, confirming the markPoint labels are absent in this theme too (consistent failure, not theme-specific).
      Legibility verdict: PASS (all rendered chrome/text readable; markPoint absence is a rendering bug affecting both themes equally, not a dark-mode-specific legibility problem)
