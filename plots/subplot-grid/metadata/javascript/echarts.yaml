review:
  strengths:
  - Genuine 2x2 subplot grid with four distinct chart types (line+area, bar, histogram,
    scatter) built on a shared financial dataset — matches the spec's core requirement
    of combining distinct visualizations rather than faceting the same chart.
  - Top row correctly shares axis geometry (same date x-domain and column width) for
    direct price/volume comparison, while the bottom row uses independent axes (return
    bins, volume-in-millions) since those domains are unrelated — exactly the shared-vs-independent-axes
    contrast the spec asks for.
  - 'Smart semantic-color exception: return histogram bars are colored green (palette[0])
    for gains and red (palette[4]) for losses, matching the finance convention explicitly
    allowed by the style guide, while price/volume/scatter still follow canonical
    Imprint order.'
  - 'Clean theme handling: both PNGs use exact background tokens, all chrome (titles,
    tick labels, grid lines, axis lines) is readable in both themes, and all data
    colors are pixel-identical between light and dark renders.'
  - No clipping or overlap anywhere — verified via pixel crops of all four corners
    and the rotated histogram tick labels; canvas is exactly 3200x1800.
  - Deterministic in-memory data generation via a seeded mulberry32 PRNG (browser
    has no seeded Math.random), plus a realistic touch where volume spikes correlate
    with larger daily price moves.
  weaknesses:
  - 'Design Excellence is functional but generic: no custom typography weight variation,
    no accent/callout emphasizing a specific insight (e.g. the largest drawdown or
    highest-volume day), and all four panels carry equal visual weight with no focal
    point — add one deliberate emphasis technique (e.g. highlight the max/min price
    point or annotate the largest volume spike) to give the dashboard a stronger narrative
    hierarchy.'
  - 'Library Mastery is safe/idiomatic but not distinctive for ECharts: the implementation
    only uses grid/xAxis/yAxis arrays, formatters, and areaStyle. Consider a more
    ECharts-specific touch such as a markLine/markPoint calling out the max price
    or largest return bin, or a light dataZoom-friendly axis config, to demonstrate
    deeper library capability (currently capped by the ''raise only with evidence''
    default).'
  - At mobile scale (~400px), the four subplot titles (16px CSS) and 12px tick labels
    will compress significantly since the canvas is divided into quadrants — verify
    legibility isn't materially degraded at the 400w responsive breakpoint, e.g. by
    nudging subplot title/tick fontsize up slightly or tightening the row/column gutters
    to give each panel a bit more room.
  - The 5% gap between each subplot title and its grid (ROW_TOP top 17%/ROW_BOTTOM
    top 62%) is workable but tight relative to the generous-whitespace guideline —
    a touch more breathing room between the row-1 x-axis tick labels and the row-2
    subplot titles would read as more polished.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Main title "subplot-grid · javascript · echarts · anyplot.ai" is centered top in dark ink, clearly visible. Four subplot titles ("Closing Price ($)", "Daily Volume", "Daily Returns Distribution", "Volume vs. Return") in medium-dark gray are all legible. Tick labels on all four axes (dates, $ prices, M-suffixed volume, %-suffixed returns, rotated return-bin labels) are all readable against the light background. Grid lines are thin and subtle, present on price/volume/scatter panels, absent (by design) on the histogram.
      Data: First series (closing price line + area fill) uses the brand green #009E73. Volume bars use the Imprint blue (palette[2]). Return histogram uses a deliberate semantic exception — green bars for non-negative returns, red (palette[4]) for negative returns, matching finance convention. Scatter markers use Imprint cyan (palette[5]).
      Legibility verdict: PASS — no light-on-light text anywhere; verified via pixel crops of all four canvas corners and the rotated x-axis labels with no clipping or overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Main title and all four subplot titles render in light/off-white ink, clearly legible against the dark surface. Tick labels across all axes are in a lighter soft-gray tone and remain fully readable; no dark-on-dark failures observed anywhere (title, axis labels, and ticks all correctly flipped to light ink). Grid lines are faint but visible, same subtlety as the light render.
      Data: Price line/area, volume bars, histogram bars (green/red split), and scatter markers all use pixel-identical hues to the light render — only the chrome (background, text, grid) flipped, confirming palette theme-independence.
      Legibility verdict: PASS — no dark-on-dark or light-on-dark issues found; both renders pass the theme-readability checklist.
