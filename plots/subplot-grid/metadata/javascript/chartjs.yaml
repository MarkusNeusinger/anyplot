      Data: Panel 1 green line with a soft green gradient area fill under the closing price; Panel 2 blue volume bars; Panel 3 green/red gain-loss histogram bars with a custom legend ("Gain (≥0%)" / "Loss (<0%)"); Panel 4 lavender scatter of price vs. volume. First series is Imprint brand green (#009E73) as required.
