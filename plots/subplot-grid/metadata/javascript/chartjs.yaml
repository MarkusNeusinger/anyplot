review:
  strengths:
  - All four subplot types (line, bar, histogram-style bar, scatter) use theme-adaptive
    chrome correctly, and data colors are identical between light and dark renders
  - 'Thoughtful semantic-exception coloring: daily-return histogram bins are colored
    green/red for gain/loss sessions, tying color to real-world financial meaning'
  - 'Correct grid-on/off choices per chart type: y-only grid for line/bar panels,
    both-axes grid for the scatter panel, matching the style guide exactly'
  - Deterministic LCG-based data generation with no external RNG dependency, reproducible
    across runs
  - Volume axis tick labels formatted with an 'M' suffix (e.g. '3.0M') for readability
    instead of raw large integers
  - Canvas dimension gate passed (3200x1800 landscape), mount-node contract respected,
    animation disabled on all four Chart instances
  weaknesses:
  - Spec explicitly calls for supporting 'both shared axes (for comparison) and independent
    axes (for different scales)' — the implementation only demonstrates independent
    axes across four separate Chart.js instances; no linked/shared-scale comparison
    is shown between any two panels
  - Design is mostly default Chart.js chrome with Imprint colors substituted in; little
    additional visual refinement beyond grid on/off toggles (no elevation, custom
    fonts, or panel framing to lift Design Excellence further)
  - Palette assignment across panels skips around canonical order (green, then blue,
    then green/red, then lavender) rather than following positions 1-N in sequence
    — not a violation since these are separate single-series panels, not one multi-series
    chart, but a more coherent story could reuse the canonical order
  - Distinctive Chart.js features are used lightly — no gradient fills, no mixed-type
    single-canvas chart, no plugin-based annotations — mostly straightforward per-instance
    configuration
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark — correct.
      Chrome: Main title "subplot-grid · javascript · chartjs · anyplot.ai" in bold dark ink, centered at top. Four subplot panels in a 2x2 grid, each with a dark bold panel title ("Closing Price", "Trading Volume", "Daily Return Distribution", "Price vs. Volume"), softer-ink axis titles and tick labels. All fully readable against the light background, no light-on-light text.
      Data: Panel 1 is a green (#009E73) line chart of closing price over 60 trading days. Panel 2 is a blue bar chart of trading volume, y-axis formatted in millions. Panel 3 is a two-tone bar histogram of daily returns — bins with negative center are matte red, bins with positive center are brand green (semantic gain/loss exception). Panel 4 is a lavender/purple scatter of price vs. volume. First series (Closing Price) correctly uses brand green #009E73.
      Legibility verdict: PASS — all titles, axis labels, and tick labels are clearly readable; grid lines are subtle and non-competing.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light — correct.
      Chrome: Same layout and text content as the light render, now in light ink (#F0EFE8/soft light gray) against the dark background. All titles, axis labels, and tick labels are clearly visible — no dark-on-dark failures observed.
      Data: Same green line, blue bars, red/green histogram bars, and lavender scatter points as the light render — confirmed identical data colors between the two themes; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues in any of the four panels.
