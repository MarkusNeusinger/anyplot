review:
  strengths:
  - 'Full Imprint palette compliance: brand green first in every panel, canonical
    order (green/lavender/blue/ochre) on the donut, identical data colors between
    light and dark renders'
  - Effectively demonstrates the spec's core requirement — four distinct plot types
    (line, bar, scatter, donut) in one 2x2 grid, each with a clear per-panel title
  - 'Deterministic, realistic financial-dashboard dataset: closing price, trading
    volume, price-vs-volume correlation, and sector allocation that sums to exactly
    100%'
  - 'Clean, idiomatic MUI X usage: skipAnimation on every chart, horizontal-only grid,
    hidden legends for single-series panels, custom arcLabel formatting on the pie'
  - Both light and dark renders are fully legible with correct theme-adaptive chrome
    (background, text, grid) and no edge clipping
  weaknesses:
  - Bar chart (Trading Volume) has no y-axis label — only a 'K' tick formatter; add
    an explicit yAxis label such as 'Volume (shares)' to match the labeling quality
    of the other three panels
  - The donut chart visibly underfills its grid cell compared to the other three panels,
    which extend edge-to-edge — increase outerRadius (or cx/cy) so its footprint better
    matches sibling cell utilization
  - The four panels carry equal visual weight with no focal point or emphasis — consider
    a subtle hierarchy device (e.g. a highlighted data point, callout, or size/contrast
    variation) so the dashboard reads as more than a neutral display of data
  - Scatter markerSize=6 is on the small side for only 18 points (a sparse dataset)
    — bump to ~8-10 so the correlation panel reads with the same prominence as the
    line/bar panels
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "subplot-grid · javascript · muix · anyplot.ai" in bold dark ink at top center. Each of the 4 panels has a small dark-ink cell title ("Closing Price (18 trading days)", "Trading Volume, shares (18 trading days)", "Price vs. Volume Correlation", "Portfolio Sector Allocation"). Axis labels ("Trading Day", "Price ($)", "Volume (shares)") and tick labels are dark and clearly readable. Subtle horizontal (and for the scatter, also vertical) gridlines in light gray, non-competing with data. L-shaped axis frames (left+bottom only).
      Data: First series is brand green (#009E73) in the line, bar, and scatter panels. The donut chart uses canonical Imprint order — green (Technology 34%), lavender (Healthcare 24%), blue (Financials 22%), ochre (Energy 20%) — with white arc labels that read clearly against every wedge color.
      Legibility verdict: PASS — every title, axis label, tick label, and data label is clearly readable against the light background; no dark-on-light or missing text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and cell titles now rendered in light ink, fully legible against the dark surface. Axis labels and tick labels are light-colored and readable. Gridlines are subtle light-on-dark, matching the light render's density/opacity pattern (only the polarity of the chrome flipped).
      Data: Identical data colors to the light render — green line/bars/scatter, and the same green/lavender/blue/ochre donut sequence with the same percentages. No data-color drift between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, cell titles, axis labels, tick labels, donut arc labels) is clearly visible against the near-black background.
