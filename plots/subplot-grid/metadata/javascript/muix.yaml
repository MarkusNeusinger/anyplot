review:
  strengths:
  - Correctly implements a 2x2 subplot grid combining four distinct chart types (line,
    bar, scatter, pie) in one cohesive figure, matching the spec's core requirement
    of combining different plot types rather than faceting the same one
  - 'Smart use of shared vs. independent axes: line and bar charts share the day-index
    x-axis (price/volume by trading day) while scatter (price vs. volume) and pie
    (sector allocation) use fully independent scales, directly demonstrating the spec''s
    ''shared or independent axes'' requirement'
  - ChartsReferenceLine highlighting the peak closing price adds a clear analytical
    focal point without cluttering the chart
  - Both light and dark renders are fully legible, Imprint palette compliant (brand
    green first series, correct pie order), and pass the canvas dimension gate
  - Deterministic in-memory data generation via a tiny seeded LCG, consistent spacing/margins/title
    styling across all four cells
  weaknesses:
  - 'Leftover duplicate header comment block at the top of the file (an old ''// anyplot.ai''
    block with a stale ''Quality: 79/100'' line and prior library-version text, immediately
    followed by the current header) -- collapse to a single header block'
  - At the ~400px mobile thumbnail scale, cell titles and axis tick labels in the
    2x2 grid become quite small and harder to read; consider nudging font sizes up
    slightly, though packing four independent panels into one figure is an inherent
    trade-off of this plot type
  - Pie/donut arc value labels are white text on mid-tone wedge colors (teal/purple/blue/amber)
    -- legible now, but worth double-checking contrast if the sector palette selection
    ever changes
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark.
      Chrome: Figure title "subplot-grid · javascript · muix · anyplot.ai" in bold dark ink, centered at top. Each of the four cells has a dark, medium-weight cell title ("Closing Price (18 trading days)", "Trading Volume, shares (18 trading days)", "Price vs. Volume Correlation", "Portfolio Sector Allocation"). Axis labels ("Trading Day", "Price ($)", "Volume (K)", "Volume (shares)") and tick labels are dark and clearly readable against the light background. Horizontal grid lines are subtle grey, visible but not dominant.
      Data: Top-left line chart shows an 18-day closing-price series in brand green with a dashed amber ChartsReferenceLine marking the peak ("Peak $128.91"), amber label text clearly legible. Top-right bar chart (green bars) shows trading volume per day sharing the same day-index x-axis as the line chart. Bottom-left scatter shows green markers plotting price vs. volume with fully independent axis scales. Bottom-right is a green/purple/blue/amber donut chart (Technology 34%, Healthcare 24%, Financials 22%, Energy 20%) with a custom color-swatch legend to its right; first series is brand green #009E73 as required.
      Legibility verdict: PASS -- all titles, axis labels, tick labels, and data labels are clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light.
      Chrome: Same figure title and four cell titles, now rendered in light/white ink, clearly legible against the dark background. Axis labels and tick labels are light-colored and readable. Grid lines are subtle and still visible without dominating.
      Data: All data colors are identical to the light render -- the line, bars, scatter markers, and donut wedge colors (green/purple/blue/amber) are unchanged; only the chrome (background, title/axis/tick text, grid lines) flipped to the dark-theme tokens. The amber reference-line dash and "Peak $128.91" label remain clearly visible on the dark surface. Donut arc percentage labels (white bold text) remain legible on all four wedge colors.
      Legibility verdict: PASS -- no dark-on-dark failures observed; every title, axis label, tick label, and data annotation is clearly readable against the dark background.
