review:
  strengths:
  - 2x2 grid genuinely mixes four distinct chart types (line, bar, scatter, donut)
    instead of repeating one plot type across cells, exactly matching the spec's core
    requirement
  - Each panel has its own clear title identifying its content, with consistent spacing
    (CELL_GAP/OUTER_GAP) and aligned margins across all four cells
  - Closing-price line chart uses a ChartsReferenceLine to call out the 18-day peak
    price, adding a genuine analytical touch (LM-02) beyond a bare line render
  - Deterministic LCG-seeded data generation with a plausible, neutral financial-dashboard
    scenario (price, volume, sector allocation) covering realistic scale and relationships
  - 'First categorical series is the mandated #009E73 brand green across line/bar/scatter,
    and the pie''s 4-way palette is theme-identical between light and dark renders'
  - skipAnimation set on every chart component; both renders share exactly the same
    layout, sizing, and data colors with only chrome (background/text/grid) flipping
  weaknesses:
  - 'Bottom-right pie chart: the ''Technology 34%'' arcLabel overflows the outer radius
    of its wedge and spills onto the page background. In plot-light.png the spilled
    portion (the ''%'' glyph and part of ''4'') renders as white text on the #FAF8F1
    cream background — near-invisible, a light-on-light legibility failure (the same
    defect class the dark-on-dark check targets, mirrored in light mode). In plot-dark.png
    the same overflow is harmless because white-on-#1A1A17 still reads fine, but VQ-01
    fails because the render must pass in BOTH themes. Fix by keeping the label inside
    the wedge: shrink arcLabel to just the percentage (e.g. ''34%'' without the sector
    name, with sector names shown via the panel legend/labels elsewhere), reduce arcLabelRadius/font
    size for the largest slice, or set arcLabelMinAngle higher combined with a shorter
    valueFormatter so long labels never claim more angular width than the slice provides.'
  - The same arcLabel overflow is a minor layout containment issue beyond the strict
    legibility failure — text extends past its natural container (the donut wedge)
    into surrounding whitespace, which a tighter label-fit would resolve.
  - 'Design Excellence is solid but still close to a well-configured default: only
    the price panel has an emphasis device (the peak reference line); the volume,
    scatter, and pie panels display data without additional visual hierarchy or storytelling
    beyond direct labeling.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) across the full 3200x1800 canvas, consistent behind all four panels.
      Chrome: Bold dark title "subplot-grid · javascript · muix · anyplot.ai" centered at top. Each of the four panel titles (Closing Price, Trading Volume, Price vs. Volume Correlation, Portfolio Sector Allocation) is dark, small, left-aligned and clearly legible. Axis titles ("Trading Day", "Price ($)", "Volume (K)", "Volume (shares)") and tick labels are dark and readable against the cream background. Grid lines are thin, light gray, subtle but visible.
      Data: Line, bar, and scatter series all use brand green #009E73 consistently. The dashed peak-price reference line is amber with an amber label. The pie/donut uses four Imprint colors (green/amber/blue/purple) with white bold percentage+name labels inside each wedge.
      Legibility verdict: FAIL — the "Technology 34%" arc label on the pie chart is wider than its wedge at that radius and its trailing characters ('%' and part of '4') spill past the green wedge boundary onto the cream page background. White text on #FAF8F1 there is near-invisible (light-on-light). All other text in this render (titles, axis labels, ticks, the other three pie labels) is fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) across the full canvas, matching the light render's layout exactly.
      Chrome: Title and all panel titles/axis labels/ticks flip to light/white text, clearly readable against the dark background. Grid lines are thin and subtle, still visible without dominating.
      Data: Line, bar, scatter, and pie colors are pixel-identical to the light render (#009E73 green, amber reference line, and the same four pie colors) — only chrome flipped as required.
      Legibility verdict: PASS for this render specifically — the same "Technology 34%" label overflow occurs geometrically, but because the surrounding page here is dark (#1A1A17), the white overflow text still reads fine (white-on-dark has good contrast). No dark-on-dark failures observed anywhere in this render.

    Overall: the pie-label overflow is a real, reproducible defect that breaks legibility specifically in the light theme; per the theme-readability rule, a defect that fails in either theme fails the render as a whole.
