review:
  strengths:
  - 'A regular 2x2 grid of four distinct, complete MUI X chart types (LineChart, BarChart,
    ScatterChart, PieChart donut) that read as related views of one portfolio scenario:
    one holding''s close and volume over 18 trading days, their relation, and the
    portfolio''s sector allocation'
  - 'Shared and independent axes both demonstrated: the price line and volume bars
    share the same band-scale trading-day axis (same ticks, range and Monday-only
    labels via tickLabelInterval), while the scatter has its own independent volume/close
    axes with their own tick labels and titles'
  - 'Consistent spacing and alignment: an even 24 px CSS grid gap, fixed axis bands
    (AXIS_Y_W / AXIS_X_H) so the plot areas line up along rows and columns, and each
    bold panel title indented to start exactly at its plot area''s left edge'
  - 'Theme threading is complete: ink/inkSoft/grid tokens on every axis line, tick,
    label and grid line, so both renders are fully legible; donut arc labels pick
    dark or light ink per slice by relative luminance'
  - Panel titles are derived from the column constants and the data (row count, Pearson
    r), and the donut's legend sits directly beside its own cell, so it is unambiguous
    which subplot it explains
  - Animation disabled with skipAnimation on every chart; seeded LCG makes the data
    deterministic
  weaknesses:
  - 'CQ-04 (code): the donut''s legend is hand-built from Box/Typography swatches
    (about 10 lines) although MUI X''s native PieChart legend does the same → drop
    hideLegend and the manual list and use slotProps={{ legend: { direction: "vertical",
    position: { vertical: "middle", horizontal: "end" }, sx: { fontSize: 15 } } }}.
    Likely cause: the custom Box list next to the PieChart in the fourth cell.'
  - 'Suggestion: the scatter panel''s vertical grid follows every 20K minor tick;
    a grid only on the labelled 40K ticks would lighten that cell.'
  - 'Suggestion: the volume axis reads "0K" at its origin; formatting zero as "0"
    would be cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panels.
      Chrome: centered bold title "subplot-grid · javascript · muix · anyplot.ai"; four bold panel titles ("Close (USD) · 18 trading days", "Volume (shares) · 18 trading days", "Close (USD) vs Volume (shares) · r = 0.00", "Portfolio weight (%) by sector") left-aligned to each plot area; axis titles "Trading day", "Close (USD)", "Volume (shares)" in dark ink, tick labels in soft dark ink, subtle grid. All readable.
      Data: top-left green #009E73 line of daily closes 124–129 USD with a dashed amber peak reference line labelled "Peak 128.91 USD"; top-right green volume bars 430K–780K on the same Mar 4–Mar 28 day axis; bottom-left 18 green scatter dots of volume vs close; bottom-right donut with Technology 34% (green), Healthcare 24% (lavender #C475FD), Financials 22% (blue #4467A3), Energy 20% (ochre #BD8233), percentage arc labels and a swatch legend directly to its right. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, panel titles, axis titles and tick labels all flip to light ink; grid lines subtle grey; no dark-on-dark text anywhere; the peak label is light on dark; donut legend labels are light.
      Data: identical colors to the light render (green line, bars and dots, same four Imprint donut slices); arc labels keep their per-slice ink (dark on green/lavender/ochre, light on blue).
      Legibility verdict: PASS
