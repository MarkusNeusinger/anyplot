review:
  strengths:
  - A true 2x2 CSS grid (MUI Box with gridTemplateColumns/Rows) of four distinct chart
    types — LineChart, BarChart, ScatterChart and a donut PieChart — reading as one
    portfolio dashboard
  - Price and volume panels share one band x axis (the same dayAxis config), so the
    trading days line up column for column; the scatter keeps independent axes, each
    with its own tick labels and axis title
  - Plot areas line up across rows and columns (both left panels start at the same
    x, both top panels share top and bottom edges) with even 24 px gaps and no text
    running into a neighbor
  - Panel titles are left-aligned with each plot area's left edge and carry computed
    context (18 trading days, r = 0.00), with a clear 22 / 16 / 15 / 14 px type hierarchy
  - Pie slice labels pick dark or light ink from each slice's relative luminance,
    so every percentage stays readable on green, lavender, blue and ochre
  - 'Native MUI X idioms: ChartsReferenceLine composed as a child for the labelled
    price peak, tickLabelInterval that labels only Mondays, valueFormatter for K-volumes,
    arcLabelMinAngle and paddingAngle on the donut, skipAnimation on every chart'
  - The sector legend sits directly beside the donut it explains, and the tooltips/hover
    highlighting work in the HTML view
  weaknesses:
  - 'Suggestion: the scatter panel draws vertical grid lines at every 20K tick while
    labelling only every 40K, so it looks busier than the three other panels; a horizontal-only
    grid or one line per labelled tick would match them.'
  - 'Suggestion: the volume axis'' zero tick reads "0K"; a valueFormatter that prints
    plain 0 would look cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white chart boxes.
      Chrome: centered bold title "subplot-grid · javascript · muix · anyplot.ai" in dark ink; four bold panel titles ("Close (USD) · 18 trading days", "Volume (shares) · 18 trading days", "Close (USD) vs Volume (shares) · r = 0.00", "Portfolio weight (%) by sector") left-aligned with their plot areas; axis titles ("Close (USD)", "Trading day", "Volume (shares)") and tick labels (124–129, 0K–800K, 420K–780K, Mar 4/11/18/25) in dark ink-soft, all readable; subtle light-grey grid lines.
      Data: 2x2 grid. Top-left: brand green #009E73 line of 18 closes with an amber dashed reference line labelled "Peak 128.91 USD". Top-right: 18 green volume bars on the same trading-day axis. Bottom-left: 18 green scatter dots of close vs volume with a full grid. Bottom-right: donut in Imprint order green 34 %, lavender 24 %, blue 22 %, ochre 20 % with luminance-matched slice labels and a vertical legend to its right. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, panel titles, axis titles and tick labels all in light ink and clearly readable; peak label light; grid lines subtle dark grey; no dark-on-dark text anywhere; legend text light.
      Data: identical to the light render — same green line, bars and dots, same amber reference line, same green/lavender/blue/ochre slices; slice labels keep their per-slice ink (dark on green, lavender, ochre; light on blue). Only chrome flipped.
      Legibility verdict: PASS
