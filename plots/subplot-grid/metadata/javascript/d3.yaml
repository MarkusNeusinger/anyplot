review:
  strengths:
  - 'Cohesive financial-dashboard narrative: price line, volume bars, returns histogram,
    and volume-vs-return scatter form a connected, believable story rather than four
    unrelated demo charts.'
  - Correctly satisfies the core subplot-grid requirement by giving each cell a genuinely
    different plot type (line, bar, histogram, scatter) with independent scales sized
    to its own data.
  - Fully deterministic in-browser data generation via a fixed-seed LCG — no fetch/d3.csv/d3.json,
    matching the offline-render contract.
  - Theme-adaptive chrome (ink, inkSoft, grid, pageBg) is threaded consistently through
    all four panels in both light and dark renders, with identical data colors across
    themes.
  - Idiomatic, varied use of the d3 API across cells — scaleBand, scaleLinear, d3.bin(),
    d3.extent, d3.format — without resorting to a single copy-pasted chart four times.
  weaknesses:
  - 'VQ-04: ''Up day''/''Down day'' is encoded with red vs. green as the sole differentiator
    in both the histogram and scatter cells — red-green color-vision-deficient viewers
    cannot distinguish the two categories by color alone. Add a secondary cue (e.g.
    different marker shape for down days, or a hatch/texture on the down bars) alongside
    the color.'
  - The grid is hardcoded to a single 2x2 layout with every cell on fully independent
    axes; the spec calls out supporting configurable grid dimensions AND shared axes
    for comparison. Consider demonstrating at least one shared/linked scale (e.g.
    a common day-index domain rendered consistently) to show that capability, not
    just independent axes.
  - 'CQ-01: the `panel`, `styleAxis`, and `legend` helper functions add structure
    beyond the ''no functions'' ideal — reasonable given the 4x repetition across
    cells, but still a minor deduction versus a fully flat script.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Centered title "subplot-grid · javascript · d3 · anyplot.ai" in bold dark ink; each of the four cells has a bold dark subtitle ("Stock Price ($)", "Trading Volume", "Daily Returns Distribution", "Volume vs. Daily Return"); axis tick labels are dark gray, clearly legible; gridlines are subtle light-gray horizontal (and vertical in the scatter cell) lines that don't compete with the data.
      Data: Top-left is a green (#009E73) price line over 60 trading days with $-formatted y-axis; top-right is a purple bar chart of trading volume with SI-formatted y-axis (500k, 1.0M, ...); bottom-left is a red/green histogram of daily returns (down days red, up days green) with a small two-row legend; bottom-right is a red/green scatter of volume vs. daily return with a matching legend. First categorical series (price line) is confirmed #009E73.
      Legibility verdict: PASS — all titles, subtitles, axis labels, and tick labels are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and four cell subtitles now rendered in light/off-white ink, clearly legible; axis tick labels are light gray; gridlines are subtle dark-gray, still visible without dominating.
      Data: Same green price line, purple volume bars, and red/green histogram + scatter markers as the light render — colors are identical between the two themes, confirming only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/subtitle/tick text is clearly visible against the near-black background, and the brand green and purple/red data colors remain vivid on the dark surface.
