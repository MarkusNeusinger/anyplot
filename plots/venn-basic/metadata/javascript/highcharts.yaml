review:
  strengths:
  - Mathematically proportional circle sizing (radius ∝ sqrt(set size)) keeps circle
    area faithful to the underlying counts, matching the spec's 'area proportional
    to size when possible' note
  - All seven regions (three exclusives, three pairwise overlaps, one triple overlap)
    are individually labeled with counts, fully satisfying the spec's 'display counts
    or percentages in each region' requirement
  - Clever use of Highcharts' core SVG renderer (renderer.circle + renderer.text)
    to construct a venn diagram that has no native series type in the loaded core
    bundle — avoids NOT_FEASIBLE while respecting the 'no add-on modules' constraint
  - 'Canonical Imprint palette order (green → lavender → blue) applied correctly,
    with theme-adaptive #FAF8F1/#1A1A17 backgrounds confirmed identical data colors
    across both renders'
  - Clean, deterministic, dependency-free code with animation disabled at both the
    chart and series level, no fake interactivity
  weaknesses:
  - 'Set-name labels are colored with the raw palette hue (t.palette[1] lavender for
    ''Cycling'', t.palette[0] green for ''Hiking'') directly on the light #FAF8F1
    background; computed contrast is ~2.7:1 for the lavender label and ~3.2:1 for
    the green label, both below WCAG large-text guidance (3:1 minimum, 4.5:1 for normal
    text) — switch the set-name labels to t.ink/t.inkSoft (matching the region-count
    labels) or add a subtle darkening/outline so all three labels meet contrast targets
    in light mode'
  - Design polish is competent but fairly standard for a venn layout — no additional
    visual-hierarchy device beyond the required elements (e.g., subtle depth/shadow
    or size-based label emphasis), keeping Design Excellence closer to a solid baseline
    than a standout
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "venn-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable, centered near the top. No axes (correct for a venn diagram). Set-name labels "Hiking" (green), "Cycling" (lavender), "Swimming" (blue) sit just outside each circle.
      Data: Three overlapping circles — green (Hiking, #009E73), lavender (Cycling), blue (Swimming) — each at ~55% fill opacity so overlap regions blend into distinguishable intermediate hues. Region-count labels (70, 50, 45, 25, 15, 10, 10) are rendered in dark ink and are clearly legible against both the single-set fills and the blended overlap fills.
      Legibility verdict: PASS overall, with a caveat — the "Cycling" (lavender) and "Hiking" (green) set-name labels have measurably low contrast against the cream background (~2.7:1 and ~3.2:1 respectively), below WCAG guidance for even large bold text (3:1). They remain readable to the eye at 18px bold but this is a real accessibility weakness worth fixing (see Weaknesses). The blue "Swimming" label and all dark-ink region-count numbers pass comfortably.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title, now in light ink, clearly readable against the dark background. Set-name labels use the same three palette hues, which read with good contrast against the dark backdrop (green, lavender, and blue are all noticeably brighter than the near-black surface).
      Data: Identical circle colors and layout to the light render — confirms the Imprint data colors (green/lavender/blue) are unchanged between themes, only the chrome (background, title, region-count label color) flips. Region-count labels are rendered in light ink, clearly visible against both the darker single-set fills and the deeper-toned overlap blends.
      Legibility verdict: PASS — no dark-on-dark issues; all text (title, set-name labels, region counts) is clearly visible against the near-black background and against every circle fill/overlap tone.
