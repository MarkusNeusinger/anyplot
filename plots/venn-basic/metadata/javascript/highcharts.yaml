review:
  strengths:
  - Set-name labels now correctly use t.ink instead of raw palette hues, resolving
    the attempt-1 WCAG contrast issue completely in both themes
  - Mathematically proportional circle sizing (radius proportional to sqrt of set
    size) keeps circle area faithful to the underlying counts
  - All seven regions (three exclusives, three pairwise overlaps, one triple overlap)
    are individually labeled with counts, none clipped or overlapping
  - Clever use of Highcharts' core SVG renderer to construct a Venn diagram that has
    no native series type in the loaded core bundle
  - Canonical Imprint palette order, correct theme-adaptive chrome, identical data
    colors across both renders
  - Clean, deterministic, dependency-free code with no fake interactivity
  weaknesses:
  - Design polish remains competent but standard for a Venn layout - no additional
    visual-hierarchy device was added since attempt 1's feedback suggested one; this
    is a minor polish opportunity, not a blocker
