review:
  strengths:
  - Data is fully self-consistent and correctly mapped to all seven Venn regions (e.g.
    Python-only 55 + AB-only 30 + AC-only 20 + ABC 15 = 120, matching the declared
    Python total; JavaScript and SQL totals check out the same way).
  - 'Excellent readability engineering: hand-tuned polar label placement radii keep
    every count and set label inside its intended lens/petal without collisions, and
    the theme-adaptive ink-fill + page-background stroke halo keeps counts legible
    over any overlap tint.'
  - 'Correct Imprint palette usage (first series #009E73) with fully theme-correct
    chrome (cream/near-black backgrounds, ink-colored text) and identical data colors
    across both renders.'
  - Because ECharts has no native Venn/Euler chart type, the implementation correctly
    builds the diagram from the `graphic.elements` API (circles + styled text) rather
    than faking it with an unsupported chart type - idiomatic use of ECharts' most
    flexible extension point.
  weaknesses:
  - All three circles use the identical radius `r` regardless of set size (Python
    120 vs. JavaScript 100 vs. SQL 90); the spec notes 'area proportional to size
    when possible' - scale each circle's radius by sqrt(set_sizes[i]) (normalized
    to the current average radius) for a closer proportional/Euler-style approximation.
  - Overlap regions rely on alpha-blended (0.5) fills that create 2-way and 3-way
    blended hues never explicitly verified for CVD safety - the base Imprint colors
    are colorblind-safe individually but the blends are not part of the validated
    palette; consider nudging the fill alpha or adding a subtle per-region border
    tint so overlap regions stay distinguishable under color-vision deficiency simulations.
  - 'Region-count labels use a stroke halo (`stroke: t.pageBg`, `lineWidth: 3`) while
    the set-name labels (Python/JavaScript/SQL) use plain fill with no stroke - this
    stylistic inconsistency between the two label types is a minor visual mismatch
    worth aligning (either both haloed or both plain).'
  - 'Design excellence is solid but not exceptional: the composition doesn''t add
    a focal point or emphasis on the most notable relationship (e.g. the small 15-count
    triple overlap) - a subtle size/weight/color emphasis on the intersection story
    would elevate the storytelling beyond ''correctly displays all regions''.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "venn-basic · javascript · echarts · anyplot.ai" is bold dark ink, centered top, fully readable. The three set labels ("Python 120", "JavaScript 100", "SQL 90") sit just outside their respective circles in bold dark text, clearly legible against the cream background. The seven region-count numbers (55, 30, 40, 20, 15, 15, 40) are rendered in dark ink with a light page-background-colored halo stroke so they stay legible against the pastel overlap tints.
      Data: Three overlapping circles - Python in Imprint brand green (#009E73), JavaScript in Imprint lavender (#C475FD), SQL in Imprint blue (#4467A3), each at 0.5 alpha with a cream-colored stroke separating them. Overlap regions show blended tones (green+lavender, green+blue, lavender+blue, and a tri-blend at center).
      Legibility verdict: PASS - all text (title, set labels, region counts) is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, set labels, and region-count numbers all render in light ink (theme-flipped from the light render), fully legible against the dark background. No dark-on-dark failures found - every text element uses the light ink token correctly.
      Data: Same three circles in identical Imprint hues (#009E73 green, #C475FD lavender/purple, #4467A3 blue) - confirmed identical to the light render; only the chrome (background, text ink, circle border stroke color) flipped to the dark-theme tokens.
      Legibility verdict: PASS - all text is clearly readable against the dark background; brand green remains vivid on the dark surface.
