review:
  strengths:
  - 'Correct set-theory arithmetic: onlyA/onlyB/onlyC and pairwise-minus-triple values
    are computed programmatically from setSizes/pairAB/pairAC/pairBC/tripleABC and
    match the displayed regions exactly (55/38/30 solo, 27/20/12 pairwise, 18 triple).'
  - Follows MUI X's documented ChartContainer + useDrawingArea composition pattern
    for a chart type the community package has no native primitive for — a legitimate,
    idiomatic escape hatch rather than a hack.
  - Area-proportional circle sizing via sqrt(size) scaling gives the diagram real
    information value beyond a schematic three-equal-circle Venn.
  - Text uses a paintOrder stroke halo (fill=t.ink, stroke=t.pageBg) so every count/label
    stays readable regardless of which colored region or overlap it sits on, in both
    themes.
  - 'First series (Python) correctly uses brand green #009E73; data colors are identical
    between light/dark renders — only chrome (background, text halo) flips as required.'
  weaknesses:
  - Title occupies only ~30% of the canvas width at fontSize=22 — comfortably legible
    but visually light as an anchor on a 2400x2400 square canvas; a slightly larger
    fontSize (~26-28) would give it more presence without risking overflow.
  - No visual emphasis differentiates the most meaningful intersection (e.g. the full
    triple-overlap '18') from the other regions — bolding, a subtle outline, or a
    callout on the triple-overlap would strengthen the data storytelling.
  - Circle styling is flat semi-transparent fill only; a slightly heavier or varied
    stroke weight between the three circles could add a touch more visual refinement,
    though current styling is already clean and uncluttered.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "venn-basic · javascript · muix · anyplot.ai" is centered at top in dark ink, fully legible. No axes (not applicable to a Venn diagram). No legend box — set names are labeled in place inside each circle instead.
      Data: Three overlapping circles — Python (top, brand green #009E73), SQL (bottom-left, purple), Statistics (bottom-right, steel-blue). Solo-region counts (55/38/30) and set labels are shown inside each circle; pairwise-overlap counts (27, 20, 12) and the triple-overlap count (18) are placed in their respective lens/core regions. All counts use a white-fill/light-stroke halo so they stay readable against every fill color and overlap blend. Fills use ~0.55 opacity so overlaps visibly darken/blend.
      Legibility verdict: PASS — every title, set-label, and count is clearly readable against its background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light ink, fully legible against the dark background. Same in-circle labeling scheme as the light render, no separate legend.
      Data: Same three circles in the same hues (green/purple/steel-blue) and same solo/pairwise/triple counts (55/38/30, 27/20/12, 18) — data colors are identical to the light render, confirming only chrome flipped. Text halo now uses a dark stroke against the light fill so counts remain legible over the lighter overlap blends.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, set labels, region counts) is clearly visible against both the page background and the circle fills.
