review:
  strengths:
  - 'Correct Imprint palette: fiction circle uses brand green #009E73, nonfiction
    uses palette position 2 purple, and backgrounds are theme-correct #FAF8F1 (light)
    / #1A1A17 (dark) in both renders'
  - 'Clever, idiomatic solution to Chart.js''s lack of native Venn geometry: uses
    the native afterDatasetsDraw plugin hook to draw circles sized from chart.chartArea
    instead of reaching for an external/community plugin, exactly per the chartjs
    library rules'
  - Circle areas are proportionally sized to the real set totals (sqrt-scaled radius),
    and the alpha-blended overlap clearly shows the shared region
  - All text (title, subtitle, set names, region counts) is legible in both light
    and dark renders with explicit font sizes, no clipping and no overlap
  - Realistic, neutral survey data with sensible scale (500 respondents, plausible
    fiction/nonfiction overlap of 95)
  weaknesses:
  - The overlap ('Both') region is positioned using a fixed geometric factor (centerDist
    = (rA + rB) * 0.42) rather than one derived from the actual intersection count
    (95) — so while circle *areas* are proportional to set totals, the *overlap area*
    does not scale with the intersection size. A true proportional Venn diagram should
    derive the center distance from the desired lens area based on bothGenres relative
    to each circle's area.
  - Only 2 sets are shown; the spec explicitly supports 2-3 sets and calls out triple-overlap
    regions as a feature. A 3-set variant would better demonstrate full Venn-diagram
    feature coverage (pairwise AND triple intersections).
  - The circle stroke (lineWidth 3) is fairly bold relative to the soft alpha fills
    — a thinner or matched-opacity stroke would read as more refined.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "venn-basic · javascript · chartjs · anyplot.ai" in bold dark ink, subtitle "Reading habits of 500 surveyed adults" in softer gray beneath it — both clearly readable. "Fiction readers" and "Nonfiction readers" labels sit above their respective circles in bold dark text, fully legible against the light background.
      Data: Left circle (Fiction) filled in translucent brand green (#009E73 at ~55% alpha) with a solid green stroke; right circle (Nonfiction) filled in translucent light purple with a solid purple stroke. The overlap region blends into a muted blue-violet. Region counts "185" (Fiction only), "95" (Both), "115" (Nonfiction only) are bold dark numbers with smaller gray captions beneath, all clearly legible against their respective fills.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and subtitle render in light/off-white text, fully legible against the dark background. "Fiction readers" and "Nonfiction readers" labels are light-colored and clearly readable above their circles. No dark-on-dark failures observed.
      Data: Same green (#009E73) and purple hues as the light render, now filled over darker green/purple tones with the overlap showing a deeper violet blend — data colors are identical to the light render, only chrome (background, text) flips as expected. Region counts "185", "95", "115" are bold light text with slightly dimmer gray captions beneath; all remain clearly legible against the darker circle fills.
      Legibility verdict: PASS
