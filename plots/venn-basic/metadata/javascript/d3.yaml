review:
  strengths:
  - Correct 3-circle Venn structure with all 7 regions (3 singles, 3 pairs, 1 triple)
    shown; the inclusion-exclusion arithmetic checks out exactly against the source
    set_sizes/intersections (verified by pixel-summing back to 145/120/95)
  - 'Clever halo-stroke text technique (paint-order: stroke, fill=ink, stroke=pageBg)
    keeps region-count labels legible over any of the varying overlap colors - verified
    by pixel sampling that fill/stroke are correctly swapped between light and dark
    themes'
  - 'Exact Imprint palette + theme-chrome compliance: pixel-verified background hex
    (#FAF8F1 light / #1A1A17 dark) and canonical categorical order (green -> lavender
    -> blue) held identical across both renders'
  - Clean idiomatic D3 data-join pattern (selectAll().data().join()), deterministic
    hard-coded data, no unused imports, correct mount-node/canvas contract
  - Realistic, neutral data scenario (250 surveyed engineers' language overlap) with
    internally consistent, factually plausible numbers
  weaknesses:
  - Circles are drawn at an identical fixed radius regardless of set size (145 vs
    120 vs 95), even though the spec explicitly calls for 'area proportional to size
    when possible' - scale circle radius (e.g. r proportional to sqrt(size)) so the
    largest set (Python, 145) visibly reads larger than the smallest (SQL, 95)
  - 'Design Excellence stays close to a well-configured default: beyond the halo-text
    trick and flat Imprint fills there is no visual hierarchy emphasizing the dominant
    set or key relationship (e.g. size/stroke emphasis on the largest circle or the
    triple-overlap) - add a deliberate focal point per DE-03'
  - 'Library Mastery is generic: the only D3-specific idiom used is selection.data().join();
    using d3.scaleSqrt for radius-by-size (which would also fix the proportional-area
    gap) or another D3-only helper would demonstrate deeper mastery'
  - Region-count font (26px) with a 5px stroke halo reads fine at full 2400px resolution
    but the halo can visually thin out the smallest counts (e.g. '15') - double check
    legibility at the ~400px mobile thumbnail size
