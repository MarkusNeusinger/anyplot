    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at (26,26,23) = #1A1A17, matches spec exactly.
      Chrome: Title and legend text render in light ink, clearly legible against the dark background. Circle colors read as deeper, more saturated tones (dark theme fill values, e.g. (51,72,107) for the SQL circle base) while remaining visually distinct.
