review:
  strengths:
  - Set arithmetic is internally consistent across all 7 regions (e.g. Python-only
    = 120-40-25+12 = 67, matching the displayed label) — the inclusion-exclusion math
    is correct.
  - 'Correct Imprint palette order: Python (first series) is #009E73 brand green,
    with SQL/R following the canonical order; data colors are identical between light
    and dark renders.'
  - Clean theme_void chrome with alpha-blended overlap regions that read clearly in
    both themes; title, set labels, and region counts are all legible with no dark-on-dark
    or light-on-light failures.
  - Square canvas (2400x2400) rendered correctly with generous margins — no clipping
    of title, labels, or circles at any edge.
  weaknesses:
  - Circles all use the same fixed radius (2.2) regardless of set size, even though
    set_sizes differ substantially (120 vs 95 vs 70). The spec explicitly calls for
    'Area proportional to size when possible (proportional Venn diagrams)' — scaling
    circle radius by sqrt(set_size) (or similar) would better honor this while keeping
    the three-circle layout intact.
  - 'Design storytelling is functional but generic: only raw counts are shown in each
    region with no secondary cue (e.g. percentage of total, or a subtly emphasized/highlighted
    intersection) to create a stronger focal point or hierarchy beyond uniform bold
    text.'
  image_description: |-
