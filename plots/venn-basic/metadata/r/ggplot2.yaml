      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title and labels now rendered in light ink (#F0EFE8), fully legible against the dark background and against every circle fill (including deep-teal/purple blended overlaps) — no dark-on-dark failures anywhere.
      Data: Confirmed identical hues to light render (green/lavender/blue), only their apparent tone shifts due to the darker background and blending; circle outline color also adapted appropriately (light gray stroke vs dark gray in light mode).
