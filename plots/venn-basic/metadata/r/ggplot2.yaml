review:
  strengths:
  - Area-proportional circle radii (scaled by sqrt(set_size / max_set_size)) give
    the diagram real information content beyond a generic three-equal-circles layout
  - All seven regions (3 exclusive, 3 pairwise, 1 triple) are correctly computed via
    inclusion-exclusion and labeled with both count and percentage, matching the spec's
    request for counts/percentages in each region
  - 'Clear visual hierarchy: the triple-overlap count is bolded and rendered larger
    (size 7.0) than the other region counts (5.6), guiding the eye to the most notable
    intersection'
  - 'Clean theme-adaptive chrome: PAGE_BG/INK/INK_SOFT tokens correctly flip between
    light and dark renders while the Imprint fill colors stay identical'
  - theme_void() + explicit plot.margin keeps the diagram uncluttered with generous,
    balanced whitespace
  - Realistic, neutral data scenario (Python/SQL/R skill overlap across job candidates)
    with internally consistent set arithmetic
  weaknesses:
  - circle_points() is a custom helper function — the KISS structure guideline for
    R implementations prefers a flat Imports → Data → Plot → Save script; consider
    inlining the three seq()/cos()/sin() blocks or accepting the minor deduction for
    the (justified) reuse
  - The two smallest labels (percentage sub-labels at size 3.2, e.g. '6%' in the top-right
    and center regions) sit close to the smallest-comfortable size band — a slightly
    larger size or more contrast against INK_SOFT would improve mobile legibility
  - The circle-overlap coloring (alpha-blended green/lavender/blue) keeps most pairwise
    and triple regions within a similar blue-purple hue family — distinguishable because
    every region is numerically labeled, but leans on those labels rather than hue
    alone
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "venn-basic · r · ggplot2 · anyplot.ai" centered at top in dark ink, comfortably sized (~50% of width). Three set-name labels ("Python (n=120)", "SQL (n=95)", "R (n=70)") in bold dark text sit just outside/at the edge of their circles. Region counts (67, 37, 27, 28, 13, 18, 12) in bold dark text, with smaller percentage sub-labels below each in a softer gray. All text reads clearly against both the off-white page background and the pastel circle fills.
      Data: Three overlapping circles filled with the Imprint palette — Python = #009E73 (brand green, largest circle, area-proportional to n=120), SQL = #C475FD (lavender, medium), R = #4467A3 (blue, smallest, proportional to n=70). Overlap regions show alpha-blended combinations (teal-lavender, teal-blue, purple-blue, and a deeper blue at the triple intersection).
      Legibility verdict: PASS — no light-on-light text, no clipping observed at the canvas edges (verified at both full resolution and the 400px thumbnail).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and set-name labels, now rendered in light ink (#F0EFE8) and soft gray percentages (#B8B7B0) — both clearly legible against the dark page and against the darker, more saturated circle fills used in this theme.
      Data: Same three Imprint hues (#009E73 green, #C475FD lavender, #4467A3 blue) applied to the same circle geometry; circle areas and region layout are pixel-identical to the light render. The alpha-blended overlap shades read slightly differently only because they composite against the dark page background, which is expected/inherent to this alpha-blending technique — no data value in the fill scale changed between themes.
      Legibility verdict: PASS — no dark-on-dark text found; all numbers, percentages, and set labels are clearly visible in light ink against the dark circle fills and page background. Brand green Python circle remains clearly identifiable.
