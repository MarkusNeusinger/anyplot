      Data: Three circles — Python (green #009E73, top), SQL (lavender #C475FD, bottom-left), R (blue #4467A3, bottom-right) — at alpha=0.5, producing distinct blended colors in the two-way and three-way overlap regions. First series is confirmed brand green #009E73.
