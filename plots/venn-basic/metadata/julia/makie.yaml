review:
  strengths:
  - Correct 3-circle Venn diagram with mathematically consistent region math — all
    seven region counts (80, 65, 50, 30, 20, 10, 15) sum exactly to the stated n=270,
    and the displayed percentages match.
  - 'Palette compliance: Python (first series) renders in brand green #009E73, SQL
    and JavaScript follow the canonical Imprint order (#C475FD, #4467A3); backgrounds
    and chrome are correctly theme-adaptive (#FAF8F1 light / #1A1A17 dark) with identical
    underlying data colors in both renders.'
  - Clean minimalist layout — axis decorations and spines fully hidden via hidedecorations!/hidespines!,
    generous whitespace, no overlapping text, no edge clipping in either render.
  - Title exactly matches the mandated `spec-id · language · library · anyplot.ai`
    convention.
  - Realistic, neutral, comprehensible dataset (developer skill-set survey across
    270 engineers) with counts and percentages labeled in every region.
  weaknesses:
  - Circles are drawn at equal radius (1.6) despite set sizes differing substantially
    (Python=145, SQL=120, JavaScript=95); the spec asks for area-proportional circles
    when possible — scale each circle's radius relative to sqrt(size) for a more accurate
    visual impression of magnitude.
  - No clear visual hierarchy or focal point — all three circles and all seven regions
    carry equal visual weight. Consider emphasizing the largest region or the most
    interesting overlap (e.g. bolder stroke, subtle callout, or slight size/opacity
    contrast) to give the plot a story (DE-03).
  - Library Mastery is generic — poly!(ax, Circle(...)) with alpha blending is a technique
    easily replicated in matplotlib or any other library. Lean into a more Makie-distinctive
    touch (e.g. Label decorations, GeometryBasics-based per-region shading, or Makie's
    layout/grid system) to raise LM-02.
  - Helper functions pct() and region_label() deviate from the flat imports → data
    → plot → save skeleton expected for anyplot scripts (CQ-01) — inline the two calculations
    to keep the script strictly linear.
  - The smallest region-count labels (15pt on the 2400px canvas, e.g. the '10 (4%)'
    triple-adjacent label) are close to the lower comfortable-legibility bound once
    scaled down to a ~400px mobile thumbnail — bump region-label fontsize slightly
    (to ~17pt) for extra safety margin.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "venn-basic · julia · makie · anyplot.ai" in bold dark text, centered top. Set-name labels "Python", "SQL", "JavaScript" in bold dark text placed just outside their respective circles. No axes, ticks, or spines are shown (intentionally hidden for a Venn diagram). All chrome text is clearly readable against the light background.
      Data: Three overlapping circles — green (Python, #009E73), lavender/purple (SQL, #C475FD), and blue (JavaScript, #4467A3) — each filled with alpha ≈ 0.55, producing blended teal/purple/dark-blue tones in the overlap lenses. Region labels show count + percentage in dark text: 80 (30%) Python-only, 65 (24%) SQL-only, 50 (19%) JavaScript-only, 30 (11%) Python∩SQL, 20 (7%) Python∩JavaScript, 10 (4%) SQL∩JavaScript, 15 (6%) triple overlap at center. First categorical series is confirmed #009E73.
      Legibility verdict: PASS — all title, set-name, and region-count text is clearly readable against the light background and against the various blended fill tones.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and set-name labels, now rendered in light/off-white bold text against the dark background. Axes remain hidden. All chrome text is clearly readable.
      Data: Same three circle fill colors and alpha blending as the light render — green, lavender/purple, and blue data colors are visually identical between the two renders; only the background, stroke, and text chrome flipped to dark-theme tokens. Region count/percentage labels are rendered in light text and remain legible against both the darker overlap fills and the more saturated single-set fills.
      Legibility verdict: PASS — no dark-on-dark failures observed; every region label sits on a fill dark/light enough to keep contrast with the light label text.
