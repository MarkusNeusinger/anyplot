review:
  strengths:
  - Correct 3-circle Venn with all 7 regions present and distinctly labeled with count
    + percentage; inclusion-exclusion arithmetic verified correct (all regions sum
    to n=270).
  - Circle radii scaled by sqrt(set size) for an area-proportional impression, with
    the Imprint palette (green, lavender, blue) applied in canonical order and kept
    pixel-identical between light and dark renders.
  - 'Genuine data storytelling: the triple-overlap region gets a soft halo backdrop,
    a bolder/larger label, and a grid-layout callout row (fig[2,1] Label) that turns
    the number into a one-sentence insight — a Makie-distinctive layout technique,
    not just axis text.'
  - 'Theme-adaptive chrome is clean end to end: backgrounds, ink tokens, and circle
    strokes all flip correctly between themes with no dark-on-dark or light-on-light
    failures.'
  weaknesses:
  - Overlap-region fills (two-way vs. three-way) sit close in hue/lightness after
    alpha-blending (purple, teal, slate-blue, navy) — the diagram leans on the printed
    counts to disambiguate regions rather than strong hue separation; a slightly higher
    fill_alpha or a small saturation bump on the triple-overlap halo would make the
    three-way region read as visually distinct at a glance, not just via its label.
  - Typography is solid but single-register (bold vs. regular only) — a touch more
    type hierarchy (e.g. a lighter weight or smaller size for the '(X%)' sub-line
    vs. the count) would push Design Excellence further toward publication-grade.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "venn-basic · julia · makie · anyplot.ai" in dark ink at top, clearly legible. "Python", "SQL", "JavaScript" set-name labels in bold dark text sit just outside their circles. Bottom caption line ("15 engineers (6%) are full-stack...") in a softer dark-gray, also legible.
      Data: Three overlapping circles — Python = brand green (#009E73), SQL = lavender (#C475FD), JavaScript = blue (#4467A3), all at ~0.55 alpha with soft dark strokes. All 7 Venn regions (3 singles, 3 pairwise, 1 triple) show a count + percentage in dark ink text. The triple-overlap region (15, 6%) sits inside a light halo circle for emphasis.
      Legibility verdict: PASS — all text reads clearly against the light background and against the translucent circle fills.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and set-name labels now rendered in light/white ink, clearly legible against the dark background. Caption line in a softer light-gray tone, legible.
      Data: Same three circle colors (#009E73 green, #C475FD lavender, #4467A3 blue) — confirmed identical to the light render; only the page background, strokes, and text ink flipped. Triple-overlap halo circle uses a slightly elevated dark backdrop, region text in white.
      Legibility verdict: PASS — no dark-on-dark failures; all region labels, set names, title, and caption remain fully readable.
