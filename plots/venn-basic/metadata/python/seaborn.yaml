    colors identical across themes'
  - Region labels placed at each region's own centroid point, set labels aligned by
    their outward direction and kept outside their circles
  weaknesses:
  - 'VQ-05 (both): the circles span only about 55% of the canvas width and the diagram
    leaves an empty band of roughly 20% of the height between the bottom circle and
    the caption → let the circles fill about 70–75% of the canvas. Likely cause: span
    = reach * 1.3 plus the title and caption margins; reduce the factor to about 1.12.'
  - 'CQ-01 (code): three helper functions (inclusive, lens_area, pair_distance, lines
    65–104) break the Imports → Data → Plot → Save structure → inline them as expressions
    in the data and layout steps. Likely cause: geometry written as reusable helpers.'
  - 'CQ-04 (code): pair_distance writes out a 60-step bisection (lines 95–104) that
    scipy.optimize.brentq computes → brentq(lambda d: lens_area(d, r1, r2) - target,
    abs(r1 - r2), r1 + r2). Likely cause: hand-rolled root finding.'
  - 'Suggestion: drop the region-label box alpha a little so the overlap blends read
    through the label backgrounds.'
