review:
  strengths:
  - Circle areas follow the set sizes (r = sqrt(size/pi)) and each pair's center distance
    is solved so the lens area matches its inclusive intersection, so Product A is
    visibly the largest circle and Product C the smallest
  - Exclusive counts are computed by inclusion-exclusion from the inclusive table
    (60, 35, 25, 20, 10, 15, 10 all correct) and placed at the point of each region
    farthest from any outline, so every count sits clear inside its region
  - Equal data scale on both axes keeps the circles round on the 3200x1800 canvas
  - 'Circles drawn as one ColumnDataSource-driven circle glyph with radius in data
    units, colors in canonical Imprint order (#009E73, #C475FD, #4467A3) at 0.35 alpha
    so every overlap reads as a blend with solid outlines'
  - 'Clear typographic hierarchy: 40pt bold region counts, 36pt bold set names in
    INK, 28pt set totals in INK_SOFT; all chrome theme-correct in both renders'
  weaknesses:
  - 'VQ-05 (dark): a thin grey rectangle frames the plot area in the dark render (about
    40 px inside the canvas edge), a frame the light render does not show and the
    style guide''s no-frame rule excludes → no visible frame in either theme. Likely
    cause: the plot area''s outline or border still drawn in a default grey despite
    p.outline_line_color = None; set the border/outline color to PAGE_BG or None on
    every frame element.'
  - 'CQ-01 (code): two helper functions, lens_area (lines 64-71) and pair_distance
    (lines 74-80), break the flat KISS structure → inline the lens-area formula and
    the bisection loop in the per-pair loop. Likely cause: the circle-layout solver
    written as functions.'
  - 'DQ-02 (both): the sets are labelled Product A, Product B and Product C, which
    read as generic placeholders → concrete names for the product-feature scenario
    (for example three real-sounding plan tiers or features). Likely cause: the SETS
    labels in the data block.'
  - 'Suggestion: set the n = totals closer under their set names; the gap between
    name and total is wider than the gap to the circle.'
