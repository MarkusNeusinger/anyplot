review:
  strengths:
  - Exclusive region counts are derived from the inclusive set and intersection sizes
    (40/25/15/20/10/15/10 from 80/70/50, AB=30, AC=20, BC=25, ABC=10), matching the
    spec's data model
  - Circle areas follow the set sizes and every pairwise overlap is solved exactly
    with scipy.optimize.brentq on the lens-area formula, so a larger set is never
    the smaller circle
  - Each region count sits at the point deepest inside its region (scipy.ndimage.distance_transform_edt),
    so all seven counts stay well clear of the outlines
  - Translucent fills plus a same-hue outline per circle make every overlap read as
    a blend with visible boundaries in both themes
  - 'Theme tokens threaded through title, set labels and counts: all text readable
    on #FAF8F1 and #1A1A17, data colors identical across themes'
  - Exact 3200x1800 canvas with default bbox_inches, per the library rules
  weaknesses:
  - 'VQ-05 (both): the diagram fills only about 55 % of the canvas height (y ≈ 245–890
    of 1125 px) and about 45 % of its width, leaving a ~20 % empty band beneath it
    → about 75–80 % of the height. Likely cause: pad = 0.45 * max(radii) added on
    every side before set_xlim/set_ylim.'
  - 'CQ-01 (code): two helper functions, lens_area() and center_distance(), break
    the no-functions KISS structure → inline the lens-area expression in the brentq
    lambda calls. Likely cause: the helper definitions above the d_ab/d_ac/d_bc block.'
  - 'Suggestion: matplotlib_venn''s venn3 (installed for this spec) would compute
    the area-proportional layout and label positions in a few lines, which would also
    lift LM-01.'
  - 'Suggestion: slightly larger region counts (13–14 pt) would give the counts more
    presence against the bold 13 pt set labels.'
