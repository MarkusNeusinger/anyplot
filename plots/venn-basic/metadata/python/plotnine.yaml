  - 'SC-02 (both): all three circles share radius 5, so the 100-member set is drawn
    the same size as the 60-member set and overlap areas ignore the intersection sizes
    → radii from sqrt(size/π) and centre distances solved from the overlap areas.
    Likely cause: radius = 5 and a fixed offset for every circle.'
  - 'SC-04 (both): title reads "venn-basic · plotnine · anyplot.ai", missing the language
    segment → "venn-basic · python · plotnine · anyplot.ai". Likely cause: the labs(title=...)
    string.'
  - 'VQ-07 (dark): a white hairline frames the canvas edge on the #1A1A17 surface
    → the frame in the page colour. Likely cause: plot_background=element_rect(fill=PAGE_BG,
    color=None) leaves matplotlib''s white figure edge; set color=PAGE_BG.'
  - 'CQ-01 (code): the Data block (lines 36–132) reads the theme token IMPRINT, ends
