    intersections → one df with column constants, drawing tables derived from it below
    the block. Likely cause: styling and geometry written inside the data section.'
  - 'CQ-04 (code): line 33 comments the Imprint colours as the "Okabe-Ito palette"
    → name it Imprint. Likely cause: a stale comment.'
  - 'Suggestion: derive the region counts from the inclusive sizes in code instead
    of typing them in the region_counts dict.'
