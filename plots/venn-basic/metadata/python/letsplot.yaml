review:
  strengths:
  - 'Area-proportional layout: radii follow the inclusive set sizes and centre distances
    are solved so each pairwise lens area matches its intersection'
  - Region counts placed at each region's most interior point and set names pushed
    radially outward, so no text touches an outline
  - 'Theme tokens threaded through title, labels and outlines: both renders fully
    readable, Imprint colors identical across themes'
  - 'Clean lets-plot grammar: geom_polygon circles, scale_fill_manual, coord_fixed
    with data-derived limits, theme_void'
  weaknesses:
  - 'CQ-01 (code): three helper functions (lens_area, distance_for_overlap, pair_size)
    break the Imports → Data → Plot → Save structure → inline the lens-area and overlap-distance
    solve at module level (for example scipy.optimize.brentq on an inline lens-area
    expression) and the pair sums as a comprehension. Likely cause: geometry factored
    into def blocks.'
  - 'Suggestion: the 9-line bisection in distance_for_overlap could be one scipy.optimize.brentq
    call.'
  - 'Suggestion: geom_text sizes 7 and 8 (mm) put the set names at about 23 pt, above
    the 18 pt title; sizes near 6 would keep the title on top of the hierarchy.'
