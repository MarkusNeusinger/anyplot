      Data: Single brand-green (#009E73) line with circular markers at each of the 10 k values, descending sharply from k=1 to k=4 then flattening; the k=4 point is highlighted with an open (hollow) marker with a green stroke, plus a thin dashed vertical guide line at k=4.
