      Chrome: Same title, axis labels, and tick labels now rendered in light ink/grey tones, clearly visible against the dark background; gridlines are a subtle light grey, visible but unobtrusive.
      Data: The line, markers, and elbow highlight use the identical brand-green (#009E73) as the light render — confirmed unchanged; only the chrome (background, text, grid) flipped to dark-theme tokens.
      Legibility verdict: PASS — no dark-on-dark issues; all title/axis/tick text is clearly visible against the near-black background, and the green data series reads well on both surfaces.
