review:
  strengths:
  - 'Theme-adaptive chrome is correctly threaded through: backgrounds match the style-guide
    targets (#FAF8F1 light / #1A1A17 dark) exactly, and the brand-green data color
    is identical between renders — only chrome flips.'
  - The elbow at k=4 is called out with an outlined marker (open circle, brand-color
    stroke) plus a subtle dashed vertical guide line, giving the chart a genuine focal
    point and satisfying the spec's 'highlight the optimal k value' note.
  - Axis labels are fully descriptive with units ('Inertia (Within-Cluster Sum of
    Squares)', 'Number of Clusters (k)'), and the canvas is clean with no overlap,
    clipping, or overflow in either theme.
  - 'Deterministic, realistic data: seeded RNG, a plausible exponential-decay inertia
    curve for a customer-segmentation use case, with light noise for realism.'
  weaknesses:
  - No distinctive Makie-specific feature is showcased beyond standard scatter!/lines!/vlines!
    recipes — e.g. a text! annotation labeling 'k=4 (optimal)' directly on the plot
    would both raise library mastery and remove the need for the reader to cross-reference
    the x-axis.
  - Color usage is limited to the single mandated brand green plus neutral ink tones;
    no secondary Imprint accent is used anywhere (e.g. the dashed guide line could
    use a distinct hue) to add further visual sophistication beyond the compliant
    baseline.
  image_description: |-
