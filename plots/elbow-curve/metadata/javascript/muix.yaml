review:
  strengths:
  - The elbow is computed from the data (the point farthest from the chord between
    the first and last k, both axes normalised), not hard-coded, and lands at k =
    4 with correct derived drops (79% and 58%) quoted in the subtitle
  - 'Optimal k is highlighted at the curve''s own point: a larger filled marker with
    an ink outline plus a dashed vertical guide that stops just above the marker and
    a bold ''Elbow at k = 4'' label, readable in both themes'
  - Hollow page-filled markers at every tested k on a monotoneX line (no overshoot
    past the data) give discrete k values clear presence while the curve stays continuous
  - 'Idiomatic MUI X v9 composition: a child component reads useXScale/useYScale/useDrawingArea
    to draw the guide in chart coordinates, and per-series sx selectors ([data-series=...])
    style line, area and marks'
  - Integer x ticks (tickMinStep 1, toFixed formatter), y axis from 0 with thousands
    separators, theme tokens threaded through every chrome element; the HTML output
    keeps MUI's native tooltip
  weaknesses:
  - 'Suggestion: the subtitle runs to about 70% of the width and repeats the chord-distance
    method in prose; a shorter ''elbow at k = 4 · inertia −79% up to it, −58% after''
    would read faster in the thumbnail.'
  - 'Suggestion: the ''Elbow at k = 4'' label could sit next to the highlighted marker
    rather than at the top of the guide, so the eye does not travel the full plot
    height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white box behind the chart.
      Chrome: bold dark title "elbow-curve · javascript · muix · anyplot.ai" top-left (~30% width), grey subtitle with k range, elbow and percentage drops; y axis "Inertia (within-cluster sum of squares)" 0–1,300 with thousands separators; x axis "Number of clusters (k)" with integer ticks 1–10; subtle horizontal grid; all text dark and readable.
      Data: #009E73 line (monotone) with hollow page-filled circular markers at k = 1..10, faint green area under the curve; k = 4 drawn as a larger solid green marker with dark outline, dashed ink-soft vertical guide from the top to the marker, bold label "Elbow at k = 4" at the top. Curve falls steeply 1250→260 then gently to 108.
