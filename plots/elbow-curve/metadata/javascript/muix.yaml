review:
  strengths:
  - Correct elbow-curve chart with a dashed reference line and 'Elbow · k=4' label
    directly satisfying the spec's suggestion to annotate the optimal k
  - 'Both renders are legible and theme-correct: dark ink on the warm off-white light
    background, light ink on the warm near-black dark background, identical brand-green
    data color across themes'
  - Documented, deliberate workaround for MUI X's yAxis label-offset limitation (custom
    rotated label element) instead of letting the axis title collide with wide tick
    numbers
  - Idiomatic use of the MUI X-distinctive ChartsReferenceLine component for the elbow
    annotation instead of a hand-drawn overlay
  weaknesses:
  - 'Design excellence is modest: beyond the single brand-green line and amber reference
    line, there''s no distinguishing color/visual treatment (e.g. a subtle area fill
    under the curve, or marker emphasis at the elbow point) to lift it past a competent-but-plain
    default look'
  - curve is set to 'linear' (straight segments between points); the spec notes 'a
    smooth connecting line helps visualize the curve shape' — consider a monotone/smooth
    curve interpolation to make the diminishing-returns shape read more naturally
  - The 'Elbow · k=4' label sits directly on the dashed reference line with no background
    plate, so its contrast against the horizontal gridlines it crosses is slightly
    lower than the rest of the chrome — a small background chip or offset would improve
    legibility further
  - Legend is hidden entirely; for a single-series chart this is acceptable, but the
    y-axis title 'Inertia (WCSS)' is the only place the metric name appears — a discoverable
    series label (even via tooltip-accessible legend) would reinforce what the line
    represents
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "elbow-curve · javascript · muix · anyplot.ai" top-left in dark ink, clearly readable. X-axis title "Number of Clusters (k)" and rotated Y-axis title "Inertia (WCSS)" both dark ink, legible. Tick labels (1-10 on x, 100-1,300 on y) in a slightly softer dark gray, all readable. Subtle horizontal gridlines only, not dominant.
      Data: Single line series in brand green (#009E73-like) with open-circle markers at each of the 10 k-values, clearly visible against the light background. Dashed amber vertical reference line at k=4 with "Elbow · k=4" label in soft dark text, readable though it sits directly on the dashed line with no background plate.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light ink, clearly readable against the dark background. Tick labels in a softer light gray, legible. Gridlines subtle but visible.
      Data: Line/marker color is identical brand green to the light render — confirmed unchanged across themes. Amber dashed reference line and its "Elbow · k=4" label are both visible and legible on the dark surface; no dark-on-dark failures observed anywhere (title, axis titles, and tick labels are all light text, not dark).
      Legibility verdict: PASS
