review:
  strengths:
  - 'First series uses brand green #009E73, and data colors (line green, elbow-highlight
    blue) are pixel-identical between light and dark renders — only chrome flips,
    exactly per the Imprint theme-adaptive contract.'
  - 'The elbow point at k=4 is clearly emphasized: larger marker, distinct accent
    color (palette[2] blue), a dashed vertical guide line, and a direct ''Elbow ·
    k = 4'' label — this creates a genuine focal point and guides the reader straight
    to the answer, which is strong data storytelling for a diagnostic chart.'
  - Marker size (14px, 22px for the elbow) is appropriately prominent for the sparse
    10-point series, matching the data-density heuristic.
  - 'Clean chrome: y-axis line hidden, only subtle horizontal gridlines, no chart
    junk, generous margins with nothing clipped at any canvas edge in either render.'
  - Realistic, neutral dataset (RFM-based customer segmentation inertia curve across
    k=1..10) with a textbook elbow shape at k=4 and plausible magnitude.
  - 'Correct ECharts mount-node contract: echarts.init() with no explicit size/devicePixelRatio,
    animation:false, single chart instance on #container.'
  weaknesses:
  - 'No tooltip configuration is set on the option — hovering points in the interactive
    HTML output surfaces no exact k/inertia values, missing the main value-add an
    interactive JS library brings beyond the static PNG. Add a tooltip (e.g. `tooltip:
    { trigger: ''axis'' }` or an item-trigger formatter showing ''k = {k}, inertia
    = {value}'') to leverage echarts'' distinctive interactivity.'
  - 'The specification notes ''a smooth connecting line helps visualize the curve
    shape'', but the line series uses straight segments (no `smooth` option set).
    Consider `smooth: 0.2`–`0.3` on the line series for a closer match to the spec''s
    guidance, while checking it doesn''t distort the sharp early-k drop.'
  - There is a fairly large empty margin between the title and the first (21,000)
    gridline, leaving the 'Elbow · k = 4' annotation floating alone in otherwise empty
    space — reducing `grid.top` slightly or nudging the label closer to the marker
    would tighten the visual balance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "elbow-curve · javascript · echarts · anyplot.ai" centered top in dark ink, clearly legible. Y-axis title "Inertia (within-cluster sum of squares)" rotated along the left edge, dark ink, fully visible and not clipped. X-axis title "Number of Clusters (k)" below the axis, dark ink. Tick labels on both axes in a softer gray, all legible. Horizontal-only gridlines are subtle and don't compete with the data. Y-axis line is hidden; x-axis baseline is a thin soft-gray line.
      Data: Line and 9 of 10 markers are brand green (#009E73); the k=4 point is enlarged and colored blue (Imprint palette position 3) with a light-colored ring border, sitting on a dashed vertical guide line labeled "Elbow · k = 4" in dark ink above the point. The curve shows the expected sharp early drop flattening out — classic elbow shape.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light ink/gray and remain fully legible against the dark background. The dashed elbow guide line and its "Elbow · k = 4" label are now light-colored and stand out against the dark backdrop. Gridlines remain subtle but visible.
      Data: Line/marker colors are identical to the light render — brand green line and markers, blue elbow-point accent — confirming only chrome adapted to theme, not data colors.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and the elbow annotation remain clearly readable.
