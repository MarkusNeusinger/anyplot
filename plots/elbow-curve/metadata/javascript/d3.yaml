      Data: Brand-green (#009E73) line (curveMonotoneX) and circular markers for k=1..10, with the k=4 point enlarged, ringed by a subtle non-colored ink halo, connected to the x-axis by a thin dashed guide line, and labeled with a small-caps "OPTIMAL CLUSTER COUNT" over a bold "k = 4" — no amber or other semantic color is used for the highlight. First/only series correctly uses the brand green.
