review:
  strengths:
  - 'Excellent data storytelling: the optimal k=4 is immediately clear via a larger
    marker, distinct amber-vs-green color contrast, a dashed guide line to the x-axis,
    and a text annotation — directly fulfilling the spec''s note to highlight the
    optimal k value.'
  - 'Fully theme-adaptive chrome: axis text, ticks, domain lines, and gridlines all
    pull from window.ANYPLOT_TOKENS, and both renders stay legible with an identical
    brand-green data line across themes.'
  - 'Sparse-data-appropriate sizing: markers (r=7, r=11 for the elbow) and a 3.5px
    connecting line are prominent and well-suited to the 10-point dataset, following
    the data-density heuristic.'
  - Realistic, neutral business scenario (customer segmentation inertia) with well-scaled,
    monotonically appropriate values and a clean, KISS-structured script.
  weaknesses:
  - 'The elbow-point marker and its annotation use the amber semantic anchor (t.amber
    / #DDCC77), which the style guide reserves for warning/caution roles — but ''Optimal
    k = 4'' is a positive/informational callout, not a warning. Prefer a non-semantic
    highlight (e.g., a larger brand-green marker with a white/pageBg stroke, or the
    neutral ink token already used for the dashed guide line) instead of repurposing
    amber.'
  - Design excellence is solid but relies mostly on token defaults for typography
    and grid styling rather than a more deliberate custom hierarchy — push refinement
    further (e.g., slightly thinner guide line, more considered annotation typography)
    to reach publication-grade polish.
  - Library Mastery is correct and idiomatic (scales, axis generators, data-join,
    line generator) but doesn't yet showcase a feature that's genuinely hard to replicate
    in another charting library — consider a d3-specific touch such as curve interpolation
    (`d3.curveMonotoneX`) or a d3-only layout/behavior.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "elbow-curve · javascript · d3 · anyplot.ai" in bold dark ink, clearly readable; x-axis label "Number of Clusters (k)" and y-axis label "Inertia (Within-Cluster Sum of Squares)" in dark ink, both legible; tick labels (1-10 on x, 0-8,000 on y) in soft dark gray, clearly visible; subtle horizontal gridlines aligned to y-ticks; thin dark L-shaped axis lines.
      Data: Brand-green (#009E73) line and circular markers for k=1..10, with the k=4 point enlarged and filled amber, connected to the x-axis by a dashed guide line, and labeled "Optimal k = 4" in bold dark text. First/only series correctly uses the brand green.
      Legibility verdict: PASS — all text is dark-on-light and fully readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light (white/soft-light) text, clearly visible against the dark background; gridlines are subtle light hairlines; axis domain lines are light-toned.
      Data: Same brand-green (#009E73) line and markers as the light render, with the same amber-highlighted k=4 point, dashed guide line, and "Optimal k = 4" annotation now in light text — data colors are identical between the two renders, confirming only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick text is clearly legible against the near-black surface, and the brand green and amber both remain visible.
