review:
  strengths:
  - 'Correct plot type: line chart with prominent markers at each discrete k value,
    matching elbow-curve convention.'
  - Explicitly highlights the optimal k=4 point via a second overlay dataset with
    a larger, distinctly colored ring marker and its own legend entry — directly satisfies
    the spec's suggestion to annotate/highlight the elbow.
  - 'Realistic, well-shaped data: customer-segmentation K-means inertia values decrease
    steeply through k=1..4 then flatten sharply, producing a genuine, legible elbow.'
  - 'Correct Imprint palette usage (brand green #009E73 first series, lavender highlight
    series), theme-adaptive chrome, deterministic in-memory data, and full compliance
    with the Chart.js mount-node contract (animation: false, no fixed canvas size).'
  - Descriptive axis titles with units ("Inertia (Within-Cluster Sum of Squares)",
    "Number of Clusters (k)").
  weaknesses:
  - Grid lines are drawn on both x and y axes for a line chart; the style guide's
    Grid Guidelines say line/bar charts should use y-axis-only grid — consider dropping
    the vertical gridlines for a cleaner look.
  - Styling stays close to Chart.js + token defaults beyond the highlight trick —
    no deeper Design Excellence touches (e.g. a subtle area fill under the curve,
    or segment-based dash/opacity change after the elbow to visually reinforce 'diminishing
    returns').
  - Library Mastery is underused beyond the overlay-dataset trick — e.g. Chart.js
    `segment` styling (color/dash the line differently before vs. after k=4) would
    showcase a more distinctive Chart.js capability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "elbow-curve · javascript · chartjs · anyplot.ai" in dark ink, centered top. Legend below title with two entries ("Inertia" green dot, "Optimal k = 4" purple dot). X-axis title "Number of Clusters (k)" and Y-axis title "Inertia (Within-Cluster Sum of Squares)" both in dark ink. Tick labels (1-10 on x; 0-1,000 on y) in a slightly softer gray. Subtle light-gray gridlines on both axes.
      Data: Single decreasing curve in brand green (#009E73) with filled green circle markers at each k=1..10, monotone-interpolated. At k=4 an additional larger ring marker in lavender/purple overlays the green point, clearly calling out the optimal k.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, legend, axis titles and tick labels all rendered in light ink/off-white and soft light-gray, clearly visible against the dark background. Gridlines are faint and light-toned, subtle but visible.
      Data: Identical brand-green curve and markers, identical lavender highlight ring at k=4 — data colors match the light render exactly; only chrome (background/text/grid) flips.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (including tick labels) is clearly legible against the dark background.
