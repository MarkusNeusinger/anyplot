  strengths:
  - 'Both previous-attempt weaknesses were fixed precisely: x-axis gridlines removed
    (now y-axis-only, matching the style guide) and segment styling added to dash/mute
    the post-elbow line, directly showcasing a distinctive Chart.js capability.'
  - 'Correct plot type and full spec coverage: line chart with prominent markers at
    each discrete k, monotone-interpolated curve, and an explicit optimal-k=4 highlight
    via a second overlay dataset.'
