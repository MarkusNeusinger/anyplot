    theme-adaptive chrome, and data colors identical between light and dark renders.'
  - Realistic, well-shaped customer-segmentation K-means data with a genuine, legible
    elbow at k=4.
  weaknesses:
  - Styling is still close to Chart.js + token defaults outside the segment/highlight
    tricks - an area fill under the curve or subtler marker refinement could push
    Design Excellence further.
  - Legend swatch for "Optimal k = 4" is a plain circle; since the plotted marker
    is a ring (colored border with page-background fill), a matching ring-style legend
    point would visually tie the two together more precisely.
