review:
  strengths:
  - 'The elbow is computed from the data (largest ratio of the drop before k to the
    drop after it), so the highlight, the dashed line and the ''Elbow: k = 4'' label
    follow the user''s own inertia table instead of a hard-coded k'
  - Hollow markers filled with the page color (shape=21, fill=PAGE_BG) mark every
    tested k clearly on the line in both themes, and the larger Imprint position-2
    diamond picks out the elbow at its own inertia value
  - Integer x breaks taken from the data (scale_x_continuous(breaks=df[K].tolist()))
    and a y axis from 0 make the steep-then-gentle fall readable at true proportions
  - 'Idiomatic grammar-of-graphics layering: the highlight layers take their own data=
    subset, and the vline''s xintercept is mapped from that subset; the HTML export
    adds lets-plot''s native hover tooltips'
  weaknesses:
  - 'DE-02 (both): the major grid is drawn at full INK opacity on both axes, which
    reads as a high-contrast black (light) or near-white (dark) mesh competing with
    the curve, and the panel has a four-sided frame where nothing requires one → grid
    at about 15 % INK opacity (y-axis only would suit a line chart), only the left
    and bottom axis lines. Likely cause: panel_grid_major=element_line(color=INK,
    size=0.2) without alpha, plus the frame drawn around the panel.'
  - 'Suggestion: the if/else repeats geom_line and geom_point in both branches; adding
    the line and the markers once and only the highlight layers conditionally would
    shorten the plot block.'
  - 'Suggestion: the ''Elbow: k = 4'' label could sit slightly closer to its diamond
    so the label and the point read as one unit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel, 3200x1800.
      Chrome: bold title "elbow-curve · python · letsplot · anyplot.ai" top left (~48 % of width), x title "Number of Clusters (k)", y title "Inertia (Within-Cluster Sum of Squares)", ticks 1-10 and 0-12,000 in INK_SOFT; all dark text, clearly readable. Grid lines on both axes in full-strength dark INK, fairly prominent; a four-sided panel frame.
      Data: #009E73 line through 10 hollow green markers (page-colored fill) from 12,500 at k=1 to 1,080 at k=10, steep fall to k=4 then gentle. Elbow at k=4: purple #C475FD diamond on the curve point, purple dashed vertical line, bold dark label "Elbow: k = 4" to its upper right, clear of the line and the curve.
      Legibility verdict: PASS

