  - Custom hovertemplates for the interactive HTML view
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2700, not a canonical size → 3200x1800 (−1600
    × −900). Likely cause: write_image(width=1600, height=900, scale=3) instead of
    width=800, height=450, scale=4.'
  - 'SC-04 (both): the title reads ''elbow-curve · plotly · anyplot.ai'' without the
    language segment → ''elbow-curve · python · plotly · anyplot.ai''. Likely cause:
    the title text.'
  - 'DQ-01 (both): inertia decays at a near-constant ratio (5000 → 3890 → 3050 → 2400
    → 1830 …) with no visible bend between a steep and a gentle part → data whose
    drop flattens clearly after the true cluster count. Likely cause: the formula
    5000·exp(−0.25(k−1)).'
  - 'DQ-02 (both): the inertia values are an invented exponential with noise, not
    the output of any clustering → KMeans.inertia_ computed on generated data. Likely
    cause: the simulated base_inertia formula.'
  - 'DQ-03 (both): the elbow is a typed constant k=4 at a point where the decay rate
    does not change (ratio about 0.78 throughout) → an elbow computed from the data
    at the bend. Likely cause: optimal_k = 4.'
  - 'CQ-01 (code): line 23 opens the Data block with no column-0 # Plot marker after
    it → one block between column-0 # Data and # Plot markers that ends by binding
    df, with no plotting, styling or theme token inside and no plotting call above
    it. Likely cause: the plot code is not separated from the data generation.'
  - 'CQ-01 (code): has no column constant for the required roles `k_values`, `inertia`
    → one string constant per required column role above the Data block, each with
    a trailing # role: <role> comment naming a spec role. Likely cause: column names
    are typed where they are used instead of once, above the block.'
