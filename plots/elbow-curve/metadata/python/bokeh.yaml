  weaknesses:
  - 'DQ-03 (both): inertia rises from about 240 at k=8 to about 250 at k=9, an upturn
    a k-means inertia curve does not show → non-increasing values after the elbow
    (delta about −10 or more at k=9). Likely cause: the post-elbow recurrence `inertia_values[-1]
    * 0.85 + np.random.uniform(20, 50)` converges to ~200-330 and lets the noise term
    push a value above its predecessor.'
  - 'Suggestion: legend glyph dots render far smaller than the 22 px and 38 px data
    markers; glyph sizes closer to the marks would echo the encoding.'
