review:
  strengths:
  - Elbow k is computed from the data (largest distance to the chord between the first
    and last points), so the highlight follows the data
  - Per-point value dict with a 'label' gives the elbow a named tooltip in the interactive
    HTML output
  - Theme tokens go through pygal's Style object, so chrome flips correctly between
    light and dark while the data colors stay identical
  - Marker and line weights suit the 10 sparse points; the elbow marker is clearly
    emphasised
  weaknesses:
  - 'VQ-05 (both): the y-axis title ''Inertia (Within-cluster Sum of Squares)'' wraps
    onto two lines, and the 0 and 5000 y ticks render at 44 px next to 56 px for 1000-4000
    → one-line y title and one tick size on the axis. Likely cause: the long INERTIA
    column name at label_font_size=56, and pygal drawing major ticks with major_label_font_size=44
    while the others use label_font_size=56.'
  - 'VQ-07 (dark): the horizontal y grid lines are almost invisible on #1A1A17 → subtle
    but visible grid (an INK_MUTED-toned guide). Likely cause: pygal''s guide-line
    stroke is not threaded from a theme token visible on the dark surface; set it
    through Style (for example guide_stroke_color=INK_MUTED).'
  - 'Suggestion: a value label next to the elbow marker (for example ''k = 4'') would
    name the optimal k in the static PNG, not only in the HTML tooltip.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'elbow-curve · python · pygal · anyplot.ai' centred in dark ink; x title 'Number of Clusters (k)', y title 'Inertia (Within-cluster Sum of Squares)' wrapped onto two lines; x ticks 1-10, y ticks 0-5000 (0 and 5000 smaller than the rest); dotted y grid visible but subtle.
      Data: #009E73 line with dots at k = 1..10 falling from 5200 to 350, soft bend at k=4; elbow at k=4 marked by a larger #C475FD dot.
      Legibility verdict: PASS

