review:
  strengths:
  - Kneedle-style elbow detection (normalized min-max distance to the chord) is computed
    cleanly and correctly identifies k=4 as the elbow, then highlights that exact
    point with an outlined marker and a text annotation naming it
  - 'Imprint palette compliance is perfect: first series is #009E73, identical in
    both renders, and page background/text/grid all flip correctly between #FAF8F1
    (light) and #1A1A17 (dark) with no dark-on-dark or light-on-light issues'
  - 'Deliberate chrome refinement beyond theme_minimal defaults: vertical gridlines
    removed, axis ticks removed while tick labels remain, dashed reference line at
    the elbow k adds a clear focal point'
  - Title format is exactly correct ("elbow-curve · r · ggplot2 · anyplot.ai") and
    both axis labels are descriptive with clear units/context ("Number of Clusters
    (k)", "Inertia (Within-Cluster Sum of Squares)")
  - Canvas is exactly 3200×1800 with no clipped or cut-off elements in either render
  weaknesses:
  - '`library(dplyr)` is imported but never used anywhere in the code (data frame
    is built with `tibble::tibble` and indexed with base-R `df[elbow_idx, ]`, no dplyr
    verb or pipe appears) — drop the import'
  - Title occupies only ~35-40% of plot width at the default 12pt fontsize — well
    below the 50-70% comfortable range for a short spec-id like this one; consider
    bumping plot.title fontsize a couple points since the mandated title here is much
    shorter than the ~67-char reference string the 12pt default was calibrated for
  - Ordinary (non-elbow) point markers at size=2.5 are a bit modest for only 10 sparse
    data points — bump geom_point size slightly (e.g. 3.5-4) for more prominence per
    the sparse-data sizing heuristic
  - 'Design excellence is solid but not yet publication-tier: consider one more visual-hierarchy
    device (e.g. de-emphasizing/lightening the line+markers after the elbow with reduced
    alpha, or shading the pre-elbow region) to sharpen the ''diminishing returns''
    story further'
  - Library Mastery is generic ggplot2 usage (geom_line/geom_point/annotate) — consider
    a more distinctive ggplot2-only touch (e.g. geom_ribbon shading the post-elbow
    plateau, or scale_x_continuous minor breaks) to raise LM-02 beyond baseline
