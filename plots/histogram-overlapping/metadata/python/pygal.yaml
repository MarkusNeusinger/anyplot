  strengths:
  - 'Accurate Imprint palette usage: first series is brand green #009E73 (Control),
    second series is lavender #C475FD (Treatment); backgrounds and all chrome (title,
    axis text, gridlines) are correctly theme-adaptive in both renders'
  - Semi-transparent alpha (0.55) sits right inside the spec's recommended 0.4-0.6
