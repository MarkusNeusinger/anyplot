review:
  strengths:
  - 'Correct overlapping-histogram technique: shared bin edges via np.histogram_bin_edges()
    across all three groups, alpha=0.55 transparency, and a subtle background-colored
    bar edge that keeps overlap regions legible'
  - Full theme-adaptive chrome (background, ink, grid, legend) correctly threaded
    through sns.set_theme rc params for both light and dark renders
  - Imprint palette used in canonical order with Engineering correctly as the first
    series (#009E73)
  - Clean KISS code structure (imports -> data -> plot -> save), reproducible via
    np.random.seed(42), and correct canvas save (no bbox_inches='tight', exact 3200x1800
    landscape)
  - Realistic, neutral data scenario (employee response times by department) with
    plausible scale
  weaknesses:
  - 'Library mastery: calls sns.histplot() three separate times with manually chosen
    colors/labels instead of seaborn''s idiomatic long-form hue-based grouping for
    exactly this use case. Fix: build one long-form DataFrame with ''group'' and ''values''
    columns and call a single sns.histplot(data=df, x=''values'', hue=''group'', multiple=''layer'',
    palette=IMPRINT[:3]) — this is seaborn''s recommended pattern for overlapping-by-group
    histograms and yields a cleaner, auto-generated legend.'
  - 'Design Excellence is at library-default level: no visual hierarchy or storytelling
    element (e.g. an annotation or emphasis marking which department is fastest/slowest)
    guides the viewer to an insight beyond the raw overlapping bars.'
  - All three distributions are symmetric normal curves differing only in mean/spread;
    the spec explicitly calls out revealing differences in 'central tendency, spread,
    and shape' but shape is identical across groups. Consider giving one distribution
    mild skew to more fully demonstrate the technique.
  - The Marketing distribution's long right tail (isolated sparse bar near 900ms,
    mostly-empty gap from ~650-880ms) stretches the x-axis and wastes horizontal space
    while compressing bin resolution in the main 300-650ms comparison zone. Consider
    tightening distribution parameters or reducing the tail's extremity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target, not pure white.
      Chrome: Bold black title "histogram-overlapping · python · seaborn · anyplot.ai" centered at top, spanning ~77% of plot width (expected range for the mandated title format). X-axis label "Response Time (ms)" and y-axis label "Count" in dark ink, tick labels in softer gray. Subtle horizontal gridlines only. Legend box (cream fill, dark border) in the upper right with three swatches: Engineering (green), Marketing (lavender), Sales (blue).
      Data: Three overlapping semi-transparent histograms sharing 25 aligned bins across ~200-900ms. First series (Engineering) is #009E73 green, second (Marketing) is #C475FD lavender, third (Sales) is #4467A3 blue — matches Imprint canonical order. Overlap regions blend into visually distinct teal/violet tones, still readable which group dominates each bin.
      Legibility verdict: PASS - all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target, not pure black.
      Chrome: Title, axis labels, and tick labels rendered in light ink (white/light-gray), fully legible against the dark surface. Gridlines remain subtle. Legend box uses the dark elevated fill with a light border and light text, readable.
      Data: Same three colors as the light render (#009E73 green, #C475FD lavender, #4467A3 blue) — confirmed identical, only chrome flipped. Overlap blending is still visually distinct.
      Legibility verdict: PASS - no dark-on-dark failures observed; brand green remains clearly visible.
