review:
  strengths:
  - 'Imprint palette applied in exact canonical order across all three groups: Engineering=#009E73
    (position 1, brand green, correct), Marketing=#C475FD (position 2), Sales=#4467A3
    (position 3) — identical hues in both light and dark renders, only chrome flips'
  - Semi-transparent stepfilled histograms (alpha=0.5, matching the spec's recommended
    0.4-0.6 range) with a solid edgecolor stroke per group keep each distribution's
    silhouette legible even where fills stack
  - Shared bin edges (single `bins = np.linspace(20000, 150000, 35)` array reused
    for all three `ax.hist()` calls) give an accurate, directly-comparable overlay
    per the spec's alignment requirement
  - Dotted mean-reference lines (`ax.axvline`) per group add a lightweight storytelling
    layer that highlights the central-tendency shift between departments without cluttering
    the chart
  - 'Clean, reproducible KISS-structured code: explicit np.random.seed(42), only used
    imports, theme-adaptive tokens threaded through title/labels/ticks/spines/grid/legend
    for both themes'
  - Title format is exactly correct and comfortably proportioned (~50% of canvas width),
    axis labels are descriptive with units on the value axis, custom thousands-separator
    tick formatter on the x-axis
  weaknesses:
  - Grid is drawn on both axes (`ax.grid(True, alpha=0.15, ...)`) instead of the style-guide-preferred
    y-axis-only grid for bar/histogram-style charts — the vertical gridlines add clutter
    without adding comparative value on a histogram; switch to `ax.yaxis.grid(True,
    alpha=0.15, linewidth=0.8, color=INK)` and leave the x-axis grid off
  - Triple-overlap regions (roughly 60k-90k, where Sales/Marketing/Engineering all
    stack) blend into a muddy blue-purple-green mix that makes it hard to attribute
    the exact shade to one specific group at a glance — consider slightly lower alpha
    (e.g. 0.4) or drawing the outlines with higher linewidth/opacity so edges stay
    distinguishable even where fills overlap three deep
  - 'Design Excellence is still close to ''well-configured default'': the mean-line
    technique is a nice touch but there''s no explicit data-driven callout (e.g.,
    annotating the largest salary gap or labeling the mean lines) that would push
    Data Storytelling further — consider a small text annotation calling out the Engineering-vs-Sales
    mean gap'
  - All three synthetic distributions are simple unimodal Gaussians with no shape
    variation (only mean/spread differ) — the spec explicitly calls out comparing
    'central tendency, spread, AND shape'; introducing mild skew or a secondary mode
    in one group (e.g., Sales, given its stated high commission variance) would better
    demonstrate the shape-comparison use case
  - 'Library Mastery is generic-to-moderate: `histtype=''stepfilled''` + `axvline`
    are matplotlib-idiomatic but not highly distinctive — consider leveraging a more
    matplotlib-specific technique (e.g. `ax.annotate` for direct mean labels, or a
    small inset/twin axis showing a KDE overlay) to differentiate from what a similarly-coded
    plot in another library could produce'
