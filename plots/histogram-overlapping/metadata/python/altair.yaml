review:
  strengths:
  - Bin edges are correctly aligned across all three departments via a single shared
    bin encoding (alt.Bin(maxbins=24)), satisfying the spec's core requirement for
    accurate cross-group comparison.
  - Adds dashed per-department mean-rule lines using Altair's inline `mean(...)` aggregate
    encoding shorthand -- a distinctive declarative feature that gives the chart a
    clear data-storytelling focal point for comparing central tendency at a glance.
  - 'Palette and theme tokens are correctly applied: Engineering maps to #009E73 (Imprint
    position 1), background/chrome flips correctly between light and dark, and the
    canvas lands exactly at 3200x1800 with no cropping or edge clipping.'
  - 'Clean, idiomatic single-purpose script: no functions/classes, seeded RNG for
    reproducibility, only necessary imports, and layer-composition used purposefully
    rather than gratuitously.'
  weaknesses:
  - With three semi-transparent series overlapping heavily in the 200-450ms range,
    blended colors (green+blue, blue+purple) create intermediate hues that make it
    hard to attribute an overlap region to a specific pair of departments without
    checking the legend -- consider per-category stroke colors instead of a uniform
    PAGE_BG stroke to help disambiguate overlap boundaries.
  - Tick label font size (10pt at labelFontSize) is on the small side relative to
    the 4x-scaled 3200px canvas; verify legibility once the site's 400px thumbnail
    renders, since 10pt tick text scales down considerably.
  - Library usage is solid but conventional beyond the mean-rule layering -- no use
    of Altair-only capabilities like faceting, selection params, or transform_density
    that would further differentiate it from a generic grammar-of-graphics rendering.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold dark title "histogram-overlapping · python · altair · anyplot.ai" centered at top, clearly readable. X-axis title "Response Time (ms)" and Y-axis title "Frequency" both in dark ink, fully legible. Tick labels in medium-grey ink, readable. Legend box top-right with "Department" title and three swatches (Engineering, Sales, Support) on a light elevated background with dark text.
      Data: Three overlapping semi-transparent histogram series -- Engineering (#009E73 green), Sales (#C475FD lavender/purple), Support (#4467A3 blue) -- with dashed vertical mean-rules in matching colors. Bin edges are shared/aligned across all three groups. Overlap regions blend into intermediate hues (teal, muted violet) but remain visually distinguishable from single-series regions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title renders in near-white ink, clearly readable against the dark surface. Axis titles and tick labels render in light grey/near-white, fully legible -- no dark-on-dark issues. Legend box background is a dark elevated tone (~#242420, confirmed via pixel sampling) with light-grey/near-white text, correctly themed rather than left white.
      Data: Same three data colors as the light render (Engineering #009E73, Sales #C475FD, Support #4467A3) with matching mean-rule dashes -- confirmed identical across themes, only chrome flipped.
      Legibility verdict: PASS
