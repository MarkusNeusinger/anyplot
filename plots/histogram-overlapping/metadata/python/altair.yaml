review:
  strengths:
  - Correct Imprint palette order (Engineering=#009E73, Sales=#C475FD, Support=#4467A3),
    consistent between light and dark renders — only chrome flips
  - Single shared x-bin encoding with color faceting guarantees aligned bin edges
    and matching bin widths across all three groups, exactly as the spec's Notes section
    requires
  - 'Distinctive Altair-idiomatic layering: dashed per-department mean rules (alt.layer)
    plus a legend-bound alt.selection_point for interactive isolation, with the empty-selection
    default correctly matching the static PNG''s un-highlighted state'
  - Own-color full-opacity stroke outlines each bar's boundary through the blended
    fill region, letting overlaps stay readable without needing the legend
  - Canvas dimensions on-target (3200x1800 gate passed), theme tokens threaded through
    axis/legend/title configs correctly in both renders
  - 'Clean, reproducible code: single seed, no helper functions, only used imports
    (PIL only for the mandatory canvas pad)'
  weaknesses:
  - '''Response Time (ms)'' modeling how long a human takes to respond to a support
    ticket is an implausible unit/scale — department means of 280-420 ms describe
    network/API latency, not a person answering a ticket (real ticket response times
    run minutes to hours). Rename the metric to something genuinely millisecond-scale
    (e.g. API response latency by service tier) or rescale to a plausible ticket-handling
    unit (minutes/hours).'
  - 'DE-02 visual refinement is solid but not exceptional: the default Altair axis
    domain lines (solid left/bottom border) remain, and legend swatches use a plain
    rectangular box — could be tightened further for a more custom-feeling finish.'
  - The far-right outlier bin (Sales, ~800-850ms) sits isolated with a large empty
    gap from the rest of the distribution — consider whether that lone extreme point
    is adding real signal or just clutter against DQ-01 feature coverage.
