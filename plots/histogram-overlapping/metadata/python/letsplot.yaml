  - Mean-line callouts (dashed vlines + labeled annotations, hjust-aligned away from
    the lines so they never collide) create a clear analytical focal point and quantify
    the group difference directly in the subtitle
  - Custom layer_tooltips with formatted lines (@group, response time, count) is a
    genuine lets-plot-specific touch that adds real value in the interactive HTML
    export
  - 'First categorical series is #009E73 (Control), second is #C475FD (Treatment)
    — correct Imprint palette order, identical data colors across both themes, only
    chrome flips'
  - Realistic, neutral A/B-test scenario (response times, n=200/group) with plausible
    value ranges, reproducible via np.random.seed(42)
  - All font sizes explicitly set (theme + annotation), clean minimal chrome (subtle
    y-only gridlines, thin axis line, no panel border), both renders fully legible
    with no clipping at any canvas edge
  weaknesses:
  - One outlier bin near x=150 sits isolated by a wide empty gap before the main distribution
    resumes around x=220, breaking the visual flow slightly — not incorrect (plausible
    3.75-SD outlier), but a minor polish opportunity
  - X-axis extends to 700 while the rightmost populated bins end around 680, leaving
    a modest sliver of unused space on the right edge
  - Mean-line annotations and the custom tooltip content are solid but transferable
    ggplot2-style techniques rather than something unique to lets-plot beyond the
    interactivity itself — Library Mastery has room to lean further into lets-plot-distinctive
    features
