review:
  strengths:
  - 'Native MUI X overlay: categoryGapRatio 0 with barGapRatio -1 gives every series
    the full band at the same offset, so both histograms rise from one zero baseline
    with contiguous bins and no hand-drawn bars'
  - Shared bin edges come from one nice-step bin width (5) computed over all groups,
    so the bars of both groups cover the same intervals
  - The 55 % alpha is baked into the series colour, so the legend swatches match the
    translucent bars in both themes
  - Theme tokens reach every text element (ink, inkSoft, grid), so both renders are
    fully legible
  - 'Interactive HTML: highlightScope with a global fade isolates one group''s distribution
    on hover'
  weaknesses:
  - 'Suggestion: the mandated title fills only about 35 % of the width at 22 px; about
    26 px would balance it against the full-width plot.'
  - 'Suggestion: the y-axis title sits about 50 px from its tick labels; a narrower
    y-axis band (width about 56) would tighten that gap.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241).
      Chrome: the bold title "histogram-overlapping · javascript · muix · anyplot.ai" sits at top centre over an inkSoft subtitle ("Control group n = 240 · Treatment group n = 240 · shared bin width 5 · dashed lines: group means"). The legend is at top right. The y axis reads "Frequency (count per bin)" with ticks 0–55; the x axis reads "Exam Score (0–100)" with 13 bin labels from 35–40 to 95–100. Subtle horizontal grid lines. All text is dark on light and readable.
      Data: two contiguous histograms from the same zero baseline. Control in #009E73 at about 55 % alpha, treatment in lavender #C475FD at the same alpha, and a blue-violet blend where they overlap. Dashed mean lines in each group colour, labelled "Control group mean 68.8" (left of its line) and "Treatment group mean 75.1" (right of its line). The first series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled 26,26,23).
      Chrome: the title, subtitle, legend text, axis titles, tick labels and mean labels all flip to light ink; the grid is a subtle dark grey. No dark-on-dark text.
      Data: the same palette hexes and alpha as in the light render; the translucent fills look deeper over the dark page (dark green, plum, and a lavender-blue blend). Both groups, the overlap and the dashed mean lines stay clearly visible.
      Legibility verdict: PASS
