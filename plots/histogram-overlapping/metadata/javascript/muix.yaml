review:
  strengths:
  - 'Genuine overlapping histogram, not a stacked bar chart in disguise: barGapRatio=-1
    forces both series'' bars to share the same band position/width (documented with
    a code comment pointing at getBandSize in @mui/x-charts/BarChart/BarPlot), so
    the blended overlap region is real geometric overlap.'
  - Shared bin edges and bin width across both groups exactly as the spec requires
    (binStart/binEnd/binCount computed once from the combined dataset, both countPerBin()
    calls use the same bins).
  - 'Palette compliance: control group uses brand green #009E73 (palette[0]) at 55%
    alpha, treatment group uses lavender #C475FD (palette[1]) at 55% alpha — canonical
    Imprint order, alpha within the spec''s suggested 0.4-0.6 range so overlap stays
    legible.'
  - 'Realistic, neutral data: control ~N(68, 11) vs treatment ~N(76, 9) exam scores,
    clamped to [0, 100] — a plausible A/B-testing scenario with genuinely different
    center and spread, matching the spec''s own example application.'
  - All font sizes explicitly set (title 22px, axis labels 16px, tick labels 13/14px,
    legend 14px); both light and dark renders are fully readable with no clipping,
    overlap, or dark-on-dark/light-on-light failures.
  - Deterministic reproducibility via a tiny fixed-seed LCG (browser has no seeded
    Math.random()).
  weaknesses:
  - 'Design Excellence is at library-default level: grid/spine/typography choices
    don''t go meaningfully beyond a well-configured MUI X default (DE-01=4, DE-02=2).
    Consider a subtle refinement pass — e.g. thinner/lighter grid, tighter legend
    box, or slightly larger title weight for hierarchy.'
  - 'No storytelling emphasis beyond the base overlap encoding (DE-03=2): the two
    distributions are shown correctly but nothing calls out the treatment group''s
    rightward shift (e.g. a light vertical reference line at each group''s mean, or
    a short annotation noting the shift). Score 4+ doesn''t require this, but it would
    meaningfully raise the visual hierarchy here.'
  - Y-axis label 'Exam Score' has no explicit unit or scale hint (e.g. '(0-100)')
    — minor VQ-06 deduction.
  - 'LM-02: the barGapRatio=-1 overlap trick is a clever MUI-specific workaround,
    but the implementation doesn''t otherwise showcase library-distinctive features
    (e.g. valueFormatter, highlightScope, custom tooltip) that would push Library
    Mastery higher.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-overlapping · javascript · muix · anyplot.ai" in dark ink, top-left, ~34% of width. X-axis label "Exam Score" and Y-axis label "Count" in dark ink, both 16px, balanced sizes. Tick labels (13/14px) dark and legible. Subtle horizontal gridlines only. Legend top-right with two swatches ("Control group" green, "Treatment group" lavender), not overlapping any bar. All text clearly readable against the light background.
      Data: 13 side-by-side bins spanning ~35-100 exam score. Control group bars render in brand green #009E73 at ~55% opacity; treatment group bars render in lavender #C475FD at ~55% opacity, drawn at the same x-position/width as the control bars (barGapRatio=-1) so they truly overlap rather than sit side by side. Where both groups have counts, the overlap region shows a blended blue-purple color; where only one group has counts, the pure series color shows through. Control dominates the lower score bins (35-60), treatment dominates the upper bins (85-100), with a wide overlap band in the middle (60-85) — visually consistent with the intended distribution shift.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/off-white, fully legible against the dark background. Gridlines remain subtle. Legend swatches and text are light-colored and readable, in the same top-right position, no overlap with data.
      Data: Same 13 bins, same series colors (#009E73 green, #C475FD lavender) at the same 55% opacity — confirmed identical to the light render; only the chrome (background, text, grid) flipped. Overlap blending reads the same way (blended blue-purple in the shared region).
      Legibility verdict: PASS — no dark-on-dark issues found; all text elements are clearly distinguishable from the near-black background.
