review:
  strengths:
  - 'Correct overlapping-histogram idiom for ECharts: shared bin edges computed once
    across both groups, then rendered as two overlaid bar series using barGap: "-100%"
    / barCategoryGap: "0%" — the standard workaround since ECharts has no native histogram
    type.'
  - Semi-transparent fills (opacity 0.55) on Imprint palette[0] (#009E73) and palette[1]
    (#C475FD) produce a clearly readable overlap region in both themes, matching the
    spec's alpha ~0.4-0.6 guidance.
  - 'Theme chrome fully threaded through tokens (t.ink, t.inkSoft, t.grid) — both
    renders are legible with correct backgrounds (#FAF8F1 / #1A1A17) and identical
    data colors.'
  - 'Clean visual refinement: y-axis line and tick marks hidden, subtle single-axis
    (y-only) gridlines, generous margins — above bare library defaults.'
  - Deterministic, seeded LCG random generator with distinct seeds per group (42 /
    1337) satisfies reproducibility without any external dependency.
  - Title format and legend labels exactly match spec requirements ("histogram-overlapping
    · javascript · echarts · anyplot.ai"; "Control group" / "Treatment group").
  weaknesses:
  - A few Treatment-group samples land above 100 (bin axis runs to ~100-103, visible
    as a small purple bar past the '100' tick) — exam scores above 100 read as factually
    implausible for a standard exam without an explicit extra-credit framing; clip
    or re-seed the generator so both distributions stay within a realistic 0-100 exam
    range.
  - Bars have no edge stroke (itemStyle only sets color+opacity, no borderColor) —
    a subtle white/near-background stroke on each bar would sharpen the overlap boundary
    per the style guide's 'Data Element Styling' guidance, especially useful for the
    dark render where the blended overlap region reads a bit muddy.
  - Design storytelling is present only through the two distributions' natural offset
    (means ~68 vs ~76) — no explicit visual emphasis (e.g., mean/median reference
    lines, annotation of the shift) is used to guide the viewer to the key insight,
    which is the ceiling for Data Storytelling at this stage.
  - Data-generation helper functions (lcg, normalSamples, toHistogram) deviate from
    the strict KISS 'no functions' structure — acceptable given the browser has no
    seeded RNG, but keep an eye on trimming to the minimum necessary.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-overlapping · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible, not clipped. Legend below title with two swatches ("Control group" teal, "Treatment group" lavender), clearly readable. X-axis title "Exam Score" and Y-axis title "Frequency" both in dark ink. Tick labels (39, 42, 45 ... 100 on X; 0, 5, 10 ... 35 on Y) in medium-gray, all legible with no overlap. Y-axis has thin horizontal gridlines only, subtle and non-competing with data.
      Data: Two overlaid, semi-transparent bar "histograms" sharing bin edges. Control group renders in Imprint green (#009E73, opacity ~0.55), peaking around exam score 64-67 with ~31 count. Treatment group renders in Imprint lavender (#C475FD, opacity ~0.55), peaking around exam score 71-74 with ~33 count and shifted right of Control. The overlap region blends into a muted purple-gray that stays visually distinct from both source colors, so the shift between distributions is easy to read directly off the chart.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink/off-white, all clearly visible against the dark surface. Tick labels in light gray, gridlines subtle and visible without dominating. No dark-on-dark text found anywhere in the chart.
      Data: Identical bar shapes and counts to the light render. Control group is still the same Imprint green (#009E73) and Treatment group the same Imprint lavender (#C475FD) — data colors are unchanged between themes, confirming only chrome flipped. The overlap region again forms a distinguishable, slightly darker purple-blue blend that remains readable on the near-black surface.
      Legibility verdict: PASS — all text and data elements remain legible on the dark background; brand green reads well on both surfaces.
