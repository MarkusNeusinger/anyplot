review:
  strengths:
  - 'Composes the calendar from community MUI X primitives: ChartsDataProvider with
    two band axes (53 weeks × 7 weekdays), a custom SVG layer that reads useXScale/useYScale/useZColorScale,
    and the native ContinuousColorLegend fed by the zAxis colorMap. The cell colors
    and the legend share one scale'
  - Days without data are dashed outlined empty cells, matched by a dashed 'No data'
    swatch in the legend, and they stay clearly distinct from low-value days in both
    themes
  - Month labels sit on the week column that holds each month's 1st (Aug lands on
    the week of Tue Aug 1, and the trip gap starts on Fri Aug 4). The first label
    carries the year ('Jan 2023')
  - 'The data tells a believable GitHub-style story: weekday/weekend striping, a release
    spike every 37 days and a 9-day August trip without rows. All of it is computed
    from a seeded LCG'
  - imprint_seq built from t.seq[0]→t.seq[1]; data colors identical in both renders,
    chrome from the ink/inkSoft tokens
  - skipAnimation set; layout sized from window.ANYPLOT_SIZE so the grid fills the
    canvas without empty bands
  weaknesses:
  - 'Suggestion: the color legend labels only its endpoints (1 and 18); a few intermediate
    ticks would make a mid-range cell easier to read back as a value'
  - 'Suggestion: the cells are about 3.5× taller than they are wide; a squarer cell
    with the spare height given to whitespace would read more like a calendar'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "heatmap-calendar · javascript · muix · anyplot.ai" centered at top with a grey subtitle (date range, 356 days with data, 9 without, 2021 in total); month labels Jan 2023 … Dec along the top; weekday labels Mon–Sun on the left; legend at bottom right ("Commits per day", gradient bar 1–18, dashed "No data" swatch). All text dark and readable.
      Data: 53 week columns × 7 weekday rows of rounded cells colored on imprint_seq (#009E73 green → #4467A3 blue); weekends greener (lower), release-day spikes in blue; a lone Sunday Jan 1 cell in the first column; dashed empty cells Aug 4–12. No axis line or grid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, month and weekday labels, and legend text all light ink, clearly readable; no dark-on-dark text. The dashed outlines of the no-data cells flip to light inkSoft and stay visible.
      Data: cell colors identical to the light render; only chrome flips.
      Legibility verdict: PASS
