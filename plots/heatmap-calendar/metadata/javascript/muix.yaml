review:
  strengths:
  - 'Composes the calendar from MUI X primitives: ChartsDataProvider with band x/y
    axes, a continuous zAxis colorMap built from the imprint_seq stops (t.seq), and
    cells drawn through useXScale/useYScale/useZColorScale, so cell positions and
    colors come from the library''s own scales'
  - The native ContinuousColorLegend gives a readable color scale (1 to 18 commits),
    paired with a dashed 'No data' swatch that matches the empty cells
  - The 9-day August gap renders as dashed, unfilled cells that read as missing, not
    as low values, in both themes
  - Month labels sit over the week column containing each month's first day, with
    the year on the first label; weekday labels Mon–Sun come from a native ChartsYAxis
  - 'Theme tokens are applied throughout: ink/inkSoft text and the dashed outline
    flip correctly while data colors stay identical'
  - 'Deterministic LCG data with a believable story: busier weekdays, greener weekends
    as a weekly stripe, periodic release-day spikes'
  weaknesses:
  - 'VQ-05 (both): the grid block is vertically centred under a height cap, leaving
    an empty band of about 130 px (CSS) between the subtitle and the month labels
    and another below the legend, roughly a quarter of the canvas unused → put the
    grid directly below the header (or let it take the free height) so the dead bands
    shrink to under ~40 px. Likely cause: the outer Box with alignItems: "center"
    combined with the MAX_CELL_ASPECT cap on gridH.'
  - 'Suggestion: an intermediate tick or two on the color legend (e.g. 6, 12) would
    make reading a mid-range cell back to a value easier.'
  - 'Suggestion: a slightly lower MAX_CELL_ASPECT would give squarer, more conventional
    calendar cells.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "heatmap-calendar · javascript · muix · anyplot.ai" centred at the top, a grey subtitle with the date range, day counts and total; month labels Jan 2023 … Dec along the top of the grid; weekday labels Mon–Sun on the left; bottom-right legend "Commits per day" with a green→blue gradient bar labelled 1 and 18 plus a dashed "No data" swatch. All text readable.
      Data: 53 week columns × 7 weekday rows of rounded, equal-sized cells colored on imprint_seq (#009E73 → #4467A3); weekends visibly greener (lower), a few blue spike cells; nine dashed, empty cells in early August; ragged first week (only Sunday Jan 1).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, month, weekday and legend text all render in light ink; dashed empty-cell outlines and the legend swatch are light grey and visible. No dark-on-dark text.
      Data: cell colors identical to the light render; only chrome flipped.
      Legibility verdict: PASS
