review:
  strengths:
  - Correct 3200x1800 landscape canvas, both PNGs exactly on target with no clipping
    (AR-09 clean)
  - Theme-adaptive chrome flips correctly between FAF8F1/1A1A17 while the brand-green
    data series (#009E73) stays identical across renders
  - 'Idiomatic Makie GridLayout composition: linked-axis calibration curve + prediction-distribution
    histogram via linkxaxes!/rowsize!/rowgap!, a distinctive library feature'
  - 'All spec-required elements present: diagonal perfect-calibration reference, 10
    equal-width bins, Brier score + ECE annotation, and the optional histogram subplot'
  - Realistic, neutral synthetic scenario (overconfident diagnostic screening classifier)
    with plausible sample size (n=4000) and per-bin counts
  - Clean, reproducible, dependency-light code (Random.seed!(42), no unused imports,
    no functions/classes)
  weaknesses:
  - Calibration panel keeps its vertical x=0.5 gridline visible (hidexdecorations!(...;
    grid=false) only hides labels/ticks, not the grid) while the tick labels themselves
    are hidden on that panel — reads as a slightly stray line since there's no adjacent
    tick to anchor it; consider hiding xgridvisible on ax_cal too, matching how ax_hist
    suppresses its own xgrid
  - Base fontsize=14 is legible at full size but leaves limited margin once scaled
    down to a ~400px mobile preview, given the layout already splits vertical space
    across two stacked panels — could bump titlesize/labelsize slightly or increase
    the row-height ratio for the calibration panel
  - Design Excellence is solid execution of the theme tokens but doesn't go much beyond
    the standard chrome recipe (no custom color emphasis, annotation styling, or hierarchy
    device beyond the diagonal-vs-curve contrast) — a subtle enhancement like shading
    the gap between curve and diagonal, or emphasizing the most-miscalibrated bin,
    would elevate the storytelling further
