review:
  strengths:
  - Data shows a genuine S-shaped miscalibration (over-confident at low probabilities,
    under-confident at high probabilities) instead of a trivial near-diagonal fit,
    exercising the full range of calibration-curve behavior
  - Point size encodes samples-per-bin, adding a meaningful second data dimension
    with a clear labeled legend without cluttering the chart
  - 'Theme-adaptive chrome is fully correct: brand green #009E73 identical in both
    renders, warm off-white/near-black backgrounds, subtle 15%-alpha grid, INK-toned
    diagonal reference line'
  - Subtitle surfaces both Brier score and ECE, exceeding the spec's 'display Brier
    score or ECE' requirement
  - coord_fixed() keeps the 45-degree reference line visually true in the square canvas,
    and title fontsize is computed from title length rather than hardcoded
  weaknesses:
  - Smallest bubbles (tail bins near 0% and 100% predicted probability, ~200 samples)
    are noticeably small and could fade at mobile/thumbnail scale — consider raising
    the scale_size_continuous(range=...) floor from 3 to ~4-5
  - Adjacent bubbles between roughly 55-75% predicted probability overlap slightly
    because of close x-spacing combined with size encoding — a thin white stroke (edgecolor)
    or alpha ~0.85 would separate them more cleanly
  - The spec's optional histogram of the predicted-probability distribution is omitted
    — not required for approval, but would round out the diagnostic view
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "calibration-curve · r · ggplot2 · anyplot.ai" at top, gray subtitle "Brier score 0.165 · ECE 0.082" below it. Dark axis titles "Mean predicted probability" (x) and "Observed fraction of positives" (y), softer-gray percent-formatted tick labels on both axes. Faint horizontal/vertical gridlines. Legend "Samples per bin" on the right with a size-graduated key (200-600).
      Data: A single brand-green (#009E73) line with size-graduated green bubble markers tracing the calibration curve, plus a dashed gray 45-degree reference line for perfect calibration. The curve sits below the diagonal at low predicted probabilities and above it at high predicted probabilities, showing a clear S-shaped miscalibration pattern.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same layout as light — bold off-white title and subtitle in a lighter gray, light axis titles, softer-gray tick labels, faint gridlines rendered against the dark surface, legend box with light text on the right.
      Data: Data colors are identical to the light render — same brand-green (#009E73) line and bubbles, same gray dashed reference line. Only the chrome (background, text, grid) has flipped to the dark theme tokens.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed. Brand green reads well on the near-black surface.
