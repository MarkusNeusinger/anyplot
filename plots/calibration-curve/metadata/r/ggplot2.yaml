review:
  strengths:
  - 'Brand green #009E73 used correctly for the primary series, identical between
    light and dark renders'
  - Diagonal reference line correctly uses the theme-adaptive neutral ink token with
    reduced alpha, reading as chart structure rather than a data series
  - coord_fixed() enforces a true 1:1 aspect so the 45-degree perfect-calibration
    line is geometrically honest — idiomatic and distinctive for this specific plot
    type
  - Bubble-size encoding (aes(size = n)) adds the samples-per-bin dimension without
    needing a separate histogram subplot
  - Subtitle cleanly surfaces both Brier score and ECE as required by the spec
  - scales::percent axis labels improve readability over raw 0-1 fractions
  - Theme-adaptive chrome (background, ink, ink_soft) correctly flips between light/dark
    while data colors stay identical
  - Title fontsize is dynamically scaled to avoid overflow on the square canvas
  weaknesses:
  - Grid lines use the full-strength INK color (panel.grid.major = element_line(color
    = INK, ...)) instead of a faded/reduced-contrast tint, producing a bold, high-contrast
    grid that competes with the data trace in both themes — style guide requires grid
    opacity ~15-25%, very subtle. Since ggplot2 exposes no alpha for grid lines, switch
    to a fixed low-contrast gray hex (not the same token as text/axis-line ink) for
    panel.grid.major instead of INK.
  - Overall composition reads as a competent, well-configured default rather than
    a fully polished custom design — the legend and grid could use more deliberate
    refinement (e.g. lighter grid, tighter legend spacing) to lift aesthetic sophistication
    beyond 'good'.
  - Distinctive-feature usage (coord_fixed + size-mapped bubbles) is solid but could
    go further — e.g. a direct annotation calling out the over/under-confidence gap
    at a key bin would deepen the ggplot2-specific storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Bold dark title "calibration-curve · r · ggplot2 · anyplot.ai" and gray subtitle "Brier score 0.165 · ECE 0.082" both clearly readable at the top. Axis titles ("Mean predicted probability", "Observed fraction of positives") are dark and legible; percent-formatted tick labels are medium-gray and legible. Grid lines are solid dark (full INK color) -- visible and somewhat bold/high-contrast rather than subtle, though they do not obscure any text or data. Legend "Samples per bin" with five size-scaled green circles reads clearly against the background, no frame/box.
      Data: Green (#009E73) line and size-scaled bubble markers trace a curve that sits above the gray dashed diagonal reference line for most of the low-to-mid range, visually communicating the underconfident-classifier calibration pattern from the spec.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title and axis titles render in light off-white text, subtitle and tick labels in light gray -- all clearly legible against the dark background, no dark-on-dark text anywhere. Grid lines flip to a light/white full-INK tone, same boldness/high-contrast concern as the light render but no legibility failure.
      Data: Green line/markers and dashed neutral reference line are pixel-identical in color to the light render -- confirms only chrome flipped, not data colors.
      Legibility verdict: PASS
