review:
  strengths:
  - Metrics box headed by the model name ties Brier score and ECE to the curve they
    describe (C3)
  - Bin markers at size 28 with a page-colored outline make each of the ten bins readable
    as an individual point, with straight unsmoothed segments between them (C1)
  - Dashed INK_SOFT diagonal is told apart from the green model curve by style and
    stays visible in both themes (C2)
  - 'Theme tokens threaded through every chrome element: all text readable on #FAF8F1
    and #1A1A17'
  - HoverTool with formatted predicted / observed / count tooltips adds per-bin detail
    in the HTML output
  - Data block reads a tidy df through column constants, so a user's own predictions
    table drops in directly
  weaknesses:
  - 'DQ-02 (both): the model is labelled only ''Classifier'' and the columns ''Predicted
    probability'' / ''Actual outcome (0/1)'', so the scenario reads generic with no
    domain → name a concrete model from the spec''s Applications, e.g. ''Credit-default
    model'' with ''Predicted default probability'' / ''Defaulted (0/1)''. Likely cause:
    the Y_TRUE / Y_PROB constants and the legend_label / Label text.'
  - 'Suggestion: give the metrics Label some inner padding (Label.padding) so ''Classifier''
    and ''0.144'' no longer touch the box border.'
  - 'Suggestion: sklearn.calibration.calibration_curve(y_true, y_prob, n_bins=10,
    strategy=''uniform'') with np.histogram for the counts would replace the binning
    loop.'
  image_description: |-
