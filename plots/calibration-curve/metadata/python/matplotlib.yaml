review:
  strengths:
  - Two-panel layout via plt.subplots(sharex=True, height_ratios [3, 1]) keeps the
    histogram on the same 0-1 probability axis and smaller than the curve
  - Brier score per model inside each legend entry makes it unambiguous which metric
    belongs to which curve
  - Distinct marker shapes per model plus Imprint colors keep the curves distinguishable
    without relying on hue
  - 'Theme tokens threaded through title, labels, ticks, spines, grid and legend frame:
    both renders fully readable'
  - Data block ends in one tidy df with column constants; empty bins are dropped rather
    than plotted
  weaknesses:
  - 'DQ-03 (both): the model labels contradict their curves — ''Well-calibrated''
    (Brier 0.103) runs far off the diagonal (0.11 observed at 0.35 predicted, 0.90
    at 0.75), and ''Overconfident'' has the best Brier (0.020) and a steep step from
    0.0 to 1.0 with predictions bunched near 0.12 and 0.88, which is the shape of
    underconfidence → generate each model''s probabilities so its curve shows its
    label: a well-calibrated model whose observed rate follows the predicted probability
    (e.g. draw y_true ~ Bernoulli(p) from the model''s own p), and an overconfident
    model with predictions pushed past the observed rates (flatter-than-diagonal curve).
    Likely cause: all three models are a sigmoid of a ±signal plus noise, ignoring
    the 0.35 base rate, and the overconfident one has the cleaner signal.'
  - 'VQ-03 (both): bin markers that sit at a fraction of exactly 0.0 or 1.0 (four
    Overconfident squares on the top edge, several points on the bottom edge) are
    cut in half by the axes frame → show each bin''s marker whole, e.g. ylim(-0.03,
    1.03) or clip_on=False on the curve. Likely cause: ax1.set_ylim(0, 1) with default
    clipping.'
  - 'VQ-03 (both): the three histograms drawn on top of each other at alpha 0.6 hide
    the green series between 0.25 and 0.75 under the blue and purple bars, so its
    distribution cannot be read → keep each model''s distribution distinguishable,
    e.g. histtype=''step'' outlines or a lower alpha with an outline. Likely cause:
    three ax2.hist calls with alpha=0.6 and filled bars.'
  - 'DQ-02 (both): the scenario is generic — models are named only by their calibration
    behaviour and the outcome is ''Actual outcome (0 or 1)'', with no application
    → name the outcome and models after one of the spec''s applications (e.g. loan
    default with logistic regression, gradient boosting, naive Bayes). Likely cause:
    OUTCOME and MODELS constants.'
  - 'Suggestion: lines 63-67 could use sklearn.calibration.calibration_curve(hit,
    prob, n_bins=N_BINS, strategy=''uniform'') and sklearn.metrics.brier_score_loss.'
  - 'Suggestion: the wide translucent Overconfident band (0.03-0.47 around 0.42) draws
    the eye more than the curves; a thinner band or none would keep focus on the bins.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and both panels, 3200x1800.
      Chrome: title "calibration-curve · python · matplotlib · anyplot.ai" in dark ink, centred; y labels "Fraction of positives" and "Count", x label "Mean predicted probability" in dark ink; tick labels soft grey; subtle y-grid; top/right spines removed; legend on an elevated off-white frame, lower right.
      Data: dashed grey diagonal; three calibration curves with markers — green #009E73 circles (Well-calibrated, Brier 0.103), purple #C475FD squares (Overconfident, Brier 0.020), blue #4467A3 triangles (Underconfident, Brier 0.184) — each with a translucent standard-error band; the purple curve steps from 0 to 1 between 0.34 and 0.57. Markers at y=0 and y=1 are half-clipped by the frame. Lower panel: three overlapping 20-bin histograms at alpha 0.6 sharing the 0-1 x axis.
      Legibility verdict: PASS

