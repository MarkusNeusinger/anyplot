review:
  strengths:
  - 'Theme tokens threaded through every chrome element: title, subtitle, ticks, axis
    lines and grid read cleanly on both #FAF8F1 and #1A1A17, with the #009E73 curve
    identical in both'
  - Brier score (0.052) and ECE (0.188) are computed from the data and shown in the
    subtitle, directly under the title of the single model they describe
  - Ten equal-width bins with empty bins dropped; each bin is a visible point on an
    unsmoothed line, against a dashed diagonal that stays distinct in both themes
  - lets-plot layer_tooltips() with formatted Predicted / Observed / Bin size lines
    for the HTML output
  - Canonical 3200x1800 canvas with text at the library's reference sizes
  weaknesses:
  - 'DE-02 (both): the panel is boxed by all four borders, including top and right,
    where a calibration curve needs none → an L-shaped frame (left and bottom axis
    lines only). Likely cause: the default panel border left on; set panel_border=element_blank()
    and keep axis_line.'
  - 'SC-02 (both): C4 missed: the histogram of predicted probabilities is drawn inside
    the calibration panel instead of as a secondary panel sharing the probability
    axis → a smaller separate panel below the curve (for example gggrid with a shorter
    height). Likely cause: geom_bar added to the same ggplot as the curve.'
  - 'SC-03 (both): the histogram bars are read against the ''Fraction of positives''
    axis, scaled so the tallest bar sits at 0.25, while the subtitle calls them a
    ''share of predictions per bin'' → bars on their own axis showing the real share
    or count. Likely cause: share = counts / counts.max() * HIST_HEIGHT plotted on
    the curve''s y scale.'
  - 'DQ-02 (both): the columns are the generic ''Actual outcome'' and ''Predicted
    probability'' with no application context → name a concrete scenario from the
    spec''s applications (for example ''Loan defaulted'' and ''Predicted default probability'').
    Likely cause: the Y_TRUE / Y_PROB column names.'
  - 'Suggestion: the code comment calls the model overconfident, but the curve (below
    the diagonal at low probabilities, above it at high ones) shows an underconfident
    model; the comment could say so.'
