review:
  strengths:
  - Brier score and ECE are folded into each model's legend label, so every metric
    sits next to the curve it belongs to without an extra annotation layer
  - Long-format melt plus pandas cut/groupby feeds a single sns.lineplot with hue
    and style mapped to the model (estimator=None, sort=True), giving every curve
    its own Imprint color and a redundant marker shape; points sit exactly at each
    bin's computed (mean prediction, fraction of positives)
  - The optional prediction histogram is a 3:1 secondary panel sharing the probability
    x axis (sharex), drawn with sns.histplot element='step' and light fills so the
    three distributions stay readable where they overlap
  - 'The three synthetic classifiers show the three calibration archetypes: near-diagonal
    logistic regression, a flattened overconfident Naive Bayes and a steep underconfident
    random forest'
  - Theme tokens are threaded through set_theme rc, the marker halos (markeredgecolor=PAGE_BG)
    and the INK_MUTED diagonal, so both renders read cleanly with identical data colors
  weaknesses:
  - 'DQ-02 (both): the base rate of about 36 % defaults (np.random.beta(2, 3.5)) is
    far above what a hold-out set of loan applicants shows → a default rate of roughly
    10–20 % (for example beta(1.5, 6)). Likely cause: the beta parameters of the calibrated
    probabilities.'
  - 'Suggestion: the histogram''s 20 bins could match the curve''s 10 bins so each
    point lines up with the bar that holds its samples.'
  - 'Suggestion: ordering the legend entries by ECE would put the ranking of the models
    in reading order.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across figure and both panels, 2400x2400 square canvas.
      Chrome: title "calibration-curve · python · seaborn · anyplot.ai" in dark ink, about 67 % of the width; y label "Fraction of positives (Defaulted)", histogram y label "Count", shared x label "Predicted probability (curve: bin mean)"; tick labels in INK_SOFT, subtle grid, top/right spines removed; legend in an elevated off-white frame at the upper left, clear of all data. All readable.
      Data: upper panel (3/4 height) shows a grey dashed diagonal "Perfect calibration" and three reliability curves with markers at each bin: Logistic regression #009E73 circles hugging the diagonal (Brier 0.192, ECE 0.019), Naive Bayes #C475FD squares flattened across the diagonal (Brier 0.211, ECE 0.129), Random forest #4467A3 triangles steep between 0.29 and 0.62 (Brier 0.211, ECE 0.113). Lower panel: step histograms of predicted probabilities per model in the same colors with light fills, sharing the 0–1 x axis.
      Legibility verdict: PASS

