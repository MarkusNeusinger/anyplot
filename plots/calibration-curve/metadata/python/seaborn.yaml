review:
  strengths:
  - One sns.lineplot call with hue and style mapped to the same model column gives
    each classifier a distinct Imprint color and a distinct marker (circle, square,
    triangle), so the curves stay apart without relying on color alone
  - estimator=None with sort=True draws the curve straight through each bin's computed
    (mean predicted, fraction positive) pair; nothing is smoothed and empty bins simply
    drop out
  - Brier score and ECE are folded into each model's legend label, so every metric
    is unambiguously tied to its curve
  - The three classifiers are built as well-calibrated, overconfident (logit sharpened
    by 2.5) and underconfident (squeezed toward 0.5) versions of one probability vector,
    so the plot shows the S and inverted-S departures from the diagonal side by side
  - Muted dashed perfect-calibration diagonal on an equal-aspect 0-1 square, readable
    and distinct from the model curves in both themes
  - sns.histplot with element='step', hue and low-alpha fills keeps the three overlapping
    prediction distributions legible
  - Theme tokens threaded through sns.set_theme rc; both renders are theme-correct
    with identical data colors
  weaknesses:
  - 'SC-02 (both): the prediction-distribution histogram is a separate side panel
    with its own, shorter x axis, so it does not share the probability axis with the
    calibration curve as the spec''s histogram bullet asks → place the histogram as
    a short panel below the calibration axes with sharex=True (for example height_ratios
    about [3, 1]) so the bins line up with the curve''s x positions. Likely cause:
    plt.subplots(1, 2, gridspec_kw={''width_ratios'': [1.6, 1]}).'
  - 'DQ-02 (both): the classifiers are labelled only by their calibration behaviour
    (''Well-calibrated'', ''Overconfident'', ''Underconfident'') and the target as
    ''Observed outcome'', with no application domain → name a realistic context and
    models, for example a loan-default target with ''Logistic regression'', ''Gradient
    boosting'' and ''Naive Bayes''. Likely cause: the Y_TRUE and Y_PROBS label constants.'
  - 'Suggestion: the legend at 7 pt is a step below the 8 pt the library prompt starts
    from; with the legend''s free space in the upper left, 8 pt would fit and read
    better in the thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the figure and both axes.
      Chrome: title "calibration-curve · python · seaborn · anyplot.ai" centered at the top (~50 % width); left panel axes "Mean predicted probability" / "Fraction of positives" with 0.0-1.0 ticks on an equal-aspect square; right panel titled "Prediction distribution" with "Predicted probability" / "Count". Dark ink text, soft ticks, subtle grid; all readable. Legend (elevated frame, upper left) lists "Perfect calibration" and the three models with Brier and ECE.
      Data: grey dashed diagonal; Well-calibrated in #009E73 circles hugging the diagonal; Overconfident in #C475FD squares in a flattened, inverted-S shape (0.15 at 0.04 up to 0.77 at 0.94); Underconfident in #4467A3 triangles, steep, spanning 0.29-0.63. Right panel: three step histograms with faint fills (purple spike at 0-0.05, blue peak near 0.4, green broad around 0.3).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
