review:
  strengths:
  - Both models share one binning pass in a loop over the Y_PROB columns, with each
    curve at its computed bin means, straight segments and readable bin points (C1)
  - Brier score sits in each model's legend entry, so it is clear which model it belongs
    to (C3)
  - Histogram panel shares the [0, 1] probability axis and stays smaller than the
    curve panel (C4)
  - Theme tokens threaded through every chrome element; text, grid and legend read
    cleanly in both renders
  - Distinct marker symbols with page-colored outlines keep the two curves apart where
    they cross the diagonal
  - Native plotly xbins + barmode overlay for the distribution, and hoverinfo='skip'
    on the reference line in the HTML view
  weaknesses:
  - 'DQ-02 (both): the series are labelled ''Calibrated model'' and ''Overconfident
    model'' with no application, which reads as an abstract demo → name the models
    for a real use the spec lists, e.g. credit-default models such as ''Logistic regression
    (credit default)'' and ''Boosted trees (credit default)''. Likely cause: the Y_PROB
    column names.'
  - 'DQ-03 (both): the curve labelled ''Calibrated model'' sits about +0.15 above
    the diagonal in the first bin (0.04 → 0.20) and about −0.16 below it in the last
    (0.95 → 0.79), so the ''calibrated'' model is visibly miscalibrated at both ends
    and its Brier (0.212) barely beats the overconfident one (0.225) → generate it
    so its bin points sit within about ±0.05 of the diagonal. Likely cause: Gaussian
    noise (sd 0.1) added to true_risk and then clipped, which regresses the observed
    fraction toward the mean at the extremes; draw the outcome from the prediction
    instead (outcome ~ Bernoulli(calibrated)).'
  - 'CQ-04 (code): lines 58–63 write the binning (np.digitize, filled-bin list, per-bin
    means) and the Brier score by hand → sklearn.calibration.calibration_curve(truth,
    prob, n_bins=N_BINS) and sklearn.metrics.brier_score_loss(truth, prob). Likely
    cause: manual binning instead of the available sklearn calls.'
  - 'Suggestion: an ECE value next to the Brier score would show the calibration gap
    directly.'
