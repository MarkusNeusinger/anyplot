review:
  strengths:
  - Bins computed in one groupby().agg() with mean predicted, fraction positive and
    count, and ECE as a single count-weighted expression
  - coord_fixed(ratio=1) puts both axes on one probability scale so the dashed diagonal
    reads as perfect calibration
  - ECE placed in a subtitle clearly tied to the single model; theme tokens flip all
    chrome correctly between light and dark
  weaknesses:
  - 'DE-02 (both): all four spines are drawn as a closed panel box where nothing requires
    them → remove the top and right spines (L-shaped frame) or the border entirely.
    Likely cause: panel_border=element_rect(color=INK_SOFT, ...) in anyplot_theme.'
  - 'DQ-02 (both): the scenario is a generic, unnamed classifier with columns ''True
    label'' / ''Predicted probability'' → name a concrete domain (e.g. ''Defaulted''
    / ''Predicted default probability'' for a credit-risk model). Likely cause: the
    Y_TRUE / Y_PROB column names and the data comment.'
  - 'Suggestion: an optional histogram of predicted probabilities as a small secondary
    panel (allowed by the Notes) would show where predictions bunch.'
