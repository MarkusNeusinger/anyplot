      Background: warm near-black #1A1A17, correct.
      Chrome: title, axis titles, ticks and legend in light ink, all readable; no dark-on-dark text. Dotted grid is present but very faint.
      Data: identical #009E73 and #C475FD curves and dots; the diagonal flips to the light muted grey dashed line and stays visible.
      Legibility verdict: PASS
