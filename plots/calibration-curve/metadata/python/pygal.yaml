review:
  strengths:
  - Each calibration point is one bin's computed (mean prediction, fraction of positives)
    pair, joined by straight segments with no smoothing and no invented endpoints;
    empty bins are skipped as the spec permits
  - The perfect-calibration diagonal is a dashed line in the neutral INK_MUTED tone,
    so it reads as a reference and not as a third model in both themes
  - The Brier score sits in each model's legend entry, so it is clear which model
    it belongs to
  - Per-point pygal labels give an HTML tooltip with predicted vs observed and the
    bin count n, a library-native interactive detail
  - Theme tokens go through pygal's Style (background, foreground, foreground_subtle),
    and the data colors are identical in both renders
  weaknesses:
  - 'VQ-01 (both): legend text at 38 px, below pygal''s 44 px legend reference, reads
    small beside the 48 px axis titles even though it carries the Brier scores → 44
    px (+6 px). Likely cause: Style(legend_font_size=38).'
  - 'DQ-02 (both): the second classifier is labelled "Overconfident Model", which
    names a behaviour instead of a model, and the data has no domain → a real classifier
    name such as "Gradient Boosting" or "Random Forest" in a named setting such as
    credit default. Likely cause: the Y_PROB label list.'
  - 'CQ-04 (code): lines 89–100 write the equal-width binning and the Brier score
    out by hand (np.digitize loop over 10 bins, np.mean of squared error) → sklearn.calibration.calibration_curve(y_true,
    y_prob, n_bins=N_BINS) and sklearn.metrics.brier_score_loss; np.histogram(y_prob,
    bin_edges) for the per-bin n. Likely cause: hand-rolled binning loop.'
  - 'Suggestion: the dark-render grid (dotted guides) is very faint on #1A1A17; a
    slightly lighter guide tone would keep it as visible as in the light render.'
  - 'Suggestion: an optional histogram of predicted probabilities could show where
    predictions bunch.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title "calibration-curve · python · pygal · anyplot.ai" centred in dark ink at ~70 % width; axis titles "Mean predicted probability" / "Fraction of positives"; ticks 0.0–1.0 on both axes; subtle dotted grid; all text dark and readable. Legend at the bottom in three columns: "Perfect calibration", "Logistic Regression (Brier 0.211)", "Overconfident Model (Brier 0.231)".
      Data: grey dashed diagonal from (0,0) to (1,1); Logistic Regression in #009E73 with 10 dot markers hugging the diagonal; Overconfident Model in #C475FD with 10 dots forming a flattened S (above the diagonal at low p, below at high p). Straight segments, no smoothing.
      Legibility verdict: PASS

