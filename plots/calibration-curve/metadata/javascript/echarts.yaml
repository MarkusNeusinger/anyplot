review:
  strengths:
  - Dual-grid combo layout (calibration curve on top, prediction-probability histogram
    below) reads as one coherent figure and gives the histogram real estate without
    stealing focus from the curve
  - Bubble marker size scales with per-bin sample count, encoding a third dimension
    (confidence weight) directly on the calibration line without extra chrome
  - Subtitle surfaces both Brier score and ECE as required summary metrics, tightly
    integrated with the title block
  - 'Reference diagonal and model curve are both fully deterministic and correctly
    theme-adaptive (t.ink flips white/black, t.palette[0] stays #009E73 in both renders)'
  - 'Clean idiomatic ECharts usage: multi-grid/multi-axis composition, dynamic symbolSize
    callback, animation disabled per the mount-node contract'
  weaknesses:
  - Secondary y-axis name ('Count') is set in inkSoft/13px while the primary axis
    names ('Fraction of Positives', 'Mean Predicted Probability') use ink/16px --
    a bit more visual hierarchy between primary and secondary axis labels would sharpen
    the two-panel read, though it is not a legibility failure
  - 'Palette compliance is a semantic-exception case worth double-checking in future
    repairs: the reference ''Perfect calibration'' line intentionally uses t.ink rather
    than a palette color (correct convention for a guide line), so only ''Model calibration''
    carries the brand green -- keep this pattern if the spec is ever extended to multi-model
    comparison so the first real data series is still #009E73'
  - Design excellence is solid but stops at tasteful-default territory (subtle grid,
    hidden spines, generous whitespace) rather than pushing further into a distinctive
    visual signature -- e.g. no annotation calling out the most miscalibrated bin,
    which would sharpen the storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "calibration-curve · javascript · echarts · anyplot.ai" centered in dark ink, subtitle "Fraud-detection classifier · Brier score 0.211 · ECE 0.106" in softer gray beneath it, legend top-right ("Model calibration", "Perfect calibration") in soft ink. Axis titles ("Fraction of Positives", "Mean Predicted Probability", "Count") and tick labels all render in dark/soft-dark text, clearly legible against the light background. No overlap between title, subtitle, legend, or axes.
      Data: First (and only) real data series "Model calibration" is Imprint brand green (#009E73) with circular markers whose size varies by bin sample count; the diagonal "Perfect calibration" reference line is black dashed (t.ink), a deliberate neutral choice for a guide line rather than a data series. Histogram bars in the lower panel are a muted warm gray, distinguishable from the background and from the green curve above.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title/subtitle/legend/axis text, all flipped to light ink/soft-light tones. Title and subtitle are clearly white/light-gray against the dark background; axis tick labels and axis names are legible light-gray text. No dark-on-dark text anywhere -- the diagonal reference line correctly flips from black to white dashed, and the histogram bars flip from dark gray to a lighter gray for contrast against the near-black background.
      Data: Model calibration curve and markers remain the identical #009E73 green as the light render; only chrome (background, text, grid, reference line, histogram fill) adapts to the dark theme.
      Legibility verdict: PASS
