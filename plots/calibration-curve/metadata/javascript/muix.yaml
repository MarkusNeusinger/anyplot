review:
  strengths:
  - Dual-panel composition (calibration curve + prediction-distribution histogram)
    matches the spec's optional feature and gives full context in one view
  - Both ECE and Brier score are computed and displayed in the subtitle for each model,
    exceeding the spec's 'Brier OR ECE' requirement
  - Diagonal reference line correctly uses the theme-adaptive ink/neutral token rather
    than a categorical color, while Model A and Model B correctly use Imprint palette
    positions 1 and 2
  - Realistic, neutral medical-diagnostic-risk scenario with genuinely different calibration
    behavior (well-calibrated vs. overconfident) demonstrated in the data, including
    a histogram that shows Model B's distribution skewing toward the extremes
  - Font sizes, margins, and grid are explicitly configured rather than left at MUI
    X defaults, and both light/dark renders are fully readable with no overlap or
    clipping
  weaknesses:
  - Five helper functions (mulberry32, gaussian, calibrationBins, brierScore, expectedCalibrationError)
    add more structure than a minimal KISS script would use -- justified by the statistics
    involved, but more elaborate than a bare-bones example
  - The histogram subplot hides its own legend (slotProps.legend.hidden) and relies
    on the viewer remembering the Model A/B color mapping from the chart above --
    acceptable but a small extra cognitive step
  - The main chart's yAxis tickFontSize is set to an unusually large 32 purely to
    reserve label offset space, per the code's own comment -- it works but is a slightly
    fragile workaround for MUI X's actual sizing knob rather than a direct fontSize
    control
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 -- not pure white, not dark.
      Chrome: Title "calibration-curve · javascript · muix · anyplot.ai" is centered, dark ink, fully legible. Subtitle below it shows "Model A -- ECE 0.016, Brier 0.167 · Model B -- ECE 0.103, Brier 0.180" in a lighter ink-soft tone. Axis labels ("Mean Predicted Probability", "Fraction of Positives", "Predicted Probability Bin", "Count") and percentage tick labels (0%-100%) are dark and clearly readable against the light background. A horizontal-only grid is faint gray and does not compete with the data. Legend at the top lists "Perfect calibration" (black swatch), "Model A (well-calibrated)" (green), "Model B (overconfident)" (purple).
      Data: The dashed diagonal reference line is black (ink token), correct for a non-categorical reference. Model A (green, #009E73) hugs the diagonal closely -- confirming good calibration. Model B (purple, #C475FD) bows away from the diagonal -- overconfident at the low and high ends, underconfident in the mid-range, exactly matching its "overconfident" label. The bottom histogram shows Model B's predictions concentrated at the 0-10% and 90-100% bins (overconfident sharpening) while Model A's predictions are more evenly spread across bins.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 -- not pure black, not light.
      Chrome: Title and subtitle render in light ink (white/off-white) and inkSoft gray respectively, fully legible against the dark background. Axis labels and percentage tick labels are light-colored and clearly readable. The grid remains faint (light gray at low opacity) and unobtrusive. Legend text is light-colored; the "Perfect calibration" swatch is now light/white (theme-adaptive ink token) instead of black, correctly flipping with the theme.
      Data: Model A remains #009E73 (identical green to the light render) and Model B remains #C475FD (identical purple) -- confirming the Imprint data colors are constant across themes and only chrome flipped. The dashed diagonal reference line is now white/light instead of black, consistent with the ink-token approach. No dark-on-dark or unreadable text anywhere; all chrome elements correctly inverted for the dark surface.
      Legibility verdict: PASS
