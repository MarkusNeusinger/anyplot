review:
  strengths:
  - 'Complete reliability diagram: dashed perfect-calibration diagonal, 10 equal-width
    bins, ECE and Brier for each model named in the subtitle'
  - Histogram panel sits under the main panel with bins aligned to the probability
    axis and reuses the model colors, showing Model B's predictions bunching at the
    extremes
  - 'Theme tokens threaded through every element: diagonal flips from ink-black to
    ink-white, all text readable in both renders'
  - Per-series [data-series] sx selectors set stroke widths and the dash pattern idiomatically
    for MUI X v9
  - Distinct marker shapes (square vs diamond) back up the color difference
  weaknesses:
  - 'SC-03 (both): every calibration point sits at its bin center (5%, 15%, … 95%)
    instead of the bin''s mean predicted probability, so Model B''s points (whose
    predictions bunch near 0 and 1 inside the edge bins) are drawn up to ~4 percentage
    points off their true x → plot each model at its own computed (mean predicted
    probability, fraction of positives) pair, e.g. a ScatterChart/LineChart per model
    with its own x values, and use the same mean in the ECE. Likely cause: xValues
    built from binsA.map(b => b.center) and shared by both series.'
  - 'VQ-01 (both): histogram tick labels at 12 px and its axis titles at 14 px blur
    in the 400 px thumbnail and are smaller than the main panel''s 14/16 px → 14 px
    ticks, 16 px titles (+2 px). Likely cause: BarChart tickLabelStyle fontSize 12
    / labelStyle fontSize 14.'
  - 'DQ-02 (both): the series are labelled ''Model A (well-calibrated)'' and ''Model
    B (overconfident)''; the screening scenario lives only in a code comment → name
    the models for the domain, e.g. ''Logistic regression (screening)'' and ''Boosted
    trees, uncalibrated''. Likely cause: Y_PROB / Y_PROB_B label strings.'
  - 'CQ-01 (code): module-level helper functions calibrationBins, brierScore and expectedCalibrationError
    plus a Bin type → inline the binning and metrics as flat statements. Likely cause:
    function-based structure.'
  - 'Suggestion: give the histogram a light horizontal grid like the main panel so
    counts read off more easily.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: centered title "calibration-curve · javascript · muix · anyplot.ai", grey subtitle with "Model A — ECE 0.016, Brier 0.167 · Model B — ECE 0.103, Brier 0.180", legend row (Perfect calibration, Model A (well-calibrated), Model B (overconfident)). Main panel: y "Fraction of Positives" 0–100%, x "Mean Predicted Probability" 0–100% in 5% ticks, subtle horizontal grid. Lower histogram: "Count" 0–1,000 vs "Predicted Probability Bin" 0–10% … 90–100%. All text dark and readable; histogram ticks small.
      Data: dashed black diagonal; Model A green #009E73 square markers hugging the diagonal; Model B purple diamonds above the diagonal below 40% and below it above 50% (inverted S, a dip at 45%). Histogram: green bars ~300 per bin, purple bars ~850 in the two edge bins and ~120–230 elsewhere.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
