review:
  strengths:
  - 'Full spec compliance: diagonal perfect-calibration reference line, 10 equal-width
    bins, both Brier score and ECE displayed, optional prediction-distribution histogram
    included as a secondary panel.'
  - 'Correct Imprint palette usage with theme-adaptive chrome verified identical across
    both renders — first series is #009E73, backgrounds are #FAF8F1/#1A1A17, and the
    diagonal reference line correctly uses the theme-adaptive ''neutral'' ink token
    for its baseline/reference role.'
  - 'Distinctive D3 technique: scaleSqrt bubble-sizing on the calibration markers
    to encode per-bin sample count, layered onto a manually composited two-panel (calibration
    curve + histogram) shared-x layout.'
  - Realistic, well-motivated credit-risk scenario with internally consistent metric
    values (Brier score 0.128, ECE 0.090) and a plausible skewed risk-score distribution.
  - Deterministic seeded LCG data generation per the D3 reproducibility guidance;
    clean single-pass script with explicit font sizes throughout.
  weaknesses:
  - Markers for the 10 aggregated bins (radius 7-18 css px) could be modestly larger
    given how sparse the data is — increase the scaleSqrt range slightly (e.g. 9-22)
    for more prominence.
  - The predicted-vs-observed pattern is uniformly overconfident across the entire
    probability range (true rate = predicted^1.5 everywhere) — varying the miscalibration
    direction slightly in one region (e.g. brief near-diagonal or crossing segment)
    would better showcase mixed calibration behavior per DQ-01.
  - Design polish is strong but stops short of a publication-level flourish — e.g.
    no visual callout or shaded band for the largest miscalibration gap, which would
    sharpen the data storytelling further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "calibration-curve · javascript · d3 · anyplot.ai" is bold dark text, clearly legible. Axis labels ("Observed default rate", "Mean predicted probability", "Count") and tick labels are dark/soft-dark and fully readable. Grid lines are subtle horizontal lines, visible but not competing with data. Legend text ("Model calibration (marker size = bin sample count)", "Perfect calibration") is legible dark-gray text top-left.
      Data: Top panel shows a green (#009E73) line with circular markers (sized by bin sample count) tracking below a dashed gray diagonal reference line — a clear overconfidence pattern. Bottom panel shows a muted-gray histogram of predicted-probability counts, decreasing from ~750 at the low end to ~190 at the high end. Brier score (0.128) and ECE (0.090) are printed in muted text in the empty lower-right area of the top panel.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light (off-white/soft-gray) text, all clearly legible against the dark background. Grid lines remain subtle. Legend text is light-gray and readable. No dark-on-dark text anywhere.
      Data: The calibration line/markers are the identical #009E73 green as in the light render (confirmed same hue/saturation), and the histogram bars are a light muted gray (their neutral tone flipped appropriately for the dark surface) while remaining fully visible. Brier/ECE annotation text is legible light-gray in the same lower-right position.
      Legibility verdict: PASS — all text and data elements read clearly against the dark background; data colors are identical to the light render, only chrome flipped as expected.
