review:
  strengths:
  - 'Correct reliability-diagram construction: 10 equal-width bins, mean predicted
    probability plotted against observed frequency for two classifiers with distinct
    calibration behavior (well-calibrated logistic regression vs. overconfident/sharpened
    random forest)'
  - Brier score summary metric shown both in the subtitle and per-series legend labels,
    matching the spec's 'display Brier score or ECE' requirement
  - Diagonal perfect-calibration reference line correctly styled with the theme-adaptive
    ink/neutral token (dashed, no markers, enableMouseTracking disabled) rather than
    a categorical palette color, which is the semantically correct choice for a baseline
    reference
  - Correct Imprint palette order (brand green first, lavender second) and fully theme-correct
    chrome in both renders — no dark-on-dark or light-on-light failures
  - Distinct marker shapes (circle vs. diamond) give redundant encoding beyond color
    for the two model series
  - All font sizes explicitly set (title 22px, subtitle/labels 14px, axis titles 16px);
    clean layout with generous margins and no clipping in either render
  weaknesses:
  - 'Library Mastery is generic: nothing in the implementation is distinctive to Highcharts
    specifically (dash style, disabled mouse tracking, marker radius are all trivially
    portable to Chart.js/ECharts). Consider a Highcharts-specific touch — e.g. a `yAxis.plotBands`/`plotLines`
    shaded region to visually mark the ''overconfident'' vs ''underconfident'' zones
    relative to the diagonal, or an `annotations`-style callout on the biggest miscalibration
    gap — to both raise LM-02 and strengthen the data storytelling (DE-03).'
  - '`tooltip: { enabled: false }` throws away a low-cost interactivity win that would
    help in the HTML detail view (e.g. showing bin sample count and exact predicted/observed
    values on hover) without affecting the static PNG at all — recommend enabling
    the default tooltip instead of disabling it outright.'
  - Only two calibration behaviors are shown (well-calibrated vs. overconfident);
    the spec mentions a model can also be underconfident. Not required, but adding
    a third series (or swapping Random Forest for a clearly underconfident curve)
    would demonstrate fuller feature coverage of what a calibration curve can reveal.
  - Design Excellence is solid but not exceptional — visual refinement (grid, whitespace)
    and storytelling read as 'good' rather than 'excellent'; a shaded confidence/reference
    band, subtle annotation on the largest calibration gap, or a slightly refined
    grid treatment would push this into the top tier.
  - 'CQ-01 (KISS structure): four helper functions (`lcg`, `randNormal`, `binCalibration`,
    `brierScore`) are used — reasonable given the statistical computation needed,
    but slightly departs from the pure imports→data→plot flat-script ideal.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "calibration-curve · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible; subtitle with Brier scores in medium-gray, readable; x-axis title "Mean Predicted Probability" and y-axis title "Observed Frequency (Fraction Positive)" in medium-gray, both legible and similarly sized; tick labels on both axes small and legible; gridlines subtle light-gray, visible but not competing with data; legend at bottom center with three entries, clearly readable.
      Data: First series (Logistic Regression) is brand green (#009E73) circles+line hugging the diagonal reference closely; second series (Random Forest) is lavender/purple (#C475FD) diamonds+line, deviating from the diagonal (above it at low probabilities, below it at high probabilities — a classic sharpened/overconfident calibration curve); diagonal "Perfect calibration" reference is a black dashed line with no markers.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle rendered in white/light-gray, fully legible; axis titles and tick labels in light gray, legible and balanced between x and y axes; gridlines subtle gray, visible against the dark background without dominating; legend text light-gray and readable.
      Data: Both series render in the identical brand green and lavender hexes as the light render — confirmed unchanged data colors. The "Perfect calibration" reference line correctly flips to white dashes (theme-adaptive ink token) so it stays visible against the dark background instead of remaining black.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the background.
