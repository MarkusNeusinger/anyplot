review:
  strengths:
  - 'Correct top-down icicle: one row per level, root spanning the full width, children
    inside their parent''s extent with widths proportional to summed sizes.'
  - Color by hierarchy level in canonical Imprint order (green first), applied consistently,
    with neighbours separated by page-colored borders in both themes.
  - 'Label fit is measured with get_window_extent against each rectangle: horizontal
    first, rotated second, removed when it fits neither, so no label leaves its rectangle.'
  - Label ink chosen from fill luminance keeps every label readable on its fill in
    both themes.
  - Theme tokens thread through title, captions and borders; Imprint data colors identical
    across renders.
  weaknesses:
  - 'DQ-03 (code): several single files carry sizes implausible for their type, for
    example Wedding.jpg 75 MB, Beach.jpg 65 MB and Q2_Review.pdf 55 MB → single JPEGs
    and PDFs in the low single-digit to ~10 MB range (about −60 MB for the photos),
    or rename the leaves to folders/archives whose sizes fit. Likely cause: the size
    column of the `hierarchy` list.'
  - 'Suggestion: "Thriller" sits horizontal between rotated neighbours in row 4; a
    single orientation per row would read more evenly.'
  - 'Suggestion: a size readout in large labels (for example "Documents · 350 MB")
    would let the reader see the values the widths encode.'
