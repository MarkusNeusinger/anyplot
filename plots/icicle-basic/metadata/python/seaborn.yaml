review:
  strengths:
  - Branch hue from the Imprint palette in canonical order with lighter tints per
    depth reads both category and hierarchy level, identical in both themes
  - Labels only where they fit, truncated with an ellipsis, with text color chosen
    per fill by WCAG contrast — readable on every rectangle in both themes
  - Exact 3200x1800 canvas via figsize x dpi with subplots_adjust, no bbox_inches
    trimming
  - 'Clean adaptable layout: column constants, one Data block, a plot section that
    reads only df'
  weaknesses:
  - 'VQ-01 (both): the level-2 and leaf labels (Platform, Mobile App, Shipping, Rent
    …) are set at 7 pt, below the style guide''s 8 pt floor for the smallest text
    → 8 pt (+1 pt), keeping 9 pt or more for the upper rows. Likely cause: fontsize
    = 9 if level < 2 else 7.'
  - 'CQ-01 (code): two recursive helper functions total() and depth() (lines 80–90)
    break the Imports → Data → Plot → Save flow → compute the subtree totals and the
    level count inline, for example by a reverse level-order pass over the children
    dict. Likely cause: recursion used for the tree sums.'
  - 'Suggestion: leaf names such as ''Platform Cloud'' and ''Retail Staff'' are cut
    to ''Platfor…'' / ''Retai…'' although their rectangles are tall enough for a two-line
    wrap of the name.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "icicle-basic · python · seaborn · anyplot.ai" in dark ink, centered above the chart at ~44% width; no axes or grid. All text readable.
      Data: four-row icicle. Top row: gray "Company 8,630" root spanning the width. Row 2: Engineering 3,360 (#009E73), Marketing 1,440 (#C475FD), Operations 1,840 (#4467A3, white text), Sales 1,990 (#BD8233). Rows 3 and 4: the same hues tinted lighter per level (Platform 2,230, Mobile App 1,130, Campaigns 970, Brand 470, Logistics 1,170, Facili… 670, Enterprise 1,120, Retail 870; leaves Platform Staff 1,450, Platfor… 780, Mobile St… 920, Campai… 640, Shipping 710, Ware… 460, Rent 520, Enterpris… 880, Retai… 560, plus six thin unlabeled slivers). Rectangles separated by thin page-colored gaps. Level-2 and leaf labels are smaller (7 pt) than the upper rows.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, clearly readable; gaps between rectangles now near-black (page color).
      Data: fills identical to the light render (gray root, the same four Imprint hues and tints); label text colors unchanged (dark on the fills, white on Operations), all readable against their fills. No dark-on-dark text.
      Legibility verdict: PASS
