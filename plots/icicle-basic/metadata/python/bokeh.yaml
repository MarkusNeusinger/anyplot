      Data: root row in green, category row (Documents 750 MB, Media 1600 MB, Code 950 MB) in purple, nine leaves in blue, all at fill_alpha 0.9 with dark outlines and dark 16-24pt labels; the dark labels on the blue leaves have weak contrast.
