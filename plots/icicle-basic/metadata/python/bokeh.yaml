review:
  strengths:
  - Correct icicle layout with children inside their parent's extent and widths proportional
    to the computed folder sizes
  - Color by level in Imprint order with theme-adaptive chrome
  - Labels hidden or shortened on narrow nodes, as the Notes ask
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2561, not a canonical size, and the title is
    squeezed against the top edge → 3200x1800 (−1600 × −761). Likely cause: figure
    width=4800, height=2700 and no CDP viewport override in the screenshot step.'
  - 'VQ-01 (both): the 28pt title and 16-24pt node labels read very small on the canvas,
    and in the light render the dark labels on the #4467A3 leaves have weak contrast
    → title 50pt, labels at least about 26pt, light ink on the blue fills. Likely
    cause: text_font_size values and the single text_color=INK for every label.'
  - 'VQ-07 (both): fill_alpha=0.9 blends the fills with the page, so the purple and
    blue differ between the light and dark renders → opaque fills (alpha 1). Likely
    cause: fill_alpha=0.9 in p.rect.'
  - 'SC-04 (both): the title ''icicle-basic · bokeh · anyplot.ai'' lacks the language
    segment → ''icicle-basic · python · bokeh · anyplot.ai''. Likely cause: the title
    string.'
  - 'CQ-01 (code): three helper functions, with calc_value and assign_level as separate
    recursive passes over the same tree → a single recursive layout pass that records
    level and size. Likely cause: calc_value() and assign_level() definitions.'
  - 'Suggestion: drawing the labels as one text glyph on the ColumnDataSource would
    replace the loop of Label annotations.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, but the canvas is 4800x2561.
