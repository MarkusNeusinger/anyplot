review:
  strengths:
  - 'Clean depth-first layout: every child sits within its parent''s extent, siblings
    sorted by size, widths computed from summed leaf values'
  - Two-tier labelling (name + value on wide rectangles, name only on medium, none
    on slivers) keeps every label inside its rectangle
  - Theme tokens threaded through title, legend frame and labels; correct 3200x1800
    canvas in both renders
  - scale_fill_manual with explicit level limits keeps the legend to the four levels
    present
  weaknesses:
  - 'VQ-01 (both): rectangle labels at geom_text size=5 render at roughly 5 pt, smaller
    than the 7 pt legend text, and in the dark render the #F0EFE8 labels on the #C475FD
    Level 1 fill have weak contrast (about 2:1) → labels about 7 pt (+2 pt) and a
    label color chosen against each fill (dark ink on lavender/ochre, light ink on
    green/blue) in both themes. Likely cause: geom_text size=5 and color=INK for every
    level.'
  - 'VQ-07 (dark): rectangle separators are hard-coded pure white, which draws a bright
    outer frame around the chart on the #1A1A17 page → separators in PAGE_BG. Likely
    cause: geom_rect(color="white").'
  - 'CQ-01 (code): layout uses two recursive helper functions total() and place()
    → an iterative pass (aggregate values bottom-up, then lay out level by level)
    without function definitions. Likely cause: recursive design of the layout block.'
  - 'CQ-04 (code): dark_bg/light_bg split (lines ~155-160) draws two geom_text layers
    with the identical color=INK, so the split has no effect → one geom_text layer,
    or make the split actually pick per-fill colors. Likely cause: contrast logic
    left unfinished.'
  - 'Suggestion: move the legend closer to the chart to reduce the empty band on the
    right.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: bold dark title 'icicle-basic · python · plotnine · anyplot.ai' centred at top; legend 'Hierarchy level' with Level 0-3 swatches in an elevated box with soft-ink frame on the right; all readable.
