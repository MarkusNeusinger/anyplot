review:
  strengths:
  - 'Native go.Icicle with labels/parents/values and per-level Imprint colors: root
    #009E73, level 1 #C475FD, level 2 #4467A3, applied consistently'
  - leaf opacity set to 1 keeps every fill identical between the light and dark renders
  - Label ink chosen per fill by contrast, so every label reads against its rectangle
    in both themes
  - Thin page-colored borders separate siblings without heavy lines
  - Hover template shows node name and value in the HTML output
  weaknesses:
  - 'SC-03, SC-02 (both): plotly''s default branchvalues=''remainder'' adds each parent''s
    own value to its children''s sum, so root is drawn as 285 instead of 100 and Code,
    Documents, Photos, Archive at twice their values; their children fill only the
    top half of each parent''s extent (C2) → parent rectangles equal to their stated
    values with children filling them (branchvalues=''total''). Likely cause: go.Icicle
    without branchvalues=''total'' while the data already stores totals.'
  - 'VQ-01, SC-02 (both): Project_C and Vacation labels are auto-shrunk to about 5
    px and barely readable, where the spec asks for no labels on small nodes (C4)
    → hide labels that would fall below the 10 px label size. Likely cause: no layout
    uniformtext={''minsize'': 10, ''mode'': ''hide''}.'
  - 'CQ-01 (code): two helper functions, depth() and label_color(), where top-level
    code suffices → inline the depth lookup and pick the label ink with a plain expression.
    Likely cause: function definitions in the plot block.'
  - 'DQ-02 (both): the node names ''root'' and ''Project_A'', ''Project_B'', ''Project_C''
    read as placeholders → real folder names (for example ''Home'', ''website'', ''analytics'',
    ''mobile-app''). Likely cause: the NAME list in the data block.'
  - 'Suggestion: stating the unit (GB) in the hover template would make the values
    concrete in the HTML view.'
