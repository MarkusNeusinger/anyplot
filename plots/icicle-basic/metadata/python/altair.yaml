review:
  strengths:
  - Root at the top with children directly below via a reversed y scale, matching
    the Notes and spec C1
  - Rectangle widths are subtree totals, so children sit exactly within their parent's
    extent
  - Label ink chosen per level fill (white on green/blue, near-black on purple/amber)
    keeps every label readable in both themes
  - Labels drawn only where the name fits its rectangle, so no text crosses a border
  - Page-colored separators read as clean gaps on both backgrounds
  - Native Altair tooltips with name, size and level in the HTML output
  weaknesses:
  - 'CQ-01 (code): two helper functions, subtree_total() and brightness(), break the
    flat Imports → Data → Plot → Save structure → compute folder totals inline (for
    example one bottom-up pass over the levels) and pick the label ink from a fixed
    per-level list. Likely cause: recursive helper for the layout and a hand-written
    luminance helper.'
  - 'Suggestion: legend entries could read ''Root'', ''Folder'', ''Subfolder'', ''File''
    instead of 0-3.'
