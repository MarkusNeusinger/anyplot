review:
  strengths:
  - 'Correct icicle-chart layout: leaves stretch down to the bottom row per the classic
    convention, root at top spanning the full width'
  - Perceptually-uniform LCHab lightness ramp encodes hierarchy depth within each
    branch — a distinctive, well-executed touch
  - Canonical Imprint categorical order for the four top-level branches (brand green
    first), with neutral/muted semantic anchors correctly reserved for the root total
    and the lone root-level file rather than spent as extra categorical slots
  - Label-visibility threshold correctly hides text on narrow tiles, and per-tile
    luminance-based ink color keeps every visible label legible regardless of the
    tile's own lightness
  - Clean, deterministic, single-file implementation — no randomness needed, no fake
    interactivity
  weaknesses:
  - Title (titlesize=20) reads a little small relative to the 3200 px canvas for a
    short (41-char) title; there is headroom to bump it to ~22-24 without crowding
  - The root "project" band is a large, texture-free block spanning the full top quarter
    — correct per the icicle convention, but reads as a lot of dead visual weight;
    a slightly shorter root row could improve balance
  image_description: |-
    NOTE: The plot_images/ artifacts originally provided for this review were stale
    (rendered from the pre-fix, attempt-1 version of makie.jl — root/config.json
    colors matched the old theme-adaptive NEUTRAL/MUTED constants, not the
    FIXED_NEUTRAL/FIXED_MUTED constants introduced by commit e59e3495). A scratch
    Julia project (CairoMakie + Colors) was instantiated and the current makie.jl
    was re-rendered directly for both themes; this description covers those fresh,
    code-accurate renders. Pixel sampling confirmed FIXED_NEUTRAL (114,111,100) and
    FIXED_MUTED (176,170,152) now render identically in both themes, as intended.

    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Bold dark title top-center ("icicle-basic · julia · makie · anyplot.ai"),
        fully readable; no axis ticks/labels (intentionally hidden, appropriate for
        an icicle chart where per-tile text carries the labeling)
      Data: Root band (taupe/grey, FIXED_NEUTRAL) spans the top quarter with white
        "project · 341 KB total" label. Four branches below in canonical Imprint
        order (src=#009E73 green, docs=#C475FD lavender, tests=#4467A3 blue,
        assets=#BD8233 ochre), each with two more rows of children lightening
        slightly with depth. A thin taupe/grey sliver at the far right (config.json,
        FIXED_MUTED) is correctly too narrow for a label. First categorical series
        (src) is confirmed brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17
      Chrome: Off-white title/labels on dark tiles, dark labels on light-tinted
        deep tiles — ink color is chosen per-tile from that tile's own luminance,
        so nothing is dark-on-dark or light-on-light
      Data: Confirmed pixel-identical to light render for all data fills (branch
        hues, root taupe, config.json taupe) — only background/chrome flipped, as
        required
      Legibility verdict: PASS
