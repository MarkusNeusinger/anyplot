review:
  strengths:
  - 'Correctly implements icicle-specific stacking conventions: leaves stretch down
    to fill the remaining depth rows (config.json spans all 3 rows below root as a
    lone root-level file; inter.woff2 spans to the bottom under fonts), matching the
    spec''s row-stacking behavior rather than a treemap-style nesting.'
  - Branch hue plus a per-depth LCHab lightness ramp gives an intuitive dual encoding
    — hue identifies the top-level branch, lightness identifies depth — and stays
    perceptually consistent while rendering byte-identical data colors in both themes.
  - Per-tile contrast_ink() picks label color from each fill's relative luminance,
    keeping every label legible regardless of tile shade or theme, with no dark-on-dark
    or light-on-light failures observed.
  - Clean, minimal chrome (hidden axis decorations/spines, background-colored gutters
    between tiles) appropriate for a chart type that is driven entirely by geometry
    and inline labels rather than axes.
  weaknesses:
  - Root tile (NEUTRAL) and the config.json 'other' leaf strip (MUTED) use theme-adaptive
    INK-derived colors that change hue/value between light and dark renders. Per the
    Imprint palette rule, data-bearing fills should stay identical across themes and
    only chrome should flip. Give the root band and the muted leaf a single fixed
    neutral hex that doesn't depend on THEME, and keep contrast_ink() to handle per-tile
    text contrast.
  - The label-visibility threshold hides labels on several tiles that are borderline
    wide enough to read (e.g. 'hooks' and 'styles' under src, 'unit' and 'integration'
    under tests) — the required width scales with label character count including
    the ' KB' suffix, which pushes many mid-size folders below the cutoff. Loosen
    the threshold formula or drop the numeric suffix on narrower tiles so more of
    the hierarchy reads without needing the interactive detail view.
  - Six free-standing recursive helper functions (subtree_value, leaf_levels!, layout_icicle!,
    branch_of, contrast_ink, tint_lightness) make this one of the more code-heavy
    anyplot scripts; the recursion is genuinely required for a tree layout, but the
    simplest single-expression helpers (contrast_ink, branch_of) could be inlined
    to reduce structure where it isn't strictly necessary.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "icicle-basic · julia · makie · anyplot.ai" is bold, dark, and clearly legible at top-center. No axis ticks/labels/spines (correctly hidden — an icicle chart needs none). No grid.
      Data: Root band ("project · 341 KB total") is a large near-black neutral rectangle with light text. Below it, four top-level branches use the Imprint palette in canonical order — src=#009E73 (green), docs=#C475FD (lavender), tests=#4467A3 (blue), assets=#BD8233 (ochre) — plus a thin muted-gray strip on the far right for the lone root-level file config.json. Each branch lightens with depth (LCHab lightness ramp), and labels ("components 55 KB", "guides 35 KB", "images 105 KB", "logo.png 45 KB", etc.) sit centered in tiles wide enough to hold them; narrower leaf tiles are correctly left unlabeled per the spec's "hide labels on small nodes" rule. Text contrast is picked per-tile and reads cleanly against every fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title, now in light ink, equally legible against the dark background. Same absence of axes/grid/spines.
      Data: All four branch hues and their depth-lightness ramps are pixel-identical to the light render (green/lavender/blue/ochre unchanged) — only the root band and the muted config.json strip flip in value, since both are built from the theme-adaptive INK/MUTED tokens rather than a fixed Imprint color (flagged as a weakness). Root band is now a near-white rectangle with dark text; the far-right leaf strip is now light gray instead of dark gray. No dark-on-dark or light-on-light failures anywhere — every label stays legible because label color is chosen per-tile from the underlying fill's luminance.
      Legibility verdict: PASS
