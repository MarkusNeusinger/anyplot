review:
  strengths:
  - 'Correct Imprint palette usage by hierarchy depth (green/lavender/blue/ochre),
    first series is the brand green #009E73, and colors stay identical between light
    and dark renders.'
  - 'Clean theme-adaptive chrome: backgrounds are exactly #FAF8F1 (light) / #1A1A17
    (dark), title/subtitle use ink tokens, and each rectangle''s label text color
    is computed per-fill for contrast (luminance-based textColorFor).'
  - Idiomatic, expert-level use of ECharts' custom series + renderItem — the documented,
    correct way to build a chart type (icicle) that ECharts has no native series for.
  - 'Genuine data storytelling: the ancestor chain to the largest leaf (Inter.woff2)
    is outlined with a stroke, giving the chart a clear focal point.'
  - Realistic, well-scaled file-system dataset spanning 4 hierarchy depths with varying
    branch depths (Docs/Tests terminate at depth 2, others reach depth 3), correctly
    demonstrating icicle-specific adjacency behavior.
  - No edge clipping in either render; canvas is the correct 3200x1800; all text fully
    legible in both themes.
  weaknesses:
  - 'Side margins are tight (~2% of canvas width on each side, grid.left/right: 30)
    compared to the generous 130px top margin reserved for the title — consider widening
    left/right to ~50-60 for more balanced whitespace.'
  - The largest-contributor highlight stroke is also applied to the root 'Project'
    node, which is trivially an ancestor of every leaf and dilutes the intended 'path
    to the biggest file' storytelling — consider skipping the root and only outlining
    from the first branching ancestor downward.
  - Data-label font size (13px) sits slightly below the JS-library guideline of ~14px;
    a small bump would improve legibility on the largest, most-visible cells without
    risking overflow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled #FAF8F1 — matches the required light-theme surface exactly, not pure white.
      Chrome: Title "icicle-basic · javascript · echarts · anyplot.ai" in bold dark ink, centered near the top; subtitle "Rectangle width = file size in KB · color = hierarchy depth · outline = largest contributor" in a lighter gray-brown directly below. Both fully visible, not clipped, comfortably legible against the light background.
      Data: Four rows of adjacent rectangles stacked top-to-bottom by hierarchy depth. Row 0 (root "Project") is brand green (#009E73), row 1 (Src/Docs/Tests/Assets) is lavender (#C475FD), row 2 (Components/Api/leaf docs/Fonts + small leaves) is blue (#4467A3), row 3 (leaf files) is ochre (#BD8233). Label text automatically switches between light and dark per-cell for contrast (e.g. white text on green/blue/ochre, dark text on lavender). A thin dark stroke outlines the "Project → Assets → Fonts → Inter.woff2" chain, calling out the single largest file. Small leaf cells below the 48×18px label threshold show no text, just color, avoiding clutter.
      Legibility verdict: PASS — no dark-on-light or light-on-light failures; all title, subtitle, and cell-label text is clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled #1A1A17 — matches the required dark-theme surface exactly, not pure black.
      Chrome: Same title and subtitle, now in light ink (#F0EFE8 title, softer gray subtitle) against the dark background — fully visible, not clipped.
      Data: Identical rectangle layout and identical fill colors to the light render — green (#009E73), lavender (#C475FD), blue (#4467A3), ochre (#BD8233) sampled pixel-for-pixel the same as light. Only the chrome (background, title/subtitle ink, stroke tone) flips; the highlight stroke on the "Project → Assets → Fonts → Inter.woff2" path remains visible against the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures found; all label text remains legible via the same per-cell contrast logic used in the light render.
