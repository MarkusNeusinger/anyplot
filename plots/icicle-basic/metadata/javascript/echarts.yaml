review:
  strengths:
  - Correctly builds a true icicle chart via ECharts' custom series (renderItem +
    api.coord/api.size/api.value) since ECharts has no native icicle type — this is
    the library's documented idiomatic pattern for novel chart types
  - 'Data colors are pixel-identical between light and dark renders and the first
    (root) level uses the mandated #009E73 brand green, with the remaining Imprint
    palette levels in canonical order'
  - Contrast-aware label text color (computed per-block from background luminance)
    keeps every label readable regardless of the block's palette color, in both themes
  - Labels are hidden on rectangles below a width/height threshold instead of overflowing
    or overlapping, and long labels truncate with an ellipsis
  - Realistic, neutral file-system dataset (project source tree with folders and files)
    with plausible KB-scale file sizes, including a large font-file outlier that gives
    the hierarchy meaningful size variation
  - 'Clean theme-adaptive chrome: transparent background over the page token, title
    color from t.ink, animation disabled per the harness contract'
  weaknesses:
  - No on-chart indication of what the rectangle size or the tooltip's 'KB' unit represents
    beyond the mandated title — a one-line subtitle or axis-adjacent caption (e.g.
    'Size in KB') would remove all ambiguity for readers who never open the interactive
    tooltip
  - Depth-based coloring (green/purple/blue/ochre by level) is correct and spec-compliant
    but doesn't add much storytelling beyond 'this is level N' — consider using color/opacity
    to also highlight the single largest contributor (Fonts/Inter.woff2) as a clearer
    focal point
  - Code relies on two small recursive helpers (aggregate, layout) plus renderItem/textColorFor
    — justified by the lack of a native icicle series in ECharts, but keep an eye
    on drift toward more helpers than the KISS structure calls for
  - 'Aesthetic polish is solid (contrast-aware text, consistent gaps, truncation)
    but stops short of ''publication-ready'': no secondary visual cue (e.g. subtle
    border/shadow) sets apart the layout beyond flat fills, so it reads as a well-executed
    default rather than an especially crafted design'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "icicle-basic · javascript · echarts · anyplot.ai" in dark ink, centered, clearly legible; no axes, ticks, or legend are shown (hidden by design, consistent with the icicle chart type and the spec's hierarchy-only encoding).
      Data: Four depth levels colored, top-to-bottom: root "Project" in #009E73 (brand green) spanning full width, depth-1 folders (Src/Docs/Tests/Assets) in purple (#C475FD-ish), depth-2 folders/files in blue, depth-3 leaf files in ochre/tan. Rectangle widths are proportional to aggregated value; labels appear inside blocks wide/tall enough to hold them, with dark text on light blocks (purple, ochre) and white text on darker blocks (green, blue) — all combinations read clearly.
      Legibility verdict: PASS — no title, label, or tick text is unreadable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now in light ink, fully legible against the dark background; no dark-on-dark or light-on-light chrome issues observed.
      Data: Identical rectangle colors and layout to the light render — #009E73 root, same purple/blue/ochre depth colors — confirming the palette is theme-invariant. Per-block label text colors are also unchanged (they are computed from the fixed block color, not the page theme), and every label remains readable: dark text on the light purple/ochre blocks, light text on the green/blue blocks.
      Legibility verdict: PASS — all text remains readable; no dark-on-dark failures found.
