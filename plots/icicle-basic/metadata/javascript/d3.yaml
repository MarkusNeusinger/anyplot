review:
  strengths:
  - Correct, idiomatic icicle layout via d3.stratify + d3.partition (padding, .sum/.sort)
    with x-extent = value and y-extent = depth, matching the spec's top-to-bottom
    orientation
  - 'Dynamic per-cell text contrast: relative-luminance calculation picks dark or
    light label ink from each cell''s own fill, so every label stays readable across
    all 8 palette hues in both themes'
  - Highlight ring around the largest top-level branch gives the chart a clear focal
    point and data-storytelling hook
  - Categories colored by descending value with the largest branch getting Imprint
    position 1 (#009E73), consistent with the canonical-order rule; data colors identical
    between light/dark, only chrome (root fill, stroke, title) adapts
  - Labels are hidden for cells too small to hold them, avoiding overlap/clutter while
    still labeling every cell with sufficient room
  - Root node uses a muted inkSoft fill instead of stark black/white, avoiding a jarring
    full-black/full-white block on either theme
  weaknesses:
  - Node count (25) sits at the low end of the spec's 10-100 recommended range; a
    bit more breadth or an extra nesting level would better showcase the layout's
    hierarchy-scaling story
  - A few deep-leaf labels truncate with an ellipsis at this data density (e.g. 'format…',
    'button.te…') — consider a slightly smaller font size or wider truncation allowance
    for depth >= 2 cells
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "icicle-basic · javascript · d3 · anyplot.ai" in bold dark ink, clearly legible. No axes/legend (not needed — categories are labeled directly in cells). Root cell "project" uses a muted dark-taupe fill with white label text, clearly legible. White strokes (matching page background) separate all cells cleanly.
      Data: Four top-level branches colored by descending value in Imprint canonical order — assets=green #009E73 (largest, ringed in green as the highlighted branch), src=lavender, tests=blue, docs=ochre. Each cell's label uses dark or light ink chosen for contrast against its own fill (verified: white text sits correctly on green/lavender/blue/ochre/dark-root; all pass). Row 1 = root, row 2 = top-level categories, row 3 = subfolders/files, row 4 = deepest leaf files — depth reads top-to-bottom, value reads via width, exactly as an icicle chart should.
      Legibility verdict: PASS — all title, root label, and cell labels are readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title in light ink (#F0EFE8-ish), clearly legible against the dark background. Root cell "project" fill flips to a light warm-gray (theme-adaptive inkSoft), and its label correctly flips to dark ink since the luminance calculation is per-cell dynamic — no dark-on-dark or light-on-light failure here. Cell borders (stroke = page background) read as thin dark seams between the colored cells, still distinguishable.
      Data: Identical hex values to the light render for all four category colors (green/lavender/blue/ochre) and the same highlight ring around the "assets" branch — confirms the Imprint data-color-constancy rule (only chrome flips, not data colors).
      Legibility verdict: PASS — all title, root label, and cell labels remain readable; no dark-on-dark or light-on-light failures spotted in either theme.
