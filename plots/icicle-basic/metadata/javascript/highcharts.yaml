      Data: Root "repo" tile is a large near-white bordered box with dark text (2,935 KB). Below it, 5 top-level branches use the Imprint canonical palette in order — src=brand green #009E73, node_modules=lavender, docs=blue, tests=ochre, assets=matte red. Deeper rows (components/utils/api/styles under src; react/webpack/lodash under node_modules; leaf files at the bottom) inherit their branch hue, progressively tinted toward the page background with depth. Labels are bold and readable where the tile is wide/tall enough; the narrowest leaf tiles correctly omit labels rather than overflow.
