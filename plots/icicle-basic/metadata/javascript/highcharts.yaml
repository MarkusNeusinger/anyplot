review:
  strengths:
  - 'Correct Imprint canonical palette order for the 5 top-level branches (src=green
    #009E73, node_modules=lavender, docs=blue, tests=ochre, assets=matte red); data
    hues are pixel-identical between light and dark renders.'
  - 'Honest, well-documented workaround for the missing core-bundle treemap/icicle
    module: a hand-rolled partition layout drawn with chart.renderer.rect(), consistent
    with the precedent set by treemap-basic/sunburst-basic/sankey-basic, with no faked
    interactivity.'
  - 'Spec compliance is thorough: name/parent/value hierarchy is rolled up bottom-up
    correctly, top-to-bottom (horizontal) orientation matches the spec note, labels
    are suppressed on tiles too small to hold them instead of overflowing, and depth
    is color-grouped by top-level category.'
  - Both renders are clean at every edge (title, root tile, and the leaf row all sit
    inside the canvas margins) and the canvas-dimension gate passed, so there's no
    AR-09 clipping risk.
  - 'Theme-adaptive chrome works correctly: root tile uses elevatedBg/inkSoft border/ink
    text that flips per theme, background is the correct warm off-white / near-black,
    and native SVG <title> tooltips give real hover detail (path + KB + % of repo)
    without simulating a fake UI.'
  weaknesses:
  - The root 'repo' tile occupies a full quarter of the canvas height (PLOT_H / DEPTH_COUNT)
    but shows only a label — a large block of near-empty space at the top. Consider
    giving the root row a smaller fixed height (e.g. ~50-60% of a normal row) and
    distributing the freed height across the deeper, more information-dense rows.
  - 'Design Excellence is only utilitarian: flat-colored rectangles with a uniform
    2px stroke and no refinement beyond the depth-based tint — there''s no visual
    technique (e.g. subtle corner rounding, a lighter hover-style accent, or varied
    stroke weight by depth) that elevates it past a bare wireframe icicle.'
  - Smallest labels ('api', 'unit', and any node whose fitFontSize lands near the
    10px floor) are legible in the full 3200px render but risk becoming close to unreadable
    once scaled down to the ~400px thumbnail used elsewhere on the site — raise the
    effective minimum font size or widen the gap/padding budget so shrink-to-fit doesn't
    bottom out so close to illegible.
  - 'Library Mastery is generic for Highcharts specifically: beyond the necessary
    hand-drawn rects, nothing in the implementation is distinctively Highcharts (e.g.
    no use of Highcharts'' native mouseover/mouseout state events to brighten a tile
    and its ancestry chain on hover, which would meaningfully improve the interactive
    HTML view given the PNG already looks correct).'
