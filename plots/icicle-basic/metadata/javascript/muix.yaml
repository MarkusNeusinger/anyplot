review:
  strengths:
  - 'Correct icicle/partition math: bottom-up value aggregation (computeValue) exactly
    mirrors du-style directory sizing, and partition() produces proportional, gapless
    bands per the spec''s width-proportional-to-value requirement.'
  - 'Palette compliance is excellent: node_modules/ uses Imprint #009E73 (verified
    pixel-exact), and remaining top-level branches follow the canonical Imprint order
    (lavender, blue, ochre); data colors are byte-identical between light and dark
    renders.'
  - fitsLabel() correctly hides labels on boxes too small to hold them, matching the
    spec's note to label rectangles with sufficient space and hide labels for small
    nodes.
  - 'Solid harness compliance: single default export, sized from window.ANYPLOT_SIZE,
    skipAnimation set, and no edge-clipping (AR-09 checked clean on all four edges
    in both renders).'
  - Realistic, in-range dataset (41 nodes, within the spec's 10-100 recommendation)
    with a believable size distribution.
  weaknesses:
  - 'Dark-mode text legibility bug at the leaf-file (deepest) row, and borderline
    at the subdirectory row: textColorForRgb() (muix.tsx L223-225) picks between t.ink
    and t.pageBg based on the fill''s own luminance, but those are theme tokens (t.ink
    is dark #1A1A17 in light theme, light #F0EFE8 in dark theme) rather than fixed
    absolute colors. Since data fills are intentionally theme-independent, a fill
    classified as light gets t.ink, which is light in dark theme -- producing near-white
    text on an already near-white leaf tint (measured contrast approx 1.1:1, e.g.
    ''index.js / 180 KB''). Fix: use two fixed, theme-independent absolute colors
    in this function instead of t.ink/t.pageBg, so the contrast decision depends only
    on fill luminance, never on which theme is active.'
  - Library Mastery is thin beyond the required custom-mark composition primitive
    -- no use of MUI X's own ChartsTooltip/ChartsLegend, relying instead on a plain
    SVG <title> for hover text.
  - Design Excellence is competent but generic -- the tint ramp and gutters are clean,
    but there's no additional visual hierarchy (shadow, weight variation, accent)
    beyond the color-by-branch scheme.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold dark title "icicle-basic · javascript · muix · anyplot.ai" and muted olive subtitle "Repository file sizes by directory depth · width ∝ size (KB)" -- both crisp and fully readable.
      Data: 4-row icicle. Grey repo/ root band (white text). Four Imprint-colored top-level directories: node_modules/ = #009E73 (verified pixel-exact), src/ = lavender, tests/ = blue, docs/ = ochre -- canonical Imprint palette order. Subdirectory row uses lighter tints of the parent branch hue; leaf-file row uses the lightest tints. All text (root, directories, subdirectories, and the handful of wide-enough leaf boxes: index.js, webpack.js, tsc.js, Modal.tsx, api.ts) renders in dark ink and is clearly legible against every fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: white title/subtitle, both fully readable.
      Data: confirmed pixel-identical fill colors to the light render (e.g. node_modules/ = rgb(0,158,115) in both renders). Root and top-level-directory text remain legible (dark-on-green at depth 1 measures ~5:1 contrast; white-on-green at depth 2 is readable). However, the deepest, most-tinted leaf-file row fails: fill rgb(83,255,208) (luminance 0.78) paired with text rgb(240,239,232) (luminance 0.86) gives a measured WCAG contrast ratio of approximately 1.1:1 -- the text is effectively invisible against its own background. This reproduces on every leaf-level label in the dark render (e.g. "index.js / 180 KB").
      Legibility verdict: FAIL (leaf-row labels only; chrome and upper hierarchy rows pass)
