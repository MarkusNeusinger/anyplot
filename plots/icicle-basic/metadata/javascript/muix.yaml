review:
  strengths:
  - 'Clean four-row icicle: root on top, each child partition nested exactly within
    its parent''s width, page-colored gutters separating siblings'
  - Branch hue from the Imprint palette in canonical order with lighter tints per
    depth keeps each subtree one color family in both themes
  - Label ink chosen per fill by luminance, and labels are width-gated so small nodes
    stay unlabeled as the spec asks
  - 'Idiomatic MUI X composition: a custom SVG layer inside ChartsContainer driven
    by useDrawingArea, with native SVG <title> tooltips for the HTML view'
  weaknesses:
  - 'DQ-03 (both): node_modules totals 950 KB with typescript/ at 250 KB and react/index.js
    at 180 KB, implausibly small for these packages (real installs run to tens of
    MB) → scale the node_modules branch to realistic sizes, e.g. in MB, keeping it
    the largest branch. Likely cause: the hard-coded VALUE numbers in the node_modules
    rows (lines 59–72).'
  - 'CQ-04 (code): lines 215–227 write out the WCAG relative-luminance formula (13
    lines) → `getLuminance(node.fill)` (@mui/material/styles), which uses the same
    0.03928 / 2.4 transfer. Likely cause: hand-rolled contrast check.'
  - 'Suggestion: use the theme-adaptive muted anchor (#6B6A63 light / #A8A79F dark)
    for the root instead of the fixed #6E6A61.'
  - 'Suggestion: most leaf rectangles are tall but too narrow for a horizontal label;
    a vertical label would let more leaves be named.'
