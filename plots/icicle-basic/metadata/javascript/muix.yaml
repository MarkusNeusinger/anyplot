      Data: four equal-height rows. Row 1: the root "repo/ · 2,100 KB total" as one full-width grey (#6E6A61) block with white label. Row 2: dist/ (#009E73), src/ (#C475FD), tests/ (#4467A3), docs/ (#BD8233) with widths proportional to 950/600/350/200. Row 3: 11 subdirectories in lighter tints of their branch hue, labelled with name + size except the narrow docs/reference/. Row 4: 25 files in the lightest tints; only vendor.js, hero.webp and api.ts carry labels, the others are narrow and unlabelled. Thin page-colored gutters separate every rectangle; children sit within their parents. First series is #009E73.
