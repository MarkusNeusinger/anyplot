review:
  strengths:
  - 'Correct icicle semantics: adjacent horizontal bands (not nested treemap), root
    at top with depth increasing downward, matching the spec''s ''horizontal orientation,
    root at top'' note'
  - Bottom-up du-style value aggregation (directory value = sum of children) is an
    authentic, spec-appropriate touch
  - Branch-color inheritance (each top-level directory owns one Imprint hue, all descendants
    tint from it) gives immediate visual grouping by category, directly satisfying
    the spec's 'color by hierarchy level or category' note
  - Contrast-aware text color via a relative-luminance calculation (choosing ink vs.
    pageBg per rectangle) keeps labels legible across the full range of auto-generated
    tints — a genuinely sophisticated technique
  - 'First categorical series is correctly #009E73; remaining top-level branches follow
    canonical Imprint order; chrome (background, title, subtitle) is fully theme-correct
    in both renders'
  - Built via ChartContainer + useDrawingArea, the library's documented composition
    primitive for a custom mark MUI X community doesn't natively support
  - Labels are intelligently suppressed on rectangles too small to hold them, per
    the spec's explicit 'hide labels for small nodes' instruction
  weaknesses:
  - Depth-3/4 (subdirectory/file level) labels are small (12-14px CSS) and many leaf
    rectangles show no label at all because they don't fit at this data density (41
    nodes) — legible at full desktop resolution but likely to disappear almost entirely
    when the PNG is scaled to a ~400px mobile thumbnail. Consider nudging LABEL_FONT_SIZE
    up slightly for the two deepest levels, or reducing gutter/padding overhead, to
    buy a bit more mobile legibility.
  - The root 'repo/' band fills with `t.ink`, a chrome/text token that flips between
    themes — so the root rectangle's color literally changes from near-black (light
    render) to near-white (dark render), while every other branch keeps identical
    colors across themes. Even read as an intentional 'neutral total' anchor, it stands
    out as the one inconsistent data-color rule in an otherwise fully theme-stable
    palette. Consider a fixed, theme-independent neutral fill for the root instead
    of the flipping ink token.
  - 'CQ-01 (KISS): the file carries a sizeable helper-function surface (tree walk/partition,
    HSL color-space conversions, label-fit checks) — largely justified because MUI
    X has no native icicle/partition chart, but worth trimming if a simpler equivalent
    emerges.'
  - 'DE-03: branch-color grouping already satisfies the spec''s minimum ask but doesn''t
    yet add a distinct storytelling layer beyond that — e.g. a callout or subtle emphasis
    on the single largest branch (node_modules/) would sharpen the insight.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "icicle-basic · javascript · muix · anyplot.ai" in bold dark text, clearly readable and centered; subtitle "Repository file sizes by directory depth · width ∝ size (KB)" in a lighter ink tone below it, also readable.
      Data: Four depth rows of adjacent rectangles. Root "repo/ · 2,100 KB total" is a near-black band with light text. Row 2 shows the four top-level directories (node_modules/ teal-green #009E73-like, src/ purple, tests/ blue, docs/ tan/ochre) — canonical Imprint order, dark text labels readable on each. Row 3 shows lighter tints of the same hues per subdirectory (react/, webpack/, typescript/, eslint/, components/, utils/, styles/, unit/, integration/, guides/, reference/), each labeled with name + KB value in dark text. Row 4 (leaf files) uses the lightest tints; only the widest boxes (index.js, webpack.js, tsc.js, Modal.tsx, format.ts, api.ts) carry visible labels — narrower leaf boxes correctly suppress their labels rather than overflow.
      Legibility verdict: PASS — all visible text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light/off-white text, fully legible against the dark background.
      Data: Same four-row structure. The four top-level directory bands (node_modules/, src/, tests/, docs/) and all descendant tint bands are pixel-identical in hue to the light render — confirmed no drift. The one exception is the root "repo/" band: it flips from near-black (light render) to a near-white/cream fill (dark render) because its fill is the theme-adaptive `ink` token rather than a fixed color; its text still contrasts correctly (dark text on the now-light root band) but the band's own color is not theme-stable like every other node's.
      Legibility verdict: PASS — no dark-on-dark failures found; the root band's color-flip is a palette-consistency note, not a legibility failure (contrast is fine in both renders).
