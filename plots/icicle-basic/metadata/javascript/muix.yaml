review:
  strengths:
  - 'Correct icicle layout: one row per level with the root at the top, every child
    within its parent''s horizontal extent, siblings adjacent with thin page-colored
    gutters; leaf sums fall out of a bottom-up aggregation (dist 950, src 600, tests
    350, docs 200, total 2,100 KB all verified)'
  - 'Color by top-level branch in canonical Imprint order (#009E73, #C475FD, #4467A3,
    #BD8233), tinted lighter per depth, so branch membership and hierarchy level read
    at once and identically in both themes'
  - Label ink chosen per rectangle from the fill's luminance via MUI's getLuminance,
    so every label is readable against its fill in both themes
  - 'Two-tier label typography: sans-serif bold names over monospace values, with
    font size stepping down by depth; labels are suppressed on rectangles too narrow
    to hold them, as the Notes ask'
  - Uses ChartsContainer composition with a custom SVG layer positioned by the useDrawingArea
    hook, the community MUI X way to draw a chart type it has no component for; native
    SVG <title> tooltips give path, size and share of parent in the HTML
  weaknesses:
  - 'VQ-07 (both): the root block is filled with the custom hex #6E6A61, which is
    neither an Imprint position nor the theme-adaptive muted anchor → the muted anchor
    (#6B6A63 light / #A8A79F dark), with label ink still chosen by luminance. Likely
    cause: the ROOT_FILL constant.'
  - 'CQ-04 (code): lines 205–214 parse the hex and blend each channel toward the paper
    by hand, which @mui/material/styles'' lighten(color, coefficient) computes in
    one call → node.fill = lighten(hex, tintFactor). Likely cause: a written-out color
    blend instead of the MUI color helper already imported alongside getLuminance.'
  - 'Suggestion: 21 of the 25 leaf rectangles carry no label although each is about
    235 px tall; a vertical (rotated) name for the tall narrow leaves would identify
    the files in the static PNG.'
  - 'Suggestion: the root row spends a quarter of the chart height on one grey block;
    a shorter root row would give the leaf row more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241).
