review:
  strengths:
  - Correctly builds the icicle chart's core semantic — adjacent rectangles laid out
    in layered rows, sized by proportional share — entirely from core Chart.js `bar`
    type via floating-bar ranges ([x0, x1] per node), respecting the library's 'no
    plugin/workaround' rule.
  - A deterministic queue-based partition algorithm computes each node's horizontal
    span from its parent's span and value, mirroring d3's partition layout without
    any extra dependency.
  - Color is inherited down the hierarchy from each top-level branch, visually reinforcing
    parent-child grouping across all three rows.
  - The custom `afterDatasetsDraw` plugin renders node names centered on each rectangle
    and automatically hides labels that don't fit (`rectWidth < textWidth + 16`),
    directly satisfying the spec's 'label if space, else hide' requirement.
  - The root 'project' node swaps ink/pageBg for its own fill/text pair so it stays
    legible in both themes despite being the neutral top-level node — data colors
    otherwise stay identical between light and dark, only chrome flips.
  - Fully in-memory, deterministic dataset (15 nodes, 3 levels) with no external dependencies
    beyond Chart.js.
  weaknesses:
  - The plugin-drawn rectangle labels use a hardcoded 'Segoe UI' font stack while
    the title/axis/tick labels rely on Chart.js's default font — pick one font family
    for a fully consistent typographic voice.
  - In dark theme, rectangle labels are dark text (t.pageBg) on mid-saturation palette
    fills (e.g. black text on the green 'src'/'components' segments) — contrast margin
    is noticeably tighter than the white-on-color pairing used in light theme; worth
    spot-checking WCAG contrast for the darkest palette entries.
  - No legend maps top-level branch colors to folder names beyond the in-rectangle
    labels; harmless here since every visible rectangle carries its own name, but
    would help if a future revision hides more labels at low zoom.
  - The narrowest level-2 slivers (webpack, eslint under config) sit almost seamlessly
    against their neighbor at this size — a touch more borderWidth or spacing would
    keep them visually distinct even without room for a label.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), matches the Imprint light surface — not pure white.
      Chrome: Title "icicle-basic · javascript · chartjs · anyplot.ai" is bold dark text, fully visible, not clipped. Y-axis row labels (Project, Folder, File) and x-axis tick labels (0%–100%) are dark-gray/soft-ink and clearly readable. Axis titles "Share of Project Size" (x) and "Hierarchy Level" (y) are dark ink and legible. Subtle vertical gridlines are visible without dominating.
      Data: Root "project" row is rendered near-black with white "project" label (intentional ink/pageBg swap for the neutral root). Folder row shows four palette-colored segments — green "src" (first series, #009E73-consistent), purple "tests", blue "docs", amber "config" — each with a white centered label. File row subdivides each folder into its children, inheriting the parent's color, with white labels on all boxes wide enough to hold text; the two narrowest config children (webpack, eslint) correctly show no label. All text is legible against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title is bold off-white text, fully visible, not clipped. Row labels and tick labels are light-gray/soft-ink and readable against the dark background. Axis titles are light ink and legible. Gridlines remain subtle but visible.
      Data: Data colors are identical to the light render (green/purple/blue/amber segments unchanged) — confirming only chrome flipped. The root "project" row now renders as a light off-white box with dark "project" text (the ink/pageBg swap correctly inverted for the theme). Folder- and file-row rectangles keep their palette colors, now labeled with dark text (t.pageBg is dark in this theme) — readable on all four hues, though contrast margin is visibly tighter on the greener/bluer segments than the white-on-color pairing in light mode. No dark-on-dark or light-on-light failures observed; no clipped or missing text.
      Legibility verdict: PASS
