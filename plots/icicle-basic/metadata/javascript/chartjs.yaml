review:
  strengths:
  - Faithfully reproduces an icicle chart with core Chart.js (no unsupported treemap/sankey
    plugin) via a horizontal floating-bar trick — each hierarchy level is a row, each
    node a [x0, x1] range bar sized by its share of the parent, exactly matching the
    spec's partition-layout semantics
  - Custom afterDatasetsDraw plugin computes per-segment label color via WCAG relative-luminance
    contrast against each fixed fill color, guaranteeing readable text on every rectangle
    in both themes
  - Labels are hidden when a rectangle is too narrow to fit the text (measureText
    check), matching the spec's explicit 'hide labels for small nodes' guidance
  - Correct Imprint palette usage (src/tests/docs/config = palette[0..3], root uses
    the theme-adaptive ink/pageBg swap for a distinct root treatment), thin borderColor
    separators between adjacent segments, and identical data colors between light
    and dark renders
  - Both renders pass the theme-readability and canvas-dimension checks cleanly, including
    at the 400px mobile-preview scale
  weaknesses:
  - Several small helper functions (relativeLuminance, contrastRatio, labelColorFor)
    plus the plugin object push the file past strict KISS single-script simplicity
    — acceptable given they implement a genuine accessibility feature, but a future
    pass could inline/simplify the contrast math if the file grows further
  - Root row uses a distinct ink/pageBg swap rather than a palette color, which is
    a deliberate and effective design choice but means the root node sits slightly
    outside the categorical color story used for the rest of the hierarchy — worth
    a one-line code comment if this trips up future maintainers
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent with the Imprint light surface — not pure white.
      Chrome: Title "icicle-basic · javascript · chartjs · anyplot.ai" in dark bold text, clearly readable. Y-axis row labels (Project, Folder, File) and axis titles ("Hierarchy Level", "Share of Project Size") in dark ink, fully legible. X-axis percentage ticks (0%-100%) in soft dark grey, legible. Subtle vertical gridlines only on the x-axis.
      Data: Three stacked horizontal rows form the icicle partition. Root row is a single near-black bar spanning 0-100% labeled "project" in white text. Folder row splits into src (#009E73 green), tests (violet/purple), docs (blue), config (amber) — first series is the mandated brand green. File row further subdivides each folder's span into its children, with labels shown only where the segment is wide enough (components, utils, api, styles, unit, integration, guides all labeled; a few narrow segments — e.g. docs/reference, config's two children — are intentionally left unlabeled per the spec's "hide labels for small nodes" guidance). Thin light-colored borders separate adjacent segments.
      Legibility verdict: PASS — no light-on-light or unreadable text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Title in white/light text, clearly readable. Axis titles and row labels in light ink, tick labels in soft light grey — all legible against the dark background. Gridlines subtle but visible.
      Data: Identical branch/file colors to the light render (green/violet/blue/amber unchanged — only chrome flipped as required). Root row flips to a warm off-white bar (the theme-adaptive ink/pageBg swap) with dark text label "project", preserving strong contrast. Per-segment text labels use the same luminance-based dark/light color choice as the light render since fill colors are identical across themes, so labels remain readable in both.
      Legibility verdict: PASS — no dark-on-dark failures; all text elements have strong contrast against their local background.
