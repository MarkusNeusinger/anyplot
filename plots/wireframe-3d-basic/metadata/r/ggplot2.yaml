review:
  strengths:
  - 'Genuinely inventive solve for ggplot2''s lack of 3D grammar: a hand-built orthographic
    camera (view/right/up basis vectors from elevation 30 / azimuth 45) projects the
    (x, y, z) mesh into 2D screen coordinates, then draws it with plain geom_path/geom_segment/geom_text
    -- matches the spec''s exact camera angle request.'
  - 'Full spec feature coverage: grid lines rendered in both x and y directions, a
    labeled X/Y/Z axis box with tick marks, and the ripple surface z = sin(sqrt(x^2+y^2))
    example from the spec.'
  - 'Title format is exact: ''wireframe-3d-basic · r · ggplot2 · anyplot.ai'', centered,
    no overflow or clipping in either theme.'
  - 'Clean, minimal code: no functions/classes, only ggplot2 + ragg imported, both
    used; theme_void + coord_fixed keep the projection math as the only real complexity.'
  - 'Theme chrome flips correctly (PAGE_BG, INK, INK_SOFT) while the mesh color (brand
    green #009E73) stays identical between light and dark renders.'
  weaknesses:
  - 'Grid density creates visual clutter: with grid_n=25 (625 points) and both directional
    path sets drawn at alpha=0.6/linewidth=0.3, the interior of the mesh reads as
    a dense crosshatched texture rather than a legible wireframe grid, especially
    where projected lines nearly overlap near the two raised ''ripple'' humps. Reduce
    grid_n toward ~15-18 or drop alpha further (e.g. 0.35-0.45) so individual grid
    cells stay distinguishable.'
  - Z-axis tick labels (1, 0, -1) sit directly above the Y-axis tick labels (0, 3,
    6) in the same screen column, both in INK_SOFT at the same font size with no visual
    differentiation -- a viewer can misread the two label sets as one continuous number
    line. Increase the horizontal offset on z_ticks or shift Y-axis tick placement
    so the two label groups are clearly separated.
  - Tick label font size (geom_text size = 2.8mm, roughly 8pt) is on the small side
    relative to the 3200x1800 canvas and the bold 3.6mm axis titles right next to
    it -- bump tick label size slightly (e.g. 3.2-3.4mm) for better balance and legibility
    at reduced viewport widths.
  - No back/top box edges or floor grid reference plane -- only three axis edges are
    drawn from the front-left-bottom corner, which is a defensible minimalist choice
    but leaves the mesh's spatial grounding slightly ambiguous compared to a full
    3D axis box.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- neither pure white nor dark.
      Chrome: Title "wireframe-3d-basic · r · ggplot2 · anyplot.ai" centered top in dark ink, fully visible, no clipping. Bold "X", "Y", "Z" axis labels in dark ink at the three box endpoints. Numeric tick labels (-6..6 on the X/Y diagonals, -1/0/1 on the Z vertical) in a muted grey-brown (INK_SOFT), all legible against the light background. Three axis edges (X, Y, Z) drawn as dark grey-brown line segments meeting at the front-bottom-left corner.
      Data: Single-series wireframe mesh in brand green (#009E73), alpha-blended, forming a ripple/crown-shaped surface with lines running in both grid directions per the spec requirement. Green reads clearly against the off-white background, though the mesh interior is visually dense where projected lines cross.
      Legibility verdict: PASS -- all title, axis, and tick text is readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- neither pure black nor light.
      Chrome: Title in near-white ink, fully visible and correctly positioned. "X", "Y", "Z" axis labels in near-white bold text, clearly legible. Numeric tick labels in a lighter muted grey (INK_SOFT dark-mode value), clearly distinguishable from the near-black background -- no dark-on-dark failures observed. Axis edges rendered in the same light grey as the tick labels.
      Data: Mesh color is identical brand green (#009E73) to the light render -- only the chrome (background, ink, axis lines, tick labels) flipped, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS -- all text remains clearly readable against the dark background; no dark-on-dark or contrast failures.
