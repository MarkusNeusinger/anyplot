review:
  strengths:
  - 'Genuinely sophisticated 3D-in-2D engineering: manual perspective projection (elevation
    30°, azimuth 45°) combined with a painter''s-algorithm hidden-line removal (quads
    sorted back-to-front, opaque fill occluding farther mesh lines) — a real technical
    achievement given ggplot2 has no native 3D grammar.'
  - Depth-based alpha fading on mesh edges (bolder near the camera, softer far away)
    adds a convincing depth cue without introducing a second hue.
  - Single-series brand green (#009E73) is used consistently and is pixel-identical
    between light and dark renders; only chrome (axis lines, floor plane, tick/label
    colors) flips correctly between themes.
  - All three axes (X, Y, Z) are clearly labeled with tick marks, a floor reference
    plane grounds the surface spatially, and the title matches the required '{spec-id}
    · r · ggplot2 · anyplot.ai' format exactly.
  - Data (ripple function z = sin(sqrt(x²+y²))) matches the spec's suggested example
    precisely, with a sensible axis range and deterministic generation.
  weaknesses:
  - X-axis and Y-axis tick labels ('-6' and '-3', mirrored on both the left and right
    sides) are positioned inside the wireframe's screen footprint and visually overlap
    mesh strands crossing directly through the glyphs, confirmed by close crops in
    both light and dark renders. Push the '-3'/'-6' tick anchors further outside the
    mesh's projected footprint (matching the offset technique already used for the
    '0'/'3'/'6' ticks and the Z-tick labels) so no tick text sits on top of mesh lines.
  - Grid resolution (20x20) sits at the very bottom of the spec's recommended 20x20-50x50
    range; a modest bump (e.g. 28-32) would add surface fidelity without hurting legibility
    now that hidden-line removal keeps the mesh readable.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "wireframe-3d-basic · r · ggplot2 · anyplot.ai" centered at top in dark ink, clearly readable. Axis lines (front-left-bottom corner box) in medium-dark gray. "X", "Y", "Z" axis labels in bold dark ink at the far ends of each axis line. Tick labels (-6, -3, 0, 3, 6 for X and Y; -1, 0, 1 for Z) in a softer gray.
      Data: A single ripple surface z = sin(sqrt(x^2+y^2)) rendered as a green (#009E73) wireframe mesh of diamond-shaped quads, with nearer quads occluding farther mesh lines (hidden-line removal) and edge opacity fading with depth. A faint floor plane outline grounds the surface. First (only) series is the brand green.
      Legibility verdict: PASS overall, with one caveat — the X/Y tick labels "-6" and "-3" (appearing mirrored on both the left and right sides of the Z axis) sit directly on top of the wireframe mesh, with thin green mesh lines crossing through the glyphs. The numbers remain decipherable (dark-gray text has enough contrast against both the pale background and the thin green lines) but the overlap is a real, confirmed layout flaw, not just proximity.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title in light ink, clearly readable. Axis lines in light gray, "X"/"Y"/"Z" labels in bold near-white, tick labels in a softer light gray. No dark-on-dark failures observed — all chrome text has strong contrast against the near-black background.
      Data: Identical green (#009E73) wireframe mesh, same shape, same depth-fade behavior as the light render — confirms data colors are unchanged between themes; only the chrome (background, axis lines, text colors) flipped.
      Legibility verdict: PASS overall, with the same caveat as the light render — "-6" and "-3" tick labels overlap the mesh lines (confirmed via cropped close-up), though the light-gray text against the dark green lines remains legible.
