review:
  strengths:
  - Creative, well-documented manual 3D->2D projection (elevation 28 deg, azimuth
    40 deg) that faithfully substitutes for the unavailable highcharts-3d module,
    with clear code comments explaining the rationale
  - Height-based mesh color gradient built correctly from imprint_seq (green -> blue)
    for continuous data, instead of the categorical palette
  - Data colors are pixel-identical between light and dark renders; only chrome (ink,
    backgrounds, axis-frame color) adapts to theme
  - Grid size (27x27) sits comfortably inside the spec's recommended 20x20-50x50 range,
    and the ripple function z = sin(sqrt(x^2+y^2)) matches the spec's suggested example
  - Fully deterministic data generation, core-only Highcharts usage (no forbidden
    add-on modules), animation disabled at both chart and series level
  weaknesses:
  - 'Header block is missing the mandatory ''// License: Highcharts - commercial license,
    free for non-commercial use (highcharts.com/license)'' line required by prompts/library/highcharts.md
    - restore it as the 4th header line'
  - X-axis and Y-axis '-6' tick labels both project to the shared frame corner and
    land immediately next to the Z-axis's '-1.0' tick label, creating a crowded, ambiguous
    label cluster that a viewer could misread as a 4th Z tick - push the '-6' labels
    further apart or to distinct sides
  - Mesh color is computed per full grid row/column average z rather than per local
    vertex/segment, so the gradient reads as a smooth wash rather than tightly tracking
    local peaks and valleys
  - The central ripple ring creates a visually tangled cluster of overlapping lines
    that is hard to parse at a glance - inherent to the chosen function/viewing angle,
    a slightly different azimuth or elevation could reduce the tangle
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: bold dark title "wireframe-3d-basic · javascript · highcharts · anyplot.ai" centered top, gray subtitle "z = sin(√(x²+y²)) ripple surface" beneath it. Three dark-gray reference lines form an X/Y/Z axis frame from a shared bottom-left corner, with bold "X"/"Y"/"Z" axis titles at the line ends and tick labels ("0", "6", height values "1.0"/"0.0"/"-1.0") near each line. All primary text is readable, EXCEPT the "-6" tick labels for the X and Y axes both anchor to the shared corner and land right next to the Z-axis's "-1.0" tick, forming a crowded, ambiguous label cluster.
      Data: dense teal-to-blue gradient wireframe mesh (27x27 grid) showing a central peak surrounded by ripple valleys/rings; first-series color reads as the brand green #009E73 at the low end of the gradient, shifting to blue at the high end (imprint_seq).
      Legibility verdict: PASS (all text technically readable; corner tick-label crowding flagged as a weakness, not a failure).

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: all chrome inverts to light - bold white title, light-gray subtitle, white "X"/"Y"/"Z" axis titles, light-gray tick labels, light-gray/white axis reference lines. No dark-on-dark failures observed; every chrome element reads clearly against the dark surface. The same "-6"/"-1.0" corner crowding from the light render is present here too.
      Data: identical teal-to-blue gradient mesh colors as the light render - confirms only chrome flips between themes, data colors are constant.
      Legibility verdict: PASS (all text technically readable; corner tick-label crowding flagged as a weakness, not a failure).
