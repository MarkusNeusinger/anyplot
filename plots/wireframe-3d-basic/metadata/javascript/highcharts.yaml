review:
  strengths:
  - Correct, well-documented workaround for Highcharts core lacking a 3D module —
    the hand-rolled 3D-to-2D orthographic projection is clean, readable, and clearly
    commented instead of faking it or importing an unavailable add-on.
  - Height-based Imprint imprint_seq gradient coloring on the mesh gives a real visual
    cue toward the ripple's peak, and is identical between light and dark renders.
  - Theme-adaptive chrome is correct in both renders — axis frame, tick labels, and
    titles all use t.ink / t.inkSoft tokens and stay legible on both surfaces.
  - Title format is exactly correct, data generation is deterministic, and the harness
    contract is fully respected (animation disabled, no explicit width/height, credits
    disabled, transparent background).
  weaknesses:
  - The X-axis '-6' tick label and Y-axis '-6' tick label are both anchored at the
    shared origin corner with only an 18px-down / 22px-left offset, so at full canvas
    size they render on top of each other into what looks like a single '-6' — a viewer
    cannot tell two separate ticks are present. Increase the separation (e.g. offset
    the X tick further down and/or the Y tick further left, or nudge one diagonally)
    so both remain independently legible. Same issue reproduces identically in both
    renders.
  - The code comment says 'ripple surface z = sin(sqrt(x^2 + y^2))' (matching the
    spec's suggested formula) but `zAt` actually computes the decaying sinc function
    sin(r)/r, whose amplitude falls off with radius. This makes the surface nearly
    flat everywhere except the central bump instead of showing repeating ripples across
    the whole grid, understating the wireframe's core value of revealing structure.
    Either fix the comment to describe sinc accurately, or switch to the spec's undamped
    ripple formula for a more feature-rich surface across the whole domain.
  - Axis titles are plain single letters 'X'/'Y'/'Z' with no indication of what they
    represent (e.g., a note of the plotted function) — acceptable for an abstract
    math surface but a missed opportunity to reinforce the story.
  - 'Library Mastery is generic: the implementation is built from plain line/scatter
    series and dataLabels, which is necessary given Highcharts core''s missing 3D
    module but doesn''t showcase any feature distinctive to Highcharts specifically.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark-ink title "wireframe-3d-basic · javascript · highcharts · anyplot.ai" centered at top with generous margin. Below it, a dark-gray L-shaped axis frame (X, Y, Z) meets at a shared origin corner bottom-left, with tick labels -6/0/6 along X and Y and 1.0/0.0/-0.2 along Z, plus bold axis-title letters "X", "Y", "Z" at the frame ends. All chrome text is clearly readable against the light background.
      Data: A diamond-shaped wireframe mesh (27x27 grid lines in both directions) rendered in the Imprint imprint_seq green-to-blue gradient, colored by average row/column height. The grid is tilted in an isometric-style perspective (elevation ~28°, azimuth ~40°); a subtle converging/wavy moiré pattern near the center of the mesh represents the sinc-shaped ripple's central peak, while the surface is nearly flat toward the outer edges (the sinc amplitude decays with radius).
      Legibility verdict: PASS overall, with one specific issue — the "-6" tick label belonging to the X-axis and the "-6" tick label belonging to the Y-axis are both anchored at the same origin corner and their small offsets (18px down vs 22px left) are not enough to visually separate them at full canvas size; they render as a single overlapping "-6" instead of two distinct ticks. No other overlap or illegible text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, same axis frame, but now rendered in light off-white ink so it stays fully readable against the dark background. No dark-on-dark text found — title, tick labels, and axis titles all switch correctly to light tones.
      Data: The mesh gradient colors are visually identical to the light render (same greens/teals along the imprint_seq scale) — confirming the data-color identity rule holds; only the chrome (background, axis-frame line color, text color) flipped for the theme.
      Legibility verdict: PASS overall, with the same X/Y "-6" tick-label overlap issue reproduced identically at the origin corner. No dark-on-dark or light-on-light failures found otherwise.
