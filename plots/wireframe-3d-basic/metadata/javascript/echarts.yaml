review:
  strengths:
  - Custom 3D-to-2D projection engine (elevation 30 deg, azimuth 45 deg) built entirely
    from scratch on ECharts' graphic.elements API -- a well-engineered workaround
    given ECharts has no native 3D wireframe support and echarts-gl is disallowed
  - Depth-based back-to-front draw order with opacity fade (0.4-0.9) creates a convincing
    pseudo-3D depth cue without any hidden-line-removal complexity
  - Careful axis-corner placement (choosing the corner farthest from the camera for
    X/Y, and the x+y=0 corner for Z to avoid the peak) keeps tick labels and axis
    titles clear of the mesh in both themes
  - Theme-adaptive chrome fully correct -- identical brand-green (#009E73) data color
    and correct background/text tokens in both light and dark renders
  - Title format, axis labeling (X/Y/Z with tick marks), grid density (24x24, within
    the spec's 20-50 range), and camera angle all match the specification precisely
  weaknesses:
  - 'Z-axis midpoint tick renders as "-0.0" instead of "0.0" in both light and dark
    renders -- a floating-point sign artifact from (zMin + zMax) / 2 then .toFixed(1).
    Fix by guarding near-zero values before formatting, e.g. `(v === 0 ? 0 : v).toFixed(1)`
    or `(Math.abs(v) < 1e-9 ? 0 : v).toFixed(1)`.'
  - 'The wireframe converges into a dense, chaotic crisscross right at the surface
    peak because z = sin(r) (with r===0 special-cased to 1) has a sharp cusp rather
    than a smooth apex -- the center reads as a jagged starburst instead of a clean
    dome. Consider a smoother ripple function (e.g. sinc: sin(r)/r, which is naturally
    1 at r=0) to keep the peak visually coherent.'
  - Depth-fade hierarchy is present but subtle enough that the data storytelling (near
    vs. far mesh) doesn't strongly guide the eye beyond the overall dome shape.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "wireframe-3d-basic · javascript · echarts · anyplot.ai" is dark and centered at top, clearly legible. Axis titles X, Y, Z are bold dark text, clearly legible. Numeric tick labels (-4..4 on X/Y, -1.0..1.0 on Z) are soft gray, legible against the light background. The three partial axis edges (X, Y at the base, Z on the left) are drawn in soft gray, visible but unobtrusive. One tick label reads "-0.0" instead of "0.0" on the Z axis (floating-point sign artifact).
      Data: Single-hue brand green (#009E73) wireframe mesh, grid lines running in both x and y directions, with a subtle opacity fade (dimmer far side, brighter near side) giving a soft depth cue. The mesh forms a dome/ripple shape with a sharp, slightly chaotic crisscross convergence right at the central peak.
      Legibility verdict: PASS (title, axis titles, and tick labels all readable; only the "-0.0" tick text is a minor formatting defect, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Title is white/light and centered at top, clearly legible. Axis titles X, Y, Z are bold white text, clearly legible. Numeric tick labels are light gray, legible against the dark background -- no dark-on-dark failure. Axis edges are light gray, visible but subtle. The same "-0.0" tick-label artifact appears on the Z axis.
      Data: Data color is identical brand green (#009E73) to the light render -- only chrome (background, text, axis-line color) flipped, as required. Same crisscross convergence pattern at the peak.
      Legibility verdict: PASS (no dark-on-dark text; all chrome elements clearly readable against the near-black surface).
