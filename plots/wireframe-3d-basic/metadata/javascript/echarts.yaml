review:
  strengths:
  - 'Both attempt-1 weaknesses are fixed: the ripple function now uses sinc (sin(r)/r)
    so the surface peak is a smooth, coherent dome instead of a chaotic starburst,
    and the Z-axis midpoint tick correctly reads ''0.4'' with no ''-0.0'' artifact.'
  - Custom 3D-to-2D projection engine (elevation 30°, azimuth 45°) built entirely
    on ECharts' graphic.elements API, with back-to-front depth-sorted polylines and
    a depth-based opacity fade (0.4-0.9) giving a convincing pseudo-3D see-through
    cue.
  - Careful axis-corner placement keeps X/Y tick labels and axis titles clear of the
    mesh, and places the Z axis on the corner where the azimuth cancels the mesh's
    screen-column, keeping it clear of the peak in both themes.
  - 'Theme-adaptive chrome is fully correct: identical brand-green (#009E73) mesh
    in both renders, correct #FAF8F1/#1A1A17 backgrounds, and legible ink/inkSoft
    text in both themes.'
  - Title format, axis labeling, grid density (24x24, within the spec's 20-50 range),
    and camera angle (elevation 30, azimuth 45) all match the specification precisely.
  weaknesses:
  - 'The rendered mesh+axes only fill ~42% of canvas width and ~48% of canvas height
    (measured on plot-light.png: content bbox x=910-2251px, y=631-1492px of the 3200x1800
    canvas), leaving unusually large uniform empty margins on all sides. Root cause:
    the fitting box in echarts.js is built from the 8 corners of x,y in {-RANGE,RANGE}
    times z in {zMin,zMax} (see the `corners` loop before TOP_MARGIN/SIDE_MARGIN/PAD),
    which assumes the z-extreme co-occurs with the x/y-extreme corners. For a domed/peaked
    surface (sinc ripple), zMax actually occurs at the center (x=0,y=0), not at any
    x/y corner, so this box overestimates the true projected extent and the resulting
    scale under-fills the mount. Fix: compute boxW/boxH/boxCx/boxCy from the min/max
    of the actual projected mesh grid points (or the mesh + axis tick/label positions)
    instead of the 8 synthetic box corners, then re-fit.'
  - Because of the underfill above, the plot reads small and sparse relative to the
    3200x1800 canvas rather than intentionally spacious — DE-02's 'generous whitespace'
    tips into wasted canvas space.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "wireframe-3d-basic · javascript · echarts · anyplot.ai" is dark, centered at top, clearly legible. Bold dark X/Y/Z axis titles and soft-gray numeric tick labels (-4..4 on X/Y, -0.2/0.4/1.0 on Z) are all legible. Three partial axis edges (X and Y at the base, Z on the left) are drawn in soft gray. No "-0.0" artifact — the Z midpoint tick correctly reads "0.4".
      Data: Single brand-green (#009E73) wireframe mesh running in both x and y directions with a depth-based opacity fade (dimmer far side, brighter near side), forming a smooth, clean dome/ripple shape — the sinc-based surface removes the chaotic crisscross that the previous attempt had at the center.
      Layout: The mesh + axis frame occupy only roughly the middle-left ~42% of canvas width and ~48% of canvas height, leaving unusually large empty margins on all four sides (measured content bbox: x=910-2251px, y=631-1492px of 3200x1800). This reads as underfilled/sparse rather than intentionally spacious.
      Legibility verdict: PASS (all text readable), but layout/canvas-fill verdict: FAIL (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title and axis titles are white/light and clearly legible. Tick labels are light gray, legible against the dark background — no dark-on-dark failure anywhere.
      Data: Data color is identical brand green (#009E73) to the light render — only chrome (background, text, axis-line color) flips, as required. Same smooth dome shape as the light render.
      Layout: Same underfill issue as the light render — mesh confined to the same small central-left region of the canvas, large empty margins on all sides.
      Legibility verdict: PASS (all text readable), but layout/canvas-fill verdict: FAIL (see weaknesses).
