review:
  strengths:
  - Fully custom orthographic 3D-to-2D projection built from scratch in D3 (camera
    basis vectors via cross/normalize/dot, project()/depthOf() helpers) — a mathematically
    correct wireframe, not a simulated one
  - 'The corner tick-label overlap flagged in attempt 1 is now fixed: a screen-space
    proximity guard (CORNER_PX_RADIUS) pushes any tick label that projects near the
    shared axis corner further outward, confirmed clean in both themes at full resolution'
  - Depth-based opacity per mesh strand (painter's-algorithm sort by mean depth +
    0.3-0.95 opacity scale) gives a convincing, well-executed near/far depth cue
  - Adaptive axis-frame anchor selection picks the floor corner that best traces the
    mesh's visual silhouette instead of a hard-coded corner
  - Full theme-adaptive chrome; green mesh color is pixel-identical between light
    and dark renders
  - Grid lines rendered in both row and column directions as required; all three axes
    labeled with ticks and units-free but descriptive X/Y/Z labels
  - Clean, idiomatic D3 data-join patterns throughout despite the bespoke 3D math
  weaknesses: []
