review:
  strengths:
  - Fully custom orthographic 3D-to-2D projection built from scratch in D3 (camera
    basis vectors via cross/normalize/dot, project()/depthOf() helpers) — a genuine,
    mathematically correct 3D wireframe, not a simulated one
  - Depth-based opacity per mesh strand (painter's-algorithm sort by mean depth +
    a 0.3-0.95 opacity scale) gives a convincing, well-executed depth cue and visual
    hierarchy
  - Adaptive axis-frame anchor selection picks the floor corner that projects furthest
    screen-left so the frame traces the mesh's visual silhouette instead of a hard-coded
    corner cutting through it — a thoughtful, non-generic solution
  - Full theme-adaptive chrome via t.ink/t.inkSoft tokens; the green mesh color is
    pixel-identical between light and dark renders, only chrome flips
  - Grid lines rendered in both row and column directions as the spec requires; all
    three axes labeled with tick marks and units-appropriate formatting (d3.format)
  - Clean, deterministic in-memory data generation (ripple function), no imports beyond
    the d3 global, correct mount-node/ANYPLOT_SIZE contract
  weaknesses:
  - 'Confirmed in BOTH renders: one axis tick label (''2'', positioned via the outwardXSign/outwardYSign
    LABEL_LEN offset near the shared floor corner) projects almost exactly onto the
    top of the Z-axis vertical frame line, and several green mesh strands cross directly
    through/behind the glyph. The CORNER_GUARD filter only checks 3D data-space distance
    to the anchor before projection, so a tick that is far from the anchor in data
    space can still land close to the corner in 2D screen space after projection for
    this specific camera angle (elevation 38 / azimuth 42) — it slips through the
    guard. Fix: after projecting all tick label positions, add a screen-space proximity
    check (or increase LABEL_LEN specifically for ticks whose projected point falls
    within some px radius of the projected corner) so no tick label ever renders on
    top of the mesh silhouette.'
  - Because of the overlap above, that one tick label is harder to read than the rest
    of the chrome — legibility is only locally affected but is a real, reproducible
    defect, not a cosmetic nitpick.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "wireframe-3d-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. Axis frame drawn as three dark-grey (inkSoft) lines meeting at a shared floor corner (Z vertical, X and Y diagonals), with tick marks and tick labels (X: -4,-2,0; Y: -2,0,2,4; Z: 0.5,0.0,-0.5) plus bold "X"/"Y"/"Z" axis-name labels. All chrome text is dark-on-light and legible EXCEPT one tick label ("2", near the top of the Z-axis vertical line at the shared corner) which has multiple green mesh strands crossing directly through/behind it — a genuine text/data overlap, not merely tight spacing.
      Data: Single green (#009E73) wireframe mesh forming a ripple/sombrero-like surface (z = sin(sqrt(x²+y²))), rendered as a dense 30×30 grid of lines in both row and column directions, with per-strand opacity varying by depth (fainter = farther from camera) giving a convincing sense of depth.
      Legibility verdict: FAIL (localized) — every other text element is fully readable; the one corner tick label described above is the exception (mesh lines cross it).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout, now light-grey (inkSoft) axis frame/ticks and off-white (ink) title/axis-name labels, all clearly legible against the dark background — no dark-on-dark failures anywhere.
      Data: Data colors are pixel-identical to the light render — same #009E73 green mesh, same depth-opacity gradient; only chrome (background, axis frame, text) flipped as required.
      Legibility verdict: FAIL (localized) — the exact same "2" tick label at the Z-axis corner is crossed by mesh strands in this render too, confirming the issue is a systematic projection/placement bug rather than a one-off render artifact. Every other element is readable.
