      Data: Wave-like saddle surface z = sin(x)*cos(y) over a 24x24 grid, rendered as two polyline families: brand green (#009E73) tracing the X direction, lavender-purple (#C475FD, Imprint position 2) tracing the Y direction -- correct canonical palette order, first series is brand green as required.
      Legibility verdict: PASS (with the axis/mesh-overlap caveat noted above, which is a VQ-02 deduction rather than a legibility failure).

