review:
  strengths:
  - Clean line-only wireframe in brand green with mesh lines in both x and y meeting
    at every grid point; a 24x24 grid keeps the cells open while the curved ridges
    read smoothly
  - True perspective projection from an oblique 22° / -38° view reveals both peaks
    and both troughs of z = sin(x) · cos(y)
  - Axis arms sit on the front base edges with ticks and labels pushed along outward
    normals, so no label ever touches the mesh; axis titles rotate to run along their
    arms
  - Composes a custom SVG layer inside the v9 ChartsContainer and scales it from useDrawingArea,
    the idiomatic MUI X route for a chart type the community package lacks
  - Chrome threads ink / inkSoft tokens through every text and axis element, so both
    themes read cleanly with identical data color
  weaknesses:
  - 'Suggestion: a tooltip or hover readout of (x, y, z) at grid vertices would add
    value in the interactive HTML view.'
  - 'Suggestion: the bottom ~12% of the canvas stays empty below the x arm; a slightly
    lower VIEW_PAD or a nudged elevation could let the mesh use it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "wireframe-3d-basic · javascript · muix · anyplot.ai" centered at top, gray subtitle "24 × 24 grid · perspective view from 22° elevation, -38° azimuth"; dark-gray axis arms along the front-left (x, ticks -2/0/2) and front-right (y, ticks -2/0/2) base edges and an upright z arm at the left (ticks -0.5/0/0.5, rotated title "z = sin(x) · cos(y)"); axis titles x and y rotated along their arms. All text readable.
      Data: 24x24 wireframe mesh in #009E73, lines in both directions, two peaks and two troughs; see-through crossings where the surface folds; cells open across most of the surface.
