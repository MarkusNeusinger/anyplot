review:
  strengths:
  - Custom axonometric 3D->2D projection (elevation 22 deg, azimuth -38 deg) built
    from scratch and composed with MUI X's useDrawingArea hook -- a genuine implementation
    of the documented 'composition pattern' for chart types the community series don't
    cover, not a hacky workaround
  - 'Correct Imprint palette usage: X-direction lines use palette[0] (brand green
    #009E73), Y-direction lines use palette[1]; data colors are identical between
    light and dark renders, only chrome flips'
  - 'Theme-adaptive chrome is fully legible on both the #FAF8F1 and #1A1A17 surfaces
    -- title, axis labels, and tick text all pass the light/dark readability check
    with no dark-on-dark or light-on-light failures'
  - skipAnimation set on ChartContainer, no clipped or cropped elements at any canvas
    edge in either render, canvas dimension gate passed
  - Deterministic in-memory data (z = sin(x)*cos(y) over a 32x32 grid) -- fully reproducible
    with no RNG needed
  weaknesses:
  - Axis tick marks are sparse -- each of the X/Y/Z arms only shows a midpoint value
    and an endpoint value (plus one combined origin label), so the mapping between
    grid density and coordinate values is hard to read precisely. Add 1-2 more intermediate
    ticks per axis arm.
  - The two grid-line colors (green for X-direction lines, purple for Y-direction
    lines) are never explained -- add a small legend or caption clarifying what each
    color represents to strengthen the data storytelling.
  - At 32x32 grid resolution with two overlapping ripple families (sin(x)*cos(y) creates
    two humps and two troughs), the mesh gets visually dense/cluttered where the surfaces
    cross near the plot center -- consider reducing to ~24x24 grid lines or lowering
    opacity slightly (e.g. 0.7) to reduce clutter in that region.
  - The wireframe is a flat 2D projection with no hidden-line/depth occlusion, so
    far and near mesh lines overlap identically -- consider a subtle depth cue (e.g.
    thinner stroke or lower opacity for lines further from the viewer) to reinforce
    the 3D depth read.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "wireframe-3d-basic · javascript · muix · anyplot.ai" centered at top, clearly readable. Schematic 3-axis triad (X, Y, Z) in dark ink drawn from a near-corner origin, with bold axis-name labels, midpoint tick values ("0.0"), endpoint tick values ("3.2"/"1.0"), and a combined origin coordinate label "(-3.2, -3.2, -1.0)" in the bottom-left. All axis text is dark ink on the light background and reads clearly, no light-on-light issues.
      Data: A wave-like saddle surface (sin(x)*cos(y)) rendered as two families of ~32 polylines each: green lines tracing the X direction (brand green #009E73, first series) and purple/magenta lines tracing the Y direction. The two families overlap into a plaid mesh that clearly conveys the ripple topology, with two humps and two troughs visible across the grid.
      Legibility verdict: PASS -- title, axis labels, and tick values are all legible against the light background; no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title and axis triad, now rendered in light/cream ink (text.primary/text.secondary tokens flipped for dark mode) -- title and all axis/tick labels are clearly visible against the dark background, no dark-on-dark failures.
      Data: Identical green (#009E73) and purple line colors as the light render -- confirms data colors are theme-invariant and only chrome (ink, background) flips as required.
      Legibility verdict: PASS -- all text is legible against the near-black background; brand green remains vivid on the dark surface.
