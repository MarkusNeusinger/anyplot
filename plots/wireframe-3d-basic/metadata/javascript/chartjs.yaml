review:
  strengths:
  - Genuinely hand-built 3D wireframe renderer inside Chart.js — Chart.js has zero
    native 3D support, so the implementation constructs its own elevation/azimuth
    camera basis, perspective projection, and painter's-algorithm depth sorting (farthest-first)
    via a custom plugin instead of faking it with a sibling library
  - Height-based coloring correctly uses the Imprint diverging colormap (imprint_div)
    since the terrain data has a meaningful z=0 midpoint (two positive peaks, one
    negative dip) — exactly the polarity-aware colormap choice the style guide calls
    for
  - Grid lines rendered in both x and y directions as required by the spec, with per-segment
    line width subtly scaled by projected depth (closer segments slightly thicker)
    for a believable depth cue
  - Axis box edges are drawn only from the single farthest corner (computed per-frame
    from the camera direction) so the axis lines sit behind the mesh instead of cluttering
    it with a full cube — a thoughtful, non-default touch
  - Data colors are pixel-identical between light and dark renders; only chrome (ink,
    grid, background) adapts to theme, exactly per the theme-adaptive chrome contract
  - 'Title format is exactly correct: `wireframe-3d-basic · javascript · chartjs ·
    anyplot.ai`'
  - Fully deterministic, in-memory data generation (fixed Gaussian bump parameters,
    no RNG) with no external dependencies beyond Chart.js itself
  weaknesses:
  - 'Canvas utilization is low and lopsided: the wireframe cube + axis box occupies
    roughly a quarter of the 3200x1800 canvas, with a large empty band on the right
    side of the frame and a smaller one at the bottom, rather than the balanced 50-80%
    fill the layout guideline calls for. This traces to the TARGET_ASPECT-matching
    step in the scale-fitting code, which inflates halfX/halfY to preserve undistorted
    x/y data units at the cost of a smaller apparent plot. Increase the overall scale
    of the projected content (e.g. shrink MARGIN, or scale the normalized cube up
    before fitting) and re-balance so whitespace is roughly even on all sides instead
    of concentrated on the right.'
  - Axis titles are the single letters 'X', 'Y', 'Z' with no units or descriptive
    context (acceptable for an abstract mathematical surface per the spec, but scored
    conservatively under VQ-06's 'descriptive without units' tier rather than the
    top tier reserved for labels with units)
  - The reduced canvas footprint compounds at mobile widths — scaled down to ~400px,
    the actual mesh + labels occupy only a small fraction of that thumbnail, hurting
    legibility versus a tighter, better-filled composition
  - Whitespace, while generous, is unbalanced rather than evenly distributed around
    the plot (see canvas utilization note above) — this also costs a bit of visual-refinement
    polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) — not pure white.
      Chrome: Title "wireframe-3d-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly readable. X/Y/Z axis titles and numeric tick labels rendered in soft dark ink, all legible. A thin gray floor-plane outline grounds the terrain in 3D space. Bottom-left "Elevation (z)" gradient color key with -2.1/0/+2.1 tick labels, fully readable.
      Data: A terrain-like wireframe mesh (28x28 grid) with two positive peaks (blue, toward +z) and one negative dip (red, toward -z), colored via a red-white-blue diverging gradient keyed to elevation. Colors transition smoothly and the mesh lines are dense but not overplotted.
      Legibility verdict: PASS — all text reads clearly against the light background; no light-on-light issues. Note: the mesh + axis box occupy a visibly small, right-shifted portion of the 3200x1800 canvas, leaving a large empty band on the right and bottom of the frame.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) — not pure black.
      Chrome: Same title, axis titles, tick labels, and elevation key, now rendered in light/white ink — all clearly legible against the dark background. No dark-on-dark failures observed; every text element flips correctly to a light tone.
      Data: Identical wireframe geometry and identical red-white-blue diverging colors to the light render — only the chrome (ink, grid, background) flipped, exactly as required. The two blue peaks and the red dip read with the same clarity as in the light render.
      Legibility verdict: PASS — all text and data are clearly readable in the dark theme. Same canvas-utilization concern as the light render (small, right-shifted plot footprint relative to the full canvas).
