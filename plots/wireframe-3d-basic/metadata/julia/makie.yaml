review:
  strengths:
  - 'Correct plot type: Axis3 + wireframe! produces a genuine 3D wireframe with grid
    lines in both x and y directions, matching the spec exactly'
  - All three axes labeled (X, Y, Z) with visible tick marks, a sensible perspective
    (elevation 30°, azimuth 135°), and the canonical `wireframe-3d-basic · julia ·
    makie · anyplot.ai` title
  - Theme-adaptive chrome is correctly threaded through Axis3 across both renders
    — panels, spines, grid, ticks, and title all flip light/dark while the brand-green
    wireframe stays identical
  - 'Clean, deterministic, KISS-structured code: no functions/classes, no randomness
    needed (pure grid math), correct `save("plot-$(THEME).png", fig; px_per_unit=2)`
    call, no fake UI'
  weaknesses:
  - Tick/axis label font sizes rely on the Figure-level default fontsize=14 (only
    titlesize is explicitly computed) — explicitly set xlabelsize/ylabelsize/zlabelsize
    and xticklabelsize/yticklabelsize/zticklabelsize for full VQ-01 credit
  - The 24x24 grid combined with the strongly oscillating radial function (sin(r)/(r+1)
    over r up to ~14, roughly 2.2 full periods) produces heavy line crossing/clutter
    near the center peak that partially defeats the spec's stated goal of a 'see-through
    visualization that reveals the underlying structure' — consider damping the oscillation
    (shorter domain or faster decay) or trimming grid density slightly for a cleaner
    read
  - Axis labels are bare 'X'/'Y'/'Z' with no descriptive context (acceptable since
    the spec explicitly asks for this) but there is no visual hierarchy or emphasis
    technique to guide the viewer, e.g. the spec's suggested 'optional height-based
    coloring' was not used
  - 'Design polish sits at default level: single flat brand-green line color with
    no height-based color encoding, so Design Excellence (aesthetic sophistication
    + storytelling) reads as a well-configured default rather than a deliberate design
    choice'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "wireframe-3d-basic · julia · makie · anyplot.ai" is bold dark text, clearly visible at top center. X/Y/Z axis labels and numeric tick labels (grid coordinates -10..10, Z values -0.2..0.4) are dark/soft-dark and legible against the light background. Grid lines on the three axis panels are subtle light gray, visible but not competing with the data. Panel fills match the page background so the 3D box doesn't read as a boxed frame.
      Data: Single-color wireframe mesh in the anyplot brand green (#009E73), forming a symmetric ripple/sombrero shape with a sharp central peak and concentric ridges decaying toward the domain edges. The mesh is dense near the center due to the oscillating radial function, creating some visual clutter, but the overall topology (central spike, decaying rings, flat far corners) is still discernible.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light surface; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/off-white text, clearly visible at top center. X/Y/Z axis labels and tick labels are light-colored (primary text near-white, tick labels a softer light gray) and easily readable against the dark background — no dark-on-dark failures observed. Grid lines are subtle light-gray at low opacity, visible but unobtrusive. Panel fills match the dark page background.
      Data: Wireframe mesh renders in the identical brand green (#009E73) as the light render — confirmed unchanged data color across themes. Same ripple/sombrero topology and same central density/clutter as the light render.
      Legibility verdict: PASS — all text is clearly readable against the dark surface; brand green reads well on the near-black background.
