review:
  strengths:
  - 'All previous review feedback addressed: xlabelsize/ylabelsize/zlabelsize and
    x/y/zticklabelsize are now explicitly set on Axis3, the radial oscillation is
    damped (sin(0.55*r)/(r+1), ~1.1 periods vs. ~2.2 before) with a coarser 20x20
    grid, and the mesh is now colored by height using the Imprint imprint_seq gradient
    (green -> blue)'
  - 'Height-based line coloring is a genuine design/storytelling upgrade: base of
    the surface reads brand green and the peak transitions to blue, giving the see-through
    wireframe a real depth cue instead of a flat single-color mesh, identical between
    light and dark renders'
  - 'Correct plot type: Axis3 + wireframe! produces a true 3D wireframe with grid
    lines in both x and y directions, matching the spec exactly, with all three axes
    labeled (X, Y, Z), visible tick marks, and a sensible perspective (elevation 30
    deg, azimuth 135 deg)'
  - Theme-adaptive chrome correctly threaded through Axis3 in both renders -- panels,
    spines, grid, ticks, labels, and title all flip light/dark while the height-encoded
    data colors stay identical
  - 'Clean, deterministic, KISS-structured code: no functions/classes, no randomness
    needed (pure grid math), correct save("plot-$(THEME).png", fig; px_per_unit=2)
    call, canonical title format, no fake UI'
  weaknesses:
  - The peak region (top ~1/3 of the surface, roughly z=0.15-0.3) still shows dense
    line crossing where grid lines converge toward the apex -- improved versus attempt
    1 but the topology near the very top is still harder to read at a glance than
    the rest of the surface; a slightly coarser grid (e.g. 16x16-18x18) or a flatter
    peak function would fully resolve this
  - The per-segment height coloring is built by manually decomposing line faces with
    internal/undocumented Makie APIs (Makie.decompose, Makie.LineFace{Makie.GLIndex},
    Makie.Tesselation) rather than a documented public parameter -- functionally correct
    and visually verified against the peak (green at base, blue near the top), but
    this couples the implementation to Makie internals that are more likely to change
    between versions than the stable wireframe!/Axis3 API surface
  - No colorbar or legend communicates that color encodes height/Z -- a reader can
    infer it from context (green-to-blue matches the Z gradient) but an explicit colorbar
    would make the height-coloring choice self-explanatory rather than implicit
  - Data remains a purely abstract synthetic ripple function with no real-world framing
    (matches the spec's own suggested example, so this is an acceptable but not maximal
    choice for Realistic Context)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "wireframe-3d-basic · julia · makie · anyplot.ai" is bold dark text, clearly visible at top center. X/Y/Z axis labels and numeric tick labels (grid coordinates -10..10, Z values -0.1..0.3) are dark/soft-dark and legible against the light background; xlabelsize/ylabelsize/zlabelsize and per-axis ticklabelsize are all explicitly set (no longer relying on the Figure-level default). Grid lines on the three axis panels are subtle light gray, visible but not competing with the data. Panel fills match the page background so the 3D box doesn't read as a boxed frame.
      Data: Wireframe mesh forming a symmetric ripple/sombrero shape with a central peak decaying into concentric ridges toward the domain edges. The mesh is now height-colored via the Imprint imprint_seq gradient: brand green (#009E73) at the low/base regions transitioning to blue (#4467A3) near the peak, giving a genuine depth cue. The oscillation is visibly damped compared to a sharper ripple, and the 20x20 grid keeps the mid/lower surface clearly see-through; the top third near the apex still shows a dense cluster of crossing lines but the overall topology (central peak, decaying rings, flat far corners) reads clearly.
      Legibility verdict: PASS -- all title, axis, and tick text is clearly readable against the light surface; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title renders in light/off-white text, clearly visible at top center. X/Y/Z axis labels and tick labels are light-colored (primary text near-white, tick labels a softer light gray) and easily readable against the dark background -- no dark-on-dark failures observed. Grid lines are subtle light-gray at low opacity, visible but unobtrusive. Panel fills match the dark page background.
      Data: Wireframe mesh renders with the identical green-to-blue height gradient as the light render -- confirmed unchanged data colors across themes, only chrome flipped. Same damped ripple topology and same peak-region line density as the light render.
      Legibility verdict: PASS -- all text is clearly readable against the dark surface; brand green and blue both read well on the near-black background.
