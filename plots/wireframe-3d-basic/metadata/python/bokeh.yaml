review:
  strengths:
  - Creative custom 3D-to-2D projection pipeline (elevation 30°, azimuth 45°) that
    renders a genuine grid wireframe mesh in bokeh, a library with no native 3D support
  - Height-based line coloring via a custom imprint_seq (brand green -> blue) LinearColorMapper
    with a matching ColorBar, giving the mesh a clear visual read of z-value magnitude
    at a glance
  - Both light and dark renders are fully theme-correct — identical data colors, properly
    flipped chrome, no dark-on-dark or light-on-light failures
  - HoverTool adds real interactive value (slice direction, grid index, average height)
    in the HTML detail view without harming the static PNG
  - Canonical 3200x1800 canvas hit exactly, following the library's toolbar_location=None
    / min_border guidance
  weaknesses:
  - Title omits the required 'python' language segment — format should be 'wireframe-3d-basic
    · python · bokeh · anyplot.ai' but currently reads 'wireframe-3d-basic · bokeh
    · anyplot.ai'
  - The custom X/Y/Z axis indicator is drawn very short (axis_length=2.5) relative
    to the actual data extent (x,y span -4..4, ~8 units) and its tick marks carry
    no numeric values — it reads as a small orientation compass floating mid-surface
    rather than a scaled axis that communicates real coordinate values. Consider lengthening
    the axis to better span the plotted range and/or adding numeric tick labels near
    each tick mark.
  - Several helper functions (_lerp_hex, project_point, project_grid, draw_axis_ticks)
    deviate from the KISS 'Imports -> Data -> Plot -> Save' structure — understandable
    given the custom projection math needed for 3D-in-bokeh, but still a CQ-01 deduction
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "wireframe-3d-basic · bokeh · anyplot.ai" top-left, clearly readable. Italic gray formula annotation "z = sin(√(x² + y²))" upper-left, readable. Custom X/Y/Z axis labels in bold dark ink near the projected origin, with small perpendicular tick marks along each schematic axis segment — no numeric values on the ticks. ColorBar on the right labeled "z height" with tick labels 0.5, 0, -0.5 in soft dark gray, all legible.
      Data: Wireframe mesh of ~30x30 grid lines in both row (x-slice) and column (y-slice) directions, colored on a green (#009E73) -> blue (#4467A3) ramp keyed to average line height (imprint_seq). First-series brand green is used for the lowest z-values, confirming palette compliance.
      Legibility verdict: PASS — all text (title, formula, axis letters, colorbar ticks) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: White title, readable. Light gray italic formula annotation, readable. Custom axis labels and tick marks now rendered in near-white ink, readable against the dark background. ColorBar tick labels rendered in light gray, legible.
      Data: Same green -> blue wireframe color ramp as the light render — data colors are identical between renders; only chrome (background, text, axis-line ink) flips per theme.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/label/tick text is clearly visible against the near-black background.
