review:
  strengths:
  - 'Fixed both attempt-1 weaknesses: the title now includes the required ''python''
    language segment (''wireframe-3d-basic · python · bokeh · anyplot.ai''), and the
    schematic X/Y/Z axis is now scaled to the true data extent (length 4, matching
    the x,y ± 4 data range) with numeric tick labels (1/2/3/4, 0.25/0.5/0.75/1) instead
    of the previous unscaled, unlabeled stub.'
  - Creative custom 3D-to-2D projection pipeline (elevation 30°, azimuth 45°) renders
    a genuine grid wireframe mesh in bokeh, a library with no native 3D support.
  - Height-based line coloring via a custom imprint_seq (brand green -> blue) LinearColorMapper
    with a matching ColorBar gives an immediate visual read of z-value magnitude (peaks
    vs. troughs) at a glance.
  - Both light and dark renders are fully theme-correct — identical data colors, properly
    flipped chrome, no dark-on-dark or light-on-light failures.
  - HoverTool adds real interactive value (slice direction, grid index, average height)
    in the HTML detail view without harming the static PNG.
  - Canonical 3200x1800 canvas hit exactly; no clipped elements at any edge (title,
    colorbar, and axis labels all verified clear of the canvas border via close-up
    crops).
  weaknesses:
  - Lengthening the schematic axis to match the true data extent (the attempt-1 fix)
    now routes the X/Y/Z axis lines, tick marks, and numeric labels directly through
    the densest part of the wireframe mesh in both renders — the axis and dozens of
    crossing mesh strands visually tangle near the origin, making the schematic axis
    harder to parse as a distinct reference even though each element stays individually
    legible. Consider offsetting the axis into a clearer quadrant, drawing it with
    a subtle halo/outline so it separates from the data lines, or thinning the mesh
    near the axis.
  - Helper functions (_lerp_hex, project_point, project_grid, draw_axis_ticks) deviate
    from the KISS 'Imports -> Data -> Plot -> Save' structure — understandable given
    the custom projection math needed for 3D-in-bokeh, but still a CQ-01 deduction
    (unchanged from attempt 1).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "wireframe-3d-basic · python · bokeh · anyplot.ai" top-left, clearly readable (now includes the 'python' segment, fixed from attempt 1). Italic gray formula annotation "z = sin(√(x² + y²))" upper-left, readable. Custom X/Y/Z schematic axis near the projected origin, now scaled to the full data extent (length 4) with numeric tick labels (1, 2, 3, 4 on X/Y; 0.25, 0.5, 0.75, 1 on Z) — legible individually, but the axis lines/ticks/labels run directly through the densest region of the wireframe mesh, visually tangling with dozens of crossing mesh strands. ColorBar on the right labeled "z height" with tick labels 0.5, 0, -0.5 in soft dark gray, fully legible with no clipping at the canvas edge (confirmed via close crop).
      Data: Wireframe mesh of ~60 lines (30 row / 30 column slices) colored on a green (#009E73) -> blue (#4467A3) ramp keyed to average line height (imprint_seq). Brand green anchors the low end of the continuous ramp, confirming palette compliance.
      Legibility verdict: PASS — all text (title, formula, axis letters/ticks, colorbar) is readable against the light background; no light-on-light issues. The axis/mesh visual tangle is a clutter concern, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: White title (same corrected format), light-gray italic formula annotation, readable. Axis labels and tick marks rendered in near-white/light-gray ink, legible against the dark background but crossed by the same tangled mesh pattern seen in the light render. ColorBar tick labels in light gray, legible, no edge clipping.
      Data: Same green -> blue wireframe color ramp as the light render — data colors are identical between renders; only chrome (background, text, axis-line ink) flips per theme.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/label/tick text is clearly visible against the near-black background.
