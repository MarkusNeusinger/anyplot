review:
  strengths:
  - Correct isometric projection (elevation 30°, azimuth 45°) exactly matching the
    spec's suggested viewing angle
  - Full wireframe mesh with grid lines in both X and Y directions, plus manually-constructed
    X/Y/Z reference axes with tick marks
  - Height-based diverging color is a deliberate, sensible choice for data that oscillates
    around 0
  - Both themes correctly implement chrome tokens with identical data colors across
    light/dark
  - Clean, deterministic, KISS-adjacent code with correct canvas-padding logic
  weaknesses:
  - Diverging color scale renders a visible teal/cyan-green band instead of a clean
    red-neutral-blue gradient (verified via pixel sampling in both themes) — add interpolate="rgb"
    to the alt.Scale for the color encoding to force linear RGB interpolation instead
    of Vega-Lite's HCL default
  - Tick labels from the X, Y, and Z reference axes crowd together at the shared AXIS_OFFSET
    corner with no visual cue for which label belongs to which axis — increase axis
    spacing at that corner or stagger tick-label offsets further apart
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-verified (250,248,241) = #FAF8F1. Correct.
      Chrome: Title "wireframe-3d-basic · python · altair · anyplot.ai" in bold dark text, X/Y/Z axis names bold dark, tick labels (-5/0/5, -1/0/1) in soft dark gray, legend "Height (Z)" title dark / labels soft gray. All clearly readable against the light background.
      Data: Mesh lines colored via diverging red-neutral-blue scale mapped to height (Z). First/only encoded color channel is continuous, not categorical, so no #009E73 brand-green requirement applies here.
      Legibility verdict: PASS (all text readable), but pixel-sampling the legend gradient (x=2765, y=380-1180) reveals G>B in the y=540-780 range (e.g. (165,203,192) at y=620) — an unintended teal/green band not part of the imprint_div two-endpoint palette. This is a color-fidelity defect, not a text-legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-verified (26,26,23) = #1A1A17. Correct.
      Chrome: Title, axis names, tick labels, and legend all correctly flip to light tokens (white/light-gray) against the dark background. No dark-on-dark failures found anywhere in the render.
      Data: Colors confirmed identical to light render at matching legend positions, including the same teal/green artifact — only chrome flipped between themes, as required.
      Legibility verdict: PASS (all text readable in dark theme); same non-legibility color-fidelity defect as light render.
