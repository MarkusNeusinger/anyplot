review:
  strengths:
  - Custom isometric-projection helper (elevation=30, azimuth=45) turns 2D altair
    marks into a convincing 3D wireframe, matching the spec's requested viewing angle
    exactly
  - 'Wireframe height is encoded through the Imprint imprint_div diverging colormap
    (#AE3030 to theme-adaptive midpoint to #4467A3), correctly matching the style
    guide since the ripple data oscillates around zero'
  - Grid mesh lines are drawn in both x and y directions at a 30x30 density (within
    the spec's 20-50 recommended range), giving a clean see-through wireframe without
    overplotting
  - X and Y reference axes with tick marks and axis-name labels are offset outside
    the mesh footprint so they read cleanly against the surface
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    ink, legend frame) adapts to theme
  weaknesses:
  - Legend title "Height (Z)" overlaps its own frame border in both renders — the
    ascenders of every letter are visibly cut off/behind the horizontal top border
    stroke (confirmed by pixel-level crop). Move the legend title up or add top padding
    so text clears the border.
  - Spec explicitly asks to "Label all three axes (X, Y, Z) with appropriate tick
    marks," but only X and Y get spatial axis lines with tick marks; Z is only communicated
    indirectly through the color legend, not as a plotted axis — consider adding a
    third reference axis (e.g. a vertical tick ladder at one mesh corner) so Z has
    real spatial ticks like X and Y.
  - np.random.seed(42) is set but never used since the ripple surface z = sin(sqrt(x^2+y^2))
    is fully deterministic — dead code that should be removed for clarity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "wireframe-3d-basic · python · altair · anyplot.ai" in bold dark ink, clearly readable. X and Y axis labels (bold) and tick numbers (-5, 0, 5) in soft ink, readable and well-placed outside the mesh. Legend "Height (Z)" title and tick labels (0.5, 0.0, -0.5) are dark and legible against the elevated legend background, EXCEPT the legend title's ascenders are visibly clipped by the legend's own top border line (pixel-verified crop) — a real overlap defect.
      Data: Wireframe mesh uses the diverging imprint_div colormap — matte red (#AE3030) at troughs, near-neutral at zero, blue (#4467A3) at peaks — clearly visible against the light background.
      Legibility verdict: PASS overall (all text readable), with one FAIL-adjacent flaw: legend title overlaps its frame border.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Title, X/Y axis labels and ticks render in light ink (F0EFE8/B8B7B0-equivalent), clearly legible against the dark background — no dark-on-dark failures found. Legend frame and text also flip to light-on-dark correctly, but the same top-border overlap on "Height (Z)" persists (ascenders clipped behind the border stroke).
      Data: Colors are identical to the light render — red/neutral/blue diverging ramp on the mesh — confirming only chrome adapted to theme.
      Legibility verdict: PASS overall (all text readable, no dark-on-dark issues), with the same legend-title/border overlap flaw as the light render.
