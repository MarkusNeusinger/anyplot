review:
  strengths:
  - interpolate="rgb" now forces a clean red → neutral → blue diverging gradient with
    no teal/green artifact — pixel-checked via a legend crop in both themes
  - Z-axis tick ladder now sits at its own farther-out corner (AXIS_OFFSET_Z), resolving
    the prior origin-corner crowding between the X, Y, and Z reference axes
  - Legend title "Height (Z)" clears its border with proper top padding in both renders
  - Height-mapped diverging color gives the wireframe a clear focal point (center
    peak/trough vs. outer ring) without relying on red-green as the sole signal
  - Isometric projection (elevation 30°, azimuth 45°) matches the spec's suggested
    viewing angle exactly, and all three axes (X, Y, Z) get real spatial tick marks
  - Dead np.random.seed(42) call from attempt 1 has been removed; code is fully deterministic
    and clean
  weaknesses:
  - The X-axis '-5' and Y-axis '-5' tick labels, while no longer overlapping, still
    sit moderately close together near the shared corner — a slightly larger AXIS_OFFSET
    or extra dx/dy stagger would remove any residual first-glance ambiguity about
    which axis each label belongs to
  - isometric_projection is a reasonable, necessary helper for the repeated 3D→2D
    math, but technically deviates from the strictest 'no functions' reading of CQ-01
    KISS — not a real issue given the alternative is duplicated trig code, but noted
    for completeness
