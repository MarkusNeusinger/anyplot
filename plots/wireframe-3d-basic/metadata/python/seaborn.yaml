review:
  strengths:
  - Theme-adaptive chrome is executed correctly — the brand green (#009E73) wireframe
    is pixel-identical between renders, backgrounds are correct warm cream (#FAF8F1)
    / near-black (#1A1A17), and all title/axis/tick text is fully readable in both
    themes.
  - Thoughtful combination of a translucent height-shaded surface (imprint_seq colormap)
    beneath a crisp opaque wireframe gives real depth perception without losing the
    see-through mesh character the spec asks for.
  - 3D panes are cleaned up (transparent facecolor, no pane edges) and the grid is
    very subtle (alpha=0.08), keeping visual focus on the data mesh.
  - View angle (elev=25, azim=45) closely matches the spec's suggested elevation/azimuth
    and clearly reveals the ripple surface's topology, including the corner peaks
    that would be hidden from a top-down view.
  - Canvas is exactly 3200x1800, all three axes are explicitly labeled with tick marks,
    and font sizes are explicitly set throughout.
  weaknesses:
  - 'Title is missing the mandated language segment: it currently reads ''wireframe-3d-basic
    · seaborn · anyplot.ai'' but the required format is ''{spec-id} · {language} ·
    {library} · anyplot.ai'' — it must read ''wireframe-3d-basic · python · seaborn
    · anyplot.ai''. Every sibling seaborn implementation (e.g. plots/scatter-basic/implementations/python/seaborn.py)
    includes ''python'' as the second segment; fix the ax.set_title(...) call on line
    64.'
  - At 30x30 grid resolution, the combined surface+wireframe becomes visually tangled
    right at the central dome, where crossing lines form a dense moiré knot rather
    than a clean readable mesh — consider a slightly coarser grid (e.g. 22-26 points
    per axis) or trimming plot_wireframe's rstride/cstride so the mesh stays legible
    at the peak.
  - Axis labels are bare 'X'/'Y'/'Z' with no real-world framing or units. Sibling
    seaborn 3D specs in this same library (contour-3d, scatter-3d) gave their axes
    concrete domain framing (e.g. 'Displacement (μm)', 'Feature A'); framing the ripple
    as a physical quantity (terrain elevation, wave amplitude, etc.) would raise the
    realistic-context score.
  - Noticeable unused margin on both the left and right thirds of the 3200x1800 canvas
    — tightening fig.subplots_adjust or the 3D box aspect would let the mesh occupy
    more of the frame.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "wireframe-3d-basic · seaborn · anyplot.ai" in dark ink at top center; X/Y/Z axis labels and numeric tick labels (X/Y from -4 to 4, Z from -1.00 to 1.00) rendered in dark/soft-grey ink. All chrome text is clearly legible against the light background.
      Data: A single-color brand-green (#009E73) wireframe mesh renders a radial ripple surface z = sin(sqrt(x^2+y^2)) over a 30x30 grid, with a faint green-to-blue translucent surface fill underneath for depth cues. The mesh shows a central dome flanked by a ring trough and two upward "wings" at the domain corners.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis/tick labels now rendered in light ink (white title, light-grey ticks), fully legible against the dark background. No dark-on-dark text observed anywhere.
      Data: Wireframe color and translucent surface fill are visually identical to the light render (#009E73 green, same green-to-blue gradient) — only the chrome (background, text, grid) flipped for the theme, confirming palette consistency.
      Legibility verdict: PASS

    Both renders pass the theme-readability checklist (5c) — no dark-on-dark or light-on-light failures, grid subtle but visible, data mesh clearly distinguishable from background in both themes.
