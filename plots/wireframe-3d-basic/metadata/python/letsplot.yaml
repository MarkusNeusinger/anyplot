review:
  strengths:
  - Clever isometric 3D-to-2D projection (isometric_project) gives a convincing sense
    of depth despite lets-plot having no native 3D API
  - Wireframe mesh has real grid lines in both x and y directions built from actual
    line segments (geom_path + group), not a fake illusion
  - Grid density (28x28) and line styling (size=0.6, alpha=0.85) are well chosen —
    the ripple structure and self-occlusion of the surface are clearly readable in
    both themes
  - 'Canvas is exactly 3200x1800, title format matches the mandated pattern, first-series
    color is Imprint #009E73'
  - 'Theme-adaptive chrome is correctly wired: warm off-white background + dark text
    in light mode, warm near-black background + light text in dark mode, brand green
    identical across both renders'
  weaknesses:
  - 'No axes are shown at all: theme_void() strips every axis line, tick mark, and
    axis label. The specification explicitly requires ''Label all three axes (X, Y,
    Z) with appropriate tick marks'' — this implementation has zero X/Y/Z reference,
    so a viewer cannot read any data value off the plot. Add a minimal axis framework:
    at least a Z-axis scale/reference (e.g. a vertical tick ladder near one wireframe
    edge or a subtle colorbar-style height legend) plus faint X/Y ground-plane ticks,
    styled with INK/INK_SOFT tokens so it stays theme-adaptive.'
  - 'The ''X/Y correct? Axes show all data?'' data-mapping requirement is unmet because
    there is no axis to show the data range on — even an unobtrusive corner scale
    indicator (e.g. ''x/y range: -6 to 6, height: -1 to 1'') would resolve this.'
  - No height-based visual cue at all beyond the isometric offset — since axes are
    absent, a subtle Imprint-sequential color-by-z (imprint_seq gradient on the line
    color) would give the viewer a second way to read elevation and directly uses
    lets-plot's scale_color_gradient, adding library-idiomatic distinctiveness (currently
    LM-02 is generic single-color geom_path).
  - isometric_project() is a genuinely necessary helper (lets-plot has no true 3D
    projection), but if it can be inlined via a short vectorized expression it would
    tighten CQ-01's 'no functions' preference — low priority, keep only if removing
    it hurts readability.
  - np.random.seed(42) is set but the data (x, y via linspace, Z via sin) is fully
    deterministic and never calls a random function — harmless but can be dropped
    since it doesn't do anything.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target; a thin dark-ink rectangular border frames the plot area.
      Chrome: Only a title is present ("wireframe-3d-basic · letsplot · anyplot.ai"), centered, dark ink text, clearly readable against the light background. There are NO axis lines, tick marks, or axis labels anywhere on the plot (theme_void() strips them entirely).
      Data: A dense diamond-mesh wireframe rendered entirely in Imprint brand green (#009E73), built from an isometric projection of a sin(sqrt(x²+y²)) ripple surface. The mesh clearly shows a central peak, a surrounding ring depression, and a secondary dip at the very center, with visible self-occlusion (front strands drawn over back strands) giving a convincing 3D read. Lines are crisp and evenly spaced, well distinguishable from the background.
      Legibility verdict: PASS for the title; FAIL for axis content — no X/Y/Z labels or tick marks exist at all, so numeric values cannot be read off the plot (this is a spec requirement, not just a legibility nicety).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target; matching thin light-gray border frames the plot area.
      Chrome: Same title text, now rendered in light/off-white ink, clearly readable against the dark background. Same total absence of axes/ticks/labels as the light render.
      Data: Identical wireframe geometry and identical Imprint green (#009E73) line color as the light render — confirms the data color is theme-invariant as required. Green reads well against the near-black surface, no contrast issues.
      Legibility verdict: PASS for the title and data contrast (no dark-on-dark or light-on-light issues found); FAIL for the same missing-axes reason as the light render.
