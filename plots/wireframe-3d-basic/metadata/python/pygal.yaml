review:
  strengths:
  - Creative isometric 3D-to-2D projection technique built entirely from scratch (isometric_project
    helper) to work around pygal's lack of native 3D support — the same class of workaround
    the bokeh implementation of this spec used successfully.
  - 'Correct Imprint palette usage: wireframe rendered in brand green #009E73, backgrounds
    and text tokens correctly theme-adaptive (#FAF8F1 light / #1A1A17 dark), no dark-on-dark
    or light-on-light failures in either render.'
  - Title exactly matches the mandated 'wireframe-3d-basic · python · pygal · anyplot.ai'
    format, and font sizing is scaled to the title length per the style guide.
  - 'Clean, KISS-compliant code: fully deterministic (no seed needed, ripple function
    is pure math), only used imports, saves plot-{theme}.png and plot-{theme}.html
    correctly, canvas is exactly 3200×1800.'
  weaknesses:
  - 'Y-axis has no real tick marks at all — it is represented only by a diagonal gizmo
    line and a legend entry (''Y axis''), unlike X and Z which get pygal''s native
    numeric ticks. The spec requires ''Label all three axes (X, Y, Z) with appropriate
    tick marks.'' Fix: add small hand-drawn perpendicular tick marks (and ideally
    value labels) along the Y-axis gizmo line, similar to how the bokeh implementation
    of this same spec hand-draws tick marks on all three projected axes.'
  - 'The wireframe has no hidden-line removal, so the row/col polylines from the near
    and far side of the ripple surface all overlap in the 2D projection, producing
    a dense woven/crosshatch texture rather than a clearly readable surface topology
    — the central peak and the ripple trough are recognizable but the mesh reads as
    visually noisy up close. Fix: reduce grid_size (e.g. 20 instead of 30), add slight
    alpha transparency to the wireframe strokes, or draw far-side lines thinner/more
    transparent than near-side lines to fake depth ordering.'
  - The chart's vertical axis is labeled 'Z Axis' but the plotted values are actually
    z + (x+y)*sin(angle)*0.5 (a projected composite of Z, X and Y), not a pure Z value
    — the axis title and tick numbers don't correspond to the true Z data range (which
    is just sin(...) in [-1, 1]). Consider a note or different labeling so the tick
    numbers aren't misread as literal Z heights.
  - 'Design excellence is only moderate: DE-01/DE-02/DE-03 all land near the low-to-mid
    defaults because the dense overplotted mesh (see above) undercuts the visual hierarchy
    and refinement that would otherwise come from the clean brand-green wireframe.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "wireframe-3d-basic · python · pygal · anyplot.ai" in dark ink at top, fully visible and not clipped. X-axis (bottom, native pygal numeric ticks -8 to 8) and "Z Axis" (left, native pygal numeric ticks -2 to 3) both have real tick marks and axis titles. A top-left legend lists "X axis / Y axis / Z axis" corresponding to three thin diagonal gizmo lines with end dots crossing through the plot at the origin — the Y axis gizmo has no numeric tick marks of its own. Grid lines are subtle dashed horizontal lines.
      Data: The wireframe mesh (row/column polylines of an isometrically-projected sin(sqrt(x^2+y^2)) ripple surface) is rendered entirely in brand green (#009E73, Imprint position 1), forming a central peak with a bowl-shaped rim; because there is no hidden-line removal, near- and far-side mesh lines overlap into a dense woven texture in the middle of the plot. Axis gizmo lines and their end dots are dark ink, distinguishable from the green data.
      Legibility verdict: PASS - all title/axis/tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles and tick labels now rendered in light ink, fully legible against the dark background. Legend text and gizmo lines are also light-toned. Grid lines remain subtle and visible.
      Data: The wireframe mesh is rendered in the identical brand green (#009E73) as the light render — confirms only chrome (background, text, grid, legend) flipped between themes, data color is unchanged. Same overlapping-mesh density issue as the light render.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark failures observed anywhere (title, axis titles, tick labels, legend all use light ink).
