review:
  strengths:
  - 'Builds a true 3D wireframe in a 2D library: a 20x20 mesh projected from elevation
    30° / azimuth 45°, drawn as one pygal XY series with None gaps (allow_interruptions=True),
    so rows and columns meet at the grid points with open cells'
  - Axes are drawn along the front floor edges and the left vertical corner, below
    the surface, with outward ticks and world-unit tick numbers (X/Y at -5..5, Z at
    -1.0..1.0) kept clear of the mesh
  - Equal screen units per pixel on both axes (px_per_unit from the projected extent),
    so the projection is not stretched on the 3200x1800 canvas
  - 'Single brand-green #009E73 mesh at 4 px stroke reads clearly in both themes;
    axes and ticks use the INK / INK_SOFT tokens, so chrome flips correctly'
  - 'Clear text hierarchy: bold 52 px axis names over 44 px tick numbers, and the
    Z axis named with the function itself, Z = sin(√(X² + Y²))'
  weaknesses:
  - 'Suggestion: pass world coordinates as each label point''s tooltip (or disable
    tooltips on the label series) so the HTML view does not show projected screen
    coordinates on hover.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white or dark panels.
      Chrome: bold dark title "wireframe-3d-basic · python · pygal · anyplot.ai" centered at the top (~60 % of the width); thin dark axis lines along the two front floor edges and up the left corner; tick numbers -5, -2.5, 0, 2.5, 5 on X and Y and -1.0..1.0 on Z; bold axis names X, Y and "Z = sin(√(X² + Y²))". All readable, none touches the mesh.
      Data: a 20x20 wireframe of the sin(r) ripple in brand green #009E73, seen obliquely: raised far corner peak, the crest ring around the centre, the trough sweeping round the front, corners rising again; rows and columns cross at grid points with open cells; lines bunch where the surface turns edge-on (permitted).
      Legibility verdict: PASS

