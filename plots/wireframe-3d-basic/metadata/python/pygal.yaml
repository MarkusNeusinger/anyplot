      Background: warm near-black #1A1A17.
      Chrome: title, tick numbers and axis names in light ink (#F0EFE8), axis and tick lines in the soft light tone; no dark-on-dark text anywhere.
      Data: identical #009E73 mesh, same geometry as the light render; only chrome flipped.
      Legibility verdict: PASS
