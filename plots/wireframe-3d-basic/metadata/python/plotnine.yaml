review:
  strengths:
  - 'Correct Imprint theme-adaptive chrome in both renders: page background matches
    #FAF8F1 (light) / #1A1A17 (dark), ink tokens flip correctly, and the mesh stays
    #009E73 (brand green) unchanged between themes with no dark-on-dark or light-on-light
    legibility failures.'
  - 'Title matches the mandated format exactly: ''wireframe-3d-basic · python · plotnine
    · anyplot.ai''.'
  - 'Respects the plotnine ''no workarounds'' rule: since plotnine has no native 3D
    grammar, the implementation builds its own orthographic projection (elevation
    30°/azimuth 45°) and draws the result with plotnine''s own geom_path/geom_segment/geom_text
    primitives instead of falling back to matplotlib.'
  - All three axes are labeled with units (X/Y in cm, Z in mm) and tick marks, and
    wireframe mesh lines run in both x and y directions per the spec's 'Notes' section.
  - 'Clean top-to-bottom script: no functions/classes, all imports used, correct plot.save(...)
    API and filename pattern.'
  weaknesses:
  - 'No depth/hidden-line handling: every mesh line (near side and far side of the
    surface) is drawn at the same fixed alpha=0.35 with no z-depth-based ordering
    or fading, so the front and back of the ripple surface are fully superimposed.
    This produces a dense, tangled cluster of crossing lines near the plot center/lower
    dome that reads as visual noise rather than a legible 3D structure. Fix: fade
    or thin lines by depth (e.g. scale alpha/linewidth by the projected view-direction
    distance, or draw back-facing rows/cols first at lower alpha and front-facing
    ones last at higher alpha) to approximate hidden-line suppression, and/or reduce
    grid_n slightly (e.g. 20-22) to reduce line density.'
  - 'Z-axis tick labels (''1'', ''0'', ''-1'') are pushed 13 units left of their true
    projected position (z_ticks[''px''] = z_px - 13) to avoid merging with the Y-axis
    tick column, but this leaves them visually stranded far from the vertical Z-axis
    line at top-center, with no tick marks or leader connecting them to that axis
    — a viewer can easily mistake them for an unrelated fourth axis. Fix: move the
    Z tick labels closer to the Z-axis line (smaller offset) or add short tick marks/leader
    segments connecting each Z label back to the axis.'
  - The combination of the two issues above works against the spec's stated goal that
    a wireframe should 'reveal the underlying structure' of the surface — the current
    render is harder to parse as a coherent 3D ripple than it should be, hurting overall
    storytelling/data clarity even though the underlying math and data range are correct.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "wireframe-3d-basic · python · plotnine · anyplot.ai" centered at top in dark ink, fully visible, not clipped. Bold axis titles "X (cm)", "Y (cm)", "Z (mm)" placed at the ends of the three projected axis edges. Tick labels (-6, -3, 0, 3, 6 for X/Y; 1, 0, -1 for Z) rendered in a softer gray-ink tone. All text is clearly readable against the light background.
      Data: A green (#009E73) wireframe mesh forming two nested dome/ripple shapes (matching sin(sqrt(x^2+y^2)) over the given domain) with upturned petal-like edges. The mesh lines run in both grid directions as required. However, the near and far surface lines are fully superimposed with no depth ordering, creating a busy tangle of crossings near the lower-center of the shape that obscures the underlying structure.
      Legibility verdict: PASS (all text readable; the data-density/tangle issue is a clarity weakness, not a text legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels as the light render, now in light ink (#F0EFE8 for bold axis titles, softer light-gray for tick labels and axis lines) against the dark background. No dark-on-dark issues — all chrome text is clearly legible.
      Data: Identical #009E73 green mesh geometry and color to the light render — only the chrome (background, axis line color, text color) flips between themes, confirming correct theme-adaptive implementation. The same near/far mesh superimposition and tangled center region is present, as expected since it's a data/geometry issue independent of theme.
      Legibility verdict: PASS (all text readable in both themes; data colors identical between renders).
