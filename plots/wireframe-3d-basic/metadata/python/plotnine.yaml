review:
  strengths:
  - Technically sophisticated hand-rolled 3D-to-2D projection (view/right/up basis
    vectors, painter's-algorithm depth sort, depth-based alpha for approximate hidden-line
    suppression) built entirely from plotnine's native geom_segment/geom_text — respects
    the library's no-matplotlib-workaround rule.
  - Z-axis tick labels now have leader segments connecting them back to the vertical
    axis line, fixing the previous attempt's visually stranded floating-label issue.
  - 'Correct Imprint palette usage (BRAND #009E73 for the single data series), correct
    theme-adaptive PAGE_BG/INK/INK_SOFT tokens, and all chrome text is legible in
    both themes with no dark-on-dark or light-on-light failures.'
  - Title format, three labeled axes with units and tick marks, and a deterministic
    ripple dataset (grid_n=21, seeded) all match the specification.
  weaknesses:
  - The wireframe reads as a dense, self-crossing tangle (a 'crown'/basket-weave pattern)
    rather than a legible rippled surface — Z_LIFT=3.2 combined with the multi-period
    sin(sqrt(x^2+y^2)) ripple over a 21x21 grid makes adjacent rings of the surface
    overlap heavily once projected to 2D. Reduce Z_LIFT to roughly 1.5-2.0 and/or
    slightly reduce grid_n so the concentric ripple structure stays traceable by eye,
    and consider widening the depth-alpha range (currently 0.12-0.6) so near-side
    rings visually separate more clearly from far-side ones.
  - np.random.seed(42) is set but never used — grid_x/grid_y/grid_z are built purely
    from np.linspace/np.meshgrid/np.sin with no call into np.random. Remove the dead
    seed call (the data is already fully deterministic without it).
  - The X/Y/Z axis lines all converge at a point that sits visually in the middle
    of the wireframe mass, so the eye is drawn straight through the densest part of
    the crossing mesh lines instead of tracing the axis frame from a clear corner
    — consider nudging the axis-box corner or lightening mesh alpha near the convergence
    point so the axis reads as a distinct frame rather than cutting through the data.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "wireframe-3d-basic · python · plotnine · anyplot.ai" centered at top in dark ink, clearly readable. Three axis labels ("X (cm)", "Y (cm)", "Z (mm)") in bold dark text at the plot corners. Tick labels (-6,-3,0,3,6 on X/Y; -1,0,1 on Z with short leader segments back to the Z axis line) all in a soft dark gray, all legible against the light background. A three-edge axis "box" (dark gray lines) meets at a single point roughly in the middle of the composition.
      Data: A dense mesh of thin green (#009E73) segments forming a radially-symmetric ripple surface (sin(sqrt(x^2+y^2))) projected in pseudo-3D via depth-weighted alpha (fainter = farther, more opaque = nearer). The overall silhouette reads as a crown/flower shape with two upturned "wing" lobes at the sides and a domed peak in the center, but the interior is a dense tangle of crossing diagonal lines rather than a cleanly separable set of concentric rings.
      Legibility verdict: PASS (all title/axis/tick text is clearly readable against the light background; no light-on-light issues). Element visibility of the data mesh itself is weak due to overlap density (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels as the light render, all rendered in light ink (#F0EFE8) / soft light gray (#B8B7B0), clearly legible against the dark background. No dark-on-dark failures anywhere — axis lines, tick labels, and axis titles all show good contrast.
      Data: Data colors are identical to the light render — the same #009E73 green mesh with the same depth-alpha treatment, confirming chrome-only theme flip as required. Same crown/tangle silhouette and same interior density issue as the light render.
      Legibility verdict: PASS (all chrome text readable, brand green clearly visible against the dark surface; no dark-on-dark). Element visibility of the mesh itself is the same weakness as light.
