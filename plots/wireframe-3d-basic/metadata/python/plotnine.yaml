review:
  strengths:
  - Faithful adherence to plotnine's "no 3D workaround" rule — implements genuine
    camera-projection math (elevation 30°/azimuth 45°) instead of faking 3D or falling
    back to matplotlib, exactly as the library rules require.
  - 'Depth-based alpha combined with painter''s-algorithm edge sorting creates a convincing
    hidden-line-suppression effect: near-side mesh reads crisp, far-side mesh recedes,
    giving real visual hierarchy.'
  - 'Correct theme-adaptive chrome: identical brand-green mesh color across light/dark
    renders, INK/INK_SOFT correctly applied to axis lines, ticks and labels, both
    plot backgrounds match spec exactly (#FAF8F1 / #1A1A17).'
  - Deterministic, well-commented code that explains non-obvious choices, e.g. picking
    the (x=6, y=-6) axis corner specifically because it stays off the camera's view
    axis instead of cutting through the densest part of the mesh.
  - Physically plausible "drumhead vibration" framing with sensible cm/mm units and
    a well-chosen 21x21 grid density that stays legible instead of turning into a
    tangle.
  weaknesses:
  - In the upper-right region, the X-axis tick label '0' (and to a lesser extent '3')
    lands very close to the Z-axis tick labels ('1'/'0'), crowding that area — increase
    the separation between the X-tick offset (currently y=-9.6) and the Z-axis tick/leader
    cluster, e.g. by pushing X-ticks further out or nudging Z-tick leaders away from
    the axis corner.
  - The far/top ridge of the wireframe fades to alpha≈0.08 in the depth cue, verging
    on invisible in both renders — raise the alpha floor in scale_alpha_continuous
    (e.g. to ~0.18-0.20) so the distant surface stays faintly legible instead of nearly
    disappearing.
  - Two small top-level helper functions (project, depth) deviate from the CQ-01 'no
    functions' default — justified here by the manual 3D-projection math, but keep
    them minimal if further edits are made.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct light-theme surface — not pure white.
      Chrome: Title "wireframe-3d-basic · python · plotnine · anyplot.ai" centered at top in dark ink, clearly legible. Axis labels "X (cm)", "Y (cm)", "Z (mm)" in bold dark ink at the ends of their respective axis lines. Tick labels (-6..6 on X and Y, -1/0/1 on Z) rendered in soft grey ink; all are individually legible, though the X=0 and X=3 ticks sit close to the Z-axis tick cluster in the upper-right, creating a crowded (but not fully overlapping) area.
      Data: Wireframe mesh in brand green (#009E73), forming a rippled "drumhead" bowl shape with grid lines in both x and y directions. Depth-based alpha makes near-side lines fully opaque and far-side (top ridge) lines fade to near-invisibility (~0.08 alpha) — a deliberate depth cue, though the top ridge borders on too faint.
      Legibility verdict: PASS (all text readable; minor tick crowding noted as a weakness, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct dark-theme surface — not pure black.
      Chrome: Title, axis labels, and tick labels flip to light ink (#F0EFE8 for labels, #B8B7B0 for axis lines/ticks) and remain clearly readable against the dark background — no dark-on-dark failures observed.
      Data: Mesh color is identical brand green (#009E73) to the light render — only chrome (background, ink) flipped, as required. Same depth-fade behavior and same faint top ridge as in the light render.
      Legibility verdict: PASS (all text readable against the dark background; same minor tick-crowding note as light render).
