review:
  strengths:
  - 'Correct plotly workaround for the missing native wireframe trace: 60 Scatter3d
    line traces (30 rows + 30 columns) reconstruct a true wireframe mesh, matching
    the spec''s ''grid lines in both x and y directions'' requirement.'
  - 'Distinctive height-mapped coloring: each line segment''s color is driven by its
    own z-values through the Imprint diverging colorscale (line.color array + colorscale),
    giving the mesh a genuinely 3D read of the ripple shape rather than a flat single-color
    wireframe.'
  - 'Theme-adaptive chrome is threaded through correctly for the vast majority of
    elements: page background, title, axis titles, tick fonts, colorbar, and annotation
    all branch on ANYPLOT_THEME and read correctly in both renders.'
  - Colorbar is attached to only the final trace (showscale=True once) with a shared
    cmin/cmax=-1/1 across all 60 traces, so the color legend is accurate and non-redundant.
  - 'Clean, deterministic, single-purpose script: no functions/classes, no randomness
    (linspace + sin), minimal necessary imports (numpy, plotly, os), correct write_image
    dimensions (800x450 scale=4 -> 3200x1800) plus write_html for the interactive
    artifact.'
  weaknesses:
  - 'Title omits the language segment: reads ''wireframe-3d-basic · plotly · anyplot.ai''
    but SC-04 requires ''{spec-id} · {language} · {library} · anyplot.ai'' -> should
    be ''wireframe-3d-basic · python · plotly · anyplot.ai''.'
  - 'Dark render shows bright, high-contrast white grid/zero-lines cutting diagonally
    through the scene box (clearly visible crossing the mesh around the vertical and
    horizontal midplanes) that are essentially invisible in the light render -- the
    scene''s xaxis/yaxis/zaxis dicts set gridcolor and backgroundcolor but never set
    zerolinecolor/linecolor, so plotly''s un-themed default (near-white) blends into
    the light #FAF8F1 background but reads as a jarring un-brand-colored streak against
    the dark #1A1A17 background. Set zerolinecolor (and linecolor) to GRID or INK_SOFT
    alongside gridcolor for all three scene axes.'
  - The 30x30 grid combined with the chosen camera angle produces heavy line overlap/moiré
    clutter near the center peak of the ripple, especially where the near and far
    halves of the mesh cross -- a coarser grid (~22-24 per axis) or a touch thinner
    line width in the densest region would make individual wireframe strands easier
    to trace.
  - No use of units or richer descriptive labels on the axes (Radius (x)/(y), Height
    (z) are fine but generic) -- acceptable given the abstract math function, but
    a one-line note on the domain (e.g. range -5..5) directly on the axis title could
    tighten SC-03/VQ-06 further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark. Matches spec.
      Chrome: Title "wireframe-3d-basic · plotly · anyplot.ai" in dark ink, centered, fully visible and not clipped. Formula annotation "z = sin(√(x² + y²))" in soft gray, readable. Axis titles "Radius (y)", "Radius (x)", "Height (z)" rotated along their axes, dark ink, clearly legible. Tick labels on all three axes and on the colorbar are a lighter gray but still readable against the cream background. Colorbar titled "Height" with ticks 1, 0.5, 0, -0.5, -1, boxed with a subtle outline and off-white fill. Scene grid lines are faint and unobtrusive against the cream backdrop.
      Data: Wireframe mesh transitions from matte red at the low troughs (z ≈ -1) through a near-white/cream midpoint (z ≈ 0) to blue at the central peak (z ≈ 1), using the Imprint diverging scale (#AE3030 / page-bg / #4467A3) -- correct choice for signed height data. Mesh lines are visible throughout, though dense and overlapping near the central peak.
      Legibility verdict: PASS -- all title, axis, tick, and colorbar text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light. Matches spec.
      Chrome: Title, formula annotation, axis titles, tick labels, and colorbar text all switch to light ink (white / light gray) and remain fully readable against the dark background -- no dark-on-dark failures observed. However, the scene now shows bright, near-white diagonal grid/zero lines cutting visibly through the wireframe (most obvious crossing the middle of the mesh and along the back walls) that were essentially invisible in the light render -- an un-themed zerolinecolor/linecolor default that reads correctly by coincidence in light mode but stands out as an inconsistent, un-brand-colored streak in dark mode.
      Data: Colors are identical to the light render -- same matte-red-to-blue diverging scale with the same cmin=-1/cmax=1 range, confirming only chrome (not data colors) flips between themes, as required.
      Legibility verdict: PASS for text; FLAG for chrome -- the un-themed zeroline/gridline artifact is a real theme-adaptation gap even though no text is unreadable.
