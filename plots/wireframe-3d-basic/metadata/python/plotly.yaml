review:
  strengths:
  - Height-based diverging color (imprint_div) mapped per-line with a single shared
    colorbar via the last-trace showscale trick — elegant, and the diverging polarity
    is the right choice since height is a signed deviation around z=0
  - 'Correct plot type: a true wireframe built from row-direction AND column-direction
    go.Scatter3d ''lines'' traces — a see-through mesh, not a solid surface, matching
    the spec''s definition precisely'
  - Theme-adaptive chrome (background, ink, grid, colorbar bgcolor/outline) threaded
    correctly through both renders — both plot-light.png and plot-dark.png are fully
    legible with no dark-on-dark or light-on-light failures
  - Canvas is exactly 3200x1800 (width=800, height=450, scale=4), correct PNG+HTML
    outputs, deterministic KISS-structured code with only necessary imports (numpy,
    plotly.graph_objects)
  weaknesses:
  - 'Excessive dead whitespace around the 3D object: a large empty gap sits between
    the title/formula annotation and the top of the wireframe, and another wide gap
    sits between the plot''s right edge and the colorbar. The wireframe cube occupies
    well under half the canvas area. Move the camera closer (reduce the eye-vector
    magnitude below plotly''s default ~2.17, e.g. eye={x:1.3,y:1.3,z:0.9}) and/or
    enlarge the scene domain and pull the annotation down closer to the plot top to
    tighten the composition and raise canvas utilization.'
  - The dense 24x24 line grid combined with the highly oscillatory ripple surface
    produces a busy 'starburst' tangle of crossing lines near the plot center, which
    mildly obscures the underlying surface topology despite the helpful diverging
    color cue. A slightly coarser grid (e.g. 20x20, still within the spec's 20x20-50x50
    recommendation) or marginally thinner lines would reduce clutter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "wireframe-3d-basic · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. Formula annotation "z = sin(√(x² + y²))" in soft gray below the title. Axis titles "Radius (x)", "Radius (y)", "Height (z)" and tick labels in dark/soft-dark ink, all readable against the light background. Colorbar titled "Height" with tick labels 1, 0.5, 0, -0.5, -1, housed in a light elevated box with a subtle outline.
      Data: A 3D wireframe mesh (grid lines in both x- and y-directions) forming a "sombrero"-like ripple surface. Lines are colored via a red-to-blue diverging scale (matte red at height -1, near-neutral at 0, blue at height +1) that matches the plot background at the zero midpoint, consistent with the Imprint `imprint_div` continuous colormap.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, formula annotation, axis titles, and tick labels, now rendered in light ink (white/light-gray), clearly legible against the dark background. Colorbar box uses a darker elevated fill with a light-gray outline; "Height" title and tick labels are light-colored and readable.
      Data: Same wireframe mesh and same red-to-blue diverging color scale as the light render — the data colors are identical between the two themes; only the chrome (background, text, grid, colorbar box) flips as expected.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/colorbar text is clearly visible against the near-black background.
