review:
  strengths:
  - Implements every optional feature from the spec notes (LOESS smoothing, ±2σ outlier
    bands, outlier highlighting, alpha transparency) on top of the mandatory zero-reference
    line.
  - Realistic, well-chosen synthetic data (quadratic + heteroscedastic noise) that
    visibly demonstrates both non-linearity and heteroscedasticity through the LOESS
    curve and residual spread.
  - Clean, idiomatic single-pipeline ggplot2 code with correct theme-adaptive chrome,
    exact canvas dimensions, and identical data colors across themes.
  weaknesses:
  - Major gridlines use the full-opacity INK token (panel.grid.major = element_line(color
    = INK, ...)) instead of a faint low-opacity rule color, so they render nearly
    as dark/bright as the axis text in both themes — competes visually with the data.
    Use a low-alpha rule token (e.g. ~15% opacity of INK) instead.
  - plot.title doesn't set face = "bold", so the title doesn't lead the visual hierarchy
    as strongly as the style guide intends.
  - The outlier/normal split leans on a red/green hue difference; while redundantly
    encoded by position (outside the dashed band), an additional shape distinction
    would make it more robust for color-vision-deficient viewers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target, not pure white.
      Chrome: Title "residual-plot · r · ggplot2 · anyplot.ai" (dark, top-left), horizontal legend ("Normal" green, "Outlier (>2σ)" red), axis titles "Fitted Sale Price ($)" / "Residual ($)", tick labels ($200k/$400k/$600k, $100k...-$100k) — all dark/soft-dark and clearly readable. Major gridlines render at near-full ink opacity (too bold, not subtle — a real weakness).
      Data: Green (#009E73) "Normal" points, red (#AE3030) "Outlier" points beyond the dashed ±2σ bands, blue (#4467A3) LOESS curve showing a parabolic dip, bold black zero-reference line.
      Legibility verdict: PASS (all text readable; gridline boldness is an aesthetic issue, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target, not pure black.
      Chrome: Same title/legend/axis titles/tick labels, all flipped to light/soft-light text — fully readable, no dark-on-dark failures on title, axis labels, ticks, or legend. Same gridline-prominence issue recurs (bright near-white gridlines, not subtle).
      Data: Colors identical to light render — green normal points, red outliers, blue LOESS line — confirmed unchanged across themes.
      Legibility verdict: PASS (no dark-on-dark issues found; gridlines are the only non-subtle chrome element)
