review:
  strengths:
  - 'All three weaknesses from attempt 1 were fixed precisely: gridlines now use a
    low-alpha RULE token instead of full-opacity INK, the title is bold, and outliers
    are now redundantly encoded with both color and shape (scale_shape_manual).'
  - Implements every optional feature from the spec notes (LOESS smoothing, ±2σ outlier
    bands, outlier highlighting, alpha transparency) on top of the mandatory zero-reference
    line.
  - Realistic, well-chosen synthetic data (quadratic + heteroscedastic noise) that
    visibly demonstrates both non-linearity and heteroscedasticity through the LOESS
    curve and residual spread.
  weaknesses:
  - Data storytelling composition is unchanged from attempt 1 — still relies solely
    on the LOESS curve and banding for hierarchy; a stronger focal treatment could
    push DE-03 further.
  - Library Mastery remains a fairly standard geom_point + geom_smooth + geom_hline
    composition; no ggplot2-distinctive technique was added to differentiate it further.
