review:
  strengths:
  - 'Correct standard residual-plot structure: fitted (predicted) values on the x-axis,
    residuals on the y-axis, and a theme-adaptive zero reference line via markLine'
  - Heteroscedasticity is genuinely baked into the synthetic data (noise scale grows
    with predicted delivery time), producing a visible fan-out pattern that matches
    the spec's diagnostic use case
  - ±2σ band via markArea plus a separate 2.5σ outlier threshold, with outliers rendered
    in semantic matte-red and with larger size + higher opacity than normal points
    — real redundant encoding, not color alone
  - Theme-adaptive chrome is threaded through consistently (ink/inkSoft/grid tokens
    on title, legend, axis labels, axis lines, split lines, and the zero-line itself)
  - Clean, deterministic, seeded (LCG) data generation in-browser with no external
    dependencies
  weaknesses:
  - X-axis ticks are unevenly spaced near the edges (13, 20, 30, 40, 50, 60, 62) because
    explicit min/max (floor(min-2)/ceil(max+2)) override ECharts' auto interval —
    the boundary labels 13 and 62 sit awkwardly close to the neighboring round ticks
    (60). Round min/max to nicer numbers (e.g. min:10, max:65) or set an explicit
    xAxis.interval for evenly spaced ticks.
  - LM-02 (distinctive features) is only modestly demonstrated — beyond markLine/markArea,
    no other ECharts-specific configuration (e.g. tooltip formatter, axisPointer)
    is used to strengthen the interactive HTML detail view.
  - Outlier vs normal points are distinguished by color plus size/opacity, which is
    adequate, but an additional marker-shape difference would give extra CVD safety
    margin beyond the semantic green/red pairing.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "residual-plot · javascript · echarts · anyplot.ai" in dark ink, centered top, clearly readable. Legend ("Normal" / "Outlier (|z| > 2.5σ)") below the title, dark text, readable swatches. Axis titles "Predicted Delivery Time (min)" and "Residual (min)" in dark ink, tick labels in a slightly softer dark gray — both legible. Gridlines are light gray, subtle but visible on both axes. A solid dark horizontal line marks residual = 0. A light-gray shaded band marks the ±2σ zone.
      Data: ~300 green (#009E73) circular points scattered around zero with a visible increase in spread toward higher predicted values (heteroscedasticity), plus 6 larger, more opaque matte-red (#AE3030) circles marking |z| > 2.5σ outliers, clustered mostly at higher predicted values and at the extremes of the residual range.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light/off-white ink, tick labels in a softer light gray — both clearly legible against the dark background. Legend text is light-colored and readable. Gridlines are a subtle light gray, visible but not competing with the data. The zero-reference line is rendered in the light ink token (flips correctly from dark to light for contrast). The ±2σ band renders as a slightly lighter charcoal rectangle, still distinguishable from the pure dark background.
      Data: Same green (#009E73) and matte-red (#AE3030) data colors as the light render, in the same positions — confirms the Imprint categorical palette data colors are identical across themes; only chrome (background, text, grid, zero-line, band fill) adapted.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly visible against the dark surface.
