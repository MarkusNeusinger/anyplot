review:
  strengths:
  - 'Correct residual plot structure: fitted/predicted values on x-axis, residuals
    on y-axis, with a clean horizontal zero-reference line (markLine) representing
    perfect predictions'
  - Realistic delivery-time regression context with genuine mild heteroscedasticity
    baked into the data generation (noise scale grows with predicted minutes) — a
    real diagnostic scenario, not a random blob
  - Outliers use a z-score threshold and are differentiated by color, larger marker
    size, and higher opacity — multi-channel encoding, not color alone, which helps
    CVD accessibility
  - Alpha transparency (opacity 0.6) on normal points sensibly reduces overplotting
    with n=300 observations
  - Theme-adaptive chrome correctly threads tokens through title/legend/axis/gridlines/reference
    line in both renders; data colors (green normal, red outlier) are identical between
    light and dark
  - Clean, deterministic, dependency-free implementation using a small seeded LCG
    + Box-Muller-style Gaussian generator
  weaknesses:
  - The shaded ±2σ band (markArea, bandLow/bandHigh = 2*std) and the outlier-coloring
    threshold (2.5*std) don't match — several points sit visibly outside the gray
    band yet remain colored 'Normal' (e.g. near predicted≈36min/residual≈-7.3, and
    predicted≈57min/residual≈8.4 in both renders). Align both to the same multiple
    of sigma so the shaded region and the colored outliers tell one consistent story.
  - No LOWESS/smoothing trend line through the residuals — optional per spec, but
    a simple moving-average or binned-mean line would strengthen the non-linearity-detection
    storytelling and could raise Library Mastery / Data Storytelling further.
  - Legend text (16px) is noticeably smaller than the title (22px); likely fine at
    desktop but worth double-checking legibility at the ~400px mobile preview size.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-style), not pure white.
      Chrome: Title "residual-plot · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Legend ("Normal" green dot, "Outlier (|z| > 2.5σ)" red dot) below title in dark ink, readable. X-axis "Predicted Delivery Time (min)" and y-axis "Residual (min)" labels in dark ink, readable. Tick labels in a softer dark gray, legible. Gridlines light gray and subtle. A solid black horizontal reference line marks y=0. A gray shaded band marks the ±2σ region.
      Data: First series (Normal) uses the brand green #009E73 at opacity 0.6, second series (Outlier) uses a red/terracotta tone at opacity 0.9 with a larger marker. Residuals scatter around zero with visible mild heteroscedasticity (wider spread at higher predicted values) and 6 flagged outliers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-style), not pure black.
      Chrome: Title, legend, and both axis titles render in light/off-white text, clearly readable against the dark background. Tick labels in a lighter soft gray, legible — no dark-on-dark failures observed. Gridlines are subtle dark gray, still visible. The zero-reference line correctly flips to white/light color for dark-mode contrast. The ±2σ band renders as a slightly lighter gray-on-black region, still discernible from the background.
      Data: Confirmed identical green (#009E73) and red marker colors and identical point positions to the light render — only chrome (background, text, line/band colors) adapted to the theme.
      Legibility verdict: PASS
