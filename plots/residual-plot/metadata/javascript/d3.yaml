review:
  strengths:
  - 'Complete feature set: zero-reference line, ±2σ outlier bands, binned local-mean
    smoother, and color+size-coded outliers are all present per spec'
  - Theme-adaptive chrome is correct in both renders — all text and grid elements
    read clearly on both surfaces, and the Imprint data colors (green/blue/red) are
    pixel-identical between light and dark
  - Realistic, neutral energy-consumption regression scenario that visibly demonstrates
    the classic residual-plot diagnostic pattern (variance fanning out as the fitted
    value grows)
  - 'Idiomatic D3 axis handling: a separate floating-grid group (domain removed, tick
    lines used as gridlines) versus the labeled tick-axis group (domain kept, tick
    marks removed) — clean L-shaped spines with no chartjunk'
  weaknesses:
  - Design is solid but fairly standard — the ±2σ band is a flat uniform gray rectangle
    and the legend is unboxed plain text; a touch more visual refinement (e.g. a softer
    band edge, a subtle backdrop behind the legend) would lift Design Excellence further
  - The 'Local mean (binned)' smoother is a simple per-bin average rather than a true
    LOWESS/kernel fit; acceptable under the spec's 'LOWESS-style' allowance, but a
    real kernel smoother would read even cleaner
  - lcgRand/lcgRandn are small standalone helper functions, a minor deviation from
    the strict KISS 'no functions' guidance — necessary here for seeded randomness
    in the browser, so only a small deduction
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "residual-plot · javascript · d3 · anyplot.ai" in bold dark ink at top-center; x-axis label "Fitted Value — Predicted Energy Consumption (kWh)" and rotated y-axis label "Residual — Actual − Predicted (kWh)" in dark-soft ink; tick labels dark and legible; subtle gray gridlines on both axes; all clearly readable against the light background.
      Data: ~400 green (#009E73) circles scattered around a dashed "y = 0" reference line, fanning out (heteroscedastic spread) as fitted value increases; a muted gray band marks the ±2σ zone with dashed boundary lines labeled "+2σ"/"−2σ"; a blue smoothed trend line tracks the local mean; red-colored, slightly larger circles mark points outside ±2σ as outliers; a top-left legend labels "Residual", "Outlier (|residual| > 2σ)", and "Local mean (binned)".
      Legibility verdict: PASS — no light-on-light text, all chrome and data clearly distinguishable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/off-white, fully legible against the dark background; gridlines rendered as faint light lines, still subtle but visible.
      Data: Same green residual points, blue smoother line, and red outlier points as the light render — colors are identical (only chrome flipped), confirming the Imprint palette is theme-invariant for data. The ±2σ band and its dashed boundary lines / labels remain visible and legible.
      Legibility verdict: PASS — no dark-on-dark text; every title, axis label, tick label, and legend entry is clearly readable against the near-black surface.
