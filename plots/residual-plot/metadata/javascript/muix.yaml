review:
  strengths:
  - Residuals are computed from an actual OLS fit (slope and intercept from the generated
    data), so the cloud is mean-zero by construction and every point sits at its computed
    fitted value and residual
  - 'The ±2σ bands come from the plotted residuals'' SD and are drawn symmetric about
    zero; outliers beyond them are split into their own series in the Imprint semantic
    red #AE3030, while the bulk keeps brand green #009E73'
  - 'Native ChartsReferenceLine composition: the zero line is a solid ink line and
    the bands are dashed inkSoft lines, and their labels carry a page-colored halo
    (paintOrder stroke) so they stay legible over the grid in both themes'
  - Inliers at 0.6 fill opacity with a page-colored marker outline keep the dense
    middle readable; the heteroscedastic widening toward larger homes is clearly visible
  - 'Uses the MUI X v9 API correctly: explicit axis band sizes (height 64, width 92),
    slotProps.legend.sx, [data-series] CSS selectors, skipAnimation, and the native
    tooltip in the HTML output'
  weaknesses:
  - 'Suggestion: a LOWESS line, which the Notes allow, would make it easy to confirm
    that the residuals show no curvature.'
  - 'Suggestion: the inlier green at 0.6 opacity reads somewhat muddy on the dark
    surface; a slightly higher opacity in dark would keep more of the brand green.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title "residual-plot · javascript · muix · anyplot.ai" centered at top; a softer subtitle "220 observations · residual = observed − predicted · SD 40,507 USD · 14 beyond ±2σ"; a horizontal legend (green "Residuals within ±2σ", red "Outliers beyond ±2σ"); y axis "Residual (USD)" with ticks -120,000 to 120,000; x axis "Predicted price (USD)" with ticks 150,000 to 450,000; a subtle grid on both axes. All text is dark on light and readable.
      Data: about 206 semi-transparent brand-green #009E73 points with page-colored outlines; 14 larger matte-red #AE3030 outliers beyond the dashed ±2σ lines (labeled "+2σ = 81,014" and "−2σ = −81,014"); a solid dark zero line labeled "Perfect prediction: residual = 0" spans the full x range. The spread widens from left to right (heteroscedasticity).
