review:
  strengths:
  - 'Correct Imprint palette handling: brand green first series, matte-red semantic
    anchor correctly reserved for the outlier/error role instead of spent as an ordinal
    color'
  - Outlier status is redundantly encoded via both color and marker size, a good colorblind-safety
    practice beyond the base palette
  - Theme-adaptive reference lines and marker edge strokes keep chrome correct in
    both themes with zero dark-on-dark/light-on-light issues
  - Realistic, deterministic synthetic regression scenario (house price vs. square
    footage) that naturally produces the heteroscedastic pattern a residual plot is
    meant to surface
  weaknesses:
  - Title renders proportionally small (~33% of canvas width vs. the ~50-70% guideline)
    - increase the Typography fontSize from 26 to roughly 34-36 CSS px so the title
    carries appropriate visual weight and stays legible when scaled down to mobile
    widths
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
