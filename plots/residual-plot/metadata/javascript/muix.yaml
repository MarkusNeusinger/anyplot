review:
  strengths:
  - 'Correctly implements every required spec feature: residual = y_true - y_pred
    against fitted values, a y=0 reference line, ±2σ outlier bands, and semantic outlier
    recoloring, all in one deterministic in-memory dataset'
  - Alpha transparency (0.55 in-band, 0.85 outliers) plus a size bump (7px vs 11px)
    keeps the 220-point scatter readable without solely relying on hue to separate
    categories
  - ChartsReferenceLine labels (zero line, +2σ, -2σ) are numerically annotated and
    correctly theme-adaptive (t.ink / t.inkSoft), reading clearly in both light and
    dark renders
  - Data colors (brand green residuals, semantic-red outliers) are pixel-identical
    between light and dark renders — only chrome flips, exactly per the Imprint theming
    contract
  - 'Realistic, neutral synthetic data: OLS-fit house price vs. square footage with
    noise that scales with fitted value, producing a genuine heteroscedastic fan pattern
    that gives the diagnostic plot something real to show'
  weaknesses:
  - Outlier vs. in-band coloring leans on a red/green hue split (partially mitigated
    by the size and opacity difference) — consider an additional shape or stroke cue
    if iterating further for stronger CVD-safety
  - No LOWESS/kernel smoothing line over the residuals (spec lists this as optional)
    — would have strengthened non-linearity detection storytelling but is not required
  - Visual refinement is solid but fairly close to MUI X defaults (standard axis lines,
    default grid weight) — a touch more chrome reduction (e.g. thinner axis lines)
    would push it further into 'polished' territory
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "residual-plot · javascript · muix · anyplot.ai" centered at top, fully visible with no clipping. X-axis "Fitted Price ($)" and Y-axis "Residual ($)" labels in dark ink, tick labels in a softer gray. Subtle light-gray horizontal/vertical gridlines. Legend ("Residuals", "Outliers (|residual| > 2σ)") sits top-center in dark text on light swatches, fully legible. Reference lines: a solid dark "Perfect fit: residual = 0" line at y=0, and two dashed gray lines at "+2σ: 81,015" / "−2σ: -81,015", each with a right-aligned numeric label that does not overlap any data point (verified via close crop).
      Data: ~220 semi-transparent green circles (rgba(0,158,115,0.55)) scattered around the zero line in a widening fan pattern (heteroscedastic), plus ~13 larger, more opaque red circles (rgba(174,48,48,0.85)) beyond the ±2σ bands.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in white, axis labels/ticks in light ink/soft-gray, gridlines in a lighter subtle gray against the dark surface. Legend text is white, legend swatches unchanged. The zero-reference line is now solid white (t.ink flipped correctly), the ±2σ dashed lines are a lighter gray (t.inkSoft flipped correctly) — no dark-on-dark failures anywhere.
      Data: Same green (rgba(0,158,115,0.55)) and red (rgba(174,48,48,0.85)) marker colors as the light render, confirmed pixel-identical — only chrome flipped, per the Imprint contract.
      Legibility verdict: PASS
