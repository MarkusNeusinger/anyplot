review:
  strengths:
  - 'Addressed both attempt-1 weaknesses directly: added alpha transparency (rgba
    palette[0] at 0.7) on residual markers to soften overlapping clusters, and added
    a rolling-mean smoothed trend line to surface non-linear patterns in the residuals'
  - 'Correct semantic palette usage: brand green (palette[0]) for the main residual
    series, matte-red (palette[4]) AND a triangle marker shape for outliers (redundant,
    CVD-safe encoding), amber anchor for the ±2σ threshold lines'
  - 'Theme-adaptive ±2σ band shading: the relative-fill overlay tint flips (dark tint
    on light bg, light tint on dark bg) so the shaded region stays subtly visible
    in both themes instead of a single hardcoded color'
  - Deterministic LCG + Box-Muller-style gaussian data generation with realistic heteroscedastic
    house-price regression scenario (variance grows with fitted value)
  - 'Idiomatic Chart.js technique mix: relative `fill: "+2"` dataset-index trick for
    the band, `legend.filter` callback to suppress duplicate band-line legend entries,
    mixed scatter+line datasets'
  weaknesses:
  - A few marker clusters (e.g. near fitted≈250, fitted≈560) still touch slightly
    even with alpha=0.7 — a marginally lower alpha or smaller point radius in dense
    regions would separate them further
  - The two ±2σ threshold lines are filtered out of the legend entirely rather than
    merged into one labeled entry — a first-time viewer has no textual cue for what
    the dashed amber lines represent
  - Visual refinement is professional but not distinctive beyond the functional band/outlier/trend
    treatments — no standout design flourish beyond what's functionally required
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "residual-plot · javascript · chartjs · anyplot.ai" in dark ink, comfortably sized, not overflowing. Legend row below title (Zero reference / Residuals / Smoothed trend / Outliers (>2σ)) in dark text. Axis titles "Fitted Value ($1,000s)" and "Residual ($1,000s)" in dark ink with units. Tick labels in a softer dark grey. Grid lines light grey, subtle but visible. All fully readable.
      Data: ~220 green (#009E73) circular residual points at ~0.7 alpha spread over Fitted Value ($150k-$600k) vs Residual (-80 to +80), a solid black zero-reference line, two amber dashed ±2σ lines with a faint shaded band between them, a light-purple dotted rolling-mean smoothed trend line, and ~11 matte-red triangular outlier points beyond the bands. First series correctly uses brand green.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title and legend, now rendered in light/white ink, fully readable against the dark surface. Axis titles and tick labels in light tones, no dark-on-dark issues anywhere. Zero-reference line correctly flips to a light/white stroke (theme-adaptive ink token). Grid lines subtle dark-grey, still visible.
      Data: Green circles, amber dashed bands, purple dotted trend line, and matte-red outlier triangles are pixel-identical in color and position to the light render — confirms only chrome flipped, not data colors.
      Legibility verdict: PASS.
