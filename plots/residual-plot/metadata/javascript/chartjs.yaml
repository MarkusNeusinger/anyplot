review:
  strengths:
  - 'Correct semantic palette use: brand green for the main residual series, palette[4]
    matte red AND a triangle marker shape for outliers (redundant, CVD-safe encoding)'
  - '±2σ threshold bands implemented via Chart.js''s relative fill: "+2" index trick,
    with the legend filter callback cleanly hiding the two band traces so only meaningful
    entries show'
  - Deterministic LCG-seeded data with realistic heteroscedastic noise (variance grows
    with fitted value) — a textbook regression-diagnostics pattern
  - Theme-adaptive chrome (zero-reference line, axis borders, tick/text colors) consistently
    sourced from ANYPLOT_TOKENS in both themes
  weaknesses:
  - No alpha transparency on the residual markers despite the spec's guidance to use
    alpha for overlapping points — a few clusters (near fitted≈250, fitted≈560) have
    touching/overlapping circles
  - No optional LOWESS/kernel smoothing trend line — would add diagnostic value for
    detecting non-linearity, though this is explicitly optional in the spec
  - Visual refinement is solid but generic — no standout design flourish beyond the
    functional band/outlier treatment
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec target.
      Chrome: Title "residual-plot · javascript · chartjs · anyplot.ai" and legend ("Zero reference", "Residuals", "Outliers (>2σ)") render in dark ink; axis titles ("Fitted Value ($1,000s)", "Residual ($1,000s)") and tick labels are dark/secondary-tone and clearly legible.
      Data: ~220 green (#009E73) circular points, solid black zero-reference line, amber dashed ±2σ bands with a faint shaded interior, ~11 red (#AE3030) triangular outlier points beyond the bands.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec target.
      Chrome: Title and legend render in light/white ink; axis titles and tick labels in a lighter secondary tone. Zero-reference line correctly flips to a light/white stroke (theme-adaptive ink token). No dark-on-dark issues found.
      Data: Brand green circles and matte-red triangle outliers are pixel-identical in color to the light render — confirmed only chrome (background, text, zero-reference line color) flips between themes, not data colors.
      Legibility verdict: PASS
