review:
  strengths:
  - 'Correct residual-plot semantics: fitted values on x-axis, residuals on y-axis,
    a y=0 reference plotLine, a shaded ±2 SD plotBand, and outliers beyond the threshold
    styled and labeled distinctly.'
  - 'Theme-adaptive chrome is done right: identical data colors (green inliers, red
    outliers, violet trend) in both renders, only chrome (background, ink, grid) flips
    between light and dark.'
  - 'Clean, deterministic code: seeded LCG + Box-Muller gaussian for reproducible
    data, no unused imports, correct mount-node/API usage (Highcharts.chart into #container,
    chart and series animation both disabled).'
  - 'Idiomatic Highcharts feature use: plotLines/plotBands for the reference line
    and outlier band, Highcharts.color().setOpacity() for alpha-blended marker fills,
    and a dataLabels formatter for outlier value callouts.'
  - Realistic, neutral house-price regression scenario with a genuinely heteroscedastic
    (funnel-shaped) spread that demonstrates the diagnostic value of the plot.
  weaknesses:
  - The binned-mean trend line wobbles noticeably (roughly ±20) across bins even though
    the data-generating process has zero conditional mean everywhere (only the variance
    grows) — this can visually suggest a spurious non-linear pattern that isn't actually
    present. Increasing the bin count (reducing per-bin noise) or using a true LOWESS/kernel
    smoother would keep the trend closer to flat-at-zero, matching the diagnostic
    intent.
  - In the densest fitted-value range (~275-450 $k), points overlap substantially
    even with marker fillColor alpha=0.5 — a slightly smaller marker radius (e.g.
    3.5) or lower opacity (e.g. 0.4) would improve separability of adjacent overlapping
    residuals.
  - Distinctive-feature usage (plotBands/plotLines/dataLabels) is solid but fairly
    standard Highcharts fare; nothing that showcases a rarer library capability for
    extra Library Mastery credit.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "residual-plot · javascript · highcharts · anyplot.ai" centered at top, clearly legible. Axis titles "Fitted Value ($k)" (x) and "Residual ($k)" (y) in medium-gray ink, tick labels in the same tone, all clearly readable against the light background. Grid lines are subtle light gray, visible but not dominant. A solid black horizontal reference line sits at Residual=0. A light gray shaded plotBand spans roughly ±75 (the ±2 SD range).
      Data: Green (#009E73) semi-transparent circular markers for inlier residuals scattered around zero with visible funnel-shaped (heteroscedastic) spread widening toward higher fitted values. Nine dark-red/maroon circular markers (outlined in black) mark outliers beyond ±2 SD, each labeled with its dollar value (e.g. "$111.2k", "-$89.6k") in black text — all labels sit clear of other elements. A dashed violet "Trend (binned mean)" spline oscillates mildly around zero. Legend at the bottom lists all three series with matching swatches.
      Legibility verdict: PASS — no text is light-on-light; all chrome and data-label text is dark and crisp against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title now rendered in white, axis titles and tick labels in light gray — all clearly legible against the dark background. Grid lines are subtle dark gray, still visible. The y=0 reference line is now a light/white horizontal line (correctly flipped from black), and the ±2 SD plotBand is a slightly lighter charcoal panel, still distinguishable from the pure background.
      Data: Data colors are identical to the light render — same green inliers, same dark-red outliers, same violet dashed trend line — only the chrome (background, ink, grid, reference line, band) has flipped as required. Outlier data-label text is white, clearly readable against the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, tick label, and data-label callout is clearly visible against the near-black surface.
