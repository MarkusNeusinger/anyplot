review:
  strengths:
  - 'Correct residual-plot construction: fitted values on x, residuals (y_true - y_pred
    proxy) on y, with a clear heteroscedastic funnel pattern that gives the diagnostic
    real value'
  - Zero reference line, ±2 SD shaded band, and outliers beyond the threshold are
    all present per the spec's optional recommendations
  - 'Outliers are CVD-safe: distinguished from inliers by color, size (radius 6 vs
    5), opacity (opaque vs 0.65 alpha), and a dark border ring — not color alone'
  - 'Both themes read cleanly with identical data colors (green #009E73 inliers, palette[4]
    outliers) and correctly flipped chrome (background, grid, zero line, band tint)'
  - Deterministic seeded LCG data generation, clean idiomatic Highcharts scatter setup
    (plotLines, plotBands, colors from tokens), title/axis labels correctly formatted
    with units
  weaknesses:
  - No LOWESS/smoothing trend line through the residuals — optional per spec but would
    add real diagnostic value for spotting non-linear patterns and would strengthen
    the data-storytelling score
  - 'Marker overplotting in dense regions of the fitted-value axis (e.g. 250-400 range):
    radius 5 at alpha 0.65 with 220 points still produces visible cluster overlap
    — consider radius ~4 or alpha ~0.5 for the inlier series'
  - Design is functionally correct but visually conservative — generic grid/spine
    treatment beyond the shaded band and zero line; no additional refinement (e.g.
    subtler y-axis-only grid, more distinctive marker treatment) to lift it past a
    solid-default look
  - 'Library mastery is basic: uses only plotLines/plotBands/marker styling — no more
    distinctive Highcharts-specific capability (e.g. a formatter-driven tooltip context,
    or per-point dataLabels for the top outliers) is demonstrated'
  image_description: |-
