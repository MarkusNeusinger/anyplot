      Data: First series (inliers) is the Imprint brand green (#009E73) at ~0.65 opacity, clearly visible against the light background; ~220 points show a funnel-shaped heteroscedastic spread widening as fitted value increases. Outlier series (8 points beyond ±2 SD) rendered in a dark red/maroon (palette[4]) with a dark border ring and larger radius, clearly distinguishable from inliers by color, size, and opacity — not by color alone.
