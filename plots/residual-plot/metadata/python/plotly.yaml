review:
  strengths:
  - 'Theme tokens (INK, INK_SOFT, GRID, ELEVATED_BG, PAGE_BG) reach every chrome element:
    all text, axis lines, grid and the legend frame read cleanly on both #FAF8F1 and
    #1A1A17, while the Imprint data colors stay identical across renders'
  - 'Every spec feature is present and computed from the plotted residuals: a zero
    line spanning the full fitted range, symmetric ±2 SD bands from the residual standard
    deviation, outliers beyond 2 SD as purple diamonds apart from the green cloud,
    and a centered moving-average trend (pandas rolling) that follows the local mean'
  - 'Native plotly hover: per-trace hovertemplate with formatted fitted/residual values
    and <extra></extra>, hoverinfo=''skip'' on reference lines so the HTML view only
    reports data points'
  - 'Clean data/plot separation: column constants with role comments, one Data block
    ending in df, np.polyfit for the fit and a seeded default_rng — the plot reads
    only df and the constants'
  - Canvas follows the library rule exactly (autosize=False, 800×450 at scale=4, pinned
    margins) with the legend placed outside the plot area so no data mark is covered
  weaknesses:
  - 'DQ-02 (both): the scenario is abstract — the axes read ''Fitted value'' and ''Residual
    (observed − fitted)'' over a unitless 0–28 range with no named domain → a concrete
    regression context with real variable names and units (e.g. predicted house price
    in $k, or fuel consumption in L/100 km). Likely cause: the OBSERVED/PREDICTED
    constants and the synthetic x = linspace(0, 10) data carry no domain.'
  - 'Suggestion: the ±2 SD bands and the outlier diamonds share #C475FD; drawing the
    bands in INK_SOFT dashes would leave the purple to the outliers alone.'
  - 'Suggestion: a slightly wider smoothing window (e.g. 25) would make the curved
    drift of the trend read more smoothly.'
