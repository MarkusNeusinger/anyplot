      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: title 'residual-plot · python · pygal · anyplot.ai' in dark ink; x title 'Predicted delivery time (min)', y title 'Residual: observed minus predicted (min)' wrapped onto two lines; ticks 12-75 on x and -28..28 on y; dotted muted grid; legend row at the bottom (Residuals, Outliers (>2σ), Zero line, +2σ, −2σ) with very small square swatches
      Data: ~136 green #009E73 dots, residual spread widening toward long routes; 4 outliers in red #AE3030 (+20 at 23 min, -18 at 44, +25 at 67, +11 at 73); solid dark zero line across the full range; dashed muted bands at about ±9
