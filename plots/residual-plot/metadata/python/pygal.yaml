review:
  strengths:
  - Zero line in solid ink spans the full fitted range and stays visible through the
    cloud in both themes
  - ±2σ bands and outlier threshold computed from the plotted residuals (residuals.std()),
    so they stay correct on other data
  - 'Theme tokens threaded through Style: background, text, grid and reference lines
    flip cleanly while #009E73 / #AE3030 stay identical'
  - Data block ends in a tidy df with role-tagged column constants; axes, ticks and
    bands derived from df
  - Per-series stroke_style overrides on one pygal.XY chart and interactive tooltips
    in the HTML output
  weaknesses:
  - 'VQ-03 (both): legend swatches are ~12 px squares beside 36 px legend text, and
    the zero line and ±2σ entries show squares instead of line samples → swatches
    near the text height (~36 px). Likely cause: pygal''s default legend_box_size
    not set in the Style/chart config.'
  - 'VQ-01 (both): legend text at 36 px, below the pygal reference 44, reads small
    beside the 48 px axis titles → 44 (+8 px). Likely cause: legend_font_size=36.'
  - 'Suggestion: round x ticks (15, 30, 45, 60, 75) would read more easily than the
    linspace ticks 12, 21, 30 … 75.'
  - 'Suggestion: an optional LOWESS line (statsmodels lowess) would show whether the
    residuals drift with the fitted values.'
  image_description: |-
