review:
  strengths:
  - Residuals computed from a real OLS fit (np.polyfit) on a concrete house-price
    scenario, with three planted mispriced houses that land outside the ±2σ bands
    and are colored Imprint lilac against the green bulk
  - ±2σ bands and the outlier threshold use the same sigma, so every lilac point sits
    beyond a dashed band and every green point inside
  - Native geom_smooth(method='lowess') traces the local mean of the residuals, which
    stays close to zero
  - 'guide_legend(override_aes={''alpha'': 1}) keeps the legend keys at full opacity
    while the points stay translucent'
  - Theme tokens threaded through every chrome element; both renders are theme-correct
    and the data colors are identical
  - 'Adaptable structure: Y_TRUE / Y_PRED column constants and a replaceable data
    block feeding a tidy df'
  weaknesses:
  - 'DE-02 (both): all four panel spines are drawn (full box frame around the panel)
    where a residual scatter does not require an enclosed grid → keep only left and
    bottom, or none. Likely cause: panel_border=element_rect(color=INK_SOFT, fill=None)
    on top of axis_line.'
  - 'VQ-05 (both): the legend is cramped: ''Normal'' runs to within a few px of the
    legend frame''s right edge and the ''Point type'' title touches its left edge
    → leave at least ~1 character of padding inside the frame (or drop the frame).
    Likely cause: legend_background frame with default legend padding at 8–9 pt text.'
  - 'Suggestion: format the tick labels with thousands separators or as $k (e.g. labels=lambda
    b: [f''{v/1000:,.0f}k'' for v in b]) so the six-digit values read faster.'
  - 'Suggestion: label the dashed bands (±2σ) and the LOWESS line in a caption or
    legend so a reader knows what the reference marks are.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: title "residual-plot · python · plotnine · anyplot.ai" dark ink, centered, ~45% width; axis titles "Fitted price ($)" and "Residual ($)" dark; tick labels (200000–800000 on x, -100000–150000 on y) in soft dark grey; subtle grid; full four-sided panel frame; framed legend "Point type" (Normal, Outlier) on the right, text crowded against the frame. All readable.
      Data: 150 points, green #009E73 normal at alpha 0.7, eight lilac #C475FD outliers beyond the dashed ±2σ bands (~±60000); solid ink zero line across the full width; blue #4467A3 LOWESS curve hugging zero.
      Legibility verdict: PASS

