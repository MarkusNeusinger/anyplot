review:
  strengths:
  - 'Every Notes feature is present and computed from the plotted residuals: the zero
    reference line, the shaded ±2σ band drawn horizontally and symmetric about zero,
    red outliers beyond 2σ, and a statsmodels LOWESS trend that follows the local
    mean of the residuals.'
  - The house-price data is built with a quadratic price-to-area relationship fitted
    linearly, so the LOWESS curve shows the U-shaped non-linearity the residual plot
    is meant to diagnose; the scenario and units (thousand USD) are realistic and
    neutral.
  - Outliers get a size and opacity step (s=90, alpha 0.95 vs s=60, alpha 0.7), so
    they stand out by more than hue alone, and page-coloured marker edges keep overlapping
    points apart in both themes.
  - 'Idiomatic matplotlib: axhspan and axhline span the full axis width independent
    of the data, all drawing uses Axes methods, and theme tokens are threaded through
    the title, labels, ticks, spines, grid and legend frame.'
  - The legend sits in one row below the axes, so the point cloud stays unobstructed,
    and the canvas is exactly 3200×1800 without bbox_inches='tight'.
  weaknesses:
  - 'VQ-03 (both): the ''±2σ band'' legend swatch is a fill at alpha 0.08 of INK_MUTED
    with no outline, so it almost vanishes on the #FFFDF6 / #242420 legend frame (worst
    in dark) and does not show the dashed boundary lines the band is drawn with →
    a swatch visible against the frame that matches the band, e.g. a dashed INK_MUTED
    edge on the patch. Likely cause: axhspan(..., alpha=0.08, linewidth=0) carries
    the label while the dashed axhline boundaries carry none.'
  - 'Suggestion: label the 2σ threshold value (about ±67 thousand USD) on the right
    edge of the dashed lines so the outlier cut-off can be read without the axis.'
  - 'Suggestion: a y-only grid would quieten the vertical lines that cross the point
    cloud.'
  image_description: |-
