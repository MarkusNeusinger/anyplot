      Background: warm off-white #FAF8F1 across canvas and axes; the ±2σ band is a faint grey wash between dashed lines at about ±67.
      Chrome: bold near-black title "residual-plot · python · matplotlib · anyplot.ai" (~54 % of the width), axis labels "Predicted price (thousand USD)" and "Residual of sale price (thousand USD)" in dark ink, grey tick labels 100–700 and −100–75, subtle x/y grid, top/right spines removed. One-row framed legend below the axes: ±2σ band, Zero residual, Residuals, Outliers (>2σ), LOWESS trend. All text readable.
      Data: 150 brand-green #009E73 points (alpha 0.7, light edges), 6 larger matte-red #AE3030 outliers above/below the dashed lines, a black zero line across the full width, and a blue #4467A3 LOWESS curve forming a U (≈+43 at 60, ≈−17 at 400, ≈+37 at 700). The band's legend swatch is very faint.
