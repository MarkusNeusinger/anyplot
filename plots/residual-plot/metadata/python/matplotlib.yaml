review:
  strengths:
  - 'Spec fully covered: zero reference line across the whole fitted range, alpha
    0.7 on 150 points, outliers beyond 2σ in the matte-red anchor, and the optional
    LOWESS trend and ±2σ band computed from the plotted residuals'
  - Quadratic ground truth fitted with a straight line makes the LOWESS curve expose
    the non-linearity the diagnostic exists to find
  - Theme tokens threaded through title, labels, ticks, spines, grid and the legend
    frame; both renders read cleanly
  - Outliers are separated by size and opacity as well as hue, so the red/green distinction
    is not the only signal
  - 'Native Axes idioms: axhspan for the band, axhline for the reference and bounds,
    a multi-column legend anchored below the axes'
  weaknesses:
  - 'DQ-02 (both): the data has no real-world context; the columns are ''Observed
    value'' / ''Fitted value'' over a unitless x from np.linspace(0, 10, 150), so
    the axes read as abstract → name a concrete regression (for example house price
    in k$ predicted from floor area, or fuel use from engine size) and carry the unit
    into the column names. Likely cause: the Y_TRUE / Y_PRED constants and the synthetic
    x block.'
  - 'Suggestion: include the dashed ±2σ bounds in the band''s legend swatch (for example
    a Patch with a dashed edge) so the legend matches what the eye sees in the plot.'
