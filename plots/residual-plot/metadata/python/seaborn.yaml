      Data: ~144 #009E73 points with alpha 0.75 and thin page-colored edges, 6 outliers in #C475FD (z > 2, e.g. +563, -475); solid dark zero line across the full x range; dotted ±2 SD lines at about ±310; dashed soft-ink quadratic trend hugging zero with a slight U shape. Legend upper right: Normal, Outlier (|z| > 2), ±2 SD (no trend entry).
