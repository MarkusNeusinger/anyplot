review:
  strengths:
  - Exact 3200x1800 canvas from figsize=(8, 4.5) at dpi=400 with the default bbox,
    and text sizes at the seaborn references (12/10/8 pt) that read well in both themes
  - 'Theme tokens threaded through sns.set_theme rc: warm #FAF8F1 / #1A1A17 surfaces,
    INK labels and INK_SOFT ticks, elevated legend box; data colors identical across
    the two renders'
  - 'Outliers beyond 2 SD get their own hue (#C475FD) via a palette dict keyed on
    the residual type, so the six outliers stand out from the #009E73 bulk'
  - 'Clear line hierarchy: solid zero reference line, dotted ±2 SD bands and a dashed
    trend, each distinguishable in both themes; markers carry a thin page-colored
    edge so overlapping points stay separable'
  - 'Follows the adaptable data block: column constants drive data=df, axis titles
    come from the column names, and the outlier threshold is a single constant'
  weaknesses:
  - 'SC-02 (both): the smoothing line is a global 2nd-order polynomial fit, not a
    line following the residuals'' local average as the spec''s characteristic section
    asks of a drawn smoother → a LOWESS line. Likely cause: sns.regplot(order=2) instead
    of sns.regplot(lowess=True).'
  - 'SC-04 (both): the dashed trend line has no legend entry; the legend lists only
    Normal, Outlier (|z| > 2) and ±2 SD, so the dashed line is unexplained → add one
    entry for the trend. Likely cause: the label set inside line_kws does not reach
    ax.get_legend_handles_labels(); pass label= to sns.regplot or build the handle
    explicitly.'
  image_description: |-
    Light render (plot-light.png):
