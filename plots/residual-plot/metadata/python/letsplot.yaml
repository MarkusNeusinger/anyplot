review:
  strengths:
  - Residuals are computed from the table (observed minus fitted) and plotted against
    fitted values, with every point at its computed position and no jitter
  - Outlier threshold, ±2σ bands and outlier coloring all derive from the same computed
    standard deviation, so the red points sit exactly beyond the dashed bands
  - LOESS smoother is computed natively by geom_smooth(method='loess') rather than
    precomputed, and clearly exposes the U-shaped curvature left by the linear fit
  - 'Three-tier reference hierarchy: LOESS in INK at 1.1, zero line in INK_SOFT at
    0.9, dashed bands in INK_MUTED at 0.6 with alpha, so the smoother leads and the
    bands recede'
  - Theme tokens threaded through every chrome element; both renders read cleanly
    with identical Imprint data colors
  - Interactive HTML export gives lets-plot hover tooltips on each residual
  weaknesses:
  - 'DQ-02, VQ-06 (both): the data has no real-world context — columns are ''Observed
    value'' / ''Fitted value'' with an abstract x from 10 to 100, so the x-axis reads
    ''Fitted value'' with no quantity or unit → a concrete regression scenario (e.g.
    predicted house price in $k, predicted energy use in kWh) with the axis label
    naming the quantity and unit. Likely cause: the OBSERVED/FITTED column names and
    the synthetic x = np.linspace(10, 100, n) block.'
  - 'CQ-04 (code): lines 52–53 write out the least-squares slope and intercept by
    hand → np.polyfit(x, y_true, 1) (or scipy.stats.linregress) computes the same
    fit in one call. Likely cause: hand-rolled OLS formula.'
  - 'Suggestion: a subtitle or caption noting that the LOESS curve reveals unmodelled
    curvature would make the diagnostic message explicit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel.
      Chrome: bold dark title "residual-plot · python · letsplot · anyplot.ai" top-left (~53% of width); y-axis "Residual (observed − predicted)" and x-axis "Fitted value" in dark ink; ticks 50–450 and -25–30 in soft grey; subtle grid; legend "Point type" in an elevated box on the right. All readable.
      Data: 150 green #009E73 points (alpha 0.75) forming a U-shaped cloud; 9 red #AE3030 outliers beyond dashed grey ±2σ bands (~±26); solid dark-grey zero line across full range; thick near-black LOESS curve tracing the U from ~+22 down to ~-11 and back to ~+21.
      Legibility verdict: PASS

