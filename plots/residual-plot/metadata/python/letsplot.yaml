review:
  strengths:
  - Every point sits at its computed (fitted, residual) values, with no jitter or
    nudge; the residual is derived in the plot zone from the observed and fitted columns,
    so a user's table drops in unchanged
  - The zero line spans the full fitted range and stays visible through the cloud
    in both themes; the ±2σ bands are horizontal, symmetric, and computed from the
    plotted residuals
  - 'Outliers beyond 2σ are drawn in the semantic Imprint red #AE3030 against #009E73
    for the bulk, and their position beyond the dashed bands gives the same signal
    without color'
  - Native geom_smooth(method='loess') draws the smoother from the plotted residuals,
    in the INK color so it reads as a diagnostic layer rather than a data series
  - 'A clear line-weight hierarchy: a solid 0.9 zero line, muted dashed 0.6 bands
    at alpha 0.7, and a 1.1 ink smoother'
  - A realistic house-sale scenario whose slightly convex price curve, fitted with
    a straight line, produces the U-shaped residual pattern the diagnostic exists
    to reveal, plus mild heteroscedasticity
  - Theme tokens are threaded through every chrome element; the legend sits on the
    ELEVATED_BG surface, and both renders read cleanly
  - Library-native HTML export keeps lets-plot's default hover tooltips in the interactive
    view
  weaknesses:
  - 'Suggestion: a slightly heavier tick-label size (11 pt) would hold up better in
    the 400 px thumbnail.'
  - 'Suggestion: the dashed ±2σ bands extend a few pixels past the panel''s grid lines
    on the right; letting them end with the panel would tidy the edge.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot and panel.
      Chrome: the bold near-black title "residual-plot · python · letsplot · anyplot.ai" sits top left at about 50 % of the width; the x-axis title "Predicted sale price ($k)", the y-axis title "Residual: sale price − predicted ($k)", and dark-grey ticks (100–550; -30 to 30) are all readable; the grid is subtle; the "Point type" legend sits on the right on an elevated surface with a soft outline.
      Data: about 150 points in #009E73 at alpha 0.75 and about 13 outliers in red #AE3030, beyond dashed grey ±2σ bands at about ±28.4; a solid dark zero line spans the panel, and a thick near-black LOESS curve traces a U shape (about +21 at the left, -10.5 near 310, +20 at the right).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, axis titles, and ticks render in light ink and are all readable; there is no dark-on-dark text; the grid is subtle; the legend sits on the #242420 elevated surface with light text.
      Data: the point colors (#009E73 and #AE3030) are identical to the light render; the zero line and the LOESS curve flip to light ink and stay clearly visible; the dashed bands are mid-grey.
      Legibility verdict: PASS
