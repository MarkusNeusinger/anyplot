review:
  strengths:
  - 'Full theme adaptation: title, axis labels, ticks, legend and SD labels use INK/INK_SOFT
    tokens and read cleanly on both #FAF8F1 and #1A1A17'
  - ±2 SD band built with bokeh's native Band annotation plus dashed Span bounds,
    computed from the plotted residuals
  - 'Outliers beyond 2 SD stand out in Imprint purple with larger, ringed markers;
    the bulk uses #009E73 at alpha 0.7'
  - 'Adaptable structure: column constants, a single Data block and ColumnDataSource
    built from the DataFrame; HTML output keeps bokeh''s interactivity'
  weaknesses:
  - 'VQ-03 (both): the legend glyphs render as dots of about 5 px next to 18–22 px
    plotted markers, so the outlier ring and fill barely show → glyphs at the plotted
    marker size. Likely cause: bokeh''s default legend glyph_width/glyph_height (20
    px) on a 3200 px canvas; set p.legend.glyph_width and glyph_height to about 40.'
  - 'VQ-07 (both): the zero reference line is drawn in the series green #009E73, the
    same hue as the residual markers → the neutral anchor (INK: #1A1A17 light / #F0EFE8
    dark). Likely cause: Span(line_color=IMPRINT_PALETTE[0]).'
  - 'Suggestion: an optional LOWESS line through the residuals would show the absence
    of curvature explicitly.'
