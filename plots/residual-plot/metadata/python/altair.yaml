review:
  strengths:
  - 'Every element the spec''s Notes ask for is drawn from the plotted data: dashed
    zero line across the full fitted range, ±2σ rules computed from the residuals''
    standard deviation (±29.7k, symmetric), a Vega-Lite transform_loess trend, and
    >2σ residuals recolored to Imprint red #AE3030 against the Imprint green #009E73
    bulk'
  - Filled markers at opacity 0.7 make pile-ups in the dense middle read darker in
    both themes, and the 150 points stay clearly separable
  - The zero line (1.2 px, long dash) is visually heavier than the ±2σ rules (0.8
    px, short dash, 0.8 opacity), so the reference and the thresholds read at different
    weights
  - x scale with zero=False frames the fitted range (200k–550k) instead of padding
    the axis from 0
  - Theme tokens reach every chrome element (title, axes, grid, legend panel); both
    renders are fully legible and data colors are identical across themes
  - 'Idiomatic Altair: escaped column constants with explicit type= and title=, alt.layer
    composition, and formatted tooltips ('',.0f'') for the HTML view'
  weaknesses:
  - 'VQ-05 (both): the nice x scale runs to about 550,000 while the last fitted value
    is about 515,000, leaving roughly the right 10 % of the plot area empty with an
    unlabeled 540,000 tick → end the domain near the data (about −35,000 on the domain
    max). Likely cause: alt.Scale(nice=True, zero=False) on the x encoding rounding
    up to the next 50k step; use nice=False or an explicit domain from df[Y_PRED].min()/max().'
  - 'Suggestion: a short direct label on the LOESS curve ("LOESS trend") would tell
    first-time readers what the black/white line is without the legend.'
  - 'Suggestion: the grid at 20k/10k steps is fairly dense; fewer y ticks (tickCount)
    would quiet the background behind the cloud.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas (padded evenly around the vl-convert output).
      Chrome: centered bold title "residual-plot · python · altair · anyplot.ai" in dark ink; axis titles "Fitted price ($)" and "Residual ($)" in dark ink, tick labels (200,000–520,000 every 40k; −40,000–50,000 every 10k) in dark-grey INK_SOFT; subtle grid; legend panel at top right on an elevated #FFFDF6 box titled "Point type" with "Normal" and "Outlier (>2σ)". All text readable.
      Data: 150 filled circles at opacity 0.7 — 142 in Imprint green #009E73, 8 outliers in Imprint red #AE3030 beyond the ±2σ dashed rules at about ±29.7k; long-dashed zero line across the whole x range; solid black LOESS curve dipping to about −14k near 400k and rising at both ends (the convex misfit). x domain extends to ~550k, leaving a narrow empty strip right of the last points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink #F0EFE8, tick labels in light-grey INK_SOFT, grid subtle but visible, legend panel #242420 with light text and light border. No dark-on-dark text.
      Data: identical green #009E73 and red #AE3030 points (red reads somewhat dimmer at 0.7 opacity on dark but stays distinct); zero line and ±2σ rules light grey; LOESS curve in near-white. Same layout as light.
      Legibility verdict: PASS
