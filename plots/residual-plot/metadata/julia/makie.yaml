    all four `text!()` calls (two ''σ ≈ X.X'' spread callouts, two ''largest overshoot''/''largest
    undershoot'' outlier labels) produce ZERO visible output in both plot-light.png
    and plot-dark.png. Verified by pixel-cropping the exact anchor regions (top header
    strip below the title, the local-max points of the low/high fitted-revenue quartiles,
    and the two most extreme outlier points top-right and bottom-right) — no subtitle
    text and no annotation text is present anywhere. The header region also shows
    no reserved vertical whitespace for a subtitle, suggesting the `subtitle` Axis
    keyword is not taking effect at all in this Makie 0.21.9 setup (silently ignored
    rather than erroring) and the `text!()` calls are likewise not attaching to the
    axis/scene. This is exactly the DE-03/LM-02 improvement the previous review asked
    for, and the code computes all the supporting math (lo/hi quartile masks, lo_sigma/hi_sigma,
    argmax/argmin) for it — but none of it reaches the image, so it is dead code that
    adds complexity and computation for zero visual payoff.'
  - Because the annotation fix is entirely inert, Design Excellence and Library Mastery
    remain exactly where they were before the repair (data storytelling relies only
    on existing color contrast/size, no distinctive Makie-specific feature is actually
    demonstrated) — the repair loop should not spend another cycle on styling and
    must instead debug/fix (or cleanly remove) the non-rendering subtitle and text!
    calls.
  - 'Design Excellence is still not yet publication-level: the composition (scatter
    + shaded band + threshold lines) reads as a solid, correct treatment rather than
    a distinctive visual signature.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "residual-plot · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. NO subtitle text appears below the title despite the source code setting `subtitle = "Residual spread widens with fitted revenue — a classic heteroscedasticity signature"` — confirmed by cropping the 0-300px header strip: only the title is present, no reserved whitespace or second line of text. X-axis label "Fitted Revenue ($1000s)" and Y-axis label "Residual ($1000s)" in dark ink, both readable. Tick labels (250/500/750 on x; -100/-50/0/50 on y) in softer gray-ink, readable. Subtle grid lines on both axes at low opacity. Dashed dark line at y=0 and dotted muted lines at the ±2σ thresholds, with a soft shaded muted band between them.
      Data: First series (green, #009E73) shows ~280 in-band residual points at 0.65 alpha, clearly showing a funnel widening from near-zero spread at low fitted revenue to wide spread (~±50) at high fitted revenue. ~19 outlier points beyond ±2σ render in matte red (#AE3030), larger and fully opaque with a light stroke. NONE of the four `text!()` annotation calls (two "σ ≈ X.X" spread callouts near the local maxima of the low/high fitted-revenue quartiles, two "largest overshoot"/"largest undershoot" labels at the most extreme outliers) are visible anywhere — verified by cropping the exact data-coordinate anchor regions; only bare scatter points appear there, no text.
      Legend: Bottom-left, frameless, transparent background, two entries ("Residual", "Outlier (|residual| > 2σ)") in an empty region, no overlap.
      Legibility verdict: PASS for all text that IS present — but four annotation calls and the subtitle are silently absent from the render (a functional defect, not a legibility defect).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels rendered in light ink (#F0EFE8 primary, #B8B7B0 secondary) — clearly legible. Grid lines flip to a low-opacity light tint. Dashed zero-line and dotted threshold lines render in light ink-soft tone. Same as the light render, no subtitle text appears at all.
      Data: Data colors are pixel-identical to the light render — green #009E73 for in-band residuals, matte red #AE3030 for outliers — chrome-only theme flip confirmed. Same as the light render, none of the four text!() annotations render — the anchor regions (quartile local maxima, most extreme outlier points top-right and bottom-right) show only bare markers, no text.
      Legend: Same bottom-left placement, transparent background, both entries readable in light-colored text against the dark surface.
      Legibility verdict: PASS for all text that IS present — same annotation/subtitle absence as the light render, confirming this is a rendering/API defect rather than a theme-color problem.
