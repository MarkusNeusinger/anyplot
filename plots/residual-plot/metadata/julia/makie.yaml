review:
  strengths:
  - 'Correct plot type and data mapping: fitted revenue on x, residuals on y, matching
    the standard residual-plot convention from the spec'
  - 'Full required-feature coverage: dashed y=0 reference line, shaded ±2σ band, dotted
    threshold lines, alpha-blended overlapping points, and color-coded outliers past
    the 2σ threshold'
  - 'Theme-adaptive chrome correctly threaded through Figure and Axis (background,
    ink, ink-soft tokens) — both renders are legible and the Imprint palette data
    colors (brand green #009E73, semantic red #AE3030 for outliers) stay identical
    across light and dark'
  - Realistic, neutral business scenario (advertising spend vs. revenue) with heteroscedastic
    noise that visibly demonstrates the exact diagnostic pattern (funnel-shaped variance
    growth) the plot type exists to detect
  - Clean, KISS-structured, reproducible code with Random.seed!(42), only used imports,
    and correct save call (plot-$(THEME).png, px_per_unit=2)
  - Legend placed in the genuinely empty bottom-left region of the plot — no overlap
    with data despite dense scatter
  weaknesses:
  - 'Design Excellence is good but not yet publication-level: the composition (scatter
    + shaded band + threshold lines) is a solid, correct treatment but reads as a
    well-executed standard pattern rather than a distinctive visual signature — consider
    stronger typographic hierarchy or a more deliberate focal treatment for the outlier
    cluster'
  - 'Library Mastery is generic: hspan!/hlines! for the reference band and threshold
    lines are concepts common to nearly every plotting library (axhspan/axhline in
    matplotlib, geom_hline in ggplot) — consider leveraging a feature harder to replicate
    outside Makie (e.g. text! annotations anchored to data coordinates for the most
    extreme outliers, or Makie''s Legend/layout composability) to raise distinctiveness'
  - Data Storytelling reaches 'good' via color contrast on outliers but stops short
    of 'excellent' — nothing explicitly calls out the heteroscedasticity insight itself
    (the funnel-widening variance), so the viewer has to notice the pattern unaided
    rather than being guided to it
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "residual-plot · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. X-axis label "Fitted Revenue ($1000s)" and Y-axis label "Residual ($1000s)" in dark ink, both readable. Tick labels (250/500/750 on x; -100/-50/0/50 on y) in softer gray-ink, readable. Subtle grid lines on both axes at low opacity, not competing with data. Dashed dark line at y=0 and dotted muted lines at the ±2σ thresholds, with a soft shaded muted band between them.
      Data: First series (green, #009E73) shows ~280 in-band residual points with 0.65 alpha, clearly showing a funnel widening from near-zero spread at low fitted revenue to wide spread (~±50) at high fitted revenue — visible heteroscedasticity. ~19 outlier points beyond ±2σ render in matte red (#AE3030), larger and fully opaque with a light stroke for separation from overlapping green points.
      Legend: Bottom-left, frameless, transparent background, two entries ("Residual", "Outlier (|residual| > 2σ)") sitting in an empty region of the plot with no data overlap.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (#F0EFE8 primary, #B8B7B0 secondary) — clearly legible against the dark surface. Grid lines flip to a low-opacity light tint. Dashed zero-line and dotted threshold lines render in light ink-soft tone, band shading uses the same muted tone at low alpha, still visible but subtle against dark background.
      Data: Data colors are pixel-identical to the light render — green #009E73 for in-band residuals, matte red #AE3030 for outliers — confirming only chrome flipped between themes, not data colors.
      Legend: Same bottom-left placement, transparent background, both entries readable in light-colored text against the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures; all title/label/tick text is clearly legible against the near-black background, and the brand green + matte red both read well on the dark surface.
