review:
  strengths:
  - The locus is computed honestly from G(s) = (s+3)/[s(s+1)(s+2)(s+4)] with np.roots
    over 2000 gain values, so the breakaway near σ ≈ −0.4, the real-axis segments
    (−∞, −4], [−3, −2] and [−1, 0], and the asymptotic branches all fall out of the
    computation.
  - The damping-ratio rays (ζ = 0.2–0.8) and the natural-frequency semicircles (ωn
    = 1–4) are dashed in the GRID_RULE token, sit behind the locus, and stay circular
    under coord_fixed(ratio=1), with the origin and the imaginary axis in view.
  - Poles (×) and the zero (○) are drawn in the INK token at a large size, read clearly
    against the branches in both themes, and the caption keys them.
  - 'Theme chrome is correct on the whole canvas in both renders: the one-panel gggrid
    painted in PAGE_BG leaves no transparent or white strips around the fixed-aspect
    panel.'
  - Per-layer layer_tooltips() give the HTML version a branch, K, Re and Im readout
    on each locus point and a labelled readout on every pole and zero marker.
  weaknesses:
  - 'SC-02 (both): two of the three sets of direction arrows point against increasing
    gain. The arrows at K = 5 and K = 15 run back toward the open-loop poles: the
    downward arrows at Im ≈ +1.0 and +1.75 on Branch 4, the upward arrow at Im ≈ −1.1
    on Branch 3, and the rightward arrows at σ ≈ −4.4 (Branch 1) and σ ≈ −2.3 (Branch
    2), which should point toward −∞ and toward the zero at −3. Only the K = 50 arrows
    point the right way → every arrowhead toward higher K. Likely cause: lines 81–84,
    where `next_pts` keeps every row within ±1.0 of `k_next` and `.iloc[0]` takes
    the lowest of them, a gain below the arrow''s own K wherever the grid step is
    under 0.2. Take the row of the same branch whose gain equals `k_next`.'
  - 'SC-02 (both): the stability-crossing diamonds do not sit on the imaginary axis.
    The upper one is at about (−0.08, +1.40) inside the left half-plane, and the lower
    one at about (+0.08, −1.78) in the right half-plane, so the pair is not mirrored
    → both should be at σ = 0, ω = ±1.59 (Routh: K² + 65K − 720 = 0, so K ≈ 9.65 and
    ω² = 2.52), a signed delta of about ±0.08 in σ and −0.19 / −0.19 in |ω|. Likely
    cause: lines 69–71 take the first row inside the |Re| < 0.08 band, at its edge,
    instead of the sign change of the real part (or interpolating between the two
    samples around it).'
  - 'DQ-03 (both): the critical-gain label reads ''K ≈ 7.2''. The imaginary-axis crossing
    of G(s) = (s+3)/[s(s+1)(s+2)(s+4)] is at K ≈ 9.65 (Routh array of s⁴ + 7s³ + 14s²
    + (8+K)s + 3K) → K ≈ 9.6 (+2.4). Likely cause: `crit_k` is read from the off-axis
    crossing row picked by lines 69–71.'
  - 'SC-01 (both): the basic variant gets a highlighted region, a green rectangle
    over the left half-plane, plus the ''STABLE'' and ''UNSTABLE'' region callouts.
    The spec excludes highlighted regions and callouts on the basic variant, and ''UNSTABLE''
    (#AE3030 at alpha 0.5) is barely readable on the dark surface → remove the rectangle
    and both labels. Likely cause: the geom_rect at lines 153–160 and the two geom_text
    layers at lines 248–267.'
  - 'VQ-02 (both): the ''K ≈ 7.2'' label starts on the head of the K = 5 direction
    arrow at about (0.05, 1.7), so the arrowhead runs into the ''K'' → clear the label
    from the arrow by at least a few pixels. Likely cause: `annot_df` places the label
    at x = 0.2, y = crit_y + 0.45, on the branch''s arrow position.'
  - 'VQ-05 (both): the square panel plus the legend at the right leaves empty page
    bands of about 10 % of the canvas height above the title and below the caption.
    The locus panel is about 1370 × 1370 px of the 2400 px canvas → let the panel
    use the height, for example with the legend at the bottom or inside the empty
    right half-plane. Likely cause: `legend_position=''right''` beside a `coord_fixed(ratio=1)`
    panel on the square canvas.'
  - 'Suggestion: drop the ''jω'' and ''σ'' corner symbols, which repeat the axis titles.'
