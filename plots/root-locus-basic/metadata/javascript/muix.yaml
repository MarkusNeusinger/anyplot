  - 'Locus computed from the characteristic equation: imaginary-axis crossings at
    ω = ±2.83 with K ≈ 48 and the breakaway at σ ≈ −0.85 match the analytic values'
  - Equal scaling derived from one px-per-unit on both axes, so the natural-frequency
    circles render truly circular
  - 'Idiomatic MUI X v9 composition: ChartsContainer with one x axis per series lets
    LinePlot draw parametric curves, and useXScale/useYScale place the s-plane grid,
    arrows and markers in data space'
