    arrows, real-axis segments, prominent crossing diamonds, dashed ζ/ωn grid with
    haloed labels'
  weaknesses:
  - 'Suggestion: the legend could use the native ChartsLegend for the branch entries,
    keeping the custom glyphs only for poles and crossings.'
