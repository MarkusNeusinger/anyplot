review:
  strengths:
  - Custom Makie @recipe (ChernoffFace) is genuinely distinctive library usage, directly
    resolving attempt 1's LM-02 weakness — the face glyph is now a reusable, declarative,
    attribute-linked plot type instead of an inline poly!/lines!/text! loop
  - Outlier patient (P05) is flagged with an amber outline and heavier stroke width,
    giving the reader a clear focal point — directly resolves attempt 1's DE-03 weakness
    about missing visual emphasis
  - 8 variables now drive 8 distinct facial features (eye spacing added via body temperature),
    fully covering the spec's example feature-mapping list and resolving attempt 1's
    DQ-01/SC-02 note about the fixed eye spacing
  - Theme-adaptive chrome is flawless in both renders — identical brand-green/amber
    face outlines, correctly flipped ink/ink_soft tokens for eyes/eyebrows/nose/mouth/labels,
    no dark-on-dark or light-on-light failures
  - Realistic, clinically plausible patient vital-sign data (heart rate, BP, cholesterol,
    BMI, glucose, sleep, respiratory rate, temperature) with physiologically sound
    ranges and correct min-max normalization to [0,1] before mapping
  weaknesses:
  - Title still occupies only ~41% of canvas width even after bumping titlesize from
    20 to 26 — on the 2400x2400 square canvas it would benefit from a further increase
    toward the 50-70% guideline for tighter top-of-canvas balance
  - The custom @recipe + Makie.plot! extension is idiomatic Makie but adds ~75 lines
    of structural scaffolding beyond a pure top-to-bottom KISS script; a reasonable
    and rewarded tradeoff for a reusable glyph, but worth trimming if the recipe grows
    further
  - Eye pupils are on the smaller side (0.4 * eye_r) — legible at full 2400px resolution
    but could be nudged slightly larger for extra polish at the 400px thumbnail preview
    size
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "chernoff-basic · julia · makie · anyplot.ai" centered at top (titlesize=26), clearly readable against the light background (measured ~41% of canvas width). Twelve patient-ID labels ("P01"-"P12") render in soft dark gray beneath each face, all legible.
      Data: 12 Chernoff faces in a 4x3 grid, drawn via a custom ChernoffFace recipe. 11 faces have a brand-green (#009E73) outline; P05 (the most extreme combined vital-sign profile) has a heavier amber (#DDCC77) outline that pops as a clear focal point. Face fill is a subtle off-white "elevated" tone. Eyes/pupils, eyebrows, nose, and mouth are drawn in dark ink / soft-ink tones, and vary clearly across faces (face width/height, eye size/spacing, eyebrow slant, nose length, mouth curve/width) — pattern recognition and comparison works well.
      Legibility verdict: PASS — all title text and patient labels are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/off-white text, clearly visible against the dark background. Patient-ID labels render in light gray, all legible.
      Data: Same 12-face grid with identical brand-green (#009E73) outlines and the same amber (#DDCC77) outlier highlight on P05 as the light render — data/semantic colors are unchanged between themes. Facial features (eyes, eyebrows, nose, mouth) are drawn in light/near-white ink tones, clearly distinguishable against the dark face fill and dark page background.
      Legibility verdict: PASS — no dark-on-dark failures found; every title, label, and facial-feature stroke is clearly visible. Brand green and amber remain equally visible on both surfaces.
