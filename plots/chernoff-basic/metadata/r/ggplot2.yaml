review:
  strengths:
  - Fully custom Chernoff-face geometry (outline, eyes, pupils, eyebrows, nose, mouth)
    is built natively in ggplot2 via geom_polygon/geom_segment/geom_path/geom_point
    — no external Chernoff-face package, genuinely idiomatic grammar-of-graphics composition
    for a glyph plot ggplot2 has no built-in geom for.
  - All seven recommended facial-feature mappings from the spec are implemented (face
    width, eye size, eye spacing, eyebrow slant, nose length, mouth curvature, mouth
    width), each driven by a distinct mtcars performance variable (mpg, qsec, hp,
    wt, disp, drat, carb).
  - 'Colorization by group membership (per the spec''s ''consider colorizing faces
    by group'' note) uses the cylinder count with the correct Imprint palette order
    — first series (4 cyl) is brand green #009E73.'
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    borders, text) flips correctly per theme.
  - facet_wrap grid layout with a wrapped two-line labeller (label_wrap_gen) cleanly
    avoids any label collisions across all 15 faces, including long names like 'Cadillac
    Fleetwood'.
  - Dynamic title-fontsize formula (round(12 * min(1, 67 / nchar(title_text)))) sensibly
    compresses the long mandated title instead of letting it overflow.
  weaknesses:
  - Noticeable empty margin below the legend (~13% of canvas height) is unbalanced
    relative to the ~9% top margin — tighten plot.margin bottom or grow panel.spacing/face
    size slightly to fill the square canvas more evenly.
  - Per-face geometry is built with a for-loop over row indices appending into pre-allocated
    lists rather than a vectorized/tidy approach (e.g. purrr::pmap_dfr) — functional
    and correct, but not the leanest KISS structure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Car Performance Profiles · chernoff-basic · r · ggplot2 · anyplot.ai" in dark ink at top, clearly readable. 15 car-name labels above each face (some wrapped to two lines, e.g. "Hornet Sportabout", "Cadillac Fleetwood") in a slightly softer dark gray — all legible against the light background. A "Cylinders" legend at the bottom with three colored square swatches and text labels ("4 cyl", "6 cyl", "8 cyl") is fully readable.
      Data: 15 Chernoff faces arranged in a 5-column x 3-row facet grid, each face colored by cylinder-count group — green (#009E73, first series) for 4-cyl cars, lavender/purple for 6-cyl, blue for 8-cyl. Each face has an outline, two eyes with pupils, eyebrows at varying slants, a nose stroke, and a mouth curve that varies from frowning to smiling based on mapped car metrics.
      Legibility verdict: PASS — all title, label, and legend text is clearly readable against the light surface with no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title now rendered in light ink, fully readable. Car-name labels are light gray, legible against the dark background. Legend text and "Cylinders" label are light-colored and clearly visible. Face outlines and eye borders flip to light strokes so features remain distinguishable against the dark canvas.
      Data: Face fill colors are identical to the light render — same green, lavender, and blue for the three cylinder groups — confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all text and facial-feature strokes remain clearly visible against the near-black surface.
