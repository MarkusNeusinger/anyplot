review:
  strengths:
  - Correct Imprint palette with identical data colors in both themes and theme-adaptive
    chrome
  - Clear feature-mapping box naming the measurement behind each facial feature
  - Real Iris measurements, min-max normalized before mapping
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2700 → 3200x1800 (−1600 × −900). Likely cause:
    write_image(width=1600, height=900, scale=3) instead of width=800, height=450,
    scale=4.'
  - 'VQ-02 (both): the wide Virginica faces overlap their neighbours and Setosa Samples
    2 and 4 touch the Versicolor row → keep every face inside its cell (face half-width
    under spacing/2). Likely cause: face_width_factor up to 1.4·radius with spacing=2.2.'
  - 'SC-04 (both): the title reads ''chernoff-basic · plotly · anyplot.ai'' without
    the language → ''chernoff-basic · python · plotly · anyplot.ai''. Likely cause:
    the title string.'
  - 'SC-02 (both): C2 — faces are identified only by generic ''Sample 1''–''Sample
    5'' column headers, not by an observation label → label each face with its observation
    id. Likely cause: column-label annotations instead of per-face labels.'
  - 'CQ-01 (code): no column-0 # Data / # Plot block separation and no column constants
    for observation_id and the variables → one Data block that binds df and named
    column constants. Likely cause: the dataset loaded and subset inline with the
    plotting code.'
  - 'CQ-04 (code): lines 113–160 repeat the same eye and pupil path construction four
    times → one loop over side in (-1, 1). Likely cause: left/right copies written
    out.'
  - 'Suggestion: the feature-mapping box and the species legend could share one column
    on the right.'
