review:
  strengths:
  - 'Theme tokens threaded through sns.set_theme rc and every patch: chrome flips
    correctly between #FAF8F1 and #1A1A17 with identical data colors'
  - Real UCI wine data with a seeded pick of five wines per class
  - 'Imprint palette in order with #009E73 first, and a framed class legend'
  - 'Text sized at the reference throughout: title, face labels, legend and key all
    read comfortably'
  weaknesses:
  - 'VQ-05 (both): the canvas is 4105x2691, not one of the canonical sizes → 3200x1800
    (−905 x −891). Likely cause: figsize=(16, 9) with dpi=300 and bbox_inches="tight"
    in savefig.'
  - 'VQ-03 (both): faces are cut flat by their cell bounds — Class 1 #4 top and bottom,
    Class 2 #2 top and bottom, Class 2 #5 left and right, Class 3 #1 and Class 3 #5
    — so their outlines are incomplete → keep every face inside its cell. Likely cause:
    ax.set_xlim(0, 1) / ax.set_ylim(0, 1) while face_width and face_height reach 1.0–1.1.'
  - 'SC-02 (both): C3 missed: the clipped faces and, at high values, eyebrows that
    tilt into near-vertical strokes outside the head (Class 1 #2, Class 2 #3, Class
    2 #4, Class 3 #1) stop reading as parts of a face → keep every feature inside
    the face at both ends of its range. Likely cause: the cell limits and eyebrow_angle
    = -0.12 + features[2] * 0.24.'
  - 'SC-03 (both): the key labels the face height as Phenols and the eye size as Malic
    Acid, but the code maps column 6 (flavanoids) and column 9 (color intensity),
    so the faces decode to the wrong variables; variables are also scaled 0–1 within
    each class, which erases between-class differences → label the key from the mapped
    feature names and scale over all observations. Likely cause: selected_features
    = [0, 6, 9, 12] with a hand-written key string, and the per-class normalization
    loop.'
  - 'SC-04 (both): the title reads "chernoff-basic · seaborn · anyplot.ai", missing
    the language segment → "chernoff-basic · python · seaborn · anyplot.ai". Likely
    cause: the fig.suptitle string.'
  - 'CQ-01 (code): a hex_to_rgb helper function is defined → use matplotlib.colors.to_rgb
    inline and drop the function. Likely cause: def hex_to_rgb at lines 83–84.'
  - 'CQ-04 (code): the left and right eye, pupil and eyebrow are each written out
    twice (lines 117–150) → one loop over sign in (-1, 1). Likely cause: copy-pasted
    blocks.'
  - 'Suggestion: a seaborn-native touch (for example sns.set_palette for the class
    colors) would show more of the library.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
