      Data: 15 faces in a 3x5 grid: Class 1 #009E73, Class 2 #C475FD, Class 3 #4467A3, dark outlines. Several faces are cut flat by their cell bounds (Class 1 #4 top and bottom, Class 2 #2, Class 2 #5 sides, Class 3 #1, Class 3 #5); several eyebrows stand as near-vertical strokes outside the head. Canvas 4105x2691.
