review:
  strengths:
  - Faces are built from native matplotlib patches (Ellipse, Circle) and line plots
    on one equal-aspect axes with ax.axis('off'), so the grid carries no data axes,
    as the spec asks
  - Every variable is min-max normalized to 0-1 before mapping, with a neutral 0.5
    fallback, so features stay recognizable at both ends of their range
  - A clear feature key ('Face width ← Fuel efficiency', …) and a Car class legend
    in matching elevated boxes make the faces decodable in both themes
  - 'Theme threading is complete: face outlines, labels, key and legend chrome flip
    with INK/INK_SOFT/ELEVATED_BG, while the Imprint fills (#009E73, #C475FD, #4467A3)
    and the dark feature strokes stay identical across renders'
  - Rows grouped by class make the within-class similarity and the between-class contrast
    (wide Economy faces, tall frowning Sports faces, big-eyed smiling Luxury faces)
    readable at a glance
  weaknesses:
  - 'VQ-01 (both): the feature key text at 7.5 pt (legend entries 8 pt) is the smallest
    text in the figure and drops to about 7 px in the 400 px thumbnail, where the
    key that decodes the faces blurs → about 9 pt (+1.5 pt). Likely cause: fig.text
    fontsize=7.5 and legend fontsize=8.'
  - 'VQ-05 (both): the 3×3 face grid spans only about 57 % of the canvas width, leaving
    about 22 % empty on each side and an empty band between the key and the legend
    → let the grid fill about 80 % of the width. Likely cause: ax.set_aspect(''equal'')
    with ylim spanning ~3.6 units against xlim ~3.0 units, so the height (bottom=0.2)
    limits the axes and the width cannot be used.'
  - 'DQ-01 (both): only 4 variables drive features, below the spec''s typical 5-15,
    so eye spacing, brow slant and nose length are identical on all nine faces and
    three of the seven drawn features carry no data → 5-7 rating variables (for example
    add Safety, Price, Cargo space) so every drawn feature varies. Likely cause: RATINGS
    lists four columns.'
  - 'DQ-02 (both): the observations are labelled ''Economy 1'' … ''Luxury 3'', which
    read as placeholders rather than cars → descriptive fictional model names per
    class (for example ''City hatch'', ''Roadster GT'', ''Grand tourer''). Likely
    cause: the f"{car_class} {i + 1}" label.'
  - 'Suggestion: placing the feature key and the class legend side by side under the
    grid would close the empty band at the bottom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas, no axes.
