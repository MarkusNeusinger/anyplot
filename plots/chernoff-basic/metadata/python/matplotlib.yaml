      Data: 3×3 grid of Chernoff faces with dark outlines — row 1 Economy in #009E73 (wide, flat or slight-frown mouths, small eyes), row 2 Sports in #C475FD (narrow tall faces, strong frowns), row 3 Luxury in #4467A3 (tall, larger eyes, smiles). Eyes white with dark pupils, dark brows, nose and mouth strokes.
      Legibility verdict: PASS

