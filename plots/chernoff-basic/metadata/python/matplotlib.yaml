review:
  strengths:
  - 'All seven variables are min-max normalized to 0-1 (lines 61-63) and each drives
    one facial feature: face width, face height, eye size, mouth curve, eye spacing,
    brow slant and nose length. The faces differ clearly from car to car.'
  - The feature key is a fig.legend with invisible handles and handlelength=0, so
    it reads as a two-column 'Face width ← Fuel efficiency' list. It shares its boxed
    ELEVATED_BG treatment and bold title with the Car class legend.
  - 'The data is built so the classes read at a glance: Economy faces are wide and
    frowning, Sports faces are tall and narrow with small eyes, Luxury faces have
    large eyes and smile.'
  - 'Theme handling is complete: face outlines use INK, so they flip to light outlines
    on dark, while the strokes on the faces keep a fixed dark ink because the fills
    do not change. Every text uses INK/INK_SOFT tokens and reads in both renders.'
  - The faces are composed from matplotlib.patches (Ellipse, Circle) plus parametric
    ax.plot curves on an equal-aspect, axis-off canvas, so there are no data axes,
    as the spec asks.
  weaknesses:
  - 'VQ-03 (both): on Executive Sedan (large eyes on a narrow face) the outer brow
    tips run into the face outline and merge with it, so at the top of the eye-size
    range the brow is no longer a separate stroke inside the face → brow length about
    15 % shorter, or scaled with face width so the tips stay inside the outline. Likely
    cause: brow half-length `eye * 0.8` scales with eye size only, while eye_dx scales
    with face width.'
  - 'Suggestion: put the name labels on one baseline per row (right now each label
    sits below its own face height) so the grid reads more evenly.'
  - 'Suggestion: top-align the Car class legend with the Feature key box so the two
    boxes under the grid form one band.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "Car Ratings · chernoff-basic · python · matplotlib · anyplot.ai" at the top, about 80 % of the width; 3x3 grid of faces with dark name labels underneath (City Hatch, Compact Sedan, Eco Wagon / Roadster GT, Track Coupé, Turbo Spyder / Grand Tourer, Executive Sedan, Premium SUV); bottom-left boxed "Feature key" with two columns mapping 7 features to 7 ratings; bottom-right boxed "Car class" legend. No axes. All text readable.
      Data: Economy faces in #009E73 (wide, frowning), Sports in #C475FD (tall and narrow, small eyes, frowning), Luxury in #4467A3 (large eyes, smiling). Faces have dark outlines, white eyes with dark pupils, dark brows, nose and mouth. On Executive Sedan the brow tips merge into the outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and face labels in light ink (#F0EFE8), legend boxes on #242420 with light text and bold light titles, legend frames in soft grey. No dark-on-dark text.
      Data: the same green, purple and blue fills as the light render. Face outlines flip to light ink; the strokes on the faces stay dark on the colored fills and stay readable.
      Legibility verdict: PASS
