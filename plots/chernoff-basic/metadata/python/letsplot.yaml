review:
  strengths:
  - Four normalized iris variables each drive one feature (face width, eye size, mouth
    curvature, eyebrow slant) and the three species read as distinct expressions
  - A two-line caption names which variable drives which feature, so the faces can
    be decoded
  - Theme tokens threaded through title, caption, labels, outlines and legend; both
    renders theme-correct
  - Color by species in canonical Imprint order with a matching legend, as the Notes
    allow
  - Interactive HTML export alongside the PNG
  weaknesses:
  - 'VQ-03 (dark): the pupils are drawn in INK (#F0EFE8) on eye fills of pure white,
    so they vanish and the eyes read as blank white ovals → pupils in a color that
    contrasts the eye fill in both themes (e.g. off-white eye fill with #1A1A17 pupils
    in both renders). Likely cause: geom_polygon(data=pupils, fill=INK) with eyes
    fill="white".'
  - 'VQ-03 (both): the legend swatches are drawn at full opacity while the faces are
    filled at alpha 0.3, so the bright swatches do not match the pale (light) or deep
    (dark) face fills → swatches with the same fill as the faces. Likely cause: alpha=0.3
    on the face geom_polygon without a matching legend override, or a pre-blended
    fill instead of alpha.'
  - 'SC-02 (both): every face is captioned with its species (''Setosa'', ''Versicolor'',
    ''Virginica''), which the fill already encodes, instead of its observation label
    → caption each face with its observation id (the Flower column, ''Flower 1'' …
    ''Flower 12''). Likely cause: label=str(df[SPECIES]…) in label_rows instead of
    df[OBSERVATION].'
  - 'VQ-05 (both): each face label sits about 0.26 grid units below its face, nearly
    midway to the next row''s face, so it floats detached → label just below the chin
    (about cy-0.25, roughly +0.2 units). Likely cause: label y = cy - 0.45.'
  - 'CQ-01 (code): a helper function add() is defined inside the face loop (lines
    80-92) → build the part frames inline. Likely cause: the nested def add(part,
    xs, ys, face_id=idx).'
  - 'Suggestion: map the nose length to a variable or drop the constant nose, so every
    feature carries data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold title 'chernoff-basic · python · letsplot · anyplot.ai' in dark INK top-left; 12 faces in a 4x3 grid, each captioned below with its species in bold INK_SOFT; a two-line key caption bottom-right ('Face width: Sepal length (cm) · Eye size: Sepal width (cm) / Mouth curvature: Petal length (cm) · Eyebrow slant: Petal width (cm)'); 'Species' legend on the right in an elevated box. All text readable.
      Data: face fills are pale tints (alpha 0.3) of #009E73 (Setosa, smiling, angled brows), #C475FD (Versicolor, flat mouths) and #4467A3 (Virginica, frowning, widest faces), dark INK_SOFT outlines, white eyes with dark pupils, dark mouth/brow/nose strokes. Legend swatches are opaque and brighter than the faces. Labels float well below each face.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, labels, key caption and legend in light INK / INK_SOFT; no dark-on-dark text.
      Data: identical hues; at alpha 0.3 over the dark page the face fills become deep green, plum and navy, while the legend swatches stay bright. Mouth, brows and nose in light INK read well, but the pupils are light INK on white eye fills and nearly vanish, leaving blank white eyes.
      Legibility verdict: PASS (text); pupils near-invisible
