review:
  strengths:
  - The 12 faces are drawn as vectorized bokeh glyphs (ellipse, circle, segment, multi_line,
    text) from one ColumnDataSource, so every face uses the same feature set and the
    faces differ visibly from sector to sector (wide, smiling Tech faces; narrow,
    frowning Energy faces)
  - Each variable is min-max scaled to 0-1 before mapping, and every feature stays
    recognizable as part of a face at both ends of its range
  - The feature key below the grid and the italic direction note make the faces decodable,
    and a centered horizontal Legend model above the grid explains the color by sector
    that the Notes allow
  - 'Theme tokens carry through to every element: dark pupils on light eye whites
    in both themes, INK features on the alpha-0.3 sector fills, and readable INK_SOFT
    labels on both backgrounds'
  - A HoverTool on the face renderers shows each company's raw metric values in the
    HTML view, so the raw data is available alongside the normalized glyphs
  - 'The Imprint palette runs in canonical order (Tech #009E73, Retail #C475FD, Energy
    #4467A3) and the data colors are identical in both renders'
  weaknesses:
  - 'SC-02 (both): eyebrow tilt varies with Revenue Growth (brow_tilt from s_width)
    and nose width varies with Profit Margin (nose_w from s_height), but the key names
    only four features, so two visible feature changes are not decoded and each of
    those variables drives two features → make the brows and nose constant, or give
    each its own variable and key entry. Likely cause: lines 99 and 106 reuse s_width
    and s_height.'
  - 'DQ-03 (code): every metric is a share drawn as range × 100, giving Tech profit
    margins of 50–90 %, Tech revenue growth of 60–100 % and market shares of 50–90
    % for each of four Energy companies (the shares sum well past 100 %) → per-metric
    ranges in plausible units (for example profit margin 5–30 %, revenue growth −5–40
    %, market share 2–25 %). Likely cause: the profiles dict in lines 47–51 and the
    shared ×100 in line 54.'
  - 'DQ-02 (both): the faces are labelled ''Tech #1'' … ''Energy #4'', which read
    as generic placeholders → plausible fictional company names. Likely cause: the
    f"{sector} #{k}" label in line 56.'
  - 'Suggestion: with five or more variables (the spec''s typical range is 5–15),
    more features such as eye spacing or nose length could carry their own data and
    make the faces easier to tell apart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, no white seams.
      Chrome: bold dark title "chernoff-basic · python · bokeh · anyplot.ai" centered at the top (about 43 % of the width); a centered horizontal legend below it (Tech, Retail, Energy) in INK_SOFT; face labels "Tech #1" … "Energy #4" under each face; a dark key line at the bottom ("Face width: Revenue Growth (%) · Face height: Profit Margin (%) · Eye size: Customer Satisfaction (%) · Mouth curve: Market Share (%)") and an italic soft-gray direction note below it. No axes, no grid. All text is readable.
      Data: a 4×3 grid of 12 Chernoff faces. Rows are Tech (#009E73 outline with a light-green fill, large, mostly smiling), Retail (#C475FD, smaller round faces, mixed mouths) and Energy (#4467A3, narrow tall ovals, mostly frowning). The faces have eye whites with dark pupils, dark eyebrows, a wedge nose and a parabolic mouth. Sizes, eyes and mouths differ visibly between faces.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no seams.
      Chrome: the title and key are light (#F0EFE8), and the labels, legend and note are a lighter gray (INK_SOFT #B8B7B0). Everything is clearly readable, with no dark-on-dark text.
      Data: the outline colors are identical to the light render (#009E73, #C475FD, #4467A3); the alpha-0.3 fills read as dark tinted faces. The features flip to light ink, the eye whites stay light with dark pupils, and brand green stays clearly visible. Same geometry as the light render.
      Legibility verdict: PASS
