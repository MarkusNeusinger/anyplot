review:
  strengths:
  - Every observation is one face built from the same six features, each driven by
    one min-max-scaled variable, so the twelve companies differ visibly and stay recognizable
    as faces at both ends of every range (smallest Retail faces still hold eyes, brows,
    nose and mouth inside the outline)
  - A two-line key below the grid names the variable behind each facial feature, and
    an italic caption states the direction of every mapping, so the faces can be decoded
    without the HTML
  - 'Faces colored by sector in canonical Imprint order (Tech #009E73, Retail #C475FD,
    Energy #4467A3) with a frameless horizontal legend in the top band; data colors
    are identical in both renders while eye whites, pupils and feature strokes flip
    with the theme tokens'
  - 'Idiomatic vectorized bokeh: all faces of a sector in one ellipse renderer, all
    eyes, brows, noses and mouths drawn for every face at once from one ColumnDataSource
    (segment, multi_line with list columns), and the key stacked as Title layouts
    below the frame'
  - HoverTool on the face renderers shows the company, sector and all six raw metric
    values in the HTML view
  weaknesses:
  - 'VQ-01 (both): the italic direction caption at the bottom is set at 26 pt in INK_SOFT,
    the smallest text on the canvas and clearly smaller than the 30 pt key it explains;
    it blurs first when the image is scaled down → about 30 pt (+4 pt), the key''s
    size. Likely cause: Title(..., text_font_size="26pt") of the caption.'
  - 'Suggestion: anchor each company label to its own face''s bottom edge (cy − rh)
    instead of a fixed offset, so the small Retail and Energy faces do not float far
    above their names.'
  - 'Suggestion: break the long italic caption into two shorter lines so it sits in
    the same column width as the key.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, no white seams.
      Chrome: bold title "chernoff-basic · python · bokeh · anyplot.ai" centered at top in near-black INK; below it a frameless horizontal legend (Tech, Retail, Energy) with tinted ellipse swatches; company names in INK_SOFT under each face; a two-line key at the bottom ("Face width: Revenue Growth (%) · Face height: Profit Margin (%) · Eye size: Customer Satisfaction (score)" / "Mouth curve: Market Share (%) · Brow slant: Debt-to-Equity (ratio) · Nose width: R&D Spend (% of revenue)") and a smaller italic caption on the mapping directions. No axes, no grid. All text readable; caption is the smallest.
      Data: 12 faces in a 4x3 grid, one row per sector: Tech faces in #009E73 outline with 0.3-alpha fill, Retail in #C475FD, Energy in #4467A3. Faces vary in width, height, eye size, brow slant, nose width and mouth curve (Nimbus Systems and Solvane Energy frown, Quantia Labs smiles). White eyes with dark pupils, near-black strokes for brows, nose, mouth.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no seams.
      Chrome: title and key in light INK #F0EFE8, legend labels, company names and caption in light-grey INK_SOFT; no dark-on-dark text anywhere.
      Data: same three outline/fill hues as light (fill reads darker because the 0.3 alpha blends with the dark page); eyes stay light with dark pupils, feature strokes flip to light ink and read clearly on the dark fills. Face geometry identical to light.
      Legibility verdict: PASS
