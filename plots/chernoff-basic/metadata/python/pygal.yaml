review:
  strengths:
  - 'Each of the 7 min-max-normalized car metrics drives exactly one facial feature
    (face width, face height, eye size, eye spacing, mouth curve, nose length, eyebrow
    slant), and the faces differ visibly: Sports C is wide and frowning, Compact D
    tall and smiling, Luxury E has the largest and widest-set eyes. These match the
    data.'
  - A three-column feature key names each feature = metric pairing with its unit,
    so the faces can be decoded without reading the code.
  - Eye whites and pupils use fixed colors in both themes, so the eyes never invert.
    The ink strokes for brows, nose and mouth flip with the theme and stay readable
    on both surfaces.
  - The pygal XY canvas carries the themed title, background and legend, and the native
    SVG output becomes an interactive HTML file next to the PNG.
  weaknesses:
  - 'VQ-05 (both): the content sits in the top two thirds of the canvas. An empty
    band of about 370 px sits between the last feature-key line (y ≈ 1340 px) and
    the bottom legend (y ≈ 1735 px), and about 200 px of empty space sits between
    the title and the faces → spread the face grid and key over the free height so
    no gap exceeds about 150 px (−220 px). Likely cause: content_top/content_bottom
    = 150/1620 and the face_size formula, which reserves 120 px plus key_h but does
    not use the remaining height.'
  - 'DQ-02 (both): the cars are labelled with a type plus a letter ("Sedan A", "SUV
    B", "Sports C", "Compact D", "Luxury E"), which reads as generic placeholder data
    → descriptive fictional model names (for example "Aurora Sedan", "Ridgeback SUV").
    Likely cause: the CAR column list in the Data block.'
  - 'Suggestion: the bottom legend repeats the bold label under each face. Dropping
    it (show_legend=False) would free its row for larger faces.'
  - 'Suggestion: the legend swatches sit flush against their text; a small gap would
    separate them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid.
      Chrome: the title "Car Performance Comparison · chernoff-basic · python · pygal · anyplot.ai" is centered at the top in dark ink, about 70% of the width. Each face has a bold dark observation label below it. A "Feature key" heading in bold sits over seven "Feature = Metric (unit)" entries in three columns in INK_SOFT. A bottom legend shows five color swatches with car names. All text is readable.
      Data: five Chernoff faces in one row: Sedan A (#009E73), SUV B (#C475FD), Sports C (#4467A3), Compact D (#BD8233), Luxury E (#AE3030). Each face is a tinted fill at 0.3 opacity with a solid outline in its color. Eyes are white with dark pupils, and the brows, nose and mouth are dark strokes. The faces differ clearly: Sports C is wide and frowning, Compact D is tall with a smile and a long nose, and Luxury E has the largest, widest-set eyes. The first series is #009E73. An empty band of about 370 px sits between the key and the legend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, face labels and key heading are in light ink (#F0EFE8), and the key entries in light gray (#B8B7B0). The legend text is light. There is no dark-on-dark text.
      Data: the face outlines use the same Imprint colors as the light render, and the tinted fills read as dark tones of each color. Eye whites and pupils are unchanged. The brow, nose and mouth strokes flip to light ink and are clearly visible. The legend swatches are dimmer but still distinguishable. The layout is identical to the light render.
      Legibility verdict: PASS
