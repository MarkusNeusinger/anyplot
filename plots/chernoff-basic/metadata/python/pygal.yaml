review:
  strengths:
  - 'All seven variables are min-max normalized to 0–1 before mapping, with a zero-span
    guard (fillna(0.5)), so every feature stays recognizable at both ends of its range:
    Vortex GT''s wide face and Pebble City''s tall narrow face still read as faces.'
  - Each of the five faces differs visibly on several features (face width/height,
    eye size, mouth curve, nose length, eyebrow slant), and the two-column Feature
    key names the variable behind every feature with units, so the faces can be decoded.
  - 'Theme tokens are threaded through every hand-built SVG element: features and
    labels flip between INK tones, eye whites and pupils are fixed so eyes never invert,
    and both renders are fully legible.'
  - Tinted fills (fill-opacity 0.3) with a saturated Imprint outline give each face
    a clear identity in both themes while keeping the black/white facial features
    high-contrast.
  - pygal supplies the canvas, title and bottom legend through its Style object, and
    the SVG it renders is extended with ElementTree, so the HTML output stays a single
    vector SVG.
  weaknesses:
  - 'VQ-03 (both): the bottom legend repeats the five car names exactly as the bold
    labels under each face already state them, and the per-car colors encode nothing
    beyond identity, so the legend tells the reader nothing new → drop the legend
    (or reserve color for a real grouping, as the Notes allow). Likely cause: chart.add(name,
    [None]) for every car with legend_at_bottom=True.'
  - 'Suggestion: the band between the face labels and the Feature key and the band
    below the key are wide; larger faces could take that height.'
  - 'Suggestion: a one-line note in the key on the direction of each mapping (e.g.
    ''wider = more hp'') would make the faces faster to decode.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
      Chrome: title "Car Performance Comparison · chernoff-basic · python · pygal · anyplot.ai" in dark ink, centered, ~70% width; bold dark car labels under each face; bold "Feature key" heading with seven "Feature = Variable (unit)" entries in INK_SOFT in two columns; bottom pygal legend with five colored swatches and car names. All readable.
      Data: five Chernoff faces in one row — Aurora Sedan (#009E73 outline, green tint, smile), Ridgeback SUV (#C475FD, round, flat mouth), Vortex GT (#4467A3, wide flat ellipse, frown, angry brows, short nose), Pebble City (#BD8233, tall narrow, big smile, long nose, small eyes), Regent Luxe (#AE3030, round, large eyes, flat brows). Features in dark ink, eye whites with dark pupils. First face is brand green.
      Legibility verdict: PASS

