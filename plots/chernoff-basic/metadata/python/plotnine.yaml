review:
  strengths:
  - Every variable is normalized to 0-1 and drives one facial feature, so the six
    faces differ visibly
  - Eye whites stay visible even at the smallest eye size
  - Idiomatic plotnine layering with facet_wrap strips as observation labels and coord_fixed
  - Theme-adaptive chrome correct in both renders
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2700 instead of 3200x1800, the title''s ascenders
    sit flush on the top edge and the legend box sits on the bottom edge → 3200x1800
    with a margin of at least ~20 px top and bottom. Likely cause: plot.save(dpi=300)
    with figure_size=(16, 9) instead of width=8, height=4.5, dpi=400.'
  - 'VQ-02 (both): the legend title ''Category'' touches the left frame of the legend
    box and ''Sedan'' its right frame → at least ~4 px padding inside the box. Likely
    cause: legend_background frame with no legend margin.'
  - 'VQ-07 (both): the legend order is Compact, SUV, Sedan, so the second group takes
    Imprint position 3 (#4467A3) and the third position 2 (#C475FD) → positions 1,
    2, 3 in legend order. Likely cause: the category_colors dict against the alphabetical
    scale order.'
  - 'SC-02 (both): no key tells which variable drives which facial feature; the subtitle
    only lists Power/Efficiency/Safety/Comfort → a caption or legend naming each mapping
    (width = power, …). Likely cause: the subtitle text.'
  - 'SC-04 (both): the title ''chernoff-basic · plotnine · anyplot.ai'' lacks the
    language segment → ''chernoff-basic · python · plotnine · anyplot.ai''. Likely
    cause: labs(title=...).'
  - 'DQ-02 (both): the observations are labelled Compact A, Compact B, Sedan A, Sedan
    B, SUV A, SUV B, which reads as generic → plausible fictional model names. Likely
    cause: the observation_id list.'
  - 'CQ-04 (code): lines 63-140 append one dict per point in eight separate loops
    → build each part as a DataFrame from its arrays (pd.DataFrame({''x'': ex, ''y'':
    ey, ...})). Likely cause: the all_data.append loops.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 4800x2700.
