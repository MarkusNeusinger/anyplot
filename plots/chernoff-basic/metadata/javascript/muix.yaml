review:
  strengths:
  - Feature-to-metric mapping is thoughtful and fully documented in code comments
    (face width/height, eye size/spacing, eyebrow angle, nose length, mouth curvature)
    covering all 7 normalized metrics from the spec
  - Sector grouping via row position AND stroke color creates genuine visual storytelling
    — the Manufacturing row reads as furrowed/frowning, the Technology row reads as
    relaxed/smiling, forming an at-a-glance pattern before reading any label
  - Deterministic LCG-based data generation (fixed seed=42) with sector-level baselines
    plus per-company jitter, producing plausible, distinguishable financial profiles
  - Correct theme-adaptive tokens throughout (t.ink, t.inkSoft, t.elevatedBg) so both
    renders are fully readable with no dark-on-dark or light-on-light failures
  - 'Correct Imprint palette usage in canonical order (row 0 -> #009E73 green, row
    1 -> lavender, row 2 -> blue), identical across light and dark themes'
  - Feature-key caption at the bottom substitutes for axis labels, explaining every
    facial mapping without cluttering the faces themselves
  - Title fontsize formula scales with title length and matches the required '{Descriptive
    Title} · {spec-id} · {language} · {library} · anyplot.ai' pattern
  weaknesses:
  - MUI X's own chart primitives (series, tooltip, legend component, formatted axis)
    are barely engaged — ChartContainer is used purely as a coordinate-system canvas
    via useXScale/useYScale, with faces, legend, and feature key all hand-drawn SVG.
    Legitimate for a glyph type MUI X can't natively express, but leaves little library-distinctive
    functionality on display.
  - Company-name captions are set at fontSize=13 (CSS px), which risks becoming hard
    to read once the image is scaled down to the ~400 px mobile srcset — consider
    bumping to ~14-15px to match the sizing used elsewhere for tick-label-equivalent
    text.
  - Noticeable empty vertical band between the sector legend (y=108) and the top of
    the first face row (chart area starts at margin.top=190) — tightening margin.top
    slightly would improve vertical rhythm.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Company Financial Health · chernoff-basic · javascript · muix · anyplot.ai" in bold dark ink, subtitle below in softer gray, sector legend (Technology/Retail/Manufacturing) with colored swatches, company name captions below each face, two-line feature-mapping key at the bottom. All chrome text is clearly readable against the light background.
      Data: 12 Chernoff faces in a 4-column x 3-row grid, each face an ellipse outlined in the sector's Imprint color (Technology = brand green #009E73, Retail = lavender, Manufacturing = blue) with dark eyes/eyebrows/nose/mouth. Face fill uses the elevated off-white token, distinguishing it subtly from the page background. First series color is confirmed as the brand green #009E73.
      Legibility verdict: PASS — no overlap, no clipping, all text and face features crisp.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/captions/feature key, now rendered in light ink (title/subtitle) and softer light gray (captions, feature key) against the dark background. All chrome text is clearly readable — no dark-on-dark failures observed.
      Data: Same 12 faces, same layout and grid; stroke colors identical to the light render (green/lavender/blue), face fill uses the darker elevated token (#242420) so faces read as subtly raised cards against the near-black page. Eyes/nose/mouth switch from dark ink to light ink for contrast, as expected — only chrome flips, data-encoding colors (sector stroke) stay identical.
      Legibility verdict: PASS — no dark-on-dark text, no clipping, faces and captions all legible.
