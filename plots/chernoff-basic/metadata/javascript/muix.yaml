review:
  strengths:
  - Seven variables min-max normalized to [0, 1] and each mapped to one facial feature;
    faces stay recognizable at both ends of every range
  - 'One row per sector with Imprint-colored outlines makes the sector profiles instantly
    comparable: smiling technology faces, flat-mouthed retail, frowning manufacturing
    with slanted brows'
  - Two-line footer key names every variable-to-feature mapping, with units, so the
    faces can be decoded
  - Theme tokens threaded through every element (elevated face fill, ink features,
    inkSoft nose and key); both renders are fully readable
  - 'Uses the MUI X composition API: a custom SVG layer inside ChartsContainer positioned
    through useXScale / useYScale / useDrawingArea'
  weaknesses:
  - 'Suggestion: align the company labels on one baseline per row (e.g. below the
    tallest face of the row) so they read as a tidy row instead of shifting with each
    face height.'
  - 'Suggestion: hide the layout axes with position: "none" instead of height: 0 /
    width: 0, the v9 idiom the library prompt names.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "chernoff-basic · javascript · muix · anyplot.ai" centered at top, a soft-ink subtitle ("12 faces (Company) · 3 groups (Sector) · 7 variables normalized to [0, 1] ..."), a ring-swatch legend (Technology, Retail, Manufacturing), bold dark company labels under each face, and a two-line soft-ink footer key mapping each feature to its variable. All text readable.
      Data: 3x4 grid of Chernoff faces, one row per sector. Technology faces outlined in #009E73 (large, tall, smiling), Retail in purple (round, big eyes, flat mouths), Manufacturing in blue (narrow, small eyes, steeply slanted brows, frowns). Faces filled with the light elevated surface; eyes, brows and mouth in dark ink, nose in soft ink.
      Legibility verdict: PASS

