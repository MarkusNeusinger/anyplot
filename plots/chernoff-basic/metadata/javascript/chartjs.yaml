review:
  strengths:
  - Creative, technically sound use of Chart.js's plugin system (afterDatasetsDraw)
    combined with an invisible scatter dataset to position and hand-draw genuine Chernoff
    faces — a distinctive, idiomatic solution given Chart.js has no native face-glyph
    chart type.
  - 'Correct Imprint palette usage: sector colors map to canonical positions 1-3 (#009E73,
    #C475FD, #4467A3), identical across light/dark renders, with theme-adaptive chrome
    (background, ink, inkSoft) correctly threaded through every canvas drawing call.'
  - All 6 facial-feature mappings (face width/height, eye size, eyebrow slant, nose
    length, mouth curvature) are normalized to 0-1 per the spec and show clear, legible
    variation across companies — happy/neutral/sad mouths, differing eye sizes and
    face sizes are all visible at a glance.
  - Grid layout (4×3) with sector color-coding and a bottom legend closely matches
    the spec's own recommendations ("Grid layout recommended… Consider colorizing
    faces by group membership").
  - Deterministic seeded LCG stands in for a seeded RNG since the browser has none,
    keeping the data reproducible.
  - Title format and both theme renders are clean and legible with explicit font sizes
    for title, legend, and company labels.
  weaknesses:
  - 'DQ-03: Tooltip values for liquidity_ratio and rd_intensity are raw 0-100% figures
    that are unrealistic for their real-world domain (liquidity ratios aren''t normally
    expressed as a 0-100% figure; R&D intensity rarely approaches 100% of revenue
    for any real company) — rescale or relabel these metrics to stay factually plausible.'
  - 'SC-02: Only 6 of the spec''s suggested facial-feature mappings are used; eye
    spacing and mouth width stay fixed rather than encoding additional variables —
    map 1-2 more metrics onto these features for fuller multivariate coverage.'
  - 'DE-03: Visual hierarchy relies only on sector color and per-feature variation;
    there is no explicit emphasis or callout of a standout/outlier company to give
    the viewer a specific takeaway at a glance.'
  - 'CQ-01: The implementation needs several helper functions (lcg, normalize, drawFace)
    for the custom face-drawing plugin — justified by the plot type, but a bigger
    deviation from the flat "Imports → Data → Plot" structure than most chartjs specs.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "chernoff-basic · javascript · chartjs · anyplot.ai" at top in dark ink; 12 company-name labels below each face in medium-gray; bottom legend with three colored round swatches labeled Technology / Retail / Energy. All chrome is clearly readable against the light background.
      Data: 12 Chernoff faces arranged in a 4x3 grid, each face outlined in one of three Imprint colors (green #009E73 = Technology, lavender #C475FD = Retail, blue #4467A3 = Energy); eyes/eyebrows/mouth drawn in dark ink, nose in soft dark gray. Faces show clear variation in size, eye size, eyebrow slant, nose length, and mouth curvature (happy/neutral/sad) across companies. First series (Technology) correctly uses #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, company labels, and legend text all render in light gray/off-white, clearly legible against the dark background. No dark-on-dark failures observed.
      Data: Same 12 faces in the same 4x3 grid; outline colors (green/lavender/blue) are pixel-identical to the light render, confirming only chrome flipped. Facial-feature strokes (eyes, eyebrows, mouth) now render in near-white ink instead of near-black, correctly adapted for contrast against the dark surface.
      Legibility verdict: PASS
