review:
  strengths:
  - All 8 spec-suggested facial-feature mappings are now used (face width/height,
    eye size, eyebrow slant, mouth curvature, nose length, eye spacing, mouth width)
    — full multivariate coverage per company.
  - liquidity_ratio and rd_intensity now use realistic domain-appropriate scales (0.8-3.2x
    current-ratio multiple, 1-22% of revenue) instead of raw 0-100% figures, with
    matching tooltip units.
  - 'Explicit data-storytelling touch added: a dashed highlight ring and star-prefixed
    label mark the company with the strongest composite overall profile, giving the
    grid a clear focal point.'
  - Creative, technically sound use of Chart.js's plugin system (afterDatasetsDraw)
    combined with an invisible scatter dataset to position and hand-draw genuine Chernoff
    faces.
  - 'Correct Imprint palette usage: sector colors map to canonical positions 1-3,
    identical across light/dark renders, with theme-adaptive chrome correctly threaded
    through every canvas drawing call.'
  - Deterministic seeded LCG keeps the data reproducible since the browser has no
    RNG seed.
  weaknesses:
  - The highlighted top-performer (Bluepeak Retail) has a frowning mouth (its liquidity_ratio
    is comparatively low) which can read as visually incongruous next to the star/highlight
    — inherent to independent per-feature encoding rather than a bug, but worth a
    one-line legend/caption note in a future pass to preempt viewer confusion.
  - Several helper functions (lcg, scaleRange, normalize, drawFace) are required for
    the custom-drawing plugin, a larger deviation from the flat 'Imports -> Data ->
    Plot' structure than most chartjs specs — justified here but still the largest
    remaining code-quality gap.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "chernoff-basic · javascript · chartjs · anyplot.ai" at top; 12 company-name labels below each face in medium-gray ink; bottom legend with Technology/Retail/Energy swatches. All text clearly legible against the light background.
      Data: 12 Chernoff faces in a 4x3 grid, outlined in the three Imprint sector colors (green #009E73 Technology, lavender/purple Retail, blue Energy). Eyes/eyebrows/mouth/nose drawn in dark ink. Face shape, eye size, eyebrow slant, mouth curvature/width, eye spacing, and nose length all visibly vary per company, encoding all 8 spec metrics. The composite-score top performer (Bluepeak Retail, top-right) has a dashed highlight ring and a star-prefixed bold label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, company labels, and legend text all render in light/cream ink, clearly readable against the dark background. No dark-on-dark failures observed.
      Data: Same 4x3 face grid with pixel-identical outline colors (green/lavender/blue) to the light render, confirming only chrome flipped. Eyes are now filled cream/light instead of dark, eyebrows/mouth/nose in light ink — correctly adapted. The highlight ring/star label on Bluepeak Retail is preserved and legible (white dashed ring, white star+bold text).
      Legibility verdict: PASS
