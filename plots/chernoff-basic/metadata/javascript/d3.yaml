review:
  strengths:
  - Correct Chernoff faces with 8 distinct facial-feature encodings (face width, face
    height, eye size, eye spacing, eyebrow slant, nose length, mouth curvature, mouth
    width) matching the spec's suggested mappings almost exactly
  - 'Thoughtful data storytelling: industries are grouped both by grid row AND by
    outline color, giving a redundant encoding that makes cross-industry comparison
    easy at a glance'
  - Theme-adaptive chrome is correctly threaded through every element; Imprint data
    colors (green/lavender/blue for Tech/Retail/Manufacturing) are pixel-identical
    between light and dark renders, only chrome flips
  - 'Clean, idiomatic D3: hard-coded deterministic dataset, single global d3 import,
    scaleLinear/scaleOrdinal + selection.join() used correctly, no fake interactivity'
  - No clipping, overlap, or canvas-size issues; title format and legend labels comply
    with spec
  weaknesses:
  - Design polish is functional but fairly literal/tutorial-style face rendering (plain
    ellipses and paths); a distinguishing visual refinement (e.g. subtle shading,
    varied stroke weights, or emphasis on the outlier face) would raise it above baseline
    Chernoff-face examples
  - Company-name labels at 14px are the smallest text element and, being 12 of them,
    look cramped at mobile width (400px) — consider bumping to ~15-16px or trimming
    to shorter identifiers
  - The per-variable normalization the spec calls out (0-1 scaling before mapping
    to facial features) is only implicit via extent-based d3.scaleLinear composition
    — mathematically equivalent, but an explicit normalization step would make the
    encoding pipeline more transparent to a reader of the code
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "chernoff-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center; a 3-item legend (Tech/Retail/Manufacturing) with colored dot swatches and soft-ink labels below the title; 12 company-name labels in soft-ink below each face. All chrome text is dark-on-light and clearly legible.
      Data: 12 Chernoff faces in a 4x3 grid, grouped by industry both by row and by outline color (Tech=green #009E73, Retail=lavender, Manufacturing=blue — first series correctly uses the brand green). Each face's outline color, width/height, eye size/spacing, eyebrow slant, nose length, and mouth curvature/width encode a distinct financial metric. Face fill is a light elevated cream, facial features drawn in dark ink.
      Legibility verdict: PASS — no light-on-light text, no clipping, no overlap between labels/faces.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light ink (near-white) against the dark background; company-name labels in a slightly softer light gray. All chrome text is clearly legible against the dark background.
      Data: Same 12-face grid; the industry outline colors (green/lavender/blue) are pixel-identical to the light render — only the face fill (now dark elevated gray) and facial-feature ink (now light) flipped with the theme, exactly as required. No dark-on-dark text anywhere.
      Legibility verdict: PASS — all chrome and data elements read clearly; no dark-on-dark failures observed.
