review:
  strengths:
  - Genuinely custom-built Chernoff face glyph via ECharts' custom series renderItem
    (group of circle/line/polyline/bezierCurve shapes) — a distinctive, hard-to-replicate-elsewhere
    technique, not just a configured built-in chart type
  - All 8 raw metrics are normalized to 0-1 exactly as the spec requires, then mapped
    to 8 distinct facial features (face width/height, eye size/spacing, eyebrow slant,
    nose length, mouth width/curvature)
  - 'Sector grouping is both color-coded (Imprint palette positions 1-3, first series
    correctly #009E73) and spatially grouped by row, giving redundant encoding beyond
    hue alone'
  - Perfect theme adaptation — data colors identical between light/dark renders, all
    chrome (ink, inkSoft, elevatedBg) correctly threaded through the custom renderItem,
    no dark-on-dark or light-on-light failures
  - Realistic, neutral business scenario (fictional companies across Tech/Retail/Finance)
    with plausible financial-ratio ranges (revenue growth, profit margin, liquidity
    ratio, debt-to-equity, etc.)
  - Manually built graphic legend correctly compensates for the custom series having
    no native legend support
  - 'Clean, deterministic, KISS-structured code: seeded LCG, no unused imports, no
    fake interactivity'
  weaknesses:
  - The nose glyph (polyline forming a right-angle bridge+base) visually reads as
    the letter 'L' printed on the face rather than a nose silhouette — a small curved
    or triangular nose shape would read more naturally and lift aesthetic polish
  - Noticeable unused whitespace below the third face row (roughly the bottom ~13%
    of the canvas) — nudging marginBottom down or growing the grid slightly would
    tighten canvas utilization
  - Facial feature differences (especially eyebrow slant) are subtle at this face
    size — some faces look very similar at a glance; slightly exaggerating the feature-to-fraction
    mapping ranges would sharpen the 'faces as fingerprints' storytelling effect this
    technique is known for
  - Company-name labels (13px) are the smallest text element in the composition and
    sit close to the axis-label sizing floor — worth a small bump for extra headroom
    at the 400px mobile thumbnail size
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the style guide — not pure white.
      Chrome: Title "chernoff-basic · javascript · echarts · anyplot.ai" (bold, dark ink) and subtitle "Each face encodes 8 normalized financial-health metrics via facial features, grouped by sector" are both crisp and clearly readable against the light background. A top-right legend lists "Tech sector" / "Retail sector" / "Finance sector" with colored swatch dots (green/purple/blue), also fully legible.
      Data: 12 Chernoff faces arranged in a 4-column x 3-row grid, one row per sector. Face outlines/strokes use the Imprint palette in canonical order — row 1 (Tech) = brand green #009E73, row 2 (Retail) = lavender #C475FD, row 3 (Finance) = blue #4467A3. Face fills are a slightly elevated off-white (distinct from page background), eyes/eyebrows/nose/mouth render in dark ink. Faces vary visibly in width/height (e.g. Pulsewave Robotics and Silverline Bank are more elongated/oval), mouth curvature (Meridian Mart smiles; several others frown or sit flat), and eye spacing/eyebrow slant. Each face is labeled with its company name below it in dark, legible text.
      Legibility verdict: PASS — all text (title, subtitle, legend, company labels) is clearly readable on the light surface; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the style guide — not pure black.
      Chrome: Title and subtitle now render in light ink/inkSoft tones and remain fully readable against the dark background. Legend swatches and text are equally legible; no dark-on-dark failures anywhere.
      Data: Same 12-face grid layout. Face outline colors (green/lavender/blue) are pixel-identical to the light render — only the chrome (background, text, face-fill "elevated" tone) flipped to the dark palette, exactly as required. Eyes/eyebrows/nose/mouth now render in light ink so they remain visible against the darker face fill. Face-to-face feature variation (shape, mouth curvature, eyebrow slant) is preserved identically to the light render.
      Legibility verdict: PASS — all text and facial detail strokes are clearly visible against the dark surface; no dark-on-dark failures observed.
