review:
  strengths:
  - Correct Imprint palette usage with brand green (#009E73) as the first categorical
    series and lavender/blue for the remaining two experience levels
  - 'Fully theme-adaptive chrome: title, axis labels, tick labels, and legend are
    all clearly readable on both the light (#FAF8F1) and dark (#1A1A17) backgrounds,
    with data colors identical between renders'
  - Consistent box widths (width = 0.65) and dodge spacing (position_dodge(width =
    0.75)) across all department/experience combinations
  - 'Realistic, appropriately scoped synthetic dataset: 4 departments x 3 experience
    levels x 70 points, within the spec''s 20-200 points/subcategory and 2-6/2-4 category
    ranges'
  - Clean, idiomatic single-file ggplot2 implementation that reads ANYPLOT_THEME and
    handles both themes without duplicated code, using ragg::agg_png for output
  weaknesses:
  - Horizontal gridlines use the full INK color (panel.grid.major.y = element_line(color
    = INK, linewidth = 0.25)) rather than a muted tone, making them read as bolder/more
    prominent than a typical subtle grid in both renders — consider INK_SOFT or a
    lighter linewidth for more visual refinement.
  - 'Design is competent but generic: no distinctive visual flourish, annotation,
    or focal point beyond the standard grouped-boxplot layout, so it reads as a correct
    but unremarkable implementation of the style guide rather than an elevated one.'
  - No ggplot2-specific feature beyond geom_boxplot + position_dodge + scale_fill_manual
    is used (e.g. no stat_summary mean markers, no coord_cartesian tuning) — a distinctive
    library touch would raise Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold black title "box-grouped · r · ggplot2 · anyplot.ai" top-left; "Experience Level" legend with Junior/Mid/Senior swatches top-right; "Department" x-axis title and "Productivity Score" y-axis title in dark ink; tick labels (Engineering/Sales/Marketing/Support, 40/60/80) in softer dark grey. All text is clearly readable against the light background.
      Data: Grouped/dodged box plots — 4 departments (Engineering, Sales, Marketing, Support) each with 3 side-by-side boxes (Junior = green #009E73, Mid = lavender #C475FD, Senior = blue #4467A3). Each box shows a dark median line, IQR box, whiskers, and grey outlier dots below/above. Boxes are consistently sized and evenly dodged within each department group.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: White bold title, light-grey/white axis titles, light-grey tick labels and legend text — all clearly visible against the dark background. No dark-on-dark text observed.
      Data: Same grouped box plot layout and same three data colors (green/lavender/blue) as the light render — confirmed identical to the light render, only chrome (background, gridlines, text, median-line/box-outline ink) flipped to light tones. Outlier dots remain grey and visible against the dark background.
      Legibility verdict: PASS
