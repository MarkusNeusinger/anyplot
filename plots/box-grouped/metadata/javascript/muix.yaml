review:
  strengths:
  - 'Both weaknesses from Attempt 1 were fixed precisely: the Y-axis label now reads
    "Productivity Index (0-100 scale)" (VQ-06), and a new italic annotation plus per-level
    dashed median-trend polylines explicitly call out the consistent Senior > Mid
    > Junior pattern across all four departments (DE-03).'
  - Correctly builds a full grouped box plot from scratch (median, IQR quartile box,
    1.5x IQR whiskers, hollow outlier circles) via a custom SVG layer composed on
    top of MUI X's ChartContainer using useXScale/useYScale -- a genuinely distinctive,
    idiomatic way to extend MUI X beyond its built-in chart types since the community
    package has no native box plot.
  - 'Palette compliance is correct: first subcategory (Junior) is #009E73 brand green,
    followed by Imprint palette positions 2-3 (lavender, blue) for Mid/Senior; data
    colors are identical between light and dark renders, and chrome (background, text,
    grid, legend) is theme-correct in both.'
  - Deterministic, realistic productivity-by-seniority dataset with a good mix of
    boxes that do and don't carry outliers, plus consistent box widths across all
    groups per the spec's explicit requirement.
  - Clean, explicit typographic hierarchy (title 22px, axis labels 16px, ticks/legend
    14px, annotation 12px italic) with no overlap between the new annotation/trend
    lines and existing chart elements.
  weaknesses:
  - 'Design Excellence is strong but not yet full publication-tier: the underlying
    box-mark treatment is unchanged from Attempt 1, so the aesthetic ceiling is still
    a well-executed standard box plot with an overlay, not a from-scratch distinctive
    visual system.'
  - The growing custom quantile/boxStatistics/trend-line SVG logic is justified by
    MUI X's lack of a native box plot, but keep an eye on further accumulation of
    helper code as a KISS trade-off.
  - ChartContainer and its axis/grid children don't set skipAnimation explicitly;
    harmless here since series=[] and the box marks are static custom SVG, but worth
    adding as a defensive habit per the library's animation-off rule.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "box-grouped · javascript · muix · anyplot.ai" top-left in dark ink, fully legible. A manually built legend row (green "Junior", lavender "Mid", blue "Senior") sits just below it. Y-axis label now reads "Productivity Index (0-100 scale)" (fixed from Attempt 1's unit-less "Productivity Index"). X-axis label "Department". Subtle horizontal-only gridlines. A new small italic annotation ("Senior medians (dashed) consistently outperform Mid and Junior") sits top-left inside the plot area, near but not overlapping the y=100 gridline/tick.
      Data: Four department groups (Engineering, Sales, Marketing, Support), each with three side-by-side boxes -- green (Junior), lavender (Mid), blue (Senior) -- semi-transparent fills with matching-color strokes, dark median lines, thin gray whiskers with caps, hollow outlier circles in the series color. Three new dashed trend polylines (one per level, in that level's color) connect the medians across departments, visually reinforcing the annotation's claim.
      Legibility verdict: PASS -- all text (title, legend, axis labels, ticks, annotation) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title/legend/axis-label/annotation content, now rendered in light ink (title/axis labels bright, tick labels/annotation softer light gray) -- fully legible against the dark surface. Gridlines are faint light lines, appropriately subtle.
      Data: The three subcategory colors (green, lavender, blue) are visually identical to the light render -- only chrome flipped, as required. Median lines render in light ink against the colored fills and remain clearly visible (this is the correct theme-adaptive behavior, contrasting with the black median lines in the light render). Whiskers, caps, and outlier circles stay clearly distinguishable against the dark background. Dashed trend lines remain visible at their reduced opacity.
      Legibility verdict: PASS -- no dark-on-dark failures observed; every text element and every data mark is legible.
