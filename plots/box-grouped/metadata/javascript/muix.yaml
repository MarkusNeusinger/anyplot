review:
  strengths:
  - Correctly builds a full grouped box plot from scratch (median, IQR quartile box,
    1.5x IQR whiskers, outliers) via a custom SVG layer composed on top of MUI X's
    ChartContainer using useXScale/useYScale — a genuinely distinctive, idiomatic
    way to extend MUI X beyond its built-in chart types since the community package
    has no native box plot.
  - 'Palette compliance is correct: first subcategory (Junior) is #009E73 brand green,
    followed by Imprint palette positions 2-3 (lavender, blue) for Mid/Senior; data
    colors are identical between light and dark renders, and chrome (background, ink,
    grid) is theme-correct in both.'
  - Deterministic, realistic productivity-by-seniority dataset that tells a consistent
    story across all four departments (Senior always highest, Junior always lowest),
    with a good mix of boxes that do and don't carry outliers to demonstrate plot
    variety.
  - Clean, explicit typographic hierarchy (title 22px, axis labels 16px, ticks/legend
    14px) and consistent box widths maintained across all groups, matching the spec's
    explicit requirement.
  weaknesses:
  - Y-axis label 'Productivity Index' has no unit/scale context (VQ-06) — since it's
    a composite 0-100 index rather than a physical unit, add a short qualifier like
    'Productivity Index (0-100 scale)' so the axis is self-explanatory without relying
    on the tick range.
  - Design Excellence is competent but still reads as a well-executed standard box-plot
    treatment rather than something with a distinct focal point — consider a subtle
    emphasis technique (e.g., a light callout on the consistent Senior > Mid > Junior
    trend, or a slightly bolder treatment for one series) to push past 'good default'
    into genuinely distinctive storytelling.
  - The custom quantile/boxStatistics helper functions are necessary since MUI X has
    no native box plot, but they do add structure beyond a minimal Imports -> Data
    -> Plot script — acceptable here given the library constraint, just don't let
    it grow further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-grouped · javascript · muix · anyplot.ai" in dark ink top-left, fully legible. A manually built legend below it shows three swatches (green "Junior", lavender "Mid", blue "Senior"), all readable. X-axis "Department" and Y-axis "Productivity Index" labels are dark and clearly readable, as are the numeric Y tick labels (15-100) and the four department tick labels (Engineering, Sales, Marketing, Support). Subtle horizontal-only gridlines are visible without competing with the data.
      Data: Four department groups each contain three side-by-side boxes (Junior/Mid/Senior). Boxes use semi-transparent fills with matching-color strokes; median lines are dark/black and sit clearly on top of each fill; whiskers are thin gray lines with caps; open circles in the series color mark outliers (e.g., Engineering-Junior, Sales-Mid, Marketing-Junior, Support-Mid). First series (Junior) is #009E73 green as required.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light ink, fully legible against the dark surface. Axis labels, tick labels, and gridlines all flipped to light/subtle tones with no dark-on-dark elements.
      Data: The three subcategory colors (green, lavender, blue) are visually identical to the light render — only the chrome flipped as required. Median lines render in light ink against the colored fills (clearly visible), whiskers and outlier circles remain distinguishable against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures observed.
