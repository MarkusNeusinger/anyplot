review:
  strengths:
  - Composes the box layer on MUI X's own band and linear scales via useXScale/useYScale
    inside ChartsContainer, so boxes stay aligned with the native axes, ticks and
    grid
  - Ordered experience levels are colored with evenly spaced imprint_seq steps built
    from t.seq, green to blue in natural order, identical in both themes
  - 'Correct box statistics: linear-interpolated quartiles, whiskers ending at the
    most extreme inliers within 1.5×IQR, outliers as hollow page-colored circles at
    their values'
  - 'Clean header hierarchy: title, ink-soft subtitle stating n and the whisker rule,
    and a compact legend whose swatches mirror the box styling'
  weaknesses:
  - 'Suggestion: the y-axis title sits about 50 px from its tick labels; a narrower
    y band (width about 64) would tie it to the axis.'
  - 'Suggestion: MUI X''s native ChartsLegend could replace the hand-built HTML legend
    if the boxes were registered as series.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "box-grouped · javascript · muix · anyplot.ai" centered at top, ink-soft subtitle "558 observations · Department: 4 · Experience level: 3 · Whiskers at 1.5×IQR", a centered legend (Junior, Mid-Level, Senior) with rounded-square swatches. Y axis "Productivity index (0–100)" ticks 30–100, x axis "Department" with Engineering, Sales, Marketing, Customer Support. Subtle dashed horizontal grid. All text dark and readable.
      Data: four clusters of three boxes; Junior in brand green #009E73, Mid-Level teal, Senior blue (imprint_seq steps), translucent fills with solid strokes and heavier median lines. Hollow circle outliers above and below (e.g. Engineering Junior at ~88 and ~33, Customer Support Mid-Level at ~89, ~78, ~44). Clusters clearly separated.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels in light ink, all readable; axis lines light; grid dashed and subtle. No dark-on-dark text.
      Data: same green/teal/blue strokes as the light render; translucent fills read darker against the page, median lines remain visible against the fill. Outlier circles filled with the page color, outlined in series color.
      Legibility verdict: PASS
