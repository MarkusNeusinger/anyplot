review:
  strengths:
  - 'Composes the box-and-whisker layer natively into MUI X: a ChartsContainer with
    a band x axis (categoryGapRatio 0.36) and a numeric y axis, plus a custom SVG
    layer that places every box through useXScale/useYScale, so boxes, ticks and grid
    share one coordinate system'
  - 'Box statistics are written out correctly: linearly interpolated quartiles, whiskers
    ending at the most extreme values inside 1.5×IQR, and every value beyond the fences
    drawn as a hollow outlier ring at its own value'
  - Boxes of one width in every cluster, with clear gaps between the four departments,
    a shared value axis that is not forced to zero, and a thick median stroke that
    stays visible against the translucent fill in both themes
  - Legend swatches repeat the boxes' own style (translucent fill, 2.2 px outline,
    rounded corners), and every chrome element reads from ANYPLOT_TOKENS, so the light
    and dark renders differ only in background and text
  - 'Plausible, deterministic scenario: a seeded LCG with a Box-Muller transform generates
    productivity scores by department and experience level, with department offsets
    and a few injected outliers'
  weaknesses:
  - 'VQ-07 (both): the ordered experience levels Junior → Mid-Level → Senior are drawn
    in categorical palette positions 1–3 (#009E73, #C475FD, #4467A3), as if they were
    unrelated groups → three ordered steps of one Imprint ramp (imprint_seq, from
    t.seq[0] to t.seq[1]) in Junior→Senior order, kept distinct from each other and
    from both backgrounds. Likely cause: `const color = t.palette[subIdx]` in BoxWhiskerLayer
    and `t.palette[i]` in the header legend.'
  - 'Suggestion: a legend heading such as ''Experience level'' in front of the swatches
    would name the grouping variable right at the legend instead of only in the subtitle.'
  - 'Suggestion: a slightly larger x tick font (about 15–16 px) would balance the
    department names against the 16 px axis titles in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: bold dark title "box-grouped · javascript · muix · anyplot.ai" centered at the top (~35% of width); a muted subtitle "558 observations · Department: 4 · Experience level: 3 · Whiskers at 1.5×IQR"; a horizontal legend under it with box-style swatches for Junior, Mid-Level and Senior. The y axis is titled "Productivity index (0–100)" with ticks 30–100; the x axis is titled "Department" with Engineering, Sales, Marketing and Customer Support. Dashed horizontal grid, subtle. All text is dark and readable.
      Data: four department clusters, each with three side-by-side boxes: Junior #009E73 green, Mid-Level #C475FD purple, Senior #4467A3 blue. Translucent fills, solid outlines, a thicker median line, capped whiskers and hollow outlier rings (Engineering Junior at ~88 and ~33, Sales Mid at ~91, Marketing Junior at ~85, Customer Support Mid at ~89, ~78 and ~44). Senior whiskers reach 100 in Engineering and Marketing.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: the title, subtitle, legend labels, axis titles and tick labels all switch to light ink. Axis lines and tick marks are light, and the dashed grid stays subtle but visible. No dark-on-dark text.
      Data: the same three hues as the light render (green, purple, blue); the translucent fills read darker against the dark page, as expected. The outlines, medians and outlier rings are clearly visible, and the brand green holds up well.
      Legibility verdict: PASS
