review:
  strengths:
  - 'Clever, legitimate workaround for the missing highcharts-more boxplot module:
    a hidden column series establishes axis pixel mapping while chart.events.render
    + SVGRenderer (path/rect/circle) + axis.toPixels draw genuine quartile boxes,
    whiskers at 1.5×IQR, median lines, and outliers — this is a documented Highcharts
    extensibility pattern, not a fake/simulated feature'
  - Box widths and inter-group offsets are computed once from axis pixel spacing (slot/groupWidth/boxWidth),
    so all four department groups render with visually consistent box and cap widths
    as required by the spec
  - 'Full Imprint palette compliance: Junior=#009E73 (brand green, always-first rule),
    Mid-level and Senior follow canonical positions 2-3, identical across light/dark
    renders, with theme-adaptive chrome (ink, inkSoft, grid, pageBg) correctly threaded
    through title/axes/legend/median-line color'
  - 'Realistic, neutral data: seniority-correlated productivity distributions (tightening
    spread + rising median from Junior to Senior) plus four genuine outliers spread
    across different department/level combinations satisfy the spec''s outlier + varying-spread
    requirement'
  - Deterministic reproducibility via a tiny fixed-seed LCG (seed 42) generating Box-Muller
    normal samples — appropriate since there's no seeded RNG in the browser runtime
  - Outlier markers rendered as hollow circles filled with the page background color,
    giving good contrast against the translucent (45% opacity) box fills at every
    zoom level
  weaknesses:
  - 'Design refinement: the full x-axis line and y-axis tick/line remain fully visible
    as a boxed-in frame rather than the recommended L-shaped or minimal spine treatment
    — lighten or drop the axis line further (keep only tick labels) for a more polished
    look'
  - 'Data storytelling: the clear ''productivity rises and spread tightens with seniority''
    pattern repeats identically across all four departments but nothing in the chart
    calls it out — a subtle emphasis (e.g. a slightly bolder Senior median line, or
    a small annotation on one group) would help the viewer land on the insight faster'
  - Code structure leans on several helper functions (makeLcg, randNormal, quantile)
    and a fairly involved chart.events.render handler rather than a flatter data-then-plot
    script; understandable given the manual box-plot construction, but consider trimming/inlining
    where feasible to move closer to the KISS ideal
  - Title (fontSize 22px) reads noticeably smaller relative to the 3200px canvas width
    than a typical mandated-title fill; still legible and matches the highcharts-specific
    default, but a touch larger could strengthen the visual hierarchy
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-grouped · javascript · highcharts · anyplot.ai" in bold dark ink at top, clearly readable. X-axis title "Department" and Y-axis title "Productivity Score" in medium-gray ink, both legible. Tick labels (department names, 30-100 Y ticks) in the same soft gray, all readable. Subtle horizontal gridlines only, not competing with data. Legend "Experience Level" with three swatches (Junior/Mid-level/Senior) sits centered below the x-axis title, clearly separated from the plot area.
      Data: Four department groups (Engineering, Sales, Support, Operations), each with three side-by-side boxes. First series (Junior) is brand green #009E73, second (Mid-level) is lavender/purple, third (Senior) is blue — matching Imprint palette canonical order. Box fills are translucent with a solid colored stroke; median lines are dark ink; whiskers/caps extend to 1.5×IQR; open outlier circles (hollow, page-background fill, colored stroke) appear above/below several boxes (Engineering Senior, Sales Junior, Support Mid-level, Operations Senior).
      Legibility verdict: PASS — no light-on-light text, all chrome and data elements clearly distinguishable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title now rendered in near-white ink, still bold and fully legible. Axis titles and tick labels switch to light gray, remaining readable against the dark surface. Gridlines are faint light-gray at low opacity, still visible but subtle. Legend text is light gray, swatches unchanged.
      Data: Same three data colors (green / lavender-purple / blue) as the light render — confirmed identical, only chrome flipped. Median lines switch to near-white ink so they stay visible against the (still colored, still translucent) box fills. Outlier circles keep their colored stroke with page-background (near-black) fill, remaining visible against the box colors.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis titles, tick labels, legend) is clearly readable against the near-black background, and data colors are unchanged from the light render.
