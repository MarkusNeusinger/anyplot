review:
  strengths:
  - 'Correct Imprint palette application: Junior (first legend entry) renders in brand
    green #009E73, Mid-level in lavender, Senior in blue — identical data colors across
    both light and dark renders'
  - 'Creative, correct workaround for the unavailable highcharts-more boxplot module:
    quartile box, median line, whiskers, caps, and outliers are all drawn manually
    via the core Highcharts SVG renderer, synced to axis pixel coordinates on the
    chart ''render'' event'
  - Deterministic seeded data generation (fixed-seed LCG) with realistic department
    + seniority-driven means and spreads, plus plausible outliers ('a struggling senior',
    'a standout junior')
  - 'Thoughtful visual hierarchy: Senior-level boxes get a bolder stroke and higher
    fill opacity, calling attention to the seniority → productivity trend the data
    tells'
  - Theme-adaptive chrome is fully correct in both renders — background, title, axis
    labels, tick labels, grid, and legend all use theme tokens correctly, and the
    median line correctly flips from dark ink to light ink between themes
  - Consistent box widths across all groups and a clear, correctly labeled legend,
    as required by the spec
  weaknesses:
  - Relies on several helper functions (makeLcg, randNormal, quantile, drawLine) rather
    than a flat top-down script — acceptable given the custom-rendering requirement,
    but a minor deviation from the ideal KISS structure
  - Y-axis title 'Productivity Score' has no explicit scale/unit hint (e.g. '(0-100
    index)'); minor since it's a synthetic score without a natural physical unit
  - The core visual bypasses Highcharts' native series abstraction entirely (raw renderer
    draws instead of a typed series) — the correct workaround for the module constraint,
    but a lower-level approach than the library's most idiomatic high-level API pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 - not pure white, not dark.
      Chrome: Title "box-grouped · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible; "Department" x-axis title and "Productivity Score" y-axis title in medium-gray ink, both readable; tick labels (department names, y-axis numbers) in a slightly lighter gray, all legible; subtle horizontal gridlines at each y tick; legend "Experience Level" with three swatches (Junior/Mid-level/Senior) below the x-axis, clearly readable.
      Data: Four department groups (Engineering, Sales, Support, Operations), each with three side-by-side box plots (Junior=green #009E73, Mid-level=lavender/purple, Senior=blue-gray). Each box shows a quartile body, a dark median line, whisker lines with caps, and open-circle outliers (e.g. a low junior outlier in Engineering, a high senior outlier in Sales, a low mid-level outlier in Support, a low senior outlier in Operations). Senior boxes have a visibly bolder outline/fill than Junior/Mid-level, creating a clear seniority-based visual hierarchy.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 - not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light/off-white ink, clearly legible against the dark surface; gridlines are faint and visible; legend text is light-colored and readable; the box median lines correctly flip from dark ink (light render) to light/white ink (dark render) so they remain visible against the fill.
      Data: Same four departments and three experience levels, identical box colors and structure as the light render (green/lavender/blue-gray, same outlier positions and Senior emphasis). No color drift between themes.
      Legibility verdict: PASS - no dark-on-dark text; all chrome elements are clearly visible against the near-black background.
