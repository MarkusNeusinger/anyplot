review:
  strengths:
  - Correct Imprint palette order (green → lavender → blue, positions 1-3) with data
    colors identical between light and dark renders
  - Theme-adaptive chrome (ink/inkSoft/grid tokens) applied consistently; median line
    uses page-bg color for contrast against the colored box fill, verified legible
    on both light and dark surfaces
  - 'Proper statistical construction: d3.quantile() for Q1/median/Q3 and explicit
    1.5×IQR fence-based outlier separation, matching the spec''s explicit requirement
    for median line, quartile box, whiskers, and outliers'
  - Dynamic legend centering computed via real DOM getBBox() measurement — idiomatic,
    robust D3 technique rather than a hard-coded offset
  - Clean nested band scales (x0 outer / x1 inner) produce consistent box widths across
    every group
  - Realistic, neutral synthetic dataset (reaction-time study by task type × age group)
    with plausible domain values and a clear underlying trend
  weaknesses:
  - Two outlier points in the Combined / Older (51-70) group render almost exactly
    on top of each other, producing a slightly merged marker cluster — add a small
    deterministic horizontal jitter for outliers whose values fall within ~1% of the
    y-range of another outlier in the same box so individual points stay separable
  - Design excellence is solid but conventional — no visual-hierarchy device (e.g.
    a light annotation on the largest age-related gap) calls out the clear trend across
    task types; a small touch here would elevate data storytelling
  - Title is proportionally small relative to the canvas (~26% of width) even though
    it uses the prescribed 22px size and is fully legible — acceptable, but a touch
    more visual weight would open the typographic hierarchy more clearly
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold centered title "box-grouped · javascript · d3 · anyplot.ai" in dark ink; a 3-item legend
