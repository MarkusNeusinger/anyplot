review:
  strengths:
  - 'First categorical series is exact brand green #009E73, and Middle/Older use canonical
    Imprint positions 2-3 (#C475FD, #4467A3) — correct since age groups are abstract
    categories with no semantic color cue'
  - 'Both plot backgrounds verified pixel-exact against tokens (#FAF8F1 light / #1A1A17
    dark); all chrome (title, axis labels, ticks, legend, grid) is theme-adaptive
    and reads cleanly in both renders'
  - 'Complete grouped box-plot anatomy: quartile box, median line, 1.5*IQR whiskers
    with caps, and outliers all present and correctly computed via d3.quantile'
  - Deterministic in-memory data via a fixed-seed LCG (seed=42) plus Box-Muller normal
    sampling — fully reproducible, no external dependency
  - 'Nice data-storytelling touch: the ''+105 ms largest age gap'' callout highlights
    the task type with the widest Young→Older shift, giving the chart a clear focal
    point beyond raw data display'
  - Median line and outlier strokes are drawn in the theme's page-background color,
    creating a 'cutout' contrast effect that works correctly in both light and dark
    without hardcoding two separate colors
  - Legend width is measured via getBBox() and the group is re-centered dynamically,
    keeping it balanced regardless of label text length
  - Consistent box widths across all groups (shared x1 band scale), no edge clipping,
    and good canvas utilization with balanced margins
  weaknesses:
  - LM-02 (Distinctive Features) is solid but not maxed out — the box/whisker/outlier
    construction and jittered outlier declustering are good use of D3's low-level
    control, but nothing here is impossible to approximate in a higher-level box-plot
    API; a small additional D3-only flourish (e.g. a violin-width overlay via d3.contourDensity,
    or per-cell tooltips wired through the accompanying HTML) would push this further
    into 'couldn't easily replicate elsewhere' territory
  - Y-axis tick labels repeat the unit ('600 ms', '500 ms', ...) even though the axis
    title already states 'Reaction Time (ms)' — a purely optional trim (e.g. bare
    numbers on ticks) would reduce minor redundancy, not required
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, verified pixel-exact at RGB(250,248,241) = #FAF8F1 — matches the required light surface, not pure white.
      Chrome: Bold dark title "box-grouped · javascript · d3 · anyplot.ai" centered at top; three-item legend (Young (18-30) green swatch, Middle (31-50) lavender swatch, Older (51-70) blue swatch) centered beneath it; dark axis titles "Task Type" (x) and "Reaction Time (ms)" (y, rotated); dark tick labels on both axes; subtle horizontal gridlines. All chrome elements are clearly legible against the light background.
      Data: 4 task-type groups (Visual, Auditory, Tactile, Combined) each containing 3 side-by-side boxes (Young/Middle/Older). First series renders in the exact brand green #009E73, second in Imprint lavender #C475FD, third in Imprint blue #4467A3. Each box shows a translucent quartile fill, a contrasting median line, whiskers with caps, and circular outlier points. A dashed callout annotation reads "+105 ms largest age gap" over the Tactile group, connecting the Young and Older box positions.
      Legibility verdict: PASS — all text reads cleanly against the light background, no overlap, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, verified pixel-exact at RGB(26,26,23) = #1A1A17 — matches the required dark surface, not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink tones (title/axis labels near-white, tick/legend text light gray), fully legible against the dark background. Gridlines are faint and unobtrusive. No dark-on-dark text anywhere — checked title, both axis titles, both tick label columns, and legend text individually.
      Data: Box colors are pixel-identical to the light render (#009E73 / #C475FD / #4467A3) — only the chrome flipped, confirmed by side-by-side comparison. The median line and outlier-point stroke use the page-background color as their stroke (near-black here vs. off-white in light), which still reads as a clear contrasting line against the more saturated box fills in both themes (verified via a 2x-zoomed crop of the Middle/Older boxes in the Tactile group).
      Legibility verdict: PASS — all text and data elements are clearly readable in the dark render; no washed-out or invisible elements found.
