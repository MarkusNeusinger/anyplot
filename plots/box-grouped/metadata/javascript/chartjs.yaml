review:
  strengths:
  - Correct, idiomatic Chart.js solution for a chart type the library has no native
    support for — an invisible grouped-bar dataset supplies per-subcategory x-positions/widths,
    and an afterDatasetsDraw plugin hand-draws the box/whisker/outlier geometry, exactly
    matching the library prompt's sanctioned 'no external plugin' pattern
  - 'Full, correct box-plot statistics: a real quantile function for Q1/median/Q3,
    proper 1.5x IQR whisker computation, and genuinely injected outliers that exercise
    the outlier-detection logic rather than faking it'
  - 'Fully theme-adaptive: Imprint data colors (#009E73 / #C475FD / #4467A3) are pixel-identical
    between light and dark, while chrome (ink, grid, page background, outlier halo
    stroke) correctly flips per theme'
  - Deterministic LCG + Box-Muller PRNG (fixed seed) drives a realistic, neutral 'quarterly
    performance rating by department and experience level' scenario with genuine per-group
    spread variation
  - Legend built via a custom generateLabels callback so swatches reflect the palette
    colors used by the hand-drawn box glyphs, correctly working around the fact that
    the underlying bar datasets are invisible
  weaknesses:
  - 'Native tooltip is fully disabled (tooltip: { enabled: false }) instead of being
    configured with a custom callback that surfaces the box''s Q1/median/Q3/outlier
    values — a missed opportunity to use Chart.js''s signature interactive strength
    in the HTML detail view'
  - Title ('box-grouped · javascript · chartjs · anyplot.ai') fills only ~35% of plot
    width, well under the ~50-70% guideline, since no optional descriptive prefix
    was added; a short prefix (e.g. 'Department Performance by Experience Level ·
    ...') would both fill the title area better and strengthen the data story
  - 'Design is competent but conventional: all three experience-level groups get equal
    visual weight and nothing calls attention to the clear ''seniority correlates
    with rating'' pattern that is already present in the data, keeping Design Excellence
    short of publication-ready'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "box-grouped · javascript · chartjs · anyplot.ai" and a 3-item legend (Junior/Mid-level/Senior) sit at the top in dark ink; x-axis "Department" with 4 category labels (Engineering, Sales, Marketing, Support) and y-axis "Quarterly Performance Rating" with numeric ticks 0-120 are both dark and clearly legible; subtle horizontal gridlines only (no vertical grid).
      Data: 4 departments x 3 experience-level box-and-whisker groups per department (12 boxes total). First series (Junior) is #009E73 brand green, second (Mid-level) is lavender #C475FD, third (Senior) is blue #4467A3 — canonical Imprint order. Each box shows a dark median line, quartile box, whisker caps, and several individually plotted outlier dots (e.g., two low Junior outliers in Engineering, one high Mid-level outlier in Sales, one low Mid-level outlier in Support).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend, axis titles, and tick labels all render in light/white ink, fully legible; gridlines are subtle light horizontal lines only.
      Data: Same 12 box groups in the identical hue set (#009E73 green / #C475FD lavender / #4467A3 blue) as the light render — only the fill's alpha-blended appearance shifts slightly against the darker backdrop (expected consequence of compositing a semi-transparent fill over a different background, not a hue change); median lines switch to white/light ink and outlier-dot halo strokes switch to the dark page color, both correctly theme-adaptive.
      Legibility verdict: PASS — no dark-on-dark failures; every tick label, axis title, and legend entry is clearly visible against the near-black surface.
