review:
  strengths:
  - 'Correct grouped box plot structure: 4 departments x 3 experience-level subgroups,
    side-by-side with consistent box widths across all groups'
  - Outliers correctly computed via 1.5*IQR fences and rendered with distinct fill/border
    styling matching each subcategory color
  - 'Deterministic LCG-based data generation with a realistic performance-score scenario:
    sensible variance pattern where Senior has higher median and narrower spread than
    Junior across every department'
  - 'Imprint palette compliance: Junior (first series) is #009E73, Mid/Senior use
    canonical palette positions 2/3, and both light and dark renders use theme-correct
    chrome with identical data colors'
  - 'Smart x-axis labeling: only the middle subcategory tick per department cluster
    is labeled, avoiding clutter while still identifying each group'
  - Explicit font sizing throughout (title 22, legend 16, axis labels 14-16) and good
    canvas utilization (~85% width) with balanced margins
  weaknesses:
  - Y-axis label 'Performance Score' is descriptive but omits an explicit unit/scale
    indicator (e.g. 'Performance Score (0-100)') — VQ-06 dock
  - Box statistics (quantile/boxStats helper functions) are computed manually, reinventing
    what echarts.dataTool.prepareBoxplotData already provides natively for box-plot
    data prep — using the built-in utility would be more idiomatic and reduce code
    duplication (LM-01, CQ-01)
  - Design is a well-configured, thoughtful default (elevated-bg box fill + colored
    border, subtle single-axis grid) but still short of a genuine data-storytelling
    flourish — e.g. a subtle annotation calling out the spread narrowing / median
    rising from Junior to Senior would strengthen DE-01/DE-03 without adding fake
    interactivity
  - Legend swatches are implemented via separate empty scatter series as a workaround
    for boxplot's legend limitation — functional, but doesn't showcase a feature genuinely
    distinctive to echarts (LM-02); consider leaning into an echarts-specific capability
    (e.g. tooltip formatter richness, visualMap, or toolbox) to differentiate from
    other libraries' box plots
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-grouped · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend below title with three colored rect swatches (Junior/Mid/Senior) in dark ink text. Y-axis title "Performance Score" (rotated) and tick labels (0-100 in steps of 20) in a slightly softer ink tone. X-axis shows one department label (Engineering, Sales, Marketing, Support) centered under each cluster of three boxes. Horizontal grid lines are faint but visible; no vertical grid lines.
      Data: Each department has three side-by-side box-and-whisker plots — Junior (green #009E73), Mid (purple/lilac), Senior (blue) — with a cream-colored (elevated background) fill and a thick colored border, a median line inside, whiskers, and colored outlier dots (visible for Engineering/Support Junior, Sales Mid, Support Senior). All box widths are visually consistent across groups.
      Legibility verdict: PASS — all title, legend, and axis text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in white/light text against the dark background, fully legible. Y-axis title and tick labels in a lighter soft-gray tone, also legible. X-axis department labels are white and clearly visible. Grid lines remain faint but visible against the dark surface.
      Data: Same three box colors (green/purple/blue) and outlier markers as the light render — data colors are identical between themes, confirming only chrome flipped. Box fill uses a dark elevated background shade, distinct from the page background, with colored borders standing out clearly.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text (title, legend, axis labels, tick labels) is clearly readable against the dark background, and the brand green remains vivid on both surfaces.
