review:
  strengths:
  - Idiomatic use of Makie's boxplot! with dodge/dodge_gap/gap to build a correctly
    grouped box plot, rather than manually offsetting positions.
  - 'Full statistical feature coverage: median line, IQR box, 1.5*IQR whiskers, and
    outlier points all present and clearly rendered, matching the spec''s notes exactly.'
  - Theme-adaptive chrome (backgroundcolor, titlecolor, spine colors, grid alpha,
    legend colors) is threaded consistently through Figure/Axis/Legend for both themes,
    with identical data colors (green/lavender/blue) between light and dark renders.
  - 'Legend accurately reflects the subgroup-to-color mapping (Junior/Mid-Level/Senior
    -> #009E73/#C475FD/#4467A3) with a clean, frameless PolyElement legend.'
  - Realistic, neutral synthetic data (quarterly performance scores by department
    and experience level) with sensible baseline/bonus structure and clamped 20-100
    range.
  weaknesses:
  - Y-axis label 'Performance Score' is descriptive but has no units — e.g. 'Performance
    Score (0-100)' would earn full VQ-06 marks instead of the partial 'descriptive
    without units' tier.
  - 'Data storytelling is fairly flat: the experience-tier trend (Junior < Mid-Level
    < Senior in every department) is real but unemphasized — a subtle annotation or
    highlight on the standout group (e.g. Senior Engineering''s high median) would
    sharpen the focal point.'
  - Library usage is correct and idiomatic but stays within the standard boxplot!
    + dodge recipe — no more distinctive Makie capability (e.g. layered geoms, custom
    recipes) is demonstrated to earn top Library Mastery marks.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "box-grouped · julia · makie · anyplot.ai" in bold near-black text at the top, clearly readable. Y-axis title "Performance Score" and tick labels (50-100) in dark/soft-dark ink, fully legible. X-axis category labels (Engineering, Sales, Marketing, Support) in soft-dark ink, legible. Subtle horizontal gridlines only, no vertical gridlines. Top and right spines removed; left/bottom spines in soft ink. Legend "Experience Level" (Junior/Mid-Level/Senior) at right, frameless, readable dark text.
      Data: Three box-and-whisker groups per department in Imprint green (#009E73, Junior), lavender (#C475FD, Mid-Level), and blue (#4467A3, Senior). Each box shows a dark median line, IQR box, whiskers, and small colored outlier dots. First categorical series (Junior) is confirmed brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title in bold near-white text, clearly readable. Y-axis title and tick labels in light ink, fully legible. X-axis category labels in soft-light ink, legible. Gridlines subtle but visible against the dark background. Spines/legend colors correctly flipped to light tones; legend text (Experience Level, Junior/Mid-Level/Senior) is light-colored and readable.
      Data: Box colors are identical to the light render (green #009E73, lavender #C475FD, blue #4467A3) — only chrome (background, text, grid, median-line color which is theme-ink) has flipped. Median lines render as white against the colored boxes, remaining visible on every box including the darker blue Senior boxes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible against the near-black background.
