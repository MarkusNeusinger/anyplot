review:
  strengths:
  - Idiomatic use of Makie's boxplot! with dodge/dodge_gap/gap to build a correctly
    grouped box plot with consistent widths
  - 'Full statistical feature coverage: median line, IQR box, 1.5*IQR whiskers, and
    outlier points all present, matching the spec notes exactly'
  - 'New bracket! annotation calls out the standout department (Sales: Senior +17
    vs Junior), giving the chart a clear storytelling focal point and demonstrating
    a distinctive Makie capability'
  - Y-axis label now includes units ("Performance Score (0-100)"), directly addressing
    the prior review's VQ-06 feedback
  - Theme-adaptive chrome threaded consistently through Figure/Axis/Legend/bracket,
    with identical data colors between light and dark renders
  - Realistic, neutral synthetic data (quarterly performance scores by department
    and experience level) with a sensible clamped range and plausible experience-tier
    progression
  weaknesses:
  - The dodge_x() helper function (mirroring Makie's internal dodge formula to position
    the bracket) is a deviation from strict KISS single-script style, though justified
    by the annotation feature it enables
  - Title occupies only ~22% of canvas width — noticeably below the 50-70% comfortable
    range, since no descriptive prefix was added to the mandated title string; a short
    descriptive prefix would improve visual hierarchy without harming legibility
  - Library usage is still centered on the standard boxplot!+dodge+bracket! combination;
    other distinctive Makie features (e.g. rainclouds, custom recipes) remain unused
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Bold near-black title "box-grouped · julia · makie · anyplot.ai" clearly readable at top center. Y-axis label "Performance Score (0-100)" (with units) and tick labels (60/80/100) render in soft-dark ink; x-axis category labels (Engineering, Sales, Marketing, Support) legible in soft-dark ink. Subtle horizontal-only gridlines, top/right spines removed. A bracket annotation reading "Sales: Senior +17 vs Junior" sits mid-plot in soft-dark ink with a dark-ink label, clearly readable.
      Data: Three side-by-side boxes per department in Imprint green (#009E73, Junior), lavender (#C475FD, Mid-Level), and blue (#4467A3, Senior). First series is confirmed brand green. Each box shows a dark median line, IQR box, whiskers, and small colored outlier dots. Frameless "Experience Level" legend at right with matching swatches.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Title, y-axis label, tick labels, x-axis category labels, bracket annotation text, and legend all flip to light ink and remain clearly readable against the dark background. No dark-on-dark failures observed — median lines render in light ink and stay visible against every box color, including the darker blue Senior boxes.
      Data: Colors are identical to the light render (green/lavender/blue) — only chrome (background, text, grid, median-line ink, bracket ink) flips, confirming theme-adaptive tokens are correctly threaded through, including the new bracket annotation.
      Legibility verdict: PASS
