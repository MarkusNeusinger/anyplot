review:
  strengths:
  - All font sizes explicitly set (title 66, axis 56, ticks/legend 44, values 36)
    — title, axis labels, tick labels, and legend are all crisp and readable in both
    themes.
  - 'Correct grouped box plot: 9 boxes (3 treatment arms x 3 age groups) side-by-side
    with distinct colors, consistent box widths, and median/IQR box/whiskers/outliers
    all shown.'
  - Realistic clinical-trial dataset with genuine dose-response (Placebo < Low Dose
    < High Dose) and age-attenuation effects, plus deliberately placed outliers (non-responders
    and exceptional responders) so DQ-01 feature coverage is satisfied.
  - Clean legend-dedup technique — `labeled_groups` set plus `chart.add(None, values)`
    — produces exactly one legend entry per age group instead of 9 duplicate entries.
  - Theme-adaptive chrome (PAGE_BG/INK/INK_MUTED) correctly threaded into the Style
    object for both `plot-light.png` and `plot-dark.png`.
  - Uses pygal's distinctive `box_mode="tukey"` whisker-calculation option rather
    than the generic default.
  weaknesses:
  - 'Title is ''box-grouped · pygal · anyplot.ai'' but the mandated format is ''{spec-id}
    · {language} · {library} · anyplot.ai'' — the ''python'' language segment is missing.
    Fix: title="box-grouped · python · pygal · anyplot.ai".'
  - 'Box fills use opacity=0.85, which alpha-composites against the page background
    rect. Because PAGE_BG differs between themes (#FAF8F1 near-white vs #1A1A17 near-black),
    the same Imprint hex renders visibly lighter/pastel in the light PNG and visibly
    darker/deeper in the dark PNG — the data colors are not perceptually identical
    across themes as required. Fix: raise opacity closer to 1.0 (e.g. 0.95-1.0) so
    the composited color stays close to the source hex in both themes, or keep opacity_hover
    for interactivity but reduce the base fill''s dependence on background blending.'
  - Outlier dots (dots_size=6) read quite small relative to the box/whisker scale
    at 3200x1800 — bump slightly (e.g. 8-10) for better visibility without crowding.
  - Design Excellence is at the 'well-configured default' tier — grid/whitespace/legend
    are clean but there is no additional visual hierarchy or emphasis beyond the ordered
    treatment-arm grouping (e.g. no annotation or callout highlighting the dose-response
    trend).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-grouped · pygal · anyplot.ai" in dark ink, clearly visible; axis titles "Treatment Arm" (x) and "Symptom Improvement Score" (y) in dark ink; tick labels dark and legible; subtle dashed horizontal gridlines at each y-guide; legend at bottom with three swatches (Under 40 / 40-59 / 60+) in dark text.
      Data: 9 box plots grouped into 3 clusters (Placebo, Low Dose, High Dose), each cluster containing 3 side-by-side boxes colored green (#009E73, Under 40), lavender (#C475FD, 40-59), and blue-gray (#4467A3 blended with the light background at opacity 0.85, 60+). Median line, IQR box, whiskers, and small circular outlier markers are all visible (e.g. a high outlier near 84 in Low Dose/Under 40, low outliers near 0 in several Placebo boxes). Dose-response trend (higher dose -> higher score) and age-attenuation (older groups score lower within each arm) are both visually apparent.
      Legibility verdict: PASS — no text is light-on-light; all chrome is fully readable against the off-white surface.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, tick labels, and legend text all render in light ink (near-white/light-gray) and are clearly legible against the dark surface; gridlines are subtle light dashed lines; no dark-on-dark text found.
      Data: Same 9-box layout and same underlying data as the light render. The hue identity per subgroup is preserved (green/lavender/blue-gray), but because box fills use opacity=0.85 composited over the page background, the perceived color is noticeably darker/deeper in this render than the pastel appearance in the light render (most visible on the green "Under 40" boxes, which read as a deep forest green here vs. a pale mint green in the light PNG). This is a theme-consistency issue distinct from chrome — see Weaknesses.
      Legibility verdict: PASS for text readability; FLAG for data-color consistency (opacity blending shifts the apparent series color between themes, see VQ-07 weakness).
