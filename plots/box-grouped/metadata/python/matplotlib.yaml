      Chrome: Title "box-grouped · python · matplotlib · anyplot.ai" is dark ink, bold-ish, clearly visible at top center. "Department" (x-axis) and "Performance Score (0-100)" (y-axis) labels are dark ink and fully readable. Tick labels (department names, y-axis numbers 0-100) are legible grey-ink text. Subtle horizontal gridlines only. Legend "Experience Level" (Junior/Mid-Level/Senior) sits top-right in a light elevated box with dark-ink text, fully within canvas bounds.
      Data: Four department groups (Support, Marketing, Engineering, Sales — sorted by descending median), each with 3 side-by-side boxes. First series (Junior) is Imprint green #009E73, second (Mid-Level) is lavender #C475FD, third (Senior) is blue #4467A3 — matches Imprint palette positions 1-3. Median lines are dark, mean markers are small white diamonds with dark edges, outlier points appear as small circles in their series color (e.g. purple dot near 100 in Engineering/Mid-Level, blue dot near 65 in Engineering/Senior, purple dot near 35 in Sales/Mid-Level).
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels render in light off-white ink, tick labels in a softer light grey — all clearly legible against the dark surface. Median lines switch to white for contrast against the darker box fills. Legend box uses a dark elevated fill (#242420-like) with light text, fully visible and readable.
      Data: Same three series colors as the light render — #009E73 (Junior), #C475FD (Mid-Level), #4467A3 (Senior) — confirmed identical positions/hues across both themes; only the chrome (background, text, grid, legend frame, median-line color) flips. Outlier and mean markers are positioned identically to the light render.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly visible against the near-black background.
