review:
  strengths:
  - Correct grouped box plot with all required statistical elements (median line,
    IQR box, 1.5×IQR whiskers, and genuine outliers) and consistent box widths across
    every group
  - 'Full theme-adaptive chrome — both light (#FAF8F1) and dark (#1A1A17) renders
    are clean and legible, with identical Imprint data colors (#009E73, #C475FD, #4467A3)
    for the three experience levels'
  - 'Realistic, neutral data: employee performance scores by department and experience
    level, with per-group variance and real outliers rather than uniform, look-alike
    groups'
  - Departments sorted by descending overall median score, giving the chart a clear
    best-to-worst narrative
  - 'Clean, KISS-structured code: seeded RNG, only used imports, no deprecated boxplot
    API usage'
  - Distinct mean (diamond) vs. median (line) markers add statistical insight beyond
    a bare boxplot, and box edges are explicitly stroked with INK_SOFT for contrast
    against low-saturation fills
  weaknesses:
  - Mean-marker (diamond, markersize=3.5) and outlier flier markers (markersize=4)
    render at only ~19-22px on the 3200px canvas and shrink to ~2-3px at the 400px
    mobile preview width — barely visible at that scale. Increase to markersize ~6-8
    for the mean diamond and ~6-7 for fliers so they stay legible when scaled down.
  - 'Design Excellence is close to baseline: beyond the mandated theme tokens, category
    sorting, and mean/median distinction, there is little additional aesthetic differentiation
    (typography is all default weights/sizes, no focal-point emphasis on the standout
    group). Consider a subtle emphasis technique (e.g. a light annotation or callout
    on the top department, or varied spacing/rhythm between groups) to sharpen the
    data storytelling and visual polish.'
  - Legend sits close to the region where several boxes/whiskers reach the y=100 ceiling
    — comfortable now, but tighten ylim headroom or reposition the legend so future
    data regenerations with taller whiskers don't crowd it.
