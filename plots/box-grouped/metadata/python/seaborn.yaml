review:
  strengths:
  - Correct grouped box plot with clean quartile/whisker/outlier rendering and consistent
    box widths (width=0.7) across all 16 region/season groups
  - Distinctive mean-diamond overlay (showmeans + meanprops) adds a second statistic
    beyond the median without cluttering the chart
  - Theme-adaptive chrome is fully threaded through rc params, tick_params, spines,
    and legend facecolor/edgecolor — both light and dark renders are clean and readable
  - 'Correct Imprint palette in canonical order with first series #009E73, identical
    data colors across both themes'
  - Legend placed outside the axes via bbox_to_anchor so it never collides with the
    West/Summer boxes
  - Realistic, neutral weather dataset with sensible regional/seasonal temperature
    deltas and genuine outliers
  weaknesses:
  - Outlier flier markers (fliersize=4) and mean-diamond markers (markersize=5) are
    on the small side for a 3200x1800 canvas — style guide recommends elements ~2-3x
    larger than library defaults; at mobile scale (~400px) these risk becoming near-invisible
    dots. Consider fliersize~6-7 and meanprops markersize~7-8.
  - Data storytelling stays at a default level — the plot displays clean comparative
    data but doesn't add an ordering device or callout (e.g., sorting regions by mean
    temperature, or annotating the South/Summer high) to give the viewer an immediate
    takeaway.
  - Visual refinement is solid (grid/spine adjustments) but fairly standard rather
    than exceptionally polished — box edge styling and mean-marker treatment don't
    go much beyond a well-configured baseline.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with spec, not pure white.
      Chrome: Title "box-grouped · python · seaborn · anyplot.ai" is dark ink, clearly readable, spans ~70-75% of plot width. X-axis label "Region" and y-axis label "Temperature (°C)" are dark ink at similar size. Tick labels are soft gray, all readable. Legend ("Season": Winter/Spring/Summer/Fall) sits outside the plot to the right in an elevated cream box with dark text — fully legible, not clipped.
      Data: Four regions (North, South, East, West) on the x-axis, each with four side-by-side boxes (Winter/Spring/Summer/Fall) colored in Imprint order — Winter #009E73 (green), Spring #C475FD (lavender), Summer #4467A3 (blue), Fall #BD8233 (ochre). Median lines, IQR boxes, whiskers, small circular outliers, and white-edged black mean diamonds are all visible. Box widths are consistent across all groups.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with spec, not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light ink/off-white and remain fully readable against the dark background — no dark-on-dark text observed. Grid lines are faint and visible. Legend box has flipped to the dark elevated fill with light text and a light border, fully legible.
      Data: Same four box colors as the light render (Winter green #009E73, Spring lavender, Summer blue, Fall ochre) — confirmed identical across themes; only the chrome (background, text, grid, legend box) flipped. Mean diamonds keep their white edge against the dark box fills, still clearly visible.
      Legibility verdict: PASS
