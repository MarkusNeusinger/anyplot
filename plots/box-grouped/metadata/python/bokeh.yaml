review:
  strengths:
  - Correct manual grouped box-plot construction — segments for whiskers/caps, vbar
    for the quartile box, and correctly computed 1.5*IQR whisker bounds with outliers
    plotted separately
  - Consistent box widths (0.22) across all category/subcategory combinations, with
    distinct Imprint-palette colors assigned in canonical order (Junior=#009E73, Senior=#C475FD,
    Lead=#4467A3)
  - Theme-adaptive chrome fully threaded through title, axes, grid, legend, and median-line
    color — both renders are legible and data colors are identical between light and
    dark
  - 'Data-driven DE-03 annotation: an Arrow + Label call out the department with the
    largest Junior→Lead score gap, computed from the actual medians rather than hardcoded
    — creates a real focal point instead of generic color coding'
  - Bokeh-distinctive HoverTool with four tooltip fields (Department, Level, Median,
    Q1–Q3) wired to the box renderers in the HTML artifact — genuine library-specific
    interactivity, doesn't affect the static PNG
  - Legend clearly separated to the right with an elevated background panel, border,
    and appropriately sized text
  - Realistic, neutral synthetic data (department x experience-level performance scores)
    with plausible outliers for visual interest
  weaknesses:
  - Aesthetic sophistication is solid but not exceptional — alpha-blended fills and
    a styled legend panel are the main flourishes; further typographic hierarchy or
    a more distinctive color treatment would push DE-01 higher
  - Visual refinement stops at the subtle dashed grid and borderless outline; no further
    refinement (e.g. finer grid weight variation, more deliberate whitespace rhythm)
    beyond that baseline
  - calc_boxplot_stats is a small standalone helper function rather than fully inlined
    KISS-style code — acceptable given the repeated per-group percentile math, but
    still noted for CQ-01
  image_description: |-
