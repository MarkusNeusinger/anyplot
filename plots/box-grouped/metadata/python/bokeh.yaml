      Data: Box fill colors are identical to the light render (green/purple/blue-gray Imprint values), confirming only chrome flipped. Median lines flip to white/light for contrast against the fills. No dark-on-dark failures anywhere — title, ticks, legend text, and annotation are all light-on-dark and legible.
