      Data: Three boxes per department (Sales, Engineering, Marketing, Support) in Imprint canonical order — green #009E73 (Junior), purple #C475FD (Senior), blue-gray #4467A3 (Lead) — each with a dark median line, whisker stems/caps, and outlier circles. The annotation arrow's start point sits just right of the Sales-Junior outlier dot with a small visible gap, no overlap.
