review:
  strengths:
  - Correct manual grouped box-plot construction — segments for whiskers/caps, vbar
    for the quartile box, and correctly computed 1.5*IQR whisker bounds with outliers
    plotted separately
  - Consistent box widths (0.22) across all category/subcategory combinations, with
    distinct Imprint-palette colors assigned in canonical order (Junior=#009E73, Senior=#C475FD,
    Lead=#4467A3)
  - Theme-adaptive chrome fully threaded through title, axes, grid, legend, and median-line
    color (INK/INK_SOFT/PAGE_BG/ELEVATED_BG) — both renders are legible and data colors
    are identical between light and dark
  - Legend clearly separated to the right with an elevated background panel, border,
    and appropriately sized text
  - Realistic, neutral synthetic data (department x experience-level performance scores)
    with plausible outliers for visual interest
  weaknesses:
  - Design storytelling is generic — no annotation or emphasis calling out a notable
    pattern (e.g., the clear Junior->Lead score progression); a subtle highlight would
    strengthen DE-03
  - Library-mastery usage is fairly standard bokeh (ColumnDataSource + vbar/segment
    + manual Legend); consider adding a HoverTool to the HTML artifact for a distinctive
    bokeh-specific touch (does not affect the PNG, but would raise LM-02)
  - calc_boxplot_stats is a small standalone helper function rather than fully inlined
    KISS-style code — acceptable given the repeated per-group percentile math, but
    noted for CQ-01
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-grouped · python · bokeh · anyplot.ai" is bold dark text, centered, clearly readable. X-axis label "Department" and Y-axis label "Performance Score" are dark and legible in italic. Tick labels (department names, y-axis numbers 30-110) are a softer dark gray, all readable. Grid lines are subtle dashed horizontal lines. Legend (top right, "Junior"/"Senior"/"Lead") sits in an off-white elevated panel with a thin border, clearly legible.
      Data: Three box plots per department (Sales, Engineering, Marketing, Support), each with a distinct fill: green (#009E73, Junior), purple (#C475FD, Senior), blue-gray (#4467A3, Lead). Median lines are dark/black, clearly visible against the fill colors. Whiskers, caps, and outlier circles (matching subcategory color with a dark outline) are all visible and correctly positioned.
      Legibility verdict: PASS — all text is readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light/white tones, clearly visible against the dark background. Grid lines are subtle dashed lines, visible but unobtrusive. Legend panel uses a dark elevated background with a light border and light text, fully legible.
      Data: Same three box colors as the light render — green, purple, blue-gray — confirming Imprint palette colors are identical between themes (only chrome flipped). Median lines flip to white/light, clearly visible against the colored box fills (no dark-on-dark). Outlier circles remain visible with light outlines.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black background.
