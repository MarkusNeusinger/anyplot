review:
  strengths:
  - Mean-diamond overlay (geom_point with position_dodge, shape=18) cleanly separates
    the median (box line) from the mean as two distinct visual summaries
  - 'Imprint palette applied correctly: first series #009E73, canonical order, identical
    data colors between light/dark renders'
  - Canvas dimensions correct (3200x1800 landscape), title format exactly matches
    the mandated pattern
  - Clean, reproducible, KISS-structured code with correct save/move convention for
    lets-plot-images/ output
  weaknesses:
  - 'Dark render only shows four bright vertical lines spanning the full panel height
    at department-group boundaries, absent from the light render at the same coordinates
    (pixel-verified). panel_grid_major_x is blanked but panel_grid_minor_x is not,
    so theme_minimal()''s default minor-grid color is left un-themed -- invisible
    against light #FAF8F1 but strikingly visible against dark #1A1A17. Fix: add panel_grid_minor_x=element_blank()
    (and panel_grid_minor_y=element_blank() for safety) to the theme(...) block.'
  - 'Design Excellence is solid but not top-tier: no additional annotation or emphasis
    beyond the mean-diamond overlay to push data storytelling further'
