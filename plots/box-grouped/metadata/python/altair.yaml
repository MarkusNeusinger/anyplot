review:
  strengths:
  - Department order is sorted by descending Senior-level median score, giving the
    grouped comparison a clear best-to-worst takeaway (Engineering > Marketing > Sales
    > Support) instead of arbitrary alphabetical order
  - 'Correct grouped-box construction via xOffset with all required box-plot elements:
    median line, IQR box, 1.5*IQR whiskers, and outlier points'
  - Imprint palette applied in canonical order (Junior=#009E73, Mid=#C475FD, Senior=#4467A3)
    with an ink-colored median stroke and styled outlier markers (size=28, strokeOpacity=0.7)
    for extra polish
  - Theme-adaptive chrome fully threaded through configure_view/configure_axis/configure_title/configure_legend;
    both renders keep identical data colors and only flip chrome
  - Mandated title format exact, axis labels descriptive with units (%), reproducible
    via np.random.seed(42), and canvas correctly padded to 3200x1800 without cropping
  weaknesses:
  - 'Legend (''Experience Level'', orient=''top-left'') visually collides with the
    Engineering group — the tallest group in the sorted order. The Mid (purple) box''s
    upper whisker/outlier near score ~97-100 is rendered mostly hidden behind the
    opaque legend panel, with only a sliver poking above the ''Experience Level''
    text. Since departments are now sorted with the highest-scoring group first, a
    top-left legend guarantees overlap with the tallest whiskers. Fix: move the legend
    outside the plot area (default right-side orient, or orient=''right'') or reduce/relocate
    it so it never sits over the first group''s data envelope.'
  - Design excellence is solid but still fairly close to library-default altair box
    plot styling (default grid look, default L-shaped axis frame) beyond the required
    palette/theme tokens and median/outlier tweaks — a bit more custom visual hierarchy
    (e.g. subtle annotation calling out the best-performing group, or tighter grid
    opacity) would elevate it further.
  - Distinctive-feature usage is functional (xOffset grouping, custom outlier/median
    styling) but doesn't lean on any altair-unique capability beyond what's needed
    for a standard grouped box plot.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light-theme page surface — not pure white.
      Chrome: Title "box-grouped · python · altair · anyplot.ai" in bold dark ink, centered, clearly legible. X-axis title "Department" and Y-axis title "Performance Score (%)" in bold dark ink. Tick labels (department names, 0-100 score ticks) in medium-gray ink, all readable. Subtle horizontal gridlines only (y-axis), ~10% opacity, don't compete with data. Legend "Experience Level" with green/lavender/blue swatches for Junior/Mid/Senior sits inside the plot, top-left, on an elevated off-white panel.
      Data: Four departments (Engineering, Marketing, Sales, Support) each with three side-by-side boxes (Junior=green #009E73, Mid=lavender #C475FD, Senior=blue #4467A3). Each box shows a dark median line, IQR box, whiskers to 1.5*IQR, and small hollow circle outliers where present. Departments are ordered by descending Senior median (Engineering highest, Support lowest), giving a clear best-to-worst reading.
      Legibility verdict: PASS overall, with one caveat — the legend panel partially occludes the top whisker/outlier of the Engineering "Mid" box (near score ~97-100); only a small sliver of that mark is visible above the legend title text. All primary chrome (title, axis labels, ticks, legend text) is otherwise fully readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark-theme page surface — not pure black.
      Chrome: Title, axis titles, and tick labels flip to light ink (#F0EFE8 primary / #B8B7B0 secondary) and remain clearly legible against the dark background — no dark-on-dark text anywhere. Gridlines remain subtle. Legend panel flips to the dark elevated fill (#242420) with light text, fully readable.
      Data: Identical box colors and layout to the light render (green/lavender/blue, same department order, same statistics) — confirms only chrome flipped between themes, not data colors. Median line/outlier stroke uses the light ink token in dark mode, so it stays visible against the colored boxes.
      Legibility verdict: PASS overall, with the same caveat as the light render — the legend panel similarly occludes part of the Engineering "Mid" box's top whisker/outlier mark. No dark-on-dark or unreadable-text issues found.
