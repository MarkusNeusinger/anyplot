review:
  strengths:
  - Bars sorted descending by importance (highest at top) exactly as the spec requires,
    achieved via the reversed-array trick for Highcharts' bottom-up 'bar' category
    order.
  - 'Sequential color gradient (Imprint imprint_seq, #009E73 -> #4467A3) mapped to
    each bar''s importance value, matching the spec''s explicit request for a gradient
    tied to magnitude — and it is identical across light/dark renders.'
  - Importance values shown as bold text annotations at the end of each bar for precision,
    per spec notes.
  - Realistic, neutral loan-default-risk feature set (credit score, DTI, income, ...)
    with importances that sum to exactly 1.000 like real sklearn/XGBoost feature_importances_
    output — excellent factual correctness.
  - 'Both themes fully readable: warm off-white / near-black backgrounds, correct
    ink/inkSoft/grid token usage, no dark-on-dark or light-on-light failures.'
  - Clean, deterministic, dependency-free code with explicit font sizes throughout
    and no fake interactivity.
  weaknesses:
  - 'Per-bar color is computed manually with a hand-rolled hexToRgb/lerpColor pair
    instead of Highcharts'' native continuous-coloring pattern (chart-level colorAxis
    with stops + series.colorKey, as shown in prompts/library/highcharts.md''s own
    colorAxis example). This works visually but skips the library''s distinctive built-in
    mechanism for exactly this ''color mapped to a continuous value'' case — replace
    the manual lerp with colorAxis stops = [[0, t.seq[0]], [1, t.seq[1]]] and colorKey:
    ''y'' on the series.'
  - 'The vertical axis baseline (x=0 line, lineColor: t.inkSoft) stays visible as
    a residual spine — consider hiding it (lineWidth: 0) for a fully spine-free, more
    polished look.'
  - No visual callout distinguishes the single dominant feature (Credit score) beyond
    its color/length — a subtle annotation or emphasis (e.g. a short label like 'Top
    predictor') would push the storytelling from good to excellent.
  - The optional std/error-bar feature from the spec notes is omitted entirely; not
    required, but showing it (even for a subset) would better demonstrate ensemble-importance
    variability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-feature-importance · javascript · highcharts · anyplot.ai" in bold dark ink at top, subtitle "Gradient-boosted model · predicting loan default risk" in softer gray beneath it. Y-axis shows 12 feature-name categories (e.g. "Credit score", "Debt-to-income ratio", ... "Verification status"), x-axis shows a numeric "Relative importance" scale from 0 to 0.25 with light vertical gridlines. All text is dark and clearly legible against the light background.
      Data: 12 horizontal bars sorted descending by importance from top (Credit score, 0.238) to bottom (Verification status, 0.023). Bar color forms a sequential gradient from brand green (#009E73) at the lowest values to a blue tone (~#4467A3) at the highest value — the top bar (Credit score) is visibly the most blue/distinct. Bold black data-label text shows the precise importance value (e.g. "0.238") just past the end of each bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis structure as the light render, now rendered in light/white text against the dark background — fully legible, no dark-on-dark issues found on title, subtitle, axis ticks, or axis title.
      Data: Same 12 bars, same sort order, and the gradient colors are pixel-identical to the light render (green at low end transitioning to blue at Credit score) — only the chrome (background, text, gridlines) flipped for the theme. Data-label text switches from black in light mode to white in dark mode and remains clearly readable against both the dark background and the bar fills.
      Legibility verdict: PASS
