review:
  strengths:
  - Sequential imprint_seq gradient (t.seq[0] -> t.seq[1]) mapped to importance value
    gives an at-a-glance sense of magnitude beyond bar length alone, exactly matching
    the spec's 'light to dark gradient' guidance
  - Value labels rendered at the end of each bar via a native afterDatasetsDraw plugin
    (no external dependency), satisfying the spec's precision-annotation requirement
    cleanly
  - 'Clean theme-adaptive chrome: explicit font sizes throughout, spines/borders removed
    (borderWidth: 0), y-axis grid hidden, x-axis grid subtle -- both light and dark
    renders are fully legible with identical data colors'
  - 14 features (within the spec's 10-30 recommendation), realistic housing-model
    context (King County-style), deterministic in-memory data, correct title format
  weaknesses:
  - 'Sort direction is inverted relative to the spec: the code comment states features
    are ''sorted ascending so the highest importance ends up at the top,'' but Chart.js
    horizontal bar charts (indexAxis: ''y'') render labels[0] at the TOP by default.
    Since `features` is sorted ascending (lowest importance first), the rendered chart
    shows the LOWEST importance at top and the HIGHEST (''Living area (sqft)'', 0.187)
    at the BOTTOM -- the opposite of the spec''s explicit ''Sort bars by importance
    value (highest at top)'' requirement. Fix: sort `features` descending by importance
    (or reverse the labels/values/barColors arrays after the ascending sort) so the
    highest importance renders at the top.'
  - 'Design Excellence is solid but not yet publication-tier: the gradient is a nice
    touch but the overall composition (title, spacing, bar treatment) still reads
    close to a well-configured default rather than a distinctive, custom-designed
    chart -- consider a stronger focal treatment for the top feature(s) (e.g. a subtle
    highlight or emphasis on the single most important feature) to sharpen the storytelling.'
  - Y-axis has no axis title (feature names are self-explanatory, so this is minor,
    but adding one such as 'Feature' would round out VQ-06/axis completeness).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "bar-feature-importance · javascript · chartjs · anyplot.ai" centered at top in dark ink, clearly readable. X-axis title "Importance (Gini)" and tick labels (0, 0.05, 0.10, 0.15, 0.20) in soft dark gray, readable. Y-axis feature-name labels (14 categories, e.g. "Waterfront view", "Living area (sqft)") in dark ink, all fully legible with no truncation or overlap. Subtle vertical gridlines on the x-axis only; y-axis has no gridlines.
      Data: 14 horizontal bars sorted by importance value, each labeled with its precise numeric value (e.g. "0.012", "0.187") in dark text just past the bar end. Bars use a sequential green-to-blue gradient keyed to importance: the smallest bars are pure Imprint green (#009E73) and the color shifts toward blue as importance increases, with the largest bar ("Living area (sqft)", 0.187) rendered in the darkest blue-green. Bars are ordered with the LOWEST importance at the top and the HIGHEST at the bottom of the chart.
      Legibility verdict: PASS (all text clearly readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis title, and tick labels now rendered in light/white text, clearly legible against the dark background. No dark-on-dark text anywhere -- title, axis labels, tick labels, and value-label annotations are all light-colored and readable. Gridlines are faint and unobtrusive.
      Data: Identical bar order, lengths, and gradient colors to the light render -- the green-to-blue sequential gradient is pixel-identical between themes, confirming only chrome (background/text/grid) flipped, not data colors.
      Legibility verdict: PASS (no dark-on-dark failures; all text and data elements clearly visible).

    Cross-theme check: Data colors (the sequential green-to-blue gradient) are identical between light and dark renders; only background, text, and grid color flipped as expected.
