      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "bar-feature-importance · javascript · chartjs · anyplot.ai" centered at top in dark ink, clearly readable, spans well under 90% of width. X-axis title "Importance (Gini)" and tick labels (0, 0.05, 0.10, 0.15, 0.20) in soft dark gray, readable. Y-axis title "Feature" and 14 feature-name labels (e.g. "Waterfront view", "Living area (sqft)") in dark ink, all fully legible with no truncation or overlap. Subtle vertical gridlines on the x-axis only; y-axis has no gridlines.
      Data: 14 horizontal bars sorted by importance value, HIGHEST at the top ("Living area (sqft)", 0.187) and LOWEST at the bottom ("Waterfront view", 0.012) -- correct per spec. Each bar is labeled with its precise numeric value in dark text just past the bar end; the top bar's label is bold (700 weight) vs. regular (500) for the rest, and the top bar carries a thin dark-ink border, creating a clear focal point. Bars use a sequential green-to-blue gradient keyed to importance: smallest bars are Imprint green (#009E73), shifting toward blue as importance increases.
      Legibility verdict: PASS (all text clearly readable against the light background; no clipping at title, value labels, or axis titles).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
