      Data: Identical bar order (highest at top), lengths, and gradient colors to the light render -- the green-to-blue sequential gradient and the top-bar bold label / border emphasis are pixel-identical between themes, confirming only chrome (background/text/grid) flipped, not data colors.
      Legibility verdict: PASS (no dark-on-dark failures; all text and data elements clearly visible).

    Cross-theme check: Data colors (the sequential green-to-blue gradient, the ink-colored top-bar border) are identical between light and dark renders; only background, text, and grid color flipped as expected.
