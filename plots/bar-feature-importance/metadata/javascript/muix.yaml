review:
  strengths:
  - 'The sequential Imprint ramp (#009E73 → #4467A3) is applied through the axis-level
    continuous colorMap on the value axis, so color and bar length encode the same
    importance and the weakest bar (Residual Sugar, brand green) stays clearly distinct
    from both page backgrounds.'
  - Bars are sorted descending from a zero baseline with every feature name written
    out in full in a 210 px y-axis band; nothing is truncated.
  - Native barLabel with barLabelPlacement 'outside' prints each value at the end
    of its bar in bold ink, and the x max is padded by 10 % so the 0.200 label of
    the longest bar fits inside the plot.
  - 'Clear typographic hierarchy: 22 px semibold title, 15 px inkSoft subtitle computed
    from the data (feature count, lead feature and its 1.4× ratio over the runner-up),
    15–16 px axis text; all chrome uses theme tokens and flips correctly in dark mode.'
  - 'A realistic scenario: impurity-based Random Forest importances for the 11 UCI
    Wine Quality features that sum to exactly 1.000, with Alcohol on top as in the
    real dataset.'
  - Grid limited to vertical value lines, y ticks disabled, rounded bar corners; skipAnimation
    set, and native MUI X tooltips (valueFormatter) add exact values in the HTML view.
  weaknesses:
  - 'Suggestion: the spec''s optional std error bars (centered on each bar end, as
    the Notes recommend for ensemble methods) would show importance variability across
    trees.'
  - 'Suggestion: the y-axis title ''Feature'' restates what the category names already
    make obvious; dropping it would free horizontal space for the bars.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "Wine Quality Random Forest · bar-feature-importance · javascript · muix · anyplot.ai" top-left (~57 % of width), soft-grey subtitle "11 features, sorted by importance · Alcohol leads at 0.200, 1.4× Sulphates"; y-axis title "Feature" (rotated), x-axis title "Importance (mean decrease in impurity)", x ticks 0.00–0.22 at 0.02 steps, subtle vertical grid lines, left and bottom axis lines. All text dark and readable.
      Data: 11 horizontal rounded bars sorted descending (Alcohol 0.200 at top, Residual Sugar 0.043 at bottom), colored along the Imprint sequential ramp from brand green #009E73 (smallest) to blue #4467A3 (largest); bold value labels at each bar end, none clipped or overlapping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and feature names all flip to light ink and read clearly; grid lines subtle dark grey but visible; no dark-on-dark text anywhere.
      Data: bar colors identical to the light render (same green → blue ramp); value labels render in light ink and stay readable; brand green remains vivid on the dark surface.
      Legibility verdict: PASS
