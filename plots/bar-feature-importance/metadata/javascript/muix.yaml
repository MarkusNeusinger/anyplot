review:
  strengths:
  - Correct Imprint sequential gradient (brand green → blue via t.seq[0]/t.seq[1])
    applied through xAxis colorMap keyed to the importance value — the right continuous-data
    palette choice per the style guide.
  - Bars sorted descending by importance (highest at top) exactly as the spec requires,
    with a single-series legend correctly hidden as redundant.
  - Deterministic, realistic wine-quality random-forest feature-importance data (11
    features, values summing to ~0.96, plausible relative magnitudes).
  - Both light and dark renders are correctly theme-adaptive — title/axis/tick text
    and grid lines stay legible on both surfaces, and the data gradient colors are
    identical between themes.
  - 'Idiomatic MUI X usage: band-scale yAxis for horizontal bars, generous left margin
    (190px) sized for the longest feature name, barLabel with 3-decimal precision,
    and skipAnimation correctly set for the static screenshot.'
  weaknesses:
  - Value labels (barLabel) are centered inside each bar rather than placed 'at the
    end of bars' as the spec's Notes section explicitly recommends — right-aligning
    the labels just past the bar tip (with a small offset, switching to inside-end
    placement for the longest bar so it doesn't overflow) would better match the spec
    guidance and read more clearly as a precision annotation rather than a bar-fill
    label.
  - Design excellence is solid but fairly close to library defaults — system typography,
    a single dashed-grid touch, and the colorMap gradient are the only customizations.
    A more distinctive treatment (e.g. a subtle callout/annotation on the top feature,
    refined font pairing, or a soft background band separating the top feature) would
    raise the design ceiling.
  - The optional std/error-bar feature called out in the spec (valuable for ensemble-method
    importability) is omitted entirely; not required, but including it (even as a
    simple errorBar-style overlay) would materially increase data quality/feature
    coverage for this spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "bar-feature-importance · javascript · muix · anyplot.ai" in bold dark ink, top-left. X-axis label "Importance Score" and 11 y-axis feature-name tick labels, all in dark, clearly readable. Subtle dashed vertical gridlines aligned to the x-axis ticks (0.00-0.20).
      Data: 11 horizontal bars sorted descending by importance (Alcohol 0.192 at top down to Residual Sugar 0.041 at bottom). Bar fill follows the Imprint sequential gradient (t.seq[0]=brand green -> t.seq[1]=blue) mapped to the importance value: the top bar (Alcohol) renders distinctly blue, the next two bars are teal, and the remaining shorter bars cluster toward green since their values sit in the lower part of the domain. Each bar has a bold, dark-text value label (e.g. "0.192") centered inside the bar.
      Legibility verdict: PASS - all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title, axis label, and 11 feature tick labels, rendered in light ink (near-white), fully legible against the dark background. Same subtle dashed vertical gridlines, now in a light, low-opacity tone.
      Data: Same 11 bars in the same sorted order with identical fill colors to the light render (blue top bar down through green lower bars), confirming the data colors are theme-independent. Bar value labels are white/light text centered inside each bar and read clearly against the colored bar fills.
      Legibility verdict: PASS - no dark-on-dark failures; all title/axis/tick text and bar labels are clearly visible against both the dark page background and the colored bar fills.
