review:
  strengths:
  - Hand-built error-bar renderer (custom series + renderItem) compensates for ECharts
    having no native error-bar type — low/high caps and connecting line are geometrically
    correct and clip-free
  - Continuous visualMap correctly ties bar color to importance magnitude using the
    Imprint sequential colormap (t.seq), matching the spec's request for a light-to-dark
    gradient encoding relative contribution
  - Data is sorted ascending bottom-to-top so the category axis naturally puts the
    highest-importance feature at the top, exactly as the spec requires
  - 'Realistic, internally consistent telco-churn feature-importance dataset: importances
    sum to 1.0, std values scale sensibly with magnitude, and the domain ordering
    (contract length, tenure, charges dominating) matches real-world churn modeling
    intuition'
  - Precision value labels anchored past the high error-bar cap so they never collide
    with the bar or error whiskers regardless of std width
  - Theme chrome (background, ink, grid, tick/legend text) is fully token-driven and
    correctly flips between the light and dark renders while the data gradient stays
    identical
  weaknesses:
  - Design stays close to a conventional horizontal bar layout; beyond the value-driven
    color gradient there is no additional visual-hierarchy device (e.g. subtitle,
    callout on the top driver) that would push it into top-tier storytelling
  - Grid/whitespace refinement is good but not maximal — a touch more breathing room
    between the visualMap legend and the x-axis title would tighten the bottom margin
    further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bar-feature-importance · javascript · echarts · anyplot.ai" is bold dark text, centered at top. X-axis title "Relative importance" and percentage tick labels (0%-35%) are dark-gray and clearly legible. Y-axis feature names (Contract Length ... Partner Status) are dark-gray, fully readable, no truncation. Bottom "Low"/"High" visualMap legend labels are dark and legible against the light bar.
      Data: 12 horizontal bars, sorted descending by importance (Contract Length 27.2% at top down to Partner Status 1.3% at bottom). Bars are colored on a continuous green-to-blue gradient (Imprint sequential palette) keyed to importance magnitude — low bars are brand green (#009E73-ish), high bars shift to blue. Black error-bar whiskers with caps show the std range on every bar, and a precision percentage label sits just past each bar's high cap.
      Legibility verdict: PASS — no dark-on-light or light-on-light issues anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, tick labels, and the "Low"/"High" legend labels are all rendered in light/off-white text, clearly legible against the dark background. No dark-on-dark text anywhere.
      Data: Same 12 bars in the same order and same green-to-blue gradient as the light render — the data-color mapping (positions of the sequential scale) is pixel-identical to light; only the chrome (background, text, error-bar stroke color, grid) flipped to light-on-dark. Error-bar whiskers are now white/light-colored for contrast against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; brand-anchored green end of the gradient still reads clearly on the dark surface.
