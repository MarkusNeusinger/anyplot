review:
  strengths:
  - 'Correctly uses the Imprint sequential colormap (t.seq = #009E73 → #4467A3) mapped
    to importance value via d3.scaleSequential/interpolateRgbBasis, exactly satisfying
    the spec''s required ''sequential color gradient mapped to importance values''
    feature'
  - 'Full feature set from the spec: bars sorted descending by importance (highest
    at top), std-based error bars with end caps, and precise value-label text annotations
    at the end of each bar'
  - Explicit, well-balanced typography hierarchy (title 22px, axis label 16px, ticks
    14px, value labels 15px with tabular-nums) that stays legible in both themes and
    at the 400px mobile preview size
  - 'Realistic, factually coherent data: telecom-churn-model feature names with importances
    that sum to exactly 1.0 and decrease monotonically, matching real RandomForest/GBM
    feature_importances_ output'
  - 'Idiomatic modern D3 v7: selection.join() data binds for bars/error-bars/labels,
    scaleBand/scaleLinear/scaleSequential, no fake interactivity, no animations'
  weaknesses:
  - 'Spine treatment is inconsistent: the y-axis domain line is removed but the x-axis
    domain line is kept, rather than committing to a clean L-shape or a fully spine-free
    look'
  - The color gradient is redundant with bar length/position but nothing calls special
    attention to the top feature (e.g. a subtle callout or emphasis on 'Monthly Charges')
    — solid but not exceptional data storytelling
  - The sequential coloring and hand-built error-bar caps are competent D3 usage but
    not deeply distinctive to D3 specifically (a colorAxis-driven bar chart could
    be approximated in other charting libraries too)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "bar-feature-importance · javascript · d3 · anyplot.ai" in bold dark ink, centered near the top. X-axis "Feature Importance (Gini)" label below the axis in soft ink. Y-axis shows 10 feature names (Monthly Charges down to Senior Citizen) in dark tick text, right-aligned against the bars. Subtle vertical gridlines tied to the x-axis ticks. All text is clearly readable against the light background.
      Data: 10 horizontal bars sorted descending by importance, colored with a continuous gradient from blue (highest importance, "Monthly Charges") through teal to green (lowest importance, "Senior Citizen") — this is the Imprint imprint_seq gradient (#009E73 → #4467A3) applied by value, not a categorical multi-series palette. Each bar has a horizontal error-bar line with end caps (std) in soft ink, followed by a tabular-nums value label (e.g. "0.243").
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, axis label, and tick labels, now rendered in light ink (near-white/soft-gray) against the dark background. Gridlines remain subtle. No dark-on-dark text observed.
      Data: Same 10 bars with the identical blue→teal→green gradient and identical bar lengths/values as the light render — only the chrome (background, text, grid) flipped, exactly as required. Error-bar strokes and caps remain visible and legible against dark bg.
      Legibility verdict: PASS.
