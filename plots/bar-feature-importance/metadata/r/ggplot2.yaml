review:
  strengths:
  - Grid-opacity weakness from the previous review is fully resolved -- panel.grid.major.x
    now uses INK_MUTED (faint, theme-adaptive) instead of full-opacity INK, visibly
    subtler in both renders
  - Correctly sorts bars by importance descending (highest, Credit Score, at top)
    exactly as the spec's Notes require
  - 'Uses the imprint_seq sequential gradient (#009E73 -> #4467A3) mapped to the continuous
    importance value, with the fill legend correctly hidden since it''s redundant
    with bar length'
  - 'Implements every optional spec feature: error bars from the std column (geom_errorbar)
    and precise importance value text labels at each bar end (geom_text)'
  - 'Both themes render correctly and consistently: identical data colors between
    light/dark, theme-adaptive chrome, exact 3200x1800 canvas, no edge clipping'
  - Realistic, neutral domain data (loan-default gradient-boosting feature importances)
    with reproducible generation via set.seed(42) and clean, unused-import-free code
  weaknesses:
  - 'Composition is solid but conventional: a color-mapped geom_col + geom_errorbar
    + geom_text combination without a distinctive ggplot2-specific technique that
    would lift Library Mastery beyond generic usage'
  - 'Design tradeoff worth reconsidering: mapping importance to imprint_seq puts the
    single most important feature (top bar) in blue rather than brand green -- technically
    correct per the sequential colormap direction, but a viewer''s instinct is often
    to expect the brand color to mark the standout bar'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correctly not pure white.
      Chrome: Title "bar-feature-importance · r · ggplot2 · anyplot.ai" in dark ink at top, comfortably sized (~50% of plot width, no overflow). X-axis title "Feature Importance" below the axis. 15 horizontal bars with feature-name tick labels on the left (Credit Score down to Inquiries (6mo)), sorted by importance descending. Thin vertical gridlines at 0.00/0.10/0.20/0.30 render in a faint muted-ink tone -- subtle, not competing with the data (the previous full-opacity-INK gridline weakness is fixed). All titles, axis labels, and tick labels are clearly legible against the light background.
      Data: Bars use the imprint_seq sequential gradient, running from brand green (#009E73) for low-importance bars at the bottom to blue (#4467A3) for the top (highest-importance, Credit Score) bar. Grey error-bar whiskers show +/- std, and dark ink text labels give the precise importance value (e.g. "0.221") at the end of each bar/whisker.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correctly not pure black.
      Chrome: Same title, axis title, and 15 feature tick labels now rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary tick text) -- fully legible against the dark background, no dark-on-dark failures observed. Vertical gridlines now render in the light ink token at the same faint, subtle prominence as the light render.
      Data: Bar colors are pixel-identical to the light render (green-to-blue gradient, same positions) -- only the chrome (background, text, grid, error-bar color) flipped as required. Error-bar whiskers use the ink_soft token adapted to dark chrome and remain clearly visible.
      Legibility verdict: PASS.
