review:
  strengths:
  - 'Native bokeh field transform `fill_color={"field": IMPORTANCE, "transform": LinearColorMapper(...)}`
    maps the imprint_seq ramp (built with bokeh''s own `interp_palette`) straight
    onto the bar values, so color and bar length tell the same ranking, with the weakest
    bar in brand green #009E73, clearly distinct from the page in both themes'
  - Error bars use bokeh's native `Whisker` annotation, centered on each bar end and
    drawn in the INK token so they stay visible against every step of the gradient
    in both themes
  - Value labels sit just past the further of bar end and whisker tip (computed from
    the data with `np.fmax`), so every label is clear of its error bar and nothing
    collides
  - Sorting is data-driven (`sort_values` plus a categorical y_range built from the
    sorted names), so the highest importance lands on top and all twelve feature names
    are written out in full
  - Theme tokens are threaded through every chrome element; both renders are fully
    readable, and the data colors are identical between light and dark
  - Realistic credit-risk random-forest scenario whose importances sum to exactly
    1.000, as Gini importances do
  weaknesses:
  - 'Suggestion: add a bokeh `HoverTool` showing feature, importance and std in the
    HTML output; it costs nothing in the PNG and is bokeh''s distinctive strength.'
  - 'Suggestion: the x-range headroom past the 0.2 tick (up to about 0.23) leaves
    a band of empty plot on the right; trimming the 1.12 factor slightly would tighten
    the layout while keeping the 0.185 label clear.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no pure white.
      Chrome: title "bar-feature-importance · python · bokeh · anyplot.ai" top-left in dark ink at about half the width; twelve full feature names on the y axis in soft dark ink; x ticks 0–0.2 and the axis title "Importance score" readable; subtle vertical x-grid only, no tick marks, left and bottom axis lines in INK_SOFT.
      Data: twelve horizontal bars from a zero baseline, sorted with Income (0.185) on top and Account Balance (0.016) at the bottom, colored along imprint_seq from brand green #009E73 (weakest) to blue #4467A3 (strongest); thin dark ±std whiskers centered on each bar end, visible over both the bar fills and the page; value labels (0.185 … 0.016) just past each whisker tip, no overlaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title in light ink, feature names and tick labels in light soft ink, axis title light; no dark-on-dark text anywhere; grid faint but visible.
      Data: bar colors identical to the light render (same green-to-blue ramp); whiskers flip to light ink and read well on every bar and on the page; value labels in light soft ink, all readable.
      Legibility verdict: PASS
