review:
  strengths:
  - Bars sorted with the highest importance at the top by sorting ascending and letting
    bokeh's bottom-up categorical y_range place Income first; every feature name is
    written out in full beside its bar
  - 'Sequential imprint_seq gradient (brand green #009E73 for the weakest feature
    to blue #4467A3 for the strongest) built with interp_palette and applied through
    a LinearColorMapper field transform, so color and bar length tell the same ranking;
    the weakest green bar stays distinct from the page in both themes'
  - Error bars use bokeh's native Whisker annotation in the INK token, centered on
    each bar end and visible against every step of the gradient in both themes
  - Value labels via LabelSet are positioned past the whisker tip (max of bar end
    and upper whisker), so each 3-decimal value stays clear of its error bar
  - 'Theme tokens thread through all chrome: title, axis label, tick labels, axis
    lines and the 15 % x-grid read correctly on #FAF8F1 and #1A1A17'
  - Realistic credit-risk feature set with plausible RandomForest-style importances
    summing to 1.0
  weaknesses:
  - 'DE-02 (dark): a 1 px gray (#535350) frame line runs along the top and right edges
    of the plot area, so the dark render shows a box where the light render shows
    open top/right edges → no visible top/right frame in either theme. Likely cause:
    the seam between border_fill and background_fill at the frame boundary; set p.outline_line_alpha=0
    together with min_border padding, or match p.background_fill_color and p.border_fill_color
    through the same token and check the screenshot edge.'
  - 'DQ-02 (both): ''Payment History'' ranks 11th of 12 at 0.032 in a credit-risk
    model, where payment history is usually among the strongest predictors, which
    makes the ranking read as arbitrary → give Payment History an importance near
    the top (about 0.14–0.17) and keep the values summing to 1. Likely cause: the
    IMPORTANCE list order in the data block.'
  - 'Suggestion: a HoverTool listing feature, importance and std would add detail
    to the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: left-aligned title "bar-feature-importance · python · bokeh · anyplot.ai" in dark ink (~half the width); y-axis feature names (Income … Account Balance) and x ticks 0–0.2 in soft dark gray; x-axis title "Importance score"; subtle vertical x-grid only; left and bottom axis lines; no ticks. All text readable.
      Data: 12 horizontal bars from 0, sorted highest (Income 0.185) at top to lowest (Account Balance 0.015) at bottom; gradient from brand green #009E73 (weakest) to blue #4467A3 (strongest); black ±1 std whiskers centered on bar ends; values in 3 decimals placed right of each whisker tip.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis title in light ink, ticks and feature names in light gray — no dark-on-dark text; x-grid subtle. A faint 1 px gray frame line is visible along the top and right of the plot area (not visible in the light render).
      Data: bar colors identical to the light render; whiskers flip to light ink and stay visible on every gradient step; value labels light gray and readable.
      Legibility verdict: PASS
