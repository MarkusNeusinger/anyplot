review:
  strengths:
  - Single native barh call draws the sorted bars, std error bars (xerr, error_kw,
    capsize) and edge outlines, with value labels placed past each error-bar cap
  - imprint_seq gradient from brand green (least important) to blue (most important)
    mapped to the importance values, so color and length tell the same ranking in
    both themes
  - Theme tokens thread through title, labels, ticks, value labels, spines, grid and
    error bars; both renders fully legible on the canonical 3200x1800 canvas
  - Column constants and a Data block ending in one tidy df make the code adaptable
    to a user's own importance table
  weaknesses:
  - 'Suggestion: a bolder weight or INK color on the top feature''s value label could
    give the head of the ranking a focal point without adding a layer'
