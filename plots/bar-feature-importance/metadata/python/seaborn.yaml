review:
  strengths:
  - Sequential imprint_seq gradient (green -> blue) mapped through Normalize to importance,
    so color and bar length tell the same ranking, with the weakest bars still distinct
    from the page in both themes
  - Value labels are placed past each error-bar cap, so every label is clear of its
    error bar and matches its bar's value
  - Error bars drawn in the INK token stay visible on every gradient step in both
    themes
  - 'Idiomatic seaborn: tidy df with column constants, hue=FEATURE with a per-level
    dict palette and legend=False, theme tokens via sns.set_theme rc'
  - Exact 3200x1800 canvas with default bbox; theme-correct chrome in both renders
  weaknesses:
  - 'DQ-02 (both): in a credit-default model ''Previous Defaults'' ranks last at 0.007,
    below ''Marital Status'' and ''Savings Balance'', which reads implausible for
    the domain → place it among the top features (for example swap it with ''Annual
    Income'' or ''Payment History'') and leave a genuinely weak feature at the tail.
    Likely cause: the order of the features list against raw_importance.'
  - 'Suggestion: a slightly heavier weight on the top three value labels could pull
    the eye to the dominant features without adding a layer.'
