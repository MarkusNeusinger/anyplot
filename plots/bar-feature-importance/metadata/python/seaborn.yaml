review:
  strengths:
  - 'Sequential imprint_seq gradient (#009E73 → #4467A3) is mapped to the importance
    values through a Normalize, so color and bar length tell the same ranking, and
    the weakest green bars stay distinct from the page in both themes'
  - Value labels are placed past the end of each error bar (bar_end + 1 % of the range),
    so every label is clear of its whisker, and error bars drawn in the INK token
    stay visible against every step of the gradient in both renders
  - 'Idiomatic seaborn 0.13: sns.barplot with hue=FEATURE and a per-name palette dict
    with legend=False, theme chrome via sns.set_theme rc, sns.despine for the spines'
  - Realistic credit-default random-forest scenario with full feature names; importances
    normalized to sum to 1, sorted highest at top
  weaknesses:
  - 'VQ-01 (both): the bar-end value labels are set at 7 pt, smaller than the 8 pt
    tick labels, and blur to about 4 px when the render is scaled to the 400 px thumbnail
    → 8 pt to match the ticks (+1 pt). Likely cause: ax.text(..., fontsize=7) on line
    112.'
  - 'CQ-04 (code): `spread = np.fmax(ranked[STD], 0)` (line 81) is a no-op — the std
    values are drawn from uniform(0.005, 0.025) and are never negative → delete the
    line and compute `bar_end = ranked[IMPORTANCE] + ranked[STD]`. Likely cause: defensive
    clamp left from a draft.'
  - 'Suggestion: the y-axis title "Feature" repeats what the feature names already
    say; dropping it would give the long names more room.'
