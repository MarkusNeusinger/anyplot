review:
  strengths:
  - Native go.Bar error_x draws the ensemble std centered on each bar end, visible
    against every gradient step in both themes
  - Value labels are placed from the data (importance + std + a gap scaled to the
    axis reach) so every label clears its whisker
  - Axis range and label gap derive from the data, and the column constants with a
    pd.notna guard keep the file adaptable
  - 'Theme tokens thread through every chrome element: no dark-on-dark text, warm
    page colors in both renders'
  - hovertemplate gives the HTML view the exact importance per feature
  weaknesses:
  - 'VQ-07 (both): the importance gradient is an opacity ramp of #009E73 toward the
    page color (alpha 0.3-1.0), not one of the two allowed continuous colormaps →
    map importance onto imprint_seq (#009E73 → #4467A3). Likely cause: the colors
    list built from rgba(0, 158, 115, 0.3 + 0.7 * share).'
  - 'Suggestion: the 10 px value labels could take a slightly darker ink than the
    ticks so the precise numbers stand out from the axis chrome.'
