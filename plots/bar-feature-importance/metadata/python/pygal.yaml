review:
  strengths:
  - 'Correct imprint_seq ramp (#4467A3 -> #009E73) mapped per bar through pygal''s
    value dicts, so colour and length tell the same ranking in both themes'
  - Canonical 3200x1800 canvas with explicit font sizes; title, feature names and
    ticks read clearly in both themes
  - Bars sorted with the highest on top and every feature name written out in full
    (truncate_label=-1)
  - Interactive HTML output with pygal's native hover tooltips alongside the PNG
  weaknesses:
  - 'VQ-02 (both): every value label is centred on the end of its bar, so about half
    of each number ("0.287", "0.231", "0.154" …) sits on the bar fill and half on
    the page, with the bar''s edge cutting through the digits → place the label fully
    past the bar end (about +40 px to the right) so it clears the bar. Likely cause:
    print_values_position="top" on HorizontalBar anchors the text at the bar end;
    use a value_formatter with a leading space or a custom print_values_position/offset
    that starts the text after the bar.'
  - 'Suggestion: the 0.000 tick is drawn as a pygal major label at 44 px while the
    other x ticks use 56 px; matching major_label_font_size to label_font_size would
    make the axis read evenly.'
  - 'Suggestion: pygal tooltips could carry the full feature name and value for the
    HTML view.'
