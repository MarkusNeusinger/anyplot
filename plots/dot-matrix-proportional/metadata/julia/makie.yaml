review:
  strengths:
  - Legend labels bake in both count and percentage per category ("Satisfied — 168
    (56.0%)"), directly satisfying the spec's optional annotation suggestion without
    cluttering the grid itself
  - 'First categorical series is the mandated brand green #009E73, chrome (background,
    title, subtitle, legend text) flips correctly between #FAF8F1/#1A1A17 light and
    #1A1A17/#F0EFE8-ink dark with data colors held identical across themes'
  - hidedecorations!/hidespines! plus a frameless Legend produce a clean, minimal
    composition appropriate for a dot-matrix chart, with a descriptive subtitle ("300
    survey respondents, one dot per person") standing in for axis labels that would
    be meaningless on a grid-index plot
  - Dots are uniform size, evenly spaced via DataAspect(), and filled left-to-right/top-to-bottom
    by category exactly as the spec's notes require
  - 'Idiomatic Makie layout: Legend placed as a first-class fig[1,2] GridLayout element
    with colsize! tuning, rather than an overlaid legend box'
  weaknesses:
  - Grid uses n_cols=17 (near sqrt(300)) instead of a clean divisor pair of the total
    (e.g. 15x20, 20x15, 10x30) — the spec note says 'grid layout should match the
    total', and 300/17 leaves the last row incomplete (11 of 17 dots), a visible ragged
    edge at the bottom of the grid. Switch n_cols to a divisor of the total (15 or
    20) so every row is fully populated.
  - 'Categories are a clear positive/neutral/negative sentiment polarity (Satisfied/Neutral/Dissatisfied),
    which prompts/default-style-guide.md explicitly lists as a semantic-exception
    case (''Sentiment / polarity: positive→green, negative→red, neutral→muted'').
    Canonical order (green/lavender/blue) is technically compliant but a stronger
    design would map Dissatisfied to the matte-red anchor (#AE3030) and Neutral to
    the adaptive muted gray, making the majority-vs-risk story land harder at a glance.'
  - Title spans only ~47% of the plot width — under the 50–70% guideline range for
    a non-mandated-length title; a couple points of titlesize could be added since
    there's clear headroom before the legend column.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Bold dark title "dot-matrix-proportional · julia · makie · anyplot.ai" and a smaller grey subtitle "300 survey respondents, one dot per person" sit centered above the grid, both clearly readable against the light background. The "Response" legend to the right uses dark title text and dark label text on the same off-white background, fully legible.
      Data: A 17-column dot grid of 300 uniform circular markers, filled top-to-bottom/left-to-right, first ~168 dots brand green (#009E73, "Satisfied"), next 72 lavender-purple (#C475FD, "Neutral"), last 60 blue (#4467A3, "Dissatisfied"). The last row is a partial row of 11 blue dots. Legend entries show category, count, and percentage.
      Legibility verdict: PASS — no light-on-light text, all title/subtitle/legend text has strong contrast against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: The same title and subtitle now render in light ink (white/off-white for title, light grey for subtitle) against the dark background — fully readable, no dark-on-dark issue. Legend title and labels are likewise light-colored and legible.
      Data: Identical dot layout and colors to the light render — same green/lavender/blue sequence at the same counts, confirming data colors are held constant across themes; only the chrome (background, text) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome text is clearly visible against the near-black surface, and the brand green remains vivid on both surfaces.
