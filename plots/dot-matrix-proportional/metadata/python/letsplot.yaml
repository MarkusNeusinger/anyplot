review:
  strengths:
  - Exactly 100 dots on a 10x10 grid, one per patient, filled left to right and top
    to bottom so each category reads as one run out of the total
  - Legend labels carry each category's count (n=72/18/7/3), matching the dot runs,
    ordered via pd.Categorical
  - Theme tokens threaded through title, legend text and legend box; both renders
    readable, data colors identical
  - 'Data block is adaptable: column constants with role comments and a full eight-position
    Imprint list sliced per category'
  weaknesses:
  - 'Suggestion: theme the legend key background (legend_key=element_rect(fill=ELEVATED_BG))
    so the glyph column does not show as a darker strip inside the legend box, most
    visible in the dark render.'
  - 'Suggestion: percentage annotations beside the legend counts (the Notes allow
    them) would let readers read 72% directly.'
