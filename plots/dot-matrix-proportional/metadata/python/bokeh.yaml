review:
  strengths:
  - Exact 20x10 grid for 200 units, filled left to right and top to bottom, one dot
    per respondent with runs equal to the counts
  - 'Imprint palette in canonical order with #009E73 first; chrome flips cleanly between
    #FAF8F1 and #1A1A17 while data colors stay identical'
  - Legend in a right-hand Bokeh Legend panel combines label, count and share, with
    the variable name and n in its title
  - match_aspect=True keeps dots round and spacing even in both directions
  - HoverTool exposes category, count and share in the interactive HTML view
  - Compact layout computation with df.index.repeat and modulo/floor division instead
    of nested loops
  weaknesses:
  - 'VQ-05 (both): the legend box sits about 10 px from the right canvas edge while
    the right column below it is ~70% empty and the title is centred over the plot
    frame rather than the canvas → at least ~40 px clearance from the edge (+30 px).
    Likely cause: min_border_right=60 is consumed by the legend panel; raise min_border_right
    or reduce legend padding/width.'
  - 'Suggestion: the dark render shows a faint rectangular frame around the dot area
    that the light render does not; matching the frame to PAGE_BG would make the two
    themes identical in chrome.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas, not pure white.
      Chrome: bold centred title 'dot-matrix-proportional · python · bokeh · anyplot.ai' in dark ink; no axes or grid; legend panel at top right on an elevated off-white box with a soft border, italic title 'Exercise frequency  (n = 200)' and four entries 'Daily (52 · 26%)', '3–5 times/week (74 · 37%)', '1–2 times/week (46 · 23%)', 'Rarely / Never (28 · 14%)'. All text dark and readable.
      Data: 20x10 grid of 200 equal round dots: 52 brand green #009E73 (rows 1–3), 74 purple #C475FD, 46 blue #4467A3, 28 ochre #BD8233, filled left to right, top to bottom; runs end mid-row. Legend box nearly touches the right canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and legend text flip to light ink; legend box uses the elevated #242420 surface with a soft light border. A faint grey rectangle frames the dot area (not visible in light). No dark-on-dark text.
      Data: identical dot colors and layout to the light render; green #009E73 reads well on the dark surface.
      Legibility verdict: PASS
