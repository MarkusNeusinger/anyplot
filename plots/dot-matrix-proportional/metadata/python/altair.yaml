review:
  strengths:
  - Every dot is one attendee in a 10x10 grid with uniform size and spacing, filled
    left to right and top to bottom so each response forms one readable run
  - Legend labels carry each category's count ('Agree — 58'), built in pandas and
    mapped through an explicit Scale domain/range
  - Subtitle states the unit key '1 dot = 1 attendee' alongside the survey question
  - Theme tokens threaded through title, subtitle, legend card and view in both renders;
    output padded to the canonical 2400x2400 canvas
  - Native Vega-Lite tooltip per dot in the HTML output
  weaknesses:
  - 'VQ-07 (both): the ordered Likert levels Agree / Neutral / Oppose are drawn in
    categorical green #009E73, purple #C475FD and blue #4467A3, which presents them
    as unrelated groups → diverging steps in their order: Agree #009E73, Neutral in
    the muted anchor (#6B6A63 light / #A8A79F dark), Oppose #AE3030. Likely cause:
    scale range taken from IMPRINT_PALETTE[i] by position.'
  - 'VQ-05 (both): the 10x10 grid and the legend sit left-anchored under the wide
    title, leaving about 28 % of the canvas width empty to the right of the grid →
    a balanced layout with the grid centered or widened to use the space (for example
    width/height about 480 instead of 400). Likely cause: properties(width=400, height=400)
    while the title sets the bundle width, plus title anchor=''start''.'
  - 'Suggestion: the remainder color NEUTRAL ''#8C8B84'' is a custom hex; the style
    guide''s muted anchor (#6B6A63 light / #A8A79F dark) is the documented choice
    for ''other'' dots.'
