review:
  strengths:
  - Exact 10×10 grid of 100 equal dots filled left to right, top to bottom, each category
    one contiguous run whose length equals its count (24/41/35)
  - coord_fixed() keeps spacing identical in both directions and theme_void() removes
    axes and grid, matching the spec's 'position is layout, not data'
  - 'Legend built natively from scale_color_manual(labels=...) carries each category''s
    label with its count; guide_legend(override_aes={''size'': 8}) keeps the swatches
    as visible dots in both themes'
  - Neutral remainder handled in the grid via INK_SOFT 'Other' run when counts do
    not reach the total, and the data block is adaptable (category order kept via
    pd.Categorical)
  - Correct 3200×1800 canvas, mandated title with language segment, theme tokens thread
    through title, subtitle and legend in both renders
  weaknesses:
  - 'VQ-02 (both): the legend''s longest entry ''Partially Solar-Powered  (41)'' runs
    into the legend frame — its closing parenthesis touches the right border line
    → at least ~6 px of inner padding on the right. Likely cause: legend_text margin
    r=14 is applied but the legend box width is computed without it, so the frame
    hugs the text; reduce the margin or add legend_box_margin / legend_margin.'
  - 'Suggestion: the empty legend title (color="") still reserves a blank row at the
    top of the legend box; dropping the title via theme(legend_title=element_blank())
    would balance the box.'
  - 'Suggestion: percentage annotations beside the counts (24 %, 41 %, 35 %) are allowed
    by the Notes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200×1800 landscape
