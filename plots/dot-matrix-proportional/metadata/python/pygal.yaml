review:
  strengths:
  - 10x10 grid of exactly 100 dots, one per employee, in three unbroken runs filled
    left to right and top to bottom
  - Near-even dot spacing in both directions, with large dots visible in both themes
  - Theme tokens threaded through the pygal Style object; both renders theme-correct
  - pygal.XY with stroke=False and hidden guides is a compact native way to draw the
    dot grid, with interactive HTML output
  weaknesses:
  - 'VQ-05 (both): the canvas is 3600x3600, not one of the allowed sizes → 2400x2400
    square (-1200 px each way). Likely cause: width=3600, height=3600.'
  - 'VQ-01 (both): title 28 px, caption 18 px and legend 16 px read very small on
    the 3600 px canvas, far below the style guide''s source-pixel sizes (title ~66,
    labels ~56, legend ~44) → those sizes on a 2400 px canvas (legend +28 px). Likely
    cause: title_font_size=28, label_font_size=18, legend_font_size=16.'
  - 'VQ-03 (both): the legend color swatches are tiny squares next to the legend text,
    so the key between color and category is hard to see → swatches about as tall
    as the text. Likely cause: the default legend_box_size.'
  - 'SC-04 (both): the title lacks the language segment → ''Employee Work Preferences
    · dot-matrix-proportional · python · pygal · anyplot.ai''. Likely cause: the title
    string.'
  - 'CQ-01 (code): line 21 opens the Data block with no column-0 # Plot marker after
    it → one block between column-0 # Data and # Plot markers that ends by binding
    df. Likely cause: the plot code is not separated from the data generation.'
  - 'CQ-01 (code): no column constants for the required roles category, count, total
    → one string constant per role above the Data block with a # role: comment. Likely
    cause: column names typed where they are used.'
  - 'CQ-01 (code): line 19 IMPRINT lists 7 of 8 positions → all eight Imprint positions
    in canonical order. Likely cause: a palette sized to the sample.'
  - 'Suggestion: the legend could show each category''s percentage beside its count,
    as the Notes suggest.'
  - 'Suggestion: the HTML tooltips could show the category and its count instead of
    raw (x, y) coordinates.'
