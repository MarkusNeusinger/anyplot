review:
  strengths:
  - Exactly 100 equal dots in a 10x10 grid, filled left to right and top to bottom,
    with each category forming one contiguous run (44 / 35 / 21)
  - Grid dimensions, the fill order and the neutral remainder are computed from df
    (np.repeat over counts plus remainder, ceil(sqrt(total)) columns), so the chart
    adapts to any total
  - ax.set_aspect('equal') keeps dot spacing identical in both directions, and page-coloured
    dot edges separate neighbours cleanly in both themes
  - 'Legend lists each category with its count out of the total in an elevated theme-adaptive
    frame; Imprint order starts with #009E73 and data colours are identical in both
    renders'
  - Canvas is exactly 3200x1800 with no bbox_inches='tight', and the mandated title
    with its descriptive prefix sits at about two thirds of the width
  weaknesses:
  - 'VQ-05 (both): the dot grid occupies only about 34 % of the canvas width and 60
    % of its height, leaving wide empty bands to the sides and above and below the
    legend, so the dots read smaller than the canvas allows → let the grid use more
    of the height (about 70–75 %, +10–15 points) by widening the axes'' vertical extent.
    Likely cause: fig.subplots_adjust(top=0.84, bottom=0.2) together with left=0.2,
    right=0.8.'
  - 'Suggestion: add percentage annotations next to the counts in the legend (the
    Notes allow them).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "Remote Work Survey · dot-matrix-proportional · python · matplotlib · anyplot.ai" in dark ink, about two thirds of the width, centred at the top. No axes, ticks or grid (correct for a layout-positioned dot matrix). Legend in one row below the grid in an off-white elevated frame with a soft-grey edge: "Hybrid — 44 / 100", "Fully Remote — 35 / 100", "In-Office — 21 / 100" in soft dark ink, all readable.
      Data: 10x10 grid of 100 equal circles. First 44 #009E73 green (rows 1–4 plus 4 dots of row 5), next 35 #C475FD purple (ending at column 9 of row 8), last 21 #4467A3 blue. Even spacing in both directions; no remainder because the counts sum to the total.
