review:
  strengths:
  - 'Grid is derived from the data: cols = ceil(sqrt(total)) and the dot size follows
    the cell, so one dot per unit with even spacing holds for any total'
  - Legend lists every category with count out of total and percentage, all computed
    from the data, under an 'Energy source (n = 100)' heading
  - Tidy dot table fed to sns.scatterplot with hue, hue_order and the Imprint palette
    sliced to the number of categories
  - Theme tokens threaded through title, legend frame, legend text and caption; both
    renders fully legible on the exact square 2400x2400 canvas
  weaknesses:
  - 'Suggestion: the legend frame could be dropped (frameon=False) to let the two-column
    key sit lighter under the grid.'
  - 'Suggestion: the gap between the last dot row and the legend could tighten so
    grid and key read as one unit.'
