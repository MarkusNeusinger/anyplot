review:
  strengths:
  - Thoughtful semantic color mapping (green=Agree, matte red=Disagree, muted gray=Undecided)
    following the style guide's sentiment/polarity exception
  - Manual legend construction elegantly sidesteps the coord_fixed()-vs-automatic-legend
    width conflict, documented inline with a clear rationale comment
  - Clean theme_void() minimal chrome with generous margins and no unnecessary grid,
    appropriate for a dot-matrix layout
  - 'Correct theme-adaptive chrome: title, legend text, and background flip correctly
    between themes while data colors stay stable (Undecided''s muted gray is intentionally
    theme-adaptive per the semantic-anchor rules)'
  - Both renders hit the exact 3200x1800 landscape canvas target
  weaknesses:
  - No percentage annotations alongside the raw counts in the legend, though the spec
    only lists this as a 'consider adding' suggestion, not a hard requirement
  - A fair band of unused whitespace sits below the grid and legend on both renders;
    slightly larger dots/spacing or a footnote could better balance the vertical canvas
    usage
  - Legend swatch dots reuse the same size=8 as the grid dots rather than a distinct
    legend-key size, which is fine but is a missed small opportunity for typographic/visual
    hierarchy
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "Customer Satisfaction Survey · dot-matrix-proportional · r · ggplot2 · anyplot.ai" is centered at top in dark ink, clearly legible. Legend header "Responses (n = 100)" is bold dark text; legend category labels ("Agree — 47", "Disagree — 33", "Undecided — 20") are medium-gray (INK_SOFT), clearly readable against the light background.
      Data: A 10x10 grid of 100 uniform dots, filled left-to-right/top-to-bottom, colored by category — green (#009E73) for Agree (47), matte red (#AE3030) for Disagree (33), muted gray for Undecided (20). Legend swatches to the right match grid dot colors and sizes exactly.
      Legibility verdict: PASS — no light-on-light text, all elements clearly distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Title and legend header render in light ink/near-white, clearly legible. Legend category labels render in a lighter gray (INK_SOFT dark variant), clearly readable against the dark background.
      Data: Same 100-dot grid with identical green/red data colors as the light render (confirming positions 1 and the semantic-red anchor are theme-stable). The "Undecided" gray dot uses a lighter gray in dark mode than in light mode — this is the muted semantic anchor, which the style guide explicitly defines as theme-adaptive, not a violation of the "data colors stay constant" rule (that rule applies to the 8 canonical Imprint categorical positions, not to the muted/neutral/amber anchors).
      Legibility verdict: PASS — no dark-on-dark text; all title, legend header, and legend label text is clearly visible against the near-black surface.
