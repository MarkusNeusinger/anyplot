review:
  strengths:
  - 'Exact 10x10 grid for a total of 100, filled left-to-right, top-to-bottom: 47
    Agreed, 35 Disagreed, 18 No opinion, verified dot by dot in the render'
  - 'Semantic color exception applied correctly: Agreed in brand green #009E73, Disagreed
    in matte red #AE3030'
  - Legend carries label, count and percentage for each category, computed from the
    data
  - 'Idiomatic MUI X v9 composition: ChartsContainer with one scatter series per category
    and hidden strict-domain axes, which gives per-dot tooltips in the HTML'
  - Grid geometry derived from the total (ceil(sqrt(total)) columns), so the layout
    adapts to other totals and adds a neutral remainder when counts fall short
  weaknesses:
  - 'SC-02 (both): the Disagreed dots carry an ink ring (light: near-black, dark:
    off-white) whose outer radius is about 20 % larger than the other dots, so the
    dots are not of one size and the Disagreed run covers visibly more area than its
    count → draw every dot at the same marker size with no ring. Likely cause: DotRingOverlay
    with ringRadius = markerSize + ringGap + ringStrokeWidth/2 for categories with
    ringed: true.'
  - 'VQ-07 (both): No opinion is filled with the inkSoft chrome token (#4A4A44 light
    / #B8B7B0 dark), not one of the Imprint colors or anchors → the muted anchor (#6B6A63
    light / #A8A79F dark). Likely cause: SEMANTIC_COLORS[''No opinion''] = t.inkSoft.'
  - 'CQ-01 (code): a second component DotRingOverlay plus the DotRingOverlayProps
    interface and ring constants (RING_GAP_SHARE, RING_STROKE_SHARE, ringedPoints,
    ringed flags, legend boxShadow) exist only to draw the rings → delete them together
    with the rings. Likely cause: the ring overlay.'
  - 'Suggestion: the legend could be MUI X''s own ChartsLegend with series labels
    carrying the count and percentage, instead of the hand-built Box legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas.
      Chrome: bold near-black title "dot-matrix-proportional · javascript · muix · anyplot.ai" centred at the top (~56% of width); centred legend row at the bottom "Agreed — 47 (47%)", "Disagreed — 35 (35%)", "No opinion — 18 (18%)" in near-black text with round swatches. No axes or grid lines. All text readable.
      Data: 10x10 grid of large evenly spaced dots. First 47 dots brand green #009E73 (four full rows plus seven), then 35 matte red #AE3030 dots, each surrounded by a thick near-black ring with a page-colored gap, making them visibly larger than the other dots, then 18 dark gray (#4A4A44) dots.
