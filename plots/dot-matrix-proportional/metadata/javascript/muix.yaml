review:
  strengths:
  - 'Exactly 100 dots on a 10x10 grid, one dot per respondent, filled left to right
    and top to bottom: Agreed runs 47 dots and ends partway through row 5, Disagreed
    35, No opinion 18. The rows are 10/10/10/10/7, then 3+10+10+10+2, then 8+10, matching
    the counts exactly'
  - 'Semantic color mapping from the style guide''s polarity exception: Agreed in
    brand green #009E73, Disagreed in matte red #AE3030, No opinion in the theme-adaptive
    muted anchor (#6B6A63 light / #A8A79F dark), so the agree/disagree split reads
    at once'
  - 'Uniform dot size from one computed cell (markerSize = 0.38 x cell) with even
    spacing in both directions, no axes and no grid lines. The axes use position:
    ''none'' and a strict domain of -0.5..n-0.5, so the grid fills the canvas without
    padding'
  - Legend gives each category's label, its absolute count and its share ("Agreed
    — 47 (47%)"), which covers both the required counts and the optional percentage
    annotation, and the numbers match the dots
  - Composes ChartsContainer + ScatterPlot from community @mui/x-charts v9 with skipAnimation,
    and builds the remainder logic (a neutral run for dots no listed category claims)
    from the records rather than typed counts
  - Chrome threads through theme tokens (t.pageBg, t.ink), so the title and legend
    text flip correctly while the data hues stay identical in both renders
  weaknesses:
  - 'VQ-01 (both): the legend text is set at 16 CSS px (about 32 px in the 2400 px
    PNG). Against dots about 160 px across, it reads small, and at the 400 px thumbnail
    it shrinks to about 5 px and blurs → about 20 CSS px (+4 px), with the swatch
    scaled to match (about 24 px). Likely cause: the legend Typography fontSize: 16
    and the swatch width/height: 20.'
  - 'DQ-02 (both): the scenario is a survey, but nothing says what was asked. "Response
    category" with Agreed / Disagreed / No opinion reads as a generic placeholder
    → name the statement, e.g. a descriptive title prefix such as "Support for a four-day
    work week · " ahead of the mandated title. Likely cause: the data block and TITLE
    carry no subject.'
  - 'Suggestion: use the native ChartsLegend (inside ChartsDataProvider/ChartsWrapper)
    with series labels that carry the count, instead of the hand-built Box/Typography
    legend, to show more of MUI X''s own composition API.'
  - 'Suggestion: add <ChartsTooltip /> to the ChartsContainer so the HTML output shows
    each dot''s category on hover.'
  - 'Suggestion: the remainder run uses t.grid as its fill, a gridline tone that may
    be too faint for dots; the muted anchor or inkSoft would keep a remainder visible
    when the data has one.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas.
      Chrome: the bold title "dot-matrix-proportional · javascript · muix · anyplot.ai" sits centered at the top in dark ink, spanning about 56% of the width. There are no axes and no grid lines. A centered horizontal legend at the bottom reads "Agreed — 47 (47%)", "Disagreed — 35 (35%)" and "No opinion — 18 (18%)" in dark ink with round swatches. All text is readable; the legend text is small relative to the dots.
      Data: a 10x10 grid of 100 equal circles with even spacing. Rows 1-4 are all green (#009E73); row 5 has 7 green and 3 red (#AE3030); rows 6-8 are all red; row 9 has 2 red and 8 muted gray (#6B6A63); row 10 is all gray. Counts match: 47 / 35 / 18. The first series is brand green.
