review:
  strengths:
  - 'Grid-fill algorithm exactly matches the spec: dots are assigned left-to-right,
    top-to-bottom in category order, verified pixel-for-pixel against the 47/34/19
    counts (row 5 correctly splits 7 green + 3 red, row 9 correctly splits 1 red +
    9 gray).'
  - 'Thoughtful semantic color mapping (Agreed -> brand green #009E73, Disagreed ->
    matte-red semantic anchor, No opinion -> theme-adaptive muted anchor) that follows
    the style guide''s documented semantic-exception pattern instead of mechanically
    applying palette order.'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white / near-black
    backgrounds, readable ink-colored title and legend text, no dark-on-dark or light-on-light
    failures, and identical data colors between light and dark.'
  - Legend doubles as a count readout ('Agreed (47)', 'Disagreed (34)', 'No opinion
    (19)'), satisfying the spec's suggestion to add count/percentage context without
    cluttering the canvas.
  - Creative but idiomatic use of Chart.js's scatter type (hidden linear scales used
    as a grid coordinate system, fixed pointRadius, page-background-colored point
    borders for dot separation) to implement a chart type Chart.js has no native support
    for, avoiding any plugin or NOT_FEASIBLE shortcut.
  weaknesses:
  - Chose total=100 with a perfectly square 10x10 grid -- the simplest possible case.
    The spec description highlights 'variable grid sizes' (e.g. 10x50 for a total
    of 500) as a distinguishing feature of dot-matrix vs. waffle charts; a non-square
    total would better showcase that flexibility.
  - Agreed vs. Disagreed rely on green vs. red hue as the sole visual distinguisher
    with no redundant shape/pattern encoding; consider a subtle shape or texture cue
    to further strengthen accessibility for this specific semantic pairing, even though
    the Imprint palette is CVD-optimized.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "dot-matrix-proportional · javascript · chartjs · anyplot.ai" is bold dark ink text, clearly legible and comfortably sized (~60% of canvas width, no clipping). Legend sits below the grid with three circular swatches and labels "Agreed (47)", "Disagreed (34)", "No opinion (19)" in dark ink text, fully readable.
      Data: A 10x10 grid of uniform circular dots. Dots are filled left-to-right, top-to-bottom: first 47 dots brand green (#009E73, "Agreed"), next 34 dots matte red ("Disagreed"), final 19 dots muted gray ("No opinion"). The category boundaries land mid-row exactly where expected (row 5 = 7 green + 3 red, row 9 = 1 red + 9 gray), confirming correct proportional counts. Each dot has a thin border matching the page background, creating clean visual separation between dots.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title and legend text render in light ink color, clearly legible against the dark background. No dark-on-dark failures observed anywhere (title, legend labels, counts all readable).
      Data: Identical dot grid and category boundaries as the light render. Data colors are pixel-identical to the light version -- brand green, matte red, and muted gray (the muted anchor itself is theme-adaptive and appropriately lighter here to stay visible against the dark surface) -- confirming only chrome flips between themes, not data colors.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no dark-on-dark or unreadable elements found.
