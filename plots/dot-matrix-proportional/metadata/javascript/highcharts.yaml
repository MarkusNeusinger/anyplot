review:
  strengths:
  - 'Semantic color mapping is exemplary: brand green (#009E73) for Satisfied, theme-adaptive
    muted ink for Neutral, and Imprint matte red (#AE3030, palette[4]) for Dissatisfied
    — a textbook application of the style guide''s sentiment/polarity semantic exception,
    and it''s documented inline in the code comments.'
  - 'Grid math is correct and matches the spec exactly: 10x10 grid for total=100,
    dots filled left-to-right/top-to-bottom sequentially across categories with no
    gaps or overlaps.'
  - 'Legend goes beyond the spec''s minimum by showing both count and computed percentage
    per category (''Satisfied: 47 (47%)''), directly satisfying the spec''s ''consider
    adding count or percentage annotations'' note.'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, correctly flipped ink/inkSoft text, transparent chart background,
    identical data colors across themes.'
  - Clean, minimal code — no axes, no grid, no superfluous options; animation disabled
    on both chart and series as required for the screenshot harness.
  weaknesses:
  - 'Design Excellence is only moderate: the chart is a grid of flat, uniformly styled
    circles with a plain legend row — competent and clean but not visually distinctive.
    Consider a touch more polish, e.g. a subtle radial highlight or size/opacity variation
    on the dots, or slightly more generous row/column gutters to let the grid breathe.'
  - Data storytelling is present but understated (sequential block-fill by category
    is the only hierarchy cue). Consider adding a small callout or bolder subtitle
    statistic (e.g. highlighting the majority/plurality category) to give the viewer
    an immediate takeaway, or add a subtle overall %-satisfied headline metric near
    the title.
  - 'Library Mastery is generic: this is a scatter series repurposed as a dot grid,
    a technique portable to almost any charting library with minimal changes. Consider
    leveraging a more Highcharts-distinctive touch — e.g. per-series dataLabels showing
    the percentage directly on the block, or useHTML-formatted legend items with inline
    mini count-bars — to better showcase Highcharts'' native capabilities within the
    core-only constraint.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "dot-matrix-proportional · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable; subtitle "Customer satisfaction survey · 100 respondents, one dot each" in soft grey, clearly readable; legend below the grid in three items with small color swatches and dark/soft text, clearly readable. No axis lines or ticks are shown (intentionally hidden, appropriate for a dot-matrix chart).
      Data: A 10x10 grid of uniform circular dots. First 47 dots (rows 1-5, sequential) are brand green (#009E73) = Satisfied; next 31 dots are muted grey = Neutral; final 22 dots are matte red = Dissatisfied. Dots are evenly spaced with a thin ring matching the page background for separation. First series is confirmed as #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle rendered in light ink/soft-grey text, both clearly legible against the dark background. Legend text is light-colored and legible. No dark-on-dark text detected anywhere.
      Data: Identical dot colors and grid arrangement to the light render — green, grey, red dots in the same positions and same hex values, confirming data colors are theme-independent. Only chrome (background, text) flipped as expected.
      Legibility verdict: PASS
