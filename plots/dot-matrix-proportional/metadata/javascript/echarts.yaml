review:
  strengths:
  - First categorical series correctly uses Imprint brand green (#009E73); the semantic
    red for the negative category and the theme-adaptive muted gray for the neutral
    category form a thoughtful, deliberate color mapping rather than a raw palette
    cycle.
  - The dashed ink border on the 'Dissatisfied' dots adds a non-color secondary cue,
    keeping the two sentiment extremes distinguishable under red-green color-vision
    deficiency.
  - The markArea highlight plus the 'Majority — 59%' label is a genuine native-ECharts
    data-storytelling touch that surfaces the key insight at a glance and showcases
    a library feature beyond a generic scatter port.
  - Legend entries embed both count and percentage per category, satisfying the spec's
    suggestion to add count/percentage annotations alongside the legend.
  - 'Theme-adaptive chrome is clean and correct in both renders: warm off-white /
    near-black backgrounds, fully legible title and legend text, identical data colors
    between themes.'
  weaknesses:
  - The 'Majority — 59%' markArea label is set at fontSize 13, which shrinks to only
    a few pixels at the ~400px mobile thumbnail and becomes illegible there, even
    though the title and legend remain readable at that size.
  - The markArea highlight rectangle only spans full grid rows (floor(118/20) = 5
    rows = 100 dots), so 18 of the 118 'Satisfied' dots (the partial 6th row) sit
    outside the highlighted region despite belonging to the same category — a slight
    visual mismatch with the '59%' label, which refers to all 118 dots.
  - Design is still fundamentally a plain grid of uniform circles; beyond the majority
    callout and dashed accent border there is limited additional visual hierarchy
    or refinement to push it into publication-grade territory.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent with the Imprint light theme.
      Chrome: Title "dot-matrix-proportional · javascript · echarts · anyplot.ai" in dark ink, centered top, clearly readable. Legend at bottom-center lists "Satisfied — 118 (59%)", "Neutral — 52 (26%)", "Dissatisfied — 30 (15%)" in soft dark gray text, fully legible. A small "Majority — 59%" label sits inside a pale green highlight box over the top-left of the grid; legible at full resolution but shrinks to unreadable at mobile thumbnail size.
      Data: A 20×10 grid of 200 uniform circles filled left-to-right, top-to-bottom. First ~118 dots are brand green (#009E73, matching the Imprint categorical position 1), next 52 are a theme-adaptive muted gray, and the final 30 are a semantic red with a dashed dark border. Non-accent dots have a subtle background-colored ring separating adjacent circles.
      Legibility verdict: PASS (all chrome text readable against the light background; only the small majority annotation degrades at mobile scale).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent with the Imprint dark theme.
      Chrome: Same title and legend text now rendered in light ink/gray, clearly readable against the dark background — no dark-on-dark failures observed. The majority highlight box is a subtle dark-green tint with a light-colored label, still legible at full size.
      Data: Identical dot colors and layout to the light render — green, gray, and red positions and hues match exactly; only the dashed border on the red dots switches from dark ink to a light color to stay visible against the dark background, and the thin rings between green/gray dots now pick up the dark page background.
      Legibility verdict: PASS (all chrome text and data markers read clearly on the dark surface; data colors confirmed identical to the light render).
