review:
  strengths:
  - Grid size (20x10=200) matches the total exactly, with dots filled left-to-right,
    top-to-bottom continuously across categories
  - 'First series correctly uses Imprint brand green #009E73; neutral/negative categories
    use the documented semantic-anchor exception order'
  - Legend shows category name, raw count, and percentage per group, satisfying the
    spec's count/percentage annotation suggestion
  - Subtle per-dot border matching the page background gives clean visual separation
    without extra chrome
  - Clean, deterministic, KISS-structured code; correct mount-node contract, animation
    disabled, canvas dimensions on target
  - Both renders pass the theme-readability check - identical data colors, fully legible
    chrome in both themes, no clipping
  weaknesses:
  - Red (Dissatisfied) vs. green (Satisfied) is the sole color-coded distinction for
    the two sentiment extremes, with no secondary encoding - a red-green CVD accessibility
    gap
  - Design stays close to a functional grid-of-circles; nothing beyond the border-separation
    touch creates additional visual hierarchy
  - Library usage is generic scatter series; no ECharts-distinctive feature (e.g.
    graphic elements, effectScatter) is used to elevate it beyond a baseline port
  image_description: |-
