review:
  strengths:
  - 'Physically accurate streamlines: paths are traced with RK4 integration of the
    actual Taylor-Green velocity field (u = sin(x)cos(y), v = -cos(x)sin(y)) rather
    than pre-baked shapes, so the closed loops are a genuine numerical solution, not
    decoration.'
  - 'Velocity is encoded twice, redundantly and correctly: line color interpolates
    along `imprint_seq` (brand green -> blue) by mean speed, and line width scales
    from 1.6 to 4 px by the same value — exactly the two optional encodings the spec''s
    Notes section calls out.'
  - Theme-adaptive chrome is correctly threaded through every element (title, axis
    names, tick labels, axis line, split lines) via `window.ANYPLOT_TOKENS`, and both
    renders share identical data colors with only chrome flipping.
  - Taylor-Green cellular flow is a well-known, neutral, textbook CFD test case —
    realistic and appropriate data for a 'basic streamline plot' spec.
  - 'Clean, dependency-free, deterministic code: no imports beyond the `echarts` global,
    no randomness, small pure helper functions (`velocity`, `speedAt`, `traceStreamline`)
    instead of unnecessary classes.'
  weaknesses:
  - 'Y-axis shows a redundant, unformatted boundary tick at full float precision —
    ''3.191592653589793'' stacked directly above the ''3'' tick (and ''-3.191592653589793''
    above ''-3'' at the bottom) in BOTH themes. This comes from setting yAxis.min/max
    to the raw constant `DOMAIN = PI + 0.05` instead of a round number, and ECharts
    labeling the exact boundary value. Fix: either round DOMAIN to a clean value (e.g.
    3.2), add `axisLabel: { formatter: (v) => v.toFixed(1) }` to the yAxis, or set
    `axisLabel: { showMaxLabel: false, showMinLabel: false }` to suppress the boundary
    tick. The x-axis does not show this artifact (its boundary label happens to get
    collision-hidden against ''-3''/''3''), so the fix only needs to target the yAxis
    config.'
  - 'No directional indicators (arrowheads or directional markers) along the streamlines
    — a defining visual feature of streamline plots that distinguishes them from plain
    closed-curve/contour drawings and is needed to show circulation direction (clockwise
    vs. counterclockwise) per cell. Consider adding a small arrow symbol at the midpoint
    of each path (e.g. via a second `lines` series with `symbol: [''none'',''arrow'']`
    and `symbolSize` at intervals, or `effect: { show: true, symbol: ''arrow'' }`).'
  - 'Field coverage is incomplete: streamlines are only seeded at four mid-radius
    offsets (0.3-1.2) per vortex cell, leaving large blank cross-shaped regions along
    the separatrices (x=0, y=0 axes) and near the cell boundaries where saddle points
    sit — an important part of the field topology described in the spec (''revealing
    flow patterns, circulation, and field topology'') is not represented. A few additional
    seeds nearer the cell boundary (e.g. radius ~1.4-1.5) would show the topology
    more completely without cluttering the interior.'
  - The four vortex cells are visually identical (same shape/size/coloring, just mirrored),
    so despite the correct physics the composition reads as one repeated tile rather
    than a single unified story — DE-03 data storytelling suffers from this mechanical
    symmetry.
  - 'Library mastery is somewhat generic: per-line color/width is computed manually
    in JS rather than leveraging any ECharts-native continuous-color machinery (e.g.
    `visualMap` piecewise/continuous mapping, or `effectScatter`/`lines` special effects),
    so the implementation doesn''t show off anything distinctive to ECharts beyond
    the basic `lines` series.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "streamline-basic · javascript · echarts · anyplot.ai" centered at top in dark bold text, clearly readable. Axis names "x" and "y" in soft gray, tick labels in soft gray on the light background, all readable. Subtle light-gray gridlines at integer intervals, plus a slightly darker axis line through x=0/y=0. The one defect: the y-axis top and bottom boundary ticks show full float precision ("3.191592653589793" / "-3.191592653589793") stacked right next to the rounded "3" / "-3" ticks — visually cluttered but still legible.
      Data: Four square-ish groups of four nested closed loops, one per quadrant (Taylor-Green vortex cells), symmetric about the origin. Innermost loops are brand-green (#009E73-ish), transitioning to a muted blue-gray for the outer loops, consistent with the imprint_seq ramp; line width also increases from inner to outer loop. No arrowheads or other directionality markers on the paths.
      Legibility verdict: PASS (all text readable; the float-precision tick is a formatting/polish defect, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in white/light text, clearly readable against the dark background. Axis names and tick labels in light gray, all readable — no dark-on-dark failures observed. Gridlines are subtle but visible; the x=0/y=0 axis line is a brighter light color for contrast. The same y-axis float-precision boundary-tick clutter reproduces here identically.
      Data: Colors are visually identical to the light render (green-to-blue-gray gradient by loop, same widths) — confirms data colors are theme-invariant and only chrome flipped.
      Legibility verdict: PASS (all text readable in both themes; same tick-formatting defect as the light render).
