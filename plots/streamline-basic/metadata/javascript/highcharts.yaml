review:
  strengths:
  - Physically grounded vector field (superposed point vortices plus ambient wind,
    softened near cores) integrated with RK4 and traced forward/backward from upstream
    seeds — genuinely computes streamlines rather than faking a flow-like shape.
  - 'The DQ-03 scale mismatch from Attempt 1 is fixed: the subtitle now reads "counter-rotating
    vortex pair" instead of "cyclone-anticyclone," so the phenomenon naming is consistent
    with the 10 km domain.'
  - Dual encoding of local speed via both Imprint imprint_seq color gradient and line
    width, directly matching the subtitle's stated encoding; verified pixel-identical
    data colors between light and dark renders.
  - Correct, well-documented workaround for Highcharts' auto-sorting on line/spline
    series (uses `scatter` + explicit `lineWidth` to preserve path order), plus a
    hover-only tooltip formatter and marker reveal that add a Highcharts-idiomatic
    interactive touch without cluttering the static PNG.
  - 'Theme-adaptive chrome correctly implemented — both renders pass the theme-readability
    checklist, backgrounds verified pixel-exact at #FAF8F1 / #1A1A17.'
  weaknesses:
  - Five helper functions (velocityAt, rk4Step, traceHalf, traceStreamline, mixHex)
    still exceed the KISS "Imports → Data → Plot → Save" shape. The RK4 field integration
    genuinely needs structure, but this is still a minor deduction.
  - The added tooltip formatter and hover-reveal markers are a nice touch but still
    fairly generic — no fully Highcharts-distinctive feature (e.g. a colorAxis-driven
    legend, drilldown, or annotations API) is showcased.
  - Only two of the 13 streamlines get meaningfully differentiated coloring at the
    extremes; most mid-range streamlines cluster tightly around similar blue/green
    tones, so the color encoding under-uses the available imprint_seq range for the
    bulk of the data.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, verified pixel-exact at RGB(250,248,241) = #FAF8F1.
      Chrome: Title "streamline-basic · javascript · highcharts · anyplot.ai" (dark ink, bold, ~34% of canvas width, well clear of edges) and subtitle "Streamlines around a counter-rotating vortex pair · color and thickness encode local speed" (soft grey) are both fully legible. Axis titles "Distance East (km)" / "Distance North (km)" and tick labels render in soft grey against the light background, clearly readable. Faint horizontal gridlines only (y-axis), subtle and non-competing. Legend at bottom center: "Slower flow" (green) / "Faster flow" (blue), both fully visible above the canvas bottom edge.
      Data: 13 streamlines trace across the domain on a green (#009E73) → blue (#4467A3) imprint_seq gradient keyed to local mean speed, with line width thickening for faster segments. Streamlines bow into deflection troughs/crests around the two implied vortex cores near x=-2 and x=2, clearly revealing the field's circulation structure.
      Legibility verdict: PASS — no light-on-light issues, no clipping at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, verified pixel-exact at RGB(26,26,23) = #1A1A17.
      Chrome: Title, subtitle, axis titles, tick labels, and legend all render in light/soft-grey ink and remain fully legible against the dark background — no dark-on-dark failures anywhere.
      Data: Confirmed via pixel sampling that streamline colors (e.g. RGB(68,103,163) blue, RGB(8,151,121) green) are identical to the light render at every sampled coordinate — only the chrome (background, gridlines, text) flips between themes, exactly as required.
      Legibility verdict: PASS — both renders pass the theme-readability checklist.
