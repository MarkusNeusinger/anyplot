review:
  strengths:
  - Physically grounded vector field (superposed point vortices plus ambient wind,
    softened near cores) integrated with RK4 and traced forward/backward from upstream
    seeds — genuinely computes streamlines rather than faking a flow-like shape.
  - Dual encoding of local speed via both color (imprint_seq gradient) and line width,
    directly matching the subtitle's stated encoding.
  - Correct, well-documented workaround for Highcharts' auto-sorting on line/spline
    series (uses 'scatter' + explicit lineWidth to preserve path order) — shows real
    understanding of a core-bundle limitation.
  - Theme-adaptive chrome is implemented correctly — both renders pass the theme-readability
    checklist with no dark-on-dark or light-on-light issues, and data colors are identical
    between themes.
  - Title format exactly matches the mandated `{spec-id} · {language} · {library}
    · anyplot.ai` string.
  weaknesses:
  - 'DQ-03: The subtitle frames this as ''wind circulation around a cyclone–anticyclone
    pair'' but the domain spans only 10 km (x: -5..5, y: -2.8..2.8) — real atmospheric
    cyclones/anticyclones operate at synoptic scales of hundreds of km. Either rename
    the phenomenon to a small-scale flow (e.g. ''vortex pair in a channel flow'' /
    ''wake eddies'') or rescale distances/units to match a synoptic system.'
  - 'LM-02: No Highcharts-distinctive capability is showcased beyond the scatter-as-path
    workaround — tooltip and mouse tracking are fully disabled (enableMouseTracking:
    false, tooltip.enabled: false) for every series. Consider leaving a light, non-cluttering
    interactive touch (e.g. a working tooltip in the HTML view) so the library''s
    strengths show through, per the JS fairness rules this won''t affect the PNG.'
  - 'CQ-01: Six helper functions (velocityAt, rk4Step, traceHalf, traceStreamline,
    hexToRgb, mixHex) go well beyond the KISS ''Imports → Data → Plot → Save'' shape.
    The RK4 field integration genuinely needs structure, but the color-mixing helpers
    (hexToRgb/mixHex) could be simplified or inlined to cut the function count.'
  - 'DE-01: Color encoding is a straight two-stop gradient between t.seq[0]/t.seq[1];
    a slightly richer multi-stop imprint_seq treatment could push the aesthetic further
    toward publication-ready.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "streamline-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Wind circulation around a cyclone–anticyclone pair · color and thickness encode local speed" in soft grey below it. X-axis "Distance East (km)" and Y-axis "Distance North (km)" titles and tick labels render in soft dark grey, clearly legible. Faint horizontal gridlines only (y-axis), no vertical clutter. Legend at bottom center with two circular swatches: "Slower flow" (green) and "Faster flow" (blue-violet).
      Data: 13 streamlines traced left-to-right across the domain, colored on a green→blue gradient by mean local speed, with line width thickening slightly for faster segments. Lines bow around two implied vortex cores near x=-2 and x=2, forming closed recirculation-bubble shapes typical of a vortex-in-a-stream flow. First/slow end of the color scale is #009E73 green as required.
      Legibility verdict: PASS — all text clearly readable, no overlap, no clipping at the canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink/soft-grey, fully legible against the dark background. Axis titles and tick labels are light-colored and readable; gridlines are faint and unobtrusive. Legend swatches and labels are legible in the dark theme.
      Data: Same 13 streamlines, identical green→blue color gradient and line-width variation as the light render — confirmed pixel-for-pixel consistent data colors, only chrome (background/text/grid) flipped.
      Legibility verdict: PASS — no dark-on-dark text, no unreadable elements; brand green remains clearly visible against the dark surface.
