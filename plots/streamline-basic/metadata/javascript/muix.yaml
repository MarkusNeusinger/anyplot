review:
  strengths:
  - Physically accurate electric dipole field lines traced with RK4 arc-length integration
    of the normalized field direction, matching the spec's electromagnetic-field-line
    application and showing both closed (looping +/- to -) and open (escaping) topology
  - Axis labels fixed from the previous generic 'x'/'y' to descriptive 'x (normalized
    distance)' / 'y (normalized distance)', resolving the prior review's VQ-06 weakness
  - Grid refined to horizontal-only with a lighter stroke, giving the field-line curves
    a cleaner, less cluttered backdrop than the previous attempt
  - Direction arrows increased from 2 to 3 per field line, better reinforcing flow
    direction and the magnitude-color gradient
  - Creative, idiomatic use of MUI X's compositional API (ChartContainer + useXScale/useYScale/useDrawingArea)
    to build a custom SVG overlay for charge markers, direction arrowheads, and a
    manual field-strength gradient legend
  - 'Both renders remain theme-correct: identical data colors between light/dark,
    chrome (background, ink, legend, charge-marker fill/text) flips appropriately
    with no dark-on-dark or light-on-light failures'
  weaknesses:
  - 'New overlap regression introduced by the axis-label fix: the rotated y-axis label
    ''y (normalized distance)'' visually crosses through the ''0.5'', ''0.0'', and
    ''-0.5'' tick labels in BOTH renders (letters overstrike the digits) — increase
    the left margin or shift the axis-label offset further left so the longer descriptive
    label no longer collides with the tick-label column'
  - Direction arrows are still only 3 per field line — a bit more density, or the
    spec's optional field-strength-driven line-width emphasis near the charges, would
    reinforce flow further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white and not dark.
      Chrome: Title "Electric Dipole Field Lines · streamline-basic · javascript · muix · anyplot.ai" is dark ink, centered, and clearly readable. X-axis label "x (normalized distance)" is dark-on-light and clearly readable below the x-axis ticks. Y-axis label "y (normalized distance)" is dark-on-light but rotated and positioned so its glyphs directly overstrike the "0.5", "0.0", and "-0.5" y-axis tick labels — those three tick numbers are visually crossed-out by the label text, a real (non-severe) overlap defect. All other tick labels, the "Field strength" gradient legend (weak/strong), and the title are unaffected and fully legible. Horizontal grid lines are light gray and subtle; no vertical grid lines (improved from the previous attempt).
      Data: Field lines run from a black "+" marker to a black "−" marker (two point charges), colored on a teal-to-blue gradient (imprint_seq) keyed to local field-strength magnitude. Three small triangular arrowheads per line (up from two in the previous attempt) show flow direction from + to −.
      Legibility verdict: PASS overall, with one localized FAIL — the y-axis label overlaps three of its own tick labels (0.5 / 0.0 / -0.5), reducing their individual legibility even though every other text element is clean.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black and not light.
      Chrome: Title, x-axis label, and tick labels all render in light ink, clearly readable against the dark background. The same y-axis label/tick-label overlap present in the light render recurs identically here — "y (normalized distance)" overstrikes "0.5", "0.0", and "-0.5". Charge markers flip to a light (cream) fill with dark +/− glyphs, consistent with chrome-only theme adaptation. Horizontal grid lines are dark gray and subtle; no vertical grid lines.
      Data: The field-line gradient (teal-to-blue) is visually identical to the light render — only chrome (background, text, marker fill) flipped, not the data-encoding colors. Arrowheads remain the same per-segment color as their parent line.
      Legibility verdict: PASS overall, with the same localized y-axis-label overlap FAIL as the light render — no dark-on-dark failures beyond that pre-existing overlap.
