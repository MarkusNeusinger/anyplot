review:
  strengths:
  - Physically accurate electric dipole field lines traced with RK4 arc-length integration
    of the normalized field direction — a direct match for the spec's 'electromagnetic
    field lines' application, including both closed (looping +/- to -) and open (escaping-to-infinity)
    topology
  - Creative, idiomatic use of MUI X's compositional API — ChartContainer plus useXScale/useYScale/useDrawingArea
    hooks — to build a custom SVG overlay for charge markers, direction arrowheads,
    and a manual field-strength gradient legend, which the community package has no
    built-in primitive for
  - Continuous field-magnitude encoding correctly uses the Imprint imprint_seq gradient
    (not a categorical or forbidden colormap), with direction arrows reinforcing flow
  - 'Both renders are theme-correct: identical data colors between light/dark, chrome
    (background, ink, legend, charge-marker fill/text) flips appropriately with no
    dark-on-dark or light-on-light failures'
  - Clean, balanced layout — good canvas utilization, no overlap, no edge clipping,
    legend sits near the plot rather than isolated
  weaknesses:
  - X/Y axis labels are the bare generic 'x' and 'y' with no descriptive text — even
    a short qualifier (e.g. 'x (normalized distance)' / 'y (normalized distance)')
    would lift this out of the generic-label bucket
  - Grid lines (both horizontal and vertical) are still fairly prominent across the
    whole canvas — lightening the grid or dropping the vertical gridlines would read
    as more refined against the smooth field-line curves
  - Direction arrows appear at only 2 points per field line — a bit more (or a subtle
    line-width increase near the charges, which the spec calls out as optional) would
    reinforce the flow direction and field-strength emphasis further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white and not dark.
      Chrome: Title "Electric Dipole Field Lines · streamline-basic · javascript · muix · anyplot.ai" is dark ink, clearly readable and centered above the plot; x/y axis titles, tick labels, and the "Field strength" gradient legend text (weak/strong) are dark-on-light and fully legible; grid lines are light gray and subtle but visible.
      Data: Field lines run from a black "+" marker to a black "−" marker (two point charges), colored on a teal-to-blue gradient (imprint_seq) keyed to local field-strength magnitude — teal/green near the outer, weaker field lines and blue near the strong, tightly-curved lines between the charges. Small triangular arrowheads along each curve show flow direction from + to −.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black and not light.
      Chrome: Title, axis titles, tick labels, and legend text all render in light ink, clearly readable against the dark background; grid lines are dark gray, subtle but visible; the charge markers flip to a light (cream) fill with dark +/− glyphs, consistent with chrome-only theme adaptation.
      Data: The field-line gradient (teal-to-blue) is visually identical to the light render — only the chrome (background, text, marker fill) flipped, not the data-encoding colors. Arrowheads remain the same per-segment color as their parent line.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the near-black background.
