review:
  strengths:
  - Streamlines are traced from the bilinear-interpolated (u, v) grid with mask-based
    seeding from the border inward, giving smooth, non-crossing curves across the
    whole domain at a balanced density (54 lines)
  - Equal pixels per data unit on both axes keeps the dipole's geometry undistorted
  - Field magnitude is encoded with imprint_seq through a MUI X zAxis colorMap; the
    custom line layer reads useZAxis().colorScale and the same z axis drives a ContinuousColorLegend
    titled "log₁₀ magnitude"
  - One arrowhead per line, filled in the line's local color, shows flow direction
    without competing with the curves
  - Composition API (ChartsDataProvider + ChartsSurface + useXScale/useYScale) lets
    the hand-drawn streamlines share the library's axes and grid; all chrome uses
    theme tokens and reads well in both themes
  - 'Physically correct dipole field: lines leave the + charge, enter the - charge,
    symmetric about both axes'
  weaknesses:
  - 'Suggestion: the magnitude color varies only subtly along most lines (nearly all
    read as green); a color range clipped to the percentiles of the plotted values
    would let the blue end of imprint_seq show where the field is strong.'
  - 'Suggestion: the color-bar title could name the field ("log₁₀ |E|") so the reader
    does not have to infer what magnitude is meant.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: bold dark title "streamline-basic · javascript · muix · anyplot.ai" centered at top, softer subtitle "54 streamlines traced through a 50 × 28 grid of (Ex, Ey), normalized field"; top-right color bar (green to blue, -1.5 to 1.4) labelled "log₁₀ magnitude"; x axis -4.5..4.5 and y axis -2.5..2.5 with 0.5 ticks, axis titles "x (normalized distance)" / "y (normalized distance)"; subtle gray grid both ways. All text dark and readable.
      Data: 54 smooth, non-crossing streamlines of a dipole field: lines fan out of the source at x≈-1.1 to the left/top/bottom edges, enter the sink at x≈+1.1 from the right, and nested arcs connect the two through the center. One arrowhead per line, pointing away from the source and into the sink. Lines are mostly #009E73 green, shading toward teal-blue near the charges (imprint_seq). Small empty patches around the two charges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: title, subtitle, color-bar label and min/max values, tick labels and axis titles all in light ink; grid subtle gray; no dark-on-dark text.
      Data: identical streamlines, arrowheads and green-to-blue colors to the light render; only the chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
