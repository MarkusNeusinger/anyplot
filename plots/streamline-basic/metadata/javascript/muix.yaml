review:
  strengths:
  - A dipole field (positive charge at x = −1.1, negative at x = +1.1) traces a source,
    a sink and the arcs between them, so the field topology reads at once; the arrows
    point away from the positive charge and into the negative one, as they should
  - Streamlines are traced with a streamplot-style occupancy mask seeded from the
    border inward, which gives a balanced density with no crossing lines
  - Equal pixels per unit on x and y keep the field's geometry undistorted, and the
    plot is centered in the canvas
  - Color encodes log₁₀ field magnitude through the zAxis continuous colorMap on the
    Imprint sequential stops, drawn by the native ContinuousColorLegend, which names
    the quantity
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + ChartsSurface with useXScale/useYScale/useZAxis
    hooks drive custom SVG marks inside native axes and grid'
  - Theme tokens are threaded through every element, so chrome flips cleanly and the
    data colors stay identical in both renders
  weaknesses:
  - 'SC-02 (both): near both charges and at the ends of the innermost central arcs,
    the lines show small visible kinks where bilinear interpolation on the coarse
    36 × 20 grid bends them abruptly (around (−1.15, 0.35), (1.22, −0.4) and (±0.7,
    ±0.1)), against the ''smooth curves without kinks'' property → smooth curves up
    to the point where a line stops. Likely cause: the coarse grid (cellX ≈ 0.26)
    combined with the coherence cutoff COHERENT_COS = 0.7 still lets lines run through
    cells whose corner directions turn sharply; a finer grid (e.g. 50 × 28) or a stricter
    cutoff would remove them.'
  - 'Suggestion: almost every line falls in the green half of the color bar because
    the scale''s extremes come from a few points near the charges; a tighter color
    range would make the magnitude encoding more visible.'
  - 'Suggestion: the color bar label could name the field (''log₁₀ |E|'') instead
    of the generic ''log₁₀ magnitude''.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "streamline-basic · javascript · muix · anyplot.ai" centered at the top, a soft-ink subtitle "46 streamlines traced through a 36 × 20 grid of (Ex, Ey), normalized field", a horizontal color bar at the top right labelled "log₁₀ magnitude" (−1.5 to 1.6), axes "x (normalized distance)" (−4.5 to 4.5) and "y (normalized distance)" (−2.5 to 2.5) with dark tick labels and a subtle full grid. All text is readable.
      Data: 46 smooth streamlines of a dipole field, 2.2 px wide, colored from brand green #009E73 (weak field) to blue (strong field near the charges). Radial lines leave the left charge and enter the right one, nested arcs bridge the two, and one arrowhead sits at the middle of each line, pointing along the field. Lines end around small empty patches at the two charges. No crossings and no overlap; small kinks near the charges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, color bar labels, axis titles and tick labels all render in light ink; the grid is subtle gray; no dark-on-dark text.
      Data: identical line geometry and identical green-to-blue colors as the light render; brand green reads well on the dark surface.
      Legibility verdict: PASS
