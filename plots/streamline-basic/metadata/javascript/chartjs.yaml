review:
  strengths:
  - Physically grounded vector field (potential flow past a cylinder) traced with
    RK4 integration, producing genuinely smooth, tangent streamlines rather than a
    naive polyline approximation
  - Streamline color encodes average velocity magnitude via the Imprint imprint_seq
    gradient, and line width scales with the same field-strength ratio, directly matching
    both optional-encoding notes in the spec
  - 18 seed points distributed across the domain (skipping the degenerate y=0 stagnation
    streamline) give even coverage of the flow topology without visual clutter
  - Data colors (streamline gradient, cylinder outline/fill) are identical between
    light and dark renders; only chrome (background, title, ticks, cylinder stroke
    tone) adapts to theme
  - Clean single-file implementation with no imports, fully deterministic (no RNG),
    correctly using the mount-node/canvas/animation:false harness contract
  weaknesses:
  - No colorbar/legend communicates what the color gradient encodes (velocity magnitude)
    — a viewer without the title/notes can't decode blue-vs-green meaning; consider
    a small colorbar or legend annotation
  - Streamline packing right above/below the cylinder (y in [-0.3, 0.3] band) is noticeably
    denser than the outer bands, giving slightly uneven visual rhythm — consider seed
    spacing proportional to local streamline curvature
  - 'Design Excellence is solid but not exceptional: the cylinder fill/stroke is fairly
    plain (flat muted gray) and could carry a touch more polish (e.g. subtle stroke
    width taper) to match the sophistication of the flow-field rendering itself'
  - Chart.js's generic line-chart idiom is used to fake a streamline plot (many single-purpose
    line datasets) — effective, but LM-01 idiomatic-usage credit is capped since this
    isn't the library's designed use case
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Flow Around a Cylinder · streamline-basic · javascript · chartjs · anyplot.ai" in dark ink at top, comfortably within plot width (~55%) with no clipping. X-axis labeled "x" (-3.2 to 3.2), Y-axis labeled "y" (-1.8 to 1.8), both with dark axis-title text and muted soft-ink tick labels. Grid lines are thin and subtle, visible but not competing with data. No legend (appropriately suppressed given ~19 datasets).
      Data: 18 streamlines curve smoothly around a circular cylinder (radius 1, centered at origin), drawn with an RK4-traced potential-flow field. Color runs from brand green (#009E73-family, near the stagnation streamlines close to y=0) through teal to blue (far-field streamlines), encoding average velocity magnitude along each path — a continuous imprint_seq gradient, not arbitrary hues. Line width thickens slightly for higher-speed streamlines. The cylinder itself is outlined in a muted gray-brown stroke with a faint translucent fill, rendered beneath the streamlines. Flow pattern is physically correct: streamlines bunch and accelerate near the cylinder's top/bottom (higher local speed → thicker, bluer lines) and relax to nearly straight, thin, green lines far from the body.
      Legibility verdict: PASS — all text (title, axis titles, tick labels) is clearly dark-on-light and unobstructed by data.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and axis text now rendered in light/white ink, fully legible against the dark background. Tick labels use a lighter soft-ink tone. Grid lines are still subtle but visibly present against the dark surface. Cylinder stroke switches to a light gray/near-white tone (appropriate theme-adaptive chrome flip) while its fill stays a faint translucent overlay.
      Data: The streamline gradient (green → teal → blue) and line widths are pixel-identical to the light render — only the cylinder outline color and background/text chrome changed, confirming data colors are theme-invariant as required.
      Legibility verdict: PASS — no dark-on-dark issues; title, axis labels, and tick labels all read clearly against the near-black surface, and the brand green remains vivid on both surfaces.
