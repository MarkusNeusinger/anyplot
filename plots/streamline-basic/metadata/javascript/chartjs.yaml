review:
  strengths:
  - Physically accurate potential-flow-past-a-cylinder field integrated with RK4 —
    streamlines correctly bunch and turn greener (faster) near the cylinder and spread
    out bluer (slower) far away, a genuine and correct use of continuous color encoding
    for velocity magnitude.
  - 'Balanced streamline density: 18 seed heights spanning the domain while deliberately
    skipping the y=0 stagnation streamline, capturing the full field structure without
    visual clutter.'
  - 'Both renders keep identical data colors and only flip chrome; backgrounds match
    #FAF8F1 / #1A1A17 exactly and all text stays legible in both themes.'
  - 'Idiomatic, constrained use of Chart.js: multiple line datasets plus a filled
    circle dataset drawn first via `order`, working within core Chart.js chart types
    (no vector-field plugin) as required for this library.'
  weaknesses:
  - Nothing on the chart tells the viewer what the streamline color encodes (velocity
    magnitude) — a small caption or two-swatch 'slow -> fast' indicator would make
    the color storytelling legible without external context.
  - borderWidth varies only from 2 to 3.5 px across the full speed range, which is
    too subtle to notice by eye — widen the range (e.g. 1.5 to 5) if line width is
    meant to carry visible emphasis.
  - The mandated title's descriptive prefix pushes total length to ~79 chars, and
    the auto-shrink formula lands the rendered title at roughly 40% of plot width
    — readable and non-overflowing, but on the small side versus the 50-70% guideline;
    not a defect, just a note for future tuning of the fontsize formula.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Flow Around a Cylinder · streamline-basic · javascript · chartjs · anyplot.ai" is dark and fully readable, centered at top. Axis titles "x" and "y" and all tick labels are dark ink, clearly legible against the light background. Grid lines are a subtle light gray, visible but not dominant.
      Data: 18 streamlines flow left to right around a filled circular cylinder outline (muted gray-brown stroke with a faint translucent fill). Streamlines nearest the cylinder (|y| small) are colored bright green (#009E73-family), transitioning through teal to blue (#4467A3-family) for streamlines farther from the cylinder — a correct sequential (imprint_seq) color encoding of relative flow speed. All curves are smooth, symmetric top/bottom, and clearly distinguishable from the background.
      Legibility verdict: PASS — no light-on-light text, all chrome and data elements are clearly visible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light ink and are fully readable against the dark background. Grid lines are a subtle dark gray, visible but unobtrusive. Cylinder outline is a light muted stroke, clearly visible against the dark fill.
      Data: Same 18 streamlines with identical green-to-blue color mapping as the light render — confirmed data colors are unchanged between themes, only chrome (background, text, grid, cylinder stroke) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; every text element and data line is clearly distinguishable from the near-black background.
