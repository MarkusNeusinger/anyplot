review:
  strengths:
  - Physically accurate vector field (uniform stream + doublet = potential flow past
    a cylinder) with the correct textbook radius relationship R = sqrt(kappa/U), giving
    genuine field topology rather than an arbitrary swirl.
  - Equal pixel-per-unit scaling (pxPerUnit derived from the Y domain, then centered
    on X) so the cylinder renders as a true circle instead of an ellipse.
  - Dual encoding of velocity magnitude via both stroke color (Imprint imprint_seq
    sequential scale, correctly chosen for single-polarity speed data) and stroke
    width — identical data colors across light/dark renders.
  - RK4 integration of streamlines with a clipPath confining rendering to the plot
    bounds, and a data-join (`.data(segments).join("line")`) driving the marks, satisfying
    idiomatic D3 usage.
  - All text explicitly sized (14/16/22/13px) and fully readable in both themes —
    no dark-on-dark or light-on-light failures, no clipping at the canvas edges.
  weaknesses:
  - Axis labels 'X Position' / 'Y Position' carry no units — add a domain-appropriate
    qualifier (e.g. 'X Position (R)' using the cylinder radius as the length scale)
    to earn full VQ-06 marks.
  - Design excellence still reads as a well-configured default rather than an exceptional
    composition — the color-by-speed encoding is itself a required feature (SC-02),
    so it isn't yet extra storytelling. Consider a subtle added touch (e.g. a faint
    stagnation-streamline highlight directly upstream/downstream of the cylinder,
    or a small annotation marking the max-speed point at the cylinder's shoulder)
    to push DE-01/DE-03 further.
  - The colorbar is functional but plain (bare stroked rectangle, tick numbers baseline-aligned
    by hand) — minor polish such as rounded end caps or a subtle border matching the
    plot's other chrome would lift DE-02.
  - In the dark render the cylinder's fill (t.muted at 0.35 opacity) reads close to
    the background and depends heavily on the white stroke ring for definition — a
    slightly higher opacity or a lighter fill would make the obstacle read more clearly
    as a filled shape rather than just an outline.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like cream), not pure white.
      Chrome: Bold dark title "streamline-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. "X Position" / "Y Position" axis labels in dark ink, readable. Dark-gray tick labels along both axes, readable. L-shaped axis frame (bottom + left only), no grid lines.
      Data: ~20 streamlines trace left-to-right around a filled gray circle (the cylinder obstacle, outlined in dark ink) representing flow that splits and reconverges around the obstacle. Streamline color runs from teal-green (low speed, |v| ≈ 0.53) far from the cylinder to blue (high speed, |v| ≈ 1.89) at the cylinder's top and bottom shoulders, matching the classic potential-flow-past-a-cylinder solution. A vertical colorbar legend on the right labeled "|v|" shows the same green-to-blue gradient with min/max value labels.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlap, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light/off-white text, clearly readable against the dark background. Same L-shaped axis frame, no grid.
      Data: Identical streamline geometry and identical teal-green-to-blue color mapping as the light render — only the chrome (background, text, cylinder fill/stroke) adapted to the dark theme. The cylinder is now a near-black disc outlined with a light stroke; the disc is distinguishable from the background but relies mostly on the stroke outline for definition since the muted fill tint reads quite dark at 0.35 opacity over the near-black backdrop.
      Legibility verdict: PASS — no dark-on-dark text; title, axis labels, tick labels, and legend numbers are all light-colored and readable. The muted-opacity cylinder fill is a minor (non-blocking) readability note, not a text-legibility failure.
