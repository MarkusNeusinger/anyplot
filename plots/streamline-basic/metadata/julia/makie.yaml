review:
  strengths:
  - The attempt-1 whitespace gap between axis and colorbar is fully resolved — the
    figure now reads as one composed block
  - Idiomatic, distinctive use of Makie's streamplot! with a function-based vector
    field and range domain rather than precomputed grid arrays
  - Colorbar directly linked to the streamlines plot object using the correct imprint_seq
    colormap for single-polarity wind-speed data
  - DataAspect() preserves the physically correct circular geometry of the vortex
  - Fully deterministic analytic field; theme-adaptive chrome correctly implemented
    and identical data colors across both renders
  - Realistic, neutral meteorological scenario (cyclonic wind field with mild radial
    inflow) with physically plausible speed values
  weaknesses:
  - Design excellence is solid but still short of publication-level polish — consider
    varying streamline linewidth with local speed (thicker near the high-speed core,
    thinner at the periphery) to sharpen the focal point further
  - The single symmetric vortex is a valid canonical example, but slightly stronger
    core-vs-outer visual contrast (e.g. a touch more arrow_size scaling by speed)
    could reinforce the 'spiraling into a low-pressure center' narrative
