review:
  strengths:
  - Idiomatic, distinctive use of Makie's streamplot! with a function-based vector
    field and range domain rather than precomputed grid arrays
  - 'Colorbar is directly linked to the streamlines plot object and correctly uses
    the imprint_seq (#009E73 -> #4467A3) colormap for the single-polarity wind-speed
    field'
  - DataAspect() preserves the physically correct circular geometry of the vortex
    instead of letting it stretch to fill a landscape canvas
  - Fully deterministic vector field (no RNG needed) and correctly implemented theme-adaptive
    chrome (background, ink, ink_soft) in both renders
  - Realistic, neutral meteorological scenario (cyclonic wind field with mild radial
    inflow) with physically plausible wind speeds (~1-11 m/s) and radius (60 km)
  weaknesses:
  - Noticeable dead whitespace between the right edge of the axis and the colorbar
    column (roughly 15-20% of canvas width sits empty) because DataAspect() constrains
    the axis to a square inside a 16:9 figure and colsize!(fig.layout, 1, Relative(0.88))
    leaves the colorbar isolated far to the right — tighten the column ratio or narrow
    the gap so the colorbar reads as part of the same visual block as the plot
  - 'Design excellence still reads close to a well-configured default: consider varying
    streamline linewidth with local speed, or trimming gridsize slightly at the domain
    edges to reduce minor visual clutter from overlapping curved lines in the corners'
  - The single symmetric vortex is a valid canonical example, but the story of 'wind
    spiraling into a low-pressure center' could be made more visually obvious (e.g.
    slightly stronger color/width contrast between the core and the outer field) to
    sharpen the focal point
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white and not dark.
      Chrome: Bold dark title "streamline-basic · julia · makie · anyplot.ai" centered at top, fully visible and not clipped. Axis labels "Distance East of Center (km)" / "Distance North of Center (km)" in dark ink, tick labels in a softer gray-brown, left/bottom spines only (top/right removed), no gridlines. Colorbar on the right labeled "Wind Speed (m/s)" with readable dark tick labels.
      Data: Cyclonic streamline field spiraling counter-clockwise around the center, colored from #009E73 (green, low speed near center) through teal to a blue-purple (#4467A3-ish, high speed at mid-radius) via the imprint_seq colormap. Arrowheads show flow direction. Density is fairly high (32x32 grid) but individual streamlines remain distinguishable.
      Legibility verdict: PASS — all title, axis, tick, and colorbar text is clearly readable against the light background; no light-on-light issues. Only readability caveat: axis tick labels are on the smaller side but still legible at both desktop and ~400px mobile-scaled preview.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black and not light.
      Chrome: Title and axis labels render in light ink (#F0EFE8), tick labels in a lighter soft gray (#B8B7B0) — no dark-on-dark failures anywhere. Spines and colorbar ticks use the same soft-ink tone as light mode's INK_SOFT equivalent, correctly flipped for the dark surface.
      Data: Identical streamline geometry and identical data colors (#009E73 green core fading into blue-purple at higher speed) as the light render — only the chrome (background, text, spines) flipped, confirming theme-adaptive colors are correctly separated from data colors.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark issues detected.
