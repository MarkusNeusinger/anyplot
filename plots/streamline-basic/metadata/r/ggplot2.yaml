review:
  strengths:
  - 'Both attempt-1 weaknesses are fully resolved: a faint theme-adaptive grid is
    back (panel.grid.major with low-alpha INK) and streamline linewidth now scales
    with local field strength (0.5-1.3 range), adding real visual emphasis near the
    charges'
  - Physically accurate electric dipole field, integrated via custom RK4 path tracing
    rather than faked — a strong structural solution to ggplot2's missing native streamplot
    geometry
  - 'Continuous Imprint-sequential color gradient (#009E73 → #4467A3) correctly encodes
    field strength and is pixel-identical across both themes; only chrome (background,
    text, charge-marker color) flips'
  - Clean, well-balanced streamline density (40 seeded lines from both charges) that
    reveals the dipole topology without clutter
  - Theme-adaptive chrome (charge markers, text, legend, grid) flips correctly with
    no legibility issues in either render
  - Title format and legend labeling exactly match spec requirements
  weaknesses:
  - Custom RK4-integration helper functions (field_vec, unit_field, rk4_step, trace_streamline)
    remain necessary for this plot type in ggplot2 but still stray from the KISS default
    — acceptable given there is no native streamplot geom, but worth noting for CQ-01
  - 'Data-quality feature coverage stays slightly incomplete: only the traced streamlines
    and the two charge markers are shown, with no raw vector-field cue (e.g. a light
    quiver overlay) alongside them for readers who want to cross-check the integration'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Electric Field Around a Dipole · streamline-basic · r · ggplot2 · anyplot.ai" renders in dark ink at the top, clearly legible and comfortably within canvas bounds (no clipping). Axis titles "X Position" / "Y Position" and tick labels (-2 to 2) are dark and legible against the light background. A faint light-gray grid is visible at the major ticks (0, ±1, ±2) — subtle, not competing with the data. Legend "Field strength" with a vertical gradient bar and numeric ticks (0.0-2.0) sits clearly to the right, fully inside the canvas.
      Data: ~40 streamlines trace the electric dipole field between two point charges (dark dots at x=-1.2 and x=1.2). Color runs on the green-to-blue continuous gradient (#009E73 low → #4467A3 high) encoding field strength, and line width visibly thickens near the charges (high field strength) and thins toward the plot edges (low field strength) — the linewidth-by-speed mapping is clearly legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels render in light ink, clearly legible against the dark background — no dark-on-dark failures. The faint grid is still visible at the major ticks in a lighter tone appropriate for the dark surface. The two charge markers correctly flip from dark ink to a light cream/white dot, keeping strong contrast against the new background. Legend background and text flip correctly and stay fully legible.
      Data: Streamline colors (green-to-blue gradient) and the linewidth-by-field-strength taper are identical to the light render — only chrome (background, text, charge-marker color, grid tone) flipped, exactly as required.
      Legibility verdict: PASS
