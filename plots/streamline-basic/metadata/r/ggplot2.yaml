review:
  strengths:
  - Physically accurate electric dipole field, computed and integrated via RK4 rather
    than faked - a strong structural solution to ggplot2's missing native streamplot
  - 'Continuous Imprint-sequential color gradient (#009E73 -> #4467A3) correctly encodes
    field strength and is identical across both themes'
  - Clean, well-balanced streamline density (40 seeded lines) that clearly reveals
    the dipole topology without clutter
  - Theme-adaptive chrome (charge markers, text, legend) flips correctly with no legibility
    issues in either render
  - Title format and legend labeling exactly match spec requirements
  weaknesses:
  - Grid lines are fully removed (panel.grid = element_blank()) rather than kept subtle
    - add a faint panel.grid (low-alpha INK color) so the plot retains a positional
    reference per the style guide, without competing visually with the streamlines
  - Line width is constant (linewidth = 0.9) - consider modestly varying line width
    with local field strength for extra visual emphasis near the charges, as suggested
    by the spec's optional note
  - Custom RK4-integration functions (field_vec, rk4_step, trace_streamline) are necessary
    for this plot type in ggplot2, but consider inlining/simplifying where possible
    to move closer to the KISS ideal
  image_description: |-
