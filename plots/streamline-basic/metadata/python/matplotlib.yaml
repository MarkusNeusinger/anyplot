  strengths:
  - Speed is encoded twice, via imprint_seq color and streamline width, with a colorbar
    that names the quantity and its unit
  - Masked arrays let streamplot stop cleanly at missing velocities, an idiomatic
    matplotlib touch
  - Correct 2400x2400 square canvas with equal aspect, and theme tokens threaded through
    every chrome element in both renders
  - Streamlines seeded across the whole domain at a balanced density=1.5; curves are
    smooth and never cross
  weaknesses:
  - 'VQ-05 (both): the equal-aspect axes plus colorbar fill only the middle ~70 %
    of the square canvas height, leaving empty bands of about 15 % above the title
    and below the x label → tighten the vertical figure margins so the plot fills
    the canvas. Likely cause: default subplot params with set_aspect(''equal'') and
    no fig.subplots_adjust / layout=''constrained''.'
  - 'Suggestion: arrowheads crowd into the bottom-right and top-left corners where
    lines bunch; a slightly lower arrow count there would keep the curves dominant.'
