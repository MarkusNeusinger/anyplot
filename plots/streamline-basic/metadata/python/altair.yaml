review:
  strengths:
  - Equal x/y domains on a square 370×370 view keep the vortex streamlines truly circular,
    so the field geometry reads correctly
  - Each streamline is traced for one arc only, so neighbouring lines never retrace
    or overlap and every orbit reads as one clean curve
  - 'Continuous speed uses the Imprint sequential ramp (#009E73 → #4467A3) with a
    titled colour bar ''Flow speed (units/s)''; data colours are identical in both
    themes'
  - 'Idiomatic Altair multi-line drawing: one mark_line with detail= per streamline
    and order= on the integration step'
  - Theme tokens threaded through title, axes, grid, view stroke and legend frame;
    both renders fully readable, and the PNG is padded (never cropped) onto the exact
    2400×2400 canvas
  weaknesses:
  - 'SC-02 (both): every orbit is drawn as six separate Euler arcs whose ends do not
    meet, leaving small visible notches and radial steps at each joint (clearest on
    the r = 2.6 and 3.0 orbits) — violates the spec''s ''smooth curves … without kinks''
    property → one continuous, closed curve per orbit with no visible seams. Likely
    cause: the step count int(2πr/n_per_radius/dt)+1 truncates each arc, and normalized
    Euler steps drift outward so consecutive arcs sit at slightly different radii.'
  - 'VQ-05 (both): the legend frame is about 390 px wide while its gradient is about
    45 px wide, so most of the box is empty, and the chart block leaves about 300
    px bands of empty page above and below on the square canvas → a legend frame that
    fits its gradient and labels, and an inner view that uses more of the canvas height
    (about +60 px view height). Likely cause: the legend title width sets the frame
    width, and width=height=370 is well below the 500×460 square view the library
    prompt recommends.'
  - 'Suggestion: sparse direction arrows along a few streamlines would show the counter-clockwise
    rotation, which the curves alone do not reveal.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400×2400 canvas (padding in the same colour).
      Chrome: centred bold title "streamline-basic · python · altair · anyplot.ai" in dark ink; axis titles "X position (units)" / "Y position (units)" in dark ink; tick labels −3.5 … 3.5 in INK_SOFT; subtle grid; view framed by a thin INK_SOFT stroke. All readable.
      Data: eight concentric circular orbits (r ≈ 0.4–3.0), each built from six arcs, coloured by speed on the Imprint sequential ramp from #009E73 (inner, slow) to #4467A3 (outer, fast). Small seams/notches visible at the arc joints. Colour bar "Flow speed (units/s)" 1–3 in an elevated legend box on the right that is mostly empty.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink (#F0EFE8), tick labels in #B8B7B0, grid subtle and visible, legend box on #242420 with light text. No dark-on-dark text.
      Data: identical green→blue orbit colours as the light render; only chrome flipped. Brand green on the inner orbits reads well.
      Legibility verdict: PASS
