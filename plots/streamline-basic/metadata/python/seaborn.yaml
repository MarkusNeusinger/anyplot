review:
  strengths:
  - Speed is encoded with imprint_seq along each streamline through per-segment hue
    + hue_norm in sns.lineplot, with a colorbar that names it
  - Smooth, non-crossing streamlines from a midpoint (RK2) integrator over a RegularGridInterpolator
    of the u/v grid, so any user grid drops in
  - Sparse direction arrows (one per line) colored like their segment show the inflow/outflow
    of the saddle without competing with the curves
  - Theme chrome threaded through sns.set_theme rc and the colorbar ticks/outline;
    both renders fully legible
  weaknesses:
  - 'SC-02 (both): seeds only on the top and bottom edges, so the band |y| < 0.5 carries
    no line besides the x=0 separatrix and the outflow branch along y=0 is not traced;
    the gap there is 1.0 m against 0.5 m elsewhere (C2) -> add seeds that reach the
    y≈0 outflow (for example on the left and right edges or along x=0 near the saddle).
    Likely cause: seeds = top-edge + bottom-edge lists only (lines 62-63).'
  - 'VQ-05 (both): the equal-aspect axes plus colorbar fill only about 64 % of the
    canvas height; about 300 px of empty page sits above the title and below the x
    label -> let the axes use the square canvas (for example fig.subplots_adjust(top=0.93,
    bottom=0.08) or a wider colorbar pad budget). Likely cause: default subplot margins
    with set_aspect(''equal'').'
  - 'CQ-01 (code): a helper function velocity() (lines 57-58) breaks the no-functions
    structure -> inline float(interp_u((py, px))), float(interp_v((py, px))) at its
    call sites. Likely cause: the integrator loop factored into a helper.'
  - 'Suggestion: matplotlib''s ax.streamplot(start_points=..., broken_streamlines=False)
    could replace the hand-written integrator, at the cost of the seaborn lineplot
    path.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: title 'streamline-basic · python · seaborn · anyplot.ai' in dark ink above the axes; 'X Position (m)' / 'Y Position (m)' labels and -3..3 ticks in dark/soft ink; colorbar 'Flow Speed (m/s)' 0.5-3.5 ticks; subtle horizontal grid; top/right spines removed. Wide empty margins above the title and below the x label.
      Data: saddle-point flow; hyperbolic streamlines enter from the top and bottom edges and leave through the left and right edges, plus the vertical separatrix at x=0. Lines colored by speed along their length with imprint_seq (green #009E73 near the stagnation point, blue #4467A3 at the corners); one filled arrowhead per line pointing with the flow. The band around y=0 is empty apart from the separatrix.
      Legibility verdict: PASS

