  strengths:
  - Theme tokens threaded through chrome; text readable in both renders
  - Streamlines integrated from the field with solve_ivp and RegularGridInterpolator
  - coord_fixed(ratio=1) keeps the vortex circular
  - Color bar names the speed it encodes
  weaknesses:
  - 'SC-04 (both): title reads ''streamline-basic · seaborn · anyplot.ai'' — wrong
    library and no language segment → ''streamline-basic · python · plotnine · anyplot.ai''.
    Likely cause: the labs(title=...) string / a render that does not come from this
    source.'
  - 'VQ-07 (both): speed is colored with viridis, which the style guide forbids →
    imprint_seq via scale_color_gradient(low=''#009E73'', high=''#4467A3''). Likely
    cause: scale_color_cmap(cmap_name=''viridis'').'
  - 'VQ-05 (both): canvas is 3486x2967, neither 3200x1800 nor 2400x2400 → 2400x2400
    for this square plot. Likely cause: figure_size=(16, 9) with coord_fixed and plot.save
    without explicit width/height.'
  - 'SC-02 (both): seeds on the same circles (a 4x6 grid plus three rings of six)
    stack several overlapping paths per ring, leaving stair-step seams instead of
    one smooth line per ring (C1, C2) → one seed per radius. Likely cause: the start_points
    loops.'
  - 'CQ-04 (code): try/except Exception: pass, np.random.seed(42) with no random draw
    and the unused BRAND constant are dead code → remove them. Likely cause: leftover
    scaffolding.'
  - 'Suggestion: fewer arrowheads per ring would keep the curves the main mark more
    clearly.'
