review:
  strengths:
  - Streamlines are integrated properly with scipy.integrate.solve_ivp (RK45, dense
    output, terminal events for leaving the domain and closing the loop), so the eight
    vortex loops are smooth, closed and never cross
  - 'Speed is encoded along each line with the imprint_seq gradient (#009E73 to #4467A3),
    and the color bar is titled Field Strength; its 0.3 to 2.8 range matches |v| =
    r for the seeded radii'
  - coord_cartesian limits come from the data and the panel aspect, so x and y share
    one unit length and the circles render as true circles
  - 'Theme tokens carry through every chrome element: text, grid and legend frame
    read correctly on both #FAF8F1 and #1A1A17'
  - 'Idiomatic lets-plot grammar: one geom_path with a group aesthetic over a tidy
    long table, plus ggsave at scale=4 for the PNG and the interactive HTML'
  weaknesses:
  - 'VQ-05 (both): the equal-aspect vortex fills only the middle ~55 % of the landscape
    panel, so x runs to ±5 while the data ends at ±3 and about 40 % of the plot area
    is empty grid → a square canvas, ggsize(600, 600) with scale=4 (2400 × 2400),
    where the ±3 field fills the panel. Likely cause: ggsize(800, 450) together with
    PANEL_ASPECT = 1.67 widening the x limits.'
  - 'VQ-06, DQ-02 (both): the axis and color bar titles ''X Position'', ''Y Position''
    and ''Field Strength'' carry no units and no physical context, so the field reads
    as an abstract math example → name a concrete flow with units, for example ''x
    (m)'', ''y (m)'' and ''Speed (m/s)'' for a rotating fluid vortex. Likely cause:
    the column constants X, Y and the ''Field Strength'' column name.'
  - 'Suggestion: sparse direction arrows along a few loops would show that the vortex
    turns counter-clockwise, which the static render does not reveal.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot and panel.
      Chrome: title "streamline-basic · python · letsplot · anyplot.ai" in dark ink top-left (~46 % of the width); axis titles "X Position" and "Y Position" in dark ink; tick labels -5..5 and -3..3 in INK_SOFT gray; subtle major and minor grid; color bar titled "Field Strength" (0.5 to 2.5 ticks) on an elevated off-white legend box. All text readable.
      Data: eight concentric, closed circular streamlines centered at the origin (radii ~0.28 to 2.8), each colored by speed along the imprint_seq gradient from brand green #009E73 (inner) to blue #4467A3 (outer). Smooth, evenly spaced, no crossings. Equal aspect leaves empty grid left and right of the field.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick labels in light gray, grid subtle but visible, legend box on #242420 with light text. No dark-on-dark text.
      Data: identical circles and identical green-to-blue gradient as in the light render; only the chrome flips. Brand green reads well.
      Legibility verdict: PASS
