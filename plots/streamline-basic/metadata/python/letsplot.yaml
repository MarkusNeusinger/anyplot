      Data: eight concentric closed circular streamlines centred at the origin, radii about 0.3 to 2.8 m, evenly spaced; color runs from brand green #009E73 (inner) to blue #4467A3 (outer) by speed. Corners of the domain beyond r = 3 m are empty. Equal aspect, circles are round.
