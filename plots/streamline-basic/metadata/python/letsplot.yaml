review:
  strengths:
  - Streamlines are integrated with scipy.integrate.solve_ivp (RK45, dense output)
    with terminal events for leaving the domain and closing a loop, so the eight vortex
    loops are smooth closed circles without kinks, zigzags or crossings in both renders
  - 'Color encodes speed along every line with the imprint_seq two-stop gradient (#009E73
    → #4467A3) and a color bar titled ''Speed (m/s)'', as the Notes allow; the inner
    loop at r ≈ 0.3 m is green and the outer loop at r ≈ 2.8 m blue, matching u =
    -y, v = x at 1 rad/s'
  - coord_cartesian limits are derived from the data and the panel aspect so x and
    y share one unit length and the circles render as true circles
  - 'Theme tokens are threaded through every chrome element: warm off-white and near-black
    page, INK title and axis titles, INK_SOFT ticks, ELEVATED_BG color-bar panel;
    all text readable in both themes'
  - geom_path grouped by streamline keeps the native lets-plot tooltip on each line
    in the HTML output
  weaknesses:
  - 'SC-02 (both): all eight seeds lie on the positive x-axis between 0.3 m and 2.79
    m, so the four corners of the 6 m × 6 m domain (radius 3 to 4.24 m, about a fifth
    of the area) carry no streamline although the field is defined there → seeds that
    also reach the corner region so partial arcs that end at the domain edge trace
    the field across the whole domain (+1 to +3 seeds beyond r = 3 m, for example
    along the diagonal). Likely cause: SEED_SPAN = (0.1, 0.93) of the half-width on
    a single horizontal seed line.'
  - 'Suggestion: sparse direction arrows along the loops (the spec allows them) would
    show the counter-clockwise sense of rotation, which the static render does not
    convey.'
  - 'Suggestion: varying line width with speed (allowed by the Notes) would reinforce
    the green-to-blue speed gradient.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel; the color-bar panel sits on the slightly lighter elevated surface.
