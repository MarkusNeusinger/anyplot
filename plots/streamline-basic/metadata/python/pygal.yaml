review:
  strengths:
  - Eight smooth, closed, non-crossing streamlines evenly spaced from core to edge
    trace the vortex cleanly in both themes
  - 'Theme threaded through a single pygal Style object: warm backgrounds, light/dark
    ink, identical data colors'
  - Native pygal interactive HTML output alongside the PNG (hover and legend toggling
    per streamline)
  - Data block ends in a tidy df and the field is interpolated with scipy RegularGridInterpolator,
    so any u/v table drops in
  weaknesses:
  - 'VQ-07 (both): the eight seed radii (r = 0.4 … 3.2, an ordered quantity) are drawn
    in the categorical Imprint palette as if unrelated groups, so green → purple →
    blue → ochre → red jumps around the radius order → ordered steps of one Imprint
    ramp (imprint_seq, #009E73 → #4467A3) in radius order. Likely cause: Style(colors=tuple(IMPRINT_PALETTE))
    with one series per ring.'
  - 'SC-02 (both): color encodes a scalar (the seed radius) but the legend only reads
    ''r = 0.4'' … ''r = 3.2'' and never names the quantity or its unit, which C4 asks
    of a color encoding → name it in the legend entries (e.g. ''Seed radius 0.4 m'')
    or encode speed with a named legend. Likely cause: series name f"r = {radius:.1f}".'
  - 'VQ-05 (both): the circular vortex streamlines render as flat ellipses because
    equal x/y ranges (-4..4) are stretched over a 16:9 plot area (about 225 px per
    x unit vs 107 px per y unit) → equal scaling, e.g. the 2400×2400 square canvas.
    Likely cause: width=3200, height=1800 with xrange == range.'
  - 'VQ-06 (both): axis titles ''X Position'' and ''Y Position'' carry no unit → add
    one (e.g. ''X position (m)''). Likely cause: the X and Y column constants.'
  - 'DQ-02 (both): the field is labelled only ''X Position'', ''Y Position'', ''Horizontal
    velocity'', ''Vertical velocity'' with no physical context, so the vortex reads
    as an abstract math example → rename to a real scenario (e.g. ''Distance east
    of vortex core (m)''). Likely cause: the column constants.'
  - 'CQ-01 (code): a trace() helper with a nested direction() function (lines 64–86)
    breaks the flat Imports → Data → Plot → Save structure → inline the integration
    in the seed loop. Likely cause: the trace() definition.'
  - 'CQ-04 (code): lines 64–86 write out a fixed-step midpoint integrator that scipy.integrate.solve_ivp
    computes (with a terminal event for the edge stop) → solve_ivp with a lambda right-hand
    side. Likely cause: the hand-rolled trace loop.'
  - 'Suggestion: sparse direction arrows along the loops would show the counter-clockwise
    circulation.'
