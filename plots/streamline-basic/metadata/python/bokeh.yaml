review:
  strengths:
  - Square 2400x2400 canvas with match_aspect=True keeps the circular vortex circular
  - All streamlines in one multi_line glyph and all arrowheads in one patches glyph,
    fed from ColumnDataSource
  - Seeds skipped when an existing line already passes nearby, so loops never retrace
    or crowd each other
  - Flow speed mapped through the imprint_seq ramp with a titled ColorBar ('Flow speed
    (m/s)')
  - HoverTool on the streamline renderer shows each line's speed in the HTML view
  - Theme tokens threaded through title, axes, ticks, grid and color bar; both renders
    read cleanly
  weaknesses:
  - 'CQ-01 (code): the plot zone defines helper functions direction() (lines 75-82)
    and trace() (lines 85-105) besides the prompt''s lerp_hex → inline the integration
    in the seed loop as one solve_ivp call. Likely cause: RK4 integrator wrapped in
    functions.'
  - 'CQ-04 (code): line 28 IMPRINT_PALETTE and line 133 w1_x, w1_y, w2_x, w2_y are
    never used, and lines 85-105 write out an RK4 integrator → remove the dead names
    and integrate with `scipy.integrate.solve_ivp` (with an edge `events` function
    and `max_step=step`). Likely cause: leftover arrow-wing code and a hand-rolled
    integrator.'
  - 'Suggestion: varying line width with flow speed (the Notes allow it) would reinforce
    the speed gradient beyond color alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on both plot area and border; square 2400x2400 canvas.
