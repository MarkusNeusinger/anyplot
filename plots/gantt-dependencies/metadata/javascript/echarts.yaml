review:
  strengths:
  - 'Correct Imprint palette usage: first group (Requirements) is #009E73, subsequent
    phases follow canonical order (#C475FD, #4467A3, #BD8233); identical data colors
    across both light and dark renders'
  - Theme-adaptive chrome is fully correct in both renders — warm off-white/near-black
    backgrounds, readable ink-toned text, subtle grid, no dark-on-dark or light-on-light
    failures
  - 'Genuinely comprehensive dependency modeling: sequential finish-to-start chains
    plus a 3-way convergence (Integration Testing depends on Backend API, Database
    Setup, and Frontend Implementation) with clean elbow connectors and arrowheads
    landing precisely on the successor''s left edge'
  - Group rows render as thin translucent outlined bars spanning the aggregate min/max
    of their children, visually distinct from the solid child task bars, with bold
    vs. regular typography reinforcing the hierarchy
  - Idiomatic use of ECharts' custom series API (renderItem with api.coord/api.size/clipRectByRect)
    to draw both the Gantt bars and the dependency arrows — a technique genuinely
    distinctive to this library
  - Deterministic, realistic software-release-plan data with sensible task durations
    and a coherent overall project timeline
  weaknesses:
  - No explicit axis title on the timeline (x) axis — tick labels are descriptive
    dates but there is no 'Timeline'/'Date' label reinforcing what the axis represents
    (VQ-06)
  - 'Design Excellence is solid but not exceptional: the group-to-color mapping is
    the straightforward canonical palette order rather than a more deliberate custom
    scheme, and the L-shaped left/bottom spines are kept rather than removed entirely
    — push DE-01/DE-02 further with more refined chrome (e.g. thinner axis line, tighter
    tick treatment)'
  - No visual emphasis on the critical path itself — with three parallel streams converging
    on Integration Testing, highlighting the longest chain (e.g. a slightly bolder
    stroke or accent color on the critical-path arrows) would sharpen the data storytelling
    (DE-03)
  - Title occupies only ~40% of the plot width after the length-based font-scaling
    formula — correct per the scaling formula, but there is visual headroom to size
    it slightly larger without overflowing
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white and not dark.
      Chrome: Title "Software Release Plan · gantt-dependencies · javascript · echarts · anyplot.ai" is dark ink text, centered top, fully legible. Y-axis category labels show bold group headers (Requirements, Design, Development, Testing) above their regular-weight indented child task names (Gather Requirements, Stakeholder Review, etc.), all dark/soft-ink and clearly readable. X-axis date ticks (Jan 3 ... Feb 15) are legible gray text. Vertical grid lines are thin and subtle, not competing with data. No spines beyond a thin left/bottom axis line.
      Data: Task bars are colored by phase group following the Imprint canonical order — Requirements = #009E73 (brand green), Design = lavender/purple (#C475FD), Development = blue (#4467A3), Testing = ochre (#BD8233). Group-header rows render as thin, translucent, outlined bars spanning the aggregate start/end of their children; individual task rows render as solid bars. Elbow-shaped dependency connectors with small triangular arrowheads run from each predecessor's end to each successor's start, including a 3-way convergence into "Integration Testing". Connector lines are dark ink-soft gray, clearly distinguishable from the colored bars.
      Legibility verdict: PASS — all title, axis, tick, and legend-equivalent (category label) text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black and not light.
      Chrome: Title renders in light/near-white text, fully legible against the dark background. Y-axis group headers and task labels are light-toned (bold white for groups, soft light gray for tasks), clearly readable — no dark-on-dark failures observed. X-axis date labels are light gray and legible. Grid lines are faint and appropriately subtle for the dark surface.
      Data: All four phase colors (green, lavender, blue, ochre) are visually identical to the light render — only the chrome (background, text, connector-line color) flips as expected. Dependency connector lines are light gray/off-white, clearly visible against the dark background, mirroring the ink-soft line color used in the light render.
      Legibility verdict: PASS — no dark-on-dark or unreadable text observed anywhere in this render; all chrome elements adapted correctly to the dark theme.
