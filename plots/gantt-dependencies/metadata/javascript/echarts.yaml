review:
  strengths:
  - Genuine CPM (critical-path-method) forward/backward pass computes the true zero-slack
    path and highlights it in amber, directly serving the spec's 'identify critical
    path dependencies' use case rather than just drawing arrows
  - Distinct group-header (thin outlined, semi-transparent fill) vs task (solid) bar
    styling gives immediate visual hierarchy between phases and their child tasks,
    satisfying the spec's 'vertical alignment should clearly show task hierarchy'
    note
  - Elbow connectors with arrowheads correctly land finish-to-start dependencies on
    the successor's left edge instead of cutting diagonally across the chart
  - Explicit, theme-adaptive font sizing threaded through title/subtitle/axis/tick/row
    labels; both renders are fully legible with correct FAF8F1/1A1A17 backgrounds
    and identical data colors
  - Idiomatic, distinctive use of ECharts' custom-series API (renderItem, api.coord/api.size/api.style,
    echarts.graphic.clipRectByRect) — the correct approach since ECharts has no native
    Gantt series
  - Deterministic, realistic software-release-plan dataset that exercises sequential,
    parallel, and converging dependencies plus group aggregation
  weaknesses:
  - Two dependency connectors (Backend API -> Integration Testing and Database Setup
    -> Integration Testing) route their vertical elbow segment directly through the
    Frontend Implementation bar near its right portion (~x=1480-1530 in the 3200-wide
    source) -- the spec explicitly asks arrows to avoid overlapping task bars where
    possible; offset the vertical segment or route it above/below the intervening
    row band when it must cross another task's row
  - The subtitle only explains the amber (critical-path) connector; the gray/inkSoft
    non-critical connector styling is left unexplained -- a small connector-key or
    legend would remove reader ambiguity about what the two line styles mean
  - 'Minor: the Frontend Implementation -> Integration Testing connector''s vertical
    segment clips slightly into the left edge of the Testing group''s outlined header
    bar'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "Software Release Plan · gantt-dependencies · javascript · echarts · anyplot.ai" in dark ink, centered, ~70% of canvas width (expected for the long mandated title). Subtitle in soft gray explains the amber critical-path connectors. Y-axis shows 4 bold group labels (Requirements, Design, Development, Testing) each followed by their indented, regular-weight child task labels. X-axis shows date ticks (Jan 3 - Feb 15) on a 4-day cadence with subtle vertical gridlines only. All text is clearly readable against the light background -- no light-on-light issues found.
      Data: Group header bars render as thin, semi-transparent outlined spans; task bars render as solid fills. Colors cycle in canonical Imprint order by group: Requirements = brand green #009E73, Design = lavender/purple, Development = blue, Testing = ochre/amber-brown. Elbow connector arrows link predecessor end to successor start; amber, thicker connectors trace the critical path (Gather Requirements -> Stakeholder Review -> System Architecture -> Backend API -> Integration Testing -> QA Review -> Deployment), gray/ink connectors mark non-critical dependencies (e.g. Database Setup, UI/UX Design branches).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title/subtitle/axis/tick layout as the light render, now rendered in light ink (#F0EFE8-family) and soft light gray for secondary text. Gridlines and axis lines are subtle and theme-flipped correctly. No dark-on-dark failures observed -- every label, tick, and group/task name is clearly legible against the near-black surface.
      Data: Group and task bar colors are pixel-identical to the light render (green, lavender, blue, ochre) -- only the chrome (background, text, grid) flipped, as required. The amber critical-path connectors and gray non-critical connectors keep the same hues in both themes, with the non-critical connector now correctly rendered light gray/white instead of near-black ink to stay visible on the dark surface.
      Legibility verdict: PASS
