review:
  strengths:
  - Solves the missing gantt/annotations module constraint by hand-rolling dependency
    arrows via chart.renderer.path + a custom SVGRenderer symbol, redrawn on every
    render() pass through toPixels() — a genuinely distinctive Highcharts technique.
  - 'Dependency arrows are anchored exactly per spec: from each predecessor''s end
    (right edge) to its successor''s start (left edge), routed with a jogged right-angle
    path that avoids crossing task bars.'
  - 'Clear group hierarchy: bold group headers render above their indented child tasks,
    with a translucent ''Phase total'' bar showing each group''s aggregate start-to-end
    span — directly satisfies the spec''s hierarchy and aggregate-timeline requirements.'
  - 'Correct Imprint palette: first series (Requirements) is #009E73, remaining groups
    follow canonical palette order, data colors are identical between light and dark
    renders, and all chrome (background, text, grid) is theme-correct in both.'
  - Underlying schedule data is logically consistent — every dependent task starts
    at or after its predecessor's end, including multi-predecessor convergence (Integration
    depends on Backend/Frontend/Schema, scheduled at the max of their end dates).
  - Clean, deterministic, KISS-structured code with no fake interactivity; correctly
    implements the mount-node contract with animation disabled on both chart and series.
  weaknesses:
  - Series colors are taken straight from the Imprint palette in group order with
    no further curation — competent but not a distinctively harmonious palette choice,
    capping Aesthetic Sophistication short of top marks.
  - No visual emphasis on the critical path (the longest dependency chain, e.g. Stakeholder
    Review to Backend API to Integration to UAT Sign-off) — all dependency arrows
    are drawn uniformly, so the viewer must infer the critical path rather than have
    it highlighted.
  - The time-axis title 'Project Timeline' is generic; a more specific label (e.g.
    'Calendar Date') would sharpen axis descriptiveness slightly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the light theme token.
      Chrome: Title "gantt-dependencies · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Arrows mark finish-to-start dependencies between tasks" in soft gray beneath it. Left side lists task/group rows: bold group headers (Requirements, Design, Development, Testing) above indented child task labels. Bottom x-axis ("Project Timeline") shows dates Jan 5 through Feb 16 with subtle vertical week gridlines. Legend at bottom lists Phase total, Requirements, Design, Development, Testing.
      Data: Stacked floating bars per group — green (#009E73) for Requirements, purple for Design, blue for Development, amber/ochre for Testing — each with a small triangular arrowhead at its start where an incoming dependency lands. Faint translucent gray "Phase total" bars sit behind each group header row, spanning that group's earliest-to-latest task range. Right-angle jogged arrows connect each predecessor's right edge to its successor's left edge without crossing other bars.
      Legibility verdict: PASS — all titles, axis labels, tick labels, and legend text are clearly readable in dark ink/gray against the light background; no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the dark theme token.
      Chrome: Same title/subtitle/axis/legend layout as the light render, now in light/white text against the dark background. Gridlines and phase-total bands are rendered in a subtle lighter gray/white tint appropriate for the dark surface.
      Data: Identical bar colors to the light render (green/purple/blue/amber data series unchanged) — only the chrome (background, text, grid, legend swatch for "Phase total") flipped to the dark-theme palette, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, subtitle, task labels, axis ticks, legend) is light-colored and clearly legible against the near-black background.
