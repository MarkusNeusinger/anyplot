review:
  strengths:
  - 'Floating bars built the MUI X way: a transparent stacked ''offset'' series up
    to each row''s start plus a span series on the same stack, so every bar sits exactly
    at its start and end dates on a shared time axis'
  - Dependency arrows are drawn as a custom SVG child of BarChart that reads the chart's
    own scales via useXScale/useYScale, so arrows stay registered to the bars; every
    finish-to-start link runs from the predecessor's right edge to the successor's
    left edge
  - Orthogonal arrow routing runs through the gaps between rows and detours around
    intervening bars (e.g. Backend API → Integration passes right of Frontend UI),
    keeping all 14 links traceable in both themes
  - 'Group header rows with neutral aggregate bars spanning earliest start to latest
    end, task rows indented with a ↳ prefix and color-coded by phase in Imprint order
    starting with #009E73'
  - Theme tokens threaded through all chrome and the arrow/arrowhead ink, so both
    renders are fully legible; per-series valueFormatter gives date-span tooltips
    in the HTML output
  weaknesses:
  - 'Suggestion: the subtitle repeats the arrow semantics at length (''arrow from
    predecessor end to successor start''); a shorter subtitle would sharpen the header
    hierarchy.'
  - 'Suggestion: setting the group header row labels in a heavier weight would reinforce
    the hierarchy beyond the ↳ indentation.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
