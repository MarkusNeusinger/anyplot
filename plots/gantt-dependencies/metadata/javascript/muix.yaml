review:
  strengths:
  - Dependency arrows are computed from the chart's real x/y scales via useXScale/useYScale
    (not drawn as a static approximation), so connectors land exactly on bar edges
    in both themes.
  - 'Group phase-span bars use the theme-adaptive ''ink'' neutral token, correctly
    distinguishing aggregate rows from the four phase-colored task rows (canonical
    Imprint order: green -> lavender -> blue -> ochre) while keeping data colors identical
    across light/dark.'
  - All dependency scheduling constraints are correct in the source data -- every
    dependent task starts exactly at or after its predecessor's end (e.g. Integration
    starts day 29 = max(Backend API end 27, Frontend UI end 29)).
  - 'Clean vertical hierarchy: each group header is immediately followed by its indented
    (↳) child tasks, matching the spec''s ''groups above their child tasks'' requirement.'
  - Caption clarifies the single dependency-line style used (finish-to-start), satisfying
    the spec's legend note without adding a redundant legend entry for a single line
    type.
  weaknesses:
  - 'Dependency-arrow connectors visually cross through an intermediate task bar in
    the two ''converging'' spots: the Backend API -> Integration connector''s vertical
    segment passes through the Frontend UI bar near day 27, and the UI wireframes/Database
    schema -> Architecture review connectors cross the Database schema bar near day
    14-15. The spec asks arrows to avoid overlapping task bars where possible -- route
    the vertical segment past the rightmost edge of the widest converging bar, or
    offset each edge onto a distinct lane.'
  - X-axis tick labels and legend labels are set to 13px, slightly under the library's
    own ~14px CSS-mount guidance -- bump both to 14px for a touch more presence at
    the 400px mobile crop.
  - All four phase-span (group) bars share the identical neutral ink color, so a group
    row's color alone doesn't hint which phase it belongs to until the eye reaches
    the colored child rows below it -- a thin left-edge tick in the phase's task color
    would tie the aggregate row to its children even more directly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white cream, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "gantt-dependencies · javascript · muix · anyplot.ai" in dark ink, top-left, fully legible. Top-right legend lists 5 swatches (Phase span [black], Requirements tasks [green], Design tasks [lavender], Development tasks [blue], Testing tasks [ochre]) in dark text on cream -- all legible. Y-axis row labels alternate between plain phase names (Requirements, Design, Development, Testing) and indented "↳ Task name" child rows, all dark ink, clearly readable. X-axis shows date ticks "Jan 1" through "Feb 16" with a subtle vertical-only gridline every 2 days. Bottom caption "→ arrow: finish-to-start dependency (predecessor end → successor start)" in soft gray, legible.
      Data: Four phase-span bars in solid black (theme-adaptive ink/neutral token) at the top of each phase group; 13 child-task bars colored by phase in canonical Imprint order -- green (#009E73) for Requirements, lavender for Design, blue for Development, ochre for Testing. Right-angle connector arrows with small triangular arrowheads link each predecessor's bar end to its successor's bar start.
      Legibility verdict: PASS -- no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: All title, legend, row-label, tick-label, and caption text has flipped to light cream/off-white ink and remains fully legible against the dark surface. No dark-on-dark failures observed anywhere (title, y-axis task labels, x-axis date ticks, and legend text were all specifically checked).
      Data: The four phase-span bars flip from black to a light off-white/cream fill (the same theme-adaptive neutral token used for chrome), while all task-series colors (green, lavender, blue, ochre) are pixel-identical to the light render -- confirming only chrome flipped, as required. Dependency connector arrows render in a light gray stroke, clearly visible against the dark background.
      Legibility verdict: PASS -- no dark-on-dark or illegible text found.
