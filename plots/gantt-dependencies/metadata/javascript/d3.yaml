review:
  strengths:
  - Correct Imprint palette canonical order (green → lavender → blue → ochre → matte
    red) used consistently across the 5 groups, identical between light and dark renders
  - 'Group hierarchy is legible: bold, less-indented group headers above indented
    task rows, with a translucent aggregate span bar per group showing earliest→latest
    coverage'
  - Finish-to-start scheduling is correctly enforced everywhere, including the two-predecessor
    convergence into "Integration" (starts at max of Backend API's and Frontend Components'
    end dates)
  - Explicit font sizing and theme-token-driven chrome (ink/inkSoft/grid) keep title,
    legend, row labels, and axis ticks legible in both themes
  - Title format and legend labels match the spec/style-guide requirements exactly
  weaknesses:
  - Dependency arrows routinely cut straight across unrelated task bars and group
    aggregate bars instead of skirting around them — e.g. the System Architecture→Database
    Schema trunk slices through the middle of the UI/UX Design bar, and the Backend
    API / Frontend Components / Auth Module trunks cut through the Testing group's
    aggregate span bar and the Unit Testing bar. The spec explicitly says "Arrows
    should avoid overlapping task bars where possible" — route the vertical trunk
    segment into an x-lane that is empty across all intervening rows (e.g. offset
    just outside the widest bar span among the rows it crosses), or curve the path
    around the bars it would otherwise cross.
  - Every dependency is back-to-back with zero float (successor starts exactly when
    the predecessor ends), which makes the whole schedule read as one single critical
    path with no slack. Give at least 2-3 dependent tasks a few days of buffer after
    their predecessor's end so the chart demonstrates real scheduling constraints
    rather than a uniformly tight chain.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold centered title "gantt-dependencies · javascript · d3 · anyplot.ai" at top in dark ink; a 5-item swatch legend (Requirements/Design/Development/Testing/Deployment) below it; 16 rows of dark-ink (bold, group) and softer-ink (task) row labels on the left, indented to show hierarchy; thin vertical weekly gridlines; bottom x-axis with "Jan 04" ... "Mar 01" date ticks in dark text. All text is clearly readable against the light background.
      Data: Task bars and translucent group-aggregate span bars colored by group using the Imprint palette in canonical order (green, lavender, blue, ochre, matte red — first series is #009E73). Dark charcoal elbow-routed connector lines with triangular arrowheads run from each predecessor's right edge to each successor's left edge. Several of these connector lines visibly cross through unrelated task bars and group span bars en route (e.g. through "UI/UX Design", through the Testing group's aggregate bar) rather than avoiding them.
      Legibility verdict: PASS (all text readable; the arrow/bar crossings are a routing-clarity issue, not a text-legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Same title, legend, and row-label layout as the light render but rendered in light ink (white/light-gray text) — all clearly legible, no dark-on-dark text found anywhere (title, legend, row labels, and tick labels all read cleanly against the dark background).
      Data: Task bar and group-swatch colors are identical to the light render (same 5 Imprint hues, first series still #009E73); only the group aggregate span bars and gridlines shift to darker/muted tones appropriate for the dark surface, and the connector-arrow stroke lightens to a light gray so it stays visible against the dark background. The same arrow-crosses-bar routing issue observed in the light render is present here too (same paths, same theme-invariant geometry).
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures in either theme).
