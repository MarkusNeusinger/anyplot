review:
  strengths:
  - 'Idiomatic Chart.js floating-bar technique (indexAxis: ''y'' bar chart with [start,
    end] tuples) for the Gantt layout'
  - Custom Chart.js plugin (afterDatasetsDraw) draws accurate finish-to-start dependency
    arrows with elbow routing and arrowheads, using the library's low-level canvas
    plugin API
  - Group aggregate span bars (hollow, colored-border) correctly computed from min/max
    of member task dates, with bold group headers and indented child tasks making
    the hierarchy explicit
  - All dependent task start dates are correctly computed to never precede their predecessor's
    end date (verified e.g. Requirements Sign-off starts day 5 = max(4,5); Integration
    Testing starts day 33 = max(33,30); User Acceptance Testing starts day 38 = max(38,32))
  - 'First categorical series is #009E73 brand green (Requirements group), with Design/Development/Testing
    following Imprint palette canonical order (lavender, blue, ochre); data colors
    identical across light/dark, chrome (title, ticks, grid, arrow color) correctly
    theme-adaptive via t.ink/t.inkSoft/t.grid'
  - Deterministic, realistic software-delivery-sprint scenario with a mix of single-
    and multi-predecessor dependencies (10-50 task range respected)
  - 'animation: false set, single canvas mounted to #container, current Chart.js 4.x
    API used correctly (no deprecated options)'
  weaknesses:
  - At the ~400px mobile thumbnail, the 13 indented task-row labels and x-axis date
    ticks shrink to the point of being hard to read due to row density — consider
    slightly larger row/tick fonts or increasing row height relative to canvas height.
  - Dependency elbow connectors sometimes route through/near unrelated task rows on
    their way to the target (e.g. the Frontend Build → Integration Testing connector
    crosses near the Auth Integration row) — spec asks that 'arrows should avoid overlapping
    task bars where possible'; consider offsetting the elbow midpoint per-arrow to
    reduce crossings.
  - Y-axis has no explicit axis title (relies on the task-name category labels alone)
    — acceptable for a categorical Gantt axis but keeps VQ-06 short of a 'with units'
    top score.
  - Design Excellence is solid (semantic per-group color, header/task hierarchy) but
    not yet at publication-ready polish — grid/whitespace refinement and a touch more
    visual emphasis on the critical path would push Design Excellence higher.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Software Delivery Plan · gantt-dependencies · javascript · chartjs · anyplot.ai" is bold dark ink, centered, comfortably within canvas bounds (no clipping/overflow). Y-axis shows bold group headers (REQUIREMENTS, DESIGN, DEVELOPMENT, TESTING) in dark ink and indented task names in softer gray ink, both readable. X-axis shows date ticks (Feb 2 .. Mar 19) and axis title "Project Timeline (2026)" in dark/soft ink, subtle vertical gridlines. All text clearly readable against the light background.
      Data: Group task bars colored green (Requirements), lavender (Design), blue (Development), ochre (Testing) — first series is #009E73 brand green, matching Imprint canonical order. Hollow colored-border bars above each group show the aggregate group span. Dark elbow connector lines with small triangular arrowheads route from each predecessor's end to each successor's start, correctly reflecting the dependsOn data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, now light-colored ink, fully readable. Group headers and task labels rendered in light ink / soft light-gray, both legible against the dark background. Axis ticks, axis title, and gridlines flipped to light tones with no dark-on-dark text anywhere. Dependency connector lines flipped from dark ink to light ink (t.inkSoft), remaining clearly visible against the dark canvas.
      Data: Bar colors identical to the light render (green/lavender/blue/ochre) — only chrome flipped, confirming palette consistency across themes.
      Legibility verdict: PASS
