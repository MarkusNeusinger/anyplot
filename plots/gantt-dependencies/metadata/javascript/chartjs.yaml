review:
  strengths:
  - Dependency elbow connectors now route their vertical segment through a day offset
    free of unrelated task bars (freeElbowX), directly fixing the prior attempt's
    overlap-avoidance weakness
  - Critical-path detection (walking back from the last-finishing task via the latest-finishing
    predecessor) is rendered with heavier, darker connectors, giving the chart a clear
    point of view on which chain drives the schedule
  - Axis tick, axis title, and y-row fonts all increased versus the previous attempt
    (13/14/15px -> 15/16/16px), tightening legibility at both full canvas size and
    mobile thumbnail scale
  - Group aggregate spans (hollow, colored-border bars) correctly computed as min/max
    of member task dates, with bold headers and indented children making the group/task
    hierarchy explicit
  - 'First categorical series is #009E73 brand green, remaining groups follow Imprint
    canonical order; data colors identical across light/dark renders, chrome (title,
    ticks, grid, connector ink) correctly theme-adaptive'
  - All dependent task start dates verified correct - never before the latest-finishing
    predecessor (e.g. Requirements Sign-off starts day 5 = max(4,5); Integration Testing
    starts day 33 = max(33,30); User Acceptance Testing starts day 38 = max(38,32))
  - Idiomatic Chart.js floating-bar technique for the Gantt layout combined with a
    distinctive low-level canvas plugin (afterDatasetsDraw) for the dependency arrows
    - leverages the library's plugin architecture rather than faking the feature
  weaknesses:
  - At the ~400px mobile thumbnail the 17-row list (4 group headers + 13 tasks) is
    still tight to read despite the larger fonts this attempt - an inherent density
    tradeoff of a 13-task Gantt rather than a simple sizing fix.
  - The critical-path line-weight distinction (ink width 3 vs inkSoft width 2) is
    a nice touch but the two connector styles are subtle to tell apart at a glance
    in the full-size render; a small color or dash difference in addition to weight
    would make the critical chain pop more.
  - Y-axis has no explicit axis title (relies on the task-name category labels alone)
    - acceptable for a categorical Gantt axis, keeps VQ-06 just short of the absolute
    top tier.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Software Delivery Plan · gantt-dependencies · javascript · chartjs · anyplot.ai" is bold dark ink, centered, comfortably within canvas bounds (no clipping/overflow, no edge cropping). Y-axis shows bold group headers (REQUIREMENTS, DESIGN, DEVELOPMENT, TESTING) in dark ink and indented task names in softer gray ink, both readable at full size. X-axis shows date ticks (Feb 2 .. Mar 19) and axis title "Project Timeline (2026)" in dark/soft ink, subtle vertical gridlines only (no horizontal grid clutter).
      Data: Group task bars colored green (Requirements), lavender (Design), blue (Development), ochre (Testing) - first series is #009E73 brand green, matching Imprint canonical order. Hollow colored-border bars above each group show the aggregate group span. Elbow connector lines with small triangular arrowheads route from each predecessor's end to each successor's start; the connectors along the critical chain (Gather Requirements -> Requirements Sign-off -> System Architecture -> Database Schema -> API Development -> Auth Integration -> Integration Testing -> User Acceptance Testing) are drawn heavier and darker than the non-critical branches (Stakeholder Interviews, UI/UX Design -> Frontend Build, Data Pipeline -> Unit Testing).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, now light-colored ink, fully readable, no clipping. Group headers and task labels rendered in light ink / soft light-gray, both legible against the dark background - no dark-on-dark text anywhere. Axis ticks, axis title, and gridlines flipped to light tones.
      Data: Bar colors identical to the light render (green/lavender/blue/ochre) - only chrome flipped, confirming palette consistency across themes. Dependency connectors flipped from dark ink to light ink/soft-light, remaining clearly visible against the dark canvas with the critical-path chain still visually heavier than the rest.
      Legibility verdict: PASS
