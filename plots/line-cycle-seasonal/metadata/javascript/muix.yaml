review:
  strengths:
  - 'Single shared panel built on one linear x axis with null breaks (connectNulls:
    false), so no line joins neighbouring months and all twelve mean levels compare
    on one y scale'
  - Mean lines are thick round-capped lavender bars that overhang each group slightly,
    clearly distinct from the thin green subseries in both themes
  - Location-aware valueFormatter shows month names on the ticks and 'Month Year'
    labels in the HTML tooltip
  - Computed subtitle (observation count, year span, range of group means) adds context
    derived from the data rather than typed numbers
  - 'Clean v9 API use: [data-series] CSS selectors, slotProps.legend.sx, explicit
    axis height/width, skipAnimation'
  weaknesses:
  - 'Suggestion: the legend''s mean entry uses MUI X''s default thin line sample,
    but the mean bars are drawn at 4.5 px; a thicker legend mark would match the plotted
    weight.'
  - 'Suggestion: the 64 px x-axis band leaves the "Month" title a little far from
    the tick labels; a tighter band would bring it closer.'
