review:
  strengths:
  - 'Correct standard barb geometry: each staff starts at the station position and
    points upwind (arctan2(-v, -u)), feathers sit at the far end, all on the left
    side of the staff looking downwind (Northern Hemisphere), and speeds round to
    the nearest 5 kt into pennants, full barbs and half barbs'
  - 'The example data covers the whole notation: a cyclonic low over the US Plains
    whose center station is calm (open circle, no staff), two pennant barbs (50 and
    55 kt) in the strong south-west quadrant, and many full and half barb mixes elsewhere,
    all turning counterclockwise around the low'
  - Staff, feather and pennant lengths come from the median station spacing, so the
    56 barbs stay apart and every feather can be counted in both themes
  - match_aspect=True keeps the barb angles true in data space, and all line segments
    are batched into one multi_line glyph and all pennants into one patches glyph
    from ColumnDataSource
  - The notation key is a bokeh Title layout placed below the plot in INK_SOFT at
    30 pt, and decodes half barb, full barb, pennant and calm without competing with
    the data
  - 'Theme chrome is correct in both renders: #FAF8F1 and #1A1A17 backgrounds, INK
    title and axis labels, INK_SOFT ticks and key, subtle dashed grid; the barbs are
    #009E73 in both themes'
  weaknesses:
  - 'Suggestion: draw the key with sample glyphs (one half barb, one full barb, one
    pennant and a calm circle beside their values) instead of text only, so the reader
    matches shape to value directly.'
  - 'Suggestion: label the longitude axis as degrees east, for example "Longitude
    (°E)", to match the "Latitude (°N)" label, since the tick values are negative.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area; a thin INK_SOFT outline frames the plot area.
      Chrome: bold dark title "windbarb-basic · python · bokeh · anyplot.ai" top left (about 60 % of the width); italic dark axis labels "Longitude (°)" and "Latitude (°N)"; dark-grey tick labels -104 … -90 and 30 … 44; a subtle dashed grid; a centered dark-grey key below the x-axis label: "Half barb = 5 kt · Full barb = 10 kt · Pennant = 50 kt · Open circle = calm (< 2.5 kt)". All text readable.
      Data: 8 × 7 = 56 stations in #009E73. 55 wind barbs, plus one open circle at (-97, 39) near the low center. The barbs rotate counterclockwise around that center: southerly east of it, westerly south of it, northerly to the north-west. Two filled triangular pennants appear at (-99, 35) and (-97, 35), the second with an added half barb. Elsewhere there are mixes of one to five full barbs and half barbs, all on one side of the staff. No barbs collide.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, with a light-grey plot outline.
      Chrome: title and axis labels in near-white INK, ticks and key in light grey INK_SOFT, dashed grid subtle but visible. No dark-on-dark text; everything readable.
      Data: identical to the light render. Same #009E73 barbs, pennants and calm circle at the same positions; only the chrome flips. Brand green reads clearly on the dark surface.
      Legibility verdict: PASS
