review:
  strengths:
  - 'Wind barbs are correct in every component: staffs point toward the direction
    the wind blows FROM, speeds round to the nearest 5 kt and break down into pennants,
    full and half barbs on the Northern Hemisphere side, and a lone half barb sits
    one step in from the tip as the standard notation asks'
  - Calm stations (< 2.5 kt) are drawn as open circles with no staff at (4, 8) and
    (10, 4), so all four notation elements (half, full, pennant, calm) appear in the
    example data
  - Staff length is derived from the median nearest-station spacing (0.45x), so neighboring
    barbs stay apart on any grid the reader supplies
  - All barbs are batched into one multi_line and one patches glyph from ColumnDataSource,
    and match_aspect=True keeps barb angles true to the wind direction
  - A one-line key below the plot decodes the notation (5 / 10 / 50 kt, calm circle)
    in INK_SOFT, readable in both themes
  weaknesses:
  - 'DQ-02 (both): the axes read "X Position (grid units)" / "Y Position (grid units)"
    and u, v are drawn independently from uniform(-30, 30) per station, so neighboring
    stations blow in unrelated directions, which no real surface wind field does →
    give the stations a real-world frame (for example longitude/latitude in degrees,
    or km east/north of a site) and derive u, v from a spatially coherent field such
    as a pressure-system rotation plus a mean flow. Likely cause: np.random.uniform
    for u and v and the generic X_POS/Y_POS labels.'
  - 'VQ-05 (both): match_aspect on the square canvas pads the y range to about −2
    to 10 for data that spans about −1 to 9, which leaves an empty band of roughly
    8 % of the plot height below the lowest barbs and above the top row → fit the
    range to the barb extent (about −1.3 to 9.3) or set explicit x_range/y_range with
    matching spans. Likely cause: match_aspect=True with auto-ranging on a 2400×2400
    frame.'
  - 'Suggestion: a slightly heavier staff (about 6 px) would keep the half barbs crisper
    in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across page and plot area.
      Chrome: bold dark title "windbarb-basic · python · bokeh · anyplot.ai" (~58 % width) top-left; italic axis titles "X Position (grid units)" and "Y Position (grid units)"; grey tick labels 0–10 (x) and −2–10 (y); subtle dashed grid; thin INK_SOFT frame; a centered key below the x-axis title "Half barb = 5 kt · Full barb = 10 kt · Pennant = 50 kt · Open circle = calm (< 2.5 kt)". All text readable.
      Data: 30 stations on a 6×5 grid, all in brand green #009E73: 28 barbs with staffs from the station point, feathers on one side, two filled triangular pennants at (8, 4) and (8, 6), and two open calm circles at (4, 8) and (10, 4). No barbs touch each other. Empty band below y ≈ −1.2 and above y ≈ 9.
