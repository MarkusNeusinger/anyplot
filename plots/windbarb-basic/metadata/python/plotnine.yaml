      Data: 30 stations on a 6x5 grid in #009E73: station dots with staffs, half/full feathers on one side, two filled pennants at (6, 4) and (4, 6), open calm circles at (0, 0), (10, 0) and (10, 4); feathers of neighbouring barbs tangle around (7, 1), (5.5, 6.4), (8.5, 7.3); the right third of the panel (x 12-17) is empty except for the key
      Legibility verdict: PASS

