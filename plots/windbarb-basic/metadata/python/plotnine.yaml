review:
  strengths:
  - 'Barb notation built from plotnine layers: geom_segment staffs and feathers, geom_polygon
    filled pennants, open geom_point calm circles, all on one side of the staff'
  - Axis limits are derived from every drawn mark, so no station's barb is dropped
    at the border
  - 'Theme tokens threaded through all chrome: readable in both renders, data color
    identical'
  - Data block follows the adaptable-code zones with named column constants and a
    CALM_KT constant
  weaknesses:
  - 'SC-02, SC-03 (both): every staff points to where the wind blows to (arrow convention),
    e.g. (u, v) = (45, 35) at (6, 4) points north-east → toward the direction the
    wind blows from, the opposite side (180° flip). Likely cause: ux = -sin(dir),
    uy = -cos(dir) with dir = arctan2(-u, -v) gives the downwind unit vector; use
    ux = sin(dir), uy = cos(dir) (and keep px, py derived from it).'
  - 'VQ-03, SC-02 (both): neighbouring barbs cross and their feathers merge around
    (7, 1) (stations (6, 0), (8, 0), (8, 2)), (5.5, 6.4) ((4, 6) and (6, 6)) and (8.5,
    7.3) ((8, 8) and (10, 8)), so those barbs cannot be counted → keep every staff
    shorter than about half the 2° station spacing (about −40 %). Likely cause: staff_len
    = speed * 0.06 capped at 0.3 * y_span (2.4 units) for a 2-unit grid.'
  - 'VQ-05 (both): the x axis runs to 17 with a tick at 15 while the stations end
    at 10, leaving the right third of the panel empty except for the key → end the
    x range just past the last drawn mark and place the key outside the panel or in
    a margin. Likely cause: scale_x_continuous upper limit x_hi + 0.45 * x_span.'
  - 'DQ-02 (both): each station''s wind is independent uniform noise, so stations
    2° apart blow in unrelated directions, which no surface wind field shows → a spatially
    coherent field (for example a circulation around one low with speed varying smoothly).
    Likely cause: np.random.uniform for u and v per station.'
  - 'Suggestion: draw the key''s barbs with the same geoms as the data instead of
    text glyphs, so a half and a full barb differ in length as they do on the map.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
