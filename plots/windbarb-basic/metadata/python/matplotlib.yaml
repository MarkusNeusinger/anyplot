review:
  strengths:
  - Native ax.barbs with barb_increments (half=5, full=10, flag=50) produces the standard
    notation, upwind staffs and calm circles
  - A coherent westerly wind field over a real station grid with three calm and three
    pennant observations
  - Theme tokens threaded through all chrome; both renders read cleanly
  weaknesses:
  - 'VQ-05 (both): the canvas is 4766x2670, not a canonical size → 3200x1800. Likely
    cause: figsize=(16, 9) at dpi=300 with bbox_inches="tight"; use figsize=(8, 4.5),
    dpi=400 and no tight bbox.'
  - 'VQ-02 (both): the key box covers the (128,25) and (129,25) barbs so their feathers
    cannot be read → place the key where no barb sits. Likely cause: ax.text at (0.98,
    0.02) in axes coordinates inside the barb grid.'
  - 'SC-04 (both): the key shows a full barb as two short strokes ("╲╲ = 10 kt"),
    which reads as two half barbs; half and full barbs differ by length, not by count
    → show a long stroke for 10 kt beside a short one for 5 kt. Likely cause: the
    box-drawing characters in legend_text.'
  - 'CQ-01 (code): no column constants and the Data block ends with array assignments
    instead of binding one DataFrame df; the plot reads LON, LAT, U, V → column constants
    with role comments and a Data block ending in df that the plot reads. Likely cause:
    arrays passed straight to ax.barbs.'
  - 'Suggestion: draw the key''s symbols as real barbs so the key matches the marks
    exactly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; the canvas is 4766x2670.
      Chrome: title "windbarb-basic · python · matplotlib · anyplot.ai" in dark ink, axis titles "Longitude (°E)" and "Latitude (°N)", tick labels 120-128 and 25-30, top and right spines removed, subtle grid. A rounded monospace key at the bottom right inside the barb grid.
      Data: 60 barbs on a 10x6 grid in brand green #009E73 with half barbs, full barbs, filled pennants at (122,26), (128,28), (125,30) and open calm circles at (120,25), (125,27), (125,29). The key box covers the (128,25) and (129,25) barbs.
