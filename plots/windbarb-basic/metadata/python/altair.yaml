review:
  strengths:
  - Calm stations drawn as open brand-green circles with no staff
  - Pennants, full and half barbs all on the left of the staff, as the Northern Hemisphere
    convention asks
  - Subtitle key decodes the barb notation; tooltips with speed and direction in the
    HTML
  weaknesses:
  - 'VQ-07 (both): wind speed colored with the cividis colormap → imprint_seq (#009E73
    -> #4467A3). Likely cause: alt.Scale(scheme=''cividis'').'
  - 'VQ-05 (both): canvas is 5043x3072, not 3200x1800, and 0.2-degree ticks crowd
    both axes → size the view at 620x320 with scale_factor 4 and use whole-degree
    ticks. Likely cause: oversized view and default tick count.'
  - 'VQ-01 (both): legend title and labels render at about a third of the axis tick
    size → explicit legend font sizes near the tick size. Likely cause: no configure_legend
    label/title font sizes.'
  - 'VQ-02 (both): x tick labels collide at the ends (''−1.0−0.6'', ''10.6 11.0'')
    → fewer ticks (whole degrees). Likely cause: default tick density on a 12-unit
    domain.'
  - 'VQ-03, VQ-04 (dark): the navy low-speed barbs at 0°E 6°N and 0°E 8°N nearly vanish
    on #1A1A17, and their staffs are only a few px long → a ramp step that contrasts
    with both backgrounds and a fixed staff length. Likely cause: cividis low end
    and staff length = speed * 0.03.'
  - 'SC-02 (both): C4 missed — the half barbs on the 5-10 kt staffs are a few px and
    not countable → one fixed staff length for every barb. Likely cause: staff_len
    = spd * SCALE.'
  - 'SC-03 (both): x and y data units differ on screen (about 156 vs 109 px), so directions
    bend toward horizontal by up to ~10° → scale the y offsets by the pixel aspect.
    Likely cause: offsets computed in raw data units.'
  - 'SC-01 (both): color encodes wind speed, a derived variable the -basic spec does
    not ask for → one Imprint color for all barbs. Likely cause: speed_color on every
    layer.'
  - 'DQ-02 (both): u and v are independent uniform draws per station, so neighbours
    point in unrelated directions → a smooth wind pattern plus small noise. Likely
    cause: np.random.uniform for u and v.'
  - 'CQ-04 (code): the `if len(barb_df) > 0 … else` and `if len(pennant_df) > 0 …
    else` fallbacks can never run with this data → delete them. Likely cause: defensive
    branches for empty frames.'
