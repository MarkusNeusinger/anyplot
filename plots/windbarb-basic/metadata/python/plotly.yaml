review:
  strengths:
  - 'Barb geometry follows the standard notation: staffs point toward where the wind
    comes from, half barbs, full barbs and filled triangular pennants add up to the
    rounded speed in knots, all on one side of the staff, and the three calm stations
    are open circles with no staff'
  - The barb key is a second plotly axis pair locked to the map with scaleanchor,
    so each key sample (calm, 5, 10, 50, 65 kt) is drawn with the same barb code at
    exactly the map's scale
  - Barb size and map extent derive from the station spacing (scipy cdist nearest-neighbour
    median) and from every drawn point, so the 60 barbs sit clear of each other and
    none is cut at the axis edge
  - 'Idiomatic plotly geometry: None-separated line traces for staffs and feathers,
    fill=''toself'' for pennants, scaleanchor for an equal-aspect lon/lat map'
  - 'Native hover in the HTML output: each station dot answers with speed in kt and
    direction in degrees via customdata and hovertemplate, while the key panel is
    excluded from hover'
  - 'Theme tokens threaded through title, axis titles, ticks, axis lines and grid;
    the barbs keep #009E73 in both renders'
  weaknesses:
  - 'VQ-03 (both): on the storm barbs (around 4.6°E 53.8°N and 10.6°E 55.7°N) and
    the key''s 65 kt sample the full and half barbs start right at the pennant''s
    base, so the feathers merge into the triangle and are hard to count → leave at
    least one feather step of clear staff between the pennant base and the first barb.
    Likely cause: along += flag_base + 0.4 * step after a pennant.'
  - 'DQ-02 (both): the three 55–70 kt storm stations (indices 12, 38, 55) are isolated
    points surrounded by 15–25 kt neighbours, a wind field no real pressure system
    produces → let the strong winds come from a coherent feature such as a gradient
    toward one corner of the grid. Likely cause: u[storm_stations] and v[storm_stations]
    set on scattered indices.'
  - 'Suggestion: the empty space below the barb key could hold a short line on the
    station network or the date of the observation.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across paper and plot area.
      Chrome: title "windbarb-basic · python · plotly · anyplot.ai" centred in dark ink, about 38% of the width; axis titles "Longitude (°E)" and "Latitude (°N)" in dark ink, tick labels (4–12, 53–58) in INK_SOFT; subtle grey grid, left and bottom axis lines only. "Barb key" panel at the right with five samples (calm circle, half barb 5 kt, full barb 10 kt, pennant 50 kt, 50+10+5 = 65 kt) and grey labels. All readable.
      Data: 10 x 6 station grid, every barb in #009E73 with a dot at the station; mostly westerly to south-westerly staffs with 1–3 feathers, three filled pennants on storm stations (5°E 54°N, 11°E 56°N, 8°E 58°N), three open calm circles (3°E 53°N, 8°E 55°N, 8°E 57°N). Neighbouring barbs stay apart; feathers next to the pennants crowd the triangles.
      Legibility verdict: PASS

