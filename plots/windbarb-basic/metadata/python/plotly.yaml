review:
  strengths:
  - 'Correct meteorological notation: staffs point upwind, half/full barbs and filled
    triangular pennants on the Northern-Hemisphere side, 5 kt rounding, calm stations
    as open circles without a staff'
  - The barb key is a second subplot locked to the map's scale via scaleanchor, so
    each key sample is exactly the size of the map's barbs
  - Barb geometry is derived from the measured nearest-neighbour station spacing,
    keeping neighbouring barbs apart
  - Equal-aspect map (scaleanchor/scaleratio) with the range padded from the drawn
    geometry, so no feather is cut
  - HTML hover reports speed and meteorological direction per station via customdata
    hovertemplate
  weaknesses:
  - 'VQ-03 (both): lone half barbs (e.g. the stations at 9°E 5°N and 8°E 5°N, and
    the key''s 5 kt sample) render as stubs only a few pixels long at 1.8 px stroke
    and are hard to spot or count → half barbs clearly readable as half the full-barb
    length (about +30 % feather length or +0.6 px stroke). Likely cause: feather =
    0.4 * staff with half barbs at feather / 2 and line width 1.8.'
  - 'DQ-02 (both): the stations sit on a bare integer grid at 0–9°E, 0–5°N with no
    place context, which reads as an abstract grid → a plausible station network region
    (e.g. real longitude/latitude span of a coastal area) with matching axis ranges.
    Likely cause: np.arange(0, 10) / np.arange(0, 6) for lon and lat.'
  - 'Suggestion: the empty space below the barb key could be tightened by aligning
    the key vertically with the map''s center.'
