review:
  strengths:
  - 'Full standard notation built from go.Scatter traces: None-separated line segments
    for staffs and feathers, fill=''toself'' triangles for pennants, speeds rounded
    to 5 kt and decomposed into pennants, full and half barbs on the Northern-Hemisphere
    left side, staffs pointing upwind'
  - Calm stations below 2.5 kt drawn as open circles without a staff (two in the south-east
    ridge), so every notation element of the spec appears in the data
  - The barb key is a second subplot locked to the map's scale with scaleanchor, so
    its samples (calm, 5, 10, 50, 65 kt) are drawn by the same code at exactly the
    map's size
  - Barb geometry derived from the median nearest-neighbour station spacing and an
    equal-aspect map, keeping all 60 barbs clear of their neighbours
  - Hover reports speed and meteorological direction per station via customdata and
    hovertemplate in the HTML output
  - Plausible North Sea / Denmark station grid with a gale in the north-west and a
    calm ridge in the south-east, giving a readable speed gradient
  - Theme tokens threaded through title, axis titles, ticks, axis lines, grid and
    key text; both renders read cleanly
  weaknesses:
  - 'Suggestion: the map occupies only the left three quarters while the space below
    the key stays empty; a slightly larger map domain would use the canvas better.'
  - 'Suggestion: key labels at 10 px could go to 11 px so the decoding text holds
    up better in the 400 px thumbnail.'
