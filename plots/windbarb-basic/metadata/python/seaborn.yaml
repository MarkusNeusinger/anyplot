review:
  strengths:
  - Canonical 3200x1800 canvas with style-guide font sizes; every feather and pennant
    countable in both themes
  - Calm stations (<2.5 kt) drawn as open circles without a staff, threshold and increments
    named as constants
  - imprint_seq applied correctly with theme-identical data colors and fully themed
    colorbar chrome
  - 'Adaptable structure: column constants and a tidy df; axis limits derived from
    the data extent'
  - One-line footer key decodes calm, half barb, full barb and pennant values
  weaknesses:
  - 'SC-01 (both): barbs are color-mapped by the derived wind speed with a colorbar,
    an encoding the -basic spec does not ask for (the barbs'' feathers already encode
    speed) → draw all barbs in one color (#009E73 or INK) and drop the colorbar. Likely
    cause: the speed array passed as the fifth positional argument of ax.barbs with
    cmap=imprint_seq, and fig.colorbar.'
  - 'SC-02 (both): staffs are centered on the station position (C1: staff anchored
    at the observation''s x and y) → anchor the staff end at the station. Likely cause:
    ax.barbs(..., pivot=''middle'') instead of the default pivot=''tip''.'
  - 'CQ-04 (code): IMPRINT_PALETTE on line 24 is defined but never used → delete it
    or use IMPRINT_PALETTE[0] for a single barb color. Likely cause: leftover palette
    constant.'
  - 'Suggestion: sns.scatterplot could also place a faint station marker under every
    barb to show the anchor point.'
