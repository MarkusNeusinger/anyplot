review:
  strengths:
  - 'Barb geometry correct: upwind staffs, pennants/full/half barbs on one side adding
    up to the speed'
  - Subtitle key decodes the notation, which the spec allows
  - Calm stations drawn as empty open rings without a staff
  - Theme tokens applied throughout; both renders readable
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800×2700, not one of the canonical 3200×1800 / 2400×2400
    sizes, and coord_fixed leaves transparent bands at both sides → ggsize(800, 450)
    with scale=4. Likely cause: ggsize(1600, 900) with scale=3.'
  - 'SC-01 (both): barbs are coloured by a derived speed category (Light/Moderate/Strong)
    with a ''Wind Speed'' legend, an encoding the -basic spec does not ask for → draw
    every barb in #009E73 and drop the legend. Likely cause: a speed-category colour
    mapping on the segment layer.'
  - 'SC-01 (both): a ''~54 kts (pennant)'' callout floats above the two pennant stations,
    a callout the -basic spec excludes → remove it. Likely cause: a geom_text annotation
    layer.'
  - 'VQ-07 (both): the ordered speed categories use green, amber and vermillion instead
    of ordered steps of one Imprint ramp → removing the derived colour channel resolves
    it. Likely cause: a manual colour scale over the categories.'
  - 'CQ-04 (code): lines 157–159 add a separate geom_polygon layer per pennant in
    a loop → one geom_polygon over a single pennant DataFrame with aes(group=pennant_id).
    Likely cause: pennants stored as per-triangle dicts.'
  - 'Suggestion: lets-plot tooltips on the staff layer could show speed and direction
    per station in the HTML output.'
