review:
  strengths:
  - 'Barb geometry correct: upwind staffs, pennants, full and half barbs on one side
    adding up to the speed'
  - Subtitle key decodes the notation, which the spec allows
  - Calm stations drawn as empty open rings without a staff
  - Theme tokens applied to chrome; both renders readable
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800×2700, not one of the canonical 3200×1800 / 2400×2400
    sizes, and coord_fixed leaves transparent bands at both sides → ggsize(800, 450)
    with scale=4 and the page colour across the full canvas. Likely cause: ggsize(1600,
    900) with scale=3.'
  - 'SC-01 (both): barbs are coloured by a derived speed category (Light/Moderate/Strong)
    with a ''Wind Speed'' legend, an encoding the -basic spec does not ask for → draw
    every barb in #009E73 and drop the legend. Likely cause: a speed-category colour
    mapping on the barb layers.'
  - 'SC-01 (both): a ''~54 kts (pennant)'' callout floats above the two pennant stations,
    a callout the -basic spec excludes → remove it. Likely cause: a geom_text annotation
    layer.'
  - 'VQ-07 (both): the ordered speed categories use green, amber and vermillion instead
    of ordered steps of one Imprint ramp, and the side bands are transparent instead
    of #FAF8F1 / #1A1A17 → removing the derived colour channel and painting the full
    canvas resolves it. Likely cause: a manual colour scale over the categories and
    the coord_fixed plot background.'
  - 'CQ-04 (code): a separate geom_polygon layer is added per pennant in a loop →
    one geom_polygon over a single pennant DataFrame with aes(group=pennant_id). Likely
    cause: pennants stored as per-triangle dicts.'
  - 'DQ-02, DQ-03 (both): the station grid spans 0–140 °E and 0–100 °N, so the top
    row sits at 100 °N (beyond the 90 °N pole) and a 140°-wide grid is not a plausible
    surface-station network → place the grid in a real region at a plausible extent
    (for example 30–60 °N). Likely cause: np.linspace(0, 140, n_x) and np.linspace(0,
    100, n_y).'
  - 'Suggestion: lets-plot tooltips on the staff layer could show speed and direction
    per station in the HTML output.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 panel; 4800x2700 canvas with transparent bands at both sides
