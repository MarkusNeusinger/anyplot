review:
  strengths:
  - 'Standard notation drawn correctly: pennants, full and half barbs summed from
    round(speed/5)*5, all on the left of the staff, staff pointing to the wind''s
    origin'
  - Calm stations drawn as an open circle without a staff, and a key decodes 5/10/20/50
    kt and calm
  - Barbs positioned with pygal's own view.x/view.y transform so they sit exactly
    on the station grid
  - Degree tick formatting via x_value_formatter / value_formatter; theme tokens threaded
    through the Style in both renders
  weaknesses:
  - 'CQ-01 (code): lines 59–125 hold all barb and key drawing in a `barb_elems` helper
    and a `class WindBarbXY(pygal.XY)` with `__init__`, `_draw` and `_draw_key`, and
    a class cannot be adapted by the agent chat → draw the barbs at the top level
    without a subclass. Likely cause: a pygal subclass used to reach the view transform,
    with the key split into its own method.'
  - 'Suggestion: set the key labels in the chart''s font instead of a hard-coded sans-serif,
    so they match the monospace tick labels.'
  - 'Suggestion: a lone 5 kt half barb is conventionally set one spacing in from the
    staff tip.'
