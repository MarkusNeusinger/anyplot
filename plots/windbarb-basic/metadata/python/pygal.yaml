review:
  strengths:
  - 'Meteorologically correct barbs: staffs point to the from-direction recovered
    from u/v, 5/10/50 kt feathers summed from the rounded speed, feathers on the Northern-Hemisphere
    side, calm stations as open circles without staff'
  - Barbs are positioned with pygal's own data-to-pixel view, so every station sits
    exactly on its latitude/longitude grid crossing
  - x_value_formatter / value_formatter turn numeric ticks into 125°W / 40°N labels
    idiomatically
  - 'Complete theme tokens: identical green marks on #FAF8F1 and #1A1A17, readable
    chrome in both renders'
  - Notation key in the bottom margin decodes 5, 10, 20, 50 kt and calm with the same
    glyphs as the data
  weaknesses:
  - 'CQ-01 (code): a barb_elems() helper plus a WindBarbXY subclass with __init__,
    _draw and _draw_key break the flat Imports → Data → Plot → Save structure → keep
    only the one _draw override pygal needs for its view transform and fold the key
    drawing into it. Likely cause: the key drawing split into its own method and the
    barb geometry wrapped in a helper.'
  - 'Suggestion: set the key labels in pygal''s chart font instead of a hard-coded
    sans-serif, so they match the monospace tick labels.'
  - 'Suggestion: a lone 5 kt half barb is conventionally set in one spacing from the
    staff tip, which would make light winds read more like standard station plots.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "windbarb-basic · python · pygal · anyplot.ai" in dark ink at top centre; "Latitude" (rotated) and "Longitude" axis titles; tick labels 25°N–55°N and 125°W–70°W aligned with dotted grid lines on every station row and column; all dark text, readable.
      Data: 84 green #009E73 barbs on a 12x7 station grid circling a low near 100°W 40°N: half/full barbs on the western and eastern flanks, pennants near the centre, two open calm circles (80°W 40°N, 75°W 25°N). Key below the axis: 5, 10, 20, 50 kt sample barbs and "Calm (<2.5 kt)" in muted ink.
