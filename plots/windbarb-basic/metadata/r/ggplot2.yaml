review:
  strengths:
  - Complete meteorological barb geometry in ggplot2 with staffs pointing upwind,
    half/full barbs and a pennant branch, all on the NH clockwise side
  - Notation key carried in the subtitle decodes the symbology without an extra legend
    layer
  - Theme tokens threaded through every text and line element; data color identical
    in both renders
  - Physically motivated Rankine-vortex cyclone with inflow gives a coherent counterclockwise
    circulation
  weaknesses:
  - 'DQ-01 (both): no station reaches 50 kt (the inflow mix scales the 55 kt peak
    to about 47 kt), so the pennant, a third of the notation, never appears → let
    at least a few stations near the radius of maximum wind exceed 50 kt (about +8
    kt at the peak). Likely cause: max_spd = 55 multiplied by the non-unit (1 - inflow,
    inflow) blend, |v| ≈ 0.86·speed_kt.'
  - 'SC-03 (both): 1° of longitude spans about 97 px but 1° of latitude about 71 px,
    so staffs drawn in degree space are rotated up to about 9° from their true direction
    and feathers are not perpendicular → equal or map-correct aspect. Likely cause:
    coord_cartesian() without coord_quickmap()/coord_fixed().'
  - 'CQ-01 (code): a make_barb_geometry() function called through lapply builds the
    geometry → flat vectorised computation of the staff, barb and pennant coordinates.
    Likely cause: per-station helper function.'
  - 'Suggestion: a lightweight coastline/map background (allowed by the Notes) would
    anchor the stations geographically.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: bold title 'Surface Winds · windbarb-basic · r · ggplot2 · anyplot.ai', muted subtitle key 'half barb = 5 kt · full barb = 10 kt · pennant = 50 kt', axis titles Longitude/Latitude in dark ink, tick labels 80°W-60°W and 35°N-45°N in INK_SOFT, subtle major grid, L-shaped axis lines; all readable
      Data: 63 green #009E73 wind barbs on a 9x7 station grid, each with a station dot; staffs point upwind around a counterclockwise cyclone near 70°W 41°N; 1-4 full barbs plus half barbs, no pennants (max ~47 kt), no calm stations
