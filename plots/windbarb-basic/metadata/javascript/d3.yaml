review:
  strengths:
  - Physically realistic Rankine combined vortex wind field (solid-body core, irrotational
    decay outside) produces a genuinely convincing meteorological pattern — calm eye,
    peak tangential speed at the core edge, tapering outward.
  - 'Correct meteorological wind barb notation across the full range: calm open circle,
    half barb (5 kt), full barb (10 kt), and pennant (50 kt), confirmed via zoomed
    pixel inspection of the highest-speed stations near the vortex core.'
  - The drawBarb helper is reused unmodified to render both the map glyphs and the
    legend key glyphs, keeping the legend visually and geometrically consistent with
    the plotted data.
  - Theme-adaptive chrome correctly threaded through axes, title, subtitle, and the
    legend callout box (elevated background token) in both renders; the single data
    color stays identical Imprint green in light and dark.
  - Legend box uses the Imprint elevated-surface/rounded-corner treatment, staying
    legible without a heavy frame.
  weaknesses:
  - Geographic lon/lat coordinates are projected with plain d3.scaleLinear rather
    than a d3-geo projection; the spec explicitly suggests 'a map projection background
    for geographic data'. At this small regional extent (~9°x7°) the distortion is
    negligible, but it's a missed idiomatic-d3 opportunity rather than a true geographic
    projection.
  - No direct annotation marks the calm-circle station as the low-pressure center/storm
    eye — a short callout label would strengthen the data-storytelling read for viewers
    unfamiliar with vortex wind fields.
  - Legend text (13px) is the smallest text tier in the chart; on the 400px-wide mobile
    thumbnail it sits close to the edge of comfortable legibility — a 1-2px bump would
    give more headroom.
  - In the densest pennant cluster (northern rows, ~50-55 kt stations), adjacent barb
    glyph tips come close to neighboring glyphs without actually touching — fine at
    full resolution, worth watching if station spacing is ever tightened.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: bold dark title "windbarb-basic · javascript · d3 · anyplot.ai" centered at top, gray subtitle below it, dark "Longitude"/"Latitude" axis titles, gray degree-labeled tick labels (10°E-18°E, 45°N-51°N), thin gray axis domain lines. A rounded legend box on the right ("Wind speed key") with dark bold header and gray row labels for Calm / Half barb / Full barb / Pennant.
      Data: a 9x7 grid of wind barbs, all rendered in the single Imprint brand green (#009E73), arranged in a clear cyclonic (spiral) pattern around a visible open-circle "calm" station near (14°E, 48°N) — the vortex eye. Staff length is constant per station; barb/pennant count encodes wind speed, correctly ranging from single full-barb light-wind stations at the periphery up to single-pennant (50 kt) glyphs near the core edge (verified via zoomed crop).
      Legibility verdict: PASS — all title, subtitle, axis, tick, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: same layout as the light render with light/off-white title and axis text, lighter-gray subtitle and tick labels, and a dark elevated legend box (visually distinct from the page background) with light text.
      Data: identical green (#009E73) barb glyphs in identical positions/rotations/speed-notation as the light render — only chrome (background, text, legend box fill, grid/domain lines) flips; data colors are unchanged between themes as required.
      Legibility verdict: PASS — all title, subtitle, axis, tick, and legend text is clearly readable against the dark background; no dark-on-dark failures found (tick labels, axis titles, and legend text all use the light ink token, not the dark one).
