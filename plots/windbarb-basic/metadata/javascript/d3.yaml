review:
  strengths:
  - All four wind-speed notations (calm circle, half barb, full barb, pennant) are
    present and correctly rendered via a single reusable drawBarb() routine shared
    between the map glyphs and the legend key.
  - Synthetic data uses a physically motivated Rankine combined vortex (solid-body
    rotation inside the core radius, irrotational decay outside) around a synthetic
    low-pressure center, producing a realistic cyclonic swirl with a calm eye — a
    strong, deliberate data-storytelling choice.
  - 'Colors are pixel-identical between themes (#009E73 barbs, #FAF8F1 light / #1A1A17
    dark background), and both renders are fully legible with no dark-on-dark or light-on-light
    chrome failures.'
  - 'Legend is self-contained, upright, and legible: reusing drawBarb() with u=0 to
    force theta=0 for the legend glyphs is a clean, elegant reuse of the map-drawing
    code.'
  weaknesses:
  - 'Boundary-row wind barbs bleed past the plot''s coordinate domain and cross the
    x-axis line: the barb glyph at the bottom-right station (18°E, 45°N) visually
    overlaps the ''18°E'' tick label — its pennant sits directly on top of the leading
    digit. This happens because yScale.domain([44.5, 51.5]) only leaves a 0.5° buffer
    below the southernmost data row (45°N), which is not enough room for a 68px staff
    plus barb/pennant geometry when the local wind vector points toward the bottom
    edge. Fix: widen the y-domain padding at the bottom (e.g. to ~1.0–1.2°) or shrink
    MAP_SIZES for edge rows so barbs stay clear of the axis line and tick labels.'
  - Several other bottom-row barbs (e.g. near 16°E, 17°E) also cross through the x-axis
    domain line into the margin before the deeper 18°E collision — a systematic containment
    issue at the south edge of the plot rather than an isolated one-off.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled exactly #FAF8F1 — not pure white, not dark.
      Chrome: Title "windbarb-basic · javascript · d3 · anyplot.ai" (bold, dark ink) and subtitle "Surface wind observations around a low-pressure system" are both crisp and centered at the top. "Longitude"/"Latitude" axis titles and °E/°N tick labels render in soft dark gray, fully legible. A boxed "Wind speed key" legend sits at the right with a calm circle, half barb, full barb, and pennant glyph, each with a label.
      Data: A 9×7 grid of green (#009E73) wind barb glyphs forms a clear cyclonic (counter-clockwise) swirl around a low near (14°E, 48°N), including an open calm circle exactly at the vortex center and pennants (50 kt) at the outer, highest-speed ring. Station dots, staffs, and barbs are all the same single Imprint green.
      Legibility verdict: PASS overall, with one localized exception — the bottom-right station's pennant glyph crosses the x-axis line and visually overlaps the "18°E" tick label (sits on top of the leading digit). All other text (title, subtitle, axis titles, remaining tick labels, legend) is cleanly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled exactly #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels all flip to light ink and remain fully readable against the dark background — no dark-on-dark failures observed. The legend box uses a slightly lighter dark panel with a visible border, keeping its white heading and gray entry labels legible.
      Data: Identical green (#009E73) barb geometry and layout to the light render — same vortex pattern, same calm-eye circle, same pennants at the outer ring. Confirmed pixel-identical to the light render's data color.
      Legibility verdict: PASS overall, with the same single exception as the light render — the bottom-right (18°E) pennant crosses the axis line and overlaps the tick label digit. No theme-specific readability regression versus the light render.
