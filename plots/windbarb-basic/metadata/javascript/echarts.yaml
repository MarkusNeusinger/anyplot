review:
  strengths:
  - Bespoke wind-barb glyph system built with ECharts custom series (renderItem) —
    correctly renders staff, half/full barbs, pennants, and an open calm circle, matching
    real meteorological notation exactly.
  - 'Wind direction math is provably correct: the staff points upwind (FROM which
    the wind blows) via api.coord differencing, and barbs are consistently placed
    on the left side of the staff (Northern Hemisphere convention) via the negative
    perpendicular offset.'
  - Realistic, self-consistent cyclonic low-pressure wind field — tangential + inward
    spiral flow with exponential speed decay from an off-grid vortex center, producing
    a genuinely readable spiral pattern in the barb field.
  - 'Data shows every notation feature required by the spec in one plot: half barbs,
    full barbs, a pennant (50+ kt), and the calm-wind open-circle exception.'
  - Explicit theme-adaptive chrome throughout (title, subtitle, axis names, tick labels,
    axis lines, split lines all sourced from ANYPLOT_TOKENS); both renders are clean
    and legible.
  - 'Clean, deterministic, dependency-free code with correct mount-node contract usage
    (animation: false, no explicit init size, no devicePixelRatio).'
  weaknesses:
  - Title renders at ~40% of the plot width (fontsize 20) — comfortably readable and
    not squeezed, but somewhat below the 50-70% target range for a non-mandated-only
    title; a fontsize of 22-24 would use the space more fully without risking overflow.
  - No explicit marker or annotation calls out the low-pressure center itself — the
    cyclonic structure is visible from the barb pattern alone, but a small callout
    or center marker would sharpen the data-storytelling focal point.
  - All barbs share a single hue (brand green) with no secondary encoding (e.g., a
    subtle color or size ramp for speed magnitude) beyond the barb notation itself
    — acceptable for this convention-driven plot type but leaves Design Excellence
    headroom.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Cyclonic Wind Field · windbarb-basic · javascript · echarts · anyplot.ai" in bold dark ink at top-center, subtitle explaining barb notation (half/full/pennant/calm) in softer gray beneath it. X-axis "Distance east of station network origin (km)" and Y-axis "Distance north of station network origin (km)" both dark, with lighter gray numeric tick labels (-30 to 430 / -20 to 220). Faint gray gridlines at 100/200/300/400 (x) and 0/50/100/150/200 (y). All text is clearly readable against the light background — no light-on-light issues.
      Data: A 9×5 grid of green (#009E73) wind barbs forming a visible cyclonic (counterclockwise, inward-spiraling) pattern around an off-grid low-pressure center near (190, 115). Barbs closer to the center show more flags (full barbs, and a filled pennant triangle near x=200,y=200) indicating higher wind speed; barbs farther out show fewer flags (single half-barb). An isolated open circle (no staff) appears at (400, 0), correctly representing calm winds. All barb staffs and flags are crisp and fully visible with no clipping or overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light ink/gray, fully readable against the dark background. Axis titles are light-colored, tick labels a lighter secondary gray, gridlines a faint light rgba overlay — all clearly visible, no dark-on-dark failures anywhere (title, axis names, tick labels, and axis lines all correctly flipped to light tones).
      Data: Wind barbs render in the identical #009E73 green as the light render — same positions, same barb/pennant counts, same calm-circle station at (400, 0). The brand green reads with strong contrast against the near-black surface.
      Legibility verdict: PASS
