review:
  strengths:
  - Correctly identifies that core Highcharts has no windbarb series and builds a
    faithful, spec-compliant custom SVG solution instead of faking it or reaching
    for an unavailable add-on module
  - Both light and dark renders are fully theme-correct with identical data colors
    and no legibility failures
  - Calm-station open-circle notation is explicitly forced into the dataset so that
    spec requirement is demonstrably covered
  - Notation key panel is placed in a reserved margin so it can never occlude a data
    barb, and clearly documents how to read the glyphs
  weaknesses:
  - No station in the generated dataset reaches 50kt, so the pennant (triangle) glyph
    -- one of the three notation elements the spec explicitly calls out -- never appears
    in the actual plot, only in the static legend key. Bump a couple of stations'
    speed (or the gyre's peak rotSpeed) past 50kt so at least one real pennant renders
    in the data.
  - Barbs are drawn perpendicular (90 degrees) to the staff via a fixed perpendicular
    vector, rather than the angled ~45-60 degree 'feather' look of traditional meteorological
    wind barbs -- this makes many glyphs read more like letters ('F', 'K', checkmarks)
    than authentic wind barbs. Angling the barb attachment point back toward the base
    would improve visual authenticity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1
      Chrome: Title, subtitle, axis titles, axis tick labels all dark and clearly readable; legend key box readable with dark text
      Data: All barbs use a single green (#009E73) color; two calm stations render as open circles; barb count/type varies correctly with wind speed
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17
      Chrome: Title, subtitle, axis titles, tick labels all light-colored and clearly readable against the dark background; legend key box uses elevated dark surface with light text; no dark-on-dark issues
      Data: Confirmed identical green (#009E73) barbs and station positions as the light render -- only chrome flipped
      Legibility verdict: PASS
