      Data: All 30 station glyphs and all 4 legend glyphs render in a single brand green (#009E73) — staffs, barb lines, and pennant triangles. Barb counts visibly vary station to station (from 2 full barbs + half barb up to multiple full barbs/pennants), consistent with a rotating wind field converging toward a low-pressure center around (400, 300).
      Legibility verdict: PASS

