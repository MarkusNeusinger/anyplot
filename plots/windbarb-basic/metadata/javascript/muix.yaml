review:
  strengths:
  - Hand-built wind-barb glyph geometry (staff, half/full barbs, filled pennant, calm-wind
    circle) fully matches standard meteorological notation, including the calm-wind
    open circle and stacked pennant/barb/half-barb combinations.
  - Data is a physically consistent Rankine-vortex-like wind field around a synthetic
    low-pressure system, with an inner core transect specifically engineered to demonstrate
    calm, half-barb, single-full-barb, and double-full-barb cases that the coarse
    outer grid alone would never reach.
  - 'Advanced, idiomatic MUI X composition: ChartContainer + ChartsXAxis/ChartsYAxis
    combined with the useXScale/useYScale hooks to draw fully custom SVG marks in
    the chart''s own coordinate system — a distinctive, hooks-based MUI X pattern
    rather than a generic drawing.'
  - 'Theme-adaptive chrome is flawless in both renders: warm off-white/near-black
    backgrounds, fully readable dark ink on light and light ink on dark, identical
    brand-green (#009E73) data color in both themes, no clipping at any canvas edge.'
  - 'Clean, minimal layout: no grid, L-shaped spines, symmetric axis padding (100
    km / 90 km) around the station grid, and a compact custom legend integrated directly
    above the plot area rather than floating in isolation.'
  weaknesses:
  - Barb glyphs use a single fixed size (staffLen 42 / barbLen 14) across all 28 stations;
    per the sparse-data heuristic (<50 points) they could be pushed slightly larger/more
    prominent for extra visual punch, though current sizing is already clearly legible.
  - The legend text (fontSize 13) sits a touch small relative to the 22px title and
    16px axis labels — bumping to ~14-15px would tighten the typographic hierarchy.
  - The synthetic cyclone field is realistic but the plot offers no explicit visual
    cue (e.g. a subtle center marker or annotation) to help the reader spot the low-pressure
    center that the barb rotation implies — a light-touch hint would strengthen the
    data storytelling beyond 'display the field'.
  - 'CQ-01: the implementation is necessarily broken into several helper functions
    (windAt, rotate, barbGlyph, WindBarbLayer, legendKey) to build the custom glyph
    geometry — reasonable for this chart type, but slightly more structure than the
    KISS ''imports -> data -> plot'' ideal for the simplest implementations.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme plot surface — not pure white.
      Chrome: Title "windbarb-basic · javascript · muix · anyplot.ai" is bold, dark, and fully visible at top. X-axis label "Distance east of grid origin (km)" and Y-axis label "Distance north of grid origin (km)" (rotated) are dark, legible, and not clipped at either the left or bottom canvas edge. Tick labels on both axes are dark and comfortably sized relative to the axis labels. A custom legend row ("Calm (< 2.5 kt)", "5 kt", "25 kt", "50 kt") with matching barb glyphs sits between the title and plot area, fully readable.
      Data: All 28 wind-barb glyphs (24 outer-grid stations + 4 inner-core transect points) render in brand green (#009E73) — staffs, half-barbs, full-barbs, and a filled pennant triangle for the highest-speed station, plus an open calm-wind circle near the vortex center. No overlap between glyphs, including in the dense core-transect cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme plot surface — not pure black.
      Chrome: Title, both axis labels, and all tick labels flip to light ink and remain fully readable against the dark background — no dark-on-dark text anywhere. Legend text is likewise light and legible.
      Data: Barb glyphs are rendered in the identical brand green (#009E73) as the light render — confirmed pixel-for-pixel same hue and same station positions/orientations. Only the chrome (background, text) flips between themes, as required.
      Legibility verdict: PASS
