review:
  strengths:
  - Fully correct meteorological wind-barb notation implemented from scratch (staff
    length constant, pennants for 50 kt, full barbs for 10 kt, half barbs for 5 kt,
    open circle for calm winds < 2.5 kt), with barbs stacked on the left of the staff
    per Northern Hemisphere convention.
  - 'Idiomatic advanced MUI X usage: builds a custom SVG glyph layer synced to the
    chart''s own coordinate system via useXScale/useYScale inside ChartContainer,
    rather than faking positions — exactly the ''raw children + hooks'' escape hatch
    the community package is meant to support.'
  - Data models a physically plausible Rankine-vortex-like cyclone wind field (tangential
    + cross-isobar inflow component) rather than random noise, giving the plot a clear
    rotational visual story around the low-pressure center.
  - 'Clean theme handling: single brand-green (#009E73) data color identical across
    light/dark renders, only chrome (background, ink, inkSoft) flips via window.ANYPLOT_TOKENS;
    both renders pass the theme-readability checklist with no dark-on-dark or light-on-light
    issues.'
  - Well-designed self-contained legend (calm / 5 kt / 25 kt / 50 kt glyph key) placed
    outside the data area with generous top margin, avoiding any overlap with axes
    or data.
  - Canvas is exactly 3200×1800 (confirmed via direct pixel measurement), no clipped
    title/axis/legend elements at any edge in either render, skipAnimation and disableAxisListener
    correctly set per the MUI X harness contract.
  weaknesses:
  - The spec explicitly calls out 'Calm winds (< 2.5 knots) shown as an open circle
    without a staff' as a required notation rule, but none of the 30 generated stations
    ever fall below 2.5 kt (computed range is 27.2-57.9 kt) — the calm-circle code
    path only ever fires in the legend swatch, never in the actual plotted data. Widen
    the vortex profile (e.g. lower PEAK_SPEED_KT, or add a couple of stations near
    the vortex core/edge where speed naturally decays toward zero) so at least one
    real station demonstrates the calm case.
  - Real station speeds are bunched entirely in the high end of the scale (27-58 kt,
    with 14 of 30 stations already showing pennants) — the simpler low-magnitude notations
    (plain half-barb at ~5 kt, single full barb at ~10 kt) are only shown in the legend,
    not exercised by actual data. Consider flattening the profile or adding a few
    low-speed outlier stations so the full range of barb complexity is visible in
    the real dataset, not just the legend key.
  - 'Dead code: the `r === 0` special case in the station-generation loop (pushes
    a calm station at the exact vortex center) never triggers because the x/y grid
    steps (160/150) never land exactly on CENTER (400, 300) — either remove the branch
    or adjust the grid so it''s reachable and doubles as the calm-wind demonstration.'
  image_description: |-
