review:
  strengths:
  - 'Correct meteorological notation: staffs point upwind (-u, v), speed rounded to
    5 kt and spent as pennants, then full barbs, then one half barb, all on the Northern
    Hemisphere side'
  - Calm station in the vortex eye drawn as an open circle with no staff, as the spec
    asks
  - Glyph key reuses the exact station glyphs (calm, 5, 25, 50 kt), so the notation
    is decoded without guesswork
  - Equal km-per-pixel aspect keeps wind directions at their true angles
  - 'Idiomatic MUI X composition: ChartsContainer with a custom SVG layer positioned
    through useXScale/useYScale'
  - Theme tokens threaded through all chrome; brand green identical in both renders
  weaknesses:
  - 'Suggestion: the equal-aspect plot leaves about 220 CSS px of empty page left
    of the y-axis title; shifting the chart-plus-key block left would balance the
    composition.'
  - 'Suggestion: full barbs at an 8 px gap with a 3.2 px stroke read slightly dense
    on the 45 kt stations; a 9-10 px gap would make the count even quicker.'
