review:
  strengths:
  - 'Domain-accurate wind barb notation implemented from scratch via a Chart.js afterDatasetsDraw
    plugin: correct staff/feather/pennant geometry with half barbs (5kt), full barbs
    (10kt), and filled-triangle pennants (50kt), verified by zooming into individual
    barbs at the high-speed vortex points.'
  - Calm-wind convention (< 2.5 kt shown as an open circle without a staff) is correctly
    implemented and clearly visible at the vortex center in both renders.
  - 'Synthetic data tells a real story: a Rankine-vortex cyclonic low-pressure system
    centered in the domain, so the barb rotation pattern visibly conveys circulation
    instead of being random noise.'
  - 'Theme handling is clean: identical brand-green (#009E73) barbs in both renders,
    correct warm off-white / near-black surfaces, all chrome (title, axis labels,
    ticks, grid) readable in both themes with no dark-on-dark or light-on-light failures.'
  - Axis tick labels append °E/°N units via a callback, a nice touch for geographic
    data readability.
  - Grid spacing (2° lon/lat) keeps all 30 barbs well separated with no overlap between
    neighboring stations.
  - 'Clean mount-node contract usage: animation disabled, single canvas appended,
    no stray DOM, deterministic in-memory data generation.'
  weaknesses:
  - All four chart borders are drawn (a closed rectangle), not the style guide's default
    L-shaped left+bottom spines — visible at every corner of both renders. Set grid.drawBorder
    appropriately or hide the top/right axis lines so only left/bottom remain.
  - At the two highest-speed vortex points, the pennant triangle and the trailing
    full barb are packed very tightly at the staff tip and nearly touch/overlap at
    native zoom — accurate to real synoptic notation, but consider a hair more spacing
    (bump BARB_SPACING or PENNANT_WIDTH by 1-2px) so the barb count stays unambiguous
    at small preview sizes.
  - No small legend/key decodes the barb notation (half barb = 5kt, full barb = 10kt,
    pennant = 50kt) — not required by the spec, but wind barbs are a niche symbology
    and a compact caption or legend would make the chart accessible to a general audience.
  - Design excellence is mostly technical accuracy rather than added aesthetic polish
    beyond the single brand-green hue — fine given the plot type, but there's room
    for a touch more visual refinement (e.g. subtle station dot beneath calm/data
    points, refined grid opacity).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "windbarb-basic · javascript · chartjs · anyplot.ai" in bold dark ink, centered top. Axis titles "Longitude"/"Latitude" in dark ink. Tick labels ("-1.5°E" ... "11.5°E", "38.5°N" ... "49.5°N") in medium-grey, all clearly legible. Subtle light-grey gridlines at every 2° step, visible but not competing with data. A full four-sided border rectangle is drawn around the plot area (confirmed via corner crop) rather than the style-guide default L-shaped left+bottom spines.
      Data: 30 stations on a 6x5 lon/lat grid. 29 render as wind barbs in brand green (#009E73): a staff from the station in the direction the wind blows from, with half/full barbs and filled-triangle pennants sized to wind speed (verified via zoomed crops at (2,42), (6,42), (2,46), (6,46) — each shows a correctly formed pennant triangle plus a trailing full-barb line, consistent with speeds ~60kt exceeding the 50kt pennant threshold). One station at the vortex center (4°E, 44°N) renders as a small open circle with no staff, correctly representing the calm-wind case (<2.5kt). The barb pattern visibly spirals counterclockwise around the center, reading as a cyclonic vortex.
      Legibility verdict: PASS — all title/axis/tick text is clearly readable against the light background, no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Title in white/light ink, axis titles in light ink, tick labels in light grey — all clearly legible against the dark surface. Gridlines are subtle light-grey at low opacity. Same four-sided border rectangle present as in the light render (consistent, but same DE-02 spine issue carries over).
      Data: Identical brand-green (#009E73) barbs, same staff/feather/pennant geometry and positions as the light render — confirms data colors are unchanged between themes, only chrome flipped. The calm-wind open circle at the vortex center is clearly visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, tick labels) is clearly visible against the near-black background.
