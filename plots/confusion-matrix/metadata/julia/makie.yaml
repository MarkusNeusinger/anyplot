review:
  strengths:
  - Sequential imprint_seq (brand green -> blue) colormap correctly chosen for single-polarity
    sample-count data, with per-cell text color adapted to cell luminance for legibility
    across the full color range
  - Diagonal cells (correct predictions) are outlined with a bold stroke, giving the
    plot a clear focal point and visual hierarchy without extra chrome
  - 'Realistic, neutral example data: visually-similar songbirds (Sparrow/Finch/Robin)
    show meaningfully higher cross-confusion than the visually-distinct raptors (Owl/Hawk),
    which is exactly the kind of structured signal a confusion matrix should demonstrate'
  - Theme-adaptive chrome (background, ink, spines, tick colors) is correctly threaded
    through Figure and Axis in both renders, with identical data colors between light
    and dark
  weaknesses:
  - 'BUG (persists from prior attempts): the two-line cell annotation `text!(ax, j,
    i, text = "$(value)\n$(row_pct[i, j])%", ...)` renders ONLY the first line (raw
    count) in every cell of both renders -- the row-normalized recall percentage never
    appears anywhere on the plot, even though it is computed and the code comment
    claims it satisfies the spec''s normalization requirement. Verified by pixel-cropping
    the top-left cell: only "162" is drawn, no "90%" line above/below/behind it. The
    same silent second-line drop affects the Axis title: the intended subtitle `rich("Overall
    accuracy: 89.7% * cells show count and row-normalized recall"; fontsize=13, color=INK_SOFT)`
    never renders in either theme -- only the single line "confusion-matrix * julia
    * makie * anyplot.ai" is visible, with no second line and no leftover clipped
    pixels (so this is a rendering/layout bug, not AR-09 edge clipping). Root cause
    is almost certainly that a single text!/rich() call carrying an embedded "\n"
    does not reserve/allocate the extra line height in this Axis/heatmap-cell context,
    so the second line is pushed out of the drawn region and dropped entirely. Fix
    by using two separate text! calls per cell/title with explicit manual vertical
    offsets (e.g. `text!(ax, j, i - 0.15, text="$(value)"...)` and `text!(ax, j, i
    + 0.15, text="$(row_pct[i,j])%"...)`, and similarly two separate stacked text!
    elements for the title/subtitle) instead of relying on an in-string line break.'
  - Because of the bug above, the plot visually only ever shows raw counts -- the
    spec's requirement to support normalized views (by row/recall) is computed in
    code but has zero visual presence, so a viewer cannot tell the matrix supports
    normalization at all.
  - 'The intended "Overall accuracy: X%" callout -- the one piece of explicit data
    storytelling in the design -- never reaches the viewer, so the plot relies entirely
    on the diagonal highlight for visual hierarchy.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "confusion-matrix · julia · makie · anyplot.ai" in bold dark ink at top-center; "True Label" (y-axis, rotated) and "Predicted Label" (x-axis) in dark ink; class-name tick labels (Sparrow, Finch, Robin, Owl, Hawk) on both axes in soft ink; thin dark spines frame the heatmap; colorbar on the right labeled "Sample Count" with soft-ink tick labels. All chrome text is clearly legible against the light background. NOTE: the code attempts a second subtitle line ("Overall accuracy: ...% · cells show count and row-normalized recall") under the title via a nested rich() call, but it does NOT appear in the render -- only the single mandated title line is visible.
      Data: 5x5 heatmap, sequential green (#009E73) to blue (#4467A3) fill scaled by sample count. Diagonal cells (correct predictions) are outlined with a bold dark stroke box. Each cell shows a single white or dark (luminance-adaptive) number -- the raw count (e.g. "162", "9", "142", "84", "87"). NOTE: the row-normalized recall percentage that the code computes and intends to print as a second line under the count ("90%", etc.) does NOT appear in any cell -- only the count is visible.
      Legibility verdict: PASS for all elements that are actually drawn; the missing subtitle/percentage lines are a rendering bug (feature never reaches the canvas), not a legibility failure of visible text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, axis labels, and tick labels as the light render, now in light ink (#F0EFE8 primary / #B8B7B0 secondary) against the dark background -- fully readable, no dark-on-dark issues. Spines and colorbar recolored consistently for the dark surface.
      Data: Identical cell values and identical green-to-blue data colors as the light render (confirmed pixel-for-pixel color match on sampled cells) -- only chrome flipped, as required. Diagonal highlight boxes now drawn in light ink. Same missing-percentage-line and missing-subtitle bug as the light render.
      Legibility verdict: PASS for all visible text; no dark-on-dark failures observed.
