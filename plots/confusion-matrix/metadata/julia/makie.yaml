review:
  strengths:
  - Correct Imprint sequential colormap (green -> blue) for single-polarity count
    data, with theme-correct chrome (background, ticks, spines, diagonal highlight)
    in both light and dark renders
  - Diagonal highlighting (lines! outlining the correct-prediction cells) creates
    a clear visual focal point without simulating fake interactivity
  - Cell-text color adapts to per-cell luminance so counts stay legible across the
    entire green-to-blue gradient in both themes
  - 'Realistic, well-structured example data: distinct per-class sample sizes, a strong
    diagonal, and a plausible confusion pattern (similar songbirds confused with each
    other, raptors rarely confused with songbirds or each other)'
  - Clean KISS script structure with explicit font sizes throughout and a title/axis-label
    format that matches the spec exactly ("Predicted Label" / "True Label")
  weaknesses:
  - 'Spec explicitly asks to ''support normalization options: none (raw counts), by
    row (recall), by column (precision), or by total'' — only raw counts are shown;
    add a normalized view (e.g. row-normalized percentages alongside or instead of
    counts) to satisfy SC-02.'
  - Random.seed!(42) is called but never actually used — all data (confusion_rates,
    sample_sizes, counts) is hardcoded/deterministic, so the Random import and seed
    call are dead code. Either use Random for a touch of realistic sampling noise
    or drop the unused import/call.
  - 'Design Excellence is solid but stops short of publication-level: consider adding
    a subtitle or small annotation surfacing overall accuracy, or per-class recall/precision,
    to push the storytelling (DE-03) further.'
  - 'Library Mastery is generic: heatmap! + text! + lines! is a pattern any plotting
    library could replicate; consider leaning further into a Makie-distinctive feature
    (e.g. a custom Makie recipe, layout with linked side-marginals) to raise LM-02.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matching the required light-theme surface. Not pure white.
      Chrome: Title "confusion-matrix · julia · makie · anyplot.ai" is bold, dark ink, fully visible with clear margin above (no clipping). "Predicted Label" / "True Label" axis titles and the five class tick labels (Sparrow, Finch, Robin, Owl, Hawk) on both axes are dark/soft-ink and clearly readable. Colorbar "Sample Count" label and tick labels (0/50/100/150) are fully visible near the right edge with margin, not clipped.
      Data: 5x5 heatmap using the Imprint sequential colormap (brand green #009E73 for low counts, blue #4467A3 for high counts). Diagonal cells (correct predictions: 162, 130, 142, 84, 87) are outlined with a dark ink square border to draw the eye to correct predictions. Cell counts are annotated in white text throughout, readable against every background shade in the gradient. First-series color (lowest counts) is the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the required dark-theme surface. Not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light ink/off-white and remain clearly readable against the dark background — no dark-on-dark failures observed. The diagonal highlight outline flips to a light color, keeping the same visual role as the light render. Colorbar label and ticks are light-colored and legible.
      Data: Data colors are identical to the light render (same green-to-blue gradient, same counts, same cell layout) — only chrome (background, text, outline color) flipped, as required. Cell-count text remains white and legible in all cells.
      Legibility verdict: PASS
