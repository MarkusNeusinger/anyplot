review:
  strengths:
  - 'Correct square 2400x2400 canvas matches the heatmap''s aspect (DataAspect + yreversed),
    and the Imprint sequential colormap (#009E73 -> #4467A3) is used correctly for
    the count data'
  - Diagonal (correct-prediction) cells get a theme-adaptive outline (ink-colored
    in light, near-white in dark) that gives the plot a clear focal point without
    a legend
  - Cell text color adapts to per-cell luminance so annotations stay legible across
    the entire green-to-blue color range in both themes
  - Realistic, neutral bird-species classifier data with a plausible confusion pattern
    (songbirds confused with each other, raptors rarely confused with songbirds)
  - Backgrounds, ink tokens, and chrome are correctly theme-adaptive between plot-light.png
    and plot-dark.png; data colors are identical between renders
  weaknesses:
  - The row-normalized recall percentage (e.g. '90%') that the code computes and draws
    via the second text!() call per cell (text!(ax, j, i + 0.2, text = "$(row_pct[i,
    j])%", ...)) never appears in either rendered PNG -- pixel inspection of plot-light.png
    confirms only a single ~22px-tall white text cluster per cell (the raw count),
    with no second glyph cluster anywhere nearby. Every cell shows only the raw count,
    so the spec's required row-normalization display is effectively missing from the
    shipped artifact even though the underlying row_pct data is correctly computed.
  - 'The Axis ''subtitle'' ("Overall accuracy: XX% . cells show count and row-normalized
    recall") also does not render -- cropping the top 220px of plot-light.png shows
    the title sitting directly above the heatmap frame with no subtitle line, so the
    axis did not reserve any vertical space for it. This is a second instance of code
    declaring content that never reaches the output.'
  - Because both of the above are silently dropped, SC-02's 'support normalization
    options' requirement and DQ-01's 'shows all aspects of plot type' are not actually
    satisfied by the rendered PNG -- fix by combining the count and percentage into
    a single text!() call per cell (e.g. a two-line string with \n) rather than two
    separate text!() calls, and verify the 'subtitle' Axis keyword is actually supported/rendering
    in the installed Makie/CairoMakie version before relying on it -- if not, fold
    the accuracy line into the title or a separate text!() placed above the axis.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches spec.
      Chrome: Title "confusion-matrix · julia · makie · anyplot.ai" is bold and dark, clearly readable directly above the heatmap. No subtitle line is present beneath the title even though the source computes one ("Overall accuracy: XX% · cells show count and row-normalized recall") -- the axis frame starts immediately after the title. "True Label" (rotated, left) and "Predicted Label" (bottom) axis titles are dark and legible; tick labels (Sparrow/Finch/Robin/Owl/Hawk on both axes) are legible in soft ink gray. Colorbar on the right labeled "Sample Count" with tick labels 0/50/100/150 is fully readable.
      Data: 5x5 heatmap using the Imprint sequential colormap from brand green (#009E73, low counts) to blue (#4467A3, high counts). Each cell shows only ONE number -- the raw sample count -- in white or dark text depending on cell luminance; the intended second line showing row-normalized recall percentage is absent from every cell. The five diagonal cells (correct predictions) are outlined with a solid dark border, correctly drawing the eye to correct-prediction cells.
      Legibility verdict: PASS for all text that IS present (title, axis labels, ticks, colorbar, cell counts) -- no text is illegible or low-contrast. However, the row-normalized-recall annotation and the accuracy subtitle are simply missing from the render, which is a content/completeness defect rather than a legibility defect.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches spec.
      Chrome: Same title, same missing subtitle. Axis labels and tick labels flip to light ink tones and remain clearly readable against the dark background -- no dark-on-dark issues found. Colorbar labels are readable.
      Data: Identical cell colors and data-color mapping to the light render (Imprint sequential palette, same counts) -- only chrome flipped, correctly. Diagonal outline flips to a near-white color, remaining clearly visible on the dark cells. Same missing-percentage-annotation issue as the light render (verified same code path, same defect).
      Legibility verdict: PASS for text that is present, same completeness defect (missing recall percentage / subtitle) carried over from the light render.
