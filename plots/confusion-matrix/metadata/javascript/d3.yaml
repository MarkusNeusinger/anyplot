review:
  strengths:
  - Correctly uses the Imprint sequential colormap (imprint_seq, green→blue) for the
    count data via window.ANYPLOT_TOKENS.seq, with identical data colors between light
    and dark renders
  - Implements the spec's suggested diagonal highlighting (thicker ink-colored stroke
    + bold font weight on correct-prediction cells) as genuine visual hierarchy, not
    decoration
  - 'Theme-adaptive chrome is threaded through correctly: title/axis titles use t.ink,
    tick labels use t.inkSoft, colorbar axis uses t.grid/t.inkSoft — both renders
    are legible with no dark-on-dark or light-on-light failures'
  - 'Realistic, neutral dataset (quality-control defect classifier: OK/Scratch/Dent/Crack/Stain)
    with a plausible class imbalance (65–180 samples) and sensible off-diagonal confusion
    counts'
  - Clean, deterministic, KISS-structured script with no functions/classes and no
    extraneous imports
  - Colorbar is clearly labeled ('Sample Count') with an auto-generated d3.axisRight
    scale, giving the count encoding a legend equivalent
  weaknesses:
  - Cell rects/value labels and the categorical tick labels are drawn with plain imperative
    for-loops and .append() calls rather than D3's idiomatic data-join pattern (selection.data(...).join(...))
    — only the colorbar axis uses a real D3 generator (d3.axisRight). Rebuild the
    grid rendering as a data join (e.g. g.selectAll('rect').data(flatCells).join('rect')...)
    to use D3's signature enter/update pattern instead of manual DOM building.
  - Spec explicitly calls for normalization support (none/by-row/by-column/by-total);
    the implementation only ever renders raw counts with no normalized view or indication
    that other modes exist — consider adding at least one alternative normalized state,
    or a real interactive toggle since D3 supports genuine click handlers in the browser
    harness.
  - Design polish is solid but still reads as a well-executed default heatmap rather
    than a distinctive piece — consider added refinement such as rounded cell corners,
    a slightly more pronounced focal treatment on the diagonal, or tighter integration
    between the colorbar and grid to lift Aesthetic Sophistication further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target closely.
      Chrome: Title "confusion-matrix · javascript · d3 · anyplot.ai" in bold dark text at top, clearly readable. "True Label" (rotated, left) and "Predicted Label" (bottom) axis titles in bold dark ink. Class-name tick labels (OK, Scratch, Dent, Crack, Stain) on both axes in medium-gray ink-soft. Colorbar on the right with "Sample Count" label and numeric ticks (0/50/100/150), all legible.
      Data: 5x5 grid, diagonal cells (180, 92, 78, 65, 70) rendered darker teal/blue with bold white or dark text depending on luminance and outlined with a thicker dark border; off-diagonal cells render in the brand green low end of the imprint_seq scale with smaller dark values. All text is readable against its cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target closely.
      Chrome: Title, "True Label"/"Predicted Label" axis titles, and class-name tick labels all render in light off-white tones, clearly readable against the dark background. Colorbar ticks and "Sample Count" label are legible light-gray text. Diagonal-cell borders now render as light strokes (correctly flipped from dark strokes in light mode) so the highlight remains visible on the dark surface.
      Data: Cell colors are identical to the light render (same imprint_seq green-to-blue values) — only the chrome (background, text, borders) flipped. No dark-on-dark or light-on-light failures observed; every cell's numeric label remains legible against its fill.
      Legibility verdict: PASS
