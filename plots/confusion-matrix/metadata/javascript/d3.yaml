review:
  strengths:
  - Full normalization toggle (Counts / Row % / Column % / Total %) implemented with
    real click handlers and correct math (row=recall, column=precision, total=share
    of total), directly matching the spec's normalization requirement.
  - Diagonal (correct-prediction) cells are highlighted with a thicker ink-colored
    border plus a subtle drop-shadow glow filter, giving the matrix a clear focal
    point without faking interactivity.
  - 'Theme-adaptive cell-text contrast: text color switches between ink and pageBg
    based on value/max ratio, keeping digits legible against both the saturated fill
    and the light/dark chrome in both renders.'
  - Correct use of imprint_seq (brand green -> blue) for the continuous count data,
    with a colorbar whose axis label updates per normalization mode.
  - Axis labeling follows the spec's notes exactly ('True Label' on Y, 'Predicted
    Label' on X), and all five classes are shown with realistic, varied off-diagonal
    error patterns.
  weaknesses:
  - In the default 'Counts' view, the linear sequential scale is dominated by the
    diagonal (max=180), so most off-diagonal error counts (1-8) compress into a narrow,
    visually similar low-end shade of green -- differences are only readable via the
    annotated numbers, not the color itself.
  - 'Design Excellence is strong but stops short of publication-tier: no summary statistic
    (e.g., overall accuracy) is surfaced, which would sharpen the data-storytelling
    focal point further (not spec-required, just an opportunity).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Title "confusion-matrix · javascript · d3 · anyplot.ai" in dark ink, centered and fully visible. Four toggle pills (Counts / Row % / Column % / Total %) below the title, "Counts" shown active (filled brand green). "True Label" (rotated) and "Predicted Label" axis titles in dark ink, class-name ticks (OK, Scratch, Dent, Crack, Stain) on both axes in secondary ink. Colorbar on the right with "Sample Count" label and tick values (0/50/100/150) in secondary ink.
      Data: 5x5 grid of rounded cells. First (highest-value, diagonal) cells range from brand-green through a blue-shifted teal following imprint_seq; diagonal cells carry a thicker dark border and a soft glow, clearly marking correct predictions. Cell values are annotated as bold numbers, using off-white text on the two highest-value diagonal cells (180, 92) and dark ink text elsewhere -- all clearly readable against their respective fills.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Same title, toggle pills, and axis titles now rendered in light ink/off-white, fully readable against the dark background. Colorbar ticks and "Sample Count" label in light secondary ink. Tick labels for both axes are light-colored and legible.
      Data: Identical cell fill colors to the light render (imprint_seq green-to-blue), confirming positions 1-8 data colors are unchanged between themes -- only chrome flipped. Diagonal glow/border still visible against the dark backdrop. Cell-value text remains readable: near-black text on the two brightest diagonal cells (180, 92, which have enough luminance to contrast against dark ink text) and light/off-white text on the remaining green cells. No dark-on-dark or light-on-light failures observed anywhere.
      Legibility verdict: PASS
