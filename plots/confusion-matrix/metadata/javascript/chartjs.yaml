review:
  strengths:
  - Custom Chart.js plugin (beforeDatasetsDraw/afterDraw hooks) cleanly builds the
    heatmap cells, diagonal highlight, and gradient colorbar without reaching for
    an unpinned matrix plugin — exactly the approach the library rules call for when
    a chart type isn't native
  - Sequential imprint_seq colormap (green→blue) correctly applied to continuous count
    data with a labeled colorbar (0–max), rather than misusing the categorical palette
  - Diagonal cells get a redundant (non-color) encoding via a bold stroke border,
    satisfying the spec's 'highlight correct predictions' note and improving CVD accessibility
  - Luminance-based text color switching (per-cell) keeps count labels legible against
    both the green and blue fills
  - Both renders are pixel-identical for data colors and only chrome (background,
    ink, borders) flips between light and dark, with no clipping at any edge and no
    text collisions
  - Realistic, neutral synthetic dataset (wildlife camera-trap classifier, 4 classes,
    ~400 samples) with plausible per-class accuracy and error patterns
  weaknesses:
  - Spec's Notes section calls for support of normalization options (none/row/column/total)
    — the implementation only ever shows raw counts, with no percentage/normalized
    view represented anywhere (even as a secondary annotation line in each cell)
  - 'Design polish is solid but not exceptional: cell gaps and stroke-based diagonal
    highlight are functional rather than distinctive; a subtle drop-shadow or tighter
    color ramp between adjacent counts (e.g. 88 vs 90) could sharpen the visual hierarchy
    further'
  - The 'Samples' colorbar label and axis titles are all fontsize 18, competing for
    visual weight with the title — a slightly more restrained title-to-axis-label
    size ratio would sharpen hierarchy (very minor, no overlap or overflow observed)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full canvas including the colorbar gutter.
      Chrome: Title "confusion-matrix · javascript · chartjs · anyplot.ai" in dark ink, clearly centered and fully visible top edge with no clipping. "True Label" (y, rotated) and "Predicted Label" (x) axis titles in dark ink at 18px. Class tick labels (Deer/Fox/Rabbit/Owl) in inkSoft gray, evenly spaced, no overlap. Colorbar on the right labeled "Samples" (rotated) with "0" and "96" endpoint labels, fully inside the canvas with generous right-side padding.
      Data: 4x4 grid of cells colored via imprint_seq (green #009E73 for low counts, blue #4467A3 for high counts near the diagonal), each annotated with a bold white/light count label. Diagonal cells (correct predictions: 96, 89, 88, 90) carry an additional dark stroke border for redundant highlighting beyond color alone.
      Legibility verdict: PASS — all text (title, axis labels, ticks, cell counts, colorbar labels) is clearly readable against the light background; confirmed legible even at the 400px thumbnail scale.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the full canvas including the colorbar gutter.
      Chrome: Same title text now in light ink, fully visible with no clipping. Axis titles and tick labels flip to light/soft-light tones, remaining clearly legible against the dark background — no dark-on-dark failures observed anywhere (axis titles, ticks, colorbar "0"/"96" labels, and diagonal cell borders all correctly switch to light strokes/text). Colorbar and "Samples" label fully visible and correctly positioned, matching the light render's layout.
      Data: Identical cell fill colors and count values to the light render (verified pixel-for-pixel color match on inspection) — only the chrome (background, ink, grid/border strokes) changed between themes, exactly as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues; diagonal highlight borders correctly switched to a light stroke for visibility against the dark cell fills.
