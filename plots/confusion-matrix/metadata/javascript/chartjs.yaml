review:
  strengths:
  - Custom Chart.js plugin (beforeDatasetsDraw/afterDraw) cleanly builds the heatmap
    cells, diagonal highlight, and gradient colorbar without reaching for an unpinned
    matrix plugin — exactly the approach the library rules call for
  - imprint_seq sequential colormap correctly applied to continuous count data with
    a labeled 0-96 colorbar
  - This attempt adds a row-normalized (recall) percentage annotation per cell plus
    an explanatory subtitle, directly resolving the prior review's missing-normalization
    weakness
  - New two-tier typographic hierarchy (bold 30px count, lighter 18px percentage)
    sharpens the visual read of magnitude vs. rate
  - Diagonal correct-prediction cells get a redundant stroke-border encoding, improving
    CVD accessibility beyond color alone
  - Axis-title/tick font sizes were trimmed this attempt, resolving the prior 'fonts
    competing with the title' note
  - Both renders keep identical data colors with correctly-flipped chrome, no clipping,
    and a realistic, neutral wildlife camera-trap dataset
  weaknesses:
  - Only raw counts and row-normalized (recall) percentages are shown — column (precision)
    and total normalization from the spec's Notes are still not represented in any
    form
  - Design is solid but not yet distinctive at the DE-01 'publication-ready' tier
    — e.g. uniform cell sizing regardless of magnitude, no subtle elevation/shadow
    treatment
  - Data storytelling still requires the viewer to compare cells manually to find
    the weakest-performing class (e.g. Rabbit at 85.7% recall); an explicit visual
    callout would sharpen the story further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full canvas including the colorbar gutter.
      Chrome: Title "confusion-matrix · javascript · chartjs · anyplot.ai" in dark ink, fully visible, no clipping. New subtitle "Counts with row-normalized (recall) percentage below" directly under the title in soft ink. "True Label" (y, rotated) and "Predicted Label" (x) axis titles in dark ink at 16px. Class tick labels (Deer/Fox/Rabbit/Owl) in soft gray, evenly spaced, no overlap. Colorbar on the right labeled "Samples" with "0" and "96" endpoint labels, fully inside the canvas with generous right-side padding.
      Data: 4x4 grid of cells colored via imprint_seq (green #009E73 for low counts, blue #4467A3 for high counts near the diagonal), each cell showing a bold count number above a smaller row-normalized recall percentage. Diagonal cells (correct predictions: 96, 91, 90, 93) carry an additional dark stroke border for redundant highlighting beyond color alone.
      Legibility verdict: PASS — all text (title, subtitle, axis labels, ticks, cell counts/percentages, colorbar labels) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the full canvas including the colorbar gutter.
      Chrome: Same title and subtitle text now in light ink, fully visible with no clipping. Axis titles and tick labels flip to light/soft-light tones, remaining clearly legible against the dark background — no dark-on-dark failures observed anywhere. Diagonal cell borders correctly switch to a light stroke for visibility against the dark cell fills. Colorbar and "Samples" label fully visible and correctly positioned, matching the light render's layout.
      Data: Identical cell fill colors, count values, and percentage annotations as the light render — only the chrome (background, ink, borders) changed between themes.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues; diagonal highlight borders correctly switched to a light stroke for visibility against the dark cell fills.
