review:
  strengths:
  - Correctly implements a full heatmap-style confusion matrix using only the core
    Highcharts bundle (no heatmap module loaded), drawing cells with the SVG renderer
    while layering an invisible scatter series underneath for genuine hover tooltips
  - Diagonal cells are highlighted with a theme-adaptive stroke (t.ink) that flips
    correctly between light and dark, reinforcing the naturally high-recall blue fill
    for correct predictions
  - Per-cell text color is computed from the WCAG relative-luminance formula against
    the actual cell fill, keeping count/percentage labels legible on both the green
    (low-recall) and blue (high-recall) ends of the imprint_seq scale
  - Realistic, semantically motivated confusion pattern (Fox/Raccoon mixed up as both
    are nocturnal similar-size species, Rabbit/Squirrel mixed up as both are small
    and fast) rather than random noise
  - Title fontsize is dynamically scaled against the 67-char baseline so the long
    mandated title (with descriptive prefix) never overflows the square canvas
  - Both renders show identical data colors with correctly flipped chrome (background,
    ink, grid tokens threaded throughout axes, colorbar, and cell text)
  weaknesses:
  - Only row-normalized recall is shown; the spec's suggested column/total normalization
    options aren't offered as alternatives (acceptable for a single static plot, but
    worth noting since the spec calls out multiple normalization modes)
  - The manual cell-drawing approach requires several small helper functions (hexToRgb,
    lerp, cellRgb, cellFill, cellTextColor, clearDrawn, drawAll) which pushes past
    the ideal 'no functions' KISS baseline — largely justified by the core-bundle
    constraint (no heatmap module) but still adds indirection versus a simpler declarative
    chart
  - No summary annotation (e.g. overall accuracy or total sample count) beyond per-cell
    counts/percentages, which some confusion-matrix treatments surface as a quick
    top-line metric
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "Camera-Trap Species ID · confusion-matrix · javascript · highcharts · anyplot.ai" in dark ink, subtitle in soft gray, "True Label" / "Predicted Label" axis titles and Deer/Fox/Rabbit/Raccoon/Squirrel tick labels all in dark/soft-dark text — all clearly legible against the light background. Vertical "Recall" colorbar on the right with 0%/50%/100% labels in soft-dark text.
      Data: A 5x5 grid of rounded-corner cells. Diagonal cells (correct predictions: 180, 142, 156, 138, 149) are colored blue (high recall, 83.6–98.4%) and outlined with a black stroke. Off-diagonal cells are colored green (low recall). Each cell shows a bold count and a smaller percentage below it, in white or near-black text chosen per-cell for contrast against that cell's fill.
      Legibility verdict: PASS — no light-on-light text anywhere; every label and cell annotation reads cleanly.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title/subtitle/axis titles/tick labels now rendered in light ink tones, clearly visible against the dark background. The diagonal-cell stroke is now a light/white outline instead of black, correctly flipped via the ink token. Colorbar and its labels remain legible in light text.
      Data: Cell fill colors (green/blue) are pixel-identical to the light render — confirmed only chrome changed. Per-cell text colors are unchanged from light (they're chosen by cell-fill luminance, not page theme), and remain legible in both cases.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome text and cell annotations are readable.
