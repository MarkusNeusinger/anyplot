review:
  strengths:
  - Diagonal cells are visually highlighted with a distinct border, drawing the eye
    straight to correct predictions per the spec's suggestion to highlight the diagonal.
  - Cell labels show both raw count and row-normalized percentage, satisfying the
    annotation requirement without needing a separate legend.
  - Imprint sequential colormap (green→blue, via t.seq) correctly applied to count
    data; identical data colors across light/dark themes, only chrome flips.
  - 'Realistic, factually consistent data: the 5-class matrix sums to a stated 500-image
    test set, with plausible per-class error patterns (Cat/Dog is the most-confused
    pair).'
  - Responsive title-fontsize scaling formula keeps the long mandated title from overflowing
    the canvas.
  weaknesses:
  - Only row-normalized percentage (recall) is shown; the spec's 'normalization options'
    note (none/row/column/total) is only partially covered — consider a secondary
    annotation or note about which normalization is used, or add a column-normalized
    view.
  - No tooltip is configured on the heatmap series — a hover tooltip would add real
    value in the interactive HTML view beyond the static per-cell labels.
  - 'Axis-name margins are slightly unbalanced: yAxis ''True Label'' uses nameGap:90
    versus xAxis ''Predicted Label'' nameGap:40, giving the left margin more whitespace
    than the top — could tighten for better balance.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark.
      Chrome: Title "Pet Photo Classifier · confusion-matrix · javascript · echarts · anyplot.ai" in dark ink at top; "Predicted Label" axis title above the grid; "True Label" rotated axis title at left; Cat/Dog/Bird/Rabbit/Fish tick labels on both axes in soft dark gray. All clearly visible against the light background.
      Data: 5x5 heatmap grid, Imprint sequential colormap (green low values → blue high values), identical hue family to the imprint_seq spec. Diagonal cells outlined with a bold dark border, off-diagonal cells outlined with a thin cream border. Each cell shows a bold count number and a percentage below it in off-white text with a dark stroke, readable over any cell color. Horizontal colorbar (visualMap) below the grid, 0 (green) to 112 (blue), with soft-gray tick text.
      Legibility verdict: PASS — no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light.
      Chrome: Same title and axis titles/tick labels, now rendered in light ink (~#F0EFE8) against the dark background — clearly legible. Diagonal-cell border is now light-colored, off-diagonal borders are dark, mirroring the light-theme contrast intent. Colorbar tick text flipped to light gray.
      Data: Identical green→blue sequential heatmap fill and white/dark-stroked per-cell labels — confirms data colors are unchanged from the light render; only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark issues found; no black-on-black text anywhere.
