review:
  strengths:
  - 'Builds the Pro-only heatmap from community parts: a ScatterChart with two band
    axes, a custom `scatter` slot (ConfusionCell) that draws one rect per class pair,
    and a zAxis continuous colorMap driving the fill'
  - The color bar is MUI X's native ContinuousColorLegend bound to the same zAxis,
    so the bar and the cells share one scale (0 to 182)
  - 'Clear in-cell hierarchy: a bold count above a smaller row-share percentage, with
    font sizes derived from the band width'
  - The predicted axis sits on top of the matrix (the usual confusion-matrix reading
    order), with tick marks and axis lines removed and thin gaps between cells
  - The diagonal highlight the Notes allow is a 4 px outline in the ink token, which
    flips with the theme and leaves the cell colors and numbers readable
  - Realistic waste-sorting classifier (Paper, Glass, Metal, Plastic, Organic) with
    plausible confusion between Metal and Plastic and mild class imbalance; every
    row percentage is computed from the counts
  weaknesses:
  - 'VQ-01 (both): the color bar''s end labels ''0'' and ''182'' are set at 14 px,
    the smallest text on the canvas, and blur at thumbnail size → about 16 px, the
    same as the axis tick labels (+2 px). Likely cause: `slotProps.legend.sx.fontSize:
    14`.'
  - 'SC-02 (both): the color bar has no title and nothing names the normalization
    of the percentages, so the spec bullet ''with the normalization, when one is applied,
    named by the color bar, an axis title or a label'' is missed: the reader cannot
    tell the color bar means raw counts or that ''93%'' is a share of the true-label
    row (recall) → name both, for example a color bar title ''Count'' and a note such
    as ''% of true class (recall)''. Likely cause: the ContinuousColorLegend is configured
    without a label, and the rowPct texts carry only a ''%''.'
  - 'Suggestion: a slightly smaller gap between the ''True Label'' axis title and
    its tick labels would tighten the left margin.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: title "confusion-matrix · javascript · muix · anyplot.ai" centered at the top in dark ink; "Predicted Label" axis title above the matrix with class tick labels (Paper, Glass, Metal, Plastic, Organic) on top; rotated "True Label" axis title and the same class names in the same order on the left. Horizontal color bar bottom right with end labels "0" and "182" (small). All text is dark on light and readable.
      Data: 5×5 grid of square cells colored by count on the Imprint sequential ramp, brand green #009E73 for low counts to blue #4467A3 for the high diagonal counts. Each cell shows a count (bold on the diagonal) and its row share in light text, readable on both the green and blue cells. Diagonal cells carry a dark ink outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title, axis titles and tick labels flip to light ink and read clearly; the color bar end labels are light, small but readable. No dark-on-dark text.
      Data: cell colors identical to the light render (same green→blue ramp); in-cell text unchanged and readable; the diagonal outline flips to light ink and stays visible against the dark page.
      Legibility verdict: PASS
