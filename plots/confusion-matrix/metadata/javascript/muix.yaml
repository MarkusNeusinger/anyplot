review:
  strengths:
  - Cleverly builds a heatmap-style confusion matrix on top of ScatterChart via a
    custom slots.scatter marker component, which is the correct community-only workaround
    since MUI X community has no native heatmap chart.
  - Diagonal cells (correct predictions) are visually called out with a bold ink-colored
    outline and bold count text, giving the chart a clear focal point and real data
    storytelling.
  - Text color per cell is computed from the fill's relative luminance so annotations
    stay legible across the full green-to-blue sequential range, in both themes.
  - Sequential color scale is built strictly from window.ANYPLOT_TOKENS.seq (Imprint
    imprint_seq), correctly identical between light/dark renders, with only chrome
    (background, ink, grid) flipping via the harness ThemeProvider.
  - ContinuousColorLegend gives a proper colorbar with 0..max labels, satisfying the
    spec's 'include colorbar' requirement.
  - Deterministic, realistic recycling-sorter classification data with a plausible
    ~90% diagonal accuracy and believable off-diagonal confusions (glass/plastic/metal).
  weaknesses:
  - Spec asks for normalization options (none / by row / by column / by total); the
    implementation always shows raw count + row-normalized percentage (recall) with
    no column- or total-normalized view — a reasonable static-chart compromise but
    not the full feature set requested.
  - Top axis title 'Predicted Label' sits fairly close to the column tick labels beneath
    it (comfortable but tight) — a little extra top margin would give more breathing
    room, especially at smaller preview sizes.
  - The gamma-compressed color mapping (t^0.45) trades strict linear-magnitude accuracy
    for readability of low off-diagonal counts — a defensible design choice given
    the comment's rationale, but worth flagging since it means the color scale is
    not perceptually linear against the raw counts.
  - countFontSize/pctFontSize derivation and the mixHex/relativeLuminance helpers
    add a fair bit of custom math for what is conceptually a simple annotated heatmap
    — justified by the ScatterChart-as-heatmap workaround, but adds code complexity
    beyond a minimal KISS implementation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent with the Imprint light-theme page background.
      Chrome: Title "confusion-matrix · javascript · muix · anyplot.ai" is centered at top in dark ink, clearly legible. "Predicted Label" axis title sits above the Paper/Glass/Metal/Plastic/Organic column headers (dark ink), "True Label" is rotated along the left edge above the row headers (dark ink). Tick labels are a slightly softer dark gray (inkSoft), still fully readable. Colorbar at the bottom runs from teal (0) to blue (182) with readable end labels.
      Data: 5x5 grid of filled cells running from teal/green (low counts) through blue (high counts), matching the Imprint sequential scale. Each cell shows a bold count and a smaller row-normalized percentage below it, in white/light text that stays legible against every cell fill (luminance-aware text color). The five diagonal cells (182, 151, 142, 158, 176) are outlined in a bold dark ink stroke and bold text, clearly calling out correct predictions.
      Legibility verdict: PASS — all title, axis, tick, legend, and cell-annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent with the Imprint dark-theme page background.
      Chrome: Same title, now in light ink, clearly legible against the dark background. Axis titles and tick labels have flipped to light ink / soft light gray respectively — fully readable, no dark-on-dark text. Colorbar labels are also light-colored and legible.
      Data: Identical teal-to-blue sequential fills and identical count/percentage values to the light render — confirms data colors are unchanged between themes, only chrome flipped. Diagonal cells now have a light-ink (near-white) outline instead of the dark outline used in light mode, which reads correctly against the blue diagonal fills. Cell annotation text remains legible (white/light) across all cell fills.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome and data-cell text is clearly visible against the dark background.
