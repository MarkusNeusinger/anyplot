review:
  strengths:
  - 'Clever library-idiomatic workaround: builds a genuine heatmap out of ScatterChart
    band axes plus a custom slots.scatter component, since MUI X community has no
    native Heatmap (Pro-only) — a strong demonstration of library mastery within the
    allowed surface.'
  - Correct, exact sequential Imprint color mapping (window.ANYPLOT_TOKENS.seq) with
    theme-adaptive cell-text contrast computed via relative luminance, so every count/percentage
    label stays legible on both green and blue fills.
  - Diagonal cells get an ink-colored outline, giving the viewer an immediate visual
    anchor for 'correct predictions' per the spec's suggestion.
  - Data is realistic, neutral (recycling-sorter classifier), and mathematically consistent
    — recall percentages verified correct by hand across all 5 rows.
  - Canvas (2400x2400 square), title format, axis labels, and colorbar/legend all
    match spec and style-guide exactly; no edge clipping or text overlap in either
    theme.
  weaknesses:
  - Off-diagonal cells with very different counts (e.g. Metal->Organic=0 vs Metal->Plastic=11
    vs Plastic->Metal=12) render as nearly the same shade of green because the color
    scale spans the full 0-182 domain and is dominated by the diagonal's high values
    — the color channel loses discriminating power for exactly the misclassification
    cells that matter most for error analysis. Consider a secondary/compressed scale
    for off-diagonal cells, or lean more on the printed count as the primary signal
    there.
  - Only 'raw count' and 'row-normalized (recall)' values are shown together in every
    cell; the spec asks the implementation to support column-normalized (precision)
    and total-normalized views too, and neither is offered even as an alternate render.
  - The custom marker component required real helper code (mixHex, relativeLuminance,
    ConfusionCell) — justified by the community package's lack of a native heatmap
    mark, but it pushes CQ-01 KISS-structure past a truly minimal script.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "confusion-matrix · javascript · muix · anyplot.ai" in dark ink, centered top. "Predicted Label" axis title + Paper/Glass/Metal/Plastic/Organic tick labels along the top; rotated "True Label" axis title + same class tick labels down the left. Bottom-right shows a horizontal green-to-blue colorbar labeled "0" and "182". All chrome text is dark-on-light and clearly legible.
      Data: 5x5 grid of colored square cells. Diagonal cells (182/151/142/158/176 — the correct-prediction counts) render in blue with a solid dark ink outline; all off-diagonal (misclassification) cells render in green. Each cell shows a bold white count and a smaller white row-normalized percentage below it. First-glance color read is dominated by the diagonal; the off-diagonal cells are visually similar shades of green despite having different underlying counts (0 up to 12).
      Legibility verdict: PASS — every title, axis label, tick label, and in-cell number is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render. Title, axis titles, and tick labels now render in light ink, clearly legible against the dark background. The diagonal-cell outline flips from dark ink to a light/off-white ink stroke, remaining visible against the blue fill.
      Data: Cell fill colors (green for off-diagonal, blue for diagonal) are pixel-identical to the light render — confirmed by the implementation building both from the same tokens.seq stops via mixHex, independent of theme. Only the chrome (title, axis text, cell-outline stroke, page background) flips between renders.
      Legibility verdict: PASS — no dark-on-dark failures found; all chrome text and in-cell white numbers remain clearly readable against the dark background.
