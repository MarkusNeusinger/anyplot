review:
  strengths:
  - 'Uses MUI X idiomatically: a ScatterChart with two band axes, a custom `scatter`
    slot (ConfusionCell) drawing one rect per cell from the series'' own xScale/yScale/colorGetter,
    and a zAxis continuous colorMap feeding a ContinuousColorLegend through the `legend`
    slot'
  - 'Imprint sequential ramp built from tokens.seq (#009E73 → #4467A3) with a 0.45
    power curve, so small confusions (11, 12) still separate visibly from the near-zero
    cells while the diagonal takes the blue end'
  - 'Two-level cell typography: a bold count on the diagonal and a lighter row-percentage
    line underneath, legible on every cell in both themes'
  - The color-bar title names both encodings ('Count · % = share of true-class row
    (recall)'), so the normalization of the percentages is explicit
  - Diagonal outline uses the theme ink token, flipping from near-black to off-white
    so it reads in both renders without tinting the cell colors
  - Realistic waste-sorting classifier with imbalanced classes and a plausible Metal↔Plastic
    confusion; classes derived from the data so a predicted-only class still gets
    its row and column
  weaknesses:
  - 'CQ-04 (code): lines 6–9 repeat the header block with stale values (''Library:
    muix 7.29.1 | JavaScript 22.23.2'', ''Created: 2026-09-04''), contradicting the
    pinned MUI X 9 the code is written for → remove the second header block so only
    the rewritten one above the orientation directive remains. Likely cause: the header
    rewrite inserted a new block instead of replacing the original one.'
  - 'Suggestion: center the matrix under the title — it sits about 290 CSS px from
    the left edge but only about 40 px from the right, because the 140 px y-axis band
    plus 60 px left margin leave a wide gap between ''True Label'' and the tick labels.'
  - 'Suggestion: end the color bar flush with the matrix''s right edge (it currently
    runs about 20 px past the Organic column).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: title "confusion-matrix · javascript · muix · anyplot.ai" centered at top in dark ink (~48% width); "Predicted Label" axis title above the matrix with the class tick labels Paper/Glass/Metal/Plastic/Organic on top; rotated "True Label" on the left with the same five classes in the same order as row labels. Tick labels in inkSoft gray, axis titles in ink. No axis lines or ticks. All readable.
      Data: 5x5 grid of square cells with small page-colored gaps, filled with the Imprint sequential ramp — brand green #009E73 for 0, teal for small counts, blue #4467A3 for the diagonal (182, 151, 142, 158, 176). Each cell shows a large count and a smaller row-% (recall) line in light text; diagonal counts are bold and outlined with a 4 px near-black ink stroke. Horizontal color bar bottom-right, titled "Count · % = share of true-class row (recall)", ticks 0 and 182.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and color-bar title in light ink; tick labels in light gray inkSoft; no dark-on-dark text anywhere.
      Data: cell colors identical to the light render (green → teal → blue); in-cell text the same light color on every cell and readable; diagonal outline flips to off-white ink and remains clearly visible. Color bar identical.
      Legibility verdict: PASS
