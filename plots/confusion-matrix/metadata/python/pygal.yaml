review:
  strengths:
  - 'Sequential imprint_seq colormap (#009E73 → #4467A3) interpolated per cell and
    repeated in a 50-segment color bar titled Count, with ticks at min, mid and max'
  - Diagonal correct predictions outlined with a heavier INK stroke that flips with
    the theme, leaving cell colors and white bold counts readable in both renders
  - 'Theme tokens threaded through every custom SVG text node, so class names, axis
    titles and color bar labels read correctly on #FAF8F1 and #1A1A17'
  - Extends pygal's Graph class and draws through its own self.svg.node API, so the
    chart keeps pygal's native SVG/HTML output
  weaknesses:
  - 'VQ-01 (both): class-name tick labels at 34 px, color bar ticks at 30 px, axis
    titles at 40 px and the title at 52 px sit below pygal''s reference sizes (ticks
    44, axis titles 56, title 66), so the class names and color bar ticks read small
    beside the 52 px cell counts → ticks and color bar labels 44 px (+10 / +14 px),
    axis titles 56 px (+16 px), title 66 px (+14 px). Likely cause: tick_size = min(34,
    …), cb_label_size = 30, the hard-coded 40 for the axis titles, title_font_size=52.'
  - 'VQ-05 (both): an empty band of about 320 px sits between the title and the top
    of the grid while the space under the Predicted Label title is about 160 px, so
    the matrix block sits low on the canvas → balance the top and bottom whitespace
    (about −150 px at the top). Likely cause: margin_top=130 plus label_margin_top=50
    on top of the centering offset (available_height - grid_size) / 2.'
  - 'Suggestion: the four short class names would fit horizontally under their columns,
    which reads faster than the 45° rotation.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400×2400 square canvas.
      Chrome: title "confusion-matrix · python · pygal · anyplot.ai" in dark ink at the top centre; bold "True Label" rotated on the left and "Predicted Label" under the grid; class names Positive, Neutral, Negative, Mixed on the rows and rotated 45° under the columns; color bar titled "Count" on the right with ticks 142, 73, 5. All text dark and readable.
      Data: 4×4 grid of rounded cells with small gaps, colored on imprint_seq from brand green #009E73 (low counts) to blue #4467A3 (142); diagonal cells 142, 98, 125, 89 are the blue ones and carry a heavier dark outline; every cell shows its count in white bold text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, class names and color bar labels flip to light ink #F0EFE8 and read clearly; no dark-on-dark text.
      Data: cell colors and color bar identical to the light render; the diagonal outline flips to light ink; white counts stay readable on every cell.
      Legibility verdict: PASS
