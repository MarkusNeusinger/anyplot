review:
  strengths:
  - 'imprint_seq fields ramp with each theme''s own stops (#66E2B2 → #009E73 → #024582
    → #351E45 light, #404C02 → #009E73 → #CDD9FF dark), blended in sRGB like the library
    prompt''s ramp_color helper and repeated in a 50-segment color bar titled Count'
  - Cell counts take dark or white ink by the fill's luminance, so 142, 125, 98 and
    89 stay readable on the pale-blue and teal diagonal of the dark render as well
    as on the violet one of the light render
  - Diagonal correct predictions outlined with a heavier INK stroke that flips with
    the theme, leaving cell colors and counts readable
  - Extends pygal's Graph class and draws through its own self.svg.node API, so the
    chart keeps pygal's native SVG/HTML output
  weaknesses:
  - 'Suggestion: the color bar title Count starts a few pixels right of the top-right
    cell; centering it over the bar with a little more gap from the grid would separate
    the key from the matrix.'
  - 'Suggestion: the four short class names would fit horizontally under their columns,
    which reads faster than the 45° rotation.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400×2400 square canvas.
      Chrome: title "confusion-matrix · python · pygal · anyplot.ai" in dark ink at the top centre; bold "True Label" rotated on the left and "Predicted Label" under the grid; class names Positive, Neutral, Negative, Mixed on the rows and rotated 45° under the columns; color bar titled "Count" on the right with ticks 142, 73, 5. All text dark and readable.
      Data: 4×4 grid of rounded cells with small gaps on the imprint_seq fields ramp: low counts pale mint, 89 teal, 98 deep teal-blue, 125 navy, 142 dark violet; diagonal cells carry a heavier dark outline; counts dark on the mint cells and white on the dark diagonal cells.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, class names and color bar labels flip to light ink and read clearly; no dark-on-dark text.
      Data: the ramp uses the dark fields stops: low counts dark olive receding into the page, 28 dark green, 89 and 98 teal, 125 light blue, 142 pale lavender-blue; diagonal outline flips to light ink; counts white on the olive cells and dark on the bright diagonal cells, all readable.
      Legibility verdict: PASS
