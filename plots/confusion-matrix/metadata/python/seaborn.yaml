review:
  strengths:
  - Uses imprint_seq for the single-polarity counts; data colors are identical in
    both renders, with only the page and the gaps between cells switching themes
  - A labelled DataFrame (index and columns named True Label / Predicted Label) lets
    seaborn take its tick labels and axis titles straight from the data
  - Realistic plant-disease scenario where the Leaf Rust/Blight mirror confusion and
    the rare Mosaic Virus class show through the data alone
  - Correct 2400x2400 square canvas with explicit font sizes that read well in both
    themes
  weaknesses:
  - 'VQ-05 (both): the 77-character title spans about 92 % of the canvas width, well
    past the heatmap and color bar it heads → under about 85 % of the canvas (about
    -1 pt, or a shorter descriptive prefix). Likely cause: title_fontsize = round(12
    * 67 / len(title)) still gives 10 pt for this title.'
  - 'CQ-01 (code): lines 88-90 define a _luminance helper function → no functions;
    delete it along with the loop that calls it (see the CQ-04 line). Likely cause:
    a hand-written contrast pass.'
  - 'CQ-01 (code): line 50 has no column constant for the required role `class_names`
    → one string constant per required column role above the Data block, each with
    a trailing # role: <role> comment naming a spec role. Likely cause: column names
    are typed where they are used instead of once, above the block.'
  - 'CQ-04 (code): lines 87-99 work out a light or dark text color for every cell,
    which sns.heatmap already does from each cell''s relative luminance (and the strict
    zip fails when a cell is NaN, because seaborn draws no text there) → remove; rely
    on sns.heatmap''s built-in annotation contrast. Likely cause: an unneeded override
    of the annotation colors.'
  - 'Suggestion: an optional diagonal outline (the Notes allow one) would mark the
    correct predictions without changing cell colors.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: title "Plant Disease Classifier · confusion-matrix · python · seaborn · anyplot.ai" in dark ink across the top; y-axis title "True Label", x-axis title "Predicted Label"; class tick labels Healthy, Leaf Rust, Blight, Mildew, Mosaic Virus (x rotated 30 degrees) in dark grey; color bar on the right titled "Count" with ticks 25-175. All readable.
      Data: 5x5 grid of square cells separated by page-colored gaps, colored with imprint_seq (#009E73 green for low counts to #4467A3 blue for the highest); the diagonal 184/131/118/142/87 in blue tones with white bold numbers; off-diagonal cells green with near-black bold numbers; Leaf Rust/Blight confusion (21, 24) a slightly bluer green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
