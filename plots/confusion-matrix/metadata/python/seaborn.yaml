      Chrome: title, axis titles and the "Count" color bar title in light ink; tick labels in light grey #B8B7B0; no dark-on-dark text.
      Data: cell colors identical to the light render; the gaps between cells take the dark page color; cell numbers keep the same white/near-black choice per cell and stay readable.
      Legibility verdict: PASS
