  strengths:
  - 'imprint_seq ramp (#009E73 -> #4467A3) through a LinearColorMapper and transform(),
    with a matching ColorBar titled Count'
  - Cell-value ink chosen per cell by a WCAG contrast test and passed to LabelSet
    as a source column, so every count reads on both green and blue cells in both
    themes
  - Correct square 2400x2400 canvas with true labels on y (first class at top) and
    predicted labels on x in the same order; all chrome threaded through theme tokens
  - 'Tidy data path: DataFrame -> stack() -> ColumnDataSource, ready for pd.crosstab(y_true,
    y_pred) input'
  weaknesses:
  - 'CQ-04 (code): lerp_hex and the 256-step list comprehension (lines 32-36, 47)
    rewrite what bokeh.palettes.interp_palette([''#009E73'', ''#4467A3''], 256) computes,
    and ELEVATED_BG (line 24) is never used → replace the helper with interp_palette
    and delete ELEVATED_BG. Likely cause: hand-built gradient.'
  - 'CQ-01 (code): three helper functions (lerp_hex, luminance, cell_color) break
    the linear script structure → inline the ramp via interp_palette and compute text_color
    with a vectorized expression over long[COUNT]. Likely cause: helper-function style
    for the ramp and contrast test.'
  - 'Suggestion: a subtle outline on the diagonal cells (the highlight the Notes allow)
    would mark the correct predictions beyond the color alone.'
  - 'Suggestion: a HoverTool showing the row-normalized recall per cell would add
    value in the HTML view.'
