review:
  strengths:
  - imprint_seq colormap with vmin=0 and a labelled color bar that names both the
    count and the row normalization of the percentages
  - Theme tokens threaded through every chrome element; both renders fully legible
    and the data colors identical
  - Minor-tick grid in the page color turns the cells into separate tiles, a native
    matplotlib idiom
  - Cell ink chosen from the luminance of each cell's own colormap color via im.norm
  - 'Adaptable structure: column constants, a Data block that ends in one tidy df,
    and pd.crosstab reindexed so both axes share the same class order'
  weaknesses:
  - 'VQ-05 (both): the square matrix fills only about 60 % of the 2400x2400 canvas,
    leaving an empty band of about 230 px between the title and the grid and about
    250 px below the x-axis title → grow the grid so the bands shrink by roughly half
    (e.g. left 0.2 → 0.15, right 0.85 → 0.9, top 0.9 → 0.88). Likely cause: aspect=''equal''
    inside a subplots_adjust box (left=0.2, right=0.85, top=0.9, bottom=0.18) that
    is taller than it is wide, so the width limits the grid.'
  - 'DQ-01 (both): all 45 test samples are classified correctly, so every off-diagonal
    cell is 0 and the matrix shows no false positive or false negative, the misclassification
    pattern the plot type exists to reveal → example data with a few errors, e.g.
    a classifier trained on two features or a harder split so versicolor and virginica
    are confused. Likely cause: RandomForestClassifier on all four Iris features with
    random_state=42 is perfect on this split.'
  - 'Suggestion: integer color-bar ticks (cbar.locator = MaxNLocator(integer=True))
    would avoid 2.5 and 17.5 on a count scale.'
  - 'Suggestion: the dark cell ink on the #4467A3 end of the ramp has only about 3:1
    contrast; a slightly higher luminance threshold would switch those cells to light
    ink.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: title "Iris Classifier · confusion-matrix · python · matplotlib · anyplot.ai" in dark ink at the top (about 90 % of the width, not clipped); "True Label" (y) and "Predicted Label" (x) in dark ink; class tick labels setosa / versicolor / virginica in soft dark grey, x ticks rotated 30°; color bar on the right, 0.0 to 17.5 ticks, labelled "Count (% = share of true class)". No spines, no tick marks. All readable.
      Data: 3x3 grid of tiles separated by page-colored gutters. imprint_seq ramp: zero cells in brand green #009E73, diagonal 13 / 13 / 19 in teal-blue to #4467A3 blue. Each cell has a bold dark "count\n(share%)" label: 19 (100%), 13 (100%), 13 (100%) on the diagonal, 0 (0%) elsewhere. Wide empty bands above and below the grid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick labels and color-bar ticks in light grey, color-bar outline light grey. No dark-on-dark text.
      Data: cell colors identical to the light render; gutters now near-black. Cell labels stay dark ink on the green and blue cells and remain readable.
      Legibility verdict: PASS
