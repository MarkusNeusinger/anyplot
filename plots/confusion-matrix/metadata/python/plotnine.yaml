  strengths:
  - 'imprint_seq (#009E73 -> #4467A3) via scale_fill_gradient, identical in both themes,
    with a colorbar titled ''Sample Count'''
  - Cell-label color flips at the value midpoint through scale_color_identity, so
    every count reads on green and blue cells alike in both themes
