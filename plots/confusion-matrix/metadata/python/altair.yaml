      Data: 4x4 grid of square tiles separated by page-colored gutters; off-diagonal cells in brand green #009E73 (counts 2–12, near-identical shade), diagonal cells (85, 78, 82, 91) in imprint_seq blue around #4467A3. Off-diagonal counts in bold near-black ink, diagonal counts in bold off-white ink; all numbers clearly legible.
