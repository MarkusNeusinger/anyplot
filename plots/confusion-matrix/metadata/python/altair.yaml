review:
  strengths:
  - 'Correct confusion-matrix grid: True Label on y, Predicted Label on x, the same
    class order (Dog, Cat, Bird, Fish) on both axes so the correct predictions fall
    on one diagonal'
  - Matrix computed with sklearn.metrics.confusion_matrix from tidy per-sample true/predicted
    labels, with the class order derived from the data
  - 'Imprint imprint_seq (#009E73 to #4467A3) on a quantitative color scale with a
    horizontal color bar titled ''Count (samples)'' naming the raw-count normalization'
  - Every cell carries a bold 22 px count whose ink is chosen per cell by WCAG contrast
    against its fill, so numbers stay legible on green and blue cells in both themes
  - Page-colored 2.5 px cell strokes form clean gutters between tiles, axis ticks
    and domain lines removed, color bar aligned with the grid's left edge
  - 'Idiomatic Vega-Lite layering: shared x/y encodings across a mark_rect and a mark_text
    layer, scale=None identity color channel for the per-cell ink, resolve_scale to
    keep the two color channels independent'
  - Tooltips with readable titles on both layers for the HTML output; theme tokens
    threaded through title, axes and legend so both renders are theme-correct
  weaknesses:
  - 'Suggestion: the diagonal highlight the Notes allow, as a thin ink-colored outline
    on the four diagonal cells, would underline the correct predictions without touching
    cell colors or numbers.'
  - 'Suggestion: a row-normalized (recall) variant shown as a small percentage under
    each count would demonstrate one of the normalization options the Notes list.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas (the padded border matches the page color).
