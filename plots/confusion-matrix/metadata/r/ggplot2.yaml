review:
  strengths:
  - 'Correct Imprint sequential colormap (#009E73 → #4467A3) for the continuous count
    fill — exactly matches imprint_seq guidance for single-polarity data'
  - 'Theme-adaptive chrome implemented correctly across both renders: background,
    title, axis text, and the diagonal-highlight border color (INK token) all flip
    between light and dark while the fill gradient itself stays identical'
  - Diagonal highlighting via a second, filtered geom_tile layer with a themed border
    directly satisfies the spec's note to 'consider highlighting diagonal for visual
    clarity'
  - 'Excellent data quality: row totals reconcile exactly with the declared class_sizes
    (150/130/90/70/60), and per-class accuracy (82-88%) with varied, plausible off-diagonal
    confusion patterns gives full feature coverage'
  - Clean KISS structure with set.seed(42) reproducibility and explicit font sizes
    matching the ggplot2 style-guide defaults (title 12pt, axis title 10pt, axis/legend
    text 8pt)
  - Clear colorbar with 'Count' legend title, correctly labeled 'Predicted Label'
    / 'True Label' axes matching the spec's exact wording
  weaknesses:
  - Spec's Notes explicitly call for normalization options (none/row/column/total);
    the implementation only ever shows raw counts with no normalized or percentage
    view — consider adding per-cell percentage annotations (e.g. row-normalized recall)
    alongside or instead of raw counts
  - 'Design Excellence is solid but not yet exceptional: the diagonal highlight and
    adaptive text color are good touches, but there''s no summary signal (e.g. overall/per-class
    accuracy annotation) to sharpen the data story beyond the raw grid'
  - 'Library Mastery is generic: the two-layer geom_tile + scale_color_identity trick
    is a nice idiom but nothing here is uniquely hard to replicate in another heatmap
    library — consider a ggplot2-distinctive touch (e.g. annotate() for a marginal
    accuracy strip, or facet_wrap for a normalized/raw comparison)'
  image_description: |-
