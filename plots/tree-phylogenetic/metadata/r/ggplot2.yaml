review:
  strengths:
  - 'Clear visual hierarchy: brand green (#009E73) highlights the ''Great apes (Hominidae)''
    clade against muted gray for ''Other primates'', immediately drawing the eye to
    the human-relevant lineage - genuine data storytelling via the muted semantic
    anchor.'
  - Scientifically accurate divergence times (Human-Chimp ~6 Mya, Hominidae ~15 Mya,
    Catarrhini ~29 Mya, root ~43 Mya) match published mtDNA/nuclear phylogenomic estimates
    for primates.
  - Theme-adaptive chrome correctly implemented - both renders keep the brand green
    and clade gray perceptually identical while background/text/grid flip appropriately
    between light and dark.
  - Clean, idiomatic ggplot2 composition of a custom cladogram from geom_segment/geom_point/geom_text
    layers - a sensible native-grammar workaround given ggplot2 has no built-in phylo/newick
    geom.
  - Explicit font sizing throughout, well-proportioned title, no clipping at canvas
    edges; landscape 3200x1800 canvas confirmed exact.
  weaknesses:
  - 'Legend key glyphs show a stray faint italic ''a'' character bleeding underneath
    the point+line key swatch for both ''Great apes (Hominidae)'' and ''Other primates''
    entries, visible in both light and dark renders. Cause: geom_text() maps color
    = clade and gets merged into the same legend as geom_point/geom_segment, so ggplot2
    draws the default text-layer key glyph (a literal ''a'') on top of the point/line
    glyph. Fix: add show.legend = FALSE to the geom_text() call so only the point+segment
    layers contribute to the legend key.'
  - No explicit branch-length scale bar beyond the x-axis ticks - the spec suggests
    a scale bar to indicate substitution/divergence units; the current x-axis already
    serves this role but a dedicated scale annotation would be a nice-to-have polish,
    not a defect.
  - Data is sparse (7 tips) - branch line width (1.1) and tip marker size (2.8) could
    be slightly larger/more prominent per the density heuristic for small trees, giving
    the tree a bit more visual weight on the wide canvas.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "Primate Phylogeny · tree-phylogenetic · r · ggplot2 · anyplot.ai" in dark ink, clearly readable. X-axis label "Divergence time (millions of years ago)" and tick labels (40, 30, 20, 10, 0) in dark/soft-dark ink, all legible. Y-axis intentionally has no ticks/title (species names serve as the categorical axis). Subtle vertical major gridlines only. Legend "Clade" at bottom with two entries.
      Data: Rectangular cladogram with right-angled branches. "Great apes (Hominidae)" clade (Human, Chimpanzee, Gorilla, Orangutan) rendered in brand green (#009E73); "Other primates" (Gibbon, Rhesus Macaque, Common Marmoset) rendered in muted gray. Tip labels are italic species names in matching clade color, placed to the right of each tip marker.
      Legibility verdict: PASS - all title/axis/tick/legend text is clearly readable against the light background. Minor defect: a faint stray italic "a" character is visible bleeding under both legend key glyphs (a geom_text legend-merge artifact), but it does not impair overall readability.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, x-axis label, and tick labels all rendered in light ink (white/light gray), clearly legible against the dark background - no dark-on-dark failures observed. Gridlines are subtle light vertical lines.
      Data: Data colors are identical to the light render - the Great-apes clade is the same #009E73 green, and the "Other primates" clade uses the theme-adaptive muted gray token (correctly lighter in dark mode than in light mode, per the muted semantic-anchor definition). Only chrome flipped, as required.
      Legibility verdict: PASS - all text reads clearly on the dark surface. Same minor stray "a" legend-glyph artifact reproduces here, in both legend entries.
