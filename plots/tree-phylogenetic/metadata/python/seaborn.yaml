review:
  strengths:
  - Branch lengths drawn to scale on a labelled distance axis with its unit (million
    years), root on the left and tips at 0
  - Theme tokens threaded through sns.set_theme rc before the figure is created, so
    the plot panel, legend frame and all text flip correctly between the two themes
  - Tip labels take their clade color and every name sits at the end of its branch,
    readable in both themes
  - Canonical 3200x1800 canvas with the full mandated title and no clipping
  weaknesses:
  - 'SC-02 (both): the Lesser Apes (purple) and New World Monkeys (ochre) colors cover
    no branch: the Orangutan, Gibbon and Marmoset branches are drawn in the neutral
    INK_SOFT, so two legend swatches match only tip labels, against C5 (the color
    covering all branches of the clade) → draw each clade''s terminal branches in
    its color. Likely cause: link_color_func colors whole U-links, so a tip whose
    sibling belongs to another clade inherits the neutral color of the joining link.'
  - 'DQ-02 (both): Orangutan is labelled ''Lesser Apes''; orangutans are great apes
    (Hominidae), and the tree itself joins Orangutan to the great apes at 14 Myr before
    Gibbon at 18 → put Orangutan in Great Apes and keep Lesser Apes for the gibbon.
    Likely cause: the clade_of mapping.'
  - 'VQ-01 (both): legend entries and the italic scale note at 7 pt sit below the
    style guide''s 8 pt legend reference and read small beside the 10 pt tip labels
    → 8 pt (+1 pt). Likely cause: ax.legend(fontsize=7) and ax.annotate(fontsize=7).'
  - 'CQ-04 (code): n = len(species) (line 90) is never used, and ax.tick_params(axis=''y'',
    labelsize=9) (line 135) contradicts leaf_font_size=10 (line 125) → delete the
    unused variable and set the tip size once. Likely cause: leftovers from an earlier
    version.'
  - 'Suggestion: the italic ''Scale: branch length = evolutionary distance'' note
    repeats what the labelled axis already says and could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across page and plot panel.
      Chrome: bold title 'tree-phylogenetic · python · seaborn · anyplot.ai' in dark ink, x-axis 'Evolutionary distance (million years)' with ticks 50..0 (reversed, tips at 0), subtle vertical grid, left and bottom spines only; legend 'Clade' on an elevated off-white box in the empty space left of the ape clades; italic scale note bottom-left. All text readable.
      Data: rectangular dendrogram of 10 primates; Great Apes branches #009E73, Old World Monkeys #4467A3, Prosimians (Lemur, Tarsier) #AE3030, mixed-clade branches neutral grey; Orangutan and Gibbon labels purple and Marmoset label ochre, but their branches grey. Tip labels bold in clade colors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 for page and plot panel.
