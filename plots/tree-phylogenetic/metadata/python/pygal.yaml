review:
  strengths:
  - 'Branch lengths drawn exactly to scale: tip depths read off the axis match the
    data (Human/Chimpanzee 0.225, Gorilla 0.24, Orangutan/Gibbon/Macaque 0.26); unequal
    tip depths are kept, not equalized'
  - Rectangular layout with right-angled connectors; tip order and spacing come from
    a depth-first layout, so only horizontal length encodes distance
  - Clade coloring covers every branch and connector of each clade, explained by a
    bottom legend; the shared ancestral stems stay in neutral theme ink
  - Labeled branch-length axis with units 'substitutions per site' doubles as the
    scale bar, drawn to the same scale as the branches
  - 'Idiomatic pygal: one XY series per clade using allow_interruptions=True with
    (None, None) breaks, and per-point label dicts with print_labels for tip names;
    native HTML tooltips in the interactive output'
  - Full theme threading through Style (backgrounds, foregrounds, guides, value_colors)
    - both renders are clean
  weaknesses:
  - 'Suggestion: the legend swatches touch their text and the three entries spread
    across the full width with the last one far to the right; a small gap after the
    swatch and a tighter legend would read more cleanly.'
  - 'Suggestion: the x range extends to 0.34 to fit the tip labels, leaving an empty
    band of guides past 0.28; a slightly tighter range would give the tree more width.'
