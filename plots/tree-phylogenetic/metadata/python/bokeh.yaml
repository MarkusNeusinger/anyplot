    descriptions in the HTML view
  weaknesses:
  - 'SC-02 (both): no clade is color-coded and no lineage highlighted; all branches
    are the same #009E73, so the ''A good version shows'' clade-color property is
    missed → color the branches of at least one clade (e.g. Hominini or Homininae)
    in a further Imprint position covering all its branches, explained by the existing
    clade labels or the legend. Likely cause: every p.line uses line_color=BRAND.'
  - 'VQ-03 (both): the legend glyphs are small dots (about 8 px) and the leaf glyph
    does not show the green fill with outline of the 34 px leaf markers, so the legend
    does not match its marks → glyphs at roughly the marker size and fill. Likely
    cause: Legend default glyph_width/glyph_height with scatter size 34 renderers.'
  - 'Suggestion: draw all branches through one p.segment glyph on a ColumnDataSource
    instead of one p.line per branch.'
