review:
  strengths:
  - 'Layout computed from a single parent/branch-length table: x is the summed branch
    length from the root, so every branch is drawn proportionally (C1) and the scale
    bar shares that scale (C4)'
  - 'Imprint palette in canonical order with scale_color_manual limits taken from
    the data order, first clade #009E73; chrome flips cleanly between the two themes'
  - Every tip labeled at the end of its branch with ink dots that read in both themes
    (C3)
  - Correct 3200x1800 canvas and the full mandated title
  weaknesses:
  - 'SC-02 (both): the root connector is colored ''Haplorrhini'' although it joins
    the Strepsirrhini split, and per-node nested colors (Hominoidea stems orange,
    Gibbon red, Orangutan cyan) leave no named clade colored over all of its branches
    → color each clade''s whole subtree in one hue and give the root its own neutral
    ink. Likely cause: the clade column assigns the root ''Haplorrhini'' and gives
    single tips their own clade.'
  - 'VQ-02 (both): legend text touches the legend frame — ''Old World monkeys'' meets
    the right border and the ''Clade'' title the left border → at least a few px of
    padding inside the box. Likely cause: legend_background frame without legend_margin/legend
    box padding.'
  - 'CQ-01 (code): a recursive place() helper function (lines 78–87) breaks the flat
    Imports → Data → Plot → Save structure → compute x and y with loops over the parent
    table (x in data order, tip y by order, internal y by reverse-order averaging).
    Likely cause: recursive layout helper.'
  - 'Suggestion: placing the legend closer to the tip labels would reduce the empty
    band between Chimpanzee and the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'tree-phylogenetic · python · plotnine · anyplot.ai' centered in dark ink; tip labels (Orangutan, Chimpanzee, Human, Gorilla, Gibbon, Baboon, Macaque, Lemur) in dark ink; scale bar with '0.1 substitutions / site' in INK_SOFT at bottom left; legend 'Clade' in an elevated box with a soft frame, right side. All readable.
      Data: rectangular phylogram with right-angled branches colored by clade: Haplorrhini #009E73 (root stem), Strepsirrhini #C475FD (Lemur), Old World monkeys #4467A3, Hominoidea #BD8233, Gibbons #AE3030, Orangutan #2ABCCD, Gorilla #954477, Hominini #99B314; dark ink tip dots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
