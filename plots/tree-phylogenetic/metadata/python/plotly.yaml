review:
  strengths:
  - Branch geometry is computed from an edge list with cumulative branch lengths,
    so every tip sits at its true distance from the root and the right-angled phylogram
    is exact
  - 'Clades colour-coded in Imprint order (Papionini #009E73, Cercopithecini, Colobinae)
    with the neutral backbone in INK_SOFT and a native legend from one trace per clade'
  - Both a 0.1 substitutions/site scale bar and a labeled distance axis, drawn in
    branch units
  - Theme tokens threaded through every text and line element; both renders read cleanly
  - Hover on tips and internal nodes shows the node name and its distance in the HTML
    view
  weaknesses:
  - 'Suggestion: label the clades at their stems (or bracket them beside the tips)
    so the colour key sits on the tree instead of only in the top legend.'
  - 'Suggestion: drop the x-axis range to about 1.12 × the deepest tip; the band between
    0.55 and 0.65 is empty beside the labels.'
