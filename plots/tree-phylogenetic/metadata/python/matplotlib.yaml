review:
  strengths:
  - 'Rectangular layout computed from the edge list: x is the cumulative branch length
    from the root, so every horizontal branch is drawn exactly to its own length and
    tips end at different depths, as the spec requires'
  - All branches are drawn as two LineCollection objects with per-segment colors,
    a compact and idiomatic matplotlib approach instead of hundreds of ax.plot calls
  - 'Each clade colors every branch below its root (Prosimians #009E73, Monkeys #C475FD,
    Apes #4467A3 in canonical Imprint order) while the uncolored backbone stays in
    INK_SOFT, so the three clades separate cleanly from the shared ancestry'
  - Both a 0.05 substitutions-per-site scale bar in data units and a labeled branch-length
    axis are present; the scale step is derived from the tree depth by a 1-2-5 rule
    rather than hard-coded
  - Theme tokens are threaded through every chrome element (title, tick labels, spine,
    grid, legend frame, tip labels, scale bar); both renders are fully readable
  - Y axis removed entirely since tip spacing carries no meaning, with a vertical-only
    grid aligned to the branch-length scale
  weaknesses:
  - 'DQ-02 (both): the example topology contradicts the mitochondrial primate phylogeny
    it claims: Tarsier is nested inside ''Lorisoids'' as Galago''s sister, and Old
    World Monkeys are grouped with New World Monkeys in a ''Monkeys'' clade sister
    to Apes → Tarsier as sister to Simians (Haplorhini), and Old World Monkeys as
    sister to Apes (Catarrhini) with New World Monkeys outside them. Likely cause:
    the parent column of the edge list (rows Lorisoids/Tarsier, Monkeys/Old World
    Monkeys).'
  - 'Suggestion: the scale-bar label at 7 pt is crossed by the 0.10 grid line; placing
    the bar where no grid line runs through its label would read more cleanly.'
  - 'Suggestion: small clade labels at the clade roots (in the clade color) would
    let the reader map colors without looking up the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "tree-phylogenetic · python · matplotlib · anyplot.ai" in dark ink at the top (~53% of the width); x-axis label "Branch length (substitutions per site)" and ticks 0.00-0.30 in dark/soft ink; y axis hidden; subtle vertical grid lines; legend "Clade" upper right on an elevated frame. All text readable.
      Data: rectangular phylogram of 12 primate tips. Backbone (root stem and Simians split) in INK_SOFT gray; Prosimians clade (Lemur, Tarsier, Galago) in #009E73, Monkeys (Rhesus Macaque, Baboon, Capuchin, Spider Monkey) in #C475FD, Apes (Human, Chimpanzee, Gorilla, Orangutan, Gibbon) in #4467A3. Tips have small colored dots and dark labels; tip depths vary from 0.13 (Human) to 0.24 (Tarsier, Galago). A black 0.05 scale bar with "0.05 substitutions per site" sits bottom left.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, tip labels and axis label in light ink; ticks and legend entries in light gray INK_SOFT; legend frame on #242420; grid subtle but visible. No dark-on-dark text anywhere.
      Data: clade colors identical to the light render (#009E73, #C475FD, #4467A3); backbone flips to light gray and the scale bar to near-white, as chrome should.
      Legibility verdict: PASS
