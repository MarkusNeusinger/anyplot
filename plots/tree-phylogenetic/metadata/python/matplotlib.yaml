review:
  strengths:
  - Branch lengths drawn proportionally from the root along x; tips end at different
    depths, so the long Tarsier branch and the short hominin splits read correctly
  - Clade colors cover every branch of each clade, including its stem, while the unclassified
    backbone stays in neutral ink, explained by a 'Clade' legend
  - Both a 0.05 substitutions-per-site scale bar and a labeled branch-length axis
    drawn to the same scale as the branches
  - Whole tree drawn with two LineCollections carrying per-segment colors; tip labels
    placed with annotate offset points
  - Theme tokens applied to every text, spine, grid and legend element; both renders
    fully readable
  weaknesses:
  - 'Suggestion: the 0.10 vertical grid line runs through the ''per site'' text of
    the scale-bar label; a slightly shorter label position or a page-colored text
    background would keep it clean.'
  - 'Suggestion: the labeled x axis and the scale bar both give the scale; keeping
    only one would reduce redundancy.'
  - 'Suggestion: a circular layout variant would showcase matplotlib''s polar projection,
    which the Notes also allow.'
