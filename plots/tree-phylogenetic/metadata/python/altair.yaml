    at 0 (domain from 0, nice=False or zero=True). Likely cause: alt.Scale(domain=[-0.01,
    ...]) with Vega-Lite''s default nice rounding.'
  - 'CQ-01 (code): node_table() is a non-recursive helper called twice → build leaf_df
    and internal_df inline from one comprehension. Likely cause: helper function for
    two DataFrame constructions.'
  - 'Suggestion: a highlighted lineage (for example the Human branch) could give the
    tree a focal point.'
