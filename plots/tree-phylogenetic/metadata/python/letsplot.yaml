      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: bold dark title 'tree-phylogenetic · python · letsplot · anyplot.ai' top-left; x-axis 'Branch length (substitutions per site)' with ticks 0-0.7 in soft gray; y axis removed; subtle vertical gridlines; legend 'Clade' on an elevated panel right-centre. All readable.
      Data: rectangular phylogram, root at 0; Hominines (Human, Chimpanzee, Gorilla) in #009E73, Orangutan and gibbon in #C475FD, Old World monkeys (Macaque, Baboon, Mandrill) in #4467A3 on every branch of their clade; the root-to-ape-ancestor backbone in neutral dark gray labeled 'Shared ancestry'. Node dots at every split and tip; tip names in soft gray just right of each tip.
