review:
  strengths:
  - Every branch, internal and terminal, carries its clade color via a computed node_clade
    map, with the shared backbone in neutral ink and a 'Clade' legend explaining it
  - Branch lengths drawn proportionally from a root at 0, readable against a labeled
    'Branch length (substitutions per site)' axis
  - scale_color_manual with limits fixes the legend order to the clade order plus
    the neutral entry
  - Theme tokens threaded through every chrome element; both renders fully readable
  - Data block parses a real Newick string into a node table that a user can swap
    for their own
  weaknesses:
  - 'CQ-01 (code): two helper functions, parse_newick (with a nested read) and the
    recursive place, structure the script → an inline loop over the parsed rows (an
    explicit stack for the parse and a reversed-preorder pass for the layout). Likely
    cause: recursion written as functions.'
  - 'Suggestion: a short label at each clade''s crown node could reinforce the legend
    without the eye travelling to the right.'
  - 'Suggestion: the x range stops at 1.3 × the deepest tip; a tighter limit just
    past the longest label would give the tree a little more width.'
  image_description: |-
