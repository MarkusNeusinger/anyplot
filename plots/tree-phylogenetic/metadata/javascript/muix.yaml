review:
  strengths:
  - 'Correct rectangular phylogram: x is the cumulative branch length from the root,
    parsed from a real Newick string, so tips end at uneven distances (Human 0.191
    to Lemur 0.240 substitutions per site) and no branch is equalized.'
  - 'Clade coloring covers every branch of a clade (the whole ape subtree in #009E73,
    each monkey/strepsirrhine stem in its own Imprint color); the backbone that spans
    several clades stays in neutral ink, which puts the clades in front of the structure.'
  - Labeled branch-length axis 'Branch length (substitutions per site)' shares the
    branch scale through the same xScale; a subtitle states tip count, clade count
    and the root-to-tip range.
  - 'Idiomatic MUI X composition: ChartsDataProvider + ChartsSurface with a custom
    SVG layer drawn through useXScale/useYScale, ScatterPlot tip markers whose series
    feed ChartsLegend automatically, ChartsGrid vertical and ChartsXAxis; skipAnimation
    is set.'
  - 'Theme tokens are threaded through every chrome element: the title, subtitle,
    tip labels, ticks, axis line, grid and legend all read correctly on #FAF8F1 and
    #1A1A17, and the data colors are identical in both renders.'
  weaknesses:
  - 'Suggestion: the ScatterPlot tooltip on a tip shows the internal y slot index
    next to the distance; a y-axis valueFormatter (or a tooltip slot showing the species
    name and root-to-tip distance) would make the HTML hover read for a person.'
  - 'Suggestion: a slightly smaller gap between the x tick labels and the axis title
    (axis height 72 → about 56) would tie the title closer to its scale.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas.
      Chrome: bold dark title "tree-phylogenetic · javascript · muix · anyplot.ai" at top-left, with the gray subtitle "8 species, 4 clades · root-to-tip distance 0.191–0.240 substitutions per site" below it; a horizontal legend (Apes, Old World monkeys, New World monkeys, Strepsirrhines) sits under the subtitle; the bottom x axis has ticks 0.00–0.20 and the title "Branch length (substitutions per site)"; subtle vertical grid lines; no y axis. All text is dark and readable.
      Data: a rectangular phylogram with right-angled 3 px branches. The ape subtree (Human, Chimpanzee, Gorilla, Orangutan, Gibbon) is drawn in #009E73, the Rhesus Macaque stem in purple, the Marmoset stem in blue and the Lemur stem in ochre; the backbone joins are neutral dark gray. Tip dots carry the clade color, and each species label sits just right of its tip. The tips end at different distances, and Lemur's long branch reaches 0.24.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, tip labels, legend text and axis title are light; the subtitle and ticks are light gray; the axis line is light; the grid is subtle dark gray. There is no dark-on-dark text anywhere.
      Data: the clade colors are identical to the light render (green, purple, blue, ochre); only the neutral backbone flips to light gray inkSoft, which is chrome-level ink. Brand green is clearly visible.
      Legibility verdict: PASS
