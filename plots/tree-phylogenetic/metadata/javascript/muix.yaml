review:
  strengths:
  - 'Mathematically correct phylogram layout: x-position is the true cumulative branch
    length from root, not just topological depth, so evolutionary distance is faithfully
    represented'
  - 'Elegant technique: a custom BranchLayer component reads the chart''s own useXScale/useYScale
    hooks so hand-drawn branches, tip markers (ScatterPlot), and labels stay pixel-perfect
    aligned at any render size — no MUI X chart type natively draws trees, so this
    is a well-engineered workaround within the community surface'
  - 'Clean, minimal chrome: no grid, no y-axis, single bottom x-axis with units —
    appropriate for a tree diagram'
  - Fully deterministic, realistic primate mtDNA phylogeny data with a plausible topology
    and branch-length scale
  - 'Correct theme adaptation: identical brand-green data color across light/dark,
    all chrome (title, axis, tick labels) correctly token-driven'
  weaknesses:
  - 'Composition is right-skewed/uneven: most rows leave roughly half the canvas empty
    since only two leaves (Marmoset, Lemur) reach near the axis maximum — consider
    whether a tighter x-domain, or a different aspect ratio, would balance the whitespace
    better'
  - No optional clade coloring/lineage highlighting per the spec's notes — a single
    accent on one clade or lineage would raise data-storytelling and visual interest
    without adding a second official series
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: title "tree-phylogenetic · javascript · muix · anyplot.ai" centered at top in dark ink; bottom x-axis labeled "Evolutionary distance (substitutions per site)" with ticks 0.00-0.40 in dark ink; no grid, no y-axis spine. All chrome clearly visible against the light background.
      Data: all branches and leaf tip markers are brand green (#009E73); 8 species labels (Human, Chimpanzee, Gorilla, Orangutan, Gibbon, Rhesus Macaque, Marmoset, Lemur) in dark ink next to their tips. Branch lengths are visibly proportional to evolutionary distance.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: same title and axis label/ticks, now rendered in light/near-white text against the dark background. No dark-on-dark text anywhere; all chrome legible.
      Data: branches and tip markers remain the identical brand green (#009E73) as the light render — only chrome flipped, confirming data-color consistency across themes.
      Legibility verdict: PASS
