review:
  strengths:
  - Branch lengths are drawn as cumulative root distance on a linear x scale, so each
    horizontal stem keeps its own Newick length; the render matches the data (Human
    0.191, Rhesus 0.205, Marmoset 0.220, Lemur 0.240 substitutions per site)
  - Rectangular right-angled layout with a labeled branch-length axis 'Branch length
    (substitutions per site)' at the same scale as the branches
  - Clades are colored on every branch they cover, with the multi-clade backbone kept
    in neutral inkSoft, and an HTML ChartsLegend explains the colors in Imprint order
    (brand green first)
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + ChartsWrapper + ChartsSurface
    with a custom SVG layer drawn through the useXScale/useYScale hooks, ScatterPlot
    tips (hover tooltips in HTML) and a vertical-only ChartsGrid'
  - Theme tokens are used for all chrome; both renders read cleanly, with identical
    data colors
  - The Newick string is parsed into tidy parent/branch-length records, so the plot
    code reads only the data block
  weaknesses:
  - 'Suggestion: the band between the legend and the first tip (about 200 px across
    the legend gap and SLOT_PAD) could be tightened so the tree fills more of the
    square canvas.'
  - 'Suggestion: clade labels or brackets next to the tips would let the reader identify
    clades without looking at the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold dark title "tree-phylogenetic · javascript · muix · anyplot.ai" top left, a softer subtitle "8 species, 4 clades · root-to-tip distance 0.191–0.240 substitutions per site", a horizontal legend (Apes, Old World monkeys, New World monkeys, Strepsirrhines), an x axis 0.00–0.20 with the label "Branch length (substitutions per site)", and subtle vertical grid lines. All text is dark and readable.
      Data: a rectangular right-angled tree of 8 primates. Ape branches are #009E73 (Human, Chimpanzee, Gorilla, Orangutan, Gibbon), Rhesus Macaque is lavender, Marmoset is blue, Lemur is ochre, and the backbone is a dark neutral. Tip dots and dark species labels sit at the branch ends; Lemur's tip at 0.24 is the furthest right.
