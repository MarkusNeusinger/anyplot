review:
  strengths:
  - 'Mathematically correct phylogram layout: x is the true cumulative branch length
    from the root, not topological depth, so evolutionary distance is faithfully represented
    on the axis'
  - 'Clade highlighting now implemented per the spec''s ''color-code clades or highlight
    specific lineages'' note: the Homininae subtree (Human/Chimpanzee/Gorilla) is
    drawn with a distinct color, thicker strokes, and an italic ''African apes'' callout
    that creates a clear focal point'
  - 'Elegant technique: a custom BranchLayer component reads the chart''s own useXScale/useYScale
    hooks so hand-drawn branches, tip markers (ScatterPlot), and labels stay pixel-perfect
    aligned at any render size — a well-engineered workaround since no MUI X chart
    type natively draws trees'
  - 'Clean, minimal chrome: no grid, no y-axis spine, single bottom x-axis with units
    — appropriate for a tree diagram'
  - Fully deterministic, realistic primate mtDNA phylogeny with a plausible topology
    and branch-length scale
  - 'Correct theme adaptation: identical data colors (brand green + blue) across light/dark,
    all chrome (title, axis, tick and leaf labels) correctly token-driven with no
    dark-on-dark or light-on-light failures'
  weaknesses:
  - 'Palette Compliance (VQ-07): the highlighted clade uses t.palette[2] (blue #4467A3),
    skipping t.palette[1] (lavender #C475FD) with no stated semantic reason (the style
    guide''s semantic-exception list doesn''t cover ''closely-related clade = blue'').
    Use palette[1] as the second color, or state a semantic justification, to keep
    canonical ordering.'
  - 'Composition is still right-skewed: only Marmoset and Lemur reach near the x-axis
    maximum, so a large block in the upper-right/mid-right of the canvas stays empty
    across most rows (Human/Chimpanzee/Gorilla/Orangutan/Gibbon). This is inherent
    to the tree''s branch lengths, but tightening the x-domain further or breaking/compressing
    the long Marmoset/Lemur branches would balance the whitespace better.'
  - Leaf tip markers (markerSize=8) are on the small side for only 8 sparse data points
    on a 2400x2400 canvas — slightly larger markers would better match the data-density
    heuristic for very sparse plots.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: title "tree-phylogenetic · javascript · muix · anyplot.ai" centered at top in dark ink; bottom x-axis labeled "Evolutionary distance (substitutions per site)" with ticks 0.00-0.36 in dark ink; no grid, no y-axis spine. All chrome clearly visible against the light background.
      Data: the Homininae clade (Human, Chimpanzee, Gorilla) is drawn in blue (#4467A3) with slightly thicker branch strokes and tip markers, plus an italic "African apes" callout label; the remaining five species (Orangutan, Gibbon, Rhesus Macaque, Marmoset, Lemur) are drawn in brand green (#009E73). Species labels are in dark ink next to their tips. Branch lengths are visibly proportional to evolutionary distance, with Marmoset and Lemur extending far to the right as the most divergent taxa.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: same title, axis label, and ticks, now rendered in light/near-white text against the dark background. No dark-on-dark text anywhere; all chrome legible.
      Data: the clade highlight remains the identical blue (#4467A3) and the rest remain the identical brand green (#009E73) as the light render — only chrome flipped, confirming data-color consistency across themes.
      Legibility verdict: PASS
