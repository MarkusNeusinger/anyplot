review:
  strengths:
  - 'Creative, plugin-free solution: builds a proper rectangular cladogram from Chart.js''s
    core `scatter` type using per-branch line datasets, with no reliance on unavailable
    tree/dendrogram plugins.'
  - Branch lengths are drawn proportionally via a genuine cumulative-distance layout
    (parentX + length), matching the spec's requirement for accurate evolutionary-distance
    representation.
  - Biologically accurate, neutral primate topology (Strepsirrhini/Haplorhini split,
    Platyrrhini, Cercopithecidae, Hominoidea down to Hominini) with realistic branch-length
    values.
  - Clade coloring is redundantly encoded via both branch color and matching leaf-label
    text color, keeping it CVD-safe, and the first categorical series correctly uses
    Imprint palette position 1 (#009E73).
  - 'Distinctive library usage: dynamic tick generation via `afterBuildTicks` and
    a per-tick color callback that colors each leaf''s tick label to match its clade
    — goes well beyond the basic skeleton.'
  - 'Theme-adaptive chrome is correct in both renders: backbone branches, grid, and
    text all flip appropriately between light and dark while clade data colors stay
    identical.'
  weaknesses:
  - No explicit y-axis title (e.g. 'Species') — leaf names on the tick labels imply
    it, but an explicit axis title would fully satisfy VQ-06.
  - X-axis label 'Relative evolutionary distance' doesn't state a unit (e.g. 'substitutions
    per site' as suggested in the spec notes) — currently just a unitless relative
    scale.
  - The four highlighted clades are all given equal visual weight — consider a stronger
    single focal point (e.g. emphasizing the Hominini/human lineage) per the spec's
    'highlight specific lineages for emphasis' note.
  - Unclassified backbone branches (Tarsier, Gibbon, and internal connectors) render
    in a neutral ink color with no legend entry — acceptable, but a brief 'unclassified'
    legend note would remove any ambiguity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "tree-phylogenetic · javascript · chartjs · anyplot.ai" in dark ink at top, italic gray subtitle beneath it, dark x-axis title "Relative evolutionary distance", subtle vertical gridlines at each integer tick (0-7), bottom legend with 4 colored circular swatches (Strepsirrhini, Platyrrhini, Cercopithecidae, Hominidae). All text is clearly readable against the light background — no light-on-light issues.
      Data: A rectangular cladogram (elbow-connector tree) of 12 primate species, branch lengths proportional to evolutionary distance, growing left (root, x=0) to right (leaf tips). Four clades are color-coded: Strepsirrhini in Imprint brand green (#009E73, palette position 1), Platyrrhini in lavender, Cercopithecidae in blue, Hominidae (great apes) in ochre; unclassified backbone branches (Tarsier, Gibbon, internal connectors) are dark ink/near-black. Leaf-tip markers are circular dots colored to match their clade, and species-name labels on the right are colored identically to their branch/marker for redundant encoding.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same title/subtitle/axis-title/legend layout, now rendered in light/white ink; gridlines are subtle light lines on the dark surface; unclassified backbone branches flip from dark ink to light gray/off-white (theme-adaptive `inkSoft` token) so they remain visible against the dark background instead of disappearing. No dark-on-dark text was found — all titles, tick labels, and legend text are clearly legible.
      Data: Identical topology and branch-length proportions to the light render. All four clade colors (green, lavender, blue, ochre) are pixel-identical to the light render — confirmed only chrome (background, backbone lines, text, grid) changed between themes, not the categorical data colors.
      Legibility verdict: PASS.
