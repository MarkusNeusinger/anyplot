review:
  strengths:
  - Accurate real primate phylogeny topology matching known molecular taxonomy (Strepsirrhini/Haplorhini
    split, Platyrrhini/Catarrhini, Hominidae great-ape clade)
  - Elegant elbow-line dendrogram built from core Chart.js scatter+showLine only —
    no plugin workaround, respects the 'no workarounds' rule
  - Theme-adaptive backbone and tick-label colors correctly flip between light/dark
    while the Imprint clade data colors stay identical
  - Per-leaf label coloring via the ticks.color callback visually links each species
    name to its branch/clade
  - Clean layout, generous whitespace, no text/element overlap in either render
  weaknesses:
  - X-axis shows odd decimal edge ticks (-0.3 and 6.8) from the padded min/max instead
    of clean rounded values — use afterBuildTicks (like the y-axis already does) to
    force a clean integer tick set from 0 to the rounded max.
  - No formal legend/key mapping clade colors to clade names — the subtitle text lists
    the four clade names but a reader must infer the color-to-name mapping themselves;
    consider a small custom legend or color swatches next to the subtitle text.
  - Unlabeled backbone segments (Tarsier, Gibbon branches, internal connectors) fall
    back to plain inkSoft with no visual distinction from 'genuinely unclassified'
    vs. 'just outside the four highlighted clades' — minor, but a lighter/dashed treatment
    could make the emphasis clearer.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white.
      Chrome: Title "tree-phylogenetic · javascript · chartjs · anyplot.ai" and italic subtitle explaining the clade-color encoding are dark ink, clearly legible. X-axis title "Relative evolutionary distance" and tick labels are dark/gray and readable. Subtle vertical gridlines. Y-axis has no separate title; instead each of the 12 species names sits at its leaf on the right, colored to match its branch/clade.
      Data: Rectangular (cladogram-style) dendrogram with elbow-jointed branches. Strepsirrhini (Lemur, Loris) in brand green #009E73, Platyrrhini (Marmoset, Squirrel Monkey) in lavender, Cercopithecidae (Macaque, Baboon) in blue, Hominidae (Orangutan, Gorilla, Chimpanzee, Human) in ochre; unclassified backbone segments (Tarsier, Gibbon, internal connectors) in dark ink-soft gray. First series color is confirmed #009E73 (Imprint palette position 1).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black.
      Chrome: Title and subtitle render in light off-white text, clearly legible against the dark background. Axis title and tick labels are light gray, fully readable — no dark-on-dark issues found. Backbone branches that were dark ink-soft in the light render correctly flip to a light gray in the dark render (theme-adaptive chrome, not a data color).
      Data: Clade branch colors (green, lavender, blue, ochre) are visually identical to the light render — confirmed same hues, only chrome (background, backbone, text) flipped, as required.
      Legibility verdict: PASS
