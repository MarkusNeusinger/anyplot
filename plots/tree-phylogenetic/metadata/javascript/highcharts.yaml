review:
  strengths:
  - Correct rectangular cladogram/phylogram built from core Highcharts line + scatter
    series, with branch lengths proportional to evolutionary distance as required
    by the spec
  - 'Clade highlighting (Hominidae in Imprint green #009E73, remaining primates in
    muted grey) directly satisfies the spec''s ''color-code clades or highlight specific
    lineages for emphasis'''
  - Realistic ultrametric primate phylogeny topology (Human/Chimp/Bonobo/Gorilla/Orangutan/Gibbon/Macaque/Marmoset)
    with plausible branch-length values (~0.02-0.1 substitutions per site)
  - 'Clean theme-adaptive chrome: transparent background, correct light/dark tokens,
    data colors identical across themes, minimal chrome (no y-axis line/ticks, gridlines
    off)'
  - Species dataLabels tuned with crop:false/overflow:allow/spacingRight so labels
    stay fully legible without clipping at the right edge
  - 'Tooltip usefully surfaces ''Distance from root'' per species; marker ring (lineColor:
    pageBg) adds subtle edge definition'
  weaknesses:
  - Only a single binary color distinction (hominid vs. other); no further visual
    hierarchy (e.g. emphasizing the tighter Human/Chimp/Bonobo split) to deepen data
    storytelling — DE-03
  - Relies solely on the subtitle text to explain the green/grey color coding; an
    in-plot annotation near the Hominidae branch would make the clade highlight scannable
    without reading the subtitle — LM-02
  - Uses two custom recursive helper functions (assignY, collect) to build the tree
    layout — a reasonable trade-off for hierarchical data, but strict KISS scoring
    favors flatter code — CQ-01
  - Leans on generic line/scatter series rather than any distinctive Highcharts feature,
    since the core bundle has no dedicated tree/dendrogram module — a necessary workaround
    given the constraint, but leaves limited room to showcase library-specific mastery
    — LM-01
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "tree-phylogenetic · javascript · highcharts · anyplot.ai" in bold dark text, subtitle explaining the color code in a softer dark grey, x-axis title "Evolutionary distance (substitutions per site)" with tick labels 0-0.16 in soft grey, species names (Marmoset, Rhesus Macaque, Gibbon, Orangutan, Gorilla, Bonobo, Chimpanzee, Human) in dark text to the right of each leaf marker. All fully legible against the light background.
      Data: Rectangular (elbow-style) tree branches. The Hominidae clade (Orangutan, Gorilla, Bonobo, Chimpanzee, Human) is drawn in Imprint brand green (#009E73); the remaining primates (Marmoset, Rhesus Macaque, Gibbon) are drawn in muted grey. Leaf markers are small filled circles matching branch color with a thin light-background ring. Branch lengths visibly proportional to the x-axis (evolutionary distance) scale.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title and subtitle rendered in white/light-grey, axis title and tick labels in light grey, species names in white — all clearly visible against the dark background. No dark-on-dark text found anywhere.
      Data: Same tree topology and branch-length proportions as the light render. Hominidae clade retains the identical Imprint green (#009E73); other primates retain the identical muted grey hue (adjusted lightness for the dark chrome per the theme-adaptive muted token, as expected — only chrome flips, data hue is unchanged).
      Legibility verdict: PASS
