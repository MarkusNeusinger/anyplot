review:
  strengths:
  - 'Correct phylogram algorithm: cumulative branch-length x-positioning combined
    with evenly-spaced leaves and post-order mean y-positioning for internal nodes
    produces an accurate ultrametric tree layout'
  - 'Elegant, data-driven clade coloring: only fully-monophyletic subtrees inherit
    a clade color (via a Set-based check in root.eachAfter), keeping the deep backbone
    branches neutral and drawing the eye to the four labeled clades'
  - Correct Imprint palette in canonical order (green / lavender / blue / ochre),
    identical across light and dark renders
  - 'Clean, minimal chrome: only the bottom axis retained, hollow vs. filled node
    markers distinguish internal vs. leaf nodes, italicized species names follow taxonomic
    convention'
  - Descriptive axis label with units that doubles as the phylogenetic scale bar
  - Fully reproducible, hardcoded, deterministic data; idiomatic use of d3-hierarchy
    traversal methods (hierarchy, leaves, eachAfter, links, descendants)
  weaknesses:
  - Y-positioning is a hand-rolled reimplementation of d3.cluster()'s algorithm (evenly-spaced
    leaves + eachAfter mean), and branch paths are built as a manual path string instead
    of d3.linkHorizontal()/d3.linkStep() — the more idiomatic d3-hierarchy/d3-shape
    combination for dendrograms
  - The clade legend is horizontally offset from the tree's visual center rather than
    centered under the full plot width, leaving slightly asymmetric whitespace on
    the sides
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "tree-phylogenetic · javascript · d3 · anyplot.ai" centered at top; bottom axis with dark tick labels (0-60) and a descriptive axis title "Divergence time since common ancestor (million years, mtDNA estimate)"; four-item clade legend below the axis title. All chrome text is dark ink on the light surface.
      Data: Nine primate species as italicized leaf labels on the right, connected by elbow-link branches. The deep backbone (common ancestor -> Anthropoidea -> Catarrhini splits) is neutral dark gray; four clades are colored: Strepsirrhini (Ring-tailed Lemur) in brand green #009E73, New World monkeys (Common Marmoset) in lavender, Old World monkeys (Olive Baboon, Rhesus Macaque) in blue, and Apes (Gibbon, Orangutan, Gorilla, Human, Chimpanzee) in ochre. Internal nodes are small circles (hollow for mixed-clade nodes, filled for clade-consistent nodes); leaf nodes are larger filled circles.
      Legibility verdict: PASS — all text (title, tick labels, axis title, leaf labels, legend) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis, and legend layout, now rendered in light ink (near-white) for primary text and light gray for secondary/tick text. No dark-on-dark text observed anywhere.
      Data: Identical branch/node/legend colors to the light render — brand green, lavender, blue, and ochre clades are pixel-identical; only the chrome (background, text, grid/domain line) flipped to the dark theme.
      Legibility verdict: PASS — title, tick labels, axis title, leaf labels, and legend text are all clearly legible in light ink against the near-black background; no dark-on-dark failures.
