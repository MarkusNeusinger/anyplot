review:
  strengths:
  - 'Technically correct phylogram: the x-axis encodes cumulative branch length (evolutionary
    distance) via `x = parentX + node.length`, so branch lengths are truly proportional
    rather than a generic dendrogram with equal-spaced levels.'
  - 'Correct Imprint palette usage: first clade (Prosimians) is brand green #009E73
    and the remaining three clades follow canonical positions 2-4 (lavender, blue,
    ochre); data colors are identical between light and dark renders.'
  - Biologically realistic and neutral primate phylogeny data with sensible branch-length
    magnitudes (e.g. very short Human-Chimp split at 0.018-0.02, deep Prosimian divergence
    at 0.32) and a correct taxonomic structure (Prosimians / Anthropoidea -> New World
    Monkeys / Catarrhini -> Old World Monkeys / Apes).
  - 'Sound library choice: uses ECharts'' `graph` series on a `cartesian2d` coordinate
    system with invisible corner nodes to produce the classic right-angle cladogram
    routing, since the native `tree` series only supports depth-based (not quantitative
    branch-length) layouts.'
  - 'Clean theme-adaptive chrome: title, axis label, tick labels, and legend all read
    clearly on both the warm off-white and warm near-black backgrounds with no dark-on-dark
    or light-on-light failures.'
  weaknesses:
  - 'Tooltip is fully disabled (`tooltip: { show: false }`); as an interactive JS
    library, a hover tooltip surfacing species name / branch length / clade would
    add real value in the HTML detail view with zero cost to the static PNG — an easy
    library-mastery win that was left on the table.'
  - 'No interactive-only flourish showcasing ECharts'' interaction model (e.g. legend-hover
    emphasis to trace a single lineage, `emphasis.focus: ''series''`) — the implementation
    is functionally correct but reads as a fairly plain static rendering.'
  - The spec's suggestion to 'add a scale bar to indicate branch length units' is
    only satisfied indirectly via the labeled continuous x-axis; a small in-plot scale
    annotation would have been a nice-to-have refinement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the anyplot light-theme surface.
      Chrome: Title "tree-phylogenetic · javascript · echarts · anyplot.ai" in bold dark ink, centered at top. A 4-item legend (Prosimians, New World Monkeys, Old World Monkeys, Apes (Hominoidea)) sits below the title with color swatches matching the branch/node colors. X-axis is labeled "Evolutionary distance (substitutions per site)" with dark-ink tick labels (0 to 0.7) and subtle vertical gridlines. Y-axis is hidden (species order is conveyed via leaf position and labels instead). All chrome text is clearly legible against the light background.
      Data: A rectangular cladogram (phylogram) with right-angle branch routing. Branch lengths are drawn proportional to evolutionary distance along the x-axis. The first/brand series color (#009E73, green) is used for the Prosimians clade (Lemur, Galago); New World Monkeys (Marmoset, Squirrel Monkey) use lavender/purple; Old World Monkeys (Baboon, Macaque) use blue; Apes (Gibbon, Orangutan, Gorilla, Chimpanzee, Human) use ochre. The two deepest splits (root and Anthropoidea) that don't belong to a single named clade are drawn in a muted grey. Eleven species leaf labels are placed to the right of their leaf nodes in dark ink, with no overlap between labels or with branch lines.
      Legibility verdict: PASS — all text (title, legend, axis label, tick labels, species labels) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the anyplot dark-theme surface.
      Chrome: Same layout as the light render — title, legend, and axis label/ticks are now rendered in light ink (white/light-grey) against the dark background. Gridlines remain subtle vertical lines, slightly lighter than the background.
      Data: Identical tree topology and identical branch/node colors to the light render (green, lavender, blue, ochre for the four clades; grey/muted for the unclustered root branches) — confirming only chrome flips between themes, not data colors. Species leaf labels are rendered in light ink and remain fully legible with no overlap.
      Legibility verdict: PASS — no dark-on-dark failures; all title, legend, axis, and species-label text is clearly visible against the near-black background.
