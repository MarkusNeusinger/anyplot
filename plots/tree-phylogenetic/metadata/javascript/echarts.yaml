review:
  strengths:
  - 'Technically correct phylogram: x-axis encodes cumulative branch length (x = parentX
    + node.length), so branches are truly proportional to evolutionary distance rather
    than an equal-spaced dendrogram.'
  - 'Both attempt-1 weaknesses are now fixed: the tooltip is enabled with a rich formatter
    (species, clade, branch length, cumulative distance), and a static callout annotates
    the shortest split (Human-Chimpanzee, 0.018) as a clear focal point.'
  - 'emphasis.focus: ''adjacency'' plus matching blur states give the graph series
    a genuine ECharts interaction showcase (trace a lineage on hover) at zero cost
    to the static PNG.'
  - 'Correct Imprint palette usage: first clade (Prosimians) is brand green #009E73,
    remaining three clades follow canonical positions 2-4; data colors are pixel-identical
    between light and dark renders.'
  - Biologically realistic, neutral primate phylogeny with a correct taxonomic structure
    (Prosimians/Anthropoidea -> New World Monkeys/Catarrhini -> Old World Monkeys/Apes)
    and sensible branch-length magnitudes.
  - 'Sound library choice: uses the graph series with invisible corner nodes to get
    right-angle cladogram routing that ECharts'' native tree series (depth-based only)
    cannot provide.'
  - Clean theme-adaptive chrome with no legibility failures in either theme; muted
    grey correctly distinguishes unclustered basal splits from the four highlighted
    clades.
  weaknesses:
  - 'The focal-point annotation text (''Shortest split: Human-Chimpanzee (0.018)'')
    is set at fontSize 12 in italic, noticeably smaller than the 14-15px used elsewhere
    in the chart chrome — fine at full size but the first element to lose legibility
    if scaled down for a mobile-width thumbnail.'
  - The spec's 'add a scale bar' note is still satisfied only indirectly via the labeled
    continuous x-axis rather than a dedicated in-plot scale-bar glyph; acceptable
    but a minor nice-to-have.
  - No circular/radial layout variant is offered (spec lists it as one option among
    rectangular); the rectangular phylogram chosen is fully valid and matches most
    published trees, so this is not a deduction, just unexplored breadth.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "tree-phylogenetic · javascript · echarts · anyplot.ai" centered at top; 4-item legend below (Prosimians, New World Monkeys, Old World Monkeys, Apes (Hominoidea)) with matching swatch colors; x-axis labeled "Evolutionary distance (substitutions per site)" with clear tick labels (0-0.7) and subtle vertical gridlines. All chrome text is dark ink on the light surface and fully readable.
      Data: Rectangular cladogram with right-angle branch routing. First clade (Prosimians) uses brand green #009E73; the other three clades use violet, blue, and amber. Deep/unclustered splits (root and the Anthropoidea internal branch) render in muted grey, visually distinct from the four highlighted clades. 11 species leaf labels sit to the right of their nodes in dark ink with no overlap. A small italic grey annotation calls out the shortest split (Human-Chimpanzee, 0.018) near the bottom-right without colliding with any branch or label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis text flip to light ink (white/near-white) and remain fully legible against the dark surface — no dark-on-dark failures anywhere (title, legend, axis label, tick labels, leaf labels, and the italic callout are all clearly visible).
      Data: Branch and node colors (green #009E73, violet, blue, amber, muted grey) are pixel-identical to the light render — only the background/chrome flipped, confirming correct theme-adaptive implementation. Layout and topology are identical to the light render.
      Legibility verdict: PASS
