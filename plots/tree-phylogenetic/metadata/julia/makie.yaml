review:
  strengths:
  - 'Clean, correct rectangular phylogram: x-axis is cumulative branch length from
    the root, y is leaf rank with internal nodes at the mean of their children — the
    standard cladogram/phylogram convention, giving genuinely proportional branch
    lengths as the spec requires'
  - Pure-clade color propagation (a node is highlighted only if every descendant leaf
    is a great ape) cleanly stops the Hominidae highlight exactly at its stem branch,
    with a matching callout label near the stem
  - Scale bar with tick caps and '0.02 substitutions / site' label follows the standard
    phylogenetic-tree convention called out in the spec notes
  - 'Fully theme-correct: identical brand-green data color in both renders, INK/INK_SOFT
    chrome correctly flipped, warm off-white/near-black backgrounds match the spec
    exactly'
  - Minimal, refined chrome — spines and axis decorations fully hidden, no grid, generous
    whitespace, clear focal point on the highlighted clade
  - No fake interactivity, no workaround backend — tree geometry built entirely with
    native CairoMakie primitives (lines!, scatter!, text!) since Makie has no built-in
    tree/dendrogram recipe
  weaknesses:
  - Tree structure is hard-coded via id-keyed adjacency dicts rather than built from
    an actual Newick string, which is the data format the spec names explicitly —
    the code comment explains no Newick parser is available in the Julia CI runtime,
    but the visualization never demonstrates parsing/consuming the spec's stated 'newick_string'
    data field
  - Non-highlighted species labels and branches use only INK_SOFT (soft gray) rather
    than full INK — a deliberate de-emphasis choice for the backbone lineages, but
    it flattens contrast for 4 of the 8 leaf labels compared to the highlighted clade
  - Only the rectangular layout is used; the spec suggests considering a circular/radial
    layout too (not mandatory, but would have shown more library range for a tree
    with only 8 leaves)
  - Relies entirely on basic Makie primitives (lines!, scatter!, text!) with no distinctive
    Makie-specific feature (e.g. GridLayout panels, Colorbar, recipes) — understandable
    since Makie has no tree recipe, but it caps Library Mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "tree-phylogenetic · julia · makie · anyplot.ai" in bold dark ink, centered top, clearly legible. No axis labels/ticks (hidden by design, appropriate for a tree diagram). Scale bar with "0.02 substitutions / site" caption at bottom-left, legible dark-gray text.
      Data: Rectangular phylogram with 8 species leaves (Human, Chimpanzee, Gorilla, Orangutan, Gibbon, Rhesus Macaque, Common Marmoset, Mouse Lemur). Hominidae clade (Human/Chimp/Gorilla/Orangutan) rendered in brand green (#009E73) with a "Hominidae (great apes)" callout label in the same green; remaining backbone lineages and labels rendered in soft dark gray (INK_SOFT). Leaf tips are small circular markers with a light stroke. All species names right of their tips, fully readable.
      Legibility verdict: PASS — all text (title, species labels, clade callout, scale caption) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title now rendered in light off-white ink, clearly legible against the dark background. Scale bar and its caption rendered in light gray, clearly legible.
      Data: Identical brand-green (#009E73) highlight for the Hominidae clade and identical tree geometry/branch lengths as the light render — only the chrome (background, ink colors for text/branches/markers) flipped to light tones on dark. Non-highlighted species labels and branches use a light gray (INK_SOFT for dark theme), clearly distinguishable from the near-black background.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, labels, callout, scale caption) reads clearly against the near-black surface, and the brand green remains equally vivid on both surfaces.
