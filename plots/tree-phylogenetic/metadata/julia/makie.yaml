review:
  strengths:
  - Clean, publication-quality cladogram with branch lengths proportional to evolutionary
    distance and a clear Hominidae (great-ape) clade highlighted in Imprint brand
    green, giving the chart a strong focal point.
  - 'Theme-adaptive chrome is implemented correctly: the highlighted clade stays identical
    #009E73 across both renders, while background, ink, and scale-bar colors flip
    cleanly between light and dark.'
  - Scale bar with explicit units ("0.02 substitutions / site") is used in place of
    a numeric x-axis, matching the standard phylogenetic-tree convention called out
    in the spec's Notes.
  - All labels (species names, clade callout, scale-bar caption) use explicitly set
    font sizes and remain legible in both themes with no overlap or clipping.
  - Realistic primate mitochondrial-DNA divergence data with a correctly grouped great-ape
    clade and plausible branch-length magnitudes.
  weaknesses:
  - 'Layout is left-weighted: the tree + labels end at roughly 63% of canvas width,
    leaving a large, unbalanced right margin — extend the x-limits/label offset or
    center the tree horizontally so whitespace is distributed more evenly.'
  - 'LM-02: uses only generic lines!/scatter!/text! primitives — nothing distinctive
    to Makie is showcased; consider a Makie-specific feature (e.g. a custom Legend
    for the clade color, or a Makie recipe) to raise Library Mastery.'
  - 'DQ-01: the tree is hard-coded as an id/adjacency Dict rather than an actual Newick
    string as listed in the spec''s Data section — a reasonable workaround given no
    Newick parser is available in the Julia CI runtime (documented in the code comments),
    but it narrows literal feature coverage of the spec''s data format.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "tree-phylogenetic · julia · makie · anyplot.ai" in bold dark ink, centered at top. Species labels (Human, Chimpanzee, Gorilla, Orangutan, Gibbon, Rhesus Macaque, Common Marmoset, Mouse Lemur) in dark/soft-dark ink to the right of each leaf tip. Scale bar ("0.02 substitutions / site") in soft-dark ink at bottom left. All text is clearly readable against the light background.
      Data: Cladogram branches drawn as right-angle (rectangular) connectors, x-position proportional to cumulative branch length, y-position by leaf order. The Human/Chimpanzee/Gorilla/Orangutan clade (Hominidae) and its stem branches are rendered in Imprint brand green (#009E73) with a green "Hominidae (great apes)" callout label; all other branches and leaf tips (Gibbon, Rhesus Macaque, Common Marmoset, Mouse Lemur) are rendered in a muted dark-gray ink tone. Leaf tips are filled circles with a light stroke for definition.
      Legibility verdict: PASS — no overlapping or clipped text, all labels and the scale-bar caption are crisp.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, species labels, and scale-bar caption, now rendered in light ink (title/labels bright off-white, scale bar/secondary text in a lighter soft-gray) so everything reads clearly against the dark surface. No dark-on-dark text was found.
      Data: Data colors are identical to the light render — the same #009E73 green marks the Hominidae clade and stem branches; non-highlighted branches/leaf tips use a light muted-gray tone (the theme-adaptive INK_SOFT token) instead of the light render's dark-gray, which is the expected chrome flip, not a data-color change.
      Legibility verdict: PASS — title, species labels, clade callout, and scale-bar text are all clearly visible against the dark background; no dark-on-dark or contrast failures observed.
