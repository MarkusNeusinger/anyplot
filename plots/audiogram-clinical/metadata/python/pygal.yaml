review:
  strengths:
  - 'Faithful clinical audiogram: inverted dB HL axis from -10 to 120 with 10 dB grid
    lines, log2-transformed frequency so the octave ticks 125 to 8k are evenly spaced,
    and a square 2400x2400 canvas with a near-square plot area'
  - 'Audiology convention kept via the semantic exception: right ear as hollow #AE3030
    circles on a solid line, left ear as #4467A3 crosses on a dashed line; the circles
    are filled with PAGE_BG so they read as an O in both themes'
  - Severity bands are ordered imprint_seq tints blended into the page color, deepening
    with severity, with a separate tint depth per theme; each band is labeled with
    its dB range in its top-left corner, clear of the data
  - Grid drawn as a series above the band fills, so it stays visible through the shading
    in both themes
  - 'Uses pygal features well: XY chart with inverse_y_axis, print_labels for in-plot
    band names and key text, allow_interruptions for the X glyph strokes, inline CSS
    to strip band outlines and style the hollow circles, and an interactive HTML export
    with tooltips'
  - Realistic noise-induced sensorineural loss with a bilateral 4 kHz notch and partial
    recovery at 8 kHz
  weaknesses:
  - 'VQ-03 (dark): the Normal, Mild and Moderate band fills differ only by a faint
    luminance step on the #1A1A17 page, so the three top bands are hard to tell apart,
    especially in the 400 px thumbnail → a larger tint step between adjacent bands
    in the dark theme. Likely cause: depth = (0.14, 0.44) starts too close to the
    page color for the first steps.'
  - 'CQ-01 (code): the Data block ends in loose lists (frequencies, threshold_right,
    threshold_left) instead of one tidy df keyed by column constants with role comments,
    as the six-zone convention of prompts/adaptable-code.md requires → FREQUENCY /
    THRESHOLD_RIGHT / THRESHOLD_LEFT constants, a df built in the Data block, and
    .tolist() below the # Plot marker. Likely cause: data written as plain lists for
    pygal''s list input.'
  - 'Suggestion: the hex-to-RGB conversion via np.frombuffer(bytes.fromhex(...)) is
    harder to read than the lerp pattern shown in the pygal library prompt.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the plot; plot area shaded by six horizontal severity bands, pale green at the top deepening to muted blue at the bottom.
      Chrome: bold title "audiogram-clinical · python · pygal · anyplot.ai" in dark ink; y-axis title "Hearing Level (dB HL)" and x-axis title "Frequency (Hz)" in dark ink; y ticks -10 to 120 in steps of 10 (0 near the top, inverted); x ticks 125, 250, 500, 1k, 2k, 4k, 8k evenly spaced; subtle grey grid at every octave and every 10 dB, visible through the fills. Band labels (Normal (−10–25 dB) to Profound (>90 dB)) in soft ink in each band's top-left corner. The key in the lower right reads "Right ear (O)" and "Left ear (X)".
      Data: right ear as hollow red (#AE3030) circles on a solid red line (10, 15, 20, 20, 25, 65, 55 dB); left ear as blue (#4467A3) crosses on a dashed blue line (15, 20, 25, 25, 35, 55, 50 dB); both dip at 4k. The lines cross between 2k and 4k. No first-series green, which is correct under the semantic exception for the audiology red/blue convention.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; bands as dark green tints at the top, moving to slate blue in the profound band.
      Chrome: title, axis titles and ticks in light ink, all readable; band labels in light soft ink, readable; grid lines in a light translucent tone, visible. No dark-on-dark text.
      Data: same red and blue colors and positions as the light render; the circle interiors switch to the dark page color, so they still read as hollow O symbols. The Normal, Mild and Moderate band fills are only faintly distinguishable from each other.
      Legibility verdict: PASS
