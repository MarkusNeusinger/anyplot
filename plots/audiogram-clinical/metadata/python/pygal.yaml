review:
  strengths:
  - 'Faithful clinical audiogram: inverted dB HL axis from -10 to 120 with 10 dB grid,
    log2 frequency axis with evenly spaced octave ticks labelled 125 … 8k in kHz shorthand,
    square plot area at 2400×2400'
  - 'Ear convention preserved: right ear as red (#AE3030) hollow circles with a solid
    line, left ear as blue (#4467A3) X glyphs with a dashed line, a justified semantic
    exception to the Imprint order; no line joins the two ears'
  - Severity bands are discrete imprint_seq steps (green normal → blue profound) blended
    into the page colour, with a theme-specific depth so adjacent bands stay distinguishable
    on both the light and the dark page
  - Grid drawn above the band fills so it stays visible, band names in each band's
    top-left corner clear of the data, and the symbol key placed in the empty profound
    region
  - 'pygal-specific techniques: XY chart with inverse_y_axis, dict x_labels, print_labels
    with value dicts for in-plot text, allow_interruptions with None breaks for multi-segment
    glyph series, and inline CSS injection for per-series stroke and fill control;
    HTML output keeps native tooltips'
  - Realistic noise-induced hearing loss with a bilateral 4 kHz notch and recovery
    at 8 kHz, tidy df with column constants, deterministic data
  weaknesses:
  - 'VQ-03 (dark): the left-ear dashed line and X glyphs in #4467A3 at about 5 px
    stroke sit on the mid-teal Mild and Moderate band fills with low contrast, so
    the left ear reads noticeably weaker than the right ear in the dark render → keep
    the colour but raise the left-ear line and cross stroke width to about 7 px (+2
    px) so it holds against the band tints. Likely cause: stroke_width=5 shared by
    all series, with no override for the left-ear series (.serie-10, .serie-11).'
  - 'Suggestion: the band names in INK_SOFT could be slightly larger or bolder so
    they read as a secondary layer in the 400 px thumbnail.'
  - 'Suggestion: the in-plot key could carry a thin frame or a short title to separate
    it more clearly from the band names.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around a square plot box.
      Chrome: bold title "audiogram-clinical · python · pygal · anyplot.ai" at about 80% width, dark ink; y-axis title "Hearing Level (dB HL)" rotated, ticks -10 … 120 every 10 with 0 near the top (inverted); x-axis title "Frequency (Hz)", octave ticks 125, 250, 500, 1k, 2k, 4k, 8k evenly spaced. Grey grid lines every octave and 10 dB visible above the band fills. All text readable.
      Data: six horizontal severity bands from pale green (Normal) through teal to pale blue (Profound), each labelled in its top-left corner in soft ink. Right ear: red #AE3030 hollow circles with a solid red line (10,15,20,20,25,65,55 dB). Left ear: blue #4467A3 X glyphs with a dashed blue line (15,20,25,25,35,55,50 dB). Lines cross near 3 kHz. In-plot key bottom right: "Right ear (O)" with a red circle, "Left ear (X)" with a blue cross.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page.
      Chrome: title, axis titles and tick labels in light ink, clearly readable; grid lines light and subtle; no dark-on-dark text.
      Data: identical red and blue ear colours, circles now filled with the dark page colour; band fills are deeper dark green → teal → slate blue steps, distinguishable from each other; band labels in light soft ink readable. The blue dashed left-ear line and crosses have lower contrast against the mid-teal bands than in light but remain visible.
      Legibility verdict: PASS
