review:
  strengths:
  - 'Standardized audiogram form preserved: y axis reversed via `reverse: true` with
    0 dB HL near the top and -10 to 120 dB HL gridded every 10 dB, x axis `scaleType:
    "log"` with the seven octaves as evenly spaced ticks in kHz shorthand (125 … 1k,
    2k, 4k, 8k)'
  - Right ear drawn as red open circles on a solid line and left ear as blue crosses
    on a dashed line, each joined only within its own ear in ascending frequency order;
    the O and X overlap at 250 Hz, which the spec permits
  - All six ASHA severity bands shaded across the full drawing width with an opacity
    that deepens with severity, separated by thin ink rules and named in the right
    margin with their dB ranges (bold name over a softer range line), readable in
    both themes
  - 'Idiomatic MUI X v9 composition: `ChartsContainer` with `LinePlot`, `ChartsGrid`,
    `ChartsXAxis`/`ChartsYAxis` plus custom SVG layers (`SeverityBands`, `BandEdges`,
    `EarSymbols`) positioned through `useXScale`, `useYScale` and `useDrawingArea`,
    so every symbol sits exactly at its frequency and dB value'
  - All chrome threaded through `window.ANYPLOT_TOKENS` (ink, inkSoft, grid, pageBg),
    so both renders are theme-correct while the data colors stay identical; `skipAnimation`
    set on the container and the line plot
  - Subtitle derives the four-frequency pure-tone average (500–4k Hz) from the data,
    a clinically standard summary (right 41, left 36 dB HL) that tells the reader
    the grade at a glance
  weaknesses:
  - 'Suggestion: the composed chart has no `ChartsTooltip`/`ChartsAxisHighlight`,
    so the HTML view offers no hover readout of the exact thresholds; adding them
    would make the interactive version more useful.'
  - 'Suggestion: the legend is hand-built HTML because `ChartsLegend` cannot show
    the custom O/X glyphs; a `ChartsLegend` with custom `slots.legendMark`-style marks
    would keep it native if the API allows.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the drawing area carries six horizontal severity bands in increasing grey opacity (Normal lightest at the top, Profound darkest at the bottom), separated by thin grey rules at 25/40/55/70/90 dB.
      Chrome: bold dark title "audiogram-clinical · javascript · muix · anyplot.ai" top left (~46 % of width), softer subtitle with the 7 test frequencies and pure-tone averages (right 41, left 36 dB HL). Y axis "Hearing level (dB HL)" with ticks -10 to 120 every 10, reversed (−10 at the top). X axis "Frequency (Hz)" with log ticks 125, 250, 500, 1k, 2k, 4k, 8k evenly spaced. Band names (bold) and ranges (≤ 25, 26–40, 41–55, 56–70, 71–90, > 90) in the right margin. Centered legend below: red line+O "Right ear (O)", blue dashed line+X "Left ear (X)". All text dark and readable.
      Data: right ear red (#AE3030) open circles on a solid line, 15→15→20→25→45→75→80 dB; left ear blue (#4467A3) crosses on a dashed line, 10→15→15→20→40→70→75 dB; sloping high-frequency loss reaching the severe band at 4–8 kHz; O and X overlap at 250 Hz. The red/blue pair follows the audiogram convention the spec requires (semantic exception), so no brand green is expected.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; bands rendered in the same inkSoft token, here lightening with severity (Profound the lightest grey), separated by light rules.
      Chrome: title, subtitle, axis titles, tick labels, band names/ranges and legend text all in light ink, clearly readable; no dark-on-dark text anywhere. Grid subtle but visible.
      Data: identical red circles and blue crosses at identical positions as the light render; only chrome flips. Blue dashed line remains visible against the darkest upper bands, red markers clearly visible throughout.
      Legibility verdict: PASS
