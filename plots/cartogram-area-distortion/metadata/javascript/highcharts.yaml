review:
  strengths:
  - Circle radius scales with sqrt(population) and has no additive minimum, so area
    is truly proportional to value (CA at 39M against WY at 0.6M reads correctly).
  - Equal-area tile grid keeps every state near its true position and next to its
    neighbours. Dorling-style circles never overlap, which the spec's Notes accept.
  - Undistorted inset uses the same grid with square area proportional to land area,
    placed in the empty south-east corner. AK, TX and MT read large there and tiny
    or modest in the main grid, which makes the distortion obvious.
  - Labels switch between inside the circle (with an ink chosen for contrast against
    the fill) and below small circles, so every abbreviation stays legible in both
    themes.
  - GDP-per-capita tiers are ordered steps of imprint_seq built with Highcharts.color().tweenTo,
    and each tier has a native legend entry. The floating legend sits in empty grid
    space.
  - 'Highcharts-native techniques: SVGRenderer tiles redrawn in chart.events.render
    through axis.toPixels, per-point marker radius and dataLabels, and a tooltip built
    from point.custom for the HTML view.'
  - Theme tokens are used throughout, the colour scheme is pinned with palette.colorScheme,
    and animations are disabled.
  weaknesses:
  - 'VQ-05 (both): the land-area inset is pushed to 16 px from the right canvas edge
    while the main grid keeps about 346 px of left margin, so the composition is lopsided
    and the inset looks cramped → keep a right margin of at least 40 px for the inset,
    or shift the main grid left so both sides are balanced. Likely cause: INSET_RIGHT
    = window.ANYPLOT_SIZE.width - 16, with marginSide centring the main grid on its
    own.'
  - 'VQ-01 (both): the inset title and state abbreviations are set at 13px and the
    caption at 14px. These are the smallest text on the canvas and blur in the 400
    px thumbnail → about 14–15px for labels and the inset title (+1 to +2 px). Likely
    cause: dataLabels fontSize "13px" and the inset r.text fontSize "13px".'
  - 'SC-02 (both): the legend has no key for circle area, so the reader cannot turn
    a circle size into a population value. Only the caption text says that area ∝
    population → add a population reference (for example legend entries or reference
    circles for 1M / 10M / 30M at the same sqrt scale). Likely cause: the legend lists
    only the GDP tiers and the tile swatch.'
  - 'Suggestion: small state abbreviations in the inset (or a hover tooltip) would
    make it easier to match inset squares to states without counting grid positions.'
  - 'Suggestion: the data could follow the adaptable-code data block, with role constants
    and a `const data` array read through d[...], so the ''Use with my data'' agent
    can swap it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: the title "cartogram-area-distortion · javascript · highcharts · anyplot.ai" is dark, bold and centred. The subtitle and the bottom caption are in soft ink. The legend at the top left has three GDP tiers (green, teal, blue dots) and a grey "Equal-area tile" swatch. The inset title "Undistorted: square area ∝ land area" is in soft ink. All text is readable.
      Data: 51 light-grey equal-area tiles in a statebins layout with page-coloured hairline gaps. Each tile holds a circle sized by population: CA, TX, FL and NY are large, while VT, WY and DC are tiny dots. Circles are filled by tier: #009E73-like green (low), mid teal, blue (high). White or dark labels sit inside large circles, and ink labels sit below small ones. The bottom-right inset repeats the grid with dark squares sized by land area (AK and TX large, RI and DC near-invisible). The inset sits within about 16 px of the right edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: the title, subtitle, legend text, inset title and caption are all light ink, with no dark-on-dark text. Tiles are a dark grey (the grid token) with page-coloured gaps. Inset squares are light grey.
      Data: circle colours are identical to the light render (green, teal, blue tiers). Labels inside circles keep their fill-contrast ink, and labels below circles flip to light ink and stay readable.
      Legibility verdict: PASS
