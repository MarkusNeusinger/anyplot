review:
  strengths:
  - Clean, idiomatic Highcharts scatter + dataLabels implementation that correctly
    works around the core bundle's lack of a colorAxis/bubble module
  - Radius encoding correctly implements area ∝ value via sqrt scaling (MIN_RADIUS/MAX_RADIUS),
    the defining cartogram encoding
  - Reproducible, deterministic in-memory data with realistic, neutral US state population
    and GDP-per-capita values
  - Theme-adaptive chrome is correct throughout (t.ink/t.inkSoft/t.inkMuted), and
    the three GDP-tier colors derived from imprint_seq are pixel-identical between
    light and dark renders — only chrome flips
  - Clear legend and caption jointly explain both the size (population) and color
    (GDP-per-capita tier) encodings
  - Title format exactly matches the mandated `{spec-id} · {language} · {library}
    · anyplot.ai` convention
  weaknesses:
  - 'Non-contiguous circle layout with large gaps between every circle directly contradicts
    the spec''s explicit requirement: ''Regions should remain contiguous (sharing
    borders) after distortion to preserve geographic context.'' This renders a Dorling-style
    (non-contiguous) cartogram, not the contiguous cartogram the spec centrally describes.'
  - Missing 'original region outlines or a reference map inset for comparison' — the
    spec explicitly asks for this and it is entirely absent from both renders. Without
    any reference to true geography/area, the reader cannot see the actual distortion,
    which undercuts the core visual point of a cartogram.
  - Positions are placed on an approximate col/row tile grid rather than true polygon
    geometry. Given the Highcharts core bundle has no maps/colorAxis module this is
    an understandable simplification, but combined with the missing contiguity and
    missing reference map, the chart reads as a bubble chart on a loose grid rather
    than a cartogram.
  - Green (imprint_seq low end) is assigned to the lowest GDP-per-capita tier while
    blue is assigned to the highest — since green commonly reads as 'good/high' to
    viewers, this ordering is a mildly counter-intuitive semantic pairing worth reconsidering
    (not a hard violation, since imprint_seq's own low→high ramp direction is followed
    correctly).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "cartogram-area-distortion · javascript · highcharts · anyplot.ai" in bold dark ink at top, clearly readable. Subtitle "US states resized by population, positioned by approximate geography" in soft gray, readable. Bottom caption "Circle area ∝ population (millions) · fill ∝ GDP-per-capita tier · position preserves rough state geography" in muted gray, readable. Legend below the plot with three color swatches and labels ("GDP per capita < $60k", "$60–74k", "≥ $75k") in soft gray text, readable.
      Data: 24 US-state circles arranged on an approximate geographic tile grid (WA/OR/CA on the left, TX/MI/TN on the right), circle radius scaled by population (CA and TX are visibly the largest, ND/SD/MT the smallest), fill colored by one of three GDP-per-capita tiers using imprint_seq-derived hues (green = low tier, teal = mid tier, blue = high tier — the first/low tier is #009E73, matching brand green). State abbreviation labels are rendered in dark ink centered inside each circle and are legible against all three fill colors.
      Legibility verdict: PASS — all text (title, subtitle, caption, legend, in-circle labels) is clearly readable against the light background and against the circle fills.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink (white/near-white) and soft light gray respectively, both clearly readable against the dark background. Caption and legend text also render in light gray tones, readable, no dark-on-dark issues found anywhere.
      Data: Same 24 states, same relative circle sizes, and the exact same three fill hues as the light render (green/teal/blue tiers) — data colors are confirmed identical between the two themes, only the chrome (background + text) flipped. In-circle state-abbreviation labels flip to light ink and remain legible against every fill color.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text elements read clearly in the dark theme.
