review:
  strengths:
  - 'Circle radius scales with the square root of population and has no additive minimum,
    so area is exactly proportional to value: CA (39.0M) covers about 1.3x TX (30.5M)
    and 65x WY (0.6M), as the first characteristic bullet asks'
  - 'A non-contiguous Dorling-style form the Notes accept: one circle per state on
    a statebins-like tile grid, no circles overlapping, each state near its rough
    geographic position and next to its neighbours'
  - GDP-per-capita tiers are three ordered steps of imprint_seq (green low, teal middle,
    blue high) in natural order in the legend, identical in both renders
  - 'Per-point dataLabels choose placement and ink from the circle size and fill:
    inside large circles with a contrasting ink, below small circles in the theme
    ink, so every state abbreviation is readable in both themes'
  - The Highcharts SVG renderer draws the equal-area tiles in a chart.events.render
    callback from xAxis/yAxis.toPixels, so the tiles stay aligned with the scatter
    coordinates on any redraw
  - Hover tooltips in the HTML output give population and GDP per capita per state
    from point.custom
  weaknesses:
  - 'SC-02 (both): the render shows no undistorted geography; the grey equal-area
    tiles are an abstract grid where every state is the same size, not the original
    state outlines or a reference map inset that the Notes and the third characteristic
    bullet ask for → add a small inset of the real state outlines (or the true-area
    silhouettes) for comparison. Likely cause: the render callback only draws equal-size
    rect tiles, and the caption calls them the undistorted reference.'
  - 'Suggestion: the color tiers could use a native colorAxis with dataClasses, if
    the vendored core bundle exposes it, instead of three hand-split series.'
  - 'Suggestion: a small size key with two or three reference circles (for example
    1M, 10M, 30M) would let a reader read population off a circle instead of only
    from the caption.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: bold title "cartogram-area-distortion · javascript · highcharts · anyplot.ai" at top center (~40% width), grey subtitle below, caption line at the bottom explaining circle area, fill tiers and grey tiles; floating legend in the empty top-left grid area with three circle entries and one square tile entry. No axes (map-type chart). All text dark and readable.
      Data: 51 light-grey square tiles laid out as a US tile grid (AK top-left, HI bottom-left, ME top-right, FL bottom), each holding one circle sized by population — CA, TX, FL, NY largest; VT, WY, AK, DC tiny. Fills: green #009E73 (< $60k), teal mid step, blue #4467A3 (>= $75k). Abbreviations inside large circles (dark on green, white on teal/blue) or below small circles in dark ink. No overlaps, nothing clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, caption and legend text flip to light ink, all clearly readable; tiles flip to a dark grey with page-colored hairlines, still visible. No dark-on-dark text: below-circle labels are light, inside-green labels stay dark on the green fill and read well.
      Data: circle colors identical to the light render (green, teal, blue); same sizes and positions.
      Legibility verdict: PASS
