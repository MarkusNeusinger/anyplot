review:
  strengths:
  - Correct sqrt-based radius scaling so circle AREA (not radius) is proportional
    to population value — the defining cartogram rule — explicitly documented in a
    code comment
  - Z-order sorting (largest population first) keeps small circles visible on top
    of larger neighbors, avoiding occlusion
  - Clean, deterministic, well-commented code with sensible variable names and no
    fake interactivity
  - Custom SVG legends (two reference circles anchoring the size scale, plus region
    color swatches) clearly explain both encodings
  - Realistic 2023 US Census population estimates at correct relative magnitudes (CA
    38.9M, TX 30.5M, FL 22.6M, NY 19.6M, etc.)
  - Imprint palette data colors are pixel-identical between light and dark renders;
    theme-adaptive chrome (title/subtitle/legend text, warm-cream/warm-black backgrounds)
    is correct in both
  - 'Clever theme-adaptive label technique: state abbreviation fill uses t.pageBg,
    giving automatic contrast against saturated markers on both the light and dark
    page background without extra branching'
  weaknesses:
  - 'Not a contiguous polygon cartogram: MUI X community has no map/geometry primitive,
    so the implementation substitutes non-contiguous Dorling-style circles at state
    centroids. This is a reasonable, well-documented workaround for a library limitation
    — but it does not satisfy the spec''s explicit ''regions should remain contiguous
    (sharing borders) after distortion'' requirement.'
  - No reference map inset or original region outlines included for comparison, as
    recommended in the specification notes.
  - Smallest markers (MN, WI, IN, CO, AZ) sit near the minimum radius (13px CSS),
    forcing their abbreviation labels down to the 10px font floor — legible at full
    resolution but worth confirming at the 400px mobile srcset.
  - Per-point marker sizing is achieved by creating one single-point series per state
    (community ScatterChart has no native per-point size prop) — functionally correct
    but a somewhat unusual pattern versus MUI X's typical multi-point-series idiom.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "cartogram-area-distortion · javascript · muix · anyplot.ai" in bold dark ink, subtitle "Circle area ∝ 2023 population estimate · color = US Census region" in softer dark gray, both clearly legible. Size legend ("Population (millions)", "6M", "39M") and color legend (West/Midwest/South/Northeast swatches) render in dark ink at the bottom, fully legible and not clipped by the canvas edge.
      Data: 20 circles positioned at each state's approximate geographic centroid, area scaled by population (California largest at ~38.9M, Minnesota smallest at ~5.7M). First region (West) uses Imprint palette position 1 (#009E73 brand green); Midwest uses lavender, South uses blue, Northeast uses ochre - canonical Imprint order for these abstract census-region categories. Each circle carries a white/cream 2-letter state abbreviation for identification.
      Legibility verdict: PASS - all title, subtitle, legend, and state-abbreviation text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title and subtitle now rendered in light/cream ink, clearly legible against the dark background. Size and color legends also flip to light-ink text, fully readable and not clipped.
      Data: Circle positions, sizes, and colors are pixel-identical to the light render - confirms the Imprint categorical data colors (green/lavender/blue/ochre) are held constant across themes as required, with only chrome (background, text) flipping.
      Legibility verdict: PASS - no dark-on-dark failures; state abbreviation labels (which use the page-background color as fill) automatically flip from cream-on-color to near-black-on-color, remaining legible against every saturated marker color in both themes.
