      Background: warm off-white #FAF8F1
      Chrome: dark bold title, soft-ink subtitle, horizontal region legend, right-side size legend "Population (millions)" with 3/10/30 circles and the note "Shaded outline: true geography" — all readable
      Data: light-grey contiguous-US outline under 20 non-overlapping circles at the state centroids; West #009E73, South purple, Northeast blue, Midwest ochre; bold abbreviations, dark ink on green/purple/ochre and light ink on blue
