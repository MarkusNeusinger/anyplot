review:
  strengths:
  - Circle area is exactly proportional to population (radius ∝ √value via the zAxis
    sizeMap), and the radius scale is the largest that keeps every circle at its true
    centroid without overlap
  - The undistorted US outline sits under the circles, so the reader compares geography
    with population at a glance
  - The label ink is chosen per region fill by WCAG contrast (light on blue, dark
    elsewhere), so labels stay legible in both themes
  - 'Idiomatic MUI X composition: ChartsDataProvider + ChartsSurface with custom layers
    drawn through useXScale/useYScale, plus a native item tooltip in the HTML output'
  weaknesses:
  - 'DQ-01 (both): the data covers only the 20 most populous states, so the type''s
    core contrast (large, sparsely populated states such as MT, WY and NV shrinking
    to small marks over their wide outlines) is not shown → include all 48 contiguous
    states; the label threshold already leaves the smallest circles unlabeled. Likely
    cause: the data block is limited to the top 20 states.'
  - 'Suggestion: Dorling circles that grow and push apart could fill more of the outline
    and keep neighbors closer than circles shrunk to fit fixed centroids.'
  - 'Suggestion: the header''s library version (7.29.1) does not match the installed
    @mui/x-charts 9.17.0.'
  image_description: |-
