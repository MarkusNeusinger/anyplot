review:
  strengths:
  - 'Dorling layout is computed once and deterministically: circle radii are scaled
    so total circle area is a fixed share of the outline area, then a decaying centroid
    pull plus pairwise separation leaves no overlaps while keeping every state close
    to its geographic neighbors (CA on the Pacific, the Northeast cluster, FL at the
    Gulf)'
  - Composes the chart from MUI X v9 primitives (ChartsDataProvider + ChartsWrapper
    + ChartsSurface) and draws the reference outline and state abbreviations as custom
    SVG layers that read the chart's own scales via useXScale/useYScale, so labels
    and outline stay registered with the scatter marks
  - Circle size goes through a continuous zAxis sizeMap with the same sqrt mapping
    as the hand-built size legend (3 / 10 / 30 million), so the legend circles are
    true area references
  - Label ink is chosen per census region by WCAG contrast against the region fill
    (light text on Imprint blue, dark text elsewhere), and abbreviations step from
    14 to 16 px with circle radius; the smallest circles (VT, WY) stay unlabeled as
    the spec permits
  - 'Census regions use Imprint positions 1-4 in order of first appearance (West #009E73
    first); page-colored marker rings separate touching circles in both themes'
  - Real 2023 US Census population estimates for all 48 contiguous states; item tooltips
    show state name and value in the HTML output
  weaknesses:
  - 'Suggestion: the band between the region legend and the top of the outline is
    about 80 px of empty space; tightening it would let the map grow slightly.'
  - 'Suggestion: the two smallest circles (VT, WY) could carry a 10-11 px abbreviation
    so every state is named in the static PNG, not only in the HTML tooltip.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "cartogram-area-distortion · javascript · muix · anyplot.ai" centered at top, a soft-ink subtitle describing the Dorling method below it, a horizontal region legend (West, South, Northeast, Midwest) under the subtitle; right column holds a "Population (millions)" size legend with grey reference circles 3 / 10 / 30 and the note "Shaded outline: true geography". All text dark on light and readable.
      Data: a light-grey simplified contiguous-US outline with a thin grey edge; 48 non-overlapping circles sized by population near each state's centroid — West in brand green #009E73 (CA largest on the Pacific coast), South in lavender #C475FD (TX, FL dominant), Northeast in blue #4467A3 (NY, PA, NJ cluster), Midwest in ochre #BD8233. Bold abbreviations sit centered in all but the two smallest circles (VT, WY); dark text on green/lavender/ochre, light text on blue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text and size-legend labels in light ink; the size-legend circles flip to light grey; outline fill becomes a dark grey with a lighter edge. No dark-on-dark text anywhere.
      Data: circle fills identical to the light render (same four Imprint colors); marker rings flip to the dark page color; abbreviation inks unchanged and still high-contrast against their fills.
