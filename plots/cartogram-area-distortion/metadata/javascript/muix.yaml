review:
  strengths:
  - Circle area is truly proportional to population through a zAxis continuous sizeMap
    with a square-root radius, and every circle sits at its exact state centroid
  - The simplified contiguous-US outline drawn through useXScale/useYScale gives the
    undistorted geography for comparison in the chart's own coordinates
  - Census regions take Imprint positions 1-4 in canonical order, identical across
    themes, with label ink chosen per region color for contrast
  - A custom size legend (3 / 10 / 30 million) plus a note explaining the shaded outline
    makes both encodings self-explanatory
  - Native ChartsTooltip with a state-and-population valueFormatter adds inspection
    in the HTML view
  weaknesses:
  - 'SC-01 (both): the circles fill only a small share of the map and sit far apart
    (e.g. the Mountain West dots are 3-8 px on a 1500 px-wide map), so the render
    reads as a proportional-symbol map rather than a Dorling cartogram whose circles
    nearly touch their neighbors → grow the radius scale until neighboring circles
    nearly touch (largest circle about 2-3x the current 64 px cap) and resolve the
    resulting overlaps with a Dorling separation pass that keeps each circle near
    its centroid, as the Notes accept. Likely cause: maxRadius is the minimum over
    all centroid pairs, so the tight Northeast pairs (RI-MA, DE-MD) shrink every circle.'
  - 'VQ-05 (both): about 110 px of empty page between the region legend and the top
    of the map and about 90 px below it, while the map fills only part of the height
    → close the gap (about −80 px above). Likely cause: the equirectangular extent
    is fitted to the width, leaving vertical slack in CHART_H that the fixed legend
    band does not absorb.'
  - 'Suggestion: tinting the size-legend circles with a neutral outline like the data
    marks would tie the legend more visibly to the map.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title "cartogram-area-distortion · javascript · muix · anyplot.ai", grey subtitle explaining the Dorling form, a horizontal region legend (West, South, Northeast, Midwest), and a right-hand size legend "Population (millions)" with grey 3 / 10 / 30 circles and the note "Shaded outline: true geography". All text readable.
      Data: a light-grey simplified contiguous-US outline with 48 circles at the state centroids; West #009E73 green, South #C475FD lavender, Northeast #4467A3 blue, Midwest #BD8233 ochre. CA, TX, FL and NY are the largest; bold abbreviations on the larger circles (dark ink, light ink on blue). Circles are small relative to the map and widely spaced; empty bands above and below the map.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle, region legend and size legend in light grey; size-legend circles light grey. No dark-on-dark text.
      Data: outline is a dark grey fill with a soft stroke; circle colors identical to the light render, outlined in the page color; abbreviation ink identical to light (dark on green/lavender/ochre, light on blue), readable against each fill.
      Legibility verdict: PASS
