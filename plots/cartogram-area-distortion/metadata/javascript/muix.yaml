review:
  strengths:
  - 'Correct area-proportional math: circle radius is scaled by sqrt(population),
    so circle AREA (not radius) is proportional to the data value — the defining mathematical
    rule of an area cartogram.'
  - Clever cutout-text technique for labels (fill={t.pageBg}) keeps every state abbreviation
    legible against every palette color, in both light and dark theme, without extra
    per-color contrast logic.
  - 'Well-designed dual legend: a size-reference legend (min/max circles with ''6M''/''39M''
    labels) plus a color legend for the secondary region encoding, both clearly labeled
    (''Population (millions)'').'
  - 'Theme handling is clean and correct: identical data colors between light/dark
    renders, all chrome (title, subtitle, legend text) flips correctly, no clipping,
    no overlapping elements.'
  - 'Idiomatic advanced MUI X usage: useXScale/useYScale hooks align a custom SVG
    overlay (state labels) to the chart''s internal data scale, a genuinely distinctive
    pattern beyond basic ScatterChart usage.'
  weaknesses:
  - No reference map inset or original-boundary comparison, despite the spec's note
    explicitly requesting one — a viewer can't gauge how much distortion occurred
    relative to true land area.
  - Circles are non-contiguous (Dorling-style bubbles), so adjacency/shared borders
    between neighboring regions are lost — the spec's notes ask for regions to 'remain
    contiguous (sharing borders) after distortion,' which this bubble-cartogram approach
    doesn't achieve (a documented MUI X community-surface limitation, but still a
    real gap against the spec).
  - The spec's `geometry` (Polygon/MultiPolygon) data field is unused entirely — only
    centroid lon/lat drives position, so no shape-preserving distortion is attempted,
    only a position + circular-area substitution.
  - Smallest states' abbreviation text sits close to the 10px floor font size — legible
    now, but leaves little margin if the value range widens in a future data revision.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface — not pure white.
      Chrome: Title "cartogram-area-distortion · javascript · muix · anyplot.ai" in bold dark ink, fully readable; subtitle "Circle area ∝ 2023 population estimate · color = US Census region" in softer grey, readable; size legend ("Population (millions)", "6M"/"39M" labels, two outlined reference circles) and color legend (West/Midwest/South/Northeast swatches + labels) both rendered in soft dark text, fully readable.
      Data: 20 US states shown as circles positioned at approximate geographic centroids, area scaled by 2023 population (sqrt-scaled, largest = California ~38.9M, smallest = Minnesota ~5.7M). Colors are the Imprint palette by US Census region: West=#009E73 (brand green, first series), Midwest=lavender, South=blue, Northeast=ochre. Each circle carries a white (page-background-colored) state abbreviation label, legible against every fill color and circle size tested (CA, AZ, NY/PA/MA cluster, MN/WI/MI/IL/IN/OH/MO cluster all checked at full resolution).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface — not pure black.
      Chrome: Title and subtitle render in light ink/soft-grey text, fully readable against the dark surface; size and color legends render in light soft-grey text and outlines, fully readable; legend circle outlines correctly switch from dark-ink stroke (light theme) to light-ink stroke (dark theme).
      Data: Identical circle positions, radii, and fill colors to the light render — confirmed pixel-region crops (CA/AZ, NY/PA/MA, MN/WI/MI/IL/IN/OH/MO) show the same Imprint hues in both themes, only chrome flipped. State-abbreviation labels use fill=t.pageBg, so in dark mode the text renders near-black — still high-contrast and legible against every circle color (green, lavender, blue, ochre) at every tested size, with no dark-on-dark failures found anywhere on the canvas.
      Legibility verdict: PASS
