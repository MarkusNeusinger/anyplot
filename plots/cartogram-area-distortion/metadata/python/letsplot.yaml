review:
  strengths:
  - 'Bubble area is correctly proportional to population: the size channel reads sqrt(population)
    through scale_size_area, so DE (83 M) is drawn at about 2.2x the diameter of NL
    (17.5 M), and the size legend''s 5/20/40/80 M keys follow the same rule'
  - Non-overlapping Dorling circles stay near their countries, with the reference
    outlines behind them, so area distortion is readable against the undistorted footprints
    (Notes)
  - 'GDP per capita encoded with the Imprint sequential gradient (#009E73 -> #4467A3)
    as a secondary variable, with a titled colorbar and a titled population size legend
    whose glyphs are filled via guide_legend(override_aes=...) and visible in both
    themes'
  - 'Three-tier label hierarchy: large countries carry bold abbreviations inside their
    bubbles in a per-bubble contrast color (scale_color_identity), small ones are
    labelled beside the bubble in ink, all legible in both themes'
  - Native lets-plot layer_tooltips with country title, population and GDP lines adds
    real value in the HTML output
  - Theme tokens threaded through every chrome element; data colors identical between
    light and dark renders
  weaknesses:
  - 'DE-02 (both): the map panel is enclosed by a four-sided frame (dark grey on light,
    grey on dark) that nothing in a cartogram requires → no panel frame. Likely cause:
    panel_background=element_rect(fill=PAGE_BG) without color=PAGE_BG (or panel_border=element_blank()),
    so the default rect border is drawn.'
  - 'DQ-03 (both): the hand-typed reference outlines misstate the geography: Germany''s
    box overlaps Poland and Czechia, France''s polygon reaches over Belgium and Switzerland,
    Italy and the UK are shapeless blocks → outlines whose borders meet rather than
    overlap (real or simplified country boundaries). Likely cause: the _borders dict
    of rough rectangles and hexagons.'
  - 'VQ-01 (both): legend tick labels at 9 pt (colorbar 20–100, size keys 5–80) are
    the smallest text on the canvas and blur in the 400 px thumbnail → 10 pt (+1 pt)
    as the library baseline sets. Likely cause: legend_text=element_text(size=9).'
  - 'Suggestion: the stars and the ''Small nations, highest wealth'' annotation are
    a highlight layer the spec does not request, and the annotation sits in the Atlantic
    far from most starred countries (BE, CH, AT); removing both would leave the size
    and color encodings to tell the story.'
  - 'Suggestion: a slightly tighter latitude range would trim the empty band above
    Scandinavia and give the bubbles more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel; the panel is enclosed by a thin dark-grey four-sided frame.
      Chrome: bold title "European Population Cartogram · cartogram-area-distortion · python · letsplot · anyplot.ai" (~78% of width), muted grey subtitle explaining size/color/star; axes hidden; right-side GDP/capita colorbar (20–100) and Population (M) size legend (5/20/40/80) on elevated #FFFDF6 boxes; all text dark and readable.
      Data: 20 non-overlapping Dorling circles for European countries, sized by population (DE, UK, FR, IT largest) and filled on the Imprint green (#009E73, low GDP: RO, PL, HU, GR) to blue (#4467A3, high GDP: IE, CH, NO) gradient; thin grey reference outlines behind; bold abbreviations inside large bubbles, beside small ones; black stars above small wealthy nations and an italic "Small nations, highest wealth" note in the upper left.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; panel frame in grey.
      Chrome: title and labels in light ink, subtitle and annotation muted light grey, legend boxes on elevated #242420 with light text; no dark-on-dark text.
      Data: bubble fills identical to the light render; small-country labels and stars flip to light ink, in-bubble labels keep their contrast colors (dark on teal/green, light on NL); size-legend glyphs light grey and clearly visible.
      Legibility verdict: PASS
