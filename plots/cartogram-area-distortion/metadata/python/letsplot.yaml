review:
  strengths:
  - 'Bubble area is truly proportional to population: scale_size_area maps sqrt(population)
    to marker diameter with zero at zero, and the 5/20/40/80 M size legend matches
    the drawn bubbles'
  - Simplified country outlines with shared border vertices give the undistorted geography
    behind the Dorling circles, so the swollen DE/FR/UK/IT and the shrunken Nordic
    countries read against their real footprints
  - Imprint sequential green-to-blue gradient for GDP per capita with a titled colorbar
    plus a titled size legend, both on elevated theme-adaptive legend boxes
  - Abbreviation text color is chosen per bubble by WCAG contrast against its fill,
    and the labels come in three size tiers (in-bubble bold for large countries, beside
    the bubble for the smallest), legible in both themes
  - layer_tooltips with a country title and population / GDP lines adds real inspection
    value in the HTML output
  weaknesses:
  - 'SC-01 (both): an unrequested highlight layer — a ★ above every country with population
    < 15 M and GDP/capita > 50 K, a matching ''★ = small but wealthy'' subtitle segment
    and a floating ''Small nations, highest wealth'' callout in the North Sea — adds
    a derived threshold encoding and an annotation the spec does not ask for → remove
    the stars, the callout and the subtitle segment. Likely cause: the df_stars geom_text,
    the callout geom_text at (-9, 61.5) and the subtitle text.'
  - 'Suggestion: a contiguous cartogram is the spec''s preferred form; the Dorling
    circles are accepted, but distorted polygons would keep the shared borders the
    Notes prefer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel; legend boxes on a slightly lighter elevated surface with a thin soft-ink frame.
      Chrome: bold near-black title "European Population Cartogram · cartogram-area-distortion · python · letsplot · anyplot.ai" at the top left (~78 % of the width, unclipped), muted-grey subtitle "Bubble size = population | Color = GDP per capita | ★ = small but wealthy"; no axes (map). Right side: "GDP/capita (USD K)" colorbar (20–100) and "Population (M)" size legend with grey circles for 5/20/40/80. All text readable.
      Data: 20 European countries as Dorling circles at (roughly) their centroids over thin grey simplified country outlines. DE, FR, UK, IT, ES, PL are large circles with big bold dark abbreviations; NL has light text; smaller countries (IE, NO, SE, FI, DK, BE, CH, AT, CZ, HU, PT, GR) are small circles labelled in bold ink to their right; RO mid-sized with bold dark text. Fill runs Imprint green #009E73 (RO, PL, GR, HU) through teal to blue #4467A3 (IE, CH, NO). Black stars sit above 8 small wealthy countries; an italic grey callout "Small nations, highest wealth" floats at upper left. No circles overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend boxes on the darker elevated surface #242420.
      Chrome: title in light ink, subtitle, legend titles and tick labels in light greys — all clearly readable, no dark-on-dark text. Country outlines in grey remain visible. Size-legend circles flip to a light grey and stay visible.
      Data: bubble fills are identical to the light render (same green-to-blue gradient); in-bubble abbreviations keep the contrast-chosen colors (dark on teal/green, light on NL) and stay readable; beside-bubble labels and stars flip to light ink.
      Legibility verdict: PASS
