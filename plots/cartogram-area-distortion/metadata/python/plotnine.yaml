review:
  strengths:
  - 'Dashed reference hexagons, scaled so both sets cover the same total, sit over
    each cartogram hexagon. You can read each country''s distortion directly: Algeria
    shrinks inside its land-area outline and Nigeria swells far past it, and the caption
    turns this into a density reading (57 people per km², which matches the data).'
  - A reference map inset shows a coarse Africa coastline with hexagons at the true
    centroids, sized by land area and filled with the same urbanization colors, so
    the undistorted geography sits beside the cartogram.
  - imprint_seq is built natively with scale_fill_gradient(low='#009E73', high='#4467A3')
    and guide_colorbar(nbin=100), and the legend has a reader-facing title.
  - 'Theme tokens reach every element: label chips on ELEVATED_BG, INK outlines that
    flip to light in the dark render, and title, subtitle and caption all left-aligned
    to the plot edge.'
  - The data is real and checkable. Populations, areas and urbanization rates for
    16 African countries are plausible (Nigeria 220M / 924k km², Algeria 2382k km²
    / 75 %, Niger 17 % urban).
  - The vertices come from one cross merge over the seven hexagon angles, with no
    loops or helper functions.
  weaknesses:
  - 'SC-02 (both): the spec asks for neighbors kept close, but the hexagons sit on
    a loose grid. Wide empty gaps open between neighbors, for example Cameroon–Kenya
    at about 1.5 hexagon widths and Niger–Sudan at about 1 width, and an empty band
    lies between NG/CM and the right column, so the layout reads as scattered tiles
    rather than a compact map → tighten the grid so neighbors nearly touch without
    overlapping (about −30 % spacing). Likely cause: the grid_x/grid_y coordinates
    in COUNTRIES are spaced wider than the hexagon radii (BASE_R = 1.6).'
  - 'VQ-01 (both): the inset caption ''Undistorted map: area ∝ land area'' is set
    at 6.5 pt italic in INK_SOFT, the smallest text on the canvas, and blurs at the
    400 px thumbnail → about 8 pt (+1.5 pt). Likely cause: annotate(..., size=6.5).'
  - 'Suggestion: a small hexagon size key (for example 50M and 200M) next to the colorbar
    would make the area encoding readable without the subtitle.'
  - 'Suggestion: the inset could be a little larger now that the right column below
    the legend is empty.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel; the inset box and the label chips use the slightly lighter elevated surface.
      Chrome: bold dark title "cartogram-area-distortion · python · plotnine · anyplot.ai" top-left (about 80 % of width), two gray subtitle lines, a two-line gray caption at the bottom, and a boxed colorbar "Urbanization Rate (%)" on the right (ticks 20–70). No axes or grid. All text readable.
      Data: 16 pointy-top hexagons on a schematic Africa grid, each with a bold abbreviation chip (MA, DZ, EG, ML, NE, SD, ET, NG, GH, CM, KE, CD, TZ, AO, ZM, MZ). The fill runs on imprint_seq from green #009E73 (Niger, rural) to blue #4467A3 (Algeria, urban), with dark outlines. Dashed hexagons show land area: DZ, SD, ML and NE sit inside large dashed outlines, while NG, EG and ET extend far past theirs. The lower-left inset shows the Africa coastline with small hexagons at the true centroids, under the italic caption "Undistorted map: area ∝ land area".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; the inset box, legend box and label chips use the elevated #242420.
      Chrome: title in light ink, subtitle, caption and tick labels in light gray, all clearly readable; no dark-on-dark text.
      Data: hexagon fills identical to the light render (same green-to-blue ramp); outlines and dashed outlines flip to light ink and stay visible; the inset coastline is drawn in light gray.
      Legibility verdict: PASS
