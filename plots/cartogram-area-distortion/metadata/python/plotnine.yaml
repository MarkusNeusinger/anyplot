review:
  strengths:
  - Hexagon area is exactly proportional to population (radius = BASE_R * sqrt(pop
    / median)), and the dashed land-area hexagons are scaled to the same total, so
    fill vs outline reads directly as above or below the group's 57 people/km² average
    density
  - 'Accurate real data for 16 African countries (population, land area, urbanization)
    produces a strong distortion story: Nigeria and Ethiopia swell, Algeria, Mali
    and DR Congo shrink'
  - 'Theme tokens threaded through every element: boxed abbreviations on ELEVATED_BG
    chips and ink outlines stay legible in both renders'
  - 'Idiomatic plotnine: one long-format vertex frame built with a cross merge drives
    geom_polygon and geom_path through the group aesthetic'
  weaknesses:
  - 'SC-02 (both): the undistorted reference is a dashed regular hexagon sized by
    land area at the same position, which shows area but not geography; the spec asks
    for the original region outlines or a reference map inset → add a small inset
    showing the undistorted schematic positions/land-area layout as a map-like reference,
    or draw outlines of the real region shapes. Likely cause: the dashed geom_path
    reuses the cartogram''s hexagon template instead of geographic outlines.'
  - 'Suggestion: drop alpha=0.9 on the fills so the hexagon colors match the colorbar
    exactly and do not shift between the light and dark page.'
  - 'Suggestion: tighten the schematic grid (e.g. bring GH nearer NG and fill the
    empty lower-left) so neighbors sit closer, as in a Demers layout.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1, sampled 250,248,241).
      Chrome: bold left-aligned title "cartogram-area-distortion · python · plotnine · anyplot.ai" in near-black, two-line grey subtitle and caption, colorbar "Urbanization Rate (%)" (20–75) in an elevated box at the right; no axes or grid. All text readable.
      Data: 16 pointy-top hexagons for African countries on a schematic grid, area ∝ population, filled on the Imprint sequential ramp #009E73 (rural, NE/ET) → #4467A3 (urban, DZ/AO), thin dark outlines; dashed grey hexagons show each country's land area at the same scale (large outside DZ, ML, NE, SD, CD; small inside NG, ET, EG). Bold abbreviations on off-white chips.
      Legibility verdict: PASS

