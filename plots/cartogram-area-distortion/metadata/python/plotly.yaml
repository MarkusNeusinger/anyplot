review:
  strengths:
  - Dorling bubble cartogram (a form the Notes accept) with diameter = sqrt(population/max)
    × 70 px and no size floor, so bubble area is exactly proportional to population;
    CA reads about 8.6× a median state
  - Collision relaxation runs in the screen pixels of plotly's own Albers USA projection
    (conic equal-area, 29.5°/45.5° parallels) and converts back to lon/lat, so bubbles
    do not overlap and stay near their true positions; Alaska and Hawaii keep their
    inset coordinates
  - A transparent go.Choropleth layer draws every state outline in the theme's rule
    color, giving the undistorted geography for comparison under the bubbles
  - Color encodes log population density as a secondary variable with the two-stop
    imprint_seq gradient, and the colorbar uses readable manual ticks (10, 50, 100,
    500, 1k)
  - Theme tokens threaded through title, colorbar, annotations, land, lakes and bubble
    outlines; both renders are fully legible with identical data colors
  - Hover text in the HTML carries population, density and land area per state
  weaknesses:
  - 'Suggestion: a small size key (two or three reference circles, e.g. 1M / 10M /
    30M) would let the reader decode absolute population from bubble area, not only
    the ratio'
  - 'Suggestion: the colorbar''s lowest decade (1–10 per sq mi, where AK, WY and MT
    sit) has no tick label; a ''1'' tick would close the scale'
  - 'Suggestion: the ''1k'' tick sits right under the colorbar title''s second line;
    a little more title padding would give it room'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; lower-48 land in #FFFDF6 with faint grey state outlines, Great Lakes in a pale #EDE9DF, Alaska and Hawaii insets bottom-left.
      Chrome: centred dark title "U.S. States Population Cartogram · cartogram-area-distortion · python · plotly · anyplot.ai" at about 59 % of the width; muted subtitle "Dorling bubble cartogram · Area ∝ population · Color ∝ density" below the map; vertical colorbar "Population Density (per sq mi)" with ticks 10/50/100/500/1k on an elevated box at the right; elevated callout box below it ("CA has 39.0M people, 8.6× the median state's 4.6M, yet NJ is 4.5× denser than CA"). All text dark and readable.
      Data: 50 non-overlapping circles, one per state near its true position, area ∝ population (CA, TX, FL, NY largest; WY, VT, AK tiny), colored green (#009E73, sparse AK) to blue (#4467A3, dense NJ) with a thin page-colored outline; white bold abbreviations on the larger bubbles, the smallest unlabeled.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
