review:
  strengths:
  - Correct 3D bar chart built with the idiomatic Axis3 + meshscatter(Rect3) pattern
    (Makie has no native bar3d recipe), producing a clean 5×4 grid of 20 bars with
    slight spacing (bar_gap = 0.2) for depth perception
  - Bar color encodes revenue magnitude via imprint_seq (brand green → blue), a legitimate
    single-polarity continuous mapping per the spec's 'color can encode value magnitude'
    option, with a correctly labeled Colorbar
  - 'Full theme-adaptive chrome: panel colors, spines, grid lines (alpha 0.15), title,
    axis labels and tick labels all correctly flip between #FAF8F1/#1A1A17 surfaces
    with INK/INK_SOFT tokens — no dark-on-dark or light-on-light failures in either
    render'
  - Realistic, neutral business scenario (quarterly revenue by product category ×
    sales region) with per-category base values and per-region multipliers plus Gaussian
    noise, giving each bar a plausible, non-uniform height
  - Grid lines on the base/back panels relate bars to their categorical axis positions
    as the spec requests, and title/axes/xticks/yticks are all correctly mapped (x
    = Product Category, y = Region, z = Revenue ($k))
  weaknesses:
  - 'Rendering defect on the North/Electronics bar (the tallest, ~94-98): its front-right
    face has a visible diagonal ''bowtie'' crease/z-fight seam splitting the face
    into two differently-shaded triangles, identical in both plot-light.png and plot-dark.png.
    Root cause: North is index 1 of yticks and Electronics is index 1 of xticks, so
    this bar sits exactly at the Axis3 origin corner where the vertical z-axis spine
    line is drawn — the thin spine line z-fights against the tall bar''s mesh face.
    No other bar (including the similarly-tall West/Electronics, East/Electronics,
    South/Electronics bars) shows this artifact, confirming it''s the origin-corner
    spine collision, not a general meshscatter/Rect3 issue. Fix: reorder region_factor/regions
    (or the yticks assignment) so North is not the first tick adjacent to the axis
    origin, or hide/lighten the colliding z-spine (zspinecolor_3), or pick an azimuth
    where the tallest bar''s grid cell isn''t the corner where two axis walls meet.'
  - 'Font sizes are only partially explicit: titlesize/titlecolor are set, but xlabelsize/ylabelsize/zlabelsize
    and xticklabelsize/yticklabelsize/zticklabelsize are left at Makie/theme defaults
    rather than being explicitly declared, per the style guide''s VQ-01 rule that
    full marks require explicitly-set sizes throughout'
  - Spec's optional suggestion to add value labels on top of bars for a small grid
    (this is 20 bars, under the 25-bar threshold) was not implemented, which would
    have made exact per-bar values easier to read than inferring from color + height
    alone
  - Left third of the canvas is empty whitespace with no plot content, giving the
    composition a slightly off-balance feel next to the denser right two-thirds (grid
    + colorbar)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bar-3d-categorical · julia · makie · anyplot.ai" in bold dark ink, clearly readable. "Product Category" and "Region" axis labels and their tick labels (Electronics/Apparel/Home & Garden/Sports/Books, West/East/South/North) in soft dark gray, all legible. "Revenue ($k)" z-axis label and 0/50/100 tick labels legible. Colorbar labeled "Revenue ($k)" with 40/60/80 ticks, legible. Base/back-panel grid lines subtle and visible without competing with the bars.
      Data: 20 bars arranged in a 5×4 grid (Product Category × Region), each with a slight gap for depth separation. Color runs from brand green (#009E73, lowest values ~30-40) through teal to blue (~90+, highest values), i.e. the imprint_seq colormap, consistent with continuous single-polarity data. The tallest bar (North × Electronics, ~94-98) is darkest blue and sits at the front-right axis-origin corner; its right-side face has a visible diagonal crease/seam where the shading splits into two triangles of different brightness — a rendering artifact from the bar coinciding with the z-axis spine corner, not present on any other bar.
      Legibility verdict: PASS (all text readable; the crease is a geometry/shading defect, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title in light/near-white ink, clearly readable against the dark surface. Axis labels and tick labels in light gray, all legible — no dark-on-dark text anywhere. Colorbar label and ticks equally legible in light gray.
      Data: Identical bar colors to the light render (brand green → blue via imprint_seq) confirming the data-color/chrome-only-flips rule is respected. Same North × Electronics bar shows the identical diagonal crease artifact on its front-right face, confirming this is a geometry issue independent of theme.
      Legibility verdict: PASS (all text readable in both themes; the crease artifact is present identically in both renders, so it is not a theme-adaptation failure).
