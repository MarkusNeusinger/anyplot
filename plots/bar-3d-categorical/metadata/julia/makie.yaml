review:
  strengths:
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded consistently through nearly
    every Axis3 element (panels, grids, spines, tick/axis labels, title) producing
    correctly theme-adaptive chrome in both light and dark renders.
  - 'Correct Imprint sequential colormap (#009E73 -> #4467A3) drives the continuous
    revenue encoding, with identical data colors between the two themes.'
  - 'Idiomatic workaround for Makie''s lack of a native 3D bar primitive: meshscatter
    + Rect3 markers with per-value flat coloring (NoShading) is a legitimate, well-reasoned
    technique, documented with a comment explaining the shading choice.'
  - Title format, axis labels with units ("Revenue ($k)"), and colorbar label are
    all correct and consistent with the spec.
  - Code is clean, reproducible (Random.seed!(42)), and follows KISS structure with
    only used imports.
  weaknesses:
  - 'Significant bar occlusion: with a 5x4=20-bar grid, many rear bars are substantially
    hidden behind taller front bars at the current view (elevation 30deg, azimuth
    225deg) -- only roughly half the individual bars are distinguishable in the render.
    Try a higher elevation (more top-down) or reordering which axis faces the camera
    so shorter bars aren''t lost behind taller ones, and/or add subtle edge/stroke
    highlighting on bar faces so overlapping silhouettes stay distinguishable.'
  - Spec explicitly suggests "adding value labels on top of bars when the grid is
    small (under 25 bars)" -- this grid has 20 bars and no value labels were added.
    Consider text! annotations above each bar top (at least for the front, unoccluded
    bars) showing the revenue value.
  - 'Data Storytelling is limited: color redundantly encodes the same information
    as bar height rather than adding a new dimension or highlighting a specific insight
    (e.g. the standout Electronics/North combination). A brief annotation or emphasis
    on the top performer would strengthen the narrative.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), no pure white or dark tones.
      Chrome: Title "bar-3d-categorical · julia · makie · anyplot.ai" in dark ink, clearly readable at top center. Axis titles "Product Category", "Region", "Revenue ($k)" and category tick labels (Electronics, Apparel, Home & Garden, Sports, Books / West, East, South, North) render in dark/soft-dark ink against the light panels, all legible with no clipping at canvas edges. Grid lines on the axis panels are faint and subtle, not distracting.
      Data: A grid of 3D rectangular bars rising from the base plane, colored on a green-to-blue continuous scale (#009E73 for lower revenue values through #4467A3 for the highest, per the IMPRINT_SEQ colormap) matching a colorbar on the right labeled "Revenue ($k)". The tallest, most blue bar sits front-center (Electronics/North). Many bars toward the back of the grid are partially or fully occluded by taller bars in front, so not all 20 category/region combinations are individually distinguishable.
      Legibility verdict: PASS (all text is readable; occlusion is a data-visibility issue, not a text-legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), no pure black.
      Chrome: Same title and axis/tick labels now rendered in light ink (title white/near-white, tick labels light gray) against the dark panels -- clearly readable, no dark-on-dark failures observed. Grid lines remain faint but visible against the dark background.
      Data: Identical green-to-blue bar colors and colorbar as the light render -- confirms data colors are held constant across themes. Same bar arrangement and occlusion pattern as the light render (expected, since it's the same 3D scene with only chrome flipped).
      Legibility verdict: PASS (all text readable; no dark-on-dark issues).
