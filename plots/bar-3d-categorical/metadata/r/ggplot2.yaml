review:
  strengths:
  - Sophisticated hand-built isometric 3D projection in ggplot2 (which has no native
    3D support) using trigonometric projection, correct painter's-algorithm draw ordering,
    and per-face directional shading (top/left/right) for a convincing extruded-cube
    illusion
  - 'All three overlap issues flagged in Attempt 1 are fully resolved: the legend
    now has proper internal padding so ''Compound'' no longer touches the border,
    the ''Phosphate''/''Compound'' fertilizer tick labels are cleanly spaced, and
    the clustered value labels (6.2/5.0/6.9 and 5.7/6.0/5.0) no longer collide thanks
    to the collision-avoidance nudging logic'
  - 'Correct Imprint palette usage: first series (Organic) is #009E73, remaining fertilizers
    (Nitrogen, Phosphate, Compound) follow canonical palette order, and data colors
    are pixel-identical between light and dark renders'
  - Theme-adaptive chrome is fully correct in both renders — no dark-on-dark or light-on-light
    failures anywhere (title, axis titles, tick labels, legend, caption all flip correctly)
  - Matches the spec's recommended default viewing angle (elevation 30°, azimuth 45°),
    includes base-plane grid lines relating bars to their categorical position, and
    adds value labels since the grid is under 25 bars — all per the specification's
    explicit notes
  weaknesses:
  - A couple of the 20 grid cells (appears to be Phosphate on 1-2 soil types) are
    fully occluded behind taller neighboring bars from this viewing angle, so their
    value labels never render — the data exists but can't be read off the chart for
    those specific combinations. Consider a slightly different azimuth/elevation,
    extra bar spacing, or subtle top-face alpha so no bar is ever fully hidden.
  - Category tick labels (soil types, fertilizer names) are quite small (~6.5-7.7pt
    equivalent) — legible at full 3200x1800 resolution but become hard to read once
    scaled down to mobile width (~400px); a modest size increase for the axis category
    ticks would help.
  - There is a noticeably large empty gap between the right edge of the bar cluster
    and the legend box; pulling the legend horizontally closer to the chart would
    improve canvas balance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "bar-3d-categorical · r · ggplot2 · anyplot.ai" is clearly legible at the top. Italic axis-group labels "Soil Type" and "Fertilizer" are legible along their respective diagonal edges. Category tick labels (Peat, Silt, Sandy, Loam, Clay / Organic, Nitrogen, Phosphate, Compound) are all readable and cleanly spaced with no merging (verified by zoomed crop - "Phosphate" and "Compound" no longer touch, unlike Attempt 1). The "Fertilizer" legend box on the right has proper internal padding; "Compound" no longer touches the box border. Caption "Bar height = Crop yield (tons/hectare)" is legible at the bottom.
      Data: Twenty bars form a 4 (fertilizer) x 5 (soil type) isometric grid, each with a lighter top face and darker side faces for pseudo-3D shading. First series (Organic) renders in Imprint green #009E73; Nitrogen/Phosphate/Compound follow the canonical Imprint order (lavender, blue, ochre). Value labels sit above each visible bar top and no longer collide (verified by zoomed crop of the previously-clustered 5.0/6.9/5.7/7.4/6.0/5.0/6.5 group - all now cleanly separated). Two of the twenty grid cells (Phosphate bars for 1-2 soil types) appear fully hidden behind taller neighboring bars due to the isometric occlusion - their labels are not visible anywhere in the render.
      Legibility verdict: PASS (all rendered text is readable; the occlusion issue is a visibility-of-data problem, not a text-legibility problem)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, caption, axis-group labels, and category tick labels correctly flip to light ink (INK/INK_SOFT tokens) and remain clearly readable - no dark-on-dark failures anywhere. Legend box background flips to the elevated dark tone with light text, fully legible.
      Data: Bar colors are pixel-identical to the light render (Organic=#009E73 green, Nitrogen=lavender, Phosphate=blue, Compound=ochre) - only chrome (background, text, grid) changed, as required. The same occlusion of 2 Phosphate bars reproduces identically since it's geometry-driven, not theme-driven.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found)
