review:
  strengths:
  - 'Genuinely creative solution to ggplot2''s lack of native 3D support: a hand-built
    isometric projection (project_iso) with a painter''s algorithm for correct bar
    occlusion and per-face shading (top/left/right) for a convincing depth cue — follows
    the library''s ''no workarounds'' rule faithfully instead of faking 3D.'
  - Viewing angle matches the spec exactly (elevation ~30 degrees, azimuth ~45 degrees).
  - Full factorial grid rendered (4 fertilizers x 5 soils = 20 bars), with per-bar
    value labels since the grid is under the spec's 25-bar labeling threshold.
  - Base-plane grid lines relate bars back to their categorical position as required
    by the spec.
  - Color-codes bars by fertilizer in addition to spatial position, making cross-row
    comparison easier in the isometric view; legend clearly maps color to category.
  - 'Correct Imprint palette usage (Organic = #009E73 first series) with identical
    data colors between light and dark renders — only chrome flips.'
  - 'Clean, reproducible code: set.seed(42), only used imports (ggplot2, dplyr, ragg),
    no fake interactivity, correct ragg PNG save matching the landscape canvas target.'
  weaknesses:
  - 'Fertilizer axis tick labels overlap at the right end of the axis: ''Phosphate''
    and ''Compound'' visually merge into each other in both renders (e.g. light render
    around the base-plane fertilizer axis) — increase the label offset/spacing for
    fert_ticks (currently placed at y=-0.35) or reduce geom_text size (currently 2.7)
    so adjacent category labels no longer collide.'
  - 'Legend text touches the legend panel border with no padding: the ''d'' in ''Compound''
    visually runs into the legend box''s right edge line — widen the legend key/box
    (e.g. via legend.key.width or legend.margin) or reduce legend.text size so the
    longest label (''Compound'') has clear breathing room before the border.'
  - Bar-top value labels are cramped in the upper-middle region of the chart — e.g.
    '6.2'/'5.0'/'6.9' stack nearly touching, and '5.7'/'6.0'/'5.0' cluster tightly
    a bit lower. The existing anti-collision nudge (MIN_LABEL_GAP = 0.22) isn't large
    enough for this projection; increase MIN_LABEL_GAP (try ~0.3-0.35) or shrink the
    value-label font slightly to create clearer separation between nearby labels.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the light theme target.
      Chrome: Title "bar-3d-categorical · r · ggplot2 · anyplot.ai" is bold, dark, and clearly legible at the top. Caption "Bar height = Crop yield (tons/hectare)" at the bottom is legible. Axis titles "Soil Type" and "Fertilizer" (italic, angled to match the isometric grid) are readable. Category tick labels along both front edges (Peat/Silt/Sandy/Loam/Clay and Organic/Nitrogen/Phosphate/Compound) are legible EXCEPT that "Phosphate" and "Compound" visually overlap/merge at the right end of the fertilizer axis. The legend ("Fertilizer": Organic/Nitrogen/Phosphate/Compound with color swatches) is legible but "Compound" touches the legend box's right border with no padding.
      Data: 20 bars arranged in a 4x5 isometric grid, each with a lighter top face and darker side faces for depth. First series (Organic) is Imprint green (#009E73); Nitrogen is lavender, Phosphate is blue, Compound is ochre — matches the canonical Imprint palette order. White-ish bar edges separate faces cleanly. Value labels are printed above each bar; most are well-spaced, but several in the upper-middle of the chart (behind the tallest bars) are stacked closely together (e.g. 6.2/5.0/6.9 and 5.7/6.0/5.0).
      Legibility verdict: FAIL (fertilizer axis tick-label overlap "Phosphate"/"Compound", legend text touching the box border, and clustered value labels — see Weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the dark theme target.
      Chrome: Title, caption, axis titles, and tick labels flip to light ink color and remain clearly readable against the dark background — no dark-on-dark failures observed. The legend background/border also flips correctly and stays legible.
      Data: Bar fill colors are pixel-identical to the light render (confirmed Organic=green, Nitrogen=lavender, Phosphate=blue, Compound=ochre) — only the chrome (background, text, grid) changed, consistent with the theme-adaptive chrome requirement.
      Legibility verdict: FAIL for the same structural reasons as the light render — the "Phosphate"/"Compound" tick-label overlap, the legend text touching the border, and the clustered value labels are geometry-driven and appear identically in this render.
