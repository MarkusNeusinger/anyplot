review:
  strengths:
  - Creative isometric 3D bar rendering built entirely from ECharts' `graphic` custom-shape
    API (polygon/rect/text) with a correct back-to-front painter's algorithm, since
    native 3D bars require the disallowed echarts-gl extension.
  - Value magnitude is correctly encoded via the Imprint `imprint_seq` sequential
    colormap (brand green -> blue), with a clearly labeled color-bar legend showing
    the min/max range -- the right colormap choice for single-polarity continuous
    data.
  - Triple redundant encoding of value (bar height + color + numeric label) makes
    the chart accessible without relying on color alone.
  - 'Theme-adaptive chrome is correct in both renders: warm off-white/near-black backgrounds,
    ink-colored text stays legible, and the data colors are identical between light
    and dark.'
  - 'All spec-required features are present: slight bar spacing, floor grid lines
    relating bars to their categorical position, value labels on the small (16-bar)
    grid, and a legend indicating the color mapping.'
  weaknesses:
  - 'The chart never calls ECharts'' `series`, `visualMap`, or any data-bound API
    -- every shape is drawn via the low-level `graphic` array with `silent: true`,
    so the HTML export has zero interactivity (no tooltip, no hover state, no legend
    binding) despite echarts being an interactive-capable library. A `series: [{type:
    ''custom'', renderItem}]` binding (or `visualMap` for the color mapping) would
    keep the identical visual while restoring idiomatic, data-driven ECharts usage
    -- this is the main thing holding back Library Mastery.'
  - Value labels are positioned above each bar's own back-top vertex (`topBack[1]
    - 12`); when a short bar sits directly behind/beside a much taller neighbor (e.g.
    the '69' label for Apparel/South next to the '82' Electronics/North bar), the
    label renders over the taller bar's face instead of floating clearly above its
    own bar, creating ambiguous attribution. Offset the label further from the bar
    top or clip it to stay within the bar's own footprint.
  - The code defines 9 helper functions (projectRaw, barHeight, hexToRgb, rgbToHex,
    lerpColor, shade, colorForValue, gridLine, polygon) for the isometric math. This
    is understandable given the manual 3D projection, but it departs from the KISS
    Imports -> Data -> Plot -> Save structure expected elsewhere in the catalog; consolidate
    where possible without losing readability.
  - No explicit 'Region' / 'Product Line' axis-group title is shown -- only the category
    tick labels (North/South/... and Electronics/Apparel/...). Minor since the labels
    are self-explanatory, but an axis title would remove ambiguity for first-time
    readers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white -- correct.
      Chrome: Title "bar-3d-categorical · javascript · echarts · anyplot.ai" is dark, bold, centered at top -- fully readable. Category tick labels (North/South/East/West on the base x-lane; Electronics/Apparel/Home Goods/Grocery on the y-lane) are dark-gray/ink and clearly legible. Numeric value labels sit above each bar in dark ink and are legible against the light background. The color-bar legend on the right is titled "Satisfaction score" with min (69) / max (97) labels, both legible.
      Data: 16 bars in a 4x4 isometric grid, each shaded top/left/right face for a 3D cube look. Bar color follows the Imprint imprint_seq sequential ramp: green (~#009E73) for lower values (69, 74, 76) transitioning to blue (~#4467A3) for higher values (91, 95, 97). Floor grid lines (light gray) relate each bar to its base-plane position. Bars have visible gaps between them.
      Legibility verdict: PASS -- all text is clearly readable against the light background. One caveat: the numeric value label "69" (Apparel/South) visually overlaps the base of the much taller "82" (Electronics/North) bar behind it, which is a placement/attribution issue rather than a raw legibility failure (the digits themselves remain fully visible).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black -- correct.
      Chrome: Title, axis category labels, and value labels all render in light/white ink and are clearly readable against the dark background -- no dark-on-dark failures observed. The legend title and min/max labels are light-colored and legible.
      Data: Same 16 bars, identical Imprint imprint_seq green-to-blue color mapping as the light render -- confirmed the data colors do not shift between themes; only the chrome (background, text, grid) flips as expected.
      Legibility verdict: PASS -- all text is clearly readable against the dark background. The same "69"-over-"82"-bar overlap noted in the light render is also present here.
