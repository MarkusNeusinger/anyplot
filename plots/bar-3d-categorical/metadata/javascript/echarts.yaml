review:
  strengths:
  - 'Fixed the main Library Mastery gap from attempt 1: the chart now drives its geometry
    through a real `series: [{ type: "custom", renderItem }]` bound to `cells` data
    plus a `visualMap` for continuous color, instead of a static, data-detached `graphic`
    array — this restores idiomatic tooltip/data-binding while keeping the identical
    isometric visual.'
  - 'Fixed the label-collision weakness: value labels are now anchored at each bar''s
    own top-face centroid (`topCenter`, the centroid of the diamond top) rather than
    the back-top vertex, so the ''69'' label no longer bleeds onto the neighboring
    taller ''82'' bar in either render.'
  - 'Consolidated the color-shading code: 5 hand-rolled hex/RGB/lerp helper functions
    from attempt 1 are replaced by the built-in `echarts.color.lift(topColor, level)`
    for the left/right face shading — fewer moving parts, same visual richness.'
  - Triple redundant encoding of value (bar height + imprint_seq color + numeric label)
    keeps the chart accessible without relying on color alone, and the color-bar legend
    clearly labels the 69–97 range.
  - 'Theme-adaptive chrome is correct in both renders: warm off-white/near-black backgrounds,
    ink-colored text and label boxes (using `t.elevatedBg` for the label background)
    stay legible, and the data colors are pixel-identical between light and dark.'
  weaknesses:
  - Still 5-6 helper functions (projectRaw, barHeight, project, gridLine, the nested
    face() closure, renderItem) for the manual isometric math, departing from the
    catalog's usual flat Imports -> Data -> Plot -> Save structure. This is largely
    unavoidable given echarts-gl is disallowed for real 3D bars, so only a light deduction
    remains.
  - No explicit 'Region' / 'Product Line' axis-group title is shown — only the category
    tick labels (North/South/... and Electronics/Apparel/...). Minor, since the labels
    are self-explanatory, but an axis-group title would remove ambiguity for first-time
    readers.
  - 'Data Quality: the 16 values span 69-97, a fairly narrow, upper-range band; a
    wider spread (e.g. down into the 40s-50s for a couple of underperforming cells)
    would better showcase the full imprint_seq range and the height-encoding contrast.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white -- correct.
      Chrome: Title "bar-3d-categorical · javascript · echarts · anyplot.ai" is dark, bold, centered at top -- fully readable. Category tick labels (North/South/East/West along the base x-lane; Electronics/Apparel/Home Goods/Grocery along the y-lane) are dark-gray/ink and clearly legible. Numeric value labels sit centered on each bar's own top face in dark ink on a light label box, and are fully legible against the light background with no bleed onto neighboring bars. The color-bar legend on the right is titled "Satisfaction score" with min (69) / max (97) labels, both legible.
      Data: 16 bars in a 4x4 isometric grid, each shaded top/left/right face (via echarts.color.lift) for a 3D cube look. Bar color follows the Imprint imprint_seq sequential ramp: green (~#009E73) for lower values (69, 74, 76) transitioning to blue (~#4467A3) for higher values (91, 95, 97). Bar height is also proportional to value (the "69" cube is visibly the shortest, "97" the tallest). Floor grid lines (light gray) relate each bar to its base-plane position at the unoccluded silhouette edges. Bars have visible gaps between them for depth perception.
      Legibility verdict: PASS -- all text is clearly readable against the light background; the attempt-1 "69"-over-"82" label collision is resolved (each label now sits within its own bar's top-face footprint).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black -- correct.
      Chrome: Title, axis category labels, and value labels all render in light/white ink (label boxes flip to a dark `elevatedBg` fill) and are clearly readable against the dark background -- no dark-on-dark failures observed. The legend title and min/max labels are light-colored and legible.
      Data: Same 16 bars, identical Imprint imprint_seq green-to-blue color mapping and identical bar heights as the light render -- confirmed the data colors and geometry do not shift between themes; only the chrome (background, text, grid, label-box fill) flips as expected.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no clipping or dark-on-dark failures found.
