review:
  strengths:
  - Correct isometric 3D projection with three-tone face shading (darker left face,
    medium right face, colored top face) that reads as genuine depth rather than a
    flat gimmick.
  - Imprint sequential colormap (brand green -> blue) correctly encodes value magnitude,
    with identical data colors between light and dark renders.
  - 'Theme-adaptive chrome is fully correct in both renders: title, rotated category
    labels, base-plane grid, and legend text all flip appropriately with no dark-on-dark
    or light-on-light failures.'
  - 'Distinctive D3-specific technique: manual isometric polygon construction combined
    with d3.color().darker() for per-face shading and d3.interpolateRgbBasis for the
    continuous legend gradient -- not something a high-level charting library could
    replicate easily.'
  - Value labels on all 20 bars (grid < 25) with a stroke halo for legibility, correct
    mandated title format, and deterministic in-memory data.
  weaknesses:
  - Significant unused canvas space to the right of the color legend (roughly a quarter
    of the canvas width is empty background) and unbalanced margins -- scale the isometric
    grid up and/or recenter it to use more of the 3200x1800 canvas.
  - Spec note 'viewing angle should be adjustable' is not addressed even as a static
    design choice (e.g. no alternate azimuth offered); minor since the fixed ~30/45
    isometric view otherwise matches the spec's default recommendation.
  - Design storytelling relies solely on the sequential color ramp for hierarchy;
    consider a stronger focal point (e.g. subtly emphasizing the single highest-value
    bar) to push Data Storytelling further.
  - The densest cluster of bars (center of the grid) packs several value labels close
    together; a touch more spacing or slightly smaller labels there would reduce visual
    crowding.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "bar-3d-categorical · javascript · d3 · anyplot.ai" centered at top, clearly readable. Rotated category tick labels ("Electronics".."Toys" at +30deg, "North".."West" at -30deg) in soft dark gray, all legible. Thin light-gray grid lines trace the base plane. Legend "Sales ($k)" with min/max value labels (28/91) in soft ink gray to the right of a vertical gradient swatch.
      Data: 20 isometric bars (5 x-categories x 4 y-categories) colored via the Imprint sequential ramp (brand green -> blue) encoding value magnitude; white-haloed value labels on every bar top face; three-tone face shading (dark left, medium right, colored top) gives real depth cues.
      Legibility verdict: PASS -- all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, category tick labels, grid lines, and legend text all switch to light/soft-light tones and remain fully readable. Bar-separator strokes (which use the page-background token) correctly render as near-black lines against the dark surface instead of the near-white lines seen in the light render.
      Data: Same 20 bars in the identical Imprint sequential green->blue gradient as the light render -- confirmed no data-color drift between themes.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all chrome text and grid lines remain visible against the dark background.
