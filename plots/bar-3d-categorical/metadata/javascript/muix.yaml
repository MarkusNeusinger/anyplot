review:
  strengths:
  - 'Genuinely creative solution to a chart type the community BarChart can''t express
    natively: hand-built isometric cuboids (top+side face shading via a small shade()
    helper) composed on top of ChartsContainer using useXScale/useYScale/useDrawingArea,
    correctly re-projected at any canvas size.'
  - Zero clipping, zero text/element overlap in either render, including the tightest
    value-label clusters (Al 6061, Mg AZ31) where the code deliberately orders paint
    depth so labels of close values never collide.
  - 'Theme handling is exemplary: identical data colors between light/dark, correct
    #FAF8F1 / #1A1A17 chrome backgrounds, all text readable in both themes, no dark-on-dark
    or light-on-light failures.'
  - First categorical series is brand green (#009E73); Imprint palette used correctly
    and consistently for all 4 treatment series.
  - Deterministic, realistic, domain-plausible data (tensile strength in MPa across
    5 alloys x 4 heat treatments) with sensible scale and monotonic-by-design ordering
    that is explained and justified in a code comment.
  - Clean, idiomatic MUI X composition (hooks-based overlay pattern), no unused imports,
    no fake interactivity, skipAnimation set, current community-only API.
  - Custom YAxisTitle component thoughtfully works around a known ChartsYAxis label-collision
    issue with wide numeric ticks, with the rationale documented inline.
  weaknesses:
  - Spec explicitly calls for 'slight spacing between them for visual clarity and
    depth perception' between the 3D bars, but the isometric depth rows for the same
    alloy are drawn edge-to-edge with zero gap -- add a small perpendicular inset/gap
    per depth step (e.g. shrink barWidth slightly per row or add a 2-3px stroke gap)
    so each (alloy, treatment) cuboid reads as a discrete cell rather than a continuous
    cascade.
  - Spec asks for 'grid lines on the base plane [to] help relate bars to their categorical
    positions' -- only ordinary horizontal chart gridlines are drawn; there is no
    isometric floor/base-plane grid tying each bar back to its (alloy, treatment)
    cell. Consider drawing faint iso-projected floor lines under the bars.
  - Title renders at only ~29% of canvas width (measured), noticeably below the ~50-70%
    comfortable range noted in the style guide, making it a weaker focal point than
    'largest, first thing readers see' calls for -- a modest fontsize bump (e.g. 24-26px)
    would improve hierarchy without risking overflow given the title's ~51 characters.
  - 'The two categorical axes are not visually symmetric: alloy has real x-axis tick
    labels while treatment (the ''second axis'') is only distinguishable via legend
    + a subtle ~20px iso offset -- a legend-blind or color-blind viewer has no direct
    spatial cue for the second grid dimension beyond the staggered depth.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "bar-3d-categorical · javascript · muix · anyplot.ai" centered top in dark ink, clearly legible; X-axis "Alloy" and Y-axis "Tensile Strength (MPa)" labels dark and legible; tick labels (0-1,500 on Y, 5 alloy names on X) all legible; horizontal gridlines subtle grey, visible but not dominant; legend at right (Annealed/Tempered/Quenched/Aged swatches) fully visible, not clipped.
      Data: 5 alloy columns, each showing 4 isometric-shaded cuboids (Annealed=green #009E73 first series, Tempered=purple, Quenched=blue, Aged=brown/tan) staggered in a stair-step cascade with per-bar value labels (e.g. 124, 200, 275, 310 for Al 6061) in dark text on the colored faces -- all legible, no overlap even in the tightest-value cluster (Al 6061, Mg AZ31).
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis labels and tick labels render in light ink, clearly legible against the dark background; gridlines are subtle light grey, still visible; legend text is light-colored and fully legible; no clipping at any edge (verified top, left, right margins).
      Data: Same four data colors (green/purple/blue/tan) as the light render -- confirmed identical; value labels switch to white text on the colored faces and remain clearly legible against every bar color, including the darker blue and brown faces. No dark-on-dark failures anywhere.
      Legibility verdict: PASS.
