review:
  strengths:
  - 'Builds the 3D view on MUI X''s composition API: ChartsContainer with band/linear
    axes, and a custom Bars3D layer reading useXScale, useYScale and useDrawingArea,
    so bars sit exactly at their scale values against a zero-based value axis'
  - Oblique offset per heat-treatment row with gaps between bars keeps the top face
    and value label of every rear bar in sight; no bar is fully hidden
  - Shaded front, side (darken) and top (lighten) faces from each Imprint color give
    the bars a convincing solid look identical in both themes
  - Base-plane grid (row lines plus column polylines) and back-wall level lines extended
    from the value axis relate the bars to their cells and values
  - Value labels sit on their own bars, with page-colored pills where they fall over
    a rear bar, readable in both themes and free of collisions
  - All chrome threaded from ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg); text readable
    on both backgrounds
  - Axis bands sized explicitly (x height 68, y width 96) so no tick label is truncated;
    skipAnimation set
  weaknesses:
  - 'DQ-02 (both): the heat-treatment values read as invented for Steel 4140: ''Quenched''
    at 900 MPa is well below as-quenched 4140 (about 1,500–1,900 MPa, higher than
    tempered), and ''Aged'' is not a treatment that applies to 4140 or yields 1,080
    MPa → use treatments and values each alloy actually takes (e.g. as-quenched above
    tempered for 4140, or a treatment set like Annealed / T4 / T6 for the aluminium-type
    alloys). Likely cause: one Annealed<Tempered<Quenched<Aged staircase applied uniformly
    to every alloy in the data block.'
  - 'CQ-04 (code): lines 69–76 hand-roll a ''nice'' tick step and tick array that
    the d3 linear scale computes → `yScale.ticks(8)` inside Bars3D with `tickNumber:
    8` on the y axis (and drop the `as any` casts, which the library prompt says esbuild
    does not need). Likely cause: wall level lines computed outside the component,
    before the scale exists.'
  - 'Suggestion: the header subtitle repeating category counts and the value range
    adds a line of chrome with little reading value; the legend line alone could carry
    the header.'
  - 'Suggestion: a muix tooltip or highlight on the custom bars would add value in
    the interactive HTML.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 throughout.
      Chrome: bold title "bar-3d-categorical · javascript · muix · anyplot.ai" (~32% width), subtitle with category counts and value range, header legend "Heat treatment:" with four swatches; y axis "Tensile strength (MPa)" 0–1,400 ticks, x axis "Alloy" with five alloy tick labels, row labels Annealed/Quenched/Tempered/Aged at the right of the base-plane row lines; back-wall level lines and faint floor grid. All text dark and readable.
      Data: 20 shaded 3D bars in an oblique view, four rows offset up-right; Annealed #009E73 front, Tempered #C475FD, Quenched #4467A3, Aged #BD8233 rear; lighter top faces, darker side faces; value labels on each bar (pills over rear bars). Rear tops all visible.
      Legibility verdict: PASS

