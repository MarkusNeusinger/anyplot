review:
  strengths:
  - Composes ChartsContainer with ChartsXAxis, ChartsYAxis and ChartsGrid and draws
    the 3D bars in a custom layer through useXScale/useYScale/useDrawingArea, so the
    bars share MUI X's band and linear scales
  - Three-tone face shading (lightened top, darkened side) derived from each Imprint
    color gives the bars clear volume and depth in both themes
  - The depth stagger keeps every rear bar top and its value label in sight, so no
    bar is fully hidden
  - Value labels on translucent page-colored pills stay readable where they sit over
    rear bar faces, in both themes
  - Realistic materials-engineering data (alloy tensile strength by heat treatment)
    with a wide, meaningful value spread
  weaknesses:
  - 'SC-03 (both): the horizontal value grid and the y axis belong only to the front
    (Annealed) floor, while rear rows are shifted up by the depth stagger, so a rear
    bar top reads too high against the grid; the Aged Inconel 718 bar (1,400) tops
    out at about 1,540 on the axis (about +140 MPa), Quenched bars about +95, Tempered
    about +47 → rear bar tops readable at their values, e.g. by drawing the value
    gridlines on a back wall that follows the depth offset or by projecting each row''s
    grid level along the depth direction. Likely cause: ChartsGrid horizontal and
    ChartsYAxis drawn for row 0 only while each row group is translated by (row*STAGGER_DX,
    row*STAGGER_DY).'
  - 'DQ-03 (code): Mg AZ31 annealed is given 145 MPa, well below the typical 240–260
    MPa ultimate tensile strength of annealed AZ31 → about 240 MPa (+95 MPa), keeping
    the treatments in a plausible order. Likely cause: the Mg AZ31 values in the data
    block.'
  - 'CQ-04 (code): lines 68–81 write out per-channel RGB lightening and darkening
    for the top and side faces → lighten(hex, 0.34) and darken(hex, 0.3) from @mui/material/styles.
    Likely cause: hand-rolled color math instead of the MUI color helpers.'
  - 'Suggestion: the depth (heat treatment) axis could carry its own title next to
    the Annealed…Aged row labels instead of relying on the header legend title.'
  - 'Suggestion: drop the `as any` casts on useXScale/useYScale; the snippet is only
    bundled by esbuild, never type-checked.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas.
      Chrome: bold dark title "bar-3d-categorical · javascript · muix · anyplot.ai" centred at top, grey subtitle "Alloy: 5 · Heat treatment: 4 · Tensile strength (MPa): 124–1,400", inline legend "Heat treatment: Annealed / Tempered / Quenched / Aged". Y axis "Tensile strength (MPa)" 0–1,500 in steps of 100 with subtle horizontal gridlines; x axis "Alloy" with Al 6061, Ti-6Al-4V, Steel 4140, Inconel 718, Mg AZ31; depth row labels Annealed…Aged at right along the staggered floor lines. All text dark and readable.
      Data: 20 oblique 3D bars in 5 alloy groups, rows staggered back and up: Annealed brand green #009E73 in front, then lavender Tempered, blue Quenched, ochre Aged; lighter top faces and darker side faces. Value labels above each bar top (pills for the front three rows), e.g. 1,400 on the tallest Aged Inconel bar. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, axis titles, tick labels and depth row labels all flip to light ink and are clearly readable; gridlines subtle grey; value-label pills flip to dark with light text. No dark-on-dark text.
      Data: bar colors and shading identical to the light render; brand green front row stays vivid.
      Legibility verdict: PASS
