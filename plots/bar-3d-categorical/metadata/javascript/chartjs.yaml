review:
  strengths:
  - Technically sophisticated hand-rolled isometric 3D bar chart with true perspective
    projection, camera basis vectors, and painter's-algorithm depth sorting -- no
    external 3D library or plugin, matching the Chart.js constraint
  - Continuous sales-magnitude color mapping correctly uses imprint_seq (brand green
    to blue), with data colors identical between light and dark renders
  - Smart nearest-floor-corner axis anchor placement keeps category tick labels clear
    of tall bars regardless of which cell is tallest
  - Value labels shown for all 20 bars per the spec's under-25-bars guidance, and
    a gradient color-key legend clearly maps color to Sales ($k)
  - Floor grid on the base plane correctly relates bars to their categorical grid
    positions, and default elevation/azimuth (30/45 deg) matches the spec
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    ink-adaptive text and grid, no dark-on-dark or light-on-light failures'
  weaknesses:
  - 'Confirmed label collision at the shared axis-origin corner (bottom of both renders):
    the Product axis''s last tick label "Toys" and the Region axis''s last tick label
    "West" render with zero gap between them, visually merging into "ToysWest" in
    both plot-light.png and plot-dark.png. Because both axis edges share that corner
    as an endpoint, their perpendicular tick-label offsets end up nearly collinear
    at that specific point. Fix: add a small additional lateral offset (e.g. along
    each edge''s own direction, not just the perpendicular) specifically for the tick
    nearest the shared corner, so the two labels separate.'
  - Code relies on several top-level helper arrow functions (project, colorForValue,
    addFace, etc.) for the 3D math -- more structure than the CQ-01 'no functions'
    ideal, though justified by the hand-rolled projection technique this plot type
    requires.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "bar-3d-categorical · javascript · chartjs · anyplot.ai" in bold dark ink at top, clearly legible. "Product" and "Region" axis titles in bold dark ink; "Toys", "West", "Sports", "Home", "Apparel", "Electronics", "North", "South", "East" category tick labels in medium-gray ink, all legible EXCEPT the "Toys" / "West" pair at the shared near-corner, which render with no gap and visually merge into "ToysWest" (confirmed via a zoomed crop of that region). Floor grid lines are thin, subtle mid-gray, visible but not competing with the bars. A "Sales ($k)" gradient color-key sits bottom-left with min (22) / max (90) labels, fully legible.
      Data: 20 bars arranged in a 5 (Product) x 4 (Region) grid, each with a lighter top face and two darker camera-facing side faces (shaded from the same base hue), colored on a green-to-blue continuous gradient (imprint_seq) by sales magnitude -- tallest bars (82, 90) are blue, shortest (22, 25) are green. White value labels sit atop each bar giving the exact $k figure. All bars and labels are otherwise clearly distinguishable from the light background and from each other.
      Legibility verdict: PASS overall, with one flagged FAIL -- the "Toys"/"West" corner tick-label collision noted above.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same title, now in light/off-white ink, clearly legible against the dark background. Axis titles ("Product", "Region") in light ink, category tick labels in lighter gray, all legible with the SAME "Toys"/"West" corner collision reproduced identically (it's a geometry issue independent of theme, not a color/contrast issue). Floor grid lines are thin, subtle light-gray, visible without dominating. The color-key legend and its min/max labels are legible in light ink against the dark surface.
      Data: Colors are identical to the light render (same green-to-blue gradient by value, same face shading) -- only the chrome (background, text, grid) flipped as required. No dark-on-dark failures: all title/axis/tick text is light-colored against the near-black surface and reads cleanly. Value labels remain in white/near-white and are clearly visible atop every bar.
      Legibility verdict: PASS overall, with the same "Toys"/"West" corner collision as the light render (FAIL for that one label pair specifically).
