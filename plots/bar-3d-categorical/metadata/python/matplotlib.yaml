review:
  strengths:
  - 'Value is mapped to imprint_seq (#009E73 -> #4467A3) with a ScalarMappable colorbar
    in its own axes, and data colours are identical in both renders'
  - computed_zorder=False with zorder=10 keeps every value label on top of its bar,
    so all 16 values stay readable in the oblique view
  - Data flows through one tidy DataFrame and pivot_table(sort=False); ticks, limits
    and colour norm all come from the table
  - Plausible wheat-yield scenario (2.4-7.2 t/ha) with a clear fertilizer effect across
    fields
  weaknesses:
  - 'VQ-01 (both): the Field and Fertilizer tick labels are at 6.5 pt and the bar
    value labels at 7 pt, below the style guide''s 8 pt tick/annotation reference,
    and read small beside the 9 pt axis titles → 8 pt (+1.5 pt ticks, +1 pt value
    labels). Likely cause: set_xticks/set_yticks fontsize=6.5 and ax.text fontsize=7.'
  - 'CQ-03 (code): `from mpl_toolkits.mplot3d import Axes3D  # noqa: F401` is unused;
    projection="3d" needs no import since matplotlib 3.2 → delete the line and the
    noqa. Likely cause: legacy 3D boilerplate.'
  - 'CQ-04 (code): IMPRINT_PALETTE (line 23) is defined and never read; the plot uses
    only imprint_seq → delete the constant. Likely cause: copied template block.'
  - 'Suggestion: an elevation nearer the Notes'' ~30° would give the bars more visible
    height while keeping the rear tops in sight.'
