  strengths:
  - Mesh3d bars with flatshading and tuned lighting give clean, readable faces and
    depth in both themes
  - Imprint palette in canonical order with fully theme-adaptive chrome; data colors
    identical across renders
  - Elevated oblique camera keeps nearly every rear bar top and the value axis in
    sight
  - Value labels on all 20 bars of the small grid, readable in both themes
  - Correct 3200x1800 canvas and mandated title
  weaknesses:
  - 'VQ-02 (both): the value labels ''29'' (Food·Central) and ''60'' (Sports·West)
    touch with no gap and read as ''2960'' → at least a few px clear. Likely cause:
    the camera eye (x=1.5, y=-2.2, z=1.2) projects these two label anchors (h+2) onto
    the same spot; a slightly different azimuth or a larger label z-offset separates
    them.'
  - 'VQ-05 (both): the 3D scene fills only about the centre 45 % of the canvas width,
    leaving a wide empty band below the title and a large empty right third → enlarge
    the scene to fill more of the canvas. Likely cause: default scene domain with
    camera eye distance ~2.9; set scene.domain or move the eye closer (e.g. scale
    eye by ~0.8).'
  - 'CQ-01 (code): helper function axis_style() (lines 108-118) breaks the flat Imports-Data-Plot-Save
    structure → inline a shared axis dict constant instead of a function. Likely cause:
    the def axis_style(title) helper.'
  - 'Suggestion: the legend title ''Product'' could read ''Product Category'' to match
    the axis title.'
