review:
  strengths:
  - Oblique projection built from a single bokeh patches glyph with a per-patch color
    column draws all 60 bar faces in painter's order
  - Three-tone face shading (front, darker side, lighter top) gives the bars clear
    depth in both themes
  - Elevated view (DY 0.52) keeps the tops and value labels of rear bars in sight
    across the 5x4 grid
  - Quarter labels set in their series color double as the legend; all chrome threads
    INK / INK_SOFT tokens so both themes read cleanly
  - Data block is a tidy DataFrame with column constants, pivoted once, so the plot
    adapts to another table
  weaknesses:
  - 'VQ-01 (both): tick and category labels at 30pt and value labels at 24pt sit below
    the bokeh 34pt tick reference, and the axis titles at 36pt below 42pt → ticks
    and categories 34pt (+4pt), value labels about 30pt (+6pt), axis titles 42pt (+6pt).
    Likely cause: text_font_size on the tick, product and value Labels.'
  - 'VQ-03 (both): bars drawn at alpha 0.95 let the outlines of hidden rear bars show
    through the front faces as faint ghost rectangles (e.g. inside Electronics Q1)
    → opaque bars (alpha 1.0). Likely cause: alpha=0.95 on the bar patches.'
  - 'VQ-05 (both): the rotated value-axis title sits about 400 px left of its tick
    labels, detached from the axis, and the dark render shows a 1 px grey frame line
    20 px inside the canvas edge → move the title next to the ticks (about x_left
    + 0.9) and hide the frame. Likely cause: Label x=x_left + 0.25 and the plot frame
    outline at the min_border inset.'
  - 'SC-02 (both): color re-encodes Quarter, which the depth axis already encodes,
    so C4 (color encoding the value or a third categorical variable) is missed → color
    by value with imprint_seq and a color bar, or a single color. Likely cause: color
    = IMPRINT_PALETTE[j] per quarter row.'
  - 'SC-03 (both): the value axis is drawn at depth 0 while front bar faces stand
    at depth gap = 0.14, so every front bar reads high on the axis (Electronics Q1
    118 reads about 121, +3) → draw the axis and ticks at depth gap. Likely cause:
    project(0, 0, …) for the axis line and ticks.'
  - 'CQ-01 (code): four helper functions (project, hex_darken, hex_lighten, add_patch)
    instead of a flat script → inline the projection and shading as expressions in
    the loop. Likely cause: helper defs at lines 66-103.'
  - 'Suggestion: a HoverTool on the bar patches would show product, quarter and value
    in the HTML output.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: centered title "Retail Sales by Product & Quarter · bar-3d-categorical · python · bokeh · anyplot.ai" in dark ink (~60% width); rotated "Sales (k units)" at far left; value axis 20-120 at the front-left corner; product labels (Electronics … Sports) under the front edge with "Product category" title; Q1-Q4 labels in their series colors along the right depth edge with "Quarter" title. All dark text, readable. Base-plane grid faint but visible.
      Data: 5x4 grid of oblique 3D bars, Q1 #009E73 in front, Q2 #C475FD, Q3 #4467A3, Q4 #BD8233 behind, each with darker side and lighter top faces; bold value labels on every bar top on translucent page plates. Faint ghost outlines of rear bars visible through front faces.
      Legibility verdict: PASS

