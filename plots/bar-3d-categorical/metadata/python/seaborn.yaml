review:
  strengths:
  - Canonical 3200x1800 canvas in both themes with the full mandated title
  - Tidy df with column constants; bar3d with shade=True and alpha 0.85 gives readable
    faces and depth
  - 'Theme tokens threaded through ticks, labels, panes, grid and legend; Imprint
    order with Laptops in #009E73'
  weaknesses:
  - 'VQ-02, SC-02 (both): the value labels are partly or fully covered by bar faces
    (68, 56, 72, 33, 30, 30, 15 and 12 show only fragments; the Tablets labels are
    not visible at all), so C5 is missed → every label fully visible on top of its
    own bar. Likely cause: ax.text at h + 2 % of the maximum is depth-sorted with
    the bar3d collections and painted under neighbouring bars; set ax.computed_zorder
    = False and give the texts a zorder above the bars.'
  - 'SC-02 (both): three of the four Tablets bars (North, South, East) are fully hidden
    behind the taller Phones row directly in front of them, so C3 is missed → the
    top of every bar in sight. Likely cause: the product order Laptops, Tablets, Phones,
    Monitors at azim=45 puts the tallest product in front of the shortest rear row;
    order the product axis so taller rows stand behind shorter ones, or turn the azimuth.'
  - 'VQ-01 (both): value labels at 7 pt, below the 8 pt tick labels the library prompt
    sets as the smallest text → 8 pt (+1 pt). Likely cause: ax.text fontsize=7.'
  - 'VQ-05 (both): the 3D axes span only about half the canvas width (x ≈ 23–73 %),
    leaving wide empty bands left and right → about 75 % of the width. Likely cause:
    the default add_subplot(111, projection=''3d'') box; widen it with fig.subplots_adjust
    or ax.set_box_aspect(..., zoom=1.2).'
