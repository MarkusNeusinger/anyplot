review:
  strengths:
  - Cabinet projection with per-face shading (front, darker right, lighter top) built
    from geom_polygon in painter's order gives convincing depth
  - Tops of every rear bar and the value axis stay in sight; value labels readable
    in both themes
  - Theme tokens threaded through every text and line element; Imprint colors identical
    in both renders
  - Descriptive axis titles 'Satisfaction Score' and 'Age Group' plus an 'Education
    Level' legend
  weaknesses:
  - 'VQ-02 (both): the value labels 7.7 and 7.4 (Graduate, 18-34 and 50-64) and 7.2
    (Bachelor''s, 35-49 and 65+) sit across the top edges of their bars and the neighbouring
    rear bars → the label clear of every bar edge, about +0.2 z-units higher or a
    smaller label. Likely cause: the label offset pt[1] + 0.3 at a top-face center.'
  - 'SC-02 (both): the shallow view (DZ=0.32) hides the base-plane grid under the
    bars and the depth axis has no education labels on the plane, so C2''s grid and
    second categorical axis do not read → a higher elevation (larger DZ) with labels
    beside each depth row. Likely cause: DZ=0.32 and no depth-axis label layer.'
  - 'CQ-01 (code): helper functions prj() and shade() break the flat Imports → Data
    → Plot → Save structure → inline the projection and face colors. Likely cause:
    the def blocks.'
  - 'Suggestion: the native lets-plot legend (a mapped fill with scale_fill_manual)
    could replace the hand-built geom_rect legend.'
