review:
  strengths:
  - 'Genuinely native pseudo-3D: no matplotlib 3D fallback — an isometric projection
    (elevation ~30°, azimuth ~45°) is computed by hand in Python and rendered purely
    through plotnine''s 2D grammar (geom_polygon top/left/right faces, geom_path grid,
    geom_text labels/ticks), exactly honoring the library''s ''no 3D workarounds''
    rule while still delivering a convincing 3D bar chart'
  - Painter's-algorithm depth sorting (bars.sort(key=depth_key, reverse) draws far-to-near)
    produces correct occlusion between bars with no z-fighting artifacts in either
    render
  - 'Per-face shading (shade() lightens the top face +35% and darkens the right face
    -35% from the base Imprint hue) creates real 3D lighting cues while keeping the
    base hue anchored to the Imprint palette — first series (North) is #009E73 and
    the remaining 4 regions follow canonical palette order exactly'
  - 'Clever legend-proxy trick: a near-invisible geom_point layer on the independent
    ''color'' aesthetic produces a correct, undistorted legend swatch even though
    the visible bars are drawn via scale_fill_identity — avoids the common trap of
    a legend that doesn''t match the shaded fill'
  - 'All required spec Notes are implemented: slight inter-bar spacing (MARGIN), base-plane
    grid lines, value labels on all 20 bars (under the 25-bar threshold), and a color
    legend for the third categorical dimension'
  - Both renders are pixel-identical in data color and only flip chrome (background,
    text, grid) correctly — theme tokens are threaded consistently
  - Canvas is exactly 3200×1800, title format matches the mandated pattern exactly,
    and the code is clean, reproducible (seed=42), and uses only geoms/scales actually
    needed
  weaknesses:
  - No explicit axis-title text for the two categorical axes (e.g. 'Region' / 'Quarter')
    — the tick labels are self-explanatory but a small italic axis label near each
    front edge would make the encoding fully explicit without relying on the legend
    title alone
  - Value-label font (geom_text size=6, ~17pt) is legible but sits at the lower end
    of comfortable size for a 3200×1800 canvas — could go to 7-7.5 for a touch more
    presence, especially for mobile scaling
  - Data storytelling is functional (height + color) but passive — no annotation or
    emphasis calls out the standout bar (Central/Q4 at 91), so the viewer has to find
    the peak themselves
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-3d-categorical · python · plotnine · anyplot.ai" at top, fully visible with margin above and below, no clipping. Caption "Bar height = Quarterly revenue ($K)" at bottom, legible. Region/Quarter category tick labels along the two front edges of the isometric base plane (Q1-Q4 angled left, North-Central angled right), rendered in soft dark ink, all readable. "Region" legend box on the right with bordered swatches for North/South/East/West/Central.
      Data: 20 isometric bars arranged on a 5x4 grid (region x quarter), each with a lighter top face and darker left/right side faces for 3D shading. First series (North) renders in Imprint brand green #009E73; South/East/West/Central follow the next four canonical Imprint positions (lavender, blue, ochre, matte red) in order. Bold black value labels ("91", "86", "84", etc.) sit just above each bar's top face and are fully readable.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, caption, and tick labels have flipped to light ink (off-white/soft gray) and remain fully readable against the dark surface. Legend box background and border also flipped to the dark-theme elevated/soft-ink tokens; legend text is light and legible.
      Data: Bar colors are pixel-identical to the light render (same green/lavender/blue/ochre/red hues and per-face shading) — only the chrome flipped, confirming correct theme-token separation between data and non-data elements. Value labels are now white/light and stay legible against both the dark canvas and the bar faces they sit above.
      Legibility verdict: PASS — no dark-on-dark failures; every title/label/tick is clearly visible against the near-black surface.
