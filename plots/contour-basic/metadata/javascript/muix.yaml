review:
  strengths:
  - A zAxis piecewise colorMap drives both the band fills (via useZColorScale) and
    the PiecewiseColorLegend colour bar, so fills and legend cannot drift apart
  - Custom contour layer composed inside ChartsDataProvider/ChartsSurface using the
    library's useXScale/useYScale hooks, with native MUI X axes
  - Equal px per km layout keeps the terrain undistorted; the 100x100 grid gives smooth,
    evenly stepped isolines that close around both summits and form a clear saddle
  - Imprint sequential ramp (t.seq) in discrete steps; chrome is fully theme-adaptive
    and data colours are identical in both renders
  weaknesses:
  - 'SC-02 (both): the innermost ring around the south summit (about -1.0, -1.0) is
    a small, visibly faceted polygon only a few grid cells across, against the spec''s
    ''smooth curves, never angular'' property → a ring wide enough to look round,
    e.g. raise the south summit slightly (amplitude 0.75 → about 0.8) so the top level
    it crosses is not just grazed. Likely cause: the southSummit amplitude puts its
    peak barely above the 0.89 level.'
  - 'Suggestion: labels on a few key levels (the Notes allow them) would let the map
    be read without the colour bar.'
  - 'Suggestion: neighbouring low bands (0.00–0.13 and 0.13–0.25) are close in tone
    in the colour bar; fewer levels would widen each step.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around a square 6 x 6 km map.
      Chrome: bold title "Survey Terrain · contour-basic · javascript · muix · anyplot.ai" and grey subtitle "100 × 100 grid points · 9 levels evenly stepped by 0.13" at top; axis titles "Easting (km)" and "Northing (km)", ticks -3.0..3.0 every 0.5 in soft ink; colour bar at right titled "Elevation (km)" with 9 square swatches, 1.02–1.15 at top down to 0.00–0.13. All readable, dark text on light page.
      Data: filled bands stepped along imprint_seq from brand green #009E73 (low ground) to blue #4467A3 (summits), dark isolines at 0.6 opacity. Two summits (larger NE near (1, 0.5), smaller SW near (-1, -1)) joined by a diagonal ridge with a saddle hourglass; lines crowd on the steep summit flanks and run off the edges along the ridge. Innermost south-summit ring is small and slightly faceted.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
