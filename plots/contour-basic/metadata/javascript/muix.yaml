review:
  strengths:
  - Band fills are drawn from useZColorScale on the piecewise zAxis colorMap, the
    same scale PiecewiseColorLegend renders, so fills and the color bar share one
    source of truth
  - Marching triangles with a cell-centre vertex resolve the saddle between the summits
    cleanly; isolines never cross and run to the plot edges
  - Equal px per km on both axes keeps the terrain undistorted
  - Correct imprint_seq ramp for single-signed elevation, identical in both themes,
    with theme-adaptive chrome throughout
  - Field shows two summits of different height, a saddle and a ridge, exercising
    steep and flat ground
  weaknesses:
  - 'SC-02 (both): the innermost rings around both summits (1.02 level at the north
    summit, 1.02/0.89 at the south summit) are visibly faceted polygons, against the
    spec''s ''smooth curves, never angular'' bullet → smooth rings. Likely cause:
    gridSize = 60 over 6 km (0.1 km cells); raise it to 100, the spec''s upper bound.'
  - 'VQ-05 (both): the square map sits low on the canvas, about 190 px of empty band
    between the subtitle and the plot top versus about 140 px below the x-axis title
    → centre the map vertically or enlarge it into the spare height. Likely cause:
    HEADER_H plus the column flex layout leaves the leftover height above the ChartsWrapper
    instead of splitting it.'
  - 'Suggestion: labelling a few key levels on their isolines (the Notes allow it)
    would let the reader read elevations without consulting the color bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page.
      Chrome: bold title "Survey Terrain · contour-basic · javascript · muix · anyplot.ai" with a soft-ink subtitle "60 × 60 grid points · 9 levels evenly stepped by 0.13"; axis titles "Easting (km)" / "Northing (km)", ticks −3.0 to 3.0 every 0.5; color bar on the right titled "Elevation (km)" with nine swatches 0.00–0.13 … 1.02–1.15. All dark text, clearly readable.
      Data: square filled contour map, brand green #009E73 on low ground ramping to blue #4467A3 at the higher north-east summit (~1.1 km) and a lower south-west summit; a diagonal ridge runs corner to corner; dark isolines at 0.6 opacity separate each band; innermost summit rings are slightly faceted.
