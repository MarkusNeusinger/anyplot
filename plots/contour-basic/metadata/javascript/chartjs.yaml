review:
  strengths:
  - 'Filled bands and isolines come from one refined field: Catmull-Rom refinement
    of the 70x70 grid plus marching squares gives smooth closed rings around both
    peaks and basins, lines that run cleanly to the plot edge, and the saddle region
    near the center resolved without crossings'
  - imprint_div from t.div is centered on zero for the two-signed peaks surface (red
    basins, blue peaks, near-neutral flat ground), and the data colors are identical
    in both renders while the chrome flips
  - Levels are evenly stepped at a round step of 1 computed from the field's range,
    so tightly packed rings on the steep peak at (0, 1.6) and the basin at (0.2, -1.6)
    read as steep change and the wide spacing elsewhere as flat ground
  - The color bar is drawn as the same discrete bands as the plot, with a tick at
    every isoline level and the quantity 'Surface height f(x, y)' as its title, so
    color and lines read on one scale
  - 'Idiomatic Chart.js extension: the band fill and color bar are plugins on the
    beforeDatasetsDraw/afterDraw hooks, each isoline is a scatter dataset with showLine
    and null gaps between segments, and pointHitRadius gives a per-level tooltip in
    the HTML view; animation is off and the mount-node contract is followed'
  weaknesses:
  - 'VQ-06, DQ-02 (both): the axes read ''x coordinate'' and ''y coordinate'' and
    the color bar ''Surface height f(x, y)'', generic labels without units on an abstract
    test surface → name the quantity and unit of a concrete scenario for the same
    field (for example ''Easting (km)'', ''Northing (km)'', ''Elevation anomaly (m)''
    or a comparable physical surface). Likely cause: the X, Y and Z column constants.'
  - 'CQ-01 (code): the plot zone declares helper functions `refineRows()` (lines 49-64)
    and `fractionalIndex()` (lines 145-155), against the no-functions KISS structure
    → write the refinement and the index lookup inline in the plot zone, or as arrow
    expressions used where they are needed. Likely cause: the refinement factored
    into a reusable helper.'
  - 'Suggestion: labelling a few key levels on their own isolines (the Notes allow
    it when practical) would let the reader read values without the color bar.'
  - 'Suggestion: the two thin end bands of the color bar (above 8 and below -6) could
    be clamped to the outermost levels so every color-bar segment has the full step
    height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page around #FAF8F1; the plot area is filled edge to edge by the contour bands, whose near-zero band is a pale neutral close to the page tone.
      Chrome: bold title "contour-basic · javascript · chartjs · anyplot.ai" centered above the plot, about 40 % of the width; axis titles "x coordinate" / "y coordinate" in dark ink; ticks -3..3 on both axes in a softer dark ink; color bar on the right with ticks -6..8 at every isoline level and the rotated title "Surface height f(x, y)". All text readable, no overlap, nothing clipped.
      Data: the MATLAB-style peaks surface on [-3, 3]^2 as filled bands in imprint_div (red #AE3030 side for negative basins, blue #4467A3 side for positive peaks, near-neutral around zero) with thin semi-transparent ink isolines every 1 unit. A tall peak near (0, 1.6) shows ~8 tight closed rings, a deep basin near (0.2, -1.6) ~7 rings, a smaller peak at (1.3, 0), a small basin at (-1.4, 0.2), a lobe at (-0.4, -0.6), a tiny negative pocket near (0.3, 0.3) and the zero contour running to the left, right and bottom edges. Curves are smooth with no stair-stepping and never cross. No categorical series, so the #009E73 first-series rule does not apply.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page around #1A1A17; the near-zero band is a dark neutral close to the page tone.
      Chrome: title, axis titles and color-bar title in light ink; tick labels in a lighter soft grey; axis lines and the color-bar frame in light soft ink. No dark-on-dark text anywhere; everything readable.
      Data: the same field and the same red/blue band colors at the extremes as in the light render; the div midpoint is the theme-adaptive token, so the low-magnitude bands sit dark near the page. Isolines flip to light ink at 50 % alpha and stay clearly visible on every band. The red and blue extremes are identical to the light render.
      Legibility verdict: PASS
