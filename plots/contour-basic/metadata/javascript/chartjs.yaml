review:
  strengths:
  - Filled bands and isolines come from the same Catmull-Rom-refined grid (marching
    squares for the lines, bilinear sampling for the per-pixel band fill), so every
    band edge sits exactly on its isoline and all curves are smooth, closed or run
    to the plot edge, with no stair-stepping
  - imprint_div is centered on zero for the two-signed elevation anomaly (red basins,
    blue peaks, the theme-adaptive midpoint for flat ground), and the same palette
    is identical in both themes
  - Evenly stepped levels at a round step of 1 m are computed from the data range,
    and the color bar repeats the exact bands with a tick at every isoline level and
    the quantity 'Elevation anomaly (m)' as its title
  - 'Idiomatic Chart.js extension: scatter datasets with showLine and null breaks
    for isoline segments, a beforeDatasetsDraw plugin for the fill and an afterDraw
    plugin for the color bar, scale.getValueForPixel for pixel-to-data mapping, and
    axis borders lifted above the fill with border.z'
  - Per-isoline tooltips ('Elevation anomaly (m) = 3') in the HTML view; animation
    disabled, mount-node contract respected
  - 'The data shows every aspect of the plot type: two peaks, two basins, a saddle
    region, closed rings and lines cut off at the plot edge on a 70 x 70 grid'
  weaknesses:
  - 'Suggestion: inline value labels on a few key levels (for example 0, ±4, 8) would
    let the reader read the field without consulting the color bar; the Notes allow
    them when practical.'
  - 'Suggestion: in the dark render the bands between -1 and +1 sit very close to
    the plot-area midpoint color; a slightly stronger isoline alpha would separate
    the near-zero contours more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the plot area is filled by the imprint_div midpoint (pale neutral) for near-zero elevation.
      Chrome: bold title "contour-basic · javascript · chartjs · anyplot.ai" centered at top, axis titles "Easting (km)" and "Northing (km)", tick labels -3..3 on both axes, color-bar ticks -6..8 and the rotated color-bar title "Elevation anomaly (m)" — all dark ink, all readable. No grid (the fill covers the plot area); left and bottom axis lines drawn above the fill.
      Data: square 2400x2400 filled contour plot of the "peaks" surface, 14 levels at 1 m step. Blue rings for the main peak (top center, ~8 m), a secondary blue lobe right and a small blue lobe lower-center; red rings for the deep basin at lower center (~-6.5 m) and a basin at left; thin translucent dark isolines over the bands, smooth and non-crossing, closing on themselves or running to the edge. Color bar on the right with matching discrete bands. Diverging imprint_div red–mid–blue centered on 0.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; plot area filled by the dark imprint_div midpoint.
      Chrome: title, axis titles, tick labels and color-bar labels in light ink, all readable; no dark-on-dark text.
      Data: same geometry and the same red and blue anchor colors as the light render (only the theme-adaptive midpoint flips, as t.div specifies); isolines switch to translucent light ink and stay visible. Near-zero bands sit close to the background but remain distinguishable by their isolines.
      Legibility verdict: PASS
