review:
  strengths:
  - Custom-built swarm/beeswarm approximation (value-binning + rank-based symmetric
    x-offset) — a genuine technical achievement given ggplot2 has no native beeswarm
    geom, and the code comments explain the approach clearly.
  - Correct Imprint palette usage in canonical order across the 4 categories, with
    theme-adaptive chrome (backgrounds, ink tokens) correctly threaded through both
    light and dark renders.
  - Per-category mean markers (diamond shape) directly answer the spec's suggestion
    to add a mean/median indicator, and correctly recolor for theme (dark ink on light
    bg, light ink on dark bg).
  - Clean, KISS-structured single-pass code, reproducible via set.seed(42), correct
    ragg::agg_png device and plot-{THEME}.png output naming.
  - Realistic, neutral psychology reaction-time dataset with a clear, monotonically
    increasing difficulty narrative across the four experimental conditions.
  weaknesses:
  - Overlapping same-color points in dense clusters (e.g. Low Load ~470-500ms, High
    Load ~508-555ms) blend into solid bands because markers have no edge/stroke. Add
    a subtle stroke (e.g. shape=21, fill=condition color, color=PAGE_BG or 'white',
    stroke~0.3) so individual points stay visually separated in dense regions, per
    the style guide's overlapping-marker guidance.
  - At n=45 points per condition (just under the 'sparse <50' threshold), marker size
    (2.6) only matches the medium-density default. Bump to ~3.0-3.2 combined with
    the edge stroke above for more prominence per the data-density heuristic.
  - No visual connector or annotation makes the increasing-reaction-time trend across
    conditions explicit beyond the diamond mean markers — a subtle mean-to-mean guide
    line or brief callout would sharpen the data storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "swarm-basic · r · ggplot2 · anyplot.ai" in dark ink top-left, axis titles "Experimental Condition" (x) and "Reaction Time (ms)" (y) in dark ink, tick labels in a softer dark-grey ink, thin horizontal grid lines only, L-shaped axis line at bottom/left. All text is clearly readable against the light background.
      Data: Four swarm clusters (Baseline, Low Load, High Load, Time Pressure) colored in Imprint order — green (#009E73), lavender (#C475FD), blue (#4467A3), ochre (#BD8233) — with a black diamond mean marker per cluster. Points are round, semi-transparent, and clearly visible against the cream background; reaction times visibly increase left to right across conditions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis titles now in light/near-white ink, tick labels in a lighter soft grey, grid lines subtle and still visible against the dark surface. No dark-on-dark or light-on-light failures observed — all text is legible.
      Data: Same four cluster colors as the light render (green, lavender, blue, ochre) — confirmed identical hex data colors between themes. The mean diamond marker correctly flips from black (light theme) to white (dark theme) to stay visible against the darker background.
      Legibility verdict: PASS
