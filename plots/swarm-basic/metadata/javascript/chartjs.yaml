review:
  strengths:
  - Custom deterministic swarm layout (value-binning + symmetric offset) produces
    a genuine beeswarm spread on top of Chart.js's scatter type — a non-trivial technique
    the library doesn't provide natively.
  - Correct Imprint palette in canonical order (green, lavender, blue, ochre) with
    data colors identical across light and dark renders; chrome (background, text,
    grid, legend) is fully theme-adaptive in both.
  - Per-category median reference line (mixed scatter+line dataset, filtered out of
    the legend) adds a clear, uncluttered comparison point across groups without extra
    visual noise.
  - Realistic reaction-time data across 4 psychology-experiment conditions with distinct
    means/spreads and genuine outliers in every group, showing real distribution variety.
  - 'All chrome font sizes explicitly set (title 22px, axis labels 16px, ticks/legend
    14-16px) and readable at full size in both themes; white-edge markers (borderColor:
    pageBg) keep overlapping points distinct.'
  weaknesses:
  - 'Design Excellence is only at the ''strong but not publication-ready'' tier: the
    chart relies on palette + median line for polish with no additional refinement
    (e.g. subtle alpha, size variation, or a callout) that would push it toward FiveThirtyEight-level
    sophistication.'
  - No visual emphasis on the most notable finding (Sleep-Deprived group is markedly
    slower and more variable than the others) — a subtle size, alpha, or annotation
    cue on that group would strengthen the data storytelling beyond 'groups are colored
    differently'.
  - Sleep-Deprived swarm column is noticeably denser/tighter than the other three
    groups (values cluster close together around 400-490ms) — consider a slightly
    larger offset step or marker radius reduction there so individual points stay
    as distinguishable as in the other groups.
  - 'Library Mastery is solid but generic-adjacent: the mixed scatter+line technique
    and afterBuildTicks override are the minimum needed to fake a categorical beeswarm
    axis on Chart.js rather than a showcase of a distinctive Chart.js-only capability
    (e.g. custom tooltip formatting, plugin-based annotations).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "swarm-basic · javascript · chartjs · anyplot.ai" centered at top; legend row below title with 4 color swatches (Control, Caffeine, Sleep-Deprived, Exercise); dark Y-axis title "Reaction Time (ms)" and dark X-axis title "Experimental Condition"; tick labels in a slightly softer dark grey. All fully readable against the light background.
      Data: Four swarm columns of individual points (green Control, lavender Caffeine, blue Sleep-Deprived, ochre Exercise), first series is #009E73 brand green. Each column has a horizontal black median bar. Subtle horizontal-only gridlines. Points are white-edged for separation; no overlap between text and data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/white text; tick labels in light grey; gridlines still subtle but visible. No dark-on-dark text anywhere — every label, tick, and title is clearly legible.
      Data: Same four data colors as the light render (green/lavender/blue/ochre identical hex values), confirming only chrome flipped. Median bars are now white instead of black, remaining visible against the dark background. Brand green Control series still reads clearly.
      Legibility verdict: PASS
