review:
  strengths:
  - The amber backdrop band + amber median line on Sleep-Deprived directly resolves
    Attempt 1's "no emphasis on the standout finding" feedback — the plot now has
    a clear focal point without touching marker size (spec asks for consistent point
    sizes throughout).
  - Custom native plugin (beforeDatasetsDraw) and segment-based conditional line coloring
    are genuine Chart.js-specific techniques, elevating Library Mastery beyond the
    "minimum needed" assessment from Attempt 1.
  - Custom deterministic swarm layout (value-binning + symmetric offset) still produces
    a genuine beeswarm spread on top of Chart.js's scatter type.
  - Correct Imprint palette in canonical order (green, lavender, blue, ochre), data
    colors identical across light/dark, chrome fully theme-adaptive in both renders.
  - Realistic reaction-time data across 4 psychology-experiment conditions with distinct
    means/spreads and genuine outliers in every group.
  weaknesses:
  - Sleep-Deprived swarm column still shows a denser cluster around 400-420ms than
    the other three groups — the adaptive-binning comment claims "finer bins for wider-spread
    groups," but binCount is actually fixed per group (driven only by values.length,
    constant at 40 for every category) while only binSize scales with that group's
    spread, so the densest y-region still accumulates more points per bin than in
    the tighter-spread groups. A genuinely adaptive targetPointsPerBin (smaller for
    higher-sd groups) would resolve this more directly.
  - Design Excellence, while improved, still stops short of full publication-ready
    polish (e.g. the median line width/amber treatment is the only differentiation
    technique used — a second subtle cue, like slight alpha reduction in the densest
    region, would push further).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "swarm-basic · javascript · chartjs · anyplot.ai" centered at top; legend row below with 4 color swatches (Control, Caffeine, Sleep-Deprived, Exercise); dark Y-axis title "Reaction Time (ms)" and X-axis title "Experimental Condition"; tick labels in softer dark grey. All fully readable against the light background.
      Data: Four swarm columns of individual points (green Control, lavender Caffeine, blue Sleep-Deprived, ochre Exercise), first series is #009E73 brand green, canonical Imprint order. Each column has a horizontal median bar (black by default). New in this attempt: a subtle amber backdrop band sits behind the Sleep-Deprived column with its median bar rendered in amber instead of black, creating a clear visual focal point on the standout finding. Points are white-edged for separation.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/white text; tick labels in light grey; gridlines still subtle but visible. No dark-on-dark text anywhere — every label, tick, and title is clearly legible.
      Data: Same four data colors as the light render (green/lavender/blue/ochre identical hex values), confirming only chrome flipped. Median bars are white instead of black on non-highlighted groups; the amber backdrop + amber median on Sleep-Deprived is theme-invariant, exactly as in the light render.
      Legibility verdict: PASS
