review:
  strengths:
  - 'Excellent CVD-safe redundant encoding: each treatment group uses both a distinct
    Imprint palette color AND a distinct marker shape (circle/diamond/square/triangle),
    so groups stay distinguishable even without relying on hue.'
  - Correct Imprint palette in canonical order (green -> C475FD -> 4467A3 -> BD8233)
    identical across both themes; chrome (background, text, grid) flips correctly
    light-to-dark with no legibility issues in either render.
  - Genuine beeswarm layout algorithm (bin-and-fan-out via beeswarmOffsets) backed
    by a deterministic seeded mulberry32 PRNG, producing a real swarm distribution
    rather than a scatter/jitter approximation.
  - Group mean diamond markers with theme-adaptive fill (t.ink / pageBg border) add
    a clear at-a-glance dose-response story, directly fulfilling the spec's suggestion
    to add a mean marker per category.
  - 'Clean, minimal chrome: x-axis gridlines removed, a single subtle y-axis grid,
    unobtrusive axis lines, and no legend clutter (category names live on the x-axis;
    only ''Group mean'' appears in the legend).'
  weaknesses:
  - 'Library Mastery reads as generic: scatter + manual x-offsets is a solid workaround
    for the missing native beeswarm series, but nothing showcases a Highcharts-distinctive
    capability beyond marker symbols. Consider a library-specific touch (e.g. dataLabels
    on the mean markers, or a subtle connector/halo along the swarm axis) to lift
    LM-02.'
  - Marker opacity/size (radius 5, opacity 0.85) is static across all four groups
    even though bin density differs visibly (Placebo and Low Dose are denser near
    the median than High Dose) — a touch more transparency or gap in the denser groups
    would ease within-bin overlap reading.
  - 'Design Excellence is strong but not exceptional: axis lines are still visible
    (not fully removed) and the mean-diamond markers have no additional refinement
    (e.g. subtle drop-shadow or size hierarchy) that would push the chart toward publication-level
    polish.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "swarm-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top center, clearly legible. Y-axis title "CRP Level (mg/L)" and x-axis title "Treatment Group" in medium-gray ink, both readable with good contrast. Tick labels (0-15 on y-axis, four category names on x-axis) are dark and crisp. Subtle horizontal gridlines on the y-axis only; x-axis has no gridlines, keeping the swarm columns clean.
      Data: Four treatment groups (Placebo, Low Dose, Med Dose, High Dose) each rendered as a vertical beeswarm of scatter points, fanned out horizontally to avoid overlap. Placebo = green circles (#009E73, the mandated first-series color), Low Dose = purple/violet diamonds, Med Dose = slate-blue squares, High Dose = amber/ochre triangles — matching the Imprint canonical palette order. A black diamond marker per group marks the sample mean, with a legend entry "Group mean" at the bottom. Values decrease from Placebo (mean ~8.0) to High Dose (mean ~3.3), clearly visible as a dose-response trend.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, legend) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light gray/white and remain clearly legible against the dark background. Gridlines are the same subtle single-axis treatment as the light render, still visible but unobtrusive. The group-mean marker switches from black to white to remain visible on the dark surface (theme-adaptive chrome via t.ink).
      Data: Data colors are pixel-identical to the light render — same green circles, purple diamonds, slate-blue squares, and amber triangles, confirming only chrome (not data colors) adapts between themes. The dose-response pattern (decreasing mean CRP across groups) reads identically to the light version.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data markers are clearly distinguishable from the near-black background.
