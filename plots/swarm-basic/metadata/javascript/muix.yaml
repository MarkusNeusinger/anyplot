review:
  strengths:
  - 'True beeswarm layout computed in screen pixels: every point keeps its exact score
    on the y axis and moves sideways only to the nearest offset that clears previously
    placed points, so no two markers overlap in either render'
  - Median marker drawn as a custom SVG layer inside the ScatterChart using the useXScale/useYScale
    hooks, so it shares the chart's coordinate system instead of being faked with
    a second series
  - 'Clean theme threading: ink for title and axis titles, inkSoft for ticks, subtitle
    and median bar, grid token for gridlines; both renders fully legible with identical
    #009E73 data color'
  - Categorical x axis built from a numeric scale with tickInterval and a valueFormatter,
    ticks disabled, and half a slot of padding beside the outer swarms, leaving clear
    space between all four departments
  - Subtitle states the sample size and explains the median bar, so the one non-point
    mark needs no legend
  - 'Plausible, neutral scenario: 160 performance scores across four departments with
    distinct centres and spreads (Sales wide and low, Support tight and high) plus
    visible low outliers'
  weaknesses:
  - 'Suggestion: render the median bars beneath the point layer (or at slightly lower
    opacity) so the bar does not cut across the points sitting at the median in Sales
    and Support.'
  - 'Suggestion: placing points in order of distance from the group median rather
    than ascending score would give each swarm a more symmetric outline; the current
    ascending order produces the wide shelf at the bottom of the Engineering cluster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "swarm-basic · javascript · muix · anyplot.ai" centred at the top, grey subtitle "160 scores across 4 departments · bar = median"; y axis "Performance score (0–100)" with ticks 45–95 in steps of 5, x axis "Department" with category ticks Engineering, Sales, Marketing, Support; subtle horizontal gridlines, left and bottom axis lines only. All text readable.
      Data: four beeswarms of 40 points each in brand green #009E73, uniform size, no overlapping markers; dark-grey horizontal median bar across each swarm (≈79, 69.6, 74.3, 84.3). Sales spreads widest (46–88), Support is tight and high, Engineering/Marketing show isolated low outliers. Clear space between swarms.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, ticks and subtitle in light grey, gridlines subtle dark grey, axis lines light. No dark-on-dark text.
      Data: identical #009E73 points and identical positions to the light render; median bars flip to light grey (chrome token), still visible.
      Legibility verdict: PASS
