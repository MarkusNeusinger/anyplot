review:
  strengths:
  - Correct Imprint palette assignment across all 4 categories in canonical order
    (Placebo=#009E73, Low Dose=#C475FD, Medium Dose=#4467A3, High Dose=#BD8233)
  - Theme-adaptive chrome verified correct in both light and dark renders — no dark-on-dark
    or light-on-light legibility failures
  - Deterministic seeded LCG data generation, fully reproducible
  - Implements the spec's suggested 'subtle mean marker' feature with a diamond whose
    border color matches the page background, giving a clean halo effect in both themes
  - Realistic, neutral CRP dose-escalation clinical trial dataset with a clear downward
    dose-response trend, varied spread per group, and visible outliers (DQ-01 well
    covered)
  - Clean, KISS-adjacent code — the LCG/beeswarm helper functions are necessary complexity
    for computing the layout, not gratuitous abstraction
  weaknesses:
  - Beeswarm point layout is quantized into discrete vertical columns from the fixed
    bin/step offset formula, giving a blocky, grid-like silhouette rather than an
    organic swarm curve — reduce bin width or use a smoother nearest-neighbor jitter
    so density reads as a continuous shape.
  - No legend or label identifies the dark diamond markers as the group mean — a viewer
    of the static PNG (not hovering the interactive tooltip) cannot infer this. Add
    a small legend entry or subtle annotation labeling 'Mean'.
  - Y-axis tick marks (axisTick) are not explicitly hidden while x-axis ticks are
    — inconsistent chrome minimalism; hide both for a cleaner L-shaped frame.
  - Library Mastery is generic — the swarm is built with a plain scatter series and
    manual offset math that any library could replicate; a custom renderItem or other
    ECharts-distinctive technique would better showcase the library.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white.
      Chrome: title "swarm-basic · javascript · echarts · anyplot.ai" centered at top in dark charcoal, clearly legible. Y-axis titled "CRP (mg/L)" (has units) in soft gray. X-axis shows category names (Placebo, Low Dose, Medium Dose, High Dose) directly as tick labels. Subtle horizontal gridlines only (no vertical grid, appropriate for categorical x). All text is readable against the light background.
      Data: four groups rendered as vertically-spread swarms of dots — green (#009E73, Placebo), purple (#C475FD, Low Dose), blue (#4467A3, Medium Dose), ochre (#BD8233, High Dose) — plus a dark diamond per group marking the mean, with a light halo border matching the page background. Clear downward trend in CRP across dose groups.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black.
      Chrome: title, y-axis title, and all tick labels switch to light off-white/gray text and remain fully readable — no dark-on-dark failures detected. Gridlines remain subtle and visible against the dark surface.
      Data: the four category colors (green, purple, blue, ochre) are pixel-identical to the light render — only chrome flipped. The mean-marker diamonds swap to a light fill with dark border to stay visible against the darker page, an appropriate theme-adaptive treatment.
      Legibility verdict: PASS
