review:
  strengths:
  - Custom greedy nearest-free-slot swarm layout produces genuine density-shaped,
    non-overlapping point clouds per category, closely mimicking a real beeswarm despite
    Makie having no native swarm recipe
  - 'First series (Engineering) uses brand green #009E73, remaining departments follow
    canonical Imprint order (lavender, blue, ochre) with identical hues in light and
    dark renders'
  - Subtle per-department median line implements the spec's suggested 'mean or median
    marker' and gives each group a clear focal point
  - Theme-adaptive chrome is fully threaded through spines, gridlines, ticks, and
    labels — dark render has no dark-on-dark or light-on-light failures
  - Clean KISS script structure (theme tokens → data generation → swarm layout → plot
    → save), no functions/classes, deterministic via Random.seed!(42)
  weaknesses:
  - Design Excellence still reads close to a well-configured default — beyond the
    median line there is no additional visual hierarchy (e.g. no callout on the top/bottom
    department, no subtitle context) to sharpen the data story
  - Y-axis label 'Performance Score' lacks a unit/scale hint (e.g. 'Performance Score
    (0–100)') — would raise VQ-06 to full marks
  - 'Marker stroke uses strokecolor = PAGE_BG (a background-colored halo for point
    separation) but does nothing for the lower-contrast hues (lavender #C475FD, ochre
    #BD8233) against the light #FAF8F1 background — consider a thin ink-colored stroke
    per the style guide''s optional outline pattern'
  - 'Library Mastery is generic: the swarm-packing algorithm is a plain nested-loop
    implementation with nothing Makie-specific (no recipes, no GridLayout beyond a
    single Axis) — could be ported to any language with minimal changes'
  - Marketing's swarm column ends well short of the right canvas edge, leaving a visibly
    wider right margin than left — tighten xlims! or widen category spacing for better
    balance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white and not dark.
      Chrome: Bold dark title "swarm-basic · julia · makie · anyplot.ai" centered at top; dark "Department" (x) and "Performance Score" (y) axis labels; medium-gray tick labels on both axes; subtle horizontal y-axis gridlines only (x-axis grid off, appropriate for categorical axis); left/bottom spines only (top/right removed). All chrome elements are clearly legible against the light background.
      Data: Four department swarms — Engineering (#009E73 brand green, first series), Sales (#C475FD lavender), Support (#4467A3 blue), Marketing (#BD8233 ochre) — each with a thin dark horizontal median line. Points are packed via a nearest-free-slot algorithm, producing a beeswarm-like shape that widens where scores cluster and narrows at the tails, with no point overlap. Category labels (Engineering, Sales, Support, Marketing) sit under the x-axis.
      Legibility verdict: PASS — no light-on-light or unreadable text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black and not light.
      Chrome: Title, axis labels, and tick labels flip to light/off-white and soft-gray tones respectively; median lines flip from dark to white for contrast against the dark background; gridlines remain subtle (theme-adaptive low-alpha light lines); spines match the light-render layout (left/bottom only).
      Data: Colors are pixel-identical to the light render — same brand green, lavender, blue, and ochre hues, same swarm shapes and median-line positions — confirming only chrome (not data) changed between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all text and median-line markers are clearly visible against the near-black background.
