review:
  strengths:
  - First series correctly uses Imprint brand green (#009E73), remaining 3 departments
    in canonical Imprint order (lavender, blue, ochre)
  - 'Directly addresses the attempt-1 feedback: mark_circle now carries a theme-adaptive
    stroke (stroke=PAGE_BG, strokeWidth=0.6) that cuts a halo around each point, visibly
    separating individuals in the dense Sales/Engineering clusters'
  - New outlier_rings layer (unfilled ink-stroke circles, |z|>2 from department mean)
    adds a genuine data-storytelling hierarchy cue on top of the mean markers — directly
    answers the attempt-1 'add an outlier emphasis cue' weakness and is clearly visible
    on both the HR 45/92/95 and Marketing 41/48 points
  - Theme-adaptive chrome fully threaded through configure_axis/configure_view/configure_title/configure_legend,
    plus the new outlier-ring stroke and mean-marker color both correctly flip between
    INK values — no dark-on-dark or light-on-light failures in either render
  - Jitter and outlier flags are precomputed deterministically in pandas/numpy (seeded)
    rather than relying on Vega-Lite's in-chart random(), which would reseed on every
    render
  - Canvas lands exactly at 3200x1800 in both renders with generous margins and no
    clipping
  - 'Clean KISS script: flat structure, seeded RNG, only used imports (os, altair,
    numpy, pandas, PIL)'
  weaknesses:
  - Sales cluster (52 points, the densest group) still has noticeable point-on-point
    overlap even with the new stroke halo — the stroke helps but at 0.75 opacity +
    size=140 several points fully merge into indistinguishable blobs around y=62-67;
    consider a slightly narrower jitter width or smaller marker size specifically
    for the densest department
  - Composition still reads close to Vega-Lite defaults outside the analytical layers
    (mean markers, reference lines, outlier rings) — grid is subtle and spines are
    gone, but there is no additional refinement such as a per-category background
    band or alternating row shading to further separate the four swarms
  - Legend swatches are default-sized circles with no additional polish (e.g. no subtle
    border matching the elevated background) — minor, but a small refinement opportunity
    for Design Excellence
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "swarm-basic · altair · anyplot.ai" centered at top, clearly legible. "Department" (x) and "Performance Score" (y) axis titles in dark ink, tick labels in soft gray, subtle horizontal gridlines only (no vertical gridlines). Legend box (top-right, off-white fill, thin border) lists Engineering/Marketing/Sales/HR swatches, all readable.
      Data: Four jittered point clusters, one per department, colored Engineering=#009E73 (green), Marketing=lavender, Sales=blue, HR=ochre — matches canonical Imprint order with brand green first. Each circle now carries a subtle background-matching stroke that separates overlapping points in the dense Sales/Engineering clusters. Dark-gray diamond markers + dashed horizontal reference lines mark each department's mean. New unfilled ink-stroke rings circle the out-of-band outliers (Engineering ~93, Sales ~95, HR ~95/92, Marketing ~48/41, HR ~45), adding a clear hierarchy cue on top of the raw swarm.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and axis titles render in light off-white ink, tick labels in light soft-gray, gridlines subtle and visible against the dark surface. Legend box uses the elevated dark fill (#242420) with light text — fully legible, no dark-on-dark failures anywhere.
      Data: Same four department colors as the light render (green/lavender/blue/ochre) — confirmed identical hex values, only chrome flipped. Mean diamond markers and the new outlier rings both switch to light ink (white/off-white) for contrast against the dark background, exactly as expected for theme-adaptive non-data chrome. Point-edge strokes also flip to the dark background color, preserving the same separation effect seen in the light render.
      Legibility verdict: PASS
