review:
  strengths:
  - First series correctly uses Imprint brand green (#009E73), with the remaining
    3 departments in canonical Imprint order (lavender, blue, ochre)
  - Theme-adaptive chrome fully threaded through configure_axis/configure_view/configure_title/configure_legend
    — both renders correctly themed with no dark-on-dark or light-on-light failures
  - Jitter is precomputed deterministically in pandas/numpy (seeded) instead of relying
    on Vega-Lite's in-chart random(), which would reseed on every render — a smart
    reproducibility fix noted directly in the code comment
  - Mean diamond markers plus dashed per-department reference lines add a clear analytical
    layer (central tendency + comparison) beyond the spec's baseline ask
  - Canvas lands exactly at 3200x1800 in both renders with generous margins and no
    clipping
  - 'Clean KISS script: flat structure, seeded RNG, only used imports (os, altair,
    numpy, pandas, PIL)'
  weaknesses:
  - Dense overlapping swarm points (notably in the Sales and Engineering clusters)
    rely only on opacity=0.75 without a white/ink edge stroke on the circles — the
    style guide's Data Element Styling section recommends edge highlighting for overlapping
    markers; add a subtle stroke (e.g. stroke=theme-adaptive PAGE_BG or white, strokeWidth~0.5)
    on mark_circle to better separate individual observations at the densest clusters
  - Visual refinement leans on Vega-Lite defaults (the L-shaped chrome comes from
    configure_view(stroke=None) rather than deliberate additional styling) — consider
    slightly more breathing room between swarm clusters or a refined legend frame
    to push polish further
  - Composition beyond the mean markers is fairly standard; an additional hierarchy
    cue (e.g. a subtle per-category background band, or emphasizing outliers like
    the HR 45/92/95 points) would strengthen the data storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "swarm-basic · altair · anyplot.ai" centered at top, clearly legible. "Department" (x) and "Performance Score" (y) axis titles in dark ink, tick labels in soft gray, subtle horizontal gridlines only. Legend box (top-right, off-white fill, thin border) lists Engineering/Marketing/Sales/HR swatches, all readable.
      Data: Four jittered point clusters, one per department, colored Engineering=#009E73 (green), Marketing=lavender, Sales=blue, HR=ochre — matches canonical Imprint order with brand green first. Dark-gray diamond markers + dashed horizontal reference lines mark each department's mean. Points show full distribution shape including outliers (e.g. HR has low ~45 and high ~92/95 outliers; Marketing has a low outlier ~41).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light off-white ink, tick labels in light soft-gray, gridlines subtle and visible against the dark surface. Legend box uses the elevated dark fill (#242420) with light text — fully legible, no dark-on-dark failures anywhere.
      Data: Same four department colors as the light render (green/lavender/blue/ochre) — confirmed identical hex values, only chrome flipped. Mean diamond markers and dashed reference lines switch to light ink (white/off-white) for contrast against the dark background, exactly as expected for theme-adaptive non-data chrome.
      Legibility verdict: PASS
