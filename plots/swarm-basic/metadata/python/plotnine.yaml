review:
  strengths:
  - Deterministic custom beeswarm-packing algorithm (bin + alternate offsets) gives
    reproducible, collision-aware point placement instead of random jitter
  - Median diamond markers connected by a dashed trend line make the dose-response
    relationship immediately visible — strong data storytelling for an ordered categorical
    axis
  - 'Full theme-adaptive chrome: median markers, connecting line, grid, and text all
    correctly re-derive from INK/INK_SOFT/PAGE_BG tokens so both renders are legible'
  - 'Correct Imprint categorical palette in canonical order with Placebo mapped to
    #009E73'
  - Realistic clinical-trial biomarker scenario with decreasing variance at higher
    doses — biologically plausible and includes a genuine low outlier in the Low Dose
    group
  weaknesses:
  - Points visibly overlap/stack in the two densest groups (Medium Dose n=55, High
    Dose n=40) — the fixed bin/spacing offsets produce two tight columns where several
    circles sit almost concentrically instead of spreading outward; tighten n_bins
    or reduce point size/spacing so the swarm avoids excessive overlap as the spec's
    notes require
  - beeswarm_offsets() introduces a helper function, breaking the KISS Imports→Data→Plot→Save
    structure — acceptable given plotnine has no native swarm geom, but consider inlining
    or simplifying if the offset logic can be shortened
  - The custom offset/median-line logic is generic pandas/numpy rather than a plotnine-distinctive
    feature — LM-02 stays low; consider layering a subtle geom_violin or density hint
    behind the points to lean further into plotnine's grammar-of-graphics strengths
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "swarm-basic · plotnine · anyplot.ai" centered at top in dark ink, fully within the canvas with comfortable margin (no clipping). X-axis shows "Treatment Group" with category labels (Placebo, Low Dose, Medium Dose, High Dose); Y-axis shows "Biomarker Level (ng/mL)" with numeric ticks. Grid lines are faint horizontal guides, barely visible. All text renders in dark ink (#1A1A17) or soft grey (#4A4A44) and is clearly legible against the light background.
      Data: Four beeswarm columns, one per treatment group, colored green (#009E73, Placebo), purple (#C475FD, Low Dose), blue (#4467A3, Medium Dose), amber (#BD8233, High Dose) — matches Imprint canonical order with Placebo as the primary #009E73 series. Each group shows a spread of individual points (some visible overlap in the denser Medium/High Dose columns), a black diamond median marker per group, and a dashed grey line connecting the medians left to right, visually tracing the increasing dose-response trend.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels, now rendered in light ink (#F0EFE8) / light grey (#B8B7B0), fully legible against the dark background. Grid lines remain faint but visible. No dark-on-dark text detected anywhere.
      Data: Identical data colors to the light render (green/purple/blue/amber) — confirms only chrome flipped between themes. Median diamond markers switch from black to off-white so they remain visible against the dark panel; the dashed median-trend line is a lighter grey, still legible.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
