review:
  strengths:
  - 'Imprint palette applied correctly: Engineering=#009E73 (first series, brand green)
    through to Operations=#BD8233 in canonical order, identical across both themes.'
  - 'Theme tokens threaded through consistently — PAGE_BG/INK/INK_MUTED flip correctly
    between #FAF8F1/#1A1A17 renders with no dark-on-dark or light-on-light text.'
  - Group Mean markers per department are a thoughtful addition that directly satisfies
    the spec's 'consider adding a subtle mean/median marker' note and give the plot
    a clear comparative focal point.
  - Canvas is exactly 3200x1800 with no clipped text at any edge; title, axis titles,
    and legend are all fully visible.
  - Deterministic data generation via np.random.seed(42); clean imports; correct plot-{theme}.png/.html
    output contract for an interactive library.
  weaknesses:
  - 'Beeswarm collision detection is scaled wrong: point_radius=0.1 and spacing=0.05
    are compared directly against raw y-values, but the value axis spans ~75 units
    (range=(40,115)) while a rendered dot (dots_size=10) is roughly 1-1.5 data-units
    tall. Because the overlap threshold (2*point_radius+spacing = 0.25) is far smaller
    than the dot''s actual on-screen footprint, most points that are visually touching
    are never flagged as overlapping and stay at center_x, producing a dense solid-looking
    vertical strip (e.g. the Sales column) instead of a fanned beeswarm. Fix by deriving
    point_radius/spacing from the actual y-range/dot size (e.g. normalize y to [0,1]
    using the chart''s `range` before running the collision loop, or scale point_radius
    ~ (range span) * (dots_size in px / plot height in px)).'
  - Because of the collision-scale bug, the plot under-delivers on the spec's core
    promise ('points spread horizontally to avoid overlap' / 'reveals the full distribution
    shape') — large portions of each category render as a single dense column rather
    than a true swarm shape.
  - Some synthetic performance scores exceed 100 (e.g. ~106-115 in Sales) which reads
    oddly for a 'Performance Score' metric typically bounded 0-100 — either clamp/tighten
    the normal distribution parameters or make the scale explicit if scores >100 are
    intentional.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the light chrome token.
      Chrome: Title "swarm-basic · python · pygal · anyplot.ai" is dark and fully legible; x_title "Department" and y_title "Performance Score" are dark and clear; y-axis tick labels (40-110) and x category labels (Engineering/Marketing/Sales/Operations) are dark and readable; subtle dashed horizontal gridlines are visible without dominating; bottom legend (4 category swatches + Group Mean) is fully legible.
      Data: First series (Engineering) is #009E73 brand green, followed by Marketing (purple #C475FD), Sales (blue #4467A3), Operations (brown/amber #BD8233) — matches canonical Imprint order. Large black Group Mean dots sit at each category's average. Points within each category are NOT well spread horizontally — large stretches (especially Sales, mid-range Marketing/Operations) form a dense, mostly single-column vertical stack of touching/overlapping dots rather than a fanned swarm shape.
      Legibility verdict: PASS (all text readable; the overlap issue is a data/algorithm quality problem, not a legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the dark chrome token.
      Chrome: Title, axis titles, tick labels, and legend are all rendered in light ink (#F0EFE8/#A8A79F tones) and are clearly legible against the dark background — no dark-on-dark failures observed. Gridlines remain subtle but visible.
      Data: Same four category colors as the light render (green/purple/blue/brown), confirming Imprint palette identity across themes — only chrome (background, text, gridlines, Group Mean dot color which flips to a light ink tone) changed. Same overlap/clumping pattern as the light render, since it's a data-layout issue independent of theme.
      Legibility verdict: PASS (all text readable in dark mode; same overlap weakness as light render).
