review:
  strengths:
  - 'Outstanding data diversity: normal, wide-spread, bimodal, and outlier-laden distributions
    across the four departments genuinely demonstrate what a swarm plot is for'
  - Correct, theme-consistent Imprint palette across both renders with identical data
    colors
  - Explicit, well-proportioned typography (50/42/34pt) readable at full size in both
    light and dark themes
  - Clean, reproducible, KISS-structured code with idiomatic ColumnDataSource + HoverTool
    usage
  - Median reference lines per category add useful signal without cluttering the plot
  weaknesses:
  - Dense clusters (e.g. Engineering ~80-85) show visible point-to-point overlap because
    the jitter algorithm caps offset at jitter_width=0.35 - once local point density
    exceeds what that cap can spread, points collide at the same offset. Increase
    jitter_width and/or use a proper incremental dodge (track per-row occupied offsets
    rather than a density-window heuristic) so no two points in a swarm ever share
    the same x-position.
  - 'Missed opportunity for data storytelling: no annotation calls out the clearly
    bimodal Sales distribution or the two HR outliers, which are the most visually
    interesting features in this dataset.'
  - Library Mastery is generic - HoverTool tooltips are common to nearly every interactive
    library; a bokeh-distinctive feature (e.g. CustomJS interactivity, linked brushing,
    or a custom Span/BoxAnnotation) would raise LM-02.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold centered dark title "swarm-basic · python · bokeh · anyplot.ai"; dark "Department" (x) and "Performance Score" (y) axis labels; softer-ink tick labels for department names and score values. All clearly readable against the light background.
      Data: Four department swarms colored in canonical Imprint order — Engineering #009E73 (green, first series correct), Marketing #C475FD (lavender), Sales #4467A3 (blue), HR #BD8233 (amber). Dark semi-transparent median line per category.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light/white tones, tick labels in soft light gray — all legible against the dark background. No dark-on-dark failures observed. Median lines render in a light tone appropriate for the dark surface.
      Data: Same four category colors as the light render (green/lavender/blue/amber) — pixel-identical, confirming only chrome flipped between themes.
      Legibility verdict: PASS
