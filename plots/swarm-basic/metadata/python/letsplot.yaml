    — both renders pass the theme-readability check
  - 'Full distribution-shape coverage: bimodal Sales, tight Support with outliers,
    wide Marketing, moderate Engineering — clearly visible through the new violin
    outlines'
  - geom_sina + geom_violin + geom_crossbar is idiomatic, expert-level lets-plot grammar-of-graphics
    composition
