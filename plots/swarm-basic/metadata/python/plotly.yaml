      Data: Four categories (Room A green #009E73, Room B lavender #C475FD, Room C blue #4467A3, Room D ochre #BD8233) rendered as jittered points inside a de-emphasized, near-transparent box (faint colored outline only, no fill) that acts as a spread guide. Each category has a diamond mean marker in its series color with a light stroke. An annotation with a bordered callout box points at Room C's mean, reading "Bimodal: two skill clusters." Points in the densest bands (mid-spread of Room B and Room D) visibly overlap/stack on top of each other.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the required dark-theme page surface.
      Chrome: Title in light/white ink, centered, clearly readable. Axis labels and tick labels in light gray/white tones, clearly readable against the dark background — no dark-on-dark failures observed. Gridlines are faint light lines at low opacity, subtle but visible. Legend box has a dark elevated fill (#242420) with a light border and light text, fully legible. The annotation callout box also uses the dark elevated fill with light text and a light border — confirmed legible, not a dark-on-dark failure.
      Data: Colors are identical to the light render (same green/lavender/blue/ochre hexes and diamond mean markers) — only the chrome (background, text, grid, legend/callout fills) flips between themes, as required. Same overlap pattern in the dense mid-bands as the light render (this is a data/layout issue, not a theme-specific one).
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark issues found.
