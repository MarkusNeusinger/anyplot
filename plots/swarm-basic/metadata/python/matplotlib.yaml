      Data: Four vertical swarm columns (Engineering=green #009E73, Sales=lavender #C475FD, Marketing=blue #4467A3, Support=ochre #BD8233), each showing a genuine diamond-shaped beeswarm fan-out — individual points spread horizontally by density instead of stacking, so the true per-department distribution shape (spread, skew, denser middle) is now visible, along with a large diamond mean marker per category and two clear low outliers in the Sales column (~32, ~42).
