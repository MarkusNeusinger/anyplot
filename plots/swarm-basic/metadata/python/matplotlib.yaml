review:
  strengths:
  - 'Correct Imprint palette assignment (canonical order, first series #009E73) with
    fully theme-adaptive chrome — title, axis labels, ticks, spines, grid, and legend
    frame all flip correctly between light and dark with no dark-on-dark or light-on-light
    failures.'
  - 'Nice legend construction: per-category diamond mean markers plus a dedicated
    invisible-proxy scatter for a clean ''Mean'' legend entry, distinct from the category
    swatches.'
  - Realistic HR-analytics scenario with genuine variation across departments (different
    means/spreads, two real outliers in Sales) rather than uniform-looking groups.
  - 'Style-guide-compliant chrome: explicit font sizes, top/right spines removed,
    subtle y-axis grid, correctly formatted mandated title.'
  weaknesses:
  - 'Core swarm behavior is broken: points barely spread horizontally at all. Measured
    on plot-light.png, the ~50 Engineering markers (diameter ~77px at s=150/dpi=400)
    span only ~130px of x — i.e. the whole column is only ~1.7 marker-diameters wide,
    so most points sit stacked almost on top of each other instead of fanning out
    into the characteristic beeswarm shape. Root cause is in the offset-search loop:
    `best_offset` is initialized to 0 and is only overwritten when a non-colliding
    `offset` is found (`found=True`); when none of the tested offsets (0→0.45, 50
    steps, both signs) clears the collision test, `found` stays False and the point
    silently falls back to `best_offset=0`, re-stacking it at the category center
    instead of using the best (least-colliding) offset it tried. Separately, the collision
    metric mixes unnormalized x-offset (department-index units) with a y-term normalized
    by `point_radius` (`dx*dx + dy*dy < 4`), so the two axes aren''t on a comparable
    scale and the search rarely finds a valid spot even though up to ±0.45 of horizontal
    room is reserved and available.'
  - Because points collapse toward the center, the actual distribution shape per department
    (spread, skew, density) — the entire reason to choose a swarm plot over a strip/box
    plot — is not visible; only the diamond mean markers convey information.
  - 'Wasted canvas: each swarm column occupies a narrow sliver of its allotted x-slot,
    leaving large unused horizontal whitespace between and within category slots despite
    190 total data points.'
  - Y-axis label 'Performance Score' has no unit/scale qualifier (e.g. '(0-100)').
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "swarm-basic · matplotlib · anyplot.ai" in dark ink, centered, ~46 chars comfortably under 70% of plot width. X-axis label "Department" and y-axis label "Performance Score" in dark ink. Tick labels and axis lines in a softer dark gray. Subtle horizontal gridlines at y=30..100. Legend (Engineering/Sales/Marketing/Support/Mean) sits inside the plot's upper-right, framed with an elevated cream box. All text is clearly readable against the light background.
      Data: Four vertical swarm columns (Engineering=green #009E73, Sales=lavender #C475FD, Marketing=blue #4467A3, Support=ochre #BD8233), each with a larger diamond mean marker outlined in dark gray. However, within each column the individual circular markers are almost entirely stacked on top of one another rather than spreading sideways — the swarm's signature "fan out to avoid overlap" behavior is essentially absent, so most points overlap heavily and the true per-department distribution shape is hidden. Two low outliers are visible in the Sales column.
      Legibility verdict: PASS (all text readable), but data-element visibility is FAIL — points are not adequately spread and heavily overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/axis labels/ticks now rendered in light ink/off-white and soft light gray respectively, fully legible against the dark background. No dark-on-dark text anywhere. Gridlines are faint light lines. Legend box uses the elevated dark surface with light gray border/text.
      Data: Identical data colors to the light render (green/lavender/blue/ochre unchanged, confirming palette consistency across themes) and the same mean diamond markers, now outlined in a light gray. The same excessive point-stacking / lack of horizontal spread problem is present, unchanged from the light render (it's a data-layout issue, not a theme issue).
      Legibility verdict: PASS for text; FAIL for data-element visibility (same swarm-collision-avoidance issue as light render).
