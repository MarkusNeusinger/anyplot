review:
  strengths:
  - 'Correct plot type: sns.swarmplot with hue=Condition, palette=IMPRINT_PALETTE,
    legend=False follows the current (0.14+) API pattern and avoids the palette-without-hue
    deprecation warning'
  - 'Imprint palette applied in canonical order (#009E73, #C475FD, #4467A3, #BD8233)
    and is pixel-identical between light and dark renders — only chrome (background,
    ink, grid) flips as required'
  - Median diamond markers (ax.scatter with marker='D') add a genuine data-storytelling
    layer beyond the raw swarm, fulfilling the spec's optional 'consider a mean/median
    marker' note, and are theme-adaptive (INK color + PAGE_BG edge) so they stay legible
    on both backgrounds
  - 'Data realism is strong: Control is tight/fast, Distraction shows wider spread,
    Time Pressure is genuinely bimodal (rushed vs. deliberate responses), and Fatigue
    includes a few severe attention-lapse outliers — this uses the full expressive
    range of a swarm plot (individual points, density, distribution shape, outliers)
    rather than four generic normal blobs'
  - Canvas exact 3200x1800 via figsize=(8,4.5)@dpi=400 with bbox_inches left at default
    (None), reproducible via np.random.seed(42), clean single-purpose script with
    no fake interactivity
  weaknesses:
  - Median diamond markers sit directly on top of the densest part of several swarms
    (e.g. Distraction, Fatigue), partially occluding a few data points — consider
    a slightly larger PAGE_BG halo/edge width or nudging marker zorder/size so the
    median stays a clear focal point without swallowing nearby dots
  - Design execution mostly reproduces the library's own baseline style-guide defaults
    (despine, alpha grid, standard legend box) rather than adding distinctive polish
    beyond the median-marker idea — e.g. no typographic hierarchy or subtle per-category
    emphasis to push visual refinement further
  - Legend swatch only labels the median marker; a one-line caption or subtitle noting
    n per condition would strengthen the story for readers unfamiliar with swarm plots,
    though this is a nice-to-have, not a spec requirement
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "swarm-basic · python · seaborn · anyplot.ai" in dark ink, clearly visible; axis titles "Reaction Time (ms)" (y) and "Experimental Condition" (x) in dark ink; tick labels (300-700 on y, Control/Distraction/Time Pressure/Fatigue on x) in soft dark gray, all legible; horizontal grid lines subtle and unobtrusive; legend box "Median" top-right with a light elevated background and soft edge.
      Data: Four swarms in Imprint canonical order — green (#009E73, Control), lavender-purple (#C475FD, Distraction), blue (#4467A3, Time Pressure), amber (#BD8233, Fatigue); black diamond median markers with light-colored edges sit atop each swarm as focal points; points are small (size 4), lightly transparent (alpha 0.85), and well-spread with no excessive overlap.
      Legibility verdict: PASS — no light-on-light or otherwise unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title and axis text now rendered in light cream ink, clearly visible against the dark surface; tick labels in a lighter soft gray, legible; grid lines subtle; legend box uses a slightly lighter dark elevated background with a soft light edge, distinguishable from the page background.
      Data: Same four swarm colors as the light render (green/purple/blue/amber) — confirmed pixel-identical hues; median diamond markers flip from black to cream/white (INK token) so they remain clearly visible against the dark background — no dark-on-dark failure.
      Legibility verdict: PASS — all title/axis/tick text and median markers read cleanly on the dark surface; no dark-on-dark text found.
