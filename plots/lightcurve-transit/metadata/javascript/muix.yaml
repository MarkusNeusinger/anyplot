review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with a native
    line series for the model, ChartsGrid, ChartsReferenceLine and ChartsXAxis/ChartsYAxis,
    plus a custom SVG layer that reads useXScale/useYScale so the error bars and points
    share the chart''s own scales'
  - Phase folding is computed from time and period in the plot zone rather than pre-baked,
    so all 280 points land on one orbital-phase axis with a single downward 1 % dip
    at phase 0.5
  - Error bars at 50 % opacity and points at 84 % keep the dense baseline band and
    the dip legible in both themes; data colours (#009E73 points, Imprint purple model)
    are identical across light and dark
  - 'Header typography: bold title over a monospace subtitle carrying computed transit
    depth, duration, period and span, left-aligned to the y-axis line, with the legend
    set right in the same band'
  - Axis bands sized explicitly (x height 60, y width 96) so the 3-decimal monospace
    tick labels are never truncated; monotoneX curve keeps the model from overshooting
    between samples
  - Limits derived from the data (flux extents plus a 14 % pad), deterministic LCG
    data, skipAnimation set on both the container and the LinePlot
  weaknesses:
  - 'DQ-03 (both): the observed flux is drawn from a uniform distribution of half-width
    2.5σ (std ≈ 1.44σ), so the plotted ±1σ error bars understate the actual scatter
    by about 30 % and many baseline bars visibly miss the model line → make the scatter
    consistent with the error bars (Gaussian noise with std equal to flux_err, reduced
    χ² ≈ 1). Likely cause: obsFlux = modFlux + (r1 * 2 - 1) * NOISE_SIGMA * 2.5 instead
    of a Box-Muller Gaussian draw scaled by fluxErr.'
  - 'Suggestion: the smoothstep model gives a V-shaped dip with no flat bottom; a
    quadratic limb-darkened profile, as the Data example names, would show the characteristic
    ingress, curved floor and egress of a full planetary transit.'
  - 'Suggestion: the legend entry reads "Observed Relative flux (±1σ)" with a capital
    R mid-phrase; "Observed flux (±1σ)" reads more naturally.'
  - 'Suggestion: the observed points are hand-drawn <circle> elements and the legend
    is a hand-built HTML block; a native ScatterPlot series with ChartsLegend would
    add hover tooltips to the points in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "lightcurve-transit · javascript · muix · anyplot.ai" top-left (~31 % width), monospace inkSoft subtitle "280 phase-folded observations (14.1 d span, P = 3.5247 d) · transit depth 1.00% (2.42 h duration)"; right-aligned legend (green dot "Observed Relative flux (±1σ)", purple line "Transit model"). Y axis "Relative flux" 0.984–1.008 with 3-decimal monospace ticks, x axis "Orbital phase" 0.00–0.95. Subtle horizontal grid, dark axis lines. All readable.
      Data: 280 #009E73 points with translucent green ±1σ error bars form a band 0.996–1.004 around 1.000; a purple (Imprint position 2) model line flat at 1.000 dips smoothly to 0.990 at phase 0.5 (V-shaped), with ~10 in-transit points following it down to 0.988. A short dashed inkSoft baseline segment is visible across the dip under the model.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all flip to light ink; grid lines subtle dark grey; axis lines light. No dark-on-dark text anywhere.
      Data: identical colours to light — #009E73 points and error bars (error bars dimmer against dark but clearly visible), same purple model curve, same dashed baseline segment in light grey.
      Legibility verdict: PASS
