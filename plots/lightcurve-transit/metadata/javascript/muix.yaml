review:
  strengths:
  - Phase folding is computed from time and period in the plot code (with a pass-through
    for data already in phase), so the four simulated orbits stack into one dip
  - Custom error-bar layer uses MUI X's useXScale/useYScale hooks to draw in the chart's
    own coordinate system, a native composition idiom for a feature the community
    package lacks
  - Error bars at half opacity under denser points keep the dip readable through the
    dense baseline band
  - Mono subtitle reports observation count, span, period, depth and duration computed
    from the data
  - Theme tokens threaded through all chrome; both renders fully legible with identical
    data colors
  weaknesses:
  - 'SC-03 (both): the transit model drawn as a natural spline swings above the 1.000
    baseline just before ingress (phase ~0.48) and after egress (phase ~0.52), showing
    flux brightening the model does not have → model flat at 1.000 outside the transit
    (overshoot 0). Likely cause: curve: "natural" on the model series with only ~10
    samples across the dip; use curve: "monotoneX" or sample the model on a dense
    phase grid.'
  - 'Suggestion: the legend label reads "Observed Relative flux (±1σ)" with a capital
    R mid-phrase; "Observed flux (±1σ)" would read more naturally.'
  - 'Suggestion: a quadratic limb-darkened model (as in the spec''s example) would
    give the flat-bottomed U shape of a full transit instead of the current V shape.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold title "lightcurve-transit · javascript · muix · anyplot.ai" top left, mono subtitle with 280 observations / 14.1 d span / P = 3.5247 d / depth 1.00% / 2.42 h; HTML legend top right (green dot "Observed Relative flux (±1σ)", purple line "Transit model"); y axis "Relative flux" 0.984–1.008 with mono ticks, x axis "Orbital phase" 0.00–0.95; subtle horizontal grid. All text dark and readable.
      Data: 280 green #009E73 points with lighter green error bars scattered ±0.004 around 1.000; purple model line flat at 1.000 with a narrow V-shaped dip to 0.990 at phase 0.50; small spline bumps above 1.000 at ~0.48 and ~0.52; dashed baseline reference visible only across the dip.
      Legibility verdict: PASS

