    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark-theme surface (the faint interior green cast is the intentional 8%-opacity circle fill, not a background error).
      Chrome: Title, axis titles, and all tick labels flip to light/off-white ink and remain fully legible. Grid lines and reference lines stay subtle against the dark surface. Same L-shaped spine convention as the light render.
      Data: Circle stroke/fill and all point marker colors (green, lavender, blue, ochre) are pixel-identical to the light render — only chrome flipped, as required. No dark-on-dark failures found; every label (including "C", "2θp ≈ 40.6°", and all four extreme-point labels) is readable against the near-black background.
      Legibility verdict: PASS
