review:
  strengths:
  - Custom equalAspect plugin correctly forces a true circle by expanding the tighter
    axis after layout, solving Chart.js's lack of a native equal-aspect option
  - 'Custom afterDatasetsDraw annotation plugin adds all the mechanics-specific reading
    aids the spec asks for: center marker, dashed 2θp angle arc, and labeled A/B/σ1/σ2/τmax/τmin
    points'
  - 'Correct Imprint palette usage: circle in brand green #009E73, stress points/principal
    stresses/shear extremes following canonical palette order 2→3→4, identical across
    themes'
  - Legend and tooltip cleanly filtered to hide the internal helper datasets (diameter
    line, axis reference lines) via the leading-underscore label convention
  - Deterministic, hard-coded stress state with correctly derived center/radius/principal-stress/τmax
    math
  weaknesses:
  - Chart.js auto-generates axis ticks that include the padded min/max, producing
    awkward non-round boundary labels (-12.7, 112.7 on X; -59.4, 59.4 on Y) that stand
    out against the otherwise round tick values (0, 20, 40, ...) and hurt overall
    polish
  - Data storytelling relies entirely on the mandated engineering annotations rather
    than any additional visual hierarchy device (e.g. emphasizing the principal-stress
    axis or fading the construction lines further) that would push it into 'excellent'
    territory
  image_description: |-
