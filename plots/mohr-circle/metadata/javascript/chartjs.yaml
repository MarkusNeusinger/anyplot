      Chrome: Title, axis titles, and tick labels all rendered in light off-white/gray tones, clearly readable against the dark background; grid lines are subtle light gray at low opacity; legend text is light and readable.
      Data: Circle, stress-point, principal-stress, and shear-extreme colors are identical to the light render (green, lavender, blue, ochre) - only the chrome (background, text, grid) flipped as expected. No dark-on-dark or light-on-light failures observed; all point labels (A, B, σ1, σ2, τmax, τmin, 2θp) are legible.
      Legibility verdict: PASS
