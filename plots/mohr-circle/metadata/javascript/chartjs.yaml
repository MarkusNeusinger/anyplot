      Data: Circle rendered in brand green (#009E73); dashed diameter line and horizontal/vertical reference lines in soft ink gray; stress points A/B in lavender/purple; principal stresses σ1/σ2 in blue; τmax/τmin in ochre/tan. Point and angle-arc labels in dark ink, all legible and non-overlapping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
