review:
  strengths:
  - 'True-circle geometry is correct and verified: equal σ/τ padding on a forced-square
    grid box keeps the circle perfectly round in both landscape-safe square canvas
    renders.'
  - 'Complete feature set from the spec: principal stresses σ1/σ2, ±τ_max, stress
    points A/B, center C, and the 2θp principal-plane angle arc are all present and
    correctly computed and labeled.'
  - 'Clear visual hierarchy: σ1 (the critical engineering result) is emphasized with
    a larger diamond marker and a bordered callout box, distinguishing it from the
    secondary σ2/τ_max markers.'
  - Deterministic, realistic engineering scenario (bridge girder under combined bending
    + shear, MPa) with a stress state that straddles zero on the normal-stress axis,
    showing both tension and compression.
  - 'Idiomatic ECharts usage: markLine for the theme-adaptive reference lines through
    the center, z-ordering to layer geometry under labeled scatter points, and label
    backgroundColor/border for the σ1 callout.'
  - All chrome (title, axis names, tick labels, grid, reference lines) correctly threads
    theme tokens — both renders are legible with no dark-on-dark or light-on-light
    failures.
  weaknesses:
  - 'Palette assignment deviates from canonical Imprint order without a strong semantic
    justification: CLR_INPUT uses palette[4] (#AE3030, the matte-red semantic anchor
    reserved for bad/loss/error) for the applied stress points A/B, and CLR_DERIVED
    uses palette[2] (#4467A3) while skipping palette[1] (#C475FD lavender) entirely.
    Applied stress points are not an ''error'' concept — reassign A/B and the derived-quantity
    markers to the next canonical positions (palette[1], palette[2]) instead of jumping
    to the semantic-red anchor.'
  - 'Several label/marker pairs sit too close together and visually touch: the σ1
    callout box''s left border grazes its diamond marker, the σ2 and τ_max text labels
    crowd their diamond markers, and the ''C (20, 0)'' label sits almost on top of
    the maroon diameter line passing through the center point. Increase label distance/offset
    (or nudge label positions away from the diameter line) so no text touches a marker
    or line in either render.'
  - The A(55,30) label and the 2θp angle-arc label both sit close to the diagonal
    diameter dashed line — give them a bit more clearance so the line doesn't visually
    cut through the text.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "mohr-circle · javascript · echarts · anyplot.ai" in dark ink, centered, clearly readable. Axis names "Normal Stress σ (MPa)" / "Shear Stress τ (MPa)" and numeric tick labels are dark/soft-ink and fully legible. Grid lines are thin and subtle, a solid horizontal reference line and a dashed vertical reference line pass through the circle center.
      Data: Circle outline and center point C are brand green (#009E73, first series, correct). Stress points A(55,30) and B(-15,-30) are matte red with a light-page-colored border ring. Principal stresses σ1/σ2 and ±τ_max are blue diamond markers, with σ1 emphasized via a larger marker and a bordered callout box. The diameter line A–B is a dashed, semi-transparent red line passing through the center.
      Legibility verdict: PASS overall, with minor spacing issues — the σ1 callout box's marker touches its border, the σ2/τ_max labels crowd their markers, and the "C (20,0)" label sits close to the diameter line passing through it. All text remains individually readable, no clipping or dark-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis names, and tick labels flip to light ink/soft-white and remain clearly readable against the dark surface. Grid lines and the solid/dashed center reference lines are visible but subtle.
      Data: Circle, center C, and angle-arc label remain the identical brand green #009E73. Stress points A/B remain the identical matte red, principal-stress/τ_max markers remain the identical blue — confirmed identical to the light render, only chrome flipped as required.
      Legibility verdict: PASS overall, with the same minor label/marker crowding issues as the light render (they are geometry-driven, so they reproduce identically in both themes). No dark-on-dark failures — every text element has sufficient contrast against #1A1A17.
