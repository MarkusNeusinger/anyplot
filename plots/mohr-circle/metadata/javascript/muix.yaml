review:
  strengths:
  - True 1:1 circle enforced via an equal-size square drawing area (measured bounding
    box 1154x1154 px) — the aspect-ratio requirement is a hard geometric guarantee,
    not a visual approximation
  - Custom SVG overlay (stress points A/B, principal-axis segment, tau_max/tau_min
    markers, 2-theta-p arc) is positioned via the library's own useXScale/useYScale
    hooks, so annotations stay pixel-perfect at any canvas size instead of hard-coded
    offsets
  - 'Deliberate visual hierarchy: a bold black principal-stress-axis segment plus
    bold 19px result labels (sigma1, sigma2, tau_max, tau_min) read as the headline
    numbers, while the supporting geometry (points A/B, center C, angle label) uses
    thinner strokes and smaller 16-17px text — a clear focal point (DE-03)'
  - 'Correct Mohr''s-circle mathematics: center, radius, principal stresses, max shear,
    and the 2-theta-p rotation angle all computed directly from sigma_x/sigma_y/tau_xy
    with no magic numbers'
  - 'Backgrounds are pixel-exact Imprint tokens (#FAF8F1 light / #1A1A17 dark measured
    directly from the PNGs), first data series is #009E73, and data colors are identical
    between themes — only chrome flips'
  - No edge clipping in either render (verified by scanning all four canvas borders
    for non-background pixels) and no overflow of any label past the plot bounds
  - Deterministic, in-memory stress state with no randomness; imports are all used;
    skipAnimation set on the ChartContainer per the harness contract
  weaknesses:
  - 'File header is duplicated: lines 1-5 are one anyplot.ai header block (with a
    stale ''Quality: 87/100'' from a prior attempt) immediately followed by a second,
    different anyplot.ai header block on lines 6-9 (with ''Quality: pending'' and
    the License line). Collapse this into a single header per the muix.md skeleton,
    and put the ''//# anyplot-orientation: square'' directive on its own line at the
    very top of the file as required, not sandwiched between the two header blocks.'
  - The small 'C' center-point label sits directly on top of the dashed A-B reference
    line in both renders (confirmed at 3x zoom in both light and dark PNGs) — the
    glyph is legible but visually cut by the line. Nudge its x/y offset a few more
    px away from the diagonal so it clears the dashed stroke.
  - 'Visual refinement is solid but not maximal: the MUI X default axis line/tick
    styling is kept as-is beyond stroke color — no further chrome customization (e.g.
    tick length, axis line removal) was attempted, so DE-02 is scored as good-not-exceptional.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured (250,248,241) = #FAF8F1, matches the Imprint light-mode page background exactly.
      Chrome: Title "mohr-circle · javascript · muix · anyplot.ai" is centered, dark ink, fully legible. X-axis label "Normal Stress σ (MPa)" and Y-axis label "Shear Stress τ (MPa)" are both dark ink at a balanced size, clearly readable. Tick labels on both axes are legible mid-gray. Horizontal grid lines are subtle light-gray, visible but not dominant. Two solid vertical/horizontal reference lines cross at the circle center.
      Data: The circle outline is the brand green #009E73, identical hue on both renders. Stress-state points A(80,30) and B(20,-30) are a violet/purple (second Imprint palette color) with a light stroke ring. The principal-stress axis (thick black segment between sigma2 and sigma1), the sigma1/sigma2/tau_max/tau_min landmark dots (black with light ring), and all text/labels are dark ink, clearly distinguishable from the light background and from the green circle. The center label "C" is legible but is drawn directly on top of the dashed A-B reference line, causing a minor visual overlap.
      Legibility verdict: PASS (the "C"/dashed-line overlap is a minor blemish, not a legibility failure — all text remains readable).

    Dark render (plot-dark.png):
      Background: Warm near-black, measured (26,26,23) = #1A1A17, matches the Imprint dark-mode page background exactly.
      Chrome: Title, axis labels, and tick labels all render in light/cream ink against the dark background — no dark-on-dark failures anywhere. Grid lines are subtle light-gray, visible but restrained. Reference lines and the principal-stress axis switch to light/cream strokes so they stay visible against the dark canvas.
      Data: Circle color, violet stress-point color, and all label colors are visually identical to the light render — only the chrome (background, ink, grid, reference-line color) flipped, exactly as required. Same minor "C" label / dashed-line overlap present as in the light render, equally legible.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; same minor overlap noted above, not a legibility failure).
