review:
  strengths:
  - Uses the MUI X v9 composition API (ChartsContainer with ChartsXAxis/ChartsYAxis,
    ChartsGrid, ChartsReferenceLine) and draws the Mohr geometry in a custom child
    component that reads useXScale/useYScale, so every SVG mark sits exactly at its
    data coordinates
  - 'All derived values are computed from the stress state, not placed: C = 37, R
    = 48.9, σ1 = 85.9 MPa, σ2 = −11.9 MPa, τmax = 48.9 MPa and 2θp = atan2(32, 37)
    = 41° all check out against the render'
  - Equal data ranges (164 MPa on both axes) on a square drawing area make the circle
    a true circle; A and B sit at opposite ends of the dashed diameter through C,
    and the 2θp arc spans exactly from the σ1 axis to the CA line
  - 'Clear visual hierarchy: Imprint green circle with a faint fill, stress-state
    points A/B in the second Imprint color, principal and shear landmarks in ink with
    page-colored halos, bold landmark labels and softer secondary labels for C and
    2θp'
  - Theme tokens threaded through every custom element (ink, inkSoft, grid, pageBg
    halos), so both renders are fully legible with identical data colors
  - Realistic, neutral engineering scenario (steel drive shaft under bending plus
    torsion, σy = 0) with plausible MPa magnitudes
  weaknesses:
  - 'CQ-04 (code): the 2θp arc is built by a hand-written 33-point polyline loop (lines
    92–98) → one SVG elliptical-arc command, `M x0 y0 A r r 0 0 0 x1 y1` with r =
    |xScale(center + arcRadius) − cx|, which draws the same exact arc. Likely cause:
    the ARC_STEPS sampling loop.'
  - 'Suggestion: write the shear landmark as τmax (or τₘₐₓ) instead of the code-style
    ''τ_max'', matching the Unicode subscripts already used for σ₁ and σ₂.'
  - 'Suggestion: use the Unicode minus (−) in the value labels (''σ₂ = −11.9'', ''B(0,
    −32)'', ''−τmax = −48.9'') to match the tick labels, which already use it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400×2400 canvas.
      Chrome: title "Steel Drive Shaft, Bending + Torsion · mohr-circle · javascript · muix · anyplot.ai" in bold dark ink, centered, ~68% of width; axis titles "Normal Stress σ (MPa)" and "Shear Stress τ (MPa)" in dark ink; tick labels −40…110 and −80…80 in soft ink; subtle grid in both directions; reference lines at τ = 0 and σ = 37 in grid tone. All text readable.
      Data: Imprint green (#009E73) circle, 3.5 px stroke with faint green fill, centered at (37, 0) with radius 48.9; thick ink σ2–σ1 diameter; ink landmark dots at σ1 (85.9), σ2 (−11.9), τmax (48.9) and −τmax with bold labels; stress points A(74, 32) and B(0, −32) in the second Imprint color (purple) joined by a dashed ink diameter through the small ink center dot labelled C(37, 0); soft-ink arc from the σ axis to the CA line labelled "2θp = 41°". No overlaps, nothing clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and labels flip to light ink; tick labels in light soft ink; grid and reference lines subtle but visible. No dark-on-dark text anywhere.
      Data: circle green and A/B purple identical to the light render; landmark dots, diameter and dashed line flip to light ink with dark halos; arc and 2θp/C labels in light soft ink.
      Legibility verdict: PASS
