review:
  strengths:
  - 'Correct and complete Mohr''s Circle geometry — verified the math by hand: center
    = 50, radius = 42.43, sigma1 = 92.43, sigma2 = 7.57, tau_max = 42.43, 2*theta_p
    = 45 degrees, all matching the rendered labels.'
  - 'All spec-required features present: principal stresses, tau_max/tau_min, stress
    points A and B, angle-of-principal-planes annotation, center/reference lines through
    the origin, light grid, and true 1:1 aspect ratio circle.'
  - Correct Imprint palette usage — the circle uses brand green (#009E73) as the primary
    series, and the stress-state points A/B use palette[1] (lavender), following canonical
    order.
  - 'Theme-adaptive chrome is handled cleanly: both light and dark renders keep the
    data circle color identical while flipping text, grid, and landmark-marker strokes
    correctly.'
  - Idiomatic and distinctive MUI X pattern — uses the community `useXScale`/`useYScale`
    hooks to build a custom SVG annotation overlay that stays pixel-aligned with the
    chart's data coordinates at any size.
  weaknesses:
  - 'Design Excellence reads as a well-configured default rather than a bespoke design:
    beyond assigning the mandated Imprint palette colors, there''s little additional
    visual sophistication (no distinctive typography treatment, no stronger focal
    emphasis on the principal-stress result vs. the supporting geometry).'
  - The diagram carries twelve+ small annotation labels at fontSize 14-16 CSS px;
    on a 2400x2400 canvas this reads fine at desktop size, but risks becoming hard
    to read once scaled down to a ~400px mobile width. Consider bumping the annotation
    fontSize by 1-2pt or trimming redundant text.
  - Landmark markers (8-9px radius) are on the small side for a canvas this large
    with fewer than 10 data points — the data-density heuristic calls for more prominent
    markers with sparse data like this; size them up slightly for extra visual weight.
  - The grid (ChartsGrid horizontal + vertical) reads a bit more prominent than 'very
    subtle' — consider lowering its opacity or dropping the vertical gridlines so
    it competes less with the labeled points.
  - The custom arc callout ('2θp') and the tiny 'C' label sit close to the crossing
    reference lines and dashed diameter — not an overlap violation today, but tight
    enough that minor future changes could cause a collision; a touch more clearance
    would make the layout more robust.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "mohr-circle · javascript · muix · anyplot.ai" is centered at the top in dark ink, clearly legible. Axis labels "Normal Stress σ (MPa)" (x) and "Shear Stress τ (MPa)" (y) are dark, readable, and similarly sized. Tick labels along both axes (-20..120 on x, -70..70 on y) are dark gray and legible. A light gray grid (horizontal + vertical) is visible but subtle, plus a solid horizontal reference line through tau=0 and a vertical reference line through the circle's center.
      Data: The circle itself is rendered in brand green (#009E73), a true circle (equal aspect ratio confirmed — it isn't stretched into an ellipse). Landmark points (center C, sigma1, sigma2, tau_max, tau_min) are solid dark markers with a light outline; the two stress-state points A(80,30) and B(20,-30) are rendered in lavender (Imprint palette position 2), connected by a dashed diameter line, with a small arc and "2θp = 45°" label showing the principal-plane angle. All labels sit near their respective points without overlapping other text or the circle.
      Legibility verdict: PASS — all text and data elements are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light/white ink and remain fully legible. Grid lines and reference lines are light gray, subtle against the dark background — no bold or distracting lines.
      Data: The circle is still rendered in the identical brand green (#009E73) as the light render — confirmed unchanged. The lavender state points A/B are also unchanged from light. The landmark markers (C, sigma1, sigma2, tau_max, tau_min) correctly flip to a light fill with a dark-background-colored stroke, so they read cleanly against the dark surface instead of disappearing. Annotation text ("σ₁ = 92.4 MPa", "2θp = 45°", etc.) is light-colored and easy to read.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome and annotation text is clearly visible against the dark background.
