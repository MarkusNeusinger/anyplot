review:
  strengths:
  - 'Correct Mohr''s circle math computed from the three inputs: center C(50, 0),
    R = 42.4 MPa, σ1 = 92.4, σ2 = 7.6, τmax = ±42.4, 2θp = 45°, all derived in code,
    not placed by hand'
  - 'True equal aspect ratio: the axis ranges are identical (±1.68R around the center)
    and the plot area is sized as an exact square through computed margins, so the
    circle is round in both renders'
  - 'Idiomatic MUI X composition: ChartsContainer with ChartsGrid, ChartsReferenceLine
    through the center, ChartsXAxis/ChartsYAxis and a custom SVG layer positioned
    in data space through the useXScale/useYScale hooks'
  - 'Clear visual hierarchy: the circle in brand green with a 7 % tint, the input
    stress points A/B in lavender against ink-colored derived landmarks (σ1, σ2, ±τmax),
    bold landmark labels against softer inkSoft labels for C and 2θp'
  - Theme tokens are threaded through every element (ink, inkSoft, grid, pageBg outlines
    on markers), so both renders are fully legible with identical data colors
  - The 2θp arc spans exactly from the principal stress axis to the A–B diameter,
    and A and B sit at opposite ends of a dashed diameter through the center
  weaknesses:
  - 'VQ-01 (both): tick labels at 14 px in inkSoft and axis titles at 16 px regular
    weight become unreadable in the 400 px thumbnail (about 4 px tall) while the 17
    px bold annotations still read → tick labels about 16 px (+2 px) and axis titles
    about 18 px (+2 px). Likely cause: tickLabelStyle fontSize: 14 and labelStyle
    fontSize: 16 on both axes.'
  - 'DQ-02 (code): the stress state σx = 80, σy = 20, τxy = 30 MPa is a round textbook
    triple with no component or loading case behind it, so the plot reads as a generic
    exercise → a stress state taken from a named component (for example a point on
    a steel drive shaft under combined bending and torsion), named in the optional
    descriptive title prefix. Likely cause: the data block values and the bare title.'
  - 'Suggestion: write τ_max with a subscript (τₘₐₓ) like σ₁/σ₂, and use the true
    minus sign (−) in B(20, −30) and −42.4 so the annotations match the tick labels.'
  - 'Suggestion: draw the 2θp arc with a single SVG arc command (path ''A'') instead
    of a 32-step polyline loop.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
      Chrome: centered bold title "mohr-circle · javascript · muix · anyplot.ai" (~43 % of width); x-axis "Normal Stress σ (MPa)" from −20 to 120, y-axis "Shear Stress τ (MPa)" from −70 to 70, ticks every 10 MPa; subtle grid both directions; grid-colored reference lines through τ = 0 and σ = 50. All text dark and readable.
      Data: brand green #009E73 circle (3.5 px stroke, 7 % fill) centered at C(50, 0) with R = 42.4; heavy ink diameter σ2–σ1 on the horizontal axis with ink markers at σ2 = 7.6 and σ1 = 92.4, ink markers at τmax = 42.4 (top) and −τmax = −42.4 (bottom), each labeled in bold; lavender #C475FD points A(80, 30) and B(20, −30) joined by a dashed diameter through the center; a soft arc from the σ axis to the A line labeled "2θp = 45°"; small "C(50, 0)" label. Circle is a true circle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, grid and reference lines subtle light grey; no dark-on-dark text.
      Data: identical green circle and lavender A/B points; landmark markers, the σ2–σ1 diameter and the dashed A–B line flip to light ink as theme tokens; arc and C/2θp labels in light inkSoft. Data colors identical to the light render.
      Legibility verdict: PASS
