review:
  strengths:
  - All Mohr's-circle values fall out of the computation (centre 30, R 64.03, σ1 94.0,
    σ2 −34.0, 2θp 38.7°) and match the axes; the 2θp arc spans exactly the angle from
    the σ-axis to line CA
  - Each annotation is colored like its marker and each element type has its own fillable
    shape (21/23/24/25), so the diagram reads without a legend
  - 'Every label sits on the outward side of its point: σ1 right, σ2 left, τmax above,
    τmin below, A outside the circle'
  - coord_fixed(1) with explicit limits and expand = FALSE gives a true circle; the
    L-shaped axis.line frame follows the style guide
  - 'Theme tokens threaded through all chrome: both renders fully legible, categorical
    colors identical'
  weaknesses:
  - 'VQ-02 (both): the circle stroke cuts through the ''('' of the ''B  (σy=-20)''
    label, about 0 px clearance → move the label clear of the stroke by at least a
    few px, for example below and left of B with hjust = 1, or further below. Likely
    cause: annotate(''text'', x = sigma_y + 3, y = -tau_xy - 6, hjust = 0).'
  - 'CQ-04 (code): sub1 and sub2 (lines 63–64) are defined and never used, and the
    comment above them claims unicode escapes the code does not use → delete both
    variables and the comment. Likely cause: leftovers from an abandoned subscript
    approach.'
  - 'Suggestion: the x limits run to 136 MPa, well past the σ1 label; a tighter upper
    limit (about 125) would let the circle grow on the square canvas.'
  - 'Suggestion: true subscripts (σ₁, σ₂, 2θₚ, τ_xy for A) would read more like an
    engineering diagram.'
