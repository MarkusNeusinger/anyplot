review:
  strengths:
  - All Mohr's-circle values fall out of the computation (centre 30, R 64.03, σ1 94.0,
    σ2 −34.0, 2θp 38.7°) and match the axes
  - Each annotation is colored like its marker, and each element type has its own
    fillable shape (21/23/24/25), so the diagram reads without a legend
  - Square canvas with coord_fixed(1) gives a true circle that fills the frame
  - 'Theme tokens threaded through all chrome: both renders fully legible, categorical
    colors identical'
  - The A label now sits inside the circle clear of the stroke, and the 2θp label
    matches the other annotations in size
  weaknesses:
  - 'VQ-02 (both): the σ1 and σ2 labels sit centred on the circle''s intersection
    points, so the 1.5-wide green circle stroke runs through their ''='' characters
    → place each label fully outside the circle (σ1 left-justified to the right of
    σ1, σ2 right-justified to the left of σ2), clear of the stroke by at least a few
    px. Likely cause: annotate(''text'', x = sigma_1 / sigma_2, hjust = 0.5).'
  - 'SC-02 (both): only the top τmax point is labelled; the bottom τmin = −64 triangle
    carries no label although C2 asks for each to be labeled at its true position
    → add a ''−τmax=−64'' label beside the bottom triangle. Likely cause: a single
    annotate(''text'') for label_tmax.'
  - 'DE-02 (both): a full four-sided panel box frames the plot where the style guide
    asks for an L-shaped frame or none → panel.border = element_blank() with axis.line
    on left and bottom, or no frame. Likely cause: panel.border = element_rect(color
    = INK_SOFT).'
  - 'Suggestion: use plotmath or true subscripts (σ₁, σ₂, θₚ) instead of ''σ1'', ''σ2'',
    ''2θp'' for engineering typography.'
  - 'Suggestion: a ''C'' label on the open centre marker would name the circle''s
    centre (σavg = 30).'
