    between light and dark
  - alt.selection_point on pointerover with alt.condition and typed tooltips give
    real hover inspection in the HTML
  weaknesses:
  - 'VQ-01 (dark): the ''2θp = 26.6°'' angle label in #4467A3 bold 11 pt reads faint
    against the #1A1A17 background (about 3:1 contrast) → keep the arc blue but draw
    the label in INK, or a lighter label tone in the dark theme. Likely cause: angle_lbl
    mark_text color=BLUE in both themes.'
  - 'VQ-02 (both): the ''C (20, 0)'' center label is crossed by the dashed vertical
    reference line through the center → align it left of or right of the line (align=''left''
    with a small dx) so the rule does not run through the text. Likely cause: center_lbl
    mark_text centered at x=center with dy=18 only.'
  - 'Suggestion: the hand-tuned VIEW_ASPECT = 0.947 keeps the circle round only for
    this layout; deriving the shear domain from the view''s actual width and height
    would keep it round if titles or tick widths change.'
  - 'Suggestion: a slightly heavier weight or size on the σ₁ / σ₂ labels would put
    the principal stresses first in the label hierarchy.'
