review:
  strengths:
  - 'All Notes elements present and correctly computed: σ1 = 99.3, σ2 = −49.3, τmax
    = 74.3, 2θp = 42.3° with the arc ending exactly on the A–B diameter'
  - coord_fixed keeps a true circle, and the one-panel gggrid wrap paints the whole
    square canvas in the page color in both themes
  - Mapped color + shape through scale_color_manual/scale_shape_manual produce one
    merged legend with redundant shape encoding
  - layer_tooltips() gives label and detail lines on hover in the HTML output
  - Theme tokens threaded through every chrome element; all text readable in both
    renders
  weaknesses:
  - 'SC-03 (both): the axes run to about ±118 MPa while the circle spans ±74 MPa,
    leaving roughly a third of the panel height empty above and below the circle →
    limits a little outside ±τmax (about −35 MPa per side). Likely cause: pad = radius
    * 0.45 on the reference lines (line 128) sets the axis range.'
  - 'VQ-05 (both): empty bands of about 280 px above the title and below the x-axis
    title, and a legend frame about twice as wide as its entries that reaches within
    ~30 px of the right canvas edge → let the drawing use the height and size the
    legend frame to its content. Likely cause: the reference-line padding plus the
    legend at the right narrowing the coord_fixed panel.'
  - 'VQ-07 (both): the first legend series ''Input Point'' is #AE3030 although nothing
    in the label implies red → #009E73 on the first unordered series (or order the
    legend so Principal Stress comes first). Likely cause: scale_color_manual mapping
    and the data order of df_legend_points (line 115).'
  - 'VQ-03 (both): the principal-stress diamonds render at about half the size of
    the input circles and shear triangles, so the key results are the smallest marks,
    also in the legend → match their visual size (about +3 size units). Likely cause:
    shape 18 at the shared size=7.'
  - 'VQ-01 (both): legend text has no explicit size and inherits the library default,
    larger than the 10 px tick labels → legend_text=element_text(size=10). Likely
    cause: legend_text=element_text(color=INK_SOFT) without size (line 286).'
  - 'DQ-03 (both): the bottom label reads ''−τmax = 74.3'', which states τmax = −74.3
    → ''−τmax = −74.3'' or ''τmin = −74.3''. Likely cause: the label f-string on line
    109 prints tau_max unsigned.'
  - 'DE-02 (both): the panel is framed on all four sides by a dark border → left and
    bottom axis lines only, per the style guide''s spine rule. Likely cause: axis_line
    on theme_minimal plus the panel border; set panel_border=element_blank().'
  - 'Suggestion: the seven near-identical geom_text layers (lines 178–260) could share
    one layer with precomputed label positions in a DataFrame.'
