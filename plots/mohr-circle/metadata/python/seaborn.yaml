review:
  strengths:
  - 'Every Notes feature is present and computed rather than placed: circle centred
    at C(10, 0) with R = 69.5 MPa, σ1 = 79.5 and σ2 = -59.5 MPa on the horizontal
    axis, τmax squares at the top and bottom, A(70, 35) and B(-50, -35) at the ends
    of a dashed diameter, and a 2θp arc spanning exactly 0° to 30.3° from the centre'
  - 'Graduated annotation hierarchy: boxed bold principal-stress labels as the focal
    values, bold colour-matched labels for A, B and τmax, and quiet INK_SOFT tertiary
    text for the centre label and the monospace input-state box'
  - Legend placed below the axes in three columns, clear of the circle, with glyphs
    that match the data marks in both themes
  - 'Idiomatic seaborn: sns.set_theme with a theme-token rc dictionary, and a tidy
    key-points table drawn by one sns.scatterplot with hue and style mapped to the
    element type through explicit palette and marker dictionaries'
  - Equal aspect ratio with symmetric limits derived from the radius, so the circle
    is a true circle on the square 2400×2400 canvas
  weaknesses:
  - 'Suggestion: the σ₂ label box sits on the dashed A–B diameter near its upper-left
    corner; placing it slightly lower would leave the diameter fully visible.'
  - 'Suggestion: seaborn''s own contribution stays at the scatter semantics; the circle,
    arc and annotations are matplotlib-level, which is inherent to this plot type.'
