review:
  strengths:
  - 'True circle: the x span is scaled to pygal''s plot-area aspect so one MPa spans
    the same pixels on both axes (C1)'
  - All stress values computed from the three inputs; center 50, R 67.1, σ1 117.1,
    σ2 −17.1, 2θp 26.6° check out
  - Grid lines themed from INK_MUTED, so they stay visible on the dark page
  - Reference lines drawn as one dashed series with a None break via allow_interruptions,
    in the neutral INK_MUTED tone
  - Per-point dict labels give descriptive HTML tooltips for A, B, σ1, σ2 and τmax
  weaknesses:
  - 'VQ-03 (dark): the 2θp arc renders about 3–4 px wide in #AE3030 and reads faint
    on the #1A1A17 page, though the code asks for width 12 → a visibly thicker stroke
    (about 8–12 px). Likely cause: the per-series stroke_style width on the arc series
    is not taking effect at the rendered scale.'
  - 'SC-02 (both): σ1, σ2, τmax, A, B and the 2θp value are named only in the bottom
    legend, with σ1/σ2 and both τmax dots sharing one legend entry each, so no mark
    is labeled at its true position and 2θp is not annotated at the center (C2, C4)
    → a label at each mark and the angle value beside the arc. Likely cause: print_values=False
    and no per-point label display.'
  - 'Suggestion: a slightly heavier circle stroke would make the circle dominate the
    grid more clearly.'
