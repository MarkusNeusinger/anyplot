review:
  strengths:
  - 'All Notes elements present and mathematically correct: σ1 = −20, σ2 = −140, ±τmax
    = 60, A(−120, 45) and B(−40, −45) at opposite ends of a diameter, 2θp = 131.6°
    with an arc spanning exactly that angle'
  - coord_fixed with limits derived from the center and radius keeps the circle true
    and the view centered for any stress state
  - Theme tokens thread through every chrome element; both renders readable, Imprint
    colors identical across themes, palette in canonical order
  - True minus signs and side-aware label alignment keep the value labels clean and
    clear of the markers
  - Translucent σ2–σ1 band on the σ axis gives the principal-stress span a focal point
  weaknesses:
  - 'VQ-01 (both): the six point labels and the 2θp label are drawn at about 5 pt
    (geom_text size 5.0 / 4.8) and read small beside the 8 pt tick labels → about
    8 pt, the tick-label reference (+3 pt). Likely cause: geom_text size=5.0 and size=4.8.'
  - 'VQ-02 (both): the last legend label ''Max Shear'' runs into the right edge of
    the legend frame with no padding, and the keys sit on page-shade tiles inside
    the elevated legend box → text clear of the frame by a few px, keys on the legend''s
    fill. Likely cause: legend_key not set to element_rect(fill=ELEVATED_BG, color="none")
    and no legend box margin.'
  - 'DQ-02 (code): the data comment calls the state a retaining wall panel, but −120
    MPa is beyond the roughly 30–50 MPa compressive strength of structural concrete
    → frame it as a steel member under compression (for example a column flange).
    Likely cause: the scenario comment in the Data block.'
  - 'Suggestion: label the center point C with its σ value so the circle''s center
    reads off directly.'
