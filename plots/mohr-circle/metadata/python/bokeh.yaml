review:
  strengths:
  - 'Correct Mohr''s circle with every required element: center (25, 0), R = 68.0,
    σ₁/σ₂ on the axis, τ_max top and bottom, A and B on a diameter, and a 2θp arc
    at the center spanning exactly 36°'
  - Distinct marker shapes per role (diamond, triangle, circle) with direct colored
    value labels, so no legend is needed
  - 'Idiomatic bokeh: ColumnDataSource per marker group, HoverTool bound to those
    renderers for stress readouts in the HTML, Span reference lines, match_aspect
    for a true circle'
  - Theme chrome threads through every element; both renders readable
  weaknesses:
  - 'VQ-02 (both): the circle''s stroke runs through the σ₂ = -43.0 MPa and σ₁ = 93.0
    MPa labels, which are centered on the axis crossings at x = σ₂ and x = σ₁ → anchor
    σ₂''s label right-aligned left of the circle and σ₁''s left-aligned right of it
    so no stroke crosses the text. Likely cause: Label(x=sigma_1/sigma_2, text_align=''center'').'
  - 'VQ-03 (both): the principal-stress diamonds and τ_max triangles at size=26 read
    small for six sparse key points and sit half under the 5 px circle stroke → about
    40 px (+14 px). Likely cause: scatter size=26.'
  - 'VQ-05 (both): padding = 0.6·R leaves the circle at about 63 % of the plot extent
    with wide empty bands on all four sides → about 0.3·R so the circle fills roughly
    75–80 %. Likely cause: padding = radius * 0.6 in x_range/y_range.'
  - 'VQ-07 (both): matte red #AE3030, the bad/loss anchor, colors the principal stresses
    σ₁/σ₂ and the 2θp arc although they carry no bad/loss meaning, skipping position
    4 → ochre #BD8233 (IMPRINT_PALETTE[3]). Likely cause: COLOR_PRINCIPAL = IMPRINT_PALETTE[4].'
  - 'Suggestion: the τ_max triangles could point outward (inverted at the bottom)
    to echo top/bottom of the circle.'
