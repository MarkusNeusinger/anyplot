  strengths:
  - Three-tier semantic color roles (green geometry, red inputs, blue derived values)
    with matching marker shapes (circles vs. diamonds) give a clear reading order
  - Page-colored patheffects.withStroke halos keep every annotation legible over the
    circle, grid and fill in both themes
