    with an arrowhead showing the rotation sense
  - All circle parameters derived from the three input stresses; values verified (C=20,
    R=67.1, σ₁=87.1, σ₂=-47.1 MPa)
  weaknesses:
  - 'VQ-02 (both): leader and reference lines run through label text — the A-B diameter
    crosses ''C (20, 0)'', the dashed center line at σ=20 crosses ''67.1'' in both
    τ_max labels, and the circle outline shows through the alpha-0.7 σ₁ callout box
    → place each label in clear space off the lines (C label above-left of the center,
    τ_max labels fully to one side of the center line, σ₁ box below the circle or
    opaque). Likely cause: xytext offsets (center - 8, -14), (center - 38, tau_max
    ± 12) and the σ₁ bbox alpha=0.7.'
  - 'VQ-07 (both): the second color role (stress points A, B) skips to Imprint position
    5, matte red #AE3030, although ''applied stress'' carries no shared red association;
    positions 2 and 4 stay unused → use canonical order for the three roles (#009E73,
    #C475FD, #4467A3). Likely cause: CLR_INPUT = IMPRINT_PALETTE[4].'
  - 'Suggestion: render τ_max and 2θp with mathtext subscripts ($\tau_{max}$, $2\theta_p$)
    instead of a literal underscore.'
  - 'Suggestion: the −τ_max leader arrow is a short stub hidden under its diamond;
    a slightly longer leader would read better.'
