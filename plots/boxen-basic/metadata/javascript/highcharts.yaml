review:
  strengths:
  - Creative, correct use of stacked floating columns (transparent base + colored
    bar per stack) to render a letter-value/boxen plot using only the core Highcharts
    bundle — no highcharts-more/boxplot module needed.
  - 'Theme-adaptive chrome is fully correct and verified consistent: data colors identical
    between light/dark, only chrome (background, text, median marker fill/border)
    flips.'
  - Legend clearly documents all five quantile depth levels plus outliers and median,
    satisfying the spec's legend requirement.
  - Deterministic LCG-seeded Box-Muller data generation — fully reproducible.
  weaknesses:
  - Outermost letter-value band (64ths, opacity 0.34) has low contrast and is hard
    to distinguish from the background, especially in the light render — consider
    raising the opacity floor to ~0.4-0.45 for the lightest band.
  - Sample size (n=2,000/endpoint) sits at the low end of the spec's 1,000-100,000+
    range — a larger n would show a fuller, smoother tail shape.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "boxen-basic · javascript · highcharts · anyplot.ai" in bold dark ink, fully readable. Subtitle "Simulated request latency · n = 2,000 per endpoint" in softer gray, readable. Axis titles "Response Time (ms)" and "Endpoint" both descriptive with units. Legend at bottom lists all five quantile levels plus Outliers and Median, all readable.
      Data: Four endpoint categories (Auth, Search, Checkout, Recommend), each showing a tapering nested-box "wedding cake" stack in Imprint green (#009E73) with decreasing opacity for deeper quantile levels. Black diamond marks the median per category. Gray dots mark outliers beyond the deepest letter value.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis titles/legend, now rendered in light ink against the dark background — all clearly legible, no dark-on-dark issues.
      Data: Green box colors are visually identical to the light render (confirmed only chrome flips, not data colors). Median diamond correctly flips fill to white with a dark border for contrast on this surface. Outlier dots remain legible gray.
      Legibility verdict: PASS
