review:
  strengths:
  - Statistically accurate letter-value computation (legend coverage percentages match
    the actual pLow/pHigh quantile math exactly)
  - 'Pixel-verified theme-correct chrome: light background #FAF8F1, dark background
    #1A1A17, identical data colors across both renders'
  - Dynamic title auto-fit via getComputedTextLength() avoids both clipping and cramped
    sizing for the long mandated title string
  - '"Widest spread ▲" callout plus a bolder median line gives the plot a clear, immediate
    focal point without simulating fake interactivity'
  weaknesses:
  - Helper functions (letterValueDepth, letterValueStats, randNormal) push the script
    away from a flat KISS structure -- could be inlined or simplified, though the
    math genuinely needs them
  - All four service distributions share the same log-normal shape (varying only in
    scale/spread); a differently-shaped distribution for one group would demonstrate
    more of the letter-value plot's diagnostic power
  - Nested boxes are drawn with a manual .append() loop per level rather than a .data(levels).join("rect")
    pattern -- functionally fine but slightly less idiomatic D3
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured pixel-exact at #FAF8F1 -- matches spec.
      Chrome: Title "API Latency by Service · boxen-basic · javascript · d3 · anyplot.ai" in dark ink, auto-fit to width; axis labels "Response Time (ms)" and "Service Endpoint" both descriptive with units/context; tick labels and two-part legend (service colors + letter-value depth coverage) all clearly readable in dark text against the light background.
      Data: Four boxen groups (Auth API green #009E73, Search API lavender, Payment API blue, Notify API ochre) -- canonical Imprint order, first series is brand green. Nested translucent boxes narrow and lighten with quantile depth; outlier dots and a dark median line per group; a "Widest spread ▲" callout above Search API.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, measured pixel-exact at #1A1A17 -- matches spec.
      Chrome: Title, axis labels, tick labels, and legend all render in light ink and are fully legible; median lines switch to white for contrast; gridlines remain subtle but visible. No dark-on-dark failures found.
      Data: Confirmed identical to light render -- same green/lavender/blue/ochre hues and box structure, only chrome (background, text, grid) flips.
      Legibility verdict: PASS
