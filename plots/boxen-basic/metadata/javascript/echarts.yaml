review:
  strengths:
  - Correct letter-value (boxen) statistics computed via the standard depth-halving
    recursion, producing 4 clean nested quantile levels (quartiles through 32nds)
    that narrow toward the tails exactly as the spec requires.
  - 'Genuine ECharts mastery: since ECharts has no native boxenplot series, the implementation
    builds the nested boxes, median bar, and jittered outliers from scratch with three
    `custom` series and `renderItem` (api.coord/api.size/api.style) — idiomatic use
    of the library''s extensibility rather than a workaround.'
  - 'Deterministic, realistic data: seeded LCG + Box-Muller generates right-skewed
    (log-normal) API response times across 4 endpoints, matching the domain plausibly,
    with reproducible output.'
  - 'Theme handling is correct in both renders: identical Imprint green hue and box
    geometry between light/dark, only chrome (background, ink, grid, muted outlier
    color) flips; no clipping, overlap, or dark-on-dark/light-on-light failures.'
  - Overplotting is handled well — outlier alpha (0.6) plus small radius keeps ~hundreds
    of jittered points per category legible instead of turning into a solid smear.
  weaknesses:
  - Legend text (13px) is slightly smaller than the axis tick/label text (14-15px),
    a minor type-hierarchy inversion — bump legend textStyle.fontSize to 14 for consistency.
  - Title occupies only ~30% of the plot width at fontSize 22, well under the typical
    50-70% band for the mandated title string — a slightly larger title fontsize (e.g.
    26-28) would balance the composition better (not a hard requirement, purely polish).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "boxen-basic · javascript · echarts · anyplot.ai" in bold dark ink, centered and fully visible. Legend row below title lists the 4 quantile levels (graduated green swatches), Median (black), Outliers (gray) — all text crisp and dark against the light surface. X-axis category labels ("/api/search", "/api/checkout", "/api/orders", "/api/users") and Y-axis label "Response time (ms)" with numeric ticks (0-600) are all dark, legible text. Horizontal gridlines are faint but visible; x-axis has no vertical gridlines/ticks (clean minimal-chrome style).
      Data: Four categories, each showing a nested "onion" of green rectangles (all the same #009E73 hue at 1.0/0.75/0.55/0.4 opacity) narrowing toward the tails, a black median bar through the center of each stack, and a jittered swarm of gray outlier dots above/below the boxes. First (and only) data hue is the Imprint brand green as required.
      Legibility verdict: PASS — no overlapping or clipped text, all labels readable at full size.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in white/light ink, fully visible and centered. Legend text is light gray, still clearly legible against the dark surface. Axis labels and tick labels are light gray and readable; gridlines are faint but visible. No dark-on-dark or light-on-light failures anywhere.
      Data: The four green nested-box stacks are pixel-identical in color and geometry to the light render (same #009E73 hue, same opacity ladder) — confirming data colors held constant across themes. The median bar switches from black to white (an ink/chrome token, not a palette color) to stay visible on the dark surface, and outlier dots use a lighter muted gray for the same reason — both are legitimate chrome-adaptive accents, not violations of the "data colors stay fixed" rule since they aren't categorical series colors.
      Legibility verdict: PASS — all text and data marks remain clearly readable, no theme-adaptation failures observed.
