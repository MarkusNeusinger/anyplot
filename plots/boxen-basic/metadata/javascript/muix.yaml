review:
  strengths:
  - Correct letter-value depth recursion (Hofmann et al.) yields five nested levels
    per endpoint, with box edges at their quantiles and outliers beyond the deepest
    level drawn at their values
  - 'Idiomatic MUI X composition: ChartsContainer with ChartsGrid and the axis components,
    plus a custom BoxenLayer driven by useXScale/useYScale on a band and a log scale'
  - Level shades are computed as blends of the category color toward the page color,
    so the quantile ramp reads correctly in both themes while the Imprint strokes
    stay identical
  - The median line has a page-colored halo, so it stays distinct on the darkest inner
    box in both renders
  - The log value axis and the endpoint order by rising median make the right-skewed
    latency comparison easy to read
  - The header legend names each level with its coverage (50% to 96.9%) plus the median
    and outlier glyphs
  weaknesses:
  - 'Suggestion: the level legend uses only the green ramp; a short note that each
    endpoint shades its own color the same way would make the mapping explicit for
    the other three colors'
  - 'Suggestion: a tooltip on the boxes (level name, bounds, n) would add HTML value
    through MUI X''s tooltip slot'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "API Response Times · boxen-basic · javascript · muix · anyplot.ai", a gray subtitle "6,000 observations · 4 groups (Service endpoint) · 5 letter-value levels", and an inline legend row (Median, Fourths 50%, Eighths 75%, Sixteenths 87.5%, 32nds 93.8%, 64ths 96.9%, Outliers). Log y axis "Response time (ms)" with ticks from 20 to 1k; x axis "Service endpoint" with /api/search, /api/profile, /api/checkout, /api/upload. Faint dashed horizontal grid. All text is dark and readable.
      Data: four letter-value stacks of five nested boxes each, narrowing outward, in green #009E73, purple, blue and amber, each shaded from saturated (fourths) to pale (64ths) and outlined in the category color. The dark median line has a halo. Hollow outlier circles sit above and below each stack. Medians are about 45, 65, 120 and 260 ms.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, tick labels and axis titles render in light ink; no dark-on-dark text. Grid is subtle but visible.
      Data: the same outline colors as the light render; the level shades blend toward the dark page, so the inner boxes are saturated and the outer levels darker, each still outlined. The median line is light ink with a dark halo. The outlier circles are identical in color.
      Legibility verdict: PASS
