review:
  strengths:
  - Quantile levels are filled with discrete steps of imprint_seq (green to blue),
    in level order, and the legend 'Quantile level' names each level with its tail
    probabilities, so the nested boxes read without a key outside the chart
  - Page-colored outlines (color = PAGE_BG) separate the nested letter-value boxes
    cleanly in both themes, and the median segment flips INK so it stays the strongest
    mark on the blue quartile box
  - 'The code follows the adaptable zones: column constants with !!COL := in the tibble,
    .data[[...]] in every aes, axis titles taken from the constants, and theme tokens
    threaded through every chrome element'
  - Letter values are computed with dplyr group_by() + reframe() over a single LEVELS
    table, so depth, widths and legend labels all come from one definition
  weaknesses:
  - 'SC-02 (both): the boxes stop at the sixteenths although each endpoint has 3,000
    observations, so about 12.5 % of every sample (≈375 points per endpoint) is drawn
    as ''outliers'' in solid columns instead of further letter-value boxes out into
    the tails (C1: ''sixteenths and so on out into the tails'') → continue the levels
    to about log2(n) − 3 ≈ 8 (thirty-seconds, sixty-fourths, …) so the outlier points
    are only the few observations beyond the deepest letter value. Likely cause: LEVELS
    hard-codes three p_low values (0.0625, 0.125, 0.25) instead of deriving the depth
    from the group size.'
  - 'Suggestion: order the endpoints by median so the eye reads from the fastest to
    the slowest response times.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: bold title "boxen-basic · r · ggplot2 · anyplot.ai" top left (~50 % of the width); y-axis "Response time (ms)", x-axis "Server endpoint", ticks 0-600 and three endpoint names in INK_SOFT; subtle horizontal grid only; L-shaped axis lines; legend "Quantile level" on the right on an elevated #FFFDF6 panel. All text dark and readable.
      Data: three endpoints (API Search, API Users, API Reports), each a stack of three nested boxes - Quartiles (blue #4467A3, widest), Eighths (teal mid-step), Sixteenths (green #009E73, narrowest) - separated by page-colored outlines, with a near-black median bar. Hollow grey circles beyond the sixteenths form dense columns (API Reports up to ~750 ms, API Search up to ~340 ms, API Users a short stub around 120 ms and 40 ms).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink (#F0EFE8 / #B8B7B0); grid subtle; legend on #242420 with light text. No dark-on-dark text.
      Data: box fills identical to the light render (green, teal, blue steps); the median bar flips to near-white and stays visible on the blue box; outlier circles light grey.
      Legibility verdict: PASS
