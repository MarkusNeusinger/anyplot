review:
  strengths:
  - Implements the real Tukey letter-value math (letter_value_depth, letter_values
    via quantile()) rather than approximating a boxen plot with a stock boxplot primitive
  - Sample sizes are varied per endpoint (1.5k-25k), which genuinely drives different
    letter-value depths (4-8 levels) across categories, visually demonstrating the
    depth-scales-with-n property the spec calls for
  - 'Correct Imprint palette usage: brand green as the first series, canonical multi-series
    order, theme-correct FAF8F1/1A1A17 backgrounds identical data colors across both
    renders'
  - 'Clean chrome: top/right spines removed, single subtle horizontal grid, median
    line drawn across the fourths box, well-jittered low-alpha outlier scatter beyond
    the deepest letter value'
  - Caption below the plot explains the letter-value technique in plain language for
    viewers unfamiliar with the method
  weaknesses:
  - The 'Quantile Depth' legend always samples the green ramp (weighted_color_mean
    against IMPRINT_PALETTE[1], the API Gateway color) regardless of which series
    it is meant to explain, so for Auth Service (purple), Payment Service (blue),
    and Search Service (ochre) the legend swatches don't match the hue those boxes
    actually shade toward. A viewer can't map a legend swatch directly onto three
    of the four series without inferring the shade-not-hue convention themselves.
    Either build a small per-series depth key or add an explicit caption clause stating
    the ramp is shown in a reference hue and depth is conveyed by shade only.
  - In the densest categories (Auth Service, Payment Service at 8k-12k points), the
    outlier scatter at markersize=5/alpha=0.35 reads as a blurred vertical streak
    rather than discrete points — slightly more horizontal jitter spread or a lower
    alpha would separate them further.
  - letter_value_depth and letter_values are standalone helper functions, which pushes
    past the strict KISS/no-functions convention; justified here by the nontrivial
    Tukey letter-value math Makie doesn't provide natively, but worth a passing note.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "boxen-basic · julia · makie · anyplot.ai" in bold dark ink at top center; axis titles "Endpoint" (x) and "Response Time (ms)" (y) in dark ink; tick labels in a softer grey-ink; single horizontal grid at alpha ~0.15; top/right spines removed, left/bottom spines in soft ink. Legend "Quantile Depth" at right lists Fourths through 512ths with green swatches darkening toward the deepest level. Caption sentence below the plot in soft ink.
      Data: Four endpoints (API Gateway, Auth Service, Payment Service, Search Service) each rendered as tapering nested boxen (widest = fourths, narrowest = deepest letter value), first series (API Gateway) is anyplot brand green #009E73, followed by lavender/purple, blue, and ochre in canonical Imprint order. A black median line crosses each fourths box. Faint jittered outlier dots extend above/below the deepest box, tinted to match each series color at low alpha.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same layout as the light render with all ink flipped to light tones — title and axis labels in near-white, tick labels in a lighter soft-grey, grid line still faint but visible against the dark surface, spines in the same soft tone. Legend and caption text both rendered in light ink, fully legible.
      Data: Identical box positions, tapering, and outlier scatter as the light render. Series colors are pixel-identical to the light render (green, lavender, blue, ochre) — only the chrome (background/ink/grid) flipped, confirming correct theme-adaptive implementation. Median line switches to a light stroke so it still reads against the now-colored boxes.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis labels, ticks, legend, caption) is clearly visible against the near-black background.
