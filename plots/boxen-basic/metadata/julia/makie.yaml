review:
  strengths:
  - Correctly implements the letter-value/boxen algorithm from scratch (poly! rects)
    since Makie has no native boxenplot! — respects the library's no-workaround rule
    instead of faking it with boxplot!
  - Depth-scaled shading via weighted_color_mean (full brand color at the fourths,
    fading toward the page background at the deepest level) gives a genuine, readable
    visual encoding of quantile depth
  - Outliers beyond the deepest letter value are drawn as small, semi-transparent
    jittered points, exactly as the spec requires, and stay visually subordinate to
    the boxes
  - Both renders are pixel-correct 3200x1800, theme chrome (background/ink/grid/spines)
    flips correctly while all four categorical data colors stay identical between
    light and dark
  - Median line, tapering box widths, and the descriptive caption together build a
    clear visual hierarchy that tells the distribution-shape story at a glance
  weaknesses:
  - Spec explicitly asks for 'a legend explaining quantile levels' — the implementation
    only has a text caption below the plot, with no visual key mapping shade depth
    to letter-value level (e.g. a small swatch strip from darkest=fourths to lightest=deepest
    with level labels). Add a compact legend/colorbar-style key.
  - letter_value_depth(n) collapses to k=8 for every category here (n ranges 3000-6000,
    all clamp to the 4-8 ceiling) — the 'depth scales with sample size' claim in the
    code comment isn't actually visible in this dataset; consider widening the sample-size
    range or the depth formula so the scaling is demonstrable, or adjust the comment.
  - Two small helper functions (letter_value_depth, letter_values) are defined for
    what's otherwise a flat script — justified by the quantile math, but keep an eye
    on KISS as the pattern grows.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "boxen-basic · julia · makie · anyplot.ai" in bold dark ink, clearly legible. X-axis label "Endpoint" and Y-axis label "Response Time (ms)" in dark ink, fully readable. Tick labels (endpoint names, Y-axis numbers) in a softer gray-ink tone, legible against the light background. Subtle horizontal gridlines only (no vertical grid), top/right spines removed, left/bottom spines a soft gray. Caption below the axis is small but readable dark-gray text.
      Data: Four nested "boxen" silhouettes (API Gateway, Auth Service, Payment Service, Search Service), each tapering from a wide central box (fourths) down through progressively narrower, lighter-shaded bands to the deepest letter value, then thin jittered outlier dots beyond. First series (API Gateway) is Imprint brand green #009E73; the other three use lavender, blue, and ochre — consistent with the Imprint categorical palette. A black median line crosses the widest box of each category.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels flip to a light off-white ink, tick labels flip to a softer light-gray tone — both clearly legible against the dark background. Gridlines remain subtle. Spines are a muted light-gray. Caption text is light-gray and readable.
      Data: Same four categories in the identical four hues (green, lavender, blue, ochre) as the light render — confirmed unchanged data colors, only chrome flipped. The median line switches to a light/white line so it still reads against the darker box fills.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, and tick label is clearly visible against the near-black background.
