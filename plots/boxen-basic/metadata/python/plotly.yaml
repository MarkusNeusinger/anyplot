review:
  strengths:
  - Letter values computed with np.quantile at 1/2^(k+1) so every box edge sits at
    its quantile
  - Box widths narrow with each deeper level, centered on the category, with outliers
    beyond the deepest level as points
  - Correct 3200x1800 canvas with the legend placed outside the plot area
  - Theme tokens threaded through title, ticks, axis lines, legend frame and median
    line in both renders
  - Outlier hovertemplate gives per-point values in the HTML output
  weaknesses:
  - 'VQ-03 (both): the levels are drawn as translucent rgba fills stacked on each
    other, so each visible band is darker than its legend swatch (e.g. the 87.5% band
    in light reads nearly as saturated as the IQR swatch) and the outlines of the
    narrower outer boxes drawn underneath show through as vertical lines inside the
    wider inner boxes → opaque fills, one blended step of #009E73 toward PAGE_BG per
    level, matching the legend swatches exactly. Likely cause: fillcolor=level_colors[k
    - 1] with alpha from np.linspace(1.0, 0.2) on shapes layered below each other.'
  - 'Suggestion: a slightly thinner median line overhang or a ring outline on the
    outlier points would separate them from the box edges they sit on.'
