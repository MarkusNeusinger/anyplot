review:
  strengths:
  - 'Correct letter-value construction: six nested levels from the quartiles out to
    0.78/99.22 %, each box edge computed with np.quantile at its tail share and drawn
    on a log value axis that keeps the right-skewed lower tails readable instead of
    crushing them near zero'
  - Box widths shrink by a constant 0.82 factor per level, all centered on the category,
    and page-colored box edges cut a thin gap between levels so the nesting reads
    even where adjacent ramp steps are close in hue
  - 'Quantile levels are ordered steps of imprint_seq (#009E73 → #4467A3), with the
    quartile box in brand green; data colors are identical in both renders and all
    chrome flips cleanly through the theme tokens'
  - Custom legend built from Patch and Line2D handles explains the median line, every
    quantile level with its percentile span, and the outlier marks, each glyph matching
    the mark it explains
  - 'Realistic, neutral server response-time scenario: 2000 requests per endpoint
    from exponential mixtures plus a 5 ms network floor, ordered from fast to slow
    so the medians climb from about 45 ms to about 330 ms across the chart'
  weaknesses:
  - 'Suggestion: the legend labels mix precisions ("3.12–96.88 %", "0.781–99.22 %");
    a fixed two-decimal format such as "0.78–99.22 %" would read more evenly.'
  - 'Suggestion: the middle ramp steps (12.5–87.5 %, 6.25–93.75 %, 3.12–96.88 %) are
    close teal shades; matching a swatch to a box relies mostly on the nesting order
    rather than the color.'
