review:
  strengths:
  - 'True letter-value construction: np.quantile at tail shares 1/4 … 1/128 in one
    vectorized call, with each box edge at its quantile and widths decaying 82 % per
    level, all centered on the category'
  - Ordered quantile levels take discrete imprint_seq steps from brand green (quartiles)
    to blue (deepest), identical in both themes, with page-colored separators that
    keep neighbouring levels apart
  - 'Theme tokens threaded through every chrome element: median line flips INK black/white,
    legend on the elevated surface, ticks and spines in INK_SOFT; fully readable in
    light and dark'
  - Clean proxy-artist legend (Line2D/Patch) explains the median, each quantile range
    and the outliers
  - Realistic latency scenario ordered by increasing tail weight, so the stacks rise
    as a staircase from Fast API to Report Gen
  weaknesses:
  - 'VQ-03, DQ-01 (both): on the linear 0–9000 ms axis the right-skewed data pushes
    every lower letter-value edge into the bottom ~100 ms, so the lower halves of
    all stacks collapse into hairline slivers and Fast API''s quartile box is a few-pixel
    strip hidden under its median line → make the lower boxes and the quartile box
    readable, for example with a log value axis (ax.set_yscale("log")) that spreads
    the 10–100 ms range. Likely cause: default linear y scale with ax.set_ylim(bottom=0)
    on exponential-mixture data.'
  - 'Suggestion: the legend''s range labels mix precisions ("3.12–96.88 %", "0.781–99.22
    %"); a uniform format such as one decimal would read more evenly.'
  image_description: |-
