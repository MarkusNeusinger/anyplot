review:
  strengths:
  - Letter values computed with np.quantile at depths 0.5**(i+2) and drawn with geom_rect,
    so every box edge sits at its quantile on the value axis and each deeper level
    narrows by a constant 0.85 factor around the category center
  - 'scale_y_log10 suits the right-skewed response-time data: four endpoints spanning
    about 8 ms to 1,500 ms stay readable on one axis'
  - Median segment in the INK token flips between near-black and near-white, so it
    contrasts with the green quartile box in both themes
  - Outliers beyond the deepest letter value are drawn as individual translucent INK_SOFT
    points at their values, and the quantile legend uses scale_fill_manual with explicit
    breaks in level order
  - 'All chrome is threaded through the theme tokens: page and elevated backgrounds,
    INK/INK_SOFT text, legend frame; both renders are fully legible'
  weaknesses:
  - 'VQ-07 (both): the deeper quantile levels are mixed with up to 60 % white (#B5C4DD-like
    lavender at 98.44 %), so four of the six legend steps are custom tints that lie
    off the imprint_seq ramp #009E73 → #4467A3 → use plain steps of imprint_seq (and,
    if neighbouring steps need more separation, the box outlines rather than off-ramp
    tints). Likely cause: the MAX_TINT white-mixing term in the level_colors comprehension.'
  - 'CQ-04 (code): the level colors are interpolated by parsing and re-formatting
    hex strings by hand (the start/end int(c[j:j+2], 16) parse and the "#{:02X}..."
    format, lines ~107–115), and IMPRINT_PALETTE is defined but never used → build
    the steps with matplotlib.colors (LinearSegmentedColormap.from_list("imprint_seq",
    IMPRINT_SEQ) plus to_hex) and delete the unused constant. Likely cause: hand-rolled
    color math instead of the available matplotlib.colors utilities.'
  - 'Suggestion: a legend title such as ''Central share of observations'' would make
    the 50 % … 98.44 % labels self-explanatory.'
  - 'Suggestion: a very faint horizontal grid at the log decades (1, 10, 100, 1,000
    ms) would make the box edges easier to read off the log axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800, no grid; thin INK_SOFT axis lines on left and bottom.
      Chrome: title "boxen-basic · python · letsplot · anyplot.ai" top-left in dark ink (~47 % width); y-axis "Response Time (ms)" on a log scale with ticks 10, 100, 1,000; x-axis "Server Endpoint" with API Gateway, Auth Service, Database, Cache Layer; legend "Quantile Range" at right in a #FFFDF6 framed box with six entries 50 %, 75 %, 87.5 %, 93.75 %, 96.88 %, 98.44 %. All text dark and readable.
      Data: four letter-value stacks; the widest box (50 %, the quartiles) is brand green #009E73 with a thick near-black median line; deeper levels narrow step by step and move through teal to grey-blue to pale lavender toward the tails; long upper tails, short lower tails; grey translucent outlier points above each top box and a few at the bottom. Boxes have thin dark grey outlines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend box #242420 with a light grey frame.
      Chrome: title and axis titles in near-white, tick and legend labels in light grey #B8B7B0; no dark-on-dark text anywhere.
      Data: box fills are identical to the light render (green quartile box, teal → blue → lavender deeper levels); only the median line flips to near-white and the box outlines and outlier points to light grey.
      Legibility verdict: PASS
