review:
  strengths:
  - 'Letter values are computed correctly: level i spans the 0.5^(i+2) and 1-0.5^(i+2)
    quantiles, the legend names the share each box covers (50% … 99.61%), and outliers
    are exactly the points beyond the deepest drawn level'
  - Boxes narrow by a constant 0.85 factor per level and stay centered on each category,
    and the deepest-first draw order keeps every wider inner box on top so the nested
    stack reads cleanly
  - 'Ordered quantile levels step along imprint_seq from #009E73 to #4467A3 in their
    natural order, identical in both renders, with the median mark and outlines threaded
    through the INK/INK_SOFT theme tokens'
  - Realistic server response-time scenario (4 endpoints, 2000 requests each, exponential
    tails with 5 % slow requests) that shows long right tails of different length
  - Layered lets-plot grammar (geom_rect + geom_segment + geom_point with separate
    data frames) with the HTML export keeping lets-plot's native hover tooltips
  weaknesses:
  - 'SC-02 (both): the eight quantile levels are linear steps between only two colors,
    so neighbouring levels (75 % vs 87.5 %, 93.75 % vs 96.88 % vs 98.44 %) are nearly
    the same teal and the legend cannot be matched to a box by color → adjacent levels
    clearly distinct, for example a wider lightness spread along the imprint_seq ramp
    or fewer drawn levels. Likely cause: the 8-step np.linspace interpolation between
    IMPRINT_SEQ''s two stops with MAX_LEVELS = 8.'
  - 'VQ-03 (both): the Cache Layer stack (about 8–90 ms) is compressed into a ~70
    px band at the bottom of a 0–1,400 ms axis, so its quartile box is hidden under
    the median bar and its letter-value boxes cannot be read → a value range in which
    every category''s inner boxes are legible, for example a less extreme Cache Layer
    scale in the data generation or a log value axis. Likely cause: distributions[''Cache
    Layer''] base 8 / scale 5 on a linear y scale shared with Database''s 1,400 ms
    tail.'
  - 'Suggestion: a log10 response-time axis (scale_y_log10) would suit latency data
    and give the short lower tails room.'
  - 'Suggestion: the unused IMPRINT_PALETTE constant could be dropped.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel; no grid; legend panel on #FFFDF6 with a soft outline.
      Chrome: title "boxen-basic · python · letsplot · anyplot.ai" top-left in dark ink (~42 % width); y-axis "Response Time (ms)" with ticks 0–1,400; x-axis "Server Endpoint" with API Gateway, Auth Service, Database, Cache Layer; legend "Quantile Range" 50 %…99.61 %. All text dark and readable.
      Data: four nested letter-value stacks, widest quartile box #009E73 at the median, each deeper level narrower and stepping toward #4467A3; boxes outlined in #4A4A44; a thick near-black median bar; grey outlier dots above each stack (e.g. Database to ~1,410 ms). Cache Layer is squashed near 0. Neighbouring mid levels are hard to tell apart by color.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend panel on #242420.
      Chrome: title, axis titles and tick labels in light ink (#F0EFE8 / #B8B7B0), all readable; no dark-on-dark text.
      Data: box fills identical to the light render (green → blue ramp); outlines flip to light grey; the median bar flips to off-white; outliers light grey. Brand green clearly visible.
      Legibility verdict: PASS
