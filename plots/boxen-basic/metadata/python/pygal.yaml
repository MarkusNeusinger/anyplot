review:
  strengths:
  - Genuine letter-value boxes built from pygal XY segments with per-series stroke_style
    widths and butt caps, narrowing from 300 to 90 px for each deeper level
  - Box edges and outliers come straight from np.quantile on the data; outliers sit
    at their category position with no jitter
  - Legend names each quantile level with its percentile span plus the median and
    outlier entries
  - Theme tokens threaded through Style; data colors identical in both renders, median
    bar flips to INK
  - Column constants and a marked Data block make the script reusable with a real
    table
  weaknesses:
  - 'VQ-07 (both): the four letter-value levels, which are ordered by depth, are drawn
    in the categorical Imprint hues green, purple, blue and ochre as if unrelated
    groups → discrete steps of imprint_seq from the quartile box to the deepest level.
    Likely cause: series_colors = IMPRINT_PALETTE[level].'
  - 'VQ-05 (both): pygal draws its x=0 axis line vertically through the API-Auth column,
    from the baseline to the top of the plot, so it reads like a whisker over the
    first category → no axis line inside the data area. Likely cause: categories placed
    at x=0..n-1 with xrange=(-0.6, …); place them at 1..n with xrange=(0.4, n+0.6).'
  - 'Suggestion: move the legend from the cramped top-left corner into the empty upper
    plot area or below the chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "boxen-basic · python · pygal · anyplot.ai" top center; y-axis "Response Time (ms)" 0-1500, x-axis "Endpoint" with API-Auth, API-Search, API-Report, API-Download; dashed subtle y-grid; legend top-left with six entries (Thirty-seconds, Sixteenths, Eighths, Quartiles, Median, Beyond deepest level). All text dark and readable. A thin vertical axis line at x=0 runs through the API-Auth column to the top.
      Data: per endpoint a green quartile box (widest) with a black median bar, purple eighths, blue sixteenths and narrow ochre thirty-seconds slabs above and below; upper tails long (ochre to ~490-830 ms), gray outlier dots stacked above to 1000-1500 ms and a few near 0.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend in light text, all readable; no dark-on-dark. Grid subtle. Same x=0 axis line through API-Auth.
      Data: box colors identical to light; median bar flips to light ink, outlier dots to light gray.
      Legibility verdict: PASS
