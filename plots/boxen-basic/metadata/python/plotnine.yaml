review:
  strengths:
  - Letter values computed correctly as the 1/4, 1/8 ... 1/256 tail quantiles, so
    every box edge sits at its quantile and the API tail and Database bimodality read
    clearly
  - Boxes narrow by 15% per level and are drawn deepest-first, so each wider inner
    box sits on top and all levels stay visible
  - Only observations beyond the deepest letter value are drawn as points, keeping
    the tails sparse and legible
  - Theme tokens threaded through every chrome element; both renders readable
  - 'Adaptable structure: column constants with role comments and one Data block'
  weaknesses:
  - 'VQ-07 (both): the seven ordered quantile levels use a hand-mixed ramp from #009E73
    to a pale blue-white #C8DCF0, not steps of imprint_seq → discrete steps of the
    imprint_seq ramp (#009E73 → #4467A3) in level order, each distinguishable from
    the page in both themes. Likely cause: the RGB interpolation loop that builds
    `colors`.'
  - 'VQ-01 (both): legend entries at 7 pt sit below the style guide''s 8 pt reference
    and read small beside the 8 pt legend title → 8 pt (+1 pt). Likely cause: legend_text=element_text(size=7).'
  - 'VQ-05 (both): the legend title ''Quantile Level'' starts flush on the legend
    frame''s left edge and the ''25.0%-75.0%'' label touches its right edge → a few
    points of padding inside the frame. Likely cause: legend_background frame with
    default legend_box_margin/legend_margin at these font sizes.'
  - 'Suggestion: dropping the panel border would let the boxes breathe on the page.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel, 3200x1800.
      Chrome: bold title 'boxen-basic · python · plotnine · anyplot.ai', axis titles 'Endpoint' and 'Response Time (ms)', dark ticks 0-500, subtle grid, thin panel border, 'Quantile Level' legend in an elevated frame on the right; all text dark and readable.
      Data: four groups (API, Database, Cache, Auth), each a stack of up to seven nested boxes from #009E73 (quartiles, widest) to a pale blue-white tint (0.4-99.6%, narrowest), near-black median bars, semi-transparent green outlier points beyond the deepest level (API tail 420-490 ms, Auth to ~270 ms).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink, legend frame #242420 with light text; no dark-on-dark text.
      Data: box fills and outlier green identical to the light render; median bars flip to near-white; box outlines lighter. Brand green clearly visible.
      Legibility verdict: PASS
