review:
  strengths:
  - 'Correct letter-value construction: each nested box spans the (0.5^k, 1−0.5^k)
    quantiles via np.quantile, every edge at its quantile on the value axis, with
    an ink median line and points beyond the deepest (128ths) letter value'
  - Box widths shrink linearly from 0.75 to 0.25 with depth, all centered on the category,
    so the shape of each distribution reads at a glance
  - Quantile levels colored as ordered steps of imprint_seq (brand green core → blue
    tails), matching the style guide's Ordered Categories rule; data colors identical
    across both themes
  - Legend labels state the quantile span of every level (e.g. 'Sixteenths (6.25–93.8%)'),
    which explains letter values to a reader unfamiliar with boxen plots
  - Explicit bokeh Legend built from LegendItems that group one level's renderers
    across all four categories, placed in a side panel clear of the data
  - Page-colored 3 px outlines separate the nested boxes in both themes; theme tokens
    threaded through title, axes, ticks, grid and legend
  weaknesses:
  - 'SC-02 (both): neighbouring quantile levels are nearly indistinguishable — Fourths,
    Eighths and Sixteenths (and 32nds/64ths) differ by only about 1/5 of the short
    green→blue ramp each, so their boxes and legend swatches read as the same color
    and the ''contrasting colors or shading that tell the quantile levels apart''
    property is only partly met → make each step clearly distinct from its neighbours
    while staying on imprint_seq, e.g. add a per-level lightness/alpha step (fill_alpha
    from 1.0 down to about 0.5 with depth) on top of the ramp. Likely cause: LEVEL_COLORS
    = linspace over six steps of #009E73→#4467A3 with fill_alpha=1.0 on every level.'
  - 'DQ-03 (both): API Users shows response times below zero (outlier points down
    to about −15 ms, y-axis extended to about −50 ms) — latencies cannot be negative
    → all values ≥ 0 (about +15 ms at the minimum). Likely cause: np.random.normal(80,
    25, 4500) for API Users; draw from a positive distribution (gamma/lognormal) or
    offset it like API Auth.'
  - 'Suggestion: build one ColumnDataSource per quantile level holding all categories
    instead of one source per box, and add a HoverTool showing the level''s quantile
    bounds for the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "boxen-basic · python · bokeh · anyplot.ai" bold top-left (~45 % width); italic axis titles "Response Time (ms)" (y) and "API Endpoint" (x); tick labels 0–600 and four endpoint names in dark grey; subtle horizontal grid only; L-shaped axis lines. Legend panel on the right titled "Quantile level" with Median (black line), six level swatches with quantile spans, and Outliers. All readable.
      Data: four categories (API Auth, Users, Orders, Search), each a stack of six nested boxes narrowing with depth, brand green #009E73 quartile box through teal to blue #4467A3 128ths box, page-colored separators, black median line, translucent blue outlier dots above and below. API Users outliers dip slightly below 0. Neighbouring levels (Fourths/Eighths/Sixteenths) are very close in hue.
      Legibility verdict: PASS

