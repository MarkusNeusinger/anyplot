review:
  strengths:
  - Letter values computed directly with np.quantile at tails 1/4…1/128, so every
    box edge sits at its quantile on the value axis, with six nested levels narrowing
    linearly from 0.75 to 0.25 of the category width, all centered on the category
  - Each level beyond the quartiles is drawn as its two outer bands only, so translucent
    levels never stack; page-colored 3 px edges separate neighbouring levels cleanly
    in both themes
  - 'Ordered quantile levels take discrete steps of imprint_seq (brand green #009E73
    → blue #4467A3) in their natural order, and the legend lists each level with its
    quantile range (e.g. ''Sixteenths (6.25–93.8%)'')'
  - Custom Legend built from LegendItem objects grouping per-category renderers (one
    per level, plus Median and Outliers), placed outside the plot on the right with
    an elevated background
  - 'Realistic, neutral scenario: 5,000 response times per API endpoint with distinct
    shapes (exponential with a slow mode, gamma, lognormal), giving long right tails
    and outliers beyond the 128ths on both sides'
  - Theme tokens threaded through title, axes, ticks, grid, legend and median line;
    the median flips ink-colored per theme and stays legible in both renders
  weaknesses:
  - 'VQ-07, VQ-03 (dark): the fading alpha (1.0 → 0.4) composites the deeper levels
    toward the #1A1A17 page, so 32nds, 64ths and 128ths render as near-identical dark
    slate-navy fills and the 128ths box barely separates from the background, breaking
    the ordered-categories rule that every step stays distinguishable from its neighbours
    and the background in both themes → keep each level opaque (fill_alpha=1) and
    let the imprint_seq steps alone carry the order, or fade toward PAGE_BG only as
    far as each step stays clearly apart. Likely cause: LEVEL_ALPHAS = np.linspace(1.0,
    0.4, ...) applied as fill_alpha on a dark page.'
  - 'Suggestion: a HoverTool on the level quads showing the level name and its quantile
    bounds would add value in the HTML view.'
  - 'Suggestion: a few pixels of padding between the ''Median'' legend line glyph
    and its label would match the spacing of the square swatches.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, legend box on a slightly lighter elevated surface with a soft border.
      Chrome: bold title "boxen-basic · python · bokeh · anyplot.ai" top-left (~45% width); y-axis "Response Time (ms)" 0–600, x-axis "API Endpoint" with four categories (API Auth, API Users, API Orders, API Search); dark ink title/labels, soft-ink ticks, subtle horizontal grid; all readable.
      Data: four letter-value stacks, six nested levels each, narrowing outward; innermost Fourths box in brand green #009E73 stepping through teal to pale blue-grey for 128ths; black median bar across each Fourths box; blue outlier points above and below the deepest level. Legend "Quantile level" lists Median, six levels with quantile ranges, and Outliers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, legend on an elevated dark surface.
      Chrome: light title, axis labels and tick labels; subtle grid; no dark-on-dark text.
      Data: same fill hex values as light; median bar flips to near-white. Because the levels fade via alpha, the deeper levels (32nds, 64ths, 128ths) composite to similar dark slate-navy tones and the 128ths box sits close to the background; outlier points stay visible but low-contrast. Brand green Fourths box reads strongly.
      Legibility verdict: PASS (text); deep quantile levels weakly separated
