review:
  strengths:
  - Letter values are computed correctly with Tukey's depth rule (floor(log2 n) -
    3 gives 8 levels for about 2000 observations), every box edge at quantile 0.5^(k+1)
    / 1 - 0.5^(k+1), and the outliers are exactly the observations beyond the deepest
    box
  - 'Idiomatic Vega-Lite construction: mark_bar with y/y2 for the box spans, a size
    channel with scale=None for the shrinking widths, and an ordinal color scale whose
    domain keeps the levels in depth order in the legend'
  - Log value axis with hand-picked 1-2-5 ticks makes the right-skewed response times
    readable without squashing every box under the slowest outlier
  - Legend entries name each level by its letter value and the share of the data inside
    it (Fourths (50%) ... 1/512 (99.6%)), which explains the quantile levels as the
    spec asks
  - Thin page-colored strokes separate the nested boxes in both themes, and the median
    tick flips between INK tokens so it reads on light and dark
  - Tooltips on boxes, medians and outliers give exact bounds in the HTML view
  weaknesses:
  - 'VQ-07 (both): the letter-value colors leave the imprint_seq ramp: each step is
    tinted up to 70 % toward white, so the deep levels end in pale lavender-greys
    (about #C8D0E4) that are custom hex values rather than steps between #009E73 and
    #4467A3, while the first three levels (Fourths, Eighths, Sixteenths) stay nearly
    the same green in the legend → use discrete steps of imprint_seq itself, spaced
    so that neighbouring levels differ visibly. Likely cause: the `steps = hues +
    (255 - hues) * 0.7 * position**1.6` tint in the color block.'
  - 'Suggestion: the legend box is much taller than its eight entries need relative
    to the empty band below it; aligning its top with the plot''s top edge already
    works, so a slightly larger symbol or label size could balance it against the
    axis titles.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, consistent across plot area and padding.
      Chrome: bold dark title "boxen-basic · python · altair · anyplot.ai" centered over the plot; y-axis "Response Time (ms), log scale" with 1-2-5 log ticks (2 … 1,000); x-axis "Endpoint" with API Gateway, Database, Auth Service, Cache; subtle grey horizontal grid; legend "Letter value (share inside)" on an elevated off-white card at the right. All text dark and readable.
      Data: four letter-value stacks of nested boxes, widest green #009E73 Fourths box around a dark median tick, each deeper level narrower and shifted from green through teal to pale blue/lavender; thin page-colored strokes separate the boxes; open grey circles mark the outliers beyond the deepest box at both tails. First level is #009E73.
