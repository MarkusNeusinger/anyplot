review:
  strengths:
  - Letter values computed with Tukey's depth rule (floor(log2 n) - 3), so every category
    stops where 4 to 8 observations remain per tail and those show as outlier points
    at their values
  - Box widths shrink linearly with depth and every box is centred on its category,
    giving the characteristic stepped boxen silhouette
  - Log value axis with hand-picked 1-2-5 ticks keeps the right-skewed response-time
    boxes readable instead of squeezing them under the slowest outlier
  - Legend entries name each level and the share of data it holds (Fourths (50%) ...
    1/512 (99.6%)), explaining the quantile levels as the Notes ask
  - 'Native Altair layering: mark_bar with y/y2 and a scale-free size channel for
    widths, mark_tick for the median, mark_point for outliers, plus escaped, titled
    tooltips on every layer in the HTML output'
  - Theme tokens threaded through axis, legend, median tick and outlier stroke; both
    renders fully readable
  weaknesses:
  - 'VQ-07 (both): every second letter-value level is tinted 45 % toward white, so
    the level colours leave the imprint_seq ramp and their lightness zigzags (Fourths
    dark, Eighths light, Sixteenths dark, 1/32 light ...) instead of stepping monotonically
    in the levels'' natural order → plain evenly spaced steps of imprint_seq from
    #009E73 to #4467A3, separated by the existing thin page-coloured stroke. Likely
    cause: the `tint = np.where(np.arange(k_max) % 2 == 1, 0.45, 0.0)` lines.'
  - 'Suggestion: the Auth Service and Cache samples mix a uniform block into the lognormal,
    which gives them an unusually tall 1/32 box; a single heavier-tailed distribution
    per endpoint would read more like real latency data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: title "boxen-basic · python · altair · anyplot.ai" in dark ink at top centre; y-axis title "Response Time (ms), log scale" and x-axis title "Endpoint" in dark ink; tick labels (1-2-5 log ticks from 2 to 1,000; API Gateway, Database, Auth Service, Cache) in soft ink; subtle horizontal grid; legend "Letter value (share inside)" on an elevated off-white panel at the right with 8 square swatches. All readable.
      Data: four stacks of nested boxes centred on each category, widest (Fourths, brand green #009E73) in the middle, narrowing outward through teal and blue steps to 1/512 slivers; dark median tick across each stack; hollow grey outlier circles above and below each stack. First level is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick labels in light soft ink, grid subtle, legend panel elevated dark #242420 with light labels. No dark-on-dark text.
      Data: box colours identical to the light render; median tick flips to light ink and outlier circles to light grey, both clearly visible. Brand green clearly visible.
      Legibility verdict: PASS
