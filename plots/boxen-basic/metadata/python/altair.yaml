review:
  strengths:
  - 'Correct letter values: each box spans quantile(0.5^(k+1)) to its complement with
    Tukey''s floor(log2 n)-3 depth, so categories of different size get different
    level counts'
  - 'Native Altair construction: bar marks with y/y2 and a size channel (scale=None)
    give linearly narrowing, centered boxes, layered with tick medians and hollow
    outlier points on one log scale'
  - Theme tokens threaded through every chrome element; both renders readable, data
    colors identical across themes
  - Legend entries name each level with the share of data inside it, and page-colored
    seams separate nested boxes
  - Tooltips on boxes, medians and outliers for the HTML view
  weaknesses:
  - 'VQ-07, SC-02 (both): the eight imprint_seq steps are interpolated evenly across
    k_max levels, so neighbouring levels Eighths, Sixteenths, 1/32 and 1/64 render
    as near-identical teal and cannot be matched to the legend → each step visibly
    distinct from its neighbours, e.g. alternate lightness or fewer distinct steps
    across the ramp so adjacent levels differ clearly in both themes. Likely cause:
    np.linspace(0, 1, k_max) RGB interpolation between only #009E73 and #4467A3.'
  - 'Suggestion: a slightly larger legend label size (11–12) would balance the legend
    against the 12 pt axis titles in the thumbnail.'
