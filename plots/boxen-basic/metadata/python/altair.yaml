review:
  strengths:
  - 'Correct letter-value construction: depth from Tukey''s rule floor(log2 n) - 3
    (8 levels for about 2,000 points), with each box edge at the 2^-(k+1) quantile
    computed by pandas quantile and the outliers taken as the points beyond the deepest
    box'
  - Ordered levels colored in steps of imprint_seq (brand green to blue) in natural
    order, with a page-colored stroke that separates the nested boxes in both themes
  - The legend names each level by its letter value and the share of data inside (Fourths
    50% to 1/512 99.6%), so the quantile encoding is self-explanatory
  - A log value axis with 1-2-5 ticks fits the right-skewed response times and keeps
    every box readable instead of squeezing them under the slowest outlier
  - 'Idiomatic Altair layering: mark_bar with y/y2 and a pixel size channel (scale=None)
    for the shrinking widths, mark_tick medians and mark_point outliers in one alt.layer,
    with tooltips on every layer for the HTML view'
  weaknesses:
  - 'VQ-07, SC-02 (both): the eight imprint_seq steps are so close that neighbouring
    levels cannot be told apart by color; Fourths (#009E73) and Eighths (#039C79)
    look identical in the legend and in the boxes, and Eighths through 1/32 read as
    one teal → every step distinguishable from its neighbours (style guide, Ordered
    Categories), for example stronger lightness steps between adjacent levels or a
    ramp that separates the inner levels more. Likely cause: the linear RGB interpolation
    np.linspace(0, 1, k_max) between only two stops spreads 8 levels over one short
    hue range.'
  - 'Suggestion: the space under the legend stays empty; a slightly wider inner view
    would use the canvas more evenly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 for the page and the view; the legend sits on a slightly elevated panel with a subtle rule border.
      Chrome: bold dark title "boxen-basic · python · altair · anyplot.ai" centred at the top, at about 37 % of the width; y-axis title "Response Time (ms), log scale" and x-axis title "Endpoint" in dark ink; tick labels (1-2-5 log ticks from 2 to 1,000; API Gateway, Database, Auth Service, Cache) in soft dark grey; subtle horizontal grid only. Everything is readable.
      Data: four letter-value stacks, each a set of nested bars that get narrower with depth, with brand green #009E73 for the Fourths box and steps toward blue #4467A3 for the deeper levels, separated by thin page-colored strokes; dark median ticks extend slightly past the widest box; hollow grey circles mark outliers beyond the deepest box at both ends. The legend "Letter value (share inside)" lists 8 levels from Fourths (50%) to 1/512 (99.6%). The adjacent inner levels (Fourths/Eighths/Sixteenths) are nearly the same color.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; the legend panel is slightly elevated (#242420) with a subtle border.
      Chrome: the title and axis titles are in light ink and the tick labels in soft light grey; grid lines are subtle but visible. No dark-on-dark text.
      Data: box colors are identical to the light render (green to blue steps); the median ticks and outlier circles flip to light ink and stay clearly visible. Brand green reads well.
      Legibility verdict: PASS
