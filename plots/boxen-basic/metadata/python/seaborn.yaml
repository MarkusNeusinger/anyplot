review:
  strengths:
  - Uses sns.boxenplot with hue=GENE and IMPRINT_PALETTE[:n_genes], so seaborn's native
    per-level lightness ramp tells the letter values apart in both themes
  - linecolor=INK_SOFT threads the theme token into the box outlines, so outlines
    stay visible on the dark background
  - 'Clean adaptable structure: column constants, one Data block ending in a tidy
    df, no typed column names below it'
  - Title follows the mandated format and the canvas is the canonical 3200x1800 in
    both renders
  weaknesses:
  - 'VQ-03, SC-02 (both): TP53, BRCA1 and EGFR are squashed into slivers a few px
    tall at the bottom of a 0-425 axis, so their nested letter-value boxes (C1) cannot
    be told apart → each gene''s boxes span a readable share of the axis. Likely cause:
    MYC drawn from np.random.lognormal(mean=2.0, sigma=1.2) on a linear axis; generate
    genuine log2 values (e.g. normal or skewed draws within about 0-16).'
  - 'DQ-03 (both): the y-axis is labelled ''Expression Level (log2)'' but its values
    reach 425, impossible for log2 expression (typically about 0-16) → values on a
    log2 scale (about −409 at the max). Likely cause: the lognormal / exponential
    draws are raw-scale values under a log2 label.'
  - 'VQ-01 (both): the quantile caption is set at 7 pt, below the 8 pt tick-label
    reference, and reads small beside the ticks → 8 pt (+1 pt). Likely cause: ax.text(...,
    fontsize=7).'
  - 'Suggestion: once the scale is fixed, a little less empty space below the caption
    would tighten the layout.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title 'boxen-basic · python · seaborn · anyplot.ai' in dark ink, axis titles 'Gene' and 'Expression Level (log2)', gene tick labels and 0-400 y ticks in INK_SOFT, subtle y-grid, italic caption below the x-axis title explaining that the widest box spans the quartiles and narrower ones the eighths, sixteenths; all readable
      Data: four boxen stacks in Imprint order (TP53 #009E73, BRCA1 #C475FD, MYC #4467A3, EGFR #BD8233) with lighter shades for deeper levels and gray outlier circles; MYC's long tail with outliers to ~425 sets the axis, so TP53, BRCA1 and EGFR are compressed into thin slivers near 0
      Legibility verdict: PASS (text), but three of four distributions are unreadable due to scale

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black
      Chrome: title and axis titles in light ink, ticks and caption in light gray; grid subtle; no dark-on-dark text
      Data: identical fill colors to the light render; box outlines flip to light INK_SOFT, which on the thin EGFR and TP53 slivers dominates the fill; same compression of three genes near 0
      Legibility verdict: PASS (text), same scale problem as light
