review:
  strengths:
  - 'Correct Imprint palette in canonical order (Core=#009E73, Service layer, UI layer,
    Shared utilities), identical data colors between light and dark renders, with
    theme-correct #FAF8F1/#1A1A17 backgrounds'
  - Node size scaled by degree (26 + degree*5) meaningfully encodes hub importance
    — Logger, Auth Service, API Gateway, and Database read visually as the busiest
    modules, real data storytelling rather than uniform node sizes
  - Arrowheads (edgeSymbol 'arrow', size 14) clearly show import direction and are
    appropriately sized relative to node size, satisfying the spec's directionality
    requirement
  - Edge width scaled to import-count weight (1 + weight/2.2) combined with 0.55 opacity
    keeps the dense 20-edge graph legible instead of a uniform tangle
  - Realistic, neutral software module-dependency dataset (14 modules / 20 edges)
    squarely in the spec's 10-50 node range, grouped into believable architecture
    layers
  - 'Clean KISS code: deterministic hard-coded data (no RNG needed for reproducibility),
    correct mount-node contract, animation disabled, no explicit width/height/devicePixelRatio'
  weaknesses:
  - 'The bottom-most node''s rotated label (circular layout, rotateLabel: true) collides
    with the legend''s ''UI layer'' text directly beneath it in BOTH light and dark
    renders, making that legend entry read as garbled/merged text — increase vertical
    separation between the graph and legend (e.g. shrink series.radius slightly, or
    push legend further down with a larger ''bottom'' offset, or add center/top padding)
    so no node label overlaps the legend row.'
  - 20 edges on a circular layout with curveness 0.2 produces a busy crisscross of
    lines through the center; consider trying a force layout with tuned repulsion,
    or a hierarchical/layered arrangement, to reduce line crossings and make the dependency
    flow easier to trace at a glance
  - No pair of nodes has a true bidirectional edge (A->B and B->A), so the spec's
    suggestion to use curved edges specifically to avoid bidirectional-arrow overlap
    is never exercised by the data — adding one such pair would round out feature
    coverage
  - Library mastery is solid but generic for the graph series — consider a more distinctive
    touch (e.g. tuned force-layout physics, or emphasizing the highest-weight edges
    with a stronger stroke/color) to differentiate beyond a default categorical network
    graph
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-directed · javascript · echarts · anyplot.ai" in bold dark ink, centered at top, fully visible and not clipped. A four-item legend ("Core", "Service layer", "UI layer", "Shared utilities") with colored swatches sits at the bottom center. Node labels are dark ink text placed radially around each circle node, rotated to follow the circular layout.
      Data: 14 nodes arranged in a circular layout, colored by category (Core=green #009E73, Service layer=purple, UI layer=blue, Shared utilities=amber). Node size scales with degree — "Logger" is visibly the largest node (many incoming edges), small leaf nodes like "UI Components" and "Utils" are the smallest. 20 grey directed edges with arrowheads connect the nodes, curved slightly to reduce overlap, with line width proportional to edge weight and moderate transparency to handle the density of crossing lines.
      Legibility verdict: FAIL (partial) — every element except one is clearly readable, but the "Scheduler" node's rotated label at the bottom of the circle visually collides with the legend's "UI layer" text directly below it, merging into hard-to-parse text. This is an overlap defect (VQ-02), not a dark-on-light contrast failure — all text color itself is correctly dark-on-light.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, now rendered in light/white ink, fully visible and not clipped. Same four-item legend at bottom, with light-colored swatches text. Node labels rendered in light ink, readable against the dark background.
      Data: Identical node/edge structure and identical categorical data colors to the light render (green/purple/blue/amber unchanged) — only the chrome (background, text, legend) flipped to the dark theme as expected. Node sizing by degree and edge width by weight are unchanged.
