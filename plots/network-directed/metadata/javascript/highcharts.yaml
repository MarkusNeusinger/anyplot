review:
  strengths:
  - Edge weight now drives arrow line thickness (1 + weight*0.6), adding the spec's
    optional weight dimension that was missing in attempt 1 and directly answering
    the prior review's DQ-01 note.
  - Incoming arrows now fan out around each target node's perimeter (deterministic
    per-edge angular offset), so hub nodes like "logger" and "database" no longer
    show arrows converging on a single point — directly fixes the prior VQ-03 weakness.
  - Slight deterministic quadratic curvature on every edge (hashed per source/target
    pair) reduces the visual ambiguity of overlapping straight paths through the dense
    middle tiers, improving traceability per the prior DE-03 note.
  - Correctly composes arrowed directed edges from the core SVGRenderer (chart.renderer.g/.path)
    since the core highcharts bundle has no networkgraph module — avoids any forbidden
    add-on or faked interactivity.
  - Node radius still scales with in-degree and marker shape+color redundantly encode
    tier membership, keeping the plot colorblind-safe.
  - Canonical Imprint palette order (green/lavender/blue/ochre) applied correctly
    and identically across both themes; all chrome threaded through ANYPLOT_TOKENS.
  - Title, subtitle, node labels, and legend are legible in both renders; backgrounds
    are correctly warm off-white/near-black with nothing clipped at any canvas edge.
  weaknesses:
  - With 27 edges and several weight-5 lines now thicker, the middle-tier crossings
    are still visually busy even with the new curvature/fan-out — a reader still needs
    to trace a specific path carefully rather than seeing it at a glance.
  - Arrow drawing remains generic canvas/trigonometry math layered on top of Highcharts'
    SVGRenderer rather than a Highcharts-specific feature, so Library Mastery (distinctive
    features) is only partially raised by this attempt.
  - Helper functions (edgeHash, drawEdges, drawArrow, nodeRadius) deviate from the
    strict KISS import->data->plot->save structure — justified by the missing networkgraph
    module, but still a minor Code Quality deduction.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "network-directed · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Module import graph — arrows point from importer to dependency" in soft gray beneath it. 15 node labels (cli, server, worker, router, scheduler, api_gateway, auth, database, cache, queue, logger, config, utils) render in dark text above their nodes. Four-item legend ("Entry points", "Orchestration", "Services", "Foundation") centered at the bottom in soft-gray text. All chrome is clearly readable against the light background.
      Data: Four tiers colored in canonical Imprint order — green circles (Entry points, #009E73), lavender diamonds (Orchestration), blue squares (Services), ochre triangles (Foundation). Node radius scales with in-degree (the ochre "logger" triangle is visibly the largest hub). Gray directed edges with visible arrowheads connect nodes left-to-right; edges now have slight curvature and fan out around each target's perimeter, and line thickness visibly varies with the edge weight (e.g. the five edges converging on "logger" from router/scheduler/api_gateway/auth/database/cache are noticeably thicker than the lighter "config"/"utils" edges).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle flip to light ink / soft light-gray text, node labels flip to light text, legend flips to light-gray text — all clearly legible, no dark-on-dark failures anywhere.
      Data: Data colors (green/lavender/blue/ochre nodes, gray edges) are identical to the light render — only chrome flipped, confirming palette-position stability across themes. Node sizing, edge curvature, fan-out, and weight-based line thickness are all identical to the light render.
      Legibility verdict: PASS
