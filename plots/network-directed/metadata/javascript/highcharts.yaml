review:
  strengths:
  - Correctly navigates the "core bundle only" Highcharts constraint by hand-drawing
    arrowed edges with the SVGRenderer behind node markers instead of faking interactivity
    or reaching for the unavailable networkgraph module.
  - Node radius scales with in-degree and marker shape+color both encode tier membership
    — redundant encoding that reads well and stays colorblind-safe.
  - Canonical Imprint palette order applied correctly and identically across themes;
    all chrome (title, subtitle, legend, edge color) is threaded through ANYPLOT_TOKENS
    for both light and dark.
  - Title, subtitle, and legend are legible in both renders; backgrounds are correctly
    warm off-white/near-black with nothing clipped at any canvas edge.
  weaknesses:
  - Dense edge crossings in the middle tiers reduce at-a-glance traceability of individual
    dependency paths — consider a layout tweak (more horizontal/vertical spread, or
    slight edge curvature) to cut crossings, especially around "database" and "auth"
    where several edges converge tightly.
  - Arrowheads can get visually lost where multiple edges converge on one target node
    (e.g. "logger", "database") — a slightly larger or higher-opacity arrowhead would
    improve directionality legibility.
  - The spec's optional edge weight attribute isn't used to vary line thickness/style,
    which would have added an extra data dimension (minor, since it's optional).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "network-directed · javascript · highcharts · anyplot.ai" bold dark ink; subtitle "Module import graph — arrows point from importer to dependency" soft gray; node labels dark ink; legend (Entry points / Orchestration / Services / Foundation) centered at bottom, soft gray text. All clearly readable.
      Data: Four tiers colored with Imprint palette in canonical order — green circles (Entry points), lavender diamonds (Orchestration), blue squares (Services), ochre triangles (Foundation). First series is #009E73. Node radius scales with in-degree (e.g. "logger" triangle is largest, matching indeg=7). Gray directed arrows with visible arrowheads connect nodes left to right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Title, subtitle, node labels, and legend all flip to light ink / light gray text. No dark-on-dark issues — every text element is clearly legible against the near-black surface.
      Data: Colors (green/lavender/blue/ochre nodes, gray edges) are pixel-identical to the light render — only chrome flipped, as required.
      Legibility verdict: PASS
