review:
  strengths:
  - Correct directed network graph built from Chart.js scatter + a custom plugin for
    edges/arrows — the right approach given Chart.js has no native network chart type
  - Semantically meaningful layered left-to-right layout that mirrors the actual dependency
    direction (utils/config on the left, api/router/ui on the right), turning node
    position into part of the story
  - 'Theme-adaptive chrome is correct: title and node labels flip color between light/dark
    while node fill (#009E73) and edge color stay identical'
  - 'White node border (borderColor: t.pageBg) cleanly separates node markers from
    crossing edges'
  - 'animation: false set correctly, data is fully deterministic and hardcoded, code
    is compact and readable'
  weaknesses:
  - Several edges cross close to unrelated nodes (e.g. around 'db' and 'validator')
    creating visual ambiguity about which arrow points where — nudging node y-positions
    apart or adding slight edge curvature would reduce the crossing clutter
  - The spec's optional edge 'weight' field is not encoded anywhere (e.g. via line
    thickness) — all edges use the same fixed lineWidth, so the diagram carries no
    weighting signal
  - Node styling is flat and uniform with no visual hierarchy (e.g. distinguishing
    source/sink nodes or highlighting a critical path) — a missed opportunity for
    data storytelling
  - Arrowheads are a fixed size/style throughout; fine for this graph's density but
    nothing distinguishes edge importance
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: title "network-directed · javascript · chartjs · anyplot.ai" in bold dark ink, clearly visible; 11 bold dark node-id labels (utils, config, logger, validator, db, cache, auth, middleware, api, router, ui) placed just below each node; gray directional arrows (alpha ~0.65) connecting nodes with clearly visible triangular arrowheads.
      Data: all 11 nodes filled with brand green #009E73, with a thin off-white border separating them from crossing edges.
      Legibility verdict: PASS — title and all node labels are clearly readable against the light background, no light-on-light text.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black.
      Chrome: title and all node labels render in light/white text, clearly visible against the dark background; the same gray directional arrows and arrowheads are used, still legible on dark.
      Data: node fill remains the identical brand green #009E73 and edge styling is unchanged from the light render — only chrome (text, background) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text and arrows read clearly.
