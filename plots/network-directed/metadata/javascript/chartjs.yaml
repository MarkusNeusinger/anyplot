review:
  strengths:
  - Custom Chart.js plugin (beforeDatasetsDraw/afterDatasetsDraw) correctly implements
    arrows, curved edges, and labels beyond the library's native chart types -- a
    legitimate high-effort DIY network graph built on the officially supported plugin
    API
  - Node radius encodes total degree (in + out), creating a size-based visual hierarchy
    that highlights hub modules (api, middleware, auth) without extra chrome
  - Layered left-to-right positioning mirrors the actual build-order dependency flow
    (utils/config -> ... -> ui/router), telling a clear directional story
  - Quadratic bezier curves on selected edges (config->db, logger->middleware, validator->auth)
    avoid ambiguous overlaps with nearby nodes, with tangent-aligned arrowheads
  - 'Data colors (brand green #009E73 nodes) and structural gray edges are pixel-identical
    across light and dark renders; chrome (title, labels, background) flips correctly
    with no dark-on-dark or light-on-light failures'
  - Title format is an exact match, and the software-module-dependency scenario is
    realistic, neutral, and uses plausible edge weights (2-5)
  weaknesses:
  - Node labels (600 16px) shrink to illegible size once the PNG is scaled to ~400px
    mobile width -- increase the base label size or weight slightly so module names
    stay readable on mobile
  - The validator->auth curve passes very close to the db node's edge, which can read
    as if the edge touches or originates from db -- increase the curve magnitude or
    the clearance radius so it visibly clears db's bounding circle
  - The only visual-hierarchy signal beyond node color is degree-based sizing -- an
    additional cue (e.g., a slightly bolder label for the highest-degree hub) could
    push Design Excellence further, though this is not required for approval at this
    score
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "network-directed · javascript · chartjs · anyplot.ai" in bold dark ink, clearly readable and centered near the top. Eleven node labels (utils, config, logger, validator, db, cache, middleware, auth, api, ui, router) in bold dark text below each node, all readable at full resolution.
      Data: All 11 nodes are solid brand green (#009E73) circles with a subtle off-white ring, sized by total degree (api and middleware are visibly larger hub nodes). 13 directed edges are drawn as gray arrows (some curved via quadratic bezier) with arrowheads pointing from dependency to dependent, line thickness scaling with edge weight.
      Legibility verdict: PASS -- all text and data elements are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title and all node labels render in light/cream text, clearly legible against the dark background. No dark-on-dark failures observed.
      Data: Node color is identical brand green (#009E73) to the light render; edge gray and arrowhead styling also match. Only the background and text color flipped, as expected.
      Legibility verdict: PASS -- all text and data elements are clearly readable against the dark background.

    Mobile check (plot-light_400.png / plot-dark_400.png): the title remains legible at ~400px width, but the per-node text labels (utils, config, db, etc.) shrink below a comfortably readable size -- flagged as a VQ-01 weakness.
