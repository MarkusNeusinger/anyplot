review:
  strengths:
  - Every arrowhead stops at the target box's border with a 6 px gap, computed per
    edge from the box geometry, so no arrowhead is hidden under a node
  - The bidirectional pair config<->auth is drawn as two opposite curves, and both
    arrowheads can be told apart
  - The hierarchical column layout runs from UI & Apps to Foundation, so the import
    direction reads right to left at a glance
  - Label-fitted rounded node boxes over a page-colored underlay keep edges out of
    the text in both themes
  - Uses MUI X composition (ChartsContainer with hidden linear axes plus useXScale,
    useYScale and useDrawingArea) to map node positions through the library's own
    scales
  weaknesses:
  - 'VQ-03 (both): edge widths for 1, 2 and 3 import calls are 1.8, 2.3 and 2.8 px,
    too close to tell apart, and the legend line ''Edge width = Import calls'' has
    no width samples to decode them → spread the range to about 1.5-5 px and add three
    short line samples labelled 1, 2 and 3 to the legend. Likely cause: strokeWidth
    = 1.3 + weight * 0.5, and the legend''s text-only weight entry.'
  - 'CQ-01 (code): lines 83-89 define a borderDistance helper function outside the
    overlay component that MUI requires → compute the direction vector in each branch
    and the stop distance once, inline, after the straight/curved branch. Likely cause:
    the border clipping factored out into a function.'
  - 'Suggestion: add the MUI ChartsTooltip or a native <title> on each edge so that
    the HTML view shows source, target and import calls on hover.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matching #FAF8F1; no axes or grid.
      Chrome: bold dark title "network-directed · javascript · muix · anyplot.ai" centered at top (~37% width); legend top right with bold "Architecture layer" title, five layer swatches, a red arrow sample "Upward dependency" and a muted note "Edge width = Import calls". All text dark and readable.
      Data: 13 rounded node boxes in five columns (Foundation green #009E73: utils, config; Core Services purple: cache, auth, logger; Domain Logic blue: inventory, billing, orders; API Layer ochre: graphql-api, rest-api; UI & Apps cyan: admin-panel, mobile-app, web-app), each with a tinted fill, a strong outline and a bold dark label. Grey straight edges end in filled grey arrowheads at the target border; config<->auth is drawn as two curves, config->auth in red #AE3030 with a red arrowhead. Edge widths differ only slightly.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matching #1A1A17.
      Chrome: title, legend title, legend entries and node labels in light ink; the edge-width note in a lighter muted grey. No dark-on-dark text.
      Data: node outline and swatch colors identical to the light render; the tinted fills read as dark versions of each layer color; edges and arrowheads light grey; the red config->auth curve unchanged. All arrowheads visible.
      Legibility verdict: PASS
