review:
  strengths:
  - 'Composes the graph from MUI X primitives: an empty ChartsContainer with hidden
    linear axes, plus a custom overlay that reads useDrawingArea/useXScale/useYScale,
    so node positions go through the chart''s own scales'
  - Arrowheads are SVG markers ending a fixed END_GAP outside each target's radius,
    so every arrow tip sits visibly at the target node's border in both themes
  - The auth/config bidirectional pair is drawn as two opposite quadratic curves whose
    arrowheads can be told apart
  - 'Theme tokens are applied throughout: ink/inkSoft text, page-colored node outlines
    and label halos (paintOrder stroke), so both renders read cleanly'
  - Hierarchical left-to-right layout by architecture layer with layer colors from
    Imprint positions 1-4 and 6, keeping the red anchor free for a semantic role
  weaknesses:
  - 'VQ-02 (both): two edges run straight through an unrelated node because their
    endpoints are collinear with it in the layer grid: billing→orders passes under
    inventory, and admin-panel→inventory passes under graphql-api. They read as billing–inventory
    + inventory→orders and admin-panel–graphql-api + graphql-api→inventory → no edge
    may pass beneath a node it does not join. Likely cause: the integer column / centred
    row positions (x = depth, y = seen − (count − 1)/2) put nodes on exact lines between
    others; stagger the rows per layer (for example offset alternate layers by half
    a step) or reorder nodes within layers.'
  - 'VQ-02, SC-02 (both): node labels are crossed by edges: ''config'' by the red
    config→auth curve and the config→utils line, ''cache'' by the cache→utils and
    orders→cache lines, ''graphql-api'' by graphql-api→orders and web-app→graphql-api,
    ''inventory'' and ''billing'' by the vertical billing→orders line. This breaks
    the ''edges and arrowheads kept out of the text'' property → labels clear of every
    edge. Likely cause: labels placed directly below each node (y + NODE_RADIUS +
    22), exactly where edges leave downward; place them beside the node on the side
    away from its edges, or route the layout so edges leave through the sides.'
  - 'Suggestion: a small three-step width key (1, 2, 3 import calls) under ''Edge
    width = Import calls'' would make the weight encoding decodable; the 1.8–2.8 px
    range is hard to read without one.'
  - 'Suggestion: MUI X tooltips are not used; a hover readout of importer → imported
    and the call count would add value to the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
      Chrome: bold dark title "network-directed · javascript · muix · anyplot.ai" centered at top; right-side legend "Architecture layer" with five colored dots, a red "Upward dependency" arrow sample and the note "Edge width = Import calls"; node labels in dark ink below each node. All text readable.
      Data: 13 nodes in five columns by layer (Foundation #009E73 green, Core Services purple, Domain Logic blue, API Layer ochre, UI & Apps cyan); grey straight edges with filled arrowheads ending at target borders; auth→config and config→auth drawn as two opposite curves, config→auth in matte red. billing→orders runs under inventory and admin-panel→inventory under graphql-api; several labels (config, cache, graphql-api, inventory, billing) are crossed by edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
