review:
  strengths:
  - 'Correct, idiomatic Imprint palette use: brand green is the first series, and
    the implementation makes a well-reasoned semantic exception — it skips palette[4]
    (reserved matte-red) for the five layer groups, then reaches back to that exact
    slot (#AE3030) for the flagged circular-dependency edge, matching the style guide''s
    semantic-anchor rule precisely.'
  - 'Sophisticated, idiomatic MUI X composition: since the community package has no
    native network-graph type, the implementation repurposes ScatterPlot with a custom
    scatter slot plus useXScale/useYScale/useDrawingArea hooks to build a bespoke
    directed-graph renderer (SVG arrow markers, page-background stroke rings on nodes
    for edge-crossing legibility).'
  - Bidirectional edges are bowed apart using a canonical (direction-independent)
    normal vector so the two opposing curves don't cancel out — correctly implements
    the spec's curved-edge guidance for bidirectional pairs.
  - 'The circular dependency (config ↔ auth) is surfaced as real signal, not decoration:
    thicker/opaque red arrow plus a dedicated annotation explaining it, directly serving
    the spec''s ''reveal asymmetric relationships'' goal.'
  - 'Both renders are theme-correct: identical data colors between light/dark, correct
    chrome backgrounds, all text legible in both themes, no clipping at any edge.'
  weaknesses:
  - The layered build-order layout produces a dense mesh of crossing edges in the
    middle cluster (orders/inventory/billing/rest-api/graphql-api) at strokeOpacity
    0.55 — still traceable but visually busy; a touch more contrast or slight curvature
    on non-flagged edges would help disambiguate crossings.
  - The spec's optional `weight` field is not used at all — varying arrow/stroke thickness
    by weight would have added another layer of feature coverage.
  - There is a noticeable empty region on the right side of the canvas below the legend/beyond
    the UI & Apps node column; the layout could be rebalanced or scaled to use that
    space more evenly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-directed · javascript · muix · anyplot.ai" is centered at top in dark ink, clearly legible. No axis chrome (appropriate for a network diagram — no ticks/axis titles to check). Legend at top-right lists the five layer groups (Foundation, Core Services, Domain Logic, API Layer, UI & Apps) in dark ink swatches with dark text, plus a separate "Circular dependency" red-arrow annotation below it. Node labels (utils, config, logger, auth, cache, orders, inventory, billing, rest-api, graphql-api, web-app, mobile-app, admin-panel) are dark text with a light halo stroke, fully readable over the crossing edges beneath them.
      Data: 13 nodes colored by layer group using the Imprint palette (green/lavender/blue/ochre/cyan), each with a light stroke ring separating it from underlying edges. Grey directed edges with arrowheads point from dependent module to dependency; one edge (config → auth) is rendered in matte red (#AE3030) with a thicker stroke and paired with a curved red return edge (auth-side of the config↔auth cycle uses the grey curve) to flag the real circular dependency.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend text, and node labels all render in light ink against the dark background — fully legible, no dark-on-dark failures anywhere. Legend swatches and layout are identical in position/content to the light render.
      Data: Node and edge colors are pixel-identical to the light render (same five Imprint hues for groups, same matte-red #AE3030 for the flagged cycle) — only the chrome (background, text ink, node stroke rings which are theme-adaptive pageBg) flipped, exactly as required.
      Legibility verdict: PASS — no dark-on-dark text; grid/tick concerns are not applicable (no traditional axes in this chart type), and all labels remain legible over the dark surface.
