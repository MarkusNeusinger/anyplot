review:
  strengths:
  - Arrows are clipped to the node circles with FancyArrowPatch patchA/patchB, so
    every arrowhead lands exactly on the target border in both themes
  - One consistent filled '-|>' arrow style with a gentle arc3 curve, thinner and
    lighter than the nodes it joins
  - 'Theme tokens threaded through nodes, labels and legend: all chrome flips correctly
    while the Imprint node colors stay identical'
  - Canonical 3200x1800 canvas with the full mandated title and a reader-facing legend
    title from the GROUP constant
  - 'Clean adaptable structure: column constants, one data block ending in df, plot
    code that reads only df and nodes'
  weaknesses:
  - 'VQ-02, SC-02 (both): edges run beneath node labels — handlers→logger crosses
    the ''validators'' text, auth→logger and auth→validators cross the ''database''
    node next to its label, and ''test_routes'' spills past its circle — violating
    C5 → edges and arrowheads clear of every label, each label inside its node. Likely
    cause: hand-typed X/Y positions that put validators and database on other nodes''
    edge paths, and node_radius=0.065 too small for the longest label.'
  - 'SC-02 (both): node positions are typed into the data as X/Y columns rather than
    taken from a force-directed, hierarchical or circular layout (C4) → compute positions
    from a layout of df, e.g. a layered layout by dependency depth. Likely cause:
    the X and Y lists in the nodes DataFrame.'
  - 'VQ-01 (both): node labels at 6.5 pt sit below the style guide''s 8 pt reference
    → about 8 pt (+1.5 pt), with node_radius enlarged so the labels still fit. Likely
    cause: ax.text fontsize=6.5.'
  - 'VQ-05 (both): with set_aspect(''equal'') the graph fills only the central ~55%
    of the landscape canvas, leaving wide empty bands left and right → spread the
    layout across ~85% of the width. Likely cause: positions in a near-square unit
    box on a 16:9 canvas.'
  - 'Suggestion: edge weights (the spec''s optional weight) could vary line width
    by one rule.'
