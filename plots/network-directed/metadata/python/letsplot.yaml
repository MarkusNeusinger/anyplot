review:
  strengths:
  - Hierarchical layout computed from the edge list (longest-path layering), so dependencies
    flow top to bottom from App to Config and Logger
  - Edges shortened in screen proportions so every closed arrowhead touches the target
    node border in both renders
  - geom_label with a page-coloured backing and label_size=0 keeps passing edges out
    of the node labels
  - Node outlines and all chrome come from theme tokens; Imprint colours identical
    across light and dark
  weaknesses:
  - 'VQ-03 (both): the API→Database arrowhead lands exactly where the Cache→Logger
    and HTTP Client→Config edges cross above Database, so the head merges into the
    crossing and its direction is hard to read → a layout slot order in the middle
    layer that moves that crossing away from the Database border. Likely cause: nodes[''slot'']
    taken from table order (groupby(''layer'').cumcount()).'
  - 'Suggestion: the legend key column shows a slightly different shaded block behind
    the glyphs; a legend_key fill from ELEVATED_BG would make the legend one surface.'
  - 'Suggestion: slightly longer arrowheads (length 7 → 9) would read more clearly
    beside the 11-size nodes.'
