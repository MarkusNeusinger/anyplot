  strengths:
  - Every edge stops at the target node border and ends in a data-referenced plotly
    annotation arrowhead, so direction reads clearly in both themes
  - The utils<->schemas pair is drawn as two bowed Bezier edges with separate arrowheads,
    exactly as the Notes suggest
  - Node labels are pushed radially outward by side, keeping edges and arrowheads
    out of the text
  - 'Clean adaptable structure: column constants, groupby-driven node traces in Imprint
    order, scaleanchor for an undistorted ring, hovertemplate in the HTML'
  weaknesses:
  - 'VQ-05 (both): the ring and its labels span only about 40 % of the 2400x2400 canvas,
    leaving an empty band of about 380 px between the title and the top label and
    about 260 px between the bottom label and the legend → tighten the y range so
    the graph fills about 55-65 % of the canvas (about +20 % ring size). Likely cause:
    view = radius * 1.55 applied to the y range too, although the labels only need
    extra room left and right.'
  - 'Suggestion: line_shape=''spline'' on the two curved edges would remove the faint
    facets of the 60-point polyline.'
  - 'Suggestion: centre the horizontal legend title vertically with its entries (legend
    title side=''left'').'
