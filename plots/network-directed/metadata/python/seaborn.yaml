review:
  strengths:
  - Filled arrowheads land exactly at the target node rim via shrinkA/shrinkB tied
    to the marker radius, in both themes
  - Edge width encodes import weight by one linear rule, with a two-sample legend
    explaining it
  - Node label ink chosen per fill for contrast, so every label reads on every hue
  - 'Imprint palette in canonical order from #009E73 with correct theme chrome in
    both renders'
  - Tidy df/nodes tables with column constants feeding sns.scatterplot(hue=GROUP)
  weaknesses:
  - 'VQ-02 (both): the api→log edge runs beneath the db node (api, db and log are
    nearly collinear at x=0.50/0.28/0.15) and leaves db next to the db→log edge, so
    it reads as a second db→log import → place nodes so no edge passes under an unrelated
    node, e.g. move log or db a few hundredths sideways in the node table. Likely
    cause: hand-set X/Y positions putting db on the api→log line.'
  - 'CQ-01 (code): two helper functions, edge_width() and label_color() with a nested
    luminance(), break the flat Imports → Data → Plot → Save structure → inline the
    width as an expression (0.7 + 0.35 * df[WEIGHT]) and the label color as a per-group
    dict or a single fixed ink. Likely cause: the def blocks above the figure.'
  - 'Suggestion: the large empty area below the legend could be reclaimed by placing
    the legend at lower left and narrowing the left margin.'
