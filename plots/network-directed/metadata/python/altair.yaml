  strengths:
  - Arrow tips computed to land exactly on each target node's border, with the triangle
    rotated to the edge heading through the Angle channel
  - Hierarchical layout with crossing-reducing column ordering makes the dependency
    flow read left to right
  - Page-coloured label halos keep edges out of node labels in both themes
  - Imprint palette in canonical order with identical data colours across themes;
    chrome fully theme-adaptive
  - Node tooltips (module and type) in the HTML output
  weaknesses:
  - 'VQ-02 (both): the Logger label sits among five incoming arrowheads and its halo
    cuts into their tips, so the label and arrows crowd each other → arrowheads clear
    of the label by a few px. Likely cause: label dy=-(NODE_R + 8) places labels on
    the side where the Logger in-edges arrive; a larger vertical gap between rows
    (more of VIEW_H used) spreads the approach angles.'
  - 'VQ-03 (both): the API→Database edge shows two short unexplained breaks in empty
    space between API and Models → one continuous line. Likely cause: the page-coloured
    label_halo layer or the polyline filter path[path[:, 0] >= 0] splitting that edge.'
  - 'VQ-05 (both): the graph occupies only about 35 % of the canvas height (roughly
    y 380–770 of 1125 in the displayed render), leaving wide empty bands above and
    below → spread the rows to use about 60–70 % of the height. Likely cause: margin_y=34
    with only three rows inside VIEW_H=320 and the padded 3200×1800 canvas.'
  - 'Suggestion: a weight column driving edge width would show the optional weight
    encoding the Data allows.'
