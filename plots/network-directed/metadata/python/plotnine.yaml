review:
  strengths:
  - Implements the directed network graph using plotnine's own geom_segment + arrow()
    and geom_point primitives instead of falling back to matplotlib/networkx, correctly
    respecting the library's no-workaround rule for network visualizations
  - Layered, tier-based layout (Foundation → Data access → Domain services → Gateway
    → Application) tells a clear bottom-up dependency story, with arrow endpoints
    pulled back from node centers so arrowheads don't hide under the markers
  - 'Correct Imprint palette in canonical order with Foundation mapped to #009E73,
    correct theme-adaptive backgrounds (#FAF8F1 light / #1A1A17 dark), and legible
    chrome in both renders'
  - Realistic, neutral software module-dependency dataset (15 nodes, 23 directed edges)
    sized within the spec's recommended 10-50 node range
  weaknesses:
  - Heavy edge crossing around the Domain services / Data access tiers (e.g. the auth/user_service
    pair and the database/cache/http_client fan-in) makes individual dependency paths
    hard to trace at a glance — consider curved edges (per the spec's own note on
    avoiding arrow overlap) or wider horizontal jitter between tiers to reduce line-on-line
    crossings
  - Node ID labels (geom_text size=3.3) become illegible at the ~400px mobile preview
    size — increase label size slightly or use a bolder weight so node identity survives
    the mobile thumbnail
  - Noticeable dead space between the title and the first (Application) tier row,
    and to the right of the graph before the legend — the network could be scaled
    up or the margins tightened to use the canvas more fully
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-directed · python · plotnine · anyplot.ai" in dark ink, clearly visible and centered at top. No axis lines, ticks, or grid (correctly omitted for a spatial network layout). Legend "Build tier" sits at the right with five color swatches (Foundation/Data access/Domain services/Gateway/Application) on a subtle elevated-cream box with dark text — all readable.
      Data: 15 tier-colored node circles (green/purple/blue/orange/red, matching the Imprint palette in canonical order) connected by grey directed edges with closed arrowheads. Small dark node-ID labels sit just above each marker. First categorical series (Foundation) is #009E73 as required.
      Legibility verdict: PASS — all text (title, node labels, legend) is clearly readable against the light background at full resolution; node labels become too small to read only at the ~400px mobile thumbnail.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/white ink, clearly visible against the dark background. Legend box uses a slightly lighter elevated dark fill with light grey/white text — fully readable, no dark-on-dark issue anywhere.
      Data: Same five tier colors and same graph topology as the light render — node fill colors, edge color (grey, alpha-blended) and arrowhead style are identical, confirming only chrome (background/text/legend box) flipped between themes.
      Legibility verdict: PASS — title, legend, and node labels are all clearly visible against the dark background; no dark-on-dark or light-on-light failures observed.
