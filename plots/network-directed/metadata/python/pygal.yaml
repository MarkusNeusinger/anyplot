  strengths:
  - Every edge ends in an open arrowhead whose tip touches the target node's border,
    one consistent style throughout
  - Edges drawn in a muted ink blended toward the page, thinner and lighter than the
    Imprint-coloured nodes in both themes
  - Vectorised numpy force-directed layout gives evenly spaced nodes with no overlaps
  - pygal.XY pinned to canvas units (xrange/range) so geometry is computed in pixel
    space, with per-series stroke_style for line joins
  - Theme-adaptive chrome correct in both renders; HTML output keeps pygal's native
    tooltips
  weaknesses:
  - 'VQ-05 (both): the bottom legend row starts flush at the left canvas edge (first
    swatch about 8 px from the border) while about 190 px stay empty on the right,
    so the row sits off-centre under the centred graph → equal side margins of about
    100 px each (+90 px on the left). Likely cause: margin=0 with legend_at_bottom_columns=n_nodes
    spreading the columns over the full width.'
  - 'Suggestion: direct node labels next to each node would spare the reader matching
    eight hues against the legend.'
  - 'Suggestion: the edge and arrowhead loops compute the same unit vector and tip
    twice; one loop could add both series.'
