review:
  strengths:
  - 'Solves the "no ggraph" constraint natively and correctly: manual hierarchical
    layout with join-based edge-trimming so arrowheads land just short of the target
    node instead of disappearing underneath it.'
  - Correct Imprint palette usage in canonical order, with node-label fill/color both
    driven by theme tokens so labels stay legible regardless of the node's category
    color or the active theme.
  - Edge weight (calls_per_day) is meaningfully mapped to arrow thickness, adding
    real information beyond plain connectivity.
  - Both themes verified pixel-consistent for data colors; only chrome (background,
    ink, legend frame) flips.
  weaknesses:
  - Edge density in the middle of the graph (around api_client/validators) causes
    visual clutter -- several arrows cross closely together or pass near non-target
    nodes, making individual dependency paths harder to trace at a glance.
  - Consider slightly increasing edge alpha contrast or adding curvature for crossing
    edges, or reducing trim_frac/arrow size marginally, to help disentangle the busiest
    crossing region without changing the layout.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Title "network-directed · r · ggplot2 · anyplot.ai" centered in dark ink, clearly legible. Node labels in dark ink on an opaque off-white patch below each node, legible regardless of node fill color. Bottom legend "Architecture layer" in a bordered box with dark text, two rows of swatches.
      Data: 13 nodes colored with the Imprint palette in canonical order (Foundation=#009E73 green, Core services=lavender, Domain logic=blue, Application=ochre, Entry point=red). Gray arrows (closed arrowheads) connect nodes with thickness proportional to calls_per_day, trimmed short of the target node so arrowheads are visible. First categorical series confirmed as #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Title, node labels, and legend text render in light ink, clearly legible against the dark background. No dark-on-dark failures observed. Legend border and background adapt to the elevated dark surface.
      Data: Node fill colors are pixel-identical to the light render (green/lavender/blue/ochre/red). Arrow color uses the lighter INK_SOFT gray for this theme and remains clearly visible against the dark background.
      Legibility verdict: PASS
