review:
  strengths:
  - Faithful to the spec's suggested "software package dependency" scenario, with
    a genuine topological layering (longest-dependency-chain layer assignment via
    edge relaxation to a fixpoint) substituting for the banned NetworkLayout.jl, clearly
    explained in comments
  - Indegree-driven node sizing gives visual weight to heavily-depended-upon nodes
    (e.g. the "logging" sink), reinforcing the dependency story rather than being
    purely decorative
  - Tier-based Imprint palette color coding (Applications=green, Services=lavender,
    Infrastructure/utilities=blue, Data format=ochre, Core=red) doubles as real information,
    not decoration, and matches the canonical palette order for an abstract ordinal
    category
  - Implements the spec's explicit suggestion to curve an edge ("cli → logging") around
    intermediate nodes via a dog-leg waypoint to avoid cutting through unrelated nodes
  - Theme-adaptive chrome correctly implemented; categorical node colors are pixel-identical
    between light and dark renders, only chrome (background, text, edge alpha reference)
    flips
  weaknesses:
  - Edge crossings create visual clutter near the middle of the graph (around the
    'auth'/'renderer' services layer) — several arrows cross unnecessarily; reordering
    nodes within each layer with a barycenter/crossing-minimization heuristic would
    reduce clutter and improve visual refinement
  - Large empty gap (roughly a quarter of the canvas height) between the bottom node/label
    ('logging') and the legend row — tighten `rowsize!(fig.layout, 2, Auto(0.12))`
    or the axis y-limits so the legend sits closer to the graph and canvas utilization
    improves
  - 'Minor: helper functions (`pull_in`, `draw_arrow!`) deviate from the pure top-down
    "Imports → Data → Plot → Save" KISS script convention — acceptable given the geometric
    math required, but could be simplified/inlined'
  - Library Mastery is generic beyond the layout work itself — consider a more Makie-distinctive
    touch (e.g. a genuinely curved/Bezier path for the routed edge instead of a straight
    dog-leg) to better showcase library-specific features
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "network-directed · julia · makie · anyplot.ai" in bold dark ink at top, clearly readable. Node ID labels (webapp, cli, api-client, auth, renderer, http, config, crypto, cache, svg-utils, json, logging) sit below each node in dark ink, all legible. Legend at the bottom ("Applications", "Services", "Infrastructure/utilities", "Data format", "Core") uses matching dark text with colored circular swatches, fully readable, no frame box.
      Data: 12 nodes arranged in 5 hierarchical layers (diamond composition), colored by tier from the Imprint palette - green (Applications), lavender (Services), blue (Infrastructure/utilities), ochre (Data format), red (Core). Node size scales with in-degree. Directed edges are soft gray arrows (~55% alpha) with visible arrowheads pointing from consumer to dependency; one edge (cli → logging) is routed as a dog-leg to avoid cutting through unrelated nodes.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, node labels, and legend text now rendered in light ink, clearly legible against the dark background. No dark-on-dark text observed anywhere (title, node labels, legend text, and tier names are all light-colored and crisp).
      Data: Node colors are pixel-identical to the light render (green/lavender/blue/ochre/red tier colors unchanged) - only the background and text chrome flipped, exactly as required. Arrow color/alpha is unchanged and remains clearly visible against the dark surface.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark failures.
