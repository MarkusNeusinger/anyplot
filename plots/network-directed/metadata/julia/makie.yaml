review:
  strengths:
  - 'Both Attempt-1 weaknesses are directly addressed: the graph-to-legend gap is
    tightened (rowgap!(fig.layout, 0), rowsize!(..., Auto(0.05))) and a barycenter/median-neighbor
    reordering pass now runs across layers to reduce edge crossings'
  - Genuine topological layering (longest-dependency-chain via edge relaxation to
    a fixpoint) plus barycenter reordering substitutes convincingly for the banned
    NetworkLayout.jl, and is clearly commented
  - Indegree-driven node sizing gives visual weight to heavily-depended-upon nodes
    (e.g. the 'logging' sink), reinforcing the dependency story
  - Tier-based Imprint palette color coding doubles as real information, not decoration,
    and matches canonical palette order for an abstract ordinal category
  - Theme-adaptive chrome correctly implemented; data colors pixel-identical between
    light/dark renders
  weaknesses:
  - A handful of edge crossings remain in the top two tiers (Applications -> Services
    fan-out) - largely unavoidable given two nodes each connecting to overlapping
    subsets of three service nodes, but a further alternating-sweep iteration count
    bump could shave off one or two more crossings
  - Arrow linewidth/arrowsize are on the thin side for a dense 2400x2400 canvas with
    19 edges; slightly bolder strokes would read better at small preview sizes (400px)
  - Edge weight (optional per spec) isn't used to vary arrow thickness - would add
    another dimension of information for minimal extra code
  image_description: |-
