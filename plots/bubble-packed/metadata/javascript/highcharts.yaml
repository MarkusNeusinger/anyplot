review:
  strengths:
  - Genuinely implements the spec's core requirement (area-correct sizing, non-overlapping
    physics-based packing, group clustering with tighter same-group / looser cross-group
    spacing) despite the packedbubble series type living in an unloaded module — a
    real force simulation, not a fake substitute.
  - 'Full Imprint palette compliance: first series (Platform) is #009E73, remaining
    groups follow canonical positions 2-4, identical data colors between light and
    dark, theme-correct chrome (background, title, subtitle, legend, tooltip) in both
    renders.'
  - Adaptive per-bubble label fitting (two-line name+value, single-line, or ellipsis-truncated,
    with a computed font size) keeps text inside every circle regardless of radius,
    avoiding overlap or overflow across 24 differently-sized bubbles.
  - Auto-fit view via the onLoad callback's setExtremes() call scales the packed cluster
    to use the available plot area rather than leaving it at a fixed, potentially
    awkward size.
  - Realistic, neutral business scenario (monthly cloud infrastructure spend by service/team)
    with a wide, well-differentiated value range ($21K-$210K) and clear grouping into
    4 teams.
  weaknesses:
  - Smallest bubbles (e.g. 'WAF $21K', 'Compliance Sc...') carry the smallest fonts
    (~9px) and least label detail (value line dropped, or name truncated with an ellipsis)
    — at mobile scale (~400px canvas width) these labels will be difficult or impossible
    to read; acceptable as a fallback for very small circles, but worth noting for
    repair consideration.
  - 'Whitespace is not fully balanced: a noticeably larger empty margin sits above
    the cluster (between the subtitle and the first bubble row) than below it, and
    the four-quadrant clustering leaves visible empty space in the canvas corners.'
  - CQ-01 (KISS structure) is only partially met — the implementation defines several
    helper functions (rand, radiusFor, fitLabel, fits) beyond a flat imports->data->plot
    script; justified here by the packing-simulation complexity, but still a deviation
    from the strict KISS ideal.
  - Because Highcharts' native packedbubble series isn't available (highcharts-more
    not loaded), the implementation falls back to a manual scatter-plus-fixed-radius-marker
    technique rather than a single idiomatic high-level Highcharts API call — the
    correct workaround per the library rules, but it slightly caps Library Mastery
    (LM-01) versus a plot type with a direct native series match.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) - correct, not pure white.
      Chrome: Bold dark title "bubble-packed · javascript · highcharts · anyplot.ai" and a gray subtitle ("Monthly cloud spend by service ($K) — circle area = spend, color = team") are both clearly readable against the light background. A horizontal legend at the bottom ("Platform", "Data", "Growth", "Security") with matching color swatches is fully legible.
      Data: 24 circles of varying size, packed without overlap into four loosely clustered quadrants by team. Colors are Platform=green (#009E73), Data=lavender/purple, Growth=blue, Security=ochre — matching the Imprint canonical order with the brand green first. Each circle has a thin light-colored (page-background-colored) stroke for separation and a white/dark-outlined data label (name + "$XXK" value for larger circles, name only or truncated for the smallest).
      Legibility verdict: PASS - all chrome and most data labels are readable; the smallest 3-4 bubbles have very small (~9px) truncated labels that would be hard to read at mobile scale, but nothing is unreadable at full resolution.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) - correct, not pure black.
      Chrome: Title and subtitle switch to light-colored text, clearly readable against the dark background. Legend text and swatches remain legible; no dark-on-dark text observed anywhere.
      Data: Same four circle colors as the light render (green/lavender/blue/ochre) - confirmed identical data-color values; only the chrome (background, text) flipped as expected. Circle stroke color adapts to the dark page background.
      Legibility verdict: PASS - no dark-on-dark or light-on-light failures; same minor small-bubble label size caveat as the light render.
