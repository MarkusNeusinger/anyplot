review:
  strengths:
  - Custom, deterministic circle-packing implemented via iterative pairwise collision
    relaxation with a seeded LCG — a genuinely sophisticated technique not available
    out-of-the-box in Chart.js's stock bubble type, and it correctly scales radius
    by sqrt(value) so bubble AREA (not radius) encodes value, matching the spec's
    explicit requirement.
  - Per-bubble WCAG-luminance-based text-color selection (labelColorFor/relativeLuminance/contrastRatio)
    picks dark or light label text against every fill color in both themes — an accessibility-driven
    detail most implementations skip.
  - Correct Imprint palette usage in canonical order (green Engineering, lavender
    Marketing, blue Operations), identical data colors across light/dark renders,
    and theme-adaptive chrome (title, legend text via t.ink).
  - Realistic, neutral business scenario (department budgets in $k) with grouped clustering,
    meaningfully varied values across 15 categories, and all spec-required fields
    (label, value, group) plus a manually drawn legend kept off the Chart.js layout
    system so circles stay perfectly round.
  weaknesses:
  - 'Canvas utilization is poor: the three group clusters sit at widely-separated
    fixed anchor centers (320,400 / 900,400 / 610,830 in a 1200x1130 layout space)
    leaving large blank voids — a broad empty strip under the title, a wide vertical
    gap between the Engineering and Marketing clusters, and dead space below/right
    of the Operations cluster. Actual bubble ink likely covers well under 30% of the
    2400x2400 canvas. Fix: enlarge MAX_R and/or reduce CROSS_GROUP_GAP so clusters
    grow to fill available space, reposition anchors to reach all four canvas quadrants,
    or otherwise rebalance the layout so packed content occupies at least 40-50% of
    the canvas.'
  - The smallest bubbles (SEO $95k, Legal $120k, Brand $140k) render two lines of
    text at the 9px font floor — legible at full 2400px resolution but will be nearly
    illegible once the PNG is scaled down to a ~400px mobile width. Consider dropping
    the value line (or showing only an abbreviated label) below a radius threshold
    instead of always cramming two lines into every circle.
  - The legend sits isolated in the top-left corner, far from the Marketing and Operations
    clusters on the right/bottom of the canvas, rather than being positioned near
    the plotted content.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "bubble-packed · javascript · chartjs · anyplot.ai" is bold dark text, centered at top, clearly readable. A manually-drawn vertical legend in the top-left lists "Engineering" (green dot), "Marketing" (lavender dot), "Operations" (blue dot) in dark text, all readable.
      Data: Three separate packed-circle clusters — green cluster top-left (Backend $420k, Frontend $310k, Mobile $265k, DevOps $190k, QA $150k), lavender cluster top-right (Digital Ads $380k, Content $210k, Events $175k, Brand $140k, SEO $95k), blue cluster bottom-center (Facilities $260k, Finance $230k, HR $205k, IT Support $165k, Legal $120k). First series (Engineering) is the brand green #009E73 as required. Each circle carries a two-line label (department name + dollar value) with automatically chosen dark or light text for contrast against its fill.
      Legibility verdict: PASS — all text is readable against the light background; no light-on-light issues. Large blank areas of canvas surround and separate the three clusters (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 — not pure black, not light.
      Chrome: Title and legend text switch to light/white and remain clearly readable against the dark background — no dark-on-dark failures observed.
      Data: The three clusters retain identical fill colors to the light render (same green #009E73, lavender, blue), confirming palette consistency across themes. In-bubble label contrast logic still picks appropriately readable text color per bubble in the dark theme.
      Legibility verdict: PASS — no dark-on-dark text; brand green remains clearly visible. Same large blank canvas regions as in the light render, confirming the layout/whitespace issue is theme-independent.
