review:
  strengths:
  - Circle area, not radius, is proportional to revenue (r = scale·√value, with the
    scale derived from the drawing area), so Cloud Storage at 95 reads as about twice
    the area of Video Conferencing at 38 (both renders).
  - Four division clusters are packed tight, with clear spacing between groups; collision-only
    passes after the anchored simulation leave no circle crossing another.
  - 'Label ink is picked per group by a WCAG contrast calculation: near-black on green,
    lavender and ochre, off-white on blue. Every label stays readable in both themes,
    and the data colors match between them.'
  - 'A clear label hierarchy: bold names in two lines where the circle can hold them,
    the value in regular weight below, value only in mid-size circles, and nothing
    in circles too small for text.'
  - 'Idiomatic MUI X composition: a custom SVG layer that reads its bounds from useDrawingArea()
    inside ChartsContainer with skipAnimation, plus native SVG <title> tooltips that
    carry label, group and value in the HTML view.'
  - The subtitle states the encoding (Area ∝ Annual revenue ($M)) and the total of
    1,483, so the chart needs no axes.
  weaknesses:
  - 'Suggestion: the name-fit heuristic leaves Video Conferencing (38) with only its
    value, while smaller circles such as Developer Tools (27) show their name; a two-line
    split on the longest word could name it too.'
  - 'Suggestion: a slightly higher FILL_RATIO or ANCHOR_SPREAD closer to 1 would shrink
    the wide empty cross between the four clusters and give the bubbles more of the
    square.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, with no axes and no grid (correct for packed bubbles).
      Chrome: the title "bubble-packed · javascript · muix · anyplot.ai" in bold dark ink at the top left; a subtitle in soft ink ("36 bubbles (Product line) · 4 groups (Division) · Area ∝ Annual revenue ($M), total 1,483"); an HTML legend row with four round swatches. All of it is readable.
      Data: 36 circles in four clusters on a 2x2 grid: Consumer Electronics #009E73 (top left), Software & Cloud #C475FD (top right), Industrial Equipment #4467A3 (bottom left), Health & Wearables #BD8233 (bottom right). The circles touch or nearly touch with thin page-colored outlines, and none overlaps another. Large circles carry a bold name (one or two lines) over the value; mid-size circles show the value only. Label ink is dark on green, lavender and ochre, and light on blue, so every label is readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title is in light ink and the subtitle and legend labels in a light soft ink, all clearly readable. There is no dark-on-dark text.
      Data: the circle colors, positions and in-circle label inks are identical to the light render; only the page and the chrome flipped. Brand green #009E73 stays clearly visible.
      Legibility verdict: PASS
