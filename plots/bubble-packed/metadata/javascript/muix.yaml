review:
  strengths:
  - Circle radius is radiusScale * sqrt(value), so area is proportional to revenue,
    as the spec asks; the 89 vs 42 bubbles read correctly by area.
  - Four clearly separated group clusters with spacing between them, colored in Imprint
    order (#009E73 first) and identified by a compact header legend.
  - Label ink per group is chosen by a WCAG contrast computation (dark text on green/purple/amber,
    light on blue), so every in-bubble label is readable in both themes; names show
    only where the circle is large enough and small circles keep just their value.
  - Composes a custom SVG layer inside ChartsContainer via useDrawingArea, with skipAnimation
    and window.ANYPLOT_SIZE per the harness contract; native <title> tooltips give
    label, group and value in the HTML view.
  - Deterministic seeded LCG for the initial jitter; realistic, neutral product-line
    revenue scenario.
  weaknesses:
  - 'SC-02 (both): circles still cross after the relaxation — Analytics Platform and
    Developer Tools overlap by about 5 CSS px (visible notch in the Software & Cloud
    cluster), with smaller crossings for Cloud Storage/AI Assistant (~1.5 px), CRM
    Software/Collaboration Suite (~1 px) and Industrial Sensors/Quality Scanners (~1
    px); the spec''s ''none crossing another'' bullet is missed → 0 px overlap (≥
    +5 px separation). Likely cause: the boundary clamp runs after the pairwise collision
    pass in the last iteration; finish with a few collision-only passes (no attraction,
    no clamp) or raise ITERATIONS with a decaying ATTRACTION.'
  - 'VQ-07 (both): bubble fills use fillOpacity 0.94, so the data colors blend with
    the page and differ between themes (Consumer Electronics renders lighter, ~#12A47C,
    on #FAF8F1 than on #1A1A17) → identical palette colors in both renders (opacity
    1). Likely cause: fillOpacity={0.94} on <circle>.'
  - 'Suggestion: tighten ANCHOR_SPREAD so the four clusters sit closer and the large
    empty centre cross shrinks, giving the bubbles more size.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square.
      Chrome: bold title "bubble-packed · javascript · muix · anyplot.ai" top-left (~49% width), grey subtitle "36 bubbles (Product line) · 4 groups (Division) · Area ∝ Annual revenue ($M), total 1,483", and a header legend with four colored dots (Consumer Electronics, Software & Cloud, Industrial Equipment, Health & Wearables). No axes or grid. All text dark and readable.
      Data: 36 bubbles in four clusters (green top-left, purple top-right, blue bottom-left, amber bottom-right), separated by page-colored 2 px strokes. Larger circles carry bold name + value (e.g. Laptops 89, Cloud Storage 95); small ones show only the value (18, 29, 38, 15, 19, 12, 14, 17, 21). Dark ink on green/purple/amber, white ink on blue. Analytics Platform and Developer Tools visibly overlap by a few px. First series is #009E73 (rendered slightly lighter due to 0.94 opacity).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and legend labels in light grey; all readable, no dark-on-dark text.
      Data: identical layout and hue assignment as light; fills appear a touch deeper because 0.94 opacity blends with the dark page. In-bubble labels keep the same ink (dark on green/purple/amber, white on blue) and remain readable. Brand green clearly visible.
      Legibility verdict: PASS
