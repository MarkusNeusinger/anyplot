review:
  strengths:
  - 'Palette compliance verified by pixel-sampling both renders: series 1 (Consumer
    Electronics) is exactly #009E73, and all four division fill colors are byte-identical
    RGB between plot-light.png and plot-dark.png — only chrome (page background, legend/title
    ink) flips between #FAF8F1 and #1A1A17.'
  - Genuine force-directed packing (hand-rolled attraction-to-anchor + pairwise overlap
    resolution over 400 iterations), with circle area scaled by sqrt(revenue) so size
    differences read accurately, matching the spec's 'scale by area, not radius' note.
  - 'Optional grouping is well executed: four divisions cluster into clearly separated
    quadrants with visible whitespace between groups, exactly matching the spec''s
    ''clusters related circles with spacing between groups'' guidance.'
  - Deterministic LCG (seed 42) for the small jitter applied before packing keeps
    the layout fully reproducible.
  - 'Clean code: single default export, only the one used import (ChartContainer),
    skipAnimation set, chart sized from window.ANYPLOT_SIZE, no fake/simulated UI.'
  - 'Canvas gate passed (2400x2400 square, matching the `anyplot-orientation: square`
    directive); no edge clipping of title, legend, or bubble labels in either render.'
  weaknesses:
  - 'On-bubble label text uses fill={t.pageBg}, tying text color to the page theme
    rather than to each bubble''s own fill color. Measured contrast (WCAG formula)
    against the actual rendered pixel colors falls below the 4.5:1 AA baseline for
    several divisions: Software & Cloud (purple) bubbles in the LIGHT render are ~2.7:1
    (e.g. ''Productivity Suite $61M''), Health & Wearables (gold) bubbles in LIGHT
    are ~3.1:1, Consumer Electronics (green) bubbles in LIGHT are ~3.2:1, and Industrial
    Equipment (blue) bubbles in the DARK render are ~3.1:1 (e.g. ''Robotic Arms $71M'').
    Fix: choose each label''s text color from the bubble''s own fill luminance (e.g.
    a per-division light/dark ink pair) instead of the theme''s pageBg token, so labels
    stay high-contrast against their own circle color in both themes.'
  - ChartContainer is used only as a bare SVG canvas (series=[], margin 0) — circles,
    labels, legend, and physics are all hand-drawn SVG, with none of MUI X's own affordances
    used (no ChartsTooltip, no built-in ChartsLegend, no useDrawingArea, no scale
    primitives). This is a defensible fallback since the community package has no
    packed-bubble/circle-pack chart type, but the raw SVG `<title>` tooltip and hand-rolled
    legend forgo MUI X's interaction/legend components that would make the result
    feel more like a MUI X chart. Consider ChartsTooltip (custom trigger) for hover
    detail and ChartsLegend/useDrawingArea for chrome.
  - Many bubble labels are hard-truncated to just a few characters plus an ellipsis
    (e.g. 'Productivity Su…', 'Video Conferen…', 'Industrial Sen…', 'Packaging Mach…',
    'Fitness Tracke…', 'Glucose Monito…', 'Collaboration…'), hiding the category identity
    for a large share of the 35 products in the static PNG. Consider raising the min-radius
    gate for showing names, or a shorter fallback label (e.g. initials) instead of
    an awkward mid-word cut.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (confirmed by pixel sampling: RGB 250,248,241).
      Chrome: Title "bubble-packed · javascript · muix · anyplot.ai" in dark ink, top-left, clearly legible. Legend row below the title shows four swatches (Consumer Electronics, Software & Cloud, Industrial Equipment, Health & Wearables) with dark-ink labels — all clearly readable against the light background.
      Data: 35 circles packed into four spatially separated quadrants (one per division), sized by revenue (area-scaled) and colored by division. Series-1 (Consumer Electronics) swatch and bubbles sample to exactly #009E73 (brand green), matching the Imprint palette requirement. Larger bubbles show a bold product name plus a "$XXM" value in cream-colored text (fill tied to the page background token); smaller bubbles show only the value; the smallest show neither.
      Legibility verdict: PASS for title/legend/chrome. PARTIAL FAIL for in-bubble text: measured contrast of the cream label text against several bubble fill colors falls below WCAG AA 4.5:1 for body text — Software & Cloud (purple) bubbles measure ~2.7:1, Health & Wearables (gold) ~3.1:1, Consumer Electronics (green) ~3.2:1. Text remains readable but is lower-contrast than it should be.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (confirmed by pixel sampling: RGB 26,26,23).
      Chrome: Title and legend text render in light ink, clearly legible against the dark background — no dark-on-dark chrome failures found.
      Data: Confirmed via pixel sampling that all four division fill colors are byte-identical to the light render (e.g. Consumer Electronics = RGB 0,158,115 in both renders) — only chrome flips between themes, as required. In-bubble labels flip to near-black text (same fill={t.pageBg} pattern, now resolving to the dark token) on top of the same saturated bubble colors.
      Legibility verdict: PASS for title/legend/chrome. PARTIAL FAIL for in-bubble text on Industrial Equipment (blue) bubbles specifically: near-black text on the blue fill measures ~3.1:1, below the 4.5:1 AA baseline (e.g. "Robotic Arms $71M"). Other divisions actually gain contrast in dark mode (green ~5.2:1, purple ~6.1:1, gold ~5.4:1) since near-black text sits well on their brighter dark-mode-rendered fills.
