review:
  strengths:
  - Force-simulation packing with a post-tick clamp and a vertical-spread rebalance
    produces tight, natural-looking clusters with no wasted whitespace
  - Relative-luminance label-ink computation keeps in-bubble text legible against
    any of the four palette fills, in both themes
  - Hero-bubble stroke emphasis and cluster labels doubling as the legend add real
    data storytelling without extra chrome
  weaknesses:
  - Smallest labeled value line runs close to the lower comfortable font-size bound;
    consider a slightly higher floor for the value tspan
  - Small (r <= 50) bubbles carry no value label at all, so their exact magnitude
    is only inferable by relative size - acceptable for this chart type but worth
    noting as a minor coverage gap
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Bold dark title centered at top ("R&D Budget by Project · bubble-packed · javascript · d3 · anyplot.ai"); four colored cluster labels (AI & ML green, Cloud Infra purple, Hardware blue, Dev Tools amber) above each bubble group, doubling as the legend. All readable.
      Data: First categorical series (AI & ML) is #009E73; bubbles packed via force simulation, sized by scaleSqrt (area-proportional) to value; largest bubble per group has a bolder "hero" stroke; large bubbles show two-line name + value ("$118M") in luminance-computed contrast ink; small bubbles unlabeled dots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17
      Chrome: Title and cluster labels render in light ink, clearly legible against the dark surface. No dark-on-dark issues.
      Data: Bubble fill colors identical to the light render (green/purple/blue/amber) - only chrome flipped. In-bubble label ink still contrasts correctly since it's computed from bubble fill luminance, not page background.
      Legibility verdict: PASS
