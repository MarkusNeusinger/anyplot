review:
  strengths:
  - Correct area-proportional sizing via d3.scaleSqrt with force-simulation collision
    packing (forceX/forceY/forceCollide) — matches the spec's 'scale by area, not
    radius' and 'force simulation to avoid overlap' requirements exactly.
  - 'Clever inline legend: colored group labels above each cluster double as the categorical
    legend, avoiding a redundant legend box while keeping the Imprint palette in canonical
    order (#009E73 first, then lavender/blue/ochre for the remaining groups).'
  - Luminance-aware label ink (relativeLuminance/labelInk) keeps in-bubble text readable
    regardless of which Imprint hue the circle uses, and word-wraps + auto-sizes labels
    to the available chord so text never spills outside its own bubble.
  - Realistic, neutral R&D budget dataset with genuine value variation ($8M-$132M)
    across four plausible departments, exercising both the labeled (r>50) and unlabeled
    small-bubble code paths — good DQ-01 feature coverage.
  weaknesses:
  - 'Vertical whitespace is concentrated in two large, unbalanced gaps rather than
    distributed evenly: roughly 20% of canvas height is empty between the group labels
    and the bubble clusters, and another ~20% is empty below the clusters down to
    the canvas bottom. Push clusterCenterY/bubbleBottom lower or strengthen the y-force
    so the packing uses more of the available vertical space, and balance the top/bottom
    margins.'
  - No value/size legend or in-bubble value label is shown anywhere — only project
    name and relative circle size communicate budget. A small reference circle or
    a subtle '$M' value under each label would sharpen data storytelling (DE-03) and
    let readers read exact magnitudes, not just rank order.
  - Aesthetic polish is solid but still fairly plain (flat fills, uniform stroke treatment)
    — for a 90+ score, add a touch more visual sophistication, e.g. a subtle stroke
    or size-driven emphasis on the largest 'hero' bubble per cluster to reinforce
    the hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "R&D Budget by Project · bubble-packed · javascript · d3 · anyplot.ai" is bold dark ink, fully readable, ~55% of canvas width (well within the safe range). Four group labels ("AI & ML", "Cloud Infra", "Hardware", "Dev Tools") sit above their clusters in the matching Imprint hue and are clearly legible against the light surface.
      Data: 24 circles clustered into 4 groups. First group (AI & ML) uses brand green #009E73, then lavender, blue, and ochre for the remaining three groups — canonical Imprint order. Circle area scales with budget value; larger circles (Foundation Models, Custom AI Chips, Container Orchestration) carry white/dark auto-contrasted labels, smaller circles are unlabeled. No overlap between circles or labels.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in light ink, group labels keep their same Imprint hues (green/lavender/blue/ochre) and remain clearly legible against the dark surface — no dark-on-dark failures observed.
      Data: Same 24 circles, identical positions, identical Imprint colors as the light render (only the chrome flipped) — data-color identity confirmed. In-bubble label ink is chosen per-circle via a luminance check, so text stays readable on every hue in both themes.
      Legibility verdict: PASS.

    Cross-render note: both renders share the same underlying layout issue — a large empty band below the bubble clusters (roughly 20% of canvas height) and a similarly sized gap between the group labels and the clusters, leaving vertical whitespace unbalanced (concentrated at the bottom rather than distributed). This does not affect legibility but does affect canvas utilization (VQ-05).
