review:
  strengths:
  - 'Area-correct sizing: radii are sqrt-scaled so circle area is proportional to
    budget, and the force packing yields one compact cluster with no circle crossing
    another'
  - 'Fully theme-adaptive chrome: #FAF8F1 / #1A1A17 surfaces edge to edge, INK title
    and legend text, elevated legend fill; the Imprint tier fills are identical in
    both renders'
  - Label color follows each fill's luminance (white on green and blue, near-black
    on lavender and ochre), so every in-circle label reads on its fill in both themes
  - Two-level label typography (bold name over a softer value) sized by circle bracket,
    with labels only where they fit
  - 'Idiomatic bokeh: ColumnDataSource per tier built from the DataFrame, LabelSet
    layers, HoverTool on the circle renderers and a hide-on-click legend in the HTML
    artifact'
  weaknesses:
  - 'VQ-01 (both): the department names and values inside the circles, the plot''s
    main content, are set at 18/14/12 pt (names) and 14/12/9 pt (values), and the
    legend labels at 22 pt, against the 34 pt tick and legend reference of the bokeh
    prompt; the 9 pt values in Legal ($8M) and Security ($6M) and the 12 pt names
    in IT, QA and HR read small inside their circles → about 34/28/22 pt names and
    28/22/16 pt values (roughly +12 to +16 pt), legend labels 34 pt (+12 pt), keeping
    labels only in circles large enough to hold them. Likely cause: the `brackets`
    font sizes and `p.legend.label_text_font_size = "22pt"`.'
  - 'VQ-03 (both): the legend keys render as dots of about 12 px beside the 22 pt
    labels, a speck next to the 40 px glyph box that is set → keys about as tall as
    the label. Likely cause: `p.circle(radius=...)` in data units draws its legend
    glyph at a tiny scaled radius; use a separate size-based `scatter` renderer per
    tier for the legend, or `LegendItem` with a fixed-size glyph.'
  - 'Suggestion: cluster circles by tier with small gaps between the groups, the optional
    grouping the Notes allow, so the tier structure reads from position as well as
    color.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, edge to edge; a thin INK_SOFT outline frames the plot area
      Chrome: title 'Department Budgets by Spending Tier · bubble-packed · python · bokeh · anyplot.ai' in near-black bold across ~90% of the width; legend top right on #FFFDF6 with near-black labels >$35M, $20–$35M, $10–$19M, <$10M; no axes or grid
      Data: 15 packed circles — green #009E73 (Engineering, R&D, Sales), lavender #C475FD (Marketing, Product, Operations, IT, Data Science), blue #4467A3 (Finance, Design, Customer Support, HR, QA), ochre #BD8233 (Legal, Security); page-colored outlines; bold name plus value inside each circle, white on green/blue, near-black on lavender/ochre. Legend keys are small dots
      Legibility verdict: PASS — everything readable; the 9 pt values in Legal and Security and the 12 pt names in smaller circles read small

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 edge to edge
      Chrome: title and legend labels in light #F0EFE8; legend on #242420 with INK_SOFT border; no dark-on-dark text
      Data: same 15 circles in the same Imprint fills and positions as the light render; in-circle label colors unchanged and readable on their fills
      Legibility verdict: PASS — same small-label caveat as light
