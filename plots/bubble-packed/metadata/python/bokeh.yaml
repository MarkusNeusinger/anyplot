review:
  strengths:
  - 'Area-correct sizing: radii are sqrt-scaled so circle area is proportional to
    budget, and the force packing yields one compact cluster with no circle crossing
    another'
  - 'Fully theme-adaptive chrome: #FAF8F1 / #1A1A17 surfaces edge to edge, INK title
    and legend text, elevated legend fill; the Imprint tier fills are identical in
    both renders'
  - Label color follows each fill's luminance (white on green and blue, near-black
    on lavender and ochre), so every in-circle label reads on its fill in both themes
  - Two-level label typography (bold name over a softer value) sized by circle bracket,
    with labels only where they fit
  - 'Idiomatic bokeh: ColumnDataSource per tier built from the DataFrame, LabelSet
    layers, HoverTool on the circle renderers and a hide-on-click legend in the HTML
    artifact'
  weaknesses:
  - 'VQ-01 (both): the smallest label bracket sets the values in Legal ($8M) and Security
    ($6M) at 16 pt and their names at 20 pt; inside the 34/28 pt hierarchy of the
    large circles these values read small → about 20 pt values and 24 pt names in
    the smallest bracket (+4 pt), which still fit those circles. Likely cause: the
    third `brackets` row ("20pt", "16pt").'
  - 'VQ-03 (both): the legend keys render as dots of about 20 px beside the 34 pt
    (~45 px) labels, still a speck in the 48 px glyph box → keys about as tall as
    the label. Likely cause: the off-canvas `p.scatter(size=44)` key renderers are
    scaled down inside the legend glyph box; draw the key with a larger marker size
    (or a `glyph_height`/`glyph_width` that the marker fills).'
  - 'Suggestion: cluster circles by tier with small gaps between the groups, the optional
    grouping the Notes allow, so the tier structure reads from position as well as
    color.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 edge to edge, square 2400x2400; thin INK_SOFT frame around the plot area
      Chrome: title 'Department Budgets by Spending Tier · bubble-packed · python · bokeh · anyplot.ai' in near-black bold across ~90% of the width, fully visible; legend top right on #FFFDF6 with 34 pt near-black labels >$35M, $20–$35M, $10–$19M, <$10M; keys are small dots; no axes or grid
      Data: 15 packed circles — green #009E73 (Engineering, R&D, Sales), lavender #C475FD (Marketing, Product, Operations, IT, Data Science), blue #4467A3 (Finance, Design, Customer Support, HR, QA), ochre #BD8233 (Legal, Security); page-colored outlines; bold name over value inside each circle, white on green/blue, near-black on lavender/ochre; names now 34/26/20 pt
      Legibility verdict: PASS — all readable; the 16 pt values in Legal and Security read small

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 edge to edge
      Chrome: title and legend labels in light #F0EFE8; legend on #242420 with INK_SOFT border; no dark-on-dark text
      Data: same 15 circles in the same Imprint fills and positions as the light render; in-circle label colors unchanged and readable on their fills
      Legibility verdict: PASS — same small-value caveat as light
