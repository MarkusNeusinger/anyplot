review:
  strengths:
  - Physics-based packing from a deterministic spiral start
  - Luminance-based ink choice for text inside circles with a faint patheffects stroke
  - Imprint positions 1-4 in canonical order with brand green first; theme-adaptive
    chrome
  - PatchCollection draws all circles in one artist with a page-coloured outline
  weaknesses:
  - 'VQ-01 (dark): ''Customer Support'' and ''Operations'' labels overflow their circles,
    so the dark #1A1A17 letters outside the fill sit on the #1A1A17 page and cannot
    be read → labels only inside circles that hold them, the rest outside in INK_SOFT.
    Likely cause: min_r_for_label = 0.48 + 0.018·chars underestimates the bold label
    width.'
  - 'VQ-02 (both): in-circle labels collide — ''Customer Support'' over its ''$200K'',
    ''QA'' over ''$175K'', ''HR'' over ''$160K'' — and the Legal and Security leader
    lines strike through their own label text → name and value clear of each other
    and leaders ending at the label edge. Likely cause: fixed value_y_offset fractions
    of the radius for small circles and xytext placed at only r + 0.65 with the text
    centred on the leader end.'
  - 'SC-03 (both): radius = 0.30 + 1.70·sqrt((v−min)/(max−min)) makes area non-proportional
    to value — Legal (130) to Engineering (950) is a 1:44 area ratio for a 1:7.3 value
    ratio (C1) → radius ∝ sqrt(value). Likely cause: the min_radius offset and min-max
    normalisation.'
  - 'SC-02 (both): groups are only partly clustered — R&D sits apart from the other
    Engineering circles, Customer Support apart from Operations, the three Compliance
    circles scattered (C4) → related circles clustered with spacing between groups.
    Likely cause: group_pull 0.04 too weak against the central pull over 500 iterations.'
  - 'Suggestion: move the legend so the cluster balances the square canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Title "bubble-packed · python · matplotlib · anyplot.ai" at the top in dark ink; no axes or grid; framed legend in the lower right (Engineering, Business, Operations, Compliance) in INK_SOFT.
      Data: 15 department-budget circles, Engineering #009E73, Business #C475FD, Operations #4467A3, Compliance #BD8233, page-coloured outlines. Most circles carry a name and "$NNNK" value inside; Legal and Security are labelled outside with very short leaders that strike through their own text. "Customer Support" overflows its small blue circle and collides with "$200K"; "QA"/"$175K" and "HR"/"$160K" overlap; "Operations" touches the circle edge. Circle sizes come from an offset radius, so the smallest circles are shrunk out of proportion.
      Legibility verdict: PASS with collisions (text readable on the light page but several labels overlap)

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title, legend text and external labels flip to light ink; legend frame #242420.
      Data: Same group colours as the light render. In-circle labels stay dark ink, so the parts of "Customer Support" and "Operations" that overflow their circles are dark-on-dark on the #1A1A17 page and cannot be read.
      Legibility verdict: FAIL (dark-on-dark overflow of the Customer Support and Operations labels)
