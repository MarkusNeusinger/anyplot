review:
  strengths:
  - Area-proportional sizing with a force simulation that packs 15 circles
  - 'Idiomatic plotly: per-group traces for the legend, scaleanchor equal aspect,
    sizemode=''diameter'''
  - hovertemplate + customdata tooltips with budget and share
  - Groups sit next to each other, so the colors form coherent regions
  - Correct Imprint order, backgrounds and theme-token chrome in both renders
  weaknesses:
  - 'SC-01 (both): two arrow callouts (''Largest dept $4.5M — 16.5% of total'', ''Tech
    group: 47% of budget'') and a ''Total: $27.3M'' footer add an annotation layer
    the basic spec does not ask for → remove them. Likely cause: the two fig.add_annotation(showarrow=True)
    callouts and the paper-referenced total note.'
  - 'VQ-02, SC-02 (both): the ''Largest dept'' callout box sits on the R&D circle,
    hiding its label, and cuts the ''Product'' and ''Design'' labels; its arrow runs
    through the ''Engineering'' label, and ''Data Science'' spills past its circle
    (C5) → no box over the circles and every label inside its own circle. Likely cause:
    the callout anchored at Engineering with ay=-80 and the d > 30 label rule ignoring
    label width.'
  - 'VQ-01, SC-02 (both): near-white #F0EFE8 labels on lavender #C475FD (Sales, Marketing,
    about 2.4:1), ochre #BD8233 (Product, Legal, HR, Design) and green #009E73 (IT,
    QA, Data Science, Engineering) read at low contrast (C5) → dark ink #1A1A17 on
    those fills. Likely cause: the lum < 160 threshold on a non-WCAG luminance formula.'
  - 'VQ-05 (both): the round cluster fills only the middle ~40% of the 3200x1800 landscape
    canvas width, leaving wide empty bands on both sides → a square 2400x2400 canvas
    or a larger cluster. Likely cause: width=800, height=450 with the radii scaled
    to the plot height.'
  - 'Suggestion: give the groups a small gap between clusters so the divisions read
    as separate clusters.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'Department Budget Allocation · bubble-packed · python · plotly · anyplot.ai' centred in dark ink; no axes; framed horizontal legend (Technology, Revenue, Operations, Corporate) at the bottom; 'Total: $27.3M' footer bottom right; two framed arrow callouts ('Tech group: 47% of budget leads all four divisions', 'Largest dept $4.5M — 16.5% of total').
      Data: 15 circles in a compact cluster occupying the middle ~40% of a 3200x1800 canvas; Technology #009E73, Revenue #C475FD, Operations #4467A3, Corporate #BD8233; groups sit in adjacent regions. Near-white labels on every fill; the 'Largest dept' box covers the R&D circle and cuts the Product and Design labels, its arrow crossing 'Engineering'.
      Legibility verdict: PASS for chrome; in-circle labels on lavender, ochre and green read at low contrast.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend, footer and callout boxes (#242420) in light ink; no dark-on-dark text.
      Data: same colors and layout as the light render; the same callout overlap and label contrast.
      Legibility verdict: PASS for chrome; same in-circle label contrast weakness.
