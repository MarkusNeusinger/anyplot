review:
  strengths:
  - Circle area encodes the value (radius = sqrt(value/pi) * 3.5) and size_unit='x'
    with scale_size_identity draws the diameters in data units, so a value twice as
    large is twice the area
  - 'Whole square canvas painted in the page color in both themes via the one-panel
    gggrid, with Imprint colors in canonical order (Tech #009E73 first) and theme-correct
    chrome'
  - Three-tier in-bubble labelling (name + value for large circles, name only for
    medium, none for the smallest) keeps labels inside circles large enough to hold
    them
  - 'Subtitle claim computed from the data (Tech: 8 of 15 teams, 58 % of the budget)
    instead of typed in'
  - layer_tooltips gives department, budget and division on hover in the HTML output
  weaknesses:
  - 'SC-02 (both): the Business division is not one cluster: Marketing sits left of
    IT and Sales at the upper right, with R&D and IT between them, so the grouping
    does not show related circles together (C4) → both Business circles packed side
    by side in one cluster. Likely cause: the group pull (0.025 toward the centroid,
    first 1200 steps only) is too weak against collisions, and random r_init 3-20
    lets Tech circles land between the two.'
  - 'SC-02 (both): no visible spacing between the groups: Operations circles touch
    Analytics and Product, Marketing touches IT, at a gap of about 11 px → a gap between
    groups several times the within-group gap (about 3-4 layout units instead of 1.0).
    Likely cause: OTHER_GROUP_GAP = 1.0.'
  - 'SC-02 (both): neighbouring circles cross by a few pixels: the page-colored ring
    of one bubble bites into its neighbour (R&D''s bottom under IT, IT''s right side
    under QA, Ops under Finance, HR under the Legal circle) (C2) → circles that touch
    without crossing. Likely cause: the 1.5 stroke is drawn outside the layout radius,
    so min_dist = r_i + r_j + 0.25 is smaller than the drawn radii.'
  - 'VQ-01 (dark): bold #1A1A17 labels on the Operations blue fill (Finance, Ops,
    Support, HR) reach about 2.8:1 on the dark render (3.6:1 light) and read dim →
    label color following the fill, light text on the blue (at least 4.5:1). Likely
    cause: geom_text color fixed to "#1A1A17" for every fill.'
  - 'Suggestion: the two unlabeled small circles (Legal, QA) could carry a short name
    where it fits, so every department is identifiable without the tooltip.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400x2400 canvas, no unpainted strips.
      Chrome: title "Department Budget Allocation · bubble-packed · python · letsplot · anyplot.ai" in dark ink near the top (about 90 % of the width, not clipped), grey subtitle "Tech departments dominate — 8 of 15 teams control 58% of total budget", framed bottom legend "Division: Tech / Business / Operations" on the elevated surface. No axes or grid. All readable.
      Data: 15 packed bubbles with page-colored rings: Tech #009E73 green (8, a central-right cluster incl. Engineering $85M, R&D $72M, Product $68M), Business #C475FD lavender (Marketing left of IT, Sales upper right - split apart), Operations #4467A3 blue (lower-left cluster). Bold dark labels with name + value in large circles, name only in medium ones, none in Legal and QA. Neighbouring rings bite slightly into adjacent bubbles. First series is #009E73.
      Legibility verdict: PASS (dark labels on the blue fill are the weakest, about 3.6:1)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the whole canvas.
      Chrome: title in light ink, subtitle in soft grey, legend with light text on #242420 with a light frame; no dark-on-dark chrome.
      Data: same positions and the same Imprint categorical colors as light (fills slightly darker through alpha 0.92 over the dark page); rings now dark. Dark labels stay readable on green and lavender but read dim on the Operations blue (about 2.8:1).
      Legibility verdict: PASS (in-bubble labels on blue weak, see VQ-01)
