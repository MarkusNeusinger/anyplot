review:
  strengths:
  - Vectorized greedy placement plus force relaxation packs 20 circles into one compact
    cluster with no visible overlap
  - Three label tiers via per-layer data subsets keep name and value inside every
    circle without collisions
  - 'Correct Imprint palette with #009E73 first and theme tokens threaded through
    title, subtitle and legend in both renders'
  - Subtitle with per-group totals adds a group-level reading to the item-level sizes
  weaknesses:
  - 'SC-02 (both): circle radius is 0.22 + 0.78*sqrt(v/max), so area is not proportional
    to value (C1): Managed ($11B) is drawn at about 33 % of Cloud''s ($52B) area instead
    of 21 % (+12 points) → radius = sqrt(v/max) with no offset. Likely cause: MIN_RADIUS
    added to the sqrt scaling in the radius line.'
  - 'VQ-01 (both): white value labels at size 2.5-3.0 mm with alpha 0.85-0.9 on the
    lavender #C475FD Hardware fill (e.g. ''$12B'' in Peripherals, ''$18B'' in Displays)
    are low in contrast, about 2.6:1 → a dark INK label on light fills or full-opacity
    labels. Likely cause: color=''white'' with alpha<1 on every value geom_text.'
  - 'VQ-02 (both): the bold legend title ''Tech Segment'' touches the legend frame
    on its left and right edges → at least a few px of padding (smaller legend_title,
    about 8 pt, -1 pt). Likely cause: legend_title size=9 bold with legend_background
    framed.'
  - 'DQ-02 (both): labels ''Tech Svc'', ''Managed'' and ''APIs'' read as abbreviated
    stubs rather than real segment names → ''IT Services'', ''Managed Services'',
    ''API Platforms''. Likely cause: the LABEL list in the data block.'
  - 'Suggestion: cluster circles by group with spacing between the clusters, as the
    Notes allow, so group membership reads from position as well as color.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold dark title 'bubble-packed · python · plotnine · anyplot.ai' about 72 % of width; INK_SOFT subtitle 'Software: $159B · Hardware: $136B · Services: $90B · Consumer: $135B' renders cleanly; framed legend 'Tech Segment' at right with four swatches. All text readable.
      Data: 20 packed circles, Software #009E73, Hardware #C475FD, Services #4467A3, Consumer #BD8233, separated by thin page-colored outlines; white bold names and lighter values inside, tiered by size. Groups are interleaved, not clustered. First series is #009E73.
      Legibility verdict: PASS

