review:
  strengths:
  - Vectorized greedy placement plus force relaxation packs 20 circles into one compact
    cluster with no visible overlap
  - Radius = sqrt(v/max), so circle area is proportional to value as the spec asks
  - Label ink chosen from fill luminance through a color column and scale_color_identity
    keeps every label readable on its fill in both themes
  - Three label tiers via per-layer data subsets keep name and value inside every
    circle without collisions
  - 'Correct Imprint palette with #009E73 first and theme tokens threaded through
    title, subtitle and legend in both renders'
  weaknesses:
  - 'VQ-01 (both): in-bubble name and value labels at geom_text size 2.5-3.5 (plotnine
    size is in pt) render at roughly a third of the 8 pt legend text, e.g. ''$24B''
    in Analytics and ''Peripherals'' → about 6-8 pt for names and 5-7 pt for values
    in the large and medium tiers (+3 to +4). Likely cause: geom_text size=2.5/3.0/3.5
    read as mm.'
  - 'Suggestion: cluster circles by group with spacing between the clusters, as the
    Notes allow, so group membership reads from position as well as color.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold dark title 'bubble-packed · python · plotnine · anyplot.ai' at about 72 % of width; INK_SOFT subtitle 'Software: $159B · Hardware: $136B · Services: $90B · Consumer: $135B'; framed legend 'Tech Segment' at right on ELEVATED_BG with padding around the title and four swatches. All chrome text readable.
      Data: 20 packed circles, Software #009E73, Hardware #C475FD, Services #4467A3, Consumer #BD8233, thin page-colored outlines, area proportional to value (API Platforms clearly much smaller than Cloud). Labels dark ink on green, lavender and amber, white on blue; bold names with regular values in large and medium bubbles, names only in small ones. In-bubble labels are small relative to the legend text. Groups interleaved, not clustered. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title in light INK, subtitle in INK_SOFT, legend on elevated #242420 with light frame; no dark-on-dark text.
      Data: circle colors, layout and in-bubble label colors identical to the light render; labels sit on the fills so they read the same.
      Legibility verdict: PASS
