review:
  strengths:
  - 'True packing: every circle touches its neighbours and none crosses another, in
    one compact cluster'
  - 'Area-true sizing: radius = sqrt(value) and Vega size = diameter squared with
    scale=None, one px-per-unit on both axes'
  - Two-tier in-circle labels (name + budget in large circles, name only in small
    ones) with no collisions
  - Legend-bound selection_point dims the other divisions in the HTML, plus typed
    tooltips
  - Subtitle computed from the data names the leading division (39%) and the largest
    department
  - 'Theme-adaptive chrome: title, subtitle, legend fill, border and labels switch
    correctly; data colors identical across themes'
  weaknesses:
  - 'VQ-01 (both): white bold labels on the light lavender Revenue fill (Sales, Marketing,
    Support, #C475FD at 0.9 opacity) have about 2.5:1 contrast and read faint on that
    fill → label color follows the fill (dark ink on light fills such as lavender,
    white on dark ones). Likely cause: captions color=alt.value("#FFFFFF") for every
    circle.'
  - 'Suggestion: pack each division as its own cluster with spacing between groups,
    the grouping the Notes allow.'
  - 'Suggestion: the 580 x 548 view size is measured by hand; deriving it from the
    fitted layout would keep circles round if the title changes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "Department Budget Allocation · bubble-packed · python · altair · anyplot.ai" (~83% width), grey subtitle "Technology division leads at 39% of total budget — Engineering alone at $850K", framed "Division" legend top-left on an elevated fill; all readable. No axes, no grid.
      Data: 15 circles packed into one compact cluster, touching, none crossing, separated by a page-colored outline. Technology #009E73 (Engineering, R&D, Data Science, QA), Revenue lavender, Operations blue, Corporate ochre, Product red. Large circles show name + budget in bold white, small ones the name only. White on the lavender Revenue circles reads faint.
      Legibility verdict: PASS (white-on-lavender labels low-contrast but readable)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
