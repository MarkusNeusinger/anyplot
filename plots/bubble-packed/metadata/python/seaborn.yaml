review:
  strengths:
  - Custom greedy packing gives one compact, non-overlapping cluster, and radius =
    sqrt(value) keeps area proportional to market cap
  - Data-unit radii are converted to scatter points² after canvas.draw(), so seaborn's
    size mapping draws exactly the packed circles
  - Heavy ink ring on each sector's largest company creates a focal point per color
    group, and the ring color flips with the theme
  - Two-level labels (bold name over softer value) tiered by circle size; smallest
    circles show names only
  - 'Idiomatic seaborn: scatterplot with hue/hue_order/palette dict/size, set_theme
    rc tokens, move_legend for the sector legend'
  - 'Both themes fully adaptive: correct #FAF8F1 / #1A1A17 surfaces, light-on-dark
    chrome, no dark-on-dark text'
  weaknesses:
  - 'VQ-01 (both): the value labels of the eight medium circles render at 6 pt and
    the smallest name (Target) at 5 pt, below the style guide''s 8 pt, and read small
    — weakest in white on the lavender #C475FD Finance fill → names at 8 pt and values
    at 6–7 pt or larger where the circle holds them (+2 pt). Likely cause: the label
    tiers `fs_name = 8` / `6` / `5` and `fontsize=fs_name - 2`.'
  - 'SC-02 (both): the 8 pt bold names ''Mastercard'' and ''UnitedHealth'' are wider
    than their circles and spill past the outline, so the first and last letters sit
    white on the page or the neighbouring circle (C5: labels only in circles large
    enough to hold them) → a font size that fits the circle diameter, or a shorter
    label (about −1 pt). Likely cause: the size tiers keyed on the radius alone, not
    on the text width.'
  - 'VQ-07 (both): the circles are filled at alpha=0.90, so each Imprint color blends
    with the page and differs between the light and the dark render (Technology reads
    lighter than #009E73 on the light page) → opaque fills (alpha 1.0); the circles
    do not overlap, so translucency buys nothing. Likely cause: `alpha=0.90` in sns.scatterplot.'
  - 'DQ-02 (both): real company names (Apple, Microsoft, NVIDIA, JPMorgan, …) carry
    invented market caps → either real, sourced figures or fictional company names.
    Likely cause: the label and value lists of the data block.'
  - 'DQ-03 (both): Apple is shown at $180B and Microsoft at $160B, roughly a twentieth
    of their real market caps of about $3,000B → values on the real scale (about +2,800B
    for Apple) or fictional names. Likely cause: the MARKET_CAP list.'
  - 'Suggestion: packing each sector as its own cluster with spacing between groups
    (the grouping the Notes allow) would let the colors read as groups instead of
    being interleaved.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: two-line title 'Market Capitalization by Sector / bubble-packed · python · seaborn · anyplot.ai' in dark ink; axis off; framed 'Sector' legend at the bottom with four entries — all readable.
      Data: 17 circles in one packed cluster, Technology #009E73, Finance lavender, Healthcare blue, Retail ochre; heavy ink rings on the largest company per sector (Apple, Amazon, JPMorgan, UnitedHealth). White bold names and values: the five largest at 10/8 pt, medium circles at 8/6 pt, smallest names at 6 pt and Target at 5 pt. 'Mastercard' and 'UnitedHealth' are wider than their circles and spill past the outline.
      Legibility verdict: PASS (small labels below reference; spilled letters white on the page)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title cream, legend text light grey on a dark panel — no dark-on-dark text.
      Data: same layout and hues; outlines and rings cream. Fills at alpha 0.90 shift slightly against each page. White labels readable on all fills.
      Legibility verdict: PASS
