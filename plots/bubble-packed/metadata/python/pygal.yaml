review:
  strengths:
  - pygal's add_xml_filter extends the library to a packed bubble chart it lacks natively,
    with SVG defs radial gradients and native <title> tooltips in the interactive
    HTML
  - 'Area-correct sizing: radius from sqrt(value / max), so a value twice as large
    has twice the area'
  - 'Imprint palette in canonical order (Technology = #009E73) assigned by first appearance,
    with theme-adaptive chrome; both renders readable'
  - 'Group-aware packing: a 90 px gap between circles of different divisions against
    10 px inside one, so the four clusters read as separate groups'
  - In-bubble labels sized from the radius with legible floors (names >= 32 px, values
    >= 34 px) and text color chosen per fill luminance
  - Page-colored bubble strokes keep adjacent bubbles separate in both themes
  - 'Clean adaptable structure: column constants, one Data block ending in df, group
    colors and totals derived from df'
  weaknesses:
  - 'Suggestion: lower the opacity or radius of the dashed group halos so they no
    longer overlap far into the neighboring clusters.'
  - 'Suggestion: show the full item name (for example ''Data Analytics'' over two
    lines) instead of only the first word, so ''Digital'' reads as ''Digital Marketing''.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
      Chrome: title 'bubble-packed · python · pygal · anyplot.ai' in dark ink at the top; bold group labels in their group colors with totals (Operations: $725K and Sales: $805K above their clusters, Technology: $1,190K and Marketing: $700K below); bottom legend with four colored swatches and dark text. All readable.
      Data: 15 radial-gradient bubbles, area by budget, in four clusters with visible gaps between divisions and translucent dashed halos that overlap each other: Technology #009E73 centre-right (Software $480K largest, with a dashed highlight ring), Operations #4467A3 upper left, Sales #BD8233 upper right, Marketing #C475FD lower left. Names (first word) and values in the large bubbles (Software, Cloud, Facilities, Enterprise, SMB, Digital), values only at 34 px+ in the rest; dark text on ochre and violet, white on green and blue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and legend text in light ink; group labels in the group colors, Operations blue slightly dim but readable; no dark-on-dark text.
      Data: bubble colors and gradients identical to the light render; separating strokes switch to the dark page color; halos read as faint tinted discs.
      Legibility verdict: PASS
