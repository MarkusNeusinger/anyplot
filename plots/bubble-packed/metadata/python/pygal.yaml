review:
  strengths:
  - pygal's add_xml_filter extends the library to a packed bubble chart it lacks natively,
    with SVG defs radial gradients and native <title> tooltips in the interactive
    HTML
  - 'Area-correct sizing: radius from sqrt(value / max), so a value twice as large
    has twice the area'
  - 'Imprint palette in canonical order (Technology = #009E73) assigned by first appearance,
    with theme-adaptive chrome; both renders readable'
  - Page-colored bubble strokes keep adjacent bubbles separate in both themes
  - 'Clean adaptable structure: column constants, one Data block ending in df, group
    colors and totals derived from df'
  weaknesses:
  - 'VQ-01 (both): in-bubble value labels such as ''$175K'', ''$155K'', ''$195K'',
    ''$185K'' and ''$210K'' render at about 21 px and the names at 26 px, far below
    the 44 px tick-label reference, and the white text on the light top of the ochre
    gradient (Partnerships, SMB) is faint → value labels at least 32-36 px (+11 to
    +15 px) and dark text on the ochre fill. Likely cause: fs = max(int(r * 0.22),
    26) with the value at int(fs * 0.82), and text_color_on''s luminance threshold
    150 picking white for #BD8233.'
  - 'SC-02 (both): the four division clusters touch each other with no spacing between
    groups (Enterprise against Software, Cloud against HR, Digital against the $140K
    Technology bubble), and their dashed halos overlap far into each other, so the
    spec''s ''grouping with spacing between the groups'' (C4) is not shown → a visible
    gap between clusters, larger than the in-group gap. Likely cause: the greedy packing
    tests every placed circle with the same PADDING, regardless of group.'
  - 'Suggestion: show the full item name (for example ''Data Analytics'' over two
    lines) instead of only the first word in bubbles large enough to hold it.'
  - 'Suggestion: the pygal.Pie base with empty series is used only as legend scaffolding;
    a note in the code would make that intent clearer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
      Chrome: title 'bubble-packed · python · pygal · anyplot.ai' in dark ink at the top; bold group labels in their group colors with totals (Sales: $805K, Operations: $725K, Technology: $1,190K, Marketing: $700K), the Technology label sitting clear of the Brand bubble; bottom legend with four colored swatches and dark text. All readable.
      Data: 15 radial-gradient bubbles, area by budget, in four touching clusters with translucent dashed halos: Technology #009E73 in the centre (Software $480K largest, with a dashed highlight ring), Marketing #C475FD lower left, Operations #4467A3 right, Sales #BD8233 top. Names (first word) and values inside the large bubbles; values only in the small ones. Value labels inside bubbles are small (about 21 px), and white text on the light ochre gradient is faint.
      Legibility verdict: PASS (small in-bubble values noted under VQ-01)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and legend text in light ink; group labels in the same group colors, Operations blue a little dim but readable; no dark-on-dark text.
      Data: bubble colors and gradients identical to the light render; separating strokes switch to the dark page color; halos read as faint tinted discs.
      Legibility verdict: PASS
