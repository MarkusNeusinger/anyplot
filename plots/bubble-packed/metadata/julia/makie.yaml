review:
  strengths:
  - Circle area proportional to population via sqrt radius scaling, with real 2023
    figures spanning 46M to 1.43B
  - Label size follows circle radius and is capped by a fit-to-width rule, so every
    name fits its circle and the typography mirrors the size encoding
  - Name-over-value annotation on the largest circles (India 1.43B, China 1.41B, USA
    339M) gives an immediate focal point
  - DataAspect() keeps the poly! circles round; frameless PolyElement legend below
    the cluster
  - 'Theme tokens thread through title, outlines and legend: both renders read cleanly'
  weaknesses:
  - 'VQ-01 (both): white country names on the light lavender #C475FD and ochre #BD8233
    fills (Mexico, Germany, Russia, also USA and Brazil) read at about 2.5-2.9:1 contrast,
    and names in mid-size circles (Iran, Japan, Egypt, Vietnam, Germany) sit at 10
    pt, below the 12 pt tick-label reference → dark ink (INK #1A1A17) on the lavender
    and ochre fills, white kept on blue and green, and a 12 pt floor for names (+2
    pt). Likely cause: color = colorant"#FFFFFF" for every label and clamp(r / 4.0,
    10.0, 30.0).'
  - 'Suggestion: draw each bubble as poly!(ax, Circle(Point2f(x, y), r)) instead of
    the hand-built 60-point polygon (lines 146-151).'
  - 'Suggestion: a slightly tighter packing (stronger center attraction) would close
    the gaps on the left of Indonesia.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold title 'World Population 2023 · bubble-packed · julia · makie · anyplot.ai' in dark ink, about 56% of width; no axes, ticks or grid; frameless horizontal legend (Africa, Americas, Asia, Europe) under the cluster in dark ink. All readable.
      Data: 30 circles packed in one cluster, India and China the two giants (blue, Asia) with names at about 30 pt and 1.43B / 1.41B below; USA (lavender) with 339M; names in 21 circles sized to the circle; 9 small circles unlabeled. Africa #009E73, Americas #C475FD, Asia #4467A3, Europe #BD8233, 1.5 px dark-grey outlines. White names on lavender/ochre fills (Mexico, Germany, Russia) are lower contrast.
      Legibility verdict: PASS (with the low-contrast fill labels noted)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title and legend labels in light ink #F0EFE8, clearly readable; no dark-on-dark text.
      Data: identical layout and identical categorical hues to the light render; outlines flip to light grey; white labels on fills unchanged.
      Legibility verdict: PASS
