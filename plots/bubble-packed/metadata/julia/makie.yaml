review:
  strengths:
  - Circle area proportional to population via sqrt radius scaling, with real 2023
    figures spanning 46M to 1.43B
  - 'Label ink matched to the fill: dark text on lavender and ochre, white on green
    and blue, readable in both themes'
  - Name size follows the circle radius with a fit-to-width cap, so every name fits
    its circle
  - Name-over-value annotation on India, China and USA gives an immediate focal point
  - DataAspect() keeps circles round; frameless PolyElement legend below the cluster;
    theme tokens thread through title, outlines and legend
  weaknesses:
  - 'VQ-01 (both): the USA population value "339M" is drawn at 11 pt, below the 12
    pt tick-label reference, and reads small inside the second-largest labelled circle
    → 12 pt minimum (+1 pt). Likely cause: clamp(round(Int, fs * 0.8), 11, 22) on
    the value text.'
  - 'VQ-03 (both): most visible in the dark render, the legend swatches are opaque
    while the circles are filled at alpha 0.88, so the marks blend toward the page
    and no longer match their keys (dark render: lavender circles read near #AE6EE3
    against the #C475FD swatch, ochre circles darker than the ochre swatch) → draw
    the swatches with the same (color, 0.88) fill or fill the circles opaque. Likely
    cause: poly! color = (circle_colors[i], 0.88) against PolyElement(color = c).'
  - 'CQ-04 (code): each bubble is built as a hand-written 60-point polygon (lines
    145-151, θ_pts and the Point2f comprehension) where Makie''s geometry primitive
    draws the same circle → poly!(ax, Circle(Point2f(positions_x[i], positions_y[i]),
    r); ...). Likely cause: the manual θ_pts sampling.'
  - 'Suggestion: a stronger center attraction in the packing loop would pull China
    closer into the cluster and close the gaps left of Indonesia.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold title 'World Population 2023 · bubble-packed · julia · makie · anyplot.ai' in dark ink, about 56% of width; no axes, ticks or grid; frameless horizontal legend (Africa, Americas, Asia, Europe) under the cluster in dark ink. All readable.
      Data: 30 circles in one cluster; India and China (blue, Asia) are the giants with names at about 30 pt and 1.43B / 1.41B below; USA (lavender) with 339M at 11 pt; 21 circles labelled, 9 small ones unlabelled. Africa #009E73, Americas #C475FD, Asia #4467A3, Europe #BD8233 at alpha 0.88 with dark-grey outlines. Dark ink on lavender/ochre (USA, Brazil, Mexico, Russia, Germany), white on blue/green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title and legend labels in light ink, clearly readable; no dark-on-dark text.
      Data: identical layout and hues; outlines flip to light grey; the alpha-0.88 fills blend toward the dark page and read darker than the opaque legend swatches. Dark labels on lavender/ochre and white on blue/green stay readable.
      Legibility verdict: PASS
