review:
  strengths:
  - Bubble radii are sqrt(value) * k, so circle area is proportional to the value
    (C1), and the 21 circles pack into one compact, non-overlapping cluster with no
    axes or grid (C2)
  - Opaque fills in the exact Imprint hexes (#009E73 first for Consumer), identical
    in both renders, with a 'Sector' legend that identifies every color (C3)
  - Labels appear only in circles large enough to hold them; small circles stay unlabeled,
    as the spec permits (C5)
  - 'Clean ggplot2 grammar: geom_polygon with group = id, scale_fill_manual, scale_color_identity
    for per-label ink, coord_equal for true circles, theme_void for chrome-free output'
  - Specific, plausible technology-segment labels (ERP, Lending, AI / ML) that never
    repeat a sector name
  - The pairwise overlap pass is one separate_pairs() helper reused by all three packing
    stages
  weaknesses:
  - 'VQ-01 (dark): every bubble label is white in the dark render, including those
    on the light lavender fill #C475FD (about 2.5:1) and on the green and ochre fills,
    while the light render puts dark ink on the same fills, so the label color follows
    the theme instead of the fill → label color chosen per fill in both themes: dark
    ink #1A1A17 on lavender, green and ochre, white on blue and red. Likely cause:
    label_color = LABEL_COLOR (''#FFFFFF'') for every row when THEME == ''dark''.'
  - 'Suggestion: the sector gravity (gs = 0.012) is too weak to form visible sector
    clusters; a stronger pull would show the optional grouping as separated clusters.'
  - 'Suggestion: ggforce::geom_circle() would draw the bubbles without the hand-built
    72-point polygons.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
      Chrome: title "bubble-packed · r · ggplot2 · anyplot.ai" in dark ink, centered at the top; no axes or grid (theme_void); a horizontal "Sector" legend in an elevated box with a thin INK_SOFT border at the bottom. All text readable.
      Data: 21 opaque circles in one compact cluster, touching but not overlapping, with thin page-colored outlines. Consumer #009E73 (E-Commerce, Digital Ads, Social, Mobile, Streaming), Infrastructure lavender #C475FD (Cloud, Semicon., IoT, 5G), Enterprise blue #4467A3 (AI / ML, ERP, SaaS, Analytics, Cyber, one unlabeled), Fintech ochre #BD8233 (Payments, Lending, one unlabeled), Emerging red #AE3030 (three small unlabeled). Bold labels: dark ink on green, lavender and ochre, white on blue. The sectors are interleaved rather than clustered.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, legend box in #242420 with a light border, legend text in INK_SOFT; no dark-on-dark text anywhere.
      Data: identical layout, and the categorical fills are identical to the light render (opaque Imprint hexes). Every label is white, including those on the light lavender fill, where the contrast is weak (about 2.5:1) but the text is still readable.
      Legibility verdict: PASS (lavender labels weakly contrasted)
