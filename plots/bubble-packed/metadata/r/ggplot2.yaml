review:
  strengths:
  - Circle radii are sqrt(value)-scaled, so area is proportional to revenue (C1)
  - The force simulation produces one compact, touching cluster with no crossing circles
    (C2)
  - 'Label color follows the fill: white on the blue and red bubbles in light, white
    on every fill in dark, so every label is readable in both themes (C5)'
  - Labels only in circles with radius >= 0.24, and every label fits inside its bubble
  - Page-colored circle outlines and theme tokens threaded through title, legend text
    and the elevated legend box
  weaknesses:
  - 'VQ-07 (both): fills drawn at alpha 0.85 with no overlapping marks blend with
    the page, so the categorical colors differ between the renders (Consumer reads
    about #25AC87 in light and #048A65 in dark) → opaque fills in the exact Imprint
    hexes (alpha 1). Likely cause: geom_polygon(alpha = 0.85).'
  - 'DQ-02 (both): the items ''Enterprise'' and ''Fintech'' carry the names of their
    own sectors, so a bubble label repeats the legend entry and reads generic → specific
    segment names (e.g. ''ERP'', ''Lending''). Likely cause: the label vector in the
    segments tibble.'
  - 'CQ-04 (code): the same pairwise overlap-resolution loop is written out three
    times in pack_circles() (main iterations, tightening pass, the 300 final passes)
    → one resolve_overlaps() block or a single loop reused. Likely cause: the final
    300-pass loop added as a copy instead of reusing the existing one.'
  - 'Suggestion: the sector gravity is too weak to form visible sector clusters; a
    stronger pull (or per-sector centroids) would show the optional grouping as separated
    clusters.'
  - 'Suggestion: ggforce::geom_circle() would draw the bubbles without the hand-built
    72-point polygons.'
  image_description: |-
