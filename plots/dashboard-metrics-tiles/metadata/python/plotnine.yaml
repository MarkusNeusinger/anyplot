      Data: each tile has a change indicator (green ▼ 5.2%, red ▲ 8.3%, green ▼ 15.4%, green ▲ 12.7%, red ▲ 45.2%, red ▼ 2.1%) and a status-colored sparkline on a #EDEAE0 strip: green #009E73 for good, amber #DDCC77 for Memory (warning), red #AE3030 for Error Rate (critical).
