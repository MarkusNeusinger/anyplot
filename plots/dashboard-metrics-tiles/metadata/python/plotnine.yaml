review:
  strengths:
  - facet_wrap over an ordered Categorical builds the regular 3x2 tile grid natively,
    with scale_color_identity carrying the per-tile status and change colors held
    in the data
  - 'Clear typographic hierarchy: the current value is the most prominent element,
    followed by the change indicator and the metric label'
  - Change colors follow favorability per metric through a better-direction column,
    so Memory's rise and Throughput's drop read red
  - 'Theme tokens threaded through every element: elevated tiles, recessed sparkline
    strips and text all flip correctly between light and dark'
  weaknesses:
  - 'DQ-03 (both): every sparkline runs opposite to its change indicator — the history
    starts at the current value and drifts to value×(1−change), so Error Rate (▲ 45.2%)
    falls and Response Time (▼ 15.4%) rises → generate history that ends at the current
    value and moves in the change''s direction (start near value/(1+change/100)).
    Likely cause: `history = value - drift` with the drift growing from 0 at the first
    step.'
  - 'Suggestion: put a thin space between number and unit ("3,450 req/s", "120 ms").'
  - 'Suggestion: drop the unused `status_color` column of `tiles`.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; six elevated #FFFDF6 tiles in an even 3x2 grid with balanced margins.
