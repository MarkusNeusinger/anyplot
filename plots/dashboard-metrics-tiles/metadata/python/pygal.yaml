review:
  strengths:
  - 'Every tile carries all four parts in the same arrangement: soft label, a 100
    px bold value as the clear focal element, an arrow + percent change, and a sparkline
    below'
  - Favorability logic per metric (lower is better) colors a rise in Memory and Error
    Rate red and a fall in CPU and Response Time green, exactly as C4 asks
  - 'Status uses the style guide''s semantic anchors (green, amber #DDCC77, red) on
    the same top strip of every tile, legible in both themes'
  - Theme tokens threaded through every element, with elevated tile surfaces on both
    pages
  - pygal's inline SVG output gives the HTML view vector sparklines with native hover
  weaknesses:
  - 'VQ-01 (both): the "7-day trend" labels are drawn at 36 px, below the pygal library
    prompt''s 44 px tick-label reference, and read small beside the 46 px metric names
    → 44 px (+8 px). Likely cause: trend_font size 36.'
  - 'CQ-04 (code): np.random.seed(42) seeds a generator nothing draws from (numpy
    is imported only for it), the color comments name Okabe-Ito positions for Imprint
    colors, and the HTML colors unfavorable changes #C475FD lavender while the PNG
    uses red → drop the seed and the numpy import, fix the comments, and use #AE3030
    in .change-neg. Likely cause: leftovers from an earlier palette and data version.'
  - 'Suggestion: the gap between the change indicator and the trend rule could shrink,
    giving the sparklines more height.'
  image_description: |-
