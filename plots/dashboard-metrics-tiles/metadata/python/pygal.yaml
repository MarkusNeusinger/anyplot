      Data: status strips green (CPU, Response Time, Throughput, Active Users), amber (Memory), red (Error Rate); change indicators green ▼5.2%, red ▲8.3%, green ▼15.0%, red ▲45.0%, green ▲12.5%, green ▲5.8%; filled blue #4467A3 sparklines scaled to each metric's range.
