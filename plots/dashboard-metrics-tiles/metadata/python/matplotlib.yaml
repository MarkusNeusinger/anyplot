      Data: status bands green #009E73 (CPU, Response Time, Requests/s, Disk I/O), amber #DDCC77 (Memory), red #AE3030 (Error Rate); sparklines in the status color with translucent area fill; change indicators CPU ▼5.2% green, Memory ▲8.1% red, Response Time ▼15.3% green, Requests/s ▲12.7% green, Error Rate ▲45.0% red, Disk I/O ▼3.8% red.
