review:
  strengths:
  - 'Change indicators follow both sign and favorability through a lower-is-better
    set: Memory ▲ red, Error Rate ▲ red, Disk I/O ▼ red, Requests/s ▲ green'
  - Each sparkline ends at the tile's current value and its last step equals the stated
    change, so trend, value and arrow tell one story
  - 'Clear in-tile hierarchy: status band, metric name, 16 pt bold value as the most
    prominent element, 12 pt change, compact sparkline'
  - Semantic status colors (Imprint green, amber anchor, Imprint red) paired with
    GOOD/WARNING/CRITICAL text, dark ink on the amber band
  - Nested inset_axes give each tile a full-bleed status band and a sparkline scaled
    to its own range; grid rows derive from the number of metrics
  weaknesses:
  - 'Suggestion: a thin space between value and unit (''156 MB/s'', ''120 ms'') would
    read more naturally.'
  - 'Suggestion: LOWER_IS_BETTER names the sample metrics in # Constants; carrying
    the favorable direction as a column of the data table would keep the arrow colors
    right when the metrics are renamed.'
