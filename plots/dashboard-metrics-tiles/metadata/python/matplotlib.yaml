review:
  strengths:
  - 'Change indicators follow both sign and favorability through a lower-is-better
    set: CPU ▼ green, Memory ▲ red, Error Rate ▲ red, Requests/s ▲ green'
  - 'Clear in-tile hierarchy: status band, metric name, 16 pt bold value as the most
    prominent element, 12 pt change, compact sparkline'
  - Semantic status colors (Imprint green, amber anchor, Imprint red) paired with
    GOOD/WARNING/CRITICAL text, with dark ink on the amber band so WARNING stays readable
  - Nested inset_axes give each tile a status band and a sparkline scaled to its own
    range
  - Data block ends in one tidy DataFrame read through column constants; grid rows
    derive from the number of metrics
  weaknesses:
  - 'DQ-03 (both): the sparkline trends contradict the stated change in three of six
    tiles: Memory''s history falls by about 8 % over the window yet the tile reads
    ▲ 8.1%, Error Rate''s history falls yet reads ▲ 45.0%, Disk I/O''s history climbs
    steeply yet reads ▼ 3.8%; the histories also do not end at the current value →
    generate each history so that it ends at the current value and its last-period
    move matches the sign and size of the change percent (signed delta: the Memory
    history end should sit about +8 % above the previous period, not below it). Likely
    cause: history built as an independent random walk `np.cumsum(np.random.randn(30)
    * scale) + start`, unrelated to value and change.'
  - 'Suggestion: a thin space between value and unit (''156 MB/s'', ''120 ms'') would
    read more naturally.'
  image_description: |-
