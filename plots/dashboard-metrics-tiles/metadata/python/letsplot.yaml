    for HTML inspection
  weaknesses:
  - 'VQ-01 (dark): the change labels are printed on the sparkline''s area fill, so
    the red ''▲ 8.3%'' (#AE3030) sits on the olive amber ribbon and the green labels
    on the dark-green ribbon with low contrast → place them on the plain card surface.
    Likely cause: CHANGE_Y = low − 0.40·span lies above FLOOR = low − 0.70·span, inside
    the geom_ribbon.'
  - 'VQ-02 (both): the change labels overlap the ribbon (data area), and in the Error
    Rate tile the top of ''▼ 22.0%'' comes within a few px of the sparkline''s dip
    → keep the label clear of the area and line. Likely cause: same CHANGE_Y inside
    the ribbon''s y range.'
  - 'Suggestion: add a thin space between number and unit (''847 req/s'', ''120 ms'')
    so the long value reads less crowded.'
