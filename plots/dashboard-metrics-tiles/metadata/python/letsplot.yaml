review:
  strengths:
  - 'Every tile carries the four required parts (C1): a 20 pt bold current value as
    the dominant element, the metric label in the strip, a compact sparkline with
    an endpoint dot, and an arrow-plus-percent change indicator'
  - The change indicators now sit on the plain card surface below the sparkline's
    area fill, so the green and red labels read with full contrast in both themes
    and stay clear of every sparkline
  - 'Favorability is driven by a lower-is-better flag in the data: CPU ▼ 5.2% and
    Error Rate ▼ 22.0% are green, Memory ▲ 8.3% is red, Active Users ▲ 12.5% is green
    (C4)'
  - 'Status colors from the Imprint semantic anchors (#009E73 good, #DDCC77 warning)
    are applied to the sparkline of every tile and are identical in both themes; the
    ⚠ strip badge adds a non-color cue for the warning tile'
  - facet_wrap(scales='free_y') scales each sparkline to its own range and geom_blank
    reserves headroom and footroom, so value, sparkline and change share one arrangement
    inside every card
  - layer_tooltips() on the line and endpoint give per-step values in the HTML view
  weaknesses:
  - 'Suggestion: add a thin space between number and unit (''847 req/s'', ''120 ms'')
    so the longer values read less crowded.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; six cards on the elevated #FFFDF6 surface with #4A4A44 borders and strip headers.
