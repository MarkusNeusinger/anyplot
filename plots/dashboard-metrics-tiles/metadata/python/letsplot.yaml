      Data: 3x2 grid of equal cards. Five green #009E73 sparklines with a pale-green area fill and an endpoint dot; Memory in amber #DDCC77. Large bold values (1,284 / 45% / 0.8% / 120ms / 847req/s / 72%) at the top, sparkline in the middle, bold change labels on the plain card below the area: green ▲ 12.5%, ▼ 5.2%, ▼ 22.0%, ▼ 15.1%, ▲ 3.7%, red ▲ 8.3% on Memory. No text touches the area fill or the lines.
