      Data: 3×2 grid of equal tiles. Good tiles have a #009E73 top accent bar and 1 px green frame, Memory (warning) an amber #DDCC77 bar and 2 px frame, Error Rate (critical) a #AE3030 bar and 3 px frame. Deltas: ▼ −5.2% green, ▲ 8.3% red, ▼ −15.4% green, ▲ 12.7% green, ▲ 45.0% red, ▼ −2.1% red. Sparklines in neutral soft-ink lines with a light grey area fill below each delta, without axes.
