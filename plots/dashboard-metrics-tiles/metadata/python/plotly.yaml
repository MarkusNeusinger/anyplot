review:
  strengths:
  - 'Status colors use the Imprint semantic anchors (#009E73 good, #DDCC77 warning,
    #AE3030 critical) on the same two parts of every tile (top accent bar and frame),
    identical in both themes'
  - 'Status never rests on color alone: a symbol in the label (✓ / ⚠ / ✕) and an escalating
    frame width (1/2/3 px) carry it too'
  - go.Indicator with mode='number+delta', relative delta and custom ▲/▼ symbols renders
    value, unit and percentage change natively, with increasing/decreasing colors
    flipped per metric so a rise in a lower-is-better metric is red
  - 'Grid layout is computed from the tile count (2/3/4 columns) with equal tile sizes
    and gaps, and every tile has the same internal arrangement: label, value, delta,
    sparkline'
  - Each sparkline gets its own hidden x/y axis pair scaled to the metric's own range,
    joined in order, compact below the value
  - Theme tokens (PAGE_BG, ELEVATED_BG, INK, INK_SOFT) thread through every element;
    both renders read cleanly
  weaknesses:
  - 'DQ-03 (both): the Requests/sec tile shows ▲ 12.7% above a sparkline that falls
    steadily across the whole history, and CPU Usage shows ▼ −5.2% above a sparkline
    that ends on a rise; the change indicator contradicts the trend drawn under it
    → generate each history so its recent movement agrees with the sign of change_percent
    (e.g. end the walk at current_value and at current_value/(1+change/100) one period
    earlier). Likely cause: free random walks from rng.normal with fixed start offsets,
    unrelated to CURRENT and CHANGE.'
  - 'Suggestion: format the Requests/sec value with a thousands separator (number
    valueformat '','') so 1250 reads as 1,250.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; tiles on the elevated #FFFDF6 card fill.
