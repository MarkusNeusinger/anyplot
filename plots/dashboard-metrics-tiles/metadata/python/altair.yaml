      Data: 3x2 grid of equal-width, column-aligned tiles; sparklines with 2 px stroke and gradient fill spanning the full card width, green #009E73 for good tiles and amber #DDCC77 for the warning tiles Memory and Error Rate. Small square fill corners show past the rounded card bottoms.
