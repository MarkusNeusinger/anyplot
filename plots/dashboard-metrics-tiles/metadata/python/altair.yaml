review:
  strengths:
  - 'Clear tile hierarchy via alt.Title text + subtitle: 36 pt bold value over a 16
    pt INK_SOFT metric label'
  - alt.Gradient with GradientStop gives each sparkline a fading area fill in its
    status color - a Vega-Lite-native mark feature
  - 'Dashboard grid composed declaratively from nested hconcat/vconcat with configure_view(cornerRadius,
    fill=ELEVATED_BG): equal-width tiles aligned in a 3x2 grid in both themes'
  - 'Change indicators follow the spec exactly: arrow by sign, color by favorability,
    so the Memory and Error Rate rises are red while the Requests/sec rise is green'
  - Theme tokens threaded through title, tile text, view fill and stroke - both renders
    fully readable
  weaknesses:
  - 'DQ-03 (both): the generated histories run against their change indicators - CPU
    Usage (▼ 5.2%) and Response Time (▼ 15.3%) climb steadily to their highs at the
    right end, and Error Rate (▲ 0.3%) ends near its low, so trend and change contradict
    each other → each history ending in the direction of its change_percent. Likely
    cause: np.linspace((-15 if change < 0 else 15), 0, ...) adds a ramp that rises
    for negative changes; the sign is inverted.'
  - 'Suggestion: clip the gradient area to the view (mark_area(clip=True)) so the
    fill does not show square corners past the rounded tile border.'
  - 'Suggestion: draw value, label, sparkline and change indicator inside one card
    so each tile reads as a single unit rather than a sparkline box and a separate
    change box.'
  image_description: |-
