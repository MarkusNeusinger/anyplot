review:
  strengths:
  - alt.Gradient with GradientStop gives each sparkline a fading area fill in the
    status color - a Vega-Lite-native mark feature
  - Dashboard grid composed declaratively from nested hconcat/vconcat with configure_view(cornerRadius,
    fill=ELEVATED_BG) giving rounded elevated tiles in both themes
  - 'Change indicators follow the spec exactly: arrow by sign, color by favorability,
    so the Memory and Error Rate rises are red while the Requests/sec rise is green'
  - Status color (green good, amber warning) applied to the same part of every tile,
    distinguishable in both themes
  - Theme tokens threaded through title, tile text, view fill and stroke - both renders
    fully readable
  weaknesses:
  - 'SC-02 (both): C1 missed - the metric label (e.g. ''Response Time'') is drawn
    at the same 36 pt bold as the headline value, so the label competes with the value
    instead of the value being the most prominent element → label at about 16 pt in
    INK_SOFT (−20 pt). Likely cause: alt.Title(text=[display_val, name]) puts both
    lines in the title at fontSize=36; subtitleFontSize/subtitleColor are set but
    no subtitle= is passed.'
  - 'SC-02 (both): C2 missed - tile columns do not line up between rows: the Error
    Rate tile sits about 75 px right of the Memory tile above it and Disk I/O about
    65 px left of Response Time, because each hconcat cell is as wide as its oversized
    title → equal-width columns aligned across rows (0 px offset). Likely cause: the
    36 pt label lines widen each tile beyond TILE_WIDTH=190; smaller labels (or a
    fixed title limit) keep every cell at the view width.'
  - 'VQ-05 (both): the 36 pt metric labels overflow their tiles - ''Requests/sec''
    and ''Response Time'' run about 100-140 px past each side of the 190-unit tile
    view → labels within the tile width. Likely cause: same 36 pt title line as above.'
  - 'SC-03 (both): every sparkline stops about 5% short of its tile''s right edge
    (blank strip after the last point) because the quantitative x scale is niced from
    0-19 to 0-20 → x domain fitted to the indices (0 px gap). Likely cause: alt.X(''t:Q'',
    axis=None) without scale=alt.Scale(nice=False) or domain=[0, len(values)-1].'
  - 'Suggestion: clip the gradient area to the view (mark_area(clip=True)) so the
    fill does not show square corners past the rounded tile border.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; tiles on slightly lighter #FFFDF6 rounded cards with a thin INK_SOFT border.
      Chrome: title 'dashboard-metrics-tiles · python · altair · anyplot.ai' in dark ink at the top, about half the width. Each tile shows a bold 36 pt value (45%, 72%, 120ms, 2,847, 0.8%, 156MB/s) and below it the metric name at the same 36 pt bold (CPU Usage, Memory, Response Time, Requests/sec, Error Rate, Disk I/O); the long names are wider than the tile cards. Change rows (▼ 5.2%, ▲ 8.1%, ▼ 15.3%, ▲ 12.4%, ▲ 0.3%, ▼ 2.1%) in bold green or red. All text dark and readable.
      Data: 3x2 grid; sparklines with 2 px stroke and gradient fill, green #009E73 for good tiles, amber #DDCC77 for the warning tiles Memory and Error Rate. Lines end short of the right card edge; bottom-row cards are not aligned with the top-row columns.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; tiles on #242420 cards with a light grey border.
