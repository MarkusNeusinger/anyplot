review:
  strengths:
  - 'Every tile carries the four required parts (C1): label, 42pt current value as
    the most prominent element, arrow + percentage change, and a 30-point sparkline
    below the value scaled to its own range (C3)'
  - Regular 3x2 grid of equal tiles derived from GRID_COLUMNS and the row count, same
    arrangement in every tile (C2)
  - Status bar across the top of each tile uses the Imprint semantic anchors green/amber/red,
    distinguishable in both themes (C5)
  - 'Theme tokens threaded through every element: elevated tile surface, INK text,
    theme-dependent sparkline fill alpha — both renders fully readable'
  - Bokeh layout composition (gridplot of figures under a title figure) produces an
    interactive HTML dashboard alongside the PNG
  - 'Change indicators follow favorability via a LOWER_IS_BETTER column: CPU drop
    and Response Time drop green, Memory and Error Rate rises red (C4)'
  weaknesses:
  - 'DQ-03 (both): the sparkline histories are independent random walks that contradict
    the change indicators — Active Users shows ▼ 2.1% while its sparkline ends on
    a steep rise to its maximum, Throughput shows ▲ 3.7% while its sparkline falls
    to near its minimum, Memory shows ▲ 8.1% while its line ends far below its start
    → derive each history so its last value is the current value and its last step
    (or period) matches change_percent. Likely cause: HISTORY built from np.random.randn
    cumsums unrelated to VALUE and CHANGE.'
  - 'Suggestion: put a thin space between value and unit ("1250 req/s", "120 ms")
    so the unit reads apart from the number.'
  - 'Suggestion: move the metric label up toward the status bar to tighten the empty
    band between them.'
  image_description: |-
