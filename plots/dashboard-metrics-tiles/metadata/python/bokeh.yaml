review:
  strengths:
  - Every tile carries the four required parts (C1) — label, 42pt current value as
    the most prominent element, arrow + percent change, and a 30-point sparkline below
    the value scaled to its own range (C3)
  - Regular 3x2 grid of equal tiles derived from GRID_COLUMNS and the row count, same
    arrangement in every tile (C2)
  - Status bar across the top of each tile uses the Imprint semantic anchors green/amber/red,
    distinguishable in both themes (C5)
  - 'Theme tokens threaded through every element: elevated tile surface, INK text,
    theme-dependent sparkline fill alpha — both renders fully readable'
  - Idiomatic Bokeh layout composition (gridplot of figures under a title figure)
    producing an interactive HTML dashboard alongside the PNG
  weaknesses:
  - 'VQ-01 (both): metric labels at 20pt and change indicators at 22pt sit below the
    style guide''s 34pt bokeh tick reference and read small in the 1066×820 px tiles
    beside the 42pt values → about 30–34pt (+10 to +12 pt). Likely cause: Label text_font_size=''20pt''
    / ''22pt''.'
  - 'SC-02 (both): CPU Usage''s 5.2 % drop is drawn red and Memory''s 8.1 % rise is
    drawn green (while the Memory tile is in warning), though lower is better for
    both utilisation metrics, so C4''s favorable/unfavorable coloring is inverted
    on two tiles → CPU drop green, Memory rise red. Likely cause: LOWER_IS_BETTER
    is False for CPU Usage and Memory.'
  - 'Suggestion: put a thin space between value and unit ("1250 req/s", "120 ms")
    so the unit reads apart from the number.'
  - 'Suggestion: move the metric label up toward the status bar to tighten the large
    empty band between them.'
