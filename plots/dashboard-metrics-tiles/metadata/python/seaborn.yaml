review:
  strengths:
  - 'Every tile carries all parts C1 asks for: a 19 pt bold value in INK as the most
    prominent element, the bold metric label, a ▲/▼ change indicator with percentage,
    and a filled sparkline below the value'
  - 'Change colors follow favorability per metric from a lower-is-better column: Grid
    Load +9.1% and Spot Price +14.2% are red, CO₂ Intensity −6.3% is green, Reserve
    Margin −18.5% is red'
  - 'Status color sits on the same part of every tile (full-width top stripe plus
    sparkline) in green / amber anchor #DDCC77 / matte red #AE3030, with the status
    word repeated in text'
  - Energy-grid control-room scenario with realistic units (GW, €/MWh, g/kWh), history
    ending exactly at each tile's current value
  - Tidy long-form df drawn per tile with sns.lineplot(data=tile, x=PERIOD, y=HISTORY),
    theme set once via sns.set_theme rc
  weaknesses:
  - 'DQ-03 (both): the Grid Load history falls steadily to its 30-period minimum while
    its indicator reads ▲ 9.1%, so sparkline and change indicator tell opposite stories
    → generate each history so its recent trend agrees with the sign of change_percent.
    Likely cause: the random walk in the Data block is drawn independently of the
    change column.'
  - 'Suggestion: the gap between the title and the first tile row is wider than the
    gaps between tiles; tightening the top rect would balance the vertical rhythm.'
