review:
  strengths:
  - 'Every tile carries all parts C1 asks for: a 19 pt bold value in INK as the most
    prominent element, the bold metric label, a change indicator with ▲/▼ and percentage,
    and a filled sparkline below the value'
  - 'Change colors follow favorability per metric from a lower-is-better column: Grid
    Load +9.1% and Spot Price +14.2% are red, CO₂ Intensity −6.3% is green, Reserve
    Margin −18.5% is red'
  - 'Status color sits on the same part of every tile (a full-width top stripe plus
    the sparkline) in green / amber #DDCC77 / matte red #AE3030, with the status word
    repeated in text so status never rests on color alone'
  - Energy-grid control-room scenario with realistic units (GW, €/MWh, g/kWh) and
    a history generated to end exactly at each tile's current value
  - Tidy long-form df drawn per tile with sns.lineplot(data=tile, x=PERIOD, y=HISTORY),
    sparkline x-limits fitted to each tile's own period range, theme set once via
    sns.set_theme rc
  weaknesses:
  - 'VQ-01 (both): the status word (WARNING / GOOD / CRITICAL) is set at 6.5 pt, below
    the style guide''s 8 pt tick/legend reference, and reads small beside the 10 pt
    metric label → 8 pt (+1.5 pt). Likely cause: fontsize=6.5 in the status-word ax.text
    call.'
  - 'Suggestion: the amber warning sparkline fill reads pale on the light tile surface;
    a slightly higher fill alpha for amber would give the Grid Load and Spot Price
    trends more presence.'
  - 'Suggestion: the gap between the title and the first tile row is wider than the
    gaps between tiles; tightening the top rect would balance the vertical rhythm.'
