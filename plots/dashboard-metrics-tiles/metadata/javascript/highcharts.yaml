review:
  strengths:
  - Exact mandated title format and a spec-faithful grid (3x2 for 6 tiles, matching
    the specification's own 3x2-for-six-tiles guidance)
  - 'All required tile elements present: metric label, prominent value, sparkline
    trend, and a colored up/down change indicator, plus a bonus status dot'
  - Reuses the canonical Highcharts sparkline idiom cleanly across all six chart instances
    (disabled axes/legend/tooltip, transparent background, subtle area fill, no animation)
  - Data colors (green/amber/red per status) are identical between light and dark
    renders -- only chrome (page/card backgrounds, text) flips correctly
  - Deterministic per-tile seeded LCG data generation produces realistic, varied metric
    values and trend directions (mix of favorable/unfavorable changes across good/warning/critical
    statuses)
  weaknesses:
  - The status dot (top-right of each tile) encodes good/warning/critical using color
    alone, with no accompanying shape or text cue -- a colorblind viewer could confuse
    the green 'good' dot with the red 'critical' dot on a tile where the metric value
    alone doesn't make the status obvious. Consider a distinct shape/icon per status
    or a text label alongside the color.
  - Doesn't showcase a distinctive Highcharts-only capability beyond the standard
    sparkline recipe (e.g. a shared plotBand/plotLine for a threshold, or Highcharts.charts-based
    synced crosshair) that would strengthen the Library Mastery distinctive-features
    case.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) page background with slightly elevated near-white card backgrounds for each of the 6 tiles, arranged in a 3x2 grid.
      Chrome: Bold dark header title "dashboard-metrics-tiles · javascript · highcharts · anyplot.ai" top-left, fully readable. Each card shows a metric label (dark gray, e.g. "CPU Usage"), a large bold dark value (e.g. "45%"), a small colored change indicator with up/down triangle arrow (green or red), and a small colored status dot top-right (green/amber/red). All text is clearly legible against the light background.
      Data: Each card contains a compact area sparkline (24 points) below the value, colored to match the tile's status (teal-green #009E73-ish for good, amber/gold for warning, red for critical), with a subtle ~16% opacity fill under the line. First categorical/status color used is the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) page background with slightly lighter dark-gray elevated card backgrounds, same 3x2 grid layout.
      Chrome: Header title and all tile labels/values render in light/white text, clearly visible against the dark background. No dark-on-dark text observed -- labels, values, and change percentages are all legible. Status dots and change-indicator colors are unchanged in hue from the light render.
      Data: Sparkline line colors (green/amber/red) are visually identical to the light render; only the card and page backgrounds and the ink text color flipped, confirming data-color/theme-chrome separation is correctly implemented.
      Legibility verdict: PASS
