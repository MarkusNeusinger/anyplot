review:
  strengths:
  - Correct semantic use of the Imprint palette anchors — green (#009E73) for good/favorable,
    amber for warning, matte red (#AE3030) for critical — identical data colors across
    light and dark renders.
  - Theme-adaptive chrome works flawlessly in both renders, confirmed legible even
    at the 400px thumbnail scale.
  - Thoughtful separation between `favorable` (change-direction color on the arrow
    indicator) and `status` (absolute-level color on the accent bar and sparkline)
    — a nuance the spec implies but doesn't spell out.
  - 'All required KPI tile elements present and cleanly composed: metric label, big
    value + unit, sparkline (area + line + endpoint dot), and change indicator with
    arrow + percentage.'
  - Grid geometry correctly implements the spec's '3x2 for 6 tiles' responsive layout
    with consistent tile sizing, margins, and gaps.
  - Deterministic, realistic, plausible data across 6 distinct ops metrics (CPU, memory,
    response time, error rate, throughput, disk I/O).
  weaknesses:
  - Status (good/warning/critical) is conveyed via color-only on the left accent bar
    and sparkline — no per-tile text/icon repeats the status, only the top legend
    maps colors to meaning. Add a small status word or shape cue per tile for full
    CVD-safety (VQ-04).
  - Design is a clean, correct KPI-tile pattern but fairly formulaic (uniform rounded-card
    + accent-bar layout for every tile); pushing a stronger visual hierarchy — e.g.
    emphasizing the one critical metric (Disk I/O) so the eye lands there first —
    would raise data storytelling.
  - 'D3 usage is solid but not distinctive: mostly scaleLinear/area/line/curveMonotoneX,
    no library-specific technique beyond the baseline shape generators.'
  - Sparkline endpoint marker (r=4.5) and change-indicator glyph are on the small
    side at the 400px thumbnail scale — still legible, but a touch more radius/stroke-width
    would improve small-scale robustness.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) canvas; tile cards use a very slightly lighter elevated warm surface with a thin subtle grid-colored border.
      Chrome: Title "dashboard-metrics-tiles · javascript · d3 · anyplot.ai" is dark, bold, centered, fully readable. A centered status legend (Good/Warning/Critical dots) sits below the title. Metric labels (e.g. "CPU Usage") are dark gray, tick-free (no axes on sparklines, as expected for this compact genre). All text is clearly dark-on-light with no light-on-light issues.
      Data: 6 tiles in a 3x2 grid, each with a colored left accent bar (green/amber/red matching status), a large bold value + smaller unit, a top-right change indicator (colored triangle + percentage, colored by favorability not by status), and a sparkline (area fill at low opacity + line + endpoint dot) colored by status. First/anchor semantic color is Imprint green #009E73 for "good".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) canvas; tile cards use a slightly lighter dark elevated surface with a subtle border, matching the light render's card-vs-page contrast relationship.
      Chrome: Title and metric labels render in light/white text, fully legible against the dark background. Legend dots and labels remain legible. No dark-on-dark failures detected — all ticks, labels, and title invert correctly via theme tokens.
      Data: Data colors (green, amber, matte red) are visually identical to the light render — only the chrome (background, card fill, text, borders) flips, confirming correct theme-token usage. Sparkline area fills and accent bars read clearly against the dark tile background.
      Legibility verdict: PASS

    Additional check: the 400px thumbnail (plot-light_400.png) was also inspected — title, tile labels, and big values remain crisp and legible at this reduced scale; only the small change-indicator percentage text and sparkline endpoint dot approach the lower bound of legibility, though still readable.
