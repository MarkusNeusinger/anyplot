review:
  strengths:
  - Status color coding (green/amber/red for good/warning/critical) is a well-justified
    semantic exception to the ordinal Imprint palette, applied consistently to both
    the status dot and the sparkline stroke
  - Change-direction color is computed independently of status via a higherIsBetter
    flag, so 'up' correctly reads red for Memory/Error Rate but green for Requests/sec
    — a subtle correctness detail many implementations get wrong
  - Custom endpoint-dot Chart.js plugin (afterDatasetsDraw) marks the sparkline's
    latest point with a ring-stroked dot, a genuine plugin-system feature rather than
    a generic line chart
  - Canvas gradient fill (scriptable backgroundColor) fades each sparkline area to
    transparent — an idiomatic Chart.js/canvas technique, not a flat alpha fill
  - Deterministic LCG-seeded data generation with realistic ops-monitoring values
    (CPU %, memory %, response time ms, error rate %, req/s, active users) covering
    both favorable and unfavorable, and good/warning/critical states
  - Clean theme-token usage throughout (t.ink, t.inkSoft, t.elevatedBg) — all chrome
    is legible and correctly adapted in both light and dark renders
  - Minimal-chrome sparklines (no axes, no gridlines, no legend/tooltip) are the right
    call for compact KPI tiles and keep focus on the big number
  weaknesses:
  - Grid is hardcoded to a fixed 3-column x 2-row layout rather than deriving columns/rows
    from metrics.length (fine for the current 6-tile dataset per spec's 'static snapshot'
    guidance, but would not adapt if the tile count changed)
  - Helper functions (buildMetric, favorableColor, rand) and the plugin object move
    away from a strict flat KISS script structure — justified here to avoid 6x duplicated
    tile-construction code, but worth noting against the generic 'no functions/classes'
    code-quality guideline
  - Data storytelling relies on redundant color+arrow+status-dot encoding rather than
    any explicit hierarchy/emphasis technique (e.g., highlighting the most critical
    tile) — solid but not maximal visual hierarchy
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) page background with slightly lighter elevated cream tile cards (~#FFFDF6). Not pure white.
      Chrome: Bold dark heading "dashboard-metrics-tiles · javascript · chartjs · anyplot.ai" top-left, fully legible. Each of the 6 tiles shows a colored status dot + secondary-ink metric label (e.g. "CPU Usage"), a large bold primary-ink value ("47%", "128ms", "9073"), and a smaller colored change indicator with up/down triangle glyph and percentage. All text is clearly legible against the light background — no light-on-light issues.
      Data: Each tile has a compact sparkline (line + gradient area fill, no axes/gridlines) beneath the value, with a small ringed dot marking the latest point. Sparkline color matches the tile's status: green (#009E73) for CPU Usage/Response Time/Requests-sec (good), amber for Memory/Active Users (warning), red for Error Rate (critical). Change-indicator colors are independently correct: e.g. Memory's +8.4% is red (unfavorable, since lower memory is better) while Requests/sec's +6.7% is green (favorable).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black page background (~#1A1A17-consistent) with slightly lighter charcoal elevated tile cards (~#242420). Not pure black.
      Chrome: Same heading now rendered in light ink, fully legible against the dark background. Tile labels use light secondary-ink color, values use bright light-ink white/cream text — no dark-on-dark failures anywhere; every label, value, and change indicator is clearly readable.
      Data: Sparkline colors are pixel-identical to the light render (green/amber/red per status), confirming only chrome (background, text) flipped between themes as required. Gradient fills and endpoint dots render correctly with the dot's ring stroke matching the dark tile background instead of the light one.
      Legibility verdict: PASS
