review:
  strengths:
  - Correct, well-reasoned semantic use of the Imprint palette for status dots (green/amber/red
    as a traffic-light convention) and for the change indicator (favorable=green,
    unfavorable=red), with a clear in-code comment explaining the semantic-exception
    rationale
  - Headline value is mathematically derived from the sparkline's final data point
    (buildMetric), so the big number and the trend line always agree — avoids a common
    fake-dashboard inconsistency
  - Deterministic fixed-seed LCG for randomness, appropriate since the browser has
    no seeded RNG
  - 'Theme-adaptive chrome is correct and verified in both renders: warm off-white
    / near-black backgrounds, elevated card surfaces, readable ink tokens, identical
    data colors across themes'
  - Responsive 3x2 CSS grid for 6 tiles matches the spec's own layout guidance exactly
  - 'Correct Chart.js mount-node contract: one canvas per sparkline, animation disabled,
    no fixed canvas sizing, legend/tooltip cleanly disabled for the compact sparkline
    use case'
  weaknesses:
  - 'Each tile uses justify-content: space-between across label/value/sparkline, producing
    a large dead vertical gap between the metric label and the value, and again between
    the value and the sparkline — tighten this spacing for a denser, more polished
    stat-tile feel (affects VQ-05 / DE-02)'
  - 'Library Mastery is generic: the sparkline is a standard line+fill+hidden-scales
    recipe that any charting library could replicate with minor changes — consider
    a Chart.js-distinctive touch, e.g. a plugin-drawn end-point dot marker on the
    sparkline, or a canvas gradient fill instead of flat alpha color, to showcase
    library-specific capability'
  - Only 1 of 6 tiles is flagged 'critical'; a slightly wider spread of severity/status
    combinations would demonstrate fuller feature coverage of the status-coding concept
    (DQ-01)
  - buildMetric() is a helper function used to construct all 6 metrics — reasonable
    for avoiding repetition, but strict KISS structure (imports → data → plot → save,
    no functions) would inline the metric construction instead (CQ-01)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background matching #FAF8F1, with slightly lighter elevated card surfaces (~#FFFDF6) for the 6 tiles arranged in a 3x2 grid.
      Chrome: Title "dashboard-metrics-tiles · javascript · chartjs · anyplot.ai" in bold dark ink, fully visible top-left. Each tile has a small status dot + metric label (dark ink / soft ink), a large bold value, a small colored change indicator with arrow, and a filled sparkline line chart. All text is clearly legible against the light background.
      Data: First tile (CPU Usage, status "good") uses brand green (#009E73) for both the status dot and sparkline. Memory and Active Users (status "warning") use amber (#DDCC77). Error Rate (status "critical") uses matte red (#AE3030). Change indicators are colored green when the change is favorable (e.g. CPU down, Response Time down, Requests/sec up) and red when unfavorable (e.g. Memory up, Error Rate up, Active Users down), each paired with an explicit up/down arrow glyph.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black page background matching #1A1A17, with elevated dark-gray card surfaces (~#242420) for the 6 tiles, clearly distinguishable from the page background.
      Chrome: Same title, now rendered in light cream ink, fully visible and readable. Metric labels use a lighter soft-ink gray, values are bright white/cream, all readable against the dark tile backgrounds. No dark-on-dark or light-on-light failures observed anywhere.
      Data: Data colors (green, amber, matte red for status/sparklines; green/red for change indicators) are pixel-identical to the light render — only the chrome (page bg, card bg, text) flipped, as required.
      Legibility verdict: PASS
