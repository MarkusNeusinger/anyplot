review:
  strengths:
  - Consistent, well-designed card system with semantic status-color coding (green/amber/red)
    that gives instant at-a-glance health signal across all six tiles
  - Sparklines are forced to end exactly at the displayed current_value, keeping the
    trend visually consistent with the headline number
  - Change indicators pair a directional arrow with favorable/unfavorable color —
    accessible, non-color-only encoding
  - Realistic, varied dataset covering all three status tiers and both change directions
    across relatable ops metrics
  - Correct theme-adaptive chrome in both renders; data colors identical between light
    and dark
  weaknesses:
  - Noticeable empty whitespace between the title and the first tile row — could be
    tightened for a denser dashboard feel
  - Aesthetic polish is strong but generic (system sans-serif, no elevation/shadow
    cues) — short of top-tier publication-level design
  - Status dot color alone requires the viewer to infer meaning without a label; acceptable
    for a static PNG but worth a thought for future iterations
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page (#FAF8F1) with slightly lighter elevated card backgrounds; matches spec.
      Chrome: Title "dashboard-metrics-tiles · javascript · echarts · anyplot.ai" centered at top in dark text, readable. Metric labels (dark gray), big bold values (near-black), change indicators (colored) all clearly legible against light card backgrounds.
      Data: 6 tiles — CPU Usage (45%, green sparkline/dot), Memory Usage (72%, amber sparkline/dot), Response Time (120ms, green), Error Rate (2.3%, red), Active Users (8,540, green), Requests/sec (1,240, amber). First-class status color is brand green #009E73; amber #DDCC77 for warning; matte red #AE3030 for critical — correct Imprint semantic mapping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black page (#1A1A17) with slightly-elevated dark card backgrounds; matches spec.
      Chrome: Title and metric labels render in light gray/off-white, big values in near-white. No dark-on-dark issues found — all text clearly visible against dark card and page surfaces.
      Data: Sparkline and status-dot colors identical to light render (green/amber/red unchanged) — only chrome (background, card fill, text) flipped as required.
      Legibility verdict: PASS
