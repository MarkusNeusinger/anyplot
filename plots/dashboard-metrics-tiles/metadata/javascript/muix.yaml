  - 'Each tile carries every part the Notes ask for: bold 54 px value with a lighter
    unit suffix, uppercase metric label, SparkLineChart below the value, and an SVG
    arrow + percentage'
  - 'Change color follows favorability via a per-metric higher-is-better flag: Memory
    up and Uptime down read red, Response Time down and Request Rate up read green'
