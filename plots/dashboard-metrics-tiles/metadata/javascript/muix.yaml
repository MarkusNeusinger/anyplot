review:
  strengths:
  - 'Every tile carries all required parts with a clear hierarchy: 54 px bold value,
    softer unit suffix, uppercase letter-spaced label, arrow + percentage, and a sparkline
    below'
  - 'Change colors follow favorability, not direction: Uptime falling and Memory rising
    are red, CPU and Response Time falling are green'
  - Status uses the Imprint semantic anchors (green / amber / matte red) on the same
    left stripe of every tile, and tiles are sorted critical-first with a thicker
    critical stripe
  - 'Idiomatic SparkLineChart use: time-scale xAxis, area with baseline=''min'', monotoneX
    curve without overshoot, and a per-tile SVG gradient wired in through chart children
    and the .MuiLineChart-area class'
  - Both themes fully theme-adaptive through ANYPLOT_TOKENS (pageBg, elevatedBg, ink,
    inkSoft, grid)
  weaknesses:
  - 'Suggestion: enable SparkLineChart''s showTooltip and showHighlight so the HTML
    view lets readers inspect individual history values.'
  - 'Suggestion: a short status word (e.g. ''Critical'') next to the label would give
    the status a second, non-color cue.'
