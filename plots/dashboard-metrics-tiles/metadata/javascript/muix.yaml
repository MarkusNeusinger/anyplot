    the edges, leaving about 90 CSS px of empty band between the label and the value
    and again between the value and the 130 px sparkline in every tile → keep the
    label and value together at the top and give the freed height to the sparkline
    (about +60 px SPARK_H). Likely cause: the tile Box''s justifyContent: ''space-between''
    with a fixed SPARK_H = 130.'
  - 'Suggestion: a slightly larger title (about 26 px) would balance the 54 px tile
    values.'
