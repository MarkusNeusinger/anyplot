review:
  strengths:
  - Correct 3x2 tile grid for 6 metrics matching the spec's own grid-sizing guidance,
    with clean card styling (rounded corners, colored left-accent bar, generous padding)
  - 'Two independent semantic encodings are used correctly: the left border encodes
    tile status (good/warning/critical via #009E73 / amber / matte-red) while the
    change badge encodes favorable/unfavorable direction (green/red) with a redundant
    arrow glyph — matches the Imprint style guide''s status and sentiment semantic-exception
    examples exactly'
  - 'Idiomatic MUI X usage: SparkLineChart with area, curve="monotoneX", showHighlight,
    resolveSizeBeforeRender, and skipAnimation (required to avoid mid-tween screenshots)'
  - Deterministic, seeded data generation (small LCG) with no network calls, satisfying
    the offline/reproducibility requirement
  - Theme-adaptive chrome is correctly threaded through in both renders — text, borders,
    and tile backgrounds flip correctly while data/status colors stay identical between
    light and dark
  - 'Title format is exactly correct: "dashboard-metrics-tiles · javascript · muix
    · anyplot.ai"'
  weaknesses:
  - Example values for CPU Usage (45%, -5.2%), Memory (72%, +8.1%), and Response Time
    (120ms, -14.8%) are near-verbatim copies of the spec's own illustrative example
    ('CPU Usage at 45% (down 5%), Memory at 72% (up 8%), Response Time at 120ms (down
    15%)') rather than an independently generated realistic scenario — regenerate
    these three with different, still-plausible numbers.
  - Uptime tile shows '▼ 0.0%' for a -0.02% change_percent — rounding to one decimal
    makes the badge read as 'no change' while the arrow still points down, which is
    confusing. Use two decimal places for small-magnitude metrics like uptime so the
    displayed number and the arrow agree.
  - The up/down change indicator uses plain Unicode triangle glyphs (▲/▼) instead
    of a crisper vector/icon glyph — functional but reads as the least-polished element
    of an otherwise refined card design; consider an MUI icon or small inline SVG
    for a sharper look at 2x scale.
  - All six tiles carry equal visual weight (same size, same border thickness) regardless
    of severity — nothing beyond the thin accent bar helps the eye land on the one
    'critical' (Error Rate) tile first, so the dashboard doesn't create a strong at-a-glance
    priority order.
  - The sparkline area fill is a flat, fully-opaque solid color with no vertical fade
    — a subtle top-to-bottom alpha gradient on the area fill would match the rest
    of the card's restrained, polished aesthetic more closely.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background, consistent with #FAF8F1 — not pure white. Tile backgrounds are a very subtly lighter elevated tone, giving a nearly flat, minimalist card look rather than a heavy-contrast card-on-page effect.
      Chrome: Title "dashboard-metrics-tiles · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible with generous margin. Each of the 6 tiles has an uppercase gray metric label (CPU USAGE, MEMORY, RESPONSE TIME, ERROR RATE, REQUESTS / SEC, UPTIME), a large bold dark value, and a small colored change badge with an arrow glyph. All text is dark-on-light and clearly legible; no clipping at any canvas edge.
      Data: Left accent bars are green (CPU Usage, Response Time, Requests/sec — status "good"), amber/yellow (Memory, Uptime — status "warning"), and red (Error Rate — status "critical"). Change badges are colored green when the change is favorable and red when unfavorable, independent of the status color (e.g. Memory has an amber border but a red "unfavorable" badge). Sparklines below each value are compact filled area charts colored to match each tile's status accent, each ending exactly at the tile's headline value. First-series green matches #009E73; the critical/error color reads as the palette's matte-red semantic anchor.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black page background, consistent with #1A1A17 — not pure black. Tile backgrounds are a very subtly lighter dark tone than the page, matching the light theme's restrained elevation approach.
      Chrome: Same title, labels, values, and change badges as the light render, now rendered in light ink (near-white) against the dark tiles. No dark-on-dark or unreadable text was found anywhere — labels, values, and change percentages are all clearly legible. No edge clipping.
      Data: Accent-bar colors and sparkline fill colors are visually identical to the light render (green / amber / red), confirming only chrome (background, text) flipped between themes as required. Green still reads as the same #009E73-family hue on both surfaces.
      Legibility verdict: PASS
