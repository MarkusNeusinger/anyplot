review:
  strengths:
  - Severity-based tile ordering (critical first) plus a subtle background tint and
    thicker left border on the critical tile create a clear visual hierarchy the eye
    lands on immediately
  - Custom vector SVG change-arrows and a top-to-bottom alpha-fade gradient area fill
    (via the SparkLineChart `slots`/`slotProps` API) replace attempt 1's plain Unicode
    glyphs and flat fill
  - Example values (CPU 63%/-3.7%, Memory 58%/+4.6%, Response Time 187ms/-9.3%) are
    now independently chosen and no longer mirror the spec's own illustrative numbers
  - 'Small-magnitude formatting fix: uptime''s -0.02% now renders as "0.02%" (two
    decimals) instead of a misleading "0.0%" alongside its down arrow'
  - 'Two independent, semantically correct color encodings: left border/tile tint
    = status (good/warning/critical via `#009E73` / amber / matte-red `#AE3030`),
    change badge = favorable/unfavorable direction (green/red) with a redundant arrow,
    matching the Imprint style guide''s semantic-exception rules exactly'
  - 'Idiomatic, distinctive MUI X usage: `SparkLineChart` with `area`, `curve="monotoneX"`,
    `showHighlight`, `resolveSizeBeforeRender`, `skipAnimation`, and a custom `slots.area`
    override for the gradient fill'
  - Deterministic, seeded data generation (small LCG) with no network calls; theme-adaptive
    chrome correctly threaded through both renders with data colors identical across
    themes
  weaknesses:
  - Mandated title occupies only ~35% of canvas width — comfortably within bounds
    and not a violation, but there is room to grow it slightly for better visual balance
    with the tile grid below
  - Sparklines show no discrete point markers even for the sparse 16-point series;
    acceptable for the minimalist sparkline convention, but a single end-point dot
    (beyond the hover-only highlight) would reinforce the 'current value' anchor
  - Uptime tile is colored 'warning' for a 99.95% value with a tiny -0.02% dip — a
    plausible SLA-threshold read, but slightly arbitrary as the sole 'warning' justification
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page background, consistent with #FAF8F1, not pure white.
      Chrome: Title "dashboard-metrics-tiles · javascript · muix · anyplot.ai" top-left in dark ink, fully visible and not clipped. Six rounded tile cards in a 3x2 grid, each with an uppercase metric label in muted gray, a large bold dark value, and a colored change badge (vector arrow + percentage). Each tile has a colored left-accent bar (green/amber/red) matching its status; the critical "Error Rate" tile additionally carries a subtle red background tint and a thicker accent bar, making it the clear focal point.
      Data: Sparklines are filled with a top-to-bottom gradient fade in the tile's status color (green for CPU/Response Time/Requests-per-sec, amber for Memory/Uptime, red for Error Rate). Change badges use redundant color + arrow-direction encoding (green up/down = favorable, red = unfavorable), independent of the status color.
      Legibility verdict: PASS — all text (title, labels, values, change badges) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black background, consistent with #1A1A17, not pure black. Tile cards use a slightly lighter dark elevated background so the grid structure remains visible.
      Chrome: Title and all tile labels/values render in light ink (white/off-white), clearly readable. Same 3x2 grid, same critical-tile tint/border emphasis as the light render.
      Data: Accent bars, badge colors, and sparkline gradient fills are visually identical to the light render (green #009E73, amber, matte-red) — only the page/tile chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures found on any tile; all text remains legible against the dark background.
