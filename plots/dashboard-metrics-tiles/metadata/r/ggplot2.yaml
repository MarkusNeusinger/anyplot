review:
  strengths:
  - facet_wrap used as the tile grid with panel.background as elevated card surfaces
    — an idiomatic ggplot2 route to a dashboard layout
  - 'Every tile carries the required parts in the same arrangement: large bold value,
    arrow + percentage change, sparkline with terminal dot, metric label'
  - 'Change colors follow favorability, not direction: Memory and Disk I/O rises are
    red, Throughput rise and the falls of lower-is-better metrics are green'
  - 'Semantic anchors used for their roles (#009E73 good, #DDCC77 warning, #AE3030
    unfavorable) and theme tokens thread through all chrome in both renders'
  - scale_color_identity/scale_fill_identity with precomputed colors and a grouped
    rescale keep each sparkline scaled to its own range
  weaknesses:
  - 'VQ-04 (light): the warning tile''s amber #DDCC77 value ''72.1%'' and sparkline
    sit at about 1.5:1 on the #FFFDF6 tile and read faint, below the 3:1 the style
    guide names for marks on the light surface → keep amber for the status but give
    the amber elements a thin INK outline/stroke or carry the status on a larger element
    (e.g. a status bar or tinted card) while drawing the value in INK. Likely cause:
    geom_text/geom_line color = status_color with COL_WARNING on the light ELEVATED_BG.'
  - 'DQ-03 (both): the last history point is overwritten with the current value, so
    several sparklines end in a jump that contradicts their change indicator — Error
    Rate ▼22.5 % ends on a sharp rise, Disk I/O ▲3.4 % ends on a sharp drop, Memory
    ▲8.1 % falls for most of its history → generate the history so it trends toward
    the current value by the stated change and ends there by construction (drift-corrected
    walk, smaller noise). Likely cause: vals[n_pts] <- base after a random walk with
    sd = base*0.035 per step.'
  - 'Suggestion: set one metric to the critical status (for example Error Rate) so
    the red status color appears alongside good and warning.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; six cards on the elevated #FFFDF6 surface with thin INK_SOFT borders.
      Chrome: centered title 'Server Health · dashboard-metrics-tiles · r · ggplot2 · anyplot.ai' in dark ink; bold metric labels in INK_SOFT at the bottom of each card; no axes or grid.
      Data: 3x2 grid — CPU Usage 45.2% ▼5.2%, Memory 72.1% ▲8.1%, Response Time 118 ms ▼14.7%, Disk I/O 38.6% ▲3.4%, Throughput 1,247 req/s ▲12.3%, Error Rate 0.82% ▼22.5%. Values and sparklines in #009E73 except Memory in amber #DDCC77; change lines regular weight, smaller (~9 pt), green when favorable, red #AE3030 when unfavorable (Memory, Disk I/O). Sparklines with light area tint and a terminal dot. The amber Memory value reads faint on the light card.
      Legibility verdict: PASS (amber value low-contrast but legible)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page with #242420 cards and light-grey borders.
      Chrome: title in light ink, metric labels in light soft ink — all readable, no dark-on-dark text.
      Data: identical categorical colors to the light render (green, amber, red); area tints darker on the dark card; amber reads strongly here.
      Legibility verdict: PASS
