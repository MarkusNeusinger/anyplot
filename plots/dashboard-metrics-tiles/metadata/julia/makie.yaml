review:
  strengths:
  - 'Correct spec compliance: 6 tiles arranged 3x2 as the spec''s grid-density guidance
    recommends, each tile carrying value, label, sparkline, and change indicator'
  - 'Thoughtful semantic color use: tile accent (border + sparkline) is driven by
    status (good=#009E73, warning=#DDCC77 amber, critical=#AE3030), kept distinct
    from the change-indicator''s favorable/unfavorable green/red logic; the favorable/unfavorable
    mapping is verified correct per-metric (e.g. falling Response Time is colored
    green as a favorable decrease, rising Error Rate is colored red as unfavorable)'
  - 'Idiomatic Makie composition: fig[row, col] GridLayout indexing plus a spanning
    Label for the title and hidedecorations! for a clean tile canvas is the recommended
    Makie layout pattern'
  - 'Full theme-adaptive chrome: PAGE_BG/ELEVATED_BG/INK/INK_SOFT tokens correctly
    threaded through both renders; data accent colors are pixel-identical between
    light and dark'
  - Realistic, varied ops-monitoring data (CPU/Memory/Response Time/Error Rate/Throughput/Disk
    I/O) with plausible values and units baked into the value strings ('120 ms', '1,450
    req/s')
  - Clean KISS script structure, explicit Random.seed!(42), no fake interactive elements
  weaknesses:
  - Title Label spans only ~30% of canvas width at fontsize=22, well below the typography
    hierarchy's intent of the title reading as the clear largest/first element — could
    be sized up slightly without risking overflow
  - Four-sided colored spine border per tile departs from the style guide's default
    minimalism preference (remove top/right spines); a defensible card-UI exception
    for a dashboard-tile spec, but worth a deliberate, slightly thinner treatment
    so it reads as an accent rather than a full frame
  - No explicit legend/caption spelling out what the border/accent colors mean (good/warning/critical)
    — inferable from context and value text, but an explicit small caption would remove
    ambiguity for a first-time viewer unfamiliar with the convention
  - 'LM-02: the implementation leans on portable techniques (GridLayout indexing,
    scatter/lines/text) rather than a capability distinctive to Makie specifically
    — could not be replicated as easily using Makie recipes or Poly/Box primitives
    to differentiate the tile look further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold black title "dashboard-metrics-tiles · julia · makie · anyplot.ai" centered at top; each of the 6 tiles has a warm off-white elevated fill (~#FFFDF6) with a colored rectangular border (green/amber/red by status). Value text is bold black (~38pt), metric label is soft dark grey (~16pt), change percentage is bold and colored (green/red) with a small up/down triangle marker.
      Data: Sparklines colored to match each tile's status accent (green/amber/red), identical hues across tiles of the same status. First "good" status tile uses Imprint brand green #009E73.
      Legibility verdict: PASS — all title, value, label, and change text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Bold off-white title centered at top; tiles use a darker elevated fill (~#242420) with the same colored borders as the light render. Value text is bold off-white (~#F0EFE8), metric label is light grey (~#B8B7B0), change percentage keeps its colored (green/red) triangle + text.
      Data: Sparkline colors and tile border colors are identical to the light render (green #009E73 / amber #DDCC77 / red #AE3030) — only the surrounding chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text is light-colored against the dark tile/page background and remains fully legible.
