review:
  strengths:
  - 'Builds a community-only density heatmap from the MUI X v9 composition API: custom
    rects in ChartsSurface, positioned by useXScale/useYScale and colored by useZColorScale'
  - One zAxis continuous colorMap (imprint_seq) drives both the cells and the ContinuousColorLegend,
    so the color bar always matches the marks
  - Counts distinct traces per cell on a log scale, so the dense 0 V and 1 V levels
    and the rare outlying traces are both readable
  - 'The data honors the Notes exactly: sigmoid band-limited edges, 5 % amplitude
    noise, 3 % UI jitter, 300 traces, deterministic LCG'
  - Theme tokens are applied to all chrome; both renders are fully legible, and the
    data colors are identical
  weaknesses:
  - 'Suggestion: a finer density grid (for example 160 x 90 cells) would smooth the
    staircase contours of the eye opening.'
  - 'Suggestion: label one or two intermediate color-bar ticks (for example 5 and
    20 traces) so that the log scale can be read between its endpoints 1 and 67.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas; no plot box, only left and bottom axis lines in the soft ink color.
      Chrome: bold dark title "eye-diagram-basic · javascript · muix · anyplot.ai" centered at the top, a grey subtitle "300 overlaid traces · 200 samples per trace · 100 × 56 density cells", y label "Voltage (V)" with ticks 0.0 to 1.0, x label "Time (UI)" with ticks 0.0 to 2.0; all readable.
      Data: a grid of density cells forms two full eye openings between the 0 V and 1 V level bands, with an X-shaped crossing at 1.0 UI and partial crossings at 0 and 2 UI. Dense cells (the level bands, the crossing core) are blue #4467A3, sparse fringe cells brand green #009E73 (imprint_seq). On the right, a vertical color bar titled "Traces per cell (log scale)" runs from 1 (green) to 67 (blue).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
