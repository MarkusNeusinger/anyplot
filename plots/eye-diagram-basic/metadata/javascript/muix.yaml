review:
  strengths:
  - 'Builds a true 2-D density heatmap from the community surface: ChartsDataProvider
    + ChartsSurface with a custom DensityCells layer that reads useXScale/useYScale/useZColorScale,
    so cells share the axes'' scales and the zAxis continuous colorMap instead of
    hand-mapped colors'
  - Density counts distinct traces per cell (Set per cell) on a log scale, so both
    the dense 0 V / 1 V levels and the sparse noise fringe stay visible; the eye opening
    and the crossing at 1.0 UI read immediately
  - 'Data simulation matches the Notes exactly: 300 traces x 200 samples over 2 UI,
    sigmoid band-limited edges, Gaussian jitter sigma 0.03 UI and noise sigma 0.05
    V, seeded LCG for reproducibility'
  - 'Native ContinuousColorLegend with an Imprint seq ramp (#009E73 -> #4467A3) and
    a reader-facing title ''Traces per cell (log scale)''; labels back-transformed
    to real counts (1, 67)'
  - 'Theme tokens threaded through title, subtitle, axis labels, ticks and axis lines;
    data colors identical in both renders, all text readable on #FAF8F1 and #1A1A17'
  - Axis bands sized explicitly (x height 68, y width 84) per the v9 truncation gotcha;
    skipAnimation set
  weaknesses:
  - 'VQ-05 (both): the y-axis title ''Voltage (V)'' sits about 55 CSS px left of its
    3-character tick labels, detached from the axis while the x-axis title sits close
    to its ticks → bring it within about 20 px of the tick labels (about -35 px of
    band). Likely cause: yAxis width: 84 reserved for tick labels like ''0.0'' that
    need only about 40 px.'
  - 'Suggestion: add one or two intermediate labels on the log-scale color bar (e.g.
    3, 10, 30) so mid-density cells can be read off it, not only the 1 and 67 ends.'
  - 'Suggestion: a finer density grid (e.g. 160 x 80 cells) would soften the staircase
    edges around the eye opening.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white; the eye openings show the page color.
      Chrome: centered bold title "eye-diagram-basic · javascript · muix · anyplot.ai" (~32% width), soft-ink subtitle "300 overlaid traces · 200 samples per trace · 100 × 56 density cells"; y-axis "Voltage (V)" with ticks 0.0–1.0 in 0.2 steps, x-axis "Time (UI)" with ticks 0.0–2.0; left and bottom axis lines only, no grid. Right side: color bar titled "Traces per cell (log scale)" labeled 1 (bottom) to 67 (top). All text dark and readable.
      Data: 100 × 56 density heatmap; dense levels at 0 V and 1 V and the crossing at 1.0 UI in slate blue (#4467A3 end), sparse fringe cells in brand green #009E73. Two clean eye openings (one full eye 0–1 UI, one 1–2 UI) with partial crossings at the 0 and 2 UI edges; smooth sigmoid edges cross in an X shape.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; eye openings show the dark page.
      Chrome: title, subtitle, axis titles, ticks, axis lines and color-bar labels all flip to light ink and are clearly readable; no dark-on-dark text.
      Data: identical green→blue density colors and identical cell layout to the light render; brand green fringe clearly visible.
      Legibility verdict: PASS
