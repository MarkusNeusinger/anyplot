review:
  strengths:
  - 'Log-scaled maturity axis with tickvals at maturity_years and ticktext from the
    maturity labels: true time spacing with readable 1M-30Y ticks'
  - Theme tokens threaded through every chrome element; both renders fully legible
    with identical Imprint data colors
  - Redundant marker shapes (circle/diamond/square) keep the three curves distinguishable
    without color
  - 'Plotly-native interactivity in the HTML: unified x hover with dotted across-spikes
    and per-point maturity labels in the hovertemplate'
  - Inversion region shown with add_hrect shading plus a bordered, arrowed 'Inversion
    Zone' callout
  weaknesses:
  - 'VQ-05 (both): an empty band of about 12 % of the canvas height (≈210 px) separates
    the subtitle from the top of the plot area → close it to about 4 % (−130 px).
    Likely cause: margin t=90 combined with the title anchored at y=0.97; reduce margin
    t to about 65.'
  - 'SC-02, SC-03 (both): curves drawn with spline interpolation swing past their
    points (Oct 2023 dips below its 4.62 % 10Y yield before rising to 20Y, Jan 2022
    bulges above 2.32 % between 20Y and 30Y), breaking the spec''s ''never smoothed
    away from its points'' → straight segments through the points. Likely cause: line
    shape=''spline''; use shape=''linear''.'
  - 'DQ-02 (both): the Jun 2023 curve is labelled ''Flat'' yet falls 143 bps from
    1M (5.27 %) to 10Y (3.84 %), a deeper inversion than the ''Inverted'' Oct 2023
    curve (−92 bps) → label it by its real shape, or use a genuinely flat snapshot
    (1M-10Y within about ±25 bps). Likely cause: the series name list / yields_flat
    values.'
  - 'Suggestion: tie the ''+264 bps at 10Y'' label to the two curves it measures;
    drawn in brand green it currently reads as part of the Jan 2022 curve.'
  - 'Suggestion: a slightly stronger inversion band fill would separate it more clearly
    from the light background.'
