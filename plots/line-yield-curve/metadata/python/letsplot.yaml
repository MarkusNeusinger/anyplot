      Data: Jan 2018 in #009E73, Aug 2019 in #C475FD, Mar 2021 in #4467A3, lines size 1.0 with points; #AE3030 ribbon (alpha 0.18) from 1M to 10Y between the Aug 2019 curve and a dark 1.52 % outline line; italic red 'Inversion Region' label touching the 1M purple point
      Legibility verdict: PASS (all text readable; tick-label crowding noted)

