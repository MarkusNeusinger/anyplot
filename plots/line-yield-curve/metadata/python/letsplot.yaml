review:
  strengths:
  - Historically grounded U.S. Treasury curves for Jan 2018, Aug 2019 and Mar 2021
    show normal, inverted and steep shapes on one axis
  - Numeric maturity_years axis keeps true time spacing between maturities (C1)
  - Imprint palette in canonical order with full theme-adaptive chrome in both renders
  - layer_tooltips() with .line() chains gives native lets-plot hover detail (date,
    maturity, yield) in the HTML output
  weaknesses:
  - 'VQ-01, VQ-02, SC-02 (both): only 7 of the 11 maturities carry a tick label (1M,
    3M, 3Y and 7Y points have none, C2), and because ''6M'' and ''1Y'' touch at the
    bunched short end lets-plot rotates every x tick label 90 degrees → all 11 maturity
    labels, horizontal and clear of each other, e.g. a log x-axis with breaks=maturity_years
    and labels=maturities. Likely cause: linear scale_x_continuous with the hand-picked
    tick_positions list.'
  - 'SC-03 (both): the inversion ribbon spans 1M through 10Y, so it also shades 3Y-7Y
    where the Aug 2019 yields (1.44-1.48 %) sit below its 10Y yield (1.52 %), which
    is not inversion, and its dark outline adds an unlabelled 1.52 % line → shade
    only the maturities whose yield exceeds the 10Y yield (1M-2Y) and drop the outline.
    Likely cause: inv_mat = range(9) without a y_upper > y_lower filter; geom_ribbon''s
    default outline color.'
  - 'VQ-01, VQ-02 (both): the ''Inversion Region'' annotation (#AE3030 italic, size
    4) touches the 1M Aug 2019 marker (text at 2.15 % vs point at 2.09 %), and in
    the dark render the dark red reads dim on #1A1A17 → clear the marker by about
    0.1 percentage points and use a theme-adaptive text color in dark. Likely cause:
    geom_text y=2.15 and the fixed color=''#AE3030''.'
  - 'DE-02 (both): all four panel spines are drawn as a full rectangular frame where
    nothing requires it → L-shaped (left and bottom only) or none. Likely cause: axis_line=element_line(color=INK_SOFT)
    applied to the panel frame under theme_minimal(); set the top/right lines to element_blank().'
  - 'CQ-04 (code): lines 42-67 append three near-identical dicts per maturity in a
    loop (26 lines) → one pd.DataFrame({...}) built from maturities * 3, maturity_years
    * 3, the concatenated yield lists and the repeated dates. Likely cause: row-by-row
    construction.'
  - 'Suggestion: give the legend keys the ELEVATED_BG fill (legend_key=element_rect(fill=ELEVATED_BG))
    so no page-colored squares sit inside the legend frame.'
  image_description: |-
