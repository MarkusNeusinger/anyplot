review:
  strengths:
  - 'Idiomatic seaborn multi-series call: one sns.lineplot with hue+style+markers=True+dashes=False
    gives each date its own color and marker shape (circle/X/square) and builds the
    legend automatically'
  - Log-scaled maturity_years axis with the 11 maturity labels as ticks at their true
    positions, minor ticks suppressed — distances reflect time while the short end
    stays readable
  - Real U.S. Treasury curves from three regimes (2021 near-zero, 2023 deep inversion,
    2024 partial normalization) with values close to the historical record
  - 'Theme tokens threaded through sns.set_theme rc params: both renders are theme-correct
    with readable chrome and identical Imprint data colors'
  - Inversion zone shaded in the Imprint semantic red (loss/danger role) at alpha
    0.18, visible on both surfaces behind the curves
  weaknesses:
  - 'VQ-02 (both): the ''2Y–10Y Inversion'' label is centered at x=6 on the inverted
    curve''s 3Y–5Y segment, so the purple line runs through its leading ''2Y'' → place
    the text where no curve passes (e.g. inside the box above the 7Y–10Y points, or
    right of 10Y), clear of the line by at least ~4 px. Likely cause: ax.text(6, (yield_2y
    + yield_10y) / 2, ...) anchored at the box center, which the inverted curve crosses.'
  - 'VQ-01 (dark): the annotation in #AE3030 at 9 pt has low contrast on #1A1A17 (about
    2.6:1) and reads faintly → raise contrast to ≥ 4.5:1 for text, e.g. keep the red
    fill but draw the label in INK or INK_SOFT. Likely cause: color=SEMANTIC_RED on
    the ax.text call used for both themes.'
  - 'DQ-02 (both): the 2024-09-15 curve is labelled ''(Flat)'' although its 1M yield
    (4.96 %) sits 131 bp above its 10Y (3.65 %) — a short-end inversion, not a flat
    curve → label the shape it shows (e.g. ''(Partially inverted)'') or pick a snapshot
    that is actually flat (front-to-back spread under ~25 bp). Likely cause: the curves
    dict key ''2024-09-15 (Flat)''.'
  - 'Suggestion: a slightly larger annotation (10 pt) would match the axis-label hierarchy.'
  - 'Suggestion: the legend could sit closer to the green curve''s start to tighten
    the left whitespace.'
