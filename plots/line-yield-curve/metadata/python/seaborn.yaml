      Data: three lines with markers on a log maturity axis — green #009E73 circles (2021-07-15 Normal, 0.05→1.99 %), lavender #C475FD X markers (2023-07-15 Inverted, 5.47 % peak at 6M falling to 3.98 % at 10Y), blue #4467A3 squares (2024-09-15 "Flat", 4.96→3.44→4.03 %). A semantic-red #AE3030 box at alpha 0.18 spans 2Y–10Y between 3.98 and 4.87 % with the label "2Y–10Y Inversion"; the purple line passes through the label's leading "2Y".
