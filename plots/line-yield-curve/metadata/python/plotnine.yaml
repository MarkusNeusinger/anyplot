review:
  strengths:
  - Log maturity axis (scale_x_log10) with every tenor 1M–30Y labelled at its true
    position, so the short end is legible while spacing still reflects time
  - Inversion region shaded in translucent matte red behind the curves with a matching
    italic label — highlighted without hiding any line
  - 'Semantic colouring: brand green for the normal curve, matte red for the inverted
    recession-signal curve, lavender for the flat one'
  - Legend placed in the empty lower-right quadrant on an elevated surface, clear
    of all data, with date and curve shape in each label
  - 'Theme-adaptive chrome in both renders: all text, grid and axis line threaded
    through INK / INK_SOFT tokens'
  - 'Idiomatic plotnine: coord_cartesian view clipping, pd.Categorical ordering, guide_legend(override_aes=...)'
  weaknesses:
  - 'VQ-01 (dark): the italic ''Inversion zone (short-term > long-term)'' label is
    drawn in #AE3030 at alpha 0.85 on #1A1A17 and reads dim, about 3:1 contrast →
    full-opacity text, or the label in INK_SOFT next to the red shading. Likely cause:
    annotate(''text'', color=PALETTE_INVERTED, alpha=0.85).'
  - 'DQ-02 (both): the curves are labelled with real dates but carry invented values
    — 2021-06-15 shows the 1M at 1.55 % and the 10Y at 3.35 %, where the actual Treasury
    curve stood near 0.03 % and 1.5 %; 2023-01-10 is drawn flat at about 4.1 % although
    that curve was already inverted (1M ≈ 4.4 %, 10Y ≈ 3.5 %) → use values that match
    the dated Treasury curves (or rates consistent with them). Likely cause: the hand-typed
    yields_normal / yields_flat lists.'
  - 'Suggestion: the shading box spans the flat curve''s band too; tightening its
    lower edge toward the inverted curve''s 10Y trough would tie it more clearly to
    the inverted curve.'
  image_description: |-
    Light render (plot-light.png):
