review:
  strengths:
  - pygal.XY places every yield at its maturity in years, so maturity spacing reflects
    time; x_labels with x_labels_major and show_minor_x_labels=False label the maturities
    without crowding the bunched short end
  - 'Theme tokens threaded through pygal''s Style object: #FAF8F1 / #1A1A17 backgrounds,
    ink text and muted guides, with identical Imprint data colors in both renders'
  - 2Y–10Y inversion shaded with a translucent ochre box behind the curves, anchored
    by oversized ochre dots and a legend entry quantifying the spread (−102 bps)
  - x_value_formatter / y_value_formatter turn the HTML output's native tooltips into
    readable maturity and percent values
  weaknesses:
  - 'SC-02, SC-03 (both): interpolate="cubic" swings the curves past the yields they
    connect — the Mar 2023 curve peaks at about 5.12 % between 6M and 1Y (highest
    yield 5.09 %), dips to about 3.54 % just after 10Y (point 3.58 %) and humps to
    about 3.93 % between 20Y and 30Y (points 3.89 % / 3.70 %); the Dec 2018 curve
    overshoots its 2.63 % 1Y point → straight segments through each yield (overshoot
    0, about −0.04 pp). Likely cause: interpolate="cubic" on pygal.XY (line 86).'
  - 'VQ-03 (both): dots at r=7 px and strokes about 4 px wide read thin for 11-point
    sparse curves on the 3200×1800 canvas and almost vanish in the 400 px thumbnail
    → dots about r=12 px (+5 px) and strokes about 6 px (+2 px). Likely cause: dots_size=7
    in chart.add() and stroke_style={"width": 4}.'
  - 'CQ-04 (code): line 104 stroke_dasharray="15,10" is not a pygal series option
    and has no effect — the ochre 2Y–10Y connector renders solid in both renders →
    remove (or use stroke_style={"dasharray": "15, 10"} if a dash is wanted). Likely
    cause: a misremembered keyword.'
  - 'Suggestion: a logarithmic maturity axis (pygal.XY(logarithmic=True) on x) would
    spread the bunched 1M–2Y maturities and leave room to label 3M, 6M, 3Y and 7Y.'
  - 'Suggestion: listing the curves chronologically (Dec 2018, Jan 2021, Mar 2023)
    in the legend would make the time evolution easier to follow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no chart frame.
      Chrome: title 'U.S. Treasury Yield Curves · line-yield-curve · python · pygal · anyplot.ai' in dark ink at the top (~63 % width); y-axis 'Yield (%)' with ticks 0–5, x-axis 'Maturity (Years)' with ticks 1M, 1Y, 2Y, 5Y, 10Y, 20Y, 30Y; dotted horizontal guides only; legend of four entries along the bottom. All text readable.
      Data: Jan 2021 normal curve in #009E73 rising 0.04→1.87 %, Dec 2018 flat curve in #C475FD around 2.4–3.0 %, Mar 2023 inverted curve in #4467A3 from 5.09 % at 6M down to 3.58 % at 10Y; cubic interpolation with slight overshoot between points; translucent ochre (#BD8233) box from 2Y to 10Y with large ochre anchor dots joined by a solid ochre line; legend entry '2Y–10Y Inversion (−102 bps)'.
      Legibility verdict: PASS

