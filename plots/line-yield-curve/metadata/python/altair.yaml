review:
  strengths:
  - Log-scaled maturity axis with labelExpr mapping each numeric position to its 1M…30Y
    label, so spacing reflects real time
  - 'Semantic Imprint colouring: green for the normal curve, matte red #AE3030 for
    the inverted curve, blue for the normalizing curve, with regime names in the legend'
  - Grid reduced to horizontal lines only and the legend placed in the empty lower
    right, clear of all curves
  - Historically plausible U.S. Treasury snapshots (Jan 2022, Jul 2023, Jan 2025)
    showing normal, inverted and flat shapes
  - Idiomatic Altair layering (shade + line + points + labels) with tooltips and an
    interactive HTML export
  weaknesses:
  - 'VQ-05 (both): the log x-scale is rounded out to whole decades (about 0.01–100
    years), so about 23 % of the plot width sits empty left of 1M and about 13 % right
    of 30Y → the axis should end near 1M and 30Y as the code''s domain=[0.08, 35]
    intends (about −35 % wasted width). Likely cause: alt.Scale(type=''log'', domain=[0.08,
    35]) without nice=False.'
  - 'VQ-01 (light): the ''Inversion Region'' label is drawn in amber #DDCC77 italic
    at 12 px on the #FAF8F1 page, about 1.5:1 contrast, and washes out (near-invisible
    in the 400 px thumbnail) → a theme-adaptive ink for the label text (INK_SOFT),
    or a darker shade that reaches at least 3:1 on cream (about +1.5:1 contrast);
    the dark render is fine. Likely cause: inversion_label mark_text(color=ANYPLOT_AMBER)
    — the style guide asks for theme-adaptive tokens on annotations.'
  - 'Suggestion: build the long DataFrame from a dict of the three yield lists with
    pd.melt instead of three appends per maturity.'
