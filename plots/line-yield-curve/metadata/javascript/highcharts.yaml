review:
  strengths:
  - Real U.S. Treasury snapshots covering three rate regimes (near-zero 2021, the
    2022 inversion, 2024 higher-for-longer) on one axis
  - Log10-spaced maturity positions with explicit tickPositions and a label formatter,
    so 1M–30Y read at true relative spacing with their maturity labels
  - Native xAxis.plotBands with built-in label shades the short-end inversion region
    behind the curves, with a theme-adapted alpha
  - Imprint palette via t.palette and all chrome from ANYPLOT_TOKENS — both themes
    read cleanly
  - Tooltip formatter gives maturity label and yield per point in the HTML output
  weaknesses:
  - 'DQ-03 (both): the Jun 2024 curve is labelled ''Flat'' but its data is inverted
    by about 1.1 pp (6M 5.38 % vs 10Y 4.28 %), more than the curve labelled ''Inverted''
    (1Y 4.75 % vs 10Y 3.96 %, 0.79 pp) → label it as inverted or use a genuinely flat
    snapshot (short–long spread within about ±0.3 pp). Likely cause: the series name
    ''Jun 2024 — Flat'' and the jun2024 array.'
  - 'CQ-04 (code): the nearest-index search `logX.reduce(...)` is written out twice
    (lines 48–51 tick formatter, 128–130 tooltip) → `matLabels[logX.indexOf(this.value)]`
    for the ticks and a per-point `name` read as `this.point.name` in the tooltip.
    Likely cause: float-tolerant lookup kept where exact tickPositions values are
    passed back.'
  - 'Suggestion: Highcharts'' native `xAxis.type: "logarithmic"` with explicit tickPositions
    could replace the manual log10 transform.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (transparent chart over the page), not pure white.
