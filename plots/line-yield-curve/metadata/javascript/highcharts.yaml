      Data: Jan 2021 — Normal in #009E73 (near zero, rising to 1.83 % at 30Y), Nov 2022 — Inverted in lavender #C475FD (humped at 1Y 4.75 %), Jun 2024 — Flat in blue #4467A3 (5.3–5.4 % short end falling to ~4.3 %); light red-tinted band shades 1M–2Y behind the curves.
