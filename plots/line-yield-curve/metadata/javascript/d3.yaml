review:
  strengths:
  - Log-scale x-axis (d3.scaleLog) places each maturity at its true year while keeping
    the clustered short end readable; axisBottom tickValues/tickFormat maps the positions
    back to the 1M…30Y labels
  - Inversion region shaded with d3.area against a fixed 10Y baseline, light enough
    that the Jan 2023 curve beneath stays visible, with a labelled 10Y reference line
  - Historically grounded U.S. Treasury curves (Jan 2022 near-zero front end, Jul
    2023 peak inversion) tell the 2022–2023 tightening cycle in chronological order
  - Legend glyphs combine line sample, dash pattern and haloed marker on an elevated
    inset card, matching the drawn curves in both themes
  - Theme tokens threaded through every chrome element; data colors identical in light
    and dark
  weaknesses:
  - 'VQ-01 (dark): the matte-red annotations ''Inverted'', ''10Y'' and ''3.96%'' are
    drawn at opacity 0.65–0.75, so on #1A1A17 they reach only about 2:1 contrast and
    read dim → full opacity (at least 3:1 against the page). Likely cause: .attr("opacity",
    0.65) / .attr("opacity", 0.75) on the three annotation texts.'
  - 'VQ-07 (both): the Jan 2023 ''Flat'' curve is drawn in palette[2] blue #4467A3,
    skipping canonical slot 2 without a semantic cue for ''Flat'' → t.palette[1].
    Likely cause: color: t.palette[2] with the ''financial convention'' comment.'
  - 'DQ-03 (both): the curve labelled ''Jan 2023 — Flat'' is inverted by about 1 pt
    (3M 4.65% vs 10Y 3.68%, 30Y 3.74%), so the legend label misstates the data → yields
    with a short–long spread near 0 (3M vs 10Y within about ±0.2 pt), or a label that
    matches the shape. Likely cause: the Jan 2023 yields array and shape: "Flat".'
  - 'Suggestion: drop the outer tick stubs at the axis ends (the unlabelled −0.5%
    mark) with tickSizeOuter(0).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title "line-yield-curve · javascript · d3 · anyplot.ai" bold dark ink centered at top (~28% of width); axis titles "Maturity" and "Yield (%)" in dark ink; x ticks 1M…30Y on a log scale, y ticks 0.0%–6.0%; subtle horizontal gridlines only; legend card upper right on an elevated surface. All text readable.
      Data: Jan 2022 Normal in brand green #009E73 rising 0.05%→2.22%; Jan 2023 "Flat" in blue #4467A3, dashed, humped at 6M then falling to ~3.7%; Jul 2023 Inverted in matte red #AE3030 from 5.5% down to 3.82%. Haloed markers at each of 11 maturities. Light red shading between the inverted curve and a dashed 10Y baseline at 3.96% from 1M to 10Y; 14px italic "Inverted" label near 2Y and "10Y / 3.96%" in the right margin.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, axis titles and tick labels in light ink, gridlines subtle dark gray, legend card on a slightly elevated dark surface with light text. No dark-on-dark text in the chrome.
      Data: green, blue and red identical to the light render; only chrome flipped. Shading reads as a faint dark-red band. The matte-red annotations ("Inverted", "10Y", "3.96%") at reduced opacity are readable but dim against the dark page.
      Legibility verdict: PASS (annotations low-contrast, see weaknesses)
