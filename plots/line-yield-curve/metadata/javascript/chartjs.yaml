review:
  strengths:
  - Logarithmic x-axis with afterBuildTicks pins one tick at each maturity_years value,
    so spacing reflects time and every tick carries its maturity label
  - Inline Chart.js plugin (beforeDraw + scales.x.getPixelForValue) paints the 3M-10Y
    inversion band beneath the datasets, with a theme-specific alpha so it stays subtle
    on both surfaces
  - Semantic matte red for the inverted Nov 2022 curve, with legend labels naming
    each curve's date and shape
  - Built-in subtitle plugin explains the shaded band in inkSoft italic under the
    title
  - Page-colored point halos (pointBorderColor = t.pageBg) separate markers from the
    band and the grid in both themes
  - Real U.S. Treasury snapshots covering normal, flattening and inverted shapes
  weaknesses:
  - 'DE-02 (both): vertical gridlines at all 11 maturities on a line chart, drawn
    across the inversion band → y-axis grid only, as the style guide asks for line
    charts (remove the 11 vertical lines). Likely cause: scales.x.grid.color: t.grid
    instead of grid.display: false.'
  - 'SC-03 (both): tension 0.3 Bezier splines swing past the data between neighbouring
    points (lavender dips below 1.88% between 7Y and 10Y, red bulges just above 4.59%
    around 1Y, green rises above 1.83% between 20Y and 30Y) → curves that never leave
    the range of the two points they connect (0 overshoot). Likely cause: tension:
    0.3 without cubicInterpolationMode: ''monotone''.'
  - 'CQ-04 (code): matLabel (lines 25-32) runs a nearest-neighbour search over maturityYears
    for every tick, although afterBuildTicks already sets the ticks in maturity order
    → ticks.callback: (v, i) => maturities[i] (about −8 lines). Likely cause: a guard
    against floating-point drift that the fixed tick list makes unnecessary.'
  - 'Suggestion: a direct label at the 1Y peak of the Nov 2022 curve could name the
    2Y–10Y spread.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: title 'line-yield-curve · javascript · chartjs · anyplot.ai' in dark ink, italic inkSoft subtitle explaining the 3M–10Y shaded band, centered legend with three point-style ovals, y-axis 'Yield (%)' with 0.00%–5.00% ticks, x-axis 'Maturity' with 11 log-spaced ticks 1M–30Y. Subtle gridlines on both axes: horizontal at every 0.5% and vertical at each of the 11 maturities, crossing the shaded band. All text readable.
      Data: brand green #009E73 (Jan 2021 — Normal), lavender #C475FD (Jan 2022 — Flattening), matte red #AE3030 (Nov 2022 — Inverted); 11 haloed points each on smoothed lines; faint red band from 3M to 10Y behind the curves.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, axis titles and ticks all light ink on dark; grid subtle on both axes, vertical lines at every maturity crossing the maroon band; no dark-on-dark text.
      Data: identical colors to the light render; point halos switch to the dark page color; the inversion band uses a stronger alpha and reads as a dark maroon panel, curves stay clearly visible.
      Legibility verdict: PASS
