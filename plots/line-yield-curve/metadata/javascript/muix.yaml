review:
  strengths:
  - Maturity on a true log axis (scaleType 'log') with tickInterval pinned to the
    11 maturities and a valueFormatter mapping years back to the maturity labels,
    so spacing reflects time while every tick reads 1M…30Y
  - Inversion regions are derived from the data by rule (peak to the lowest later
    yield), shaded in each curve's own colour between the curve and a dashed line
    at the starting yield, and labelled with the exact spread in percentage points
  - Custom SVG overlay drawn as a child of LineChart through the useXScale/useYScale/useDrawingArea
    hooks, so the shading sits in data coordinates inside MUI X's own chart context
  - Legend entries give the date plus a computed shape (normal / inverted beyond 2Y
    / inverted), and the header pairs the mandated title with a subtitle that states
    the log scale
  - Realistic, well-chosen U.S. Treasury snapshots (1993 steep normal, 2000 humped
    inversion, 2007 inverted from the short end), with the estimated cells disclosed
    in a comment
  - 'Both themes correct: Imprint positions 1–3 identical in light and dark, chrome
    from ANYPLOT_TOKENS, haloed annotation text (paintOrder stroke) readable over
    lines and grid'
  - Series valueFormatter gives percent tooltips in the interactive HTML; skipAnimation
    set
  weaknesses:
  - 'Suggestion: the blue 2007 inversion shading reads faint on the dark page; a slightly
    higher fill opacity in dark would give it the presence the lavender span has.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white frame.
      Chrome: bold title "U.S. Treasury Yield Curves · line-yield-curve · javascript · muix · anyplot.ai" (about 55 % of the width) over an inkSoft subtitle "3 curves × 11 maturities, 1M to 30Y · maturity on a log scale"; horizontal legend top right; y axis "Yield (%)" with ticks 3.0–7.0 in 0.5 steps; x axis "Maturity" on a log scale with ticks 1M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 20Y, 30Y at their maturity positions; subtle horizontal gridlines only. All text dark on light and readable.
      Data: three linear curves with hollow circle markers at all 11 maturities: 1993-06-15 (normal, brand green #009E73, 3.0 → 6.8), 2000-03-15 (inverted beyond 2Y, lavender #C475FD, humped at 6.5 % at 2Y, 5.9 % at 30Y), 2007-01-16 (inverted, blue #4467A3, 5.2 % at 1M down to 4.7 % at 3Y/5Y). Each inverted span is shaded at 20 % opacity in the curve's colour between the curve and a dashed line at the span's starting yield, with a bold haloed label: "2000-03-15: 2Y 6.50% above 30Y 5.90%, spread −0.60 pp" and "2007-01-16: 1M 5.20% above 5Y 4.70%, spread −0.50 pp". The green curve crosses both shaded areas; all curves stay visible through the shading.
