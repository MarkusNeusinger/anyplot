review:
  strengths:
  - Log-scale maturity axis with tickInterval pinned to all 11 maturities and a valueFormatter
    that labels each tick 1M…30Y at its true position
  - Inversion band drawn as a custom SVG layer via useXScale / useDrawingArea, so
    the shading sits in data coordinates behind the curves
  - Linear segments through every point keep each curve on its yields
  - Legend labels name both the date and the curve shape (Normal / Humped / Inverted),
    with matte red reserved for the inverted curve
  - Horizontal-only grid at 0.25 opacity stays behind the data in both themes
  - Interactive HTML keeps MUI X's native hover tooltips for reading individual yields
  weaknesses:
  - 'Suggestion: the full-height band also shades the Jun 1993 normal curve; limiting
    the shading to the area between the Jan 2007 curve and its 5Y level would tie
    the highlight to the inverted curve alone.'
  - 'Suggestion: the 1M bill and 20Y bond were not issued in mid-1993; a comment noting
    that those two points are interpolated would keep the ''approximate'' data honest.'
  - 'Suggestion: the y axis from 0% leaves the band below 3% empty; a 2–7.5% range
    would give the curve shapes more vertical room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'U.S. Treasury Yield Curves · line-yield-curve · javascript · muix · anyplot.ai' centred in dark ink (~45% width); x-axis 'Maturity' with ticks 1M, 3M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 20Y, 30Y at log positions; y-axis 'Yield (%)' with 0%–7% ticks; faint horizontal grid; horizontal legend at the bottom. All readable.
      Data: Jun 1993 (Normal) in brand green #009E73 rising 3.0%→6.8%; Mar 2000 (Humped) in lavender #C475FD 5.7%→6.5%→5.9%; Jan 2007 (Inverted) in matte red #AE3030 falling 5.2%→4.7% at 5Y then 4.9%; hollow markers on every point, straight segments. Light-red translucent band from 1M to 5Y labelled 'Inversion: short-term yields above long-term' near the top, behind the curves.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, axis titles, tick labels, legend text and band label all in light ink; grid faint but present; no dark-on-dark text.
      Data: green, lavender and matte red identical to the light render; the band renders as a dark reddish-brown tint, still visible without hiding the curves.
      Legibility verdict: PASS
