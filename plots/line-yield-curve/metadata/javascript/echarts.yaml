review:
  strengths:
  - Log maturity axis with [maturity_years, yield] pairs keeps true time spacing
  - ECharts-native endLabel puts each curve's date at its 30Y point
  - markArea shades the 1Y–10Y inversion region behind the curves with a label
  - Theme-adaptive chrome legible in both renders; Imprint palette in canonical order
  - Realistic U.S. Treasury snapshots tell the zero-rate → hiking → inversion story
  weaknesses:
  - 'SC-02, SC-03 (both): the x-axis labels only 4 of the 11 maturities, and ''1M''
    is drawn at 0.1 yr and ''30Y'' at the 35-yr axis end instead of at their maturities
    → one labeled tick per maturity exactly at its maturity_years. Likely cause: xAxis.axisLabel.formatter
    mapping decade ticks (0.1, 1, 10, ≥25) to maturity names; use axisLabel/axisTick
    customValues set to the maturity years.'
  - 'VQ-05 (both): the x-axis title ''Maturity'' sits only ~10 px above the legend
    row → at least ~25 px between them (+15 px). Likely cause: xAxis.nameGap 42 with
    legend.bottom 32 and grid.bottom 110.'
  - 'DE-02 (both): vertical gridlines run at the x ticks, against the style guide''s
    Y-only grid for line charts → remove them. Likely cause: xAxis.splitLine with
    a t.grid lineStyle.'
  - 'Suggestion: give the inverted Mar 2023 curve a slightly heavier line to make
    it the focal curve.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 — correct.
      Chrome: Bold dark title "U.S. Treasury Yield Curves · line-yield-curve · javascript · echarts · anyplot.ai" centred; "Yield (%)" and "Maturity" axis names, the latter directly above the legend row; y ticks 0%–6%, x ticks 1M, 1Y, 10Y, 30Y on a log axis; subtle gridlines on both axes, including vertical lines at the four x ticks. All text readable dark-on-light.
      Data: Jan 2021 brand green #009E73 rising from ~0.07% to 1.86%; Jul 2022 lavender flat ~3.1–3.3%; Mar 2023 blue humped at 5% and inverted to ~3.96%. Circle markers at 11 maturities, bold series-colored end labels, grey-blue 1Y–10Y band labelled "Inversion Zone". Bottom legend with rounded swatches.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 — correct.
      Chrome: Title, axis names, ticks and legend in light ink; light subtle gridlines on both axes; no dark-on-dark text.
      Data: Colors identical to the light render; inversion band reads as a slightly lighter slate band behind the curves.
      Legibility verdict: PASS
