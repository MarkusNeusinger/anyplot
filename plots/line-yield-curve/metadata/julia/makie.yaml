review:
  strengths:
  - Historically accurate U.S. Treasury snapshots (Jan 2021, Oct 2022, Jul 2023) show
    the normal, flat and inverted shapes in one frame
  - Log10 maturity axis with the maturity labels as an xticks (values, labels) tuple
    keeps true time spacing and readable 1M-30Y ticks
  - Inversion highlighted with the amber warning anchor via native band!, with an
    INK_SOFT label that reads on the band in both themes
  - Theme tokens threaded through every chrome element; both renders pass the legibility
    check
  - 'Idiomatic Makie: scatterlines!, band!, axislegend on an elevated background'
  weaknesses:
  - 'VQ-01 (both): the in-plot annotations are set at fontsize 10 ("COVID-era near-zero
    rates", about 20 px tall) and 11 ("Inverted zone"), smaller than the 12 pt tick
    labels, and blur to about 2-3 px in the 400 px thumbnail → about 13-14 pt (+3
    pt), at least the tick-label size. Likely cause: text! fontsize = 11 (line 91)
    and fontsize = 10 (line 97).'
  - 'Suggestion: the "COVID-era near-zero rates" label floats at 2.2 %, about two
    points above the Jan 2021 curve it describes; placing it just above the green
    curve''s flat short end would tie it to its series.'
  - 'Suggestion: anchoring the inversion band at the short-end peak (3M/6M, 5.49 %)
    instead of the 2Y yield would shade the full 3M-10Y inversion of the Jul 2023
    curve.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; 3200x1800 landscape.
      Chrome: title "U.S. Treasury Yields · line-yield-curve · julia · makie · anyplot.ai" bold dark ink, about 75 % of the width; axis labels "Maturity" and "Yield (%)" in dark ink; tick labels 1M-30Y on a log axis and 0-6 on y in INK_SOFT, all readable; y-only grid, subtle; top/right spines removed; legend top-right on an elevated cream box with a thin frame.
      Data: Jan 2021 in #009E73 (near-zero short end rising to 1.84 % at 30Y), Oct 2022 in #C475FD (humped around 4.5 %), Jul 2023 in #4467A3 (5.3-5.5 % at the short end, falling to about 4 % past 10Y). Amber #DDCC77 band at 30 % alpha from 2Y to 30Y between the 2Y yield and the Jul 2023 curve, labelled "Inverted zone" in INK_SOFT, readable on the band. "COVID-era near-zero rates" annotation in INK_SOFT floats at about 2.2 % between 2Y and 7Y. Annotations are small.
