review:
  strengths:
  - 'Inversion shading is computed from the data: a geom_ribbon from the Jul 2023
    curve''s own 30Y yield (3.96 %) up to its 1M-10Y yields, so the shaded area is
    exactly where that curve''s short end exceeds its long end'
  - scale_x_log10 with breaks = maturity_years and labels = maturities puts every
    maturity label at its true time position
  - Historically grounded Treasury curves (Jan 2021 normal, Jul 2023 deeply inverted,
    Jan 2024 normalizing) tell a coherent term-structure story
  - 'Full theme-token chrome: every text, axis line, grid and the shading flip correctly
    between #FAF8F1 and #1A1A17 while the Imprint data colors stay identical'
  - Three-level ink hierarchy keeps the 'Inversion zone' label in INK_MUTED, secondary
    to the curves
  weaknesses:
  - 'Suggestion: name the curve in the annotation (for example ''Jul 2023 inversion'')
    so the shading is not read as belonging to the Jan 2024 curve that runs through
    it'
  - 'Suggestion: drop the vertical major grid lines at every maturity and keep the
    horizontal ones, for the minimal gridlines the Notes ask for'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Title 'line-yield-curve · r · ggplot2 · anyplot.ai' in dark ink top-left (about 64 % of the panel width); 'Yield (%)' and 'Maturity' axis titles in dark ink; tick labels 0.0%-6.0% and 1M-30Y in soft grey; left and bottom axis lines; subtle 15 % grid; 'Inversion zone' label in muted grey above the 6M-1Y points. All readable.
      Data: Three lines with dot markers on a log maturity axis: Jan 2021 brand green #009E73 rising from 0.05 % to 1.83 %; Jul 2023 lavender #C475FD and Jan 2024 blue #4467A3 both falling from about 5.5 % to about 4 % and crossing at 3M and 10Y. A grey ribbon (alpha 0.20) shades 1M-10Y from 3.96 % up to the Jul 2023 curve. Legend on the right on an elevated off-white fill, no frame, with line+point glyphs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title and axis titles in light ink, tick labels and legend text in light grey, axis lines light grey, grid subtle. No dark-on-dark text. The 'Inversion zone' label is light muted grey and readable. Legend on a #242420 elevated fill.
      Data: Green, lavender and blue identical to the light render; only the chrome flips. The inversion ribbon reads as a lighter warm-grey band and stays clearly visible; the blue Jan 2024 curve has lower contrast than the others but is distinct.
