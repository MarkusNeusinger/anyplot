review:
  strengths:
  - Block-diagonal department clustering is immediately visible, directly delivering
    the spec's core insight about community structure
  - Undirected graph correctly fills both triangles, and absent edges (including the
    diagonal) use a distinct near-background color per spec guidance
  - Correct use of the Imprint imprint_seq sequential colormap (brand green to blue)
    for single-polarity edge-weight data, with theme-correct chrome in both light
    and dark renders
  - 'Clean, minimal theme: grid and spines removed, coord_fixed keeps tiles square,
    tile borders in page-bg color give subtle separation without clutter'
  - Reproducible (set.seed(42)), idiomatic KISS ggplot2 code with correct title format
    and output naming
  weaknesses:
  - No axis title text (x = NULL, y = NULL) — a reader unfamiliar with adjacency matrices
    has no textual cue that rows/columns represent employees; add a shared axis label
    (e.g. 'Employee') even though source/target don't need distinguishing on this
    symmetric matrix
  - With 30 nodes per axis, the rotated tick labels are tight at full resolution and
    will compress hard when the image is scaled to the ~400px mobile width — consider
    the spec's suggestion to show only group boundaries (department separators) for
    large networks, or a slightly larger/sparser labeling scheme
  - Design Excellence is solid but stays close to a well-configured compliant default
    (correct palette + minimal theme) rather than adding extra polish — e.g. subtle
    department-boundary divider lines or a brief subtitle explaining how to read the
    matrix would elevate it further
  - Tick label density (30 rotated labels per axis) makes the chart feel slightly
    crowded, limiting how 'polished' the whitespace reads despite the otherwise clean
    theme
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "heatmap-adjacency · r · ggplot2 · anyplot.ai" in dark ink top-left, clearly readable. Y-axis node labels (ENG-01..10, MKT-01..10, SLS-01..10) horizontal and readable; X-axis node labels rotated 90°, readable and non-overlapping. Colorbar legend "Meetings per month" on the right with dark, legible title/tick text.
      Data: 30x30 tile grid. Filled tiles use a green-to-blue sequential gradient (imprint_seq, brand green #009E73 at the low end). Absent edges (including the diagonal) render as a near-white background tone, clearly distinct from the saturated data tiles. Three visible dense blocks along the diagonal (ENG, MKT, SLS) reveal department-level clustering, with sparser, paler cross-department connections elsewhere.
      Legibility verdict: PASS — all text readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title and axis tick labels render in light text, clearly legible against the dark surface. Colorbar title/ticks also light and readable. No dark-on-dark failures observed.
      Data: Identical green-to-blue gradient and tile arrangement as the light render — data colors unchanged between themes. Absent-edge tiles use a slightly elevated near-black tone (#242420-consistent), distinguishable from the pure background as a faint checkerboard against filled tiles, and clearly distinct from the saturated green/blue data tiles.
      Legibility verdict: PASS — all text readable against the dark background; data colors confirmed identical to the light render, only chrome flipped correctly.
