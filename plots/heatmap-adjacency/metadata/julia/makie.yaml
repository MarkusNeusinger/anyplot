review:
  strengths:
  - Clean, theme-correct use of the Imprint sequential colormap for weighted edges,
    identical across both renders
  - Team-based pre-ordering plus group-boundary divider lines make the block-diagonal
    community structure immediately visible
  - Absent edges/self-loops correctly rendered as page-background, keeping 'no connection'
    visually distinct from 'weak connection'
  - Correct square canvas choice for a symmetric grid-based plot
  weaknesses:
  - Individual node names are never shown on either axis (only 4 group labels) - no
    way to identify which node a cell refers to
  - using ColorSchemes appears to be an unused import - cgrad with a hex-color list
    doesn't require it
  - Design Excellence is solid but short of full marks - consider strengthening visual
    hierarchy further (e.g. within-block ordering by degree, or the spec's optional
    dendrogram strip)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold dark title, dark axis labels ("Target"/"Source"), soft-dark tick labels showing 4 team names centered per block; colorbar labeled "Collaboration Strength" with soft-dark ticks. All clearly readable.
      Data: 30x30 grid pre-ordered by team (Engineering/Design/Sales/Marketing), sequential green (#009E73) to blue (#4467A3) colormap for weight; group boundary divider lines visible; absent edges/self-loops match page background (distinct from data colors).
