review:
  strengths:
  - 'Correct use of the Imprint sequential colormap (#009E73 → #4467A3) for the continuous
    edge-weight encoding, matching the style guide exactly.'
  - Symmetric adjacency matrix properly filled in both triangles; absent edges (and
    the diagonal) are NaN and render as the page-background color, giving a clear
    distinct-background cue per the spec.
  - Nodes pre-ordered by team so the block-diagonal structure is immediately visible,
    with boundary lines drawn between team blocks — strong, spec-aligned data storytelling.
  - 'Full theme-adaptive chrome: title, subtitle, axis labels, tick labels, spines,
    and colorbar all flip correctly between light and dark while data colors stay
    identical.'
  - Unlabeled per-node minor ticks correctly hint at the true 30x30 node density underneath
    the 4 labeled team group ticks, addressing the spec's 'large network, show group
    boundaries' note.
  - Canvas lands exactly on the 2400x2400 square target with no clipped text in either
    render.
  weaknesses:
  - Title occupies only ~45% of the plot width at titlesize=20 on this square canvas,
    below the 50-70% target proportion — a slightly larger titlesize (~22-24) would
    improve visual balance without risking overflow.
  - Design excellence is solid (theme tokens, sequential palette, boundary lines)
    but not exceptional — consider a subtle secondary visual cue (e.g. slightly bolder
    boundary lines or a light block-background tint) to push the cluster storytelling
    further.
  - The optional dendrogram along the axes (mentioned in the spec as a nice-to-have)
    is not included; not required, but would have added extra feature coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-adjacency · julia · makie · anyplot.ai" in bold dark ink, clearly
        readable; subtitle "30 nodes, ordered by team" in soft gray beneath it. Axis titles
        "Target" (x) and "Source" (y) in dark ink. Team-name tick labels (Engineering, Design,
        Sales, Marketing) in soft gray at both axes' block centers, plus fine unlabeled minor
        ticks at every node position. Colorbar on the right labeled "Collaboration Strength"
        with 0.0/0.5/1.0 ticks, all legible.
      Data: Cell colors run from the anyplot brand green (#009E73, weak collaboration) to blue
        (#4467A3, strong collaboration) via the Imprint sequential gradient. Absent edges and
        the diagonal render as the same off-white background, cleanly distinguishing "no data"
        from "weak edge". Four team blocks are outlined with thin dark boundary lines; each
        block is visibly denser (more blue/teal cells) along its own diagonal block than in the
        sparser green cross-team regions, exposing the intended block-diagonal structure.
      Legibility verdict: PASS — all text is clearly readable against the light background,
        no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-label/tick-label layout as the light render, now
        rendered in light ink (near-white title, light-gray subtitle and tick labels) against
        the dark background. Colorbar label and ticks are equally legible in light gray/white.
      Data: Data colors (green-to-blue gradient) are identical to the light render — only the
        page background, ink, and grid/spine colors flipped. Absent edges render as the same
        near-black background as the page, again cleanly distinct from the data-colored cells.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no
        dark-on-dark failures observed (title, axis labels, tick labels, and colorbar text all
        use the light INK/INK_SOFT tokens, not the dark defaults).
