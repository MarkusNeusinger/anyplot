review:
  strengths:
  - Absent edges are NaN gaps, so the page background shows through in both themes
    and can never be mistaken for the weakest edge (C3)
  - imprint_seq colorscale with a thin, outline-free colorbar whose two-line title
    reads 'Co-occurrence strength'
  - Nodes ordered by research domain produce five clear diagonal blocks, separated
    by INK boundary lines that flip correctly between themes
  - scaleanchor with constrain='domain' keeps every cell square on the 2400x2400 canvas
  - hoverongaps=False and a custom hovertemplate give clean pair-and-strength hover
    in the HTML
  weaknesses:
  - 'VQ-02 (both): the 30 rotated x tick labels at -45° collide with their neighbours
    (neural net/gradient/backprop run into each other, hippocampus crosses neuron
    and axon, chromosome touches mutation) → no tick label touching another. Likely
    cause: tickangle=-45 on 30 categories in a matrix about 320 px wide; tickangle=-90
    or a wider matrix.'
  - 'VQ-05 (both): an empty band of about 6 % of the canvas height sits between the
    title and the matrix, and the matrix uses only about two thirds of the width →
    matrix top within about 3 % of the title, matrix filling more of the canvas. Likely
    cause: scaleanchor with constrain=''domain'' shrinks the plot area inside margins
    t=60, b=105, l=100, leaving the vertical slack above it.'
  - 'Suggestion: domain names along the boundary lines would let a reader name each
    block without reading six terms.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "Research Domain Co-occurrence · heatmap-adjacency · python · plotly · anyplot.ai" in dark ink, about 80 % of the width; y axis title "Source term", x axis title "Target term", 30 node names as ticks (x rotated -45°, neighbours touching), colorbar "Co-occurrence strength" 0-0.8; black domain boundary lines. All text readable.
      Data: 30x30 symmetric matrix with 1 px cell gaps; five diagonal blocks in blue (0.55-1.0), scattered green inter-domain cells (0.05-0.12), absent edges and the diagonal left as page-colored gaps. Lowest color is #009E73.
