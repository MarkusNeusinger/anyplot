review:
  strengths:
  - Department ordering of the 30 researchers exposes three dense blocks along the
    diagonal with sparse, weaker cross-department cells
  - Undirected graph mirrored across the diagonal with a vectorized np.triu / np.where
    construction, so both triangles match exactly
  - Absent edges use na_value=PAGE_BG, so empty cells read as background in both themes
    and never as a weak edge
  - 'Continuous weight mapped through the imprint_seq gradient (#009E73 → #4467A3)
    with a colorbar legend on an elevated-surface box'
  - Canonical 2400x2400 square canvas with theme tokens threaded through title, axis
    text and legend
  weaknesses:
  - 'VQ-01 (both): the node tick labels are set at 9 px, below the style guide''s
    10 px tick reference for lets-plot, and read small beside the 14 px axis titles
    → 10 px (+1 px); the 30 cells per axis leave room. Likely cause: element_text(size=9)
    in axis_text and axis_text_x.'
  - 'Suggestion: the optional dendrogram the Notes allow, aligned with the node order,
    would show how the department ordering was reached.'
  - 'Suggestion: layer_tooltips() on geom_tile could name the researcher pair and
    strength in the HTML view.'
  image_description: |-
