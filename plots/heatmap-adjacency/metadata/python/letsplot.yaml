      Data: 30x30 tiles; weak edges in brand green #009E73 shading to blue #4467A3 for strong edges; three dense blocks along the diagonal (Alice-Jack, Kate-Tina, Uma-Derek) with scattered green cross-department cells; empty diagonal; matrix symmetric; absent edges show the page color.
