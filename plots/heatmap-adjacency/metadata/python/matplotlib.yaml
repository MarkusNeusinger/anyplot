      Data: 30×30 symmetric matrix, three dense diagonal blocks (10/12/8) in teal-to-blue (strong 0.5–1.0), scattered inter-community cells in brand green (weak 0.05–0.3), empty diagonal; semi-transparent ink lines mark community boundaries. imprint_seq green→blue colormap.
