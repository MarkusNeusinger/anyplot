review:
  strengths:
  - 'Continuous edge weight drawn with imprint_seq (#009E73 → #4467A3) and absent
    edges masked to NaN with cmap.set_bad(PAGE_BG), so weak edges (green) never blend
    into the page tone in either theme'
  - blended_transform_factory(ax.transData, ax.transAxes) places the community headers
    at data-x / axes-y — a matplotlib transform idiom that keeps them centred over
    each block whatever the layout
  - Symmetric matrix built vectorised (np.triu mask + upper + upper.T) with nodes
    sorted by community, so three blocks sit cleanly on the diagonal with sparse inter-group
    cells
  - Exact 2400×2400 canvas from figsize=(6, 6), dpi=400 and layout='constrained',
    with theme tokens threaded through title, labels, ticks, spines and colour bar
    in both renders
  weaknesses:
  - 'DQ-02 (both): nodes are labelled ''Neuro 01'' … ''Psych 08'', numbered placeholders
    that read as generic IDs rather than people in a collaboration network → invented
    researcher names (e.g. surnames per lab), keeping the community prefix in the
    boundary headers. Likely cause: the labels list comprehension f"{name} {k:02d}".'
  - 'Suggestion: the community headers reuse #009E73 and #4467A3, the exact endpoints
    of imprint_seq, so ''Neuro'' reads like ''weak edge'' and ''Psych'' like ''strong
    edge''; INK-coloured headers would keep the two encodings apart.'
  - 'Suggestion: label the colour bar''s scale explicitly as normalised, e.g. ''Connection
    strength (0–1)''.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white; absent-edge cells take the same page tone.
