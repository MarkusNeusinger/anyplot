  strengths:
  - Absent edges sit on a neutral elevated tile, so a missing tie never reads as a
    weak one (C3) in either theme
  - imprint_seq ramp for edge weight with a color bar, identical data colors in light
    and dark renders
  - Department separators drawn with mark_rule and bandPosition=0 land exactly on
    the block edges of the ordinal scale
  - Symmetric 24x24 matrix ordered by department shows three clear diagonal blocks
    with sparse weak cross ties
  - Canvas lands exactly on 2400x2400 via pad-only post-processing
  - Native tooltips (researcher, co-author, strength) in the HTML output
  weaknesses:
  - 'VQ-05 (both): the 368x368 inner view leaves the content occupying only the middle
    of the 2400x2400 canvas, with empty bands of about 330 px above the title and
    about 325 px below the x-axis title, the matrix spans only about 61 % of the canvas
    width, and the legend frame is about 580 px wide around a 70 px gradient → inner
    view near the library prompt''s square 500x460 (about +100 px each) and a compact
    legend so the matrix fills the canvas. Likely cause: .properties(width=368, height=368)
    plus the long legend title setting the legend frame width.'
  - 'Suggestion: department labels (Physics, Biology, Chemistry) at the block boundaries
    would name the groups the separators delimit.'
