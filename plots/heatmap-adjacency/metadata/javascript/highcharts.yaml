review:
  strengths:
  - Block-diagonal cluster structure is immediately visible thanks to lab-ordered
    nodes and thick block-boundary dividers
  - Full symmetric matrix (both triangles filled) correctly represents the undirected
    graph
  - Three-way visual distinction (weighted color scale / "No papers" swatch / "Self-pair
    (n/a)" hatch) cleanly disambiguates all data states per the spec
  - Correct, theme-consistent imprint_seq colorbar with clear labeling
  - Clever invisible-scatter-overlay technique restores native tooltip interactivity
    despite the missing native heatmap module
  - Title font size scales with title length so the long mandated string never overflows
  weaknesses:
  - 'Layout balance: noticeable extra whitespace below the colorbar/legend column
    compared to the matrix area — tighten the vertical margins or grow the grid slightly
    to use the canvas more evenly'
  - No overarching axis label (e.g., "Researcher") beyond the per-block lab names
    — a small addition would make the row/column semantics fully explicit at a glance
  image_description: |-
