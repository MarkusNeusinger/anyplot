review:
  strengths:
  - 'Clever workaround for the missing heatmap module: cells are hand-drawn with the
    SVG renderer while an invisible matched-axis scatter layer restores genuine native
    Highcharts tooltips, exactly matching the library''s core-bundle-only constraint'
  - Nodes are pre-ordered by lab (cluster) so the block-diagonal structure is immediately
    visible, with thicker divider lines and centered group labels marking the boundaries
    per the spec's guidance for large networks
  - Both triangles are filled for the undirected graph and the matrix is visibly symmetric
    across the diagonal
  - Absent edges use a distinct background fill (elevatedBg) clearly separated from
    the sequential color scale, with a dedicated 'No papers' swatch in the legend
  - Colorbar legend with min/max labels and axis title ('Joint papers') fulfills the
    spec's requirement, and the continuous scale correctly uses imprint_seq (green→blue)
    rather than an arbitrary colormap
  - Deterministic LCG-based data generation with a plausible, neutral co-authorship
    scenario (4 labs, 32 researchers)
  - Fixed-geometry layout (single source of truth for margins/grid/colorbar column)
    keeps everything aligned across both theme renders without drift
  weaknesses:
  - Diagonal self-pair cells are rendered identically to genuine absent-edge cells
    ('no papers'), which is slightly misleading — self-collaboration is meaningless
    rather than a zero value; consider a distinct neutral hatch/shade for the diagonal
    to disambiguate 'not applicable' from 'no edge'
  - Only group-boundary labels are shown on the axes (no individual node identifiers
    anywhere, even in the tooltip's diagonal case it just repeats the name once) —
    acceptable per spec for large networks, but with only 32 nodes there was some
    room to also show a few sparse tick marks for orientation within a block
  - 32 nodes sits at the low end of the spec's 20–200 range; a somewhat larger network
    would better demonstrate why a matrix view beats a node-link diagram for dense
    graphs
  - Helper functions (hexToRgb, lerp, weightFill, clearDrawn, drawAll) add structure
    beyond a minimal script — largely justified by the custom-render workaround, but
    keep an eye on creeping complexity in future revisions
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "Co-authorship Network by Lab · heatmap-adjacency · javascript · highcharts · anyplot.ai" is bold dark text, fully visible and not clipped. Subtitle below it in muted gray, readable. Four lab-group labels ("Neuroscience", "Robotics", "Genomics", "Climate Science") appear centered along both the left edge and bottom edge of the matrix in medium-gray text, all legible. Colorbar on the right titled "Joint papers" with "12" at top and "1" at bottom, plus a bordered "No papers" swatch below it with its own label — all text crisp against the light background.
      Data: A 32x32 grid divided into four labeled blocks by thin/thick divider lines. Cells range from a green (#009E73-ish) at low weights to a blue-teal (#4467A3-ish) at high weights; empty/absent-edge cells use a near-white fill matching the page background, distinguished only by thin grid outlines. The matrix is visibly symmetric across the diagonal, and each lab's diagonal block is visibly denser (more colored cells, more blue) than the off-diagonal blocks, clearly exposing block-diagonal cluster structure.
      Legibility verdict: PASS — all title, subtitle, axis group labels, colorbar text, and legend text are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title and subtitle text, now light-colored, fully legible against the dark background. Lab-group labels on both axes remain in a light muted gray, clearly readable. Colorbar title, numeric labels ("12", "1"), and the "No papers" swatch label are all rendered in light text, easily readable against the dark canvas.
      Data: Identical color mapping to the light render — same green-to-blue sequential scale for edge weight, same near-black/neutral fill for absent edges (now blending closer to the dark background but still distinguishable via grid lines), and the same block-diagonal density pattern. Data colors are confirmed identical between the two renders; only the chrome (background, text, grid lines, dividers) has flipped to the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text remains clearly visible against the near-black background, and the grid divider lines remain visible without dominating.
