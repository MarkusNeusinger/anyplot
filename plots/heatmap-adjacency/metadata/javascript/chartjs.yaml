review:
  strengths:
  - 'Idiomatic, rules-compliant workaround for Chart.js''s missing matrix chart type:
    a scatter chart supplies the category scales, and a native afterDatasetsDraw plugin
    draws the cells directly on canvas — no banned chartjs-chart-matrix or external
    library, per the library''s ''no workarounds'' rule.'
  - 'Attempt 1''s VQ-06 gap is closed: explicit ''Source node'' / ''Target node''
    axis titles now state the row/column semantics instead of relying on tick labels
    alone.'
  - 'Attempt 1''s group-identity weakness is closed: a subtitle (''Groups: D = Design
    · E = Engineering · M = Marketing'') spells out the abbreviations so viewers no
    longer have to infer group names from single letters.'
  - Correct imprint_seq colorbar (green to blue) with accurate min/max labels and
    a clearly labeled 'Connection weight' axis title; community-boundary divider lines
    correctly expose the block-diagonal structure the spec asks for.
  - Symmetric adjacency matrix fills both triangles, self-loops are neutralized to
    zero, absent edges render as the page background, and theme-adaptive chrome (ink/inkSoft
    tokens) is threaded correctly through title, ticks, colorbar text, and boundary
    lines in both renders.
  weaknesses:
  - At mobile width (~400px) the 22 rotated tick labels at 11px will still be tight
    to read — for large networks the spec itself suggests showing only group-boundary
    labels instead of every node name.
  - The colorbar's bottom tick reads '0.00' but the minimum weight on any actually-drawn
    edge is ~0.1 (true zero-weight cells are absent edges rendered as the page background,
    a different visual channel) — a viewer could misread the scale's practical floor.
  - Helper functions (lcg, hexToRgb, weightColor) add a bit of structure beyond a
    flat script, though they are reasonably justified by the custom-plugin rendering
    approach this plot type requires.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — matches the light theme surface.
      Chrome: Title "heatmap-adjacency · javascript · chartjs · anyplot.ai" in bold dark ink at top, clearly readable. Subtitle "Groups: D = Design · E = Engineering · M = Marketing" in soft dark gray beneath it, legible. "Target node" axis title above the top tick labels (D1-D7, E1-E9, M1-M6, rotated 90°) and "Source node" axis title to the left of the row tick labels — both new since attempt 1 and both clearly readable. Thin gray group-boundary lines separate the Design/Engineering/Marketing blocks. Colorbar on the right labeled "Connection weight" with "0.97" at top and "0.00" at bottom, both readable, fully inside the canvas with generous right margin.
      Data: Matrix cells colored on the imprint_seq scale (brand green #009E73 for low weights fading to steel blue #4467A3 for high weights); absent-edge cells render as the page background (invisible), diagonal self-loops are also blank. Same-group cells are visibly denser/darker, producing clear block-diagonal clusters for each of the three groups; the matrix is visually symmetric across the diagonal.
      Legibility verdict: PASS — all title, subtitle, axis-title, tick-label, and colorbar text is clearly readable against the light background; no light-on-light issues; no clipped text found at any edge (checked top, bottom, left, right crops).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the dark theme surface.
      Chrome: Title, subtitle, "Target node" / "Source node" axis titles, and tick labels all render in light ink/soft-gray, fully legible against the dark background. Group-boundary lines remain visible as subtle light-gray dividers. Colorbar labels and "Connection weight" text render in light ink, readable, same position as the light render.
      Data: Cell colors are identical to the light render (same green-to-blue gradient and the same weight pattern per cell) — only the chrome (background, text, dividers) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text remains clearly visible against the near-black surface; no clipped text found at any edge.
