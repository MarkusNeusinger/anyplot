review:
  strengths:
  - 'Idiomatic, rules-compliant workaround for Chart.js''s missing matrix chart type:
    a scatter chart provides the category scales, and a native Chart.js plugin (afterDatasetsDraw)
    draws the cells directly on canvas — no banned chartjs-chart-matrix or external
    library used, exactly per the library''s ''no workarounds'' rule.'
  - Community-boundary divider lines correctly expose the block-diagonal structure
    requested by the spec, and nodes are pre-ordered by group so the clusters are
    immediately visible.
  - Correct imprint_seq colorbar (green to blue) with accurate min/max value labels
    and a clearly labeled 'Connection weight' axis title.
  - Symmetric adjacency matrix fills both triangles as required, self-loops are neutralized
    to zero, and absent edges render as the page background per the spec's 'distinct
    background for absent edges' note.
  - Theme-adaptive chrome (ink/inkSoft tokens) is threaded through title, ticks, colorbar
    text, and boundary lines correctly in both light and dark renders.
  weaknesses:
  - No explicit axis titles (e.g. 'Source node' / 'Target node') — only per-node tick
    labels, so the source/target semantics of rows vs. columns aren't stated (VQ-06).
  - Group membership is only implied by the first letter of each node label (D/E/M);
    a small legend or axis grouping label naming 'Design / Engineering / Marketing'
    would remove the need to infer group identity from abbreviations.
  - At mobile width (~400px) the 22 tick labels at 11px will be tight to read — consider
    showing only group-boundary labels for large networks, as the spec itself suggests
    as an option.
  - Helper functions (lcg, hexToRgb, weightColor) add a bit of structure beyond a
    flat script, though they are reasonably justified by the custom-plugin rendering
    approach this plot type requires.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — matches the light theme surface.
      Chrome: Title "heatmap-adjacency · javascript · chartjs · anyplot.ai" in bold dark ink at top, clearly readable. Node tick labels (D1-D7, E1-E9, M1-M6) on both the top (rotated 90°) and left axes in a soft dark gray, all legible. Thin gray group-boundary lines separate Design/Engineering/Marketing blocks. Colorbar on the right labeled "Connection weight" with "0.97" at top and "0.00" at bottom, both readable.
      Data: Matrix cells colored on the imprint_seq scale (brand green #009E73 for low weights fading to blue #4467A3 for high weights); absent-edge cells render as the page background (near-invisible, per spec). Same-group cells are visibly denser/darker (higher weight), producing clear block-diagonal clusters for each of the three groups.
      Legibility verdict: PASS — all title, tick label, and colorbar text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the dark theme surface.
      Chrome: Title now in light ink, tick labels in light soft-gray, both fully legible against the dark background. Group-boundary lines remain visible as subtle light-gray dividers. Colorbar labels and "Connection weight" text render in light ink, readable.
      Data: Cell colors are pixel-identical to the light render (verified same green-to-blue gradient and the same weight pattern) — only the chrome (background, text, dividers) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text remains clearly visible against the near-black surface.
