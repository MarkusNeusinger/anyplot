review:
  strengths:
  - 'Bridge-highlight scatter overlay directly addresses the attempt-1 DE-03/LM-02
    feedback: the top 3 cross-department ties get a ring marker and dedicated tooltip,
    giving the block-diagonal matrix a clear secondary focal point'
  - dataZoom (inside, both axes) plus a custom axisPointer with a formatted line label
    let a viewer inspect individual node pairs in the interactive HTML view without
    cluttering the static 30x30 matrix with 30 tick labels
  - Node order fixed by department membership cleanly exposes block-diagonal structure;
    symmetric weight matrix correctly fills both triangles with the diagonal cleanly
    omitted
  - Absent edges (weight 0) get an explicit itemStyle override to a near-background
    fill, clearly distinct from the low end of the imprint_seq continuous scale, exactly
    per spec
  - Continuous visualMap correctly built from t.seq (imprint_seq, brand-green-to-blue)
    rather than a default/named colormap, with data colors identical between light
    and dark renders
  - Deterministic fixed-seed LCG avoids relying on a browser RNG; realistic, neutral
    employee-collaboration dataset; canvas gate passed at the required 2400x2400 square
    target
  weaknesses:
  - Spec asks for node-name tick labels on the axes; only department boundary labels
    are static on the PNG — individual node names surface exclusively via axisPointer
    hover in the HTML, so the static render still shows only 3 labels per axis
  - The visualMap colorbar legend uses qualitative text ("Strong"/"Weak") instead
    of the numeric weight scale, so a reader cannot read off actual edge-strength
    values from the legend alone
  - Composition is still fundamentally a standard sequential heatmap with a scatter
    overlay; no further visual device (e.g. a subtle outline around each department
    block) reinforces the block-diagonal grouping beyond color alone
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (not pure white).
      Chrome: Title "Employee Collaboration Network · heatmap-adjacency · javascript · echarts · anyplot.ai" is centered, bold, dark ink, fully legible. "Engineering"/"Design"/"Marketing" boundary labels appear on both axes in medium-gray. Vertical "Strong"/"Weak" colorbar sits on the right with matching gray text.
      Data: 30x30 matrix (12+8+10 nodes) shows dense blue/teal blocks along the diagonal blocks (intra-department collaboration) fading to green for sparser cross-department links; absent edges render as a near-background fill; the true diagonal (self-pairs) is omitted. Six dark-ringed circle markers highlight the 3 strongest cross-department bridges (each pair marked symmetrically).
      Legibility verdict: PASS — all title, axis, and legend text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (not pure black).
      Chrome: Same title and axis boundary labels now render in light text (white/light-gray), clearly legible. Colorbar text also flips to light gray. No dark-on-dark failures observed.
      Data: Identical blue-to-green sequential ramp and matrix values as the light render — only chrome (background, text, cell border color) has flipped. Absent-edge cells render as a slightly darker near-black fill, still distinct from the omitted diagonal and from the surrounding page background. The same six bridge-highlight ring markers are visible, now with a light ring color for contrast against the dark background.
      Legibility verdict: PASS — all title, axis, and legend text is clearly readable against the dark background; brand green/blue data hues are unchanged from the light render.
