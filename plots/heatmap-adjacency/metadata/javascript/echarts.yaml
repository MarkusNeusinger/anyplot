review:
  strengths:
  - Node ordering fixed by department membership cleanly exposes block-diagonal structure
    without an extra clustering step, matching the spec's 'reorderable by cluster'
    intent
  - Symmetric weight matrix correctly fills both triangles for the undirected graph,
    with the diagonal cleanly omitted
  - Absent edges (weight 0) get an explicit itemStyle override to a near-background
    fill, clearly distinct from the low end of the continuous scale, exactly per spec
  - Continuous visualMap correctly built from t.seq (imprint_seq) rather than a default/named
    colormap, with a 'Strong'/'Weak' labeled colorbar legend
  - Data colors (blue-to-green sequential ramp) are identical between light and dark
    renders; only chrome (background, ticks, borders) adapts to theme
  - Deterministic fixed-seed LCG avoids relying on a browser RNG, and the synthetic
    employee-collaboration dataset is realistic and neutral
  - Custom axis label formatter shows department names centered under each block instead
    of cluttering the square canvas with 30 individual node labels
  weaknesses:
  - Spec explicitly asks for node-name tick labels, with the boundary-only fallback
    reserved for 'large networks'; at n=30 this is a defensible readability tradeoff
    but not a full literal match — consider a hover-friendly compromise or documenting
    the rationale more visibly
  - Distinctive-feature usage is fairly conservative for ECharts (heatmap + continuous
    visualMap is close to the library skeleton); no use of more distinctive ECharts
    capabilities (e.g. dataZoom for exploring large matrices, brush selection, or
    a graph-layout companion view) that would showcase library mastery further
  - Data storytelling stops at the block-diagonal pattern; no secondary emphasis (e.g.
    highlighting the few notable cross-department bridges) to guide the viewer toward
    the most interesting structural finding
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light theme.
      Chrome: Dark, bold title "Employee Collaboration Network · heatmap-adjacency · javascript · echarts · anyplot.ai" centered at top, clearly readable. "Engineering"/"Design"/"Marketing" department boundary labels on both axes in a medium-gray ink, legible. Vertical "Strong"/"Weak" colorbar legend on the right, dark-gray text, legible against the light background.
      Data: 30x30 adjacency matrix (12 Engineering + 8 Design + 10 Marketing nodes). Cells range from deep blue (strong intra-department ties) through teal to bright green (weaker cross-department ties); absent edges render as a near-white fill that blends with the page background, and the diagonal is omitted (shows background). Three dense blue/teal blocks along the diagonal make the department clustering immediately visible, with a scatter of thin green cross-department links elsewhere.
      Legibility verdict: PASS — all text (title, axis labels, colorbar labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark theme.
      Chrome: Same title, now in light/white text, clearly readable against the dark background. Department axis labels render in a light gray, legible. Colorbar "Strong"/"Weak" labels are light-colored and legible against the dark canvas.
      Data: Same 30x30 matrix with an identical blue-to-green color mapping (data colors unchanged from the light render, confirming the palette rule). Absent-edge cells render as a slightly lighter charcoal than the omitted diagonal (which reads as pure background black), so "no connection" remains visually distinct from "not applicable" and from weak-but-present edges (green).
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and legend text is clearly legible against the near-black background.
