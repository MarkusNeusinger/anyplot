review:
  strengths:
  - Correct Imprint sequential palette (brand green -> blue) for the continuous edge-weight
    data, with identical data colors across light/dark and fully theme-adaptive chrome
    (background, text, grid, legend all flip correctly)
  - Department block-diagonal structure is clearly visible via subtle separators plus
    an appropriate outer matrix frame (the enclosed-heatmap-grid spine exception applies
    here)
  - Computed, data-driven insight annotation (densest cluster, sparsest cross-team
    pair) adds genuine storytelling beyond a plain grid
  - Colorbar legend paired with an explicit 'No link' swatch disambiguates absent
    edges from low-weight edges
  - Deterministic LCG-based data generation and clean idiomatic d3 join pattern (selection.data().join()),
    d3.quantize for gradient stops, axisRight for the legend scale
  weaknesses:
  - Roughly 15% of the square canvas height below the matrix/legend cluster is unused
    whitespace, unbalanced against the tighter margins elsewhere -- grow gridSize
    proportionally or rebalance margin.top/margin.bottom so the matrix better fills
    the available height
  - The legend gradient's domain starts at 0, but the minimum actual edge weight is
    ~0.1-0.35, so the bottom of the colorbar shows a color that never appears anywhere
    in the matrix -- minor polish item, consider anchoring the color domain closer
    to the true data minimum
