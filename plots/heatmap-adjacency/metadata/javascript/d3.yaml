review:
  strengths:
  - 'Block-diagonal structure is unmissable: nodes are pre-ordered by department,
    so within-team density vs. sparse cross-team ties reads instantly in both themes'
  - Symmetric adjacency correctly fills both triangles, and the diagonal is intentionally
    left as a distinct 'no link' color rather than a misleading zero-weight fill
  - 'Thoughtful legend construction: a real SVG linearGradient colorbar with d3.axisRight
    ticks, plus a separate ''No link'' swatch so an absent edge is never confused
    with a near-zero weight'
  - Correct imprint_seq usage for single-polarity weight data via d3.scaleSequential(d3.interpolateRgbBasis(t.seq)),
    with data colors identical across light/dark and all chrome properly theme-adaptive
  - Group-boundary separators and rotated department labels substitute cleanly for
    per-node ticks on a 40-node matrix, exactly per the spec's guidance for large
    networks
  weaknesses:
  - 'Design Excellence is solid but not yet publication-tier: the block-separator
    lines use flat full-strength ink at 2px, which reads a bit heavy next to the Imprint
    style guide''s preference for subtle structural lines — consider t.grid/rule at
    reduced opacity for the separators, keeping only the outer frame at full ink weight'
  - Data storytelling stops at 'block-diagonal is visible' — consider a small reinforcing
    touch such as a short annotation calling out the densest cluster or the sparsest
    cross-team pair to give the viewer an explicit takeaway beyond the raw pattern
  - Library Mastery is correct but generic d3-scale/d3-axis usage; leaning further
    into d3-specific strengths (e.g. d3.quantize for a discretized swatch-style legend,
    or a d3-hierarchy-driven node ordering instead of the hardcoded department array)
    would better showcase what D3 uniquely enables versus a higher-level charting
    library
  - Colorbar gradient stops currently sample every 10% via d3.range(0, 1.001, 0.1)
    with no visible top tick near the actual max weight (~0.95) — worth double-checking
    the top of the legend communicates the true data ceiling rather than stopping
    short
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-adjacency · javascript · d3 · anyplot.ai" centered at top, gray subtitle below it, dark department labels (Product, Engineering, Marketing, Sales) across the top and rotated along the left edge, dark block-separator lines and outer frame, gray colorbar title/ticks and "No link" legend text. All chrome text is clearly readable against the light background.
      Data: 40x40 symmetric adjacency matrix using the Imprint sequential ramp (green -> blue) for collaboration-strength cells; cells with no recorded collaboration use a near-background "elevated" cream fill, visually distinct from the lowest-weight green. First/only data series correctly renders in the imprint_seq green-to-blue range starting from brand green. Clear block-diagonal density (dense colored blocks within each department, sparse scattered cells across departments).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, department labels, separator lines (now light/white), colorbar ticks and "No link" legend text have all flipped to light-colored tokens and remain fully readable against the dark background. No dark-on-dark text was found anywhere in the render.
      Data: Same green-to-blue sequential ramp as the light render — cell colors are pixel-identical to light mode, confirming only chrome (background, text, separator/frame strokes, no-link swatch) adapted to the theme.
      Legibility verdict: PASS
