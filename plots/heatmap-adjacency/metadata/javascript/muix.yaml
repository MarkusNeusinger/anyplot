review:
  strengths:
  - 'Creative, idiomatic workaround for the missing community heatmap component: ScatterChart
    with a custom `slots.scatter` (AdjacencyCell) renders true filled-square matrix
    cells instead of circles.'
  - Correct Imprint sequential palette (seq[0] -> seq[1]) for the continuous weight
    encoding; absent edges render as the page background per the spec's 'distinct
    background for absent edges' requirement; data colors are identical between light
    and dark renders.
  - Full 20x20 adjacency matrix with both triangles filled for the undirected graph,
    plus a continuous colorbar legend showing the min/max weight range (7-98).
  - Deterministic fixed-seed LCG data generation with a realistic, neutral scenario
    (cross-team collaboration network) that produces visible community structure.
  - 'Clean chrome: axis lines/ticks disabled, subtle tick label styling, square 2400x2400
    canvas correctly sized via the `anyplot-orientation: square` directive.'
  weaknesses:
  - The ClusterBoundaries divider lines between team blocks are drawn in `tokens.pageBg`,
    the same color as blank/absent-edge cells, so they barely register as a distinct
    visual cue for the block-diagonal grouping the spec calls out — consider a slightly
    stronger boundary stroke (e.g. a thin ink/inkSoft line at low opacity) so the
    team-cluster boundaries read at a glance even where cells are already blank.
  - The colorbar/legend shows only the numeric bounds (7, 98) with no text label describing
    what the scale represents (e.g. 'Shared threads / month') — add a short legend
    title so the scale is self-explanatory without relying on the subtitle.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full square canvas.
      Chrome: Title "heatmap-adjacency · javascript · muix · anyplot.ai" in dark ink, centered at top, with a smaller dark-gray subtitle "Monthly shared threads between teammates, grouped by team" beneath it. 20 node-name tick labels (Ava, Noah, Mia, ... Wes) run along the top x-axis and left y-axis in a muted ink-soft tone. A vertical continuous colorbar sits at the right edge, labeled with bounds 98 (top) and 7 (bottom).
      Data: A 20x20 grid of filled square cells. Cells with an edge are colored on a green-to-blue sequential scale (light teal/green for weaker cross-team links, deeper blue for stronger same-team links); cells with no edge (including the diagonal) show the plain page background, visually distinct from every colored cell. The four 5-node team blocks (Engineering, Design, Product, Marketing) are visible along the diagonal as denser clusters of color.
      Legibility verdict: PASS — title, subtitle, all 20 tick labels, and colorbar bounds are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the full square canvas.
      Chrome: Same title and subtitle, now in light ink/ink-soft tones, clearly legible. Same 20 tick labels along top and left axes in a light muted tone. Same colorbar position and bounds (98 / 7) on the right.
      Data: Same 20x20 grid with identical cell colors to the light render (green-to-blue sequential scale) — confirms data colors are theme-invariant. Absent-edge cells now show the dark page background instead of light, still clearly distinct from colored cells.
      Legibility verdict: PASS — all title, subtitle, tick-label, and colorbar text renders in light tones against the dark background; no dark-on-dark failures observed.
