review:
  strengths:
  - A square, symmetric matrix with the same team-grouped node order on both axes;
    both triangles are filled from each undirected pair and the four teams appear
    as clear blocks along the diagonal
  - Absent edges use the elevated-surface token, a distinct background tone in both
    themes that cannot be mistaken for the green low end of the ramp
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider with band x/y axes, a continuous
    zAxis colorMap from the Imprint seq stops, a custom SVG layer drawn via useXScale/useYScale/useZColorScale/useDrawingArea,
    and a ContinuousColorLegend driven by the same zAxis'
  - Team-boundary rules span the full matrix and bold team labels sit in their own
    band, so group boundaries read at a glance
  - 'Deterministic seeded LCG data with a plausible scenario: collaboration threads
    among 20 named colleagues in four departments'
  weaknesses:
  - 'VQ-05 (both): the matrix block is anchored to the top and all leftover height
    (about 100 CSS px, ~9 % of the canvas) collects as an empty band below the team
    labels, while the column labels sit close under the subtitle → split the leftover
    between top and bottom so the block sits vertically centered (about +50 px top
    margin, −50 px bottom). Likely cause: margin.bottom = TEAM_LABEL_H + availH -
    side puts the entire availH - side slack at the bottom.'
  - 'Suggestion: one or two intermediate ticks on the color bar (for example 30, 60)
    would make mid-range weights easier to read off.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; absent-edge cells in the near-white elevated tone with thin gaps.
      Chrome: bold dark title "heatmap-adjacency · javascript · muix · anyplot.ai", soft-ink subtitle, node names along top and left, bold team labels (Engineering, Design, Product, Marketing) below, color bar "Shared threads per month" 7–98 on the right; all readable.
      Data: 20x20 symmetric matrix, Imprint sequential ramp from #009E73 (weak) to #4467A3 (strong); four diagonal team blocks split by dark rules; Nina–Wes strongest link outlined. Matrix sits high, leaving ~100 CSS px empty below.
      Legibility verdict: PASS

