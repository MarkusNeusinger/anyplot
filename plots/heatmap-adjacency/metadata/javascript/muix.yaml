review:
  strengths:
  - Composes the heatmap from ChartsDataProvider band axes plus a custom AdjacencyLayer
    that reads useXScale/useYScale/useZColorScale, the idiomatic MIT-tier route since
    the Heatmap chart is Pro-only
  - zAxis continuous colorMap built from the Imprint imprint_seq stops (t.seq) drives
    both the cells and a native ContinuousColorLegend, so the color bar and the cells
    share one scale
  - Nodes are grouped by team with separator lines and bold team labels under the
    matrix, so four dense blocks stand out along the diagonal against sparse cross-team
    cells
  - Both triangles filled from the undirected edge list; the matrix mirrors across
    its empty diagonal and the cells are square (equal px per node on both axes)
  - Absent edges use the elevated surface tone with small cell gaps, distinct from
    the weakest green edge in both themes
  - The strongest link (Nina–Wes, 98) is outlined in the ink token and named in the
    subtitle, which gives the reader a focal point
  - Every chrome color comes from ANYPLOT_TOKENS, so the light and dark renders flip
    only the chrome while the data colors stay the same
  weaknesses:
  - 'VQ-05 (both): the color-bar title ''Shared threads per month'' wraps to ''per
    / month'' and ends about 20 px from the right canvas edge, while about 120 px
    stay empty below the team labels → give the legend column more width (about 180
    px) or shorten the matrix a little so the legend has a right margin like the left
    one. Likely cause: LEGEND_W = 150 with maxWidth 130 on the legend title.'
  - 'Suggestion: a midpoint tick on the color bar (for example 50) would make mid-range
    cells easier to read off the scale.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; absent-edge cells are a slightly brighter elevated tone separated by thin gaps.
      Chrome: bold dark title "heatmap-adjacency · javascript · muix · anyplot.ai", a soft-ink subtitle (20 nodes in 4 teams · 57 undirected links · outlined strongest link (98), Nina–Wes), node names along the top and left, bold team labels (Engineering, Design, Product, Marketing) below, dark separator lines at the team boundaries, and a vertical color bar titled "Shared threads per month" (7–98) on the right. All text is readable.
      Data: a 20×20 square matrix, symmetric with an empty diagonal; four dense blocks along the diagonal in teal-to-blue (strong in-team links) and scattered brand-green #009E73 cells off the blocks (weak cross-team links); the Nina–Wes cell pair is outlined in ink.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; absent cells are a slightly lighter elevated tone.
      Chrome: title and legend title in light ink, ticks and team labels in light soft ink, light-grey separator lines, white outline on the strongest link. No dark-on-dark text.
      Data: the cell colors are identical to the light render (imprint_seq green → blue); only the chrome flips.
      Legibility verdict: PASS
