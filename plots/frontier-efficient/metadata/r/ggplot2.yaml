review:
  strengths:
  - Efficient frontier computed in closed form from the same covariance matrix that
    generates the cloud, so the long-only portfolios sit below it and the minimum-variance
    diamond marks its leftmost point
  - Tangency portfolio derived as inv(Sigma)(mu - rf) normalised, and the dashed CML
    from rf = 2% touches the frontier exactly there
  - Thick blue frontier, dashed red CML and ink-outlined lavender diamond / ochre
    triangle keep every element distinct in both themes
  - 'Idiomatic ggplot2 4: column constants with !!:= and .data[[...]], guides(order=)
    with override.aes, filled shapes merged into one shape+fill legend'
  weaknesses:
  - 'VQ-07 (both): the Sharpe colour scale runs from INK_SOFT to #009E73, a non-Imprint
    ramp whose low end is dark grey on light and light grey on dark, so the data colours
    differ between themes → imprint_seq, identical in both themes. Likely cause: scale_color_gradient(low
    = INK_SOFT, high = IMPRINT_PALETTE[1]) instead of low = "#009E73", high = "#4467A3".'
  - 'CQ-01 (code): a helper function frontier_risk_at() is defined for the frontier
    risk formula → inline the vectorised expression where it is used (frontier and
    min-variance rows). Likely cause: frontier_risk_at <- function(r) ….'
  - 'Suggestion: place the ''Efficient frontier'' and ''Capital market line'' labels
    next to the lines they name; both float in empty space about 0.03 away from their
    lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, panel framed by a thin INK_SOFT border, thin ink grid.
      Chrome: title 'frontier-efficient · r · ggplot2 · anyplot.ai' top left, axis titles 'Risk (Standard Deviation)' and 'Expected Return (Annualized)', tick labels 0.00-0.15 and 0.04-0.16, all dark and readable; 'Sharpe Ratio' colourbar card and a key-point legend card (lavender diamond 'Minimum variance', ochre triangle 'Maximum Sharpe ratio') on the right.
      Data: ~300 random portfolios in a band from risk 0.09-0.17, coloured dark grey (low Sharpe) to #009E73 (high Sharpe); thick blue (#4467A3) frontier from the minimum-variance diamond up the cloud's upper-left edge; dashed red (#AE3030) CML from 0.02 at zero risk, touching the frontier at the ochre triangle and above it beyond; direct labels 'Efficient frontier' (bold blue) and 'Capital market line' (red) in empty space.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, light grid and frame.
      Chrome: title, axis titles, ticks and legend text in light ink, all readable; no dark-on-dark text; legend cards on #242420.
      Data: frontier, CML, diamond and triangle identical to light; the Sharpe scale's low end flips from dark grey to light grey (theme-dependent ramp), high end #009E73 unchanged.
      Legibility verdict: PASS
