review:
  strengths:
  - 'Semantically thoughtful Imprint palette usage: the Efficient Frontier (the plot''s
    hero series) gets brand green #009E73, Min Variance and Max Sharpe portfolios
    use canonical palette positions 2-3, and the Capital Market Line correctly borrows
    the theme-adaptive ''neutral'' ink token for its reference-line role -- palette
    choices map to semantic roles rather than arbitrary assignment.'
  - Continuous Sharpe-ratio coloring for the random-portfolio cloud correctly uses
    an imprint_seq (green-to-blue) gradient via a hand-rolled hex lerp, exactly matching
    the spec's 'color coding can indicate Sharpe ratio' suggestion, with no forbidden
    colormap.
  - 'All spec notes are fulfilled: frontier curve visually distinguished by thicker
    line and distinct color, random portfolio scatter shown below the frontier, min-variance
    and max-Sharpe (tangency) portfolios explicitly marked with distinct point shapes
    (diamond/triangle), and the optional Capital Market Line is included and tangent
    to the risk-free rate.'
  - 'Realistic, neutral, well-researched finance data: named asset classes (Govt Bonds,
    Corp Bonds, REITs, US/Intl Equity, Emerging Mkts) with plausible annualized return/vol/correlation
    values, deterministic LCG simulation with fixed seeds for full reproducibility.'
  - 'Redundant encoding beyond color: min-variance (diamond), max-Sharpe (triangle),
    and risk-free rate (circle) use distinct pointStyle shapes with ink borders, keeping
    the key portfolios distinguishable even for colorblind viewers.'
  - Theme-adaptive chrome is fully correct in both renders -- warm off-white/near-black
    backgrounds, readable ink/inkSoft text, subtle grid -- with title fontsize dynamically
    scaled to the (longer, prefixed) title length so it doesn't overflow.
  - 'Title format is exactly right: ''6-Asset Portfolio Universe · frontier-efficient
    · javascript · chartjs · anyplot.ai''.'
  weaknesses:
  - The 300-point random-portfolio scatter uses full-opacity pointBackgroundColor
    with no alpha; in the densest risk band (~8-12%) points overlap heavily and individual
    markers become hard to distinguish even with the background-colored border trick
    -- consider alpha < 1 or a slightly smaller pointRadius for that density.
  - The continuous Sharpe-ratio color encoding has no accompanying numeric scale/colorbar
    in the static PNG -- a reader can see relative gradient but not read an actual
    Sharpe value off the chart (the legend label names the encoding but doesn't quantify
    it).
  - The 'Capital Market Line' legend swatch renders as a plain hollow/gray circle
    rather than a themed dash-line icon in both renders, since that dataset has no
    explicit pointBackgroundColor for legend styling -- minor legend-polish inconsistency
    versus the other, more deliberately styled swatches.
  - Code uses several small helper functions (makeLcg, samplePortfolioWeights, portfolioStats,
    hexToRgb, lerpColor) for the portfolio-theory math, which is well justified by
    domain complexity but is a mild departure from the purest 'flat imports -> data
    -> plot' KISS structure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "6-Asset Portfolio Universe · frontier-efficient · javascript · chartjs · anyplot.ai" in dark ink, centered at top, fully visible and not clipped. X-axis title "Risk (Annualized Std Dev)" and Y-axis title "Expected Return (Annualized)" in dark ink; both axes' percentage tick labels in a softer gray. Subtle light-gray gridlines on both axes. Legend row at bottom with 6 entries (Max Sharpe, Min Variance, Risk-Free Rate, Efficient Frontier, Capital Market Line, Random Portfolios), all legible.
      Data: Dense teal-to-blue gradient scatter cloud (random portfolios, colored by Sharpe ratio, imprint_seq gradient), a bold brand-green (#009E73) curve tracing the efficient frontier along the cloud's upper edge, a black dashed Capital Market Line tangent from the risk-free point through the tangency portfolio, a purple diamond marking the minimum-variance portfolio, and a dark-blue triangle marking the maximum-Sharpe (tangency) portfolio. First highlighted/hero series (the frontier) uses brand green as required.
      Legibility verdict: PASS -- all title, axis, tick, and legend text reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title and axis titles now rendered in light off-white ink, tick labels in a lighter secondary gray, gridlines a subtle light overlay. Legend text switches to light gray, fully readable against the dark surface.
      Data: Identical data colors to the light render -- teal-to-blue Sharpe gradient scatter, brand-green frontier curve, purple diamond, blue triangle, and a white (theme-flipped) dashed Capital Market Line -- confirming only chrome flipped and categorical/continuous data hues stayed constant.
      Legibility verdict: PASS -- no dark-on-dark failures found; every text element (title, axis labels, ticks, legend) is clearly legible against the near-black background.
