review:
  strengths:
  - Frontier, GMV and tangency portfolio are computed in closed form from the inverse
    covariance matrix (A, B, C, D scalars), so the minimum-variance point sits exactly
    at the leftmost point of the frontier and the capital market line touches the
    frontier exactly at the tangency portfolio, lying above it everywhere else
  - Random portfolios are colored by Sharpe ratio through a native zAxis continuous
    colorMap built from the Imprint sequential stops (t.seq[0] to t.seq[1]), with
    a labelled gradient bar giving the min and max Sharpe values
  - Composes the chart from ChartsContainer primitives (ScatterPlot, LinePlot, ChartsGrid,
    ChartsReferenceLine) and draws the CML and key-point markers in data coordinates
    with the useXScale/useYScale hooks, so everything stays aligned to the axes
  - Key-point labels carry their exact risk/return values and a page-colored text
    halo (paintOrder stroke), keeping them readable where they cross the grid and
    the CML in both themes
  - 'Theme threading is complete: ink/inkSoft tokens on every text element, warm off-white
    and near-black backgrounds, identical data colors in both renders'
  - Native MUI X tooltips on the scatter and line series add per-portfolio inspection
    in the HTML output
  weaknesses:
  - 'Suggestion: the tangency marker uses brand green #009E73, which is also the low-Sharpe
    end of the scatter''s color scale, so the maximum-Sharpe portfolio reads like
    the lowest-Sharpe one at a glance; a marker color outside the green-blue ramp
    (or the ramp''s high end) would keep the two encodings apart.'
  - 'Suggestion: the frontier is drawn to 1.18x the highest asset return (13 % return
    at about 22 % risk), far beyond the long-only cloud that tops out near 9.8 %;
    ending it near the highest attainable return would tighten the axes around the
    data.'
  - 'Suggestion: the native ChartsLegend and ContinuousColorLegend components could
    replace the hand-built HTML legend row and gradient bar, and the in-plot ''Capital
    Market Line'' label repeats the legend entry.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, #FAF8F1, no pure white.
      Chrome: bold title "frontier-efficient · javascript · muix · anyplot.ai" (~65% width) with an inkSoft subtitle; centered HTML legend row (Efficient Frontier, Capital Market Line, Min-Variance Portfolio, Max-Sharpe (Tangency) Portfolio); y-axis "Expected Portfolio Return — Annualized (%)" 1–13 %, x-axis "Portfolio Risk — Annualized Standard Deviation (%)" 0–23 %; subtle grid in both directions; no top/right spines. All dark text, fully readable.
      Data: 300 portfolios as a green-to-blue (Imprint seq) Sharpe-colored cloud from ~5 % to 18.5 % risk; thick near-black efficient frontier starting at the GMV point (black dot, "GMV (5.0%, 4.3%)") and running above the cloud; purple dashed CML from 2 % at zero risk, tangent at the green #009E73 tangency marker "Max Sharpe = 0.62 (6.7%, 6.1%)"; dashed risk-free reference line at 2 %; gradient bar at the bottom "Low Sharpe ratio (0.22)" to "High Sharpe ratio (0.62)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, #1A1A17, no pure black.
      Chrome: title, subtitle, legend, tick labels and axis titles all rendered in light ink; grid subtle but visible; no dark-on-dark text anywhere.
      Data: identical to light — same green-blue cloud, purple CML, green tangency marker; only the frontier line and the GMV marker flip from near-black to off-white with the ink token, as theme chrome-ink elements. Labels keep a dark halo.
      Legibility verdict: PASS
