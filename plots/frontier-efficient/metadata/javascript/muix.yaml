review:
  strengths:
  - Analytic two-fund-theorem derivation of the efficient frontier (matrix inversion,
    GMV and tangency portfolios computed exactly from mean/covariance, not just eyeballed)
    — genuine quantitative finance rigor rather than a fake curve.
  - 'All spec-required elements present: risk/return axes, distinguished frontier
    curve, 300-point random-portfolio cloud, GMV and Max-Sharpe (tangency) markers,
    Sharpe-ratio color coding, plus an optional capital market line and risk-free-rate
    reference line.'
  - Idiomatic, fairly advanced MUI X Charts usage — multi-axis ChartContainer, zAxis
    continuous colorMap for scatter color-mapping, ChartsReferenceLine, and a custom
    useXScale/useYScale overlay component for the capital market line.
  - Continuous Sharpe-ratio color scale correctly uses imprint_seq (t.seq[0] -> t.seq[1])
    with a clean custom gradient legend since MUI X community has no native colorbar.
  - Deterministic reproducibility via a seeded LCG (no Math.random()), and realistic,
    non-controversial 6-asset return/vol/correlation data.
  weaknesses:
  - 'The ''Capital Market Line'' text label is completely invisible in both renders.
    Its endpoint y2 = RF + SHARPE_TAN * X_MAX evaluates well above Y_MAX (roughly
    17% vs. a ~13.5% visible ceiling), so the label at (x2-12, y2-12) is positioned
    above the chart''s rendered SVG area and gets clipped away entirely — the dashed
    purple line has zero legend entry and zero visible label, so a viewer cannot tell
    what it represents. Fix: clip x2/y2 to the visible plot bounds (intersect the
    CML ray with y = Y_MAX) before placing the text, or add the CML to the ChartsLegend
    series list instead of an on-chart label.'
  - The rotated y-axis title 'Expected Portfolio Return (Annualized)' visually crosses/overlaps
    the '9%' y-tick label in both light and dark renders, creating a text collision
    at that specific gridline. Increase left margin slightly or adjust the axis label's
    tick-label gap so the two never intersect.
  - 'No element in the chart uses the brand green #009E73 (palette[0]) — Efficient
    Frontier and Min-Variance Portfolio use neutral ink, Max-Sharpe (Tangency) uses
    amber. Per the style guide, amber signals ''warning/caution'', which is a semantic
    mismatch for the optimal/best portfolio (which maps more naturally to ''good/best
    -> green''); consider recoloring the Max-Sharpe marker to brand green to both
    satisfy the always-green-first-series rule and match the semantic color convention.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "frontier-efficient · javascript · muix · anyplot.ai" centered at top, clearly legible. X-axis "Portfolio Risk (Annualized Std Dev)" labeled 0%-23% in 1% steps, y-axis "Expected Portfolio Return (Annualized)" labeled 1%-13% in 1% steps, both with dark ink tick/axis text against the light background — legible overall, EXCEPT the rotated y-axis title visibly crosses the "9%" tick label, creating a localized text collision. Subtle off-white/grey gridlines (horizontal + vertical) are visible without dominating. Legend top-right lists "Min-Variance Portfolio" (black square), "Max-Sharpe (Tangency) Portfolio" (gold square), "Efficient Frontier" (black square) — all legible.
      Data: A thick black efficient-frontier curve arcs from the GMV point (~5% risk, 4.2% return, large black dot) up to ~21.5% risk / 13% return. A cloud of ~300 scatter points (green-to-blue continuous gradient encoding Sharpe ratio, matching imprint_seq) fans out below/around the frontier. The Max-Sharpe tangency portfolio is marked with a large amber/gold dot near (6.5%, 6.2%). A dashed lavender/purple line (capital market line) runs from the risk-free rate (2%, dashed grey horizontal reference line) up through the tangency point and beyond — but its "Capital Market Line" text label is nowhere visible in the render (clipped off above the chart's plotted range). A bottom colorbar-style legend ("Low Sharpe ratio" → "High Sharpe ratio") with a green-to-blue gradient bar confirms the scatter color mapping.
      Legibility verdict: PASS overall, with one localized defect (axis-title/tick-label overlap at "9%") and one missing label (Capital Market Line text is fully invisible, not just hard to read).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have flipped to light/cream text, clearly readable against the dark background — no dark-on-dark failures observed. Gridlines are a subtle dark grey, visible but unobtrusive. Legend swatches for "Min-Variance Portfolio" and "Efficient Frontier" flipped to a light/cream color (matching the ink token's dark-mode value); "Max-Sharpe (Tangency) Portfolio" swatch remains the same amber.
      Data: All data colors are identical to the light render — the black frontier line/GMV marker became cream/white (theme-adaptive "ink" token, expected since it's a chrome-tied neutral, not a data-series hex), the amber tangency marker and the green-to-blue Sharpe gradient are pixel-identical to the light render. The same missing "Capital Market Line" label and the same y-axis-title/"9%" tick overlap reproduce identically in this render.
      Legibility verdict: PASS overall — no dark-on-dark text, brand elements read well — with the same two localized defects as the light render (axis-label overlap, invisible CML label).
