review:
  strengths:
  - 'Correct, comprehensive feature set: analytic efficient frontier (two-fund theorem),
    300-portfolio random cloud, explicit min-variance and max-Sharpe (tangency) markers,
    plus the optional Capital Market Line — every spec requirement plus the optional
    extra is present.'
  - 'Creative, semantically sound color usage: the continuous imprint_seq (green→blue)
    colormap correctly encodes the continuous Sharpe-ratio dimension on the scatter
    cloud, brand green is reserved for the optimal (max-Sharpe) portfolio, and the
    frontier curve/min-variance marker use the theme-adaptive ink/neutral token as
    a baseline reference — all data colors are verified identical between light and
    dark renders.'
  - 'Genuinely distinctive MUI X usage: composes ChartContainer + individual Plot
    components with the useXScale/useYScale hooks to render a fully custom SVG overlay
    (the Capital Market Line with a clipped, dynamically-positioned label) — a technique
    specific to MUI X''s advanced composition API.'
  - 'Realistic, well-scaled financial data: a 6-asset universe with plausible historical
    returns/vols/correlations, deterministic LCG-seeded portfolio generation (no Math.random),
    and sensible risk-free rate/Sharpe-ratio ranges.'
  - Canvas usage is excellent — chart fills nearly the full 3200×1800 canvas with
    only a compact title and colorbar strip, no clipped elements at either canvas
    edge in either theme.
  weaknesses:
  - The 300-point random-portfolio scatter cloud has no alpha/opacity reduction (fully
    opaque markers), so the densest cluster (~10-15% risk, 7-9% return) turns into
    overlapping blobs that obscure individual points and mute the Sharpe-ratio color
    gradient — apply alpha ≈ 0.6-0.75 per the data-density heuristic for 300+ points.
  - The 'Capital Market Line' text label sits directly on top of the efficient-frontier
    curve near the tangency point, so the black/ink line visibly cuts through the
    letters ('t Line') in both renders — shift the label further along the CML or
    add a small perpendicular offset so it clears the frontier curve.
  - The CML label uses lavender (#C475FD) at 14px/600-weight directly on the cream/near-black
    background; lavender falls below the WCAG 3:1 threshold on the light surface (see
    style-guide 'Optional outline pattern') — consider a thin ink-colored text stroke
    or halo for this specific annotation to keep it crisp once the overlap above is
    fixed.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "frontier-efficient · javascript · muix · anyplot.ai" in bold dark ink, centered, ~50% width, fully visible. X-axis "Portfolio Risk (Annualized Std Dev)" and Y-axis "Expected Portfolio Return (Annualized)" labels in dark ink, tick labels (0%-23% / 1%-13%) in a softer dark gray. Legend top-right ("Min-Variance Portfolio", "Max-Sharpe (Tangency) Portfolio", "Efficient Frontier") in dark text with black swatches, comfortably inside the right edge (verified via crop — no clipping). Subtle horizontal+vertical grid lines. Bottom colorbar strip ("Low Sharpe ratio" → "High Sharpe ratio") in soft gray text, fully visible with margin below.
      Data: Efficient frontier is a thick black curve; min-variance portfolio is a large black dot; max-Sharpe (tangency) portfolio is a large brand-green (#009E73) dot; Capital Market Line is a dashed lavender (#C475FD) line with a "Capital Market Line" label; 300-point scatter cloud is colored on a green→blue continuous scale (imprint_seq) by Sharpe ratio. First/primary highlighted portfolio is confirmed brand green.
      Legibility verdict: PASS overall, with one specific issue — the lavender "Capital Market Line" label is crossed by the black frontier curve line at the point they visually intersect, and the label's lavender color has borderline contrast against the cream background (both flagged as weaknesses, not full failures — text remains legible).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, legend and colorbar text — all correctly flipped to light/cream ink, fully readable against the dark surface. No dark-on-dark text found anywhere (title, axes, ticks, legend, colorbar caption all checked). Grid lines subtle and visible. Frontier curve and min-variance/legend swatches correctly flip from black to off-white ink (theme-adaptive neutral token).
      Data: Colors are identical to the light render — brand green tangency marker, lavender CML, green→blue Sharpe colormap on the scatter cloud — confirming only chrome (not data colors) changes between themes.
      Legibility verdict: PASS, with the same CML-label-crosses-frontier-line overlap present in this render too (chrome-independent geometric issue, not a dark-mode-specific failure).
