review:
  strengths:
  - 'All spec-required features are present in one coherent chart: random portfolio
    scatter cloud, efficient-frontier curve, capital market line, and labeled minimum-variance
    and maximum-Sharpe (tangency) portfolios.'
  - 'Correct Imprint palette usage: brand green (#009E73) is the hero efficient-frontier
    line, and imprint_seq (d3.interpolateRgbBasis over t.seq) is correctly used for
    the continuous Sharpe-ratio color encoding on the scatter cloud.'
  - 'Theme-adaptive chrome is clean in both renders: axis text, ticks, domain lines,
    and title all read correctly against both the light and dark backgrounds while
    data colors stay identical.'
  - Deterministic Monte Carlo simulation via a seeded LCG plus a mathematically valid
    one-factor covariance model (guarantees a positive-semidefinite correlation matrix)
    gives realistic, reproducible portfolio data.
  - 'Annotation labels for ''Min variance'' and ''Max Sharpe (tangency)'' use a stroke
    halo (paint-order: stroke) so they stay legible over the dense scatter cloud.'
  weaknesses:
  - The capital market line is drawn unclipped past the y-axis domain and bleeds into
    the top margin/title chrome area before disappearing off the top of the canvas
    — clip the CML path to the plot's rectangular area (or shorten cmlEnd) so it terminates
    cleanly inside the axes instead of overshooting into the margin.
  - Grid is y-axis only; since this chart mixes scatter points with line series, a
    subtle x-axis grid (per the style guide's 'both axes for scatter plots' guidance)
    would help readers gauge risk values for the scattered portfolios.
  - The 'Max Sharpe (tangency)' label sits close to a dense cluster of scatter points;
    the stroke halo keeps it readable but a small offset or leader line would reduce
    visual crowding.
  - Library mastery is solid but conventional — relies on the standard scale/axis/line/symbol
    generators from the skeleton; no distinctive D3-only techniques (e.g. voronoi,
    force, quadtree) that would showcase deeper D3 capability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface exactly — not pure white.
      Chrome: Title "frontier-efficient · javascript · d3 · anyplot.ai" is bold, dark ink, centered at top and clearly legible. X-axis label "Portfolio Risk (annualized standard deviation)" and Y-axis label "Expected Return (annualized)" are dark ink, readable. Tick labels (0%–22% on X, 2%–10% on Y) are soft dark gray, clearly legible. Subtle horizontal (y-axis) gridlines are visible but do not compete with data.
      Data: A dense scatter cloud of ~350 portfolios colored on a green→blue continuous gradient (Sharpe ratio, imprint_seq). The efficient-frontier curve is a thick brand-green (#009E73) line tracing the Pareto upper boundary of the cloud. A dashed gray capital-market-line runs from the risk-free intercept through the tangency point and extends beyond the plotted data toward the top-right, exiting the visible plot area. A lavender circle marks "Min variance" and a blue star marks "Max Sharpe (tangency)," both labeled with dark text on a white halo. A top-right legend distinguishes "Efficient frontier" (green) and "Capital market line" (dashed gray), and a vertical gradient bar on the right labeled "Sharpe ratio" shows the 0.18–0.53 color scale.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface exactly — not pure black.
      Chrome: Title, axis labels, and tick labels have all flipped to light off-white/soft-gray tones and remain fully legible against the dark background. Gridlines are subtle and appropriately dimmed. No dark-on-dark failures observed anywhere (title, axis labels, tick labels, legend text, and annotation labels are all clearly visible).
      Data: The brand green frontier line, lavender min-variance marker, blue max-Sharpe star, and the green→blue Sharpe-ratio scatter gradient are pixel-identical to the light render — confirming only chrome (not data colors) changed between themes. The dashed capital-market-line and legend also render correctly in light gray against the dark surface.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures.
