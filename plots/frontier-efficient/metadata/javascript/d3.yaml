review:
  strengths:
  - 'Full spec coverage in one coherent chart: random portfolio scatter cloud, efficient-frontier
    curve, capital market line, and clearly labeled minimum-variance and maximum-Sharpe
    (tangency) portfolios'
  - 'Correct Imprint palette usage across both themes: brand green (#009E73) hero
    frontier line, imprint_seq sequential gradient correctly applied to the continuous
    Sharpe-ratio color encoding'
  - Capital market line is now clipped to the plot's rectangular area via clip-path,
    fixing the attempt-1 bleed into the title/legend margin
  - Both x- and y-axis gridlines are now present (fixed from attempt 1), which helps
    readers gauge risk values across the scattered portfolio cloud
  - Deterministic Monte Carlo simulation via a seeded LCG plus a mathematically valid
    one-factor covariance model over a realistic 5-asset universe (bonds, REIT, intl
    equity, US equity, commodities)
  - Halo-stroked annotation labels keep 'Min variance' / 'Max Sharpe' legible over
    the dense scatter cloud in both themes
  weaknesses:
  - The 'Max Sharpe (tangency)' label still sits close to / slightly overlapping a
    scatter point in the dense cluster near the tangency point in both renders — nudge
    the label further up/right or add a short leader line to fully clear the cloud
  - The efficient-frontier line has a visibly stepped/staircase shape (sharp shelves
    around 8-9% risk) rather than a smooth curve, because curveMonotoneX interpolates
    across sparse, irregularly-spaced Pareto-optimal points drawn from only 350 simulated
    portfolios — increasing N_PORTFOLIOS (e.g. to 800-1000) would yield more frontier
    points and a visually smoother curve
  - Library mastery remains conventional (standard scale/axis/line/symbol generators)
    — no distinctive D3-only technique (voronoi, force, quadtree) to showcase deeper
    D3 capability; optional polish, not a functional issue
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "frontier-efficient · javascript · d3 · anyplot.ai" is bold dark ink, centered at top and clearly legible. Axis labels ("Portfolio Risk (annualized standard deviation)" / "Expected Return (annualized)") and tick labels (percent-formatted) render in dark/soft-dark ink and are fully readable. Subtle gridlines now appear on BOTH axes (fixed from attempt 1, which was y-only).
      Data: Dense scatter cloud of ~350 simulated portfolios colored on a green-to-blue continuous gradient keyed to Sharpe ratio (imprint_seq). A thick brand-green (#009E73) efficient-frontier line traces the Pareto upper-left boundary with a visible stepped/staircase shape. A gray dashed capital market line runs from the risk-free intercept through the tangency point and is now clipped cleanly within the plot area (no bleed into the title margin, fixed from attempt 1). A lavender circle marks "Min variance"; a navy star marks "Max Sharpe (tangency)" — both labels use halo-stroked text, though the Max Sharpe label sits close to a dense point cluster. Top-right legend (frontier / CML swatches) plus a vertical Sharpe-ratio gradient bar with numeric endpoints complete the chart.
      Legibility verdict: PASS — all text is readable against the light background; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, tick labels, and legend text all flip to light off-white/soft-gray tones and remain fully legible. Gridlines on both axes remain subtle but visible against the dark background. No dark-on-dark failures observed anywhere (title, axis labels, tick labels, legend, and the Sharpe-ratio colorbar labels are all clearly visible).
      Data: Brand-green frontier line, lavender/navy key-point markers, gray dashed CML, and the green-to-blue Sharpe-ratio gradient scatter are pixel-identical in hue to the light render — confirming only chrome (background, text, grid) flips between themes, per the Imprint palette rule.
      Legibility verdict: PASS — all text is readable against the dark background; no dark-on-dark failures.
