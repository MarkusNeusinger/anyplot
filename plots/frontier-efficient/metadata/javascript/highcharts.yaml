review:
  strengths:
  - Subtitle now states the Sharpe ratio range (0.17 low → 0.54 high), giving the
    static PNG a self-contained decoding aid for the continuous color encoding
  - Dense 8-14% risk band is visibly thinned (smaller radius, lower opacity) so the
    efficient frontier line reads clearly against the portfolio cloud
  - Correct efficient-frontier and Sharpe-ratio math (Pareto upper boundary via sort-and-scan,
    tangency portfolio via max Sharpe), backed by a deterministic seeded LCG for reproducibility
  - 'Clear visual hierarchy: thick brand-green frontier line, dashed capital-market
    line, and distinctly-shaped labeled markers (triangle = min variance, diamond
    = max Sharpe)'
  - Theme-adaptive chrome is faithfully implemented — both renders fully legible,
    data colors identical across themes
  - Correct Imprint palette usage for both categorical elements and the continuous
    Sharpe-ratio encoding (imprint_seq)
  - Title and legend exactly match the mandated format; axis labels are descriptive
    with units
  weaknesses:
  - The "Max Sharpe" data label still sits amid a locally dense part of the scatter
    cloud (~6.7% risk, just below the thinned 8-14% band) — readable but slightly
    crowded; consider a small offset or leader line
  - Five small helper functions (rand, randomWeights, portfolioReturn, portfolioRisk,
    lerpHex) still push against the literal "no functions" KISS guideline for CQ-01
    — justified by the portfolio-math domain, but worth flattening where feasible
  - Continuous Sharpe-ratio coloring is computed manually via a hand-rolled lerpHex/rgba
    per point rather than Highcharts' native colorAxis/colorKey mechanism — a more
    idiomatic approach would lean on that library-specific capability for LM-02
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark-ink title "frontier-efficient · javascript · highcharts · anyplot.ai" and a soft-gray subtitle "Simulated 6-asset universe · point color encodes Sharpe ratio (0.17 low → 0.54 high)". Axis titles "Risk (Annualized Std. Dev., %)" and "Expected Return (Annualized, %)" with percentage tick labels on both axes. Legend at bottom lists "Efficient frontier", "Capital market line", "Minimum variance portfolio", "Max Sharpe (tangency) portfolio". All chrome text is clearly readable against the light background.
      Data: Thick brand-green (#009E73) spline traces the efficient frontier from the min-variance point (~5.4% risk, ~4.1% return) up to ~15% risk / ~8.7% return. A dashed ochre capital market line runs tangent from the 2% risk-free rate through the max-Sharpe portfolio. ~400 scattered portfolio points form a cloud on a green-to-blue imprint_seq gradient encoding Sharpe ratio; the 8-14% risk band (previously heavily clumped) now shows visibly smaller, more transparent markers so the frontier line stands out. A purple triangle labeled "Min Variance" and a navy-blue diamond labeled "Max Sharpe" mark the key portfolios; first categorical series (frontier line) is confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same layout and content as the light render, with chrome flipped to light-ink title/subtitle/axis labels/tick labels/legend text — all clearly legible. No dark-on-dark issues detected on any text element.
      Data: Frontier line (green), dashed CML (ochre), Min Variance triangle (purple), Max Sharpe diamond (navy blue), and the green-to-blue Sharpe gradient scatter cloud are all identical in color to the light render — only background/text/grid chrome flipped, confirming theme-adaptive tokens were threaded through correctly.
      Legibility verdict: PASS
