review:
  strengths:
  - Correct efficient-frontier and Sharpe-ratio math (Pareto upper boundary via sort-and-scan,
    tangency portfolio via max Sharpe), backed by a deterministic seeded LCG for reproducibility
  - 'Clear visual hierarchy: thick brand-green frontier line, dashed capital-market
    line, and distinctly-shaped labeled markers (triangle = min variance, diamond
    = max Sharpe) pull the eye to the story'
  - Theme-adaptive chrome is faithfully implemented — both light and dark renders
    are fully legible, and all data colors (frontier, CML, markers, Sharpe gradient)
    are identical across themes
  - Correct Imprint palette usage for both categorical elements (frontier/CML/markers)
    and the continuous Sharpe-ratio encoding (t.seq gradient), matching the style
    guide's continuous-data rule
  - Title and legend exactly match the mandated format; axis labels are descriptive
    with units (%), and legend entries read as full sentences describing each series
  weaknesses:
  - 'The scatter cloud is color-coded by Sharpe ratio (per the subtitle) but the static
    PNG has no colorbar/legend to decode the gradient — a viewer can''t tell what
    green vs. blue means without opening the interactive HTML and hovering. Add a
    small colorAxis-style legend swatch or state the Sharpe range in the subtitle
    (e.g. ''Sharpe: 0.1-0.6'').'
  - In the mid-density risk band (~8%-14%), scattered portfolio points overlap heavily
    and clump together — consider a slightly higher transparency (alpha ~0.6) or smaller
    marker radius in that region to reduce visual clumping and let the frontier curve
    stand out more against the cloud.
  - Five helper functions (rand, randomWeights, portfolioReturn, portfolioRisk, lerpHex)
    push against the literal 'no functions' KISS guideline for CQ-01 — justified here
    by the portfolio-math domain, but worth flattening/inlining where feasible if
    a stricter script style is desired.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — matches the required light plot surface.
      Chrome: Title "frontier-efficient · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Simulated 6-asset universe · point color encodes Sharpe ratio" in soft gray. Axis titles "Risk (Annualized Std. Dev., %)" and "Expected Return (Annualized, %)" in medium-gray, tick labels in percentage format on both axes. Legend at bottom lists "Efficient frontier", "Capital market line", "Minimum variance portfolio", "Max Sharpe (tangency) portfolio". Subtle horizontal/vertical gridlines, faint but visible.
      Data: Brand-green (#009E73) thick spline traces the efficient frontier from the min-variance point (~5.4% risk, ~4.1% return) up to ~15% risk, ~8.7% return. A dashed ochre/orange line (capital market line) runs tangent from the risk-free rate (2%) through the max-Sharpe portfolio. ~400 scattered portfolio points form a cloud below/around the frontier, colored on a green-to-blue gradient encoding Sharpe ratio (imprint_seq). A purple triangle marks "Min Variance" and a blue diamond marks "Max Sharpe", each with a bold black data-label callout.
      Legibility verdict: PASS — all titles, axis labels, tick labels, legend text, and data-point labels are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the required dark plot surface.
      Chrome: Same title/subtitle/axis/legend text, now in light ink (#F0EFE8) and soft light-gray (#B8B7B0) for secondary text, both clearly visible against the dark background. Gridlines remain subtle but visible in white-on-black form.
      Data: Identical data colors to the light render — brand-green frontier line, ochre dashed CML, purple triangle, blue diamond, and the same green-to-blue Sharpe gradient on the scatter cloud. Only the chrome (background, text, grid, marker outlines) flipped to the dark palette; no data colors changed between renders.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend/data-label text is clearly legible against the near-black background, and the brand green and other palette hues remain vivid.
