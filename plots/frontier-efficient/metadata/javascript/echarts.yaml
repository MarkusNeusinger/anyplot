review:
  strengths:
  - Correct closed-form Markowitz/Merton efficient frontier computed in-browser with
    a real Gauss-Jordan matrix inverse and no external math library
  - imprint_seq continuous colormap correctly applied to Sharpe ratio (single-polarity
    data) with a labeled High/Low Sharpe visualMap legend
  - Deterministic LCG-seeded random-portfolio generation gives full reproducibility
  - Min-variance and max-Sharpe portfolios are directly labeled on the chart instead
    of relying only on the legend, aiding data storytelling
  - Both themes are fully theme-adaptive and legible; background colors match the
    spec tokens
  - Title and axis labels correctly formatted with units and the mandated anyplot
    title string
  weaknesses:
  - 'Legend swatches for ''Efficient Frontier'' and ''Capital Market Line'' show ECharts''
    default palette colors (greenish / blueish) instead of the actual rendered colors
    (t.ink solid black/white line, t.amber dashed line) — only lineStyle.color was
    set on those two line series, and ECharts'' legend icon for line series falls
    back to itemStyle.color / the default palette when itemStyle.color is absent.
    Fix: add itemStyle: { color: t.ink } to the Efficient Frontier series and itemStyle:
    { color: t.amber } to the Capital Market Line series so the legend accurately
    reflects what''s plotted.'
  - The Capital Market Line uses the amber 'warning/caution' semantic anchor for what
    is really a neutral reference/baseline line (a tangent line from the risk-free
    rate) — the style guide reserves 'neutral' for baseline/reference lines and amber
    for warning/caution roles. Consider using the neutral ink tone (keeping the dashed
    style to differentiate it from the solid frontier curve) instead of amber.
  - The scatter cloud in the 10-15% risk band is dense enough that points overlap
    noticeably; symbolSize 9 with opacity 0.55 is slightly large/opaque for ~400 points
    in that band per the data-density heuristic — trim symbolSize a bit or lower opacity
    further to reduce overplotting.
  - The Merton closed-form solve (invertMatrix, matVec, dot helper functions) is more
    structurally elaborate than a bare KISS Imports→Data→Plot flow; justified by the
    lack of a math library in the browser, but worth noting for code-quality scoring.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "frontier-efficient · javascript · echarts · anyplot.ai" is dark and centered at top, clearly readable. Legend row below title lists "Efficient Frontier", "Capital Market Line", "Min-Variance Portfolio", "Max-Sharpe Portfolio" in soft dark gray text — all legible. Axis titles "Risk — Annualized Volatility (%)" and "Expected Return — Annualized (%)" and the % tick labels are dark/soft-dark and clearly visible against the light background. Grid lines are thin, light gray, subtle but visible.
      Data: Scatter cloud of ~400 random portfolios colored on a green-to-blue continuous scale (imprint_seq) by Sharpe ratio, with a "High Sharpe / Low Sharpe" visualMap bar on the right. The efficient frontier is a thick solid black (ink) curve arcing above the cloud. A dashed amber/gold line is the capital market line running from the risk-free rate through the tangency point. A dark diamond marks "Min Variance" and a dark pin marks "Max Sharpe", each with a direct text label. Note: the legend swatches for "Efficient Frontier" (looks olive/green) and "Capital Market Line" (looks blue) do NOT match the actual black/amber colors used for those series in the plot — a legend-color mismatch bug.
      Legibility verdict: PASS (all text readable; the legend-color mismatch is a correctness issue, not a legibility issue)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend text, axis titles, and tick labels all render in light/off-white tones and are clearly readable against the dark background — no dark-on-dark failures observed. Grid lines are faint light gray, subtle but visible.
      Data: Same green-to-blue Sharpe-ratio color scale as the light render (data colors identical, only chrome flipped). The efficient frontier line is now solid white/ink-light, and the capital market line is still dashed amber/gold — data colors preserved correctly across themes. Min-variance and max-Sharpe markers are light gray with the same direct labels. Same legend-color mismatch bug is present here too (legend swatches don't match the white frontier line / amber CML line).
      Legibility verdict: PASS (no dark-on-dark issues; same legend-color mismatch as light render)
