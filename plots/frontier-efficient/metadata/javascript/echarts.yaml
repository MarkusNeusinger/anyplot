review:
  strengths:
  - Correct closed-form Markowitz/Merton efficient frontier computed in-browser via
    a real Gauss-Jordan matrix inverse, with no external math library
  - imprint_seq continuous colormap correctly applied to Sharpe ratio (single-polarity
    data) with a clearly labeled High/Low Sharpe colorbar
  - 'All three attempt-1 weaknesses are resolved: legend swatches now match rendered
    line colors, the Capital Market Line uses the neutral ink tone (dashed) instead
    of the semantically-mismatched amber, and scatter marker size/opacity were trimmed
    to ease density'
  - Min-variance and max-Sharpe portfolios are directly labeled on the chart, aiding
    data storytelling beyond the legend alone
  - Deterministic LCG-seeded random-portfolio generation gives full reproducibility
  - Both themes are fully theme-adaptive and legible; backgrounds match the spec tokens;
    data colors are identical between renders
  weaknesses:
  - The scatter cloud in the 8-13% risk band remains moderately dense even after the
    attempt-1 trim; a further opacity reduction (~0.35) or a slightly smaller symbolSize
    in that band would help distinguish overlapping points.
  - Both the Efficient Frontier and Capital Market Line use the same ink color (differentiated
    only by line width/dash), which is a defensible neutral-reference-line choice
    but means no series in this chart uses the Imprint categorical palette (#009E73
    or the rest of t.palette) — worth a design note for consistency with other catalog
    entries, though not a correctness issue given the continuous-encoding data story
    here.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1
      Chrome: Title, legend row, both axis titles, and % tick labels are all dark and clearly readable. Grid lines thin and subtle.
      Data: ~400-point scatter cloud colored on a continuous blue-to-green imprint_seq scale by Sharpe ratio, labeled High/Low Sharpe colorbar; thick solid black efficient-frontier curve; black dashed capital market line; diamond and pin glyphs directly label Min Variance and Max Sharpe with no overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17
      Chrome: Title, legend, axis titles, and tick labels render in light/off-white tones, clearly legible. No dark-on-dark failures. Legend swatches for Efficient Frontier and Capital Market Line now correctly match the rendered ink color (attempt-1 defect fixed).
      Data: Scatter cloud and colorbar colors are pixel-identical to the light render; only chrome (frontier/CML lines, markers) flipped from black/dark-gray to white/light-gray.
      Legibility verdict: PASS
