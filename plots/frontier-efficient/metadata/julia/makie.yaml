review:
  strengths:
  - Mathematically rigorous closed-form MPT derivation (efficient frontier via covariance-matrix
    inversion, tangency portfolio, capital market line) instead of a shortcut approximation
  - 'Full feature coverage from the spec: frontier curve, random-portfolio scatter
    cloud, minimum-variance and max-Sharpe (tangency) markers, capital market line,
    and Sharpe-ratio color encoding with a colorbar'
  - 'Imprint palette compliance is perfect: efficient frontier uses brand green #009E73,
    min-variance/tangency markers use canonical palette positions 2 and 3, continuous
    Sharpe-ratio scatter uses the correct imprint_seq (green-to-blue) colormap'
  - Theme-adaptive chrome correctly threaded through Axis, Colorbar, and legend in
    both light and dark renders
  - 'Idiomatic, clean Makie usage: Axis/scatter!/lines!/Colorbar/axislegend/colsize!
    with explicit font sizes and tick formatting throughout'
  - Realistic, neutral financial data (6-asset universe with plausible returns, volatilities,
    and a single-factor correlation model that guarantees a valid positive-definite
    covariance matrix)
  weaknesses:
  - The 'Tangency' and 'Min variance' callout text sits very close to the frontier/CML
    lines (e.g. the 'Tangency' label at (6.2%, 5.8%) nearly touches the capital market
    line above it) - push the offset further or add a subtle background box so the
    labels read as clearly separate from the line geometry
  - Scatter markersize=11 with alpha=0.6 for 400 portfolios is acceptable but the
    densest cluster (10-14% risk) still shows meaningful marker overlap - consider
    markersize~8-9 or alpha~0.5 to further reduce overplotting in that region
  - Design storytelling (DE-03) relies mainly on the colorbar and marker emphasis;
    a subtle shaded region between the efficient frontier and the dominated-portfolio
    cloud, or a lighter callout box background, would sharpen the visual hierarchy
    further
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 - not pure white.
      Chrome: title "frontier-efficient · julia · makie · anyplot.ai" in bold dark ink, clearly visible at top-center; axis labels "Risk (Annualized Std. Dev.)" and "Expected Return (Annualized)" in dark ink; percent-formatted tick labels in softer gray; subtle light gridlines on both axes; legend box (bottom-right) with light elevated background, dark framed border, dark text.
      Data: dense scatter cloud of 400 simulated portfolios colored by Sharpe ratio using a green-to-blue sequential gradient (Imprint imprint_seq); thick brand-green (#009E73) efficient frontier curve; dashed dark capital market line from the origin through the tangency point; lavender diamond marker for the minimum-variance portfolio; blue star marker for the max-Sharpe (tangency) portfolio; small gray text callouts giving the return/risk of both key points; vertical colorbar on the right labeled "Sharpe ratio".
      Legibility verdict: PASS - all text (title, axis labels, ticks, legend, callouts, colorbar label) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 - not pure black.
      Chrome: same title now rendered in light/white ink, fully legible; axis labels in light ink; tick labels in lighter gray; gridlines subtle and visible against the dark surface; legend box uses the dark elevated background (#242420-equivalent) with light text and a soft border.
      Data: identical data colors to the light render - same green-to-blue Sharpe-ratio gradient, same brand-green frontier line, same lavender diamond and blue star markers - confirming only chrome flipped between themes.
      Legibility verdict: PASS - no dark-on-dark failures observed; title, axis labels, ticks, legend text, and callouts are all clearly readable against the near-black background, and the brand green frontier line remains highly visible.
