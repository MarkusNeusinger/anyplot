review:
  strengths:
  - Correct closed-form MPT math (analytic minimum-variance frontier via Merton's
    formula, unconstrained tangency portfolio) rather than an approximated or brute-forced
    frontier
  - 'Full feature coverage: efficient frontier curve, long-only random-portfolio cloud,
    Sharpe-ratio color mapping, minimum-variance and tangency markers, and the optional
    capital market line — every required and optional spec note is present'
  - Theme-adaptive chrome correctly threaded through Axis, Colorbar, and axislegend
    tokens; both renders pass legibility with identical data colors
  - Correct continuous colormap choice (imprint_seq for single-polarity Sharpe ratio)
    and correct categorical order for markers (brand green frontier, lavender min-variance
    diamond, blue tangency star)
  - 'Sensible density handling: 400-point scatter uses alpha=0.6 with no stroke to
    avoid overplotting mud, while the two key portfolios get larger markers with strokes
    for unambiguous distinction'
  weaknesses:
  - Y-axis percent tick labels look irregularly spaced (3%, 5%, 8%, 10%, 13%) because
    pct_format rounds the raw float ticks to the nearest integer percent — the underlying
    grid is evenly spaced but the labels read as arbitrary jumps. Format to one decimal
    (e.g. "2.5%", "7.5%") or pick explicit round-number ticks instead.
  - Beyond the spec-mandated colorbar/CML/marker features, styling largely applies
    the theme-token boilerplate from the style guide with little additional aesthetic
    differentiation — consider de-emphasizing the dense scatter cloud further or annotating
    the two key portfolios with their return/risk values to sharpen the visual hierarchy.
  - The tangency star marker sits inside a region of similarly-colored blue scatter
    points; shape/size/stroke differentiate it but a small callout label would remove
    any ambiguity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "frontier-efficient · julia · makie · anyplot.ai" is bold dark ink, fully visible, not clipped at the top edge. Axis labels "Risk (Annualized Std. Dev.)" and "Expected Return (Annualized)" are dark and clearly legible. Tick labels and the Sharpe-ratio colorbar label/ticks are in the softer secondary-ink tone and readable. Legend box (bottom right) uses the elevated cream fill with a visible frame; all four entries are legible and do not overlap data or each other.
      Data: Random-portfolio scatter is colored with the imprint_seq green→blue continuous colormap keyed to Sharpe ratio. The efficient frontier is a thick brand-green (#009E73) curve. The capital market line is a dashed gray/ink-soft line from near the origin through the tangency point. The minimum-variance portfolio is a lavender diamond; the max-Sharpe (tangency) portfolio is a blue star — both palette positions 2 and 3, consistent with the Imprint canonical order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, axis labels, and colorbar label render in light ink (#F0EFE8) and are clearly visible against the dark background. Tick labels and legend text use the lighter secondary tone and remain legible; legend frame/fill uses the dark elevated surface with a visible border. No dark-on-dark text anywhere.
      Data: Scatter, frontier curve, CML, and both key-portfolio markers use identical colors to the light render — only the chrome (background, text, grid, legend frame) flipped, as required.
      Legibility verdict: PASS
