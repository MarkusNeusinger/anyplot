review:
  strengths:
  - The efficient frontier is a 3 px brand-green line with a page-colored pe.Stroke
    halo, so it separates cleanly from the dense band of random portfolios right below
    it in both themes
  - The capital market line runs from the 3% risk-free point at zero risk, touches
    the frontier at the maximum Sharpe star (0.72), and stays above the frontier everywhere
    else, which matches the tangency geometry the spec describes
  - The minimum variance diamond sits at the leftmost point of the frontier, and the
    tangency star is told apart from it by shape, size and color (Imprint positions
    2 and 4), with edges outlined in the theme ink
  - The Sharpe ratio coloring uses imprint_seq exactly as the style guide builds it,
    with an opaque colorbar (solids alpha 1, no outline, no tick marks)
  - 'The data is honest: 400 Dirichlet long-only portfolios plus 60 scipy-optimized
    frontier portfolios from a five-asset covariance model, and every point sits at
    its own risk and return'
  - 'Theme tokens carry through to every element: title, labels, ticks, legend frame,
    colorbar and marker edges all flip correctly between light and dark'
  weaknesses:
  - 'Suggestion: the frontier''s brand green is also the low-Sharpe end of the imprint_seq
    scale, so at high risk (x > 20) the line and the nearby teal points share a hue;
    the thickness and halo already tell them apart, but a darker frontier outline
    could separate them further.'
  - 'Suggestion: the y-axis starts at 0 to show the risk-free intercept, which leaves
    the lower right half of the plot empty; that is a fair tradeoff, but a tighter
    x-range or an inset could give the dense cloud more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across both figure and axes, with no pure white.
      Chrome: the bold dark title "frontier-efficient · python · matplotlib · anyplot.ai" fills about 60% of the width. The axis titles "Risk: standard deviation (% per year)" and "Expected return (% per year)" are dark ink, and the tick labels are soft dark gray. The grid is subtle, and only the left and bottom spines are drawn. The legend in the upper left sits on an elevated off-white frame with a thin gray edge. A "Sharpe ratio" colorbar runs from 0.45 to 0.70. All text is readable.
      Data: about 460 portfolios form a thin crescent from about (9, 9) to (30, 16), colored by Sharpe ratio on imprint_seq (green at the low end, blue at the high end). A thick #009E73 efficient-frontier line with a halo runs along the upper left edge. A dashed gray capital market line starts at the 3% risk-free dot on the y-axis and is tangent at the ochre star (maximum Sharpe 0.72, about 10.2% risk and 10.4% return). A purple diamond marks the minimum variance portfolio at the frontier's leftmost point (about 9.2% risk and 9.05% return). The first series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, with no pure black.
