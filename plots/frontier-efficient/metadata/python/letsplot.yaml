review:
  strengths:
  - 'Frontier drawn as a thick INK line (size 1.6) over a translucent Sharpe-colored
    cloud: clearly distinguished from the scatter and running along its upper-left
    edge in both renders'
  - 'Minimum variance and maximum Sharpe portfolios are told apart by two Imprint
    fills (#C475FD, #BD8233) on ink-outlined diamonds and named by direct geom_text
    labels, with no separate legend needed'
  - 'Sharpe-ratio coloring uses the Imprint sequential gradient (#009E73 → #4467A3)
    with a titled colorbar; the capital market line starts at the 3 % risk-free rate
    and touches the frontier at the tangency portfolio'
  - Theme tokens threaded through every chrome element; both renders readable, data
    colors identical across themes
  - Layered grammar with one data frame per layer and column constants as readable
    axis titles; HTML export keeps lets-plot's native hover tooltips
  weaknesses:
  - 'VQ-06 (both): axis titles ''Risk (standard deviation)'' and ''Expected return''
    carry no unit while the ticks read as bare fractions (0.1, 0.12, 0.14) → state
    the unit, e.g. annualized percent: ''Annualized risk, σ (%)'' / ''Expected annual
    return (%)'' with percent-formatted ticks. Likely cause: RISK/RETURN constants
    without a unit and no scale_x_continuous/scale_y_continuous(format=''.0%'').'
  - 'DQ-03 (both): the frontier has a staircase at return 0.14 between risk ≈ 0.170
    and 0.176 — a horizontal segment (more risk for the same return) followed by a
    vertical jump, which an efficient frontier cannot contain → a monotone, concave
    frontier. Likely cause: frontier_returns stores the target return instead of each
    best portfolio''s actual return, so several random-search points share one return
    value (lines 76–90).'
  - 'DE-02 (both): the panel is drawn with a full four-sided box, top and right edges
    included → left and bottom axis lines only, or none. Likely cause: the panel border
    inherited from the theme; set panel_border=element_blank() next to axis_line.'
  - 'Suggestion: compute the frontier with scipy.optimize.minimize (min variance per
    target return, weights ≥ 0, sum 1) instead of 50 × 2000 random draws, which would
    also give a smooth curve.'
  - 'Suggestion: tick labels mix decimal lengths (0.1 beside 0.12); a fixed format
    would read more evenly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, full canvas 3200×1800.
      Chrome: title "frontier-efficient · python · letsplot · anyplot.ai" (~51 % width), axis titles "Risk (standard deviation)" / "Expected return" in dark ink, soft-ink tick labels, subtle grid, colorbar "Sharpe ratio" on an elevated panel; a four-sided panel box. All text readable.
      Data: ~350 portfolios colored by Sharpe with the Imprint gradient #009E73→#4467A3 at alpha 0.65; thick near-black frontier along the cloud's upper-left edge with a small staircase at return 0.14 near risk 0.17–0.176; dashed soft-ink CML from 0.03 at zero risk through the tangency point; purple (#C475FD) diamond "Minimum variance" at (0.088, 0.083) and ochre (#BD8233) diamond "Maximum Sharpe" at (0.101, 0.104), both ink-outlined and labelled.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and labels in light ink; colorbar panel #242420; no dark-on-dark text.
      Data: cloud gradient and diamond fills identical to the light render; frontier, diamond outlines and CML flip to light ink as theme chrome.
      Legibility verdict: PASS
