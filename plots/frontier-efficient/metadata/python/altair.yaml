review:
  strengths:
  - 'Theme tokens threaded through every chrome element: both renders readable, no
    dark-on-dark, data colors identical across themes'
  - Sharpe ratio colored on the imprint_seq ramp with a gradient legend explaining
    it
  - Key portfolios encoded redundantly by shape and color with page-colored outlines,
    so minimum variance, maximum Sharpe and the risk-free rate stay distinct on top
    of the cloud
  - Shared x/y encodings reused across three layers with resolve_scale giving each
    layer its own legend
  - Capital market line computed from the tangency portfolio, passing through the
    risk-free rate and lying above the frontier everywhere else
  - Tooltips on the cloud and key portfolios for the HTML view
  weaknesses:
  - 'VQ-03 (both): the 300 portfolios are squeezed into about 25 % of the plot width
    and 23 % of its height (risk 0.17-0.26, return 10-14.5 %), and the core along
    the frontier merges into an opaque blue band where single portfolios cannot be
    told apart (C3) → a readable core: smaller markers (size 45 → about 25) and lower
    opacity (0.65 → about 0.45). Likely cause: mark_circle(size=45, opacity=0.65)
    at the compressed scale the zero-based axes produce.'
  - 'VQ-06 (both): the return axis is formatted in percent while the risk axis shows
    raw fractions (0.00-0.30) with no unit → format risk as percent too (format=''.0%'').
    Likely cause: x_enc has no axis format.'
  - 'VQ-07 (both): the key-portfolio categories take Imprint positions 2, 4 and 6
    (#C475FD, #BD8233, #2ABCCD) and the capital market line position 5 (#AE3030) with
    no semantic reason → positions in canonical order. Likely cause: hand-picked IMPRINT_PALETTE
    indices in the key_points and curves scales.'
  - 'CQ-04 (code): lines 64-72 write out a monotone-chain upper convex hull that scipy.spatial.ConvexHull
    computes → use ConvexHull(points).vertices and keep the upper chain. Likely cause:
    a hand-rolled hull loop.'
  - 'Suggestion: compute the efficient frontier by mean-variance optimization over
    the asset universe so the curve extends beyond the sample''s highest-return portfolio.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas with the chart padded centrally.
      Chrome: title 'frontier-efficient · python · altair · anyplot.ai' in dark ink, axis titles 'Risk (standard deviation)' and 'Expected return', tick labels in INK_SOFT, subtle grid; three legends in elevated boxes on the right (Sharpe ratio gradient 0.45-0.54, curve legend, Key portfolios). All readable.
      Data: 300 circles colored green #009E73 to blue #4467A3 by Sharpe ratio, compressed in the upper right (risk 0.17-0.30, return 10-16 %); thick near-black efficient frontier along the upper-left edge of the cloud; dashed red #AE3030 capital market line from the cyan triangle at 0 risk / 2 % to the ochre square (max Sharpe) and beyond; purple diamond at the frontier's left end (min variance). Dense core along the frontier is an opaque band.
      Legibility verdict: PASS

