review:
  strengths:
  - Efficient frontier solved exactly per target return with scipy.optimize.minimize
    (SLSQP, long-only, fully invested), so the curve is smooth and the minimum-variance
    portfolio is its leftmost point
  - 'Sharpe terciles colored in imprint_seq steps from #009E73 to #4467A3, explained
    in the legend with their computed edges'
  - Minimum variance (purple) and maximum Sharpe (ochre) marked with 24 px dots and
    labelled with their key numbers
  - 'Idiomatic pygal: one XY chart whose per-series stroke, dots_size and stroke_style
    options give scatter, line and marker layers; formatters drive percent ticks and
    HTML tooltips'
  - 'Clean theme adaptation: chrome flips, data colors identical, all text readable
    in both renders'
  weaknesses:
  - 'VQ-07 (both): the efficient frontier is drawn in #AE3030, the semantic loss/error
    anchor, although the frontier is the best set of portfolios → a non-red categorical
    color such as #C475FD or #BD8233 (moving the key markers to the remaining positions).
    Likely cause: IMPRINT_PALETTE[4] as the fourth entry of series_colors.'
  - 'Suggestion: a capital market line from the 2 % risk-free rate through the maximum
    Sharpe portfolio, which the Notes allow, would show why that point is the tangency
    portfolio.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'frontier-efficient · python · pygal · anyplot.ai' centred, about 60 % of the width; axis titles 'Risk (standard deviation)' and 'Expected return'; percent ticks 12-28 % (x) and 8-18 % (y); dotted subtle grid; two-row, three-column bottom legend. All dark text, readable.
      Data: about 400 random portfolios colored in three Sharpe terciles (#009E73 green, teal mid step, #4467A3 blue), with the blue tercile hugging the frontier; efficient frontier as a thick #AE3030 red curve along the upper-left edge from 12.2 % to 29 % risk; Minimum variance as a large purple dot at the frontier's leftmost point (12.2 %, 9.4 %); Maximum Sharpe as a large ochre dot on the frontier at about 14.5 %, 12.1 %. First series is #009E73.
