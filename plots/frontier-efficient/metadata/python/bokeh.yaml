review:
  strengths:
  - Efficient frontier computed with scipy.optimize.minimize (SLSQP) over target returns,
    with the minimum-variance and tangency portfolios chosen by rule from the frontier
  - 'Imprint sequential ramp (#009E73 -> #4467A3) for Sharpe with a native bokeh ColorBar
    and LinearColorMapper'
  - 'Theme tokens threaded through every chrome element: both renders fully legible'
  - Page-colored outlines and alpha keep the dense core of the 300-point cloud readable
  weaknesses:
  - 'VQ-03 (both): the legend glyphs for ''Minimum variance'' and ''Maximum Sharpe''
    render at about 8 px, so their amber and purple fills are lost (the dark-render
    star reads as a light outline) and no longer match the 70/60 px markers → legend
    glyphs at about the glyph_height of 36 px showing the fill (+28 px). Likely cause:
    bokeh scales scatter legend glyphs to the small default; give the key markers
    their own legend items via LegendItem with a renderer sized for the legend, or
    raise glyph size through the legend''s glyph_height and set a thinner INK outline.'
  - 'CQ-01 (code): a helper function `port_risk` (lines 73-74) breaks the Imports
    → Data → Plot → Save structure → inline it as a lambda or the expression `np.sqrt(w
    @ asset_cov @ w)`. Likely cause: def port_risk.'
  - 'Suggestion: the rotated colorbar title ''Sharpe ratio'' sits at the bottom of
    the bar next to the legend; a horizontal title above the bar would read more naturally.'
  - 'Suggestion: a HoverTool showing risk, return and Sharpe per portfolio would add
    value to the HTML view.'
