review:
  strengths:
  - 'Efficient frontier is a 4 px brand-green #009E73 line along the upper-left edge
    of the cloud, clearly set apart from the 0.65-opacity scatter and the 2 px dashed
    capital market line'
  - Minimum variance (blue diamond) and maximum Sharpe (amber star) are taken from
    the frontier itself, so the diamond sits at its leftmost point and the star exactly
    where the capital market line touches it
  - 'Sharpe-ratio coloring uses the Imprint sequential scale (#009E73 → #4467A3) with
    a shortened, outline-free colorbar; chrome flips cleanly between the two themes
    while data colors stay identical'
  - Vectorised portfolio math (np.einsum for the quadratic form) and a pandas cut/groupby/idxmin
    frontier keep the code short and deterministic with a seed
  - Plotly-native hovertemplates format risk, return and the per-point Sharpe value
    (%{marker.color:.2f}) as percentages for the HTML view
  weaknesses:
  - 'Suggestion: colorbar ticks read 0.45 / 0.5 / 0.55; a fixed tickformat of .2f
    would give them consistent decimals.'
  - 'Suggestion: the cloud and frontier occupy only the right third of the x-range
    because the axis starts at the risk-free point; a broken or inset view of the
    cloud could give its dense core more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape canvas.
      Chrome: centered title "frontier-efficient · python · plotly · anyplot.ai" in dark ink; axis titles "Risk (standard deviation)" and "Expected return (annual)"; percent tick labels 0%-25% and 0%-16% in INK_SOFT; subtle grid; legend top-left on an elevated panel with a thin border (Random portfolios, Capital market line, Efficient frontier, Risk-free rate (3%), Minimum variance, Maximum Sharpe ratio); "Sharpe ratio" colorbar on the right with ticks 0.45-0.55. All readable.
      Data: about 300 small portfolio dots colored green→blue by Sharpe ratio, clustered between 15% and 28% risk; thick #009E73 frontier along their upper-left edge from about 15% / 10% to 28% / 16.5%; purple #C475FD dashed capital market line from the grey risk-free point at 0% / 3% touching the frontier at the amber star (about 18.5% / 13.3%); blue #4467A3 diamond at the frontier's leftmost point (about 15% / 9.9%).
