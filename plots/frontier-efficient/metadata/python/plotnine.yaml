review:
  strengths:
  - Frontier computed with scipy.optimize.minimize under long-only constraints and
    drawn as a thick, clearly distinct line
  - Minimum variance and maximum Sharpe portfolios marked with different shapes and
    direct labels
  - Theme tokens threaded through all chrome; both renders readable
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700 → 3200x1800 (-1600 x -900 px). Likely cause:
    figure_size=(16, 9) with ggsave dpi=300; use figure_size=(8, 4.5), dpi=400.'
  - 'VQ-07 (both): Sharpe ratio colored with viridis, a forbidden colormap → imprint_seq
    (#009E73 to #4467A3). Likely cause: scale_color_cmap(cmap_name=''viridis''); use
    scale_color_gradient(low=''#009E73'', high=''#4467A3'').'
  - 'VQ-02 (both): the ''Max Sharpe'' label is drawn on top of the dense scatter around
    risk 0.20-0.23, return 0.117 → clear of the cloud, for example up-left of the
    diamond in the empty region above the frontier. Likely cause: annotate text at
    max_sharpe_risk + 0.012 on the cloud side.'
  - 'SC-02 (both): the frontier line continues below the minimum-variance square down
    to about return 0.089 (the inefficient branch) → start the curve at the minimum-variance
    portfolio. Likely cause: target_returns below the minimum-variance return are
    kept.'
  - 'SC-04 (both): title ''frontier-efficient · plotnine · anyplot.ai'' lacks the
    language segment → ''frontier-efficient · python · plotnine · anyplot.ai''. Likely
    cause: the title string.'
  - 'CQ-01 (code): line 94 ends the Data block with df_frontier, not one tidy df;
    no column constants for the risk and return roles; the plot reads df_portfolios,
    df_frontier and the min/max-Sharpe scalars bound in the Data block → one df with
    column constants above the block, frontier and key portfolios derived from df
    below it. Likely cause: data prepared as several frames inside the Data block.'
  - 'Suggestion: a capital market line from the risk-free rate through the maximum-Sharpe
    diamond would make the tangency explicit (the Notes allow it).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, canvas 4800x2700.
      Chrome: title "frontier-efficient · plotnine · anyplot.ai", axis titles "Risk (Standard Deviation)" and "Expected Return", tick labels and the "Sharpe Ratio" colorbar in dark/soft ink; all readable.
      Data: 300 random portfolios colored by Sharpe ratio on viridis (purple to yellow); efficient frontier as a thick #009E73 line from risk 0.16 to 0.39 that continues slightly below the minimum-variance point; red square "Min Var" and red diamond "Max Sharpe" markers with labels; the "Max Sharpe" label sits on the dense scatter.
      Legibility verdict: PASS

