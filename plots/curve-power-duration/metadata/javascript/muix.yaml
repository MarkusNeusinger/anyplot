review:
  strengths:
  - 'The log time axis uses the native scaleType: "log" with a human-readable tick
    ladder (1 s, 5 s, 30 s, 1 min, 5 min, 20 min, 1 h, 2 h, 5 h) through tickInterval
    and valueFormatter, as the spec requires.'
  - 'The empirical mean-maximal curve is monotonically non-increasing by construction:
    each value is capped at the best shorter effort. monotoneX interpolation avoids
    spline overshoot.'
  - The critical power model is a dashed lavender (#C475FD) line under a heavier solid
    brand-green (#009E73) empirical line. It stays distinguishable where the two nearly
    coincide and levels off onto the labeled CP asymptote at 280 W.
  - The four reference durations (5 s sprint, 1 min, 5 min, 20 min FTP proxy) are
    composed as native ChartsReferenceLine children, drawn as light dashed inkSoft
    rules with top-aligned labels, and theme-adaptive in both renders.
  - The legend mark for the model series is restyled through slotProps.legend.sx with
    the series' data-series selector, so its glyph is dashed like the line it explains.
  - The subtitle reports CP = 280 W and W′ = 20.0 kJ computed from the model column,
    which ties the chart to the spec's CP/W′ decomposition.
  weaknesses:
  - 'Suggestion: the synthetic blend below 30 s produces a flat 960 W shelf from about
    15 to 28 s and then a sharp knee where the hyperbolic model takes over. A smoother
    short-duration decay would read more like a real rider''s profile.'
  - 'Suggestion: drawing the model line below 30 s as well would show how the hyperbolic
    model overshoots the empirical sprint power at short durations, which is the classic
    CP-model departure the spec describes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: The bold title "Cyclist Power Profile · curve-power-duration · javascript · muix · anyplot.ai" is centered in dark ink and spans about 49 % of the width. Below it, a soft-ink subtitle reads "55 durations from 1 s to 5 h · model fit CP = 280 W, W′ = 20.0 kJ". A centered horizontal legend follows. The y axis is "Mean-maximal power (W)" with ticks from 0 to 1,100. The x axis is "Effort duration", a log scale with ticks 1 s, 5 s, 30 s, 1 min, 5 min, 20 min, 1 h, 2 h and 5 h. No grid; only the left and bottom axis lines. All text is dark and clearly readable.
      Data: A solid brand-green #009E73 empirical curve falls from about 1,093 W at 1 s, steps down to about 960 W at 15–28 s, drops steeply past 1 min (about 610 W) and 5 min (about 350 W), and flattens to about 277–280 W over hours. A dashed lavender #C475FD CP model line starts at 30 s, nearly coincides with the empirical curve, and levels off at the dashed "Critical power 280 W" asymptote. Thin dashed gray vertical markers sit at 5 s, 1 min, 5 min and 20 min, labeled "5 s sprint", "1 min", "5 min" and "20 min (FTP proxy)" at the top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: The title, subtitle, legend text, axis titles and tick labels all flip to light ink and are clearly readable. The reference-line and CP labels are light gray. There is no dark-on-dark text anywhere.
      Data: Green #009E73 for the empirical line and lavender #C475FD for the dashed model are identical to the light render. Only the chrome flipped.
      Legibility verdict: PASS
