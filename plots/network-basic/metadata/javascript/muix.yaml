review:
  strengths:
  - The Fruchterman–Reingold layout, seeded by social circle, splits the 20 people
    into four clear clusters joined by a few bridging edges, so connected nodes sit
    together and the groups read at a glance in both themes
  - Each label goes in the widest angular gap between its node's edges and carries
    a page-coloured halo (paintOrder stroke), so no label collides with an edge, a
    node or another label
  - Edges at 1.6 px in inkSoft with 0.42 opacity stay clearly thinner and lighter
    than the nodes, so every connection can be followed from end to end
  - 'Composes the network inside ChartsContainer and maps the layout coordinates through
    the useXScale/useYScale hooks, with hidden axes (position: ''none'') and skipAnimation'
  - 'The theme tokens carry all chrome, so title, labels, legend and caption are readable
    on both #FAF8F1 and #1A1A17, and the group colours come from t.palette in canonical
    Imprint order (Family = #009E73)'
  weaknesses:
  - 'DQ-01 (both): every node has degree 3 or 4, so the node-size-by-degree encoding
    shows two nearly identical sizes and the graph has no central node, which the
    spec''s Description names as something a network graph reveals → generate edges
    so degrees range from about 1–2 (peripheral) to 6–8 (one or two hubs). Likely
    cause: the edge list gives each person three to four ties.'
  - 'Suggestion: render the group key with MUI X''s ChartsLegend instead of the hand-drawn
    SVG legend, so the legend uses the library''s own component.'
  - 'Suggestion: tighten the empty band between the lowest node (Marcus) and the caption
    so the network fills the square more evenly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas; no axes or grid.
      Chrome: bold centred title "network-basic · javascript · muix · anyplot.ai" in dark ink; top-left legend Family / College / Work / Neighbors with coloured dots; muted caption at the bottom "Fruchterman–Reingold force-directed layout · Node color = Social circle · Node size = degree". All text dark on light and readable.
      Data: 20 nodes in four clusters: Family green #009E73 (right), College purple (top), Work blue (left), Neighbors ochre (bottom). Grey translucent edges, a few bridging edges between clusters, one crossing (Aisha–Ruby over Omar–Noah). Node labels in dark ink with page-coloured halos, each clear of edges and nodes. Node sizes differ only slightly (degree 3 vs 4).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend text and node labels in light ink, caption in muted light grey; no dark-on-dark text.
      Data: same node positions and the same four group colours as the light render (green, purple, blue, ochre); edges flip to a mid grey that stays visible but subtle.
      Legibility verdict: PASS
