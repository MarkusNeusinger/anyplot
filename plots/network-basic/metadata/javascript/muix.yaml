review:
  strengths:
  - 'Composes ChartsContainer with hidden axes (position: "none") and reads useXScale/useYScale
    inside a custom SVG child, so the written-out Fruchterman–Reingold layout coordinates
    are mapped to pixels by MUI X''s own scales'
  - 'Clean force-directed layout: the four social circles form compact communities
    joined by six visible bridge edges, with no axes or grid, exactly as the spec''s
    characteristic section asks'
  - Edges at inkSoft with 0.42 opacity and 1.6 px are clearly thinner and lighter
    than the nodes, so every connection can be followed end to end in both themes
  - Node labels carry a page-colored halo (paintOrder stroke) and are placed in the
    widest angular gap between a node's edges, so no label is crossed by an edge in
    most of the graph
  - 'Node color by social circle (Imprint positions 1–4, Family = #009E73) and node
    size by degree are both named, in a legend and a caption, as the spec requires
    for optional encodings'
  - 'Theme tokens threaded through every chrome element: title, labels, legend text,
    caption, edges and node outlines flip correctly between #FAF8F1 and #1A1A17'
  weaknesses:
  - 'VQ-02, SC-02 (both): labels placed left or right of their node touch or overlap
    the node disc: "Aisha" runs into its node, "Nadia" and "Felix" sit on their node''s
    edge, the "E" of "Ethan" overlaps its node, and the Kenji–Liam edge grazes the
    "L" of "Liam" → every label clear of its own node and of edges by at least 4 px.
    Likely cause: the label offset `labelDist = r + 15` with `textAnchor="middle"`
    ignores the label''s half-width for near-horizontal angles; anchor the text at
    "start"/"end" by the cosine of labelAngle (or add half the text width to the offset).'
  - 'VQ-01 (both): node labels at 15 px and the caption at 14 px on the 1200 px square
    mount shrink to about 5 px in the 400 px thumbnail and are hard to read → labels
    about 18 px, caption about 16 px (+2 to +3 px). Likely cause: `fontSize={15}`
    on the node labels and `fontSize: 14` on the caption div.'
  - 'Suggestion: render the group legend with MUI X''s ChartsLegend instead of the
    hand-drawn SVG circles, so the legend shares the library''s styling and interaction.'
  - 'Suggestion: a slightly larger node-radius step per degree would make the few
    higher-degree nodes (Grace, Liam, Omar, Victor, Ruby, Chloe, Maya, Sofia) read
    as hubs more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400×2400 canvas, no white panel.
      Chrome: bold dark title "network-basic · javascript · muix · anyplot.ai" centered at the top (~47 % of the width); a vertical legend top-left with four colored dots (Family, College, Work, Neighbors) in dark ink; a muted caption at the bottom "Fruchterman–Reingold force-directed layout · Node color = Social circle · Node size = degree". No axes, no grid. All text readable.
      Data: 20 nodes in four communities — Family #009E73 green (right), College purple (top), Work blue (left), Neighbors ochre (bottom) — node radius grows with degree, each with a thin page-colored outline. 31 grey edges, thin and translucent, with six bridges between communities. Labels in dark ink with a page-colored halo next to each node; Aisha, Nadia, Felix and Ethan labels touch their node discs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, legend text and node labels flip to light ink; caption in a muted light grey; all readable, no dark-on-dark text anywhere.
      Data: node colors identical to the light render (green, purple, blue, ochre); edges a mid grey that stays visible but subordinate on the dark page; node outlines in the dark page color. Same label-to-node contacts as the light render.
      Legibility verdict: PASS
