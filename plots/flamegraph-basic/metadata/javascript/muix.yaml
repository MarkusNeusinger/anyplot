review:
  strengths:
  - 'Correct proportional icicle layout: sibling frames sit directly adjacent with
    only a 1.5px page-bg divider stroke, matching the spec''s ''minimal or no gaps''
    requirement.'
  - Function name labels are conditionally rendered only when they fit the bar's pixel
    width, so no clipped or overflowing text ever appears inside a frame.
  - Sample counts are internally consistent at every level (each parent's samples
    exactly equal the sum of its children's), which is exactly how a real profiler
    reports data.
  - 'Imprint palette used correctly: first real branch (parse_request) is #009E73,
    remaining branches follow canonical order 2/3, and the root uses the theme-adaptive
    neutral anchor with a matching theme-adaptive label so it flips correctly between
    renders.'
  - Chrome (title, subtitle, depth labels, legend) is fully theme-adaptive and legible
    in both light and dark renders with no dark-on-dark or light-on-light failures.
  - Creative, idiomatic use of ChartContainer plus the useXScale/useYScale hooks to
    hand-build a chart type MUI X community has no built-in component for -- a genuine
    demonstration of library mastery rather than falling back to NOT_FEASIBLE.
  - Legend clearly maps the three branch colors to their function names, and the title
    exactly matches the mandated 'flamegraph-basic · javascript · muix · anyplot.ai'
    format.
  weaknesses:
  - 'Data volume falls well short of the spec''s stated ''Size: 50-500 unique stack
    traces'' -- this tree has only 8 unique leaf-to-root traces (14 frames total).
    Expand the call tree (more branches, more sibling functions per level, maybe a
    4th top-level path) so the flame graph reads as a realistic profile with dozens
    of stacks rather than a small illustrative example.'
  - 'The spec''s Notes explicitly ask for ''a warm color palette (yellows, oranges,
    reds) following the conventional flame graph aesthetic'', but this implementation
    colors branches with the standard categorical Imprint order (green/lavender/blue)
    instead. That is platform-compliant (see the d3 flamegraph-basic implementation,
    which took the same approach), but the matplotlib implementation for this same
    spec shows a stronger resolution: it builds a warm amber->ochre->matte-red gradient
    purely from Imprint anchors (#DDCC77/#BD8233/#AE3030), honoring the domain convention
    while staying inside the palette. Consider a similar warm-from-Imprint gradient
    (e.g. keyed to each frame''s proportion of total samples) instead of the flat
    categorical assignment.'
  - Title renders at only ~35-40% of the canvas width at the default 22px CSS fontsize
    (the mandated title here is just 51 chars, well under the 67-char reference used
    by the scaling formula, so no shrink is applied). The style guide's target for
    a shorter custom title is ~50-70% -- bump the title fontsize a bit so it fills
    more of the available width.
  - Data Storytelling is present only through color-coded branches and depth rows;
    nothing calls out the actual hot path (e.g. query_database/execute_sql account
    for over a quarter of all samples). A short callout or subtle emphasis (bolder
    outline, brief annotation) on the dominant chain would give the viewer an immediate
    takeaway instead of requiring them to read bar widths themselves.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "flamegraph-basic · javascript · muix · anyplot.ai" in bold dark ink at top-center; subtitle "Simulated web-request CPU profile · 12,000 samples across 14 stack frames" in soft grey beneath it; a 3-item color-key legend (parse_request/handle_business_logic/write_response) below the subtitle; left-side row labels "Depth 0 · root" through "Depth 4" in soft grey. All chrome text is dark-on-light and clearly legible.
      Data: Five stacked rows of horizontally adjacent rectangles forming a classic icicle/flame layout, root-at-bottom. Root (depth 0, "main") fills the full width in near-black (theme-adaptive neutral) with a cream "main" label. Depth 1 splits into parse_request (green #009E73), handle_business_logic (lavender #C475FD), write_response (blue #4467A3), matching the legend. Higher depths narrow proportionally under their parent branch. Most bars carry a centered bold function-name label in a fixed white or near-black text depending on the fill's own luminance; the two narrowest bars (validate_headers, flush_socket) correctly show no label since the text wouldn't fit. Data colors read clearly against the light background.
      Legibility verdict: PASS -- all text is readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, subtitle, legend, and depth-row labels as the light render, now rendered in light ink/soft-grey tones. All chrome text is clearly legible against the dark background, with no dark-on-dark failures observed anywhere (title, subtitle, depth labels, legend text all light-colored).
      Data: Identical layout and identical branch colors to the light render -- green #009E73, lavender #C475FD, blue #4467A3 for parse_request / handle_business_logic / write_response respectively, confirming data colors are unchanged across themes. Only the chrome flipped: the root's "main" bar is now a light cream fill (theme-adaptive neutral) with a dark "main" label, correctly inverted from the light render's dark-fill/light-label pairing so it stays readable on the light-neutral swatch it now uses.
      Legibility verdict: PASS -- all text readable, no dark-on-dark failures.
