review:
  strengths:
  - Composes the flame graph inside ChartsContainer with useXScale/useYScale, so every
    frame's position and width comes from MUI X's own linear scales rather than hand-computed
    pixel math
  - 'Correct icicle-style layout: one row per stack depth with root at the bottom,
    each callee placed inside its caller''s x-range, and siblings directly adjacent
    with thin page-colored separators that keep the many narrow frames distinguishable
    in both themes'
  - 'Width-aware labelling: names are only drawn when the bar is wide enough, so no
    label spills past its bar, and the label ink switches between dark and light by
    the fill''s luminance'
  - Native SVG <title> per frame gives function, sample count and share on hover in
    the HTML output
  - Warm amber→ochre→red ramp built from Imprint tokens follows the flame graph convention,
    and the data scenario (14,000 samples, 97 leaf traces, depth 6) sits well inside
    the spec's 50–500 trace range
  weaknesses:
  - 'VQ-01 (both): white labels on the light-tan mid-ramp fills (serialize_headers,
    resolve_record, parse_request, write_response) have low contrast (roughly 2:1)
    and are hard to read, while neighbouring fills of almost the same tone get dark
    text → dark #1A1A17 text on every fill except the deep red end (aim for ≥4.5:1).
    Likely cause: the luminance threshold `lum > 0.45` on line 261 is too high for
    this ramp; about 0.25–0.3 would switch these fills to dark ink.'
  - 'VQ-07 (both): the root frame `main` is filled with the chrome token t.inkSoft,
    so the data mark changes color between themes (dark grey on light, pale grey on
    dark) while data colors must be identical across renders → a fixed fill for the
    root, e.g. the low end of the warm ramp or a fixed Imprint neutral. Likely cause:
    ROOT_RGB built from t.inkSoft (lines 22–26).'
  - 'DQ-02 (both): the callee names are random verb_noun combinations drawn from two
    word lists (decode_schema under resolve_record, cache_row under parse_request,
    serialize_headers under handle_business_logic), so the call tree reads as generic
    rather than as a real request-handling profile → a hand-written call tree whose
    callees belong to their callers (parse_request → read_body, json_decode; authenticate_user
    → verify_jwt, load_session). Likely cause: the VERBS/NOUNS random name generator
    (lines 39–74, 118–126).'
  - 'CQ-04 (code): the hex→RGB parsing is written out twice (lines 17–21 and 22–26)
    and the legend is laid out by estimating text widths with a 0.58 char-width ratio
    across ~25 lines (lines 270–296) → one small parse helper for both, and a legend
    layout that does not depend on guessed glyph widths. Likely cause: incremental
    legend construction without refactor.'
  - 'Suggestion: classic flame graphs vary warm hue per frame rather than mapping
    color to share; a per-frame hue jitter would make adjacent same-tone frames at
    depths 4–6 easier to tell apart without relying on separators alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: bold dark title "flamegraph-basic · javascript · muix · anyplot.ai" centered at top (~31% width), grey subtitle "14,000 Samples across 162 stack frames (97 leaf traces)", a legend row (dark-grey root swatch "main (root · 100% Samples)", gradient bar from pale amber to red labelled "fewer Samples (0.3%)" / "more Samples (55.0%)"), and left-hand row labels "Depth 0 · root" … "Depth 6" in soft dark ink. All chrome readable.
      Data: 7 rows of adjacent bars separated by thin cream lines; root `main` in dark grey spans full width; depth 1 has parse_request, an unlabeled frame, handle_business_logic in deep red (55%) and write_response in ochre; upper rows fade to pale amber with many narrow unlabeled frames and a ragged top edge. 13 frames carry bold in-bar labels; dark text on pale fills, white on darker fills — white labels on mid-tan fills (serialize_headers, resolve_record) are low-contrast. No label spills past its bar.
      Legibility verdict: PASS (with low-contrast white in-bar labels on mid-tan fills)

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title in light ink, subtitle, legend text and depth labels in light soft ink — all readable, no dark-on-dark text. Separators flip to the dark page color.
      Data: warm ramp colors identical to the light render; only the root frame `main` changes from dark grey to pale grey (it uses the inkSoft chrome token) and its label switches to dark text. In-bar labels identical to light, same low-contrast white on mid-tan fills.
      Legibility verdict: PASS (same low-contrast in-bar labels as light)
