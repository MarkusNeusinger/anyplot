review:
  strengths:
  - Builds the flame layout from folded stacks inside ChartsContainer and draws the
    frames through useXScale/useYScale, so every frame's width is its exact sample
    share (handle_business_logic 54.6 %, 11,380 samples, 99 frames, verified against
    the data) and every callee sits within its caller
  - Siblings are separated by 1.5 px strokes in the page color, which keeps adjacent
    frames distinguishable and flips correctly between the cream and near-black themes
  - In-bar labels pick dark or light ink per fill by contrast ratio and are drawn
    only when the name fits, so no label spills past its bar in either render
  - Depth row labels ("Depth 0 · root" … "Depth 6") read as stack depth, and no samples
    axis implies a time sequence
  - Native SVG <title> on every frame gives function, sample count and share on hover
    in the HTML view
  weaknesses:
  - 'SC-01 (both): the fill is a heat channel driven by each frame''s sample share
    (gradient legend "fewer Samples (0.4%)" → "more Samples (54.6%)" plus a separate
    root swatch), which re-encodes width and paints the hot path main → handle_business_logic
    → fetch_orders → db_query in red and orange, a highlighted hot path the basic
    variant excludes → assign the warm hues independently of the share (for example
    cycle or hash the function name over the amber/ochre/red stops) and drop the gradient
    legend and the root swatch. Likely cause: the u = (pct − minPct)/(maxPct − minPct)
    interpolation in the frames map (lines 212–222) and the heat-scale legend block
    (lines 312–325).'
  - 'CQ-01 (code): three helper functions, hexToRgb (lines 18–22), relLuminance and
    contrast (lines 200–210), sit beside the required FlameGraphCanvas component →
    inline them: hard-code the three warm stops as RGB triples and choose the label
    ink with one inline luminance expression. Likely cause: a general-purpose colour
    toolkit written for a two-ink choice.'
  - 'Suggestion: the share-driven ramp leaves about 90 % of the frames in nearly the
    same pale amber; once the colouring no longer encodes share, more hue variation
    between neighbours would make the upper rows easier to scan.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: bold dark title "flamegraph-basic · javascript · muix · anyplot.ai" centred at top, grey subtitle "11,380 Samples across 99 stack frames (59 leaf traces)", a horizontal gradient bar (pale amber → ochre → matte red) labelled "fewer Samples (0.4%)" / "more Samples (54.6%)" and a red swatch "main (root · 100% Samples)". Left column of right-aligned row labels "Depth 0 · root" to "Depth 6". All text dark and readable; no axes drawn.
      Data: seven rows of adjacent bars, root "main" full width in matte red at the bottom; handle_business_logic (red, white label) dominates depth 1, flanked by parse_request and write_response (ochre/amber); fetch_orders orange at depth 2; db_query, orm_hydrate, score_products at depth 3; pg_wait_result, poll_socket, epoll_wait tower up to depth 6. Most frames pale amber; siblings separated by thin cream strokes. Labels only on wide bars, dark ink on amber, white ink on red; none spills past its bar. Ragged top edge. No #009E73 — the spec asks for a warm palette.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title in light ink, subtitle, legend labels and depth labels in light grey; all readable, no dark-on-dark text.
      Data: frame fills, gradient and in-bar label inks identical to the light render; only the sibling separators flip to the near-black page color and stay visible.
      Legibility verdict: PASS
