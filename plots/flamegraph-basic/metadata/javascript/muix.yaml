review:
  strengths:
  - 'Directly and thoroughly addressed every weakness flagged in Attempt 1: expanded
    to 174 stack frames (well within the spec''s 50-500 range), switched to a warm
    amber->ochre->matte-red gradient built purely from Imprint anchors (#DDCC77/#BD8233/#AE3030),
    added an explicit hot-path outline plus caption, and enlarged the title fontsize
    formula.'
  - 'Genuine data storytelling: the dominant call chain gets a bold ink outline plus
    a plain-language caption naming the exact chain and its percentage of total samples,
    giving the viewer an immediate takeaway instead of forcing a bar-width comparison
    by eye.'
  - 'Theme-adaptive chrome is handled correctly and kept separate from the theme-invariant
    warm data gradient: the root frame and hot-path stroke use t.ink/t.pageBg (flip
    cleanly light/dark) while the amber-ochre-red frame colors stay identical between
    renders.'
  - Sample counts are internally consistent at every depth (each parent's samples
    exactly equal the sum of its children), exactly as a real profiler would report,
    and function-name labels only render when they actually fit the bar width.
  - Creative, idiomatic use of ChartContainer + useXScale/useYScale to hand-build
    a chart type the MUI X community package has no canned component for, rather than
    falling back to NOT_FEASIBLE.
  weaknesses:
  - Depth-row labels (DepthLabels) and the heat-legend text (HeatLegend) render at
    13px CSS, a touch under the library's recommended 14-16px floor for axis/legend
    text in JS libraries -- bump both to ~14px so they hold up better at mobile/thumbnail
    scale.
  - The title still fills only ~48% of canvas width at the new fontsize formula (title.length=50
    < 67 so the formula never scales up past its base 34px) -- comfortably within
    the non-overflow, non-squeezed safe zone so this is not a deduction, but there's
    headroom to grow it toward the 50-70% target for a bit more visual weight.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "flamegraph-basic · javascript · muix · anyplot.ai" centered at top; italic grey subtitle ("Simulated web-request CPU profile · 14,000 samples across 174 stack frames") below it; italic grey hot-path caption naming the dominant chain and its share; a two-part color-key legend (black "root" swatch + amber->ochre->red gradient bar labeled "fewer samples"/"more samples"); left-side "Depth N" row labels in soft grey. All chrome text renders in dark ink against the light background and is clearly legible.
      Data: Seven stacked rows of directly-adjacent rectangles in classic icicle/flame layout, root at the bottom. Root ("main") fills the full width in near-black with a cream label. Higher rows are colored on a continuous warm gradient (amber -> ochre -> matte red) keyed to each frame's share of total samples, so the hottest branches (handle_business_logic and its heaviest descendants) read distinctly redder than cooler siblings. The dominant hot-path frames carry a bold ink outline that visually traces the chain from root to leaf. Function-name labels appear inside bars wide enough to fit them; narrower bars correctly omit their label rather than clipping or rotating text.
      Legibility verdict: PASS -- all text (title, subtitle, caption, legend, depth labels, in-bar labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Identical title, subtitle, hot-path caption, legend and depth labels, now rendered in light ink / soft grey and fully legible -- no dark-on-dark failures anywhere.
      Data: The amber -> ochre -> matte-red gradient frame colors are pixel-identical to the light render (only chrome flipped, as required). The root frame correctly inverts to a light cream fill with a dark "main" label (theme-adaptive neutral anchor, matching the style guide's semantic "neutral" role for baseline/reference elements). The hot-path outline correctly switches to a light stroke so it still reads as an outline against the near-black frame fills.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no dark-on-dark or light-on-light failures found in either render.
