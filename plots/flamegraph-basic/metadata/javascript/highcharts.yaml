review:
  strengths:
  - 'Fixed the attempt-1 data-volume weakness: the folded-stack dataset now has 56
    unique stack traces (up from 13) with call chains up to depth 6 and multiple sibling
    branches (acceptConnections, routeRequest, backgroundJobs, logRequest), giving
    the flame graph real breadth and depth to demonstrate.'
  - Frame color now blends a log-scaled 'heat' signal (share of total samples) with
    a name hash, so wide/hot frames pull toward matte-red while same-share siblings
    stay visually distinct — a direct, well-executed response to the attempt-1 storytelling
    feedback.
  - 'Creative, correct flame-graph layout built from core Highcharts stacked bars
    (no flamegraph module loaded): folded-stack samples are correctly rolled up into
    own/total time, flattened depth-first, and padded with invisible spacer series
    so every deeper row stays aligned under its parent.'
  - Theme-adaptive chrome (background, title, subtitle, axis, tooltip) is fully correct
    in both renders; data colors are pixel-identical between light and dark; exact
    mandated title format; canvas is used efficiently with no edge clipping.
  - In-bar labels are correctly suppressed for frames too narrow to hold text, matching
    the spec's 'labels when the bar is wide enough' requirement.
  weaknesses:
  - 'Dark-on-dark data-label bug (VQ-01=0): in-bar dataLabels use a hardcoded style.color:
    ''#1A1A17'' (fixed dark ink, not theme-adaptive) on the assumption the label always
    sits fully inside the warm-colored bar fill. That assumption breaks whenever a
    label is wider than its bar box: the overflow spills into the adjacent transparent
    spacer/border area (borderColor: t.pageBg), which renders as the dark page background
    (#1A1A17) in dark theme — making the overflowing character(s) invisible against
    it. Confirmed in plot-dark.png at multiple frames: ''deserializeRow'' (depth 6)
    loses its leading ''d'', ''computeDiscounts'' (depth 4) loses the mid-word ''u''
    leaving a visible gap, ''markPhase'' (depth 3) loses its leading ''m'', and the
    same pattern affects ''parseHeaders'', ''tlsHandshake'', ''verifyToken'', ''jsonEncode'',
    and ''schemaCheck''. In plot-light.png the same overflow happens but stays legible
    because the spacer/border color is light there, which is why this passed attempt-1
    review undetected. Fix by either constraining/truncating labels to their box width
    (e.g. Highcharts dataLabels ''crop''/''overflow'' tuning or a stricter width-fraction
    gate before enabling a label), or making the label color theme-adaptive so it
    stays legible even where it bleeds past the fill into the spacer/border.'
  - The dataLabels.style.color code comment asserts the label 'sits on the warm data
    fill (constant across themes), not on the page background' — that assumption is
    what caused the bug above; the comment should be corrected once the underlying
    overflow issue is fixed.
  - 'CQ-01 (KISS) is still low: five recursive/helper functions (rollUp, padDown,
    walk, lerp, hash) are needed to rebuild the call tree and layout — likely close
    to unavoidable for a folded-stack flame graph with no native series type, but
    still far from the flat KISS ideal.'
  - The heat-based color blend is a nice touch but is highly correlated with bar width
    (both derive from the same 'share of total samples' signal), so it mostly reinforces
    rather than adds a genuinely new layer of insight beyond width alone.
  - The value/width axis (sample count / % of total) remains hidden with no visible
    axis title or tick values — the encoding is explained only via the subtitle text,
    not directly on the chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — correct, not pure white.
      Chrome: Bold dark title "flamegraph-basic · javascript · highcharts · anyplot.ai" and muted-grey subtitle explaining the width encoding are both clearly readable. The rotated "Call stack depth" axis title and "Depth 0 · root" through "Depth 6" row labels along the left edge are all legible in soft dark ink against the light background.
      Data: Seven stacked rows of horizontal bars (root at the bottom widening upward from leaves) in a warm amber → ochre → matte-red ramp, matching the spec's convention. In-bar function-name labels are dark ink, mostly readable, though several labels overflow slightly past their bar box into the adjacent light-colored border/spacer gap — legible here only because that gap happens to be light-colored in this theme.
      Legibility verdict: PASS (all text readable, though the overflow behavior described above is a latent issue that only becomes visible in dark mode).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — correct, not pure black.
      Chrome: Title, subtitle, axis title, and depth-row labels correctly flip to light ink and remain fully legible — no dark-on-dark chrome failures.
      Data: Bar colors and proportions are pixel-identical to the light render, confirming data colors don't shift with theme, as required.
      Legibility verdict: FAIL — several in-bar data labels are partially invisible. The label color is a hardcoded, non-theme-adaptive dark ink (#1A1A17) intended to sit only on the warm bar fill, but multiple labels are wider than their bar box and overflow into the adjacent transparent spacer/border area, which renders as the dark page background in this theme. Where the dark-ink text overlaps that dark area it becomes invisible: "deserializeRow" loses its leading "d" (reads "leserializeRow"), "computeDiscounts" loses the mid-word "u" (visible gap), "markPhase" loses its leading "m" (reads "arkPhase"), and the same pattern recurs on "parseHeaders", "tlsHandshake", "verifyToken", "jsonEncode", and "schemaCheck". This is a textbook dark-on-dark theme-adaptation failure per the review checklist.
