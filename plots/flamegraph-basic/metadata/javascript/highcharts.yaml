review:
  strengths:
  - 'Creative flame-graph layout implemented as a stacked-bar hack in core Highcharts
    (no native flamegraph module is loaded): the folded-stack samples are correctly
    rebuilt into a call tree with own/total rollup, then flattened depth-first into
    one series per frame with invisible spacer series keeping every deeper row aligned
    under its parent.'
  - Deterministic Imprint-anchored warm gradient (hash-interpolated between amber
    -> ochre -> matte-red) gives each function a distinct but on-brand warm hue, correctly
    applying the style guide's documented semantic-exception rule for domain-conventional
    flame-graph coloring.
  - 'Theme-adaptive chrome is fully correct: title, subtitle, axis labels, tick labels,
    and tooltip all use ANYPLOT_TOKENS, chart background is transparent so the page
    surface shows through, and both renders are readable with identical data colors
    across themes.'
  - Title format is exact (`flamegraph-basic · javascript · highcharts · anyplot.ai`),
    canvas usage is efficient with no clipping, and adjacent siblings at the same
    depth are tiled with minimal gaps (pointPadding 0.02, groupPadding 0) matching
    the spec's 'directly adjacent' requirement.
  - Function-name data labels are only shown once a frame exceeds ~2% of total width,
    correctly implementing the spec's 'labels inside bars when wide enough' rule.
  weaknesses:
  - Dataset has only 13 unique stack-trace rows (13 entries in `samples`), well below
    the spec's suggested 50-500 unique stack traces — the resulting flame graph is
    shallow (max depth 4) and doesn't fully exercise wide branching or deep nesting.
    Expand the `samples` array with more call paths and depth to better cover DQ-01
    (Feature Coverage).
  - Building the call tree from folded-stack input requires several nontrivial recursive
    helper functions (`rollUp`, `padDown`, `walk`, plus `lerp`/`hash` for coloring),
    which moves well past the 'Imports → Data → Plot → Save, no functions' KISS ideal.
    This is largely inherent to reconstructing a hierarchy from folded-stack data
    with no native flamegraph series available, but any simplification (e.g. precomputing
    the frame list as static data instead of deriving it at runtime) would help CQ-01.
  - Frame coloring is purely hash-based for visual differentiation and carries no
    semantic meaning — it doesn't highlight the hottest path beyond what bar width
    already communicates. Tying color intensity to per-frame sample share would add
    a genuine second layer of data storytelling (DE-03).
  - The value axis (sample-count / width encoding) has no visible title or unit —
    the plot relies entirely on the subtitle text ('bar width is share of total samples')
    to explain what width encodes. An explicit, even minimal, axis annotation would
    remove ambiguity for a reader who skips the subtitle.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "flamegraph-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top, subtitle in muted grey below it ("CPU profile of a request-handling call stack — bar width is share of total samples"). Vertical "Call stack depth" axis title along the left edge, with row category labels "Depth 0 · root" through "Depth 4" in dark grey. No visible value axis (intentionally hidden). All chrome text is clearly legible against the light surface.
      Data: Five stacked rows of adjacent horizontal bars, widest at the bottom ("main", full width) narrowing upward through routeRequest/handleApi/queryDatabase/executeQuery. Colors are a warm amber-to-ochre-to-matte-red ramp per function (e.g. acceptConnections/garbageCollect in burnt orange, tlsHandshake/handleApi/routeRequest in deep red, authMiddleware/executeQuery/queryDatabase in ochre-yellow). Function names are rendered as centered dark labels inside bars wide enough to hold them; narrow slivers (e.g. a thin bar next to serializeResponse) correctly have no label. First-series-must-be-#009E73 does not apply here — this is the documented semantic-exception case for the conventional warm flame-graph palette.
      Legibility verdict: PASS — all title, subtitle, axis, and in-bar text is clearly readable with no overlap or clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title now in white/light ink, subtitle in light grey, "Call stack depth" axis title and depth category labels in light grey — all legible against the dark surface. No dark-on-dark failures observed.
      Data: Identical warm amber/ochre/red palette and identical bar proportions to the light render — confirms data colors are constant across themes as required. In-bar labels remain fixed dark ink (#1A1A17) because they sit on the warm data fill (which doesn't change with theme), not on the page background — this reads correctly since the warm bar colors provide sufficient contrast for dark text in both renders.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; every label (title, subtitle, axis, in-bar) is clearly readable.
