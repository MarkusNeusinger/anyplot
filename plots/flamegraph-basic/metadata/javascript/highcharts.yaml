review:
  strengths:
  - 'Correct flame-graph semantics: root at the bottom, depth rows layered upward,
    sibling bars directly adjacent (pointPadding 0.02 / groupPadding 0), and function-name
    labels shown only inside bars wide enough to hold them.'
  - Documented, well-justified semantic-exception warm palette (amber → ochre → matte
    red) built exclusively from Imprint anchors — no custom hex values — matching
    the spec's explicit request for conventional flame-graph yellows/oranges/reds.
  - 'Distinctive Highcharts mastery: a chart.events.render hook measures each data
    label''s real getBBox() against its bar''s rendered box and hides any label that
    would overflow, correctly accounting for the transposed coordinate system of an
    inverted bar chart (width/height swap is explained in a comment).'
  - Theme-adaptive chrome is correctly threaded through title/subtitle/axis/tooltip
    via ANYPLOT_TOKENS, and the warm data colors are pixel-identical between the light
    and dark renders — only chrome flips.
  - 'Realistic, deterministic synthetic profiling data (63 folded-stack samples with
    correct exclusive/self-time semantics) that produces a legible hot-path story:
    the executeQuery → queryDatabase → handleApi → routeRequest → main chain visibly
    trends toward the hot end of the ramp.'
  weaknesses:
  - The fixed dark data-label ink (#1A1A17) sits at borderline WCAG contrast (~3.6:1)
    against the deepest matte-red frames (e.g. 'main', 'routeRequest', 'handleApi')
    — still legible in both renders, but a thin light stroke or lighter ink for high-heat
    frames would be safer.
  - No grid lines at all — acceptable for the flame-graph convention and not a deduction
    here, but worth confirming intentional rather than an oversight if this pattern
    recurs elsewhere.
  - The tree-build/rollup/color-interpolation helper functions (rollUp, walk, padDown,
    lerp, hash, warmColor) push CQ-01 (KISS) below the ideal 'no functions' bar —
    largely unavoidable for a folded-stack → hierarchical flame-graph transform, but
    flagged for completeness.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "flamegraph-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly
        readable. Subtitle in muted gray-brown, readable. Left-side "Depth 0 · root" .. "Depth 6" category
        labels in dark ink, all legible. Vertical "Call stack depth" axis title along the far left margin,
        readable. No grid lines. Thin vertical axis line at left only (L-shape convention adapted to the
        inverted/horizontal bar orientation).
      Data: Stacked horizontal bars per depth row, colored on a continuous amber → ochre → matte-red ramp
        (log-scaled sample share blended with a name hash for variety among same-share siblings). Root
        "main" spans full width at the bottom; call stack widens/narrows upward through depth 6. Function
        names ("main", "routeRequest", "handleApi", "queryDatabase", "executeQuery", "fetchRows",
        "acceptConnections", "backgroundJobs", "businessLogic") are labeled inside bars wide enough to hold
        them, in fixed dark ink (#1A1A17) — legible against every fill color, including the darkest
        matte-red frames, though contrast there is closer to borderline than generous. Narrower nested
        frames (e.g. under acceptConnections/backgroundJobs) are unlabeled, correctly, since they're too
        narrow for text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle now render in light ink/gray, clearly readable against the dark surface.
        "Depth" category labels and the vertical "Call stack depth" axis title are light-colored and
        legible. No dark-on-dark chrome anywhere.
      Data: Bar colors are pixel-identical to the light render (same amber/ochre/matte-red ramp per frame)
        — confirms only chrome flipped, not data colors. The fixed dark data-label ink still sits inside
        the warm fills (not on the near-black page background), so it remains legible exactly as in the
        light render — no dark-on-dark failure despite the ink color being constant across themes, since
        the label backdrop is always the warm bar fill, not the page surface.
      Legibility verdict: PASS
