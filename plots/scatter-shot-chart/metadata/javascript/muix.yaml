review:
  strengths:
  - 'Accurate NBA half-court geometry from named constants: 23.75 ft arc meeting 22
    ft corner lines at the computed break point, free-throw line 15 ft from the backboard,
    16 ft paint, 4 ft restricted arc with its straight segments to the backboard,
    9 in rim and 6 ft backboard, plus a free-throw circle that is solid toward half
    court and dashed inside the paint'
  - 'True 1:1 scale: one px-per-foot factor drives both the axis domains and the margins,
    so the rim, restricted area and three-point arc are circular and the court fills
    the square canvas'
  - 'Outcome is double-encoded (brand green filled circles for made, Imprint matte
    red #AE3030 crosses for missed), so the two outcomes separate under colour-vision
    deficiency and in both themes; made shots are drawn over missed ones'
  - 'Idiomatic MUI X composition: ChartsContainer with invisible linear axes and custom
    SVG layers that read positions through useXScale/useYScale, so every shot sits
    exactly at its court coordinates'
  - Court lines in the theme's inkSoft token with a weight hierarchy (2 px lines,
    2.5 px boundary, 4 px backboard) keep the markers dominant in both renders
  weaknesses:
  - 'Suggestion: render the shots as native MUI X scatter series inside the ChartsContainer
    so the HTML view gets per-shot tooltips (coordinates, shot type, outcome) and
    a ChartsLegend instead of the hand-built HTML legend band.'
  - 'Suggestion: the 2-pointer (4.5 px) and free-throw (6 px) marker radii are close;
    a wider size step would make the shot-type encoding easier to read away from the
    free-throw pile.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas.
      Chrome: centered bold title "scatter-shot-chart · javascript · muix · anyplot.ai" (~42% of width) in dark ink, a soft-ink subtitle with totals (300 attempts, 145 made, 48.3%; 2-pointer 68/147, free-throw 36/47, 3-pointer 41/106), and a bottom legend band: green circle "Made", red cross "Missed", then "Shot type (marker size):" with three gray circles of increasing size for 2-pointer, free-throw, 3-pointer. No axes (permitted). All text dark on light and clearly readable.
      Data: half court drawn in a dark gray line (boundary, paint, free-throw circle solid/dashed halves, restricted arc, rim, thick backboard, three-point arc with straight corner segments) with the basket at the bottom. Made shots are #009E73 filled circles, missed are #AE3030 crosses at 0.8 opacity. Clusters at the rim, a pile at the free-throw spot, scattered mid-range, corner threes along both sidelines and arc threes just beyond the line; the far half toward half court is empty.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and "Shot type" legend label in light-gray soft ink, court lines flip to light gray; no dark-on-dark text anywhere, every label readable.
      Data: green circles and red crosses identical in hue, position and size to the light render; only chrome flipped. Brand green stays vivid, the matte red crosses remain clearly visible against the dark surface.
      Legibility verdict: PASS
