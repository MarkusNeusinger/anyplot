review:
  strengths:
  - 'Made shots in Imprint green #009E73 as filled circles and missed shots in #AE3030
    as X marks, so outcome reads by shape and color in both themes'
  - 'Theme-variant hardwood court surface (#E8DCC8 light, #2A2318 dark) with warm-gray
    court lines keeps the markers in front of the court'
  - The three-point arc now meets the corner sidelines at x = ±22 and is closer to
    the basket in the corners than at the top
  - coord_fixed(ratio=1) keeps the rim and arcs circular, and the one-panel gggrid
    paints the canvas edges in the page color
  - layer_tooltips gives each shot a result, shot type, zone and position tooltip
    in the HTML output
  - geom_density2d contours of the made shots show the hot zone around the rim
  weaknesses:
  - 'SC-02 (both): the court elements use inconsistent origins: the baseline is drawn
    at y = -2, while the paint and corner sidelines start at y = 0 and float 2 ft
    above it; the paint top is at y = 19 while the free-throw circle is centred at
    y = 15, so the free-throw line cuts the circle 4 ft above its diameter; the three-point
    and restricted-area arcs are centred at (0, 0) while the rim is at (0, 1.25) →
    put every element in one frame with the basket at the origin: baseline at y =
    -5.25, backboard at y = -1.25, paint from the baseline to the free-throw line
    at y = 13.75, free-throw circle centred on that line, arcs centred on the rim.
    Likely cause: court_rect ymin=-2, paint_rect ymin=0/ymax=19 and FREE_THROW_Y=15
    measured from different references.'
  - 'VQ-02 (both): the zone labels are drawn without a box over court lines and shots:
    ''Mid-Range 45% (147)'' sits on the three-point arc and left-wing shots, ''Corner
    3 31% (29)'' covers the left-corner shots and sideline, ''Paint 51% (86)'' covers
    the right-corner shots, ''3PT'' sits on contour lines and markers → labels that
    hide no marks or lines (a smaller size, or a translucent box via geom_label).
    Likely cause: geom_text ignores fill/label_padding, so ANNOTATION_BG never draws,
    and size=10 makes each label about 4 ft tall in court units.'
  - 'VQ-01, VQ-05 (both): the annotation text dwarfs the title: the FG summary at
    size=13 mm (about 37 pt) and the zone labels at 10 mm (about 28 pt) are about
    twice the 16 px title, against the library rule of about 3-5 mm for annotations
    → 4-6 mm (about -6 mm). Likely cause: geom_text size=10 and size=13.'
  - 'VQ-05 (both): an empty band of about 170 px separates the title from the court''s
    top edge, and the court spans only about 68 % of the canvas width → a court that
    fills more of the canvas with the title close above it. Likely cause: plot_margin=[30,
    15, 10, 15] plus ylim(-10, 49) with PAD_BOTTOM=10 reserving room below the court.'
  - 'VQ-03 (dark): missed shots as #AE3030 X marks at alpha 0.5 with stroke 0.3 read
    faint on the #2A2318 court, and the legend glyphs are drawn opaque while the court
    marks are at alpha 0.5 → legend glyphs at the marks'' alpha and missed marks at
    a higher alpha or stroke (about +0.2 alpha). Likely cause: alpha=0.5 on the shot
    layer only, stroke=0.3.'
  - 'SC-04 (both): the green density contours over the court carry no key, so a reader
    cannot tell that they show the density of made shots → a legend entry or a short
    direct note for the contours. Likely cause: geom_density2d(show_legend=False)
    with the hand-built legend listing only Made and Missed.'
  - 'DQ-03 (both): the zone labels sit in the wrong zones: ''Paint'' is placed at
    (17.5, 3.5) in the right corner outside the paint, and ''Mid-Range'' at (-20,
    15), 25 ft from the basket and so beyond the 23.75 ft arc in three-point territory
    → each label inside the zone it counts. Also the Corner 3 rule uses y < 14 while
    the drawn corner lines end at y = 8.95. Likely cause: ZONE_LABEL_POS values and
    CORNER_THREE_TOP=14.'
  - 'Suggestion: drop the fill, label_padding and label_size arguments from geom_text,
    which have no visible effect, or switch to geom_label where they do.'
  - 'Suggestion: a native scale_color_manual/scale_shape_manual legend would replace
    the hand-placed legend points and text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page across the full 2400x2400 canvas, edges included; tan hardwood court #E8DCC8 with a warm-gray outline.
      Chrome: bold dark title 'scatter-shot-chart · python · letsplot · anyplot.ai' at the top (about 73 % of the width); large bold 'FG: 43.4% · 152/350' inside the top of the court; bold zone labels '3PT 29% (76)', 'Mid-Range 45% (147)', 'Corner 3 31% (29)', 'Paint 51% (86)'; legend 'Made (152)' / 'Missed (198)' in soft gray below the court. No axes. All text readable.
      Data: made shots as #009E73 filled circles, missed as #AE3030 X marks, both alpha 0.5; translucent green density contours around the rim. Court lines: full three-point arc joining the corner sidelines, paint, free-throw circle (solid top, dashed bottom), restricted arc, rim and backboard. The paint top cuts the free-throw circle above its diameter, and the paint and corner lines stop 2 ft short of the baseline. Zone labels sit over court lines and shots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page, edges included; dark brown court #2A2318 with a light warm-gray outline.
      Chrome: title, FG summary and zone labels in light #F0EFE8, legend text in #B8B7B0; no dark-on-dark text.
      Data: identical #009E73 and #AE3030 to the light render; the missed X marks read faint on the dark court, and the green contours are barely visible. Same geometry and label overlaps as light.
      Legibility verdict: PASS
