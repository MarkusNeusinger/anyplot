review:
  strengths:
  - 'Court geometry in one frame with the basket at the origin: baseline at -5.25
    ft, backboard at -1.25 ft, 16 ft paint up to the free-throw line at 13.75 ft with
    the free-throw circle centred on it, three-point arc meeting the ±22 ft corner
    lines at y ≈ 8.95'
  - 'Made shots as #009E73 circles and missed shots as #AE3030 X marks at alpha 0.7,
    so outcome reads by shape and color in both themes'
  - 'Theme-variant hardwood court (#E8DCC8 light, #2A2318 dark) with warm-gray lines
    keeps the markers in front of the court'
  - coord_fixed(ratio=1) keeps the rim and arcs circular, and the one-panel gggrid
    paints the canvas edges in the page color
  - layer_tooltips gives each shot a result, shot type, zone and position tooltip
    in the HTML output
  - Legend glyphs match the court marks in size, stroke and alpha
  weaknesses:
  - 'VQ-02 (both): the left corner sideline at x = -22 runs straight through the ''Corner
    3 26% (23)'' label (between ''C'' and ''o'' and between ''2'' and ''6''), and
    the made-shot density contours cross the ''Mid-Range'' and ''Paint'' labels →
    each zone label on clear floor, e.g. ''Corner 3'' centred between the sideline
    and the corner line at x ≈ -23.5 or with a smaller size so it fits the 3 ft corner
    strip. Likely cause: ZONE_LABEL_POS[''Corner 3''] = (-21.0, -3.1) puts the text
    centre 1 ft inside the corner line.'
  - 'VQ-03 (dark): the made-shot density contours at alpha 0.3 in #009E73 almost vanish
    on the #2A2318 court, and the ''Made-shot density'' legend line reads dark green
    → a theme-dependent contour alpha (about 0.5 on dark, +0.2). Likely cause: geom_density2d(alpha=0.3)
    for both themes.'
  - 'DQ-03 (both): the headline ''FG: 43.7% · 153/350'' and the shot count include
    the 10 free throws, but field-goal percentage excludes free throws → compute FG%
    over 2- and 3-pointers only (about 340 attempts). Likely cause: fg_percent = n_made
    / n_shots over every row.'
  - 'Suggestion: a native scale_color_manual/scale_shape_manual legend would replace
    the hand-placed legend points, segment and text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, edges included; tan hardwood court #E8DCC8 with a warm-gray #5A5048 outline.
      Chrome: bold dark title 'scatter-shot-chart · python · letsplot · anyplot.ai' at the top (about 73 % of the width); bold 'FG: 43.7% · 153/350' inside the top of the court; bold zone labels '3PT 31% (81)' above the arc, 'Mid-Range 45% (149)' on the left wing inside the arc, 'Corner 3 26% (23)' in the left corner, 'Paint 51% (86)' behind the backboard; a legend band below the baseline with 'Made (153)', 'Missed (197)' and 'Made-shot density' in soft gray. No axes. All text readable; the left corner sideline runs through the 'Corner 3' label and contours cross 'Mid-Range' and 'Paint'.
      Data: made shots as #009E73 circles, missed as #AE3030 X marks, alpha 0.7; translucent green made-shot density contours. Court: baseline, 16 ft paint up to the free-throw line, free-throw circle centred on that line (solid top, dashed bottom), three-point arc meeting the corner lines at x = ±22, restricted arc, rim and backboard, all in one frame.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page, edges included; dark brown court #2A2318 with a light warm-gray #8A7E72 outline.
      Chrome: title, FG summary and zone labels in light #F0EFE8, legend text in #B8B7B0; no dark-on-dark text.
      Data: the same #009E73 and #AE3030 as the light render; markers read clearly on the dark court, but the green density contours at alpha 0.3 are barely visible and the 'Made-shot density' legend line reads dark green. Same geometry and label collisions as light.
      Legibility verdict: PASS
