review:
  strengths:
  - Uses bokeh's native Whisker with TeeHead caps at level='overlay', so every error
    bar stands out over the bar end in ink color in both themes
  - Tidy df through ColumnDataSource with column-name constants that also title the
    axes
  - Categories sorted by value and a '±1 standard deviation' annotation name what
    the error bars show
  - Theme tokens thread through every chrome element; both renders fully legible
  weaknesses:
  - 'Suggestion: the error-bar annotation could sit closer to the data it explains,
    for example just above the tallest bar''s cap.'
  - 'Suggestion: a HoverTool showing value and ±SD per bar would add value in the
    HTML view.'
