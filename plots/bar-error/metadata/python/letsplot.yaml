    bars in INK_SOFT stand out against bars and page in both renders
  - 'Adaptable-code layout: role-tagged column constants and a Plot block that reads
    only df'
  - Caption names what the error bars represent (95% confidence interval)
  weaknesses:
  - 'DE-02 (both): all four panel borders are drawn as a full frame around the plot
    area where nothing requires them → L-shaped frame (left and bottom axis lines
    only) or none. Likely cause: the default panel border of the lets-plot theme was
    not removed (panel_border=element_blank() plus axis_line=element_line(color=INK_SOFT)).'
  - 'Suggestion: the bar outlines render pure white, prominent on the dark background;
    an outline in PAGE_BG or none would keep the chrome theme-adaptive.'
