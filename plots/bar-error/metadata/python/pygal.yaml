review:
  strengths:
  - 'Uses pygal''s native per-value confidence-interval dict ({''value'', ''ci'':
    {''low'', ''high''}}), so the error bars come from the library''s own capped .ci
    rendering rather than hand-drawn lines, and the HTML tooltips carry the interval
    as well'
  - Value axis starts at zero and the range runs to 1.15× the highest upper bound,
    so every bar is proportional and every error bar shows in full
  - Error bars are stroked with the INK token and read clearly against the green bars
    and the page in both themes; caps are visible at both ends
  - Control group comes first, then Treatments A–D in their natural order; one bar
    width with even gaps
  - The legend entry 'Mean ± 1 SD (error bars)' names what the error bars represent
  - 'Theme tokens are applied to the background, title, axis titles and tick labels;
    the single series is Imprint #009E73 in both renders'
  weaknesses:
  - 'VQ-07 (both): the grid lines do not follow the theme. The rgba() RULE token is
    not honored in the PNG, and the guides render as translucent black: about #A19F9B
    on the light page (roughly 38 % ink instead of the 15 % rule, too strong) and
    #11110F on the dark page, darker than the #1A1A17 background where they should
    be a light 15 % rule → light about #D9D7D1, dark about #3A3A36. Likely cause:
    foreground_subtle=RULE passed as an rgba() string, which cairosvg renders as black;
    use a pre-blended solid hex per theme.'
  - 'Suggestion: the gap between the x tick labels and the ''Treatment Group'' title,
    plus the legend far below at the lower left, leave a wide empty band; a smaller
    margin_bottom or a legend nearer the axis would tighten the layout.'
  - 'Suggestion: the legend swatch is a tiny square next to 44 px legend text; a larger
    legend_box_size would balance the entry.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (pixel-checked), not pure white.
      Chrome: title "bar-error · python · pygal · anyplot.ai" centered at the top (~38 % of width); y-axis title "Response Value (units)" rotated, x-axis title "Treatment Group"; ticks 0–100 in steps of 10 and five category labels, all in dark ink and clearly readable. Horizontal y-guides only, but rendered as medium grey (#A19F9B), stronger than the 15 % rule.
      Data: five #009E73 bars from a zero baseline (Control 45.2, Treatment A 62.8, B 78.3, C 55.1, D 71.5), each with a thin dark ±1 SD error bar with caps at both ends. Legend at the bottom left: green swatch with "Mean ± 1 SD (error bars)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (pixel-checked), not pure black.
      Chrome: same layout; title, axis titles, ticks and the legend text in light ink (#F0EFE8) and fully readable; no dark-on-dark text. The y-guides render as #11110F, darker than the background, so they barely show and run in the wrong direction for the theme.
      Data: bars in the same #009E73 as the light render; error bars flip to light ink and stand out against the bars and the page. Brand green clearly visible.
      Legibility verdict: PASS (text); grid chrome not theme-correct
