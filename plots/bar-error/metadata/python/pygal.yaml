review:
  strengths:
  - Error bars use pygal's native per-value `ci` dict ({low, high}) instead of hand-drawn
    lines, so the bars and error bars come from one series and the HTML tooltip carries
    the interval
  - 'Theme tokens threaded through the Style object: page #FAF8F1/#1A1A17, INK text,
    and a rule color pre-blended onto the page because cairosvg drops rgba alpha;
    error bars stroke with foreground and read dark on light and light on dark'
  - Value axis starts at zero and spans every error bar in full (range 0 to 1.15 ×
    the highest mean+SD); categories in natural order with Control first
  - Legend label names what the error bars represent (Mean ± 1 SD), meeting the spec's
    annotation requirement
  - Single series in Imprint position 1 (#009E73), identical in both renders
  weaknesses:
  - 'VQ-03 (both): the error-bar caps are only about 16 px wide on bars about 400
    px wide, and the error stroke is thin (about 3 px), so the caps nearly vanish
    in the 400 px thumbnail; the legend swatch is a ~16 px square next to 44 px text
    → caps and stroke about 2× larger (caps ≥ 40 px, stroke about 5–6 px) and a legend
    box sized to the legend text. Likely cause: pygal''s default .ci cap width and
    stroke from the stylesheet, and legend_box_size left at its default.'
  - 'VQ-06 (both): the y-axis title reads ''Response Value (units)'', and ''(units)''
    is a placeholder, not a unit → a real unit for the measured quantity (e.g. ''Mean
    blood glucose (mg/dL)''). Likely cause: the RESPONSE and SD column constants.'
  - 'DQ-02 (both): the groups are ''Treatment A''–''Treatment D'' with an unnamed
    response, which reads as a generic placeholder scenario → named treatments and
    a named measured quantity (e.g. drug doses or fertilizer types with their response).
    Likely cause: the GROUP labels in the Data block.'
  - 'Suggestion: the legend sits alone in the bottom-left corner below a wide gap
    under the x-axis title; tightening margin_bottom or moving it closer would balance
    the whitespace.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and the plot area.
      Chrome: title "bar-error · python · pygal · anyplot.ai" centred at the top (about 38 % of the width), y-axis title "Response Value (units)" rotated on the left, x-axis title "Treatment Group" below, tick labels 0–100 in steps of 10 and the five category names; all dark ink, all readable. Subtle light-grey horizontal guides, no vertical guides.
      Data: five #009E73 bars (Control 45.2, Treatment A 62.8, B 78.3, C 55.1, D 71.5) from a zero baseline with even gaps; dark-grey symmetric error bars (±1 SD) through each bar end with small caps at both ends; the upper arms run above the bars, the lower arms over the green fill. Legend at the bottom-left: a small green square with "Mean ± 1 SD (error bars)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
