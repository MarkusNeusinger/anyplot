review:
  strengths:
  - 'Error bars drawn with the native geom_errorbar from computed lower/upper columns,
    colored from the INK token so they stand out against the #009E73 bars and the
    page in both themes, with clearly visible caps of one width'
  - Categories ordered by value through scale_x_discrete(limits=order), and the y-axis
    starts at a zero baseline with expand=(0, 0, 0.06, 0) so bars sit directly on
    the axis line and every error bar fits in full
  - 'The italic, muted caption ''Error bars: ± 95% CI half-width'' names what the
    error bars represent, built from the column constant so it stays correct when
    the data is swapped'
  - Realistic customer-satisfaction survey scenario on a 1–5 scale with plausible
    means (3.5–4.5) and varying CI half-widths (0.2–0.5)
  - 'Clean six-zone script: theme tokens, column constants, data block, one ggplot
    chain, save; all imports used'
  weaknesses:
  - 'Suggestion: the value axis tops out near 4.98 with its last tick at 4; ending
    the axis at the scale maximum of 5 with a tick there would anchor the 1–5 satisfaction
    scale for the reader.'
  - 'Suggestion: the caption wording ''± 95% CI half-width'' could read more naturally
    as ''Error bars: 95% confidence interval''.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, landscape 3200x1800.
      Chrome: bold near-black title "bar-error · python · plotnine · anyplot.ai" centered at the top (~47% of width); y-axis title "Satisfaction score (1–5)", x-axis title "Survey category" in dark ink; soft-gray tick labels 0–4 and six category names; subtle horizontal-only grid; a single baseline axis line; italic muted caption "Error bars: ± 95% CI half-width" bottom right. All text readable.
      Data: six bars in brand green #009E73 sorted descending (Delivery Speed 4.5, Return Policy 4.3, Product Quality 4.2, Website UX 4.0, Customer Service 3.8, Price Value 3.5), each with a near-black error bar through the bar end and wide caps at both ends; bar widths equal, gaps even.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
