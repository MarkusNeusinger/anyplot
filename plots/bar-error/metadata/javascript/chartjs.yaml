review:
  strengths:
  - Implements error bars via Chart.js's native plugin API (afterDatasetsDraw) instead
    of an unsupported community error-bar plugin — idiomatic and correct per the library's
    'No Workarounds' rule.
  - Error bar stroke color reads from t.ink, so caps/whiskers render dark on the light
    background and light on the dark background — fully theme-adaptive and clearly
    legible in both renders.
  - 'Correct Imprint palette usage (brand green #009E73 for the single series) and
    correct warm off-white/near-black plot backgrounds in both themes.'
  - Subtitle proactively explains the error metric ('Error bars show ±1 standard deviation
    across replicate plots'), satisfying the spec's request for an annotation explaining
    the error bars.
  - Sensible, story-driven data ordering (Control → single nutrients → combined treatments)
    that reads as a clear agronomic narrative culminating in the tallest NPK Combined
    bar.
  weaknesses:
  - All bars share the same flat green with no emphasis on the top-performing treatment
    (NPK Combined) — a highlight color, bold outline, or callout on the best result
    would sharpen the storytelling focal point (DE-03).
  - 'Bars have no edge definition (borderWidth: 0) — the style guide suggests a subtle
    white/darker bar edge for definition, which would add a touch more polish (DE-02).'
  - The custom error-bar plugin is the only distinctive Chart.js technique used; e.g.
    a small data-label or tooltip callout on the max value could deepen library mastery
    further (LM-02).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-error · javascript · chartjs · anyplot.ai" in dark ink, centered top; subtitle "Error bars show ±1 standard deviation across replicate plots" in softer gray beneath it. Y-axis title "Plant Height (cm)" (rotated) and X-axis title "Fertilizer Treatment" both in dark ink. Tick labels in a softer gray. Y-axis gridlines are thin and subtle; X-axis has no gridlines. All text is clearly legible against the light background — no light-on-light issues.
      Data: 6 vertical bars (Control, Nitrogen, Phosphorus, Potassium, N+P, NPK Combined) in the Imprint brand green (#009E73), rising in height from Control (~24.5) to NPK Combined (~39.8). Each bar has a black error-bar whisker with horizontal caps at top and bottom, showing ±1 SD. First (only) series correctly uses palette[0].
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-title/tick-label layout, now rendered in light ink/soft-gray tones. Gridlines remain thin and subtle against the dark surface. All text is clearly legible — no dark-on-dark failures observed anywhere (title, axis titles, and tick labels all read cleanly).
      Data: Bars are the identical Imprint brand green (#009E73) as the light render — confirming data colors stay constant across themes. Error-bar whiskers and caps switch to white/light ink so they remain fully visible against the dark bars and background (a correct theme-adaptive choice, since the light render's black whiskers would disappear on dark).
      Legibility verdict: PASS.
