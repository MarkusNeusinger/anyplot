review:
  strengths:
  - 'Clever, well-documented workaround for missing highcharts-more: renders error
    bars (whisker + top/bottom caps) via a null-gap line series, respecting the core-bundle-only
    constraint while still delivering the spec-required visible caps'
  - Correct Imprint palette and full light/dark theme threading (background, ink,
    inkSoft, grid) with identical bar and error-bar colors across both renders
  - Realistic, appropriately-scaled dataset (enzyme activity assay across 6 treatment
    groups) with sensible mean/SD magnitudes
  - Subtitle clearly states what the error bars represent ("±1 standard deviation"),
    satisfying the spec's annotation requirement without a redundant legend for a
    single series
  - Y-axis headroom (0-85) comfortably fits the tallest error bar with no clipping
    or overlap in either theme
  weaknesses:
  - 'Design excellence is generic: bars and chrome use only the required baseline
    theming with no additional visual hierarchy or refinement (e.g., emphasis on the
    standout group, subtle bar corner radius, or refined cap width tuning)'
  - Only symmetric error bars are demonstrated; the spec's asymmetric (lower, upper)
    error-bar branch is unexercised (not required, but would show more feature breadth)
  - No data-storytelling emphasis on the notable result (Drug B has the highest mean)
    — a missed opportunity to guide the viewer's eye
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bar-error · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Error bars show ±1 standard deviation" in softer gray beneath it, y-axis title "Enzyme Activity (U/mg)" rotated on the left, x-axis category labels (Control, Drug A-E) along the bottom, horizontal gridlines at every 5 units. All fully visible and unclipped.
      Data: 6 green (#009E73) column bars for Control through Drug E, each topped with a dark-gray whisker + horizontal caps showing ±1 SD. First (and only) series correctly uses the brand green.
      Legibility verdict: PASS — title, subtitle, axis titles, tick labels, and category labels are all clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-title/tick-label layout, now rendered in light ink/inkSoft tones; gridlines are subtle light-gray on the dark surface.
      Data: identical green (#009E73) bars and error-bar geometry as the light render — only the whisker/cap color shifts to a lighter gray (inkSoft) appropriate for the dark chrome, confirming data colors are unchanged between themes.
      Legibility verdict: PASS — all text (title, subtitle, axis titles, tick labels, category labels) is clearly legible light-on-dark; no dark-on-dark failures observed.
