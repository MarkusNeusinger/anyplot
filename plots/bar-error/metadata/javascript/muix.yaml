review:
  strengths:
  - Custom ErrorBars component reads useXScale/useYScale directly from the chart's
    internal scale functions to draw whiskers and caps — an idiomatic MUI X composition-API
    pattern that keeps the overlay pixel-accurate to the bars.
  - The subtitle explicitly states the error convention ("Error bars show ±1 SD across
    ~150 respondents per channel"), satisfying the spec's requirement for a legend/annotation
    explaining the error bars without cluttering the chart.
  - Vertical-only grid is correctly aligned to the value axis for the horizontal orientation,
    paired with rounded bar corners and generous margins (110/90/190/90) for a polished,
    uncluttered layout.
  - Both renders keep identical data colors (#009E73 bars, ink-toned whiskers) with
    fully theme-adaptive chrome (backgrounds, text, grid) — no legibility issues in
    either theme.
  - Horizontal layout is a well-justified choice given the longer channel labels ("Self-Service",
    "Social Media"), keeping them on a single unrotated line as the spec suggests.
  - Title fontsize is computed from the mandated-title length via a linear scaling
    formula, avoiding overflow for the descriptive-prefixed title.
  weaknesses:
  - Bars are left in input order and share a single uniform green with no visual emphasis
    on the best/worst-performing channel — DE-03 stays at default since the viewer
    must find the ranking themselves rather than being guided to an insight (e.g.
    sorting by value, or a subtle marker/annotation on the top or bottom performer).
  - All five error magnitudes are symmetric ±SD values; an asymmetric pair on at least
    one category would more fully demonstrate the spec's optional asymmetric-error-bar
    feature (not required, so not scored down elsewhere, but would strengthen DQ-01
    feature coverage on a future pass).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Customer Satisfaction by Support Channel · bar-error · javascript · muix · anyplot.ai" in bold dark ink, centered top; italic subtitle "Error bars show ±1 SD across ~150 respondents per channel" beneath it. X-axis label "Mean Satisfaction Score (0–10)" and tick labels (0.0–10.0 in 0.5 steps) in soft dark gray. Y-axis category labels (Email, Live Chat, Phone, Self-Service, Social Media) fully visible, unrotated, not clipped. Subtle vertical gridlines aligned to the value axis. All text clearly readable against the light background.
      Data: Five horizontal bars in brand green (#009E73) with rounded corners, each with a horizontal whisker line and vertical end-caps in dark ink at ~0.75 opacity, clearly distinguishable from the bar fill and background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis labels/tick labels now rendered in light ink (title bright, subtitle/ticks softer light gray) — fully legible against the dark background. Vertical gridlines are still subtle and visible. Y-axis category labels unrotated and fully visible.
      Data: Same five green (#009E73) bars — identical hue to the light render — with whisker lines now rendered in a light gray (theme-adaptive ink) that reads clearly against the green fill and dark background. No dark-on-dark or hard-to-read elements found.
      Legibility verdict: PASS
