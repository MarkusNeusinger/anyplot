review:
  strengths:
  - Error bars drawn as a custom layer through useXScale/useYScale, so every whisker
    and cap sits exactly at value ± SD in the chart's own scales
  - Error-bar stroke uses the ink token, so it flips black/white with the theme and
    stands out against both the green bars and the page
  - Categories sorted by mean descending on horizontal bars from a zero baseline;
    value axis 0–10 spans every error bar
  - Header legend explicitly names the error bars as 'Standard deviation (±1 SD)'
    with a capped-whisker glyph matching the marks
  - Semibold 'mean ± SD' labels beside each upper cap give exact values without crowding
    five bars
  weaknesses:
  - 'Suggestion: the y-axis band (width 140) leaves about 100 px between the ''Support
    channel'' title and the tick labels; a narrower band would tighten the left edge.'
  - 'Suggestion: tick marks every 0.5 on a 0–10 scale give 21 labels and grid lines;
    a step of 1 would read calmer.'
  - 'Suggestion: the bar swatch could come from the native ChartsLegend inside ChartsWrapper,
    keeping only the error-bar glyph hand-drawn.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: centered bold title "bar-error · javascript · muix · anyplot.ai", subtitle "Support channel: 5 · Respondents per channel: 150", header legend (green swatch "Mean satisfaction score (0–10)", capped-whisker glyph "Standard deviation (±1 SD)"). X axis 0–10 in 0.5 steps titled "Mean satisfaction score (0–10)"; y axis "Support channel" with Live Chat, Phone, Email, Social Media, Self-Service. Dark text throughout, subtle vertical grid. All readable.
      Data: five horizontal #009E73 bars from zero, sorted descending (8.4, 7.8, 7.2, 6.9, 6.5), each with a near-black 3px error bar and caps through the bar end, labelled "8.4 ± 0.6" … "6.5 ± 1.1" right of the upper cap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: same layout; title, axis titles, ticks, subtitle and legend in light text; grid subtle dark gray. No dark-on-dark text.
      Data: bars identical #009E73; error bars and legend glyph flip to light ink and remain clearly visible over green and page.
      Legibility verdict: PASS
