review:
  strengths:
  - Correct, idiomatic implementation of error-bar whiskers via an ECharts custom
    series with renderItem — precise coordinate mapping via api.coord, with visible
    caps on both ends as required by the spec.
  - Theme-adaptive error-bar stroke color (t.ink) correctly flips from black to white
    between light and dark renders while the bar fill color (palette[0] green) stays
    pixel-identical — exactly matches the Imprint theme contract.
  - The added markLine average-yield reference directly addresses the prior review's
    DE-03 weakness, giving the chart a genuine focal point (viewers can see which
    treatments beat the mean) instead of six flat, unranked bars.
  - The subtitle '±1 standard deviation (n = 30 plots per treatment)' satisfies the
    spec's requirement to explain what the error bars represent, without cluttering
    the chart with a legend for what is effectively a single data series.
  - 'Clean chrome: y-axis line/ticks removed, gridlines subtle and horizontal-only,
    generous y-axis headroom (~15%) so error-bar caps never crowd the top gridline.'
  weaknesses:
  - 'The new markLine average label (''Average: 23.83 kg'', position: insideEndTop)
    lands directly on top of the rightmost (Compost) bar and its error-bar whisker
    — the whisker''s vertical line runs immediately against the left edge of the text,
    and the dashed average line crosses straight through the middle of the label instead
    of sitting cleanly above or below it. Move the label to a clear zone, e.g. position:
    ''start'' near the Control bar (which has the most headroom above its bar/whisker),
    or place it outside the plot area via markLine label position ''end'' with an
    offset, so it no longer collides with bar fill or whisker geometry.'
  - 'Design Excellence is still mid-pack: every bar carries the same flat green with
    the average line as the only hierarchy device — no additional distinctive ECharts
    touch (e.g. emphasis styling on the best-performing treatment, or a markArea band
    for a target range) beyond that one addition.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bar-error · javascript · echarts · anyplot.ai" centered at top in dark ink, subtitle "Error bars represent ±1 standard deviation (n = 30 plots per treatment)" below it in a softer gray. Y-axis label "Yield (kg per plot)" and x-axis label "Treatment" both present with units. Six category tick labels (Control, Nitrogen, Phosphorus, Potassium, N+P+K, Compost) all legible. Horizontal gridlines are subtle light gray. A new dashed average-yield reference line crosses the plot with the label "Average: 23.83 kg" — the label sits on top of the Compost bar and its error-bar whisker crosses directly through the text, a real overlap (see weaknesses).
      Data: Six green (#009E73) bars of equal width, each topped with a black error-bar whisker (horizontal caps at top and bottom, vertical connecting line). Bar heights and error magnitudes vary sensibly by treatment (Control lowest ~18.4, N+P+K highest ~29.6).
      Legibility verdict: PASS (all chrome text readable; the average label text itself is legible despite overlapping the bar/whisker, so this is an overlap/design issue rather than a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle now in light/off-white ink, axis labels and tick labels rendered in light gray, clearly visible against the dark background. Gridlines subtle but visible. The same average-label overlap with the Compost bar/whisker reproduces identically in this render.
      Data: Bars remain the identical #009E73 green as the light render (confirmed pixel-matched hue) with error-bar whiskers now rendered in white/light stroke instead of black — correct theme adaptation of the chrome element while data color stayed fixed.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; same overlap issue as the light render, not a legibility failure.
