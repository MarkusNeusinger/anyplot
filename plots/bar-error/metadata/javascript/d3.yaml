review:
  strengths:
  - Error bars have clear stem + cap construction via nested D3 data joins (selectAll('.cap').data(d
    => [...]).join()), producing crisp, consistently styled whiskers across all five
    bars
  - 'Data storytelling: the peak bar (400°C) is called out with a triangle marker,
    ''Peak'' label, and a bolded x-axis tick label — the viewer immediately sees the
    insight without needing to compare all five bars manually'
  - 'Explicit annotation (''Error bars: ±1 SD (n = 20 samples per group)'') satisfies
    the spec''s requirement to explain what the error bars represent'
  - All font sizes are explicitly set (16px ticks, 18px axis labels, 30px title, 14-15px
    annotations), and both light and dark renders are fully legible with correctly
    flipped chrome
  - Realistic, neutral materials-science scenario (tensile strength vs. annealing
    temperature) with plausible SD magnitudes and a physically sensible peak-then-decline
    curve
  weaknesses:
  - Title occupies only ~32% of canvas width at 30px — noticeably smaller than the
    ~50-70% typical range for a custom-length title; a modest fontsize bump would
    give the title more visual presence without risking overflow
  - No asymmetric error bars demonstrated (spec calls this out as an optional feature
    for skewed/percentage data) — all five groups use symmetric ±SD, so that data-quality
    dimension is not exercised
  - Bar corners are rounded on all four corners (rx=4) including the bottom, which
    is a very minor stylistic inconsistency since bars typically round only the top
    corners — invisible at this radius/bar-height ratio but worth noting for future
    polish
  - Idiomatic usage is solid but conventional (scaleBand/scaleLinear/axisBottom/axisLeft,
    no custom tick formatting or d3-shape helpers beyond the manual triangle path)
    — leaves some room to showcase more distinctive D3 idioms
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white and not dark — matches the light-theme spec.
      Chrome: Title "bar-error · javascript · d3 · anyplot.ai" in bold dark ink, centered top. X-axis label "Annealing Treatment" and Y-axis label "Tensile Strength (MPa)" in dark ink, both readable. Tick labels in a softer dark gray, subtle horizontal-only gridlines. Top-right annotation "Error bars: ±1 SD (n = 20 samples per group)" in soft ink, fully legible.
      Data: Five bars in the Imprint green (#009E73) for "Untreated", "200°C", "400°C", "600°C", "800°C". Each bar has a black stem + capped error bar showing ±1 SD. The 400°C bar (peak) has a small triangle marker and bold "Peak" label above its error cap, and its x-axis tick label is bolded to draw the eye.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black and not light — matches the dark-theme spec.
      Chrome: Title, axis labels, tick labels, and the "Error bars" annotation all render in light/white ink, fully readable against the dark background. Error bar stems and caps flip to a light color (from t.ink) for contrast against the dark surface. Gridlines remain subtle.
      Data: Bars remain the identical Imprint green (#009E73) as the light render — confirms color parity, only chrome flipped. Peak triangle marker and "Peak" label are in light ink, still clearly visible; the 400°C tick label remains bolded.
      Legibility verdict: PASS — no dark-on-dark failures; all text and error-bar strokes are clearly visible against the near-black background.
