review:
  strengths:
  - Each error bar is a single d3.line() path whose .defined() gaps emit top cap,
    stem and bottom cap as three disjoint segments in one draw call per datum — a
    genuinely D3-specific use of the shape module rather than three separate line
    joins (LM-02)
  - The error-bar stroke is taken from the theme's ink token, so it flips from near-black
    on the cream page to near-white on the dark page and stays clearly separated from
    the green bar fill in both renders (C2)
  - 'The top-right annotation ''Error bars: ±1 SD (n = 20 samples per group)'' names
    exactly what the error bars represent and adds the sample size, satisfying the
    spec''s legend-or-annotation requirement without a redundant single-series legend
    (C3)'
  - Every font size is set explicitly (36 / 18 / 16 / 15 px) and the y-axis runs from
    zero to 500, past the tallest upper bound of 422 MPa, so bar length stays proportional
    to the value and no error bar is clipped (C1)
  - Bars are one width with even scaleBand padding and treatments run in their natural
    order (untreated, then rising anneal temperature), so the rise-then-fall trend
    reads without sorting (C4)
  - Neutral materials-science scenario with per-treatment SD magnitudes that genuinely
    differ (14–33 MPa) and neighbouring ranges that overlap — the uncertainty the
    chart exists to show (DQ-01, DQ-02)
  weaknesses:
  - 'VQ-01 (both): the annotation ''Error bars: ±1 SD (n = 20 samples per group)''
    is set at 15 px, smaller than the 16 px tick labels, and is the first text to
    become illegible when the PNG is scaled to the 400 px mobile width even though
    it carries the spec-required explanation of the error bars → about 18 px (+3 px).
    Likely cause: the annotation text''s .style("font-size", "15px").'
  - 'SC-01 (both): a ''Peak'' label, a triangle marker above the 400 °C error bar
    and a bolded, darkened 400 °C tick label add an emphasis/annotation layer the
    spec neither requires nor offers as optional (the style guide allows callouts
    only when the specification explicitly requests them) → remove the triangle, the
    ''Peak'' text and the tick-weight override. Likely cause: the ''--- Peak callout''
    block and the xAxis.selectAll("text").filter(...) font-weight override.'
  - 'DE-02 (both): the axis tick marks are stroked in t.inkSoft, the full-strength
    secondary-text token, instead of the t.grid token the d3 prompt specifies, so
    the little tick dashes read heavier than the gridlines they continue → stroke
    .tick line from t.grid. Likely cause: g.selectAll(".tick line").attr("stroke",
    t.inkSoft) plus the same assignment inside the axis loop.'
  - 'LM-01 (code): the y-gridlines are hand-drawn as a separate <line> join over y.ticks(6),
    duplicating the tick computation the axis generator already performs, instead
    of the canonical d3 gridline idiom d3.axisLeft(y).tickSize(-iw) → derive the grid
    from the axis generator. Likely cause: the ''--- Gridlines (y-axis only)'' block.'
  - 'Suggestion: rounding only the bars'' top corners would keep them reading flush
    on the zero baseline instead of on rounded feet.'
  - 'Suggestion: giving one treatment an asymmetric error range would exercise the
    asymmetric case the spec''s Notes name as optional.'
  - 'Suggestion: d3.format on the y tick labels (or a unit suffix on the topmost tick)
    would let the value axis carry its unit inline.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across the whole canvas — not pure white, not dark.
      Chrome: Bold dark-ink title "bar-error · javascript · d3 · anyplot.ai" centred at the top (36 px, ~40 % of canvas width). Y-axis label "Tensile Strength (MPa)" rotated on the left, x-axis label "Annealing Treatment" centred below the categories, both dark ink at 18 px. Tick labels ("0"–"500" on Y, "Untreated"/"200°C"/"400°C"/"600°C"/"800°C" on X) in softer dark grey at 16 px, with the "400°C" tick bolded and darkened. Five horizontal-only gridlines are subtle but visible. A top-right annotation "Error bars: ±1 SD (n = 20 samples per group)" sits above the plot frame in soft ink at 15 px — legible at full size, but the first element to fade at the 400 px mobile width.
      Data: Five Imprint-green (#009E73) bars with rounded corners on all four sides, rising from the zero baseline. Each carries a near-black I-beam error bar (2.5 px stem plus horizontal caps at both ends) from mean−SD to mean+SD; arm lengths clearly differ between treatments (14–33 MPa) and the 400 °C and 600 °C ranges overlap. A small dark triangle and a bold "Peak" label sit above the 400 °C error bar. First (and only) series is #009E73.
      Legibility verdict: PASS — all text is dark on the light surface, nothing is light-on-light, nothing is clipped at the canvas border.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 across the whole canvas — not pure black, not light.
      Chrome: Title, both axis labels, tick labels, the bolded "400°C" tick and the "Peak" label all flip to light ink and are clearly readable; no dark-on-dark text anywhere. The top-right ±1 SD annotation renders in the lighter tertiary ink and stays readable. Gridlines flip to a subtle light rule and remain visible without competing with the bars.
      Data: Bars are the identical Imprint green #009E73 as in the light render — the data color does not change, only the chrome. The error-bar strokes and caps flip from near-black to near-white so the I-beams stand out against both the green fill and the near-black page. The peak triangle is light-ink and clearly visible.
      Legibility verdict: PASS — no dark-on-dark failures; brand green #009E73 reads well on the near-black surface and every text element is legible.
