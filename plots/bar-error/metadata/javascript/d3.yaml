review:
  strengths:
  - Error bars are drawn as a single d3.line() path with .defined() gaps forming stem
    + top cap + bottom cap in one draw call per bar — a distinctive, elegant D3-only
    technique (LM-02)
  - Peak callout (triangle marker + bold 'Peak' label + bolded x-axis tick for 400°C)
    gives the chart a clear focal point and visual hierarchy (DE-03)
  - 'Explicit top-right annotation ''Error bars: ±1 SD (n = 20 samples per group)''
    clearly names what the error bars represent, satisfying the spec''s Notes requirement
    (SC-02)'
  - All font sizes are explicit and both light and dark renders are fully legible,
    with the error-bar stroke correctly flipping from dark ink on light to light ink
    on dark
  - Title font size increased from 30px to 36px, giving it noticeably more visual
    presence than the previous underweight title
  - Realistic, neutral materials-science scenario (tensile strength vs. annealing
    temperature) with a physically plausible rise-then-fall trend and appropriate
    SD magnitudes (DQ-02, DQ-03)
  weaknesses:
  - Axis domain lines (default d3 baseline spines) are still drawn on both axes —
    removing them (e.g. .select('.domain').remove()) would tighten the minimal, refined
    look (DE-02)
  - No asymmetric error bars are demonstrated — the spec names this as optional for
    skewed or percentage data, so exercising it on at least one category would cover
    a currently-unexercised data-quality aspect (DQ-01)
  - Bar corners are rounded on all four corners via rx=4, including the bottom edge
    where bars meet the zero baseline — rounding only the top corners reads as more
    conventional bar-chart polish
  - Outside the single-path error-bar technique, the rest of the code is fairly conventional
    scaleBand/scaleLinear/axis boilerplate — leaning further into distinctive D3-only
    idioms (custom tick formatting, d3.format for the annotation) would raise Library
    Mastery further
