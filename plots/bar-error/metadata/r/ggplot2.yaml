review:
  strengths:
  - 'Idiomatic grammar-of-graphics layering: geom_col + geom_errorbar(width = 0.2)
    with visible caps on every bar, composed with coord_flip(clip = ''off'') so the
    long treatment names read horizontally as the spec''s characteristic bullet asks'
  - The subtitle names the uncertainty statistic exactly ('error bars show +/-1 SD
    across 8 replicate plots per treatment'), satisfying the spec's annotation requirement
    without spending a legend on a single series
  - scale_y_continuous(labels = scales::label_number(suffix = ' t/ha')) carries the
    unit onto every tick label, so the value axis is self-describing alongside the
    'Crop Yield (tons/hectare)' axis title
  - 'Error bars are drawn in the theme INK token, so they read as near-black on the
    #FAF8F1 page and near-white on the #1A1A17 page - one styling that stands out
    against both the green bars and both surfaces'
  - Value axis starts at a true zero baseline and expands far enough that every error
    bar, including the 7.0 +/- 0.6 arm of NPK Mix, is fully inside the panel; categories
    are ranked descending by mean yield via rev(factor) releveling
  - 'Theme wiring is complete and correct: plot.background, panel.background, grid,
    axis titles, tick labels, title and subtitle all branch on ANYPLOT_THEME, and
    the canvas is exactly 3200x1800 from ggsave(8 x 4.5 in, dpi = 400, device = ragg::agg_png)'
  weaknesses:
  - 'VQ-07 (both): the five non-top bars are drawn at alpha = 0.6, so the brand green
    composites against the page and reads pale mint on the light surface but deep
    forest on the dark one - the data color is no longer identical across themes ->
    draw every bar at solid #009E73. Likely cause: geom_col(aes(alpha = is_top)) with
    scale_alpha_manual(values = c(TRUE = 1, FALSE = 0.6)).'
  - 'DE-03 (both): the ''* Best yield'' callout and the two-level bar opacity are
    a highlight layer the spec never requests (style guide, Data Presentation: annotations
    and callouts only when the specification explicitly requests them) -> remove the
    callout and draw all six bars alike; the descending rank already carries the focus.
    Likely cause: annotate(''text'', label = ''* Best yield'') plus the is_top flag.'
  - 'DE-02 (both): the x-axis gridlines are drawn at full ink (color = INK, no alpha)
    and read as hard black/white rules competing with the bars instead of sitting
    behind them -> a faint rule at roughly 15 % ink. Likely cause: panel.grid.major.x
    = element_line(color = INK, linewidth = 0.3).'
  - 'VQ-05 (both): expansion(mult = c(0, 0.32)) pushes the value axis to about 9.5
    t/ha while the longest error bar ends near 7.6, leaving roughly a quarter of the
    panel empty to the right of the data -> about 0.12 (-0.20). Likely cause: the
    expansion multiplier sized to make room for the callout.'
  - 'CQ-04 (code): the is_top column, top_row, top_x and the annotate() block exist
    only to place that callout -> delete them together with it. Likely cause: the
    highlight layer.'
  - 'Suggestion: with the category names already on the axis, the ''Fertilizer Treatment''
    y-axis title could be dropped to give the bars more width.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white; panel and margin share the same surface with no panel border.
      Chrome: Bold near-black title "Crop Yield by Fertilizer Treatment - bar-error - r - ggplot2 - anyplot.ai" spanning about 75 % of the canvas width, with a soft-grey subtitle "Ranked by mean yield (highest first) - error bars show +/-1 SD across 8 replicate plots per treatment" directly under it. Rotated y-axis title "Fertilizer Treatment" and x-axis title "Crop Yield (tons/hectare)" are near-black; category labels (NPK Mix, Nitrogen, Compost, Potassium, Phosphorus, Control) and x tick labels (0 t/ha, 3 t/ha, 6 t/ha, 9 t/ha) are soft grey. Tick marks and the y-grid are removed; four vertical x-gridlines run the full panel height at full ink strength - visible but harder than the subtle rule the style guide asks for. Nothing is clipped at any edge.
      Data: Six horizontal bars in brand green #009E73. The top bar (NPK Mix) is solid; the other five are the same hue at alpha 0.6 and read as a pale mint against the cream page. Each bar carries a near-black error bar with visible caps at both ends, drawn through the bar end, plus a value label to the right of the upper cap (7.0 bold, then 6.2, 6.1, 4.9, 4.2, 3.4). A bold green "* Best yield" callout sits to the right of the top bar. No text overlaps another text element, a cap or a bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Title flips to near-white (#F0EFE8) and the subtitle to light grey (#B8B7B0); both axis titles are near-white and both sets of tick labels light grey - all clearly readable, no dark-on-dark anywhere. Gridlines flip to light ink at the same full strength, so they are if anything more prominent here than on the light page. Layout, canvas (3200x1800) and element positions match the light render.
      Data: The same six bars at the same lengths. The solid top bar is the identical brand green #009E73, but the five alpha-0.6 bars composite against the near-black page and read as a dark forest green instead of the light render's pale mint - the same series is a visibly different color in the two themes. Error bars and value labels flip to near-white and stand out cleanly against both the bars and the page; caps are visible on every bar. The "* Best yield" callout stays brand green and remains legible on the dark surface.
      Legibility verdict: PASS
