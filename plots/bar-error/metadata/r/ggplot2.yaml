review:
  strengths:
  - 'Correct theme-token wiring: PAGE_BG/INK/INK_SOFT flip cleanly between light (#FAF8F1)
    and dark (#1A1A17), with identical brand-green (#009E73) bars in both renders.'
  - Error bars use geom_errorbar with visible caps (width=0.2) that clearly mark the
    ±1 SD range on every bar.
  - Subtitle explicitly states what the error bars represent ("Error bars show ±1
    SD across 8 replicate plots per treatment"), satisfying the spec's annotation
    requirement.
  - 'Deliberate grid refinement: vertical gridlines removed, only horizontal major
    gridlines kept, which suits a bar chart and reduces visual clutter.'
  - Dynamic title fontsize (round(12 * 67 / nchar(plot_title))) adapts to the mandated
    title's length instead of a hardcoded size.
  - 'Realistic, neutral data: crop yield (tons/hectare) across 6 fertilizer treatments
    with sensible means and replicate-based SDs.'
  weaknesses:
  - 'No visual hierarchy or storytelling: bars are ordered by treatment label rather
    than by value, and no bar (e.g. the highest-yield NPK Mix) is highlighted or annotated
    as the focal point.'
  - Aesthetic is generic beyond the grid refinement — no custom accent (e.g. a subtle
    callout on the best-performing treatment, or annotated value labels) to elevate
    it past a default theme_minimal bar chart.
  - No distinctive ggplot2-specific features used beyond geom_col + geom_errorbar
    (no coord_flip, faceting, or custom scale functions) — a missed opportunity to
    demonstrate library mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Crop Yield by Fertilizer Treatment · bar-error · r · ggplot2 · anyplot.ai" and grey subtitle "Error bars show ±1 SD across 8 replicate plots per treatment" both clearly legible against the light background. Axis titles ("Fertilizer Treatment", "Crop Yield (tons/hectare)") are dark and crisp; tick labels are a softer dark grey, both fully readable. Only horizontal major gridlines are shown, subtle against the background.
      Data: Six green (#009E73) bars for Control, Nitrogen, Phosphorus, Potassium, NPK Mix, Compost, each topped by a black error bar with visible horizontal caps marking ±1 SD. Bars are evenly spaced and consistently widthed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle are rendered in light tones (white/light grey) and are clearly legible against the dark background — no dark-on-dark issue. Axis titles are light-colored and crisp; tick labels are a softer light grey and fully readable. Gridlines flip to a light color, remaining subtle.
      Data: Same six green (#009E73) bars in identical positions and heights as the light render, confirming data colors are unchanged between themes. Error bar caps flip to white/light color for contrast against the dark background, remaining clearly visible.
      Legibility verdict: PASS
