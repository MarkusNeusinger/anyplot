review:
  strengths:
  - Asymmetric error bars (16th–84th percentile) derived from a physically-motivated
    ceiling-compressed distribution replace the predecessor's symmetric ±1 SD, matching
    the spec's 'unequal arms where errors are asymmetric' property and resolving the
    prior review's W2
  - Distinctive Makie `bracket!` curly-brace annotation spans the top two bars' error-bar
    caps, labeled with the actual computed yield gap ('+3.7 pts vs runner-up') — a
    library-specific primitive with no direct matplotlib/plotly equivalent, resolving
    the prior review's W1 on Library Mastery
  - Bold ink-colored outline on the top-performing bar reinforces the bracket callout
    with a second, complementary visual cue, resolving W3's suggestion to distinguish
    the focal bar
  - Correct Imprint brand green (#009E73) identical across themes, fully theme-adaptive
    chrome, clean L-shaped spines, subtle Y-axis-only grid, and an explicit subtitle
    naming the error-bar metric
  weaknesses:
  - The bracket's curly brace and its text sit close to the top of the Pd/C jitter
    cloud in both renders — a denser cluster of gray run-dots brushes near the brace
    line; increasing the bracket offset slightly would give it cleaner clearance from
    the raincloud overlay
  - Five distinct visual elements are layered (bar, error bar, jittered run-dots,
    comparison bracket, accent-stroke highlight) but only the error-bar meaning is
    named in the subtitle — the raincloud dots and the bold-outlined bar are left
    unexplained, asking readers to infer their meaning from context
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Bold dark title "bar-error · julia · makie · anyplot.ai" and a soft-gray subtitle "Error bars: 16th–84th percentile range (n = 30 runs per catalyst)" at the top. Y-axis "Reaction Yield (%)", X-axis "Catalyst" with six category ticks (Pd/C, Pt/C, Ru/C, Ni, Cu, Fe). Subtle horizontal gridlines at 50 and 100. L-shaped spines (top/right removed). All title, subtitle, axis labels, and tick labels are clearly readable dark-on-light — no light-on-light issues.
      Data: Six brand-green (#009E73) bars descending from ~87% to ~54% reaction yield. The Pd/C bar (top performer) carries a bold black outline stroke distinguishing it from the other five bars' near-invisible page-colored strokes. Each bar has a jittered gray scatter cloud of 30 individual run values behind it (raincloud-style). Black error-bar lines with visible caps show asymmetric (16th–84th percentile) ranges — visibly unequal upper/lower arms, most pronounced on the Fe bar. A curly-brace bracket connects the Pd/C and Pt/C error-bar caps, labeled "+3.7 pts vs runner-up," clearly readable and non-overlapping with the title/subtitle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Title, subtitle, axis labels, and tick labels flip to light/off-white and soft light-gray tones respectively, fully legible against the dark surface — no dark-on-dark failures. Gridlines and spines flip to the light-toned theme-adaptive tokens.
      Data: Bars are the identical brand green (#009E73) as the light render — data colors unchanged. The Pd/C bar's outline flips to a bold white/off-white stroke, still clearly distinguishing it. Jittered scatter dots flip to a light-gray tone and remain visible against the dark bars/background. Asymmetric error-bar lines and caps flip to a light/white tone, mirroring the light render's black error bars, with the same visibly unequal upper/lower arms. The bracket callout flips to light text/lines, fully readable and identical in content to the light render.
