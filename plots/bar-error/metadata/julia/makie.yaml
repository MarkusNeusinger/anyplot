review:
  strengths:
  - 'Correct Imprint brand green (#009E73) for the single data series, with theme-correct
    #FAF8F1/#1A1A17 backgrounds and fully theme-adaptive chrome (title, labels, ticks,
    spines, grid, error-bar color) in both renders'
  - 'Error bars have clearly visible caps (whiskerwidth = 18) and a subtitle explicitly
    states "Error bars: ±1 SD (n = 30 runs per catalyst)", directly satisfying the
    spec''s requirement to explain what the error bars represent'
  - Clean L-shaped spine treatment, Y-axis-only subtle gridlines, and correct omission
    of a legend for the single-series chart, per the style guide's decoration-removal
    checklist
  - Realistic, neutral scientific dataset (catalytic reaction yield by catalyst) with
    a plausible descending trend and increasing variability for lower-yield catalysts
  - All font sizes explicitly set (title, subtitle, axis labels, tick labels); no
    overlap, overflow, or clipping in either theme
  weaknesses:
  - Design reads as a clean but generic single-color bar chart — no Makie-distinctive
    touch (e.g. a DataInspector-style callout, a custom Theme, or an overlay of the
    underlying per-run distribution) elevates it beyond a well-configured default;
    this caps both Design Excellence and Library Mastery
  - 'No explicit data storytelling: the descending sort implies a ranking, but nothing
    visually calls out the best- or worst-performing catalyst (e.g. an accent color
    or annotation on the top bar) to guide the viewer to the insight'
  - Random.seed!(42) is set but never used — mean_yield and std_yield are fully hardcoded
    literals with no random draws, so the seed call and the Random dependency are
    vestigial; either drop them or actually simulate the 30 runs per catalyst to justify
    the seed
  - Only symmetric error bars are demonstrated; the spec notes asymmetric error bars
    as an optional extension for skewed data — not required, but would have broadened
    feature coverage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bar-error · julia · makie · anyplot.ai" centered at top, with a smaller dark-gray subtitle "Error bars: ±1 SD (n = 30 runs per catalyst)" beneath it. X-axis label "Catalyst" and Y-axis label "Reaction Yield (%)" in dark ink; tick labels in a softer gray. Subtle horizontal gridlines at 20-unit intervals. Left and bottom spines visible in soft gray; top/right spines removed. All text is clearly readable against the light background — no light-on-light issues.
      Data: Six vertical bars (Pd/C, Pt/C, Ru/C, Ni, Cu, Fe) in solid Imprint brand green (#009E73) with a thin cream-colored edge stroke for definition, descending from ~87% to ~54% reaction yield. Each bar has a black vertical error-bar line with visible horizontal caps at both ends, representing ±1 SD, growing wider as the mean yield decreases.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light/off-white and soft light-gray text respectively, fully legible against the dark background. Axis labels and tick labels are light-colored (no dark-on-dark failures). Gridlines are faint and light-toned. Spines are a muted light gray, top/right removed as in light mode.
      Data: The six bars are the identical brand green (#009E73) as the light render — confirmed unchanged data color. Error-bar lines and caps flip to white/light-ink color for contrast against the dark background, mirroring the "neutral" theme-adaptive role rather than staying black.
      Legibility verdict: PASS
