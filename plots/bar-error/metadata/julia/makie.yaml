review:
  strengths:
  - 'Random.seed!(42) now actually drives the data: mean_yield/std_yield are derived
    from a real seeded simulation of 30 runs per catalyst instead of hardcoded literals,
    fixing the prior review''s code-cleanliness flag'
  - New raincloud-style jittered scatter overlay shows the individual per-run distribution
    behind each bar, and the '★ Top performer' callout on the best catalyst gives
    the chart an explicit focal point beyond sort order alone
  - Error bars have clearly visible caps (whiskerwidth=18) with the subtitle explicitly
    stating the metric (±1 SD, n=30 runs)
  - Correct Imprint brand green (#009E73) identical across themes, fully theme-adaptive
    chrome (title, subtitle, ticks, spines, grid, error bars, jitter dots) in both
    light and dark renders
  - Clean L-shaped spines, Y-axis-only subtle gridlines, correct omission of a legend
    for the single-series chart, realistic neutral catalyst-yield scenario
  weaknesses:
  - The jitter+scatter+errorbar+text composition is a generic layering technique reproducible
    in any plotting library; nothing here is distinctive specifically to Makie (e.g.
    a custom Theme, DataInspector-style interaction hint, or a Makie recipe) so Library
    Mastery stays capped
  - Only symmetric error bars are demonstrated; the spec's optional asymmetric-error
    variant is not shown
  - Design storytelling is still fairly minimal beyond the top-performer callout and
    descending sort — no additional visual hierarchy (e.g. distinguishing the callout
    catalyst's bar color) reinforces the focal point
