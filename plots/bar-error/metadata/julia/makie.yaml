review:
  strengths:
  - Asymmetric error bars are derived from the simulated runs themselves - `errorbars!(ax,
    x, mean_yield, lower_err, upper_err)` fed with quantile-based arms - so every
    bar shows visibly unequal upper and lower whiskers rather than a mirrored +/-1
    SD
  - '`whiskerwidth = 18` gives both caps of every error bar clear presence at full
    size, drawn in the ink token so the error styling stands out against the green
    fill and against the page in both themes'
  - 'Theme-adaptive chrome is threaded through every non-data property - title, subtitle,
    axis titles, tick labels, spines and the 15 %-alpha y-grid all come from the INK
    / INK_SOFT tokens, while the Imprint brand green #009E73 is held identical across
    the two renders'
  - Categories are ordered by descending mean yield and drawn at one width with even
    gaps from a true zero baseline, on a value axis whose upper limit is computed
    from `maximum(mean_yield .+ upper_err)` so every error bar is spanned in full
  - 'Current Makie API throughout: `Figure(size = ...)` rather than the deprecated
    `resolution`, keyword-styled `Axis`, and `save(...; px_per_unit = 2)` landing
    the canvas exactly on 3200x1800'
  weaknesses:
  - 'VQ-01 (both): chrome is set well under the source-pixel targets for this canvas
    - the title renders at 40 px (titlesize 20 x px_per_unit 2) against the style
    guide''s ~67 px and the tick labels at 24 px against ~34 px, so the ticks wash
    out in the 400 px mobile variant -> titlesize about 32, x/yticklabelsize about
    17, x/ylabelsize about 21 (+60 %). Likely cause: Figure(fontsize = 14) with titlesize
    = 20 and x/yticklabelsize = 12 taken as final values rather than as the library
    prompt''s starting values.'
  - 'VQ-03 (dark): the individual-run dots render at #494845 over the #1A1A17 page
    (ink at 22 % alpha), a contrast ratio near 1.9:1, so the cloud above each bar
    all but disappears while the same dots read clearly in the light render -> about
    0.40 alpha in the dark theme (+0.18). Likely cause: `scatter!(...; color = (INK,
    0.22))` reusing one alpha for both themes.'
  - 'DE-03 (both): two of the five mark types on the canvas - the jittered run-dot
    cloud and the bold outline on the Pd/C bar - are never named anywhere, while only
    the error-bar metric is spelled out, so the viewer has to infer what those two
    layers encode -> name both in a short key, or drop them. Likely cause: the subtitle
    carries the error-bar metric only.'
  - 'DE-02 (both): the value axis carries only three ticks (0, 50, 100) and two gridlines
    across a 0-106 range, so a bar''s height can be read no closer than about +/-10
    points -> about six ticks at 20-point steps. Likely cause: no `yticks` passed
    to `Axis`, leaving Makie''s automatic locator on a 50-point step.'
  - 'Suggestion: the curly brace grazes the top of the Pd/C run-dot cloud in both
    renders; a larger bracket `offset` would give it clean air.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across both the figure and the axis area - not pure white.
      Chrome: Bold near-black title "bar-error · julia · makie · anyplot.ai" centred at the top, with a soft-gray subtitle "Error bars: 16th-84th percentile range (n = 30 runs per catalyst)" directly under it. Y-axis title "Reaction Yield (%)" rotated at the left, X-axis title "Catalyst" centred below six category ticks (Pd/C, Pt/C, Ru/C, Ni, Cu, Fe). L-shaped spines only; two faint horizontal gridlines at 50 and 100. All text is dark on the cream page and readable; nothing is light-on-light and nothing touches or crosses the canvas edge.
      Data: Six Imprint brand-green (#009E73) bars rising from a zero baseline, descending 87 -> 54 % yield. Each bar end carries a black asymmetric error bar with clearly visible caps at both ends, the arms visibly unequal (Fe widest, Pd/C tightest). A translucent gray cloud of 30 jittered individual-run dots sits over and above each bar. The Pd/C bar has a bold black outline, and a curly brace spans the Pd/C and Pt/C caps labelled "+3.7 pts vs runner-up". Neither the dot cloud nor the outline is explained anywhere on the canvas.
      Legibility verdict: PASS - all title, subtitle, axis-title and tick text is readable; the chrome is set smaller than the canvas warrants (see VQ-01).

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 - not pure black.
      Chrome: Title flips to off-white #F0EFE8, subtitle and tick labels to soft light gray #B8B7B0, spines and the two gridlines to the light-ink tokens. No dark-on-dark anywhere: every label and the subtitle read cleanly off the near-black page.
      Data: Bars are the identical #009E73 as the light render - data colour is unchanged, only chrome flips. Error bars and caps flip to light ink and stand out strongly against both the green fill and the page; the Pd/C outline and the curly brace flip to light ink too. The jittered run dots flip to light ink at 22 % alpha, measuring #494845 over the #1A1A17 page - visible but at roughly a 1.9:1 contrast ratio, markedly fainter than in the light render.
      Legibility verdict: PASS for all text; the run-dot overlay is the one element whose dark-theme contrast is weak.
