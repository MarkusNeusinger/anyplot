review:
  strengths:
  - 'Correct pyramid/butterfly structure: two mirrored horizontal bar areas share
    a central axis with identical symmetric 0–60 scales on both sides, exactly per
    spec'
  - 'First series uses brand green #009E73 (AuroraStream) and second uses Imprint
    position 2 lavender #C475FD (NovaPlay), identical across both themes with only
    chrome flipping'
  - 'Data tells a genuine story: AuroraStream and NovaPlay subscriber shares cross
    over across age brackets, visible directly from the mirrored bar lengths without
    needing annotations'
  - 'Clean KISS code structure: flat top-to-bottom script, hardcoded deterministic
    data, no fake interactivity, idiomatic D3 v7 data-join pattern (`selectAll().data().join(''rect'')`)'
  - All text explicitly sized (title 22px, axis title 16px, category/legend labels
    15px, ticks 14px) and readable in both themes, including at the 400px mobile thumbnail
  - 'Good canvas utilization: chart spans ~76% of canvas height and nearly full width
    with balanced margins; legend sits close to the chart, not isolated'
  weaknesses:
  - 'Design Excellence is only above-default, not exceptional: no data labels on bar
    ends, no subtle row banding/hover-independent emphasis, and no explicit callout
    on the age-driven crossover — the story is visible but not emphasized'
  - Both series trends are perfectly monotonic in opposite directions (AuroraStream
    strictly increases with age, NovaPlay strictly decreases) — a small real-world
    irregularity (e.g. one bracket breaking the trend) would read as more realistic
  - 'Library Mastery is generic: only basic scaleLinear/scaleBand/axisBottom composition
    is used — no D3-distinctive feature (e.g. transitions, custom shape generators,
    force/hierarchy layouts) that would be harder to replicate in a simpler charting
    library'
  - Legend swatches/text are manually built with raw rect+text elements rather than
    any reusable pattern — acceptable but purely functional, not a design highlight
