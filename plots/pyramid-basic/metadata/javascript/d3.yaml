      Data: Left bars (AuroraStream) in brand green #009E73, right bars (NovaPlay) in Imprint lavender #C475FD. Dashed curved trend lines in the same two colors thread through each side's bar tips, converging visually around the crossover row. Numeric value labels sit at every bar tip in soft ink.
