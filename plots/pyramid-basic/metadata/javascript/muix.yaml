review:
  strengths:
  - 'Mirrored pyramid built idiomatically: one stack with the left series negated,
    and Math.abs valueFormatters on the axis, the series and barLabel, so every tick
    and label shows magnitudes on both sides'
  - Symmetric scale from one data-derived limit (±maxValue·1.08) keeps equal distances
    equal on both sides
  - Genres without a natural order are ranked by their combined count, largest at
    the base, giving a clean pyramid silhouette
  - In-bar value labels pick dark or light ink per bar colour by WCAG contrast, readable
    in both themes
  - Library-native tooltips via series valueFormatter with the unit for the HTML view
  weaknesses:
  - 'CQ-04 (code): lines 41-50 hand-roll the sRGB linearisation, relative luminance
    and contrast-ratio comparison to pick the bar-label ink → `getContrastRatio(hex,
    DARK_INK) >= getContrastRatio(hex, LIGHT_INK)` from `@mui/material/styles` (about
    −8 lines). Likely cause: the ink choice written out instead of the MUI colour
    helper.'
  - 'Suggestion: the ''Favourite genre'' y-axis title sits about 200 px from its tick
    labels; a narrower y-axis band would tie it to them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
