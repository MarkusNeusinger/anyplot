review:
  strengths:
  - Correct pyramid/butterfly implementation via MUI X's shared-stackId diverging-stack
    technique — a genuinely idiomatic use of the library's stacking API for a chart
    type without dedicated pyramid support.
  - Value labels rendered directly on bars (barLabel) with theme-adaptive readable
    contrast in both light and dark renders.
  - 'Distinct Imprint palette colors (green #009E73 / lavender #C475FD), correctly
    identical across themes — only chrome flips as required.'
  - Central ChartsReferenceLine clearly marks the shared zero axis, reinforcing the
    pyramid metaphor.
  - Realistic, neutral business scenario (streaming genre preference survey) with
    genuine per-category asymmetry between the two series (not just mirrored/identical
    values).
  - Clean, deterministic code that strictly follows the harness contract (skipAnimation,
    default export, ANYPLOT_SIZE sizing, no manual mounting).
  weaknesses:
  - Title occupies only ~27% of canvas width (853px of 3200px) — well below the 50-70%
    target proportion for a plot title. Increase title fontSize (e.g. from 22px to
    ~28-30px CSS) or otherwise give it more visual weight so it reads as a stronger
    focal element.
  - Categories are not ordered by combined magnitude (StreamVista + WaveFlix total),
    so the chart doesn't taper into the classic pyramid silhouette — e.g. Drama (304
    total) sits below Action & Adventure (250 total), breaking the descending shape.
    Sort genres by total (largest at top, descending) for a cleaner pyramid taper
    and stronger data storytelling.
  - X-axis has 35 tick labels at increments of 10 (-170 to 170) — quite dense for
    the data range. This clutters the axis and hurts legibility at mobile/thumbnail
    scale. Use increments of 20 or 25 instead.
  - Code comment claims 'Survey of 400 subscribers per service' but StreamVista values
    actually sum to 735 and WaveFlix to 747 — nearly double the stated survey base.
    Fix the comment or scale the data so genre picks sum close to the stated subscriber
    count for internal consistency.
  - 'Design Excellence is close to a well-configured default: consider a more refined
    grid/tick treatment and stronger visual hierarchy (e.g. via the sorted taper above)
    so the top-level insight is immediately obvious.'
  image_description: |-
