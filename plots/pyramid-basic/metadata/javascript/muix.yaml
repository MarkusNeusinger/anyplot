      Data: First series (StreamVista) renders in Imprint green #009E73 extending left from center; second series (WaveFlix) renders in Imprint lavender #C475FD extending right. White bold value labels sit inside each bar, all legible against the saturated fill colors.
      Legibility verdict: PASS (all text readable at full resolution; dense x-axis ticks and small title proportion are proportional weaknesses, not legibility failures).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches spec.
      Chrome: Title and all axis/tick/legend text render in light ink, clearly visible against the dark background — no dark-on-dark failures observed. Grid lines and the x=0 reference line render in light strokes, subtle but visible. Legend swatches and text fully legible.
      Data: Bar colors are identical to the light render (#009E73 green / #C475FD lavender) — only chrome flipped, as required. White value labels remain legible on both bar colors.
      Legibility verdict: PASS (no dark-on-dark or light-on-light issues in either theme; data colors confirmed identical to light render).
