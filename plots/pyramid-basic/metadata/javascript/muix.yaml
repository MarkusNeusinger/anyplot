review:
  strengths:
  - Symmetric axis scale (-120 to 120) with explicit 20-unit tick intervals gives
    a fair, easy-to-compare bidirectional layout
  - In-bar value labels (Math.abs(value)) plus a bold ChartsReferenceLine at x=0 make
    the shared central axis unambiguous without extra chrome
  - Categories sorted by combined magnitude (descending) produces a genuine tapering
    pyramid silhouette -- a deliberate data-storytelling choice, not just a raw dump
  - 'First series uses Imprint #009E73 (StreamVista), second uses #C475FD (WaveFlix),
    identical across both themes; backgrounds are correctly #FAF8F1 / #1A1A17'
  - All font sizes explicitly set (title 28, axis label 16, tick/legend 14 CSS px)
    and legible in both themes with no dark-on-dark or light-on-light failures
  - 'Distinctive MUI X usage: stacked diverging bars via shared stackId with negated
    left-side data, custom tickInterval array, categoryGapRatio, and ChartsReferenceLine'
  weaknesses:
  - Spec note says category labels should be placed along the central axis; here they
    sit on the far-left y-axis instead (a common and readable pyramid convention,
    but a minor deviation from the spec's explicit guidance)
  - Design is clean and well-configured but stops short of a truly distinctive editorial
    treatment (e.g. no secondary emphasis on the largest asymmetry rows) -- Design
    Excellence has headroom before it reaches publication-tier
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "pyramid-basic · javascript · muix · anyplot.ai" in bold dark ink, top-left. X-axis label "Subscribers who picked this genre as their favorite" in medium-dark gray below the axis. Tick labels (-120..120) and 8 category labels (Drama, Comedy, Action & Adventure, Sci-Fi & Fantasy, Anime, Reality TV, Documentary, Kids & Family) in dark text on the left. Legend "StreamVista"/"WaveFlix" top-right with color swatches. Subtle vertical gridlines only. All chrome is clearly readable against the light background.
      Data: StreamVista bars extend left in Imprint brand green (#009E73), WaveFlix bars extend right in Imprint lavender (#C475FD), both anchored at a bold black reference line at x=0. White in-bar value labels are legible against both colors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis label, tick labels, category labels, and legend all rendered in light/cream text -- fully readable against the dark background. No dark-on-dark instances found. Gridlines are subtle and still visible.
      Data: StreamVista (#009E73) and WaveFlix (#C475FD) bars are pixel-identical in hue to the light render; only the chrome (text, grid, reference-line color) adapted to the dark theme. White in-bar value labels remain legible.
      Legibility verdict: PASS
