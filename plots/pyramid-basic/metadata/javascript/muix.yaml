review:
  strengths:
  - Diverging layout built idiomatically from one shared stack with the left series
    negated, and valueFormatter on axis and series so ticks, labels and tooltips all
    show positive magnitudes
  - Symmetric x domain (±max·1.08) keeps equal distances equal on both sides; central
    axis drawn with the native ChartsReferenceLine
  - Unordered genres ranked by combined count with the largest at the base, giving
    a clear pyramid silhouette
  - Bar-label ink picked per bar colour with MUI's getContrastRatio, so labels stay
    legible on both fills in both themes
  - Theme tokens threaded through every chrome element; light and dark renders both
    read cleanly with identical data colours
  weaknesses:
  - 'Suggestion: the ''Favourite genre'' axis title sits far from its tick labels;
    a narrower y-axis band would tighten the left margin.'
  - 'Suggestion: the column-name regex that splits name and unit adds indirection
    a reader must decode; plain constants for the side names and unit would read more
    directly.'
  image_description: |-
