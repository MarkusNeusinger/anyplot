review:
  strengths:
  - Correct three-grid layout technique (left bars + centered label column + right
    bars) puts the shared category axis on the pyramid's central spine, the idiomatic
    echarts approach for population pyramids
  - Symmetric axis scales (0-50k, mirrored) on both sides for fair visual comparison,
    per spec requirement
  - 'Imprint palette compliance: Male = #009E73 (brand green, position 1), Female
    = lavender (position 2), identical across both themes; backgrounds correctly #FAF8F1
    light / #1A1A17 dark'
  - 'Realistic demographic data: bulge shape peaking at 20-29 with a male/female crossover
    at the older cohorts (female population exceeds male at 60-69 and 70+, matching
    real-world longevity patterns) instead of flat/identical bars'
  - All text (title, legend, tick labels, category labels) explicitly sized and clearly
    readable in both light and dark renders, no overlap or clipping
  - Clean, deterministic, KISS-structured code with no fake interactivity
  weaknesses:
  - X-axis has no descriptive axis title/name — only tick labels suffixed with 'k'
    hint at units. Add an explicit axis name (e.g. 'Population (thousands)') for full
    VQ-06 credit.
  - 'Design Excellence is at the ''well-configured default'' tier: the three-grid
    layout is a functional necessity for the pyramid shape, not an added aesthetic
    flourish. Consider a secondary polish pass (e.g. thinner/removed axis lines, a
    subtle highlight band, refined legend styling) to push past generic.'
  - No visual-storytelling emphasis beyond the plot type's inherent left/right comparison
    — e.g. no annotation calling out the male/female crossover at the older age groups,
    which is the most interesting feature in this dataset.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "pyramid-basic · javascript · echarts · anyplot.ai" in bold dark ink, centered and fully visible. Legend ("Male" / "Female" swatches) directly below title, readable dark-gray text. Y-axis category labels (age groups 0-9 through 70+) sit in the central gutter in dark text, clearly legible. X-axis tick labels ("0k" to "50k") in medium-gray, readable. Vertical gridlines are subtle and do not compete with the bars.
      Data: Left bars (Male) in brand green #009E73, right bars (Female) in lavender/purple #C475FD — both are the first two Imprint palette positions in canonical order. Bars extend symmetrically outward from the shared central axis, values ranging from ~15k-47k, decreasing at the youngest and oldest age groups with a peak around 20-39.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
