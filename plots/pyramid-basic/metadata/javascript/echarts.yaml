      Data: Bar colors are pixel-identical to the light render — brand green and lavender — confirming only chrome (background/text/grid) flipped, not the data-color palette.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, legend entry, tick label, and category label is clearly visible against the near-black background.
