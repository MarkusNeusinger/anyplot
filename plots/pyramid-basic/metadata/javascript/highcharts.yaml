review:
  strengths:
  - 'Correct chart type: opposing horizontal bars sharing a central category axis,
    forming a clean population pyramid'
  - Symmetric y-axis scale (-3500 to 3500) as required by the spec for fair left/right
    comparison
  - 'Correct Imprint palette usage: Male (first series) is brand green #009E73, Female
    is lavender #C475FD, identical across both themes'
  - 'Full theme-adaptive chrome: title/axis/tick/legend colors pull from tokens, backgrounds
    transparent so the page surface shows through correctly in both themes'
  - Linked opposite x-axis mirrors the age-group category labels on the right edge,
    a nice readability touch beyond the bare minimum
  - Realistic, plausible demographic data with a coherent bulge shape (aging population
    effect), 9 age groups within the spec's 5-15 range
  - Clean, deterministic, dependency-free code that correctly follows the Highcharts
    JS mount-node contract (transparent background, animation and credits disabled,
    no explicit width/height)
  weaknesses:
  - 'X-axis title ''Population (thousands)'' combined with the tick-label formatter
    appending ''k'' double-encodes the scale (e.g. tick ''3000k'') -- pick one convention:
    either drop ''(thousands)'' from the axis title and keep the k-suffix formatter,
    or drop the k-suffix and keep the plain thousands values, since combining both
    risks a reader misreading the magnitude by 1000x.'
  - The implementation follows the canonical Highcharts population-pyramid recipe
    (stacked bar + negated values + linked axis) closely without additional visual
    embellishment (e.g. no per-bar data labels, no highlighted focal age group) that
    would elevate it beyond a textbook example.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "pyramid-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable. Y-axis category labels (age groups 0-9 through 80+) mirrored on both the left and right edges via a linked opposite axis. X-axis title "Population (thousands)" and tick labels (0k-4000k on each side) in soft dark gray. Legend at bottom with "Male" (green) and "Female" (lavender) swatches. Subtle vertical gridlines.
      Data: Male bars extend left in brand green #009E73, Female bars extend right in lavender #C475FD, both meeting at the shared central axis, forming a clear pyramid/bulge shape peaking at age 50-59.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, axis titles, tick labels, and legend, now rendered in light ink/off-white and soft light gray, clearly legible against the dark background. Gridlines remain subtle.
      Data: Male and Female bar colors are identical to the light render (#009E73 and #C475FD) -- confirmed unchanged, only chrome (text/background) flipped.
      Legibility verdict: PASS - no dark-on-dark failures; all title, axis, tick, and legend text is clearly visible against the near-black surface.
