review:
  strengths:
  - Correct pyramid/butterfly structure via geom_col + coord_flip sharing a central
    axis, with a symmetric scale (limits derived from max(|value_left|, value_right)
    * 1.08) and abs()-transformed tick labels so both sides read the same positive
    scale
  - Thoughtful semantic color choice — blue (#4467A3) for Male, rose (#954477) for
    Female — matches the spec's own suggested convention ('e.g., blue/pink for gender')
    rather than defaulting to canonical Imprint order, which is the correct call per
    the style guide's semantic-exception rule
  - 'Theme-adaptive chrome correctly threaded through: plot/panel/legend backgrounds,
    ink/ink-soft text tokens, and grid color all flip between light and dark renders
    while data colors stay identical'
  - Clean, restrained grid — only the value-axis (post-flip vertical) gridlines are
    drawn, category axis has none, and legend omits a redundant title since labs(fill
    = NULL) is set
  - Code is simple, reproducible (set.seed), uses only the imports it needs, and saves
    via ragg::agg_png at the correct 8x4.5in/400dpi landscape canvas
  weaknesses:
  - A faint double vertical line is visible at the y-axis border in both renders (likely
    axis.line combined with the coord_flip panel edge) — consider simplifying to a
    single hairline for a cleaner L-shaped frame
  - The outermost '6' tick sits very close to the left/right canvas edge (axis_limit
    ~5.5 plus ~5% default ggplot expansion lands right at 6) — not clipped, but tight;
    a slightly larger axis_limit multiplier (e.g. 1.15) would give more breathing
    room
  - Design excellence is solid but generic beyond the semantic color pairing — no
    additional storytelling elements (e.g. value labels at bar ends, a bolder center
    divider) to create a stronger focal point
  - Library mastery is idiomatic but basic — relies on the standard geom_col/coord_flip
    pyramid recipe without more distinctive ggplot2 features (e.g. geom_text data
    labels, annotate())
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "pyramid-basic · r · ggplot2 · anyplot.ai" in dark ink, clearly visible top-left. Y-axis category labels (age groups 0-9 through 80+) and x-axis "Population (millions)" / y-axis "Age Group" labels are dark and fully readable. Tick labels (6, 3, 0, 3, 6) are soft dark gray, legible. Legend ("Male"/"Female") sits in a light elevated box with subtle border, centered top.
      Data: Blue (#4467A3) bars extend left for Male, rose (#954477) bars extend right for Female, mirrored around a bold central axis line. Colors are consistent and clearly distinguishable from the background and each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title and axis titles render in light off-white ink, tick labels in a lighter soft gray — all clearly visible against the dark background. No dark-on-dark text found. Legend box uses a dark elevated background (#242420-consistent) with light text, readable.
      Data: Same blue and rose hues as the light render — confirmed identical data colors across themes, only chrome (background, grid, text) flipped.
      Legibility verdict: PASS
