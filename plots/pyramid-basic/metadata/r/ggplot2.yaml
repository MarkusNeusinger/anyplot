  strengths:
  - Idiomatic ggplot2 population-pyramid pattern (negative values + coord_flip) with
    a clean conditional hjust for label placement on each side
  - Semantic gender color mapping (blue/rose) directly supported by the spec's own
    note ("blue/pink for gender")
  - Fully symmetric axis scale for fair bilateral comparison, with a value label on
    every bar
  - Realistic demographic data - tapering age structure plus the female-longevity
    effect in the oldest bracket
  - Theme-adaptive chrome correctly threaded through both renders; data colors identical
    across themes
  weaknesses:
  - Gridlines (panel.grid.major.x) use full-opacity INK color instead of a subtle
    low-alpha rgba - soften to rgba(26,26,23,0.15) / rgba(240,239,232,0.15) equivalents
    so they read as a subtle grid rather than bold dividers
  - Blue/rose color pair sits in a similar hue family for CVD viewers - consider a
    thin ink-color stroke on one series, or verify CVD distance, for stronger accessibility
    margin
