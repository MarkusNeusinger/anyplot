review:
  strengths:
  - CustomJSTickFormatter renders magnitudes on both sides of the symmetric ±100 axis
    instead of negative numbers on the left
  - Per-renderer HoverTool tooltips give age group and exact population in the HTML
    output
  - Canonical demographic data with a realistic sex asymmetry in older ages, ordered
    youngest at the bottom
  - 'Both themes thread the tokens through every chrome element; all text is readable
    on #FAF8F1 and #1A1A17'
  - Symmetric limit is computed from the data rather than typed
  weaknesses:
  - 'VQ-07 (both): bars are drawn at alpha 0.85, so #009E73 blends to about #27AA87
    on the light page and about #04876A on the dark page and the data colors differ
    between the two renders → solid fills at alpha 1.0 so both themes show the exact
    Imprint hexes. Likely cause: hbar(..., alpha=0.85).'
  - 'VQ-03 (both): the legend swatches are about 20 px squares next to about 45 px
    label text and barely register as the bar colors → swatches about 40-45 px (+20
    to +25 px). Likely cause: default p.legend.glyph_width / glyph_height while label_text_font_size
    is 34pt.'
  - 'Suggestion: placing the legend at top_right next to the narrow 80+ row would
    use the empty corner instead of sitting beside the 0-9 bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area, thin INK_SOFT frame.
