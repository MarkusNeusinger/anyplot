review:
  strengths:
  - 'Classic plotnine pyramid idiom: the left series is negated in a melted long table,
    drawn with geom_col and turned horizontal with coord_flip, with a callable labels
    formatter on scale_y_continuous showing absolute magnitudes on both sides'
  - One symmetric scale derived from the data (reach = max of both sides × 1.05) so
    equal distances from the center mean equal amounts
  - 'Category and legend order come from the data via scale_x_discrete(limits=…) and
    scale_fill_manual(limits=…): age groups ascend bottom to top and Male gets #009E73,
    Female #C475FD'
  - 'Theme tokens threaded through every chrome element: warm #FAF8F1 / #1A1A17 surfaces,
    INK titles, INK_SOFT ticks and axis lines, ELEVATED_BG legend box — readable in
    both renders'
  - Exactly 3200×1800 canvas (figure_size (8, 4.5), dpi=400) and the full mandated
    title with a descriptive prefix
  weaknesses:
  - 'VQ-05 (both): the legend frame hugs its contents — ''Gender'' touches the left
    border and ''Female'' sits about 2 px from the right border → at least 6–8 px
    of inner padding on both sides. Likely cause: no legend_box_margin / legend_margin
    in anyplot_theme with a framed legend_background.'
  - 'Suggestion: only three x ticks (4,000 · 0 · 4,000) make values like 6,200 hard
    to read off; breaks every 2,000 would give the scale more resolution.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white; 3200×1800 canvas.
      Chrome: title "Population by Age & Gender · pyramid-basic · python · plotnine · anyplot.ai" in dark ink, centered, ~72 % of width. Y axis title "Age group", x axis title "Population (thousands)" in dark ink; ticks 0-9 … 80+ and 4,000 · 0 · 4,000 in INK_SOFT, all readable. Left and bottom axis lines only, very subtle grid. Legend at bottom in a framed box: "Gender" with Male/Female swatches — readable, but the frame hugs the text on both ends.
      Data: nine age groups ascending bottom to top; Male bars in #009E73 extending left, Female bars in #C475FD extending right from one shared zero axis; symmetric scale; bulge at 40-49, female bars longer in 60+.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light #F0EFE8, ticks in #B8B7B0, axis lines light grey — all readable, no dark-on-dark. Legend box in #242420 with light text and a light frame.
      Data: Male #009E73 and Female #C475FD identical to the light render; only chrome flipped.
      Legibility verdict: PASS
