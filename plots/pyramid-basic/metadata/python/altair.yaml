review:
  strengths:
  - 'Correct pyramid: male bars to the left, female to the right from one central
    zero line, ages ascending bottom to top'
  - Symmetric scale derived from the data (±12) with labelExpr='abs(datum.value)'
    so both sides show magnitudes, not negative numbers
  - 'Imprint positions 1-2 (#009E73 / #C475FD) identical in both themes, chrome fully
    theme-adaptive'
  - Legend-bound selection_point with conditional opacity lets the HTML viewer isolate
    one side; tooltips show the unsigned value
  - 'Adaptable code: column constants, escaped field names, melt-based reshape, canvas
    padded (never cropped) to exactly 3200x1800'
  weaknesses:
  - 'SC-04 (both): the title reads ''pyramid-basic · altair · anyplot.ai'' and lacks
    the language segment → ''pyramid-basic · python · altair · anyplot.ai''. Likely
    cause: alt.Title(text=...) string omits ''python''.'
  - 'VQ-05 (both): the legend sits in the bottom-left corner below an empty band of
    about 100 px, off-centre from the centred x-axis title and the pyramid''s central
    axis → place it close to and centred on the plot (e.g. legend direction horizontal
    with a centred bottom placement, or orient=''top-right'' inside the free upper-right
    corner). Likely cause: alt.Legend(orient=''bottom'') aligns to the left edge of
    the view.'
  - 'Suggestion: a slightly tighter bar band (fewer px between bars) would make the
    silhouette read more as one shape.'
