review:
  strengths:
  - Uses the native pygal.Pyramid chart type, which mirrors the two series around
    one shared central axis on a single symmetric scale
  - 'value_formatter=lambda v: f"{abs(v):g}" shows magnitudes on both sides, so the
    left side reads 20 … 4 instead of negative numbers'
  - Age groups ascend from 0-9 at the bottom to 80+ at the top, each label level with
    its pair of bars
  - 'The theme tokens are threaded through Style(): the title, tick labels, axis titles
    and legend are readable in both renders'
  - A clean data block with column constants and a tidy df; the US 2023 age-by-sex
    scenario is realistic and neutral
  - Interactive HTML export alongside the PNG gives per-bar tooltips
  weaknesses:
  - 'VQ-07 (both): the bars are drawn with pygal''s default fill opacity, so Female
    renders about #4BB998 on the light page and #087757 on the dark page instead of
    #009E73 in both, and the data colors differ between the themes → an opaque fill
    at the exact Imprint hex in both renders. Likely cause: Style() without opacity=''1''.'
  - 'VQ-01 (both): the outer tick labels 0 and 20 render at about 44 px while 4, 8,
    12 and 16 render at about 56 px, so the x-axis ticks have two sizes → one tick-label
    size. Likely cause: major_label_font_size=44 next to label_font_size=56.'
  - 'VQ-05 (both): the title sits about 30 px from the top canvas edge with no breathing
    room, while the legend rows leave space unused at the bottom → about 60–80 px
    of top margin (+40 px). Likely cause: default margin_top with title_font_size=66.'
  - 'Suggestion: placing the Male legend entry on the left and Female on the right
    would match each entry with its side of the pyramid.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct surface; 3200x1800 canvas.
      Chrome: title "pyramid-basic · python · pygal · anyplot.ai" top center in dark ink, close to the top edge but not clipped. Y-axis title "Age Group" rotated left; age labels 0-9 … 80+ ascending bottom to top in dark ink. X-axis ticks 20 16 12 8 4 0 4 8 12 16 20 (magnitudes on both sides, no negatives); the 0 and 20 ticks are smaller than the others. X-axis title "Population (millions)". Legend at bottom: green swatch "Female" at the left, lilac swatch "Male" at the center. Subtle dotted vertical guides.
      Data: Female bars extend right, Male bars left, from a thin central axis. The fills are translucent: green measures about #4BB998 (lighter than #009E73), Male about #D49CF9 (lilac #C475FD lightened). Widest bars at 30-39, narrowest at 80+.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct surface.
      Chrome: title, tick labels, axis titles, age labels and legend text in light ink, all readable; no dark-on-dark text. Guides very faint.
      Data: same layout; because of the translucent fill the bars blend with the dark page: green measures about #087757, purple about #915AB8 — the data colors are not identical to the light render.
      Legibility verdict: PASS
