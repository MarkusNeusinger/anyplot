    for the category / value_left / value_right roles, and the plot code reads the
    lists directly → column constants with # role comments above one Data block that
    ends in df, and plot code that reads only df. Likely cause: data written as parallel
    lists.'
  - 'CQ-04 (code): comments on lines 34 and 46 label #009E73 and #C475FD as ''Okabe-Ito
    position 1/2'', contradicting the Imprint colors used → name them as Imprint positions
    1 and 2. Likely cause: comments left from an older palette.'
  - 'DQ-03 (code): the data comment says ''~83M total'' while the lists sum to 88.9
