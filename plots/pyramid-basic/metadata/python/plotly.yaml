    height=450, scale=4.'
  - 'SC-04 (both): the title ''Population Distribution · pyramid-basic · plotly ·
    anyplot.ai'' lacks the language segment → ''Population Distribution · pyramid-basic
    · python · plotly · anyplot.ai''. Likely cause: title string written without ''·
    python''.'
  - 'CQ-01 (code): the Data block ends with three loose lists (age_groups, male_population,
