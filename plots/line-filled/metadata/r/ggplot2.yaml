  strengths:
  - The critical rendering bug from the previous attempts (annotations/average line
    rendering as zero pixels) is now fixed — both geom_hline and all three annotate()
    layers render correctly in both themes.
  - 'Correct, spec-compliant filled-line construction: semi-transparent fill (alpha
