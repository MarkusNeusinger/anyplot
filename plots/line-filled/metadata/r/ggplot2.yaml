  - Theme adaptation is flawless — the data color (#009E73) is pixel-identical between
    light/dark renders; only chrome (background, ink, grid) flips.
  - Realistic, neutral synthetic data (daily page views with a plausible weekend dip)
    with a reproducible (set.seed(42)) pipeline.
  - Peak and monthly-average annotations now give the chart real visual hierarchy
    and a data-storytelling focal point.
  weaknesses:
  - Line markers (geom_point(size = 1.8)) still only modestly stand out from the 1.4pt
    line at 30 data points — a touch more size or a subtle background-colored edge
    would improve element visibility.
  - Annotation text (size = 2.6–3) is noticeably smaller than the axis chrome; consider
    nudging it up slightly for better balance at thumbnail scale.
