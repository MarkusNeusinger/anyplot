review:
  strengths:
  - Native pygal fill=True on a Line chart with include_x_axis=True anchors the area
    at y=0, so the filled height stays proportional to page views and the axis shows
    the full 0–64,000 range
  - 'Two per-series layers of the same values (a translucent fill at 35 % opacity
    without dots, then a solid 7 px #009E73 line with dots) put the line clearly on
    top of and stronger than the fill, in the fill''s own hue'
  - Grid alpha set to the top of the band so the horizontal guides stay visible through
    the fill in both themes; only y guides shown, which suits a single time series
  - 'Theme tokens threaded through Style (background, plot_background, foreground,
    foreground_subtle, guide colors): all text readable on #FAF8F1 and #1A1A17, data
    colors identical across themes'
  - value_formatter gives thousands-separated tick labels and tooltips; the HTML output
    keeps pygal's native hover tooltips on each monthly dot
  - Plausible web-traffic scenario (monthly page views with a summer peak and a December
    holiday spike) with realistic magnitudes and a fixed seed
  weaknesses:
  - 'Suggestion: the December holiday spike that the seasonal factor builds in could
    be given more visual emphasis, for example a slightly heavier dot on the peak
    months, to give the chart a focal point.'
  - 'Suggestion: the left and right vertical edges of the fill polygon draw thin translucent
    green strokes at Jan and Dec; setting the fill layer''s stroke to none would make
    the area end more cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 (not pure white).
      Chrome: title "line-filled · python · pygal · anyplot.ai" centered at top in dark ink (~50 % of width); y-axis title "Page views" rotated, x-axis title "Month (2024)"; y ticks 0–60,000 with thousands separators, x ticks Jan–Dec; all text dark on light and clearly readable. Subtle horizontal guides only, visible through the fill. A thin y-axis line on the left and baseline at 0.
      Data: one #009E73 line with 12 round dots (41k in Jan, rising to ~63k in Jul, falling to ~44k in Nov, spiking to ~64k in Dec); area between the line and y=0 filled in the same green at ~35 % opacity, line clearly on top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 (not pure black).
      Chrome: same title, axis titles and ticks in light ink (#F0EFE8 / #B8B7B0) — all readable, no dark-on-dark. Horizontal guides faint but visible through the dark-green fill.
      Data: identical #009E73 line, dots and 35 % fill as in the light render; only chrome flipped. Brand green reads well.
      Legibility verdict: PASS
