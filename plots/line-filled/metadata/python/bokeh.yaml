review:
  strengths:
  - Native bokeh varea glyph fills from an explicit zero baseline column, with line
    and scatter layered on top from one ColumnDataSource built from the tidy df
  - Range1d(0, max*1.1) taken from the data keeps the zero baseline on the value axis
    so the filled height stays proportional (C2)
  - Fill alpha 0.35 in the line's own Imprint green; gridlines stay visible through
    the fill in both themes and the 5 px line reads clearly stronger than the fill
    (C3, C4)
  - HoverTool with brace-wrapped column names and a {0,0} number format gives readable
    per-month inspection in the HTML output
  - Theme tokens threaded through every chrome element; both renders are fully legible
    on the exact canvas size
  weaknesses:
  - 'Suggestion: y-axis tick labels read as 80000 / 60000; a NumeralTickFormatter
    with a thousands separator (80,000) would scan faster.'
  - 'Suggestion: month names (Jan, Feb, ...) on the x-axis would read more naturally
    than month numbers 1-12.'
