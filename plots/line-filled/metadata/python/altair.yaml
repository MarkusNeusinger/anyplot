review:
  strengths:
  - A single mark_area with line={...} draws the fill and the stroke together, so
    the line sits on top of the fill in its own color (#009E73) and the fill reads
    at fillOpacity=0.35, inside the Notes' 0.3-0.5 range
  - The value axis is pinned to zero with alt.Scale(zero=True), so the filled height
    stays proportional to visitors; interpolate='linear' keeps the line on the 30
    daily values with no spline overshoot
  - Gridlines stay visible through the fill in both themes, and only the y grid is
    drawn (configure_axisX(grid=False)), which suits a chart read along the value
    axis
  - Theme tokens are threaded through the title, axis titles, labels, domain and grid,
    so both renders are fully readable and the brand green is identical across them
  - 'Library-native interactivity in the HTML: escaped-field tooltips with a '',.0f''
    visitor format, plus .interactive() zoom and pan'
  - Plausible website-traffic scenario (growth trend + weekly cycle + noise) with
    a seed and readable column constants (Day of month, Daily visitors)
  weaknesses:
  - 'Suggestion: the mandated title fills only about 32 % of the plot width at fontSize
    16; a slightly larger title would give the header more presence.'
  - 'Suggestion: the x scale starts at day 1 with nice=False, so the first tick label
    is 2; a tick at 1 would anchor the start of the month.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas (chart centered, padded with PAGE_BG).
      Chrome: centered title "line-filled · python · altair · anyplot.ai" in near-black; y-axis title "Daily visitors" and x-axis title "Day of month" in dark ink; tick labels 0–9,000 (comma-formatted) and 2–30 in soft dark gray; subtle horizontal gridlines every 1,000; y and x domain lines in INK_SOFT; no x grid. All readable.
      Data: one #009E73 line (about 2.5 px stroke at the base scale) joining 30 daily values that rise from about 5,900 to about 8,700 with a weekly wave; the area from the line down to the zero baseline is filled in the same green at about 35 % opacity, and the gridlines show through it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink #F0EFE8, tick labels in light gray #B8B7B0, gridlines subtle but visible, domain lines light gray. No dark-on-dark text anywhere.
      Data: the same #009E73 line and the same 35 % green fill (it reads as a deep green over the dark page); the data colors match the light render, and only the chrome flips. Gridlines remain visible through the fill.
      Legibility verdict: PASS
