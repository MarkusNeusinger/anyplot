review:
  strengths:
  - 'Single brand-green #009E73 line drawn on top of its fill via mark_area''s native
    line= property, with interpolate="linear" so the line never overshoots the 30
    daily values'
  - Value axis forced to include zero (Scale(zero=True)), so the fill ends at one
    baseline and the filled height stays proportional to the visitor count
  - 'Theme chrome threaded through tokens in both renders: #FAF8F1 / #1A1A17 backgrounds,
    INK title and axis titles, INK_SOFT tick labels, gridlines visible through the
    fill in both themes'
  - Y-only grid, tick marks removed and nice=False on the x scale so the fill runs
    edge to edge across days 1-30 without a stray empty margin
  - Plausible, neutral web-traffic scenario (growth trend plus weekly cycle and noise,
    4,600-8,700 visitors) with readable axis titles and formatted tooltips in the
    HTML output
  weaknesses:
  - 'DE-01, SC-02 (both): the fill is a vertical gradient from 0.45 opacity at the
    top to 0.12 at the baseline, a decorative gradient fill the style guide lists
    as chartjunk, and its lower part falls below the Notes'' alpha ~0.3-0.5 → one
    flat fill in the line''s color at about 0.3-0.4 opacity (bottom +0.2 to +0.3).
    Likely cause: color=alt.Gradient(... stops 0.45 → 0.12) in mark_area instead of
    color=BRAND with opacity=0.35.'
  - 'Suggestion: a descriptive title prefix (for example "Daily Website Visitors ·
    ") would tell the reader what the series is before they read the axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, chart centred with even page-colored margins.
      Chrome: title "line-filled · python · altair · anyplot.ai" centred in dark ink; y-axis title "Daily visitors" and x-axis title "Day of month" in dark ink; tick labels 0-9,000 (step 1,000) and 2-30 in soft dark grey; left and bottom domain lines only; subtle horizontal gridlines, no vertical grid. All readable.
      Data: one #009E73 line (about 2.5 px stroke) over 30 days rising from ~5,900 to ~8,700 with weekly dips (low ~4,650 at day 5); area filled down to the zero baseline with a green gradient that is denser at the top and fades toward the baseline; gridlines show through the fill.
