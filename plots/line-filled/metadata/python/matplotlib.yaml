review:
  strengths:
  - fill_between with a zero baseline, set_ylim(0, …) and set_xlim to the data range
    make the fill meet both spines, so filled height stays proportional to visitors
    (C2)
  - set_axisbelow("line") puts the y-grid above the alpha 0.3 fill and below the 2.5
    pt line, so gridlines read through the fill in both themes while the line stays
    on top (C3, C4)
  - 'Theme tokens are threaded through title, labels, ticks, spines and grid: no dark-on-dark
    or light-on-light text, and the brand green #009E73 is identical in both renders'
  - mdates.MonthLocator with DateFormatter('%b') gives clean month ticks taken from
    the data, and axis labels come from the column constants with units
  - Exact 3200×1800 canvas from figsize=(8, 4.5) at dpi=400 with layout="constrained"
    and no bbox_inches trimming
  weaknesses:
  - 'Suggestion: the title is set in bold where the library prompt shows medium weight;
    medium would let the data, not the title, carry the most visual weight.'
  - 'Suggestion: a slightly lighter fill alpha (around 0.25) in the dark render would
    separate the fill from the near-black page a little more softly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 (not pure white).
      Chrome: bold title "line-filled · python · matplotlib · anyplot.ai" centred at the top, about 50 % of the width; y-axis label "Website visitors (thousands)", x-axis label "Month (2025)" in dark ink; month ticks Jan–Dec and y ticks 0–70 in INK_SOFT; top and right spines removed; subtle horizontal gridlines at every 10 that stay visible through the fill. All text readable.
