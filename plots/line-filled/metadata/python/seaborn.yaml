review:
  strengths:
  - Exact 3200x1800 canvas with style-guide font sizes (12/10/8 pt) that read cleanly
    in both themes
  - Fill drawn to the y=0 baseline at alpha 0.35 with the 2.5 px line on top, gridlines
    visible through the fill in both renders
  - Tidy df with column constants drives sns.lineplot(data=df, ...); axis titles come
    from the column names
  - x-limits clamped to the data range so the fill meets the y-spine with no dead
    margin
  - 'Theme tokens threaded through sns.set_theme rc, so chrome flips correctly while
    the #009E73 data color stays identical'
  weaknesses:
  - 'Suggestion: a light annotation of the start and end price would give the trend
    a focal point.'
  - 'Suggestion: the fill could step to a slightly lower alpha (about 0.3) to let
    the gridlines read a touch more in the dark render.'
