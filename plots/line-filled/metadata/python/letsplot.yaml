  strengths:
  - 'geom_area under geom_line with the same brand color: the line reads clearly above
    a 0.4-alpha fill in both themes'
  - Value axis from zero via a data-driven limit (scale_y_continuous(limits=[0, max*1.1],
    expand=[0, 0])), so the fill sits on the baseline and its height stays proportional
  - 'Theme tokens threaded through every chrome element: no dark-on-dark or light-on-light
    text'
  - HTML export keeps lets-plot's native hover tooltips for each month
  weaknesses:
  - 'DE-02 (both): the gridlines run on both axes in opaque INK_SOFT (#4A4A44 light
    / #B8B7B0 dark) and a frame closes all four sides of the panel, short of the style
    guide''s baseline for a line chart → y-axis grid only at about 15 % opacity (rgba
    ink 0.15), and only the left and bottom axis lines. Likely cause: panel_grid_major=element_line(color=INK_SOFT,
    size=0.3) without panel_grid_major_x=element_blank(), and axis_line under theme_minimal()
    drawing the full panel border.'
