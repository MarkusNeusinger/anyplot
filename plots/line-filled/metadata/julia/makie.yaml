review:
  strengths:
  - Idiomatic use of Makie's band! + lines! combo for the filled-area effect, with
    semi-transparent fill (alpha 0.35, within the spec's 0.3-0.5 range) and a solid
    brand-green line drawn on top
  - Theme-adaptive chrome correctly threaded through Figure/Axis (backgroundcolor,
    spine colors, tick/label colors, grid alpha) — both renders are fully legible
    with no dark-on-dark or light-on-light failures
  - 'Realistic, appropriately-scaled synthetic data: trend + seasonal cycle + noise
    produces a plausible Daily Active Users growth curve'
  - Baseline correctly pinned to y=0 via ylims!(ax, 0, nothing), matching the spec's
    'baseline is usually y=0' note
  weaknesses:
  - Visual design is fairly generic — a single flat-alpha fill with no additional
    refinement (e.g., a subtle gradient toward the baseline, or a highlighted milestone)
    to lift it beyond the spec minimum
  - No data-storytelling element (no annotation or callout marking a peak/milestone)
    — reads as a plain area chart without added narrative emphasis
  - linewidth=2.5 on 120 noisy points produces a fairly jagged, busy line; a touch
    more smoothing or a slightly thinner line could let the underlying trend read
    more cleanly
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-filled · julia · makie · anyplot.ai" in bold dark ink, clearly legible; x-axis label "Day Since Launch" and y-axis label "Daily Active Users (thousands)" in dark ink; tick labels (0/50/100 on x, 0/50/100 on y) in a softer dark gray. Top/right spines removed, left/bottom spines present in soft ink. Subtle horizontal gridlines at y=50 and y=100.
      Data: Single series filled area chart. Fill is a semi-transparent brand green (#009E73 at ~alpha 0.35) from the baseline (y=0) up to the data line; the line itself is a solid, fully-opaque brand green drawn on top and clearly distinguishable from the fill beneath it. Data rises noisily from ~35 (day 0) to ~110 (day ~119) with a visible upward trend and seasonal wobble.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis labels now rendered in light ink (off-white), clearly legible against the dark background; tick labels in a lighter soft gray. Spines and gridlines flipped to light-on-dark equivalents, same subtle treatment as the light render.
      Data: Fill and line colors are identical to the light render — same brand green fill (~alpha 0.35) and same solid brand-green line on top. Only the chrome (background, text, grid, spines) changed between themes, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text remains clearly visible against the near-black background.
