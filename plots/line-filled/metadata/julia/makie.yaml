review:
  strengths:
  - 'Correct filled line plot: semi-transparent area (~alpha 0.4) matching the line
    color, line drawn clearly on top, baseline anchored at y=0 exactly as the spec
    requires.'
  - 'Clean theme-adaptive chrome: top/right spines removed, single subtle horizontal
    gridline, INK/INK_SOFT tokens correctly threaded through title, axis labels, ticks,
    and spines in both themes.'
  - Realistic, neutral data story (120-day daily-active-users ramp with seasonal wobble
    and noise) at a sensible thousands-of-users scale.
  - Generous headroom above the peak (y_top = max * 1.18) keeps the curve from crowding
    the top of the canvas.
  - Title follows the exact `line-filled · julia · makie · anyplot.ai` convention;
    axis labels are descriptive and carry units.
  weaknesses:
  - 'The peak callout is completely invisible in BOTH renders: I pixel-scanned both
    PNGs at the curve''s actual maximum (light: x=2588,y=162; confirmed via topmost-green-pixel
    scan) and found no scatter dot and no ''Peak: Xk DAU'' text anywhere in the image
    — a full scan for INK-colored pixels outside the title/axis-label regions found
    zero matches. The scatter!/text! calls (lines 87-95) execute without error (the
    script completes and saves) but produce no visible mark. This kills the intended
    storytelling focal point entirely; either fix the z-order/coordinate space so
    the callout actually renders on top of the fill, or remove the dead code.'
  - 'The heatmap-based vertical gradient fill does not produce a gradient in practice:
    sampling a fill column top-to-bottom shows a perfectly FLAT color (163,216,197,
    i.e. ~alpha-0.4 brand green over the page background) across roughly 90% of the
    fill height, with only the last ~30px right against the line transitioning to
    full opacity. The ''faint near baseline, richer near the line'' effect described
    in the code comment is not what renders — visually it is indistinguishable from
    a single flat band!(...; color=(BRAND, 0.4)) fill. Given it doesn''t deliver the
    claimed effect, replace the ~15-line heatmap+mask construction (lines 65-81) with
    a plain single-alpha band! for the same visual result with far less code.'
  - Because the intended focal point (peak marker + label) never renders, the chart
    reads as a plain rising trend line with no visual hierarchy beyond the line itself
    — Data Storytelling credit stays at the unremarkable default.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 as required.
      Chrome: Title "line-filled · julia · makie · anyplot.ai" centered at top in dark ink, clearly legible. X-axis label "Day Since Launch" and y-axis label "Daily Active Users (thousands)" both in dark ink, clearly legible. Tick labels (0/50/100 on x, 0/50/100 on y) in a softer grey, legible. Top/right spines removed, left/bottom spines a soft grey. One subtle horizontal gridline near y=100.
      Data: A single rising, noisy line in Imprint brand green (#009E73) from ~40k (day 0) to a peak near ~120k (around day ~100-105), settling around ~95-110k through day 119. The area under the line down to y=0 is filled with a semi-transparent mint-green tint. Pixel-sampling the fill column confirms it is a FLAT, uniform tint (not the vertical gradient the code comments describe) except for a thin band right at the line itself. I scanned the exact pixel coordinates of the curve's maximum (topmost green pixel in the image) and found no scatter marker and no "Peak: Xk DAU" text there or anywhere else in the plot area — the peak callout the code adds via scatter!/text! is not visible in this render.
      Legibility verdict: PASS (all chrome text reads clearly against the light background; no light-on-light text).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 as required.
      Chrome: Same title/axis labels/tick labels, now in light ink/soft light-grey, clearly legible against the dark background. No dark-on-dark text found.
      Data: Same brand-green line and data values as the light render — data colors are identical between themes, only chrome flipped, as required. Same flat semi-transparent fill (now reading as a deep forest green against the near-black background) rather than a visible gradient. Same peak location checked pixel-by-pixel: no scatter marker, no "Peak" text visible anywhere.
      Legibility verdict: PASS (no dark-on-dark failures), but the intended peak annotation is absent, same as the light render.
