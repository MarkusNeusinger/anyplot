review:
  strengths:
  - Idiomatic Highcharts gradient fillColor (linearGradient with two alpha stops)
    instead of a flat fill — a distinctive, polished touch for a filled-line chart
  - Baseline correctly anchored at y=0 via yAxis.min:0 and plotOptions.area.threshold:0,
    matching the spec's baseline requirement
  - 'Theme-adaptive chrome fully correct: t.ink/t.inkSoft/t.grid tokens applied to
    title, axis titles, tick labels, and gridlines; chart.backgroundColor transparent
    so the page surface shows through in both themes'
  - Realistic, deterministic data via a seeded LCG random walk with a physically sensible
    floor (min 20m), producing a plausible 30-day reservoir trend
  - Descriptive axis titles with units ("Water Level (m)", "Day") and correct anyplot
    title format with a relevant descriptive prefix
  - animation:false set correctly at both chart and series level, respecting the mount-node/harness
    contract; no explicit chart.width/height
  weaknesses:
  - Markers (radius 3) are barely visible against the line and fill in both renders;
    with only 30 sparse data points, per the style guide's proportional-sizing check,
    sparse series should have prominent markers — increase radius to ~4-5 (optionally
    with a light contrasting stroke) so vertices read clearly.
  - The fill gradient's top stop uses alpha 0x8C (~55%), slightly above the spec's
    suggested 0.3-0.5 semi-transparent range at the top of the area; soften the top
    stop toward ~0x70-0x80 (~0.44-0.5 alpha) so the semi-transparent effect reads
    consistently across the whole fill.
  - Data storytelling is fairly flat — no annotation or emphasis calls out the notable
    dip (day 7, lowest point) or peak (day 27), leaving the overall upward trend as
    the only visual focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Reservoir Water Level · line-filled · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible; x-axis title "Day" and y-axis title "Water Level (m)" in a softer dark gray, both readable; tick labels (0-60 in steps of 5 on y, 0/5/10/.../25 on x) legible; subtle horizontal gridlines visible without dominating.
      Data: Single mint-green area (first series = brand green #009E73) with a gradient fill that fades from more opaque near the line to lighter near the baseline; the line itself is a solid, slightly darker green and clearly visible on top of the fill; baseline sits at y=0. Individual point markers are present but very subtle/hard to distinguish from the line at this data density.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white text, clearly legible against the dark background; gridlines are subtle light horizontal lines, visible but not overpowering.
      Data: The line and fill use the identical green (#009E73) as the light render — only the chrome (background, text, grid) flipped to the dark theme, which is correct. The fill still fades from a moderately opaque green near the line down to a darker, more transparent green near the baseline, blending into the near-black background at the bottom, which is expected and reads well.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly visible against the dark surface, and the green data remains distinguishable from the near-black background throughout.
