review:
  strengths:
  - 'Correctly implements the filled-line spec: semi-transparent area fill (opacity
    0.35, within the spec''s 0.3-0.5 range), line clearly visible on top of the fill,
    fill color matches the line color, and the y-axis baseline sits at 0 in both renders.'
  - 'Both renders are fully theme-correct: warm off-white (#FAF8F1) and warm near-black
    (#1A1A17) backgrounds, all chrome (title, axis labels, tick labels, grid) uses
    theme-adaptive tokens, and the brand green (#009E73) data color is identical across
    themes.'
  - Realistic, neutral synthetic dataset — two years of monthly website sessions with
    a plausible seasonal cycle (summer peak) and an upward trend, generated deterministically
    via a seeded LCG.
  - 'Clean, idiomatic ECharts usage: boundaryGap:false for a proper area-chart baseline,
    showSymbol:false with a moderate smooth factor for a polished line, animation:false,
    and no explicit width/height/devicePixelRatio passed to echarts.init per the mount-node
    contract.'
  - Legend correctly omitted for the single series, and title follows the required
    `{Descriptive Title} · {spec-id} · {language} · {library} · anyplot.ai` format.
  weaknesses:
  - Title occupies only roughly a third of the plot width, well under the ~50-70%
    guideline for a title carrying a descriptive prefix — increase titleStyle.fontSize
    from 20 to ~22-24 CSS px to give it appropriate visual weight against the 1600px-wide
    mount.
  - 'Design Excellence is generic: the area uses a single flat semi-transparent fill
    rather than the idiomatic ECharts gradient-fill pattern (`areaStyle.color: new
    echarts.graphic.LinearGradient(...)` fading the brand green from ~0.4 opacity
    at the line down to ~0.02 near the baseline) — this is one of ECharts'' signature
    area-chart techniques and would meaningfully raise both aesthetic sophistication
    and library-idiom scores.'
  - 'No data storytelling / focal point: the chart shows the full series with no emphasis
    on the notable summer peaks (~57 in month 7, ~71 in month 19) — consider a subtle
    `markPoint`/`markLine` on the peak or a light annotation to guide the reader''s
    eye, since the spec''s use case is ''emphasizing magnitude of values''.'
  - Distinctive-feature usage (LM-02) is minimal — beyond `areaStyle`/`smooth`, no
    ECharts-specific capability (gradient fill, `markPoint`, `markLine`, `visualMap`
    on the line, rich tooltip formatting) is demonstrated.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Website Traffic · line-filled · javascript · echarts · anyplot.ai" centered near the top in dark ink; x-axis shows 24 month tick labels (Jan-Dec x2) in a muted gray-brown; y-axis shows numeric ticks 0-80 in the same muted tone plus a rotated "Sessions (thousands)" axis label in darker ink; subtle horizontal gridlines only.
      Data: Single brand-green (#009E73) line with a semi-transparent green area fill down to the y=0 baseline. Line is clearly visible on top of the fill. Seasonal double-hump pattern visible (summer peaks around month 7 and month 19, winter troughs around month 12-13).
      Legibility verdict: PASS — all text (title, axis labels, tick labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light/off-white ink; tick labels and axis label rendered in a lighter muted tone; gridlines still subtle but visible against the dark surface.
      Data: Same brand-green (#009E73) line and area fill — confirmed identical hue/opacity to the light render, only the chrome (text, grid, background) flipped to the dark theme.
      Legibility verdict: PASS — title, axis labels, and tick labels are all clearly legible in light-on-dark ink; no dark-on-dark failures observed.
