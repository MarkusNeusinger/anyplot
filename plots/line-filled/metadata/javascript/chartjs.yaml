      Data: Single series rendered as a brand-green (#009E73) line with a semi-transparent green fill down to the x-axis baseline. The curve rises from ~2,550 DAU on day 1 to ~9,030 DAU on day 30, with a few brief plateaus (around days 7-8 and 16-17) breaking up an otherwise steady climb.
