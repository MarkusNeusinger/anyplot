review:
  strengths:
  - 'Area fills down to an explicit baseline of 0 (`baseline: BASELINE`, `yAxis.min:
    BASELINE`), so the filled height stays proportional to the value in both renders'
  - '`curve: "monotoneX"` gives a smooth line that never overshoots the daily values
    it connects'
  - 'Fill is an SVG linearGradient defined as a child of LineChart (alpha 0.5 to 0.3),
    semi-transparent in brand green #009E73, with the 3 px line clearly stronger on
    top'
  - '`<ChartsGrid horizontal />` is composed after the area so gridlines stay visible
    through the fill in both themes'
  - Two-level header (22 px title, 15 px subtitle with observation count, date span
    and value range) gives a clear typographic hierarchy
  - Axis bands sized explicitly (x height 64, y width 88) so no tick label truncates;
    all chrome threaded from ANYPLOT_TOKENS and both themes read cleanly
  - Realistic daily web-traffic data with weekday/weekend rhythm and steady growth,
    generated with a seeded LCG
  weaknesses:
  - 'Suggestion: the dashed mean reference line is not asked for by the spec; dropping
    it would keep the chart to the line and its fill alone.'
  - 'Suggestion: a domainLimit of "nice" or a first tick at Jan 5 would anchor the
    start of the series on the x axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold dark title "Website Traffic Growth · line-filled · javascript · muix · anyplot.ai" (~49 % width) with a softer subtitle "60 observations · Jan 5, 2026 – Mar 5, 2026 · range 2,448 to 5,754"; y axis "Unique visitors" 0–6,000 in steps of 500, x axis "Date" with weekly ticks Jan 11 … Mar 1; subtle grey horizontal gridlines visible through the fill. All text readable.
      Data: one brand-green #009E73 line (3 px, smooth monotone) over a semi-transparent green gradient fill reaching down to the 0 baseline; weekly dips and a rising trend from ~3,200 to ~5,700. A dashed ink-soft mean line at 4,033 with label "Mean 4,033" at the left.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
