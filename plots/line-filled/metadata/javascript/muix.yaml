review:
  strengths:
  - Semi-transparent area fill (measured alpha ~0.35 via pixel sampling) sits squarely
    in the spec's 0.3-0.5 range, with the line rendered crisply on top of the fill
  - 'Realistic, neutral synthetic dataset: 60 days of daily unique visitors with a
    sustained growth trend, weekly weekend dip, and bounded noise from a deterministic
    seeded LCG'
  - 'Exact Imprint theme compliance: light background measured at #FAF8F1, dark background
    at #1A1A17, line color exactly #009E73 in both themes'
  - Clever, documented workaround for MUI X's y-axis label collision with 4-digit
    ticks — a hand-rotated label in its own flex column instead of the built-in axis
    `label` prop
  - 'Correct harness contract usage: default export, `skipAnimation`, sizes to `window.ANYPLOT_SIZE`,
    subtle theme-adaptive axis line/tick opacity, horizontal-only grid'
  - Title follows the mandated format with a fitting descriptive prefix, and shrinks
    its font size responsively for the long title string
  weaknesses:
  - 'The `visitorsFillGradient` linearGradient (defs, stop-opacity 0.75 -> 0.05) never
    actually renders: pixel sampling of plot-light.png and plot-dark.png at many x/y
    positions inside the fill returns the exact same flat RGB in every case (e.g.
    light: (163,216,197) from just under the line all the way to the baseline; dark:
    (16,71,55) identically) — zero vertical variation. The `.MuiAreaElement-series-visitors
    { fill: url(#visitorsFillGradient) }` sx selector is almost certainly not matching
    the runtime class MUI X assigns to the area path, so the gradient is dead code
    and a flat default-looking fill is shown instead. Either fix the selector so the
    gradient actually applies, or remove the unused gradient/defs.'
  - The `ChartsReferenceLine` average-value label ('Avg 4,036') is completely invisible
    in both renders — only the faint dashed guide line itself shows (confirmed via
    pixel scan across the full chart width at the line's y-position and a zoomed crop
    of the right edge near `labelAlign="end"`); no glyph pixels for the label text
    exist anywhere on the canvas. The feature is non-functional as shipped — increase
    the right margin / check `labelStyle` and clipping, or drop the label if it can't
    be made to render.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly (pixel-sampled).
      Chrome: Title "Website Traffic Growth · line-filled · javascript · muix · anyplot.ai" is centered, bold, dark ink, fully within canvas bounds. X-axis shows date ticks (Jan 5 .. Mar 5) every other day, Y-axis shows visitor counts (0 - 6,000) with a rotated "Unique Visitors" label in its own column at the left; "Date" label centered below the x-axis. Horizontal grid lines are subtle gray. A faint gray dashed average-reference line crosses the chart around y=4,036, but its "Avg 4,036" text label does not render anywhere (verified by pixel scan) — this is a missing/broken feature.
      Data: Single mint-green area (Imprint brand green #009E73 line, ~35% alpha fill) tracing 60 days of daily unique visitors with a clear upward trend and repeating weekly dips (weekends). The fill is a completely flat, uniform opacity from line to baseline — the linearGradient defined in code (meant to fade from opaque near the line to transparent at the baseline) does not actually apply; pixel sampling shows identical RGB values throughout the fill's vertical extent at every x tested.
      Legibility verdict: PASS (title, axis labels, and tick labels are all clearly readable against the light background; no light-on-light text).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly (pixel-sampled).
      Chrome: Same layout as the light render — title, axis labels, and tick labels all rendered in light ink, clearly visible against the dark background. Grid lines remain subtle. The same faint dashed average line is present with the same missing label.
      Data: Data colors are identical to the light render (line #009E73, fill ~35% alpha over the dark background instead of light) — only the chrome (background/text) flips as expected. The fill is likewise completely flat/non-gradiented, mirroring the light render's issue.
      Legibility verdict: PASS (no dark-on-dark failures; all text stays light-colored and legible against the near-black surface).
