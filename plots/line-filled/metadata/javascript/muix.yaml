review:
  strengths:
  - Correct use of MUI X LineChart `area` prop with matching line/fill color and 0.35
    fill opacity, exactly matching the spec's semi-transparent-fill / line-visible-on-top
    / fill-matches-line-color requirements.
  - Baseline correctly anchored at y=0 and the y-axis starts at 0, so the filled area
    accurately represents magnitude rather than being visually truncated.
  - Time-series data layers realistic weekly seasonality (weekend dips) on top of
    a sustained growth trend, giving the area chart genuine shape variation instead
    of a flat wedge.
  - Theme-adaptive tokens are threaded through title, axis labels, tick labels, axis
    lines, and grid — both renders are legible and the data color is identical (#009E73)
    between light and dark.
  - Title fontsize correctly scales down for the long mandated string, and the legend
    is correctly omitted for the single series.
  weaknesses:
  - 'Design Excellence is generic: the area fill is a single flat color with no gradient
    fade or highlight — a subtle vertical gradient (opaque near the line, fading toward
    the baseline) would elevate this from ''correct'' to ''polished''.'
  - No visual hierarchy/storytelling device calls out the growth inflection point
    mentioned in the data-generation comments ('sustained lift from a content-marketing
    push') — it never surfaces visually; consider a reference line or callout there.
  - 'Library Mastery is generic (LM-02): nothing here couldn''t be replicated in Chart.js/D3
    with equal effort — leverage a MUI X-specific feature (e.g. `ChartsReferenceLine`,
    an SVG gradient fill via `sx`, or `highlightScope`) to distinguish the implementation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — correct.
      Chrome: Bold dark title "Website Traffic Growth · line-filled · javascript · muix · anyplot.ai" centered at top, dark tick labels on both axes, rotated "Unique Visitors" y-axis label at far left, "Date" x-axis label at bottom, subtle horizontal gridlines, thin axis lines. All text is clearly readable against the light background.
      Data: Single filled area series in Imprint brand green (#009E73), semi-transparent fill (~0.35 opacity) with a solid 3px stroke line visible on top of the fill, baseline at y=0. Line shows an upward-trending, noisy daily time series (Jan 5 – Mar 5) with visible weekly dips (weekends) and an overall growth trend from ~3,200 to ~5,700 visitors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — correct.
      Chrome: Same layout as light render; title, axis labels, and tick labels rendered in light/off-white text, clearly visible against the dark background. Gridlines are subtle but visible. No dark-on-dark text found.
      Data: Same brand-green (#009E73) line and area fill, identical shape and values to the light render — confirms data colors are held constant across themes while only chrome flipped.
      Legibility verdict: PASS
