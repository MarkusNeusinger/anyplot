review:
  strengths:
  - 'Composes the chart from MUI X v9 building blocks: ChartsContainer + ScatterPlot
    for the risk markers, with useDrawingArea-driven SVG layers for the 5x5 cells,
    cell scores and labels, so cells and markers share one coordinate system'
  - Cell backgrounds follow the risk score (likelihood x impact) on a green (#009E73)
    - amber - ochre - matte red (#AE3030) gradient, with the Low/Medium/High/Critical
    legend spaced under the matrix and matching the cell colors
  - Each cell carries its score in the corner, with ink chosen by computed luminance
    so the numbers stay readable on every cell in both themes
  - Axes use the descriptive rating terms from the spec, ordered Rare→Almost Certain
    and Negligible→Catastrophic, with the numeric rating in parentheses
  - Risk labels sit on page-colored pills, which keeps them readable over every zone
    color in both themes; the two risks sharing the Unlikely/Major cell are jittered
    apart within the cell, with labels above and below
  - The data-driven subtitle (12 risks, 1 Critical, 5 High) gives the takeaway, and
    the scatter series gives hover tooltips in the HTML output
  weaknesses:
  - 'VQ-07 (both): the cell fills are drawn at fillOpacity 0.62 over the page, so
    the effective zone colors change with the theme: Medium reads pale yellow in light
    and khaki/olive in dark, High reads tan in light and dark brown in dark → data
    colors identical in both renders (opaque fills of the zone tokens, keeping the
    luminance-based score ink). Likely cause: CELL_FILL_OPACITY = 0.62 on the cell
    rects and legend swatches.'
  - 'VQ-02 (both): the ''Ransomware'' label runs past both ends of its pill box, so
    the first and last letters sit on the pill border → pill wider than the text by
    about 7 px on each side (about +10 px total). Likely cause: pillW = name.length
    * 8.2 + 14 underestimates wide glyphs at 14 px bold; measure the text or use a
    larger per-character factor.'
  - 'Suggestion: give the markers of the Critical cells more presence (larger marker
    or ring) so the single Critical risk draws the eye first.'
  - 'Suggestion: encode the optional category column with marker shape or color, with
    its own legend entries.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold title "heatmap-risk-matrix · javascript · muix · anyplot.ai" at the top (~53 % width), soft-ink subtitle "12 Risks across 5×5 Likelihood × Consequence Impact matrix (1 Critical, 5 High)". Y axis "Likelihood" with ticks Rare (1) … Almost Certain (5); x axis "Consequence Impact" with ticks Negligible (1) … Catastrophic (5). Legend row at the bottom: Low (1–4), Medium (5–9), High (10–16), Critical (20–25). All text dark and readable.
      Data: 5x5 grid delineated by thin ink lines; cells colored by score: green (#009E73 at 62 % opacity) for Low, pale yellow (amber) Medium, tan (ochre) High, rose (#AE3030 at 62 %) Critical; lowest corner green, top-right red. Each cell shows its score bottom-right. Twelve black dots with bold labels on light pills; Supply Chain and Cloud Outage share the Unlikely/Major cell and are jittered horizontally. The "Ransomware" text slightly overflows its pill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, tick labels, axis titles and legend text all light ink, readable; no dark-on-dark text.
      Data: same zone tokens, but at 62 % opacity over the dark page they read as dark teal, khaki/olive, dark brown and dark red, so effective cell colors differ from the light render. Markers flip to light ink, label pills to dark fill with light text; score numbers switch between dark and light ink by luminance and remain readable. Brand green remains visible.
      Legibility verdict: PASS
