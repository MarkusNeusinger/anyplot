review:
  strengths:
  - Composes the chart from ChartsContainer + ScatterPlot + ChartsXAxis/ChartsYAxis
    and draws the matrix in a custom layer positioned by useDrawingArea(), so cells
    align exactly with the axis scale.
  - 'Axis bands are sized explicitly (height: 62, width: 158) and valueFormatter maps
    ratings to the descriptive terms with their numeric rank, in order from lowest
    to highest; nothing is truncated.'
  - Every cell carries its likelihood × impact score, and the score ink switches between
    dark and light by the blended cell luminance, legible in both themes.
  - Shared-cell jitter is small and deterministic and keeps both markers inside their
    cell; labels sit in theme-adaptive pills that stay readable on every zone color.
  - Realistic IT-security risk register covering all four zones, with skipAnimation
    set.
  weaknesses:
  - 'VQ-07, SC-02 (both): the Low zone (scores 1–4) and its legend swatch are lavender
    #C475FD, so the ordered scale runs lavender → amber → ochre → red and the lowest-score
    corner is not green as the spec''s gradient requires → brand green #009E73 for
    Low (green pole on the good side). Likely cause: ZONE_LEGEND indexes t.palette
    as if 1-based — t.palette[1] is lavender; use t.palette[0] for Low (palette[3]
    ochre and palette[4] red are already correct).'
  - 'CQ-04 (code): every risk is drawn twice — the ScatterPlot series renders 8 px
    ink markers that the hand-drawn <circle r={9}> in RiskMatrixLayer (lines 228–235)
    fully covers, so one of the two passes has no visible effect → style the series
    markers (color/markerSize) and drop the hand-drawn circles, or drop the series.
    Likely cause: custom marker layer added on top of the scatter series.'
  - 'Suggestion: the pill width is estimated as name.length * 8.2 + 14, which leaves
    "Ransomware" touching its pill edges; a slightly larger per-character factor would
    give every label the same padding.'
  - 'Suggestion: adding <ChartsTooltip /> would make the scatter series useful in
    the HTML view (risk name, likelihood, impact on hover).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: dark title "heatmap-risk-matrix · javascript · muix · anyplot.ai" plus soft-ink subtitle; axis titles Likelihood / Consequence Impact; descriptive tick terms Rare (1)..Almost Certain (5), Negligible (1)..Catastrophic (5); thin ink cell borders; four-swatch zone legend at the bottom. All readable.
      Data: 5x5 cells tinted by zone at 62% opacity — lavender Low (should be green), amber Medium, ochre High, matte red Critical; cell scores in bottom-right corners; 12 cream markers with dark outlines and bold labels in cream pills; Supply Chain / Cloud Outage jittered in the shared Unlikely x Major cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and labels in light ink, ticks in light soft ink, light cell borders, legend text light. No dark-on-dark text.
      Data: same zone hexes and opacity as light (darker-looking from blending over the dark page); score numerals switch dark/light by luminance and stay legible; markers become dark discs with light outlines, label pills dark with light text.
      Legibility verdict: PASS
