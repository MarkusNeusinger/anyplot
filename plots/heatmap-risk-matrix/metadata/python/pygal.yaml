review:
  strengths:
  - Luminance-adaptive cell text and marker labels haloed in their own zone color
    keep every label readable on every zone fill in both themes
  - 'Categories take the Imprint palette in canonical order from brand green #009E73,
    and the Low zone is a pale green so the green markers stand out from their host
    cells'
  - Zone legend ranges are computed from the possible products, so the legend always
    agrees with the cell colors
  - Score numeral and zone name in every cell, page-colored gutters and rounded cells
    delineate the 5x5 grid cleanly
  - Native SVG <title> tooltips on every cell and marker give score and category detail
    in the HTML output
  weaknesses:
  - 'VQ-01 (both): risk item labels render at about 27-30 px (Staff Turnover is shrunk
    further), below the 36 px value-label reference and small beside the 36 px tick
    labels → about 36 px (+6 to +9 px). Likely cause: marker_font = int(cell_size
    * 0.12) and the fit_font shrink factor on line 185.'
  - 'VQ-05 (both): the matrix fills only about 55% of the canvas width, with an empty
    band of about 360 px between the title and the grid and about 250 px blank below
    IMPACT → enlarge the grid (cell_size about +15%) and close the top band. Likely
    cause: margin_left=500, margin_right=450, margin_bottom=330 in _plot and the vertical
    centering of a width-limited grid.'
  - 'VQ-07 (both): the zone fills use two custom hexes, #A9DCC3 for Low and #CC7830
    for High, outside the Imprint palette and its anchors → palette or anchor colors
    (or steps of an Imprint ramp) for the green and orange zones. Likely cause: the
    ZONES constant.'
  - 'CQ-01 (code): line 97 `class RiskMatrixHeatmap(Graph)` holds the whole drawing
    in `_plot` → draw the matrix at the top level without a subclass. Likely cause:
    a pygal Graph subclass.'
  - 'Suggestion: the luminance-to-ink rule is written out twice (lines 129-130 and
    183-184); one short helper would hold it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title "heatmap-risk-matrix · python · pygal · anyplot.ai" in dark ink at the top; LIKELIHOOD (vertical) and IMPACT axis titles in bold dark ink, clear of the ticks; tick labels "1. Rare".."5. Almost Certain" and rotated "1. Negligible".."5. Catastrophic" in INK_SOFT; Risk Zones and Category legends on the right. All readable.
      Data: 5x5 rounded cells, pale green Low, amber Medium, orange High, red Critical, each with a bold score and zone name; 14 circle markers with ink outlines in Imprint order (Technical #009E73, Financial #C475FD, Operational #4467A3, External #BD8233), each labeled in dark or light ink with a zone-colored halo. A wide empty band between the title and the grid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
