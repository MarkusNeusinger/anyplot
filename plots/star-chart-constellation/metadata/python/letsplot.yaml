review:
  strengths:
  - 'Real star data: actual RA/Dec and apparent magnitudes for 61 named stars in 13
    constellations (Sirius -1.46, Vega 0.03, Betelgeuse 0.42)'
  - Azimuthal equidistant projection centred on the north celestial pole gives the
    circular sky boundary with concentric Dec rings and radial RA meridians, labelled
    in hours and degrees
  - Magnitude-inverted point sizing with soft glow halos makes the first-magnitude
    stars the focal points while stick figures stay thin and translucent
  - layer_tooltips() gives each named star a title plus constellation, magnitude,
    RA and Dec lines in the HTML export
  weaknesses:
  - 'SC-02, SC-03 (both): RA increases clockwise (0h top, 2h to its right, 6h at the
    right) on a chart centred on the north celestial pole, so every constellation
    is drawn mirrored against the sky, breaking spec bullet C1 → RA increasing counterclockwise
    (east to the left of north). Likely cause: x = rho * np.sin(phi) without the sign
    flip; use x = -rho * np.sin(phi) for stars, grid and labels.'
  - 'SC-02 (dark): named stars are drawn in brand green #009E73 on the near-black
    sky, while spec bullet C2 asks for white or pale-yellow stars in the dark theme
    → white/pale-yellow stars (e.g. INK) in the dark render. Likely cause: color=BRAND
    for the named-star layer in both themes.'
  - 'VQ-02 (both): the names Cygnus, Perseus, Taurus, Orion and Canis Major are drawn
    on top of their own stars, and the legend card covers the sky boundary arc at
    upper left → names clear of every star marker, card outside the disc. Likely cause:
    the fixed LABEL_PUSH=15 radial offset and the legend box anchored at -(r_bound
    - 10).'
  - 'DQ-02 (both): the 150 background stars are uniform random RA/Dec (np.random.uniform)
    scattered over a real sky, so the field around the real constellations is invented
    → real catalogue stars to mag 5 (e.g. further Bright Star Catalogue entries).
    Likely cause: bg_ra/bg_dec random generation.'
  - 'CQ-04 (code): the magnitude key is hand-built from geom_rect + geom_point + geom_text
    with manual box coordinates (lines 315-332, 362-373) while legend_position=''none''
    suppresses the native key → map size to magnitude with scale_size(..., trans=''reverse'')
    or scale_size_identity(guide=''legend'') and style the native legend. Likely cause:
    scale_size_identity() with legend_position=''none''.'
  - 'Suggestion: coord_polar(theta=''x'') on RA and 90-Dec would draw the azimuthal
    equidistant grid natively instead of projecting rings and meridians by hand.'
  - 'Suggestion: a dashed ecliptic, which the Notes allow, would add an orientation
    cue.'
  image_description: |-
