review:
  strengths:
  - Correct north-polar azimuthal equidistant projection with stars at their RA/Dec
    and constellations in their true, unmirrored sky orientation (Orion, Big Dipper
    verified)
  - Magnitude mapped through a MUI X zAxis continuous sizeMap; the legend circles
    read the same sizeScale via useZAxis, so key and stars match exactly
  - 'Stars drawn in the ink token: pale stars on the near-black night sky and the
    printed-atlas style on the light page, both as the spec allows'
  - Stick figures thin and semi-transparent, grid fainter still, so the hierarchy
    stars > figures > grid reads at once
  - Italic constellation names with a page-colored halo sit by their figures without
    covering stars or lines
  - Real 381-star catalogue to magnitude 5.0 with 23 constellations, inside the spec's
    ranges
  weaknesses:
  - 'VQ-01 (both): constellation names and grid labels at 14-15 px CSS on the 1200
    px square canvas shrink to about 5 px in the 400 px thumbnail → about 16-17 px
    (+2 px). Likely cause: fontSize={14} on the name, declination and legend texts
    and fontSize={15} on the hour labels.'
  - 'CQ-04 (code): two hand-built placement searches, the 17×17 shift grid for constellation
    names with own/other-figure gap scoring (lines 404-423, 529-562) and the 144-angle
    declination-label sweep with clash counting (lines 424-428, 455-466), add about
    80 lines for a static chart → a fixed declination-label angle and a simple nearest-free
    offset for the names. Likely cause: generalised collision search kept after the
    layout settled.'
  - 'Suggestion: a faint dashed ecliptic, which the Notes allow, would add an orientation
    cue across Taurus, Gemini and Leo.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the sky disc is drawn on the same page (printed-atlas style).
      Chrome: bold title "star-chart-constellation · javascript · muix · anyplot.ai" and a grey subtitle (381 stars, magnitude 5.0, 23 constellations, projection) at the top; hour labels 0h-22h every 2 h outside the darker rim; declination labels +60°, +30°, 0°, -30° on faint circles in the right sector; faint spokes; "Apparent magnitude" key lower left (-1 brightest, +1, +3, +5 faintest). All text dark on light and readable.
      Data: near-black stars from about 11 px (Sirius, Vega, Capella, Rigel) down to 2 px; thin semi-transparent grey stick figures for 23 constellations; italic grey names (Ursa Major, Orion, Cassiopeia, Leo...) near their figures. No Imprint categorical color needed: stars use the ink token as the spec asks.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 night sky.
      Chrome: title, subtitle, hour, declination and legend text in light ink/inkSoft; grid circles and spokes subtle grey; rim lighter grey. No dark-on-dark text.
      Data: identical positions and sizes; stars flip to the pale ink as the spec wants for the dark sky; stick lines pale grey and semi-transparent; names light italic.
      Legibility verdict: PASS
