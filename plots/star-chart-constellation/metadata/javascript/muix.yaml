review:
  strengths:
  - Azimuthal equidistant projection centred on the north celestial pole with a circular
    rim; RA increases clockwise from the top as seen facing the pole, so Orion, Cassiopeia
    and the Big Dipper read unmirrored
  - Real J2000 positions and magnitudes for 113 named stars in 23 constellations (Vega
    18.62h/+38.8°, Sirius 6.75h/-16.7°, Polaris 2.53h/+89.3°), with 108 stick-figure
    edges joining exactly those stars
  - Magnitude mapped to radius through a continuous MUI X zAxis sizeMap, and the magnitude
    key reads its circles from the same axis via useZAxis, so legend and marks cannot
    drift apart
  - 'Stars in the ink token flip between dark atlas dots on #FAF8F1 and near-white
    stars on #1A1A17 while sticks (inkSoft, 45 % opacity) and the grid (grid token)
    stay clearly fainter in both themes'
  - ChartsContainer composition with custom SVG layers driven by useXScale/useYScale/useDrawingArea
    keeps the grid, sticks and labels in the chart's own coordinate system
  - Italic constellation names with a page-coloured halo, declination labels placed
    in the least crowded hour sector, and an HTML header with a computed subtitle
    (star count, magnitude limit, projection)
  weaknesses:
  - 'VQ-02 (both): the ''-30°'' declination label touches a field star at its upper-left
    corner (around 8h, near the rim) and ''+30°'' sits about 2 px from another faint
    star → clear of every star by at least 4 px. Likely cause: the declination labels
    are placed by sector crowding of constellation stars only and placedBoxes never
    tests them against field stars.'
  - 'DQ-02 (both): the 230 ''Field star N'' background stars are LCG-random positions
    and magnitudes mixed into a real J2000 catalogue, so the faint field does not
    match the real sky (no faint stars where real constellations have them, invented
    stars everywhere else) → use real catalogue stars of magnitude 3.6–5.0 for the
    background field. Likely cause: the seeded loop that pushes synthetic field stars
    into data.'
  - 'Suggestion: a dashed ecliptic curve, which the Notes allow, would help orient
    Taurus, Gemini and Leo along the zodiac.'
  - 'Suggestion: a faint warm tint on the brightest stars (pale yellow in the dark
    theme) would echo the spec''s ''pale-yellow stars'' wording.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; no sky disc, printed-atlas style.
      Chrome: bold title "star-chart-constellation · javascript · muix · anyplot.ai" (~47 % width) and a grey subtitle "243 stars to magnitude 5.0 · 23 constellations · azimuthal equidistant projection, north celestial pole at the centre"; hour labels 0h–22h every 2h outside a darker rim; faint declination circles labelled +60°, +30°, 0°, -30° along the 7–8h sector; 12 faint hour spokes. All text dark and readable.
      Data: ~243 dark ink stars sized by magnitude (Sirius largest, faint field stars as small dots), thin semi-transparent grey stick figures for 23 northern/equatorial constellations (UMa, UMi, Cas, Cep, Cyg, Lyr, Aql, Boo, CrB, Her, Dra, Per, Aur, And, Peg, Tri, Ari, Gem, Leo, CVn, Tau, Ori, CMa), italic names near each group; magnitude key bottom-left (-1 brightest, +1, +3, +5 faintest). Monochrome by spec (stars in ink), no categorical palette needed. '-30°' label touches a field star.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 night sky.
      Chrome: title, subtitle, hour labels, declination labels and constellation names flip to light ink/inkSoft and are all readable; rim light grey, grid subtle but visible. No dark-on-dark text.
      Data: identical star positions, sizes and stick figures; stars render near-white on the dark sky, sticks fainter grey; magnitude key circles near-white. Layout identical to the light render.
      Legibility verdict: PASS
