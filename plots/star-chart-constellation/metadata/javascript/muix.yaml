review:
  strengths:
  - Composes the chart from ChartsContainer + ScatterPlot with a continuous zAxis
    sizeMap, so star radius falls linearly with magnitude (Sirius largest, mag 5 stars
    still visible at 2 px) and the hand-drawn magnitude key reads its circles from
    the same useZAxis sizeScale, so the key always matches the marks
  - 'Correct north-pole azimuthal equidistant projection with RA turning clockwise
    from the top: Orion, Ursa Major, Cassiopeia and Leo appear as seen in the sky,
    not mirrored, every star at its RA/Dec'
  - 'Clear layer hierarchy in both themes: faint t.grid hour spokes and declination
    rings, semi-transparent inkSoft stick figures that end on their stars, and ink
    stars on top: light stars on the #1A1A17 night sky, printed-atlas dark stars on
    #FAF8F1'
  - Declination ring labels run through the least crowded spoke sector and carry a
    page-colour halo, so +60°/+30°/0°/-30° stay readable without touching any figure
  - Real approximate J2000 positions and magnitudes for 23 northern and equatorial
    constellations plus a deterministic LCG field of faint stars, 243 stars in total,
    inside the spec's 200–500 and 20–30 ranges; the subtitle states counts, the magnitude
    limit and the projection
  weaknesses:
  - 'SC-02 (both): the ''Canes Venatici'' name sits about 80 px below its two stars,
    next to Muphrid of Boötes, while the ''Boötes'' name sits closer to the Canes
    Venatici pair than its own label, so the name is not near its constellation''s
    centroid as the Notes ask → keep each name within its own figure''s neighbourhood,
    nearer its stars than any other constellation''s name. Likely cause: the name
    search in SkyLabels places names in centroid order with a 60 px reach, so Boötes
    takes the free slot beside the CVn pair first.'
  - 'VQ-01 (both): constellation names and dec labels at 14 px on the 1200 px mount
    shrink to about 5 px in the 400 px thumbnail and blur → about 16 px (+2 px). Likely
    cause: fontSize={14} on the constellation-name and dec-ring <text> elements.'
  - 'CQ-01 (code): a segmentHitsBox Liang–Barsky helper, a Box type and a 169-candidate
    grid search with per-candidate star and stick hit counts (lines 260–299, 367–393)
    add a layout engine to a snippet that should read top to bottom → a shorter placement
    rule (for example a fixed offset from the centroid toward the outside of the figure).
    Likely cause: the label-avoidance pass built for name placement.'
  - 'Suggestion: a faint dashed ecliptic, which the Notes allow, would add an orientation
    line through Taurus, Gemini and Leo.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas (printed-atlas style, as the Notes allow).
      Chrome: bold title "star-chart-constellation · javascript · muix · anyplot.ai" at the top centre (~47 % width) with a grey subtitle "243 stars to magnitude 5.0 · 23 constellations · azimuthal equidistant projection, north celestial pole at the centre". A darker rim circle bounds the sky; 12 faint hour spokes labelled 0h–22h outside the rim, declination rings labelled +60°, +30°, 0°, -30° along one quiet sector. Italic grey constellation names (Pegasus, Andromeda, Cassiopeia, Cygnus, Lyra, Ursa Major, Orion, Canis Major, Leo, ...). Magnitude key in the lower-left corner: -1 (brightest), +1, +3, +5 (faintest). All text dark on light and readable.
      Data: near-black ink star dots sized by magnitude (Sirius and Vega largest, faint field stars tiny), thin semi-transparent grey stick lines joining constellation stars. Single-series ink colour per the spec's dark-stars-on-light-ground option.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 night sky.
      Chrome: title, subtitle, hour labels, dec labels, constellation names and the magnitude key all switch to light ink / inkSoft; rim circle light grey; grid spokes and rings subtle dark grey. No dark-on-dark text anywhere.
      Data: same star positions, sizes, stick figures and labels; the stars are pale off-white (ink token) on the night sky as the Notes ask, stick lines light grey semi-transparent. Only chrome/ink flips; no categorical palette colours are used, so nothing differs between the renders except the theme tokens.
      Legibility verdict: PASS
