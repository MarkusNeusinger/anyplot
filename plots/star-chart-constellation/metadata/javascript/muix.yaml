review:
  strengths:
  - Correct north-polar azimuthal equidistant projection with a circular rim and right
    ascension turning clockwise from 0h, so the constellations read as seen when facing
    the pole, not mirrored
  - Star size maps magnitude through a native continuous zAxis sizeMap (11 px brightest
    down to 2 px faintest); Sirius, Vega and Arcturus stand out while +5 stars stay
    visible
  - Stick figures are thin (1.2 px) at 0.45 opacity and the RA/Dec grid is fainter
    still, so the hierarchy runs stars > figures > grid in both themes
  - 'Real J2000 catalogue of 23 constellations (Orion, Ursa Major, Cygnus, Leo and
    others) plus a seeded field of faint stars: 243 stars, inside the spec''s 200-500
    range'
  - Composes the chart from ChartsContainer + ScatterPlot and draws the grid, stick
    figures and labels as custom SVG layers through useXScale/useYScale/useZAxis,
    so the scatter and the overlays share one coordinate system
  - Declination labels run through the spoke sector with the fewest constellation
    stars, and every label has a page-colored halo
  weaknesses:
  - 'VQ-02 (both): the ''Leo'' name sits on top of the Leo stick line (Algieba–EtaLeo
    segment) and ''Gemini'' sits on the Castor–Pollux–Wasat line; the halo cuts a
    gap in each figure → place names clear of the stick segments as well as the stars.
    Likely cause: the name-placement search in SkyLabels tests star boxes and earlier
    names but not the stick-line segments.'
  - 'Suggestion: draw the ecliptic as a faint dashed curve (the Notes allow it); it
    would also orient the zodiac constellations (Leo, Gemini, Taurus, Aries).'
  - 'Suggestion: tint the stars pale yellow in the dark theme, which adds a night-sky
    feel while staying inside what the Notes allow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the sky is the printed-atlas style (dark stars on the light ground), which the Notes allow.
      Chrome: bold title "star-chart-constellation · javascript · muix · anyplot.ai" plus a subtitle (243 stars to mag 5.0 · 23 constellations · azimuthal equidistant projection), RA labels 0h–22h every 2 h outside the rim, Dec rings labelled +60°, +30°, 0°, -30° along one spoke, italic constellation names, and a bottom-left "Apparent magnitude" key (-1 brightest, +1, +3, +5 faintest). All text is dark and readable.
      Data: near-black stars sized by magnitude, thin semi-transparent grey stick figures, a subtle grey grid and a darker rim circle. A single series in ink, as the spec asks for (no categorical palette).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 night sky.
      Chrome: title, subtitle, RA/Dec labels, constellation names and the magnitude key all render in light ink tokens and are readable. No dark-on-dark text.
      Data: off-white stars on the dark sky, as the spec asks; same positions, sizes, stick figures and grid as the light render. Only the chrome and ink flip.
      Legibility verdict: PASS
