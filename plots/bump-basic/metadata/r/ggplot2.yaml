review:
  strengths:
  - Every driver carries a bold direct label at its R8 position in its line color,
    so the chart needs no legend and all six labels sit on distinct rank rows without
    collisions in both themes
  - scale_y_reverse() with breaks at every whole rank and a labeller that derives
    the ordinal suffixes (1st–6th) from the breaks; x labels R1–R8 likewise come from
    a labeller function
  - 'Full Imprint palette in canonical order with Hamilton on #009E73; chrome (title,
    axis titles, ticks, grid, x-axis line) is threaded through the INK / INK_SOFT
    / GRID tokens and reads cleanly on #FAF8F1 and #1A1A17'
  - 'All six lines are drawn at equal weight and full opacity, matching the basic
    variant: one line per entity with dot markers centered on every rank'
  - 'Follows the adaptable-code layout: column constants, a tibble keyed by them via
    !!RACE :=, and plot code that reads only df through .data[[...]], with n_races
    and n_ranks derived from the data'
  weaknesses:
  - 'Suggestion: the right-hand expansion (mult 0.22) leaves a wide empty band after
    the labels; a slightly smaller expansion would hand that width to the data area.'
  - 'Suggestion: the y-axis has no axis line while the x-axis has a thin one; dropping
    axis.line.x as well would give the chrome a single consistent treatment.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel, not pure white.
      Chrome: bold dark title "bump-basic · r · ggplot2 · anyplot.ai" top left; axis titles "Championship position" (y) and "Race round" (x) in INK; ticks 1st–6th and R1–R8 in INK_SOFT; subtle horizontal grid only at the six ranks; thin x-axis line. All text readable.
      Data: six drivers over eight rounds, each a thick line with a dot at every round in Imprint order — Hamilton #009E73, Verstappen #C475FD, Leclerc #4467A3, Norris #BD8233, Russell #AE3030, Perez #2ABCCD; all at full opacity; rank 1 at top; bold colored driver labels right of R8 on their final ranks (Hamilton 1st, Verstappen 2nd, Leclerc 3rd, Perez 4th, Norris 5th, Russell 6th), no collisions.
      Legibility verdict: PASS

