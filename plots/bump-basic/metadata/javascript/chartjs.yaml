review:
  strengths:
  - 'Clear narrative device: the subtle #1-row highlight band, the color-matched "Apple
    TV+ overtakes for #1" annotation, and the thicker/larger lead line work together
    to give the chart an obvious focal point that directly serves the spec''s rank-change
    storytelling goal.'
  - Correct Imprint palette in canonical order (green, lavender, blue, ochre, red,
    cyan) with data colors pixel-identical between light and dark renders; only chrome
    flips correctly.
  - 'All spec notes satisfied: inverted y-axis with rank #1 at top, dot markers at
    every period, continuous lines per entity, distinct colors and legend labels for
    all 6 platforms.'
  - Deterministic, idiomatic Chart.js implementation using the native plugin API (beforeDatasetsDraw/afterDatasetsDraw)
    for the highlight band and annotation instead of reaching for an external annotation
    package, exactly matching the library's 'no workarounds' rule.
  - 'Title format, legend labels, canvas contract (animation: false, no fixed canvas
    sizing, single canvas appended to #container) are all correct.'
  weaknesses:
  - The overtake annotation is rendered at 13px, the smallest text element in the
    chart (title 22px, axis titles 16px, ticks/legend 14px) — bump it to 14px for
    consistency with the rest of the type scale.
  - 5 of the 6 series (everything except the bolded Apple TV+ lead line) share identical
    line weight and marker size and rely on color alone for differentiation. At 6
    series this is within the palette's safe range, but a distinct dash pattern on
    1-2 secondary lines would add helpful redundant encoding per the style guide's
    5-6 series guidance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bump-basic · javascript · chartjs · anyplot.ai" in dark ink, centered at top, fully visible and not clipped. Y-axis labeled "Rank" with inverted tick labels #1 (top) through #6 (bottom). X-axis labeled "Week" with ticks Wk 1 through Wk 8. A subtle light-gray band highlights the #1 row. A red annotation "Apple TV+ overtakes for #1" sits above the #1 line near week 7-8, color-matched to the Apple TV+ series. Legend at right lists all 6 platforms with circular swatches, fully within the canvas with margin to the right edge.
      Data: 6 lines in Imprint canonical order — Netflix (#009E73 green), Disney+ (lavender), Max (blue), Prime Video (ochre), Apple TV+ (matte red, thicker/larger markers as the lead series), Paramount+ (cyan). Circular markers at every week for every entity; lines connect the same entity across all 8 weeks; several visible crossings/overtakes (Disney+/Max swap early, Apple TV+'s long climb from #6 to #1 crossing every other series).
      Legibility verdict: PASS — all title, axis, tick, legend, and annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as the light render — title, axis titles, tick labels, legend, and the #1-row highlight band and annotation are all present in theme-adapted light colors (white/light-gray text). The gray highlight band reads as a slightly lighter overlay against the dark background rather than darker, correctly inverted for the theme.
      Data: Identical 6 data colors to the light render — Netflix green, Disney+ lavender, Max blue, Prime Video ochre, Apple TV+ red, Paramount+ cyan — confirming only chrome flipped, not data colors. The red annotation text remains legible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, tick labels, legend, annotation) renders in light tones clearly distinguishable from the near-black background. Brand green (Netflix) remains vivid and clearly visible.
