review:
  strengths:
  - 'Perfect Imprint palette compliance: Netflix is #009E73 and the remaining five
    entities follow the canonical order (#C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD)
    identically across both themes'
  - 'Theme chrome is fully correct in both renders: warm off-white / near-black backgrounds,
    all title/axis/tick/legend text readable with no dark-on-dark or light-on-light
    failures'
  - 'Correct idiomatic Chart.js pattern for a bump chart: line type + reversed y-scale
    + integer stepSize + a tick callback that renders ''#1'', ''#2'', ... instead
    of raw numbers'
  - pointBorderColor set to the page background creates a clean 'punch-through' outline
    on markers, keeping crossing lines legible where they overlap
  - 'All spec requirements met: inverted rank axis (rank 1 at top), distinct color+label
    per entity, dot markers at each period, unbroken lines per entity across all 8
    weeks'
  - Clean, deterministic, single-block KISS script with animation disabled and no
    functions/classes
  weaknesses:
  - 'Design feels like a well-configured default rather than a distinctive composition:
    canonical palette order, standard right-side legend box, no visual emphasis on
    the actual story (e.g., the Netflix/Disney+ battle for #1) — consider a subtle
    line-weight or opacity boost on the lead entity, or a cleaner unboxed legend treatment'
  - 'Data lacks full-range volatility: Apple TV+ and Paramount+ swap once in week
    2-3 and then freeze in ranks 5-6 for the remaining 6 of 8 weeks, and neither ever
    crosses into the top-4 cluster — a stronger bump-chart example would show at least
    one entity moving across a wider rank range to fully demonstrate the ''overtake''
    storytelling the chart type is built for'
  - 'Distinctive-feature usage is modest: the reversed scale + tick-callback + edge-colored
    markers are the right idiomatic choices but are fairly standard Chart.js configuration
    rather than something that showcases a feature unique to the library'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bump-basic · javascript · chartjs · anyplot.ai" in dark ink, centered, fully visible with margin above/below. "Week" (x) and "Rank" (y) axis titles in dark ink. Y-axis tick labels are "#1" through "#6" (custom callback), x-axis tick labels "Wk 1"..."Wk 8", both in a softer dark gray. Legend sits at the right edge with 6 entries (Netflix, Disney+, Max, Prime Video, Apple TV+, Paramount+), text in dark ink, comfortably inside the canvas. Only horizontal gridlines are shown, subtle light gray, no vertical grid. All text is clearly readable against the light background — no light-on-light issues.
      Data: Six lines with round markers (radius 7, white/page-colored marker border) tracking rank 1-6 across 8 weeks. First series (Netflix) is Imprint brand green #009E73; remaining five follow canonical Imprint order (lavender, blue, ochre, matte red, cyan). Multiple crossings visible among the top-4 cluster (Netflix/Disney+/Max/Prime Video); the bottom two (Apple TV+/Paramount+) swap once early then stay flat in ranks 5-6.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and both axis titles render in light/off-white ink, fully legible. Tick labels (rank "#1".."#6", weeks "Wk 1".."Wk 8") render in a lighter secondary gray, clearly visible against the dark surface — no dark-on-dark failures anywhere. Legend text is light-colored and fully legible at the right edge. Gridlines are subtle light-gray horizontal lines only, matching the light render's pattern (inverted for dark chrome).
      Data: Same six lines, same marker style; data colors are pixel-identical to the light render (Netflix still #009E73, and the rest of the sequence unchanged) — only the chrome (background, text, grid) flipped as required. The same crossing pattern (top-4 cluster active swaps, bottom-2 cluster frozen after week 3) is visible.
      Legibility verdict: PASS
