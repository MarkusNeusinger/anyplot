review:
  strengths:
  - Y-axis title now reads "League Position (1 = top)", removing the ordinal-direction
    ambiguity flagged in the previous review
  - Marker symbols (circle/diamond/square/triangle/triangle-down) are now set explicitly
    per series instead of relying on Highcharts' implicit default cycling, giving
    each team color + shape redundant encoding by deliberate code choice
  - Direct end-of-line data labels (team names) fully replace the legend, an idiomatic
    and cleaner bump-chart pattern that removes the color-lookup step for the reader
  - yAxis correctly inverted with min/max/tickInterval locked to the entity count
    so rank 1 sits at the top with only integer ranks labeled
  - Both renders hit the 3200x1800 landscape canvas with no clipping; all chrome is
    theme-adaptive while the six data colors stay pixel-identical between light and
    dark
  - Data colors follow the Imprint canonical order 1-6 with brand green correctly
    on the first series (Falcons)
  - Realistic, neutral football-standings data across 6 teams / 8 matchweeks (within
    the spec's 5-10 entities / 4-8 periods guidance), showing a genuine title race,
    mid-table crossings, and a relegation battle
  weaknesses:
  - Falcons and Sharks both use the 'circle' marker symbol - a minor duplicate in
    the shape encoding. Not confusing in practice since the two lines sit far apart
    (rank 1 vs rank 6) and colors differ, but assigning Sharks a unique symbol (e.g.
    'diamond-alt' equivalent or another distinct shape) would make the redundant encoding
    fully unambiguous across all 6 series
  - 'Design Excellence is solid but not maximal: no additional focal-point treatment
    (e.g. subtle shading behind the rank-1 band, or slightly bolder line weight for
    the top finisher) to push the storytelling further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "bump-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible. X-axis title "Matchweek" and Y-axis title "League Position (1 = top)" in medium-grey ink, both readable. Tick labels (MW1-MW8 and ranks 1-6) legible. Subtle horizontal gridlines at each integer rank; no vertical gridlines. Only bottom and left axis lines are visible (no full frame).
      Data: Six lines in Imprint canonical colors (green #009E73 / lavender / blue / ochre / matte red / cyan) with distinct marker shapes (circle/diamond/square/triangle-up/triangle-down/circle) trace each team's rank across the 8 matchweeks, crossing to show overtakes. First series (Falcons) is confirmed brand green. Team names are printed directly at the end of each line (Falcons, Comets, Vipers, Titans, Wolves, Sharks) in place of a legend, each colored to match its line.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now render in light/off-white ink and remain fully legible; gridlines are faint but visible; axis lines remain visible in a lighter tone.
      Data: The six data-line colors are pixel-identical to the light render (green/lavender/blue/ochre/red/cyan unchanged) - confirming only chrome flipped, not data colors. End-of-line team labels render in light ink and stand out clearly against the dark background.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark failures observed.
