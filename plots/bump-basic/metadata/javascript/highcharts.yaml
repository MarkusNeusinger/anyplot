review:
  strengths:
  - Direct end-of-line data labels (team names at the right edge) replace the legend
    entirely — an idiomatic, cleaner bump-chart pattern than a boxed legend, and it
    eliminates a color-lookup step for the reader
  - Highcharts' default marker-symbol rotation (circle/diamond/square/triangle/triangle-down)
    gives each of the 6 series a distinct shape on top of color, satisfying the style
    guide's redundant-encoding recommendation for n=5-6 series
  - yAxis correctly inverted with min/max/tickInterval locked to the entity count,
    so rank 1 sits at the top and only integer ranks are labeled
  - Both renders hit the 3200x1800 landscape canvas with no clipping, and chrome (background,
    title, axis, grid) is fully theme-adaptive while all 6 data colors stay pixel-identical
    between light and dark
  - 'Data colors follow Imprint canonical order 1-6 with brand green on the first
    series (Falcons), correctly assigned via top-level `colors: t.palette`'
  - 'Data models the spec''s suggested example well: 6 teams, 8 matchweeks, realistic
    and neutral football-standings context within the recommended 5-10 entities /
    4-8 periods range'
  weaknesses:
  - Y-axis title 'League Position' has no unit/scale hint (e.g. '(1 = top)') — the
    inversion is visually obvious from the chart but an explicit cue would remove
    any first-glance ambiguity
  - Marker shapes are the Highcharts default rotation rather than an explicit `marker.symbol`
    per series — works here but is implicit; making it explicit would make the redundant-encoding
    choice self-documenting in the code
  - 'Design excellence is solid but not maximal: grid is present on both minor gridlines
    from tickInterval steps, could be trimmed to just the visible y-axis rows for
    an even cleaner look'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bump-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible. Y-axis "League Position" (ticks 1-6, inverted so 1 is at top) and X-axis "Matchweek" (MW1-MW8) labels in medium-grey ink, both readable. Subtle horizontal gridlines at each integer rank. Team names (Falcons, Comets, Vipers, Titans, Wolves, Sharks) printed directly to the right of each line's final point in bold dark text, acting as the legend — no separate legend box.
      Data: Six lines, each a distinct Imprint color with a distinct marker shape (circle, diamond, square, triangle-up, triangle-down, circle). First series (Falcons) is brand green #009E73. Lines cross and zig-zag across matchweeks showing rank changes/overtakes clearly.
      Legibility verdict: PASS — no light-on-light or hard-to-read text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink against the dark background, fully legible. Gridlines are faint light lines, subtle but visible. Team name labels at line-ends render in white, standing out clearly against the dark background.
      Data: All six line colors are pixel-identical to the light render (green, lavender, blue, ochre, red, cyan) — only the chrome (background, text, grid) flipped, confirming color/theme separation is correct.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data remain clearly distinguishable from the background.
