review:
  strengths:
  - 'Correct bump-chart construction: inverted rank axis (rank 1 at top), one line
    per entity, circular markers at every period, and a deterministic no-tie rank
    permutation per race column.'
  - Elegant direct end-labeling instead of a separate legend — each line's team name
    is attached at its final point, avoiding a legend/data collision and scaling cleanly
    to 8 series (the exact 'direct labels per series' mitigation the style guide recommends
    at n=8).
  - 'Perfect Imprint palette compliance: canonical color order across all 8 series,
    brand green first (Nova Racing), identical data hues between light and dark renders,
    and fully theme-correct chrome (background, ticks, grid, end-labels) in both.'
  - 'Clean, deterministic, KISS-structured code — no unused imports, hardcoded reproducible
    data, and correct harness contract (animation: false, no explicit init size or
    devicePixelRatio).'
  - 'Realistic, neutral fictional-racing dataset that shows the full range of bump-chart
    storytelling: early lead changes, a mid-season overtake for first place, late-season
    swings, and long stable stretches.'
  weaknesses:
  - Design Excellence is solid but stops short of publication-quality — no visual
    emphasis distinguishes the season's eventual champion (Nova Racing) from the pack
    once it takes the lead; add a slightly bolder line weight, a markPoint/markLine
    annotation, or a subtle highlight on the top-ranked series to create a clear focal
    point (DE-01, DE-03).
  - 8 series sit at the palette's CVD-distinguishability floor (ΔE≈8.81); direct end-labels
    already mitigate this well, but a repair pass could push Library Mastery further
    with e.g. a distinct symbol shape or emphasis styling for the top 2-3 ranked teams
    to reinforce the story (LM-02).
  - Marker size (symbolSize 14) is adequate but on the small side given the sparse
    dataset (8 points per line, well under the <50-point 'prominent markers' guidance)
    — consider increasing symbolSize slightly, especially for the leading series (VQ-03).
  - Grid/margin balance is good but the right-hand margin reserved for end-labels
    (210px) leaves slightly more unused whitespace than the left (70px) — minor tightening
    would improve canvas utilization (VQ-05).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "bump-basic · javascript · echarts · anyplot.ai" centered at top; y-axis labeled "Rank (1 = best)" with inverted scale (1 at top, 8 at bottom); x-axis shows "Race 1" through "Race 8"; subtle horizontal-only gridlines mark each rank row; no vertical gridlines. All text renders in dark ink against the cream background.
      Data: 8 lines with circular markers, one per team, in Imprint palette canonical order (green, lavender, blue, ochre, red, cyan, rose, lime). First series (Nova Racing) is #009E73 brand green. Each line ends with a directly-attached label naming the team instead of a separate legend.
      Legibility verdict: PASS — title, axis labels, tick labels, and all 8 end-labels are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and gridline layout as the light render, now rendered in light/off-white text. Gridlines are subtle light gray at low opacity.
      Data: Confirmed identical data colors to the light render — the same green/lavender/blue/ochre/red/cyan/rose/lime hues track the same entities, only the background and text chrome flipped.
      Legibility verdict: PASS — all text (title, ticks, y-axis name, end-labels) is clearly readable against the dark background; no dark-on-dark failures observed anywhere in the chart.
