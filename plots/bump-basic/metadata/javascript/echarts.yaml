review:
  strengths:
  - 'Correct bump-chart construction: inverted rank axis (rank 1 at top), one line
    per entity, markers at every period, and a deterministic no-tie rank permutation
    per race column.'
  - 'Repair pass fixed the previous review''s top weakness: Nova Racing (the eventual
    champion) now gets a distinct diamond marker, a thicker line (5px vs 3.5px), and
    a bold end-label, creating a clear focal point that tells the season''s story
    at a glance (addresses prior DE-01/DE-03 feedback).'
  - Marker sizing was increased (14px to 16px, 20px for the champion) per the prior
    VQ-03 feedback, giving the sparse 8-point-per-line dataset more prominent, legible
    markers.
  - Elegant direct end-labeling instead of a separate legend — each line's team name
    attaches at its final point, avoiding legend/data collisions and scaling cleanly
    to 8 series (the 'direct labels per series' mitigation the style guide recommends
    at n=8).
  - 'Perfect Imprint palette compliance: canonical color order across all 8 series,
    brand green first (Nova Racing), identical data hues between light and dark renders,
    fully theme-correct chrome (background, ticks, grid, end-labels) in both.'
  - 'Realistic, neutral fictional-racing dataset showing the full range of bump-chart
    storytelling: an early lead change, a mid-season overtake for first place, late-season
    swings among the mid/back pack, and long stable stretches.'
  - 'Clean, deterministic, KISS-structured code — no unused imports, hardcoded reproducible
    data, correct harness contract (animation: false, no explicit init size or devicePixelRatio).'
  weaknesses:
  - Grid right margin (190px, reserved for end-labels) is still noticeably larger
    than the left margin (70px); the repair pass narrowed it from 210px but a fully
    balanced layout would trim it further or size it dynamically from the longest
    team name (VQ-05, minor).
  - Only the top-ranked team receives distinct emphasis styling; the mid/back-pack
    cluster (ranks 5-8, where most of the crossing action happens) still relies on
    color alone to differentiate — a subtle secondary cue (e.g. slightly reduced line
    weight or opacity for teams that never reach the podium) would sharpen the visual
    hierarchy further (DE-03).
  - Library Mastery usage is solid but still fairly generic ECharts patterns (line
    series + endLabel + emphasis.focus); a markLine at the podium threshold (rank
    3) or an areaStyle band highlighting the top-3 zone would showcase a more distinctive
    ECharts feature (LM-02).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "bump-basic · javascript · echarts · anyplot.ai" centered at top; y-axis labeled "Rank (1 = best)" with inverted scale (1 at top, 8 at bottom); x-axis shows "Race 1" through "Race 8"; subtle horizontal-only gridlines mark each rank row; no vertical gridlines. All text renders in dark ink against the cream background.
      Data: 8 lines with markers, one per team, in Imprint palette canonical order (green, lavender, blue, ochre, red, cyan, rose, lime). First series (Nova Racing) is #009E73 brand green and is visually emphasized with a diamond marker, a thicker line, and a bold end-label — it becomes rank 1 from Race 3 onward and stays there, making it the clear focal point of the chart. Each line ends with a directly-attached label naming the team instead of a separate legend.
      Legibility verdict: PASS — title, axis labels, tick labels, and all 8 end-labels are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and gridline layout as the light render, now rendered in light/off-white text. Gridlines are subtle light gray at low opacity.
      Data: Confirmed identical data colors to the light render — the same green/lavender/blue/ochre/red/cyan/rose/lime hues track the same entities, only the background and text chrome flipped. The Nova Racing champion emphasis (diamond marker, thicker line, bold label) is equally visible on the dark surface.
      Legibility verdict: PASS — all text (title, ticks, y-axis name, end-labels) is clearly readable against the dark background; no dark-on-dark failures observed anywhere in the chart.
