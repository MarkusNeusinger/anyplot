review:
  strengths:
  - Direct end labels drawn through a child component that reads useXScale/useYScale
    replace the legend, so all six lines are identified where they finish, sorted
    by final rank and never colliding
  - 'Inverted rank axis (reverse: true) with tickInterval pinned to whole ranks and
    a ''#N'' valueFormatter meets the spec''s whole-number-ticks property exactly'
  - monotoneX curves bend gently between periods and stay flat while a rank holds,
    so no line overshoots its rank at any period
  - Hollow circular marks in each line's color sit centered on every period, and the
    Imprint palette runs in canonical order from brand green, identical in both themes
  - Theme tokens are threaded through every chrome element (title, subtitle, axis
    lines, ticks, grid, end labels), so both renders read cleanly
  - Data layer separated from plot layer by column constants, with no hard-coded entity
    or period counts
  weaknesses:
  - 'DQ-02 (both): Rust is ranked #3–#4 from 2018 to 2023, ahead of TypeScript and
    Go, which reads as invented against any well-known language-popularity index →
    give Rust lower ranks (around #5–#6 early, rising later) so the real language
    names carry plausible positions. Likely cause: the Rust and TypeScript rank arrays
    in the data block.'
  - 'Suggestion: color each end label in its line''s color so the label-to-line link
    holds even where two lines finish close together.'
