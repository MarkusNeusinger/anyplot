review:
  strengths:
  - Direct end-of-line entity labels (via useXScale/useYScale hooks) replace the legend
    entirely — a genuinely idiomatic MUI X compositional pattern, and a stronger identity
    cue than a corner legend with 6 close hues
  - Smooth monotoneX curve interpolation gives the bump chart a polished, professional
    look without overshooting rank bounds
  - Y-axis correctly inverted (rank 1 at top) with integer-only ticks formatted as
    '#1'..'#6', reinforcing the ordinal nature of the data
  - 'Data shows genuinely varied rank-change patterns: gradual crossovers (Python/JavaScript),
    non-monotonic dips and recoveries (Go, Rust), and stable plateaus — good feature
    coverage for a bump chart'
  - All font sizes explicitly set (title, axis labels, tick labels, end labels) and
    legible in both themes; data colors identical between light/dark renders with
    only chrome flipping
  - Clean, minimal code — data as flat arrays, no unnecessary abstractions beyond
    the one helper needed to consume chart-context hooks
  weaknesses:
  - Rank trajectories are plausible but not tied to a specific real-world ranking
    source (e.g. TIOBE, Stack Overflow survey) — the general shape (Python overtaking
    JavaScript, TypeScript overtaking Java) is directionally reasonable but not verifiable
    against a named index
  - Data storytelling is good but not exceptional — all six entities receive equal
    visual weight with no single emphasized focal point or callout for the most dramatic
    change
  - Vertical y-axis line and horizontal x-axis line remain visible (not fully spine-free);
    a fully chromeless axis treatment would push Visual Refinement further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Language Popularity Rankings · bump-basic · javascript · muix · anyplot.ai" in dark ink at top-left, fully visible, not clipped. Y-axis shows rank ticks "#1" through "#6" (inverted, #1 at top) in dark ink; "Rank" axis label rotated at left. X-axis shows years 2018-2025 with "Year" label below, all in dark ink. Subtle horizontal grid lines at each rank level. All text clearly readable against the light background.
      Data: Six smooth curved lines (JavaScript, Python, Java, TypeScript, Go, Rust) each in a distinct Imprint palette color, with small circular markers at each year. First series (JavaScript) renders in #009E73 brand green. Direct end-of-line labels at the right edge (color-matched to each line) replace a traditional legend, sitting fully within the canvas margin, not clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, now in light/white text, fully visible. Y-axis "#1"-"#6" ticks and "Rank" label in light ink, X-axis years and "Year" label in light ink. Grid lines subtle but visible against the dark surface.
      Data: Same six curves, same colors as light render (JavaScript #009E73 confirmed identical) — only the chrome (background, text, grid) flipped to the dark scheme. End-of-line labels remain color-matched and readable, including the muted slate-blue "Java" label, which retains adequate contrast against the near-black background. No dark-on-dark text found.
      Legibility verdict: PASS
