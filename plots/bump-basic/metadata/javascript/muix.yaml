review:
  strengths:
  - Direct end labels are drawn by a child component that reads the chart's own scales
    through useXScale/useYScale. This MUI X composition idiom places each language
    name exactly at its final rank and makes a legend unnecessary.
  - 'The rank axis is inverted (reverse: true) with whole-number ticks from tickInterval
    and a ''#n'' valueFormatter. The padding is derived from the rank span, so the
    #1 and #6 markers sit fully inside the plot.'
  - The monotoneX curve gives gentle transitions between years that never swing past
    a rank, so every line passes exactly through its rank at all 8 periods.
  - Theme tokens are applied to all chrome (title, subtitle, axis lines, ticks, grid,
    end labels), so both renders read cleanly and the Imprint data colors are identical
    in both.
  - The data shows several overtakes (Python over JavaScript, TypeScript over Java,
    Rust over Go) next to long stable stretches. Each year is a valid 1..6 permutation.
  - Library-native tooltips stay in the HTML output; skipAnimation guarantees a final-frame
    PNG.
  weaknesses:
  - 'DQ-02 (both): real language names (JavaScript, Python, Java, TypeScript, Go,
    Rust) carry ranks for 2018-2025 that no named ranking source backs, so the chart
    reads as fact but the numbers are invented → either cite the ranking the values
    follow (for example a named survey) in the subtitle and match it, or use fictional
    entities. Likely cause: the hand-typed ranks arrays in the data block.'
  - 'Suggestion: labels at the 2018 end as well would let readers see the starting
    order without tracing the lines back from the right.'
  - 'Suggestion: tick labels at 14 px get small in the 400 px thumbnail; 15-16 px
    would match the end labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: bold dark title "Language Popularity Rankings · bump-basic · javascript · muix · anyplot.ai" centered at the top, a soft-gray subtitle "Popularity rank of 6 languages per year, 2018–2025 · 1 = top" below it, a y-axis title "Popularity rank" with ticks #1..#6 (rank 1 at top), an x-axis title "Year" with ticks 2018..2025, and subtle horizontal grid lines at each whole rank. The left and bottom axis lines are in soft ink. All text is dark and readable.
      Data: six smooth (monotone) lines with hollow ring markers at each year. JavaScript is brand green #009E73 (first series), followed by Python purple, Java blue, TypeScript ochre, Go dark red and Rust cyan. The direct labels at the 2025 end read Python, JavaScript, TypeScript, Java, Rust, Go, in final-rank order. Crossings appear between 2018-19 (Python/Java), 2019-20 (TypeScript/Go), 2020-21 (Python/JavaScript), 2022-23 (TypeScript/Java) and 2023-24 (Rust/Go). Nothing overlaps and nothing is clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black.
      Chrome: the title, subtitle, axis titles, tick labels and end labels flip to light ink and are clearly readable. The grid lines are subtle dark gray and still visible, and the axis lines are light. No text renders dark on dark.
      Data: line and marker colors are identical to the light render, and brand green remains clearly visible. The marker rings are filled with the dark page color, so they read as hollow rings exactly as in light.
      Legibility verdict: PASS
