review:
  strengths:
  - 'Radius-encoded rank prominence on markers (larger dot for #1, tapering to #6)
    is a distinctive, tasteful data-driven touch.'
  - Direct end-of-line entity labels, color-matched to each line, eliminate the need
    for a separate floating legend and reinforce the color-to-entity mapping (redundant
    encoding as the spec suggests).
  - Smooth Catmull-Rom interpolation gives the lines a polished FT/Economist-style
    bump-chart look, and stays correctly bounded within the rank range at every crossing
    (no overshoot artifacts checked at multiple crossing points).
  - Correct Imprint palette in canonical order across all 6 entities, identical data
    colors between light/dark renders, fully theme-adaptive chrome (background, grid,
    ticks, title).
  - 'Y-axis correctly inverted (rank 1 at top, #1..#6 tick format) exactly as the
    spec requires.'
  - 'Clean, deterministic, in-memory data; correct d3 browser-harness contract (svg
    sized from ANYPLOT_SIZE, no animation, single #container svg).'
  weaknesses:
  - The per-entity dot markers are drawn in a `for` loop using regex-sanitized CSS
    class selectors (`.dot-${d.entity.replace(/[^a-zA-Z0-9]/g, "")}`) instead of a
    single idiomatic D3 nested data join (bind a <g> per entity, then join circles
    inside it). Works correctly but is verbose and non-idiomatic — refactor to a flattened
    {entity, period, rank} array joined once, or a per-entity <g> group with a nested
    join.
  - 'Data Storytelling (DE-03) is implicit only (color + marker-size hierarchy) —
    no visual callout on the Netflix/Disney+ #1 swap at Q1 ''25, the chart''s most
    interesting inflection point. Not spec-mandated, but a subtle emphasis (e.g. a
    slightly heavier stroke or small annotation at the crossover) would raise the
    storytelling score.'
  - Data uses real named streaming platforms (Netflix, Disney+, HBO Max, Prime Video,
    Hulu, Apple TV+) with a specific fabricated quarterly rank-swap narrative. Directionally
    plausible but not verifiably factual for the exact quarters shown — consider grounding
    the narrative closer to well-known real trends, or note illustrative use of real
    brand names more clearly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bump-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered top. Y-axis labeled "Streaming Watch-Time Rank" (rotated), ticks "#1".."#6" top-to-bottom (correctly inverted, rank 1 at top). X-axis labeled "Quarter" with six tick labels ("Q1 '24".."Q2 '25"). Subtle horizontal rank gridlines. All text (title, axis titles, tick labels, end-of-line entity labels) is clearly readable against the light background — no light-on-light issues.
      Data: Six colored lines (Netflix green #009E73, Disney+ lavender, HBO Max blue, Prime Video ochre, Hulu red, Apple TV+ cyan) with Catmull-Rom-smoothed curves connecting circular markers at each of the 6 quarters. Marker radius decreases as rank number increases (largest at #1). Each line ends in a bold, color-matched text label naming the entity, acting as an inline legend. First series (Netflix) is the Imprint brand green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (near-white/soft-white) — clearly legible against the dark background. Gridlines are subtle and still visible. No dark-on-dark failures found on any text element (checked title, both axis titles, x/y tick labels, and the six color-matched end labels via a cropped close-up).
      Data: Same six line colors and marker sizes as the light render — confirmed identical hex values (only chrome flipped, data colors unchanged), matching the Imprint palette theme-invariance rule.
      Legibility verdict: PASS
