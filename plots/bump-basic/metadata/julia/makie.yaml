review:
  strengths:
  - 'Clean basic bump chart: one line per company through its rank at every quarter,
    dot markers in line color, no extra layers (C1, C4, C5)'
  - Rank axis inverted with the Axis attribute yreversed = true and integer ticks
    1–6 taken from the data (C2)
  - Page-colored marker rings keep the dots crisp where lines cross, in both themes
  - 'Theme tokens threaded through every chrome element: title, labels, ticks, spines,
    grid and legend all readable on #FAF8F1 and #1A1A17'
  - 'Data follows the adaptable layout: column constants, a DataFrame, categories
    and colors from unique() over the data'
  weaknesses:
  - 'Suggestion: legend entries could pair a LineElement with a MarkerElement so the
    key shows the line-plus-dot mark the plot draws.'
  - 'Suggestion: direct company labels at the right end of each line, which the Notes
    allow, would spare the reader the trip to the legend.'
