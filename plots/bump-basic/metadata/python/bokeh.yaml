review:
  strengths:
  - Direct end-of-line labels in series colors replace a legend
  - Ordinal rank ticks via CustomJSTickFormatter
  - Theme tokens on all chrome; both renders legible
  weaknesses:
  - 'SC-01 (both): three constructors are highlighted with 10 px lines and 38 px markers
    while two are faded to 5 px lines, 24 px markers and lower alpha; the basic variant
    excludes highlighted or faded lines → one equal line width, marker size and alpha
    for every entity. Likely cause: the highlight set and the is_highlight branches.'
  - 'VQ-02 (both): the end labels start at the Race 6 position and the final markers
    overprint them (''Red Bull Racing'', ''McLaren'', ''Aston Martin'') → labels start
    right of the marker, clear by at least 10 px. Likely cause: Label x=len(periods)-1
    puts the label at the left edge of the last factor; the factor centre is index
    + 0.5.'
  - 'VQ-05 (dark): a thin light rectangle frames the plot area on the #1A1A17 surface
    → no frame. Likely cause: the browser''s default page background shows through
    at the canvas edge; paint the document in PAGE_BG before the screenshot.'
  - 'Suggestion: gently curved segments between periods would soften the crossings.'
