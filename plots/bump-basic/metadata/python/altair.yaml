    text layers; column constants escaped once for Vega-Lite
  - Correct Imprint palette in canonical order with theme-adaptive chrome; identical
    data colors in both renders
  weaknesses:
  - 'VQ-05 (both): the bold end labels run past the plot view into the padding, and
    ''Man United'' ends about 16 px from the right canvas edge instead of the 40 px
    padding → keep the labels inside the chart''s padded area (about +24 px of room
    on the right). Likely cause: mark_text dx=14 at fontSize=14 bold beyond the last
    band while alt.Scale(padding=0.7) on the x axis leaves too little room for the
    longest label.'
  - 'Suggestion: tooltips on the point layer (team, week, position) would add a read-out
    in the HTML view.'
