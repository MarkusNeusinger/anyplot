review:
  strengths:
  - 'Clean basic bump chart: one line per team through its rank at every week, dot
    markers in the line color, and bold colored direct labels at Week 6 instead of
    a legend'
  - Rank axis reversed with half-rank padding derived from the data and integer ticks
    only, so the rank 1 and rank 6 markers sit clear of the frame
  - Fit autosize fills the 3200x1800 canvas; text sizes sit above the reference sizes
    and read well in both themes
  - Shared alt.X/alt.Y/alt.Color encoding objects reused across the line, point and
    text layers; column constants escaped once for Vega-Lite
  - Imprint palette in canonical order with theme-adaptive chrome; identical data
    colors in both renders
  weaknesses:
  - 'DQ-02 (both): real Premier League clubs (Arsenal, Chelsea, Liverpool, Man City,
    Man United, Tottenham) carry invented league positions → invented club names,
    or real standings from a stated season. Likely cause: the _teams list in the Data
    block.'
  - 'Suggestion: tooltips on the point layer (team, week, position) would add a read-out
    in the HTML view.'
