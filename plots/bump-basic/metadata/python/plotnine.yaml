review:
  strengths:
  - 'Clean basic bump chart: six lines at equal weight, every one passing through
    its rank at all eight quarters with a centered dot marker in its line''s color'
  - scale_y_reverse with breaks taken from the data's rank range puts rank 1 on top
    with ticks only at whole ranks
  - Direct end labels via a per-layer data= subset on geom_text identify every entity
    without a legend box; labels sit on distinct ranks and never collide
  - 'scale_color_manual with limits taken from df keeps the data order, so StreamVue
    gets #009E73 and the Imprint palette runs in canonical order, identical in both
    themes'
  - Theme tokens threaded through title, axis titles, ticks, grid and labels; both
    renders pass legibility
  - Column constants and a self-contained Data block ending in df make the file adaptable
    to a user's own table
  weaknesses:
  - 'VQ-01 (both): the direct end labels (WavePlay … EchoTV) render at about 6 pt,
    below the 8 pt tick-label reference, and read small beside the 8 pt tick labels
    although they are the only entity key → 8 pt (+2). Likely cause: geom_text(size=6).'
  - 'Suggestion: tightening the right x-limit slightly would trim the empty band to
    the right of the end labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "bump-basic · python · plotnine · anyplot.ai" centered at ~50% width; y-axis title "Market share rank", x-axis title "Quarter" in dark ink; tick labels 1–6 (inverted, 1 at top) and Q1'24–Q4'25 in INK_SOFT; subtle horizontal grid only. Direct end labels in dark ink right of the Q4'25 markers, one per rank, no collisions.
      Data: six equal-weight lines with dot markers at every quarter — StreamVue #009E73 (1→4), WavePlay #C475FD (2→1), CloudCast #4467A3, PixelFlix #BD8233, SonicNet #AE3030, EchoTV #2ABCCD (flat at 6). Crossings at Q3→Q4'24, Q1→Q2'25, Q3→Q4'25 clearly visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
