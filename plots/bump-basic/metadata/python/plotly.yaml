review:
  strengths:
  - Direct end-of-line labels in bold ink key every entity in both themes, so no legend
    lookup is needed
  - Inverted category-free rank axis (autorange='reversed', tickmode linear, dtick
    1) puts rank 1 on top with whole-number ticks only
  - Imprint palette in canonical order with Python on brand green; chrome threads
    theme tokens correctly in both renders
  - Page-colored marker halos keep dots distinct at each crossing
  - Tidy df with column constants and a groupby loop makes the file easy to adapt;
    the hovertemplate reads out the rank per year
  weaknesses:
  - 'Suggestion: drop the HTML range slider; on a basic bump chart it adds a control
    the spec does not ask for and earns no credit.'
