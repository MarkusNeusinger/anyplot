  strengths:
  - Direct color-matched end labels with a patheffects.withStroke halo key every driver
    without a legend
  - Inverted rank axis with whole-number ticks and limits derived from the data
  - Page-colored marker rings keep the dots distinct where lines cross, in both themes
  - 'Adaptable data block: tidy df with column constants, pivot_table drives lines
    and ticks'
  weaknesses:
  - 'SC-03 (both): the cubic spline swings past the ranks it connects — Hamilton rises
    above rank 1 (to about 0.8) between Suzuka–Shanghai and Imola–Monaco, Norris dips
    to about 3.7 between Imola and Monaco, and held ranks bow by about ±0.2 → curves
    that stay between their two ranks (0 overshoot). Likely cause: scipy CubicSpline;
    use PchipInterpolator or a per-segment sigmoid/straight segments.'
  - 'Suggestion: tighten the xlim right gutter (about 0.7 of a period sits empty beyond
    the longest label).'
