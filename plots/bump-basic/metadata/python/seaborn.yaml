review:
  strengths:
  - Figure-level sns.relplot(kind='line') with hue and style mapped to the same company
    column gives each entity a color and an automatic marker shape, a redundant encoding
    that stays CVD-safe
  - Bold end-of-line labels in each line's own color replace the legend and sit clear
    of markers and grid in both themes
  - Rank axis inverted with ticks at whole ranks derived from the data, x grid off
    and only the rank rows gridded
  - 'Imprint palette in canonical order with Apple #009E73 first; chrome flips correctly
    between #FAF8F1 and #1A1A17'
  - Clean Imports → constants → Data → Plot → Save structure with column constants
    that make the file adaptable to a user's table
  weaknesses:
  - 'DQ-03 (both): two quarters contradict the real quarter-end market caps: at Q2''24
    Apple is drawn at rank 1 and Microsoft at 2 although Microsoft (about $3.3T at
    end-June 2024) led Apple (about $3.2T), and at Q3''24 Nvidia is drawn at rank
    2 and Microsoft at 3 although Microsoft (about $3.2T at end-Sep 2024) led Nvidia
    (about $3.0T) → Q2''24 Microsoft 1, Apple 2; Q3''24 Apple 1, Microsoft 2, Nvidia
    3. Likely cause: the Q2''24 and Q3''24 entries of the Apple, Microsoft and Nvidia
    lists in ranks_data.'
  - 'Suggestion: the Amazon label in #4467A3 on the dark page is the lowest-contrast
    text of the dark render; a slightly heavier weight would help it stand beside
    the other labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "bump-basic · python · seaborn · anyplot.ai" in dark ink, top centre, about 45 % of the width; axis titles "Quarter" and "Market cap rank" in dark ink; ticks Q1'23-Q4'24 and 1-5 in soft ink; left and bottom spines only; subtle grid on the five rank rows. All readable.
      Data: five lines with outlined markers, rank 1 at the top: Apple #009E73 circles (1, dip to 2 at Q1'24, back to 1), Microsoft #C475FD crosses (2 → 1 at Q1'24 → 2 → 3), Amazon #4467A3 squares (4 → 5 → 4), Alphabet #BD8233 plus signs (3 → 5 → 4 → 5), Nvidia #AE3030 diamonds (5 → 3 → 2). Several crossings between Q4'23 and Q1'24. Bold end labels in line colors at the right, one per rank row, no collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light ink, ticks in light soft ink, light grey spines, subtle dark grid. No dark-on-dark text.
      Data: the five categorical colors and marker shapes are identical to the light render; brand green stays vivid; end labels readable, Amazon's blue the lowest contrast but legible.
      Legibility verdict: PASS
