review:
  strengths:
  - Figure-level sns.relplot(kind='line') with hue and style mapped to the same company
    column gives each entity a color and an automatic marker shape, a redundant encoding
    that stays CVD-safe
  - Bold end-of-line labels in each line's own color replace the legend and sit clear
    of markers and grid in both themes
  - Rank axis inverted with ticks at whole ranks derived from the data, x grid off
    and only the rank rows gridded
  - 'Imprint palette in canonical order with Apple #009E73 first; chrome flips correctly
    between #FAF8F1 and #1A1A17'
  - Clean Imports → constants → Data → Plot → Save structure with column constants
    that make the file adaptable to a user's table
  weaknesses:
  - 'DQ-03 (both): the Q3''23 and Q4''23 ranks contradict the real 2023 market caps:
    Microsoft is drawn at rank 1 although Apple (about $2.7T at end-Sep 2023, $3.0T
    at end-Dec) led Microsoft (about $2.3T / $2.8T), and Nvidia is drawn at rank 3
    although it (about $1.1T / $1.2T) sat below Alphabet and Amazon until early 2024
    → rank the five by their actual quarter-end market caps (Apple 1 and Microsoft
    2 through Q4''23, Nvidia 5 through Q4''23), or label the entities as invented.
    Likely cause: the ranks_data lists for Apple, Microsoft, Amazon, Alphabet and
    Nvidia.'
  - 'Suggestion: the Amazon label in #4467A3 on the dark page is the lowest-contrast
    text of the dark render; a slightly heavier weight would help it stand beside
    the other labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "bump-basic · python · seaborn · anyplot.ai" in dark ink at the top centre, about 45 % of the width; axis titles "Quarter" and "Market cap rank" in dark ink; ticks Q1'22–Q4'23 and 1–5 in soft ink; left and bottom spines only; subtle grid on the five rank rows. All readable.
      Data: five lines with markers, rank 1 at the top: Apple #009E73 circles (1 → 2 at Q3'23), Microsoft #C475FD crosses (2 → 1), Amazon #4467A3 squares (3 → 4 → 5), Alphabet #BD8233 plus signs (4 → 3 → 4), Nvidia #AE3030 diamonds (5 → 4 → 3). Markers have page-colored outlines; bold end labels in line colors at the right, one per rank row, no collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
