review:
  strengths:
  - Rank axis inverted with dict-format y_labels so rank 1 sits on top, ticks only
    at whole ranks
  - Livery semantic colours inside the Imprint palette, identical in both themes
  - value_formatter shows P-ranks in the interactive HTML tooltips
  weaknesses:
  - 'VQ-02 (both): the ''P5'' y tick label and the ''Bahrain'' x tick label nearly
    touch in the bottom-left corner → pad the rank range so P5 sits clear of the x
    axis (about +0.4 rank). Likely cause: min_scale=1/max_scale=5 with no range padding.'
  - 'VQ-03 (both): lines of about 6-12 px are thin on the 3200 px canvas, and Aston
    Martin''s thin lavender P5 line with small dots lies on the x-axis baseline →
    uniform strokes of about 14 px and dots of about 18 px. Likely cause: stroke_widths/dot_sizes_map
    per series.'
  - 'VQ-05 (both): y tick ''P1'' renders visibly smaller than ''P2''-''P5'' → one
    tick size for all ranks. Likely cause: label_font_size=56 vs major_label_font_size=44.'
  - 'SC-01 (both): per-entity stroke widths and dot sizes make McLaren a highlighted
    line, which the basic variant excludes (C5) → one uniform stroke and dot size
    for every entity. Likely cause: stroke_widths and dot_sizes_map.'
  - 'DQ-02 (both): real constructor and Grand Prix names carry invented standings
    (McLaren is P1 after Melbourne, which did not happen) → use the real standings
    of a season or fictional team names. Likely cause: the rankings dict.'
  - 'Suggestion: direct end-of-line team labels would let the reader identify lines
    without the legend.'
