review:
  strengths:
  - 'Physically grounded data generation: main-sequence luminosity follows a calibrated
    mass-luminosity relation (L ~ T^5.3) with the Sun landing exactly at (5778 K,
    1 L☉), and giant/supergiant/white-dwarf populations occupy realistic temperature/luminosity
    ranges'
  - 'Clean dual-channel encoding: marker shape carries region, per-point color carries
    spectral type, tied together by a combined legend and an explanatory subtitle'
  - 'Correct astrophysical axis conventions: reversed logarithmic x-axis (hot/blue
    left, cool/red right) and logarithmic y-axis for luminosity'
  - 'Both renders are fully theme-correct: identical data colors between light and
    dark, chrome (title, axis, ticks, grid, legend, Sun outline) flips correctly with
    no legibility failures'
  - Thoughtful, well-documented color-mapping trade-off given Imprint's fixed hue
    pool (hot O/B → blue family, cool M → red, matching the two strongest real-world
    spectral-color conventions)
  weaknesses:
  - '"Conventional colors" from the spec (white for A, yellow for F/G, orange for
    K) are only approximated (lavender, ochre/green, rose) because Imprint''s 7-hue
    pool has no white/yellow/orange — acceptable given house-style palette rules,
    but a documented partial spec deviation'
  - The O spectral class has a legend swatch (cyan) but zero stars ever reach the
    30,000 K classification threshold across all 300 generated points (max temperature
    ~28,220 K) — one of the seven legend entries never appears on the chart
  - xAxis has gridLineColor set but no gridLineWidth, so only horizontal (y-axis)
    gridlines render; the style guide recommends grid on both axes for scatter plots
  - Legend title concatenates two labels with manual whitespace ("Region (shape)      Spectral
    type (color)") instead of a cleaner two-part legend construction
  - Moderate marker overlap in the densest sub-clusters (main sequence F/G stars,
    red giants/K stars near the Sun's temperature range) slightly reduces per-point
    visibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "scatter-hr-diagram · javascript · highcharts · anyplot.ai" and subtitle "Synthetic stellar population · marker color = spectral type, shape = region" sit dark and clearly readable at the top with generous margin (verified via edge crop, no clipping). X-axis "Surface Temperature (K)" is reversed and logarithmic, running 32k -> ~3k left to right. Y-axis "Luminosity (L☉, log scale)" is logarithmic, running 0.00001 to 1M, fully visible with margin on the left edge. Only horizontal gridlines are drawn (subtle, light gray) — no vertical gridlines despite xAxis.gridLineColor being set (gridLineWidth defaults to 0). Legend at the bottom lists region shapes (Main sequence circle, Red giants diamond, Supergiants triangle, White dwarfs square, Sun reference) plus spectral-type color swatches (O cyan, B blue, A lavender, F ochre, G green, K rose, M red), all fully within the canvas with margin on the right (verified via edge crop).
      Data: ~300 points colored by spectral type and shaped by region, forming a clear diagonal main-sequence band plus distinct red-giant, supergiant, and white-dwarf clusters. The Sun is marked with a larger black-outlined circle and a "☉ Sun" data label. First class encountered in canonical OBAFGKM order (O) is cyan; the Sun's own G class is Imprint brand green #009E73. No O-class points actually appear in the data (confirmed by re-running the deterministic LCG: max generated temperature ≈28,220 K, below the 30,000 K O-class threshold) — a minor, astrophysically-plausible (O stars are genuinely rare) but real gap between the legend and the rendered data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: All chrome (title, subtitle, axis titles, tick labels, grid, legend text) flips to light/off-white and remains fully readable — no dark-on-dark failures. The Sun marker's outline flips from black (light theme) to white (dark theme) as expected.
      Data: Marker colors (cyan/blue/lavender/ochre/green/rose/red) are visually identical to the light render — only chrome flipped, confirming palette compliance across themes.
      Legibility verdict: PASS
