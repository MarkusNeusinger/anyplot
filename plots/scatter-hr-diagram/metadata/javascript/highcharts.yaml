review:
  strengths:
  - 'Physically grounded data generation: main sequence follows a calibrated mass-luminosity
    relation with the Sun correctly placed on the curve, and giant/supergiant/white-dwarf
    populations occupy realistic luminosity/temperature ranges'
  - Clean dual-channel encoding (marker shape = region, per-point color = spectral
    type) with a combined, legible legend explaining both
  - Reversed logarithmic x-axis and logarithmic y-axis correctly implement the astrophysical
    HR-diagram convention
  - 'Both renders are fully theme-correct: identical data colors, correctly flipped
    chrome, no legibility failures in either theme'
  - Thoughtful, well-documented color-mapping trade-off given Imprint's fixed 7-hue
    palette (hot O/B -> blue family, cool M -> red, matching the two strongest real-world
    conventions)
  weaknesses:
  - '"Conventional colors" from the spec (white for A, yellow for F/G, orange for
    K) are only approximated (lavender, ochre/green, rose) due to Imprint palette
    constraints - acceptable given house-style rules, but worth noting as a partial
    spec deviation'
  - Legend title concatenates two labels with manual spacing ("Region (shape)      Spectral
    type (color)") instead of a cleaner two-part or two-row legend construction
  - No explicit on-chart region labels/annotations for main sequence, red giants,
    supergiants, white dwarfs - regions are only distinguished via the legend and
    marker shape, not direct text pointers near the clusters
  - Some marker overlap in the densest sub-clusters (e.g. red giants near the Sun's
    temperature range) slightly reduces per-point visibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title, subtitle, axis titles, tick labels, and legend all render in dark ink and are clearly readable against the light background.
      Data: ~300 scatter points colored by spectral type (cyan O, blue B, lavender A, ochre F, green G, rose K, red M) and shaped by region (circle=main sequence, diamond=red giants, triangle=supergiants, square=white dwarfs). First Imprint palette color #009E73 (brand green) is used for the G spectral class, consistent with the semantic-exception color mapping documented in the code.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title, subtitle, axis titles, tick labels, and legend all flip to light/off-white text and remain fully readable. No dark-on-dark failures observed. Sun marker outline flips from black to white as expected.
      Data: Spectral-type and region marker colors are identical to the light render (cyan/blue/lavender/ochre/green/rose/red) - only chrome flipped, confirming palette compliance.
      Legibility verdict: PASS
