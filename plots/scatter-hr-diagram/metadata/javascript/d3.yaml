review:
  strengths:
  - Correctly reverses the X-axis (hot/blue on left, cool/red on right) and uses a
    log Y-axis for luminosity, exactly per the astrophysical convention required by
    the spec
  - All four HR-diagram regions (main sequence, red giants, supergiants, white dwarfs)
    are present, clearly separated, and italic-labeled directly on the plot without
    overlapping data or each other
  - Sun is marked as a visually distinct reference point (larger radius, ink-colored
    stroke, direct label) exactly as the spec requires
  - Distinctive, well-executed secondary top axis mapping temperature bands to spectral
    classes (O, B, A, F, G, K, M) — the spec's 'optional' feature, implemented cleanly
    with d3.axisTop + custom tickFormat
  - 'Data is physically realistic: Sun at 5772 K / 1 L_sun, main-sequence temperature-luminosity
    slope, giant/supergiant/white-dwarf regions all in plausible real-world ranges'
  - 'Clean, idiomatic D3: proper data-join pattern, deterministic seeded PRNG, no
    fake interactivity, no unused imports, explicit font sizes throughout'
  - No edge clipping, no text overlap, generous margins, plot fills the canvas well
    in both renders
  weaknesses:
  - 'Continuous color scale uses the Imprint diverging colormap (t.div: red-neutral-blue)
    for surface temperature, which is single-polarity magnitude data (2,000-40,000
    K) with no meaningful zero-crossing midpoint — per the style guide, single-polarity
    continuous data must use imprint_seq (green->blue), not imprint_div. Switch `d3.scaleSequentialLog(d3.interpolateRgbBasis(t.div))`
    to `d3.interpolateRgbBasis(t.seq)`.'
  - Spec explicitly asks for stars 'color-coded by spectral type using conventional
    colors (blue for O/B, white for A, yellow for F/G, orange for K, red for M)' —
    the implementation instead drives color from a continuous temperature gradient
    with only two hue endpoints (no white/yellow/orange ever appears), so the discrete
    conventional spectral-color scheme from the spec is not represented
  - The color legend only shows a 'Cool'/'Hot' gradient bar; it doesn't communicate
    the spectral-type color mapping the spec calls for, so a reader can't map a star's
    color back to its spectral class from the legend alone
  - Marker overlap is noticeable in the densest clusters (e.g. the red-giant clump
    near K/M) — slightly smaller radius or a touch more transparency would help separate
    overlapping stars there
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-hr-diagram · javascript · d3 · anyplot.ai" is bold dark text, centered, ~55% of canvas width, fully legible. X-axis "Surface Temperature (K)" and Y-axis "Luminosity (L / L_sun)" labels are dark ink and clearly readable. Tick labels (temperature: 40,000...3,000 reversed; luminosity: 0.0001...1,000,000 log scale) are soft dark gray, all legible with no overlap or clipping. Secondary top axis shows spectral classes O, B, A, F, G, K, M in bold, aligned with their representative temperature bands. Region labels ("Main sequence", "Red giants", "Supergiants", "White dwarfs") sit in italic soft-gray text in open space, none overlapping data points or other text. Gridlines (both axes) are faint and unobtrusive.
      Data: ~288 stars rendered as circles with a continuous red-to-blue gradient keyed to temperature (cool=red-ish, hot=blue), each with a subtle light-colored stroke for separation; the Sun is a larger circle with a dark ink stroke and a bold "Sun" label. A small horizontal gradient legend labeled "Cool"/"Hot" sits top-right.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no dark-on-dark or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all render in light (near-white/soft-gray) text, fully legible against the dark background. Secondary top axis (O–M) and region labels (italic soft-light gray) are legible and correctly flipped to light-on-dark. Gridlines are faint light lines, appropriately subtle. No dark-on-dark text found anywhere.
      Data: Same red-to-blue star colors and marker styling as the light render — confirmed identical data-color mapping (only chrome flipped: background, text, grid, legend). The Sun marker's stroke flips from dark ink to a light stroke, appropriately theme-adaptive.
      Legibility verdict: PASS — all text is clearly readable against the dark surface; brand data colors are unchanged between themes as required.
