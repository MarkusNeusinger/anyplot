review:
  strengths:
  - 'Correct HR-diagram astrophysics: x-axis reversed (hot/blue on left, cool/red
    on right), y-axis log scale, and realistic mass-luminosity clustering for all
    four regions (main sequence, red giants, supergiants, white dwarfs).'
  - 'Strong MUI X mastery: dual x-axis (temperature + secondary spectral-class overlay)
    built with custom tickInterval/valueFormatter, plus useXScale/useYScale hooks
    to place custom SVG annotation labels at exact data coordinates.'
  - Deterministic LCG-seeded data generation sized within the spec's 100-500 star
    range (281 points across 4 populations plus the Sun).
  - Thoughtful log-axis tick formatting (10^n superscript notation) and translucent
    backdrop boxes behind region labels keep them legible over the scattered points
    beneath.
  - 'Both themes render correctly: Imprint palette is identical between light/dark,
    backgrounds are the correct warm cream/near-black, and all chrome text stays legible
    in both themes.'
  weaknesses:
  - Spec requires 'Points should be color-coded by spectral type using conventional
    colors (blue for O/B, white for A, yellow for F/G, orange for K, red for M)',
    but the implementation colors points by region (main-sequence/red-giants/supergiants/white-dwarfs)
    instead — no per-point spectral-type color mapping exists anywhere. Consider coloring
    by spectral_type category (7 Imprint palette entries) while keeping the region
    annotations/labels for grouping, so both spec requirements are satisfied together.
  - The spec's `star_name` data field (identifiers for notable labeled stars) is never
    used — only the Sun gets a name label. Labeling 2-3 additional notable stars (e.g.
    a Sirius- or Betelgeuse-like point) would better fulfill the spec's data description
    and add storytelling value.
  - Main-sequence and red-giant clusters show moderate marker overplotting (e.g. the
    30-38k K / 10^3 L band, and the whole red-giant cluster) — a touch of alpha transparency
    on the denser series would improve individual-point visibility without changing
    the overall shape.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1 range) — matches the required light-mode surface, not pure white.
      Chrome: Title "scatter-hr-diagram · javascript · muix · anyplot.ai" is bold dark text, clearly readable. Bottom x-axis "Surface Temperature (K)" runs 40,000 K (left) down to 2,000 K (right) — correctly reversed per astrophysical convention. Top secondary x-axis "Spectral Class" shows O, B, A, F, G, K, M letters aligned above their boundary temperatures. Left y-axis "Luminosity (L / L☉, log scale)" runs 10⁻⁴ to 10⁶ with clean 10^n tick labels. Grid lines are subtle gray, visible but unobtrusive. All axis text, tick labels, and the title are dark and fully legible against the cream background.
      Data: Main sequence points are Imprint green (#009E73, palette[0]) forming the expected diagonal band; red giants are a light purple/lavender cluster (palette[1]) in the cool/luminous region; supergiants are steel blue (palette[2]) scattered at very high luminosity across all temperatures; white dwarfs are amber/orange (palette[3]) in the hot/faint region. The Sun is marked as a larger solid black dot (ink token) near (5,778 K, 1 L☉) with a "Sun" label above it. Region labels ("Main Sequence", "Red Giants", "Supergiants", "White Dwarfs") sit on translucent cream backdrop boxes so they stay readable over the data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17 range) — matches the required dark-mode surface, not pure black.
      Chrome: Title, both x-axes (bottom temperature + top spectral class), and the y-axis label all render in light/white text, clearly legible against the dark background. Grid lines are a subtle light gray, visible without dominating. No dark-on-dark text anywhere — all chrome correctly inverted from the light render.
      Data: Data colors are identical to the light render — green main sequence, purple red giants, blue supergiants, amber white dwarfs. The Sun marker flips to a white/light dot (ink token, theme-adaptive) with a "Sun" label, appropriately readable against the dark background. Region label backdrops flip to a translucent dark box so the light label text stays legible over the data.
      Legibility verdict: PASS
