review:
  strengths:
  - 'All six Notes requirements are met: the temperature axis is reversed with `reverse:
    true`, luminosity uses a `scaleType: "log"` y axis with superscript decade ticks
    (10⁻³ … 10⁶), points are colored by spectral type, the four regions are labeled
    at their own populations, the Sun is marked, and the optional spectral class letters
    sit on a secondary top x axis.'
  - 'The secondary spectral-class axis is idiomatic MUI X: a second x axis with `position:
    "top"` that shares the temperature domain and places each letter at the middle
    of its Harvard temperature range through `tickInterval` plus a `valueFormatter`.'
  - 'Spectral colors follow the semantic exception with documented reasoning: blue
    O, cyan B, lavender A, lime F, ochre G, rose K, matte-red M, so the bluest colors
    sit at the hot end and the reddest at the cool end, and every type stays distinguishable
    in both themes.'
  - 'The Sun stands out as a reference: a full-opacity ink dot with a thick 14 px
    ring and a larger bold label, plus its own legend entry. Sirius A, Rigel and Betelgeuse
    get thinner rings at their literature values.'
  - Region and star labels sit at their populations. The labels move instead of the
    marks, and a page-colored halo (`paintOrder="stroke"`) keeps them readable over
    the grid in both themes.
  - A custom SVG layer built with the `useXScale`, `useYScale` and `useDrawingArea`
    hooks inside the `ChartsDataProvider` composition, theme tokens on every chrome
    element, and `skipAnimation` for the harness.
  weaknesses:
  - 'Suggestion: the main sequence is sampled uniformly in temperature, so O and B
    dwarfs outnumber G, K and M dwarfs. Weighting the samples toward cool dwarfs would
    match the population a reader knows from real HR diagrams.'
  - 'Suggestion: the white dwarfs fill a flat rectangle of luminosity at every temperature.
    A narrow band sloping with T⁴ would look more like the observed white-dwarf sequence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area; subtle grey horizontal and vertical grid.
      Chrome: bold dark title "scatter-hr-diagram · javascript · muix · anyplot.ai" with a soft-ink subtitle "284 stars across 4 regions · colour: spectral type · ringed: named stars"; a horizontal legend (O, B, A, F, G, K, M, Sun); a top axis titled "Spectral type" with bold letters O, B, A, F, G, K, M; a bottom axis "Surface temperature (K)" running from 40,000 on the left to 4,000 on the right; a left log axis "Luminosity (L/L☉)" with ticks 10⁻³ … 10⁶. All text is dark on light and readable.
      Data: about 280 circles (alpha 0.8, page-colored outline): a diagonal main sequence from blue O stars at about 1e5 in the upper left to red M dwarfs at about 0.03 in the lower right; scattered cyan, lavender, lime and rose supergiants at 1e4–1e6 across the top; a rose/red red-giant clump at 3,400–5,200 K and 15–900 L☉; blue and cyan white dwarfs at 1e-4–0.02 along the bottom. Region labels in bold soft ink beside each population. The Sun is a black dot with a thick ring at 5,778 K, 1 L☉, labeled "Sun". Rigel, Betelgeuse and Sirius A are ringed and labeled. Brand green is not used, because the semantic spectral mapping replaces the canonical order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, with a subtle light grid.
      Chrome: title, subtitle, legend, axis titles, ticks and spectral letters all render light on dark; no dark-on-dark text. The region labels are soft light grey with a dark halo.
      Data: the spectral colors are identical to the light render. Only the reference star's chrome flips: the Sun dot and the rings use the near-white ink token. The dark-blue O stars are lower in contrast but clearly visible.
      Legibility verdict: PASS
