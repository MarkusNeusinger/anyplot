review:
  strengths:
  - 'Faithful, richly detailed HR diagram: reversed log-scale temperature axis, log-scale
    luminosity axis, four labeled regions (main sequence, red giants, supergiants,
    white dwarfs), the Sun marked as a distinct large reference point, three real
    named stars (Sirius A, Rigel, Betelgeuse) with astrophysically plausible temperature/luminosity
    values, and a secondary top axis mapping spectral-class boundaries (O/B/A/F/G/K/M)'
  - Sophisticated use of MUI X's useXScale/useYScale hooks to inject a custom SVG
    annotation layer (ChartAnnotations/LabelWithBackdrop) precisely anchored in data
    coordinates, with translucent page-colored backdrops that keep every label legible
    over the dense scatter regardless of what's directly behind it
  - Custom superscript power-of-ten formatting for the log luminosity axis plus a
    curated set of decade-only ticks avoids the crowded default d3 log-tick behavior
    across ~10 decades
  - 'Both light and dark renders are fully theme-adaptive: chrome (background, ink,
    grid, legend) flips correctly with no dark-on-dark or light-on-light failures,
    and all data colors are identical across themes'
  - Data is scientifically grounded across all four stellar populations, with a realistic
    mass-luminosity relation for the main sequence and correct real-world temperature/luminosity
    values for the notable stars and the Sun
  weaknesses:
  - 'First categorical series (spectral type O) uses palette[2] (blue) instead of
    the mandated #009E73 brand green — brand green is never used anywhere in the chart,
    violating the hard ''first series is always #009E73'' rule even though the astronomical-color
    rationale is a legitimate semantic exception for the remaining slots.'
  - The amber semantic anchor (t.amber) is applied to spectral type F purely because
    it visually resembles 'pale gold' — amber is reserved for warning/caution roles,
    not as a decorative stand-in when the 8-color categorical pool runs short.
  - 7 spectral-type categories are distinguished by hue alone with no redundant marker-shape/linestyle
    encoding; the style guide flags n=7 as being at the CVD discrimination floor.
    The x-axis temperature ordering partially compensates but doesn't fully substitute
    for the recommended redundant encoding.
  - At mobile scale (~400px) the dense axis tick labels (temperature ticks and power-of-ten
    luminosity ticks) become difficult to read, though the title and region labels
    remain legible.
  - The Red Giants cluster shows some inherent marker overlap despite alpha blending,
    since the underlying data is genuinely tightly clustered in that temperature/luminosity
    region.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-hr-diagram · javascript · muix · anyplot.ai" in bold dark ink top-left; a manually-built legend (colored dot + letter per spectral type O/B/A/F/G/K/M) top-right; dark-ink axis titles "Surface Temperature (K)" (bottom, reversed high→low) and "Luminosity (L / L☉, log scale)" (rotated, left); a secondary top axis labeled "Spectral Class" with O/B/A/F/G/K/M tick labels at the correct non-uniform temperature boundaries; subtle warm-grey grid lines on both axes. All chrome text reads clearly against the light background.
      Data: ~280 stars colored by spectral type (dark blue O, cyan B, lavender A, pale gold F, ochre G, rose K, matte red M) plotted with alpha ~0.78 and a thin page-colored stroke for definition. The Sun is a large near-black marker at (5778 K, 1 L☉). Three notable stars (Sirius A, Rigel, Betelgeuse) are marked with medium markers in their spectral color and labeled. Four regions (Main Sequence, Red Giants, Supergiants, White Dwarfs) carry text labels with translucent backdrops that stay legible over the scatter.
      Legibility verdict: PASS — all titles, axis labels, tick labels, legend, and annotation text are clearly readable against the light background; only the dense small tick labels lose some sharpness when the image is shrunk to mobile width, not a dark/light contrast failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render, but title, axis titles, tick labels, legend text, secondary spectral-class axis, and region-label text all render in light ink (near-white / light grey) against the dark background. Grid lines are subtle light-on-dark. The Sun marker becomes a large near-white circle for contrast against the dark page (still the same semantic "ink" token, correctly flipped).
      Data: All spectral-type marker colors (dark blue, cyan, lavender, pale gold, ochre, rose, matte red) are pixel-identical to the light render — only the chrome (background, text, grid) flipped, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, both axis titles, tick labels, legend, spectral-class ticks, region/star annotations) is clearly legible against the near-black background.
