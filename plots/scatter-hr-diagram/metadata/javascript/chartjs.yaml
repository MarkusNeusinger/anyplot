review:
  strengths:
  - 'All three attempt-1 weaknesses are fixed: points now carry a real spectral_type
    field colored by the spec''s conventional astronomical scheme (blue O/B, pale-cyan
    A, ochre F/G, amber K, red M) via a documented semantic-exception rationale, notable
    named stars (Sirius A, Sirius B, Betelgeuse, Rigel, Proxima Centauri) are labeled
    directly on the canvas, and the y-axis tick callback now formats luminosity as
    clean numbers ("700,000", "0.3", "0.0001") instead of the old four-decimal-zero
    output.'
  - Marker radius is scaled per region to real relative stellar size (white dwarfs=4,
    main sequence=5, red giants=11, supergiants=15), and the custom hrLabels plugin
    computes each region's log-space centroid to place italic region labels, with
    notable-star name placement flipping text alignment based on which half of the
    chart it falls in to avoid running off the plot.
  - X-axis is correctly reversed (hot/blue on left, cool/red on right) with a logarithmic
    y-axis for luminosity, exactly matching the astrophysical HR-diagram convention;
    both required region labels and the Sun reference point are present.
  - Theme-adaptive chrome is threaded through consistently — title/subtitle/legend/axis
    colors all use t.ink/t.inkSoft tokens, and marker borders use t.pageBg so filled
    spectral-group points get a background-colored ring rather than a hardcoded white
    edge, keeping them theme-correct on both surfaces.
  weaknesses:
  - The 'red giants' region label overlaps directly with two data markers (a K-type
    amber point and an M-type red point) in both renders — the word 'red' is visually
    cut through by the circles sitting in front of/behind it. Nudge REGION_LABEL_POS['red
    giants'] further up/left so the label clears the cluster's bounding box, not just
    its centroid.
  - The 'Rigel' notable-star label is drawn directly on top of Rigel's own marker
    circle instead of beside it, unlike the other notable-star labels which correctly
    offset left/right of their point. Apply the same px ± 12 offset logic used for
    the other notable stars so the name sits next to the marker, not stamped on it.
  - The Sun's star-shaped marker sits inside a dense, overlapping cluster of F/G (ochre)
    main-sequence points, and while its unique shape and ink color add some contrast,
    the reference point reads as visually cluttered rather than the 'distinct reference
    point' the spec calls for — consider a small halo/leader-line offset or rendering
    it after the label pass so it isn't nested among same-region circles.
  - Using the amber semantic anchor for the K spectral-color bucket is a defensible
    domain-convention substitute for 'orange' given the palette has no orange hex,
    but amber's documented role in the style guide is warning/caution, not a general-purpose
    color-family stand-in — worth a one-line note in code that this is a secondary
    reuse of the anchor, distinct from its primary semantic role.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Hertzsprung-Russell Diagram · scatter-hr-diagram · javascript · chartjs · anyplot.ai" is dark ink and fully visible, not clipped at any edge. The italic subtitle explaining the color mapping is dark-gray (inkSoft) and readable. X-axis title "Surface Temperature — hot → cool" and y-axis title "Luminosity (L☉, log scale)" are dark ink and clear. Tick labels (temperature in K, luminosity with clean number formatting like "700,000", "0.3", "0.0001") are legible soft-dark gray. Legend row (O/B, A, F/G, K, M, Sun) with point-style swatches is fully legible in dark ink. Grid lines are subtle light gray on both axes, visible but not competing with data.
      Data: Points are colored by spectral type using the conventional astronomical scheme — blue for O/B, pale cyan for A, ochre for F/G, amber for K, matte red for M — with marker radius scaled to each region's relative stellar size (small white dwarfs, large supergiants). The Sun is marked with a black star-shaped point sitting inside the dense F/G main-sequence cluster near 5,800 K / 1 L☉. Region labels ("main sequence", "red giants", "supergiants", "white dwarfs") and five notable named stars (Sirius A, Sirius B, Betelgeuse, Rigel, Proxima Centauri) are labeled directly in-plot. One legibility/overlap issue: the "red giants" label text is partially overlapped by two data markers, and the "Rigel" label sits directly on top of its own marker circle rather than beside it — both remain readable (dark text over lighter/mid-tone markers) but are visually crowded.
      Legibility verdict: PASS (all chrome and data-region text is readable against the light background; the two label/marker overlaps noted above are a polish issue, not a legibility failure — no text pixels are actually illegible).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, tick labels, and legend text all switch to light/off-white ink and remain clearly legible against the dark background — no dark-on-dark failures found anywhere, including the in-plot region and notable-star labels which correctly flip from dark ink to light ink. Grid lines are a subtle light-gray at low opacity, visible without dominating.
      Data: All data colors are pixel-identical to the light render (blue O/B, pale-cyan A, ochre F/G, amber K, red M, plus the black-ink Sun marker also flips to light ink) — confirms only chrome flips between themes, not data colors, per the palette rule. The same "red giants"/"Rigel" label-over-marker overlap observed in the light render is present here too, and remains readable (light text over the same markers) but visually crowded.
      Legibility verdict: PASS (all text readable against the dark background; no dark-on-dark or light-on-light failures found).
