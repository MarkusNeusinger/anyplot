review:
  strengths:
  - Bubble radius is intentionally scaled per region to real relative stellar size
    (small white dwarfs at radius 4, huge supergiants at radius 15) — a thoughtful
    astrophysical touch beyond generic scatter styling.
  - The Sun is marked with a distinct star-shaped point style colored from the theme
    ink token, so it stays visible as a reference point on both light and dark chrome.
  - X-axis is correctly reversed (hot on left, cool on right) with a log Y-axis for
    luminosity, matching the astrophysical HR-diagram convention exactly.
  - Regions are cleanly labeled via the legend with semantically chosen colors (red
    for red giants, blue for the hot white dwarfs), documented with a rationale comment
    in the code.
  weaknesses:
  - Spec explicitly requires points to be color-coded by spectral_type using conventional
    colors (blue O/B, white A, yellow F/G, orange K, red M). The implementation colors
    by region (main sequence / red giants / supergiants / white dwarfs) instead and
    never generates a spectral_type field at all — the mandated spectral-class coloring
    requirement is unmet.
  - Data model is missing two of the five spec-listed fields — spectral_type and star_name.
    No notable stars besides the Sun are labeled by name, which reduces feature/data
    coverage versus the spec's data section.
  - Y-axis (logarithmic) tick labels render with four trailing decimal zeros (e.g.
    "700,000.0000", "0.3000", "0.0001") — add a ticks.callback on the y scale (mirroring
    the existing x-axis callback) to format these as plain/compact numbers instead
    of the raw toString() output.
  - Optional secondary x-axis spectral-class labels (O, B, A, F, G, K, M) from the
    spec's 'Optional' note are not included — not a deduction on its own, but pairing
    it with a real spectral_type field would meaningfully strengthen spec compliance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Hertzsprung-Russell Diagram · scatter-hr-diagram · javascript · chartjs · anyplot.ai" is dark ink, fully visible and not clipped. X-axis title "Surface Temperature — hot → cool" and Y-axis title "Luminosity (L☉, log scale)" are dark ink and readable. Tick labels are a slightly softer dark gray (inkSoft), readable, though the Y-axis ticks show odd four-decimal formatting (e.g. "700,000.0000", "0.3000"). Legend row (main sequence, red giants, supergiants, white dwarfs, Sun) uses point-style swatches with dark ink text, all legible. Grid lines are subtle light-gray, visible but not dominant.
      Data: Main sequence points are brand green (#009E73, first categorical series as required), red giants are dark matte red, supergiants are lavender/purple, white dwarfs are blue, and the Sun is a black star-shaped marker sitting inside the dense main-sequence cluster near 5,800 K / 1 L☉. Marker sizes vary meaningfully by region (small white dwarfs, large supergiants), aiding readability of the density differences.
      Legibility verdict: PASS (all text readable against the light background; only the tick-number formatting is a cosmetic issue, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and legend text all render in light/off-white ink, clearly legible against the dark background — no dark-on-dark failures observed. Tick labels use a slightly dimmer light-gray (inkSoft) and remain readable. Grid lines are a subtle dark gray, visible without overpowering the plot.
      Data: All data colors are identical to the light render — main sequence green, red giants dark red, supergiants lavender, white dwarfs blue, Sun marker now rendered in the light ink color (white/off-white) so it remains visible against the dark backdrop. Confirms only chrome flips between themes, not data colors.
      Legibility verdict: PASS (all text readable against the dark background; no dark-on-dark or light-on-light failures found).
