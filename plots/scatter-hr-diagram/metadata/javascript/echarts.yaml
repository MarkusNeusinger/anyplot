    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent with the required light-theme surface.
      Chrome: Title "scatter-hr-diagram · javascript · echarts · anyplot.ai" is centered and fully legible in dark ink. Primary x-axis ("Surface Temperature (K)", reversed log scale, 45k on the left to 3k on the right) and y-axis ("Luminosity (L☉)", log scale, 1e-4 to 1e6) labels and tick labels are dark and clearly readable. A secondary category axis along the top shows spectral classes O/B/A/F/G/K/M in the same dark ink. Grid lines are subtle warm gray, visible but not dominant. Legend at the bottom lists O, B, A, F, G, K, M, and Sun with readable labels.
