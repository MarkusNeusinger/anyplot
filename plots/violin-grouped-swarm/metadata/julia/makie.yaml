review:
  strengths:
  - Custom beeswarm offset algorithm precisely mirrors Makie's internal violin dodge
    math, so swarm points align exactly under their violin's footprint -- a technically
    impressive detail many implementations miss.
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, ink-soft ticks, subtle 15%-opacity gridlines -- all text is legible
    in both themes with no dark-on-dark or light-on-light failures.'
  - First categorical series is Imprint brand green (#009E73), second is lavender
    (#C475FD) in canonical order, with a clean unframed legend labeled 'Expertise
    Level' matching the data.
  - Violin alpha (0.5) keeps swarm points fully visible through the fill per the spec's
    transparency requirement, and swarm marker size (6px) is appropriately restrained
    for the two-way grouped layout.
  weaknesses:
  - Unused `using Statistics` import -- no Statistics function (mean/median/std/etc.)
    is called anywhere in the script. Remove the import for clean imports (CQ-03).
  - Custom dodge/beeswarm math is re-implemented via three helper functions (`scale_width`,
    `shift_dodge`, `beeswarm_offsets`) -- justified for correct point alignment, but
    a stricter KISS reading would inline this math instead of defining functions (CQ-01).
  - Noticeable empty canvas space to the right of the 'Render' violin group before
    the legend column starts -- the plot area is underused on that side; consider
    tightening x-axis limits or widening the group spacing to fill the canvas more
    evenly (VQ-05).
  - Design excellence is solid but lacks a stronger focal emphasis -- e.g. a subtle
    annotation or accent on the standout 'Render/Junior' group (which has the widest
    spread) could sharpen the data storytelling (DE-03).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "violin-grouped-swarm · julia · makie · anyplot.ai" in dark ink, centered, clearly legible. Axis labels "Task Type" (x) and "Response Time (ms)" (y) in dark ink. Tick labels ("Search", "Compute", "Render" on x; "0", "200", "400" on y) in soft grey ink, clearly readable. Subtle horizontal gridlines at ~15% opacity. Top/right spines removed, left/bottom spines visible in soft grey. Legend "Expertise Level" with "Junior"/"Senior" swatches, unframed, positioned to the right of the plot.
      Data: Six violins (3 task types x 2 expertise levels), dodge-paired and alpha-blended (green = Junior, lavender = Senior) with a thin ink-soft stroke outline. Swarm points of matching hue are overlaid inside each violin's footprint, spread sideways via a custom beeswarm layout so points don't stack. First series (Junior) is Imprint brand green #009E73; second series (Senior) is lavender #C475FD.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Same title, now in light ink (#F0EFE8), clearly legible against the dark surface. Axis labels and tick labels rendered in light/soft-light ink, fully readable -- no dark-on-dark failures anywhere (title, axis labels, tick labels, and legend text all flip correctly). Gridlines remain subtle. Legend box unframed with light-colored label text.
      Data: Data colors are pixel-identical to the light render -- same green/lavender violins and swarm points, same layout, same dodge alignment. Only the chrome (background, text, spines, grid) flipped.
      Legibility verdict: PASS
