review:
  strengths:
  - Hand-built swarm layout bins each category-group cell by value and spreads points
    sideways, so every point sits at its true response time and is centered on its
    own dodged violin
  - Violin width tied to the dodge slot (slot * 0.95) leaves clear gaps between neighboring
    Junior and Senior violins in every category
  - Theme tokens threaded through every chrome element; both renders are fully legible
    and data colors identical
  - Column constants with !!NAME := and .data[[...]] keep the data block swappable,
    per the library prompt
  weaknesses:
  - 'Suggestion: in the densest value bins (Analysis Junior near 1350 ms and 1550
    ms) the swarm spreads into a single horizontal row wider than the violin; a finer
    bin_height or a smaller step would keep the rows inside the outline.'
  - 'Suggestion: a direct label or subtitle on how the Junior-Senior gap widens with
    task complexity would give the chart a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: title 'violin-grouped-swarm · r · ggplot2 · anyplot.ai' in dark ink at ~48% width; axis titles 'Task type' and 'Response time (ms)'; gray ticks 0-3000; legend 'Expertise level' at top with Junior/Senior keys (fill, outline and dot); no spines, thin y-only grid. All text readable.
      Data: Junior violins #009E73 and Senior #C475FD at alpha 0.4 for Data Entry, Analysis, Decision-Making; small hue-matched swarm points spread sideways and centered on their own violin; clear gaps between violins.
