review:
  strengths:
  - Axes-level sns.violinplot and sns.swarmplot share hue and palette, with dodge=True
    so every swarm column sits centered on its own group's violin
  - legend=False on the swarm layer keeps a single legend built from the violin patches,
    placed in the empty lower-right corner clear of all data
  - 'Theme tokens threaded through sns.set_theme rc and explicit tick/label colors:
    both renders are fully readable and the data colors are identical'
  - Exact 3200x1800 canvas from figsize=(8, 4.5) at dpi=400, with the style guide's
    12/10/8 pt text
  - Tidy data with column constants and a compact profiles table that is easy to swap
    for a real table
  weaknesses:
  - 'SC-03 (both): the violin KDE tails run past the data range, up to about 116 at
    Pattern Recognition Novice and down to about 8, although every score is clipped
    to 20-100, so the violins show scores no test taker can have → cut the density
    at the observed extremes (cut=0). Likely cause: sns.violinplot with the default
    cut=2.'
  - 'Suggestion: a slightly larger swarm marker (size 2.5-3) would let the green points
    read more strongly on the dark-green fill in the dark render.'
  - 'Suggestion: an inner quartile or median mark would add a summary layer the swarm
    alone does not give.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, canvas 3200x1800 px.
      Chrome: title 'violin-grouped-swarm · python · seaborn · anyplot.ai' (12 pt, dark ink, about 55 % of the width), axis titles 'Test Type' and 'Score' (10 pt), soft-ink ticks (8 pt), subtle horizontal grid, top/right spines removed; legend 'Experience' (Novice, Expert) on an elevated box in the empty lower-right corner. All text readable.
      Data: Reading Comprehension, Arithmetic and Pattern Recognition each carry a green #009E73 Novice violin and a purple #C475FD Expert violin side by side at alpha 0.5, with small dodged swarm points in the matching hue centered on each violin. Novice violins are wider and lower, Expert violins narrow and high. KDE tails extend to about 116 and 8 although scores are clipped to 20-100.
