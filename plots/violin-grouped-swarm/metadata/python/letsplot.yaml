      Data: per dose a green #009E73 Placebo violin and a lavender #C475FD Treatment violin side by side, alpha 0.5 fills with solid outlines, small hue-matched jittered points over each; treatment rises with dose, placebo stays near 3-4; KDE tails extend below 0 and to 11
