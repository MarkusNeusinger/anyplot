review:
  strengths:
  - Native position_dodge and position_jitterdodge with the same dodge width keep
    every swarm centred on its own violin
  - Theme tokens threaded through every chrome element; both renders read cleanly,
    legend on the elevated surface
  - 'Adaptable layout: column constants with role comments and the full Imprint palette
    mapped in order'
  - Interactive HTML output alongside the PNG
  weaknesses:
  - 'VQ-03 (both): swarm points at geom_point size 1.0 with alpha 0.6 read faint against
    their same-hue violin fill, most of all the green Placebo points on the dark-green
    fill in the dark render → size about 1.5 and alpha about 0.8 (+0.5 size, +0.2
    alpha). Likely cause: geom_point(alpha=0.6, size=1.0).'
  - 'SC-03 (both): trim=False extends the violin tails to about -0.7 and 11 on an
    efficacy score clipped to 1-10, so the violins show values the data does not have
    → trim the density at the data range. Likely cause: geom_violin(trim=False).'
  - 'Suggestion: a quantile line inside each violin (geom_violin draw_quantiles) would
    make the dose-response shift of the medians easier to read.'
  - 'Suggestion: a tooltip layout (layer_tooltips) naming dose, group and score would
    add value in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas
