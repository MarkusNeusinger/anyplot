review:
  strengths:
  - Violins are built from scipy's gaussian_kde and drawn as closed polygons in a
    single interrupted pygal XY series per group (allow_interruptions with None breaks),
    so the legend shows exactly one entry per group with a swatch matching the translucent
    violin fill
  - 'Translucent fills (opacity 0.45) with a solid outline in the group hue keep every
    swarm point visible in both themes, and Novice/Expert keep the same Imprint colors
    (#009E73, #C475FD) in every task category'
  - Swarm points sit exactly at their response-time values and spread sideways only,
    scaled to the local violin width so they stay inside their own violin, centered
    on the dodged group position
  - 'Theme tokens are threaded fully through the Style object: warm #FAF8F1 / #1A1A17
    surfaces, INK titles and ticks, INK_MUTED guides; both renders are fully legible'
  - Plausible response-time scenario (3 task types x 2 expertise levels, 40 observations
    each) matching the spec example, with the expected widening and right-shift for
    complex tasks and novices
  - Native pygal HTML output keeps hover tooltips on every swarm point for the interactive
    detail view
  weaknesses:
  - 'Suggestion: the bottom legend sits flush left under the y-axis; centering it
    under the plot area would balance it with the centered x-axis title.'
  - 'Suggestion: the empty band between 0 and about 120 ms could be trimmed by starting
    the value axis nearer the data minimum.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "violin-grouped-swarm · python · pygal · anyplot.ai" centered at top (~62% width), y-axis "Response Time (ms)" with ticks 0-2200, x-axis "Task Type" with Simple / Medium / Complex, dashed horizontal guides in muted ink, bottom-left legend Novice / Expert. All text dark and clearly readable.
      Data: per task, two side-by-side mirrored violins (Novice #009E73 green, Expert #C475FD lavender) with translucent fills and solid outlines; 40 swarm dots per violin in the matching hue, spread sideways within the violin outline. Violins do not touch. Novice distributions are higher and wider, Complex/Novice reaching ~2000 ms.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
