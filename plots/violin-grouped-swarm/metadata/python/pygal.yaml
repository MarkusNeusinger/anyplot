review:
  strengths:
  - 'Each task type shows one mirrored violin per expertise level, side by side with
    clear gaps. Novice is #009E73 and Expert is #C475FD in every category, and the
    bottom legend names both groups.'
  - 'The violin fills are translucent (opacity 0.45), so the swarm points in their
    own hue stay visible on both the #FAF8F1 and the #1A1A17 backgrounds.'
  - Every swarm point sits at its exact response time. Points spread only sideways,
    centered on their own group's violin, and use one small dot size.
  - 'The code uses native pygal interruptions: None separators with allow_interruptions=True
    put all violins of a group into one series. That gives one legend entry per group,
    and an unlabeled (None-titled) swarm series keeps the legend clean.'
  - Theme tokens are threaded through Style for both themes, and the HTML export keeps
    pygal's interactive tooltips.
  weaknesses:
  - 'CQ-01 (code): the plot block defines two helper functions, compute_kde and compute_swarm_positions
    → inline the work as flat code in the Plot zone (Imports → Data → Plot → Save,
    no functions). Likely cause: def compute_kde(...) and def compute_swarm_positions(...).'
  - 'CQ-04 (code): lines 46–54 write out a Gaussian KDE with Silverman''s bandwidth
    by hand → scipy.stats.gaussian_kde(values, bw_method=''silverman'')(grid) computes
    the same density in one call. Likely cause: the hand-rolled compute_kde body.'
  - 'VQ-05 (both): y-axis tick sizes are inverted. The major ticks 0, 1000 and 2000
    are drawn at 44 px, smaller than the minor ticks 200–2200 at 56 px, so the axis
    reads unevenly → one tick size on the y-axis, or major ticks at least as large
    as minor ones. Likely cause: major_label_font_size=44 below label_font_size=56.'
  - 'VQ-03 (both): the legend swatches are tiny squares of about 10 px next to 44
    px legend text, and the two entries sit far apart (Novice at the left edge, Expert
    mid-canvas) → swatches near the text height, entries placed together. Likely cause:
    pygal''s default legend_box_size with legend_at_bottom_columns=2 spanning the
    full width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area.
      Chrome: the title "violin-grouped-swarm · python · pygal · anyplot.ai" is centered at the top. The y-axis title is "Response Time (ms)" with ticks 0–2200. Major ticks 0/1000/2000 are smaller than the minor ticks, and the y gridlines are dotted. The x-axis title is "Task Type" with categories Simple / Medium / Complex. The legend at the bottom has Novice at the far left and Expert mid-canvas, with tiny swatches. All text is dark ink and readable.
      Data: three categories with two violins each. Novice is #009E73 (the first series) and Expert is #C475FD, both with translucent fills and a solid outline. About 40 swarm dots per violin in the matching hue, spread sideways inside each violin. Novice is consistently slower, and the gap widens with complexity (Complex Novice peaks near 1400 ms with a long tail to 2000 ms).
      Legibility verdict: PASS

