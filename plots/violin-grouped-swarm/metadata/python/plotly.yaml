review:
  strengths:
  - Violins placed at numeric dodged positions (go.Violin x=position, width=slot*0.92)
    keep both expertise groups side by side within each task with clear gaps between
    neighbours
  - legendgroup ties each violin to its swarm trace, so a legend click in the HTML
    toggles both together, and hovertemplate with customdata shows group, task and
    value per point
  - Swarm points in the violin's own hue with a thin page-colored outline stay distinct
    over the 0.45-opacity fills in both themes
  - Theme tokens threaded through title, axes, ticks, grid and legend; both renders
    fully legible
  - Realistic, neutral response-time scenario where the novice-expert gap widens with
    task complexity
  weaknesses:
  - 'SC-02 (both): the widest swarm rows spill past their violin outline (Complex/Novice
    row at about 680 ms, Moderate/Expert at about 330 ms, Complex/Expert at about
    555 ms), so the points do not fit the narrow grouped violins the spec asks for
    → keep each row within the violin width, for example finer value bands or a slightly
    smaller step so rows grow taller rather than wider. Likely cause: bin_height =
    range/45 groups many values into one band and the cap slot*0.36 exceeds the violin''s
    local half-width.'
  - 'Suggestion: the mean line inherits the trace opacity of 0.45 and reads as a faint
    grey dash; a clearer or omitted mean line would tidy the violins.'
  - 'Suggestion: the y-axis extends to 1400 ms only for the KDE tail above the 1200
    ms maximum; a tighter range would give the distributions more height.'
