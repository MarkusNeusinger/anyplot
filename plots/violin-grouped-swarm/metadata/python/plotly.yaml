review:
  strengths:
  - 'Swarm offsets are fitted inside each violin outline: the code reproduces Plotly''s
    Silverman KDE (min(std, IQR/1.349)) per violin and shrinks the row spacing where
    needed, so the points never spill past the outline even in the narrow Complex
    violins'
  - Every swarm point sits exactly at its response time; only the category direction
    carries the swarm offset, and each swarm is centered on its own group's dodged
    violin
  - legendgroup ties each violin to its swarm, so clicking Novice or Expert in the
    HTML legend toggles both together; the hovertemplate with customdata reports group,
    task and the value for each point
  - 'Translucent fills (opacity 0.45) with page-colored marker outlines keep the packed
    swarm points distinguishable in both themes; the Imprint #009E73 and #C475FD colors
    are identical across renders'
  - 'The data story is clear: the novice-expert gap and the novice spread grow from
    Simple to Complex tasks'
  weaknesses:
  - 'Suggestion: the clip to 1200 ms produces a Complex/Novice point that sits exactly
    on the ceiling; drawing without the hard upper clip (or with a skewed, log-normal
    response-time model) would avoid a value that looks artificial.'
  - 'Suggestion: the dashed mean lines are mostly hidden under the dense swarms; a
    slightly heavier line or dropping them would make the choice explicit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on both paper and plot area.
      Chrome: centered title "violin-grouped-swarm · python · plotly · anyplot.ai" in dark ink (~44% width); y-axis "Response time (ms)" 0-1400, x-axis "Task complexity" with Simple / Moderate / Complex; subtle horizontal grid, bottom axis line, no x grid; boxed legend top-left titled "Expertise level" with Novice / Expert swatches. All text readable.
      Data: three categories, each with two dodged violins — Novice in #009E73 and Expert in #C475FD, fills at 0.45 opacity, dashed ink mean lines — overlaid by 40 swarm points per violin in the violin's hue with thin page-colored outlines. The swarms stay inside the violin outlines; Complex/Novice is a tall narrow violin (570-1200 ms) with a mostly vertical swarm column.
