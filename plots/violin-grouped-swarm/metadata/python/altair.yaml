review:
  strengths:
  - Violins are computed in the Vega-Lite spec with transform_density and drawn as
    x/x2 areas around a dodged position, so each group's mirrored violin sits centred
    on its own swarm
  - 'Clean faceted layout: bottom-placed category labels replace the x axis, tuned
    facet spacing and an elevated legend panel read as one chart'
  - Theme tokens threaded through title, axes, headers and legend; both renders theme-correct
    with identical Imprint data colours
  - Canvas padded (never cropped) to exactly 3200x1800 with a shrink-to-fit guard
    for wider data
  weaknesses:
  - 'VQ-03 (both): swarm dots at size 110 (about 24 px) fill the narrow violins and
    fuse into one blob in Simple/Expert, so single observations cannot be told apart
    → about size 60 (-50). Likely cause: mark_circle(size=110).'
  - 'SC-02 (both): the swarm is uniform random jitter (±0.09), so dots stack on top
    of each other while free space stays empty; C4 asks for swarm points that fit
    the violins → spread dots by local density (offset scaled by each point''s KDE
    width) so they fill the violin. Likely cause: np.random.default_rng(7).uniform(-JITTER,
    JITTER).'
  - 'DQ-01 (both): violins end in flat cuts at the pooled data extent (Complex/Novice
    top at 11.2 s, Simple violins at 0.5 s) instead of tapering → set the density
    extent per group with some padding. Likely cause: transform_density without extent.'
  - 'DQ-03 (both): np.clip(…, 0.5, 15) piles several Simple-task observations onto
    exactly 0.5 s, a flat row of dots → generate positive times without clipping (e.g.
    a lognormal). Likely cause: np.clip on normal draws.'
  - 'CQ-04 (code): the colour encoding (lines 68-75 vs 104-111) and the y encoding
    (line 76 vs 93) are written twice → define them once and reuse with .legend(None)
    / the shared y_enc. Likely cause: separate encodings per layer.'
  - 'Suggestion: placing the ''Task type'' header title at the bottom with its labels
    would keep the category axis in one place.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, chart centred.
      Chrome: bold title 'violin-grouped-swarm · python · altair · anyplot.ai', facet header 'Task type' above, category labels Simple / Moderate / Complex below; y axis 'Response time (s)' 0-12 with subtle horizontal grid; legend 'Expertise' (Novice, Expert) in an elevated box at the right. All text dark and readable.
      Data: three facets, each with a green #009E73 Novice violin (alpha 0.5) and a lavender #C475FD Expert violin side by side with clear space; same-hue swarm dots at opacity 0.9 jittered over each violin. Dots are large and fuse in Simple/Expert; violins are flat-cut at 0.5 s and at 11.2 s (Complex/Novice).
      Legibility verdict: PASS

