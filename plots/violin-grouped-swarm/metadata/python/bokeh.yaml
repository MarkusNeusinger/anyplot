review:
  strengths:
  - Canvas lands exactly on 3200x1800 with toolbar_location=None, min_border_* reservations
    and the CDP viewport override, so every label sits inside the PNG
  - Grouped violins are dodged from the number of groups (slot = 0.8 / len(groups)),
    side by side within each task type with clear space between them
  - Mirrored KDE violins via scipy gaussian_kde drawn as bokeh patch glyphs with fill_alpha
    0.45, so the swarm points stay visible in both themes
  - Swarm points keep their exact response-time values and spread only sideways, clipped
    to the local violin width and centered on their own group's violin
  - Legend is built from LegendItem objects bound to the violin renderers, titled
    with the Expertise column and placed in the empty upper-left corner
  - HoverTool scoped to the swarm renderers only, with formatted tooltips for task
    type, expertise and response time in the HTML output
  - Theme tokens thread through all chrome; the Imprint colors are identical in both
    renders
  weaknesses:
  - 'Suggestion: legend labels at 30 pt could match the library prompt''s 34 pt legend
    starting value to sit closer in weight to the 34 pt tick labels.'
  - 'Suggestion: a categorical FactorRange with bokeh.transform.dodge would replace
    the numeric x range and the major_label_overrides.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot and the border; thin INK_SOFT plot outline.
      Chrome: bold title "violin-grouped-swarm · python · bokeh · anyplot.ai" top-left at about 56 % of the width; italic axis titles "Task type" (x) and "Response time (ms)" (y); tick labels Simple / Moderate / Complex and 0-700 in dark soft ink; grid very subtle; legend top-left on an elevated card with the title "Expertise" and the entries Novice / Expert. All text is readable and nothing is clipped.
      Data: six mirrored violins, Novice in #009E73 and Expert in #C475FD at about 45 % fill alpha with solid outlines, dodged left and right within each task type; 40 swarm points per violin in the violin's hue with a page-colored outline, spread sideways at their values. The response time rises with task complexity and Experts sit below Novices in every category.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; outline and axes in light soft ink.
      Chrome: the title and axis titles are near-white, the tick labels light grey, the legend card dark elevated (#242420) with light text. No dark-on-dark text anywhere.
      Data: the same #009E73 / #C475FD violins and points as in the light render (only the translucent fill reads darker over the dark page); the points carry a dark outline and stay visible inside the violins.
      Legibility verdict: PASS
