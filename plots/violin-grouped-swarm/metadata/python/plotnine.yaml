      Data: three task types, each with two dodged violins: Expert in #C475FD on the left, Novice in #009E73 on the right, translucent fills (alpha 0.45) with INK_SOFT outlines; small same-hue jittered points over each violin, centered on it, a few spilling past the narrow tails. Novice is always slower and Complex the widest spread.
      Legibility verdict: PASS

