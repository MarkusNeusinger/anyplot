review:
  strengths:
  - position_jitterdodge(dodge_width=0.8) matches the violins' position_dodge(width=0.8),
    so every point sits centered on its own group's violin and keeps its exact value
    (jitter_height=0)
  - 'Imprint palette applied through scale_fill_manual/scale_color_manual with limits
    taken from the data, so Novice gets #009E73 and the same hue in every task type;
    colors identical in both themes'
  - 'Theme tokens threaded through every chrome element: light and dark renders are
    both fully legible, violin outlines in INK_SOFT stay visible on both surfaces'
  - Value-axis-only grid (panel_grid_major_x removed, minor grid off) and an L-shaped
    axis frame keep the chart quiet around the violins
  - Canvas exactly 3200x1800 with the style guide's 12/10/8 pt sizes; column constants
    and a replaceable data block keep the file adaptable
  weaknesses:
  - 'SC-02 (both): the swarm is uniform random jitter (±0.12 dodge units), not a swarm,
    so at the narrow violin tails points land outside the silhouette (Complex Expert
    near 1380 ms and Moderate Expert near 850 ms sit right of their violin tips),
    against C4''s points that fit the narrow violins → place points by the violin''s
    density so they stay inside it. Likely cause: position_jitterdodge(jitter_width=0.12)
    instead of plotnine''s geom_sina(position=position_dodge(0.8)).'
  - 'VQ-03 (both): swarm points at size 1.1 with stroke=0 read as specks for 40 points
    per group, weakest as purple dots on the purple fill in the dark render → about
    size 1.6–2.0 (+0.5 to +0.9), still smaller than a single-category swarm. Likely
    cause: geom_point(size=1.1).'
  - 'VQ-05 (both): the legend frame hugs the entry labels, with the end of "Novice"
    almost touching the right border, and the box sits close to the canvas edge →
    a few points of inner padding. Likely cause: legend_background frame with default
    legend_margin.'
  - 'Suggestion: the dodge places Expert left of Novice (alphabetical factor order)
    while the legend lists Novice first; ordering the group factor by group_order
    would make legend and violin order agree.'
  - 'Suggestion: the value axis carries only two ticks (500, 1000) over a 200–1450
    ms range; a break every 250 ms would make reading values easier.'
  image_description: |-
