review:
  strengths:
  - Grouped violin + swarm has no native MUI X component, so the implementation composes
    it correctly via ChartContainer + useXScale/useYScale/useDrawingArea hooks — the
    library's own documented pattern for unsupported chart types.
  - Gaussian KDE is computed per cell on a local grid (data range ± 3 bandwidths,
    clipped to the shared axis domain) rather than the full shared axis span, avoiding
    a near-invisible hairline tail for narrow-spread cells like Data Entry.
  - Beeswarm packing is a genuine pixel-space collision-avoidance algorithm (sorted
    by value, pushed sideways only on overlap, capped at maxHalfWidth), not a jittered
    scatter — points stay inside the violin envelope in both renders.
  - Swarm points correctly match violin hue at fillOpacity 0.85 with a pageBg stroke
    for separation; violin fillOpacity 0.45 sits inside the spec's 0.4-0.6 transparency
    range.
  - 'Data tells a real story: the Junior/Senior gap is wide for Bug Triage and Data
    Entry but nearly closes for Code Review, and both renders show this clearly without
    needing an annotation.'
  - Custom Y-axis label component sidesteps MUI X's fixed-offset yAxis label (which
    doesn't grow with 3-digit tick width) using useDrawingArea — a well-reasoned workaround
    documented in a comment.
  - Deterministic LCG + Box-Muller PRNG (seed 42) with clamped output makes the run
    fully reproducible.
  - Median line and swarm points both correctly use theme-adaptive tokens (t.ink,
    t.pageBg) so they read correctly in both light and dark renders.
  weaknesses:
  - Bug Triage-Junior and Code Review cells pack 40 swarm points into a narrow slot
    width, producing visibly dense clusters near the violin's widest band — still
    individually distinguishable thanks to the pageBg stroke, but a touch more breathing
    room (slightly smaller markerRadius or a wider swarmMaxHalfWidth) would improve
    clarity at high density.
  - The mandated title is rendered notably narrower (~32% of canvas width) than the
    ~70-85% band other chart families typically reach at their default fontsize; not
    a violation (no overflow, no squeeze) but there's headroom to size the title a
    bit more prominently within the 50-70% target band.
  - No axis-level or annotation-based callout draws attention to the standout finding
    (Code Review's narrowing Junior/Senior gap) — the pattern is visible but not deliberately
    emphasized as a focal point.
  - The median line uses a flat 0.6 stroke opacity in both themes; on the dark render
    it reads a little faint against the violin fill at a glance — a touch more opacity
    or a slightly heavier stroke would make it pop more consistently.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "violin-grouped-swarm · javascript · muix · anyplot.ai" in dark ink top-left; legend row below it with green "Junior" and lavender "Senior" swatches; y-axis title "Resolution Time (s)" rotated along the left edge; x-axis title "Task Type" centered below the three category labels (Bug Triage, Data Entry, Code Review); horizontal gridlines subtle at low opacity. All chrome text is dark-on-light and clearly legible, no clipping at any edge.
      Data: Three category bands each holding two dodged violins (green = Junior, lavender = Senior) with semi-transparent fills, a darker horizontal median tick inside each violin, and individual swarm points colored to match their violin and outlined with a thin page-background stroke so overlapping points stay separable. First series is the brand green #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink/off-white against the dark surface; gridlines still subtle. No dark-on-dark text anywhere — title, tick labels, axis titles, and legend text are all clearly legible.
      Data: Identical violin/swarm geometry and colors to the light render — green and lavender hues unchanged, confirming only chrome (background, text, grid, median-line stroke via the ink token) adapted to the theme, exactly as required.
      Legibility verdict: PASS
