review:
  strengths:
  - Custom per-cell Gaussian KDE (Silverman bandwidth, local grid clipped to each
    cell's own range) avoids the hairline-tail artifact a shared full-axis grid would
    produce for narrow-spread cells like Data Entry
  - Genuine beeswarm packing algorithm in pixel space (sorted, collision-avoidant,
    capped at maxHalfWidth) rather than jittered/random scatter — points stay inside
    their violin and don't collide
  - Data-driven annotation (bracket + label calling out the narrowing Junior/Senior
    gap on Code Review) is real data storytelling, not decoration, and is placed in
    the padding zone above Y_MAX so it never collides with violin peaks or swarm points
  - Custom Y-axis label component correctly sidesteps MUI X's fixed-offset label crowding
    the 3-digit tick values — a real, documented pain point handled well
  - First series is brand green (#009E73), second is lavender (#C475FD) — correct
    canonical Imprint order; identical data colors between light/dark, only chrome
    flips
  - Violin alpha (0.45) sits in the spec's 4-0.6 range, keeping swarm points visible
    through the fill; swarm points carry a pageBg stroke for separation against overlapping
    violins
  - Deterministic LCG + Box-Muller data generation, realistic support-ticket domain
    framing with a plausible Junior/Senior skill-gap narrative
  weaknesses:
  - The 'Junior/Senior gap narrows' annotation is set at fontSize 11 (CSS px) — legible
    at full resolution but effectively unreadable once the plot is scaled down to
    the ~400px mobile thumbnail; bump to ~13-14px or accept it as a full-size-only
    affordance
  - The custom composition (kde, layoutSwarmForCell, GapAnnotation, YAxisLabel, GroupedViolinSwarm)
    is inherently function-heavy for a from-scratch violin+swarm chart type MUI X
    doesn't ship — justified by the library gap, but a couple of the smaller helpers
    (clamp, stdOf) could be inlined to trim surface area
  - Distinctive-feature usage leans on one custom composition technique (SVG layer
    over ChartContainer); no additional MUI X-native capability (e.g. tooltip customization,
    zoom) is layered on top to further showcase the library beyond the base composition
    pattern
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-grouped-swarm · javascript · muix · anyplot.ai" in dark ink, top-left legend (green "Junior" swatch, purple "Senior" swatch), x-axis "Task Type" with three category labels (Bug Triage, Data Entry, Code Review), y-axis "Resolution Time (s)" with 20-200 tick labels, subtle horizontal grid lines. All chrome text reads clearly dark-on-light.
      Data: Three grouped violin pairs (green Junior / lavender Senior), each with a dark median line and overlaid swarm points colored to match their violin, plus an italic annotation bracket over the Code Review pair reading "Junior/Senior gap narrows". First series is Imprint brand green (#009E73), second is Imprint lavender — correct canonical order.
      Legibility verdict: PASS (the small italic annotation text is readable at full resolution; see weaknesses for its behavior at mobile thumbnail scale).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as light; title, legend text, axis labels, tick labels, and grid lines all flip to light ink/lines against the dark background. No dark-on-dark or illegible text detected anywhere.
      Data: Violin and swarm colors are identical to the light render (green/lavender), confirming only chrome adapted to theme. Median lines render in light ink so they stay visible against the dark violin fills.
      Legibility verdict: PASS.
