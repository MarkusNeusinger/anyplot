review:
  strengths:
  - Composes the grouped violins and swarms as a custom SVG layer inside ChartsContainer,
    drawn through the chart's own band and linear scales via useXScale/useYScale/useDrawingArea,
    so ChartsGrid and both ChartsXAxis/ChartsYAxis stay native and aligned with the
    marks
  - Groups are dodged side by side within each category band (GROUP_SPAN 0.84, violin
    half-width 0.44 of a slot) with clear space between neighboring violins in all
    three task types
  - Violin fills at fillOpacity 0.4 with a solid 1.75 px outline in the group hue;
    swarm points in the same hue with a thin page-colored outline stay legible over
    the fills in both themes
  - Beeswarm keeps every point at its exact value and only moves it sideways around
    its own violin center; the KDE tails taper just past the data (1.5 bandwidths)
  - 'Junior #009E73 and Senior #C475FD follow the Imprint canonical order and are
    identical across both renders; median lines use the ink token and flip correctly
    (black on light, near-white on dark)'
  - 'Data story is plausible and informative: juniors slower and more variable on
    bug triage and data entry, the gap nearly closing on code review, including a
    low-tail cluster on junior bug triage that shows the violin''s shape value'
  - 'Typographic hierarchy: bold title, a soft-ink subtitle that states n and explains
    the median line, an inline legend with its own title, and an italic soft-ink callout
    that points the viewer to the closest-median category'
  weaknesses:
  - 'Suggestion: the x-axis title ''Task type'' sits about 60 px below the category
    tick labels; a smaller x-axis band (height about 56 instead of 72) would tie it
    closer to the axis.'
  - 'Suggestion: the legend could use the native ChartsLegend inside a ChartsDataProvider
    with custom series entries instead of hand-built HTML swatches, to show more of
    the MUI X surface.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold title "violin-grouped-swarm · javascript · muix · anyplot.ai" top left (~36 % of width), soft-ink subtitle "240 observations, 3 task types × 2 agent levels · line: median", inline legend "Agent level ● Junior ● Senior". Y axis "Resolution time (s)" 20–220 with soft ticks, subtle horizontal grid; x axis "Task type" with Bug Triage, Data Entry, Code Review. Italic callout "Closest medians: 13.8 s apart" with a bracket over Code Review. All text dark on light and readable.
      Data: six violins, Junior in #009E73 and Senior in #C475FD, translucent fills with solid outlines, dodged side by side per category; 40 swarm points per violin in the matching hue with thin page-colored outlines; black median line per violin. No clipping.
      Legibility verdict: PASS

