review:
  strengths:
  - Fixed the attempt-1 stray vertical axis-line artifact by explicitly setting axisLine.onZero:false
    on both xAxis and yAxis — the plot area is now clean in both renders
  - Custom KDE (Silverman bandwidth) drives the violin polygons via an ECharts custom
    series with proper renderItem/api.coord usage, giving accurate mirrored-density
    shapes
  - Deterministic swarm dodge (binning + alternating rank) produces clearly separated,
    white-bordered points that visibly reveal the raw distribution under each violin
  - New markLine annotation (median-to-median delta on the widest Junior/Senior split,
    'Debugging') adds a genuine data-storytelling focal point beyond 'read the chart
    yourself'
  - 'Exact Imprint palette and theme-background compliance verified by pixel sampling:
    light bg (250,248,241)=#FAF8F1, dark bg (26,26,23)=#1A1A17, Junior=#009E73 identical
    across both themes'
  - Deterministic, reproducible data via fixed-seed LCG + Box-Muller; realistic response-time
    domain with sensible junior/senior/task-type differences
  weaknesses:
  - The markLine dashed connector for the Debugging-category delta crosses directly
    through both violin bodies and grazes nearby swarm points — a slightly cleaner
    routing (e.g. offset outside the violin outlines) would avoid any data overlap
  - 'Distinctive-feature usage is improved but still moderate: beyond the custom series
    + scatter + single markLine, there is room for further ECharts-specific polish
    (e.g. markPoint medians per group, richer tooltip formatting) to fully showcase
    library mastery'
  - Data-storytelling emphasis is limited to one category (Debugging); the other two
    category gaps are left entirely to the viewer to interpret unaided
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (250,248,241) = exact #FAF8F1 match — not pure white, not dark.
      Chrome: Title "violin-grouped-swarm · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend ("Junior" green swatch, "Senior" purple swatch) centered below the title, no overlap with title. X-axis title "Task Type" and Y-axis title "Response Time (seconds)" both present with units, balanced font sizes. Tick labels (0-60 on Y in steps of 10; Data Entry/Debugging/Code Review on X) all readable in soft dark ink. Horizontal gridlines are subtle and only on the Y-axis. No stray axis-line artifact this time (the attempt-1 onZero bug is fixed) — grid area is clean.
      Data: Three category groups (Data Entry, Debugging, Code Review) each showing two mirrored violin shapes (Junior=green #009E73, Senior=lavender #C475FD) with swarm points of matching color, white-bordered, overlaid inside each violin. Violins are semi-transparent (opacity 0.5) so points are visible through the fill. A dashed median-to-median callout line with "Δ 13.5s" label highlights the Junior/Senior gap on Debugging, the category with the widest split. Debugging shows the largest values and largest Junior/Senior gap; Data Entry the smallest values and tightest spread.
      Legibility verdict: PASS (all text readable, no overlap issues, no clipped elements).

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel (26,26,23) = exact #1A1A17 match — not pure black, not light.
      Chrome: Same title, legend, and axis titles rendered in light ink, clearly legible against the dark background. Tick labels in soft light ink, readable, no dark-on-dark failures observed anywhere (title, axis names, tick labels, legend text, delta-line label all pass). Gridlines subtle but visible.
      Data: Data colors are pixel-identical to the light render — Junior green #009E73, Senior lavender #C475FD — confirming the palette does not shift between themes; only chrome (background/text/grid/markLine color) flips as expected (white dashed line + white label text on dark vs. black on light).
      Legibility verdict: PASS (all text readable in both themes; no dark-on-dark issues found; brand green reads well on both surfaces).
