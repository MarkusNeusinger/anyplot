review:
  strengths:
  - Custom KDE (Silverman bandwidth) drives the violin polygons via an ECharts custom
    series with proper renderItem/api.coord usage — accurate density shapes rather
    than approximations
  - Deterministic swarm dodge (binning + alternating rank) produces readable, non-overlapping
    point clouds that visibly reveal the raw distribution under each violin
  - 'Correct Imprint palette compliance: Junior = #009E73 (position 1), Senior = lavender
    (position 2), identical across light and dark themes'
  - Violin transparency (opacity 0.5) sits inside the spec's 0.4-0.6 range, keeping
    swarm points clearly visible through the violin fill
  - Adequate spacing between grouped violins (GROUP_GAP) and category slots prevents
    cross-category or cross-group overlap
  - Y-axis max is derived explicitly from the full KDE tail extent rather than an
    auto-scaled 'nice' range, avoiding clipped violin tips
  - Realistic, semantically coherent synthetic data (junior vs. senior response times
    per task type) with plausible, well-separated values
  weaknesses:
  - 'A stray vertical line renders through the plot area at x=0 (the ''Data Entry''
    category center), running the full chart height and crossing directly through
    the gap between the Junior and Senior violins/swarm points. Cause: both xAxis
    and yAxis are type ''value'', so ECharts'' default axisLine.onZero:true snaps
    the yAxis line to the x=0 crossing point instead of the grid boundary. Fix: add
    axisLine: { onZero: false } to the yAxis config (and, for safety, to the xAxis
    config too) so both axis lines stay at the grid edges instead of the zero-crossing.
    Visible in both light and dark renders.'
  - Visual storytelling is competent but generic — the clear Junior/Senior gap on
    'Debugging' (the widest split) isn't emphasized in any way; a light annotation
    or subtle callout would raise the data-storytelling focal point beyond 'read the
    chart yourself'
  - Distinctive-feature usage stays close to the minimum viable custom-series + scatter
    combination; consider leveraging additional ECharts-specific polish (e.g. a markLine/markArea
    for group medians, or per-violin outline styling keyed to hue) to demonstrate
    deeper library mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-grouped-swarm · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend ("Junior" green swatch, "Senior" purple swatch) centered below the title. X-axis title "Task Type" and Y-axis title "Response Time (seconds)" both present with units. Tick labels (0-60 on Y, Data Entry/Debugging/Code Review on X) all readable in soft dark ink against the light background. Horizontal gridlines are subtle. NOTE: an unintended vertical line runs the full height of the plot at x=0 (through the "Data Entry" category, between its two violins) — this is a rendering artifact from ECharts' default axisLine.onZero behavior, not an intentional gridline (splitLine is disabled on the x-axis).
      Data: Three category groups (Data Entry, Debugging, Code Review) each showing two mirrored violin shapes (Junior=green #009E73, Senior=lavender) with swarm points of matching color overlaid inside each violin. Violins are semi-transparent so points are visible through the fill. Debugging shows the largest values and largest Junior/Senior gap; Data Entry the smallest values and tightest spread.
      Legibility verdict: PASS (all text readable; the stray vertical line is a layout defect, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis titles rendered in light ink, clearly legible against the dark background. Tick labels in soft light ink, readable, no dark-on-dark failures observed. Gridlines subtle but visible.
      Data: Data colors are identical to the light render — Junior green #009E73, Senior lavender — confirming the palette does not shift between themes; only chrome (background/text/grid) flips as expected. The same stray vertical axis-line artifact at x=0 is present, slightly less prominent against the dark background but still visible running the full plot height through the "Data Entry" category gap.
      Legibility verdict: PASS (all text readable in both themes; no dark-on-dark issues found).
