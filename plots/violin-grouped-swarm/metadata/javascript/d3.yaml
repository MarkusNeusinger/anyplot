review:
  strengths:
  - Custom Epanechnikov KDE with per-violin, bandwidth-clipped sample grids — avoids
    the common "thin needle tail" artifact from using a shared axis-wide grid
  - Genuine beeswarm collision-avoidance algorithm (nearest-neighbor candidate search,
    not a naive random jitter), correctly dodging points to their violin's position
    per the spec's dodging note
  - Alpha 0.5 on violins keeps swarm points fully visible, matching the spec's 0.4-0.6
    guidance precisely
  - Theme tokens correctly threaded through every chrome element (axis text/lines,
    grid, title) in both light and dark renders, with identical underlying data hues
  weaknesses:
  - Swarm point radius (3.2px) is on the small side for the Moderate/Complex categories
    where points cluster densely near the median, causing some visual merging into
    blobs
  - Legend swatches and overall styling are functional but generic — a bit more typographic/spacing
    refinement would lift Design Excellence
  - Legend horizontal offset is hard-coded to the current two-label case (fine here,
    but a fixed assumption)
  image_description: |-
