review:
  strengths:
  - 'Clever workaround for the missing highcharts-more/boxplot module: mirrored `area`
    series filled from a `threshold` center line out to a Gaussian-KDE curve on each
    side, producing a genuine violin silhouette from the core bundle only'
  - Correct Imprint palette usage — Novice = palette[0] (#009E73), Expert = palette[1]
    (purple) — with data colors identical between light and dark renders
  - 'Exact theme-correct backgrounds confirmed by pixel sampling: #FAF8F1 (light)
    and #1A1A17 (dark)'
  - Deterministic seeded LCG random generator, realistic reaction-time cognitive-task
    scenario (Visual Search / Pattern Matching / Sequence Recall x Novice / Expert)
    with plausible ms-scale values
  - Well-built beeswarm dodge algorithm (binned offset spreading) keeps swarm points
    from overlapping within each violin
  - Correct title format, descriptive axis labels with units, clean legend
  weaknesses:
  - 'CRITICAL — two of the six required category x group violins (plus their swarm
    points) are rendered completely off the 3200x1800 canvas and are 100% invisible
    in BOTH plot-light.png and plot-dark.png: ''Visual Search x Novice'' (center=-0.85)
    and ''Sequence Recall x Expert'' (center=7.65). Pixel measurement confirms the
    yAxis''s effective rendered extent is clamped to exactly [0, 6.8] — the first
    and last values of `tickPositions` — instead of the configured `min: -1.8` / `max:
    8.7`. This is almost certainly because `startOnTick`/`endOnTick` default to `true`
    and, combined with an explicit `tickPositions` array, Highcharts snaps the rendered
    axis bounds to the first/last tick rather than honoring the wider min/max buffer.
    Fix: set `startOnTick: false, endOnTick: false` on the yAxis (the horizontal category
    axis, since chart.inverted=true) so the -0.85/+7.65 offsets stay on-canvas, then
    re-verify all 6 violins + swarm clusters are visible in both renders.'
  - 'Because of the clipping bug, the chart actively misleads: ''Visual Search'' appears
    to have zero Novice-group data and ''Sequence Recall'' appears to have zero Expert-group
    data, when both groups do have data — this is worse than a missing decoration,
    it misrepresents the dataset.'
  - Once the axis-extent bug is fixed, add a bit more breathing room in the min/max
    buffer beyond the outermost violin half-width so nothing sits flush against the
    canvas edge.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, confirmed by pixel sampling at (250, 248, 241) = #FAF8F1 — matches spec exactly.
      Chrome: Title "violin-grouped-swarm · javascript · highcharts · anyplot.ai" in dark bold text, clearly readable. Y-value axis (vertical, "Reaction Time (ms)") ticked 200-1400ms. Category axis (horizontal, "Task Type") shows three labels: "Visual Search", "Pattern Matching", "Sequence Recall". Legend "Expertise Level" with Novice (green) / Expert (purple) swatches at bottom. All chrome text is legible against the light background.
      Data: Only 4 of the expected 6 violin+swarm groups are visible. Under "Visual Search" only a purple (Expert) violin with swarm dots appears — its Novice (green) counterpart is missing. Under "Pattern Matching" both a green (Novice) and purple (Expert) violin appear correctly, side by side. Under "Sequence Recall" only a green (Novice) violin appears — its Expert (purple) counterpart is missing. Pixel-column scanning confirms zero green pixels exist left of x=1021 and zero purple pixels exist right of x=2325 anywhere in the 3200px-wide canvas, i.e. the two missing violins are not just visually blended — they are entirely absent from the rendered canvas (clipped off-canvas by an axis-range bug, not a data-generation bug — the underlying JS data for all 6 cells is present and correctly computed).
      Legibility verdict: PASS for text; FAIL for data completeness (2 of 6 required distributions never render).

    Dark render (plot-dark.png):
      Background: warm near-black, confirmed by pixel sampling at (26, 26, 23) = #1A1A17 — matches spec exactly.
      Chrome: Same title/axis/legend text, now light-colored against the dark background, all clearly readable — no dark-on-dark issues found.
      Data: Identical composition and defect as the light render — same 4 violins visible (Visual Search: Expert only; Pattern Matching: both; Sequence Recall: Novice only), same 2 missing (Visual Search Novice, Sequence Recall Expert). Data colors (green #009E73, purple) are confirmed identical to the light render — only chrome flipped, as required.
      Legibility verdict: PASS for text; FAIL for data completeness (same missing violins as light render).
