review:
  strengths:
  - 'Critical off-canvas clipping bug from attempt 1 is fixed: yAxis now sets startOnTick:
    false / endOnTick: false plus a wider min/max buffer (-2.1 to last-center+2.2),
    so all 6 category x group violins and their swarm points render fully on-canvas
    in both themes'
  - 'Genuine violin silhouette built from the core-only bundle: mirrored `area` series
    filled from a `threshold` center line out to a Gaussian-KDE curve on each side,
    with the chart inverted so the value axis renders vertically — a correct, creative
    workaround for the missing highcharts-more/boxplot module'
  - Correct Imprint palette usage — Novice = palette[0] (#009E73), Expert = palette[1]
    (purple) — with data colors confirmed identical between light and dark renders,
    only chrome flips
  - Well-built beeswarm dodge algorithm (binned offset spreading) keeps swarm points
    from overlapping within each violin, appropriately sized (radius 3) for 40 points
    per cell
  - Deterministic seeded LCG random generator; realistic reaction-time cognitive-task
    scenario (Visual Search / Pattern Matching / Sequence Recall x Novice / Expert)
    with plausible ms-scale values that respect a per-task difficulty factor
  - Exact title format, descriptive axis labels with units (Reaction Time (ms), Task
    Type), clean legend with title, and adequate spacing between grouped violins to
    prevent overlap
  weaknesses:
  - Swarm points are moderately dense within some violins (e.g. Pattern Matching,
    Sequence Recall) and slightly overlap each other despite the beeswarm dodge —
    a touch more jitter or a smaller radius in the densest bins would keep every individual
    point crisply separable
  - 'Data storytelling is solid but generic: color + shape carry the comparison but
    there''s no explicit visual emphasis (e.g. a subtle callout or ordering) drawing
    the eye to the largest Novice/Expert gap (Pattern Matching / Sequence Recall)'
  - 'KISS Structure: several helper functions (lcg, randNormal, kde, beeswarmOffsets)
    are necessary for the custom violin/swarm construction, but keep an eye on function
    count creeping further in future revisions'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-grouped-swarm · javascript · highcharts · anyplot.ai" in dark bold text at top, clearly readable. Vertical value axis "Reaction Time (ms)" ticked from ~200 to 1400ms. Horizontal category axis "Task Type" shows three labels: "Visual Search", "Pattern Matching", "Sequence Recall". Legend "Expertise Level" at the bottom with green "Novice" and purple "Expert" swatches. Grid lines are subtle horizontal lines, visible but not dominant. All chrome text is dark and clearly legible against the light background — no light-on-light issues.
      Data: All 6 expected category x group violin+swarm distributions are now present and fully on-canvas — a clear fix versus the prior attempt, where 2 of 6 (Visual Search x Novice and Sequence Recall x Expert) were clipped off-canvas. Each category shows a green (Novice) violin and a purple (Expert) violin, correctly non-overlapping with adequate spacing between them. Swarm points (small filled circles) are overlaid inside each violin, colored to match their group's hue, and dodged sideways to reduce point-on-point overlap. Novice violins sit higher (slower reaction times, ~600-1450ms) than Expert violins (~250-830ms), consistent with the spec's intended contrast. Nothing is clipped at the canvas edges — the tallest violin peak (Sequence Recall, Novice) tapers to a point well inside the top margin.
      Legibility verdict: PASS — text is fully readable and all 6 data groups are visible and correctly positioned.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/axis/legend text, now rendered in light color against the dark background — title, axis titles, tick labels, and legend text are all clearly readable. No dark-on-dark failures observed anywhere (title, axis labels, tick labels, legend text all have strong contrast against the near-black surface).
      Data: Identical composition to the light render — all 6 violin+swarm groups present, correctly positioned, with the same non-overlapping spacing. Data colors (green #009E73 for Novice, purple for Expert) are confirmed identical to the light render; only the chrome (background, text, grid, legend) flips between themes, as required.
      Legibility verdict: PASS — text is fully readable and all 6 data groups are visible and correctly positioned, matching the light render's data exactly.
