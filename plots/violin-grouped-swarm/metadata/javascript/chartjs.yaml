review:
  strengths:
  - 'Genuinely novel Chart.js technique: implements a full KDE-based violin curve
    via a custom beforeDatasetsDraw plugin (scales.x/y.getPixelForValue) layered behind
    a dodge-computed beeswarm scatter overlay -- a chart type Chart.js has no native
    support for, executed idiomatically through the plugin API.'
  - 'Palette and theme chrome are fully compliant: Junior=#009E73 (canonical first
    slot), Senior=#C475FD (canonical second slot), identical hues across light/dark
    renders, with all text/grid/legend correctly flipped per theme.'
  - 'Realistic, well-scaled data: task completion times by developer role and task
    type, with per-cell mean/std producing varied spreads, visible outliers, and a
    plausible senior-faster-than-junior pattern that holds across all three task types.'
  - Title format, legend labels, and axis titles (with units) exactly match spec requirements;
    no clipping or overlap in either render.
  weaknesses:
  - Title occupies only ~40% of the plot width because the font-scaling formula shrinks
    aggressively for the long descriptive+mandated title -- it reads as undersized
    relative to the canvas; try a less steep scaling curve (e.g. floor around 19-20px)
    so the title still fills closer to the 50-70% target.
  - Helper functions (makeLcg, gaussian, computeSwarmOffsets, hexToRgba) plus a plugin
    object add structure beyond the simple imports -> data -> plot -> save ideal (CQ-01).
    Mostly unavoidable given the custom KDE+swarm rendering Chart.js requires, but
    flatten or inline where feasible.
  - 'Design Excellence is currently default-tier: two flat Imprint colors, standard
    subtle grid, and no callout for the clear ''seniors are consistently faster''
    insight -- a small annotation/subtitle or refined grid/legend treatment would
    push this from ''good'' to ''excellent'' storytelling.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "Task Completion Time by Role · violin-grouped-swarm · javascript · chartjs · anyplot.ai" in dark ink, clearly readable though modestly sized relative to canvas width (~40%). Legend top-right shows "Junior" (mint green) and "Senior" (lavender/purple) circular swatches. Y-axis title "Completion Time (minutes)" and x-axis title "Task Type" both in dark ink with units present. Tick labels dark and legible. Subtle horizontal gridlines only (x gridlines disabled).
      Data: Six violin shapes in 3 category pairs (Debugging, Feature Dev, Code Review), each semi-transparent (~0.42 alpha) fill with a solid stroke outline in the group color, overlaid with ~35 small swarm dots per cell colored to match, each with a thin page-background border for contrast against overlapping points. First series (Junior) renders as #009E73 brand green, second series (Senior) as #C475FD lavender.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, axis titles, tick labels, and legend now rendered in light/off-white ink -- all clearly legible against the dark background. No dark-on-dark instances found.
      Data: Same six-cell violin+swarm layout. Stroke color and swarm dot color are identical to the light render (#009E73 / #C475FD); the semi-transparent violin fills read as more saturated/deeper hues because the same alpha (~0.42) composites differently over the darker page background -- expected alpha-blending behavior, not a chrome/hue compliance error.
      Legibility verdict: PASS
