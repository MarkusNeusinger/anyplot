review:
  strengths:
  - Frequency-driven triple encoding (cube-root font-size curve, bold weight for the
    top 6 terms, Imprint-ranked color) creates an immediate visual hierarchy that
    spotlights "performance", "reliability", and "support" as the dominant survey
    themes.
  - Hand-rolled Archimedean-spiral collision layout (necessary since ECharts has no
    native wordcloud series and the extension package is disallowed) places all 38
    words with no visible overlap.
  - 'Palette compliance verified across ranks: the highest-frequency word "performance"
    renders in brand green #009E73, and subsequent ranks cycle through the Imprint
    palette in canonical order, identical between light and dark renders.'
  - Deterministic, in-memory product-feedback term-frequency dataset spans a wide,
    realistic range (8-132) in a neutral business context.
  - 'Title and chrome correctly use theme-adaptive ink tokens, readable in both themes;
    backgrounds match the Imprint surface tokens (#FAF8F1 light / #1A1A17 dark).'
  weaknesses:
  - Smallest-frequency words (e.g. "sync", "import", "export", freq 8-10, fontSize
    ~23px) shrink to roughly 7-8px effective height at the 400px mobile preview breakpoint
    — borderline illegible there; consider raising FONT_MIN slightly (e.g. to ~26-28)
    to keep the tail readable on mobile without flattening the size hierarchy.
  - 'CQ-01 KISS structure: four helper functions (fontSizeFor, measureWord, boxesOverlap,
    placeWords) are used instead of a flat Imports->Data->Plot->Save script — a justified
    deviation given the lack of a native ECharts wordcloud series, but still a deduction
    under the strict KISS criterion.'
  - Noticeably more whitespace sits above the cloud (under the title) than below it;
    nudging cloudArea.y0 down slightly or increasing cloudArea.h would balance canvas
    utilization further.
  - The placement logic is generic canvas measureText + spiral math routed through
    ECharts' graphic.elements escape hatch rather than an ECharts-specific chart feature,
    so Library Mastery (distinctive features) stays low — any canvas-capable library
    could replicate this identically.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "wordcloud-basic · javascript · echarts · anyplot.ai" is bold, centered, dark ink text — clearly readable against the light background. No axis/legend chrome (word cloud has neither).
      Data: 38 words fill roughly the center 75-85% of the canvas in a dense, non-overlapping arrangement. The largest word, "performance" (highest frequency, rank 0), renders in brand green #009E73. Other high-frequency words ("reliability", "support", "usability", "pricing", "integration", "security", "documentation") are bold-weight and colored in the next Imprint palette positions in canonical order (lavender, blue, ochre, matte red, cyan, rose, lime). Lower-frequency words ("sync", "import", "export", "caching") are small, regular-weight, and colored via palette-position wraparound (rank % 8), still visible at full resolution.
      Legibility verdict: PASS — all text is readable against the light background; the smallest tail words (freq 8-10) are legible at full canvas resolution though they would shrink significantly at a 400px mobile preview.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light ink text (white/near-white), clearly readable against the dark background — no dark-on-dark issue.
      Data: Identical word layout, sizes, weights, and colors to the light render — confirms data colors (Imprint palette positions) are unchanged between themes; only the background and title ink flipped.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all chrome and data text is clearly distinguishable from the dark surface.
