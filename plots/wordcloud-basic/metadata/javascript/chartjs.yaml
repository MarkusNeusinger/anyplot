review:
  strengths:
  - 'Creative, correct solution to Chart.js shipping no native word-cloud type: a
    chart-scoped afterDraw plugin implements a deterministic Archimedean-spiral placement
    with box-overlap collision detection, entirely within core Chart.js (no chartjs-chart-*
    import, per the library''s no-workarounds rule).'
  - Sqrt-scaled font size (18-104px) and interpolated font weight (500-800) give a
    readable frequency hierarchy without letting the top word dwarf the rest.
  - 'Fully deterministic: in-memory hardcoded data, largest-first placement queue,
    fixed spiral step sizes - reproducible across runs with no RNG.'
  - 'Imprint palette correctly applied: first category (Performance, the dominant
    theme) uses #009E73 brand green, remaining 4 categories follow palette order;
    data colors are pixel-identical between light and dark renders, only chrome flips
    (#FAF8F1 / #1A1A17 backgrounds correct).'
  - Integrated category legend (color swatch + label) drawn in the same canvas pass,
    doubling as both legend and the spec's 'color encodes additional category information'
    feature.
  - No overlapping text among the 35 placed words; canvas is exactly 3200x1800, satisfying
    the hard landscape size rule; title matches the mandated 'wordcloud-basic · javascript
    · chartjs · anyplot.ai' format.
  weaknesses:
  - Smallest-frequency words ('discount' freq=38, 'refund' freq=44, 'lag' freq=62)
    render near MIN_FONT_PX=18 and become hard to read once scaled to the ~400px mobile
    thumbnail - raise the size floor or drop the lowest-frequency tail so remaining
    words stay legible at small scale.
  - Word placements sit very close to the canvas edges in several spots (helpdesk/uptime
    near the left edge, reporting/documentation near the right edge, refund near the
    bottom) - tighten the spiral's usable area with more inner margin so words breathe
    away from the frame.
  - Implementation leans on several helper functions (scale, boxesOverlap, layoutWords)
    and a plugin object rather than a flat KISS script - understandable given the
    placement algorithm Chart.js doesn't provide natively, but it is more structure
    than a typical anyplot snippet.
  - 'The chart''s own scales/datasets stay empty (type: ''scatter'' with data: [])
    and all real rendering happens via a custom afterDraw plugin - the correct workaround
    per the library''s no-native-wordcloud constraint, but it means the snippet demonstrates
    canvas-drawing skill more than Chart.js''s built-in charting primitives (scales,
    datasets, native chart types).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "wordcloud-basic · javascript · chartjs · anyplot.ai" is bold dark text, clearly readable at top center. A one-row legend below the title shows 5 colored swatches (green/purple/blue/gold/red) with labels "Performance", "Usability", "Support", "Pricing & Billing", "Features" in dark text - all legible against the light background.
      Data: 35 words fill the canvas below the legend, sized 18-104px by sqrt-scaled frequency and colored by category using the Imprint palette (green #009E73 for "performance", the highest-frequency category, confirming palette[0] usage). No overlapping words observed; the largest word ("performance") anchors the visual center. Smallest words ("discount", "refund", "lag") are noticeably small but still legible at full resolution.
      Legibility verdict: PASS (full resolution) - at the 400px mobile thumbnail the smallest words become hard to read, a minor legibility concern noted in weaknesses.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title and legend, now rendered in light/off-white text - clearly readable against the dark background, no dark-on-dark issues detected.
      Data: Identical word set, sizes, and positions as the light render; colors are pixel-identical (green, purple, blue, gold, red) - only the chrome (background, title/legend text color) flipped as required. No dark-on-dark or light-on-light failures found; brand green #009E73 remains clearly visible on the dark surface.
      Legibility verdict: PASS - same minor small-word-at-thumbnail-scale caveat as the light render, otherwise fully readable.
