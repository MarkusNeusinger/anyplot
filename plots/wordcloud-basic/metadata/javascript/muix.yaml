review:
  strengths:
  - 'Excellent Imprint palette compliance: words are colored in strict descending-frequency
    order through the canonical palette (#009E73 -> #C475FD -> #4467A3 -> #BD8233
    -> #AE3030 -> #2ABCCD -> #954477 -> #99B314, then wraps), so the dominant word
    (''solar'') is brand green and every subsequent color matches the canonical order
    exactly - identical in both themes.'
  - 'Genuine collision-free spiral layout: real canvas glyph-width measurement (measureText)
    feeds an Archimedean-spiral placement loop with rect-overlap checks, so words
    never actually collide - not a hand-waved approximation.'
  - Correct sqrt-based font-size scaling so rendered glyph AREA (not height) follows
    frequency, which is the standard, correct word-cloud sizing approach.
  - Deterministic, realistic renewable-energy term-frequency dataset (39 words, Zipf-shaped
    tail 980->40) - neutral, plausible domain.
  - Theme chrome (background, title color) and skipAnimation are handled correctly
    in both light and dark renders; mandated title format is exact.
  weaknesses:
  - 'Library Mastery is very low: ChartContainer is mounted with series={[]} and margin=0,
    used only as an empty SVG root - none of the actual word-cloud rendering (sizing,
    spiral placement, coloring) goes through any MUI X data/marks API. Since MUI X
    community has no wordcloud/treemap primitive, this is close to the ''shell out
    to raw SVG instead of a real chart type'' pattern the muix.md guide warns against;
    if a more idiomatic composition isn''t possible, this should at least be called
    out rather than silently using ChartContainer as a blank canvas.'
  - 'CQ-01 KISS Structure is far from Imports -> Data -> Plot -> Save: fontSizeFor,
    textWidth, rectsOverlap, layoutWordCloud and WordCloudMarks are five extra helper
    functions/components. Understandable given the library gap, but it is real, scoreable
    complexity - trim where possible (e.g. inline the tiny rectsOverlap check).'
  - 'Mobile legibility (400px width): the smallest-frequency words (''scale'', ''market'',
    ''cost'', ''research'', ''policy'') at FONT_MIN=16 are hard to read once the PNG
    is scaled down to the ~400px mobile preview - raise FONT_MIN (e.g. to ~20-22)
    or compress the sqrt scale range so the tail stays legible at small sizes.'
  - 'Layout balance: the spiral cloud leaves a visibly larger empty margin on the
    right side (above ''microgrid''/''research''/''policy''/''cost'' and below ''capacity'')
    than on the left, giving a slightly lopsided canvas-fill rather than a balanced
    ellipse - widen the spiral''s horizontal reach or re-center to use the right edge
    more evenly.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Centered title "wordcloud-basic · javascript · muix · anyplot.ai" in dark bold text at the top, clearly readable. No axes, grid, or legend (correctly - a word cloud needs none).
      Data: 39 words of varying font size (16-128px) arranged in a dense, roughly elliptical spiral filling most of the canvas. Colors cycle through the Imprint palette in strict descending-frequency order: "solar" (largest, highest frequency) is brand green #009E73, "battery" is violet, "grid" is blue, "storage" is ochre, "wind" is red, "efficiency" is cyan, "emissions" is mauve, "hydrogen" is olive, then the cycle repeats green for "photovoltaic". No two words overlap. Slightly more empty space on the right side of the canvas than the left.
      Legibility verdict: PASS - all 39 words are readable at full resolution; the smallest words ("scale", "market", "cost", "research", "policy") are legible at full size but become borderline hard to read once scaled down to the ~400px mobile thumbnail.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Same title, now in light/white text, clearly readable against the dark background. No axes/grid/legend, as in light.
      Data: Identical word placement, sizes, and colors to the light render - confirmed the same green/violet/blue/ochre/red/cyan/mauve/olive sequence in the same positions. Only the page background and title color flipped.
      Legibility verdict: PASS - no dark-on-dark issues; every word color has sufficient contrast against the near-black background. Same mobile-scale caveat as light for the smallest words.
