review:
  strengths:
  - 'Correct Imprint palette cycling in canonical order: the highest-frequency word
    ("solar") is exactly #009E73, and all data colors are pixel-identical between
    light and dark renders — only chrome flips.'
  - 'Genuinely clever library usage: overrides ScatterChart''s `slots.scatter` extension
    point to draw real SVG text driven by the chart''s own xScale/yScale (not raw
    pixel placement), turning a scatter primitive into a proper word cloud.'
  - Archimedean-spiral placement with real canvas `measureText` collision boxes means
    every word gets a guaranteed non-overlapping position — no words are silently
    dropped.
  - sqrt-based font scaling makes rendered *area* (not just height) proportional to
    frequency, a legitimate word-cloud best practice, with the font range tuned to
    stay legible at mobile thumbnail scale.
  - 'Clean, minimal chrome: axes, ticks, and legend are all appropriately hidden for
    a word cloud, with generous insets and no wasted grid/frame clutter.'
  - 'Deterministic and reproducible: hard-coded data and a deterministic placement
    algorithm, no RNG.'
  weaknesses:
  - A handful of low-frequency words (e.g. "cost", "scale", "smartgrid", "market")
    render in lower-contrast Imprint hues (ochre, lavender, cyan) at the smallest
    font sizes — contrast on the cream/near-black backgrounds is borderline for these
    combinations and they become hard to make out once the PNG is scaled to a 400px
    mobile thumbnail; consider a thin ink-color stroke on the smallest/lowest-contrast
    words (per the style guide's optional outline pattern) or raising FONT_MIN slightly.
  - Word count (38) sits at the low end of the spec's suggested 20-200 range — a somewhat
    larger vocabulary would better showcase size-range variety.
  - Color assignment is purely decorative (cycles by frequency rank through the 8-color
    palette) rather than encoding any second dimension — acceptable for this spec,
    but a missed opportunity for extra data storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "wordcloud-basic · javascript · muix · anyplot.ai" centered at top, clearly readable against the light background. No axes, ticks, grid, or legend are drawn (appropriately hidden for a word cloud).
      Data: 38 words packed edge-to-edge in a spiral arrangement, sized by frequency (largest = "solar", smallest = "market"/"research"). First (highest-frequency) word "solar" renders in Imprint position 1, #009E73 brand green; the remaining words cycle through the full 8-color Imprint palette in canonical order as frequency descends (battery=lavender, grid=blue, storage=ochre, wind=red, efficiency=cyan, emissions=rose, hydrogen=lime, then repeating).
      Legibility verdict: PASS — all words are readable at full resolution; the smallest words (cost, scale, market, smartgrid) are somewhat faint at 400px mobile thumbnail scale due to their low-contrast hue + small size combination, but no text is fully illegible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Bold white/light title in the same position, clearly readable against the dark background. Same absence of axes/grid/legend.
      Data: Identical word layout and identical data colors to the light render (solar is still #009E73, battery still lavender, etc.) — confirms only chrome flipped, not data colors. No dark-on-dark text found anywhere.
      Legibility verdict: PASS — all words readable; same minor small-word/low-contrast caveat as light render (cost, scale, market, smartgrid) at mobile thumbnail scale, not a dark-on-dark failure.
