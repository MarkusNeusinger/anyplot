review:
  strengths:
  - Genuinely custom word-cloud engine built on top of ScatterChart's `slots.scatter`
    extension point — real xScale/yScale-driven text placement, not a faked static
    image
  - Archimedean-spiral collision-avoidance layout with real canvas-measured glyph
    widths (`measureCtx.measureText`) so boxes are sized from actual rendered text,
    not estimates
  - sqrt font-size scale correctly makes rendered AREA (not height) proportional to
    frequency, with a sensible clamp so the smallest words stay legible at mobile
    thumbnail size
  - Highest-frequency word ('solar') renders in brand green `#009E73`, and all data
    colors are pixel-identical between the light and dark renders — only chrome flips
  - Realistic, neutral renewable-energy term-frequency dataset with a plausible Zipf-shaped
    tail (980 down to 40)
  - 'Clean single-purpose file: only imports `ScatterChart`, disables animation/voronoi/tooltip
    appropriately for a static-feeling word cloud, hides the cartesian axes since
    they carry no semantic meaning here'
  weaknesses:
  - 'Silent data loss: the spiral placement loop in `layoutWordCloud` caps at 8000
    steps per word and drops any word that never finds a collision-free slot (''Spiral
    saturated ... drop the word rather than overlap''). In this render 15 of the 39
    input words (~38%) never appear at all — ''sustainability'', ''infrastructure'',
    ''resilience'', ''biomass'', ''geothermal'', ''recycling'', ''deployment'', ''monitoring'',
    ''materials'', ''modeling'', ''transition'', ''climate'', ''innovation'', ''cleantech'',
    ''renewables'' are all missing from both renders, with no fallback (smaller font,
    denser packing, more steps) attempted before dropping. These aren''t just the
    smallest values either — ''sustainability'' (375) and ''infrastructure'' (310)
    outrank several words that DID get placed (e.g. ''carbon'' 350, ''policy'' 290,
    ''forecast'' 150), so the omission looks arbitrary rather than a deliberate long-tail
    cutoff.'
  - Because of the dropped words, the cloud does not 'fill available space' as the
    spec requires — there is uneven, unintentional-looking whitespace (e.g. upper-right
    above 'forecast'/'capacity', lower-right past 'smartgrid') that would likely have
    been filled had all 39 words placed.
  - 'The word-count reduction directly undercuts feature/data coverage: with 38% of
    the term list invisible, the chart understates the vocabulary breadth a word cloud
    is meant to summarize.'
  - Title occupies only ~35% of canvas width — noticeably smaller than the ~70-85%
    that's typical/expected for the mandated title string at the style-guide default
    size; not a hard violation, but the title reads as a little understated relative
    to the rest of the composition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Centered bold title "wordcloud-basic · javascript · muix · anyplot.ai" in dark ink at the top, clearly legible. No axes, ticks, or legend are drawn (appropriately hidden — a word cloud has no cartesian meaning here).
      Data: ~24 words rendered in an organic, roughly elliptical spiral arrangement filling most of the frame from upper-left ("adoption") to lower-right ("smartgrid"). Font size scales with frequency ("solar", "battery", "photovoltaic" largest; "market", "research", "scale" smallest). Colors cycle through the Imprint categorical palette; the single highest-frequency word "solar" renders in brand green #009E73 as required. No text overlaps, no clipping at any canvas edge (checked all four margins at pixel level, including tight spots like "storage/solar/wind/policy" and "investment"/"scale" near the left edge).
      Legibility verdict: PASS — all visible text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now rendered in light/white ink, fully legible against the dark background — no dark-on-dark failures observed.
      Data: Identical word set, identical layout, and identical per-word colors to the light render (e.g. "solar" is the same #009E73 green, "battery" the same purple, "carbon" the same red) — only the background/title chrome flipped as required.
      Legibility verdict: PASS — all visible text is clearly readable against the dark background; no black-on-black or washed-out elements.

    Note: both renders are internally consistent and legible, but both are missing the same 15 of 39 source words (see Weaknesses) — this is a data/layout defect, not a theme-legibility defect, and affects both renders identically.
