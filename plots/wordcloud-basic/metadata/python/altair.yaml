review:
  strengths:
  - Exact canonical canvas (3200x1800) achieved via the mandatory pad-to-target pattern,
    in both themes, with zero clipping (no AR-09 issues)
  - Category color-coding uses the Imprint palette in canonical order (Languages/Data
    & AI/Cloud & Infra/Practices -> green/purple/blue/ochre), held identical across
    light and dark, with a correctly-labeled "Topic" legend
  - Theme-adaptive chrome is threaded correctly end-to-end -- title, legend fill/stroke/text
    all flip appropriately; both renders pass the light/dark legibility check with
    no dark-on-dark or light-on-light failures
  - Deterministic elliptical spiral-packing algorithm (no RNG) with occasional 90-degree
    word rotation to fill vertical gaps -- a genuinely idiomatic-for-altair solution
    given the library has no native wordcloud mark
  - Word sizes scale cleanly with frequency (10-30pt), and the biggest terms ("Python",
    "Analytics", "Kubernetes", "JavaScript") clearly read as the visual focal point
  weaknesses:
  - The word cloud content only occupies roughly the middle 50% of the canvas height
    -- the bottom ~20-25% of the canvas is empty background with no words, and there's
    a further ~10% gap between the title and the top of the word cluster. This reads
    as an unbalanced, top-heavy composition and works against the spec's "arranged
    to fill available space" requirement. Consider growing canvas_h/canvas_w proportions,
    increasing min_size/max_size, or adding more words so the spiral packing naturally
    extends further down the canvas.
  - Only 23 words are used, near the very low end of the spec's "20-200 words typical
    for readability" range. A larger word set (e.g. ~40-60 words) would both better
    satisfy DQ-01/DQ-03 and directly help fill the empty canvas space noted above.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark-ink title "wordcloud-basic · python · altair · anyplot.ai" top-left, clearly legible. "Topic" legend top-right with 4 colored swatches (green=Languages, purple=Data & AI, blue=Cloud & Infra, ochre=Practices) on an off-white box, dark-ink labels, legible.
      Data: 23 words placed via spiral packing, sized 10-30pt by frequency, colored by topic category (green/purple/blue/ochre matching Imprint positions 1-4). Largest/dominant terms: Python, Analytics, Kubernetes, JavaScript. Some words (DevOps, GraphQL, Microservices, Database) rotated 90 degrees to fill vertical gaps. No overlapping text.
      Layout note: word cluster occupies roughly the vertical middle of the canvas; ~20-25% of canvas height at the bottom is empty background, plus a ~10% gap between the title and the top of the word cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: title and legend text correctly flip to light ink (#F0EFE8 title, lighter grey legend labels), fully legible against the dark background. Legend box background switches to the elevated dark fill with a light stroke.
      Data: identical word positions, sizes, and category colors as the light render -- confirmed data colors unchanged across themes, only chrome flipped.
      Layout note: same bottom-canvas empty-space pattern as the light render.
      Legibility verdict: PASS (no dark-on-dark failures observed)
