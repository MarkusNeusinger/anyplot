review:
  strengths:
  - Category-to-color mapping doubles as content encoding and legend-based filter
    (click-to-toggle in the interactive HTML) — a smart reuse of Plotly's native legend
    interactivity to compensate for the lack of a built-in wordcloud trace
  - Font-weight variation (Arial Black for freq >= 75) adds a secondary visual-hierarchy
    cue beyond size alone, reinforcing the highest-frequency words
  - Manual bounding-box-packed positions keep the 28-word cloud dense and centered
    without wasted whitespace, and mostly avoid overlap despite the tight layout
  - Full theme-adaptive chrome (paper/plot background, ink tokens, legend box, hover
    label) correctly threaded through both light and dark renders — no dark-on-dark
    or light-on-light failures
  - Hover tooltip surfaces the exact frequency per word — genuine added interactive
    value beyond the static PNG
  weaknesses:
  - '"NLTK" and "OpenCV" labels overlap in both renders — the K of NLTK touches the
    O of OpenCV in the bottom-center cluster (word_data positions x=0.421/y=0.038
    and x=0.500/y=0.025). Nudge NLTK''s x position left by ~0.03-0.04 (or move OpenCV
    right) to restore a clear gap.'
  - Smallest word labels (NLTK, MLflow, Statsmodels at min_size=13pt -> ~52px source)
    risk becoming hard to read once the image is downscaled to the ~400px mobile thumbnail.
    Raise min_size from 13 to ~16-18pt so even the lowest-frequency words stay legible
    at mobile width.
  - The random.seed(42) / np.random.seed(42) calls (and the numpy/random imports backing
    them) are vestigial — word_data and every x/y position are fully hardcoded, so
    nothing in the script actually consumes randomness. Either remove the unused seeding/imports
    or use them meaningfully.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "wordcloud-basic · python · plotly · anyplot.ai" is centered, dark ink text, clearly legible. A bordered horizontal legend strip sits below the word cluster listing the 5 categories with "Aa" color swatches (Data Wrangling, ML & Deep Learning, Visualization & BI, Data Engineering & Ops, Cloud & AI Toolkits), all in soft dark text on a slightly elevated off-white box. Axes/ticks/grid are intentionally hidden (appropriate — word position is a packing layout, not a data scale).
      Data: 28 words sized by frequency (NumPy, Pandas, TensorFlow, SQL largest; NLTK, MLflow, Statsmodels smallest) and colored by category using 5 Imprint hues: brand green (#009E73, Data Wrangling), lavender (#C475FD, ML & Deep Learning), blue (#4467A3, Visualization & BI), ochre (#BD8233, Data Engineering & Ops), and cyan (#2ABCCD, Cloud & AI Toolkits) — correctly skipping the reserved semantic-red slot since no category needs an error/bad connotation. The highest-frequency words (NumPy, Pandas, TensorFlow, SQL, Git) render in a heavier weight (Arial Black), adding a legible hierarchy cue on top of size.
      Legibility verdict: PASS overall, with one flagged defect — "NLTK" and "OpenCV" labels touch/overlap at the bottom-center of the cluster (the K of NLTK collides with the O of OpenCV). All other words, including the smallest (NLTK, MLflow, Statsmodels), are readable at full resolution though they would be tight at mobile thumbnail scale.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title renders in light ink text (#F0EFE8), clearly legible against the dark background. The legend strip box and border flip to the dark-theme elevated tone with light secondary text — fully readable, no dark-on-dark failure.
      Data: All 28 word colors are pixel-identical to the light render (same 5 Imprint hues), confirming only chrome (background, title, legend frame/text) flipped between themes as required.
      Legibility verdict: PASS overall, with the same NLTK/OpenCV overlap present in this render too (positions are theme-independent). No dark-on-dark or light-on-light chrome issues found.
