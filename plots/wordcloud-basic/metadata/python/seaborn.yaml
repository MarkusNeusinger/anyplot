review:
  strengths:
  - 'Fixed the attempt-1 SC-02 weakness: generic descriptive terms (cloud, testing,
    agile, security, analytics, backend, frontend) are now lowercased while brand/product
    names and acronyms (Python, AWS, SQL, CICD) correctly keep their established casing'
  - 'Fixed the attempt-1 LM-01 weakness by earning real seaborn API surface: sns.color_palette()
    now derives/validates the Imprint hex list, and sns.set_context("notebook", font_scale=1.0)
    now drives the title font size instead of a bare literal'
  - Custom collision-aware spiral placement algorithm uses real rendered text bounding
    boxes to guarantee zero overlaps across all 50 words in both renders
  - Canvas is exactly 3200x1800 (figsize=(8, 4.5), dpi=400, no bbox_inches='tight')
    - no drift from the mandated landscape target
  - 'Imprint palette correctly applied: highest-frequency word (Python) anchored to
    #009E73, data colors pixel-identical between light/dark renders - only chrome
    flips'
  - Fully deterministic output - golden-angle spiral needs no random seed
  - Realistic, neutral dataset (developer-survey tech-skill mentions) with a plausible
    frequency range (2-180)
  weaknesses:
  - The core word-placement logic (sizing, spiral positioning, ax.text() rendering)
    is still raw matplotlib - seaborn has no word-cloud primitive, so this is an inherent
    ceiling for this spec/library combination, not a fresh regression, but LM-02 stays
    low since sns.color_palette()/sns.set_context() are generic utility calls rather
    than a distinctive seaborn feature
  - Color assignment is still a flat round-robin cycle through the 8-hue palette (idx
    % 8) rather than encoding any real signal - acceptable since the spec allows decorative
    color, but a missed data-storytelling opportunity (e.g. grouping by tech category)
  - Two helper functions (half_extent_data, collides) still depart from the flat-script
    KISS pattern typical of these implementations - justified by the collision-avoidance
    algorithm's needs, but adds structure beyond a simple script
  - Smallest words (Istio, Pulumi, dbt, Airflow) sit near the 8pt floor - legible
    at full 3200x1800 resolution but marginal once scaled down to a ~400px mobile
    preview
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark. Correct.
      Chrome: Title "wordcloud-basic · python · seaborn · anyplot.ai" in dark ink, centered top, clearly legible. No axes/ticks/grid/legend (correctly omitted - word cloud needs none).
      Data: 50 words arranged in a roughly circular/organic silhouette via spiral placement; size scales with frequency - "Python", "JavaScript", "React", "Docker", "AWS", "Linux" are largest and centrally placed, "Istio", "Pulumi", "dbt", "Airflow" are smallest at the periphery. Colors cycle through the 8-hue Imprint palette; "Python" (highest frequency) is #009E73 green. Generic terms (cloud, testing, agile, security, analytics, backend, frontend) are lowercased; brand/acronym names (Python, AWS, SQL, CICD, JavaScript) keep established casing. No visible overlaps or edge clipping.
      Legibility verdict: PASS - all text clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light. Correct.
      Chrome: Title flips to light ink, stays clearly legible against the dark surface.
