review:
  strengths:
  - Custom collision-aware spiral placement algorithm uses real rendered text bounding
    boxes to guarantee zero overlaps across all 51 words in both renders — a genuinely
    hard problem solved well from scratch.
  - Canvas is exactly 3200x1800 (figsize=(8, 4.5), dpi=400, no bbox_inches='tight')
    — no drift from the mandated landscape target.
  - 'Imprint palette correctly applied: the most prominent word (Python) is anchored
    to #009E73, and data colors are pixel-identical between light and dark renders
    — only chrome (background, title ink) flips.'
  - Fully deterministic output — golden-angle spiral placement needs no random seed,
    so the layout is reproducible run-to-run.
  - Realistic, neutral dataset (developer-survey tech-skill mention counts) with a
    plausible frequency range (2-180).
  weaknesses:
  - Only one seaborn function is called in the whole script (sns.set_theme()) — every
    other visual element (text placement, sizing, coloring, save) is raw matplotlib.
    This mirrors the AR-05 'NOT sufficient' example ('Only sns.set_style()'). Use
    sns.color_palette() to derive/validate the Imprint colors and/or sns.set_context()
    for font scaling so seaborn's API does real work, not just a global theme call.
  - Words are not lowercased despite the spec's explicit preprocessing note ('Words
    should be preprocessed (lowercase, stop words removed) for best results'). Proper
    nouns/brand names (Python, AWS, SQL) are a defensible exception, but generic terms
    ('Testing', 'Cloud', 'Backend', 'Security') could follow the guidance.
  - Color assignment is a flat round-robin cycle through the 8-hue palette (idx %
    8) rather than encoding any real signal — acceptable since the spec allows purely
    decorative color, but a missed opportunity (e.g. grouping by tech category) for
    extra data storytelling.
  - Two helper functions (half_extent_data, collides) depart from the flat-script
    KISS pattern typical of these implementations — justified by the placement algorithm's
    needs, but adds structure beyond a simple script.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "wordcloud-basic · python · seaborn · anyplot.ai" in dark ink, centered top, clearly legible. No axes, ticks, or grid (axis off, appropriate for a word cloud). No legend (color is decorative, not categorical).
      Data: 51 words arranged in a roughly circular/organic silhouette via spiral placement. Word size scales with frequency — "Python", "JavaScript", "React", "Docker", "AWS" are largest and centrally placed; "Istio", "Airflow", "Pulumi", "dbt" are smallest at the periphery. Colors cycle through the 8-hue Imprint palette (idx % 8); "Python" (highest frequency) is #009E73 green. No visible overlaps between any words.
      Legibility verdict: PASS — all words are readable against the light background at every size present.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light ink (INK token flips correctly), clearly legible against the dark background. Same layout as the light render (axis off, no grid/legend).
      Data: Same word set, same sizes, same spiral positions as the light render. Colors are pixel-identical to the light render for every word (e.g. Python teal-green, JavaScript light purple, Docker brown, AWS red) — confirming only chrome flipped, not data colors. No dark-on-dark issues; every word color has strong contrast against #1A1A17.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements found.
