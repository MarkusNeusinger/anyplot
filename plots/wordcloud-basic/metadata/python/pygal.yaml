      Data: Identical word set, sizes, positions, and colors as the light render (confirmed via SVG inspection: ArgoCD, GitOps, PagerDuty carry the same font-size/fill/fill-opacity values in both plot-light.html and plot-dark.html) — only the background and title ink flipped, as required.
      Legibility verdict: PASS (no dark-on-dark failures — title and every word are clearly visible against the near-black surface; brand green and all other Imprint hues read well on this background). Same stale-render caveat as the light render applies.
