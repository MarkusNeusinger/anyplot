review:
  strengths:
  - 'First series and highest-frequency word (Kubernetes) correctly rendered in brand
    green #009E73, with the rest of the words cycling through the Imprint palette'
  - Font size scales cleanly from 40px (least frequent) to 187px (most frequent),
    giving an immediately readable size hierarchy that matches the frequency data
  - Secondary opacity-tier depth cue (0.7 to 1.0 keyed to frequency) is a nice touch
    beyond size alone and reinforces the visual hierarchy
  - Theme chrome (background, title ink) flips correctly between light (#FAF8F1 bg,
    dark title) and dark (#1A1A17 bg, light title) while every word's data color stays
    pixel-identical across renders
  - 'Honest, well-documented workaround for pygal''s lack of a native word-cloud primitive:
    a minimal pygal.XY canvas carries the title/background via the idiomatic Style
    API, and only the freeform word placement is done via manual SVG injection — code
    comments explain why this is necessary'
  - Deterministic placement (fixed spiral increments, no RNG) makes the output fully
    reproducible run-to-run
  - Realistic, neutral DevOps-survey term set with a plausible power-law-like frequency
    distribution (195 down to 10)
  - 'Correct output artifacts: plot-{theme}.png/.svg/.html, no bare plot.png'
  weaknesses:
  - 'Tail words (Vagrant, Packer, Nginx, HAProxy, Zabbix, Nagios, PagerDuty) all end
    up packed into a narrow near-vertical column hugging the right edge instead of
    filling the open space — this leaves large empty voids in the top-right (below
    the title) and bottom-right/bottom-center of the canvas and makes the composition
    read more like a sidebar list than an organic word cloud. Root cause: the elliptical
    spiral (radius*2.8 horizontal vs radius*1.8 vertical) grows outward faster horizontally
    than vertically, so small late-placed words hit the horizontal bound (`canvas_w
    - w - 67`) and stack there. Rebalancing the ellipse ratio (or switching to a squarer
    spiral) toward the tail would spread these into the empty regions instead.'
  - '''Docker'' and ''Ansible'' sit right at their bounding-box boundary with no visible
    gap in either render — looks like the words are touching rather than clearly separated.
    The width estimate `len(word) * size * 0.55` under-approximates true bold-glyph
    width for some letter combinations; a slightly larger padding (or per-character
    width table) would guarantee visible separation.'
  - The smallest words (fontsize ~40px, e.g. PagerDuty, Nagios, Zabbix) will render
    at roughly 5px effective height once scaled down to the 400px mobile srcset —
    likely too small to read comfortably on a phone. Consider raising the size floor
    a bit (e.g. min_size=48-52) so even the lowest-frequency words stay legible at
    mobile width.
  - 'Only 7 of the 8 Imprint categorical colors are defined in the IMPRINT tuple (missing
    the lime #99B314) — not a hard violation since colors still start with brand green
    and stay within the canonical set, but the full 8-color cycle would give slightly
    more variety across 28 words.'
  - 'LM-02 (Distinctive Features): beyond the Style-driven title/background, the actual
    word-cloud rendering bypasses pygal entirely via manual SVG text injection, so
    little of the visual result is attributable to pygal-specific capabilities.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "wordcloud-basic · pygal · anyplot.ai" in dark ink, centered at top, clearly legible. No axes, ticks, or legend are shown (correctly omitted — a word cloud needs none).
      Data: 28 words of varying size (largest "Kubernetes" ~187px in brand green #009E73, smallest "PagerDuty"/"Nagios"/"Zabbix" ~40px on the right edge) cycling through the Imprint categorical palette (green, lavender, blue, ochre, red, cyan, rose). Opacity fades from ~0.7 (low-frequency tail) to 1.0 (high-frequency core), adding a secondary size/prominence cue. Large/mid words (Kubernetes, Docker, Ansible, Terraform, Helm, Jenkins, GitLab, Prometheus, Grafana, ArgoCD) cluster in the center-left with generous spacing; a run of small words (Vagrant → PagerDuty) is packed into a narrow vertical column near the right edge, leaving visible empty space in the top-right and bottom-right.
      Legibility verdict: PASS (all title and word text clearly readable against the light background; no light-on-light issues). Minor concern: "Docker" and "Ansible" touch with no visible gap, and the smallest words (~40px) will be quite small once scaled to a 400px mobile preview.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in light ink, clearly legible against the dark background. Same absence of axes/ticks/legend as the light render.
      Data: Identical word set, sizes, positions, and colors as the light render — confirmed pixel-for-pixel color match (Kubernetes green, Docker lavender, Ansible ochre, Terraform blue, Helm red, etc.). Only the background and title ink flipped, as required.
      Legibility verdict: PASS (no dark-on-dark failures — title and every word are clearly visible against the near-black surface; brand green and all other Imprint hues read well on this background).
