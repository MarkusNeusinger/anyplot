review:
  strengths:
  - Frequency tiers are ordered categories and are colored in steps of imprint_seq
    from brand green (#009E73, highest) to blue (#4467A3, lowest), with a one-row
    legend that states the ranges
  - 'Clean theme threading: PAGE_BG/INK/INK_SOFT tokens drive background, title and
    legend so both renders are fully readable; data colors identical across themes'
  - 'Text preprocessing matches the Notes: lowercase common words, acronyms (AI, API,
    AWS) and proper nouns (Python, Docker, Kubernetes) in their usual case, no stop
    words'
  - No word touches or covers another, nothing is cut off at the canvas edge, and
    the largest term Python sits at the visual center
  - scale_size_identity maps the precomputed font sizes directly, a clean grammar-of-graphics
    way to drive text size from frequency
  weaknesses:
  - 'SC-02 (both): the words do not fill the cloud''s area — large open gaps sit between
    AI and monitoring, between testing/DevOps and machine, around Redis, and in the
    lower-right between automation and Kubernetes, so the render reads as words scattered
    over a rectangle rather than a packed cloud → place words more tightly around
    the central cluster so only small gaps remain. Likely cause: the hand-crafted
    positions list spread evenly over the 0–100 × 0–56 panel.'
  - 'VQ-05 (both): an empty band of about 200 px (displayed ~110 px of 1125) separates
    the legend from the first row of words (GraphQL/platform), while the bottom margin
    is much smaller → shrink that gap by about half so the whitespace is balanced.
    Likely cause: coord_cartesian ylim=(0, 56.25) with the top words at y ≤ 53 plus
    the legend''s own margin.'
  - 'VQ-01 (both): the smallest words Redis and GraphQL (geom_text size 6) drop to
    about 4 px cap height in the 400 px thumbnail and blur → minimum size about 8
    (+2). Likely cause: df[''size''] = 6 + freq_norm * 19.'
  - 'Suggestion: the invisible geom_point(alpha=0) layer exists only to give the legend
    swatches; a comment already says so, but a native legend from geom_text with override_aes
    would keep the code to one data layer.'
  - 'Suggestion: merging ''machine'' and ''learning'' into the phrase ''machine learning''
    would make the top terms read as the survey themes they are.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid, no frame.
      Chrome: bold near-black title "wordcloud-basic · python · plotnine · anyplot.ai" centered at top; below it a one-row legend "Frequency" with square swatches High (65+), Medium (35-64), Low-Med (15-34), Low (<15) in dark grey text. All readable.
      Data: 29 technology terms; Python largest at center, data/machine/learning/AI/cloud/API in brand green #009E73, mid tier (database, security, DevOps, analytics, automation, software, code) in teal, low-med (development, integration, platform, infrastructure, monitoring, testing, deployment, framework, Docker, AWS rotated 90°, Azure) in steel blue, lowest (Kubernetes, Terraform, GraphQL, Redis) in #4467A3 blue. No word touches another; noticeable gaps between words and an empty band under the legend.
      Legibility verdict: PASS

