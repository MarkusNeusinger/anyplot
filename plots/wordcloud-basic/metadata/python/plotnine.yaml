review:
  strengths:
  - 'Word size grows clearly with frequency: Python, data, machine and learning dominate
    the centre and the range runs down to small terms such as Redis and GraphQL, matching
    the spec''s first characteristic bullet.'
  - The spiral layout shrinks its size span until every word fits, so the cloud fills
    the full 3200x1800 panel with no word touching or covering another and none cut
    off at an edge, in both renders.
  - 'Text is preprocessed as the Notes ask: common words in lowercase, acronyms (AI,
    API, AWS) and proper nouns (Python, Docker, Kubernetes) in their usual case, each
    term once, no stop words.'
  - 'Idiomatic grammar mapping: geom_text with aes(label, size, angle) plus scale_size_identity
    places the precomputed layout directly, and coord_cartesian(expand=False) pins
    the panel to the layout''s point coordinates.'
  - Theme tokens are threaded through title, legend title, legend text and backgrounds,
    so both renders are theme-correct with identical data colors.
  weaknesses:
  - 'SC-01 (both): color is driven by a frequency tier derived from the frequency
    column (pd.cut into Low/Low-Med/Medium/High) with its own legend, a derived color
    channel the basic variant neither requires nor offers; the Notes allow decorative
    color or one additional property such as category, not a second encoding of the
    frequency already shown by size → make color decorative (for example a single
    #009E73 or steps of imprint_seq without a tier legend) or encode a real additional
    property such as a term category, and drop the tier legend and the invisible geom_point
    that only feeds it. Likely cause: the cloud["tier"] = pd.cut(...) block and aes(color="tier")
    with geom_point(alpha=0).'
  - 'VQ-01 (dark): the smallest words (Redis, GraphQL, Terraform) are set at 8 pt
    in the Low tier color #4467A3, which has only about 3.1:1 contrast on #1A1A17
    and reads dim at that size → raise the smallest size to about 10 pt (+2 pt) or
    keep the smallest words on a higher-contrast step. Likely cause: MIN_SIZE = 8
    combined with the blue end of the ramp for the lowest frequencies.'
  - 'Suggestion: a slightly wider PAD would give the tight pairs data/API and API/analytics
    a little more breathing room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas, panel and legend; no axes, ticks or grid.
      Chrome: bold dark title "wordcloud-basic · python · plotnine · anyplot.ai" centred at the top (~56% of width); below it a one-row legend "Frequency" with four square swatches High (62+), Medium (33-61), Low-Med (14-32), Low (0-13) in dark-grey text. All readable.
      Data: 29 technology terms in a spiral word cloud filling the panel. Python is the largest word at the centre, with data, machine, learning, cloud, database large around it; every fifth word (AI, DevOps, development, deployment, Azure) is vertical. Colors step from brand green #009E73 (High) through teal to blue #4467A3 (Low). No word touches another or the canvas edge; small terms Redis, GraphQL, Terraform, Kubernetes sit at the right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 everywhere.
      Chrome: title in light off-white, legend title light, legend labels light grey; no dark-on-dark text.
      Data: identical layout and identical data colors to the light render; only chrome flipped. Green and teal words read well; the Low-tier blue words (Redis, GraphQL, Terraform) at the smallest size are readable but dim (~3.1:1).
      Legibility verdict: PASS
