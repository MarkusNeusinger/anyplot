      Data: 29 technology terms all in Imprint green #009E73; Python largest at the center, then data, machine, learning, AI (vertical), cloud, API, database; every fifth word vertical (AI, DevOps, development, Azure, deployment). Smallest words Redis, GraphQL, Terraform, Kubernetes small but readable. No word touches another or the edge.
