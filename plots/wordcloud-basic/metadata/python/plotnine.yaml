review:
  strengths:
  - Correct Imprint palette applied in canonical order across the 4 frequency tiers,
    with brand green (#009E73) as the highest-frequency tier; backgrounds and all
    chrome are correctly theme-adaptive between light and dark renders.
  - Hand-placed layout achieves zero text overlap across 25 words spanning a wide
    size range (5-25mm).
  - Creative custom legend built from colored geom_text labels instead of a boxed
    plotnine default legend - fits the word-cloud aesthetic and stays legible in both
    themes.
  - Minimal chrome (axes, grid, ticks, spines all removed) keeps focus entirely on
    the word data, appropriate to the plot type.
  - Sensible workaround for plotnine's lack of a native word-cloud geom - uses scale_size_identity/scale_color_identity/scale_alpha_identity
    cleanly rather than falling back to matplotlib, per the library's no-workaround
    rule.
  weaknesses:
  - Layout leaves significant empty whitespace (upper-right quadrant, right margin
    beyond the legend, gaps between word clusters) rather than tightly filling available
    space as the spec describes ('Words are arranged to fill available space') - a
    spiral/organic packing approach would use the canvas more densely.
  - Legend shows a 'Low (<15)' ochre tier that has zero actual words in the dataset
    (minimum frequency is 16, Azure) - either add a word below frequency 15 or drop
    the unused tier so the legend matches the rendered data.
  - Smallest words (Azure, Docker, AWS) sit near the bottom of the size range and
    may be difficult to read at mobile/thumbnail scale - consider raising the minimum
    font-size floor slightly.
  - np.random.seed(42) is dead code - the entire dataset (words, frequencies, positions)
    is hardcoded, so no randomness is actually used; remove the seed call or make
    it meaningful.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold black title "wordcloud-basic · plotnine · anyplot.ai" centered at top, comfortably sized (~45% of canvas width). No axes, ticks, or grid - appropriate for a word cloud. A "Frequency" legend header (bold, dark ink) sits top-right with four colored category labels underneath.
      Data: 25 technology-survey words placed by hand across the canvas, sized 5-25mm by frequency. Color follows the Imprint palette in canonical order: brand green #009E73 for the highest tier (Python, Data, Machine, Learning, AI, Cloud, API - largest words), lavender #C475FD for medium (Database, Security, DevOps, Analytics, Automation, Development, Integration), and slate blue #4467A3 for low-medium (Platform, Infrastructure, Framework, Monitoring, Deployment, Testing, AWS, Docker, Azure). The fourth ochre tier ("Low (<15)") appears only in the legend with no matching words, since the minimum data frequency is 16. AWS is rotated 90° for an organic touch.
      Legibility verdict: PASS - all title, legend, and word text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, now rendered in off-white ink, fully legible. Legend header and category labels flip to light-toned text/ink where needed while retaining their frequency-tier colors.
      Data: Word colors are pixel-identical to the light render (green/lavender/blue - only chrome flipped), confirming the Imprint data-color rule is respected. Positions and sizes match the light render exactly.
      Legibility verdict: PASS - no dark-on-dark failures; every title, legend, and word element is clearly visible against the near-black background.
