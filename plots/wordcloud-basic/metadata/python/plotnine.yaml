review:
  strengths:
  - Word size maps frequency through aes(size=...) with scale_size_identity, so Python
    (95) is plainly the largest and the range runs down to a still-readable Redis
    (6) in both themes
  - The spiral layout shrinks the size range until all 29 words fit, so the cloud
    fills the 16:9 panel with consistent clearance and no word touches, overlaps or
    is cut off at the edge
  - 'Preprocessed vocabulary as the Notes ask: common words in lowercase, acronyms
    (AI, API, AWS) and proper nouns (Python, Docker, Kubernetes) in their usual case,
    no stop words, no duplicate spellings'
  - 'Decorative single Imprint green #009E73 reads on both #FAF8F1 and #1A1A17; only
    the title ink flips between themes'
  - theme_void plus coord_cartesian(expand=False) removes axes and grid, as a layout-positioned
    word cloud requires; geom_text maps both size and angle as aesthetics
  weaknesses:
  - 'Suggestion: "machine" and "learning" appear as two separate words; keeping the
    phrase "machine learning" as one term would read more like a survey theme'
  - 'Suggestion: the top-left and top-right corners stay a little emptier than the
    centre; a slightly tighter spiral step or a few more mid-frequency terms would
    even out the fill'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no axes or grid (theme_void).
      Chrome: bold near-black title "wordcloud-basic · python · plotnine · anyplot.ai" centered at the top, about 56 % of the width; fully readable.
      Data: 29 words, all in Imprint green #009E73. Python is largest at the centre, with machine, data, learning, cloud, database and a vertical AI around it; mid-size words (security, automation, analytics, API, a vertical DevOps and development) form a ring; small words (Terraform, GraphQL, Redis, Kubernetes, Azure) fill the edges. Every fifth word is rotated 90°. No word overlaps or touches another and none is cut off at the canvas edge; the smallest word, Redis, is still readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title flips to light ink #F0EFE8 and is clearly readable; no dark-on-dark text.
      Data: identical layout and identical #009E73 word color to the light render; green reads well on the dark surface, smallest words still legible.
      Legibility verdict: PASS
