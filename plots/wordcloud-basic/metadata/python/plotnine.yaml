review:
  strengths:
  - Word size follows frequency monotonically from Python (95) at about 50 pt down
    to Redis (6) at 10 pt, so the most frequent terms are plainly the largest and
    the smallest words stay readable in both renders
  - The spiral layout fills the whole panel with uniform 5 pt clearance; no word touches
    another or the canvas edge, and the adaptive shrink of the size span (size_span
    *= 0.92 until all words fit) keeps every word in the cloud
  - 'Placement and sizes are precomputed and then mapped through the grammar: geom_text
    with aes(size=..., angle=...) and scale_size_identity(), so rotation is an aesthetic
    rather than a per-label loop'
  - 'Preprocessed vocabulary: each term once, common words lowercase, acronyms (AI,
    API, AWS) and proper nouns (Python, Docker, Kubernetes) in their usual case'
  - 'Theme tokens threaded correctly: title in INK on #FAF8F1 / #1A1A17, words in
    Imprint #009E73 identical in both renders, no axes or grid'
  weaknesses:
  - 'CQ-04 (code): lines 175-179 blank the panel grid, axis text, axis titles and
    ticks one element at a time with five element_blank() entries → start from theme_void()
    and add only the background and title overrides in theme(). Likely cause: building
    the chrome-free theme by hand instead of using plotnine''s theme_void().'
  - 'Suggestion: a second Imprint color for one category (for example tools vs. concepts)
    with a small key could add information without crowding the cloud, as the Notes
    allow.'
  - 'Suggestion: a slightly larger minimum size (about 11-12 pt) would keep Redis
    and GraphQL crisper in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, 3200x1800; no axes, ticks or grid.
