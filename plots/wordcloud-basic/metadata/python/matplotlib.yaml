review:
  strengths:
  - 'Deliberate rank-based color mapping ties the Imprint palette to data meaning
    (highest-frequency word is always brand green #009E73, tapering through the palette
    by rank) instead of an arbitrary hash-based coloring'
  - Correct 3200x1800 canvas, theme-adaptive background/title driven cleanly by the
    ANYPLOT_THEME env var, with identical data colors between light and dark renders
  - 'Idiomatic wordcloud API usage: generate_from_frequencies + recolor(color_func=...),
    with tuned prefer_horizontal, relative_scaling, and margin parameters'
  - Realistic, neutral tech-skill frequency data with a believable long-tail distribution
    (150 down to 7) across 39 terms
  weaknesses:
  - 'Word placement leaves the right half of the canvas, especially the top-right
    and bottom-right corners, noticeably sparser than the left half (grid density
    check: ~0.00-0.04 fill fraction on the right two columns vs up to 0.13 on the
    left) — the cloud doesn''t evenly fill the available space as the spec calls for.
    Try increasing max_words, adding more mid-frequency filler terms, or adjusting
    margin/min_font_size to spread density more evenly.'
  - At the ~400px mobile thumbnail scale, the lowest-frequency terms (Documentation,
    Debugging, Scalability, Architecture) shrink to the point of being hard to read.
    Consider raising min_font_size slightly or trimming the longest tail of near-invisible
    terms.
  - Beyond color-by-rank, the implementation doesn't add another distinctive technique
    (e.g., a custom mask/shape or highlighting a specific term) that would push Library
    Mastery further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "wordcloud-basic · python · matplotlib · anyplot.ai" rendered in dark ink, centered near the top, spanning ~51% of plot width — clearly readable against the light background. No axis, no legend (word cloud correctly hides both via ax.axis('off')).
      Data: 39 tech-skill terms arranged in a packed cloud, sized by frequency (Python largest, tapering down to Documentation/Debugging smallest). Colors are drawn from the 8-hue Imprint palette assigned by frequency rank — the top word "Python" is brand green (#009E73), with JavaScript, Machine Learning, Security, Data, etc. cycling through the remaining hues. Word placement clusters more heavily on the left half of the canvas; the right half (particularly top-right and bottom-right corners) is visibly sparser.
      Legibility verdict: PASS — all rendered words are legible at full resolution; smallest terms become hard to read only at the ~400px mobile thumbnail scale.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title text now rendered in light ink, fully legible against the dark background. Layout and title position match the light render exactly.
      Data: Same word placement and same per-word colors as the light render (Python still #009E73 green, same palette cycling) — confirms only chrome (background/title ink) flipped between themes, as required. No dark-on-dark or light-on-light failures observed; every word remains clearly distinguishable from the near-black background.
      Legibility verdict: PASS — no dark-on-dark issues; smallest terms have the same mobile-scale legibility caveat as the light render.
