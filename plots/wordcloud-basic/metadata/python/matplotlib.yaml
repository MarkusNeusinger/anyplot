      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "wordcloud-basic · python · matplotlib · anyplot.ai" rendered in dark ink, centered near the top, spanning ~51% of plot width - clearly readable. No axes/legend (correctly hidden via ax.axis('off')).
