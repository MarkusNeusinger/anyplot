review:
  strengths:
  - 'Correct Imprint palette application: highest-frequency word "app" renders in
    brand green #009E73, and ranks 2-8 follow the canonical palette order exactly
    (lavender, blue, ochre, red, cyan, rose, lime)'
  - 'Theme-adaptive chrome verified pixel-exact: light background measures #FAF8F1,
    dark background measures #1A1A17, and data colors are byte-identical between renders
    (only chrome flips)'
  - 'Zero edge clipping and strong canvas utilization, both confirmed programmatically:
    no non-background pixels on any canvas border, content bounding box spans ~73%
    width x ~86% height'
  - 'Fully deterministic and reproducible: hardcoded word/frequency arrays with no
    RNG dependency, so no seed is needed and none is missing'
  - 'Genuinely distinctive Makie usage: a collision-free Archimedean-spiral placement
    algorithm built on Makie.text_bb real glyph metrics, since Makie has no built-in
    wordcloud recipe to fall back on'
  - 'Realistic, well-rounded data: 44 support-ticket terms for a smart-thermostat
    app spanning both satisfaction terms (love, easy, reliable, helpful) and pain
    points (bugs, glitch, freeze, disappointed, refund)'
  - 'Clean KISS code: no functions/classes, only used imports (CairoMakie, Makie,
    Colors), no fake interactivity'
  weaknesses:
  - 'Color is redundant with size: the top-8 rainbow coloring is assigned purely by
    frequency rank, so it repeats the same ''which words are biggest'' information
    already conveyed by font size instead of adding a new dimension. The data has
    an obvious positive/negative split (love, easy, reliable, helpful, sleek vs. bugs,
    glitch, freeze, laggy, disappointed, refund, unresponsive) -- per the style guide''s
    sentiment/polarity semantic exception (positive to green, negative to red), mapping
    color to sentiment instead of rank would turn this into a genuinely insightful
    visualization (which themes are wins vs. pain points) rather than a decorative
    top-N highlight.'
  - Smallest-frequency words (fontsize ~16, e.g. 'refund', 'manual', 'glitch', 'restart',
    'unresponsive') sit near the legibility floor at full resolution and risk becoming
    near-illegible once the PNG is scaled to the ~400px mobile thumbnail -- consider
    nudging min_fs up a few points.
  - The 'top-N gets palette, rest gets muted' technique is competent but generic;
    it doesn't showcase a stronger Makie-specific flourish beyond the placement algorithm
    itself, e.g. tying color to a meaningful data dimension (see sentiment point above)
    would also lift Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured pixel value (250,248,241) = #FAF8F1 exactly as specified -- not pure white.
      Chrome: Title "wordcloud-basic · julia · makie · anyplot.ai" renders bold and dark, top-center, clearly legible. All 44 words are readable against the light surface, including the 36 muted-gray tail words.
      Data: 8 most-frequent words individually colored in Imprint palette canonical order -- "app" (highest frequency) is #009E73 brand green, followed by "easy" (lavender), "battery" (blue), "love" (ochre), "setup" (red), "temperature" (cyan), "sync" (rose), "schedule" (lime). Remaining words use the theme-adaptive muted-gray anchor.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, measured pixel value (26,26,23) = #1A1A17 exactly as specified -- not pure black.
      Chrome: Same title now in light ink, fully legible. Muted tail words switch to lighter warm-gray, remaining readable. No dark-on-dark failures observed.
      Data: Confirmed identical to light render -- word-cloud content bounding box is pixel-identical (428-2760 x, 40-1582 y) between both renders, and the 8 highlighted words retain the exact same hex values (green/lavender/blue/ochre/red/cyan/rose/lime), only chrome differs.
      Legibility verdict: PASS
