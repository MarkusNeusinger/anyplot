review:
  strengths:
  - 'Correct Imprint palette usage: Core Platform renders in exact brand green #009E73,
    Cloud Services and Emerging Markets follow canonical positions 2/3 (#C475FD, #4467A3),
    identical between light and dark renders'
  - 'Theme-adaptive chrome is fully wired through: verified pixel-exact #FAF8F1/#1A1A17
    backgrounds and #1A1A17/#F0EFE8 text colors in light/dark respectively, with no
    dark-on-dark or light-on-light failures'
  - Confidence bands use each series' own color at alpha 0.28, giving an honest visual
    read of overlapping uncertainty between adjacent stacked series rather than a
    flat generic gray
  - Prediction interval half-width grows with sqrt(quarters), a realistic model of
    widening forecast uncertainty over the horizon
  - Title and legend exactly match the required format and data labels; axis labels
    are descriptive with units ($M, cumulative)
  - Clean KISS code structure with explicit Random.seed!(42), only used imports, and
    correct plot-$(THEME).png output naming
  - Canvas utilization is excellent - chart area fills the large majority of the 3200x1800
    canvas with the legend adjacent, not isolated
  weaknesses:
  - Both xgridcolor and ygridcolor are set, producing visible vertical AND horizontal
    gridlines; the style guide's Grid Guidelines call for Y-axis grid only on line/area
    charts - drop xgridcolor (or set xgridvisible = false) to match the guideline
    and reduce visual noise
  - 'Design storytelling is minimal: the chart relies entirely on the default stacked-area
    composition with no emphasis technique (color contrast on a focal series, callout,
    or annotation) drawing the eye to an insight - e.g., the widening prediction interval
    over the forecast horizon is present in the data but not visually emphasized'
  - 'Library Mastery is generic: band! + Legend + colsize! are solid but standard
    Makie idioms that any static-plotting library could replicate with fill_between-equivalents
    - consider leveraging something more distinctly Makie (e.g. a Colorbar-based uncertainty
    encoding, or a second linked Axis) to raise distinctiveness'
  - The legend swatch for '90% prediction interval' uses a flat muted gray (INK_SOFT
    at 0.28) rather than reflecting that each series carries its own colored band
    - acceptable as a generic catch-all but a per-series or gradient-styled legend
    entry would better match the 'matching lighter shades' guidance from the spec
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, confirmed visually consistent with #FAF8F1 - not pure white.
      Chrome: Title "area-stacked-confidence · julia · makie · anyplot.ai" is bold, dark, and fully visible at top-center. Y-axis label "Revenue ($M, cumulative)" and x-axis label "Fiscal Quarter" are dark and clearly legible. Tick labels (Q1'24 ... Q1'29, slightly rotated) and y-axis tick labels (0/20/40/60) are readable in a softer dark gray. Legend at right lists "Core Platform", "Cloud Services", "Emerging Markets", "90% prediction interval" with matching color swatches, framed without a border, background matching the page.
      Data: Three stacked areas from bottom to top - green (Core Platform, #009E73), lavender/purple (Cloud Services), and slate blue (Emerging Markets), each topped by a thin semi-transparent confidence band and a solid boundary line. Bands widen visibly toward the right (later quarters), reflecting growing forecast uncertainty. All values trend upward from ~32 to ~70 ($M cumulative) over 24 quarters.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at exactly (26,26,23) = #1A1A17 - not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light tones (pixel-sampled title text at (240,239,232) = #F0EFE8), fully legible against the dark background. Gridlines are subtle (low-alpha light overlay). Legend background and text also flipped to dark-surface-appropriate tones, no dark-on-dark failures observed.
      Data: Identical green/lavender/slate-blue stacked areas and confidence bands as the light render - confirmed the data colors are unchanged between themes, only the surrounding chrome (background, text, grid, legend frame) flipped.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark or unreadable elements found.
