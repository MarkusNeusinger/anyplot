review:
  strengths:
  - 'Correct Imprint palette in canonical order (brand green, lavender, blue) — identical
    data colors across both themes, and plot backgrounds match #FAF8F1 / #1A1A17 exactly'
  - 'Clean layered composition: opaque stacked areas, semi-transparent 90% PI bands
    (alpha=0.28, within the spec''s 0.2-0.4 guidance), and boundary lines drawn on
    top for a legible visual hierarchy'
  - Theme-adaptive chrome is fully threaded through (spines, grid, tick colors, legend
    text) — no light-on-light or dark-on-dark legibility failures in either render
  - Title matches the mandated format exactly; legend clearly labels all three product
    lines plus a dedicated '90% prediction interval' swatch
  - Realistic, neutral quarterly-revenue-forecast scenario with a plausible prediction-interval-widening
    formula (half-width grows with sqrt of forecast horizon)
  weaknesses:
  - 'CRITICAL LAYOUT BUG: the second Axis panel (ax2, ''Combined 90% PI half-width'')
    and its text! annotation (''±X.XM by Q1''29'') — the code''s intended distinctive
    feature via linkxaxes! and rowsize!(fig.layout, 2, Relative(0.26)) — are not visible
    in either rendered PNG. The main stacked-area panel occupies roughly 90% of the
    canvas height instead of the intended ~74%, and the x-axis tick labels / ''Fiscal
    Quarter'' label at the very bottom appear to be orphaned from a collapsed, near-zero-height
    ax2 rather than belonging to the main chart (whose own x-decorations were explicitly
    hidden via hidexdecorations!). Debug why rowsize!/Relative isn''t reserving visible
    plot area for row 2 (e.g. check whether colsize!/Legend placement on row 1 is
    interfering with row 2''s sizing), or simplify by removing ax2 entirely and placing
    the widening-uncertainty insight as a direct annotation on the main chart instead.'
  - Confidence bands are quite subtle at this canvas scale — alpha=0.28 is within
    the spec's suggested range, but since the intended headline callout (ax2) isn't
    rendering, the widening-interval story has no other visual reinforcement in the
    main panel
  - No surviving visual hierarchy/callout highlights the growing uncertainty over
    time in the main panel — the storytelling device that was meant to carry this
    (the ax2 annotation) does not render
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "area-stacked-confidence · julia · makie · anyplot.ai" in bold dark ink at the top, fully visible and not clipped. Y-axis "Revenue ($M, cumulative)" and x-axis "Fiscal Quarter" labels are dark and clearly legible. Tick labels (0/20/40/60 on Y; Q1'24...Q1'29 on X, rotated slightly) are legible mid-grey. Subtle horizontal gridlines visible but not distracting. Legend on the right (no frame) lists Core Platform, Cloud Services, Emerging Markets, and 90% prediction interval, all readable.
      Data: Three stacked areas in brand green (#009E73, Core Platform, bottom), lavender (#C475FD, Cloud Services, middle), and blue (#4467A3, Emerging Markets, top) — matches Imprint canonical order. A subtle lighter overlay band (confidence interval) sits along each series boundary, most visible as the light grey-blue band on the outer edge of the total stack. Boundary lines drawn in the same series colors sit crisply on top.
      Notable issue: Only ONE chart panel is visible, filling nearly the full canvas height. The code defines a second linked Axis panel below the main chart ("Combined 90% PI half-width") with its own y-axis, band, line and a "±X.XM by Q1'29" annotation, sized to occupy ~26% of the figure height — none of this is visible. The x-axis tick labels and "Fiscal Quarter" label sit immediately below the main stacked-area shape with no visible second panel above them, suggesting that panel's plot area rendered at (or very near) zero height.
      Legibility verdict: PASS (all visible text is readable), but flagged as a layout/rendering defect — see weaknesses.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all render in light ink/off-white and grey tones, clearly legible against the dark background — no dark-on-dark failures observed. Gridlines are faint but visible. Legend renders the same as in the light theme with light-colored text.
      Data: Same three data colors as the light render — green #009E73, lavender #C475FD, blue #4467A3 — confirming the data-color-identity rule (only chrome changed between themes). Confidence-band overlay and boundary lines are equally identifiable.
      Notable issue: Same missing-second-panel defect as the light render — the "Combined 90% PI half-width" sub-panel and its annotation are absent, and the x-axis tick labels/"Fiscal Quarter" label appear directly below the main chart with no visible second-panel content above them.
      Legibility verdict: PASS (all visible text is readable), but flagged as a layout/rendering defect — see weaknesses.
