review:
  strengths:
  - First-class use of d3.stack() to derive both the stacked central areas and the
    confidence bands from the same cumulative baseline, so stack order is guaranteed
    consistent between values and bands as the spec requires
  - Distinct Imprint palette colors (green/lavender/blue/ochre) are identical across
    light and dark renders; only chrome (background, grid, ticks, legend text) flips
    correctly
  - Confidence bands visibly widen further into the forecast horizon, giving the reader
    an immediate, honest read of growing uncertainty over time
  - 'Clean theme-adaptive chrome throughout: y-axis-only subtle grid, L-shaped spines,
    explicit font sizes on every text element, legend positioned close to the plot'
  - Title fontsize is dynamically scaled down for the long mandated+descriptive-prefix
    string so nothing clips or overflows the canvas
  weaknesses:
  - Title only fills ~43% of the chart width despite using the mandated + descriptive-prefix
    format (~81 chars) — the linear shrink formula (22 * 67/title.length) undershoots
    for prefixed titles; tune the formula or its floor so long titles still read prominently
    (~50-60% of width) without overflowing
  - All four series share the exact same fractional confidence-band growth curve (0.04
    + i/(n-1)*0.22) — only the absolute band width differs because central values
    differ; vary the per-series growth rate (e.g. Subscriptions widening faster than
    Hardware) so the chart demonstrates that some series are inherently more uncertain
    than others
  - Confidence bands use a flat 0.3-alpha fill; the spec explicitly suggests considering
    a gradient fill from lower to upper bound for extra visual clarity — worth exploring
    to push Design Excellence further
  - 'Legend caption (''Shaded band: 90% prediction interval'') at 14px looks slightly
    smaller/lighter than the 16px legend row labels directly above it — align sizing
    or weight for a more polished legend block'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Product Line Forecast · area-stacked-confidence · javascript · d3 · anyplot.ai" in bold dark ink at top-center; axis titles "Fiscal Quarter" (x) and "Stacked Revenue ($M)" (y, rotated) in dark ink; tick labels ($0M-$80M, 2024-2028) and legend text in a softer dark gray. Subtle horizontal gridlines only on the y-axis. All text is clearly readable against the light background.
      Data: Four stacked areas from bottom to top — Hardware (brand green #009E73), Software (lavender), Services (blue), Subscriptions (ochre) — each with a translucent confidence band of the same hue layered above its solid central area, plus a crisp boundary line at the top of each layer. Bands visibly widen from left (2024) to right (2028), showing growing forecast uncertainty. Legend on the right lists all four series with color swatches plus a caption explaining the shaded band represents a 90% prediction interval.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, tick labels, and legend now rendered in light ink/off-white and soft light gray, fully legible against the dark background. No dark-on-dark text anywhere. Gridlines remain subtle.
      Data: Identical four data colors (green/lavender/blue/ochre) to the light render — confirms the palette does not shift between themes. Only the background, text, and grid colors flip. The confidence bands and boundary lines read just as clearly as in the light render.
      Legibility verdict: PASS
