      Data: Three stacked areas from bottom to top — green (Hardware, #009E73), purple/lavender (Software, #C475FD), and slate-blue (Services, #4467A3), each with a lighter translucent band above its central boundary showing the widening 90% prediction interval further into the forecast horizon (2024–2028). All text is fully readable against the light background.
