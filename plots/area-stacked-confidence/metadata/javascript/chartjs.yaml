review:
  strengths:
  - 'Correct Imprint palette in canonical order (#009E73 Hardware, #C475FD Software,
    #4467A3 Services), identical across both themes with theme-correct chrome in both
    renders'
  - Deterministic LCG-based pseudo-randomness (seed 42) — fully reproducible without
    a native browser RNG
  - Stack order kept consistent between central values and their confidence bounds
    via the shared cumulativeBase running total, matching the spec's explicit requirement
  - Subtitle explicitly explains what the shaded bands represent ('90% prediction
    interval'), adding genuine data-storytelling value beyond a bare chart
  - Legend correctly filters out the 6 auxiliary band datasets, showing only the 3
    semantic series names
  - Clean, well-commented, KISS-structured code with explicit font sizing throughout
    and no unused imports
  weaknesses:
  - 'Confidence bands render visually asymmetric around each central line even though
    the underlying data (value ± halfWidth) is symmetric: the opaque central-area
    fill (backgroundColor alpha 0.65) is drawn before the band datasets and fully
    covers the lower half of each band (between lower-bound and central value), so
    only the upper half of the band is visible — and it visibly bleeds upward into
    the next series'' stacked region instead of staying within its own series'' slice.
    Fix by lowering the central fill''s opacity so the lower-band half stays visible
    as a distinct shade, or by drawing the lower-half band as its own translucent
    layer from the previous stack boundary up to (central - halfWidth) so both halves
    read clearly.'
  - The spec's note 'Consider using gradient fills from lower to upper bound for visual
    clarity' was not applied — flat alpha bands work but a gradient would better communicate
    the tapering confidence toward the central estimate and lift Design Excellence.
  - 'Legend identifies the 3 series but not what the bands represent (per spec: ''legend
    identifying each series and what the bands represent'') — currently only the subtitle
    text carries that meaning; consider a small legend note or swatch for the band
    role so the chart is self-explanatory without relying on the subtitle.'
  image_description: |-
