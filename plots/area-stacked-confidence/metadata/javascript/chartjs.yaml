review:
  strengths:
  - 'Fixed the attempt-1 band-bleed issue: each series now renders as a solid slice
    up to its own lower bound, topped by a translucent band from lower to upper, chained
    off the previous series'' band top — confirmed via pixel sampling that the central
    line sits exactly at the visual midpoint of its own band and the boundary to the
    next series is sharp with no color bleed.'
  - Added a vertical gradient (alpha 0.15→0.4) to each confidence band per the spec's
    suggestion, giving the bands a tapering, more polished look versus the flat-alpha
    fill from attempt 1.
  - Added a dedicated "90% prediction interval" legend entry, so the legend now identifies
    both each series and what the shaded bands represent, per spec.
  - 'Correct Imprint palette in canonical order (#009E73 Hardware, #C475FD Software,
    #4467A3 Services), identical data colors across both themes with fully theme-correct
    chrome (title, subtitle, axis labels, ticks, grid) in both renders.'
  - Deterministic LCG-seeded (seed 42) pseudo-random data generation — fully reproducible
    without a native browser RNG.
  - Widening bands toward the forecast horizon (2024→2028) plus the explanatory subtitle
    communicate growing forecast uncertainty, a clear data-storytelling touch.
  - 'Clean, KISS-structured code: explicit font sizing throughout, no unused imports,
    sensible small helper functions (lcg, hexToRgba, bandGradient) justified by the
    browser''s lack of a seeded RNG / gradient API.'
  weaknesses:
  - 'Tooltips are fully disabled (tooltip: { enabled: false }), which also disables
    hover detail in the interactive plot-{theme}.html view — for a 3-series stacked
    chart with confidence bands, a custom tooltip surfacing the central/lower/upper
    values per hovered quarter would add real interactive value instead of losing
    it entirely.'
  - 'Central lines use pointRadius: 0 across all 20 quarters; per the sparse-data
    heuristic (< 50 points → prominent markers), small markers on the central line
    would improve readability at a glance and at thumbnail scale without cluttering
    the dense stacked-area composition.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (sampled ~(250,248,241)) - not pure white, not dark.
      Chrome: Title "area-stacked-confidence · javascript · chartjs · anyplot.ai" in dark ink, subtitle "Shaded bands show the 90% prediction interval for each product line" in muted gray, both fully legible. Y-axis title "Cumulative Revenue ($M)" and X-axis title "Fiscal Quarter" are dark and readable, tick labels legible mid-gray, Y-axis grid subtle, X-axis grid off. Legend top-right shows correctly colored swatches for Hardware / Software / Services plus a dedicated gray "90% prediction interval" swatch, clear of the plotted area.
      Data: Three stacked areas bottom-to-top: green (Hardware, #009E73), purple (Software, #C475FD), slate-blue (Services, #4467A3) — first series is the brand green as required. Each series shows a solid "confident" slice topped by a translucent vertical-gradient band (alpha 0.15→0.4) spanning its lower→upper 90% prediction bound; pixel-sampled at x=2000 confirms the central line sits exactly at the midpoint of its own band (y=718 vs band span 694-742) and the transition into the next series' solid region is a sharp, non-bleeding boundary. Bands visibly widen further into the forecast horizon.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels all render in light/off-white ink — no dark-on-dark failures anywhere. Grid lines remain subtle but visible. Legend position, swatch colors, and the "90% prediction interval" entry match the light render exactly.
      Data: Same green/purple/slate-blue data colors as the light render (only chrome flipped), same gradient bands and clean series boundaries, same widening-uncertainty pattern toward the forecast horizon.
      Legibility verdict: PASS
