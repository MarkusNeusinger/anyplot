review:
  strengths:
  - 'Each band is built from MUI X''s own stacking: an invisible offset series (stack
    below + lower bound) plus a filled width series in a per-band stack group, so
    every band sits exactly on its series'' stacked edge at every quarter and keeps
    the central stack order'
  - 'Stacked central layers in the canonical Imprint order (#009E73, #C475FD, #4467A3)
    with a 2.5 px edge line per layer, so layer thickness reads as value and the stacked
    edge is distinct in both themes'
  - Bands widen with the forecast horizon (half-width 4–22 % of the value), a plausible
    fan-out for a quarterly revenue forecast, and stay symmetric by construction;
    the code checks symmetry and would label the legend '(asymmetric)' otherwise
  - Legend names each product line and states what the bands are ('90% prediction
    interval around each layer's edge'); the subtitle summarises the period, series
    count and band range computed from the data
  - 'Library-native tooltip: the central series'' valueFormatter uses dataIndex to
    show the value with its lower–upper bounds while the band helper series stay out
    of the tooltip'
  - Theme tokens threaded through all chrome (title, subtitle, ticks, axis titles,
    grid, legend text); all text readable in both renders, explicit font sizes and
    sized axis bands avoid MUI X tick truncation
  weaknesses:
  - 'Suggestion: the band legend swatch is a gradient through all three series colors;
    three small per-series band swatches next to each series entry would tie each
    band to its layer more directly.'
  - 'Suggestion: the gap between the x tick labels and the ''Quarter'' axis title
    is generous (about 40 px); a slightly smaller x-axis band would tighten the bottom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 throughout, no white panel.
      Chrome: bold dark title "area-stacked-confidence · javascript · muix · anyplot.ai" top left with a soft-ink subtitle ("20 quarters, Q1 2024 – Q4 2028 · 3 stacked series · band half-width 4–22% of the value"); y-axis "Revenue ($M)" 0–100 with subtle horizontal grid; x-axis "Quarter" with ticks every other quarter (Q1 2024 … Q3 2028); HTML legend bottom center (Hardware, Software, Services, 90% prediction interval around each layer's edge). All text dark on light and readable.
      Data: three stacked areas from a zero baseline — Hardware brand green #009E73 at the bottom (≈42 → 33), Software lavender #C475FD in the middle, Services blue #4467A3 on top, stack total ≈73 → 94. Each layer has a 2.5 px edge line and a semi-transparent band in its own color around that edge, widening from narrow at 2024 to wide at 2028; the Services band above the top edge reads as pale grey-blue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, tick labels, axis titles and legend text all switch to light ink and are clearly readable; grid lines subtle but visible. No dark-on-dark text.
      Data: identical data colors to the light render (green, lavender, blue layers and bands); only chrome flipped. The Services band above the top edge reads as a dark slate strip but remains visible against the background; brand green clearly visible.
      Legibility verdict: PASS
