review:
  strengths:
  - 'Correct, spec-faithful confidence-band technique: an invisible offset series
    plus a width series per line reproduces a band that straddles exactly that series''
    own portion of the stack, keeping stack order consistent between centers and bands.'
  - Deterministic, seeded synthetic data (LCG, seed=42) with a realistic fan-out uncertainty
    growth pattern over the forecast horizon.
  - Hand-rolled Y-axis label column that sidesteps a real MUI X tickFontSize/tickLabelStyle
    offset bug rather than accepting overlapping text, documented with a clear code
    comment.
  - 'Both renders are theme-correct: brand-consistent Imprint colors, warm off-white/near-black
    backgrounds, fully legible chrome in both themes, no clipping.'
  weaknesses:
  - 'Duplicate legend: the custom top-row legend (needed to label the 90% prediction
    interval swatch) duplicates the series names that MUI X''s own built-in legend
    renders immediately below it. Suppress the built-in legend (e.g. slotProps={{
    legend: { hidden: true } }}) and keep only the custom legend.'
  - Confidence bands are drawn as a straddling stripe at each stack boundary rather
    than a band symmetric around each series' own fill, so they visually blend with
    the layer above (e.g. the Hardware band reads as a grayish-lavender smear rather
    than a clearly lighter green). Consider a slightly higher fill opacity or a thin
    same-hue stroke on the band edges for clearer per-series ownership.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white
      Chrome: title "Quarterly Revenue Forecast · area-stacked-confidence · javascript · muix · anyplot.ai" is bold dark text, fully readable; custom legend row (3 series swatches + "90% prediction interval (per line)" swatch) followed by a redundant duplicate MUI X built-in legend showing the same 3 series names again; Y-axis "Revenue ($M)" label in a hand-rolled rotated column at left, fully visible; X-axis "Quarter" label and quarterly tick labels (Q1 2024 .. Q4 2028) all readable; subtle horizontal gridlines only
      Data: Hardware (brand green #009E73, base layer), Software (lavender #C475FD, middle), Services (blue #4467A3, top) stacked areas with translucent same-hue confidence bands straddling each series' own upper boundary; first series correctly uses brand green
      Legibility verdict: PASS (all text readable; only issue is the duplicate legend, not a legibility failure)

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black
      Chrome: title, both legend rows, Y-axis label, X-axis label and tick labels all flip to light ink and remain fully legible; no dark-on-dark failures; duplicate legend issue present identically
      Data: colors are pixel-identical to the light render (green/lavender/blue data fills and bands) — only chrome flipped, as required
      Legibility verdict: PASS
