review:
  strengths:
  - 'The stacked-band trick correctly preserves stack order between central values
    and their confidence bands, exactly as the spec requires — verified visually:
    bands track their own series boundary consistently across all 20 quarters.'
  - Canonical Imprint palette order (green → lavender → blue), pixel-identical data
    colors between light and dark renders.
  - Custom legend explicitly labels what the gray swatch represents ("90% prediction
    interval (per line)"), satisfying the spec's "include legend identifying each
    series and what the bands represent."
  - Both renders are fully readable with zero overlap or edge clipping; the documented
    y-axis-label workaround (hand-rolled column instead of MUI X's built-in offset)
    is a genuinely useful fix for a known layout bug.
  - 'Deterministic, realistic data: revenue grows with quarterly seasonality and uncertainty
    widens with forecast horizon (the "fan out" pattern real forecasts show).'
  weaknesses:
  - No explicit visual emphasis (annotation, callout, or secondary encoding) highlights
    a specific insight — e.g. the growing uncertainty in later quarters, or the crossover
    where Software overtakes Hardware — the chart tells the story implicitly but doesn't
    guide the viewer to it.
  - The spec's "Consider using gradient fills from lower to upper bound for visual
    clarity" note wasn't explored — flat semi-transparent fills work but leave a suggested
    refinement on the table.
  - With all 20 quarterly ticks always shown, label density is already tight at this
    canvas size — fine today, but leaves no margin if this pattern is reused for a
    longer time series.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 target — not pure white, not dark.
      Chrome: Bold dark title ("Quarterly Revenue Forecast · area-stacked-confidence · javascript · muix · anyplot.ai") spans ~40% of canvas width. Custom horizontal legend below the title lists Hardware/Software/Services color swatches plus a gray "90% prediction interval (per line)" swatch. Y-axis "Revenue ($M)" rotated label and $0-$100 ticks; x-axis "Quarter" label with all 20 quarterly tick labels (Q1 2024 - Q4 2028), tightly spaced but non-overlapping. Subtle horizontal grid lines visible. All chrome text is dark and clearly legible against the light background.
      Data: Three stacked areas bottom-to-top: Hardware (brand green #009E73), Software (lavender), Services (blue) — canonical Imprint palette order. Each series wrapped in a lighter, semi-transparent confidence band of the same hue that visibly widens toward later quarters (uncertainty fan-out). No overlap between text and data, no clipping at any edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 target — not pure black, not light.
      Chrome: Same title, legend, and axis labels as light render, all rendered in light-colored text against the dark background. Tick labels, axis titles, and legend text are all clearly readable — no dark-on-dark failures observed. Grid lines remain subtle but visible.
      Data: Colors are pixel-identical to the light render (green, lavender, blue for the three series; confidence bands read as a translucent lightening of each hue) — only chrome flipped between themes, exactly as required.
      Legibility verdict: PASS
