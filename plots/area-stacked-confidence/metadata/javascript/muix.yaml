review:
  strengths:
  - One shared stack offset (`below`) feeds both the central layers and their bands,
    so every band sits on its own series' edge at each quarter
  - 'Bands built natively from MUI X stack groups: an invisible base series plus a
    filled width series per band, styled through data-series CSS selectors'
  - Symmetry is computed from the data and the legend adds '(asymmetric)' only when
    the bounds are not symmetric; the subtitle states the half-width range from the
    data
  - Realistic forecast whose 90% intervals widen with the horizon, in Imprint order
    with identical data colours in both themes
  weaknesses:
  - 'LM-01 (code): the six band helper series (band-base-*, band-width-*) have no
    label, so the HTML tooltip lists unnamed rows whose values are stack offsets (below
    + lower bound) and band widths, not the bounds → hide them from the tooltip and
    show the bounds on the central series instead. Likely cause: band series without
    `valueFormatter: () => null`.'
  - 'Suggestion: in the dark render the Services band above the stack top (#4467A3
    at 0.32 on #1A1A17) is faint; an opacity near the spec''s 0.4 ceiling would give
    it more presence.'
  - 'Suggestion: the legend''s band swatch is a three-colour gradient that is dim
    on the dark page; a neutral translucent swatch beside an edge-line sample could
    read more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold title "area-stacked-confidence · javascript · muix · anyplot.ai" top-left (~38% of width), grey subtitle "20 quarters, Q1 2024 – Q4 2028 · 3 stacked series · band half-width 4–22% of the value"; y axis "Revenue ($M)" 0–100, x axis "Quarter" with alternate quarter ticks Q1 2024 … Q3 2028; subtle horizontal grid; HTML legend at the bottom (Hardware, Software, Services, gradient swatch "90% prediction interval around each layer's edge"). All text dark and readable.
      Data: three stacked areas — Hardware #009E73 from zero (~42 → 33), Software #C475FD (~18 → 40), Services #4467A3 on top (total ~72 → 98) — each with a 2.5 px edge line and a translucent band in its colour around the edge, widening toward 2028; bands reach into neighbouring layers as the spec permits.
