review:
  strengths:
  - 'Clever core-only workaround: since arearange lives in the forbidden highcharts-more
    module, the implementation builds confidence bands from plain ''area'' series
    with an invisible transparent base plus a colored width layer on an independent
    per-series stack, correctly aligned to the cumulative stack position of its central
    series.'
  - Band opacity (0.28) and matching per-series hue via Highcharts.color(...).setOpacity()
    satisfy the spec's 'matching lighter shades' and 'alpha 0.2-0.4' guidance precisely,
    and the halfWidth is reused for both bounds so bands are symmetric as the spec
    recommends.
  - 'Data tells a real story: prediction-interval half-width grows with forecast horizon
    (0.35 * i term), so the bands visibly widen further into the forecast — communicating
    growing uncertainty, not just decoration.'
  - 'Legend is fully honest about the band via a zero-data ''legendProxy'' series
    showing ''90% prediction interval'', while the two real band/base helper series
    are hidden from the legend (showInLegend: false) — no legend clutter.'
  - 'Theme-adaptive chrome is complete and correct in both renders: warm off-white/near-black
    backgrounds, ink/inkSoft text tokens throughout, first series is exactly the brand
    green #009E73, and palette positions 2-3 (lavender, blue) are used in canonical
    order.'
  - Explicit CSS-px font sizing throughout (title 22px, subtitle/ticks 14px, axis
    title 16px) with animation disabled on both chart and series per the harness contract.
  weaknesses:
  - At the boundary between adjacent stacked series, a band's translucent fill sits
    partly over its own series and partly over the neighboring series (e.g. the Professional
    Services band spans across the Professional Services / Hardware boundary), producing
    a blended hue at that seam. It reads correctly once the viewer understands the
    'band straddles the cumulative boundary' logic, but on first glance it can look
    like a fourth color rather than an uncertainty band — a one-line callout or a
    slightly lower band opacity near seams would sharpen this.
  - Design relies entirely on the default Imprint categorical palette and default
    subtitle/legend layout; there is no additional bespoke touch (custom annotation,
    callout, or emphasis on the widening-uncertainty story) that would push this from
    'strong, thoughtful default execution' into truly distinctive, publication-grade
    territory.
  - The stacked-band-via-hidden-base trick is a generic technique portable to any
    library that supports stacked areas (D3, ECharts, matplotlib fill_between) rather
    than something uniquely enabled by a Highcharts-specific API — Highcharts.color().setOpacity()
    is a nice touch but is a minor helper, not a distinctive feature.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "area-stacked-confidence · javascript · highcharts · anyplot.ai" and gray subtitle "Quarterly revenue forecast by product line, shaded bands show the 90% prediction interval" both fully legible; y-axis title "Revenue ($M)" rotated on the left; x-axis shows monthly ticks Jan 2025 - Nov 2026; legend at bottom lists "Cloud Services", "Hardware", "Professional Services", "90% prediction interval" with matching color swatches; thin horizontal gridlines only, subtle gray.
      Data: Three stacked areas from bottom to top: Professional Services (blue, #4467A3-family), Hardware (lavender/purple, #C475FD-family), Cloud Services (green, #009E73 — confirmed brand green, on top). Each series has a lighter, translucent confidence band straddling its own cumulative stack boundary, visibly widening toward the right (later forecast months), showing growing uncertainty over the horizon. Total stacked revenue rises from ~40M to ~105M across the 24-month span.
      Legibility verdict: PASS — all title, subtitle, axis, tick, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis/tick/legend text render in light gray/off-white tones, all clearly legible; subtitle in a slightly dimmer light gray, still readable; gridlines are faint light-gray horizontal lines, subtle but visible.
      Data: Same three-series stacking and coloring as the light render — Cloud Services green, Hardware lavender, Professional Services blue — data hues are pixel-identical to the light render; only the chrome (background, text, grid) flips. Brand green #009E73 remains vivid and clearly visible against the dark surface. Confidence bands are visible as lighter/desaturated overlays, same widening pattern as light render.
      Legibility verdict: PASS — no dark-on-dark text found; all title/axis/tick/legend elements are clearly visible against the near-black background.
