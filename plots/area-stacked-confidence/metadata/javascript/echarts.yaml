review:
  strengths:
  - 'Exact canvas size (3200x1800) and exact Imprint chrome hex values confirmed by
    pixel sampling: light background (250,248,241)=#FAF8F1, dark background (26,26,23)=#1A1A17.'
  - Title follows the mandated '{Descriptive Title} · {spec-id} · {language} · {library}
    · anyplot.ai' format, with a self-scaling font size formula that keeps it well
    within canvas bounds.
  - 'Realistic, neutral dataset: quarterly energy-mix TWh values (Solar/Wind/Natural
    Gas) with a plausible historical-to-forecast transition where uncertainty widens
    only after the forecast horizon starts (idx >= 16).'
  - Fully deterministic, in-memory data generation (formula-based, no RNG) satisfying
    reproducibility.
  - 'Clean theme-adaptive chrome: y-axis line hidden, x split lines hidden, only a
    subtle y-axis grid remains, consistent with the house style.'
  - 'First categorical series is exactly Imprint green #009E73 (confirmed via pixel
    sampling at the Solar layer).'
  weaknesses:
  - 'CRITICAL - 2 of the 3 confidence bands never render: pixel-level sampling (both
    themes) shows the Solar/Wind boundary jumps directly from opaque purple (194,136,244)
    to opaque green (0,158,115) with zero transitional pixels, and the Wind/Gas boundary
    jumps directly from opaque blue (99,122,178) to opaque purple (196,117,253) with
    zero transitional pixels. Only the topmost stacked series (Natural Gas) shows
    its band, as a light grey-blue sliver from y~558 to y~608 above the solid blue.
    Root cause: every series pushes its translucent band area at z:1 and its opaque
    central area at z:2 (echarts.js lines 62-93); ECharts draws all z:2 elements above
    all z:1 elements regardless of series order, so Wind''s and Gas''s opaque areas
    (z:2) always paint over Solar''s and Wind''s bands (z:1) wherever the band''s
    upper edge extends into the next series'' stacked height range - which is exactly
    where the interesting uncertainty-vs-neighboring-layer overlap would be visible.
    This defeats the spec''s core requirement (''each series surrounded by uncertainty
    or confidence bands'') for 2 of 3 series and directly contradicts the spec''s
    own guidance to use ''semi-transparent fills to show overlap without obscuring
    data'' - right now the overlap is fully obscured, not shown. FIX: give every band
    series a HIGHER z than every opaque central-line series (e.g. swap to opaque z:1
    / band z:2, or equivalently move the three band-related series entries after all
    three opaque entries in the `series` array with z left at defaults per array order)
    so all three translucent bands paint on top of every opaque stack layer, not just
    their own.'
  - 'Data-color drift between themes on the opaque layers: pixel sampling of the same
    x column shows the Solar opaque fill reads as (33,169,131) in the light render
    vs (3,140,102) in the dark render - a visibly different color, not ''chrome only''
    as required. Cause: the central areaStyle uses opacity:0.82 (not 1.0), so 18%
    of the theme background (#FAF8F1 vs #1A1A17) blends through and tints the series
    color differently per theme. Fix: use opacity:1 (fully opaque) for the central
    stacked areas so the Imprint data color renders identically in both themes; keep
    opacity 0.2-0.4 only on the uncertainty-band layers as the spec suggests.'
  - 'Legend only labels the three series names and never distinguishes what the shaded
    band represents (spec note: ''Include legend identifying each series and what
    the bands represent'') - once the band-visibility bug above is fixed, consider
    adding a short subtitle/legend note (e.g. ''(shaded = uncertainty range)'') so
    the now-visible bands for all three series are self-explanatory.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at (250,248,241) = exact #FAF8F1 match.
      Chrome: Title "Energy Mix by Source · area-stacked-confidence · javascript · echarts · anyplot.ai"
        is centered, dark ink, fully legible; subtitle in softer grey below it, legible. Legend
        (Solar/Wind/Natural Gas) centered below the subtitle with clear color swatches. X-axis
        quarter labels (Q1 '20 ... Q4 '25) and Y-axis "Energy Consumption (TWh)" title plus
        numeric ticks are dark-ink-on-light and clearly readable. A faint horizontal grid is visible
        without dominating.
      Data: Three stacked areas bottom-to-top: green (Solar, exact #009E73 at y=1300 sample), violet
        (Wind), blue (Natural Gas). Only the topmost (Natural Gas) layer shows a visible lighter-grey
        confidence band widening toward the right edge; pixel sampling at the Solar/Wind and
        Wind/Gas boundaries shows an abrupt color jump with no transitional band pixels, i.e. the
        Solar and Wind confidence bands are computed in the data but not visible in the render (see
        weaknesses - a z-ordering bug hides them under the opaque area of the next stacked series).
      Legibility verdict: PASS (all text legible) — but flagging a data-visibility (not legibility)
        defect: 2 of 3 confidence bands never appear on screen.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at (26,26,23) = exact #1A1A17 match.
      Chrome: Title, subtitle, legend, and axis text all render in light ink and are clearly
        readable against the dark background — no dark-on-dark failures observed. Grid line is
        faint but visible.
      Data: Same three-color stack (green/violet/blue). The opaque fill colors are NOT byte-identical
        to the light render at the same data point — e.g. the Solar layer samples as (33,169,131) in
        light vs (3,140,102) in dark at the same column/row-equivalent position — because the
        areaStyle opacity is 0.82 (not 1.0), so the differing page background blends through and
        tints the "opaque" series color per theme. This is a minor palette-compliance deduction
        (chrome should be the only thing that flips, not data-fill hue). The same band-visibility bug
        as the light render is present (only the topmost Natural Gas band is visible).
      Legibility verdict: PASS (all text legible) — same data-visibility defect as light render.
