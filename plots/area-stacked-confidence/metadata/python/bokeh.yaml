review:
  strengths:
  - Each layer is a varea stacked on the cumulative total below it, from a zero baseline,
    with its stacked central value drawn as a 5 px solid edge in the series color,
    so layer thickness reads as the series' value (C1)
  - Each band is computed from the series' own lower and upper bounds offset by the
    layer's base, so it sits symmetrically on its own stacked edge in the same stack
    order at every x; dashed 55 % alpha band borders separate the band from the 5
    px central edge (C2, C3, C4)
  - The legend title 'Shaded band = lower to upper bound' explains the bands while
    the entries name the three sources (C5)
  - 'Both themes thread the tokens through every chrome element: warm #FAF8F1 / #1A1A17
    surfaces, INK titles, INK_SOFT ticks, an ELEVATED_BG legend box; data colors are
    identical across renders'
  - HoverTool limited to the layer renderers, using the $name special variable and
    a datetime formatter, gives per-source values in the HTML view; toolbar hidden
    for a clean static render
  - 'Clean structure: column constants with role comments, a separate Data block,
    all eight Imprint positions looked up per series, one loop builds every layer'
  weaknesses:
  - 'Suggestion: a band swatch in the legend (for example a light fill entry labelled
    ''lower–upper bound'') would show the band shade itself rather than describing
    it only in the title.'
  - 'Suggestion: the Hydro band above the top edge is very faint on the dark background;
    a slightly higher band alpha within the 0.2–0.4 range the Notes allow would give
    it more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no outline, subtle 10 % ink grid.
      Chrome: bold title "area-stacked-confidence · python · bokeh · anyplot.ai" top-left (~53 % width); italic axis titles "Quarter" and "Energy Consumption (GWh)"; dark-grey tick labels 2020–2026 and 0–300; legend box top-left on an elevated off-white fill with italic title "Shaded band = lower to upper bound" and entries Solar, Wind, Hydro. All readable.
      Data: three stacked layers from a zero baseline — Solar #009E73 (bottom, growing 50→120 GWh), Wind #C475FD (middle, seasonal), Hydro #4467A3 (top, stable) — each with a thick solid central edge and a semi-transparent same-hue band with dashed borders sitting symmetrically on that edge; Solar's band widens over time. Totals 190–275 GWh.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in near-white, axis titles light, tick labels light grey, legend box on #242420 with light text. No dark-on-dark text.
      Data: identical colors and geometry to the light render; layers read darker on the dark surface, the Hydro band above the top edge is faint but visible; brand green clearly visible.
      Legibility verdict: PASS
