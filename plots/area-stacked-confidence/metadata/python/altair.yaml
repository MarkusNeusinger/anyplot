review:
  strengths:
  - Stacking is computed once with a groupby cumsum, and each band is that series'
    own interval moved onto its stack base. Bands therefore stay symmetric around
    their stacked edge and follow the same stack order at every quarter.
  - 'Three layers built from one shared base (stacked area via y/y2, band area via
    y/y2, full-colour edge line) combined with alt.layer: an idiomatic Vega-Lite grammar
    composition.'
  - Monotone interpolation smooths the edges without spline overshoot, so curves never
    show values the data does not have.
  - Temporal axis formatted as %Y-Q%q gives quarter labels for readers. The x grid
    is off and the y grid is subtle.
  - 'Library-native interactivity: .interactive() zoom/pan plus tooltips on the edge
    lines carrying quarter, source, value and both bounds in the HTML output.'
  - A theme-correct legend card (elevated background, soft stroke) whose two-line
    title names the series and says the bands are symmetric 90% intervals. Data colours
    are identical in both themes.
  weaknesses:
  - 'Suggestion: in the dark render the Solar band above the blue edge (#4467A3 at
    0.3 opacity on #1A1A17) is quite dim; a slightly higher band opacity for dark
    would give the top band more presence.'
  - 'Suggestion: the legend title''s second line ''band: 90% interval (symmetric)''
    could read as a sentence-case phrase (''Bands: 90% interval, symmetric'').'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 throughout, padded to 3200x1800.
      Chrome: bold dark title "area-stacked-confidence · python · altair · anyplot.ai" anchored left, with a soft grey subtitle about quarterly renewable energy and 90% prediction intervals. The y axis "Energy consumption (TWh)" runs 0–450 and the x axis "Quarter" has ticks 2020-Q2…2024-Q2. The y grid is subtle and there is no x grid. A legend card on the right reads "Energy source / band: 90% interval (symmetric)", with Hydro, Wind and Solar swatches. All text is dark and readable.
      Data: three stacked layers. Hydro (#009E73) sits on the zero baseline at about 120 TWh, Wind (#C475FD) above it, and Solar (#4467A3) on top, rising to about 400 TWh. Each layer has a full-colour edge line at its stacked top. A semi-transparent band of the same hue straddles each edge: Hydro is narrow (±8), Wind ±20, and Solar widens from ±10 to ±30. The bands overlap neighbouring layers but stay visible.
      Legibility verdict: PASS

