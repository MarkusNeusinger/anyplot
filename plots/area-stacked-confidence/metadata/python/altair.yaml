review:
  strengths:
  - Each layer is stacked on the one below from a zero baseline, with its stacked
    central value drawn as a 2.5 px edge line in the full series color over a 0.55-opacity
    fill, so layer thickness reads as the series' value in both themes
  - One shared `base` chart (x and color encodings) feeds three layered marks (layer
    areas, bands, edge lines), and monotone interpolation keeps the curves from overshooting
    the quarterly values
  - 'The legend title states what the bands represent (''band: 90% interval (symmetric)''),
    and a left-anchored title with an INK_SOFT subtitle names the scenario and the
    interval level'
  - 'Chrome is theme-correct: #FAF8F1 / #1A1A17 surfaces, INK / INK_SOFT text, y-only
    subtle grid, legend card on ELEVATED_BG; data colors are identical between renders'
  - 'Library-native interactivity in the HTML: formatted tooltips (quarter as %Y-Q%q,
    source, value and bounds) on the edge lines plus .interactive() zoom and pan'
  weaknesses:
  - 'SC-02 (both): each band is drawn from the cumulative sum of the lower bounds
    to the cumulative sum of the upper bounds, so it is not that series'' own interval:
    Solar''s band reaches about ±58 TWh around its edge at 2024-Q4 (8 + 20 + 30 half-widths)
    where Solar''s own 90% interval is ±30 TWh (−28 TWh too wide), and Wind''s band
    is ±28 instead of ±20 → draw each band as stack_base + lower to stack_base + upper
    of its own series, which keeps it symmetric around its stacked edge. Likely cause:
    stacked["band_low"] = by_quarter[LOW].cumsum() and stacked["band_high"] = by_quarter[HIGH].cumsum().'
  - 'Suggestion: the Notes allow a gradient fill from lower to upper bound; an alt.Gradient
    fill on the band mark would show that option.'
  - 'Suggestion: the legend card leaves a tall empty column below it; a top-oriented
    legend could give the plot area more width.'
  image_description: |-
