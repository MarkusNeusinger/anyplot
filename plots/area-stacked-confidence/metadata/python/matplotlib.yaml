review:
  strengths:
  - Stacked edges and bands derived from the table with pandas cumsum and shift, so
    each band follows its own series' stacked edge at every x (C1, C3, C4)
  - Theme tokens threaded through title, ticks, spines, legend and callout box; both
    renders read cleanly
  - Legend title states what the shading means (90% CI bands)
  - 'Adaptable-code layout: column constants, a replaceable data block and a plot
    block that reads only df'
  weaknesses:
  - 'VQ-03, SC-02 (both): each confidence band is drawn at zorder 2 under the layers
    at alpha 0.85, so inside the stack only a faint tint of each band shows and the
    band reads clearly only above the Natural Gas edge (C2) → draw the bands above
    the layer fills (bands at a higher zorder than the fills, with alpha 0.2 to 0.4)
    so each band shows over the layer above it. Likely cause: fill_between zorder=2
    for the bands against zorder=3 and alpha=0.85 for the layers.'
  - 'VQ-02 (both): the upper-left legend box covers the Natural Gas top edge and its
    band from 2016 to about 2018 (values 190 to 220 TWh) → keep the legend clear of
    the data, for example more y headroom or a legend outside the axes. Likely cause:
    loc=''upper left'' with ylim top at only 1.05 times the highest band.'
  - 'Suggestion: the ''Solar up 200%'' callout sits at 2020 while it describes the
    whole period; anchoring it at the last quarter would make the claim easier to
    read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'area-stacked-confidence · python · matplotlib · anyplot.ai' in dark ink at about 60 % width; axis titles 'Quarter' and 'Energy consumption (TWh)'; rotated year ticks 2016-2023 and y ticks 0-250 in INK_SOFT; subtle grid; legend upper left on an elevated panel titled 'Energy source (shaded: 90% CI bands)'.
      Data: four stacked layers Solar #009E73, Wind #C475FD, Hydro #4467A3, Natural Gas #BD8233 from a zero baseline, each with a solid edge line; bands show as faint darker tints inside the layers and a clear tan band above the gas edge; a 'Solar up 200%' callout box with an arrow into the Solar layer near 2020. The legend box covers the gas top edge for 2016-2018.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink, all readable; no dark-on-dark text; legend panel #242420 with light text.
      Data: same four colors as the light render; only the chrome flips. Bands again mostly hidden inside the stack, the gas band visible as a brown halo above the top edge.
      Legibility verdict: PASS
