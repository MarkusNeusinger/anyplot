      Data: Hydro #009E73 layer from zero with a darker edge line and a pale green band; Wind #C475FD and Solar #4467A3 layers above with edge lines and translucent bands. The Wind and Solar fills stop at their own band polygons, so background shows between the Hydro band (~125) and the Wind fill (~160-200) and pale straight wedges cross the Wind and Solar regions
