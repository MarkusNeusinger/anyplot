review:
  strengths:
  - 'Imprint palette in canonical order with #009E73 first; data colors identical
    across both themes, only chrome flips'
  - Bands stacked with the same cumulative order as the central values, so each band
    follows its own series' edge (C3)
  - Legend title 'band = lower to upper bound' plus per-series band entries tell the
    reader what the bands represent (C5)
  - legendgroup ties each band to its series so a legend click toggles both in the
    HTML view; hovermode='x unified' with bands excluded from hover
  - Canvas 3200x1800 with autosize=False and explicit margins, per the plotly canvas
    rule
  weaknesses:
  - 'SC-02, SC-03 (both): the Wind and Solar layers fill down to their own band polygon
    instead of to the stacked edge below, so bare background shows between the top
    of the Hydro band (about 125 TWh) and the lower edge of the Wind fill (about 160-200
    TWh), Wind and Solar layer thickness no longer reads as their value, and straight
    pale wedges from the band polygon''s closing segment cut across the chart (C1)
    -> each layer fills from the stacked edge of the series below up to its own edge.
    Likely cause: fill=''tonexty'' on each layer trace, whose previous trace is that
    series'' band added just before it; add all layer traces first and the bands after
    them, or give each layer an explicit lower-boundary trace.'
  - 'VQ-03 (dark): the ''Wind band'' and ''Solar band'' legend swatches (alpha 0.25
    of #C475FD/#4467A3 on #242420) are barely distinguishable from the legend box
    -> band alpha nearer the top of the Notes'' 0.2-0.4 range (about 0.35, +0.10)
    so swatches and bands read on both surfaces. Likely cause: fillcolor=rgba(color,
    0.25) on the band traces.'
  - 'CQ-01 (code): lines 55-57 define a helper function def rgba(hex_color, alpha)
    -> inline the conversion, e.g. f"rgba({'', ''.join(map(str, plotly.colors.hex_to_rgb(color)))},
    0.25)". Likely cause: hex-to-rgba helper.'
  - 'Suggestion: list the legend in stack order (Solar on top, Hydro at the bottom)
    with legend traceorder=''reversed+grouped'' so it reads like the chart.'
