review:
  strengths:
  - Bands are built on the stacked edges (edge = cumsum, band = edge ± half-width),
    so each band sits on its own series and the axis shows true stacked revenue
  - Band colors are computed tints of each series' Imprint color, with separate layer
    (0.85) and band (0.4) opacities so overlapping bands stay visible in both themes
  - Central values drawn as ink-colored edge lines that flip with the theme, clearly
    marking each layer's top
  - Legend in three columns pairs every series with its '90% interval' entry, ordered
    like the stack
  - Interactive pygal HTML output preserved alongside the PNG
  weaknesses:
  - 'VQ-03 (both): legend swatches are about 16 px squares beside 40 px legend text
    and barely read as color keys → about 40 px, matching the text height. Likely
    cause: legend_box_size left at its default.'
  - 'DQ-02 (both): the series are labelled Product A, Product B, Product C, which
    reads generic → concrete product-line names (for example Cloud Services, Hardware,
    Consulting). Likely cause: the REVENUE/LOWER/UPPER column names.'
  - 'CQ-01 (code): a helper function lighter() is defined for the band tint → inline
    the tint computation as a list comprehension. Likely cause: def lighter(color,
    share).'
  - 'Suggestion: a subtle annotation of where Product C''s uncertainty grows widest
    could give the chart a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'area-stacked-confidence · python · pygal · anyplot.ai' centered in dark ink; y-axis 'Revenue ($M)' with ticks 0-400, x-axis 'Quarter' with Q1'24-Q4'25; dotted subtle y-grid; three-column legend at bottom (Product C/B/A and their '90% interval' entries). All readable.
      Data: three stacked layers from zero - Product A in Imprint green #009E73 (bottom), Product B purple #C475FD, Product C blue #4467A3 (top), each topped by a dark ink edge line; semi-transparent lighter-tint bands straddle each edge, overlapping into neighbor layers; Product C band widens toward Q4'25 (stack top ~390, band to ~416). Legend swatches are small.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
