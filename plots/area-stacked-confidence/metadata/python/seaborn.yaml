review:
  strengths:
  - Each band is computed around its own stacked edge (base_edge + lower/upper), so
    stack order is consistent between central values and bands at every x
  - Legend in a single row placed in reserved headroom, its title stating what the
    shaded bands mean, clear of the data
  - Exact 3200x1800 canvas with style-guide text sizes; chrome threaded through theme
    tokens, readable in both themes
  - Column constants and a cumsum-based stack keep the data and plot zones short and
    adaptable
  weaknesses:
  - 'DQ-03 (both): the four allocation shares add up to between about 93% and 105%
    across the quarters (peak ~105% early 2021, dip ~93% mid-2023), which a portfolio
    allocation cannot do → totals of exactly 100% at every quarter (normalize each
    row, e.g. values / sum * 100, before computing the bands). Likely cause: independent
    np.random noise added to each series without renormalizing.'
  - 'Suggestion: x tick labels are four-digit years and would fit unrotated; dropping
    labelrotation=45 would tidy the bottom edge.'
  - 'Suggestion: a legend patch for the band itself (a light swatch) would show the
    band shade next to its explanation.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "area-stacked-confidence · python · seaborn · anyplot.ai" in dark ink at top center; y-axis "Portfolio Allocation (%)" 0-120, x-axis "Quarter" with year ticks 2021-2026 rotated 45°; left and bottom spines only, subtle horizontal grid. All text readable.
      Data: four stacked layers from a zero baseline - Stocks #009E73 (~45-52), Bonds #C475FD, Commodities #4467A3, Real Estate #BD8233 - each with a thin edge line on its stacked top and a semi-transparent lighter band (alpha 0.25) around that edge; bands narrow toward 2026. Stack totals wander between ~93 and ~105. Single-row legend at top left in the headroom, titled "Asset Class (shaded bands = 90% CI)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
