review:
  strengths:
  - Stacking computed with DataFrame.cumsum and one long frame, so each layer starts
    where the one below ends and its band sits centred on its own edge
  - 'Full Imprint chrome threaded through theme tokens: GRID at 15%, INK/INK_SOFT
    text, ELEVATED_BG legend; both renders theme-correct'
  - Caption in INK_SOFT names the 90% prediction interval, readable in both themes
  - Canonical 3200x1800 canvas via ggsize(800, 450) and scale=4, plus native HTML
    export with hover
  weaknesses:
  - 'DE-02 (both): the plot panel is enclosed by a four-sided frame, including top
    and right spines → keep only the left and bottom axis lines (L-shaped frame) as
    the style guide''s default. Likely cause: theme_minimal() plus axis_line drawing
    a full panel border; set panel_border=element_blank() and keep axis_line on x
    and y only.'
  - 'Suggestion: a legend key that shows a band swatch next to the series swatches
    would put the band explanation inside the legend rather than only in the caption.'
  image_description: |-
