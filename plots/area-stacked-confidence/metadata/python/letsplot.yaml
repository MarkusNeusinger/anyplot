      Background: warm off-white #FAF8F1, panel enclosed by a thin four-sided frame
      Chrome: title 'area-stacked-confidence · python · letsplot · anyplot.ai' in dark ink top-left; 'Quarter' and 'Energy Consumption (TWh)' axis titles and tick labels (2023-Q1 … 2028-Q1, 0–400) all dark and readable; subtle y-only grid; right legend 'Energy Source' on an elevated box; caption bottom-right naming the 90% prediction interval, readable
      Data: three stacked layers — Solar #009E73 at the bottom, Wind #C475FD, Hydro #4467A3 on top — each with a stronger edge line and a lighter translucent band around the edge that widens over time; total rises from about 230 to 385 TWh
