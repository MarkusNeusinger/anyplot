review:
  strengths:
  - Stacking is computed once with cumsum and both the layer ribbons and the bands
    read the same .top/.bottom columns, so every band sits on its own series' edge
    at every quarter
  - Solid edge line per series separates the layers clearly in both themes
  - Title, one-row legend and caption share one left edge; vertical grid removed for
    the time axis and y anchored at zero
  - Theme tokens threaded through every chrome element; Imprint colors identical across
    light and dark
  - 'Band meaning stated explicitly (''Shaded band: 90% interval'') and bands are
    symmetric half-widths'
  weaknesses:
  - 'VQ-03 (both): strongest in the light render, each band is drawn in the same hue
    at alpha 0.3 over its own layer at alpha 0.55, so the half below the edge only
    darkens the layer slightly and the band''s lower bound is hard to make out (e.g.
    Wind and Hydro below their edges) → a band that reads as a lighter, distinct shade
    against its own layer. Likely cause: band geom_ribbon alpha = 0.3 in the series
    fill over a 0.55 layer fill, with no lighter tint for the band.'
  - 'Suggestion: put the band explanation next to the series legend (for example a
    legend key for the band) instead of a caption at the bottom-left, so series and
    band meaning are read in one place.'
  - 'Suggestion: a focal point (for example the Wind layer as the largest contributor)
    would give the chart a storyline.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: bold dark title "area-stacked-confidence · r · ggplot2 · anyplot.ai" top-left; boxed one-row legend "Source: Solar, Wind, Hydro, Battery" on an elevated cream fill below it; y axis "Output (MWh)" with comma ticks 0-4,000; x axis "Quarter" ticks 1-19 odd; faint horizontal grid only; caption "Shaded band: 90% interval" bottom-left. All text dark and readable.
      Data: four stacked layers from zero — Solar #009E73 (bottom), Wind #C475FD, Hydro #4467A3, Battery #BD8233 (top) — each with a solid edge line and a semi-transparent same-hue band around the edge, widening toward Q20; total rises from about 2,900 to 4,500 MWh. Bands below each edge read faintly against their own layer.
