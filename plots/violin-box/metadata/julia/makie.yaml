review:
  strengths:
  - Correct theme-adaptive chrome — data colors (green/lavender/blue) are identical
    between light and dark renders, only background/text/grid/spine tokens flip
  - Canvas is exactly 3200x1800 with nothing clipped or overflowing at either edge
  - 'All spec-required elements present: violin (KDE) shape, box centered inside with
    median/quartiles/whiskers, and show_outliers enabled'
  - Realistic, neutral dataset (cortisol response across three stress conditions)
    with plausible units and scale
  - Clean idiomatic Makie code — single seed, minimal imports, violin!/boxplot! layered
    directly with explicit theme-derived colors
  weaknesses:
  - Title only spans ~40% of the plot width at titlesize=17 — well under the ~50-70%
    comfortable range; bumping titlesize (e.g. to ~20-22) would use the canvas more
    confidently
  - Outlier points (show_outliers=true, markersize=6) are effectively invisible in
    the render — increase markersize slightly or verify outliers are actually being
    drawn above the violin fill
  - No visual hierarchy beyond the categorical palette order — nothing calls attention
    to the escalating Control -> Mild -> High Stress trend (e.g. a subtle annotation
    or emphasis on the High Stress group)
  - Combining violin! and boxplot! is a straightforward overlay rather than showcasing
    a distinctive Makie-specific capability (e.g. custom recipe, dodge/grouping, rain-cloud
    style) — Library Mastery is generic here
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Cortisol Response by Stress Condition · violin-box · julia · makie · anyplot.ai" in dark ink, centered at top, fully visible. X-axis label "Stress Test Condition" and y-axis label "Cortisol Level (ng/mL)" both in dark ink. X tick labels (Control, Mild Stress, High Stress) and y tick labels (10, 20, 30) in a slightly softer dark gray, all clearly legible. Subtle light-gray horizontal gridlines at 10/20/30. Top and right spines removed; left and bottom spines are a soft dark gray.
      Data: Three violins in Imprint order — Control = brand green (#009E73), Mild Stress = lavender (#C475FD), High Stress = blue (#4467A3), each with a dark stroke outline. A cream/white box plot is centered inside each violin showing the median (dark horizontal line), IQR box, and whiskers (thin dark caps). All fully readable and distinguishable from the violin fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now rendered in off-white ink, fully legible against the dark background. Axis labels in off-white; tick labels in a lighter warm gray, both clearly legible. Gridlines are subtle light lines at 10/20/30. Top/right spines removed; left/bottom spines in soft light gray.
      Data: Violin fill colors are identical to the light render (green/lavender/blue) — confirmed unchanged. The embedded box plot fill is a dark elevated tone (#242420) that sits close to the page background in luminance, but its white/light stroke outline and white median line keep it clearly distinguishable from both the violin body and the page background — no text sits inside the box, so this is not a dark-on-dark text failure, just a fill color that blends more than in the light render.
      Legibility verdict: PASS
