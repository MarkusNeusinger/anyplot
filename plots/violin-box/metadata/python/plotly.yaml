  strengths:
  - go.Violin's native embedded box (box.visible, width 0.2, page-colored fill) keeps
    every violin's shape visible around a clearly outlined box in both themes
  - spanmode='hard' ends each violin at its data range, and the free y axis lets the
    four couriers compare directly
  - 'Data shows distinct shapes: skewed MetroRun with real outliers, bimodal ParcelPal,
    tight SwiftDrop and symmetric GreenWheel'
  - 'Clean adaptable structure: column constants, a Data block that ends in df, and
    a plot section that reads only df'
  - Theme tokens are applied to every chrome element; both renders read cleanly
  weaknesses:
  - 'Suggestion: a slightly heavier whisker line (now about 1 px at the render scale)
    would make the whiskers easier to follow across the violin fill.'
