review:
  strengths:
  - 'Box drawn with geom_boxplot over geom_violin in one grammar-of-graphics stack:
    quartile box, median line, whiskers and outlier points sit centered on each violin''s
    axis in both themes'
  - Four distinct distribution shapes (normal, right-skewed, bimodal, uniform) exercise
    what a violin adds over a box plot; Product C's bimodal waist is the clearest
    case
  - Theme tokens threaded through every chrome element; box fill from ELEVATED_BG
    keeps the box and its whiskers standing out against the violin fill in both renders
  - 'Group order taken from the data via scale_x_discrete/scale_fill_manual limits,
    so Product A gets #009E73 and the Imprint order follows'
  - Canonical 3200x1800 canvas via figure_size=(8, 4.5) and dpi=400; shared value
    axis not forced to zero and violins trimmed at their data range
  weaknesses:
  - 'SC-02 (both): the box at width=0.22 is wider than Product C''s violin across
    its bimodal waist (about 45–58 points) and than Product D''s violin near 50, so
    the violin''s shape disappears behind the box there instead of staying visible
    on both sides (C2) → a box narrow enough to stay inside the narrowest part, about
    width 0.12 (−0.10). Likely cause: geom_boxplot(width=0.22).'
  - 'DQ-02 (both): the groups are labelled Product A–D, generic placeholders for a
    satisfaction study → concrete product names (e.g. Laptop, Tablet, Smartwatch,
    Headphones). Likely cause: the GROUP label list in np.repeat.'
  - 'Suggestion: the fill legend repeats what the x-axis already names; dropping it
    (guide=None) would give the violins more vertical room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape canvas
      Chrome: bold title "violin-box · python · plotnine · anyplot.ai" centered at top (~48% width); horizontal legend "Product" with four swatches in an elevated box below it; y-axis "Satisfaction Score (points)" 30–80, x-axis "Product Category" with Product A–D; dark ink text, subtle grid, left and bottom axis lines only. All readable.
      Data: four violins at alpha 0.65 — Product A #009E73 (normal, ~35–76), Product B #C475FD (right-skewed from 35 with long upper tail and two outlier points near 62 and 78), Product C #4467A3 (bimodal, waist near 52), Product D #BD8233 (uniform-ish 31–69). Off-white boxes with dark median lines and whiskers centered in each violin; Product C's box is wider than the violin's waist so the waist is hidden behind it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title, axis titles in light ink, tick labels and legend text in soft light gray; legend box on #242420; grid subtle; no dark-on-dark text.
      Data: same four Imprint colors as light (they read darker through alpha over the dark page, as expected); boxes in #242420 with light outlines, median lines and whiskers clearly visible; outlier points light gray. Same Product C waist issue.
      Legibility verdict: PASS
