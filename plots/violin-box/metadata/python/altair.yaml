review:
  strengths:
  - Box plot centered on each violin's axis via x=alt.value(view_width / 2), narrow
    (size 14) so the KDE shape stays visible on both sides
  - Whiskers and medians drawn in INK, so they stand out against the violin fill in
    both themes
  - Declarative violin from transform_density + stack='center' layered with the composite
    mark_boxplot, then faceted with resolve_scale
  - Data shows skewed, normal and bimodal distributions in a realistic server-latency
    context
  - PAD-only canvas step lands exactly on 3200x1800 without cropping
  weaknesses:
  - 'Suggestion: the outliers={...} styling has no effect with extent=''min-max''
    (no point is ever beyond the whiskers); drop it or switch to the default 1.5 IQR
    extent to show outliers as points.'
  - 'Suggestion: in the light render the INK_SOFT box fill at 0.3 opacity reads low-contrast
    on the Premium blue; a slightly stronger fill would give the quartile box more
    presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'violin-box · python · altair · anyplot.ai' bold dark INK centered; y-axis title 'Response time (ms)' dark, ticks 0-600 in INK_SOFT; facet headers Basic / Standard / Premium / Enterprise below each panel in INK. No grid, density axis reduced to a baseline. All readable.
      Data: four mirrored violins at 0.6 opacity in Imprint order (#009E73, #C475FD, #4467A3, #BD8233); a narrow grey box (Q1-Q3), thick dark median and thin dark min-max whiskers centered inside each violin. Basic long right-skewed tail to ~590 ms, Enterprise bimodal.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis title and facet headers in light INK, ticks in light INK_SOFT; no dark-on-dark text.
      Data: same palette hexes as light (the 0.6 opacity blends them darker on the dark page); boxes in light grey, medians and whiskers in near-white, clearly visible against the fills.
      Legibility verdict: PASS
