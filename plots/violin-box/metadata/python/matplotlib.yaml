      Data: four violins in #009E73 at alpha 0.6 with soft-ink outline; narrow dark-grey boxes with black median line, whiskers and caps centred inside; outliers as small green circles with ink edge (Control low, Treatment B high, Treatment C both tails); y range ~3-107
