review:
  strengths:
  - Native ax.violinplot plus ax.boxplot(patch_artist=True) with every returned artist
    styled from theme tokens, so the box, whiskers and median stand out against the
    green violin in both themes
  - Data covers symmetric, bimodal, right-skewed and wide-with-outliers groups, so
    each violin shape tells something the box alone hides
  - Value axis fitted to the data range rather than zero, so the four groups compare
    directly
  - 'Adaptable structure: column constants, one tidy df, Imprint palette list, and
    groups and limits derived from the data'
  weaknesses:
  - 'DQ-02 (both): the y-axis reads ''Response value (units)'' and the groups ''Treatment
    A/B/C'', a placeholder unit and abstract labels → name a concrete measure and
    unit (e.g. ''Reaction time (ms)'') and real condition names. Likely cause: the
    VALUE constant and the samples dict keys.'
  - 'Suggestion: a slightly lower violin alpha in the dark theme would let the box
    contrast more against the darker green.'
