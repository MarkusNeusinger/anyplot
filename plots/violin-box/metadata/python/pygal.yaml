review:
  strengths:
  - Box drawn in ink with the median in the page color, so the statistics layer stands
    out against the translucent violin fill and inverts correctly in both themes
  - KDE grid limited to each group's data range and a shared, padded value axis not
    forced to zero, so tails end at the data and positions compare directly
  - All four groups use Imprint positions 1-4 in canonical order, identical between
    the light and dark renders
  - Outliers computed from the 1.5×IQR rule and drawn as individual points at their
    values
  - Native pygal HTML output keeps hover tooltips for the interactive detail view
  weaknesses:
  - 'VQ-05 (both): y tick labels alternate between two sizes — ''100'' and ''50''
    render at about 44 px while 90/80/70/60/40/30 render at about 56 px — and the
    x tick labels (Engineering … Operations) are at 44 px beside 56 px y ticks → one
    tick size on both axes (about 44-48 px, ±0 between ticks). Likely cause: pygal
    draws major y labels with major_label_font_size=44 and minor ones with label_font_size=56;
    set both to the same value.'
  - 'CQ-01 (code): two helper functions add_line() and add_shape() wrap chart.add
    and a side list series_colors → inline the chart.add calls in the loop and pass
    the color per series. Likely cause: the color-by-index workaround built as helpers.'
  - 'CQ-04 (code): lines 92-96 write out a Gaussian KDE with a Silverman bandwidth
    by hand → scipy.stats.gaussian_kde(values, bw_method=''silverman'')(grid). Likely
    cause: hand-rolled density instead of the available call.'
  - 'Suggestion: a light mean marker or a highlighted top-median group could give
    the chart a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'violin-box · python · pygal · anyplot.ai' centered top in dark ink; y title 'Performance score (0-100)', x title 'Department'; y ticks 30-100 (100 and 50 in a smaller size than the others), x ticks Engineering, Marketing, Sales, Operations under their violins; subtle dashed horizontal guides. All text dark on light and readable.
      Data: four translucent violins with solid outlines — #009E73 Engineering, #C475FD Marketing, #4467A3 Sales, #BD8233 Operations; narrow dark-ink boxes with a light (page-color) median line, ink whiskers with caps, black outlier dots (Engineering 100, Marketing ~97, Sales ~26). Tails end at the data range.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, 3200x1800.
      Chrome: same title, axis titles and ticks in light ink, all readable; guides subtle; no dark-on-dark text.
      Data: same four Imprint hues as light (translucent over the dark page, so they look deeper); boxes now light ink with a dark (page-color) median, light whiskers and caps, white outlier dots. Data colors identical; only chrome and the ink-derived box layer flip.
      Legibility verdict: PASS
