review:
  strengths:
  - Violins are drawn in nested categorical-offset coordinates ((method, offset) tuples),
    the native bokeh way to place a shape around a factor without a numeric x axis
  - The box (alpha 0.9) is layered over the translucent violin (alpha 0.6) with an
    ink outline and a thick ink median, so the box, median and whiskers stand out
    against the violin fill in both themes
  - 'The data shows four contrasting shapes, the case a violin-box plot exists for:
    symmetric (Lecture), outliers at both ends (Flipped Classroom), wide spread (Self-Study)
    and bimodal (Peer Tutoring), on a 0-100 score scale'
  - Outliers come from the 1.5 x IQR whisker rule and are drawn at their values as
    hollow page-colored circles with an ink outline, readable in both themes
  - Theme tokens are applied to every chrome element; only the y grid is kept, at
    alpha 0.10, and the x grid is removed on the categorical axis
  weaknesses:
  - 'CQ-04 (code): the Gaussian KDE is written out by hand (Silverman bandwidth plus
    a per-point exp loop, the bandwidth and density lines of the violin loop) → `scipy.stats.gaussian_kde(values)(y_grid)`,
    with the same tail grid. Likely cause: a hand-rolled density loop instead of the
    available SciPy call.'
  - 'SC-04 (both): the element legend draws its ''Distribution (KDE)'' and ''IQR (Q1–Q3)''
    swatches in Lecture''s #009E73, so the key reads as if it described only the first
    group, while the purple, blue and ochre violins have no matching glyph → glyphs
    that do not belong to one group (for example neutral INK_SOFT proxy renderers),
    or no legend, since the axis already names the groups. Likely cause: LegendItem
    renderers=[violin_renderer] / [box_renderer] taken from the first loop iteration.'
  - 'Suggestion: cut the violin tails at the 0–100 score bounds, so Self-Study and
    Flipped Classroom do not show density above 100 points.'
  - 'Suggestion: a slightly smaller outlier marker in the dense Peer Tutoring cluster
    near 49–53 points would keep the stacked circles apart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the canvas and the plot area; legend box in the elevated #FFFDF6 with a thin INK_SOFT border, placed outside the plot on the right.
      Chrome: bold dark title "violin-box · python · bokeh · anyplot.ai" (about 44 % of the width), italic axis titles "Test Score" (y) and "Study Method" (x), dark-grey tick labels 20–100 and four category names; a faint horizontal grid only. All text is readable.
      Data: four violins in Imprint order — Lecture #009E73 (first), Flipped Classroom #C475FD, Self-Study #4467A3, Peer Tutoring #BD8233 — at alpha 0.6, each with a narrow, more opaque box from Q1 to Q3 with a black outline, a thick black median line, grey whiskers with caps, and hollow outlier circles at their values. Peer Tutoring is clearly bimodal (about 80 and 55); Self-Study is wide, with a tail down to about 11; tails reach about 103–105 at the top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend box in #242420 with a light border.
      Chrome: title and axis titles in light #F0EFE8, ticks and legend text in #B8B7B0; the grid is subtle but visible. No dark-on-dark text anywhere.
      Data: the same four palette colors as in the light render (they read darker over the dark page because of the alpha); box outlines and median lines flip to light ink, whiskers to light grey, outlier circles have a dark fill and a light outline. Brand green #009E73 is clearly visible.
      Legibility verdict: PASS
