review:
  strengths:
  - Mirrored KDE violins with a narrow box (±0.08 of the category spacing) centred
    inside each one; the violin shape stays visible on both sides of every box in
    both themes
  - Violins built natively on bokeh's categorical offset coordinates ((method, offset)
    tuples) for patch, quad and segment, so each glyph sits exactly on its category
    without a numeric x workaround
  - Tails end one bandwidth past each group's data range and the shared value axis
    is not forced to zero, so the four groups compare directly
  - 'Data covers the plot type''s range: a symmetric group, a tight group with outliers
    at both ends, a wide group and a bimodal group whose second mode shows clearly
    in the violin'
  - Box outline, median and whiskers use the INK / INK_SOFT tokens, so they flip correctly
    and stand out against the violin fill in both renders; outliers are hollow page-coloured
    circles at their true values
  weaknesses:
  - 'DQ-02 (both): the groups are labelled "Method A" … "Method D", which reads as
    an abstract placeholder → name real study methods (for example Lecture, Flipped
    Classroom, Self-Study, Peer Tutoring). Likely cause: the STUDY_METHOD label list.'
  - 'DQ-03 (both): test scores reach about 101.5 (Method A) and 109 (Method B) on
    what is otherwise a 0–100 score scale → keep every value at or below 100 (−9 at
    the top). Likely cause: unclipped np.random.normal draws for method_a and method_b.'
  - 'Suggestion: the four-line density loop (lines 121–124) could be scipy.stats.gaussian_kde(values,
    bw_method=bandwidth / values.std(ddof=1)) evaluated on y_grid.'
  - 'Suggestion: a HoverTool on the outlier and box glyphs would show the exact quartiles
    and outlier values in the HTML view.'
  - 'Suggestion: the legend swatches show only the first group''s green; a neutral
    swatch would describe the encoding for all four groups.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and border; legend box on the elevated #FFFDF6 surface with a soft outline.
      Chrome: bold title "violin-box · python · bokeh · anyplot.ai" top-left (~43 % of width), italic axis titles "Study Method" / "Test Score", tick labels 20–100 and Method A–D in dark grey; only horizontal grid lines, very subtle. All text readable.
      Data: four violins in Imprint order — #009E73 (Method A), #C475FD (B), #4467A3 (C), #BD8233 (D) at 0.6 alpha with same-colour outlines; narrow box (denser fill, dark outline), thick dark median line, thin grey whiskers with caps; hollow outlier circles (A: ~40, ~94.5, ~101.5; B: 48, 52, ~109; C: ~16; D: a cluster ~49–53 and 38/40/42). Method D's bimodal shape (main mode ~80, second ~55) is clear. Legend at right: Distribution (KDE), IQR (Q1–Q3), Median, Outliers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend box on #242420.
