      Data: four violins in #009E73, #C475FD, #4467A3, #BD8233 (alpha 0.75, dark-grey outline), each with a narrow off-white box, black median bar, capped whiskers and small hollow outlier circles (Standard 122/46, Optimized ~96–105 cluster and 16, Enterprise ~67–71 and 48). Premium is visibly bimodal; Enterprise is compact with a thin upper tail.
