review:
  strengths:
  - Narrow boxes (width=0.12) filled with the elevated surface token and outlined
    in INK sit centered on each violin's axis; the violin shape stays visible on both
    sides and the box reads clearly in both themes
  - 'Groups use the Imprint palette in canonical order (#009E73 first); chrome is
    threaded through theme tokens, so text, grid and outlines adapt correctly between
    #FAF8F1 and #1A1A17'
  - 'Data exercises every aspect of the plot type: a unimodal group, a bimodal Premium
    group, a long right tail with a planted outlier cluster (Optimized), and a compact
    group with high outliers (Enterprise)'
  - Native geom_boxplot outlier styling (outlier_shape/size/fill/color) draws outliers
    as individual points at their values, and a shared, non-zero-forced value axis
    lets positions compare directly
  - The redundant fill legend is suppressed because the x axis already names each
    group; the HTML export keeps lets-plot's native hover tooltips
  weaknesses:
  - 'Suggestion: slightly larger outlier points (outlier_size about 0.6) would read
    more easily in the 400 px thumbnail.'
  - 'Suggestion: ordering the groups by median would make the latency ranking explicit.'
