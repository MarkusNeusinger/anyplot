review:
  strengths:
  - Narrow box (width=0.12) filled with ELEVATED_BG and outlined in INK stands out
    against every violin fill in both themes while the density shape stays visible
    on both sides
  - 'Data chosen to exhibit varied shapes: symmetric Standard, wide Premium, right-skewed
    Optimized and Enterprise with outlier clusters, all on one shared axis not forced
    to zero'
  - Violins trimmed at the data range so tails end at the observed extremes
  - Native geom_boxplot outlier_* aesthetics draw hollow outlier points without extra
    layers
  - Theme tokens threaded through every chrome element; data colors identical between
    light and dark
  weaknesses:
  - 'VQ-03 (both): outlier circles are drawn about as wide as the box (outlier_size=1.2
    at scale 4), so the five Optimized outliers at ~100-105 ms merge into one stacked
    blob and cannot be counted → markers about half that diameter so individual outliers
    stay distinguishable. Likely cause: geom_boxplot outlier_size=1.2.'
  - 'Suggestion: the four configurations read as service tiers; if they are meant
    as an ordered progression, steps of one Imprint ramp would carry that order.'
  - 'Suggestion: lets-plot''s tooltips on the violin/box layers could be configured
    (e.g. layer_tooltips with median and quartiles) for the HTML view.'
