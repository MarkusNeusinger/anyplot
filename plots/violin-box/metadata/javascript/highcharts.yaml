review:
  strengths:
  - Manual construction of violin + box + whiskers + outliers purely from core area/line/scatter
    series (no highcharts-more) fully replicates the required plot type within the
    library's real constraints
  - Self-Study's bimodal distribution is a genuine data-storytelling choice — a violin
    reveals the double-hump that a bare box plot would hide
  - Theme-adaptive box fill (t.ink) and median line (t.pageBg) invert cleanly between
    light/dark so contrast is always maintained without any theme-specific branching
  - Categorical palette correctly applied in canonical order with brand green first,
    identical across both renders
  - Horizontal layout gives generous breathing room per group and correctly omits
    a redundant legend since groups are already labeled on the category axis
  weaknesses:
  - 'Design Excellence sits at ''good default'' tier: nothing calls out the bimodal
    Self-Study distribution, the plot''s most interesting insight — a reader has to
    notice the double-hump on their own. Consider a subtle annotation or callout label
    near that violin.'
  - X-axis title 'Exam Score' is descriptive but has no unit/scale hint — add something
    like 'Exam Score (0–100)' to reach full VQ-06 marks.
  - 'Library Mastery reads generic: since highcharts-more is unavailable this is inherently
    a workaround built from area/line primitives, but nothing in the core API (e.g.
    dataLabels on the box showing Q1/median/Q3 values) is used to add value beyond
    what any charting library could replicate with the same primitives.'
  - Only the Group Study series has an outlier tooltip; Self-Study and Tutored have
    no outliers in this sample so the tooltip pattern is never exercised for them
    — consider whether a second group could show a low/high outlier for fuller feature
    coverage of the tooltip path.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "violin-box · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible. X-axis title "Exam Score" and tick labels (30–100) in soft dark gray, all legible. Category labels (Self-Study, Group Study, Tutored) on the left in the same soft dark gray, fully readable.
      Data: Three horizontal violins, one per group, colored in Imprint canonical order — Self-Study is brand green (#009E73), Group Study is lavender, Tutored is blue. Each violin has a dark charcoal box (Q1–Q3) with a white median tick, thin whisker lines with end caps, and one purple outlier dot visible on the Group Study violin near x=44. Self-Study's violin clearly shows a bimodal (double-hump) shape.
      Legibility verdict: PASS — all text is readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis title render in light cream text, tick labels and category labels in a softer light gray — all clearly visible against the dark background. No dark-on-dark text found.
      Data: The three violin outlines and fills are the identical brand green / lavender / blue hues as the light render (only the fill opacity/blend against the dark backdrop differs, not the hue itself). The box fill has correctly inverted to a light cream color with a dark median tick (both derived from theme-adaptive tokens), keeping contrast against the box in both themes. The same outlier dot is visible on Group Study.
      Legibility verdict: PASS — all text and data elements are readable against the dark background, no dark-on-dark failures.
