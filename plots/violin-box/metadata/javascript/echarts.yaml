review:
  strengths:
  - Custom ECharts renderItem series correctly builds a true violin (KDE-based polygon)
    with an embedded box plot (whiskers, quartile box, median line) and outlier scatter
    -- a combination ECharts has no native chart type for.
  - Public Transit's bimodal distribution (direct vs. transfer route) is clearly visible
    in the violin shape, demonstrating exactly why KDE + box together beat a box plot
    alone -- the spec's core teaching point.
  - 'Full Imprint theme compliance: green #009E73 violin fill identical across themes,
    box fill/stroke and outlier color correctly flip via page-background/ink tokens,
    backgrounds match #FAF8F1/#1A1A17.'
  - Per-group local KDE range (data extent +/- 3 bandwidths) avoids the common mistake
    of stretching every violin's tail out to the tallest group's max.
  weaknesses:
  - Title font size (19px) is on the small side for the 3200px canvas -- occupies
    only ~40% of plot width versus the ~70-85% expected for the long mandated title;
    a slightly larger size would improve visual weight without risking overflow.
  - Outlier markers (8px) are a bit small relative to canvas size given only 1-2 outliers
    per group are shown -- could be sized up slightly (10-12px) for better visibility
    at the mobile/400px scale.
  - No legend distinguishes the three underlying series ('Distribution', 'Quartiles',
    'Outliers'), though acceptable since color/shape make the roles self-evident.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "Commute Time by Transport Mode · violin-box · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible, not clipped. Y-axis title "Commute Time (minutes)" rotated on the left in dark ink. X-axis category labels (Car, Bike, Public Transit) and Y-axis tick labels (0-80) in a softer dark gray. Subtle horizontal gridlines only.
      Data: Three green (#009E73-looking) translucent violin shapes, one per transport mode, each with a solid box-and-whisker plot cut into the center (median line, IQR box, whisker caps) and 1-2 dark outlier dots per group where present. Public Transit's violin visibly bulges in two places (bimodal), the other two are unimodal.
      Legibility verdict: PASS -- all title, axis, and tick text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title, axis title, and tick labels now rendered in light/off-white ink against the dark background -- no dark-on-dark text anywhere. Gridlines remain subtle and visible.
      Data: The violin fill is the identical green hue and shape as the light render (only chrome flipped). The box interior and outlier dots are now light-colored instead of dark, correctly following the ink/page-background tokens so they still read clearly against the dark violin and dark canvas.
      Legibility verdict: PASS -- all text and data elements remain clearly legible; no dark-on-dark or light-on-light failures observed.
