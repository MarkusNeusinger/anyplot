review:
  strengths:
  - Correctly implements the violin+box hybrid via a Chart.js custom plugin (afterDatasetsDraw)
    drawing the box/whisker/outlier geometry with the canvas API on the same linear
    scales as the violin datasets — no external chart-type package or workaround,
    exactly matching the library's no-workarounds constraint.
  - 'Perfect Imprint palette compliance: canonical order (#009E73 green, #C475FD purple,
    #4467A3 blue, #BD8233 amber) is pixel-identical between light and dark renders,
    and chrome (background #FAF8F1/#1A1A17, text, grid, outlier stroke) is fully theme-correct
    in both.'
  - Example data showcases genuine distributional diversity across all four groups
    — symmetric (Gymnastics), bimodal (Swimming), right-skewed with a visible outlier
    cluster (Rowing), and wide symmetric (Basketball) — covering every feature the
    spec asks for (median, quartiles/box, whiskers, KDE silhouette, outlier points).
  - Deterministic LCG-seeded data generation, explicit font sizing throughout, and
    a clearly sectioned, readable code structure.
  weaknesses:
  - Box fill color (elevatedBg) sits visually close to the page background tone in
    both themes, so the 'box layered inside the violin' effect reads more like a cutout
    than a distinctly elevated layer — a bit more contrast on the box fill would sharpen
    the layering.
  - No explicit visual emphasis or callout highlights the most notable insight (e.g.
    Rowing's outlier cluster or Swimming's bimodal shape) — relies on the viewer noticing
    the shape differences unaided.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "violin-box · javascript · chartjs · anyplot.ai" in bold dark ink, italic gray subtitle explaining the shading/box encoding, dark axis titles ("Sport", "Height (cm)"), gray tick labels, subtle horizontal-only gridlines. All clearly legible.
      Data: Four violins on a linear x-axis with custom category ticks (Gymnastics, Swimming, Rowing, Basketball). First series (Gymnastics) is #009E73 brand green; subsequent series are purple, blue, and amber, matching the canonical Imprint order. Each violin has a hand-drawn opaque box (median line, IQR box, whiskers) centered inside its KDE silhouette, plus small dark-filled outlier dots with light-colored strokes (Gymnastics top/bottom, Rowing upper tail).
      Legibility verdict: PASS — no text is light-on-light; all chrome is clearly readable against the warm off-white surface.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title/subtitle/axis titles now rendered in light/white ink, tick labels in light gray, gridlines subtle white-on-dark. All chrome flipped correctly for the dark surface.
      Data: The four violin colors (green, purple, blue, amber) are identical to the light render — only the chrome flipped. The hand-drawn box fill uses the dark elevated-background token with white stroke/median line, and outlier dots use a light fill with a dark stroke so they remain visible against both the box and the dark page background.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is light-colored and clearly readable against the near-black background, and the brand green remains clearly visible.
