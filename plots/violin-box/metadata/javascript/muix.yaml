review:
  strengths:
  - 'Correct and creative solution for a chart type MUI X community doesn''t natively
    support: composes ChartContainer + useXScale/useYScale hooks into a hand-rolled
    mirrored-violin + embedded-box + outlier overlay, exactly the composition technique
    the library guide recommends'
  - Deterministic LCG-seeded data with a genuinely interesting story (Yerkes-Dodson-style
    bimodal split in the 300mg group) that the KDE shape reveals but a plain box plot
    would hide
  - Correct Imprint palette usage (brand green first, canonical categorical order)
    and correct theme backgrounds; data colors identical between light and dark, only
    chrome flips
  - 'All spec-required elements present: violin KDE shape, centered box with median/quartiles,
    Tukey 1.5xIQR whiskers, and outliers rendered as separate hollow points'
  - 'Clean chrome: no top/right spines, subtle horizontal-only grid, generous margins,
    no clipping in either theme'
  weaknesses:
  - Violin tails don't fully taper to zero width before reaching the Y-axis domain
    limits, producing thin flagpole-like spikes extending from the topmost/bottommost
    outliers to the plot's vertical extremes (most visible on the placebo and 100mg
    violins) - widen yPad or increase the KDE bandwidth slightly so density genuinely
    approaches zero within the plotted range
  - 'yAxis config sets both tickFontSize: 34 and tickLabelStyle: { fontSize: 14 }
    - tickFontSize is not a real MUI X Charts axis prop and silently does nothing;
    remove the dead prop'
  - Several small helper functions (lcg, randomNormal, sampleReactionTime, quantile,
    boxStats, stdOf, kde) - justified by the custom violin/box math but a bit more
    fragmented than the KISS ideal; consider inlining trivial ones like stdOf
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light theme.
      Chrome: Title "violin-box · javascript · muix · anyplot.ai" top-left in dark ink, clearly legible. X-axis label "Caffeine Dose" and Y-axis label "Reaction Time (ms)" both dark and legible, with readable tick labels on both axes. Subtle horizontal gridlines at low opacity. No top/right spines.
      Data: Four violins (0 mg Placebo, 100 mg, 200 mg, 300 mg) in Imprint colors - first series is brand green (#009E73), followed by purple, blue, and amber, matching canonical categorical order. Each violin has a centered box (darker/solid fill of the same hue) showing the median (cream-colored line) and quartiles, a thin whisker line through the box, and small hollow outlier circles above/below the whiskers. The 300mg violin is visibly bimodal (two humps) versus the roughly unimodal placebo/100mg/200mg groups, telling a clear dose-response story.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark theme.
      Chrome: Same title, now in light ink, fully legible against the dark background. Axis labels and tick labels rendered in light ink, clearly readable. Gridlines subtle but visible. No dark-on-dark failures observed.
      Data: Colors are identical to the light render (green/purple/blue/amber violins with matching box fills), confirming only chrome flips between themes. Median lines inside boxes render as near-black lines (t.pageBg for dark theme) which stay legible against the lighter colored box fills. Outlier circles use dark fill with colored stroke, remaining visible against the dark background.
      Legibility verdict: PASS
