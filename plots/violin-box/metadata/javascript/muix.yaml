review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with a band
    x axis and a linear y axis, and a custom ViolinBoxes SVG layer that draws through
    the chart''s own useXScale/useYScale hooks, so violins, boxes and outliers share
    the axis scales exactly'
  - 'Every spec feature is present in both renders: mirrored KDE violins, a narrow
    box (Q1–Q3) centered on each violin''s axis, a page-colored median bar, Tukey
    whiskers with caps, and open-circle outliers at their values'
  - The box fill flips with the theme (ink box with a page-colored median in light,
    light box with a dark median in dark), so the box and whiskers stand out against
    the violin fill in both themes
  - 'The ordered caffeine doses take steps of the imprint_seq ramp in dose order,
    starting at brand green #009E73, as the style guide asks for ordered categories'
  - 'The data shows every shape the plot type is for: a right-skewed attention-lapse
    tail at placebo, a tight 200 mg optimum and a bimodal 300 mg group, with violin
    tails ending just past each group''s data range (1.5 bandwidths)'
  - A title/subtitle hierarchy in which the subtitle states n, group count and the
    box/whisker/outlier encoding, x ticks disabled on the categorical axis, and a
    value axis not forced to zero
  weaknesses:
  - 'Suggestion: the outliers of the placebo group cluster around 680–690 ms on one
    vertical line; a small fill opacity on the outlier circles would make the stacked
    ones easier to count.'
  - 'Suggestion: the header''s library version line reads 7.29.1 while the harness
    pins @mui/x-charts 9.16; the header could carry the pinned version.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold title "violin-box · javascript · muix · anyplot.ai" top left with a soft-ink subtitle "960 measurements in 4 groups · box Q1–Q3 with median, whiskers to 1.5 × IQR, open circles beyond"; y axis "Reaction time (ms)" with ticks 300–850, x axis "Caffeine dose" with categories 0 mg (placebo), 100 mg, 200 mg, 300 mg; left and bottom axis lines only, subtle horizontal grid. All text dark on light, clearly readable.
      Data: four translucent violins in sequential-ramp steps from brand green #009E73 (placebo) through teal to slate blue (300 mg), each with a narrow near-black box, a page-colored median bar, black whiskers with caps, and open black outlier circles (placebo upper tail and one low point, 100 mg upper tail, 200 mg three high points). 300 mg is clearly bimodal; placebo is right-skewed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink, axis lines light, grid subtle dark gray; no dark-on-dark text.
      Data: violin colors are the same ramp steps as the light render (green, teal, blue-teal, slate blue); boxes flip to light ink with a dark median bar, whiskers and outlier circles in light ink, all clearly visible against the violin fills.
      Legibility verdict: PASS
