review:
  strengths:
  - 'Correct plot type: violin with an embedded box plot exactly per spec, including
    quartile box, median line, whiskers, and outlier points.'
  - Clean KISS-structured code, reproducible via set.seed(42), correct output naming
    through ragg::agg_png.
  - Realistic, neutral dataset (resting heart rate across training regimens) with
    genuinely different means/spreads per group and real outliers, giving good feature
    coverage.
  - Title format matches the mandated pattern exactly; legend correctly omitted since
    groups are already labeled on the x-axis.
  - Factor levels ordered Sedentary → Recreational → Endurance, giving an implicit
    narrative of decreasing resting heart rate with more training.
  weaknesses:
  - 'geom_violin uses alpha=0.55, which blends the Imprint fill color with the page
    background. Because the light (#FAF8F1) and dark (#1A1A17) backgrounds are so
    different, the same hex value renders as very different perceived colors: e.g.
    Sedentary green is a pale mint (measured ~rgb(113,199,172)) in light mode but
    a deep forest green (~rgb(12,99,73)) in dark mode; the lavender and blue series
    shift the same way. This breaks the ''data colors identical across themes'' rule
    even though the underlying hex codes match. Fix: raise the violin fill alpha to
    ~0.85-0.95 (or drop alpha entirely and rely on the box-plot cutout for contrast)
    so the rendered hue stays close to the true Imprint value in both themes.'
  - Boxplot outlier points use outlier.size=1.6, barely above ggplot2's default (1.5)
    and well under the style guide's 'prominent markers for sparse data' guidance
    (there are only a handful of outliers total) — increase to ~3-3.5 so they read
    clearly at 3200x1800 and when scaled to mobile widths.
  - 'Design Excellence is only at ''well-configured default'' level: theme_minimal
    plus a handful of standard overrides (y-grid only, no ticks, no legend) is competent
    but not distinctive — consider a more deliberate treatment for the median line
    or violin outline to lift aesthetic sophistication.'
  - 'Library Mastery is generic: layering geom_violin + geom_boxplot is the standard
    idiom and doesn''t showcase a ggplot2-distinctive capability. Consider e.g. geom_violin(draw_quantiles=...)
    or a stat_summary mean marker to differentiate from what other libraries would
    produce.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "violin-box · r · ggplot2 · anyplot.ai" top-left in dark ink; y-axis "Resting Heart Rate (bpm)" with gridlines at 40/60/80/100; x-axis "Training Regimen" with category labels Sedentary / Recreational / Endurance. All chrome text renders in dark ink on the light background, clearly legible.
      Data: Three violin+box combos left to right: pale mint-green (Sedentary, median ~74 bpm), pale lavender/pink (Recreational, median ~65 bpm), pale steel-blue (Endurance, median ~54 bpm). White box-plot cutouts with black outline show quartiles and median line inside each violin. A handful of dark-gray outlier dots appear above/below the Sedentary and Recreational violins. First series measured at approx rgb(113,199,172), i.e. the Imprint green (#009E73) blended at alpha=0.55 over the cream background.
      Legibility verdict: PASS (title, axis labels, tick labels, category labels all clearly readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title and axis labels, now rendered in light ink (off-white/light-gray), clearly legible against the dark background. No dark-on-dark text found.
      Data: The same three groups now render as much more saturated, deep hues — deep forest-green, deep purple, and navy-blue — rather than the pastel tones seen in the light render. Measured Sedentary fill is approx rgb(12,99,73), i.e. the same #009E73 hex blended at alpha=0.55 over the near-black background. Because the alpha blend interacts with a drastically different backdrop, the perceived color diverges substantially from the light render even though the source hex values are identical — this is flagged as a VQ-07 partial-compliance issue. Outlier points now render as light-gray dots, still visible. Box-plot cutouts flip to a dark fill via the PAGE_BG token, consistent with the theme.
      Legibility verdict: PASS for text readability; FAIL for cross-theme color identity (see VQ-07 note) — data hues are recognizably the same family but not the same perceived color between the two renders.
