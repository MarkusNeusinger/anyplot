review:
  strengths:
  - 'Correct Imprint palette in canonical order (#009E73, #C475FD, #4467A3) with identical
    data colors across light and dark renders, and theme-correct chrome (backgrounds,
    text, grid) in both'
  - 'Faithfully implements every spec requirement: KDE violin shape, centered box
    plot with median/quartiles/whiskers, outlier points, plus a bonus mean-diamond
    marker via stat_summary'
  - Realistic, neutral dataset (resting heart rate across training regimens) with
    clearly differentiated per-group means/spreads and a coherent Sedentary > Recreational
    > Endurance narrative
  - Clean, idiomatic ggplot2 layering (geom_violin + geom_boxplot + stat_summary +
    scale_fill_manual + theme_minimal) with explicit theme tokens threaded correctly
    through both ANYPLOT_THEME branches
  - Explicit font sizing throughout (title=12, axis.title=10, axis.text=8) matching
    style-guide defaults; no clipping, no overlap, strong canvas utilization
  weaknesses:
  - Mean-diamond marker fill matches the box fill (both PAGE_BG), so it relies solely
    on the INK stroke outline for visibility — a distinct fill color would read more
    clearly at a glance
  - Whisker linewidth (0.5) is on the thin side and could be marginally harder to
    see when the PNG is scaled down to mobile width
  - DE-03 storytelling is carried entirely by color/ordering; an explicit annotation
    or callout of the RHR-vs-training trend would push visual hierarchy further (not
    required by spec, optional polish)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "violin-box · r · ggplot2 · anyplot.ai" top-left in dark ink, fully visible with no clipping. Axis title "Resting Heart Rate (bpm)" (y) and "Training Regimen" (x) in dark ink, tick labels ("100"/"80"/"60"/"40" and "Sedentary"/"Recreational"/"Endurance") in softer grey. Horizontal major gridlines only, subtle grey, not dominant.
      Data: Three violins — Sedentary (green #009E73), Recreational (lavender #C475FD), Endurance (blue #4467A3) — matching canonical Imprint order. Each violin has a centered box plot (near-white fill, dark outline) with a median bar, a diamond mean marker, and dark-grey outlier dots (Sedentary and Recreational each show outliers; Endurance shows none, consistent with its tighter spread).
      Legibility verdict: PASS — all title/axis/tick text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
