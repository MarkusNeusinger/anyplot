review:
  strengths:
  - 'Spring layout (Fruchterman-Reingold, edge attraction scaled by weight) places
    strongly trading partners close together: the USA/China/India/Japan/Germany core
    sits in a tight cluster while Brazil-Canada-Mexico trail off on light links'
  - Weight mapped natively through scale_linewidth_continuous with readable breaks
    (100/300/600) and a guide_legend override.aes that keeps the legend samples in
    the same green and alpha as the edges
  - 'Theme tokens threaded through every chrome element: title, legend title and legend
    text flip correctly between #FAF8F1 and #1A1A17, node labels use PAGE_BG for contrast
    inside the #009E73 nodes'
  - Nodes and labels drawn on top of the round-capped edges, so every node stays readable
    where heavy edges converge
  - 'Adaptable layout: column constants, one Data block and plot code reading only
    through .data[[...]]'
  weaknesses:
  - 'VQ-03 (both): the India–China edge (380 bn) is almost entirely hidden because
    the layout places the Ind and Chi nodes nearly touching, so its thickness cannot
    be read along its length → keep connected nodes at least one node diameter apart.
    Likely cause: the repulsion constant (8 * k^2 / dist) is too weak against the
    weight-scaled attraction in the dense core.'
  - 'VQ-05 (both): the network fills only the left-centre of the canvas, with the
    core cluster squeezed into the top third and a large empty band under the legend
    and in the lower right → spread the layout over the panel. Likely cause: coord_equal
    on an elongated layout plus the weak repulsion that compacts the core.'
  - 'VQ-06 (both): node labels are the first three letters of the country name, so
    ''Sou'' (South Korea) and ''Net'' (Netherlands) do not tell a reader which country
    they are → readable codes such as ISO ''KOR'', ''NLD'' or full names. Likely cause:
    substr(node, 1, 3).'
  - 'Suggestion: sizing nodes by weighted degree, which the Notes allow, would let
    the trade hubs stand out at a glance.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no grid, no axes.
      Chrome: bold title "network-weighted · r · ggplot2 · anyplot.ai" top-left in near-black, ~53 % of width; legend at right titled "Trade volume (bn USD)" with three green line samples labelled 100 / 300 / 600 in soft ink. All readable.
      Data: 14 #009E73 nodes with bold off-white three-letter labels (Ind, USA, Chi, Ger, Jap, UK, Sou, Net, Fra, Ita, Spa, Bra, Can, Mex); semi-transparent green edges from thin (USA–Net) to thick (USA–China, Germany–UK). Dense core at the top, Brazil–Canada–Mexico chain trailing to the lower left, Italy–Spain to the right. Ind and Chi almost touch, hiding their connecting edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and legend title in light ink, legend labels in soft light grey; no dark-on-dark text.
      Data: same #009E73 nodes and identical layout; node labels flip to near-black (PAGE_BG) and read well on the green; edges at alpha 0.55 appear as a darker green, thinnest edge still visible.
      Legibility verdict: PASS
