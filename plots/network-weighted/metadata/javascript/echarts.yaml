review:
  strengths:
  - 'Correct Imprint palette order across both themes: Biology=#009E73 (first series,
    brand green), Computer Science=lavender, Physics=blue, Chemistry=ochre — identical
    data colors light/dark, theme-correct chrome (warm off-white / warm near-black
    backgrounds, readable text in both)'
  - Realistic, neutral research-collaboration dataset (16 institutions, 4 fields,
    papers co-authored 2020-2024) with meaningful cross-cluster edges (e.g. MIT Genomics-MIT
    CSAIL, CERN-MIT CSAIL, Scripps Research-Max Planck Chem) that make the network
    feel like a real citation/collaboration graph rather than 4 disconnected cliques
  - 'Idiomatic, sophisticated ECharts graph-series usage: force layout tuning (repulsion,
    edgeLength range, gravity, friction, circular initLayout for determinism), categories
    wired to the legend, emphasis.focus=''adjacency'' for neighborhood highlighting,
    and labelLayout.moveOverlap to prevent label collisions'
  - Both node size (weighted degree) and edge width (pairwise weight) are min-max
    normalized and mapped correctly, giving two additional readable data dimensions
    beyond graph structure
  - 'Clean, deterministic, KISS code: hard-coded data, no fake interactivity, single
    setOption call, animation disabled per the mount-node contract'
  weaknesses:
  - 'Node labels (fontSize: 13) become illegible once the PNG is scaled to the ~400px
    mobile thumbnail (verified against plot-light_400.png) — increase label fontSize
    to ~16-18px, or shorten/abbreviate the longer institution names so they survive
    the mobile scale-down'
  - 'Layout leaves noticeably unbalanced whitespace: the four force-directed clusters
    sit along a rough diagonal band, leaving the top strip (behind the title) and
    the bottom-right / far-right regions largely empty on a 2400x2400 canvas — tune
    force.gravity/repulsion/edgeLength (or nudge cluster centers) so the graph fills
    the square more evenly'
  - Spec explicitly suggests 'a legend or annotation explaining the weight scale'
    — only the category (field) legend is present; the subtitle states what edge thickness/node
    size represent but gives no numeric scale (e.g. a small 'thin = 3 papers · thick
    = 16 papers' annotation) for the weight encoding itself
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-weighted · javascript · echarts · anyplot.ai" centered at top in dark ink, with a descriptive subtitle below it ("Edge thickness = co-authored papers (2020-2024) · node size = total collaborations") in a softer gray. A 4-item category legend (Biology, Computer Science, Physics, Chemistry) sits centered at the bottom with matching color swatches. Node labels (institution names) sit below each node in soft gray. All text is clearly readable against the light background at full resolution.
      Data: Four visually distinct clusters (Biology=green #009E73, Computer Science=lavender, Physics=blue, Chemistry=ochre) connected by a few realistic cross-cluster edges. Edge thickness visibly varies with weight (thin ~2px to thick ~15px), and node circle size visibly varies with total weighted degree (e.g. large "MIT CSAIL" and "CERN" nodes vs. smaller "Wellcome Sanger" and "Tokyo Chem Institute"). Edges are a neutral gray at ~45% opacity so they don't compete with node colors.
      Legibility verdict: PASS — title, subtitle, legend, and node labels are all readable at full 2400x2400 resolution. Node labels do shrink to near-illegibility when the PNG is scaled to the 400px mobile thumbnail (checked plot-light_400.png).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/label layout as the light render, but title and node labels render in light ink (near-white/light-gray) and legend/subtitle text in a softer light gray — no dark-on-dark text anywhere.
      Data: Identical four category colors to the light render (green/lavender/blue/ochre unchanged), confirming the Imprint palette data colors do not shift between themes — only the chrome (background, text, legend) flips.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, subtitle, legend, and node-label text is clearly visible against the near-black background at full resolution (same mobile-scale caveat on node labels as the light render).
