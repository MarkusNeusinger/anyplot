review:
  strengths:
  - 'All three attempt-1 weaknesses are demonstrably fixed: node label fontSize raised
    13→17 (clearly more legible at full res and materially better at the 400px thumbnail),
    the force-layout now spreads the four clusters much more evenly across the 2400x2400
    square (top strip and far corners no longer empty), and the subtitle now states
    the explicit numeric weight range ("3–16") satisfying the spec''s weight-scale-annotation
    suggestion'
  - 'Correct Imprint palette order across both themes: Biology=#009E73 (first series,
    brand green), Computer Science=lavender, Physics=blue, Chemistry=ochre — identical
    data colors light/dark, theme-correct chrome backgrounds'
  - Realistic, neutral research-collaboration dataset (16 institutions, 4 fields,
    cross-cluster edges) with both node size (weighted degree) and edge width (pairwise
    weight) correctly min-max normalized
  - 'Idiomatic, sophisticated ECharts graph-series usage: tuned force layout (repulsion,
    edgeLength range, gravity, friction, circular initLayout for determinism), categories
    wired to legend, emphasis.focus:''adjacency'', labelLayout.moveOverlap'
  - Clean, deterministic, KISS code with no fake interactivity; follows the mount-node
    contract exactly (no explicit size/devicePixelRatio, animation:false)
  weaknesses:
  - Node labels (fontSize 17) are still small at the ~400px mobile thumbnail — legible
    with effort but not comfortably so; further increasing to ~19-20px or abbreviating
    the longest institution names (e.g. 'Wellcome Sanger', 'Tokyo Chem Institute')
    would help without much room left to push given 16 concurrently-labeled nodes
  - A thin residual whitespace band remains in the extreme top-left and top-right
    corners of the square canvas even after the retuned force layout — minor, cosmetic
    only
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-weighted · javascript · echarts · anyplot.ai" centered top in dark ink; subtitle below it in softer ink stating "Edge thickness = co-authored papers, 3–16 (2020–2024) · node size = total collaborations" (explicit numeric weight-scale annotation, added since attempt 1); 4-item category legend (Biology, Computer Science, Physics, Chemistry) centered at the bottom with matching color swatches; node name labels beneath each node in soft ink. All chrome text is clearly readable against the light background.
      Data: Four force-directed clusters (Biology=teal-green #009E73, Computer Science=lavender, Physics=blue, Chemistry=ochre) spread much more evenly across the square canvas than in attempt 1 — nodes now reach near all four quadrants instead of hugging a diagonal band. Edge thickness visibly varies with weight (thin ~3-weight edges vs. thick ~16-weight edges clearly distinguishable) and node size visibly varies with weighted degree (CERN, MIT CSAIL, Max Planck Chem read as clear hubs).
      Legibility verdict: PASS

