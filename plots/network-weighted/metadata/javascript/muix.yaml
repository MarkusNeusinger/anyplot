review:
  strengths:
  - Correct, idiomatic use of MUI X's low-level composition API (ChartContainer +
    useXScale/useYScale/useDrawingArea) to build a custom network-graph chart type
    MUI X has no native support for, instead of faking it with a non-community package.
  - Deterministic, seeded Fruchterman-Reingold force-directed layout with weight-influenced
    attraction — edge weight shapes both stroke width AND the ideal node distance,
    so the layout itself communicates connection strength, not just the line thickness.
  - 'Full spec coverage: edge width scaled by weight, node radius scaled by weighted
    degree, domain color-coding, an explicit edge-weight-scale legend, and heaviest
    edges drawn last so the strongest collaborations stay legible on top.'
  - Correct Imprint palette (canonical order for the abstract domain groups) and theme
    tokens in both renders, plus a real (non-simulated) hover tooltip wired for the
    interactive HTML export.
  weaknesses:
  - Node ID labels and legend text (14px/13px/12px in the 1200px CSS mount) become
    quite small once scaled to the ~400px mobile thumbnail, making the 14 individual
    3-letter node codes hard to read at that size — consider bumping node-label and
    legend fontSize by ~2px for better mobile legibility.
  - A few edges cross near-tangentially through unrelated clusters (e.g. AST-CLI crosses
    MAR-ENV, DSI-MAT crosses ENV-CHE) — inherent to a force-directed layout of a non-planar
    graph, but slightly stronger repulsion or edge-length tuning around the CLI/ENV/MAT/AST
    cluster would reduce the visual clutter.
  - Title occupies only ~35-40% of the canvas width at fontSize=22, well under the
    typical 50-70% range, leaving a lot of unused top margin — a modestly larger title
    fontSize (~26-28px) would balance the composition better given this spec-id's
    title is shorter than the 67-char reference length.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, measured RGB (250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: title "network-weighted · javascript · muix · anyplot.ai" in dark ink, centered top, clearly readable. 14 node-ID labels (e.g. "GEN", "DSI", "QPL") in dark bold text above each node, all legible. Bottom legend has a 4-item domain color key (Life Sciences/green, Physical Sciences/lavender, Computer Science/blue, Engineering/ochre) plus a caption "Edge width = co-authored papers · node size = weighted degree" and a 3-step edge-width scale (6/26/45), all in secondary ink, all legible against the light background.
      Data: 14 circular nodes colored by domain using Imprint palette positions 1-4 (green #009E73 first, as required), sized by weighted degree (DSI and GEN are visibly the largest hubs). 24 edges connect the nodes, drawn in ink at low-to-medium opacity with width proportional to edge weight (AIR-DSI is visibly the thickest edge at weight 45, matching the data). Heaviest edges are drawn on top so they stay visible where lines cross.
      Legibility verdict: PASS — no light-on-light text anywhere, all labels and legend text read clearly against the cream background.

    Dark render (plot-dark.png):
      Background: warm near-black, measured RGB (26,26,23) = #1A1A17, matches spec exactly.
      Chrome: same title, node-ID labels, and legend content as the light render, all re-rendered in light ink/off-white tones. Title and node labels are clearly visible against the dark background; legend text (domain names, weight-scale caption and numbers) is in a lighter secondary tone and remains readable, no dark-on-dark failures observed.
      Data: node fill colors are pixel-identical to the light render (same 4 Imprint hues), and edge widths/positions are unchanged — only the chrome (background, text, node stroke ring) flipped to the dark palette, exactly as required.
      Legibility verdict: PASS — all title, node-label, and legend text is clearly readable on the near-black surface; no dark-on-dark or low-contrast text found.
