review:
  strengths:
  - Real force-directed (Fruchterman-Reingold) layout with weighted attraction — heavier
    collaborations pull nodes closer together, so the layout itself, not just edge
    thickness, communicates connection strength.
  - 'Correct Imprint palette assignment: first series (Life Sciences) is #009E73,
    remaining three domains follow canonical order 2-4; chrome (background, text)
    is theme-correct in both renders.'
  - Weighted-degree node sizing surfaces hub institutions (DSI, MAT, ENV) at a glance
    — a genuine visual-hierarchy/storytelling win, not just a technical requirement.
  - Heaviest edges are drawn last (sorted z-order) so the strongest collaborations
    stay legible on top of overlapping lines.
  - Deterministic reproducibility via a fixed-seed LCG for the initial layout scatter;
    all data generated in-memory, no fetch/CDN.
  - Idiomatic community MUI X composition — reuses `ChartContainer` plus `useXScale`/`useYScale`/`useDrawingArea`
    hooks to build a custom network overlay, which is exactly the recommended community-surface
    pattern for chart types MUI X has no native component for, and adds working hover
    tooltips for the interactive HTML export.
  - Title format matches the spec exactly; legend clearly explains both encodings
    (domain color and weight-to-edge-width/node-size mapping) with sample values.
  weaknesses:
  - Lightest edges (e.g. IMM-NEU, weight=6) render at strokeOpacity as low as 0.22
    combined with strokeWidth=2, making the weakest connections fairly faint in both
    themes — consider raising the opacity floor slightly (e.g. 0.3) so even the thinnest
    edges stay comfortably legible at a glance.
  - Title occupies roughly 45-48% of canvas width, on the low end of the guideline
    range for a shorter custom title — a modest fontSize bump would give it slightly
    more visual weight relative to the network below it.
  - The overlay is split across several small components (GraphTitle, NetworkOverlay,
    HoverTooltip, Legend) purely for organization — justified by the interactivity/physics
    requirements, but a one-line comment naming the overall layout algorithm at the
    top of the file would help future readers orient faster.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "network-weighted · javascript · muix · anyplot.ai" centered top in dark ink, clearly legible. 14 node-ID labels (GEN, IMM, NEU, MAR, QPL, MAT, AST, CLI, ENV, AIR, DSI, ROB, CHE, BIO) placed above each node in bold dark text, all readable with no overlap. Bottom legend row explains 4 domain colors (Life Sciences, Physical Sciences, Computer Science, Engineering) plus a caption "Edge width = co-authored papers · node size = weighted degree" and a 3-point weight scale (6 / 26 / 45) with matching line thicknesses.
      Data: Nodes colored by domain using the Imprint categorical palette — Life Sciences green #009E73 (first series, correct), Physical Sciences lavender, Computer Science blue, Engineering ochre, in canonical palette order. Edges are dark, semi-transparent lines whose width and opacity scale with co-authorship weight; node radius scales with weighted degree (DSI, MAT, ENV visibly largest = hubs). Layout is a force-directed graph where heavier edges pull node pairs closer.
      Legibility verdict: PASS — all title, node-label, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, node labels, and legend layout as the light render, all rendered in light ink/off-white text, clearly legible against the dark background. No dark-on-dark text anywhere — title, node IDs, domain legend, and weight-scale labels are all bright and readable.
      Data: Node and edge colors are visually identical to the light render (same Imprint palette hues, same green-first domain, same edge width/opacity encoding) — confirming only chrome flipped between themes, not data colors. Node outline stroke uses the page background color in both themes, giving crisp separation from crossing edges.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements read clearly on the dark surface, brand green remains vivid.
