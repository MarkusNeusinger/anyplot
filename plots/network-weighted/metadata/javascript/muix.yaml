review:
  strengths:
  - Edge width and opacity both scale with co-authored papers, and the legend's 6
    / 26 / 45 strokes use the same mapping, so the scale reads directly in both themes
  - Force layout with weight-dependent spring length keeps strong collaborators (AIR-DSI,
    GEN-IMM, QPL-MAT) close together
  - Lab codes are placed in the widest free angle around each node on a translucent
    page-colored chip, so labels stay readable over edges
  - Uses MUI X v9 composition (ChartsContainer + scale hooks) with hidden axes as
    the coordinate frame, and React-state hover tooltips in the HTML output
  weaknesses:
  - 'CQ-01 (code): a standalone helper function `labelAngle` (lines 233–254) and the
    `edgeOpacity` arrow function sit beside the plot code → inline the angle computation
    in the node map and the opacity expression at its two uses. Likely cause: helpers
    factored out during the label-placement pass.'
  - 'Suggestion: drawing the nodes as a MUI X scatter series would let the native
    `ChartsTooltip` replace the hand-built hover box.'
  - 'Suggestion: the tooltip width expression is repeated three times in lines 378–389;
    a single constant would shorten it.'
  image_description: |-
