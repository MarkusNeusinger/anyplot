review:
  strengths:
  - 'Edge width scales linearly from 2 px (weight 6) to 13 px (weight 45): the thinnest
    edge stays visible in both themes and the thickest never buries a node'
  - Spring layout shortens the ideal length of heavy edges, so strongly collaborating
    labs sit closer together and the four research domains form readable clusters
  - Node radius encodes weighted degree and node color the research domain, both named
    in the legend band; the edge-width legend shows labeled samples for 6, 26 and
    45 papers
  - 'Theme-correct in both renders: Imprint domain colors identical, edges and labels
    from ink tokens, page-colored node outlines and label chips separate nodes and
    text from edges'
  - 'MUI X composition idiom: a custom SVG overlay inside ChartsContainer positioned
    with useXScale/useYScale, plus a React-state hover card for edges and nodes in
    the HTML output'
  weaknesses:
  - 'VQ-02 (both): the AIR and IMM label chips (16 px text on a 42x20 page-colored
    rect above each node) sit on the short ROB-AIR (weight 29) and GEN-IMM (weight
    42) edges and hide most of their visible length, so those thicknesses cannot be
    read along the edge → keep label chips off edge segments, e.g. place each label
    on the side of its node away from its heaviest edge, or shrink the chip to the
    text width. Likely cause: every label is fixed at y = cy - radius - 11 regardless
    of where the node''s edges leave.'
  - 'VQ-03 (both): the edge-width legend samples are drawn at a fixed strokeOpacity
    0.55, while the edges use 0.22 + ratio*0.4 (0.22 for weight 6, 0.62 for weight
    45), so the ''6'' sample is darker and the ''45'' sample lighter than the edges
    they explain → draw each sample with the same opacity formula as the edges. Likely
    cause: strokeOpacity={0.55} on the legend <line> instead of 0.22 + ratio*0.4.'
  - 'Suggestion: show the full institute name (already in NODE_LABEL) as a small caption
    list or in the legend band so the three-letter codes can be decoded in the static
    PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas, no axes or grid.
      Chrome: bold dark title "network-weighted · javascript · muix · anyplot.ai" centered at top (~50% width); bold dark three-letter node codes (MAR, AST, CLI, ENV, QPL, MAT, CHE, DSI, ROB, AIR, BIO, GEN, NEU, IMM) on page-colored chips above each node; bottom legend band with a domain row (Life Sciences, Physical Sciences, Computer Science, Engineering) and an edge-width row "Edge width = Co-authored papers · node size = weighted degree:" with sample lines labeled 6, 26, 45 - all readable.
      Data: 15 nodes in four Imprint colors (Life Sciences #009E73 green first, purple, blue, ochre) with page-colored outlines, radius 15-40 px by weighted degree (DSI, GEN, AIR, MAT largest); 24 gray edges 2-13 px wide with opacity rising with weight; AIR-DSI the heaviest dark edge, QPL-MAT and GEN-IMM next. The AIR and IMM label chips cover most of the short ROB-AIR and GEN-IMM edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no axes or grid.
      Chrome: title, node codes and legend text all flip to light ink and are clearly readable; no dark-on-dark text; label chips use the dark page color.
      Data: node colors identical to the light render (green, purple, blue, ochre); edges flip to light gray with the same width and opacity ramp, the thinnest NEU-IMM edge still visible; layout identical.
      Legibility verdict: PASS
