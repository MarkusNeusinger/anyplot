      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: title "network-weighted · javascript · d3 · anyplot.ai" in bold dark ink at top, clearly readable. Node ID labels (MIT, Stanford, Oxford, etc.) in dark ink below each circle, all legible. Bottom legend: three region swatches (North America / Europe / Asia) with dark-gray labels, plus an edge-weight scale showing two sample line thicknesses labeled "6 papers" / "35 papers" and a caption "Co-authored papers (edge weight)".
      Data: 15 circular nodes colored by continent — green (North America), lavender/purple (Europe), blue (Asia) — connected by gray edges whose thickness and opacity scale with co-authorship weight (thin/faint for low weight, thick/opaque for high weight, e.g. Oxford–Cambridge and ETH Zurich–EPFL are visibly the thickest). Node radius scales with weighted degree — MIT and Oxford are the largest circles.
      Legibility verdict: PASS — all text is clearly dark-on-light, no legibility issues.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: same title, now in light/off-white text, clearly readable. Node labels are light-colored against the dark background, all legible. Legend swatches and text (region key + edge-weight scale) render in light gray, clearly visible.
      Data: node fill colors are identical to the light render (green/lavender/blue), confirming palette consistency across themes. Edge strokes use a lighter gray (theme-adaptive ink-soft token) so they remain visible against the dark background without changing weight-encoding logic.
      Legibility verdict: PASS — no dark-on-dark failures found; all title, node-label, and legend text is clearly legible against the near-black surface.
