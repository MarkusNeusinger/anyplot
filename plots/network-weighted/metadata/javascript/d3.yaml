review:
  strengths:
  - 'Correct Imprint palette usage: North America green (#009E73, always-first brand
    color), Europe lavender, Asia blue, applied identically across both themes with
    theme-correct chrome (warm off-white / warm near-black backgrounds, readable text
    in both renders)'
  - Idiomatic, well-tuned d3-force simulation (forceLink with per-edge distance keyed
    to weight, forceManyBody, forceCollide, forceCenter) converged over 600 synchronous
    ticks with clamping to keep every node inside the graph band — a genuinely distinctive
    D3 capability not easily replicated in other charting libraries
  - Thoughtful dual-encoding of edge weight (both stroke-width via scaleLinear and
    stroke-opacity) plus weighted-degree-driven node radius (scaleSqrt) and hub emphasis
    (top-2 nodes by weighted degree get a bolder ring stroke and are drawn last/on
    top) — creates real visual hierarchy and a clear focal point
  - Legend explicitly explains both the region color coding and the edge-weight-to-thickness
    scale (min/max reference lines with 'X papers' labels), exactly as the specification
    suggests
  - 'Realistic, neutral research-collaboration dataset (real named universities, 3
    continents, plausible co-authorship counts) with good structural variety: hub
    universities, bridge nodes between continents, and light peripheral connections'
  weaknesses:
  - Node labels are placed at a fixed offset directly below each node (radius + 18),
    but several of the highest-weighted-degree hub nodes also have an edge leaving
    from their lower side, so that edge visually crosses straight through the node's
    own label text. Confirmed on MIT ('MIT' label sliced by the thick MIT–Stanford
    edge), Oxford ('Oxford' crossed by the Oxford–Cambridge edge), and ETH Zurich
    ('ETH Zurich' crossed by the ETH Zurich–EPFL edge) in both renders. Text stays
    technically legible but looks visually cluttered on exactly the three most important
    (highest-degree) nodes. Fix by either offsetting each label away from the node's
    dominant downward edge direction, adding a small text-halo/pill background behind
    the label so crossing edges disappear behind it, or nudging the label angle per-node
    based on local edge directions instead of a fixed south offset.
  - 'Design Excellence is solid but not yet publication-tier: the hub-highlighting
    and dual edge-weight encoding show real thought, but nothing pushes past ''strong,
    above-default'' into standout territory (e.g. no data callout on the two hub universities,
    no subtle depth/shadow treatment distinguishing hub vs. peripheral nodes beyond
    stroke width).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "network-weighted · javascript · d3 · anyplot.ai" in bold dark ink, clearly visible top-center. 15 university node labels in dark ink below each node. Bottom region-color legend (North America/Europe/Asia) and edge-weight legend (thin "6 papers" line to thick "35 papers" line, plus "Co-authored papers (edge weight)" caption) all in soft dark gray — all comfortably within the canvas with no clipping.
      Data: 15 nodes colored by continent — green (#009E73) for North America, lavender/purple for Europe, blue for Asia — sized by weighted degree (Oxford, ETH Zurich, and MIT are visibly the largest). 25 edges rendered as gray lines with width and opacity both scaled to edge weight (co-authored paper count), giving a clear strong/weak connection read. Two hub nodes (Oxford, ETH Zurich by weighted degree) have a visibly bolder ring stroke and sit on top of crossing edges.
      Legibility verdict: PASS overall, with one specific defect — the downward edges leaving MIT, Oxford, and ETH Zurich visually cross directly through those nodes' own labels ("MIT", "Oxford", "ETH Zurich"), confirmed by close-up crop inspection. Text remains readable (letters are not obscured/removed) but the crossing line reduces cleanliness on exactly the three most prominent hub labels.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legends now in light ink (#F0EFE8 / lighter gray for secondary text) — fully readable against the dark surface, no dark-on-dark failures anywhere (title, node labels, legend text all confirmed legible).
      Data: Identical node colors and edge weight encoding to the light render — same green/lavender/blue hues, same edge widths and relative opacities, confirming the data-color-identity rule (only chrome flipped, palette positions unchanged).
      Legibility verdict: PASS, with the same MIT/Oxford/ETH Zurich edge-through-label crossing defect reproduced identically (it's a structural/layout issue independent of theme, not a theme-adaptation bug).
