review:
  strengths:
  - Legitimate custom Chart.js plugin (beforeDatasetsDraw/afterDatasetsDraw) implements
    a genuine force-directed weighted network graph -- exactly the sanctioned 'native
    chart type + custom draw' pattern the library rules require, with no reliance
    on unsupported network plugins.
  - Deterministic, seed-free Fruchterman-Reingold-style layout (circular seed, 300
    iterations, weight-biased attraction) produces a readable, reproducible topology
    that visually clusters North American, European, and Asian trading blocs.
  - Both encoding channels (edge width 2-14px and opacity 0.2-0.75) scale with trade
    volume, and node radius scales with weighted degree -- directly implementing the
    spec's 'nodes can optionally be sized by weighted degree' note.
  - Custom-drawn legend explains the weight-to-thickness mapping with three concrete
    sample values ($12B/$396B/$780B), directly satisfying the spec's 'consider a legend
    explaining the weight scale' note.
  - 'Data colors (Imprint green #009E73) and theme chrome are handled correctly --
    identical node/edge geometry and brand green across both renders, with only background/text/legend
    surfaces adapting to theme.'
  weaknesses:
  - 'In both renders, the node labels ''USA'' and ''CHN'' sit directly below their
    (large, high-degree) node -- exactly where a thick trade-volume edge exits downward
    toward CAN/MEX (for USA) or USA (for CHN). The dark-gray label text visually merges
    with the similarly-dark edge stroke, obscuring the first 1-2 letters in both themes.
    Fix: bias the label anchor angle toward the angular gap with the fewest/thinnest
    incident edges instead of a fixed south offset, or draw a small background halo/outline
    behind the node-id text before filling it.'
  - The force-directed layout leaves the lower-right quadrant (SGP, NLD) visibly sparse
    relative to the dense left/center cluster (USA/CHN/JPN/KOR), producing uneven
    whitespace across the square canvas. Consider a slightly stronger repulsion constant
    or a post-layout re-centering pass so density is more balanced.
  - The `nodes` data model carries a descriptive `label` field ('United States', 'China',
    ...) that is generated but never rendered -- only `node.id` (ISO codes) is drawn.
    Either drop the unused field or put it to use (e.g. a fuller label or future tooltip)
    to avoid dead data.
  - Design excellence is solid but stays close to the size/thickness encoding alone
    -- no secondary emphasis technique (e.g. highlighting the single strongest trade
    corridor) creates an additional focal point beyond the two obvious hub nodes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white -- correct.
      Chrome: Title "network-weighted · javascript · chartjs · anyplot.ai" in dark ink, subtitle "Edge thickness = trade volume · node size = total trade across all partners" in secondary gray, both clearly readable. A boxed legend top-left ("Trade volume ($B)") on a cream elevated surface shows three sample edge widths ($12B/$396B/$780B) with matching dark text -- readable.
      Data: 14 green (#009E73) circular nodes labeled with ISO country codes, sized by weighted degree (USA and CHN largest, matching their hub role). 24 gray edges of varying width (2-14px) and opacity connect them via a force-directed layout that visually clusters North America (USA/CAN/MEX), Europe (DEU/FRA/GBR/ITA/NLD), and Asia (CHN/JPN/KOR), with cross-links (CHN-DEU, GBR-IND) bridging the clusters.
      Legibility verdict: FAIL (localized) -- the "USA" and "CHN" node-id labels sit directly beneath their node, crossed by a thick dark edge stroke exiting downward, which visually merges with the label's dark-gray fill and obscures the first letter(s). All other text (title, subtitle, legend, remaining 12 node labels) is clearly legible against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black -- correct.
      Chrome: Title and subtitle render in light ink/gray, both clearly legible against the dark background. Legend box uses the darker "elevated" surface (#242420-ish) with light text -- legible, no dark-on-dark failure.
      Data: Node/edge geometry and node fill color (#009E73) are pixel-identical to the light render -- only chrome (background, text, legend surface, edge stroke color) flips, as required.
      Legibility verdict: FAIL (localized) -- the same "USA"/"CHN" label-edge overlap recurs identically (edges now render light-gray-on-dark rather than dark-gray-on-light, but the collision mechanism and visual effect are the same). No other dark-on-dark or light-on-light failures found; all remaining text is legible.
