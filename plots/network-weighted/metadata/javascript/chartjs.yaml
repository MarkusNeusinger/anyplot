review:
  strengths:
  - Thoughtful dual weight-encoding (edge width AND opacity) makes trade-volume magnitude
    very readable at a glance.
  - 'Smart label placement: labels default to the widest open angular gap between
    a node''s incident edges, with a background halo, so text never collides with
    a crossing edge.'
  - Deterministic force-directed (Fruchterman-Reingold style) layout - no RNG, fully
    reproducible, with independent-axis fitting that uses the square canvas well.
  - Realistic, well-researched trade-volume data with plausible relative magnitudes
    across major economies.
  - Correct, idiomatic use of Chart.js's plugin architecture for a chart type the
    library doesn't natively support.
  weaknesses:
  - The force-directed layout still leaves a moderately dense crossing of edges through
    the CHN/GBR/DEU cluster in the center - consider a slightly stronger repulsion
    constant or more simulation iterations to spread that cluster further.
  - Legend value labels ($12B/$396B/$780B) and node-id labels become quite small at
    the 400px mobile thumbnail - a couple of px increase on the legend sample-value
    font would help mobile legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "network-weighted · javascript · chartjs · anyplot.ai" and subtitle in dark bold/regular text at top, clearly readable. Legend box top-left ("Trade volume ($B)") with dark text and three sample line-weight rows ($12B/$396B/$780B). Node-id labels in dark text with a light halo stroke, fully legible.
      Data: 14 country-code nodes rendered in brand green #009E73, sized by weighted degree. Edges in ink-gray, width and opacity scaled to trade-volume weight; USA-CAN and USA-MEX read as darkest/thickest corridors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title, subtitle, legend box (dark elevated fill), and node labels all flip to light-colored text/fills. No dark-on-dark issues found - halo strokes behind labels keep them legible even where edges cross beneath them.
      Data: Nodes remain the identical #009E73 green as the light render, confirming data-color consistency across themes. Edges flip to light gray/white strokes, clearly visible against the dark background.
      Legibility verdict: PASS
