      Chrome: Bold dark title "Global Trade Network · network-weighted · julia · makie · anyplot.ai" centered at top with generous margin. Twelve country labels in dark ink below their nodes, all clearly legible. A framed legend on the right (warm elevated-white fill) lists "Region" (3 color swatches) and "Trade volume" (3 line-width samples: $90B/$300B/$550B).
