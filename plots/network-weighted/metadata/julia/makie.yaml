review:
  strengths:
  - 'Correct Imprint palette usage across both themes: USA (Americas) renders in brand
    green #009E73, Europe/Asia use canonical positions 2-3, identical data colors
    between light and dark renders'
  - Clean, purpose-built two-group Legend (Region + Trade volume) explaining both
    the color and edge-width encodings, exactly matching the spec's 'consider a legend
    explaining the weight scale' note
  - Node size encodes weighted degree (sum of connected trade volume) in addition
    to the required edge-thickness weight encoding - goes beyond the spec minimum
  - Hand-rolled Fruchterman-Reingold force-directed layout with weight-scaled attraction,
    since NetworkLayout.jl is unavailable in the CI runtime - a legitimate, well-documented
    workaround rather than a fallback to another library
  - 'Theme-adaptive chrome is fully correct in both renders: dark render has light
    text/labels, light render has dark text, no dark-on-dark or light-on-light failures'
  - 'Efficient, idiomatic Makie technique: batched linesegments! call with a per-segment
    linewidth vector draws all 24 edges in one call instead of looping'
  - Background-colored node strokes (strokecolor = PAGE_BG) create a clean visual
    cutout where edges converge on nodes
  - No fake interactivity, no edge/label clipping at the canvas border in either render,
    title and legend fully visible with generous margins
  weaknesses:
  - 'DQ-03: absolute trade-volume magnitudes are understated versus real-world bilateral
    trade figures (e.g. USA-China here is $130B vs. real ~$575B annual trade, USA-Mexico
    $105B vs. real ~$780B) - the relative ranking (China/Canada/Mexico as USA''s top
    partners) is realistic, but scale up the absolute $B values for better factual
    alignment.'
  - 'Design Excellence / storytelling: the plot displays the network clearly but doesn''t
    call out the single strongest corridor (USA-China, $130B) with any emphasis beyond
    its edge width - a subtle annotation or highlighted stroke on the top 1-2 edges
    would sharpen the focal point per DE-03.'
  - 'VQ-01 mobile legibility: country-name text! labels are fontsize=12 (24 source-px
    after px_per_unit=2), which is comparatively small next to the fontsize=20 title
    - consider bumping to 13-14 for better legibility when the PNG is scaled to ~400px
    mobile width.'
  - 'VQ-05/DE-02: canvas whitespace is unevenly distributed - the top-left and bottom-right
    quadrants are almost entirely empty while nodes cluster centrally-left (USA/China
    hub) and lower-right (Europe cluster); tuning the force-directed layout''s repulsion/bounds
    or the final normalization could spread nodes more evenly across the canvas.'
  - Per the spec's 'avoid edge overlap where possible' note, several near-parallel
    edges converge almost on top of each other at the USA-China hub (e.g. the USA-China
    and China-adjacent edges), making individual weights harder to distinguish at
    that junction - minor additional jitter or curved edges could help.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "Global Trade Network · network-weighted · julia · makie · anyplot.ai" is dark, bold, fully visible at the top with generous margin. Country-name node labels are dark ink text, clearly legible against the cream background. The legend (top-right area) has a subtle frame and off-white "elevated" fill, with bold section headers "Region" and "Trade volume" and clear sample entries.
      Data: 12 country nodes colored by region - green (Americas: USA, Canada, Mexico, Brazil), lavender (Europe: Germany, UK, Netherlands, France), blue (Asia: China, Japan, South Korea, India). USA and China render as the largest nodes (highest weighted degree), consistent with them being trade hubs. Edges (gray, alpha-blended) vary in thickness from thin (~$15-20B) to thick (~$130B), converging heavily at the USA/China hub. Node markers have a thin background-colored stroke for a clean cutout look.
      Legibility verdict: PASS - all text (title, node labels, legend) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title and all node labels render in light/white text, clearly visible against the dark background. Legend background flips to the dark "elevated" surface (#242420-equivalent) with light text and a subtle light-toned frame.
      Data: Node and edge colors are visually identical to the light render - same green/lavender/blue region colors, same edge gray tone and same relative thicknesses. USA and China remain the largest nodes. No color shift in the data layer, confirming the palette is theme-independent.
      Legibility verdict: PASS - all text is light-colored on the near-black background; no dark-on-dark failures observed anywhere (title, node labels, or legend).
