review:
  strengths:
  - Trade-volume magnitudes now match real-world bilateral trade figures (USA-China
    at $575B) while preserving the realistic partner ranking — directly addresses
    the Attempt 1 Data Quality feedback
  - 'Explicit visual focal point: the strongest trade corridor (USA-China) is highlighted
    with a bolder brand-green line plus a "Top corridor: $575B" annotation, giving
    the chart a clear data-storytelling anchor'
  - Curved (bowed) edges via a batched linesegments! call reduce line overlap at busy
    hub nodes while staying a single efficient draw call
  - Node size encodes weighted degree and color encodes region, in addition to the
    required edge-thickness weight encoding — goes beyond the spec minimum
  - Purpose-built two-group Legend (Region colors + Trade-volume line-width samples)
    explains both encodings clearly
  - Theme-adaptive chrome is fully correct in both renders — identical data colors,
    correctly flipped backgrounds/text, no clipping at any edge
  - Hand-rolled, weight-scaled Fruchterman-Reingold layout is a legitimate, well-documented
    workaround for NetworkLayout.jl being unavailable in CI, per the makie library
    rules
  - Clean KISS script structure, explicit reproducible seed, only used imports, no
    fake functionality
  weaknesses:
  - Several edges to/through the USA-China hub area still run close together (the
    curve offset is subtle at 0.028 of normalized space) — individual weights in that
    busy junction are still somewhat harder to isolate than the rest of the graph;
    a slightly larger curvature or increased spring repulsion near hubs would help
  - Canvas whitespace is still a little uneven (upper-left near India and the far-right
    legend column are sparser than the central cluster) — minor, but a touch more
    spread in the force-directed layout bounds would balance it further
