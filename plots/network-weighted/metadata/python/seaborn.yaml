review:
  strengths:
  - 'Edge widths come from seaborn''s own size semantic: sns.lineplot with units=''edge'',
    estimator=None, sort=False and size=TRADE draws one segment per edge with widths
    0.6–6 pt normed to the data range, so the 620 bn USA–Canada link is unmistakably
    the heaviest and the 20 bn links stay visible in both themes'
  - Both legends are seaborn-generated from the same size mappings, so the 100–600
    line samples and the 800/1600/2400 node circles agree exactly with the marks they
    explain and carry reader-facing titles with units
  - Node area encodes weighted degree as the Notes allow, making USA and China read
    as the hubs at a glance; muted INK_MUTED edges behind Imprint-green nodes keep
    a clear foreground/background hierarchy
  - Labels sit in the widest angular gap between each node's edges with a page-colored
    halo, so all 17 country names stay readable on top of the edges in both renders
  - Spring layout with weight-scaled pull keeps strongly linked partners (USA–Canada–Mexico,
    China–Japan–S. Korea, Germany–Netherlands–France) close together, with no axes
    or grid
  - Theme tokens threaded through figure, legend frames, text and node outlines; both
    renders are theme-correct
  weaknesses:
  - 'VQ-02 (both): the thick Netherlands–Germany edge (200 bn) runs underneath the
    ''Germany'' label, so the halo cuts a gap into that edge right where it meets
    its node → the label sits clear of the node''s edges. Likely cause: the widest
    angular gap at Germany points up, but the label''s ha=''center''/va=''bottom''
    box is wider than the gap and reaches over the up-left Netherlands edge.'
  - 'Suggestion: a slightly larger node label font (8 pt → 9 pt) would match the 9
    pt legend text and hold up better in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid; legend frames on the slightly elevated #FFFDF6 with an INK_SOFT outline.
      Chrome: title "network-weighted · python · seaborn · anyplot.ai" centered at the top (~51 % width) in dark ink; 17 bold country labels in dark ink with page-colored halos; two legends on the right — "Total trade volume (billion USD)" with circles for 800/1600/2400 and "Trade volume (billion USD)" with line samples 100–600. All readable.
      Data: 17 nodes in #009E73 with page-colored outlines, sized by weighted degree (USA and China largest); 30 edges in muted grey #6B6A63 whose widths range from hairline (Spain–Mexico, Canada–UK) to thick (USA–Canada, USA–Mexico, USA–China). Spring layout clusters North America, East Asia and Europe. The Netherlands–Germany edge passes under the 'Germany' label.
