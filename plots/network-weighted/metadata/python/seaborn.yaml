review:
  strengths:
  - 'Edges drawn with seaborn''s own size semantic: sns.lineplot with units=''edge'',
    estimator=None, sizes=(0.6, 6.0) and a fixed size_norm, so the edge-width legend
    is seaborn''s and agrees exactly with the edges (100–600 billion USD samples)'
  - Node area encodes weighted degree via sns.scatterplot size semantic with size_norm=(0,
    max), named in its own legend; USA and China read immediately as the heavy hubs
  - Weight-aware Fruchterman-Reingold layout written in numpy (networkx is not installed)
    pulls heavy pairs together and pushes nodes off foreign edges, so no edge hides
    beneath a node
  - Node labels are placed in the widest angular gap between each node's edges, with
    a page-colored halo, and drawn above edges and nodes
  - 'Theme tokens threaded through every chrome element: legend frames on the elevated
    surface, INK titles and INK_SOFT entries, page-colored node outlines; data colors
    identical in both renders'
  weaknesses:
  - 'DQ-03 (code): the edge list carries two pairs twice with different volumes —
    Japan–Australia (70 and 60) and UK–Netherlands (80 and 70) — so the lighter duplicate
    is drawn hidden under the heavier one and both are summed into the nodes'' weighted
    degree → one row per country pair. Likely cause: the rows ("Australia", "Japan",
    60) and ("Netherlands", "UK", 70) in the df literal.'
  - 'VQ-01 (both): legend entry labels at 7 pt ("100" … "600", "800" … "2400") are
    the smallest text on the canvas and blur in the 400 px thumbnail → about 9 pt
    (+2 pt). Likely cause: legend_kws fontsize=7.'
  - 'Suggestion: the empty band between the two legends on the right could be tightened
    by moving the edge-width legend up under the node-size legend.'
  image_description: |-
