review:
  strengths:
  - Edge widths and the legend samples come from the same width function, so the 40/360/680
    samples agree exactly with the drawn edges
  - Weight is double-encoded by width and an opacity ramp, which pushes light links
    back and lets the USA-Mexico/Canada/China corridors read first
  - Node labels sit above each node offset by its own radius (column-driven LabelSet
    y_offset), clear of nodes and edges in both themes
  - Vectorized ColumnDataSource drives a single p.segment call; HoverTool on the node
    renderer adds country and total trade in the HTML
  weaknesses:
  - 'VQ-01 (both): node labels at 26pt bold sit below the 34pt tick/legend reference
    and read a little small for the plot''s main content → 32-34pt (+6 to +8 pt).
    Likely cause: LabelSet text_font_size="26pt".'
  - 'VQ-03 (dark): the lightest edges (e.g. Brazil-India, 40 B USD) at alpha 0.35
    render as a faint dark green on #1A1A17 and nearly vanish, as does the 40 sample
    in the legend → raise the floor alpha to about 0.55 (+0.2). Likely cause: edge_alpha
    floor 0.35.'
  - 'CQ-01 (code): two helper functions edge_width() and edge_alpha() (lines 103-110)
    → inline them as array expressions on weights and reuse them for the three legend
    samples. Likely cause: helpers written for the legend loop.'
  - 'Suggestion: the dark render shows a thin frame around the plot area that the
    light render lacks; matching the two would tidy the chrome.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
