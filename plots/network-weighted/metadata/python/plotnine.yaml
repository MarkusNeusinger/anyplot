review:
  strengths:
  - Edge widths scale clearly with trade volume, from a visible 30 to a dominant 620,
    in both themes
  - Legend line samples are labelled with the weights they stand for and match the
    drawn edges
  - Theme tokens threaded through title, subtitle, labels and legend; no dark-on-dark
    text
  - Nodes and labels drawn on top of the edges, INK outline keeps nodes crisp on both
    backgrounds
  weaknesses:
  - 'SC-02 (both): nodes sit on a fixed wobbling circle in order of first appearance,
    not on the force-directed or spring layout the spec asks for (C2), so USA, China
    and their heavy partners are spread around the ring and many edges cross the centre
    (C5) → positions from a spring layout weighted by trade volume. Likely cause:
    the np.linspace angle/radius block.'
  - 'SC-02 (both): node size encodes weighted degree but no legend or caption names
    it (C4) → name it, e.g. in the subtitle (''node size = total trade''). Likely
    cause: the per-node geom_point layers carry no guide and the subtitle mentions
    only edge thickness.'
  - 'VQ-01 (both): legend entries at 7 pt, below the style guide''s 8 pt legend reference
    → 8 pt (+1 pt). Likely cause: legend_text=element_text(size=7).'
  - 'VQ-05 (both): the legend title ''Trade volume'' runs into the legend frame''s
    right edge with no padding → keep a few px of padding inside the frame. Likely
    cause: legend title width at size 8 against the framed legend_background.'
  - 'CQ-01 (code): line 39 assigns EDGES the list ["Source", "Target"], not one string
    constant per column role → SOURCE and TARGET string constants with # role: comments.
    Likely cause: the two edge columns bundled into one constant.'
  - 'Suggestion: emphasise the USA-China-Canada-Mexico hub with a label weight or
    size step.'
