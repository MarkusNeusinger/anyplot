review:
  strengths:
  - Edge thickness scales 1–7 px over 25–580 B with a stroke-type legend whose samples
    are labeled with their weights
  - Opaque nodes with thin outlines sit cleanly on top of the edges; node size encodes
    weighted degree with its own legend
  - 'Theme tokens threaded through title, subtitle, labels and legends: both renders
    fully readable'
  - Layered Altair composition with independent scale resolution and HTML tooltips
  weaknesses:
  - 'VQ-02 (both): the ''USA'' label sits on the thick USA–China edge and ''China''
    is crossed by the China–Japan and China–Australia edges → labels clear of edges,
    e.g. a PAGE_BG halo behind the text. Likely cause: mark_text at dy=-17 with no
    stroke/halo over the edge layer.'
  - 'SC-02 (both): reciprocal flows (Australia→China 190 B and China→Australia 145
    B, France→Spain 75 B and Spain→France 55 B, UK→Netherlands 85 B and Netherlands→UK
    70 B, USA–S. Korea, USA–India, USA–Brazil) are two rules on the same segment,
    so the pair reads as one darker line and the thinner weight is hidden under the
    thicker (C5) → one edge per country pair, its weight the sum of both directions.
    Likely cause: the edge list has both directions and is drawn without aggregating
    by unordered pair.'
  - 'Suggestion: shade the edges by the region of the pair to show intra- vs inter-regional
    trade.'
  - 'Suggestion: the empty band below the network could be reduced by a slightly taller
    inner view.'
