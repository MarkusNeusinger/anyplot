review:
  strengths:
  - Legend samples drawn with the same width mapping as the edges and labeled 20 /
    220 / 410 papers, so the scale agrees with the marks
  - Labels carry matplotlib patheffects withStroke halos in the page color and sit
    above nodes, readable over edges in both themes
  - Two legends kept together with ax.add_artist in a left column the layout transform
    keeps free of data
  - Node area encodes weighted degree and is named in a caption; node color encodes
    research focus in Imprint order
  - Theme tokens threaded through every chrome element; data colors identical in both
    renders
  weaknesses:
  - 'SC-02 (both): C5 missed where avoidable: the EMBL-Pasteur edge runs straight
    under the Broad node and DESY-KEK under the CERN node, so each reads as two edges
    and their thickness cannot be followed along the length → a layout where no edge
    passes beneath a third node (for example stronger repulsion or another seed).
    Likely cause: the force layout''s repulsion constant 5*k*k against the weighted
    pull 0.2+0.5*w packs each cluster into a line.'
  - 'DQ-02 (both): real institutes (CERN, DESY, EMBL, Sanger, MILA, CSAIL …) carry
    invented co-authorship counts → fictional or generic institute names, or counts
    from a real source. Likely cause: the focus_of and links lists.'
  - 'CQ-01 (code): line 31 assigns ENDPOINTS the list ["Institute A", "Institute B"],
    not a column-name string → one string constant per required column role above
    the Data block, each with a trailing # role: <role> comment. Likely cause: the
    two endpoint columns bound to one constant.'
  - 'CQ-01 (code): lines 97-100 define a helper function line_width that repeats the
    widths formula of lines 93-94 → compute the legend sample widths with the same
    vectorised expression and no def. Likely cause: the legend samples reusing the
    mapping through a function.'
  - 'Suggestion: a focal cue on the Computing cluster that bridges the three disciplines
    would give the chart a reading order.'
