review:
  strengths:
  - Edge width grows linearly with trade volume between 0.6 and 5.0 through scale_size_identity,
    and the legend keys reuse the same width mapping, so the 100–500 B USD samples
    agree with the edges they describe
  - Legend keys are colored with the composite of INK_SOFT at 0.55 alpha over the
    page, so the opaque lets-plot keys match the translucent edges in both themes
  - Node labels sit on page-colored geom_label plates nudged above the largest node
    radius (nudge_unit='size'), so no edge runs through a country name and nodes and
    labels are drawn on top of the edges
  - Node size encodes weighted degree with area tracking total trade, named in the
    caption; the page-colored node outline separates nodes from converging edges
  - Native layer_tooltips give each edge its trade volume and each node its total
    trade in the HTML output
  - 'Theme tokens thread through every chrome element: title, subtitle, caption and
    legend are readable on both #FAF8F1 and #1A1A17; nodes stay #009E73 in both renders'
  weaknesses:
  - 'DQ-01 (both): the force-directed layout barely moves the nodes off their initial
    circle (edge attraction 0.002·log1p(w)^1.2 ≈ 0.02 against repulsion 0.5/d), so
    heavily linked pairs sit far apart — Canada–USA (380) and Mexico–USA (420) span
    most of the canvas while Canada and Mexico ring the left edge — against the spec''s
    ''strongly connected nodes tending to sit closer together'' → attraction strong
    enough that heavy edges pull their endpoints together (for example a spring term
    proportional to weight·distance, or more iterations with a cooling step). Likely
    cause: weight_factor of about 0.02 and the 150-iteration loop starting from the
    circle.'
  - 'VQ-02 (both): the thick Japan–China edge (340) runs across the top of the Germany
    node and behind its label plate, so it reads as if it touched Germany → an edge
    path clear of unrelated nodes, which follows from a layout that settles hubs apart.
    Likely cause: the same near-static ring layout that places Germany on the Japan–China
    chord.'
  - 'Suggestion: the caption is right-aligned under the plot while title and subtitle
    are left-aligned; aligning it with them would tidy the frame.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid.
      Chrome: bold dark title "network-weighted · python · letsplot · anyplot.ai" top-left (~56 % width), grey subtitle below, grey caption bottom-right explaining node size; legend "Trade volume (billion USD)" on the right with five grey line samples 100–500 of growing width. All text readable dark-on-light.
      Data: 15 #009E73 country nodes with page-colored outlines, sized by weighted degree (USA and China largest), arranged roughly on an ellipse; 33 translucent grey edges of width 0.6–5 px-scale, thickest USA–China, USA–Mexico, USA–Canada. Bold country labels on page-colored plates above each node.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend title and node labels in light ink, subtitle/caption/legend text in light grey; no dark-on-dark text anywhere.
      Data: node fill #009E73 identical to the light render; edges a lighter grey from INK_SOFT dark token at the same alpha; node outlines and label plates switch to the dark page color. Legend keys match the edge tone.
      Legibility verdict: PASS
