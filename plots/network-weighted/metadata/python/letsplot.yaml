review:
  strengths:
  - Edge thickness grows linearly with trade volume (0.6 to 5.0) and the legend keys
    100–800 are drawn through scale_size_identity with labels computed from the same
    mapping, so the legend agrees exactly with the edges
  - Legend keys are recolored with override_aes to the blended color a translucent
    edge actually shows on the page, so the swatches match the marks in both themes
  - A weighted Fruchterman-Reingold layout written in vectorized numpy (networkx is
    not available) pulls heavy pairs together and pushes nodes off foreign edges,
    so no edge runs hidden under a third country
  - Node size encodes weighted degree with area proportional to total trade, explained
    in the caption; page-colored node outlines and label plates keep nodes and names
    on top of the edges
  - 'Theme tokens are threaded through every element: both renders are fully readable,
    with identical #009E73 nodes and only chrome flipping'
  - layer_tooltips give per-edge trade volume and per-node total trade in the HTML
    output
  weaknesses:
  - 'Suggestion: left-align the caption with the title and subtitle instead of letting
    it sit right-aligned under the panel, so the three text blocks share one edge.'
  - 'Suggestion: the band between the subtitle and the top node is generous; tightening
    the upper y limit would give the network a little more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (pixel-checked), 3200x1800.
      Chrome: bold dark title "network-weighted · python · letsplot · anyplot.ai" top-left (~55% width), soft-ink subtitle, caption at the bottom explaining node size, legend "Trade volume (billion USD)" on the right with eight line keys 100–800 of growing width. No axes or grid. All text dark on light and readable.
      Data: 18 country nodes in #009E73 with page-colored outlines, sized by weighted degree (USA and China largest); grey translucent edges whose width grows with trade volume (USA–Mexico, USA–Canada, USA–China thickest; Brazil–India and India–Australia thinnest but visible). Bold country labels on page-colored plates above each node.
      Legibility verdict: PASS

