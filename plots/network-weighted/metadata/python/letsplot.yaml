review:
  strengths:
  - Edge width grows linearly with trade volume from 0.6 to 5.0, so a heavier link
    is always the thicker line; the lightest (India–Australia, 25 B) stays visible
    in both themes and the heaviest (USA–China, 550 B) does not bury the nodes
  - 'Weighted Fruchterman-Reingold layout written in vectorised numpy (networkx is
    not available in CI) pulls heavy trade partners together: the European cluster
    sits left, the USA–Canada–Mexico group bottom right and the East Asian group top
    right, with no axes or grid'
  - The weight legend shows sample line widths labelled 100–500 that match the edges,
    and their key color is blended from INK_SOFT and the page so it matches the translucent
    edges in both themes
  - Node size encodes weighted degree, as the Notes allow, and the caption names it;
    nodes carry a page-colored ring and sit on top of the edges
  - 'Native lets-plot idioms: scale_size_identity with a legend guide works around
    the single size scale, guide_legend(override_aes=...) for the keys, geom_label
    with nudge_unit=''size'' for labels, and layer_tooltips on edges and nodes in
    the HTML output'
  - 'All chrome is threaded through the theme tokens: the title, subtitle, caption,
    legend and labels read correctly on #FAF8F1 and #1A1A17, and the data colors are
    identical in both renders'
  weaknesses:
  - 'SC-02 (both): Japan, China and the USA land almost on one line, so the Japan–USA
    edge (220 B) runs straight under the China node and inside the USA–China edge.
    It shows only as a darker core in the USA–China line and reads as Japan–China
    plus China–USA, so its thickness cannot be read along its length, against the
    ''edges kept apart where possible'' property → a layout in which no edge passes
    through a third node. Likely cause: the FR layout has no node–edge repulsion and
    keeps the first converged seed (default_rng(42)); a different seed, a slightly
    larger k, or more repulsion breaks the collinearity.'
  - 'VQ-02 (both): the ''China'' label plate overlaps the bottom edge of the Japan
    node by about 10 px and cuts into its circle → clear the neighbouring node by
    at least 4 px (+14 px). Likely cause: Japan and China sit within one label height
    of each other in the layout, and nudge_y=NODE_SIZE[1]/2 + 1 puts the label on
    top of Japan''s node; spacing the layout further (larger k) fixes it without moving
    the label off its node.'
  - 'Suggestion: emphasise the two dominant hubs, for example by bolder labels for
    USA and China, so the hub story reads at thumbnail size.'
  - 'Suggestion: the caption sits right-aligned under the panel, far from the subtitle
    that explains the other encoding; putting both encodings in the subtitle would
    keep the explanations together.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no panel box, no axes or grid.
      Chrome: bold near-black title "network-weighted · python · letsplot · anyplot.ai" top left (~55 % of the width), a grey subtitle "International trade network: edge thickness = bilateral trade volume", a grey caption at the bottom right "Node size = each country's total trade with the others shown (weighted degree)", and a right-hand legend "Trade volume (billion USD)" with five grey line keys from thin to thick, labelled 100, 200, 300, 400 and 500. All text is dark and clearly readable.
      Data: 15 country nodes in brand green #009E73 with a page-colored ring, sized by weighted degree (USA and China largest; India, Brazil and Italy smallest). 31 translucent grey edges grow in width with trade volume; USA–China, USA–Mexico and USA–Canada are the thickest and India–Australia the thinnest, which is still visible. Bold country labels sit above each node on page-colored plates. Europe clusters on the left (Spain, Italy, France, UK, Germany, Netherlands), the USA, Canada, Mexico and Brazil bottom right, and Japan, China, S.Korea and Australia top right. The 'China' plate overlaps the bottom of the Japan node, and the Japan–USA edge runs hidden under the China node inside the USA–China edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the canvas.
      Chrome: title and labels in light #F0EFE8, subtitle, caption and legend text in light grey; no dark-on-dark text anywhere. The legend keys are a lighter grey that matches the translucent edges on the dark surface.
      Data: node green #009E73 and the node layout are identical to the light render; the edges are light grey, translucent, and the node rings and label plates flip to the dark page color. The same China-label/Japan-node overlap and the hidden Japan–USA edge appear.
      Legibility verdict: PASS
