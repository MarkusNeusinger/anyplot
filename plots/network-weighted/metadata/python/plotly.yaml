review:
  strengths:
  - Edge width and opacity both rise with weight, so the USA–Canada/Mexico/China corridor
    dominates and light links recede, in both themes
  - Label slots chosen from each node's outward direction keep most labels off the
    edges
  - Caption explains edge width with the data's real thin/thick values and names node
    size as weighted degree
  - 'Theme tokens threaded through title, labels, caption box and node outlines; identical
    #009E73 data colours in both renders'
  - Per-edge and per-node hover text with weights in the HTML output
  - 'Adaptable data block: an edge-list DataFrame with column constants drives everything'
  weaknesses:
  - 'VQ-02 (both): the Japan label sits below-left of its node, between Japan and
    Australia, with the thin Japan–Australia and S. Korea–Australia edges running
    through the text → a label slot clear of edges, about 0 edge crossings. Likely
    cause: the outward-angle slot picks ''bottom left'' for Japan, the direction its
    Australia edge leaves the node.'
  - 'SC-02 (both): C5 — the Japan and S. Korea nodes overlap and their China edges
    (320 and 280) merge into one band, so neither thickness reads on its own → nodes
    at least one node diameter apart. Likely cause: the repulsion constant k=0.5 against
    the weight-boosted attraction (1 + w / w_max) in the layout loop.'
  - 'Suggestion: a small sample of two or three line widths in the caption, labeled
    with their weights, would let the reader read edge values off the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
      Chrome: centred title 'network-weighted · python · plotly · anyplot.ai' in dark ink; 15 country labels in dark ink on the outer side of their nodes; bottom-left caption box (elevated bg, INK_SOFT border) reading 'Edge width = Trade volume (billion USD) / thin: 35 · thick: 620 / Node size = weighted degree'. All readable.
      Data: #009E73 nodes sized by weighted degree (USA and China largest), 29 green edges 1.5–10.5 px with opacity rising with weight; USA–Canada, USA–Mexico, USA–China thickest. European cluster (Germany, France, Italy, Spain, Netherlands, UK) to the right. Japan and S. Korea nodes overlap; the Japan label sits between Japan and Australia with thin edges through it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, node labels and caption text in light ink; caption box dark elevated with light border. No dark-on-dark text.
      Data: identical #009E73 nodes and edges, same layout; light edges read darker on the dark surface but the thinnest (India–UK, Spain–Italy) remain visible.
      Legibility verdict: PASS
