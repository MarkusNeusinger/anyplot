review:
  strengths:
  - Edge pixel positions are fitted to pygal's rendered node discs (np.polyfit over
    the circle coordinates), so every edge meets its node centre exactly
  - Edge thickness in weight classes (4/9/15/22 px) with a key whose sample lines
    carry the dollar range they stand for
  - Node size encodes weighted degree and node color the region, both named in the
    caption and the legend
  - HTML output is pygal's own SVG, keeping its native tooltips and interactive legend
  - Theme tokens threaded through Style, edges and key; both renders fully readable
  weaknesses:
  - 'SC-02 (both): the MEX–CHN and CAN–CHN edges run straight underneath the USA disc,
    so they read as edges into USA and their thickness cannot be followed along their
    length (spec C5) → a layout where no edge crosses an unrelated node, e.g. a different
    seed or a stronger repulsion term. Likely cause: np.random.seed(42) start positions
    with repulsion k*k/dist*1.5.'
  - 'VQ-03 (both): the region legend swatches are about 12 px squares beside 40 px
    legend text and read as specks → swatches near the text height (about +25 px).
    Likely cause: pygal''s default legend_box_size, not raised with legend_font_size=40.'
  - 'Suggestion: place the edge-width key and the region legend on one baseline so
    the bottom band reads as a single legend block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
      Chrome: title 'network-weighted · python · pygal · anyplot.ai' in dark ink at top; caption 'Node size = total trade volume · node color = region' and region legend (Americas, Asia, Europe, Oceania) at the bottom; edge key 'Edge width = trade volume:' with three sample lines labeled $20–178B, $178–335B, $492–650B. All text readable.
      Data: 13 country nodes, Americas #009E73, Asia #C475FD, Europe #4467A3, Oceania #BD8233, sized by weighted degree (USA and CHN largest); 27 gray edges at 4/9/22 px drawn beneath the nodes and meeting node centres; labels right-below each node. MEX–CHN and CAN–CHN pass under the USA disc.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
