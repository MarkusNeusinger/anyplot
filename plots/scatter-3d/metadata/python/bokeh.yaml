review:
  strengths:
  - 'Hand-built orthographic projection from one matrix product (PROJ) turns bokeh,
    which has no 3D, into a convincing 3D box: pane grids on the floor and two back
    walls, outer box edges, and the hidden back edge drawn dashed'
  - 'Depth cues the spec asks for: markers sorted back to front and scaled from 24
    to 48 px by nearness, translucent fill (alpha 0.8) with a page-colored outline
    so overlapping points stay distinguishable'
  - Oblique viewpoint (elevation 25°, azimuth 45°) gives all three axes visible extent;
    each axis has an arrow, five value ticks and a bold title with units, parallel
    to its edge
  - Color bar built from bokeh's native ColorBar with LinearColorMapper on the Imprint
    sequential ramp, titled with the variable it encodes
  - HoverTool reports all three original values per point in the HTML output, and
    the toolbar keeps pan/zoom for the interactive view
  - Realistic penguin field-measurement scenario (three species, 50 birds each) with
    plausible bill, flipper and mass values that form visibly separate clusters
  - Theme tokens threaded through every text, line and fill; both renders pass the
    readability check
  weaknesses:
  - 'VQ-02 (both): at the two lower box corners the tick labels of different axes
    stack against each other: ''2.6'' (Body Mass) sits directly above ''228.1'' (Flipper
    Length) at the left corner, and ''173.1'' (Flipper Length) runs into ''35.4''
    (Bill Length) with about 10 px between them at the front corner, so a reader can
    attach a value to the wrong axis → at least about 30 px between labels of different
    axes (+20 px). Likely cause: the shared corner points in axis_specs; drop the
    corner tick of one axis or set a larger tick_offset along each axis direction.'
  - 'VQ-07 (dark): a 1 px light-gray (#535350) rectangle frames the whole plot area
    in the dark render; it does not come from a theme token and is close to invisible
    in the light render (#FBFAF5), so the chrome differs between themes and draws
    a box the style guide does not ask for → no frame, or a frame drawn from INK_SOFT
    in both themes. Likely cause: bokeh''s default frame or border line that p.outline_line_color=None
    does not reach; also set p.border_line_color / min_border-area outline properties
    explicitly.'
  - 'Suggestion: color currently repeats z (body mass) as a ramp; the data already
    carries species, and coloring by species with a legend would add the fourth variable
    the Notes mention.'
  - 'Suggestion: tick values at even fractions of the data range (228.1, 214.3, 200.6)
    are harder to read than round values; ticks at round numbers within the range
    would read faster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold dark title "scatter-3d · python · bokeh · anyplot.ai" top left; an orthographic 3D box (elevation 25°, azimuth 45°) with gray outer edges, subtle pane grids on the floor and the two back walls, and the hidden back edge dashed. Three dark-gray arrowed axes along the lower edges: Bill Length (mm) to the right, Flipper Length (mm) to the left, Body Mass (kg) vertical, each with five tick values (35.4–55.2, 173.1–228.1, 2.6–6.0) and a bold title parallel to its edge. A tall color bar at the right edge, ticks 3–6, rotated title "Body Mass (kg)". At the two lower corners tick labels of different axes sit close together ("2.6" over "228.1", "173.1" next to "35.4").
      Data: 150 translucent circles with a page-colored outline, sized 24–48 px by depth, colored on the Imprint sequential ramp from #009E73 (light birds) to #4467A3 (heavy birds); three clusters visible (a high-mass cluster at the back left, two lower clusters front and right).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink, ticks in light gray INK_SOFT, axis lines and arrows light gray, pane grids subtle but visible; no dark-on-dark text. A thin 1 px light-gray rectangle frames the plot area that is not visible in the light render.
      Data: identical marker colors and positions as the light render; outlines flip to the dark page color.
      Legibility verdict: PASS
