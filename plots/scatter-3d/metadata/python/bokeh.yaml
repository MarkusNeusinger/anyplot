review:
  strengths:
  - 'The orthographic projection is a convincing 3D frame: an oblique 45°/25° view
    gives all three axes a visible extent, and pane grids on the floor and the back
    walls plus a dashed hidden edge make depth readable.'
  - 'The depth cues are well chosen: markers are sorted back to front, near points
    are drawn larger, and alpha 0.8 with a page-colored outline lets interior points
    show through.'
  - The color bar comes from LinearColorMapper through a field transform on the Imprint
    sequential ramp and is labeled with the variable it encodes. The theme chrome
    is correct in both renders.
  - A HoverTool shows formatted x, y and z values for every point in the HTML output.
  weaknesses:
  - 'VQ-06, DQ-02 (both): the three axes and the color bar are titled with the placeholders
    "X-Axis (units)", "Y-Axis (units)" and "Z-Axis (units)". They name no quantity
    and no real unit → give the clusters a real scenario, for example three measured
    features of a sample, with descriptive titles and units such as "Petal Length
    (cm)". Likely cause: the X/Y/Z column constants.'
  - 'CQ-01 (code): the plot zone defines four helper functions, normalize, project,
    screen and point, where the rubric asks for a flat Imports → Data → Plot → Save
    script → inline the vectorized projection as module-level expressions. The mandated
    _lerp_hex ramp builder is exempt. Likely cause: the projection factored into def
    blocks (lines 68–88, 153–155).'
  - 'Suggestion: the data has three generated clusters, but the color encodes z, which
    repeats the vertical axis. Coloring by cluster membership with a legend would
    add the spec''s fourth dimension.'
  - 'Suggestion: round tick values, such as −3, −1, 1, 3, would read more easily than
    the min-to-max linspace values (−3.1, −1.4, 0.2 …).'
  image_description: |-
