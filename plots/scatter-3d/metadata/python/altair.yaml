review:
  strengths:
  - Hand-projected oblique 3D box with twelve edges and a floor grid gives a readable
    3D frame in a library without a 3D mark
  - Depth-sorted drawing through the order channel plus depth-modulated opacity makes
    near and far points readable
  - Axis titles with units sit on the edges nearest the viewer, so each direction
    is identifiable
  - 'Full Imprint palette with Cluster 1 in #009E73, page-colored marker outlines
    and correct chrome in both themes'
  - Tooltips with all three coordinates and pan/zoom in the HTML output
  weaknesses:
  - 'VQ-02 (both): the box edges run through the end-value labels 4.5, -4.2, -3.1
    and 4.0 at the corners → offset each label clear of every edge meeting at its
    corner (about 10 px more). Likely cause: tick dx/dy of 0 on the zero component
    and only 18/14 px on the other in the labels loop.'
  - 'SC-02 (both): only four of the six axis end values are drawn because labels at
    shared corners are deduplicated, so the x and y ranges cannot both be read (C1)
    → one min and one max label per axis, placed along that axis'' own edge. Likely
    cause: labels.duplicated([''u'',''v''], keep=''last'') dropping the second axis''
    value at a shared corner.'
  - 'VQ-01 (both): the end-value labels are 9 pt, below the library prompt''s 10 pt
    label size → 10 pt (+1 pt). Likely cause: size 9 for kind ''tick'' in the text_layers
    list.'
  - 'VQ-05 (both): the 3D box fills only the central ~55% of the canvas width with
    wide empty bands above and below, and the legend floats detached at the far right
    → enlarge the view toward the library prompt''s 620x320 and keep the legend next
    to the box. Likely cause: width=560 plus the extra 0.45 u-domain margin reserved
    for the legend.'
  - 'DQ-03 (both): Length, Width and Height are labelled in cm but run to -4.2 and
    -3.1 → generate positive sizes (shift the cluster centers above zero). Likely
    cause: cluster centers at negative coordinates.'
  - 'DQ-02 (both): the groups are labelled Cluster 1-3 → names a reader recognises
    for the measured objects (for example specimen or product groups). Likely cause:
    f''Cluster {i + 1}'' in the data block.'
  - 'CQ-01 (code): two helper functions, project() and rules() → inline the projection
    as vectorised array expressions and the two rule layers as direct alt.Chart calls.
    Likely cause: helper functions for repeated projection and rule styling.'
  - 'Suggestion: intermediate tick values along each axis edge would make positions
    inside the box easier to read.'
