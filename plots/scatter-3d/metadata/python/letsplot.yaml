review:
  strengths:
  - 'Builds a real 3D frame in a library without a 3D coordinate system: each axis
    is scaled into a unit cube, rotated to an oblique view (elevation 22°, azimuth
    −55°) and projected, so all three axes have visible extent and the three clusters
    read clearly at different depths'
  - 'Depth cues on several levels: grid lines only on the three back panes, solid
    front box edges, painter''s order (far points drawn first), marker size growing
    toward the viewer, alpha 0.8 with page-colored outlines so overlapping roost points
    stay separable'
  - All three axes are labeled with units (Easting, Northing, Altitude in m) with
    tick labels placed just outside the front edges; the altitude color bar is labeled
    and uses the imprint_seq green-to-blue gradient
  - 'Theme tokens are threaded through every element: grid in INK at low alpha, edges
    and ticks in INK_SOFT, outlines in PAGE_BG; both renders are fully readable and
    the data colors are identical'
  - layer_tooltips shows the original Easting/Northing/Altitude values (formatted
    to 2 decimals) on hover in the HTML output instead of the projected screen coordinates
  - 'Specific, plausible scenario: GPS fixes of tagged starlings at a reed-bed roost
    (a swirling flock, a high commuting line along a hedgerow, a group foraging just
    above the meadow)'
  weaknesses:
  - 'Suggestion: the data already has three behavioral groups (roost swirl, hedgerow
    line, meadow group); coloring by group with a legend would carry a true fourth
    variable instead of repeating altitude, which the z-axis already shows.'
  - 'Suggestion: the cube sits left of center with a wide empty band before the color
    bar; shifting the x window so the gap between cube and legend matches the left
    margin would balance the composition.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas (theme_void, no panel border).
      Chrome: bold title "scatter-3d · python · letsplot · anyplot.ai" top-left in near-black (~47 % of the width); an oblique 3D box with solid grey front edges and faint grey grid lines on the floor and the two back walls; tick labels in dark grey (Easting −30/0/30 along the front-left floor edge, Northing −50/−25/0/25 along the front-right floor edge, Altitude 15/30/45 on the left vertical edge); axis titles "Easting (m)", "Northing (m)", "Altitude (m)" in near-black; color bar "Altitude (m)" on the right with ticks 10–50. All text readable, no overlap, nothing clipped.
      Data: ~150 circles with thin page-colored outlines at alpha 0.8, filled on a green #009E73 (low) → blue #4467A3 (high) gradient by altitude; three clusters: a high elongated cloud upper-left (hedgerow line), a dense mid-height cluster right (roost swirl), a flat green layer on the floor (meadow). Near markers are larger than far ones.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light off-white, tick labels in light grey, box edges light grey, back-pane grid subtle but visible; color bar title and labels light. No dark-on-dark text anywhere.
      Data: identical positions, sizes and green→blue fills as the light render; only the marker outlines switch to the dark page color.
      Legibility verdict: PASS
