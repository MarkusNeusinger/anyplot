review:
  strengths:
  - 'Builds a genuine 3D frame in a 2D grammar: each axis is scaled into a unit cube,
    rotated to an oblique 22° elevation / -55° azimuth view and projected, so all
    three axes have visible extent and every marker sits at its exact x, y, z projection'
  - 'Strong depth cues: back-pane grid lines aligned to the tick values on floor and
    both walls, stronger box edges in INK_SOFT, painter''s ordering (far points drawn
    first) and marker size scaled by nearness to the viewer'
  - 'Altitude on imprint_seq (scale_fill_gradient #009E73 → #4467A3) with a color
    bar titled ''Altitude (m)''; page-colored marker outlines at alpha 0.8 keep overlapping
    points in the dense clusters separable in both themes'
  - layer_tooltips() with formatted lines restores the original X, Y and Altitude
    values in the HTML output, where the projected screen coordinates would otherwise
    be meaningless
  - 'Theme tokens threaded through every element: grid, edges, tick labels, axis titles,
    title, legend and backgrounds all flip correctly between #FAF8F1 and #1A1A17'
  weaknesses:
  - 'VQ-01 (both): the 3D tick labels (geom_text size=4.2) render at about 22 px on
    the 3200 px canvas, clearly smaller than the 10 pt legend text, and blur to about
    3 px in the 400 px thumbnail → about the legend-text size (geom_text size about
    5.5, +1.3). Likely cause: geom_text(data=tick_labels, size=4.2).'
  - 'VQ-05 (both): the cube occupies only the middle band of the canvas, leaving roughly
    the left quarter empty while the color bar floats about 240 px right of the cube''s
    right edge, so the whitespace sits unbalanced on the left → center the cube plus
    color bar as one block (shift the x window so the empty left margin shrinks by
    about half). Likely cause: x_limits centered on text_x.mean() with PANEL_ASPECT
    1.7, which ignores the space the right-hand legend takes.'
  - 'DQ-02 (code): the scenario is described as ''simulated sensor readings in a volume''
    with clusters named only as a sphere, an ellipsoid and a disk, and axes labelled
    ''X position'' / ''Y position'', which reads as abstract geometric test data rather
    than a concrete situation → give the clusters a concrete domain (for example drone
    GPS fixes or tagged bird positions over named sites) and name the axes accordingly.
    Likely cause: the data block''s generic shape-based clusters.'
  - 'Suggestion: a few colour-bar ticks below 0 (the bar extends to about -2 m without
    a label) would make the green end of the scale readable.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: bold dark title "scatter-3d · python · letsplot · anyplot.ai" top-left (~47 % of width); an oblique 3D box with grey back-pane grid lines on the floor and two walls and darker box edges; tick labels -3/0/3 (X), -5/-2.5/0/2.5 (Y) along the front floor edges and 0/2/4 (Altitude) on the left vertical edge; axis titles "X position (m)", "Y position (m)", "Altitude (m)" in dark ink. Color bar "Altitude (m)" at the right with ticks 0, 2, 4. All text readable; tick labels small.
      Data: ~150 circular markers in three clusters (high elongated blue cluster upper-left, mid teal sphere at right, flat green disk on the floor), filled on an imprint_seq gradient #009E73 → #4467A3 by altitude, alpha 0.8 with page-colored outlines, nearer points drawn larger.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink, tick labels in light grey INK_SOFT, grid and box edges in light grey at low alpha; color bar title and labels light. No dark-on-dark text anywhere.
      Data: identical marker colors and positions to the light render; only the marker outlines flip to the dark page color.
      Legibility verdict: PASS
