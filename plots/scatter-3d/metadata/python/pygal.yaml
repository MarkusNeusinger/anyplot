review:
  strengths:
  - 'A true 3D scatter in a library without 3D support: an orthographic projection
    at a 38/24 deg oblique view gives all three axes visible extent and makes the
    depth of the cloud apparent'
  - Depth cues from dashed pane grids on the depth-chosen back walls and floor, with
    solid box edges in a heavier weight
  - All three axes carry tick values and titles with units (mm, mg), and the varieties
    are named in a legend with Imprint green, purple and blue
  - 'Theme tokens threaded through Style and inline CSS: both renders read cleanly
    with identical data colours'
  - Plausible, neutral seed-morphology scenario with weight correlated to length inside
    each variety
  weaknesses:
  - 'VQ-02 (both): the box''s back vertical edge and both top edges climb to about
    y=60 px and cross the title text between "pygal" and "·" → keep the whole frame
    at least 20 px below the title baseline. Likely cause: chart.range = (-0.12, 1.42)
    with margin_top=30 maps the projected top-back corner (unit z=1) onto the title
    row.'
  - 'VQ-05 (both): the 3D box fills the top ~75 % of the square canvas and presses
    against the title, while below the left-aligned legend about 20 % (~480 px) of
    the canvas stays empty → centre the box vertically so top and bottom margins are
    similar (shift about +200 px down). Likely cause: chart.range lower bound -0.12
    leaves no room below and margin_bottom=40 plus legend_at_bottom leave the freed
    space unused.'
  - 'CQ-01 (code): three helper functions unit(), project() and screen() (lines 62-78)
    → inline the normalisation and the rotation as array expressions on the stacked
    coordinates. Likely cause: projection factored into functions.'
  - 'CQ-04 (code): chrome_colors (line 122) is never used and the Style colours are
    padded with a magic (INK_SOFT,) * 40 (line 129) → delete chrome_colors and size
    the padding from len(frame_lines) plus the label series. Likely cause: leftovers
    from an earlier colouring approach.'
  - 'Suggestion: a subtle per-variety highlight, e.g. naming the heaviest variety
    in the subtitle, would give the clusters a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the 2400x2400 square canvas.
      Chrome: title "scatter-3d · python · pygal · anyplot.ai" in dark ink at the top; the box's back vertical edge and top edges run up into the title row and cross it between "pygal" and "·". An oblique 3D box: solid grey box edges, dashed grey pane grids on the two back walls and the floor. Tick values 14/26/38/50 on the vertical axis, 4.9/4.1/3.2 along the width edge, 4.8/6.7/8.5/10.3 along the length edge; axis titles "Seed weight (mg)", "Seed width (mm)", "Seed length (mm)" — all dark and readable. Legend bottom-left (Sunrise, Meadow, Harvest); the bottom ~20 % of the canvas is empty.
      Data: 150 markers in three clusters — Sunrise #009E73 low near the front, Meadow #C475FD mid-height, Harvest #4467A3 high at the back right; markers ~11 px, clearly visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, tick values, axis titles and legend in light ink and fully readable; box edges and dashed grids in light grey, subtle but visible; no dark-on-dark text. The same frame/title collision as in light.
      Data: identical green, purple and blue markers and positions as the light render; only chrome flips. Brand green reads well.
      Legibility verdict: PASS
