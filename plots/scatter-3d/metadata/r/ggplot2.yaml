review:
  strengths:
  - Clever native ggplot2 solution for 3D scatter via orthographic projection (rotate-then-project
    math) plus a wireframe bounding box, avoiding any workaround/fallback to another
    library — directly satisfies the 'no native 3D, don't fall back' library rule.
  - Depth-based point sizing and alpha (power-curve mapping of projected depth) gives
    a genuine sense of occlusion/perspective in a static 2D render of ~185 points.
  - Thoughtful zone callouts (Zone A/B/C) with hand-tuned leader-line offsets that
    dodge the dense clusters and the axis-tip labels — strong data storytelling for
    a CT-scan defect narrative.
  - 'Correct Imprint sequential gradient (#009E73 to #4467A3) for the defect-size
    color encoding, identical across both themes; chrome (background, ink, wireframe)
    flips correctly for light/dark.'
  - Realistic, neutral, well-scaled dataset (CT-scanned porosity defects in a titanium
    bracket) with plausible defect-size distribution and point count within the 50-500
    spec range.
  weaknesses:
  - 'Minor label/marker crowding: the ''0'' tick label near the shared tri-axis origin
    sits almost touching a data point in both renders — nudge tick_nudge slightly
    higher so the label fully clears the marker.'
  - The project() helper is a function, a mild deviation from the KISS 'no functions/classes'
    guidance — could be inlined as vectorized mutate() calls, though it is reasonably
    justified by the repeated rotation math being applied to three separate point
    sets (data, box corners, ticks).
  - The wireframe box draws all 12 edges with uniform color/alpha and no hidden-line
    differentiation — a subtly fainter treatment for edges that would be occluded
    in a true 3D view could sell the depth illusion even more convincingly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the whole canvas.
      Chrome: Title "scatter-3d · r · ggplot2 · anyplot.ai" centered at top in dark ink, clearly readable. A projected cube wireframe (thin gray lines) represents the 3D bounding box, with bold axis titles "X (mm)", "Y (mm)", "Z (mm)" placed past the box tips, plus small "0"/"15" tick numerals along the edges. Three italic zone callouts ("Zone A", "Zone B", "Zone C") with thin leader lines point into the dense clusters. A caption below the plot describes the CT-scan context. A vertical color-gradient legend "Defect size (µm)" sits to the right of the plot, labeled 25-125.
      Data: Circular points colored on a green-to-blue sequential gradient (#009E73 low, #4467A3 high), first/low color matches the mandated brand green. Two dense clusters (Zone A/B) and one sparser cluster (Zone C) are visible, plus scattered background points, with point size and opacity varying by projected depth to suggest occlusion.
      Legibility verdict: PASS — all title, axis, tick, callout, and legend text is clearly readable against the light background; no light-on-light issues found. One minor near-touch between a "0" tick label and an adjacent point (not a legibility failure, just tight spacing).

