review:
  strengths:
  - Genuinely 3D scatter achieved within ggplot2's 2D grammar via a hand-rolled orthographic
    rotate-then-project transform (az=35°, el=20°) applied consistently to points,
    the bounding wireframe, and all labels — a legitimate technique, not a fallback
    to another library
  - 'Depth cues are well executed: point size and alpha both scale with a power curve
    (depth_norm^1.3) of projected depth, and points are drawn back-to-front (arrange(depth))
    so nearer defects appear larger, more opaque, and correctly occluding'
  - 'Realistic, neutral, specific dataset: CT-scanned porosity defects in a 3D-printed
    titanium bracket, three weak layer-adhesion zones plus background noise, mm coordinates
    and micrometre defect sizes are all plausible for the domain'
  - 'Correct sequential Imprint gradient (#009E73 → #4467A3) for the 4th variable
    (defect size), correct light/dark chrome tokens, and the categorical/continuous
    rules from the style guide are respected in both renders'
  - Clean theme_void-based composition with generous margins, no clipped content (canvas
    gate passed at 3200×1800), and a caption that supplies real-world context and
    the axis scale (±15 mm) in prose
  weaknesses:
  - The numeric tick labels ('0', '15') and the 'Zone A' / 'Zone B' / 'Zone C' callouts
    added in the previous repair pass are NOT visible anywhere in either render —
    verified by cropping and zooming into all three box tips (X, Y, Z) and both point
    clusters at 2-3x magnification in both plot-light.png and plot-dark.png. This
    means the prior review's explicit ask ('the box had no coordinate scale') is still
    unmet in the actual rendered output even though the code now computes tick_labels/zone_labels
    tibbles and adds geom_text() layers for them.
  - Root cause is very likely that zone_labels are positioned at the projected zone
    center (+2.4 y-offset), which lands directly inside the corresponding dense, fully-packed
    point cluster — with 55+ overlapping alpha-blended circles per zone, there is
    no visual gap for text to show through, and it does not appear to draw over the
    points despite being the last layer added. Recommend either moving each zone label
    well outside its cluster with a short leader line/segment back to the centroid,
    or verifying at the R level (print the tibble; check for accidental NA/Inf) that
    the geom_text layer is actually receiving rows.
  - The 'X (mm)' axis title itself overlaps several scatter points near the bottom
    vertex in both themes — the label sits too close to the box tip; increase label_gap
    so it clears the point cloud, especially since the X-tip region is where several
    background-noise points happen to land.
  - Tick labels for Y and Z axes were checked directly adjacent to their axis titles
    (where the '15' tick should sit, given tick value 15 is close to the ~17 axis
    extent) and are equally absent — this isn't only a cluster-overlap problem, so
    the geom_text(data = tick_labels, ...) layer needs to be debugged independently
    of the zone-label fix.
  - Uses a custom project() helper function, which is a mild KISS deviation (project
    rules generally favor no functions/classes in these single-purpose scripts) —
    acceptable here since it avoids repeating the same 6-line rotation formula four
    times, but flagging for awareness.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — correct.
      Chrome: Title "scatter-3d · r · ggplot2 · anyplot.ai" centered at top, dark ink, fully legible. Caption below the plot in soft ink, legible. Axis titles "X (mm)", "Y (mm)", "Z (mm)" in bold dark text at the three visible box tips — legible, BUT "X (mm)" partially overlaps a cluster of data points near the bottom vertex (confirmed at 2x zoom). Legend "Defect size (µm)" with tick values 25/50/75/100/125 is fully legible. The numeric axis tick labels ("0", "15") that the code computes are NOT visible anywhere on the wireframe edges (checked near all three tips at 2-3x zoom) — functionally absent from the render. The "Zone A" / "Zone B" / "Zone C" callout labels are likewise not visible anywhere, including directly inside the two dense point clusters where their computed coordinates place them.
      Data: First/low end of the color scale is Imprint green (#009E73), high end is Imprint blue (#4467A3) — correct sequential gradient, colors read clearly against the light background. Two dense point clusters (one larger combining two nearby zones, one smaller) are visible with clear depth-based size/alpha variation.
      Legibility verdict: PASS for title/axis-titles/legend/caption; FAIL for tick labels and zone callouts (present in code, invisible in render).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — correct.
      Chrome: Title, caption, axis titles, and legend text all render in light ink, fully legible against the dark background — no dark-on-dark failures. Same "X (mm)" / point-cluster overlap issue as light render, confirmed at 2x zoom. Same total absence of tick labels ("0"/"15") and zone callouts ("Zone A/B/C") — checked in the identical crop regions as the light render, with identical result.
      Data: Colors are pixel-identical to the light render (green-to-blue sequential gradient) — only chrome flipped, as required. Cluster shapes and depth cues match the light render exactly.
      Legibility verdict: PASS for title/axis-titles/legend/caption; FAIL for tick labels and zone callouts (same missing-content issue as light render, ruling out a theme-specific cause).
