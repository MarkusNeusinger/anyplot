review:
  strengths:
  - Clever, well-executed rotate-and-project technique folds the true 3D coordinates
    into ggplot2's native 2D grammar (geom_point/geom_segment/geom_text) without falling
    back to another library or plotting device — exactly the kind of library-appropriate
    workaround the ggplot2 rules ask for when a plot type sits outside the grammar's
    native support.
  - Depth-based point size and alpha (nearer points larger and more opaque, farther
    points smaller and fainter) give a convincing sense of 3D depth despite the static
    2D render, and the wireframe bounding box gives the viewer a stable spatial reference
    frame.
  - 'Correct canvas dimensions (3200x1800), correct Imprint sequential gradient (#009E73
    to #4467A3) for the 4th-variable color encoding, and fully correct theme-adaptive
    chrome — both renders pass the readability check with identical data colors and
    only chrome (background/text/wireframe) flipping between themes.'
  - Realistic, neutral, well-scoped synthetic dataset (CT-scanned porosity defects
    in a 3D-printed titanium bracket) with a caption that compensates for the lack
    of on-plot tick marks by stating the per-axis scale.
  weaknesses:
  - No numeric scale/tick reference along the wireframe box edges — the viewer can
    read relative position within the box but cannot read precise mm coordinates directly
    off the plot (partially mitigated by the caption stating the +/-15 mm per-axis
    range).
  - In the densest regions of each defect cluster, points overlap heavily even with
    alpha blending, making it hard to distinguish individual points at the core of
    a cluster — consider slightly stronger alpha decay or jitter for the most crowded
    cluster.
  - The three weak layer-adhesion zones described in the code comments and caption
    aren't visually called out with any label or highlight — a small annotation per
    cluster would sharpen the data-storytelling angle beyond a generic exploratory
    scatter.
