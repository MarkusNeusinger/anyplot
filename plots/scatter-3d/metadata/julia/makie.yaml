review:
  strengths:
  - 'Correct Imprint palette usage: categorical color order (green/lavender/blue)
    with Idle mapped to brand green #009E73, identical data colors across both themes.'
  - 'Full theme-adaptive chrome: background, ink, grid, tick colors, and even the
    3D panel walls (xy/xz/yz) use a distinct ELEVATED_BG token so the box reads with
    depth in both light and dark renders.'
  - 'Idiomatic use of Axis3 (not a 2D scatter faked into 3D): explicit azimuth/elevation
    camera angle, aspect=(1,1,1), and per-panel coloring are distinctive Makie features.'
  - 'Clean, deterministic, single-purpose script: Random.seed!(42), no functions/classes,
    only used imports (CairoMakie, Colors, Random), correct plot-$(THEME).png output
    at the canonical 3200x1800 canvas.'
  - Descriptive, unit-bearing axis labels (Vibration (mm/s), Temperature (°C), Pressure
    (bar)) and a plausible industrial sensor-monitoring dataset with three clearly
    separated clusters.
  weaknesses:
  - Large unbalanced dead-space in the bottom-left quadrant of the canvas (roughly
    a third of the frame) because the Axis3 box is pushed toward the right/center
    at this azimuth/elevation — reduces overall composition balance (VQ-05, DE-02).
    Try a wider aspect adjustment, a slightly different azimuth, or nudging the figure/axis
    padding so the 3D box fills more of the canvas.
  - The three clusters are separated monotonically along all three axes at once (Idle=low/low/low,
    Normal=mid/mid/mid, Stress=high/high/high), so any single 2D projection (e.g.
    Vibration vs Temperature) would already separate them just as cleanly. This under-demonstrates
    the actual value of a 3D scatter — consider a dataset where at least one pair
    of dimensions overlaps for two groups so the third axis is doing real disambiguating
    work.
  - No transparency/alpha used on the markers despite within-cluster point overlap
    in the 3D projection — a light alpha (e.g. 0.85) would help reveal density where
    points overlap, per the spec's 'consider point transparency for dense datasets'
    note.
  - Distinctive-feature usage is solid but not pushed further — e.g. no colorbar/continuous
    4th-variable encoding (spec explicitly calls out 'color (numeric, optional) -
    Fourth variable') was attempted; the categorical color choice is valid but leaves
    one spec-suggested avenue unexplored.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), matches the light-theme token; the 3D panel walls (xy/xz/yz) use a slightly lighter elevated tone that gives the box subtle depth without looking pure white.
      Chrome: Title "scatter-3d · julia · makie · anyplot.ai" is dark ink, bold, centered above the 3D box, fully visible with no clipping. Axis labels "Vibration (mm/s)", "Temperature (°C)", "Pressure (bar)" are dark ink and legible. Tick labels on all three axes are a softer gray ink, clearly legible against the light panel backgrounds. Grid lines are faint but visible. A top-left legend lists Idle / Normal / Stress with colored swatches, fully readable, no overlap with data or axes.
      Data: Three distinct point clusters in green (#009E73, Idle), lavender (#C475FD, Normal), and blue (#4467A3, Stress) — matches the canonical Imprint categorical order with the first series in brand green. Markers have a thin light-colored stroke that helps them stand out from the panel background.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) canvas; the 3D panel walls use a lighter elevated dark tone, again giving the box visible depth against the outer background.
      Chrome: Title, axis labels, and legend text all render in a light off-white ink, clearly visible against the dark background — no dark-on-dark failures observed anywhere (title, axis titles, tick labels, legend text all pass). Tick labels use a softer light-gray ink and remain legible on the dark panel surfaces. Grid lines are faint but visible, consistent with the light render's subtlety.
      Data: Colors are pixel-identical to the light render — same green/lavender/blue for Idle/Normal/Stress — confirming only chrome flipped between themes, not the data-color-encoding.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or light-on-light failures.
