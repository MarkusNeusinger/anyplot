review:
  strengths:
  - Cluster centers/spreads now make Idle and Normal genuinely overlap in the vibration/temperature
    plane, so pressure (the third axis) is load-bearing — a real fix over attempt
    1's fully-separable-in-2D layout
  - Alpha transparency (0.85) plus a subtle theme-matched marker stroke now reveals
    within-cluster density that attempt 1's opaque markers hid
  - 'Correct Imprint palette: canonical categorical order with Idle mapped to brand
    green #009E73, pixel-identical data colors across both themes'
  - Full theme-adaptive chrome including distinct elevated-panel coloring for the
    3D box walls (xy/xz/yz), consistent in both light and dark renders
  - Idiomatic Axis3 usage — deliberate azimuth/elevation camera framing and aspect=(1,1,1),
    genuinely 3D rather than a faked 2D plot
  - 'Clean, deterministic, single-purpose script: seeded RNG, no functions/classes,
    only used imports, correct plot-$(THEME).png output at the canonical 3200x1800
    canvas'
  weaknesses:
  - The bottom-left quadrant of the canvas (below the legend, left of the temperature-axis
    edge of the Axis3 box) is still largely empty at this azimuth/elevation — the
    camera-angle tweak (1.1pi->1.275pi azimuth, 0.18pi->0.15pi elevation) shifted
    the composition but did not close the dead zone flagged in attempt 1; try a further
    azimuth sweep or increase Figure padding/aspect so the box's left corner reaches
    closer to the canvas edge
  - Within the Stress cluster especially, many markers still visually overlap despite
    the new 0.85 alpha — consider markersize ~10-12 for this point count, or a slightly
    lower alpha (~0.7), to better reveal density
  - The spec's suggested optional 'color (numeric) as fourth variable' encoding remains
    unexplored in favor of categorical grouping — a valid choice, but a spec-highlighted
    avenue is still untried
  - Title 'scatter-3d · julia · makie · anyplot.ai' renders at only ~20% of canvas
    width — well under the ~50-70% target proportion; a larger titlesize would use
    the available canvas better without any overflow risk
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), with subtly lighter "elevated" tone on the 3D panel walls (xy/xz/yz) that gives the Axis3 box visible depth.
      Chrome: Title "scatter-3d · julia · makie · anyplot.ai" in dark ink, bold, centered, fully visible (though narrower than the 50-70% width target). Axis labels ("Vibration (mm/s)", "Temperature (°C)", "Pressure (bar)") are dark ink and legible; tick labels use a softer gray ink, clearly readable against the light panels. Top-left legend (Idle/Normal/Stress) fully readable with no overlap onto data.
      Data: Three point clusters render in green (#009E73, Idle), lavender (#C475FD, Normal), and blue (#4467A3, Stress), each now with visible alpha blending (0.85) and a thin theme-matched marker stroke. The Idle and Normal clusters visibly overlap when projected onto the vibration/temperature plane and are separated mainly by height (pressure), demonstrating genuine 3D disambiguation.
      Legibility verdict: PASS (all text readable against the light background; no light-on-light issues). Note: bottom-left quadrant of the canvas (below legend) is largely empty — a layout/composition issue, not a legibility issue.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), with the same lighter elevated tone on the panel walls preserving visible depth.
      Chrome: Title, axis labels, tick labels, and legend text all render in light ink and are clearly visible against the dark background — no dark-on-dark failures observed anywhere.
      Data: Data colors (green #009E73 Idle, lavender #C475FD Normal, blue #4467A3 Stress) are pixel-identical to the light render, confirming only chrome flipped between themes.
      Legibility verdict: PASS (all text readable against the dark background). Same bottom-left dead-space composition issue persists as in the light render, unrelated to legibility.
