review:
  strengths:
  - Clever isometric axonometric projection built from pure ECharts primitives (line
    + scatter + graphic text) to render true 3D-scatter semantics without echarts-gl
    -- a genuinely mastery-level workaround for this library's constraints
  - 'Domain-accurate igneous-petrology dataset: three real rock groups (felsic/mafic/ultramafic)
    with density values that correctly correlate with SiO2/MgO composition -- factually
    grounded 4th-dimension color encoding'
  - Imprint imprint_seq colormap correctly applied to the continuous density variable,
    identical between light/dark renders, with correct theme-adaptive chrome throughout
  - Title, axis labels, and tooltip formatter are clean, descriptive, and unit-labeled
  weaknesses:
  - 'Dense marker overlap within each cluster: 40 points at symbolSize=16 crammed
    into a roughly 150px-wide area (especially the Fe2O3 cluster) makes individual
    points hard to distinguish -- reduce symbolSize to ~10-12 or lower opacity further
    to reveal internal structure'
  - No tick/scale values on any of the 3 axes -- the static PNG viewer can only infer
    composition ranges via tooltip (interactive-only); add a couple of numeric tick
    labels along each axis guide (e.g. min/max endpoints) so scale is readable without
    hovering
  - 'Canvas vertical space is used somewhat unevenly: a large empty gap sits between
    the title and the point clusters, and another large empty triangle sits below
    the clusters where only guide lines run -- tighten margins or scale the projection
    up to use canvas space more efficiently'
  - Colorbar legend text ('High density'/'Low density') omits units (g/cm3) even though
    the tooltip includes them -- add units to the legend text
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "Rock Sample Composition · scatter-3d · javascript · echarts · anyplot.ai" is dark, centered, fully legible. Three axis guide lines (SiO2, Fe2O3, MgO) drawn in a soft dark ink tone form an isometric tripod converging at the origin. Axis labels "SiO2 (wt%)", "Fe2O3 (wt%)", "MgO (wt%)" sit at each guide tip in dark ink, clearly readable. Vertical colorbar legend on the right labeled "High density" (top, blue) / "Low density" (bottom, green) in soft dark text.
      Data: Three tight clusters of circular markers positioned near the three axis tips, each internally shaded from green to blue via the continuous density encoding; the SiO2-heavy cluster reads green (lower density, felsic), the MgO-heavy cluster reads blue (higher density, mafic/ultramafic). Markers have a thin light-colored border matching the page background for separation.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title, now rendered in light/off-white ink, fully legible against the dark background. Axis guide lines rendered in a lighter soft-gray tone, still subtle but visible. Axis labels ("SiO2 (wt%)", "Fe2O3 (wt%)", "MgO (wt%)") are light-colored and clearly legible. Colorbar legend text is light-colored and readable.
      Data: Same three clusters in the same screen positions, with data colors (green-to-blue density gradient) visually identical to the light render -- only chrome (background, guide lines, text, marker borders) flipped to the dark-theme tokens.
      Legibility verdict: PASS -- no dark-on-dark failures; every title/label/tick element is clearly visible against the near-black background.
