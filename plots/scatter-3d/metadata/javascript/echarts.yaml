review:
  strengths:
  - Creative isometric axonometric 3D projection built entirely from core echarts
    primitives (scatter + line + graphic text) — a strong technical workaround given
    echarts-gl is unavailable
  - Correct Imprint sequential palette (imprint_seq) for the continuous density variable,
    identical data colors between light/dark themes — only chrome flips
  - Deterministic LCG + Box-Muller data generation with geologically realistic SiO2/Fe2O3/MgO/density
    values forming three plausible igneous rock groups
  - Per-axis tick labels are computed from real data ranges (not decorative), so the
    static PNG reads correctly without needing the interactive tooltip
  - 'Clean minimal chrome: no unnecessary borders, subtle ink-soft axis guides, title
    fontsize scaled to the mandated title length'
  weaknesses:
  - No depth-based sort/rendering order for overlapping markers — nearer points aren't
    guaranteed to draw over farther ones, undermining the 3D occlusion cue; consider
    sorting series data by a computed depth value or fading opacity by depth
  - Data storytelling relies solely on the density color gradient — the three rock
    clusters (basalt/granite/peridotite-like groups) aren't labeled or annotated,
    so viewers must infer the geological grouping themselves
  - Axis tick labels are quite small (11px) relative to the 3200x1800 canvas — a modest
    bump would help legibility at the 400px mobile thumbnail scale
  - The three axis guides run from each variable's own minimum (not true zero) to
    just past its max, so the layout reads more like three windowed scales meeting
    at a point rather than a grounded 3D box — a subtle floor/backplane grid would
    strengthen the 3D metaphor and reduce visual similarity to a ternary plot
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "Rock Sample Composition · scatter-3d · javascript · echarts · anyplot.ai" is centered at top in dark ink, clearly legible. Three axis guide lines (dark ink-soft gray) converge at a point near bottom-center, labeled "MgO (wt%)" (left tip), "Fe2O3 (wt%)" (top tip), and "SiO2 (wt%)" (right tip), with small percentage tick labels ("5%", "13%", "6%", "12%", "51%", "70%") placed along each guide. A vertical colorbar legend sits on the right, labeled "High density (g/cm³)" / "Low density (g/cm³)" in ink-soft gray.
      Data: Three clusters of circular markers, each positioned near one axis tip, colored on a teal (low density) to blue (high density) sequential gradient with white/pageBg borders to separate overlapping points.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, axis labels, and tick labels rendered in light gray/off-white, all clearly legible against the dark background — no dark-on-dark failures observed. Axis guide lines switch to a lighter gray, remaining visible but subtle.
      Data: Marker colors (teal-to-blue density gradient) are identical to the light render — confirmed only chrome (background, text, guide-line color) flipped between themes.
      Legibility verdict: PASS — all text is clearly readable against the dark background.
