review:
  strengths:
  - 'All three attempt-1 weaknesses were directly and correctly fixed: the "Temperature
    (°C)" label no longer collides with a data bubble, 0.8 alpha is now applied to
    combat overplotting, and WORLD_SCALE 10→13 substantially raised canvas utilization'
  - Creative isometric-projection 3D scatter built entirely on Chart.js's canvas plugin
    system, staying within the library's no-3D-scale constraint without reaching for
    an external library
  - Continuous PM2.5 variable correctly encoded with imprint_seq, identical between
    light/dark renders, with a properly labeled colorbar
  - 'Deterministic seeded LCG, self-contained single-file snippet, animation: false
    for a clean capture'
  weaknesses:
  - The bottom-center bubble cluster (highest-PM2.5, high-temperature/low-humidity
    readings) still shows meaningful point-on-point overlap even with 0.8 alpha -
    consider shrinking the bubble radius range slightly or nudging alpha down further
    for that specific density band
  - No interactive rotation, though this is an inherent Chart.js limitation (no native
    3D scale) rather than an implementation oversight - the spec's "where library
    supports it" clause applies
