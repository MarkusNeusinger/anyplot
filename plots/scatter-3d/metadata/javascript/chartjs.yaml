review:
  strengths:
  - Creative isometric-projection 3D scatter built entirely on Chart.js's canvas plugin
    system (custom axis-label plugin, floor grid, colorbar) — a genuinely distinctive
    workaround for a library with no native 3D scale.
  - Correct data mapping across three spatial axes with descriptive, unit-labeled
    axis titles and range subtext (e.g. 'Temperature (°C) 5–35').
  - Continuous 4th variable (PM2.5) correctly encoded with the Imprint imprint_seq
    sequential colormap (green→blue), consistent between light and dark renders, with
    a properly labeled colorbar.
  - Deterministic seeded LCG (no Math.random), self-contained single-file snippet
    with no external dependencies, animation disabled for clean screenshot capture.
  - Realistic, neutral air-quality sensor dataset (temperature/humidity/altitude/PM2.5)
    with plausible value ranges and correlated structure.
  - Title format and theme-adaptive chrome (background, text, grid) are correct and
    consistent across both renders.
  weaknesses:
  - The 'Temperature (°C)' axis label (axisLabels3d plugin) overlaps a data bubble
    in both light and dark renders — the label is anchored at project(11,0,0), which
    sits close to data points near the max-temperature edge of the cube. Nudge the
    label anchor further outward (e.g. project(11.8, 0, 0)) or increase the left-alignment
    offset so no bubble crosses the text.
  - 160 points render at full opacity with no alpha/transparency; the spec explicitly
    suggests 'point transparency for dense datasets to reveal internal structure'
    and the densest cluster (front-bottom of the cube) has visibly merging, indistinguishable
    bubbles. Add alpha (~0.75-0.85) to the bubble backgroundColor to reduce overplotting.
  - Canvas utilization is on the low side — the isometric cube plus labels occupy
    roughly 30-50% of the 3200×1800 canvas, leaving a large empty band above the cube
    (title down to the top axis label) and generous unused margins left/right of the
    colorbar. Consider enlarging the projection scale or tightening the layout padding
    to use more of the canvas.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-3d · javascript · chartjs · anyplot.ai" in dark ink, centered top, clearly legible. Three isometric axis spines ("Altitude (m) 0–2000" top, "Humidity (%) 20–95" bottom-left, "Temperature (°C) 5–35" bottom-right) in dark ink with a lighter sub-range label beneath each — both weights readable against the cream background. A subtle floor grid (light gray lines) sits on the temperature/humidity plane. A vertical colorbar on the right (green-to-blue gradient) is labeled "PM2.5 (µg/m³)" with min/max value labels (4 / 58), all legible.
      Data: ~160 bubbles projected isometrically, sized and colored by PM2.5 (green = low, blue = high) — the first-series color is the Imprint brand green #009E73 at the low end, transitioning to Imprint blue #4467A3 at the high end (imprint_seq). One bubble overlaps the "Temperature (°C)" label text near the right edge of the cube.
      Legibility verdict: PASS overall, with one minor defect — a data bubble partially overlaps a couple of letters in the "Temperature (°C)" axis label (still readable, not a hard fail).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis-label structure as the light render, now rendered in light ink (white/off-white) against the dark background — clearly legible, no dark-on-dark text anywhere. Floor grid lines are light gray, subtle but visible against the dark surface. Colorbar and its labels are legible in light ink.
      Data: Same bubble positions, sizes, and colors as the light render — the green→blue imprint_seq gradient is pixel-identical, confirming only chrome flipped between themes. The same "Temperature (°C)" label overlap with a data bubble is present here too (structural, not a rendering-glitch).
      Legibility verdict: PASS overall, same minor overlap defect as the light render — no dark-on-dark or light-on-light legibility failures.
