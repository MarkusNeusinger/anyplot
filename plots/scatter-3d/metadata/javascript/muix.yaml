review:
  strengths:
  - Genuine isometric 3D projection built from scratch (project(x,y,z) -> px/py) with
    a manually drawn wireframe cell (axis lines + dashed far-floor edges) via useXScale/useYScale
    hooks, giving a real sense of 3D depth that MUI X's community scatter can't provide
    natively
  - Correct 4th-variable color encoding using zAxis colorMap with imprint_seq (green
    -> blue) driven by a physically-motivated 'distance from fragment core' energy
    field, plus a genuine depth cue (near/mid/far marker sizing based on x+z) that
    together tell a believable multivariate story
  - 'Both renders are theme-correct: #FAF8F1 / #1A1A17 backgrounds, all chrome (title,
    axis labels, tick ''0'', depth mini-legend, colorbar labels) fully legible in
    both themes with no dark-on-dark or light-on-light failures'
  - Deterministic, self-contained data generation (seeded LCG + Box-Muller) for a
    plausible molecular-dynamics narrative (three atom fragments, core-to-edge potential
    energy) with sensible physical scale
  - 'Idiomatic advanced MUI X composition: ChartContainer + ScatterPlot + continuous
    zAxis colorMap + ContinuousColorLegend + ChartsTooltip with a custom valueFormatter
    reporting real x/y/z/energy values'
  - No edge clipping in either render — verified via pixel crops of the top and bottom
    canvas edges; title, axis labels, and colorbar text all sit comfortably inside
    the canvas with margin to spare
  weaknesses:
  - 'The file has a duplicated/conflicting header comment block (lines 1-10): an old
    header (''// anyplot.ai'' / spec-id line / ''Quality: 87/100'') is immediately
    followed by a second, current header (''// anyplot.ai'' / spec-id line / ''Quality:
    pending'') with the orientation directive sandwiched between them. Remove the
    stale first block so only one canonical header remains at the top of the file.'
  - The dense upper fragment cluster still shows notable marker-on-marker occlusion
    despite alpha=0.85 and depth-based sizing; a slightly lower alpha (e.g. 0.7) on
    the 'near' tier would reveal more internal structure without hurting the sparser
    floor clusters.
  - Depth tiers (near/mid/far) are computed globally across all 155 atoms combined
    (x+z tercile over the whole dataset) rather than per-fragment, so the depth cue
    is dominated by which fragment a point belongs to rather than genuine within-view
    proximity — a per-fragment or camera-relative depth metric would make the size
    cue more meaningful.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "scatter-3d · javascript · muix · anyplot.ai" centered at top; axis labels "Height (Y) · 100 nm", "Z · 100 nm", "X · 100 nm" in dark ink at the three wireframe axis ends; origin tick "0"; a top-left mini-legend "Marker size = depth" with Near/Mid/Far sample circles; a horizontal continuous color legend at the bottom labeled "-6.4 eV · core" to "-4.5 eV · edge". All text is clearly readable against the light background.
      Data: Three atom-fragment clusters rendered as an isometric cube (solid axis lines from origin, dashed far-floor edges) — one cluster near the top (high Y / "Height"), two on the floor plane (left and right). Point color runs from brand green (#009E73, low-energy "core" atoms) to blue (Imprint imprint_seq's blue stop, high-energy "edge" atoms); marker size shrinks with computed depth tier. First-glance colors match the Imprint sequential scale, not a foreign colormap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, "0" tick, depth mini-legend, and color-legend text, all re-rendered in light ink/soft-gray tones. Verified via pixel crops of the top and bottom canvas strips that no text is dark-on-dark and none is clipped at any edge.
      Data: Same three clusters, same isometric wireframe (now light-gray lines instead of dark), identical green-to-blue point colors and marker sizes as the light render — only the chrome (background, ink, grid) flipped as required.
      Legibility verdict: PASS
