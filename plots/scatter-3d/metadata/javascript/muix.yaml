review:
  strengths:
  - 'Builds a full 3D box out of the MUI X composition API: ChartsDataProvider + ChartsSurface
    with custom BoxPanes/BoxLabels layers that read the chart''s own scales through
    useXScale/useYScale, so panes, grid, labels and ScatterPlot share one coordinate
    system'
  - Fixed oblique projection with a 15° ground angle gives all three axes visible
    extent; floor and two back walls carry tick-aligned grid lines on the elevatedBg
    pane color, and the three front edges are drawn in inkSoft, which reads clearly
    as depth in both themes
  - 'Depth cue handled for a static render: points are painted far to near and sized
    by depth tertile, explained by a ''Marker size'' legend and the subtitle; markers
    at ~85 % opacity so interior points show through'
  - Optional color variable on the Imprint sequential ramp through the native zAxis
    continuous colorMap, with a ContinuousColorLegend labelled 'Potential energy (eV)'
  - All three axes labelled with units (x/y/z (nm)), axis titles rotated along their
    edges, and shared-corner tick labels de-duplicated so no label collides
  - Theme tokens threaded through every hand-drawn element (pageBg, elevatedBg, grid,
    ink, inkSoft), so both renders are fully legible; native ChartsTooltip with a
    valueFormatter that shows the original x, y, z and energy values in the HTML
  - Deterministic data from a fixed-seed Park–Miller generator; columns as role constants
    and a single data block, as the adaptable-code zones require
  weaknesses:
  - 'DQ-03 (code): atoms of each ''nanocluster fragment'' are scattered with sigma
    6–8 nm in a 100 nm cell, about 25–30x the ~0.25 nm interatomic spacing of a real
    cluster, so the spatial scale does not fit the molecular-dynamics story → keep
    the same spread in a unit that matches it (e.g. Å for a ~10 nm cell scaled to
    the same numbers, or relabel the scenario as particles/colloids in a µm-scale
    cell). Likely cause: the X/Y/Z unit ''(nm)'' with fragment sigma 6–8 in the data
    block.'
  - 'Suggestion: the color bar labels only its two ends (-6.42, -4.54); one or two
    intermediate values would make it easier to read off a marker''s energy.'
  - 'Suggestion: most markers sit in the middle of the narrow energy range and read
    as similar teal; a slightly wider energy rise with distance would make the core-to-rim
    gradient within each fragment more visible.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the three back panes of the 3D box use the slightly lighter elevated surface.
      Chrome: centered title "scatter-3d · javascript · muix · anyplot.ai" in dark ink (~26 % of the width) with a grey subtitle "n = 155 · fixed oblique view, larger markers are nearer"; oblique 3D box with floor and two back walls carrying subtle grid lines at the ticks, front edges in darker grey; y-axis 0–100 with rotated title "y (nm)", x-axis ticks 20–100 along the left-front edge with "x (nm)" rotated along it, z-axis ticks 0–80 along the right-front edge with "z (nm)". Right-hand side panel: "Potential energy (eV)" vertical color bar (-6.42 bottom to -4.54 top) and a "Marker size" legend with Far/Mid/Near circles. All text dark and clearly readable; nothing clipped or overlapping.
      Data: 155 markers in three clusters (one high and far at y≈75 with small markers, two near the floor with larger markers), colored on the Imprint sequential ramp from brand green #009E73 (low energy, cluster cores) to blue #4467A3 (higher energy, cluster rims), ~85 % opacity.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; panes on the slightly lighter elevated dark surface.
      Chrome: title and legend headings in light ink, ticks and subtitle in light grey, grid lines subtle grey, front edges lighter grey — no dark-on-dark text anywhere.
      Data: identical marker positions, sizes and ramp stops as the light render (#009E73 → #4467A3); the composite shade differs only through the 85 % alpha over the darker panes. Brand green clearly visible.
      Legibility verdict: PASS
