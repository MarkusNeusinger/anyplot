review:
  strengths:
  - Creative isometric 3D wireframe built from raw x/z/y projection, drawn via useXScale/useYScale
    hooks — a genuine workaround for MUI X community's lack of a native 3D chart type,
    matching the codebase's established biplot-pca overlay pattern
  - 'Meaningful 4th-variable color encoding: per-atom potential energy rises with
    distance from each fragment''s core, giving the ''stable core, strained periphery''
    story real data support rather than random color noise'
  - Correct Imprint sequential palette (t.seq[0] -> t.seq[1], green -> blue) for the
    continuous energy field, identical between light and dark renders, with only chrome
    flipping
  - Depth-tiered marker sizing (near/mid/far, by projected ground distance) with a
    matching mini-legend adds a pseudo-depth cue that helps the isometric view read
    as 3D
  - Deterministic LCG + Box-Muller PRNG for reproducibility since the browser has
    no seeded RNG
  - Correct title format, skipAnimation, ANYPLOT_SIZE-driven sizing, and clean edges
    — no clipped text found on either render
  weaknesses:
  - Secondary text (the 'Marker size = depth' legend, Near/Mid/Far labels, and the
    colorbar min/max labels) becomes hard to read at the ~400px mobile thumbnail scale,
    more so than the title/axis labels — consider bumping these fontSize a couple
    of points or simplifying the depth legend at small scale
  - The main data markers render fully opaque; the spec notes suggest point transparency
    for dense datasets to reveal internal structure — the upper fragment cluster has
    enough overlap that a slight fill-opacity (e.g. 0.85) on the ScatterPlot markers
    would reduce occlusion without hurting color readability
  - The title occupies only ~35% of canvas width, leaving the top of the canvas visually
    empty — not a violation, but a slightly larger title fontsize would improve top-of-canvas
    balance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "scatter-3d · javascript · muix · anyplot.ai" centered top in dark bold text; custom isometric wireframe with axis labels "Height (Y) · 100 nm", "X · 100 nm", "Z · 100 nm", and origin label "0" all in dark ink, fully visible and not clipped at any canvas edge; top-left mini-legend "Marker size = depth" with Near/Mid/Far circles in soft gray ink; bottom continuous colorbar with "-6.4 eV · core" / "-4.5 eV · edge" labels in dark ink over a teal-to-blue gradient bar.
      Data: ~155 scatter points forming three visually distinguishable fragment clusters (one elevated near the Y axis, two on the "floor" plane), colored on a green (#009E73-ish) to blue-purple continuous scale keyed to simulated potential energy, with a few visibly bluer high-energy outliers at cluster peripheries. First/core color reads brand green as required.
      Legibility verdict: PASS — all title, axis, legend, and colorbar text is clearly readable against the light background at full size; text does shrink to hard-to-read size for the small legend/colorbar labels at the 400px mobile thumbnail, but nothing is light-on-light.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, axis labels, mini-legend, and colorbar labels now rendered in light ink, clearly visible against the dark background; wireframe lines and dashed floor-grid edges remain visible at appropriate contrast.
      Data: Colors are identical to the light render — same green-to-blue continuous scale, same marker sizes and cluster layout — confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text (title, axis labels, tick-equivalent labels, legend, colorbar) is legible light-on-dark. Same mobile-thumbnail caveat as the light render applies equally (not theme-specific).
