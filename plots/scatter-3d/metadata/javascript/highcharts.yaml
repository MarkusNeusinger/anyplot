review:
  strengths:
  - Honest axonometric projection technique substitutes for Highcharts core's missing
    3D module exactly as prescribed in prompts/library/highcharts.md, rather than
    faking rotation or shelling out to another library.
  - 'Correctly builds the diverging imprint_div colormap from window.ANYPLOT_TOKENS
    with a theme-adaptive midpoint that pixel-matches the page background in both
    themes (verified #FAF8F1 light / #1A1A17 dark), and adds an inkSoft marker stroke
    so near-zero-deviation points never vanish into the surface.'
  - Depth-based marker sizing (farther sensors render smaller) gives an extra honest
    depth cue on top of the isometric projection.
  - Custom color-scale legend is hand-drawn via chart.renderer since colorAxis doesn't
    compose onto plain scatter series in core Highcharts — an idiomatic use of the
    SVG renderer rather than a hack.
  - Deterministic LCG-seeded data generation, clean imports, no external dependencies.
  - 'Both renders are theme-correct end to end: background, title, axis labels, tick
    labels, and legend text all use the correct tokens with no dark-on-dark or light-on-light
    failures.'
  weaknesses:
  - The '1.5m' height-axis tick label sits directly on top of a nearby data marker
    in both light and dark renders (confirmed by pixel crop) — nudge the tick label
    position (e.g. further left/down) or move the tick mark itself so it doesn't collide
    with the data area.
  - Title occupies only ~43% of canvas width at 19px — comfortably legible and not
    a violation, but there's headroom to size it up a point or two for stronger visual
    presence without risking overflow.
  - No visual callout marks the 'hot aisle' cluster (Row B) that the data was deliberately
    built to demonstrate — a subtle annotation or label would sharpen the data-storytelling
    focal point.
  - Relies on several helper functions (LCG, gaussian, project, color interpolation)
    for the projection math — necessary given the custom 3D emulation, but further
    from the plain Imports→Data→Plot→Save KISS shape than a simpler chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, confirmed pixel-exact #FAF8F1.
      Chrome: Bold dark title "Data Center Thermal Sensors · scatter-3d · javascript · highcharts · anyplot.ai" fully visible near the top with comfortable margin (no clipping). Axis direction labels "Aisle position (m) →", "← Row depth (m)", "↑ Rack height (m)" and height-axis tick labels "0m", "1.5m", "3m" all render in dark ink, clearly legible. A hand-drawn diverging color-scale legend ("Δ Temp vs. 22°C setpoint", -4°C to +4°C) sits top-right with readable labels. One issue: the "1.5m" tick label overlaps a nearby data marker.
      Data: ~140 circular sensor points arranged via an isometric floor-grid projection into three visible clusters, colored on a red–white–blue diverging scale (imprint_div) for temperature deviation, with a thin ink-soft stroke keeping near-zero (white) points visible against the background. Farther points render smaller for a depth cue.
      Legibility verdict: PASS (all chrome and data readable; only flaw is the tick/marker overlap noted above, which does not block readability).

    Dark render (plot-dark.png):
      Background: Warm near-black, confirmed pixel-exact #1A1A17.
      Chrome: Title and axis labels render in light ink, fully legible against the dark surface; no dark-on-dark failures found anywhere (title, direction labels, tick labels, and legend text all switch correctly). The color-scale legend's white midpoint correctly darkens in this theme (pixel-sampled at #1A1A17, matching the page background exactly per the diverging-colormap spec) while the red and blue ends stay identical to the light render.
      Data: Same ~140 points in the same screen positions with byte-identical colors to the light render (only chrome flipped, as required) — confirmed the data-color stops (#AE3030 / #4467A3) are unchanged between themes.
      Legibility verdict: PASS (same "1.5m" tick/marker overlap as light, but text remains readable — no dark-on-dark issue).
