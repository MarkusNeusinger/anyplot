review:
  strengths:
  - Clever, well-documented axonometric-projection workaround for a genuine 3D scatter
    given Highcharts core has no 3D module; z-depth is conveyed convincingly via marker-size
    falloff for farther points.
  - Hand-rolled diverging color interpolation plus a custom-drawn gradient legend
    correctly reuses the Imprint `t.div` stops, working around the fact that core
    `scatter` doesn't compose `colorAxis`.
  - Clear, descriptive axis-direction labels ("Aisle position (m) →", "← Row depth
    (m)", "↑ Rack height (m)") orient the viewer despite the native axes being hidden.
  - Deterministic LCG-seeded data with three realistic clusters — including a visibly
    hotter "Row B" aisle — tells a coherent data-center thermal story.
  - 'Both themes render correctly: identical data colors between light/dark, correct
    background tokens, and all chrome remains readable in both.'
  weaknesses:
  - The "3D" effect is a static isometric projection with no scale/ticks on the rack-height
    axis — it's just a bare vertical line, so viewers can't read absolute height values,
    weakening the 3D-orientation goal called out in the spec.
  - Sensor markers render as squares, an unintended side-effect of Highcharts' default
    per-series-index symbol cycling (the sensor series happens to land on index 2
    of the symbol set) rather than an explicit choice — a plain circle would read
    more conventionally as a scatter point.
  - The custom legend's right-edge label ("+4°C") sits very close to the canvas edge
    (chart.chartWidth - barWidth - 40) — no clipping observed, but there is little
    safety margin.
  - Heavy helper-function decomposition (projection math, color interpolation, custom
    legend renderer) departs from the flat-script KISS style; understandable given
    the workaround's complexity but worth noting.
  - No point-transparency/alpha is applied despite the spec's suggestion for dense
    datasets — with 140 points overlapping in places, slight alpha blending would
    help reveal internal structure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correctly not pure white.
      Chrome: Dark bold title "Data Center Thermal Sensors · scatter-3d · javascript · highcharts · anyplot.ai" reads clearly at top; the diagonal floor wireframe grid is a subtle light gray; the three axis-direction labels ("Aisle position (m) →", "← Row depth (m)", "↑ Rack height (m)") are gray (inkSoft) and clearly legible; the hand-drawn Δ-Temp gradient legend (top right) has readable dark labels and a red-white-blue gradient bar with "-4°C"/"+4°C" endpoints.
      Data: ~140 square markers colored on a red (cold) to white to blue (warm) diverging scale, matching the "Δ Temp vs. 22°C setpoint" legend; markers nearer the viewer (larger, lower-z) are visibly bigger than farther ones, giving a real depth cue; near-white points keep a thin gray stroke so they don't vanish into the background.
      Legibility verdict: PASS — all title, axis-label, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correctly not pure black.
      Chrome: Title renders in white/light text, fully legible; floor wireframe grid switches to a dim gray line still visible against the dark surface; axis-direction labels remain legible in light gray; the Δ-Temp legend text and gradient bar are unchanged in position and equally readable, with light-colored numeric labels.
      Data: The sensor marker colors and sizes are visually identical to the light render (same red/white/blue diverging mapping and same size-by-depth pattern) — only the chrome (background, grid, text colors) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, legend, tick-like annotations) stays clearly visible against the near-black background.
