review:
  strengths:
  - Custom axonometric 3D-to-2D projection (yaw/pitch rotation matrix) built from
    scratch, since D3 has no native 3D scene graph — a genuinely distinctive, library-specific
    technique
  - 'New focal-point emphasis: the Champions cluster is kept at full size/opacity
    while the two background segments are intentionally de-emphasized, giving the
    composition clear visual hierarchy (addresses the prior ''no focal point'' weakness)'
  - Legend redesigned as a boxed, elevated-bg card placed near the data mass instead
    of an isolated far-margin element (addresses the prior 'isolated legend' weakness)
  - Tick labels now offset perpendicular to each axis, pointing away from the shared
    tripod origin, fixing the previous '$200' tick crowding the axis line/title
  - Realistic, neutral RFM (Recency/Frequency/Monetary) customer-segmentation scenario
    with three visually distinct, well-separated clusters
  - Palette compliant and theme-correct in both renders; all axis labels carry units
  - Deterministic seeded RNG (mulberry32), clean idiomatic D3 throughout
  weaknesses:
  - 'Canvas utilization: tightening the margins and moving the legend inward helped,
    but the region between the tripod''s shared origin and the Champions cluster is
    still comparatively empty — repositioning the camera yaw/pitch (not just margins)
    would balance the three clusters across the frame more evenly'
  - Tick dot styling remains fairly plain — consider scaling tick-dot radius by depth
    (matching the marker depth-cueing) for a touch more polish
  - Design excellence is strong but not yet publication-tier (DE-01); a bespoke color/opacity
    treatment for the axis tripod itself (e.g. subtle gradient or thickness cueing)
    could push it further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Customer Segments in 3D Feature Space · scatter-3d · javascript · d3 · anyplot.ai" in bold dark ink, centered near the top, fully visible and not clipped. Three bold dark axis-title labels ("Frequency (orders/yr)", "Monetary ($ avg order)", "Recency (days)") sit at the far end of their respective projected axis edges, now offset perpendicular to the axis so they clear the last tick label. Soft dark-grey tick labels ($50/$100/$150/$200, 50/100/150, 5/10/15/20/25) run along the three axis lines, each offset perpendicular and away from the shared tripod origin — the previous "$200" tick crowding the axis line/title is resolved. A boxed legend (rounded rect, elevated-bg fill, subtle border) sits inside the plot's own upper-mid-right region, close to the Champions cluster, listing Champions/At Risk/New Customers with colored dots.
      Data: Three clearly separated clusters — a dense green (Champions) cluster upper-left rendered at full size/opacity (the new focal-point emphasis), a blue-grey (New Customers) cluster near the axis origin and a lavender (At Risk) cluster along the bottom-right, both slightly smaller/lower-opacity than Champions per the 0.82x de-emphasis weighting. Markers have a subtle light stroke and vary in size/opacity by projected depth (painter's-algorithm ordering).
      Legibility verdict: PASS — all title, axis-title, tick-label, and legend text is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis-title, tick-label, and legend text, all rendered in light ink/off-white tones against the dark background. Axis lines and tick dots are light-colored and clearly visible against the dark surface. Legend box uses the dark-theme elevated background with a visible border.
      Data: Identical cluster layout and identical marker colors (green / lavender / blue-grey) to the light render, including the same focal-point emphasis on the Champions cluster — only the chrome (background, text, axis lines, legend box) flipped to the dark theme; data-color identity is preserved exactly.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis titles, tick labels, legend) is clearly legible against the near-black background.
