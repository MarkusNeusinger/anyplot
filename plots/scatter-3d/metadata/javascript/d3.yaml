review:
  strengths:
  - Custom axonometric 3D-to-2D projection (yaw/pitch rotation matrix) built from
    scratch in D3, since D3 has no native 3D scene graph — a genuinely distinctive,
    library-specific technique
  - Painter's-algorithm depth sorting plus depth-driven radius and opacity scales
    give a convincing sense of 3D depth on a flat SVG canvas
  - All three 3D axes are drawn as edges from a shared corner with their own tick
    marks and labels, correctly oriented in projected space
  - Realistic, neutral RFM (Recency/Frequency/Monetary) customer-segmentation scenario
    with three visually distinct, well-separated clusters that clearly demonstrate
    the 'find clusters in 3D feature space' use case from the spec
  - First categorical series is the mandated Imprint brand green (#009E73), remaining
    two segments follow canonical Imprint order, and colors are identical between
    light and dark renders
  - Axis labels are descriptive and carry units ('Recency (days)', 'Frequency (orders/yr)',
    'Monetary ($ avg order)')
  - Deterministic seeded RNG (mulberry32) with no external dependencies, clean idiomatic
    D3 (scaleLinear, scaleOrdinal, extent, data-join) throughout
  - Both renders are fully theme-correct — warm off-white / warm near-black backgrounds,
    all chrome text readable in both themes, no dark-on-dark or light-on-light failures
  weaknesses:
  - 'Canvas utilization is uneven: the true center of the canvas (between the origin
    and the Champions cluster) is largely empty, giving the composition a lopsided,
    sparse feel despite the bounding box spanning most of the frame — consider tightening
    margins or repositioning the camera angle (yaw/pitch) so the three clusters balance
    the frame more evenly'
  - The '$200' tick label on the Monetary axis sits very close to / slightly crosses
    the axis line near the 'Monetary ($ avg order)' axis title in the bottom-left
    corner — nudge the tick label offset outward so it clears the axis line and the
    axis title with more breathing room
  - 'Design excellence is solid but not yet publication-tier: the axis tick dots and
    thin lines are functional but plain — consider subtler tick styling (e.g. smaller
    dot radius or tick length) and a touch more visual hierarchy (e.g. de-emphasizing
    the two background segments slightly) to push the Champions cluster forward as
    the focal point'
  - Legend sits isolated in the empty upper-right quadrant, fairly far from the nearest
    data (the Champions cluster) — consider moving it closer to the data mass or adding
    a subtle connecting frame
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Customer Segments in 3D Feature Space · scatter-3d · javascript · d3 · anyplot.ai" in bold dark ink, centered near the top, fully visible and not clipped. Three bold dark axis-title labels ("Frequency (orders/yr)", "Monetary ($ avg order)", "Recency (days)") sit at the far end of their respective projected axis edges. Soft dark-grey tick labels ($50/$100/$150/$200, 50/100/150, 5/10/15/20/25) run along the three axis lines. Legend in the upper-right shows three colored dot + label rows (Champions / At Risk / New Customers), fully inside the canvas with margin to spare.
      Data: Three clearly separated point clusters — a dense green (Champions) cluster upper-left, a blue-grey (New Customers) cluster near the axis origin, and a lavender (At Risk) cluster stretching along the bottom-right. Markers have a subtle light stroke and vary slightly in size/opacity by projected depth (painter's-algorithm ordering, far points smaller/more transparent, near points larger/more opaque).
      Legibility verdict: PASS — all title, axis-title, tick-label, and legend text is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis-title, tick-label, and legend text, all rendered in light ink/off-white tones against the dark background. Axis lines and tick dots are light-colored and clearly visible against the dark surface.
      Data: Identical cluster layout and identical marker colors (green / lavender / blue-grey) to the light render — only the chrome (background, text, axis lines) flipped to the dark theme; the data-color identity is preserved exactly.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis titles, tick labels, legend) is clearly legible against the near-black background.
