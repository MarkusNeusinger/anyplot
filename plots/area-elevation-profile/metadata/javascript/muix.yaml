review:
  strengths:
  - Composes a custom SVG layer into the LineChart with useXScale/useYScale/useDrawingArea,
    so every landmark line, dot and label is placed in data coordinates and each vertical
    marker meets the profile at its landmark's elevation
  - The vertical exaggeration (≈9×) is computed from the real pixel-per-unit ratio
    of both axes rather than typed in, and noted on the plot
  - Start and end labels are lifted above the highest stretch of profile they span
    and joined to their end points with leaders, so the profile never crosses a label
  - 'Native area series with baseline: ''min'' fills the silhouette to the bottom
    of the plot; theme tokens make chrome correct in both renders with identical #009E73
    data color'
  - 'Data block follows the adaptable-code zones: role constants, records, and limits/units
    derived from the data and column names'
  weaknesses:
  - 'DQ-02 (both): real Tour du Mont Blanc place names carry invented distances —
    Col de la Seigne sits at km 15 and Courmayeur at km 40, while the real route from
    Les Houches passes Les Contamines, Col du Bonhomme and Les Chapieux and reaches
    Col de la Seigne at roughly km 45 and Courmayeur at roughly km 60 → use waypoint
    distances and intermediate cols/valleys that match the named route, or a compact
    transect whose distances match its names. Likely cause: the waypoints array compressing
    the stage.'
  - 'Suggestion: the 22-waypoint linear interpolation draws long straight segments;
    finer waypoints (or the real intermediate cols and valleys) would give the terrain
    a more natural relief.'
  - 'Suggestion: the spec''s example names 6–8 landmarks; adding huts or valley towns
    along the route would make fuller use of the landmark annotation layer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold near-black title "area-elevation-profile · javascript · muix · anyplot.ai" top-left with a soft subtitle "Les Houches → Courmayeur · 40 km transect · 81 samples · 3 landmarks"; y-axis "Elevation (m)" with ticks 800–2,800, x-axis "Distance (km)" with ticks 0–40; subtle horizontal grid; "Vertical exaggeration ≈ 9×" bottom right. All readable.
      Data: #009E73 profile line with a translucent green fill down to the plot bottom; two passes (2,516 m and 2,435 m) with a saddle near 1,970 m, long descent to Courmayeur. Dashed vertical markers with green dots for Col de Voza (1,653 m), Col de la Seigne (2,516 m), Col du Mont Favre (2,435 m), labels in a headroom band at the top; Les Houches (1,010 m) and Courmayeur (1,224 m) labeled at their ends with short leaders.
      Legibility verdict: PASS

