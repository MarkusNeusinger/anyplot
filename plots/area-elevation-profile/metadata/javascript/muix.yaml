review:
  strengths:
  - Composes the annotation layer as a child of LineChart and places every label,
    marker line and dot in data coordinates through useXScale, useYScale and useDrawingArea,
    the MUI X composition idiom
  - The vertical exaggeration note is computed from the drawing area's real px-per-metre
    ratio (≈14×) instead of being typed, so it stays correct when the data or canvas
    changes
  - Every landmark has a dashed vertical marker that meets the profile exactly at
    a dot on its elevation, with a bold name over a secondary-ink elevation value,
    staggered onto two rows when landmarks lie close together
  - Start and end labels sit at their own ends of the profile, lifted above the highest
    stretch of line they span and tied back to the end points by short leaders, so
    the profile never runs through them
  - Area fill with baseline "min" fills the silhouette down to the bottom of the plot
    in brand green at 35% opacity; chrome flips cleanly between the two themes while
    the data colors stay identical
  - 'Realistic, neutral data: the Tour du Mont Blanc stages 1–3 from Les Houches (1,010
    m) to Courmayeur (1,224 m) over 60 km, with correct pass elevations (Col de Voza
    1,653 m, Col de la Seigne 2,516 m)'
  - Native MUI X tooltip on the line series gives distance and elevation on hover
    in the HTML output
  weaknesses:
  - 'Suggestion: the profile''s highest point (2,479 m at km 29, Col de la Croix du
    Bonhomme) is unlabeled while the lower Col du Bonhomme on its shoulder is; labelling
    the true high point would give the climb a clear focal point.'
  - 'Suggestion: horizontal grid lines run through the ''Les Contamines'' and ''Courmayeur''
    label blocks; a small page-colored halo behind label text would keep them crisp.'
  - 'Suggestion: the profile is linearly interpolated between about 30 waypoints,
    so the terrain reads as straight facets; a little deterministic small-scale relief
    would look more like a sampled DEM.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: title "area-elevation-profile · javascript · muix · anyplot.ai" in dark ink at the top left, with a secondary-ink subtitle "Les Houches → Courmayeur · 60 km transect · 121 samples · 6 landmarks". Axis titles "Distance (km)" and "Elevation (m)", ticks 0–60 every 5 km and 800–2,800 m every 200 m, subtle horizontal grid, left and bottom axis lines only. "Vertical exaggeration ≈ 14×" sits in the bottom-right corner of the x-axis band. All text reads dark on light.
      Data: one brand-green (#009E73) profile line at 2.5 px with a translucent green fill down to the bottom of the plot. Six landmarks (Col de Voza, Les Contamines, Col du Bonhomme, Les Chapieux, Col de la Seigne, Arête du Mont Favre) have dashed vertical markers from staggered two-row labels (bold name over the elevation value) down to green dots on the profile. Les Houches (1,010 m) is labelled at the left end and Courmayeur (1,224 m) at the right, each with a short dashed leader to its end dot.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles, ticks, the exaggeration note and all landmark labels render in light ink; dashed markers in light secondary ink; grid subtle but visible. No dark-on-dark text anywhere.
      Data: the same #009E73 line, dots and fill as in the light render (the fill reads as dark teal because of its translucency over the dark page); only the chrome flips.
      Legibility verdict: PASS
