review:
  strengths:
  - 'Correct P-P construction: values sorted, empirical plotting positions i/(n+1)
    paired with the normal CDF (A&S 26.2.17) evaluated at the same value with the
    sample''s mean and sd, every point at its computed position'
  - Square plot area with both axes fixed to 0–1 and identical 0.1 tick steps, so
    the dashed corner-to-corner diagonal keeps its 45° meaning
  - 'Mildly right-skewed log-normal lead times produce the expected finding: points
    below the diagonal in the lower tail, above it through the middle, closing in
    on both corners'
  - Native MUI X v9 composition (ChartsDataProvider + ChartsWrapper + ChartsSurface)
    layering LinePlot and ScatterPlot on shared axes, with data-series sx selectors
    styling the diagonal and a legend sample that repeats its dash
  - Theme tokens threaded through every chrome element; markers carry a thin page-colored
    outline that separates the dense runs in both themes
  - Library-native tooltips and hover in the HTML output; skipAnimation set
  weaknesses:
  - 'Suggestion: the subtitle''s mean and sd could move into the x-axis title ("fitted
    normal, μ = 4.16, σ = 1.43 days") to keep the header to one line.'
  - 'Suggestion: an optional faint pointwise confidence envelope (the Notes allow
    it) would show which departures in the middle exceed sampling noise.'
