review:
  strengths:
  - 'Correct P-P construction: sorted sample, plotting positions i/(n+1) on y, fitted-normal
    CDF (sample mean and sd) at the same value on x; every point at its computed values'
  - Square plot area with both axes fixed to 0-1 and identical 0.1 ticks, so the dashed
    corner-to-corner diagonal keeps its 45-degree meaning
  - Composes a line series and a scatter series in one ChartsDataProvider with LinePlot
    + ScatterPlot, styled per series through v9 data-series selectors
  - Theme tokens threaded through every chrome element; both renders read cleanly
    and the data colour is identical across themes
  - Mildly right-skewed log-normal lead times give the expected bow above the diagonal
    with both ends closing in on the corners
  weaknesses:
  - 'VQ-03 (both): the legend''s "Perfect fit (y = x)" sample is a short solid line
    while the diagonal it explains is dashed (9 6) → draw the legend sample dashed
    like the line. Likely cause: strokeDasharray is set only on .MuiLineChart-line[data-series=''diagonal'']
    in the ChartsSurface sx, never on the legend mark in ChartsLegend sx.'
  - 'Suggestion: a slightly heavier diagonal (about 2.5 px) would hold up better in
    the 400 px thumbnail against 200 green points.'
