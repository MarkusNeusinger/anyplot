review:
  strengths:
  - 'Textbook P-P construction: sorted observations, empirical CDF at i/(n+1), theoretical
    CDF from the fitted normal (mean and population SD) — one point per observation
    at its computed values, on a 0–1 square with coord_fixed(ratio=1)'
  - Dashed neutral-ink 45° reference line runs corner to corner and flips with the
    theme (near-black on light, near-white on dark), clearly distinct from the green
    points
  - 'Optional confidence envelope is drawn as the Notes allow: a faint muted-anchor
    ribbon (alpha 0.18) that sits behind the points and never competes with them'
  - 'Single-series #009E73 fill with a theme-adaptive INK_SOFT outline and alpha 0.75
    keeps the 200 markers separable where they bunch along the diagonal, in both themes'
  - 'Correct lets-plot handling of the fixed aspect: the one-panel gggrid with the
    page color paints the whole 2400×2400 canvas, so no transparent or white strips'
  - lets-plot-native layer_tooltips give each point its weight and empirical CDF in
    the HTML view, and the ribbon its name
  - 'Adaptable structure: column constants with role comments, one Data block ending
    in df, plot code that derives n, the theoretical-axis label and the band from
    df'
  weaknesses:
  - 'SC-04 (both): the grey 95% Kolmogorov band has no key or direct label in the
    PNG — its meaning appears only in the HTML tooltip, so a reader of the static
    render cannot tell what the shaded region is → name it where the reader sees it,
    for example in the subtitle ("shaded: 95% Kolmogorov band"). Likely cause: the
    band''s name lives only in layer_tooltips().line("95% Kolmogorov band").'
  - 'Suggestion: lines 55–56 could use scipy.stats.norm.cdf(pp[OBSERVED], mu, sigma)
    in place of np.vectorize(erf) on hand-built z-scores; the result is identical.'
  - 'Suggestion: the comment on line 58 calls the band pointwise, but 1.36/√n is the
    simultaneous Kolmogorov–Smirnov band; the unused ELEVATED_BG token could also
    go.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400×2400 square canvas — no white or transparent strips.
      Chrome: bold near-black title "pp-basic · python · letsplot · anyplot.ai" top-left, grey subtitle "Tablet weights vs. fitted normal reference (n=200)". Axis titles "Theoretical CDF (Normal)" (x) and "Empirical CDF" (y) in dark ink, tick labels 0, 0.2 … 1 in dark grey on both axes. Subtle light-grey major grid on both axes, no minor grid. All text readable.
      Data: 200 circles in brand green #009E73 (alpha 0.75) with a dark-grey outline, hugging a dashed near-black diagonal from (0,0) to (1,1). A faint grey ribbon (95% Kolmogorov band, ±0.096) runs around the diagonal and is clipped to the unit square at the corners. Points bow slightly above the diagonal around 0.6–0.75 and below it around 0.3–0.45 and 0.9 — a mild S-shape from the overfill skew — while both ends close in on the corners.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title in near-white, subtitle, axis titles and tick labels in light grey — all clearly readable; grid lines are subtle dark grey. No dark-on-dark text.
      Data: identical #009E73 point fill as in the light render; the point outline flips to light grey, the dashed diagonal flips to near-white, and the band is a lighter-grey translucent ribbon. Brand green reads well on the dark surface.
      Legibility verdict: PASS
