review:
  strengths:
  - Data comes from the exact charge balance [H+] − [OH−] = excess acid with Kw =
    1e-14, so pH 1.00 at 0 mL, the 3.30 → 10.70 jump across 24.75–25.25 mL and pH
    12.52 at 50 mL all come out of the computation and are not placed by hand
  - The equivalence point is located as the maximum of the central-difference dpH/dV,
    and the native ChartsReferenceLine draws the dashed line and its label at exactly
    that reading (25.00 mL, pH 7.00), passing through the steepest part of the curve
  - 'Dual y axes in idiomatic MUI X v9: the series bind through yAxisId, the right
    axis takes position: ''right'' with its own label ''dpH/dV (per mL)'' and 25 %
    headroom above the spike, and the y axis spans the full 0–14 pH scale'
  - 'The derivative is visually subordinate: a 2 px lavender line with a 0.15-opacity
    area fill under the 3.5 px brand-green pH curve, styled through the v9 data-series
    selectors'
  - Theme tokens are threaded through every chrome element (title, subtitle, axis
    and tick labels, grid, reference line), so both renders read cleanly; the HTML
    output keeps MUI X's native hover tooltip
  weaknesses:
  - 'Suggestion: end the right axis on a round tick (for example 20) so its top meets
    the frame like the left pH axis does, instead of stopping at the unlabelled 18.5'
  - 'Suggestion: the 22 px title fills about 30 % of the width; a slightly larger
    title would give the header more presence over the subtitle'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 cream across the whole canvas, not pure white.
      Chrome: bold dark title "titration-curve · javascript · muix · anyplot.ai" top left, with a soft-ink subtitle "201 readings, 0–50 mL of titrant · equivalence at the dpH/dV maximum" below it; left axis "pH" with ticks 0–14 in steps of 2; x axis "Volume of NaOH added (mL)" with ticks 0–50 in steps of 5; right axis "dpH/dV (per mL)" with ticks 0–18; subtle horizontal grid; legend (pH, dpH/dV (per mL)) at top right. All text is dark on cream and readable.
      Data: brand-green #009E73 pH curve rises gently from pH 1.0 to about 3.3, jumps almost vertically at 25 mL, then flattens toward 12.5 at 50 mL. A lavender #C475FD derivative line with a faint fill is flat near 0 and spikes to about 14.8 at 25 mL. A dark dashed vertical line at 25 mL carries the label "Equivalence point · 25.00 mL, pH 7.00" in clear space near the top.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles, tick labels, legend and reference-line label all flip to light ink and are clearly readable. No dark-on-dark text. The grid lines are subtle but visible, and the dashed equivalence line is light grey.
      Data: the same #009E73 green pH curve and #C475FD lavender derivative as in the light render, identical in position and color; only the derivative's translucent fill reads darker over the dark page.
      Legibility verdict: PASS
