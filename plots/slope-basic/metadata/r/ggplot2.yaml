review:
  strengths:
  - Non-overlapping layout achieved through thoughtfully constructed Q1/Q4 values
    so every one of the 8 entities lands on its own row on both sides — a genuinely
    elegant solution to the classic slope-chart label-collision problem.
  - 'Correct Imprint palette usage: brand green #009E73 for ''Increased'' and the
    semantic-anchor red #AE3030 for ''Decreased'', identical between light and dark
    renders — only chrome (background, ink, legend frame) flips as required.'
  - 'Idiomatic tidyverse data prep: pivot_longer for the wide-to-long reshape, scales::dollar()
    for currency-formatted endpoint labels, clean dplyr::mutate pipeline.'
  - 'Minimal, purposeful chrome: gridlines and y-axis ticks removed since the value
    labels carry the numeric information directly, x-axis time points (''Q1 2024''
    / ''Q4 2024'') clearly labeled in bold.'
  - Legend and endpoint labels both correctly themed and legible in both light and
    dark renders with no clipping at any canvas edge.
  weaknesses:
  - Direction is encoded via a red/green hue distinction (Increased vs Decreased)
    which is not fully colorblind-safe on its own; it is mitigated here by the adjoining
    numeric value labels, but a secondary channel (e.g. dashed vs solid line, or a
    small up/down glyph) would make it robust without relying on the reader comparing
    numbers.
  - The non-overlapping layout depends on hand-picked Q1/Q4 values rather than a general-purpose
    collision-avoidance technique (e.g. ggrepel::geom_text_repel); real-world data
    with closer values would likely produce overlapping labels.
  - Title occupies roughly 35% of the plot width, below the ~50-70% guideline range
    — a small headroom for slightly larger plot.title sizing to strengthen visual
    hierarchy (minor polish, not a hard requirement).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "slope-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly readable. X-axis category labels "Q1 2024" and "Q4 2024" in bold dark text below the two label columns. No y-axis ticks/gridlines (intentionally removed — value labels carry the numeric information directly). Legend "Change" with "Increased"/"Decreased" swatches sits in a bordered box below the plot, text in soft ink, fully legible.
      Data: 8 entities connected by slope lines. 6 lines/points/labels in brand green (#009E73) for "Increased", 2 in matte red (#AE3033~#AE3030) for "Decreased" (Summit Pack, Peak Headlamp). Entity name + dollar value labels sit at both endpoints of each line, colored to match their line's direction, with no overlaps between rows.
      Legibility verdict: PASS — all text (title, axis labels, endpoint labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title now in light ink, clearly visible. "Q1 2024" / "Q4 2024" axis labels in bold white text. Legend box border and text switch to the dark-theme ink tokens, still fully legible.
      Data: Same green (#009E73) and red (#AE3030) values and line positions as the light render — confirmed identical data colors, only chrome (background, ink, legend frame) flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and endpoint-label text is clearly visible against the near-black background.
