review:
  strengths:
  - 'Correct slopegraph structure: two vertical time-point axes labeled "2023 Survey"/"2024
    Survey" with endpoint labels on both sides, exactly per spec notes'
  - Semantic red/green color-coding for decrease/increase follows the Imprint style
    guide's finance semantic-exception rule (profit/up/gain→green, loss/down→red),
    and is identical across both themes
  - Custom label anti-collision (min_gap nudging loop) keeps all 20 endpoint labels
    legible even where raw scores cluster tightly
  - Entities sorted by descending 2023 score, giving the chart a clear top-to-bottom
    rank ordering that aids scanning
  - 'Clean minimalist chrome: spines and default decorations fully hidden, no gridlines,
    generous whitespace, subtle bold survey-year headers'
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT tokens —
    both renders pass the light/dark legibility check
  - 'Idiomatic Makie usage: GridLayout-based legend placement (fig[1,2] + colsize!)
    with merge=true/unique=true, hidedecorations!/hidespines!, deterministic Random.seed!(42)'
  weaknesses:
  - No label anywhere on the chart indicates what the numeric values represent (e.g.
    "Customer Satisfaction Score (0–100)") — the survey-year headers label the x-axis
    but the y-values are unitless raw numbers to the viewer; add a small subtitle
    or axis caption near the vertical axes
  - In the densest score bands (e.g. Cloud Storage 54.1 vs Payment Gateway 53.8; Video
    Conferencing 61.7 vs Customer Portal 61.0), the anti-collision nudge pushes label
    text noticeably away from its true marker/line position with no leader stub connecting
    them, making it harder to trace which label belongs to which line exactly where
    it matters most
  - Decrease/Increase is communicated only through red vs green in the legend; while
    the line's up/down slope is redundant geometric information, a small directional
    glyph (▲/▼) next to each value would make the encoding fully CVD-robust without
    relying on the legend at all
  - Legend column on the right carries a lot of unused vertical whitespace around
    just two entries — tightening the column or nudging the legend toward the chart's
    vertical center of mass would improve canvas balance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "slope-basic · julia · makie · anyplot.ai" is bold, dark ink, centered at top, fully visible with no clipping. "2023 Survey" / "2024 Survey" headers sit atop each vertical reference axis in medium-gray bold text. Ten product names + scores flank both axes in dark ink text. Legend ("Decrease" / "Increase") sits in a dedicated right-hand column, readable dark text on the light background.
      Data: Ten diagonal lines connect 2023 to 2024 scores, colored matte red (#AE3030, decrease) or brand green (#009E73, increase), with small circular markers (white/cream stroke) at each endpoint.
      Legibility verdict: PASS — all title, header, label, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, headers, and per-entity labels now rendered in light ink (#F0EFE8 title / #B8B7B0 headers), clearly legible against the dark surface. Legend text also flips to light ink.
      Data: Same red (#AE3030) and green (#009E73) line/marker colors as the light render — confirmed identical data colors between themes, only chrome (background + text) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text (title, headers, entity labels, legend) reads clearly against the near-black background. Brand green and matte red both remain clearly visible on the dark surface.
