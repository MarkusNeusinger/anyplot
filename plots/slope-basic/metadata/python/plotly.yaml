review:
  strengths:
  - Direct at-a-glance value labels at both endpoints for every entity, connected
    to their true data point via a thin leader line, decluttered vertically so labels
    never overlap each other
  - 'Data-driven visual emphasis: line width and marker size scale with each sector''s
    percentage change magnitude, drawing the eye to the biggest movers (Automotive''s
    decline, Machinery''s rise) without decorative chartjunk'
  - 'Correct semantic color mapping (brand green #009E73 for gains, matte-red Imprint
    anchor #AE3030 for losses) matching the style guide''s finance gain/loss exception,
    with a code comment documenting the rationale'
  - Theme-adaptive chrome (background, ink, grid) correctly threaded through both
    renders; palette data colors identical across light and dark
  - Rich hovertemplate for the interactive HTML export exposing exact sector/year
    values, a genuine plotly-specific interactivity win
  weaknesses:
  - 'Label/axis-spine overlap: the two longest left-side entity labels, ''Food Processing:
    $275M'' and ''Pharmaceuticals: $190M'', are visually cut through by the y-axis
    spine line in BOTH light and dark renders. Pixel check on plot-light.png: leftmost
    text pixel of ''Food Processing'' starts at x=464 while the y-axis spine sits
    at x=556-559 (3200px-wide render) - the fixed `ax=-0.12` annotation anchor doesn''t
    scale with label string length, so the two longest labels overflow past the xaxis
    range''s left bound (-0.5) and the spine draws directly over the letters. Fix:
    scale the `ax` offset (or the xaxis range''s left bound / left margin) by the
    longest label''s character count so no label text ever crosses the spine.'
  - 'CQ-01 KISS structure: a custom `declutter()` helper function is defined mid-script
    for anti-overlap label placement; it is short and purposeful, but the code-quality
    rubric expects a flat imports -> data -> plot -> save script with no functions/classes.'
  - No explicit key/caption stating that green = increase and red = decrease; the
    mapping is inferable from slope direction and the numeric labels at both ends,
    but an explicit note would remove any ambiguity for a first-time viewer.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "Manufacturing Output by Sector · slope-basic · python · plotly · anyplot.ai" is dark ink, centered, ~70% of plot width, fully readable. Y-axis title "Output ($M)" rotated, dark ink, readable. X-axis ticks "2023"/"2024" in soft ink, readable. Y-axis numeric ticks (50-350) readable. Ten entity labels (e.g. "Automotive: $320M", "$310M: Electronics") flank the plot on left (2023 values) and right (2024 values), colored to match their line (green = increase, matte red = decrease).
      Data: Ten slope lines connecting 2023 -> 2024 output values per sector. First-glance colors are Imprint brand green (#009E73, 6 increasing sectors) and Imprint matte red (#AE3030, 4 declining sectors) - correct semantic gain/loss mapping. Line width and marker size scale with % change magnitude (e.g. Machinery's steep rise and Automotive's steep drop get visibly thicker lines/larger markers than smaller moves like Chemicals).
      Legibility verdict: FAIL (partial) - all text is high-contrast and readable in isolation, but the y-axis spine line visibly cuts through the "Food Processing: $275M" and "Pharmaceuticals: $190M" labels (confirmed via pixel crop: label text starts at x=464, spine sits at x=556-559 on the 3200px-wide render), because those two labels are longer than the fixed annotation anchor accounts for.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, now in light ink (#F0EFE8), fully readable against the dark surface. Axis ticks and "Output ($M)" label rendered in light ink tones, readable. Gridlines subtle and visible without competing with data. No dark-on-dark failures observed elsewhere.
      Data: Identical brand green (#009E73) and matte red (#AE3030) data colors to the light render, confirming only chrome flips between themes - data colors unchanged as required.
      Legibility verdict: FAIL (partial) - same spine-through-label defect reproduces identically in the dark render ("Food Processing" and "Pharmaceuticals" labels cut by the axis spine at the same pixel coordinates); every other text element is clearly readable in light-on-dark contrast, with no dark-on-dark failures.
