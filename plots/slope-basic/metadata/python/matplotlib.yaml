review:
  strengths:
  - Custom label-collision-avoidance algorithm (min_gap nudging) with dotted stub
    connectors back to the true data point — a genuinely sophisticated touch rarely
    seen in a first-attempt slopegraph
  - Path-effect halo strokes (patheffects.withStroke) keep bold colored labels legible
    over the axvline reference lines and grid without needing a background box
  - Semantic red/green color coding (Increase/Decrease) correctly follows the style
    guide's finance profit/loss exception, and is redundantly encoded via slope direction
    so it never relies on hue alone
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, correct ink tokens on text, ticks, grid, and legend frame, with the
    Imprint data colors held identical across themes'
  - Clean use of blended_transform_factory to place labels a fixed axes-fraction outside
    the columns regardless of the y-data range, decoupling label layout from data
    scale
  - FuncFormatter gives self-documenting '$XM' y-axis ticks, and only the left spine
    is kept, producing an unusually refined, uncluttered frame
  weaknesses:
  - Legend is anchored above the title (bbox_to_anchor y=1.14 sits higher than the
    title's default position), inverting the intended typographic hierarchy where
    the title should be the first, most prominent element a reader sees
  - Data storytelling relies solely on the increase/decrease color split with no explicit
    narrative device (e.g. an annotation on the largest swing or a net-change callout)
    — reads as a good default rather than a guided insight
  - Grid alpha (0.2) and axis reference-line alpha (0.35) sit slightly above the style
    guide's recommended 10-15% subtle-grid range, though still far from competing
    with the data
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "slope-basic · matplotlib · anyplot.ai" in dark ink, centered, clearly readable. A boxed legend ("Increase" / "Decrease" with green/red line-and-marker swatches) sits directly above the title. "Q1 2024" and "Q4 2024" column labels are bold dark text at the bottom. Y-axis tick labels ("$5M".."$25M") are muted brown-gray, subtle horizontal gridlines at each tick. All chrome text is clearly legible against the light background.
      Data: Eight slopegraph lines connect Q1 2024 to Q4 2024 values for consumer-electronics products. Lines/markers are either brand green (#009E73, "Increase") or matte red (#AE3030, "Decrease") — matches the Imprint palette's semantic finance exception. Bold, color-matched product+value labels sit at both endpoints with a light halo stroke for contrast; a few labels are nudged off their exact value with a thin dotted stub line back to the true point to avoid collisions.
      Legibility verdict: PASS — no light-on-light text; all title, tick, legend, and data labels are readable at full size and at the 400px mobile thumbnail.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and legend layout, now rendered in light ink/tick colors (INK/INK_SOFT tokens flipped correctly). Legend frame uses the dark elevated fill with a light border and light text. Gridlines and axis reference lines are still subtle and correctly inverted for the dark surface.
      Data: Data colors are pixel-identical to the light render — green #009E73 for increases, red #AE3030 for decreases — only the chrome (background, text, grid, legend box) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures found; all title, tick, legend, and data labels are clearly readable against the near-black background, confirmed at both full size and the 400px mobile thumbnail.
