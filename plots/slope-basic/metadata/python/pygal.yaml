review:
  strengths:
  - Clever repurposing of pygal's Line chart (no interpolation, only two x-ticks)
    into a genuine slopegraph, with print_labels carrying entity names at both endpoints
    so the legend can be safely omitted
  - 'Correct, well-reasoned semantic color exception: brand green for increases and
    matte red (#AE3030, Imprint position 5) for decreases, redundantly encoded by
    slope direction as well as color — CVD-safe'
  - 'Clean, fully deterministic code: no randomness needed, only os/sys/pygal imports
    (all used), comments clearly explain the legend-omission and color-direction rationale'
  - 10 entities (within the spec's 5-15 sweet spot), plausible Q1-vs-Q4 product-category
    sales data, with values deliberately spaced so same-column labels don't collide
  - Canvas is exactly 3200x1800 and theme chrome (background, title, ticks, axis labels)
    is correctly threaded through the Style object for both light and dark renders
  weaknesses:
  - Point/category labels (print_labels) render at value_label_font_size=36 — smaller
    than the tick labels (44) and axis title — bump to ~44-48 so entity names read
    as prominently as the numeric ticks, especially at mobile scale
  - On the Q1 (left) column, each entity's label starts right at the vertical Q1 gridline,
    so the dotted guide line runs through the first characters of every label (e.g.
    'Furniture', 'Beauty') — nudge left-column labels a few px right of the line,
    or don't extend the guide through the label text
  - Sales scale of 40-114 'units' reads as unrealistically small for whole product-category
    totals (e.g. company-wide 'Electronics' sales) — scale the data up (thousands
    of units) or relabel the axis to reflect a smaller reporting unit
  - The two time points are only labeled via the shared x-axis ticks ('Q1 2024' /
    'Q4 2024') rather than as a header directly above each column the way classic
    slopegraphs do — consider whether this reads clearly enough at a glance
  - Visual refinement is fairly standard (single y-axis grid, no marker edge/stroke
    treatment) — a subtle ink/white outline on the dots would add definition, especially
    in the busy mid-chart zone where several lines cross
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "slope-basic · python · pygal · anyplot.ai" centered in dark ink at top, clearly readable. Y-axis title "Sales (units)" rotated on the left, x-axis title "Time Period" below the x tick labels "Q1 2024" / "Q4 2024". Y tick labels (30-120) in dark ink, subtle dotted horizontal grid at each 10-unit step.
      Data: 10 lines connect a Q1 dot to a Q4 dot per product category. First series added (Furniture) is Imprint brand green #009E73; rising entities (Furniture, Beauty, Home Decor, Electronics, Sporting Goods, Automotive) are green, falling entities (Apparel, Food & Bev, Office Supplies, Toys) are matte red #AE3030. Each dot carries its category name directly beside it at both endpoints; no legend (correctly omitted since labels + slope direction already carry the series identity).
      Legibility verdict: PASS — all title/axis/tick/category text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, y-axis title, x-axis title, and numeric tick labels all render in light ink, clearly legible against the dark surface. Grid lines remain subtle.
      Data: Colors are identical hexes to the light render (#009E73 green / #AE3030 red) — only chrome flipped, as required. Category point-labels appear in a muted grayish tone; still clearly distinguishable from the near-black background (no dark-on-dark failure — this is a legitimate secondary/tertiary text tone, not a legibility failure).
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all chrome and data-adjacent text hold sufficient contrast in both renders.
