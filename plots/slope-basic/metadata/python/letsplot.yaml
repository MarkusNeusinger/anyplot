review:
  strengths:
  - 'Excellent data storytelling: the top-3 movers by absolute change render bold
    and fully opaque while the remaining lines are dimmed to alpha=0.40, creating
    a clear visual hierarchy that guides the eye to the biggest Q1-to-Q4 changes'
  - Correct, idiomatic slope-chart construction via geom_segment + geom_point + geom_text
    layering, with entity+value labels placed at both endpoints for legibility
  - 'Distinctive lets-plot-specific feature: separate layer_tooltips() configs for
    top movers (with a "Top mover" title marker) vs. normal lines, a genuine interactive
    touch that adds value in the HTML export'
  - Semantic color mapping (brand green = Increase, matte red = Decrease) matches
    the Imprint palette's documented semantic-exception guidance for gain/loss framing
  - 'Fully theme-adaptive chrome: data colors are pixel-identical between light/dark
    renders, backgrounds are correct at #FAF8F1/#1A1A17, and all text tokens (INK/INK_SOFT)
    are threaded through title, axis, and legend elements'
  - Clean, deterministic, single-scope script — no functions/classes, all imports
    used, no dead code
  weaknesses:
  - 'Full rectangular panel border (all four spines) is visible in both renders instead
    of the default L-shaped (bottom+left only) frame the style guide calls for; a
    slope chart isn''t the ''enclosed heatmap grid'' exception. Fix: remove the panel
    border in theme() (e.g. panel_border=element_blank()) so only the bottom/left
    axis lines remain.'
  - The alpha-blended (0.40) background lines lean on the red/green hue difference
    as the primary distinguishing signal for red-green color-vision-deficient viewers;
    slope direction is a redundant cue but becomes subtle at low alpha across 10 overlapping
    lines. Raise the alpha floor for the dimmed group (e.g. to ~0.5-0.55) or add a
    secondary encoding (linetype) to keep CVD-safety strong even when dimmed.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "slope-basic · python · letsplot · anyplot.ai" in dark ink, clearly readable. Y-axis title "Sales ($K)" and tick labels (50-300) in dark/soft-dark ink, all legible. X-axis carries no title but uses tick labels "Q1 Sales ($K)" / "Q4 Sales ($K)" as the two time-point axis labels, dark and legible. A full rectangular panel border (all four sides) is visible, which deviates from the L-shaped spine default. Horizontal grid lines are subtle and only on the y-axis.
      Data: 10 entities connected by segments between Q1 and Q4 x-positions. First-series green (#009E73) marks "Increase", matte red (#AE3030) marks "Decrease" — matches Imprint semantic exception for gain/loss. Top-3 movers (Headphones, Smart TVs, Smartphones by abs. change) render as bold, fully opaque lines; the other 7 lines are dimmed to ~40% alpha, creating clear visual hierarchy. Entity + value labels (e.g. "Cameras ($270K)") sit at both endpoints without overlapping each other or the data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis title, and tick labels are all rendered in light ink and clearly readable against the dark background — no dark-on-dark failures observed. The same full rectangular panel border issue is present here too (all four sides visible, light-colored on dark bg).
      Data: Colors are pixel-identical to the light render (green #009E73 / red #AE3030), confirming only chrome flipped between themes. Same top-mover bold/dim emphasis pattern holds.
      Legibility verdict: PASS
