      Data: Lines colored Imprint #009E73 (Increase) and #AE3030 (Decrease), consistent with the spec's suggestion to color-code by direction. Markers are circular, size ~3.2. Two endpoint pairs on the 2024 side visually merge (China/Poland at 59/57, Turkey/Vietnam at 36/34) into touching blobs - see weaknesses.
