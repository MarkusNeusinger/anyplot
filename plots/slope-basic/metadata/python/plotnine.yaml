review:
  strengths:
  - Direct endpoint labeling (entity + start value on the left, end value on the right)
    eliminates the need for a numeric y-axis and keeps the chart clean per Tufte-style
    slopegraph convention.
  - 'Semantic color coding (Increase = brand green #009E73, Decrease = matte red #AE3030)
    is redundant with the line''s slope direction, so direction reads via two independent
    channels, not color alone.'
  - Previously-flagged marker overlap (Poland/Vietnam 2024 endpoints) has been resolved
    by nudging values apart; no label or marker collisions remain in either render.
  - Title fontsize (11pt) matches the style guide's linear scaling formula for the
    descriptive-prefixed 73-char title almost exactly, and fits within the 70-85%
    width band without clipping.
  - Data is factually well-grounded (national coal-share trends 2014-2024 broadly
    track real IEA/Ember figures, e.g. UK's collapse to ~1%, US ~39%->15%) and covers
    both increases and decreases plus rank crossovers per the spec's data notes.
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    all chrome text readable, identical data colors across themes.'
  weaknesses:
  - Data storytelling is limited to color/slope encoding; no explicit visual emphasis
    (annotation, bolder line, or callout) highlights the single most dramatic change
    (e.g., United Kingdom's drop from 30% to ~1%), so the viewer must scan all ten
    lines to find the standout story.
  - The layered geom_text-with-per-layer-data pattern is idiomatic plotnine/ggplot2
    grammar but not a feature unique to this library specifically — a generic 'distinctive
    feature' beyond that would strengthen Library Mastery further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme surface, not pure white.
      Chrome: Title "National Coal Power Share · slope-basic · python · plotnine · anyplot.ai" is dark ink, fully visible, ~85% plot width, not clipped at top or sides. Y-axis title "Coal Share of Electricity Generation (%)" is dark ink, rotated, fully visible with margin from the left canvas edge. X-axis tick labels "2014"/"2024" are dark gray, clearly legible with margin above the bottom edge. Left entity labels (e.g. "China (66)", "Australia (63)", "United Kingdom (30)", "Turkey (27)") are tightly spaced in places but remain on distinct rows with no overlap. Legend "Change" with "Decrease"/"Increase" swatches sits in an elevated cream box to the right of the plot, clear of all data labels.
      Data: First/semantic series color is brand green #009E73 for "Increase" lines, matte red #AE3030 for "Decrease" lines — both Imprint palette members, applied consistently with 10 point-pairs, prominent markers and moderate line weight appropriate for this sparse (10-line) dataset.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme surface, not pure black.
      Chrome: Title, y-axis title, tick labels, entity labels and legend text all render in light ink (white/light-gray) against the dark background — no dark-on-dark failures found anywhere, including the rotated y-axis title and the small entity-label text at the far left.
      Data: Increase/Decrease line and marker colors are pixel-identical to the light render (#009E73 / #AE3030) — only the chrome (background, text, grid, legend box fill) flips between themes, as required.
      Legibility verdict: PASS
