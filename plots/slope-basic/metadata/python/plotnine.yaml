review:
  strengths:
  - Direct endpoint labeling of both entity+start value (left, e.g. "Germany (90)")
    and end value (right, e.g. "92") satisfies the spec's "labels should appear at
    both endpoints" requirement without needing a separate category legend.
  - 'Correct semantic color-coding: Increase uses brand green #009E73 (Imprint position
    1) and Decrease uses matte red #AE3030 (Imprint''s designated semantic anchor
    for loss/decline) — a textbook application of the style guide''s finance/sentiment
    semantic-exception rule (gain -> green, loss -> red).'
  - 'Clean, restrained chrome: redundant y-axis tick labels/ticks removed (values
    are already labeled directly on the lines), top/right/panel spines removed, only
    a subtle y-axis grid remains, and theme-adaptive tokens are threaded correctly
    through both light and dark renders.'
  - Title exactly matches the mandated `{spec-id} · {language} · {library} · anyplot.ai`
    format with a sensible descriptive prefix.
  - 'Data tells a clear story: the mix of increasing and decreasing lines produces
    a crossing pattern that immediately conveys divergent national trends, matching
    the spec''s rank-change use case.'
  weaknesses:
  - 'DQ-03: Several country coal-share figures deviate substantially from well-documented
    real-world statistics for 2014/2024. Germany''s coal share of electricity was
    never near 90% (actual ~44% in 2014); China''s coal share has been declining over
    the decade (~66% down to ~58-60%), not rising from 27% to 83% as shown — that
    direction is factually backwards. Revisit the dataset so magnitudes and directions
    align with documented energy-mix data while keeping the same rank-crossover storytelling
    structure.'
  - 'VQ-03: With only 10 sparse entities (<50 data points), markers (size=2.5) and
    lines (size=1.0) could be more prominent per the sparse-data density heuristic
    — increase both slightly for a more confident focal presence.'
  - 'DE-02: The legend box has a visible border (legend_background color=INK_SOFT)
    — the style guide''s Decoration Removal Checklist calls out "box frames around
    legends" as a candidate for removal; drop or soften the stroke for a cleaner minimal
    look.'
  - 'VQ-05: There is a noticeably empty horizontal gap between the rightmost value
    labels and the legend box, creating uneven whitespace on the right side of the
    canvas — move the legend closer to the data or rebalance margins.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "National Coal Power Share · slope-basic · python · plotnine · anyplot.ai" in dark ink at top, clearly readable. Y-axis title "Coal Share of Electricity Generation (%)" rotated on the left in dark ink, readable. Y-axis tick labels/ticks are intentionally removed (values are labeled directly on the lines instead). X-axis shows "2014" and "2024" as the two time-point labels in dark ink. A bordered legend box ("Change": Decrease/Increase) sits to the right of the plot with a visible outline. Subtle horizontal gridlines are visible at intervals.
      Data: 10 slope lines connect each country's 2014 value (left, labeled "Country (value)") to its 2024 value (right, labeled with the value only). Lines and markers are colored green (#009E73, "Increase") or red/"matte red" (#AE3030, "Decrease") depending on direction. All text is clearly readable against the light background — no light-on-light issues observed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, y-axis title, entity/value labels, x-axis "2014"/"2024" labels, and legend text all render in light off-white/soft-grey ink, clearly legible against the dark background. Legend box border and fill use the dark elevated tone, still readable.
      Data: The same 10 slope lines are present with identical data colors to the light render — green #009E73 for Increase and red #AE3030 for Decrease, confirming only chrome (not data colors) changed between themes. No dark-on-dark or unreadable text was observed anywhere in this render.
      Legibility verdict: PASS
