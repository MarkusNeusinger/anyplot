  strengths:
  - Correct slope-chart structure with two clearly labeled time-point axes (2014/2024)
    and 10 entities, within the spec's 5-15 recommended range
  - 'Semantic color coding (Increase = Imprint #009E73, Decrease = Imprint #AE3030)
    is redundant with the line''s slope direction, so the encoding stays colorblind-safe'
  - Canvas is exactly 3200x1800 (landscape) with no edge clipping in either render
  - Both light (#FAF8F1) and dark (#1A1A17) renders are correctly themed - all chrome
    (title, axis text, grid, legend) flips appropriately and stays legible
  - 'Clean single-script implementation: no functions/classes, all imports used, deterministic
    hardcoded data, correct plot-{THEME}.png output convention'
  - Realistic, neutral, well-scaled data (national coal-share-of-electricity percentages,
    2014 vs 2024) with a genuine mix of increases, decreases and rank reversals as
    the spec's Notes section suggests
  weaknesses:
  - 'PIPELINE/PROCESS ISSUE (not a code defect): the plot_images/plot-light.png and
    plot-dark.png supplied for this review do not match plots/slope-basic/implementations/python/plotnine.py
    at all - the shipped artifacts show 10 different, monotonically-sorted entity
    values (e.g. Germany 90->92, all-increase-then-all-decrease ordering) while the
    current source code defines entirely different, non-monotonic data (Germany 44->23,
    South Africa 92->84, etc.) with intentional rank reversals. This reviewer independently
    re-ran the current script (both themes) to produce accurate renders for this review;
    the workflow should be checked for why the pre-rendered PNGs were not regenerated
    after the latest ''fix(plotnine): address review feedback for slope-basic'' commit.'
  - 'Overlapping/merged endpoint markers on the 2024 side: China (ends at 59) and
    Poland (ends at 57) are only 2 units apart on the value scale, so their point
    markers visually merge into a single figure-8 blob; the same happens for Turkey
    (36) and Vietnam (34). Fix by nudging the data values further apart, reducing
    marker size for tightly-packed pairs, or applying a small manual vertical dodge/offset
    to the merging markers.'
  - Right-side (2024) labels show only the bare numeric value, not the entity name,
    so entity identification relies solely on tracing the colored line back to the
    left label - acceptable convention but a partial gap against the spec's 'Labels
    should appear at both endpoints for entity identification'.
  - 'Library mastery is fairly generic: beyond the two-layer geom_text label pattern,
    the implementation doesn''t demonstrate plotnine-distinctive techniques (e.g.
    position/dodge adjustments that would also fix the marker-overlap issue above).'
