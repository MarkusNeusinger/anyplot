review:
  strengths:
  - Endpoint labels placed outside the line span (x=-0.05 / x=1.05) so text never
    crosses the diagonal slope lines, and a custom label-spreading pass keeps dense
    clusters (e.g. Q4 65/67/71) legible in both themes.
  - 'Direction encoding is redundant, not color-only: line slope, endpoint position,
    and the printed start/end values all confirm increase vs. decrease alongside the
    green/red color.'
  - WCAG-tuned label text colors (deeper green on light, lighter red on dark) are
    distinct from the true Imprint line/marker colors, preserving palette identity
    while keeping small text readable on both backgrounds.
  - HoverTool wired to a ColumnDataSource gives per-point product/period/value tooltips
    in the HTML output, a real interactive value-add beyond the static PNG.
  - Legend relocated outside the plot frame (right sidebar) so it doesn't compete
    with data for vertical space.
  weaknesses:
  - 'No visual emphasis on the most dramatic mover (Water Bottle: 40 -> 67, the largest
    relative increase) — every line gets identical width/alpha, so the chart lacks
    a single clear focal point beyond the increase/decrease split.'
  - Mandated title without a descriptive prefix renders at roughly 40-45% of plot
    width, well under the usual 50-70% guideline — acceptable per style-guide but
    worth a short descriptive prefix (e.g. 'Product Sales Momentum · ') to fill the
    title role more fully next time.
  - Line width and alpha are uniform across all 10 entities; scaling width or alpha
    slightly with |change magnitude| would reinforce the storytelling on top of the
    color split.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "slope-basic · python · bokeh · anyplot.ai" centered at top; italic dark "Sales (thousands)" y-axis label; dark "Q1"/"Q4" column labels drawn inside the plot near the bottom; grey y-axis tick labels; subtle horizontal gridlines. All chrome text is clearly legible against the light background.
      Data: 10 slope lines connecting Q1 to Q4 values, colored green (#009E73, brand green, "Increase") or matte red (#AE3030, "Decrease") per direction. Each line has filled circular markers at both endpoints and a text label ("Product: value" on the left, "value: Product" on the right) in a WCAG-tuned variant of the line color. A "Direction" legend with Increase/Decrease swatches sits in a card outside the plot frame on the right. First categorical color is the mandated brand green.
      Legibility verdict: PASS — no light-on-light text anywhere; labels are well spread (custom anti-collision pass) with no overlaps between text, markers, or lines.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/axis-label/tick layout as the light render, now in light ink (#F0EFE8 title/axis label, lighter grey tick labels) — clearly visible against the dark background. Q1/Q4 column labels also flip to light ink.
      Data: Line and marker colors are identical to the light render (#009E73 green / #AE3030 red) — only the chrome flipped, as required. Endpoint label text uses the dark-theme variants (brand green stays as-is; red brightens to #E86A6A for contrast) and remains legible against the dark surface.
      Legibility verdict: PASS — no dark-on-dark text; tick labels, title, and endpoint labels all read clearly against #1A1A17.
