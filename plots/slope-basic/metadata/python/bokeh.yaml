review:
  strengths:
  - Tufte-style direct endpoint labeling (product name + value at both Q1 and Q4)
    with a custom collision-avoidance algorithm that keeps every label readable even
    in the densest value cluster (67 / 65 / 58)
  - Legend externalized to a right-side sidebar box via add_layout(..., "right"),
    keeping the plot area free of clutter instead of floating in-frame
  - 'Theme-correct backgrounds and chrome in both renders (#FAF8F1 light / #1A1A17
    dark); the increase/decrease data colors are pixel-identical across themes'
  - 'Genuine bokeh-specific interactivity: ColumnDataSource-backed scatter with HoverTool
    tooltips (Product / Period / Sales) in the HTML export, not decorative'
  - Clean, fully deterministic, KISS-structured code (imports -> data -> plot -> save,
    no functions/classes, no randomness needed)
  weaknesses:
  - Title is 'slope-basic · bokeh · anyplot.ai' but the mandated format is '{spec-id}
    · {language} · {library} · anyplot.ai' — the 'python' language segment is missing;
    should read 'slope-basic · python · bokeh · anyplot.ai'
  - 'Dark-render ''Decrease'' endpoint labels (#AE3030 matte red on #1A1A17) measure
    ~2.7:1 contrast, below the WCAG large-text minimum (3:1) — still legible on close
    inspection but noticeably strained; consider a theme-adaptive brightened red for
    label TEXT specifically (keep the line/legend swatch at the true #AE3030 for palette-identity)
    or increase label font weight to compensate'
  - 'Light-render ''Increase'' endpoint labels (#009E73 green on #FAF8F1) measure
    ~3.2:1 contrast, below the 4.5:1 normal-text target — same fix direction as above
    (text-only contrast boost, not the data color itself)'
  - Direction (increase vs decrease) is encoded solely through red/green hue for both
    the connecting lines and the endpoint-label text — add a secondary channel (e.g.
    solid vs dashed line dash, or a distinct marker shape) so the encoding survives
    red-green color-blindness independent of the slope-direction cue
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold black-ish title "slope-basic · bokeh · anyplot.ai" centered at top, fully visible, not clipped. Italic "Sales (thousands)" y-axis label on the left in dark ink. Y-axis tick labels (30-100) in soft dark gray, all readable. "Q1"/"Q4" column headers in dark ink at the bottom of each axis. Subtle horizontal gridlines barely visible. "Direction" legend box (Increase/Decrease) sits in its own bordered sidebar box to the right of the plot, background a slightly elevated off-white, fully legible.
      Data: 10 slope lines (4px wide, alpha 0.85) connecting Q1 -> Q4 values, colored green (#009E73) for increases and matte red (#AE3030) for decreases. 18px scatter dots mark each endpoint. Every line has a text label at both ends showing "Product: value" (left) / "value: Product" (right), color-matched to the line. A custom spread algorithm keeps all 20 labels non-overlapping even in the densest cluster (67/65/58 on the right side).
      Legibility verdict: PASS — all chrome text (title, axis label, ticks, Q1/Q4, legend) is clearly readable. The green endpoint-label text measures ~3.2:1 contrast against the light background (below the 4.5:1 ideal but still legible on close inspection, not a "light-on-light" failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: White/near-white bold title, fully visible. Italic light-gray "Sales (thousands)" y-axis label. Light-gray y-axis tick labels, all readable. White "Q1"/"Q4" headers. Subtle gridlines. Legend box now has a dark elevated background with light-gray text, fully legible against the dark chrome.
      Data: Identical green (#009E73) and red (#AE3030) line/marker colors to the light render — confirmed pixel-matched. Same endpoint labeling and non-overlapping placement as the light render.
      Legibility verdict: PASS, with a caveat — no true "dark-on-dark" failure (nothing is unreadable), but the red "Decrease" endpoint-label text (#AE3030 on #1A1A17) measures only ~2.7:1 contrast, below even the WCAG large-text minimum (3:1). It remains legible in close inspection (verified via pixel crop) but is the weakest-contrast element in either render and should be brightened for the text specifically.
