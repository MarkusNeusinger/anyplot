review:
  strengths:
  - Labels-as-axis technique (direct endpoint annotations replace a shared y-axis)
    is a genuine Economist/Tufte-style slopegraph refinement, not a library default
  - 'Correct semantic color mapping: Increase = Imprint position 1 (#009E73 brand
    green), Decrease = Imprint position 5 (#AE3030 matte red) — matches the style
    guide''s finance profit/loss semantic exception exactly'
  - Direction is redundantly encoded through both color AND line slope, so the red/green
    choice isn't a sole-hue CVD risk
  - annotation_clip=False fix is called out in a comment explaining a prior truncation
    bug it prevents — good engineering awareness
  - Data shows 4 genuine rank crossings across 8 entities, exercising the slope chart's
    core value (spotting rank changes) rather than a monotonic, uninteresting dataset
  - Theme-adaptive chrome (INK, INK_SOFT, PAGE_BG) correctly threaded through title,
    ticks, guide lines, and legend in both renders
  - All font sizes explicitly set; KISS script structure with no functions/classes;
    deterministic hardcoded data (no seed needed)
  weaknesses:
  - With only 8 entities (sparse data), markersize=7 / linewidth=2.2 leave visible
    headroom — bumping to ~9-10 markersize and ~2.6-3.0 linewidth would give the lines
    more prominence given how much whitespace the layout has
  - Red/green as the direction-coding pair is the classic worst case for deuteranopia/protanopia;
    consider a redundant marker-shape distinction (e.g. triangle vs circle) for maximum
    accessibility, even though slope direction already provides a redundant cue
  - Distinctive-feature usage (hue + units + estimator=None for per-entity lines)
    is a real seaborn idiom but is still replicable with a manual matplotlib loop
    with modest effort — a library-unique feature (e.g. FacetGrid small multiples
    for >15 entities) would push Library Mastery further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "slope-basic · python · seaborn · anyplot.ai" in dark ink at top; "Q1 Revenue ($M)" / "Q4 Revenue ($M)" column headers along the top of two thin vertical guide lines; "Increase"/"Decrease" legend directly below the title. All chrome text is dark-on-light and clearly legible.
      Data: 8 entity slopes connecting Q1 (left) to Q4 (right) values, each line colored green (#009E73, Increase) or red/matte-red (#AE3030, Decrease). Endpoint annotations ("Entity (value)") sit directly beside each node in the line's own color, doubling as the value axis — no separate y-axis or tick marks. Four visible rank-crossings (e.g., TechVault/LogicGrid swap, ByteFlow/CodeBase swap) demonstrate the chart's core purpose.
      Legibility verdict: PASS — no overlapping text, no clipped labels, all annotations fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, column headers, and legend, now rendered in light ink (#F0EFE8-family) against the dark surface. Guide lines and text are all clearly visible, no dark-on-dark elements.
      Data: Same 8 entity slopes with identical green (#009E73) and red (#AE3030) hues as the light render — confirms data colors are held constant across themes and only chrome inverted.
      Legibility verdict: PASS — all title, header, legend, and endpoint-annotation text is legible against the dark background; no dark-on-dark failures observed.
