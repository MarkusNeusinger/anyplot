review:
  strengths:
  - 'Correctly addressed all three attempt-1 weaknesses: grid is now solid (no more
    gridDash), x-axis tick fontSize brought down to 11 (near-balanced with the y-axis''s
    10), and a dark-mode halo/stroke technique was added to lift the matte-red ''Decrease''
    contrast on the near-black background.'
  - Idiomatic layered Altair slopegraph (line + circle + two direct-label text layers)
    with a full rank-shuffle across 10 entities and deliberately spaced values (~90-unit
    minimum gap) so all 20 endpoint labels stay collision-free in both renders.
  - 'Exact theme-token compliance for backgrounds, axis chrome, and legend box; first
    series is exactly #009E73 and the legend swatches correctly show green/red for
    Increase/Decrease in both themes.'
  - Canvas padding logic lands both PNGs exactly at 3200x1800 with no drift; spec
    data (entity + two time points), realistic product-sales scenario, and clean KISS
    code structure are all still excellent.
  weaknesses:
  - 'Regression from the attempt-1 fix: applying `stroke=alt.value(INK)` with `strokeWidth=1`
    directly to the `mark_text` layers (labels_left/labels_right) for the ''Decrease''
    direction in dark mode does not just add a thin outline -- at fontSize=11 the
    1px ink stroke fully overwhelms the thin matte-red fill, so ''Phone'', ''Mouse'',
    ''Keyboard'', ''Charger'', and ''Speaker'' render as solid ink-white/bold text
    in plot-dark.png with essentially zero red visible (pixel-sampled: dominant colors
    are exactly (26,26,23) background and (240,239,232) INK, no AE3030 present). The
    circle markers and connecting lines are unaffected (they keep a correctly-colored
    red fill with a thin visible ink ring) because they use a separate wider ink halo
    layer underneath rather than a stroke on the mark itself -- only the text marks
    have this problem.'
  - Because of the above, the legend swatch correctly shows red for 'Decrease' but
    half of the direct-label text in dark mode no longer matches that legend color,
    and the two direction categories end up with visibly different font weights in
    dark mode (thin green 'Increase' labels vs. bold-looking white 'Decrease' labels)
    even though both use the same fontSize=11 -- an unintended typographic inconsistency,
    not a deliberate hierarchy choice.
  - 'Fix: do not apply a stroke to the text marks. Either drop `stroke`/`strokeWidth`
    entirely from labels_left/labels_right (contrast for red-on-dark can be handled
    by using a wider outline **halo** approach like the one already used for lines_decrease_halo,
    or a much thinner stroke e.g. 0.3-0.4px, or by making the label font slightly
    heavier without an outline).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, correct.
      Chrome: Title "slope-basic · python · altair · anyplot.ai" bold dark ink, centered, clearly visible. Y-axis title "Sales (units)" and tick labels (100-1,200) dark/soft-dark ink, readable. X-axis categorical ticks "Q1 Sales"/"Q4 Sales" now close in size to the y ticks (fontSize 11 vs 10), a big improvement over attempt 1's 14 vs 10 mismatch. Grid is now solid, thin, subtle (attempt-1's dashed grid was fixed). Legend "Direction" sits top-right in a bordered cream box with no overlap against the "Laptop" data point beside it.
      Data: 10 sloped lines/markers colored brand green #009E73 (Increase) or matte red #AE3030 (Decrease), with circular endpoint markers (white ring) and direct product-name labels colored to match direction at both ends. All labels are cleanly spaced with no collisions.
      Legibility verdict: PASS -- all text is dark-on-light and fully readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, correct.
      Chrome: Title, axis title, and tick labels correctly use light ink and are all clearly readable; grid is solid and subtle; legend box correctly flips to a dark-elevated fill with light border/text and does not overlap data.
      Data: Circle markers and connecting lines are pixel-identical in hue to the light render (#009E73 / #AE3030) -- confirmed by pixel sampling, the matte-red circle/line for "Phone" is still (174,48,48). However, the direct-label TEXT for every 'Decrease' entity ("Phone", "Mouse", "Keyboard", "Charger", "Speaker") renders as solid ink-white/bold instead of red -- pixel sampling over the "Phone" label found only background (26,26,23) and INK (240,239,232), zero red pixels. This is caused by the new `stroke=INK, strokeWidth=1` fix applied directly to the text marks: at fontSize=11 the ink stroke completely overwhelms the thin red glyph fill. The legend swatch still correctly shows red for "Decrease", so there is a real mismatch between the legend's red indicator and the white-rendered direct labels for that category.
      Legibility verdict: PASS for reading the words themselves (high contrast, no dark-on-dark), but FAIL for color-identity: the 'Decrease' category's text color is not preserved between themes, unlike every other data-encoded element in the chart.
