review:
  strengths:
  - Correct, idiomatic Altair slopegraph built from four layered marks (line + circle
    + two direct-label text layers) with a full rank-shuffle across 10 entities, making
    the increase/decrease story immediately legible.
  - 'Exact theme-token compliance: measured background pixels are precisely #FAF8F1
    (light) and #1A1A17 (dark); first series is exactly #009E73; ''Decrease'' correctly
    uses the semantic red anchor #AE3030 (loss/decline meaning matches the legend
    label).'
  - Entities are deliberately spaced (~90-unit minimum gap per comment) so all 20
    direct end-labels stay collision-free in both renders despite 10 overlapping entities.
  - Canvas padding logic (raise on overshoot, center-pad on undershoot) lands both
    PNGs exactly at 3200x1800 with no drift.
  weaknesses:
  - 'Red ''Decrease'' elements (line, markers, product labels) measure ~2.7:1 contrast
    against the #1A1A17 dark background -- below the 3:1 AA large-text floor, and
    exactly the case the style guide flags as ''matte-red marginally below on dark
    bg.'' Since Decrease is meaningful status information (not decorative), add the
    style guide''s recommended 1px ink-color stroke to the red line/markers/labels
    in dark mode.'
  - X-axis tick labels ('Q1 Sales' / 'Q4 Sales', labelFontSize=14) render visibly
    larger than the Y-axis tick labels (labelFontSize=10) -- measured glyph heights
    ~42px vs ~26px, a ~1.6x mismatch with no semantic reason. Bring the x tick fontsize
    down to ~11-12 for balance with the y ticks.
  - Grid lines use gridDash=[4,4] on both axes; the style guide's Grid Guidelines
    call for solid thin lines at low opacity, not dashed, for the recurring data grid
    -- reserve dashing for genuine reference lines only.
  - Library Mastery is generic layering (lines+points+text) that most declarative-grammar
    libraries could replicate; a distinctive Altair touch (e.g. alt.condition to highlight
    a specific entity, or an interactive selection in the HTML view) would lift LM-02
    beyond 'some library-specific features.'
  image_description: |-
    Light render (plot-light.png):
      Background: Measured exactly #FAF8F1 -- warm off-white, matches spec.
      Chrome: Title "slope-basic · python · altair · anyplot.ai" bold dark ink, clearly visible. Y-axis title "Sales (units)" dark ink with units. Y tick numbers (100-1,200) in soft dark ink, readable. X-axis has two categorical positions "Q1 Sales" / "Q4 Sales" in bold dark ink -- readable but noticeably larger than the y tick numbers (measured glyph height ~42px vs ~26px). Grid: dashed horizontal lines plus two dashed vertical reference lines at the Q1/Q4 columns, subtle opacity (~0.12).
      Data: 10 sloped lines colored either brand green #009E73 (Increase) or matte red #AE3030 (Decrease), with circular endpoint markers and direct product-name labels colored to match their line's direction at both the Q1 and Q4 ends. Legend top-right in a bordered cream box, dark text, "Direction" title with green/red swatches.
      Legibility verdict: PASS -- all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Measured exactly #1A1A17 -- warm near-black, matches spec.
      Chrome: Title renders in light/white bold ink, clearly visible. Axis title and tick labels use theme-adaptive soft-light ink, readable. Grid dashed at the same subtle opacity. Legend box correctly flips to a dark-elevated fill (#242420-ish) with light border and light text -- theme-adaptive chrome confirmed correct, no dark-on-dark failure there.
      Data: Confirmed pixel-identical hex values to the light render (#009E73 green / #AE3030 red) -- only chrome flipped, as required.
      Legibility verdict: PASS overall (nothing is fully unreadable), but flagged: the red "Decrease" line/markers/labels measure ~2.7:1 contrast against the #1A1A17 background (below the 3:1 AA large-text floor) and read visibly duller than their green counterparts when directly compared (e.g. "Speaker" label crop vs "Webcam" label crop) -- not a hard dark-on-dark failure, but a real accessibility dip worth a stroke/outline fix.
