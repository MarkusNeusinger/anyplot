review:
  strengths:
  - Custom label-decluttering algorithm (declutter()) cleanly resolves overlaps across
    10 densely-packed entities on both label columns, with subtle leader ticks connecting
    nudged labels back to their true value position
  - 'Correct semantic color exception applied per the Imprint style guide (green =
    improved, matte red #AE3030 = declined), redundantly reinforced by the slope direction
    itself so the encoding is not red-green-only'
  - Theme-adaptive chrome verified correct in both renders — warm off-white / near-black
    backgrounds, no dark-on-dark or light-on-light text failures, data colors identical
    between themes
  - Canvas is exactly 3200×1800, title format and legend labels match spec exactly,
    data is fully deterministic and in-memory (no fetch/csv)
  - Idiomatic D3 join patterns (selectAll().data().join()) for lines, circles, labels
    and leader ticks; no fake interactivity, no animation
  weaknesses:
  - No unit/context label indicating what the values represent (e.g. 'Employee Satisfaction
    Score (0-100)') — the bare numbers next to each label are ambiguous without an
    axis title or subtitle
  - The declutter() helper function deviates from the KISS 'no functions' default
    — justified by the genuine label-collision problem, but consider inlining or keeping
    it minimal
  - Chart stays generic in its storytelling — no annotation or visual emphasis calls
    out the largest mover (e.g. Customer Support's decline or Product's gain), leaving
    DE-03 without a clear focal point
  - Endpoint/leader label font size (15px) is proportionally small relative to the
    3200px canvas and the 22px title — bumping to ~16-17px would improve full-size
    and mobile-scaled legibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "slope-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center, clearly legible. "Improved"/"Declined" legend centered below title with matching colored line swatches. "2019 Survey" and "2024 Survey" bold headers above each vertical axis line. Left labels read "Department · Value", right labels read "Value · Department", both in soft dark-gray ink, all legible against the light background with no overlap between adjacent labels (the decluttering algorithm keeps a minimum vertical gap even where raw values are close, e.g. Legal/HR at 82/80 or Finance/IT at 70/69).
      Data: Ten department slope lines running left (2019) to right (2024), each with a filled circle endpoint marker. Lines colored brand green (#009E73) for departments whose 2024 score rose (e.g. Product 77→83, Engineering 72→81) and matte red for departments that declined (e.g. Legal 82→80, Sales 68→61, Customer Support 58→52). Direction is reinforced twice — by color and by the visible slope of the line itself.
      Legibility verdict: PASS — all title, legend, header, and endpoint-label text is clearly readable against the light surface; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis-header text now rendered in light ink/off-white, clearly visible against the dark surface. Vertical axis lines and leader ticks use a soft light-gray stroke that remains visible without dominating the composition. Endpoint labels in light soft-ink are readable at the same positions as the light render.
      Data: Same ten slope lines in the identical brand green (#009E73) and matte red (#AE3030) hues as the light render — confirmed data colors are unchanged between themes; only the chrome (background, text, axis-line, leader-tick colors) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, legend, header, and endpoint label is clearly legible against the near-black background.
