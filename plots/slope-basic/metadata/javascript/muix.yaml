review:
  strengths:
  - Composes a custom SVG layer inside LineChart via useXScale/useYScale, so end labels
    sit in the chart's own coordinate system at each line end's exact value
  - One straight line per department on a shared value scale with a point-scale x
    axis whose two tick labels name the time points (Satisfaction 2023 / Satisfaction
    2025), as the spec asks
  - Labels at both ends carry name and value, mirrored (name · value on the left,
    value · name on the right) so each value sits next to its line end; the label-spacing
    pass shifts only labels, never the line ends
  - Direction colors from the Imprint palette (green increase, red decrease) identical
    in both themes, explained by an inline legend whose glyphs reproduce the line-plus-hollow-mark
    style
  - 'Chrome reduced to the essentials: hidden value axis, no grid, no axis lines or
    ticks, theme tokens for every text element so both renders read cleanly'
  - skipAnimation and hideLegend on the v9 API; data block and role constants follow
    the adaptable-code zones with limits derived from the data
  weaknesses:
  - 'Suggestion: the mandated title at 22 px fills only about a quarter of the width;
    a slightly larger title or tighter header would give the top band more presence.'
  - 'Suggestion: the 0–100 nature of the satisfaction score lives only in a code comment;
    naming the scale in the subtitle (e.g. ''score 0–100'') would orient readers without
    a value axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, no white panel.
      Chrome: centered bold title "slope-basic · javascript · muix · anyplot.ai", a soft-ink subtitle "n = 9 · Satisfaction 2023 → Satisfaction 2025 · Increase: 5, Decrease: 4" followed by an inline legend (green line+hollow circle "Increase", red line+hollow circle "Decrease"); bold column headers "Satisfaction 2023" (left) and "Satisfaction 2025" (right); no value axis, no grid. All text dark ink, clearly readable.
      Data: nine straight lines with hollow circle marks at both ends; five increasing lines in brand green #009E73 (Engineering, Operations, HR, Finance, Design), four decreasing in Imprint red (Product, Marketing, Sales, Customer Support). Left labels "Name · value" right-aligned, right labels "value · Name"; no label collisions, several expected crossings (Product/Operations/HR, Marketing/Finance, Customer Support/Design/Sales).
