review:
  strengths:
  - 'Both weaknesses from Attempt 1 are fixed: right-side endpoints now show ''{value}
    · {department}'' for entity identification without tracing color/slope back to
    the left, and the biggest riser/decliner get bolder strokes plus ''+8''/''-7''
    delta chips that give the chart a genuine focal point.'
  - 'Semantic color-coding is correct and well-reasoned: brand green (palette[0])
    for improved, matte red (palette[4]) for declined, matching the style guide''s
    sentiment/polarity semantic exception, with direction redundantly encoded by slope
    and by the explicit start/end values (not color-only).'
  - Custom endpoint-label and delta-annotation overlays built with useXScale/useYScale
    hooks — idiomatic, distinctive MUI X usage that goes beyond basic chart configuration.
  - The hand-built legend now uses line+circle swatches matching the actual chart
    stroke style (fixing Attempt 1's flat-rectangle swatches), title fontsize correctly
    follows the prescribed scaling formula for the long descriptive+mandated title,
    and both renders are fully theme-adaptive with identical data colors.
  - 9 entities (within spec's 5-15 guidance), deterministic hardcoded data, clean
    minimal chrome (no axis lines/ticks/grid), no import outside community @mui/x-charts.
  weaknesses:
  - Endpoint markers are modest circles for a sparse 18-point dataset (9 lines × 2
    endpoints) — per the data-density heuristic (few datapoints < 50 → larger, prominent
    markers) they could be slightly bigger/bolder for extra visual weight.
  - Title occupies roughly ~41% of canvas width — on the small end of the '50-70%
    comfortable' range. This follows the prescribed length-scaling formula correctly
    (avoiding overflow for the long descriptive+mandated title) so it's not a violation,
    but there may be a little headroom to size it up slightly without squeezing.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Employee Satisfaction by Department · slope-basic · javascript · muix · anyplot.ai" reads clearly in dark ink, top-left. A custom "Improved"/"Declined" legend (line+circle swatches matching the chart's own stroke style) sits top-right. Left column shows "{Department} · {value}" labels; right column now shows "{value} · {Department}" (fixed from Attempt 1, which showed only the numeric value on the right). "2023"/"2025" period labels sit at the bottom. All text is dark-on-light and clearly legible.
      Data: 9 slope lines, brand green (#009E73) for departments that improved, matte red (#AE3030) for those that declined — matches the style guide's sentiment/polarity semantic exception. The single biggest riser (Design, +8) and biggest decliner (Product, -7) get visibly bolder strokes plus a rounded delta-chip annotation near the line's midpoint, giving the chart a clear focal point.
      Legibility verdict: PASS — no overlapping text, no clipped edges, all labels readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Identical layout to the light render, now rendered in light ink (title/labels) and soft light-gray secondary text (legend). No dark-on-dark failures anywhere — every label is clearly visible against the dark surface.
      Data: The 9 slope lines use the identical green (#009E73) / red (#AE3030) colors as the light render — only chrome (background, text color) flipped, confirming data-color constancy. The bold-stroke + delta-chip emphasis on the biggest riser/decliner is preserved identically.
      Legibility verdict: PASS — no dark-on-dark or illegible elements found.
