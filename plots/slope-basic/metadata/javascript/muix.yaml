review:
  strengths:
  - 'Semantic color-coding is correct: brand green (palette[0]) for improved, matte
    red (palette[4]) for declined — an exact match for the style guide''s ''sentiment/polarity:
    positive→green, negative→red'' semantic exception, and the direction is also redundantly
    encoded by the line''s slope, so it isn''t a red-green-only signal.'
  - Custom endpoint labels are built with useXScale/useYScale hooks — idiomatic, distinctive
    MUI X usage rather than reaching for a workaround.
  - Title fontsize correctly follows the prescribed scaling formula (round(22 × 67/len(title)))
    for the long descriptive+mandated title, avoiding overflow while keeping it visibly
    larger than body text.
  - 'Clean, minimal chrome: axis lines/ticks disabled, no grid, generous margins —
    reads as an editorial slopegraph rather than a generic line chart.'
  - 'Both renders are fully theme-adaptive: data colors identical between light/dark,
    chrome (title, ticks, legend, background) flips correctly with no dark-on-dark
    or light-on-light issues.'
  - 9 entities (within the spec's 5-15 guidance), deterministic hardcoded data, no
    seeding concerns.
  weaknesses:
  - Right-side endpoints show only the numeric value, not the department name — the
    spec's Notes call for 'labels at both endpoints for entity identification'. With
    5 green + 4 red lines crossing mid-chart, identifying a department at its right
    endpoint requires tracing color+slope back to the left label. Consider adding
    a compact right-side label (e.g. abbreviated name) or a hover/data-index cue.
  - Visual storytelling is fairly flat — every line gets equal weight beyond the improved/declined
    split; no additional emphasis (e.g. bolding or annotating the largest mover) to
    guide the eye to the most notable change.
  - Legend swatches are small flat rectangles rather than short line segments matching
    the actual stroke style used in the chart — minor cosmetic inconsistency.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — matches the light-theme spec.
      Chrome: Title "Employee Satisfaction by Department · slope-basic · javascript · muix · anyplot.ai" reads clearly in dark ink top-left. A custom "Improved" / "Declined" legend sits top-right with green/red swatches. Left column shows "{Department} · {value}" labels (e.g. "Engineering · 83"); right column shows the end value only (e.g. "90"). "2023" / "2025" axis labels sit at the bottom under the two columns. All text is dark-on-light and clearly legible; no overlaps between the 9 stacked label rows.
      Data: 9 slope lines connecting 2023 to 2025 values, colored by direction — green (#009E73) for the 5 improving departments (Engineering, Operations, HR, Finance, Design), matte red (#AE3030) for the 4 declining departments (Product, Marketing, Sales, Customer Support). Small hollow circle markers cap each line at both ends. First categorical color is confirmed brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches the dark-theme spec.
      Chrome: Same title, legend, and endpoint-label layout as the light render, now rendered in light ink (title/labels) and soft light gray (legend text) against the dark surface. No dark-on-dark text anywhere — every label, title, and legend entry is clearly visible.
      Data: Identical green (#009E73) / red (#AE3030) line colors and identical data values/positions as the light render — only the chrome (background, text color) flipped, confirming the data-color-constancy rule.
      Legibility verdict: PASS
