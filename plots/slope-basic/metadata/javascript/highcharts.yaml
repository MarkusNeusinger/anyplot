review:
  strengths:
  - 'Correct Imprint semantic color mapping: brand green (palette[0]) for "Improved",
    matte-red semantic anchor (palette[4]) for "Declined" — matches the style guide''s
    finance/sentiment semantic-exception rule'
  - Direct dual-endpoint data labels (name + value at both Survey Wave 1 and Survey
    Wave 2) satisfy the spec's "labels at both endpoints" requirement without relying
    on hover
  - 'Clean, minimal chrome: no gridlines, transparent background, theme-adaptive ink
    tokens correctly threaded through title/axis/legend/dataLabels in both light and
    dark renders'
  - Phantom-series legend pattern (showInLegend:false on the 10 real product lines,
    two empty dummy series for "Improved"/"Declined") avoids an unreadable 10-entry
    legend while still explaining the color coding
  - Color direction is redundantly encoded by each line's slope (up = improved, down
    = declined), keeping the chart colorblind-safe despite the red/green semantic
    choice
  weaknesses:
  - Y-axis is fixed to a 40-100 range while actual data spans only 55-91, leaving
    roughly 30% of the vertical canvas as dead space above and below the data band
    — tighten the domain (e.g. ~50-95) for better canvas utilization (VQ-05)
  - A few endpoint label pairs sit close together vertically (e.g. '84 · CoreLogic'
    / '82 · TaskFlow' and '78 · CloudSync' / '76 · FlowStream' on Survey Wave 2; the
    80/77/74 cluster on Survey Wave 1) — not clipped but tight; consider a small collision-nudge
    or leader-line offset when two labels fall within ~3 score points of each other
    (VQ-02)
  - plotOptions.series.enableMouseTracking:false disables all native Highcharts hover/tooltip
    interactivity for every series, discarding the interactive library's distinctive
    value-add in the HTML detail view; since data is already fully labeled, consider
    re-enabling tooltips instead of disabling tracking entirely (LM-02)
  - No explicit callout/annotation on the standout mover (e.g. NetGuard +17 or LinkHub
    -18) — a small highlight would sharpen the data-storytelling focal point (DE-03)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "slope-basic · javascript · highcharts · anyplot.ai" bold dark text at top center; y-axis title "Customer Satisfaction Score" and tick labels (40-100) in soft dark gray on the left; x-axis category labels "Survey Wave 1" / "Survey Wave 2" below the two vertical lanes; legend ("Improved" / "Declined") centered at the bottom. All chrome text is dark and clearly legible against the light background.
      Data: 10 product lines connect Wave 1 to Wave 2 values, each line colored brand green (#009E73, "Improved") or matte red ("Declined") depending on direction. Direct data labels showing "{name} · {value}" flank both endpoints of every line, right-aligned on the left column and left-aligned on the right column, in soft ink color. Markers are small filled circles at each endpoint.
      Legibility verdict: PASS — every title, axis label, tick label, and data label is clearly readable; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, tick labels, category labels, and legend, now rendered in light gray/off-white tones against the dark background. Layout is pixel-identical to the light render.
      Data: The same 10 lines with identical brand-green and matte-red hues as the light render — data colors did not shift between themes, only the chrome (text, background) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, tick labels, data labels, legend) is clearly visible against the near-black surface.
