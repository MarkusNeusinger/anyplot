review:
  strengths:
  - 'Correct slope-chart construction: uses a continuous value y-axis (min 62 / max
    90) instead of equal-spaced rows, so vertical position reflects the actual score
    magnitude at each time point.'
  - Semantic red/green line coloring for decrease/increase is redundant with the visible
    slope direction, so the chart stays readable without relying on hue alone.
  - Direct per-line data labels at both endpoints replace a crowded 10-entry legend,
    keeping the chart clean.
  - 'Theme-adaptive chrome verified correct in both light and dark renders; Imprint
    data colors (#009E73 / #AE3030) are identical across themes, only chrome flips.'
  - Realistic, neutral business dataset (employee engagement scores) covering a good
    range of magnitudes, from a +15 point jump (Support) to a small -1 dip (Legal).
  weaknesses:
  - Grid margins (left:300, right:300 CSS px on a 1200px mount) leave a lot of empty
    canvas at the far left/right edges beyond where the text labels actually end —
    tighten to ~180-200px given the longest label ('Engineering  72') to raise canvas
    fill.
  - 'symbolSize: 8 is a bit small for only 10 sparse two-point series — bump to ~10-12
    for more prominent, publication-ready markers given the low data density (<50
    points).'
  - 'LM-02: the per-point label formatter + itemStyle coloring is a generic pattern
    easily replicated in any charting library; nothing here leverages an ECharts-distinctive
    capability (e.g. graphic elements, emphasis/focus states, custom label layout
    avoidance).'
  - Data labels for closely-valued entities ('Design 73' / 'Engineering 72', only
    1 point apart on the value axis) sit close together vertically — legible at full
    size but tightens up when the image is scaled to mobile widths.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Employee Engagement Score · slope-basic · javascript · echarts · anyplot.ai" in dark ink at top, centered, clearly legible. "2024 (before)" / "2025 (after)" axis labels in soft dark gray at the bottom, sitting on a thin baseline. No grid lines, no visible spines other than the bottom axis rule.
      Data: 10 department lines connecting a 2024 value (left) to a 2025 value (right), each endpoint marked with a filled circle and a text label showing the department name and score. Lines trending up-right are brand green (#009E73), lines trending down-right are matte red (#AE3030). Values range 64-88.
      Legibility verdict: PASS — all text (title, axis labels, data labels) is dark-on-light and clearly readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis labels now rendered in light ink/gray, clearly visible against the dark surface. No dark-on-dark text detected — all title, axis, and data labels read cleanly.
      Data: Identical layout and identical green (#009E73) / red (#AE3030) line colors to the light render — only the chrome (background, text) flipped, confirming theme-adaptive tokens were threaded through correctly.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements remain clearly distinguishable from the background.
