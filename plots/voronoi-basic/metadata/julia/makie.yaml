review:
  strengths:
  - Uses Makie's native voronoiplot! recipe with automatic bounding-box clipping (clip=bbox)
    — cleanly avoids unbounded edge regions, a genuinely distinctive Makie strength.
  - Continuous imprint_seq colormap encodes daily foot traffic per cell, adding a
    real data dimension beyond a plain seed-point Voronoi and creating visual hierarchy
    across the city map.
  - 'Full theme-adaptive chrome: backgrounds, title/axis/tick colors, and marker colors
    (INK) all correctly flip between light and dark renders while the Imprint data
    gradient stays identical.'
  - Cell boundaries use explicit strokecolor/strokewidth, so adjacent regions stay
    visually distinguishable even where fill hues are similar.
  - 'Clean, reproducible KISS script: single Random.seed!(42), only CairoMakie + Random
    imported, no fake UI.'
  weaknesses:
  - Title ('voronoi-basic · julia · makie · anyplot.ai') renders at only ~23% of canvas
    width (measured ~740px of 3200px) — well below the ~50-70% target the style guide
    gives for a short mandated title. Increase titlesize from 20 toward ~28-30 to
    give the title proper visual weight without risking overflow.
  - 'Design Excellence reads as competent-but-standard rather than publication-ready:
    the data-driven coloring is a nice touch, but the rest of the layout leans on
    fairly standard Axis/Colorbar defaults (uniform margins, no additional refinement).
    Consider a bit more visual polish — e.g. a slightly larger/refined colorbar, tighter
    tick formatting, or subtle emphasis on the highest-traffic cell — to push past
    ''good default'' territory.'
  - With only 26 sparse seed points, markersize=14 is adequate but not especially
    prominent against the colored cells. Per the sparse-data heuristic (<50 points
    -> larger, prominent markers), consider bumping markersize to ~16-18 for stronger
    emphasis.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "voronoi-basic · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center (measured ~23% of canvas width — smaller than the 50-70% target for a short title, but fully legible, not clipped). Axis labels "X Position (km)" / "Y Position (km)" in dark ink, readable. Tick labels in a softer grey, readable. Colorbar on the right labeled "Daily Visits" with tick labels 500/1000/1500 in dark ink, fully visible, not clipped.
      Data: 26 Voronoi cells fill the plot area, colored via the imprint_seq green-to-blue gradient keyed to daily_visits; cell borders are solid dark strokes so adjacent similar-hued cells stay distinguishable; seed points are black dots, clearly visible against every cell color.
      Legibility verdict: PASS — all text is readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels in light cream ink, clearly readable. Tick labels in a softer light grey, readable. Colorbar tick labels and "Daily Visits" label in light ink, fully visible, not clipped.
      Data: Same imprint_seq green-to-blue gradient and cell boundaries as the light render — data colors are identical between themes, only chrome (background, text, stroke on markers) flipped. Seed points are white dots (INK token flipped), clearly visible against every cell color.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/colorbar text is light-colored and clearly legible against the near-black background.
