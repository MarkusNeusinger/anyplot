review:
  strengths:
  - 'Neighbour-aware colouring: each cell takes the first Imprint colour unused by
    the cells it shares an edge with, so adjacent cells always differ (C4)'
  - Correct square 2400×2400 canvas with a coord_fixed full-bleed panel clipped exactly
    to the 0–100 box
  - Seed markers invert fill and outline with the theme (page fill, ink outline) and
    stand out from every cell fill in both renders
  - Style-guide font sizes and theme tokens threaded through every chrome element;
    both themes read cleanly
  - Adaptable data block with X_COORD / Y_COORD constants read through .data[[...]]
  weaknesses:
  - 'VQ-03 (both): the two seeds at about (70.6, 0.3) and (72, 0.8) are drawn as half
    circles cut off by the bottom panel edge → show the whole marker at its data value.
    Likely cause: coord_fixed() clips layers to the panel; coord_fixed(clip = "off").'
  - 'SC-02 (both): cell edges are visibly stair-stepped along every diagonal boundary
    instead of straight (C2) → straight polygon edges. Likely cause: the 700×700 nearest-seed
    raster (geom_raster) approximates the cells; clip each cell as an intersection
    of half-planes and draw it with geom_polygon.'
  - 'VQ-06 (both): axis titles are the bare identifiers ''x'' and ''y'' → a reader
    label with a unit, e.g. ''Easting (km)'' / ''Northing (km)''. Likely cause: X_COORD
    / Y_COORD set to ''x'' / ''y''.'
  - 'DQ-02 (both): the seeds are 25 abstract random points on a unitless 0–100 square
    with generic ''x'' / ''y'' columns → a named spatial context such as store or
    cell-tower locations in km. Likely cause: the column constants and the runif data
    block.'
  - 'CQ-03 (code): line 7 library(dplyr) is never used → remove. Likely cause: copied
    from the skeleton.'
  - 'Suggestion: seed labels, which the Data allows, would tie each cell to an identifiable
    location.'
