review:
  strengths:
  - Correct Voronoi construction with scipy.spatial.Voronoi and mirrored seeds, so
    every cell is bounded and clipped to the box with straight convex edges
  - Greedy colouring over the ridge adjacency guarantees that cells sharing an edge
    never share a fill
  - Seeds drawn as ink dots with a page-colored ring and cell edges in the page color,
    both flipping with the theme, so seeds and boundaries read in both renders
  - 'Grammar-native composition: tidy polygon frame, geom_polygon(group=...), scale_fill_identity
    and coord_fixed(expand=False)'
  weaknesses:
  - 'VQ-07 (both): the semantic red anchor #AE3030 fills four ordinary cells (e.g.
    the cells around seeds at about (2.2, 7.2), (4.4, 6.5) and (7.6, 1.3)) by palette
    position, although the style guide reserves slot 5 for bad/loss/error roles →
    colour the adjacency from the seven non-red Imprint hues (a planar map needs at
    most four). Likely cause: IMPRINT_PALETTE lists all eight positions and the greedy
    colouring picks from all of them.'
  - 'CQ-04 (code): the mirrors are placed at 2*x_min - margin - x (and analogues),
    so their bisectors fall outside the box and lines 84-101 hand-write Sutherland-Hodgman
    clipping → reflect the seeds exactly across the box edges (2*x_min - x, 2*x_max
    - x, 2*y_min - y, 2*y_max - y); the real cells then end at the box and vor.regions
    can be drawn directly, removing the clipping loop (about 17 lines). Likely cause:
    the margin term in the mirrors block (lines 58-66).'
  - 'Suggestion: seed labels (the Data allows a label column) next to a few seeds
    could name the towers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel, thin INK_SOFT frame around the square panel.
