review:
  strengths:
  - 'Correct Voronoi geometry: scipy.spatial.Voronoi with mirrored seeds bounds every
    real cell, and Sutherland-Hodgman clipping makes the 20 cells tile the bounding
    box with no gaps or overlaps; every edge is straight and every cell convex'
  - A greedy colouring over vor.ridge_points means no two cells that share an edge
    get the same Imprint hue, and all eight hues are spread evenly. Adjacent cells
    always differ, as the spec asks
  - Cell edges are drawn in the page colour, so they read as light seams on the light
    render and dark seams on the dark render, and the boundaries stay visible in both
    themes
  - Seeds sit at their exact coordinates as INK-filled dots with a page-coloured ring,
    so they stand out from all eight fills in both themes
  - 'Idiomatic plotnine: geom_polygon with a group aesthetic, scale_fill_identity
    for precomputed hues, coord_fixed(ratio=1, expand=False) so the panel equals the
    clipping box and distances are not distorted'
  weaknesses:
  - 'VQ-06 (both): the axis titles read ''X Coordinate'' and ''Y Coordinate'', with
    no unit or real-world quantity → name the measure with its unit (e.g. ''Easting
    (km)'' / ''Northing (km)''). Likely cause: the X and Y column constants on lines
    41–42.'
  - 'DQ-02 (both): the seeds are 20 unnamed uniform-random points on an abstract 1–9
    plane, a plausible but generic scenario → give them a concrete neutral context,
    such as store or cell-tower locations on a city grid in km, reflected in the column
    names. Likely cause: the data block on lines 45–47 and the column constants.'
  - 'Suggestion: optional seed labels (the Data allows a label column), placed next
    to each seed, would show which facility owns each cell.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 surface, 2400x2400 square canvas.
      Chrome: bold near-black title "voronoi-basic · python · plotnine · anyplot.ai" centered at about 70 % of the width; axis titles "X Coordinate" / "Y Coordinate" in INK; tick labels 2.5 / 5.0 / 7.5 in INK_SOFT, with unlabelled minor ticks; a thin INK_SOFT panel border; no grid. All of it readable.
      Data: 20 convex Voronoi cells tile the bounding box, filled with all eight Imprint hues (#009E73 green, lavender, blue, ochre, matte red, cyan, rose, lime). No two cells that share an edge have the same fill. Cell edges are off-white seams. Each seed is a near-black dot with an off-white ring at its coordinates, clearly visible on every fill, including the dark red and blue cells. Two close seed pairs (around (2.5, 9) and (8.7, 2.2)) each sit in their own cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 surface.
      Chrome: title, axis titles and tick labels flip to light text (#F0EFE8 / #B8B7B0) and are fully readable. No dark-on-dark text. The panel border is light grey.
      Data: the cell fills are identical to the light render, same hue per cell. The edges flip to near-black seams, which stay visible between all fills. The seeds flip to off-white dots with a near-black ring, and they stand out on every fill. Brand green #009E73 cells remain clearly visible.
      Legibility verdict: PASS
