      Data: 20 Voronoi cells filled from the Imprint palette (#009E73 green, lavender, blue, ochre, matte red, cyan, rose, lime), no two edge-sharing cells alike, separated by off-white edges; outer cells clipped at the box; 20 near-black seed dots with off-white rings sit inside their cells.
