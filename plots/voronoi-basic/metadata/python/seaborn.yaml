review:
  strengths:
  - 'Exact Voronoi geometry: distant helper seeds make every real cell finite and
    each cell polygon is cut at the 0–100 km box with a Rectangle clip path, so all
    20 cells tile the box without gaps and every seed sits inside its own convex cell
    in both renders'
  - Neighbour-aware colouring from vor.ridge_points gives every pair of cells that
    share an edge a different Imprint fill (green, lavender, blue, ochre, red), meeting
    the spec's adjacent-cell distinction with only five palette positions
  - Seeds drawn via sns.scatterplot(data=df, x=X, y=Y) in INK with a page-coloured
    halo stand out from every fill in both themes
  - 'Theme tokens threaded through sns.set_theme(rc=...) — title, axis titles, ticks,
    spines and cell edges all flip correctly between #FAF8F1 and #1A1A17 while the
    fills stay identical'
  - Square 2400×2400 canvas with equal aspect, default savefig bbox and style-guide
    font sizes (12/10/8 pt)
  weaknesses:
  - 'DQ-02 (both): the axes read ''X coordinate (km)'' / ''Y coordinate (km)'' over
    uniform random seeds, an abstract plane with no service-area or territory context
    → name the scenario in the labels, e.g. ''Easting (km)'' / ''Northing (km)'' for
    store or station sites. Likely cause: the X/Y column constants and the bare rng.uniform
    data block.'
  - 'Suggestion: optional short seed labels (the Data allows a label column) placed
    next to each seed would tie the cells to named sites.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400×2400 square canvas
      Chrome: title "voronoi-basic · python · seaborn · anyplot.ai" in dark ink at ~60% width; axis titles "X coordinate (km)" / "Y coordinate (km)" and 0–100 ticks in dark soft grey; four spines frame the bounding box; no grid. All readable.
      Data: 20 convex Voronoi cells tiling the 0–100 box, filled with Imprint green #009E73, lavender, blue, ochre and red at alpha 0.75 with dark-grey edges; adjacent cells always differ in colour; outer cells cut cleanly at the box. Seeds are near-black dots with off-white halos, each inside its own cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title, axis titles in light ink; ticks, spines and cell edges in light grey #B8B7B0; no dark-on-dark text.
      Data: same cells and same Imprint fill colours as the light render (alpha over the dark page darkens them, as expected); seeds are off-white dots with dark halos, clearly visible on every fill.
      Legibility verdict: PASS
