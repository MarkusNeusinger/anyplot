review:
  strengths:
  - 'Correct Voronoi geometry: scipy.spatial.Voronoi with far guard points makes every
    cell finite, and each cell is clipped exactly to the bounding box, so the cells
    tile the box with no gaps or overlaps'
  - yaxis scaleanchor='x' with scaleratio=1 keeps the 1:1 aspect, so cell edges really
    are perpendicular bisectors on screen and every cell reads as a convex polygon
  - A greedy smallest-last colouring over the Voronoi ridges gives adjacent cells
    different Imprint fills; four positions (#009E73 first) are enough for 20 cells
  - Seed markers in INK with an ELEVATED_BG halo stand out from every fill in both
    themes and sit at their exact coordinates
  - go.Scatter fill='toself' polygons plus a hovertemplate driven by customdata show
    the store name and coordinates in the HTML view, while cells use hoverinfo='skip'
    to keep hover focused on the seeds
  weaknesses:
  - 'CQ-01 (code): lines 64–81 define a helper function `clip_to_box` (Sutherland–Hodgman),
    and the KISS structure allows no functions → inline the clipping loop in the per-cell
    loop at lines 106–110. Likely cause: the clipping step was wrapped in a def.'
  - 'DQ-03 (both): seeds are labelled Latitude/Longitude in degrees, but they are
    drawn uniformly from 10–90°, which puts retail stores up to 87° N (near the pole)
    and spreads them over a continent-sized 80° × 80° area → a city-scale extent (for
    example about 0.3° of latitude and longitude around a real city centre), or plain
    km axes. Likely cause: np.random.uniform(10, 90) under degree column names.'
  - 'DQ-02 (both): the stores are named ''Store 0'' … ''Store 19'', which reads as
    generic placeholder data → names that fit a plausible scenario (for example neighbourhood
    or branch names). Likely cause: the f''Store {i}'' label list.'
  - 'Suggestion: seed labels next to the markers (the Data allows a label column)
    would let the static PNG name each service area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the paper and the plot area; square 2400×2400 canvas.
