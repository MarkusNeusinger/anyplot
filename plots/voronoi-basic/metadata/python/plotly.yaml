      Data: 20 Voronoi cells clipped to the bounding box, with semi-transparent fills (alpha 0.6) in Imprint green #009E73, lavender #C475FD, blue #4467A3 and ochre #BD8233, coloured so that adjacent cells differ; dark-gray cell edges at 1.5 px; near-black seed dots with a cream halo, one per cell, at their exact positions. The cells tile the box completely.
