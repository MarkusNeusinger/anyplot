review:
  strengths:
  - Greedy coloring over scipy's Voronoi ridge_points gives cells that share an edge
    different Imprint fills, so neighbouring regions are always distinguishable (C4)
  - Square, data-derived bounding box with coord_fixed keeps every bisector at right
    angles and every cell convex (C2)
  - Ring-and-core seed markers built from INK and PAGE_BG stand out on every fill
    in both themes (C3)
  - One-panel gggrid wrap paints the full 2400x2400 canvas in the page color around
    the fixed-aspect plot
  weaknesses:
  - 'Suggestion: seed labels (the Data''s optional label column, e.g. station ids)
    next to each seed would make the cells identifiable in the static render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole 2400x2400 square canvas, edges included.
      Chrome: title 'voronoi-basic · python · letsplot · anyplot.ai' top-left in dark ink (~57% of the width); axis titles 'Easting (km)' / 'Northing (km)' in dark ink, ticks (x 20-80, y 20-85) in dark soft ink; thin dark frame, no grid. All readable.
      Data: 20 Voronoi cells tiling a square box, filled at alpha 0.7 with Imprint green #009E73, lavender, blue and ochre; cells sharing an edge always differ in color; dark-grey edges; seeds drawn as dark rings with light cores at their exact positions in two clusters (lower-left, upper-right).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the whole canvas.
      Chrome: title, axis titles and ticks in light ink; light-grey cell edges and frame; no dark-on-dark text.
      Data: identical cell geometry and identical color assignment as light (fills read deeper because of alpha over the dark page); seed markers flip to light rings with dark cores and stand out on every fill.
      Legibility verdict: PASS
