review:
  strengths:
  - Greedy graph coloring gives cells that share an edge different Imprint colors,
    so adjacent regions are always distinguishable (C4)
  - Square, data-derived bounding box with coord_fixed keeps every bisector at right
    angles and every cell convex (C2)
  - Ring-and-core seed markers built from INK and PAGE_BG stand out on every fill
    in both themes (C3)
  - Correct 2400x2400 square canvas with style-guide font sizes and fully theme-adaptive
    chrome
  weaknesses:
  - 'CQ-01 (code): a helper function clip_half_plane() is defined at lines 74-84 →
    inline the clipping in the cell loop, or clip scipy.spatial.Voronoi regions directly
    without a def. Likely cause: the half-plane clip was factored into a function.'
  - 'CQ-04 (code): lines 96-107 find neighbouring cells by matching polygon vertices
    with np.isclose over every pair (~12 lines) → read the neighbour pairs from `scipy.spatial.Voronoi(pts).ridge_points`
    (scipy). Likely cause: the Voronoi cells are built by hand, so the adjacency scipy
    computes is not available.'
  - 'DQ-02 (both): the seeds are an anonymous random plane with axes ''X Coordinate''
    / ''Y Coordinate'' → a concrete scenario such as store or station locations with
    distance axes (e.g. ''Easting (km)'' / ''Northing (km)''). Likely cause: the X/Y
    column names and the unlabelled seed data.'
  - 'Suggestion: seed labels (the Data''s optional label column) next to each seed
    would make the cells identifiable in the static render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400 square canvas.
      Chrome: title 'voronoi-basic · python · letsplot · anyplot.ai' top-left in dark ink (~57% of width); axis titles 'X Coordinate' / 'Y Coordinate' and ticks (x 20-80, y 20-85) in dark soft ink; panel framed by a thin dark axis line, no grid. All readable.
      Data: 20 Voronoi cells tiling a square box (~12-86 x, ~15-88 y), filled at alpha 0.7 with Imprint green #009E73, lavender, blue, ochre and one red cell; neighbouring cells always differ in color; dark-grey edges; seeds drawn as dark rings with light cores at their exact positions, two clusters (lower-left, upper-right).
