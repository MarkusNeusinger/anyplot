review:
  strengths:
  - 'Every pair of neighbouring cells differs in color: a greedy coloring over scipy''s
    ridge_points uses Imprint positions 1-4, so C4 holds without extra hues'
  - Bounded cells built idiomatically by mirroring the seeds across the box edges
    before scipy.spatial.Voronoi, drawn as one PolyCollection
  - Theme tokens threaded through title, labels, ticks, spines, grid and edges; fills
    identical in both renders and all text readable on both backgrounds
  - 'Adaptable layout: column constants, a Data block binding df, and limits derived
    from the data'
  weaknesses:
  - 'VQ-06, DQ-02 (both): the scenario is anonymous random seeds and the axes read
    ''X coordinate'' / ''Y coordinate'' with no unit → a real scenario from the spec''s
    Applications, e.g. store locations with ''Easting (km)'' / ''Northing (km)''.
    Likely cause: the X/Y constants and the uniform random data block.'
  - 'Suggestion: the box padding leaves a band of empty canvas above and below the
    square axes; a box matched to the canvas aspect would use the space better.'
  - 'Suggestion: the np.clip on the polygon vertices is a no-op after mirroring and
    could be dropped.'
