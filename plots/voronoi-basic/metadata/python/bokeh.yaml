review:
  strengths:
  - 'Mirrors the seeds across the bounding box before scipy.spatial.Voronoi, so every
    cell is finite and ends exactly at the box: correct clipped tiling with straight
    convex edges (C1, C2).'
  - Bounding box derived from the data (padded, snapped outward) rather than typed
    numbers, and the plot block reads only df and the column constants.
  - Theme tokens threaded through every chrome element; both renders fully legible,
    data colors identical across themes.
  - Exact 3200x1800 canvas via toolbar_location=None, min_border_* and the CDP viewport
    override.
  weaknesses:
  - 'VQ-03 (both): the #009E73 seeds inside the cells filled with Imprint position
    1 green (four cells, e.g. lower left and upper right) blend into the fill, most
    in dark where the dark green cell meets a dark ring, so they do not stand out
    from every fill (C3) → seeds in a color no cell uses (INK fill with a PAGE_BG
    ring) or cells drawn from palette positions 2-8. Likely cause: seed color=BRAND
    while cell_color cycles from IMPRINT_PALETTE[0].'
  - 'DQ-02 (both): the seeds are anonymous random points on an abstract 0-10 plane
    labelled ''X Coordinate'' / ''Y Coordinate'', so the diagram names no real-world
    context → give the seeds a domain from the spec''s Applications (for example store
    or cell-tower sites with ''Easting (km)'' / ''Northing (km)''). Likely cause:
    the generic column constants and the uniform random data block.'
  - 'CQ-04 (code): lines 90-145 write out a 56-line Sutherland-Hodgman clip that changes
    no vertex, because the seeds mirrored across the four box edges already bound
    every original cell exactly at the box → delete the clip loop and draw vor.vertices[region]
    directly (np.clip(..., x_min, x_max) if float noise matters). Likely cause: clipping
    kept from an approach without the mirrored seeds.'
  - 'Suggestion: assign cell colors by a greedy neighbour coloring so cells that share
    an edge (the two tan cells near x 6, y 7.4; the two teal cells on the right edge)
    never share a fill.'
  - 'Suggestion: a HoverTool on the seeds showing their coordinates would add value
    to the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around and inside the plot frame.
      Chrome: bold title 'voronoi-basic · python · bokeh · anyplot.ai' top left in dark ink; italic axis titles 'X Coordinate' / 'Y Coordinate'; ticks 0-10 every 2 in INK_SOFT; faint grid. All readable.
      Data: 20 convex Voronoi cells tiling the 0-10 box, half-alpha fills cycling the eight Imprint hues (green, purple, blue, ochre, red, cyan, plum, olive) with dark grey 2.5 px edges; 20 #009E73 seeds with an off-white ring. Seeds in the green cells blend somewhat into the fill. Two tan cells and two teal cells share edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink, clearly readable; no dark-on-dark text.
      Data: identical cell geometry and hues (half-alpha over the dark surface, so they read deeper), light grey edges, green seeds with a dark ring; seeds in the dark green cells have low contrast but remain visible.
      Legibility verdict: PASS
