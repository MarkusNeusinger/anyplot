review:
  strengths:
  - 'Exact clipping: mirroring every seed across the four box edges makes scipy''s
    Voronoi cells end exactly at the bounding box, so the 15 cells tile it without
    gaps or overlaps'
  - Greedy neighbour coloring over vor.ridge_points guarantees that cells sharing
    an edge get different Imprint colors
  - Seeds drawn in INK with a page-colored halo stand out from every fill in both
    themes
  - 'Idiomatic Altair polygons: mark_line(filled=True, interpolate=''linear-closed'')
    with detail and order encodings, identity colors via scale=None'
  - Seed tooltips (station, x, y) add inspection in the HTML output
  weaknesses:
  - 'SC-02 (both): the x domain spans about 99 units and the y domain about 80 units
    on a 440x440 view, so y is stretched about 1.25x and cell edges are not drawn
    at right angles to the lines joining their seeds (spec bullet C2), e.g. the Station
    6 / Station 14 edge → equal units per pixel on both axes (view height/width proportional
    to the y/x box spans, or a square clipping box). Likely cause: width=440, height=440
    with box_min/box_max taken from the seeds'' own x and y spans.'
  - 'VQ-02 (both): the labels of Station 4, 6, 8, 10 and 14 are crossed by the 2 px
    cell-edge strokes, which run through their letters → labels clear of the edge
    strokes (smaller fontSize or a page-colored halo stroke on the text). Likely cause:
    mark_text dy=-14/16 with fontSize=11 next to seeds that sit close to an edge.'
  - 'VQ-06 (both): axis titles ''X coordinate'' and ''Y coordinate'' carry no unit
    → a unit for the area, e.g. ''Easting (km)'' / ''Northing (km)''. Likely cause:
    the X and Y column constants.'
  - 'DQ-02 (both): the seeds are labelled ''Station 1'' … ''Station 15'' on abstract
    X/Y coordinates, which reads generic → real-sounding station names (e.g. ''Hillcrest'',
    ''Riverside''). Likely cause: the STATION label list f"Station {i + 1}".'
  - 'CQ-01 (code): a label_layer() helper function (lines 129-138) where two inline
    layers would do → inline the two mark_text layers. Likely cause: the above/below
    label split.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas with the chart centered.
      Chrome: title "voronoi-basic · python · altair · anyplot.ai" in dark ink, centered; axis titles "X coordinate" / "Y coordinate" bold dark; ticks 10-90 and 5-80 in INK_SOFT; no grid; view framed by a gray stroke. All readable.
      Data: 15 Voronoi cells clipped to the box, filled with Imprint green #009E73, lilac #C475FD, blue #4467A3 and one ochre #BD8233 cell at 0.55 opacity with 2 px gray edges; no two neighbouring cells share a color. 15 near-black seeds with off-white halos, each labelled "Station N" above or below. Some labels (Station 4, 6, 8, 10, 14) are crossed by edge strokes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles light ink, ticks light gray, frame light gray; no dark-on-dark text.
      Data: same cell geometry and the same Imprint hues (they read deeper over the dark page through the 0.55 opacity); light-gray edges; seeds flip to off-white with dark halos; labels light ink. Brand green clearly visible.
      Legibility verdict: PASS
