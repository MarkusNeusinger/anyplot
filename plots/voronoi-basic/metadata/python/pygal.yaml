review:
  strengths:
  - 'Cells are computed exactly: each is the bounding box cut by the perpendicular-bisector
    half-plane of every other seed, so edges are straight, cells convex and clipped
    to the box'
  - Greedy coloring over scipy Voronoi ridge_points guarantees that cells sharing
    an edge never share a color
  - Seed dots with a page-colored halo stand out from every fill in both themes
  - Uses pygal.XY with a theme-adaptive Style and inline CSS; the HTML output carries
    per-seed coordinate tooltips
  weaknesses:
  - 'VQ-01 (both): title at 52, axis titles at 44 and tick labels at 38 sit below
    the pygal reference sizes 66 / 56 / 44 and read small on the 2400 px canvas →
    title 66 (+14), axis titles 56 (+12), tick labels 44 (+6). Likely cause: title_font_size=52,
    label_font_size=44, major_label_font_size=38 in the Style.'
  - 'DQ-02 (both): the seeds are anonymous uniform random points and the axes read
    ''X coordinate (units)'' / ''Y coordinate (units)'', a placeholder unit → name
    a concrete scenario, e.g. store locations with ''Easting (km)'' / ''Northing (km)''.
    Likely cause: the X and Y column names and the rng.uniform data block.'
  - 'CQ-01 (code): cell_polygon() wraps the clipping loop in a function (lines 39-57)
    → inline the loop into the list comprehension''s for-loop at module level. Likely
    cause: the per-seed helper.'
  - 'Suggestion: the closed-polygon fill relies on overriding private chart._self_close
    and chart._fill; a public route would survive pygal upgrades better.'
