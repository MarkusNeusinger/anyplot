review:
  strengths:
  - Genuine, correctly-implemented Voronoi tessellation via a hand-rolled Sutherland-Hodgman
    half-plane clipping algorithm run in a Chart.js beforeDatasetsDraw plugin hook
    -- a real feat of library mastery since Chart.js has no native Voronoi support
    and the spec cannot be faked with a scatter plot alone.
  - Cells are correctly clipped to the visible chartArea bounding box, each cell is
    a distinct fill color, and every seed point is clearly marked with a white-ring
    border and an above-point label -- all three spec requirements (clipped cells,
    distinguishable regions, marked seeds) are met.
  - The 4x4 jittered grid combined with palette[i % 8] cycling means same-hue cells
    never end up spatially adjacent, so all 16 regions stay visually distinguishable
    despite reusing 8 hues across 16 sites.
  - 'Theme handling is correct: data/cell colors are pixel-identical between light
    and dark renders, and only chrome (background, ink, cell border stroke using t.pageBg)
    flips.'
  - Title, axis titles, tick labels, and cell labels all have explicit font sizes
    and remain legible even at the 400px mobile thumbnail.
  weaknesses:
  - 'CQ-01: the implementation needs two helper functions (hexToRgba, clipToBisector)
    plus a two-hook plugin object to do the geometry -- justified by the Voronoi math,
    but it''s further from the flat single-script KISS ideal than a typical basic
    chart.'
  - 'DE-03: storytelling stops at ''colored territory + labeled seed''; there is no
    secondary encoding (e.g. cell-area shading, distance-to-nearest-neighbor annotation)
    that would deepen the spatial-influence narrative the spec applications section
    describes (retail service-area coverage, etc.).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light chrome spec.
      Chrome: Bold dark title "voronoi-basic · javascript · chartjs · anyplot.ai" centered at top, fully visible, not clipped. Dark axis titles "Distance East (km)" / "Distance North (km)" and dark tick labels (0-100, step 10) on both axes -- all clearly readable against the light background. No grid lines (intentionally disabled; the cell boundaries themselves provide structure).
      Data: 16 Voronoi cells tile the full 0-100 x 0-100 plotting area, each filled with a distinct Imprint palette hue at ~32% alpha and separated by a thin off-white (page-background-colored) border. Each cell contains one seed point rendered as a solid-color disc (matching the cell's palette color) with a white ring border, with a single uppercase letter label (A-P) placed just above each point in dark ink. First seed (A) uses Imprint brand green #009E73, consistent with the palette rule. No overlapping text or markers, no clipping at any canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark chrome spec.
      Chrome: Same title, now rendered in light/white ink, fully visible and not clipped. Axis titles and tick labels rendered in light ink, clearly legible against the near-black background. No grid lines, matching the light render's layout choice.
      Data: Same 16 cells in the same positions with the identical Imprint palette hues and alpha (colors read a bit richer/darker against the dark backdrop purely due to alpha blending over a dark base, but the underlying hues and seed marker colors are unchanged from the light render, as required). Seed markers keep their white ring borders (now higher-contrast against the darker cell fills), labels stay in light ink above each point, single letters A-P all readable with no dark-on-dark text anywhere.
      Legibility verdict: PASS
