review:
  strengths:
  - Genuine deterministic Voronoi computation via half-plane (Sutherland-Hodgman-style)
    polygon clipping against every pairwise bisector — not simulated, not offloaded
    to an unsupported extension.
  - Cells are cleanly clipped to the bounding box per the spec note, with a pageBg-colored
    3px stroke that reads as a crisp grout line separating adjacent regions in both
    themes.
  - Imprint palette and theme tokens are threaded through title, axis names, tick
    labels, and chrome; data colors are pixel-identical between light and dark renders
    — only chrome flips.
  - Seed markers use theme-adaptive fill/border (t.ink / t.pageBg) and stay crisply
    visible against every cell color in both renders.
  - 'Correct square canvas via the `anyplot-orientation: square` directive; data generated
    with a seeded LCG (seed=42) for full reproducibility.'
  weaknesses:
  - Cell fill colors are assigned via `dataIndex % palette.length` (8 colors cycling
    across 14 cells) rather than an adjacency-aware coloring; with a different seed,
    two spatially adjacent cells could land on the same palette color, relying solely
    on the stroke to disambiguate them. A DSATUR/greedy graph-coloring pass over cell
    adjacency would make this robust across arbitrary point sets.
  - No visual hierarchy beyond uniform cell coloring and seed markers — every region
    gets equal visual weight, which is functionally correct but leaves DE-03 storytelling
    minimal (e.g., no emphasis on a notably large/small service area).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light chrome spec.
      Chrome: Title "Retail Store Service Areas · voronoi-basic · javascript · echarts · anyplot.ai" is centered, dark ink text, fully legible. X-axis "X coordinate (km)" and Y-axis "Y coordinate (km)" labels present with units, dark ink. Tick labels (0/20/40/60/80/100 on both axes) are soft-ink and clearly readable against the light background.
      Data: 14 irregular polygonal cells fill the 0-100 x 0-100 bounding box, each a distinct Imprint palette hue at ~62% opacity with a light (pageBg-colored) stroke separating neighbors. Each cell contains one dark, light-bordered circular seed marker at its store location. Cells are cleanly clipped to the square bounding box (no infinite regions).
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark chrome spec.
      Chrome: Title, axis names, and tick labels have flipped to light ink/soft-ink tones and remain fully legible against the dark background. No dark-on-dark text anywhere.
      Data: Same 14 cells in identical Imprint palette hues as the light render (colors unchanged — only chrome flipped), same clipping to bounds, same layout. Seed markers flip to a light fill with a dark border, staying visible against every cell color.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable; no dark-on-dark issues.
