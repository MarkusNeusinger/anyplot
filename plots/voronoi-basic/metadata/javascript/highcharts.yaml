review:
  strengths:
  - Custom Voronoi diagram built from scratch via half-plane intersection + Sutherland-Hodgman
    polygon clipping, correctly avoiding the forbidden highcharts-more/modules add-ons
    that aren't vendored
  - Adjacency-aware greedy graph coloring ensures no two neighboring cells share a
    color, meaningfully improving cell distinguishability beyond a flat index-mod-palette
    cycle
  - Data colors (cell fills, seed markers) are pixel-identical between light and dark
    renders; only chrome (background, text, strokes) adapts to theme
  - Seed points are inset from the bounding-box edges (SITE_MARGIN) so data labels
    never collide with the plot border, and pageBg-colored cell strokes give crisp
    separation between regions
  - Descriptive, unit-bearing axis titles ('Distance east/north (km)') and correctly
    formatted spec title
  weaknesses:
  - The 'Riverside' data label overlaps the neighboring 'Maple Grove' seed marker
    in both themes (the 'R' glyph is partially covered by the marker's white stroke)
    because the two sites sit close together and the fixed y:-14 label offset isn't
    enough to clear a nearby marker — add pairwise-distance-aware label placement
    (flip offset direction, or set dataLabels.allowOverlap:false with collision avoidance)
    for closely spaced sites
  - The central cluster (Maple Grove/Riverside/Cedar Park/Northgate/Meadowbrook/Summit/Hillcrest)
    is dense with 7 of the 16 sites in a small area; still readable but has little
    margin — consider a slightly smaller marker radius or label font in dense regions
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, measured RGB (250,248,241) = #FAF8F1 exactly, matches spec.
      Chrome: title "voronoi-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible; axis titles "Distance east (km)" / "Distance north (km)" and tick labels in soft dark gray, all fully legible against the light background; grid lines disabled (gridLineWidth:0), which is fine since cell boundaries already provide structure.
      Data: 16 Voronoi cells fill the plot in pastel tints drawn from the Imprint palette at 0.4 opacity, separated by warm-off-white (#FAF8F1) strokes; 16 dark (ink-colored) seed markers with white outlines mark store locations, each labeled with its store name. Adjacent cells never share the same hue (confirmed via the code's greedy graph-coloring pass).
      Legibility verdict: PASS, with one localized exception — the "Riverside" data label partially overlaps the "Maple Grove" marker (see weaknesses).

    Dark render (plot-dark.png):
      Background: warm near-black, measured RGB (26,26,23) = #1A1A17 exactly, matches spec.
      Chrome: title, axis titles, and tick labels render in light cream text, clearly legible against the dark background — no dark-on-dark failures observed. Cell strokes flip to the dark pageBg color, keeping separation crisp.
      Data: identical cell colors and identical seed-marker positions/labels as the light render — only the chrome (background, text, strokes) adapted; the underlying data hues (teal-green, blue-gray, purple, tan/brown) are unchanged between themes, confirming palette compliance.
      Legibility verdict: PASS, same isolated "Riverside"/"Maple Grove" marker overlap as in the light render (consistent, not theme-specific).
