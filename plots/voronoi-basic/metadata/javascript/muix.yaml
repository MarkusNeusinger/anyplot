review:
  strengths:
  - 'Correct Voronoi partition: each cell is the bounding box clipped by the bisector
    half-plane toward every other seed, so the 18 convex cells tile the square box
    with no gaps or overlaps and the outer cells are cut at the box edges'
  - Greedy coloring of the adjacency graph keeps cells that share an edge in different
    Imprint hues, and the matte red slot is left out because the palette reserves
    it for loss roles
  - The clipping box is square in data units and the drawing area is square in pixels,
    so 1 km spans the same pixels on both axes and bisectors meet seed-to-seed lines
    at true right angles
  - Seeds are ink dots with a page-colored halo and the cell borders are page-colored
    gaps, so seeds and boundaries stand out in both themes without any theme-specific
    code
  - 'Idiomatic MUI X v9 composition: ChartsContainer with linear axes plus a custom
    SVG layer that draws through useXScale/useYScale, so the cells are registered
    to the chart''s own scales and axes'
  weaknesses:
  - 'DQ-02 (both): the render never says what the seeds are; the axes read the generic
    ''X coordinate (km)'' / ''Y coordinate (km)'' and the retail-store scenario lives
    only in a code comment → name the domain in the visible text, e.g. axis labels
    ''Easting (km)'' / ''Northing (km)'' with a subtitle naming the 18 store locations.
    Likely cause: the X/Y column constants and the SUBTITLE string.'
  - 'Suggestion: optional store labels (the spec''s optional label column) next to
    a few seeds would make the service-area reading concrete.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the page and the plot area.
      Chrome: bold dark title "voronoi-basic · javascript · muix · anyplot.ai", a soft-ink subtitle, axis titles "X coordinate (km)" / "Y coordinate (km)", tick labels 5–95 on both axes in soft ink; all readable. No grid (the cells fill the area).
      Data: 18 convex Voronoi cells clipped to a square box, filled at 62 % opacity in five Imprint hues (green #009E73, lavender, blue, cyan, ochre; no red), separated by page-colored borders; adjacent cells always differ in color. Seeds are near-black dots with a cream halo, each inside its own cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels flip to light ink and read clearly; no dark-on-dark text.
      Data: same cells, same hue assignment from the same Imprint positions (the 62 % opacity blends them with the dark page, so they read deeper), borders now in the dark page color, seeds flip to cream dots with a dark halo. Brand green remains clearly visible.
      Legibility verdict: PASS
