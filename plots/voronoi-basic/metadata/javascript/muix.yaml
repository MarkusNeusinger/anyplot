review:
  strengths:
  - 'Correct Voronoi partition computed by clipping the bounding box with every perpendicular-bisector
    half-plane (lines 60-83): 18 convex cells tile the box with no gaps or overlaps,
    and the outer cells are clipped at its edges'
  - The clipping box is square in data units and the drawing area is square in pixels
    (lines 48-52, 138-140), so the cell edges really are perpendicular to the lines
    joining their seeds
  - 'A greedy coloring over the detected shared edges (lines 85-105) gives every pair
    of neighbouring cells different Imprint hues, starting on brand green #009E73
    and skipping the matte-red slot'
  - Seeds are drawn at their exact coordinates with a page-colored halo (ink dots
    on light, cream dots on dark) and stand out from every fill in both themes
  - 'Idiomatic MUI X v9 composition: ChartsContainer with linear axes plus a custom
    SVG layer that reads the chart''s own scales through useXScale/useYScale, with
    sized axis bands and skipAnimation'
  weaknesses:
  - 'DQ-03 (both): the 18 ''retail stores across a city grid'' span about 14-83 km
    on both axes (a box of about 95 km), far wider than a city → keep the store scenario
    at city scale, e.g. coordinates within about 0-20 km, or relabel the scenario
    as a regional network. Likely cause: the data block''s 10 + rand() * 80 range.'
  - 'Suggestion: short store labels next to a few seeds (the Data allows a label column)
    would tie the cells to the service-area story.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; not pure white.
      Chrome: bold title "voronoi-basic · javascript · muix · anyplot.ai" centered at top, grey subtitle beneath it; axis titles "Easting (km)" and "Northing (km)" in dark ink, tick labels 5-95 in soft ink on both axes; thin dark axis lines on the left and bottom. All text readable.
      Data: 18 convex Voronoi cells tile a square box, filled at 0.62 opacity in Imprint green #009E73, lavender, blue, ochre and cyan, separated by 3 px page-colored strokes; neighbouring cells always differ in hue. Each seed is a near-black dot with a cream halo, inside its own cell. First color is brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
