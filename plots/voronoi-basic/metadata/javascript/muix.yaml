      Data: identical geometry and the same Imprint palette tokens per cell (the 0.62 opacity lets the darker page show through, so the tints read deeper); cell boundaries are dark page-colored strokes, still clearly visible; seeds flip to cream dots with a dark halo and stand out on every fill. Brand green remains visible.
