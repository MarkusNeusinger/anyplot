review:
  strengths:
  - From-scratch Voronoi computation via Sutherland-Hodgman half-plane clipping, correctly
    clipped to the bounding box with no infinite regions
  - 'Theme-adaptive chrome is implemented correctly: identical data colors in light/dark,
    exact #FAF8F1/#1A1A17 backgrounds'
  - Idiomatic, distinctive use of MUI X's hook-based overlay API (useXScale, useYScale,
    useDrawingArea) to build a chart type without a native MUI X component
  - Revenue-encoded cell fill adds real informational value and a clear focal point
    beyond a generic tessellation
  - Deterministic data generation, correct square canvas (2400x2400), no clipping
    or overlap issues
  weaknesses:
  - Some adjacent cells land on visually similar hues from the two-stop imprint_seq
    gradient (e.g. the two teal-green cells in the upper-left region), relying solely
    on the thin border stroke for separation - consider a wider perceptual spread
    between t.seq[0]/t.seq[1] or a slightly heavier/contrasting border to make regional
    boundaries easier to parse at a glance
  - Legend/colorbar presentation is functional but plain - minor polish would raise
    the aesthetic ceiling
  - Geometry helper functions are numerous for a basic spec-tier plot, though justified
    by the lack of a native Voronoi primitive in MUI X
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "voronoi-basic · javascript · muix · anyplot.ai" in dark ink, centered top, fully legible. Axis titles "X coordinate (km)" / "Y coordinate (km)" and tick labels (0-100) in dark/soft-dark ink, all readable. Legend "Store monthly revenue ($k)" with $43k/$200k endpoints, dark/soft text, readable.
      Data: 18-point Voronoi tessellation clipped to the 0-100 x 0-100 bounding box. Cell fills follow the imprint_seq two-stop gradient (teal -> slate-blue) encoding store monthly revenue, separated by thin near-white borders. Seed points are solid brand-green (#009E73) circles outlined in the page background color, matching VQ-07's first-series requirement.
      Legibility verdict: PASS - no light-on-light text, no clipped elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title, axis titles, tick labels, and legend text all render in light ink and are clearly legible against the dark surface. Cell borders switch from white (light theme) to near-black (dark theme), matching t.pageBg as intended.
      Data: Cell fill colors and seed-marker green are pixel-identical to the light render - only chrome (background, borders, text) flips, as required.
      Legibility verdict: PASS - no dark-on-dark text, no clipped elements.
