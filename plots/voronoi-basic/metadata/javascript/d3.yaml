review:
  strengths:
  - Greedy graph coloring over the Delaunay adjacency (delaunay.neighbors) guarantees
    neighboring Voronoi cells never share a color — verified across the full tessellation
    in both renders.
  - 'The attempt-1 weaknesses (stock axis chrome, no visual hierarchy) are directly
    and effectively addressed: shorter/thinner tick marks and domain line, plus a
    focal-cell treatment (higher opacity, heavier border, outer ring, directional
    leader-line callout) that gives the chart a clear point of entry.'
  - Exact 2400x2400 square canvas, no edge clipping in either render, and identical
    data colors between light and dark themes (only chrome flips).
  - Deterministic LCG-seeded data generation with a realistic, neutral framing (retail
    store service areas across a metro grid).
  weaknesses:
  - Design excellence is still capped by fairly conventional axis treatment (standard
    bottom+left frame, no further typographic differentiation) — a future pass could
    consider removing the domain line entirely or using a lighter grid-only reference
    instead of a boxed axis frame, given the cell colors already carry the primary
    content.
  - Only one cell in the tessellation receives the focal treatment; that's an appropriate,
    restrained choice for this plot type, but there's room to reinforce the story
    further if this spec is revisited.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Store Service Areas · voronoi-basic · javascript · d3 · anyplot.ai" centered at top, fully visible with margin above, no clipping. X-axis label "Distance East of City Center (km)" and rotated Y-axis label "Distance North of City Center (km)" both dark and clearly readable. Tick labels (0-40) dark and legible.
      Data: 20 Voronoi cells fill the bounding box in Imprint hues at 0.55 fill-opacity with off-white seams; adjacent cells never share a color. Brand-green (#009E73) seed points sit inside their own cells. The focal cell (largest service area, bottom-left) is rendered at 0.75 opacity with a heavier ink border, an outer ring around its seed, and a leader-line callout labeled "Largest service area".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and both axis labels render in light text, clearly legible against the dark background — no dark-on-dark issue found. Tick labels and the focal callout text are likewise light-toned and visible.
      Data: Same cell hues and the same brand-green seed-point color as the light render — only background/text/border chrome flipped, data colors identical. Cells remain clearly distinguishable from the dark background and from each other.
      Legibility verdict: PASS
