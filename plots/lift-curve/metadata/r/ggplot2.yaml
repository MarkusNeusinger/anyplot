review:
  strengths:
  - Correct, well-shaped lift curve that decays from a strong early lift toward the
    y=1 baseline, matching the spec's described behavior exactly
  - Decile markers overlaid on the curve aid interpretation at a glance
  - Theme-adaptive chrome executed correctly — identical data colors, correctly flipped
    ink/background across light and dark, canvas exactly matches the 3200×1800 target
  - Reproducible, clean, idiomatic dplyr + ggplot2 pipeline with no unnecessary complexity
  weaknesses:
  - The y=15 gridline visually brushes against the "Random baseline" legend row because
    legend.background = element_blank() leaves it fully transparent — either nudge
    the legend position down slightly or give it a subtle elevated background fill
    to separate it from the gridline.
  - Grid lines use the full INK/INK_SOFT token color rather than a faint/low-opacity
    rule token, making them a bit more prominent than the style guide's 15-25% opacity
    guidance — consider a lower-contrast tone for panel.grid.major.y.
  - The spec's optional suggestion to show "actual values at key percentiles" isn't
    realized as numeric data labels — only marker positions are shown; adding a label
    like "9.1x @ 10%" at 1-2 key deciles would strengthen data storytelling (DE-03)
    and feature coverage (DQ-01).
  - Composition is solid but standard for the library; leaning into a more distinctive
    ggplot2 feature (e.g. annotate() for a callout, or comparing two models via color/facet)
    would raise Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target.
      Chrome: Title "Fraud Detection Model · lift-curve · r · ggplot2 · anyplot.ai" in dark ink top-left; axis titles "Population Targeted" (x) and "Cumulative Lift" (y) in dark ink; tick labels (0%/25%/50%/75%/100% and 5/10/15) in softer gray; borderless inline legend top-right ("Model", "Random baseline") — all clearly readable.
      Data: Brand-green (#009E73) line decaying from ~16.7x to 1x with 10 teal decile markers; gray dashed "Random baseline" line at y=1. First series confirmed as Imprint #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target.
      Chrome: Same title/axis titles now in light ink (#F0EFE8); tick labels and legend text in light-gray (#B8B7B0) — all clearly readable, no dark-on-dark issues.
      Data: Line and decile marker colors are pixel-identical in hue to the light render (still #009E73); dashed baseline flips to the theme's lighter neutral tone as expected — only chrome changed, confirming data-color consistency across themes.
      Legibility verdict: PASS
