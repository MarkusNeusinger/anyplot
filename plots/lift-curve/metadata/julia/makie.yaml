review:
  strengths:
  - 'Correct lift-curve mechanics with realistic fraud-detection data: curve starts
    high (~14x) and gradually approaches 1, exactly as the spec describes'
  - 'Full Imprint palette + theme-adaptive chrome compliance — brand green #009E73
    identical in both renders, backgrounds correctly #FAF8F1/#1A1A17, all text readable
    in both themes'
  - Decile markers overlaid on the curve as suggested by the spec notes, with a dashed
    y=1 reference line for random selection
  - 'Clean minimal-chrome styling: top/right spines removed, subtle single-axis grid,
    frameless legend'
  - Reproducible (Random.seed!(42)), idiomatic top-to-bottom Makie script with no
    functions/classes
  weaknesses:
  - 'Design Excellence is generic/well-configured-default level (DE-01=4, DE-02=4):
    single green line + gray dashed reference line is competent but not distinctive
    — consider an area fill under the curve, a secondary shading between the model
    curve and the reference line, or a more refined legend/typography treatment'
  - 'No data storytelling / annotation (DE-03=2): the viewer has to read values off
    the axes to know the concrete lift at a given percentage — add a callout annotation
    on a key decile (e.g. ''Top 10% → 8x lift'') to give an immediate takeaway'
  - 'Library Mastery is generic (LM-02=1): lines!/scatter!/hlines!/axislegend are
    the same primitives any Makie scatter/line chart would use — leverage a Makie-distinctive
    feature, e.g. band!() to shade the area between the model curve and the reference
    line, or text!() with an arrow annotation pointing at a decile marker'
  - 'Feature coverage (DQ-01=5/6) could be stronger: only one model curve is shown
    — consider a second, weaker comparison model or a text/decile-value table to more
    fully cover the ''compare models'' use case mentioned in the spec''s Applications
    section'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "lift-curve · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. Axis labels "Population Targeted (%)" and "Cumulative Lift" in dark ink, readable. Tick labels (0, 5, 10 on Y; 0, 50, 100 on X) in a slightly softer gray, all legible. Horizontal gridlines at 5 and 10 are subtle (low opacity), no vertical gridlines. Legend top-right, frameless, dark text on the page background.
      Data: Primary series is the anyplot brand green (#009E73) — a line starting near lift=14 at x=0, with a slightly jagged/noisy segment in the first ~10% (expected given the small sample size at that point of the ranking), then curving smoothly down and asymptotically approaching a gray dashed reference line at y=1 near x=100%. Ten green decile markers with a light stroke are placed along the curve at 10%, 20%, ... 100%.
