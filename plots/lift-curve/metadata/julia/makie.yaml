review:
  strengths:
  - 'Correct lift-curve construction: cumulative lift decays from a high early value
    toward the y=1 baseline exactly as the spec describes, with a dashed ''Random
    selection'' reference line at y=1'
  - Decile markers overlaid on the curve satisfy the spec's optional 'show decile
    markers or actual values at key percentiles' guidance
  - Shaded band between the curve and the y=1 baseline (band! with low alpha) gives
    a tasteful, low-effort visual emphasis of the lift magnitude without cluttering
    the chart
  - Theme-adaptive chrome (INK/INK_SOFT/PAGE_BG tokens) is threaded through every
    chrome element consistently; both renders are legible with no dark-on-dark or
    light-on-light failures
  - 'Imprint palette compliance is perfect: brand green #009E73 for the model line,
    correct light/dark backgrounds, frameless legend with theme-correct text color'
  - Clean KISS script structure with Random.seed!(42), only the imports actually used,
    and idiomatic CairoMakie Axis/band!/hlines!/lines!/scatter!/axislegend usage
  weaknesses:
  - 'The ''Top 10% -> Nx lift'' callout (arrows! + text! block) renders nothing in
    either theme: pixel-level inspection of both plot-light.png and plot-dark.png
    around the intended data position (population%=42, lift=9.5, which maps to roughly
    px (1400,540) on the 3200x1800 canvas) shows only bare background/gridline, no
    arrow and no bold text. The code executes without error and the rest of the figure
    renders correctly, so this is dead/non-functional code, not a crash -- verify
    the arrows!/text! calls actually draw (Makie API/arg-order/keyword issue) or remove
    the block entirely.'
  - Because the callout never renders, the wide-open canvas area to the right of the
    curve (roughly x=40-100%, y=2-10 lift) stays empty whitespace with no focal point,
    which is exactly the gap the code comment claims to be filling -- this costs Layout
    (VQ-05) and Data Storytelling (DE-03) points versus what the code intended to
    deliver
  - 'Library Mastery is only moderate: band! for the shaded lift area is a nice touch
    but is conceptually equivalent to fill_between in other plotting libraries, so
    it doesn''t showcase a feature unique to Makie'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "lift-curve · julia · makie · anyplot.ai" is bold, dark, centered at top, comfortably sized (~30% of plot width, no clipping). Axis labels "Population Targeted (%)" (x) and "Cumulative Lift" (y, rotated) are dark and legible. Tick labels (0/50/100 on x; 0/5/10 on y) use a slightly softer ink tone, clearly readable. A single subtle horizontal gridline is visible per labeled y-tick; no vertical gridlines. Top/right spines removed, left/bottom spines present in a soft ink tone.
      Data: First series renders in Imprint brand green (#009E73): a smooth curve starting near ~13x lift at population=0%, decaying steadily toward 1x lift as population approaches 100%. A light green shaded band fills the area between the curve and the y=1 reference line. Ten small green decile markers (with light-background strokes) sit on the curve at 10%, 20%, ... 100%. A dark dashed horizontal reference line marks y=1 ("Random selection"). Legend top-right lists "Fraud model" (solid green) and "Random selection (no lift)" (dashed), no frame, text in the dark ink color. No callout text or arrow is visible anywhere on the canvas despite the source code containing an arrows!/text! block intended to place a "Top 10% -> Nx lift" annotation near population=42%/lift=9.5 -- a targeted pixel crop of that exact region shows only background and one gridline.
      Legibility verdict: PASS (all rendered chrome is readable; the only issue is that the callout text itself never renders at all, which is a missing-content defect, not a legibility/contrast defect).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same layout as the light render with all ink tokens flipped to light colors -- title, axis labels, and tick labels are all light-colored and clearly readable against the dark background. Spines/gridline in a light-toned soft ink, subtle and correctly visible.
      Data: Data colors are pixel-identical to the light render -- brand green curve, band, and decile markers unchanged; only the dashed reference line and legend text/background flipped to dark-theme tokens. Same targeted-crop check at the intended callout location (population=42%/lift=9.5) confirms no arrow or text renders here either -- purely background plus the y=10 gridline.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; every chrome element that does render is legible). The missing callout is a content-completeness defect identical to the light render, not a theme-specific legibility failure.
