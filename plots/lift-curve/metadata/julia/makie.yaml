review:
  strengths:
  - 'Correct lift-curve mechanics: cumulative fraud rate divided by baseline is computed
    correctly, producing a curve that starts high (~13x) and monotonically decays
    toward 1.0 as targeted population grows'
  - Reference line at y=1 (random selection) is present, dashed, and clearly labeled
    in the legend
  - Decile markers are plotted along the curve, giving concrete reference points as
    suggested by the spec
  - 'Theme-adaptive chrome is correctly implemented: identical brand-green data color
    in both renders, only background/ink/grid tokens flip between light and dark'
  - Canvas is exactly 3200x1800 (landscape target), title format and axis labels are
    correct and fully legible in both themes
  weaknesses:
  - 'The callout annotation is completely invisible in BOTH renders. Verified by pixel-sampling:
    the code computes callout_pos around (18, 10.5) in data coordinates (roughly pixel
    region x=500-900, y=300-650 on the 3200x1800 canvas) and calls arrows!(...) then
    text!(ax, ...; text="Top 10% -> Xx lift", color=INK, fontsize=15, font=:bold),
    but scanning that entire pixel region in plot-light.png and plot-dark.png finds
    zero pixels matching INK or INK_SOFT — no arrow, no text glyph exists anywhere
    in the saved PNG. The intended focal-point annotation is silently dropped.'
  - 'The band!(ax, population_pct, fill(1.0, n_transactions), lift; color=(BRAND,
    0.12)) shaded region between the reference line and the lift curve also does not
    render: sampling a vertical slice through the band area (e.g. x=1635px at population=50%,
    between y=1 and the curve) returns the exact flat background color (250,248,241
    light / 26,26,23 dark) with no green tint blended in at any sampled row.'
  - 'Because two of the five plotting calls (band!, arrows!+text!) produce no visible
    output, the code carries dead/non-functional complexity — it reads as if it draws
    a shaded lift region and a highlighted decile callout, but neither actually appears,
    which is misleading and adds unjustified LOC. Fix: verify the exact CairoMakie
    0.21.9 API for band! (argument order/types for x, ylower, yupper and the color
    tuple syntax) and for arrows!/text! positioning (check whether `align`, `font=:bold`,
    or the position argument form is causing them to fail silently), then confirm
    visually that pixels of the expected color actually appear before considering
    it done. If these features cannot be made to render reliably, remove them rather
    than shipping invisible calls.'
  - The composition leaves a large, unbalanced empty area in the upper-middle/right
    of the chart (roughly x 15-95%, y above the curve) that was clearly intended to
    host the callout annotation and now reads as unused whitespace rather than an
    intentional design choice.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly (sampled corner pixel = (250,248,241)).
      Chrome: Title "lift-curve · julia · makie · anyplot.ai" centered top in bold dark ink, clearly readable. X-axis label "Population Targeted (%)" and Y-axis label "Cumulative Lift" both dark ink, readable. Tick labels (0, 50, 100 on x; 0, 5, 10 on y) in softer gray ink, readable. Top/right spines removed, left/bottom spines subtle gray. Horizontal gridlines at y=5 and y=10 are faint and unobtrusive.
      Data: Single teal-green (#009E73) line starting near y≈13.5 at x=0, decaying smoothly and monotonically down toward y≈1 as x approaches 100. Ten small green-filled decile markers (with light-background-colored stroke) are placed along the curve at each 10% population interval. A dashed gray horizontal reference line sits at y=1, labeled "Random selection (no lift)" in the top-right legend alongside "Fraud model" for the solid line. NOTE: the code also draws a translucent green band between y=1 and the curve, and a callout annotation ("Top 10% → ~8.3x lift" with an arrow) near x=18%, y=10.5 — pixel-level sampling confirms NEITHER of these renders; that region and the band area show only the flat background color.
      Legibility verdict: PASS for all visible chrome/text; the annotation intended to appear is simply absent from the canvas, not illegible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly (sampled corner pixel = (26,26,23)).
      Chrome: Title, axis labels, and tick labels all flip to light ink/gray tones and remain clearly readable against the dark background — no dark-on-dark failures observed. Spines and gridlines are appropriately dim.
      Data: Identical teal-green (#009E73) line, decile markers, and dashed reference line as the light render — data colors confirmed identical between themes, only chrome inverted. Same missing-annotation and missing-band issue reproduces identically in this render (pixel sampling in the same region returns only the flat #1A1A17 background).
      Legibility verdict: PASS for all rendered chrome/text; same missing-element defect as the light render.
