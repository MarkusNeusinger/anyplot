      Data: Single green (#009E73) lift curve starting near 4.05× and descending to 1.0× at 100%, with 10 green decile-marker dots (white/page-background stroke for contrast) and bold black value labels at the 20/40/60/80/100 marks (2.3×, 1.8×, 1.5×, 1.2×, 1.0×). Dashed gray reference line at y=1.0× labeled "Random selection (lift = 1)". Green "Model" label near curve start.
