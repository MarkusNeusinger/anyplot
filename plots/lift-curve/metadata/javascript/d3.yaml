review:
  strengths:
  - 'Complete feature set: cumulative lift curve, dashed y=1 random-selection reference
    line with label, and decile markers at every 10% with value labels at 20/40/60/80/100
    — matches spec''s ''consider showing decile markers or actual values at key percentiles''
    guidance directly.'
  - 'Realistic, reproducible synthetic data: logistic-based churn simulation with
    a latent quality score driving both outcome and a noisy predicted score, seeded
    via a fixed LCG (seed 42) for determinism.'
  - 'Correct Imprint palette and theme handling: single #009E73 series identical across
    light/dark, backgrounds match #FAF8F1/#1A1A17, all chrome (grid, ticks, reference
    line, labels) correctly threaded through ANYPLOT_TOKENS.'
  - Direct labeling ('Model', 'Random selection (lift = 1)') instead of a legend box
    keeps the chart clean and readable in a static PNG while still being self-explanatory.
  - 'Nice idiomatic D3 touches: d3.bisector for percentile lookup, decile markers
    stroked with the page background for contrast/pop, y-axis-only gridlines for a
    subtle, uncluttered look.'
  weaknesses:
  - Title occupies only ~35% of plot width at 22px — well under the 50-70% guideline;
    a slightly larger/bolder title would strengthen the visual hierarchy (minor, non-blocking).
  - Distinctive D3 usage is solid but modest (bisector-based lookup, join pattern)
    — no library-unique technique (e.g. a custom curve interpolation or brush-free
    annotation layer) beyond what the skeleton pattern already suggests.
  - The raw per-customer curve is jagged/noisy near x=0-10%; while realistic, a very
    light smoothing or slightly thicker stroke there could make the steep decline
    read a touch more polished without losing authenticity.
