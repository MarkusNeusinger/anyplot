review:
  strengths:
  - 'Correct lift-curve shape: realistic decay from ~4.0x at low percentages down
    to 1.0x at 100%, generated from a plausible logistic-driven synthetic churn model
    seeded deterministically (lcg(42))'
  - Reference line at lift=1 (random selection) is present with a dashed stroke and
    inline label, exactly as the spec requires
  - Decile markers with direct value labels ('2.9x', '2.3x', '2.0x', '1.7x') and an
    inline 'Model' label replace a traditional legend cleanly, keeping the single-series
    chart uncluttered
  - 'Theme-adaptive chrome is correct: the data color (#009E73) is pixel-identical
    between light and dark renders, and every chrome element (title, axes, gridlines,
    reference line, annotations) flips appropriately with full legibility in both
    themes'
  - 'Idiomatic, KISS-compliant D3 code: proper scales, .join() pattern, d3.axisBottom/axisLeft,
    canvas sized from window.ANYPLOT_SIZE, no unused imports, no fake interactivity'
  weaknesses:
  - Decile labels are shown only at 10/20/30/50% (labeledDeciles = new Set([10,20,30,50]))
    while unlabeled decile dots still appear at 40/60/70/80/90/100% — the subset feels
    arbitrary rather than systematic; either label every decile (with a smaller font)
    or pick an evenly-spaced subset (e.g. every 20%) for a cleaner rationale
  - 'Library Mastery is generic: the implementation doesn''t showcase any D3-distinctive
    capability beyond a basic line+scale+axis pipeline (e.g. no d3.quantile/d3.bisector
    for the decile lookups, which are instead computed with manual index math) — a
    chance to demonstrate more idiomatic D3 array utilities'
  - Title occupies only ~24% of canvas width because the spec-id is short ('lift-curve')
    — not a violation (the format is correct and nothing overflows), but an optional
    short descriptive prefix (e.g. 'Model Lift Chart · lift-curve · javascript · d3
    · anyplot.ai') would give the title more visual presence typical of the catalog
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white and not dark — correct light chrome surface.
      Chrome: Title "lift-curve · javascript · d3 · anyplot.ai" in bold dark ink, clearly visible and centered at top. X-axis label "Population Targeted (%)" and Y-axis label "Cumulative Lift" in dark ink, both fully legible. Tick labels (0%-100%, 0.0x-4.0x) in a softer gray-ink, readable against the light background. Horizontal gridlines are subtle light-gray, visible but not dominant.
      Data: Single green (#009E73) lift curve starting near 4.0x and descending to 1.0x at 100%, with 10 small green decile-marker dots (white/light stroke ring) along the curve, 4 of which carry bold value labels ("2.9x", "2.3x", "2.0x", "1.7x") in dark ink. A dashed gray reference line at y=1.0x is labeled "Random selection (lift = 1)" in soft gray text at the right edge. The curve itself is labeled "Model" in green near its start.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, decile labels, annotations) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black and not light — correct dark chrome surface.
      Chrome: Title in bold white/light text, clearly visible. Axis labels in light ink, tick labels in a slightly softer light-gray, all fully legible against the dark background. Gridlines are subtle light-gray lines, visible without dominating.
      Data: The lift curve, decile markers, and "Model"/decile-value labels are rendered in the identical #009E73 green as the light render — confirmed pixel-consistent data color across themes. The dashed reference line and "Random selection (lift = 1)" label are rendered in light gray, clearly visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis labels, ticks, decile labels, reference-line label) uses a light color with clear contrast against the near-black background.
