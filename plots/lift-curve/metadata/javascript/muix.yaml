review:
  strengths:
  - The cumulative lift is computed correctly from the ranked records (cumulative
    positives over cutoff over base rate) and lands exactly on 1.00× at 100 %, so
    the curve meets the random-selection line where the whole population is targeted,
    as the spec asks
  - Native ChartsReferenceLine draws the dashed lift-1 line across the full population
    axis with its own label, in inkSoft so it reads as a reference in both themes
    and stays distinct from the green model curve
  - The key-percentile values (6.57× at 10 %, 3.58× at 25 %, 2.00× at 50 %) are drawn
    by a child component that reads the chart's own useXScale/useYScale, so each label
    sits next to its mark and matches the curve
  - Hollow circle marks filled with the page colour at every 5 % make the 20 evaluation
    points clear without crowding the line, and the small x-axis pad keeps the 100
    % mark fully inside the plot
  - Subtitle states n, the number of positives and the 3.4 % base rate, which makes
    the lift ratios interpretable at a glance
  - Theme tokens are threaded through every text element, grid line and the reference
    line; skipAnimation and a default-exported component meet the harness contract;
    tooltips use a valueFormatter for the HTML view
  weaknesses:
  - 'Suggestion: the mandated title spans only about a quarter of the canvas width;
    a slightly larger title size (about 26 px) would give the header more presence
    over the wide plot.'
  - 'Suggestion: the gap between the subtitle and the top of the plot area (about
    40 px) could be tightened so the header sits closer to the data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white consistent with #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "lift-curve · javascript · muix · anyplot.ai" centred at the top, a softer subtitle "n = 2,000 cases · 67 positive (base rate 3.4 %) · marks every 5 % of the ranked population"; y axis "Cumulative lift (model rate ÷ base rate)" with ticks 0.0×–13.0×, x axis "Population targeted, ranked by score (%)" with ticks 0 %–100 % every 10 %; subtle horizontal grid only; left and bottom axis lines. All text is dark and readable.
      Data: one brand-green (#009E73) line with 20 hollow circle markers from 11.9× at 5 % falling steeply to 6.57× at 10 %, then flattening to 1.00× at 100 %; a dashed grey reference line at 1.0× spans the full width, labelled "Random selection (lift 1×)" at its left end; bold dark value labels "6.57× at 10 %", "3.58× at 25 %", "2.00× at 50 %" sit just above-right of their markers. No overlap, nothing clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black consistent with #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles and tick labels all render in light ink; grid lines are dim but visible; the dashed reference line turns light grey and stays clearly visible. No dark-on-dark text anywhere.
      Data: the curve and markers are the same #009E73 green as in the light render (marker centres now take the dark page colour); the key-value labels are light and readable. Only chrome flipped.
      Legibility verdict: PASS
