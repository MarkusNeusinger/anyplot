review:
  strengths:
  - Idiomatic, advanced use of MUI X's hook-based extensibility (useXScale, useYScale,
    useDrawingArea) to build custom, axis-aware annotations — a genuinely library-distinctive
    technique
  - ChartsReferenceLine clearly labeled for the random-targeting baseline, directly
    fulfilling the spec's 'always include a horizontal reference line at y=1' requirement
  - Key-percentile value callouts (10%, 25%, 50%) fulfill the spec's suggestion to
    surface actual values at key percentiles, with label-flip logic near the curve's
    peak to avoid clipping
  - Realistic, neutral fraud-detection scenario with a plausible base rate and imperfect-classifier
    noise model
  - 'Theme-correct in both renders: identical brand-green data color, fully legible
    chrome in light and dark'
  weaknesses:
  - Data markers are on the smaller side for a sparse 20-point series — enlarging
    them slightly would strengthen VQ-03 element visibility
  - X-axis starts at 5% rather than the spec's literal '0-100%' range; consider a
    brief note/annotation clarifying that 0% is excluded because lift is undefined
    there, or starting at a smaller first percentile
  - The rotated y-axis title uses a fixed pixel offset (left - 78) from the axis rather
    than measuring actual tick-label width — works here but is a fragile pattern if
    tick label width changes
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Dark-ink title "Fraud Detection Lift · lift-curve · javascript · muix · anyplot.ai" centered at top; dark axis titles "Population targeted (%)" / "Cumulative lift"; dark tick labels with "%" and "×" suffixes; subtle horizontal-only gridlines. All clearly readable against the light background.
      Data: Single brand-green (#009E73) line with hollow-green markers tracing lift from ~12.0x at 5% down to 1.0x at 100%. Bold dark callouts "6.6x", "3.6x", "2.0x" at the 10%/25%/50% key percentiles. Dashed grey reference line at y=1.0x labeled "Random targeting (no lift)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels flipped to light-colored text against the dark surface, fully legible. Gridlines are subtle light-on-dark. No dark-on-dark failures found.
      Data: Same #009E73 green line, markers, and callout positions as the light render — data colors identical between themes, confirming only chrome flipped. Key-percentile callouts render in light text and remain readable; reference-line label stays muted grey but legible.
      Legibility verdict: PASS
