review:
  strengths:
  - 'Correct lift-curve semantics: monotonic decreasing curve from ~11.5x down to
    1.0x with a dashed y=1 reference line clearly labeled "Random targeting (no lift)"'
  - Title exactly matches the mandated format with a fitting descriptive prefix ("Fraud
    Detection Lift · lift-curve · javascript · muix · anyplot.ai")
  - 'Both themes render correctly: identical brand-green (#009E73) data line, correct
    page backgrounds, fully legible chrome in both light and dark'
  - Deterministic LCG-based synthetic data generation makes the plot fully reproducible
  - Good idiomatic use of MUI X's ChartsReferenceLine plus percentage/×-suffixed valueFormatter
    on both axes
  weaknesses:
  - 'yAxis `tickFontSize: 48` combined with an `sx` override down to 14px is a confusing
    hack (setting a large nominal font size purely to reserve left-margin space, then
    visually overriding it) — use `tickLabelStyle`/`slotProps` margin controls or
    a fixed axis width instead of fighting the auto-margin via an unrelated prop'
  - 'Design excellence sits near baseline: no shading under the curve and no direct
    value/percentile annotations despite the spec''s suggestion to "consider showing
    actual values at key percentiles" — a lift-value label at a couple of key deciles
    (e.g., top 10%/20%) would sharpen the storytelling'
  - 8% fraud rate is on the high side for a realistic fraud-detection base rate (real-world
    fraud incidence is typically well under 1-2%) — consider lowering it or reframing
    the narrative toward a churn/response scenario
  - The series `label` ("Model (ranked by predicted fraud score)") is defined but
    never shown since the legend is hidden — harmless for a single-series chart, but
    it's dead metadata; either drop it or surface it minimally
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Fraud Detection Lift · lift-curve · javascript · muix · anyplot.ai" is centered, dark ink text, fully legible. X-axis label "Population targeted (%)" and rotated Y-axis label "Cumulative lift" are dark and readable. Tick labels (5%-100% on x, 0.0×-12.0× on y) are dark and clearly legible. Horizontal grid lines are subtle light-gray, visible but not dominant.
      Data: Single line series in brand green (#009E73) with unfilled circular markers at each 5% percentile, monotonically decreasing from ~11.5x at 5% to 1.0x at 100%. A dashed gray horizontal reference line at y=1.0 is labeled "Random targeting (no lift)" in soft ink, positioned just above the line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels are all rendered in light/white text, clearly legible against the dark background — no dark-on-dark issues found. Grid lines are subtle light-gray, visible but unobtrusive.
      Data: Line color and marker style are pixel-identical to the light render (same brand green #009E73, same curve shape and marker positions) — only the chrome (background, text, grid, reference-line color) flipped as expected. Reference line and its label remain legible in the dark surface.
      Legibility verdict: PASS
