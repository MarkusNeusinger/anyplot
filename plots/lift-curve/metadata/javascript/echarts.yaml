review:
  strengths:
  - 'Cleanly addresses every prior weakness: markLine replaces the second ''Random
    selection'' series (more idiomatic, no legend boilerplate), a markPoint callout
    labels the headline 4.3x lift at the first decile, and the fraud/non-fraud score
    overlap was widened so the curve shape reads as a realistic, imperfect classifier
    instead of near-perfect separation'
  - Gradient areaStyle fill under the curve adds real visual hierarchy and reinforces
    the 'diminishing returns' story as targeted population grows
  - 'Correctly implements every spec requirement: y=1 no-lift reference line (via
    markLine), decile markers, cumulative-lift curve decaying toward 1'
  - Clean, theme-adaptive chrome — both renders pass the light/dark readability checklist
    with no overlap or clipping
  - Distinctive per-point symbolSize function selectively shows markers only at deciles,
    keeping the 20-point series uncluttered
  - Deterministic, self-contained data generation via a fixed-seed LCG
  weaknesses:
  - Axis-name/tick hierarchy could use slightly more contrast in weight (very minor,
    carried over from attempt 1)
  - The curve/area fill starts at the first data point (5% targeted) rather than at
    x=0, leaving a small empty gap at the left edge of the plot area
