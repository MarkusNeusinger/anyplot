review:
  strengths:
  - 'Correctly implements every spec requirement: y=1 no-lift reference line, decile
    markers, cumulative-lift curve decaying toward 1 as targeted population grows'
  - Clean, theme-adaptive chrome - both renders pass the light/dark readability checklist
    with no overlap or clipping
  - Distinctive per-point symbolSize function selectively shows markers only at deciles,
    keeping the 20-point series uncluttered
  - Deterministic, self-contained data generation via a fixed-seed LCG
  weaknesses:
  - 'Design Excellence is close to default: consider an annotation/markPoint calling
    out the peak lift value at the first decile, or an areaStyle fill under the curve,
    to strengthen the visual hierarchy'
  - Use ECharts' markLine for the y=1 'Random selection' reference instead of a second
    full series - more idiomatic and reduces legend/series boilerplate
  - The top-decile lift (~15) sits very close to the theoretical maximum for the 6%
    baseline fraud rate, implying near-perfect model separation; widening the score-overlap
    between fraud/non-fraud slightly would produce a more realistic curve shape
