review:
  strengths:
  - 'Area fill uses threshold: 1 so only the wedge between the curve and the y=1 baseline
    is shaded, visually emphasizing the magnitude of lift captured above random selection'
  - Decile markers (10%, 20%, ... 100%) show explicit data labels with the exact lift
    value, giving the viewer concrete reference points along the curve as suggested
    by the spec notes
  - Custom tooltip pointFormatter surfaces the underlying responders/customers counts
    behind each lift value, adding real interactive depth beyond the static PNG
  - All font sizes are explicitly set and identical Imprint green (#009E73) is used
    for the data series in both light and dark renders, with theme-correct chrome
    (background, grid, text) in both
  - Deterministic mulberry32 PRNG seeded at 42 produces a realistic, right-skewed
    propensity distribution (pow(rand(),4)) with a noisy model score, avoiding a suspiciously
    smooth synthetic curve
  weaknesses:
  - 'Design Excellence is solid but not exceptional: a single-hue area fill and dashed
    reference line is clean but doesn''t push further into a distinctive visual signature
    (e.g., no annotation calling out the optimal targeting cutoff) — DE-02/DE-03 have
    headroom'
  - Y-axis title 'Cumulative Lift' relies on the tick format ({value}x) rather than
    the axis title itself to convey the unit — an explicit '(x)' suffix on the axis
    title would make the unit unambiguous without needing to read the ticks
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "lift-curve · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Retention offer targeting · baseline response rate 18.8%" in soft gray beneath it. X-axis "Population Targeted (%)" and Y-axis "Cumulative Lift" titles and tick labels (0%-100%, 0x-5.5x) are dark gray/black and clearly legible against the light background. Subtle light-gray horizontal gridlines are visible but not dominant. Legend at the bottom shows "Model" (solid green line swatch) and "Random selection (no lift)" (dashed dark swatch).
      Data: A green (#009E73) line starts near 4.8x at 0% population targeted and decays smoothly (with minor realistic noise near the start) down to 1.0x at 100%, with a translucent green fill wedge between the curve and the dashed y=1 reference line. Ten decile markers (10%-100%) are shown as filled green dots with black data-label text (4.0x, 3.3x, 2.8x, 2.3x, 1.9x, 1.6x, 1.4x, 1.2x, 1.1x, 1.0x) positioned just above each marker, none overlapping each other or the curve.
      Legibility verdict: PASS — all text and data elements are clearly readable, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title/subtitle text, now rendered in white/light-gray, clearly legible against the dark background. Axis titles and tick labels are light gray, gridlines are a subtle dark-gray that remains visible without dominating. Legend text is light-colored and readable.
      Data: The line, fill, and marker colors are identical to the light render (#009E73 green, same dashed reference line color logic adapted to light ink for dark theme) — only the chrome (background, text, grid) has flipped. The decile data-label text is now white, clearly legible against both the dark background and the darker green fill area beneath it — no dark-on-dark failures observed.
      Legibility verdict: PASS — all text remains legible in the dark theme; data colors match the light render exactly.
