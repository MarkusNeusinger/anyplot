review:
  strengths:
  - Reference line at y=1 correctly uses the theme-adaptive `neutral` (ink) semantic
    anchor rather than a palette color, matching the style guide's intended role for
    baseline/reference series
  - Decile markers (radius 6) with per-point dataLabels give exact lift values at
    10% increments, directly satisfying the spec's suggestion to show decile markers
    or key percentile values
  - enableMouseTracking:false on the reference series avoids a redundant tooltip on
    the flat comparison line, and zIndex ordering keeps the model curve on top
  - 'Both renders are fully theme-correct: identical brand-green data color, correct
    #FAF8F1/#1A1A17 backgrounds, and legible chrome text in both themes'
  - Deterministic mulberry32 PRNG with a fixed seed produces reproducible synthetic
    data, and the propensity-plus-noise model produces a realistic, gradually-decaying
    lift curve as the spec requires
  weaknesses:
  - Design is close to a well-configured default line chart — no shaded/filled area
    between the model curve and the y=1 reference line to visually emphasize the lift
    magnitude, which would sharpen the data storytelling
  - Title occupies only ~30% of the plot width at the current 22px size; while not
    a legibility problem, there is headroom to give the title more visual weight in
    the hierarchy
  - Data point dataLabels (13px) are near the small end of the sizing range — legible
    now, but leave little margin when scaled down for mobile widths
  - Only the decile-level lift values are surfaced; the underlying response counts
    (numerator) that produced each ratio are not exposed anywhere (e.g., tooltip or
    subtitle), which would round out feature coverage
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold dark title "lift-curve · javascript · highcharts · anyplot.ai" centered at top, gray subtitle with baseline response rate, dark axis titles ("Population Targeted (%)", "Cumulative Lift"), soft-gray tick labels on both axes, subtle horizontal gridlines only, legend at bottom with "Model" and "Random selection (no lift)" swatches. All chrome text clearly legible against the light background.
      Data: Green (#009E73) line starts near 4.8x at 0%, decays with realistic noise/wobble in the 0-10% range, then smoothly approaches 1.0x by 100%. Filled green decile markers (10%, 20%, ... 100%) carry bold black dataLabels ("4.0x", "3.3x", ... "1.0x"). A black dashed horizontal line at y=1x represents random selection, per spec requirement.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title/subtitle/axis text now rendered in white/light-gray, fully legible against the dark background — no dark-on-dark issues found on title, axis labels, tick labels, or legend text. Gridlines are subtle light-gray at low opacity.
      Data: Identical brand-green (#009E73) line and marker colors as the light render — only chrome inverted, confirming Imprint palette data-color constancy. The reference line correctly flips from black-dashed (light) to white-dashed (dark), consistent with using the theme-adaptive `neutral`/`ink` anchor rather than a fixed hex.
      Legibility verdict: PASS
