review:
  strengths:
  - 'Correct Imprint palette usage: brand green #009E73 for the model-lift line, identical
    across light and dark renders'
  - 'Theme-adaptive chrome is fully correct: warm cream/near-black backgrounds, ink-toned
    text, subtle y-axis-only grid'
  - Decile markers (every 10%) directly satisfy the spec's suggestion to highlight
    key percentiles
  - Dashed neutral reference line at y=1 clearly represents the 'no lift' random-selection
    baseline required by the spec
  - Deterministic, seeded LCG used for in-browser data generation since the browser
    has no seeded Math.random()
  - Axis tick callbacks format values with units directly ('%' on x, 'x' ratio suffix
    on y)
  - Realistic, neutral fraud-detection scenario with a plausible lift curve shape
    (noisy near the top decile, converging smoothly to 1x)
  weaknesses:
  - The 'Random baseline (no lift)' legend swatch renders as a low-contrast, near-invisible
    pale circle in the light theme because pointBackgroundColor is never set for that
    dataset, so Chart.js falls back to its own default fill — set an explicit background
    (e.g. t.pageBg or t.ink) so the swatch reads clearly on both themes
  - 'Design excellence sits close to a well-configured default: the treatment doesn''t
    go far beyond the spec''s baseline ask (dashed reference + decile markers) — consider
    one added storytelling touch, e.g. annotating the lift value at a key decile,
    or varying marker emphasis to create a stronger single focal point'
  - Spec explicitly suggests 'showing decile markers or actual values at key percentiles'
    but only marker positions hint at deciles — adding a small numeric callout (e.g.
    '3.1x at 10%') on one or two key points would strengthen both feature coverage
    and data storytelling
