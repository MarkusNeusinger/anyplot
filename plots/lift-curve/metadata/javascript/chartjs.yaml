review:
  strengths:
  - 'Baseline legend swatch is now an explicit hollow ring (pointBackgroundColor:
    t.pageBg, pointBorderColor: t.ink) that reads clearly on both the cream light
    background and the near-black dark background - the prior low-contrast issue is
    fully resolved'
  - New decileCallout plugin draws explicit '3.1x at 10%' and '2.4x at 30%' numeric
    labels, directly satisfying the spec's suggestion to show actual values at key
    percentiles
  - The 10% decile marker is enlarged to radius 8 versus 6 for other deciles, creating
    a clear single focal point that the callout labels reinforce - a legitimate visual-hierarchy
    improvement over the prior attempt
  - 'Correct Imprint palette: brand green #009E73 for the model-lift line, identical
    across both themes'
  - 'Theme-adaptive chrome fully correct: warm cream/near-black backgrounds, ink-toned
    text, subtle y-axis-only grid, no dark-on-dark or light-on-light failures'
  - Deterministic, seeded LCG for reproducible in-browser data generation; realistic,
    neutral fraud-detection scenario with a plausible converging lift curve shape
  - Axis tick callbacks format values with units directly ('%' on x, 'x' ratio on
    y)
  - Custom Chart.js plugin using the afterDatasetsDraw lifecycle hook to draw canvas-native
    callout text is a genuinely library-specific technique, not something trivially
    ported from another charting library
  weaknesses:
  - Aesthetic sophistication still reads as a well-configured default plus two targeted
    fixes rather than a fully bespoke composition - e.g. no subtle background band
    or secondary visual cue distinguishing the 'good' zone (lift > 1) from the 'no
    better than random' zone
  - Only 2 of 9 decile markers (10%, 30%) carry explicit callouts - a third callout
    further along the curve (e.g. 50% or 70%) would make the diminishing-returns story
    even clearer without crowding the chart
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "lift-curve · javascript · chartjs · anyplot.ai" centered at top; dark axis titles "Population Targeted (%)" / "Cumulative Lift Ratio"; soft dark-gray tick labels formatted with "%" and "x" suffixes; subtle horizontal-only gridlines. All title/axis/tick text is clearly readable against the light background - no light-on-light issues.
      Data: A single green (#009E73) line falls from ~3.75x at 1% to 1.0x at 100%, with filled green decile markers every 10% (larger radius-8 marker at the 10% focus point). Two bold callout labels read "3.1x at 10%" and "2.4x at 30%" directly above their markers, clearly legible and non-overlapping with the curve. A dark dashed horizontal reference line at y=1x ("Random baseline (no lift)") runs the full width. Legend top-right shows a solid green dot for "Model lift" and a hollow ring (light fill, dark ink border) for "Random baseline (no lift)" - the ring is now clearly visible against the cream background, resolving the prior low-contrast issue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Identical layout with all text flipped to light tones (white/light-gray title, axis titles, tick labels); gridlines are light and subtle; legend unchanged in position. All text is clearly legible against the near-black background - no dark-on-dark failures found.
      Data: The model-lift line, decile markers, and callout labels ("3.1x at 10%", "2.4x at 30%") use the exact same #009E73 green and ink-toned label color as the light render - confirmed identical data colors, only chrome flipped. The dashed baseline line is light-colored to match dark-theme chrome. The legend's hollow ring for "Random baseline" now has a light-colored border and reads with strong contrast against the near-black background.
      Legibility verdict: PASS
