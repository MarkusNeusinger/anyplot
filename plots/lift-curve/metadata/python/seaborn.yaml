review:
  strengths:
  - Theme tokens threaded through sns.set_theme rc so every chrome element flips correctly
    between light and dark
  - Lift computed from the ranked table with cumsum and drawn unsmoothed, with percentile
    markers and value labels that match the curve
  - Exact 3200x1800 canvas through figsize and subplots_adjust, without bbox_inches
    trimming
  weaknesses:
  - 'DQ-02 (both): the simulated response model ranks almost perfectly: lift holds
    at its 10.0 ceiling for the top 4 %, reaches 8.30x at 10 % (83 % of responders
    in the top decile) and every responder is captured by about 25 % of the population,
    far beyond a plausible marketing response model → noisier scores or outcomes so
    the top-decile lift lands near 3–5x. Likely cause: score noise sd 0.3 against
    a latent sd of 1, with y_true thresholded on the same latent and no outcome noise.'
  - 'Suggestion: shade the gap between the curve and the reference line lightly to
    make the area of gain read at a glance.'
