review:
  strengths:
  - Lift computed vectorized (cumsum over the score-ranked outcomes, ceil indexing
    per percent), so the plateau of 5.0 and the meeting point at 1.00 fall out of
    the data
  - Lift-axis domain derived from the data with headroom, so the curve's peak clears
    the frame and the axis holds both the baseline and the maximum
  - Theme-adaptive dashed mark_rule baseline (INK_SOFT) reads clearly in both renders
    and stays distinct from the green curve
  - Decile markers with a page-colored halo and formatted tooltips for inspection
    in the HTML output
  - Canvas padded (never cropped) to exactly 3200x1800
  weaknesses:
  - 'Suggestion: value labels at two or three key deciles (for example 10% and 20%)
    would let the static PNG answer the spec''s ''how many times more'' question without
    hovering.'
  - 'Suggestion: a lighter grid (x ticks every 10%) would reduce the 21-column grid
    behind a curve read mainly at deciles.'
