review:
  strengths:
  - Lift is computed per ranked case and drawn at every percent of the population,
    so the curve is unsmoothed and meets the reference exactly at 100%
  - The random-selection line spans the full 0-100% axis in a neutral long-dash ink
    tone, clearly told apart from the green model curve in both themes
  - Decile markers are taken from the same computed curve, so every dot sits on the
    line at its percentile
  - Theme tokens flow through one pygal Style object; text sizes match the library
    prompt and read cleanly in both renders
  - pygal XY with per-point label dicts gives decile tooltips in the interactive HTML
  weaknesses:
  - 'CQ-04 (code): the ''Decile values'' series sets print_values=True, print_labels=True,
    formatter and value_label_font_size (lines 98-101), yet no value label appears
    in either render → remove the dead options, or make the labels render. Likely
    cause: per-series value printing not taking effect for this XY series.'
  - 'Suggestion: the lift axis starts at 0, so the band from 0 to 1 is empty and the
    curve uses less than half the plot height; a floor just below 1 would give the
    descent more room.'
  - 'Suggestion: the legend entry ''Decile values'' promises values the static render
    does not show; ''Decile markers'' would match what is drawn.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'lift-curve · python · pygal · anyplot.ai' centred in dark ink; y title 'Cumulative lift (× baseline)', x title 'Population targeted (%)'; ticks 0.00-1.80 and 0%-100%; dotted horizontal guides subtle; legend at bottom in three columns (Model lift, Random selection (lift = 1), Decile values). All readable.
      Data: green #009E73 lift curve starting ~1.44, peaking ~1.69 near 8%, descending with small wiggles to 1.00 at 100%; ten green decile dots on the curve at 10%..100%; grey dashed reference at 1.00 across the full axis. No value labels drawn.
      Legibility verdict: PASS

