  strengths:
  - Lift computed vectorized from the ranked cumulative hits at each percentile, so
    the right end lands exactly on the lift-1 reference line
  - Dashed INK_SOFT reference line at lift 1 spans the whole population axis and reads
    clearly in both themes
  - Decile markers sit on the curve at their percentiles, matching the computed values
  - Theme tokens threaded through every chrome element; text readable in both renders
  - Column constants and a clean Data block make the code adaptable to a real scores
    table
  weaknesses:
  - 'Suggestion: lift breaks every 0.5 (derived from the data range) would let the
    decile values between 1 and 2 read more precisely than the integer ticks 0, 1,
    2.'
  - 'Suggestion: a y-axis grid only (no vertical grid lines), as the style guide prefers
    for line charts, would quiet the panel.'
