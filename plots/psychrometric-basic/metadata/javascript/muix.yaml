review:
  strengths:
  - 'Every property line is computed from the ASHRAE moist-air relations at 101.325
    kPa and lands where it should: saturation 14.7 g/kg at 20 °C and 27.3 g/kg at
    30 °C, the 0.85 m³/kg volume line meets w=0 at about 26.9 °C, the 40 kJ/kg enthalpy
    line at about 39.8 °C'
  - Wet-bulb, enthalpy and volume lines stop at the saturation curve via null values,
    which MUI X draws as gaps, so nothing spills into the empty region above it
  - The four line families are told apart by color and by dash pattern (solid, dashed,
    dash-dot, dotted), and the 100 % curve is drawn at double weight as the prominent
    upper boundary
  - Direct labels sit where each line meets the saturation curve or leaves the plot
    area, in the family's color with a page-colored halo, and the right-edge labels
    keep a minimum vertical gap
  - The comfort zone is a true polygon bounded by the 30 % and 60 % RH curves between
    20 and 26 °C, not a loose rectangle
  - Overlays are drawn as chart children through useXScale, useYScale and useDrawingArea,
    so the process arrow, state points and labels share the chart's own coordinate
    system
  - Chrome uses the theme tokens throughout and reads correctly in both renders
  weaknesses:
  - 'VQ-07 (both): the cooling-and-dehumidification process path is drawn in matte
    red #AE3030, the semantic anchor reserved for bad / loss / error, on a process
    that is neither → a palette member with a fitting association, such as cyan #2ABCCD
    (t.palette[5]) for cooling. Likely cause: PROCESS_COLOR = t.palette[4].'
  - 'VQ-03 (both): the specific-volume lines (dash "2 5" at 1.8 px) read much fainter
    than the other families and nearly vanish in the 400 px thumbnail, especially
    on the dark background → a denser dot pattern (about "2 3") or width about 2.4
    px (+0.6 px). Likely cause: FAMILY.v dash and width.'
  - 'Suggestion: the dense 2 °C × 2 g/kg grid competes with the 25 property lines;
    a coarser grid (every 5 °C, 5 g/kg) would let the line families carry the chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title "psychrometric-basic · javascript · muix · anyplot.ai" bold and centered, a subtitle on the ASHRAE relations at 101.325 kPa, a one-row key (saturation, RH, wet-bulb, enthalpy, specific volume, cooling process, comfort zone); x axis "Dry-bulb temperature (°C)" from -10 to 50 with ticks every 2 °C, y axis "Humidity ratio (g water / kg dry air)" from 0 to 30. All text is dark and clearly readable; the grid is subtle.
      Data: ten green #009E73 RH curves fanning from the lower left, the thick 100 % saturation curve as the upper boundary; purple dashed wet-bulb lines (5–30°) and blue dash-dot enthalpy lines (20–100) running diagonally down to the right; ochre dotted specific-volume lines (0.80–0.95) at a steeper angle. Labels in family colors at the top edge (RH %), at the saturation curve (wet-bulb °), at the bottom and right edges (enthalpy, volume, low RH). A grey dashed comfort-zone polygon between 20 and 26 °C and 30–60 % RH, labelled "Comfort zone". A red arrow from state 1 (30 °C, 13.3 g/kg) to state 2 (14 °C, 9.0 g/kg), labelled "Cooling & dehumidification". The specific-volume dotted lines are noticeably the faintest family.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, key, axis labels and tick labels flip to light ink and are all clearly readable; no dark-on-dark text. The grid is subtle grey; the comfort-zone fill is a lighter grey with a light dashed outline.
      Data: line colors identical to the light render (green, purple, blue, ochre, red); only the chrome flips. Brand green stays vivid. The dotted ochre volume lines are fainter still on the dark surface but visible.
      Legibility verdict: PASS
