review:
  strengths:
  - 'Moist-air relations computed directly from ASHRAE formulas at 101.325 kPa; values
    verified off the axes: saturation ≈27.3 g/kg at 30 °C and ≈14.7 g/kg at 20 °C,
    h = 20 kJ/kg meets w = 0 at ≈19.9 °C, v = 0.85 m³/kg meets w = 0 at ≈26.9 °C,
    state 1 (30 °C / 50 % RH) at ≈13.3 g/kg'
  - Four line families told apart by both Imprint color (canonical order) and dash
    pattern (solid / dashed / dash-dot / dotted), so the web of lines stays legible
    in both themes and under CVD
  - 'Every property line is labeled directly in its family color with a page-colored
    halo: RH at the top/right exit, wet-bulb where it leaves the saturation curve,
    enthalpy and specific volume at the bottom/right exit'
  - Saturation curve drawn at double weight as the prominent upper boundary; non-RH
    lines stop at it via null values
  - Comfort zone drawn as the true 20–26 °C × 30–60 % RH polygon (curved RH edges),
    not a crude rectangle, in a neutral ink tint that recedes behind the vivid cyan
    process arrow with numbered state points
  - Overlays composed inside LineChart through useXScale / useYScale / useDrawingArea,
    and per-family styling via sx selectors on the data-series attribute — idiomatic
    MUI X composition
  - Theme tokens threaded through all chrome; skipAnimation for a stable capture
  weaknesses:
  - 'Suggestion: the 2-unit grid on both axes adds a fifth line web under 25 property
    lines; a coarser grid (every 5 °C / 4 g/kg) would let the property families carry
    the chart.'
  - 'Suggestion: the saturation-pressure expression is written out four times (lines
    46, 57, 112, 121); reusing one inline arrow constant would shorten the data block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
