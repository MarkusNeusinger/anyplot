review:
  strengths:
  - 'Fixed the attempt-1 label-fit miss: ''Analytics Warehouse'' ($175K, the largest
    Databases leaf) is now labeled alongside every other major segment.'
  - 'Now exercises all 3 hierarchy levels the spec allows: Compute''s 4 services each
    split into a 3rd environment ring (Prod/Staging, Scheduled/Ad-hoc, Training/Inference,
    Linux/Windows), demonstrating uneven-depth sunburst structure while the other
    3 branches correctly terminate at ring 2.'
  - Ring 3 arcs are angularly nested exactly under their ring-2 parent's span (verified
    by pixel inspection) — inner segments visually encompass their children's angular
    range as the spec requires.
  - 'Branch-consistent coloring across all 3 rings: every leaf/grandchild inherits
    its root branch''s hue (progressively lightened via `mix()`), keeping the radial
    hierarchy visually legible.'
  - Canonical Imprint palette order (Compute=`#009E73` brand green first, then Storage/Networking/Databases),
    with data colors pixel-identical between light and dark renders — only chrome
    flips.
  - 'Genuine (non-faked) interactivity for the HTML view: native SVG `<title>` hover
    tooltips and a real mouseover/mouseout branch-highlight, correctly not penalized
    for being invisible in the static PNG.'
  - Per-wedge label color computed from wedge luminance, guaranteeing contrast regardless
    of theme or branch lightness.
  - Center KPI callout ($2,385K total spend / year) plus bold/regular label-weight
    hierarchy creates a clear macro-to-micro focal point.
  weaknesses:
  - Ring-3 labels shrink as low as 8px (ring-2 as low as 9px) in the 2400px source
    canvas — legible at full resolution but will read as near-invisible once scaled
    to a ~400px mobile width. Consider raising the minFontSize floor slightly or omitting
    labels below a fixed size rather than letting them shrink that far.
  - Several helper functions (`mix`, `luma`, `labelColorFor`, `money`, `drawWedge`)
    deviate from a flat KISS script structure — reasonably justified by the hand-rolled
    renderer-based rendering required since the sunburst module isn't loaded, but
    not the minimal-code path.
  - Top margin (title/subtitle to first ring) remains larger than the bottom margin,
    a very slightly top-heavy composition — not severe enough to affect the canvas-utilization
    score.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "sunburst-basic · javascript · highcharts · anyplot.ai" and a grey subtitle explaining all three rings, units (USD thousands/year), and the angle-value mapping — both fully readable against the light background. Thin off-white/cream separator strokes divide every wedge.
      Data: Three concentric rings. Ring 1 (4 root categories): Compute #009E73 brand green (first, canonical), Storage lavender #C475FD, Networking blue #4467A3, Databases ochre #BD8233 — all bold-labeled in-wedge. Ring 2 (14 services): lightened tint of parent branch color, labeled where the estimated text width fits the arc (including "Analytics Warehouse", now shown after the attempt-1 fix); smallest services like "CI/CD Runners" and "VPN Gateways" go unlabeled but keep their native <title> hover tooltip. Ring 3 (Compute's 4 services only, new in this attempt): a further-lightened tint split into Prod/Staging, Scheduled/Ad-hoc, Training/Inference, Linux/Windows — angularly nested exactly under their ring-2 parent, confirmed by close pixel inspection near the Linux/Windows boundary. Center shows "$2,385K / total spend per year" in bold dark ink.
      Legibility verdict: PASS — all title, subtitle, ring-1/ring-2 labels, and center KPI text are clearly readable; ring-3 labels (down to 8px) are readable at full resolution though small.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle now rendered in light ink, fully legible. Separator strokes use the dark-theme page background color, so wedge boundaries stay crisp. No dark-on-dark failures anywhere — checked ring 1 (light labels on saturated branch colors), ring 2/3 (dark labels on lightened tints, unchanged from light theme since label color is luminance-derived per wedge, not theme-derived), and center KPI (light ink on dark page).
      Data: All wedge fill colors are pixel-identical to the light render across all 3 rings — only the page background, title/subtitle ink, separator-stroke color, and center-label ink flipped, exactly as required.
      Legibility verdict: PASS — no unreadable text in either theme; brand green Compute wedge remains vivid on the dark surface.
