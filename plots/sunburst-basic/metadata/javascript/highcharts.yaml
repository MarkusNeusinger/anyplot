review:
  strengths:
  - Correctly hand-draws a genuine 2-ring sunburst with Highcharts' SVGRenderer.arc()
    since the sunburst module isn't loaded — a legitimate, well-reasoned workaround
    rather than faking the chart type or bailing to NOT_FEASIBLE.
  - 'Branch-consistent coloring: every leaf inherits its parent branch''s hue (mixed
    32% toward white), keeping the two rings visually linked while still respecting
    the canonical Imprint palette order (Compute gets brand green first).'
  - 'Adaptive labeling: labels are only drawn when the wedge is wide enough to fit
    the text (arc-length vs. estimated text width), and per-wedge label color is computed
    from wedge luminance for guaranteed contrast in both themes.'
  - Center KPI callout ($2,385K total spend / year) creates a clear focal point and
    a macro-to-micro visual hierarchy from center to inner ring to outer ring.
  - 'Genuine (non-faked) interactivity for the HTML view: native SVG <title> tooltips
    per wedge and a real mouseover/mouseout branch-highlight, correctly not penalized
    for being invisible in the static PNG per the interactive-library fairness rule.'
  - 'Both renders are theme-correct: warm cream / near-black backgrounds, all chrome
    text uses theme tokens, and data colors are pixel-identical between light and
    dark.'
  weaknesses:
  - '"Analytics Warehouse" (Databases branch, $175K / 7.3% of total spend) is large
    enough to be a major segment by the spec''s own labeling guidance, yet is left
    unlabeled purely because the estimated text width doesn''t fit the arc, while
    the smaller "Cache" ($70K) leaf right next to it does get a label. The width heuristic
    occasionally skips genuinely major segments in favor of minor ones with shorter
    names — loosen the estWidth fit tolerance or add a value-based priority so bigger
    segments win label slots first.'
  - Only 2 of the spec's supported 2-4 hierarchy levels are used (level_3 is never
    exercised). Valid since level_3 is optional, but a 3-ring variant would better
    demonstrate the plot type's 'multiple levels simultaneously' value proposition
    called out in the spec description.
  - Several helper functions (mix, luma, labelColorFor, money, drawWedge) deviate
    from the flat imports->data->plot->save KISS structure. Reasonably justified by
    the amount of hand-rolled rendering needed to fake a native sunburst series, but
    it is not the minimal-code path.
  - The empty margin between the subtitle and the top of the rings (~435px of the
    2400px canvas) is somewhat larger than the bottom margin (~363px), giving the
    composition a very slightly bottom-heavy feel. Not severe, but trimming marginTop
    a bit would balance it further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white / cream, matching #FAF8F1 — not pure white.
      Chrome: Title "sunburst-basic · javascript · highcharts · anyplot.ai" in bold dark text (~44% canvas width, centered, fully visible, no clipping); subtitle in soft grey below it describing the two rings, units, and angle-value mapping. Both fully readable against the light background.
      Data: Two concentric rings. Inner ring = 4 root categories (Compute #009E73 brand green first, Storage #C475FD lavender, Networking #4467A3 blue, Databases #BD8233 ochre/tan) with bold in-wedge labels, text color auto-switched (white or dark) per wedge luminance for contrast. Outer ring = 14 service-level leaves, each a lightened tint (32% toward white) of its parent branch's color, most labeled (a few very small/long-named leaves like "Analytics Warehouse" and "VPN Gateways" are intentionally left unlabeled per the spec's own "smaller segments may show labels on hover" allowance). Center shows "$2,385K / total spend per year" in bold dark text on the cream hole. Thin cream-colored strokes separate every wedge for clean ring/level separation.
      Legibility verdict: PASS — no dark-on-light or otherwise unreadable text found; all labels, title, and subtitle are clearly legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light/soft-light text tones, fully legible against the dark background. Wedge separator strokes now render in the near-black page color, keeping the same clean separation effect.
      Data: Identical wedge fill colors to the light render (verified pixel-for-pixel — Compute/Storage/Networking/Databases and all 14 leaf tints unchanged), confirming only chrome flips between themes. In-wedge label text color is computed per-wedge (independent of page theme, since it's based on the wedge's own fill luminance), so labels remain legible on both light-fill wedges (dark text) and dark/saturated-fill wedges (light text) in both renders. Center KPI text renders in light ink, clearly visible against the near-black hole.
      Legibility verdict: PASS — no dark-on-dark failures found; every label, the title, subtitle, and center callout are all clearly readable.
