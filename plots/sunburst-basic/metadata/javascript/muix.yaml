review:
  strengths:
  - Builds the sunburst natively as stacked PieChart series, one per hierarchy level,
    with innerRadius/outerRadius per ring and a 10 px page-colored gap between rings,
    so each department's arc spans exactly its teams and projects (every ring lists
    segments in the same branch order)
  - 'Branch colors follow the Imprint order (Engineering #009E73, Design #C475FD,
    Marketing #4467A3, Operations #BD8233) and lighten per ring depth, so children
    carry their parent''s hue and stay distinguishable through shade plus 2 px page-colored
    separators in both themes'
  - Label ink is chosen per segment from the fill's relative luminance (white on Marketing
    blue, near-black elsewhere), and font size and weight step down from the inner
    to the outer ring, giving a clear typographic hierarchy that reads in both themes
  - Native arcLabelMinAngle drops labels on slivers (only the 7° Benefits segment
    goes unlabeled), and valueFormatter gives every segment a unit-bearing tooltip
    in the HTML view
  - Realistic, neutral org-budget scenario summing to exactly 1,000 thousand USD across
    4 departments, 9 teams and 18 projects, with the unit and totals carried in the
    subtitle
  weaknesses:
  - 'Suggestion: the hand-written relative-luminance block (lines 90–92) could use
    `getLuminance` from `@mui/material/styles`, which computes the same WCAG value.'
  - 'Suggestion: Benefits, the one unlabeled outer segment, could be identified in
    the static PNG through a lower `arcLabelMinAngle` on the outer ring if its label
    still fits inside its arc.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, including the empty centre hole.
      Chrome: bold title "sunburst-basic · javascript · muix · anyplot.ai" centered at the top in dark ink, a soft-gray subtitle "Budget (thousand USD) · total 1,000 across 4 departments, 9 teams, 18 projects" below it; no axes or grid. All text readable.
      Data: three concentric rings separated by page-colored gaps. Inner ring: Engineering (#009E73, about half the circle), Design (lavender #C475FD), Marketing (blue #4467A3), Operations (ochre #BD8233). Middle ring: 9 teams in lighter shades of their department's hue; outer ring: 18 projects in the lightest shades. Each child sits inside its parent's angular span; thin page-colored separators split neighbors. Labels in near-black on every segment except Marketing (white); only the thin Benefits sliver is unlabeled.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, including the centre hole and the ring gaps.
      Chrome: title in light ink, subtitle in light-gray soft ink; both clearly readable, no dark-on-dark text.
      Data: segment fills identical to the light render (same three tint levels per branch); separators and ring gaps flip to the dark page color. Segment labels keep their luminance-chosen ink (near-black on the pale fills, white on Marketing) and stay readable against their fills.
      Legibility verdict: PASS
