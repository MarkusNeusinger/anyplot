review:
  strengths:
  - 'Correct Imprint palette compliance: Engineering (largest department) uses brand
    green #009E73, the other three departments follow canonical order (lavender, blue,
    ochre); consistent hue-per-branch across all 3 rings via graduated opacity to
    encode depth.'
  - 'Fully theme-adaptive chrome: both light (#FAF8F1 bg, dark ink text) and dark
    (#1A1A17 bg, light ink text) renders are legible; per-label paintOrder halo (fill=ink,
    stroke=pageBg) keeps text readable against any wedge color in both themes.'
  - 'Creative library workaround: since MUI X has no native Sunburst component, nests
    3 PieChart series (departments/teams/projects) with matching value totals (1000
    each) and consistently ordered data so arcs stay angularly aligned, satisfying
    the spec''s ''inner segments visually encompass their children'' requirement.'
  - Center KPI overlay ('$1.0M / TOTAL BUDGET') creates a clear focal point and visual
    hierarchy without cluttering the radial chart.
  - arcLabelMinAngle thresholds correctly suppress labels on segments too small to
    fit text, avoiding overlap while still satisfying 'smaller segments show info
    on hover' via MUI X's native tooltip.
  - Realistic, well-scaled budget-allocation dataset spanning 4 departments / 9 teams
    / 18 projects with plausible magnitudes and full coverage of the hierarchy.
  weaknesses:
  - Outermost 'projects' ring labels (11px CSS ≈ 22px final) will likely be hard to
    read once the PNG is scaled to the ~400px mobile thumbnail — consider a slightly
    larger projects-ring arcLabel fontsize or a higher arcLabelMinAngle so only labels
    that stay legible at small scale are shown.
  - Team/project ring fills are produced by alpha-blending the department hue over
    the page background (rgba via the tint() helper), so their rendered color shifts
    between light and dark themes, unlike the literal Imprint hex used for the department
    ring — intentional per the code comment, but worth flagging against the style
    guide's 'identical across themes' wording for categorical positions.
  - hexToRgb/tint/currency helper functions add more structure than the minimal 'data
    → plot' pattern; acceptable given the tinting design but slightly more code than
    strictly necessary.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (not pure white, not dark).
      Chrome: Title "sunburst-basic · javascript · muix · anyplot.ai" is bold dark text, clearly visible at top-center. Three concentric rings (department / team / project) separated by thin cream-colored strokes matching the page background. Segment labels use dark ink fill with a cream stroke halo, fully readable against every wedge color. Center overlay "$1.0M / TOTAL BUDGET" in dark ink, clearly legible.
      Data: Four department branches — Engineering (brand green #009E73, largest), Design (lavender), Marketing (blue), Operations (ochre) — each department's hue carries into its team and project rings via progressively lighter opacity tints, keeping branch identity readable at every depth. Segment angles are visibly proportional to value, and each parent arc visually spans the same angular range as its children below it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (not pure black, not light).
      Chrome: Title renders in light/white text, clearly visible against the dark background. Ring separators are now dark strokes (page-background colored) giving the same clean visual break as in light mode. Segment labels use light ink fill with a dark stroke halo — fully readable on every wedge, no dark-on-dark or light-on-light failures observed. Center overlay "$1.0M / TOTAL BUDGET" in light ink, clearly legible.
      Data: Same four department hues as the light render (Engineering green #009E73 first/brand, Design lavender, Marketing blue, Operations ochre) — department-ring colors are identical hex values across themes. Team/project ring tints are alpha-blended over the page background, so their absolute rendered shade differs slightly from the light render (darker background makes the translucent fills read darker), while the underlying hue family per branch stays consistent and recognizable.
      Legibility verdict: PASS
