review:
  strengths:
  - 'Three concentric PieChart series (one per hierarchy level) with shared branch
    order give a true sunburst from the community surface: every child arc sits exactly
    inside its parent''s span (Engineering and Platform both end at ~173°)'
  - 'Branch hue follows Imprint order (Engineering #009E73, Design lavender, Marketing
    blue, Operations ochre) and lightens per ring depth, so children carry their department''s
    hue while staying distinguishable from their parent'
  - Label ink is chosen per segment from the fill's relative luminance (white on Marketing
    blue, dark ink elsewhere), keeping every label readable in both themes
  - Ring gaps and 2 px separators drawn in t.pageBg separate levels and neighbours
    in both themes; label size and weight step down by depth (18/700, 15/600, 14/600)
    to form a hierarchy
  - Native arcLabel + arcLabelMinAngle hides labels on thin segments (Benefits) and
    valueFormatter feeds the HTML tooltip with the budget unit
  - Plausible org-budget hierarchy (4 departments, 9 teams, 18 projects, total 1,000
    thousand USD) built from records with all structure derived from the data
  weaknesses:
  - 'VQ-01 (both): outer-ring project labels at 14 px are the smallest text on the
    1200 px canvas and blur to about 4–5 px in the 400 px thumbnail → about 16 px
    (+2 px), the size the ring comfortably holds. Likely cause: LABEL_SIZE[2] = 14.'
  - 'Suggestion: the empty centre (26 % of the radius) could carry the total budget
    instead of the subtitle, a common sunburst idiom.'
  - 'Suggestion: the unlabeled Benefits sliver could get its label via a slightly
    lower arcLabelMinAngle for the outer ring if it fits.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "sunburst-basic · javascript · muix · anyplot.ai" centred at top, soft-ink subtitle "Budget (thousand USD) · total 1,000 across 4 departments, 9 teams, 18 projects"; no axes or grid. All text readable.
      Data: three concentric rings around an empty centre separated by page-coloured gaps. Inner ring: Engineering (#009E73, ~48 %), Design (lavender), Marketing (blue), Operations (ochre). Middle ring: 9 teams in lighter tints of their department hue; outer ring: 18 projects in lighter tints still. Children align within their parent arcs. Labels on all segments except the thin Benefits sliver; dark ink on light fills, white "Marketing" on blue. Thin page-colour separators between segments.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle in light soft ink, both clearly readable; no dark-on-dark text.
      Data: identical segment colours to the light render; the ring gaps and separators now show in the dark page colour, so segments read as cleanly separated. Segment labels keep their luminance-based ink (dark on the light tints, white on Marketing) and remain readable. Brand green Engineering clearly visible.
      Legibility verdict: PASS
