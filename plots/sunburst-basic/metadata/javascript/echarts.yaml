review:
  strengths:
  - 'Correct Imprint palette with canonical branch ordering (green → lavender → blue
    → ochre) and #009E73 correctly assigned to the root/first Engineering branch'
  - WCAG-luminance-based per-segment text color function (textOn) guarantees every
    label has adequate contrast against its own fill, regardless of tint depth
  - Clean radial tint hierarchy (lighten) keeps each department's three rings visually
    cohesive, directly fulfilling the spec's "consistent colors within each branch"
    requirement
  - 'Well-balanced, uncluttered layout: content spans ~80% of canvas width and ~92%
    of height (including title) with no edge clipping and zero label overlap in either
    theme'
  - 'Idiomatic ECharts sunburst usage — per-level r0/r radius bands, label rotate
    mode switched between radial (inner rings) and tangential (outer ring), and emphasis:
    {focus: ''ancestor''} for genuine interactive drill-down highlighting in the HTML
    output'
  - Realistic, neutral org-budget dataset with sensible scale progression across departments
    (Engineering $1,860k > Sales $850k > Marketing $620k > Operations $420k)
  weaknesses:
  - Data storytelling is limited to what's inherent to the sunburst format (radial
    size + per-level font weight) — no intentional emphasis (e.g. subtle highlight
    or callout) draws the eye to the single largest budget item, so the chart displays
    the hierarchy without guiding the viewer to an insight
  - Code defines two module-level helper functions (lighten, textOn) rather than a
    fully flat Imports → Data → Plot → Save script; given the branch/team/project
    list is small and fixed, consider inlining the handful of resulting colors to
    better match the mandated KISS structure
  - 'Outermost (level-3) labels are set to fontSize: 12, which is legible at the full
    2400×2400 render but will shrink close to unreadable once the PNG is scaled down
    to a ~400px mobile thumbnail — a modest bump (or shortening only the tightest
    wedges) would improve mobile legibility'
  - 'Aesthetic polish is strong but stops short of "publication-ready": the plain
    white/pageBg wedge borders and flat tint fills leave room for further refinement
    (e.g. subtle radial shading or differentiated border treatment between hierarchy
    levels) to reach top-tier design excellence'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sunburst-basic · javascript · echarts · anyplot.ai" centered at top in bold dark ink, clearly visible. No axes (expected for a sunburst). Thin off-white/page-colored borders separate every wedge, giving clean ring separation.
      Data: Three concentric rings around a four-branch root — Engineering (green, #009E73), Sales (lavender/purple), Marketing (blue), Operations (ochre) — each branch's outer rings use progressively paler tints of its own hue, giving each department a coherent color family. Level-1 labels (Engineering, Sales, Marketing, Operations) are bold and radially oriented; level-2 labels (Platform, Product, Data Science, Enterprise, SMB, Growth, Brand, Finance, HR) are radial; level-3 (outermost) labels (Core API, Infra Migration, Mobile App, Web App, ML Models, Analytics, Key Accounts, New Business, Content, Design, Paid Ads, SEO, Accounting, Payroll, Recruiting, Benefits) are tangentially rotated and all fully legible with no truncation or overlap observed on close inspection.
      Legibility verdict: PASS — every label is readable, text color is chosen per-segment via a WCAG-luminance check so no label ever sits on a background of similar lightness.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now rendered in light ink, clearly visible against the dark background. Wedge borders now render in the dark page color, keeping the same clean ring separation as the light render.
      Data: All branch/ring colors are pixel-identical to the light render (green/lavender/blue/ochre families with the same paler tints per ring) — only the chrome (background, title ink, wedge borders) flipped, as required. No color drift detected between themes.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures found; every ring's label remains clearly readable because per-segment text color is computed independently of theme from each fill's own luminance, and that computation still resolves correctly against the dark chrome.
