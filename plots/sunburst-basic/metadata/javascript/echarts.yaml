review:
  strengths:
  - Branch-consistent radial tint hierarchy (root/team/project) with WCAG-luminance-picked
    label colors per tint gives a clean, readable result across all three rings in
    both themes
  - 'Genuine data storytelling: the subtitle callout plus a thicker/glowing border
    on the Engineering root wedge draws the eye directly to the $1.86M / 49.6% insight
    instead of leaving it implicit'
  - 'Idiomatic ECharts sunburst mastery: per-level r0/r radial bands, sort: null to
    preserve branch order, radial vs. tangential label rotation by depth, and emphasis.focus:
    ''ancestor'' for hover drill-down'
  - Root-ring categorical colors follow the Imprint canonical order exactly (green
    -> lavender -> blue -> ochre) and stay identical between light/dark; both renders
    pass theme-chrome checks
  - Realistic, internally consistent budget data - leaf values sum exactly to the
    stated $1.86M / 49.6% Engineering total
  weaknesses:
  - 'Team/project ring colors are one-off custom hex tints (e.g. #59C0A4, #D9A5FE,
    #859CC3, #D4AE7A) rather than derived from the 8 Imprint palette swatches - acceptable
    here as a hierarchy-tinting technique matching the spec''s ''consistent colors
    within each branch'' note, but keep this pattern consistent rather than letting
    it drift toward arbitrary custom hexes in future sunburst/treemap work'
  - 'Design Excellence is strong but not top-tier: the branch tinting is a fairly
    standard lighten/desaturate ramp rather than a truly bespoke palette, and the
    small outer-ring cluster (Benefits/Recruiting/SEO/Design) feels slightly denser
    than the rest of the chart'
  - 'Library mastery is solid but leaves some ECharts-only differentiators on the
    table beyond emphasis.focus: ''ancestor'' (e.g. label.minAngle handling for the
    smallest leaf slices)'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: title "sunburst-basic · javascript · echarts · anyplot.ai" in bold dark ink, subtitle "Engineering leads all departments — $1.86M, 49.6% of total R&D spend" in softer gray beneath it, both centered at the top and fully legible against the light surface.
      Data: four-department sunburst (Engineering/Sales/Marketing/Operations root ring in Imprint canonical order green/lavender/blue/ochre), each with a team ring and project leaf ring in a consistent lighter tint of the branch hue; root labels in white bold text, team/project labels in dark text — all clearly readable; Engineering's root wedge has a visibly thicker border and soft green glow highlighting it as the largest department.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: title and subtitle switch to light-colored text (white/light-gray), fully readable against the dark surface; no dark-on-dark text found anywhere in the chart.
      Data: same four-department palette and same per-branch tint hierarchy as the light render — Engineering green, Sales lavender/magenta, Marketing blue, Operations ochre are pixel-identical to the light version; only the chrome (background, title/subtitle color) flipped as expected.
      Legibility verdict: PASS
