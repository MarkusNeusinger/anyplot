review:
  strengths:
  - The critical dark-on-dark-equivalent label-contrast bug from attempts 1-2 is now
    correctly and robustly fixed via true WCAG relative luminance comparison against
    the resolved wedge fill, not HSL lightness thresholding - verified on the previously-failing
    green branch (Engineering 5.10:1, Compute 10.70:1) and on the palest lavender
    leaves.
  - Branch-consistent color derivation (base hue per top-level branch, lightened by
    depth via d3.hsl) satisfies the spec's 'use consistent colors within each branch'
    requirement.
  - Idiomatic, textbook D3 sunburst pipeline (d3.hierarchy + d3.partition + d3.arc)
    with thoughtful padAngle/padRadius tuning and radial label-rotation math.
  - 'Canonical Imprint palette order; backgrounds pixel-verified as exact #FAF8F1/#1A1A17;
    data hues confirmed bit-identical across themes.'
  - Realistic, neutral cloud-infrastructure-spend dataset, 13 leaf nodes across 2-3
    hierarchy levels, matching spec size/level guidance.
  weaknesses:
  - At the 400px thumbnail render, the deepest (level-3) leaf labels shrink small
    enough to be hard to parse individually - branch-level labels remain clearly readable
    at that scale, so this is a minor density tradeoff for a 13-leaf sunburst rather
    than a legibility defect.
  - Six small helper functions (wedgeHsl, colorFor, relLuminance, contrastRatio, labelColorFor,
    labelTransform) is on the higher end for KISS; each is justified by radial geometry
    + accessibility math but worth watching if the file grows further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled (250,248,241) = exact #FAF8F1.
      Chrome: Title "sunburst-basic · javascript · d3 · anyplot.ai" bold and centered at top, generous clearance, no clipping. All chrome elements clearly readable.
      Data: Canonical Imprint order - Engineering (#009E73 green, pixel-verified), Data & Analytics (#C475FD lavender), Operations (#4467A3 blue), each lightened per depth via HSL. First categorical series confirmed #009E73.
      Labels: labelColorFor() now computes true WCAG relative luminance for both ink candidates against the actual resolved wedge fill and picks the higher-contrast option. Verified via pixel crop + contrast math: "Engineering" (fill #009E73) = 5.10:1, "Compute" (fill rgb(0,229,167), the brightest lightened mint that previously measured 1.43:1 in attempt 2) = 10.70:1. Also spot-checked "Production", "Storage", "Networking", "Ad-hoc Queries", "Dashboards", "BI Tools" - all legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled (26,26,23) = exact #1A1A17.
      Chrome: Title renders in light ink, clearly legible against the dark surface. No dark-on-dark chrome issues.
      Data: Confirmed pixel-identical to light render (e.g. "Production" and "Engineering" wedges sampled bit-identical across both PNGs) - only chrome flipped.
      Labels: Same WCAG-luminance-based labelColorFor() applies identically since it keys off the wedge's own resolved fill, not the page background. Crops of "Engineering" and "Compute" confirm dark ink stays clearly legible against the green wedges in this theme too. No dark-on-dark or light-on-light failures found anywhere.
      Legibility verdict: PASS
