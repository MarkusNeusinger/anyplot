review:
  strengths:
  - 'The dark-theme label-color fix from attempt 1 works for 9 of 13 labels: labelColorFor()
    now derives text ink from each wedge''s own rendered HSL lightness (wedgeHsl(d).l
    > 0.5 ? dark ink : light ink) instead of the old fixed t.ink token, and this correctly
    restores strong contrast for the entire Data & Analytics (lavender) and Operations
    (blue) branches in both themes (measured 4.9-8.9:1, all WCAG AA-compliant).'
  - 'Idiomatic, textbook D3 sunburst pipeline unchanged and still clean: d3.hierarchy
    + d3.partition + d3.arc with padAngle/padRadius tuning and radial label-rotation
    math (rotate/translate/flip) — the canonical way to build this chart type in D3.'
  - 'Canonical Imprint palette order used correctly for the 3 top-level branches (#009E73
    -> #C475FD -> #4467A3); backgrounds are pixel-exact matches for the spec (#FAF8F1
    light / #1A1A17 dark), verified via direct pixel sampling.'
  - Realistic, neutral cloud-infrastructure-spend dataset with 13 leaf nodes spanning
    2-3 hierarchy levels, matching the spec's '10-50 leaf nodes across 2-4 levels'
    guidance and demonstrating real structural variety across branches.
  - Title format is exactly correct and generously clear of the canvas edge; direct
    in-wedge labeling doubles as a self-explanatory legend, so omitting a separate
    legend remains the right call for this chart type.
  weaknesses:
  - 'STILL-CRITICAL legibility bug for the green (Engineering) branch, in BOTH themes:
    labelColorFor() thresholds on raw d3.hsl(...).l, but HSL lightness does not track
    WCAG perceptual luminance across hues — green is weighted far higher (0.7152)
    than red/blue in the WCAG relative-luminance formula, so a green wedge with HSL
    l=0.45 is actually much brighter than a blue or purple wedge at the same l. Concretely,
    measured via pixel sampling + WCAG contrast math on the actual rendered RGB values
    (identical in light and dark renders since data hues don''t flip): ''Compute''/''Storage''/''Networking''
    (depth-2 mint fill rgb(0,229,167), HSL l=0.45, so the >0.5 check picks LIGHT text
    F0EFE8) = 1.43:1 contrast — functionally illegible, confirmed by visual crop inspection
    where the label nearly disappears into the fill. The top-level ''Engineering''
    label (depth-1 fill rgb(0,158,115), HSL l=0.31, light text picked) = 2.97:1 —
    below WCAG AA 4.5:1 and even below the 3:1 large-text minimum. This affects 4
    of 13 labels (Engineering, Compute, Storage, Networking), all in the brand-color/first-series
    branch, in both plot-light.png and plot-dark.png (the bug is theme-independent
    since it depends only on the wedge''s own HSL lightness, not the page theme).
    Fix: replace the HSL-lightness threshold with an actual WCAG relative-luminance
    calculation on the resolved wedge RGB (linearize each channel, weight 0.2126/0.7152/0.0722,
    threshold around luminance 0.4-0.5), or use CIELAB L* (d3.lab(color).l) instead
    of d3.hsl(...).l — Lab lightness correlates with perceptual brightness across
    hues far better than HSL lightness does. Verify by re-checking contrast specifically
    on the green branch''s depth-1 and depth-2 wedges after the fix, not just spot-checking
    a couple of labels.'
  - 'Minor: four small helper functions (wedgeHsl, colorFor, labelColorFor, labelTransform)
    are now used for per-node color/label math; still justified given the radial geometry,
    but keep an eye on KISS as the file grows further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, confirmed #FAF8F1 (250,248,241) via pixel sample -- matches spec exactly, not pure white.
      Chrome: Bold dark title "sunburst-basic · javascript · d3 · anyplot.ai" centered at top with generous clearance from the canvas edge (no clipping). All in-wedge segment labels use per-wedge ink selection (labelColorFor) rather than the old fixed dark ink.
      Data: Three top-level branches use canonical Imprint palette order -- Engineering = #009E73 (brand green, verified first series), Data & Analytics = #C475FD (lavender), Operations = #4467A3 (blue) -- with each branch's children rendered as progressively lighter tints of the same hue via HSL lightening.
      Legibility verdict: FAIL -- most labels (Data & Analytics and Operations branches, all depths) are clearly legible with strong contrast, but the Engineering (green) branch's depth-1 and depth-2 labels are not: "Compute", "Storage", and "Networking" render in near-white text on a bright mint fill (rgb(0,229,167)) at a measured WCAG contrast of only 1.43:1 -- the text visibly washes out into the background in a direct pixel crop. "Engineering" itself (depth-1, rgb(0,158,115)) measures 2.97:1, below the WCAG AA 4.5:1 minimum. This reproduces in the light render because labelColorFor() depends only on the wedge's own HSL lightness, not the page theme.

    Dark render (plot-dark.png):
      Background: Warm near-black, confirmed #1A1A17 (26,26,23) via pixel sample -- matches spec exactly, not pure black.
      Chrome: Title renders in light ink and is clearly legible against the dark page background, well clear of the canvas edge.
      Data: Confirmed wedge fill colors are pixel-identical between the light and dark renders (e.g. the "Compute" wedge is exactly rgb(0,229,167) in both PNGs) -- only chrome flipped, as required.
      Legibility verdict: FAIL -- same root cause and same specific labels as the light render ("Engineering" 2.97:1, "Compute"/"Storage"/"Networking" 1.43:1), since the bug is theme-independent. All other labels (Data & Analytics and Operations branches) are legible with good contrast (4.9-8.9:1, WCAG AA compliant), confirming the attempt-1 fix direction was correct but the HSL-lightness threshold used to implement it is miscalibrated for the green hue family.
