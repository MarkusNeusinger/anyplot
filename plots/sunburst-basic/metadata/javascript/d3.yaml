review:
  strengths:
  - Branch-consistent color derivation (base hue per top-level branch, progressively
    lightened by depth via d3.hsl) directly satisfies the spec's 'use consistent colors
    within each branch' requirement and reads as a clean hierarchy in the light render.
  - 'Idiomatic, textbook D3 sunburst pipeline: d3.hierarchy + d3.partition + d3.arc
    with padAngle/padRadius tuning and radial label-rotation math (rotate/translate/flip)
    — the canonical way to build this chart type in D3.'
  - 'Canonical Imprint palette order used correctly for the 3 top-level branches (#009E73
    -> #C475FD -> #4467A3), and both plot backgrounds are exact matches for the spec
    (#FAF8F1 light / #1A1A17 dark), with data hues verified pixel-identical between
    the two renders.'
  - Realistic, neutral cloud-infrastructure-spend dataset with 13 leaf nodes spanning
    2-3 hierarchy levels (some branches 2 levels deep, others 3), matching the spec's
    '10-50 leaf nodes across 2-4 levels' guidance and demonstrating real structural
    variety rather than a uniform tree.
  - Title format is exactly correct, and direct in-wedge labeling doubles as a self-explanatory
    legend, so omitting a separate legend is the right call for this chart type.
  weaknesses:
  - 'CRITICAL dark-render legibility failure: every in-wedge label uses the fixed
    ink token (t.ink, #F0EFE8 in dark theme) regardless of the wedge''s own fill lightness.
    Because colorFor() intentionally lightens fills by depth (up to L~0.82 for outer
    leaves), pairing near-white text with those already-light pastel wedges produces
    severe low-contrast text in dark mode -- measured via WCAG relative luminance:
    ~1.1:1 for ''Production'' (white text on the lightened mint outer ring), ~1.7:1
    for ''Ad-hoc Queries'' / ''Dashboards'' / ''BI Tools'' (white text on the pale
    lavender wedges), and only 2.5-4.9:1 even at the un-lightened depth-1 labels for
    the green and purple branches (''Engineering'' ~3.0:1, ''Data & Analytics'' ~2.5:1)
    -- all below the WCAG AA 4.5:1 minimum for normal text. This is functionally the
    dark-theme equivalent of ''dark-on-dark'' text: most segment labels are illegible
    in plot-dark.png even though the identical labels read perfectly in plot-light.png
    (6-13:1 contrast there, since dark ink text works against any lightness of fill).
    Fix: derive each label''s fill color from the actual rendered wedge lightness
    (e.g. pick a light or dark label color per node based on colorFor(d)''s luminance,
    similar to a ''best text color for background'' heuristic) rather than a single
    global ink token, or add a thin ink-colored text outline/halo so labels stay legible
    over any wedge shade in both themes.'
  - 'Minor: two small helper functions (colorFor, labelTransform) are used for the
    per-node color and label-transform math; justified here given the radial geometry,
    but keep an eye on KISS as the file grows.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, confirmed #FAF8F1 (250,248,241) via pixel sample -- matches spec exactly, not pure white.
      Chrome: Bold dark title "sunburst-basic · javascript · d3 · anyplot.ai" centered at top, clearly legible. All in-wedge segment labels (inner-ring branch names "Engineering"/"Data & Analytics"/"Operations" in bold 16px, outer leaf names in 13px) render in dark ink text and are clearly legible against every wedge shade, from the saturated inner-ring brand colors to the lightened pastel outer-ring tints. No overlapping text observed; radial rotation keeps every label following its wedge's angle without colliding with neighbors.
      Data: Three top-level branches use canonical Imprint palette order -- Engineering = #009E73 (brand green, verified first series), Data & Analytics = #C475FD (lavender), Operations = #4467A3 (blue) -- with each branch's children rendered as progressively lighter tints of the same hue, giving a clear "family" grouping per branch. Segment angles are visually proportional to value (e.g. "Production" and "ML Training" occupy the largest arcs under Compute).
      Legibility verdict: PASS -- all text is readable against the light background and against every wedge fill.

    Dark render (plot-dark.png):
      Background: Warm near-black, confirmed #1A1A17 (26,26,23) via pixel sample -- matches spec exactly, not pure black.
      Chrome: Title renders in light ink and is clearly legible against the dark page background. However, the in-wedge segment labels use the SAME fixed near-white ink token as the title, regardless of the wedge's own (lightened) fill color. Measured contrast ratios (WCAG relative luminance): "Production" white text on the lightened mint outer-ring wedge = ~1.1:1; "Ad-hoc Queries"/"Dashboards"/"BI Tools" white text on the pale lavender wedges = ~1.7:1; even the un-lightened depth-1 labels only reach ~2.5:1 (Data & Analytics) to ~4.9:1 (Operations) -- all below the WCAG AA 4.5:1 threshold for normal text except Operations, which is borderline. This is a dark-on-dark-equivalent failure (here: light-text-on-light-wedge) that makes most segment labels difficult or impossible to read in this render.
      Data: Confirmed programmatically that wedge fill colors are pixel-identical between the light and dark renders (e.g. the "Production" wedge is exactly (46,255,198) in both PNGs) -- only chrome flipped, as required.
      Legibility verdict: FAIL -- most in-wedge segment labels are illegible against their own wedge fill due to insufficient contrast; only the title and the darkest (Operations/depth-1) labels are reliably readable.
