review:
  strengths:
  - 'labelColorFor() now computes WCAG contrast ratios against both candidate text
    colors (#1A1A17 and #F0EFE8) and picks the higher-contrast one, fixing attempt
    1''s washed-out level-2 labels — verified by re-deriving the tint math: Reports/Invoices/Contracts
    (green tint) and Tutorials (ochre tint) now resolve to dark text at 7.9:1 and
    8.4:1 contrast respectively, versus ~2:1 before'
  - Three-ring layered-doughnut technique still builds a convincing sunburst with
    no native Chart.js sunburst type, with parent-child value sums kept exact so each
    ring's arcs stay angularly aligned with the ring inside it
  - 'Branch-consistent hue tinting (same base hue lightened per outward ring) makes
    hierarchical relationships instantly readable and stays pixel-identical between
    light and dark renders — only chrome (background, borders) flips, confirmed via
    corner-pixel sampling (#FAF8F1 light / #1A1A17 dark)'
  - Text remains fully legible even at the 400px mobile-preview scale in both themes,
    and the custom radialLabels plugin correctly suppresses labels on segments under
    20° (e.g. the small Clips slice), matching the spec's "label major segments; smaller
    on hover" requirement via breadcrumb tooltips
  weaknesses:
  - Design Excellence is solid but not exceptional — spacing, arc separators, and
    typographic hierarchy are clean and intentional, but there's room for a stronger
    focal point or more distinctive visual flourish before this reads as top-tier
    (DE-01/DE-03 kept at defaults-plus-evidence rather than max).
  - A few helper functions (tint, relativeLuminance, contrastRatio, labelColorFor)
    push this past a single-block script; justified by the custom-plugin workaround
    Chart.js's lack of a native sunburst type requires, but still a minor CQ-01 deduction.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled corner pixel (250,248,241) ≈ #FAF8F1 as required — not pure white.
      Chrome: Title "sunburst-basic · javascript · chartjs · anyplot.ai" in bold dark ink, fully visible with clear margin above (no top-edge clipping). Thin page-background-colored separators divide all arcs cleanly.
      Data: Three concentric rings form the sunburst — innermost (level-1: Documents/Photos/Code/Videos) in large bold labels, middle (level-2: Reports/Invoices/Contracts/Vacation/Family/Frontend/Backend/Tutorials — Clips omitted, arc <20°) with smaller labels, outer (level-3 leaves) unlabeled by design (hover-only, per spec). First branch (Documents) uses Imprint brand green #009E73; other branches use the canonical palette order (lavender, blue, ochre), lightened per outward ring for branch identity.
      Legibility verdict: PASS. Re-derived the label-color math for every branch/ring combination: level-1 and level-2 labels all resolve to dark (#1A1A17) text against their backgrounds except the blue (Code) level-1 arc, which correctly resolves to light (#F0EFE8) text — contrast ratios range 4.9:1–8.9:1 across all labeled segments, comfortably above WCAG AA. The teal/ochre labels that were washed out in attempt 1 (Reports/Invoices/Contracts/Tutorials) now sit at 7.9:1–8.4:1. Confirmed readable at the 400px mobile-preview thumbnail too.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled corner pixel (26,26,23) = #1A1A17 exactly as required — not pure black.
      Chrome: Title and level-1/level-2 labels flip to the theme-appropriate ink and remain fully readable — no dark-on-dark failures anywhere on the ring.
      Data: Confirmed pixel-identical branch hues and tint ladders to the light render — only page background and border color (which matches page background, used as the inter-arc spacer) flipped, per the theme-adaptive-chrome contract. The label-color fix applies identically since the underlying arc colors don't change with theme.
      Legibility verdict: PASS. Same contrast-ratio verification as the light render applies (label color choice is theme-independent by design, comparing against fixed #1A1A17/#F0EFE8 candidates), and both corner-pixel and visual inspection confirm no washed-out or invisible text.
