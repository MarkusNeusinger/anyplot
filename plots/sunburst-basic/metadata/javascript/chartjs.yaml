review:
  strengths:
  - Clever three-ring doughnut-stacking technique builds a true sunburst despite Chart.js
    having no native sunburst type, with careful parent-child ordering so each ring's
    arcs stay angularly aligned with the ring inside it
  - Branch-consistent hue tinting (same base hue lightened per outward ring via a
    shared tint() helper) makes the hierarchical branch relationships instantly readable,
    and stays identical between light and dark renders since only chrome flips
  - Custom radialLabels afterDatasetsDraw plugin draws labels only on segments wider
    than 20 degrees, matching the spec's 'label major segments; smaller segments may
    show labels on hover' requirement, backed by breadcrumb tooltips (e.g. 'Documents
    ▸ Reports') for the unlabeled leaf ring
  - 'Data hierarchy is fully consistent end to end — every parent''s value exactly
    equals the sum of its children across all three levels — and the first categorical
    series correctly maps to Imprint brand green #009E73'
  weaknesses:
  - labelColorFor()'s luminance>0.45 threshold picks low-contrast light text (#F0EFE8)
    for the teal-tinted level-2 labels (Reports/Invoices/Contracts, background luminance
    ≈ 0.43) and the ochre-tinted label (Tutorials, luminance ≈ 0.44) — contrast ratio
    is only ~2:1 in both themes (identical bug light/dark since the arc colors never
    change). Dark text (#1A1A17) against those same backgrounds would give ~7.6:1.
    The light/dark crossover for this palette should sit closer to luminance ≈ 0.20-0.25,
    not 0.45 — either lower the threshold or compute the contrast ratio against both
    candidate text colors and pick the higher one.
  - Several helper functions (tint, relativeLuminance, labelColorFor) push this past
    a single-block KISS script; justified by the custom-plugin workaround Chart.js's
    lack of a native sunburst type requires, but still adds structure beyond the simplest
    possible implementation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme page background.
      Chrome: Title "sunburst-basic · javascript · chartjs · anyplot.ai" in dark ink, bold, centered at top, fully readable. No axes/legend (correctly omitted for a radial hierarchy chart). Level-1 (innermost ring) labels "Documents", "Photos", "Code", "Videos" render in large bold text with automatically-chosen light or dark color per segment luminance, and are all clearly legible. Level-2 (middle ring) labels are mixed: "Vacation", "Family" (on light lavender) and "Backend", "Frontend" (on light steel-blue) render in dark text with strong contrast, but "Reports", "Invoices", "Contracts" (on medium teal) and "Tutorials" (on medium tan) render in light cream text that sits at low contrast (~2:1) against their medium-luminance backgrounds — legible but visibly washed out compared to the other labels. The outer (level-3, leaf) ring is intentionally unlabeled per spec, relying on hover tooltips.
      Data: Four branches use Imprint palette hues in canonical order — Documents=#009E73 (brand green, first series ✓), Photos=#C475FD (lavender), Code=#4467A3 (blue), Videos=#BD8233 (ochre) — each branch lightened via a consistent tint for its outer rings, giving clear parent→child visual grouping. Thin off-white borders separate every arc.
      Legibility verdict: PASS overall (title and level-1 labels fully legible), with a FLAGGED partial issue: level-2 labels on teal/ochre backgrounds (Reports, Invoices, Contracts, Tutorials) have low but still-readable contrast.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme page background — not pure black.
      Chrome: Title renders in light ink (#F0EFE8), fully readable against the dark background — no dark-on-dark failure. Level-1 labels "Documents", "Photos", "Code", "Videos" remain fully legible (light/dark text choice unaffected by theme since it's derived from the arc's own fixed background hue). Level-2 labels reproduce the exact same contrast pattern as the light render: "Vacation"/"Family"/"Backend"/"Frontend" are high-contrast dark text on their light-tinted arcs, while "Reports"/"Invoices"/"Contracts"/"Tutorials" are low-contrast light text on their medium-tinted arcs — the same ~2:1 issue, since the arc fill colors (and thus the label-color decision) never change with theme, only the surrounding page chrome does.
      Data: Confirmed identical to the light render — same four branch hues and same tint ladders per ring; only the page background, title ink, and canvas border color flipped, exactly per the theme-adaptive-chrome contract.
      Legibility verdict: PASS overall (no dark-on-dark chrome failures), with the same FLAGGED partial low-contrast issue on the teal/ochre level-2 labels as the light render.
