review:
  strengths:
  - Idiomatic coord_polar(theta="y") + geom_rect construction builds a true two-level
    sunburst since ggplot2 has no native sunburst geom — department boundaries exactly
    encompass their children's angular span as required by the spec.
  - Departments sorted by descending total budget, producing a clear reading order
    and visual hierarchy (bold inner labels vs. lighter outer labels).
  - 'Both backgrounds are pixel-exact theme tokens (#FAF8F1 light / #1A1A17 dark),
    and the Imprint categorical palette is applied in canonical order with Engineering
    (the largest department) correctly taking #009E73.'
  - Small-span team labels are suppressed (span > 0.035 gate) instead of overlapping,
    and label font size scales down for narrow department wedges to avoid overflow.
  - Donut gap between rings (PAGE_BG-colored stroke) gives clean visual separation
    between hierarchy levels, satisfying the spec's 'clear visual separation between
    hierarchy levels' note.
  weaknesses:
  - 'Outer (team) ring text is nearly unreadable in the LIGHT render: label_ink is
    computed once from each department''s full-saturation base hex via relative_luminance(),
    then reused for the team_df geom_text even though the team wedges are drawn with
    alpha = 0.55 over the light #FAF8F1 background. That blending washes every department
    color into a pastel tint (measured wedge pixels: SMB/Enterprise ≈ RGB(221,176,248),
    Facilities/HR/Finance ≈ RGB(217,183,137), Platform/Infrastructure/Data Science
    ≈ RGB(113,199,172)), so the white ink (#FFFDF6) chosen for all of them lands at
    only ~1.7-2.0:1 contrast — well under the 3:1 WCAG floor for large text. The same
    alpha blend over the near-black dark background instead deepens the wedge colors,
    so the identical white ink reads at ~6.3-6.9:1 there — the bug is light-theme-only
    and affects all 11 outer-ring team labels. Fix: compute label_ink separately for
    team_df using the luminance of the actual alpha-composited color (blend fill_hex
    with PAGE_BG at alpha 0.55 before the luminance test) so the ink flips to dark
    in light mode, or raise alpha for the outer ring closer to 1.0 so the base-color
    luminance test stays valid in both themes.'
  - Two small helper functions (relative_luminance, wedge_label_angle) push the script
    slightly past a strict Imports → Data → Plot → Save KISS structure; understandable
    given the manual sunburst geometry ggplot2 doesn't provide natively, but keep
    an eye on further growth.
  - Only 2 hierarchy levels (department/team) are shown; the spec's optional level_3
    (grandchild) ring is omitted, so the multi-level depth of the chart type isn't
    fully demonstrated even though this is spec-compliant (level_3 is explicitly optional).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at RGB(250,248,241) which is an exact match for the #FAF8F1 token. Correct, not pure white.
      Chrome: Title "sunburst-basic · r · ggplot2 · anyplot.ai" is bold dark text (#1A1A17), centered, comfortably readable, occupying roughly 55-60% of the canvas width. Legend on the right titled "Department" with four colored swatches (Engineering/Sales/Marketing/Operations) in dark ink on the page background — fully legible.
      Data: Two concentric rings inside a donut, separated by a thin page-background gap. Inner ring shows four solid-color department wedges (Engineering #009E73 green — largest, Sales lavender/purple, Marketing blue-grey, Operations tan/ochre), each with a bold, high-contrast label ("Engineering", "Sales", "Marketing", "Operations") in white or dark ink depending on the wedge's luminance — these read clearly. First categorical color is confirmed as #009E73 assigned to the largest department (Engineering), matching the Imprint palette rule.
      Outer ring shows 11 team wedges colored as their parent department at alpha≈0.55, which lightens every wedge toward pastel tones on this light background (e.g. the Sales/SMB wedge measures ~RGB(221,176,248), Operations/HR ~RGB(217,183,137), Engineering/Platform ~RGB(113,199,172)). All outer-ring labels use the same white ink as the inner ring, and pixel/contrast analysis puts these at only ~1.7-2.0:1 contrast against their pastel backgrounds — well under the WCAG 3:1 floor for large text. The letters are visible under close inspection but read as faint/washed-out at normal viewing size across all 11 team labels (Platform, Infrastructure, Data Science, Enterprise, SMB, Brand, Growth, Content, Facilities, HR, Finance).
      Legibility verdict: FAIL — outer-ring team labels are low-contrast ("light-on-light") throughout the light render; inner-ring department labels, title, and legend are all fine.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB(26,26,23), an exact match for the #1A1A17 token. Correct, not pure black.
      Chrome: Title renders in light ink (#F0EFE8), clearly legible against the dark background. Legend swatches and labels (light ink) are equally legible.
      Data: Same four Imprint hues for the inner ring, confirmed identical to the light render (e.g. Engineering green, Sales purple) — only chrome flipped as required. Inner-ring department labels remain bold and high-contrast.
      For the outer ring, the same alpha≈0.55 blend now composites toward the near-black page background instead of the light one, which deepens/saturates each wedge color rather than washing it out (e.g. Sales/SMB measures ~RGB(120,76,149), Operations/HR ~RGB(116,83,38)). Against these deeper wedge colors the same white team-label ink reads at ~6.3-6.9:1 contrast — comfortably legible, no dark-on-dark issue anywhere in this render.
      Legibility verdict: PASS — all text, including the outer ring, is clearly readable in the dark render.
