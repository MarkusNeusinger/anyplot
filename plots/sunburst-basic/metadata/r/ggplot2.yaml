review:
  strengths:
  - 'Attempt-1 fix correctly applied: team-ring label_ink is now derived from the
    alpha=0.55-composited color via blend_hex() (blend fill_hex with PAGE_BG before
    the luminance test) instead of the solid base hue, so light-theme outer-ring labels
    correctly flip to dark ink while the already-correct dark-theme white ink is untouched
    — verified visually across all 11 outer-ring labels in both renders.'
  - Idiomatic coord_polar(theta="y") + geom_rect construction builds a true two-level
    sunburst since ggplot2 has no native sunburst geom; department wedges exactly
    encompass their children's angular span as required by the spec.
  - 'Departments sorted by descending total budget, producing a clear reading order
    and visual hierarchy (bold inner labels vs. lighter outer labels), with Engineering
    (the largest department) correctly assigned #009E73.'
  - 'Both backgrounds are pixel-exact theme tokens (#FAF8F1 light / #1A1A17 dark)
    and data colors are confirmed identical between renders — only chrome and the
    alpha-composite outcome differ.'
  - Small-span team labels are suppressed (span > 0.035 gate) instead of overlapping,
    and department label font size scales down for narrow wedges to avoid overflow.
  weaknesses:
  - Only 2 of the spec's allowed 2-4 hierarchy levels are shown (level_3 grandchild
    ring omitted). This is spec-compliant since level_3 is explicitly optional, but
    a third ring would better demonstrate the depth range the chart type supports.
  - Three small helper functions (relative_luminance, blend_hex, wedge_label_angle)
    push the script slightly past a strict Imports -> Data -> Plot -> Save KISS structure.
    Understandable given the manual sunburst geometry ggplot2 doesn't provide natively,
    but worth keeping minimal if further changes are made.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching the #FAF8F1 token. Correct, not pure white.
      Chrome: Title "sunburst-basic · r · ggplot2 · anyplot.ai" is bold dark text, centered, comfortably readable. Legend on the right titled "Department" with four colored swatches (Engineering/Sales/Marketing/Operations) in dark ink — fully legible.
      Data: Two concentric rings inside a donut, separated by a thin page-background gap. Inner ring shows four solid department wedges (Engineering #009E73 green — largest, Sales lavender, Marketing steel blue, Operations tan/ochre), each with a bold high-contrast label in white or dark ink depending on the wedge's luminance. Outer ring shows 11 team wedges at alpha=0.55 over the light background, which washes each color toward pastel — but the fix from attempt 1 is now correctly applied: all 11 team labels (Platform, Infrastructure, Data Science, Enterprise, SMB, Brand, Growth, Content, Facilities, HR, Finance) render in dark ink and are clearly legible against their pastel wedges. No light-on-light text anywhere.
      Legibility verdict: PASS — all chrome and both rings are readable; the attempt-1 outer-ring contrast bug is resolved.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching the #1A1A17 token. Correct, not pure black.
      Chrome: Title renders in light ink, clearly legible against the dark background. Legend swatches and labels (light ink) are equally legible.
      Data: Same four Imprint hues for the inner ring, confirmed identical to the light render (e.g. Engineering green, Sales purple) — only chrome flipped, as required. Inner-ring department labels remain bold and high-contrast. Outer ring: the same alpha=0.55 blend now deepens each wedge color against the near-black background, and all 11 team labels render in white ink, clearly legible — no dark-on-dark issue anywhere in this render.
      Legibility verdict: PASS — all text, including the outer ring, is clearly readable in both themes; data colors confirmed identical between renders.
