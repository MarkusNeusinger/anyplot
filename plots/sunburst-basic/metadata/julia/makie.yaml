review:
  strengths:
  - 'Radial geometry is mathematically correct: child angular spans sum exactly to
    their parent branch''s span, satisfying the spec''s ''inner segments should visually
    encompass their children''s angular span'' requirement.'
  - Branch-consistent color shading (HSL lightness step-up per child, same hue as
    parent) directly fulfills the spec note 'use consistent colors within each branch'
    while keeping branch base colors on the Imprint canonical order (#009E73 first).
  - Per-wedge luminance-based text color (branch_label_color / child_label_color)
    picks dark or light ink automatically so labels stay readable against both saturated
    and pastel wedge fills, in both themes.
  - Canvas lands exactly on the canonical 2400x2400 square target, theme chrome (background,
    title, text) is correctly swapped between light and dark, and data colors are
    pixel-identical across themes.
  - Realistic, neutral, on-spec dataset (repository storage breakdown by directory
    in MB) matches one of the specification's own example applications verbatim.
  - 'Clean KISS script: no functions/classes, deterministic hardcoded data, only used
    imports (CairoMakie, Colors).'
  weaknesses:
  - Only 2 hierarchy levels are used (level_3 grandchild ring is omitted). This is
    spec-legal since level_3 is optional, but a 3rd ring would better exercise the
    plot type's full multi-level capability for Data Quality/Feature Coverage.
  - The sunburst is built from generic `poly!` polygons plus manual trigonometry rather
    than any Makie-distinctive recipe or feature, so Library Mastery reads as fairly
    generic/replicable in other libraries (e.g. matplotlib Wedge patches).
  - Smallest children (e.g. 'Fixtures', ~40 of 285 in Test Suite) fall below the deg2rad(10)
    label threshold and are left unlabeled with no fallback (e.g. no legend or value
    callout), so a few leaf nodes have no visible identifying text at all.
  - The strokewidth=3 background-colored separators between wedges are on the thicker
    side relative to the ~13px-per-radius-unit scale of the chart; a thinner stroke
    would read as more refined/polished at this quality bar.
  - Branch label font (15pt) and child label font (12pt) are noticeably smaller than
    the 20pt title; on a 2400px canvas that gap is fine at desktop size but the 12pt
    child labels are the first thing to get borderline at ~400px mobile width.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sunburst-basic · julia · makie · anyplot.ai" bold dark text, top-center, ~49% of canvas width, fully visible with no clipping. No axis ticks/spines (correctly hidden for a radial chart). No legend — direct in-wedge labels substitute for one, which is appropriate here.
      Data: Two concentric rings around a hollow center. Inner ring = 4 branches (Source Code #009E73 green, Test Suite #C475FD lavender, Assets #4467A3 blue, Documentation #BD8233 ochre) — matches Imprint canonical order with brand green first. Outer ring = children rendered as lighter tints of their parent's hue, preserving branch identity. Per-wedge label color auto-switches dark/light ink based on wedge luminance; all sampled labels (Core Engine, UI Components, Test Suite, Unit Tests, Assets, Images, Documentation, API Reference, Icons) are legible against their fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in light/off-white text, clearly legible against the dark background. No dark-on-dark text observed anywhere — tick/axis chrome is hidden entirely (not applicable to this chart type) so there is no separate axis-label failure surface.
      Data: Identical wedge colors and layout to the light render (green/lavender/blue/ochre branches with matching child tints) — only the page background and title/label ink flipped, confirming theme-adaptive chrome without touching data colors.
      Legibility verdict: PASS
