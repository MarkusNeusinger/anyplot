review:
  strengths:
  - Correctly builds a true 3-level sunburst (department → team → subproject) via
    manual arc-polygon geometry — a legitimate workaround for plotnine's lack of a
    native polar-bar geom, with angular spans that correctly nest (each ring's arc
    sums to its parent's span).
  - Imprint palette applied in canonical order (Engineering=#009E73, Marketing=#C475FD,
    Operations=#4467A3, R&D=#BD8233), identical across light/dark renders, with only
    chrome (background, text, ring separators) flipping between themes.
  - 'Strong data storytelling: the largest department (Engineering, 40%) gets a bold
    ink-colored focal outline across all three rings it touches, department-level
    percentage labels are shown, and a center KPI ($100M / Total Budget) anchors the
    whole chart — creates a clear visual hierarchy without gimmicks.'
  - Label-density thresholds (>=8% for team labels, >=6% for subproject labels) keep
    the outer ring readable by omitting labels on segments too small to hold text,
    matching the spec's guidance that smaller segments need not always be labeled.
  - Deterministic, realistic business dataset (company budget by department/team/subproject)
    with 22 leaf nodes across 3 levels, well within the spec's 10-50 leaf / 2-4 level
    range, and plausible relative magnitudes.
  - Square 2400x2400 canvas is the correct format choice for a radial/symmetric chart
    type, and the ring geometry uses the canvas generously with balanced margins.
  weaknesses:
  - The focal department (Engineering) gets a bold ink-colored stroke (size=1.3) at
    its L1 inner-radius boundary, which sits close enough to the 'Engineering' label's
    descenders (the two 'g' letters) that the label reads as slightly crowded against
    the ring border — the three non-focal department labels don't have this issue
    since their edge stroke is thin and colored to blend with the background. Nudge
    the L1 label radius (r_label) outward slightly, or reduce EDGE_SIZES['L1_focal'],
    so the focal department's bold border doesn't crowd its own name.
  - The single `arc_polygon()` helper function is a reasonable DRY exception, but
    the overall script leans on a fairly involved manual-geometry approach (loops
    building four separate row-lists) rather than a more KISS-flat script; acceptable
    given plotnine's lack of native sunburst support, but keep an eye on this if plotnine
    ever gains a polar-bar geom.
  - 'LM-02: the arc-polygon-via-geom_polygon technique is essentially a grammar-of-graphics
    workaround that would port almost unchanged to ggplot2 (R) with minimal syntax
    changes — it doesn''t lean on anything uniquely plotnine-specific beyond its theme()/element_*
    API.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sunburst-basic · plotnine · anyplot.ai" in dark ink, centered at top, fully visible and not clipped. No axis labels or ticks (appropriately hidden for a radial chart). Department names (Engineering, Marketing, Operations, R&D) render in bold dark ink directly on their colored wedges; percentage labels (40%, 25%, 20%, 15%) render in a softer grey directly beneath. Team names (Frontend, Backend, DevOps, Digital, Brand, HR, Product) and subproject names (Web, Mobile, API, Data Pipeline, Infra, Paid Ads) render in dark ink on the middle/outer rings. Center of the donut hole shows "$100M" in bold dark ink with "Total Budget" beneath in grey.
      Data: Engineering wedge is brand green (#009E73), Marketing is lavender/purple (#C475FD), Operations is blue (#4467A3), R&D is ochre (#BD8233) — matches canonical Imprint order. Alpha decreases per ring outward (1.0 -> 0.72 -> 0.48), giving each department's rings a consistent-but-lightening color family, exactly as the spec asks ("consistent colors within each branch").
      Legibility verdict: PASS. All text is clearly readable against both the cream background and the colored wedges. Minor exception: the "Engineering" label's descenders sit close to the bold black focal-department ring border, but the text remains fully legible (not cut off, not overlapping other text) — noted as a weakness, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title renders in light ink, clearly visible against the dark background. Department, team, and subproject labels switch to light ink (#F0EFE8) so they remain readable against both the dark page background and the (still-saturated) colored wedges. Percentage/caption text switches to the lighter secondary tone (#B8B7B0). Ring separators use a slightly-lighter-than-background dark grey (#2E2D2B) so ring boundaries stay visible against the near-black page.
      Data: Confirmed identical hex values to the light render — Engineering green, Marketing lavender, Operations blue, R&D ochre — only the chrome (text, background, ring-separator, edge colors) flips.
      Legibility verdict: PASS. No dark-on-dark failures found — all text uses the theme-adaptive INK/INK_SOFT tokens and is clearly visible against both the near-black background and the colored wedges. The center "$100M" KPI and "Total Budget" caption are both legible in light ink against the dark donut-hole background.
