review:
  strengths:
  - Correct Imprint palette usage in canonical order (Engineering=#009E73, Marketing=#C475FD,
    Operations=#4467A3, R&D=#BD8233), first series is brand green as required
  - 'Theme-adaptive chrome is correctly threaded through both renders — no dark-on-dark
    or light-on-light failures, backgrounds match #FAF8F1/#1A1A17 exactly'
  - Clever two-ring sunburst built from scratch with geom_polygon (plotnine has no
    native polar coordinate system) — inner wedges' angular span correctly encompasses
    the sum of their children's angles
  - Sensible label-suppression threshold (only segments >=8% share get a text label)
    keeps the outer ring free of overlap/clutter without hiding data
  - Percentage annotations on the inner ring add real data-storytelling value beyond
    raw wedge geometry
  - Realistic, neutral company-budget dataset (department -> team, $M) with plausible
    proportions
  - Clean, reproducible, KISS-structured code with no fake interactivity
  weaknesses:
  - 'DE-01: Aesthetic sophistication is solid but stops at ''strong design'' rather
    than ''publication-ready'' — the ring styling (uniform stroke widths, flat alpha
    blend for the outer ring) is competent but not yet distinctive enough to stand
    out as a signature look'
  - 'DE-03: Visual hierarchy relies mainly on wedge size + percentage labels; consider
    a stronger focal-point technique (e.g. subtly emphasizing the largest segment,
    or varying label weight/size by magnitude) to make the ''story'' even more immediate'
  - 'DQ-01: Only 2 hierarchy levels are used (level_1 department, level_2 team); the
    spec explicitly frames sunbursts as showing ''part-to-whole relationships across
    multiple levels simultaneously'' and allows 2-4 levels — adding an optional level_3
    (grandchild) ring would more fully demonstrate the plot type''s core strength'
  - 'LM-02: The geom_polygon + geom_text construction is a generic radial-geometry
    workaround necessitated by plotnine''s lack of a polar coordinate system, not
    something that leverages a plotnine/ggplot2-specific capability — it could be
    replicated in any library with polygon-drawing support'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "sunburst-basic · plotnine · anyplot.ai" centered at top in dark ink text, clearly legible. Department names ("Engineering", "Marketing", "Operations", "R&D") appear bold and dark on the inner ring; percentages ("40%", "25%", "20%", "15%") appear in a softer dark-gray directly beneath each department name. Outer-ring team labels ("Backend", "Frontend", "DevOps", "Digital", "Brand", "HR", "Product") are dark text on the lighter/alpha-blended wedge colors — all clearly readable. No axis, no grid, no spines — appropriate for a radial chart.
      Data: Two concentric rings around a hollow donut center. Inner ring: 4 department wedges in Imprint order — Engineering (#009E73 brand green, 40%), Marketing (#C475FD lavender, 25%), Operations (#4467A3 blue, 20%), R&D (#BD8233 ochre, 15%). Outer ring: same hues at reduced alpha, split into team sub-wedges (Backend/Frontend/DevOps under Engineering; Digital/Brand/unlabeled Events under Marketing; HR/unlabeled Finance/unlabeled Legal under Operations; Product/unlabeled Data Science under R&D). Only wedges >=8% of the total get a label, which avoids clutter on the smaller slices.
      Legibility verdict: PASS — all title, department, percentage, and team labels are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title renders in light cream text, clearly legible against the dark background. Department names and team labels render in light cream/white text on their respective wedge colors; percentage labels render in a lighter muted gray. Ring-boundary strokes use a slightly lighter near-black (#2E2D2B) so segment edges remain visible against the near-black canvas background.
      Data: Colors are identical to the light render — Engineering green, Marketing lavender, Operations blue, R&D ochre — confirming the Imprint data-color contract holds across themes (only chrome flipped).
      Legibility verdict: PASS — all text is light-on-dark and clearly readable; no dark-on-dark failures observed anywhere on either ring.
