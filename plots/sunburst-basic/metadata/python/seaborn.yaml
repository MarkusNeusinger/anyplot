review:
  strengths:
  - 'Correct Imprint palette with branch-coherent tinting: each top-level directory
    (src/, assets/, tests/, docs/) gets its own hue from the canonical order (green/purple/blue/ochre),
    and inner-to-outer rings within a branch use consistent tints of that same hue,
    making the hierarchy easy to trace visually.'
  - Per-wedge label color is computed from the wedge fill's own luminance (with an
    opposite-tone halo stroke), so text stays legible across the full range from pale
    tints to fully-saturated colors, in both light and dark themes.
  - Companion 'Directory Totals' bar chart uses the identical color mapping as the
    sunburst rings and is sorted by size, giving a clear, redundant-encoding summary
    of the same data alongside the radial view.
  - 'Density-aware label suppression: level-2 labels are skipped below a 15° span
    and level-3 labels below 10°, plus explicit collision avoidance between level-2
    and level-3 labels, preventing label soup in the smallest wedges.'
  - Canvas is exactly on-target (3200x1800, figsize=(8, 4.5) @ dpi=400) with generous,
    balanced margins and no clipping at any canvas edge in either render.
  - 'Theme-adaptive chrome is correctly threaded through sns.set_theme rc params,
    the bar-chart panel, and the center total label; both plot-light.png and plot-dark.png
    use the correct #FAF8F1/#1A1A17 backgrounds with fully readable text.'
  weaknesses:
  - The level-1 'docs/' label (bold, 14pt, labeldistance=0.6) sits mostly on top of
    the neighboring tests/ (blue) wedge instead of its own ochre docs/ wedge, in both
    renders — the docs/ wedge is narrow (~30 deg arc, 29 of 351 MB) and matplotlib's
    default pie-label alignment (ha='right' when the anchor x is negative) pushes
    the whole label further left, off the wedge it names. Consider a smaller labeldistance/fontsize
    for narrow level-1 wedges, or clamp label x-offset to stay within the wedge's
    angular half-width.
  - The level-3 'validators' leaf label (src/utils/validators, ~10 MB, ~10.3 deg arc)
    overflows well past its own narrow outer-ring wedge into the neighboring 'utils'
    (level-2) wedge above and the adjacent level-3 wedge to the right, with wedge
    divider lines visibly cutting through the letters, in both renders. The current
    span>10 deg threshold lets this borderline-width wedge through; switch to an estimated-text-width-vs-chord-length
    check (or raise the level-3 threshold slightly) so labels are skipped when they
    can't fit inside their own wedge.
  - Tint assignment for level-2 vs level-3 rings uses sns.light_palette(base_color,
    n_colors=6) indices 3-4 for level-2 and 4-5 for level-3, so the outer (level-3)
    ring ends up similarly saturated to the innermost level-1 ring while the middle
    (level-2) ring reads noticeably lighter — the opposite of the more common expectation
    that rings lighten (or darken) monotonically moving outward. Not incorrect, but
    a bit visually inconsistent; consider a monotonic tint ramp across the three rings.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "sunburst-basic · python · seaborn · anyplot.ai" in bold dark ink at top, fully visible. Right panel title "Directory Totals" in bold dark ink. Bar-chart x-axis "Size (MB)" label and tick labels (0/50/100/150) in dark/soft-dark ink, all clearly legible. Center sunburst total "351 MB" in bold dark ink on the off-white hole. All ring/leaf text labels use a black-or-white color chosen per-wedge luminance with an opposite-tone halo, so every label reads clearly against its wedge fill.
      Data: Three concentric rings plus a center hole. First (innermost) ring uses the Imprint order starting with #009E73 (src/, largest share), then #C475FD (assets/), #4467A3 (tests/), #BD8233 (docs/) — matches canonical Imprint order with green first. Middle and outer rings use lighter/darker tints of each branch's hue, keeping parent-child relationships visually traceable. The companion bar chart on the right uses the identical four colors, sorted ascending by size (docs 29 MB, assets 84 MB, tests 90 MB, src 148 MB), with value labels to the right of each bar.
      Legibility verdict: PASS overall, with two localized proportion issues (not legibility failures) — the "docs/" ring label sits mostly over the neighboring tests/ wedge rather than its own ochre wedge, and the "validators" leaf label overflows its own narrow outer-ring wedge into the "utils" wedge above it. Both texts remain individually readable; the issue is placement/proportion, not contrast or size.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and panel title now in light/off-white ink, fully legible against the dark background. Bar-chart axis and tick labels use the lighter soft-ink tone, also legible. Center "351 MB" text is dark ink on the dark hole background at first glance but is set explicitly from the INK token (light in dark theme) — confirmed light-colored and readable, no dark-on-dark failure. No tick or label text was found rendered in a color that disappears into the dark surface.
      Data: Ring colors are pixel-identical to the light render (#009E73 green first, then #C475FD, #4467A3, #BD8233, plus the same branch tints) — confirms the categorical/tint colors are theme-independent as required; only the chrome (background, text, edge strokes between wedges) flipped to the dark tokens.
      Legibility verdict: PASS overall, same two localized proportion issues as the light render (docs/ label over tests/ wedge; validators label overflowing into utils/ wedge) — cosmetic placement problems, not a light/dark-specific defect since both renders show it identically.
