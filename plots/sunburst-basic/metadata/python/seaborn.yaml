review:
  strengths:
  - Branch-consistent color tinting via sns.light_palette ties each hierarchy level
    visually to its parent branch, matching the spec's 'consistent colors within each
    branch' requirement.
  - Companion directory-totals bar panel (built with seaborn's Objects API, so.Plot/so.Bar/so.Nominal)
    reinforces the sunburst's magnitude story with matching branch colors, acting
    as a de facto legend.
  - Center total label ('351 MB') and per-bar value labels add useful context without
    extra chrome or a traditional legend.
  - 'Correct Imprint palette (first series #009E73), correct theme-adaptive PAGE_BG/INK
    tokens, correct 3200x1800 canvas via figsize/dpi, and no bbox_inches=''tight''
    clipping risk.'
  - Small-wedge labels are suppressed below angular-span thresholds, keeping the narrow
    leaf segments uncluttered while still labeling all major segments per the spec's
    guidance.
  weaknesses:
  - The level-2 label 'components' and the level-3 label 'forms' visually collide
    near the top of the sunburst in both light and dark renders, reading as 'componentsforms'
    with no gap between them — the label placement logic doesn't check proximity to
    labels on the adjacent ring.
  - The level-3 label 'validators' (INK_SOFT on the saturated outer green tint) has
    noticeably lower contrast than sibling labels like 'helpers' in both themes, especially
    in the dark render where it nearly blends into the wedge color.
  - Level-1 ring labels use a hardcoded color='white' (line ~124) instead of a theme
    token — it happens to work visually since those wedges are always fully-saturated
    Imprint colors, but it bypasses the INK/theme system every other text element
    in the file uses.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, correct.
      Chrome: Title "sunburst-basic · python · seaborn · anyplot.ai" in bold dark ink at top, spans ~55% of canvas width. Left panel is a 3-ring sunburst (src/, assets/, tests/, docs/ innermost; subdirectories middle; leaf folders outer) with a "351 MB" center total. Right panel is a horizontal bar chart "Directory Totals" with axis label "Size (MB)", tick labels, and per-bar MB value labels, spines removed, y-axis-free light grid.
      Data: First branch (src/) uses Imprint green #009E73 with light tints for its children; other branches use purple/blue/orange from the Imprint palette in canonical order; wedges separated by thin off-white edge lines.
      Legibility verdict: Mostly PASS, with two exceptions: (1) the level-2 label "components" and level-3 label "forms" run together with no visible gap ("componentsforms") near the top of the sunburst; (2) the level-3 label "validators" has weaker contrast than its sibling "helpers" against the saturated green wedge. All other text (title, level-1 branch labels, bar-chart axis/tick/value labels) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, correct.
      Chrome: Same layout as the light render — title, sunburst, center total, and bar panel — with all chrome (title, tick labels, axis label, grid) correctly flipped to light ink on the dark surface. No dark-on-dark failures observed for chrome text.
      Data: Colors are identical to the light render (green/purple/blue/orange branches with matching tints) — only the chrome and page background changed, as required.
      Legibility verdict: Mostly PASS, with the same two exceptions as light: the "componentsforms" label collision persists, and "validators" is noticeably harder to read here than in the light render — the light-gray INK_SOFT text sits closer in lightness to the saturated green wedge under dark-theme conditions, reducing contrast more than in light mode. All other text remains legible.
