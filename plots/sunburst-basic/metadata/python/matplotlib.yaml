review:
  strengths:
  - Correct 3-level hierarchy (department → team → project) built from three concentric
    ax.pie() rings whose angles are exactly proportional to the aggregated child values,
    so inner segments visually encompass their children as the spec requires
  - Consistent, theme-independent tint family per department branch (green/lavender/blue,
    each lightening outward) makes parent-child relationships immediately readable
    without a legend
  - 'Genuine data storytelling: bold ink outline emphasizes the largest department''s
    wedges across all 3 rings, paired with a center ''$1,530k'' total and a plain-language
    caption calling out the 46% share'
  - 'Theme-adaptive chrome verified correct in both renders — #FAF8F1/#1A1A17 backgrounds,
    ink tokens for title/caption/center text, and halo-stroke ring labels all stayed
    legible with no dark-on-dark or light-on-light failures'
  - 'First 3 categorical colors follow the canonical Imprint order (#009E73 green,
    #C475FD lavender, #4467A3 blue) and are identical across both themes'
  - 'Clean KISS script: deterministic dict-based data (no seed needed), only used
    imports, correct plot-{theme}.png output with default bbox_inches'
  weaknesses:
  - Path-effect halo stroke around the level-2/level-3 ring labels is fairly heavy
    (linewidth 2-2.5), giving the text a slightly outlined look rather than blending
    seamlessly into the ring color — a thinner stroke (~1.5) would read a bit more
    refined
  - The nested concentric ax.pie() construction is the standard matplotlib recipe
    for sunburst-style charts; well executed, but not a technique unique to this library
    — LM-02 kept at a moderate score for that reason
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Company Budget · sunburst-basic · python · matplotlib · anyplot.ai" in bold dark ink at top (~78% of canvas width, no clipping); center donut hole shows "$1,530k" in bold dark ink; bottom callout box (cream fill, dark border) reads "Engineering is the largest department at 46% of the $1,530k budget" in bold dark ink. All chrome text clearly readable against the light background.
      Data: Three concentric rings form a sunburst/nested-donut. Innermost ring = 3 departments (Engineering #009E73 green, Sales #C475FD lavender, Marketing #4467A3 blue) with bold white labels. Middle ring = teams, colored as lighter tints of their parent department's hue. Outer ring = projects, tinted lighter still. Ring/segment labels use a soft ink color with a light halo stroke for legibility against the tinted fills. The Engineering department's wedges across all 3 rings carry a bold dark outline, visually marking it as the focal point. Wedge boundaries are separated by thin light-colored strokes matching the page background.
      Legibility verdict: PASS — no overlapping or clipped text found; smallest ring labels (8pt) remain legible even in the 400px mobile thumbnail check.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, center total, and callout box now render in light ink (#F0EFE8) against the dark background and dark-tinted callout box; fully readable, no dark-on-dark failures observed.
      Data: Identical wedge colors and layout to the light render — the three department base hues (#009E73, #C475FD, #4467A3) and every tinted child color are pixel-identical between themes, confirming only chrome (background, text, wedge-separator strokes) flipped. Ring/segment labels keep their soft-ink fill but the halo stroke switches to match the dark page background, so the label text (still visible against the light-tinted, theme-constant ring fills) never disappears into the dark surface. The Engineering focal-point outline again uses the theme's ink color.
      Legibility verdict: PASS — verified via pixel crops that ring labels (e.g. "Web App") render with a clear light-gray fill and matching dark halo in both themes, remaining legible against the light pastel ring backgrounds; no text collides with the dark page background.
