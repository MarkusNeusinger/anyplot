review:
  strengths:
  - 'Every branch keeps its Imprint hue from center to rim (Eng #009E73, Sales #C475FD,
    Mktg #4467A3 with 40 % and 70 % white tints), so the hierarchy reads at a glance'
  - Separators and ring gaps are drawn in the page color, giving clean ring separation
    in both themes
  - Label ink switches by fill luminance, keeping every label readable on its wedge
    in both renders
  - One loop over ring levels with a groupby per level builds all wedges, and parents
    are made contiguous so their arcs cover their children
  - gggrid wrapper paints the full square canvas in the page color, and layer_tooltips
    gives segment, budget and share in the HTML export
  weaknesses:
  - 'CQ-01 (code): three helper functions (mix_with_white lines 70-73, luminance 76-79,
    wedge 82-87) where the criterion asks for Imports → Data → Plot → Save without
    functions → inline the tint and luminance arithmetic in the ring loop (or matplotlib.colors
    for the blend) and build the arc vertices there. Likely cause: geometry and color
    math factored into def blocks.'
  - 'Suggestion: a slightly heavier separator width would make the leaf boundaries
    in the pale outer ring crisper on the light background.'
  image_description: |-
