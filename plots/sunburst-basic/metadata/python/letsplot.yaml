review:
  strengths:
  - 'Custom multi-level hierarchical palette: branch colors (green/purple/blue matching
    Imprint canonical positions 1-3) with graduated pastel tints for child rings creates
    clean visual grouping across all 3 levels'
  - Precise angular math correctly aggregates values so inner segments visually encompass
    their children's angular span (Eng/Sales/Mktg boundaries align exactly with Backend+Frontend,
    North+South, Digital+Brand)
  - Deliberate radial gaps between ring 1/2 (28-31) and ring 2/3 (52-55) create clear
    visual separation between hierarchy levels using page-background color, working
    correctly in both themes
  - Text remains legible even at the 400px mobile thumbnail size, including the smallest
    outer-ring labels
  - Both PNG and HTML exported correctly with theme-adaptive background/title colors;
    data colors are identical between light and dark renders, only chrome flips
  weaknesses:
  - 'LM-02: No distinctive letsplot features are demonstrated beyond generic polygon
    plotting - built-in interactivity/tooltips aren''t customized to surface meaningful
    hierarchical info (value, percentage) on hover'
  - Only 10 leaf nodes are used (spec allows 10-50) - at the minimum end; a richer
    hierarchy (more branches or a populated 4th level) would better showcase feature
    coverage
  - The 'value' field lacks explicit units/context (dollars? headcount? % of budget?)
    - a subtitle or label clarifying the metric would strengthen data realism
  - Title occupies only ~35% of the frame width - could be sized slightly larger for
    more visual presence without risking overflow
  - The create_wedge() helper, while a reasonable way to avoid duplicating the polygon-point
    math across 3 loop blocks, is the one place the KISS 'no functions' guideline
    is relaxed
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "sunburst-basic · letsplot · anyplot.ai" centered at top in dark ink, clearly legible. No axes, no legend (by design - labels are inline on each wedge). Thin cream-colored borders separate wedges and create ring gaps between the 3 hierarchy levels.
      Data: Three concentric rings. Ring 1 (innermost): Eng (#009E73 green), Sales (#C475FD purple), Mktg (#4467A3 navy), each with bold white text labels. Ring 2: Backend/Frontend (teal tints), North/South (orange tints), Digital/Brand (blue tints), all with dark-ink labels. Ring 3 (outermost): lightest pastel tints for each of the 10 leaf categories (API, Database, Mobile, Web App, Enterprise, SMB, Retail, SEO, Ads, Events), also with dark-ink labels. First categorical series is confirmed #009E73.
      Legibility verdict: PASS - all title and segment-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title rendered in light ink, clearly legible against the dark background. Same ring-gap structure as the light render; wedge border/gap color now reads as near-black against the dark background, which is expected since it tracks the PAGE_BG token.
      Data: Colors are pixel-identical to the light render (Eng green, Sales purple, Mktg navy, and all tinted level-2/level-3 pastels) - only the chrome (background, title, border/gap color) flips as intended. Level-1 labels remain bold white; level-2/3 labels remain fixed dark ink (LABEL_ON_PASTEL), which stays readable in the dark theme because those wedges are pastel regardless of theme.
      Legibility verdict: PASS - no dark-on-dark failures; all labels are readable against both the dark canvas background and their own pastel/saturated wedge backgrounds.
