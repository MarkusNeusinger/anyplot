review:
  strengths:
  - Title format is exactly correct (`sunburst-basic · python · pygal · anyplot.ai`)
    and theme-adaptive chrome (background, ink, muted ink) is correctly derived from
    ANYPLOT_THEME in both renders.
  - 'First categorical series is the mandated #009E73 brand green, and the Imprint
    palette is used with a thoughtful consistent-shade-per-branch technique (each
    team is a lighter tint of its parent department''s Imprint hue) matching the spec''s
    ''consistent colors within each branch'' requirement.'
  - Deterministic, clean, KISS-structured code with correct outputs (plot-{theme}.png
    via render_to_png + plot-{theme}.html via render()), and realistic, internally-consistent
    budget data (team values sum exactly to their department totals).
  - Thoughtful use of pygal's per-datapoint dict API to switch between `label` (printed)
    and `tooltip` (hover-only) per data point, deliberately avoiding a cluttered ring
    of ten overlapping team labels, with an explicit code comment reasoning about
    a label collision at the Technology/Marketing ring seam.
  weaknesses:
  - 'CRITICAL structural failure: the large inner disk (~85-90% of the canvas) does
    NOT encode department (level_1) proportions at all. pygal''s multi-series Pie
    in ''dual'' mode fills the coarse/inner region as ONE solid wedge PER SERIES,
    sized by that series'' total value sum -- not per data point within the series.
    Because the ''Departments'' series sum (1000) always equals the ''Teams'' series
    sum (1000) for any valid parent/child hierarchy, the inner disk is mathematically
    forced into a meaningless 50/50 green/purple split (green = the entire ''Departments''
    series, purple = the entire ''Teams'' series) regardless of the true department
    shares (Technology 42%, Business 31%, Operations 17%, Marketing 10%). The ''Technology'',
    ''Business'', ''Operations'', ''Marketing'' text labels are overlaid at illustrative
    angles but correspond to no real wedge boundary in the fill -- a reader cannot
    see where Technology ends and Business begins, and would wrongly read the chart
    as ''Technology and Business are each ~50% of the budget''. This directly violates
    the spec''s ''segment angles proportional to values'' and ''inner segments should
    visually encompass their children''s angular span'' requirements (SC-01, SC-02,
    SC-03).'
  - Only the thin outer ring (roughly the outer 5-10% of the radius) actually encodes
    correct, proportional per-datum information (departments AND teams by width/angle).
    The one genuinely informative element of the chart is squeezed into a sliver while
    ~90% of the 2400x2400 canvas is spent on a non-representational two-color disk
    -- a severe canvas-utilization/data-ink problem, not just an aesthetic one.
  - '`margin_right=320` is dead space now that `show_legend=False` -- it visibly pushes
    the circle left-of-center, producing unbalanced whitespace (large empty band on
    the right) with nothing to justify it.'
  - The label-vs-tooltip conditional (`rank == (1 if dept_index == 0 else 0)`) is
    functionally clever but hard to read at a glance -- could be expressed more directly,
    e.g. by picking the printed rank explicitly per department rather than via a nested
    ternary embedded in a dict comprehension.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- correct, not pure white.
      Chrome: Title "sunburst-basic · python · pygal · anyplot.ai" in dark ink, large and centered at top, fully legible. Department labels (Technology, Business, Operations, Marketing) and two team labels (Sales, Frontend Engineering) in dark ink, all clearly readable against the light background.
      Data: A huge circular disk fills almost the entire canvas, split into an exact vertical 50/50 halves -- right half solid #009E73 green, left half solid lavender/purple (#C475FD family). A thin ring near the outer edge shows finer proportional segments in green, purple, blue, and ochre shades corresponding to the 4 departments and their teams. The 50/50 disk split does NOT match the true department proportions (Technology 42%, Business 31%, Operations 17%, Marketing 10%) -- see Weaknesses for why (pygal's dual-series Pie mode colors the coarse ring per-series-sum, not per-department-share, and the two series sums are mathematically equal).
      Legibility verdict: PASS (all text is readable), but the chart's primary visual (the big disk) misrepresents the underlying hierarchy.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- correct, not pure black.
      Chrome: Title and all labels rendered in light ink (#F0EFE8), clearly legible against the dark background -- no dark-on-dark failures observed. The same green/purple disk and thin proportional outer ring as the light render.
      Data: Identical data colors to the light render (#009E73 green half, lavender/purple half, and the same outer-ring shade families) -- confirms only chrome flipped between themes, not data colors, as required.
      Legibility verdict: PASS (all text readable, brand green clearly visible against the dark surface), same structural hierarchy misrepresentation as the light render.
