review:
  strengths:
  - 'Critical structural fix from attempt 1: switching to one pygal series per department
    makes the coarse inner ring genuinely value-proportional (Technology ~42%, Business
    ~31%, Operations ~17%, Marketing ~10% all match the underlying data), and the
    thin outer ring correctly subdivides each department''s own arc by its teams —
    the sunburst hierarchy now actually encodes what the spec requires'
  - margin=380 (uniform) replaces the old margin_right=320 dead space, producing balanced
    whitespace and a well-utilized ~68%-diameter disk on the 2400x2400 canvas
  - Consistent branch-level color tinting (each team is a lighter tint of its parent
    department's Imprint hue) is a thoughtful, non-default touch that reinforces the
    hierarchy visually
  - Deterministic, clean, KISS-structured code with correct dual outputs (plot-{theme}.png
    + plot-{theme}.html), realistic budget data that sums exactly to department totals,
    and clever (well-commented) use of pygal's per-datapoint label/tooltip dict switching
  - 'First categorical series is #009E73, Imprint palette used correctly, and title
    format is exact'
  weaknesses:
  - 'CRITICAL dark-on-dark failure (VQ-01/VQ-07): in plot-dark.png, the ''Backend
    Engineering'' and ''Frontend Engineering'' team labels (Technology department,
    top-right of the disk) are placed outside the pie ring directly on the plain #1A1A17
    canvas background, but render in fixed black/near-black text -- nearly invisible.
    The same labels work fine in plot-light.png only because dark text happens to
    sit on the light #FAF8F1 background there; the underlying label color is not theme-adaptive
    the way the title color (foreground_strong=INK) correctly is. Repair should make
    sure these externally-placed print_labels pick up the theme-adaptive INK/foreground_strong
    token (or a dedicated pygal label-fill override) instead of defaulting to a fixed
    dark fill.'
  - The thin outer (team-level) ring still gets a much smaller radial share of the
    disk than the coarse (department-level) ring -- correct proportionally, but visually
    underweights the second hierarchy level; consider whether pygal's dual-mode ring-width
    ratio can be tuned further, or accept as an inherent library limitation.
  - The dual multi-series Pie hack is a clever workaround but not native/idiomatic
    pygal API (pygal has no first-class Sunburst type), so Library Mastery is capped
    by that constraint rather than free choice of a purpose-built idiom.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "sunburst-basic · python · pygal · anyplot.ai" in dark ink, ~70% canvas width, fully legible near the top with comfortable margin from the top edge. Department labels (Technology, Business, Operations, Marketing) sit inside their large coarse wedges in dark text; team labels (Backend Engineering, Frontend Engineering, Sales, IT Support) sit near/just outside the thin outer ring, also in dark text -- all fully readable against the light background, including the two labels ("Backend Engineering", "Frontend Engineering") that fall on the plain background outside the disk.
      Data: A large disk fills ~68% of canvas diameter, split into 4 correctly-proportional coarse wedges (green #009E73 = Technology ~42%, purple = Business ~31%, blue = Operations ~17%, ochre = Marketing ~10%), each with a thin outer ring subdividing that department's own teams proportionally, using a lighter tint of the parent's hue. First series is #009E73 as required.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title renders correctly in light ink, fully legible against the dark background (theme token correctly threaded). Department labels sitting on colored wedges (dark text on green/purple/blue/ochre) remain legible since wedge colors are unchanged from light render. However, the "Backend Engineering" and "Frontend Engineering" team labels are placed outside the disk directly on the plain dark background, and render in the SAME fixed black/near-black text as in the light render -- this is a dark-on-dark failure: the text is nearly invisible against the #1A1A17 canvas. "IT Support" and "Sales" avoid this because their label placement happens to land on a colored wedge rather than the plain background.
      Data: Confirmed identical to light render -- same 4 department hues and team tints, only chrome (background, title) flips as expected.
      Legibility verdict: FAIL -- "Backend Engineering" and "Frontend Engineering" labels are dark-on-dark and effectively unreadable in the dark render.
