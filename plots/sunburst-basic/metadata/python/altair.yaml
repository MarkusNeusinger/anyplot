review:
  strengths:
  - 'Fixes both weaknesses flagged in the prior 87/100 review: level_2 (Team) segments
    now carry direct in-arc labels (Backend, Frontend, DevOps, Digital, Content, Support,
    HR, SMB, Enterprise), and a focal-point callout now highlights the single largest
    leaf segment (Engineering · API, $180K) with an outlined arc + connector label.'
  - 'Creative technique: builds a true sunburst via 3 layered mark_arc rings with
    manually computed cumulative theta/theta2 angles proportional to value, working
    around Altair''s lack of a native sunburst mark.'
  - 'Consistent branch-based color scheme: each department''s level_2/level_3 segments
    use progressively lighter tints (25%/50%) of that department''s own brand color,
    directly satisfying the spec''s ''consistent colors within each branch'' requirement.'
  - 'Imprint palette correctly applied — Engineering uses brand green #009E73 as the
    first series, held pixel-identical across light and dark renders.'
  - New text_color_for_bg() luminance helper picks black vs. white ink per level_2
    wedge so labels stay readable against both the light-tint and the theme-adaptive
    background.
  - Custom legend row is built left/right-balanced around x=0 so the donut itself
    stays centered on the padded square canvas; canvas correctly padded to 2400x2400
    with no clipping.
  weaknesses:
  - Level_1 (Department) in-arc labels use a hardcoded color='#ffffff' (mark_text
    on chart_l1) instead of the new text_color_for_bg() contrast helper. On the Marketing
    wedge (#C475FD, a light lavender) this yields an estimated WCAG contrast ratio
    of ~2.9:1 for 12px bold white text — noticeably weaker than the other three department
    wedges (blue ~5.7:1, green/ochre ~3.2:1) and below the 3:1 minimum for this text
    size. Route level1_df through text_color_for_bg(hex_color) the same way level2_df['label_color']
    already is.
  - Level_3 (outermost ring) tints remain uniformly 50% lighter across all four branches,
    which still slightly reduces at-a-glance separation between adjacent thin leaf
    segments within the same department (most visible in dark mode) — minor, unchanged
    from the prior review.
  - The new text_color_for_bg() helper is a small function in an otherwise functions-free
    procedural script (CQ-01 favors no functions/classes); acceptable given it is
    reused for level_2 contrast, but worth inlining or noting as a deliberate KISS
    exception if a future pass touches this file.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white, not dark.
      Chrome: Title "sunburst-basic · python · altair · anyplot.ai" in bold dark ink, centered at top, clearly readable. A new callout in the upper-right reads "Engineering · API ($180K)" in dark ink, connected by a leader line to an outlined wedge in the outer ring — the new focal-point emphasis. Legend row below the sunburst shows 4 color swatches (Engineering/Sales/Marketing/Operations) with dark-gray labels, all legible.
      Data: Three concentric rings (Department → Team → Project). Innermost ring uses the four Imprint hues (Engineering=brand green #009E73, Sales=ochre, Marketing=lavender, Operations=blue) with bold white department-name labels overlaid. The Marketing (lavender) label reads noticeably lower-contrast than the other three — estimated ~2.9:1 vs. ~3.2–5.7:1 elsewhere — a legibility weak point, though the bold weight keeps it just barely readable. Middle ring now carries its own labels (Backend, Frontend, DevOps, Digital, Content, Support, HR, SMB, Enterprise) in black or white text chosen per-wedge for contrast — all clearly legible. Outer ring is unlabeled (expected per spec for minor segments) except for the black-outlined focal wedge (Engineering·Backend·API). Thin cream-colored strokes separate all wedges.
      Legibility verdict: PASS overall — only the Marketing level_1 label is a soft/marginal-contrast outlier; everything else is clearly readable against the light background with no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black, not light.
      Chrome: Title and legend text render in light ink/gray tones, clearly visible against the dark background. The focal callout text and its outline switch to light ink/white stroke, still legible. Wedge separator strokes are now dark (matching PAGE_BG) instead of cream — correct theme-adaptive behavior.
      Data: Data colors are identical to the light render — same brand green, ochre, lavender, blue for level_1, same lighter-tint progression for level_2/level_3. The same Marketing lavender/white-text contrast weakness is present here too (contrast ratio is independent of theme since it's white text on a fixed lavender fill). Level_2 labels remain readable via the per-wedge luminance-based text color. No dark-on-dark failures observed elsewhere — title, legend, and in-arc labels on the other three branches all read clearly against the near-black surface.
      Legibility verdict: PASS overall — same isolated Marketing-label contrast caveat as the light render; no theme-adaptation (dark-on-dark) failures.
