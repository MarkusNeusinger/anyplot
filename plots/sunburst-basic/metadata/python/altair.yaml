review:
  strengths:
  - 'Creative technique: builds a true sunburst via 3 layered mark_arc rings with
    manually computed cumulative theta/theta2 angles proportional to values, working
    around Altair''s lack of a native sunburst mark.'
  - 'Consistent branch-based color scheme: each department''s level_2/level_3 segments
    use progressively lighter tints (25%/50%) of that department''s own brand color,
    directly satisfying the spec''s ''consistent colors within each branch'' requirement.'
  - 'Imprint palette correctly applied — Engineering (brand green #009E73) plus lavender/blue/ochre
    for the other three departments, held identical across light and dark renders.'
  - Segment strokes use the theme's PAGE_BG color so gaps between arcs read correctly
    as background in both themes, keeping the rings crisp without a hard-coded stroke
    color.
  - Theme-adaptive chrome (title in INK, legend text in INK_SOFT) correctly threaded
    through; both renders are legible.
  - Custom legend row is built left/right-balanced around x=0 so the donut itself
    stays centered on the padded square canvas.
  - Per-ring tooltips (Department / Team / Project + Budget $K) give full hierarchy
    detail on hover in the interactive HTML output.
  - Canvas correctly padded to the 2400x2400 square target with no clipping of title,
    labels, or legend.
  weaknesses:
  - Only the innermost (level_1/Department) ring carries text labels — level_2 (Team)
    and level_3 (Project) segments have no direct labels even for large segments like
    Backend or Frontend, so the static PNG relies entirely on color-shade + legend
    to convey substructure; consider adding labels to the largest level_2 wedges.
  - The design is competent but fairly standard 'layered donut' styling — nothing
    pushes it into distinctive territory (e.g. no emphasis/callout on the single largest
    leaf segment, no radial value reference).
  - Level_3 (outermost ring) tints are uniformly very light (50% lighter) across all
    four branches, which slightly reduces at-a-glance distinguishability between adjacent
    thin segments in that ring, especially in dark mode.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Title "sunburst-basic · python · altair · anyplot.ai" in bold dark ink, centered at top, clearly readable. Legend row below the sunburst shows 4 color swatches (Engineering/Sales/Marketing/Operations) with dark-gray labels, all legible.
      Data: Three concentric rings (Department → Team → Project). Innermost ring uses the four Imprint hues (Engineering=brand green #009E73, Sales=ochre, Marketing=lavender, Operations=blue), with white bold department-name labels overlaid on each innermost wedge. Middle and outer rings use progressively lighter tints of the same parent hue, correctly showing branch-consistent coloring. Thin cream-colored strokes separate all wedges.
      Legibility verdict: PASS — all title, legend, and department-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black.
      Chrome: Title and legend text render in light ink/gray tones, clearly visible against the dark background. Wedge separator strokes are now dark (matching PAGE_BG) instead of cream, which is the correct theme-adaptive behavior.
      Data: Data colors are identical to the light render — same brand green, ochre, lavender, blue for level_1, with the same lighter-tint progression for level_2/level_3. White bold department labels remain legible on all four colored innermost wedges.
      Legibility verdict: PASS — no dark-on-dark failures; title, legend, and in-arc labels all read clearly against the near-black surface.
