review:
  strengths:
  - 'Correct hierarchical construction: angular spans are computed proportionally
    at every ring (level_1 -> level_2 -> level_3) so inner segments visually encompass
    their children''s angular span exactly, matching the spec''s core requirement'
  - Department color families (base/mid/light, generated via _lerp_hex toward white)
    keep each branch's hue consistent across all three rings while giving Team/Project
    rings a lighter tint of their parent's Imprint hue -- a clean, purposeful use
    of the palette rather than 8 unrelated flat hues
  - Per-ring HoverTool via ColumnDataSource (department/team/project name + budget)
    gives real interactive depth in the HTML output without faking anything in the
    static PNG
  - Threshold-based labeling (level_2 shown above 6% of total, level_3 above 4%) avoids
    clutter on small segments while a legend with department totals ($410K/$150K/$170K/$95K)
    supplies the missing context for the omitted small-segment labels
  - 'First categorical series is #009E73 and the remaining 3 departments follow the
    canonical Imprint order (#C475FD, #4467A3, #BD8233); data colors are verified
    identical between plot-light.png and plot-dark.png -- only chrome (background,
    ring-level labels, legend text) flips theme'
  - Text color per segment is computed via YIQ luminance (_text_on) rather than hardcoded,
    so every ring/legend label stays readable against its own fill color regardless
    of theme
  - Realistic, neutral org-budget scenario (Engineering/Marketing/Sales/Operations
    -> teams -> projects) with plausible relative magnitudes (Engineering $410K >
    Sales $170K > Marketing $150K > Operations $95K)
  weaknesses:
  - 'Title is ''sunburst-basic · bokeh · anyplot.ai'' but the mandated format is ''{spec-id}
    · {language} · {library} · anyplot.ai'' -- the ''python'' language segment is
    missing. Fix: title="sunburst-basic · python · bokeh · anyplot.ai" (still short
    enough at ~45 chars to need no fontsize adjustment).'
  - The bare annular-wedge circle occupies only ~32% of the square canvas area (radius
    0.92 within a 2.9-unit x/y range) -- comfortably above the 'severe' floor but
    short of the 50-80% target; growing the outer radius slightly (or tightening x_range/y_range
    margins) would use the 2400x2400 canvas more fully.
  - 'DE-03 (data storytelling) is good but not exceptional: the chart shows the hierarchy
    and totals clearly but has no explicit callout/emphasis pointing at the single
    biggest insight (e.g. highlighting that Engineering''s Backend team alone is ~49%
    of the whole Engineering budget).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Bold dark title "sunburst-basic · bokeh · anyplot.ai" centered at top; three small gray ring-level
        labels ("Department", "Team", "Project") sit in the empty space below the circle; legend below shows
        4 department color-triplet swatches with bold dark department names and lighter gray dollar totals
        ($410K/$150K/$170K/$95K). All chrome text is dark-on-light and clearly readable.
      Data: Three concentric rings. Innermost ring: 4 department wedges (Engineering=brand green #009E73,
        Marketing=lavender #C475FD, Sales=blue #4467A3, Operations=ochre #BD8233) with bold abbreviated
        labels ("Eng.", "Mktg", "Sales", "Ops") in black or white text depending on the wedge's luminance.
        Middle ring: team wedges in a mid-tint of their parent department color, labeled with full team names
        ("Backend", "Frontend", "DevOps", "Digital", "Content", "Enterprise", "SMB", "Support", "HR") where the
        segment is large enough. Outer ring: project wedges in a light tint of the department color, labeled
        with project names ("API Platform", "Database", "Web App", "Mobile", "Infrastructure", "Social Media",
        "SEO", "Video", "EMEA", "APAC", "Direct Sales", "Tier 1") for segments above the 4% threshold; smaller
        segments ("Blog", "Tier 2", "Recruiting") are correctly left unlabeled to avoid clutter. Thin white
        strokes separate every wedge, giving crisp ring boundaries.
      Legibility verdict: PASS -- every visible label reads cleanly against its background at full resolution.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, ring-level labels, and legend department names/totals all flip to light text (near-white
        for primary text, light gray for secondary), fully readable against the dark background. No dark-on-dark
        failures observed anywhere.
      Data: All ring wedge fill colors are pixel-identical to the light render -- same brand green, lavender,
        blue, ochre bases and their mid/light tints. Only the chrome (background, title, ring labels, legend
        text) changed; the data layer itself did not shift, exactly as required. Per-segment label text color
        is also identical to the light render since it's computed from each wedge's own fill luminance (fixed,
        not theme-adaptive), which is correct because the data layer doesn't change between themes.
      Legibility verdict: PASS -- all chrome text is light-on-dark and legible; no dark-on-dark or light-on-light
        issues in either theme.
