review:
  strengths:
  - Per-segment on-label text color computed from WCAG relative luminance (_on_segment_text_color)
    guarantees legible labels on every wedge in both themes instead of relying on
    Plotly's implicit auto-contrast
  - 'Family-consistent hue palette: departments get canonical Imprint positions (#009E73,
    #C475FD, #4467A3, #BD8233) and their child teams use lighter/darker variants of
    the same hue, directly satisfying the spec''s ''consistent colors within each
    branch'' requirement'
  - branchvalues="total" with hand-verified value sums (e.g. Engineering 18 = Backend
    8 + Frontend 6 + DevOps 4) so inner segments correctly encompass their children's
    angular span
  - Insight annotation ('Engineering leads with 37.5%...') surfaces a concrete finding
    instead of leaving the viewer to find their own story
  - Fully deterministic hardcoded data, no randomness needed
  - Correct square 2400x2400 canvas choice (width=600, height=600, scale=4) for a
    symmetric radial chart, with pinned margins so the long mandated title and bottom
    annotation never clip
  weaknesses:
  - Only 9 leaf nodes (Backend, Frontend, DevOps, Enterprise, SMB, Digital, Brand,
    HR, Finance) — spec requires 10-50 leaf nodes; split one more branch (e.g. add
    a team under Marketing or Operations) to clear the stated minimum
  - _on_segment_text_color is a small standalone helper function, a minor deviation
    from the KISS 'no functions/classes' guidance — justified by its narrow, well-documented
    purpose, but could be inlined as a comprehension if strict linear KISS structure
    is desired
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "sunburst-basic · plotly · anyplot.ai" in dark ink, centered at top, fully visible and not clipped. Center "Company" root rendered on an elevated near-white circle with dark text, clearly legible. Muted gray annotation ("Engineering leads with 37.5%...") sits below the chart, fully within canvas bounds.
      Data: Three concentric rings — root (Company), 4 departments (Engineering #009E73 dominant green, Sales #C475FD purple, Marketing #4467A3 blue, Operations #BD8233 ochre), and 9 teams as lighter/darker shade variants of their parent hue. First categorical series (Engineering, the dominant branch) is #009E73 as required. On-segment radial text labels use explicitly computed dark or light ink per segment luminance and are all readable.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/cream ink, clearly visible against the dark background. Center "Company" root sits on a near-black elevated circle with light text — legible, no dark-on-dark. Annotation text is muted light gray, clearly readable against the dark background.
      Data: Identical department/team colors to the light render (same green/purple/blue/ochre family hues) — confirms only chrome flipped, not data colors. Per-segment text colors correctly re-flip per background luminance (e.g. dark ink stays on the light lavender segments, light ink stays on the saturated green segments) — no dark-on-dark or light-on-light failures observed anywhere in the wheel.
      Legibility verdict: PASS
