review:
  strengths:
  - First series correctly uses brand green t.palette[0] (#009E73)
  - Distinct line styles (solid vs. dashed) give redundant encoding beyond color for
    the two classifiers
  - AUC values embedded directly in the legend labels satisfy the 'display AUC in
    legend or annotation' requirement
  - Explicit font sizing throughout (title 26px, axis titles 18px, ticks 15px, legend
    18px) with balanced proportions and no overlap
  - 'Square 2400x2400 canvas is an apt choice for the spec''s ''equal aspect ratio
    preferred'' note, with aspectRatio: 1 enforced'
  - Deterministic seeded LCG + Box-Muller data generation gives a reproducible, plausible
    medical-screening scenario with realistic AUC separation (0.92 vs 0.79)
  - 'animation: false set correctly per the Chart.js mount-node contract'
  weaknesses:
  - 'The ''Random Classifier'' diagonal reference line and its legend swatch use borderColor/backgroundColor:
    t.muted, but window.ANYPLOT_TOKENS (per automation/js-render/render.mjs) never
    defines a ''muted'' property -- only pageBg, elevatedBg, ink, inkSoft, grid, palette[8],
    amber, seq, div exist (matches the documented token list in prompts/library/chartjs.md).
    t.muted is therefore undefined, so Chart.js falls back to its own default border
    color instead of a theme-adaptive gray. Pixel sampling confirms the failure: in
    plot-light.png the line renders at roughly (216,215,208) against a (250,248,241)
    background (barely perceptible), and in plot-dark.png it renders at roughly (58,58,54)
    against a (26,26,23) background -- effectively invisible, failing the mandatory
    dark-render ''data markers/lines are clearly distinguishable from the background''
    check. Fix: stop referencing t.muted; derive the reference-line color from a documented
    token instead (e.g. reuse t.inkSoft, or hard-code the style guide''s muted anchor
    ''#6B6A63'' light / ''#A8A79F'' dark keyed off window.ANYPLOT_THEME, since the
    harness does not expose ''muted'' as a token).'
  - Second series (Logistic Baseline) uses t.palette[2] (#4467A3, blue) instead of
    the canonical t.palette[1] (#C475FD, lavender) for the second categorical series,
    breaking Imprint canonical order with no semantic justification (a 'baseline'
    classifier has no inherent blue association). Use t.palette[1] for the second
    series.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: bold dark title "roc-curve · javascript · chartjs · anyplot.ai" at top, clearly readable; axis titles "False Positive Rate" / "True Positive Rate" in medium-dark ink; tick labels (0.0-1.0, step 0.2) in softer gray; subtle light gridlines at both axes; legend centered below the plot with three entries.
      Data: thick solid green curve (Deep Ensemble, AUC = 0.92, palette[0] #009E73) bowing sharply toward the top-left; dashed blue curve (Logistic Baseline, AUC = 0.79, palette[2] #4467A3) with a more gradual bow; both are clearly visible and distinguishable by color and linestyle. The diagonal "Random Classifier" reference line and its legend swatch are only faintly visible (near-background gray) due to a broken t.muted token (see weaknesses).
      Legibility verdict: PASS for all title/axis/tick/legend text; FAIL for the reference-line data element (very low contrast, though not fully invisible in this theme).

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black.
      Chrome: title, axis titles, tick labels, and legend text all correctly flip to light-colored ink -- no dark-on-dark failures observed for any text element.
      Data: the green and blue curves are pixel-identical in hue to the light render (confirming data-color consistency across themes) and remain clearly visible. However, the diagonal "Random Classifier" reference line and its legend swatch are effectively invisible -- pixel sampling shows the line differs from the background by only a few RGB units (~(58,58,54) vs background (26,26,23)), well below any readable threshold.
      Legibility verdict: PASS for all text; FAIL for the reference-line data element -- this is the one legibility failure in the dark render, and it fails the mandatory 5c "data markers/lines are clearly distinguishable from the background" check.
