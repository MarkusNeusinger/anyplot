review:
  strengths:
  - 'Correct ROC math: tpr = fpr^(1/power) integrates analytically to power/(power+1),
    so the AUC labels (0.90, 0.80) are exactly consistent with the plotted curve shapes
    rather than hard-coded numbers'
  - 'Diagonal random-classifier reference line is present, styled distinctly (dashed,
    muted ink color, enableMouseTracking: false so it doesn''t produce a misleading
    hover), and correctly spans (0,0) to (1,1)'
  - Two models compared with clearly distinct Imprint palette colors (green vs. purple)
    and each curve's AUC surfaced directly in the legend text, satisfying the spec's
    'display AUC score in legend or annotation' requirement without extra clutter
  - 'Square 2400x2400 canvas correctly honors the spec''s ''equal aspect ratio preferred''
    note via the //# anyplot-orientation: square directive'
  - Theme tokens (t.ink, t.inkSoft, t.grid, t.palette) are threaded through title,
    axes, gridlines, and legend consistently; both renders are legible with identical
    data colors and correctly flipped chrome
  - Deterministic, in-memory data generation with no RNG — fully reproducible
  weaknesses:
  - Design excellence is competent but minimal — beyond the dashed/muted reference
    line there's no additional visual hierarchy device (e.g. subtle fill under the
    better-performing curve, an annotated operating point, or emphasis on the AUC
    gap between the two tests) to give the chart a stronger focal point
  - No Highcharts-distinctive features are used beyond the core line/legend/tooltip
    API (e.g. a marker or annotation at a specific threshold point, or a plotLine/plotBand)
    — the implementation is idiomatic but generic relative to what Highcharts offers
  - Grid styling is default subtle Imprint tokens with no additional refinement (e.g.
    dashed minor gridlines) that would lift it further above baseline polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "roc-curve · javascript · highcharts · anyplot.ai" at top center, clearly legible. Axis titles "False Positive Rate" (x) and "True Positive Rate" (y) in medium-gray ink, legible. Tick labels (0, 0.2, 0.4, ... 1) in gray, legible. Subtle light-gray horizontal and vertical gridlines, visible but not dominant. Legend at bottom with three entries (Antibody test, Enzyme test, Random classifier) in gray text, legible.
      Data: First series (Antibody test, AUC = 0.90) is green (#009E73), bowing sharply toward the top-left. Second series (Enzyme test, AUC = 0.80) is purple, a shallower bow. Third series (Random classifier, AUC = 0.50) is a black dashed diagonal from (0,0) to (1,1). All three lines are clearly distinguishable from the background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis titles now rendered in light/white ink, clearly legible against the dark background. Tick labels in light gray, legible. Gridlines are subtle light-gray-on-dark, visible but not dominant. Legend text is light-colored and legible.
      Data: Antibody test curve is the same green (#009E73) as in the light render; Enzyme test curve is the same purple. The random-classifier diagonal flips from black dashed to white/light dashed, correctly following the chrome (ink) rather than staying a fixed data color. No dark-on-dark or light-on-light failures observed anywhere — every text element is clearly readable.
