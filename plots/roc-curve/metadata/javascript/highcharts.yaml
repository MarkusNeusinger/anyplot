    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "roc-curve · javascript · highcharts · anyplot.ai" at top center, clearly legible. Axis titles "False Positive Rate" (x) and "True Positive Rate" (y) in medium-gray ink, legible. Tick labels (0, 0.2, 0.4 ... 1) in gray, legible. Subtle dotted gridlines (major + minor) visible but not dominant. A vertical dashed "FPR = 0.10" plotLine near the left, and a "TPR = 0.77" data-label above a small triangular marker on the top curve, both dark and legible against the light background. Legend at bottom with three entries (Antibody test, Enzyme test, Random classifier) in gray text, legible.
      Data: First series (Antibody test, AUC = 0.90) is brand green (#009E73) with a light green area fill beneath it, bowing sharply toward the top-left. Second series (Enzyme test, AUC = 0.80) is lavender/purple, a shallower bow. Third series (Random classifier, AUC = 0.50) is a black dashed diagonal from (0,0) to (1,1). All series are clearly distinguishable from the background and from each other; the threshold marker and its label do not overlap any curve or gridline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
