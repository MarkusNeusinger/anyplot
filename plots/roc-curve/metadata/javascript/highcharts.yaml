review:
  strengths:
  - 'Correct ROC math: tpr = fpr^(1/power) integrates analytically, so the AUC labels
    (0.90, 0.80) are computed via trapezoidal integration and stay exactly consistent
    with the plotted curve shapes rather than being hard-coded'
  - Area fill under the top-performing curve turns 'AUC' from an abstract legend number
    into a literal visible shape, and the new FPR=0.10 plotLine + scatter/dataLabel
    callout (TPR=0.77) gives the chart a concrete 'accept this many false positives,
    get this much sensitivity' narrative -- directly resolves the prior attempt's
    DE-03/LM-02 weaknesses (no threshold annotation, no plotLine)
  - 'Diagonal random-classifier reference line is present, styled distinctly (dashed,
    muted ink color, enableMouseTracking: false so it doesn''t produce a misleading
    hover), and correctly spans (0,0) to (1,1)'
  - Two models compared with clearly distinct Imprint palette colors in canonical
    order (green then lavender), each curve's AUC surfaced directly in the legend
    text
  - 'Square 2400x2400 canvas correctly honors the spec''s ''equal aspect ratio preferred''
    note via the //# anyplot-orientation: square directive'
  - Theme tokens (t.ink, t.inkSoft, t.grid, t.palette) are threaded through title,
    axes, gridlines, legend, and the new annotation consistently; both renders are
    legible with identical data colors and correctly flipped chrome
  - Deterministic, in-memory data generation with no RNG -- fully reproducible
  weaknesses:
  - 'Header block is missing the mandatory ''// License: Highcharts — commercial license,
    free for non-commercial use (highcharts.com/license)'' line required by prompts/library/highcharts.md.
    It was present in the original implementation commit (feat: implement roc-curve)
    but was dropped by a later automated header-rewrite that updated the Quality score
    -- looks like a pipeline header-rewrite bug rather than something this implementation
    did wrong, but the license notice should be visible in the shipped file.'
  - Helper functions (rocCurve, areaUnderCurve, toPoints) are small and pure but push
    the file slightly past a flat Imports->Data->Plot structure; acceptable for deterministic
    analytic data generation but worth noting for KISS scoring.
  - Distinctive-feature usage is already good (plotLines with label, dataLabels callout,
    area fill) but could go one step further, e.g. a plotBand highlighting the performance
    gap between the two curves, for even stronger visual differentiation.
