review:
  strengths:
  - 'Correct ROC-curve semantics: two classifiers (Random Forest AUC 0.96, Logistic
    Regression AUC 0.79) plus a dashed y=x diagonal baseline, matching every requirement
    in the spec''s Notes section.'
  - Deterministic, seeded synthetic data (LCG + Box-Muller) generating a realistic,
    neutral medical-diagnostic scenario (malignant vs. benign biopsy scores) with
    genuinely different AUCs that demonstrate varying classifier quality.
  - 'Thoughtful visual hierarchy: the stronger model gets the thickest line (3.5px),
    the weaker model is thinner (3px), and the reference diagonal uses the theme-adaptive
    ink/neutral token with reduced opacity and dashing so it recedes into the chart''s
    structural layer instead of competing with the data.'
  - Explicit font sizing across title/axis/tick labels; both themes render text legibly
    with correct chrome flip (background, ink) while data colors (palette[0] green,
    palette[1] lavender) stay identical between light and dark.
  - Square canvas orientation combined with tuned margins yields a near-1:1 plot aspect
    ratio, matching the spec's 'equal aspect ratio preferred' note.
  weaknesses:
  - The diagonal reference line is implemented as a full 101-point data series (with
    its own 'AUC = 0.50' legend entry) rather than MUI X's dedicated <ChartsReferenceLine>
    component from @mui/x-charts/ChartsReferenceLine — the purpose-built component
    would be more idiomatic and a stronger showcase of library-specific features.
  - Grid is enabled on both axes (horizontal + vertical); the style guide's default
    for line charts is Y-axis-only grid (both axes is more of a scatter-plot convention)
    — acceptable here given the exact-coordinate-reading nature of an ROC curve, but
    the repair pass should consider whether vertical gridlines add real value or just
    visual noise.
  - Several data-generation helper functions (lcg, randNormal, rocFromScores, onGrid)
    add real code volume beyond the KISS ideal; justified by the need for a genuine
    threshold sweep rather than hard-coded points, but a short comment tying them
    together as 'the ROC pipeline' would aid readability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Bold dark title "roc-curve · javascript · muix · anyplot.ai" top-left; axis titles "False Positive Rate" (x) and "True Positive Rate" (y) in dark ink; tick labels 0.00-1.00 in steps of 0.05 on both axes, dark and clearly legible; subtle light-gray gridlines on both axes; horizontal legend row at the bottom with three color swatches and labels.
      Data: Green (#009E73) "Random Forest" curve rises steeply to the top-left corner (AUC 0.96); lavender (#C475FD) "Logistic Regression" curve is a smoother, less steep climb (AUC 0.79); a black dashed diagonal line runs from (0,0) to (1,1) representing the random-guess baseline. All lines are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS — all text is fully readable against the light background, no overlap, no clipping at the canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, clearly legible against the dark background; gridlines are a subtle light gray at low opacity; legend row at the bottom with the same three swatches, the "Random guess" swatch now rendered near-white to match the flipped ink token.
      Data: Colors are identical to the light render — green (#009E73) Random Forest curve and lavender (#C475FD) Logistic Regression curve — confirming Imprint palette data-color consistency across themes. The dashed baseline is now a light gray/white dashed diagonal (theme-adaptive ink token, not a fixed data color).
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; all text and lines are clearly visible against the dark surface.
