review:
  strengths:
  - 'Correct Imprint palette usage: Random Forest uses brand green #009E73 (t.palette[0])
    and Logistic Regression uses lavender (t.palette[1]); the diagonal reference line
    correctly uses the neutral inkSoft token instead of a categorical color since
    it isn''t a fitted model.'
  - 'Theme chrome is fully correct in both renders: warm off-white background in light,
    warm near-black in dark, all text and grid lines theme-adaptive, and the two data
    colors are pixel-identical across themes.'
  - 'Clever handling of the y=x reference line: its stroke is hidden and only its
    label is rendered via ChartsReferenceLine, avoiding a redundant legend entry while
    still crediting the random-guess baseline (AUC = 0.50) directly on the chart.'
  - Visual hierarchy through line-weight variation (strokeWidth 3.5 for the stronger
    Random Forest curve vs. 3 for Logistic Regression) reinforces which model is better
    at a glance, matching the spec's 'compare multiple models' requirement.
  - Chart area is tuned close to a 1:1 aspect ratio (~1030x1034 CSS px) on the square
    canvas, honoring the spec's 'equal aspect ratio preferred' note for FPR/TPR axes
    both spanning 0-1.
  - Deterministic, from-scratch ROC/AUC computation (seeded LCG + Box-Muller + threshold
    sweep + trapezoidal AUC) is a reasonable substitute for sklearn.metrics.roc_curve
    given the browser has no numpy/sklearn, and legend labels surface the AUC per
    spec.
  - Realistic, neutral data scenario (malignant vs. benign biopsy score distributions)
    directly matches the spec's medical-diagnostics application example, with a clear
    quality gap between the two classifiers (AUC 0.96 vs 0.79) demonstrating real
    feature coverage.
  weaknesses:
  - Title font-size (25px CSS) is on the modest side relative to the square canvas
    — it reads cleanly but doesn't carry quite the visual weight a 'largest element,
    first thing readers see' title typically should; a couple of px larger would strengthen
    the hierarchy without risking overflow given how short this title format is.
  - 'Design refinement is good but not maximal: the horizontal-only grid and un-boxed
    legend are solid choices, but there''s no additional polish (e.g. a subtle shaded
    confidence/reference zone, or emphasis styling on the winning curve beyond stroke
    width) that would push this from ''strong'' to ''publication-ready''.'
  - Data generation logic (lcg/randNormal/rocFromScores/onGrid) is necessary given
    no numpy/sklearn in-browser, but is fairly verbose for a KISS-structured snippet
    — acceptable given the constraint, not a defect worth repairing.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "roc-curve · javascript · muix · anyplot.ai" top-left, dark axis titles "False Positive Rate" (x) and "True Positive Rate" (y), dark tick labels at 0.05 increments from 0.00 to 1.00 on both axes, subtle horizontal gridlines, legend centered at the bottom with colored square swatches. All text is clearly readable against the light background.
      Data: Two solid curves — a thick green (#009E73) "Random Forest" curve that rises steeply and hugs the top-left corner (AUC = 0.96), and a slightly thinner lavender/purple "Logistic Regression" curve that rises more gradually (AUC = 0.79). A gray dashed diagonal line runs from (0,0) to (1,1) representing random guessing, labeled "Random guess (AUC = 0.50)" in gray text placed in open space above the diagonal, not overlapping either curve.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, axis titles, tick labels, and legend are all rendered in light/off-white text, clearly visible against the dark background. No dark-on-dark text was found; grid lines remain subtle but visible.
      Data: The green Random Forest curve and lavender Logistic Regression curve are identical in hue and shape to the light render (only the background and text color inverted, as required), and the dashed gray diagonal reference line with its label reads correctly in the dark theme too.
      Legibility verdict: PASS
