review:
  strengths:
  - The square drawing area is computed from window.ANYPLOT_SIZE (side, sideX, sideY
    margins), so the plot area is truly square in the render and the y=x diagonal
    runs at 45 degrees as the Notes prefer.
  - 'Each ROC curve gets its own x axis (xAxisId per series) carrying its own FPR
    operating points: a clean MUI X composition that lets two curves with different
    x samples share one LineChart without resampling, with curve: "linear" so the
    stair-steps are the computed operating points, never smoothed.'
  - Operating points come from a real threshold sweep over 1000 scored samples per
    model and the AUC by the trapezoidal rule; the legend values (0.96, 0.79) match
    the theoretical Φ(d/√2) for the 2.3 SD and 1.15 SD separations (0.95, 0.79).
  - 'Clear visual hierarchy through stroke styling via v9 per-series CSS selectors:
    model curves at 3 px in Imprint #009E73 and #C475FD, the random-classifier diagonal
    at 2 px dashed in the inkSoft token, distinct at a glance and visible in both
    themes.'
  - Theme tokens threaded through every chrome element (title ink, subtitle inkSoft,
    axis labels, tick labels, grid, axis lines), so both renders are fully legible;
    tooltips remain available in the interactive HTML.
  weaknesses:
  - 'Suggestion: tick labels at 14 px on the 1200 px square canvas are at the low
    end of the 14–16 px band; 15–16 px would hold up a little better in the 400 px
    thumbnail.'
  - 'Suggestion: the y-axis title sits about 60 px left of its tick labels; a slightly
    narrower y-axis band (Y_AXIS_W) would tie it closer to the axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas.
      Chrome: bold dark title "roc-curve · javascript · muix · anyplot.ai" centered at top, a lighter grey subtitle "2 classifiers · up to 1001 operating points per curve · AUC by the trapezoidal rule", axis titles "False positive rate" (x) and "True positive rate" (y, rotated), tick labels 0.0–1.0 in 0.1 steps on both axes, subtle light grey horizontal and vertical grid, dark axis lines on left and bottom only. All text readable, nothing clipped.
      Data: Random Forest curve in brand green #009E73 hugging the top-left corner, Logistic Regression curve in lavender #C475FD bowing more gently, both as fine stair-steps from (0,0) to (1,1); a dark-grey dashed diagonal y=x from corner to corner. Square plot area. Horizontal legend at the bottom: "Random Forest (AUC = 0.96)", "Logistic Regression (AUC = 0.79)", "Random classifier (AUC = 0.50)" with matching line glyphs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
