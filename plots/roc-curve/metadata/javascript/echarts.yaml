      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "roc-curve · javascript · echarts · anyplot.ai" centered at top, fully visible. Legend below in a single row with three entries (dashed gray "Random classifier (AUC = 0.50)", green "Gradient Boosting (AUC = 0.96)", lavender "Logistic Regression (AUC = 0.75)"). Axis lines are now hidden (axisLine: show:false per prior feedback) — only subtle light-gray gridlines at 0.2 intervals remain, giving a cleaner, more minimal frame than attempt 1. Axis names ("False Positive Rate", "True Positive Rate") and tick labels are dark/soft-dark and clearly legible.
      Data: First series (Gradient Boosting) is Imprint brand green #009E73 with a new soft area-fill (opacity 0.12) under its curve, plus a faint markArea highlight box in the top-left corner (approx. x:0-0.22, y:0.82-1) at opacity 0.07 — a subtle attempt to call out the "near-perfect classifier" region. Second series (Logistic Regression) is Imprint lavender #C475FD, no area fill. Dashed neutral-gray diagonal reference line runs corner to corner.
