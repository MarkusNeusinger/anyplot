review:
  strengths:
  - 'Correct ROC curve math: accurate step-function staircase curves with AUC computed
    via the trapezoidal rule, matching the visual curve shapes'
  - Diagonal random-classifier reference line present, styled as a neutral dashed
    line, correctly distinguished from real data series
  - 'Palette compliance: first data series is brand green #009E73 (Gradient Boosting),
    second is Imprint lavender #C475FD (Logistic Regression), in canonical order,
    identical across light/dark renders'
  - Both renders are fully theme-correct - no clipping, no legibility failures, warm
    off-white/near-black backgrounds as required
  - Deterministic, reproducible data generation via a small fixed-seed LCG
  - Title and legend exactly match the mandated spec conventions, with AUC embedded
    directly in the legend labels
  weaknesses:
  - Design Excellence is capped by a fairly default ECharts look - consider a soft
    area-fill under the leading (green) curve, or refined legend swatch styling, to
    lift DE-01/DE-02
  - No explicit visual reinforcement of the 'top-left corner = ideal classifier' story
    (DE-03) - consider markArea/markPoint to highlight the ideal corner or each curve's
    optimal threshold (Youden's J statistic)
  - 'axisLine chrome on both axes is fairly prominent - consider axisLine: { show:
    false } (keep only splitLine) for a more minimal, refined frame'
  - Several standalone helper functions (makeLcg, randNormal, sampleScores, rocCurve,
    auc) push past a strict KISS 'imports -> data -> plot' structure - understandable
    given the ROC/AUC math, but consolidate where feasible
  - 'Library Mastery usage is fairly generic (multi-series line chart with step: ''end'');
    leaning into an ECharts-distinctive feature like markArea/markPoint would also
    raise LM-02'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white
      Chrome: Bold dark title "roc-curve · javascript · echarts · anyplot.ai" centered at top; legend row below with dashed-gray "Random classifier (AUC = 0.50)", green "Gradient Boosting (AUC = 0.96)", lavender "Logistic Regression (AUC = 0.75)"; axis names "False Positive Rate" / "True Positive Rate"; tick labels at 0.2 intervals; all clearly readable dark-on-light
      Data: First series (Gradient Boosting) is brand green #009E73, second (Logistic Regression) is Imprint lavender/purple #C475FD, diagonal reference is neutral dashed gray - matches canonical Imprint order
