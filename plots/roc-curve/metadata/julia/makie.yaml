review:
  strengths:
  - 'Correct ROC curve implementation: diagonal random-classifier reference line,
    two biomarker curves compared, AUC values displayed directly in the legend'
  - 'Theme-adaptive chrome works correctly in both renders — title, axis labels, ticks,
    and grid all readable on both the warm off-white and warm near-black backgrounds;
    data colors (#009E73 green, #C475FD lavender) are identical between themes'
  - Correct Imprint palette order (brand green first series, lavender second) and
    correct canonical square canvas (2400x2400, matching the Figure(1200,1200) x px_per_unit=2
    pair)
  - Equal aspect ratio enforced (aspect = 1, limits = (0,1,0,1)) matching the spec's
    'equal aspect ratio preferred' note
  - 'Clean KISS script: no functions/classes, Random.seed!(42) for reproducibility,
    only imports actually used (CairoMakie, Colors, Random), no fake interactivity'
  weaknesses:
  - Design excellence is competent but generic — the removed spines and subtle grid
    are the spec-mandated baseline, not extra polish on top of it; there is no additional
    visual hierarchy device (e.g. emphasizing the better-performing curve, or a subtle
    fill toward the diagonal to visualize AUC)
  - Library Mastery is basic — only standard Axis/lines!/axislegend calls; nothing
    showcases a Makie-specific feature (e.g. scatter! at an optimal-threshold operating
    point with a text! callout, or band!/fill between curve and diagonal) that would
    distinguish this from an equivalent matplotlib/ggplot line plot
  - Only 3 tick labels (0.0/0.5/1.0) per axis — functional but minimal; intermediate
    ticks (0.25/0.75) would improve reading precision without hurting the current
    proportional balance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "roc-curve · julia · makie · anyplot.ai" centered at top, clearly readable. Axis labels "False Positive Rate" (x) and "True Positive Rate" (y) in dark ink, fully legible. Tick labels (0.0, 0.5, 1.0 on both axes) in soft grey, legible. Subtle grey gridlines at the 0.5 marks only, unobtrusive. Legend in the bottom-right, frameless, with dark-grey text for all three entries.
      Data: Diagonal dashed grey reference line (Random classifier, AUC = 0.50) from (0,0) to (1,1). Green step curve (Biomarker A, AUC = 0.95) rises steeply near the y-axis, indicating strong discrimination. Lavender/purple step curve (Biomarker B, AUC = 0.75) rises more gradually, indicating moderate discrimination. First series is confirmed brand green #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now rendered in near-white ink, fully readable. Axis labels and tick labels flipped to light tones (white / light grey), fully legible against the dark surface. Gridlines remain subtle. Legend text is light grey, readable, frameless.
      Data: Diagonal reference line now light grey (still dashed) for contrast against the dark background. Green (Biomarker A) and lavender (Biomarker B) curves are pixel-identical in color and shape to the light render — confirmed only chrome (background/text/grid) changed, not the data colors.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible against the near-black background.
