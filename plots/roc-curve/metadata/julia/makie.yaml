review:
  strengths:
  - 'Correct ROC curve fundamentals: dashed diagonal random-classifier reference,
    two clearly distinguished model curves, aspect=1 with 0-1 limits on both axes
    as recommended by the spec'
  - Theme-adaptive chrome is correct and consistent in both plot-light.png and plot-dark.png
    (backgrounds, spines, grid, tick/label colors all flip correctly; data colors
    identical across themes)
  - 'Palette compliance: first series is Imprint #009E73, second series is canonical
    Imprint lavender #C475FD, legend and curves match'
  - 'Realistic, neutral data story: two diagnostic biomarkers with meaningfully different
    AUC (0.95 vs 0.75) in a medical-diagnostics context, generated with a seeded RNG'
  - Explicit font sizing throughout (titlesize, xlabelsize/ylabelsize, tick label
    sizes, legend labelsize) and a clean KISS script structure (imports -> data ->
    plot -> save, no functions)
  weaknesses:
  - 'MAJOR - dead/non-functional code: the band!() AUC-advantage shading (line 101)
    and both scatter!()/text!() optimal-operating-point markers and ''Optimal J =
    ...'' annotations (lines 120-137) render ZERO visible pixels in BOTH plot-light.png
    and plot-dark.png. Verified with pixel-level analysis: binary erosion of the green/purple
    color masks (9x9 structuring element, which would easily preserve a markersize=14
    circular marker) leaves 0 surviving pixels in either theme; sampled pixels well
    inside the intended shaded band region are byte-identical to the pure background
    color (250,248,241) with zero tint, even though alpha=0.07 blending of #009E73
    into #FAF8F1 should shift RGB by roughly (-18,-6,-9); and there are zero INK-colored
    pixels anywhere in the plot interior in either theme, so the ''Optimal J'' text
    is not drawn at all. Debug why these five draw calls silently produce nothing
    (check opt_fpr_a/opt_tpr_a/opt_fpr_b/opt_tpr_b are not NaN, check whether band!/scatter!/text!
    are being clipped by the hard axis `limits = (0, 1, 0, 1)`, check z-order) and
    make them actually render — or remove this dead code entirely rather than shipping
    draw calls with no visual effect.'
  - Because the optimal-point annotations don't render, Data Storytelling (DE-03)
    currently relies entirely on the color/line-width separation between the two curves
    rather than the explicit Youden's-J emphasis the code clearly intended to add
  - The band!() and scatter!() calls that would have been the implementation's distinctive
    Makie-specific touch (Library Mastery) contribute nothing visually as currently
    shipped
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly (verified pixel sample: RGB 250,248,241).
      Chrome: Bold dark title "roc-curve · julia · makie · anyplot.ai" centered at top, clearly readable. Axis labels "False Positive Rate" (x) and "True Positive Rate" (y) in dark ink, tick labels (0.0, 0.25(implicit), 0.5, 0.75(implicit), 1.0) in softer gray, subtle light-gray gridlines only at 0.5 forming a faint cross, top/right spines removed. Legend bottom-right, transparent background, text in soft gray, no overlap with data.
      Data: Diagonal dashed gray "Random classifier (AUC = 0.50)" reference line. Green (#009E73) "Biomarker A (AUC = 0.95)" curve rises very steeply near the origin - excellent separation from random. Lavender (#C475FD) "Biomarker B (AUC = 0.75)" curve is visibly weaker, closer to the diagonal, still clearly beats random. First series is #009E73 as required. NOTE: pixel analysis found NO visible scatter markers, NO "Optimal J" text annotations, and NO band-shading tint anywhere in the image, despite the source code containing band!()/scatter!()/text!() calls intended to draw them (see weaknesses).
      Legibility verdict: PASS (all rendered text is legible; the missing markers/annotations are a functional/code-elegance defect, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (chrome inverted correctly from light).
      Chrome: Title and axis labels now light-colored (#F0EFE8) against the dark background, clearly readable; tick labels in the lighter INK_SOFT gray; gridlines subtle; legend text light gray, no dark-on-dark or light-on-light failures observed.
      Data: Data colors are pixel-identical to the light render (#009E73 green, #C475FD lavender, same dashed gray diagonal) - only chrome flipped, as required. Same absence of scatter markers/annotations/band-shading confirmed via the same pixel analysis as the light render.
      Legibility verdict: PASS (no dark-on-dark or light-on-light issues; same non-rendering-elements defect as light render).
