review:
  strengths:
  - Two-curve comparison (Biomarker A vs. Biomarker B) with a manually-computed trapezoidal
    AUC, exactly matching the spec's 'distinct colors/styles when comparing multiple
    models' note
  - Diagonal random-classifier reference line included and clearly labeled with AUC
    = 0.50
  - Youden's J optimal-threshold point marked and annotated on each curve — a distinctive,
    non-generic touch beyond the bare spec requirements
  - band! shading between Biomarker A's curve and the diagonal gives an immediate
    visual read of AUC advantage without cluttering the chart
  - aspect = 1 and limits = (0,1,0,1) correctly honor the spec's 'equal aspect ratio
    preferred' note
  - Theme tokens (PAGE_BG, INK, INK_SOFT) correctly threaded through title, axis labels,
    ticks, spines and grid — both renders are legible with no dark-on-dark or light-on-light
    failures
  - First data series uses Imprint brand green (#009E73), second uses lavender (#C475FD),
    correct canonical order; data colors identical across themes
  - 'Clean KISS script: no functions/classes, seeded RNG (Random.seed!(42)), only
    used imports (CairoMakie, Colors, Random), saves plot-$(THEME).png with px_per_unit=2'
  weaknesses:
  - The 'Optimal J = 0.78' annotation for Biomarker A sits immediately above-right
    of its marker, right where the green curve is still rising steeply — the text
    edge brushes close to the curve line in both renders. Consider a shorter offset
    upward/away from the curve, or align=(:left, :top) with a larger vertical offset,
    so the text clears the line with a visible gap.
  - Title 'roc-curve · julia · makie · anyplot.ai' occupies only ~40-45% of the square
    canvas width, below the 50-70% guideline range — since this spec-id has no optional
    descriptive-title prefix, the title reads a bit small relative to the generous
    canvas. Not a hard violation, but a `{Descriptive Title} · ` prefix (e.g. 'Biomarker
    Diagnostic Comparison · roc-curve · julia · makie · anyplot.ai') would fill the
    title proportion better and add context.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "roc-curve · julia · makie · anyplot.ai" in bold dark ink, centered above the plot, fully visible with no clipping. Axis labels "False Positive Rate" / "True Positive Rate" in dark ink, tick labels (0.00-1.00 in 0.25 steps) in softer grey-ink, all clearly legible. Subtle grey gridlines at 0.25 intervals on both axes. Top/right spines removed, left/bottom spines present in soft ink. Legend (bottom-right, no frame) lists "Random classifier (AUC = 0.50)", "Biomarker A (AUC = 0.95)", "Biomarker B (AUC = 0.75)" in soft-ink text.
      Data: Dashed grey diagonal reference line from (0,0) to (1,1). Green (#009E73) step curve for Biomarker A rising steeply near the y-axis, saturating near TPR=1 by FPR≈0.55. Lavender (#C475FD) step curve for Biomarker B rising more gradually, tracking closer to the diagonal. A pale green wash fills the area between Biomarker A's curve and the diagonal, visually encoding its AUC advantage. Each curve has a filled dot marking its Youden's-J-optimal operating point, with a bold "Optimal J = 0.78" / "Optimal J = 0.38" label beside it.
      Legibility verdict: PASS — all text reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black. The green AUC-shading wash and dark surface combine to give the plot interior a deep green-black tone; this is the alpha-blended band over the dark background, not a background color error.
      Chrome: Title and axis labels rendered in light ink (near #F0EFE8), tick labels in a softer light-grey ink — both clearly legible against the dark surface. Gridlines are faint light lines at the same 0.25 intervals. Spines and legend follow the same layout as the light render, legend text in soft light ink, no frame.
      Data: Diagonal reference line now dashed light-grey. Data colors are unchanged from the light render — green #009E73 for Biomarker A, lavender #C475FD for Biomarker B — confirming only chrome (background/text/grid) flipped between themes. Optimal-J markers and annotation text are in light ink and remain legible over the dark/green-tinted band.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick and annotation text remain clearly visible against the dark surface.
