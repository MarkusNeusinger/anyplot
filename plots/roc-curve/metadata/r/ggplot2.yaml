review:
  strengths:
  - Correct step-function ROC curves for two classifiers with a properly styled dashed
    y=x diagonal reference line, labeled 'Random classifier'
  - 'First categorical series is exactly #009E73 (brand green), second uses Imprint
    position 2 (#C475FD) — fully compliant in both light and dark renders, chrome
    tokens flip correctly with no dark-on-dark or light-on-light failures'
  - coord_fixed(ratio = 1) enforces the spec's 'equal aspect ratio preferred' requirement
    precisely, and the square 2400×2400 canvas suits the symmetric 0-1/0-1 axes
  - AUC values computed via a custom trapezoidal-rule integration and surfaced directly
    in the legend labels, satisfying the spec's 'Display AUC score in legend' requirement
  - Explicit font sizes throughout (title 12pt, axis titles 10pt, tick/legend text
    8pt) and a clean L-shaped axis frame with subtle y-only gridlines follow the style
    guide's minimalism and grid guidance
  - Two classifiers with clearly different real-world performance (AUC 0.95 vs 0.76)
    give the plot genuine data variation rather than two near-identical curves
  weaknesses:
  - 'CQ-01: roc_points() and trapezoid_auc() are two full custom function definitions
    — a real deviation from the KISS ''Imports → Data → Plot → Save, no functions''
    structure. Necessary since no ROC/AUC package (e.g. pROC) is imported, but consider
    inlining the trapezoid AUC into a single vectorized expression to reduce structural
    overhead.'
  - 'DE-01/DE-02: the legend keeps a full rectangular border box (legend.background
    = element_rect(..., color = INK_SOFT)) — the style guide''s decoration-removal
    checklist calls out ''box frames around legends'' as a candidate for removal;
    a borderless legend (fill only, or fill with subtle alpha) would read as more
    polished.'
  - 'DE-03: storytelling relies entirely on the legend''s AUC numbers and curve separation
    — no visual emphasis (e.g. marking the optimal threshold / Youden''s J point on
    the stronger curve, or a lightly shaded gap between the two curves) is used to
    make the performance gap immediately legible beyond reading two numbers.'
  - The rotated 'Random classifier' annotation (size = 3, ~8.5pt) is noticeably smaller
    than the other secondary text (8pt tick/legend text is comparable, but visually
    it reads a touch faint against the dashed line) — bumping to ~size 3.5 would improve
    balance without crowding the diagonal.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Disease Diagnostic Test · roc-curve · r · ggplot2 · anyplot.ai" in dark ink at top, clearly visible and not clipped. Axis titles "False Positive Rate" / "True Positive Rate" in dark ink. Tick labels (0.00/0.25/0.50/0.75/1.00 on both axes) in a softer dark gray, all legible. Subtle horizontal (y-axis only) gridlines at low opacity. Bordered legend box in an off-white elevated fill sits inside the lower-right of the plot area, not floating isolated.
      Data: First series (Logistic Regression, AUC = 0.95) renders as a thick #009E73 brand-green step line hugging the top-left corner. Second series (Random Forest, AUC = 0.76) renders as a thick lavender/#C475FD step line, closer to the diagonal. A dashed gray diagonal y=x line labeled "Random classifier" (rotated, small caption) runs corner to corner. All elements distinguishable from the background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles rendered in light off-white ink, clearly visible against the dark background. Tick labels in a lighter soft gray, legible. Gridlines subtle and visible. Legend box uses a dark elevated fill with a visible border, text is light and readable — no dark-on-dark failures detected anywhere (title, axis labels, tick labels, legend text, and the "Random classifier" annotation are all light-colored and readable).
      Data: Both series render in the identical #009E73 green and #C475FD lavender hues as the light render — only chrome (background, text, grid, legend fill) flipped, confirming theme-adaptive implementation is correct.
      Legibility verdict: PASS
