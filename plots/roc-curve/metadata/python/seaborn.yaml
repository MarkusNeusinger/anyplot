review:
  strengths:
  - Curves drawn straight from sklearn roc_curve output with estimator=None, sort=False
    and drawstyle='steps-post', so every operating point shows as a true stair step
  - Theme tokens threaded through title, labels, ticks, spines, grid and legend; both
    renders theme-correct
  - Imprint hues counted from the data (IMPRINT_PALETTE[:n_curves]) in canonical order,
    identical across themes
  - Square plot area with exact 0-1 limits and equal aspect, so the dashed diagonal
    runs at 45 degrees
  - 'Plausible clinical scenario: cardiac biomarkers ranked Troponin I > CK-MB > Myoglobin,
    with AUCs computed, not placed'
  weaknesses:
  - 'Suggestion: draw the curves with clip_on=False so the segments along TPR=1.0
    and FPR=0 keep their full line width at the frame.'
  - 'Suggestion: a slightly thinner, lighter grid in the upper-left would let the
    strong curve''s knee stand out.'
