review:
  strengths:
  - Square 2400x2400 render with a square plot area, so the diagonal runs at 45 degrees
    as the Notes prefer
  - AUC sits in each legend label, and the random baseline shares the legend through
    a strokeDash scale on the same domain as color
  - Theme tokens threaded through title, axes, grid, legend and view in both renders
  - Vectorised ROC sweep and trapezoid AUC computed from the data, reproducible with
    a fixed seed
  - Native .interactive() zoom/pan and formatted tooltips in the HTML output
  weaknesses:
  - 'SC-03 (both): both curves show saw-tooth spikes that drop below their operating
    points (e.g. the green curve falls from about 0.68 to 0.58 TPR near FPR 0.02,
    the purple one from 0.42 to 0.37 near FPR 0.15) because mark_line sorts by FPR
    and joins the points that share an FPR out of threshold order → draw each curve
    in threshold order so it rises monotonically. Likely cause: no alt.Order encoding
    (e.g. an order by threshold column) on mark_line.'
  - 'DQ-02 (both): the models are labelled only ''Strong Model'' and ''Weak Model'',
    with no domain → name real classifier types for a stated task (e.g. ''Gradient
    boosting'' and ''Logistic regression'' for churn prediction). Likely cause: the
    keys of the scores dict.'
  - 'Suggestion: sklearn.metrics.roc_curve(y_true, score) would give the exact operating
    points instead of a 200-step grid.'
  image_description: |-
