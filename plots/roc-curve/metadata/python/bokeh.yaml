review:
  strengths:
  - Square 2400×2400 canvas with a square plot area and fixed 0–1 rate axes, so the
    random-classifier diagonal runs at 45° in both renders
  - Legend entries carry the AUC per curve ('Model A (AUC = 0.87)'), with the dashed
    INK_SOFT diagonal clearly told apart from the solid model lines in both themes
  - AUC is computed from the plotted points with np.trapezoid and the three curves
    are ordered best to worst in canonical Imprint order
  - 'Idiomatic bokeh: one ColumnDataSource per model built from the tidy df, legend_label
    on each glyph, and a HoverTool reading the column names for the HTML view'
  - Theme tokens threaded through title, axes, ticks, grid, outline and an elevated
    legend box; text fully legible in light and dark
  weaknesses:
  - 'DQ-02 (both): the classifiers are labelled ''Model A'', ''Model B'', ''Model
    C'', abstract labels with no evaluation context → name real model types for a
    concrete task (for example ''Gradient Boosting'', ''Logistic Regression'', ''Naive
    Bayes'' on a churn or spam classifier). Likely cause: the keys of the shapes dict.'
  - 'Suggestion: generate scores for a finite labelled sample and compute the curves
    with sklearn.metrics.roc_curve / auc, so the operating points read as an actual
    classifier evaluation rather than closed-form power curves.'
  - 'Suggestion: a slightly heavier line for the best model would give the comparison
    a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the whole 2400×2400 canvas; legend box in the elevated #FFFDF6 with a thin INK_SOFT border.
      Chrome: bold title "roc-curve · python · bokeh · anyplot.ai" centred at the top (~50 % of the width); italic axis titles "False Positive Rate" (x) and "True Positive Rate" (y); ticks 0, 0.2 … 1 on both axes in INK_SOFT; very subtle grid; thin outline round the square plot area. All text dark on light and fully readable.
      Data: three solid curves from (0,0) to (1,1): Model A in #009E73 (AUC 0.87) hugging the top-left, Model B in #C475FD (0.74), Model C in #4467A3 (0.62); grey dashed random-classifier diagonal corner to corner. Legend bottom-right lists the diagonal (AUC = 0.50) and the three models with their AUC; it sits in empty space below Model C's curve.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend box #242420.
      Chrome: title and axis titles in light #F0EFE8, ticks and legend text in #B8B7B0, grid subtle and visible; no dark-on-dark text anywhere.
      Data: the same three curve colors as the light render (#009E73, #C475FD, #4467A3), identical geometry; the dashed diagonal is a lighter grey and stays clearly visible.
      Legibility verdict: PASS
