review:
  strengths:
  - Computes the operating points with sklearn.metrics.roc_curve and the area with
    sklearn.metrics.auc, so every curve runs through its real stair-step operating
    points from (0,0) to (1,1), never smoothed (interpolate=None)
  - Square 2400x2400 canvas with range=(0, 1) and xrange=(0, 1) keeps both axes on
    the full rate range and the diagonal close to 45 degrees
  - AUC printed in each legend label next to its model name, so it is clear which
    curve each score belongs to; two-column bottom legend keeps the plot area free
  - 'Theme tokens threaded through pygal Style (background, plot_background, foreground,
    foreground_subtle) give correct chrome in both renders, and the Imprint palette
    is passed whole so Excellent is #009E73'
  - Tidy df built by groupby over the Model column feeds chart.add per group, and
    pygal's native SVG tooltips carry the (FPR, TPR) values in the HTML output
  - Example AUC values 0.99 / 0.72 / 0.56 match their Excellent / Moderate / Poor
    labels
  weaknesses:
  - 'VQ-01 (both): the y-axis major ticks 0, 0.5 and 1 render at 44 while the other
    tick labels render at 56, so three ticks read visibly smaller than their neighbours
    → one tick size on both axes, the style guide''s 44 for pygal (−12 on label_font_size).
    Likely cause: label_font_size=56 with major_label_font_size=44 in Style.'
  - 'VQ-03 (both): the three model curves draw at about 2.5 px on the 2400 px canvas,
    close to the weight of the dotted guide lines, so the Excellent curve along the
    top and left edges almost merges with the axis and grid → about 6-7 px (+4 px).
    Likely cause: Style(stroke_width=2.5) overriding the intended stroke_style={''width'':
    7}.'
  - 'CQ-04 (code): line 90 passes stroke_dasharray=''18,12'' to chart.add, which pygal
    ignores; the Random diagonal renders solid, so the argument has no effect → pass
    the dash inside stroke_style={''width'': 5, ''dasharray'': ''18,12''} or delete
    it. Likely cause: a non-existent per-series keyword.'
  - 'DQ-02 (both): the models are named Excellent, Moderate and Poor with no domain,
    which reads as a generic placeholder scenario → name real classifier contexts,
    e.g. a gradient-boosted fraud model, a logistic-regression baseline and a rule-based
    screen. Likely cause: the beta_params keys.'
  - 'Suggestion: the legend''s reserved bottom band leaves the plot area about 7 %
    wider than tall; a little less bottom space would make the area square and the
    diagonal exactly 45 degrees.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on a 2400x2400 square canvas.
      Chrome: title "roc-curve · python · pygal · anyplot.ai" in dark ink, about 65 % of the width; axis titles "False Positive Rate" / "True Positive Rate" and ticks 0-1 in steps of 0.1 in dark ink, all readable; y ticks 0, 0.5 and 1 are drawn smaller than the others (pygal major labels). Dotted guide lines on both axes, visible but somewhat busy. Two-column legend at the bottom.
      Data: Excellent (AUC = 0.99) in #009E73 hugging the top-left corner, Moderate (0.72) in #C475FD lilac, Poor (0.56) in #4467A3 blue close to the diagonal, Random (AUC = 0.50) as a solid amber #BD8233 straight diagonal from corner to corner. Curves are stair-step and thin (~2.5 px). No overlap of text.
      Legibility verdict: PASS

