review:
  strengths:
  - coord_fixed(ratio=1) gives a true square panel so the random-classifier diagonal
    runs at 45°, with the italic label set parallel to it
  - 'Data order preserved via an ordered pd.Categorical fed to scale_color_manual
    limits, so the strongest model gets brand green #009E73'
  - AUC values are computed with np.trapezoid from the plotted points and shown per
    model in the legend
  - Theme tokens threaded through every chrome element; both renders fully legible
    with identical data colors
  - 'Clean adaptable layout: column constants, a self-contained Data block and a Plot
    zone that reads only df'
  weaknesses:
  - 'Suggestion: the legend key backgrounds show as faint squares behind the line
    samples (most visible on the dark elevated legend) — a transparent legend_key
    would clean them up.'
  - 'Suggestion: derive the diagonal label position from the axis range rather than
    the literals 0.3/0.36.'
