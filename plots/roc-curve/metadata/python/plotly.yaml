review:
  strengths:
  - Equal aspect ratio via yaxis scaleanchor='x' with constrain='domain', so the diagonal
    runs at 45 degrees on a square plot area
  - 'Clean theme threading: every text, grid, axis line and legend surface comes from
    theme tokens and reads correctly in both renders'
  - ROC points computed with sklearn roc_curve/auc and AUC shown per model in the
    legend
  - 'Adaptable structure: column constants with role comments and one # Data block
    ending in a tidy df, plotted with a groupby loop'
  weaknesses:
  - 'DQ-03 (both): both classifiers are fit and scored on the same 500 training rows,
    so the depth-5 tree''s in-sample AUC of 0.97 beats logistic regression''s 0.93,
    an ordering a held-out ROC would not support → split with train_test_split (e.g.
    test_size=0.3, random_state=42) and compute roc_curve on the test fold. Likely
    cause: clf.fit(X, y) followed by clf.predict_proba(X).'
  - 'DQ-02 (both): the task is an anonymous make_classification set, so nothing in
    the render says what is being classified → give the data a named binary task (e.g.
    churn or fraud screening) through the dataset comment and the legend/axis context.
    Likely cause: make_classification with no domain framing.'
  - 'Suggestion: the translucent AUC fill covers only the first model; either drop
    it or explain in the legend that the shaded area is that model''s AUC.'
  - 'Suggestion: a hovertemplate showing FPR, TPR and the threshold per operating
    point would use plotly''s interactivity in the HTML view.'
  image_description: |-
