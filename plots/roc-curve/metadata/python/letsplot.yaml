review:
  strengths:
  - Draws sklearn's exact operating points with geom_path, so both curves keep their
    honest stair-step shape from (0,0) to (1,1) (C1)
  - Dashed theme-adaptive neutral diagonal reads as the random-classifier reference
    at a glance in both themes (C2)
  - AUC computed by sklearn.metrics.auc from the curves and carried in each legend
    entry, merged from shared color and linetype scales (C3)
  - coord_fixed on a square canvas with 0-1 limits gives a true 1:1 plot area, and
    the one-panel gggrid paints the whole canvas in the page color as the library
    prompt prescribes (C4)
  - Grid drawn in the 15 % grid token at size 0.3, receding behind the curves in both
    themes
  - Mappings and labels read only the column constants; concrete credit-default scenario
    with named models
  weaknesses:
  - 'DE-02 (both): the panel is framed on all four sides although an ROC plot needs
    no enclosing box → keep only the left and bottom axis lines (L-shaped frame).
    Likely cause: the panel border lets-plot draws around the fixed-aspect panel;
    set panel_border=element_blank() and keep axis_line for left and bottom.'
  - 'Suggestion: the legend key column shows a slightly different background patch
    than the elevated legend card; setting legend_key to the card fill would make
    it seamless.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas, edges included (no transparent strips).
      Chrome: title 'Credit Default Risk · roc-curve · python · letsplot · anyplot.ai' in dark ink top-left (~75 % of width); axis titles 'False positive rate' / 'True positive rate' dark; ticks 0-1 in 0.1 steps in soft grey; subtle 15 % grid; panel framed on all four sides; elevated legend card bottom-right titled 'Classifier'. All text readable.
      Data: Gradient boosting stair-step curve in #009E73 hugging the top-left corner (AUC = 0.96), Logistic model in #C475FD (AUC = 0.80), dashed grey random diagonal corner to corner (AUC = 0.50).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full canvas.
      Chrome: title and axis titles in light ink, ticks light grey, subtle light grid, legend card #242420 with light text. No dark-on-dark text.
      Data: identical #009E73 and #C475FD curves; dashed reference flips to light grey and stays clearly visible.
      Legibility verdict: PASS
