review:
  strengths:
  - Draws sklearn's exact operating points with geom_path, so the curves keep their
    honest stair-step shape (C1)
  - Dashed theme-adaptive neutral diagonal reads as the reference at a glance in both
    themes
  - Square 600x600 canvas with coord_fixed gives a true 1:1 plot area spanning 0-1
    on both axes
  - Color and linetype scales share breaks and title, producing one merged legend
    that carries each AUC
  - Concrete credit-default scenario with named models (gradient boosting vs logistic
    model)
  weaknesses:
  - 'Suggestion: the grid is drawn in opaque INK at size 0.2; a lighter grid (the
    15 % grid token) would recede further behind the curves, especially in the light
    render.'
  - 'Suggestion: the legend key column shows a slightly different background patch
    than the elevated legend card; setting legend_key to the card fill would make
    it seamless.'
  - 'Suggestion: the panel is framed on all four sides; dropping the top and right
    edges would match the style guide''s L-shaped default.'
