review:
  strengths:
  - 'Native stacked area series (`stack: "load"`, `area: true`) split the ranked load
    into base, intermediate and peak bands whose shared top edge is the monotone load
    duration curve, on a zero-based load axis spanning all 8,760 hours.'
  - Capacity tiers are drawn with native `ChartsReferenceLine` components (dashed,
    each with its own label carrying the MW value), and the labels are aligned so
    that none of them touches the curve or a region label.
  - Tier colours are ordered steps of imprint_seq (#009E73 base to blue peak), and
    the ink of each region label is chosen from the luminance of the blended fill,
    so 'Base load' stays dark on the bright green while 'Intermediate load' flips
    to light ink in the dark render.
  - Region names and the energy total are placed in data coordinates through a child
    component built on `useXScale`, `useYScale` and `useDrawingArea`, which composes
    them into the chart's own SVG instead of overlaying them.
  - 'Every figure is computed from the data, not hard-coded: the 6.46 million MWh
    total, the 953 MW intermediate tier at the 10 % exceedance point, and the 61.4
    % load factor in the subtitle (mean 737 MW over a 1,200 MW peak), which agree
    with each other.'
  weaknesses:
  - 'Suggestion: the curve exists only as the top edge of the stacked fills (the line
    stroke is set to 0); a thin ink stroke along it would make the duration curve
    read as a line in its own right.'
  - 'Suggestion: the empty headroom band between 1,200 and about 1,320 MW could be
    trimmed a little, so that the Peak capacity label sits closer to the top of the
    frame.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area.
      Chrome: bold dark title "line-load-duration · javascript · muix · anyplot.ai" at the top left, with a soft-ink subtitle (8,760 hourly loads, peak 1,200 MW, minimum 400 MW, load factor 61.4 %). The y-axis title reads "Power demand (MW)" with ticks 0–1,200 and the x-axis title reads "Duration (hours, ranked by load)" with ticks 0–8,000. Subtle horizontal gridlines show faintly through the fills. All text is readable.
      Data: three stacked fills under a monotone decreasing curve: bright green base (#009E73 step) below 400 MW, teal intermediate band from 400 MW up to the curve (capped at 953 MW), and a blue peak sliver at the left where the curve spikes from about 950 to 1,200 MW. Dashed reference lines at 1,200, 953 and 400 MW carry the labels "Peak capacity 1,200 MW", "Intermediate capacity 953 MW" (right) and "Base capacity 400 MW" (left, on the teal fill). Bold region labels "Base load", "Intermediate load" (dark ink on the fills) and "Peak load" (beside the sliver, on the page). "Total energy 6.46 million MWh / area under the curve" sits at the right, above the curve. No overlaps and no clipping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and ticks in light ink, all clearly readable, with no dark-on-dark text. Gridlines are subtle but visible.
      Data: the same three-step imprint_seq ramp as in the light render; the fills look slightly deeper because the 0.85 opacity blends with the dark page, and the hues are unchanged. The dashed capacity lines turn light grey. "Intermediate load" and "Peak load" turn light ink, and "Base load" keeps dark ink on the bright green, which is readable. The capacity labels and the energy annotation are in light ink and readable.
      Legibility verdict: PASS
