review:
  strengths:
  - Native stacked area series (stack + area) build the three regions so their combined
    top edge is exactly the load duration curve, with base capacity at the minimum
    load and the intermediate tier at the 10 %-exceedance level
  - ChartsReferenceLine draws all three dashed capacity tiers with labelAlign/spacing
    placement, each label clear of the curve and region labels
  - useXScale/useYScale/useDrawingArea hooks place the region labels and the energy
    annotation in data coordinates; label ink is picked per fill from its luminance,
    so every label stays readable in both themes
  - Energy (7.75 million MWh) and load factor (73.7 %) are computed from the data,
    not hard-coded, and are consistent with the area under the curve
  - Ordered tiers in steps of imprint_seq with base in brand green, identical across
    themes; chrome flips correctly
  weaknesses:
  - 'DQ-01 (both): the load profile 400 + 800·(1−h/8759)^0.65 is concave from the
    first hour, so the left end falls gently (about 1,200 → 1,147 MW over the first
    876 hours) instead of the steep, narrow peak spike the characteristic bullet names
    → a profile whose top few percent of hours drop steeply before the long gently
    sloping middle (e.g. sort a synthetic hourly series with daily/seasonal swings
    plus rare spikes, or add a steep convex term over the first ~5 % of hours). Likely
    cause: the single power-law expression in the data block.'
  - 'Suggestion: the title occupies about a third of the width; a slightly larger
    title size would give the header more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: title "line-load-duration · javascript · muix · anyplot.ai" in dark ink top-left with a muted subtitle (8,760 hourly loads · peak 1,200 MW · minimum 400 MW · load factor 73.7 %); y axis "Power demand (MW)" 0-1,200+, x axis "Duration (hours, ranked by load)" 0-8,000; ticks dark grey, subtle horizontal gridlines drawn over the fills. All readable.
      Data: a monotonically decreasing curve from 1,200 MW to 400 MW, filled as three stacked regions: base load (brand green, 0-400 MW across the whole year), intermediate load (teal), peak load (a thin blue sliver above 1,147 MW over the first ~880 hours). Dashed lines with labels: "Peak capacity 1,200 MW" and "Intermediate capacity 1,147 MW" at the right, "Base capacity 400 MW" at the left. Bold region labels "Base load", "Intermediate load" (dark ink on fills) and "Peak load" beside the sliver; "Total energy 7.75 million MWh / area under the curve" in the empty upper right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and ticks in light ink; gridlines subtle; dashed capacity lines light grey. No dark-on-dark text.
      Data: the same three fills in the same ramp steps (green, teal, blue), slightly deeper because the 0.85 fill opacity blends with the dark page; "Intermediate load" and "Peak load" switch to light ink, "Base load" stays dark ink on the green. Brand green clearly visible.
      Legibility verdict: PASS
