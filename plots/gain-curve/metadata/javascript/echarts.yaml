review:
  strengths:
  - 'Correct cumulative-gains construction: model curve rises steeply then saturates
    at 100%, plotted against a proper diagonal random-selection baseline'
  - Baseline reference line uses the theme-adaptive `neutral` semantic anchor (t.ink)
    instead of a fixed color — correct semantic use of an anchor outside the categorical
    pool
  - 'First series correctly branded #009E73; data colors identical across light/dark,
    only chrome flips as required'
  - Deterministic fixed-seed LCG data generation with a plausible, neutral churn-modeling
    scenario (2000 customers, 18% churn rate)
  - 'Line-only rendering (symbol: none) avoids overplotting 2000-point-derived curves;
    line weights (3.5 model vs 2 dashed baseline) are sensible for a 2-series chart'
  - Axis labels are descriptive with % units, title format matches the mandated pattern,
    explicit font sizes set throughout
  weaknesses:
  - 'Legend items are crowded — the ''Random selection'' icon sits tight against its
    label with almost no gap (default itemGap); add `legend: { itemGap: 24 }` or similar
    so the two legend entries read as clearly separated'
  - 'Design Excellence is at ''well-configured default'' level: no areaStyle shading
    between the model curve and baseline to visually emphasize the ''gain'' (the core
    insight of this chart type), no markPoint/markLine annotation calling out e.g.
    the population % where the model first reaches 100% capture'
  - Library Mastery is generic — the implementation uses only a bare line series +
    legend + axes, none of ECharts' distinctive features (markArea/markLine for the
    baseline or gain region, custom tooltip formatter, graphic component for callouts)
    that would set it apart from a generic line-chart port
  - No visual annotation of the classic gain-curve insight ('steeper initial slope
    = better discrimination') — consider a markPoint or text annotation at the elbow
    of the model curve, or shading the area between model and baseline with a low-alpha
    fill in the brand color to make the story pop
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Title "gain-curve · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Legend ("Model" / "Random selection") sits below the title, dark text. Axis names "Percentage of customers targeted" (x) and "Cumulative churners captured" (y) in dark ink; tick labels in a softer dark gray, all formatted with "%". Subtle light-gray gridlines at both major x and y ticks.
      Data: Model curve in brand green (#009E73), thick (3.5px), rising steeply from 0 to ~64% captured by ~12% targeted, then a shallower climb to 100% captured by ~54% targeted, then flat at 100% to x=100%. Random-selection baseline is a black dashed diagonal from (0,0) to (100,100), using the theme's ink/neutral token.
      Legibility verdict: PASS — all title, legend, axis, and tick text is clearly readable against the light background. Minor: legend icon for "Random selection" is crowded tightly against its label text (spacing issue, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black.
      Chrome: Same title/legend/axis layout, now rendered in light off-white ink against the dark background. Tick labels in a lighter soft-gray. Gridlines are subtle light-on-dark hairlines.
      Data: Model curve is identical brand green (#009E73) — confirmed same hex as light render. The random-selection baseline is now a white/light dashed line (theme-adaptive neutral anchor correctly flipped from black to white) rather than staying black, which would have been a dark-on-dark failure — this was avoided.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures found; all chrome elements (title, legend, axis names, ticks) are clearly visible against the dark surface. Same minor legend crowding issue as light render.
