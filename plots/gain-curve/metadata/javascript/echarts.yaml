review:
  strengths:
  - Shaded 'gain band' between the model curve and the random-selection baseline (stacked
    invisible-lower + translucent-diff line trick) directly visualizes the core insight
    of a gain curve — the previous attempt's biggest gap is now fixed
  - Elbow markPoint annotation labels exactly where the model first captures 100%
    of positives ('100% captured at 54% targeted'), turning a passive line into an
    active data story
  - 'Correct cumulative-gains construction: model curve rises steeply then saturates,
    plotted against a proper diagonal random-selection baseline drawn via markLine'
  - 'First series correctly branded #009E73; data colors (green model line, gain-band
    fill) are pixel-identical across light/dark, only chrome flips as required'
  - Deterministic fixed-seed LCG data generation with a plausible, neutral churn-modeling
    scenario (2000 customers, 18% churn rate)
  - 'Legend crowding from the prior review is fixed (itemGap: 24) — ''Model'' and
    ''Random selection'' now read as clearly separated items'
  - Axis labels are descriptive with % units, title format matches the mandated pattern,
    explicit font sizes set throughout, both renders pass the theme-readability check
  weaknesses:
  - 'The ''Random selection'' legend icon renders a small stray dot immediately after
    its circle marker, in both themes (visible on close zoom) — likely the dashed
    lineStyle''s dash pattern bleeding into the auto-generated legend icon; set an
    explicit legend icon (e.g. `icon: ''line''` for the series, or match the icon
    to a solid style) to avoid the artifact'
  - Design/aesthetic refinement is solid but still fairly conventional beyond the
    new gain-band + elbow annotation — no additional touches (e.g. a subtle gradient
    on the band fill, softened line joins) push it into top-tier polish territory
  - The 'Random selection' entry uses an empty-data line series purely to get a legend
    entry, with the actual diagonal drawn via a separate markLine — functionally correct
    and explained in comments, but an indirect two-mechanism approach for one visual
    element
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white, not dark.
      Chrome: Title "gain-curve · javascript · echarts · anyplot.ai" in bold dark ink, centered top. Legend ("Model" / "Random selection") sits below the title with clear spacing between items (itemGap fixed from the prior review). Axis names "Percentage of customers targeted" (x) and "Cumulative churners captured" (y) in dark ink; tick labels in a softer dark gray, all formatted with "%". Subtle light-gray gridlines at major x/y ticks. A bold annotation "100% captured at 54% targeted" sits above the point where the model curve first reaches 100%, with no overlap with the gridline or plot edge.
      Data: Model curve in brand green (#009E73), thick (3.5px), rising steeply from 0 to ~64% captured by ~12% targeted, then a shallower climb to 100% captured by ~54% targeted, then flat at 100% to x=100%. A translucent green "gain band" (opacity 0.15) fills the area between the model curve and the diagonal random-selection baseline, visually emphasizing the model's advantage over random targeting. The random-selection baseline is a black dashed diagonal from (0,0) to (100,100), drawn via markLine using the theme's ink/neutral token.
      Legibility verdict: PASS — all title, legend, axis, tick, and annotation text is clearly readable against the light background. Minor: on close zoom, the "Random selection" legend icon shows a tiny stray dot right after its circle marker (cosmetic artifact, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black, not light.
      Chrome: Same title/legend/axis/annotation layout, now rendered in light off-white ink against the dark background. Tick labels in a lighter soft-gray. Gridlines are subtle light-on-dark hairlines.
      Data: Model curve and gain-band fill are the identical brand green (#009E73) — confirmed same hex and same opacity as the light render, only the chrome flipped. The random-selection baseline is now a white/light dashed line (theme-adaptive neutral anchor correctly flipped from black to white) rather than staying black, which would have been a dark-on-dark failure — this was correctly avoided.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures found; all chrome elements (title, legend, axis names, ticks, annotation) are clearly visible against the dark surface. Same minor legend-icon dot artifact as the light render, correctly re-colored to white.
