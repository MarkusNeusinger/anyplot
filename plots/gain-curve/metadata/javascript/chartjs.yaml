review:
  strengths:
  - 'Correct gain-curve semantics: model curve, perfect-model reference (kinked at
    the true positive rate ~13%), and random-selection diagonal are all present and
    mathematically consistent with the underlying data.'
  - 'First categorical series uses brand green #009E73, and reference lines use theme-adaptive
    ink/muted tokens distinguished by both color and dash pattern (dotted vs. dashed),
    which keeps the chart colorblind-safe.'
  - 'Both renders keep data colors identical and correctly flip chrome (background,
    text, grid) between the #FAF8F1 light and #1A1A17 dark themes with no dark-on-dark
    or light-on-light legibility failures.'
  - Deterministic fixed-seed LCG data generation with a realistic marketing-response
    scenario (2000 customers, ~13% base rate) and clean single-file KISS structure
    with no imports beyond the Chart.js global.
  - Canvas is exactly 3200x1800 landscape with no clipped or overflowing elements;
    title, subtitle, legend, and axis labels are all fully visible on both renders.
  weaknesses:
  - Model curve has a mildly jagged/stair-stepped appearance from the stride-based
    sampling (~100 points binned from 2000) — a slightly finer stride or a light tension
    smoothing pass would make the curve read more cleanly as a continuous gain curve.
  - 'Design excellence is solid but generic: no distinctive Chart.js-specific touch
    (e.g. filled area under the model curve to reinforce the ''gain'' concept, or
    a shaded region highlighting the gap versus random selection) that would elevate
    it beyond a clean default line chart.'
  - Legend point styles for 'Perfect model' and 'Random selection' render as plain
    outlined ovals since backgroundColor is unset on those datasets — a deliberate
    usePointStyle shape (e.g. line-style dash swatch) would communicate the dash-pattern
    distinction more clearly in the legend itself.
  - 'Distinctive library features are underused: only title/subtitle/legend plugin
    styling and dash patterns are exercised — no scriptable options, custom tooltip
    formatting, or other Chart.js-specific idioms that would raise Library Mastery
    beyond baseline.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "gain-curve · javascript · chartjs · anyplot.ai" in dark ink at top-center; italic subtitle below it in muted dark gray; legend row (Model, Perfect model, Random selection) beneath the subtitle with dark-ink text and oval swatches; axis titles "Population Targeted (%)" (x) and "Positive Cases Captured (%)" (y) in dark ink; tick labels in a softer dark gray. All chrome elements are clearly readable against the light background.
      Data: Model curve is solid brand green (#009E73), thick and continuous; Perfect model is a light-gray dotted line kinked at ~13%; Random selection is a black dashed diagonal. All three curves are visually distinct by both color and dash pattern.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/axis-title layout, now rendered in light/white text against the dark background; tick labels in a softer light gray. No dark-on-dark text anywhere — every label is clearly legible.
      Data: Model curve is the identical brand green (#009E73) as the light render; Perfect model line is now light-gray/white dotted; Random selection is a white dashed diagonal — chrome flipped appropriately while data color stayed fixed.
      Legibility verdict: PASS
