review:
  strengths:
  - 'First series (Model) is brand green #009E73, identical across both themes, with
    a subtle 12% area fill that gives the curve visual weight'
  - Random Selection and Perfect Model reference lines correctly use the theme-adaptive
    semantic anchors (neutral/muted) instead of spending categorical palette slots,
    and are distinguished from each other via linestyle (dashed vs dotted) rather
    than relying on hue alone
  - All chrome (title, axis labels, ticks, legend, grid) threads through window.ANYPLOT_TOKENS
    and is fully readable in both light and dark renders with no dark-on-dark or light-on-light
    failures
  - Data generation is a clean, deterministic LCG + Box-Muller approach appropriate
    for a browser environment with no seeded RNG, and correctly implements ranking
    by predicted score, cumulative capture, and the theoretical perfect-model curve
  - Title fontsize scales via the length-based formula so the long mandated title
    fits comfortably without overflow or clipping
  weaknesses:
  - The base fraud rate (~9%) is on the high end for a general transaction-fraud scenario
    (real-world card/investigation fraud rates are typically well under 2%); either
    lower the rate or reframe the population as a pre-filtered high-risk segment to
    justify it
  - The green area fill shades the full region under the Model curve down to zero
    rather than the excess over the Random Selection baseline, which would more directly
    visualize the model's 'lift' and sharpen the storytelling
  - Reference lines are drawn as regular series with dashed/dotted sx overrides rather
    than a distinctive MUI X feature; consider whether any community-only capability
    (e.g. gradient area, custom marks) could better demonstrate library mastery
  - No direct callout/annotation marks the steep early-capture region (e.g. '~70%
    of fraud in top 40%'), which would sharpen the data storytelling further (optional,
    not spec-required)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Fraud Investigation Targeting · gain-curve · javascript · muix · anyplot.ai" in dark ink, comfortably sized (~35-40% of width, no overflow); axis labels "Population Targeted (%)" and "Fraud Cases Captured (%)" in dark ink; tick labels in soft dark gray; horizontal grid lines subtle; legend (Model / Perfect Model / Random Selection) in top-right, clearly readable dark text on light swatches.
      Data: Model curve (green #009E73, solid, thick, with light green area fill) sits well above the black dashed Random Selection diagonal and below the black dotted Perfect Model curve. All three lines are clearly distinguishable via color and linestyle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels rendered in light ink (near-white); tick labels in soft light gray; grid lines subtle light-on-dark; legend text light and fully readable; no dark-on-dark text anywhere.
      Data: Model curve is the identical green #009E73 as the light render (confirmed same hue/saturation); Perfect Model and Random Selection lines flip to light gray/white tones (theme-adaptive neutral/muted anchors), preserving the same dashed/dotted distinction.
      Legibility verdict: PASS
