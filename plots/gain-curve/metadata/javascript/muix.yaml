review:
  strengths:
  - 'All three curves required or allowed by the spec are present and well told apart:
    the green model curve, the dotted perfect-model curve that reaches 100 % at the
    computed 15.5 % positive rate and stays flat, and the dashed random diagonal from
    corner to corner. Each is labelled in the legend.'
  - 'The gains curve is computed from the ranked data, one point per sample from the
    origin, and drawn with curve: ''linear'', so it never smooths or overshoots.'
  - 'Idiomatic MUI X v9 styling: [data-series=...] selectors on .MuiLineChart-line
    and .MuiLineChart-area, legend marks restyled through slotProps.legend.sx to match
    each dash pattern, and axis bands sized with height and width.'
  - Theme tokens are threaded through all chrome; both renders are fully legible and
    the data colours are identical.
  - A realistic fraud-review scenario (3000 flagged card transactions, 15.5 % confirmed
    fraud), generated deterministically from a seeded LCG.
  weaknesses:
  - 'Suggestion: the y-axis title sits about 60 px left of its tick labels; a slightly
    narrower y-axis band (width of about 76) would tie it closer to its axis.'
  - 'Suggestion: a muted text label on the dotted plateau could identify the perfect-model
    curve directly, so the legend is not needed for it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title "gain-curve · javascript · muix · anyplot.ai", soft-ink subtitle (n = 3000, positive rate 15.5 %), a horizontal legend (Model fraud score / Perfect model / Random selection), the axis titles "Population targeted (%)" and "Positive cases captured (%)", tick labels at 0 %–100 % every 10 %, a subtle grid. All readable.
      Data: the model gains curve in brand green #009E73 with a faint green area fill. It runs from the origin to the top-right corner, rises steeply, then flattens, never falls, and shows small finite-sample steps. A dotted soft-ink perfect-model curve reaches 100 % at about 15.5 % and stays flat. A dashed ink random diagonal runs from corner to corner.
      Legibility verdict: PASS

