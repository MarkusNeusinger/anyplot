review:
  strengths:
  - Correct cumulative gains chart with a properly scaled 0-100% diagonal 'Random
    Selection' baseline for comparison, exactly as the spec requires
  - Baseline reference line uses the theme-adaptive 'neutral' semantic anchor (t.ink)
    rather than a hardcoded color, so it correctly renders black-on-cream in light
    and white-on-near-black in dark, matching the Imprint style guide's semantic-anchor
    guidance for reference lines
  - Realistic fraud-detection scenario with overlapping normal distributions for fraud
    vs. legitimate risk scores, producing a believable imperfect-model gain curve
    (steep initial slope, plateaus, no artificial perfection)
  - All font sizes explicitly set (title 22px, subtitle 14px, axis titles 16px, ticks/legend
    14px) with no overlap or overflow in either theme
  - Markers correctly disabled on the dense 2000-point line series to avoid clutter,
    while the model line is visually differentiated from the dashed baseline via both
    color and dash style (redundant encoding)
  - 'Clean, deterministic, KISS-structured code: seeded mulberry32 PRNG (browser has
    no native seeded RNG) top-to-bottom Imports/Data/Chart flow, animation disabled
    on both chart and series'
  weaknesses:
  - 'Design Excellence is close to a well-configured default: no custom grid styling,
    spine treatment, or callout/annotation calling out the model''s steep early gain
    vs. the baseline — consider a subtle annotation or shaded area under the model
    curve to sharpen the storytelling'
  - Library Mastery is generic — nothing here (dashStyle, tooltip valueSuffix, axis
    config) is distinctive to Highcharts specifically; consider a Highcharts-specific
    feature such as a plotLine/plotBand marking a chosen decile threshold, or a custom
    tooltip formatter surfacing lift at that point, to showcase the library
  - No visual callout distinguishing the point where the model plateaus near 95% capture
    (~37% targeted) from the long tail to 100% — a labeled annotation or marker there
    would strengthen the model's 'diminishing returns' story
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "gain-curve · javascript · highcharts · anyplot.ai" centered at top, readable; grey subtitle beneath it readable; dark axis titles "Transactions Investigated (%)" and "Fraud Cases Captured (%)"; grey tick labels at 0/20/40/60/80/100% on both axes, all clearly legible against the light background; subtle horizontal grid lines; legend at bottom with green line swatch "Fraud Risk Model" and black dashed swatch "Random Selection", both readable.
      Data: Solid green (#009E73) step-like line rising steeply from 0% and reaching ~95% capture by ~37% targeted, then plateauing with a few step increases up to 100% near ~73-95% targeted — a realistic, non-perfect model curve. Black dashed diagonal line from (0,0) to (100,100) represents random selection, clearly distinguishable from the model curve by both color and dash style.
      Legibility verdict: PASS — no light-on-light text, all chrome elements read clearly.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light/white text, clearly legible; axis titles and tick labels rendered in light grey, clearly legible against the dark background; grid lines subtle but visible; legend rendered with light text, readable.
      Data: The model curve is the identical #009E73 green as the light render (confirmed same hue/shape/position). The baseline "Random Selection" line flips from black dashed (light theme) to white dashed (dark theme) — correct theme-adaptive behavior since it uses the semantic 'neutral' ink token rather than a fixed color.
      Legibility verdict: PASS — no dark-on-dark text; all title/axis/tick/legend elements are light-colored and clearly readable against the near-black background.
