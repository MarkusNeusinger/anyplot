review:
  strengths:
  - 'Correctly implements the cumulative gains chart concept: X-axis population targeted
    0-100%, Y-axis responders captured 0-100%, ranked descending by predicted score'
  - Diagonal random-selection baseline is present and clearly differentiated from
    the model curve via both color (inkSoft grey) and dash pattern, not relying on
    hue alone
  - Deterministic LCG-based data generation (seed 42) produces a realistic skewed-propensity
    response model with a plausible business scenario (marketing campaign response)
  - All font sizes explicitly set (14px ticks, 16px axis labels, 22px title); both
    renders remain legible even scaled down to a 400px thumbnail
  - 'First categorical series correctly uses Imprint #009E73; chrome (background,
    text, grid) is theme-correct and identical data colors across light and dark renders'
  - 'Clean, idiomatic D3 usage: scaleLinear + axisBottom/axisLeft + line generator
    + data joins, appropriate for the mount-node/harness contract'
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level: no fill/area shading
    between the model curve and baseline to visually emphasize the ''gain'' (the actual
    insight of a gain chart), no annotation calling out a key operating point (e.g.
    ''20% of population captures 58% of responders'')'
  - 'Library Mastery is generic: only uses core d3 scale/axis/line primitives that
    any charting library could replicate with similar effort — no distinctive D3-only
    technique (e.g. d3.curveMonotoneX smoothing, area-between-curves via d3.area(),
    or a custom annotation layer) to showcase what sets D3 apart'
  - Grid is y-axis-only which is good, but visual refinement stops there — no additional
    polish like a subtle area fill under the model curve or emphasis at the point
    of maximum lift over baseline
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "gain-curve · javascript · d3 · anyplot.ai" in dark bold text at top, comfortably within plot width (~55-60%). Axis labels "Population Targeted (%)" and "Responders Captured (%)" in dark ink, tick labels in a slightly softer dark grey, all clearly legible. Subtle horizontal-only gridlines at 20% intervals, unobtrusive.
      Data: Solid thick green (#009E73) curve rising steeply from 0% and flattening as it approaches 100%, clearly above a grey dashed diagonal reference line (random-selection baseline). Legend top-right lists "Model (ranked by score)" (green solid) and "Random selection (baseline)" (grey dashed), positioned in open whitespace above the curve's plateau with no overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink tones, fully readable against the dark background. Gridlines remain subtle and visible. No dark-on-dark text found anywhere (title, axis labels, ticks, legend all light-colored).
      Data: Model curve and baseline are rendered in identical colors to the light render (#009E73 green, grey dashed baseline) — confirms data colors do not shift with theme, only chrome (background/text/grid) flips as required.
      Legibility verdict: PASS
