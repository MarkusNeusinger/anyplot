review:
  strengths:
  - Correctly implements all three canonical cumulative-gains reference curves (model,
    random-targeting diagonal, perfect-model kink at the positive rate) exactly as
    the spec's Notes section describes
  - 'Deliberate semantic color use: the neutral (near-black/near-white) token for
    the random-targeting baseline and the muted token for the perfect-model reference
    line, reserving brand green #009E73 exclusively for the model curve — matches
    the style guide''s semantic-anchor guidance precisely'
  - 'Redundant encoding beyond color: distinct linestyles (dotted, dashed, solid)
    let the three series read correctly even without color, which is good CVD practice'
  - Full theme-adaptive chrome threaded through every Axis kwarg (backgroundcolor,
    title/label/tick colors, spine colors, grid color) — both renders are clean with
    no dark-on-dark or light-on-light failures
  - Realistic, neutral data scenario (credit scoring / loan default detection) with
    a plausible 12% default rate and a model whose discrimination is good but imperfect,
    giving the curve a believable shape
  - Clean KISS structure with explicit font sizes, Random.seed!(42), and no fake interactivity
  weaknesses:
  - Design Excellence is solid but conventional — the three-line composition is the
    textbook cumulative-gains layout rather than a distinctive treatment; consider
    a subtle annotation or shaded gap-area between the model and random lines to make
    the 'lift' insight even more immediately visible
  - No explicit data-storytelling callout (e.g., annotating the population % at which
    the model captures 80% of positives) — the visual hierarchy alone carries the
    story, which is good but leaves headline-number ML further points on the table
  - LM-02 (distinctive Makie features) is only lightly exercised — the implementation
    stays within generic Axis/lines!/axislegend usage that would port to any plotting
    library with minor syntax changes
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "gain-curve · julia · makie · anyplot.ai" centered at top, clearly readable. Axis labels "Population Targeted (%)" (x) and "Positives Captured (%)" (y) in dark ink, tick labels (0/50/100 on both axes) in a softer gray. Subtle horizontal gridlines at y=50 and y=100 only. Legend box bottom-right with a light elevated fill and thin border, listing "Perfect model" (dotted, muted gray), "Random targeting" (dashed, near-black), "Model" (solid, brand green). Top and right spines removed (L-shaped frame).
      Data: Three curves — a near-vertical dotted "Perfect model" line rising to 100% by ~12% population then flat; a straight dashed "Random targeting" diagonal from (0,0) to (100,100) in near-black ink; a solid brand-green ("#009E73") "Model" curve that rises steeply then levels off near 100%, sitting between the other two as expected for a good-but-imperfect classifier.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
