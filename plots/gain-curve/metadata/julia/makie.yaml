      Data: Identical three curves in the same colors and linestyles as the light render — the "Perfect model" dotted line is muted gray, "Random targeting" dashed line is now light/near-white (theme-adaptive ink), and the "Model" solid curve is the same brand green #009E73, confirming data colors are unchanged across themes.
      Legibility verdict: PASS — all text is light-colored against the dark background; no dark-on-dark failures found. Brand green remains clearly visible on the dark surface.
