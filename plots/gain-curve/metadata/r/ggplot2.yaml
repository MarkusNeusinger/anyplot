review:
  strengths:
  - 'Correct gain-curve mechanics: cumulative churners captured is computed from scores
    sorted descending, plotted against percentage of population targeted, with the
    mandatory diagonal random-selection baseline included'
  - Redundant encoding of the two series via color + linetype + linewidth (solid heavy
    green vs. dashed thinner gray) makes the chart robust to color-vision deficiency,
    not just reliant on hue
  - Realistic, neutral churn-prevention scenario (n=2000, 18% churn rate, noisy but
    informative model score) with a visibly imperfect model curve rather than an unrealistically
    perfect one
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, ink text
    flips correctly, and the brand green data color is identical across light and
    dark'
  - 'Clean, idiomatic ggplot2 code: single data frame with a grouping column, scale_*_manual
    for all three aesthetics, theme_minimal + explicit theme() overrides, no functions/classes,
    reproducible via set.seed(42)'
  weaknesses:
  - Title ('Customer Churn Model · gain-curve · r · ggplot2 · anyplot.ai') spans roughly
    90%+ of the canvas width in both renders, leaving very tight margins on the right
    edge — not clipped, but consider trimming the descriptive prefix or dropping plot.title
    size from 12pt to ~10-11pt for more breathing room
  - The 'Random targeting' baseline/reference line uses INK_MUTED (the 'other/rest/disabled'
    semantic token) instead of ANYPLOT_NEUTRAL/INK, which the style guide reserves
    specifically for baseline/reference-line roles
  - 'Design execution is competent but generic: beyond the redundant color/linetype/linewidth
    encoding, there is no additional visual-hierarchy device (e.g. a subtle annotation
    marking the crossover gap, or shading the area between the two curves to emphasize
    lift) that would elevate this from solid to distinctive'
  - Grid lines (panel.grid.major) render fairly dark/prominent against the warm background
    rather than a subtle presence, slightly competing with the data line for attention
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white.
      Chrome: Title "Customer Churn Model · gain-curve · r · ggplot2 · anyplot.ai" in dark ink across the top (very wide but not clipped); x-axis "Percentage of Customers Targeted" and y-axis "Percentage of Churners Captured" in dark ink, both clearly legible; tick labels (0%/25%/50%/75%/100%) in a softer gray-brown, legible; major gridlines at the quartile marks in dark ink, fairly bold but not overwhelming; legend box ("Churn model" / "Random targeting") sits inside the plot at bottom-right on a light elevated panel, fully readable.
      Data: Solid heavy green (#009E73) "Churn model" curve rising steeply from 0% and plateauing near 100% by ~x=85%; dashed thinner gray "Random targeting" diagonal from (0,0) to (100,100). Curve clearly above the diagonal throughout, showing model lift.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white, fully legible against the dark background; gridlines rendered in a light tone at the same positions, visible but not dominant; legend box uses a dark elevated panel with light text, fully readable.
      Data: Identical green (#009E73) churn-model curve and gray dashed baseline as the light render — data colors unchanged between themes, confirming only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly visible against the near-black surface, and the brand green remains vivid on the dark background.
