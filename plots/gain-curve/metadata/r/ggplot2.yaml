review:
  strengths:
  - 'Correct plot type and mechanics: cumulative gains line ranked by descending model
    score, plus a proper 0-100/0-100 diagonal random-targeting baseline for comparison'
  - 'Realistic, neutral data story: churn scenario with a noisy-but-informative score
    (true_risk + noise) produces a smooth, plausible gains curve rather than an unrealistically
    perfect one'
  - 'Correct Imprint palette usage: first series is #009E73 (brand green) for the
    model curve, neutral ink gray dashed line for the random baseline'
  - 'Theme-adaptive chrome works correctly in both renders: page background, ink,
    and grid colors flip appropriately while the green/gray data colors stay identical
    between light and dark'
  - Canvas dimensions are correct (3200x1800 landscape, canvas gate passed)
  weaknesses:
  - 'AR-09 (auto-reject): the rightmost x-axis tick label ''100%'' is clipped at the
    right canvas edge in BOTH plot-light.png and plot-dark.png — the ''%'' character
    is fully cut off (renders as ''100''), confirmed by cropping the bottom-right
    corner of both PNGs at 3x zoom. Root cause: scale_x_continuous(limits = c(0, 100),
    expand = c(0, 0)) pins the panel exactly to x=100 with zero expansion, leaving
    the centered ''100%'' label no room inside the canvas before the hard edge. Fix:
    add a small amount of right-side expansion, e.g. scale_x_continuous(limits = c(0,
    100), expand = expansion(mult = c(0, 0.02)), labels = scales::label_number(suffix
    = ''%'')), or increase plot.margin on the right — while keeping the curve visually
    reaching the panel edge.'
  - Major gridlines render fairly bold/dark for a 'subtle' grid despite alpha = 0.15
    on GRID_COLOR — worth a lighter alpha or thinner linewidth so the grid recedes
    further behind the data lines.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct light-theme surface, not pure white.
      Chrome: Title "Customer Churn Model · gain-curve · r · ggplot2 · anyplot.ai" in dark ink at top-left, fully visible and not clipped. Axis titles "Percentage of Customers Targeted" (x) and "Percentage of Churners Captured" (y) in dark ink, readable. Tick labels ("0%".."100%" on both axes) in soft gray ink. Major gridlines at 25/50/75/100 in a fairly bold dark line (alpha=0.15 applied to a near-black ink but still fairly prominent visually). Legend box (elevated off-white background) sits inside the plot at bottom-right with "Churn model" (green solid) and "Random targeting" (gray dashed) labels, clearly readable, no overlap with the data curve.
      Data: Green (#009E73) solid line for "Churn model" rising steeply from 0% and flattening near 100% well above the diagonal; gray dashed line for "Random targeting" baseline running straight from (0,0) to (100,100). Colors and shapes match spec expectations for a gains chart.
      Legibility verdict: FAIL — the rightmost x-axis tick label "100%" is clipped at the canvas edge, showing only "100" with the percent sign missing (verified via a 3x-zoomed crop of the bottom-right corner). Everything else (title, y-axis labels, legend, other x-axis labels) is fully legible.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct dark-theme surface, not pure black.
      Chrome: Title and axis titles in light ink (near-white), clearly readable against the dark background. Tick labels in a lighter soft gray, readable. Gridlines flip to a light color on dark, still fairly prominent but consistent with the light render's grid weight. Legend box uses a dark elevated background with light text — readable, no dark-on-dark issues found.
      Data: Same green (#009E73) solid "Churn model" curve and gray dashed "Random targeting" baseline as the light render — colors are identical between themes, only chrome flipped, as required.
      Legibility verdict: FAIL — same AR-09 issue as the light render: the rightmost x-axis tick label "100%" loses its "%" character at the canvas edge (confirmed via the same crop-and-zoom check). No dark-on-dark or light-on-light text issues otherwise.
