review:
  strengths:
  - 'Cumulative-gains math is correctly implemented: samples ranked by descending
    model_score, cumulative churner count divided by total churners, producing a textbook
    gain-curve shape.'
  - Baseline 'Random targeting' line correctly uses the theme-adaptive neutral anchor
    (ANYPLOT_NEUTRAL = INK) rather than a categorical palette slot — exactly the semantic-anchor
    use case (reference/baseline line) described in the style guide.
  - Redundant encoding via linetype (solid vs dashed) and linewidth alongside color
    makes the two series distinguishable even without color vision.
  - Both renders correctly use warm off-white (#FAF8F1) / warm near-black (#1A1A17)
    plot backgrounds with identical data colors between themes — only chrome flips.
  - Title, axis labels (with units), and legend content all match the mandated conventions
    and the spec's required diagonal reference line.
  weaknesses:
  - Line widths (Churn model = 1.8, Random targeting = 1.0) are thinner than the style
    guide's recommended 2.5-3.5 for a 1-3 series line chart — increase geom_line linewidth
    so the curves stay prominent when scaled down to mobile widths.
  - Grid line opacity (scales::alpha(INK, 0.05)) is well below the style guide's recommended
    10-15% range, making the gridlines almost invisible in both renders — raise to
    roughly 0.12-0.15 so they remain a subtle but present reference.
  - No visual emphasis (e.g. shaded gap between the model curve and baseline) highlights
    the model's discrimination advantage — a light fill or callout would strengthen
    data storytelling.
  - The spec's 'perfect model' reference (vertical rise to the positive rate, then
    horizontal) is omitted — optional per the spec notes, but including it as a third
    light dotted line would make the comparison more complete.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Churn Model · gain-curve · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly readable. Axis titles "Percentage of Customers Targeted" (x) and "Percentage of Churners Captured" (y) in dark ink, tick labels ("0%"..."100%") in a softer gray-ink, all legible. Grid lines are extremely faint vertical guides at 25/50/75/100% — present but very subtle. Legend box (light elevated fill, no border) sits in the lower-right, away from the data lines.
      Data: First series "Churn model" is solid brand green (#009E73), rising steeply then leveling near 100%. Second series "Random targeting" is a black dashed diagonal from (0,0) to (100,100).
      Legibility verdict: PASS — no light-on-light or illegible text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis titles now in light ink (near-white), tick labels in a lighter soft-gray, both clearly readable against the dark surface. Grid lines remain faint but present. Legend box uses the dark elevated fill with light text, positioned identically in the lower-right, no overlap with the curve.
      Data: "Churn model" series is the same brand green (#009E73) as in the light render — confirmed identical hue. "Random targeting" baseline flips to a white/light dashed line (theme-adaptive neutral anchor), correctly inverting for contrast against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all text and both lines are clearly distinguishable from the background.
