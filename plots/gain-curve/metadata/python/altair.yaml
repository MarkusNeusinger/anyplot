    silently shrinking every text size, where the altair prompt requires failing loudly
    → replace the resize branch with raise SystemExit(...) and keep only the pad step.
    Likely cause: the canvas block written as resize-then-pad instead of the prompt''s
    pad-only template.'
  - 'Suggestion: shading only the band between the model curve and the diagonal would
    make the gain over random selection the visual focus instead of the whole area
    under the curve.'
