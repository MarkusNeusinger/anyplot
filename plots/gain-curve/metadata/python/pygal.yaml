review:
  strengths:
  - 'Clear visual hierarchy through line style: heavy solid green model, long-dash
    perfect model, dotted muted random baseline'
  - Perfect-model knee computed from the data's positive rate (~30%), not hard-coded
  - Theme tokens threaded through pygal Style; both renders legible with identical
    data colors
  - Per-series stroke_style with dasharray and round linecaps — native pygal idiom
  - Interactive HTML output with native pygal tooltips
  weaknesses:
  - 'VQ-01 (both): the y-axis major tick labels 0, 50 and 100 render visibly smaller
    than the other y ticks (44 vs 56 px), an inverted hierarchy → render all ticks
    at one size (+12 px for majors, or lower label_font_size to match). Likely cause:
    major_label_font_size=44 below label_font_size=56 in Style.'
  - 'DQ-02 (both): the legend entry ''Model'' and the axis title ''Positive cases
    captured (%)'' name no domain, so the scenario reads as a generic classifier →
    name the scenario, e.g. ''Response model'' and ''Responders captured (%)''. Likely
    cause: generic Y_TRUE/series labels.'
  - 'Suggestion: placing all three legend entries on one row would avoid the lone
    ''Random selection'' on a second line.'
