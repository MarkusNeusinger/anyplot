review:
  strengths:
  - Perfect-model curve computed from the data's positive class rate, flat at 100%
    after the knee
  - All three curves readable in both themes with theme tokens on the chrome
  - Reproducible customer response data with a plausible positive rate
  weaknesses:
  - 'AR-09 (both): the right-most x tick label ''105'' is chopped at the right canvas
    edge and reads ''10'' → ticks end at 100 inside the canvas. Likely cause: scale_x_continuous(limits=[0,
    100]) with the default expansion adds a 105 break at the edge.'
  - 'VQ-05 (both): canvas is 4800x2700, not the canonical 3200x1800 → ggsize(800,
    450) with scale=4. Likely cause: ggsize(1600, 900) with scale=3.'
  - 'SC-02 (both): the model curve is spline-smoothed instead of drawn through its
    computed points, violating the spec''s ''not smoothed'' property → plot the cumulative
    gains directly. Likely cause: make_interp_spline(population_pct, gains, k=3).'
  - 'SC-03 (both): axes padded to -5..105 with -5 and 105 ticks outside the 0-100%
    domain, and the smoothed curve shows values between points the data does not have
    → limits 0-100 with expand=[0, 0]. Likely cause: default scale expansion and the
    spline.'
  - 'SC-04 (both): title ''gain-curve · letsplot · anyplot.ai'' omits the language
    → ''gain-curve · python · letsplot · anyplot.ai''. Likely cause: the labs(title=...)
    string.'
  - 'VQ-07 (both): random baseline drawn in hardcoded #888888 instead of a theme token
    → INK_SOFT. Likely cause: colors[''Random''] = ''#888888''.'
  - 'CQ-03 (code): ''from lets_plot import *'' plus a second explicit import of element_blank,
    element_line, element_rect, element_text, theme → one explicit import list. Likely
    cause: lines 11-12.'
  - 'CQ-04 (code): the scipy spline block (make_interp_spline, linspace, clip) adds
    code whose only effect is the smoothing the spec forbids → delete it and plot
    gains directly. Likely cause: lines 49-53.'
  - 'Suggestion: a linetype per curve role would separate the references from the
    model beyond color.'
