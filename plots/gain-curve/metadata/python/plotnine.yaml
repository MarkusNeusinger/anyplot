review:
  strengths:
  - Gains computed directly from ranked labels with an explicit origin point, so the
    step curve starts at (0, 0) and ends at (100, 100) unsmoothed
  - Perfect-model bound reaches 100 % exactly at the computed default rate and is
    named in the legend
  - Theme tokens threaded through every chrome element; both renders read cleanly
  - scale_color_manual with limits taken from the data keeps the Model/Random/Perfect
    legend in data order
  weaknesses:
  - 'VQ-02 (both): the red Perfect line is drawn over the model curve''s first segment
    (0 to ~1.5 % targeted) and over its flat run at 100 % from ~64 % to 100 %, so
    the model''s start at the origin and its end at the top-right corner cannot be
    seen → draw the Model curve last so it sits on top of the reference lines. Likely
    cause: one geom_line over concatenated groups draws Perfect (the last group) above
    Model.'
  - 'VQ-07 (both): the Perfect curve is drawn in #AE3030, the red anchor reserved
    for bad/loss roles, although a perfect model is not a loss → the next canonical
    Imprint position #C475FD (or the neutral anchor for a reference). Likely cause:
    palette = [IMPRINT_PALETTE[0], INK_MUTED, IMPRINT_PALETTE[4]].'
  - 'DE-02 (both): all four spines are drawn by a panel_border box where a gains chart
    needs none → keep only left and bottom (axis_line) and drop the border. Likely
    cause: panel_border=element_rect(color=INK_SOFT, ...).'
  - 'Suggestion: a direct label at the model curve''s knee (e.g. share of defaults
    captured at 20 % targeted) would give the chart a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct
