      Data: green #009E73 step-wise model curve rising steeply to ~88 % at 20 % targeted, reaching 100 % near 64 %; grey muted diagonal baseline; red #AE3030 perfect line rising to 100 % at ~5.6 % then flat, drawn over the model's start and top run
