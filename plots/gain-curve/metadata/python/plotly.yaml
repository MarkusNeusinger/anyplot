review:
  strengths:
  - Gains curve computed in a few vectorised numpy lines and drawn through every computed
    point with no smoothing; perfect-model kink derived from the data's own positive
    rate
  - 'Clear hierarchy: heavy brand-green model curve with a translucent area fill against
    thin dashed baseline and dotted perfect-model references'
  - Per-trace hovertemplates give population/positives readouts in the HTML view
  - Theme tokens threaded through every chrome element; both renders fully legible
  weaknesses:
  - 'VQ-07 (both): the random baseline is drawn in the custom hex #888888, outside
    the Imprint palette and its anchors, and the perfect-model line takes position
    3 #4467A3 as the second series → baseline in the theme-adaptive neutral/muted
    anchor (#6B6A63 light / #A8A79F dark), perfect model in position 2 #C475FD (or
    keep a palette member in canonical order). Likely cause: BASELINE = "#888888"
    and IMPRINT_PALETTE[2] in the perfect-model trace.'
  - 'DQ-02 (both): the render never names its scenario — the legend reads only ''Model''
    and the column constants are ''Actual outcome (0 or 1)'' / ''Predicted probability'',
    so the chart reads as a generic model → name the domain in the legend entry (e.g.
    ''Campaign response model''). Likely cause: name="Model" and the generic column
    labels.'
  - 'Suggestion: a direct label at the kink of the perfect-model line (the positive
    rate) would let readers see the class rate without hovering.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: centered title 'gain-curve · python · plotly · anyplot.ai' in dark ink; axis titles 'Percentage of population targeted (%)' and 'Percentage of positives captured (%)' in dark ink; ticks 0-100 every 20 in soft gray; subtle grid; framed legend lower right on the elevated surface. All readable.
      Data: brand-green #009E73 model gains curve (thick, stepped from the finite sample) with a 15 % green area fill, gray dashed random diagonal corner to corner, blue #4467A3 dotted perfect-model line rising to 100 % at about 20 % and flat after. Model rises steeply, coincides with the perfect line to about 35 %, flattens, and reaches 100 % near 71 %.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink, ticks in light soft gray, subtle light grid, legend on #242420 with light border. No dark-on-dark text.
      Data: identical colors to the light render (green model, gray dashed baseline, blue dotted perfect line); the fill reads as a dark green tint.
      Legibility verdict: PASS
