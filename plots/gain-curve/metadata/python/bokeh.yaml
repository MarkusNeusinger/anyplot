review:
  strengths:
  - Exact 3200x1800 canvas with toolbar_location=None and min_border reservations,
    so the title, both axis titles and every tick label sit fully inside the frame
    in both renders
  - Gain curve computed directly from the ranked tidy df (sort by score, cumsum of
    responders) with the origin point prepended; it starts at (0,0), ends at (100,100),
    never falls and is drawn as raw steps, not smoothed
  - Perfect-model reference reaches 100 % at the computed positive rate (15 %) and
    stays flat, and is named 'Perfect Model' in the legend so it cannot be mistaken
    for the model
  - 'Clear line hierarchy: the model curve in Imprint green at width 8, the random
    baseline as a dashed INK_SOFT diagonal and the perfect model dotted in Imprint
    blue, all visible in both themes'
  - Theme tokens threaded through title, axis titles, ticks, grid, outline and an
    ELEVATED_BG legend frame; data colors identical between light and dark
  - One HoverTool per renderer with formatted population/captured tooltips for the
    HTML view; all three lines driven by ColumnDataSource built from DataFrames
  weaknesses:
  - 'Suggestion: the dotted Imprint-blue perfect-model line reads faint on the dark
    background; a slightly wider dash pattern would give it more presence without
    competing with the model curve.'
  - 'Suggestion: an annotation of the capture at a chosen targeting depth (for example
    20 % of the population) could anchor the story; the spec does not ask for it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the full 3200x1800 canvas, with a thin INK_SOFT plot outline.
      Chrome: bold title "gain-curve · python · bokeh · anyplot.ai" top-left (~40 % of width), italic axis titles "Percentage of Population Targeted (%)" and "Percentage of Positive Cases Captured (%)", tick labels 0-100 on both axes in dark gray; subtle grid; legend bottom-right in an elevated frame. All text dark and readable.
      Data: the model gain curve in #009E73 (thick, solid) rises steeply from the origin to ~94 % at 25 % of the population, then flattens in small steps to 100 % at ~68 %; a dashed gray diagonal for the random baseline runs corner to corner; a dotted #4467A3 perfect-model line goes to 100 % at 15 % and stays flat.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick labels light gray, grid subtle, legend frame #242420 with light text. No dark-on-dark text.
      Data: identical colors to the light render (green model curve, blue dotted perfect line, the baseline flips to the light INK_SOFT gray as a chrome-like reference). Brand green clearly visible; the dotted blue line is the faintest element but still visible.
      Legibility verdict: PASS
