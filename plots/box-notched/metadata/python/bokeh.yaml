review:
  strengths:
  - Title now uses the mandated four-segment format "box-notched · python · bokeh
    · anyplot.ai", fixing the attempt-1 gap.
  - Outline fixed to the L-shaped spine convention (outline_line_color=None, bottom/left
    axis lines only) instead of the previous full rectangular frame.
  - New HoverTool with a formatted tooltip (Department, n, Q1, Median, Q3, Mean) driven
    by an invisible whisker-to-whisker hover-target quad — turns the HTML export into
    a genuinely useful interactive detail view and directly answers the prior Library
    Mastery gap.
  - Correct notch computation (±1.57 × IQR / √n) and all standard box-plot elements
    (median, quartiles, 1.5×IQR whiskers, outliers) present and correctly rendered
    in both themes.
  - 'Distinctive design choices: box width scaled by √n signals notch reliability,
    a hollow mean-diamond next to the median notch adds a mean-vs-median comparison,
    and ranking categories by median turns the chart into a leaderboard.'
  - 'Theme-adaptive chrome correctly threaded through both renders — Imprint palette
    data colors are identical between light/dark, only chrome flips; first-ranked
    category (Marketing) is #009E73.'
  weaknesses:
  - The _width_for_n helper function is a minor structural break from the flat-script
    KISS convention (still a single small pure function, non-blocking).
  - DE-01 aesthetic sophistication is strong but not maximal — typography and accent
    choices remain fairly standard beyond the notch/diamond/ranking touches already
    present.
