review:
  strengths:
  - Correct notch computation (±1.57 × IQR / √n) and all standard box-plot elements
    (median, quartiles, 1.5×IQR whiskers, outliers) present and correctly rendered
    in both themes.
  - 'Distinctive design choices: box width scaled by √n signals notch reliability,
    a hollow mean-diamond next to the median notch adds a mean-vs-median comparison,
    and ranking categories by median turns the chart into a leaderboard.'
  - Theme-adaptive chrome correctly threaded through both renders — Imprint palette
    data colors are identical between light/dark, only chrome (background, text, grid)
    flips.
  - Clean HTML+PNG output pipeline; ColumnDataSource used for outliers; categorical
    x_range used correctly with descriptive per-category labels (name + n).
  weaknesses:
  - Title omits the language segment — reads 'box-notched · bokeh · anyplot.ai' instead
    of the mandated 'box-notched · python · bokeh · anyplot.ai'.
  - p.outline_line_color draws a full rectangular frame around the plot rather than
    following the L-shaped spine convention (remove top/right) from the style guide,
    slightly reducing visual refinement.
  - No distinctive interactive bokeh features (e.g. HoverTool) used beyond static
    geometric primitives — a missed opportunity for Library Mastery given bokeh's
    interactive strengths.
  - The _width_for_n helper function, while small and well-justified, is a minor structural
    break from the flat-script KISS convention.
