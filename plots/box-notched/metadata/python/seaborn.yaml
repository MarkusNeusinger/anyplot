review:
  strengths:
  - 'Fixed the prior review''s DQ-03 violation: all Test Score values are now bounded
    to [0, 100] via np.clip(..., 0, 100) on every cohort''s generating distribution,
    eliminating the previously-observed >100% values.'
  - Correct notched box plot via seaborn's native sns.boxplot(notch=True), matching
    the spec's median ± 1.57×IQR/√n notch-depth requirement exactly.
  - Mean diamond markers (showmeans=True) placed alongside the notched median create
    a genuine skew-detection storytelling layer beyond a bare boxplot.
  - 'Imprint palette applied in canonical order (green → lavender → blue → ochre)
    with the first series correctly at #009E73; both renders are theme-correct (#FAF8F1
    light / #1A1A17 dark backgrounds), with data colors identical across themes.'
  - 'Clean KISS code structure: explicit font sizing throughout (12pt title, 10pt
    axis labels, 8pt ticks), reproducible via np.random.seed(42), current 0.14+ hue+palette+legend=False
    API.'
  weaknesses:
  - Cohort B's deliberately-added 'outlier' values (95, 96, 98) no longer render as
    individual flier points post-clipping — they now fall inside the whisker range,
    so the code comment describing them as outliers is slightly stale. Not a scoring
    problem (Cohorts A and D still show clear outliers), but worth trimming the comment
    or nudging those values higher for accuracy.
  - 'Design Excellence still stops short of an explicit callout: the non-overlapping
    notches between Cohort A and Cohort D (the clearest statistically-significant
    median gap) are visible but not annotated — a small ax.annotate() pointing this
    out would sharpen the data storytelling further (optional, not required for approval).'
  - 'Library Mastery is solid but generic-adjacent: the fine-grained meanprops/flierprops/whiskerprops
    customization is good, but a more distinctive seaborn-only feature (e.g. bootstrapped
    CI via bootstrap= for notch calculation, or combining with a stripplot overlay)
    would push LM-02 higher.'
