      Data: Four notched boxes (Cohort A–D) in Imprint palette order — green (#009E73), lavender, blue, ochre. Each box shows a pinched notch around the median, a white diamond mean marker with dark edge, whiskers with caps, and grey circular outlier points where present (a low outlier below the box for Cohort A, one near the bottom for Cohort D). All values now sit within [0, 100] — no box, whisker, or outlier point crosses the 100% ceiling, confirming the np.clip fix landed. First series (Cohort A) confirmed green #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlaps, no clipping at the canvas edges.

