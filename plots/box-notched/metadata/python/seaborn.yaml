review:
  strengths:
  - Correct notched box plot implementation using seaborn's native notch=True (standard
    median ± 1.57×IQR/√n calculation), matching the spec's notch-depth requirement
    exactly.
  - Mean diamond markers (showmeans=True) placed alongside the notched median create
    a meaningful skew-detection layer — a thoughtful design addition beyond a bare
    boxplot.
  - 'Imprint palette applied in canonical order (green → purple → blue → ochre) with
    the first series correctly at #009E73; both renders are pixel-verified theme-correct
    (#FAF8F1 light / #1A1A17 dark backgrounds).'
  - 'Clean KISS code structure: explicit font sizing throughout, reproducible via
    np.random.seed(42), no deprecated APIs (uses the 0.14+ hue+palette+legend=False
    pattern).'
  weaknesses:
  - Test Score data for Cohort B and Cohort C exceeds 100% (observed max ~127.8%,
    with 2 points in Cohort B and 4 points in Cohort C above 100%), which is factually
    impossible for a metric labeled 'Test Score (%)'. Bound the generating distribution
    — e.g. np.clip(values, 0, 100) or a Beta distribution scaled to [0, 100] — so
    no value can exceed the percentage ceiling.
  - 'Design Excellence is solid (mean-vs-median markers, Imprint palette, clean spines)
    but stops short of publication-ready: an explicit callout or annotation highlighting
    the non-overlapping notches between Cohort A and Cohort D (the clearest statistically-significant
    median difference) would sharpen the data storytelling.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1, pixel-verified), not pure white.
      Chrome: Title "box-notched · python · seaborn · anyplot.ai" in dark ink, centered, ~45% of plot width — clearly readable. X-axis label "Student Cohort" and Y-axis label "Test Score (%)" both dark ink, similarly sized (10pt). Tick labels in soft grey-brown, 8pt, evenly readable. Subtle horizontal gridlines at ~15% alpha, y-axis only. No legend (correctly omitted — categories are already distinguished by the x-axis and color).
      Data: Four notched boxes (Cohort A-D) in Imprint palette order — green (#009E73), lavender, blue, ochre. Each box shows a pinched notch around the median, a white diamond mean marker, whiskers, and grey circular outlier points (visible above/below whiskers, e.g. a high outlier above 120 for Cohort C and one near 60 for Cohort A). First series (Cohort A) confirmed green #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17, pixel-verified), not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/grey tones, fully legible against the dark background. Gridlines subtle and visible. No dark-on-dark text found anywhere — title, axis labels, and ticks all flip correctly to light tones.
      Data: Box colors are pixel-identical to the light render (green/lavender/blue/ochre unchanged) — only the chrome (background, text, grid) flipped, as required. Mean diamond markers and outlier points remain visible with light-toned edges against the dark surface.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
