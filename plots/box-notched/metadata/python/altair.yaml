review:
  strengths:
  - Notched box geometry (lower box, notch waist, upper box) is correctly hand-assembled
    via layered mark_bar segments since Altair lacks a native notch primitive, with
    the ±1.57×IQR/√n formula matching the spec exactly
  - Mean diamond marker gives a second, clearly distinct central-tendency signal beside
    the median notch, and is legible in both themes (INK-colored, PAGE_BG stroke)
  - Categories are sorted by descending median rather than alphabetically, which turns
    the chart into a ranking story and makes the non-overlapping-notch comparison
    read left-to-right
  - Genuine Altair-native interactivity via alt.selection_point(on='mouseover') driving
    per-department opacity and rich tooltips (Q1/median/Q3/mean/notch bounds/n) in
    the HTML export, without faking anything in the static PNG
  - Sample-size (n=) annotations placed in the near-zero whitespace under every box
    add useful statistical context (notch reliability depends on n) without cluttering
    the chart
  - 'Both renders are clean: correct Imprint palette in canonical order (Engineering=#009E73),
    theme-correct backgrounds/chrome, no clipping, well-balanced canvas'
  weaknesses:
  - Sample-size annotation text (fontSize=9) is noticeably smaller than the rest of
    the chrome (axis ticks at 10, axis titles at 12) — bump to ~10-11pt so it doesn't
    get lost, especially at the 400px thumbnail size
  - The subtitle renders in Vega-Lite's default serif font while the title is bold
    sans-serif — a minor typographic inconsistency; setting an explicit subtitleFont
    to match the title's family would tighten the polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface — not pure white.
      Chrome: Title "box-notched · python · altair · anyplot.ai" in bold dark ink at top-center, italic serif subtitle "Non-overlapping notches ⇒ medians differ significantly (95% CI) · ◆ = mean" beneath it. X-axis "Department" and Y-axis "Performance Score" titles are dark and bold; tick labels are soft dark gray. Horizontal gridlines are faint and unobtrusive. All chrome is clearly legible against the light background.
      Data: Four notched boxes (Engineering, Sales, Marketing, Operations, ordered by descending median) in Imprint palette order — Engineering=#009E73 (green), Sales=#4467A3 (blue), Marketing=#C475FD (purple), Operations=#BD8233 (amber). Each box shows a visible notch waist around the median, whisker caps, a black mean diamond, an outlier dot, and a small "n = NN" label beneath. First categorical series is confirmed as #009E73.
      Legibility verdict: PASS — no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface — not pure black.
      Chrome: Same title/subtitle text now rendered in light ink (near-white) and soft light gray, both clearly readable against the dark background. Axis titles are bold near-white, tick labels are light gray. Gridlines are faint white at low opacity, still visible without dominating.
      Data: Same four boxes with identical Imprint palette colors as the light render (Engineering green, Sales blue, Marketing purple, Operations amber) — confirms data colors are theme-invariant. The mean diamond flips to a light/white fill (INK token) so it stays visible against the dark background instead of disappearing. Whisker rules/caps use the light INK_SOFT token, clearly distinguishable from the near-black background.
      Legibility verdict: PASS — no dark-on-dark text; the mean marker and whisker strokes were correctly re-tokenized for the dark surface, avoiding the common dark-on-dark failure mode.
