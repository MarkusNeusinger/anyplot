review:
  strengths:
  - Correctly builds a true notched box plot from primitive marks (whisker rule +
    tick caps + tiered bars) since Altair's mark_boxplot has no native notch support
    — the notch waist is a real width taper (size=48 -> size=26), not a decorative
    overlay, and the notch geometry (±1.57 × IQR / √n) matches the spec formula exactly.
  - Median is rendered as a PAGE_BG-colored tick that punches a clean gap through
    the notch waist, which reads correctly as the pinch point in both themes without
    needing a separate mark.
  - Categorical data colors (Imprint palette, keyed to department name) are pixel-identical
    between plot-light.png and plot-dark.png; only chrome (background, grid, text)
    flips — verified by direct crop comparison of the Engineering box.
  - Canvas gate passes cleanly (3200x1800, no clipping) and the PAD-only-to-target
    pattern from prompts/library/altair.md is followed exactly, including the raise-on-overshoot
    guard.
  - 'Deliberate storytelling choice: departments are sorted by descending median (not
    alphabetically) and a subtitle explains the notch-overlap interpretation rule,
    which directly supports the spec''s ''quick visual hypothesis testing'' use case.'
  - 'All required statistical elements are present and correctly computed: Q1/median/Q3,
    1.5xIQR whiskers, individual outlier points beyond the whiskers, and per-category
    color coding.'
  weaknesses:
  - Aesthetic treatment stays close to library defaults beyond the palette and stroke
    separators — no additional refinements like a mean marker, sample-size annotation
    on-canvas, or custom legend/callout to further separate this from a baseline box
    plot (DE-01).
  - Marketing's outlier at ~98 sits very close to its own whisker cap and the notch
    box top edge — still individually distinguishable in both renders, but tightest
    visual margin on the chart; worth an eye in future revisions if data changes (VQ-02
    borderline, no deduction applied since no actual overlap).
  - One Marketing outlier (~35) is a low-value tail rather than a high-anomaly one,
    and the Sales outlier at 111 pushes 'Performance Score' past a natural 0-100 ceiling
    — plausible for an uncapped KPI index but slightly unusual for a 'performance
    score' label without a stated scale (DQ-03).
  - Library mastery leans on general layer-composition rather than any Altair-distinctive
    interaction (e.g. selection-based highlighting, interactive legend) beyond static
    tooltips — acceptable given the manual-notch requirement, but leaves LM-02 headroom
    unused.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white, not dark.
      Chrome: Title "box-notched · python · altair · anyplot.ai" in bold dark ink, centered, fully visible with margin above/below. Subtitle "Non-overlapping notches ⇒ medians differ significantly (95% CI)" in softer gray directly beneath. Y-axis title "Performance Score" and x-axis title "Department" both bold and dark. Tick labels (department names, y-axis numbers 0-120) in soft gray, all legible. Only horizontal (y-axis) gridlines are drawn, subtle opacity, not competing with data.
      Data: Four notched boxes for Engineering (green #009E73), Sales (blue #4467A3), Marketing (purple #C475FD), Operations (orange #BD8233), ordered left-to-right by descending median. Each box clearly shows a pinched "waist" at the median via a narrower inner bar with a thin background-colored gap marking the exact median position — this is a genuine geometric notch, confirmed via pixel-level crop, not a flat color band. Whiskers are dark gray rules with T-shaped caps; outliers are individually plotted dots in the matching department color, all outside the whisker range and clear of the canvas edges.
      Legibility verdict: PASS — all text reads cleanly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black, not light.
      Chrome: Title and axis titles render in light off-white ink, subtitle and tick labels in a lighter soft gray — all clearly legible against the dark background. Gridlines remain subtle (light-tinted, low opacity) and don't dominate. No dark-on-dark text anywhere; checked tick labels, axis titles, and title/subtitle individually.
      Data: Confirmed via direct pixel crop of the Engineering box that the green fill (#009E73) is identical between light and dark renders — only the whisker/cap gray (INK_SOFT) and the median gap color (PAGE_BG) adapt to the theme, which is the correct, spec-compliant behavior. All four department colors are unchanged from the light render (blue, purple, orange also match). Notch waist and median gap are equally visible on the dark background.
      Legibility verdict: PASS — no readability issues in either theme.
