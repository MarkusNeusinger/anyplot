review:
  strengths:
  - Manual notch geometry uses the exact spec formula (median +/- 1.57*IQR/sqrt(n)),
    clamped to Q1/Q3, since lets-plot's geom_boxplot(notch=...) is silently ignored
    by the rendering backend -- a real, documented workaround rather than a fake feature
  - 'Strong statistical storytelling: Engineering and Finance notches visibly overlap
    (medians not significantly different) while other pairs are clearly separated,
    directly illustrating the spec''s ''quick visual hypothesis testing'' purpose'
  - 'Complete five-number-summary rendering: jittered raw points for distribution
    shape, whiskers at 1.5*IQR, and distinct solid outlier markers beyond the fences,
    layered under/over the notch polygons'
  - Perfect Imprint palette compliance in canonical order (green, lavender, blue,
    ochre, red) across both themes with fully theme-adaptive chrome (background, title,
    axis text, grid)
  - 'Realistic, varied department-salary data: different spreads per department, commission-driven
    Sales outliers on both ends, tight Operations distribution -- good feature coverage
    for a notched boxplot'
  weaknesses:
  - 'Design Excellence is solid but not exceptional: relies on theme_minimal() plus
    the mandated Imprint palette without much further typographic or layout distinction;
    panel_grid_major_y uses a full INK-colored line at size=0.3 rather than a reduced-alpha
    rgba per the style guide''s 10-15% grid-opacity guidance -- soften the grid further
    for a more polished look'
  - 'Library Mastery is moderate: because geom_boxplot(notch=...) isn''t rendered,
    the box/notch/whisker/outlier layers are built manually from geom_polygon/geom_segment/geom_point
    instead of the library''s higher-level boxplot API; consider leaning into lets-plot''s
    actual strength (native interactivity) by adding tooltips on the polygon/point
    layers that surface the exact Q1/median/Q3/notch-CI values in the HTML output
    -- that would make the interactive advantage over static libraries more distinctive'
  - The polygon fill (alpha=0.85) sits directly against the jittered raw points and
    whisker segments with no edge highlighting; a subtle ink-colored stroke on the
    notch polygons (per the style guide's 'Data Element Styling' edge-highlighting
    guidance) would sharpen the boundary where jittered points cross behind the box
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "box-notched · python · letsplot · anyplot.ai" is centered, dark ink text, fully visible with margin above and below (not clipped). Y-axis title "Annual Salary (USD)" and x-axis title "Department" are dark ink and clearly readable. Tick labels (150,000 down to 30,000 on Y; Engineering/Marketing/Sales/Finance/Operations on X) are a slightly lighter dark gray, all fully legible with no clipping at the left or bottom edges. Horizontal Y-axis gridlines are thin and subtle, not competing with the data.
      Data: Five notched box-and-whisker plots in Imprint canonical order -- Engineering (#009E73 green), Marketing (lavender), Sales (blue), Finance (ochre), Operations (matte red). Each box shows the bowtie notch pinch at the median, whiskers with end caps, faint jittered raw points behind the boxes, and solid outlier dots beyond the whiskers (e.g. Sales has outliers near 145,000/140,000/130,000/106,000 and near 30,000/28,000; Marketing has outliers near 125,000/120,000/109,000). First series is confirmed #009E73.
      Legibility verdict: PASS -- all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Title and both axis titles render in light/white ink, fully visible and not clipped. Tick labels on both axes are a lighter gray, clearly legible against the dark surface -- no dark-on-dark failures observed anywhere (department names, salary tick values, and the title are all bright against the near-black background). Gridlines are faint light lines, subtle but visible.
      Data: The five box colors are pixel-identical to the light render (#009E73 green first, then lavender, blue, ochre, matte red) -- only the chrome (background, text, grid) flipped as expected. Outlier and jitter point positions match the light render exactly.
      Legibility verdict: PASS -- all text is clearly readable against the dark background; no dark-on-dark failures.
