review:
  strengths:
  - Hand-built the notch geometry (10-vertex bowtie polygon per category, clamped
    so the notch never exceeds the box) because lets-plot's geom_boxplot(notch=...)
    is silently ignored by the rendering backend — the code comment documents the
    workaround, and the result matches the R-style notched box plot precisely, including
    the ±1.57*IQR/sqrt(n) formula the spec asks for.
  - 'Full five-number-summary coverage: quartile box, median-pinch notch, 1.5*IQR
    whiskers with caps, and individually plotted outliers, plus faint jittered raw
    points (alpha=0.15) behind the boxes that reveal the underlying distribution shape
    the summary hides.'
  - Rich interactive tooltips (layer_tooltips) surface Q1/Median/Q3, the notch confidence
    interval, and individual outlier salaries in the HTML export — a genuine value-add
    for the interactive detail view.
  - 'Clean Imprint palette usage in canonical order (green/lavender/blue/ochre/red
    for 5 abstract department categories), correct theme-adaptive chrome, and correct
    #FAF8F1/#1A1A17 backgrounds confirmed by pixel sampling in both renders.'
  - 'Realistic, well-differentiated synthetic data (5 departments, n=70-85 each) that
    tells a clear statistical story: Engineering/Finance notches overlap (no significant
    difference), Marketing/Sales have wide notches and clear outliers, Operations
    is tight and low — genuinely useful for the ''visual hypothesis testing'' use
    case the spec calls for.'
  - Legend correctly omitted since department identity is already fully encoded by
    both x-position and color — avoids a redundant legend per the style guide.
  weaknesses:
  - Notch construction bypasses geom_boxplot entirely in favor of manual geom_polygon/geom_segment/geom_point
    layers — well justified by the backend limitation, but it means less of the library's
    built-in boxplot machinery (e.g. automatic outlier detection styling) is exercised,
    slightly capping Library Mastery idiomatic-usage credit.
  - Tick label font size (10pt) and jittered point alpha (0.15) are both at the low
    end of legible/visible on a scaled-down mobile view (~400px) — still readable
    in the provided renders, but worth keeping an eye on if the spec size range grows
    toward the top of 500 points per category.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: Title "box-notched · python · letsplot · anyplot.ai" centered at top in dark ink, clearly readable and comfortably under 70% of plot width. "Department" x-axis title and "Annual Salary (USD)" y-axis title both dark ink, balanced sizes. Tick labels (department names + comma-formatted salary values) in softer gray-ink, fully legible against the light background. Subtle horizontal gridlines only (y-axis), low opacity, do not compete with data.
      Data: Five notched boxes (Engineering, Marketing, Sales, Finance, Operations) in Imprint canonical order — brand green (#009E73) first, then lavender, blue, ochre, matte red. Each box shows a pinched median notch, whiskers with caps, individual outlier dots, and faint jittered raw points behind the box revealing distribution shape.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlap, no clipping at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled pixel (26,26,23) = #1A1A17, matches spec exactly.
      Chrome: Same title and axis titles now rendered in light ink (near-white), tick labels in a softer light-gray ink — both clearly legible against the dark background, no dark-on-dark failures observed. Gridlines flip to a light, low-opacity tone, still subtle.
      Data: Confirmed identical box/outlier/jitter colors to the light render (same green/lavender/blue/ochre/red hues at the same category positions) — only chrome (background, text, grid) flipped as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues; all chrome elements remain fully readable.
