review:
  strengths:
  - Notch geometry follows the spec formula exactly (±1.57 × IQR / √n) and is visually
    correct — adjacent boxes with non-overlapping notches are automatically flagged
    with a significance bracket + dot, delivering the 'quick visual hypothesis test'
    the spec calls for.
  - Real synthetic-yet-plausible outliers (baseline, Config B, Config C) and distinct
    spreads/means per configuration give the notched-box feature set full coverage
    (median, quartiles, whiskers at 1.5×IQR, outliers, plus a bonus mean-diamond marker).
  - Pygal has no native notched-box or grouped-bar-overlay primitive; the implementation
    introspects pygal's own rendered SVG (plot origin, x tick centers, y-value-to-pixel
    regression) to align a hand-built overlay pixel-perfectly with the axes, regardless
    of font/margin choices.
  - 'Imprint palette applied correctly and identically across both themes (Baseline
    #009E73 through Config D #AE3030, canonical order); chrome (background, ink, muted
    text, grid) is fully theme-adaptive and both renders are legible.'
  - 'Clean L-shaped-frame layout: no top/right spine, y-only subtle dashed grid, generous
    whitespace, bottom legend near the plot, title comfortably sized without clipping.'
  weaknesses:
  - Significance-bracket dot markers (r=7px on a 3200px canvas) shrink to well under
    1px when scaled to the ~400px mobile preview — nearly invisible at that size.
    Increase dot radius (or bracket tick length) so the significance markers survive
    the mobile srcset.
  - The box/whisker/notch geometry is 100% hand-built SVG overlay rather than pygal's
    own chart API (pygal.Bar is only used to source axis ticks from an invisible placeholder
    series) — clever and necessary since pygal lacks native notch support, but it
    means none of pygal's high-level box-plot API is actually exercised.
  - One helper function (`y_px`) is defined for the coordinate transform — a minor
    deviation from the KISS 'no functions' guideline, though justified by how often
    the mapping is reused across the box/bracket loops.
  - Every adjacent category pair is flagged significant, which is plausible given
    the generated means/stds but leaves no non-significant comparison in the example
    data to show the notch test correctly withholding a claim — a slightly more overlapping
    pair (e.g. Config B vs. Baseline, which are close in median) would demonstrate
    the negative case too.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-notched · python · pygal · anyplot.ai" is dark ink text, large and fully visible with comfortable margin from the top edge. Y-axis title "Response Time (ms)" and x-axis title "Server Configuration" are dark, clearly readable. Tick labels (0-220 on y, category names on x) are dark and legible. Bottom legend (5 swatches + labels) is dark text, readable, positioned close to the plot. Grid: thin dashed horizontal lines only (y-axis guides), subtle, not competing with data.
      Data: 5 notched boxes (Baseline green #009E73, Config A lavender, Config B blue, Config C ochre, Config D red) with top-to-bottom gradient fill, colored stroke, whiskers with caps, hollow outlier circles, white diamond mean markers, and black significance brackets with a dot above each of the 4 adjacent-pair comparisons (all flagged significant). First series is confirmed brand green #009E73.
      Legibility verdict: PASS — no text is light-on-light; all chrome elements read clearly against the warm cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, tick labels, and legend text are all light/off-white (matches INK token #F0EFE8), fully readable against the dark surface. Grid lines are light-colored and subtle. Significance brackets and dots switch from black (light theme) to white (dark theme) via the theme-adaptive INK token — no dark-on-dark elements found.
      Data: Same 5 box colors as the light render (green, lavender, blue, ochre, red) — confirmed identical hues, only the gradient's underlying page-background-colored diamond/outlier fills flip from cream to near-black to match the new page background, which is correct theme-adaptive behavior, not a data-color change.
      Legibility verdict: PASS — no dark-on-dark text; all title/axis/tick/legend elements clearly visible on the near-black surface.
