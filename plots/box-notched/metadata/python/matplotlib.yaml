review:
  strengths:
  - Comprehensive idiomatic use of ax.boxplot with notch=True, patch_artist, and showmeans,
    plus fully specified flierprops/medianprops/meanprops/whiskerprops/capprops/boxprops
  - Imprint palette applied in correct canonical order (green, purple, blue, tan,
    red) and identical between light and dark renders
  - Theme-adaptive chrome fully threaded through (backgrounds, spines, grid, tick
    colors, annotation box, mean-marker face) with no dark-on-dark or light-on-light
    failures in either render
  - Annotation callout adds genuine data storytelling value by explaining how to read
    non-overlapping notches statistically
  - Realistic, appropriately scaled synthetic data (CI test-suite success rates) with
    reproducible seed (np.random.seed(42)) and current API usage (tick_labels, not
    the deprecated labels kwarg)
  weaknesses:
  - Load Tests box (5th, red) has a notch depth that exceeds half the box's IQR height,
    producing a pinched 'bowtie' shape that partially obscures the Q1/Q3 boundary;
    this is mathematically correct per the ±1.57×IQR/√n formula given Load Tests'
    smaller n and high variance, but it is the least visually clear box on the chart
  - 'LM-02: the showmeans diamond overlay is a nice touch but is a common matplotlib
    boxplot embellishment rather than a distinctive library feature; a bit more differentiation
    (e.g. custom notch/edge treatment) would raise this further'
  - At the 400px mobile thumbnail scale, the annotation callout text becomes quite
    small and is the tightest-margin text element on the chart, though still legible
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "box-notched · python · matplotlib · anyplot.ai" in dark ink, clearly visible; "Test Suite" (x) and "Success Rate (%)" (y) axis labels in dark ink; tick labels in soft dark gray; subtle horizontal gridlines at low alpha; top/right spines removed, left/bottom spines soft gray.
      Data: Five notched boxes for Unit/Integration/System/E2E/Load Tests, colored in Imprint order (#009E73 green, #C475FD purple, #4467A3 blue, #BD8233 tan, #AE3030 red). Dark median line, white diamond mean marker with dark outline, gray outlier dots with transparency, whiskers and caps in soft gray. Annotation callout box with rounded corners and arrow pointing at the Unit Tests notch, explaining how to read non-overlapping notches.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, axis labels rendered in light/near-white ink, clearly visible; tick labels in light gray, clearly visible against the dark background; gridlines subtle light gray at low alpha; annotation callout box flips to a dark elevated background with light text and light border, fully readable; spines soft light gray.
      Data: Same five box colors as the light render (Imprint green/purple/blue/tan/red), confirmed identical — only the chrome (backgrounds, text, grid, annotation box, spines) flips between themes. Median line and mean-marker outline flip to light color, marker face flips to page background, consistent with the theme token pattern.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed in either render.
