review:
  strengths:
  - Significance-bracket annotation between Placebo and High Dose directly demonstrates
    the core reason a notched box plot exists ("Notches don't overlap → medians differ
    (p < 0.05)") — strong data storytelling tied to the spec's stated purpose
  - 'Notch computation and rendering are correct: plotly''s native notched=True box
    combined with a manual median ± 1.57*IQR/sqrt(n) check drives the bracket logic,
    matching the spec''s exact notch-depth formula'
  - Five treatment arms show genuinely varied distributions, spreads, and outliers
    (Placebo negative responders, High Dose super-responders, Standard Care one low
    outlier) — good DQ-01 feature coverage, not just repeated boxes
  - Two-line x-axis tick labels ("Placebo / n=74") tie sample size directly to the
    axis, reinforcing the spec's note that notch reliability improves with n > 20
  - Correct Imprint categorical palette in canonical order (#009E73 first) with identical
    data colors across light/dark renders; theme-adaptive chrome (background, ink,
    grid, zero-line) correctly threaded through in both themes
  - Clean L-shaped spines, y-axis-only subtle gridlines, generous margins, explicit
    font sizes throughout
  weaknesses:
  - Title text is 'box-notched · plotly · anyplot.ai' — missing the required {language}
    segment. Per SC-04 the format must be '{spec-id} · {language} · {library} · anyplot.ai',
    i.e. 'box-notched · python · plotly · anyplot.ai'. Fix the title string in fig.update_layout(title=dict(text=...)).
  - A helper function (median_and_notch_half_width) is defined for the significance-bracket
    math, deviating from the KISS 'no functions/classes' structure preferred by CQ-01.
    Inline the two percentile/notch-half-width calculations directly in the Imports
    → Data → Plot → Save flow instead of a def.
  - Outlier marker size (9px) and box opacity (0.75) are reasonable but slightly conservative
    for n=66-85 per category — a touch more opacity or a subtly larger marker would
    give the outliers more presence without crowding.
