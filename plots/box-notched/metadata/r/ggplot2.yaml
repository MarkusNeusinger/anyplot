review:
  strengths:
  - Notch feature correctly implemented via native geom_boxplot(notch = TRUE) using
    ggplot2's built-in ±1.57×IQR/√n formula, matching the spec exactly
  - 'Distinctive ggplot2 feature use: staplewidth adds whisker caps, and notchwidth/outlier.alpha
    are tuned rather than left at defaults'
  - Imprint palette applied in perfect canonical order (Engineering=#009E73, Sales=#C475FD,
    Finance=#4467A3, Support=#BD8233, Marketing=#AE3030), identical across both themes
  - 'Theme-adaptive chrome is correct in both renders: warm off-white/near-black backgrounds,
    correctly flipped ink tones, subtle y-only grid'
  - Legend appropriately omitted since department is already encoded on the x-axis,
    avoiding redundancy
  - Realistic salary-by-department dataset shows varied spreads, medians, and outliers
    across categories (DQ-01 fully covered), with sample sizes chosen to demonstrate
    notch-width dependence on n
  weaknesses:
  - Y-axis only shows two gridlines/tick labels ($50k and $100k) across a salary range
    spanning roughly $20k-$140k, making it hard to read intermediate values — set
    explicit breaks (e.g. scale_y_continuous(breaks = scales::breaks_width(25000),
    labels = scales::dollar_format(scale = 1e-3, suffix = 'k'))) for denser, evenly-spaced
    ticks.
  - library(dplyr) is imported but never used anywhere in the script (no pipe, mutate,
    filter, group_by, etc.) — remove the unused import.
  - Departments are left in an arbitrary factor order (Engineering, Sales, Finance,
    Support, Marketing) rather than sorted by median salary — since box-notched's
    whole purpose is visually comparing medians, ordering by median (or descending
    salary) would make the notch-overlap comparison read more clearly and add a stronger
    visual hierarchy/story.
  - Y-axis title 'Annual Salary' does not state the unit explicitly (e.g. 'Annual
    Salary (USD)') even though tick labels use a $ format — adding the unit to the
    axis title itself removes any ambiguity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-notched · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly legible. Axis titles "Department" (x) and "Annual Salary" (y) in dark ink, tick labels ("Engineering", "Sales", "Finance", "Support", "Marketing" on x; "$50k", "$100k" on y) in slightly softer dark grey. Only a horizontal (y-axis) grid is shown, subtle and unobtrusive. Only left+bottom axis lines are kept (L-shaped frame), no legend (correctly omitted since departments are already labeled on the x-axis).
      Data: Five notched boxplots, one per department, each a distinct Imprint color: Engineering=green (#009E73, first series correct), Sales=lavender, Finance=blue, Support=ochre, Marketing=matte red — matching canonical Imprint order. Each box shows a pinched notch around the median, whisker caps (staplewidth), and grey outlier points beyond the whiskers (visible for Engineering, Sales, and Support).
      Legibility verdict: PASS — all text is clearly readable against the light background; no dark-on-light or overlap issues observed. Minor issue: only two y-axis gridlines/labels reduce precision when reading intermediate values.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light ink, tick labels in a softer light grey — all clearly visible against the dark background. Grid line color flipped to a light, subtle line. No dark-on-dark text observed anywhere.
      Data: Identical box colors and positions to the light render (Engineering green, Sales lavender, Finance blue, Support ochre, Marketing red) — confirms the Imprint data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; all text and data elements read clearly on the dark surface.
