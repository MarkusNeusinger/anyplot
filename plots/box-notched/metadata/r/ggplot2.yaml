review:
  strengths:
  - Notch depth uses ggplot2's default 1.58×IQR/√n calculation, matching the spec's
    ~1.57×IQR/√n 95% CI formula exactly, and the intentionally varied sample sizes
    (n=45 to n=180) visibly demonstrate the spec's 'notch reliability improves with
    n > 20' note directly in the chart
  - Departments reordered by descending median salary so adjacent boxes and notches
    are easy to compare — a genuine data-storytelling choice, not a default
  - 'Complete notched box plot anatomy: median, quartiles, 1.5×IQR whiskers, staplewidth
    caps, and outlier points with alpha=0.6, all present and correctly configured'
  - First categorical series correctly maps to Imprint brand green (#009E73) on the
    highest-median department after reordering; full 5-color Imprint palette used
    for the remaining categories
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, all text
    legible, INK_SOFT-derived box outlines and outlier points adapt appropriately
    between themes while the 5 categorical fill colors stay pixel-identical'
  - 'Clean, idiomatic code: no legend (redundant with x-axis categories), tibble::/scales::
    namespacing avoids unused library() calls, set.seed(42) for reproducibility, ragg::agg_png
    device used correctly'
  weaknesses:
  - 'Y-axis grid is sparser than the code implies: scale_y_continuous(breaks = scales::breaks_width(25000))
    should place a break every $25k, but only two gridlines actually render ($50k
    and $100k) — pixel inspection of both PNGs confirms no gridline at $25k, $75k,
    or $125k even though the data range (~$20k-$145k) spans well past all of them.
    Over that ~$120k range, having only one reference line between $50k and $100k
    makes it harder to read exact values for the Support, Marketing, and Sales boxes
    that sit outside the labeled band. Verify the breaks_width(25000) call actually
    produces the intended sequence within the panel''s expanded y-limits (e.g. try
    an explicit breaks = seq(25000, 150000, 25000) vector, or scales::breaks_pretty(n
    = 6), and confirm all resulting gridlines render, not just two).'
  - Aesthetic treatment is solid but fairly close to library defaults beyond the palette
    and notch/staplewidth choices — a bit more deliberate polish (e.g. slightly refined
    whisker/cap styling, subtle box width variation reflecting n, or a short data-driven
    subtitle) would lift it from good to distinctive.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-notched · r · ggplot2 · anyplot.ai" is dark ink, fully visible, not clipped at the top edge. X-axis department labels (Engineering, Sales, Finance, Support, Marketing) and y-axis dollar-formatted tick labels ($50k, $100k) are dark/soft-dark and clearly readable against the light background. Only two horizontal gridlines are actually rendered (see weaknesses — breaks_width(25000) does not produce the expected $25k-spaced grid in the saved PNG).
      Data: Five notched boxes in Imprint palette order — Engineering green (#009E73, highest median after reordering), Sales lavender, Finance blue, Support ochre, Marketing red. Notches are visibly present near each median, with Marketing's notch visibly wider than Engineering's/Finance's larger-n boxes, matching the spec's reliability note. Gray outlier points appear beyond the whiskers on several boxes (e.g. above Engineering, below Sales).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and all axis/tick labels flip to light ink and remain fully readable; gridlines flip to a light tone and are visible where not covered by box fills. No dark-on-dark or light-on-light failures observed. Box outline strokes and outlier point strokes are rendered in the lighter INK_SOFT tone appropriate for the dark surface.
      Data: Confirmed pixel-identical to the light render — same five Imprint hues (green/lavender/blue/ochre/red) in the same category order, same relative box/notch/outlier positions; only the chrome (background, text, gridlines, outline strokes) changed between themes.
      Legibility verdict: PASS
