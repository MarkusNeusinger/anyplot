review:
  strengths:
  - Correct, idiomatic use of Makie's boxplot! notch parameters (show_notch, notchwidth,
    whiskerwidth, mediancolor) producing crisp, clearly visible notches in both themes
  - Distinctive bracket! annotation directly implements the spec's 'quick visual hypothesis
    testing' use case — it derives the notch-overlap comparison from the actual sampled
    per-group medians/IQRs rather than hard-coding a claim
  - 'Full theme-adaptive chrome: identical Imprint data colors between light/dark
    renders, correct backgrounds (#FAF8F1 / #1A1A17), and INK/INK_SOFT tokens correctly
    threaded through title, axis labels, ticks, grid, spines, and the bracket callout'
  - Clean, KISS, reproducible code — single Random.seed!(42), only used imports (CairoMakie,
    Colors, Random, Statistics), no functions/classes — saved at the canonical 1600x900
    @ px_per_unit=2 landscape canvas
  - 'All required box-plot elements present per spec: median, quartile box, 1.5*IQR
    whiskers, outliers as individual points with subtle ink strokes, five categories
    each in canonical Imprint palette order (green/lavender/blue/ochre/red)'
  weaknesses:
  - Title text occupies only ~20-25% of the plot width for this 5-category layout,
    on the small side for a title's visual hierarchy role — could raise titlesize
    slightly for more presence (not a hard violation, well within overflow limits)
  - Styling customization mostly leans on palette + notch/whisker/outlier stroke params;
    no extra refinement layer (e.g. a sample-size note 'n=50/group', or a second bracket
    color to distinguish it from the axis spines)
  - Only the largest-gap comparison (Combined Cue vs Baseline) gets the bracket callout
    even though Distraction's notch also clears Baseline's — a second bracket or an
    'and 1 more' note would make the significance story more complete
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "box-notched · julia · makie · anyplot.ai" centered at top, fully legible.
        Axis labels "Condition" (x) and "Reaction Time (ms)" (y) in dark ink, clearly readable.
        Tick labels (condition names, y-axis ms values) in medium-grey ink-soft, legible.
        Subtle horizontal grid lines (y-axis only) at low opacity, visible but not competing with data.
        Top/right spines removed; left/bottom spines in soft grey.
        Bracket annotation near the top reads "Combined Cue notch clears Baseline — medians differ" in dark ink with grey bracket lines — fully readable.
      Data: Five notched boxes in canonical Imprint order — Baseline (#009E73 green), Visual Cue (lavender), Auditory Cue (blue), Combined Cue (ochre), Distraction (matte red). Black median lines, black box/whisker strokes, individual outlier points (green dot above Baseline, red dot below Distraction) with thin ink strokes. Notch "hourglass" pinch is clearly visible on every box.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all flip to light tones (white title/labels, light-grey ticks) and remain fully readable against the dark background. Grid lines are faint light-grey at low opacity, still visible.
      Data: Same five box colors as the light render (green/lavender/blue/ochre/red) — Imprint categorical hues confirmed identical between themes, only the chrome (backgrounds, text, grid, spines, median-line color, bracket color) flipped to the dark-theme tokens (median lines and bracket text are now white/light instead of black).
      Legibility verdict: PASS — no dark-on-dark failures; every text element is clearly legible against the near-black surface, including the bracket annotation text.
