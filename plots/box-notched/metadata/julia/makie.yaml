review:
  strengths:
  - Correct notch feature (show_notch=true, notchwidth=0.5) matching the spec exactly,
    using Makie's native statistical box-plot support rather than a manual workaround
  - Full theme-adaptive chrome architecture (PAGE_BG/INK/INK_SOFT tokens) correctly
    threaded through Figure and Axis in both light and dark renders — no dark-on-dark
    or light-on-light artifacts
  - 'Correct Imprint palette usage: first series is #009E73, subsequent categories
    follow canonical order 2-5, identical data colors across both themes'
  - Realistic, neutral cognitive-science reaction-time dataset with genuine per-condition
    variation in mean/std, producing a natural mix of overlapping and non-overlapping
    notches — directly demonstrates the notch-reliability concept called out in the
    spec
  - 'Clean KISS-structured code: single flat script, explicit Random.seed!(42), no
    unused imports, no fake functionality'
  - Outliers rendered as individual points beyond the whiskers per spec requirement,
    visible in both themes
  weaknesses:
  - 'Y-axis tick/grid coverage is sparse: labeled ticks only at 400/500/600 ms, while
    box whiskers and outliers extend down to roughly 340-350 ms, leaving the bottom
    ~15-20% of the visible data range without any reference gridline. Add a tick step
    of 50 (or an explicit tick at the data minimum) so the lower boxes are as easy
    to read precisely as the upper ones.'
  - Design storytelling is present only implicitly through color and notch position.
    Since the spec's whole point is 'quick visual hypothesis testing,' consider a
    small callout or subtitle noting which condition's notch does not overlap with
    Baseline (Distraction) to make the statistical takeaway immediate rather than
    requiring the viewer to compare notch bands themselves.
  - 'Library Mastery is solid but generic: a single boxplot! call with sensible keyword
    arguments. Consider leveraging something more distinctly Makie (e.g. Makie.Theme()
    for the token set, or a custom Legend/Colorbar) to differentiate from what any
    other library''s notched-boxplot support could produce with a syntax swap.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-notched · julia · makie · anyplot.ai" in bold dark ink, centered above the plot. Axis labels "Condition" (x) and "Reaction Time (ms)" (y) in dark ink; tick labels (category names and 400/500/600 ms) in a softer dark gray. Thin horizontal grid lines at 15% opacity. Left and bottom spines visible in soft gray; top and right spines removed.
      Data: Five notched boxes — Baseline (green), Visual Cue (lavender), Auditory Cue (blue), Combined Cue (ochre), Distraction (red) — each with visible median line, IQR box, notch waist, whiskers, and outlier points (one green dot above Baseline, one red dot below Distraction). First series confirmed #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis labels now rendered in light/near-white ink; tick labels in a lighter soft gray. Grid lines flipped to a light-on-dark 15%-opacity tone. Spines in soft light gray, top/right still removed.
      Data: Same five category colors (green, lavender, blue, ochre, red) in identical hues to the light render — only the surrounding chrome flipped, confirming theme-adaptive design. Notch shapes, whiskers, and outlier points all still clearly visible.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed (title, axis labels, and tick labels are all rendered in light ink, contrasting cleanly with the near-black surface).
