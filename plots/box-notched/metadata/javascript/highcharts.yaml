review:
  strengths:
  - Custom hourglass-shaped notched box built via Highcharts' SVG renderer (path with
    rounded corners, subtle drop shadow) — a genuinely polished silhouette, not a
    generic default
  - 'Significance bracket + "significant (95% CI)" annotation directly visualizes
    the notched box plot''s core purpose: spotting the most clearly separated pair
    of medians'
  - 'Perfect Imprint palette compliance in both themes — first series is #009E73,
    remaining four follow the canonical order, and data colors are pixel-identical
    between light and dark'
  - Realistic manufacturing/quality-control dataset (bulb lifespan by batch) with
    varied spreads, sample sizes, and genuine outliers per category — satisfies DQ-01
    feature coverage
  - Deterministic LCG-seeded data generation; theme-adaptive chrome (ink/inkSoft/grid
    tokens) correctly threaded through title, subtitle, axes, and the custom-rendered
    elements
  weaknesses:
  - Statistics helper functions (quantile, findMostSignificantPair) push the code
    beyond a strict Imports→Data→Plot KISS structure — justified by the notch/IQR
    math a box plot requires, but still a minor CQ-01 deduction
  - Because the highcharts-more boxplot series isn't loaded, the box itself is built
    from low-level renderer.path calls with manual toPixels coordinate math rather
    than a high-level series API — reduces LM-01 slightly relative to what a native
    series type would offer
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Dark, clearly readable title "box-notched · javascript · highcharts · anyplot.ai" and subtitle at top; dark axis titles "Manufacturing Batch" (x) and "Bulb Lifespan (hours)" (y); dark tick labels on both axes; subtle horizontal gridlines. The "significant (95% CI)" bracket annotation between Batch B and Batch C is rendered in dark ink and fully legible.
      Data: Five notched (hourglass-waisted) boxes, one per batch, each with a distinct Imprint color — Batch A green (#009E73, first series as required), Batch B purple, Batch C blue, Batch D ochre/tan, Batch E red — filled at ~40% opacity with a matching colored stroke and a dark median line through the waist. Whiskers extend to 1.5×IQR with hollow, colored-outline outlier circles beyond them (Batches A, B, C, D each show at least one outlier). Box widths and spreads visibly differ by batch (e.g. Batch D is notably wider/more variable than Batch B), demonstrating real distributional variety.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, tick labels, and the significance bracket annotation all render in light/white text, clearly visible against the dark background — no dark-on-dark failures observed. Gridlines remain subtle but visible.
      Data: Same five box colors as the light render (green/purple/blue/tan/red), pixel-identical hues — only the chrome (background, text, median-line color which switches from dark ink to light ink) adapts. Box shapes, widths, notches, and outlier placement are unchanged from the light render.
      Legibility verdict: PASS — all text remains clearly readable against the dark background; the median line correctly switches to a light color so it stays visible against the darker box fills.
