review:
  strengths:
  - 'Excellent workaround for the missing highcharts-more boxplot module: hand-built
    notched box shapes via chart.renderer with a redraw-safe pattern - genuinely idiomatic,
    sophisticated Highcharts usage.'
  - Notch depth computed with the spec's exact formula (±1.57×IQR/√n), clipped to
    stay within Q1/Q3 - matches standard statistical convention (e.g. R's boxplot(notch=TRUE)).
  - 'All required box-plot elements present: median, quartiles, 1.5×IQR whiskers with
    caps, individual outlier points, per-category Imprint palette coloring in canonical
    order starting with brand green.'
  - Both renders are fully theme-correct - identical data colors, properly token-driven
    chrome (title/axis/grid/median line), no dark-on-dark or light-on-light failures.
  - Realistic, neutral manufacturing QC scenario with genuine feature coverage - varied
    spreads per batch and outliers in 3 of 5 categories.
  weaknesses:
  - Outlier markers are a touch small (radius 5 CSS px) given the sparse per-category
    samples - increase to roughly 7-8 CSS px radius for stronger visual weight.
  - Y-axis padding is a flat ±40 hours regardless of data range - switch to a proportional
    pad (e.g. ~5% of the value range) so the boxes fill more of the vertical canvas
    and reduce empty headroom above/below the outliers.
  - Design Excellence still reads as "well-executed default" rather than exceptional
    - consider one additional refinement touch (rounded box corners, subtle box shadow,
    or a highlighted focal comparison between two categories) to lift DE-01/DE-02.
  - Data storytelling (DE-03) currently relies only on the subtitle text - a visual
    device (e.g., a faint connector/bracket between two non-overlapping notches, or
    bolding the pair with the clearest median difference) would make the "significantly
    different medians" claim visible at a glance, not just explained in words.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "box-notched · javascript · highcharts · anyplot.ai" and lighter gray subtitle explaining notch interpretation. Axis titles ("Manufacturing Batch", "Bulb Lifespan (hours)") and tick labels are dark/soft-dark and clearly legible. Subtle horizontal gridlines only.
      Data: Five notched box groups (Batch A-E) in Imprint palette order - green (#009E73), lavender, blue, ochre, red. Translucent fills, solid strokes, dark median line at the notch waist, open-circle outliers above/below three categories.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title and axis titles render in light/white tones, subtitle and tick labels in softer light gray - all clearly legible against the dark surface. Median line switches to light ink, still visible against the colored notch waist. No dark-on-dark failures observed.
      Data: Box colors (green, lavender, blue, ochre, red) identical to the light render - only chrome (background, text, gridlines, median line ink) flipped as expected. Brand green (Batch A) reads clearly.
      Legibility verdict: PASS
