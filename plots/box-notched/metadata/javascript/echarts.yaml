review:
  strengths:
  - Notch depth exactly matches the spec's formula (±1.57 × IQR / √n) and whiskers
    correctly stop at the nearest inlier within 1.5×IQR, with genuine outliers plotted
    separately
  - Idiomatic, distinctive use of ECharts' custom series (renderItem with api.coord/api.size)
    to hand-build the notch geometry in pixel space — the only viable path since ECharts'
    built-in boxplot series has no notch support, and it follows ECharts' own recommended
    custom-series pattern
  - 'Correct Imprint palette in canonical order with the first category (Engineering)
    at #009E73; both plot-light.png and plot-dark.png confirm identical data colors
    and fully theme-correct chrome (background, axis text, grid, median line)'
  - Clean, uncluttered layout — no clipping, no overlap, explicit font sizes throughout
    (title 22px, axis names 16px, labels 14-15px)
  - Realistic, neutral salary-by-department dataset with deterministic LCG-seeded
    generation (n=45-70 per department) and visibly different spreads/medians across
    categories, which is exactly what makes the notches meaningful
  weaknesses:
  - Outliers only appear in 2 of the 5 departments (Engineering, Product) — showing
    at least one outlier in a third department would better demonstrate DQ-01 feature
    coverage across the full category set
  - No legend is rendered; acceptable since departments are already labeled on the
    x-axis, but a small 'Outliers' marker note would make the scatter series' role
    clearer at a glance
  - The custom renderItem approach requires several helper functions (LCG RNG, quantile,
    computeBoxStats, renderNotchedBox), which departs from the strict KISS 'no functions'
    ideal — justified here since ECharts' custom-series API mandates a renderItem
    callback and accurate quantile math needs a helper, but worth noting
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-notched · javascript · echarts · anyplot.ai" is bold dark text, centered, clearly readable. X-axis label "Department" and Y-axis label "Annual Salary (USD)" are dark and legible. Tick labels ($40k-$120k on Y, department names on X) are a slightly softer dark gray, fully readable. Subtle horizontal gridlines only (no vertical gridlines), low-opacity, non-competing with the data.
      Data: Five notched boxes, one per department (Engineering, Product, Sales, Support, Finance), each a distinct Imprint palette color in canonical order — Engineering is brand green #009E73, Product lavender, Sales blue, Support ochre, Finance matte red. Each box shows an hourglass-shaped notch pinched at the median (drawn as a dark horizontal line), whiskers with end caps, and small outlier dots (visible for Engineering and Product) matching their category's color with a light halo border.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light/off-white tones and remain clearly readable against the dark background — no dark-on-dark text anywhere. The median line inside each notch has flipped from black to white, staying visible against every box color. Gridlines remain subtle and consistent with the light render's pattern.
      Data: Same five departments, same five Imprint palette hues (green, lavender, blue, ochre, red) — visually identical to the light render's data colors, confirming only chrome (not data) flipped between themes. Outlier dot positions and colors match the light render.
      Legibility verdict: PASS.
