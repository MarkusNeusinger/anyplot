review:
  strengths:
  - Correctly implements a notched box plot from scratch via Chart.js's public plugin
    API (afterDatasetsDraw hook + scale.getPixelForValue), exactly the pattern the
    library prompt recommends since Chart.js has no native box-plot type
  - Notch math follows the spec formula precisely (±1.57×IQR/√n) and quartile/whisker
    computation (1.5×IQR) is textbook-correct
  - 'Data tells the intended statistical story: dose-response ordering across categories,
    some notches overlapping (Placebo vs Low Dose) and others clearly separated (Placebo
    vs High Dose/Combination), which is exactly what a notched box plot is meant to
    demonstrate'
  - Good outlier coverage (3 of 4 groups show individual outlier points) and varied
    spreads across groups satisfy DQ-01 feature coverage
  - 'First categorical series is #009E73 and the remaining three follow the canonical
    Imprint order; data colors are identical between light and dark renders, only
    chrome flips'
  - 'Clean theme-adaptive chrome: title/axis/tick colors all pull from window.ANYPLOT_TOKENS,
    subtle y-axis-only gridlines, no visible spines'
  weaknesses:
  - No legend is rendered; acceptable here since categories are labeled directly on
    the x-axis, but a small explicit legend would reinforce the color-to-category
    mapping for readers unfamiliar with the convention
  - Median line and box outline use flat fills with no additional typographic or shadow
    polish beyond the Chart.js default font — solid but stops short of full publication-level
    refinement
  - No explicit annotation or callout marks which notch comparisons are statistically
    significant, leaving the viewer to infer overlap/non-overlap visually rather than
    being guided to the insight
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-notched · javascript · chartjs · anyplot.ai" in bold dark ink at top-center, fully visible with no clipping. X-axis title "Treatment Arm" and Y-axis title "Symptom Improvement Score" (rotated) both in dark ink. Tick labels (category names, numeric Y ticks) in a softer dark-gray tone. Subtle horizontal gridlines only on the Y-axis; no visible chart spines.
      Data: Four notched boxes for Placebo, Low Dose, High Dose, Combination. First series (Placebo) renders in Imprint green #009E73; Low Dose in light purple, High Dose in blue-gray, Combination in ochre/tan — matching the canonical Imprint categorical order. Each box shows a pinched "hourglass" notch around the black median line, whiskers with end caps, and colored outlier dots (2 for Placebo, 1 for High Dose, 1 for Combination) with a light stroke separating them from the page background.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all rendered in light/white tones, fully legible against the dark surface. Median line switches to white (theme-adaptive ink token) instead of black. Gridlines remain subtle but visible.
      Data: Same four box colors as the light render (green, purple, blue-gray, ochre) — confirmed identical hues/positions, only the chrome (background, text, median-line, outlier stroke) flipped for the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black background.
