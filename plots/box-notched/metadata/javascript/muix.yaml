review:
  strengths:
  - 'Notches computed exactly as the Notes define (±1.57×IQR/√n): Engineering (n=56,
    IQR≈19.5) is drawn with a ±4.1 notch, and each median line sits at the narrowest
    point of its pinched box'
  - 'Idiomatic MUI X v9 composition: a ChartsContainer with a band x axis and a linear
    y axis, plus a custom NotchedBoxes layer that reads useXScale/useYScale, so the
    hand-drawn SVG marks share the library''s scales, grid and axes'
  - 'Notch overlap reads directly: Engineering and Finance notches share the 87–95
    range, while Finance vs Sales and Marketing vs Customer Support clearly separate,
    which shows the significance comparison the plot type exists for'
  - Translucent box fills (0.32) with full-strength 2.5 px outlines and hollow, page-filled
    outlier circles keep the notch outline distinct in both themes, with identical
    data colors in light and dark
  - Salary-by-department data is realistic and neutral; departments are ordered roughly
    by descending median so the notches read as a staircase, and the value axis starts
    near the data instead of at zero
  weaknesses:
  - 'Suggestion: the custom SVG marks have no hover; a ChartsTooltip-style readout
    of n, quartiles and the notch interval in the HTML would use MUI X interactivity.'
  - 'Suggestion: the mandated title fills about a third of the width at 22 px; a slightly
    larger title would give the header more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold dark title "box-notched · javascript · muix · anyplot.ai" centered at the top, a soft-ink subtitle "243 observations · 5 groups (Department) · Notches at ±1.57×IQR/√n (95% CI around median)", y-axis "Annual salary ($k)" with ticks from 30 to 140, x-axis "Department" with five category ticks, and subtle dashed horizontal grid lines. All readable.
      Data: five notched boxes in Imprint order: Engineering #009E73 green, Finance #C475FD lavender, Sales #4467A3 blue, Marketing #BD8233 ochre, Customer Support #AE3030 red. Each box has a translucent fill with a strong outline, a pinched notch with a thick median line at its waist, whiskers with caps, and hollow outlier circles (Engineering at 136, 52 and 49; Finance at 60; Sales at 31; Customer Support at 36).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: the title, subtitle, axis labels and ticks flip to light ink and are all clearly readable. The grid is subtle but visible. No dark-on-dark text.
      Data: the same five outline colors as the light render. The fills read darker because the translucent fill composites over the dark page. Brand green stays clearly visible, and the outliers are hollow with the page fill.
      Legibility verdict: PASS
