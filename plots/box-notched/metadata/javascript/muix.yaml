review:
  strengths:
  - Notch depth is computed exactly per spec formula (1.57 x IQR / sqrt(n)), and whiskers
    correctly bound at 1.5x IQR with fence-based outlier detection
  - Imprint palette applied in exact canonical order (green, lavender, blue, ochre,
    matte red) across the 5 departments, identical hex values in both light and dark
    renders
  - Theme-adaptive chrome verified correct in both renders -- no dark-on-dark or light-on-light
    failures; even the median-notch line itself flips ink token per theme
  - Deterministic seeded LCG+Box-Muller data generation produces realistic, varied
    department salary distributions -- Engineering/Finance notches visibly overlap
    (no significant median difference) while Sales/Marketing/Support are clearly separated,
    genuinely demonstrating the statistical value proposition of notched box plots
  - Idiomatic composition via MUI X's low-level useXScale/useYScale hooks to hand-draw
    the notched-box glyph -- exactly the documented approach for chart types the community
    package has no built-in component for
  - Outlier markers use a page-background stroke halo for clean separation from box
    fills, a nice refined detail
  weaknesses:
  - Y-axis label 'Annual Salary' does not include an explicit unit suffix (e.g. '(USD)')
    -- the dollar sign only appears in tick labels, not the axis title itself
  - Default MUI X tick marks (small perpendicular dashes) are retained on both axes;
    the style guide recommends removing tick marks while keeping tick labels for a
    cleaner look
  - Visual treatment is solid and correct but fairly conventional for the box-plot
    genre -- more distinctive polish (refined typography, a subtler box fill treatment)
    could push Aesthetic Sophistication further toward publication-ready
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "box-notched · javascript · muix · anyplot.ai" bold dark text top-left; "Annual Salary" rotated Y-axis label and "Department" X-axis label both dark and clearly legible; tick labels ($30k-$130k, department names) dark, readable; subtle horizontal gridlines only.
      Data: 5 notched boxes in Imprint canonical order -- Engineering #009E73 (green), Finance #C475FD (lavender), Sales #4467A3 (blue), Marketing #BD8233 (ochre), Support #AE3030 (matte red). Median line drawn in dark ink, semi-transparent box fills, whisker caps, and two visible outlier dots (Engineering, Finance) with a light-colored halo stroke.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink, all clearly legible against the dark background; gridlines subtle but visible; median line automatically flips to light ink (theme token correctly threaded through).
      Data: Confirmed identical to the light render -- same green/lavender/blue/ochre/red hexes for the five departments, no unintended shifts. Outlier-dot halo stroke also uses the (now dark) page background, keeping the same clean separation effect.
      Legibility verdict: PASS -- no dark-on-dark failures anywhere; every text element and data element is clearly distinguishable from the near-black surface.
