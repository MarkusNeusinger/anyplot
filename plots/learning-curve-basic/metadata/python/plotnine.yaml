  strengths:
  - Bands are derived from fold-level data with a pandas groupby (mean and population
    std per training size), so the lines pass through the fold means as C1 asks
  - Canonical 3200x1800 canvas with text at the library prompt's reference sizes (12/10/8
    pt), legible in both themes
  - 'scale_color_manual/scale_fill_manual with limits taken from the data keep Training
    on #009E73 and Validation on #C475FD, identical across themes'
  - Translucent ribbons (alpha 0.25) keep both curves and the overlapping band visible
    in light and dark
  weaknesses:
  - 'Suggestion: drop the empty legend title (legend_title=element_blank()) so the
    legend frame loses its blank top band and ''Validation Score'' no longer sits
    flush against the right edge of the frame.'
  - 'Suggestion: plotnine''s stat_summary(fun_data=''mean_sdl'', fun_args={''mult'':
    1}) on the fold-level df could draw the mean line and ±1 std ribbon directly,
    replacing the groupby loop.'
