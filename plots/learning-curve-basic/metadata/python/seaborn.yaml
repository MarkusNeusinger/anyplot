  strengths:
  - 'Theme-adaptive chrome in both renders: warm backgrounds, INK and INK_SOFT text,
    subtle y grid and an elevated legend box, with identical data colors across themes'
  - 'Training and validation differ by Imprint color (#009E73, #C475FD) and by marker
    shape (circle and square)'
  - Both ±1 SD bands are clearly visible and translucent enough that the curves stay
    readable where they approach each other
  - 'Axis titles carry units or range: ''Training Set Size (samples)'', ''Accuracy
    Score (0-1)'''
  weaknesses:
  - 'VQ-05 (both): Canvas dimensions drifted from required target. Actual: 4678x2582.
    Closest valid target: 3200x1800 (±16 px tolerance). Signed delta: +1478 × +782
    — far too large → figsize=(8, 4.5) at dpi=400 with the default bbox. Likely cause:
    figsize=(16, 9) with savefig(dpi=300, bbox_inches="tight").'
  - 'SC-04 (both): the title reads ''learning-curve-basic · seaborn · anyplot.ai''
    without the language segment → ''learning-curve-basic · python · seaborn · anyplot.ai''.
    Likely cause: the ax.set_title string.'
  - 'DQ-02 (both): the scenario names no task or model; the y axis is a bare ''Accuracy
    Score (0-1)'' and the legend ''Training Score'' / ''Validation Score'' → name
    what is being learned (for example a classifier''s accuracy on a named task).
    Likely cause: the generic labels and data comments.'
  - 'Suggestion: sns.lineplot on long-form fold data with errorbar="sd" would compute
    the means and bands that lines 49–52 and the two fill_between calls write out.'
