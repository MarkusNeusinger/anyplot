review:
  strengths:
  - Band annotation and line/scatter glyphs share one ColumnDataSource per curve,
    so band and mean line come from the same groupby statistics
  - Means and ±1 std computed from tidy per-fold rows with pandas groupby rather than
    typed in
  - Theme tokens threaded through title, axes, ticks, legend and grid; both renders
    read cleanly
  - legend_label on line and scatter merges them into one legend entry per curve
  weaknesses:
  - 'DQ-03 (both): the simulated training-fold accuracies reach about 1.02 at 50 samples
    (0.99 + 1.5 × 0.02), above the metric''s maximum of 1, and the training band''s
    top edge sits above the 1.0 gridline → keep every fold score at or below 1.0 (about
    −0.02). Likely cause: train_mean + train_std * fold_offsets in the data block
    without a clip to 1.0.'
  - 'Suggestion: a HoverTool on the mean markers showing size, mean and ±std would
    add value in the HTML view.'
