review:
  strengths:
  - 'Clear overfitting story in the data: the validation MSE falls from about 0.80
    to 0.29 while the training MSE climbs gently from 0.02 to 0.06, so a persistent
    wide gap is visible at a glance'
  - Bands are computed from the fold-level tidy table with a pandas groupby(...).agg(['mean',
    'std']) and drawn with fill_between at alpha 0.2, translucent enough that the
    gridlines stay visible through them in both themes
  - Distinct circle and square markers on top of Imprint green and purple keep the
    two curves apart without relying on hue
  - Theme tokens are applied to every chrome element, including the legend frame on
    ELEVATED_BG, so both renders read cleanly
  - Canvas is exactly 3200x1800 with bbox_inches left at its default, as the library
    prompt requires
  weaknesses:
  - 'Suggestion: the training band (fold std about ±0.005 MSE) is only a hairline
    on a 0–0.87 axis; a slightly larger fold spread in the data generation would make
    the second band read as a band rather than a thickened line.'
  - 'Suggestion: the legend could sit closer to the curves it names, for example in
    the empty middle-right area, to shorten the eye path.'
