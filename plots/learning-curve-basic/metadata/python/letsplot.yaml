review:
  strengths:
  - 'Single tidy pipeline: df.melt into long form, groupby().agg(mean, std) per curve
    and size, then one ggplot with color and fill mapped to the curve column, so the
    ribbon, line and points share one legend'
  - geom_ribbon with alpha=0.2 and a transparent outline keeps both bands translucent;
    the training and validation curves stay visible over their bands in both themes
  - Lines pass through the fold means at every evaluated size with a point at each,
    no smoothing between sizes
  - Canvas follows the library's landscape pair (ggsize(800, 450), scale=4 → 3200×1800);
    text sizes follow the library prompt (16/12/10)
  - 'Theme tokens threaded through every chrome element: both renders are readable
    with no dark-on-dark text'
  - 'Library-native interactivity: the HTML export gives hover tooltips on the points
    and the ribbon'
  weaknesses:
  - 'DE-02 (both): all four panel borders are drawn and the major grid runs on both
    axes in opaque INK_SOFT (#4A4A44 light / #B8B7B0 dark), heavier than the style
    guide''s 15 % rule color, so the frame and grid compete with the curves → keep
    only the left and bottom axis lines (or none), draw the y-grid only and color
    it with the RULE token rgba(26,26,23,0.15) / rgba(240,239,232,0.15). Likely cause:
    theme_minimal() plus axis_line=element_line(color=INK_SOFT) and panel_grid_major=element_line(color=INK_SOFT,
    size=0.3).'
  - 'Suggestion: drop the legend box frame and let the legend sit on the page background,
    as the style guide''s decoration checklist proposes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel; 3200×1800 landscape.
      Chrome: title "learning-curve-basic · python · letsplot · anyplot.ai" top-left in dark ink, about 55 % of the width; x title "Training set size (samples)", y title "Accuracy (0-1)" in dark ink; tick labels in INK_SOFT gray (0–1,600 on x, 0.65–1 on y). A frame on all four sides of the panel and an opaque gray grid on both axes, more prominent than a subtle rule. Legend at the bottom in a framed #FFFDF6 box: "Training score", "Validation score".
      Data: training curve in #009E73 rising from about 0.876 at 50 samples to about 0.99 and flattening; validation curve in #C475FD rising from about 0.67 to about 0.84. Points at each of the 10 sizes; ±1 std bands at alpha 0.2, the validation band clearly wider. Both curves and bands distinct.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend box #242420.
