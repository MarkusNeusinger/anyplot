review:
  strengths:
  - Means and ±1 std computed with a single pandas groupby().agg over a tidy folds
    × sizes table, so every mark sits at its fold mean (C1)
  - 'Both renders fully theme-correct: INK/INK_MUTED tokens threaded through the pygal
    Style, all text readable on #FAF8F1 and #1A1A17'
  - Bound lines reuse their curve's color and are kept out of the legend by None-titled
    series, so the legend shows exactly two entries
  - Font sizes at the style-guide reference for a 3200x1800 canvas; title in the mandated
    four-segment format
  - Interactive HTML output with pygal's native tooltips on every mean point
  weaknesses:
  - 'SC-02 (both): the variability across folds is drawn as two dashed ±1 std bound
    lines per curve, not as a shaded band (spec Notes, C2) → fill the area between
    mean−std and mean+std in the curve''s color at low opacity. Likely cause: lines
    106–109 add the bounds as dashed line series; pygal fills only to the axis, so
    draw the band as one closed XY series (upper points then reversed lower points)
    with fill=True and a translucent fill via Style opacity.'
  - 'VQ-05 (both): a ~150 px empty strip under the bottom legend and a legend stretched
    across the full width with its two entries ~600 px apart leave the lower canvas
    unbalanced → legend nearer the axis title with less dead space (about −100 px).
    Likely cause: legend_at_bottom=True with margin=50 and default legend_box_size/columns.'
  - 'CQ-01 (code): lines 50–53 define a `series()` helper function → inline the three-line
    computation (e.g. a list comprehension over stats) at the call sites. Likely cause:
    the bound loop reuses the helper.'
  - 'Suggestion: format y ticks with a fixed two decimals (value_formatter) so ''0.8''
    reads as ''0.80'' like its neighbours.'
