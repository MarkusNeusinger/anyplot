review:
  strengths:
  - 'Correct Imprint palette order — training curve is #009E73 (brand green), validation
    curve is #C475FD (lavender) — identical hex in both light and dark renders'
  - Confidence bands (±1 std across the 6 folds) rendered as smooth d3.area shapes
    with curveMonotoneX, clearly showing the classic converging-gap learning-curve
    pattern
  - 'Idiomatic D3 v7 usage: proper data joins (.data().join("circle"/"line")), d3.scaleLinear,
    d3.axisBottom/Left with d3.format for comma/percent ticks'
  - Theme-adaptive chrome throughout (axis text, ticks, domain lines, gridlines, title
    all sourced from window.ANYPLOT_TOKENS) — both renders are legible and correctly
    themed
  - Legend placed in genuine free space (top-right, above the converging curves) without
    overlapping data or text
  - Realistic, neutral ML scenario (digit-classification-style sklearn learning_curve
    output) with plausible accuracy progression and shrinking variance at larger sample
    sizes
  weaknesses:
  - Title fills only ~30% of canvas width at 22px — well under the 50-70% guideline
    for a shorter custom-length title; bump title font-size to ~26-28px to strengthen
    the visual hierarchy and better use the available whitespace
  - Data markers (r=6) are on the modest side for only 8 sparse points per series
    — enlarge to r=8-9 per the sparse-data sizing heuristic so the sampled points
    read as clearly as the lines
  - 'Design Excellence is solid but not yet publication-tier: consider a small refinement
    such as a subtle drop-shadow/rounded swatch on the legend box, or a light annotation
    calling out the narrowing train/validation gap to push Data Storytelling further'
  - Data-generation helper functions (makeLcg, gaussian, trendMean, foldScores, summarize)
    add more structural indirection than a strict KISS one-shot script — acceptable
    given the lack of a browser RNG, but could be flattened/inlined slightly for a
    more linear top-to-bottom read
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "learning-curve-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered at top. X-axis label "Training Set Size (samples)" and y-axis label "Accuracy" (rotated) in dark ink. Tick labels (comma-formatted sample counts on x, percent-formatted on y) in a softer gray-brown. Subtle horizontal gridlines only. All text is clearly legible against the light background.
      Data: Two lines with shaded ±1 std confidence bands — training score in brand green (#009E73, top line, high and flat near 94-99%) and validation score in lavender/purple (#C475FD, bottom line, rising from ~70% to ~92% and converging toward the training line). Circular markers at each of the 8 training-size points, with a light-background stroke for a clean cutout look. Legend in the top-right free space labels "Training score" and "Validation score" without overlapping any data or gridlines.
      Legibility verdict: PASS — no text is light-on-light, no clipping, no overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-light gray, fully readable against the dark background. Gridlines are faint but visible. No dark-on-dark text anywhere — title, axis labels, and tick labels are all light-colored.
      Data: Identical hex colors to the light render — brand green (#009E73) for training and lavender (#C475FD) for validation — confirming only chrome (background, text, grid) flips between themes while data colors stay fixed. Confidence-band fills read a bit richer against the dark backdrop but remain subtle and non-competing with the lines.
      Legibility verdict: PASS — no dark-on-dark failures, all text and data fully legible.
