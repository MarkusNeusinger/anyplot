review:
  strengths:
  - Confidence bands correctly implemented via the stacked-area trick (transparent
    lower series + width series), producing an accurate ±1 std-dev band per curve
  - 'Correct Imprint palette usage: first series brand green (#009E73) for training,
    second series lavender (#C475FD) for validation, identical across light and dark
    renders'
  - Theme-adaptive chrome is correct in both renders — cream/near-black backgrounds,
    readable ink-colored title, theme-adaptive grid via t.grid, no dark-on-dark or
    light-on-light failures
  - Clean, deterministic, hardcoded data with a realistic spam-filter classifier scenario
    that tells a coherent bias-variance story (training score drifts down, validation
    score climbs and the gap narrows but doesn't fully close)
  - 'Idiomatic and distinctive MUI X usage: monotoneX curve smoothing, valueFormatter
    for percentage ticks, and targeted sx overrides on MUI-generated series class
    names (.MuiAreaElement-series-*, .MuiMarkElement-series-*) to build a clean halo-ring
    marker effect'
  - skipAnimation set, no fake interactivity, harness contract (default export, ANYPLOT_SIZE
    sizing) followed correctly
  weaknesses:
  - Markers (r=6 in CSS px) are small for a sparse series of only 10 points per curve
    — per the data-density heuristic, sparse data (<50 points) should use larger,
    more prominent markers; increase to r≈8-9 so the sample points read clearly at
    both desktop and mobile size
  - 'The yAxis config sets an invalid/unused prop `tickFontSize: 34` (MUI X has no
    such axis option — the correct key is `tickLabelStyle.fontSize`, already set separately
    to 14). This is dead code left over from styling iteration — remove it'
  - 'Design Excellence is solid but not yet publication-grade: consider a touch more
    visual refinement (e.g. slightly bolder distinction between the two confidence
    bands, or a subtle callout/annotation on the final narrowing gap) to push data
    storytelling further, since the convergence trend is the core insight of a learning
    curve'
  - No dedicated axis unit symbol on the y-axis label ("Classification Accuracy" relies
    on the % tick formatter rather than stating the unit in the label itself) — minor,
    but an explicit "(%)" would remove any ambiguity
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "learning-curve-basic · javascript · muix · anyplot.ai" in bold dark ink, centered top, clearly legible. X-axis label "Training Set Size (labeled emails)" and y-axis label "Classification Accuracy" in dark text, both readable. Tick labels (percent on y, sample counts on x) are dark and legible. Subtle horizontal grid lines only, low-contrast. Legend centered at bottom with two swatches: green "Training score" and lavender "Validation score".
      Data: Training curve in brand green (#009E73) starting near 98.5% and drifting down to ~94.3%, with a narrow green confidence band. Validation curve in lavender/purple (#C475FD) starting near 76% and climbing to ~92.8%, with a wide confidence band at small sample sizes that narrows as sample size grows. The two curves converge but retain a persistent, narrowing gap. Small ringed markers sit at each of the 10 sampled training sizes.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light/off-white text, clearly legible against the dark background. Grid lines are subtle and still visible. Legend text is light-colored and readable, swatches unchanged.
      Data: Training (green) and validation (lavender/purple) curves and their confidence bands render in the identical hues as the light render — only the chrome (background, text, grid) flipped. The convergence story reads identically in both themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly visible against the near-black background, and the brand green remains vivid on the dark surface.
