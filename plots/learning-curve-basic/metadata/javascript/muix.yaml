review:
  strengths:
  - 'Bands built with the documented MUI X stacked-area approach: a transparent floor
    series plus a 2×std width series stacked on it covers exactly mean ± 1 std, with
    linear curves so the means pass through every evaluated size unsmoothed'
  - 'Clear visual hierarchy: 3 px mean lines with 7 px filled markers ringed in the
    page color sit on top of 18 %-opacity bands with half-opacity 1 px edges, and
    both overlapping bands stay readable in both themes'
  - y limits derived from the bands' extent with 8 % padding, so the gap and convergence
    fill the plot instead of a 0–100 % axis
  - 'Theme handled correctly: Imprint green and purple are identical in both renders,
    chrome comes from the harness ThemeProvider and t.grid, marker halos use t.pageBg'
  - Per-series valueFormatter gives the HTML tooltip percentage values for the mean
    series; skipAnimation set as required
  weaknesses:
  - 'VQ-03 (both): the legend glyphs are a short line with a small hollow circle (about
    5 px), while the data marks are filled 7 px-radius circles ringed in the page
    color, so the legend marks do not match the plotted marks → filled circles in
    the series color at a size closer to the data markers. Likely cause: the default
    line-series legend mark; style it through slotProps.legend.sx on the legend mark
    class.'
  - 'LM-01 (code): the four helper band series (trainLower, trainBand, valLower, valBand)
    carry no label and no formatter, so the HTML tooltip lists four extra unlabeled
    rows with raw fractions such as 0.976 and 0.024 next to the two mean values →
    hide the helper series from the tooltip. Likely cause: band series without valueFormatter:
    () => null.'
  - 'Suggestion: only the band''s upper edge carries a stroke (the trainBand/valBand
    line), the lower edge has none; outlining both edges or neither would make the
    bands symmetric.'
  - 'Suggestion: x-axis ticks start at 500 while the first evaluated size is 200 and
    sits on the y-axis line; domainLimit: "nice" would give the first point some breathing
    room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; no white panel.
      Chrome: centered bold title "learning-curve-basic · javascript · muix · anyplot.ai" (~33 % of width), y-axis label "Classification Accuracy (%)" (rotated), y ticks 70%–100% in 2 % steps, x-axis label "Training Set Size (labeled emails)", x ticks 500–3,500, subtle horizontal grid, bottom-center legend "Training score" / "Validation score". All dark text, clearly readable.
      Data: training curve in brand green #009E73 falling from 98.5 % to 94.3 %, with a light green ±1 std band; validation curve in Imprint purple rising from 76 % to 92.8 % with a wide lavender band at small sizes narrowing to the right. 10 filled circle markers per line, ringed in page color. Bands translucent; where they meet near 3,000–3,600 both stay visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, axis labels, tick labels and legend text all light ink, clearly readable; grid lines subtle but visible. No dark-on-dark text.
      Data: same green and purple data colors as the light render; bands render as dark-tinted translucent fills, marker halos switch to the dark page color. Brand green clearly visible.
      Legibility verdict: PASS
