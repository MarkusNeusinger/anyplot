    fold spread shrinking with more data
  - Per-series valueFormatter gives percentage tooltips in the interactive HTML
  weaknesses:
  - 'CQ-01 (code): the data sits in five parallel arrays (trainSizes, trainMean, trainStd,
    valMean, valStd) instead of the muix Data block — column constants with role comments
    and one `const data` array of records — and the y axis limits are typed (min:
    0.68, max: 1.0) → one record per training size keyed by constants, plot code deriving
    every series from `data`, y limits computed from the data (e.g. min of mean −
    std, padded) or left automatic. Likely cause: the Data block convention of prompts/library/muix.md
    not followed.'
  - 'Suggestion: the band edge hairline is drawn only on the upper edge (the stacked
    width series); an outline on both edges, or none, would make the bands symmetric.'
