  - Confidence-band technique via paired hidden-fill datasets is clean and idiomatic
    for Chart.js, with band entries correctly filtered out of the legend
  - Data tells a clear, textbook bias-variance story (converging curves, shrinking
    variance) using a plausible ML scenario
  - Theme handling is correct in both renders - identical data colors, correctly flipped
    chrome, no legibility failures
  - Correct Imprint palette assignment (brand green first, canonical second color
    for the second series)
  weaknesses:
  - Design Excellence is closer to a well-executed default than fully publication-ready
    - a subtle annotation near the convergence region could push DE-01/DE-03 higher
  - Title occupies less width than the mandated-title norm - not a defect, but there
    is room to size it slightly larger without risking overflow
