review:
  strengths:
  - Correctly hand-builds the ogive step polyline (flat-then-rise at each bin edge)
    since Makie has no native cumulative-histogram primitive — follows the library's
    no-workaround rule instead of faking it with hist!/stephist!
  - Theme-adaptive chrome is fully threaded through (INK/INK_SOFT tokens, RGBAf alpha
    grid, spine visibility) and both renders keep the same brand-green data color
    with only chrome flipping
  - Realistic, plausible e-commerce delivery-time dataset (right-skewed lognormal-ish,
    1400 orders) that fits the domain naturally
  - Correct canvas (3200×1800), correct title format, subtle area fill under the curve
    adds polish without clutter
  weaknesses:
  - No reference markers (e.g. median or 95th-percentile guide line) despite the spec
    explicitly calling out percentile-reading as a primary application — would strengthen
    data storytelling (DE-03)
  - Library usage is solid but generic for Makie — band!+lines! is the same approach
    any plotting library would use, no Makie-distinctive feature (LM-02) is showcased
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: title "histogram-cumulative · julia · makie · anyplot.ai" in bold dark ink, centered, clearly readable; x-axis "Delivery Time (hours)" and y-axis "Cumulative Proportion of Orders" labels in dark ink; tick labels in soft grey-brown; horizontal gridlines at 0.25 intervals, subtle and unobtrusive; top/right spines removed.
      Data: single brand-green (#009E73) step line (ogive) rising monotonically from 0 at ~5 hours to 1.0 at ~70 hours, with a light green alpha-filled area beneath it. Step shape correctly shows flat-within-bin, rise-at-edge behavior.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: same title now in light/off-white ink, clearly legible; axis labels in light ink; tick labels in light grey; gridlines subtle white-on-dark at low alpha; spines matching the soft ink token.
      Data: identical brand-green (#009E73) step line and fill — same shape, same color as the light render, confirming data colors are theme-invariant.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues; all text and data elements are clearly distinguishable from the background.
