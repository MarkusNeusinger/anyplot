review:
  strengths:
  - Native Makie `stairs!` recipe (step = :pre) replaces the hand-rolled polyline,
    directly addressing the prior LM-02 feedback with a library-idiomatic step-plot
    primitive
  - 'Median reference guide (dashed lines + inline "Median: 27.3h" label) gives the
    viewer a concrete percentile read, directly tying to the spec''s percentile-reading
    application and fixing the prior DE-03 gap'
  - Theme-adaptive chrome fully threaded through (INK/INK_SOFT tokens, RGBAf alpha
    grid, spine visibility); brand green identical between light/dark renders
  - Realistic, plausible e-commerce delivery-time dataset (right-skewed, 1400 orders,
    99th-percentile-clipped axis) with correct 3200x1800 canvas and mandated title
    format
  weaknesses:
  - Composition is still essentially a single-color step curve plus one annotation;
    beyond the new median guide there's limited additional visual hierarchy (e.g.
    no secondary 90th/95th percentile marker) despite the spec's broader emphasis
    on percentile positions
  - stairs! plus dashed guide-lines are useful but not deeply distinctive versus other
    libraries' step/fill-between equivalents - a more uniquely-Makie touch (annotated
    markers, layered inset, axis interval highlight) would push Library Mastery further
  image_description: |-
