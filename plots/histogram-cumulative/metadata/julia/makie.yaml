      Data: Single brand-green (#009E73) stairs step curve (Makie stairs! recipe, step=:pre) rising monotonically from ~0 near 5h to 1.0 near 70h, with a light green (12% alpha) fill under the curve. A dashed median reference guide (horizontal to the curve at y=0.5, vertical down to the x-axis) with inline label "Median: 27.3h" sits cleanly beside the curve without overlapping it.
