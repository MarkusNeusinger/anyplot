review:
  strengths:
  - Native ax.hist(cumulative=True, density=True) in histtype='step' over 'stepfilled'
    shows 30 discrete bins rising to 1.0
  - Percentile guides with computed values at each crossing
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'VQ-05 (both): canvas is 4766x2670, not a canonical size → 3200x1800 (-1566 x
    -870). Likely cause: figsize=(16, 9) with savefig dpi=300 and bbox_inches=''tight'';
    use figsize=(8, 4.5), dpi=400 and no bbox_inches.'
  - 'SC-04 (both): title ''histogram-cumulative · matplotlib · anyplot.ai'' lacks
    the language segment → ''histogram-cumulative · python · matplotlib · anyplot.ai''.
    Likely cause: the set_title string.'
  - 'VQ-02 (both): the violet reference lines cross the percentile label boxes (the
    58.4 vertical through the 75th and 90th boxes) → place each box clear of the dashed
    lines. Likely cause: the hand-set xytext positions for p == 75 and p == 90.'
  - 'CQ-01 (code): line 32 ends the Data block with `scores = np.clip(scores, 0, 100)`,
    not a statement that binds df, there is no column constant for the numeric role,
    and line 40 plots `scores` from the Data block → one Data block ending in df with
    a SCORE column constant, read only df below it. Likely cause: the data is kept
    as a bare array.'
  - 'CQ-04 (code): `n, bins, patches` on line 39 are never used and the `if leg:`
    guard on line 102 can never be false → drop the assignment and the guard. Likely
    cause: leftover scaffolding.'
  - 'Suggestion: the 75th and 90th labels sit far left of their crossings; anchoring
    them closer would tie each label to its point.'
