review:
  strengths:
  - sns.histplot(cumulative=True, stat='proportion', element='step') computes the
    running proportion natively; no hand-written binning or cumsum
  - Theme tokens threaded through set_theme rc so chrome flips cleanly while the brand-green
    data stays identical in both renders
  - Tidy df with a column constant whose value doubles as the x-axis title ('Transaction
    amount ($)')
  - Exact 3200x1800 canvas from figsize=(8, 4.5) at dpi 400 with style-guide font
    sizes
  weaknesses:
  - 'Suggestion: a slightly lower fill alpha (about 0.45) would let the step edge
    carry the bins more clearly against the large filled area.'
