review:
  strengths:
  - 'Correct cumulative step function: each bin''s level is the running total to its
    upper edge, rising monotonically from 0 to the full sample of 500'
  - Theme tokens threaded through every chrome element; both renders readable with
    identical brand-green data marks
  - Canvas and margins follow the bokeh prompt exactly (3200x1800, toolbar off, min_border
    reservations), so nothing is clipped
  - Adaptable data block with named column constants, read through ColumnDataSource
  weaknesses:
  - 'CQ-04 (code): lines 53-60 build the step outline by hand and lines 62-63 duplicate
    it as a closed polygon for the fill, which bokeh''s own glyphs draw → p.step(x=bin_edges,
    y=np.r_[0, cumulative_counts], mode="before") for the outline and p.varea_step(x=bin_edges,
    y1=0, y2=np.r_[0, cumulative_counts], step_mode="before") for the fill. Likely
    cause: a hand-rolled step loop plus patch() instead of the step glyphs.'
  - 'Suggestion: a cumulative-proportion secondary axis (bokeh extra_y_ranges) would
    let readers read percentiles directly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, plot area and border alike, thin INK_SOFT outline
