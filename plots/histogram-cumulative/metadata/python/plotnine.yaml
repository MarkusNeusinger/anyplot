  strengths:
  - Cumulative counts computed with np.histogram + np.cumsum and drawn as adjacent
    bars, so every bin's running total reads directly and the last level hits n =
    450
  - Y breaks end exactly at the sample total, making the full count visible on the
    axis
  - 'Theme tokens threaded through every chrome element; both renders are fully legible
    with identical #009E73 bars'
  - Median quartile line weighted heavier than Q1/Q3, giving the 'share below X' reading
    a focal point
  weaknesses:
  - 'Suggestion: place the quartile lines at np.quantile(df[SHELF_LIFE], QUARTILES)
    instead of the containing bin''s centre, so they sit at the true quartile values.'
  - 'Suggestion: a break at 450 right after 400 makes the top tick spacing uneven;
    a minor tick style or 50-step breaks would even it out.'
