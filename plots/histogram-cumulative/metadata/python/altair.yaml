review:
  strengths:
  - Native step-after interpolation on mark_area draws the cumulative histogram as
    clean contiguous steps, so every bin stays readable in the shape (C3)
  - Y axis fixed at 0 to 1 and labelled 'Cumulative Proportion', reaching 1.0 at the
    top of the data (C2)
  - 'Theme tokens threaded through axis, title and view config: both renders are fully
    legible, with brand green #009E73 identical in light and dark'
  - Multi-field tooltip (usage, cumulative % formatted as percent, raw count) adds
    real inspection value in the HTML output
  - 'Adaptable zone layout: column constants with role comments, escaped Vega-Lite
    field names, a data block that binds df, and pad-only canvas fitting to exactly
    3200x1800'
  - Realistic bimodal household electricity scenario (two usage groups around 250
    and 450 kWh) that makes the steep-then-flattening rise meaningful
  weaknesses:
  - 'SC-03 (both): the last bin (about 685–705 kWh) has no drawn level: the step area
    ends at the last bin''s left edge while the x scale runs to the last bin''s upper
    edge, leaving an empty strip at the right → draw a level for all 30 bins up to
    bin_edges[-1] (+1 point at x = bin_edges[-1]). Likely cause: the steps frame uses
    edges[:-1] only, and step-after stops at the final point.'
  - 'DE-02 (both): all four sides of the plot are framed by an INK_SOFT view stroke
    where nothing in this plot type requires an enclosed frame → L-shaped axes only
    (remove the top and right border). Likely cause: configure_view(stroke=INK_SOFT).'
  - 'Suggestion: a light percentile reading aid (for example tick values at quartiles)
    could make the ''what share is below X'' use more direct.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, the chart centred on the 3200x1800 canvas with even padding.
      Chrome: title "histogram-cumulative · python · altair · anyplot.ai" in dark ink, about 47 % of the width; x-axis "Electricity Usage (kWh)" with ticks 100–700 every 50; y-axis "Cumulative Proportion" 0.0–1.0 every 0.1; subtle grid; a thin dark frame on all four sides. All text clearly readable.
      Data: brand green #009E73 step area (opacity 0.8) with a solid green step outline, 30 bins rising from ~0 at 80 kWh to 1.0 by ~620 kWh; steep rise around 200–300 kWh, flattening above 500. The area ends at ~685 kWh while the axis continues to ~705, leaving a narrow empty strip at the right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, tick labels in light grey; grid subtle but visible; light frame on all four sides. No dark-on-dark text.
      Data: identical #009E73 green step area and outline as in the light render; only chrome flipped.
      Legibility verdict: PASS
