quality_score: 86
review:
  strengths:
  - Uses Plotly's native go.Histogram with cumulative=dict(enabled=True) and histnorm='percent',
    so binning, accumulation and normalization are computed by the library and the
    levels reach exactly 100 % at the last bin
  - Contiguous adjacent bars with no gaps keep every bin readable as a discrete step
    while the shape rises monotonically from 0
  - 'Theme tokens are threaded through every chrome element: title and axis titles
    in INK, ticks and legend text in INK_SOFT, guides in INK_SOFT, legend on ELEVATED_BG;
    both renders read cleanly'
  - Quartile drop lines run from each marker to both axes, so the 25/50/75 % score
    thresholds can be read directly off the x and y axes
  - hovertemplate gives score threshold and cumulative percentage per bin in the HTML
    view
  - 'Clean adaptable structure: theme tokens, column constant, data block, plot block
    reading only df; all imports used, seeded default_rng'
  weaknesses:
  - 'VQ-02 (both): the "50%" label sits across the top-left corner of the 65–70 bin
    and the "75%" label clips into the left edge of the 80–85 bin, so part of each
    label is drawn over the green bars → keep the labels on the page background clear
    of the bars. Likely cause: textposition="top left" with the 11 px textfont on
    markers that sit inside the bars.'
  - 'Suggestion: a single-series legend reading "Cumulative distribution" repeats
    what the y-axis title already says; it could be dropped to free the upper-left
    corner.'
  - 'Suggestion: a marker fill in the page color would make the quartile markers read
    as hollow targets instead of green-on-green.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on paper and plot area, 3200x1800.
