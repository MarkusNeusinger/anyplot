      Data: brand green #009E73 adjacent cumulative bars in 5-point bins from 25 to 100, rising monotonically from ~0 % to 100 % at the last bin. Dashed INK_SOFT drop lines from the 25/50/75 % quartile markers (ink outline) to both axes, labelled "25%", "50%", "75%"; the 50 % and 75 % labels partly overlap the bar tops.
