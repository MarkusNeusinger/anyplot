review:
  strengths:
  - Correct ogive/cumulative-histogram construction (step-area, monotonic, anchored
    at 0, reaching total sample size)
  - 'Imprint palette compliance: first series is #009E73 in both themes; theme-adaptive
    chrome (background, text, grid) is correct in both light and dark'
  - Deterministic seeded data generation via LCG, matching the library's browser-RNG
    convention
  - Custom tooltip formatter reporting both cumulative count and percentage - directly
    serves the spec's 'what proportion falls below X' use case
  - Clean, idiomatic Highcharts config (animation:false, credits:false, transparent
    background, no explicit width/height)
  weaknesses:
  - Design feels like a well-configured default rather than a distinctive/publication-ready
    chart - no threshold or percentile annotation despite the spec explicitly calling
    out percentile/VaR use cases
  - Doesn't use a Highcharts-distinctive feature; a plotLines marker (e.g. median
    or p90 delivery time) with a label, or a secondary axis showing cumulative percentage,
    would strengthen both Library Mastery and Data Storytelling
  - 'Minor: default xAxis right-side padding leaves the area fill flat past the last
    data point, wasting canvas width - consider setting an explicit xAxis.max near
    the last data point'
  image_description: |-
