review:
  strengths:
  - P90 threshold plotLine with a clear dashed amber label ties directly into the
    spec's percentile/VaR use case and gives the chart a strong focal point.
  - 'Correct step-area (step: "left") ogive shape: monotonically increasing, anchored
    at zero on the first bin edge, reaching the full sample size (600) at the last
    bin.'
  - 'Theme-adaptive chrome is fully correct: identical #009E73 data color and fill
    across light/dark, backgrounds are theme-appropriate, all text readable in both
    renders.'
  - Realistic, neutral delivery-time dataset (mean 38 min, std 11 min, floor at 5
    min) with a plausible right-tapering normal-ish shape and correctly business-framed
    axis labels.
  weaknesses:
  - Design Excellence leans on Highcharts defaults outside of the P90 marker — grid,
    chrome, and area fill are stock styling; a more deliberate grid/whitespace treatment
    would lift DE-02 beyond 'minimal customization'.
  - The plotLine + label threshold marker is a pattern easily replicated in most other
    libraries (axvline/markLine equivalents) — leaning on a more Highcharts-distinctive
    capability would raise Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-cumulative · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible. X-axis title "Delivery Time (minutes)" and Y-axis title "Cumulative Deliveries" both dark-gray/ink-soft and legible. Tick labels on both axes readable. Horizontal grid lines are subtle. Amber dashed vertical plotLine at ~51 min with rotated label "P90: 51.0 min" sits in the open background area above the curve's plateau — no overlap with other text or the fill.
      Data: Green (#009E73) step line with light green area fill (~25% opacity) forming a correct monotonically increasing ogive shape, starting at 0 and reaching 600 (the full sample size) near the right edge.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light/white text, clearly legible against the dark background. Grid lines remain subtle but visible. The same amber dashed plotLine and rotated "P90: 51.0 min" label are present and legible.
      Data: Same #009E73 green line and area fill as the light render — data colors are identical between themes, only the chrome (background, text, grid) has flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements are clearly distinguishable from the near-black background.
