    a markLine at the 50th-percentile crossing, a markPoint calling out the median
    processing time, or a gradient fill on itemStyle.color) that couldn''t be trivially
    replicated in another bar-chart library'
  - 'Data Storytelling is default-level: the S-curve shape is informative but nothing
    in the chart calls out the insight (e.g. annotate or markLine the point where
    the curve crosses 50%, which would show viewers the median processing time at
    a glance)'
  - 'Aesthetic Sophistication is at ''well-configured default'' tier: a single flat
    green fill with rounded top corners is clean but not yet publication-grade — consider
    a subtle vertical gradient (t.palette[0] to a lighter/darker stop) or a thin lighter
    top edge on each bar for more depth'
  - X-axis category labels are the raw rounded bin edges (7, 13, 18, 24, ...) with
    irregular gaps between shown ticks (interval:1) — consider using evenly spaced
