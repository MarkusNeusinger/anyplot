review:
  strengths:
  - Idiomatic d3.bin() + curveStepAfter combination produces a correct, crisp monotonic
    cumulative step function, overlaid with a muted context histogram — a genuinely
    useful dual-encoding of the same data.
  - 'Palette compliance and theme-adaptive chrome are correct and consistent: palette[0]
    green identical in both renders, exact #FAF8F1/#1A1A17 backgrounds, only chrome
    flips.'
  - Deterministic LCG-seeded exponential draws produce a realistic, neutral, well-scaled
    call-center wait-time scenario.
  - Clean, KISS-structured code (no functions/classes), no fake interactivity, correct
    mount-node contract with no animation.
  weaknesses:
  - The x-domain is stretched to the single sample's max draw (maxWait = ceil(d3.max(waitTimes)/10)*10),
    producing a long flat tail (roughly the right 55-60% of the plot width, from ~150s
    to ~320s) that carries no information once the curve reaches ~100% — wastes canvas
    real estate and dilutes the visual story. Cap the x-domain near the 99th percentile
    of waitTimes (or a fixed multiple of MEAN_WAIT) so the informative 0-150s region
    fills more of the plot.
  - 'In the dark render, the muted ''Calls per bin'' histogram bars (t.muted at opacity
    0.45) are nearly indistinguishable from the near-black #1A1A17 page background,
    especially the tall first bin — the secondary encoding is much harder to read
    in dark mode than in light mode. Use a lighter fill or higher opacity for the
    muted bars specifically in dark theme so the context histogram stays legible in
    both themes.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 as required.
      Chrome: Title "Call Center Wait Times · histogram-cumulative · javascript · d3 · anyplot.ai" is dark, bold, centered, clearly readable. X-axis label "Call Wait Time (seconds)" and y-axis label "Cumulative Share of Calls" are dark ink, legible. Tick labels ("0s"..."300s", "0%"..."100%") are dark gray and readable. Subtle horizontal gridlines at 0/20/40/60/80/100%. Legend top-right ("Cumulative %" swatch in green, "Calls per bin" swatch in gray) is legible.
      Data: First series (cumulative step curve + area fill) is the Imprint green #009E73, both the solid step line and the 16%-opacity area fill beneath it. Secondary series (per-bin call counts) is a muted gray bar at the back, tallest at the first bin (~40%) and decaying to near-zero past ~140s, consistent with a right-skewed exponential distribution. The step curve rises quickly, reaches ~90% by 80s, and flattens near 100% by ~150s, with a long flat tail out to ~320s.
      Legibility verdict: PASS — no light-on-light issues, all text and both data series clearly distinguishable from the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 as required.
      Chrome: Title, axis labels, and tick labels all render in light/white text, clearly visible against the dark background — no dark-on-dark failures on any text element. Gridlines are subtle but visible. Legend text and swatches are legible.
      Data: Cumulative step curve and area fill use the identical Imprint green #009E73 as the light render — confirmed unchanged data color between themes. The muted gray "Calls per bin" histogram bars, however, render very dark (a desaturated near-black green) and blend closely into the near-black #1A1A17 background, making the first (tallest) bar hard to distinguish from empty background — this is a real but secondary legibility issue (see weaknesses), not a dark-on-dark TEXT failure.
      Legibility verdict: PASS for all text; PARTIAL for the secondary histogram-bar data series, which is markedly less visible in dark mode than in light mode.
