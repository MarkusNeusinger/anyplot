review:
  strengths:
  - 'Correct ogive semantics: half-open bins, one level per bin at the running share
    up to its upper edge, drawn with curve: "stepBefore" plus a leading 0 so each
    step spans exactly its bin and the last level reaches 100 %.'
  - Y axis pinned to 0-100 % and labelled "Cumulative share (%)"; x ticks fall on
    every bin edge, so the discrete bins stay readable.
  - Theme handled through window.ANYPLOT_TOKENS throughout (title, subtitle, ticks,
    grid, reference line); both renders fully legible with identical data color.
  - 'Idiomatic MUI X v9: LineChart with area, skipAnimation, hideLegend, sized axis
    bands (height 64, width 72) and v9 per-chart CSS classes (.MuiLineChart-area,
    .MuiLineChart-line, .MuiChartsGrid-line).'
  - Native ChartsReferenceLine for the median and a percent valueFormatter that serves
    the interactive HTML tooltip.
  - Plausible, neutral scenario (call-centre wait times, log-normal, n = 1,200) with
    a deterministic LCG; bin width derived from the data via a 1-2-2.5-5 rounding.
  weaknesses:
  - 'Suggestion: the mandated title fills only about a third of the width; a slightly
    larger title size (about 26 px) would give the header more presence.'
  - 'Suggestion: the top five bins sit within a pixel or two of the 100 % frame line;
    a little top padding above the plot area would keep the final steps from merging
    with the frame.'
  image_description: |-
