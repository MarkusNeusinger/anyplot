review:
  strengths:
  - Correct implementation of a cumulative histogram as a stepAfter area curve with
    a monotonically non-decreasing 0-100% scale — matches the ogive convention from
    the spec exactly.
  - 'Fully theme-adaptive: brand green (#009E73) data color is identical in both renders,
    and all chrome (title, axis labels, tick labels, grid) reads clearly against both
    #FAF8F1 and #1A1A17 backgrounds.'
  - Deterministic, realistic data generation (log-normal call-center wait times via
    a seeded LCG) with the single-series legend correctly hidden per the style guide.
  - Clean, idiomatic MUI X usage — curve="stepAfter" + area fill, custom margins,
    sx overrides for stroke/fill opacity, and correct skipAnimation + default-export
    component contract.
  weaknesses:
  - X-axis auto-generates a tick at every 0.5-minute increment (0.0, 0.5, 1.0 ...
    12.0 — 25 labels total), which will crowd and become illegible once the image
    is scaled down to the ~400px mobile srcset variant; constrain the tick count (e.g.
    explicit tickInterval / tickNumber limiting to whole-minute labels) so the mobile
    render stays legible.
  - Styling stays close to MUI X defaults beyond the single-series color/opacity tweak
    — no reference-line or annotation (e.g. marking the median or a notable percentile
    threshold) to give the chart a stronger focal point beyond the plain step shape.
  - Library-mastery surface used is minimal (curve/area/valueFormatter only) — consider
    a ChartsReferenceLine or similar community-surface feature to better showcase
    MUI X's distinctive capabilities for this dataset.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-cumulative · javascript · muix · anyplot.ai" in dark ink, centered, clearly legible. Axis labels "Wait Time Before Answer (minutes)" (x) and "Cumulative Calls Answered (%)" (y) in dark, medium-weight text. Tick labels (0.0-12.0 on x in 0.5 increments; 0-100 on y in 10s) all dark and readable. Horizontal grid lines are thin and subtle, don't compete with the data.
      Data: Single brand-green (#009E73) step line with a light green area fill beneath (fillOpacity ~0.18), rising steeply between 1-4 minutes then flattening as it approaches 100% by ~9 minutes. No legend shown (correct, single series).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels rendered in light ink (near-white), clearly legible against the dark surface. Tick labels also light-colored and readable. Grid lines are subtle light-on-dark hairlines, visible but not dominant.
      Data: Same brand-green (#009E73) step line and area fill as the light render — the green line reads as a bright, high-contrast accent against the dark background; the semi-transparent fill takes on a dark teal cast from blending with the near-black background, which is expected and not a defect.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text remains fully legible.
