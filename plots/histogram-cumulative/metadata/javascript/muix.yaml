review:
  strengths:
  - 'Both attempt-1 weaknesses are fixed: x-axis ticks are now pinned to whole-minute
    values via tickInterval: binEdges (13 labels instead of 25 auto-generated 0.5-min
    ticks), removing the mobile-crowding risk, and a ChartsReferenceLine now marks
    the median wait time as a clear focal point.'
  - Correct cumulative histogram (ogive) as a stepAfter area curve with a monotonically
    non-decreasing 0-100% scale, matching the spec's ogive convention exactly.
  - 'Fully theme-adaptive: brand green (#009E73) data color and area fill are identical
    in both renders; all chrome (title, axis labels, tick labels, grid, reference-line
    label) reads clearly against both #FAF8F1 and #1A1A17 backgrounds.'
  - Deterministic, realistic data generation (log-normal call-center wait times via
    a seeded LCG) with the single-series legend correctly hidden per the style guide.
  - 'Clean, idiomatic MUI X usage: curve="stepAfter" + area fill, ChartsReferenceLine
    with dashed styling from inkSoft token, custom margins, sx overrides, and correct
    skipAnimation + default-export component contract.'
  weaknesses:
  - Styling is still fairly close to MUI X defaults beyond the color/opacity tweak
    and the new reference line — no additional distinctive community-surface feature
    (e.g. a second reference line for a notable percentile like p90, or a subtle gradient
    on the area fill) to further elevate aesthetic sophistication.
  - Only one annotation (the median reference line) is used to build hierarchy; a
    second callout (e.g. labeling the ~5-minute point where the curve crosses ~97%)
    would strengthen the data-storytelling focal point further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-cumulative · javascript · muix · anyplot.ai" in dark ink, centered, clearly legible. Axis labels "Wait Time Before Answer (minutes)" (x) and "Cumulative Calls Answered (%)" (y) in dark, medium-weight text. X-axis now shows whole-minute ticks only (0.0-12.0 in 1.0 steps, 13 labels) — no more crowding from the previous 0.5-min increments. Y-axis ticks 0-100 in 10s. Horizontal grid lines are thin and subtle. A dashed vertical reference line at x≈2.2 with label "Median: 2.2 min" in muted ink is clearly readable and does not overlap the step curve.
      Data: Single brand-green (#009E73) stepAfter line with a light green area fill beneath (fillOpacity ~0.18), rising steeply between 1-4 minutes then flattening as it approaches 100% by ~9 minutes. No legend shown (correct, single series).
      Legibility verdict: PASS — all text, including the new reference-line label, is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels rendered in light ink (near-white), clearly legible against the dark surface. Tick labels also light-colored and readable, with the same reduced whole-minute tick set as the light render. Grid lines are subtle light-on-dark hairlines. The dashed median reference line and its "Median: 2.2 min" label render in a muted light gray, fully legible against the dark background — no dark-on-dark failure.
      Data: Same brand-green (#009E73) step line and area fill as the light render — the green line reads as a bright, high-contrast accent against the dark background; the semi-transparent fill takes on a dark teal cast from blending with the near-black background, which is expected and not a defect.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/annotation text remains fully legible.
