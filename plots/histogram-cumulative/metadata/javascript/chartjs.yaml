review:
  strengths:
  - 'Correct plot type: zero-gap bars (barPercentage/categoryPercentage = 1.0) render
    a genuine step function reaching the plateau at 100%, matching the spec''s ''often
    displayed as steps'' note for an ogive.'
  - 'Deterministic, realistic data: fixed-seed LCG generates a right-skewed lognormal-like
    delivery-time distribution, a plausible and neutral real-world scenario.'
  - 'Clean theme-adaptive chrome: correct off-white/near-black backgrounds, all text
    legible in both themes, first series uses Imprint brand green (#009E73), y-axis
    locked to 0-1 with %-formatted ticks.'
  - Title matches the exact mandated format, x-grid intentionally suppressed while
    y-grid stays subtle, and axis titles are descriptive with units (minutes / cumulative
    share).
  weaknesses:
  - The cumulative curve reaches ~95-100% by roughly the 40% mark of the x-axis, leaving
    a long, almost-featureless flat plateau across the remaining ~60% of the chart
    width — consider trimming the bin range near the observed max or using fewer/wider
    tail bins so the informative S-curve region gets more horizontal space.
  - 'Library usage is generic (plain bar chart with zero gaps) rather than showcasing
    a distinctive Chart.js feature — e.g. a stepped line (`type: ''line'', stepped:
    true, fill: ''origin''`) or an annotation marking a specific percentile (median/p90),
    which would also strengthen data storytelling given the spec explicitly calls
    out percentile visualization as an application.'
  - Visual treatment is a single solid, fully-opaque fill block; a slightly softer
    treatment (e.g. a visible step outline plus a lower-alpha fill) would reduce the
    'wall of color' heaviness and read as more refined.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-cumulative · javascript · chartjs · anyplot.ai" in dark ink at top, comfortably sized (~35-40% of plot width). X-axis title "Delivery Time (minutes)" and y-axis title "Cumulative Share of Deliveries" both in dark ink, clearly legible. Tick labels (bin ranges "0-5" ... "105-110" on x, "0%".."100%" on y) in a softer gray-brown, all fully readable, evenly spaced with no overlap or rotation needed. Subtle horizontal gridlines only (x-axis gridlines intentionally removed).
      Data: Solid brand-green (#009E73) fill forming a step/ogive shape — near-zero at the left, rising steeply through the 10-40 minute bins, then flattening to a plateau near 100% for the remaining bins out to 105-110. Steps are clearly visible at each bin boundary.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, clearly legible against the dark background. Gridlines remain subtle but visible (thin, low-contrast horizontal lines only).
      Data: Identical brand-green (#009E73) fill and step shape as the light render — same bin boundaries, same plateau starting point, confirming data colors are unchanged between themes; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and tick text is clearly visible against the near-black background.
