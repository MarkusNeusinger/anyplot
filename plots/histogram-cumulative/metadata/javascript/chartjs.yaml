review:
  strengths:
  - 'Directly addresses all three attempt-1 weaknesses: the tail is now trimmed to
    the 96th percentile with a collapsed overflow bin, so the informative S-curve
    rise occupies most of the chart width instead of a long flat plateau.'
  - 'Replaced the solid zero-gap bar workaround with an idiomatic stepped line (`stepped:
    ''after''`, `fill: ''origin''`) at low-alpha fill, giving the ogive a lighter,
    more refined look while staying a genuine step function.'
  - Custom `afterDraw` plugin draws a dashed p90 guide line and label directly against
    the chart's own scales — a real distinctive Chart.js technique (not a community
    plugin) that gives the chart a clear percentile-threshold focal point, exactly
    answering the spec's 'what percentage is below X?' application.
  - 'Deterministic, realistic data: fixed-seed LCG produces a right-skewed, lognormal-like
    package-delivery-time distribution; nearest-rank percentile computed on the raw
    sample (not the coarser bins) for an accurate p90 marker.'
  - 'Theme-adaptive chrome is clean in both renders: correct backgrounds, all text
    legible, first series is Imprint brand green, y-axis locked to 0-1 with %-formatted
    ticks, title matches the exact mandated format.'
  weaknesses:
  - The p90 label uses the amber anchor color on the light (#FAF8F1) background, which
    the style guide itself flags as sitting below the 3:1 WCAG contrast threshold
    for that combination — legible here due to the bold 600-weight font, but worth
    keeping an eye on if the annotation text ever gets smaller.
  - The synthetic overflow bin label '50+' collapses all values above the 96th percentile
    into a single wide bin; this is a reasonable trade-off for spacing but slightly
    understates the shape of the true tail compared to continuing uniform bins.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white and not dark.
      Chrome: title "histogram-cumulative · javascript · chartjs · anyplot.ai" in dark ink at top, comfortably sized (~55-60% width). Axis titles "Delivery Time (minutes)" (x) and "Cumulative Share of Deliveries" (y) are dark and legible; tick labels (bin ranges 0-5...55+ on x, 0%-100% on y) are a softer gray-brown, all readable with no overlap. Horizontal gridlines are subtle; x-axis gridlines are intentionally hidden.
      Data: a stepped brand-green (#009E73) line with a low-alpha green fill beneath it forms the ogive: near-zero on the left, rising steadily through the 10-40 minute bins, reaching 100% at the final bin. A dashed amber guide line marks the p90 threshold (~46 min) with a bold amber label near the top-right, positioned clear of the title and other text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black and not light.
      Chrome: same title, axis titles, and tick labels now rendered in light/off-white ink, clearly legible against the dark surface; gridlines remain subtle and visible.
      Data: the stepped line and fill are the same brand-green as light mode (identical data color, confirming only chrome flips), now reading as a bright mint-green line over a darker green fill area. The dashed amber guide line and "p90 ≈ 46 min" label are clearly visible against the dark background — no dark-on-dark failure.
      Legibility verdict: PASS
