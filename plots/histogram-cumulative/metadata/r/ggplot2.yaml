review:
  strengths:
  - geom_step(direction = "hv") plus geom_point() at each bin's right edge gives a
    crisp, correctly-shaped ogive with clear bin-boundary markers
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded through plot.background, panel.background,
    axis.title, axis.text, and plot.title, so both renders are fully legible with
    identical brand-green data color
  - Realistic, neutral data story (cereal box packaging line targeting 500 g, n =
    600, bin width 3 g) matches the spec's quality-control application example
  - 'Minimal, refined chrome: only major horizontal gridlines, ticks removed, generous
    whitespace, correct 3200x1800 canvas'
  weaknesses:
  - The 'Total (n = 600)' annotate() label is completely invisible in BOTH renders.
    The y-axis panel has no headroom above 600 (the y=600 gridline sits flush against
    the top panel border), and vjust = -0.7 pushes the text block entirely above that
    line, so coord_cartesian's default clip = "on" clips 100% of the glyph pixels
    — nothing renders. Fix by either giving the scale headroom (scale_y_continuous(expand
    = expansion(mult = c(0, 0.08)))) or repositioning the label inside the panel (e.g.
    vjust = 1.4, or hjust = 1, vjust = 1 with y slightly below n_total) so it is verifiably
    visible.
  - Because the total label never renders, the dashed reference geom_hline at y =
    600 has no caption and just duplicates the '600' axis tick with an unexplained
    dashed line — the intended storytelling payoff (labeling the plateau as the full
    sample size) is lost.
  - annotate() call is dead code in its current position (zero visible pixels in either
    theme) — this is the kind of ineffective styling code that should either work
    or be removed.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "histogram-cumulative · r · ggplot2 · anyplot.ai" in dark ink, ~48% of panel width, comfortably sized, not overflowing. Axis titles "Box fill weight (g)" (x) and "Cumulative count" (y) in dark ink, tick labels (480, 500, 520 / 0, 200, 400, 600) in soft dark gray. Only major horizontal gridlines shown, subtle and visible against the background. All text confirmed readable against the light background via pixel-level crop inspection.
      Data: Single brand-green (#009E73) step line (direction="hv") with matching green point markers at each bin's right edge, monotonically increasing from 0 to 600. A dashed green horizontal reference line sits at y=600 but its accompanying "Total (n = 600)" text label is NOT visible anywhere in the render (confirmed by cropping the top-right quadrant and the full top strip at pixel level — no text pixels found near the line).
      Legibility verdict: PASS for all rendered chrome/data text, but the annotate() label is a rendering FAILURE (renders zero pixels, effectively invisible) — flagged as a weakness, not a legibility contrast problem.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title and axis text, now in light ink (#F0EFE8) / soft light gray (#B8B7B0), fully legible against the dark background — no dark-on-dark failures observed. Gridlines are a light, subtle color, visible but not dominant.
      Data: Identical brand-green (#009E73) step line and point markers as the light render — confirmed data colors do not shift between themes. Same dashed reference line at y=600 with the same missing "Total (n = 600)" annotation (confirmed via the same top-right/top-strip crops).
      Legibility verdict: PASS for chrome and data; same annotate() rendering failure as the light render (theme-independent bug, not a dark-mode-specific contrast issue).
