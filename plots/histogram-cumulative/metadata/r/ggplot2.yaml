review:
  strengths:
  - 'Correct step semantics: geom_step(direction = "hv") plus right-bin-edge accumulation
    faithfully render the ogive as a monotonically non-decreasing step function.'
  - Leading-zero anchor point (breaks[1], 0) grounds the step at the histogram's left
    boundary instead of starting mid-air — a thoughtful data-engineering detail.
  - 'Palette and theme-adaptive chrome are fully compliant: brand green #009E73 for
    the single series, correct #FAF8F1/#1A1A17 backgrounds, ink tokens flip correctly
    between themes with identical data color.'
  - Realistic, neutral dataset (cereal box net fill weight around a 500 g target,
    n=600, sd=9) with sensible bin width and scale for a quality-control cumulative-histogram
    use case.
  - 'Minimal, uncluttered theme: vertical gridlines and minor gridlines removed, only
    horizontal major gridlines kept — appropriate for a step-shaped cumulative curve.'
  weaknesses:
  - The dashed geom_hline marking the total sample size (n=600) sits exactly on top
    of the major gridline at y=600 in both renders, so it reads as a plain solid gridline
    rather than a distinguishable 'reaches total' reference — nudge its linewidth/color
    further from the gridline or offset it slightly so the semantic anchor is visible.
  - Step markers (size = 2) are on the small side given only 18 bins (sparse data);
    slightly larger markers (~2.5-3) would better highlight each bin-edge jump per
    the proportional-sizing guidance.
  - No explicit annotation of the total (e.g., 'n = 600') near the plateau, which
    would reinforce the story that the curve reaches the full sample size.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-cumulative · r · ggplot2 · anyplot.ai" in dark ink top-left; axis titles "Box fill weight (g)" (x) and "Cumulative count" (y) in dark ink; tick labels (480/500/520 and 0/200/400/600) in a softer gray-brown ink. All clearly legible against the light background.
      Data: Single green (#009E73) step line with circular markers at each bin's right edge, rising monotonically from 0 to 600 across ~470-530 g. A thin horizontal line sits at y=600 (the intended dashed total-reference line, though it visually blends with the gridline at that value).
      Legibility verdict: PASS — no light-on-light or low-contrast text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles rendered in light ink (near-white); tick labels in a lighter soft-gray ink. All elements read clearly against the dark background.
      Data: Same brand green (#009E73) step line and markers, pixel-identical in color and shape to the light render — only the chrome (background, ink, gridlines) inverted as expected.
      Legibility verdict: PASS — no dark-on-dark failures; every label, tick, and title is clearly visible.
