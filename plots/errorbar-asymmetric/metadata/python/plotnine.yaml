    df, with no plotting, styling or theme token inside and no plotting call above
    it. Likely cause: the plot code is not separated from the data generation.'
  - 'CQ-01 (code): has no column constant for the required roles `x`, `y`, `error_lower`,
    `error_upper` → one string constant per required column role above the Data block,
    each with a trailing # role: <role> comment naming a spec role. Likely cause:
