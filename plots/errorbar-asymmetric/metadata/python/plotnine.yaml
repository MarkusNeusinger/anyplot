  - 'DQ-02 (both): groups labelled ''Treatment A''-''Treatment D'' read as generic
    → named, plausible treatments or factor levels. Likely cause: the treatments list.'
  - 'CQ-01 (code): line 38 opens the Data block with no column-0 # Plot marker after
