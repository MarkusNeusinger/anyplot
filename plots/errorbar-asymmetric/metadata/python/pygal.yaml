review:
  strengths:
  - 'Correct asymmetric error bars on pygal.XY: each arm built from its own error
    value, caps at both ends, round markers distinct from the bars'
  - Legend states the bounds ('Median (10th-90th percentile)') and the title follows
    the mandated format
  - 'Theme tokens threaded through Style: correct backgrounds and readable chrome
    in both renders, one brand green for every mark'
  - Value range computed from the bounds, so every error bar fits with padding
  weaknesses:
  - 'VQ-03 (both): whiskers and caps render at about 2.5 px on the 3200 px canvas,
    thin beside the 16 px markers, and the caps are not thicker than the bars as intended
    → about 5 px bars and 7-8 px caps (+3 to +5 px). Likely cause: the per-series
    stroke_style widths lose to the Style stroke_width=2.5 rule on the .line.reactive
    paths; raise Style stroke_width or set the widths where they take effect.'
  - 'VQ-03 (both): the legend glyph is a tiny square about 10 px wide that does not
    match the round 16 px markers → a glyph sized and shaped like the marks. Likely
    cause: pygal''s default legend box size with legend_font_size=44; set legend_box_size.'
  - 'VQ-01 (both): the 500 y tick is drawn smaller (44 px) than 400/300/200 (56 px),
    so the tick column reads uneven → one size for all y ticks. Likely cause: pygal
    treats 500 as a major label; label_font_size=56 vs major_label_font_size=44.'
  - 'VQ-05 (both): the single legend entry at the bottom leaves an empty band of about
    10 % of the canvas height below it → reclaim the band for the plot area. Likely
    cause: legend_at_bottom=True with the default legend row height.'
  - 'Suggestion: a subtitle or annotation naming the test standard would anchor the
    10th-90th percentile claim.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: title 'errorbar-asymmetric · python · pygal · anyplot.ai' in dark ink at the top; y title 'Tensile Strength (MPa)' rotated, x title 'Material'; y ticks 200-500 with dotted guides (500 drawn smaller than the others); x ticks Steel, Aluminum, Titanium, Copper, Brass, Bronze; legend 'Median (10th-90th percentile)' bottom left with a tiny green square. All text readable.
      Data: six #009E73 round markers at the medians, thin green vertical whiskers and caps at both bounds; arms visibly unequal (Steel longer below, Titanium longer above).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
