review:
  strengths:
  - 'Asymmetric arms read at a glance: thick capped bars with a larger central dot,
    each arm set by its own error column (C1, C2)'
  - Caption states that the bars are the 10th-90th percentile forecast range (C3)
  - Theme tokens threaded through every chrome element; data color identical in both
    renders
  - Native layer_tooltips() exposes quarter, sales and both bounds in the HTML view
  - Column constants and a self-contained data block; y limits derived from the data
  weaknesses:
  - 'DE-02 (both): the panel is framed on all four sides (top and right borders visible)
    and the solid INK_SOFT grid runs on both axes, including vertical lines on the
    4-category x-axis, reading stronger than the style guide''s 15 % rule color →
    keep only the left and bottom axis lines and a y-only grid at rgba(ink, 0.15).
    Likely cause: a panel border kept from theme_minimal()/axis_line on all sides,
    and panel_grid_major=element_line(color=INK_SOFT) applied to x and y.'
  - 'Suggestion: tighten the y-range padding (currently 0.75 × lowest bound to 1.1
    × highest) so the bars use more of the panel height.'
  - 'Suggestion: an open or ink-outlined central marker would separate the point from
    its same-colored bar even more clearly.'
  image_description: |-
