review:
  strengths:
  - Asymmetric arms drawn with matplotlib's native yerr=[lower, upper] pair on top
    of a seaborn scatter, with capped ends and white-edged markers that mark the central
    value clearly in both themes
  - 'Theme tokens threaded through sns.set_theme rc so every chrome element flips
    correctly between #FAF8F1 and #1A1A17 while the Imprint green stays identical'
  - 'Adaptable layout: column constants with role comments, a tidy df Data block and
    a Plot zone that reads only df'
  - Exact 3200x1800 canvas with the library prompt's reference text sizes
  weaknesses:
  - 'DQ-02 (both): the devices are labelled ''Model A'' … ''Model H'', which reads
    as placeholder data → realistic product names for the battery-life scenario (for
    example phone or laptop model names). Likely cause: the DEVICE list in the Data
    block.'
  - 'LM-01 (code): sns.scatterplot is called with x=np.arange(...) and y=df[BATTERY]
    instead of data=df and the column constants, against the library prompt''s Data
    block rule → sns.scatterplot(data=df, x=DEVICE, y=BATTERY, ...) on the categorical
    axis. Likely cause: numeric positions kept for the matplotlib errorbar call (line
    66).'
  - 'Suggestion: drop the vertical grid lines, which run behind every error bar, and
    keep a y-only grid.'
