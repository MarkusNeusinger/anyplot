review:
  strengths:
  - Native asymmetric error bars via error_y(symmetric=False, array=..., arrayminus=...)
    with visible caps at both ends in both themes.
  - 'The bounds'' meaning is stated twice: legend entry ''Median (10th–90th percentile)''
    and a muted caption.'
  - Real, neutral reaction-time scenario whose right-skewed intervals are exactly
    the case asymmetric error bars exist for.
  - Plotly hovertemplate with customdata reports each condition's absolute 10th–90th
    bounds in the HTML view.
  - 'Clean six-zone adaptable file: column constants, a marked Data block, axis range
    derived from the data.'
  weaknesses:
  - 'Suggestion: the y axis starts at 0 while every lower bound sits above 360 ms,
    leaving the lower third of the plot empty; a range from the data''s lower bounds
    would give the intervals more height.'
  - 'Suggestion: ordering or emphasising the conditions by interval width (Fatigued,
    Low contrast) would give the chart a focal point.'
