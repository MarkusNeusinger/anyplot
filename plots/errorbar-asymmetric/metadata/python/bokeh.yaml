review:
  strengths:
  - Uses bokeh's native Whisker annotation with TeeHead caps at both ends, fed from
    one ColumnDataSource, so each arm reaches its own 10th/90th-percentile bound and
    the caps are clearly visible in both themes
  - Markers carry a page-colored ring, so the green median dot reads as distinct from
    the whisker passing behind it and the central value's position between the unequal
    arms is unmistakable
  - The legend states what the bounds represent ('Median forecast · bars span 10th–90th
    percentile') and sits in empty space at the top left without touching any bar
  - 'Theme tokens threaded through every chrome element: all text, the whiskers, the
    legend frame and the y-grid flip correctly while the #009E73 markers stay identical'
  - Data-driven y-range (Range1d from the computed bounds plus 8 % padding) spans
    every error bar; data block and column constants follow the adaptable-code zones
  weaknesses:
  - 'Suggestion: the downside-heavier risk is the story of this data; a lighter tone
    for the upper arm or a subtitle naming the skew could make it the focal point.'
  - 'Suggestion: a HoverTool showing the median, 10th and 90th percentile per quarter
    would add value in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area, no outline frame.
      Chrome: bold near-black title "errorbar-asymmetric · python · bokeh · anyplot.ai" at the top left (~54 % of the width); y-axis label "Revenue forecast ($ millions)", x-axis label "Quarter", ticks 10–20 and Q1 2024 … Q2 2025 in dark grey; subtle horizontal grid only; legend box on #FFFDF6 at the top left. All text clearly readable.
      Data: six #009E73 circular markers with a page-colored ring at the medians; dark-grey (#4A4A44) whiskers with tee caps at both ends; lower arms longer than upper arms in varying ratios; the axis spans every bar (Q1 2024 down to 10, Q2 2025 up to 20.6).
      Legibility verdict: PASS

