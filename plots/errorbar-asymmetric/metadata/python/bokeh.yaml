review:
  strengths:
  - Native bokeh Whisker annotation with TeeHead caps at both ends, driven by lower/upper
    columns derived from the error columns on the shared ColumnDataSource
  - 'Clear hierarchy: neutral INK_SOFT whiskers recede while #009E73 markers with
    a page-colored outline mark each central value unmistakably in both themes'
  - Single legend line states both the estimate and the bound meaning (median, 10th–90th
    percentile)
  - Theme tokens threaded through every chrome element; light and dark renders fully
    legible with identical data colors
  - Realistic downside-skewed revenue-forecast scenario with varying arm ratios
  weaknesses:
  - 'VQ-03 (both): the legend''s marker dot renders at roughly a quarter of the plotted
    40 px markers, so the glyph barely reads beside its 34 pt label → draw it near
    the plotted marker size (about +25 px). Likely cause: bokeh''s legend scales the
    scatter glyph to its default legend size; glyph_width/glyph_height=50 do not enlarge
    the marker — a dedicated legend renderer or LegendItem with a larger scatter is
    needed.'
  - 'Suggestion: add a HoverTool showing median, 10th and 90th percentile per quarter
    for the HTML view.'
  - 'Suggestion: a whisker sample in the legend would explain the bars graphically,
    not only in text.'
