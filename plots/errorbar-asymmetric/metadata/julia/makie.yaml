review:
  strengths:
  - Correct asymmetric error bars with visible caps (whiskerwidth=18); a single clean
    Imprint-green series that stays identical between light and dark renders with
    fully theme-correct chrome
  - Subtitle explicitly states "Bars mark the 10th-90th percentile range (log-normal
    back-transform)", satisfying the spec's request to explain what the asymmetric
    bounds represent
  - Idiomatic Makie usage (errorbars! + scatter!) with full theme-token wiring (INK,
    INK_SOFT, INK_MUTED) across title, subtitle, axis labels, ticks, spines, and grid
  - Realistic, neutral PM2.5 air-quality dataset with sensible domain values (8.6-34.2
    μg/m3) and genuinely varying asymmetry magnitude per station from the log-normal
    transform
  weaknesses:
  - Design Excellence reads as a well-configured application of the library's default
    theme skeleton rather than a distinctive aesthetic choice -- consider a subtle
    accent (e.g. a slightly heavier marker or the amber anchor) on the highest-uncertainty
    or highest-concentration station to lift DE-01/DE-02 beyond the baseline
  - Scatter markers use strokewidth = 0 -- the style guide's Data Element Styling
    section recommends a thin theme-adaptive stroke on markers for definition where
    they sit on top of the error bar line; adding strokewidth ~1-1.5 would sharpen
    the point markers
  - 'LM-02 is generic: errorbars! + scatter! could be replicated near-identically
    in matplotlib or any other library. Leaning on a more Makie-distinctive touch
    (e.g. text! annotations at the extremes, rangebars!, or a recipe-level trick)
    would demonstrate library mastery'
  - Data storytelling relies only on the pre-sorted descending order -- no color/size/annotation
    calls out the highest-uncertainty or highest-concentration station, so the viewer
    has to find the extremes themselves
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "errorbar-asymmetric · julia · makie · anyplot.ai" and muted-gray subtitle "Bars mark the 10th-90th percentile range (log-normal back-transform)" both clearly visible. Y-axis label "PM2.5 Concentration (μg/m³)" and X-axis label "Monitoring Station" in dark ink. Rotated station tick labels (Riverside, Lakeview, Hillcrest, Downtown, Parkside, Eastgate, Westbrook, Northfield) are legible and non-overlapping. Subtle horizontal gridlines only (no vertical grid). L-shaped spine (top/right removed).
      Data: Single series in Imprint brand green (#009E73) -- 8 stations, each a filled circle marker with an asymmetric vertical error bar (visibly wider upper whisker than lower whisker at every station, consistent with the log-normal back-transform described in the subtitle). Values descend left to right from ~34 (Riverside) to ~9 (Northfield).
      Legibility verdict: PASS -- all text reads clearly against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, subtitle, axis labels, and tick labels all render in light ink (white/light-gray) against the dark background -- no dark-on-dark failures observed anywhere (title, subtitle, axis titles, tick labels, gridlines all correctly flipped).
      Data: Same #009E73 green error bars and markers as the light render -- data colors are identical between themes; only the chrome (background, text, grid) flipped, as required.
      Legibility verdict: PASS -- all text reads clearly against the dark background, no dark-on-dark issues found.
