review:
  strengths:
  - 'Critical bug from the previous attempt is fixed: the amber "widest spread" callout
    marker and its numeric text annotation now render correctly in both themes (a
    separate scatter! call avoids the earlier per-point Colorant-vector issue), confirmed
    by direct visual inspection of both PNGs.'
  - Clean asymmetric error bars with visible T-shaped caps (whiskerwidth=18), correct
    Imprint brand-green (#009E73) first-series color, and theme-adaptive marker strokes
    (strokewidth=1.4, strokecolor=PAGE_BG) for definition against the background.
  - 'Genuine data storytelling: the amber-highlighted station plus its numeric annotation
    ("widest spread: +6.7 / −5.5 μg/m³") creates a clear focal point and directly
    explains what the asymmetric bounds represent, beyond the subtitle alone.'
  - Realistic, neutral PM2.5 air-quality dataset where a log-normal back-transform
    produces genuinely varying asymmetric uncertainty per station (8.6–34.2 μg/m³),
    with fully theme-correct chrome and no dark-on-dark/light-on-light failures in
    either render.
  weaknesses:
  - 'LM-02 is still fairly generic: the errorbars! + scatter! + text! combination,
    while now fully functional, doesn''t showcase a truly Makie-distinctive capability
    (e.g. custom recipes, GridLayout composition) — it could be replicated closely
    in matplotlib or ggplot2.'
  - Rotated station-name tick labels and the small annotation text become fairly compressed
    at mobile/thumbnail scale (~400px) — legible at full size, but a slightly larger
    tick/annotation fontsize would hold up better when scaled down.
  - DE-01 aesthetic polish is solid but not exceptional — a single accent color plus
    a subtitle is a modest, not maximal, application of visual hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Bold dark title "errorbar-asymmetric · julia · makie · anyplot.ai" and a muted-gray
        subtitle "Bars mark the 10th–90th percentile range (log-normal back-transform)", both
        clearly readable. Axis labels "Monitoring Station" (x) and "PM2.5 Concentration (μg/m³)"
        (y) are dark ink with units. Rotated station tick labels (Riverside → Northfield) are
        readable. Top/right spines removed, subtle horizontal gridlines only.
      Data: Eight stations, each a brand-green (#009E73) filled circle with a thin theme-adaptive
        stroke, connected to a visibly asymmetric error bar with T-shaped caps (upper whisker
        consistently longer than the lower one, per the log-normal back-transform). The Lakeview
        station's marker is enlarged and colored amber (#DDCC77, the documented semantic-anchor
        color, not a second categorical series), with a text annotation above it reading
        "widest spread: +6.7 / −5.5 μg/m³" — this callout is now clearly visible (it was missing
        entirely in the prior attempt).
      Legibility verdict: PASS — no light-on-light text; all chrome and the callout are readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Title, subtitle, and axis/tick labels correctly flip to light ink — no dark-on-dark
        failures anywhere. Spines and gridlines flip to the same light-ink-at-low-alpha treatment.
      Data: Identical brand-green (#009E73) markers and error bars as the light render — only
        chrome changed. The amber (#DDCC77) highlighted marker on Lakeview and its annotation
        text render correctly here too, confirming the callout fix holds in both themes.
      Legibility verdict: PASS — no dark-on-dark text; the callout is visible and readable.

    Both renders confirmed via direct image inspection; data colors (brand green, amber accent)
    are identical between the two renders, and only background/text/grid chrome flips.
