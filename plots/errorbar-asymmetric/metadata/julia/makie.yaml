review:
  strengths:
  - 'Realistic, domain-appropriate data: the log-normal back-transform genuinely produces
    error_upper > error_lower at every station, directly matching the spec''s suggested
    ''log-transformed data'' use case for asymmetric bounds.'
  - 'Clean minimal chrome: top/right spines removed, subtle 15%-alpha gridlines, generous
    whitespace, and theme-adaptive tokens correctly threaded through both light and
    dark renders with no dark-on-dark or light-on-light failures.'
  - The subtitle ('Bars mark the 10th-90th percentile range...') clearly satisfies
    the spec's requirement to explain what the asymmetric bounds represent.
  - Correct canvas (3200x1800), correct mandated title format, correct brand-green
    (#009E73) first-series color, visible error-bar caps via whiskerwidth.
  weaknesses:
  - 'Critical rendering bug: the ''widest spread'' callout computed in the code (amber
    #DDCC77 marker color + larger markersize=26 for the station with the largest error_upper-error_lower
    gap, plus a text!() annotation reading ''widest spread: +X / -Y ug/m3'') never
    appears in either render. A full pixel scan of plot-light.png and plot-dark.png
    found zero #DDCC77 pixels anywhere, and the region directly above the Lakeview
    error-bar cap (the actual argmax(spread) station for seed 42, independently verified)
    shows a plain default-size green marker with no text nearby. All 8 markers render
    visually identical; the callout is fully absent, not merely faint, small, or edge-clipped.'
  - This means a meaningful chunk of the script's logic (marker_colors, marker_sizes,
    widest, halign, the text! call) is dead code that ships to the catalog claiming
    a feature the rendered PNG does not deliver -- debug why the Colorant-vector color/markersize
    override and text!() call are not taking effect in this Makie/CairoMakie version,
    or remove that block entirely and rely on the subtitle alone (which already satisfies
    the spec's annotation requirement).
  - No visual hierarchy is actually visible in the shipped render since the intended
    callout fails -- every station looks equal, so Data Storytelling stays at generic/default
    level.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec exactly.
      Chrome: Title "errorbar-asymmetric . julia . makie . anyplot.ai" and subtitle "Bars mark the 10th-90th percentile range (log-normal back-transform)" both dark and clearly readable. Axis labels "Monitoring Station" / "PM2.5 Concentration (ug/m3)" dark and legible. X-tick station names (Riverside, Lakeview, Hillcrest, Downtown, Parkside, Eastgate, Westbrook, Northfield) rotated slightly, no overlap. Y-tick numbers legible, subtle horizontal gridlines only (no vertical grid), top/right spines removed.
      Data: All 8 markers and error-bar whiskers render in a single uniform brand green (#009E73) with visible T-shaped caps. No amber/highlighted marker or callout text is visible anywhere in the image -- confirmed by direct pixel scan (zero #DDCC77 pixels found), even though the code computes an amber-highlighted "widest spread" station and an explanatory text annotation.
      Legibility verdict: PASS (all text readable), but the intended widest-spread callout (marker highlight + annotation) is completely absent from the render -- a functional defect, not a legibility one.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec exactly.
      Chrome: Title and subtitle in light ink, clearly readable against the dark background -- no dark-on-dark failures. Axis labels and tick labels use lighter muted tones, fully legible. Spines/gridlines flip correctly to the dark-theme tokens.
      Data: Data colors identical to the light render -- same uniform brand green markers and error bars, confirming color parity between themes. Same absence of the amber callout marker/text, confirmed via pixel scan (zero #DDCC77 pixels in the dark render either).
      Legibility verdict: PASS (all text readable in dark theme), same callout-rendering defect as the light render.
