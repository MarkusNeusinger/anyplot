review:
  strengths:
  - Correctly builds asymmetric error bars via geom_errorbar(ymin = median_mm - error_lower,
    ymax = median_mm + error_upper) with visible caps, exactly matching the spec's
    core requirement
  - Subtitle ('Median annual rainfall with 10th–90th percentile range') clearly explains
    what the asymmetric bounds represent, satisfying the spec's annotation requirement
    without a legend
  - Stations sorted ascending by median value gives the chart a clear visual story
    (dry to wet climates) instead of an arbitrary order
  - Right-skewed rlnorm-based data generation is a thoughtful, realistic way to produce
    genuinely asymmetric percentile ranges, and is explained with an inline comment
  - Theme tokens (PAGE_BG/INK/INK_SOFT) are threaded through consistently; both renders
    are fully legible with correct Imprint brand green (#009E73) and correct light/dark
    backgrounds
  - 'Clean code: all imports used (dplyr, scales::label_comma, ragg device), set.seed(42)
    for reproducibility, no functions/fake UI'
  weaknesses:
  - Aesthetic sophistication is solid but standard (errorbar + coord_flip + sorted
    axis) without an extra distinctive touch such as annotating the percentile range
    on the extreme rows or a custom legend explaining the color
  - No distinctive ggplot2-specific feature beyond idiomatic geom_errorbar/coord_flip/label_comma
    usage — consider a small polish like direct-labeling the two most extreme stations
    to show library mastery
  - Single series only — spec suggests optionally comparing multiple series with different
    colors/markers; acceptable per spec ('consider'), but leaves LM-02/DE-01 headroom
    on the table
  image_description: |-
