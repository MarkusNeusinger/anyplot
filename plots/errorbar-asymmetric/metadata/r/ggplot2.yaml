review:
  strengths:
  - Correctly implements asymmetric error bars via geom_errorbar(aes(ymin = median_mm
    - error_lower, ymax = median_mm + error_upper)), with visibly different upper/lower
    magnitudes across stations due to the right-skewed lognormal sampling
  - Stations sorted ascending by median rainfall (factor releveled via order(median_mm))
    turns the plot into an effective ranking chart, giving the reader a clear visual
    narrative for free
  - 'Clean theme-adaptive chrome: correct #FAF8F1/#1A1A17 backgrounds, INK/INK_SOFT
    tokens correctly threaded through title, subtitle, axis text and axis line in
    both renders, first-and-only series correctly uses Imprint brand green #009E73'
  - 'Realistic, neutral, well-scoped data: 12 major world cities with annual-rainfall
    medians and 10th-90th percentile bands that are directionally correct versus real-world
    climate figures (Manaus/Singapore very wet, Cairo/Phoenix very dry)'
  - Title format, subtitle (doubling as the spec-required explanation of the 10th-90th
    percentile bounds), axis label with units, and no redundant legend for a single
    series are all handled correctly
  - scales::label_comma() on the rainfall axis avoids raw scientific/unformatted numbers
    on values above 1000mm
  weaknesses:
  - 'The geom_hline() reference line and the annotate(''text'', x = 12.5, ...) ''All-station
    median'' label added in this repair round to improve DE-03 storytelling render
    as literally nothing in both plot-light.png and plot-dark.png -- verified by pixel-diffing
    the region above the Manaus row against the background in both themes, no dashed
    line and no annotation text exist anywhere in either PNG. Likely cause: x = 12.5
    sits right at the edge of the discrete station-axis expansion (levels 1-12 expand
    to only ~[0.4, 12.6] by default), and the vjust = 0 text anchor pushes the glyphs
    further outward from there, past the small plot.margin top = 22 headroom, so despite
    coord_flip(clip = ''off'') the label and its baseline never intersect the saved
    canvas. Fix by either giving the annotation real room (e.g. increase the top expansion
    via scale_x_discrete(expand = expansion(add = c(0.6, 2))) and/or move it to a
    caption/subtitle instead of a data-space annotate call), or drop the two now-dead
    layers entirely since the subtitle already states the percentile range.'
  - Because the reference-line/annotation layers are invisible, the plot's only storytelling
    device is the ascending sort -- solid but not the 'clear anchor' the code comment
    intends, so Design Excellence storytelling stays below the strong tier this fix
    round was aiming for
  - geom_point(size = 2.8) and the errorbar linewidth (0.8) are only marginally above
    generic ggplot2 defaults for a very sparse 12-point dataset; the style guide's
    density heuristic calls for more prominent markers/lines when n < 50
  - All 12 stations share the same right-skew direction (error_upper > error_lower
    everywhere) -- the dataset never shows the opposite skew, so a reader can't see
    how the chart would represent a left-skewed / symmetric case
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold dark title "errorbar-asymmetric · r · ggplot2 · anyplot.ai" and italic dark-gray subtitle "Median annual rainfall with 10th-90th percentile range" both read clearly against the light background. Station names (y-axis, after coord_flip) and the "Annual rainfall (mm)" x-axis title/tick labels are dark/soft-dark and fully legible. Faint vertical gridlines at 1,000 / 2,000 / 3,000 are subtle, not competing with data. No text overlaps another element.
      Data: All 12 error bars, caps, and point markers render in the same brand green (#009E73). Error bars are visibly asymmetric per station (upper whisker longer than lower whisker for every station, consistent with the right-skewed lognormal generator). NOTE: the code also adds a dashed INK_SOFT reference line at the cross-station median and an italic "All-station median: ... mm" annotation above the Manaus row -- neither is visible anywhere in this PNG (confirmed by pixel inspection of the region between the subtitle and the top error bar); these two layers render as nothing.
      Legibility verdict: PASS (all rendered chrome and data are legible; the only issue is that two decorative layers silently fail to render at all, which is a correctness bug rather than a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and subtitle flip to light ink tones (light/soft-light) and remain fully readable against the dark background; no dark-on-dark text anywhere. Axis labels, tick labels, and station names are all light-toned and legible. Gridlines are faint light lines, correctly inverted from the light theme.
      Data: Data colors are pixel-identical to the light render -- brand green #009E73 error bars, caps, and points, confirming only chrome (not data color) flips between themes. Same missing reference-line/annotation issue as the light render, confirmed by the same crop-and-inspect check.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; the missing annotation is a rendering bug, not a theme-legibility failure).
