review:
  strengths:
  - Chart.js has no native error-bar chart type, and the implementation correctly
    avoids the trap of reaching for an uninstalled community plugin — it uses the
    'line' type with showLine:false for the categorical-axis point layer and a custom
    afterDatasetsDraw plugin to draw the true asymmetric whiskers and caps.
  - 'Both renders are theme-correct: brand green (#009E73) markers and error bars
    are pixel-identical between light and dark, while backgrounds (#FAF8F1 / #1A1A17),
    grid, and text correctly flip via ANYPLOT_TOKENS.'
  - Sparse 6-point dataset is given prominent, well-differentiated markers (radius
    10, white/page-colored border ring) and thick 3px whiskers with visible caps,
    so nothing is hard to read at either theme.
  - The subtitle satisfies the spec's requirement to explain what the asymmetric bounds
    represent, and the header/title format matches the required 'errorbar-asymmetric
    · javascript · chartjs · anyplot.ai' pattern exactly.
  - 'Code is clean: deterministic hardcoded data, no unused imports, single canvas
    appended once, animation disabled per the harness contract.'
  weaknesses:
  - Subtitle says 'asymmetric 95% CI (5th–95th percentile)', but a 5th–95th percentile
    span is a 90% interval, not 95% — fix the label to '90% CI (5th–95th percentile)'
    or move the bounds to 2.5th/97.5th percentile to genuinely match '95%'.
  - Y-axis is fixed at 0–40 while the tallest bar (Treatment C) only reaches ~34.8,
    leaving a dead band of empty space across roughly the top 12% of the plot height
    — tighten the yAxisMax rounding/multiplier so the data fills the frame better.
  - Only a single series is shown; the spec's optional suggestion to use different
    colors/markers when comparing multiple series was not explored, so the plot doesn't
    showcase how the asymmetric-error-bar pattern would scale to a multi-series comparison.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the mandated #FAF8F1 surface — not pure white, not dark.
      Chrome: Title "errorbar-asymmetric · javascript · chartjs · anyplot.ai" in dark ink at the top, italic subtitle below explaining the CI bounds, dark "Treatment Group" x-axis title and "Symptom Improvement (%)" y-axis title, muted gray tick labels for both axes, subtle horizontal y-axis gridlines only. All text is clearly legible against the light background.
      Data: Six treatment groups (Control through Treatment E) each shown as a brand-green (#009E73) point with a light-bordered ring, connected to a vertical asymmetric whisker (green) with horizontal caps at both ends marking the lower/upper CI bounds. Whisker lengths vary per group (upper arm consistently longer than lower arm, as intended for the asymmetric log-transformed CI).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the mandated #1A1A17 surface — not pure black, not light.
      Chrome: Same title/subtitle now in light/white ink, axis titles in light ink, tick labels in a lighter muted gray, gridlines subtle but visible against the dark background. No dark-on-dark text found anywhere — all chrome flipped correctly.
      Data: Same brand-green (#009E73) points and whiskers as the light render, at identical pixel positions and values — confirms Imprint data-color parity between themes (only chrome flipped).
      Legibility verdict: PASS
