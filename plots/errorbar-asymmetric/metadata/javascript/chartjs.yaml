review:
  strengths:
  - 'Both repair-loop fixes from attempt 1 landed cleanly: the subtitle now correctly
    reads ''90% CI (5th–95th percentile)'' (was mislabeled ''95% CI''), and the y-axis
    max is now computed dynamically from the tallest CI bound (yAxisMax formula) instead
    of a fixed 0–40, cutting the dead band above Treatment C from ~15% to ~8% of the
    plot height.'
  - The repair also added a callout annotation ('Largest response') pointing at the
    Treatment C whisker, giving the chart a visual focal point that was missing in
    attempt 1 — a genuine Design Excellence improvement, not just a bug fix.
  - Chart.js has no native error-bar chart type; the implementation correctly avoids
    reaching for an uninstalled community plugin and instead uses a 'line' dataset
    with showLine:false for the categorical point layer plus a custom afterDatasetsDraw
    plugin to draw the true asymmetric whiskers and caps.
  - 'Both renders are theme-correct: brand green (#009E73) markers/whiskers are pixel-identical
    between light and dark, while backgrounds (#FAF8F1 / #1A1A17), grid, and text
    correctly flip via ANYPLOT_TOKENS.'
  - Sparse 6-point dataset gets prominent, well-differentiated markers (radius 10,
    page-colored border ring) and thick 3px whiskers with visible 20px-wide caps —
    satisfies the spec's explicit 'visible caps' requirement.
  weaknesses:
  - The y-axis top tick lands on the computed max (38) rather than the next round
    multiple of the 5-unit step used everywhere else (0, 5, 10, ... 35, 38) — a minor
    visual-rhythm break at the very top of the axis; consider rounding yAxisMax up
    to the next multiple of 5 instead of 2 so the tick sequence stays uniform.
  - Only a single series is shown; the spec's optional suggestion to use different
    colors/markers when comparing multiple series is still unexplored, so the plot
    doesn't demonstrate how the asymmetric-error-bar pattern scales to a multi-series
    comparison (low priority — spec marks this as optional).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the mandated #FAF8F1 surface -- not pure white, not dark.
      Chrome: Title "errorbar-asymmetric · javascript · chartjs · anyplot.ai" in dark ink at the top, italic subtitle below reading "Points show mean improvement; bars show asymmetric 90% CI (5th-95th percentile)" (now internally consistent -- 90% matches 5th-95th), dark "Treatment Group" x-axis title and "Symptom Improvement (%)" y-axis title, muted gray tick labels for both axes, subtle horizontal y-axis gridlines only (x-axis grid off). A small italic "Largest response" callout sits above the Treatment C whisker. All text is clearly legible against the light background.
      Data: Six treatment groups (Control through Treatment E) each shown as a brand-green (#009E73) point with a light-bordered ring, connected to a vertical asymmetric whisker (green) with horizontal caps at both ends marking the lower/upper CI bounds. Whisker lengths vary per group with the upper arm consistently longer than the lower arm, matching the intended log-transformed asymmetric CI. The y-axis now tops out at 38 (vs. the tallest whisker at ~34.8), a much tighter fit than the previous fixed 0-40 scale.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the mandated #1A1A17 surface -- not pure black, not light.
      Chrome: Same title/subtitle/callout now in light/white ink, axis titles in light ink, tick labels in a lighter muted gray, gridlines subtle but visible against the dark background. No dark-on-dark text found anywhere -- all chrome flipped correctly.
      Data: Same brand-green (#009E73) points and whiskers as the light render, at identical pixel positions and values -- confirms Imprint data-color parity between themes (only chrome flipped).
      Legibility verdict: PASS
