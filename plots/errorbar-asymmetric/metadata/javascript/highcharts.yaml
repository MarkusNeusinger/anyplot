review:
  strengths:
  - Custom SVG-rendered whiskers via chart.events.render + axis.toPixels() correctly
    reproduce asymmetric error bars without the unavailable highcharts-more errorbar
    series, and redraw correctly on every render (resize-safe).
  - 'Marker halo (lineColor: t.pageBg) makes the point marker pop cleanly where it
    overlaps the whisker line — a thoughtful visual-refinement detail.'
  - 'Correct Imprint palette usage (first series #009E73, identical data color across
    themes) and theme-adaptive chrome (background, grid, ink tokens) in both renders.'
  - Tooltip formatter surfaces the median plus the 10th-90th percentile range per
    station, and the subtitle explains what the whiskers represent, satisfying the
    spec's legend/annotation requirement for a single-series chart.
  - Y-axis padding via rangePad keeps every whisker cap comfortably inside the plot
    area — no clipping in either render.
  weaknesses:
  - Stations are listed in an arbitrary (non-sorted) order — sorting by median or
    by interval width, or highlighting the widest-uncertainty station, would give
    the chart a clearer visual focal point (DE-03).
  - No optional secondary cue (e.g. a small callout for the widest interval) beyond
    the subtitle text to reinforce what the asymmetric bounds mean — acceptable as-is
    but a minor missed storytelling opportunity.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "errorbar-asymmetric · javascript · highcharts · anyplot.ai" in bold dark text, subtitle "Whiskers span the 10th-90th percentile range at each station" in soft gray, x-axis "Monitoring Station" and y-axis "Ozone Concentration (ppb)" titles and tick labels all in soft dark gray — all clearly legible against the light background. Horizontal gridlines are subtle.
      Data: 10 stations each show a green (#009E73) filled circle marker at the median value with a vertical whisker line and horizontal caps at the top (90th pct) and bottom (10th pct) extending above/below by different amounts (asymmetric). Marker has a thin light-colored ring (matches page background) giving it a clean halo against the whisker line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same title and subtitle now rendered in white/light-gray text, axis titles and tick labels in light soft-gray — all clearly legible against the dark background. No dark-on-dark text observed. Gridlines are subtle but visible.
      Data: Same 10 stations, same green (#009E73) markers and whiskers — colors are identical to the light render; only the chrome (background, text, grid) has flipped to the dark theme. Marker halo ring now matches the dark page background.
      Legibility verdict: PASS
