review:
  strengths:
  - Correct, idiomatic use of ECharts' custom series `renderItem` API to build genuine
    asymmetric error bars (vertical line + two end caps) via `api.coord`/`api.size`
    — the right approach since ECharts has no native error-bar series type
  - 'Clean theme-adaptive chrome: hidden y-axis line, subtle horizontal-only gridlines,
    correctly mapped ANYPLOT_TOKENS for both light and dark renders, with identical
    brand-green data color across themes'
  - Marker and line sizing well-matched to the sparse 6-point dataset (20px markers,
    3px lines with caps) — clearly visible without overplotting
  - Legend explicitly explains what the bounds represent ('10th-90th percentile range'),
    directly satisfying the spec's note to clarify asymmetric bound meaning
  - Realistic, neutral business-forecast scenario with genuinely varying (non-uniform)
    asymmetric error magnitudes per quarter, including one bound crossing zero — good
    feature coverage
  weaknesses:
  - The chart relies on a single flat green across bars, caps, markers, and legend
    swatch — correct per palette rules but visually plain; consider emphasizing the
    widening-uncertainty trend (e.g. subtle callout on the highest-uncertainty quarter)
    to add data storytelling (DE-03)
  - Visual refinement is clean but generic beyond the hidden axis line and horizontal
    gridlines — a touch more polish (e.g. a subtitle stating the percentile convention,
    or slightly refined legend swatch) would lift DE-02
  - Title occupies only ~35% of canvas width at fontsize 22 — comfortably readable
    but well under the style guide's 50-70% target for a title this format; a modestly
    larger fontsize (~26-28) would improve visual balance without risking overflow
  - Code comment claims 'downside risk shrinks while upside potential grows' but errorLower
    is non-monotonic (1.5, 2.0, 3.2, 1.8, 2.5, 3.0 across Q1-Q6) — the narrative doesn't
    fully match the generated data; tighten the comment or the data trend for consistency
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold dark title "errorbar-asymmetric · javascript · echarts · anyplot.ai" centered at top; legend below it with two entries ("10th-90th percentile range" swatch, "Point forecast" dot); y-axis title "Revenue growth (%)" rotated on the left; x-axis title "Forecast quarter" centered below; tick labels in soft dark gray on both axes; a slightly bolder horizontal line marks the 0% baseline. All text is clearly readable against the light background — no light-on-light issues found; margins are generous with no clipping at any canvas edge (verified via crops of top/left/bottom regions).
      Data: All error bars, caps, and point-forecast markers render in brand green (#009E73), the required first-series color; markers have a subtle pageBg-colored border for definition. Six quarters (Q1-Q6) each show a distinct upper/lower error magnitude — clearly asymmetric (e.g. Q3's bar extends much further below its point than above, and dips below 0%).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light text (white/light gray) against the dark background; gridlines are faint and still visible; the 0% baseline line is light-colored. No dark-on-dark failures — every text element remains legible.
      Data: Error bars, caps, and markers are the identical brand green (#009E73) as in the light render — only the chrome (background, text, grid) flipped, per the theme-adaptive rule. Layout, spacing, and data positions are pixel-identical to the light render.
      Legibility verdict: PASS
