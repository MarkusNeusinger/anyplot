review:
  strengths:
  - Plateau shading + annotation deliver real data storytelling tied directly to the
    diminishing-returns / widening-spread pattern in the data
  - Subtitle explicitly names the percentile range, satisfying the spec's asymmetric-bounds
    explanation requirement
  - Marker halo (stroke={t.pageBg}) gives clean figure-ground separation without extra
    colors
  - Correctly falls back to a custom SVG overlay (via useXScale/useYScale) for a chart
    type the MUI X community surface doesn't natively support, rather than reaching
    for Pro/Premium or a different library
  - Theme-adaptive chrome and identical data color confirmed correct in both renders
  weaknesses:
  - Tick labels and plateau annotation at 13px CSS are slightly below the 14-16px
    guidance for axis/legend text in the mount's CSS coordinate space
  - Custom SVG error-bar elements aren't wired into MUI X's tooltip system, so the
    interactive HTML output has no hover detail on the error bars themselves
