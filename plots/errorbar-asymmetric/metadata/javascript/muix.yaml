review:
  strengths:
  - Error bars drawn as a custom SVG layer inside ChartsContainer via useXScale/useYScale,
    so they share the band and linear scales with the native axes and grid
  - Each central marker carries a page-colored halo that separates it from its bar,
    so the point's position between the two arms is unmistakable in both themes
  - 'Realistic nitrogen dose-response data: saturation near 200 kg/ha, a slight decline
    at 240 kg/ha, and arms whose asymmetry ratios vary from dose to dose'
  - All font sizes set explicitly and theme tokens threaded through axes, grid, legend
    and title, so both renders read cleanly
  weaknesses:
  - 'SC-04 (both): the bounds legend entry reads ''Asymmetric bounds (−10th percentile
    gap (%), +90th percentile gap (%))'' — two raw column headers pasted into nested
    parentheses, and ''−10th'' reads as a negative percentile → a reader''s label
    such as ''10th–90th percentile range''. Likely cause: BOUNDS_LABEL built by interpolating
    LOWER_ERROR and UPPER_ERROR.'
  - 'VQ-03 (both): the error-bar legend glyph is a horizontal bar with vertical caps,
    while every error bar in the plot is vertical with horizontal caps → draw the
    glyph vertically (vertical stem, horizontal caps) so it matches the marks it explains.
    Likely cause: the legend <svg> lines use x1=2/x2=20 for the stem at y=8.'
  - 'Suggestion: drop the shaded ''Spread ≥ 85% of maximum'' band, an annotation layer
    the spec does not ask for whose label tells the reader little; the widening bars
    already show the growth in uncertainty.'
  - 'Suggestion: draw the central markers as a native MUI X scatter series so ChartsLegend
    and the tooltip come for free, keeping only the error bars as the custom layer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white consistent with #FAF8F1; the 120–240 kg/ha region is shaded slightly lighter (elevatedBg) with a dashed border and an italic "Spread ≥ 85% of maximum" label at its top.
      Chrome: bold dark title "errorbar-asymmetric · javascript · muix · anyplot.ai" centered at the top; a legend row beneath it (green ringed dot "Median yield increase (%)", green horizontal error-bar glyph "Asymmetric bounds (−10th percentile gap (%), +90th percentile gap (%))"); bold axis titles "Nitrogen dose (kg/ha)" and "Median yield increase (%)"; tick labels 0–240 and 0–50 in soft dark ink; subtle horizontal grid only. All readable.
      Data: seven #009E73 markers (0, 40, … 240 kg/ha) at medians 1, 8, 19, 29, 35, 38, 36, each with a vertical green stem and horizontal caps at both ends; upper arms mostly longer than lower arms; 240 kg/ha nearly symmetric. Markers have a page-colored halo.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black consistent with #1A1A17; shaded band slightly lighter.
      Chrome: title, axis titles and legend in light ink, tick labels in light soft ink, faint grid; no dark-on-dark text anywhere.
      Data: identical #009E73 markers and error bars as the light render; the marker halo flips to the dark page color. Only chrome changed.
      Legibility verdict: PASS
