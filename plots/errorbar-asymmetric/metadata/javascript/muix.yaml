review:
  strengths:
  - Composes the error bars as a custom SVG layer inside ChartsContainer, using the
    useXScale/useYScale hooks, so every arm, cap and marker sits exactly on the MUI
    X band and linear scales. This is the idiomatic MUI X way to draw a mark type
    the community surface does not ship.
  - 'Each arm''s length comes from its own error column (lines 121–123), and the data
    shows the full asymmetric range: upper-heavy arms at low doses, near-symmetric
    arms around 200 kg/ha, and a lower-heavy arm at 240 kg/ha.'
  - The marker has a 3 px page-coloured ring that separates it from the bar line,
    so where the median sits between the two arms is unmistakable in both themes.
  - The legend names both the median marker and the '10th–90th percentile range' with
    matching glyphs (a ringed dot and a capped I-bar), as the Notes ask.
  - 'The nitrogen dose-response scenario is realistic: diminishing returns and a slight
    decline past 200 kg/ha, with uncertainty widening as the dose rises.'
  - 'Theme tokens reach every element: ink for the title and axis titles, inkSoft
    for ticks and the secondary legend label, and a grid at 50 % opacity. The Imprint
    green #009E73 is identical in both renders, and skipAnimation is set.'
  weaknesses:
  - 'VQ-01 (both): tick labels at 14 px and legend text at 15 px (CSS) blur to about
    3.5 px in the 400 px thumbnail, so the dose and percentage ticks are hard to read
    on mobile → tick labels about 16 px (+2 px), legend text about 16 px (+1 px).
    Likely cause: tickLabelStyle fontSize: 14 on both axes and fontSize: 15 on the
    legend Typography.'
  - 'CQ-04 (code): lines 65–71 hand-roll a reverse for-loop that finds the last index
    meeting the spread threshold → `totalSpreads.findLastIndex((s) => s >= maxSpread
    * PLATEAU_SPREAD_SHARE)`. Lines 52 and 54–55 also recompute the sums from the
    raw records although lowerErrors/upperErrors already exist. Likely cause: the
    plateau-band computation was written out by hand.'
  - 'Suggestion: the ''Spread ≥ 85% of maximum'' shaded band is an annotation layer
    the spec does not request. Dropping it (with lines 23 and 63–117) would simplify
    the chart and the code, and it earns no storytelling credit.'
  - 'Suggestion: pass the medians as a real ScatterChart/scatter series in ChartsContainer
    so the HTML view gets MUI X''s native tooltip with the dose and median on hover.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1. The 120–240 kg/ha region carries a slightly lighter elevated-bg band with a dashed grid-coloured border and an italic "Spread ≥ 85% of maximum" label at the top.
      Chrome: bold dark title "errorbar-asymmetric · javascript · muix · anyplot.ai" centred at the top (~40 % of the width). Below it is an HTML legend: a ringed green dot labelled "Median yield increase (%)" and a green capped I-glyph labelled "10th–90th percentile range". The y-axis title is "Median yield increase (%)" and the x-axis title is "Nitrogen dose (kg/ha)", both semibold dark ink. Ticks 0–50 step 5 and 0–240 step 40 are in soft ink. Grid lines are subtle horizontal lines, and the left and bottom axis lines show with no tick marks. All text is readable; ticks are small in the 400 px thumbnail.
      Data: 7 points in #009E73. Each has a 3 px vertical bar, 3 px caps at both ends and a 10 px filled circle with a page-coloured ring at the median. The arms are clearly asymmetric (e.g. 160: 28–48 around 35; 240: 26–45 around 36, lower arm longer). The y-axis spans every bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17. The plateau band is slightly lighter with a dashed border and the same soft-ink italic label.
      Chrome: title and axis titles in light ink, ticks and the secondary legend label in a softer light grey, grid lines subtle dark grey, axis lines light. No dark-on-dark text anywhere.
      Data: identical #009E73 bars, caps and markers. The marker ring now uses the dark page colour, which keeps the marker separated from the bar.
      Legibility verdict: PASS
