review:
  strengths:
  - Custom SVG error-bar overlay via useXScale/useYScale correctly fills a gap where
    MUI X community has no native error-bar chart type — an idiomatic use of the library's
    scale-context extension point rather than a hack.
  - Marker halo-stroke (circle stroke = page background) gives clean figure-ground
    separation against both the cream and near-black surfaces; cap half-width is derived
    from band scale (min(18, bandwidth*0.28)) instead of a fixed pixel value.
  - 'Palette and theme chrome are fully compliant: brand green #009E73 identical across
    light/dark, correct #FAF8F1/#1A1A17 backgrounds, all text theme-adaptive via ANYPLOT_TOKENS.'
  - Realistic, neutral agronomic dataset (nitrogen dose vs. yield increase) that shows
    a full range of the plot type's defining feature — every point has a distinct,
    non-symmetric error_lower/error_upper, and the spread widens plausibly with dose.
  - Subtitle ('whiskers span the 10th-90th percentile range') satisfies the spec's
    requirement to explain the asymmetric bounds without needing a redundant single-series
    legend.
  - Axis labels are descriptive with units (Nitrogen Dose (kg/ha), Yield Increase
    (%)); grid is a single subtle horizontal layer at 50% opacity, not competing with
    data.
  weaknesses:
  - Title reads visually small relative to canvas width (~30%, vs. the ~50-70% guideline
    for a title this length) because no optional descriptive prefix was used — add
    a short prefix like 'Nitrogen Response Curve · errorbar-asymmetric · javascript
    · muix · anyplot.ai' to give the title more hierarchy and presence.
  - No explicit visual emphasis on the plot's actual insight (diminishing returns
    above ~120-160 kg/ha combined with widening uncertainty) — the subtitle names
    the whisker meaning but nothing calls out where the curve flattens; consider a
    light annotation or highlighted point at the plateau.
  - Grid/axis chrome is left at MUI X's structural default rather than intentionally
    refined (e.g., lightening or removing the axis tick marks) — a small additional
    refinement pass would push Design Excellence from 'above default' to 'strong design'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "errorbar-asymmetric · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible; subtitle "Median yield increase · whiskers span the 10th-90th percentile range" in softer gray beneath it, also legible; x-axis label "Nitrogen Dose (kg/ha)" and y-axis label "Yield Increase (%)" both dark and readable; tick labels (0-240 on x, 0-50 on y) in a slightly lighter gray, all readable; a single subtle horizontal gridline layer at low opacity.
      Data: Seven points (doses 0-240) in brand green (#009E73) — circular markers with a light halo stroke, vertical error-bar stems with horizontal caps at top and bottom, asymmetric span clearly visible (upper arm longer than lower arm at most doses, e.g. dose 0: caps at ~-1 and ~3 around the point at 1). Curve rises steeply then plateaus/dips slightly at the highest doses, and the whisker span visibly widens with dose.
      Legibility verdict: PASS — no text is unreadable, no overlap, no clipping at the canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-label/tick-label layout, now rendered in light ink/soft-gray tones against the dark background; fully legible, no dark-on-dark failures observed. Gridline is a faint light-colored horizontal line, subtle as in the light render.
      Data: Same seven green (#009E73) markers and error-bar stems/caps, pixel-identical in color and position to the light render — only the chrome (background, text, grid) has flipped, confirming theme-adaptive tokens were threaded through correctly and data colors were not.
      Legibility verdict: PASS — all text readable in the dark theme, brand green remains highly visible against the near-black surface.
