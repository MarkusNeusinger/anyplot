review:
  strengths:
  - Focal-point treatment (halo, thicker stroke, callout arrow + label) on the widest-spread
    station creates a clear visual hierarchy and states the insight directly.
  - Stations are sorted by total spread (upper + lower) descending, guiding the eye
    from the least-certain reading to the most-certain one.
  - Explicit font sizes throughout; the mandated long title is dynamically scaled
    to fit without clipping, and both renders stay well-proportioned.
  - Correct Imprint palette (#009E73) with identical data color across light/dark,
    and theme-correct chrome (background, text, grid) in both renders.
  - Genuine D3-authored annotation connector via d3-shape's linkVertical() + a custom
    arrow marker, instead of a static line.
  weaknesses:
  - Main x/y axis tick marks (the short perpendicular lines) aren't explicitly recolored
    via `.selectAll('line').attr('stroke', t.grid)` the way the style-guide skeleton
    does — they inherit `currentColor`/default black instead of a theme token. Not
    visibly broken in either render at this canvas size, but should be fixed for full
    theme robustness.
  - Every station shares the same right-skew direction (upper magnitude > lower magnitude);
    a left-skewed counter-example would more fully demonstrate the asymmetric-bounds
    feature space.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the light theme spec — not pure white.
      Chrome: Dark, high-contrast title "Ozone Levels by Monitoring Station · errorbar-asymmetric · javascript · d3 · anyplot.ai" centered at top, softer gray subtitle below it explaining the 10th-90th percentile bars. Y-axis label "Ozone Concentration (ppb)" rotated, dark tick labels on both axes, subtle horizontal gridlines. All clearly legible against the light background.
      Data: 8 monitoring stations (Industrial, Downtown, Uptown, Harbor, Riverside, Lakeside, Hilltop, Greenfield) sorted by total spread descending. Each shows a green (#009E73) vertical error bar with horizontal caps at the 10th/90th percentile bounds and a filled green dot at the median. The leftmost station (Industrial) has a soft green halo behind its dot, a thicker stroke, and a callout annotation with an arrow reading "Widest spread: −10/+22 ppb (Industrial)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Title and axis label render in white/light text, subtitle and tick labels in light gray, gridlines subtle light gray — all clearly readable against the dark background. No dark-on-dark text observed.
      Data: Identical green (#009E73) error bars, caps, median dots, halo, and callout annotation as the light render — same station values, same visual hierarchy (Industrial highlighted). Only the chrome (background, text, grid) flipped; data colors are unchanged.
      Legibility verdict: PASS
