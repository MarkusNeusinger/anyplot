review:
  strengths:
  - Each of the five axes is min-max normalized with an 8 % pad and gets its own nice-step
    ticks in original units, so lines spread over the full height of every axis and
    no variable squeezes the others flat
  - Composes the chart from MUI X's ChartsContainer with the useXScale and useDrawingArea
    hooks, so the evenly spaced axes and the polylines are positioned by the library's
    own scale and drawing area
  - 'The ML-hyperparameter data forms three readable bundles (Transformers: many layers,
    high accuracy, long training; RNNs: high dropout, low accuracy) while single lines
    still stray from their bundle'
  - 'Imprint palette in canonical order (CNN #009E73 first), straight polyline segments
    at 0.75 stroke opacity, identical data colors in both themes, and theme-token
    chrome that reads cleanly on #FAF8F1 and #1A1A17'
  - Tick labels sit on small page-colored halos so they stay legible where the line
    bundles cross the axes
  weaknesses:
  - 'Suggestion: the legend is a hand-built HTML row in the title band; feeding the
    three architectures as series to ChartsLegend would use the library''s own legend
    component.'
  - 'Suggestion: a slightly larger axis-name font (about 16-17 px) would give the
    variable names more weight than the tick labels in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white frame.
      Chrome: title "parallel-basic · javascript · muix · anyplot.ai" bold dark ink at top left (~34 % width); legend (CNN, RNN, Transformer with round swatches) at top right; five bold axis names above five evenly spaced vertical axes (Batch size, Hidden layers, Dropout (%), Validation accuracy (%), Training time (min)); tick marks with labels in original units (0/100/200, 2/4/6/8, 10/20/30, 70/80/90/100, 50/100/150) on page-colored halos. All text dark on light, readable; nothing clipped.
      Data: 30 straight polylines at 0.75 opacity — CNN #009E73, RNN purple (Imprint 2), Transformer blue (Imprint 3). Clear bundles: Transformers high on layers/accuracy/training time, RNNs peaking at 25-33 % dropout and dropping to ~70 % accuracy, CNNs in between with low dropout.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend labels and axis names in light ink, axes and tick labels in light soft ink; no dark-on-dark text anywhere; tick halos are dark page color.
      Data: identical green/purple/blue line colors and positions as the light render; the blue Transformer lines are darker against the surface but still clearly visible.
      Legibility verdict: PASS
