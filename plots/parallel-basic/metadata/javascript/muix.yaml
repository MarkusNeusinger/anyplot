review:
  strengths:
  - Every axis is min-max scaled with padding while tick values stay in original units,
    so lines spread along each axis and the reader still sees real values
  - Straight polylines at 0.58 opacity cross every axis at their exact values; bundles
    of similar observations read darker than single lines
  - 'Theme tokens threaded through all chrome (ink, inkSoft, pageBg): both renders
    read cleanly, Imprint palette in canonical order with CNN on brand green'
  - Composes a custom chart inside MUI X ChartsContainer, using the useXScale/useDrawingArea
    hooks for coordinates, with skipAnimation set
  - Deterministic LCG seed and a clean column/data/plot separation
  weaknesses:
  - 'VQ-03 (dark): the Transformer lines in #4467A3 at 0.58 opacity sit at low contrast
    on #1A1A17 and read much dimmer than the green and lilac lines → about 0.75 opacity
    (+0.17) for the 30 lines, same in both themes. Likely cause: strokeOpacity={0.58}
    on the polyline group.'
  - 'DQ-03 (both): integer hyperparameters carry fractional values — lines cross ''Hidden
    layers'' between ticks at values such as 3.4 or 7.5 layers, and batch sizes are
    values such as 137.42 → round Hidden layers to integers and draw batch sizes from
    16/32/64/128/256. Likely cause: toFixed(2) applied to every dimension in the data
    loop.'
  - 'Suggestion: render the legend with MUI X''s own ChartsLegend instead of hand-built
    HTML spans.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title top-left, HTML legend top-right, five bold axis names, soft-ink axes with tick values on halos — all readable
      Data: 30 straight polylines at 0.58 opacity; CNN #009E73, RNN #C475FD, Transformer #4467A3
      Legibility verdict: PASS

