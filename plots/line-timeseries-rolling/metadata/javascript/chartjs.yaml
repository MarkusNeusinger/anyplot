review:
  strengths:
  - 'Correctly implements the dual-layer spec intent: thin, alpha-blended (0.28) raw-data
    line behind a bold (borderWidth: 4), smooth brand-green rolling-average line.'
  - 'Rolling average is technically correct - first 6 points are null (window not
    yet full) rather than faked/extrapolated, and spanGaps: false renders the shorter
    line honestly per the spec''s note.'
  - Deterministic, seeded (LCG, seed=42) synthetic data with a believable upward DAU
    trend plus weekday/weekend seasonality - good realistic business context.
  - Theme-adaptive chrome (t.ink, t.inkSoft, t.grid) is correctly threaded through
    title, axis titles, ticks, legend, and grid in both renders; palette-correct (t.palette[0]
    for the highlighted series).
  - Title format, legend labels ("Raw Data" / "Rolling Average (7-day)" - window size
    surfaced as requested), and axis mapping all match the spec exactly.
  - 'Clean, idiomatic single new Chart() call, animation: false set per harness contract,
    no fake interactivity.'
  weaknesses:
  - Title is noticeably smaller than expected proportion - occupies roughly ~30% of
    the canvas width, well under the ~50-70% general guideline (and under the ~70-85%
    typically seen for a mandated title of this length). Increase title font.size
    (e.g. from 22 to ~28-30) so the title reads as the dominant hierarchy element.
  - Design Excellence is at the "configured default" level - relies on Chart.js defaults
    with only theme-token colors substituted in; no additional refinement (e.g. gradient/area
    fill under the rolling-average line, refined legend swatch shapes, heavier title
    weight) was added to lift it above baseline.
  - Library Mastery usage is fairly generic for Chart.js - consider a more distinctive
    feature (e.g. fill with a gradient stop, or per-segment styling) to differentiate
    from what any other line-chart library could produce with a syntax swap.
  - Y-axis title 'Daily Active Users' is descriptive but has no explicit unit annotation
    (minor; the label largely self-describes the count).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Dark-ink title "line-timeseries-rolling · javascript · chartjs · anyplot.ai" at top; top-right legend with gray "Raw Data" swatch and green "Rolling Average (7-day)" swatch; dark axis titles "Date" and "Daily Active Users"; dark tick labels on both axes; subtle light-gray gridlines on both axes. All chrome text is clearly readable against the light background.
      Data: Raw daily-active-users series drawn as a thin (borderWidth 1.5), semi-transparent (alpha 0.28) gray zigzag line across ~120 days (2026-01-01 to late April); overlaid by a bold (borderWidth 4), smooth brand-green (#009E73) line tracing the 7-day rolling average, correctly starting 6 days after the raw series begins (null-padded incomplete window, spanGaps:false). Upward trend from ~4,000 to ~5,200 with visible weekday/weekend noise in the raw series.
      Legibility verdict: PASS - no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, legend, and axis titles rendered in light ink; tick labels in light-gray ink; gridlines faint but visible. All chrome flipped correctly for the dark surface.
      Data: Raw-data line and rolling-average line use the identical gray / #009E73 green as the light render - confirmed no color drift between themes.
      Legibility verdict: PASS - no dark-on-dark text found; brand green remains clearly visible on the dark surface.
