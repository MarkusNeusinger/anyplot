review:
  strengths:
  - 'Palette compliance fixed: raw data uses brand green #009E73 (palette[0]) and
    the rolling average now uses lavender #C475FD (palette[1]), the canonical next
    ordinal position, resolving the prior review''s VQ-07 flag'
  - 'Native ECharts time axis (type: "time") replaces the previous category-axis workaround,
    giving automatic, evenly-spaced date/hour tick formatting — resolves the prior
    LM-01 flag'
  - dataZoom (inside + slider, with a live area-chart preview minimap) adds a genuine
    ECharts-distinctive interactive feature — resolves the prior LM-02 flag
  - 'yAxis scale: true tightens the vertical range to roughly 9-30 against a data
    range of ~11-28, cutting the previously flagged wasted vertical space'
  - Thin, 35%-opacity raw line vs. thick solid rolling-average line creates immediate
    visual hierarchy that guides the eye to the smoothed trend
  - 'Both themes render correctly: warm off-white/near-black backgrounds, ink/inkSoft/grid
    tokens threaded through title, axes, ticks, legend and gridlines; data colors
    identical across themes'
  - Deterministic fixed-seed LCG data generation produces a realistic daily temperature
    cycle plus a slow seasonal drift and noise
  - Rolling average line correctly starts a day after the raw series (24-point window
    warm-up), matching the spec's note that the rolling series will be shorter
  weaknesses:
  - Title occupies only ~33% of canvas width, notably below the 50-70% guideline for
    a title of this length — a slightly larger title fontSize would strengthen the
    visual hierarchy without risking overflow
  - 'DE-01: aesthetic still leans on token defaults (alpha-blending + line-weight
    hierarchy); a mark line/area highlighting the seasonal drift or peak/trough annotations
    would raise sophistication further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-timeseries-rolling · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Date / Hour (UTC)" and Y-axis title "Temperature (°C)" both dark and readable. Tick labels (day-of-month on the native time axis, temperature values on Y) are a lighter grey-ink, readable. Legend at the bottom center shows "Raw Data" and "24-Hour Rolling Average" swatches, clearly legible. A dataZoom slider with a shaded area-chart preview sits above the legend, fully visible and not overlapping any other chrome. Grid lines are subtle light-grey verticals/horizontals, visible but not competing with data.
      Data: Raw Data renders as a thin, pale seafoam-green line (brand green #009E73 at ~35% opacity) with a strong daily oscillation (~11-28°C). Rolling Average renders as a thick, solid lavender line (#C475FD, the canonical second palette slot) tracing a smooth seasonal arc that starts about a day after the raw series (24-hour window warm-up) and ends at the same point as the raw data. First series is confirmed #009E73 as required; second series is confirmed the canonical palette[1] lavender.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, tick labels, and legend text all render in light/off-white ink, clearly legible against the dark background. The dataZoom slider preview area uses dark-adapted fill/track colors, still legible. Grid lines are subtle light-grey at low opacity, visible without dominating.
      Data: Raw Data line is the same brand green (#009E73) at the same opacity, and the Rolling Average line is the same lavender (#C475FD) as in the light render — data colors are identical between themes, only chrome flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (title, axis titles, ticks, legend) is clearly visible against the #1A1A17 surface.
