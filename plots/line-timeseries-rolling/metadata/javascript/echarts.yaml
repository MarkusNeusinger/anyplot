review:
  strengths:
  - First series correctly uses Imprint brand green (#009E73) for the raw data line
  - Alpha-blending (thin, 35% opacity raw line) + line-weight hierarchy (thick, solid
    rolling-average line) creates immediate visual storytelling that guides the eye
    straight to the smoothed trend
  - 'Both themes render correctly: warm off-white / near-black backgrounds, and ink/inkSoft/grid
    tokens are threaded consistently through title, axis, tick, legend and gridline
    colors'
  - Title format and legend labels match the spec exactly, with the window size stated
    directly in the legend ('24-Hour Rolling Average')
  - Deterministic LCG-seeded data generation produces a realistic daily temperature
    cycle plus a slow seasonal drift and noise
  - Rolling average line correctly starts later than raw data (after the 24-point
    window fills), matching the spec's note that the rolling series will be shorter
  - 'animation: false is set and the mount-node contract (no explicit size/devicePixelRatio)
    is followed correctly'
  weaknesses:
  - 'VQ-07: Second series (rolling average) uses t.palette[2] (#4467A3, blue) instead
    of the canonical next ordinal position t.palette[1] (#C475FD, lavender). There
    is no stated semantic reason (no ''sky''/''temperature-cold'' label in the legend)
    to skip position 2 — use palette[1] unless a semantic exception is intentional
    and made explicit.'
  - 'VQ-05/DE-02: yAxis spans 0-30 while the data only occupies roughly 12-28, leaving
    close to 40% of the plot''s vertical space empty below the series. Consider yAxis
    min around 5-8 (or scale: true) to tighten the range and give the trend more visual
    prominence.'
  - 'LM-02: Fairly generic line-chart usage — no ECharts-distinctive feature (e.g.
    dataZoom for time-series exploration, native time axis with automatic tick formatting,
    gradient areaStyle) is used to set this apart from a generic multi-library implementation.'
  - 'LM-01: Uses a category axis with manually formatted date/hour strings instead
    of ECharts'' native type: ''time'' axis, which would handle the datetime data
    more idiomatically and provide automatic time-aware tick formatting.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-timeseries-rolling · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Date / Hour (UTC)" and Y-axis title "Temperature (°C)" both dark and readable. Tick labels (dates on X, temperature values on Y) are a slightly lighter grey-ink, readable. Legend at the bottom center shows "Raw Data" and "24-Hour Rolling Average" swatches, clearly legible. Grid lines are subtle light-grey verticals/horizontals, visible but not competing with data.
      Data: Raw Data renders as a thin, pale seafoam-green line (brand green #009E73 at ~35% opacity) with a strong daily oscillation (~12-28°C). Rolling Average renders as a thick, solid blue line (not the canonical second palette slot) tracing a smooth seasonal arc that starts a day after the raw series (window warm-up) and ends at the same point. First series is confirmed #009E73 as required.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, tick labels and legend text all render in light/off-white ink, clearly legible against the dark background. Grid lines are subtle light-grey at low opacity, visible without dominating.
      Data: Raw Data line is the same brand green (#009E73) at the same opacity, and the Rolling Average line is the same blue as in the light render — data colors are identical between themes, only chrome flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (title, axis titles, ticks, legend) is clearly visible against the #1A1A17 surface.
