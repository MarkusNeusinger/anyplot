review:
  strengths:
  - 'Raw data rendered as a thin (lineWidth 1.5), semi-transparent (opacity 0.35)
    line in brand green #009E73 (palette[0]), exactly matching the spec''s request
    for ''a lighter, semi-transparent style for raw data'''
  - Rolling average rendered as a bold, prominent lineWidth 3.5 line clearly distinguishable
    from the noisy raw signal, creating an immediate visual focal point on the smoothed
    trend
  - All font sizes explicitly set (title 22px, subtitle 14px, axis titles 16px, tick/legend
    labels 14px) and legible in both themes
  - 'Theme-adaptive chrome correctly implemented: transparent chart background over
    the page token, ink/inkSoft/grid tokens mapped to title, axis labels, ticks and
    legend for both light (#FAF8F1) and dark (#1A1A17) renders — no dark-on-dark or
    light-on-light failures'
  - Rolling average series correctly starts later than raw data (at index WINDOW-1)
    reflecting the window requirement the spec calls out
  - Legend clearly distinguishes 'Raw Data' from 'Rolling Average (24-Hour)', matching
    the spec's request to show the window size in the legend
  - Deterministic fixed-seed LCG data generation, no external RNG dependency
  - Title format exactly matches the required '{spec-id} · {language} · {library}
    · anyplot.ai' pattern
  - Realistic, neutral hourly sensor-temperature scenario with plausible diurnal amplitude,
    drift, and noise magnitudes
  weaknesses:
  - 'Spec explicitly requests ''Grid lines on both axes'' but only horizontal (y-axis)
    gridlines render in both PNGs — no vertical gridlines are visible at any date
    tick. Root cause: xAxis sets gridLineColor but never sets gridLineWidth, and Highcharts''
    xAxis gridLineWidth defaults to 0, so the line color is set on a zero-width line
    and never draws. Fix: add `gridLineWidth: 1` (or similar) to the xAxis block alongside
    the existing gridLineColor.'
  - Second series (Rolling Average) uses palette[2] (#4467A3, blue) instead of the
    canonical second position palette[1] (#C475FD, purple), with no semantic cue in
    the data justifying the skip — a minor deviation from the Imprint canonical color
    order.
  - 'Visual refinement is close to a well-configured default rather than exceptional:
    no additional polish beyond the token-driven chrome (e.g., x-axis line still drawn
    via lineColor, no extra whitespace tuning) — DE-02 capped at ''good'' rather than
    ''perfect''.'
  - No annotation or emphasis calls out the specific insight (e.g., the multi-day
    warm/cool drift cycle) beyond the raw-vs-rolling-average contrast itself — storytelling
    relies solely on line-weight/opacity contrast.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-timeseries-rolling · javascript · highcharts · anyplot.ai" in bold dark ink at top-center (~60% width, well clear of overflow); subtitle "Hourly sensor temperature with 24-hour rolling average" in soft gray beneath it. Y-axis title "Temperature (°C)" and x-axis title "Date" in soft gray, both legible. Tick labels (temperature values 6-28, date/time labels Jun 1 - Jun 11 with 12:00 PM sub-ticks) all dark-enough-on-light and clearly readable. Only horizontal gridlines are visible — no vertical gridlines appear at the date ticks despite the spec requesting grid lines on both axes. Legend ("Raw Data", "Rolling Average (24-Hour)") sits centered below the x-axis title, fully legible.
      Data: Raw Data renders as a thin, pale green, noisy zig-zagging line (diurnal up-down cycles every ~24h) — the brand green #009E73 at low opacity. Rolling Average (24-Hour) renders as a bold, smooth navy-blue line tracing a slow multi-day rise-and-fall drift beneath the noise. All text is readable against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light/off-white text, clearly legible against the dark background. Axis titles and tick labels also render in a light gray tone, fully legible — no dark-on-dark failures observed. Only horizontal gridlines are visible, same gap as in the light render (no vertical gridlines at date ticks).
      Data: Raw Data line and Rolling Average line use the identical colors as the light render (pale green raw signal, bold navy-blue rolling average) — data colors are unchanged between themes, only chrome (background/text/grid) flipped as expected.
      Legibility verdict: PASS
