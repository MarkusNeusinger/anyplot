review:
  strengths:
  - 'Clear visual hierarchy as the spec asks: raw visitors as a 1.75 px line at 0.65
    opacity in brand green, the 7-day mean as a 4 px purple line that tracks its level'
  - Rolling average is null for the first six days and starts on Jan 7, so it honestly
    covers a shorter span than the raw series
  - Window size is derived from the data and appears in the legend ('Rolling average
    (7-day)') and the computed subtitle
  - Location-aware valueFormatter gives short tick dates and full dates in the HTML
    tooltip; v9 [data-series] sx selectors style each line
  - 'Both themes are correct: chrome from theme tokens, identical data colors, all
    text readable'
  weaknesses:
  - 'Suggestion: the rolling line could carry a direct end label at Apr 30 so the
    reader does not need the top-right legend.'
  - 'Suggestion: lighten the vertical grid (17 lines) so it is less busy than the
    horizontal grid in the light render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title "Daily Unique Visitors · line-timeseries-rolling · javascript · muix · anyplot.ai" top left with a grey subtitle (120 observations · Jan 1, 2026 to Apr 30, 2026 · trailing 7-day mean from Jan 7, 2026); legend top right; y axis "Unique visitors" 1,500-4,500, x axis "Date" with weekly ticks Jan 4 to Apr 26; subtle grey grid on both axes. All text dark and readable.
      Data: thin semi-transparent #009E73 raw line with weekend dips and a surge peaking near 4,600 around Mar 9; thick purple 7-day rolling line starting Jan 7 near 2,050, rising to about 3,600 mid-March and ending near 2,850.
      Legibility verdict: PASS

