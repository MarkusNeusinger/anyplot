review:
  strengths:
  - Raw data rendered as a thin, semi-transparent (strokeOpacity 0.5) green line while
    the rolling average is a thick (3.5px), fully opaque lavender line — exactly the
    visual hierarchy the spec asks for between noisy observations and the smoothed
    trend
  - 'Deterministic LCG-generated data with real structure: weekday/weekend seasonality,
    a slow baseline climb, and a two-week ''viral post'' surge — the rolling average
    visibly reveals the surge as a clean bump while the raw line stays noisy underneath'
  - Legend clearly labels 'Raw Data' vs 'Rolling Average (7-Day)', surfacing the window
    size as the spec suggests
  - Handles a real MUI X layout bug (yAxis `label` offsets from a guessed tick width
    rather than the actual 4-digit tick labels) with a hand-rotated Typography column
    instead of fighting the built-in label — avoids collision and documents why in
    a comment
  - 'Custom dashed grid (`strokeDasharray: 4 3`) on both axes is subtle and matches
    the style guide''s ''no bold grid'' rule'
  - 'Both renders are theme-correct: cream/near-black backgrounds, light/dark text,
    identical data colors (#009E73 raw, #C475FD rolling) across themes'
  - Title correctly uses the mandated format with a descriptive prefix, and the length-based
    fontsize formula keeps it from overflowing
  weaknesses:
  - Data storytelling stops at implicit visual hierarchy — the viral-surge bump (Mar
    8-15) is the most interesting feature in the data but isn't called out with any
    annotation/reference line, so a first-time viewer has to notice it unaided
  - 'Aesthetic polish is solid but still close to a well-configured default: only
    two colors are in play, legend uses the default MUI X swatch/row style with no
    refinement beyond fontSize, and there''s no additional visual-refinement touch
    (e.g. a subtle marker on the current/last value, softened line caps) that would
    push it toward publication-level design'
  - Library Mastery leans on time-scale axis + valueFormatter + sx-class overrides,
    which are solid but not a feature that's uniquely hard to replicate elsewhere
    (e.g. no ChartsReferenceLine, no zoom/highlight-on-hover configuration, no area/gradient
    fill) — LM-02 stays at the generic-but-competent tier
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: title "Daily Unique Visitors · line-timeseries-rolling · javascript · muix · anyplot.ai" in bold dark ink at top-left; legend swatches ("Raw Data" green, "Rolling Average (7-Day)" purple) centered above the plot; y-axis tick labels (0-5,000, comma-formatted) and rotated "Unique Visitors" label at far left; x-axis date ticks (Jan 4 ... May 3) and "Date" label at bottom. Dashed, subtle gray gridlines on both axes.
      Data: first series (raw) is thin, semi-transparent brand green (#009E73), showing strong weekday/weekend sawtooth oscillation, a gradual upward baseline trend, and a pronounced surge around March 8-15. Second series (rolling average) is a thick, fully opaque lavender line (#C475FD) that smooths the sawtooth into a clean trend curve, including a clear bump during the surge window.
      Legibility verdict: PASS — all text (title, legend, axis labels, tick labels) is clearly readable in dark ink against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: same title, legend, and axis labels as the light render, now rendered in light ink (white/light-gray) against the dark background. Gridlines remain subtle dashed lines, now in a light, low-opacity tone.
      Data: identical colors to the light render — green raw line (#009E73) and lavender rolling-average line (#C475FD) — confirming data colors do not shift between themes.
      Legibility verdict: PASS — title, legend text, and both axis tick labels are clearly legible light-on-dark; no dark-on-dark failures observed anywhere (title, "Date"/"Unique Visitors" labels, and numeric ticks are all light-colored and readable).
