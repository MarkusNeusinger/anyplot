review:
  strengths:
  - Raw data rendered as a thin, semi-transparent (alpha 0.5) green line while the
    rolling average is a bold, contrasting purple line — exactly the visual hierarchy
    the spec asks for
  - Rolling average correctly starts 6 days later than raw data (nulled until a full
    7-day window exists), visibly shorter as the spec requires
  - Legend explicitly names the window size ('Rolling Average (7-Day)'), satisfying
    the spec's optional guidance
  - ChartsReferenceLine bracket annotates the viral-post surge in the amber semantic-anchor
    color, giving the chart a clear narrative focal point without competing with the
    two data-series colors
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, fully
    legible chrome, identical data colors between light and dark'
  - Custom hand-rotated Y-axis label sidesteps a real MUI X collision bug (documented
    in a comment) instead of leaving overlapping text
  - All font sizes explicitly set (title, axis labels, ticks, legend) and title fontsize
    correctly scales down via the length-based formula for the longer, prefixed title
    string
  weaknesses:
  - Title renders comfortably inside its budget but looks conservatively sized (roughly
    40-45% of canvas width) rather than filling more of the available space — could
    size up slightly for stronger visual hierarchy without risking overflow
  - Design is polished but stays close to a well-configured MUI X default (no subtitle/source
    note or more distinctive typographic treatment) — falls just short of a truly
    publication-grade look
  - The single reference-line annotation is a fairly common technique across charting
    libraries; leaning on a more MUI X-distinctive feature (e.g. area/band shading
    between the two series, or axis zoom) would raise Library Mastery further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like cream), not pure white.
      Chrome: Title "Daily Unique Visitors · line-timeseries-rolling · javascript · muix · anyplot.ai" in bold dark text, fully readable. X-axis "Date" and Y-axis "Unique Visitors" (custom rotated label) in dark/soft-dark text, both clearly legible. Tick labels (dates, visitor counts) dark and legible. Dashed grid lines subtle on both axes. Legend ("Raw Data" green swatch, "Rolling Average (7-Day)" purple swatch) in dark text above the chart, no overlap with data. Amber dashed reference-line pair labeled "Viral post surge" clearly readable against the cream background.
      Data: Thin, semi-transparent green (#009E73) zig-zagging raw-data line showing weekday/weekend seasonality and a mid-series surge; a thick, smooth purple (#C475FD) rolling-average line tracking the trend, with a single marked point at its last value. Colors match the Imprint palette (green first, then lavender).
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Title, axis labels, tick labels, and legend text all rendered in light/off-white color, fully readable against the dark background — no dark-on-dark failures observed. Grid lines subtle and visible. Amber reference-line label remains legible against the dark surface.
      Data: Raw-data line and rolling-average line render in the identical green (#009E73) and purple (#C475FD) as the light render — only the chrome (background, text, grid) flipped, as required. Amber reference line also unchanged.
      Legibility verdict: PASS — no unreadable elements in either theme.
