review:
  strengths:
  - 'Rolling-average methodology is correctly implemented: the smoothed line correctly
    starts 14 days after the raw series (window-size truncation), matching the spec''s
    note that the rolling line will be shorter than raw data'
  - 'Strong visual hierarchy between the two series: thin, semi-transparent (stroke-opacity
    0.35) raw-data line clearly recedes behind the bold 4px rolling-average line,
    exactly matching the spec''s ''lighter raw data / prominent rolling average''
    guidance'
  - Theme-adaptive chrome (axis text, ticks, domain, grid, title) correctly threaded
    through ANYPLOT_TOKENS in both renders — no dark-on-dark or light-on-light failures
  - Legend clearly distinguishes 'Raw Data' from 'Rolling Average (14-Day)', including
    the window size as the spec suggests
  - 'Clean, reproducible code: seeded LCG produces deterministic synthetic data, no
    unnecessary imports, no fake interactivity'
  weaknesses:
  - 'Palette order violation: the rolling-average line uses t.palette[2] (#4467A3,
    blue) while t.palette[1] (#C475FD, lavender) is skipped entirely. With only two
    series, the second series must be palette position 2, not 3 — use t.palette[1]
    for the rolling average line.'
  - Spec notes ask for grid lines on both axes to improve readability of underlying
    values; the implementation only draws y-axis gridlines (d3.axisLeft(y).tickSize(-iw))
    with no vertical x-axis gridlines.
  - Design Excellence is competent but still reads as a well-configured default rather
    than a genuinely polished chart — e.g. the legend is a bare set of swatches/text
    with no elevated background box (ELEVATED_BG token unused), and there's no additional
    visual refinement (e.g. an outline/halo on the rolling-average line where it overlaps
    the noisy raw data).
  - Legend sits in the top margin, translated to (iw-320, -50), slightly disconnected
    from the plot body rather than nested closer to the data it describes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-timeseries-rolling · javascript · d3 · anyplot.ai" in bold dark ink, centered at top, fully visible and not clipped. X-axis label "Date" and rotated Y-axis label "Engagement Score" both in dark ink, clearly readable. Tick labels (Apr 01 … Jul 01 on x; 0-80 on y) are a slightly softer dark gray, readable. Subtle horizontal (y-axis) gridlines in light gray. Legend in top-right with "Raw Data" and "Rolling Average (14-Day)" swatches and dark text.
      Data: First series (Raw Data) rendered as a thin, pale green line at ~35% opacity — the correct Imprint brand green (#009E73) but intentionally faded per spec. Second series (Rolling Average) rendered as a bold, smooth blue line (~#4467A3, Imprint palette position 3, not position 2) tracing the underlying trend clearly above/below the noisy raw line.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light/off-white ink, clearly legible against the dark background. Gridlines are subtle light gray at low opacity. Legend text is light-colored and readable. No dark-on-dark text anywhere.
      Data: Raw Data line remains the same faded green, Rolling Average line remains the same blue — both series are pixel-identical in hue to the light render, confirming only chrome (not data color) flipped between themes.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures observed.
