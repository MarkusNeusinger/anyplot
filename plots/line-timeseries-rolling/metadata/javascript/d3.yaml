      Data: Raw data is a thin, semi-transparent light-green line (brand green, alpha ~0.35) showing daily noise; rolling average is a bold lavender/purple line with a subtle background-colored halo lifting it above the noise. First series color matches Imprint brand green (#009E73); second series matches Imprint position 2 (lavender).
