review:
  strengths:
  - Color, strokeWidth and opacity are all encoded on the same Series field with explicit
    domains, so Vega-Lite merges them into one legend whose swatches match the thin
    translucent raw line and the bold rolling line in both themes
  - Trailing pandas rolling(window=7, min_periods=7) plus dropna makes the rolling
    average start on Jan 07 instead of being padded back to Jan 01, exactly as the
    spec's characteristic section asks
  - Legend placed top-left inside the plot in the empty region above the cold January
    values, framed with the elevated surface token and rounded corners, so it never
    touches the data
  - Long-form data via pd.concat with series labels as values keeps the chart one
    declarative mark_line with a single legend instead of two hand-layered charts
  - 'Theme tokens thread through title, axis, grid and legend in both renders; Imprint
    #009E73 for raw data and #C475FD for the average are identical across themes'
  - HTML output adds tooltips (date, series, value to 0.1 °C) and .interactive() zoom/pan
    for detailed inspection
  weaknesses:
  - 'Suggestion: the x-axis grid draws a line at every weekly tick (about 26 vertical
    lines) while labels appear every two weeks; a grid at the labelled two-week ticks
    only would read calmer.'
  - 'Suggestion: naming the station or city (for example a mid-latitude city''s daily
    mean temperature) in the axis title or a title prefix would anchor the scenario.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas (chart centred with page-colored padding).
      Chrome: bold dark title "line-timeseries-rolling · python · altair · anyplot.ai" centred at the top (~47% of width); bold axis titles "Temperature (°C)" and "Date"; soft-ink tick labels -10..35 and "Jan 07" .. "Jun 23" in two-week steps; left and bottom domain lines only; subtle grid on both axes. All text readable.
      Data: thin translucent green (#009E73, alpha 0.55) raw daily line, noisy around a rising seasonal trend from about -7 °C to 30 °C; thick purple (#C475FD) 7-day rolling average starting at Jan 07 and tracking the level. Legend top-left in an elevated box: "Raw Data" (thin green) and "7-Day Rolling Average" (thick purple).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
