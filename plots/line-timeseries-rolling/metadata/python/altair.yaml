review:
  strengths:
  - 'Trailing 7-day window with min_periods=WINDOW: the rolling average starts at
    Jan 07, so it covers a shorter span than the raw series instead of being padded
    back to Jan 01, as the spec asks'
  - 'One long-format layer with alt.condition driving strokeWidth (3 vs 1.2) and opacity
    (1.0 vs 0.55) gives a clear hierarchy: the purple average dominates and the translucent
    green raw line recedes but stays visible in both themes'
  - Legend inside the empty upper-left of the plot area, on an elevated fill with
    a rounded frame, names the window ('7-Day Rolling Average') and uses no wasted
    right-side margin
  - 'Realistic, neutral scenario: 180 daily temperatures rising from about -2 °C in
    January to about 22 °C in late June with ±3 °C noise'
  - Theme tokens reach every chrome element; both renders are fully readable, and
    the data colors are identical across themes
  - 'Library-native interactivity in the HTML: .interactive() zoom/pan plus tooltips
    with formatted date, series and value'
  weaknesses:
  - 'VQ-03 (both): the ''Raw Data'' legend swatch is a fully opaque 3 px green line
    while the raw series is drawn at 1.2 px and opacity 0.55, so the glyph does not
    match the mark it explains → draw the raw swatch at the marks'' opacity (about
    0.55) and a thinner stroke. Likely cause: legend symbolStrokeWidth=3 for both
    entries and the opacity/strokeWidth conditions not reaching the legend (e.g. encode
    opacity/strokeWidth on the Series field with a scale, or set legend symbolOpacity).'
  - 'Suggestion: a monthly instead of a weekly x-grid would thin the 26 vertical lines
    that, especially in the light render, sit close to the raw line''s weight.'
  - 'Suggestion: computing the average with Vega-Lite''s transform_window(frame=[-6,
    0]) would showcase a native Altair transform instead of pandas rolling.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas (padding matches).
