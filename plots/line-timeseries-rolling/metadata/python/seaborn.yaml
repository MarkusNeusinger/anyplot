review:
  strengths:
  - Theme threaded through sns.set_theme(rc=...) so all chrome flips cleanly while
    the Imprint data colors stay identical in both renders
  - Rolling average computed with pandas rolling(window=WINDOW, min_periods=WINDOW),
    so it begins only once its 24-hour window is full
  - Reads the tidy df through data=df and column constants, letting seaborn title
    the axes from the column names
  - Hourly latency scenario with a daily load cycle and a release-driven step change
    gives the rolling line a clear job against spiky raw data
  - Exact 3200x1800 canvas with compact '%b %d' date ticks and a legend placed in
    empty space
  weaknesses:
  - 'Suggestion: name the date axis ''Time (hourly)'' or similar so the 24-hour window
    reads against the sampling interval.'
  - 'Suggestion: a slightly lighter alpha on the dark render''s raw line would keep
    it receding equally in both themes.'
