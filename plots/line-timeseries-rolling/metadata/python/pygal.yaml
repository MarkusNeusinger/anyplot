      Chrome: same layout; title, axis titles, ticks and legend in light ink, all readable; no dark-on-dark text. Dotted guides are faint but visible.
      Data: identical #009E73 raw line and #C475FD rolling average as in light; the purple reads somewhat stronger against the dark surface but both lines still share the same width.
      Legibility verdict: PASS
