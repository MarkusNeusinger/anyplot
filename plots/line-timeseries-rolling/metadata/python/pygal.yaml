review:
  strengths:
  - pygal.DateTimeLine with real datetimes places every observation at its date, and
    x_value_formatter gives clean 'Jan 01' / 'Jan 15' ticks
  - Font sizes follow the pygal sizing guide for 3200x1800; all text readable in both
    themes
  - Rolling average computed with pandas rolling(7) and dropped NaNs, so the smoothed
    line starts once its window is filled
  - 'Theme tokens threaded through Style: correct backgrounds and chrome in both renders,
    Imprint order with brand green first'
  - Legend names the window size ('7-Day Rolling Average')
  weaknesses:
  - 'SC-02, VQ-03 (both): both series render at the same ~3 px stroke, so the 7-Day
    Rolling Average is not the most prominent mark (C2) and the raw line is fully
    opaque instead of a lighter, semi-transparent line receding behind it (C1); in
    the light render the pale purple average reads weaker than the green raw line
    → rolling average about 10–12 px, raw line about 2 px at stroke-opacity ~0.4–0.5.
    Likely cause: Style(stroke_width=3) emits `.reactive{stroke-width:3;stroke-opacity:.8}`
    on every path, which overrides the `.series.serie-N{stroke-width}` that stroke_style
    sets on the group; stroke_style has no ''opacity'' key. Set per-series width/opacity
    with a rule that targets the path (e.g. chart.css / custom CSS `.serie-1 .line{stroke-width:12}`)
    or drop the global stroke_width.'
  - 'CQ-04 (code): stroke_style={''opacity'': 0.55} is an option pygal ignores, and
    x_labels builds the same pd.date_range(..., freq=''MS'') twice → drop the dead
    key and build the month starts once (e.g. `starts = pd.date_range(...)`; `x_labels
    = [*starts, *(starts + pd.Timedelta(days=14))]`). Likely cause: lines 66–67 and
    74.'
  - 'Suggestion: the two legend entries sit far apart (left edge and centre); legend_at_bottom_columns=2
    with a narrower spread would read as one key.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'line-timeseries-rolling · python · pygal · anyplot.ai' centred at top in dark ink; y-axis title 'Temperature (°C)', x-axis title 'Date'; y ticks 0–16 every 2, x ticks Jan 01 / Jan 15 / Feb 01 ... Apr 15; dotted guides on both axes at the ticks; legend at bottom ('Raw Data' left, '7-Day Rolling Average' centre). All text dark on light and readable.
      Data: raw daily temperature as a ~3 px #009E73 line (120 days, spiky around a rising trend); 7-day rolling average as a ~3 px #C475FD line starting Jan 07. Both strokes have the same width; the raw line is not visibly translucent and the pale purple average reads weaker than the raw line.
      Legibility verdict: PASS

