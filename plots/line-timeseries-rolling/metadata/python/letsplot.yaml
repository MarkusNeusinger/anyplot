review:
  strengths:
  - 'Clear two-layer hierarchy built through the grammar: alpha and size are mapped
    to the series with scale_alpha_manual/scale_size_manual, so the thin semi-transparent
    raw line recedes and the 1.6-width green rolling average dominates, and the single
    merged legend shows the thickness difference in its glyphs'
  - Rolling average computed with pandas rolling(window=14).mean() and its NaN warm-up
    dropped, so the line starts 13 days after the raw series instead of being padded
    back to Jan 1
  - Window size named in the legend entry '14-Day Rolling Average'; legend sits frameless
    and centered above the panel with no redundant title
  - 'Theme tokens threaded through every chrome element: warm off-white and near-black
    backgrounds, readable INK/INK_SOFT text and subtle grid on both axes in both renders,
    data colors identical across themes'
  - layer_tooltips() gives the HTML output a series name and value readout on hover,
    and scale_x_datetime(format='%b %Y') yields clean monthly ticks
  weaknesses:
  - 'DQ-03 (both): the seasonal curve peaks in early April (~26 °C rolling) and cools
    steadily through June (~19.5 °C), which no northern-hemisphere climate does for
    a Jan–Jun record → let the warm-up continue toward a summer peak (phase-shift
    the sine so its maximum falls near mid-July, i.e. about day 195). Likely cause:
    np.sin(2 * np.pi * days / 365) with no phase offset.'
  - 'DQ-02 (both): the scenario is a generic ''Temperature (°C)'' series with no sensor
    or place, so it reads as plausible but anonymous → name the measurement (e.g.
    a weather station or greenhouse sensor) in the y label or the column name. Likely
    cause: TEMPERATURE = "Temperature (°C)".'
  - 'Suggestion: the raw line at alpha 0.55 on the dark background turns a fairly
    muted violet; a touch more alpha in the dark theme would keep the spikes as legible
    as in the light render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel, no pure white.
      Chrome: title "line-timeseries-rolling · python · letsplot · anyplot.ai" top-left in dark ink, about 55 % of the width; frameless legend centered above the panel ("14-Day Rolling Average" thick green, "Raw Data" thin violet); y axis "Temperature (°C)" 12–34, x axis "Date" with monthly ticks Jan 2024–Jul 2024; light grey grid on both axes; all text dark and readable.
      Data: thin semi-transparent violet (#C475FD, alpha 0.55) raw daily line spiking between ~11.6 and ~33 °C; thick #009E73 rolling average starting mid-January at ~16.5 °C, rising to ~26 °C in April/early May, then falling to ~19.5 °C at end of June.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles, tick labels and legend text in light ink/soft grey, all clearly readable; grid subtle light lines; no dark-on-dark text.
      Data: same #009E73 rolling average and #C475FD raw line as the light render (the raw line reads as a more muted violet against the dark surface because of alpha 0.55, but stays visible); brand green clearly visible.
      Legibility verdict: PASS
