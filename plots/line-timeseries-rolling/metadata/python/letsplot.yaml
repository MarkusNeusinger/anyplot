review:
  strengths:
  - Raw readings drawn as a thin purple line (size 0.5, alpha 0.55) that recedes behind
    the prominent green 14-day rolling average (size 1.6) in both themes, exactly
    the layering the spec asks for
  - Rolling average computed with pandas rolling(window=14).mean() and its NaN head
    dropped, so the green line starts only once the window is filled in mid-January
    instead of being padded back to 1 January
  - Window size named in the legend entry '14-Day Rolling Average', next to 'Raw Data',
    in an untitled legend placed above the panel
  - Alpha and line width mapped through scale_alpha_manual / scale_size_manual on
    one geom_line, so a single grammar-of-graphics layer carries both series and one
    shared legend
  - layer_tooltips() shows the series name and temperature on hover in the HTML output
  - 'Plausible, neutral weather-station scenario: a seasonal cycle running from about
    1 °C in January to about 21 °C at the end of June, with 3 °C day-to-day noise,
    matching Vienna climatology'
  - Theme tokens threaded through every chrome element; both renders are fully readable
    and the data colors are identical
  weaknesses:
  - 'Suggestion: a short direct label at the right end of the rolling line (its final
    value) could give the trend a focal point.'
  - 'Suggestion: ELEVATED_BG is defined but never used; dropping it would trim the
    token block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel, no frame.
      Chrome: title "line-timeseries-rolling · python · letsplot · anyplot.ai" top-left in dark ink (~55 % of width); legend centered above the panel with "14-Day Rolling Average" (thick green swatch) and "Raw Data" (thin purple swatch), no legend title; x axis "Date" with monthly ticks Jan 2024 to Jul 2024; y axis "Vienna Daily Mean Temperature (°C)" with ticks -5 to 30. Subtle major grid on both axes, axis lines in INK_SOFT. All text readable.
      Data: thin semi-transparent purple (#C475FD, alpha 0.55) raw daily line spiking between about -5 and 29 °C; prominent green (#009E73) rolling line starting mid-January at about 1 °C, dipping slightly below 0 in late January and rising steadily to about 21 °C at the end of June.
