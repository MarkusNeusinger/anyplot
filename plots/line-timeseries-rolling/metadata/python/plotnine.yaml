review:
  strengths:
  - 'Clear two-layer hierarchy through the grammar: alpha and size are mapped to the
    series and set with scale_alpha_manual / scale_size_manual, so the raw page views
    (thin, alpha 0.6) recede behind the thick 7-day rolling average in both themes'
  - Rolling average starts and ends only where its window is filled (rolling(...).mean()
    followed by dropna()), so it covers a shorter span than the raw series as the
    spec asks
  - Realistic, neutral page-view scenario with slow audience growth and a midweek-peak
    weekly cycle that the 7-day window smooths away cleanly
  - Correct canonical 3200x1800 canvas, mandated title format, monthly date breaks
    via scale_x_datetime(date_breaks='1 month') with unique labels
  - 'Fully theme-adaptive chrome (backgrounds, text, grid, legend frame) with identical
    Imprint data colors (#009E73, #C475FD) in both renders'
  - 'Adaptable code layout: column constants with role comments, one tidy df at the
    end of the Data block, the long-format reshape and category limits derived from
    df below it'
  weaknesses:
  - 'VQ-03 (both): the legend''s line samples are both drawn at the default thin width
    and full opacity, so the 7-day rolling average sample does not match its 1.5-width
    line and the raw sample does not match its 0.6 alpha → line samples at the marks''
    widths and alphas. Likely cause: pn.guides(alpha="none", size="none") drops those
    scales from the color legend without guide_legend(override_aes={"size": [0.45,
    1.5], "alpha": [0.6, 1.0]}).'
  - 'Suggestion: give the legend frame a little more right padding; the ''7-day rolling
    average'' label sits right against the frame''s right edge.'
  - 'Suggestion: thousands separators on the y ticks (labels=mizani.labels.label_comma())
    would make 12,500 / 15,000 quicker to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel; 3200x1800.
      Chrome: title "line-timeseries-rolling · python · plotnine · anyplot.ai" in dark ink at top (~55% width); horizontal legend centered below it in a framed box; axis titles "Date" and "Page views" and tick labels (Jan 2024 … Jul 2024 monthly; 7500–15000) in dark/soft ink; subtle major/minor grid on both axes; thin panel border. All text readable.
      Data: 180 daily page views as a thin #009E73 line at alpha 0.6, spiking weekly between ~6,300 and ~14,800 with a rising trend; thick #C475FD 7-day rolling average from ~Jan 4 to ~Jun 25 climbing from ~8,100 to ~11,800, clearly the dominant mark.
