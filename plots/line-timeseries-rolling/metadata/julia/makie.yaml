review:
  strengths:
  - 'Correct dual-layer visualization: a semi-transparent muted raw-data line paired
    with a bold brand-green 30-day rolling average, exactly matching the spec''s requested
    technique'
  - 'Smart semantic color usage: the raw/noisy series is rendered in the INK_MUTED
    anchor (theme-adaptive ''muted'' role) rather than an arbitrary color, reserving
    Imprint brand green #009E73 for the ''hero'' trend line'
  - Explicit font sizing throughout (title 20, axis labels 14, tick labels 12) with
    theme tokens correctly threaded to every chrome element (title, axis labels, ticks,
    spines, grid, legend) in both light and dark renders
  - Rolling average line correctly starts 30 days after raw data, visually reflecting
    the window-size requirement called out in the specification
  - 'Clean, idiomatic CairoMakie code: Axis kwargs, axislegend, colorant/RGBAf helpers,
    closely matching the library''s recommended skeleton'
  - Realistic, neutral SaaS daily-active-users scenario with a believable upward growth
    trend, weekend dip pattern, and plausible noise magnitude
  weaknesses:
  - 'Design excellence is solid but not yet distinctive: no annotation, end-of-line
    value label, or standout visual technique separates this from a generic two-line
    chart. Consider a subtle callout (e.g. total growth over the period) or a filled
    confidence band around the rolling average to strengthen the data storytelling
    (DE-03).'
  - 'Library Mastery is generic (LM-02): nothing here is distinctly Makie-only. Consider
    a Makie-specific feature such as band!() for a rolling std-dev envelope around
    the trend line, or a customized Legend() object, to demonstrate library-specific
    strength.'
  - Title occupies a comparatively small share of the plot width (~30%) given the
    short spec-id; not a defect since there is no overflow, but there is room to size
    it slightly larger for a stronger visual hierarchy (DE-01/VQ-01 polish opportunity,
    not a deduction as-is).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "line-timeseries-rolling · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. Axis labels "Date" (x) and "Daily Active Users (thousands)" (y) in dark ink, both readable. Tick labels (dates on x, numeric values on y) in a slightly softer gray, fully legible. Subtle light-gray vertical and horizontal gridlines visible but not competing with data. Legend in the top-left corner, borderless, text in dark ink, clearly readable against the plot background.
      Data: Two series — a thin, semi-transparent muted-gray "Raw Data" line showing noisy daily values, and a thick, solid brand-green (#009E73) "30-Day Rolling Average" line tracing a smooth upward trend through the noise. The rolling-average line visibly starts ~30 days after the raw data begins, as expected from the window requirement.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light-colored ink (off-white/light-gray), clearly visible against the dark background. Gridlines are faint light lines, subtle but present. Legend box borderless, light-colored text, easily readable.
      Data: Same two series as the light render — the muted-gray raw-data line and the brand-green rolling-average line are visually identical in hue to the light render; only the chrome (background, text, grid) has flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/label/tick text is clearly visible against the near-black background, and the brand green remains vivid on the dark surface.
