review:
  strengths:
  - 'Correct dual-layer visualization: a semi-transparent muted raw-data line paired
    with a bold brand-green 30-day rolling average, exactly matching the spec''s requested
    technique'
  - 'Smart semantic color usage: the raw/noisy series is rendered in the INK_MUTED
    anchor rather than an arbitrary color, reserving Imprint brand green #009E73 for
    the hero trend line'
  - Explicit font sizing throughout with theme tokens correctly threaded to every
    chrome element in both light and dark renders
  - Rolling average line correctly starts 30 days after raw data, visually reflecting
    the window-size requirement from the spec
  - Realistic, neutral SaaS daily-active-users scenario with believable growth trend,
    weekend-dip pattern, and noise
  - Confidence band (band!) around the rolling average is a genuine Makie-distinctive
    touch that does render (faintly) in both themes
  weaknesses:
  - 'CRITICAL BUG (not visible in either render): the end-of-line scatter!() marker
    and the ''+N% growth'' text!() annotation added in the repair are NOT appearing
    in plot-light.png or plot-dark.png. Pixel-level inspection of both PNGs at the
    exact endpoint (rolling_days[end], rolling_avg[end]) finds only the plain line
    stroke — no distinct marker blob and zero ink-colored/INK-colored pixels anywhere
    near the expected text position. The line simply terminates with no dot and no
    label. This is very likely a z-order/limits or API-usage issue in the makie.jl
    text!/scatter! calls (e.g. axis autolimits or scene clipping swallowing the added
    plots) rather than a display artifact — verify by actually running the script
    and inspecting the raw PNG, not just eyeballing a downsized preview.'
  - The band!() confidence envelope around the rolling average does render, but at
    color=(BRAND, 0.12) it is barely perceptible against the busy raw-data lines crossing
    through it — confirmed present only via pixel-color search, not by eye. Consider
    bumping alpha to ~0.18-0.22 for genuine visual value.
  - Because the growth-callout annotation is invisible, Design Excellence / Library
    Mastery did not actually improve versus the pre-repair version from the reader's
    perspective — the code changed but the rendered plot did not.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: bold dark-ink title "line-timeseries-rolling · julia · makie · anyplot.ai" centered at top; axis labels "Date" (x) and "Daily Active Users (thousands)" (y) in dark ink; tick labels in softer gray; subtle light-gray gridlines on both axes; borderless legend top-left reading "Raw Data" and "30-Day Rolling Average" — all clearly readable against the light background.
      Data: thin, semi-transparent muted-gray raw-data line showing daily noise with a weekend-dip pattern, overlaid with a thick brand-green (#009E73) rolling-average line tracing a smooth upward trend from ~53 to ~80 (thousands); the green line starts ~30 days after the raw data, matching the window requirement. A very faint green-tinted confidence band is present around the rolling-average line (confirmed via pixel sampling; visually near-imperceptible). The end-of-line growth-percentage annotation and scatter marker described in the code are NOT visible — pixel inspection at the line's terminus shows only the bare line end, no dot, no text.
      Legibility verdict: PASS (for the visible chrome/text elements). The missing annotation is a rendering bug, not a legibility failure.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: title, axis labels, and tick labels flipped to light-colored ink and remain clearly legible; gridlines faint but present; legend borderless with light-colored text. No dark-on-dark failures.
      Data: colors identical to the light render — same muted-gray raw line and brand-green rolling-average line, confirming only chrome flipped between themes. Same missing end-of-line scatter marker and "+N% growth" text annotation as in the light render — confirmed absent via pixel search (zero ink-colored pixels in the expected bounding box).
      Legibility verdict: PASS (for visible elements); the intended growth annotation is absent in this render too, consistently with the light render.
