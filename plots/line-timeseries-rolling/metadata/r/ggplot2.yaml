      Data: First series (Raw Data) is a thin, semi-transparent brand-green (#009E73) line showing noisy daily engagement scores; second series (Rolling Average) is a bold, opaque lavender (#C475FD) line tracing the smoothed 14-day trend through a seasonal, sine-like pattern with an upward mid-cycle bump. A small lavender dot marks the peak.
      Legibility verdict: PASS

