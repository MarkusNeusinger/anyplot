review:
  strengths:
  - 'Excellent visual hierarchy: a thin semi-transparent (alpha=0.4) raw-data line
    is paired with a bold, opaque rolling-average line, cleanly separating signal
    from noise per the spec''s ''lighter raw data / prominent rolling average'' guidance.'
  - Legend labels are descriptive and dynamic (e.g. 'Rolling Average (14-day)'), surfacing
    the window size directly as the spec notes suggest.
  - Title correctly encodes descriptive text + spec-id + language + library per SC-04,
    with a dynamically computed fontsize that keeps it from overflowing.
  - Theme tokens (PAGE_BG/INK/INK_SOFT/GRID) are threaded through plot/panel background,
    axis text, and gridlines consistently — both renders are fully legible with no
    dark-on-dark or light-on-light issues.
  - 'Data colors (#009E73 raw, #4467A3 rolling average) are pixel-identical between
    light and dark renders; only chrome flips as required.'
  weaknesses:
  - 'Second series (Rolling Average) uses blue #4467A3 (canonical position 3) instead
    of the canonical position-2 lavender #C475FD, with no real-world color association
    (like temperature or water) justifying the skip — violates the ''use positions
    1→N in order, don''t cherry-pick'' palette rule. Fix: switch the rolling-average
    line color to #C475FD, or use a documented semantic exception.'
  - 'Design Excellence is largely default styling: no annotation calling out the peak/trough
    for storytelling, and vertical gridlines at month breaks (if present) are extremely
    subtle given the low-contrast GRID token — consider slightly stronger vertical
    gridlines so date reference lines stay legible, per the spec''s ''grid lines on
    both axes'' note.'
  - Library Mastery is generic idiomatic ggplot2 (geom_line + scale_color_manual +
    theme) without leveraging any distinctive ggplot2-specific capability (e.g. annotate()
    to mark the peak, or a geom_ribbon band) that would set the implementation apart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), matches spec.
      Chrome: Title "14-Day Rolling Average · line-timeseries-rolling · r · ggplot2 · anyplot.ai" is dark and fully readable at ~55% plot width. Axis titles "Date" and "Engagement Score" are dark and legible. Tick labels (INK_SOFT gray) are clearly readable, x-axis ticks rotated ~30° avoiding overlap. Legend ("Raw Data", "Rolling Average (14-day)") sits centered above the plot area, fully legible.
      Data: First series (Raw Data) is a thin, semi-transparent brand-green (#009E73) line showing noisy daily engagement scores; second series (Rolling Average) is a bold, opaque blue (#4467A3) line tracing the smoothed 14-day trend through a seasonal sine-like pattern with an upward drift.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), matches spec.
      Chrome: Title, axis titles, and tick labels all render in light ink tones (INK / INK_SOFT) against the dark background — no dark-on-dark failures observed. Gridlines are faint but visible. Legend text is legible in light gray.
      Data: Raw data (green) and rolling average (blue) colors are identical to the light render — only the background/chrome flipped as expected.
      Legibility verdict: PASS
