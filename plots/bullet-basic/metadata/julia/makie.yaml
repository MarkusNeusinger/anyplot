review:
  strengths:
  - Theme-adaptive grayscale bands with their own stops per theme stay distinct from
    each other and from the page in both renders
  - Target marker drawn in the INK token flips black/white and contrasts with both
    the green bar and every band
  - Data exercises all three qualitative zones and both above- and below-target measures
    on one common 0–100 scale
  - Clean top-to-bottom Makie script with an explicit Legend built from PolyElement/LineElement
    entries and a content-sized legend column via colsize!
  - One label color and size for every value label, readable on every band in both
    themes
  weaknesses:
  - 'Suggestion: barplot!(ax, 1:n, actuals; direction = :x, width = bar_h) would draw
    the measure bars with Makie''s high-level recipe instead of one Rect2f per bar.'
  - 'Suggestion: hold the thresholds [50, 75, 100] in a `ranges` variable instead
    of literals inside the loop; the INK_MUTED token is defined but never used.'
