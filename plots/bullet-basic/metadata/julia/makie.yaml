review:
  strengths:
  - Theme-adaptive grayscale bands with their own stops per theme stay distinct from
    each other and from the page in both renders
  - Target marker drawn in the INK token flips black/white and contrasts with both
    the green bar and every band
  - Data exercises all three qualitative zones and both above- and below-target measures
    on one common 0–100 scale
  - Clean top-to-bottom Makie script with an explicit Legend built from PolyElement/LineElement
    entries
  - One label color and size for every value label, readable on every band in both
    themes
  weaknesses:
  - 'VQ-05 (both): the x axis runs to 112 and the legend column takes 20% of the width,
    leaving an empty band of about 14% of the canvas between the bands'' end at 100
    and the legend → end the axis just past the longest value label (about 106) and
    shrink the legend column to its content (about 13%). Likely cause: xlims!(ax,
    -2.0, 112.0) and colsize!(fig.layout, 2, Relative(0.20)).'
  - 'DQ-03 (both): the title prefix ''Sales KPI Dashboard'' misstates the data: Customer
    Satisfaction, Project Completion and Code Quality are not sales metrics → a prefix
    that covers all five, such as ''Quarterly KPI Dashboard''. Likely cause: title_str.'
  - 'Suggestion: barplot!(ax, 1:n, actuals; direction = :x, width = bar_h) would draw
    the measure bars with Makie''s high-level recipe instead of one Rect2f per bar.'
  - 'Suggestion: `ax.yreversed = true` has no visible effect (the later ylims! call
    leaves Q1 Revenue at the bottom); remove it or keep the intended top-down order.'
  - 'Suggestion: hold the thresholds [50, 75, 100] in a `ranges` variable instead
    of literals inside the loop.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold title 'Sales KPI Dashboard · bullet-basic · julia · makie · anyplot.ai' (~36% of width) in dark ink; 'Score (%)' x label, 0–100 ticks and metric labels on the left in dark soft ink; only the bottom spine; faint vertical grid.
      Data: five horizontal bullets (Cost Efficiency top … Q1 Revenue bottom), each with three gray bands (dark 0–50, mid 50–75, light 75–100), a narrower #009E73 measure bar and a black target line; value labels 38%, 91%, 68%, 78%, 82% in dark ink. Legend on the right: Good, Satisfactory, Poor, Actual, Target. Empty band between x=100 and the legend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis label, ticks and metric labels in light ink; no dark-on-dark text.
      Data: bands flip to dark grays (still light-to-dark ordered, distinct from page), measure bars identical #009E73, target lines near-white, value labels light ink, '91%' readable on the good band.
      Legibility verdict: PASS
