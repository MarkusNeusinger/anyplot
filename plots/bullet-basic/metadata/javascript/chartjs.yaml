review:
  strengths:
  - Correctly implements the bullet chart via native Chart.js plugin hooks (beforeDatasetsDraw/afterDatasetsDraw)
    instead of reaching for an unsupported community plugin, per the library's no-workarounds
    rule
  - Qualitative bands are strictly grayscale as the spec instructs, built from the
    theme's ink token so they stay adaptive between light and dark
  - Over/under-target cue is shape-coded (▲/▼) rather than hue-coded, keeping the
    design colorblind-safe
  - Example data covers all three qualitative bands (poor, satisfactory, good) and
    both over-target and under-target outcomes, not just the easy satisfactory case
  - All four bullets share a common 0-150% 'percent of target' scale, matching the
    spec's dashboard-alignment guidance for comparing metrics
  - 'Custom legend (generateLabels) explicitly documents all five visual elements:
    Poor, Satisfactory, Good, Actual, Target'
  weaknesses:
  - Large unused vertical whitespace between bullet rows — the band (70px) and actual
    bar (26px) only fill a small fraction of each category lane's height, leaving
    noticeably empty gaps between the four metrics. Increase barPercentage/categoryPercentage
    or bandThickness so the bars/bands better fill the available row height.
  - The 'Poor' band (alpha 0.10 on the ink token) is nearly indistinguishable from
    the page background in both themes, both in the chart itself and in its legend
    swatch. Raise the minimum band alpha (e.g. to ~0.15-0.20) so all three qualitative
    bands stay visually distinct from the canvas background.
  - Band coloring is a simple single-channel alpha ramp on the ink token rather than
    a more deliberately designed grayscale progression — functional but not best-in-class
    polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Dark title "Quarterly KPI Dashboard · bullet-basic · javascript · chartjs · anyplot.ai" is fully readable; y-axis category labels (Revenue Growth, Customer Retention, Market Share, Net Promoter Score) and x-axis "Percent of Quarterly Target" title/ticks are dark and clearly legible against the light surface. Vertical gridlines are subtle but visible. Bottom legend (Poor, Satisfactory, Good, Actual, Target) is readable, though the "Poor" swatch is very light and low-contrast against the page background.
      Data: Four horizontal bullet rows. Each row shows three grayscale qualitative bands (light/medium/dark gray for Poor/Satisfactory/Good), a green (#009E73) "Actual" bar, a thin black vertical "Target" marker at 100%, and a bold text label with a triangle glyph (▼92%, ▲105%, ▼45%, ▲130%) showing over/under-target status without relying on color alone. First (and only) data series is the correct brand green #009E73.
      Legibility verdict: PASS (all text readable; only the lightest "Poor" band/swatch has low contrast, which is a design nitpick rather than a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: White/light title, axis labels, tick labels, and axis title are all clearly legible against the dark surface — no dark-on-dark text observed. The target marker correctly flips to white (from black in light mode), and gridlines remain subtle but visible. Legend text is light and readable; the "Poor" swatch is again the lowest-contrast element but still faintly distinguishable from the background.
      Data: Same four bullet rows with identical green (#009E73) Actual bars and identical percentage/arrow labels as the light render — confirms data colors are unchanged between themes, only chrome (background, text, target-marker color, band base-color) adapted.
      Legibility verdict: PASS (no dark-on-dark failures found; "Poor" band remains the only low-contrast element, consistent with the light render).
