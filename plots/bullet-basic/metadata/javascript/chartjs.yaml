review:
  strengths:
  - Correctly recreates a bullet chart using Chart.js floating-bar ranges ([start,end]
    tuples) for the three qualitative bands with the thinner 'Actual' bar overlaid
    at the same row position — a faithful, idiomatic solution despite Chart.js having
    no native bullet-chart type.
  - Grayscale range bands are built from the theme ink token with alpha-blending (10/18/28%),
    matching the spec's explicit 'use grayscale shading for background bands' note
    while staying theme-adaptive.
  - 'Deliberate data-design choice: normalizes four different KPI metrics onto a shared
    ''% of quarterly target'' scale so all four bullets are directly comparable on
    one axis, matching the spec''s ''align on a common scale'' guidance.'
  - Explicit font sizing throughout (title 22px, axis title 16px, ticks 14px, legend
    16px, value labels 16px/600 weight) stays legible in both themes and at mobile
    scale.
  - Clean custom legend (generateLabels) accurately represents all five visual roles
    (Poor/Satisfactory/Good/Actual/Target) without a stray default entry.
  weaknesses:
  - The target marker (spec's required 'thin contrasting line') is completely missing
    for the last category, 'Net Promoter Score' (target=100%), in BOTH light and dark
    renders — it renders correctly for the other three rows but is entirely absent
    here. Investigate the bulletExtras plugin's per-row clamping (Math.max(row.y-half,
    chartArea.top) / Math.min(row.y+half, chartArea.bottom)) for the bottom-most row
    and confirm goodMeta.data[3] resolves to a valid bar element before the stroke
    call.
  - None of the four example metrics land in the 'Poor' band (all actuals are >=68%,
    above the 60% Poor threshold) — the demo never shows a bullet with its actual
    bar in the worst qualitative zone. Shift one metric's actual value below the Poor/Satisfactory
    boundary (e.g. ~45%) so the chart demonstrates all three qualitative outcomes.
  - Data storytelling is only moderate — value labels and color help, but there is
    no additional visual emphasis calling out which metrics beat vs. missed target;
    consider a subtle visual cue (e.g. accent tone) that immediately differentiates
    over/under-target status beyond reading the numbers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — correct.
      Chrome: Title "Quarterly KPI Dashboard · bullet-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top; x-axis title "Percent of Quarterly Target" below the axis; % tick labels (0%-150%) in soft gray; four category labels (Revenue Growth, Customer Retention, Market Share, Net Promoter Score) in soft gray on the left; bottom legend (Poor/Satisfactory/Good/Actual/Target swatches) in dark ink. All text is clearly readable against the light background.
      Data: Four horizontal bullet rows. Each row shows three grayscale qualitative bands (lightest=Poor 0-60%, light-medium=Satisfactory 60-85%, darkest gray=Good 85-140%) with a thinner brand-green (#009E73) "Actual" bar overlaid at the same vertical center, plus a bold value label (92%, 105%, 68%, 130%) to the right of each green bar. A thin black vertical "Target" tick at 100% is visible for the top three rows (Revenue Growth, Customer Retention, Market Share) but is MISSING for the bottom row (Net Promoter Score) — confirmed by close-up crop, no black line appears anywhere in that row despite target=100 being identical to the other rows.
      Legibility verdict: PASS (text legible; but see functional defect above — target marker missing on last row)

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — correct.
      Chrome: Same title, axis title, tick labels, category labels, and legend, all rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary) — clearly readable against the dark background. No dark-on-dark failures observed.
      Data: Identical layout and data to the light render. The brand-green Actual bars are the same #009E73 hue as light mode (data colors held constant across themes, as required). Grayscale bands correctly re-derived from the dark-mode ink token (lighter gray = higher-contrast "Good" band, matching the light-mode contrast logic in reverse polarity). The white "Target" tick is visible for the top three rows but — exactly as in the light render — is MISSING for the bottom row (Net Promoter Score).
      Legibility verdict: PASS (text legible; same functional defect as light render — target marker missing on last row, confirmed identical bug in both themes)
