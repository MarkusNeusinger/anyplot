review:
  strengths:
  - 'Creative composition builds a genuine Stephen Few-style bullet chart from MUI
    X primitives (no native bullet type exists): overlaid horizontal BarCharts for
    grayscale range bands vs. a thin actual-value bar, plus ChartsReferenceLine for
    the target marker.'
  - 'Data set covers 4 diverse KPIs with real variety: two exceed target (New Customers
    Acquired, Support SLA Compliance) and two fall short (Quarterly Revenue, Project
    Milestones), across different units ($M, count, %, %) — strong feature coverage.'
  - 'Theme-adaptive chrome is correctly threaded through: grayscale bands and the
    target line derive from t.ink/hexToRgba so they stay legible on both the light
    and dark surface, while the brand-green actual bar stays identical across themes.'
  - Title format, per-row value labels (actual / target), and the harness contract
    (export default, skipAnimation, sizing from window.ANYPLOT_SIZE) are all implemented
    correctly.
  - Deterministic, in-memory data with clean imports and no over-engineering.
  weaknesses:
  - Vertical whitespace between bullet rows is very generous (rowHeight ~170 CSS px
    vs. a 46px band) — tighten ROW_GAP / row height so the four bullets read as a
    denser, more space-efficient dashboard block, per the spec's own framing of the
    bullet chart as a compact/space-efficient design.
  - No caption or legend explains what the grayscale bands (poor/satisfactory/good)
    or the black/white target line represent — a first-time viewer must infer this
    from convention alone; a small caption row (e.g. 'Poor · Satisfactory · Good'
    band key, 'Target' marker label) would strengthen clarity without adding clutter.
  - BAND_HEIGHT (46 CSS px) is fairly thin; when the PNG is scaled down to the ~400px
    mobile width, the bullet band compresses to only a few pixels tall — consider
    a modest increase for more robust mobile legibility.
  - 'Library Mastery is solid but generic: the stacked-BarChart + ChartsReferenceLine
    workaround is a sound composition, but doesn''t yet reach for a feature that''s
    harder to replicate elsewhere (e.g. richer slotProps-driven band labeling, or
    an axis-level annotation for the target value) to push Library Mastery further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bullet-basic · javascript · muix · anyplot.ai" in dark ink, top-left. Four right-aligned row labels ("Quarterly Revenue ($M)", "New Customers Acquired", "Support SLA Compliance (%)", "Project Milestones (%)") in dark ink at fontSize 16. Value labels ("82 / 90", "145 / 130", "96 / 95", "68 / 80") in a softer dark gray at fontSize 15. All fully readable against the light background.
      Data: Grayscale range bands (darkest = poor band, lightest = good band) sit behind a thin brand-green (#009E73) actual-value bar in every row; a thin black vertical target-marker line crosses each band at the target value. First (and only) series color is #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and row/value labels now rendered in light ink/soft-light gray, clearly visible against the dark background. No dark-on-dark text anywhere.
      Data: Grayscale range bands now built from a light-ink overlay at the same alpha steps (still distinguishable band-to-band), the target marker line is now white for contrast, and the actual-value bar is the identical brand green #009E73 seen in the light render — only the chrome flipped, as required.
      Legibility verdict: PASS
