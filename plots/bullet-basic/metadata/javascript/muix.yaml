review:
  strengths:
  - 'Composes the bullet natively in MUI X: ChartsContainer with a stacked horizontal
    BarPlot for the qualitative bands, plus a small custom SVG layer that reads useXScale/useDrawingArea
    so the measure bar and target marker sit exactly at their data values on the chart''s
    own linear scale'
  - 'Grayscale bands are derived from the ink token at falling opacity, so they form
    a steady poor-to-good progression and stay distinguishable from each other and
    from the page in both themes, while the measure bar keeps Imprint #009E73 identical
    across renders'
  - Measure bar is 36 % of the band height and the target marker 72 %, drawn in the
    ink token (near-black on light, near-white on dark), so the target contrasts with
    bar and bands in both themes, including where it crosses the green bar (New Customers,
    SLA)
  - 'Clear typographic hierarchy in the side columns: right-aligned metric labels,
    a bold actual value with a softer target figure, all aligned in one column for
    quick scanning'
  - Realistic, neutral KPI dashboard data with two metrics beating the target and
    two falling short; axis limits come from the data (max of actual, target, ranges),
    not typed numbers
  - Per-bullet scales are a justified choice since the four metrics are in different
    units ($M, count, %), and the subtitle states it explicitly; skipAnimation is
    set on chart and BarPlot
  weaknesses:
  - 'Suggestion: the ''Target 90'' text beside each actual value repeats what the
    target marker already shows; dropping it would leave the actual-value label the
    Notes allow as the single text annotation per bullet.'
  - 'Suggestion: the subtitle partly repeats the band legend (''bands Poor / Satisfactory
    / Good''); trimming it to the scale note would tighten the header.'
  - 'Suggestion: the key row starts at the chart''s left edge while the title is centered;
    aligning both on one axis would make the header read as one block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: centered bold title "bullet-basic · javascript · muix · anyplot.ai" in dark ink, a soft-ink subtitle "4 metrics · bands Poor / Satisfactory / Good · each bullet on its own scale from 0", and a key row (Poor/Satisfactory/Good gray swatches, green Actual swatch, black Target tick). Four rows, each with a right-aligned metric label (Quarterly Revenue ($M), New Customers Acquired, Support SLA Compliance (%), Project Milestones (%)), its own x axis with dark tick labels (0–100, 0–160, 0–100, 0–100), and a value column on the right ("82 Target 90", "145 Target 130", "96 Target 95", "68 Target 80"). All text crisp and readable; no overlap, no clipping.
      Data: three grayscale bands per row, darkest for Poor, lightest for Good, each ending at its threshold; a narrower #009E73 measure bar from 0 to the actual value; a thin near-black vertical target marker at the target value, crossing the green bar where the actual exceeds the target.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, labels, subtitle, key and tick labels switch to light ink / soft light ink and are all clearly readable; no dark-on-dark text. Axis lines and ticks are light.
      Data: measure bars are the identical #009E73 green; bands are built from the light ink at the same opacities, so Poor is the lightest gray and Good the darkest, still distinguishable from each other and from the page; the target marker flips to near-white and contrasts with the green bar and the gray bands.
      Legibility verdict: PASS
