review:
  strengths:
  - Clever compositing of two absolutely-positioned BarChart layers (grayscale range
    bands + a slim green measure bar with a ChartsReferenceLine target marker) authentically
    replicates Stephen Few's bullet-chart convention, which MUI X has no native component
    for.
  - Range-band grays are derived from the theme ink token via alpha blending (hexToRgba(t.ink,
    alpha)) rather than hardcoded hex values, so the bands automatically stay theme-correct
    in both light and dark renders.
  - Four KPIs span different domains (currency, headcount, percentage x2) and different
    actual-vs-target outcomes (below, above, and near target), giving strong feature
    and data coverage across the sample.
  - Explicit, theme-token-driven font sizing throughout (title 22px, row label 16px,
    value 15px, legend key 13px) keeps every text element legible and theme-adaptive
    in both renders.
  - skipAnimation set on both layered BarChart instances and export default component
    correctly follow the muix harness contract.
  weaknesses:
  - Target-value labels (e.g. '90', '130') render at fontSize 11 CSS px, noticeably
    smaller than the 14-16px axis/legend guidance in prompts/library/muix.md — bump
    to ~13-14px so they stay legible when the PNG is scaled to mobile width.
  - The green measure bar uses identical brand green regardless of whether the KPI
    is above or below its target, so the chart doesn't visually flag misses vs. beats
    beyond the target line itself — a subtle secondary cue (e.g. bolding the value
    text) could strengthen the data storytelling.
  - The canvas stays fairly plain (flat cream/near-black background, no subtle row
    banding or elevated surface for the legend) — there's room for another pass of
    visual refinement toward more editorial polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — matches spec.
      Chrome: Title "bullet-basic · javascript · muix · anyplot.ai" in dark ink, top-left, clearly readable. A small legend row (Poor / Satisfactory / Good swatches + Target line) sits below the title, all in soft dark gray text. Four stacked KPI rows follow, each with a right-aligned dark-ink label on the left, a bullet graphic in the middle, and a lighter "actual / target" value on the right. All text renders crisply against the light background.
      Data: Each row shows three grayscale background bands (darkest = Poor, lightest = Good) with a slim, bright #009E73 (brand green) bar overlaid showing the actual value, and a thin black vertical target line with a small numeric label. First (and only) data series correctly uses #009E73.
      Legibility verdict: PASS — all text (title, row labels, values, legend, target labels) is clearly readable against the light background; no light-on-light issues observed. The target-line numeric labels (e.g. "90", "130") are small but legible due to bold weight.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — matches spec.
      Chrome: Same title and legend layout, now rendered in light ink/off-white text, clearly visible against the dark background. Row labels and values also flip to light text tones.
      Data: The grayscale range bands flip to lighter grays appropriate for the dark surface (bands are still darkest→lightest for Poor→Good, now using lighter ink-with-alpha values against black). The green measure bar is unchanged — #009E73, identical to the light render. The target line and its numeric label flip to white for contrast against the dark bands.
      Legibility verdict: PASS — no dark-on-dark text found; all title/label/value/legend text is light-colored and reads clearly. Brand green remains vivid and distinguishable from both the dark background and the gray bands.

    Both renders confirm the data color (brand green #009E73) is identical between themes, while all chrome (background, text, range-band grays, target-line color) correctly flips per theme.
