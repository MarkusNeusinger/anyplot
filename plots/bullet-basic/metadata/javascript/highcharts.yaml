review:
  strengths:
  - 'Correct plot type: horizontal bar (actual) + scatter (target, via a custom SVGRenderer
    symbol) reproduces a bullet chart from core Highcharts primitives with no add-on
    modules, per the library''s constraints'
  - Target marker is a clean custom 'targettick' symbol — thin, perpendicular, correctly
    positioned per-row target value in both themes
  - Theme-adaptive chrome is threaded correctly throughout (title, subtitle, axis
    labels, tick labels, gridlines, legend) — both renders are fully legible with
    no dark-on-dark or light-on-light failures
  - Data labels on the Actual bar ('92%', '68%', etc.) are legible, well-placed to
    the right of each bar with no overlap with the target tick or band edges
  - Realistic, neutral dataset (quarterly quota attainment by sales region) with sensible
    per-row target/range values and a shared 0-140% scale that keeps rows comparable
  - Title format, canvas size, animation:false, credits disabled, and the mount-node
    contract are all followed correctly
  weaknesses:
  - 'Critical: the qualitative range bands (Poor/Satisfactory/Good) render in the
    WRONG spatial order — verified by pixel-sampling both plot-light.png and plot-dark.png
    at multiple rows (North America, EMEA, APAC). For North America (ranges=[60,85,140]),
    the lightest band (''Good'' per the legend swatch) spans 0-55%, the mid band (''Satisfactory'')
    spans 55-80%, and the darkest band (''Poor'' per the legend swatch) spans 80-140%
    — i.e. exactly reversed from the intended 0-60% Poor / 60-85% Satisfactory / 85-140%
    Good. This reproduces identically for EMEA (ranges=[50,75,140], observed light
    0-65%, mid 65-90%) and APAC (ranges=[65,90,140], observed light 0-50%, mid 50-75%):
    in every case the segment WIDTHS are correct but assigned in reverse order, so
    the ''Good'' width is drawn first (nearest the axis origin) and the ''Poor'' width
    is drawn last (farthest from origin). Root cause: Highcharts defaults `reversedStacks:
    true` on the value axis for inverted/bar-type charts, which stacks series in the
    reverse of their declared array order (Poor, Satisfactory, Good) for horizontal
    bars. Fix: set `yAxis.reversedStacks: false` (the value axis, which is named `yAxis`
    in this bar-chart config) so the declared series order (Poor, Satisfactory, Good)
    stacks from the origin outward as intended. This is not a cosmetic issue — for
    North America the actual bar (92%, excellent vs. a 100% target) visually terminates
    inside what reads as the darkest (''Poor''-colored) band, actively misleading
    the viewer about performance quality, which defeats the entire purpose of a bullet
    chart''s qualitative background bands.'
  - As a direct consequence, the legend (Poor/Satisfactory/Good swatches) no longer
    describes what's spatially shown in the chart, compounding the confusion for anyone
    reading legend-to-band.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bullet-basic · javascript · highcharts · anyplot.ai" (bold, dark ink) and subtitle "Quarterly quota attainment by sales region" (softer gray) both fully readable at the top. Y-category labels (North America, EMEA, APAC, LATAM, Global Digital) and the x-axis "% of Quarterly Quota" title/tick labels (0%-140%) are all dark-on-light and legible. Legend at the bottom (Poor, Satisfactory, Good, Actual, Target) is fully legible with no clipping.
      Data: Five horizontal bullet rows, each with three stacked grayscale range bands, a brand-green (#009E73) "Actual" bar with a bold "%" data label, and a thin black vertical "Target" tick. Pixel-sampling confirms a correctness bug: the three grayscale bands are stacked in reverse order relative to their labeled ranges — the lightest band (legend = "Good") occupies the low-value end of the axis (e.g. 0-55% for North America) and the darkest band (legend = "Poor") occupies the high-value end (80-140%), the opposite of the intended Poor→Satisfactory→Good progression from 0 outward. This was verified identically for North America, EMEA, and APAC rows via direct pixel boundary measurement.
      Legibility verdict: PASS (all text readable), but the chart's core qualitative-range feature is semantically inverted — see Weaknesses.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink, fully legible against the dark background. Axis labels, tick labels, and legend text are all light-on-dark and clearly readable — no dark-on-dark failures observed.
      Data: Same layout and same brand-green (#009E73) "Actual" bars and white "Target" ticks as the light render — data colors are identical between themes, confirming only chrome (band gray tones, text, gridlines) adapted to the dark surface. Pixel-sampling of the North America row confirms the identical band-order inversion present in the light render (Good-width band nearest the origin, Poor-width band farthest), proving this is a data/config-level bug (Highcharts' default `reversedStacks: true` for bar-type stacking) rather than a theme-specific rendering artifact.
      Legibility verdict: PASS (all text readable in both themes), same inverted-range-band defect as the light render.
