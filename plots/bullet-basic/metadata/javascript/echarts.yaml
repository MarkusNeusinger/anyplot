review:
  strengths:
  - 'Correct bullet-chart anatomy: three stacked grayscale range bands (Poor/Satisfactory/Good),
    a narrower green ''Actual'' bar overlaid via barGap: ''-100%'', and a thin rect-symbol
    ''Target'' marker per row — exactly the Stephen Few construction the spec calls
    for.'
  - All four rows share one common 0-100% scale as the spec recommends, and the sample
    data deliberately includes both above-target (Customer Retention 91 vs 85, On-Time
    Delivery 95 vs 90) and below-target (Revenue Growth 82 vs 90, NPS Score 68 vs
    75) cases, giving the chart genuine at-a-glance insight value.
  - 'Theme-adaptive tokens are threaded through consistently: band shading and the
    target marker both derive from t.ink (so the target line correctly renders black-on-light
    and white-on-dark), and the first/only categorical data series is the mandated
    #009E73.'
  - Value labels ('82%', '91%', ...) are placed to the right of each bar without colliding
    with the target marker or adjacent rows in either theme.
  - Clean, deterministic, single-block KISS structure with no functions/classes, matching
    the ECharts snippet convention.
  weaknesses:
  - No explicit x-axis title (e.g. '% of Target') — the axis relies solely on the
    per-tick '%' suffix; add a descriptive axis name for full VQ-06 credit.
  - 'In the dark render, the ''Good'' range band (75-100%) is nearly indistinguishable
    from the page background (opacity 0.06 on light ink over #1A1A17) — still visible
    in light theme but too faint in dark theme; raise the dark-theme band opacity
    slightly or use a separate light-theme/dark-theme opacity ramp so all three bands
    stay perceptible in both themes.'
  - Title occupies only ~40% of canvas width at fontSize 20 despite being a ~72-character
    mandated+prefixed string — comfortably readable but visually small relative to
    the 3200px canvas; a modest fontSize bump (e.g. 22-24) would balance it better
    against the rest of the chrome.
  - Uses a scatter+rect-symbol workaround for the target marker instead of ECharts'
    native markLine/markPoint coord-based API — functionally correct and a common
    community pattern for per-category bullet ticks, but doesn't showcase the library's
    own annotation primitives.
  - Design stays close to the textbook Stephen-Few reference implementation (grayscale
    bands, black target, single accent color) without additional visual-hierarchy
    touches (e.g., callout annotation on the biggest miss/beat, subtle band border,
    or refined legend swatch shapes) that would lift it from 'good' to 'exceptional'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Quarterly KPI Dashboard · bullet-basic · javascript · echarts · anyplot.ai" is dark, centered, and fully readable. Legend (Poor, Satisfactory, Good, Actual, Target) sits below the title in dark-gray text with matching swatches. Y-axis category labels (Revenue Growth, Customer Retention, NPS Score, On-Time Delivery) and x-axis 0%-100% tick labels are dark and clearly legible. Faint vertical gridlines mark 20% increments.
      Data: Each row shows three grayscale stacked bands (darkest = Poor 0-50%, medium = Satisfactory 50-75%, near-invisible-but-present = Good 75-100%), a green (#009E73) "Actual" bar overlaid on top with a "%" value label to its right, and a thin black vertical "Target" tick mark. Data colors read clearly against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend text, y-axis category labels, and x-axis percentage ticks all render in light gray/white and remain fully readable against the dark background — no dark-on-dark failures observed. Gridlines are subtle but visible.
      Data: The "Actual" bar is the identical #009E73 green as the light render. The "Target" marker correctly flips to a light/white rect (theme-adaptive ink), keeping it visible against the dark bands. The three range bands are present but the "Good" (rightmost) band is very faint, nearly blending into the page background — a minor theme-specific legibility softness, though not a hard failure since it is a low-emphasis-by-design contextual band, not text or the primary data mark.
      Legibility verdict: PASS (with the minor "Good" band contrast note above)
