review:
  strengths:
  - 'Basic bullet chart with exactly the three layers plus the allowed value label:
    grayscale bands, a narrower #009E73 measure bar and an ink target marker'
  - Band shades flip per theme and keep a steady progression from poor to good in
    both renders
  - All metrics rescaled to their top band so the four bullets share one zero-based
    linear axis, with the metric's units in its label
  - Value label placed past whichever is longer, bar or target marker, so it never
    collides
  - layer_tooltips() with metric, actual, target and achievement lines in the HTML
    output
  weaknesses:
  - 'DE-02 (both): a frame on all four sides of the panel where the bullet chart needs
    none → left and bottom only, or none. Likely cause: theme_minimal() panel border
    kept; set panel_border=element_blank().'
  - 'Suggestion: the value label could carry the metric''s unit (e.g. $275K) so it
    reads without the row label.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, a thin frame around all four sides of the panel.
      Chrome: bold dark title 'bullet-basic · python · letsplot · anyplot.ai', INK_SOFT subtitle 'Q4 2024 Dashboard — Actual vs. Target Performance', x-axis 'Performance (% of top band)' with ticks 0-110, bold dark metric labels (Revenue ($K), Profit Margin (%), Satisfaction (1-5), New Customers). Thin vertical grid visible only between the bullets. All readable.
      Data: four stacked bullets; grayscale bands dark (#585858) to the poor limit, medium (#989898) to satisfactory, light (#D0D0D0) to 100; a narrower #009E73 measure bar per bullet; a thick-ish near-black target marker; bold ink value labels 275, 38, 3.8, 42 past the bar or marker. New Customers passes its target, the other three fall short.
