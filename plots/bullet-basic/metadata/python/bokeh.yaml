review:
  strengths:
  - 'Exactly the three basic layers per bullet with one #009E73 measure color and
    the allowed value label, aligned in a column clear of every target marker'
  - Every metric normalized to its own top band so all five bullets share one linear
    0-100 axis
  - Grayscale bands step steadily and stay distinct from the page in both themes;
    target marker uses the INK token and contrasts with bar and bands in both
  - Native bokeh Legend built from legend_label, reordered and placed below the plot
    with add_layout
  - HoverTool bound to the measure renderer exposes actual, target and percent in
    the HTML
  weaknesses:
  - 'Suggestion: the x-axis line still runs from -26 to 118 beyond the 0-100 bands;
    a Range1d tied to the label width would end it closer to the data.'
  - 'Suggestion: label the bullets with a FactorRange y-axis instead of floating Labels
    so the layout follows the data.'
