review:
  strengths:
  - 'Exactly the three basic layers per bullet with one #009E73 measure color and
    the allowed value label, aligned in a column clear of every target marker'
  - Every metric normalized to its own top band so all five bullets share one linear
    0-100 axis
  - Grayscale bands step light-to-dark steadily and stay distinct from the page in
    both themes; target marker uses the INK token and contrasts in both
  - HoverTool bound to the measure renderer exposes actual, target and percent in
    the HTML
  weaknesses:
  - 'VQ-05 (both): the x-range starts at -38, so the canvas''s left ~17 % stays empty
    and the x-axis line runs about 450 px left past the metric labels → start the
    range just left of the longest metric label (about -25) or let the labels sit
    in the y-axis. Likely cause: x_range=Range1d(-38, 118) typed by hand.'
  - 'CQ-04 (code): the band and target legend is drawn by hand (lines 186-202: rects,
    a separator segment and Labels in data coordinates) → pass legend_label to the
    band rect calls and the target rect and place the native Legend with p.add_layout(p.legend[0],
    ''below''). Likely cause: a custom legend layout.'
  - 'Suggestion: label the y-axis categories with a FactorRange instead of floating
    Labels so the layout follows the data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: centered bold title 'bullet-basic · python · bokeh · anyplot.ai'; metric labels (Revenue ($K), Profit ($K), Orders, Customers, Satisfaction (/5)) right-aligned left of the bullets in dark ink; x-axis ticks 0-100 and italic label '% of Maximum Range'; bold value labels 275, 85, 320, 1450, 4.2 in a column right of the bands; legend row Poor / Satisfactory / Good / Target below the bullets. All readable.
      Data: five horizontal bullets; bands dark gray (Poor) to light gray (Good); narrow #009E73 measure bars; thin near-black target markers. Large empty margin at the left edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, metric labels and value labels in light ink, ticks and legend in soft light ink; no dark-on-dark text.
      Data: measure bars the same #009E73 as light; bands re-stepped for dark (#484848, #666666, #858585), each distinct from the page; target markers flip to light ink and contrast with bar and bands.
      Legibility verdict: PASS
