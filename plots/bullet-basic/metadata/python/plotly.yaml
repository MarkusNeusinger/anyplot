review:
  strengths:
  - Uses plotly's native go.Indicator bullet gauge with steps and threshold
  - Metric labels carry their units ($K)
  - Neutral KPI data covering all three qualitative bands
  weaknesses:
  - 'VQ-02 (both): the tick-label rows of the upper three bullets are hidden behind
    the next bullet''s bands, leaving only fragments such as ''0'' and ''00'' → leave
    room below each gauge for its tick row (larger spacing). Likely cause: spacing
    = 0.025 between indicator domains.'
  - 'SC-03 (both): values cannot be read off the axes of Revenue, Profit and Customers
    because their ticks are hidden → make every tick row visible. Likely cause: the
    same 0.025 domain spacing.'
  - 'SC-01 (both): measure bars and value numbers switch between green and red by
    performance, with an ''Above/Below target'' footer; the basic variant asks for
    one measure-bar color → one #009E73 bar color and no status footer. Likely cause:
    bar_color = ABOVE_TARGET if meets_target else BELOW_TARGET and the two add_annotation
    calls.'
  - 'VQ-07, SC-02 (both): bands are custom blue-gray hexes (#8B9DAF, #B4C0CA, #D5DDE2
    / blue rgba overlays), outside Imprint and not the grayscale the Notes ask for
    → grayscale ink at graded opacity. Likely cause: range_colors.'
  - 'VQ-04 (both): green vs red bar fill is the only cue for pass/fail on the bars
    → one bar color removes the red-green signal. Likely cause: the performance-based
    bar_color.'
  - 'Suggestion: ELEVATED_BG and INK_MUTED are defined but unused.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: centered title 'bullet-basic · python · plotly · anyplot.ai' in dark ink; metric labels Revenue ($K), Profit ($K), Customers, Satisfaction left of each bullet; footer '▲ Above target' (green) and '▼ Below target' (red). Only the last bullet's tick row (0–5) is readable; the tick rows of the upper three bullets are hidden behind the next bullet's bands, leaving fragments such as '0' and '00' / '20' at the edges.
      Data: four stacked bullets with blue-gray bands (#8B9DAF, #B4C0CA, #D5DDE2) and a thin gauge border; measure bars green for Revenue (above target) and red for the other three; black target markers; value numbers colored like the bars.
      Legibility verdict: FAIL (upper tick labels hidden)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and metric labels in light ink, no dark-on-dark text; same hidden tick rows as light.
      Data: same green/red bars as light; bands are blue-gray rgba overlays, subtle but distinguishable; target markers light ink.
      Legibility verdict: FAIL (upper tick labels hidden)
