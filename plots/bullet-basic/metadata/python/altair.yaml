review:
  strengths:
  - One Imprint-green measure bar throughout, narrower than the grayscale bands and
    running from zero, with a thin ink-token target tick that contrasts with bar and
    bands in both themes
  - Four KPIs on different units normalised to percent of their top threshold so all
    bullets share one common scale, while the value labels keep the original units
    (275, 85, 320, 4.2)
  - 'Idiomatic Altair layering: band segments via x/x2 range encoding, mark_bar, mark_tick
    and mark_text layers sharing one y encoding and one x scale'
  - Theme tokens threaded through title, axes, legend, target marker and value labels;
    both renders fully legible
  - Native tooltips on bands, measure and target add precise values in the HTML output
  weaknesses:
  - 'Suggestion: the x axis carries a tick label every 5 % (24 labels); a coarser
    step such as every 10 or 20 % would read calmer.'
  - 'Suggestion: the dark Poor band (#2e2e2e) and its legend swatch sit close to the
    page and legend fill; a slightly lighter first stop would separate them more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct; legend box on the slightly lighter elevated fill.
      Chrome: centered bold title "bullet-basic · python · altair · anyplot.ai" (~37 % of width); bold dark-gray metric labels (Revenue ($K), Profit ($K), New Customers, Satisfaction) on the left; x axis 0–110 ticked every 5 with title "Performance (% of Goal)"; bottom legend "Performance band: Poor / Satisfactory / Good". All text readable.
      Data: four stacked bullets; three grayscale bands (#e8e8e8 → #c8c8c8 → #a0a0a0) ending at each metric's thresholds and at 100; a narrower #009E73 measure bar from zero (Revenue ~92, Profit ~68, New Customers ~91, Satisfaction ~84); a thin near-black target tick at 83, 80, 86, 90; bold ink value labels 275, 85, 320, 4.2 right of each bar.
