review:
  strengths:
  - 'Clean three-layer bullet: grayscale bands, narrower #009E73 measure bar from
    zero and a thin ink target marker that flips to light ink in dark mode'
  - Theme-adaptive band steps keep the poor-to-good progression distinguishable from
    each other and from the page in both renders
  - scale_fill_identity(guide='none') passes precomputed band colours through geom_rect
    without a spurious legend
  - Five bullets on one common 0-100% scale with actual-value labels beside each bar
    end
  weaknesses:
  - 'Suggestion: the zone key sits at Revenue''s thresholds only; the lower rows use
    other thresholds, so a reader may misread their bands.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title 'bullet-basic · r · ggplot2 · anyplot.ai' top-left; metric labels (Revenue, Customer Sat., Cost Efficiency, Product Quality, Market Share) in dark ink on the left; x ticks 0%-100% in soft ink; x-axis title 'Performance (% of goal)'; muted italic zone key Poor / Satisfactory / Good above the first bullet; muted caption 'Bar = actual performance · Vertical line = target · Label = actual value'. All readable.
      Data: five horizontal bullets; three grayscale bands per row (darkest poor to lightest good, ending at 100); #009E73 measure bars at half band height; near-black target markers at 95/80/75/85/70; value labels 87%/72%/63%/91%/58% beside the bar ends. Subtle vertical grid at 20% steps.
