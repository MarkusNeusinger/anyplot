review:
  strengths:
  - 'Correct three-layer bullet structure: grayscale geom_rect bands, half-height
    Imprint-green measure bars from zero, INK geom_segment target markers'
  - Theme-adaptive grayscale bands that keep a steady progression and stay distinct
    from the page in both renders
  - Zone key (Poor / Satisfactory / Good) placed above the first bullet in muted italics,
    clear of all data
  - All bullets share one 0-100 scale with x-only subtle grid, which makes the five
    metrics directly comparable
  - Idiomatic scale_fill_identity(guide = 'none') and expansion(add = 0.7) for row
    padding
  weaknesses:
  - 'VQ-06 (both): the x-axis title reads ''Performance (% of target)'' while the
    target markers sit at 70-95, so the unit contradicts the chart → a unit the targets
    agree with, e.g. ''Performance (% of goal)'' or ''Score (%)''. Likely cause: labs(x
    = ...).'
  - 'CQ-04 (code): three near-identical annotate(''text'', ...) calls (zone labels)
    and dead constants ELEVATED_BG, IMPRINT_PALETTE positions 2-8 and an unused set.seed()
    add lines with no effect → one annotate(''text'', x = c(poor_mid, sats_mid, good_mid),
    label = c(''Poor'', ''Satisfactory'', ''Good''), ...) call and delete the unused
    constants. Likely cause: copy-pasted annotation calls and the template''s palette
    block.'
  - 'Suggestion: the zone key is placed at Revenue''s thresholds only; a note that
    thresholds vary per metric would help readers of the lower rows.'
