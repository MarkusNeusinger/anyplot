review:
  strengths:
  - 'Tree layout computed from the parent column alone: leaves in depth-first slots,
    each parent centered over its children, so siblings group and every level sits
    on its own row'
  - Per-level label color (white on green and blue, near-black on purple and amber)
    keeps every node label readable in both themes
  - Node area and label size step down with depth, making the root the clear focal
    point
  - Page-colored node outlines and soft, thin edges keep edges lighter than nodes
    and traceable parent to child
  - Exact 3200x1800 canvas via figsize=(8, 4.5), dpi=400 and subplots_adjust instead
    of bbox_inches='tight'
  weaknesses:
  - 'CQ-01 (code): lines 110-118 define a recursive helper function place() inside
    the Plot block → compute positions without a function: leaves take consecutive
    slots in depth-first order (an explicit stack loop), then each level from max_level-1
    up to 0 sets x as the mean of its children''s x. Likely cause: the depth-first
    layout written as a def.'
  - 'Suggestion: elbow (orthogonal) edges drawn with ax.annotate connectionstyle=''angle''
    or a LineCollection would show off matplotlib''s line tooling.'
  - 'Suggestion: the leaf abbreviations (Sess, Btns, Prod, Fmt) could be spelled out
    where the node width allows.'
