review:
  strengths:
  - 'Tidy-tree layout derived from the df alone: leaves take consecutive slots and
    each parent is centred over its children, so siblings are grouped and no edge
    crosses another'
  - Edges drawn as one continuous pygal XY walk in muted ink, thinner and lighter
    than the nodes, traceable from parent to child with no spurious links
  - Axes, guides and tick labels switched off, so position reads only as depth, as
    the spec asks
  - 'Theme tokens threaded through pygal''s Style: chrome flips cleanly while the
    Imprint tier colors stay identical in both renders'
  - Per-point {'value','label'} dicts give every node its own label in the PNG and
    a tooltip in the interactive HTML
  weaknesses:
  - 'VQ-02 (both): each node label sits directly below its node, where the edges to
    its children leave, so edges run through the text of ''CEO'', ''VP Engineering'',
    ''VP Sales'', ''Dir Frontend'', ''Dir Backend'', ''Dir Americas'', ''Dir EMEA''
    → labels clear of every edge (for example above the node or beside it on the side
    away from the child edges). Likely cause: pygal''s default point-label position
    under the dot combined with child edges leaving the dot downward.'
  - 'VQ-01 (both): node labels at 30px, below the style guide''s 44px tick/legend
    reference, read small next to the 44px legend → about 40-44px (+10 to +14px),
    with node spacing kept so neighbours on the manager row stay apart. Likely cause:
    the inline css rule font-size:30px.'
  - 'CQ-01 (code): two helper functions place() and trace() (recursive) plus the mutable
    next_leaf=[0] counter break the Imports → Data → Plot → Save structure → compute
    leaf slots and parent centers with flat loops over depth (deepest level first)
    and build the edge list as one loop over df rows with None separators. Likely
    cause: recursive tree-walk design.'
  - 'Suggestion: a larger node label font could carry tier names directly and let
    the legend shrink to the edge layer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes, no grid.
      Chrome: title "network-hierarchical · python · pygal · anyplot.ai" in dark ink at top centre (~62% of width); bottom legend in dark ink (Reporting line, Executive, Vice presidents, Directors, Managers) with visible swatches. All text readable; node labels (30px monospace) are small and several are crossed by the grey edges leaving their node.
      Data: top-down tree, CEO (#009E73) at top, three VPs (#C475FD), seven Directors (#4467A3), eleven Managers (#BD8233) on four evenly spaced rows; straight muted-grey edges, each parent centred over its children.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend text and node labels in light ink, all readable; no dark-on-dark text. Edges flip to a lighter grey that stays subtle.
      Data: node colors identical to the light render (#009E73, #C475FD, #4467A3, #BD8233); same layout and same label/edge crossings.
      Legibility verdict: PASS
