review:
  strengths:
  - Readable in both themes with theme tokens threaded through title, labels and node
    outlines
  - Imprint colors in canonical order with brand green for directories
  - Tidy df with NODE/PARENT/LEVEL/KIND constants passed to sns.scatterplot(data=df,
    hue=KIND, palette=...)
  - Exact 3200x1800 canvas and centered root
  weaknesses:
  - 'SC-02 (both): the layout breaks the C2 property — children are spread evenly
    across each row instead of grouped under their parent, so components/ sends edges
    to button.py..form.py at the far left while models/ reaches user.py/data.py at
    the far right and docs/ reaches guide.md across the canvas; edges cross and are
    hard to trace (C3) → place each level-3 child under its parent (x = parent x ±
    sibling offsets) so subtrees sit beneath their parent. Likely cause: the per-level
    np.linspace spread ignores the parent column.'
  - 'SC-02, VQ-06 (both): axis spines and the axis titles ''Directory/File Distribution''
    / ''Directory Depth (Level)'' are drawn, though C2 asks for no axes and the x
    position carries no value → remove the left and bottom spines and both axis titles.
    Likely cause: ax.set_xlabel/set_ylabel and only top/right spines hidden.'
  - 'SC-04 (both): node color encodes directory vs file but no legend explains it
    → a two-entry legend (directory, file) at 8 pt. Likely cause: legend=False in
    sns.scatterplot.'
  - 'VQ-01 (both): level-2 labels at 7 pt and level-3 labels at 6.5 pt fall below
    the 8 pt reference → 8 pt (+1 to +1.5 pt). Likely cause: the depth-dependent fontsize
    ternary in ax.annotate.'
  - 'VQ-02 (both): ''models/'' and ''settings.yaml'' labels almost touch and long
    cross-edges pass through the level-2 label row → clear gap between neighbouring
    labels; follows from the parent-grouped layout. Likely cause: X_PER_NODE=1.5 with
    the evenly spread row.'
  - 'Suggestion: draw edges as elbow (orthogonal) connectors to read like a directory
    tree.'
