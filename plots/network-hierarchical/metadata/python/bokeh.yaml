review:
  strengths:
  - Edges drawn with Bokeh's vectorised segment glyph from one ColumnDataSource, nodes
    as one scatter renderer per level wired into an explicit Legend of LegendItems
  - Tree layout places every parent over the mean of its children, so siblings group
    under their parent and the tree is centered on the canvas
  - Both themes thread the tokens through title, labels, legend frame and edges; data
    colors identical between renders
  - HoverTool exposes role and level in the interactive HTML
  - Realistic 24-person org chart over four levels with varied branching
  weaknesses:
  - 'VQ-02 (both): the incoming edge of each node passes through that node''s label,
    which sits 42 px straight above it — e.g. ''PM 1'', ''BE Dev 1'', ''FE Dev 2'',
    ''Frontend Dir.'', ''Backend Dir.'', ''IT Support 1'' are struck through by a
    line → labels free of the edge strokes (an opaque PAGE_BG label background, or
    labels placed where no edge runs). Likely cause: LabelSet y_offset=42 with no
    background_fill_color, edges entering each node from above.'
  - 'VQ-01 (both): legend text at 24pt reads small against the style guide''s 34pt
    legend reference → 34pt (+10 pt). Likely cause: Legend label_text_font_size="24pt".'
  - 'VQ-07 (both): hierarchy levels 0-3 are ordered categories but take categorical
    Imprint positions 1-4 (green, lavender, blue, ochre), presenting depth as unrelated
    groups → four ordered steps of imprint_seq (#009E73 → #4467A3) in level order.
    Likely cause: nodes["color"] = IMPRINT_PALETTE[lvl].'
  - 'CQ-01 (code): lines 57-63 define the recursive helper function place() for the
    leaf-slot layout → compute the same x positions inline (leaves numbered in depth-first
    order, then parents as the mean of their children, iterating levels bottom-up),
    with no function. Likely cause: recursion chosen for the post-order traversal.'
  - 'CQ-01 (code): line 30 assigns `EDGE_COLUMNS` the value `["Parent", "Child"]`,
    not a column-name string → one string constant per required column role above
    the Data block, each with a trailing # role: <role> comment naming a spec role.
    Likely cause: the agent rewrites the constant''s string from its bindings.'
  - 'Suggestion: the 44pt title fills only about 43 % of the width; the style guide''s
    50pt default would still fit comfortably.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no frame; canvas 3200x1800.
