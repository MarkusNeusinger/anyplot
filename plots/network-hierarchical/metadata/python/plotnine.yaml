review:
  strengths:
  - Theme tokens threaded through title, labels, legend and edges; both renders theme-correct
  - Node size steps down with depth, making the root the focal point
  - 'Legend entries name the role of each level (Level 0: CEO … Level 3: Team)'
  weaknesses:
  - 'VQ-05 (both): the render is saved at 4800×2700, not a canonical canvas → 3200×1800
    (−1600 × −900). Likely cause: figure_size=(16, 9) with plot.save(dpi=300) instead
    of figure_size=(8, 4.5), dpi=400.'
  - 'VQ-02 (both): every label sits above its node, so the incoming edge crosses most
    leaf labels (FE Dev 2, BE Dev 2, PM 1, Designer, SysAdmin, DevOps, Recruiter,
    Payroll) and the labels above VP Product, Frontend Dir, HR Manager → labels clear
    of every edge, e.g. leaf labels below their nodes. Likely cause: one geom_text
    with va=''bottom'', nudge_y=0.025 for all nodes.'
  - 'VQ-01 (both): node labels at 9 pt on a 16 in figure (≈4.5 pt at the standard
    canvas) read small beside the 16 pt legend text → 8 pt at the standard 8 in canvas.
    Likely cause: geom_text(size=9) on the doubled figure.'
  - 'SC-04 (both): the title ''network-hierarchical · plotnine · anyplot.ai'' lacks
    the language segment → ''network-hierarchical · python · plotnine · anyplot.ai''.
    Likely cause: the labs(title=...) string.'
  - 'VQ-07 (both): hierarchy depth is an ordered category but is colored with four
    unrelated categorical hues → discrete steps of imprint_seq from root to leaves.
    Likely cause: scale_color_manual(values=level_colors).'
  - 'Suggestion: centring each parent over its children (a tidy-tree layout) would
    shorten the long diagonal edges.'
