review:
  strengths:
  - 'Clean top-down tree layout: every level on its own row, parents centered over
    their leaf span, siblings grouped (C1, C2)'
  - Straight, thin, semi-transparent INK_SOFT edges without arrowheads stay subordinate
    to the nodes and are traceable in both themes (C3)
  - 'Correct Imprint palette in canonical order, #009E73 for the root, theme tokens
    threaded through title, labels and legend'
  - Node size decreasing with depth makes the CEO the focal point
  - Tidy one-row-per-employee table with column constants, easy to swap for real data
  weaknesses:
  - 'VQ-02 (both): every incoming edge runs through the child''s label because the
    label sits directly above the node at label_y = y + 0.04 (visible on Mgr FE, Mgr
    QA, VP Sales, VP Ops, Dev 3, Dev 4, Rep 2, IT 1) → place the labels where no edge
    arrives, e.g. below the node (y − offset) or beside it, so no edge crosses text.
    Likely cause: geom_text at y + 0.04 on a top-down tree.'
  - 'CQ-01 (code): the layout is written as two recursive functions count_leaves and
    assign_layout → keep the layout but write it as an iterative pass in the Plot
    zone (e.g. leaves counted bottom-up over a reversed breadth-first order). Likely
    cause: recursive helper functions.'
  - 'Suggestion: a curved edge (geom_curve) or a short elbow connector would give
    the org chart a more refined look than straight diagonals.'
  - 'Suggestion: lets-plot tooltips (layer_tooltips) with name, level and manager
    would enrich the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no axes or grid.
