review:
  strengths:
  - Tidy tree layout puts the CEO at the top and each of the four levels on its own
    row, with every parent centered over its children and siblings grouped together
    (C1, C2)
  - Parent labels sit to the right of their nodes and leaf labels below, so no edge
    crosses any label in either render (C4)
  - Thin orthogonal elbow edges in INK_SOFT, without arrowheads, stay lighter than
    the 24 px nodes and are easy to trace from parent to child (C3)
  - Axes and grid are hidden, and theme tokens thread through the title, labels, edges
    and node outlines, so both renders read cleanly
  - Native plotly hovertext shows each node's label and level in the HTML output,
    and the figure is exported to both PNG and HTML
  weaknesses:
  - 'CQ-01 (code): the layout is computed by a recursive helper function `place(node,
    depth)` (lines 69–78), which breaks the Imports → Data → Plot → Save structure
    with no functions → compute depth and x in plain loops instead: walk the nodes
    in breadth-first order to assign levels, give leaves consecutive slots, then visit
    the nodes in reverse breadth-first order and set each parent to the mean x of
    its children. Likely cause: the tidy-tree recursion written as a function.'
  - 'Suggestion: a slightly wider gap between the lowest level and the bottom margin
    would balance the empty space above the CEO.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas; no axes, no grid.
      Chrome: the title "network-hierarchical · python · plotly · anyplot.ai" is centered at the top in dark INK and takes about 42% of the width. All node labels are dark text and readable.
      Data: an org chart of 20 nodes on 4 rows. The CEO (brand green #009E73) is at the top, the 3 VPs are purple #C475FD, the 7 directors blue #4467A3 and the 9 leads ochre #BD8233. Each node has a thin page-colored outline. Orthogonal elbow edges are drawn as thin #4A4A44 lines. Parent labels sit to the right of their nodes and leaf labels below them, so no label is crossed by an edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; no axes, no grid.
      Chrome: the title and all node labels are light #F0EFE8 text and clearly readable. There is no dark-on-dark text.
      Data: the node colors are identical to the light render (green, purple, blue, ochre). The edges flip to light grey #B8B7B0 and stay visible, and the brand-green CEO node reads well.
      Legibility verdict: PASS
