review:
  strengths:
  - 'Clean top-down tree: subtree-width layout centres every parent over its children,
    siblings grouped, one row per level, with the crowded 12-node bottom row evenly
    spaced'
  - Theme tokens threaded through title, subtitle, node labels, outlines and legend,
    so both renders read cleanly with identical Imprint data colors
  - Edges are thin (1.2 px) and translucent INK_SOFT lines that stay subordinate to
    the outlined nodes
  - Canonical 3200x1800 canvas reached by padding, never cropping, as the library
    prompt requires
  - Native Vega-Lite tooltips (label and role) add inspection in the HTML output
  weaknesses:
  - 'VQ-02 (both): the incoming parent edges run straight through many child labels
    (''UI'', ''SE'', ''API'', ''NW'', ''Supply'', ''Office'', ''Backend'', ''VP Sales'',
    ''VP Mkt'', ''Brand'') because each label sits on the edge''s approach path above
    its node → keep every label clear of the edges, e.g. place the label below the
    node or end the edge at the node''s top. Likely cause: mark_text dy=-17 puts each
    label directly above its node where the edge from the parent arrives.'
  - 'Suggestion: elbow (orthogonal) connectors from each parent would tidy the wide
    fan-out from the CEO and keep the label space above each node free.'
