      Data: CEO in #009E73 at the top, 4 VPs in violet #C475FD, 8 Directors in blue #4467A3, 12 Managers in ochre #BD8233, each with a dark outline; thin grey straight edges connect parents to children. Edges pass through several child labels (UI, SE, API, NW, Supply, Office).
