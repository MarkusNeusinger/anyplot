review:
  strengths:
  - 'Clean layered tree: root at top, each level on its own row, siblings grouped
    under their parent and every child below it, in both themes'
  - 'Labels placed inside large #009E73 nodes keep every label on its own node with
    no collisions across the 8-node bottom row'
  - Edges in theme-adaptive INK_SOFT at alpha 0.6 and 0.5 mm stay thinner and lighter
    than the nodes and remain traceable parent to child
  - Theme tokens threaded through title and background; data colour identical in both
    renders
  - Correct 3200x1800 canvas via ragg::agg_png at 8x4.5 in, 400 dpi
  weaknesses:
  - 'VQ-01 (both): node labels at geom_text size 2.2 mm (about 6 pt) are below the
    library prompt''s 2.5 mm annotation floor and read small beside the 12 pt title
    → 2.5-2.8 mm (+0.3 to +0.6 mm), with the node size raised to keep ''VP Engineering''
    inside its circle. Likely cause: geom_text(size = 2.2) with geom_point(size =
    17).'
  - 'Suggestion: give the root or each management level a distinct emphasis (size
    or a second Imprint hue) so depth reads at a glance.'
