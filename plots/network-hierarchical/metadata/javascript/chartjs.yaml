review:
  strengths:
  - Node radius scales down by hierarchy level (24/19/15/12), giving the tree an immediate
    visual sense of depth and rank without any extra text
  - 'Chart.js has no native network/tree chart type; the mixed line+scatter dataset
    technique (edges as zero-marker line datasets under `order: 2`, nodes as scatter
    datasets under `order: 1`) plus a custom `afterDatasetsDraw` plugin for role labels
    is a clean, idiomatic workaround within the library''s constraints'
  - Imprint categorical palette applied in canonical order across the four org levels
    (green/lavender/blue/ochre), identical between light and dark renders; only chrome
    flips correctly
  - Post-order layout algorithm (`assignPositions`/`collect`) centers parents over
    their children and gives leaves sequential slots, producing a well-balanced, non-overlapping
    tree even with asymmetric branching (VPs have 3/2/2 managers, managers have 1-3
    reports)
  - Edges rendered at low alpha (`hexToRgba(t.inkSoft, 0.35)`) so they recede behind
    the nodes and labels — subtle, polished detail
  - Title fontsize scales via the length-based formula, and the legend correctly filters
    out edge datasets so only the four level categories appear
  weaknesses:
  - 'Whitespace is imbalanced top-to-bottom: the gap between the title and the CEO
    node is noticeably larger than the margin below the legend — tightening the top
    padding or nudging the tree down slightly would improve canvas balance'
  - Tree depth is uniform (every leaf is exactly 3 levels below the CEO); a small
    amount of depth variation (e.g. one manager reporting directly, or a leaf with
    zero children shown as a dead-end) would demonstrate DQ-01 feature coverage more
    fully
  - Recursive layout (`assignPositions`, `collect`) and the `nodeLabelPlugin` object
    add real code structure beyond simple imports/data/plot — justified by the algorithm's
    needs, but keep an eye on KISS as the file evolves
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-hierarchical · javascript · chartjs · anyplot.ai" in bold dark ink, centered top, clearly readable. Bottom legend ("Executive", "VP", "Manager", "Individual Contributor") in dark text with matching colored circular swatches, clearly readable. Role-title labels below every node (e.g. "CEO", "VP Engineering", "Sr Engineer") are dark, bold, and legible against the light background.
      Data: A 4-level org chart tree — CEO (green #009E73) at the top, 3 VPs (lavender) on the second level, 7 Managers (blue) on the third level, 12 individual contributors (ochre) as leaves. Straight, thin, low-alpha ink-soft edges connect parent to child without arrowheads. First categorical series (Executive) confirmed as brand green #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light/white text against the dark background — fully readable, no dark-on-dark failures anywhere (title, node role labels, legend, and category labels all flip to light ink correctly).
      Data: Identical tree structure and identical node colors to the light render — green root, lavender VPs, blue managers, ochre ICs — confirming the Imprint categorical palette (positions 1-4) is unchanged between themes. Only the chrome (background, text, edge line color via inkSoft token) adapts to the dark theme.
      Legibility verdict: PASS — all text remains crisp and legible against the dark background; brand green is equally visible on both surfaces.
