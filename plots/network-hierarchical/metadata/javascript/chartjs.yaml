review:
  strengths:
  - Clean, faithful hierarchical tree layout with root at top and clear parent-child
    edges, exactly matching the spec's requested layout style
  - Level-based node size + color encoding (Executive green/largest through Individual
    Contributor ochre/smallest) creates an intuitive visual hierarchy that communicates
    organizational depth at a glance
  - 'Correct Imprint palette usage (canonical order, first series #009E73) and fully
    theme-correct chrome in both light and dark renders'
  - Minimal-chrome design (no axes/gridlines) appropriate for a network diagram, with
    generous whitespace and zero overlapping text
  - Deterministic in-memory data, mount-node contract followed correctly, animation
    disabled as required
  weaknesses:
  - Node role labels are set at 13px, noticeably smaller than the title (22px scaled)
    and legend (16px) — likely to become hard to read once the PNG is scaled down
    to the ~400px mobile srcset variant given the dense grid of 22 labels
  - Branching pattern is perfectly uniform (every VP has exactly 2 managers, every
    manager has exactly 2 ICs) — the spec calls out revealing 'branching patterns',
    and a real org chart typically has varied team sizes; introducing asymmetric branch
    sizes would better demonstrate this feature
  - Helper functions (assignPositions, collect) deviate from strict 'no functions/classes'
    KISS guidance — understandable given the recursive tree structure, but worth flagging
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "network-hierarchical · javascript · chartjs · anyplot.ai" in bold dark ink, centered top. Bottom legend with 4 swatches (Executive/VP/Manager/Individual Contributor) in dark text. All node-role labels (CEO, VP Engineering, Eng Mgr A, Sr Engineer, etc.) rendered in dark, bold, small text beneath each node.
      Data: 4-level tree, 22 nodes total. Root (CEO) is brand green (#009E73), VPs are lavender, Managers are blue, Individual Contributors are ochre — decreasing node radius from root to leaves. Edges are thin, semi-transparent gray lines connecting parent to child, drawn beneath the nodes.
      Legibility verdict: PASS — all text (title, legend, node labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title and legend, now rendered in light/off-white text, fully legible against the dark background. Node-role labels also switch to light text.
      Data: Identical node colors and layout to the light render — brand green root, lavender VPs, blue Managers, ochre ICs — confirming data colors are held constant across themes; only chrome (background, text) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, legend, and node-label text is clearly visible against the near-black surface.
