review:
  strengths:
  - 'Palette compliance is exact: root (CEO) uses brand green #009E73, and the three
    descendant levels follow the canonical Imprint order (lavender, blue, ochre) —
    data colors are pixel-identical between light and dark renders.'
  - 'Thoughtful readability detail: node labels are given a page-background patch
    (`t.pageBg`) so tree connector lines pass behind the text instead of through it,
    in both themes.'
  - 'Clear depth encoding: node size and connector line width shrink with depth (22→17→13→9
    px, line width 2.5→1.3), and the root label is bold and larger, producing an unambiguous
    visual hierarchy from CEO to individual contributors.'
  - 'Idiomatic, non-trivial use of ECharts'' `tree` series: `orient: ''LR''`, `edgeShape:
    ''polyline''`, `edgeForkPosition`, a separate `leaves` label config, and `emphasis.focus:
    ''descendant''` go well beyond a default tree configuration.'
  - 'Realistic, neutral synthetic data: a 28-person, 4-level org chart (CEO → VP →
    Director → IC) with diverse names and plausible titles, closely matching the specification''s
    own ''30 employees across 4 levels'' example.'
  - Both renders are fully readable — correct warm off-white/near-black backgrounds,
    no dark-on-dark or light-on-light text, no clipped elements at any edge, and canvas
    is exactly 3200×1800.
  weaknesses:
  - Title occupies only ~35% of canvas width at fontSize 22 on a 3200px-wide canvas
    — noticeably narrower than the 50-70% guideline band; a slightly larger title
    fontSize (e.g. 26-28) would balance better against the large canvas without risking
    overflow.
  - No legend or annotation states that node color/size encode organizational depth
    — it reads clearly from position and the CEO label alone, but an explicit 'level'
    cue (e.g. a small caption or level labels) would remove any ambiguity for a first-time
    viewer.
  - The recursive `styleByDepth` helper is a function, which technically departs from
    the pure imports→data→plot→save script shape — justified here since the data is
    a nested tree and per-depth styling needs traversal, but worth noting.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the whole canvas.
      Chrome: Title "network-hierarchical · javascript · echarts · anyplot.ai" is centered at top in bold dark ink, clearly legible. All 28 node labels (CEO, VPs, Directors, ICs) render in dark text on a matching page-background patch so tree connector lines pass behind the text, not through it — fully readable.
      Data: Root node "Alex Chen — CEO" is a large bold green (#009E73) circle at far left. Three VP nodes are lavender/purple, seven Director nodes are blue, seventeen leaf (IC) nodes are ochre/amber — an exact match to the canonical Imprint palette order (green → lavender → blue → ochre) applied by depth. Polyline connectors fan out left-to-right, shrinking in width with depth.
      Legibility verdict: PASS — no overlap, no clipping at any edge, all text readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the whole canvas.
      Chrome: Same title, now in light/white ink, centered and fully legible against the dark background. Node labels are light text on dark page-background patches, same layout as the light render.
      Data: Data colors are identical to the light render — brand green root, lavender VPs, blue Directors, ochre ICs — confirming only chrome (background/text) flipped, not data colors.
      Legibility verdict: PASS — no dark-on-dark text, no clipping, all labels and title clearly visible against the near-black surface.
