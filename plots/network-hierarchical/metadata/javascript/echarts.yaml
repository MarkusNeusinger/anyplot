review:
  strengths:
  - 'Color and size jointly encode organizational depth (CEO→VP→Director→IC) using
    the canonical Imprint order (#009E73, #C475FD, #4467A3, #BD8233), and a subtitle
    spells out the encoding instead of relying on a traditional legend'
  - Label backgroundColor matches the page background so connector lines pass behind
    text instead of through it — a deliberate anti-overlap technique across 28 nodes
  - Edge lineStyle color and width (2.5 - depth*0.4) are driven by each node's own
    depth, producing a subtle color/weight gradient from trunk to leaves
  - Realistic, neutral org-chart data with genuine branching variation (VPs have 2-3
    directors, directors have 2-3 reports) rather than uniform, repetitive groups
  - Idiomatic use of the echarts tree series (orient LR, edgeShape polyline, edgeForkPosition,
    initialTreeDepth -1, emphasis.focus descendant) with no arrows, matching the spec's
    layout guidance
  weaknesses:
  - styleByDepth() is a recursive helper rather than flat Imports→Data→Plot→Save structure;
    justified by the nested tree data but still a minor departure from the KISS/no-functions
    guideline
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-hierarchical · javascript · echarts · anyplot.ai" in bold dark text, centered near the top; subtitle "Node color and size encode organizational depth: CEO → VP → Director → IC" in a lighter gray directly below. Both are crisp and fully within the canvas.
      Data: A left-to-right tree (org chart) rooted at "Alex Chen — CEO" (large teal-green circle, #009E73), branching to 3 VP nodes (magenta/purple, #C475FD), then 7 Director nodes (navy blue, #4467A3), then 17 individual-contributor leaf nodes (ochre/amber, #BD8233). Node size shrinks with depth (22→17→13→9 px). Connector lines are right-angled polylines colored to match the depth of the node they originate from, and every node label sits on a small background patch that matches the page background so crossing lines never obscure the text.
      Legibility verdict: PASS — every title, subtitle, and node label is clearly readable against the light background; no overlapping text anywhere across the 28 nodes.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light/white and light-gray text respectively, fully legible against the dark surface. No dark-on-dark text anywhere.
      Data: Identical tree structure and identical node/edge colors to the light render — CEO node still #009E73 green, VP nodes still magenta, Director nodes still navy blue, IC nodes still ochre. Only the chrome (background, title/subtitle color, label background patches) adapts to the dark theme; the label background patches correctly flip to the dark page color so they still mask the connector lines behind the text.
      Legibility verdict: PASS — all text is clearly legible in the dark theme, the brand green root node reads well, and there is no dark-on-dark or light-on-light failure in either render.
