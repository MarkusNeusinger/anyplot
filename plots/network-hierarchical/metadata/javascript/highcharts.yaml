review:
  strengths:
  - 'Genuine engineering solution rather than a NOT_FEASIBLE cop-out: since core Highcharts
    has no networkgraph/treegraph module, the implementation hand-builds a tidy-tree
    layout (recursive centroid positioning) and draws parent-child connectors as SVG
    paths via chart.renderer + chart.events.render, pixel-mapped with toPixels().'
  - 'Redundant encoding of hierarchy level via BOTH color (Imprint palette positions
    1-4 in canonical order: green -> lavender -> blue -> ochre) AND marker shape (circle/diamond/square/triangle)
    - accessible design that doesn''t rely on hue alone.'
  - 'Theme-adaptive chrome is fully correct in both renders: title/ink/inkSoft tokens
    used throughout, page background matches spec exactly (#FAF8F1 light / #1A1A17
    dark), data colors identical between themes.'
  - Correct mandated title format, deterministic hard-coded data (no RNG), clean core-bundle-only
    API usage, no fake interactivity, proper output contract (animation disabled,
    no explicit width/height, credits disabled).
  - Staggered data-label y-offsets on the crowded Manager row prevent adjacent short
    names from colliding, and edge lines use a subtle low-opacity stroke that doesn't
    compete with the nodes.
  weaknesses:
  - 'Mobile legibility gap: at the 400px preview width (plot-light_400.png), the 13
    Manager-level labels and several Director labels blur into illegibility - the
    dense leaf row loses readability when scaled down, even though desktop legibility
    is excellent. Consider a larger data-label font for the leaf level, or trimming
    leaf-label length.'
  - Marker radius is identical (9px) at every hierarchy level. Scaling the radius
    down from root to leaves (e.g. 12 -> 10 -> 9 -> 8) would reinforce the depth encoding
    that color and shape already provide and add a touch more visual sophistication.
  - Branching pattern is fairly uniform - almost every VP has exactly 2 Directors
    and almost every Director has 1-2 Managers. The spec's Applications section calls
    out 'branching patterns' as something the layout should reveal; a bit more variation
    (e.g. one VP with 3 Directors, one Director with 4 Managers) would better showcase
    the plot type's ability to expose irregular structure.
  - Data storytelling is purely structural - the chart shows the org hierarchy clearly
    but adds no interpretive emphasis (e.g., highlighting the largest team or flagging
    a span-of-control outlier), so the viewer sees the tree but not a specific insight.
  - The recursive layout() helper plus three parallel data structures (nodesByLevel,
    edges, nodeById) go a bit beyond a strict Imports -> Data -> Plot linear script;
    justified here since Highcharts core has no built-in tree-layout algorithm, but
    worth being aware of for KISS scoring.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "network-hierarchical · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible. Node name labels (CEO, VP Engineering, Dir. Frontend, A. Kim, etc.) in soft dark gray beneath each node. Legend at the bottom ("CEO / VP / Director / Manager" with matching marker shapes) is fully legible and sits close to the plot, not isolated.
      Data: A 4-level org-chart tree - one green circle (CEO, #009E73) at the top, 4 lavender diamonds (VPs) on the second level, 8 blue squares (Directors) on the third level, 13 ochre triangles (Managers) as leaves. Straight gray connector lines link each parent to its children. First series is correctly the brand green.
      Legibility verdict: PASS at full resolution. All title, node labels, and legend text are clearly readable against the light background. At the 400px mobile thumbnail, however, the dense leaf-level Manager labels blur into illegibility - see weaknesses.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title and all node-name labels render in light ink/inkSoft tones, fully legible against the dark surface - no dark-on-dark failures observed. Legend text is light-colored and readable.
      Data: Identical tree structure and identical data colors to the light render (green circle root, lavender diamonds, blue squares, ochre triangles) - confirms the Imprint palette positions are unchanged between themes; only the background and text chrome flipped.
      Legibility verdict: PASS at full resolution, all chrome and data elements read clearly. Same mobile-scale leaf-label legibility caveat as the light render applies.
