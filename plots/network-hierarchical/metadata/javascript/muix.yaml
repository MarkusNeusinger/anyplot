review:
  strengths:
  - 'Uses the v9 composition API properly: ChartsContainer with hidden linear axes
    (position: "none") plus a child overlay that reads the useXScale/useYScale hooks,
    so the hand-drawn tree lives in MUI X''s coordinate system rather than raw pixels'
  - 'The tree layout is a real hierarchical layout: leaves are spaced in DFS order
    and each parent is centered over its children, so siblings group together, every
    level sits on its own row, and the CEO is at the top'
  - 'Depth is encoded twice: node radius steps down by level (22/16/12/9 px), and
    manager labels in ink at weight 500/600 sit above the leaf labels in INK_SOFT,
    which gives a clear typographic hierarchy'
  - Edges are thin (1.6 px) straight lines with no arrowheads, drawn in their branch
    color at 0.62 opacity, so they stay lighter than the nodes and remain traceable
    from parent to child in both themes
  - Manager labels sit on a translucent page-colored halo, so edges pass behind them
    cleanly; the crowded 18-leaf bottom row uses -36° rotated labels anchored at each
    node, so no two labels collide
  - 'Theme handling is correct: page background, ink and INK_SOFT come from ANYPLOT_TOKENS,
    the four branches follow the Imprint order (#009E73, #C475FD, #4467A3, #BD8233)
    identically in both renders, and skipAnimation is set'
  weaknesses:
  - 'Suggestion: a horizontal (root-left) orientation would give the 18 leaf labels
    room to sit level, without the -36° rotation that makes them slower to read.'
  - 'Suggestion: the branch legend repeats the VP labels already drawn on the tree,
    so dropping it would free the top band for the tree itself.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas; no axes and no grid, as a tree layout should have.
      Chrome: the bold near-black title "network-hierarchical · javascript · muix · anyplot.ai" sits top-left and spans about 40% of the width. Below it, an HTML legend row of four colored dots labels VP Engineering, VP Sales, VP Marketing and VP Operations in INK_SOFT. All text is dark on light and readable.
      Data: a 4-level org chart of 30 nodes. The CEO root is a large ink-colored circle at top center with a bold label. Four VP nodes sit on row 2 in green #009E73, lavender #C475FD, blue #4467A3 and ochre #BD8233. Eight director nodes are on row 3, labeled above on page-colored halos. Eighteen leaf nodes are on row 4, labeled below at -36°. Node radius steps down by level. Edges are thin straight lines in the child's branch color at reduced opacity, with no arrowheads. No labels collide, and nothing is clipped at any edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title is near-white, legend labels and leaf labels are light grey (INK_SOFT), and manager labels are near-white (ink). No dark-on-dark text anywhere.
      Data: the four branch colors are identical to the light render. Only the root node flips (ink to near-white), as the theme-adaptive neutral it is. Edges are dimmer at 0.62 opacity on the dark surface but stay clearly traceable. Layout and labels match the light render exactly.
      Legibility verdict: PASS
