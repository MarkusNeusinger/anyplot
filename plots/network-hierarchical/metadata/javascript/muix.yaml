review:
  strengths:
  - Correct tidy-tree layout algorithm (leaves get sequential x, parents average children)
    exactly matching the spec's hierarchical model, with root positioned at top
  - 'Effective visual hierarchy: node size decreases with depth, edges colored by
    branch at low opacity - ties color identity to structure without chartjunk'
  - 'Idiomatic, sophisticated MUI X usage: composes ChartContainer with useXScale/useYScale
    to draw fully custom SVG marks, the officially sanctioned pattern for chart types
    the community package doesn''t natively support'
  - 'Correct Imprint palette usage across both themes: first series is #009E73, canonical
    order for the remaining 3 departments, theme-adaptive neutral anchor for the CEO
    root'
  - Edges are plain lines without arrows, exactly as the spec recommends
  - Fully deterministic, self-contained data generation; skipAnimation set; title
    format exactly matches spec
  weaknesses:
  - Data-branching pattern is largely uniform (7 of 8 directors have exactly 2 reports;
    only Platform Eng has 3) - doesn't fully showcase the branching-pattern variety
    the spec calls out as a value of hierarchical layouts
  - Leaf-level labels are omitted entirely; while this avoids clutter at 30 nodes,
    ~17 of 30 node labels are never shown on screen
  - Design is solid but not yet publication-level - consider curved/bundled edges
    (per the spec's edge-bundling suggestion) or a callout highlighting the one asymmetric
    branch for a stronger focal point
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title top-left ("network-hierarchical · javascript · muix · anyplot.ai") in dark ink, clearly readable; 4-item legend (colored dot + department name) below title, dark/soft-ink text, clearly readable; node labels for CEO/VP/Director levels in dark ink, all legible with no overlap.
      Data: A tidy-tree hierarchy - large black/ink CEO node at top, 4 VP nodes (green/Engineering, lavender/Sales, blue/Marketing, ochre/Operations - matching Imprint canonical order with #009E73 first), 8 Director nodes, 17 unlabeled leaf nodes at the bottom. Edges are thin, low-opacity lines colored by the child's department, no arrowheads.
      Legibility verdict: PASS - all title, legend, and node-label text is clearly readable against the light background; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title, legend, and node labels all render in light/cream ink, clearly legible against the dark background. The CEO node itself flips from black (light theme) to near-white/cream (dark theme) via the theme-adaptive neutral anchor.
      Data: Department colors on VP/Director/leaf nodes and their edges are visually identical to the light render (green, lavender, blue, ochre) - only the chrome (background, text, CEO root fill) flipped as expected.
      Legibility verdict: PASS - no dark-on-dark failures; all text is light-colored and legible; brand green remains vivid and identifiable.
