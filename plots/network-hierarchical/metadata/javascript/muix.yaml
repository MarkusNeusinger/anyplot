review:
  strengths:
  - Composes the tree on MUI X's own ChartsContainer with hidden linear axes and draws
    nodes and edges through the useXScale/useYScale hooks, so the custom marks live
    in the chart's coordinate system instead of a hand-built SVG.
  - A tidy tree layout (leaves spaced by DFS order, parents centered over their children)
    puts each of the four levels on its own row with the CEO at the top; siblings
    stay grouped and no labels collide at the crowded 18-leaf bottom row.
  - 'Clear visual hierarchy: node radius shrinks per level (22/16/12/9 px), the root
    label is bold, manager labels use ink on a page-colored halo while leaf labels
    are rotated in inkSoft.'
  - 'Branch coloring follows the Imprint palette in canonical order (#009E73, #C475FD,
    #4467A3, #BD8233) with a neutral ink root; data colors are identical in both themes
    and the chrome flips correctly.'
  - Edges are thin, arrowless, translucent lines in the child's branch color, lighter
    than the nodes as the spec asks.
  - Realistic, neutral 30-person organizational chart across 4 levels, exactly the
    spec's example; skipAnimation is set.
  weaknesses:
  - 'VQ-03 (dark): edges drawn at strokeOpacity 0.38 fall to very low contrast on
    #1A1A17, most of all the VP Marketing branch (#4467A3 at 38 % reads as a dim slate
    line) — they are traceable only on close inspection and fade in the 400 px thumbnail
    → raise edge opacity to about 0.55–0.65 (+0.2) so every parent-child line stays
    clearly traceable in both themes. Likely cause: strokeOpacity={0.38} on the edge
    <line>.'
  - 'VQ-05 (both): the tree leaves large empty bands — about 11 % of the canvas height
    below the rotated leaf labels and a gap of about 10 % between the legend and the
    CEO label — while the tree itself sits slightly right of center (≈45 px left margin
    vs ≈155 px right of the last leaf) → reduce the vertical padding so the tree fills
    the canvas (about −0.15 on the bottom share, −0.1 on the top) and balance the
    horizontal padding. Likely cause: Y_BOTTOM_PAD_SHARE = 0.34 and Y_TOP_PAD_SHARE
    = 0.22 plus a symmetric X_PAD_SHARE that ignores the left-leaning rotated leaf
    labels.'
  - 'Suggestion: the branch legend repeats the four VP labels already printed on the
    tree; a smaller or dropped legend would leave more room for the tree.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "network-hierarchical · javascript · muix · anyplot.ai" at top left (~41 % width); a one-line HTML legend below it with four colored dots (VP Engineering, VP Sales, VP Marketing, VP Operations) in inkSoft text. No axes or grid. All text readable: dark ink on cream.
      Data: four-level top-down org tree. Black CEO node (bold "CEO" label) at the top center; four VP nodes on row 2 in #009E73, #C475FD, #4467A3, #BD8233; eight director nodes on row 3 with labels on page-colored halos; 18 leaf nodes on row 4 with labels rotated about -36°. Nodes shrink per level. Edges are thin, arrowless, translucent lines in the child's branch color. No label overlaps; siblings grouped. Empty band below the leaf labels and between legend and root.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, legend labels in light inkSoft, manager labels light, leaf labels light grey — no dark-on-dark text anywhere. The root node flips to light ink (neutral token).
      Data: branch colors identical to the light render (#009E73, #C475FD, #4467A3, #BD8233). Edges at 38 % opacity are noticeably dim on the dark page, especially the blue Marketing branch, but still traceable at full size.
      Legibility verdict: PASS
