review:
  strengths:
  - Correct plot type and full spec compliance — d3-hierarchy tree layout with root
    positioned at the left (horizontal orientation per spec notes), curved parent-child
    links without arrows, and depth-based node sizing
  - 'Full Imprint palette compliance — root uses #009E73, depths 1-3 use canonical
    palette positions 2-4, correct theme-adaptive backgrounds and chrome in both light
    and dark renders'
  - Thoughtful refinement details — page-background-colored node strokes create a
    clean cutout separation from overlapping links, generous whitespace, and a clear
    'Depth level' legend
  - Clean, idiomatic KISS code using d3.hierarchy/d3.tree/linkHorizontal with proper
    .join() data binding, deterministic hard-coded data, and correct mount-node/theme-token
    usage
  weaknesses:
  - Dense text labels (28 nodes, 14 leaf files) at tight ~32-65px vertical spacing
    risk becoming illegible when the PNG is scaled to ~400px mobile width — consider
    larger fontsize increments per depth, fewer leaf labels, or more vertical spacing
    so the diagram holds up at mobile scale
  - All leaf nodes sit at the exact same depth (3) — a real repository tree usually
    has files at varying depths (e.g. a README.md directly at the root or in a top-level
    dir); varying leaf depth would better showcase the 'organizational depth' the
    spec calls out as this plot type's core value
  - Library usage, while idiomatic, follows a fairly standard/well-known d3 tree-diagram
    pattern rather than showcasing something more distinctive to d3-hierarchy — e.g.
    a radial tree or d3.cluster variant would differentiate the layout more
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "network-hierarchical · javascript · d3 · anyplot.ai" is bold dark text, clearly visible and centered at top. Directory/file labels are dark ink (theme-adaptive inkSoft), fully readable against the light surface. The "Depth level" legend (top-right) uses dark text for its heading and labels, all legible. Grid/link lines are a subtle light-gray, visible but not competing with data.
      Data: A file-tree hierarchy radiates left-to-right from a green "project/" root node. Depth-1 top-level directories (src/, tests/, docs/, config/) are lavender/purple, depth-2 subdirectories are blue, depth-3 file leaves are ochre/orange — matching Imprint palette positions 1-4 exactly. Node radius shrinks with depth (root largest, files smallest).
      Legibility verdict: PASS — all text is readable against the light background; no dark-on-light or light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and node labels render in light ink (theme-adaptive), clearly visible against the dark surface. No dark-on-dark failures — every label, including the smallest file names, remains legible. Legend heading/labels are light-colored and readable. Link strokes are a low-opacity light gray, subtle but visible.
      Data: Identical hierarchy and identical data colors to the light render — root green #009E73, depth-1 lavender, depth-2 blue, depth-3 ochre — confirming only chrome (background, text, links) flipped between themes, not the categorical data colors.
      Legibility verdict: PASS — all text is readable against the dark background; brand green and the other depth colors remain clearly visible on the near-black surface.
