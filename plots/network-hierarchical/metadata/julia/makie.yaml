review:
  strengths:
  - 'Direct fix of the prior attempt''s top-heavy composition: LEVEL_SPACING 1.3→1.6
    and BOX_W 0.82→0.87 lift canvas usage to ~93% vertical / ~88% horizontal with
    margins on every side instead of a quarter-canvas dead zone below the leaf row.'
  - New STROKE_WIDTHS tapering (3.2→2.0 from CEO to Manager/IC) adds a second visual-hierarchy
    channel layered on top of the level color coding, giving the org chart a genuine
    seniority cue beyond the root's green accent alone.
  - Edge alpha and width now scale down with sibling count (0.6→0.35 alpha, 1.8→1.1
    width), visibly reducing clutter at high fan-out parents (VP Engineering's 3 directors,
    VP Operations' 3 directors) versus the previous uniform-weight edges.
  - 'Theme-adaptive chrome remains fully correct: level border colors (data channel)
    are pixel-identical between light and dark, only background/text/edge chrome flips
    (#FAF8F1 light / #1A1A17 dark confirmed).'
  - Data is a plausible, neutral 24-node/4-level org chart with varied branching factors
    (1-3 children per parent) that clearly shows organizational depth, within the
    spec's 10-50 node guidance.
  weaknesses:
  - Canvas fill is now very tight (~93% vertical / ~88% horizontal content bounds)
    — slightly past the 50-80% 'perfect' band; the left margin (~7.7% of width) is
    noticeably wider than the right/top/bottom margins (~2-5%), giving a faint left-heavy
    imbalance. A touch more xlims/ylims padding, or rebalancing colsize! for the legend
    column, would let the composition breathe without reintroducing the earlier whitespace
    problem.
  - 'Library Mastery is still generic: the diagram is fundamentally poly!(Rect2f)
    + lines! + text!, a pattern easily replicated in any plotting library. No Makie-distinctive
    technique lifts it beyond correct-but-ordinary usage (GraphMakie/NetworkLayout
    are unavailable in this runtime, so this is a soft note, not a requirement).'
  - Longest node labels ('Finance Analyst', 'Dir. Enterprise') now fit with real padding
    after the BOX_W widening, but the fixed box width has no slack for future longer
    labels — worth keeping in mind for later edits, not a defect today.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured background pixel [250,248,241] matches #FAF8F1 exactly (not pure white, not dark).
      Chrome: Title "network-hierarchical · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center with ample margin above and below. No axis ticks/gridlines (intentionally hidden via hidedecorations!/hidespines! — correct for a network diagram). "Level" legend sits at the right edge with dark, readable labels for CEO/VP/Director/Manager-IC, framevisible=false.
      Data: 24 boxes across 4 levels, cream fill (#FFFDF6-family ELEVATED_BG) with colored strokes tapering in width from CEO (thickest, brand green #009E73) down to Manager/IC (thinnest, ochre) — VPs lavender, Directors blue, all in canonical Imprint order. Parent-child edges are soft gray lines whose alpha/width shrink at high fan-out parents, visibly reducing clutter at VP Engineering/VP Operations. Node labels (e.g. "Finance Analyst", "Dir. Enterprise") sit centered with real padding inside their boxes, fully visible, no clipping.
      Legibility verdict: PASS — every title, node label, and legend entry is dark-on-light and clearly legible; no overlap between any two text elements, edges, or boxes.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 (not pure black, not light).
      Chrome: Title renders in light ink, clearly visible against the dark background. Legend text is light-colored and readable. No axis chrome present (by design, consistent with the light render).
      Data: Same 24 boxes and identical level-to-color mapping as the light render (green/lavender/blue/ochre strokes with the same tapering stroke widths) — confirms the data channel is theme-invariant. Box fills switch to the dark elevated surface, node text switches to light ink, edges remain soft gray at the same fan-out-scaled alpha/width.
      Legibility verdict: PASS — no dark-on-dark failures; all node labels, title, and legend text are clearly legible light-on-dark, matching the light render's layout exactly (only chrome flipped).
