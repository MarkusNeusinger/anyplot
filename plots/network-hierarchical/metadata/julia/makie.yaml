review:
  strengths:
  - 'Correct hierarchical tree layout: root at top, bottom-up mean-of-children x-positioning
    produces a clean, non-overlapping org chart'
  - Level-coded node borders map 1:1 to the Imprint categorical palette in canonical
    order (green/lavender/blue/ochre) with a clear 'Level' legend
  - 'Theme-adaptive chrome is fully correct: title, node fill, node/edge text, and
    edge lines all pull from theme tokens, while the level border colors (data channel)
    stay identical between light and dark'
  - hidedecorations!/hidespines! is the right call for a network diagram — no stray
    unstyled axis clutter
  - Data is a plausible, neutral, appropriately-scaled 24-node/4-level org chart matching
    the spec's data model and 10-50 node guidance
  weaknesses:
  - Significant unused whitespace below the leaf row (roughly a quarter of the canvas
    height is empty) makes the chart top-heavy — increase LEVEL_SPACING or reduce
    the top margin/title gap to balance vertical canvas usage
  - Longest node labels ('VP Operations', 'Dir. Enterprise', 'Finance Analyst') nearly
    fill their box width with little padding — widen BOX_W slightly or trim fontsize
    a point for breathing room
  - Beyond the root's brand-green accent there is no additional visual hierarchy cue
    (size/weight variation) to distinguish importance within a tier — design reads
    as a standard boxes-and-lines org chart
  - Edges converging into VP/CEO nodes are uniform gray/alpha and get visually dense
    where many children fan out (e.g. VP Operations' 3 directors, VP Engineering's
    3) — a touch more transparency or thinner linewidth at high-fan-out nodes would
    reduce clutter
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1 as required) — not pure white, not dark.
      Chrome: Title "network-hierarchical · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. No axis ticks/gridlines (intentionally hidden via hidedecorations!/hidespines! — correct for a network diagram). Legend "Level" box (CEO/VP/Director/Manager-IC) sits at the right with dark, readable labels.
      Data: 24 boxes across 4 levels, each with an off-white/cream fill (ELEVATED_BG #FFFDF6) and a colored stroke — root CEO is brand green #009E73, VPs lavender, Directors blue, Managers/ICs ochre — matching Imprint canonical order. Parent-child edges are soft gray lines (INK_SOFT at alpha 0.55). Node labels are dark, centered, fully inside their boxes.
      Legibility verdict: PASS — every title, node label, and legend entry is dark-on-light and clearly legible; no overlap between any two text elements or between text and edges.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17 as required) — not pure black, not light.
      Chrome: Title renders in light ink, clearly visible against the dark background. Legend box text is light-colored and readable. No axis chrome present (by design).
      Data: Same 24 boxes and same level-to-color mapping as the light render (green/lavender/blue/ochre strokes) — confirms the data channel is theme-invariant. Box fills switch to the dark elevated surface (#242420) and node text switches to light ink (#F0EFE8), edges remain soft gray at the same alpha.
      Legibility verdict: PASS — no dark-on-dark failures observed; all node labels, title, and legend text are clearly legible light-on-dark.
