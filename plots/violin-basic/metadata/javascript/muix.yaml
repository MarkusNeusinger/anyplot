review:
  strengths:
  - Custom violin layer composed inside ChartsContainer and positioned through the
    chart's own band/linear scales via useXScale/useYScale, so axes, grid and marks
    share one coordinate system — the idiomatic MUI X answer to a chart type the community
    package lacks
  - Four deliberately different distribution shapes (unimodal, narrow, bimodal, left-skewed)
    make the density carry what a box plot would hide; Group C's bimodality and Group
    D's long lower tail read at a glance
  - Inner box is drawn in the ink token with the median in the page color, so the
    quartile box and median line invert cleanly between themes and stay legible on
    every violin fill
  - KDE outline closes to a point 1.5 bandwidths past the data, so each violin tapers
    just beyond its data range instead of being cut flat or trailing far away
  - Shared y axis derived from the KDE grid extent (about 48–100), not forced to zero,
    with Imprint colors identical across both renders
  - Data block, role constants and plot code follow the adaptable-code zones; categories
    come from the records via new Set and limits from the data
  weaknesses:
  - 'DQ-02 (both): the categories are labelled "Group A" … "Group D", which read as
    generic placeholders for an exam-score scenario → concrete class names such as
    "Class 10A", "Evening course", "Honors section", "Remedial track". Likely cause:
    the labels in groupShapes.'
  - 'Suggestion: the mandated title at 22 px fills only about 27 % of the width; a
    slightly larger title (about 26–28 px) would anchor the top band better.'
  - 'Suggestion: the x-axis band (height 76) leaves a wide gap between the group tick
    labels and the "Class group" title; a band of about 56 would tighten the bottom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: title "violin-basic · javascript · muix · anyplot.ai" top-left in dark ink; y-axis "Exam score (%)" with ticks 50–100 every 5; x-axis "Class group" with ticks Group A–D; left and bottom axis lines only; very faint horizontal grid. All text readable.
      Data: four mirrored violins in Imprint order — Group A brand green #009E73 (unimodal, ~74), Group B lavender #C475FD (narrow, ~88), Group C blue #4467A3 (bimodal, modes ~63 and ~81), Group D ochre #BD8233 (left-skewed, peak ~89, long tail to ~56), each at 0.5 fill opacity with a solid outline. Inside each: a thin ink whisker line, a near-black quartile box (Q1–Q3) and a white median line. Tails taper to a point just past the data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink; axis lines light; grid very faint. No dark-on-dark text.
      Data: same four Imprint hues and shapes as the light render (fills appear deeper because the 0.5 opacity blends with the dark page); the quartile boxes flip to off-white with a dark median line, and the whiskers flip to light ink, all clearly visible against the fills.
      Legibility verdict: PASS
