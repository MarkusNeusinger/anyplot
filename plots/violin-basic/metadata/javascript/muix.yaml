review:
  strengths:
  - Correctly builds a mirrored-KDE violin + inner quartile box from scratch via the
    documented useXScale/useYScale composition hooks, since community @mui/x-charts
    has no native violin/box component
  - 'All spec notes satisfied: mirrored density on both sides, quartile box visible
    inside the violin, and a contrasting median line'
  - Four distinct distribution shapes (unimodal, narrow high-peak, bimodal, right-skewed)
    genuinely demonstrate why a violin plot reveals more than a box plot alone
  - Imprint palette used in canonical order (green, lavender, blue, ochre) and identical
    across light/dark renders; only chrome flips
  - Median line and box fill correctly swap between t.ink/t.pageBg per theme so contrast
    is preserved in both renders
  - Deterministic LCG-seeded data generation, clean single-purpose imports, correct
    harness contract (default export, skipAnimation, sized to window.ANYPLOT_SIZE)
  weaknesses:
  - Grid line opacity (0.55) exceeds the style guide's recommended 15-25% subtle range
    — dashed horizontal gridlines read slightly stronger than ideal against the data
  - 'Design excellence is functional rather than highly polished: flat single-opacity
    fills and no additional emphasis/callout on the most novel shape (Class Group
    C''s bimodal distribution) that could sharpen the storytelling'
  - Several small helper functions (lcg, randomNormal, clamp, quantile, boxStats,
    kde) are necessary given the from-scratch violin construction, but push past a
    minimal KISS structure
  - No redundant encoding (e.g. distinct stroke) beyond the palette hue on the non-first
    categorical fills, though with only 4 series this is a minor, optional nicety
    per the style guide's series-count guidance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "violin-basic · javascript · muix · anyplot.ai" in dark ink, top-left. Y-axis label "Exam Score (%)" rotated at left, tick labels on both axes in dark/soft-dark ink, four x-axis category labels ("Class Group A/B/C/D") centered under each violin. Subtle dashed horizontal gridlines. All chrome clearly legible against the light background.
      Data: Four mirrored violins in Imprint order — green (Class Group A, unimodal), lavender (Class Group B, narrow high peak), blue (Class Group C, visibly bimodal with two lobes), ochre (Class Group D, right-skewed with a long lower tail). Each violin has a solid black quartile box with a white median line, and a thin black whisker line running through the box.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (near-white), fully readable against the dark background. Gridlines are the same subtle dashed style, appropriately dimmed for the dark surface. No dark-on-dark text anywhere.
      Data: Identical violin hues (green/lavender/blue/ochre) and identical shapes to the light render — confirming the data colors are theme-invariant. The quartile boxes now render as light/cream fills with a dark median line and dark whisker line, correctly swapped for contrast against the light violin fills on the dark page.
      Legibility verdict: PASS
