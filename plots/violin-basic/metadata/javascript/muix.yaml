review:
  strengths:
  - Quartile box drawn in the ink token with a page-colored median line, so it inverts
    cleanly between themes and stays visible against every violin fill
  - Data shapes (unimodal, narrow, bimodal, right-skewed) show exactly what a violin
    reveals that a box plot hides
  - Uses MUI X's composition API — ChartsContainer with ChartsGrid/axes and a custom
    SVG layer positioned through useXScale/useYScale — to build a chart type the community
    package does not ship
  - Imprint palette in canonical order with translucent fills and solid outlines;
    identical data colors in both themes
  - Shared value axis not forced to zero, so the four distributions compare directly
  weaknesses:
  - 'SC-03 (both): the density tails of Groups B, C and D extend to about 101-103
    % on an exam score that cannot exceed 100, and are cut flat where the KDE grid
    hits the padded axis limits (flat tops on B/C/D, Group C''s bottom sliced off
    at the x-axis floor near 46 %) → end each violin within the data''s range or taper
    it to a point inside the axis, without a flat cut. Likely cause: kde() grid lo/hi
    = data min/max ± one bandwidth clamped to Y_MIN/Y_MAX (lines 114-115) while Y_MIN/Y_MAX
    pad the data only 8 %.'
  - 'CQ-01 (code): six helper functions (clamp, randomNormal, quantile, boxStats,
    stdOf, kde) and no adaptable-code zones — no `// Columns` role constants, no `//
    Data` block ending in a `const data` record array, the axis label typed as a literal
    → one Data block producing `const data` keyed by CLASS_GROUP / SCORE constants,
    with stats computed inline below a `// Plot` marker. Likely cause: generator not
    following the library prompt''s Data block section.'
  - 'Suggestion: a slightly larger title (about 26 px) would balance the generous
    whitespace in the top band.'
