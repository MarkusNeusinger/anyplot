review:
  strengths:
  - Custom composition (ChartContainer + useXScale/useYScale) correctly reproduces
    a violin+box chart type MUI X community has no native component for, following
    the library's documented composition pattern
  - 'Imprint palette used in canonical order (#009E73, #C475FD, #4467A3, #BD8233),
    first series is brand green, data colors identical between light and dark renders'
  - 'Genuine data storytelling: four categories are deliberately shaped differently
    (unimodal, tight peak, bimodal, right-skewed) so the KDE shape — not just quartiles
    — carries information a plain box plot would hide, with an explicit ''bimodal''
    annotation calling out the distinctive group'
  - Deterministic data generation via a fixed-seed LCG (browser has no seeded RNG),
    clean imports, no fake interactivity
  - Canvas exactly 3200x1800, mandated title format correct, quartile box + median
    line + whiskers all present per spec's 'Notes' requirements
  weaknesses:
  - 'Each violin''s KDE is evaluated over the pooled global Y range (Y_MIN..Y_MAX
    from ALL categories combined) rather than clipped to that category''s own plausible
    range. Where density is near-zero but not exactly zero, the SVG path''s stroke
    still traces a thin, persistent, visible line down to the axis floor -- most obvious
    on Class Group B (tight cluster ~78-100) which shows a faint purple hairline continuing
    all the way to the bottom axis in both renders, and to a lesser extent on Groups
    A and D. Fix: truncate/clip the per-category grid to where density exceeds a small
    threshold (e.g. ~1-2% of that category''s peak) before building the path, so the
    stroke doesn''t draw a near-invisible-but-still-rendered tail across the full
    canvas height.'
  - The 'bimodal' annotation text is set at fontSize 13, slightly below the 14px tick-label
    baseline used elsewhere in the chart -- bump to ~14-15px for consistency and to
    stay legible at smaller thumbnail scales.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "violin-basic · javascript · muix · anyplot.ai" top-left in dark ink, clearly legible. Y-axis label "Exam Score (%)" and tick labels (50-100) in dark ink, fully readable. X-axis category labels (Class Group A-D) legible below each violin. Subtle horizontal gridlines at low opacity, visible but not dominant.
      Data: Four mirrored-KDE violins, one per category, filled at ~50% opacity with a matching solid stroke outline: Class Group A green (#009E73), Class Group B lavender (#C475FD), Class Group C blue (#4467A3, annotated "bimodal" in italic gray text above it), Class Group D ochre (#BD8233) -- exactly the Imprint canonical categorical order with brand green first. Each violin carries a black quartile box (Q1-Q3), a black whisker line, and a white median line inside it. Group B (and to a lesser extent A and D) shows a thin, near-invisible-width tail trailing down to the bottom axis -- a KDE-grid artifact (see weaknesses).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Title, axis labels, and tick labels all rendered in light ink, clearly legible against the dark background -- no dark-on-dark issues found. Gridlines subtle but visible.
      Data: Same four violin colors as the light render (green/lavender/blue/ochre), confirming data colors are identical across themes; only chrome (background, text, grid) flips. Quartile box and median line invert to a cream fill/white line against the dark ink whisker, correctly using theme ink tokens rather than being hardcoded. Same trailing-tail artifact visible on Group B as in the light render.
      Legibility verdict: PASS
