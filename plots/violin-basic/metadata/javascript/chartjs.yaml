review:
  strengths:
  - Hand-rolled Gaussian KDE (Silverman bandwidth) mirrored into left/right fill datasets
    correctly builds a true violin silhouette using Chart.js's line/fill trick, since
    Chart.js has no native violin chart type.
  - The four class groups show genuinely distinct distribution shapes (roughly normal,
    bimodal, right-skewed, and tight/narrow) which satisfies the spec's 'distinct
    distribution shapes' requirement rather than four look-alike groups.
  - Deterministic seeded LCG (seed=42) makes the data fully reproducible with no external
    RNG dependency in the browser.
  - 'Theme-adaptive chrome is threaded correctly: median/quartile marker colors use
    t.ink / t.inkSoft tokens and flip properly between light and dark renders; Imprint
    palette order (green / lavender / blue / ochre) is followed exactly with the brand
    green first.'
  - The 'Solid line = median · Dashed lines = Q1/Q3' subtitle substitutes cleanly
    for a legend, avoiding a redundant color-swatch legend since categories are already
    labeled on the x-axis.
  - Clean grid usage (y-axis only, subtle rgba grid) and no extraneous chart chrome.
  weaknesses:
  - Class C's KDE tail rises visibly above the 100% domain cap (peaking around ~103
    on the y-axis) even though test scores are physically bounded at 100 — the eval
    grid (quantile(sorted, 0.99) + pad) is not clamped to the real-world max. Clip
    yMax (and yMin) to the domain bounds, e.g. Math.min(yMax, 100), so the violin
    never implies impossible scores.
  - Q1/Q3 dashed marker spans become quite short/thin in the narrow 'waist' regions
    of some violins (e.g. Class C's Q3 marker sits right at the density neck) — consider
    a slightly larger minimum span or a touch more dash weight so they stay legible
    at a scaled-down mobile width.
  - The mirrored-line-fill construction is a workaround that's replicable in most
    charting libraries with an area/fill primitive, not something distinctly Chart.js-only
    — solid execution, but leans generic for Library Mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top, italic subtitle "Solid line = median · Dashed lines = Q1 / Q3" beneath it in a softer gray. X-axis title "Class Group" and y-axis title "Test Score (%)" in dark ink; tick labels ("Class A"-"Class D", 50-105) in a lighter secondary gray. Subtle horizontal gridlines only.
      Data: Four mirrored violin silhouettes, one per class group, outlined and fill-tinted in Imprint palette order — Class A green (#009E73), Class B lavender (#C475FD), Class C blue (#4467A3), Class D ochre (#BD8233). Each violin carries a solid black median line and two dashed black Q1/Q3 lines. Shapes are clearly differentiated: Class A roughly symmetric/normal, Class B visibly bimodal (double bulge), Class C right-skewed with a tall narrow peak reaching toward the top of the axis, Class D narrow/tight and shifted high.
      Legibility verdict: PASS — all text (title, subtitle, axis titles, tick labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-title/tick-label layout, now rendered in off-white and light-gray tones (theme-flipped). Median/quartile marker lines flip from black to white/light-gray, remaining clearly visible against the dark violin fills. Gridlines are faint light lines instead of dark ones.
      Data: Data colors are pixel-identical to the light render — same green/lavender/blue/ochre violins in the same order and shapes; only the chrome (background, text, grid, median/quartile marker strokes) flipped.
      Legibility verdict: PASS — all text and marker lines are clearly visible against the near-black background; no dark-on-dark failures observed.
