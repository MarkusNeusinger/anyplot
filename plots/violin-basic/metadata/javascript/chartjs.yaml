review:
  strengths:
  - Four class groups show genuinely distinct, statistically accurate distribution
    shapes (symmetric normal, bimodal mixture, right-skewed exponential, tight narrow
    normal) — an excellent demonstration of what a violin plot reveals beyond a boxplot
  - Quartile markers (dashed Q1/Q3, solid median) are correctly ordered (Q1 < median
    < Q3) for every group and are scaled to sit inside the violin body per the spec's
    explicit request
  - Imprint palette applied in canonical order (green/lavender/blue/ochre) and is
    pixel-identical between light and dark renders; theme-adaptive ink/inkSoft/grid
    tokens correctly threaded to quartile lines, axis text, and gridlines with no
    dark-on-dark or light-on-light failures
  - Mandated title format is exact; axis labels are descriptive with units ("Test
    Score (%)")
  - Deterministic seeded LCG RNG; mount-node contract followed correctly (single canvas,
    animation disabled, no manual sizing)
  weaknesses:
  - Y-axis bounds are set to the raw data extremes (yAxisMin/yAxisMax), producing
    ugly non-round tick labels at the top and bottom ("110.3", "41.7") instead of
    clean round numbers — round the axis min/max to the nearest 5 or 10 before assigning
    scales.y.min/max
  - Class C's right-skewed exponential tail (padded by bandwidth*3) stretches the
    shared y-axis all the way to ~110.3, compressing the informative belly of all
    four violins (roughly 50-95) into a smaller fraction of the chart height than
    it deserves — trim the KDE evaluation range per group (e.g. clip padding to the
    99th percentile instead of min/max ± 3 bandwidths) so one skewed category doesn't
    dominate the shared vertical scale
  - No legend or annotation explains that the solid black/white line is the median
    and the dashed lines are Q1/Q3 — a first-time viewer has to infer this; a small
    caption or subtle in-plot label would remove the ambiguity
  - Overall look still reads close to a stock Chart.js line-chart (correct palette
    and alpha-blended fill aside) — could use more deliberate visual refinement (e.g.
    subtle per-lane background band, tighter dash pattern) to lift it out of "well-configured
    default" territory
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "violin-basic · javascript · chartjs · anyplot.ai" centered at top; dark "Class Group" x-axis title and dark "Test Score (%)" y-axis title; dark-grey tick labels on both axes; subtle light horizontal gridlines on the y-axis only, no x-axis gridlines. All fully readable against the light background.
      Data: Four mirrored violin silhouettes for Class A-D in Imprint palette order (#009E73 green, #C475FD lavender, #4467A3 blue, #BD8233 ochre), each with a semi-transparent fill on the right half and an outlined left half. Each violin carries a solid dark median line and two dashed dark-grey Q1/Q3 lines positioned inside the body. Class A is a symmetric bell shape, Class B is visibly bimodal (two bulges), Class C is heavily right-skewed with a long thin tail reaching toward the top of the chart, Class D is a narrow, tight bell high on the scale.
      Legibility verdict: PASS — no light-on-light issues; all title/axis/tick text is clearly dark-on-cream.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/axis text now rendered in white/light grey, gridlines faint and light-colored. Median lines flip to white, Q1/Q3 dashed lines flip to light grey — correctly theme-adapted.
      Data: Identical violin shapes and identical Imprint hues (green/lavender/blue/ochre) as the light render — confirms the categorical data colors do not shift between themes, only chrome flips.
      Legibility verdict: PASS — no dark-on-dark failures found; all text is clearly light-on-near-black, brand green remains distinct.
