review:
  strengths:
  - 'Creative, correct workaround for the core Highcharts bundle''s missing violin/boxplot
    series: mirrored KDE silhouettes are drawn with chart.renderer.path() and positioned
    via axis.toPixels() once the chart loads — an idiomatic use of Highcharts'' public
    SVG-renderer API rather than a hack'
  - Quartile ticks (dashed) and a median bar (solid, rendered in the page-background
    color to read as a 'cutout' against the fill) are both scaled to the violin's
    local half-width at that exact value, not the overall max width — a genuine design
    touch
  - 40-49 age group uses a bimodal mixture (competitive-masters + recreational clusters)
    that visibly produces a double-bulge silhouette, directly fulfilling the spec's
    implicit call for distribution-shape variety across categories
  - Imprint palette applied in canonical order (green, lavender, blue, ochre, red)
    with theme-adaptive chrome correct in both renders; title format matches the mandated
    pattern exactly
  - Deterministic LCG-seeded data generation with a real Silverman's-rule bandwidth
    calculation for the KDE, not a fixed/arbitrary smoothing constant
  weaknesses:
  - Quartile dash lines are relatively thin (stroke-width 1.5) — visible at full resolution
    but could lose definition when the PNG is scaled to a ~400px mobile width; consider
    bumping to ~2px
  - 'CQ-01 (KISS structure): the file defines seven helper functions (lcg, randNormal,
    quantile, stdDev, bandwidthOf, densityAt, drawViolins) — necessary given the custom
    KDE/rendering approach, but it departs from the plain imports→data→plot→save shape
    scored by CQ-01'
  - No axis line/spine is set on the y-axis (only x-axis gets an explicit lineColor)
    — a deliberate minimal-chrome choice, but slightly asymmetric versus the L-shaped
    frame convention
  - Distribution shapes across the four unimodal age groups (20-29, 30-39, 50-59,
    60+) differ only in mean/std, not in skew or additional structure — DQ-01 feature
    coverage would be stronger if more than one category showed a distinct shape (bimodal,
    skewed, etc.)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "violin-basic · javascript · highcharts · anyplot.ai" centered at top;
        x-axis title "Runner Age Group" and y-axis title "Marathon Finish Time (minutes)" in medium-gray
        ink; tick labels (category names 20-29..60+, and y values 140-400) in the same soft ink tone;
        subtle horizontal gridlines only. All chrome is clearly readable against the light background.
      Data: 5 violins colored green (#009E73), lavender (#C475FD), blue (#4467A3), ochre (#BD8233),
        red (#AE3030) — matching Imprint canonical order 1-5, first series is the mandated brand green.
        Each violin shows a mirrored KDE silhouette with two dashed quartile ticks and one solid white
        "cutout" median bar. The 40-49 (blue) violin visibly bulges at two separate bands (~225 and
        ~290), showing a bimodal shape versus the single-peaked shape of the other four groups.
      Legibility verdict: PASS — no text is light-on-light; all titles, axis labels, and ticks are dark
        against the cream surface and fully legible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light off-white / soft-gray tones,
        clearly visible against the dark surface; gridlines remain subtle and horizontal only.
      Data: Same 5 violin colors as the light render — green, lavender, blue, ochre, red — confirming data
        colors are identical across themes; only chrome (background, text, grid) flipped. The median bar
        is now dark (page-bg color) rather than white, still reading as a clear "cutout" against each
        colored fill, and the bimodal shape of the 40-49 violin is equally visible.
      Legibility verdict: PASS — no dark-on-dark failures; title/axis/tick text is light-colored and
        clearly readable against the near-black background.
