review:
  strengths:
  - 'Idiomatic canonical D3 violin-plot recipe: Epanechnikov kernel + Silverman bandwidth
    (1.06·σ·n^-0.2) KDE, mirrored d3.area with curveBasis smoothing, density filtered
    to the observed data range so tails don''t extend past real data.'
  - Quartile and median lines are drawn at the violin's *local* width at that quantile
    (via densityAt) rather than a fixed-width overlay — a more correct and polished
    touch than most violin implementations.
  - 'Genuinely diverse, story-driven synthetic data: tight normal (UltraLight), wide
    normal (ProSeries), a deliberately bimodal mixture (Workstation), a right-skewed
    exponential-like shape (Budget), and a clipped/skewed normal (Gaming) — this is
    exactly the kind of dataset that demonstrates what a violin reveals beyond a box
    plot.'
  - 'Correct Imprint palette usage in canonical order (green/lavender/blue/ochre/red),
    identical data colors across both themes, correct #FAF8F1 / #1A1A17 theme-adaptive
    backgrounds and chrome (ink/inkSoft/grid tokens threaded through axes, gridlines,
    and quartile/median strokes).'
  - Deterministic seeded LCG + Box-Muller RNG, minimal clean chrome (removed x-axis
    domain line, y-axis gridlines only, no legend since categories are already labeled
    on the x-axis).
  weaknesses:
  - ProSeries (lavender) violin has a bumpy, narrow-necked tail below ~y=7 that reads
    as a slight artifact of the KDE at low sample density in the tail rather than
    an intentional shape — consider a marginally wider bandwidth multiplier or trimming
    the density evaluation closer to the 1st/99th percentile of the data to smooth
    this out.
  - 'Design Excellence is solid but not exceptional: beyond the density-matched quartile
    lines and varied distribution shapes, there''s no additional focal-point technique
    (e.g. a subtle annotation calling out the bimodal Workstation category, or a title/subtitle
    emphasis) to push the storytelling further.'
  - Y-axis title ('Battery Life (hours)') at 18px sits close in size to the 22px chart
    title — a touch more differentiation between title and axis-label weight/size
    would sharpen the typographic hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Laptop Battery Life · violin-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered top. Y-axis title "Battery Life (hours)" rotated -90 on the left. X-axis category labels (UltraLight, ProSeries, Workstation, Budget, Gaming) and y-axis tick labels (0-24) in soft dark grey. Subtle horizontal gridlines every 5 units. All text is clearly readable against the light background — dark ink on cream, no light-on-light issues.
      Data: Five mirrored violins in canonical Imprint order — green (#009E73, UltraLight), lavender (ProSeries), blue (Workstation), ochre (Budget), matte red (Gaming). Each violin shows a thin dark quartile line pair and a thicker dark median line, both sized to the violin's local width at that quantile. Workstation is visibly bimodal (a "waisted" shape), correctly demonstrating what the violin reveals beyond a box plot.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis title, and tick labels now rendered in light ink/inkSoft tones, clearly visible against the dark background. Gridlines are faint light lines at the same 5-unit intervals. No dark-on-dark text anywhere.
      Data: The five violins use the identical fill colors as the light render (green/lavender/blue/ochre/red) — only the chrome (background, text, gridlines, quartile/median line color from ink token) flipped to the dark-theme tokens. Quartile/median lines are now light-colored and remain clearly distinguishable against each colored violin.
      Legibility verdict: PASS
