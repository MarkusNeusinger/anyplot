review:
  strengths:
  - Correct violin + box-plot composite built via ECharts custom series (renderItem)
    — a genuinely idiomatic solution since ECharts has no native violin chart type
  - Four course sections show clearly distinct distribution shapes (right-skewed,
    bimodal, moderate spread, narrow cluster) — strong feature coverage for a distribution-comparison
    plot
  - Imprint palette applied in canonical order with identical data colors across both
    renders; theme-adaptive chrome (background, ink, grid) and box interior (white
    fill in light, near-black fill in dark) are all correct in both themes
  - Deterministic LCG-seeded data generation with proper quantile-based box stats
    and a Silverman-bandwidth Gaussian KDE for the violin shape
  - 'Clean layout: L-shaped axis frame, subtle Y-only gridlines, generous margins,
    mandated title format, no edge clipping in either render'
  weaknesses:
  - 'The ''Capstone'' violin (narrow-cluster distribution, std=3 around mean 90) renders
    a thin near-zero-width color needle that extends from the whisker cap all the
    way down to the y-axis floor (50), crossing three gridlines below the real data
    minimum (~82). This happens in BOTH light and dark renders identically. Root cause:
    gaussianKDE is evaluated over one fixed yGrid (45-100) shared by every category,
    and violinHalfWidth = violinHalfWidth * (density/maxDensity) never reaches exactly
    zero, so a visible sliver streaks to the grid edge for any category whose spread
    is much tighter than the fixed grid range. Fix: scope each category''s yGrid to
    its own data range with padding (e.g. [min - 3*bandwidth, max + 3*bandwidth])
    instead of a single shared [45,100] grid, or add a density threshold (skip rendering
    where density/maxDensity < ~0.02) so the tail visually tapers to zero within the
    real data extent.'
  - Heavy reliance on helper functions (makeLCG, randNormal, clip, quantile, computeStats,
    silvermanBandwidth, gaussianKDE, plus four near-duplicate per-course score generators)
    reads more like a small library module than a flat script; largely justified by
    the custom KDE/renderItem approach ECharts requires here, but the four score generators
    could be collapsed into one parameterized helper for a cleaner script.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "violin-basic · javascript · echarts · anyplot.ai" in dark ink, centered, ~27% of canvas width. X-axis "Course Section" and Y-axis "Test Score (%)" labels in dark ink, tick labels in a slightly softer ink tone. Subtle horizontal gridlines only. Only left+bottom axis lines are drawn (L-shaped frame). All text is clearly readable against the light background.
      Data: Four mirrored-density violins over 4 course sections (Intro Stats, Data Structures, Algorithms, Capstone), colored in Imprint palette order — #009E73 green, #C475FD lavender, #4467A3 blue, #BD8233 ochre (first series correctly brand green). Each violin has a white-filled box (quartiles) with a black median line and whiskers/caps inside it. Shapes are visibly distinct: Intro Stats is right-skewed (long tail low, pile-up near 100), Data Structures is bimodal (two lobes), Algorithms has moderate/roughly symmetric spread, Capstone is a tight cluster near 90. The Capstone violin additionally shows a thin ochre "needle" streaking from its lower whisker cap down to the axis floor at 50 — a KDE-grid artifact, not real data (see weaknesses).
      Legibility verdict: PASS (all title/axis/tick text reads clearly; the needle artifact is a data-rendering defect, not a legibility problem).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels are all rendered in light ink tones, clearly visible against the dark background — no dark-on-dark failures. Gridlines are faint light lines at low opacity, still visible but unobtrusive.
      Data: Colors are pixel-identical to the light render (#009E73, #C475FD, #4467A3, #BD8233) — only chrome flipped as expected. Box interiors correctly flip to a near-black fill (elevatedBg) with white borders and a white median line, remaining fully readable against the dark violin fill. The same Capstone KDE-tail artifact reproduces identically in this render (confirmed via crop), proving it is a data/grid issue rather than a theme-specific bug.
      Legibility verdict: PASS (no dark-on-dark text; brand green and all chrome remain legible).
