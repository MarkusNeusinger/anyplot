review:
  strengths:
  - 'All required violin features: mirrored scipy KDE per department, IQR box, bold
    median line and whiskers, visible on every fill in both themes'
  - Four distinct distribution shapes (normal, normal, right-skewed, bimodal) in a
    realistic salary scenario show what a violin adds over a box plot
  - 'Idiomatic bokeh categorical coordinates: (category, offset) tuples place mirrored
    patches, quads and segments directly on the factor axis'
  - HoverTool bound to each IQR box reports median, Q1, Q3 and N in the HTML; NumeralTickFormatter
    gives a currency y axis
  - 'Full theme adaptation: Imprint canonical order, correct page colors, INK/INK_SOFT/ELEVATED_BG
    tokens throughout'
  - Tails end at each category's data range and the shared y axis is fitted to the
    data, so every violin sits fully inside the plot
  weaknesses:
  - 'Suggestion: the flat cut at each violin''s data extreme (most visible at the
    wide Sales base at $45k) could be softened by letting the KDE grid run a few percent
    past the extremes, as long as the tails stay near the data range.'
