review:
  strengths:
  - Native sns.violinplot with inner='box' draws quartiles and a white median tick
    inside every violin, and cut=0 ends each tail at its data range
  - Long-form DataFrame with column constants and hue=REGION + palette=IMPRINT_PALETTE[:n_regions]
    — the current seaborn API, adapts to any category count
  - Theme threaded through sns.set_theme rc tokens; both renders theme-correct with
    identical Imprint fills
  - Data choice exposes four distinct distribution shapes, including a bimodal East
    region that a box plot alone would hide
  weaknesses:
  - 'Suggestion: seaborn''s default dark-grey violin outline is nearly invisible against
    #1A1A17 in the dark render; linecolor=INK_SOFT would trace the shapes in both
    themes.'
  - 'Suggestion: inner_kws (e.g. box_width, whis_width) could make the inner box slightly
    more prominent against the large East violin.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across figure and axes.
      Chrome: title 'violin-basic · python · seaborn · anyplot.ai' in dark ink, axis titles 'Region' and 'Temperature (°C)', tick labels in soft dark ink; left/bottom spines only, subtle horizontal grid. All text readable.
      Data: four mirrored violins — North #009E73 (compact around 8 °C), South #C475FD (wide around 24 °C with a thin tail to 47 °C), East #4467A3 (bimodal, 4 and 28 °C), West #BD8233 (16 °C with a heat-event bump near 26 °C). Each has a dark inner box (IQR + whiskers) and a white median tick; tails cut at the data range.
      Legibility verdict: PASS

