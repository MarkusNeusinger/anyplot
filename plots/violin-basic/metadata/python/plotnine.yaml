review:
  strengths:
  - draw_quantiles=[0.25, 0.5, 0.75] draws the quartile markers and the median line
    inside every violin natively, and the ink-colored outline keeps them visible on
    every fill in both themes
  - Default trim=True ends each violin at its data range, so the tails no longer trail
    past the observed latencies
  - Four contrasting shapes (right-skewed edge cache, bimodal API gateway, tight database,
    wide batch worker) show what a violin reveals beyond a box plot
  - 'Category order and fill limits come from df[TIER].unique(), so Edge cache gets
    #009E73 and the palette follows the data''s order'
  - 'Clean adaptable structure: column constants with roles, a Data block that ends
    in df, a Plot block that reads only df, and the axis titles taken from the column
    names'
  weaknesses:
  - 'Suggestion: a 50 ms tick step on the latency axis (only 0, 100 and 200 are labelled
    now) would let a reader read the medians off more precisely.'
