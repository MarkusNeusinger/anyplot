review:
  strengths:
  - 'Imprint positions 1-4 in canonical order starting with #009E73, identical in
    both renders; chrome threaded through INK/INK_SOFT/PAGE_BG tokens'
  - Departments ordered by descending median salary, computed from the data
  - 'Distribution shapes chosen to show what a violin reveals over a box: bimodal
    Engineering, right-skewed Sales'
  - trim=True ends every violin at its data range on one shared, non-zero y axis
  - layer_tooltips with computed boxplot statistics (@{..middle..}, @{..lower..},
    @{..upper..}) for the HTML view
  weaknesses:
  - 'VQ-03 (both): the boxplot outliers are drawn as page-colored discs (white in
    light, near-black in dark) that cut holes into the violin fill and outline at
    the Design tails ($30k, $147k), the Marketing top ($120k) and the Sales upper
    tail ($104k-$131k) → no outlier marks over the violin. Likely cause: geom_boxplot(outlier_color=PAGE_BG,
    outlier_fill=PAGE_BG) instead of hiding them (outlier_alpha=0 or outlier_size=0).'
  - 'DE-02 (both): a full four-sided panel frame encloses the plot, and the y grid
    is drawn in solid INK_SOFT, which reads heavier than the subtle grid token → left/bottom
    or no spines and the 0.15-alpha ink grid. Likely cause: theme_minimal without
    panel_border=element_blank(), and panel_grid_major_y=element_line(color=INK_SOFT).'
  - 'Suggestion: a descriptive title prefix (for example ''Salary by Department ·
    '') would give the title more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: title 'violin-basic · python · letsplot · anyplot.ai' top-left in dark ink; axis titles 'Salary' and 'Department' dark; $-formatted y ticks ($30,000-$150,000) and category ticks in INK_SOFT; solid grey horizontal grid; a four-sided panel frame.
      Data: four violins - Engineering #009E73 (bimodal), Design #C475FD (normal, long thin tails), Marketing #4467A3, Sales #BD8233 (right-skewed, flat base at $45k) - with dark outlines and a narrow page-colored box with dark median bar and whiskers inside each. Outliers render as page-colored discs that punch holes into the violin tails (Design top and bottom, Marketing top, Sales upper tail).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, ticks in light grey INK_SOFT; grid light grey; frame light grey. No dark-on-dark text.
      Data: same four Imprint colors as the light render; violin outlines light grey; the boxes are near-black windows with light outlines and median bars, clearly visible. Outlier discs are near-black holes in the tails.
      Legibility verdict: PASS
