    is asked for on a -basic spec → drop both; the box already draws the required
    median. Likely cause: meanline=dict(visible=True) and fig.add_annotation(...).'
  - 'SC-03 (both): spanmode=''soft'' lets the tails trail past the data range, the
    Sales violin reaching about $20k against a data minimum near $33k (about -$13k)
    → end each violin at its data range. Likely cause: fig.update_traces(spanmode=''soft'').'
  - 'CQ-04 (code): dead configuration — a full legend dict while showlegend=False,
    and zerolinecolor while zeroline=False → delete both. Likely cause: leftover template
    settings.'
  - 'Suggestion: a bold title would strengthen the typographic hierarchy.'
