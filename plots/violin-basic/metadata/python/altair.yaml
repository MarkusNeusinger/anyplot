review:
  strengths:
  - 'Idiomatic Vega-Lite violin: transform_density + mark_area(orient=''horizontal'')
    with stack=''center'' mirrors the KDE declaratively, and each violin now ends
    at its own department''s data range'
  - Quartiles and median computed in-chart with transform_aggregate (q1/q3/median)
    and layered as rules; the page-colored median line cuts through the ink IQR bar
    and stays visible in both themes
  - Bimodal Sales and right-skewed Marketing show what a violin reveals that a box
    plot hides
  - 'Theme tokens threaded through axis, title, facet headers and view; Imprint order
    with #009E73 first'
  - resolve_scale(x='independent') gives each facet its own density width while the
    salary axis stays shared
  - Tooltips with formatted salary and median values in the HTML output
  weaknesses:
  - 'Suggestion: the IQR rule sits a few pixels right of the violin''s centre in the
    Support panel; aligning it with the mirrored density''s centre would look more
    precise.'
  - 'Suggestion: the KDE is cut flat at each department''s min and max (visible at
    the Sales and Engineering ends); a small per-group margin beyond the data range
    would taper the ends while still ending near the data.'
