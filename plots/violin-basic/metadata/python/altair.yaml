review:
  strengths:
  - 'Idiomatic Vega-Lite violin: transform_density + mark_area(orient=''horizontal'')
    with stack=''center'' mirrors the KDE declaratively'
  - Quartiles and median computed in-chart with transform_aggregate (q1/q3/median)
    and layered as rules; median in the page color cuts through the ink IQR bar and
    stays visible in both themes
  - Bimodal Sales department shows what a violin reveals that a box plot hides
  - 'Theme tokens threaded through axis, title, facet headers and view; Imprint order
    with #009E73 first'
  - resolve_scale(x='independent') gives each facet its own density width while the
    salary axis stays shared
  - Tooltips with formatted salary and median values in the HTML output
  weaknesses:
  - 'SC-02 (both): every violin''s density runs over the shared extent of about $20,000-$135,000
    (global min - 8,000 to global max + 8,000), so Marketing trails hairline tails
    to both ends, Engineering down to about $40,000 and Support down to $20,000, far
    beyond each department''s data → end each violin near its own data range (C4).
    Likely cause: transform_density extent= on line 65 set from the whole table''s
    min/max instead of per department.'
  - 'VQ-05 (both): facet category labels at 16 px dwarf the 10 px y tick labels and
    the 12 px y axis title → about 12 px (-4 px). Likely cause: alt.Header(labelFontSize=16)
    on line 118.'
  - 'CQ-04 (code): lines 106-109 (title_str length, ratio, max/round) compute a constant
    16 for the fixed mandated title → pass fontSize=16 directly. Likely cause: a generic
    title-shrink formula kept for a title that never exceeds 67 characters.'
  - 'Suggestion: the IQR rule sits about 20 px right of the violin''s centre axis;
    aligning it with the mirrored density''s centre would look more precise.'
