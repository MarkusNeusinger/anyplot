review:
  strengths:
  - Mirrored Silverman KDE, IQR box and warm-white median line cover every required
    feature in both themes
  - Per-hue darker IQR shades derived from the Imprint color keep each violin's box
    cohesive with its fill
  - 'Chrome fully themed: #FAF8F1/#1A1A17 backgrounds, INK/INK_MUTED text and grid;
    dark render fully readable'
  - Uniform 44 px tick labels on both axes and a data-fitted value axis not forced
    to zero
  - Per-series formatter tooltips show median, Q1 and Q3 in the interactive HTML
  weaknesses:
  - 'VQ-03 (both): pygal''s fill closes each violin and IQR polygon to the plot edge,
    leaving thin vertical stroke lines from every violin tail and IQR box corner down
    to the x-axis (and up to 103% for Remedial) that read as marks without data →
    no lines outside the violins. Likely cause: fill=True on pygal.XY series closing
    to the baseline; close the polygons without the baseline (fill only the violin
    series, draw the IQR box with stroke only or zero-width boundary).'
  - 'VQ-03 (both): the median line renders as a roughly 1-2 px hairline inside the
    IQR box, far thinner than the requested 18 px, and the IQR box outline does not
    show → a median line at least 6-8 px thick. Likely cause: per-series stroke_style
    width not applied in the PNG render; set it via the style or a dedicated series
    config that pygal honours.'
  - 'SC-01 (both): violins with more than one density peak are drawn 1.2x wider (Advanced),
    a highlighted violin the basic variant excludes (C5) → one width rule for all
    violins. Likely cause: MULTIMODAL_SCALE multiplier.'
  - 'SC-03 (both): the density grid ends at data max + 3, so the Advanced violin is
    cut flat at 103% instead of closing → extend the grid until the density falls
    near zero or clip at the data range. Likely cause: y_grid = np.linspace(y_min,
    y_max, N_POINTS).'
  - 'CQ-04 (code): the Gaussian KDE with Silverman bandwidth is written out by hand
    → scipy.stats.gaussian_kde(values, bw_method=''silverman'')(y_grid). Likely cause:
    the manual bandwidth and exp-sum density lines.'
  - 'Suggestion: a thin page-colored outline on each violin would sharpen the silhouettes
    on the dark surface.'
  image_description: |-
    Light render (plot-light.png):
