      Data: four mirrored violins Honors #009E73 (first), Standard #C475FD, Remedial #4467A3, Advanced #BD8233 (bimodal, drawn wider) at 0.78 opacity, each with a darker IQR box and a hairline warm-white median; thin vertical fill-artifact lines run from tails and box corners down to the axis (Remedial also up to 103%); Advanced top cut flat at 103%.
