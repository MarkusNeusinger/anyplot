review:
  strengths:
  - Mirrored Silverman KDE via scipy.stats.gaussian_kde, IQR box and warm-white median
    bar cover every required feature in both themes
  - Per-hue darker IQR shades derived from each Imprint color keep each violin's box
    cohesive with its fill
  - Fill-only polygons with zero stroke opacity draw clean violin, box and median
    shapes without pygal's closing edges
  - 'Chrome fully themed: #FAF8F1/#1A1A17 surfaces, INK/INK_MUTED text and grid; dark
    render fully readable'
  - Per-series formatter tooltips show median, Q1 and Q3 in the interactive HTML
  weaknesses:
  - 'SC-03 (both): the density grid runs 2.5 bandwidths past each group''s data range,
    so the tails of scores clipped at 100 reach about 105% (Honors), 107% (Standard)
    and 109% (Advanced) and Remedial''s lower tail about 33% → tails that end near
    the data range (at most about 1 bandwidth past it, or cut at the data min/max).
    Likely cause: TAIL_BANDWIDTHS = 2.5 in the grid reach.'
  - 'Suggestion: a thin page-colored outline on each violin would sharpen the silhouettes
    where the Advanced box meets its fill on the dark surface.'
