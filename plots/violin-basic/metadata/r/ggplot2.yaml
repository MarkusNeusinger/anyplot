review:
  strengths:
  - geom_violin(quantiles = c(0.25, 0.5, 0.75), quantile.colour = INK) draws all three
    quartile lines natively with the current ggplot2 4 API, in ink that flips per
    theme so they read on every fill in both renders
  - trim = TRUE ends every violin at its data range, and the automatic y-axis (40–100)
    is fitted to the data without forcing zero, so the four violins compare directly
    on one shared axis
  - Four contrasting distribution shapes — symmetric (A), bimodal (B), compact high
    (C), right-skewed (D) — exercise everything a violin plot shows
  - Imprint palette in canonical order at full opacity, identical in both renders;
    only chrome flips via the INK/INK_SOFT/PAGE_BG tokens
  - Column constants with !!CLASS_GROUP := and .data[[...]] keep the file adaptable,
    and labs() titles both axes from them
  weaknesses:
  - 'DQ-02 (both): the four groups are labelled ''Class A''–''Class D'', abstract
    letter codes that read as generic → descriptive class names (for example homeroom
    or course names such as ''Algebra I'', ''Biology'', ''Chemistry'', ''World History'').
    Likely cause: the label vector in the tibble''s CLASS_GROUP column.'
  - 'Suggestion: a thin violin outline in PAGE_BG instead of INK_SOFT would make the
    shapes read slightly cleaner on the dark render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "violin-basic · r · ggplot2 · anyplot.ai" in dark ink top-left; axis titles "Class group" and "Test score" in INK; ticks 40/60/80/100 and Class A–D in INK_SOFT; subtle y-only grid; L-shaped axis lines. All readable.
      Data: four trimmed violins — Class A #009E73 (symmetric, tail to ~42), Class B #C475FD (bimodal with a pinch at the median ~72), Class C #4467A3 (compact around 83), Class D #BD8233 (right-skewed, floor ~58, spire to 100). Three near-black quartile lines (Q1, median, Q3) inside each violin, clearly visible on every fill. Thin INK_SOFT outlines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light INK #F0EFE8, ticks in INK_SOFT #B8B7B0, subtle grid, light axis lines. No dark-on-dark text.
      Data: the same four Imprint fills, identical to the light render; quartile lines flip to light ink and are clearly visible on the green, lavender, blue and ochre fills; light outlines.
      Legibility verdict: PASS
