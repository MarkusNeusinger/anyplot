review:
  strengths:
  - 'Correct Code 128B encoding: weighted mod-103 checksum (31), Start B → data →
    check → stop, 10-module quiet zones, all widths whole modules from the pattern
    table'
  - White tile behind the symbol keeps black-on-white bars in the dark theme while
    all chrome uses theme tokens
  - layer_tooltips() exposes the character, position and code value of every symbol
    in the HTML output
  - Flat, deterministic, readable code
  - Clear text hierarchy with the title in primary ink and subtitle/caption in secondary
    ink
  weaknesses:
  - 'SC-02 (both): every bar is drawn with a grey (~#444) outline stroke around its
    black fill, so the bars are not the solid, sharp-edged black the spec''s C5 asks
    for, and the stroke thickens 1-module bars into their neighbouring spaces → solid
    black bars with no visible outline. Likely cause: the bars'' geom_rect has no
    color= set, so lets-plot draws its default outline; set color="#000000" (or size=0).'
  - 'DE-02 (both): a grey four-sided frame encloses the whole drawing area where nothing
    requires one, short of the style guide''s spine rule → no frame. Likely cause:
    theme(panel_background=element_rect(fill=PAGE_BG)) without color=PAGE_BG, which
    keeps the default panel outline.'
  - 'Suggestion: move the title and subtitle into labs(title=..., subtitle=...) with
    theme plot_title/plot_subtitle styling instead of geom_text at fixed data coordinates.'
  - 'Suggestion: the weighted checksum loop could be one sum(...) expression.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 with a thin grey frame around the drawing area; a white tile holds the barcode.
      Chrome: title 'barcode-code128 · python · letsplot · anyplot.ai' in dark primary ink at top, subtitle 'Shipping label · Code 128B · 16 characters' in secondary grey; large 'SHIP-2024-ABC123' below the tile and caption '16 chars · Code 128B · check digit: 31'. All readable.
      Data: black Code 128 bars (each with a visible grey outline) of varying whole-module widths on white, with quiet zones left and right. No categorical palette (black on white per spec).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, same thin grey frame; the white barcode tile is unchanged.
      Chrome: title and human-readable text in light primary ink #F0EFE8, subtitle and caption in light secondary grey; no dark-on-dark text.
      Data: identical black bars with grey outlines on the white tile; bar pattern identical to the light render.
      Legibility verdict: PASS
