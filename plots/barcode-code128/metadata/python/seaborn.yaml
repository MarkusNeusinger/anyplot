review:
  strengths:
  - 'Correct Code 128 subset B construction: Start B, whole-module patterns from the
    standard table, a mod-103 check character computed from the content, the 13-module
    stop and 10-module quiet zones on both sides.'
  - sns.heatmap renders the module raster with crisp edges, and sns.blend_palette(as_cmap=True)
    builds the two-tone colormap from theme tokens.
  - A structure strip aligned to module boundaries labels Start, Data, Check and Stop
    under exactly the parts they name, outside the bars.
  - Bold monospace human-readable text below the symbol reads the encoded content
    clearly in both themes.
  weaknesses:
  - 'SC-02 (dark): the bars render as cream #F0EFE8 on the #1A1A17 page, an inverted
    symbol instead of the black bars on a white ground the Notes and the spec''s C5
    bullet ask for (a white tile behind the symbol in the dark theme is permitted)
    → near-black bars on a light tile in both themes. Likely cause: sns.blend_palette([PAGE_BG,
    INK]) maps the bar value 1 to INK, which is light in the dark theme.'
  - 'VQ-07 (both): the zone patches are drawn with alpha 0.80-0.85, so the Imprint
    hues blend with the page and differ between renders (Start reads about #26AE88
    in light and #058B67 in dark), and the second category is #4467A3 instead of #C475FD
    → opaque Imprint colors in canonical order (Start #009E73, Data #C475FD, Check
    #4467A3, Stop #BD8233). Likely cause: alpha= on plt.Rectangle and the zone_defs
    color order.'
  - 'VQ-01 (light): white 7 pt labels on the alpha-lightened lilac Check and ochre
    Stop patches reach only about 2.5:1 contrast → at least 4.5:1, through opaque
    fills or INK-colored text on the light fills. Likely cause: color=''white'' over
    patches with alpha 0.85.'
  - 'CQ-04 (code): lines 133-229 hold a 97-line CODE128_VALUES dict that restates
    ord(char) - 32 for every subset-B character → remove it and compute the value
    as ord(char) - 32 (also replaces the reverse lookup loop for the check character).
    Likely cause: the value table was written out next to the pattern table.'
  - 'Suggestion: leave the strip blank under the quiet zones instead of grey patches,
    so the quiet zones read as empty all the way down.'
