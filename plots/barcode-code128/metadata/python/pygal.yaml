review:
  strengths:
  - 'Full manual Code 128 encoding: Start B, Code B characters, a Code C switch with
    digit pairs, the modulo-103 check (15) and the 7-element stop pattern'
  - Bar and space widths follow the pattern table in whole modules, with 10-module
    quiet zones on both sides
  - 'Bars are opaque #000000 (opacity=1, stroke_width=0) on a light tile that stays
    light in the dark theme while page and text chrome follow the theme'
  - Interactive HTML output alongside the PNG
  weaknesses:
  - 'SC-02 (both): every multi-module bar is drawn as adjacent one-module pygal bars
    with a ~2 px light seam between them (pixel row y=1200: ''########..########''),
    so a 2-, 3- or 4-module bar reads as several thin bars instead of one solid bar
    (C5, and the widths C2 asks for) → one solid bar per bar run with no seam. Likely
    cause: one pygal.Bar column per module; pygal.Histogram with one (100, start,
    end) tuple per bar run draws each run as a single rect.'
  - 'Suggestion: keep the human-readable line to the encoded content (SHIP-20240101)
    and move the subset/char-count/check metadata into a smaller second line so it
    does not wrap mid-phrase.'
  - 'Suggestion: per-bar tooltips in the HTML naming the encoded symbol (start, character,
    check, stop) would use pygal''s interactivity.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around an elevated #FFFDF6 tile holding the barcode (2400x2400 square canvas).
