  - 'Full manual Code 128 encoding: Start B, Code B characters, Code C switch with
    digit pairs, modulo-103 check (15) and the 7-element stop pattern'
  - Bar and space widths follow the pattern table in whole modules, with 10-module
    quiet zones on both sides
  - Barcode kept on a light tile in the dark theme while the page and text chrome
    follow the theme
  - Interactive HTML output alongside the PNG
  weaknesses:
  - 'SC-02 (both): the bars render #4C4B49 grey (black at pygal''s default ~0.7 fill
    opacity) with darker #31302F seams between the adjacent one-module bars inside
    each wide bar, not the solid sharp-edged black bars the spec''s C5 asks for →
    opaque #000000 bars with no seams. Likely cause: Style without opacity=1/opacity_hover=1
    and per-module bars each drawn with their own stroke (build one bar per run, or
    set stroke_width=0).'
  - 'Suggestion: keep the human-readable line to the encoded content (SHIP-20240101)
    and move the subset/char-count/check metadata into a smaller second line so it
    does not wrap mid-phrase.'
  - 'Suggestion: per-bar tooltips in the HTML naming the encoded symbol (start, character,
    check, stop) would use pygal''s interactivity.'
