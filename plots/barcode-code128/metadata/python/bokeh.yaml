  - 'Correct Code 128 Subset B construction: start 211214, 16 data characters, check
    character 31 (pattern 212321) computed by mod 103, stop 2331112, all in whole
    modules'
  - Quiet zones of 10 modules left clean on a white tile, human-readable text in monospace
    clear below the bars
  - 'Theme-correct chrome: title flips with INK, and the subtitle on the white tile
    uses a fixed dark grey readable in both themes'
  - Zone brackets line up exactly with the start, data, check and stop parts and sit
    outside the bars
  - HoverTool on a ColumnDataSource reveals the encoded character of each bar in the
    HTML view
  weaknesses:
  - 'VQ-01 (both): the zone labels (Start B, Data Payload, Check Digit, Stop) and
    the subtitle are set at 22pt (~29 px), below the style guide''s 34pt bokeh reference
    for the smallest text → 34pt (+12pt), shortening a label such as ''Check'' if
    the right-hand pair gets tight. Likely cause: text_font_size="22pt" on the zone
    Labels and the subtitle Label.'
  - 'CQ-04 (code): CODE128_B (lines 37–133) and CODE128_VALUES (lines 136–232) repeat
    what CHECKSUM_PATTERNS (lines 239–346) already holds — CODE128_B[ch] is CHECKSUM_PATTERNS[ord(ch)
    - 32] and CODE128_VALUES[ch] is ord(ch) - 32 → keep one pattern list indexed by
    ord(ch) - 32 (about −190 lines, same render). Likely cause: three hand-written
    lookup tables for one Code 128 value table.'
  - 'Suggestion: drop the unused INK_SOFT token (line 32) or use it.'
  - 'Suggestion: the dark render shows a faint 1 px grey frame around the plot area
    and dark bands above and below the white tile; extending the tile to the frame
    edges would give a cleaner label.'
