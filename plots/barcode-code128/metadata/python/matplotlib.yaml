  - 'Correct Code 128 Subset B encoding: start B, 16 data symbols, modulo-103 check
    character (value 31) and the 13-module stop pattern, every symbol a whole number
    of modules'
  - ax.imshow of a binary module array with interpolation='nearest' renders razor-sharp,
    gradient-free bars at exact module widths
  - Zone brackets snapped to module boundaries label start, data, check, stop and
    both quiet zones, outside the bars as the spec allows
  - Human-readable SHIP-2024-ABC123 in bold monospace sits clearly below the bars;
    both renders fully readable
  weaknesses:
  - 'SC-02 (dark): the symbol is inverted to light #F0EFE8 bars on the #1A1A17 ground,
    so the dark render no longer shows the black bars on a white ground that the Notes
    and the ''A good version shows'' bullet require (many scanners reject inverted
    symbols) → keep dark bars on a light tile in both themes (the spec permits a white
    tile behind the symbol in the dark theme). Likely cause: bar_cmap built from [PAGE_BG,
    INK], which flips with the theme.'
  - 'CQ-04 (code): lines 26–122 the CODE128_B dict repeats, row for row, the first
    95 entries of CHECKSUM_PATTERNS (about 97 lines of duplicated patterns), and line
    339 ax.tick_params(colors=INK_SOFT) styles ticks that were removed → remove the
    dict and index CHECKSUM_PATTERNS[CODE128_B_VALUES[char]]; remove the tick_params
    call. Likely cause: two lookup tables kept for encoding and checksum.'
  - 'Suggestion: the two staggered label rows give the zone labels an uneven rhythm;
    a single row could fit if the short Check/Stop labels used leader lines only where
    they crowd.'
