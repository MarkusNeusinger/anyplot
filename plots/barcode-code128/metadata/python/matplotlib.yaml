review:
  strengths:
  - 'Correct Code 128 Subset B encoding, checked by recomputing: the Start B symbol
    (211214, value 104), 16 data symbols, the modulo-103 check character (value 31),
    and the 13-module stop pattern, so every bar and space is a whole number of modules'
  - One 106-entry SYMBOL_PATTERNS table drives both the data symbols and the check
    character, so encoding and checksum cannot drift apart
  - ax.imshow of a binary module array with a two-step LinearSegmentedColormap and
    interpolation='nearest' gives sharp, gradient-free bars at exact module widths
  - The symbol stays near-black on a light tile in both themes. Only the chrome flips,
    which the spec allows, and the dark render keeps the scannable polarity
  - Zone brackets snapped to module boundaries name the start, data, check, and stop
    parts and both quiet zones, and they sit outside the bars
  - The human-readable SHIP-2024-ABC123, in bold monospace, sits clearly below the
    bars and is readable in both themes
  weaknesses:
  - 'Suggestion: the binary-pattern loop and np.array([full_pattern] * barcode_height)
    could be np.repeat over the alternating bar/space widths and np.tile, a few lines
    shorter.'
  - 'Suggestion: in the dark render the light tile ends flush at the top and bottom
    of the bars; a small vertical margin of tile around the symbol would read more
    like a printed label.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white, not dark.
      Chrome: the title 'barcode-code128 · python · matplotlib · anyplot.ai' is at the top in dark ink, 12 pt, about half the width. Muted-gray 8 pt monospace zone labels sit in two staggered rows over thin bracket lines aligned to each zone: Quiet Zone, Data · Code B (16 chars) and Stop on the lower row; Start, Check and Quiet Zone with leader lines on the upper row. There are no axes, ticks or grid, which the spec permits.
      Data: near-black #1A1A17 Code 128 bars on the off-white ground, solid, sharp-edged and of equal height, with blank quiet zones left and right. The start symbol shows the Start B rhythm (2-1-1-2-1-4). Bold 16 pt monospace 'SHIP-2024-ABC123' is centered below the bars and clear of them. The render is monochrome, with no categorical series.
