review:
  strengths:
  - 'Verified-correct Code 128 Subset B encoding: symbol values, weighted mod-103
    checksum (manually re-derived from "SPEC-88451-QC" and confirmed to equal 9, matching
    the footer), ISO/IEC 15417 bar/space width table, and Stop pattern are all technically
    accurate'
  - 10-module quiet zones on each side match the ISO minimum, and the human-readable
    text is placed directly below the bars per spec
  - Thoughtful, explicitly-commented design decision to keep the barcode card fixed
    black-ink-on-white regardless of theme (a printed label doesn't follow the page's
    dark/light mode) while still correctly flipping title/subtitle/footnote chrome
    between light and dark tokens
  - Clean three-tier typography hierarchy (title, subtitle, bold human-readable code,
    muted footnote metadata) with every fontsize explicitly set
  - Fully custom, minimal-chrome geometric rendering (hidedecorations!/hidespines!,
    poly!/text! primitives, DataAspect()) rather than forcing a barcode into an inappropriate
    default Axis look
  - Realistic, on-spec laboratory specimen scenario matching the spec's stated healthcare/lab
    use case
  - Both renders are theme-correct with no clipping and no overlap
  weaknesses:
  - Title spans only ~30% of the canvas width, well under the ~50-70% recommended
    range — enlarge the title fontsize slightly so it reads with more visual weight
    relative to the label card below it
  - 'Vertical whitespace is imbalanced: the margin above the title (~8% of canvas
    height) is much smaller than the empty space below the footnote text (~20%+) —
    tighten the bottom margin or shift the whole composition down slightly so top/bottom
    margins read as balanced'
  - Overall composition is polished but still close to a 'well-configured default'
    rather than truly publication-grade — consider a small additional polish touch
    (e.g. a subtle Imprint-green accent mark or thin border/shadow on the label card)
    without ever compromising the black-ink-on-white barcode contract needed for scan
    reliability
  - Spec mentions three switchable Code 128 subsets (A/B/C); this implementation only
    demonstrates Subset B (a reasonable choice for a single barcode, and already noted
    in the footer) — no change required, just noting for context
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "barcode-code128 · julia · makie · anyplot.ai" in dark ink, subtitle "Laboratory specimen label" in softer gray beneath it, footnote "Code 128, Subset B · Quiet zone 10 modules each side · Check digit 9" in muted gray at the bottom — all clearly readable against the light background.
      Data: A white label card sits centered on the page holding a black Code 128 barcode (Subset B) encoding "SPEC-88451-QC", with the human-readable text in bold dark ink directly below the bars. The card and bars are pure white/black by design (documented in-code as a deliberate exception since a printed label's ink does not follow the page theme), with generous quiet-zone padding on both sides of the bars.
      Legibility verdict: PASS — every text element (title, subtitle, human-readable code, footnote) is clearly legible with strong contrast against #FAF8F1.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title now renders in light off-white ink, subtitle and footnote in lighter muted grays — all chrome correctly flipped to theme-adaptive tokens.
      Data: The label card and barcode are identical to the light render — same white card, same black bars, same bold human-readable text — confirming the "printed label" exception is applied consistently and the barcode geometry itself is unchanged between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all surrounding chrome text is light-colored and reads clearly against the near-black page, and the fixed-white card provides strong contrast for the black barcode regardless of page theme.
