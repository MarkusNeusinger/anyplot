  strengths:
  - 'Correct Code 128 Subset B encoding: Start B (104), data values ord(c)-32, mod-103
    check character (102 for SPEC-LAB-2024-X789) and the 13-module stop pattern, with
    10-module quiet zones on both sides'
  - 'Theme tokens threaded through every text element: no dark-on-dark or light-on-light
    text, while the symbol keeps its black-on-white tile in both themes'
  - 'Typographic hierarchy: monospace human-readable code, bold title, italic INK_SOFT
    context line and muted caption'
  - Idiomatic ggplot2 construction of a non-native chart type from geom_rect layers
    on theme_void with coord_cartesian(clip = 'off')
  weaknesses:
  - 'CQ-01 (code): the encoder and the rectangle builder are wrapped in two helper
    functions (encode_code128b, patterns_to_df) instead of the flat Imports → Data
    → Plot → Save structure → inline both as straight-line code in the Data block.
    Likely cause: the function definitions at lines 36–64.'
  - 'Suggestion: build the bar table with vectorized cumsum over the module widths
    instead of the growing-list loop, which would also make set.seed(42) (unused,
    no randomness) removable.'
  - 'Suggestion: small start / data / check / stop labels under the bars, aligned
    with their parts, would show the symbol''s structure.'
