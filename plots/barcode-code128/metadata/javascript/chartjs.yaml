review:
  strengths:
  - 'Algorithmically correct Code 128 Set B encoder: charCode-32 symbol lookup, weighted
    mod-103 checksum (verified by hand: check digit 31 for "SHIP-2024-ABC123"), correct
    11-module symbol patterns, and a proper 13-module STOP pattern (11-bit table entry
    + trailing 2-module termination bar).'
  - 'All spec Notes requirements satisfied: 10-module quiet zones on both sides, human-readable
    text below the barcode, check-digit shown, high-contrast black-on-white bars.'
  - 'Idiomatic, distinctive Chart.js technique: floating-bar dataset ([min,max] per
    module) with categoryPercentage/barPercentage=1 to render contiguous bars, combined
    with beforeDatasetsDraw/afterDatasetsDraw plugin hooks to paint the label card
    and human-readable text — goes well beyond basic options/plugin config.'
  - Clear, well-reasoned code comments justify the one deliberate palette exception
    (fixed black-on-white bars, per the spec's own scannability requirement) versus
    the theme-adaptive title chrome — makes the design intent obvious to a future
    reader or repair pass.
  - Realistic, neutral example data ("SHIP-2024-ABC123" shipping label) matching the
    spec's own suggested example exactly.
  - 'Clean KISS structure, no fake interactivity, correct mount-node contract (animation:
    false, canvas appended once, no width/height overrides).'
  weaknesses:
  - Only demonstrates Code Set B — the spec's description explicitly calls out that
    Code 128 supports three subsets (A/B/C) 'switched dynamically for optimal encoding
    efficiency,' but this implementation never shows that switching behavior (e.g.,
    a numeric run encoded via Set C for density). Not a correctness bug, but leaves
    a headline feature of the format uncovered by the example.
  - The visualization is intentionally monochrome for scannability (correct call per
    spec), but as a result carries zero Imprint brand-green accent anywhere on the
    card (title text uses only theme ink tokens) — a small decorative touch (e.g.,
    a thin green rule under the title, or a colored corner tag) could add brand cohesion
    without touching the bars.
  - The 'Code 128B · check digit 31 (mod 103)' subtitle exposes internal algorithm
    mechanics (modulus, subset letter) that a real-world shipping label would never
    print — fine for an educational/technical visualization, but slightly undercuts
    the 'as found on real labels' framing from the spec's Applications section.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the mandated light-theme mount background. The label card itself is also off-white/cream (same fixed CARD_BG token), bordered by a thin subtle rule.
      Chrome: Title "barcode-code128 · javascript · chartjs · anyplot.ai" in bold dark ink, clearly legible, comfortably sized (~30% of canvas width, not squeezed, not overflowing). No axis labels/ticks/legend — correctly hidden for a barcode visualization.
      Data: A dense vertical black-bar Code 128 pattern occupying the top ~2/3 of the card, with visible quiet-zone whitespace on both left and right edges before the bars start. Below the bars, "SHIP-2024-ABC123" is rendered in bold monospace dark ink, and "Code 128B · check digit 31 (mod 103)" in a lighter/smaller monospace weight beneath it. Bars and text are both dark-on-cream, maximum contrast.
      Legibility verdict: PASS — all text and bars are clearly readable, no overlap, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) mount, correctly flipped from light. The label card itself stays cream/off-white — a deliberate, spec-justified fixed color (barcode must remain black-on-white regardless of surrounding theme for scan reliability), documented in code comments.
      Chrome: Title text is now light/white (theme ink token correctly flipped), clearly readable against the dark mount background. No dark-on-dark failure — the title correctly tracks ANYPLOT_THEME while the barcode card intentionally does not.
      Data: The barcode bars and human-readable text underneath are rendered with the exact same fixed dark-ink-on-cream-card treatment as the light render — pixel-identical data presentation, confirming color identity is preserved between themes (the only difference is the surrounding mount background and title color, as intended).
      Legibility verdict: PASS — title readable against dark mount, barcode/text readable against its own cream card in both renders; no dark-on-dark or light-on-light failures anywhere.
