      Background: Warm off-white (~#FAF8F1), not pure white -- correct.
      Chrome: Bold dark title "barcode-code128 · javascript · echarts · anyplot.ai" centered at top, gray subtitle below it ("Code 128, Subset B of 3 switchable subsets (A/B/C)  ·  check digit 67 (mod 103)  ·  12 data characters"), small italic "quiet zone" labels (13px) above the left/right margins of the bar block, bold monospace human-readable text "P K G - 4 8 2 1 3 - R X" below the bars, and four per-segment bracket annotations (tick-line-tick brackets with centered labels) directly beneath the human-readable text reading "Start B", "data (12 chars)", "check", "Stop" -- each bracket spans exactly the bar range it names. All text renders in dark ink against the light background; a zoomed crop of the tightest pair ("check"/"Stop") confirms no overlap.
      Data: Dense sequence of solid black bars of varying width (Start B + 12 data symbols + check symbol + Stop) on the light background -- maximum black-on-white contrast, matching the spec's "high contrast black bars on white background" requirement.
      Legibility verdict: PASS -- title, subtitle, quiet-zone labels, human-readable text, and all four bracket labels are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black -- correct.
      Chrome: Same title/subtitle/labels/bracket layout as the light render, now rendered in light ink (near-white/light-gray) against the dark background -- confirmed theme-correct flip, no dark-on-dark failures anywhere (title, subtitle, quiet-zone labels, human-readable text, and all four bracket labels are clearly visible).
