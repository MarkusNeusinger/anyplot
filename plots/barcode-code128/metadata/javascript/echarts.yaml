review:
  strengths:
  - 'Correct and verified Code 128 Subset B encoding: Start B, per-character symbol
    lookup, modulo-103 checksum (manually re-derived: checksum=2436, 2436 mod 103
    = 67, matches the displayed ''check digit 67''), and Stop pattern — the full standard-compliant
    pipeline.'
  - 'Includes all spec-mandated structural elements: >=10x quiet zones on both sides
    (explicitly labeled), mandatory check digit, Start/Stop patterns, and human-readable
    text below the bars in monospace with letter spacing, matching real barcode-label
    conventions.'
  - Idiomatic use of ECharts' custom series (`renderItem` + `api.coord`) to draw exact-width
    bar rectangles from a value axis — the correct ECharts primitive for this kind
    of precise geometric rendering, rather than forcing a bar series to fake it.
  - 'Clean theme-adaptive chrome: title, subtitle, quiet-zone labels, human-readable
    text, and structure caption all correctly use `t.ink`/`t.inkSoft`; backgrounds
    are the correct warm off-white/near-black and fully legible in both renders.'
  - Informative subtitle and structure caption ('Start B · data · check symbol · Stop')
    add genuine data-storytelling value beyond a bare barcode, explaining the encoding
    to the viewer.
  - 'Deterministic, dependency-free, KISS-structured code: no RNG, no unused imports,
    no functions/classes beyond the one necessary `renderItem` callback.'
  weaknesses:
  - Only Subset B is demonstrated even though the spec explicitly calls out three
    switchable subsets (A, B, C) as a core feature of Code 128 — showing/mentioning
    subset-switching (or at least noting in the subtitle why B was chosen) would give
    fuller feature coverage.
  - Noticeable empty canvas below the human-readable text and structure caption (~20%
    of canvas height unused at the bottom) — the barcode block could be recentered
    vertically or the caption enlarged slightly to use the space better.
  - Zone-structure explanation is a single small caption line ('Start B · data · check
    symbol · Stop') rather than per-segment annotations (e.g. bracket lines pointing
    at the actual Start/Check/Stop bar groups) — less thorough storytelling than mapping
    the caption directly onto the bars it describes.
  - Quiet-zone labels (11px) and structure caption (13px) are on the small side relative
    to the rest of the type hierarchy — legible at full resolution but the smallest
    text on the canvas, worth a modest bump for mobile-width readability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — correct.
      Chrome: Bold dark title "barcode-code128 · javascript · echarts · anyplot.ai" centered at top, gray subtitle below it ("Code 128, Subset B · check digit 67 (mod 103) · 12 data characters"), small italic "quiet zone" labels above the left/right margins of the bar block, bold monospace human-readable text "P K G - 4 8 2 1 3 - R X" below the bars, and a small gray caption "Start B · data · check symbol · Stop" beneath that. All text renders in dark ink against the light background.
      Data: The barcode itself is a dense sequence of solid black bars of varying width (Start B + 12 data symbols + check symbol + Stop) on the light background — maximum black-on-white contrast, matching the spec's "high contrast black bars on white background" requirement.
      Legibility verdict: PASS — title, subtitle, quiet-zone labels, human-readable text, and structure caption are all clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — correct.
      Chrome: Same title/subtitle/labels/caption layout as the light render, now rendered in light ink (near-white/light-gray) against the dark background — confirmed theme-correct flip, no dark-on-dark failures anywhere (title, subtitle, quiet-zone labels, human-readable text, and caption are all clearly visible).
      Data: The bars invert to light-colored bars on the near-black background (both bars and background follow the theme-adaptive ink/page tokens, consistent with this spec's precedent in the matplotlib implementation, which uses the same PAGE_BG<->INK-driven binary colormap and was reviewed as maximum contrast in both themes). Bar widths/positions are pixel-identical to the light render — only the bar/background polarity flips with the theme, as intended.
      Legibility verdict: PASS — all text clearly readable against the dark background; no dark-on-dark failures.
