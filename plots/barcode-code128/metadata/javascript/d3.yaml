review:
  strengths:
  - 'Correct, spec-compliant Code 128 Subset B encoding: proper start pattern, positionally-weighted
    modulo-103 check digit, stop pattern, and 10-module quiet zones on both sides
    — matches the barcode spec exactly, not a decorative approximation.'
  - 'Thoughtful, well-reasoned color choice: bars use theme-adaptive ink instead of
    the Imprint categorical palette because the bar pattern is the encoded content,
    not a data series — upholds the spec''s "high contrast black bars" scanning requirement
    while flipping correctly between light/dark themes.'
  - 'Clean typographic hierarchy: bold title, bold monospaced human-readable text
    with letter-spacing under the bars, and a smaller muted caption with encoding
    metadata (subset, character count, check digit, symbol count) — informative and
    legible in both renders.'
  - Both light and dark renders pass legibility and theme-adaptation checks with no
    dark-on-dark/light-on-light issues, no clipped elements, and identical bar geometry
    between themes.
  weaknesses:
  - 'Underuses idiomatic D3: bars are drawn from raw pixel arithmetic with no scales,
    axes, or transitions — acceptable for a barcode''s fixed-width module geometry,
    but leaves little that showcases d3-specific mastery.'
  - 'Vertical whitespace is imbalanced: the gap between the title and the top of the
    barcode is noticeably smaller than the empty space below the caption — shift the
    bar block down or vertically center the whole content block for better balance.'
  - Only demonstrates Code Set B; the spec highlights the three interchangeable subsets
    (A/B/C) as a defining Code 128 feature, and the implementation always encodes
    with Subset B — acceptable for one illustrative example, but worth a comment noting
    why B was chosen for this all-ASCII shipping-label content.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Bold dark title "barcode-code128 · javascript · d3 · anyplot.ai" centered at top; bold monospaced human-readable text "SHIP-2024-ABC123" with letter-spacing below the bars; smaller muted caption "Code Set B · 16 characters · check digit 31 (mod 103) · 19 symbols" below that. All fully readable against the light background.
      Data: The barcode bars render as solid dark ink (theme-adaptive, not a palette color) against the off-white surface, with clear quiet-zone margins on both sides of the bar block. High contrast, easily distinguishable bar/space pattern.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title, human-readable text, and caption, now rendered in light ink/soft-ink tones against the dark background. All fully readable — no dark-on-dark text observed anywhere.
      Data: Bars are inverted to light ink on the dark surface (correct theme-adaptive chrome flip); the module widths and bar/space pattern are pixel-identical to the light render, confirming the encoded data itself does not change between themes.
      Legibility verdict: PASS
