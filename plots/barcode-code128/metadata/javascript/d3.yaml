      Data: The barcode bars render as solid dark ink (theme-adaptive, not a palette color) against the off-white surface, with clear quiet-zone margins on both sides of the bar block. High contrast, clean bar/space pattern with no rounding gaps between adjacent bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Same title, human-readable text, and caption, rendered in light ink / soft-ink tones against the dark background. All fully readable — no dark-on-dark text observed anywhere. Same balanced vertical whitespace as the light render.
      Data: Bars invert to light ink on the dark surface (correct theme-adaptive chrome flip); module widths and the bar/space pattern are pixel-identical to the light render, and the printed check digit (31) matches between themes, confirming the encoded data itself does not change with theme.
