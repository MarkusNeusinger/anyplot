review:
  strengths:
  - 'The full Code 128 symbol is computed from the content in code: Start B (104),
    Subset B values (ASCII − 32), the modulo-103 check value (31, verified independently)
    and the 13-module Stop, all from the ISO/IEC 15417 pattern table'
  - Every bar and space is a run-length segment drawn as one stacked series of a horizontal
    BarChart on a linear 0–totalModules axis, so each width is an exact whole number
    of modules; whole-pixel module sizing (Math.floor) keeps all bar edges sharp
  - 10-module quiet zones are built into the bit string on both sides and stay free
    of text; the human-readable text sits clear below the bars in a letter-spaced
    monospace face
  - Dark bars on a light label tile in both themes keep the symbol scannable, while
    the title and caption chrome flip correctly through ANYPLOT_TOKENS
  - 'Animation disabled with skipAnimation, axes hidden with position: none, the tooltip
    turned off and categoryGapRatio: 0 configure the chart cleanly for a static symbol'
  weaknesses:
  - 'Suggestion: the caption at 16 px and the title at 22 px are small in the 400
    px thumbnail; a slightly larger caption would carry the encoding facts further.'
  - 'Suggestion: optional labels naming the start, data, check and stop parts under
    the bars would show the symbol''s structure (the spec allows them).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; an off-white label tile with a subtle grid-colored 1 px border and rounded corners holds the symbol.
      Chrome: bold dark title "barcode-code128 · javascript · muix · anyplot.ai" centered on top (about 31 % of the width); muted gray caption below the tile ("Code 128 Subset B · 16 data characters · check value 31 · 231 modules incl. 10-module quiet zones"). All readable.
      Data: one row of equal-height, sharp-edged near-black (#1A1A17) bars of 1–4 module widths with an irregular thick/thin rhythm, quiet zones left and right inside the tile, and the human-readable text "SHIP-2024-ABC123" in a letter-spaced monospace face below the bars, clear of them. No axes, ticks, grid or legend (expected for this type).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; the label tile stays off-white (#FAF8F1), as the spec permits, so the bars keep scan contrast.
