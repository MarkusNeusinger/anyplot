review:
  strengths:
  - Real ISO/IEC 15417 Code 128 Subset B symbol table with a correct modulo-103 checksum,
    not an approximate mockup — the pattern would actually scan if printed
  - Correct ANSI/ISO minimum quiet zones (10 modules) on both sides plus Start B and
    Stop patterns per spec
  - Run-length-encodes the bit string into stacked BarChart segments so bar widths
    are geometrically exact, not visually approximated
  - 'Clean, minimal-chrome layout: axes/legend/tooltip fully hidden, generous whitespace,
    monospaced human-readable text with realistic letter-spacing below the bars'
  - Title and human-readable label are legible with explicit font sizes in both themes;
    bars use the theme-adaptive ink token with a documented rationale (structural
    ink, not categorical data) so the barcode still reads correctly on both surfaces
  weaknesses:
  - 'The Attempt-1 repair added a caption div ("Code 128 · Subset B (full ASCII, ANSI/ISO
    quiet zones)") but never renders it: muix.tsx:70 computes `chartHeight = SIZE.height
    - PADDING*2 - TITLE_H - LABEL_H - CAPTION_H - GAP` subtracting GAP only once,
    even though the JSX places two separate GAP spacer divs (title→chart and chart→label).
    Total content height (804 CSS px) exceeds the 780 CSS px available, so the caption
    is squeezed out of the visible frame — confirmed by pixel-scanning both plot-light.png
    and plot-dark.png: the last non-background row is y=1616 of 1800, and no caption
    text appears anywhere below the human-readable label in either render. Fix: change
    `GAP` to `GAP * 2` in the chartHeight formula so all six stacked elements (title,
    gap, chart, gap, label, caption) fit the available height.'
  - As a direct side effect of the same bug, the bottom whitespace (~184px) is noticeably
    larger than the top padding (~60px), so the composition reads slightly bottom-heavy
    instead of symmetric.
  - Only demonstrates Subset B; the spec mentions Code 128's dynamic A/B/C subset
    switching but a single static example reasonably only needs to show one — not
    a real defect, just unexplored breadth
  - No visual hierarchy or storytelling beyond the barcode pattern itself — expected
    for this plot type, keeps DE-03 at its default
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (verified pixel value 250,248,241 uniformly outside the bars).
      Chrome: title "barcode-code128 · javascript · muix · anyplot.ai" in dark ink, top-left, clearly legible. Human-readable text "SHIP-2024-ABC123" centered below the barcode in monospaced, letter-spaced dark ink.
      Data: barcode bars rendered as solid near-black (#1A1A17 ink) vertical bars of varying width against the off-white background, with visible quiet zones on both sides — high contrast, easy to distinguish bar/space widths.
      Note: the intended caption line ("Code 128 · Subset B (full ASCII, ANSI/ISO quiet zones)") added in the Attempt-1 repair does not appear anywhere in the render — confirmed by pixel scan (no non-background pixels below y=1616 of 1800).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 (verified pixel value 26,26,23 uniformly outside the bars).
      Chrome: title and human-readable text rendered in light ink (#F0EFE8), clearly legible against the dark background — no dark-on-dark issue.
      Data: barcode bars rendered as light/cream (#F0EFE8) vertical bars against the dark background — data widths/pattern identical to the light render; only the ink color flipped per the theme token, a documented structural-ink design choice rather than a categorical Imprint palette color.
      Note: same missing-caption issue as the light render — no content renders below the human-readable label.
      Legibility verdict: PASS
