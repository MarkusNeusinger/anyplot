review:
  strengths:
  - Real ISO/IEC 15417 Code 128 Subset B symbol table with a correct modulo-103 checksum,
    not an approximate mockup — the pattern would actually scan if printed
  - Correct ANSI/ISO minimum quiet zones (10 modules) on both sides plus Start B and
    Stop patterns per spec
  - Run-length-encodes the bit string into stacked BarChart segments so bar widths
    are geometrically exact, not visually approximated
  - Bars use the theme-adaptive ink token instead of the brand-green Imprint position,
    with a documented rationale (barcode ink is structural, not categorical data)
    — correct domain call that keeps the barcode looking like a real barcode in both
    themes
  - 'Clean, minimal-chrome layout: axes/legend/tooltip fully hidden, generous whitespace,
    monospaced human-readable text with realistic letter-spacing below the bars'
  - Human-readable text and title are legible with clear contrast in both light and
    dark renders
  weaknesses:
  - Only demonstrates Subset B; the spec mentions Code 128's dynamic A/B/C subset
    switching but a single static example reasonably only needs to show one — not
    a real defect, just unexplored breadth
  - Dark render inverts to light bars on a dark background rather than literal black-on-white;
    acceptable as a theme-adaptive design choice for a catalog visualization (not
    a physical label), but worth flagging since the spec's 'high contrast black bars
    on white background for maximum scan reliability' note is framed around print/scan
    reliability
  - No visual hierarchy or storytelling beyond the barcode pattern itself — expected
    for this plot type, but keeps DE-03 at its default
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: title "barcode-code128 · javascript · muix · anyplot.ai" in dark ink, top-left, clearly legible. Human-readable text "SHIP-2024-ABC123" centered below the barcode in monospaced, letter-spaced dark ink.
      Data: barcode bars rendered as solid near-black (ink) vertical bars of varying width against the off-white background, with visible quiet zones on both sides — high contrast, easy to distinguish bar/space widths.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title and human-readable text rendered in light ink, clearly legible against the dark background — no dark-on-dark issue.
      Data: barcode bars rendered as light/cream vertical bars against the dark background — an inverted but internally consistent high-contrast rendering (data widths/pattern identical to the light render; only the ink color flipped per the theme token, which is a documented, intentional structural-ink design choice rather than a categorical Imprint palette color).
      Legibility verdict: PASS
