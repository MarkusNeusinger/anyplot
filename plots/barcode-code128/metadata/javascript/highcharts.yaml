review:
  strengths:
  - 'Correct Code 128 Subset-B encoding: accurate element-width table, modulo-103
    check digit calculation, proper Start-B/Stop symbols, and a compliant >=10-module
    quiet zone on both sides'
  - Human-readable text rendered below the bars per the spec's Notes, using a letter-spaced
    monospace font for clarity
  - Fully deterministic, dependency-free implementation that respects the JS harness's
    mount-node contract (animation disabled everywhere, no explicit width/height,
    credits disabled, transparent chart background)
  - Realistic, spec-matching example content (SHIP-2024-ABC123)
  weaknesses:
  - 'Rounded-corner artifact on merged bars: Highcharts'' default column borderRadius
    is not overridden, so multi-width barcode modules (adjacent same-color 1-unit
    columns) show a scalloped/notched top instead of one flat rectangular block. Add
    borderRadius: 0 to plotOptions.column (alongside the existing borderWidth: 0)
    to render crisp, flat-topped bars.'
  - 'Dark-mode contrast inversion breaks the spec''s scan-reliability requirement:
    the bars are colored with t.ink, which flips to a light color in dark theme, producing
    light bars on a near-black background instead of the required high-contrast black-on-white.
    Render the barcode itself with a fixed black-on-white (or near-white) surface
    so the encoded pattern keeps constant ink/background polarity in both themes,
    while only the surrounding chrome (title, human-readable label, page background)
    adapts via theme tokens.'
  - Only demonstrates Subset B; never exercises the subset A/C switching the spec's
    Description highlights as a defining Code 128 characteristic. Not required by
    the spec's Data section (subset is optional), but a missed opportunity for feature
    coverage / library mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title "barcode-code128 · javascript · highcharts · anyplot.ai" in bold dark text above the bars; human-readable content "SHIP-2024-ABC123" in letter-spaced monospace below the bars. Both fully readable.
      Data: black (near-#1A1A17) vertical bars on the light background, with white quiet zones on both sides. Zoomed inspection shows bar tops have small rounded-corner notches where adjacent same-color modules meet, instead of one flat rectangular top (Highcharts default column borderRadius not overridden).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title and human-readable text render in light ink (t.ink/t.inkSoft), fully readable against the dark background - no dark-on-dark chrome failure.
      Data: bars are colored via t.ink, which flips to a light/cream color in dark theme, so the barcode itself renders as light bars on a dark background - the inverse polarity of the light render's black-on-white bars. Same rounded-corner notch artifact present at bar tops. Bar positions (which modules are "on") are identical to the light render as expected; only ink/background polarity is wrong for a scannable barcode.
      Legibility verdict: PASS for chrome text; FAIL for barcode scan-reliability requirement (spec requires high-contrast black bars on white background, not achieved here)
