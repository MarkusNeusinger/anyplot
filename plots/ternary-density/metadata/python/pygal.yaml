review:
  strengths:
  - 'Density surface uses imprint_seq (#009E73 -> #4467A3) with a High/Low colorbar,
    identical data colors in both themes'
  - Smooth KDE raster clipped to the triangle with a clipPath, so no density color
    leaks past the edges
  - Contours at 20/40/60/80 % of the peak in a light line follow the same KDE surface
    and close around the coffee and soda peaks
  - pygal XY chart with a themed Style draws triangle, dashed ternary grid and contour
    series; the pixel scale is calibrated so the triangle is equilateral
  - Flavor-profile scenario with three distinct drink groups gives two peaks and an
    edge ridge
  weaknesses:
  - 'VQ-05 (both): about 400 px of empty canvas between the title and the Bitter vertex
    label, while the colorbar''s High label ends about 15 px from the right canvas
    edge → shift the triangle and colorbar up and pull the colorbar left by about
    80 px so margins balance. Likely cause: Y_PAD=0.16 with margin_top=40 and cb_x
    = px_x(1) + 190.'
  - 'CQ-01 (code): eight helper functions (to_xy, level_segments, build, calibrate,
    px_x, px_y, loc_x, loc_y) break the linear script structure → inline the coordinate
    conversions and the chart build. Likely cause: the calibration loop and the contour
    chaining wrapped in functions.'
  - 'Suggestion: the ~45-line marching-squares and segment-chaining block (lines 88–132)
    could shrink if a contouring utility becomes available.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 2400x2400.
