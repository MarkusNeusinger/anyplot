review:
  strengths:
  - Density is computed with scipy gaussian_kde on a 300x300 grid in Cartesian ternary
    coordinates and drawn with a single bokeh image glyph; points outside the triangle
    become NaN and render transparent through LinearColorMapper nan_color, so no density
    color leaks beyond the edges
  - The imprint_seq ramp is built natively with bokeh.palettes.interp_palette and
    shared by the image and the ColorBar titled 'Relative density', so high density
    (blue) is readable from the bar
  - The 10 % ternary grid is one multi_line over a ColumnDataSource, three line families
    parallel to the sides and clipped to the triangle, and it stays visible over the
    dense blue peaks in both themes
  - Equal data units per pixel on both axes keep the triangle truly equilateral and
    centred on the 3200x1800 canvas
  - Realistic sand/silt/clay sediment scenario with three distinct clusters (sandy,
    silty, clayey) shows multiple density modes
  weaknesses:
  - 'VQ-01 (both): the edge tick labels (20 %–80 %) and the color bar labels are set
    at 28pt, below the 34pt tick baseline of the bokeh library prompt, and blur in
    the 400 px thumbnail → 34pt (+6pt). Likely cause: text_font_size="28pt" on the
    edge Labels and major_label_text_font_size="28pt" on the ColorBar.'
  - 'Suggestion: contour lines at a few relative-density levels (for example 0.4,
    0.6, 0.8) would make the three peaks easier to read against the low-contrast green-to-blue
    ramp, as the Notes suggest.'
  - 'Suggestion: a HoverTool reporting the Sand/Silt/Clay shares and the relative
    density under the cursor would add value in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no seam.
      Chrome: title "Sediment Composition · ternary-density · python · bokeh · anyplot.ai" centred at top in dark ink; bold vertex labels Clay (apex), Sand (bottom left), Silt (bottom right); 20/40/60/80 % tick labels along all three edges in soft dark grey; color bar on the right titled "Relative density" with ticks 0–1. All readable.
      Data: equilateral triangle filled with a smooth KDE surface in imprint_seq (brand green #009E73 for low density, blue #4467A3 for peaks); three peaks near the Sand corner (~75 % sand), the Silt corner and high Clay near the right edge; thin dark ternary grid at 10 % steps visible over the density; dark-grey triangle outline. No density outside the triangle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
