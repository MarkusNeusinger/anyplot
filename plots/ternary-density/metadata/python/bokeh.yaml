review:
  strengths:
  - Density is a smooth 300x300 gaussian_kde surface drawn with a single p.image raster;
    LinearColorMapper(nan_color=transparent) masks it exactly to the triangle, so
    no color spills past the edges
  - Three sediment clusters (sandy, silty, clayey) read as three distinct peaks near
    their vertices, matching the generated compositions
  - The ternary grid at 10 % steps is built as one ColumnDataSource-backed multi_line,
    its three line families parallel to the sides, ending on the edges and still visible
    over the densest areas in both themes
  - imprint_seq ramp with a 'Relative density' ColorBar makes clear that blue is high
    density; chrome threads INK / INK_SOFT / PAGE_BG tokens so both themes read cleanly
  - 'Clear type hierarchy: bold 44pt vertex labels, 28pt soft-ink edge percentages,
    normal-weight 50pt title'
  weaknesses:
  - 'VQ-05 (both): the triangle sits left of center with an empty band of about 530
    px between its right vertex label ''Silt'' and the color bar, while the title
    is centered over the full width → tighten the horizontal range so the triangle
    and the color bar share the width evenly (about −0.15 data units on the right
    of x_range). Likely cause: x_range=(-0.32, 1.32) with match_aspect=True plus the
    color bar placed on the far right.'
  - 'CQ-04 (code): lines 28–32 interpolate the 256-stop imprint_seq ramp by hand with
    numpy and string formatting → bokeh.palettes.interp_palette(("#009E73", "#4467A3"),
    256) computes the same list in one call. Likely cause: the IMPRINT_SEQ256 list
    comprehension.'
  - 'Suggestion: tie each set of edge percentages to its component (small edge captions
    such as ''Sand %'' along the left edge, or ticks angled along the grid lines they
    label), since a left-edge label sits where both a Clay line and a Sand line meet.'
  - 'Suggestion: a HoverTool on the density image showing Sand/Silt/Clay shares under
    the cursor would add value to the HTML view (tools="" currently disables all interactivity).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white frame seam.
      Chrome: title "Sediment Composition · ternary-density · python · bokeh · anyplot.ai" centered in dark ink; bold vertex labels Sand (bottom left), Silt (bottom right), Clay (apex); 20/40/60/80 % labels in soft gray along all three edges; vertical color bar on the far right titled "Relative density", ticks 0–1. All text readable.
      Data: equilateral triangle filled with a smooth imprint_seq density (brand green #009E73 at low density → blue #4467A3 at peaks); three peaks: sandy corner (~80 % sand, strongest), silt-rich lower right, clay-rich upper right edge. Thin dark ternary grid lines at 10 % steps visible over the whole surface; no color outside the triangle. Large gap between the triangle and the color bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and vertex labels in light ink, edge percentages and color-bar ticks in light gray, triangle outline light gray. No dark-on-dark text.
      Data: identical density colors and peak positions as the light render; grid lines now light and translucent, still visible over the blue peaks.
      Legibility verdict: PASS
