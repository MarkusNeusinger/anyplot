review:
  strengths:
  - 'Builds the ternary density with plotnine''s grammar alone: a bilinear-interpolated
    geom_raster over a scipy gaussian_kde grid, page-coloured polygon masks that keep
    density and contours inside the triangle, geom_segment grid lines and geom_text
    ticks, with coord_fixed holding the triangle equilateral'
  - Contour lines at 20/40/60/80 % of peak density are traced from the same density
    surface (contourpy) and drawn in the page colour, so they read as light cut lines
    on light and dark cut lines on dark and stay readable against the green-to-blue
    ramp in both themes
  - 'imprint_seq (#009E73 → #4467A3) via scale_fill_gradient, with a horizontal colour
    bar labelled Low/Medium/High that states which end is high density'
  - Ternary grid every 20 % in all three directions sits on top of the density at
    low alpha, stays visible inside the peaks and is clipped at the triangle edges;
    each edge carries its own tick values placed at the grid lines' outer ends
  - Realistic sediment scenario (sand/silt/clay, 1,050 samples in three textural clusters)
    normalised to 100 %, seeded, and adaptable through the named column constants
  weaknesses:
  - 'Suggestion: name the component each edge''s tick values read (for example a small
    rotated ''Sand (%)'' along the left edge) so readers unfamiliar with ternary conventions
    can tell which scale belongs to which edge.'
  - 'Suggestion: a slightly larger colour bar title and labels would balance the bold
    vertex labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: bold near-black title "ternary-density · python · plotnine · anyplot.ai" centred at top (~75 % width); bold vertex labels "Clay (%)" (top), "Sand (%)" (bottom-left), "Silt (%)" (bottom-right); grey tick values 20/40/60/80 along each of the three edges; dark-grey triangle outline; horizontal colour bar at the bottom titled "Relative density" with Low/Medium/High labels. All text readable.
      Data: equilateral triangle filled with a smooth density surface in imprint_seq — brand green #009E73 where density is low, shading to blue #4467A3 at three peaks (sand-rich bottom-left, silt-rich bottom-right, clay-rich upper right). Four off-white contour rings per peak at 20/40/60/80 % of peak density, cut off at the triangle edges. Thin dark grid lines at 20 % steps parallel to all three sides, visible over the density. No colour outside the triangle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and vertex labels in light #F0EFE8, tick values and colour-bar labels in light grey, light-grey triangle outline. No dark-on-dark text anywhere.
      Data: identical density colours (#009E73 → #4467A3) and peak positions as the light render; contour lines flip to near-black and grid lines to light, both clearly visible over the green/blue surface.
      Legibility verdict: PASS
