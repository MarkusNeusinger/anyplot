review:
  strengths:
  - Smooth KDE surface (scipy gaussian_kde, Scott bandwidth) drawn with geom_raster
    at 360 cells across, with contours from lets-plot's geom_contour on the same surface
  - 'Current imprint_seq fields ramp with its own stops per theme: mint to dark violet
    on light, dark olive to pale blue on dark, so the peaks stand out in both'
  - Density normalized to its peak so the 25/50/75 % contours line up with the colorbar
    ticks
  - Translucent white ternary grid stays visible over the peaks and harmonizes with
    the white contours
  - 'Clean triangle edges: a page-colored frame polygon masks raster cells beyond
    the outline, and no panel frame clutters the page'
  - layer_tooltips on near-invisible sample points gives per-sample Sand/Silt/Clay
    percentages in the interactive HTML
  weaknesses:
  - 'Suggestion: percentage tick labels along the triangle edges (20/40/60/80 %) would
    let readers read compositions off the static PNG.'
