review:
  strengths:
  - Smooth KDE surface (scipy gaussian_kde, Scott bandwidth) drawn with geom_raster
    at 360 cells across, with contour lines from lets-plot's geom_contour on the same
    surface
  - 'Full imprint_seq FIELDS ramp with its own stops per theme: light mint-to-navy
    on the light page, dark-green-to-pale-blue on the dark page, so the peaks stand
    out in both'
  - Density normalized to its peak so the 25/50/75 % contours line up with colorbar
    ticks
  - Translucent white ternary grid stays visible over the peaks and harmonizes with
    the white contours
  - One-panel gggrid paints the page color across the whole fixed-aspect canvas; theme
    tokens thread through title, vertex labels, outline and legend
  - layer_tooltips on near-invisible sample points gives per-sample Sand/Silt/Clay
    percentages in the interactive HTML
  weaknesses:
  - 'SC-02 (both): along the two slanted triangle edges the raster cells form a dotted,
    sawtooth fringe of density color just outside the outline, breaking C2 (no density
    color beyond the edges, smooth rather than tiled) → a clean edge with no cell
    poking past the outline. Likely cause: the inside mask keeps cells within one
    margin of the edge (margin = 2*SQRT3_2/GRID_RESOLUTION), and the size=1.6 geom_path
    does not cover their outer corners; clip at the exact edge and widen the outline,
    or mask with a page-colored polygon outside the triangle.'
  - 'Suggestion: percentage labels on the ternary grid lines (20/40/60/80 %) would
    let readers read compositions off the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, no strips.
      Chrome: bold dark title 'Sediment Composition · ternary-density · python · letsplot · anyplot.ai' (~85 % width); bold dark vertex labels Clay (top), Sand (bottom-left), Silt (bottom-right); thick dark triangle outline; framed horizontal colorbar 'Relative density (peak = 1)' with ticks 0.2-1 below. All readable.
      Data: smooth density surface on the imprint_seq light field stops, light mint (#66E2B2) in the low-density interior through #009E73 and #4467A3 to navy #002850 at the three peaks near the Sand, Silt and Clay corners; white contours at 0.25/0.5/0.75 closed around the peaks or ending at the edges; translucent white ternary grid every 20 % visible over the peaks. A faint sawtooth fringe of density cells pokes out along the slanted edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title, vertex labels and triangle outline in light ink #F0EFE8; legend box elevated #242420 with light title and soft-grey ticks. No dark-on-dark text.
      Data: density uses the dark field stops (#00573D low -> #009E73 -> pale blue #CDD9FF at the peaks), as a continuous ramp should; contours and grid white as in light. Same sawtooth fringe along the slanted edges.
      Legibility verdict: PASS
