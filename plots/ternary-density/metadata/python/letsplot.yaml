review:
  strengths:
  - Smooth density surface via geom_raster at 360 cells across, confined to the triangle,
    with contour lines computed by lets-plot's geom_contour from the same surface
  - 'imprint_seq ramp (#009E73 -> #4467A3) with a wide horizontal colorbar in relative
    units whose ticks line up with the 25/50/75 % contour levels'
  - Ternary grid drawn in translucent white stays visible over the peaks and harmonizes
    with the contours
  - Theme tokens thread through title, vertex labels, outline and legend; both renders
    read cleanly
  - layer_tooltips on invisible sample points gives per-sample Sand/Silt/Clay percentages
    in the interactive HTML
  weaknesses:
  - 'VQ-03 (both): along the two slanted triangle edges the raster cells leave a stair-step
    seam that shows as a dotted fringe of page-colored specks just inside the outline
    → a clean, continuous edge between density and outline. Likely cause: cells kept
    by a centre-inside test leave half-cell gaps that the size=1.2 geom_path does
    not cover; widen the outline or keep cells whose area overlaps the triangle.'
  - 'CQ-04 (code): lines 79-88 write the Gaussian KDE out by hand (Scott bandwidth,
    separable kernel matrices) → scipy.stats.gaussian_kde(points[[''x'',''y'']].T.to_numpy())(np.vstack([X.ravel(),
    Y.ravel()])). Likely cause: hand-rolled kernel instead of the available SciPy
    call.'
  - 'Suggestion: percentage labels on the ternary grid lines (20/40/60/80 %) would
    let readers read compositions off the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (2400x2400 square); thin transparent strip at the very top and bottom edge from the export.
      Chrome: bold dark title 'Sediment Composition · ternary-density · python · letsplot · anyplot.ai' at top (~85 % width); bold dark vertex labels Clay (top), Sand (bottom-left), Silt (bottom-right); dark triangle outline; horizontal colorbar 'Relative density (peak = 1)' with ticks 0.2-1 in a framed legend box below. All readable.
      Data: smooth density surface from brand green #009E73 (low) to blue #4467A3 (high) filling the triangle; three peaks near Sand, Silt and Clay corners; white contour lines at 0.25/0.5/0.75 closed around the peaks or ending at the edges; translucent white ternary grid every 20 % visible over the peaks. Slight dotted seam along the slanted edges.
      Legibility verdict: PASS

