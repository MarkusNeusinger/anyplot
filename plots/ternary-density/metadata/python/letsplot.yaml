review:
  strengths:
  - Smooth KDE surface (scipy gaussian_kde, Scott bandwidth) drawn with geom_raster
    at 360 cells across, with contour lines from lets-plot's geom_contour on the same
    surface
  - 'Full imprint_seq FIELDS ramp with its own stops per theme: mint-to-navy on the
    light page, dark-green-to-pale-blue on the dark page, so the peaks stand out in
    both'
  - Density normalized to its peak so the 25/50/75 % contours line up with colorbar
    ticks
  - Translucent white ternary grid stays visible over the peaks and harmonizes with
    the white contours
  - 'Clean triangle edge: a page-colored frame polygon masks the raster cells beyond
    the outline, so no density color leaks past the edges'
  - layer_tooltips on near-invisible sample points gives per-sample Sand/Silt/Clay
    percentages in the interactive HTML
  weaknesses:
  - 'DE-02 (both): a four-sided grey rectangle (INK_SOFT-like) frames the whole panel
    around the triangle although a ternary plot has no axes that need it — all four
    spines where nothing requires them → no frame, the page color right up to the
    vertex labels. Likely cause: panel_background=element_rect(fill=PAGE_BG) inherits
    the theme''s rect border color; give it color=PAGE_BG or blank the border.'
  - 'Suggestion: percentage tick labels along the triangle edges (20/40/60/80 %) would
    let readers read compositions off the static PNG.'
  - 'Suggestion: drop the legend box''s INK_SOFT border; the elevated fill alone separates
    the colorbar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas; a thin grey rectangle frames the panel.
      Chrome: bold dark title 'Sediment Composition · ternary-density · python · letsplot · anyplot.ai' (~85 % width); bold dark vertex labels Clay (top), Sand (bottom-left), Silt (bottom-right); thick dark triangle outline; framed horizontal colorbar 'Relative density (peak = 1)' with ticks 0.2-1 below. All readable.
      Data: smooth density surface on the imprint_seq light field stops, light mint in the low-density interior through #009E73 and #4467A3 to navy #002850 at the three peaks near the Sand, Silt and Clay corners; white contours at 0.25/0.5/0.75 closed around the peaks or ending at the edges; translucent white ternary grid every 20 % visible over the peaks. The slanted edges are clean, no density color outside the outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas; thin grey panel rectangle as in light.
      Chrome: title, vertex labels and triangle outline in light ink #F0EFE8; legend box elevated #242420 with light title and soft-grey ticks. No dark-on-dark text.
      Data: density uses the dark field stops (#00573D low -> #009E73 -> pale blue #CDD9FF at the peaks), as a continuous ramp should; contours and grid white as in light; same three peaks and contour shapes.
      Legibility verdict: PASS
