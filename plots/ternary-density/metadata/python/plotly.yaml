review:
  strengths:
  - KDE computed in Cartesian triangle coordinates with scipy gaussian_kde and mapped
    back to sand/silt/clay, so the three modes sit at the generated cluster compositions
  - Smooth, gap-free density surface confined to the triangle using imprint_seq, with
    a 'Relative density' colorbar labelled low/high
  - Ternary grid drawn above the fill in a light tint, so all three sets of lines
    stay visible over high density in both themes
  - Native go.Scatterternary subplot with sum=100 and a composition hovertemplate
    for the HTML view
  - Theme tokens threaded through title, axes, ticks and colorbar; both renders fully
    legible
  weaknesses:
  - 'VQ-02 (both): the closing parenthesis of the ''Silt (%)'' axis title touches
    the rotated ''100'' tick label at the bottom-left vertex (0 px gap) → keep at
    least 4 px between them (+4 px). Likely cause: baxis tickangle=45 with the default
    title position and the tight margin l=60.'
  - 'CQ-01 (code): a helper function `to_ternary()` (lines 81-86) wraps a three-line
    coordinate conversion used once, and recomputes `total`, which line 123 computes
    again → inline the conversion at its call site and compute `total` once. Likely
    cause: def to_ternary.'
  - 'Suggestion: contour lines at a few density levels, which the Notes suggest, would
    make the three modes easier to read.'
  - 'Suggestion: a faint dashed line shows along the base edge where the square markers
    leave small gaps; slightly larger markers at the edge would hide it.'
