      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'Sediment Composition · ternary-density · python · matplotlib · anyplot.ai' in dark ink at the top; bold dark vertex labels Sand (bottom left), Silt (bottom right), Clay (top); muted gray edge ticks 20/40/60/80 on all three edges; italic soft-gray edge titles 'Sand (%)', 'Clay (%)' (rotated 60°) and 'Silt (%)' (rotated -60°); colorbar at right labelled 'Density' with 0.00-6.00 ticks. All readable.
      Data: equilateral triangle filled with the imprint_seq density surface, brand green #009E73 at low density to blue #4467A3 at the three peaks (sand-rich bottom left, silt-rich bottom right, clay-rich upper right); six white contour rings around each peak; dark dashed ternary grid visible over the density, inside the triangle. Wide empty bands above and below the triangle.
