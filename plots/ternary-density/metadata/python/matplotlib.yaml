review:
  strengths:
  - Correct ternary-to-Cartesian transform with three grid families at 20/40/60/80
    % and edge ticks that match them
  - Density drawn with the mandated imprint_seq ramp; white contour lines and a dashed
    half-alpha grid stay readable over it in both themes
  - 'Clear typographic hierarchy: bold vertex names, italic edge titles with units,
    muted edge ticks'
  - Colorbar on a dedicated cax centred on the triangle's height; theme tokens threaded
    through every text element
  - Exact 2400x2400 square canvas with no bbox_inches trimming
  weaknesses:
  - 'VQ-05 (both): the triangle and its labels span only about 70 % of the canvas
    height, leaving empty bands of about 230 px between the title and the Clay label
    and about 200 px below the ''Sand (%)'' edge title → shrink both bands to about
    80 px each so the triangle grows (+15 % height). Likely cause: ax.set_ylim(-0.2,
    SQ3H + 0.08) with the equal aspect inside fig.add_axes([0.0, 0.0, 0.84, 0.92])
    is width-limited, so the axes leave vertical slack.'
  - 'Suggestion: label two or three contour levels with ax.clabel so the white rings
    carry values.'
