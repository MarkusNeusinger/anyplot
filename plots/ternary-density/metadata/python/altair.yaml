review:
  strengths:
  - 'Density surface now uses the imprint_seq two-stop range (#009E73 to #4467A3)
    via alt.Scale(range=...), identical in both themes'
  - Ternary grid layered above the density at 0.3 opacity, so all three line sets
    stay visible over the peaks (C4)
  - 160x160 KDE grid with slightly overlapping mark_rect cells gives a smooth, untiled
    surface inside the triangle
  - 'Idiomatic Altair layering: shared alt.Scale objects across four layers, X2/Y2
    cell bounds, detail+order channels for the grid lines'
  - Correct ternary-to-Cartesian transform with Scott-bandwidth gaussian_kde; three
    peaks sit at the sandy, silty and clay-rich compositions
  weaknesses:
  - 'SC-02 (both): a dotted teal fringe of density cells shows just outside both slanted
    triangle edges, so density color is drawn beyond the edges (C2) → no density pixels
    outside the outline. Likely cause: the mask margin=0.004 together with the x2/y2
    cell overhang of dx*1.6 / dy*1.6 lets edge cells poke past the slanted sides.'
  - 'VQ-05 (both): the chart block (title to base labels) fills only about the middle
    70 % of the 2400 px height, leaving roughly 250 px empty above the title and 320
    px below the vertex labels → let the triangle fill more of the square (about +60
    px of inner view height). Likely cause: properties(width=440, height=440) with
    Y_DOMAIN [-0.1, 1.1] while the triangle only reaches 0.87, then centre-padded.'
  - 'Suggestion: contour lines at a few density levels, which the Notes suggest, would
    make the peaks easier to read on the green-blue ramp.'
