      Data: imprint_seq density fill from brand green #009E73 (low) to blue #4467A3 (high) with three peaks (sandy bottom-left, silty bottom-right, clay-rich upper right); near-black contour lines; dark triangle outline; faint grey ternary grid visible in the empty areas and faintly in the green, barely in the peaks; three rounded label boxes at the peaks
      Legibility verdict: PASS

