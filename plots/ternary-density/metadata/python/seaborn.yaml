review:
  strengths:
  - imprint_seq density surface with a Low/Medium/High colorbar, identical in both
    themes, clipped cleanly to the triangle
  - Two sns.kdeplot passes (filled levels plus line contours of the same KDE) with
    a triangle clip path give smooth contours that close around the peaks or end at
    the edges
  - Contour lines and the triangle outline use the theme ink, so they read against
    the ramp in both themes
  - Canvas exactly 2400x2400 via figsize=(6,6), dpi=400 without bbox_inches='tight'
  - Column constants and a df-only plot block make the script adaptable to a real
    soil table
  weaknesses:
  - 'SC-03 (both): the left-edge and right-edge tick labels both show the clay share
    (20-80 rising with height), so no edge carries a sand scale and sand shares cannot
    be read → along the left edge sand runs from 100 at the Sand vertex to 0 at the
    top, so label it with the sand share (80 at the 20 % height … 20 at the 80 % height).
    Likely cause: the second ax.text in the edge-label loop prints frac (the clay
    share) instead of 1 - frac.'
  - 'SC-02 (both): C4 — the ternary grid (alpha 0.25 at zorder 1) vanishes under the
    0.85-alpha density fill in the three peaks → keep the grid visible over high density,
    e.g. draw it above the fill at low alpha or lower the fill alpha. Likely cause:
    grid zorder=1 below the kdeplot fill at zorder=5 with alpha=0.85.'
  - 'VQ-05 (both): the content occupies the middle ~70 % of the square canvas, with
    an empty band of about 15 % above the title and ~10 % below the vertex labels
    → enlarge the axes so the triangle uses the vertical space (about +10 % height).
    Likely cause: ax.set_position([0.02, 0.03, 0.80, 0.86]) combined with set_aspect(''equal'')
    and ylim(-0.12, H+0.1) shrinking the drawn area vertically.'
  - 'Suggestion: the peak callout boxes sit right on the peak centers and hide the
    darkest blue; placing them beside the peaks would leave the maxima visible.'
  - 'Suggestion: IMPRINT_PALETTE is defined but never used; dropping it would shorten
    the script.'
