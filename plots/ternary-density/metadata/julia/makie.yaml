review:
  strengths:
  - Custom vector masking (poly! fills over the bounding-box corners) produces crisp
    diagonal triangle edges instead of the staircase artifact a rectilinear heatmap
    grid would leave.
  - Bimodal KDE correctly reflects the two synthetic facies (sand-rich and clay-rich
    clusters) baked into the data generation, giving the plot a clear visual story.
  - 'Theme-adaptive chrome is fully correct: background, ink, grid alpha, and contour-line
    color all flip between light/dark while the Imprint sequential colormap stays
    pixel-identical.'
  - Explicit bin edges (avoiding half-cell heatmap overhang) and explicit xlims!/ylims!
    (avoiding vertex-label clipping) show careful attention to Makie's specific rendering
    quirks.
  weaknesses:
  - Triangle occupies only ~45% of the landscape canvas width, leaving large empty
    margins on both sides — tightening the column sizing or axis fraction would better
    use the 1600x900 canvas.
  - Contour lines are unlabeled (no density values on the lines themselves); a viewer
    must rely solely on the colorbar to map contour levels to values.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target.
      Chrome: Title, vertex labels (Sand/Silt/Clay), and colorbar label/ticks all rendered in dark ink, clearly visible. Grid lines beneath the density layer are subtle but visible.
      Data: Green-to-blue Imprint sequential colormap (#009E73 -> #4467A3) shows two density modes (sand-rich, clay-rich), matching the two-facies data generation. Dark contour lines trace key density levels.
