review:
  strengths:
  - MASS::kde2d on Cartesian ternary coordinates with a triangle mask gives a smooth
    density confined to the triangle
  - geom_raster(interpolate = TRUE) renders a smooth surface rather than visible tiles
  - Theme tokens thread through all chrome; no dark-on-dark text
  - Percentage labels along the three edges give the ternary grid quantitative reference
  weaknesses:
  - 'AR-09, VQ-05 (both): the subtitle runs past the left canvas edge and its first
    letters (''Se'' of ''Sediment'') are cut off → keep the whole subtitle inside
    the canvas (shorter text or smaller size). Likely cause: 15 pt subtitle with plot.margin
    80 pt left/right on a 12 in canvas.'
  - 'VQ-05 (both): canvas is 3600x3600 px, off the 2400x2400 square target (+1200
    × +1200 px). Likely cause: ggsave width = 12, height = 12, dpi = 300 instead of
    6 × 6 in at 400 dpi.'
  - 'VQ-07 (both): the continuous density uses viridis → imprint_seq, scale_fill_gradient(low
    = "#009E73", high = "#4467A3"). Likely cause: scale_fill_viridis_c().'
  - 'Suggestion: the boxed facies labels are an annotation layer the spec does not
    ask for; the three peaks read without them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
      Chrome: title and bold vertex labels Sand/Silt/Clay in dark ink; percentage labels 20-80 % along the three edges in INK_SOFT; subtitle runs off the left canvas edge ('Se' of 'Sediment' missing); Density colour bar 1-6 on an elevated box
      Data: viridis density surface (purple low to yellow high) masked to the triangle, three peaks near each vertex, white contours, faint grid; boxed facies labels near each peak
      Legibility verdict: FAIL - subtitle clipped at the left canvas edge

    Dark render (plot-dark.png):
