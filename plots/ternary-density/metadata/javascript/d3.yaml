review:
  strengths:
  - Genuine ternary coordinate geometry (equilateral-triangle projection) computed
    correctly for all sample points, grid lines, and vertex labels
  - Uses d3.contourDensity for real browser-side KDE — the spec's core 'density overlay'
    requirement is implemented with the library's distinctive statistical-contour
    module, not faked
  - 'Imprint sequential colormap (#009E73 → #4467A3) applied correctly and identically
    across both themes; backgrounds and chrome are theme-correct in both renders'
  - Data is a realistic, neutral geoscience scenario (sand/silt/clay soil texture)
    matching the spec's own application list, normalized so components sum to 100%
  - Density legend is a proper gradient swatch with axis ticks and a 'Density' label,
    not just a bare color scale
  - Fully reproducible via a fixed-seed LCG (no dependency on browser Math.random)
  weaknesses:
  - Density band fill-opacity is 0.9, which is opaque enough to hide the ternary grid
    lines wherever density is present — the spec explicitly asks for grid lines to
    remain visible beneath the density layer 'with appropriate transparency'. Lower
    fill-opacity to roughly 0.65-0.75 (or draw the grid a second time above the density
    layer at low opacity) so the grid reads through the colored regions.
  - Noticeable blank gap between the triangle's right edge and the legend column,
    leaving whitespace unevenly distributed toward the right side of the canvas —
    tighten margin.right or move the legend closer to the triangle.
  - 'Design Excellence is solid but not yet top-tier: the single-hue sequential fill
    and default d3-axis legend ticks read as competent rather than distinctive; consider
    subtler grid contrast, refined legend typography, or a more deliberate visual
    hierarchy to push past ''good default''.'
  - Uses several helper functions (makeRng, sampleCluster, project) rather than a
    flat imports->data->plot script; justified by the coordinate-projection reuse,
    but still a deviation from the KISS single-pass structure preferred for simple
    implementations.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Soil Texture Composition · ternary-density · javascript · d3 · anyplot.ai" centered at top in dark ink, clearly legible. Vertex labels "Sand" (top), "Silt" (bottom-left), "Clay" (bottom-right) in bold dark text, well separated from the triangle edges. Faint grid lines are visible inside the triangle wherever no density fill is present; ticks and "Density" legend label on the right in dark/soft-ink text.
      Data: Three overlapping teal-to-blue kernel-density blobs positioned near the Sand vertex and along the Silt-Clay edge, showing three distinct compositional modes. Sequential colormap runs light green (low density) to blue (high density), matching the Imprint imprint_seq stops. Subtle darker outline strokes mark key density levels within each blob.
      Legibility verdict: PASS — all text (title, vertex labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, vertex labels, and legend as the light render, all rendered in light/off-white text, clearly legible against the dark background. Triangle frame and grid lines are light gray, faint but visible where not covered by density.
      Data: Same three density blobs, same green-to-blue color progression — confirmed identical to the light render (only chrome flipped, not data colors).
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/label/tick text is clearly visible against the near-black background.
