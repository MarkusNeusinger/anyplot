review:
  strengths:
  - Correct ternary-density plot type built via ECharts custom series (no native ternary
    support exists), with an accurate barycentric-to-Cartesian projection.
  - Correct Imprint sequential palette (t.seq) driving the KDE heatmap via visualMap,
    theme-adaptive chrome (title, vertex labels, colorbar text) correct in both light
    and dark renders.
  - Ternary grid lines at 20% intervals rendered beneath the density layer with appropriate
    transparency, exactly as the spec's Notes section requests.
  - 'Clean layout: canvas gate passed (square 2400x2400), no clipped or overlapping
    text in either render, deterministic seeded LCG RNG.'
  weaknesses:
  - The third density cluster (clay-rich, n=150, near the Clay vertex) is barely distinguishable
    from the ambient near-zero-density wash covering the rest of the triangle in both
    renders — the plot's core purpose is revealing all modes, and this one nearly
    disappears. Consider giving the smaller cluster more weight relative to sample-count
    normalization (e.g. per-cluster density normalization, or boosting minimum opacity
    contrast) rather than a single global maxDensity scale, or increasing its point
    count.
  - Contour lines at key density levels, suggested in the spec's Notes as an optional
    aid for interpretation, are not included — would strengthen readability of the
    density levels (minor, optional per spec wording).
  - Several small helper functions (baryToCart, cartToBary, clipToSimplex, gaussian,
    makeRng) are used; justified by the ternary math but reduces the flat top-to-bottom
    KISS structure typical of simpler implementations.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light-theme surface spec.
      Chrome: Title "Soil Texture Composition · ternary-density · javascript · echarts · anyplot.ai" is dark ink text, centered near the top, fully readable. Vertex labels "Sand" (top), "Silt" (bottom-left), "Clay" (bottom-right) are bold dark text, clearly legible. Triangle border is a solid dark stroke. Faint diagonal grid lines at 20% intervals are visible beneath the density layer. A vertical colorbar with "High"/"Low" labels sits at the right margin, text legible.
      Data: KDE heatmap fills the triangle using the Imprint sequential scale (pale green at low density, teal-blue toward high density). Two clear high-density blobs are visible — one near the Sand vertex, one lower-center toward Silt — plus a much fainter, low-contrast patch toward the Clay side that is difficult to distinguish from the ambient near-zero-density wash.
      Legibility verdict: PASS (all text readable; the faint third cluster is a data-visibility weakness, not a text-legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark-theme surface spec.
      Chrome: Title and vertex labels render in light/white text, clearly legible against the dark background — no dark-on-dark issues found. Triangle border uses a light stroke, grid lines are faintly visible beneath the density fill. Colorbar "High"/"Low" text is light-colored and legible.
      Data: Same Imprint sequential color stops as the light render (data colors identical, only chrome flipped, as required). The two prominent density blobs (Sand-adjacent and Silt-adjacent) are clearly visible; the third, smaller cluster near Clay remains faint and low-contrast, same as in the light render.
      Legibility verdict: PASS (all text readable; no dark-on-dark failures).
