review:
  strengths:
  - Correctly implements a genuine ternary-density plot via ECharts custom series
    with an accurate barycentric-to-Cartesian projection — ECharts has no native ternary
    chart type, and the custom `renderItem` + `api.coord`/`api.size` usage is a legitimate,
    non-workaround solution.
  - 'Successfully addressed the attempt-1 review weakness: density is now normalized
    per cluster to its own peak before combining (max across clusters), so all three
    modes (Sand-adjacent, Silt-adjacent, Clay-adjacent) read with comparable visual
    weight in both renders instead of the smallest cluster nearly disappearing.'
  - Correct Imprint sequential colormap (`t.seq`) driving the KDE heatmap via `visualMap`;
    theme-adaptive chrome (title, vertex labels, grid lines, colorbar text) verified
    correct in both light (#FAF8F1) and dark (#1A1A17) renders with no dark-on-dark
    or light-on-light issues.
  - Clean, deterministic, dependency-free implementation — fixed-seed LCG + Box-Muller
    for reproducibility, no imports, idiomatic mount-node contract with `chart.on('finished')`
    driving `window.__anyplotReady` for precise screenshot timing.
  weaknesses:
  - Vertical whitespace is unbalanced on the square canvas — the gap below the triangle
    (baseline to canvas bottom) is noticeably larger than the gap above it (title
    to triangle apex); tightening `grid.bottom` or growing the triangle would use
    the canvas more evenly.
  - Only a plain color-intensity heatmap is used for the density layer — the spec
    suggests 'consider showing contour lines at key density levels for easier interpretation';
    contour lines at 2-3 density thresholds would add a clearer visual read of mode
    boundaries (optional per spec wording, not a hard requirement).
  - Colorbar 'High'/'Low' labels are set at 14px — comfortably legible on the full-size
    render but worth double-checking at the ~400px mobile thumbnail scale.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), not pure white, not dark — matches the light-theme surface spec.
      Chrome: Title "Soil Texture Composition · ternary-density · javascript · echarts · anyplot.ai" renders in bold dark ink, centered, fully readable, not clipped. Vertex labels "Sand" (top), "Silt" (bottom-left), "Clay" (bottom-right) are bold dark text, clearly legible and well-positioned outside the triangle corners. Thin ternary grid lines at 20% intervals are faintly visible beneath the density fill. Colorbar "High"/"Low" text on the right is dark and legible against the light page background.
      Data: Density heatmap uses the Imprint sequential colormap (green -> blue) with opacity scaling by density. Three distinct clusters are visible: near the Sand vertex, near the Silt vertex, and near the Clay vertex — all three reach comparably deep blue at their peaks (the attempt-1 "faint third cluster" issue is resolved). Low-density regions show a faint uniform green wash across the rest of the triangle, which is expected KDE behavior, not a defect.
      Legibility verdict: PASS (all text readable, no light-on-light issues, grid lines visible beneath the density layer).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), not pure black, not light — matches the dark-theme surface spec.
      Chrome: Title and vertex labels render in white/light text, clearly legible against the dark background — no dark-on-dark issues found anywhere (title, vertex labels, colorbar text all confirmed readable). Triangle border and grid lines use a light stroke, faintly visible beneath the density fill, same 20% grid pattern as the light render.
      Data: Same Imprint sequential color stops as the light render — data colors are identical, only chrome (background, text, grid) flipped, as required. All three density clusters (Sand-, Silt-, and Clay-adjacent) are comparably visible, matching the light render's improved per-cluster normalization.
      Legibility verdict: PASS (no dark-on-dark failures; brand palette reads well on the dark surface).
