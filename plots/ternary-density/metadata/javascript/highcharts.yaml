review:
  strengths:
  - Correct, spec-faithful ternary density visualization built from first principles
    within Highcharts core's module constraints (no ternary/heatmap add-ons available)
  - Both light and dark renders pass the theme-readability checklist with identical
    data colors and fully legible chrome
  - Real interactivity via a native Highcharts tooltip on a subsampled hover layer,
    not a simulated overlay
  - Deterministic, seeded data generation; correct imprint_seq usage for single-polarity
    density
  weaknesses:
  - Banded density fill (per-cell average, N_BANDS=6) produces visibly blocky/pixelated
    edges to the color regions rather than a smooth gradient - increase grid resolution
    or interpolate colors continuously to raise visual refinement
  - Colorbar is unitless (High/Low) - acceptable for normalized density but a numeric
    relative-density scale could add more precision
  image_description: |-
    Light render (plot-light.png):
