review:
  strengths:
  - Density bubble layer is now correctly clipped to the ternary triangle path (ctx.clip()
    in beforeDatasetsDraw, restored and outline re-stroked in afterDatasetsDraw),
    fully resolving the boundary-bleed artifact flagged in the previous review.
  - Colorbar caption font size increased from 13px to 16px, improving the typographic
    hierarchy and mobile legibility flagged previously.
  - Creative, correct use of Chart.js's bubble chart type plus custom plugin hooks
    (beforeDatasetsDraw/afterDatasetsDraw/afterDraw) to implement a chart type the
    library has no native support for, without faking interactivity or reaching for
    another library.
  - 'Theme-adaptive chrome is fully correct in both renders: warm backgrounds, legible
    text, identical imprint_seq data colors across themes.'
  - Three realistic, well-separated sedimentology facies clusters (sandy shoreface,
    silty mid-shelf, clay-rich basin) produce a genuine multi-modal density surface
    with a clean simplex boundary.
  weaknesses:
  - Contour lines at 1-2 key density levels (explicitly suggested in the specification's
    Notes) were still not added — would sharpen the read of each facies mode's peak
    and further showcase Chart.js's plugin drawing capabilities.
  - Composition remains three separate, similarly-sized blobs; a stronger data-driven
    hierarchy (e.g. one visually dominant cluster) could deepen the storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "ternary-density · javascript · chartjs · anyplot.ai" in bold dark ink at top. Vertex labels "Sand" (bottom-left), "Silt" (bottom-right), "Clay" (top) in bold dark ink. Subtle grey ternary grid lines at the 20/40/60/80% levels, dark triangle outline framing the simplex. Sequential colorbar below the triangle captioned "Low density" / "High density" in soft dark ink at 16px (up from 13px in the previous attempt).
      Data: Three KDE density blobs using the imprint_seq gradient (#009E73 -> #4467A3): one skewed toward the Clay vertex, two along the Sand/Silt base. The density layer is now clipped to the triangle path — no bleed past the simplex boundary near the Clay vertex (the defect flagged in Attempt 1 is fixed).
