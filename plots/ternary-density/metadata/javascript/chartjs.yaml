review:
  strengths:
  - Creative, correct use of Chart.js's bubble chart type plus custom plugin hooks
    (beforeDatasetsDraw/afterDraw) to implement a chart type (ternary density) the
    library has no native support for, without faking interactivity or reaching for
    another library.
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, title/vertex labels/colorbar captions legible in both themes, Imprint
    imprint_seq gradient (#009E73 to #4467A3) identical across light and dark.'
  - Deterministic LCG-seeded data generation with three realistic, well-separated
    sedimentology facies clusters (sandy shoreface, silty mid-shelf, clay-rich basin)
    producing a genuine multi-modal density surface instead of a single generic blob.
  - 'Clean KISS code structure with no fake UI or fake interactivity, correct #container
    mount contract, animation disabled as required.'
  weaknesses:
  - Density bubbles bleed a small but visible amount past the black ternary triangle
    outline near the Clay vertex (top-right edge) in both renders — the heavily overlapping
    bubble radius (cellRadius = cellSpacingPx * 1.35) is not clipped to the triangle
    path, so density paint appears outside the valid compositional simplex and partially
    obscures the boundary line. Fix by clipping the bubble layer to the triangle path
    (ctx.save/clip with the triangle path before drawing the bubble dataset) or by
    shrinking/clamping cellRadius for grid cells adjacent to the simplex edge, then
    redraw the triangle outline stroke on top so it stays crisp.
  - Colorbar caption text ('Low density' / 'High density', 13px CSS) is noticeably
    smaller than the vertex labels (20px) and title (26px), creating a slight typographic
    imbalance and reduced legibility at mobile widths — bump it a couple of px for
    better hierarchy.
  - 'Design storytelling and library-mastery are solid but not top-tier: consider
    adding subtle contour lines at 1-2 key density levels (the specification explicitly
    suggests this) to sharpen the read of where each facies mode peaks, which would
    also push Library Mastery further into distinctive Chart.js-specific territory
    beyond the current plugin-overlay approach.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "ternary-density · javascript · chartjs · anyplot.ai" in bold dark ink, centered at top. Vertex labels "Sand" (bottom-left), "Silt" (bottom-right), "Clay" (top) in bold dark ink. A thin sequential green-to-blue colorbar sits below the triangle with "Low density" / "High density" captions in soft dark ink. Subtle light-grey ternary grid lines (at the 0.2/0.4/0.6/0.8 levels) are visible in the sparse regions of the triangle; a dark triangle outline frames the simplex.
      Data: Three distinct KDE density blobs inside the triangle, colored via the Imprint imprint_seq gradient (brand green #009E73 at low density fading to blue #4467A3 at peak density) — one cluster near the top (skewed toward the Clay-Silt edge), two clusters along the bottom (near Sand and near Silt/Clay-Sand midpoint). The blobs bleed a small amount past the triangle's right edge near the Clay vertex, slightly outside the valid simplex.
      Legibility verdict: PASS (all text is clearly readable against the light background; the boundary bleed is a data/rendering polish issue, not a text-legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Same title, vertex labels, and colorbar layout as the light render, now rendered in light ink (#F0EFE8/#B8B7B0-equivalent tones) — all clearly legible against the dark background, no dark-on-dark text anywhere. Grid lines and triangle outline are rendered in a light, subtle stroke, visible against the dark background.
      Data: Same three density clusters, same imprint_seq green-to-blue gradient and same positions as the light render — confirmed identical data colors between themes (only chrome flipped). The same small boundary-bleed artifact near the Clay vertex is present here as well.
      Legibility verdict: PASS (all text is clearly readable against the dark background; no dark-on-dark failures observed).
