review:
  strengths:
  - Sophisticated custom ternary-diagram implementation built entirely from MUI X's
    low-level primitives (ChartContainer, ScatterPlot, useXScale/useYScale/useDrawingArea
    hooks) — a genuinely distinctive use of the library's composability, since MUI
    X has no native ternary/simplex axis type
  - Gaussian KDE density surface is computed correctly on a triangular barycentric
    lattice and clipped precisely to the simplex boundary via an SVG clipPath
  - Theme-correct chrome in both light and dark renders; Imprint imprint_seq gradient
    (brand green -> blue) is identical across themes; a page-background-colored halo
    drawn behind the dashed reference grid keeps it visible even over the darkest
    density peaks
  - Clear vertex labeling (Sand/Silt/Clay), percentage tick labels on all three triangle
    edges, correct mandated title format, and a tooltip valueFormatter that surfaces
    exact Sand/Silt/Clay composition plus % of peak density per lattice cell
  - Deterministic, seeded data generation (fixed-seed LCG + Erlang-distributed Dirichlet-like
    clusters) with a realistic, neutral USDA soil-texture scenario (sand/silt/clay)
  weaknesses:
  - 'The three synthetic soil-texture clusters (sandy, loamy, clay-rich) are not equally
    visible in the rendered density heatmap: the tight sandy cluster near the Sand
    vertex reads as a strong, distinct blue hotspot, but the loamy cluster (n=220,
    the single largest class) and the clay-rich cluster (n=170) are only extremely
    faint tints, nearly indistinguishable from the plain-green baseline (sampled pixels:
    sand hotspot approx RGB(88,130,169) vs. loamy/clay centers approx RGB(53,157,145)/(61,151,150),
    essentially the same as the background green). This undercuts the plot''s core
    purpose of ''identifying clusters, modes, and patterns'' since a viewer only perceives
    one mode. Lower COLOR_GAMMA (currently 1.7) toward ~1.0-1.2, or renormalize so
    each cluster''s local peak reaches comparable color intensity, so all three modes
    read as visible hotspots.'
  - At close zoom, the discrete scatter markers used to approximate the continuous
    KDE surface create a faint hexagonal/scalloped 'quilted' texture rather than a
    perfectly smooth gradient, most visible on the density peak; increasing marker
    overlap relative to the GRID_N lattice spacing (larger markerSize or finer grid)
    would smooth this out
  - No contour lines at key density levels, which the specification explicitly suggested
    ('Consider showing contour lines...') for easier interpretation — optional, but
    would have helped communicate the secondary modes that the color encoding currently
    under-represents
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Soil Texture Density · ternary-density · javascript · muix · anyplot.ai" in bold dark ink at top, clearly readable. Bold "Sand" label above the triangle apex, "Silt" and "Clay" bold labels below the bottom-left/bottom-right vertices. Percentage tick labels (20/40/60/80%) run along all three triangle edges in medium-gray ink. A dashed reference grid (parallel to each edge) is visible under the density fill; a second higher-contrast dashed overlay keeps the grid visible over the density peaks. Below the triangle, a horizontal gradient legend bar ("Relative sample density", "Low"/"High") sits centered with generous whitespace beneath it.
      Data: A green-to-blue continuous fill covers the whole simplex (imprint_seq colormap). A clearly distinct blue hotspot sits near the Sand vertex (~70-80% sand). Two additional, much fainter blue-green tints are present near the triangle center (loamy composition) and lower-right area (clay-rich composition), but they are barely distinguishable from the surrounding green field.
      Legibility verdict: PASS — all text (title, vertex labels, tick labels, legend) is clearly readable against the light background, no overlap, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, vertex labels, and tick labels now rendered in light ink, clearly legible against the dark background. Grid lines and halo overlay remain visible using the same theme-adaptive dashed styling. Legend text and gradient bar are unchanged in shape, with light-colored "Relative sample density"/"Low"/"High" text.
      Data: The green-to-blue imprint_seq gradient is visually identical to the light render — same brand green at the low end, same blue at the high end. The same single dominant hotspot near the Sand vertex is visible; the loamy and clay-rich modes remain only faintly perceptible, matching the light render.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all chrome flipped correctly while data colors stayed constant between themes.
