review:
  strengths:
  - Hand-written Gaussian KDE evaluated on a 46-step barycentric grid and drawn through
    a MUI X ScatterPlot colored by a zAxis continuous colorMap, clipped to the triangle
    — a clean way to get a density surface from the community package, where Heatmap
    is Pro-only
  - Density is confined to the triangle via an SVG clipPath; three sets of dashed
    grid lines run parallel to the sides and stay inside the triangle
  - Grid lines are redrawn above the density with a page-colored halo, so the 20/40/60/80
    % grid stays readable through the peaks in both themes
  - Uses imprint_seq (t.seq[0] → t.seq[1]) for the density and a labelled Low → High
    color bar
  - Soil texture (sand/silt/clay) scenario with three realistic clusters (sandy, loamy,
    clay-rich) generated from a seeded LCG via Dirichlet sampling
  - Tooltip valueFormatter reports the composition and % of peak density for each
    cell in the interactive HTML
  weaknesses:
  - 'VQ-03 (both): the density surface has weak tonal range — the loamy (≈40/40/20)
    and clay-rich (≈55 % clay) modes are only faintly bluer than the green background,
    and only the sandy peak reads clearly → make all three modes distinguishable from
    the low-density floor (higher-contrast mapping, full opacity). Likely cause: COLOR_GAMMA
    = 1.7 pushes mid densities toward the low end, plus the 0.85 group opacity washing
    out the colors.'
  - 'VQ-07 (both): the density colors differ between themes — the 0.85 opacity on
    the density group blends the page background in, so the low end is a lighter green
    on #FAF8F1 and a darker green on #1A1A17 → identical data colors in both renders
    (opacity 1). Likely cause: `<g clipPath=... opacity={0.85}>` in DensityLayer.'
  - 'VQ-06 (both): the three edge tick scales (20–80 %) carry no indication of which
    component they measure, so a reader cannot tell whether the left-edge 80 % is
    Sand or Silt → label each edge with its component (e.g. ''Sand (%)'' along the
    left edge) or direction arrows. Likely cause: EdgeTicks renders bare percentages
    only.'
  - 'VQ-01 (both): edge tick labels and the Low/High color-bar labels at 13 px are
    small next to the 22 px vertex labels and blur in the 400 px thumbnail → about
    15–16 px (+2 to +3 px). Likely cause: fontSize={13} in EdgeTicks and DensityLegend.'
  - 'Suggestion: MUI X community ships a ContinuousColorLegend that reads the zAxis
    colorMap directly; it would replace the hand-built SVG gradient bar.'
  - 'Suggestion: contour lines at a few density levels (the Notes suggest them) would
    make the weaker loamy and clay-rich modes easier to locate.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: title "Soil Texture Density · ternary-density · javascript · muix · anyplot.ai" in dark ink at top (~56 % width); bold vertex labels Sand (top), Silt (bottom-left), Clay (bottom-right); 20/40/60/80 % tick labels in soft ink along all three edges; centred color bar "Relative sample density" with Low/High labels at the bottom. All readable.
      Data: equilateral triangle filled with a smooth imprint_seq density surface (#009E73 green floor → blue-violet peaks), clipped to the triangle; strongest peak near ~73 % sand, weaker modes near the centre-left (loam) and lower right (clay-rich); whitish dashed grid lines parallel to the three sides drawn over the density.
      Legibility verdict: PASS

