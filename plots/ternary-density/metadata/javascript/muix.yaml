review:
  strengths:
  - Fully custom ternary (barycentric → Cartesian) projection built from scratch on
    top of ChartContainer's low-level composition API — idiomatic, expert-level use
    of useXScale/useYScale/useDrawingArea since MUI X community has no native ternary
    chart type
  - Deterministic, realistic three-cluster soil-texture dataset (sandy/loamy/clay-rich)
    that correctly sums to 100% per sample and produces a believable multi-modal density
    surface instead of one generic blob
  - Theme-adaptive typography throughout (title, vertex labels, tick labels, legend)
    reads correctly in both light and dark renders with no dark-on-dark or light-on-light
    failures
  - Continuous colormap correctly uses Imprint's imprint_seq (green → blue) rather
    than the spec note's suggested viridis/plasma — correctly prioritizes the platform's
    palette rule over the spec's generic suggestion
  - Well-composed density legend (gradient bar + Low/High labels) placed close to
    the plot, and title format matches the mandated `{Descriptive Title} · {spec-id}
    · {language} · {library} · anyplot.ai` pattern
  weaknesses:
  - 'Spec requires ''grid lines should be visible beneath the density layer with appropriate
    transparency'', but in both renders the dashed reference grid (TriangleGrid) is
    effectively invisible — the 46-division density lattice (markerSize=13, flat opacity=0.88)
    fully occludes it everywhere, including in low-density regions near the vertices
    where the grid should read clearly through the sparse fill. Fix: make marker opacity/alpha
    proportional to normalized density (near-zero density → near-transparent marker)
    instead of a flat 0.88, so the grid shows through in low-density areas, or draw
    the grid as a second pass on top of the density layer with a stronger stroke.'
  - The KDE surface reads as a fairly uniform, low-contrast green field with only
    two-three soft blue patches, making the three underlying clusters (sandy/loamy/clay-rich)
    harder to distinguish than the data actually supports — steepen the density-to-color
    mapping (e.g. gamma/power normalization instead of linear before feeding zAxis
    min/max) or add faint contour lines at 2-3 density levels as the spec suggests,
    to sharpen the multi-modal structure at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "Soil Texture Density · ternary-density · javascript · muix · anyplot.ai" in dark ink sits above the triangle; "Sand" (bold, top apex), "Silt" (bottom-left), "Clay" (bottom-right) vertex labels in dark ink; 20/40/60/80% edge tick labels in medium-gray ink along all three edges, all outside the triangle body with no overlap; "Relative sample density" legend title + gradient bar + "Low"/"High" labels below the triangle. All text is clearly readable against the light background.
      Data: A continuous green-to-blue heatmap fills the entire triangle interior — the first/low end of the gradient is brand green (#009E73-consistent), rising to a muted blue (imprint_seq high end) in three soft, overlapping high-density patches (near the top-center, center, and lower-right of the simplex), consistent with the three sandy/loamy/clay-rich sample clusters. The dashed reference grid lines that TriangleGrid draws underneath the density layer are not visibly perceptible anywhere inside the triangle — the density fill (opacity 0.88, tightly packed lattice markers) fully occludes them, which is a real gap against the spec's explicit "grid lines should be visible beneath the density layer" requirement.
      Legibility verdict: PASS (all text elements readable; the grid-visibility issue is a feature/spec-compliance gap, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title, vertex labels, edge ticks, and legend, all rendered in light ink (near-white/light-gray) against the dark background — no dark-on-dark failures anywhere; every label is clearly visible.
      Data: Same green-to-blue gradient and same three density patches, in the same positions and same hex values as the light render — only the chrome (background, text, triangle outline) flips; the data colors are identical between themes as required. The same grid-invisibility issue is present here too.
      Legibility verdict: PASS (chrome contrast is correct in dark mode; the grid-visibility gap is a spec-compliance issue common to both renders, not a dark-mode-specific legibility failure).
