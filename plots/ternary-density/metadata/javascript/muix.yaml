review:
  strengths:
  - 'Composes the ternary density from community MUI X primitives: a ChartsContainer
    with a continuous zAxis colorMap built from the Imprint stops (t.seq) colors a
    ScatterPlot of KDE grid cells, clipped to the triangle by an SVG clipPath, so
    no density color leaks past the edges in either render'
  - Custom SVG layers read the chart's own scales through useXScale/useYScale/useDrawingArea,
    keeping the grid, edge ticks, edge titles, vertex labels and color bar registered
    to the data coordinates
  - Grid lines are redrawn above the density with a page-colored halo, so all three
    line families stay visible across the high-density blue peaks in both themes
  - 'Clear typographic hierarchy: bold 22 px vertex names, semi-bold edge titles with
    direction arrows toward 100 %, 16 px tick labels, all from theme tokens and readable
    in both renders'
  - COLOR_GAMMA = 0.8 lifts the weaker loamy and clay-rich modes off the floor so
    all three soil clusters read as separate peaks
  - Tooltip valueFormatter reports each cell's Sand/Silt/Clay composition and percent
    of peak density in the HTML view
  - 'Plausible soil-texture scenario: 580 samples in three Dirichlet-style clusters
    (sandy, loamy, clay-rich) from a fixed-seed LCG'
  weaknesses:
  - 'SC-02 (both): the density surface shows a faint scalloped, dotted texture where
    the 13 px circular scatter markers of the 46-step grid meet, most visible around
    the sandy peak near Sand 70–80 % → a smooth surface with no visible cell pattern.
    Likely cause: GRID_N = 46 with markerSize 13; raise GRID_N (about 80) and size
    the markers to overlap the cell spacing.'
  - 'CQ-04 (code): TriangleGrid draws the full set of 12 dashed grid segments (lines
    153–164) underneath the density layer, where they are completely covered, and
    GridOverlay draws the same segments again on top → delete the hidden grid map
    and keep only the triangle outline in TriangleGrid. Likely cause: grid moved above
    the density without removing the original copy.'
  - 'Suggestion: the → / ← glyphs in the edge titles render thin and small next to
    the semi-bold text; a heavier arrow glyph or an SVG marker would match the title
    weight.'
  - 'Suggestion: contour lines at a few density levels (the Notes suggest them) would
    make the three peaks easier to compare in the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241), square 2400x2400 canvas.
      Chrome: title "Soil Texture Density · ternary-density · javascript · muix · anyplot.ai" in dark bold text at the top (~56 % width); vertex names Sand (top), Silt (bottom-left), Clay (bottom-right) in bold dark ink; 20/40/60/80 % tick labels along all three edges in inkSoft; rotated edge titles "Sand (%) →", "Clay (%) →" and "← Silt (%)"; a dark triangle outline. All text readable.
      Data: an equilateral triangle filled with a continuous imprint_seq density surface (brand green #009E73 low → blue #4467A3 high), clipped to the triangle. Three peaks: a strong blue mode near Sand ~75 %, a ridge around Sand ~40 % / Silt ~40 %, and a clay-rich mode near Clay ~55 %. Light dashed grid lines with a cream halo run parallel to all three sides and stay visible on the peaks. A horizontal color bar below, "Relative sample density", Low → High. Faint dotted texture visible on close inspection of the peaks.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled 26,26,23).
      Chrome: title, vertex names, edge titles and tick labels switch to light ink / light inkSoft and are clearly readable; the triangle outline is light gray. No dark-on-dark text.
      Data: the density colors are identical to the light render (same green → blue ramp); the grid lines flip to dark dashed lines with a dark halo, still visible across the density. Color bar identical with light labels.
      Legibility verdict: PASS
