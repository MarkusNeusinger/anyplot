review:
  strengths:
  - 'Uses MUI X''s composition API (ChartsDataProvider + ChartsWrapper + ChartsSurface
    with LinePlot, ChartsGrid, ChartsReferenceLine, axes and legend), which gives
    control over layer order: the dashed 20% target line is drawn before LinePlot,
    so it sits behind the curves as the spec asks'
  - 'The optional recency encoding is done carefully: older cohorts get thinner, fainter
    strokes (1.75 to 3.25 px, opacity 0.75 to 1), recency comes from the parsed signup
    month, and per-series sx selectors carry each line''s width and opacity into its
    legend swatch, so the legend explains the encoding'
  - 'All spec requirements show: five cohorts all starting at 100% at week 0, a linear
    ''Weeks since signup'' axis (not calendar dates), a full 0–100% y axis with horizontal
    gridlines, and legend labels like ''Jan 2025 (n = 1,245)'''
  - 'The monotoneX interpolation smooths the curves without overshooting the weekly
    values, and the data is deterministic (a seeded LCG) and plausible: a steep early
    drop flattening to plateaus of 18–31%, with newer cohorts retaining better'
  - Theme tokens are used throughout (ink, inkSoft, grid, palette), so both renders
    are readable and the Imprint data colors are identical across themes; skipAnimation
    is set
  - A computed subtitle (cohort count, total users, last-week retention range) and
    a stripped axis frame (no axis lines or ticks) give a clean, clear hierarchy
  weaknesses:
  - 'Suggestion: the newest and best-retaining cohort (May 2025) falls on palette
    slot 5, the matte-red loss anchor. With five cohorts that is the canonical order,
    but readers may take the strongest curve as ''bad''.'
  - 'Suggestion: the x-axis band (height 64) leaves a wide gap between the tick labels
    and ''Weeks since signup''. About 48 would tie the axis title to its ticks.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title 'line-retention-cohort · javascript · muix · anyplot.ai' at top left (about 35% of the width), a soft-ink subtitle '5 cohorts · 6,200 users · 12 observations each · last-period retention 18.2% to 31.2%', a horizontal legend at top right, y-axis title 'Retained users (%)' with ticks 0%–100% every 10%, x-axis title 'Weeks since signup' with ticks 0–11, subtle horizontal gridlines, no axis lines or tick marks. All text is dark and readable.
      Data: five smooth lines all starting at 100% at week 0: Jan 2025 #009E73 (thinnest, faintest), Feb 2025 #C475FD, Mar 2025 #4467A3, Apr 2025 #BD8233, May 2025 #AE3030 (thickest). They decay steeply and flatten to about 18%, 21%, 25%, 27.5% and 31%. A dashed soft-ink line at 20% is labelled 'Target 20%' at the left, and Jan 2025 dips below it after week 7.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend text, axis titles and tick labels are light ink, all clearly readable; no dark-on-dark text. Gridlines are subtle but visible, and the dashed target line is light grey.
      Data: the same five hues as the light render, the same line widths and opacities; only the chrome flips. Brand green #009E73 stays visible, though the thin, faint Jan line is a little lower in contrast; it is still clearly visible.
      Legibility verdict: PASS
