review:
  strengths:
  - Clean idiomatic Makie code — hidedecorations!/hidespines! achieve genuine axis-free
    minimalism, with band!/lines!/scatter! used correctly for the layered line+fill+endpoint
    look
  - Correct theme adaptation — identical brand-green (#009E73) data color between
    light and dark renders, correct PAGE_BG/INK theme tokens, exact 3200x1800 canvas
    via px_per_unit=2
  - Realistic, neutral data (60-day SaaS daily-active-users random walk with plausible
    upward drift), reproducible via Random.seed!(42)
  - Mandated title format is exact and clearly legible in both themes
  weaknesses:
  - 'Compact aspect ratio is missing — this is a defining sparkline trait in the spec''s
    Notes (not marked ''Optional:'' like the highlight features are). The drawn squiggle''s
    vertical excursion (ylims padded by only y_range*0.65 on each side) spans roughly
    half the plot height, so the visible line reads as ~3:1, not the ''wide and short,
    typically 4:1 to 8:1'' the spec calls for. Fix: increase y_pad substantially (e.g.
    2.0-3.0x y_range instead of 0.65x) so the line occupies a much thinner horizontal
    band inside the fixed 3200x1800 canvas, or switch to a small-multiples layout
    (several thin stacked Axis rows) the way the reference matplotlib implementation
    (91/100) does.'
  - Optional min/max highlight dots and a first-point marker are omitted — only the
    last point is marked with a dot. The spec explicitly lists min/max and first/last
    highlighting as expected sparkline conventions, and the top-scoring matplotlib
    sibling implements both for a much richer read.
  - The band! ribbon (fixed width = y_range*0.06 below the line) reads as a faint
    shadow, not the spec's 'fill under line for area effect' (conventionally filled
    down to the series baseline/minimum) — it is barely visible at normal viewing
    size and could be mistaken for a rendering artifact rather than an intentional
    area fill.
  - Large expanse of empty canvas above and below the line with no other chart elements
    — combined with the aspect-ratio issue above, the result currently reads as a
    big minimalist line chart rather than a 'small, condensed' embeddable sparkline.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1), confirmed — not pure white, not dark.
      Chrome: title "sparkline-basic · julia · makie · anyplot.ai" centered near the top in dark ink (#1A1A17), fully readable, comfortable size. No axes, ticks, gridlines, or other chrome — correctly omitted per spec.
      Data: a single brand-green (#009E73) line (linewidth 3.5) traces a 60-point upward-drifting random walk, with a faint green ribbon/shadow beneath it and a filled green dot marking the final point. First/only series color is #009E73, confirmed. The line's vertical excursion covers roughly half the available plot height and spans the full canvas width, so the chart reads more like a full-bleed minimalist line chart than a compact, thin sparkline band.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black (#1A1A17), confirmed — not pure black, not light.
      Chrome: title in light ink (#F0EFE8), clearly readable against the dark surface. No dark-on-dark issues — no other chrome elements present.
      Data: identical to the light render — same brand-green line, ribbon, and endpoint dot; only the background/title ink flipped. Data colors unchanged between themes, confirmed.
      Legibility verdict: PASS

    Both renders are legible and correctly theme-adapted; the shortfall found is compositional (aspect ratio / proportional use of the canvas), not a legibility failure — see Weaknesses.
