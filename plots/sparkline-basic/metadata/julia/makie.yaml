review:
  strengths:
  - Area-fill-under-line + endpoint-dot convention (band! down to series minimum,
    hollow ring at day 1, brand-filled halo dot at day 60) is a recognizable, polished
    financial-sparkline pattern that goes beyond a bare line — good use of Makie's
    band! primitive.
  - 'Theme-adaptive chrome is fully correct: light background measures exactly #FAF8F1
    (250,248,241) and dark measures exactly #1A1A17 (26,26,23) at multiple sample
    points; data color (#009E73) is byte-identical between renders.'
  - 'True minimalism honored: hidedecorations!() + hidespines!() remove all axes/ticks/gridlines
    as the spec requires, and the title is the only chrome element.'
  - 'Realistic, neutral data: cumulative-sum-of-steps random walk for ''daily active
    users of a SaaS product'' produces a plausible mixed up/down trend with a clear
    plateau and dip, not a monotonic or noise-only series.'
  - 'Clean, idiomatic, reproducible code: Random.seed!(42), only used imports, no
    functions/classes, current size= (not deprecated resolution=) kwarg for the PNG
    save.'
  weaknesses:
  - 'The min/max highlight dots never render: pixel-scanned both plot-light.png and
    plot-dark.png at full resolution (tolerance ±40 on RGB) for IMPRINT_PALETTE[3]
    (#4467A3 blue, the idx_min marker) and IMPRINT_PALETTE[4] (#BD8233 ochre, the
    idx_max marker) and found zero matching pixels in either file. The two scatter!
    calls at lines ~63-70 execute but produce no visible output — likely markersize=16
    rendering under/behind the band+line fill, or a units/z-order issue specific to
    CairoMakie. This is dead code that silently fails; either fix the rendering (try
    a larger markersize, an explicit strokecolor=PAGE_BG halo like the endpoint markers
    use, or draw them after confirming z-order) or remove the two calls.'
  - 'The first-point marker (hollow ring: fill=PAGE_BG, strokewidth=2, strokecolor=BRAND)
    is visually indistinguishable from the line itself since the ring color matches
    the line color exactly — at the canvas scale it just reads as a slightly thicker
    patch where the line starts, not as a distinct ''reference point'' marker. Consider
    a visibly different treatment (e.g. a muted/neutral stroke, or a small outlined
    dot with the PAGE_BG halo used on the endpoint marker) so it reads as intentional.'
  - 'Vertical canvas utilization is low: the line+fill only spans y=614 to y=1311
    (~697px of the 1800px canvas height, ~39%), a byproduct of the 1.0x-range y-padding
    on both sides (ylims tripling the effective vertical range vs. the data extent).
    Combined with the title occupying only ~31% of canvas width, the chart reads as
    a thin band inside a lot of empty canvas — consider tightening y_pad (e.g. 0.3-0.5x
    range) to give the trend more visual presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured (250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: Only element is the title "sparkline-basic · julia · makie · anyplot.ai", bold, dark ink (#1A1A17-ish), clearly readable, positioned top-center. No axes, ticks, gridlines, or labels present (correct for a sparkline). Title occupies only ~31% of canvas width (996px of 3200px) — legible but visually small relative to the canvas.
      Data: Single continuous brand-green (#009E73) line depicting a daily-active-users trend across 60 days: starts flat, dips to a trough, rises sharply into a plateau with a small notch, dips again, and ends on a modest rise. A soft green area fill (alpha ~0.22) shades from the line down to the series' own minimum, giving an area-chart "sparkline" feel. A larger brand-green dot with a light halo marks the final (most recent) data point clearly. The two intended min/max highlight dots (blue #4467A3, ochre #BD8233) do NOT appear anywhere in the image — confirmed by a full-resolution pixel scan (0 matching pixels). The first-point marker is present in code but visually blends into the line start (same green color) and is not distinguishable as a separate marker.
      Legibility verdict: PASS (title and line both fully readable; no text legibility issues, but see weaknesses for missing/indistinct marker elements).

    Dark render (plot-dark.png):
      Background: Warm near-black, measured (26,26,23) = #1A1A17, matches spec exactly.
      Chrome: Title renders in light ink (near #F0EFE8), clearly readable against the dark background — no dark-on-dark issue. Same layout as light render, only chrome flipped.
      Data: Brand-green line and area fill are byte-identical in hue to the light render (#009E73), confirming color consistency across themes. The endpoint dot is visible with a dark-background-colored halo. As in the light render, the blue/ochre min/max dots are absent from a full-resolution pixel scan, and the first-point ring marker is indistinguishable from the line.
      Legibility verdict: PASS (all rendered text and the primary line/fill/endpoint marker are clearly readable in dark mode; no dark-on-dark failures found).
