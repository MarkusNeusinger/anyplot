review:
  strengths:
  - Correctly strips all chrome via theme_void() — no axes, ticks, or gridlines, matching
    the spec's 'extreme minimalism' requirement exactly
  - Colored dots correctly highlight the series minimum (matte red) and maximum (blue),
    plus the latest value (brand green), giving the line a clear focal hierarchy
  - geom_ribbon fills down to the series minimum for the classic sparkline 'area'
    look, satisfying the spec's optional fill-under-line feature
  - Both light and dark renders keep the brand green line and highlight-dot colors
    identical — only chrome (background, title ink) flips between themes
  - 'Realistic, neutral data: 90-day stock closing-price series with a plausible $130-$165
    range and an organic-looking sine + random-walk trend'
  - 'Clean, reproducible KISS-structured code: set.seed(42), only the two necessary
    imports (ggplot2, ragg), no functions/classes, correct ggsave()/agg_png output'
  weaknesses:
  - 'Canvas utilization is severe: the visible sparkline mark (line+fill+dots) is
    only ~50% of canvas width but just ~12% of canvas height, centered in the 3200x1800
    canvas — even including the title block, total content spans well under 30% of
    the canvas height. Per VQ-05, this triggers the ''tiny plot in a huge canvas''
    automatic-0 condition. Fix by raising `aspect.ratio` from 0.16 to roughly 0.35-0.45
    (and/or tightening `scale_y_continuous` expansion and top/bottom plot margins)
    so the sparkline band reaches ~35-40% of the canvas height while still reading
    as compact/wide relative to a normal chart.'
  - Title occupies only ~40% of plot width, below the ~50-70% target for a short custom-length
    mandated title (this specific title is only ~43 characters, shorter than the ~67-char
    reference case) — consider a slightly larger plot.title size now that vertical
    space is being reclaimed from the canvas-utilization fix.
  - Only the last point is highlighted as a reference marker; the spec's optional
    'highlight first/last points' suggestion is only half-applied — adding a subtle
    marker at the first point would complete the pattern (low priority, feature is
    optional).
  - Library Mastery usage is fairly generic (geom_ribbon + geom_line + geom_point
    layering) — nothing distinctive to ggplot2 specifically is leveraged beyond the
    standard grammar-of-graphics layer composition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Only the centered title "sparkline-basic · r · ggplot2 · anyplot.ai" is present in dark ink (#1A1A17) — no axes, tick labels, gridlines, or spines, per the sparkline spec's extreme-minimalism requirement. Title is clearly readable against the light background.
      Data: A single brand-green (#009E73) line traces a two-hump trend (rise, dip near the middle, rise again, small pullback at the end) with a soft green ribbon fill underneath down to the series minimum. A matte-red dot (#AE3030) marks the series minimum, a blue dot (#4467A3) marks the series maximum, and a green dot marks the final value. Colors match the Imprint palette; first series is the brand green.
      Legibility verdict: PASS — title and data are both clearly legible; however the sparkline mark itself is very small relative to the overall canvas (thin horizontal band centered vertically, large empty space above/below).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title renders in light ink (#F0EFE8/near-white), clearly readable against the dark background — no dark-on-dark failures observed.
      Data: Same brand-green line, same red/blue/green highlight dots, same shape and proportions as the light render — data colors are identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS — all text and data elements are readable in the dark theme; same canvas-utilization concern as the light render (mark occupies a small fraction of the total canvas).
