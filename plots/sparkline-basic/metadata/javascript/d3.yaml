review:
  strengths:
  - Rebuilt the per-stock rows with D3's idiomatic svg.selectAll('g.row').data(stocks).join('g')
    data-join, directly addressing the LM-01 feedback from attempt 1.
  - Added min/max highlight dots (skipping indices that coincide with the first/last
    markers), completing the last unimplemented optional spec feature.
  - Standout-mover emphasis (subtle 5%-opacity row tint + bolder company name on the
    largest absolute mover, Halcyon Health at -65.2%) gives the plot a clear visual
    hierarchy that was missing before.
  - 'Clever adaptation of the sparkline concept to the fixed 3200x1800 canvas: four
    table-style rows, each a ~19:1 wide-and-short sparkline mark, honoring the spec''s
    compact-aspect-ratio note for the mark itself while filling the mandated canvas
    via the ''table cells'' dashboard use case from the spec''s Applications section.'
  - 'Correct, redundant color coding: green (#009E73) for gains, red (#AE3030) for
    losses, reinforced by arrow glyphs and text, not hue alone.'
  - Both themes render correctly with identical data colors and fully theme-correct
    chrome (text, dividers, backgrounds).
  weaknesses:
  - The lcg/buildSeries helper functions and the rows.each() callback add structure
    beyond a flat top-to-bottom script (acceptable given the browser has no seeded
    RNG, but keep in mind for CQ-01 on future revisions).
  - 'LM-02 remains generic: curveMonotoneX and tspan composition are nice touches
    but not features unique to D3 specifically.'
  - The standout-mover tint is quite subtle (5% opacity) — a slightly stronger treatment
    (e.g. 8-10% opacity or a small badge) would push DE-03 storytelling from good
    to excellent.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark centered title "sparkline-basic · javascript · d3 · anyplot.ai" at top. Four table-style rows (Nova Robotics/NVRO, Bluewave Foods/BLUW, Crestline Energy/CRST, Halcyon Health/HLCN), each with dark company name, gray ticker, bold price, and a colored arrow+percentage. Thin light-gray divider lines separate rows. The bottom row (Halcyon Health) has a subtle full-row reddish tint calling out the largest mover.
      Data: Two rows trend up in brand green (#009E73) with light green area fill; two trend down in matte red (#AE3030) with light red area fill. Each line starts with a hollow ring marker, ends with a filled dot, and has small faded dots marking the series min/max (skipped where they'd coincide with first/last).
      Legibility verdict: PASS — all text (title, names, tickers, prices, percentages) is clearly dark-on-light and readable; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout; title and all per-row text now render in light/white, remaining fully legible. Dividers and the standout tint are still visible against the dark surface.
      Data: Line/fill/marker colors are identical to the light render (#009E73 green, #AE3030 red) — only chrome (background, text, dividers) flipped, confirming palette compliance.
      Legibility verdict: PASS — no dark-on-dark failures anywhere; ticker and price text remain readable at their secondary/tertiary sizes.
