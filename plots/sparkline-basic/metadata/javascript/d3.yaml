review:
  strengths:
  - 'Clever adaptation of the sparkline concept to the fixed 3200x1800 landscape canvas:
    four table-style rows each contain a ~18:1 wide-and-short sparkline, honoring
    the spec''s compact-aspect-ratio guidance for the mark itself while filling the
    mandated canvas via the ''table cells'' dashboard use case named in the spec''s
    Applications section.'
  - Clean typographic hierarchy per row (company name, ticker, price, colored percent-change
    badge with arrow) reads like a real fintech product table.
  - 'Correct, redundant color coding: green (#009E73, palette[0]) for gains and red
    (#AE3030, palette[4], a legitimate Imprint palette member) for losses, reinforced
    by up/down arrows and text rather than relying on hue alone.'
  - Both up and down trends are shown across varied volatility and price scales ($13-$164),
    giving good feature coverage for a trend-shape chart.
  - No axes, ticks, or gridlines anywhere - correctly honors the sparkline's 'extreme
    minimalism' requirement.
  - First/last point markers (hollow vs. filled) and a subtle area fill implement
    two of the spec's optional features.
  - Both themes render correctly with identical data colors and theme-correct chrome
    (background, text, divider lines).
  weaknesses:
  - The four per-stock rows are built with an imperative stocks.forEach(...) loop
    and individual .append() calls rather than D3's idiomatic selection.data(stocks).join('g')
    pattern - a missed opportunity to demonstrate D3's core data-binding paradigm
    for a naturally repeated row structure.
  - The spec's optional 'highlight min/max points with colored dots' feature is not
    implemented - only first/last points are marked.
  - 'Design excellence is solid but stops short of publication-ready: no emphasis
    singles out the standout mover (Halcyon Health, -65.2%), so the viewer has to
    compare all four percentages manually instead of being guided to the biggest story
    in the data.'
  - The lcg/buildSeries helper functions add structure beyond a flat top-to-bottom
    script; understandable since the browser has no seeded RNG, but keep the rest
    of the script as flat as possible.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "sparkline-basic · javascript · d3 · anyplot.ai" centered at top, clearly legible. Each of the four rows has a bold dark company name, a smaller soft-gray ticker with letter-spacing, a large bold price, and a colored percent-change badge with a triangle arrow. Thin light-gray divider lines separate rows. All text is dark-on-light and reads clearly.
      Data: Row 1 (Nova Robotics) and row 3 (Crestline Energy) are upward-trending green (#009E73) sparklines with a light green area fill; row 2 (Bluewave Foods) and row 4 (Halcyon Health) are downward-trending red/maroon sparklines with a light red area fill. Each line ends in a filled dot (current value) and starts with a hollow ring (starting value).
      Legibility verdict: PASS - all text and data elements are clearly readable, no overlap, no clipping at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title and per-row labels now rendered in light/white text against the dark background - fully legible, no dark-on-dark issues anywhere (company names, tickers, prices, dividers all clearly visible).
      Data: Line and fill colors are identical to the light render (#009E73 green rows, #AE3030 red rows) - only the chrome (background, text, divider color) flips, confirming the palette rule. Hollow start markers and filled end markers remain visible against the dark background.
      Legibility verdict: PASS - all text is clearly readable in the dark theme, no dark-on-dark failures, data colors match the light render exactly.
