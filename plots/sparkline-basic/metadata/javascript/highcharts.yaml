review:
  strengths:
  - 'Flawless theme adaptation: identical Imprint green (#009E73) line, gradient fill,
    and last-point marker across both renders — only chrome (title ink, min/max marker
    fill via t.ink) flips; backgrounds are exactly the correct warm off-white (#FAF8F1)
    / near-black (#1A1A17)'
  - 'Faithful ''no chrome'' execution: xAxis/yAxis hidden, no ticks, no gridlines,
    no legend — matches the spec''s core minimalism requirement'
  - 'Thoughtful optional-feature coverage: soft gradient area fill (28%→2% opacity)
    for the area effect, neutral ink-colored dots (not semantic red/green) marking
    min/max so they don''t imply a value judgement on a neutral extremum, and an emphasized
    last point with an ''80.1K'' current-value label'
  - Deterministic, seeded LCG data generator producing a plausible Daily Active Users
    trend (30K-90K range); clean single-purpose script with no unused imports or stray
    functions
  - Correct mandated title format with a descriptive prefix, and a title fontsize
    that auto-shrinks proportionally to the title string length
  weaknesses:
  - 'The areaspline fills nearly the full canvas height (yAxis padded only ±3 around
    the data range, margins just 90/30 px top/bottom), so the chart reads as a large
    full-bleed area chart rather than the spec''s defining ''compact, wide-and-short''
    sparkline (typically 4:1 to 8:1). The sibling plotly implementation (91/100) solves
    this on the same fixed 3200x1800 canvas by compressing the y-domain into a `domain:
    [0.36, 0.72]` band; the matplotlib implementation (91/100) stacks several slim
    rows. Recommend padding the yAxis min/max more generously (or using a plot-area
    domain trick) so the line occupies roughly the middle third of the canvas height,
    leaving generous top/bottom whitespace to restore the compact sparkline identity.'
  - Only the last point carries a value label — the spec's 'highlight first/last points
    for reference' note is only half-applied (first point isn't marked). Low priority
    since the note is explicitly optional.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1), confirmed — not pure white, not dark.
      Chrome: title "Daily Active Users · sparkline-basic · javascript · highcharts · anyplot.ai" in dark ink, top-left aligned, fully readable. No axes, ticks, gridlines, or legend present (by design). A small dark dot marks the series minimum, another marks the maximum; the last point is a larger brand-green dot with a bold "80.1K" data label to its right.
      Data: a single brand-green (#009E73) areaspline line with a soft green-to-transparent gradient fill beneath it, tracing a 60-day upward trend with local dips and peaks. First/primary series color is #009E73, confirmed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black (#1A1A17), confirmed — not pure black, not light.
      Chrome: title in light ink (#F0EFE8), clearly readable against the dark surface — no dark-on-dark issue. Min/max marker dots flip to a light/white fill (still t.ink-derived) so they remain visible on the dark background; the "80.1K" label is in light ink and fully legible.
      Data: identical line shape, brand-green line/gradient fill, and last-point marker color to the light render — only the chrome (title, min/max dot fill, label ink) flipped. Confirmed.
      Legibility verdict: PASS
