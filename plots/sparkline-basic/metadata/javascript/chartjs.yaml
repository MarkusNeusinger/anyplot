review:
  strengths:
  - 'Minimalist sparkline execution matches the spec precisely: no axes, ticks, gridlines,
    or legend, just a single clean brand-green line'
  - Last-point highlight uses a green dot with a page-background border, creating
    a 'punched-through' focal point that reads as the current value in both themes
  - Deterministic seeded LCG data generation and flat KISS script structure (no functions/classes)
  - 'Theme-adaptive chrome correctly implemented: title color and canvas background
    both correct and legible in light and dark'
  - Mandated title format is exact, legend correctly omitted for a single series,
    and animation is disabled per the mount-node contract
  weaknesses:
  - 'Vertical canvas underutilization: yPad = dataRange * 3.2 compresses the entire
    trend line into roughly the middle 10-15% of the 1800px-tall canvas, leaving large
    blank whitespace above and below. Reduce the y-padding multiplier substantially
    (e.g. ~0.15-0.3x the data range) so the line fills more of the available vertical
    space per the canvas-utilization guideline.'
  - The spec's optional 'highlight min/max points with colored dots' feature is unused
    - only the last point is marked. Adding min/max highlighting would strengthen
    data storytelling and feature coverage.
  - Curve tension (0.35) smooths through the noisy daily data; worth double-checking
    it doesn't visually overshoot local min/max in a way that misrepresents day-to-day
    values at this vertical compression.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "sparkline-basic · javascript · chartjs · anyplot.ai" is bold, dark, centered near the top and fully legible. No axes, ticks, gridlines, or legend are present, matching the spec's minimalism requirement.
      Data: A single brand-green (#009E73) line runs the full width of the canvas, oscillating gently with an overall upward drift, ending in a larger green dot with a light-colored border marking the last data point. The line and dot are clearly distinguishable against the background.
      Layout note: The line's vertical excursion occupies only a thin band roughly in the middle of the tall canvas, leaving large blank areas above and below.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title renders in light-colored text ("F0EFE8"-like), clearly visible against the dark background - no dark-on-dark issue.
      Data: The line and endpoint dot are the identical brand green (#009E73) as the light render - only the chrome (background/text) flipped, confirming palette consistency across themes.
      Layout note: Same vertical-compression issue as the light render - the line occupies only a thin middle band of the canvas.
      Legibility verdict: PASS
