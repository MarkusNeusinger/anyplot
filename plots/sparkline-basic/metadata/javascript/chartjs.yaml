review:
  strengths:
  - 'Fixed the attempt-1 blocker: y-padding dropped from dataRange*3.2 to dataRange*0.18,
    so the trend line now fills the great majority of the 1800px canvas height instead
    of being squeezed into a thin middle band'
  - Added min-point highlighting (amber dot) alongside the existing last-point highlight,
    directly addressing the prior review's feature-coverage request for the spec's
    optional 'highlight min/max points' feature
  - Curve tension reduced from 0.35 to 0.15, removing the bezier-overshoot risk flagged
    previously while keeping a subtly smoothed, elegant line
  - 'Still a precise, minimalist sparkline: no axes/ticks/gridlines/legend, deterministic
    seeded LCG data, exact mandated title, animation disabled per the mount-node contract'
  weaknesses:
  - 'The amber min-highlight dot has very low contrast in the light render: sampled
    pixel (221,204,119) against the (250,248,241) page background is only ~1.5:1 contrast
    ratio, so the min marker is nearly invisible in plot-light.png even though the
    same color reads clearly on the dark background. Use a darker/more saturated amber
    (or a contrasting pageBg-colored ring) specifically tuned for the light theme
    so the min highlight is legible in both renders.'
  - pointBorderColor is set to t.pageBg for every point, which erases the outline
    on the low-contrast amber dot in light mode (no crisp edge to fall back on). A
    theme-adaptive border (e.g. t.ink at low opacity, or a fixed dark ring) would
    keep the 'punched-through' look on the green endpoint while giving the amber marker
    a visible edge.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) - not pure white, not dark.
      Chrome: Title "sparkline-basic · javascript · chartjs · anyplot.ai" is bold, dark ink, centered near the top, and fully legible. No axes, ticks, gridlines, or legend - matches the spec's minimalism requirement.
      Data: A single brand-green (#009E73) line runs the full width of the canvas with a gentle noisy upward drift, now filling the great majority of the canvas height (fixed from attempt 1's excessive vertical padding). The line ends in a large green dot (last point, which also happens to be the data max) with a light-colored border. A small amber/khaki dot marks the data minimum near the start of the series.
      Legibility issue: the amber min-marker dot (sampled RGB 221,204,119) is very low-contrast against the off-white background (~1.5:1 contrast ratio) - it is present but hard to spot at a glance, unlike the prominent green endpoint dot.
      Legibility verdict: PASS overall (title and line fully legible); the amber accent marker is a borderline FAIL on its own for contrast, noted as a weakness rather than a hard block since it doesn't affect text or the primary data line.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) - not pure black, not light.
      Chrome: Title renders in light-colored text, clearly visible against the dark background - no dark-on-dark issue.
      Data: The line and endpoint dot are the identical brand green (#009E73) as the light render - only chrome (background/text) flipped, confirming palette consistency across themes. The amber min-marker dot (same RGB 221,204,119) has strong contrast here against the near-black background and is clearly visible - this is a theme-asymmetric issue, good in dark, weak in light.
      Legibility verdict: PASS
