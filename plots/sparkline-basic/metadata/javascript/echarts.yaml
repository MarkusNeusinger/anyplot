review:
  strengths:
  - 'Idiomatic multi-grid technique: six independent sparklines are packed into a
    single ECharts instance via parallel grid/xAxis/yAxis arrays instead of six chart
    instances — a genuinely advanced ECharts pattern.'
  - Semantic up/down coloring (green when the trend is good for the metric, matte
    red when it isn't, per-metric via goodWhenUp) rather than a naive 'green=up' rule
    — Server Latency and Churn Rate correctly render red on an upward trend while
    Revenue and Active Users render green.
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    ink, soft ink) flips as required.
  - Deterministic data generation via a small fixed-seed LCG, appropriate since the
    browser has no seeded Math.random.
  - 'Clean chart bodies: axes, gridlines and ticks are fully hidden on every mini
    sparkline (show: false), matching the spec''s ''no axes, labels, or gridlines''
    requirement at the line level.'
  - Fill-under-line (areaStyle) and a highlighted last-value marker (markPoint) are
    both implemented, covering two of the spec's optional enhancements.
  - No text clipping or overlap in either render; comfortable margins on all four
    canvas edges.
  weaknesses:
  - Per-card sparkline aspect ratio is roughly 1.75:1 (≈480×273 CSS px), far from
    the spec's 'compact aspect ratio, typically 4:1 to 8:1' — each tile reads more
    like a small area chart than a true minimal sparkline. Consider shortening each
    card's chart height relative to its width, or reducing to fewer/wider cards, to
    better match the intended sparkline silhouette.
  - Neither min nor max point is highlighted on any of the six series (only the last
    point gets a marker) — one of the spec's listed optional enhancements is entirely
    unused; adding a markPoint for the series max/min would round out feature coverage.
  - The title occupies only ~31% of the canvas width at fontSize 22 — well under the
    ~50-70% guideline for a landscape canvas this wide. Not a defect (no clipping/overflow),
    but the title reads a little small/lost on the 3200px-wide frame; a couple of
    points larger would balance the layout better.
  - Small helper functions (lcg, walk) and array-method callbacks (.map/.forEach)
    run counter to the KISS 'Imports → Data → Plot → Save, no functions' structure
    — understandable here since six series need the same random-walk generator, but
    worth a comment noting it's justified by DRY across metrics rather than default
    style.
  - At the 400px mobile thumbnail, the small delta-percentage text (▲ 46.7% style)
    becomes difficult to read — worth a slightly larger relative fontSize for that
    element specifically, since it currently uses the smallest fontSize (13px) of
    the three text tiers per card.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — confirmed not pure white.
      Chrome: Title "sparkline-basic · javascript · echarts · anyplot.ai" centered near the top in dark ink, clearly legible. Each of the 6 KPI cards has a small gray label (e.g. "Revenue", "Server Latency") top-left, a bold dark value (e.g. "$264K", "209ms") top-right, and a small colored trend line (▲/▼ + percentage) beneath the value. All text is dark-on-light and clearly readable.
      Data: 6 mini line-and-area charts arranged in a 2x3 grid. First series (Revenue) and most others render in Imprint brand green (#009E73-family) with a light green fill; Server Latency and Churn Rate render in matte red with a light red fill, reflecting that rising latency/churn is a negative signal (semantic exception, not a palette violation). Each series ends in a small solid dot marking the latest value. Lines are thin (1.8px), smoothed, and clean at this scale.
      Legibility verdict: PASS — no light-on-light text found anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — confirmed not pure black.
      Chrome: Same title, now in light/white ink, clearly legible against the dark background. Card labels are light gray, values are bold white, trend text remains colored (green/red) exactly as in the light render.
      Data: The six line/area charts use the identical green and red colors and identical shapes as the light render — only the fills read a bit darker/desaturated relative to their own line color, which is expected area-opacity behavior against a dark backdrop, not a color shift. Confirmed data colors are the same as light.
      Legibility verdict: PASS — no dark-on-dark text found; all card labels, values and trend indicators are clearly visible against the near-black background.
