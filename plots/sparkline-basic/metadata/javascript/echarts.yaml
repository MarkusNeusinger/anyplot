review:
  strengths:
  - Genuine small-multiples dashboard built on ECharts' multi-grid API (gridIndex-based
    xAxis/yAxis/grid arrays) — six independent mini line charts sharing one canvas,
    a real showcase of library capability rather than six copy-pasted charts.
  - Semantic color mapping (brand green for a 'good' trend, matte red for a 'bad'
    trend, computed per metric via goodWhenUp) correctly applies the finance up/down
    semantic exception from the style guide instead of blindly cycling the categorical
    palette.
  - markPoint highlights the latest value (filled dot) plus the series min/max (hollow
    rings), directly satisfying the spec's optional 'highlight min/max' and 'highlight
    first/last' notes.
  - Deterministic seeded LCG for reproducible data; data colors are pixel-identical
    between light and dark renders — only chrome flips, exactly as required.
  - Clean theme-adaptive chrome throughout (ink/inkSoft tokens for text, transparent
    background over pageBg) with no axes, ticks, or gridlines — matches the sparkline
    spec's minimalism requirement.
  weaknesses:
  - Noticeable empty band below every sparkline (roughly a third of each card's height)
    makes the composition feel top-heavy; tighten HEADER_H/CARD_H allocation or grow
    sparkHeight toward the shorter end of the spec's 4:1-8:1 ratio range to reduce
    the dead space.
  - KPI label/value/delta text is sized for full-resolution viewing and shrinks close
    to the edge of legibility on the 400px mobile thumbnail given six tiles share
    the canvas — consider nudging label/value fontsize up slightly.
  - Adjacent grid columns leave a tight gap (e.g. the 'Active Users' value and the
    'Server Latency' label) — comfortable with the current labels but would collide
    if a metric name or formatted value ran longer.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target.
      Chrome: Centered bold title "sparkline-basic · javascript · echarts · anyplot.ai" in dark ink at the top. A 2x3 grid of KPI tiles (Revenue, Active Users, Server Latency / Conversion Rate, Churn Rate, New Signups), each with a soft-gray metric label (top-left), a large bold value (top-right), and a small colored trend delta (▲/▼ + percent) beneath the value. All text is dark ink on the cream background — clearly legible, no light-on-light issues.
      Data: Each tile holds one thin sparkline with a light area fill beneath it, no axes/ticks/gridlines. Rising "good" metrics (Revenue, Active Users, Conversion Rate, New Signups) use the brand green #009E73 for both line/fill and the trend delta; "bad-when-rising" metrics (Server Latency, Churn Rate) use a matte red instead — a deliberate finance-style semantic exception, not the default categorical order. A filled dot marks the latest value; hollow rings mark the series min/max.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target.
      Chrome: Same title, now in light ink (#F0EFE8-ish) against the dark background — clearly readable. KPI labels use a muted light-gray secondary tone, values are bright and bold. No dark-on-dark text anywhere; every label/value/tick is legible.
      Data: Line color, area-fill color, and marker colors are pixel-identical to the light render (same brand green / matte red per tile) — only the chrome (background, text tones) flipped, as required. The green and red both read clearly against the dark surface.
      Legibility verdict: PASS.
