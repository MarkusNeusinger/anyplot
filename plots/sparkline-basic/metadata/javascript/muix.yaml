review:
  strengths:
  - Correct SparkLineChart usage assembled into a realistic multi-metric KPI dashboard
    layout, directly matching the spec's "Dashboard KPI trend indicators" application
  - Compact aspect ratio (~7.5:1 per sparkline) sits within the spec's 4:1-8:1 guidance,
    and the chart is genuinely chromeless — no axes, ticks, or gridlines, as the spec
    mandates
  - 'Fully theme-adaptive chrome: card backgrounds, ink/soft-ink text, and page background
    all flip correctly between light and dark while the four Imprint data colors stay
    pixel-identical'
  - Deterministic seeded LCG random walk per metric, area fill under each line for
    visual interest, clean typographic hierarchy (soft label / bold value / spark)
    inside rounded elevated cards
  weaknesses:
  - All four rows use identical line+area styling with no use of SparkLineChart's
    distinctive sparkline-specific API (e.g. showHighlight, referenceLine, plotType="bar")
    — a missed opportunity to demonstrate more of the library's surface
  - 'Lower-contrast Imprint hues (lavender #C475FD row 2, ochre #BD8233 row 4) are
    used for thin 3.5px lines with no stroke/outline — exactly the small-dashboard-tile
    scenario the style guide flags for adding a 1px ink stroke for CVD/low-vision
    legibility'
  - None of the spec's optional trend-emphasis features (min/max highlight, first/last
    point markers) are used, so the KPI-at-a-glance value-add beyond a plain line+area
    is not fully explored
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: bold centered title "sparkline-basic · javascript · muix · anyplot.ai" in dark ink, clearly readable. Four stacked cards with a slightly lighter elevated cream fill and rounded corners, each holding a soft-gray metric label ("Monthly Revenue", "Active Users", "Avg Response Time", "Conversion Rate") and a large bold dark value ($125k, 3688, 216ms, 3.21%). All text reads cleanly against the light background.
      Data: each row shows a single-color sparkline (thin line + translucent area fill) in Imprint order — brand green, lavender, blue, ochre — with no axes, ticks, or gridlines, matching the minimal sparkline spec. First series is #009E73 brand green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17, not pure black.
      Chrome: same title now in light cream text, clearly readable against the dark page. Cards use a slightly lighter dark elevated fill; metric labels render in soft light-gray, values in bright off-white bold text. No dark-on-dark issues found — all text has strong contrast against the card and page backgrounds.
      Data: the four sparkline colors (green, lavender, blue, ochre) are visually identical hues to the light render — only the chrome (backgrounds, text) flips as required. Area fill opacity reads a bit richer against the dark card but the line colors themselves are unchanged.
      Legibility verdict: PASS
