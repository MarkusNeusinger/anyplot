review:
  strengths:
  - Uses the native MUI X SparkLineChart per row, with curve="linear" so the line
    never swings past its points, area plus baseline="min" for the fill, and a per-row
    yAxis {min, max} so each sparkline fills its own frame from lowest to highest
    value
  - 'The dashboard KPI card layout gives a clear type hierarchy: a soft-ink metric
    name, a large bold last value (Tufte''s name-plus-last-value convention, which
    the Notes allow) and the line beside it'
  - 'Theme tokens reach every element: pageBg, the elevatedBg cards, ink/inkSoft text
    and t.palette[0] for every line, so light and dark differ only in chrome'
  - Deterministic fixed-seed LCG random walks give four plausible KPIs with different
    shapes (steady rise, flat then breakout, decline, slow erosion)
  - skipAnimation is set and the snippet follows the default-export harness contract
  weaknesses:
  - 'Suggestion: the 320 px label column leaves a wide empty gap between the short
    metric names and the start of each line; a narrower LABEL_W would give the sparklines
    more width.'
  - 'Suggestion: the header comment reads ''muix 7.29.1'' although the harness pins
    @mui/x-charts 9; the review step rewrites the header, but the source could state
    the pinned major.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1) with four slightly lighter rounded cards (elevatedBg), one per KPI row.
      Chrome: centered bold title "sparkline-basic · javascript · muix · anyplot.ai" in dark ink, soft-ink subtitle "Day 1–45 · each line scaled to its own range · last value beside the name". Each card has the metric name in soft ink (Daily revenue (k$), Active users, Avg response time (ms), Conversion rate (%)) above a large bold last value (125, 3688, 216, 3.21). No axes, ticks or gridlines. All text is readable.
      Data: four thin brand-green #009E73 linear sparklines with a light translucent green fill down to each row's minimum. Each one fills its own card height. Shapes: steady revenue rise, active users flat then breaking out around day 30, response time declining, conversion rate eroding.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17) with slightly lighter dark cards.
      Chrome: the title and last values in light ink, the names and subtitle in soft light ink. No dark-on-dark text; everything is readable.
      Data: the same #009E73 lines as the light render; the fill shows as a dark translucent green on the dark cards. The data colors are identical between the renders and only the chrome flips.
      Legibility verdict: PASS
