    'color' column
  - Min, max, first and last dots sit exactly on the line, and the plot area keeps
    a compact 4.5:1 ratio
  weaknesses:
  - 'VQ-05 (both): canvas is 4800×1200, not one of the canonical sizes → 3200×1800
    landscape (−1600 × +600 px). Likely cause: figure(width=4800, height=1200); keep
    the compact frame through larger min_border_top/bottom.'
  - 'SC-04 (both): title reads ''sparkline-basic · bokeh · anyplot.ai'' without the
    language → ''sparkline-basic · python · bokeh · anyplot.ai''. Likely cause: the
    title string.'
  - 'VQ-01 (both): the 32pt title (about 43 px) on the 4800 px canvas blurs in the
    400 px thumbnail → 50pt on the 3200 px canvas (+18pt). Likely cause: p.title.text_font_size
    = ''32pt''.'
  - 'SC-02 (dark): a thin grey rectangle outlines the plot frame in the dark render
    only, a frame the Notes'' ''pure visualization'' excludes → no visible frame in
    either theme. Likely cause: a frame border Bokeh still paints in the dark render
    despite outline_line_color=None.'
  - 'CQ-05 (code): saves the PNG with bokeh.io.export_png, which the library prompt
    forbids → save the HTML and screenshot it with the Selenium/CDP block. Likely
    cause: export_png(p, filename=...).'
  - 'Suggestion: the series name and its last value as text beside the line (Tufte''s
    convention), which the Notes allow.'
