review:
  strengths:
  - Canonical 3200x1800 canvas reached by padding (never cropping) the vl-convert
    output, with a guard that fails loudly if the chart overshoots
  - 'Pure sparkline: axis=None on both channels and configure_view(strokeWidth=0)
    remove every piece of chrome, as the spec asks'
  - Min and max dots sit exactly on the line and stand out in Imprint violet and ochre
    against the green line in both themes
  - Theme tokens threaded to background and title; data colors identical across the
    light and dark renders
  - Adaptable-code layout with escaped column constants and shared encodings reused
    across the area, line and dot layers
  weaknesses:
  - 'SC-02 (both): the line spans only the top ~62 % of its frame (the minimum sits
    well above the fill''s floor, which is at y = 0), so C2''s own-range scaling is
    missed → the lowest value on the bottom edge of the frame. Likely cause: mark_area
    stacks a quantitative y by default, which forces zero into the shared scale despite
    zero=False; set stack=None on the area''s y (or y2 at the data minimum).'
  - 'VQ-05 (both): the sparkline is off-centre on the canvas, about 83 px left margin
    against about 300 px right → equal side margins (about +110 px left, -110 px right).
    Likely cause: vl-convert''s saved PNG carries extra right padding before the PIL
    pad centres it; set autosize/padding explicitly or centre on the view, not the
    saved image.'
  - 'Suggestion: first and last dots (allowed by the Notes) would anchor the start
    and end of the trend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold dark title "sparkline-basic · python · altair · anyplot.ai" centred above the line, about 46 % of the width; no axes, ticks, gridlines or frame. All text readable.
      Data: a thin #009E73 line over 75 points rising from about day 0 to a launch spike near day 25, a dip, then a gradual climb to a peak near the end; a 15 % green area fill below it down to a floor well under the lowest value. A violet (#C475FD) dot on the minimum near day 4 and an ochre (#BD8233) dot on the maximum near day 71, both sitting on the line. The 5:1 strip sits in the vertical middle of the canvas, shifted left (about 83 px left margin vs about 300 px right).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title in light ink #F0EFE8, clearly readable; no dark-on-dark text.
      Data: identical line, fill, and dot colors and positions to the light render; only the background and title ink flip. Brand green reads well on the dark surface.
      Legibility verdict: PASS
