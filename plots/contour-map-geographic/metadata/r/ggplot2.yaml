      Data: seven bands from pale mint (Icelandic Low, NW) through brand green #009E73 and teal to deep blue and dark violet (Azores High, SW corner); dark-ink isolines and coastlines/borders over Europe; seven boxed bold labels 1002–1022 along the lines.
