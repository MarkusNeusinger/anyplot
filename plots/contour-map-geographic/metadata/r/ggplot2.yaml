review:
  strengths:
  - geom_contour_filled with the same explicit 4 hPa breaks as geom_contour keeps
    bands and lines on identical levels
  - One isobar label per level, placed at the midpoint of its longest line via contourLines,
    in a page-colored box that reads on every band
  - imprint_seq fields stops of the render's theme, sampled once per band through
    scales::gradient_n_pal
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'Suggestion: legend keys in cut notation ''(998, 1002]'' could read as plain ranges
    ''998–1002'', or use guide_coloursteps() for a stepped color bar.'
  - 'Suggestion: the dotted panel grid is fully covered by the filled bands; drawing
    it above the fills (or dropping it) would make the intent explicit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around a map panel fully covered by filled pressure bands.
