review:
  strengths:
  - Filled bands use the imprint_seq fields stops for each theme, sampled once per
    4 hPa band, so light and dark both read low→high correctly
  - geom_contour_filled with explicit 4 hPa breaks and scale_fill_manual(drop = FALSE)
    gives an exact stepped legend 'Pressure (hPa)' matching the isolines
  - Isobar labels in page-colored boxes (size 3, bold) stay readable over every band
    in both themes
  - Coastlines and borders from map_data('world') drawn in the theme ink stay legible
    beneath the fills in both renders
  - Realistic North Atlantic synoptic pattern with standard 4 hPa isobar interval
  weaknesses:
  - 'SC-02 (both): isolines are jagged and the field throws spurious small closed
    loops (e.g. 1018 islands over Germany/Poland, scattered loops over Russia) because
    white noise of sd 0.4 hPa sits on a 4 hPa interval, so C1''s smooth isolines are
    missed → drop the per-cell noise or smooth it (sd ≤ 0.1, or a low-frequency perturbation).
    Likely cause: rnorm(nrow(grid), 0, 0.4) in the pressure field.'
  - 'VQ-06 (both): axis titles ''Longitude'' / ''Latitude'' carry no unit and ticks
    read -20 / 0 / 20 → ''(°E)'' / ''(°N)'' in the titles or degree tick labels (e.g.
    20°W). Likely cause: labs(x = ''Longitude'', y = ''Latitude'') without units.'
  - 'Suggestion: OCEAN_COL never shows because geom_contour_filled covers the whole
    panel; a land/sea distinction (e.g. lighter fill alpha) would make the basemap
    read faster.'
  - 'Suggestion: naming the Azores High and Icelandic Low with small H/L marks would
    guide readers unfamiliar with synoptic maps.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map panel framed by a thin INK_SOFT border.
      Chrome: bold title 'N. Atlantic Isobars · contour-map-geographic · r · ggplot2 · anyplot.ai' in dark ink, axis titles 'Longitude'/'Latitude' and ticks (-20..40, 40..70) in dark/soft ink; legend 'Pressure (hPa)' on an elevated panel with eight interval keys (994–1026). All readable.
      Data: filled 4 hPa bands in imprint_seq light fields stops — pale mint for the Icelandic Low (NW), brand green, then blue to navy for the Azores High (SW); dark isolines and black coastlines/borders over Europe; bold labels 998–1022 in page-colored boxes. Isolines are jagged, with small noise loops over Central Europe and Russia.
      Legibility verdict: PASS

