review:
  strengths:
  - Filled bands use the imprint_seq fields stops of each theme, sampled once per
    4 hPa band, so low→high reads correctly in both renders
  - geom_contour_filled with explicit 4 hPa breaks and scale_fill_manual(drop = FALSE)
    gives a stepped 'Pressure (hPa)' legend that matches the isolines exactly
  - 'Smooth analytic pressure field: clean closed isobars around the Icelandic Low
    and Azores High'
  - Isobar labels in page-colored boxes sit on their lines and stay readable over
    every band in both themes
  - Degree-formatted axes 'Longitude (°E)' / 'Latitude (°N)' with coastlines and borders
    from map_data('world') legible beneath the fills
  weaknesses:
  - 'Suggestion: legend keys in cut notation ''(998, 1002]'' could read as plain ranges
    ''998–1002''.'
  - 'Suggestion: OCEAN_COL never shows because geom_contour_filled covers the panel;
    a slightly translucent fill would let land and sea read apart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map panel framed by a thin INK_SOFT border.
      Chrome: bold title 'N. Atlantic Isobars · contour-map-geographic · r · ggplot2 · anyplot.ai' in dark ink; axis titles 'Longitude (°E)' / 'Latitude (°N)' and degree ticks (-20°..40°, 40°..70°); legend 'Pressure (hPa)' on an elevated panel with seven interval keys 998–1026. All readable.
      Data: filled 4 hPa bands in the imprint_seq light fields stops — pale mint at the Icelandic Low (NW), brand green, blue over Europe, navy at the Azores High (SW); smooth closed isobars in dark ink; black coastlines and borders; bold labels 1002–1022 in page-colored boxes on their lines.
