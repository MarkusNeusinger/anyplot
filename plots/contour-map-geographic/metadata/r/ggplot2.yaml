      Chrome: title, axis titles and legend text in light ink, ticks in soft light ink; legend on #242420 panel. No dark-on-dark text.
      Data: same bands with the dark fields stops (deep green low → brand green → pale blue high), as intended for a continuous ramp; isolines and borders in light ink; labels in dark boxes with light text. Brand green #009E73 visible.
      Legibility verdict: PASS
