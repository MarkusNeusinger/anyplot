review:
  strengths:
  - Custom marching-squares implementation for isolines plus a coastline overlay (via
    ECharts custom series/renderItem) is a genuinely distinctive, well-executed technique
    — index contours are bolded and labeled per cartographic convention (400 m interval,
    1200 m index lines)
  - Correct imprint_seq sequential colormap for elevation (single-polarity data),
    and all chrome (title, axis, colorbar, contour label boxes) is theme-adaptive
    and reads correctly in both the light and dark renders
  - Realistic, neutral Cascade-like elevation dataset with three peaks of varying
    height and a plausible coastal-to-inland elevation gradient
  weaknesses:
  - Contour lines are visibly polygonal/faceted around all three peaks (hexagon/octagon-shaped
    rings) rather than smooth curves, and the specification explicitly calls for 'smooth
    contour lines' — increase the grid resolution (e.g. ~70x70) or apply a light spline/Catmull-Rom
    smoothing pass to the marching-squares segments so the isolines round out
  - The ocean (roughly the west 40-45% of the square canvas, left of the coastline)
    is left completely blank/transparent with no basemap context — it reads as unfinished
    empty space rather than a deliberate depiction of water. Add a subtle theme-adaptive
    ocean fill (a faint blue-grey tint distinct from the imprint_seq land gradient)
    so the canvas doesn't look half-empty and the map communicates land vs. water
    directly
  - Only one label is placed per contour threshold (the segment nearest the grid center),
    so rings around the southern and northern peaks at the same elevation level go
    unlabeled — place at least one label per distinct closed contour loop instead
    of one per threshold value
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Cascade Range Elevation · contour-map-geographic · javascript · echarts · anyplot.ai" is bold dark text, centered top, fully readable. Axis titles "Longitude"/"Latitude" and the degree-formatted tick labels (e.g. "124.6°W", "47.3°N") render in dark grey and are clearly legible. The vertical colorbar (visualMap) on the right is labeled "2909 m" (top) and "0 m (coast)" (bottom) in dark grey text — readable.
      Data: The west ~40-45% of the plot area (ocean, west of a thin grey jagged coastline) is left blank/unfilled cream. East of the coastline, a green-to-blue sequential (imprint_seq) heatmap represents elevation 0-2909 m, with three distinct peak clusters (deep blue cores) at different scales. Black contour lines overlay the surface every 400 m; the bold 1200 m and 2400 m index lines carry labels in small light rounded-rect background boxes for legibility over the data.
      Legibility verdict: PASS — no light-on-light issues; all text and lines are clearly distinguishable from the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same composition as the light render but flipped to light-colored chrome — title and axis text render in near-white, tick labels in light grey, contour lines flip to a light/white stroke, and the coastline uses a light grey line. Contour label boxes flip to a dark fill with light text and stay fully readable.
      Data: The green-to-blue elevation gradient and the colorbar are visually identical to the light render — confirms only chrome (not data colors) changes between themes. The blank ocean area on the west side is dark/transparent in this theme (matches page background), same structural issue as in light.
      Legibility verdict: PASS — no dark-on-dark failures found; all title/axis/tick/contour-label text is clearly legible against the near-black background.
