review:
  strengths:
  - 'Coastline seam bug from attempt 2 is fully fixed: the ocean-polygon fill and
    grid-snapped land heatmap tiles now share the same boundary, with no page-background
    bleed-through at any staircase step in either theme'
  - 'Contour lines are now genuinely smooth: Chaikin smoothing is correctly applied
    to the final rendered path (not discarded), so the 1200 m and 2400 m index rings
    render as clean rounded curves instead of faceted polygons'
  - The notch/spike marching-squares artifacts on the north- and south-peak 2400 m
    rings from attempt 2 are gone — the duplicate closing-vertex bug was fixed before
    smoothing, and all three peak rings (including the un-ringed third summit's 1200
    m contour) are now artifact-free
  - Correct imprint_seq sequential colormap for elevation, with a well-justified semantic
    exception (Imprint blue for the ocean tint, per the style guide's 'water → blue'
    example) and fully theme-adaptive chrome in both renders
  - Deterministic, realistic Cascade-like elevation dataset with three peaks of varying
    height, a plausible coastal-to-inland gradient, and per-loop index-contour labeling
    so every closed ring carries its own value
  weaknesses:
  - 'Cosmetic only: the land heatmap tiles still form a visible grid-stairstep edge
    along the coast beneath the smooth coastline stroke (inherent to per-cell heatmap
    fill); not a defect now that the fill-registration gap is fixed, but a future
    refinement could clip the heatmap to the smooth coastline curve for an even cleaner
    edge'
  - The marching-squares/Chaikin/chaining pipeline requires several helper functions
    (coastLon, elevationAt, contourSegments, chainSegments, chaikinSmooth, projectPoint)
    — well justified by the algorithm, but less flat than a typical KISS echarts snippet
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Cascade Range Elevation · contour-map-geographic · javascript · echarts · anyplot.ai" is bold dark text, centered top, fully visible and not clipped (~65% of canvas width). Axis titles "Longitude"/"Latitude" and degree-formatted tick labels (e.g. "124.6°W", "47.4°N") render in dark grey and are clearly legible. The vertical colorbar (visualMap) on the right is labeled "2927 m" (top) and "0 m (coast)" (bottom) in dark grey text, fully visible with no edge clipping.
      Data: A light blue-grey ocean tint (Imprint blue, semantic water exception) fills the west of the canvas, cleanly bordered by a smooth dark coastline stroke with no visible gap or page-background bleed-through against the green-to-blue sequential (imprint_seq) land heatmap — the attempt-2 seam bug is gone on close zoom-in. Three peak clusters (deep-blue cores) are visible at different scales; the two clusters that exceed 2400 m render as clean, smooth, well-rounded circular rings (no faceting, no notch/spike artifacts), and the third, lower summit's 1200 m ring is likewise smooth. Black contour lines overlay the surface every 400 m; the bold 1200 m/2400 m index lines carry per-loop labels in small light rounded-rect background boxes, with no overlap between labels, lines, or axis text.
      Legibility verdict: PASS — no light-on-light issues; all text and lines are clearly distinguishable from the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same composition as the light render but flipped to light-colored chrome — title and axis text render in near-white, tick labels in light grey, contour lines flip to a light/white stroke, and the coastline uses a light grey line. Contour label boxes flip to a dark fill with light text and stay fully readable.
      Data: The green-to-blue elevation gradient and the colorbar are visually identical to the light render, confirming only chrome (not data colors) changes between themes. The coastline is clean here too — no dark/page-background bleed-through at the land/ocean boundary. The same smooth, artifact-free contour rings around all three peaks are present.
      Legibility verdict: PASS — no dark-on-dark failures found; all title/axis/tick/contour-label text is clearly legible against the near-black background.
