review:
  strengths:
  - Hand-written marching squares on the 101x61 grid gives smooth closed isolines
    with a clear saddle between Mount Rainier and Mount Adams
  - 'Cartographic hierarchy: thick labeled index contours every 1000 m over thin intermediate
    contours every 500 m'
  - Filled bands rasterized bilinearly per cell so band edges follow the isolines,
    in imprint_seq steps matched by a stepped colorbar
  - Map aspect corrected by cos(mean latitude); axis valueFormatter renders 123.6°W
    / 47.3°N
  - useDrawingArea places the custom SVG map layer inside the MUI X chart frame so
    axes and map share one coordinate system
  - Basemap labels typed by feature class (caps states, italic rivers, bold peaks)
    on page-colored halos that work in both themes
  weaknesses:
  - 'DQ-03 (both): the lowland base field sits at 460-520 m everywhere, so Portland
    and the Columbia River lie at ~470 m (real: under 50 m; Yakima ~330 m), and the
    500 m isoline becomes two dead-straight meridians at about 122.6°W and 120.2°W
    that read as graticule lines → a lowland base rising from about 0-50 m along the
    Columbia to a few hundred metres toward the Cascades (about -400 m at the river).
    Likely cause: the `460 + 60 * Math.sin(...)` baseline in the data block.'
  - 'CQ-04 (code): projX/projY are defined in ContourLayer (lines 326-327) but the
    same lon/lat-to-pixel formula is written out again for contour paths (lines 411-414),
    label candidates (lines 443-446) and the chosen label (lines 460-461) → call projX/projY
    there. Likely cause: projection helpers added after the contour code.'
  - 'Suggestion: a few intermediate contour labels (e.g. 1500 m, 2500 m) on the wider
    loops would make reading levels easier without the colorbar.'
  - 'Suggestion: the inner 3500 m loop on Mount Adams and the 2500 m loop on St. Helens
    are visibly faceted; a slightly denser grid near the summits would round them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around the map; title and subtitle centered above.
      Chrome: title "contour-map-geographic · javascript · muix · anyplot.ai" bold dark ink; subtitle "101×61 grid (460–4389 m) · index contours every 1000 m, intermediate every 500 m"; x ticks 123.6°W–119.2°W, y ticks 45.5°N–47.3°N, axis titles "Longitude (°)" / "Latitude (°)", colorbar "Elevation (m)" with ticks 500–4000 (thousands bold). All dark text, readable.
      Data: map filled with imprint_seq bands from #009E73 green (lowland) to #4467A3 blue at the Mount Rainier summit; dark ink contours, thick index lines labeled 1000/2000/3000/4000 m on page-colored boxes; closed loops around Rainier, Adams and St. Helens with a saddle joining Rainier and Adams. Basemap: rivers in page color (Columbia along the border, Cowlitz, Yakima, Lewis, Nisqually, Hanford Reach), town dots (Olympia, Ellensburg, Yakima, Portland), WASHINGTON/OREGON state labels. Two straight vertical 500 m isolines at ~122.6°W and ~120.2°W.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, ticks, axis titles and colorbar labels in light ink, all readable; no dark-on-dark text.
      Data: fill colors identical to the light render; contours flip to light ink, rivers and label boxes flip to the near-black page color with light text; town dots become light with dark outline. Everything remains distinguishable.
      Legibility verdict: PASS
