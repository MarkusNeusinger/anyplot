review:
  strengths:
  - Custom marching-squares isoline extraction (with saddle-cell resolution) is a
    genuinely impressive from-scratch implementation for a spec type MUI X has no
    native chart for
  - 'Real-world, factually accurate geography: actual Cascade volcano coordinates
    and summit heights (Rainier 4392m, Adams 3743m, St. Helens 2549m), plus a hand-traced
    Columbia River polyline for spatial anchoring'
  - Correct use of the Imprint sequential colormap (green→blue) for the single-polarity
    elevation field, identical data colors across both themes, theme-correct chrome
    (background, ink, contour stroke color) in both renders
  - Index/intermediate contour convention (800m labeled, 400m unlabeled) is a real
    topographic-map idiom, and contour labels dynamically dodge the peak-name label
    boxes instead of colliding with them
  - Clean composition-API usage of MUI X (ChartContainer + useDrawingArea) to sync
    a fully custom SVG raster/contour layer to the real axis coordinate system — a
    legitimate, idiomatic way to express a chart type the community package doesn't
    ship natively
  - Deterministic, seed-free data generation; clean imports; no fake interactivity
  weaknesses:
  - Faint vertical hairline seams are visible across almost the entire filled raster
    in both renders — the page background shows through at column boundaries between
    adjacent <rect> cells in the CELLS grid, producing a subtle pinstripe artifact
    over ~80% of the canvas. Fix by extending each rect's width/height by a fraction
    of a pixel so neighboring cells overlap slightly (or by drawing each row as a
    single horizontal <path>/<rect> run instead of one <rect> per cell) so there's
    no sub-pixel gap for the background to leak through.
  - The filled raster is solid brand-green across the entire lowland baseline (roughly
    80% of the map area), which is geographically accurate but visually monotonous
    — consider a slightly wider low end of the imprint_seq ramp or a subtle baseline
    vignette so the lowland fill reads as more than a flat color field.
  - Axis titles ('Longitude' / 'Latitude') don't carry an explicit unit suffix in
    the label text itself — units are only conveyed via the tick formatter (°W / °N);
    consider labeling the axis titles as 'Longitude (°W)' / 'Latitude (°N)' for full
    self-containment.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) surface, not pure white.
      Chrome: Dark charcoal title "Cascade Range Elevation Contours · contour-map-geographic · javascript · muix · anyplot.ai" and subtitle are fully readable at top-center; axis tick labels ("47.3°N" ... "123.6°W" ...) and axis titles "Longitude"/"Latitude" render in dark/soft-dark ink, all legible; colorbar title "Elevation (m)" and its tick values (460 to 4899) are dark and legible against the cream background.
      Data: Brand-green (#009E73) fill dominates the lowland baseline, gradually shifting to blue (#4467A3, Imprint sequential ramp) toward the three summits; black isolines (heavier/darker for 800m index contours, thinner/lighter for 400m intermediate contours) trace the elevation rings; contour value labels (e.g. "4800 m", "3200 m") sit in light pill boxes with dark text; peak-name labels ("Mount Rainier", "Mount Adams", "Mount St. Helens") sit in similar pills above each summit; a muted purple/blue river line with an italic "Columbia River" label crosses the bottom of the map.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) surface, not pure black.
      Chrome: Title, subtitle, axis tick labels, axis titles, and colorbar title/ticks all render in light/off-white ink, clearly legible against the dark background. No dark-on-dark text was found anywhere on the canvas.
      Data: The green→blue elevation fill and contour line colors are visually identical to the light render (same brand green low end, same blue high end) — only the chrome (background, text ink, contour-line color, label-pill fill) flips to the dark-theme tokens. Contour lines render as light gray/white in dark mode with matching-theme label pills (dark fill, light text) that stay legible. The Columbia River line and label remain visible and theme-adapted.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.

    Additional note (both renders): a faint vertical hairline/pinstripe pattern is visible across most of the filled raster area in both themes — a sub-pixel seam artifact between adjacent raster <rect> cells, not a legibility failure but a visual-polish issue flagged in weaknesses.
