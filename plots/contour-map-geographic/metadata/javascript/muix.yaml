review:
  strengths:
  - Creative, idiomatic use of MUI X's ChartContainer + useDrawingArea hook to implement
    a chart type (geographic contour map) the library has no built-in support for,
    mapping lon/lat directly to the drawing-area pixel rect so custom SVG layers align
    exactly with the axes
  - Correct Imprint sequential colormap (imprint_seq) for the continuous elevation
    field, with identical data colors between light and dark renders — only chrome
    (ink, page background, contour-line color) adapts
  - Real hand-rolled marching-squares isoline extraction with saddle-point disambiguation,
    producing meaningful 400 m / 800 m index-contour intervals for a synthetic-but-realistic
    460-4835 m elevation range anchored at three real, correctly-coordinated Cascade
    volcanoes
  - 'Clean geographic touches: degree-formatted axis ticks (°W / °N), a labeled Columbia
    River polyline as a real hydrological anchor, and index-contour value labels with
    background pill boxes for readability'
  - Fully deterministic, self-contained data generation (no RNG, no network calls);
    skipAnimation set; colorbar legend clearly labeled with the value range
  weaknesses:
  - Innermost (highest-elevation) contour rings around each peak look faceted/hexagonal
    rather than smooth, because the 61x35 grid is coarse relative to the tight peak
    sigmas (~0.15-0.22 deg) — increasing grid resolution (e.g. ~100x60) would round
    out the isolines the spec asks to be 'smooth'
  - The filled elevation raster is built from many small adjacent <rect> cells, leaving
    faint rectangular seams visible across the fill in both themes — a very subtle
    polish issue, most noticeable on close inspection of the flat lowland areas
  - '''Columbia River'' label in the light render uses a muted gray-ish ink on top
    of the green fill, giving it lower contrast than the rest of the chrome text —
    consider a small background pill (like the contour labels) or a slightly darker/higher-contrast
    tone for the italic river label'
  - Spec asks for geographic context like 'coastlines, borders, or terrain' — only
    a single river polyline is included; no country/state border or coastline reference,
    and the three volcano names appear only in the subtitle, not as individual point
    labels on the map itself
  - Filled-vs-line-only support is demonstrated only as 'both combined' (filled +
    isolines) — fine per spec, which allows either, but there is no visual cue distinguishing
    which contours are 'index' vs 'intermediate' beyond line weight/opacity, so at
    a glance the hierarchy relies on that subtle distinction alone
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "Cascade Range Elevation Contours · contour-map-geographic · javascript · muix · anyplot.ai" is bold, dark ink, fully visible at top; subtitle below it in softer gray-ink is also fully legible. Longitude/Latitude axis titles and degree-formatted tick labels (e.g. "123.6°W", "47.3°N") render in dark/soft-dark ink, clearly readable against the cream background. Colorbar on the right is labeled "Elevation (m)" with numeric tick labels (460-4835) in soft ink, clearly legible.
      Data: Continuous elevation field fills the plot in an Imprint sequential teal-to-blue ramp (low elevations teal/green, high elevations blue) — a single-polarity colormap, not a categorical series. Three volcano peaks appear as concentric contour rings (labeled "800 m" through "4800 m" in black text on light background pills) forming a trefoil pattern matching the three named summits. A thin blue-purple river polyline crosses the lower part of the map with an italic "Columbia River" label in muted gray ink — this label has noticeably lower contrast against the green fill than the rest of the chrome text, though it remains readable.
      Legibility verdict: PASS (one minor low-contrast label noted above, not a failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Title and subtitle render in light ink, clearly visible against the dark background. Axis titles and tick labels render in light/soft-light ink, fully legible with no dark-on-dark issues. Colorbar label and tick numbers are light-colored and legible against the dark background. Contour index labels use light-ink text on dark pill backgrounds (chrome correctly inverted from light render).
      Data: The elevation fill and contour ring colors are visually identical to the light render (same teal-to-blue Imprint sequential ramp) — confirms data colors are held constant while only chrome (ink, pill backgrounds, contour-line stroke color, page background) flips between themes. The river polyline and its "Columbia River" label are light-toned here and read with good contrast against the dark background — better contrast than the equivalent light-theme label.
      Legibility verdict: PASS.
