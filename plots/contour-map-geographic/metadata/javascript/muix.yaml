review:
  strengths:
  - Composes the map from ChartsContainer + ChartsXAxis/ChartsYAxis with a custom
    ContourLayer that reads useDrawingArea(), so the contours, fill and labels live
    in MUI X's own coordinate system and the axes stay theme-adaptive
  - 'Cartographic index/intermediate contour hierarchy: 1000 m index lines at 2.2
    px / 0.85 opacity, 500 m intermediate lines at 1 px / 0.42 opacity, labels only
    on the index lines, so the three peaks read at a glance'
  - Plot area aspect corrected by cos(mean latitude), so the longitude and latitude
    degrees are true to scale for a real map region
  - Contour lines drawn in the ink token flip from near-black (light) to near-white
    (dark) while the imprint_seq fill stays identical; every label sits in a page-colored
    pill and stays readable in both themes
  - Real-world setting (Mount Rainier, Mount Adams, Mount St. Helens with their real
    summit heights) and a meaningful 500 m / 1000 m interval, with the saddle where
    the 1000 m contour merges the three peaks
  weaknesses:
  - 'SC-02 (both): the geographic basemap is a single 7-vertex ''Columbia River''
    polyline along the bottom edge; there are no coastlines, borders or terrain context,
    so the map reads as an abstract contour plot with lat/lon ticks → add a real basemap
    layer (e.g. state border Washington/Oregon along the Columbia, a few more river
    courses or terrain shading) beneath the contours, as the first Notes bullet asks.
    Likely cause: RIVERS holds one coarse polyline and nothing else is drawn as basemap.'
  - 'SC-02 (both): the fill is a continuous per-cell gradient rather than bands between
    contour levels, so filled regions do not match the line levels (the ''filled bands
    … that match the line levels'' property) → quantize each cell''s color to the
    band between its enclosing LEVELS (or drop the fill for a line-only version).
    Likely cause: CELLS color uses the continuous frac of the cell mean instead of
    the level band index.'
  - 'SC-04 (both): the elevation color bar is ticked at 460, 1441, 2421, 3402, 4382
    m — non-round values unrelated to the 500 m contour levels → tick it at the contour
    levels (500, 1000, … 4000 m) so the legend reads in the same round units as the
    lines. Likely cause: COLORBAR_TICKS fractions [0, 0.25, 0.5, 0.75, 1] of the raw
    min–max range.'
  - 'VQ-05 (both): the aspect-locked map occupies only ~58 % of the canvas width,
    leaving ~330 px (display) of empty page on each side of a landscape canvas → widen
    the sampled longitude range (or narrow the latitude range) so the map fills ~80
    % of the width while keeping the cos(lat) aspect. Likely cause: sampleLonMin/Max
    span 3.2° against a 1.8° latitude span.'
  - 'Suggestion: the low-elevation background (460–520 m) fills most of the map with
    one saturated brand-green slab; a lighter fill opacity would let a basemap show
    through.'
  - 'Suggestion: a small summit marker under each peak name would anchor the names
    to the summits.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the map area is filled with the imprint_seq gradient (brand green #009E73 at 460 m to blue #4467A3 at the Rainier summit).
      Chrome: title "contour-map-geographic · javascript · muix · anyplot.ai" bold dark ink, centered (~36 % width); grey subtitle with grid size, range and contour intervals; y-axis "Latitude (°)" with ticks 45.5°N–47.3°N, x-axis "Longitude (°)" with ticks 123.6°W–120.4°W; vertical color bar right with title "Elevation (m)" and ticks 460/1441/2421/3402/4382. All text readable.
      Data: dark-ink contour lines: bold index lines every 1000 m, thin intermediate lines every 500 m; closed loops around Mount Rainier (top), Mount St. Helens (left) and Mount Adams (right), merged by the 1000 m contour; two thin 500 m lines run off the top/bottom edges. Labels "1000 m", "2000 m", "3000 m", "4000 m" in off-white pills on the index lines; peak names in pills; italic "Columbia River" grey polyline along the bottom. First data color is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; the imprint_seq fill is identical to the light render.
      Chrome: title, subtitle, axis titles, ticks and color bar text flip to light ink and are clearly readable; no dark-on-dark text.
      Data: contour lines flip to near-white (same index/intermediate weights), label pills become dark with light text, the river becomes light grey; data fill colors identical to light.
      Legibility verdict: PASS
