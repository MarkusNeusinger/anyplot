review:
  strengths:
  - 'Real-world accurate geography: peak positions and elevations closely match the
    actual Mauna Kea (4207 m) and Mauna Loa (4169 m) summits on Hawai''i Island, giving
    DQ-03 near-perfect factual grounding.'
  - 'Distinctive D3-geo + d3-contour integration: contour polygons are computed in
    grid-index space and reprojected into lon/lat before being rendered through geoPath,
    a technique that is genuinely specific to D3''s ecosystem.'
  - 'Contour value labels use a stroke halo (paint-order: stroke) and cardinal-direction
    placement so they stay legible over both light and dark chrome without colliding
    with the isolines.'
  - Continuous elevation data correctly uses the imprint_seq colormap (brand green
    -> blue), with identical data colors between the light and dark renders and theme-correct
    backgrounds/text in both.
  - Combines filled hypsometric bands, thinner interior isolines, an emphasized 0
    m coastline, and a labeled colorbar with tick marks -- covering both the filled
    and line-only contour requirements from the spec.
  weaknesses:
  - Interior isolines are thin (1px) and drawn at 50% opacity, which is a little subtle
    against the sequential fill bands once the PNG is scaled down to ~400px mobile
    width -- consider a slightly heavier stroke-width or opacity for the mid-density
    bands.
  - The rectangular four-sided map frame departs from the style guide's default L-shaped-spine
    preference; acceptable for a geographic map, but a lighter/thinner frame stroke
    would reduce visual weight and read closer to the house style.
  - Only one terrain feature type (twin volcanic peaks) is demonstrated -- a labeled
    saddle point or secondary coastal feature would further round out DQ-01 feature
    coverage in a future iteration.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "Hawai'i Island Elevation · contour-map-geographic · javascript · d3 · anyplot.ai" is bold dark ink, clearly readable and comfortably sized (~55% of canvas width). Longitude/latitude tick labels ("156.2°W" ... "20.2°N") are dark-gray, small but legible. Faint lon/lat graticule lines are visible over the light background. Colorbar on the right is titled "Elevation (m)" with dark tick labels at 0/1000/2000/3000/4000 m.
      Data: A two-peak island silhouette (Hawai'i Island shape) rendered as concentric sequential-color bands from teal-green (low elevation, near #009E73) through blue (high elevation, near #4467A3), matching imprint_seq. A bold dark coastline traces the 0 m isoline, thinner semi-transparent isolines mark intermediate elevation bands, and white-haloed labels ("1000 m", "2000 m", "3000 m", "4000 m") sit at the outer edge of their respective rings without overlapping data or each other.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis tick labels, colorbar title/ticks, and the graticule all switch to light-colored ink/gray tones and remain fully legible against the dark background. No dark-on-dark text was found.
      Data: The same two-peak elevation gradient (teal-green to blue) as the light render -- colors are visually identical between the two themes, only the chrome (background, text, coastline stroke color reference) adapts. Contour labels keep their halo (now a dark stroke) so they stay readable over both the pale-green fill and the near-black background outside the island.
      Legibility verdict: PASS -- all text is clearly readable against the dark background, no dark-on-dark failures observed.
