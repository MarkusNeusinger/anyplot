review:
  strengths:
  - 'Genuinely idiomatic d3-contour + d3-geo combination: raw elevation grid is contoured
    in index space via d3.contours(), then every ring coordinate is reprojected into
    lon/lat and rendered through a fitted geoMercator + geoPath — a distinctive D3
    feature pairing that is hard to replicate in other charting libraries.'
  - 'Elevation values are factually grounded: the two synthetic peaks (4207 m / 4169
    m) match the real-world summit elevations of Mauna Kea and Mauna Loa on Hawai''i
    Island almost exactly, and the derived 0 m isoline produces a recognizable, closed
    island coastline.'
  - Both filled hypsometric bands and line-only isoline detail are rendered together,
    satisfying the spec's 'support both line-only and optional filled contours' requirement
    in one composition.
  - Contour value labels (1000/2000/3000/4000 m) are placed via a compass-direction
    extremum search per ring rather than a fixed arc fraction, keeping the four callouts
    spread around the island's open flanks with no overlap.
  - 'Theme chrome is pixel-perfect: background, title ink, and coastline/tick colors
    were verified by direct pixel sampling to match the exact Imprint tokens (#FAF8F1/#1A1A17
    background, #1A1A17/#F0EFE8 ink) in both renders, and the imprint_seq green→blue
    data colors are identical across light and dark.'
  - Colorbar legend with units ('Elevation (m)') and tick labels is present and correctly
    scaled to the data's max elevation band.
  weaknesses:
  - 'Unbalanced canvas utilization (VQ-05): pixel measurement shows the map box occupies
    only x=795..2204 (44% width) and the colorbar sits at x=2939..2992, leaving a
    ~735px (23% of canvas width) dead gap between the map''s right edge and the colorbar,
    plus a ~795px (25%) blank margin on the far left with only tick labels in it.
    Map+colorbar together cover only ~38-40% of total canvas area. Recommend either
    tightening barX to sit closer to mapX1, shrinking margin.left/right so the near-square
    geographic bbox (lon range 1.35° × cos(19.6°)≈1.27° ≈ lat range 1.3°) is not stranded
    inside a 16:9 frame, or switching to `//# anyplot-orientation: square` so the
    map itself fills most of the canvas.'
  - 'CQ-01 KISS structure: the implementation defines two named helper functions (`elevationAt`,
    `idxToLonLat`) plus a nested-loop callback for label placement, deviating from
    the library skeleton''s flat Imports→Data→Plot→Save structure. Understandable
    given the coordinate-transform reuse, but worth flattening or minimizing where
    possible.'
  - Colorbar's topmost value (maxBand = 4500) has no tick label since colorbarTicks
    is capped at 4000 — the top of the gradient reads as unlabeled blue with no numeric
    anchor.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at (50,50) = RGB(250,248,241) = #FAF8F1, exact match to the light-theme token — not pure white.
      Chrome: Title "Hawai'i Island Elevation · contour-map-geographic · javascript · d3 · anyplot.ai" centered top, dark ink, pixel-sampled darkest title pixel = RGB(26,26,23) = #1A1A17 exact match. Lat/lon tick labels (e.g. "156.2°W", "20.2°N") in soft gray along bottom/left. Colorbar titled "Elevation (m)" with tick values 0/1000/2000/3000/4000 to the right. Contour value labels ("1000 m".."4000 m") sit inside their rings with a white halo, fully legible against the colored fill. Thin gray lon/lat graticule visible under the fill. All chrome text clearly visible against the light background.
      Data: A teardrop/pill-shaped island outline (dark ink coastline) fills with a green-to-blue sequential gradient (imprint_seq) — green (~RGB 0-25,150-160,115-140, matching #009E73 at the coastline) transitioning to blue (~RGB 50-60,110-120,150-160, matching #4467A3) at the two summit cores. Two distinct high-elevation cores (twin volcano peaks) are visible, one north, one south, joined by a saddle of mid-elevation bands. Thin isolines subdivide the fill into stepped bands.
      Legibility verdict: PASS — no light-on-light text found; all title/axis/colorbar/contour-label text reads clearly against the #FAF8F1 surface.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at (50,50) = RGB(26,26,23) = #1A1A17, exact match to the dark-theme token — not pure black.
      Chrome: Same title text now in light ink, pixel-sampled lightest title pixel = RGB(240,239,232) = #F0EFE8 exact match. Tick labels, colorbar title/ticks, and contour-value label halos all flipped to light-on-dark and remain legible. The coastline stroke (drawn with the theme "ink" token) correctly renders as a light outline against the dark background instead of the black line used in the light render — this is expected theme-adaptive chrome behavior, not a data-color change. Graticule lines are faint but visible.
      Data: Confirmed identical to the light render — the same green-to-blue imprint_seq gradient anchors the coastline (~#009E73) to the twin summit cores (~#4467A3); only the surrounding chrome (background, ink, coastline stroke) flipped polarity, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures found; all chrome text and data remain fully readable, and the "brand green" reads consistently well on the dark surface.
