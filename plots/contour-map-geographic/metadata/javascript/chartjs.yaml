review:
  strengths:
  - 'All three Attempt 1 weaknesses are fixed: the ''Summit'' legend swatch is now
    a triangle matching the map marker, minor contour lines are more visible (alpha
    0.25→0.38, width 0.8→1.1), and colorbar ticks are snapped to round 250 m values
    (750/2250/3500) instead of raw min/mid/max'
  - True marching-squares isolines computed from scratch via a contourOverlay afterDraw
    plugin, since Chart.js has no native contour/geo chart type
  - Both filled elevation bands and line-only isolines are present, satisfying the
    spec's 'support both' requirement
  - Index contours (every 1000 m) are bolder and carry elevation-value labels with
    opaque background boxes, while minor contours (every 200 m) are visually subordinate
    but now clearly legible
  - Hand-drawn colorbar correctly uses the Imprint sequential colormap (green→blue)
    instead of a generic/terrain colormap
  - Full theme-adaptive chrome with no dark-on-dark or light-on-light failures in
    either render; data colors identical across themes
  - Wilderness-boundary polygon + summit marker overlay gives real geographic anchoring
    beyond an abstract x/y contour plot
  - Fully deterministic, in-memory synthetic elevation data with no RNG dependency
  weaknesses:
  - The script carries several small helper functions (hexToRgb, lerpColor, seqColor,
    edgePx) alongside the marching-squares implementation — justified by the algorithm's
    complexity, but denser than a typical anyplot KISS script
  - Minor (200 m) contour lines, while improved, are still somewhat subtle against
    the mid-tone elevation bands — acceptable but not a strength
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Mount Rainier Foothills · contour-map-geographic · javascript · chartjs · anyplot.ai" in dark ink, clearly readable. Legend shows a dashed-line swatch for "Wilderness boundary" and a triangle swatch for "Summit" (now matching the actual map marker shape). Axis titles "Longitude"/"Latitude" and tick labels ("121.85°W" … "46.95°N") are legible. Colorbar title "Elevation (m)" and ticks (750/2250/3500 — round values) are legible.
      Data: Filled elevation bands run brand green (#009E73, low) → blue (#4467A3, high, near the summit) — the Imprint sequential colormap, confirmed as first-series green. Isolines are dark, bold + labeled ("1000 m", "2000 m", "3000 m") every 1000 m, with visible minor lines every 200 m. Dashed wilderness-boundary polygon and filled triangular summit marker in dark ink.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: All chrome (title, legend, axis titles, tick labels, colorbar title/ticks) flips to light ink and stays legible. Contour-value label boxes flip to dark opaque backgrounds with light text — no dark-on-dark failure since the box uses the page-background token. No dark-on-dark or light-on-light issues found anywhere, including in the zoomed crops of title, legend, and colorbar regions.
      Data: Elevation bands (green→blue) and isolines confirmed identical in color to the light render — only chrome flipped. Isolines flip to light gray/white and remain visible against the mid-tone bands.
      Legibility verdict: PASS

    Zoomed-crop check (title bar, colorbar, all four canvas edges, both themes): no text/data overlap, no clipping at canvas borders, fill extends cleanly to axis bounds with no background gaps at the grid edges.
