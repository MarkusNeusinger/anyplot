review:
  strengths:
  - Implements true marching-squares isolines from scratch via a `contourOverlay`
    afterDraw plugin, since Chart.js has no native contour/geo chart type — a genuinely
    distinctive use of the library's plugin architecture
  - Both filled elevation bands and line-only isolines are present, satisfying the
    spec's 'support both' requirement
  - Index contours (every 1000 m) are bolder and carry elevation-value labels with
    opaque background boxes, while minor contours (every 200 m) are visually subordinate
    — a clear, legible hierarchy
  - Hand-drawn colorbar (gradient + ticks + axis title) correctly uses the Imprint
    sequential colormap (`t.seq`, brand green → blue) instead of a generic/terrain
    colormap, per the style guide's continuous-data rule
  - 'Full theme-adaptive chrome: page background, ink, soft-ink, and label backgrounds
    all read the ANYPLOT_TOKENS correctly in both renders, with no dark-on-dark or
    light-on-light failures'
  - Title fontsize scales down proportionally for the long descriptive-prefixed title,
    keeping it inside the ~50-70% width guideline
  - Wilderness-boundary + summit overlay gives the plot real geographic anchoring/context
    beyond an abstract x/y contour plot
  - Fully deterministic, in-memory synthetic elevation data (Gaussian peaks) with
    no RNG dependency
  weaknesses:
  - Legend swatch for 'Summit' is a plain filled rectangle, but the actual map marker
    is a triangle — the legend glyph doesn't visually match what it represents on
    the map
  - Minor (non-index) contour lines are drawn at low weight/alpha (0.8px, 25% opacity)
    and are quite faint against the mid-tone elevation bands in both themes, especially
    the dark render — increase opacity or width slightly so they remain scannable
    without competing with the index lines
  - Colorbar tick labels show raw data min/mid/max (748 / 2187 / 3626) rather than
    round, easy-to-scan numbers — consider snapping colorbar ticks to round values
    (e.g. nearest 250 m or 500 m) for faster reading
  - The script carries several small helper functions (hexToRgb, lerpColor, seqColor,
    edgePx) alongside the marching-squares implementation — justified by the algorithm's
    inherent complexity, but denser than a typical anyplot KISS script
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Mount Rainier Foothills · contour-map-geographic · javascript · chartjs · anyplot.ai" in dark ink, clearly readable, sized appropriately for its length. Legend ("Wilderness boundary" dashed-line swatch, "Summit" rectangle swatch) in dark text, readable. Axis titles "Longitude"/"Latitude" and tick labels ("121.85°W" ... "46.95°N") in dark/soft-dark ink, all legible. Contour value labels ("1000 m", "2000 m", "3000 m") sit in opaque light boxes with dark text, clearly readable against the colored bands beneath them. Colorbar "Elevation (m)" title and tick numbers (3626/2187/748) in dark ink, legible.
      Data: Filled elevation bands run from brand green (#009E73, low elevation) to blue (#4467A3, high elevation, near the summit) — the Imprint sequential colormap. Isolines in dark gray, bold+labeled every 1000 m, faint every 200 m. Dashed wilderness-boundary polygon and a filled triangular summit marker in dark ink.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend, axis titles, and tick labels all render in light ink (readable). Contour value label boxes flip to dark opaque backgrounds with light text — no dark-on-dark: the box uses the same page-background token as the surrounding chart area, so text stays high-contrast against its own box, and the box separates cleanly from the (differently colored) elevation band beneath it. Colorbar title/ticks in light ink, legible.
      Data: Filled elevation bands use the identical green (#009E73) → blue (#4467A3) sequential colormap as the light render — confirmed unchanged. Isolines flip to light gray/white (theme-adaptive ink token), bold+labeled every 1000 m, faint every 200 m — the faint minor lines are somewhat low-contrast against the mid-tone bands but still discernible. Dashed boundary and summit marker flip to light ink with dark outline, consistent with the light render's shapes.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures. Only the non-indexed contour lines are visually faint (a Visual Quality deduction, not a legibility/theme failure since it affects both themes equally).
