review:
  strengths:
  - 'Clever, constraint-respecting engineering: core Highcharts has neither a heatmap/colorAxis
    module nor a maps module loaded, so the raster fill, colorbar legend, and isoline
    tracing (marching squares) are all built from genuine primitives (chart.renderer,
    real spline series) rather than faking or switching libraries.'
  - Correct sequential Imprint colormap (imprint_seq, green->blue) for single-polarity
    elevation data, with data colors verified identical between light and dark renders.
  - 'Theme-adaptive chrome is fully correct in both renders: label boxes, boundary
    line, legend box, and text all flip appropriately with no dark-on-dark or light-on-light
    failures.'
  - Realistic, neutral alpine elevation scenario with four differently-sized peaks
    and a sensible 300 m contour interval.
  weaknesses:
  - Geographic context is limited to one synthetic dashed 'survey area boundary' polygon
    - no coastline, political border, or terrain-shading cue, so the 'geographic basemap'
    spec requirement is only partially met. Consider adding a second reference polyline
    (e.g., a stylized ridge/valley line or a secondary administrative-style border)
    to reinforce the geographic framing.
  - Isoline contrast is a bit low against the raster on the dark render (both gradient
    ends sit close in perceived lightness to the near-black backdrop) - consider a
    slightly higher-contrast stroke treatment (e.g., blend toward t.ink/t.pageBg instead
    of purely toward seq[1]) for the line color on dark theme specifically.
  - 'Design Excellence has room to grow: the raster currently reads as flat, evenly-weighted
    terrain - introduce a stronger single focal point (e.g., dashed peak-label callouts
    on the tallest massif, or subtle emphasis/legend ordering by peak) to sharpen
    the data-storytelling.'
  - Several non-trivial helper functions (marching squares, polyline stitching) depart
    from the KISS 'no functions' ideal - necessary here since core Highcharts has
    no built-in contour algorithm, but worth flagging for the code-quality bar.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "contour-map-geographic · javascript · highcharts · anyplot.ai" and gray subtitle, both clearly visible. Longitude/Latitude axis titles and tick labels (with ° units) are dark and fully readable. Contour-level label boxes (900 m, 1500 m, 2100 m, 2700 m, 3300 m) are white boxes with dark text - readable, no overlap. Custom "Elevation" colorbar legend on the right with dark text on a light elevated-bg box.
      Data: Smooth green-to-blue sequential raster (Imprint imprint_seq) representing elevation, overlaid with thin darker isolines. Dark dashed "Survey area boundary" polygon with matching bottom legend entry.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title and subtitle flip to light text, fully readable. Axis titles/labels flip to light. Contour-level label boxes flip to dark elevated background with light text - correct adaptation, no dark-on-dark failures. Colorbar legend box flips to dark elevated background with light labels.
      Data: Raster and isoline colors are identical to the light render (confirmed - only chrome flipped). Boundary polygon flips to a light dashed line.
      Legibility verdict: PASS (minor note: isoline contrast against the raster is somewhat lower than in the light render since both gradient ends sit closer in perceived lightness to the near-black backdrop, but every line and label remains distinguishable - not a legibility failure)
