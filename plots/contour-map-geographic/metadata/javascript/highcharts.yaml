review:
  strengths:
  - Creative use of Highcharts' SVGRenderer to draw a genuine data-colored elevation
    raster (chart.renderer.rect) and a custom colorbar legend, since core Highcharts
    ships no heatmap/colorAxis module — a technically sound workaround, not a fake
    visual.
  - From-scratch marching-squares implementation traces real isolines as genuine Highcharts
    point-series data (hover-enabled), not decorative SVG paths, satisfying the requirement
    for real library series.
  - Correct imprint_seq sequential colormap (green to blue) for elevation; data colors
    are identical between light and dark renders, and all chrome (title, axis, tick
    labels, custom legend text, contour labels) is fully theme-adaptive and legible
    in both themes.
  - 'Clear focal point: the highest peak is called out with an amber-marked triangle
    and label, and its isoline is rendered thicker and more prominent, creating a
    strong data-storytelling hierarchy.'
  - Realistic, geographically-plausible alpine elevation data (420-3597 m across a
    real lon/lat bounding box) with four distinct peak massifs, giving good feature
    coverage of contour density and elevation range.
  weaknesses:
  - The hand-drawn 36x20 elevation raster is visibly coarse/blocky (individual rect
    cell edges are noticeable, especially in the flat green low-elevation areas) —
    increasing the grid resolution (e.g. 60x40) would give smoother-looking shading
    without changing the marching-squares logic.
  - Title occupies a noticeably smaller share of the canvas width than the ~70-85%
    typical for the mandated title string at default fontsize — not a defect (still
    fully legible, no overlap or clipping), but there is room to grow it slightly
    for stronger visual hierarchy.
  - Heavy reliance on custom chart.renderer drawing (raster fill + colorbar legend)
    rather than Highcharts' native chart/legend primitives is a necessary workaround
    given the missing colorAxis/heatmap module, but it means the implementation doesn't
    showcase Highcharts' highest-level idiomatic API for this data type.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "contour-map-geographic · javascript · highcharts · anyplot.ai" and subtitle render in dark ink, clearly visible; longitude/latitude tick labels and axis titles are dark/soft-dark and fully legible; the "Elevation" colorbar card at top-right has a light card fill with dark text; contour-level labels ("900 m", "2100 m", "2700 m", "3300 m") and the "Highest peak · 3597 m" callout sit in light label boxes with dark text, fully readable against the underlying raster; bottom legend ("Survey area boundary", "Ridge crest (reference)", "Highest peak") is dark-on-light and legible.
      Data: A green-to-blue sequential raster (imprint_seq) fills the whole survey grid, darkening toward the four peak massifs; isolines are a muted blue-gray tone blended toward ink for contrast against the raster; the highest-peak marker is an amber-filled triangle with a dark outline; boundary/ridge reference lines are dashed/dotted in a soft ink tone. First data-bearing element (the raster fill low end and gradient) begins at imprint_seq[0] = #009E73-family green, consistent with the sequential Imprint scale.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light/off-white ink, clearly visible against the dark background; axis titles and tick labels are light soft-gray and fully legible; the "Elevation" colorbar card has a dark elevated-surface fill with light text; contour-level labels and the "Highest peak · 3597 m" callout use dark label boxes with light text (correctly inverted from the light render, not dark-on-dark); bottom legend text is light-on-dark and legible.
      Data: The raster gradient (green to blue) is visually identical to the light render — same hues, same spatial pattern, confirming data colors do not shift with theme; isolines are the same blue-gray family but blended slightly more toward the light ink tone for contrast against the darker raster (a deliberate, theme-adaptive structural choice, not a change to the data-color mapping); the amber peak marker is identical to the light render; boundary/ridge reference lines are dashed/dotted in a lighter soft-ink tone appropriate for the dark surface.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; every text element sits on a background with adequate contrast in its own theme.
