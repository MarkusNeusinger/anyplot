review:
  strengths:
  - Filled and line contours with a color bar titled Elevation (m) over a coastline
    and state-border basemap
  - Geographic aspect correction via coord_fixed(1/cos 40°)
  - Range names and reference cities anchor the highs to real places
  - Theme-adaptive text tokens for title, axes and legend
  weaknesses:
  - 'VQ-07 (both): the bands use a custom dark-green → tan → near-white terrain gradient
    and the canvas shows pure-black strips at the left and right → the imprint_seq
    field ramp with the theme''s stops and a page-colored canvas. Likely cause: scale_fill_gradient2(low=''#1a5e1a'',
    mid=''#c4a35a'', high=''#f5f5f5''); coord_fixed leaves the canvas transparent
    without a gggrid page-color wrap.'
  - 'VQ-05 (both): the coord_fixed map sits between two wide black strips instead
    of on the page color → wrap the plot in a one-panel gggrid that carries PAGE_BG.
    Likely cause: ggsize applied directly to the coord_fixed plot.'
  - 'VQ-01 (dark): the range names (Teton Range, Rocky Mts., Wasatch Range, Sierra
    Nevada) are soft-gray #B8B7B0 on the pale tan/near-white high bands and nearly
    vanish → text on a contrasting plaque or ink. Likely cause: geom_text color=INK_SOFT
    without a background.'
  - 'VQ-02 (both): ''1500m'' collides with ''Boise'', ''4000m'' runs into ''Teton
    Range'', and the dashed border crosses ''Sierra Nevada'' → labels clear of each
    other and of the borders. Likely cause: fixed contour-label positions chosen without
    a keep-out around place names.'
  - 'SC-02 (both): contour lines are drawn with bins=12 over a ~1,100–6,600 m range
    (a ~460 m step) while the labels claim 500 m levels, and the low lines in the
    flat corners are jagged → explicit 500 m breaks and smooth low isolines. Likely
    cause: geom_contour/geom_contourf bins=12; randn*30 noise on a flat base.'
  - 'DQ-03 (both): the color bar reaches about 6,600 m with SLC near the summit, while
    real summits in the region stay under about 4,400 m → peaks of about 3,000–4,400
    m (about −2,200 m). Likely cause: overlapping Gaussian peaks with 2–2.5° spreads
    summed on a 1,200 m base.'
  - 'Suggestion: a slightly warmer top stop would keep the highest peaks distinct
    from the light page.'
  image_description: |-
    Light render (plot-light.png):
      Background: #FAF8F1 inside the plot box, but the canvas shows wide pure-black strips (about 270 px each at display scale) at the left and right edges where the coord_fixed plot box leaves the canvas transparent.
      Chrome: title, axis titles 'Longitude (°W)' / 'Latitude (°N)', ticks and the 'Elevation (m)' color bar in dark ink, readable.
      Data: filled contours on a custom dark-green → tan → near-white terrain gradient, dark-gray contour lines, blue coastline, dashed state borders, bold unboxed contour values 1500m–5000m, italic range names in soft ink, purple city names and ringed markers. '1500m' collides with 'Boise', '4000m' runs into 'Teton Range', the Sierra Nevada name is crossed by a border.
      Legibility verdict: PASS with collisions (text readable, several labels overlap).

    Dark render (plot-dark.png):
      Background: #1A1A17 inside the plot, with the same pure-black side strips.
      Chrome: title, axis titles, ticks and color bar text in light ink, readable.
      Data: the same terrain gradient as the light render, light contour lines, light bold contour values. The range names (Teton Range, Rocky Mts., Wasatch Range, Sierra Nevada) are soft-gray #B8B7B0 text on the pale tan/near-white high bands and nearly vanish.
      Legibility verdict: FAIL (range names barely readable on the pale bands)
