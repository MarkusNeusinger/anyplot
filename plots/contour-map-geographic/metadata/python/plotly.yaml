review:
  strengths:
  - Filled bands and colorbar use the Imprint SEQ_FIELDS ramp with each theme's own
    stops; chrome threads INK/INK_SOFT/ELEVATED_BG through both renders
  - Native Plotly geo basemap (Natural Earth coastlines, borders, land, ocean) themed
    for light and dark
  - Meaningful 2 °C contour interval with labels every 4 °C and a colorbar naming
    the variable and unit
  - Ring winding normalised by shoelace area so every band fills its interior correctly
  - Isoline hover templates show each level's value in the HTML output
  weaknesses:
  - 'VQ-02 (both): isoline value labels (8°C, 12°C, 16°C, 20°C) are centred on their
    lines, so the 1.5 px line strikes through the text, and the Ireland and Azores
    annotation boxes sit on isolines → labels clear of the line stroke (a page-colored
    halo/background on the label text, or the line broken under the label). Likely
    cause: mode=''text'' traces at the segment midpoint with no background.'
  - 'SC-02 (both): the opaque filled field covers the coastlines of Ireland, Iberia,
    the Azores and the Newfoundland shelf, so the basemap is not legible beneath the
    isolines (characteristic bullets 1 and 4) → keep coastlines visible over the bands
    (translucent fills, or coastlines drawn above the fills). Likely cause: fully
    opaque fillcolor from sample_colorscale with coastlines in the geo layer below
    the traces.'
  - 'SC-03 (both): the place annotations use paper coordinates and miss their places
    — ''Azores'' sits near 33°N 20°W (islands at 38°N 28°W, hidden under the field),
    ''Ireland'' near 49°N (island at 53°N) → label each place at its own lat/lon.
    Likely cause: layout annotations with xref/yref=''paper'' instead of Scattergeo
    text at geographic coordinates.'
  - 'VQ-05 (both): the geo frame spans only about 55 % of the canvas width with wide
    empty bands left of it and between it and the colorbar, and the 30–60°N field
    fills only part of the frame → let the map fill the plot area (tighter lon/lat
    ranges around the data, smaller side gaps). Likely cause: lataxis_range [27, 63]
    / lonaxis_range [-64, 4] plus the Mercator aspect inside margin l=70, r=120.'
  - 'Suggestion: a stepped colorbar matching the 2 °C band levels would tie the legend
    to the filled bands.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; geo frame with light blue ocean (#C5D8E8) and beige land.
      Chrome: title 'North Atlantic SST · contour-map-geographic · python · plotly · anyplot.ai' in dark ink, centred, ~65 % width; colorbar 'Temperature (°C)' with ticks 5–20 in INK_SOFT on an elevated box; place labels Newfoundland, Ireland, Azores in dark ink on white boxes — all readable.
      Data: opaque filled bands from mint (#66E2B2) in the cold north through #009E73 to navy (#002850) in the warm south, dark-grey isolines every 2 °C, labels 8/12/16/20 °C sitting on their lines (line passes through the text). The field rectangle (30–60°N, 60–0°W) covers the coasts of Ireland, Iberia and the Azores; coastlines visible only outside it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; dark navy ocean and dark khaki land.
      Chrome: title, colorbar title and ticks, and place labels in light ink on #242420 boxes; no dark-on-dark text.
      Data: same geometry; the continuous ramp uses the dark stops (#00573D → #009E73 → #CDD9FF), isolines in light grey, labels in light ink. Same overlap of labels with lines and same coverage of land by the field as in the light render.
      Legibility verdict: PASS
