review:
  strengths:
  - Overlay is registered on pygal's own tick guides (polyfit of guide pixel vs value),
    so fills, isobars and coastlines sit exactly on the lon/lat axis
  - contourpy computes both the isobars and the filled band polygons, giving bands
    that follow the lines exactly
  - Opaque bands with a stepped colorbar whose swatches and ticks match the map levels
    one to one, titled Pressure (hPa)
  - Ochre coastlines above the fill and a heavy/thin isobar weight split keep basemap
    and contours distinct in both themes
  - Theme-correct imprint_seq fields stops in both renders; boxed labels use the elevated
    surface token
  - Isobar labels placed on vertices of their own line, kept clear of the edges and
    of each other
  weaknesses:
  - 'SC-02 (both): C1 — the isobars are jagged polylines with spurious noise islands
    (tiny closed loops near 122°E/50°N, 237°E/54°N and 139°E/20°N) instead of smooth
    isolines → a smooth field so each level traces one clean line (noise sd about
    0.1 hPa or less, or smooth the grid before contouring). Likely cause: rng.normal(0,
    0.3, field.shape) added to the 40 x 40 field.'
  - 'DQ-02 (both): the basemap reads as a sketch rather than the North Pacific rim:
    Japan is one open polyline, the Alaska coast runs flat along 60°N from 205°E to
    220°E, Kamchatka is a closed hexagon → coastline vertices that follow the real
    shapes (more points per segment). Likely cause: the hand-typed COASTLINES list.'
  - 'Suggestion: label the heavy isobars (996, 1004, 1012, 1020, 1028) or make the
    labelled 8 hPa levels the heavy ones; the `level % (ISOBAR_STEP * MAJOR_EVERY)
    == 0` filter currently selects only the thin lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and plot area.
      Chrome: title "North Pacific Pressure Isobars · contour-map-geographic · python · pygal · anyplot.ai" in dark ink, axis titles "Longitude (°E)" / "Latitude (°N)", ticks 120-240 and 20-60, colorbar titled "Pressure (hPa)" with ticks 996-1028 — all dark text, readable.
      Data: opaque filled bands from the light end of imprint_seq (#66E2B2 mint, the Aleutian low near 185°E/55°N) through #009E73 to deep navy/violet (the subtropical high near 200°E/33°N); heavy near-black isobars every 8 hPa alternating with thin soft-ink ones at 4 hPa; ochre #BD8233 coastlines (Asia, Japan, Kamchatka, Aleutians, Alaska, west coast of North America); boxed labels 1000, 1008, 1016, 1024 on their lines. Isolines are jagged with a few tiny noise loops.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and colorbar labels in light ink, all readable; no dark-on-dark text.
      Data: the dark imprint_seq fields stops (dark olive #404C02 at the low through #009E73 to pale lavender #CDD9FF at the high), as the theme requires for a continuous ramp; isobars in light ink, coastlines in the same ochre as light; labels on dark elevated boxes with light text.
      Legibility verdict: PASS
