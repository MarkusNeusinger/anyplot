review:
  strengths:
  - Isobars are continuous closed polylines from marching squares with linear edge
    interpolation, every 4 hPa, with a major/minor weight hierarchy
  - Pressure field uses the Imprint sequential ramp with the theme's fields stops,
    so both renders are theme-correct
  - Theme tokens threaded through pygal Style and every injected SVG element; text
    readable in both themes
  - Plausible North Pacific pressure scenario with standard 4 hPa synoptic intervals
  - pygal XY chart with interactive SVG output in the HTML
  weaknesses:
  - 'SC-03 (both): the fill, isobars and labels are mapped onto the whole plot rect
    (x 362-2939, y 220-1526) while pygal''s axis puts 120°E at x≈412 and 240°E at
    x≈2890 (and 20-65°N inside about 1256 of the 1306 px), so the overlay is stretched
    about 2.4° in longitude at each edge and about 1° in latitude against the ticks
    and the coastlines → place every overlay point with the same value-to-pixel mapping
    as the axis (about +50 px inset left/right). Likely cause: hard-coded plot_x/plot_width/plot_height
    taken from the background rect, not from the axis scale with pygal''s padding.'
  - 'SC-03 (both): the colorbar swatches are drawn at full opacity while the map fills
    sit at 0.55 opacity over the page, so the map''s 1020-1028 bands read grey-violet
    (light) / grey-teal (dark) and match no swatch → draw the key with the same opacity
    as the fills, or the fills opaque. Likely cause: <g opacity="0.55"> wraps the
    cells but not the colorbar rects.'
  - 'SC-02 (both): C1 — the coastlines are 2.5 px INK_MUTED lines under the 0.55-opacity
    fill, the same tone and weight as the minor isobars, so Japan, Kamchatka and the
    Asian coast cannot be told apart from contours → draw the basemap in a distinct
    style (e.g. land fill or a heavier, differently colored coastline above the fill).
    Likely cause: Style colors=(INK_MUTED,)*n and stroke_width=2.5 shared with the
    minor isobars.'
  - 'SC-02 (both): C3 — isobar labels are placed at hard-coded lon/lat spots, not
    on their lines: ''1008'' at 215°E/55°N floats with no line through it, ''1000''
    sits inside the innermost loop rather than on it, ''1004'' sits off its line →
    place each label on a vertex of its own level''s polyline. Likely cause: label_positions
    list of fixed coordinates.'
  - 'SC-02 (both): C4 — filled bands are cell-average squares, so band edges step
    in a blocky staircase that does not follow the isobars (visible around the 1012
    and 1024 lines) → fill the polygons between the computed levels. Likely cause:
    one rect per grid cell colored by its 4-corner mean.'
  - 'SC-01 (both): unrequested H/L pressure-centre annotation layer (blue ''L'', violet
    ''H''), which also collides with the ''1000'' and ''1024'' label boxes → remove
    the letters. Likely cause: the centers loop at the end of the overlay code.'
  - 'CQ-04 (code): lines 220-323 write out marching squares and an O(n²) segment chainer
    that contourpy computes → contourpy.contour_generator(lon_grid, lat_grid, PRESSURE).lines(level)
    (installed with matplotlib), then map to pixels. Likely cause: hand-rolled contour
    algorithm.'
  - 'Suggestion: name the variable on the colorbar (''Pressure (hPa)'') rather than
    the unit alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'North Pacific Pressure Isobars · contour-map-geographic · python · pygal · anyplot.ai' in dark ink (~80 % width), axis titles 'Longitude (°E)' / 'Latitude (°N)', ticks 120-240 and 20-60, colorbar labels 996-1032 with 'hPa' title; all dark and readable.
      Data: filled pressure cells along the Imprint sequential light ramp at 0.55 opacity (pale green lows near the Aleutians, grey-blue highs in the subtropics), continuous isobars every 4 hPa (major every 8 hPa thick INK, minor thin INK_SOFT) forming closed loops around the Aleutian Low, a secondary low off Japan and the Pacific High; isobar value labels in boxes; thin muted coastlines; blue 'L' and violet 'H' centre letters.
      Legibility verdict: PASS

