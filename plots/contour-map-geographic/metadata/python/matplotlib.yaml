review:
  strengths:
  - Filled field on the current Imprint imprint_seq fields stops of each theme (light
    mint → brand green → deep blue → dark violet; dark olive → brand green → pale
    blue), with a colorbar 'Elevation (m)' 0–4500 in 500 m steps and an extend arrow
    for the summits above 4500 m
  - Smooth isolines on the same 500 m levels as the filled bands, labelled every 1000
    m via clabel(levels=line_levels[1::2]) on page-colored halo boxes that stay readable
    in both themes
  - Peak bumps are raised to the real summit heights, so the Mont Blanc 4808 m, Matterhorn
    4478 m and Großglockner 3798 m callouts agree with the bands they sit in
  - Dashed country borders carry a 'Country border' legend key on an elevated-surface
    frame
  - Idiomatic contourf + contour + clabel layering with inline_spacing and the returned
    Text objects styled via set_bbox; fig.colorbar with extend='max'
  weaknesses:
  - 'VQ-02 (both): the Matterhorn leader line crosses the ''4000 m'' contour label
    at about 7.7°E, 46.2°N, and the dashed northern border runs into the left edge
    of the ''2000 m'' label at about 13°E, 47.9°N → leader and border clear of the
    labels. Likely cause: the Matterhorn callout offset (dx=-1.0, dy=0.8) and clabel
    placing labels where the border passes.'
  - 'Suggestion: a slightly lighter contour-line alpha in the dark render would let
    the pale-blue summit bands read more clearly.'
