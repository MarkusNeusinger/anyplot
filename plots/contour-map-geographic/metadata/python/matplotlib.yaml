review:
  strengths:
  - Filled field on the Imprint imprint_seq fields stops of each theme, with a colorbar
    'Elevation (m)' 0-4500 in 500 m steps and an extend arrow for the summits above
    4500 m
  - Smooth isolines on the same 500 m levels as the filled bands, labelled every 1000
    m via clabel(levels=line_levels[1::2]) on page-colored halo boxes readable in
    both themes
  - Peak bumps raised to the real summit heights, so the Mont Blanc 4808 m, Matterhorn
    4478 m and Großglockner 3798 m callouts agree with the bands they sit in
  - Idiomatic contourf + contour + clabel layering with inline_spacing and the returned
    Text objects styled via set_bbox; fig.colorbar with extend='max'
  weaknesses:
  - 'VQ-02 (both): the dashed northern border starts at about 8.0°E, 47.7°N on the
    ''m'' of the ''1000 m'' contour label and is drawn over it → label text unobstructed
    by the border. Likely cause: the border''s first vertex (8.0, 47.7) and zorder=4
    above the clabel text.'
  - 'SC-02 (both): the basemap is four hand-placed dashed polylines that only roughly
    follow the real borders, with no coastline: the Adriatic at about 12-14°E, 44-45.5°N
    is drawn as 0-500 m land, so C1''s geographic basemap is thin → a coastline and
    border outline that trace the real geography. Likely cause: the hard-coded borders
    list and no coastline layer (cartopy is not installed; a denser lon/lat outline
    does it).'
  - 'Suggestion: a slightly lighter contour-line alpha in the dark render would let
    the pale-blue summit bands read more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the map frame is filled with the contour field
