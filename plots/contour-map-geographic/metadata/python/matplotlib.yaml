review:
  strengths:
  - Filled field on the Imprint imprint_seq fields ramp with the exact per-theme stops;
    colorbar 'Elevation (m)' with extend arrow
  - Contour labels at 500 m intervals in INK on page-colored halo boxes, readable
    in both themes
  - Idiomatic contourf + contour + clabel layering with styled returned label Text
    objects
  - Fully theme-adaptive chrome; all text readable in both renders
  weaknesses:
  - 'VQ-02 (both): the ''2000 m'' and ''2500 m'' contour labels at about 12.5–13.5°E,
    47.7–47.9°N touch each other and the dashed border line runs through ''2000 m''
    → labels clear of each other and of the border by at least a few px, thinned where
    the 2000–3500 m lines crowd. Likely cause: ax.clabel labelling every 500 m level
    with automatic placement on the steep NE flank (pass a level subset or manual
    positions).'
  - 'SC-02 (both): filled bands step 200 m (levels=np.arange(0, 5000, 200)) while
    the lines step 500 m, so band edges do not match the line levels (C4) → bands
    on the line levels or an even subdivision of them (e.g. 250 m or 500 m). Likely
    cause: the separate levels/line_levels arrays.'
  - 'SC-02 (both): σ=80 m random noise makes the isolines jagged and scatters dozens
    of tiny spurious loops in the SE and along 48.5°N, so the lines are not smooth
    (C1) → noise of a few metres or a smoothed field. Likely cause: np.random.normal(0,
    80, ...) added to the elevation grid.'
  - 'SC-04 (both): the dashed lines (country borders) carry no key or label, so a
    reader cannot tell what they are → a legend entry ''Country border'' or direct
    country labels. Likely cause: ax.plot for borders without label and no ax.legend.'
  - 'Suggestion: the Matterhorn leader line crosses the ''4500 m'' contour label;
    a different callout offset would keep it clear.'
