review:
  strengths:
  - Filled field on the Imprint imprint_seq ramp with a colorbar 'Elevation (m)' and
    extend arrow
  - Contour labels in ink on page-colored halo boxes, readable in both themes
  - Idiomatic contourf + contour + clabel layering with styled returned label Text
    objects
  - Peak callouts name real Alpine summits with their real heights
  weaknesses:
  - 'VQ-02 (both): the ''2000 m'' and ''2500 m'' contour labels at about 12.5–13.5°E,
    47.7–47.9°N touch each other and the dashed border runs through ''2000 m'' → labels
    clear of each other and of the border, thinned where the 2000–3500 m lines crowd.
    Likely cause: ax.clabel labelling every 500 m level.'
  - 'VQ-07 (both): the fields ramp uses outdated imprint_seq stops (light (0.582,
    #4467A3), (1.0, #002850); dark low end #00573D) → the current fields stops (light
    (0.803, #024582), (1.0, #351E45); dark (0, #404C02), (0.487, #009E73)). Likely
    cause: the SEQ_FIELDS lists.'
  - 'SC-02 (both): filled bands step 200 m while the lines step 500 m, so band edges
    do not match the line levels (C4) → bands on the 500 m line levels. Likely cause:
    levels=np.arange(0, 5000, 200).'
  - 'SC-02 (both): σ=80 m noise makes the isolines jagged and scatters many tiny spurious
    loops in the SE and along 48.5°N (C1) → noise of a few metres. Likely cause: np.random.normal(0,
    80, ...).'
  - 'SC-04 (both): the dashed border lines carry no key or label → a ''Country border''
    legend entry. Likely cause: ax.plot without label and no ax.legend.'
  - 'DQ-03 (both): the synthetic massif peaks above 4800 m, so the ''Matterhorn 4478
    m'' callout sits inside the >4500 m band and contradicts the field → field maximum
    about 4800 m so the callouts agree with it. Likely cause: the overlapping 4400
    m and 3600 m Gaussians plus the 400 m base.'
  - 'Suggestion: the Matterhorn leader line crosses the ''4500 m'' contour label;
    a different callout offset would keep it clear.'
