review:
  strengths:
  - Elevation raster uses the current Imprint sequential fields stops for each theme,
    sampled to 256 colors with ramp_color for LinearColorMapper; colorbar spans 0
    to the data maximum
  - Every contour is drawn over a page-colored casing, so the isolines stay readable
    over the pale and the dark end of the ramp in both themes
  - Contour levels at a meaningful 250 m interval with heavier 1000 m major lines
    and value labels every 500 m, thinned by a minimum-distance check
  - 'Idiomatic bokeh: one LabelSet over a ColumnDataSource for all contour labels,
    ColorBar as a right side panel, image glyph with LinearColorMapper, HTML + PNG
    export'
  weaknesses:
  - 'Suggestion: replace the hand-drawn coastline polyline and the short border stub
    with real coastline/border coordinates for a more faithful basemap.'
  - 'Suggestion: the 1500 m and 2500 m levels carry no label at all; a looser distance
    threshold could label each labelled level at least once.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 around the map, colorbar panel included.
      Chrome: title 'contour-map-geographic · python · bokeh · anyplot.ai' in dark ink; 'Longitude (°W)' / 'Latitude (°N)' axis titles and -125..-117 / 42..49 ticks readable; colorbar 'Elevation (m)' 0-2500; legend bottom right (Coastline (approx.) blue, OR / WA Border dashed purple) on an elevated box.
      Data: Imprint fields ramp pale mint lowlands -> brand green -> deep blue -> dark violet at the two Cascade highs; dark contours every 250 m over a light casing, heavier at 1000 m; bold labels 500m, 1000m, 2000m on light boxes; N. Cascades ~2,591 m and S. Cascades ~2,627 m with inverted-triangle markers; blue coastline on the west edge, dashed purple border stub at 46.2°N.
      Legibility verdict: PASS

