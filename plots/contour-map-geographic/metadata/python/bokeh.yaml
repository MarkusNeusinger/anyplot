review:
  strengths:
  - Elevation raster uses the Imprint sequential fields ramp with each theme's own
    stops, sampled to 256 colors with ramp_color for LinearColorMapper, and the colorbar
    spans 0 to the data maximum
  - Contour levels at a meaningful 250 m interval with heavier 1000 m major lines
    and value labels every 500 m, thinned by a minimum-distance check
  - 'All chrome threads theme tokens: title, axes, legend, colorbar panel, label boxes
    read correctly on #FAF8F1 and #1A1A17'
  - 'Idiomatic bokeh: one LabelSet over a ColumnDataSource for all contour labels,
    ColorBar as a right side panel, image glyph with LinearColorMapper, HTML + PNG
    export'
  weaknesses:
  - 'VQ-03 (dark): the light-grey INK_SOFT contour rings around both peaks fade into
    the pale-blue (#CDD9FF end) peak cells of the dark ramp and are hard to follow
    → contour ink that keeps contrast over the high end of the field (e.g. INK at
    higher alpha, or a thin page-colored casing under the line). Likely cause: line_color=INK_SOFT,
    line_alpha=0.85 for every level.'
  - 'DQ-03 (both): peaks of ~4,281 m and ~4,313 m on a ridge that stays above 3,000
    m across about 2° of longitude exceed the real Cascades (major summits 3,200-4,400
    m, ridge mostly 1,500-2,500 m) → peaks near 3,000-3,400 m on a ~2,000 m ridge
    (about −1,000 m). Likely cause: cascade_elevation = cascade_height * 3000 * (1
    + 0.3*sin(...)) on top of the 1,000 m base.'
  - 'Suggestion: replace the hand-drawn coastline polyline with Natural Earth coastline/border
    coordinates for a more faithful basemap.'
  image_description: |-
