review:
  strengths:
  - Imprint sequential field ramp with the correct per-theme stops through scale_fill_gradientn(values=...)
  - Isohalines cased (page-colored halo under an ink line) and readable over every
    part of the ramp in both themes
  - Isolines computed on a land-masked grid so they stop at the coast; labels every
    0.5 psu placed along their lines on open water
  - Plausible Mediterranean salinity field (Atlantic inflow, Rhône/Po/Black Sea freshening,
    salty Levantine) with a 0.25 psu interval and a unit-bearing colorbar
  - Flat, deterministic script; contourpy and matplotlib Path do the computation instead
    of hand-rolled code
  weaknesses:
