      Data: filled contours in BrBG_r (teal negative, brown positive, pale grey near 1 °C) with extend arrows, colorbar -2 to 4; dark contour lines at whole degrees with 8 pt inline labels; opaque tan continents with grey-brown coastlines drawn over the field and lines; field speckled by noise into many tiny islands. Side panel: purple #C475FD zonal-mean line that zigzags as a sawtooth, purple fill, dotted 60°N line, 6 pt purple 'Arctic Amplification' label.
