review:
  strengths:
  - All chrome uses theme tokens; title, labels and ticks flip correctly and stay
    readable in both renders
  - Continents are opaque and clearly legible in both themes
  - Contour lines at whole degrees with inline '%.1f°C' labels and a colorbar with
    unit
  - Reproducible, flat script with clean imports and correct output filenames
  weaknesses:
  - 'VQ-07 (both): the field uses BrBG_r and the zonal-mean series is purple #C475FD
    → imprint_div built from DIV_FIELDS (theme stops) for the field and #009E73 for
    the single series. Likely cause: cmap=''BrBG_r'' and HIGHLIGHT=''#C475FD''.'
  - 'SC-03 (both): the zonal-mean line zigzags as a sawtooth because seaborn sorts
    the points by x (anomaly) instead of latitude → a profile drawn in latitude order.
    Likely cause: sns.lineplot(x=zonal_mean, y=lat) without orient=''y'' (or sort=False).'
  - 'SC-02 (both): the opaque continents are drawn above the filled field and contour
    lines (zorder 3 vs 1–2), so no isoline is visible over land → draw lines above
    the land and make the land translucent or outline-only. Likely cause: ax_map.fill(...,
    zorder=3) with contour zorder=2.'
  - 'SC-02 (both): isolines are jagged with dozens of single-cell closed loops instead
    of smooth lines → smooth isolines. Likely cause: noise * 0.3 on a 5° grid.'
  - 'DQ-01 (both): the 0.3 °C noise speckles the field into tiny islands that hide
    the large-scale anomaly structure → noise around 0.1 or smoothed. Likely cause:
    np.random.randn(32, 72) * 0.3.'
  - 'VQ-01, VQ-03 (dark): contour lines and inline labels in light ink sit on the
    pale grey centre of the non-adaptive BrBG_r field, so labels such as ''1.0°C''
    and ''2.0°C'' are hard to read → a field whose midpoint is the dark page color,
    keeping light lines readable. Likely cause: one cmap for both themes.'
  - 'VQ-01 (both): the ''Arctic Amplification'' annotation is 6 pt, below the 8 pt
    reference → 8 pt (+2 pt). Likely cause: fontsize=6.'
  - 'VQ-02 (both): inline contour labels (''2.0°C'' at top centre, ''0.0°C'' near
    150°E) are crossed by small noise loops → labels on clear line segments, which
    smoother data gives. Likely cause: the noisy field.'
  - 'Suggestion: finer coastline vertices would make the continents less blocky.'
