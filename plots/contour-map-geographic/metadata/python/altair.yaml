review:
  strengths:
  - Contour paths computed with contourpy and drawn as true isolines via detail +
    order encodings
  - Real TopoJSON country borders via alt.topo_feature under a shared Mercator projection
  - Theme tokens threaded through title, color bar and isolines; chrome correct in
    both renders
  weaknesses:
  - 'VQ-01 (both): the contour labels ''15°C'' and ''25°C'' render as solid blobs
    because the 2 px halo stroke (x4 scale) covers the 13 px glyphs → readable labels.
    Likely cause: mark_text with fill and stroke on the same layer; draw a halo layer
    under a plain text layer.'
  - 'VQ-07, SC-02 (both): the field uses BrBG (warm = green, cold = brown) with the
    same stops in both themes → the imprint_div fields ramp with the theme''s page
    midpoint (C5). Likely cause: scheme=''brownbluegreen''.'
  - 'VQ-03 (both): isolines at strokeWidth 0.9 are thin, and in dark the light isolines
    almost vanish on the pale northern field → about 1.4 with a field that contrasts
    with them. Likely cause: mark_line strokeWidth=0.9 and the light-only colormap.'
  - 'SC-02 (both): isolines are jagged with dozens of small spurious islands, not
    smooth lines (C1) → smooth isolines. Likely cause: noise sigma 0.3 on a 5 °C-scale
    field.'
  - 'SC-02 (both): only two labels for the visible levels, the 20 °C line unlabelled
    (C3) → labels on every visible level. Likely cause: label filter limited to levels
    -5, 5, 15, 25 in a lon/lat box.'
  - 'VQ-05 (both): the map fills about 70 % of the canvas with wide empty margins
    and the borders spill past the field on the right → fill the canvas. Likely cause:
    W, H = 600, 310 padded to 3200x1800 without autosize fit.'
  - 'SC-03 (both): the color bar domain is fixed at -10..30 while the data spans about
    3..31, so its lower third is never used → derive the domain from the data. Likely
    cause: scale domain=[-10, 30].'
  - 'Suggestion: a finer raster would remove the visible square grid in the field.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; the map occupies only about 70 % of the canvas with wide empty margins.
      Chrome: title in dark ink, readable; color bar 'Temp (°C)' with ticks -10 to 30 on a light box, readable, title touching the frame.
      Data: Mercator map of Europe with grey borders (spilling past the field on the right) over a BrBG field in pale teal to deep teal; the brown lower half of the color bar never appears. Thin dark isolines at 15, 20 and 25 °C, jagged with dozens of small noise islands. Two labels '15°C' and '25°C' render as white blobs: the white halo stroke covers the glyphs.
      Legibility verdict: FAIL (contour labels unreadable)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 around the map.
      Chrome: title and color bar text in light ink, readable.
      Data: the same light BrBG field as the light render (no dark stops), so a pale teal block sits on the dark page; isolines flip to light ink and almost vanish on the pale northern field; the two labels render as dark blobs.
      Legibility verdict: FAIL (contour labels unreadable)
