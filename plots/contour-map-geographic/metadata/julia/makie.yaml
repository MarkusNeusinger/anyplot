review:
  strengths:
  - Factually accurate real-world elevation data for named Cascade Range volcanoes
    (Mount Rainier 4392 m, Mount Baker 3286 m, Mount Adams 3743 m, Glacier Peak 3213
    m, Mount St. Helens 2549 m all match real published elevations)
  - 'Theme-adaptive chrome is fully correct in both renders: page background, spines,
    grid opacity, tick/label colors, legend box, and colorbar all flip cleanly between
    #FAF8F1/#1A1A17 while data colors (imprint_seq gradient) stay identical'
  - Labeled index contours (500-2000 m) combined with filled contour bands satisfy
    both the line-only and filled-contour requirements from the spec simultaneously,
    using a custom labelformatter for clean '<value> m' labels
  - Custom coastline mask (poly! over a sine-perturbed boundary) cleanly separates
    land/water with no rendering artifacts at the mask edge
  - 'No overlap, no edge clipping, and good canvas utilization across both renders;
    colorbar is directly linked to the contourf plot object using the imprint_seq
    gradient (#009E73 to #4467A3), correct for single-polarity elevation data'
  weaknesses:
  - 'Peak-name text!() labels use strokewidth=1.3 against a fontsize=12 bold font,
    which is thick enough that the PAGE_BG halo color visually dominates over the
    intended INK fill: in the light render the peak names render mostly off-white
    instead of dark ink, and mostly dark instead of light in the dark render. Still
    legible against the mid-toned teal/blue contour fill, but the fill/halo balance
    is inverted from what the color=INK, strokecolor=PAGE_BG code intends -- reduce
    strokewidth to ~0.8-1.0 (or bump fontsize slightly) so INK stays the dominant
    fill color in both themes.'
  - 'LM-02: contour labeling and colorbar-linking are solid but not deeply distinctive
    to Makie specifically -- similar capabilities exist in matplotlib/ggplot2. Leaning
    on a more Makie-unique technique (e.g. a custom recipe, GeoMakie-style projection
    touch, or layout composition) would raise distinctiveness.'
  - 500 m contour interval is coarser than the spec's own example of ~100 m for elevation
    data; reasonable given the 0-4500 m range shown, but a tighter labeled interval
    (e.g. every 250 m) nearer the summits would read as more deliberately 'meaningful'
    per the spec's guidance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) on the water/masked region west of the coastline; matches spec.
      Chrome: Title "Cascade Range Volcanoes · contour-map-geographic · julia · makie · anyplot.ai" in dark ink, fully readable. Longitude/Latitude axis titles and °W/°N tick labels in dark ink and soft dark-gray respectively, all clearly legible. Legend ("Puget Sound coastline", "Volcanic peak") sits bottom-right in an elevated off-white box with dark text and a soft border -- fully readable. Colorbar labeled "Elevation (m)" with dark ticks/labels on the off-white background -- fully readable. Grid lines are faint and subtle.
      Data: Filled elevation contours run from green (#009E73, low elevation) to blue (#4467A3, high elevation, matching the imprint_seq gradient), with black contour lines and labeled index contours (500-2000 m) in "X m" format. Five volcanic peaks are marked with dark triangles and labeled with name + elevation; the label text itself renders mostly off-white with a thin dark outline (a halo effect that keeps it legible against the mid-toned contour fill even though it's the reverse of the code's literal INK-fill/PAGE_BG-halo intent). Puget Sound coastline is a soft dark-gray wavy line separating land from the masked water area.
      Legibility verdict: PASS -- all chrome text is dark-on-light and clearly legible; peak-name halo labels are legible via outline contrast despite the fill/halo inversion noted above.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) on the water/masked region, matches spec.
      Chrome: Title, axis titles, and tick labels all render in light ink/soft-light-gray, clearly legible against the dark background. Legend box is a dark elevated surface with light text and a light border, fully readable. Colorbar labels are light-colored and legible against the dark background. Grid lines are faint and subtle, consistent with the light render's density.
      Data: Filled elevation contours and contour-line colors are pixel-identical to the light render (same green-to-blue imprint_seq gradient, same peak marker positions) -- only chrome flipped as expected. Contour lines and index-contour labels render in white/light ink instead of black. Peak-name labels render mostly dark with a light outline (again the halo dominates over the literal fill color, but stays legible against the mid-toned fill). Coastline line renders in a light soft-gray, clearly distinguishable from the near-black water.
      Legibility verdict: PASS -- no dark-on-dark or light-on-light failures; all chrome is theme-correctly flipped and data colors match the light render exactly.
