review:
  strengths:
  - Synthetic Puget Sound coastline anchors the contour map in real geography, satisfying
    the 'geographic basemap' requirement without a mapping dependency
  - Both filled and line contours are present, with index contours labeled at meaningful
    500 m intervals using Makie's native contour labeling (labels=true, labelformatter)
  - Five real named Cascade volcanoes with accurate lat/lon and roughly accurate elevations
    provide an engaging, factually grounded dataset
  - Theme-adaptive chrome (spines, grid, axis colors, legend box, coastline mask)
    correctly flips between light and dark renders; imprint_seq data colors stay identical
    across themes
  - Canvas is exactly 3200x1800 with generous, balanced margins and no clipped elements
    at the borders
  weaknesses:
  - 'Peak-name labels (text!(... color=INK, strokecolor=PAGE_BG, strokewidth=3)) render
    with the stroke visually dominating the fill because strokewidth=3 is large relative
    to labelsize=11 pixels of glyph. Pixel-sampled the dark render: bulk label fill
    is (26,26,23)=#1A1A17 (dark ink), not the intended light INK; only a thin rim
    of the light fill color is visible. Result: dark-ink text sits on the mid-tone
    teal/blue contourf fill in the dark render, measured contrast ~3.5:1 (below WCAG
    AA 4.5:1 for normal text). Fix: reduce strokewidth to ~1.2-1.5 so the fill color
    reads as dominant, matching how the built-in contour-line labels already render
    correctly with their auto background box.'
  - Design Excellence is solid (labeled peaks, coastline context, gradient fill) but
    not yet publication-tier polish — index-contour value labels and peak-name labels
    use similar weight/size, so at a glance they read as one label class rather than
    two; a small visual differentiation (bolder peak names, or a subtle background
    chip only on peak names) would sharpen the hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Cascade Range Volcanoes · contour-map-geographic · julia · makie · anyplot.ai" is bold, dark, centered at top and fully visible. Longitude (bottom, °W-formatted ticks) and Latitude (left, °N-formatted ticks) axis labels and tick labels are dark/soft-dark and clearly readable. L-shaped spine (top/right removed), subtle ~12% opacity gridlines. Colorbar on the right labeled "Elevation (m)" with ticks 0-4500, dark text, fully visible with comfortable right margin. Legend box (bottom-right, cream elevated background) with "Puget Sound coastline" and "Volcanic peak" entries, dark readable text.
      Data: Filled contour uses the imprint_seq green (#009E73) to blue (#4467A3) sequential gradient — five raised "volcano" mounds (Mount Baker, Glacier Peak, Mount Rainier, Mount St. Helens, Mount Adams) each marked with a dark upward-triangle marker and a name+elevation text label. Index contour lines (500 m interval) are labeled inline (e.g. "500 m", "1500 m", "2000 m") with a small light background chip behind each — these read cleanly. A wavy dark coastline separates the cream (masked, unmapped) ocean area to the west from the green landmass.
      Legibility verdict: PASS. All chrome text (title, axis, ticks, colorbar, legend) is crisp. The five peak-name annotations are also legible in this theme — pixel-sampling shows their bulk fill renders as the light PAGE_BG color (#FAF8F1) against the mid-tone contour fill, ~5.3:1 contrast, comfortably above AA.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, axis labels/ticks, colorbar labels, legend box (dark elevated #242420 background) all correctly flip to light-colored text (#F0EFE8 / #B8B7B0) and remain fully readable against the dark background — no dark-on-dark chrome failures. Spines, grid, and coastline stroke are light-toned and subtle, matching the theme.
      Data: Colors are identical to the light render — same imprint_seq green-to-blue fill, same peak positions and coastline shape; only the chrome flipped, as required.
      Legibility verdict: PASS overall, with one flagged issue: the five peak-name text labels (drawn via a manual text!() call with color=INK, strokecolor=PAGE_BG, strokewidth=3) do NOT read as light text in this theme as the code intends. Because strokewidth=3 is large relative to labelsize=11, the stroke visually dominates the glyph and the bulk of each label renders in the dark ink color (#1A1A17) sitting on the mid-tone teal/blue contour fill — pixel-sampled contrast ~3.5:1, below the WCAG AA 4.5:1 target (though the text remains distinguishable, not fully "unreadable"). This is distinct from — and does not affect — the built-in contour-line value labels ("500 m", "1500 m", etc.), which use Makie's automatic label background box and render with correct, strong contrast in both themes.
