review:
  strengths:
  - 'Correct P&F column-construction algorithm: strictly enforces box size and reversal-boxes
    rules, never mixes X/O within a column'
  - Spec-mandated green/red bull/bear semantic coloring correctly maps to Imprint
    palette positions 1 and 5 (the sanctioned finance loss/gain exception)
  - Support/resistance 45°-per-column trend lines add genuine analytical value and
    create a natural visual focal point where they cross
  - Theme-adaptive chrome (spines, grid alpha, tick/label colors, legend) is correctly
    threaded through both renders — verified readable with no dark-on-dark or light-on-light
    failures
  - X-axis correctly represents columns (reversals), not time, matching the defining
    P&F convention from the spec
  weaknesses:
  - 'Design Excellence is close to a well-configured default: beyond the spec-mandated
    bull/bear colors there''s little original aesthetic layer — consider one deliberate
    design touch (e.g. a subtitle/annotation calling out the support/resistance crossover
    as a breakout signal, or a refined legend panel with subtle elevated background)
    to lift DE-01–03'
  - Library Mastery usage is generic — leverage a feature more distinctly Makie's
    own (e.g. text! annotations at the swing high/low that anchor the trend lines,
    or linesegments!/band! to highlight the crossover zone) to raise LM-02 beyond
    "generic usage"
  - Y-axis gridlines are spaced every $10 (5× box size) rather than at the box-size
    interval the spec's optional note suggests ("Consider adding a price scale on
    the Y-axis with grid lines at box size intervals") — not required, but worth a
    look during repair if it doesn't clutter the axis
