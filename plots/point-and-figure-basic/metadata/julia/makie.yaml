review:
  strengths:
  - 'Correct P&F column-construction algorithm: strictly enforces box size and reversal-boxes
    rules, never mixes X/O within a column'
  - Breakout star + bold 'Breakout' callout at the analytic support/resistance intersection
    gives the chart an immediate, clear focal point (directly resolves the prior review's
    storytelling feedback)
  - Explicit Legend object with an elevated-background panel (ELEVATED_BG, padding,
    rowgap) reads as a deliberately composed panel rather than a default axislegend
  - text! annotations anchoring 'Swing high' / 'Swing low' to the points that seed
    each trend line make the analytical basis of the lines legible instead of implicit
  - Theme-adaptive chrome (spines, grid alpha via RGBAf, tick/label colors, legend
    background) is correctly threaded through both renders with no dark-on-dark or
    light-on-light failures
  - Spec-mandated green/red bull/bear semantic coloring correctly maps to Imprint
    palette positions 1 and 5 (the sanctioned finance loss/gain exception); amber
    breakout star correctly uses the semantic caution/callout anchor rather than a
    stray hex
  - X-axis correctly represents columns (reversals), not time, matching the defining
    P&F convention from the spec
  weaknesses:
  - Title fontsize-scaling formula shrinks the long descriptive title to only ~39%
    of canvas width — well under the 50-70% comfortable range and the 70-85% expected
    for the mandated format; not an overflow/clipping problem, so not a hard deduction,
    but there's room to raise the fontsize floor slightly for extra-long titles
  - Y-axis gridlines are spaced every $10 (5x box size) rather than at the box-size
    interval; still fine and not required by the spec, just an optional polish item
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Dark, fully legible title "NovaTech Inc. — box $2.00, reversal 3 · point-and-figure-basic · julia · makie · anyplot.ai" centered at top (comfortably within canvas bounds, no clipping). Axis labels "Column (Price Reversal)" and "Price ($)" in dark ink. Tick labels in a softer secondary gray. Subtle horizontal Y gridlines (~15% alpha). Top/right spines removed. Legend top-right sits inside a subtly elevated off-white panel (no visible frame border) listing "Bullish (X)", "Bearish (O)", "Support", "Resistance", "Breakout signal".
      Data: Green X markers (#009E73) for bullish columns, red-outlined open-circle O markers (Imprint position 5, #AE3030) for bearish columns — never mixed within a column. Two black dashed 45-degree trend lines (support rising, resistance falling) converge near column 10-11 at an amber 5-point star marked "Breakout" in bold dark text. Small secondary-gray "Swing high" / "Swing low" annotations anchor the trend-line origin points.
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend, annotations, breakout callout) is clearly readable against the light background; no light-on-light issues found in close crops of the title, legend, y-axis tick column, or breakout/swing-low annotation regions.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: All chrome flipped — title/axis labels in off-white, tick labels/legend/annotations in a softer light gray, trend lines rendered as white dashes, gridlines faint light gray on dark. Legend panel uses the dark elevated background (#242420-consistent) rather than the plain page background, giving it a distinct "card" look. Spines and layout otherwise match the light render.
      Data: X/O marker colors, star fill, and star stroke are pixel-identical to the light render (green #009E73, matte red outline, amber star) — confirmed no shift in data colors between themes; only surrounding chrome changed.
      Legibility verdict: PASS — no dark-on-dark failures observed anywhere, including the "Swing low"/"Swing high" secondary-gray annotations and the bold white "Breakout" callout text, both of which sit with clear contrast against the near-black background.
