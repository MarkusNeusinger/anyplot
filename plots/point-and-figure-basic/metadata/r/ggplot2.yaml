review:
  strengths:
  - 'Correct P&F construction: $2 boxes, 3-box reversal, 9 alternating single-symbol
    columns on a column-index axis'
  - 'X in #009E73 and O in #AE3030, backed by glyph shape, with bold monospace symbols
    that read as P&F marks'
  - guide_legend(override.aes = list(label = ...)) turns the legend keys into the
    X/O glyphs themselves
  - All chrome threaded through theme tokens; both renders readable
  weaknesses:
  - 'VQ-02 (both): the 45-degree dashed trend lines and the opaque grid lines run
    straight through the centers of X/O glyphs (column 3 at 58/60, column 4 at 58/60,
    columns 7-9 around 50-52) → keep lines clear of the glyph strokes. Likely cause:
    geom_segment rays extended to x_end over later columns, and panel.grid lines placed
    exactly on the symbol rows.'
  - 'VQ-03 (dark): the alpha-0.45 trend lines fade to near-invisible dark maroon and
    dark teal on #1A1A17, the red resistance lines barely visible → raise their contrast
    on the dark surface (alpha about 0.7-0.8 or a thicker line). Likely cause: geom_segment(alpha
    = 0.45, linewidth = 0.55).'
  - 'VQ-07 (both): grid drawn in opaque INK_SOFT, reading high-contrast in the dark
    render → the style guide''s grid token, ink at 15 % alpha. Likely cause: panel.grid.major/minor
    = element_line(color = INK_SOFT).'
  - 'SC-02 (both): a 45-degree ray starts at every X column low and every O column
    high and runs to the right edge through later columns, so 9 crisscrossing lines
    replace support lines connecting ascending lows and resistance lines connecting
    descending highs (C4) → draw the lines from the significant lows/highs only and
    end each where price breaks it. Likely cause: support_df/resist_df built from
    all x_col_ids/o_col_ids with xend = x_end.'
  - 'CQ-01 (code): helper functions floor_box() and build_pf() break the Imports →
    Data → Plot → Save structure → inline the box-floor expression and the column-building
    loop. Likely cause: the P&F algorithm wrapped in functions.'
  - 'Suggestion: coord_fixed() with square boxes would let the 45-degree lines run
    diagonally and pack the 9 columns closer together.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: bold dark title 'point-and-figure-basic · r · ggplot2 · anyplot.ai' (~55% width), axis titles 'Price (USD)' and 'Column (Reversal #)', ticks 42-74 every $4 and columns 2-8; grid at $2 rows and column positions; framed legend right 'O Bearish' / 'X Bullish' with glyph keys. All readable.
      Data: 9 columns alternating X (#009E73) and O (#AE3030), bold monospace glyphs; dashed green 45-degree rays from every X column low and red rays from every O column high, extended to the right edge and crisscrossing through later columns.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink, legend on #242420 with light border; no dark-on-dark text. Grid lines read fairly bright (opaque INK_SOFT).
      Data: identical green/red glyph colors; the alpha-0.45 trend lines become dim dark teal/maroon, the red ones barely visible.
      Legibility verdict: PASS
