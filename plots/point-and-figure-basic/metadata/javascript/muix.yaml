review:
  strengths:
  - Correct classic close-only Point & Figure box/column construction algorithm with
    a clear, configurable box size ($1.5) and 3-box reversal threshold.
  - Idiomatic, advanced use of MUI X's composition API (ChartContainer + useXScale/useYScale)
    to render fully custom X/O glyph marks — MUI X has no native P&F series type,
    so building marks directly on the shared band/linear scales is genuinely the recommended
    pattern and a distinctive library capability.
  - Correct financial semantic color exception applied deliberately (brand green =
    bullish/rising, matte red = bearish/falling) instead of default ordinal palette
    order, with a clear custom legend explaining the mapping.
  - 'Both light and dark renders are fully theme-correct: warm off-white / near-black
    backgrounds, all text readable, and data colors identical across themes.'
  - Custom horizontal price-scale grid lines at box-size intervals, addressing the
    spec's optional Y-axis scale suggestion.
  - Deterministic, reproducible synthetic data (seeded LCG) producing a realistic
    ~1.5-year mid-cap stock price path with clear reversals.
  - Clean, well-commented KISS-style code with no fake interactivity and only the
    imports actually used.
  weaknesses:
  - 'Missing a spec-required feature: the specification''s Notes explicitly instruct
    to ''Draw support trend lines connecting ascending lows (45-degree up) and resistance
    trend lines connecting descending highs (45-degree down)'' — unlike the following
    ''Consider adding a price scale...'' bullet, this one is phrased as an instruction,
    not a suggestion, and it is entirely absent from the chart. Add 45-degree diagonal
    reference lines anchored on ascending column lows (support) and descending column
    highs (resistance).'
  - The <ChartContainer> is missing the mandatory `skipAnimation` prop required by
    the muix library rules ('Always set both belts — set skipAnimation on every chart
    component') so the harness reliably captures the final frame rather than a mid-tween
    paint; add `skipAnimation` to the <ChartContainer> call.
  - 'Data storytelling is minimal (DE-03): the chart is a faithful but neutral display
    of computed columns with no visual emphasis on trend direction or the support/resistance
    zones the spec calls for — adding the required trend lines would directly address
    this.'
  - Tick label font (12px) is noticeably smaller than the axis label font (15px);
    bumping to ~13-14px would improve balance and mobile legibility without crowding
    the ticks.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "point-and-figure-basic · javascript · muix · anyplot.ai" top-left in bold dark ink; a custom legend top-right with green "X — Rising column" and red "O — Falling column" swatches; axis titles "Column (price reversal, not time)" (x) and "Price ($)" (y), both dark and readable; tick labels ($142.5–$180.0 on y, every 5th column index on x) clearly legible; subtle light-gray horizontal grid lines at box-size intervals; only left/bottom spines visible.
      Data: ~29 columns of stacked X (green, #009E73-like brand green) and O (matte red) glyphs forming a rising overall staircase from ~$140 to ~$182, with clear alternating bullish/bearish columns of varying height and width — no diagonal trend/support-resistance lines are drawn.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink (off-white/cream) against the dark surface; tick labels and axis titles are all clearly legible; grid lines are faint light strokes at reduced opacity, still visible but subtle.
      Data: Identical column layout and identical data colors (same green X's, same matte red O's) as the light render — only the chrome (background, text, grid) has flipped, confirming theme-consistent data colors.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly visible against the dark background.
