review:
  strengths:
  - 'Correct P&F construction from closes: box size $1.5, 3-box reversal, 29 columns
    that alternate X/O, each column one symbol only; spot-checked column 2 (X 141–148.5)
    → column 3 (O 147–144, a 3-box reversal from the top) and columns 26–29'
  - Symbols sit on a regular box lattice (yScale(box) with one box per row) on a band
    x-axis of evenly spaced construction columns, labelled 'Column (price reversal,
    not time)'
  - Support and resistance lines rise or fall exactly one box per column and stop
    when a later column breaks them, matching the spec's 45-degree rule
  - 'Idiomatic MUI X v9 composition: ChartsContainer with ChartsXAxis/ChartsYAxis
    and a custom SVG layer driven by the useXScale/useYScale hooks; the y valueFormatter
    converts box indices back to prices'
  - 'Theme-correct chrome in both renders from ANYPLOT_TOKENS; brand green #009E73
    for X and the semantic red #AE3030 for O, identical in both themes, and shape
    plus color both separate the two directions'
  - Compact header-row legend with bold X/O glyphs and dashed-line samples that match
    the marks
  weaknesses:
  - 'SC-02 (both): the horizontal grid lines are drawn every 3 boxes ($4.5), but the
    y tick labels step every 5 boxes ($7.5), so only every third line (150, 165, 180)
    carries a label. The unlabelled lines at about 147, 156, 160.5, 169.5 and 174
    USD make it hard to read a column''s top and bottom as prices → put the grid at
    box-size intervals (every row) or on the labelled tick values. Likely cause: gridStep
    = Math.round((maxBox - minBox) / GRID_TARGET_DIVISIONS) is independent of the
    axis tickNumber: 10.'
  - 'VQ-02 (both): trend lines start and end on the centers of their anchor glyphs
    and strike through symbols. The column-4 support line runs through the column-5
    O at 147 and ends on the column-6 X at 148.5, and the column-16 line starts inside
    the X at 148.5 → anchor support lines one box below the low (startBox - 1) and
    resistance lines one box above the high (startBox + 1), so the lines run between
    glyphs. Likely cause: y1 = yScale(line.startBox) uses the symbol''s own box.'
  - 'Suggestion: the 22 px title fills only about 35 % of the width. A slightly larger
    title would balance the right-aligned legend row.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: header row with the bold dark title "point-and-figure-basic · javascript · muix · anyplot.ai" on the left and a right-aligned legend (green X "Rising column", red O "Falling column", dashed green "Support", dashed red "Resistance") in ink-soft text. Y axis "Close (USD)" with ticks 142.5–180.0 every 7.5; x axis "Column (price reversal, not time)" with ticks 1, 6, 11, 16, 21, 26. Subtle light-gray horizontal grid lines every 3 boxes. All text is dark on light and readable.
      Data: 29 alternating columns of bold X glyphs (#009E73) and O glyphs (#AE3030) on a regular box lattice, rising from about 140 to 181.5 USD with a sideways phase around 147–154 in columns 7–15. Four dashed green 45-degree support lines (from columns 2/4, 16, 22, 24 and 26) and one dashed red resistance line (columns 7–9), drawn at about 60 % opacity. The lines start on glyph centers, and the column-4 support line passes through the column-5 O at 147.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title is light ink, and the legend, tick labels and axis titles are light ink-soft. All are clearly readable, with no dark-on-dark text. The axis lines are light, and the grid lines are subtle dark gray but visible.
      Data: X and O colors are identical to the light render (green #009E73, red #AE3030), as are the glyph layout and the dashed trend lines. Only the chrome flipped.
      Legibility verdict: PASS
