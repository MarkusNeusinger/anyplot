review:
  strengths:
  - Composes the chart from ChartsContainer with a band x axis (one even step per
    column) and a linear price axis, then draws the X/O glyphs, box lattice and trend
    lines in a custom SVG overlay positioned through the useXScale/useYScale hooks
    — the MUI X v9 composition API used as intended
  - 'Correct P&F construction from closes: 3-box reversal, a single symbol per column,
    strict X/O alternation across all 29 columns, and the x axis titled as columns,
    not time'
  - Box lattice drawn half a box off the tick values, one rule per box, so every glyph
    sits inside its own cell and column tops and bottoms read directly as prices via
    the box-unit valueFormatter
  - Support (rising) and resistance (falling) trend lines run exactly one box per
    column, placed one box beyond the lows/highs so they pass through empty cells
    and never cover a symbol
  - Header row puts the title and a compact legend on one baseline, with legend glyphs
    that reuse the actual X/O characters and dashed diagonal samples in the data colors
  - 'Imprint green #009E73 for X and the semantic red anchor #AE3030 for O, identical
    in both themes; chrome flips cleanly through ANYPLOT_TOKENS'
  weaknesses:
  - 'VQ-03 (dark): the dashed trend lines at 1.5 px and strokeOpacity 0.6 sink into
    the #1A1A17 background — the resistance line between columns 7 and 9 and the support
    segments on the right are hard to pick out → full or near-full opacity (0.85–1.0,
    +0.25 or more) and about 2 px stroke (+0.5 px) so both line types stay visible
    in the dark render. Likely cause: strokeOpacity={0.6} and strokeWidth={1.5} on
    the support/resistance <line> elements.'
  - 'CQ-04 (code): lines 276–325 repeat four near-identical legend-item JSX blocks
    (two glyph+label pairs, two svg-line+label pairs), about 50 lines → map over a
    small array of {mark, color, label} items rendering one item template. Likely
    cause: legend items written out by hand.'
  - 'Suggestion: sizing the chart so a box is about as wide as it is tall would make
    the one-box-per-column trend lines read as true 45-degree diagonals through the
    grid.'
  - 'Suggestion: a named ticker or sector in the y-axis label or data context would
    anchor the generic price series.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white box.
      Chrome: bold title "point-and-figure-basic · javascript · muix · anyplot.ai" top-left (~35 % of width), legend top-right (X Rising column, O Falling column, dashed Support, dashed Resistance) on the same baseline. Y axis "Close (USD)" with ticks 142.5–180.0 every 7.5 (5 boxes of $1.5); x axis "Column (price reversal, not time)" with ticks 1, 6, 11, 16, 21, 26. Thin horizontal box rules between every price row, no vertical grid. All text dark and readable.
      Data: 29 alternating columns, X in brand green #009E73, O in matte red #AE3030, bold ~22 px glyphs, one per box. Price climbs from ~139 to ~182 in a staircase. Four green dashed support lines rise one box per column (cols 2–6, 4–6, 16–29, 22–28, 24–28, 26–28 region) and one short red dashed resistance line falls from column 7 to 9; none crosses a symbol.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend labels, axis titles and tick labels in light ink, all readable; box rules subtle dark grey but visible. No dark-on-dark text.
      Data: X/O colors identical to the light render (green #009E73, red #AE3030); brand green clearly visible. The dashed trend lines at 0.6 opacity are dimmer here than in light, the red resistance line especially low-contrast.
      Legibility verdict: PASS (trend lines dim, see VQ-03)
