review:
  strengths:
  - Genuinely custom Point-and-Figure renderer built on ChartContainer + useXScale/useYScale
    — MUI X has no native P&F series, and this composes the community API (band/linear
    scales, raw SVG marks) exactly as the library prompt encourages instead of falling
    back to a generic chart type
  - 'Correct finance semantic-color exception: rising (X) columns use brand green
    (#009E73), falling (O) columns use the matte-red semantic anchor (#AE3030) for
    loss/bearish — matches the style guide''s documented profit/loss convention rather
    than blind ordinal palette order'
  - 45-degree support/resistance trend lines are computed algorithmically from column
    reversals (not hardcoded) and rendered as subtle dashed overlays that don't compete
    with the X/O data
  - Legend icons precisely mirror the actual rendered glyphs and line styles (X/O
    letterforms, dashed line samples with matching color/opacity), so the legend reads
    as a direct key to the plot
  - 'Both light and dark renders are fully legible: title, axis labels, tick labels,
    and legend text all use theme-adaptive tokens with explicit font sizes, and the
    data colors are pixel-identical between themes'
  - X-axis is explicitly framed as "Column (price reversal, not time)" — directly
    reflects the spec's key note that P&F charts are not time-indexed
  - Deterministic LCG-seeded price series (seed=42) with a realistic $60–$185 mid-cap
    range over 360 sessions gives good column variety — narrow early consolidation,
    a clear uptrend, and choppy reversal zones near the end
  weaknesses:
  - 'Design Excellence is solid but not exceptional: the grid/spine treatment and
    overall composition read as ''well-executed'' rather than ''publication-ready''
    — consider a stronger focal emphasis (e.g. a shaded zone or callout at the most
    recent breakout) to push Data Storytelling further'
  - buildColumns/buildTrendLines are correct but fairly dense (~90 combined lines
    of box-construction and trend-line logic) — a short inline comment on the box-index
    math (why boxIndex is compared via Math.round(price/boxSize)) would help future
    maintainers verify correctness at a glance
  - Title is left-aligned and comparatively small relative to the 3200px canvas width
    (~35%) while the legend occupies the opposite corner — intentional and legible,
    but slightly under the 50-70% proportion guideline for non-mandated-length titles;
    not a defect, just worth noting for consistency with other muix implementations
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "point-and-figure-basic · javascript · muix · anyplot.ai" in bold dark ink, top-left. Legend top-right with four entries (X Rising column / O Falling column / Support / Resistance), each icon matching the actual rendered glyph/line style. X-axis labeled "Column (price reversal, not time)", Y-axis labeled "Price ($)" with dollar-formatted ticks ($142.5–$180.0). Subtle horizontal grid lines at box-size price intervals. All text is dark ink on the light surface and clearly readable.
      Data: ~30 columns of stacked X (green, #009E73) and O (matte red, #AE3030) glyphs forming a P&F ladder that trends from ~$143 up to ~$183, with a clear consolidation band early on and a choppier alternating zone near the right edge. Two dashed green support lines and one dashed red resistance line overlay the data at ~45-degree angles, anchored to reversal-column lows/highs.
      Legibility verdict: PASS — no overlapping text, no clipped elements, title/axis/tick/legend text all crisp against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels, now rendered in light ink/off-white text against the dark surface. Grid lines are faint light-colored horizontal rules at the same price intervals. No dark-on-dark text anywhere — every label, tick, and legend string is clearly legible.
      Data: Identical column layout and identical data colors to the light render — the same #009E73 green X's and #AE3030 red O's, same support/resistance line positions and colors, confirming only chrome (not data hue) flips between themes.
      Legibility verdict: PASS — full theme-adaptive chrome, no legibility regressions relative to the light render.
