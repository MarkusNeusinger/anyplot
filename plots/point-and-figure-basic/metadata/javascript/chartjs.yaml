review:
  strengths:
  - Correctly implements P&F box/column construction (close-based boxing, classic
    3-box reversal) entirely from scratch in Chart.js, which has no native P&F chart
    type
  - 'Clever use of pointStyle: "crossRot"/"circle" scatter markers to faithfully recreate
    the classic X/O visual language, including hollow O markers'
  - Both light and dark renders are clean, correctly themed, and fully legible with
    no clipping or overlap
  - First-series green and semantic-red palette usage is correct, and colors hold
    identical across themes
  weaknesses:
  - 'Missing the spec''s explicit trend-line requirement: "Draw support trend lines
    connecting ascending lows (45-degree up) and resistance trend lines connecting
    descending highs (45-degree down)" — add two line datasets connecting the sequence
    of rising-column lows and falling-column highs to surface the support/resistance
    signal the spec calls out'
  - Y-axis gridlines are at $10 steps rather than the box-size ($1) intervals the
    spec suggests considering; at minimum, consider a lighter secondary gridline or
    tick marks at $1/$5 steps near the price axis so box-size context is visible without
    cluttering the $10 labels
  - Beyond the core X/O recreation, the design stays close to library defaults — no
    visual differentiation for the most recent (still-forming) column vs. completed
    columns, which is a common P&F convention that would add data-storytelling value
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "point-and-figure-basic · javascript · chartjs · anyplot.ai" centered at top in dark ink; legend "X — rising" / "O — falling" below title; axis titles "Column (price reversal sequence)" and "Price ($)" in dark ink; tick labels in soft dark ink. All clearly legible against the light background.
      Data: 25 columns of stacked box markers — green crossRot ("X") markers for rising columns (first series, #009E73 brand green) and hollow matte-red circle ("O") markers for falling columns (#AE3030). Column heights vary with box counts; price range spans roughly $110-$180 with $10 gridline steps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis titles/ticks now rendered in light ink; grid lines subtle but visible against the dark background. All text is clearly legible — no dark-on-dark failures observed (title, axis labels, tick labels, legend all readable).
      Data: Column layout, box counts, and marker placement are pixel-identical to the light render. Data colors (brand green X, matte red O) are unchanged between themes — only chrome flipped.
      Legibility verdict: PASS
