review:
  strengths:
  - Faithfully implements the classic close-only 1-box / 3-box-reversal Point-and-Figure
    algorithm, correctly starting a new column only after a reversal of the configured
    box count
  - Each column contains only X's or only O's, never mixed, matching the spec's core
    P&F rule
  - Semantic green/red X/O coloring is correctly anchored to the Imprint palette (brand
    green position 1 for Rising, matte-red semantic anchor position 5 for Falling)
    and documented in-code as an intentional finance semantic exception rather than
    an arbitrary custom hex
  - 45-degree, one-box-per-column support/resistance trend-line projections are drawn
    from the extreme pivot columns — a genuine idiomatic P&F concept from the spec
    notes, not just decoration
  - X-axis is explicitly labeled 'Column (price reversals — not time)', directly educating
    the reader about the chart's defining feature versus time-based charts
  - Deterministic LCG-seeded synthetic data with alternating-direction legs produces
    a rich zigzag with many genuine reversals, giving good feature coverage
  - Uses Highcharts scatter series with disabled markers and dataLabels-as-glyph as
    a creative, idiomatic workaround since Highcharts core has no native P&F series
    type
  - Fully theme-adaptive chrome — both light and dark renders are legible with correctly
    flipped background/text/grid tokens while data colors stay identical
  - X vs O glyph shape provides redundant encoding alongside color, so the series
    distinction does not rely on hue alone (CVD-safe)
  weaknesses:
  - 'Design Excellence is still close to a well-configured default: beyond the semantic
    color and trend lines, there is little additional intentional polish (e.g. no
    price-target annotation from the count method mentioned in the spec''s Applications,
    no subtle shading/callout marking the current reversal zone) — add one more deliberate
    storytelling element to push past ''good but generic'''
  - In the densely packed columns (roughly columns 8-12, spanning price ~160-186),
    consecutive X/O data-label glyphs at 16px stack very tightly at the $2 box spacing
    and start to read as a solid colored block rather than discrete symbols — consider
    a touch more vertical breathing room (slightly smaller font in dense regions,
    or a light row-shading every other box) so the densest columns stay as legible
    as the sparse ones
  - The scatter + dataLabels-as-glyph technique is a solid response to the missing
    native series type, but doesn't yet layer in a more distinctive Highcharts-only
    capability (e.g. xAxis.plotBands to shade the active reversal zone, or chart-level
    annotations) that would clearly differentiate this from a generic 'scatter with
    text labels' implementation replicable in most other libraries
  - Verify legend item text ('Rising (X)' / 'Falling (O)') renders in the intended
    inkSoft gray in both themes — the render shows the legend row directly beneath
    colored data columns, so double-check the itemStyle color isn't being visually
    confused with or overridden by the adjacent series accent colors
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "point-and-figure-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top, fully visible and not clipped. Subtitle "Box size $2 · 3-box reversal" in lighter gray beneath it. Y-axis title "Price ($)" and X-axis title "Column (price reversals — not time)" both dark-gray, readable. Y-axis tick labels run 130-190 in steps of 2 (matching box size), fully visible with no clipped digits. X-axis tick labels run 0-18 in steps of 2, fully visible. Legend "Rising (X)" / "Falling (O)" sits centered below the X-axis title.
      Data: Columns of X (teal-green, #009E73) and O (matte red, #AE3030) glyphs, one symbol type per column, spanning roughly price 134-186 across 19 columns. A dashed gray support line rises 1 box/column from the lowest pivot column; a dashed gray resistance line descends 1 box/column from the highest pivot column. First series color confirmed as brand green #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/axis-title/tick-label layout as the light render, all rendered in light gray/off-white ink, fully legible against the dark surface. No clipped digits on tick labels. Legend text sits in the same position, readable.
      Data: X and O glyph colors are visually identical to the light render (same #009E73 green, same #AE3030 red) — only the chrome (background, text, grid, dashed trend-line color) flips to the dark-theme tokens. Grid lines are subtle and visible without competing with the data.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text remains clearly visible against the near-black background, and brand green plus matte red both read well on the dark surface.
