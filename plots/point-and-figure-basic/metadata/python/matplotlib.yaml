review:
  strengths:
  - 'A correct P&F construction: 13 alternating X/O columns from 300 closes with a
    $2 box (derived from the data as 2% of the mean close) and a 3-box reversal; each
    reversal column starts one box away from the prior extreme'
  - Bold X/O text glyphs with matplotlib.patheffects.withStroke halos in the page
    colour keep the symbols crisp where the dashed trend lines cross them
  - Major $10 gridlines with labelled ticks and minor ticks at every $2 box give the
    box-size price scale the Notes suggest without cluttering the field
  - Theme tokens are wired through the title, the ticks, the spines, the grid and
    the legend frame; both renders read cleanly, with identical data colours
  - Exact 3200x1800 canvas in both themes, with savefig left at its default bbox
  weaknesses:
  - 'SC-02 (both): the support line, anchored at column 1''s $84 low and rising one
    box per column, sits at $88 at column 3, whose O''s go down to $84, so the line
    cuts through the lows it should connect → anchor support at a low that the following
    columns hold above (or end the line where price breaks it). Likely cause: support_x/support_y
    taken from the overall lowest low without checking later lows.'
  - 'DQ-02 (both): the price series is an unnamed synthetic stock; the only label
    is ''Close ($)'', which reads as generic → name a plausible fictional instrument
    in the y label, e.g. ''Close, fictional mid-cap stock ($)''. Likely cause: the
    CLOSE column label.'
  - 'Suggestion: larger X/O glyphs (9-10 pt) would fill the wide column spacing better.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: Title 'point-and-figure-basic · python · matplotlib · anyplot.ai' in dark ink, about 57% of the width; y label 'Close ($)', x label 'Column (Reversal Number)', ticks 0-12 and $80-140 in soft gray; subtle major gridlines at $10, minor ticks at $2; top and right spines removed. Legend in the upper left with green 'Rising (X)' and red 'Falling (O)' swatches.
      Data: 13 columns alternating X (#009E73) and O (#AE3030), bold glyphs one $2 box apart; column 1 falls from 110 to 84, column 8 rises from 104 to 126, column 10 tops out at 128. A dashed green support line rises from column 1's low, and a dashed red resistance line falls from column 0's top, both at one box per column and both behind the symbols.
