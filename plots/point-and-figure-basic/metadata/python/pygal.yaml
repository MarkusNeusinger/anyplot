review:
  strengths:
  - 'X and O columns drawn as real bold text glyphs in Imprint brand green #009E73
    and the semantic matte red #AE3030, identical in both themes, so rising and falling
    columns read apart by shape and colour'
  - Glyph size is derived from the box height (about 59 px for 19 rows), so every
    symbol fills its own grid box without touching its neighbours
  - Y-axis labels and horizontal guides sit at every box-size interval ($2), giving
    the regular price grid the spec describes; x guides are off, so the columns stay
    uncluttered
  - 'Clean P&F construction from a tidy date/high/low/close DataFrame: 3-box reversal,
    17 alternating columns, box size derived from the median close'
  - SVG post-processing keeps pygal's invisible circle markers in the DOM, so the
    HTML output retains native hover tooltips on every box
  - 'Theme chrome is fully token-driven: #FAF8F1 / #1A1A17 surfaces, ink text and
    muted guides readable in both renders'
  weaknesses:
  - 'VQ-03 (both): the dashed 45-degree support and resistance lines are drawn at
    stroke width 4 on the 3200 px canvas and read faint beside the 59 px glyphs →
    about 6–8 px (+2 to +4 px). Likely cause: stroke_style={"width": 4, ...} on both
    trend-line series.'
  - 'CQ-01 (code): add_pnf_text_markers() is a helper function, against the Imports
    → Data → Plot → Save structure without functions → inline the ElementTree pass
    at module level. Likely cause: the SVG post-processing wrapped in def.'
  - 'Suggestion: start the support line one box below the first O column''s low, the
    traditional placement, so it does not run through the glyph centres.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title "point-and-figure-basic · python · pygal · anyplot.ai" in dark ink, y-axis title "Close ($)", x-axis title "Column (Reversal)", y ticks 94–130 every $2, x ticks 0–16, legend at bottom (X (Rising), O (Falling), Support (45°), Resistance (45°)); all readable
      Data: 17 alternating columns of bold X glyphs in brand green #009E73 and O glyphs in matte red #AE3030, one glyph per $2 box; dashed blue (#4467A3) support line rising from col 1 at 100 to col 7 at 112, dashed ochre (#BD8233) resistance line falling from col 0 at 110 to col 6 at 98; first series is #009E73
      Legibility verdict: PASS

