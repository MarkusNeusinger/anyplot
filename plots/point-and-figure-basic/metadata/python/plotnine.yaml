review:
  strengths:
  - 'Correct P&F construction: 3-box reversal, X columns green #009E73 and O columns
    red #AE3030, alternating columns each holding one symbol'
  - Box size derived from the data (2 % of the price magnitude) instead of a typed
    constant, so the chart adapts to other price levels
  - 'Fully theme-adaptive chrome: text, axis lines, grid and legend box flip cleanly
    between #FAF8F1 and #1A1A17'
  - 'Clean adaptable code: column constants, a Data block ending in df, and a plot
    section that reads only df'
  weaknesses:
  - 'VQ-05 (both): the panel is a narrow strip about 230 of 1930 px wide (~12 % of
    the canvas) with ~75 % of the square canvas empty, because each box is drawn about
    4× taller than wide → square boxes so the 22 columns spread across the canvas.
    Likely cause: coord_fixed(ratio=box_size) should be coord_fixed(ratio=1/box_size).'
  - 'SC-02 (both): C4 — the one-box-per-column support and resistance lines run steeply
    (about 75°) instead of at 45° through square boxes → square boxes. Likely cause:
    the same coord_fixed(ratio=box_size).'
  - 'VQ-02 (both): X and O glyphs of neighbouring columns touch at shared price levels
    (e.g. columns 12–20 at $140–146 read as ''xox''), and the x tick labels ''10'',
    ''15'', ''20'' almost touch → at least one glyph width of space between columns.
    Likely cause: columns only ~11 px apart in the squeezed panel (coord_fixed ratio).'
  - 'Suggestion: grid lines at every box (one box size) instead of every second box
    would make each column''s top and bottom easier to read as prices.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'point-and-figure-basic · python · plotnine · anyplot.ai' in dark ink spans ~74 % of the width; y title 'Price Level ($)', x title 'Column (Reversals)', ticks $82–158 every $4 and columns 0–20 in INK_SOFT; legend 'Direction' with green and red dots on an elevated box. The x tick labels 10/15/20 almost touch.
      Data: 22 columns of green X (#009E73) and red O (#AE3030) at geom_text size 4.5, each column one symbol, alternating. Two dashed grey lines: support rising from the $82 low, resistance falling from the $156 high. The panel is a narrow strip (~12 % of the canvas width) in the middle of the square canvas; neighbouring X/O glyphs touch at shared prices.
      Legibility verdict: PASS

