review:
  strengths:
  - Correct 3-box-reversal P&F construction on closes with a box size derived from
    the data (2% of median close, rounded to $2)
  - Seaborn hue+style double mapping gives X/O columns both shape and the Notes' green/red
    colour, CVD-safe
  - Both 45-degree trend lines advance exactly one box per column and run diagonally
    through the grid
  - Fully theme-adaptive chrome; page-coloured marker edges keep stacked symbols separate
    in both themes
  weaknesses:
  - 'VQ-03 (both): stacked markers at s=200 are taller than the $2 box pitch, so each
    X covers the upper arms of the one below and the X columns read as stacks of chevrons
    rather than separate X glyphs → markers about one box tall (roughly s=120–150,
    −50 to −80). Likely cause: sns.scatterplot s=200.'
  - 'Suggestion: place horizontal grid lines at every box ($2) instead of every second
    box so each symbol sits on its own grid row.'
  - 'Suggestion: tick the x-axis at every column so each reversal column can be counted.'
