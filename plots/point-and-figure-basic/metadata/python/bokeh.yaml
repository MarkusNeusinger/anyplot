review:
  strengths:
  - 'Correct Point and Figure construction: a compact 3-box reversal state machine
    over the closes, one symbol per $2 box, columns alternating X/O'
  - Y-grid pinned to exact box-size intervals with FixedTicker, so every symbol sits
    on a price row
  - 'Semantic green #009E73 for X and Imprint red #AE3030 for O, with shape as a second
    channel'
  - 'Theme-adaptive chrome is correct in both renders: warm backgrounds, light text
    on dark, elevated legend surface'
  - Renders on the canonical 3200x1800 canvas with a device-metrics override, so the
    x-axis and its title are fully visible
  weaknesses:
  - 'VQ-02 (both): the legend box in the top-left covers the start of the resistance
    line (it begins at about $122 on column 0, behind the legend) → keep the legend
    off the data, e.g. place it outside the plot area (p.add_layout(p.legend[0], ''right''))
    or in an empty corner. Likely cause: p.legend.location = ''top_left''.'
  - 'VQ-03 (both): the ''X — Bullish'' and ''O — Bearish'' legend entries show no
    glyph or colour swatch, only uncoloured text, so the legend does not tie the green
    and red symbols to their meaning → give each entry a visible coloured glyph (e.g.
    a scatter marker ''x'' / ''circle'' renderer in X_COLOR / O_COLOR as the legend
    item). Likely cause: text glyphs render an empty legend glyph in Bokeh.'
  - 'SC-02 (both): the support and resistance lines start one box beyond the global
    minimum and maximum at column 0, not at the column lows and highs they should
    connect. The resistance line cuts through the X column at $114 and the O columns
    at $112 and $108, and the support line cuts through columns 3 and 4 → anchor support
    at a column low and resistance at a column high (spec C4), so the 45° lines run
    alongside the columns and leave the symbols readable. Likely cause: support_start
    = min_price - BOX_SIZE and resistance_start = max_price + BOX_SIZE drawn from
    x=0.'
  - 'DQ-02 (both): the series is an unnamed generic price (''Price ($)'' only, no
    instrument) → name a plausible fictional instrument in the y-axis label or a descriptive
    title prefix. Likely cause: the data block and the axis label.'
  - 'Suggestion: tick every column on the x-axis (FixedTicker over range(n_cols))
    instead of every second column with quarter-column minor ticks.'
  - 'Suggestion: a HoverTool showing column and box price would add value in the HTML
    view.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 on a 3200x1800 canvas, no outline frame.
      Chrome: Bold title "point-and-figure-basic · python · bokeh · anyplot.ai" at the top left in dark ink. Y-axis title "Price ($)" and x-axis title "Column (Reversal)" in dark italic. Tick labels 80–120 and 0–8 in soft ink. Subtle 10 % grid with rows every $2. The legend box at top left has an elevated surface. All readable.
      Data: 9 alternating columns (X, O, X, O, X, O, X, O, X) of bold 30pt glyphs. X is green #009E73 and O is red #AE3030. The tallest column is the X column 4 ($82–$120). A blue ascending support line runs from $78 at column 0 to $94 at column 8, and an ochre descending resistance line runs from $122 to $106. The resistance line crosses symbols in columns 4, 5 and 7, and its start runs behind the legend. The X/O legend entries have no visible glyph.
      Legibility verdict: PASS

