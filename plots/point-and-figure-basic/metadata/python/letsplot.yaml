review:
  strengths:
  - 'Correct 3-box-reversal P&F construction: single-symbol columns alternating X
    and O on a column-count x-axis.'
  - 'Green #009E73 X and Imprint red #AE3030 O identical across themes; theme tokens
    on all chrome.'
  - Both 45-degree trend lines via geom_abline with slope ±box_size, one box per column.
  - layer_tooltips() .line() chains give per-box hover data in the HTML output.
  weaknesses:
  - 'VQ-02, SC-02 (both): stacked symbols are taller than one $2 box, so neighbouring
    X glyphs merge into continuous chains and O glyphs interlock (columns 1, 2, 11,
    14, 20), against the spec''s ''stacked symbols stay separate glyphs'' → glyph
    height under one box row (about −30 %). Likely cause: geom_text(size=12) on an
    800x450 ggsize.'
  - 'DE-02 (both): all four panel spines are drawn (a full frame around the panel)
    where the style guide removes top and right and the plot type requires no enclosure
    → left and bottom axis lines only, or none. Likely cause: theme_minimal() leaving
    a panel border.'
  - 'CQ-01 (code): the Data block ends with `resistance_intercept = ...` instead of
    binding one tidy df, there are no column constants for the date/high/low/close
    roles, and the plot reads df_pnf, box_size and the intercepts from the block with
    typed column names ''column'', ''price'', ''symbol'', ''direction'' → column constants
    with role comments, a Data block that ends in df, and the P&F table and trend
    lines derived from df below it. Likely cause: the P&F algorithm placed inside
    the Data block.'
  - 'Suggestion: gridlines at every $2 box (labels every fifth) would make each box
    read as a grid cell, as the Notes allow.'
  - 'Suggestion: clipping the trend lines to the columns they span would keep the
    support line out of the empty lower-left corner.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Mandated title top-left in dark ink; axis titles 'Column (Reversal Number)' and 'Price ($)'; ticks 0-22 and $80-150 in INK_SOFT; thin horizontal grid every $10; a full four-sided frame around the panel.
      Data: 23 alternating columns of bold green (#009E73) X's and red (#AE3030) O's from $82 to $154; stacked glyphs taller than a $2 box merge into chains. A dashed support line rises from below the panel's lower-left corner through the $82 low to the right edge (~$126); a dashed resistance line falls from the top edge near column 20.5 through the top X of column 22 to the right edge (~$152).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17.
      Chrome: Light cream title and axis titles, light-grey ticks, muted grid and frame; no dark-on-dark text.
      Data: Green and red identical to the light render; both dashed lines light grey and visible.
      Legibility verdict: PASS
