review:
  strengths:
  - 'mark_text with a text encoding draws real X and O glyphs in #009E73 and Imprint
    red, alternating by column (C1)'
  - Grid rows and price ticks every $2 box, so each symbol sits in its own box row
    (C2)
  - Support and resistance lines move exactly one box per column (C4)
  - Theme tokens threaded through all chrome; tooltips and .interactive() in the HTML
    output
  weaknesses:
  - 'VQ-05 (both): canvas is 3716x2116, not the required 3200x1800 → 3200x1800 (-516
    x -316). Likely cause: properties(width=800, height=450) at scale_factor=4 plus
    vl-convert padding, with no pad-to-target step.'
  - 'VQ-05 (both): the $80 O glyphs in columns 1 and 3 are cut in half by the x-axis
    → extend the y domain about one box below the lowest price. Likely cause: alt.Scale(zero=False)
    without domain or padding.'
  - 'DE-02 (both): a full box frame encloses the plot area, against the style guide''s
    open-spine rule → no view stroke. Likely cause: configure_view(stroke=INK_SOFT).'
  - 'VQ-03 (both): the Direction legend shows filled circles while the marks are X
    and O letters → legend symbols matching the glyphs. Likely cause: default color
    legend for mark_text.'
  - 'VQ-01 (both): x tick labels 0-12 are rotated 90 degrees though they are short
    numbers → horizontal labels (labelAngle=0). Likely cause: ordinal axis default
    label angle.'
  - 'Suggestion: a slightly more distinctive typographic hierarchy could lift DE-01.'
