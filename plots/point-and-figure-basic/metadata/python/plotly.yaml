review:
  strengths:
  - 'Correct P&F construction: $2 box, 3-box reversal, columns strictly alternate
    X/O with one symbol type each'
  - Theme tokens threaded through every chrome element; no dark-on-dark or light-on-light
    text in either render
  - Per-column hovertemplate (column, price, direction) adds inspection in the HTML
    view
  - Support and resistance lines distinguished by dash pattern, not only colour
  weaknesses:
  - 'VQ-02 (both): the dashed support line runs through the O at $82 (col 1), the
    X at $84 (col 2), the O at $94 (col 7) and the X at $96 (col 8), and the dotted
    resistance line through the O at $142 (col 15) → lines that pass between symbols,
    clear of every glyph. Likely cause: both lines start on a symbol''s box centre
    (min O / max X) instead of one box beyond it, and the support line is extended
    to the last column past the columns where price broke below it.'
  - 'VQ-03 (both): the legend shows filled green and red squares for ''X (Rising)''
    and ''O (Falling)'', while the chart draws X and O glyphs → legend entries drawn
    as the X and O text glyphs in their colours. Likely cause: the dummy legend traces
    use mode=''markers'' with symbol=''square''.'
  - 'VQ-05 (both): the legend sits in a 160 px right margin and the space below it
    stays empty, so the plot area spans only about 62 % of the canvas width → legend
    inside the plot area''s empty top-left or as a horizontal row, plot area wider.
    Likely cause: margin r=160 with legend x=1.02.'
  - 'DQ-02 (both): the series is an unnamed security labelled only ''Price ($)'' →
    a named fictional ticker in the axis title or column name. Likely cause: CLOSE
    = ''Price ($)''.'
  - 'Suggestion: square boxes (column step equal to one box on screen) would make
    the one-box-per-column trend lines run at a true 45°.'
