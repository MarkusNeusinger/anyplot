review:
  strengths:
  - Width-proportional bezier ribbons stacked inside each segment by the category
    at the other end, so segments fill exactly and flows read cleanly
  - 'Ribbons keep the Channel color across both gaps, with a native Bokeh legend titled
    ''Ribbon color: Channel'''
  - Theme tokens threaded through title, labels, segment boxes and legend; both renders
    fully readable with identical data colors
  - 'Idiomatic Bokeh: grouped patches per color with legend_label, LabelSet from a
    ColumnDataSource, quad() segments'
  - Clear Channel / Category / Outcome data block with column constants, adaptable
    to a user's own table
  weaknesses:
  - 'VQ-02 (both): the middle axis''s category labels Home, Clothing and Electronics
    are drawn on top of the ribbons entering that axis, so the text sits on green
    and blue fills → labels on a clear background, e.g. placed in the gap where no
    ribbon passes or with the axes spaced so the label column is free. Likely cause:
    label_x = seg[''left''] - 0.05 for every non-last axis, which lands inside the
    incoming ribbons.'
  - 'CQ-01 (code): a bezier() helper function defined in the script (lines 68-70)
    → inline the cubic expression in the ribbon loop. Likely cause: the def bezier(t,
    a, b, c1, c2) helper.'
  - 'Suggestion: the ribbons start at the axis centre and cover the right half of
    each segment box, so segments read two-toned; starting them at the box edges would
    keep the segments uniform.'
