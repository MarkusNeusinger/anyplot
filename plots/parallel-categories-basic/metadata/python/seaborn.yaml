review:
  strengths:
  - 'Axis bars are drawn by seaborn itself: the melted table goes through sns.histplot(x=''dimension'',
    hue=''segment'', multiple=''stack'', shrink=0.46), so every segment''s length
    is that category''s count without any hand-placed rectangles'
  - 'Passenger class is treated as an ordered category: First/Second/Third take ordered
    steps of the Imprint sequential ramp (#009E73 to #4467A3), and that color carries
    through every axis gap to Outcome'
  - Only the first axis is colored, and the other four use a neutral INK_SOFT tone,
    so the class colors on the Class segments name the ribbons without needing a legend
  - Barycenter ordering of the later axes (Male above Female, Senior/Adult/Child,
    Cherbourg/Southampton/Queenstown) keeps ribbon crossings low, as the Notes suggest
  - 'Theme-aware details: ribbon alpha rises to 0.8 on the dark page so the hues hold,
    segment labels switch between page color and fixed light ink, and page-colored
    separators split the segments'
  - Ribbons are cubic Bezier PathPatches stacked by class inside each segment, so
    every band's width equals its observation count and starts and ends flush with
    the bar edges
  weaknesses:
  - 'DQ-03 (both): the Titanic-style data lets most passengers survive. The Outcome
    axis shows Survived at about 55 % (about 275 of 500), while the real Titanic survival
    rate the scenario borrows was about 38 %. Target: about 38 % (−17 points). Likely
    cause: the base survival_chance of 0.3 plus the class, sex and child bonuses averages
    about 0.56. Lower the base to about 0.12.'
  - 'Suggestion: ''Southampton'' fills its 7.5 pt segment label almost edge to edge
    on the Embarked bar. A slightly smaller label size, or a slightly wider BAR_WIDTH,
    would give it breathing room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: the title "parallel-categories-basic · python · seaborn · anyplot.ai" is in dark ink at the top. The five dimension names (Class, Sex, Age group, Embarked, Outcome) head their axes in dark ink. There are no spines, ticks or grid. Category labels are page-colored inside the dark INK_SOFT segment bars and light inside the colored Class segments. All are readable.
      Data: the Class axis has First (#009E73 green), Second (teal, the midpoint of the ramp) and Third (#4467A3 blue) segments. Translucent Bezier ribbons in those three colors flow through Sex (Male/Female), Age group (Senior/Adult/Child), Embarked (Cherbourg/Southampton/Queenstown) and Outcome (Lost/Survived), and braid more densely toward the later axes. Survived is the larger Outcome segment.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title and the dimension names are light (#F0EFE8). The axis bars are light gray (#B8B7B0) with dark page-colored category labels, and the Class segments keep light labels. No text is dark on dark.
      Data: the class colors are identical to the light render (green, teal, blue). The ribbons are denser (alpha 0.8) and keep their hue on the dark page. The layout is identical.
      Legibility verdict: PASS
