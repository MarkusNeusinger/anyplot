review:
  strengths:
  - 'The axis bars come from seaborn itself: sns.histplot on a melted long table with
    multiple="stack", shrink and a per-segment palette builds every dimension''s stacked
    count bar, so segment lengths are exactly the category shares'
  - Ribbons are stacked inside every segment by passenger class, so each class keeps
    its color and its place across all five axes and the class-to-outcome flow can
    be read from one end to the other
  - 'Passenger class is treated as an ordered category: three steps of imprint_seq
    from #009E73 (First) to #4467A3 (Third), with the colored first-axis segments
    naming the colors so no separate legend is needed'
  - Category order on every later axis comes from a barycenter pass over the previous
    axis, the crossing-reducing order the Notes suggest, while the first axis keeps
    its natural First/Second/Third order
  - 'Theme handling is careful in both renders: page-colored gaps between segments,
    page-colored label halos, INK_SOFT bars on the uncolored axes, and a higher ribbon
    alpha on the dark page so the hues stay saturated'
  weaknesses:
  - 'VQ-02 (both): the category labels of axes 2–5 (Male, Female, Senior, Adult, Child,
    Cherbourg, Southampton, Queenstown, plus Lost and Survived next to the last bar)
    sit on top of the ribbons, and only a page-colored halo separates them from the
    data → put the labels where no ribbon runs, for example inside a wider axis bar
    or in a narrow strip reserved next to each bar, keeping the halo as a fallback.
    Likely cause: ax.annotate at i + BAR_WIDTH/2 with xytext=(4, 0) for every axis
    after the first.'
  - 'Suggestion: Embarked is drawn independently of class, so its braid carries no
    structure; tying the port of embarkation loosely to class (as on the real Titanic,
    where Cherbourg skews to First Class) would give that axis a readable pattern.'
  - 'Suggestion: sorting the first axis with sorted() only gives First/Second/Third
    by alphabetical accident; an explicit category order would survive a data swap.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole canvas, no pure white anywhere.
      Chrome: the title "parallel-categories-basic · python · seaborn · anyplot.ai" is centered at the top in dark ink and fills about 58% of the width. The dimension names Class, Sex, Age group, Embarked and Outcome head the five axes as top tick labels. Category labels (First/Second/Third on the left of the first axis, Male/Female, Senior/Adult/Child, Cherbourg/Southampton/Queenstown, Lost/Survived) are in dark ink with a page-colored halo. All text is readable. There are no spines, no grid and no numeric axis.
      Data: five vertical stacked bars, one per dimension, split into segments by page-colored gaps. The Class segments are colored with three imprint_seq steps (First #009E73 green, Second teal, Third #4467A3 blue); the other bars are #4A4A44. Bezier ribbons at alpha 0.65 link neighboring axes, widths proportional to counts, colored by class across all axes. Green ribbons visibly gather in Survived and blue ones in Lost. Rare combinations show as hair-thin ribbons near Embarked and Outcome.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title, dimension names and category labels are light #F0EFE8 text with a dark page-colored halo, all clearly readable. There is no dark-on-dark text. The uncolored axis bars are light gray #B8B7B0 and stand out against the page.
      Data: same layout and the same three class colors as the light render, ribbons at alpha 0.8, so they look a little denser. Brand green #009E73 reads well. Third-class blue ribbons are darker but clearly separated from the background.
      Legibility verdict: PASS
