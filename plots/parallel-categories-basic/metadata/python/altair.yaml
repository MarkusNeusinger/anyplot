review:
  strengths:
  - Ribbons are mark_area bands whose width equals the flow count in the same units
    as the segments, so they tile each segment exactly and ribbon width is truly proportional
  - Ribbon colour follows the Channel of every observation across both stages, with
    sub-stacking by colour inside each segment
  - Only the colour dimension's segments carry Imprint fills; Category and Outcome
    use the elevated neutral surface, so the colour key is unambiguous
  - 'Clean theme threading: INK/INK_SOFT/ELEVATED_BG for chrome and legend, identical
    data colours in both renders'
  - Counts on every segment are computed from the data and sum to 200 on each axis
  weaknesses:
  - 'VQ-05 (both): the 540x320 inner view leaves the chart filling about 77 % of the
    canvas width and 76 % of the height, with empty bands of about 130 px above the
    title and below the axes → the library prompt''s 620x320 landscape inner view
    (+80 width units). Likely cause: .properties(width=540, height=320).'
  - 'Suggestion: an Altair selection_point bound to the Channel legend could highlight
    one source''s paths in the HTML, the interactive highlighting the Notes mention.'
