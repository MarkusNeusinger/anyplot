review:
  strengths:
  - 'Canonical Imprint order with Online in #009E73 and the color kept by channel
    across every axis, with a legend naming the dimension'
  - Segment lengths and ribbon widths computed from the count column, with totals
    in every category label (C1, C2)
  - Page-tinted geom_label plates keep the middle-axis labels readable where they
    cross ribbons
  - Theme tokens threaded through title, headers, labels, node fill and legend; both
    renders theme-correct
  - 'Adaptable structure: column constants and a single Data block that the smoke
    tests pass with renamed and resized data'
  weaknesses:
  - 'VQ-02 (both): the middle-axis labels ''Home (171)'', ''Clothing (314)'', ''Electronics
    (277)'', ''Small (422)'' and ''Large (340)'' sit on top of the ribbons, and the
    ''Electronics (277)'' plate runs about 20 px into the Size axis segment; the legend
    title ''Acquisition channel'' touches the Online swatch → labels clear of other
    axes and legend title separated from its keys. Likely cause: right-side label
    offset node_width/2 + 0.02 with geom size 6 makes labels wider than the gap between
    axes; legend title spacing default.'
  - 'VQ-05 (both): the dimension headers at geom_text size 9 (about 25 pt) render
    larger than the 16 pt title → about 16-18 pt (geom size 5.5-6, about −3). Likely
    cause: header geom_text size=9.'
  - 'Suggestion: in the dark render the Mobile ribbons (#4467A3 at alpha 0.5) read
    as a dim navy; a slightly higher ribbon alpha would lift them.'
  - 'Suggestion: lets-plot tooltips on the ribbons (layer_tooltips with channel and
    count) would add path inspection to the HTML output.'
