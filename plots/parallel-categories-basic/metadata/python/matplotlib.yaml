review:
  strengths:
  - Cubic Bezier ribbons built from matplotlib.path.Path CURVE4 codes and drawn as
    PathPatch
  - Segment lengths are proportional to category shares on every axis
  - 'Imprint palette in canonical order with #009E73 first; data colors identical
    across themes'
  weaknesses:
  - 'VQ-01, VQ-07 (dark): the legend title ''Channel'' renders near-black on the #242420
    legend frame and cannot be read → INK text (#F0EFE8). Likely cause: the legend
    title color is never set (leg.get_title().set_color(INK) missing).'
  - 'VQ-05 (both): canvas is 2997x2667, neither 3200x1800 nor 2400x2400 → 3200x1800
    (+203 × −867 px). Likely cause: figsize=(16, 9) at dpi 300 with set_aspect(''equal'')
    and bbox_inches=''tight''; use figsize=(8, 4.5), dpi=400 and no tight bbox.'
  - 'VQ-02 (both): the legend box covers the lower right corner of the Purchased segment,
    and the ''Electronics'' and ''Abandoned'' labels overrun their box edges → legend
    clear of the segments, labels inside the boxes (14 pt → about 8 pt on the target
    canvas). Likely cause: loc=''lower right'' with bbox_to_anchor=(1.12, 0) and fontsize=14
    labels on dim_width=0.08 boxes.'
  - 'SC-02 (both): C3 missed: between Category and Outcome the ribbons do not keep
    the Channel colors (Mobile blue never reaches the Outcome axis) → split second-gap
    ribbons by channel and color each by its channel. Likely cause: second-gap flows
    grouped by (Category, Outcome) only.'
  - 'SC-03 (both): second-gap ribbons take the modal channel of their left category,
    so whole flows are drawn in a color most of their observations do not have → color
    by the observations'' own channel. Likely cause: `df[df[dim1] == cat1][''Channel''].mode()`.'
  - 'SC-04 (both): title ''parallel-categories-basic · matplotlib · anyplot.ai'' lacks
    the language segment → ''parallel-categories-basic · python · matplotlib · anyplot.ai''.
    Likely cause: the title string.'
  - 'DQ-01 (both): Channel, Category and Outcome are drawn independently, so every
    ribbon splits in the same proportions and the plot shows no co-occurrence pattern
    → draw later dimensions conditionally on earlier ones. Likely cause: three independent
    np.random.choice calls.'
