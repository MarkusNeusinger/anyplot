review:
  strengths:
  - Segment lengths and ribbon widths are both computed from the Orders totals (dim_totals,
    flow_value / category total), so every axis reads as a share of the same 5,750
    orders and the ribbons stack exactly into their segments at both ends
  - Ribbons are colored by the first dimension (Category) and keep that Imprint hue
    across all three gaps, split per category at every axis via the three-key groupby,
    with an explicit 'Category:' legend naming the coloring dimension
  - 'Theme handling is complete: PAGE_BG, INK, INK_SOFT and INK_MUTED drive pygal''s
    Style and every hand-written SVG element, and the ribbon opacity is tuned per
    theme (0.45 light, 0.62 dark) so ribbons stay legible on both surfaces'
  - Category labels sit in reserved lanes (label_lanes) right of axes 2-4 and left
    of axis 1, so no label collides with a ribbon in either render
  - Realistic, neutral e-commerce order-flow scenario (product category, distribution
    channel, payment method, outcome) with plausible counts and rare Returned/Cancelled
    paths
  weaknesses:
  - 'VQ-05 (both): ribbons leaving Distribution and Payment start about 270-330 px
    right of the axis bars (past the label lane), so their origin floats detached
    from the segment they come from while the incoming ribbons touch the bars → start
    the outgoing ribbons at the bar edge and keep the labels clear another way (shorter
    label lane, labels left of the bar, or smaller label_pad). Likely cause: band_x0
    adds label_lanes[dim_idx] for dim_idx > 0.'
  - 'Suggestion: pygal''s own interactive output is unused; the HTML only embeds the
    static SVG, so per-ribbon <title> elements would give the HTML view the path tracing
    the Notes mention.'
  - 'Suggestion: the legend entries are spaced at chart_width / 4, leaving wide empty
    runs between the four swatches; a tighter spacing would read as one unit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no pure white.
      Chrome: monospace title "parallel-categories-basic · python · pygal · anyplot.ai" centered at top (~70% width); bold dark dimension headers Category, Distribution, Payment, Outcome; dark category labels (Electronics, Clothing, Home & Garden, Sports; Direct, Wholesale, Retail; Credit Card, Debit Card, Digital Wallet; Completed, Returned, Cancelled) all readable; bottom legend "Category:" with four swatches. No grid (none needed).
      Data: first axis segments in Imprint #009E73, #C475FD, #4467A3, #BD8233; other axes in muted gray #6B6A63; translucent ribbons in the same four hues through all three gaps, widths proportional to counts; thin ribbons into Returned/Cancelled. Ribbons from Distribution and Payment start ~300 px right of the bars, past the label lanes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, dimension headers and category labels in light ink, legend text in soft light gray; all readable, no dark-on-dark text.
      Data: identical Imprint hues on the first axis and legend; ribbons at higher opacity read as deeper tones of the same hues; other axes in light muted gray #A8A79F. Brand green clearly visible. Same layout and same detached ribbon starts as light.
      Legibility verdict: PASS
