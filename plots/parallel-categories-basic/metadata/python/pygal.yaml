review:
  strengths:
  - Every axis is named and divided into category segments whose lengths are proportional
    to the order shares, with gaps between segments.
  - Ribbon widths come from the summed Orders at both ends, and each ribbon keeps
    its Category hue across all four axes; the 'Category:' legend names the coloring
    dimension.
  - Category order follows the data's first appearance, which is natural here (Completed
    → Returned → Cancelled). The plot has no annotation layers, reference lines or
    highlights.
  - Theme tokens are threaded through the pygal Style and every custom SVG element,
    so both renders are theme-correct with identical data hues.
  - The plausible e-commerce order-flow scenario (Category → Distribution → Payment
    → Outcome) uses 4 dimensions with 3–4 categories each.
  weaknesses:
  - 'VQ-02 (both): the right-side category labels of axes 2–4 (Wholesale, Retail,
    Debit Card, Digital Wallet, Direct) are printed over the ribbon bands that leave
    those segments, and only a page-colored halo separates them → keep the labels
    clear of the ribbons, e.g. by widening the band gap at each label or by shortening
    the ribbon start. Likely cause: label_x = x + bar_width / 2 + 20 places the text
    inside the ribbon band span band_x0 … band_x1.'
  - 'VQ-03 (dark): the Home & Garden #4467A3 ribbons at fill-opacity 0.45 blend to
    a dull navy close to the #1A1A17 page, the weakest ribbons in the render → raise
    the ribbon opacity on dark (about 0.6–0.65, +0.15 to +0.2). Likely cause: the
    fixed fill-opacity="0.45" on the ribbon paths for both themes.'
  - 'Suggestion: the HTML embeds the SVG through <object> without any hover; a <title>
    per ribbon (category path and count) would give native browser tooltips for path
    tracing.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
