review:
  strengths:
  - Native go.Parcats with categoryorder='array' keeps every dimension in its natural
    order (First→Third, Survived→Did Not Survive)
  - 'Ribbons colored by the outcome dimension with Survived on brand green #009E73
    and Did Not Survive on #C475FD, identical in both themes'
  - Theme tokens threaded through labelfont, tickfont, title and backgrounds; all
    text readable in light and dark
  - Real Titanic data from seaborn behind clean column constants and a replaceable
    data block
  - 'Library-native interactivity in the HTML: hoveron=''color'' path highlighting
    with count+probability and freeform drag arrangement'
  weaknesses:
  - 'VQ-02 (both): the interior axes'' category labels (Female, Male, Cherbourg, Queenstown,
    Southampton) are drawn on top of the incoming ribbons, readable only through the
    text halo → labels clear of the ribbons, e.g. wider spacing so the label sits
    in the gap before the ribbons fan in, or shorter labels. Likely cause: go.Parcats
    places category labels on the left of every non-first axis, over the ribbons arriving
    there.'
  - 'Suggestion: the ribbon_color mapping (line 55) fails on missing values (astype(int)
    on NA); mapping categories through a dict with a fill value would keep the snippet
    robust on user data.'
