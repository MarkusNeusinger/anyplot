review:
  strengths:
  - Ribbons are aggregated per neighbouring axis pair and stacked inside each segment
    in the partner axis's order, so ribbon widths stay proportional to the shared
    session counts and nothing crosses inside a segment
  - 'Every ribbon is colored by the last dimension (Outcome) with Purchased on #009E73
    and Abandoned on #C475FD, kept across all three gaps and explained by a legend
    whose swatches carry the ribbons'' 0.55 alpha'
  - Category segments are sized by their share of all 2,732 sessions and labelled
    with their counts; segment totals add up on every axis (1087+699+946 = 1126+1002+604
    = 1396+1336 = 1858+874)
  - 'Theme tokens are threaded through every element: INK_SOFT segments with PAGE_BG
    outlines, INK axis names, and label boxes in PAGE_BG, so both renders read cleanly'
  - Category order is the data's order of first appearance and the plot code reads
    only df and the column constants, so the snippet adapts to another table
  weaknesses:
  - 'VQ-02 (both): the middle-axis labels (Electronics, Clothing, Home, Returning,
    New) are drawn as 0.85-alpha boxes right of their segments and sit on top of the
    ribbons leaving them — ''New (1336)'' covers the Abandoned ribbon to Purchased
    and ''Electronics (1126)'' covers the Electronics→Customer ribbons; the legend
    title ''Outcome'' also touches the legend frame''s left border → place the middle
    labels where they cover no ribbon (inside or centred on the segment, or in the
    gap above it) and pad the legend title. Likely cause: geom_label at xmax + 0.008
    for the middle nodes; legend_title without a margin.'
  - 'VQ-05 (both): the legend floats at the right canvas edge about 200 px (of 2000
    displayed) clear of the ''Purchased (1858)'' label, while the diagram sits left
    of centre, leaving an empty band on the right → bring the legend next to the diagram
    or spread the axes wider so the margins balance. Likely cause: x_axes = np.linspace(0.19,
    0.74, n_dims) with legend_position=''right''.'
  - 'CQ-01 (code): line 46 writes the role comment of DIMENSIONS as ''# role: dimension_
    (left to right)'', so the dimension_ role has no recognised column constant →
    ''# role: dimension_'' with the role name alone. Likely cause: prose appended
    to the role comment.'
  - 'Suggestion: drop the unused node keys x, y_below and count from node_rows.'
  - 'Suggestion: the change request asked for a different domain (hospital patient
    routing, survey responses, or an HR hiring pipeline); this version keeps the e-commerce
    journey that five other libraries already show.'
  image_description: |-
