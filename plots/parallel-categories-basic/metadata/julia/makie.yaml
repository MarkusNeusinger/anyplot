review:
  strengths:
  - Faithful custom parallel-categories/Sankey construction from primitives, using
    smoothstep-interpolated ribbon edges rather than naive straight-line segments
    — a genuinely more polished result than a minimal implementation.
  - Ribbon widths and node heights are mathematically proportional to observation
    counts; verified that channel/product/outcome totals all correctly sum from the
    underlying combo data.
  - 'Correct Imprint palette (first series #009E73, canonical positions 2-3 for the
    remaining channels) and fully correct theme-adaptive chrome (backgrounds, text,
    node strokes) in both light and dark renders.'
  - Realistic, neutral e-commerce customer-journey dataset with full 3x3x2 combinatorial
    coverage and direct count labels on every node.
  - Correct mandated title format and canonical landscape canvas size, both themes
    readable with no clipping or overlap.
  weaknesses:
  - Heavy ribbon crossing in the product-to-outcome stage, combined with coloring
    only by the source channel, makes it hard to trace any individual flow and undercuts
    the spec's own note to 'consider ordering categories within each dimension to
    minimize ribbon crossings' (not applied here). Reorder product/outcome categories
    by dominant channel share, or vary color/lightness at the second stage to restore
    traceability.
  - Overlapping semi-transparent ribbons (alpha=0.55) blend into muddy, darker patches
    where multiple channel colors cross in the dense central region, reducing the
    legibility of individual ribbon identity. Consider tuning alpha and/or fixing
    a stable z-order/stacking so bands stay visually separable.
  - Code relies on five helper functions (node_tops, stage_positions, draw_ribbon!,
    draw_node!, smoothstep) rather than a flatter imports -> data -> plot -> save
    script. Understandable given the layout math this diagram needs, but it's a notable
    departure from the project's KISS structure guideline.
  - 'Library Mastery is generic: the ribbon/node drawing is built entirely from primitive
    poly!/band!/text! calls that could be replicated in most plotting libraries with
    similar effort; no Makie-distinctive capability (e.g. GeometryBasics recipes,
    Observables) is leveraged.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "parallel-categories-basic · julia · makie · anyplot.ai" in bold dark ink, clearly readable; dimension headers "Acquisition Channel", "Product Category", "Outcome" in dark ink above each column; node labels ("Organic Search (480)", "Electronics (570)", "Purchased (642)", etc.) all in dark ink, fully legible against the light background; node borders in soft dark gray.
      Data: Three source-channel colors from the Imprint palette — green (#009E73, Organic Search), lavender/purple (#C475FD, Paid Ads), blue (#4467A3, Referral) — carried through both ribbon segments (channel->product and product->outcome) at ~55% opacity. Product and Outcome nodes render as plain elevated-background boxes. All data readable and colors match the Imprint categorical palette in canonical order.
      Legibility verdict: PASS — no dark-on-light or light-on-light failures observed; some visual clutter from many overlapping semi-transparent ribbons in the crossing region, but text remains fully legible throughout.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, dimension headers, and all node labels render in light ink (near-white), clearly legible against the dark background; no dark-on-dark text found anywhere. Node borders in light soft-gray stroke, visible against the dark background.
      Data: Same three channel colors (green/lavender/blue) as the light render — confirmed identical hues, only the surrounding chrome (background, text, node fill, strokes) flips to the dark tokens. Product/Outcome node boxes use the dark elevated background, subtly distinguishable from the page background.
      Legibility verdict: PASS — all text is light-colored on the dark surface, no dark-on-dark failures; same ribbon-crossing clutter as the light render but no legibility regression specific to the dark theme.
