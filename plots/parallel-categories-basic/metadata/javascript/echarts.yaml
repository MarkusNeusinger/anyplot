review:
  strengths:
  - 'All three prior-attempt weaknesses addressed in this revision: a 4th dimension
    (device type) was added, category nodes now carry their own semantic hue instead
    of staying neutral, and node labels gained a background pill (padding + borderRadius)
    that lifts them clearly off the ribbons in both themes.'
  - 'The four-stage flow (channel -> category -> device -> outcome) is fully mass-conserved:
    every intermediate node''s inbound sum equals its outbound sum (e.g. Electronics
    630+420=1050 matches its channel inflow of 420+380+160+90=1050), which is the
    kind of data discipline that makes a Sankey trustworthy.'
  - layoutIterations raised to 100 is a genuine, documented attempt at the spec's
    crossing-minimization guidance rather than a cosmetic tweak, and the code comment
    explains why.
  - Clean, fully deterministic, dependency-free code with correct theme-adaptive chrome
    in both renders; colors are pixel-identical between light and dark, only chrome
    flips.
  weaknesses:
  - Adding the device stage increased the ribbon count between category and device
    to a dense criss-cross (Electronics/Apparel/Home & Garden each splitting into
    both Desktop and Mobile), so the middle of the diagram still reads as a busy blend
    of overlapping semi-transparent colors - individual paths remain hard to trace
    by eye even with the higher layoutIterations.
  - The Desktop/Mobile waypoint nodes are thin and neutral-colored, which is correct
    per the plan, but they sit close enough together that the small gap between their
    two flows narrows to almost nothing near the middle crossing point - a touch more
    nodeGap there would help separate them visually.
  - Category node colors (cyan/rose/lime) are a nice semantic touch but aren't explained
    anywhere in the UI (title/subtitle/legend) - a first-time viewer has to infer
    that hue changes at each stage rather than reading a mapping.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "parallel-categories-basic · javascript · echarts · anyplot.ai" and descriptive subtitle "Customer journey: acquisition channel → product category → device → purchase outcome" centered at top in dark ink, fully legible against the light surface. Node labels (channel/category/device/outcome names) now sit on a small light-background pill with rounded corners, so every label stays sharp even where it crosses a saturated ribbon.
      Data: Four channel nodes (Organic Search = brand green #009E73, Paid Ads = lavender, Social Media = blue, Email Campaign = ochre), three category nodes now individually colored (Electronics = cyan, Apparel = rose, Home & Garden = lime), two neutral Desktop/Mobile waypoint nodes (light fill, soft ink border), two outcome nodes (Purchased = green, Abandoned = matte red). Ribbon width is proportional to count at every one of the three stages, and flow is mass-conserved node-to-node. The channel-to-category and especially the category-to-device bands still show heavy ribbon crossing, producing a busy blended-color middle section.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and subtitle flipped to light ink, fully legible against the dark surface. Node label pills flipped to a dark background with light text, staying readable against both the dark canvas and the semi-transparent ribbons behind them. No dark-on-dark failures observed.
      Data: Same channel/category/outcome colors as the light render (green, lavender, blue, ochre, cyan, rose, lime, red) - confirmed pixel-identical across themes; only chrome (background, text, label-pill fill) flipped. Same ribbon-crossing density as the light render.
      Legibility verdict: PASS
