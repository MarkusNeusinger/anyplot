review:
  strengths:
  - 'Builds the parallel-categories form natively from an ECharts Sankey: one justified
    node column per dimension, one node per category with a height equal to its share,
    and links split by outcome so every ribbon keeps its Purchased or Abandoned color
    from the first axis to the last'
  - 'Uses the Imprint semantic exception correctly: Purchased in brand green #009E73
    and Abandoned in matte red #AE3030, with neutral inkSoft segments on the three
    non-outcome axes so the outcome is the only color carrier'
  - 'emphasis.focus ''trajectory'' gives the interactive path tracing the Notes mention
    in the HTML view, and layoutIterations: 100 lets the layout settle on a category
    order with fewer crossings'
  - 'Theme tokens are threaded through every chrome element: ink axis names, inkSoft
    subtitle and segments, and label pills filled with pageBg that stay readable over
    ribbons in both themes'
  - Realistic, neutral e-commerce funnel (2,430 visitors) derived deterministically
    from channel volumes, desktop shares and purchase rates, so widths fall out of
    the computation
  weaknesses:
  - 'Suggestion: the Purchase outcome labels have no page-colored pill while the other
    three axes do; giving them the same pill would make the label style uniform.'
  - 'Suggestion: at opacity 0.6 the Abandoned ribbons read as a dark maroon on the
    #1A1A17 surface; a slightly higher ribbon opacity in the dark theme would give
    them more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: centered bold title "parallel-categories-basic · javascript · echarts · anyplot.ai" with a soft-gray subtitle "2,430 visitors · ribbon width shows visitors, color shows purchase outcome"; four bold dark axis names (Acquisition channel, Product category, Device, Purchase outcome) above four node columns; category labels in small cream pills next to the dark gray segments. All of it is readable.
      Data: 4 channel segments, 3 product segments, 2 device segments, 2 outcome segments (green Purchased, red Abandoned), with each segment's length matching its share. Ribbons are translucent green #009E73 or matte red #AE3030 by outcome throughout, and their widths are proportional to visitors. Crossings blend into darker tones, which is expected. Nothing is clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis names in light ink, subtitle in light gray, light-gray segments on the non-outcome axes, and category labels in near-black pills with light text. There is no dark-on-dark text.
      Data: ribbon and outcome-segment colors are the same green #009E73 and red #AE3030 as in the light render; at 60 % opacity they read darker on the near-black surface but stay clearly visible. The layout is identical to the light render.
      Legibility verdict: PASS
