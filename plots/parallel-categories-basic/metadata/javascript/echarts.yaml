review:
  strengths:
  - Clear, well-reasoned documentation in code comments explaining why a Sankey diagram
    was chosen over a native (nonexistent) parallel-categories chart type in ECharts.
  - 'Semantically meaningful color mapping: brand green/matte red reused correctly
    for the Purchased/Abandoned outcome per the style guide''s semantic-exception
    rule, while channel nodes use canonical palette order.'
  - Clean, fully deterministic, dependency-free code with correct theme-adaptive chrome
    in both renders.
  weaknesses:
  - Heavy ribbon crossing in the channel-to-category band reduces traceability of
    individual paths - reorder category or channel nodes to reduce crossings, per
    the spec's own guidance.
  - Only 3 categorical dimensions used (spec allows 3-6) - consider adding a 4th dimension
    (e.g. device type or region) to better demonstrate the multi-dimensional nature
    of a parallel-categories/alluvial chart.
  - Node labels sit directly over the ribbons rather than in clear whitespace, creating
    minor visual crowding - consider a small background halo behind labels or shifting
    the label anchor further from the node edge.
