review:
  strengths:
  - 'Theme-adaptive chrome is correct in both renders: light background reads as warm
    off-white (#FAF8F1-ish), dark reads as warm near-black (#1A1A17-ish), and every
    text element (title, subtitle, column headers, node totals, legend) uses ink/inkSoft
    tokens with no dark-on-dark or light-on-light failures.'
  - Ribbon width and node height both derive from a single shared `scale` constant
    (buildSegments + drawParallelCategories), so a session is worth the same pixel
    height in every column — the Sankey-style geometry stays internally consistent
    by construction.
  - 'Self-explanatory labeling: column headers (Acquisition Channel / Product Category
    / Purchase Outcome), per-node totals, and a bottom legend keyed to the source
    channel color let the diagram be read without external context.'
  - Deterministic, realistic e-commerce dataset (24 channel x product x outcome combinations,
    plausible session counts) with correct title format and legend labels.
  - 'Thoughtful, well-documented fallback design: since the sankey/dependency-wheel
    module isn''t vendored, the implementation hand-draws ribbons via chart.renderer
    with a clear header comment explaining the constraint and the chosen workaround.'
  weaknesses:
  - 'Palette assignment is cherry-picked rather than following canonical order: CHANNEL_ORDER
    (the visual top-to-bottom / legend order) is [Paid Search, Organic Search, Social
    Media, Referral], but CHANNEL_COLOR gives brand green (palette[0]) to "Organic
    Search" (2nd position) while "Paid Search" (1st position, largest channel, topmost
    row) gets palette[1]. There is no real-world semantic association (e.g. grass/wood/blood)
    that justifies skipping the first ordinal category for green - reassign palette[0]
    to the first channel in CHANNEL_ORDER, or drop the semantic-exception framing
    from the comment.'
  - Ribbon crossings between Product Category and Purchase Outcome are dense, and
    the translucent (fill-opacity 0.45) overlaps blend into muddy blended hues in
    the crossing zone, making it hard to trace a single channel's path through the
    diagram - exactly the failure mode the spec's own note warns about ("Consider
    ordering categories within each dimension to minimize ribbon crossings").
  - No hover/highlight interactivity was added despite this being a JS interactive
    library and Highcharts renderer elements supporting `.on('mouseover', ...)` -
    the spec explicitly calls out interactive highlighting as valuable for tracing
    paths in this plot type, and the HTML output is currently just as static as the
    PNG.
  - Because the whole diagram is drawn with chart.renderer primitives instead of any
    built-in Highcharts series/option surface, the library's high-level charting API
    (series, plotOptions, dataLabels, etc.) is barely exercised - a legitimate workaround
    given the missing sankey module, but it limits the demonstrated Highcharts idiomatic
    mastery.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "parallel-categories-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top-center; subtitle "1,900 e-commerce sessions · acquisition channel → product category → outcome" in soft gray-brown beneath it; three bold column headers (Acquisition Channel / Product Category / Purchase Outcome); node total labels ("Paid Search · 650", "Electronics · 750", "Purchased · 1,030", etc.) in dark ink next to/above their nodes; a bottom legend with 4 color swatches naming the channels. All text is clearly legible against the light background - no light-on-light issues found.
      Data: Four channel nodes (purple/lavender, green, blue, ochre) on the left flow through three neutral gray-brown product nodes in the middle into two neutral gray-brown outcome nodes on the right, connected by translucent ribbons colored by originating channel. First categorical color used is palette[0] brand green, but it is assigned to "Organic Search" rather than the first-listed/topmost channel "Paid Search" (see weaknesses).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, subtitle, column headers, node totals, and legend as the light render, now rendered in light ink/off-white and soft light-gray tones. All text is clearly legible against the dark background - no dark-on-dark failures found; tick-less design means there are no axis ticks to check, but every rendered text element was verified individually.
      Data: Same four channel colors as light render (purple/lavender, green, blue, ochre) - confirmed identical hex values across both themes, only the chrome (background, text, node fill for product/outcome nodes) flipped. Ribbon crossing zones between Product Category and Purchase Outcome show the same dense-overlap blending as in light mode.
      Legibility verdict: PASS
