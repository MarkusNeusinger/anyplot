review:
  strengths:
  - 'Faithful parallel-categories layout built on MUI X v9 composition: ChartsContainer
    with a custom child reading useDrawingArea, one shared count scale across all
    three axes'
  - Semantic Survived green / Did not survive matte red, backed by an SVG hatch pattern
    that the HTML legend swatch reproduces — readable without colour vision
  - Real Titanic counts (891 passengers) computed into segment totals shown in the
    labels (1st · 216, Male · 577, Did not survive · 549)
  - 'Native hover path highlighting in the HTML output: the hovered ribbon brightens
    and all others dim, as the Notes suggest'
  - 'Both themes correct: chrome from ink/inkSoft tokens, node bars flip from dark
    to light ink, data colours unchanged'
  weaknesses:
  - 'CQ-04 (code): lines 92-97 build a `heights` map by re-summing every row''s count
    × k, which `def.totals` (lines 50-60) already holds → use `(def.totals.get(name)
    ?? 0) * k` and drop the loop. Likely cause: the per-column node layout written
    independently of `columnDefs`.'
  - 'Suggestion: the subtitle reads ''across 891 (Passengers)'' — ''across 891 passengers''
    would read more naturally.'
  - 'Suggestion: ordering the Sex axis segments to reduce crossings (the Notes offer
    it) would calm the braid between the first two axes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold title "parallel-categories-basic · javascript · muix · anyplot.ai" top-left, grey subtitle "Passenger class → Sex → Outcome across 891 (Passengers) — ribbon width is proportional to Passengers.", a two-entry legend (green Survived, hatched red Did not survive), semibold column headers Passenger class / Sex / Outcome, category labels with counts (1st · 216, 2nd · 184, 3rd · 491, Female · 314, Male · 577, Survived · 342, Did not survive · 549). All dark text, all readable.
      Data: three dark-ink node bars; translucent bezier ribbons coloured by outcome — #009E73 for Survived, #AE3030 with diagonal hatching for Did not survive. The 3rd-class male non-survivor ribbon dominates the bottom; thin 3- and 6-passenger ribbons show as hairlines. No clipping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend text, column headers and category labels all in light ink; node bars flip to light grey. No dark-on-dark text.
      Data: same green and matte red ribbons with the same hatch as the light render (only the page behind the translucency differs); brand green clearly visible.
      Legibility verdict: PASS
