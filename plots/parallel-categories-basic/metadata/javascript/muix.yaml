review:
  strengths:
  - Genuine parallel-categories/Sankey construction hand-built on top of ChartContainer
    + useDrawingArea — accurate stacked node totals, bezier ribbons whose width is
    exactly proportional to passenger count.
  - Real, historically accurate Titanic aggregate data (891 total, 342 survived, 549
    did not) rather than invented numbers.
  - 'Semantic color choice — outcome-colored ribbons (brand green #009E73 for Survived,
    matte red #AE3030 for Did not survive) consistently applied across both link stages,
    matching the Imprint palette''s designated semantic-anchor role for slot 5.'
  - 'Both themes render correctly: warm off-white / near-black backgrounds, all chrome
    (title, subtitle, legend, node/column labels) readable in both, and ribbon data
    colors are pixel-identical between light and dark.'
  - Clean, minimal, deterministic code — no randomness, no unused imports, no fake
    interactivity.
  weaknesses:
  - Outcome is encoded solely by green-vs-red fill color with no secondary cue (pattern,
    stroke style, or position-independent label) — a red-green CVD-safe fallback (e.g.
    a dashed stroke or hatch on one category) would make the two outcomes distinguishable
    for deuteranope/protanope viewers, especially in the darker overlap regions where
    ribbons cross.
  - The thinnest ribbon (1st-class female, did-not-survive, n=3) renders only a few
    pixels tall and is barely distinguishable from the stroke outline — consider a
    small minimum-height floor for near-zero-count ribbons so rare combinations stay
    visible.
  - No hover/highlight interaction was wired up in the custom SVG (no onMouseEnter
    path-highlighting), even though the spec calls out 'interactive highlighting helps
    trace paths' as a strength of this plot type and the HTML output is the natural
    place to demonstrate it — this is a missed opportunity for library/technique mastery,
    not a static-render penalty.
  - Category order within each dimension is fixed by domain convention (class rank,
    sex, outcome) rather than optimized to reduce ribbon crossings, leaving a visually
    busy braided middle section — acceptable per spec (crossing-minimization is only
    a 'consider'), but a heavier read than necessary.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct light-theme surface, not pure white.
      Chrome: Dark title "Titanic Passengers · parallel-categories-basic · javascript · muix · anyplot.ai" top-left, gray subtitle beneath it, a two-swatch legend (Survived / Did not survive), and three bold column headers (Class, Sex, Outcome) above the plot area. Node labels ("1st · 216", "Female · 314", "Survived · 342", etc.) sit in dark ink beside each stacked bar. All text is clearly legible against the cream background.
      Data: Three columns of dark node bars (Class: 1st/2nd/3rd, Sex: Female/Male, Outcome: Survived/Did not survive) connected by two stages of curved, semi-transparent ribbons. Ribbon width is visibly proportional to passenger count — the "3rd · Male · Did not survive" ribbon is by far the widest, the "1st · Female · Did not survive" ribbon (n=3) is a thin sliver. Ribbons are colored by final outcome: brand green (#009E73) for Survived, matte red (#AE3030) for Did not survive; overlapping ribbons blend into darker brownish patches where a green and a red band cross.
      Legibility verdict: PASS — no light-on-light text, no clipped elements at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct dark-theme surface, not pure black.
      Chrome: Title and subtitle render in light ink (white / soft gray), fully readable. Legend swatches, column headers, and node labels all switch to light text and remain legible against the dark background — no dark-on-dark failures observed.
      Data: Ribbon colors are identical to the light render — same brand green and matte red hues at the same positions/widths, confirming only chrome (not data color) flipped between themes. The blended overlap patches are slightly darker/more muted than in the light render but still readable.
      Legibility verdict: PASS — all text and ribbons remain distinguishable from the dark background.
