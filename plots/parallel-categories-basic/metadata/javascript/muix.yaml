review:
  strengths:
  - 'Correct parallel-categories form: three named axes, segment lengths and ribbon
    widths scaled by one factor k from passenger counts'
  - Real Titanic training-set counts (891 passengers; 216/184/491 by class, 314/577
    by sex, 342/549 by outcome) that sum exactly
  - 'Ribbons colored by the last dimension with a correct semantic exception (Survived
    brand green, Did not survive matte red #AE3030) plus hatching as a CVD-safe second
    cue'
  - Hover highlighting traces one full path across all axes and dims the rest, the
    interactive tracing the Notes ask for
  - Natural category order with counts in every segment label
  - Composes the chart within the community surface (ChartsContainer + useDrawingArea
    + skipAnimation) since Sankey is Pro-only
  weaknesses:
  - 'VQ-03 (dark): the ''Did not survive'' legend swatch draws dark stripes (rgba(0,0,0,0.4))
    while the dark-theme ribbons carry light t.ink stripes, so the glyph does not
    match the marks it explains → draw the swatch hatch from the same t.ink token
    at about 0.45 opacity. Likely cause: hard-coded repeating-linear-gradient(...
    rgba(0,0,0,0.4) ...) in the legend span.'
  - 'Suggestion: the subtitle phrase ''across 891 (Passengers)'' reads like a column
    identifier; ''across 891 passengers'' reads more naturally.'
  - 'Suggestion: ribbons stack within each segment in data-row order; sorting the
    stacks by the next axis''s category would remove some avoidable crossings near
    the Sex axis.'
