review:
  strengths:
  - 'Fixed CVD accessibility from attempt 1: a diagonal hatch pattern now covers every
    "Did not survive" ribbon and its legend swatch, so outcome is distinguishable
    by texture as well as green-vs-red color.'
  - 'Fixed thin-ribbon visibility from attempt 1: a MIN_SEG=8px floor keeps the near-zero
    n=3 (1st-class female, did not survive) segment a visible sliver in both link
    stages instead of vanishing.'
  - Added hover-highlight interactivity (setHoveredRow) that brightens one passenger
    group's full class->sex->outcome ribbon path and dims all others - a genuine,
    spec-relevant use of MUI X's React composition model for "interactive highlighting
    helps trace paths".
  - Real, historically accurate Titanic aggregate data (891 total, 342 survived, 549
    did not survive) with node totals labeled at every stage of all three columns.
  - Both themes render correctly with pixel-identical data colors; all chrome (title,
    subtitle, legend, node labels) is fully theme-adaptive and legible on both the
    warm off-white and warm near-black surfaces.
  weaknesses:
  - ChartContainer does not set the library-mandated skipAnimation prop; harmless
    here since series=[] and all visible content is custom SVG rendered synchronously,
    but should be added on general principle per the muix rule to set it on every
    chart component.
  - Legend and highlight interaction are still hand-rolled SVG/DOM event handlers
    rather than MUI X's own ChartsLegend/tooltip primitives - a fine approach given
    there's no native parallel-categories chart, but leaves LM-02 short of full marks.
  - Category order within each dimension is fixed by domain convention (class rank,
    then sex, then outcome) rather than crossing-minimized, leaving a busy braided
    middle section - acceptable since the spec only "considers" this, not requires
    it.
  - 3 categorical dimensions (class/sex/outcome) sits at the low end of the spec's
    stated 3-6 dimension range.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 - not pure white.
      Chrome: dark-ink title "Titanic Passengers · parallel-categories-basic · javascript · muix · anyplot.ai", gray-ink subtitle, a two-swatch legend (Survived / Did not survive, the latter with a diagonal hatch swatch), bold "Class / Sex / Outcome" column headers, and dark node-total labels ("1st · 216", "Female · 314", "Survived · 342", etc.) — all clearly readable against the light background, no light-on-light issues.
      Data: three columns of dark node bars connected by two stages of curved, semi-transparent ribbons whose width is visibly proportional to passenger count (3rd-class/Male/Did-not-survive is by far the widest; 1st-class/Female/Did-not-survive, n=3, is a thin but now-visible sliver thanks to the MIN_SEG floor). Ribbons are colored by outcome: brand green (#009E73, palette position 1) for Survived, matte red (#AE3030, palette position 5) for Did not survive, with the red ribbons additionally carrying a diagonal hatch texture as a CVD-safe secondary cue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 - not pure black.
      Chrome: title, subtitle, legend, column headers, and node labels all switch to light ink (#F0EFE8 / #B8B7B0-equivalent) and remain fully readable — no dark-on-dark failures anywhere.
      Data: ribbon fill colors and the hatch texture are pixel-identical to the light render (same green/red, same widths, same positions) — only the chrome and node-bar fill (dark charcoal -> light gray) flipped, exactly as required.
      Legibility verdict: PASS
