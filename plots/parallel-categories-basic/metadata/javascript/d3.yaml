review:
  strengths:
  - Ribbons are colored consistently by source acquisition channel across BOTH link
    segments (channel→category and category→outcome), letting the viewer trace a full
    path's origin all the way to its final outcome — strong data storytelling for
    a flow diagram.
  - A shared pixels-per-unit scale (ky, computed as the min across all three columns)
    keeps a flow's ribbon the same height at both ends it touches, avoiding the classic
    Sankey artifact where a link's band height differs between source and target.
  - 'Halo-stroke text technique (paint-order: stroke with a pageBg-colored outline)
    keeps category and outcome labels legible where they sit directly on top of colored
    ribbons, in both light and dark themes.'
  - 'Correct Imprint palette usage: first categorical series is #009E73, data colors
    identical between themes, chrome (background/text) correctly flips per theme.'
  - 'Clean canvas usage: correct 3200x1800 landscape output, mandated title format,
    no edge clipping in either render.'
  weaknesses:
  - Only 3 of the spec's allowed 3-6 categorical dimensions are used; a 4th dimension
    (e.g. customer segment or device type) would better showcase parallel categories'
    multi-stage value.
  - Category ordering within each column isn't optimized to reduce ribbon crossings,
    so the middle band gets visually dense with crossings — consider reordering categories
    (e.g. sort by dominant flow) per the spec's own suggestion.
  - Ribbon opacity (0.65) produces muddy blended colors where multiple channel ribbons
    overlap in the crossing zones; a slightly different opacity or draw-order tweak
    could keep crossings more legible.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "parallel-categories-basic · javascript · d3 · anyplot.ai" centered at top in dark ink, clearly readable. Three column headers ("ACQUISITION CHANNEL", "PRODUCT CATEGORY", "PURCHASE OUTCOME") in medium-gray, uppercase, readable. All node labels (Organic Search / Paid Ads / Referral colored by channel; Electronics / Apparel / Home Goods and Purchased / Abandoned in dark gray with a light halo) are legible against both the page background and the colored ribbons behind them.
      Data: Ribbons flow left-to-right through three vertical node columns (black bars). Ribbon width is proportional to flow count. Ribbons are colored by source acquisition channel: Organic Search = #009E73 (green, first series as required), Paid Ads = light purple/lavender, Referral = blue — consistent across both link segments. Node bars are neutral ink-colored (not overloaded with extra hues), correctly used as structural anchors rather than a categorical series.
      Legibility verdict: PASS — no light-on-light issues found; category/outcome labels sitting on top of colored ribbons remain legible thanks to the stroke halo.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title and column headers now rendered in light ink/gray, clearly readable against the dark background. Node labels use light halo-stroke text (still dark-gray-ish fill per token, but the paint-order halo inverts to keep contrast against ribbons) — verified via pixel crop that "Electronics" renders as light/cream text with a dark outline on the blue ribbon, fully legible.
      Data: Same ribbon colors and channel mapping as the light render (#009E73 for Organic Search, etc.) — confirmed data colors are identical between the two renders; only chrome (background, node-bar/gap color, text) flips.
      Legibility verdict: PASS — no dark-on-dark failures found; all title, header, and node text remain clearly visible against the near-black background.
