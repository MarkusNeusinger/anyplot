review:
  strengths:
  - Creative native-ggplot2 construction of parallel-categories geometry (geom_ribbon
    + geom_rect + geom_text) with smoothstep interpolation for smooth band curves
    — a genuinely distinctive technique given ggplot2 has no native parallel-categories
    geom
  - Barycenter-based crossing-minimization applied across all three hops (channel->device->product->outcome),
    a real algorithmic effort to reduce visual crossing rather than using fixed category
    order
  - 'Correct Imprint palette usage (first series #009E73), correct theme-adaptive
    chrome tokens, and data colors verified identical between light and dark renders
    via the legend swatches'
  - Correct mandated title format and legend labeling; realistic, plausible customer-journey
    dataset with sensible conditional probabilities across channel/device/product/outcome
  - Reproducible (set.seed(42)), single theme-aware script following the ggsave/ragg
    conventions, saved at the correct 3200x1800 canvas size
  weaknesses:
  - 'High visual density/crossing in the later hops (Device->Product, Product->Outcome):
    the many overlapping semi-transparent ribbons blend into a busy central mass that
    makes it hard to trace individual paths, undermining data storytelling and per-element
    visibility. Consider stronger decluttering: bigger inter-node GAP, thinner/lower-alpha
    ribbon borders, or grouping same-color ribbons together within each node band
    to reduce apparent crossing.'
  - Node category labels (geom_text, size=3.4) are quite small relative to the crowded
    ribbon field behind them — bumping the size slightly would strengthen the visual
    hierarchy against the busy middle section.
  - Helper functions (barycenter_order, node_totals_for, build_hop_bands) add structural
    complexity beyond the simplest possible script; understandable given the custom-built
    geometry needed to fake this chart type in ggplot2, but worth a simplification
    pass if a lighter path is found.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "parallel-categories-basic · r · ggplot2 · anyplot.ai" top-left in dark ink, clearly readable. Legend "Acquisition Channel" with four solid swatches (Organic/green, Paid Search/lavender, Social/blue, Referral/ochre) in a bordered elevated-bg box, all text legible. Four axis-stage labels at bottom (Channel, Device, Product, Outcome) in soft ink, readable. Node boxes (Referral, Social, Paid Search, Organic / Mobile, Desktop / Electronics, Apparel, Home & Garden / Abandoned, Purchased) rendered as thin outlined rectangles with rotated black category text, all legible.
      Data: Semi-transparent ribbons (alpha 0.28) colored by acquisition channel flow from Channel through Device, Product, to Outcome, width-proportional to observation counts. First series (Organic) is Imprint green #009E73; other channels use lavender, blue, ochre from the Imprint palette. The middle two hops (Device->Product, Product->Outcome) show heavy crossing/overlap between ribbons, creating a visually dense, "spaghetti-like" mass in the plot's center that makes individual flows harder to trace, though channel-of-origin colors remain distinguishable at the ribbon ends.
      Legibility verdict: PASS (all text is readable against the light background; the only concern is visual density of the data ribbons, not text legibility)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, axis-stage labels, and node boxes as the light render, all rendered in light ink (#F0EFE8 for primary text, #B8B7B0 for soft text) against the dark background — no dark-on-dark failures observed anywhere (title, legend text, axis labels, and node category labels are all clearly legible).
      Data: Ribbon hues are confirmed identical to the light render via the legend swatches (green, lavender, blue, ochre match exactly) — only the chrome (background, text, node outline) flipped, as required. The same central crossing/density issue from the light render is present here too, and if anything looks slightly busier against the dark background since blended ribbon overlaps read as darker, harder-to-separate patches.
      Legibility verdict: PASS (no dark-on-dark text failures; the density/overlap issue is a data-storytelling weakness, not a legibility failure)
