review:
  strengths:
  - Ribbons are colored consistently by the first dimension (acquisition channel)
    across all three hops, so a customer's path keeps its origin hue end-to-end as
    the spec suggests for clarity
  - Ribbon width is correctly proportional to aggregated observation counts at every
    hop, verified against the stacked node totals
  - Smoothstep-interpolated bands produce smooth, polished curves between stages instead
    of angular connectors
  - Both renders correctly theme-adapt chrome (background, ink, node/legend borders)
    while keeping the four data colors identical between light and dark
  - Canvas dimensions, mandated title format, and Imprint palette compliance are all
    correct
  weaknesses:
  - Extreme ribbon crossing density (roughly 24 distinct flow combinations per hop)
    makes individual paths very hard to trace; the spec explicitly calls out 'consider
    ordering categories within each dimension to minimize ribbon crossings', but categories
    are kept in fixed definition order with no crossing-minimization (e.g. barycenter/greedy
    reordering)
  - Overlapping semi-transparent ribbons of different origin colors blend into muddy
    secondary hues (grey/brown blends) in high-density regions such as the Mobile/Desktop
    and Home & Garden areas, reducing traceability and mildly hurting CVD accessibility
  - The sheer number of thin overlapping bands creates visual noise that undercuts
    a clear focal point/data story — consider reordering categories to minimize crossings,
    reducing alpha further, widening hop spacing, or trimming to fewer categories
    per dimension to make paths distinguishable
  - geom_text node labels are legible but sit close to the visual limit set by the
    rotated 90 degree orientation combined with the surrounding ribbon clutter
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "parallel-categories-basic · r · ggplot2 · anyplot.ai" is dark ink, clearly readable top-left. Legend ("Acquisition Channel": Organic/Paid Search/Social/Referral swatches) sits below the title in a bordered box with dark text on off-white. Four vertical stage node columns (Channel, Device, Product, Outcome) each show white/off-white rectangular nodes outlined in soft grey-brown, with rotated (90°) black category labels ("Referral", "Social", "Paid Search", "Organic"; "Mobile", "Desktop"; "Electronics", "Apparel", "Home & Garden" — confirmed fully contained within its node box via a zoomed crop, no clipping; "Purchased", "Abandoned"). Bottom axis labels "Channel / Device / Product / Outcome" are dark and legible.
      Data: Ribbons are colored by first-dimension channel — green (#009E73, Organic), lavender (#C475FD, Paid Search), blue (#4467A3, Social), ochre (#BD8233, Referral) — at alpha 0.5, flowing left to right through all four stages, widths proportional to counts. Between hops the bands cross heavily and overlapping different-colored ribbons blend into secondary muddy tones (grey/brown/dusty-rose) in dense areas.
      Legibility verdict: PASS (all chrome text is readable; the underlying data pattern is hard to trace due to density, but that is a design/complexity concern, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and axis labels render in light off-white ink, clearly readable against the dark background. Node boxes are dark fill with light grey borders and light rotated category text — no dark-on-dark failures observed anywhere (node text, axis text, legend text, and title all show clear light-on-dark contrast).
      Data: Same four ribbon colors as the light render (verified identical green/lavender/blue/ochre hues at the same alpha), confirming data colors are unchanged between themes — only chrome (background, node fill, borders, text ink) flipped as required. Same heavy crossing/blending pattern as the light render.
      Legibility verdict: PASS (no dark-on-dark or light-on-light issues; readability limitation is due to ribbon density, not theme contrast).
