      Background: Warm off-white (#FAF8F1) plot and legend area, matching the light-theme surface — not pure white.
      Chrome: Title "parallel-categories-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly readable. A boxed legend "Acquisition Channel" with 4 swatches (Organic/Paid Search/Social/Referral) sits below the title, text is dark-on-light and legible. Four bottom-axis labels (Channel, Device, Product, Outcome) in dark ink, clearly readable. Small rotated category labels (Referral, Social, Paid Search, Organic, Mobile, Desktop, Apparel, Home & Garden, Electronics, Abandoned, Purchased) sit inside light node boxes with dark ink outlines — readable at full resolution but quite small (~7pt equivalent).
      Data: Four ribbon colors matching the Imprint palette: Organic=#009E73 (green, first series, correct), Paid Search=lavender (#C475FD), Social=blue (#4467A3), Referral=ochre (#BD8233). Ribbons flow left to right through Channel -> Device -> Product -> Outcome with width proportional to counts, using smooth S-curve bands. The Device->Product and Product->Outcome hops show heavy crossing/overlap of semi-transparent ribbons, creating visually dense, hard-to-trace mid-sections.
      Legibility verdict: PASS (all chrome text readable at full resolution; node labels are legible at full res but a mobile-scale concern is flagged in weaknesses)

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matching the dark-theme surface — not pure black.
      Chrome: Title, legend text, and axis labels all render in light ink (#F0EFE8/#B8B7B0) against the dark background — clearly readable, no dark-on-dark failures observed. Node boxes are dark-filled with light-ink text and a light-gray/soft border, legible.
      Data: Same four ribbon colors as the light render (Organic green, Paid Search lavender, Social blue, Referral ochre) — confirmed identical data-color hues between themes; only the chrome (background, text, node-box fill, legend box) flips. Same crossing/density pattern in the ribbons as the light render.
      Legibility verdict: PASS (no dark-on-dark or light-on-light issues found in either render)
