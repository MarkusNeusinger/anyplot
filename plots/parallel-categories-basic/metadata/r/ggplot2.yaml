review:
  strengths:
  - Correctly implements a parallel-categories/alluvial-style plot using only native
    ggplot2 geoms (geom_ribbon, geom_rect, geom_text) — no external package dependency
    (ggalluvial), respecting the library's 'no workarounds' rule.
  - Implements genuine barycenter-based crossing minimization (forward Sugiyama sweep)
    to order each downstream stage, instead of a fixed definition order — a real algorithmic
    technique, not a cosmetic shortcut.
  - Ribbon width is correctly proportional to observation counts via stacked cumulative
    sums at both the outgoing and incoming ends of each hop.
  - Smoothstep interpolation (t^2*(3-2t)) produces genuinely smooth S-curve ribbons
    rather than straight-line polygons, adding real visual polish.
  - 'Imprint palette applied correctly: first series (Organic) is #009E73, canonical
    order preserved for the remaining channels, data colors identical between light/dark
    renders, and theme-adaptive chrome (background, ink, legend box) correctly branches
    on ANYPLOT_THEME.'
  - 'Clean minimal chrome: no grid, no axis ticks/y-text, only the four stage labels
    at the bottom — consistent with the style guide''s minimalism principle.'
  - Reproducible (set.seed(42)), clean imports, and saves via ragg::agg_png at the
    exact landscape target (8x4.5in @ 400dpi = 3200x1800).
  weaknesses:
  - Node/category labels (geom_text, size=2.6mm ~7.4pt, rotated 90deg) are the smallest
    text in the plot and become illegible once the PNG is scaled down to ~400px mobile
    width — increase to ~size=3.5-4 or otherwise ensure these labels survive the mobile
    srcset downscale, since they carry essential content (category names), not decoration.
  - The Device->Product and Product->Outcome hops are extremely dense with crossing,
    alpha-blended ribbons — even with barycenter ordering, the middle of the chart
    reads as a tangle and it's hard to visually trace any single path from Channel
    to Outcome. Consider a larger GAP between nodes, a slightly lower ribbon alpha,
    or emphasizing one path more strongly so the chart tells a clearer story.
  - 'CQ-01 (KISS structure) is violated: the script defines three helper functions
    (barycenter_order, node_totals_for, build_hop_bands) purely to avoid duplicating
    per-hop logic. Given ggplot2 has no native alluvial geom this is understandable,
    but consider whether the three hops can be computed via a single vectorized/grouped
    pipeline instead of function definitions.'
  - 'DQ-03: outcome probabilities show only 38-50% cart abandonment, which is on the
    low end vs typical real-world e-commerce cart-abandonment rates (commonly cited
    60-70%+) — nudging these values higher would better match established real-world
    benchmarks.'
  - The mandated title occupies only ~43% of the plot width at fontsize 12 — noticeably
    smaller than the ~70-85% that's typical/expected for this exact title format;
    a modest fontsize increase would use the canvas more assertively without risking
    overflow.
  image_description: |-
