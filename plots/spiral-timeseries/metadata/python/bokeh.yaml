review:
  strengths:
  - Correct, well-executed Archimedean spiral construction (radius linear in accumulated
    theta) with the earliest data at the center, matching the spec's preference for
    uniform revolution spacing
  - Month radial grid lines and Jan-Dec labels give clean orientation, and bold year
    labels (2019-2023) mark the start of each cycle exactly as the spec requires
  - Correct Imprint sequential colormap (imprint_seq, brand green -> blue) encoding
    temperature magnitude along the spiral, with a labeled ColorBar including units,
    and data colors identical between light and dark renders
  - 'Full theme-adaptive chrome: legible in both renders with no dark-on-dark/light-on-light
    failures and no edge clipping of title, labels, or colorbar'
  - 'Clean, reproducible KISS code using idiomatic bokeh patterns: ColumnDataSource,
    field-based LinearColorMapper transform on segment glyphs, HoverTool, ColorBar'
  - Realistic, neutral synthetic dataset (5 years of daily temperatures for a temperate
    city) with plausible seasonal amplitude, mild warming trend, and noise
  weaknesses:
  - 'Title is missing the required language token: currently ''spiral-timeseries ·
    bokeh · anyplot.ai'' but the mandated format is ''{spec-id} · {language} · {library}
    · anyplot.ai'' -- it must read ''spiral-timeseries · python · bokeh · anyplot.ai''.
    Fix the `title=` string passed to figure(...).'
  - 'Design Excellence is solid engineering but stops at well-configured rather than
    publication-ready: the spec''s own selling point is revealing trend simultaneously
    with periodicity, yet the slight multi-year warming trend isn''t visually emphasized
    (e.g. no annotation, no subtle radial trend guide) -- viewers must infer it themselves
    from color alone.'
  - 'Library Mastery is good but generic-leaning: HoverTool + ColorBar are common
    across most interactive libraries; consider a more bokeh-distinctive touch (e.g.
    CustomJS-driven interaction, linked selection) to differentiate the implementation
    further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white -- matches spec.
      Chrome: Title "spiral-timeseries · bokeh · anyplot.ai" in dark ink, centered top. Dashed light-grey radial lines mark month boundaries with muted-grey "Jan"-"Dec" labels around the circumference. Bold dark "2019"-"2023" year labels sit near the top (Jan divider) of each revolution. A light-grey outer boundary ring outlines the final revolution. A vertical ColorBar sits top-right, labeled "Temperature (°C)" in muted ink with grey tick labels (0/10/20/30).
      Data: Five concentric spiral arcs (2019 innermost -> 2023 outermost) rendered as a continuous line whose color sweeps from brand green (~#009E73, cold/low temperatures) to blue (~#4467A3, warm/high temperatures) via the imprint_seq ramp -- correct per the style guide for single-polarity continuous data.
      Legibility verdict: PASS -- all text (title, month/year labels, colorbar title/ticks) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black -- matches spec.
      Chrome: Same title, now in light ink, centered top. Same dashed radial lines (low-opacity light grey) and month labels, now in a light muted tone. Year labels are near-white and bold. Outer boundary ring is a lighter grey line. ColorBar box background flips to the dark elevated tone (#242420-ish) with a light border, title/tick text now light-grey.
      Data: Same five spiral arcs with the identical green -> blue gradient as the light render -- confirms the data colors (Imprint sequential ramp) are unchanged between themes; only chrome flipped.
      Legibility verdict: PASS -- title, month/year labels, and colorbar text are all clearly readable against the dark background. No dark-on-dark failures observed (no black text on near-black background anywhere).
