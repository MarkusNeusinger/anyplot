review:
  strengths:
  - 'Creative, technically sophisticated radial time-series layout with per-year rings
    colored by an Imprint-derived sequential gradient (#009E73 -> #4467A3), correctly
    encoding temperature magnitude and backed by a custom SVG colorbar.'
  - Excellent theme adaptation - both light and dark renders are fully readable, chrome
    flips correctly, and data colors are pixel-identical between themes.
  - Careful data-to-color bucketing via an 11-day rolling mean plus itertools.groupby
    avoids spurious chords between unrelated same-temperature days - a thoughtful
    solution to pygal's straight-line-per-series limitation.
  - Injected month and year SVG text labels give clear cycle-start orientation and
    radial cycle subdivisions, directly satisfying the spec's labeling requirements.
  - 'Realistic, well-scaled synthetic data: 5-year daily temperature series with a
    plausible Northern Hemisphere seasonal cycle and a subtle multi-year warming trend.'
  weaknesses:
  - The 'spiral' renders as five discrete concentric rings (one per year) rather than
    a continuously expanding Archimedean spiral - day-of-year resets each year so
    the radius steps between years instead of increasing smoothly across the full
    time range. Visually and mathematically this reads closer to a polar ring/radial-loop
    chart than a single continuous coil. Consider accumulating a continuous angle
    (total elapsed days instead of day-of-year modulo) so Dec 31 of one year flows
    directly into Jan 1 of the next for a genuine spiral.
  - The bottom colorbar area is fairly tight - the 'Jan' tick label and the 'Daily
    average temperature (°C)' caption sit close together with limited vertical breathing
    room.
  - The core spiral/colorbar geometry is built via manual SVG post-processing outside
    pygal's own API (pygal has no native polar/radial chart type or colorbar) - a
    well-justified workaround given the library's limits, but it means pygal-distinctive
    features are used only moderately (hover tooltips, dashed stroke_style) rather
    than as the showcase of the visualization.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "spiral-timeseries · python · pygal · anyplot.ai" in bold dark ink at top, clearly readable and comfortably within canvas width (~75%). Month labels (Jan-Dec) in muted gray ring the outer edge, evenly spaced and legible. Bold black year labels (2019-2023) sit near the vertical axis marking the start of each ring. Dashed radial spoke lines (month grid) are subtle gray, visible but not competing with data. Bottom colorbar reads "Daily average temperature (°C)" with "-3°C" / "29°C" endpoint labels in dark ink.
      Data: Five concentric rings, innermost (2019) to outermost (2023), colored along a green-to-blue gradient (#009E73 -> #4467A3) matching the colorbar - warmer days green, cooler/higher-radius-shifted days blue-ish per the sequential scale. First-series/brand green is present and correct.
      Legibility verdict: PASS - all title, month, year, grid, and colorbar text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title in light/off-white ink, clearly legible. Month labels in light gray, year labels in bold white, both easily readable against the dark surface. Dashed radial spokes are light gray and subtle. Colorbar caption and endpoint labels ("-3°C"/"29°C") render in light ink, fully legible - no dark-on-dark failures observed anywhere (title, ticks, or colorbar text).
      Data: Same five rings, same green-to-blue gradient as the light render - colors are pixel-identical between themes, confirming only chrome (background/text) flipped as required.
      Legibility verdict: PASS - all text elements are clearly visible against the near-black background; no dark-on-dark text found.
