review:
  strengths:
  - Creative, fully custom Archimedean spiral built on pygal.XY with per-run color
    segmentation (itertools.groupby over a rolling-smoothed temperature bucket) that
    avoids drawing spurious long chords between unrelated same-temperature days —
    a thoughtful, non-obvious data-prep step
  - Hand-built colorbar and month/year label injection via direct SVG post-processing
    elegantly compensates for pygal's lack of native polar charts/colorbars, and both
    PNG and HTML outputs are generated from the same annotated SVG so they stay in
    sync
  - Per-point tooltip labels ({"value":..,"label":..}) give the interactive HTML output
    rich per-day hover detail (date + temperature) — a genuinely pygal-distinctive
    feature
  - 'Continuous color mapping strictly follows the Imprint sequential gradient (#009E73
    -> #4467A3), identical across both themes; chrome (background, spokes, text) correctly
    flips for light/dark'
  - 'All spec requirements present: constant-spacing Archimedean spiral, color-encoded
    magnitude, radial month grid lines, cycle-start (year) labels, center-to-edge
    chronological ordering, and a colorbar'
  weaknesses:
  - 'SC-04: Title omits the {language} segment — currently "spiral-timeseries · pygal
    · anyplot.ai" instead of the required "spiral-timeseries · python · pygal · anyplot.ai".
    Insert "python" between the spec-id and library name in the title string.'
  - 'LM-01: Much of the plot''s polish (month/year labels, colorbar) comes from directly
    manipulating the rendered SVG via xml.etree rather than through pygal''s own chart/Style
    API — functional and justified by pygal''s lack of native polar/colorbar support,
    but it caps idiomatic-usage credit.'
  - 'DE-02: The 12 month-guide spokes render as solid, fairly bold gray lines crossing
    the full radius, slightly busier than a perfectly subtle grid — consider a lighter
    stroke-width or dashed style so they recede further behind the data rings.'
  - 'CQ-01: Two top-level helper functions (_lerp_hex, _rolling_mean) deviate from
    the strict Imports -> Data -> Plot -> Save KISS shape; justified by the custom-SVG
    pipeline but still worth noting.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "spiral-timeseries · pygal · anyplot.ai" is large, bold, dark text, fully readable top-center. Twelve gray spokes radiate from center to month labels (Jan at bottom/6-o'clock, Jul at top/12-o'clock, etc.) in dark-gray sans-serif, all legible. Bold black "2019"-"2023" labels mark the start of each yearly ring along the vertical (January) spoke, positioned in clear space without overlapping the data lines. A horizontal green-to-blue gradient colorbar sits below the spiral, captioned "Daily average temperature (°C)" with "-3°C" / "29°C" endpoint labels in dark text.
      Data: Five concentric spiral rings (2019 innermost to 2023 outermost), each made of many short line segments colored along a continuous #009E73 (green) -> #4467A3 (blue) gradient keyed to smoothed daily temperature; inner/cooler stretches read green, warmer stretches read blue, and outer (later) years skew slightly more blue overall, consistent with the built-in warming trend. First/only data-color anchor is #009E73, matching the Imprint sequential recipe.
      Legibility verdict: PASS — all text (title, month labels, year labels, colorbar caption and endpoint labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render. Title, month labels, year labels ("2019"-"2023" now rendered in off-white/light color), and colorbar caption/endpoint labels are all re-colored to light tones and clearly legible against the dark background. Spokes remain a muted gray, still visible but not dominant.
      Data: The spiral rings and colorbar gradient use the identical #009E73 -> #4467A3 color mapping as the light render — only the chrome (background, spokes, text) flipped for the dark theme, as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and grid elements remain clearly visible, and the brand green #009E73 reads well on the dark surface.
