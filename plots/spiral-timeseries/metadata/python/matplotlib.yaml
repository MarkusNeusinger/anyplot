review:
  strengths:
  - True continuous Archimedean spiral (constant radial pitch, non-resetting cumulative
    angle) — data flows smoothly from 2019 near the center to 2023 at the outer edge
    with no discontinuities at year boundaries.
  - 'All spec-required features present: color-encoded magnitude via a LineCollection,
    radial month grid lines, cycle-start (year) labels precisely placed at each ring''s
    January origin, and a properly labeled colorbar.'
  - Theme adaptivity is thorough and correct — chrome, grid lines, labels, and colorbar
    all use INK/INK_SOFT tokens and flip correctly between plot-light.png and plot-dark.png,
    with identical Imprint data colors in both.
  - Canvas is exactly 2400×2400 with generous margins on all sides — no clipping,
    no overflow, confirmed by pixel-level edge inspection of title, month labels,
    and colorbar.
  - Clean, reproducible, single-purpose script (np.random.seed(42), no unused imports,
    no functions/classes, correct plot-{THEME}.png save call without bbox_inches='tight').
  weaknesses:
  - Diverging colormap centered at 0°C compresses most of the year's variation (roughly
    5-25°C in spring through fall) into a narrow band of similar reds, since the Berlin-like
    data skews positive relative to the midpoint — the seasonal detail that the spiral
    is meant to reveal is harder to distinguish than it would be with a norm better
    matched to the data's actual spread.
  - The 0.6°C total warming trend baked into the data across 5 years is too subtle
    to read visually in the color-mapped spiral, undercutting the spec's 'reveals
    periodicity and trend simultaneously' goal — amplify the trend or add a lightweight
    visual cue so it becomes perceptible ring-to-ring.
  - Colorbar label 'Daily Temperature (°C)' is set at fontsize=15, larger than the
    title at fontsize=9 — this inverts the typography hierarchy where the title should
    read as the largest, most prominent text element.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full 2400x2400 canvas.
      Chrome: Title "spiral-timeseries · python · matplotlib · anyplot.ai" in dark ink at top-left, clearly legible. 12 month labels (Jan-Dec) ring the outer edge, positioned with correct ha/va alignment per angle. 5 bold year labels (2019-2023) sit along the vertical Jan spoke, stacked from center outward, none overlapping. Radial month spokes and dashed year-boundary rings render in a soft muted grey at low alpha, clearly subordinate to the data. Colorbar on the right labeled "Daily Temperature (°C)" with tick labels -10 through 30, dark ink on light background.
      Data: A single continuous Archimedean spiral built from a LineCollection, colored with the theme-adaptive imprint_div diverging colormap (blue -> near-white -> red), oriented cold-to-hot per the domain convention for temperature. The 2019 revolution sits innermost, 2023 outermost, with radius increasing smoothly and continuously across all 5 years (no seams at year boundaries). Most of each ring reads deep red/maroon (spring-fall, above the 0°C midpoint) with a band of blue near the Dec-Jan-Feb months (below freezing).
      Legibility verdict: PASS - all text (title, month/year labels, colorbar ticks and label) is clearly readable against the light background; no light-on-light instances found. Verified via pixel-level crops of all four canvas edges — no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the canvas.
      Chrome: Same title, now in light ink (#F0EFE8), fully legible against the dark background. Month labels and year labels also render in light ink / soft light grey, clearly visible. Radial spokes and dashed rings remain a subtle light-grey at low alpha, correctly inverted from the light render. Colorbar ticks and label also flip to light ink.
      Data: Identical spiral geometry and identical Imprint data colors (same blue -> red diverging gradient, byte-for-byte the same hues as the light render) — only the chrome (background, text, grid) has flipped, exactly as required. No color drift between the two renders was found.
      Legibility verdict: PASS - no dark-on-dark failures found; all title, tick, and label text uses the light INK/INK_SOFT tokens and reads clearly against the #1A1A17 surface. Verified at the 400px mobile-width export (plot-light_400.png / plot-dark_400.png) as well — all labels remain legible at that scale in both themes.
