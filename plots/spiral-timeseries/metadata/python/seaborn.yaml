review:
  strengths:
  - 'Excellent spec fidelity: Archimedean spiral with earliest year at center, month
    spoke grid, year-start orientation labels, and a colorbar for the value mapping'
  - Correct Imprint palette and theme-adaptive chrome in both renders, with the canonical
    imprint_seq colormap used exactly as documented and no dark-on-dark/light-on-light
    failures
  - Supplementary Annual Warming Trend and Seasonal Cycle panels reinforce the spec's
    core claim that a spiral reveals periodicity and trend simultaneously, giving
    real data storytelling
  - Clean, reproducible, KISS code with a fixed seed; canvas lands exactly on the
    2400x2400 square target
  weaknesses:
  - Bold year labels (2020-2024) are placed directly on top of the color-coded spiral
    band; move them just outside the outer edge of each arm so contrast doesn't depend
    on which color falls under the label for a given data draw
  - Supplementary-panel axis/tick labels (7-8pt) are a bit small relative to the rest
    of the figure and risk being hard to read at mobile/catalog thumbnail sizes
  - The primary chart (spiral) is built entirely with raw matplotlib LineCollection
    rather than any seaborn API, since seaborn has no native polar/spiral chart; only
    the two side panels use seaborn idioms
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly.
      Chrome: Title "spiral-timeseries · python · seaborn · anyplot.ai" in dark ink, centered above the spiral; month ring labels (Jan-Dec), bold year labels (2020-2024), colorbar label "Daily Avg. Temp. (°C)", and both side-panel titles/axis labels/tick labels are all dark and clearly readable against the light background.
      Data: Spiral band uses a green-to-blue imprint_seq gradient (#009E73 -> #4467A3) encoding daily temperature; first/only series color is brand green #009E73 in the supplementary panels (regplot scatter+line, lineplot).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly.
      Chrome: All chrome correctly flips to light ink - title, month ring, year labels (white/bold), colorbar label, and side-panel titles/axis/tick labels are all light-colored and clearly readable against the dark background. No dark-on-dark failures found anywhere.
      Data: Spiral gradient, colorbar, regression line, and seasonal-cycle line use identical colors to the light render - confirmed only chrome changed between themes.
      Legibility verdict: PASS
