      Data: Spiral band uses a green-to-blue imprint_seq gradient (#009E73 -> #4467A3) encoding daily temperature, growing outward from 2020 (center) to 2024 (outer arm). The first/only series color in the supplementary panels (regplot scatter+line, lineplot with sd error band) is brand green #009E73.
