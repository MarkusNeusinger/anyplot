      Data: A continuous Archimedean spiral built from densely packed small circular markers, colored along the Imprint imprint_seq scale from brand green (#009E73, cold days) to blue (#4467A3, warm days). The earliest data (2019) is at the center, expanding outward to 2023 at the outer edge, exactly as the spec requires. A faint thin connector line traces beneath the markers.
