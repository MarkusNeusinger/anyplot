review:
  strengths:
  - Correct Archimedean spiral construction with the earliest year innermost and later
    years expanding outward, exactly matching the spec's 'expand outward, earliest
    closest to center' requirement.
  - Radial month gridlines anchored at Jan (12 o'clock) combined with year-start labels
    give strong dual-cycle orientation, letting the viewer align seasons across years
    at a glance.
  - 'Diverging Imprint gradient (#AE3030 - theme background - #4467A3) is built and
    applied correctly, identically across both themes, with a domain-informed midpoint
    (~13 degC annual mean) rather than an arbitrary 0.'
  - Clean, minimal chrome (blank axes/spines/ticks) appropriate for a radial layout;
    all sizing is explicit and the script is fully reproducible (seeded RNG, single
    flat script, no helper functions).
  weaknesses:
  - Year labels ('2019'-'2023') sit directly on top of the temperature-colored spiral
    ring instead of beside it - the text visually collides with the data path at every
    single year boundary in both themes. Shift the label x/y further outside the ring
    (e.g. larger negative x offset, or nudge along the radius) so labels sit in clear
    whitespace before the ring starts.
  - Legend title 'Temp (°C)' is set flush against the top border of the legend key
    box in both renders - the tops of the 'T' and '(' glyphs touch the frame line,
    giving a cramped look. Add a small amount of top padding/margin above the legend
    title.
  - The geom_path color segments render as small tiled color blocks rather than a
    smoothly blended gradient line, a byproduct of plotting many short discretely-colored
    segments. Not a correctness issue, but a polish nit - consider whether a denser
    point count or line join tuning would smooth the visual transition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the full 2400x2400 canvas, matches spec.
      Chrome: Title "spiral-timeseries · python · plotnine · anyplot.ai" in dark ink, comfortably sized (~65% width), clearly legible. Month labels (Jan-Dec) ring the outside of the spiral in soft gray, all legible. Year labels (2019-2023) sit in muted gray but are placed directly ON the colored spiral ring, overlapping the data path. Legend box "Temp (°C)" with a vertical diverging colorbar (red high / white-ish mid / blue low) and 0/10/20/30 tick labels, all legible; legend title glyphs touch the top frame border (cramped but not clipped).
      Data: Spiral path colored via a red(#AE3030)-to-blue(#4467A3) diverging gradient with the theme background as the midpoint color, encoding daily temperature. Five clearly separated revolutions (2019 innermost to 2023 outermost), warm months (Jun-Aug) reading deep red, cold months (Dec-Feb) reading blue, consistent with a Northern Hemisphere seasonal cycle. First-series/data color usage matches the Imprint diverging recipe.
      Legibility verdict: PASS overall, with a documented defect (year-label/data-path overlap) — all text is technically readable, but not cleanly separated from data.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the full canvas, matches spec.
      Chrome: Title renders in light ink (#F0EFE8-like), fully legible against the dark background. Month labels are legible in light gray. Year labels (2019-2023) are legible light-gray text but, exactly as in the light render, sit directly on top of the spiral ring — same overlap defect reproduced in this theme. Legend title/ticks render in light text on the dark legend panel, legible; same cramped top-padding issue on the legend title as light mode.
      Data: Identical red/blue diverging data colors as the light render (data hues do not shift with theme) — only chrome (background, text, gridlines, legend panel) flips as required. The diverging colormap's midpoint equals the panel background (#1A1A17), per the style guide's theme-adaptive midpoint rule for imprint_div, so near-13°C segments visually blend toward the background — this is the documented/intended diverging-cmap behavior, not a defect.
      Legibility verdict: PASS overall; no dark-on-dark failures found. Same year-label/data overlap defect as light mode carries over.
