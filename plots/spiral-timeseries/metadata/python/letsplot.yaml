review:
  strengths:
  - Constant-spacing Archimedean spiral with one revolution per year, so seasons line
    up along radii
  - theme_void with month spokes and rim labels gives clean orientation
  - Year labels mark each cycle start
  weaknesses:
  - 'VQ-07 (both): the path uses scale_color_viridis, a forbidden colormap → the imprint_seq
    marks ramp with the theme''s stops via ramp_color and scale_color_gradientn. Likely
    cause: scale_color_viridis(name=''Temp (°C)'').'
  - 'VQ-05, VQ-07 (both): the canvas is 3600x3600 instead of 2400x2400 (+1200 × +1200)
    and the fixed aspect leaves pure-black unpainted strips at the top and bottom
    → ggsize(600, 600) at scale=4 inside a one-panel gggrid carrying the page color.
    Likely cause: ggsize(900, 900) on a coord_fixed plot.'
  - 'SC-04 (both): the title ''Daily Temperatures 2019–2023 · spiral-timeseries ·
    letsplot · anyplot.ai'' lacks the language segment → ''… · spiral-timeseries ·
    python · letsplot · anyplot.ai''. Likely cause: the title string.'
  - 'VQ-02 (both): the year labels 2020–2023 sit where the previous revolution passes,
    so the ring line runs through their digits → place them between passes or give
    them a page-colored background. Likely cause: year label radius inner_r + spacing*yr.'
  - 'Suggestion: lets-plot tooltips on geom_path would make the HTML version readable
    day by day.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 inside the plot box, but solid black strips at the top and bottom canvas edges; canvas 3600x3600
      Chrome: title 'spiral-timeseries · letsplot · anyplot.ai' visible top-left in dark ink; large year labels 2019–2023 near the top spoke; month labels around the rim in INK_SOFT; viridis colorbar 'Temp (°C)' on the right; grey frame around the panel
      Data: five-revolution Archimedean spiral colored with viridis (purple winters, yellow-green summers); faint radial spokes at month starts; year labels 2020–2023 crossed by the passing ring
      Legibility verdict: PASS (text readable; edge strips are a chrome defect)

