review:
  strengths:
  - Correct canonical square canvas (2400x2400), no AR-09 clipping, both themes render
    cleanly with proper chrome flip
  - 'Faithful spiral-timeseries geometry: earliest data closest to center, constant
    radial growth per cycle (true Archimedean spiral), color encodes magnitude via
    imprint_seq'
  - Radial month-boundary grid lines and 'Year N' cycle-start labels give clear orientation
    without cluttering the minimalist design
  - Colorbar is clearly labeled with units, uses the sequential imprint_seq colormap
    correctly, and is CVD-safe
  - 'Clean, idiomatic Makie code: hidedecorations!/hidespines! for minimal chrome,
    DataAspect for correct circular geometry, Statistics.quantile for a thoughtful
    color-range choice'
  weaknesses:
  - The 5th-95th percentile color clamp still leaves most of the spiral a near-uniform
    green with color variation concentrated in short high-value arcs near each cycle's
    holiday peak — the weekly +/-10% oscillation and back-to-school bump are barely
    distinguishable in color. Try a narrower/adaptive normalization (e.g. clamp closer
    to the non-holiday trend band) so mid-range day-to-day variation reads more clearly.
  - Data storytelling could go further to visually distinguish the weekly ripple and
    back-to-school bump — e.g. modest line-width variation keyed to value, per the
    spec's 'line thickness should encode value magnitude' note — rather than relying
    on color alone.
  - Library mastery could lean on more distinctive Makie features (e.g. a band!/ribbon
    fill under the spiral, or scatter! markers at cycle-start points) to differentiate
    further from a generic polar-line plot.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "spiral-timeseries · julia · makie · anyplot.ai" centered at top, clearly readable. Four "Year N" labels in soft dark gray sit along the vertical axis inside each spiral band, all legible. Subtle light-gray radial grid lines (month boundaries) span from the inner spiral out to its outer edge at ~12 evenly spaced angles, faint but visible, not competing with the data. A thin vertical colorbar on the right is labeled "Daily sales (USD thousands)" with tick labels 40/50/60/70/80, all in dark/soft-dark text, clearly legible.
      Data: A continuous Archimedean spiral of 4 revolutions (4 years), earliest data at the center, expanding outward. The line is brand green (#009E73) for the vast majority of its length, transitioning smoothly to blue (#4467A3) in a short arc just before each cycle boundary (the holiday sales peak near day 350 of each year), most visibly in years 3 and 4. Line width (~3.5px doubled) is prominent for the data density (~1460 points).
      Legibility verdict: PASS — all text (title, year labels, colorbar label/ticks) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title is rendered in light off-white text, clearly visible against the dark background. "Year N" labels use the lighter soft-ink token and remain legible. Radial grid lines are faint light-gray, still visible but subtle. Colorbar label and tick text use light-toned tokens and are clearly readable against the dark canvas — no dark-on-dark failures observed anywhere (title, labels, ticks all correctly flipped to light ink).
      Data: Identical spiral geometry and identical green-to-blue color mapping as the light render — confirmed the data colors (green #009E73 to blue #4467A3) are unchanged between themes; only the chrome (background, text, grid) flipped.
      Legibility verdict: PASS — all text elements read clearly on the dark surface; no dark-on-dark or contrast failures found.
