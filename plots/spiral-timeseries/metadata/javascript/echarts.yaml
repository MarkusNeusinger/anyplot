review:
  strengths:
  - 'Correct Archimedean spiral geometry: radius = cycleIndex + dayFraction produces
    constant, uniform spacing between the three revolutions, matching the spec''s
    ''Archimedean spiral preferred'' guidance.'
  - 'Cycle orientation is clear: Jan sits at the top with clockwise month labels around
    the angle axis, and ''Year 1/2/3'' labels on the radius axis mark the start of
    each revolution, satisfying the spec''s labeling requirement.'
  - Title exactly matches the required 'spiral-timeseries · javascript · echarts ·
    anyplot.ai' format, with a helpful subtitle clarifying the revolution-to-year
    mapping.
  - 'Theme-adaptive chrome is correctly threaded through: title, subtitle, axis labels,
    tick labels and grid lines all use t.ink/t.inkSoft/t.grid, and both light and
    dark renders are fully legible with no dark-on-dark or light-on-light failures.'
  - Deterministic mulberry32 PRNG is used instead of a naive LCG, avoiding float-precision
    pitfalls and guaranteeing reproducibility.
  - Square canvas orientation is the right call for this radially symmetric chart
    type.
  weaknesses:
  - 'Color-encodes-value-magnitude is broken: pixel sampling of the rendered PNG across
    every radius band (0-1180px) and every angle (0-360°) shows the spiral line is
    a single uniform hue (~226°, RGB≈(95,124,222)) that matches ECharts'' own default
    theme blue (#5470c6), not the declared Imprint imprint_seq gradient (#009E73 →
    #4467A3) set via visualMap.inRange.color. The continuous visualMap (type:''continuous'',
    dimension:2, seriesIndex:0) is not actually recoloring the polar line series''
    lineStyle — most likely because ECharts'' visualMap on a ''line'' series drives
    per-point itemStyle by default, which is invisible here since showSymbol:false
    hides all symbols. Fix: either turn on tiny symbols so the visualMap-driven itemStyle
    color shows, or render as type:''scatter'' with dense per-day points (itemStyle
    color driven by visualMap) so the color gradient is actually visible along the
    spiral, or manually split the line into per-segment pieces colored from t.seq
    by interpolated value.'
  - Because of the above, the spec's core requirement ('Color or line thickness should
    encode value magnitude along the spiral') is not visually met at all — the entire
    seasonal/output pattern is invisible; only the outward radial growth from the
    spiral geometry itself is visible. Line thickness is also constant (3.5px) and
    does not compensate.
  - 'The visualMap legend (''High''/''Low'' with a green-to-blue swatch) is disconnected
    from the actual data: it implies a working color mapping that the chart does not
    deliver, which is misleading to a viewer.'
  - 'Scale/domain mismatch for DQ-03: framing this as a ''solar-farm'' output with
    9-49 kWh/day values reads more like a single rooftop panel or small residential
    system — utility-scale solar farms typically produce many MWh-GWh per day. Either
    rename to ''rooftop solar panel'' or scale the values up ~1000x with matching
    units.'
  - 'Minor VQ-02 nit: the ''Year 3'' radial-axis label sits right on top of the outermost
    spiral revolution near the 12 o''clock position, slightly touching the line.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "spiral-timeseries · javascript · echarts · anyplot.ai" and subtitle "Daily solar-farm output (kWh) · each revolution = 1 year" render in dark ink, clearly legible. Month labels (Jan...Dec) ring the outer angle axis; "Year 1/2/3" labels sit on the vertical radius axis near the top. Radial and angular grid lines are thin, light gray, subtle. The "High"/"Low" visualMap legend on the right renders a green-to-blue vertical color bar with dark, readable text.
      Data: The spiral itself (three revolutions, Archimedean, expanding outward from center) renders as a single continuous line. Pixel-sampling across the full radius range (0-1180px) and full angle range (0-360°) shows this line is a uniform hue (~226°, RGB≈(95,124,222)) matching ECharts' own default palette blue, NOT the declared imprint_seq gradient (#009E73 → #4467A3) — the visualMap-driven color encoding of value magnitude is not actually working; the colorbar legend's green-to-blue gradient never appears on the data itself.
      Legibility verdict: PASS (all text/chrome legible) but the plot's core data encoding (color = value) FAILS to render as intended — see weaknesses.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, month labels, and "Year 1/2/3" labels all render in light ink (near-white/light-gray), fully legible against the dark background — no dark-on-dark failures. Grid lines remain subtle and visible. The visualMap "High"/"Low" legend text is light-colored and readable.
      Data: The spiral line color is identical to the light render (same uniform ECharts-default-blue hue, ~226°) — colors are consistent across themes as required, but this only confirms the SAME broken (non-Imprint, non-value-encoded) color is reused, not that the intended data encoding was fixed for dark mode.
      Legibility verdict: PASS (all text/chrome legible in dark theme) but same color-encoding failure as light render.
