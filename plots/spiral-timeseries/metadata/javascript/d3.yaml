review:
  strengths:
  - 'Correct Archimedean spiral geometry: constant radial spacing per revolution (r
    = r0 + k*theta), earliest data at the center, expanding outward exactly as the
    spec requires.'
  - Radial dashed grid marks month boundaries at the same angle on every revolution,
    so seasons align vertically across years — exactly the periodicity effect the
    spec calls for.
  - Per-segment diverging color encoding (cold blue -> hot red, built from the Imprint
    `div` tokens) plus a correctly oriented vertical colorbar legend with max/avg/min
    labels.
  - '''Year N'' labels mark the start of each revolution for orientation, matching
    the spec''s labeling requirement.'
  - Deterministic seeded LCG data generation with a realistic seasonal cycle plus
    a gradual warming trend across the 5 years.
  - Backgrounds and chrome are correctly theme-adaptive in both renders; data colors
    are identical between light and dark, only chrome flips.
  weaknesses:
  - Legend numeric labels and month/year labels (13-14px) become hard to read once
    the chart is scaled down to the ~400px mobile thumbnail — e.g. '29.7°C' at the
    top of the colorbar is nearly illegible at that size. Consider slightly larger
    font sizes for these secondary labels.
  - The spiral is drawn as ~1825 individual manually-computed <line> segments rather
    than via d3-shape's lineRadial/curve generators; functionally fine (needed for
    per-segment color blending) but misses a chance to showcase idiomatic d3-shape
    radial-path usage.
  - Title occupies only ~40% of the canvas width on the square layout, smaller than
    typical — could be sized up slightly for stronger visual presence (minor, not
    overflow).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "spiral-timeseries · javascript · d3 · anyplot.ai" and subtitle "Daily average temperature · one revolution = one year" in dark ink, centered top, fully readable. Month labels (Jan-Dec) ring the perimeter in medium-gray ink, all legible. "Year 1"-"Year 5" labels in bold dark ink mark the start of each revolution, clearly readable. Dashed radial spokes are subtle but visible.
      Data: An Archimedean spiral of 5 revolutions (1825 daily points), colored along its length by a diverging blue (cold) -> red (hot) scale built from the Imprint div tokens. A vertical gradient colorbar on the right labeled "Temp" shows 29.7°C (top/hot) to 1.6°C (bottom/cold) with a 15.8°C avg midpoint label. Colors are clearly distinguishable against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title and subtitle rendered in light/white text, fully readable against the dark background. Month labels in light gray, "Year N" labels in white bold — all legible, no dark-on-dark issues. Dashed radial spokes remain subtly visible.
      Data: Same blue-to-red diverging spiral and colorbar as the light render — data colors are identical between the two themes, confirming only chrome flipped. Colorbar text remains legible against the dark background.
      Legibility verdict: PASS
