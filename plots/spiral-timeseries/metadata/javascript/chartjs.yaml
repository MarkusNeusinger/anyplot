review:
  strengths:
  - 'Correct Archimedean spiral geometry: radius grows linearly with elapsed time,
    earliest data sits at the center, and the spiral expands outward across exactly
    3 full cycles'
  - Month spokes and dashed cycle-boundary rings give a clear radial/angular grid
    so seasons align vertically across years, exactly as the spec asks
  - Color correctly encodes value magnitude using the Imprint imprint_seq ramp (green
    low -> blue high), identical between light and dark renders
  - Color-bar legend is present with min/max values in °C and an axis-equivalent label
    ("Avg. temperature"), satisfying the spec's legend requirement
  - 'Theme-adaptive chrome is correct in both renders — no dark-on-dark or light-on-light
    failures, backgrounds match #FAF8F1/#1A1A17'
  - Title format is exactly "spiral-timeseries · javascript · chartjs · anyplot.ai"
  - Deterministic data generation via a fixed-seed LCG, appropriate given the browser
    has no seeded Math.random()
  - Clever, idiomatic use of Chart.js's per-segment borderColor callback plus a custom
    afterDraw plugin to implement a chart type with no native Chart.js support
  weaknesses:
  - The +0.5°C/year warming trend is nearly invisible against the ±1.4°C daily noise
    — the three rings look almost identically colored at a glance, undermining the
    spiral's core value of revealing a multi-year trend alongside periodicity. Increase
    the per-year trend magnitude (e.g. ~1.5-2°C/year) or reduce the noise amplitude
    so successive rings show a perceptible color shift.
  - The year labels ("2022"/"2023"/"2024") are placed very close to the spiral line
    at their radius, with only a few pixels of clearance — nudge them further outward
    or add a small radial/tangential offset for cleaner separation from the data line.
  - Design Excellence is solid but not exceptional — typography still relies on default
    sans-serif; a more distinctive font-weight/letter-spacing treatment for the title
    and year labels would push the polish further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "spiral-timeseries · javascript · chartjs · anyplot.ai" in bold dark ink at top, centered. Month labels (Jan..Dec) in medium-gray around the outer ring. Year labels (2022/2023/2024) in bold dark ink near the start of each spiral revolution. Color-bar legend bottom-left with "0.7°C" / "24.0°C" endpoints and "Avg. temperature" caption in gray. All text is clearly readable against the light background.
      Data: Three-revolution Archimedean spiral, earliest point at center, expanding outward. Line color ramps from brand green (#009E73, coldest) to Imprint blue (#4467A3, warmest) along the segment-colored line, matching a sinusoidal seasonal pattern (green near Jan/Dec at the bottom of each ring, blue near Jul at the top). Dashed concentric circles mark cycle boundaries; dashed radial spokes mark month subdivisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in bold near-white ink, month labels in light gray, year labels in near-white bold ink, color-bar caption/values in light gray. No dark-on-dark or light-on-light failures observed — every chrome element is clearly legible against the dark surface.
      Data: Same spiral geometry and identical green-to-blue color ramp as the light render (data colors do not change with theme, only chrome flips) — confirmed positions of color transitions match between the two renders.
      Legibility verdict: PASS
