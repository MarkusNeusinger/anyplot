review:
  strengths:
  - Correct Archimedean spiral (constant spacing between revolutions), computed continuously
    so the earliest data sits closest to the center as required.
  - 'Full spec feature set present: color-coded value magnitude, radial month grid
    marking cycle subdivisions, cycle-start (year) labels for orientation, and a colorbar
    legend.'
  - 'Genuine MUI X library engagement: a real ScatterPlot series (with valueFormatter
    and item tooltip) for the cycle-start markers, plus useXScale/useYScale hooks
    to project the custom spiral geometry into the chart''s coordinate space — not
    a generic default chart.'
  - Correct Imprint sequential palette usage for the continuous temperature scale;
    data colors are identical between light and dark renders, with theme-correct chrome
    in both.
  - 'Square canvas (2400x2400) exactly matches the ''//# anyplot-orientation: square''
    directive; nothing is clipped in either render.'
  - Deterministic, seeded (LCG, seed=42) data generation; clean imports with no unused
    symbols.
  weaknesses:
  - The secondary line-width ramp (2-5.5px) meant to reinforce the value encoding
    is barely perceptible in the rendered PNG — either widen the range or drop it
    and rely on color alone for clarity.
  - Year labels (e.g. '2024') sit close enough to the spiral stroke passing through
    that point that they nearly touch it — add a small offset or background halo so
    the label fully separates from the data line.
  - The coded multi-year warming trend (WARMING_PER_YEAR_C=0.35, ~1.4°C total over
    5 years) is dwarfed by the ~13°C seasonal amplitude and is not visually verifiable
    as 'later revolutions running consistently warmer' — either increase the trend's
    realistic magnitude slightly or add a subtle visual cue (e.g., a faint trend arc/annotation)
    so the claimed pattern is actually visible.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "spiral-timeseries · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Twelve month labels (Jan-Dec) ring the outside of the spiral with short radial tick marks, all in soft dark gray, clearly legible. A right-side colorbar labeled "Avg Temp" with "30°C" / "15°C" / "-1°C" stops is fully visible and legible.
      Data: Five concentric spiral revolutions (2020-2024) rendered as a continuous line colored along an Imprint sequential green-to-blue scale keyed to temperature (green = cold months, blue = warm months); five black dot markers with adjacent "2020"-"2024" text labels mark the start of each yearly revolution along the top (Jan) spoke, with the earliest year (2020) closest to the center.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, month labels, and colorbar as the light render, now rendered in light gray/off-white text, clearly legible against the dark background. Grid tick marks remain subtle but visible.
      Data: The spiral's green-to-blue color mapping is visually identical to the light render (same hues at the same radii/angles) — only the chrome (background, text, grid) flipped, as required. Year-marker dots switch from black to light/white to stay visible on the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, tick, and legend text remains clearly visible.
