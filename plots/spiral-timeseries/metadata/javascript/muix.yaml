review:
  strengths:
  - 'Calendar-correct Archimedean spiral: each point''s angle is its share of its
    own calendar year, so the same date in every year sits at the same angle, clockwise
    from the top, and the winter (green, thin) and summer (blue, thick) bands line
    up along the radii in both renders'
  - Value is encoded twice, by imprint_seq color and by stroke width (2 to 5.5 px),
    so the seasonal peaks also read through line weight alone
  - 'Idiomatic MUI X composition: ChartsContainer with hidden linear axes set to equal
    limits on a square drawing area keeps the spiral circular, and a custom SVG layer
    reads the scales through useXScale/useYScale'
  - Each cycle start is a ScatterPlot series in the theme ink with a ChartsTooltip
    item trigger, so the year markers can be hovered in the HTML view, and each one
    carries a bold year label
  - Month spokes in the grid token stay lighter than the spiral, start clear of the
    hub and follow each month's real length, with month labels at the middle of each
    month, anchored by side
  - All chrome comes from ANYPLOT_TOKENS, so both themes are correct and the data
    colors are the same in both renders
  weaknesses:
  - 'Suggestion: the community ContinuousColorLegend, fed by a zAxis colorMap built
    from t.seq, could replace the hand-drawn gradient rect and the nice-tick computation
    for the colorbar.'
  - 'Suggestion: the data''s 0.35 °C/year warming barely shows on the ramp; the year
    labels could carry each year''s mean so the trend is readable as well.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: centered bold title "spiral-timeseries · javascript · muix · anyplot.ai" with a soft-ink subtitle ("1,825 daily values, Jan 1, 2020 to Dec 29, 2024 · one revolution per year, earliest at the centre"); twelve month labels Jan–Dec run clockwise from the top around the rim in inkSoft; bold year labels 2020–2024 sit next to near-black dots along the 12 o'clock spoke; a vertical colorbar on the right shows ticks 0–25 and the rotated title "Daily mean temperature (°C)". All text is dark on light and readable.
      Data: one continuous Archimedean spiral of 5 revolutions with even spacing, expanding outward from the center. Its color runs from brand green #009E73 (cold, Jan, top) to blue #4467A3 (warm, Jul, bottom), and its stroke widens with the value. The seasonal bands line up along the radii. Thin light-grey month spokes sit behind the spiral. The last revolution ends just before the top (Dec 29).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, year labels and colorbar title in light ink, month labels and colorbar ticks in light soft ink, all clearly readable; no dark-on-dark text. The cycle-start dots flip to off-white, the spokes to a subtle dark grey that stays visible.
      Data: the spiral's green-to-blue colors and stroke widths are identical to the light render; brand green stays clearly visible on the dark surface.
      Legibility verdict: PASS
