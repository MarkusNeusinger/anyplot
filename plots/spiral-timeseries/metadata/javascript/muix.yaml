review:
  strengths:
  - 'Correct Archimedean spiral geometry: constant spacing between revolutions, earliest
    data (2020) at the center, expanding outward'
  - Color encodes value magnitude via the Imprint sequential palette (t.seq), with
    line thickness as a secondary encoding for temperature
  - 'All spec-required orientation aids present: radial month grid lines/labels, cycle-start
    (year) markers, and a labeled colorbar with units'
  - 'Both light and dark renders are theme-correct (#FAF8F1 / #1A1A17 backgrounds,
    readable ink on both), with identical data colors between themes'
  - Deterministic, realistic 5-year daily temperature dataset (seasonal cycle + gradual
    warming trend) that visibly shows both periodicity and trend as the spec's Notes
    section asks for
  weaknesses:
  - Sequential color mapping runs cold=green / warm=blue, which reads counter-intuitively
    for a temperature variable (viewers commonly expect warm=red/orange); consider
    whether the mapping direction communicates the data as clearly as possible
  - series=[] on ChartContainer means none of MUI X's actual chart primitives (LineChart/ScatterChart,
    built-in tooltips/legend) are used — the component only borrows useXScale/useYScale
    for coordinate mapping and draws raw SVG, which limits how much of the library's
    own capability is demonstrated
  - 12 full-length spoke gridlines from center to edge cross all 5 spiral revolutions
    and add visual clutter; shorter tick marks near the outer edge (instead of full-radius
    spokes) would read cleaner
  - Overall polish is functional but plain — mostly two flat-colored spiral bands
    plus text labels, without additional refinement (e.g. subtler grid, radial fade,
    tighter typographic hierarchy) that would elevate it further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "spiral-timeseries · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Month labels (Jan-Dec) around the outer rim in medium-gray ink, all readable. Year labels (2020-2024) along the top spoke in dark ink next to black dots, all readable. "Avg Temp" colorbar legend on the right with "30°C" / "15°C" / "-1°C" tick labels in soft ink, all legible.
      Data: Five spiral revolutions (one per year, 2020-2024) drawn as continuous bands that transition between teal-green (cooler values) and blue (warmer values) — matches the Imprint sequential palette (t.seq). Line width increases slightly for higher values (secondary encoding). Outer revolutions show more blue in the warm months than inner ones, visually confirming the gradual warming trend.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, month labels, year labels, and colorbar legend, now rendered in light ink/gray against the dark background. All are clearly legible with no dark-on-dark failures — the theme-adaptive ink token was threaded through every ChartsText element and the flex-box title.
      Data: Identical spiral geometry and identical teal-green-to-blue Imprint sequential coloring as the light render — confirms data colors are unchanged between themes, only chrome (background, grid, ink) flipped.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no dark-on-dark issues.
