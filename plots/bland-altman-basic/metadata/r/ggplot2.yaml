review:
  strengths:
  - 'Correct Bland-Altman geometry: bias line, ±1.96 SD dashed limits, and value annotations
    all present and statistically correct'
  - 'Full Imprint palette compliance — first series is #009E73, semantic red (#AE3030)
    used for the limits-of-agreement boundary, correct #FAF8F1/#1A1A17 backgrounds,
    identical data colors across both themes'
  - Both light and dark renders are fully legible — no dark-on-dark or light-on-light
    failures, canvas is exactly 3200x1800
  - Direct on-chart text labels for bias/LoA replace a legend entirely, keeping the
    chart uncluttered and guiding the viewer straight to the relevant values
  - 'Clean, idiomatic ggplot2 code: single-purpose script, set.seed(42) for reproducibility,
    only imported packages are used (scales::alpha() cleverly works around ggplot2''s
    lack of a grid-line alpha channel), ragg::agg_png save path matches spec'
  - Realistic, neutral clinical dataset (two sphygmomanometers, n=90, plausible mmHg
    ranges) appropriate for the plot type
  weaknesses:
  - Design Excellence is solid but generic theme_minimal + manual overrides — no distinctive
    visual flourish beyond palette/annotation choices. Consider a subtle shaded band
    (geom_ribbon or annotate('rect', ...)) between the ±1.96 SD lines to visually
    reinforce the 95% agreement zone and raise DE-01/DE-02.
  - Library Mastery is generic — no ggplot2-distinctive feature is showcased. Consider
    ggrepel::geom_label_repel() for collision-avoiding annotation placement (guards
    against future data reshuffles moving labels onto points) to demonstrate a technique
    unique to the grammar-of-graphics ecosystem.
  - Annotation text (size=3.4, ~9.6pt) is noticeably smaller than the axis titles
    (10pt) — bump to ~4 so the bias/LoA callouts stay legible once the image is downscaled
    to a ~400px-wide catalog thumbnail.
  image_description: |-
