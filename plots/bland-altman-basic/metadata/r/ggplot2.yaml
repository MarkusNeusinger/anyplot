review:
  strengths:
  - 'Correct Bland-Altman construction: bias line, dashed ±1.96 SD limits-of-agreement
    lines, a shaded LoA band, and value annotations are all present and numerically
    consistent'
  - 'Smart semantic color use: the matte red (#AE3030) for the limits-of-agreement
    boundaries doubles as the Imprint palette''s semantic ''risk/boundary'' anchor,
    while blue (#4467A3) marks the central bias reference — creates clear visual hierarchy
    without extra chart junk'
  - 'Realistic, spec-matching data: paired systolic blood pressure readings from two
    sphygmomanometers on 90 subjects, mirroring the specification''s own example scenario,
    with a plausible bias and spread'
  - Moderate point transparency (alpha = 0.6) correctly reveals overlapping observations
    as explicitly required by the spec
  - Canvas is exactly 3200×1800 (landscape) in both renders; theme-adaptive chrome
    (background, grid, ink tokens) flips correctly between light and dark while data
    colors stay identical
  weaknesses:
  - The '-1.96 SD = -15.8' annotation overlaps a nearby data point in both light and
    dark renders (the marker sits directly against the final '6' character) — nudge
    the annotation's x position (e.g. increase the offset from annotation_x, or check
    for a data-point collision) or move it further outside the point cloud.
  - 'Annotation text for the bias and LoA labels reuses the same palette hex in dark
    mode as light mode, giving borderline-low contrast against the near-black #1A1A17
    background (blue #4467A3 ≈3.1:1, red #AE3030 ≈2.7:1 against plain background)
    — still legible but not optimal. Consider a lightened/desaturated variant of these
    colors specifically for dark-theme annotation text; the reference lines themselves
    should keep the identical data color across themes.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bland-altman-basic · r · ggplot2 · anyplot.ai" top-left, clearly readable. Axis titles "Mean of Device A and Device B (mmHg)" (x) and "Difference: Device A − Device B (mmHg)" (y) in dark ink, tick labels in a softer gray-ink, all legible. Subtle vertical/horizontal gridlines visible but unobtrusive. A thin neutral-gray solid line marks y=0.
      Data: 90 green (#009E73) points at alpha≈0.6, revealing overlapping observations as required. A solid blue (#4467A3) horizontal line marks the bias (-2.6 mmHg) with a matching blue text annotation. Two dashed red (#AE3030) horizontal lines mark +1.96 SD (10.5) and -1.96 SD (-15.8), each with a matching red text annotation, and a very light red-tinted ribbon fills the region between them (the limits-of-agreement band). First/primary data series is confirmed #009E73.
      Legibility verdict: PASS overall, with one localized issue — the "-1.96 SD = -15.8" annotation text touches/slightly overlaps a data point directly beneath its final digit (confirmed via pixel crop). All other text is cleanly separated from data and fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light ink, clearly readable against the dark surface. Tick labels in a lighter soft-gray, legible. Gridlines are faint but visible. The y=0 reference line remains visible as a light neutral line.
      Data: Data point color is identical to the light render (#009E73), confirming color consistency across themes. Bias line and its annotation remain blue (#4467A3); LoA lines and their annotations remain red (#AE3030) — same hex as light render, correctly following the "chrome flips, data colors stay fixed" rule. The LoA ribbon reads as a subtle warm maroon tint against the near-black background, visually distinguishing the "within limits" band from the region outside it — an effective, storytelling-relevant touch. No black-on-black or invisible text was found; however, the reused blue/red annotation-text colors sit at moderate-to-borderline contrast against the dark background (visually legible in the render, but numerically closer to the low end of readable contrast, especially the red).
      Legibility verdict: PASS — all text is readable, no dark-on-dark failures. Same annotation/data-point overlap present as in the light render (theme-independent, caused by the point's fixed data position relative to the fixed annotation position).
