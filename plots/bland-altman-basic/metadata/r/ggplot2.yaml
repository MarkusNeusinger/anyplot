      Data: 90 semi-transparent green (#009E73, alpha 0.6) points scattered around a solid blue (#4467A3) horizontal bias line labeled "Bias = -2.6 mmHg", flanked by two dashed matte-red (#AE3030) horizontal lines labeled "+1.96 SD = 10.5" and "-1.96 SD = -15.8", plus a thin neutral-gray reference line at y=0. First (and only) data series correctly uses #009E73.
