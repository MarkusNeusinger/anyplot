review:
  strengths:
  - 'Correct Bland-Altman construction: x = mean of the pair, y = New Device − Reference;
    solid mean-bias line plus dashed ±1.96 SD limits, each annotated in-plot with
    its numeric value, exactly per spec.'
  - 'Theme-adaptive chrome throughout: brand green (#009E73) data points stay identical
    between renders, reference lines correctly use the ink/inkSoft semantic-neutral
    tokens (appropriate for baseline/reference-line roles), and backgrounds are the
    correct #FAF8F1 / #1A1A17.'
  - 'Deterministic, realistic data: fixed-seed LCG generates a plausible clinical
    scenario (oscillometric device vs. reference cuff systolic BP, N=80) with a believable
    bias and spread.'
  - 'Distinctive, dependency-free Chart.js technique: a native afterDatasetsDraw plugin
    renders the bias/limit annotations directly on canvas instead of reaching for
    an unpinned annotation plugin.'
  - Moderate point transparency (alpha 0.55) with a page-background-matched marker
    border reveals overlapping observations as the spec explicitly requests.
  weaknesses:
  - Both x and y scales draw a full four-sided border/grid box around the plot area
    (confirmed by pixel-cropping all four edges) instead of the style guide's default
    L-shaped left+bottom frame — add `scales.x.border.display = false` and `scales.y.border.display
    = false` (or set border color to transparent) to remove the top/right edges and
    keep only the left/bottom spines.
  - The annotation label text (600 weight, 15px) sits slightly below the axis-title
    weight (16px) in the visual hierarchy — bumping it 1-2px would make the callouts
    read more clearly as the plot's primary narrative device.
  - Design polish is still fairly restrained overall (default legend spacing, no callout
    box behind the bias/limit annotation text) — optional but would raise Design Excellence
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bland-altman-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top, clearly legible. Legend below title (green swatch "Paired readings", black line "Mean bias", two dashed gray swatches "+1.96 SD limit" / "-1.96 SD limit") all readable. X-axis "Mean of Two Methods (mmHg)" and Y-axis "Difference: New Device − Reference (mmHg)" labels in dark ink, tick labels in a softer gray — all clearly legible. In-plot annotations "Bias 4.20 mmHg", "+1.96 SD 15.33 mmHg", "-1.96 SD -6.93 mmHg" render in dark/soft ink near their respective lines, fully readable and not overlapping data. Grid lines are thin and subtle. A full four-sided border box is visible around the plot area (grid/axis border touches all four edges since scale min/max coincide with the outermost gridlines) rather than a cleaner L-shaped left+bottom frame.
      Data: ~80 semi-transparent brand-green (#009E73) scatter points with a subtle background-matched border, scattered around a black horizontal bias line (~4.2) and two gray dashed limit lines (~15.3 and ~-6.9). Overlapping points near the center cluster are visibly distinguishable thanks to the alpha blending.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend, axis labels, tick labels, and in-plot annotations all flip to light ink (white/light-gray) and remain fully legible against the dark background — no dark-on-dark text anywhere. The mean-bias line renders white/near-white (flipped from black) and the dashed limit lines render light gray, both clearly visible. Same full box border artifact as the light render (present in both themes equally, a scale-config issue, not a theme bug).
      Data: Same ~80 green (#009E73) points, same positions, same bias/limit line positions and annotated values (4.20 / 15.33 / -6.93) as the light render — confirms data colors are unchanged, only chrome flipped.
      Legibility verdict: PASS
