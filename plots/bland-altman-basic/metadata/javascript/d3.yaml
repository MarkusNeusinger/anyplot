review:
  strengths:
  - 'Correct D3 idioms: data joins (selection.data().join()) drive both the circles
    and the direct-label annotations, satisfying AR-05'
  - 'All spec-required features present: solid bias line, dashed +-1.96 SD limits-of-agreement
    lines, direct numeric annotations for bias and both limits, and moderate marker
    transparency (fill-opacity 0.55) to reveal overlapping observations'
  - 'Clean theme adaptation: data color (#009E73) identical between light and dark
    renders, chrome (background, ticks, grid, title) correctly flips via ANYPLOT_TOKENS
    with no legibility failures in either theme'
  - 'Deterministic, realistic data: seeded LCG + Box-Muller normal generator produces
    plausible systolic blood-pressure values (100-160 mmHg) with a believable proportional
    bias plus noise between reference and test cuff'
  - Correct canvas (3200x1800 landscape, matches gate) and correctly formatted title
    'Blood Pressure Cuff Comparison · bland-altman-basic · javascript · d3 · anyplot.ai'
  - Direct labeling of bias/LoA values instead of a separate legend box is a good
    idiomatic choice for this plot type and keeps the chart uncluttered
  weaknesses:
  - 'DE-01: Generic styling beyond the mandated Imprint token color — no additional
    design touch (e.g. a subtle shaded band between the LoA lines, or highlighting
    points outside the limits of agreement) to distinguish the chart beyond spec-minimum
    requirements'
  - 'DE-02/DE-03: Visual hierarchy is limited to the required solid-vs-dashed reference
    lines; no extra emphasis (color or size) calls out the handful of points that
    fall outside the limits of agreement, which is where a Bland-Altman plot''s story
    usually lives'
  - 'LM-02: Relies on common d3 patterns (axisBottom/axisLeft tickSize gridline trick,
    d3-array mean/deviation/extent) without a more distinctive library-specific technique'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Dark navy/near-black title "Blood Pressure Cuff Comparison · bland-altman-basic · javascript · d3 · anyplot.ai" centered at top, comfortably readable. X-axis label "Mean of Two Methods (mmHg)" and Y-axis label "Difference: Reference − Test Cuff (mmHg)" both dark and legible. Tick labels on both axes dark gray, legible. Subtle light-gray gridlines on both axes, visible but not dominant. Solid black bias line labeled "Bias: -2.9 mmHg" and two dashed black limit-of-agreement lines labeled "+1.96 SD: 7.9" and "-1.96 SD: -13.8", all readable against the light background.
      Data: ~100 semi-transparent teal-green (#009E73) circles scattered between x=85-158 (mean mmHg) and y=-15 to +13 (difference), with visible darker overlap where points stack (opacity 0.55 working as intended).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Off-white/cream title, light-gray axis labels and tick labels, all clearly readable against the dark background — no dark-on-dark failures observed. Gridlines are subtle dark-gray, still visible. Solid and dashed reference lines are off-white and their labels are legible.
      Data: Same teal-green (#009E73) circles at identical positions and opacity as the light render — confirms only chrome flipped, not data color.
      Legibility verdict: PASS
