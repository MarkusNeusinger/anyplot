review:
  strengths:
  - 'Correct Bland-Altman construction: x = mean(A,B), y = A−B, with all three required
    reference lines (solid bias, dashed ±1.96 SD)'
  - Bias and limits-of-agreement values are numerically annotated on the plot via
    plotLines labels in the reserved right margin, never overlapping data
  - Theme-adaptive chrome is threaded correctly through every element (title, axis
    titles, ticks, gridlines, plotLine colors) — both renders are fully readable with
    no dark-on-dark or light-on-light failures
  - Marker styling (fillOpacity 0.55, pageBg-colored stroke) gives moderate transparency
    to reveal overlapping points as the spec requests, while the stroke color adapts
    per theme instead of a hardcoded white edge
  - Deterministic in-memory LCG data generation, single flat script with no unnecessary
    abstraction
  - 'Correct mount-node contract: animation disabled on chart and series, credits
    disabled, transparent chart background, no explicit width/height'
  weaknesses:
  - Simulated device disagreement is fairly wide for a two-sphygmomanometer comparison
    (SD ≈ 5.6, LoA ≈ [-12.2, 9.9], one outlier near 18 mmHg) — real inter-device BP
    agreement studies usually show tighter limits; narrowing the noise scale would
    read as more clinically realistic
  - 'Design Excellence is competent but generic: aside from the plotLine annotations,
    styling is close to a standard Highcharts scatter with grid on both axes — a bit
    more visual hierarchy (e.g. shading the acceptable LoA band, or muting the LoA
    line labels relative to the bias label more strongly) would lift the storytelling
    further'
  - Library Mastery is limited to scatter + plotLines; no distinctive Highcharts-only
    feature (e.g. custom tooltip formatting for the paired values) is used to set
    the render apart in the interactive HTML view
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light surface.
      Chrome: Title "bland-altman-basic · javascript · highcharts · anyplot.ai" is bold dark ink, clearly legible. X-axis title "Mean of Two Devices (mmHg)" and y-axis title "Difference: Device A − Device B (mmHg)" are in a soft dark gray, readable. Tick labels on both axes are legible dark gray against the cream background. Gridlines are thin and subtle on both axes (appropriate for a scatter plot). A solid dark horizontal line marks "Bias: -1.2" and two dashed gray lines mark "+1.96 SD: 9.9" and "−1.96 SD: -12.2", each with a label placed in the reserved right margin — none of the labels overlap data points or each other.
      Data: ~90 green (#009E73) scatter points with moderate fill transparency (opacity ~0.55) and a light stroke, so overlapping points remain distinguishable. Points scatter fairly evenly across the x-range (~95–185 mmHg) with most differences between the two dashed limit lines and a couple of visible outliers (~18 and ~-16).
      Legibility verdict: PASS — all title, axis, tick, and annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark surface.
      Chrome: Title and axis titles render in light/off-white ink, tick labels in a lighter gray — all clearly legible against the dark background. Gridlines are faint light-toned lines, still visible but subtle. The bias plotLine is now a white/light solid line with a light-colored "Bias: -1.2" label; the two LoA dashed lines and their labels use a lighter gray, all legible with no dark-on-dark failures anywhere (title, axis titles, ticks, and plotLine labels all flipped correctly to light ink).
      Data: Same ~90 points in identical brand green (#009E73), same positions and same transparency as the light render — confirms data colors are theme-independent as required.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements; every text element and the bias/LoA labels are clearly visible against the near-black surface.
