review:
  strengths:
  - 'Outlier accent treatment directly fixes attempt 1''s top weakness: the 4 points
    outside the ±1.96 SD limits get a distinct matte-red (#AE3030, the correct Imprint
    semantic anchor for bad/error) color, larger radius (11 vs 7), and higher alpha
    (0.85 vs 0.6), with legend labels so the distinction isn''t hue-only'
  - 'Explicit marker stroke (stroke: t.pageBg, strokeWidth: 1) gives every point clean
    definition against overlapping neighbors'
  - Reference-line label font sizes are now consistent (bias 14/bold, both limit labels
    14), fixing attempt 1's 13-vs-14 mismatch
  - Grid explicitly styled via sx (t.grid stroke) rather than relying purely on library
    defaults
  - 'Pixel-verified: data colors are byte-identical between light/dark renders (only
    alpha-blended against theme-correct backgrounds), backgrounds are exact #FAF8F1/#1A1A17,
    and no element clips at any canvas edge'
  - Correct data mapping (x = mean, y = diff), realistic heteroscedastic measurement-error
    data, and moderate transparency per spec all carried over cleanly from attempt
    1
  weaknesses:
  - Title still fills only ~38% of canvas width - larger than attempt 1's ~30% but
    still under the ~50-70% general guidance; not a scored deduction (no overflow/clipping/squeeze)
    but there is headroom to grow the title fontSize for stronger hierarchy
  - LM-02 remains capped by using only one clearly MUI X-distinctive capability (ChartsReferenceLine);
    a second distinctive feature would strengthen library mastery
  - DE-02 grid is correctly both-axes per the scatter-plot grid guideline but still
    reads as a fairly conventional layout - further whitespace/typographic hierarchy
    tuning could push this higher
  image_description: |-
