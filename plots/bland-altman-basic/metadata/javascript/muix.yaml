review:
  strengths:
  - Native ChartsReferenceLine draws the bias (solid, ink, 2.5 px) and both limits
    of agreement (dashed, inkSoft, 1.75 px) at their computed values; the weight contrast
    puts the bias first and the limits second.
  - Limit labels are drawn in the right margin with the useYScale/useDrawingArea hooks,
    so each name and value sits exactly at its line's y and can be told apart from
    the others (+1.96 SD 15.9 mmHg, Bias 3.8 mmHg, −1.96 SD −8.4 mmHg).
  - 'Realistic medical-device scenario: 70 oscillometric-cuff vs mercury-reference
    systolic readings, a +3.8 mmHg bias, scatter that widens with pressure and a few
    points outside the limits, all computed from the data (sample SD, n−1).'
  - 'Points use fillOpacity 0.6 with a page-colored outline, so overlaps read darker
    and the marks keep the brand green #009E73 in both themes.'
  - Axis titles and units come from the column constants. The subtitle reports n and
    the SD of the differences. Native scatter tooltips stay available in the HTML.
  weaknesses:
  - 'Suggestion: a horizontal-only grid (or a coarser y step) would quiet the background;
    the 2 mmHg y grid together with the vertical grid is dense next to the reference
    lines.'
  - 'Suggestion: the optional zero-difference line would make the +3.8 mmHg offset
    from perfect agreement readable without counting gridlines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold dark title "bland-altman-basic · javascript · muix · anyplot.ai" centered at top (~32% width), grey subtitle "n = 70 paired readings · SD of the differences 6.2 mmHg"; x-axis title "Mean of Oscillometric cuff and Mercury reference (mmHg)", ticks 75–155 step 5; y-axis title "Oscillometric cuff − Mercury reference (mmHg)", ticks −14 to 20 step 2; subtle grey grid in both directions; all text dark and readable.
      Data: 70 brand-green (#009E73) semi-transparent dots with light outlines; solid near-black bias line at 3.8, dashed grey limit lines at 15.9 and −8.4; right-margin labels "+1.96 SD / 15.9 mmHg", bold "Bias / 3.8 mmHg", "−1.96 SD / −8.4 mmHg" aligned to their lines. A few points lie outside the limits (two above, two below).
