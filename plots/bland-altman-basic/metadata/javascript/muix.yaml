review:
  strengths:
  - Both the bias line and ±1.96 SD limits of agreement are drawn AND numerically
    annotated directly on the chart, fully satisfying the spec's annotation requirement
  - 'Correct data mapping: x = mean(cuff, reference), y = diff(cuff − reference)'
  - Data realistically models proportional/heteroscedastic measurement error (funnel-shaped
    spread widening with pressure) — a genuinely Bland-Altman-appropriate feature,
    not just generic noise
  - Alpha blending (0.6) on markers appropriately reveals overlapping observations,
    matching the spec's explicit 'moderate transparency' requirement
  - 'Theme-adaptive: background, grid, and all text correctly flip between light/dark
    while the brand green data color stays identical (#009E73) in both'
  - Legend correctly hidden for the single-series scatter, matching the decoration-removal
    guidance
  - Clean, deterministic, single-purpose code with an explicit seeded LCG — no external
    randomness, no unused imports
  weaknesses:
  - 'Design Excellence reads as a well-configured library default: single flat-alpha
    green fill, no marker stroke/outline, no accent treatment for the two clear outlier
    points sitting near +18 and -12.4 mmHg that fall outside the limits of agreement'
  - Grid and axis chrome rely on MUI X defaults (grid={{horizontal:true, vertical:true}})
    with no explicit opacity/style tuning beyond the style guide's subtle-grid guidance
    — visual refinement is minimal
  - ±1.96 SD reference-line labels are set to fontSize 13, noticeably smaller than
    the bias label (14) and tick labels (14) — bump to ~14-15 for consistency across
    annotation text
  - Title occupies only ~30% of canvas width (below the ~50-70% target for a title
    of this length) — consider a slightly larger title fontSize for better visual
    hierarchy as the first element readers see
  - 'LM-02 usage is solid but not maximally distinctive: ChartsReferenceLine is used
    well, but no other MUI X-specific capability (e.g. custom marker shapes, axis
    zoom, highlightScope) is exercised'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "bland-altman-basic · javascript · muix · anyplot.ai" in dark ink, centered top. X-axis "Mean of Cuff & Reference (mmHg)" and Y-axis "Difference: Cuff − Reference (mmHg)" both dark and clearly readable. Tick labels on both axes legible. Grid lines (horizontal + vertical) are subtle light gray, visible but not competing with data. Solid black bias line labeled "Bias: 3.8 mmHg" and two dashed gray limit lines labeled "+1.96 SD: 15.9" / "−1.96 SD: -8.4", all right-aligned near the plot's right edge with clear margin (no clipping).
      Data: ~70 green (#009E73) circular markers at alpha ~0.6, revealing overlap in dense clusters (e.g. around mean=120-122, mean=146-148). Funnel-shaped spread is visible — tighter near mean=76-100, wider near mean=130-150, consistent with the proportional-error data generation.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light/white text, all clearly legible against the dark background. Grid lines are subtle light-gray at low opacity, visible without dominating. Bias line is now solid white/light with the same "Bias: 3.8 mmHg" label; limit lines are dashed light gray with matching labels.
      Data: Same ~70 green markers at the same #009E73 hue and alpha — confirmed identical to the light render; only chrome flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/annotation text is clearly visible against the dark surface, and the brand green remains fully legible on the dark background.
