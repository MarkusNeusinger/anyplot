review:
  strengths:
  - 'Correct Bland-Altman construction: mean-vs-difference scatter, a solid bias line,
    and dashed ±1.96 SD limits of agreement, all annotated with computed values directly
    on the chart.'
  - Deterministic seeded PRNG (mulberry32, seed=42) produces reproducible synthetic
    paired systolic-BP data with a realistic bias and spread.
  - Theme-adaptive chrome is correctly threaded through every element (title, axis
    names, tick labels, grid, markLine colors and labels) — both light and dark renders
    are fully readable with no dark-on-dark or light-on-light failures.
  - 'The sole data series correctly uses Imprint brand green #009E73, identical across
    both themes; moderate point opacity (0.6) reveals overlapping observations as
    the spec requests.'
  - All font sizes are explicitly set per the echarts style guide; no clipping, no
    text overlap, canvas is exactly 3200×1800.
  weaknesses:
  - Full four-sided box border (top and right grid edges are visible, forming a closed
    rectangle) frames the plot — the style-guide default for scatter plots is an L-shaped
    frame (left+bottom only). Remove the top/right axis lines (or the grid's implicit
    box edges) for a cleaner, more refined look.
  - 'Styling is functionally correct but generic: a single green scatter with black/gray
    reference lines. Consider a markArea shading the ±1.96 SD band (limits-of-agreement
    zone) to add visual hierarchy and make the ''in-range vs out-of-range'' story
    more immediate — this would also raise Data Storytelling.'
  - markLine with formatter labels is correct usage but only mildly distinctive to
    ECharts. A markArea band for the LoA zone, or piecewise coloring of out-of-range
    points, would better showcase ECharts-specific strengths versus a generic scatter+line
    replicated easily in other libraries.
  - 'Minor: with n=100 points and visible local clustering (e.g. near mean≈100-115
    mmHg), slightly larger markers or a thin light stroke on each point could better
    separate overlapping observations.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "bland-altman-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. X-axis name "Mean of Two Methods (mmHg)" and Y-axis name "Difference: Device − Reference (mmHg)" in dark ink; tick labels in softer gray-ink. A solid dark "Bias -2.5" line and two dashed gray "+1.96 SD 4.2" / "−1.96 SD -9.2" lines cross the plot with right-aligned text labels, all fully inside the canvas (verified via right-edge crop — no clipping). Grid lines are thin and subtle on both axes. The plot area is enclosed by a full thin rectangular border (all four sides), not the L-shaped left+bottom-only default.
      Data: ~100 scatter points in Imprint brand green (#009E73) at ~0.6 opacity, revealing overlap where points cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis names, and tick labels now rendered in light ink/off-white, clearly readable against the dark surface. Bias/LoA lines and their labels are rendered in white, no dark-on-dark text anywhere. Grid lines are faint light gray.
      Data: Scatter points are the identical green (#009E73) as the light render — confirmed by direct comparison, only the chrome (background, text, grid, box border) flipped.
      Legibility verdict: PASS
