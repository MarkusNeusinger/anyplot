review:
  strengths:
  - Correct Bland-Altman statistics — bias and ±1.96 SD limits of agreement computed
    via Statistics.mean/std and rendered as a solid bias line plus dashed LOA lines
    using idiomatic hlines!
  - Both renders are pixel-consistent for data color and correctly flip chrome (background,
    text, grid, spines) between light and dark themes with no dark-on-dark or light-on-light
    failures
  - On-plot value annotations (Bias, +1.96 SD, -1.96 SD) use distinct align/offset
    per line to stay clear of the axis frame and of each other — verified no text/marker
    overlap at native resolution
  - Moderate point transparency (alpha=0.65) satisfies the spec's 'reveal overlapping
    observations' requirement without obscuring the scatter
  - Realistic, neutral domain data (new automated BP cuff vs. mercury reference across
    90 subjects) at an appropriate mmHg scale
  - No AR-08 (fake interactivity) or AR-09 (edge clipping) issues found in either
    render; canvas is the correct 3200x1800
  weaknesses:
  - X-axis (~105-190 mmHg) and Y-axis (~-8 to 20 mmHg) each show only 3 major gridlines/tick
    labels from Makie's auto-tick algorithm, making it hard to read intermediate values
    precisely — pass explicit xticks/yticks to Axis(...) for denser labeling.
  - Bias and limits-of-agreement reference lines use IMPRINT_PALETTE[5] (matte red,
    the semantic anchor reserved for bad/loss/error) rather than the theme-adaptive
    'neutral' anchor the style guide recommends for the reference-line role — reconsider
    unless the red-for-'outside-acceptable-range' framing is intentional.
  - Design is competent and statistically correct but conventional for this plot type
    — no additional distinctive Makie feature (e.g. a shaded band!/poly! for the LOA
    region, or a marginal density strip for the difference distribution) that would
    elevate it beyond a solid baseline execution.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bland-altman-basic · julia · makie · anyplot.ai" centered at top; dark-ink x-axis label "Mean of Two Devices (mmHg)" and y-axis label "Difference: New − Reference (mmHg)"; softer-ink tick labels (0/10/20 on y, 125/150/175 on x); only left+bottom spines visible (top/right removed); faint horizontal/vertical gridlines at ~15% opacity. All chrome clearly legible against the light background.
      Data: 90 semi-transparent brand-green (#009E73) scatter points (mean vs. difference), a solid matte-red bias line labeled "Bias = 4.1", and two dashed matte-red limit-of-agreement lines labeled "+1.96 SD = 14.0" and "−1.96 SD = -5.7". Annotation text sits directly above/below its line, right-aligned near the rightmost data point, with no glyph/marker overlap on close inspection.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/axis-label/tick-label layout, now rendered in light ink (#F0EFE8 primary, #B8B7B0 secondary) against the dark surface; spines and gridlines flipped to the light-toned equivalents. All text is clearly visible with no dark-on-dark failures.
      Data: Same 90 scatter points in the identical brand green, same bias/LOA line positions and matte-red color, same annotation text and placement — confirmed pixel-for-pixel consistent with the light render's data layer; only chrome changed.
      Legibility verdict: PASS.
