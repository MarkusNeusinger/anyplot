review:
  strengths:
  - 'Correct Bland-Altman construction: x = mean of the pair, y = method1 - method2,
    solid mean-difference line, dashed ±1.96 SD limit lines, and all three values
    annotated on the plot -- every required feature from the spec is present.'
  - 'Excellent semantic use of the Imprint palette: brand green (#009E73) for in-range
    pairs and the matte-red semantic anchor (#AE3030) for pairs outside the limits
    of agreement -- a textbook ''bad/error -> red'' semantic exception per the style
    guide that doubles as a data-storytelling device (outliers pop immediately).'
  - 'Theme-adaptive chrome correctly threaded through both renders: light background
    is warm off-white, dark background is warm near-black, all text is readable in
    both, and the data colors are identical across themes.'
  - Moderate point transparency (alpha=0.6) matches the spec's explicit request to
    'reveal overlapping observations'.
  - Clean, idiomatic ggplot-style layer composition (aes-driven color mapping, scale_color_manual,
    layered geom_hline/geom_text), reproducible (seeded), no extraneous imports, correct
    plot-{THEME}.png output via ggsave.
  - 'Realistic, neutral data: two blood-pressure measurement methods centered around
    a physiologically plausible ~130 mmHg mean with a small consistent bias (-2.18)
    -- good real-world grounding.'
  weaknesses:
  - 'Design Excellence reads as a well-configured default rather than distinctly polished:
    no custom font family, no white/pale edge stroke on markers, no additional spacing
    refinement beyond the base theme -- add edgecolors=''white'' (or the theme-adaptive
    elevated-bg tone) on geom_point for extra definition on the semi-transparent overlapping
    points, per the style guide''s ''Data Element Styling'' section.'
  - Data storytelling stops at color-coding the outliers -- consider a small callout
    summarizing the count/percentage of pairs outside the limits of agreement (e.g.
    '4/100 outside limits') to push the insight further.
  - The composition (scatter + hlines + text annotations) is fairly generic and could
    be replicated in almost any grammar-of-graphics library -- consider leveraging
    a more plotnine-distinctive touch (e.g. a subtitle via labs(), or facet-ready
    structure) to raise Library Mastery.
  - Marker size (2.5) and alpha (0.6) are legible but slightly conservative for a
    100-point medium-density scatter -- sizing up marginally (e.g. 3.0) with a subtle
    edge stroke would add polish without hurting overlap-revealing transparency.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "bland-altman-basic · python · plotnine · anyplot.ai" in dark ink, centered, ~65-70% of plot width, fully visible with no clipping. Axis titles "Mean of Two Methods (mmHg)" and "Difference (Method 1 - Method 2, mmHg)" in dark ink, both readable. Tick labels in soft grey, readable. Legend box top-right with "Outside limits of agreement" (red swatch) and "Within limits of agreement" (green swatch), fully legible with a visible border matching the elevated background token. Solid grey mean line labeled "Mean: -2.18" and two dashed grey limit lines labeled "+1.96 SD: 12.78" / "-1.96 SD: -17.13", all annotation text legible and not overlapping any markers.
      Data: ~96 green points (#009E73, brand green) and 4 red points (#AE3030, matte-red semantic anchor) at alpha 0.6, revealing overlap where points cluster. Red points sit correctly outside the dashed limit lines (both above and below), confirming the semantic color mapping is data-driven and correct.
      Legibility verdict: PASS -- no light-on-light or unreadable text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light tones (white/light-grey) and remain fully readable against the dark background. Grid lines are faint and subtle. Legend box border and text are light-colored and legible, with the same elevated dark-grey fill token distinguishing it from the page background. Mean-line and limit-line annotations are legible in light grey, matching the theme-adaptive ink-soft token.
      Data: Same green/red point colors and positions as the light render -- confirmed identical (#009E73 / #AE3030), only the chrome (background, text, grid, legend frame) changed between themes.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all text and data remain clearly distinguishable from the near-black surface.
