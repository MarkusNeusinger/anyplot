review:
  strengths:
  - 'Implements every required Bland-Altman feature: solid mean-bias line, dashed
    ±1.96 SD limits of agreement, and annotated SD/bias values.'
  - Thoughtful semantic coloring — points outside the limits of agreement are flagged
    in red (Imprint AE3030) against the brand-green in-range points, creating a clear
    analytical focal point.
  - Moderate-transparency markers (opacity 0.7) reveal overlapping observations as
    required by the spec.
  - Elevated-surface annotation boxes give the SD/bias callouts strong contrast and
    legibility in both themes.
  - Correct canvas discipline — follows the altair pad-not-crop pattern, PNG lands
    exactly on the 3200x1800 target with no clipping.
  - Clean, idiomatic layered altair composition (mark_point + mark_rule + mark_rect
    + mark_text), seeded/reproducible data, no unused imports.
  - Both themes correctly implemented — data colors identical between light/dark,
    chrome flips correctly, no dark-on-dark or light-on-light failures.
  weaknesses:
  - Outlier vs. in-range distinction relies primarily on red-vs-green color, a difficult
    pairing for red-green colorblind viewers; position relative to the dashed LOA
    lines is a redundant cue but a shape/stroke difference on outlier points would
    make this fully CVD-safe.
  - Annotation and tick text (fontSize 10-11) may read small when the plot is scaled
    down to a ~400px mobile thumbnail — a modest bump for the annotation labels would
    help.
  - No legend or inline note clarifies what the red points mean for viewers unfamiliar
    with Bland-Altman conventions — a small caption ('red = outside limits of agreement')
    would make the encoding self-explanatory.
  - Library mastery is solid but conventional — layering and conditional color are
    used well, but nothing showcases a more distinctive altair capability (e.g. interactive
    selection binding) beyond what this complexity level requires.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with the #FAF8F1 page background token — not pure white, not dark.
      Chrome: Title "bland-altman-basic · python · altair · anyplot.ai" is bold dark text, centered, comfortably sized (~50% plot width). X-axis label "Mean of Two Methods (mmHg)" and Y-axis label "Difference: Method 1 − Method 2 (mmHg)" are dark, legible, and proportionally balanced. Tick labels are dark gray, subtle gridlines are faint but visible.
      Data: ~80 semi-transparent circular markers, brand green (#009E73) for in-range observations, a handful in red (#AE3030) for the 4 points falling outside the limits of agreement. A solid green horizontal line marks the mean bias (-2.44); two dashed magenta/purple (#C475FD) horizontal lines mark the +1.96 SD (6.55) and -1.96 SD (-11.44) limits. Three annotation boxes with a light elevated-surface fill and dark bordered text state the SD/bias values, placed clear of the data cloud on the right side of the plot.
      Legibility verdict: PASS — all title, axis, tick, and annotation text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with the #1A1A17 page background token — not pure black, not light.
      Chrome: Same title and axis labels rendered in light/off-white text, clearly visible against the dark background. Gridlines are faint dark-gray, still perceptible. Annotation boxes switch to a dark elevated-surface fill with light text and a soft border, maintaining contrast.
      Data: Same green (#009E73) and red (#AE3030) marker colors as the light render — confirmed identical, only the chrome (background, text, grid, annotation box fill) flips theme. Mean-bias line and dashed LOA lines are unchanged and remain clearly visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/annotation text is light-colored and reads cleanly against the near-black surface. Brand green remains visible on the dark surface.
