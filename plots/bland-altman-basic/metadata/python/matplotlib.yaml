review:
  strengths:
  - 'Correct Bland-Altman construction: X = mean of paired methods, Y = method1 -
    method2, matching the spec exactly'
  - 'All required features present: solid bias line, dashed +-1.96 SD limits of agreement,
    direct value annotations, and moderate transparency (alpha=0.6) that reveals overlapping
    points'
  - 'Full Imprint palette compliance: brand green #009E73 for the primary series,
    canonical position-2 lavender #C475FD for the limits-of-agreement lines, correct
    theme-adaptive chrome (background/text/grid/legend) in both light and dark renders
    with no dark-on-dark or light-on-light failures'
  - 'Clean, reproducible KISS code: np.random.seed(42), only used imports, no fake
    functionality, correct plot-{THEME}.png output'
  - Realistic, neutral medical device-comparison scenario (two sphygmomanometers)
    with physiologically plausible blood pressure values and bias magnitude
  weaknesses:
  - 'Redundant value display: the top-left legend (Mean/+1.96 SD/-1.96 SD) and the
    right-side text annotations (Bias/+1.96 SD/-1.96 SD) show the exact same three
    numbers twice — pick one presentation (recommend keeping the right-side line annotations
    and dropping the legend box entirely) for a cleaner, less cluttered layout'
  - 'Marker sizing is at the low end for n=80 points: s=100, alpha=0.6 versus the
    guideline''s s=100-200/alpha=0.7-0.9 for 30-100 points — nudge size up slightly
    (e.g. s=120-140) while keeping alpha around 0.6-0.7 to preserve overlap visibility'
  - Library usage is fairly generic (scatter + axhline + text) and could be replicated
    near-identically in most other plotting libraries — consider a matplotlib-distinctive
    touch, e.g. ax.annotate() with arrow connectors for the LOA labels, or a blended
    transform (transforms.blended_transform_factory) to anchor the right-side annotations
    to the axes fraction in y so they stay aligned regardless of data range, instead
    of computing x_max from get_xlim()
  - Simulated data uses only a constant bias plus homoscedastic random noise; real
    Bland-Altman analyses often reveal proportional/heteroscedastic bias (variance
    widening as the mean increases) — adding a touch of that would better showcase
    the feature the plot type is specifically designed to expose
