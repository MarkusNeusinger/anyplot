review:
  strengths:
  - Marginal histogram panel (make_subplots, shared_yaxes) visualizes the shape of
    the difference distribution, giving visual evidence for the normality assumption
    behind the ±1.96 SD limits — a thoughtful addition beyond the base spec.
  - Shaded band (add_hrect) between the limits of agreement gives an immediate at-a-glance
    read of the acceptable range before the viewer even parses the dashed lines.
  - Self-contained stats callout box (bias, +1.96 SD, -1.96 SD, % within limits) satisfies
    the spec's 'annotate the mean and limits of agreement values' requirement cleanly
    in one element.
  - 'Theme-adaptive chrome is fully correct and verified identical data colors (#009E73
    observations/bias, #C475FD limits) on both plot-light.png and plot-dark.png, with
    theme-correct backgrounds and text.'
  - Moderate marker opacity (0.65) correctly reveals overlapping observations per
    the spec's explicit instruction.
  - Realistic, well-scaled medical-device-validation dataset (handheld glucose meter
    vs lab reference) with plausible bias (-3.2 mg/dL) and noise magnitude.
  weaknesses:
  - 'The ''Mean'', ''+1.96 SD'', and ''-1.96 SD'' line-annotation labels (added via
    add_hline(..., annotation_position="right", row=1, col=1)) sit exactly on the
    boundary between the main scatter panel and the marginal histogram subplot. Their
    opaque label boxes bleed into column 2 and visibly cover a slice of the histogram
    bars in BOTH light and dark renders, hiding real bin-count data behind chrome.
    Fix: move these annotations off the column boundary — e.g. annotation_position="left"
    or a manual x/xanchor placed well inside the row=1,col=1 domain — or increase
    horizontal_spacing / shrink column_widths so there is a visible gap between the
    panels before the label boxes are placed.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "bland-altman-basic · python · plotly · anyplot.ai" in dark ink, centered, fully visible and not clipped. X-axis "Mean Glucose (mg/dL)" and Y-axis "Difference (Lab − Handheld) (mg/dL)" labels are dark, descriptive, and carry units. Tick labels are a softer dark gray. Grid lines are thin and subtle. A stats callout box (bias, +1.96 SD, -1.96 SD, % within limits) sits top-left on a cream elevated background with dark text, fully readable. "Mean"/"+1.96 SD"/"-1.96 SD" line-end label boxes are readable but their boxes visibly bleed into the marginal histogram panel, covering part of the histogram bars underneath.
      Data: 95 green (#009E73) markers with a thin cream edge stroke, moderate opacity revealing overlaps as required by spec. Solid green mean-difference line at +4.29. Two purple (#C475FD) dashed lines at the ±1.96 SD limits, with a faint purple-tinted shaded band between them. Right panel: a green horizontal histogram of the differences, showing an approximately unimodal, right-of-center distribution centered near the mean line.
      Legibility verdict: PASS (all text readable; the only issue is the annotation-box/histogram overlap noted above, which is a VQ-02 data-overlap concern, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, axis titles, and tick labels are all rendered in light ink (near-white/light-gray) and are clearly legible against the dark background — no dark-on-dark failures found anywhere (title, axes, stats box, or line-end labels). The stats callout box and the "Mean"/"±1.96 SD" label boxes use the dark elevated background (#242420) with light text and colored borders, fully readable.
      Data: Same #009E73 green markers/mean line and #C475FD purple dashed limit lines as the light render — colors confirmed identical across themes; only chrome (background, text, grid) flips. The marginal histogram is the same green, same shape.
      Legibility verdict: PASS. Same overlap issue as the light render: the "Mean"/"+1.96 SD"/"-1.96 SD" label boxes bleed into the histogram panel and cover part of the bars — this is a data-overlap issue reproduced identically in both themes, not a legibility/contrast failure.
