      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "bland-altman-basic · python · plotly · anyplot.ai" in dark ink, centered, fully visible and not clipped. X-axis "Mean Glucose (mg/dL)" and Y-axis "Difference (Lab − Handheld) (mg/dL)" labels are dark, descriptive, and carry units. Tick labels are a softer dark gray. Grid lines are thin and subtle. A stats callout box (bias, +1.96 SD, -1.96 SD, % within limits) sits top-left on a cream elevated background with dark text, fully readable. The "Mean"/"+1.96 SD"/"-1.96 SD" line-end label boxes are now positioned well inside the scatter panel (x domain=0.95), with a clear visible gap before the marginal histogram column starts — the previous overlap/bleed issue is resolved; histogram bars are fully visible and unobstructed.
      Data: 95 green (#009E73) markers with a thin cream edge stroke, moderate opacity revealing overlaps as required by spec. Solid green mean-difference line at +4.29. Two purple (#C475FD) dashed lines at the ±1.96 SD limits, with a faint purple-tinted shaded band between them. Right panel: a green horizontal histogram of the differences, showing an approximately unimodal, right-of-center distribution centered near the mean line.
      Legibility verdict: PASS — all text readable, no overlap with the histogram panel, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
