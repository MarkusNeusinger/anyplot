review:
  strengths:
  - 'Correct Bland-Altman construction: x = mean of the two methods, y = method1 -
    method2, computed directly from the paired data with np.std(ddof=1) for the sample
    SD'
  - 'Full required feature set present: solid mean-bias line, dashed ±1.96 SD limits-of-agreement
    lines, and on-plot numeric annotations for all three reference values'
  - 'Thoughtful extra: a shaded band between the LOA lines highlights the agreement
    zone, and annotation label colors match their corresponding reference line (bias
    in brand green, LOA in secondary purple) for quick visual association'
  - 'Imprint palette used correctly — brand green #009E73 for the primary series/bias
    line, secondary #C475FD for the LOA lines and band — identical across light and
    dark renders'
  - 'Theme-adaptive chrome correctly threaded through plot/panel background, grid,
    axis text, and label fills; both PAGE_BG values (#FAF8F1 / #1A1A17) verified by
    pixel sampling'
  - Moderate point transparency (alpha=0.7) as the spec explicitly requests, revealing
    overlap in the point cloud
  - Interactive hover tooltips (layer_tooltips) exposing method1/method2/mean/diff
    per point add real value in the HTML detail view without harming the static PNG
  - 'Clean, reproducible, single-pass script: fixed seed, only used imports, no functions/classes,
    correct plot-{theme}.png/.html outputs'
  - Realistic, neutral synthetic data (paired blood-pressure readings, n=80) with
    a plausible bias/error structure
  weaknesses:
  - Title is 'bland-altman-basic · letsplot · anyplot.ai' — missing the mandated language
    segment. Required format is {spec-id} · {language} · {library} · anyplot.ai, i.e.
    it should read 'bland-altman-basic · python · letsplot · anyplot.ai'.
  - The 'Mean bias' annotation label is anchored at x = df['mean'].max() (the rightmost
    data point's own x-value) with hjust=1, so it lands directly beside/over whichever
    point happens to have the largest mean — in this render that point sits almost
    exactly on the bias line and is partially hidden behind the label box. Anchor
    annotations to a fixed x with headroom beyond the data range (e.g. axis max +
    extra padding, or place outside the panel) instead of the data max so the label
    never competes with whichever point happens to be rightmost.
  - panel_grid_major uses the full-opacity INK token (just at size=0.3) rather than
    the style guide's recommended low-alpha grid (~10-15%, e.g. rgba(26,26,23,0.15));
    the thin width keeps it from being disruptive but it reads darker/more present
    than the 'subtle, never competes with data' guideline calls for.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled pixel (250,248,241) ≈ #FAF8F1. Correct light surface, not pure white.
      Chrome: Title "bland-altman-basic · letsplot · anyplot.ai" in dark ink, fully visible, not clipped. Axis titles "Mean of Two Methods (mmHg)" and "Difference (Method 1 - Method 2) (mmHg)" in dark ink, both readable. Tick labels in a softer dark gray, readable. Major gridlines (both axes, as expected for a scatter plot) are thin dark lines — visible but not dominant. A pale pink/lavender band shades the region between the two dashed limits-of-agreement lines, confirmed by pixel sampling to be vertically bounded (plain background above +1.96 SD and below -1.96 SD, tinted only between them).
      Data: 80 green (#009E73) points with visible transparency (alpha≈0.7), clearly distinguishable from the background. A solid green "Mean bias: -2.55 mmHg" line and two dashed purple (#C475FD) "+1.96 SD: 7.84 mmHg" / "-1.96 SD: -12.93 mmHg" lines, each with a matching-colored label box (cream fill, colored border) placed at the right edge of the data range. One data point (the rightmost, near the mean line) sits close to/behind the "Mean bias" label box — a minor overlap, not severe.
      Legibility verdict: PASS (one minor label/point overlap noted above, does not block reading any text)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17. Correct dark surface, not pure black.
      Chrome: Title and axis titles render in light ink (near-white), clearly legible against the dark background — no dark-on-dark failure. Tick labels are a lighter gray, readable. Gridlines are thin light lines on dark, subtle and visible. The band between the LOA lines uses a darker purple-tinted panel color, still distinguishable from the plain dark background above/below the LOA lines.
      Data: Same green (#009E73) points and purple (#C475FD) reference lines as the light render — colors confirmed identical, only chrome (background/grid/text) flipped. Label boxes use the dark ELEVATED_BG fill with colored borders, text still legible. Same minor point/label overlap near the rightmost data point as in the light render.
      Legibility verdict: PASS (no dark-on-dark issues; same minor overlap noted above)
