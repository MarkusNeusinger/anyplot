review:
  strengths:
  - Shaded BoxAnnotation gives the limits-of-agreement zone a visual footprint without
    competing with the data, a nice design touch beyond bokeh defaults
  - Mean-bias and LOA annotation labels are color-matched to their corresponding reference
    lines (green bias text/line, lavender LOA text/lines), reinforcing the visual
    hierarchy
  - 'Correct Imprint palette usage (brand green #009E73 for data, lavender for LOA
    lines) and fully theme-adaptive chrome verified identical data colors and correct
    backgrounds/text in both light (#FAF8F1) and dark (#1A1A17) renders'
  - 'Idiomatic, distinctive bokeh usage: ColumnDataSource, Span for reference lines,
    BoxAnnotation for the shaded zone, dynamically positioned Label annotations, and
    a formatted HoverTool for interactive detail in the HTML output'
  - Realistic, neutral blood-pressure method-comparison dataset with a believable
    spread of ~5% of points falling outside the 95% limits of agreement
  - Clean KISS code structure with explicit font sizes, seeded RNG, and no unused
    imports
  weaknesses:
  - 'Title is missing the required language segment: code sets title="bland-altman-basic
    · bokeh · anyplot.ai" but the mandated format is "{spec-id} · {language} · {library}
    · anyplot.ai" — fix to "bland-altman-basic · python · bokeh · anyplot.ai".'
  - p.outline_line_color is set on all four sides of the plot frame (full box outline)
    rather than following the style guide's default L-shaped (left+bottom only) or
    no-frame treatment — consider removing or lightening the outline for a more refined
    look.
  - Scatter markers (p.scatter(..., color=BRAND, alpha=0.7)) have no distinct edge/line
    color, so overlapping points blend into a single blob at the densest clusters
    (e.g. around mean~135-138) — a subtle lighter edge or slightly larger size would
    improve definition per the style guide's 'white edge for overlapping points' guidance.
  - 'Design storytelling is solid but could go further: no callout for the % of points
    within limits of agreement, and no distinct marker/emphasis for the outlier points
    beyond the shaded band.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "bland-altman-basic · bokeh · anyplot.ai" top-left; italicized dark axis labels "Mean of Two Methods (mmHg)" and "Difference (Method 1 - Method 2) (mmHg)" with units; softer gray tick labels; subtle grid lines (~15% alpha); a light legend box "Observations" top-left with a border. All text is clearly readable against the light background.
      Data: 80 green (#009E73) scatter points at alpha 0.7, revealing overlap in denser clusters. A solid green horizontal line marks the mean bias (-2.82 mmHg), with matching green "Mean Bias: -2.82 mmHg" label. Two dashed lavender (#C475FD) horizontal lines mark the ±1.96 SD limits of agreement (13.34 and -18.99 mmHg), each with a matching lavender label. A very subtle gray-tinted band (BoxAnnotation) shades the region between the limits of agreement.
      Legibility verdict: PASS — no light-on-light or unreadable text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/axis-label/tick-label structure now rendered in light tones (white title, light-gray axis labels, softer light-gray tick labels) against the dark surface; legend box uses a dark elevated fill with light text.
      Data: Same 80 green (#009E73) scatter points at the same positions and alpha — confirmed identical to the light render. Mean bias line and label remain the same green; LOA dashed lines and labels remain the same lavender — only the chrome (background, grid, text, legend box) flipped for the theme, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/annotation text is clearly visible against the near-black background.
