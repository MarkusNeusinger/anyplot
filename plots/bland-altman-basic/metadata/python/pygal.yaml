review:
  strengths:
  - Theme-adaptive Style tokens (PAGE_BG, INK, INK_MUTED) are correctly threaded through
    the whole chart, so chrome flips cleanly between light/dark while the Imprint
    data colors stay identical in both renders.
  - 'Statistically correct Bland-Altman construction: mean bias line plus +-1.96 SD
    limits of agreement (ddof=1), with the computed numeric values surfaced directly
    in the legend labels to satisfy the spec''s annotation requirement.'
  - Scatter dot_opacity=0.65 gives moderate transparency that reveals overlapping
    observations, exactly as the spec's 'Notes' section requests.
  - Dashed stroke_style (dasharray) distinguishes the upper/lower LoA lines from the
    solid mean-bias line, and dots_size=0 cleanly turns the two-point line series
    into pure reference lines with no stray markers.
  - 'Canvas is clean at 3200x1800: no clipped text at any edge, comfortable legend/title
    spacing, and the canvas-dimension gate passed.'
  weaknesses:
  - Mean bias and LoA values are only annotated via the bottom legend text, not with
    in-plot text near the lines themselves (e.g. at the right edge of each reference
    line) — readable, but the viewer has to look away from the data to connect a line
    to its value.
  - 'Visual hierarchy is fairly flat: all three reference lines get similar visual
    weight and there is no shaded band between the limits of agreement or callout
    on the single outlier point (~29 mmHg above mean) to guide the eye to the most
    important takeaway.'
  - Y-axis title wraps to two lines and consumes a fair amount of left margin at the
    mandated font size — not a defect, but a conservative choice worth trimming if
    a shorter phrasing is available.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "bland-altman-basic · pygal · anyplot.ai" in dark ink at the top, fully visible with no clipping. X-axis title "Mean of Two Methods (mmHg)" and the two-line Y-axis title "Difference (Method 1 - Method 2) (mmHg)" are both dark and clearly legible. Tick labels ("100"-"150" on X, "-20.0 mmHg"-"12.0 mmHg" on Y) are dark and readable. Dashed gray gridlines are subtle but visible. Bottom legend (two rows, two columns) lists "Measurements", "Mean Bias (-1.7)", "Upper LoA (+1.96 SD: 14.6)", "Lower LoA (-1.96 SD: -17.9)" in dark text with small colored swatches, all readable and non-overlapping with the X-axis title above it.
      Data: 50 teal-green (#009E73) scatter dots at alpha≈0.65 spread across the mean-of-methods range (~90-155 mmHg), a solid magenta/purple horizontal mean-bias line, and two dashed reference lines (blue-gray upper LoA, tan/orange lower LoA) spanning the full plot width. One clear outlier point sits near the top of the plot, still inside the canvas.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (off-white), clearly legible against the dark background. Gridlines remain subtle dashed light-gray. Legend text and swatches are equally readable in this theme, no dark-on-dark or light-on-light failures observed anywhere.
      Data: Same 50 scatter points in the identical teal-green (#009E73) at the same opacity, same magenta mean-bias line and blue-gray/tan dashed LoA lines — data colors are pixel-identical to the light render; only the chrome (background/text/grid) flipped as expected.
      Legibility verdict: PASS
