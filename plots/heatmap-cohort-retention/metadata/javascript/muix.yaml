review:
  strengths:
  - Composes the heatmap from the community ChartsContainer with band x/y axes and
    draws the cells through useXScale/useYScale/useDrawingArea, so every cell sits
    exactly in its cohort row and period band without reaching for the Pro-only Heatmap
  - 'Clean triangular staircase: Jan 2024 has 10 cells (Month 0–9), each later cohort
    one fewer, empty positions left as page background in both themes'
  - Two-line y labels set the cohort name in bold ink and the cohort size (n=4,821)
    in soft ink beneath it, a clear hierarchy that meets the cohort-size requirement
    without a hidden y axis band
  - Every cell carries its retention percentage in bold, legible text; Month 0 reads
    100% for every cohort
  - Continuous imprint_seq gradient from tok.seq with a matching hand-scaled color
    bar (0–100%), identical data colors in both themes, chrome fully theme-adaptive
  - ChartsXAxis valueFormatter turns the numeric period into the Month 0 … Month 9
    labels the Notes ask for
  - Deterministic LCG data with a plausible SaaS decay (≈84% at Month 1 falling to
    the mid-teens by Month 8–9)
  weaknesses:
  - 'Suggestion: the subtitle reads the raw column constant twice ("10 Cohorts …",
    "Month 1 mean Retention (%): 84%"); a plain-language phrasing such as "Mean Month
    1 retention: 84%" would read better.'
  - 'Suggestion: imprint_seq runs green to blue with only a modest lightness step,
    so 33% and 45% cells look close; the printed percentages carry the precision,
    but a stronger lightness contrast within the Imprint ramp is not available, so
    keep the in-cell labels prominent.'
  - 'Suggestion: MUI X community ships a continuous color legend tied to an axis colorMap;
    if it can be driven from the same tok.seq stops it could replace the hand-drawn
    color bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: title "heatmap-cohort-retention · javascript · muix · anyplot.ai" in bold dark ink centered at top (~48% width); soft-ink subtitle "10 Cohorts (Jan 2024–Oct 2024, n=48,819) · Month 1 mean Retention (%): 84%"; x tick labels Month 0 … Month 9 and x title "Months since signup"; y side shows two-line labels (bold cohort "Jan 2024", soft "n=4,821") for Jan–Oct 2024; color bar on the right titled "Retention (%)" with ticks 0/25/50/75/100%. All text dark on light, readable.
      Data: a 10-row triangular grid of rounded cells — Jan 2024 has 10 cells, Oct 2024 only Month 0; cells shaded on imprint_seq from blue #4467A3 (100%) to green #009E73 (low); Month 0 column uniform blue at 100%; bold white percentages in every cell. Empty upper-right triangle shows the page background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, cohort labels, n= sizes, Month ticks, x title and color bar ticks all flip to light ink and are clearly readable; no dark-on-dark text. x axis line light.
      Data: cell colors and the color bar gradient are identical to the light render; white in-cell percentages read the same; empty triangle is the dark page.
      Legibility verdict: PASS
