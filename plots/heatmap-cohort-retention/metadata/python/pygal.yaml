review:
  strengths:
  - Triangular staircase drawn with empty positions left blank, 10 cohorts with the
    100 % signup column
  - 'imprint_seq fields ramp with the theme''s own stops: mint->violet on light, olive->pale
    blue on dark'
  - Per-cell ink picked by WCAG contrast against the fill, so every percentage reads
    in both themes
  - Cohort sizes typeset as a muted italic n= line under each bold cohort label
  - Hover tooltips on every cell in the HTML output (cohort, month, exact %)
  weaknesses:
  - 'VQ-01 (both): column headers at 26 px, axis titles at 30 px and color-bar ticks
    at 28 px sit well below the 44 px tick reference and read small beside the 38-40
    px row and cell text -> about 40 px headers and ticks, 44 px axis titles (+14
    to +18 px). Likely cause: col_fs = min(26, cw*0.34) and cb_ls = 28.'
  - 'VQ-05 (both): an empty band of about 250 px separates the title from the ''Months
    Since Signup'' header, and the rotated ''Signup Cohort'' title sits ~120 px left
    of the row labels -> start the grid closer under the title and bring the y title
    next to the labels. Likely cause: margin_top=200 plus lm_t=130, and ytx = x0 -
    355.'
  - 'SC-03 (both): color-bar ticks at 100 %, 80 %, 61 %, 41 %, 21 % are min-max quarters,
    not round values -> round ticks such as 20, 40, 60, 80, 100 %. Likely cause: the
    tick loop takes max_val - span*frac.'
  - 'CQ-01 (code): line 97 `class CohortRetentionHeatmap(Graph)` holds the whole drawing
    in `_plot` -> draw at the top level (or render the cells as SVG without a subclass).
    Likely cause: a pygal Graph subclass for a type pygal lacks.'
  - 'Suggestion: emphasise the Month 1 column (the steepest drop) with a slightly
    heavier cell outline to anchor the reader.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: mandated title in dark ink at top; 'Months Since Signup' header and 'Month 0'-'Month 9' column labels above the grid; bold cohort labels Jan-Oct 2024 with muted italic n= sizes; rotated 'Signup Cohort' title at left; color bar at right titled 'Retention %' with ticks 100/80/61/41/21 %. All readable, column labels and ticks on the small side.
      Data: 10-row triangular heatmap, Jan with 10 cells down to Oct with 1; signup column dark violet (100 %), Month 1 deep blue/teal, later months fading to pale mint - light for low, dark for high. Light ink on dark cells, dark ink on mint/green cells. 'Retention %' clear of the Month 9 cell.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: all text in light ink (title, labels, color-bar ticks), muted sizes in grey; no dark-on-dark.
      Data: same layout and values; the ramp takes the dark fields stops - pale blue for 100 %, teal/green mid, dark olive for low retention, so high stands out from the page. Dark ink on pale cells, light ink on olive cells - all readable.
      Legibility verdict: PASS
