review:
  strengths:
  - Triangular staircase with the positions beyond each cohort's last month left empty,
    and the 100 % signup column for every cohort
  - 'imprint_seq fields ramp with each theme''s own stops: mint->violet on light,
    olive->pale blue on dark'
  - Per-cell ink picked by WCAG contrast against the fill, so every percentage reads
    in both themes
  - Cohort sizes typeset as a muted italic n= line under each bold cohort label
  - Color bar with round 40/60/80/100 % ticks and hover titles on every cell in the
    HTML output
  weaknesses:
  - 'VQ-01 (both): the ''Month 0''-''Month 9'' column headers at 32 px sit below the
    44 px tick reference and read small beside the 40 px cell values and 44 px axis
    titles -> about 40 px (+8 px), e.g. by stacking ''Month'' over the number on two
    lines so it fits the 163 px column. Likely cause: svg_text(..., 32, INK, f"Month
    {period}") on line 117.'
  - 'Suggestion: give the ''Retention %'' color-bar title a little more room from
    the Jan 2024 Month 9 cell (about 10 px apart now).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: mandated title in dark ink at top; 'Months Since Signup' header and bold 'Month 0'-'Month 9' column labels directly above the grid; bold cohort labels Jan-Oct 2024 with muted italic n= sizes; rotated 'Signup Cohort' title close to the row labels; color bar at right titled 'Retention %' with round ticks 40/60/80/100 %. All readable; column headers somewhat smaller than the other text.
      Data: 10-row triangular heatmap, Jan with 10 cells down to Oct with 1; signup column dark violet (100 %), Month 1 deep blue/teal, later months fading to pale mint - light for low, dark for high. Light ink on dark cells, dark ink on green/mint cells. Empty lower-right triangle left as page.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, labels, column headers and color-bar ticks in light ink, n= sizes in muted grey; no dark-on-dark.
      Data: same layout and values; the ramp takes the dark fields stops - pale blue for 100 %, teal/green mid, dark olive for low retention, so high values stand out from the page. Dark ink on pale/teal cells, light ink on olive cells - all readable.
      Legibility verdict: PASS
