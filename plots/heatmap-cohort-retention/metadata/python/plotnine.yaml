    to the continuous retention_rate fill, with theme-adaptive chrome correctly threaded
    through both renders - verified pixel-identical data colors across light/dark.'
  - No edge clipping anywhere (verified by cropping title, legend, and rotated x-axis
    tick label regions).
  - 'Clean KISS code: seeded RNG, only used imports, correct save call.'
  weaknesses:
  - Title width sits close to ~89% of the square canvas - comfortable margins remain
    and nothing clips, but there is little room left to grow if the title or subtitle
    lengthens further.
  - LM-02 distinctive-feature use, while legitimate, is a fairly common matplotlib-interop
    pattern rather than a plotnine-unique grammar-of-graphics extension - still somewhat
    generic relative to the library's deeper extension points.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: bold dark title and italic gray subtitle at top, fully visible with clean margins, not clipped. Y-axis cohort+size labels horizontal and readable. X-axis reads "Month 0" through "Month 9" (fixed from Attempt 1's abbreviated "M0"-"M9"), rotated 45 degrees, right-aligned, under the axis title "Months Since Signup". "Retention %" colorbar legend at right, comfortably inside the canvas with visible right margin. All chrome elements confirmed readable.
      Data: triangular 10x10 heatmap, Jan 2024 (10 cells) at top down to Oct 2024 (1 cell) at bottom. Cell fill runs from brand green #009E73 (high retention) through teal to blue #4467A3 (low retention) - correct imprint_seq polarity. Bold white percentage labels legible in every cell against both green and blue fills. Rounded off-white callout box fills most of the previously-empty triangle area, with two data-backed insight lines.
