review:
  strengths:
  - Correctly implements the triangular cohort structure -- Jan 2024 has 10 columns
    down to Oct 2024 with 1 column, exactly matching the spec's 'more recent cohorts
    have fewer elapsed periods' requirement.
  - 'Sequential Imprint colormap (imprint_seq: #009E73 high-retention to #4467A3 low-retention)
    applied correctly to the continuous retention_rate fill, with theme-adaptive background/text/grid
    tokens correctly threaded through both renders.'
  - 'Strong data storytelling: an annotation callout quantifies the Jan-to-Jun Month-4
    retention improvement (+12pp) and the subtitle calls out the Mar 2024 pricing-change
    churn spike -- both narratives are visibly backed by the underlying data (the
    Mar 2024 row is visibly depressed relative to its neighbors).'
  - Cohort size is shown inline in the y-axis labels ('Jan 2024 (n=1,200)') as required
    by the spec, and period 0 is 100% retention for every cohort.
  - 'Clean KISS code: seeded RNG (np.random.seed(42)), no functions/classes, only
    used imports, and correct plot.save(f''plot-{THEME}.png'', dpi=400, ...) output
    call.'
  weaknesses:
  - X-axis tick labels read 'M0'..'M9' rather than the spec-suggested 'Month 0', 'Month
    1', etc. -- expand the abbreviation to match the spec wording (SC-02).
  - 'Library Mastery is generic: geom_tile + geom_text + scale_fill_gradient + annotate
    is straightforward grammar-of-graphics layering that an R ggplot2 implementation
    would produce almost identically -- no plotnine-distinctive technique is leveraged
    (LM-02).'
  - Noticeable dead whitespace remains in the bottom-right of the panel below the
    triangular heatmap, beyond what the annotation box and legend occupy -- rebalance
    by enlarging the annotation, repositioning the legend, or tightening the panel
    bounds to the triangle's extent (VQ-05).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Bold dark title "heatmap-cohort-retention · python · plotnine · anyplot.ai" and italic dark-gray subtitle are both fully visible with generous padding above/below, not clipped. X-axis label "Months Since Signup" and "M0"-"M9" tick labels are dark/gray and clearly legible. Y-axis cohort labels ("Jan 2024 (n=1,200)" ... "Oct 2024 (n=1,020)") are dark and readable. Legend box "Retention %" with a colorbar and 0/25/50/75/100 ticks sits to the right of the heatmap on the light background, fully legible.
      Data: Triangular heatmap with 10 rows (Jan-Oct 2024) and up to 10 columns; cell fill runs from brand green (#009E73, high retention) through teal to blue (#4467A3, low retention). White bold percentage labels are legible in every cell, including mid-tone teal cells. An off-white annotation box in the empty lower-right area reads "Month 4 retention improved +12pp from Jan→Jun 2024" with a subtle border, not overlapping any data cells.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title and subtitle switch to light/off-white text, fully visible and not clipped. Tick labels and axis label switch to light gray/off-white and remain clearly legible against the dark background. Legend box switches to a dark elevated fill with light text, still fully readable.
      Data: Cell fill colors are visually identical to the light render (#009E73 high-retention green through #4467A3 low-retention blue) -- only chrome flipped, confirming palette consistency. White bold percentage labels remain legible on every cell. The annotation box switches to a dark elevated background with light text and a subtle border, still clearly readable with no dark-on-dark failures observed.
