  strengths:
  - 'Both prior weaknesses are cleanly fixed: x-axis now reads "Month 0"..."Month
    9" per spec, and the callout box was enlarged (~4x area) with a second data-backed
    insight, eliminating the dead whitespace below the triangle.'
  - The plot.draw() -> matplotlib Figure/Axes handoff for the callout patch is a genuine
