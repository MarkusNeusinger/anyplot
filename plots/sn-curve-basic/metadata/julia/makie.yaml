review:
  strengths:
  - Both axes correctly use log10 scales, matching the spec's requirement for wide-range
    fatigue data
  - All three required reference lines (Ultimate Strength, Yield Strength, Endurance
    Limit) are present with a clear, correctly labeled legend
  - Basquin power-law fit is properly derived via least-squares regression in log-log
    space and overlaid on the scatter, exactly as the spec requests
  - Fatigue parameters are physically realistic for steel (endurance limit/ultimate
    ratio ~0.42, yield/ultimate ratio ~0.75, Basquin exponent b=-0.09 within the typical
    -0.05 to -0.12 range) and the generated scatter visibly follows the fit line across
    all stress levels
  - Theme-adaptive chrome is threaded correctly through Figure/Axis tokens (PAGE_BG,
    INK, INK_SOFT) — both light and dark renders are fully readable with identical
    data colors
  - Explicit font sizing throughout (titlesize, xlabelsize, ylabelsize, xticklabelsize,
    yticklabelsize), reproducible via Random.seed!(42), and idiomatic CairoMakie usage
    (Axis kwargs, hlines!, axislegend, custom ytickformat closure)
  weaknesses:
  - 'VQ-07: The three hlines reference-series skip Imprint palette position 2 (lavender)
    and jump straight to positions 3 (blue, Ultimate Strength) and 4 (ochre, Yield
    Strength), then use the amber anchor for Endurance Limit — none of these are strong
    semantic matches (blue isn''t conventionally ''ultimate strength'', ochre isn''t
    conventionally ''yield''), so this reads as an arbitrary skip of the canonical
    1→N order rather than a justified semantic exception. Recommend reassigning to
    canonical order (lavender #C475FD, blue #4467A3, ochre #BD8233) for the three
    threshold lines, or provide a clearer semantic rationale if keeping non-canonical
    colors.'
  - 'DE-03/DQ-01: The spec calls out three distinct fatigue regions (low-cycle plastic,
    high-cycle elastic, infinite life below the endurance limit) but the chart doesn''t
    visually demarcate or label them — only the endurance-limit hline hints at the
    boundary. Consider light region shading or small text callouts to make the three-region
    story explicit and raise visual hierarchy.'
  - 'DE-01: Overall styling is solid but still close to ''well-configured defaults''
    — the log-log Basquin curve is handled well, but there''s no additional refinement
    (e.g., annotating where the fit crosses each threshold) that would push it into
    publication-ready territory.'
  - 'LM-02: Library usage is correct and idiomatic but not maximally distinctive —
    consider leveraging more Makie-unique features (e.g., text!() annotations at threshold
    crossings, or minor gridline styling) to better showcase capabilities unique to
    Makie.'
  image_description: |-
