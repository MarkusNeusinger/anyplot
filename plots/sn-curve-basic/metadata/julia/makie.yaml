      Data: 32 green (#009E73) scatter points clustered in groups of ~4 per stress level, following a grey Basquin fit line from upper-left to lower-right in log-log space. Three dashed threshold lines cross the plot horizontally at 600, 450, and 250 MPa.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures observed.

