review:
  strengths:
  - 'Full fatigue-region storytelling: low-cycle/high-cycle/infinite-life zones are
    demarcated with dotted separators and direct labels, plus a callout annotation
    showing exactly where the Basquin fit crosses the endurance limit (N ≈ 796k)'
  - All three required reference lines (Ultimate Strength, Yield Strength, Endurance
    Limit) are present, correctly ordered, and factually plausible for structural
    steel
  - Explicit font sizing on every text element (title, axis, tick, annotation) with
    correctly threaded theme-adaptive chrome in both renders — no dark-on-dark or
    light-on-light issues
  - 'Idiomatic Makie usage: functional log10 scale, closure-based ytickformat, frameless
    axislegend, spines removed, subtle non-competing grid'
  - Correct title format and Imprint palette compliance — brand green as the primary
    series, canonical palette order for reference lines, identical data colors between
    light and dark
  weaknesses:
  - 'Ultimate Strength (lavender #C475FD) and Endurance Limit (ochre #BD8233) are
    two of the palette''s lower-WCAG-contrast hues against the cream background, used
    for safety-critical threshold lines — add the style guide''s optional 1px ink-color
    stroke (or slightly bump linewidth/opacity) to these two dashed lines so they
    read unambiguously for low-vision viewers'
  - Annotation and region-boundary text (fontsize 11) softens noticeably at the ~400px
    mobile thumbnail scale; acceptable since it's tertiary content but could be nudged
    up slightly
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "sn-curve-basic · julia · makie · anyplot.ai" centered at top, comfortably fits with generous margins (no clipping). Dark axis labels ("Cycles to Failure, N" / "Stress Amplitude (MPa)") and softer-gray tick labels along log-log axes are all crisp. Subtle vertical dotted separators mark Low-Cycle/High-Cycle/Infinite Life regions with small gray labels near the bottom. Frameless legend (top-right, inside plot bounds) lists Ultimate Strength, Yield Strength, Endurance Limit, Basquin fit, Test specimens — all fully visible, no overlap with data or plot edges. Top/right spines removed, left/bottom spines subtle gray, gridlines faint.
      Data: Green (#009E73) scatter markers with a light cream stroke for 32 fatigue-test specimens across 8 stress levels, a dark-gray Basquin power-law fit line, and three dashed horizontal threshold lines (lavender = Ultimate Strength at 600 MPa, blue = Yield Strength at 450 MPa, ochre = Endurance Limit at 250 MPa). A small annotation near the endurance-limit line reads "fit crosses endurance limit, N ≈ 796k".
      Legibility verdict: PASS — all title/axis/tick/legend text is clearly readable against the light background; only the smallest tertiary annotation/region-label text (fontsize 11) softens slightly when the PNG is scaled to mobile width, which is expected for tertiary text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same layout as the light render with all chrome flipped to light tokens — title and axis labels are light cream/white, tick labels and legend text are light gray, spines/grid are light-gray-on-dark and equally subtle. No dark-on-dark text anywhere; region-boundary labels and the endurance-limit annotation are clearly legible in light gray.
      Data: Identical data colors to the light render — the same #009E73 green scatter markers (with a dark stroke matching the dark background instead of cream), the same lavender/blue/ochre dashed threshold lines, and the same dark-gray-toned Basquin fit line (rendered slightly lighter to stay visible against the dark background, consistent with the INK_SOFT chrome token). Confirmed: only chrome elements changed, not the categorical data hues.
      Legibility verdict: PASS — all text is light-colored and clearly readable against the dark background; no dark-on-dark failures observed.
