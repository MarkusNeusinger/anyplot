review:
  strengths:
  - Every specimen at its own cycle count and stress on log-log axes, with LogLocator(subs=(1,2,3,5))
    and a plain-number FuncFormatter giving readable MPa ticks
  - Basquin fit computed by np.polyfit on log values and cut where it meets the endurance
    limit, so the line ends at the knee instead of running through the Infinite Life
    band
  - 'Full theme threading: INK/INK_SOFT/INK_MUTED/ELEVATED_BG on all text, spines,
    grid and legend; shading alpha raised on the dark page so the three bands stay
    visible'
  - Region labels placed with blended_transform_factory (axes-x, data-y), so they
    follow the reference values when the data changes
  - 'Adaptable structure: column constants, a Data block ending in df, limits and
    fit range derived from the data'
  weaknesses:
  - 'Suggestion: the ''Low-Cycle Fatigue'' and ''High-Cycle Fatigue'' labels both
    sit in the top band above ultimate strength while the shading is split by stress
    level; placing each label over the data it names would tie labels and bands together.'
  - 'Suggestion: the y axis shows only the 100/200/300 MPa ticks; adding the 150 and
    250 MPa subs would make values between the reference lines easier to read off.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, with three faint stress bands (green below 80 MPa, purple 80-280 MPa, blue above 280 MPa)
      Chrome: title 'sn-curve-basic · python · matplotlib · anyplot.ai' in dark ink; axis titles 'Number of Cycles to Failure (N)' and 'Stress Amplitude (MPa)'; log x ticks 10^2-10^8, y ticks 100/200/300; legend lower left on an elevated frame; italic muted region labels 'Low-Cycle Fatigue', 'High-Cycle Fatigue' (top band) and 'Infinite Life' (below the endurance line) - all readable
      Data: ~30 #009E73 points falling from 250 MPa at ~5e2 cycles to ~88 MPa at ~1.2e7 cycles; purple #C475FD Basquin fit ending at the endurance limit near 6e7 cycles; dashed blue Ultimate Strength 330 MPa, ochre Yield Strength 280 MPa, thicker red Endurance Limit 80 MPa
