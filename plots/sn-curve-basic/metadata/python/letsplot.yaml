review:
  strengths:
  - 'Clean S-N layout: both axes on log10 scales with every specimen at its own cycle
    count and stress, and a Basquin line fitted to the data with np.polyfit in log-log
    space running through the middle of the scatter'
  - Reference lines carry two encodings — Imprint color plus dashed/dotted/dot-dash
    linetype — and their labels sit clear of the lines and of the data in both themes
  - 'Complete theme-adaptive chrome: PAGE_BG, INK, INK_SOFT and GRID tokens threaded
    through every element; no dark-on-dark text'
  - 'Native lets-plot interactivity: layer_tooltips().line() with number formatting
    gives a formatted cycles/stress readout per specimen in the HTML export'
  weaknesses:
  - 'VQ-05 (both): the three reference labels are drawn at geom_text size=11, which
    lets-plot reads in mm (~31 pt), so they render about twice the 16 pt title and
    dominate the panel → size about 4–5 (≈12–14 pt, −6 mm). Likely cause: geom_text(size=11)
    in the reference-label loop.'
  - 'SC-03 (both): the log stress axis is labelled at non-round values (126, 141,
    158, 178, 224, 251, 282, 316, 355, 398, 447, 501), so the 500 MPa line sits on
    a ''501'' tick and values cannot be read off cleanly → round breaks such as 150,
    200, 250, 300, 400, 500. Likely cause: scale_y_log10() without breaks=.'
  - 'SC-04 (both): the three shaded fatigue regions carry no key or label, and each
    band takes the color of a reference line, so the purple low-cycle band reads as
    belonging to ''Ultimate Strength'' → name the low-cycle, high-cycle and infinite-life
    regions with plain labels (the spec allows them) or drop the shading. Likely cause:
    zone_bounds geom_rect layers with no accompanying text.'
  - 'DQ-03 (both): the Basquin fit line is extrapolated a full decade past the data
    to ~7×10^6 cycles and down to ~165 MPa, below the 200 MPa endurance limit the
    chart draws — a finite life below the endurance limit contradicts the chart''s
    own reference → end the fit at the data''s last cycle count, or where it meets
    the endurance limit. Likely cause: fit_cycles upper bound np.log10(max)+1.0.'
  - 'DE-02 (both): the panel is enclosed by a four-sided frame, while the style guide
    asks for an L-shaped frame (top and right spines removed) → keep only left and
    bottom axis lines. Likely cause: axis_line plus the panel border of theme_minimal()
    in this lets-plot version; set panel_border=element_blank().'
  - 'Suggestion: draw the fit line in a lighter or thinner variant so it separates
    more clearly from the same-colored specimen points.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title 'sn-curve-basic · python · letsplot · anyplot.ai' top-left in dark ink; axis titles 'Number of Cycles to Failure (N)' and 'Stress Amplitude (MPa)' and tick labels (100 … 10^7; 126 … 501) dark and readable; subtle grid; four-sided panel frame
      Data: ~40 #009E73 specimen points at 10 stress levels from 450 to 210 MPa and ~300 to ~7e5 cycles, a thick #009E73 Basquin fit line running through them and on to ~7e6 cycles / ~165 MPa; three reference lines — purple dashed at 500 (Ultimate Strength), blue dotted at 350 (Yield Strength), ochre dot-dash at 200 (Endurance Limit) — with large matching labels clear of the lines (Endurance Limit on the empty left); light purple/grey/ochre band shading between the reference stresses, unlabeled
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black
