  strengths:
  - Reference lines are labeled directly with name and value in boxes bordered by
    the line color, readable in both themes (C2)
  - Annotations use log10 data coordinates, the correct Plotly convention on log axes,
    so every label lands where intended
  - Axis ranges and fit come from the data (np.polyfit on log values, floor/ceil of
    decades), matching the adaptable-code rule
  - Light add_vrect/add_hrect bands plus plain labels make the low-cycle, high-cycle
    and infinite-life regions readable without extra layers (C4, C5)
  - Theme tokens threaded through every chrome element; Imprint colors identical in
    both renders
  - hovertemplate on each trace gives formatted cycle and stress values in the HTML
    view
  weaknesses:
