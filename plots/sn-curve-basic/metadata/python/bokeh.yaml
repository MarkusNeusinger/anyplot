review:
  strengths:
  - Reference lines for ultimate, yield and endurance limit as native Span models,
    each labeled in its own color and placed in the empty right side clear of the
    data
  - Basquin fit computed from the data with np.polyfit in log space, coefficients
    shown in the legend
  - Native BoxAnnotation shades the infinite-life zone below the endurance limit
  - HoverTool with scientific-notation formatting for the HTML view
  - Theme tokens threaded through all chrome; both renders readable
  weaknesses:
  - 'SC-02 (both): the Basquin fit line spans the whole axis 10^2 to 2·10^7, far beyond
    the data (about 3·10^3 to 2.6·10^6), crossing the Ultimate Strength line at upper
    left and continuing down through the shaded infinite-life zone below the 200 MPa
    endurance limit → run the fit only over the sloping part of the data, from the
    smallest to the largest tested cycle count. Likely cause: cycles_fit = np.logspace(np.log10(x_low),
    np.log10(x_high), 100).'
  - 'VQ-03 (both): 37 sparse test points drawn at size 18 read small and are partly
    hidden under the 7 px fit line → markers about 26-30 (+8 to +12) or a fit line
    about 4 px (-3 px). Likely cause: scatter size=18 with line_width=7.'
  - 'VQ-05 (dark): a 1 px light line (rgb 197,197,196) runs along the top and left
    edge of the PNG → page color #1A1A17. Likely cause: the page background is not
    painted with PAGE_BG before the screenshot (library prompt''s document.documentElement.style.background
    script missing).'
  - 'Suggestion: plain labels for the low-cycle and high-cycle regions would let the
    three regions the Notes name be read directly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title 'sn-curve-basic · python · bokeh · anyplot.ai' top left; italic axis titles 'Number of Cycles to Failure (N)' and 'Stress Amplitude (MPa)'; log tick labels 10^2..10^7 and 200..600 in soft ink; faint y-only grid. Legend lower left on elevated background: 'Basquin Fit (S = 1119·N^-0.115)' and 'Fatigue Test Data'.
      Data: about 37 #009E73 points falling from 450 MPa at ~3·10^3 cycles to ~210 MPa at ~2.5·10^6, with a straight green fit line across the full axis. Dashed reference lines at 500 (purple #C475FD), 350 (ochre #BD8233) and 200 MPa (blue #4467A3); labels for the first two right-aligned at the right, 'Endurance Limit (200 MPa) <- infinite life' at the left; light blue shading below 200 MPa. Points smallish and partly under the fit line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light ink, tick labels in light soft ink, legend on #242420 with light labels; no dark-on-dark text. A 1 px light line runs along the top and left canvas edge.
      Data: identical colors to the light render (#009E73 points and fit, purple/ochre/blue reference lines and labels); shading below 200 MPa reads as a dark blue tint. Endurance label is the dimmest text but legible.
      Legibility verdict: PASS
