review:
  strengths:
  - Both renders thread theme tokens through every chrome element via sns.set_theme
    rc; no dark-on-dark text
  - 'Imprint palette in canonical order: brand green for data and fit, positions 2-4
    for the three reference lines, separated by dashed vs solid style'
  - Realistic structural-steel fatigue data with several specimens per stress level
    and lognormal life scatter
  - 'Data block follows the adaptable zones: column constants feed data=df, and seaborn
    titles the axes from them'
  weaknesses:
  - 'SC-01 (both): a 95 % bootstrap band shades around the fit line, a probability
    band the basic variant''s single-material scope (C5) excludes → drop the band
    and draw the single Basquin fit line. Likely cause: sns.lineplot(errorbar=(''pi'',
    95)) over the N_BOOT bootstrap resamples.'
  - 'SC-03 (both): stress ticks read 2×10², 3×10², 4×10², 6×10² in scientific notation,
    so a reader cannot read MPa values off the axis directly → plain values (200,
    300, 400, 500 MPa). Likely cause: the default LogFormatterSciNotation on the y
    axis; set a ScalarFormatter or explicit plain ticks.'
  - 'VQ-05 (both): y tick labels render at the rc default size, visibly larger than
    the 8 pt x tick labels → the same 8 pt on both axes. Likely cause: ax.tick_params(labelsize=8)
    applies to major ticks only, and the y labels are minor-tick labels.'
  - 'VQ-02 (both): the legend box covers the endurance-limit line and the infinite-life
    shading from 1e3 to about 1.4e4 cycles → place it in empty space clear of the
    reference lines (the upper right is empty). Likely cause: ax.legend(loc=''lower
    left'').'
  - 'DQ-03 (both): the fit is drawn out to 5e7 cycles and down to 150 MPa, predicting
    finite life below the 200 MPa endurance limit the same chart declares as infinite
    life → end the fit at the data''s longest life or at the endurance limit. Likely
    cause: fit_cycles_grid spans 1e3 to 10^7.7.'
  - 'Suggestion: plain text labels for the low-cycle, high-cycle and infinite-life
    regions the Notes name would make the three regions readable without the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
