review:
  strengths:
  - Basquin fit computed with np.polyfit in log-log space and drawn only over the
    tested cycle range, so it runs through the middle of the scatter without extrapolating
    past the data
  - Axis domains derived from the data and the reference values; autosize fit fills
    the 3200x1800 canvas in both themes
  - Five Altair layers (band, points, fit, rules, labels) share one pair of alt.Scale
    log scales; the reference-line legend comes straight from a color-encoded mark_rule
  - Theme tokens drive every chrome element; Imprint positions 1-4 identical in both
    renders
  - Tooltips on the specimens for the HTML view
  weaknesses:
  - 'VQ-02 (both): the top-right legend box covers the right end of the UTS dashed
    line (about 1.2x10^6 to 2x10^6 cycles at 520 MPa) → place the legend where no
    reference line or data runs, e.g. orient=''right'' outside the view. Likely cause:
    alt.Legend(orient=''top-right'').'
  - 'Suggestion: spell out the reference names in the legend ("Ultimate Tensile Strength:
    520 MPa") so non-specialists can read the abbreviations.'
  - 'Suggestion: the last two x tick labels (1,000,000 and 2,000,000) nearly touch;
    a format such as ''~s'' or fewer label values at the right end would give them
    air.'
  - 'Suggestion: the grid at opacity 0.06 is fainter than the style guide''s 0.15
    grid token; a slightly stronger grid would make the log subdivisions easier to
    follow.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and view; no pure white.
      Chrome: bold dark title 'sn-curve-basic · python · altair · anyplot.ai' centred at the top (~40% of the width); axis titles 'Stress Amplitude (MPa)' and 'Cycles to Failure (N)' in dark ink; log tick labels 200-700 MPa and 100 to 2,000,000 cycles in INK_SOFT; faint log grid on both axes; legend 'Material Properties' in an elevated off-white box at top-right. All readable.
      Data: ~40 #009E73 specimens (translucent, page-coloured outline) at 10 stress levels from 450 MPa (~100 cycles) to 160 MPa (~8x10^5 cycles); solid green Basquin fit through their middle over the tested range; dashed rules UTS 520 (#C475FD), YS 380 (#4467A3), EL 150 (#BD8233); light ochre band below EL labelled 'Infinite Life'; italic region labels 'Low-Cycle Fatigue' and 'High-Cycle Fatigue' at the top. The legend box covers the right end of the UTS line.
      Legibility verdict: PASS

