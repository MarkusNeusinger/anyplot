  strengths:
  - 'Theme-correct chrome in both renders: #FAF8F1 / #1A1A17 surfaces, INK / INK_MUTED
    tokens on title, axes, ticks, grid and legend'
  - 'True log-log S-N plot in pygal: stress log10-transformed with explicit y_labels
    mapped back to round MPa values, x axis logarithmic with decade ticks'
  - Reference lines distinguished by color and by per-series stroke_style dash patterns
    (solid / long-dash / short-dash), each named with its value in the legend
  - Data block binds df with column constants; axis ranges, decade ticks and fit range
    are derived from the data
  - Interactive HTML tooltips carry the fatigue zone, cycles and stress of each specimen
  weaknesses:
  - 'VQ-01 (both): region labels ''Low-Cycle'', ''High-Cycle Fatigue'', ''Infinite
    Life'' at 38 px in INK_MUTED at 55 % opacity read faint on the tinted bands, below
    the 44 px tick labels → INK_MUTED at full opacity and at least 44 px (+6 px, opacity
    0.55 → 1.0). Likely cause: lbl_sz = 38 and opacity="0.55" in _inject_region_bands.'
  - 'VQ-07 (both): region band fills are hand-picked #CC8888 / #88AA88 / #8888BB (light)
    and #BB5555 / #55994A / #5577BB (dark), neither Imprint colors nor theme tokens
    → the muted token (#6B6A63 / #A8A79F) or Imprint positions at low opacity. Likely
    cause: the region_fills lists in _inject_region_bands.'
  - 'SC-03 (both): x tick labels read 1000000 and 10000000 with no separators or suffix
    → 1M and 10M (or 10⁶, 10⁷). Likely cause: chart.x_labels floats with pygal''s
    default formatter; set x_value_formatter.'
  - 'CQ-01 (code): three helper functions _zone (lines 87–90), _get_plot_dims and
    _inject_region_bands (lines 197–286, with a nested log_to_x) wrap one-shot script
    logic → inline them as top-level script code. Likely cause: the SVG band injection
    organized as functions.'
  - 'Suggestion: the HTML export writes svg_raw, so the interactive view lacks the
    region bands and labels the PNG shows; writing svg_enhanced would keep both outputs
    alike.'
  - 'Suggestion: name the regions consistently (''Low-Cycle Fatigue'' beside ''High-Cycle
    Fatigue'', and ''Infinite Life'' also in the tooltips instead of ''Near Endurance
    Limit'').'
