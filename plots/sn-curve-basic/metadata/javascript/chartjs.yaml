review:
  strengths:
  - Correct log-log scatter mapping (cycles on x, stress amplitude on y) matches the
    S-N curve convention
  - Multiple specimens per stress level with Basquin-equation-driven scatter gives
    a scientifically grounded, realistic dataset
  - Yield strength and endurance limit reference lines use distinct dash patterns;
    the endurance limit line is thoughtfully trimmed to only the region beyond ~1e6
    cycles where it is physically meaningful
  - 'Theme-adaptive chrome (title, axis labels, ticks, grid) is clean and legible
    in both light and dark renders; brand green #009E73 correctly used for the primary
    Test specimens series'
  - Deterministic LCG-seeded data generation ensures reproducibility
  - Idiomatic Chart.js mixed chart-type usage (scatter base type with line-type dataset
    overlays)
  weaknesses:
  - 'Missing the Ultimate Strength reference line explicitly required by the spec
    ("Include horizontal reference lines for key material properties: Ultimate Strength,
    Yield Strength, and Endurance Limit") — only Yield strength and Endurance limit
    are drawn'
  - 'Palette order breaks canonical sequence: ''Basquin fit'' uses palette[2] (blue)
    while palette[1] (lavender) is skipped entirely; ''Yield strength'' uses palette[3]
    (ochre) with no strong semantic tie to yield strength'
  - The amber semantic anchor is used for the Endurance limit line without a clear
    'warning/caution' framing in the legend, weakening the semantic justification
    for deviating from canonical palette order
  - No numeric threshold values are annotated on the reference lines, so the reader
    must cross-reference the legend to know what each line means quantitatively
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sn-curve-basic · javascript · chartjs · anyplot.ai" in dark ink at top; legend top-right listing "Test specimens" (green dot), "Basquin fit" (blue dot), "Yield strength" (ochre dot), "Endurance limit" (pale-yellow dot) — all clearly readable. Axis titles "Cycles to Failure (N)" (x) and "Stress Amplitude (MPa)" (y) in dark ink, tick labels (10^3-10^7 on x; 150-700 on y) in a slightly softer dark gray, all legible. Grid lines are faint but visible, do not compete with data.
      Data: Green (#009E73) circular markers scatter along a descending log-log trend from ~(10^3, 440 MPa) to ~(7x10^5, 220 MPa); a solid blue line traces the Basquin fit closely through the scatter; a dashed ochre horizontal line sits at ~615 MPa (yield strength); a dotted pale-yellow horizontal line starts at 10^6 cycles at ~230 MPa (endurance limit).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis structure as the light render, now rendered in light/off-white and soft-gray tones. All text is clearly legible against the dark background — no dark-on-dark failures observed (tick labels, axis titles, legend text, and title are all visibly light-colored).
      Data: Colors are identical to the light render — green scatter (#009E73), blue fit line, ochre dashed yield-strength line, pale-yellow dotted endurance-limit line — confirming the Imprint data-color consistency rule (only chrome flips between themes).
      Legibility verdict: PASS — all text and grid lines are visible and legible against the dark background.
