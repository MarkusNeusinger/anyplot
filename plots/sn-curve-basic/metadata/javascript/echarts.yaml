review:
  strengths:
  - 'All three prior review weaknesses are fixed: the yield/ultimate ratio is now
    650/745 ≈ 0.87 (realistic for Q&T 4340 steel), a shaded ''Infinite life region''
    markArea now reinforces the endurance-limit storytelling the spec notes call for,
    and deterministic per-specimen x-jitter keeps same-stress-level clusters visually
    distinct instead of overlapping into one blob'
  - Correct log-log S-N curve with clearly labeled Ultimate/Yield/Endurance reference
    lines using distinct dash styles (solid/dashed/dotted) for quick visual differentiation
  - Custom decade-tick formatter renders proper 10^n superscript labels instead of
    raw scientific notation — a nice idiomatic touch for log axes
  - Deterministic LCG-seeded data generation with a realistic Basquin power-law fit
    and per-stress-level specimen scatter (44 points across 11 stress levels)
  - Theme-adaptive chrome is fully correct in both renders; Imprint palette used in
    canonical order (green scatter, lavender fit line), identical data colors across
    themes
  - Clean, KISS code structure with a single setOption call, correct mount-node contract,
    animation disabled
  weaknesses:
  - The y-axis (log, min:200, max:900) only ever labels its two endpoints — there
    are no intermediate tick labels or horizontal split lines, so the plot reads as
    a boxed frame with no internal y-grid. The three labeled threshold lines (745/650/260
    MPa) partly compensate, but a reader can't estimate an arbitrary data point's
    stress value with any precision. Add explicit yAxis.axisLabel formatter/interval
    (or minorSplitLine) so values like 300/400/500/700 MPa are labeled and gridded.
  - 'Because the y min/max coincide exactly with the axis frame, the chart reads as
    a closed box rather than the L-shaped frame the style guide favors — consider
    a small headroom margin above Ultimate Strength (e.g. max: 950-1000) so the top
    boundary doesn''t double as a data-adjacent gridline, and/or drop the right-side
    axisLine so it doesn''t look enclosed.'
  - Spec notes call out three distinct fatigue regions (low-cycle plastic, high-cycle
    elastic, infinite life) but only the infinite-life region is visually delineated
    — labeling the low-cycle/high-cycle transition would round out the data storytelling.
  - Title occupies only ~35% of the plot width at the current fontsize — not a violation,
    but a slightly larger fontsize would better match the visual weight of the rest
    of the chrome and other catalog entries.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "sn-curve-basic · javascript · echarts · anyplot.ai" centered top in bold dark ink, clearly readable. Legend ("Test specimens", "Basquin fit") below title, readable dark text with matching green-dot and lavender-line swatches. X-axis "Cycles to Failure (N)" with 10³..10⁷ decade ticks (superscript formatted); Y-axis "Stress Amplitude (MPa)" log-scaled 200-900, but only the 200/900 endpoints carry numeric labels — no intermediate tick values. Three horizontal reference lines (solid = Ultimate Strength 745 MPa, dashed = Yield Strength 650 MPa, dotted = Endurance Limit 260 MPa) with dark-ink labels, all fully visible with no clipping at either canvas edge. A light gray "Infinite life region" markArea shades the zone below the endurance limit, with an italic label at its top-left. Subtle vertical gridlines at each x-decade; no visible internal horizontal gridlines.
      Data: Green (#009E73) scatter markers for 44 test specimens spread (via deterministic jitter) across 11 stress levels — clusters are now individually distinguishable rather than overlapping into blobs. Lavender (#C475FD) Basquin fit line runs cleanly through the cloud from high-stress/low-cycle down to the endurance limit.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no clipping, no light-on-light.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/legend/axis layout, now rendered in light ink/off-white text — clearly readable against the dark background. Reference-line labels are light-colored and legible; no dark-on-dark text anywhere. The markArea shading and gridlines are subtle light-on-dark, still readable.
      Data: Scatter and fit-line colors are pixel-identical to the light render (#009E73 green, #C475FD lavender) — only the chrome (background, text, grid, markArea tint) flipped, as required. Brand green remains clearly visible against the dark surface.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no dark-on-dark failures observed.
