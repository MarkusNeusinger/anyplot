review:
  strengths:
  - Correct log-log S-N curve with clearly labeled Ultimate/Yield/Endurance reference
    lines using distinct dash styles (solid/dashed/dotted) for quick visual differentiation
  - Custom decade-tick formatter renders proper 10^n superscript labels instead of
    raw scientific notation — a nice idiomatic touch for log axes
  - Deterministic LCG-seeded data generation with a realistic Basquin power-law fit
    and per-stress-level specimen scatter
  - Theme-adaptive chrome is fully correct in both renders; Imprint palette used in
    canonical order (green scatter, lavender fit line)
  - Clean, KISS code structure with a single setOption call, correct mount-node contract,
    and animation disabled
  weaknesses:
  - Design Excellence is solid but not yet publication-grade — consider a subtle shaded
    band below the endurance-limit line to visually reinforce the 'infinite life'
    region called out in the spec notes, strengthening the data storytelling
  - Yield/Ultimate strength ratio (470/745 ≈ 0.63) is low for a quenched-and-tempered
    4340 steel, which typically runs closer to 0.85-0.9 — tune the constants for better
    metallurgical realism
  - At the lowest-cycle stress levels the 4 specimens per level nearly fully overlap
    into a single blob (e.g. leftmost cluster near 620 MPa) — a small deterministic
    x-jitter spread would keep all specimens individually visible
  - Title occupies only ~30% of the plot width at the current fontsize; not a violation,
    but a slightly larger fontsize would better match the visual weight of the rest
    of the chrome
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sn-curve-basic · javascript · echarts · anyplot.ai" centered top in dark ink, clearly readable. Legend ("Test specimens", "Basquin fit") below title, readable. X-axis "Cycles to Failure (N)" with 10^3..10^7 decade ticks (superscript formatted); Y-axis "Stress Amplitude (MPa)" log-scaled 200-900. Three horizontal reference lines (solid = Ultimate Strength 745 MPa, dashed = Yield Strength 470 MPa, dotted = Endurance Limit 260 MPa) with dark-ink labels, all fully visible with no clipping at either canvas edge. Subtle light-gray gridlines.
      Data: Green (#009E73) scatter markers for 44 test specimens clustered at 11 stress levels, clearly distinguishable from background; purple (#C475FD) Basquin fit line running through the cloud from high-stress/low-cycle to the endurance limit.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/legend/axis layout, now in light ink/off-white text — clearly readable against the dark background. Reference-line labels are light-colored and legible; no dark-on-dark text anywhere. Gridlines are subtle light-on-dark.
      Data: Scatter and fit-line colors are pixel-identical to the light render (#009E73 green, #C475FD purple) — only the chrome (background, text, grid) flipped, as required.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no dark-on-dark failures observed.
