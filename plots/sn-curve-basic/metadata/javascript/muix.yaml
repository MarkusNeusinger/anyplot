review:
  strengths:
  - 'Comprehensive spec coverage: log-log axes, Basquin power-law fit line, all three
    material-property reference lines (ultimate, yield, endurance limit), and clearly
    labeled low-cycle/high-cycle/infinite-life regions — every note from the specification''s
    requirements is represented.'
  - Genuine data storytelling via custom SVG overlays (SafeZoneBand, FatigueRegionLabels)
    built with useDrawingArea/useXScale/useYScale — goes well beyond default chart
    output to guide the reader through the fatigue-life narrative.
  - 'Correct Imprint palette usage: brand green for specimens, palette[1] lavender
    for the fit line, amber for reference-line thresholds, identical data colors across
    both themes with only chrome flipping.'
  - 'Deterministic, realistic data: seeded LCG jitter around an analytically-anchored
    Basquin curve, plausible steel fatigue values (400-760 MPa stress range, 10^3-10^7
    cycles).'
  - Idiomatic composed MUI X API usage (ChartContainer + modular plot/axis/legend
    components) with skipAnimation set on all animated components per the harness
    contract.
  weaknesses:
  - Y-axis title 'Stress Amplitude (MPa)' visually overlaps the '500' tick label in
    BOTH light and dark renders — the rotated axis title is vertically centered on
    the full axis span, and because the log-scale y-axis (min=340, max=820) places
    '500' almost exactly at that vertical midpoint, the title's glyph strokes cross
    directly over the '5' digit, making it hard to read cleanly. Increase the horizontal
    offset between the rotated y-axis label and the tick labels (e.g. push the label
    further left via a larger ChartContainer margin.left combined with an explicit
    axis label offset, or shorten/reposition the label) so no title glyph ever intersects
    a tick label regardless of where a tick happens to land on the log scale.
  - The endurance-limit reference line (strokeWidth 5, dash '3 5') is considerably
    thicker than the ultimate/yield reference lines and visually competes with the
    purple fit line where the two coincide past 10^6 cycles — consider a slightly
    thinner stroke or a small vertical offset so the amber dash pattern doesn't blend
    into the fit line's flat tail.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sn-curve-basic · javascript · muix · anyplot.ai" is centered at top in dark ink, clearly legible. X-axis label "Cycles to Failure, N" and Y-axis label "Stress Amplitude (MPa)" are both dark ink, similarly sized. Tick labels (10^3-10^7 on x, 400-800 on y) are legible in a softer ink tone. Horizontal grid lines are subtle. Three fatigue-region labels (LOW-CYCLE FATIGUE / HIGH-CYCLE FATIGUE / INFINITE LIFE) sit below the x-axis with thin boundary tick marks, legible and unobstructed.
      Data: First series (Test Specimens) renders as brand-green (#009E73) circles with a white stroke for definition, 24 points clustered at 8 stress levels. Second series (Basquin Fit) is a lavender/purple line. Three amber dashed/dotted reference lines mark Ultimate Strength (760 MPa), Yield Strength (620 MPa), and Endurance Limit (380 MPa), each with an inline text label. A pale green "safe zone" band shades the region below the endurance limit, with an italic annotation.
      Legibility verdict: FAIL for one element — the rotated "Stress Amplitude (MPa)" axis title visually overlaps the "500" y-tick label (its glyph strokes cross directly over the "5" digit) because the log-scale axis places 500 near the exact vertical midpoint where the title text is centered. All other text (title, other tick labels, legend, reference-line labels, region labels) is clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels flip to light ink/off-white and remain clearly legible against the dark background. Grid lines are subtle and visible. Region labels below the x-axis are legible in muted light-gray.
      Data: Data colors are identical to the light render — same brand-green scatter, lavender fit line, amber reference lines — confirming only chrome (not data color) adapts to theme. The pale safe-zone band becomes a very subtle dark-green tint appropriate for the dark surface.
      Legibility verdict: FAIL for the same element as the light render — the "500" y-tick label overlaps the rotated axis title in the same way (theme-independent layout defect, not a color/contrast issue). No dark-on-dark text failures observed elsewhere; all other text is comfortably legible.
