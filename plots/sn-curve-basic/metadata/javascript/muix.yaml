review:
  strengths:
  - Composes the chart from MUI X v9 building blocks (ChartsDataProvider, ChartsWrapper,
    ChartsSurface, LinePlot, ScatterPlot) so a scatter and a line series share one
    log-log coordinate system
  - Native ChartsReferenceLine for ultimate strength, yield strength and endurance
    limit, each labelled by name and value at the right end and told apart by dash
    pattern, readable in both themes
  - The Basquin fit is a real least-squares fit in log-log space over the finite-life
    specimens and stops at the computed knee on the endurance limit, so the sloping
    region and the plateau read at once
  - The low-cycle, high-cycle and infinite-life regions are plain bracket labels under
    the x axis, placed with useXScale/useDrawingArea at their real cycle bounds and
    kept off the data
  - Superscript decade tick labels (10³ … 10⁶) and a subtitle with n, the fit equation,
    R² and the knee give a precise engineering read
  - Item tooltips through ChartsTooltip add per-specimen inspection in the HTML view
  weaknesses:
  - 'Suggestion: write the subtitle''s exponent as a superscript (N⁻⁰·⁰⁸⁶) instead
    of the caret form N^−0.086, to match the superscript tick labels.'
  - 'Suggestion: the mandated title fills about 30 % of the width; a slightly larger
    title would give the header more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 across the whole canvas.
      Chrome: bold dark title "sn-curve-basic · javascript · muix · anyplot.ai", a grey subtitle with n = 24, 8 stress levels, Basquin fit S = 1252 · N^−0.086 (R² = 0.99) and the knee at N = 1.1 × 10⁶. Log x axis "Cycles to failure, N" with ticks 10³–10⁶, log y axis "Stress amplitude (MPa)" with ticks 400–800, subtle horizontal grid, legend at top right (Test specimens, Basquin fit). Three dashed reference lines in ink-soft (long dash at 760 MPa for ultimate strength, medium dash at 620 MPa for yield strength, dotted at 380 MPa for endurance limit), labelled at the right end. Under the x axis, bracket labels for low-cycle fatigue (up to 10⁴), high-cycle fatigue (10⁴ to the knee) and infinite life (past the knee). All text is dark and readable.
      Data: 24 green #009E73 specimen markers with page-coloured outlines, three per stress level from 700 down to 400 MPa, falling from about 7×10² to 6×10⁵ cycles. A purple palette[1] Basquin line runs through the middle of the scatter and ends where it meets the endurance limit. A few pairs at 500/450/420/400 MPa partly overlap (the spec permits this).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, subtitle, axis titles, ticks, legend text, reference-line labels and region labels all switch to light ink and are clearly readable. Grid is a subtle dark grey, reference lines are light grey dashes. No dark-on-dark text.
      Data: identical #009E73 markers and the same purple fit line as the light render. Only the chrome changes.
      Legibility verdict: PASS
