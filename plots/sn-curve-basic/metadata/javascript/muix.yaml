review:
  strengths:
  - Correct log-log Basquin power-law curve (straight line in log-log space, flattening
    at the endurance limit) - physically accurate S-N behavior
  - All three required reference lines present with descriptive labels and differentiated
    dash patterns for visual separation
  - Explicit font sizing throughout (title/axis/tick/legend/reference-line labels),
    fully legible in both light and dark renders
  - Correct Imprint palette usage, identical data colors across themes, theme-correct
    chrome in both renders
  - Realistic, domain-accurate fatigue data with correct physical ordering of material
    properties
  - Clean, deterministic, idiomatic MUI X ChartContainer composition combining scatter
    and line series
  weaknesses:
  - In the flat infinite-life region, the Basquin fit line visually merges with the
    Endurance Limit reference line - consider a slight visual differentiator (opacity,
    color nudge, or dash pattern) so the two remain distinguishable even where they
    coincide
  - Design Excellence relies on token-palette defaults without deeper bespoke refinement
    (e.g. no shaded safe zone below the endurance limit, no explicit region labeling
    for low-cycle/high-cycle/infinite-life zones called out in the spec notes)
  - Data storytelling could be strengthened with light annotation of the three fatigue
    regions along the x-axis to make the insight immediately obvious without reading
    the reference-line labels
