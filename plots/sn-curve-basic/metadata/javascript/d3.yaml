review:
  strengths:
  - Correct log-log S-N curve with all three required reference lines (Ultimate strength,
    Yield strength, Endurance limit) labeled inline instead of cluttering a separate
    legend
  - Custom superscript tick formatting on the log x-axis (10³, 10⁴, …) is a distinctive
    D3 touch that reads cleanly in both themes
  - Realistic AISI 4140 material properties with a correctly calibrated Basquin power-law
    fit that transitions to a flat endurance-limit asymptote beyond ~2×10⁶ cycles
  - 'Both renders are fully theme-correct: identical Imprint data colors (green markers,
    lavender fit line), readable chrome, warm off-white/near-black backgrounds'
  - Legend is dynamically positioned relative to the endurance-limit line so it never
    collides with data points or reference lines
  weaknesses:
  - A few coupon markers at the same stress level (650, 550, 500, 470, 440 MPa) sit
    close enough to visually merge into overlapping blobs — slightly wider jitter
    spread or a smaller marker radius for tightly clustered levels would improve individual-point
    legibility
  - Axis domain (spine) lines are kept on both axes rather than reduced further —
    acceptable per the L-shaped default, but leaves slightly more chrome than a maximally
    refined version
  - The spec's three named fatigue regions (low-cycle plastic / high-cycle elastic
    / infinite-life) are implied by the curve shape but never explicitly delineated
    or labeled
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "sn-curve-basic · javascript · d3 · anyplot.ai" in bold dark text, clearly visible. X-axis "Cycles to Failure, N" with log-scale superscript ticks (10³–10⁷), y-axis "Stress Amplitude, σ (MPa)" with linear-labeled log ticks (400–1,000). Three dashed gray reference lines labeled "Ultimate strength — 950 MPa", "Yield strength — 770 MPa", "Endurance limit — 430 MPa" — all readable. Subtle horizontal grid lines only.
      Data: First series (coupon test results) rendered as green (#009E73) circles with light-colored strokes; Basquin fit line rendered in lavender/purple (Imprint palette position 2). Legend bottom-right labels both series correctly.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light/white text, tick labels and reference-line labels in light gray — all clearly legible against the dark surface. Grid lines subtle and visible. No dark-on-dark failures observed.
      Data: Confirmed identical to light render — green (#009E73) markers and lavender fit line, unchanged across themes; only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark issues detected.
