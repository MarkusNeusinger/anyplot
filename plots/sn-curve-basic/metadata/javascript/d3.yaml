review:
  strengths:
  - 'Idiomatic log-log D3 implementation: d3.scaleLog on both axes with a clean custom
    tick formatter that renders proper superscript powers of ten (10³–10⁷) instead
    of raw exponent notation.'
  - All three required reference lines (Ultimate strength, Yield strength, Endurance
    limit) are present as labeled dashed horizontal lines at physically correct MPa
    values for AISI 4140 steel.
  - Basquin fit curve is a genuine calculated power-law regression (calibrated through
    two anchor points) that correctly transitions from the sloped fatigue region into
    a flat plateau at the endurance limit — this faithfully represents the low-cycle
    / high-cycle / infinite-life regions described in the spec.
  - 'Realistic, physically plausible data: 8 stress levels × 3 specimens with log-normal
    coupon-to-coupon scatter, deterministic LCG seed for reproducibility.'
  - Correct Imprint palette usage — data points use palette[0] (#009E73), fit line
    uses palette[1], theme tokens threaded through axis text/ticks/domain/grid for
    both light and dark renders.
  - Title format and axis labels are spec-compliant with units (σ in MPa).
  weaknesses:
  - 'Data/axis-domain bug: the x domain is hardcoded to [1e3, 1e7], but the 700 MPa
    stress level''s base cycle count is exactly 1e3 (basquinN1), and the jitter formula
    (jitterDecades in [-0.15, 0.15]) pushes roughly half of that level''s 3 specimens
    below 1e3 cycles — outside the plotted domain. Those circles render at negative/near-zero
    pixel x, spilling into the left margin and visibly overlapping the y-axis ''700''
    tick label in BOTH renders (looks like a garbled ''●⊘700'' cluster at the far
    left edge). Fix: either widen the x domain lower bound (e.g. to ~700 or via d3.extent(data,
    d => d.cycles) with padding) or clamp/regenerate the jitter so all data cycles
    stay within [1e3, 1e7].'
  - The Yield strength reference line (770 MPa) passes directly through the legend
    block ('Coupon test result' entry sits right on the dashed line) — not unreadable,
    but a distracting collision; move the legend to a location that doesn't intersect
    a reference line, or draw the legend behind a subtle background swatch/keep clear
    of the 770 MPa row.
  - The three fatigue life regions (low-cycle plastic, high-cycle elastic, infinite
    life) are only implied by the curve's shape; no visual distinction (shading/labels)
    separates them, though this is a soft nice-to-have rather than a hard spec requirement.
  - Y-axis tick formatting mixes SI-prefix style ('1k') with plain numbers ('900',
    '800' ...) from the d3 '~s' format — minor inconsistency, cosmetic only.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent with the Imprint light theme, not pure white.
      Chrome: Bold centered title "sn-curve-basic · javascript · d3 · anyplot.ai" in dark ink; x-axis "Cycles to Failure, N" labeled 10^3-10^7 with proper superscript formatting; y-axis "Stress Amplitude, σ (MPa)" labeled 400-1k (log scale) using d3 "~s" format; subtle horizontal-only gridlines; three dashed gray reference lines labeled "Ultimate strength — 950 MPa", "Yield strength — 770 MPa", "Endurance limit — 430 MPa". All chrome text is readable against the light background EXCEPT the leftmost y-axis tick label "700", which is partly obscured by a cluster of data-point circles that spill past the x=1e3 domain edge into the left margin (a real data/domain bug, not a theme issue).
      Data: Green (#009E73) circles for coupon test results, clustered at 8 stress levels with realistic scatter; a purple/violet (palette[1]) Basquin fit line running through the cloud and flattening at the endurance limit. Legend ("Coupon test result", "Basquin fit: σ = A·N^b") is present but its top entry sits directly on top of the yield-strength dashed line, causing a mild visual collision.
      Legibility verdict: FAIL — the "700" y-axis tick label is overlapped/garbled by out-of-domain data circles at the left edge.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent with the Imprint dark theme, not pure black.
      Chrome: Same title, axis labels, and reference lines as the light render, now rendered in light ink/inkSoft tones against the dark background — all clearly legible, no dark-on-dark failures observed for title/axis text.
      Data: Data colors are identical to the light render (green points, purple fit line, dashed gray reference lines) — only chrome flipped, as required.
      Legibility verdict: FAIL — same left-edge overlap bug as the light render: data circles for the 700 MPa level spill past the x=1e3 domain boundary and overlap the "700" y-axis tick label.
