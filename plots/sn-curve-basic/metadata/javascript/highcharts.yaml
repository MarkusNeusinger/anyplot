review:
  strengths:
  - Correct log-log scatter + Basquin fit-curve S-N chart with all three material-property
    reference lines (Ultimate Strength, Yield Strength, Endurance Limit), each with
    a distinct dash style and clear right-aligned inline label
  - Deterministic seeded data generation (fixed-seed LCG per the browser-runtime constraint)
    with a physically plausible Basquin power-law fit floored at the endurance limit
  - Correct Imprint palette usage (brand green for the data series, palette[1] lavender
    for the fit line) with fully theme-adaptive chrome — text, grid, axis lines, and
    legend all flip correctly between light and dark renders
  - Descriptive axis titles with units ('Stress Amplitude (MPa)', 'Cycles to Failure
    (N)'), correct mandated title format, and explicit font sizes set throughout
  weaknesses:
  - 'Y-axis auto-pads below the configured min: yAxis.min is set to 150 but the rendered
    axis baseline sits at the 100 MPa gridline (Highcharts'' default startOnTick behavior
    snapping to the next round tick), leaving roughly 300px (~17% of the plot height)
    of empty gridded space between the true data floor (~180-190 MPa) and the x-axis
    line. Set yAxis.startOnTick: false (and endOnTick: false if the top shows the
    same issue) so the configured min:150/max:700 is respected exactly and the vertical
    whitespace tightens.'
  - 'Overlapping scatter markers have no separating stroke: specimens that land at
    nearly identical (cycles, stress) values (e.g., the cluster near 90-110k cycles
    at 380 MPa, and near 400-600k cycles at 340 MPa) render as fused solid-green blobs
    with no visible boundary between individual points, hiding the specimen-to-specimen
    scatter the spec calls for. Add a light marker.lineColor (e.g. the theme background
    token) with lineWidth ~1.5 to the scatter marker style so overlapping specimens
    stay visually distinguishable, per the style guide''s ''white edge for definition,
    especially with overlapping points'' guidance.'
  - 'Data never reaches the low-cycle/plastic fatigue region: all 9 tested stress
    levels (180-380 MPa) sit below the yield strength (415 MPa), so the curve only
    shows the high-cycle/elastic and infinite-life regions, not the low-cycle/plastic
    region the spec explicitly calls out as one of the three characteristic S-N regions.
    Add 1-2 higher stress levels (e.g. 420-500 MPa, above yield) with correspondingly
    short cycle counts so all three regions appear in the scatter.'
  - 'No vertical gridlines: the style guide recommends grid lines on both axes for
    scatter plots, but only the y-axis draws gridlines here — add a subtle xAxis.gridLineColor
    (matching the y-axis token) for consistency.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "sn-curve-basic · javascript · highcharts · anyplot.ai" centered at top; dark-ink axis titles "Cycles to Failure (N)" (x, log scale, 2k-20M) and "Stress Amplitude (MPa)" (y, log scale, 100-700); soft-gray tick labels on both axes; subtle horizontal-only gridlines; legend ("Fatigue Test Data", "Basquin Fit") in soft-ink text at the bottom, close to the axis. Three horizontal reference lines in near-black ink (solid = Ultimate Strength 620 MPa, dashed = Yield Strength 415 MPa, dotted = Endurance Limit 180 MPa), each with a right-aligned label in soft-ink text — none overlap the data or each other.
      Data: Green (#009E73) scatter markers (fatigue test specimens) trending from ~380 MPa at ~90k cycles down to ~190 MPa near 20M cycles; several specimens overlap into fused blobs with no separating edge. A lavender/purple line (Basquin fit) runs through the scatter and flattens toward the endurance limit at high cycle counts.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as the light render with all chrome tokens flipped — title and axis titles in near-white ink, tick labels and legend in light soft-gray, gridlines and axis lines in a light muted tone, reference lines in near-white with the same solid/dashed/dotted styling and labels.
      Data: Data colors are identical to the light render — green scatter markers and the lavender/purple fit line are unchanged; only the chrome (background, text, grid, lines) flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures found (title, axis titles, tick labels, and reference-line labels all render in light tones with good contrast).
