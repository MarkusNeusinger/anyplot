review:
  strengths:
  - 'Complete S-N curve: log-log axes with superscript 10^n cycle ticks, three directly
    labeled reference lines, Basquin fit through the scatter and replicate specimens
    per stress level'
  - 'Physically consistent AISI 1045 data: endurance limit at half the UTS, and the
    fit meets it at 10^6 cycles where the infinite-life shading begins'
  - Clear hierarchy around the endurance limit (thicker long-dash line, bold label)
    with all reference labels set right of the data
  - Chrome tokens flip correctly between themes; data and reference colors stay identical
  - 'Idiomatic ggplot2: scale_*_log10 with scales::trans_format/math_format, annotate()
    for rect and text, modern linewidth='
  weaknesses:
  - 'VQ-07 (both): the endurance-limit line, its bold label and the infinite-life
    shading are drawn in #AE3030, the red anchor that means bad/loss/error, on the
    zone that is the safe design region, and the reference lines skip Imprint position
    4 → take the next canonical position #BD8233 for the endurance limit and its zone.
    Likely cause: IMPRINT[5] in the endurance geom_hline, its annotate("text") and
    annotate("rect").'
  - 'LM-01 (code): the data block builds df from bare column names and aes(x = cycles,
    y = stress) instead of the library prompt''s column constants, tibble with !!COL
    := and .data[[COL]] in aes() with labs() from the constants → follow that pattern.
    Likely cause: data.frame(stress = ...) |> mutate(cycles = ...) with hard-coded
    names.'
  - 'Suggestion: the reference-line labels at size 4.0 (~11 pt) read larger than the
    10 pt axis titles; about 3.5 would balance them.'
