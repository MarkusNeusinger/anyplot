review:
  strengths:
  - 'Full theme-adaptive chrome: light/dark backgrounds, ink tokens, spines, and terrain-ring
    alpha all correctly flip between renders, while data colors (start green, end
    red, sequential green-to-blue elevation path) stay identical across themes.'
  - 'Correct Imprint palette compliance: brand green #009E73 for the start marker
    (first categorical series), matte red #AE3030 (palette position 5) as the semantic
    end-point anchor, and the canonical two-stop sequential colormap (#009E73 -> #4467A3)
    for the elevation-coded path.'
  - 'Strong spec coverage: sequential waypoint connection via lines!, distinct start/end
    markers matching the spec''s own example (green circle / red square), an elevation
    color gradient along the path, direction-of-travel arrows, and GPS noise + smoothing
    (smooth_track) to mimic a realistically recorded track.'
  - 'Clean, reproducible, idiomatic Makie code: Random.seed!(42), correct canvas (3200x1800
    via resolution=(1600,900), px_per_unit=2), Figure/Axis/lines!/scatter!/Colorbar
    used correctly, colsize! for a well-proportioned colorbar column.'
  weaknesses:
  - The 'terrain basemap' is a set of unlabeled concentric ellipses around the loop
    centroid; without any contour value or peak label, a viewer may read them as decorative
    background rather than clear elevation/terrain context that the spec asks for.
    Consider a small elevation label near the innermost ring or center peak to make
    the terrain association explicit.
  - Title occupies only ~35% of the plot width at titlesize=20 -- comfortably readable
    but on the conservative side relative to the ~50-70% guideline; a modest bump
    (~24-26) would improve visual balance without risking overflow.
  - Design execution is solid (spines removed, subtle terrain rings, elevation-colored
    path) but not yet distinctive enough for top Design Excellence marks -- e.g. no
    callout for the summit/peak or trail distance/elevation-gain stat that would deepen
    the data storytelling.
  - Per-vertex line coloring and Colorbar usage are competent but fairly standard
    Makie techniques; nothing library-distinctive (e.g. a custom Makie recipe or advanced
    layout) to earn top Library Mastery marks.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: title "Alpine Loop Trail · map-route-path · julia · makie · anyplot.ai" in dark ink, clearly readable; "Longitude"/"Latitude" axis labels in dark ink, readable; tick labels in a softer gray, readable; left/bottom spines visible in soft gray, top/right spines removed.
      Data: loop-shaped GPS trail colored green-to-blue along an elevation gradient; green circle start marker (brand #009E73) on the right side of the loop; red square end marker (#AE3030) near the bottom, close to the start; gray triangular direction-arrows along the path pointing counterclockwise; faint concentric ellipse "terrain" rings around the loop's interior, subtle and non-intrusive; colorbar on the right labeled "Elevation (m)" with the same green-to-blue gradient and readable ticks.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: title and axis labels flip to light ink (near-white), clearly readable against the dark background; tick labels in a lighter gray, readable; terrain rings and spines rendered in a light, low-alpha gray, subtle but visible; no dark-on-dark text anywhere.
      Data: identical colors to the light render -- green start marker, red end marker, green-to-blue elevation path, colorbar gradient -- only the direction-arrow marker fill (INK_SOFT chrome token) and grid/terrain lines flip to a light tone for contrast, as expected since arrows are chrome, not data.
      Legibility verdict: PASS.
