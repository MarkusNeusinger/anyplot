review:
  strengths:
  - 'Correct route-path plot type: a continuous elevation-colored track (imprint_seq
    green→blue) with clear rotated-triangle direction-of-travel indicators and distinct
    start (green circle) / end (red square) markers, exactly matching the spec''s
    suggested convention'
  - 'Realistic GPS-track data generation: multi-harmonic radius wobble, injected measurement
    noise plus a rolling-window smoother, and a deliberately incomplete loop (closure_gap)
    so the trailhead and exit sit apart — mirrors a real recorded hike'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, all visible text flips ink tone correctly, first categorical series
    is exactly #009E73, continuous colormap is the correct green→blue imprint_seq
    for single-polarity elevation data'
  - Clean L-shaped spine, no grid, generous whitespace, and the canonical `{Descriptive
    Title} · {spec-id} · {language} · {library} · anyplot.ai` title format
  weaknesses:
  - 'CRITICAL — dead code / broken rendering: the summit diamond marker + "Peak ·
    X m" text (lines ~150-163), the two labeled terrain-ring elevation annotations
    (lines ~136-146), and the "Elevation gain: +X m" callout (lines ~166-172) are
    all present in the source but do NOT appear anywhere in either rendered PNG —
    verified by pixel-level inspection of plot-light.png and plot-dark.png at the
    exact data coordinates (loop centroid and top-left callout position both render
    completely blank in both themes, while the arrows and start/end markers using
    the same scatter!/text! APIs do render). Fix by diagnosing why these specific
    text!/scatter! calls silently fail to draw (check z-order relative to the later
    Colorbar/layout call, try an explicit zvalue/depth, or verify the diamond marker
    with strokewidth=0 isn''t a CairoMakie rendering edge case) — or remove the dead
    code entirely if it cannot be made to render; shipping ~40 lines that have zero
    visual effect is worse than omitting the feature.'
  - Because the ring labels never render, the faint terrain-contour ellipses read
    as unexplained decoration rather than a legible geographic/elevation basemap —
    this undermines the spec's 'include a geographic basemap' feature; resolves once
    the annotation bug above is fixed.
  - No legend explains the marker vocabulary (green circle = start, red square = end,
    gray triangle = direction of travel) — a viewer must infer these from context
    alone; add a compact legend or inline annotation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target, not pure white.
      Chrome: Title "Alpine Loop Trail · map-route-path · julia · makie · anyplot.ai" in dark ink, "Longitude"/"Latitude" axis labels and tick labels in dark/soft-dark ink, L-shaped spine (left+bottom only), no grid, colorbar labeled "Elevation (m)" with dark ticks/label. All clearly readable.
      Data: Route path colored via green(#009E73)->blue continuous gradient (imprint_seq) tracing an open loop; a green circle marks the start, a red square (#AE3030) marks the end, six gray rotated triangles show direction of travel along the path. Faint unlabeled concentric ellipses (terrain rings) surround the loop's interior, which is otherwise empty — the intended summit diamond marker, "Peak · X m" label, ring elevation labels, and "Elevation gain" callout text (all present in the source code) do NOT appear anywhere in this render; verified by cropping/pixel-inspecting the exact data coordinates where they should sit.
      Legibility verdict: PASS (all rendered text is legible; the issue is that several intended text/marker elements never render at all, not that they render illegibly).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target, not pure black.
      Chrome: Same title/axis/tick text now in light ink (#F0EFE8 / #B8B7B0), spine and colorbar ticks correctly flipped to light tones. All clearly readable, no dark-on-dark failures.
      Data: Identical data colors to the light render — green start circle, red end square, gray direction arrows, and the same green->blue elevation gradient on the path — confirming the Imprint data colors are theme-invariant. Same missing-elements issue as the light render: the summit marker, peak label, ring labels, and elevation-gain callout are absent from this render too, confirmed by the same pixel-level crop check.
      Legibility verdict: PASS (visible text is fully legible in dark theme; same missing-annotation defect applies to both themes equally, ruling out a theme-specific chrome bug).
