review:
  strengths:
  - coord_fixed(ratio = 1 / cos(mean latitude)) computes the geographic aspect from
    the data instead of a hard-coded ratio
  - Elevation gradient uses the Imprint sequential ramp with separate light/dark stops
    for marks, explained by a titled color bar with units
  - Sparse closed arrows via geom_segment + arrow() point along travel and leave the
    line visible; ink-colored so they flip with the theme
  - Start/End told apart by both shape (circle/square) and color, with page-colored
    halos lifting them off the route
  - Full theme-adaptive chrome; axis titles carry units (°, m)
  weaknesses:
  - 'SC-02 (both): no geographic basemap behind the route (C5 asks for streets, terrain
    or satellite, quieter than the route) → draw a muted basemap layer such as coastline/land
    polygons fitted to the route extent. Likely cause: the plot has only geom_path,
    geom_segment and geom_point on a blank panel.'
  - 'Suggestion: the start marker''s #009E73 also appears as the low-elevation color
    of the ramp on both renders, so the start circle blends into low sections; a slightly
    larger halo would set it apart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "Coastal Cycling Route · map-route-path · r · ggplot2 · anyplot.ai" in dark ink; axis titles "Longitude (°)" and "Latitude (°)", tick labels -121.925…-121.825 and 36.59…36.65 in soft ink; subtle grid; left/bottom axis lines; two boxed legends on the right (Start circle / End square, and an "Elevation (m)" color bar 20–80).
      Data: a thick route from a green #009E73 start circle at the upper left, dropping south through an S-curve to a red #AE3030 end square at the right; colored green→blue→navy by elevation; six black closed arrows along the line point in travel direction. No basemap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles and ticks flip to light ink; grid subtle; legend boxes on the elevated dark surface with light text. No dark-on-dark text.
      Data: same start #009E73 and end #AE3030 markers as the light render; the elevation ramp uses its dark stops (dark green→green→pale blue); arrows flip to light ink. Brand green clearly visible.
      Legibility verdict: PASS
