review:
  strengths:
  - coord_fixed(ratio = 1 / cos(mean latitude)) derives the geographic aspect from
    the data
  - Elevation gradient with separate light/dark stops for marks, explained by a titled
    color bar with units
  - Start and End told apart by shape and color with page-colored halos, merged into
    one legend
  - Full theme-adaptive chrome with explicit font sizes; readable in both renders
  weaknesses:
  - 'SC-02 (both): no geographic basemap behind the route (C5 asks for streets, terrain
    or satellite, quieter than the route) → draw a muted land/sea basemap layer fitted
    to the route''s extent. Likely cause: the plot has only geom_path, geom_segment
    and geom_point on a blank panel.'
  - 'SC-02 (both): three of the six direction arrows (at waypoints 20, 100 and 140)
    point against or across the direction of travel (C4) → every arrow points from
    the start toward the end. Likely cause: each geom_segment spans a single step
    arrow_i → arrow_i + 1, so the 0.00006° jitter outweighs the step between waypoints;
    span several waypoints (e.g. arrow_i - 3 to arrow_i + 3).'
  - 'VQ-07 (both): the elevation ramp uses stops the style guide no longer lists (light
    #009E73 → #4467A3 → #002850 at 0/0.338/1, dark #007755 → #009E73 → #CDD9FF at
    0/0.32/1) → the current imprint_seq marks stops (light #009E73 → #024582 → #351E45
    at 0/0.687/1, dark #6F7E20 → #009E73 → #CDD9FF at 0/0.21/1). Likely cause: the
    SEQ_MARKS block.'
  - 'Suggestion: a short scale bar (e.g. 2 km) would give the route''s roughly 11
    km extent a sense of distance.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel; no basemap.
      Chrome: title "Coastal Cycling Route · map-route-path · r · ggplot2 · anyplot.ai" in dark ink; "Longitude (°)" / "Latitude (°)" axis titles and ticks in soft ink; subtle grid; left/bottom axis lines; Start/End legend and "Elevation (m)" color bar (20–80) in framed boxes on the right. All readable.
      Data: thick route from a #009E73 start circle at the upper left through an S-curve to a #AE3030 end square at the right, colored green → blue → navy by elevation; six black closed arrows on the line, three of which point against or across the direction of travel.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; no basemap.
      Chrome: title, axis titles and ticks in light ink; grid subtle; legend boxes on the elevated dark surface with light text. No dark-on-dark text.
      Data: start #009E73 and end #AE3030 identical to light; elevation ramp dark green → green → pale blue; arrows in light ink. Brand green clearly visible.
      Legibility verdict: PASS
