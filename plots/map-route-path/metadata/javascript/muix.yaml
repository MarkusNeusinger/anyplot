review:
  strengths:
  - Correct, idiomatic MUI X composition API (ChartContainer + LinePlot/ScatterPlot
    + hooks) with a continuous imprint_seq color-mapped scatter accurately encoding
    time progression
  - Start (green circle) / End (red square) markers exactly match the spec's own suggested
    convention, implemented via a hook-positioned custom SVG overlay at true chart
    coordinates
  - Honest, well-documented trade-off note about the basemap limitation instead of
    silently omitting it or faking tile rendering
  - Realistic, geographically plausible Amsterdam commute route, monotonic by construction
    so the path never self-crosses
  - Theme-correct chrome and identical data colors across both light and dark renders
  weaknesses:
  - 'The compass rose is pinned to a fixed pixel position in the drawing area''s top-right
    corner, which collides with the End marker because the route''s endpoint is, by
    construction, always near that same corner. In both themes, the compass''s arrowhead
    and ''N'' label are drawn under/merged with the End marker, leaving only a meaningless
    bare arrow shaft. Fix: derive the compass position from (or offset it away from)
    the actual endpoint pixel position, or move it to a corner not used by the route''s
    termination.'
  - Scatter markers (size 7) sit close enough together at 140 points that adjacent
    path points visually clump into overlapping beads rather than reading as a crisp
    line - consider a slightly smaller marker size or thinning the point count for
    a cleaner path.
  - No basemap or geographic reference beyond the lon/lat graticule (acknowledged
    MUI X limitation, but still a partial gap versus the spec's explicit request for
    street/terrain/satellite context).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "map-route-path · javascript · muix · anyplot.ai" centered top, subtitle caption about missing basemap below it, "Longitude (°)" / "Latitude (°)" axis labels with 3-decimal tick labels, subtle graticule grid, discrete "Start"/"End" legend top-left, continuous "Early"/"Late" color legend bottom-left. All dark ink text, fully readable against the cream background.
      Data: Route path drawn as overlapping circular markers connected by a thin gray line, colored with the imprint_seq green-to-blue gradient encoding time progression. Green circle marks Start (#009E73), red square marks End (#AE3030). Defect: a small gray compass-rose arrow (intended to show "N") sits in the same top-right corner as the End marker; its arrowhead and "N" label are hidden behind/merged into the red End square, leaving only a stray vertical arrow shaft visible.
      Legibility verdict: PASS (all text legible; the compass defect is a layout/overlap issue, not a legibility issue)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same composition as light render, with light gray/white title, axis labels, and tick labels - all clearly readable against the dark background. No dark-on-dark failures observed.
      Data: Route path, gradient, Start/End marker colors are pixel-identical to the light render, confirming only chrome adapted to the theme. The same compass-rose/End-marker collision reproduces identically here.
      Legibility verdict: PASS (all text legible; compass defect reproduces identically to the light render)
