review:
  strengths:
  - Composes the map from ChartsContainer with custom SVG children that read the chart's
    own scales through useDrawingArea, useXScale, useYScale and useZColorScale, so
    basemap, route, markers and the linear lon/lat axes share one coordinate system
  - Route segments are colored by a continuous zAxis colorMap built from the Imprint
    imprint_seq stops (t.seq) and explained by an 'Elapsed time share' color bar with
    Early/Late ends
  - 'Ground-true aspect: the axis extents are derived from the data with a cos(mean
    latitude) correction, so the route is not stretched and the view is fitted to
    its extent'
  - Start (brand-green circle) and end (red square) markers differ in both shape and
    color, and the legend names both
  - Sparse chevrons every 8 waypoints show the direction of travel without hiding
    the line; a page-colored halo under the path keeps it readable over grid and basemap
  - Basemap of IJ waterfront, canal ring, Amstel and Vondelpark at low opacity stays
    quieter than the route in both themes
  - 'Plausible, neutral data: a 61-waypoint Amsterdam walking route between real landmark
    coordinates (Dam Square, Rijksmuseum, Waterlooplein, Centraal), generated deterministically
    with a fixed-seed LCG'
  - skipAnimation set, chrome from ANYPLOT_TOKENS so both themes are correct
  weaknesses:
  - 'SC-02 (both): the basemap is a schematic of water areas, canal arcs and one park
    polygon with no streets, terrain or imagery, so the ''A good version shows: a
    geographic basemap of streets, terrain or satellite imagery'' property is only
    partly met → add a simplified street layer (main streets such as Damrak, Rokin,
    Leidsestraat, Raadhuisstraat) as thin low-opacity ink lines under the route. Likely
    cause: the Basemap component draws only WATER_AREAS, CANAL_RING_RADII, RIVERS
    and PARKS.'
  - 'Suggestion: the ''Elapsed time share'' color bar is hand-drawn with an SVG linearGradient;
    MUI X''s ContinuousColorLegend bound to the ''seqAxis'' zAxis could show the same
    scale natively.'
  - 'Suggestion: the start and end names appear both as bold callouts on the map and
    as legend entries; the legend could name the marker roles only (''Start'', ''End'')
    to avoid repeating the callouts.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: centered bold title "map-route-path · javascript · muix · anyplot.ai"; axis titles "Longitude (°E)" and "Latitude (°N)"; tick labels 4.850°–4.925° and 52.354°–52.382° in soft ink; subtle grey grid; caption bottom-left naming WGS 84 and the simplified basemap; compass rose with "N" top-right; right-side legend panel (Route endpoints, Travel direction, 61 waypoints, Basemap swatches, Elapsed time share color bar 0.00 (Early)–1.00 (Late)). All text dark and readable.
      Data: route line graded from brand green #009E73 (start) through teal to blue (end) with small waypoint dots, black chevrons pointing along travel, larger green circle at Dam Square and red square at Amsterdam Centraal with bold callouts; landmark labels Vondelpark West, Rijksmuseum, Waterlooplein, Jordaan. Basemap: grey-blue IJ waterfront and Oosterdok, five concentric canal arcs, Amstel river, pale-green Vondelpark — all quieter than the route.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks, legend, caption and compass in light ink; grid subtle grey; no dark-on-dark text.
      Data: route gradient, start green circle, end red square and waypoint dots identical to the light render; chevrons flip to light ink with dark outline; basemap water and park fills dark-tinted and quiet but visible.
      Legibility verdict: PASS
