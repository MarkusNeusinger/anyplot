review:
  strengths:
  - Composes the map with ChartsContainer + a zAxis continuous colorMap and reads
    it back through useZColorScale, so the time gradient along the path is driven
    by MUI X's own color-scale machinery rather than hand-interpolated colors
  - Axis domains are fitted to the route with a cos(latitude) correction, so the lon/lat
    graticule keeps true ground proportions instead of stretching the route
  - Start (green circle) and end (red square) markers are distinct by both shape and
    color and are named in the legend and on the map
  - Elapsed-time gradient from the Imprint sequential ramp is explained by a labelled
    color bar (Early → Late)
  - Real Amsterdam walking-tour coordinates (Dam Square, Rijksmuseum, Waterlooplein,
    Centraal) with deterministic LCG jitter give a plausible GPS track
  - Page-colored halos under the path and stroke-outlined labels keep the route and
    text legible over the grid in both themes
  weaknesses:
  - 'AR-09, VQ-05 (both): the legend entry "Travel direction (61 waypoints)" runs
    past the right canvas edge — the closing ")" is missing and the final "s" touches
    the border → keep the whole legend panel at least ~16 px inside the 1600 px canvas
    (about −60 px on the entry''s right end). Likely cause: MARGIN.right = 260 with
    the legend at legX = left + width + 24 while the 14 px label is ~250 px wide;
    widen MARGIN.right to ~320 or shorten the label (e.g. move the waypoint count
    to its own line).'
  - 'SC-02 (both): no geographic basemap — only the lon/lat graticule — although the
    Notes and the ''A good version shows'' bullet ask for streets, terrain or satellite
    context → draw a quiet basemap layer under the route (e.g. simplified canal/water
    and park polygons or street lines as low-contrast SVG paths from t.grid/t.elevatedBg).
    Likely cause: RouteOverlay renders only the route; the caption substitutes a sentence
    for the basemap.'
  - 'VQ-03 (both): the direction chevrons are ~13 px, filled in the same color as
    the line underneath and outlined in the page color, so they read as small notches
    rather than arrows → make them visibly larger (~18–20 px) or contrast them with
    the line (ink fill, or a page-colored fill with line-colored outline). Likely
    cause: polygon points "7,0 -6,-5.5 -3,0 -6,5.5" with fill={p.color}.'
  - 'VQ-02 (both): the "Rijksmuseum" label''s right end abuts the route line and its
    waypoint dot at about (4.884°, 52.3595°) → clear the line by at least 4 px (+6
    px). Likely cause: the fixed dx = −14 / dy = +16 label offset for points below
    centerLat left of centerLon.'
  - 'Suggestion: the landmark labels could carry a small leader or sit consistently
    on the outside of the loop so they read as a set.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 throughout.
      Chrome: bold dark title "map-route-path · javascript · muix · anyplot.ai" centered on top; Latitude (°N) / Longitude (°E) axis titles and degree-formatted ticks in dark ink; subtle grey lon/lat graticule; compass rose top-right of the plot area; right-hand legend panel (Route endpoints, Travel direction, Elapsed time share color bar); caption below the x axis. The legend entry "Travel direction (61 waypoints" is chopped at the right canvas edge — the ")" is missing.
      Data: a 61-waypoint route from a #009E73 start circle (Dam Square) south-west to Vondelpark, east past Rijksmuseum to Waterlooplein, north to Jordaan and east to a red end square (Amsterdam Centraal); line colored by elapsed time from green to blue, small waypoint dots, landmark labels, small direction chevrons on the line.
      Legibility verdict: PASS for contrast; FAIL for the clipped legend entry (AR-09).

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks, legend and landmark labels flip to light ink and are clearly readable; no dark-on-dark text; grid subtle grey. Same right-edge clipping of the legend entry.
      Data: route gradient, start green, end red and waypoint colors identical to the light render; only chrome flipped.
      Legibility verdict: PASS for contrast; FAIL for the clipped legend entry (AR-09).
