review:
  strengths:
  - Idiomatic use of the MUI X composition API (ChartContainer + LinePlot + ScatterPlot
    + multi-axis) instead of the basic wrapper components
  - Distinctive zAxis continuous colorMap encodes sequence/time progression along
    the path with a matching ContinuousColorLegend (min/max labeled Start/End)
  - Deterministic LCG-seeded synthetic Amsterdam commute route with a monotonic-longitude
    construction that guarantees no self-crossing, reading as an organic, realistic
    GPS track
  - Explicit font sizing (title 22px, axis label 16px, tick label 14px) that stays
    legible in both themes with no overlap or clipping
  - 'Theme-adaptive chrome is correct in both renders: warm off-white/near-black backgrounds,
    readable ink-colored text, subtle 15%-opacity grid'
  - 'First categorical series (Start) is brand green #009E73; End uses the matte-red
    semantic anchor, a sensible semantic choice for a route terminus'
  weaknesses:
  - No geographic basemap (streets/terrain/satellite) is present — the spec's Notes
    explicitly ask for one, and without it the plot reads as a plain lon/lat line-scatter
    rather than a map with spatial context; since MUI X Charts is an SVG chart library
    with no tile-layer support and network/CDN fetches are forbidden, consider at
    least adding a light neighborhood/coastline reference cue or explicitly documenting
    the limitation, and evaluate whether a subtle static graticule/annotation can
    stand in for the missing basemap
  - Start/end markers are both circles; the spec's example calls for a green circle
    (start) and a red square (end) — consider giving the End marker a different MUI
    X marker shape (or an annotation) so the two roles are distinguishable by shape
    as well as color, not just color and size
  - The ContinuousColorLegend uses 'Start'/'End' as its min/max labels, which duplicates
    the wording of the point-marker legend (also 'Start'/'End') even though the two
    encode different things (a sequence gradient vs. two discrete waypoints) — rename
    the colorbar labels (e.g. 'Early' / 'Late' or 'First waypoint' / 'Last waypoint')
    to avoid reader confusion
  - No direction arrows along the path — optional per the spec, but would strengthen
    the sense of travel direction beyond the color gradient alone
  - Line marker size (5px) for the ~140 mid-density waypoints is on the small side;
    a slightly larger marker would read better at both desktop and mobile widths without
    crowding
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "map-route-path · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. "Longitude (°)" and "Latitude (°)" axis titles and numeric tick labels (e.g. 4.868–4.908, 52.357–52.376) are dark and fully readable against the light background. A subtle light-gray grid (both axes) is visible but not competing with the data. Two legends are present: a top-left point legend ("Start" green square swatch, "End" red square swatch) and a bottom-left horizontal color-gradient legend bar (green→blue) labeled "Start"/"End".
      Data: A continuous line connects ~140 waypoints tracing a route from the bottom-left (~4.868, 52.358) to the top-right (~4.907, 52.376) of the plot. Points are colored on a green-to-blue gradient along the sequence (imprint_seq colormap), with a large green circle marking the start and a large red circle marking the end. The path shows a smooth, organic S-curve with small lateral wiggles, plausible for a real cycling route through a city.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: The same title, axis titles, and tick labels now render in light/off-white ink, clearly legible against the dark background. The grid lines are a subtle light gray at low opacity, visible but unobtrusive. Both legends (point legend top-left, color-gradient legend bottom-left) render with light text labels on the dark surface.
      Data: The route line and its green-to-blue gradient markers are pixel-identical in hue to the light render — same color path, same start (green) and end (red) marker positions and sizes — confirming only chrome (background/text/grid) flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly visible against the dark background, and the brand green/matte-red markers remain vivid on both surfaces.
