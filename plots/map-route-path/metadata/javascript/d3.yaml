review:
  strengths:
  - 'Idiomatic d3-geo usage: geoMercator + fitExtent for the projection, geoPath for
    rendering, geoGraticule for the reference grid, and geoCircle to draw true great-circle
    elevation-contour rings that stay undistorted under the projection'
  - 'Correct Imprint palette usage: imprint_seq (interpolateRgbBasis on t.seq) for
    the single-polarity elevation gradient, brand green (#009E73, palette[0]) for
    the Start marker, matte red (palette[4]) for the Finish marker — a legitimate
    semantic-exception assignment matching the spec''s own ''green start / red end''
    convention'
  - 'Thoughtful cartographic chrome: north arrow, a distance scale bar computed from
    real geodesic spacing, direction arrows oriented to the local path tangent, and
    an elevation legend with units (''Elevation (m)'')'
  - Fully deterministic, seeded data generation (small fixed-seed LCG) producing a
    physically plausible switchback mountain-trail profile with realistic distance/elevation-gain
    ratios
  - Theme-adaptive chrome correctly threaded through every text and stroke element;
    data colors (route gradient, Start/Finish markers) are pixel-identical between
    light and dark renders — only chrome flips
  - Title correctly formatted as '{Descriptive Title} · map-route-path · javascript
    · d3 · anyplot.ai' and fontsize-scaled via the length-proportional formula so
    the longer descriptive+mandated title still fits without overflow
  weaknesses:
  - Contour-ring elevation labels ('2311 m', '1611 m') render at 11px, noticeably
    smaller than the rest of the chrome (13-15px) — bump for better mobile legibility
  - No literal basemap imagery (streets/terrain/satellite) as the spec notes suggest;
    the graticule + abstract elevation-contour rings substitute for spatial context,
    a reasonable workaround given D3's offline/no-fetch/no-CDN constraint, but worth
    flagging as not a literal basemap
  - Two small helper functions (rand(), haversineM()) deviate slightly from the strict
    KISS 'no functions' ideal, though they are minimal and necessary for deterministic
    randomness and geodesic distance calculation
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Backcountry Trail Traverse · map-route-path · javascript · d3 · anyplot.ai" in bold dark ink, subtitle and stats line in softer dark gray, both clearly legible. Map panel outlined with a thin light-gray border; lon/lat graticule and dashed elevation-contour rings are subtle and visible without competing with the route. North arrow, "N" label, and "1 km" scale bar are legible in the bottom-left margin. Elevation legend ("Elevation (m)") with tick labels (2400...1600) is fully readable to the right of the map.
      Data: Route line uses the imprint_seq gradient (brand green #009E73 near low elevation transitioning to Imprint blue #4467A3 near the peak), identical hue progression to the dark render. Start marker is a brand-green circle, Finish marker is a matte-red square — both with labeled text above them. Small triangular direction arrows are placed along the path, oriented to the local tangent.
      Legibility verdict: PASS — all text (title, subtitle, stats, contour labels, legend, Start/Finish labels, N/scale-bar labels) is dark-on-light and clearly readable; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, and stats line render in light/off-white text, clearly legible against the dark background. Map panel border, graticule, and dashed contour rings remain subtle but visible in a lighter gray tone appropriate for the dark theme. North arrow, "N" label, scale bar, and elevation legend text are all light-colored and readable.
      Data: Route gradient colors are identical to the light render (same brand-green-to-blue progression) — confirming only chrome flipped, not data colors. Start (green circle) and Finish (red square) markers are unchanged in hue from the light render, with light-colored outline strokes for definition against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, label, tick, and annotation is clearly visible against the near-black surface. Brand green is still fully legible on the dark surface.
