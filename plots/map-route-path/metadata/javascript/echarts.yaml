review:
  strengths:
  - 'Faithfully matches the spec''s exact suggestion: brand-green circle for Start,
    matte-red square for Finish, continuous smoothed route line, elevation color gradient,
    direction arrows, and a geographic basemap silhouette for spatial context — plus
    zoom/pan enabled via dataZoom.'
  - 'Excellent data storytelling: the route line uses the Imprint imprint_seq sequential
    colormap (correct choice for single-polarity elevation data) so the Rocky Mountain
    climb visibly pops as blue against the green lowland legs — the viewer immediately
    sees the terrain profile of the journey.'
  - 'Realistic, well-researched data: real TransAmerica Bicycle Trail waypoints with
    factually plausible elevations (e.g. Hoosier Pass CO ~11,542 ft), GPS noise simulated
    with a seeded LCG and cleaned via a 3-point moving average — deterministic and
    reproducible.'
  - 'Clean palette discipline: Start marker uses palette[0] (#009E73), Finish uses
    palette[4] (matte red) as an intentional semantic exception matching the spec''s
    own color suggestion, and both renders keep identical data colors with fully theme-correct
    chrome.'
  weaknesses:
  - Direction-arrow triangles use a muted gray-blue tone at modest size/opacity (symbolSize
    15, opacity 0.8) — they read faint against the route line, especially once the
    PNG is scaled down to mobile width; consider a slightly larger size or stronger
    contrast so travel direction stays legible at small sizes.
  - The hand-simplified US coastline polygon (explicitly disclaimed in a code comment
    as a low-vertex approximation) reads visibly distorted around Florida and the
    Great Lakes region — since it's the plot's only spatial-context cue, a few more
    vertices in those areas would make the silhouette read more convincingly as the
    US.
  - The whitespace margin between the route's rightmost point and the plot's right
    edge (further padded by the floating visualMap legend) is noticeably larger than
    the margin on the left side of the route — tightening the x-axis max or repositioning
    the legend would balance the composition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "TransAmerica Bicycle Trail · map-route-path · javascript · echarts · anyplot.ai" centered at top in dark ink, descriptive subtitle below in secondary gray. Longitude/Latitude axis titles and °W/°N tick labels all in soft dark gray, clearly legible. Gridlines are faint and subtle. Right-side vertical colorbar labeled "High elevation (ft)" / "Low elevation (ft)" is fully visible, not clipped.
      Data: A continuous route line runs from a green circle marker ("Start", Astoria OR) across the country to a red square marker ("Finish", Yorktown VA). The line is colored via the imprint_seq colormap (#009E73 → #4467A3) tracking elevation — it turns blue through the Rocky Mountain / Continental Divide section and returns to green across the lowland plains and East Coast. Small gray-blue triangle markers along the line indicate travel direction. A light-gray polygon silhouette of the continental US sits behind the route for geographic context.
      Legibility verdict: PASS — all text (title, subtitle, axis titles, tick labels, colorbar labels, Start/Finish labels) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle now rendered in light off-white / light gray, fully readable. Axis titles and tick labels in light gray. Gridlines faint but visible against the dark surface. Colorbar and its labels render in light text, not clipped.
      Data: Route line, Start (green circle) and Finish (red square) markers, and direction-arrow triangles are pixel-identical in color to the light render — only the chrome (background, text, grid, landmass fill) flipped to the dark palette. The landmass silhouette is now a dark charcoal gray, still distinguishable from the near-black background.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; all chrome text and data elements remain clearly visible.
