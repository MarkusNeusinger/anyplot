review:
  strengths:
  - 'Factually accurate real-world data: TransAmerica Bicycle Trail waypoints with
    elevations matching actual USGS figures (e.g. Hoosier Pass ~11,542 ft, Togwotee
    Pass ~9,658 ft)'
  - 'Perfect Imprint palette use: brand green (#009E73) for Start, matte red (#AE3030)
    for Finish as the semantic exception, imprint_seq gradient (green to blue) for
    the single-polarity elevation encoding'
  - 'Rich, spec-aligned feature set: sequence-ordered path built from noisy simulated
    GPS fixes then smoothed with a moving average, bearing-rotated direction arrows,
    distinct start/end markers, and a simplified basemap silhouette for geographic
    context'
  - Theme-adaptive chrome is correct and identical data colors across both light and
    dark renders
  - Clean, deterministic (fixed-seed LCG), KISS-structured code with no fake interactivity
  weaknesses:
  - Spec notes 'For interactive libraries, enable zoom and pan to explore route details'
    — no dataZoom/toolbox was added despite echarts and the HTML output supporting
    it
  - xAxis interval=10 does not evenly divide the -128..-66 range, so echarts adds
    a boundary tick and renders '68°W' and '66°W' crowded close together near the
    right edge
  - Title occupies only ~48% of the plot width, under the 50-70% guideline (not an
    overflow violation, just a bit small for the available space)
  - All four axis lines form a closed box frame around the map area rather than the
    default L-shaped (bottom+left) frame, reading closer to a library default than
    a deliberately refined chrome choice
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "TransAmerica Bicycle Trail · map-route-path · javascript · echarts · anyplot.ai" and subtitle are dark ink, clearly readable. Longitude/Latitude axis titles and °W/°N tick labels are soft dark gray, all legible. Grid lines are subtle warm-gray, visible but not competing with data. A light-gray simplified US landmass silhouette sits behind the route for geographic context.
      Data: Route line runs from a green circle "Start" marker (Astoria, OR) to a red square "Finish" marker (Yorktown, VA), colored along its length by a green-to-blue gradient (imprint_seq) keyed to elevation via the vertical color-scale legend on the right ("High elevation (ft)" / "Low elevation (ft)"). Muted purple-gray triangle markers along the path are rotated to show travel direction. First data color is the brand green #009E73 as required.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues. Minor: the x-axis tick labels "68°W" and "66°W" render close together near the right edge (crowded, not overlapping).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, axis titles, and tick labels all flip to light off-white/gray tones and remain fully legible against the dark background. No dark-on-dark text anywhere. The landmass silhouette becomes a subtle dark-gray fill, still distinguishable from the page background. Grid lines remain subtle.
      Data: Route gradient, Start (green) and Finish (red) markers, and direction arrows are pixel-identical in hue to the light render — confirming only chrome (not data colors) flips between themes. Brand green reads clearly on the dark surface.
      Legibility verdict: PASS — all text and data elements are readable in the dark theme; no dark-on-dark failures observed.
