review:
  strengths:
  - 'Correct semantic palette use: the start marker literally uses palette[0] (#009E73,
    brand green) and the finish marker uses palette[4] (#AE3030, matte red), exactly
    matching the spec''s suggested "green circle for start, red square for end" convention.'
  - Continuous pace-along-route encoding via Chart.js's per-segment segment.borderColor
    callback interpolating the correct imprint_seq two-stop gradient (t.seq), paired
    with a hand-drawn gradient legend that translates color back to km/h — well beyond
    a flat single-color line.
  - 'Realistic, deterministic data pipeline: fixed-seed LCG, a Naismith''s-rule-style
    pace model that slows on climbs and speeds up on descents, 3-point moving-average
    smoothing of noisy raw GPS coordinates (matching the spec''s "apply line smoothing"
    note), and evenly spaced direction-of-travel arrow markers.'
  - 'Both renders are clean and fully theme-adaptive: correct #FAF8F1/#1A1A17 backgrounds,
    no clipped or dark-on-dark/light-on-light text, subtle grid, and no collisions
    between the pace legend, direction arrows, terrain basemap, and route markers.'
  weaknesses:
  - No zoom/pan interactivity on the interactive Chart.js render — the spec explicitly
    asks interactive libraries to "enable zoom and pan to explore route details."
    This is achievable with plain wheel/drag listeners that update scales.x/y min/max
    and call chart.update(), with no external plugin needed, so it's a feasible gap
    rather than a library limitation.
  - The terrain-contour basemap substitute (nested gray ellipses around the elevation
    peak) has no caption, legend entry, or scale, so a viewer unfamiliar with topographic-map
    conventions may read it as arbitrary decorative shapes rather than an elevation
    basemap — a short caption like "Elevation contours (relative)" would make the
    visual metaphor legible on its own.
  - 'Structure leans past minimal KISS: four helper functions (rand, hexToRgb, paceColor,
    project) plus three separate plugin objects (terrainPlugin, directionArrowsPlugin,
    paceLegendPlugin) — justified by the feature set, but more abstraction than the
    simplest possible top-to-bottom script.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "Sierra Ridge Trail Pace · map-route-path · javascript · chartjs · anyplot.ai" in dark ink, clearly legible; "Start"/"Finish" legend swatches below the title; "Longitude"/"Latitude" axis titles and degree-formatted tick labels in dark/soft-dark ink, all crisp; subtle light-gray gridlines; nested gray terrain-contour ellipses around the trail's high point provide muted basemap context without competing with the route.
      Data: Route line uses a teal-to-blue gradient (imprint_seq, #009E73 -> #4467A3) keyed to hiking pace, with darker gray direction arrows along the path; start marker is a green circle (palette[0], #009E73) and finish marker is a red square (palette[4], #AE3030), both with a light halo border for contrast; a hand-drawn "Pace (km/h)" gradient legend sits in the bottom-left, isolated from the route and terrain rings.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title, legend, and axis chrome now rendered in light ink/white against the dark surface, fully legible; gridlines are a faint light gray, still visible but unobtrusive; the terrain-contour ellipses flip to a lighter translucent gray so they remain visible on the dark surface.
      Data: Route gradient, direction arrows, and start/finish marker colors are pixel-identical to the light render (#009E73 -> #4467A3 path, #009E73 start, #AE3030 finish) — confirms only chrome flipped, not data colors. The pace gradient legend text/labels are rendered in light ink and remain legible.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, tick label, and legend item is clearly visible against the dark background.
