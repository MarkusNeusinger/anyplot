review:
  strengths:
  - 'Correct route-path plot type: 140 waypoints connected in sequence order as a
    single continuous trail, with visually distinct start (green circle) and finish
    (red square) markers matching the spec''s exact suggestion.'
  - Elapsed-time color gradient (brand green to blue) along the path, built from the
    Imprint imprint_seq tokens (t.seq[0] -> t.seq[1]) and split across 9 line-segment
    series - a thoughtful, spec-aligned encoding of time progression that goes beyond
    a flat single-color line.
  - 'Theme-adaptive chrome is correct in both renders: warm off-white/near-black backgrounds,
    readable ink-colored text, subtle grid, and identical data colors between light
    and dark.'
  - Title font size is dynamically scaled down for the long descriptive+mandated title
    string, avoiding overflow or clipping while staying comfortably legible.
  - 'Realistic, neutral, well-scaled data: a named real-world location (Bear Lake
    trailhead, Rocky Mountain National Park) with plausible coordinate deltas for
    a several-kilometer hiking trail.'
  - Deterministic LCG-seeded synthetic data generation keeps the plot reproducible
    without any network fetch.
  weaknesses:
  - 'Tooltip formatter uses `this.point.index`, which resets to 0 at the start of
    each of the 9 line-segment series - hovering shows repeated ''Waypoint 0..N''
    labels per segment instead of the true 0-139 position along the trail. Attach
    the real sequence number to each point (e.g. `{x, y, seq: p.sequence}`) and reference
    `this.point.seq` in the formatter.'
  - No geographic basemap (streets/terrain/satellite) is rendered - the path sits
    on a plain longitude/latitude grid rather than real map tiles, so spatial context
    from the spec's Notes is only partially met. This is a hard library constraint
    (the core Highcharts bundle has no `highmaps`/tile-layer module and add-on modules
    are forbidden for this entry), not something the repair loop can fix - flagging
    for awareness rather than as an actionable item.
  - Optional direction arrows along the path (suggested in the spec Notes to indicate
    travel direction) are not present; the color gradient alone conveys elapsed-time
    direction but an explicit arrow or arrowhead near the finish would reinforce it.
  - Axis lines (spines) are kept on all sides via `lineColor`/`tickColor` rather than
    trimmed to an L-shape or removed - a minor Visual Refinement (DE-02) opportunity,
    though defensible for a coordinate-grid map style plot.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "Hiking Trail GPS Track · map-route-path · javascript · highcharts · anyplot.ai" in dark ink, bold, centered at top, comfortably sized without overflow or clipping. Subtitle in soft gray explains the color-to-time mapping and the drag-to-zoom affordance. X-axis "Longitude (°)" and Y-axis "Latitude (°)" labels are both dark-ink, similarly sized, with light gridlines and readable tick labels (e.g. -105.680, 40.343). A legend at the bottom shows "Start" (green circle) and "Finish" (red square) swatches.
      Data: A single continuous trail line running from a green circular "Start" marker (bottom-left) through a meandering path that gradually shifts from green to blue, ending at a red square "Finish" marker (top-right) with a "Finish" data label above it. First series color is #009E73 (brand green) as required.
      Legibility verdict: PASS - all title, subtitle, axis, tick, and legend text is clearly readable against the light background with good contrast; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, subtitle, axis titles, and tick labels now rendered in light ink/gray tones against the dark background. Gridlines are faint but visible. Legend swatches and text ("Start"/"Finish") are legible in light gray.
      Data: The path and markers are pixel-identical in color to the light render - same green-to-blue gradient line, green "Start" circle, red "Finish" square - confirming only chrome (not data colors) flips between themes.
      Legibility verdict: PASS - no dark-on-dark failures observed; every text element (title, subtitle, axis labels, tick labels, legend, Start/Finish data labels) is clearly visible against the dark background.
