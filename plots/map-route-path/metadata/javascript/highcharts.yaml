review:
  strengths:
  - 'Correctly implements a route-path map: 140 sequential waypoints connected by
    a continuous, realistically-meandering line.'
  - Time-progression color gradient correctly built from the Imprint imprint_seq stops
    (t.seq[0]->t.seq[1]), matching the spec's suggestion to encode elapsed time along
    the path.
  - Distinct, semantically clear Start (green circle) / Finish (red square) markers
    exactly as the spec suggests.
  - Title fontsize is correctly auto-scaled via the mandated linear formula to avoid
    overflow given the descriptive-title prefix.
  - Explicit font sizes throughout; theme-correct chrome verified in both light and
    dark renders with no legibility failures.
  - Deterministic, seeded data generation with a realistic, well-named real-world
    scenario (Bear Lake Trailhead, RMNP) and plausible GPS step distances.
  - 'zoomType: xy drag-to-zoom plus a custom tooltip formatter add genuine interactivity
    value beyond the static PNG.'
  weaknesses:
  - No geographic basemap is rendered (spec's Notes section suggests one for spatial
    context); acceptable given Highcharts core has no map-tile module and the harness
    is offline, but worth being explicit that this is a library/environment constraint
    rather than something the repair loop can fix.
  - The color gradient is built from 9 discrete line series rather than a true per-point
    gradient; Highcharts' series.zones (or per-point colorAxis) would produce a smoother,
    more idiomatic single-series gradient and better reflect library mastery.
  - Visual design is solid but stays close to a well-configured default look - no
    additional layout flourishes (e.g., annotating the steep climb segment, an elevation-profile
    inset) that would push it toward publication-ready territory.
  - No direction arrows along the path (spec's optional suggestion) - minor, since
    the spec marks this as optional.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "Hiking Trail GPS Track · map-route-path · javascript · highcharts · anyplot.ai" in dark ink, centered; gray subtitle explaining the color/zoom encoding below it; dark axis titles "Longitude (°)" / "Latitude (°)"; gray tick labels; subtle light-gray gridlines; gray legend text for "Start" / "Finish". All confirmed readable.
      Data: Line traces a meandering hiking-trail track from a green circle "Start" marker (bottom-left) through a color gradient (Imprint imprint_seq: #009E73 green -> #4467A3 blue) to a red square "Finish" marker (top-right). First series/marker color is #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Title and axis titles render in light off-white ink; tick labels, subtitle, and legend text in softer light gray; gridlines in a faint light tone. All confirmed readable, no dark-on-dark failures found anywhere (title, subtitle, axis titles, tick labels, legend, Start/Finish data labels all checked individually).
      Data: Same path geometry and gradient (#009E73 -> #4467A3) as the light render, confirmed pixel-identical; Start/Finish marker colors unchanged from light render.
