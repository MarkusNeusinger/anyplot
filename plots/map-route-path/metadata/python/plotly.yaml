review:
  strengths:
  - 'Theme-aware basemap: open-street-map on light and carto-darkmatter on dark'
  - Start and End markers in Imprint positions 1 and 2 with legend entries naming
    the real places
  - Colorbar titled 'Time' with round clock-time ticks
  - Native go.Scattermap with hovertemplates for time and coordinates in the HTML
    output
  weaknesses:
  - 'VQ-07 (both): the time gradient uses Plotly''s ''Viridis'', which the style guide
    forbids → the imprint_seq marks stops of each theme. Likely cause: colorscale=''Viridis''.'
  - 'VQ-01 (light): the ''Start'' label is drawn in #009E73 on the green national-park
    fill and is barely readable → INK text. Likely cause: textfont color=START_COLOR.'
  - 'VQ-02 (both): the ''Start'' label sits on top of the first route markers → place
    it on the side away from the route. Likely cause: textposition=''top center''
    on the start trace.'
  - 'DQ-02 (both): the end is labelled ''End (Mt. Kephart area)'', but the route ends
    some 22 km from Newfound Gap while Mt. Kephart is about 3 km away → a name matching
    the end point or a route ending at Mt. Kephart. Likely cause: the drift amplitudes
    against the hard-coded end label.'
  - 'Suggestion: a wider connecting line would make the route read as one line between
    the small markers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around an OpenStreetMap basemap of the Great Smoky Mountains.
      Chrome: centered title in dark ink, legend upper left on an elevated box, colorbar 'Time' with 07:30-13:30 ticks; readable, except the green 'Start' label on the green park area.
      Data: 300 small route markers on Plotly Viridis (purple to yellow) tracing a looping path; Start #009E73, End #C475FD, three #4467A3 checkpoints; 'Start'/'End' labels colored like their markers, the 'Start' label over the first route markers.
      Legibility verdict: PASS with one weak label ('Start')

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page around a carto-darkmatter basemap.
      Chrome: light title, legend and colorbar text, all readable; no dark-on-dark text.
      Data: identical Viridis route and identical endpoint and checkpoint colors; 'Start' green and 'End' purple labels readable on the dark map.
      Legibility verdict: PASS
