review:
  strengths:
  - Per-segment LineCollection with set_array/Normalize gives a smooth progression
    gradient along the route, explained by a colorbar naming 'Trail progress (waypoint)'
  - Imprint sequential marks ramp with each theme's stops (brand green → blue → deep
    violet on light, olive → brand green → pale blue on dark); every leg reads against
    its page
  - Start (green circle) and End (purple square) differ by shape and color, legend
    in an elevated themed frame
  - 'Full theme threading: INK/INK_SOFT on title, labels, ticks, colorbar outline,
    legend text and basemap tints; arrows flip to light ink on dark'
  - Five sparse direction arrows along the path point in the direction of travel without
    hiding the line
  - Geographically proportioned axes via ax.set_aspect(1/cos(mean latitude)), with
    the colorbar placed from the aspect-applied axes box
  weaknesses:
  - 'SC-02 (both): the basemap gives little geographic context (C5): the bay is a
    ~2 % sliver at the west edge, the park rectangle at alpha 0.10 is near invisible,
    and the 14×24 street lines read as a dense coordinate grid → water, green space
    and streets large and opaque enough to read as map features while staying quieter
    than the route. Likely cause: shore_x placed just west of lon.min(), park alpha=0.10,
    a uniform street grid of 14×24 lines.'
  - 'VQ-03 (both): the gradient route shows a light notch at nearly every segment
    join, so the line reads as dashed rather than continuous → seamless joins. Likely
    cause: LineCollection with the default butt capstyle and alpha=0.95; set capstyle=''round''
    (and joinstyle) and alpha=1.'
  - 'VQ-05 (both): the aspect-locked map is anchored west after a 27 % left margin
    and spans only about a third of the canvas width, leaving wide empty bands left
    of the y axis and right of the colorbar → let the map and colorbar use the width
    (smaller left margin, centred anchor, a wider longitude view around the route).
    Likely cause: subplots_adjust(left=0.27), set_anchor(''W'') and x-limits at 10
    % of the route''s narrow longitude span.'
  - 'Suggestion: a third longitude tick would make longitudes easier to read off.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas
      Chrome: title 'map-route-path · python · matplotlib · anyplot.ai' in dark ink at top; 'Longitude (°)' / 'Latitude (°)' in ink, ticks (-122.395, -122.380; 37.72–37.78) in soft ink; colorbar 'Trail progress (waypoint)' 0–140 right of the tall, narrow aspect-locked axes; Start/End legend in an elevated frame top-left — all readable
      Data: 150-waypoint looping route with two crossings, colored brand green at the start through teal/blue to deep violet at the end; green circle start, purple #C475FD square end; five dark arrows; hand-drawn basemap: a thin grey water band at the west edge, a faint green park rectangle near the centre, and a dense faint street grid. Light notches at the segment joins make the line look slightly dashed. Map occupies only about a third of the canvas width
      Legibility verdict: PASS

