review:
  strengths:
  - Per-segment LineCollection with set_array/Normalize gives a smooth progression
    gradient along the route, explained by a colorbar naming 'Trail progress (waypoint)'
  - 'Imprint sequential marks ramp with the theme''s stops: brand green → blue → navy
    on light, dark green → brand green → pale blue on dark; every leg reads against
    its page'
  - Start (green circle) and End (purple square) differ by shape and color with page-colored
    edges, legend in an elevated themed frame
  - 'Full theme threading: INK/INK_SOFT on title, labels, ticks, colorbar outline
    and legend text; arrows flip to light ink on dark'
  - Five sparse direction arrows placed by index along the path point in the direction
    of travel without hiding the line
  weaknesses:
  - 'SC-02 (both): no geographic basemap — the route floats on a blank page with only
    a lat/lon grid, while the Notes and C5 ask for streets, terrain or satellite context
    → draw a quiet basemap under the route fitted to its extent (e.g. contextily tiles
    or cartopy/geopandas features, muted below the line). Likely cause: no basemap
    layer at all.'
  - 'SC-03 (both): the axes are not geographically proportioned — 1° of longitude
    spans about 3.7x the pixels of 1° of latitude, where at 37.75° N it should be
    about 0.79x, so the route is stretched east-west about 4.7x → set the aspect to
    1/cos(mean latitude) (ax.set_aspect(1 / np.cos(np.radians(lat.mean()))) ). Likely
    cause: default aspect=''auto'' filling the 16:9 axes.'
  - 'Suggestion: slightly larger arrowheads (mutation_scale) would make the travel
    direction easier to pick out along the navy legs.'
