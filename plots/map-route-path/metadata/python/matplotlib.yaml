review:
  strengths:
  - Per-segment LineCollection with set_array/Normalize gives a smooth progression
    gradient along the route, explained by a colorbar naming 'Trail progress (waypoint)'
  - 'Imprint sequential marks ramp with each theme''s stops: brand green → blue →
    navy on light, dark green → brand green → pale blue on dark; every leg reads against
    its page'
  - Start (green circle) and End (purple square) differ by shape and color, legend
    in an elevated themed frame
  - 'Full theme threading: INK/INK_SOFT on title, labels, ticks, colorbar outline
    and legend text; arrows flip to light ink on dark'
  - Five sparse direction arrows placed along the path point in the direction of travel
    without hiding the line
  - Geographically proportioned axes via ax.set_aspect(1/cos(mean latitude)), with
    the colorbar positioned from the aspect-applied axes box
  weaknesses:
  - 'SC-02 (both): no geographic basemap — the route sits on a blank page with only
    a lat/lon grid, while the Notes and C5 ask for streets, terrain or satellite context
    → draw a quiet basemap under the route fitted to its extent (e.g. cartopy features
    such as coastline/land/roads, muted below the line). Likely cause: no basemap
    layer at all.'
  - 'Suggestion: the x axis shows only two longitude ticks (-122.395, -122.380); a
    third tick would make longitudes easier to read off.'
