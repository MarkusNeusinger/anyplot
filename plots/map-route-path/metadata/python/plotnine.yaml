review:
  strengths:
  - Route colored with the Imprint sequential marks ramp (SEQ_MARKS) per theme via
    scale_color_gradientn with stop values, explained by a 'Trail Progress (%)' colorbar
  - 'Start and end markers stay visible at the closed loop: a large yellow start circle
    frames the small red end square, with an ink outline in each theme'
  - Clean grammar-of-graphics layering (basemap polygons -> geom_path -> geom_point)
    with per-layer data and coord_fixed for map proportions
  - 'Fully theme-adaptive chrome; all text readable on #FAF8F1 and #1A1A17; dark park
    fill (#2E5A33) now separates from the page'
  - Rolling-window smoothing of noisy GPS samples, as the Notes ask
  weaknesses:
  - 'SC-02 (both): the basemap is a two-polygon schematic (an 11-vertex park outline
    and a lake ellipse) with no streets, trails or terrain, so C5''s geographic context
    is thin → add terrain or street context drawn from geom_polygon/geom_path layers
    (e.g. contour lines or a road/trail network), quieter than the route. Likely cause:
    df_park and df_lake are the only basemap layers.'
  - 'SC-04 (both): the start circle and the end square sit on the same spot and have
    no key or direct label, so a reader cannot tell which one marks the start → name
    them in a legend (map a ''Start''/''End'' column to shape) or label them directly.
    Likely cause: geom_point layers with fixed fill/shape outside aes().'
  - 'Suggestion: coord_fixed(ratio=1.3) undercorrects for latitude 47.8° (1/cos ≈
    1.49); the matching ratio would keep east-west distances true.'
  - 'Suggestion: base_lat/base_lon/n_points only rebind BASE_LAT/BASE_LON/N_POINTS;
    use the constants directly.'
