review:
  strengths:
  - Route colored with the current Imprint sequential marks ramp per theme via scale_color_gradientn
    with stop values, explained by a 'Trail Progress (%)' colorbar
  - Start and end merged into one 'Route Marker' key by mapping fill, shape and size
    to a single column; the large amber start circle frames the small red end square
    at the closed loop
  - Terrain basemap of park, lake, elevation contours and dashed side trails stays
    quiet beneath the thick route in both themes
  - 'Fully theme-adaptive chrome; all text readable on #FAF8F1 and #1A1A17'
  - Rolling-window smoothing of noisy GPS samples, as the Notes ask
  weaknesses:
  - 'VQ-03 (dark): the route is drawn at alpha 0.85 over a park fill 1.68:1 from the
    page (#2E5A33 at alpha 0.7), so the olive low end #6F7E20 reads at about 2.3:1
    on the land, below the 3:1 the marks ramp is built for → draw the route opaque
    and darken the dark park fill to within about 1.25:1 of the page (the style guide''s
    Ground rule). Likely cause: geom_path(alpha=0.85) and PARK_FILL ''#2E5A33'' with
    alpha=0.7.'
  - 'Suggestion: coord_fixed(ratio=1.3) undercorrects for latitude 47.8° (1/cos ≈
    1.49); the matching ratio would keep east-west distances true.'
  - 'Suggestion: the two outer elevation contours run through the lake; keeping the
    lake inside one contour band would read as more plausible terrain.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'map-route-path · python · plotnine · anyplot.ai' in dark ink, about half the width; 'Longitude (°)' / 'Latitude (°)' and ticks (-121.9..-121.6, 47.7..47.9) readable; L-shaped axis lines, faint grid; 'Route Marker' key and 'Trail Progress (%)' colorbar 0-100 on an elevated #FFFDF6 box.
      Data: pale-green park polygon with green outline, light-blue lake, five thin grey-green contours and two dashed tan side trails; thick heart-shaped hiking loop from brand green #009E73 at the start through deep blue #024582 to dark violet #351E45 at the end; large amber start circle with dark outline framing a small red end square at (-121.60, 47.82).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title and axis titles in light ink, ticks light grey; keys on #242420 with light text; no dark-on-dark.
      Data: dark-green park (#2E5A33) clearly lighter than the page, dark-blue lake, muted contours and side trails; route uses the dark marks stops olive #6F7E20 -> brand green #009E73 -> pale blue #CDD9FF, brightening toward the end; the olive first stretch is the dimmest part on the park fill. Start (amber, light outline) and end (red) markers have the same fills as in light.
      Legibility verdict: PASS
