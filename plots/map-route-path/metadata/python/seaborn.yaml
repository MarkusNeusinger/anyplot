review:
  strengths:
  - Elapsed time is encoded with imprint_seq built from the style guide's current
    marks stops for each theme and explained by a colorbar named 'Elapsed Time (min)'
  - Start (brand-green circle) and End (purple square) differ in shape and hue and
    carry an ink ring that separates them from the ramp's ends in both themes
  - sns.lineplot(sort=False) keeps the waypoints in sequence order; four np.linspace-spaced
    arrows show direction without hiding the line
  - 'Theme-adaptive chrome throughout: text, spines, grid, legend frame and colorbar
    outline flip correctly between #FAF8F1 and #1A1A17'
  - Clean, reproducible flat script with readable column constants and a realistic
    Crested Butte track
  weaknesses:
  - 'SC-02 (both): no geographic basemap — the route sits on a blank lon/lat plane,
    missing the spec''s ''A good version shows: a geographic basemap of streets, terrain
    or satellite imagery, quieter than the route, with the view fitted to the route''s
    extent'' → draw a muted terrain or street tile layer under the route, fitted to
    its extent. Likely cause: no basemap call (e.g. contextily.add_basemap on ax_map
    with a reduced alpha).'
  - 'VQ-05 (both): the y-axis title ''Latitude (°)'' sits flush against the left canvas
    edge — the ascenders of ''L'', ''d'' and the parentheses end at pixel column 0
    with no margin → leave at least ~20 px between the label and the edge. Likely
    cause: fig.subplots_adjust(left=0.08) is too tight for the tick labels plus the
    rotated axis title (raise left to about 0.10).'
  - 'Suggestion: set an equal-distance aspect on the map (ax_map.set_aspect(1 / np.cos(np.radians(38.9))))
    so the track''s shape is not stretched east-west.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across the figure.
      Chrome: Title "Colorado Mountain Bike Trail · map-route-path · python · seaborn · anyplot.ai" in dark ink, centred, about 70 % of the width. Axis titles Longitude (°) and Latitude (°) in dark ink, tick labels in INK_SOFT, subtle grid, top/right spines removed. Colorbar "Elapsed Time (min)" 0–140 on the right. Start/End legend lower right on an elevated frame. All text readable; the rotated 'Latitude (°)' title sits flush against the left canvas edge.
      Data: 250 waypoints over a grey path running from lower left to upper right, colored by the imprint_seq marks ramp (green #009E73 → deep blue → dark violet). Large #009E73 Start circle ringed in dark ink at lower left, large #C475FD End square ringed in dark ink at upper right; four dark arrowheads along the route. Single map panel fills the canvas. No basemap behind the route.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17.
      Chrome: Title, axis titles in light ink; tick labels light grey; grid subtle; legend frame #242420 with light text; colorbar ticks and outline light. No dark-on-dark text.
      Data: Waypoints use the dark marks stops of imprint_seq (olive → #009E73 → pale blue), as required for a continuous ramp. Start #009E73 and End #C475FD identical to the light render, now ringed in light ink; arrowheads in light ink.
      Legibility verdict: PASS
