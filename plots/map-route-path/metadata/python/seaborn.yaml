review:
  strengths:
  - Elapsed time is encoded with imprint_seq built from the theme's mark stops and
    explained by a colorbar named 'Elapsed Time (min)'
  - Start (brand-green circle) and End (purple square) differ in shape and hue and
    carry an ink ring that separates them from the ramp's ends in both themes
  - sns.lineplot(sort=False) keeps the waypoints in sequence order; four np.linspace-spaced
    arrows show direction without hiding the line
  - 'Theme-adaptive chrome throughout: all text, spines, grid, legend frame and colorbar
    outline flip correctly between #FAF8F1 and #1A1A17'
  - Clean, reproducible script with readable column constants and a realistic Crested
    Butte track
  weaknesses:
  - 'SC-02 (both): no geographic basemap — the route sits on a blank lon/lat plane,
    missing the spec''s ''A good version shows: a geographic basemap of streets, terrain
    or satellite imagery, quieter than the route, with the view fitted to the route''s
    extent'' → draw a muted terrain or street tile layer under the route, fitted to
    its extent. Likely cause: no basemap call (e.g. contextily.add_basemap on ax_map
    with a reduced alpha).'
  - 'SC-01 (both): an elevation-profile panel the spec does not ask for takes the
    lower quarter of the canvas → remove it and give the route map the full canvas
    (elevation may instead drive the path''s color gradient, as the Notes allow).
    Likely cause: the second subplot ax_elev and its lineplot/fill_between.'
  - 'Suggestion: set an equal-distance aspect on the map (ax_map.set_aspect(1 / np.cos(np.radians(38.9))))
    so the track''s shape is not stretched east-west.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across both panels and the figure.
      Chrome: Title "Colorado Mountain Bike Trail · map-route-path · python · seaborn · anyplot.ai" in dark ink, centred, about 70 % of the width. Axis titles Longitude (°), Latitude (°), Elapsed Time (min), Elevation (m) in dark ink; tick labels in INK_SOFT; subtle grid; top/right spines removed. Colorbar "Elapsed Time (min)" 0–140 on the right. Legend (Start circle, End square) lower right on an elevated frame. All text readable.
      Data: 250 waypoints over a grey path, colored by imprint_seq light stops (green #009E73 → blue → navy). Large #009E73 Start circle with dark ring at lower left, large #C475FD End square with dark ring at upper right; four dark arrowheads along the route. Lower panel: elevation profile in #009E73 with a light green fill. No basemap behind the route.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 across both panels.
      Chrome: Title, axis titles in light ink; tick labels light grey; grid subtle; legend frame #242420 with light text; colorbar ticks light. No dark-on-dark text.
      Data: Waypoints use the dark stops of imprint_seq (deep green → #009E73 → pale blue), as required for a continuous ramp. Start #009E73 and End #C475FD are identical to the light render, now ringed in light ink; arrowheads in light ink; elevation line and fill green.
      Legibility verdict: PASS
