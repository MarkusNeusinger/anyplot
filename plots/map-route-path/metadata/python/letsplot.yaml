review:
  strengths:
  - Terrain basemap built with geom_raster hillshade plus geom_contour isolines, kept
    quiet (alpha up to 0.22 / 0.35) so the route leads in both themes
  - Progress (%) gradient along a continuous geom_path explained by a named color
    bar; distinct white-haloed Start (#009E73) and End (#C475FD) markers
  - coord_fixed with a 1/cos(latitude) ratio keeps geographic proportions, and the
    data-derived span fills the landscape panel
  - layer_tooltips() gives formatted progress/lat/lon read-outs in the HTML output
  weaknesses:
  - 'VQ-07 (both): the route''s color ramp uses marks stops the style guide does not
    list — light (0 #009E73, 0.338 #4467A3, 1 #002850), dark (0 #007755, 0.32 #009E73,
    1 #CDD9FF) — so the 100 % end reads navy instead of dark violet on light and the
    0 % end deep green instead of olive on dark, and the line is drawn at alpha 0.9
    → the imprint_seq marks stops of each theme, light (0 #009E73, 0.687 #024582,
    1 #351E45), dark (0 #6F7E20, 0.21 #009E73, 1 #CDD9FF), drawn opaque (alpha 1,
    +0.1). Likely cause: the SEQ_MARKS lists and alpha=0.9 on geom_path.'
  - 'Suggestion: a few sparse direction arrows along the path (as the Notes allow)
    would make the travel direction readable without the color bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the panel is a pale sage terrain tint with a grey hillshade (two hills) and thin grey contour lines.
      Chrome: title 'map-route-path · python · letsplot · anyplot.ai' top left, Longitude (°) / Latitude (°) axis titles, ticks 9.8–9.91 and 46.845–46.9, legends 'Progress (%)' color bar and 'Markers' Start/End on elevated boxes at the right — all dark text, readable.
      Data: a 150-point hiking loop drawn as a thick line from brand green #009E73 through blue to navy; Start green circle and End purple circle, both white-haloed. The map span fills the panel.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; dark olive terrain panel with a lighter hillshade and light grey contours.
      Chrome: title, axis titles, ticks and legend text in light ink, all readable; no dark-on-dark text.
      Data: the same loop on the dark marks ramp, deep green → green → pale blue; Start #009E73 and End #C475FD identical to the light render.
      Legibility verdict: PASS
