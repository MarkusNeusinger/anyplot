review:
  strengths:
  - Imprint sequential marks ramp (SEQ_MARKS) with theme-specific stops encodes progress
    via scale_color_gradientn, as the library prompt prescribes
  - One-panel gggrid wrapper paints the full 3200x1800 canvas in the page color around
    the coord_fixed panel
  - coord_fixed(ratio=1.0) keeps the geographic proportions of the track
  - Distinct white-haloed Start (#009E73) and End (#C475FD) markers make the direction
    of the journey readable at a glance
  - layer_tooltips() with formatted progress/lat/lon lines gives useful hover inspection
    in the HTML output
  - Theme tokens threaded through every chrome element; both renders fully readable
  weaknesses:
  - 'SC-02 (both): no geographic basemap — the route sits on a flat tinted panel with
    no streets, terrain or satellite context, which the Notes and the C5 property
    ask for → draw a basemap under the route, quieter than the line, with the view
    fitted to the route. Likely cause: only panel_background=TERRAIN_BG stands in
    for the map; no basemap layer (e.g. geom_livemap tiles or terrain polygons) is
    drawn.'
  - 'Suggestion: a thicker route line (size about 2) would give the path more presence
    against the panel.'
  - 'Suggestion: a few sparse direction arrows along the path (as the Notes allow)
    would make the travel direction readable without the color bar.'
