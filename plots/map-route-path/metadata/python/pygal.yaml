review:
  strengths:
  - 'Clean pygal.XY route: one continuous line through 100 waypoints in sequence order,
    START and FINISH both visible and told apart by size and color'
  - 'Theme tokens threaded through Style, including guide_stroke_color, so text and
    grid read correctly on both #FAF8F1 and #1A1A17'
  - x_value_formatter rounds longitude ticks to three decimals, keeping the rotated
    tick labels short
  - Per-point label dicts and value_formatter give waypoint/time tooltips in the interactive
    HTML
  weaknesses:
  - 'VQ-01 (both): the y axis shows two tick sizes - 40.79-40.76 at 56 px and 40.75
    at 44 px - and the x ticks sit at 56 px → one size, 44 px on both axes (-12 px).
    Likely cause: Style label_font_size=56 while major_label_font_size=44.'
  - 'VQ-07 (both): the five ordered time segments (0-9 ... 36-45 min) take categorical
    positions 3-7 (blue, ochre, red, cyan, plum), which hides their order → ordered
    steps of SEQ_MARKS in time order. Likely cause: colors=IMPRINT_PALETTE cycling
    through the segment series.'
  - 'SC-02 (both): no geographic basemap - the route floats on an empty grid, so the
    C5 property (streets/terrain context, quieter than the route) is missing → draw
    a quiet basemap under the route (e.g. park outline/street polylines as muted XY
    series in INK_MUTED). Likely cause: only the route and markers are added.'
  - 'SC-03 (both): the map ignores the lon/lat aspect - 0.031° of longitude (~2.6
    km) spans ~1700 px while 0.055° of latitude (~6.1 km) spans ~780 px, so the loop
    is stretched about 5x east-west → size the plot area so 1° lon = cos(40.77°)≈0.76
    of 1° lat on screen (e.g. a square canvas with padded x range). Likely cause:
    pygal.XY fills the landscape canvas with independent axis scales.'
  - 'SC-03 (both): x ticks sit at non-round, unevenly spaced values (-73.986, -73.981,
    -73.976, -73.971, -73.965 ...) → round steps of 0.005°. Likely cause: chart.x_labels
    = np.linspace(min, max, 7).'
  - 'DQ-03 (both): the loop is ~14 km long but covered in 45 min, ~18.7 km/h, far
    above a hiking pace of ~4-5 km/h → stretch the time axis to ~3 h or shrink the
    loop to ~3.5 km. Likely cause: MINUTES = np.linspace(0, 45, n_points) with 0.015°/0.025°
    loop amplitudes.'
  - 'CQ-04 (code): the stroke width follows a hard-coded bell curve ''to suggest pace''
    that encodes no data value and is not visibly distinguishable in either render
    → one constant stroke width. Likely cause: width = round(5 + 3 * np.sin(...))
    in the segment loop.'
  - 'Suggestion: sparse direction arrows along the loop would show which way the trail
    runs.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title 'map-route-path · python · pygal · anyplot.ai' dark ink at top; axis titles 'Longitude (degrees)' / 'Latitude (degrees)'; y ticks 40.79-40.76 large and 40.75 visibly smaller; x ticks at 3 decimals rotated 45°; dotted muted grid; legend in three columns at bottom-left (START, FINISH, five time ranges). All readable.
      Data: closed loop of 100 GPS-like waypoints in five time segments - blue 0-9, ochre 9-18, red 18-27, cyan 27-36, plum 36-45 min; START is a large #009E73 dot at the top centre, FINISH a smaller purple #C475FD dot just left of it. Loop stretched wide east-west; no basemap.
      Legibility verdict: PASS

