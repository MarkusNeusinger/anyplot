review:
  strengths:
  - Theme-switched CartoDB basemap (Positron / Dark Matter), quiet behind the route
    and fitted to its extent
  - Mercator axis types label Web Mercator coordinates in degrees
  - Start (green circle) and end (purple square) differ by shape and color
  - Full chrome token coverage in both themes; HTML output keeps pan/zoom
  weaknesses:
  - 'VQ-07 (both): the waypoint dots and the colorbar use Viridis256 (purple→yellow),
    a colormap the style guide forbids → the Imprint sequential ramp with the SEQ_MARKS
    stops per theme. Likely cause: LinearColorMapper(palette=Viridis256).'
  - 'VQ-03 (both): the legend''s Start and End glyphs are 2-3 px dots, far smaller
    than the 32 px circle and square they explain → legend glyphs about 30-40 px.
    Likely cause: default legend glyph_width/glyph_height with no glyph size set.'
  - 'DQ-02 (both): the hiking track is a smooth analytic S-curve (linear trend plus
    one sine per axis) with no GPS jitter, switchbacks or contour-following, so it
    does not read as a mountain trail → a track with switchbacks and small recording
    noise. Likely cause: lats/lons built from 0.027*t + 0.003*sin(2πt) and 0.038*t
    + 0.006*sin(πt).'
  - 'Suggestion: sparse direction arrows (bokeh Arrow/VeeHead) along the path, as
    the Notes allow.'
  - 'Suggestion: draw the dots smaller than the line width so the green route line
    frames them.'
  image_description: |-
