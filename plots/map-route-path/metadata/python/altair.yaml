review:
  strengths:
  - Route-fitted Albers projection (center, rotation, parallels and scale computed
    from the route extent) with a clipped state basemap that stays quieter than the
    route in both themes
  - Imprint sequential ramp for marks with per-theme stops encodes elevation on sampled
    dots, explained by a gradient legend titled 'Elevation (m)'
  - Start (green circle) and end (purple square) told apart by shape and color, opaque
    with page-colored halos
  - Layered Altair geo charts sharing one projection, alt.Order by sequence and native
    HTML tooltips for waypoint inspection
  weaknesses:
  - 'VQ-03 (both): the route line shows sharp spikes at its zigzag joins (e.g. south
    of Springfield, near the Oklahoma border, at the Texas panhandle) that read as
    stray arrowheads pointing sideways → round joins so the 3.5 px line stays a clean
    band. Likely cause: mark_line without strokeJoin=''round'' (default miter) on
    jittered waypoints.'
  - 'SC-02 (both): the Notes ask to apply line smoothing or simplification for noisy
    GPS data, but the track is drawn raw with visible back-and-forth zigzags from
    the 0.07° jitter → smooth the waypoints (e.g. a rolling mean over lat/lon, or
    a transform_window mean in Altair) before drawing. Likely cause: df drawn directly
    with no smoothing step.'
  - 'Suggestion: the ''▲ Highest point 2188 m'' label sits about 90 px above and right
    of the dot it names; tying it closer to that dot would make the reference clear.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; route-fitted Albers basemap of US states in #DEDAD4 with soft grey borders, filling the view from California to Michigan/Ohio
      Chrome: left-anchored title "Route 66 Road Trip · map-route-path · python · altair · anyplot.ai" in dark ink; bold labels "Chicago", "Los Angeles" and "▲ Highest point 2188 m"; elevation legend bottom-left on an elevated panel — all readable
      Data: continuous #009E73 route Chicago → St. Louis → Oklahoma → Albuquerque → Flagstaff → Los Angeles, clearly visible; small elevation dots every 4th waypoint in the marks ramp (green low → navy high) with page-colored halos; large green start circle at Chicago, purple #C475FD end square at Los Angeles; jittered track shows zigzags and miter spikes at some joins
      Legibility verdict: PASS

    Dark render (plot-dark.png):
