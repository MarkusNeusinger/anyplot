review:
  strengths:
  - Route-fitted Albers projection (center, rotation, parallels and scale computed
    from the route extent) with a clipped state basemap that stays quieter than the
    route in both themes
  - Noisy GPS track smoothed with a centered pandas rolling mean and drawn with round
    joins, so the route reads as one clean continuous band
  - Start (green circle) and end (purple square) differ by shape and color, opaque
    with page-colored halos
  - Layered Altair geo charts sharing one projection, alt.Order by sequence and native
    HTML tooltips for waypoint inspection
  weaknesses:
  - 'VQ-07 (both): the elevation ramp uses hand-set stops (light #009E73 → #4467A3
    at 0.338 → #002850; dark #007755 → #009E73 at 0.32 → #CDD9FF) instead of the style
    guide''s imprint_seq marks stops → light (0, #009E73), (0.687, #024582), (1, #351E45);
    dark (0, #6F7E20), (0.21, #009E73), (1, #CDD9FF). Likely cause: SEQ_MARKS values.'
  - 'SC-04 (both): the start circle and end square are labelled only ''Chicago'' and
    ''Los Angeles'', so nothing tells the reader which end the journey began at →
    direct labels ''Start: Chicago'' / ''End: Los Angeles'' (the label column already
    holds them). Likely cause: start_label/end_label encode text=PLACE instead of
    the ''label'' column.'
  - 'SC-02 (code): the Notes ask interactive libraries to enable zoom and pan, but
    the HTML has no zoom/pan → bind the projection scale/translate to wheel/drag params
    (Vega-Lite geo charts do not take .interactive()). Likely cause: no zoom/pan params
    on the layered chart.'
  - 'Suggestion: the ''▲ Highest point 2188 m'' label floats about 140 px above and
    right of the dot it names; a smaller dy would tie it to that dot.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; route-fitted Albers basemap of US states in #DEDAD4 with soft grey borders, filling the view from California to Ohio
      Chrome: left-anchored title "Route 66 Road Trip · map-route-path · python · altair · anyplot.ai" in dark ink; bold labels "Chicago", "Los Angeles" and "▲ Highest point 2188 m"; elevation legend bottom-left on an elevated panel — all readable
      Data: smooth continuous #009E73 route Chicago → St. Louis → Oklahoma → Albuquerque → Flagstaff → Los Angeles with round joins, no spikes; elevation dots every 4th waypoint green low → navy high with page-colored halos; large green start circle at Chicago, purple #C475FD end square at Los Angeles
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; basemap #2C2C28 with subtle borders
