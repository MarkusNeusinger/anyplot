review:
  strengths:
  - Imprint sequential ramp for marks (SEQ_MARKS) with per-theme stops and rgb interpolation
    encodes elevation, explained by a gradient legend
  - Start (green circle) and end (purple square) told apart by shape and color, both
    opaque with page-colored halos
  - Map fills the landscape canvas through fit autosize; all chrome flips cleanly
    between themes
  - albersUsa projection over a topo_feature state basemap, quieter than the route,
    with native HTML tooltips
  weaknesses:
  - 'VQ-03 (both): elevation dots at size 90 on every 3rd waypoint sit almost edge
    to edge and cover the route line, which shows only as green slivers between them
    → let the line read through (smaller dots, about size 40–50, or sparser sampling).
    Likely cause: mark_circle(size=90) with dot_df = df.iloc[::3].'
  - 'SC-02 (both): the view shows the whole US with Alaska and Hawaii insets, so the
    Northeast, Florida and the insets take space while the route fills a band across
    the middle → fit the view to the route''s extent (C5). Likely cause: albersUsa
    projection with no fit to the route (e.g. a mercator/albers projection with fit
    or scale/center from the route bounds).'
  - 'Suggestion: the ''▲ Highest point'' label floats about 90 px above the dot it
    names; placing it closer would tie it to its point.'
