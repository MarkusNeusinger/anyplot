review:
  strengths:
  - Route-fitted Albers projection (center, rotation, parallels and scale from the
    route extent) with a clipped state basemap quieter than the route in both themes
  - Noisy GPS track smoothed with a centered pandas rolling mean and drawn with round
    joins as one continuous band
  - 'Start (green circle) and end (purple square) differ by shape and color and carry
    direct ''Start: Chicago'' / ''End: Los Angeles'' labels'
  - Elevation dots use the imprint_seq marks stops of each theme, explained by an
    'Elevation (m)' color legend
  - Zoom and pan in the HTML through alt.param range bindings feeding the projection
    scale and translate expressions
  weaknesses:
  - 'Suggestion: the ''▲ Highest point 2188 m'' label floats about 90 px above and
    right of the dot it names; a smaller dy would tie it to that dot.'
  - 'Suggestion: low-elevation dots in light share the route''s #009E73, so the low
    end of the gradient reads mostly through the halos.'
