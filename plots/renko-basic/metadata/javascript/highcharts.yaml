review:
  strengths:
  - Genuine, algorithmically correct Renko brick construction (fixed-price-step reversal
    logic) rather than a re-skinned candlestick or column chart
  - 'Clean, idiomatic workaround for core Highcharts'' missing columnrange/candlestick
    series: chart.events.render + renderer.rect + axis.toPixels, with a code comment
    explaining why the direct-draw approach was chosen over a stacked-column hack'
  - 'Correct semantic color mapping: bullish = Imprint brand green (#009E73, palette
    position 1), bearish = Imprint matte red (#AE3030, palette position 5) — matches
    the style guide''s finance semantic exception exactly'
  - Both themes render correctly with identical data colors and fully theme-adaptive
    chrome (ink/inkSoft/grid tokens threaded through title, subtitle, axes, and legend)
  - Subtle horizontal-only gridline, generous margins, and uniform brick sizing with
    a visible gap between bricks as the spec requests
  - Helpful subtitle context (brick size and brick count) and a data series with multiple
    clear uptrend/downtrend reversal cycles, giving good feature coverage of what
    a Renko chart is meant to reveal
  weaknesses:
  - Bullish/bearish direction is communicated primarily through green/red hue; while
    brick position also encodes direction, a subtle secondary cue (e.g. a slightly
    different corner treatment or outline) would strengthen CVD accessibility
  - The price series is generic ('Price ($)') with no labeled instrument/ticker context
    — naming the asset in the subtitle would add a touch more real-world flavor for
    Data Quality/Storytelling
  - Visual treatment is competent house-style but introduces no distinguishing aesthetic
    flourish beyond the mandated defaults — solid but not yet publication-level design
    polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "renko-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top; subtitle "Brick size: $4.00 · 42 bricks" in soft gray beneath it; "Price ($)" y-axis title and "Brick Sequence" x-axis title in soft ink; tick labels on both axes in soft gray; subtle horizontal-only gridlines; legend ("Bullish" / "Bearish") centered at the bottom. All text is clearly legible against the light background.
      Data: 42 discrete rectangular bricks tracing two full uptrend/downtrend cycles between ~$146 and ~$190. Up bricks render in Imprint brand green (#009E73), down bricks in Imprint matte red (#AE3030). Bricks are uniform height, evenly spaced with a small visible gap, and have subtly rounded corners.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-title/tick-label/legend layout, all rendered in light ink (white/light-gray) against the dark background. Gridlines are a faint light overlay, still subtle but visible. No dark-on-dark or light-on-light text was found.
      Data: Identical brick sequence and colors to the light render — green (#009E73) and matte red (#AE3030) unchanged, confirming only chrome (not data colors) flips between themes.
      Legibility verdict: PASS
