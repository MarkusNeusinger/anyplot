review:
  strengths:
  - Correct finance semantic color exception (t.palette[0] brand green for bullish,
    t.palette[4] matte red for bearish) plus a redundant ink-colored up/down triangle
    mark on every brick, so direction reads from shape alone for viewers who can't
    distinguish red from green
  - Clean, uniform, gapped brick geometry drawn against useXScale/useYScale band/linear
    scales — the documented ChartContainer composition idiom for chart types outside
    the MUI X community surface (same pattern as candlestick/OHLC)
  - Deterministic LCG-seeded price series across four distinct trend regimes (uptrend,
    consolidation, downtrend, recovery) produces 41 bricks, squarely inside the spec's
    20-50 brick target
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    ink, grid) adapts via ANYPLOT_TOKENS, exactly as required
  - Title/subtitle exactly match the mandated format and add genuinely useful context
    (date range, brick size, brick count) without cluttering the chart
  - Well-composed pill-style legend, subtle horizontal-only grid, no text/element
    overlap or edge clipping across either render
  weaknesses:
  - Swing high/low ChartsReferenceLine annotations use t.amber (warning/caution anchor),
    but the style guide's semantic-anchor table assigns the 'reference line' role
    to t.neutral, not amber — consider switching to t.neutral so amber stays reserved
    for genuine warning/caution states.
  - Design excellence is solid but conventional (rectangle bricks + dashed reference
    lines); a stronger focal-point device (e.g. shading the swing range band, or emphasizing
    the most recent trend leg) would push the storytelling further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Centered dark-ink title "SolarGrid Energy Daily Close · renko-basic · javascript · muix · anyplot.ai" and a lighter subtitle ("Jan 2 - Aug 29 · $1.50 brick size · 41 bricks") both clearly legible. Y-axis "Price (USD)" with $58-$86 dollar-formatted ticks; x-axis "Brick Sequence (estimated dates)" with sparse date ticks (Jan 6 ... Aug 18). Subtle horizontal grid lines, thin low-opacity axis lines, no visible heavy spines.
      Data: 41 uniform rectangular bricks trace an up-then-down-then-up arc. Bullish bricks are brand green (#009E73) with a dark up-pointing triangle; bearish bricks are matte red with a dark down-pointing triangle. Two amber dashed reference lines mark "Swing high $85.50" and "Swing low $60.00", labeled at the right edge. Bottom legend shows two pill badges: green "Bullish brick (price up)" and red "Bearish brick (price down)".
      Legibility verdict: PASS — all title, subtitle, axis, tick, reference-line, and legend text is clearly readable dark-on-light; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis/legend layout, now rendered in light ink against the dark surface. Grid lines remain subtle but visible. No dark-on-dark failures found — every label is clearly legible.
      Data: Brick colors (brand green / matte red), triangle marks, and amber reference lines are visually identical to the light render — confirms only chrome flips between themes, not data colors.
      Legibility verdict: PASS — all text reads clearly light-on-dark; brand green and matte red both remain visible on the dark surface.
