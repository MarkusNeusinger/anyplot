review:
  strengths:
  - Correct, idiomatic use of the documented useXScale/useYScale + custom <rect> composition
    pattern for a chart type the community package has no native series for (Renko),
    matching the muix.md guidance exactly.
  - Deterministic LCG-seeded data spans four distinct trend regimes (uptrend, consolidation,
    downtrend, recovery), giving the bricks real bullish/bearish variety and a clean
    visual wave.
  - 'Both renders are fully theme-correct: identical brick colors (t.palette[0] green
    / t.palette[4] red) between light and dark, correct #FAF8F1 / #1A1A17 backgrounds,
    no dark-on-dark or light-on-light text anywhere.'
  - Title format, subtitle context line (date range, brick size, brick count), and
    legend all directly serve the spec's requirements without clutter or redundancy.
  - Correct canvas size (3200x1800), skipAnimation set, no fetch/CDN, self-contained
    per the harness contract.
  weaknesses:
  - 'VQ-04 Color Accessibility: bullish/bearish direction is signaled primarily through
    red/green hue on the bricks. Direction is also inferable from vertical brick position,
    but a CVD viewer scanning brick colors alone may struggle to tell bullish from
    bearish at a glance. Consider strengthening the non-color cue (bigger luminance/saturation
    gap between the two brick colors) to fully clear the red-green-only bar.'
  - 'DE-01/DE-03: the chart is clean and well-organized but stops short of a strong
    focal point beyond the zigzag itself — e.g. no subtle emphasis on the most recent
    brick or the largest reversal — so the ''story'' still requires the viewer to
    scan the whole series rather than being guided to an insight.'
  - 'LM-02: the useXScale/useYScale + custom <rect> composition is the right documented
    workaround, but it is a fairly generic SVG technique; consider wiring ChartsTooltip
    or another MUI X-native affordance into the exported interactive HTML to show
    deeper library-specific mastery beyond the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "SolarGrid Energy Daily Close · renko-basic · javascript · muix · anyplot.ai" in dark bold text, centered; a smaller gray subtitle below it ("Jan 2 – Aug 29 · $1.50 brick size · 41 bricks"); dark Y-axis label "Price (USD)" and X-axis label "Brick Sequence (estimated dates)"; subtle horizontal gridlines only; two rounded-pill legend swatches below the chart ("Bullish brick (price up)" green, "Bearish brick (price down)" red). All text is clearly readable against the light background.
      Data: 41 uniform, gapped rectangular bricks forming a clean rise-plateau-fall-rise wave from ~$64 to ~$85.5 and back down to ~$60, then recovering to ~$69. Bullish bricks render in brand green (#009E73), bearish bricks in a matte red, each with a thin dark outline separating adjacent bricks. First-series green confirmed as #009E73.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, subtitle, axis labels, and legend as the light render, all rendered in light/white text against the dark background; gridlines are subtle and still visible; legend pill borders and fills adapted to the dark surface.
      Data: Identical brick geometry and identical green/red brick colors to the light render — only the background, text, and grid chrome flipped, exactly as required. No dark-on-dark text anywhere; every label, tick, and legend entry is clearly legible.
      Legibility verdict: PASS.
