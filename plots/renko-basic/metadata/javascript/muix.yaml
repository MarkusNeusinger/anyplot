review:
  strengths:
  - 'Correct Renko construction: every brick spans exactly one 1.5 USD brick size,
    one per column, and reversals start one brick beyond the previous brick, producing
    clean diagonal staircases'
  - 'Uses MUI X''s composition API idiomatically: a custom brick layer drawn with
    useXScale/useYScale inside ChartsContainer, with ChartsGrid and ChartsXAxis/ChartsYAxis'
  - Band x axis with valueFormatter + tickLabelInterval shows the date each brick
    formed without crowding, honouring the non-time nature of the axis
  - Theme tokens threaded through title, subtitle, axes, grid and legend; both renders
    fully legible and data colors identical
  - 'Finance semantic colors from the Imprint palette: brand green for bullish, matte
    red #AE3030 for bearish'
  - Subtitle states observation count, date span, brick size and brick count, making
    the noise filtering explicit
  weaknesses:
  - 'Suggestion: the legend is a hand-built HTML row; feeding the two directions through
    MUI X''s native ChartsLegend (inside ChartsDataProvider/ChartsWrapper) would use
    the library''s own legend.'
  - 'Suggestion: the header reads ''muix 7.29.1'' while the code targets the pinned
    MUI X v9 API; align the version string.'
  - 'Suggestion: the generated closes contain only two reversals; a choppier stretch
    with short reversals would show price levels revisited by several columns, the
    support/resistance use the spec describes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "SolarGrid Energy · renko-basic · javascript · muix · anyplot.ai" centered at top (~40 % width), grey subtitle "241 closes Jan 2, 2024 – Dec 3, 2024 · brick size 1.5 USD · 35 bricks"; y axis "Close (USD)" with ticks 60–86 every 2; x axis "Brick sequence (date the brick formed)" with date ticks every 4th brick (Jan 8 … Oct 11); subtle horizontal grid; legend row at bottom. All text dark and readable.
      Data: 35 uniform bricks with small gaps, one per column — 14 green (#009E73) bricks rising from 64.5 to 85.5, 16 matte-red (#AE3030) bricks falling to 60, then 5 green bricks recovering to 69. Clean diagonal staircases.
