      Chrome: Same title, legend, and axis titles rendered in light ink; tick labels in a softer light gray. All clearly legible against the dark background. No dark-on-dark failures found (no black-on-near-black text anywhere).
      Data: Confirmed identical brick sequence and colors (#009E73 bullish / #AE3030 bearish) to the light render - only chrome (background, text, grid) flipped, exactly as required.
