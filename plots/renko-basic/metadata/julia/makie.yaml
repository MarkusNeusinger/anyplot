review:
  strengths:
  - Correct, algorithmically sound Renko brick construction (threshold-based reversal
    logic with separate up/down accumulators) that genuinely implements the spec rather
    than faking a bar-chart lookalike
  - 'Clean theme-adaptive chrome throughout: title/labels/ticks/spines/grid all correctly
    branch on ANYPLOT_THEME, verified identical data colors and correctly flipped
    chrome in both renders'
  - Idiomatic use of Makie's barplot! with a per-bar fillto array to render variable-baseline
    bricks, plus a hand-built axislegend via PolyElement handles instead of relying
    on implicit series legend
  - 'Data shows the full range of Renko features required by the spec: multiple bullish/bearish
    reversals, a clear multi-leg trend (up/down/up/down), and a consolidation zone
    with rapid alternation in the middle'
  - Spines reduced to L-shape, single subtle y-axis grid (matches the spec's 'consider
    adding a subtle grid to identify price levels'), frameless legend — restrained,
    uncluttered chrome
  - 'Modern Makie API: `Figure(size=...)` instead of the deprecated `resolution=`
    kwarg'
  weaknesses:
  - Bullish/bearish bricks are distinguished by hue alone (green vs. red, both strokewidth=0)
    with no redundant encoding (e.g. a thin edge stroke) — a real CVD-accessibility
    soft spot even though green-up/red-down is the accepted domain convention for
    Renko/candlestick charts
  - 'Design Excellence is solid but not exceptional: the chart communicates trend
    direction well through color, but has no explicit emphasis (e.g. a light annotation
    or callout marking the peak/trough of each leg) that would elevate it from ''clear''
    to ''tells an immediate story'''
  - fillto-based variable-baseline barplot! is a sound idiomatic technique but not
    something unique to Makie (matplotlib's bar(bottom=...) achieves the same); Library
    Mastery would benefit from a more Makie-distinctive touch
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "renko-basic · julia · makie · anyplot.ai" is bold dark ink, centered top, fully visible with margin above. "Price ($)" (y) and "Brick Index" (x) axis titles are dark ink and readable. Tick labels are a lighter secondary ink tone, legible. Only the left and bottom spines are drawn (L-shape); a subtle horizontal (y-axis) grid is visible at low opacity. A frameless legend ("Bullish" / "Bearish" with green/red swatches) sits inset in the top-left, clear of the data.
      Data: 41 Renko bricks form a zigzag price path from ~140 up to ~161, back down to ~131, a small consolidation, then down to ~113 and a final small rally. Bullish bricks are #009E73 (brand green), bearish bricks are #AE3030 (matte red), each with a small visible gap between adjacent bricks.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/axis-label/tick-label layout as the light render, now rendered in light ink (title/axis labels near-white, tick labels a lighter gray-tan secondary tone) — fully legible against the dark surface. Spines, grid, and legend frame styling mirror the light render with theme-flipped tones; no dark-on-dark text anywhere.
      Data: Identical brick sequence and identical colors (#009E73 green / #AE3030 red) to the light render — only the chrome flipped, confirming theme-adaptive implementation is correct.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures.
