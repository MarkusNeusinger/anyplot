review:
  strengths:
  - Floating bricks via go.Bar base= with one trace per direction, so the legend and
    hover work natively without per-brick traces
  - Brick size stated in the y-axis title ('Price (USD) · brick = $2') rather than
    a callout in the plot area
  - Theme tokens threaded through title, ticks, grid, axis lines and legend box; both
    renders read cleanly
  - customdata + hovertemplate expose each brick's open and close in the HTML view
  - Data block uses named column constants, so the chart adapts to a real price table
  weaknesses:
  - 'SC-02 (both): a reversal brick is drawn on the same price level as the brick
    before it (e.g. bricks 3 and 4 both span $106-108, bricks 53-56 form a flat row
    at $90-92), so the chart misses C2''s one-brick-higher-or-lower staircase → place
    a reversal brick one level beyond the last brick''s open (classic two-brick reversal:
    a red brick after a green $106-108 brick spans $104-106). Likely cause: the loop
    opens every brick at base_price regardless of the previous brick''s direction.'
  - 'Suggestion: estimated date ranges on the x-axis (the Notes allow them) would
    tie the bricks back to the six-month window.'
