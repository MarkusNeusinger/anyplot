review:
  strengths:
  - 'Renko construction is correct: every brick moves one column right and one brick
    up or down, with two-brick reversals, reading as clean staircases'
  - Invisible page-coloured spacer series in a pygal StackedBar positions the bricks
    without any custom drawing
  - 'Imprint green #009E73 for bullish and Imprint red #AE3030 for bearish, identical
    in both themes, with theme-correct chrome'
  - Bricks are uniform and separated by a small gap (spacing=6), no extra layers on
    the basic variant
  - Native interactive HTML output with pygal tooltips alongside the PNG
  weaknesses:
  - 'SC-03, SC-02, DQ-03 (both): the y-axis labels do not match the bricks: each $2
    brick spans one $4 gridline step, the first brick (start price near $100) is drawn
    above the $110 label, and the upper half of the plot carries no price labels →
    every brick spans exactly one $2 brick size at its real price on a labelled axis.
    Likely cause: string y_labels (''$82''…''$110'') placed by pygal at numeric positions
    that do not correspond to the spacer heights (price − y_min); plot the spacer
    from y_min with numeric y_labels and a value_formatter adding ''$'', or set range/min_scale
    to the true price window.'
  - 'VQ-05 (both): the legend breaks into two misaligned rows — ''Bullish (up)'' centred
    on the first row, ''Bearish (down)'' alone at the left of a second row — because
    the empty-titled spacer series still takes a legend slot → one row with both entries.
    Likely cause: chart.add('''', spacer_values) participates in the legend; exclude
    it (e.g. legend_box_size / truncate, or add the spacer with a config that hides
    it from the legend) or use legend_at_bottom_columns=2.'
  - 'VQ-03 (both): legend swatches are about 10 px squares beside 44 px legend text
    and are hard to see → swatches near the text height (legend_box_size ≈ 36–44).
    Likely cause: default legend_box_size.'
  - 'VQ-01 (both): the $82 and $102 y-tick labels render visibly smaller than the
    other tick labels → one tick size for all labels. Likely cause: pygal draws them
    as ''major'' labels at major_label_font_size=44 while the others use label_font_size=56;
    set both sizes equal.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
