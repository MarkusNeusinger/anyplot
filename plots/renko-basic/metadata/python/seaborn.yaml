review:
  strengths:
  - 'Correct Renko construction on integer price levels: every brick spans exactly
    one 0.005 brick, one column per brick, reversals need two bricks of movement'
  - Theme tokens threaded through sns.set_theme rc, so all chrome flips correctly
    while brick colors stay identical in both renders
  - Brick size stated in the x-axis title instead of a separate annotation box, keeping
    the basic variant to bricks alone
  - Legend placed in the only empty corner of the data, clear of every brick
  weaknesses:
  - 'Suggestion: one ax.bar call with bottom=renko[''bottom''] and a color list could
    replace the per-brick Rectangle loop and the hand-built legend handles.'
  - 'Suggestion: an ELEVATED_BG legend fill, as in the library prompt''s theme mapping,
    would lift the legend slightly off the page.'
