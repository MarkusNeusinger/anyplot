review:
  strengths:
  - 'Correct Renko construction: one even column per brick, each one brick-step above
    or below the last, reading as diagonal staircases'
  - 'Bullish bricks in Imprint green #009E73 and bearish in Imprint red #AE3030, identical
    in both themes'
  - Theme tokens threaded through title, axis text, legend and background; both renders
    fully readable
  - Brick size derived from the data (2 % of the median close, rounded to a round
    number) and adaptable column constants
  - Native lets-plot HTML export alongside the PNG for interactive inspection
  weaknesses:
  - 'SC-02, SC-03 (both): every brick spans 4 $ on the price axis (brick 0 runs from
    99 to 103, brick 1 from 101 to 105) while the brick size and the step between
    neighbours are 2 $, so each brick covers half of its neighbour''s price range
    and C1 (each brick spans exactly one brick size) is missed → each brick spans
    exactly one brick size, 2 $ (−2 $ per brick). Likely cause: geom_tile''s height
    is relative to the y resolution of the tile centres (2 $), so height=BRICK_SIZE
    doubles it; use height=1 or geom_rect(ymin=low, ymax=low + BRICK_SIZE).'
  - 'DE-02 (both): the panel is framed on all four sides, top and right included,
    where the style guide keeps only the left and bottom spines, and the grid is drawn
    in full-strength INK on both axes → an L-shaped frame and a grid in the 0.15-alpha
    rule token. Likely cause: a full panel border from the theme plus panel_grid_major=element_line(color=INK);
    set panel_border=element_blank() and a translucent grid color.'
  - 'Suggestion: y breaks at multiples of the brick size would let the grid mark the
    brick levels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'renko-basic · python · letsplot · anyplot.ai' top left in dark ink (about 41 % of the width); 'Brick index' and 'Close price ($)' axis titles, ticks 0-70 and 85-110 in INK_SOFT; thin full-ink grid every 5 bricks and 5 $; panel framed on all four sides; legend 'Direction' with bullish/bearish swatches right.
      Data: 68 Renko bricks in diagonal staircases, bullish #009E73, bearish #AE3030, separated by page-colored gaps; each brick spans 4 $ (e.g. 99-103) while neighbours step 2 $.
