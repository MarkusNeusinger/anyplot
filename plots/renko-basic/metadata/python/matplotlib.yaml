review:
  strengths:
  - 'Correct Renko construction: a reversal needs a full two-brick move, so every
    brick sits one brick above or below the previous column and no two bricks share
    a level side by side'
  - Bricks drawn as one vectorized ax.bar per direction with bottom= and width=1-BRICK_GAP,
    giving uniform $2 bricks with a clear gap
  - Exact 3200x1800 canvas with explicit 12/10/8 pt text; chrome threads theme tokens
    so both renders are fully legible
  - Legend placed in deliberate headroom above the highest brick, clear of the data
  weaknesses:
  - 'Suggestion: label the x-axis with estimated date ranges at a few brick indices
    (the Notes allow it) so the reader sees how long each staircase took'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "renko-basic · python · matplotlib · anyplot.ai" in dark ink at top centre; x-axis "Brick index" (ticks 0-45), y-axis "Close price ($)" (ticks 85-115); subtle y-only grid; top/right spines removed; legend upper left on an elevated frame. All text dark on light and readable.
      Data: 48 Renko bricks, $2 each, one per column with a clear gap: bullish #009E73, bearish #AE3030. A rally to 110, a long fall to 84, a double bottom near 84, and a climb to 108 with a two-brick pullback at the end. Every brick is one brick above or below the last, forming diagonal staircases.
