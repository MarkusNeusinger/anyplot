review:
  strengths:
  - 'Density rendering works exactly as the spec asks: 120,000 logistic-map states
    at markerSize 1 with the brand green at 0.55 alpha make the stable branches read
    as crisp thin lines and the chaotic region as a texture of denser and sparser
    bands, with the period-3 window and smaller periodic windows showing as pale stripes,
    in both themes'
  - Full period-doubling cascade visible from the single branch at r=2.5 through the
    period-2, period-4 and period-8 splits into chaos, on a parameter axis spanning
    2.5 to 4.0, with 300 discarded transient iterations per r so no transients smear
    between branches
  - Bifurcation labels are tied to their splits by thin dashed amber marker lines
    at r = 3.0, 3.449 and 3.544; the Period-8 label is placed at the bottom so it
    does not crowd the Period-4 label, and every label sits left of its line in empty
    space without touching data
  - 'Idiomatic MUI X v9 composition: ChartsContainer with ScatterPlot, ChartsXAxis
    and ChartsYAxis, and a custom SVG overlay that reads the chart''s own scale through
    the useXScale and useDrawingArea hooks, so the marker lines sit exactly at their
    r values'
  - 'Theme handling is clean: page, ink and inkSoft tokens drive all chrome, axis
    bands are sized explicitly (height 64, width 84) so no tick label is truncated,
    and the data color is identical in both renders'
  weaknesses:
  - 'Suggestion: apply the point transparency with a sx rule on .MuiScatterChart-marker
    (fillOpacity) instead of converting the palette hex to an rgba string by hand.'
  - 'Suggestion: the label backing pills are sized from a character-count estimate
    (labelText.length * 7.6); since no label sits over data, the pills could be dropped
    entirely, which removes the estimate.'
  - 'Suggestion: tick labels at 14 px could go to 15–16 px to hold up better in the
    400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: bold dark title "bifurcation-basic · javascript · muix · anyplot.ai" centered at top (~37% width), soft-ink subtitle "120,000 points · Growth rate (r): 2.5–4"; x axis "Growth rate (r)" with ticks 2.6–4.0, y axis "Steady-state population (x)" with ticks 0.0–1.0; axis lines and ticks in inkSoft; no grid. All text readable.
      Data: logistic-map bifurcation diagram in brand green #009E73 at alpha 0.55, tiny points. Single branch from x≈0.60 at r=2.5 rising to ≈0.667 at r=3.0, splits into two, then four at r≈3.449, eight at r≈3.544, then chaos to r=4.0 with pale periodic-window stripes (period-3 window near r≈3.83) and darker curves through the cloud. Three dashed amber vertical marker lines at 3.0, 3.449, 3.544 with bold labels "Period-2 (r ≈ 3)", "Period-4 (r ≈ 3.449)" (top) and "Period-8 (r ≈ 3.544)" (bottom), each left of its line in empty space.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
