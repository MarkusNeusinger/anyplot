review:
  strengths:
  - Correct use of stairs!(...; step = :post) to render an accurate step-function
    precision-recall curve, exactly matching the spec's 'stepped line style' requirement
    rather than approximating it with lines!.
  - Average Precision is computed correctly from the (recall, precision) step points
    via the standard rectangle-sum formula and surfaced directly in the legend label.
  - Baseline reference line at the true positive class ratio (fraud rate) is included,
    dashed, and clearly labeled per spec.
  - 'Theme-adaptive chrome is implemented correctly and consistently: PAGE_BG/INK/INK_SOFT
    tokens flip between light and dark, while the brand-green data color (#009E73)
    stays identical across both renders.'
  - Canvas lands exactly on the 3200x1800 landscape target (resolution=(1600,900),
    px_per_unit=2), and Legend(fig[1,2], ax) is the idiomatic Makie pattern for a
    side legend panel.
  - Realistic, neutral fraud-detection scenario (2000 transactions, 6% base rate,
    noisy latent signal) with reproducible Random.seed!(42).
  weaknesses:
  - 'Iso-F1 reference curves (spec Notes: ''consider showing iso-F1 curves as contour
    lines'') are omitted entirely — optional per the spec wording, but would meaningfully
    strengthen data storytelling and library-mastery signal; consider adding 2-3 thin
    dashed iso-F1 contours (e.g. F1 = 0.2/0.4/0.6/0.8) as light background context.'
  - Data storytelling is limited to the curve + baseline; no visual emphasis on the
    operating point/threshold that maximizes F1, and no shaded area under the curve
    to reinforce the AP metric visually.
  - Legend column (fig[1,2]) leaves substantial empty vertical space next to a two-entry
    legend — not a hard layout fault, but a slightly imbalanced use of canvas real
    estate.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — clearly not pure white, not dark.
      Chrome: Bold black title "precision-recall · julia · makie · anyplot.ai" centered at top, fully readable. "Recall" (x-axis) and "Precision" (y-axis) labels in dark ink, clearly legible. Tick labels (0.0/0.5/1.0 on both axes) in a softer gray, still easily readable. Subtle light-gray gridlines at x=0.5 and y=0.5/1.0 visible but not distracting. Top/right spines removed; left/bottom spines present in soft gray.
      Data: Stepped precision-recall curve in brand green (#009E73), clearly visible against the light background, correctly showing the staircase shape from (0,1) down to the final low-recall/low-precision point. A dashed gray horizontal baseline line near precision≈0.06 represents the fraud rate. Legend at right lists "Precision-recall (AP = 0.65)" and "Baseline (fraud rate = 5.8%)" in dark, readable text with no frame border.
      Legibility verdict: PASS — no light-on-light issues anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels render in off-white/light ink, clearly legible against the dark background. Tick labels appear in a lighter gray tone than the light render's tick color, appropriately adapted and still easily readable. Gridlines are subtle, light, low-alpha lines that don't dominate the dark surface. Spines follow the same light-gray token as the light render's dark-ink equivalent.
      Data: The stepped curve is rendered in the identical brand green (#009E73) as the light render — confirmed same hue/saturation, only the surrounding chrome changed. The dashed baseline line is now a light gray, clearly visible against the dark background. Legend text is white/light and fully legible, no frame border.
      Legibility verdict: PASS — no dark-on-dark failures; all text and lines maintain strong contrast against the near-black surface.
