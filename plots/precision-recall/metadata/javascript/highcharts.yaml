review:
  strengths:
  - 'Fully resolves all three weaknesses from the prior review: Y-axis dead space,
    undersized iso-F1 labels, and missing operating-point callout'
  - Correctly reimplements sklearn's threshold-sweep PR-curve algorithm (sorted scores,
    cumulative TP/FP) rather than approximating the shape
  - Iso-F1 reference curves and a best-F1 callout point are genuine bonus features
    beyond the spec's baseline ask
  - Deterministic LCG-based data generation, no external RNG or fetch calls
  - Theme-adaptive chrome throughout with data colors held constant between light/dark
  weaknesses:
  - 'LM-02 remains generic: the per-point dataLabel/marker technique used for the
    best-F1 callout could be replicated in most charting libraries with minor syntax
    changes; a Highcharts-distinctive feature (e.g. xAxis.plotLines/plotBands for
    the baseline) would push this higher'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white, not dark.
      Chrome: Dark bold title "precision-recall · javascript · highcharts · anyplot.ai" centered at top, clearly legible. Axis titles "Recall" (x) and "Precision" (y) in medium-gray ink, readable. Y-axis tick labels now run cleanly 0 to 1 (the previous 1.2 dead-space gridline is gone — endOnTick:false + max:1.0 fixed it). Only horizontal gridlines, subtle and light. Legend at bottom: "Precision-Recall (AP = 0.53)" and "Baseline (prevalence = 0.12)", both readable in dark-gray text.
      Data: Main precision-recall curve rendered as a stepped area in brand green (#009E73) with light green fill, tracing from (0,1) down to (1,~0.12). A black dashed baseline sits at precision ≈ 0.12. Four dotted gray iso-F1 curves (F1=0.3/0.5/0.7/0.9) are labeled at their terminal points at a legible 13px (up from 11px in the prior attempt). A new "Best F1 = 0.53" marker + label calls out the optimal operating point directly on the curve.
      Legibility verdict: PASS. All text is dark-on-light and clearly readable; no overlap between the F1 labels, the best-F1 callout, legend, or curve.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black, not light.
      Chrome: Title, axis titles, tick labels, and legend are all rendered in light/near-white text against the dark background, clearly legible — no dark-on-dark failures observed. Gridlines and iso-F1 dotted lines use an appropriately muted light gray.
      Data: The green curve, green fill, dashed baseline (now near-white for contrast), and the "Best F1" marker/label are unchanged in hue/position from the light render — confirms data colors are identical between themes, only chrome flipped.
      Legibility verdict: PASS. No dark-on-dark or light-on-light issues; all chrome elements are clearly legible, and data colors match the light render exactly.
