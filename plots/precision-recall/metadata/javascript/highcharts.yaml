review:
  strengths:
  - Correctly reimplements sklearn's threshold-sweep PR-curve algorithm (sorted scores,
    cumulative TP/FP) rather than faking the shape
  - Average Precision score computed and surfaced directly in the legend as required
    by the spec
  - Baseline reference line at the positive-class prevalence (0.12) is present as
    a theme-adaptive dashed line
  - 'Stepped area/line rendering (step: ''left'') accurately represents the threshold-based
    nature of the curve'
  - Iso-F1 reference curves (F1 = 0.3/0.5/0.7/0.9) implemented as a bonus per the
    spec's 'consider' note, with clean end-of-line labeling instead of a cluttered
    legend
  - First categorical series is the mandated brand green (#009E73); baseline and iso-F1
    lines use theme tokens (t.ink / muted) so chrome flips correctly between themes
  - 'Realistic, neutral fraud-detection scenario: 6000 samples, 12% positive rate,
    Gaussian-separated score distributions'
  - Deterministic LCG-based data generation, no external RNG or fetch calls
  weaknesses:
  - 'Y-axis is left to auto-extend to a 1.2 gridline even though yAxis.max is set
    to 1.02 and precision can never exceed 1.0 — Highcharts'' default endOnTick rounds
    the axis up, leaving roughly the top sixth of the chart as dead space in both
    renders. Fix: set yAxis.endOnTick: false (or explicitly pick a max/tickInterval
    combination that lands exactly on 1.0, e.g. max: 1.0, tickInterval: 0.2 with endOnTick:
    false) so the plotted area isn''t wasted.'
  - Iso-F1 curve end labels are set at 11px, notably smaller than every other chrome
    text element (14-16px) — bump to ~12-13px for visual consistency without adding
    clutter.
  - 'Design Excellence is solid but stops short of full marks: no explicit annotation/callout
    calling out the AP value or a key operating point on the curve itself, which would
    strengthen the data storytelling beyond what the legend text alone provides.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white, not dark.
      Chrome: Dark bold title "precision-recall · javascript · highcharts · anyplot.ai" centered at top, clearly legible. Axis titles "Recall" (x) and "Precision" (y) in medium-gray ink, readable. Tick labels (0, 0.2, 0.4, ... 1.2 on y; 0, 0.2, ... 1 on x) in soft ink, all legible. Only horizontal gridlines are drawn (subtle, light gray), no vertical gridlines — clean. Legend at bottom: "Precision-Recall (AP = 0.53)" and "Baseline (prevalence = 0.12)", both readable in dark-gray text.
      Data: Main precision-recall curve rendered as a stepped area in brand green (#009E73) with light green fill (~15% opacity), starting near (0, 1) with the characteristic early precision drop, tracing a jagged monotonic-ish decline to (1, ~0.12). A black dashed horizontal baseline sits at precision ≈ 0.12. Four dotted gray iso-F1 reference curves (labeled F1=0.3/0.5/0.7/0.9) arc across the upper-right region, each labeled once at its terminal point. First series correctly uses the brand green.
      Legibility verdict: PASS. All text is dark-on-light and clearly readable; no overlap between the F1 labels, legend, or curve.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black, not light.
      Chrome: Title, axis titles, and tick labels are all rendered in light/near-white text against the dark background, clearly legible — no dark-on-dark failures observed. Gridlines are subtle light gray, visible without dominating. Legend text is light-gray, readable against the dark background.
      Data: The green curve, green fill, and dashed baseline (now rendered in near-white for contrast) are unchanged in hue/position from the light render — confirms data colors are identical between themes, only chrome (background, text, baseline color, gridlines) flipped. Iso-F1 dotted lines use a lighter muted gray appropriate for the dark surface.
      Legibility verdict: PASS. No dark-on-dark or light-on-light issues; all chrome elements are clearly legible, and data colors match the light render exactly.
