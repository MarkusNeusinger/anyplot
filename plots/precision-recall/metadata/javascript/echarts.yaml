review:
  strengths:
  - Precision/recall computed correctly via a descending-score threshold sweep with
    cumulative TP/FP counts, and Average Precision computed as the proper step-function
    sum of precision times delta-recall
  - 'Palette compliance verified at the pixel level: the curve renders as rgb(0,158,115)
    = #009E73 identically in both light and dark PNGs, and page backgrounds are exact
    matches for #FAF8F1 / #1A1A17'
  - Realistic, neutral fraud-detection scenario (2000 transactions, 8% fraud rate,
    noisy score distributions) that plausibly produces the shown AP = 0.74 curve shape
  - 'Stepped line (step: "start") accurately represents the threshold-based curve
    as required by the spec, with showSymbol disabled to avoid clutter across ~1800
    threshold points'
  - Subtle area fill under the curve and a dashed, theme-adaptive-ink baseline give
    the chart a clear focal point and an easy visual comparison against the random-classifier
    baseline
  - 'Clean, reproducible code: single fixed-seed LCG, no unused imports/dependencies,
    correct mount-node contract (animation: false, no explicit size/devicePixelRatio)'
  - Canvas is exactly 3200x1800 with no clipped or overflowing elements in either
    render
  weaknesses:
  - The random baseline is implemented as a second full line series (with its own
    legend entry and area-less line) rather than ECharts' idiomatic markLine — a markLine
    would better signal 'reference line' semantics and is a more distinctive use of
    the library's API
  - Chrome styling (grid, axis lines, spines) relies mostly on ECharts defaults with
    the theme tokens plugged in; there's little additional deliberate visual refinement
    beyond the required token mapping (e.g. no markArea shading for precision/recall
    quality bands)
  - The spec's optional suggestion to overlay iso-F1 contour curves for reference
    was not attempted, which would have added an extra layer of analytical value
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, verified by pixel sample at (10,10) = rgb(250,248,241) = #FAF8F1, matches spec exactly.
      Chrome: title "precision-recall · javascript · echarts · anyplot.ai" in bold dark ink, centered top; legend below title with two entries ("Fraud classifier (AP = 0.74)" and "Random baseline") in dark ink text; axis names "Recall" (x, bottom-center) and "Precision" (y, rotated) in dark ink; tick labels in softer gray-ink; subtle light-gray gridlines on both axes. All text is clearly readable against the light background.
      Data: fraud classifier curve is a brand-green (#009E73) step line with a light green area fill beneath it, no point markers (appropriate given ~1800 dense threshold points); random baseline is a black dashed horizontal line at the ~0.08 positive-class ratio.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, verified by pixel sample at (10,10) = rgb(26,26,23) = #1A1A17, matches spec exactly.
      Chrome: same title and legend text now rendered in white/light-ink, fully legible; axis names in white ink; tick labels in a lighter soft-gray; gridlines are subtle light gray, still visible against the dark surface. No dark-on-dark or unreadable text anywhere.
      Data: fraud classifier curve confirmed via pixel sample at the same curve location to be the identical rgb(0,158,115) = #009E73 as the light render (only the area-fill perception differs due to the darker backdrop, not the underlying hex value); random baseline dashed line flips to white (theme-adaptive ink used for the neutral reference line, not part of the categorical data palette, which is the documented convention for baseline/reference series).
      Legibility verdict: PASS
