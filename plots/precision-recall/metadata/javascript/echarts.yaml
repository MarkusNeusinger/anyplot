review:
  strengths:
  - First-series brand green (#009E73) used consistently for the classifier curve
    on both themes, per Imprint palette rules
  - Idiomatic use of ECharts markArea + markLine to surface the Average Precision
    value and the random-classifier baseline directly on the chart instead of adding
    extra series
  - 'Correct stepped line style (step: "start") accurately represents the threshold-based
    precision-recall curve as required by the spec'
  - Deterministic fixed-seed LCG data generation with a realistic, neutral fraud-detection
    scenario (2000 samples, 8% fraud rate)
  - 'Clean theme-adaptive chrome: title, axis names, tick labels, grid, and baseline
    line all correctly threaded through window.ANYPLOT_TOKENS with no dark-on-dark
    or light-on-light failures'
  - 'showSymbol: false is the right call for a dense 2000+ point curve; avoids marker
    clutter while keeping the line clearly visible'
  weaknesses:
  - The markArea rectangle spans the full recall range (0 to 1) at height AP=0.74,
    which reads as a flat reference band rather than the true area under the PR curve
    — it visually overlaps the actual areaStyle fill under the curve, so two different
    shaded meanings (true curve area vs. AP reference band) coexist in the same green
    tint and could momentarily confuse a viewer. Consider a thin horizontal marker
    line at y=AP with just the label, or a distinctly different color/hatch for the
    AP band so it doesn't blend with the curve's own area fill.
  - Design excellence is solid but not exceptional — the chart is fundamentally a
    well-executed default step-line plot; consider a bit more visual hierarchy (e.g.
    de-emphasizing the AP band or emphasizing the knee of the curve) to lift it further
    above a competent baseline.
  - iso-F1 contour reference curves are optional per spec ("Consider showing...")
    and were not included — acceptable, but would have been a nice differentiator
    for LM-02.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "precision-recall · javascript · echarts · anyplot.ai" bold and centered at top, clearly readable in dark ink. Legend "Fraud classifier (AP = 0.74)" below title, readable. Axis names "Recall" (x, middle) and "Precision" (y, middle) both legible dark text. Tick labels (0, 0.2, ... 1 on both axes) legible in soft gray-ink. Grid lines subtle, visible but not dominant.
      Data: Stepped green (#009E73) line from (0,1) down to (1,~0.19), with a light green area fill under the curve. A secondary lighter/darker banded region from y=0 to y=0.74 spans the full x-range with an "AP = 0.74" label at upper-left inside it. A black dashed horizontal "Random baseline" line sits near y=0.08 with its label at the right end. All elements clearly distinguishable from the light background.
      Legibility verdict: PASS — no light-on-light issues, all text readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, legend, axis names, and tick labels all rendered in light/white text, clearly legible against the dark background. Grid lines subtle white/gray, visible without dominating.
      Data: Curve color is identical #009E73 green to the light render (confirmed same hue/saturation). The AP shaded band and "AP = 0.74" label render in muted light-gray text, legible. The dashed baseline line switches to white/light dashes with "Random baseline" label in light gray — clearly visible against the dark background, no dark-on-dark failure.
      Legibility verdict: PASS — no dark-on-dark issues, all text and the dashed baseline line are clearly visible.

    Cross-render check: data curve color (#009E73) is pixel-identical between the two renders; only chrome (background, text, grid, dashed-line color) adapts to theme, as required.
