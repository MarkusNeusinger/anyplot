review:
  strengths:
  - 'Area fill under the curve (fill: "origin") plus a custom Chart.js plugin (afterDatasetsDraw)
    drawing a leader-line callout for the best-F1 point turns the previously plain
    line chart into an intentional, polished composition with a clear focal point'
  - Three iso-F1 reference curves (F1 = 0.3 / 0.5 / 0.7) were added, directly fulfilling
    the spec's 'consider showing iso-F1 curves' note and adding real interpretability
    beyond the baseline line
  - 'The custom plugin registration (`plugins: [apCalloutPlugin]`) is idiomatic, distinctive
    Chart.js usage that couldn''t be replicated with basic line-chart configuration
    alone'
  - 'Theme-adaptive chrome is fully correct and consistent with the prior attempt:
    identical brand-green data color between light and dark renders, only chrome flips'
  - Deterministic seeded LCG + Box-Muller data generation remains reproducible across
    runs
  weaknesses:
  - The 3 iso-F1 dotted curves carry no visible label anywhere in the static render
    (they're intentionally filtered out of the legend and have no inline text) — a
    reader can't tell which curve is F1=0.3 vs 0.7 from the PNG alone, undercutting
    their value as a 'reference'. Add small inline text labels near each curve's terminus
    (e.g. 'F1=0.3') via the existing custom plugin, or surface them in the legend
    instead of filtering them out
  - Code has grown to five helper functions plus a custom plugin object (makeLcg,
    gaussian, isoF1Curve, hexToRgba, apCalloutPlugin) — reasonable given the feature
    set (no seeded RNG or canvas drawing helpers in the browser), but it's drifting
    from a pure top-to-bottom KISS script
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "precision-recall · javascript · chartjs · anyplot.ai" in dark ink, centered top, occupying only ~30% of canvas width (well within bounds, no overflow); "Recall"/"Precision" axis titles in dark ink; tick labels (0, 0.2, ... 1.0 on both axes) in softer dark gray; legend top-right with "Diagnostic test (AP = 0.82)" and "Baseline (prevalence = 0.12)" in dark ink; subtle light-gray gridlines. New in this attempt: a translucent brand-green fill under the PR curve, three dotted grey iso-F1 reference curves, and a bold dark-ink callout "Best F1 = 0.80 (AP = 0.82)" with a leader line pointing to a green-dot marker on the curve. All chrome and the callout text are clearly readable against the light background; no overlap between the callout and the legend, curve, or iso-F1 lines.
      Legibility verdict: PASS — no light-on-light issues, no clipped text, no overlapping elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white, clearly legible; legend text also light-colored; gridlines subtle and low-opacity. The area fill, iso-F1 dotted curves, and best-F1 callout are all present and rendered in light-toned equivalents (white/light-grey dotted lines, white callout text) — clearly visible against the dark surface.
      Data: Brand-green (#009E73) stepped line and fill — confirmed identical hue to the light render (only chrome flipped); baseline dashed line and iso-F1 curves rendered in a lighter grey so they still read against the dark surface.
      Legibility verdict: PASS — no dark-on-dark text, no unreadable elements; brand green and the callout text remain vivid and legible on the dark surface.
