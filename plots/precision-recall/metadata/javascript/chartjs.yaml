review:
  strengths:
  - 'Accurate stepped-line rendering (`stepped: "after"`) faithfully represents the
    threshold-based nature of a precision-recall curve'
  - Average Precision (AP) score cleanly surfaced in the legend label
  - Baseline reference line (dashed, at the positive-class prevalence) gives the reader
    a random-classifier comparison point
  - Full theme-adaptive chrome — identical brand-green data color between light and
    dark renders, only chrome flips
  - Deterministic synthetic data via a small seeded LCG + Box-Muller gaussian, reproducible
    across runs
  weaknesses:
  - No iso-F1 reference curves — the spec notes suggest showing them as F1-score contour
    lines; would add real interpretability value on top of the baseline line
  - 'Visual treatment is fairly plain/default: no area fill under the curve, no annotation/callout
    marking the AP value or the curve''s knee — Design Excellence reads as generic
    rather than intentional'
  - Only a single classifier is shown; fine for this spec's data, but no visual precedent
    is set for how a second series would be distinguished (color-only vs. also varying
    line style)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "precision-recall · javascript · chartjs · anyplot.ai" in dark ink, centered top; "Recall"/"Precision" axis titles in dark ink; tick labels (0, 0.2, 0.4, ... 1.0 on both axes) in softer dark gray; legend top-right with two entries ("Diagnostic test (AP = 0.82)" and "Baseline (prevalence = 0.12)") in dark ink; subtle light-gray gridlines on both axes. All chrome clearly readable against the light background.
      Data: Brand-green (#009E73) stepped line for the PR curve, starting at (0,1) and stepping down to (~1, ~0.12); dark dashed horizontal line at y≈0.12 for the baseline. Colors read clearly against the cream background.
      Legibility verdict: PASS — no light-on-light issues, no clipped text, no overlapping elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white, clearly legible against the dark background; legend text also light-colored; gridlines are subtle light lines at low opacity.
      Data: Same brand-green (#009E73) stepped line — confirmed identical to the light render (only chrome flipped); baseline dashed line rendered in a lighter gray so it still reads against the dark surface.
      Legibility verdict: PASS — no dark-on-dark text, no unreadable elements; brand green remains vivid on the dark surface.
