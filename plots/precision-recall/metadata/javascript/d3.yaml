review:
  strengths:
  - Correct threshold-sweep stepped PR curve using d3.curveStepAfter, faithfully representing
    the threshold-based nature the spec calls for
  - Average Precision (AP = 0.71) computed from the curve and displayed in the legend
    as required
  - No-skill baseline reference line included, correctly derived from the realized
    fraud rate in the generated sample (9.3%)
  - Bonus iso-F1 contour lines (F1 = 0.4 / 0.6 / 0.8) add real analytical value, exactly
    what the spec's 'consider showing' note asks for, without cluttering the main
    curve thanks to lower opacity and dashing
  - 'Strong visual hierarchy: thick solid green primary curve vs. thin dashed/dotted
    gray reference lines guides the eye straight to the classifier performance'
  - Theme-adaptive chrome is fully correct in both renders; data color (#009E73) is
    pixel-identical between light and dark, backgrounds match FAF8F1/1A1A17
  - Realistic, neutral fraud-detection scenario with deterministic seeded data generation
    (LCG + Box-Muller)
  weaknesses:
  - Several standalone helper functions (rand, gaussian, sigmoid, isoF1Points) drift
    from the KISS 'no functions' ideal — largely unavoidable given the browser has
    no seeded-RNG/stat stdlib, but isoF1Points could be inlined for a slightly flatter
    script
  - The dashed F1=0.8 iso-curve and the y-axis domain line show a couple of pixels
    of stroke bleed just above the y=1.0 gridline (no clip-path on the plot group)
    — cosmetic only, not clipping any text/data, but a clip-path would tidy the top
    edge
  - Design stays within a single-hue treatment (green + grays); a touch more typographic
    or color refinement could push aesthetic sophistication further toward top-tier
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "precision-recall · javascript · d3 · anyplot.ai" in bold dark ink, centered and fully visible; "Recall" (x-axis) and "Precision" (y-axis) labels in dark ink; tick labels (0.0-1.0 steps of 0.2) in soft dark gray; subtle horizontal gridlines only (y-axis-only grid, as intended for a line chart); legend box top-right with a translucent cream background, rounded corners, all three entries (curve, baseline, iso-F1) clearly legible.
      Data: Primary Precision-Recall curve in Imprint green (#009E73), stepped line, thick (4.5px) and clearly the visual focal point; dashed dark-gray no-skill baseline at y≈0.093; three dotted, lower-opacity gray iso-F1 reference curves recede appropriately behind the main curve.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
