      Data: Primary curve is the identical #009E73 green as the light render (confirmed pixel-for-pixel same hue); baseline and iso-F1 reference lines use the same dash patterns and relative gray tones, appropriately de-emphasized on the dark surface too.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or unreadable elements found.
