review:
  strengths:
  - Precision-recall points come from every distinct score threshold, with tied scores
    grouped. The stepBefore curve gives each precision P_n the recall interval (R_(n-1),
    R_n], which matches the AP sum (R_n - R_(n-1)) * P_n computed on lines 65-67,
    so the drawn area and the AP in the legend agree
  - The random-classifier baseline uses MUI X's native ChartsReferenceLine as a dashed
    inkSoft line at 0.040 (24/600 positives, derived from the data). It has its own
    inline label and reads clearly in both themes
  - Each curve's AP sits in its own legend label ('Gradient boosting (AP = 0.90)',
    'Logistic regression (AP = 0.18)'), so it is clear which curve each value belongs
    to
  - 'Each series has its own linked x axis (xAxisId), one of them hidden with position:
    ''none'', so the two curves can carry different recall arrays inside one LineChart.
    This is an idiomatic v9 composition'
  - 'The data is plausible and imbalanced: 600 card transactions with 4 % fraud. One
    strong and one weak classifier make the contrast between the curves clear at a
    glance'
  - Theme chrome comes entirely from ANYPLOT_TOKENS (ink, inkSoft, grid); the data
    colors are palette[0] and palette[1] in both renders; skipAnimation is set
  weaknesses:
  - 'Suggestion: faint iso-F1 contours (for example F1 = 0.2/0.4/0.6/0.8), each labeled
    with its value, would give a reference for the trade-off; the Notes only offer
    them as optional.'
  - 'Suggestion: the vertical grid at every 0.1 recall, together with the horizontal
    grid, is fairly dense behind the stepped lines; horizontal-only gridlines would
    let the steps stand out more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas (3200x1800).
      Chrome: bold dark title "Fraud Detection · precision-recall · javascript · muix · anyplot.ai" (~42 % width), with a softer-ink subtitle "600 transactions · 24 positives (4.0 %) · step curves through every score threshold". Axis titles "Recall" (x) and "Precision" (y), tick labels 0.0–1.0 in steps of 0.1 on both axes, a subtle grey grid in both directions, and a horizontal legend at the bottom. All text is readable.
      Data: Gradient boosting (#009E73 green) holds precision 1.0 up to recall ~0.46, then steps down through 0.92–0.84 and drops to 0.48 at recall ~0.96. Its last vertical segment at recall 1.0 falls to the baseline. Logistic regression (purple, second Imprint position) falls quickly from 1.0 to 0.5 at recall 0.04, shows a sawtooth between 0.36 and 0.10, and flattens around 0.05–0.08 near the baseline. Short vertical stubs at the steps are real tied-recall threshold points. The baseline is a dashed inkSoft line at 0.040, labeled "Random classifier: precision = positive rate 0.040" at the left. The legend reads "Gradient boosting (AP = 0.90)" and "Logistic regression (AP = 0.18)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels, baseline label and legend text are all light ink. The grid is subtle but visible. No dark-on-dark text.
      Data: the green and purple curves are identical to the light render; only the chrome flipped. The dashed baseline renders light grey and stays clearly visible.
      Legibility verdict: PASS
