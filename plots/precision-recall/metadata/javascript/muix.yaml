review:
  strengths:
  - 'Clean, theme-correct Imprint palette usage — first series is #009E73 (gradient
    boosting), second series follows canonical order (#C475FD, logistic regression);
    backgrounds and text are correctly warm off-white / near-black in each theme.'
  - Precision-recall math is computed correctly from raw scores (sorted-threshold
    sweep with tie handling) and rendered with curve="stepAfter", accurately matching
    the spec's requirement for a stepped, threshold-based line style.
  - Average Precision is computed and shown directly in the legend for both classifiers,
    and a dashed baseline reference line (ChartsReferenceLine) marks the random-classifier
    precision — both explicit spec requirements.
  - Realistic, neutral fraud-detection scenario with a genuinely imbalanced 6% positive
    rate, and two clearly contrasting classifiers (AP = 0.90 vs AP = 0.18) that visibly
    demonstrate strong vs weak model behavior — good DQ-01 feature coverage.
  - Deterministic LCG + Box-Muller data generation (seed 42), no functions/classes
    beyond the necessary curve-math helpers and the mandatory default-exported component.
  weaknesses:
  - 'Iso-F1 contour reference curves (spec: ''Consider showing iso-F1 curves as contour
    lines'') are not included — optional per spec wording, but would add extra reference
    value.'
  - Title occupies only ~35-40% of canvas width at fontSize 21 — well below the ~70-85%
    naturally expected for the mandated title format; not a legibility problem, but
    a slightly larger title font would give it more visual presence.
  - Design execution is solid but still reads as a well-configured default rather
    than a distinctive/polished chart — e.g. no fill-under-curve or emphasis technique
    differentiates the strong classifier's dominant region from the weak one beyond
    color and shape.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white.
      Chrome: Title "Fraud Detection · precision-recall · javascript · muix · anyplot.ai" centered at top in dark ink, fully visible, not clipped. Axis labels "Recall" (x) and "Precision" (y) in dark ink, tick labels 0.0-1.0 on both axes, subtle horizontal-only gridlines. Legend at bottom-center with two color swatches and AP values in legend text. Dashed baseline reference line near the bottom with "Random classifier (baseline)" label in muted gray ink.
      Data: First series (gradient boosting) is #009E73 brand green, second series (logistic regression) is a light purple/violet from the Imprint palette (#C475FD). Both drawn as step-after (staircase) lines matching the threshold-based PR-curve convention. Green curve stays near 1.0 precision for most of the recall range then drops sharply near recall=0.9; purple curve drops quickly from precision 1.0 to under 0.1 within the first ~40% of recall, consistent with a much weaker classifier.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, and legend layout as the light render, all rendered in light/off-white ink against the dark background. Gridlines are a subtle dark gray, still visible. Baseline dashed line and its label are rendered in a lighter muted gray, legible against the dark backdrop.
      Data: Identical colors to the light render — #009E73 green and the same light purple — confirming chrome-only theme adaptation with no shift in data-series hues.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; every text element (title, axis labels, tick labels, legend, baseline annotation) is clearly legible against the dark surface.
