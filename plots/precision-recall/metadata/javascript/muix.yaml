review:
  strengths:
  - Correct precision-recall math implemented from scratch (rank by score, cumulative
    TP/FP, right-continuous step lookup) and resampled onto a shared recall grid for
    a fair two-classifier comparison
  - Average Precision correctly computed and surfaced in the legend for both classifiers
    (AP = 0.90 vs AP = 0.18)
  - Baseline reference line at the true positive rate via ChartsReferenceLine, matching
    the spec's random-classifier requirement
  - curve="stepAfter" correctly represents the threshold-based, staircase nature of
    a PR curve
  - 'The two classifiers tell a clear story: gradient boosting stays near-perfect
    precision until high recall, logistic regression degrades immediately — a realistic
    strong-vs-weak comparison'
  - 'Correct Imprint palette usage (first series #009E73, second series the canonical
    violet) and theme-correct chrome in both light and dark renders'
  - Fraud-detection framing with a realistic 6% positive rate is a neutral, comprehensible,
    on-spec use case for an imbalanced-classification metric
  - Deterministic data generation via a seeded LCG + Box-Muller, no external RNG dependency
  weaknesses:
  - Y-axis title "Precision" visually overlaps the "0.5" tick label in BOTH renders
    (the descender of the rotated 'n' in 'Precision' touches the '0' of '0.5') — increase
    the left margin (currently 110) or add explicit spacing between the y-axis label
    and its tick labels via slotProps/axis label positioning so the two never collide.
  - 'Design excellence is solid but not exceptional: consider a subtle fill/shade
    under the gradient-boosting curve or a callout near its late-recall drop to sharpen
    the visual hierarchy and push Data Storytelling further.'
  - The spec suggests (optional) iso-F1 contour curves as a reference — not required,
    but adding faint iso-F1 lines would strengthen Library Mastery and Data Storytelling
    for a repair pass.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Fraud Detection · precision-recall · javascript · muix · anyplot.ai" is centered at top in dark ink, fully legible. Axis titles "Recall" (x) and "Precision" (y) and tick labels (0.0-1.0 on both axes) are dark and readable against the light background, EXCEPT the rotated "Precision" axis title visually touches the "0.5" tick label — a minor overlap, both strings remain individually legible. Horizontal gridlines are subtle light gray, non-dominant.
      Data: First series (gradient boosting) renders in brand green #009E73, staying near precision=1.0 until recall≈0.45 before stepping down in stages to ≈0.48 at recall=1.0. Second series (logistic regression) renders in violet/purple, dropping sharply from 1.0 to ≈0.5 immediately and continuing to decay toward the baseline. A dashed gray "Random classifier (baseline)" reference line sits at precision≈0.06. Legend at bottom center shows both series with AP scores (0.90 and 0.18).
      Legibility verdict: PASS (with a minor overlap noted above — not severe enough to make either label unreadable).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white ink, fully legible against the dark background. Axis titles and tick labels are light-colored and readable; gridlines are subtle. The same "Precision" / "0.5" tick-label overlap reproduces identically here (chrome-only difference, not a data-color difference).
      Data: Data colors are pixel-identical to the light render — green #009E73 for gradient boosting, violet for logistic regression — confirming only chrome flipped between themes. Baseline dashed line and legend match the light render's layout and values.
      Legibility verdict: PASS (same minor axis-label/tick-label overlap as light render; no dark-on-dark or light-on-light failures).
