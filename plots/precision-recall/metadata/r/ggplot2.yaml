review:
  strengths:
  - 'Perfect Imprint palette + theme-adaptive chrome in both renders: Tuned model
    is #009E73 (brand green), Baseline model is #C475FD (canonical position 2), data
    colors identical across light/dark, all chrome (text, grid, legend) correctly
    flips theme with no dark-on-dark or light-on-light failures'
  - 'Every spec note implemented: AP scores in the legend (0.99 / 0.54), a dashed
    baseline reference line at the true positive rate (0.05), a stepped geom_step
    curve for the threshold-based PR curve, iso-F1 reference curves with inline labels,
    and a clear two-classifier comparison'
  - 'Clever off-canvas layout: coord_cartesian(clip=''off'') plus asymmetric x-scale
    expansion place the F1 labels in reserved margin space to the right of recall=1.0
    without any edge clipping'
  - 'Strong data storytelling: the near-perfect tuned-model curve (green, hugging
    the top) versus the steadily declining baseline (purple) makes the message legible
    at a glance, reinforced by the AP numbers'
  - Realistic, factually sound fraud-detection scenario (5% positive rate, i.e. rare
    fraud events) with reproducible data generation (set.seed(42))
  - 'Clean idiomatic ggplot2: dplyr/tidyr pipeline for PR-curve math, theme_minimal
    + targeted theme() overrides, scale_color_manual/scale_linetype_manual for a merged
    legend, ragg::agg_png output'
  weaknesses:
  - Iso-F1 labels (geom_text size=2.6) and legend text sit near the small end of the
    readable range — legible at full resolution and at the 400px mobile preview, but
    with little margin to spare; a touch larger would be safer
  - The linetype legend ('Baseline (random)') and the color legend (model names) are
    stacked as two separate auto-generated legends rather than one deliberately composed
    block — reads fine here but is a slightly accidental layout rather than an intentional
    one
  - 'Library mastery is solid but generic: the layered geom composition (iso-F1 lines
    + baseline + stepped curves) is idiomatic ggplot2 but is not a feature unique
    to the library — the same visual could be built in another grammar-of-graphics-style
    API with only minor changes'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "Fraud Detection Model Comparison · precision-recall · r · ggplot2 · anyplot.ai" in dark ink at the top, fully visible with no clipping; "Recall" (x) and "Precision" (y) axis titles and 0.00-1.00 tick labels in dark/soft-dark ink, all clearly readable; subtle light-gray gridlines at both major ticks; a two-part legend (dashed "Baseline (random)" line, then colored "Tuned model (AP = 0.99)" / "Baseline model (AP = 0.54)" swatches) sits inside the lower-left of the plot with no overlap with data.
      Data: The tuned-model curve is brand green (#009E73), rendered as a bold stepped line that hugs precision ≈ 1.0 across nearly the full recall range before a sharp late drop. The baseline-model curve is lavender/purple (#C475FD, Imprint position 2), a stepped line declining steadily from ~1.0 precision at low recall down to ~0.05 at recall = 1.0. A dashed gray horizontal reference line marks the random-classifier baseline at precision = 0.05. Four dotted muted-gray iso-F1 contour curves (F1 = 0.2/0.4/0.6/0.8) arc through the plot with inline labels placed just past recall = 1.0, in reserved margin space, with no clipping at the canvas edge.
      Legibility verdict: PASS — all text is clearly readable against the light background; smallest text (iso-F1 labels, legend) is legible though close to the lower size bound.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (near-white / soft light gray), fully legible against the dark surface; gridlines are a faint light gray; legend text is light-colored and readable; no dark-on-dark failures anywhere (title, axis text, tick labels, legend text, and iso-F1 labels are all clearly distinguishable from the near-black background).
      Data: Tuned-model and baseline-model curves are the identical #009E73 green and #C475FD lavender as the light render — confirmed unchanged. The dashed reference line and dotted iso-F1 curves use the same muted-gray tone, which still reads clearly against the dark background.
      Legibility verdict: PASS — all text and data elements are readable in the dark theme; no dark-on-dark or light-on-light issues detected.
