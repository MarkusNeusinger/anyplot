review:
  strengths:
  - Theme tokens threaded through sns.set_theme(rc=...) so title, ticks, spines, grid
    and legend box all flip correctly between the light and dark renders
  - Curves and AP are computed with sklearn's precision_recall_curve and average_precision_score
    and drawn as true post-steps, so the sawtooth at low recall is faithful
  - Each legend entry carries its model's AP and the baseline entry its positive ratio,
    making the ranking readable without annotations
  - Exact 3200x1800 canvas with the style guide's reference font sizes, and an adaptable
    data block with column constants that tolerates missing scores per model
  weaknesses:
  - 'VQ-03 (both): Model C''s curve lies on the dashed random-classifier baseline
    from about recall 0.25 to 1.0 and covers its dashes, so the baseline is hard to
    tell apart there → keep the weakest model visibly above the baseline (about +0.03
    precision) through the data. Likely cause: Model C''s scores drawn from the same
    beta(2, 2) for both classes.'
  - 'DQ-02 (both): the classifiers are labelled Model A, Model B and Model C, which
    read as generic in a fraud-detection scenario → name plausible model types (for
    example Gradient boosting, Logistic regression, Rule-based screen). Likely cause:
    the SCORES constant list.'
  - 'LM-01 (code): every mark is drawn with matplotlib''s ax.step and ax.fill_between
    while seaborn only sets the theme and despines → draw the curves from a tidy recall/precision
    frame with sns.lineplot(data=..., x=..., y=..., hue=model, estimator=None, sort=False,
    drawstyle=''steps-post'', palette=IMPRINT_PALETTE[:n]). Likely cause: the per-model
    loop around ax.step.'
  - 'Suggestion: drop or lighten the stacked area fills, whose overlapping tints blend
    Model B''s region into a grey-violet that no legend entry explains.'
  - 'Suggestion: faint iso-F1 contours behind the curves, each labelled with its F1
    value, which the Notes invite.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and axes.
      Chrome: title "precision-recall · python · seaborn · anyplot.ai" in dark ink at the top centre; x-axis "Recall (sensitivity)" 0.0-1.0, y-axis "Precision (positive predictive value)" 0.0-1.0; dark-grey ticks, left and bottom spines only, subtle horizontal grid; legend upper right on an elevated cream box. All text readable.
      Data: three stepped PR curves with translucent fills: Model A #009E73 (AP 0.81) falling from 1.0 to about 0.25, Model B #C475FD (AP 0.32) with a sawtooth at low recall falling to about 0.12, Model C #4467A3 (AP 0.12) hugging the dashed dark-grey baseline at P = 0.10 for most of the recall range.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and legend text in light ink, ticks and spines light grey, grid faint; legend box #242420 with light border. No dark-on-dark text.
      Data: identical curve colors and shapes to the light render; baseline dashes now light grey and visible; fills read darker against the dark surface.
      Legibility verdict: PASS
