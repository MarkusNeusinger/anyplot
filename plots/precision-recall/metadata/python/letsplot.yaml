  strengths:
  - Correct stepped PR curve through computed threshold points with AP 0.920 in the
    legend, clearly tied to the curve
  - Horizontal dashed random baseline at the 20% positive ratio, labeled, in a distinct
    Imprint hue and linetype
  - Faint dotted iso-F1 contours, each labeled with its F1 value, subordinate to the
    curve
  - Theme tokens threaded through all chrome; both renders readable and data colors
    identical
  - Correct 3200x1800 canvas via ggsize(800, 450) + scale 4, plus HTML export
  weaknesses:
  - 'VQ-02 (both): the ''F1=0.6'' label at recall ~0.96, precision ~0.47 is crossed
    by the PR curve''s horizontal step at precision 0.47, and ''F1=0.8'' sits on the
    curve''s steps near precision 0.67 → place the iso-F1 labels where their contour
    is clear of the PR curve (e.g. at the contour''s upper-left end or at a recall
    where the curve is far away), no text touching the curve. Likely cause: f1_labels
    anchored at each contour''s right end (x[keep][-1] - 0.035), where the curve drops
    through them.'
  - 'SC-01 (both): an unrequested filled band under the curve (geom_area, alpha 0.2)
    tints the whole panel and the iso-F1 contours behind it → remove the area fill;
    the stepped line alone carries the curve. Likely cause: geom_area(data=df_curve,
    ...) on line 108.'
  - 'DE-02 (both): the panel keeps a dark four-sided frame (top and right spines drawn)
    → L-shaped frame (left and bottom only) or none, per the style guide''s Spines
    rule. Likely cause: theme_minimal() axis/panel border defaults not overridden
    (panel_border / axis_line).'
  - 'DQ-02 (both): the series is named only ''Classifier'' with no application → name
    a concrete model from the spec''s applications, e.g. ''Fraud detector (AP = 0.920)''.
    Likely cause: the ''model'' label string in df_curve.'
  - 'CQ-04 (code): lines 53-63 hand-roll the descending sort, cumulative TP/FP, precision,
    recall and AP → sklearn.metrics.precision_recall_curve(y_true, y_score) and average_precision_score(y_true,
    y_score). Likely cause: manual threshold loop instead of the available call.'
  - 'Suggestion: let the y axis end at 1.0 from the data instead of the typed limit
    1.05, which leaves an empty 1.1 tick row.'
