review:
  strengths:
  - Precision-recall curve and AP come straight from sklearn's precision_recall_curve
    and average_precision_score, and ax.step(where='post') matches sklearn's own steps-post
    display, so the curve runs through its computed threshold points without smoothing.
  - The random-classifier baseline is a horizontal line at the computed positive share
    (20 %), drawn in INK with a dash pattern, so it reads clearly against the green
    curve in both themes and its legend entry states the value.
  - Iso-F1 curves (0.2–0.8) are faint dotted INK_MUTED lines at zorder 1, each labelled
    at the point where it meets precision 1, with ylim headroom (1.08) reserved for
    those labels, so they stay subordinate to the curve.
  - The legend reorders its handles so the classifier entry with its AP comes first
    and the baseline second, and sits in the empty lower-left corner below the baseline.
  - Theme tokens are threaded through every chrome element (title, labels, ticks,
    spines, grid, legend frame and text, iso-F1 labels); both renders are fully legible
    and the data color is identical.
  - The data block is a tidy df read through column constants, and the positive class
    and baseline are derived from the data rather than typed in.
  weaknesses:
  - 'Suggestion: the iso-F1 labels at 7 pt are the smallest text on the canvas and
    blur in the 400 px thumbnail; 8 pt would match the tick labels.'
  - 'Suggestion: the light-green area fill under the curve is not asked for by the
    spec; dropping it would let the iso-F1 contours and the baseline read on a clean
    background.'
