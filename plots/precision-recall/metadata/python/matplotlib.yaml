      Data: a thick #009E73 stepped PR curve at precision 1.0 up to recall ~0.54, stepping down through ~0.93 at 0.77, ~0.67 at 0.95, ~0.41 at 0.99 and dropping to 0.2 at recall 1; a faint green fill under it; a dark dashed horizontal baseline at precision 0.2; four faint grey dotted iso-F1 curves labelled "F1 = 0.2/0.4/0.6/0.8" just above precision 1. Legend lower left: "Spam filter score (AP = 0.920)", "Random classifier (precision = 20%)" on an elevated frame.
