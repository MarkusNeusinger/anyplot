review:
  strengths:
  - Stepped line through every threshold point computed by precision_recall_curve,
    with no downsampling
  - Random baseline drawn as a dashed horizontal line through pygal's per-series stroke_style,
    distinct from both model curves in both themes
  - Average Precision in each legend label, tied unambiguously to its curve
  - Theme tokens threaded through pygal's Style so all chrome flips correctly between
    light and dark
  - Library-native interactive HTML output alongside the PNG
  weaknesses:
  - 'VQ-03 (both): the legend swatches are small squares about 16 px wide beside 44
    px legend text, and the baseline''s swatch is a solid square that does not show
    its dash → swatches near the legend text height. Likely cause: pygal''s default
    legend_box_size with legend_font_size=44.'
  - 'VQ-05 (both): the legend row sits flush against the bottom canvas edge (about
    15 px margin) and each label starts directly at its swatch with no gap → at least
    about 40 px bottom margin and a visible swatch-to-text gap. Likely cause: legend_at_bottom
    with default margin_bottom and legend_box_size.'
  - 'Suggestion: drawing iso-F1 contours (the Notes allow them) would give the high-recall
    divergence a reference.'
