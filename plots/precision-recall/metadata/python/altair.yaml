review:
  strengths:
  - Curves computed with sklearn precision_recall_curve and AP with average_precision_score
    from shared ground truth and two score columns, drawn with interpolate='step-after'
    through the real threshold points
  - Color and strokeDash share one domain, so a single stroke-glyph legend names both
    classifiers with their AP and the dashed random-classifier baseline at the computed
    positive rate
  - Legend placed in the empty region below the curves, keeping the data area clear
  - Theme tokens threaded through title, axes, grid and legend; both renders fully
    readable with identical data colors
  - Exact 3200x1800 canvas via the pad-only block
  weaknesses:
  - 'VQ-02 (both): x tick labels at a 0.05 step crowd the axis — ''0.00''/''0.05''
    and ''0.95''/''1.00'' nearly touch → a 0.1 step (11 labels instead of 21). Likely
    cause: the x alt.Axis has no values/tickCount, so Vega-Lite picks 0.05 steps at
    620 px width.'
  - 'Suggestion: faint iso-F1 contours labelled with their F1 value, which the Notes
    allow, would give a reference for the trade-off.'
