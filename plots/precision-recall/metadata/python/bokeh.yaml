review:
  strengths:
  - Native p.step(mode='after') draws the threshold curve as a true stepped line through
    sklearn's computed points, matching sklearn's own steps-post convention
  - Average Precision is computed with average_precision_score and shown in each classifier's
    legend entry, so each AP sits beside its curve's color
  - Random-classifier baseline is a horizontal dotted INK_SOFT line at the computed
    positive class ratio (0.30), labelled in the legend and visible in both themes
  - 'Complete theme threading: title, axis titles, ticks, legend box and labels all
    use INK / INK_SOFT / ELEVATED_BG tokens; data colors identical across renders'
  - 'Adaptable structure: column constants, a Data block that ends in one tidy df,
    and a plot loop over SCORE_COLUMNS that scales to more classifiers'
  weaknesses:
  - 'DE-02 (both): the plot area is framed on all four sides (top and right outline
    drawn in INK_SOFT) where the plot type does not require it → L-shaped frame with
    only the left and bottom axis lines. Likely cause: p.outline_line_color = INK_SOFT
    (set it to None).'
  - 'DQ-02 (both): the ground-truth column is labelled only ''Actual class'' and the
    features are anonymous make_classification output, so the scenario names no domain
    → rename the target to a real positive class (for example ''Fraudulent transaction'')
    and frame the two models as scoring that task. Likely cause: Y_TRUE = "Actual
    class".'
  - 'Suggestion: faint iso-F1 contour lines (the Notes allow them) labelled with their
    F1 value would give the AP comparison a reference frame.'
  - 'Suggestion: format the y ticks uniformly (0.0 … 1.0) with NumeralTickFormatter
    so ''1'' and ''0'' match ''0.8''.'
