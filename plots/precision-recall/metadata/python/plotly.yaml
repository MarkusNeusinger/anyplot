review:
  strengths:
  - Stepped curve drawn with line shape 'hv' through the points of precision_recall_curve,
    matching sklearn's step convention
  - AP and the baseline value are computed and carried in the legend entries (AP =
    0.812, Random baseline 0.10)
  - Iso-F1 contours drawn first and faint, so they sit behind the classifier curve
  - Theme tokens threaded through title, ticks, grid, axis lines and legend box; both
    renders readable
  - Per-trace hovertemplates give recall and precision on hover in the HTML output
  - Data follows the adaptable-code zones with column constants and a computed positive
    ratio
  weaknesses:
  - 'SC-02 (both): the four iso-F1 contours share one grey dotted style and carry
    their F1 values only as four identical legend entries, so no contour can be matched
    to its value on the plot (C4: each labeled with its F1 value) → label each contour
    with its F1 value on the plot, e.g. a small INK_SOFT text at its right end. Likely
    cause: the iso-F1 loop sets only name= and no on-curve label.'
  - 'Suggestion: start each iso-F1 contour at recall f1/(2−f1) so it reaches precision
    1; the F1 = 0.2 contour now stops abruptly near precision 0.81 because the linspace
    sampling skips the steep part.'
