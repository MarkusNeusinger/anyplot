review:
  strengths:
  - Stepped PR curve via geom_step(direction='vh') places each precision at its recall
    increment, never smoothed
  - Random-classifier baseline as a dashed horizontal line at the positive class ratio,
    Imprint position 2, labeled with its value
  - AP annotation placed in empty panel space, clear of the curve, in both themes
  - Theme tokens threaded through every chrome element; both renders fully readable
  - 'Clean adaptable structure: column-role constants and a replaceable Data block,
    everything else derived from df'
  weaknesses:
  - 'DQ-02 (both): the data carries no application context — the columns are ''True
    label'' and ''Predicted score'' for an unnamed classifier → name a concrete domain
    from the spec''s applications (e.g. ''Fraud (1 = fraudulent)'' and ''Fraud model
    score''). Likely cause: the Y_TRUE / Y_SCORES column names.'
  - 'CQ-04 (code): lines 56–66 hand-roll the cumulative-sum precision/recall curve
    and the average precision that scikit-learn computes → sklearn.metrics.precision_recall_curve(df[Y_TRUE],
    df[Y_SCORES[0]]) and average_precision_score(...). Likely cause: manual ranking
    and cumsum block.'
  - 'Suggestion: faint, labeled iso-F1 contour lines behind the curve, which the Notes
    allow, would give the AP a reference frame.'
  - 'Suggestion: place the AP box and baseline label relative to the data (e.g. from
    baseline and curve extents) instead of fixed literals so other data stays clear.'
  image_description: |-
