review:
  strengths:
  - Arcs start at 12 o'clock and sweep clockwise by value/goal, with faint same-color
    full-circle tracks visible in both themes (alpha raised to 0.25 on dark)
  - Imprint positions 1-3 in canonical order with the page color painted across the
    whole canvas through the gggrid wrapper
  - 'Ring labels colored to match their ring, with muted value/goal sub-labels below:
    a readable two-level hierarchy'
  - layer_tooltips() adds per-ring hover detail in the interactive HTML
  weaknesses:
  - 'SC-02 (both): the progress arcs end in square cuts at 12 o''clock and at their
    sweep end, not the rounded caps the Notes and C1 ask for → round end caps visible
    at both ends of every arc. Likely cause: geom_path lineend=''round'' has no visible
    effect in the lets-plot PNG export; draw a filled circle of the stroke''s diameter
    (geom_point, same color) at each arc end, or build the arc as a polygon with semicircular
    ends.'
  - 'VQ-05 (both): the rings span only ~59% of the canvas width, with ~250 px empty
    between title and rings and ~350 px empty below the value/goal row → rings and
    labels filling ~75-80% of the canvas. Likely cause: scale_y_continuous limits
    [-outer*1.72, outer*1.32] and x limits ±outer*1.4 pad far beyond the drawn content.'
  - 'Suggestion: the center ''Daily / Activity'' text could carry a headline figure
    such as the average completion, which the Notes allow.'
