review:
  strengths:
  - 'Composes the ring from MUI X Gauge primitives: GaugeContainer with startAngle
    0 / endAngle 360, a GaugeReferenceArc as the full-circle track and a GaugeValueArc
    as the progress arc, so the track and the sweep come from the library rather than
    hand-drawn paths'
  - cornerRadius="50%" gives native rounded end caps; every arc starts at 12 o'clock
    and sweeps clockwise to exactly its share (Move 70 %, Exercise 83 %, Stand 75
    %)
  - Three concentric rings with equal 12 % stroke width and equal 4 % gaps, ordered
    Move (outer) → Stand (inner), true circles on the square 2400×2400 canvas
  - 'Tracks use each ring''s own color at low opacity, with the opacity raised in
    dark mode (0.28 vs 0.18) so the remaining progress stays visible on #1A1A17'
  - 'Typographic hierarchy: a bold two-line center headline with a date inside the
    innermost ring, and a legend that leads with the percentage in the ring color
    over the metric name and value / goal with units'
  - Imprint palette positions 1–3 from ANYPLOT_TOKENS (brand green first), identical
    in both themes; all chrome comes from theme tokens
  - 'Over-goal handling is in place: the sweep is clamped at 100 % while the legend
    percentage stays uncapped, so an exceeded goal would read as a full ring plus
    e.g. 120 %'
  weaknesses:
  - 'Suggestion: the amber ''↓ focus area'' callout under Move is an annotation the
    spec does not request, and at 13 px in the amber token it is faint on the light
    #FAF8F1 background; dropping it keeps the legend clean (the colored percentages
    already show which ring lags).'
  - 'Suggestion: the file carries two header blocks (lines 1–4 above the orientation
    directive and the stale original at lines 6–10); keep the //# anyplot-orientation
    directive on line 1 with a single header below it, as the library prompt''s skeleton
    shows.'
  - 'Suggestion: follow the library prompt''s data-block shape — role constants (METRIC,
    VALUE, GOAL, UNIT) and a `// Data` block ending in `const data` records keyed
    by them — so the ''Use with my data'' agent can swap the data in.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400×2400 square canvas.
      Chrome: title "gauge-activity-rings · javascript · muix · anyplot.ai" centered at the top in soft dark ink (~41 % of width); bold near-black two-line center headline "Daily Activity" with "Jun 14, 2026" below it, inside the innermost ring; bottom legend of three columns — colored percentage (70 %, 83 %, 75 %), bold metric name (Move, Exercise, Stand), value / goal with units (420 / 600 kcal, 25 / 30 min, 9 / 12 hr). A small amber "↓ focus area" note sits under Move and is faint on the cream background. No axes or gridlines (expected).
      Data: three concentric thick rings with rounded caps starting at 12 o'clock and sweeping clockwise — Move (outer) in brand green #009E73 to ~8 o'clock (70 %), Exercise (middle) in Imprint purple to ~10 o'clock (83 %), Stand (inner) in Imprint blue to 9 o'clock (75 %). Each has a faint full-circle track in its own color at low opacity; equal widths, equal gaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light soft ink, center headline in near-white bold, date and value / goal lines in light soft ink, metric names in near-white; amber "↓ focus area" reads clearly here. No dark-on-dark text anywhere.
      Data: ring colors identical to the light render (green, purple, blue); tracks are darker tints of each ring color at raised opacity and remain clearly visible against the background.
      Legibility verdict: PASS
