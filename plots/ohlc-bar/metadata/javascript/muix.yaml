review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with a band
    x axis and a linear y axis, and a custom OhlcBars component that draws high-low
    lines and open/close ticks through useXScale/useYScale, so every mark sits exactly
    at its data value on the library''s own scales'
  - Open ticks extend left and close ticks right at 11 px (40 % of the band), long
    enough to read direction at a glance and short enough that neighboring bars never
    touch
  - 'Up/down coloring follows the finance semantic exception (brand green #009E73
    up, matte red #AE3030 down), identical in both themes, with legend labels that
    literally say Up/Down; direction still reads from the tick sides'
  - Band axis draws a tick for every session but labels only every fifth (Mondays)
    as 'Jan 2', 'Jan 9' …, with the year moved into the axis title, a date format
    fitted to daily data
  - Price axis padded 6 % around the lows and highs instead of forced to zero, horizontal-only
    dashed grid at reduced opacity drawn behind the bars
  - Theme tokens threaded through every chrome element (page background, title, axis
    titles, tick labels, grid, legend text); both renders fully legible
  weaknesses:
  - 'VQ-06 (both): the price axis is titled ''Close (USD)'' although it carries open,
    high, low and close of every bar → a title for the whole price scale such as ''Price
    (USD)''. Likely cause: yAxis label: CLOSE.'
  - 'DQ-02 (both): the series includes a session on 2024-02-19, Presidents'' Day,
    when US exchanges were closed, in an otherwise realistic daily US-stock series
    → drop that date (or shift the window) so every bar is a real trading day. Likely
    cause: the hard-coded data rows include { [DATE]: "2024-02-19" }.'
  - 'Suggestion: the title at 22 px fills only about 30 % of the width; a slightly
    larger title would anchor the wide canvas better.'
  - 'Suggestion: an occasional doji session (open = close) would show how the chart
    handles equal ticks, which the spec permits.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, including the title row.
      Chrome: bold dark title "ohlc-bar · javascript · muix · anyplot.ai" top-left; inline legend top-right ("Up (close > open)" with a green line glyph, "Down (close < open)" with a red line glyph). Y-axis title "Close (USD)" rotated, ticks 214–258 in steps of 2; x-axis title "Trading session (2024)", tick labels "Jan 2" … "Feb 27" every fifth session with minor ticks at every session. Faint dashed horizontal grid. All text dark on light and readable.
      Data: 45 OHLC bars from Jan 2 to Mar 4, 2024, rising from ~218 to ~255; each a thin vertical high-low line with a short left open tick and right close tick. Up bars brand green #009E73, down bars matte red #AE3030. Ticks do not touch neighbors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles and tick labels in light ink, legend text in soft light ink, dashed grid subtle but visible; no dark-on-dark text anywhere.
      Data: identical bars and colors to the light render (green #009E73 up, red #AE3030 down), both clearly visible on the dark surface.
      Legibility verdict: PASS
