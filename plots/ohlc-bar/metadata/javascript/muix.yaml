review:
  strengths:
  - 'Perfect Imprint palette compliance: brand green (#009E73) for up bars, matte
    red (#AE3030, the documented finance loss/down semantic exception) for down bars,
    identical across light and dark renders with fully theme-correct chrome'
  - 'Accurate OHLC bar construction matching the spec exactly: thin vertical high-low
    wick, left tick for open, right tick for close, plus a redundant position encoding
    (open-tick vs close-tick height) that lets a viewer read up/down without relying
    on color alone'
  - Explicit font sizing everywhere (title 22px, axis labels 16px, tick labels 14px,
    legend 14px) with balanced X/Y axis label and tick sizes, no overlaps, no clipping
    in either theme
  - Realistic, well-varied 45-session stock random walk with correct O>=max(open,close)
    / L<=min(open,close) invariants, trading-day-only dates, and a healthy mix of
    up/down bars and wick sizes
  - 'Idiomatic community-only MUI X usage: composes ChartContainer with useXScale/useYScale
    hooks for a custom SVG overlay, the documented technique for chart types (OHLC)
    with no native community series'
  - Deterministic LCG-seeded data generation, clean imports, skipAnimation set for
    a stable screenshot
  weaknesses:
  - ChartsGrid uses strokeDasharray '2 5' at opacity 0.55 — the style guide calls
    for solid (not dashed) grid lines at 15-25% opacity; the dashed pattern and higher
    opacity are a visible deviation from the documented grid guidance
  - Design storytelling is limited to the color/position encoding already required
    by the spec — no additional visual-hierarchy touch (e.g., subtly emphasizing the
    strongest rally/pullback streak) to lift Data Storytelling further
  - Legend swatches are plain color chips (not mini OHLC glyphs) — functional but
    a slightly generic legend treatment compared to the polish shown elsewhere in
    the chart
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "ohlc-bar · javascript · muix · anyplot.ai" top-left in dark ink, clearly visible. Legend top-right ("Up (close > open)" green swatch, "Down (close < open)" red swatch) fully readable. Y-axis "Share Price (USD)" with $-formatted ticks ($212-$244), X-axis "Trading Session (2024)" with date labels (Jan 2, Jan 9, Jan 16, ... every 5th session) — all dark, legible text against the light background. Subtle dashed horizontal grid lines at each $2 level.
      Data: 45 OHLC bars — thin vertical high-low wick, left tick (open) and right tick (close) per bar. First-series green (#009E73) marks up bars (close > open), matte red (#AE3030) marks down bars (close < open). Overall upward price drift from ~$214 to ~$240 across Jan-Feb 2024, with a healthy mix of up/down bars and varying wick lengths.
      Legibility verdict: PASS — all text readable, no overlap, no clipping at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink/text, fully readable against the dark background. No dark-on-dark text anywhere — title, tick labels, axis labels, and legend text are all light-colored and legible. Grid lines remain subtle dashed lines, visible but not competing with the data.
      Data: Same 45 OHLC bars in identical colors to the light render — green #009E73 for up, matte red #AE3030 for down — confirming only the chrome (background, text, grid) flipped between themes, not the data colors.
      Legibility verdict: PASS — no dark-on-dark failures, all elements clearly visible and consistent with the light render.
