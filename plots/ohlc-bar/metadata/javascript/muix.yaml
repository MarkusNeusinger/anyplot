review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with a band
    x axis and a numeric y axis, and a custom OhlcBars layer drawing through useXScale/useYScale,
    so every bar sits exactly at its data values and shares the axes and grid'
  - Open ticks left, close ticks right, with tick length derived from the band width
    (capped at 11 px) so neighboring bars never touch
  - 'Finance semantic exception applied correctly: up = brand green #009E73, down
    = matte red #AE3030, identical in both themes, legend literally says Up / Down'
  - Price axis padded 6 % around the data range rather than forced to zero; dates
    formatted as 'Jan 2' with the year moved into the axis title, labels every fifth
    session
  - ChartsGrid restyled via sx to a faint dashed grid behind the bars; skipAnimation
    set
  weaknesses:
  - 'DQ-02 (both): the series is an unnamed stock that climbs almost linearly from
    about 218 to 255 USD with near-uniform 4–6 USD daily ranges and a regular up/down
    alternation, which reads as synthetic rather than as a real trading record → give
    the bars a named (fictional) ticker in the axis or column label and vary volatility
    (a few wide-range sessions, a short pullback). Likely cause: the hand-written
    data block with a fixed step per session.'
  - 'Suggestion: an HTML-only tooltip showing the exact open/high/low/close per session
    would add value in the interactive view.'
  - 'Suggestion: y ticks every 5 USD instead of every 2 USD would lighten the 23-label
    price axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
      Chrome: bold dark title top-left, inline Up/Down legend top-right, "Price (USD)" y axis 214-258 in 2-USD steps, "Trading session (2024)" x axis labelled every fifth session ("Jan 2" ... "Feb 29"), faint dashed horizontal grid; all readable
      Data: 44 OHLC bars (thin high-low line, left open tick, right close tick); up sessions brand green #009E73, down sessions matte red #AE3030; ticks never touch neighbors
      Legibility verdict: PASS

