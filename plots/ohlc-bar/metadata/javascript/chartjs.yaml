review:
  strengths:
  - Correct core-Chart.js-only OHLC implementation via a custom afterDatasetsDraw
    plugin drawing the open/close ticks directly on canvas — no financial plugin or
    workaround, respecting the library's "no workarounds" rule
  - Deterministic seeded LCG produces a realistic, gradually trending crude-oil futures
    price series across 45 weekday sessions
  - Both renders are theme-correct (warm off-white / near-black backgrounds) with
    identical data colors between light and dark, no clipping or overlap anywhere
  - Semantic green/up vs. red/down bar coloring follows the style guide's finance
    color convention, with a clear custom legend explaining the semantics
  - Title, legend, and axis labels are fully visible with generous margins in both
    renders; no AR-09 edge clipping
  weaknesses:
  - Up/down days are distinguished only by color (green vs. red) with no redundant
    encoding (e.g., differing tick length or a small directional glyph) — CVD readers
    must rely on the legend rather than the marks themselves.
  - OHLC ticks (open/close) are quite subtle at default zoom for only 45 sparse data
    points — tickHalfWidth/lineWidth could be nudged up slightly for extra legibility
    without crowding the bars.
  - No additional data-storytelling flourish beyond color and grid — e.g., no callout
    for the overall trend or the period high/low — keeps the chart fairly plain despite
    the clear upward drift in the data.
  - Legend swatches are plain flat rectangles; a thin ink-color border would add a
    touch more visual refinement consistent with the style guide's optional outline
    pattern.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark.
      Chrome: Title "ohlc-bar · javascript · chartjs · anyplot.ai" in bold dark ink, fully visible and centered. Legend below title with two swatches ("Up (close ≥ open)" green, "Down (close < open)" red), both readable. Y-axis title "Price (USD/barrel)" rotated on the left, X-axis title "Date" centered below rotated 45° date tick labels (Mar 1 → May 2). Horizontal grid lines are thin and subtle, spaced every $2.
      Data: 45 OHLC bars left to right, brand green (#009E73) for up sessions and matte red (#AE3030) for down sessions — thin vertical high-low range lines with a left tick (open) and right tick (close) on each bar, clearly distinguishable from the cream background. Overall price drifts from ~$62 to ~$69 across the series.
      Legibility verdict: PASS — all title/legend/axis/tick text is dark-on-light and clearly readable; no overlap or clipping observed at any edge.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light.
      Chrome: Same title and legend layout, now in light/white ink against the dark surface — fully readable. Axis titles and tick labels use light gray/white tones. Grid lines remain subtle (thin, low-opacity light lines).
      Data: Bar colors are pixel-identical to the light render (same green #009E73 / red #AE3030), confirming only chrome flipped between themes, not the data-encoding colors.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, legend, axis labels, tick labels) reads clearly against the near-black background; brand green and matte red both remain vivid and distinguishable from the surface.
