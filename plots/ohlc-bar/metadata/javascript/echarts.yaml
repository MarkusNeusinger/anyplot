review:
  strengths:
  - Idiomatic use of ECharts custom series (renderItem with api.coord/api.size) to
    build true I-beam OHLC bars — a chart type ECharts has no native series for, correctly
    avoiding the wrong shortcut of a relabeled candlestick series.
  - 'Correct semantic color mapping: brand green (#009E73, palette[0]) for bullish
    bars, semantic matte red (#AE3030, palette[4] — the deferred loss/error anchor)
    for bearish bars, matching the Imprint semantic-exception order.'
  - 'Clever proxy-series technique: two invisible line series with symbol: ''none''
    exist purely to drive correct legend swatches while the actual bars render through
    the custom series — avoids a mismatched or missing legend.'
  - Deterministic seeded LCG produces realistic day-to-day OHLC drift with a plausible
    mild uptrend across 45 trading days (weekends correctly skipped).
  - 'Clean theme-adaptive chrome: transparent background, ink/inkSoft/grid tokens
    correctly threaded through title, legend, axis labels and gridlines; both renders
    are legible and the data colors are identical between light and dark.'
  weaknesses:
  - 'VQ-04: Bullish vs. bearish bars are distinguished only by hue (green vs. red)
    with no secondary cue (shape, label, pattern) — a red-green color-vision-deficient
    viewer cannot tell the two apart from color alone. This is conventional in OHLC/candlestick
    charting, but the review criteria mark red-green-as-sole-signal as a deduction;
    consider whether a secondary cue is feasible without cluttering the bars.'
  - 'DE-01/DE-03: The chart is clean and technically correct but reads as a competent
    standard rendering rather than a distinctive one — there is no annotated focal
    point (e.g. a callout on the largest single-day rally or the steepest drawdown)
    to guide the viewer''s eye or add a storytelling layer.'
  - 'VQ-06: Y-axis carries a ''$'' price prefix but there is no explicit axis title
    (e.g. ''Price (USD)'') — acceptable given the $ formatter, but an explicit axis
    title would strengthen VQ-06 and DE-03 slightly.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Aurora Robotics · ohlc-bar · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend below the title shows two line swatches labeled "Bullish (close > open)" (green) and "Bearish (close < open)" (red), both readable. Y-axis shows $175-$210 in soft gray with a "$" prefix; x-axis shows date labels (Jan 2 through Mar 4) in soft gray, evenly spaced with no overlap. Horizontal gridlines are subtle but visible; y-axis line and x-axis ticks are hidden for a clean look.
      Data: 45 I-beam OHLC bars — a thin vertical high-low line with a left tick (open) and right tick (close) per bar — colored green (#009E73) for up days and matte red (#AE3030) for down days. The overall trend drifts upward from ~$182 to ~$199 with visible day-to-day volatility. Bars are clearly distinguishable from each other and from the background.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and legend text now rendered in light/white ink, clearly legible against the dark background. Axis tick labels (both $ price and dates) are in light gray and easily readable. Gridlines remain subtle but visible on the dark surface. No axis lines/ticks clutter the chart, matching the light render's minimal-chrome treatment.
      Data: Same 45 OHLC bars with identical green (#009E73) and red (#AE3030) hues as the light render — confirmed data colors are unchanged between themes, only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, legend, and axis text remain clearly visible against the near-black background.
