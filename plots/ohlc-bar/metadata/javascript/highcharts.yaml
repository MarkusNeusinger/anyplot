review:
  strengths:
  - 'Creative, correct workaround for the missing OHLC/candlestick module: each bar
    is built from null-separated line strokes (high-low range plus left-open/right-close
    ticks) using only the core bundle, matching the spec''s ''thin vertical lines
    with horizontal ticks'' requirement exactly.'
  - Finance-semantic color mapping (brand green for up, matte red for down) matches
    the style guide's documented profit/loss exception, reinforced with redundant
    triangle-direction markers (up/down) at the close tick for CVD-safety beyond color
    alone.
  - 'Data storytelling: a dashed xAxis plotLine with a label highlights the single
    sharpest daily move, giving the chart a clear focal point instead of a flat data
    dump.'
  - Explicit, well-proportioned font sizing throughout (title 22px, axis titles 16px,
    ticks/legend 14px); both themes are fully readable with correctly flipped chrome
    and identical data colors.
  - Custom tooltip formatter surfaces full OHLC values per bar despite the underlying
    series type not natively supporting OHLC tooltips.
  - Deterministic LCG-seeded data produces a realistic WTI crude oil price path with
    both bullish and bearish stretches.
  weaknesses:
  - 'Library Mastery is solid but a bit generic in one respect: since the native OHLC
    series type isn''t in the core bundle, the chart relies on a ''line'' series workaround
    rather than a more distinctive Highcharts-only feature; consider layering in something
    harder to replicate elsewhere (e.g., plotBands for session shading, or a custom
    SVGRenderer overlay).'
  - 'Visual refinement is good but not maximal: only the x-axis draws a line/tick
    color, the y-axis relies on gridlines and labels alone with no explicit axis line
    — a fine minimalist choice, but combined with the plain gridlines it reads closer
    to ''well-configured'' than ''every-detail-polished''.'
  - Element sizing (lineWidth 3px, triangle radius 5px) is adequate but not maximized
    for a sparse ~42-point series; per the data-density heuristic, sparse data benefits
    from more prominent markers — a slightly larger tick width/triangle radius would
    improve visibility further at mobile scale.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Crude Oil Futures · ohlc-bar · javascript · highcharts · anyplot.ai" with a lighter "Sharpest move: -1.7%" subtitle-style annotation label; dark X-axis title "Trading Date" and Y-axis title "Price per Barrel (USD)"; soft dark-gray tick labels on both axes; subtle horizontal gridlines at each price level; legend at bottom center reads "Up (Close ≥ Open)" (green) and "Down (Close < Open)" (red). All text is clearly readable against the light background.
      Data: 42 OHLC bars spanning early Feb to late Mar. First (and only) categorical series is brand green #009E73 for bullish bars, matte red #AE3030 for bearish bars — each bar shows a vertical high-low line, a left tick at the open price, and a right tick at the close price with a small triangle (pointing up for bullish, down for bearish) marking the close. A dashed vertical plot-line marks the day with the sharpest single-day move, with a small dark label above it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light/white text, tick labels in light gray, gridlines are faint light-colored horizontal lines, legend text is light-colored — all chrome has correctly flipped from the light render with no dark-on-dark or light-on-light failures.
      Data: Bar colors are visually identical to the light render — same brand green (#009E73) for up bars and matte red (#AE3030) for down bars, confirming data colors are constant across themes; only the chrome (background, text, grid) adapted to the dark theme.
      Legibility verdict: PASS
