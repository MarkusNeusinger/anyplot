review:
  strengths:
  - 'Clever core-bundle-only workaround for the missing native ''ohlc'' series: three
    null-separated line strokes per bar (high-low range, left open tick, right close
    tick) faithfully reproduce OHLC-bar geometry without pulling in the disallowed
    modules/stock.js'
  - Correct application of the finance semantic-color exception — upColor = palette[0]
    (#009E73 brand green), downColor = palette[4] (#AE3030 matte red) — with legend
    labels 'Up (Close ≥ Open)' / 'Down (Close < Open)' that make the mapping unambiguous
  - Realistic WTI crude-oil price series ($74–$84/barrel) generated with a small deterministic
    LCG, 42 weekday-only trading days — squarely in the spec's 20–100 period range
  - Theme-adaptive chrome is correctly threaded through title/axis/tick/legend/grid
    tokens; data colors are pixel-identical between light and dark renders, only chrome
    flips
  - Minimal, subtle horizontal-only gridlines and generous whitespace consistent with
    the style guide's minimalism principles
  weaknesses:
  - Up/down distinction relies on red/green hue as the primary signal (VQ-04). A colorblind
    reader can technically infer direction from relative tick heights (right tick
    above/below left tick), but that's not an intuitive redundant channel — consider
    a secondary cue such as a small directional marker, differing tick length, or
    a subtitle/caption that states the convention explicitly
  - 'No data-storytelling emphasis: the chart shows 42 uniform bars with no annotation
    or callout on the sharpest move (e.g. the Feb 19 plunge to ~$75.4 or the late-March
    rally past $83) — a single annotation or highlighted band would sharpen the focal
    point (DE-03)'
  - Two small helper functions (lcg, barStrokes) add more structure than the flattest
    possible script; acceptable for the data-generation/rendering need but slightly
    beyond pure KISS (CQ-01)
  - Library Mastery is modest — beyond the core-only OHLC workaround and a custom
    tooltip formatter, no distinctive Highcharts-only feature (e.g. crosshair, dataGrouping-style
    time-series affordances) is used (LM-02)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Crude Oil Futures · ohlc-bar · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible. X-axis "Trading Date" and Y-axis "Price per Barrel (USD)" labels in medium-dark ink, fully readable. Tick labels (dates on x, prices 74-84 on y) in soft dark gray, legible. Horizontal gridlines are thin and subtle, don't compete with data. Legend at bottom center ("Up (Close ≥ Open)" green dash, "Down (Close < Open)" red dash) clearly readable.
      Data: 42 vertical OHLC bars across ~Feb 1 – Mar 28, each with a left tick (open) and right tick (close) around a high-low vertical stroke. First/only bullish series uses #009E73 brand green; bearish series uses #AE3030 matte red — both colors read clearly against the light background with good contrast.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title in bright off-white/light ink, clearly legible against the dark background. Axis titles in light gray, tick labels in soft light gray — all readable, no dark-on-dark issues anywhere. Gridlines are thin light-gray hairlines, subtle but visible. Legend text and swatches at the bottom are fully legible.
      Data: Same 42 OHLC bars, same geometry. Green (#009E73) and red (#AE3030) data colors are pixel-identical to the light render — only the chrome (background, text, grid) flipped, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS
