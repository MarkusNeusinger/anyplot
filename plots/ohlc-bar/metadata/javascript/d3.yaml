review:
  strengths:
  - Correct, unambiguous OHLC visual encoding (vertical high-low line, left tick =
    open, right tick = close), clearly distinct from a candlestick chart
  - 'Directly addresses attempt-1 feedback: adds an 8-day moving-average overlay (d3-shape
    line generator with curveMonotoneX) and dynamic high/low extreme callouts (live
    getBBox-based box sizing) for real data storytelling and distinctive D3 mastery'
  - Smart use of the finance semantic-color exception (palette[0] brand green / palette[4]
    matte red) with an explicit legend that documents the mapping
  - 'Realistic synthetic data generation: weekday-only trading days, LCG-seeded drift/wick
    logic producing a believable trending series across 45 bars'
  - Both renders are fully theme-correct — identical data colors, properly flipped
    chrome, no legibility failures in either theme
  weaknesses:
  - Callout label text (13px) and legend text (15px) are on the smaller side of the
    range; verify they stay comfortably legible at the ~400px mobile thumbnail scale
  - Aesthetic polish is solid but still fairly conventional for an OHLC composition
    — a future pass could push typography hierarchy or stroke treatments further for
    extra refinement
