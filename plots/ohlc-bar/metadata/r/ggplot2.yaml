review:
  strengths:
  - Tick half-width of 0.4 day keeps the open and close ticks readable while every
    bar stays separate
  - Theme tokens threaded through all chrome; both renders theme-correct with identical
    data colors
  - scale_x_date with weekly Monday breaks and %b %d labels fits the daily frequency
  - Up/down bars in Imprint green and the matte-red loss anchor, redundant with tick
    direction
  weaknesses:
  - 'DQ-03 (both): the Jan 18 bar''s open tick (~$166.7) sits below its low (~$167.7),
    an impossible OHLC record → low <= min(open, close) and high >= max(open, close)
    for every bar. Likely cause: high_prices/low_prices built with pmax/pmin over
    close_prices only, ignoring open_prices.'
  - 'Suggestion: a slightly heavier line width (about 0.7 mm) would give the bars
    more presence on the wide canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no panel border, subtle horizontal grid at $150/$160/$170 only.
      Chrome: bold title 'ohlc-bar · r · ggplot2 · anyplot.ai' top left in dark ink; axis titles 'Date' and 'Price ($)' in dark ink; y ticks 150/160/170 and weekly x ticks Jan 01 ... Feb 26 rotated 45° in soft ink; all readable.
      Data: 45 OHLC bars Jan 1 - Mar 1 2024 with weekend gaps; thin vertical high-low lines, short left open and right close ticks; up bars #009E73, down bars #AE3030. Jan 18 open tick floats below its line.
      Legibility verdict: PASS

