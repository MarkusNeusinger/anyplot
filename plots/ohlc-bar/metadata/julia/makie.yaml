review:
  strengths:
  - 'Correct, idiomatic OHLC construction: rangebars! for the high-low range plus
    linesegments! for the left-open / right-close ticks — exactly the right Makie
    primitives for this chart type.'
  - 'Color choice follows the Imprint palette rationale precisely: brand green (#009E73)
    for up, the matte-red semantic anchor (#AE3030) for down; with n=2 series this
    is explicitly CVD-safe per the style guide (no redundant encoding required).'
  - 'Clean theme-adaptive chrome: top/right spines removed, subtle horizontal-only
    grid, frameless legend, all consistent between light and dark renders.'
  - Realistic synthetic data with volatility clustering (simulated earnings-reaction
    stretch, sessions 20-27) and correctly enforced OHLC invariants (high >= max(open,
    close), low <= min(open, close)).
  weaknesses:
  - Bars are moderately cramped in the dense mid-March stretch (sessions 15-27) at
    tick_width=0.32 with linewidth=2.5 -- consider slightly more horizontal spacing
    or a thinner tick width for better legibility at smaller display sizes.
  - Data storytelling relies on only two point annotations (swing high/low); a subtle
    shaded band over the earnings-reaction stretch (sessions 20-27, where vol_mult=2.6)
    would tie the visible volatility spike more directly to the narrative and strengthen
    DE-03.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "ohlc-bar · julia · makie · anyplot.ai" is bold dark ink, centered, clearly readable. Axis labels "2024 Trading Sessions" / "SLRA Share Price (USD)" are dark and legible. X tick labels ("Mar 01", "Mar 08", ... "Apr 26") are rotated ~30deg in soft dark-gray ink, fully readable. Y tick labels (170-200) are dark and legible. Grid is a subtle horizontal-only light-gray line at each major y-tick. Legend (top-left, frameless) reads "Up (close >= open)" / "Down (close < open)" in soft ink, clearly legible against the cream background. "Swing high" / "Swing low" annotations in soft gray are readable and sit clear of any bar.
      Data: 45 OHLC bars -- thin vertical high-low range line with a left tick (open) and right tick (close). First/up series renders in the Imprint brand green (#009E73); down bars render in the matte-red semantic anchor (#AE3030). Colors are clearly distinguishable from the cream background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Title, axis labels, and tick labels flip to light/off-white ink and remain clearly readable against the dark background -- no dark-on-dark failures observed anywhere (title, axis titles, tick labels, legend text, and "Swing high"/"Swing low" annotations are all legible). Grid remains subtle and horizontal-only.
      Data: Bar colors are pixel-identical to the light render -- green (#009E73) for up, matte red (#AE3030) for down -- confirming only chrome (not data colors) flipped between themes.
      Legibility verdict: PASS
