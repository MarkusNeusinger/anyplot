review:
  strengths:
  - 'Correct OHLC bar construction: thin high-low vertical line with a left tick for
    open and a right tick for close, exactly matching the spec''s description'
  - 'Correct Imprint semantic-exception color usage — brand green #009E73 for bullish
    (close ≥ open) and the matte-red semantic anchor #AE3030 for bearish (close <
    open), matching the style guide''s finance guidance'
  - 'Both renders are fully theme-correct: chrome (title, labels, ticks, grid, legend)
    flips between light/dark while the two data colors stay pixel-identical'
  - Clean KISS code structure with explicit theme tokens, Random.seed!(42), and no
    unused imports
  - No AR violations — no fake interactivity, no edge clipping of title/axis/legend
    in either render
  - Y-axis grid is subtle and directly serves the spec's note that "grid lines help
    read exact price levels"
  weaknesses:
  - Title occupies only ~20-25% of plot width at titlesize=20 — comfortably below
    the 50-70% guideline for a title of this length; a modest titlesize bump (e.g.
    24-26) would improve visual hierarchy without risking overflow
  - 'Design Excellence is solid but stops short of publication-grade: consider one
    more deliberate refinement, e.g. a thin reference/trend line or a subtitle annotating
    the swing high (~Apr 5, ~195) and swing low (~Apr 13, ~176.5) to give the chart
    a clearer point of view (DE-03)'
  - 'LM-01: the high-low range is built manually via linesegments! over a hand-constructed
    Point2f array; Makie ships rangebars!(ax, x, low, high) specifically for vertical
    low-high spans — using it for the range segment (keeping manual linesegments!
    only for the open/close ticks, which have no built-in recipe) would be more idiomatic'
  - 'DQ-01: all 45 sessions are drawn from a single constant-volatility random walk;
    adding one clearly higher-volatility or gapped stretch would better demonstrate
    the OHLC chart''s ability to show varying range width session-to-session'
  - 'DQ-02: the series is only labeled generically as "Share Price (USD)" with no
    company/sector context — a neutral fictional label (e.g. a named but fictional
    ticker) would ground the scenario a bit more concretely, though this is a minor
    nice-to-have'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Bold dark title "ohlc-bar · julia · makie · anyplot.ai" centered at top; y-axis
        "Share Price (USD)" with ticks at 180/185/190/195 in dark ink; x-axis "2024 Trading
        Sessions" with rotated (~30°) date labels (Mar 01 ... Apr 26) in soft dark-grey; subtle
        horizontal gridlines at each price tick; frameless legend top-left with "Up (close ≥ open)"
        (green swatch) and "Down (close < open)" (red swatch). All text is clearly dark-on-light
        and fully readable, no light-on-light issues.
      Data: 45 OHLC bars covering ~Mar 1 - late Apr 2024. First data series (bullish sessions) is
        #009E73 brand green; bearish sessions use the #AE3030 matte-red semantic anchor. Each bar
        shows a thin vertical high-low line with a left tick (open) and right tick (close), reading
        as an uptrend from ~185 to a peak near 195 around Apr 5, then a decline to ~176.5 by mid-Apr
        before a partial recovery. Bar spacing is even, no crowding or overlap between adjacent bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title, axis labels, and tick labels now rendered in light cream/off-white tones,
        fully legible against the dark surface — no dark-on-dark failures observed anywhere (title,
        axis labels, tick labels, legend text all confirmed legible). Gridlines are subtle light-on-
        dark. Legend remains frameless and readable in the same top-left position.
      Data: Bar colors are pixel-identical to the light render — same #009E73 green for up sessions
        and #AE3030 red for down sessions, same bar positions and heights. Only the chrome (bg, text,
        grid) flipped, confirming the data channel is theme-independent as required.
      Legibility verdict: PASS
