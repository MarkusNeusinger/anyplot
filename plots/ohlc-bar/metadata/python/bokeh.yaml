review:
  strengths:
  - 'Faithful OHLC construction from three bokeh segment glyphs per direction: a high-low
    line plus a left open tick and a right close tick, all at their data values; TICK_WIDTH=0.35
    keeps neighbouring ticks clearly apart so every period reads as its own bar'
  - 'Up and down bars use Imprint brand green #009E73 and the red loss anchor #AE3030,
    identical in both renders; the direction also reads from the tick order, so color
    is not the sole signal'
  - Trading-day x slots with major_label_overrides remove weekend gaps and label every
    fifth session as 'Jun 02', 'Jun 09', … — date formatting fitted to daily data
  - 'Grid chosen for this chart: horizontal price-level grid only at low alpha, no
    vertical grid and no axis tick marks, so the price levels the Notes ask about
    stay easy to read'
  - Horizontal legend placed in reserved y-headroom (Range1d upper pad derived from
    the data span) so it never sits on the bars
  - HoverTool bound to the high-low renderers with formatted Date/Open/High/Low/Close
    tooltips adds full inspection in the HTML output
  - Theme tokens threaded through every chrome element; both renders are fully readable
  weaknesses:
  - 'Suggestion: the x labels carry no year (''Jun 02'' … ''Aug 04''); adding it to
    the first label or the axis title (e.g. ''Date (2025)'') would anchor the period.'
  - 'Suggestion: the data loop (lines 48–63) could be expressed as a vectorized random
    walk with np.cumsum for a shorter data block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: bold title "ohlc-bar · python · bokeh · anyplot.ai" top-left (~42% width), y-axis "Price ($)" with ticks 130–170, x-axis "Date" with labels Jun 02 … Aug 04 every five sessions; dark ink text, all readable; faint horizontal grid only; L-shaped axis lines.
      Data: 50 OHLC bars — thin vertical high-low lines with a short left open tick and right close tick; up bars #009E73 green, down bars #AE3030 red; ticks never touch neighbours. Horizontal legend "Up (close ≥ open)" / "Down (close < open)" top-left in the headroom, clear of the bars.
      Legibility verdict: PASS

