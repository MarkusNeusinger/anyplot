review:
  strengths:
  - Clean three-layer geom_segment construction with datetime offsets keeps every
    open/close tick at its data value and short enough (8 h of a 24 h step) that neighbouring
    bars stay separate
  - Theme tokens threaded through every chrome element; solid RULE hex grid stays
    subtle in both themes
  - Plausible copper futures scenario with open = prior close and a vectorized random
    walk
  - Column constants and Data/Plot blocks make the script adaptable to a real table
  weaknesses:
  - 'DE-02 (both): the panel is closed by a four-sided frame (top and right borders
    drawn) instead of the style guide''s L-shaped left and bottom spines → remove
    the top and right borders. Likely cause: theme_minimal()''s panel border kept;
    set panel_border=element_blank() and keep axis_line.'
  - 'Suggestion: configure a lets-plot tooltip layer (layer_tooltips) on the high-low
    segment listing open, high, low and close for the HTML view.'
