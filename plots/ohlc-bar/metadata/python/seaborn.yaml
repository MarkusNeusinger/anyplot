review:
  strengths:
  - 'Every period is a true OHLC bar at its data values: a thin vlines high-low stroke
    with a left hlines tick at the open and a right tick at the close, tick half-width
    0.3 leaving a clear gap to the neighboring bars'
  - 'Finance semantic exception applied correctly: up bars in brand green #009E73,
    down bars in matte red #AE3030, identical in both renders, with the legend labels
    naming the rule (Close ≥ Open / Close < Open)'
  - 'Theme chrome fully threaded through the sns.set_theme rc block: warm #FAF8F1
    / #1A1A17 backgrounds, INK title and labels, INK_SOFT ticks and spines, no dark-on-dark
    text'
  - Trading-day positions remove weekend gaps, with weekly Monday date ticks formatted
    as %b %d that match the daily frequency; y-only grid behind the bars and a price
    axis padded around the lows and highs, not forced to zero
  - Plausible fictional scenario (Northwind Robotics, NWRB) with seeded random-walk
    closes, overnight gaps and realistic intraday ranges around $125–170
  weaknesses:
  - 'Suggestion: seaborn contributes only the theme and sns.despine; the bars are
    plain matplotlib vlines/hlines, which is the right call for OHLC but leaves no
    seaborn-specific feature on show.'
  - 'Suggestion: the 45° rotation of the short ''Jan 02''-style date labels is not
    needed at nine ticks and could be dropped for a calmer x-axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, figure and axes alike.
      Chrome: title "ohlc-bar · python · seaborn · anyplot.ai" centered in near-black; y-axis label "Northwind Robotics (NWRB) Price ($)", x-axis label "Date", tick labels in dark grey (130–170 on y, Jan 02 … Feb 27 rotated 45° on x); left and bottom spines only; subtle horizontal grid lines; legend top right on an elevated frame with "Up (Close ≥ Open)" and "Down (Close < Open)". All readable.
      Data: 45 OHLC bars — thin vertical high-low lines with a left open tick and a right close tick; up bars #009E73 green, down bars #AE3030 red; price rises to ~168 in mid-January then trends down to ~125 by early March. Ticks short enough to keep neighboring bars separate; legend clear of the data.
