review:
  strengths:
  - 'OHLC structure is exact: thin vlines from low to high, open tick to the left
    and close tick to the right, all at their data values; tick length 0.3 of the
    bar spacing keeps every period a separate bar'
  - 'Finance semantic exception applied correctly: up bars in brand green #009E73,
    down bars in matte red #AE3030, with direction also readable from the tick sides,
    identical in both themes'
  - Theme tokens threaded through set_theme rc, title, labels, ticks, spines, grid
    and legend frame; both renders fully legible
  - Integer positions remove weekend gaps and Monday-weekly '%b %d' labels fit the
    daily frequency; y-axis padded to the data range, not forced to zero
  - Y-only grid at low alpha drawn behind the bars (set_axisbelow) supports reading
    exact price levels as the Notes ask
  weaknesses:
  - 'DQ-02 (both): every bar opens exactly at the previous close (open_prices = np.roll(close_prices,
    1)), so the series has no overnight gaps at all and the instrument is unnamed
    (''Price ($)''), which reads as abstract rather than a real daily stock → add
    a small overnight gap to each open and name a plausible fictional ticker in the
    y label or a title prefix. Likely cause: open_prices built from np.roll without
    noise.'
  - 'Suggestion: the eight ''Jan 02''-style date labels are short enough to sit horizontally;
    dropping rotation=45 would lighten the x axis.'
  - 'Suggestion: label the final trading day so the end of the window is readable
    on the date axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "ohlc-bar · python · seaborn · anyplot.ai" centered in dark ink at ~40% width; y label "Price ($)", x label "Date" in dark ink; tick labels in soft ink (120–170 on y, Monday dates "Jan 02"…"Feb 27" rotated 45° on x); left and bottom spines only; subtle horizontal grid behind the bars; legend top right on an elevated frame ("Up (Close ≥ Open)" green, "Down (Close < Open)" red). All readable.
      Data: 45 daily OHLC bars, thin vertical high-low lines with left open and right close ticks; up bars #009E73, down bars #AE3030. Price rises from 150 to ~167 by mid-January, then declines to ~128 by early March. Ticks do not touch neighbors.
      Legibility verdict: PASS

