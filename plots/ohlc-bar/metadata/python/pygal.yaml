review:
  strengths:
  - One pygal XY series per direction draws every bar as three segments (low–high
    line, left open tick, right close tick) separated by None points with allow_interruptions=True,
    so each period is a thin vertical line with its ticks at the exact data values
  - 'Up and down bars use Imprint #009E73 and the #AE3030 red anchor, identical in
    both renders, and direction still reads from the tick order'
  - Ticks at 0.3 of the bar spacing are long enough to tell left from right and leave
    a clear gap to the neighbouring bars across all 45 periods
  - Weekly 'Jul 01 … Aug 26' date labels placed by dict x_labels fit the business-day
    frequency, and the price axis spans the lows and highs without being forced to
    zero
  - 'Theme tokens flow through the Style object: warm off-white and near-black backgrounds,
    readable ink text and subtle y guides in both renders'
  - Native pygal HTML output adds hover tooltips and a clickable legend that toggles
    up or down bars
  weaknesses:
  - 'VQ-05 (both): the first bar (Jul 01) sits on the y-axis spine; its vertical line
    coincides with the axis line and its open tick protrudes left of the plot area
    by about 0.3 bar spacings (~20 px) → pad the x range so the first and last bars,
    ticks included, sit inside the plot area (about half a bar spacing on each side).
    Likely cause: no xrange set on pygal.XY, so the x range starts at the first bar''s
    x=0.'
  - 'Suggestion: a y label at 150 would let the August lows (≈151–156) be read against
    a labelled gridline, not only against 160.'
  - 'Suggestion: a little space between each legend swatch and its text would make
    the bottom legend read more cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matching #FAF8F1; no pure white.
      Chrome: The title "ohlc-bar · python · pygal · anyplot.ai" is centred at the top in dark ink and takes about 47 % of the width. The y title "Price ($)" is rotated on the left, with ticks at 160, 170, 180 and 190. The x title "Date (Jul 2024 – Aug 2024)" has weekly tick labels from Jul 01 to Aug 26. Dotted y guides are subtle and there are no x guides. A bottom legend shows "Bullish (Close ≥ Open)" with a green swatch on the left and "Bearish (Close < Open)" with a red swatch at the centre. All text is dark and readable.
      Data: 45 daily OHLC bars, each a thin vertical high–low line with a short left open tick and a right close tick. Up bars are #009E73 green and down bars #AE3030 red. Prices trend down from about 189 to about 151 with a rebound around Aug 19–23. The first bar sits on the y-axis spine and its open tick sticks out left of the axis.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matching #1A1A17; no pure black.
      Chrome: The title, axis titles, tick labels and legend text are light (#F0EFE8 / muted grey) and clearly readable. There is no dark-on-dark text. The y guides are subtle but visible.
      Data: same green #009E73 and red #AE3030 bars as the light render, identical positions; only the chrome flipped. Red bars stay visible on the dark surface, and brand green reads well.
      Legibility verdict: PASS
