review:
  strengths:
  - Every bar is a thin vertical low–high line with a short left open tick and right
    close tick, drawn at their exact data values on an un-zeroed price axis (about
    150–190 $).
  - 'Uses pygal.XY with allow_interruptions=True and (None, None) breaks so that only
    two series carry all 45 bars, with direction encoded by Imprint green #009E73
    (up) and red #AE3030 (down).'
  - TICK_WIDTH=0.3 of the bar spacing keeps the ticks long enough to tell left from
    right while a clear gap separates neighbouring bars; xrange is padded so the first
    and last ticks are not cut off.
  - The business-day date axis is labelled every fifth bar (each Monday, 'Jul 01'
    … 'Aug 26'), and the x-axis title carries the date range, which fits the daily
    frequency.
  - 'Theme tokens flow through one Style object: both renders have the correct page
    colour and readable chrome, and the data colours are identical in both themes.'
  - Native pygal HTML output adds hover tooltips for each segment in the interactive
    view.
  weaknesses:
  - 'Suggestion: y gridlines every 10 $ leave the lowest ~8 $ of the data (about 151–159
    $) below the last labelled line at 160; y_labels at 5 $ steps would make exact
    price levels easier to read across the whole range.'
  - 'Suggestion: the axis titles inherit title_font_size=66, the same size as the
    chart title; a smaller axis-title size would give a clearer typographic hierarchy.'
  - 'Suggestion: naming the security (for example a ticker in the descriptive title
    prefix) would anchor the price story.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and plot area.
      Chrome: title "ohlc-bar · python · pygal · anyplot.ai" centered at the top in dark ink; y-axis title "Price ($)" and x-axis title "Date (Jul 2024 – Aug 2024)" in dark ink; y ticks 160–190 and x ticks Jul 01 … Aug 26 (each Monday) are readable; subtle dotted horizontal gridlines only; legend at the bottom with green "Bullish (Close ≥ Open)" and red "Bearish (Close < Open)" swatches. All text readable.
      Data: 45 daily OHLC bars from about 185 $ down to about 152 $; thin vertical high-low lines with a short left tick (open) and right tick (close); up bars in #009E73, down bars in #AE3030; ticks do not touch the neighbouring bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels and legend text flip to light ink and are clearly readable; gridlines subtle and muted; no dark-on-dark text.
      Data: identical bar geometry and identical colours (#009E73 up, #AE3030 down); the red reads a little darker on the dark page but every bar and tick stays distinct.
      Legibility verdict: PASS
