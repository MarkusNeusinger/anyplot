review:
  strengths:
  - Clean OHLC construction from three geom_segment layers (high-low, open tick left,
    close tick right), each mark exactly at its data value
  - Up/down direction mapped through scale_color_manual with limits fixing the order,
    so Up (#009E73) leads the legend and colors match in both themes
  - Theme tokens threaded through every chrome element; both renders fully legible
    on the correct canvas
  - Tick width of 0.3 bar spacings keeps open and close ticks readable while neighbouring
    bars stay clearly separate
  weaknesses:
  - 'Suggestion: the legend title and key glyphs sit right against the left edge of
    the legend frame; a little legend padding (legend_box_margin / legend_margin)
    would let the box breathe.'
  - 'Suggestion: plotting against the real dates with scale_x_date and a timedelta
    tick offset would let plotnine format the time axis natively instead of an index
    plus hand-built labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 with a faint major grid behind the bars.
      Chrome: bold title 'ohlc-bar · python · plotnine · anyplot.ai' in dark INK; axis titles 'Date' and 'Price (USD)'; ticks Jun 03 / Jun 17 / Jul 01 / Jul 15 / Jul 29 and 130-170; legend 'Direction' on an elevated box at the right. All readable.
      Data: 50 OHLC bars: vertical high-low lines with a short left open tick and right close tick; up bars #009E73, down bars #AE3030; price rises from 150 to about 168 in mid-June, then declines to about 125 by mid-August.
      Legibility verdict: PASS

