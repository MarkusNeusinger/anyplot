review:
  strengths:
  - Layered mark_rule charts with x/x2 and y/y2 build the high-low line and the open/close
    ticks natively, with tick length derived from the median bar gap (42%) so neighbouring
    ticks never touch
  - 'Theme tokens threaded through axis, title, legend and view: both renders are
    fully legible and the Imprint up/down colors are identical across themes'
  - Pad-only step lands exactly on the 3200x1800 canvas without cropping
  - .interactive() adds zoom and pan in the HTML view
  weaknesses:
  - 'VQ-02 (both): the legend title ''Direction'' fills the legend box edge to edge,
    its first and last letters touching the frame → at least ~4 px of padding inside
    the frame. Likely cause: legend titleFontSize=12 with default legend padding;
    use titleFontSize=10 as the library prompt suggests or set padding on configure_legend.'
  - 'CQ-04 (code): the ESCAPE translation table (line 59) is defined but never used,
    since the chart reads renamed lower-case columns → remove it or use it on the
    column constants. Likely cause: template line kept after switching to the renamed
    ''bars'' frame.'
  - 'Suggestion: tooltips with open/high/low/close would make the HTML view richer.'
