      Data: the sin(x)cos(y) surface as 2,401 depth-sorted cells in an oblique 45°/25° view; two blue peaks and two green valleys, green (#009E73, low) to blue (#4467A3, high) imprint_seq ramp; edges stair-stepped; faint cell mesh.
