review:
  strengths:
  - Correct 3200x1800 canvas padded (never cropped) per the library contract, with
    balanced margins in both themes
  - imprint_seq green-to-blue ramp for continuous z, identical in both themes, with
    theme-adaptive chrome throughout
  - Painter's algorithm driven by Altair's native alt.Order channel gives correct
    occlusion of near peaks over far valleys
  - Vectorised numpy projection replaces per-cell Python loops; adaptable column constants
    with escaped fields
  - Native interval selection bound to scales provides pan/zoom and formatted tooltips
    in the HTML view
  weaknesses:
  - 'SC-02 (both): only two axes are drawn — the horizontal one is a projected screen
    coordinate and there is no y axis at all — so the spec''s ''all three axes drawn
    and labeled'' (C3) is missed → draw the x, y and z axes of the projected 3D box
    with their own ticks and labels. Likely cause: the chart reuses Altair''s 2D x/y
    axes for the projected screen coordinates.'
  - 'SC-02 (both): the surface''s silhouette is stair-stepped along every edge because
    each grid cell is drawn as its axis-aligned bounding rectangle, so the surface
    reads faceted at its outline (C4) → draw each cell as its projected quadrilateral
    (a polygon per cell). Likely cause: mark_rect with x1/x2/y1/y2 from the min/max
    of the cell corners (lines 59-70).'
  - 'SC-03 (both): the vertical axis is titled ''z (height)'' but its ticks show the
    projected screen_y = depth·sin(25°) + z·cos(25°), so the z = 1.0 peaks read at
    about 1.5 and the z = −1.0 troughs at about −1.5 (+0.5 off) → ticks that read
    z values, or an axis title naming the projected coordinate. Likely cause: alt.Y(''y1'')
    encodes screen_y under the title f''{Z} (height)''.'
  - 'CQ-01 (code): a helper function corners() (lines 53-55) breaks the linear script
    → inline the np.stack of the four corner slices. Likely cause: `def corners(a)`.'
  - 'Suggestion: a slightly higher elevation (about 35°) would separate the near ridge
    from the far trough more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, exact 3200x1800 canvas.
