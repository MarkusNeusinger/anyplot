review:
  strengths:
  - Projects the 31x31 grid obliquely onto pygal.XY, so a library without 3D shows
    peaks and valleys together from a 35° azimuth / 32° elevation view
  - 'Continuous height uses the imprint_seq ramp (#009E73 -> #4467A3) on both mesh
    and colour bar, identical in both themes'
  - 'Theme tokens drive all chrome; text readable on #FAF8F1 and #1A1A17'
  - Overrides pygal's fixed 10 px print_labels stylesheet through inline CSS so tick
    text matches the tick size
  - Data block ends in a tidy long df with column-role constants; the plot reads only
    df and the constants
  weaknesses:
  - 'SC-02 (both): the surface is a see-through wireframe — every grid cell is open
    page colour and the far mesh shows through the near slopes, so it does not read
    as one continuous surface without gaps between facets (C1) → fill each grid cell
    as a polygon in its height colour, drawn far to near so near faces cover far ones.
    Likely cause: edges added as two-point line series only (lines 86-97), no filled
    cells.'
  - 'SC-04 (both): title ''surface-basic · pygal · anyplot.ai'' lacks the language
    segment → ''surface-basic · python · pygal · anyplot.ai''. Likely cause: title
    string on line 178.'
  - 'SC-03 (both): z-axis ticks labelled ''0.3'' and ''-0.3'' sit at +/-0.333 (np.linspace(z_lo,
    z_hi, 4)), so the labels misstate their positions by 0.03 → place ticks at round
    values (e.g. -1, -0.5, 0, 0.5, 1). Likely cause: np.linspace tick positions with
    one-decimal rounding in tick(), lines 109-112.'
  - 'CQ-04 (code): the colour bar is 192 separate series (12 bins x 16 parallel 2-point
    strokes, lines 142-145) → one series per bin with a wide stroke via stroke_style={''width'':
    ...}. Likely cause: hand-filled bar from hairlines.'
  - 'CQ-01 (code): four helper functions, of which tick() and bin_of() are one-line
    expressions → inline those two. Likely cause: helper defs at lines 77-83.'
  - 'Suggestion: the x and y ''-5'' ticks sit next to each other at the front corner;
    nudging their offsets apart would make it clearer which axis each belongs to.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, no guides.
      Chrome: title 'surface-basic · pygal · anyplot.ai' centred at top in dark ink; muted grey base box and z axis with ticks 1 / 0.3 / -0.3 / -1, x and y ticks -5 / 0 / 5 along the front edges, axis letters x, y, z, and a colour bar on the right labelled z with 1 / 0 / -1. All text dark and readable.
      Data: wireframe mesh of z = sin(r)*cos(x/2) over a 31x31 grid, oblique view; strokes coloured by height from brand green #009E73 (valleys) to blue #4467A3 (peaks). The wireframe is see-through: far mesh lines show through near slopes, cells are open.
      Legibility verdict: PASS

