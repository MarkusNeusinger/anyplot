  strengths:
  - 'Uses the Imprint imprint_seq colormap (#009E73 -> #4467A3) so color and height
    tell the same story, with a colorbar labeled ''Amplitude'''
  - 'Theme tokens reach every element in both renders: transparent 3D panes, INK_SOFT
    pane edges and axis lines, a theme-tinted pane grid set through rcParams, and
    colorbar ticks and outline'
  - Oblique view (elev 30, azim 45) shows the ring peak, the central dip and the outer
    trough together
  - 'Strict basic variant: one continuous 40x40 surface with no contours, markers
    or reference planes'
  - 'Follows the adaptable-code contract: tidy df with column constants, pivot_table
    back to the grid, axis labels from the constants'
  weaknesses:
  - 'VQ-06, DQ-02 (both): the x and y axes are titled with the placeholders ''X Axis''
    and ''Y Axis'', which name no quantity or unit → descriptive names for the grid
    coordinates (for example ''Distance East (m)'' / ''Distance North (m)'' with z
    ''Wave Height (m)''). Likely cause: the X / Y column constants.'
  - 'VQ-05 (both): the 3D box occupies only the middle ~55 % of the canvas width,
    leaving an empty band of about 17 % on the left while the colorbar sits far right
    → let the axes fill more of the width (about +10 % on the left). Likely cause:
    fig.subplots_adjust(left=0.0, right=0.92) together with colorbar pad=0.06 and
    the default 3D box aspect; e.g. ax.set_box_aspect(None, zoom=1.15) or a narrower
    colorbar pad.'
  - 'Suggestion: light shading (matplotlib.colors.LightSource with facecolors from
    imprint_seq) would make the ring''s curvature read more plastically than the flat
    cmap fill.'
  - 'Suggestion: antialiased=True removes the faint diagonal facet streaks visible
    on the steep slopes.'
