review:
  strengths:
  - 'Native plot_surface with the imprint_seq colormap (#009E73 → #4467A3): color
    follows height and the color bar names the quantity, Wave Height (m)'
  - 'Theme tokens reach every 3D chrome element in both renders: transparent panes
    with INK_SOFT edges, axis lines, ticks, color-bar outline, and a pane grid set
    through rcParams before the axes is created'
  - set_box_aspect((1.5, 1.5, 0.75), zoom=1.08) together with view_init(elev=30, azim=45)
    gives an oblique view that fills the 16:9 canvas and shows the central crater
    and the surrounding flat water together
  - A smooth 40 × 40 grid with linewidth=0 and default shading reads as one continuous
    surface without holes or visible facets
  - The data flows through the tidy df and the column constants into pivot_table,
    so the axis and color-bar labels come from the data
  weaknesses:
  - 'DQ-03 (both): the ripple on a pond peaks at about 0.8 m wave height over an 8
    m × 8 m domain, which is implausible for a pond ripple → an amplitude of about
    0.05–0.1 m (about −0.7 m), or a different physical scenario whose scale fits a
    0.8 m height. Likely cause: the Z formula sin(r)·exp(−0.1 r²) is used with amplitude
    1 and no scale factor.'
  - 'Suggestion: lowering the elevation slightly (for example elev=25) would make
    the crater inside the peak read more clearly as a dip.'
