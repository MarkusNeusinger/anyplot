review:
  strengths:
  - 'Uses the Imprint sequential ramp (imprint_seq, #009E73 -> #4467A3) for the continuous
    surface, identical across both themes'
  - Single smooth 40x40 go.Surface from an oblique camera shows peaks, ring valley
    and saddles together without holes or faceting
  - 'Chrome threaded through theme tokens: title, axis titles, ticks and color bar
    text readable on #FAF8F1 and #1A1A17'
  - Tidy long table pivoted with pandas pivot_table into the grid, so the file adapts
    to a user's own CSV
  - HTML export keeps Plotly's native 3D rotation and hover for exploring the surface
  weaknesses:
  - 'VQ-05 (both): the 3D scene fills only the central ~40 % of the 3200 px width,
    leaving a ~550 px empty band between the surface and the color bar and a tall
    gap under the title → let the scene fill the plot area (scene domain x about [0,
    0.9], or a closer camera eye about 1.25,1.25,1.0). Likely cause: default scene
    domain with camera eye (1.5, 1.5, 1.2).'
  - 'VQ-06 (both): axis titles ''X Axis'', ''Y Axis'', ''Z Value'' name the axis rather
    than the quantity → reader text such as ''x'', ''y'', ''z = f(x, y)''. Likely
    cause: the X, Y, Z column constants on lines 26-28.'
  - 'VQ-07 (dark): scene zero lines render near-white and cut through the walls and
    floor, far brighter than the 0.15-alpha grid → zero lines in INK_SOFT or GRID
    like the chrome mapping in the library prompt. Likely cause: zerolinecolor not
    set in the axis dicts.'
  - 'CQ-01 (code): lines 61-68 define a helper function def axis(label) → a shared
    dict literal (axis_style = {...}) merged per axis with {**axis_style, ''title'':
    ...}, no function. Likely cause: the per-axis style was factored into a function.'
  - 'Suggestion: a subtle lighting or contours.z highlight setting on the surface
    could deepen the shading of the slopes without adding a layer.'
