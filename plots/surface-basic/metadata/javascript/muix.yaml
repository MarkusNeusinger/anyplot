review:
  strengths:
  - 'Builds the 3D surface inside MUI X''s composition API: ChartsDataProvider with
    position-none iso axes, a custom SurfaceLayer in ChartsSurface reading useXScale/useYScale,
    and quad fills from useZColorScale on a continuous zAxis colorMap built from the
    Imprint imprint_seq stops (t.seq).'
  - The same zAxis drives a native ContinuousColorLegend titled 'Elevation (m)', so
    color bar and surface colors come from one scale.
  - Native pointer-drag rotation (azimuth on horizontal drag, tilt clamped to 10-60
    degrees on vertical drag) fulfils the spec's rotation note in the HTML output.
  - Mesh lines are drawn in the page color at 0.35 opacity, so they read as light
    highlights in light mode and dark seams in dark mode without hiding the colormap.
  - Tick labels on the ground axes are pushed outward along the projected edge normal,
    so labels never sit on the surface; the opening oblique view shows the hills and
    basins together.
  - 'Clear typographic hierarchy: 22 px semibold title, 15 px inkSoft subtitle with
    grid size and range, 16 px semibold axis titles over 14 px inkSoft ticks.'
  weaknesses:
  - 'DQ-02 (both): the terrain is a textbook egg-crate, 420 + 80·sin((x−6)/2)·cos((y−6)/2),
    with every hill and basin exactly ±80 m around 420 m, which reads as a math function
    relabelled as elevation rather than surveyed ground → give the hills and basins
    unequal heights and widths (e.g. a sum of two or three Gaussian hills and basins
    of different amplitude, or a gentle regional slope), keeping one surface. Likely
    cause: the single sin·cos expression in the z data line.'
  - 'Suggestion: the color bar shows only its min and max (340.4, 499.6); a few intermediate
    ticks at the z-axis values (350, 400, 450) would tie it to the z axis.'
  - 'Suggestion: the z axis ends near 500 m without a top tick label; extending the
    tick set to the axis top would close the scale.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: centered title "surface-basic · javascript · muix · anyplot.ai" in dark semibold ink, subtitle "30 × 30 grid · Elevation (m) from 340.4 to 499.6" in softer ink. Three axes drawn as dark lines: Easting (km) along the front-left ground edge (ticks 0-12 every 2), Northing (km) along the front-right edge (0-12), a vertical Elevation (m) axis at the left corner (ticks 350, 400, 450). The far base edges are a faint grid-colored outline. All text dark on light and readable; nothing clipped.
      Data: one continuous 30 × 30 surface in an oblique view (azimuth 45°, tilt 25°): a tall hill at the back, a hill right of center, a partial hill at the left edge, a deep basin at the front corner and a basin in the middle. Fill runs brand green #009E73 (low) to blue #4467A3 (high) per imprint_seq; mesh lines are thin light page-colored lines. No holes or tears. Vertical continuous color bar on the right titled "Elevation (m)" labelled 340.4 to 499.6.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, subtitle, axis titles and tick labels flip to light ink and are all readable; axis lines light gray; far base outline subtle gray. No dark-on-dark text.
      Data: identical surface geometry and identical green→blue fills as the light render; only the mesh lines flip to dark page-colored seams. Color bar identical, labels light.
      Legibility verdict: PASS
