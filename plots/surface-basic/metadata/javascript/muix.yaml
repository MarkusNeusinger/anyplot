review:
  strengths:
  - Isometric hand-rolled surface projection (following the scatter-3d precedent)
    reads as a genuine 3D surface despite MUI X community having no native 3D chart
    type
  - Diverging Imprint colormap (matte red -> theme-adaptive midpoint -> blue) is the
    semantically correct choice for sin(x)*cos(y), which has a real zero baseline,
    and is built exactly per the style guide's imprint_div recipe
  - ContinuousColorLegend with descriptive 'valley'/'peak' min/max labels satisfies
    the spec's colorbar suggestion and is legible in both themes
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, fully
    legible chrome, and identical data colors between light and dark (only the diverging
    midpoint shifts, which is the intended theme-adaptive behavior)'
  - Deterministic, seed-free data generation and correct 30x30 grid size per spec
  - Idiomatic low-level MUI X usage via useXScale/useYScale hooks to draw a custom
    reference frame inside ChartContainer, entirely within the community package surface
  weaknesses:
  - 'Duplicate/stale header block: lines 1-4 are leftover boilerplate from a prior
    attempt (''Library: muix 7.29.1 | JavaScript 22.23.2'', ''Quality: 77/100''),
    immediately followed by a second, differently-formatted canonical header at lines
    6-10. Remove the stale lines 1-4 entirely and move ''//# anyplot-orientation:
    landscape'' to line 1 as the library rules require (''keep it on its own line
    at the very top'').'
  - 'No real rotation/interactivity: the spec asks interactive libraries to ''enable
    rotation to explore the surface from different angles'', but this is a static
    isometric SVG projection with no camera controls in either the PNG or the emitted
    HTML. This is an accepted MUI X community limitation (same as scatter-3d''s precedent)
    rather than an implementation oversight, but it''s a genuine spec gap worth acknowledging
    in a code comment.'
  - The reference frame (z-axis line, dashed ground-plane edges) is drawn by IsoFrame
    strictly after SurfaceMesh with no depth test against the mesh, so the solid z-axis
    line and dashed ground lines visibly cut across surface peaks instead of being
    occluded by nearer geometry — a minor depth-ordering artifact in both renders.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "surface-basic · javascript · muix · anyplot.ai" centered top, fully readable. Axis reference labels "y · [-3, 3]" (left) and "x · [-3, 3]" (right) at the ground plane, and "z = sin(x)·cos(y)" floating above with a vertical line down to the height axis — all dark text on the light background, clearly legible. Dashed gray ground-plane lines and a solid dark z-axis reference line are visible crossing the surface. Bottom-center ContinuousColorLegend reads "-0.99 (valley)" to "0.99 (peak)" with a red-to-blue gradient bar, legible dark text.
      Data: A hand-projected isometric surface (30x30 quad mesh) showing two blue peaks and two red valleys (sin(x)*cos(y) over [-3,3]x[-3,3]), diverging Imprint colormap (matte red -> near-white midpoint -> blue), quads outlined with thin page-background strokes for separation.
      Legibility verdict: PASS — all title, axis, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title and axis reference labels, now rendered in light/off-white text, fully legible against the dark background. Dashed ground-plane lines and the z-axis line render in a lighter gray, still visible but subtle. Bottom-center legend text switches to light-colored digits/words, clearly readable, with the same red-to-blue gradient bar (its near-white midpoint replaced by a near-black midpoint, which is the theme-adaptive behavior the imprint_div recipe calls for).
      Data: Same two peaks/two valleys, same red/blue extremes as the light render — the actual data-color hues (matte red, blue) are visually identical between renders; only the theme-adaptive midpoint and all chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark text found; all chrome elements (title, axis reference text, legend labels) use light ink against the dark surface.
