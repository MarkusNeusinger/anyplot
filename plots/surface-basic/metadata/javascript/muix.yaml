      Background: warm off-white, matches #FAF8F1
      Chrome: title "surface-basic · javascript · muix · anyplot.ai" centered top in dark ink; "x · [-6, 6]" / "y · [-6, 6]" axis labels at ground-plane line ends; "z = sin(x)·cos(y)" label near a short vertical stub; bottom legend labeled "-1.00 (valley)" / "1.00 (peak)" -- all clearly readable
      Data: Imprint diverging scale (matte red valleys -> near-white midpoint -> blue peaks) across ~29x29 filled quads with cream borders
      Legibility verdict: PASS (all chrome text readable; two rendering defects noted separately -- broken legend gradient and undersized z-axis stub -- are not legibility failures)

    Dark render (plot-dark.png):
