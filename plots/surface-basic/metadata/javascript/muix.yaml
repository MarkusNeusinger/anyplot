review:
  strengths:
  - 'Composes the chart idiomatically from community MUI X primitives: ChartsDataProvider
    with a zAxis continuous colorMap, useZColorScale inside a custom ChartsSurface
    layer, and the native ContinuousColorLegend, so the surface colors and the color
    bar share one scale'
  - 'Color follows height through the Imprint sequential ramp (t.seq: #009E73 low
    to #4467A3 high), identical in both themes; only the chrome flips'
  - Equal px-per-unit oblique projection keeps the axis angles true and shows the
    near valley and the far peaks together, with all three axes ticked and labeled
    with units
  - 30 x 30 grid painted back to front with a faint page-colored mesh stroke reads
    as one smooth continuous surface without gaps or tears
  - Plausible terrain scenario (Easting/Northing in km, Elevation 340-500 m) with
    deterministic data
  weaknesses:
  - 'SC-02 (code): the spec''s Notes ask interactive libraries to enable rotation,
    and the HTML output is a fixed projection with no way to change the view angle
    → let a pointer drag (or a slider from @mui/material) update VIEW_ANGLE and the
    azimuth through React state and recompute the projected vertices. Likely cause:
    VIEW_ANGLE is a module constant and the vertices are projected once at module
    load.'
  - 'Suggestion: the color bar labels only its two extremes; a few intermediate ticks
    (400, 450) would let the reader read heights off the bar as well as off the z
    axis.'
  - 'Suggestion: the Easting and Northing ''12'' tick labels sit side by side at the
    front corner; offsetting them slightly further apart would separate the two axes''
    endpoints.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: title "surface-basic · javascript · muix · anyplot.ai" in dark ink at top center, subtitle "30 × 30 grid · Elevation (m) from 340.4 to 499.6" in soft ink; base frame with ticked front edges "Easting (km)" (0-12) and "Northing (km)" (0-12), vertical z axis at the left corner ticked 350/400/450 with title "Elevation (m)"; faint grid-colored back edges of the base. Vertical color bar on the right titled "Elevation (m)" with 340.4 / 499.6 labels. All text dark and readable.
      Data: one continuous 30x30 surface in oblique view, two hills (blue #4467A3 tops) and two basins (green #009E73 bottoms), thin light mesh lines; no gaps or holes. Low = brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink, axis lines light gray, back base edges subtle; no dark-on-dark text anywhere. Color bar labels light and readable.
      Data: surface colors identical to the light render (green to blue ramp); mesh lines now page-dark, still subtle and showing curvature.
      Legibility verdict: PASS
