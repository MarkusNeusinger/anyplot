review:
  strengths:
  - 'Correct, spec-matching plot type: a true projected 3D surface with height driving
    both elevation and color'
  - 'Correct palette reasoning: uses imprint_div (not a named colormap) because the
    data has a genuine zero baseline'
  - 'Clean theme handling: identical data colors between light/dark, only chrome flips,
    both backgrounds exactly match required hex values'
  - Title format, axis labels with explicit ranges, and colorbar all present and match
    spec requirements
  - Fully deterministic, dependency-free data generation; idiomatic use of ChartContainer
    + scale hooks within the community-only constraint
  weaknesses:
  - 'z-axis reference line renders as a disconnected ~1-unit-tall stub instead of
    spanning ground-to-peak: heightEndPoint divides by HEIGHT_SCALE before project()
    multiplies by it again, canceling the exaggeration used by the surface itself'
  - ContinuousColorLegend color bar renders as three thin discontinuous stripes (red
    / gap / blue) instead of a smooth diverging gradient, failing to communicate the
    valley-to-peak color mapping
  - Domain [-6,6] x [-6,6] for sin(x)*cos(y) produces a visually busy ~4-peak/~4-valley
    surface in isometric projection, reading as more tangled than a basic intro surface
    plot ideally would
  - No rotation control despite the spec asking interactive libraries to enable rotation
    to explore the surface from different angles (accepted MUI X limitation, but still
    an unmet feature)
  image_description: |-
