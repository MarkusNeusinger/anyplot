review:
  strengths:
  - 'Both weaknesses flagged in the previous review are fixed: the near-zero diverging
    band ("-0.14 to 0.14") is now visible via a 1px inkSoft stroke on every marker
    (pixel-verified via cropped inspection — every cell, including near-background-colored
    ones, has a clear border), and the right margin now matches the left (100px vs
    98px, pixel-measured) instead of the grid touching the canvas edge.'
  - Correct diverging Imprint palette (t.div) for signed data with a meaningful zero;
    data colors are pixel-identical between light and dark renders (only chrome flips),
    matching the style guide's continuous-data rule.
  - 'Idiomatic, well-documented Highcharts technique: chart.events.load computes marker
    radius from axis.toPixels() after real layout, and mirrors plotLeft onto marginRight
    so the tiled grid sits symmetrically instead of guessing margins.'
  - 'Honest engineering: code comments explicitly document why a true 3D surface/heatmap
    can''t be used (only the core Highcharts bundle is vendored, no highcharts-3d/colorAxis/heatmap
    module) instead of faking 3D or interactivity.'
  - Clean theme-adaptive chrome throughout (title, subtitle, axis, legend), animation
    disabled on chart and series, credits watermark removed, fully deterministic in-memory
    data generation.
  weaknesses:
  - The 7-band discretization is visibly blocky (each band spans ~0.29 z-units) rather
    than a smooth gradient — the spec's 'smooth colormap' note is only partially satisfied.
    A finer band count (e.g. 12-16) or a per-point interpolated fillColor (still per-marker,
    no colorAxis module needed) would read closer to a continuous surface.
  - No true 3D surface or interactive rotation, as the code comments document — this
    is a hard constraint of the core-only Highcharts bundle (no highcharts-3d module
    loaded), not something further repair can address, and was already weighed into
    the SC-01/SC-02 scores.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (sampled RGB 250,248,241 at canvas corner). Not pure white, not dark.
      Chrome: Title "surface-basic · javascript · highcharts · anyplot.ai" and subtitle "Response surface z = sin(x)·cos(y), sampled on a 34×34 grid — color encodes height" in dark ink, both clearly legible. X/Y axis titles ("x", "y") and tick labels in soft dark gray, all legible. Legend "Height z" with 7 range labels sits below the plot; all 7 swatches are now visibly bordered squares (verified via pixel crop) — including the "-0.14 to 0.14" band whose fill nearly matches the page background but is now outlined with a 1px ink-toned stroke, unlike the previous attempt where that band vanished entirely.
      Data: 34x34 grid of square markers tiled edge-to-edge across x,y in [-4.5, 4.5], colored by a 7-band diverging red-blue (Imprint div) scale keyed to z = sin(x)*cos(y). The tiling now reads as a continuous surface with a clear sinusoidal ridge/valley pattern — no illusory gaps. Margins are now symmetric: pixel-measured left margin is 100px, right margin is 98px (previously the grid touched the absolute right canvas edge with zero margin).
      Legibility verdict: PASS for all text and all data elements — no invisible bands, no clipped edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (sampled RGB 26,26,23). Not pure black, not light.
      Chrome: Title and subtitle in light ink, clearly legible against the dark background — no dark-on-dark failure. Axis titles/ticks and legend text in soft light gray, all legible.
      Data: Identical red-blue diverging hues and identical grid layout/values as the light render — data colors are correctly unchanged between themes (only chrome flipped). Same fixed tiling with visible borders on every cell (including the near-black middle band) and the same symmetric left/right margins.
      Legibility verdict: PASS for all text and all data elements — the same fixes hold in both themes, confirming the border-stroke and margin-mirroring logic is theme-independent.
