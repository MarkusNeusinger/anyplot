review:
  strengths:
  - Honest, well-documented workaround for a hard library limitation (comments cite
    the specific forbidden highcharts-3d/heatmap/colorAxis modules) instead of faking
    3D or interactivity.
  - Correct diverging Imprint palette (t.div) applied to signed data with a meaningful
    zero, matching the style guide's continuous-data rule.
  - Marker radius is computed dynamically from axis.toPixels() inside chart.events.load,
    after real layout, so the grid tiles edge-to-edge regardless of legend/axis chrome
    width — a genuinely idiomatic Highcharts technique.
  - 'Clean theme-adaptive chrome: ink/inkSoft tokens threaded through title, subtitle,
    axis labels, and legend; animation disabled on chart and series; credits watermark
    disabled.'
  - Deterministic in-memory data generation and correct mandated title format.
  weaknesses:
  - 'The middle diverging color band (''-0.14 to 0.14'', i.e. t.div[1]) is visually
    indistinguishable from BOTH page backgrounds — pixel-sampled: the legend swatch
    renders at RGB(250,248,241) in light mode, identical to the #FAF8F1 page background,
    and at RGB(25,25,22) in dark mode, within 1 unit of the #1A1A17 page background.
    Every grid square in that z-range vanishes into the chrome, producing illusory
    ''holes''/gaps in the tiled surface in both renders (and the legend shows a label
    with no visible swatch). Fix: add a thin marker stroke (e.g. `lineWidth: 1, lineColor:
    t.inkSoft` or `t.grid`) on all band series so near-zero cells stay visible against
    both page backgrounds, or shift the mid-band fill a few percent away from the
    raw t.div[1] token.'
  - 'Data squares are tiled flush to the absolute right edge of the canvas — colored
    pixels are present at the very last pixel column (x=2399 of 2400) across roughly
    80% of the plot height in both renders — while the left edge keeps a full clean
    margin. This asymmetric layout looks unbalanced. Fix: increase xAxis.maxPadding
    (currently 0.03) or shrink the computed marker radius slightly so the rightmost
    column keeps the same breathing room as the left edge.'
  - No true 3D surface or rotation is present — implemented as a flat tiled-scatter
    pseudo-heatmap because the core Highcharts bundle used by this project has no
    highcharts-3d/colorAxis/heatmap module. This is the correct call given the hard
    library constraint (documented in the code's own comments) and not something the
    repair loop can fix, but it does mean SC-01/SC-02 cannot score highly against
    the spec's explicit '3D surface' and 'enable rotation' requirements.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (sampled RGB 250,248,241). Not pure white, not dark.
      Chrome: Title "surface-basic · javascript · highcharts · anyplot.ai" and subtitle in dark ink, both clearly legible. X/Y axis titles ("x", "y") and tick labels in soft dark gray, all legible. Legend "Height z" with 7 range labels sits below the plot; 6 of 7 swatches are visible colored squares, but the "-0.14 to 0.14" swatch is invisible (its fill color is pixel-identical to the page background).
      Data: 34x34 grid of square markers tiled across x,y in [-4.5, 4.5], colored by a 7-band diverging red-blue (Imprint div) scale keyed to z = sin(x)*cos(y). Because the middle band's color matches the page background, the plot shows visible "gaps"/holes where z is near zero, breaking the appearance of a continuous tiled surface. Markers touch the absolute right edge of the canvas with no margin, while the left edge has a full clean margin (asymmetric).
      Legibility verdict: PASS for all text; FAIL for the middle-band legend swatch and the corresponding data squares (invisible against background, not a text legibility issue but a data-visibility issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (sampled RGB 26,26,23). Not pure black, not light.
      Chrome: Title and subtitle in light ink, clearly legible against the dark background — no dark-on-dark failure. Axis titles/ticks and legend text in soft light gray, all legible. Same legend layout as light render; the "-0.14 to 0.14" swatch is again invisible, this time because its fill (RGB ~25,25,22) is within 1 unit of the dark page background (RGB 26,26,23).
      Data: Identical red-blue diverging hues and identical grid layout/values as the light render — data colors are correctly unchanged between themes (only chrome flipped). Same illusory "gaps" from the invisible middle band, and the same right-edge-flush marker tiling as the light render.
      Legibility verdict: PASS for all text; FAIL for the middle-band legend swatch and matching data squares (same visibility bug as light render, confirming it is theme-independent, not a dark-mode-specific token bug).
