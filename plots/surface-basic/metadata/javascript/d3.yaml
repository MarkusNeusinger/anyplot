review:
  strengths:
  - Drag-to-rotate interactivity now implemented (d3.drag() updates azimuth/elevation
    and re-projects the surface, axes, and ticks live) — directly resolves the spec's
    explicit rotation requirement flagged in attempt 1.
  - The attempt-1 'Position X (m)' label-on-surface overlap is fixed — no axis title
    now sits on top of the colored mesh in either render.
  - Genuine bespoke 3D-to-2D projection (azimuth spin + elevation tilt) with a painter's-algorithm
    back-to-front quad sort for correct depth occlusion — the standard, idiomatic
    D3 technique for 3D surfaces since D3 has no native 3D module.
  - Correct use of the diverging Imprint colormap (imprint_div) for signed amplitude
    data, with a theme-adaptive midpoint and identical data colors between light and
    dark renders.
  - Well-constructed colorbar (linearGradient + d3.axisRight) with correct direction,
    clear 'Amplitude' label, and no edge clipping in either render.
  - Full theme-adaptive chrome with no dark-on-dark/light-on-light failures.
  - Deterministic, plausible, neutral data (standing-wave interference, sin(x)*cos(y))
    at an appropriate 38x38 grid density within the spec's 30-50 range.
  weaknesses:
  - 'The three axis titles (''Position X (m)'', ''Position Y (m)'', ''Wave Amplitude'')
    all collapse onto nearly the same screen column at the far-left margin of the
    canvas, disconnected from the diagonal axis lines they label (the X and Y axis
    lines run to the upper-right and lower-right respectively, ending at their ''4''
    tick labels there). This happens because the current azimuth/elevation view puts
    the box center almost exactly at the near-corner origin, so the outward-ray-cast
    label placement (edgeLabel()) degenerates and pushes all three titles out through
    the same top-left region instead of each exiting near its own axis line. Every
    label is still individually legible, but a reader can no longer tell which title
    belongs to which line from position alone — they read as a disconnected sidebar
    list rather than axis labels. Fix: after computing an axis title''s placement,
    bias it toward the midpoint of that specific axis segment (e.g. blend the edgeLabel()
    result with the screen-space normal offset from the axis line''s own midpoint)
    rather than relying solely on the ray from the full bounding-box center, so each
    title stays visually anchored near its own line regardless of rotation.'
  - Title still runs slightly under the 50-70% width target (~48% of canvas width)
    — better than attempt 1's ~41%, but a touch more fontsize headroom would strengthen
    the visual hierarchy.
  - The 'Wave Amplitude' z-axis title (rotated -90 degrees, vertical) sits close to
    the z-axis tick labels (0.5 / 0.0 / -0.5) in the same left-margin region — not
    clipped or unreadable, but the vertical spacing is tighter than ideal given both
    now occupy the same narrow left strip.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Wave Interference Surface · surface-basic · javascript · d3 · anyplot.ai" in bold dark ink, top-center, fully readable. Axis triad drawn in dark-ink lines with soft-ink tick labels along both ground-plane diagonals and the vertical amplitude axis. Axis titles "Position X (m)", "Position Y (m)", "Wave Amplitude" are all legible individually, but all three land in the same narrow column at the far-left canvas margin, away from the axis lines they describe (see weaknesses). Colorbar at right, labeled "Amplitude", with readable tick values (0.5, 0.0, -0.5).
      Data: 38x38-cell 3D surface mesh showing a clear sin(x)*cos(y) standing-wave interference pattern, colored with the red(negative)-neutral-blue(positive) diverging Imprint colormap (imprint_div), painter's-algorithm depth-sorted so occlusion reads correctly.
      Legibility verdict: PASS (all text readable against the light background; no light-on-light failures; the axis-title clustering is a placement/association issue, not a contrast/legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render, now rendered in light ink (title/axis titles ~#F0EFE8, ticks in a lighter soft-ink) — clearly readable throughout, no dark-on-dark failures. Same axis-title clustering issue as the light render (identical layout, just re-themed).
      Data: Same red/blue diverging surface, confirmed pixel-identical data colors to the light render — only chrome (background, text, axis-triad lines) flips between themes.
      Legibility verdict: PASS (all text readable against the dark background; no dark-on-dark failures).
