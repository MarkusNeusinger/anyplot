review:
  strengths:
  - Genuine bespoke 3D-to-2D projection (azimuth spin + elevation tilt) with a painter's-algorithm
    back-to-front quad sort for correct depth occlusion — this is the standard, idiomatic
    D3 technique for 3D surfaces since D3 has no native 3D module.
  - Correct use of the diverging Imprint colormap (imprint_div) for the signed amplitude
    data, with a theme-adaptive midpoint and identical data colors between light and
    dark renders.
  - 'Full theme-adaptive chrome: backgrounds, ink tones, grid, and axis strokes all
    correctly flip between #FAF8F1/light-ink and #1A1A17/light-on-dark ink with no
    dark-on-dark or light-on-light failures.'
  - Well-constructed colorbar (linearGradient + d3.axisRight) with correct direction
    and a clear 'Amplitude' label; no clipping or edge cropping in either render.
  - Deterministic, in-memory data generation (sin(x)·cos(y) standing-wave pattern)
    at an appropriate 38×38 grid density with a plausible, neutral real-world framing
    (membrane wave interference).
  weaknesses:
  - No rotation interactivity was implemented despite the spec's explicit note ('For
    interactive libraries, enable rotation to explore the surface from different angles').
    D3 is rendered as an interactive-HTML library but the script has zero event listeners
    (no drag/mousemove handlers to update azimuth/elevation and re-project) — the
    HTML output is visually identical to the static PNG. Add a drag handler that updates
    AZIMUTH/ELEVATION and re-runs project()+toScreen() on 'mousemove' while dragging,
    which is the classic D3 technique for exactly this plot type.
  - The 'Position X (m)' axis-title text is placed directly on top of the colored
    surface mesh in both renders (screen-space offset of the axis midpoint lands mid-surface)
    — it stays legible but overlaps data, which is a no-overlap violation. Move it
    further outward along the screen-space normal of the x-axis line, mirroring how
    'Position Y (m)' correctly lands in empty background space.
  - Title occupies only ~41% of canvas width (measured), below the ~50-70% target
    proportion for a title of this length — consider a slightly larger title fontsize
    (or a smaller shrink ratio) so it carries more visual weight as the primary hierarchy
    element.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct — not pure white.
      Chrome: Title "Wave Interference Surface · surface-basic · javascript · d3 · anyplot.ai" in dark ink, bold, top-center. Axis triad (x/y/z) drawn as dark-ink lines with soft-ink tick labels (-4..4 on x/y, -0.5..0.5 on z) and axis titles "Position X (m)", "Position Y (m)", "Wave Amplitude". Colorbar at right labeled "Amplitude" with soft-ink tick labels and border. All chrome text is clearly readable against the light background.
      Data: A 38x38-cell surface mesh rendered with a red(negative)-to-neutral-to-blue(positive) diverging colormap (Imprint imprint_div), showing a clear sin(x)*cos(y) standing-wave interference pattern with alternating peaks (blue) and troughs (red). Cell borders use a subtle light-colored stroke that reads as a fine mesh grid over the surface.
      Legibility verdict: PASS overall, with one caveat — the "Position X (m)" axis title sits directly on top of the surface data (visible in the mid-canvas area) rather than in empty space; text remains readable (dark ink over medium-toned mesh) but overlaps data.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct — not pure black.
      Chrome: Same title, axis triad, tick labels, and axis titles as the light render, now in light ink (#F0EFE8 for title/axis titles, lighter soft-ink for ticks) — clearly readable against the dark background, no dark-on-dark failures observed.
      Data: Identical data colors to the light render — same red/blue diverging surface, confirming data-color consistency across themes as required.
      Legibility verdict: PASS overall, same "Position X (m)" overlap-with-data caveat as in the light render (confirmed in both themes).
