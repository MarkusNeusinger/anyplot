review:
  strengths:
  - Clever isometric 3D projection (axonometric transform + painter's-algorithm depth
    sort of quad facets via a custom renderItem series) works around echarts-gl not
    being available, rather than faking or skipping the 3D surface
  - Sequential Imprint colorbar (t.seq) is correctly used for the continuous height
    field instead of the categorical palette, with color direction matching the surface's
    visual elevation (blue high, green low) consistently in both themes
  - Axis labels and tick labels are anchored to real data coordinates via chart.convertToPixel,
    not decorative overlays, so they stay correct regardless of layout
  - Realistic, neutral response-surface-methodology data (chemical yield vs. temperature/pressure)
    with a clear single optimum and deterministic generation (no RNG)
  - 'Theme-adaptive chrome is threaded correctly end to end: backgrounds, ink/inkSoft
    text, and facet stroke color (matches page background to create the mesh-line
    look) all flip correctly between light and dark with identical data colors'
  weaknesses:
  - Pressure axis only shows two tick labels (3 bar, 5 bar) — the 1 bar minimum tick
    is dropped entirely to avoid overlapping the temperature axis's shared origin
    label ('150°C'), rather than offsetting one of the two labels so both axes show
    their full range
  - The spec's 'enable rotation to explore the surface from different angles' note
    isn't met — the projection is a fixed isometric viewpoint with no interactive
    rotate, even in the HTML output. This is a consequence of echarts-gl being disallowed
    in this repo rather than a flaw in this implementation's approach, but it's worth
    noting for spec coverage
  - The manual projection pipeline (yieldAt, project, toPixel helpers plus the facet-sort
    step) is meaningfully more code/structure than a typical KISS single-series chart,
    though the complexity is justified by the lack of a native 3D surface type in
    ECharts without echarts-gl
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Yield Response Surface · surface-basic · javascript · echarts · anyplot.ai" is dark and clearly readable at top center. "Pressure (bar)" and "Temperature (°C)" axis titles are dark gray and legible. Tick labels (150°C, 200°C, 250°C, 3 bar, 5 bar) are smaller gray text, clearly legible against the light background. Colorbar title "Yield (%)" in dark ink, "High yield (%)" / "Low yield (%)" labels in softer gray, both legible.
      Data: The surface is a smooth dome (paraboloid response surface) colored with a blue-to-green sequential gradient (Imprint imprint_seq) — blue at the peak (high yield), green toward the edges (low yield). No categorical brand-green single-series color is used, which is correct since this is continuous height data, not a categorical series. Thin light-colored mesh lines outline each quad facet, giving a clear 3D wireframe-over-surface look. Two thin axis-guide lines run from the origin along temperature/pressure ground directions.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all render in light gray/white tones, clearly legible against the dark background. No dark-on-dark failures observed — every label is legible. Colorbar text is legible light-gray on dark.
      Data: Same blue-to-green sequential gradient as the light render — data colors are identical between themes as required, only chrome (background, text, mesh-line stroke color which follows page background) flips. Mesh lines are now dark, still visible as fine facet boundaries against the colored surface.
      Legibility verdict: PASS — all text is light-on-dark and clearly readable, no dark-on-dark issues, no overlaps.
