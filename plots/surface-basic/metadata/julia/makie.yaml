review:
  strengths:
  - Theme-adaptive chrome correctly threaded through every Axis3 element (ticks, spines,
    grid, panels) and the Colorbar for both light and dark renders
  - Exact required title format and fully deterministic, RNG-free data generation
    (sin(x)*cos(y)*exp(-decay))
  - 'Idiomatic Makie 3D API usage: Axis3 + surface! + a linked Colorbar(fig[1,2],
    surf), with tuned azimuth/elevation/aspect for a legible viewing angle'
  - Correct use of the Imprint diverging colormap for signed continuous data, with
    identical data colors between themes
  weaknesses:
  - Large unused vertical whitespace above and below the 3D surface -- the plot content
    fills well under half the canvas height; tune camera zoom, protrusions, or aspect
    so the surface uses more of the 3200x1800 frame
  - The diverging colormap's white midpoint equals the exact page background color,
    so near-zero (z is approximately 0) surface regions visually blend into the panel
    walls and canvas background -- most visible in the light render's saddle regions.
    Consider a midpoint slightly distinct from the page background, or add a subtle
    wireframe/edge highlight for depth cues
  - Colorbar label 'z' is less descriptive than the z-axis label 'Amplitude (z)' --
    align the two for consistency
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- correct, not pure white.
      Chrome: Title "surface-basic · julia · makie · anyplot.ai" is bold, dark ink, clearly visible at top center. Axis labels x, y, and "Amplitude (z)" are dark ink and readable. Tick labels (-5/0/5 on x/y, -0.5/0.0/0.5 on z) are soft gray and legible. Colorbar on the right is labeled "z" with ticks -1.0 to 1.0, all readable against the light background. Grid lines on the cube walls are subtle but visible.
      Data: Diverging red-white-blue surface (Imprint #AE3030 to background-tinted white to #4467A3) representing the signed amplitude. Near-zero regions of the surface are a very light gray that sits close to the page background color, causing a mild blending effect in the saddle areas, but the overall peaks (blue) and troughs (red) remain clearly distinguishable.
      Legibility verdict: PASS (all text readable; minor midtone-surface blending noted as a design weakness, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- correct, not pure black.
      Chrome: Title is bold, light/white text, clearly visible against the dark background. Axis labels and tick labels are light gray and readable, with no dark-on-dark failures observed. Colorbar labels and ticks are light-colored and legible on the dark background. Grid lines are subtle but present.
      Data: Same diverging red-white-blue palette as the light render -- data colors are identical between themes, confirming only chrome changed. Near-zero surface regions render as dark gray, again blending somewhat into the near-black background/panels, mirroring the light-theme observation.
      Legibility verdict: PASS (all text readable in both themes; no dark-on-dark or light-on-light text failures found).
