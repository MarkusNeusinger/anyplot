review:
  strengths:
  - 'All three attempt-1 weaknesses were fixed: protrusions tightened (60->40) + viewmode=:stretch
    so the surface fills noticeably more of the 3200x1800 frame, the diverging colormap''s
    midpoint (#EDE8DA/#2B2B26) is now nudged off the exact page background so near-zero
    regions no longer blend into the panel walls, and the colorbar label now reads
    "Amplitude (z)" matching the z-axis label'
  - Theme-adaptive chrome is threaded through every Axis3 element (ticks, spines,
    grid, panels) and the linked Colorbar for both light and dark renders, with no
    dark-on-dark or light-on-light failures
  - 'Idiomatic Makie 3D API usage: Axis3 + surface! + Colorbar(fig[1,2], surf), with
    a tuned azimuth/elevation/aspect that gives a legible viewing angle on the wave
    surface'
  - Deterministic, RNG-free data generation (sin(x)*cos(y)*exp(-decay)) with a correct
    diverging Imprint colormap choice for signed continuous data, and identical data
    colors between light and dark renders
  weaknesses:
  - Vertical whitespace above and below the surface is reduced but still noticeable
    -- the surface content occupies roughly the middle ~60% of canvas height; a further
    camera zoom or aspect tweak could use even more of the frame
  - The diverging colormap's midpoint (#EDE8DA/#2B2B26) deviates from the style guide's
    literal theme-background midpoint (#FAF8F1/#1A1A17) -- a reasonable readability
    tradeoff given the Axis3 panel-wall blending it fixes, but worth flagging as a
    minor palette-compliance deviation
  - Near-zero surface regions (the saddle areas) are still somewhat low-contrast against
    the panel walls, particularly in the dark render -- a subtle wireframe or edge
    stroke on the surface would sharpen the depth cue further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - correct, not pure white, not dark.
      Chrome: Title "surface-basic · julia · makie · anyplot.ai" is bold, dark ink, clearly visible at top center, well within canvas bounds (~35% width). Axis labels x, y, and "Amplitude (z)" are dark ink and readable. Tick labels (-5/0/5 on x/y, -0.5/0.0/0.5 on z) are soft gray and legible. Colorbar on the right is now labeled "Amplitude (z)" (consistent with the z-axis label) with ticks -1.0 to 1.0, all readable against the light background. Grid lines on the cube walls are subtle but visible. No text overlap or clipping.
      Data: Diverging red-white-blue surface (Imprint #AE3030 to a nudged off-background midpoint to #4467A3) representing signed amplitude. Peaks (blue) and troughs (red) are clearly distinguishable; near-zero saddle regions are a light tan that is now visibly distinct from the page background/panel walls, though still fairly low-contrast.
      Legibility verdict: PASS (all text readable, no light-on-light failures).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - correct, not pure black, not light.
      Chrome: Title is bold, light/white text, clearly visible against the dark background. Axis labels and tick labels are light gray/white and readable, no dark-on-dark failures observed. Colorbar label "Amplitude (z)" and ticks are light-colored and legible. Grid lines are subtle but present.
      Data: Same diverging red-white-blue palette as the light render - data colors are identical between themes, confirming only chrome flipped. Near-zero surface regions render as a dark gray-blue that is distinguishable from the near-black background, though the contrast is still somewhat subtle in the deepest saddle areas.
      Legibility verdict: PASS (all text readable in both themes; no dark-on-dark or light-on-light text failures found).
