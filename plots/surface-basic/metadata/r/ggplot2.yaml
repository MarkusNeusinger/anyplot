review:
  strengths:
  - 'A correct painter''s-algorithm mesh: 44x44 geom_polygon quads, sorted farthest
    first, give one continuous surface over the 45x45 grid with no holes, tears or
    gaps, and the front slopes correctly occlude the floor and the back panes.'
  - 'Color follows height through imprint_seq (scale_fill_gradient from #009E73 to
    #4467A3) with limits and breaks shared with the z ticks, so the color bar ''Height
    (z)'' and the z axis read the same 0.0 to 1.0 scale.'
  - The oblique view (elevation 30°, azimuth -35°) shows the dominant peak, the smaller
    secondary peak and the saddle between them together; no peak hides the other.
  - A projected 3D axis box with x, y and z ticks in data units, a faint pane grid
    only on the floor and the two back walls, and axis titles rotated along their
    edges, all drawn from the INK/INK_SOFT tokens, so it reads cleanly in both themes.
  - Mesh lines are thin (0.07 mm) and translucent, so they show the curvature without
    hiding the fill color in either theme.
  - 'The basic variant stays a single surface: no contours, projected walls, markers
    on peaks or reference planes.'
  weaknesses:
  - 'CQ-01 (code): the script defines two helper functions, `project()` (line 49)
    and `seg3d()` (line 101), against the Imports → Data → Plot → Save structure without
    functions → inline the projection as vectorized expressions on the grid and tick
    vectors. Likely cause: the projection and segment construction were wrapped in
    reusable helpers.'
  - 'Suggestion: the subtitle calls the view an ''Isometric projection'', but at elevation
    30° and azimuth -35° it is an oblique orthographic projection; ''Orthographic
    projection'' would describe it accurately.'
  - 'Suggestion: the nested for loop that builds the quads (lines 67–79) could be
    vectorized with index vectors over the grid, which would shorten the mesh construction.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas; the color-bar box uses the elevated #FFFDF6 fill with a thin INK_SOFT border.
      Chrome: title "surface-basic · r · ggplot2 · anyplot.ai" in dark ink at the top left (about 40 % of the width), a grey subtitle "Isometric projection · elevation 30° · azimuth -35°", z tick labels 0.0–1.0 on the front-left vertical axis, x ticks -4 to 4 along the front-left floor edge, y ticks -4 to 4 along the front-right floor edge, axis titles "X" and "Y" rotated along their edges and "Z (height)" rotated vertically. All dark text, all readable. The back panes carry a faint grid at the tick values.
      Data: one continuous surface over the grid, colored from brand green #009E73 at z = 0 to blue #4467A3 at z ≈ 1, with thin translucent dark mesh lines. A dominant peak sits at the back right (around x = y = 1.5) and a smaller one at the front left (around x = y = -2), with a saddle between them. Color bar "Height (z)" 0.0–1.0 on the right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; the color-bar box uses #242420 with a light border.
