      Data: a continuous 45x45 surface with a dominant peak (z≈1.0) toward the back right and a smaller peak (z≈0.6) at front left, flat low regions in brand green #009E73 rising to blue #4467A3 at the summit; thin dark translucent mesh lines trace the curvature. Color bar "Height (z)" 0.0–1.0 on the right in a framed box.
