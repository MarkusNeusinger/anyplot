review:
  strengths:
  - A 45x45 bimodal Gaussian surface drawn entirely in ggplot2 as one depth-sorted
    geom_polygon per grid cell; the painter's ordering is correct, so the surface
    reads as one continuous sheet without holes, tears or wrongly overlapping facets
    in either render
  - A projected 3D axis box with x, y and z ticks in data units, a faint pane grid
    on the floor and back walls, and axis titles rotated along their edges gives a
    proper oblique view that shows both peaks and the saddle between them
  - 'Fill follows height through the imprint_seq two-stop gradient (#009E73 to #4467A3)
    with a matching ''Height (z)'' color bar whose breaks equal the z-axis ticks,
    so color and height tell the same story'
  - 'All chrome is threaded through the theme tokens: page background, INK and INK_SOFT
    text, the mesh outline and the ELEVATED_BG legend box flip correctly between light
    and dark while the data colors stay identical'
  - Mesh lines are thin and translucent (linewidth 0.07, alpha 0.45), so they trace
    the curvature without hiding the color
  weaknesses:
  - 'DQ-02 (both): the axes are labelled only ''X'', ''Y'' and ''Z (height)'' while
    the code comment describes a yield surface from two process settings, so the render
    reads as an abstract function → name the two inputs and the output after that
    scenario (for example ''Temperature (°C)'', ''Pressure (bar)'', ''Yield''), with
    matching tick ranges. Likely cause: the title labels c("X", "Y", "Z (height)")
    in text_df and the fill-scale name.'
  - 'Suggestion: the subtitle says ''Isometric projection'', but elevation 30° and
    azimuth -35° is a general orthographic view; ''Orthographic view'' would be exact.'
  - 'Suggestion: the 44x44 quad loop with a list of lists plus bind_rows could be
    built vectorised from index grids (expand.grid over i and j), which would shorten
    the mesh block.'
