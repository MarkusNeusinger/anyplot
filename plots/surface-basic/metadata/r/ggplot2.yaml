review:
  strengths:
  - Creative, well-documented hand-rolled isometric 3D→2D projection using painter's-algorithm
    depth-sorted geom_polygon quads — a legitimate technique given ggplot2 has no
    native 3D device
  - 'Height is encoded redundantly via visual elevation AND fill color (imprint_seq
    #009E73→#4467A3), matching the style guide''s sequential-colormap rule exactly
    and staying colorblind-safe'
  - 'Correct 3200×1800 canvas, pixel-verified #FAF8F1/#1A1A17 backgrounds in both
    themes, spines removed, title format matches the mandated pattern, colorbar clearly
    labeled ''Height (z)'''
  - 45×45 grid matches the spec's requested 30×30–50×50 density; bimodal Gaussian
    gives a genuine primary + secondary optimum for a believable 'response surface'
    narrative
  weaknesses:
  - 'Pipeline mismatch: the reviewed plot_images render the PRE-fix subtitle (''...azimuth
    -35°'', no trailing clause) and y-axis title (''Height (projected)''), not the
    strings currently committed in ggplot2.R (''...vertical axis blends Y-depth and
    Z-height'' / ''Y-depth + Height (z), projected'') from commit cd264b426. Please
    regenerate plot-light.png/plot-dark.png from the current HEAD so the longer y-axis
    title''s layout (margin crowding, tick-label overlap) can actually be verified
    before the next review.'
  - 'panel.grid.major renders at full INK opacity in both themes (#1A1A17 on light,
    #F0EFE8 on dark — confirmed by pixel sampling, exact token match with no blending)
    instead of the style guide''s subtle 15-25% opacity. The dense 7x5 gridline overlay
    competes with the surface mesh. Fix by pre-blending the gridline color, e.g. adjustcolor(INK,
    alpha.f = 0.15-0.25), the same way geom_polygon''s border color already does.'
  - The composite vertical axis (blending Y-depth and Z-height into one scale) isn't
    self-explanatory from the axis title alone; once the fuller subtitle is confirmed
    rendered (see pipeline-mismatch item), double-check it isn't crowded or clipped
    since it now carries the explanatory clause.
  - Spec asks for axis labels on x, y, AND z; only X and the merged Y/Z axis get axis
    titles — true Z (height) is labeled solely via the colorbar legend, and Y-depth
    has no independent scale. Inherent to the isometric-projection trade-off, but
    worth a one-line callout so the mapping stays unambiguous.
