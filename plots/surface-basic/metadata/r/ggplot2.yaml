review:
  strengths:
  - Gridlines are now pre-blended to a subtle ~20% opacity (`adjustcolor(INK, alpha.f
    = 0.2)`), fixing the full-opacity issue flagged in attempt 2 — the mesh now reads
    cleanly without a competing gridline overlay in either theme.
  - 'Preview images now reflect the current commit exactly: the longer subtitle ("...vertical
    axis blends Y-depth and Z-height") and y-axis title ("Y-depth + Height (z), projected")
    both render correctly and without crowding, resolving the attempt-2 pipeline mismatch.'
  - Creative, well-documented hand-rolled isometric 3D-to-2D projection using painter's-algorithm
    depth-sorted geom_polygon quads — a legitimate native-ggplot2 technique given
    the library has no 3D device, per library policy of not falling back to another
    backend.
  - 'Height is redundantly encoded via visual elevation AND fill color (imprint_seq
    #009E73 to #4467A3), matching the style guide''s sequential-colormap rule exactly
    and staying colorblind-safe.'
  - 'Correct 3200x1800 canvas, correct #FAF8F1/#1A1A17 backgrounds in both themes,
    spines removed, title format matches the mandated pattern, colorbar clearly labeled
    "Height (z)", 45x45 grid within the spec''s requested density.'
  weaknesses:
  - The vertical axis still blends Y-depth and Z-height into one composite scale,
    so only X and true Z (via the colorbar) are independently labeled — Y has no standalone
    scale. This is an inherent trade-off of the isometric 2D projection and is already
    mitigated by the explanatory subtitle clause, but a fully independent Y encoding
    isn't possible without ggplot2 native 3D support.
  - Title occupies roughly 35-40% of the plot width at the current fontsize (size=12),
    noticeably below the 50-70% guideline range — consider a slightly larger plot.title
    size now that the gridlines free up visual space, as long as it doesn't crowd
    the subtitle beneath it.
  - LM-02 is capped by the fact that the painter's-algorithm mesh is a workaround
    for missing native 3D support rather than a distinctive built-in ggplot2 feature
    — this is the best available option within the library's grammar, not a deduction
    against the implementation's craftsmanship.
