review:
  strengths:
  - Faithful hand-projected 'painter's algorithm' mesh (depth-sorted geom_polygon
    quads) cleverly compensates for ggplot2's lack of native 3D support, following
    the library policy of not falling back to another backend.
  - Height is redundantly encoded via both visual elevation and fill color (green-to-blue
    sequential gradient), directly matching the spec's colorblind-safe readability
    guidance.
  - Both themes correctly flip chrome (background, text, grid) while data colors (surface
    gradient) remain identical between light and dark renders.
  - Title matches the mandated 'surface-basic · r · ggplot2 · anyplot.ai' format exactly,
    and canvas is the correct 3200x1800 landscape size.
  - Realistic, neutral bimodal Gaussian 'yield surface' dataset with a dominant and
    secondary optimum gives the plot a plausible real-world framing.
  weaknesses:
  - The projected vertical axis is labeled only 'Height (projected)', which blends
    the original Y-dimension and Z-height into one composite axis — a viewer cannot
    read the underlying Y coordinate independently, only X and the composite height.
    Consider clarifying in the subtitle that the vertical axis mixes Y-depth and Z-height,
    since the spec asks for x, y, and z to all be represented.
  - The 45x45 mesh grid lines create a fairly dense hatch pattern, especially visible
    on the near-flat green region; slightly thinner lines or a touch more transparency
    would keep the surface reading clean without losing the depth cue.
  - Legend title 'Height (z)' is good but is the only place the z-dimension is explicitly
    named — an axis-level cue for z (beyond the colorbar) would make the three-dimension
    mapping more explicit at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Dark title "surface-basic · r · ggplot2 · anyplot.ai" top-left, grey subtitle "Isometric projection · elevation 30° · azimuth -35°" beneath it, dark axis titles "X (projected)" and "Height (projected)", grey tick labels on both axes, subtle black horizontal/vertical gridlines. Legend box on the right ("Height (z)") with an off-white/elevated background and thin border, tick labels 0.25/0.50/0.75 all fully visible. All chrome elements are clearly readable against the light background.
      Data: The isometric-projected surface mesh shows a bimodal terrain — a dominant peak (upper right) rendered in blue and a smaller secondary bump (left) in green, transitioning smoothly through a green-to-blue sequential gradient (first stop #009E73, consistent with Imprint brand green). Thin mesh lines outline each quad, giving a woven/wireframe look layered on the filled surface.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: White title and axis titles, light-grey subtitle and tick labels, white gridlines, all clearly legible against the dark background. Legend box has a dark-elevated background with a light border; legend title and tick labels are light-colored and easily readable. No dark-on-dark text was found anywhere.
      Data: Same bimodal surface with the identical green-to-blue gradient and quad geometry as the light render — data colors are unchanged, confirming only chrome flipped between themes. Mesh outline lines remain visible against both the surface fill and the dark canvas.
      Legibility verdict: PASS
