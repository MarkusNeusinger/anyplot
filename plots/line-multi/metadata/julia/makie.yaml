review:
  strengths:
  - 'Both Attempt 1 weaknesses directly fixed: LinearTicks(9) gives dense reference
    gridlines across the full data range, and the headline series (largest % change
    via argmax) is bolded with an endpoint callout for a clear focal point'
  - Switched from a manual per-series color loop to Makie's idiomatic series! primitive
    - cleaner code and better Library Mastery
  - 'Imprint palette in exact canonical order, first series brand green #009E73, identical
    across both themes'
  - Theme-adaptive chrome (PAGE_BG, INK, INK_SOFT) correctly threaded through - both
    renders fully legible, no dark-on-dark or light-on-light failures
  - Canvas exactly 3200x1800; reproducible (Random.seed!(42)); clean KISS script with
    only used imports
  weaknesses:
  - Callout text ("Mobile App +44%", fontsize 13) is noticeably smaller than tick
    labels (12) and axis labels (14) sitting next to a much larger title (20) - a
    slightly larger callout (14-15pt) would read more confidently as an intentional
    annotation
  - Data storytelling relies on a single emphasis technique - the declining Analytics
    Suite series (from ~104 peak to ~87 trough) is an equally interesting story left
    unaddressed; a second, lighter-weight annotation would deepen the narrative
  - Library Mastery is solid but not yet distinctive - consider a genuinely Makie-unique
    feature (custom Legend with GridLayout positioning, or Makie.Cycled color cycling)
    in a future revision
