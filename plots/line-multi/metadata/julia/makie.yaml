review:
  strengths:
  - 'Imprint palette used in exact canonical order — first series is brand green #009E73,
    followed by lavender, blue, and ochre, identical across both themes.'
  - 'Theme-adaptive chrome is threaded correctly: PAGE_BG, INK, INK_SOFT all flip
    between light and dark, and both renders are fully legible with no dark-on-dark
    or light-on-light failures.'
  - Canvas is exactly 3200x1800 (landscape gate passed), matching the Figure(resolution=(1600,900))
    / px_per_unit=2 pairing.
  - Legend is cleanly placed in empty upper-left space with an elevated-bg frame and
    does not overlap any of the four lines even where they start clustered near y=100.
  - Descriptive, unit-bearing axis labels ('Month', 'Revenue Index (base = 100)')
    and a title matching the exact mandated format.
  - Reproducible (Random.seed!(42)), KISS script with no functions/classes and only
    the imports actually used (CairoMakie, Colors, Random).
  weaknesses:
  - Y-axis ticks/gridlines only appear at 100, 120, 140 despite data ranging down
    to ~72 (Analytics Suite trough) — the bottom third of the plot has no reference
    gridline, making it hard to read values below 100. Add denser ticks, e.g. `yticks
    = WilkinsonTicks(8)` or explicit `LinearTicks(9)`.
  - All four lines share identical visual weight (same linewidth=3.0, all solid, no
    markers) — there is no focal point or emphasis technique guiding the viewer to
    the most notable trend (e.g. Mobile App's late surge or Analytics Suite's decline).
    A slightly bolder line or a callout on the crossover point would add data storytelling.
  - No distinctive Makie-specific technique is used beyond a basic `lines!` loop (e.g.
    `series!`, `Cycled` color cycling, or a recipe) — functionally correct but generic
    for library-mastery purposes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Title "line-multi · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. Axis labels "Month" (x) and "Revenue Index (base = 100)" (y) in dark ink, fully legible. Tick labels (0/10/20/30 on x; 100/120/140 on y) in softer gray ink, legible but sparse below y=100. Legend box (top-left, elevated cream fill, thin gray frame) lists all four series names in readable gray text. Only a faint y-axis gridline at 15% opacity; no x-axis gridline. Left/bottom spines visible in soft ink, top/right spines removed.
      Data: Four lines — Core Platform (green #009E73), Mobile App (lavender #C475FD), Analytics Suite (blue #4467A3), API Services (ochre #BD8233) — each clearly distinguishable, diverging visibly over the 36-month span. First series confirmed brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black.
      Chrome: Title in bold light ink (#F0EFE8), clearly visible against the dark surface. Axis labels in the same light ink, fully legible. Tick labels in lighter gray (#B8B7B0), legible against the dark background — no dark-on-dark failures observed. Legend box uses the dark elevated fill (#242420) with light gray text and a soft gray frame, fully readable. Gridline at matching low opacity, barely visible as intended.
      Data: Same four line colors as the light render — Core Platform green, Mobile App lavender, Analytics Suite blue, API Services ochre — confirmed identical hex values, only the chrome (background/text/grid/legend) flipped between themes.
      Legibility verdict: PASS
