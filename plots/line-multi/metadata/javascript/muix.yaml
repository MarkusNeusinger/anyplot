review:
  strengths:
  - Legend uses MUI X's labelMarkType 'line+mark', so every swatch repeats its line's
    color and marker shape
  - Per-series marker shapes (circle, square, diamond, cross) add a non-color channel
    for CVD readers
  - Linear index x axis with valueFormatter and a data-derived padding keeps the first
    and last markers whole
  - Monotone curve interpolation joins the points without overshooting the values
  - Realistic, neutral climate data that shows flat vs seasonal series and two real
    crossings
  - Theme tokens threaded through title, subtitle, axes and grid; both renders read
    cleanly
  weaknesses:
  - 'Suggestion: a focal cue for the Dubai/Singapore crossings (e.g. a subtitle phrasing
    the crossover months) would give the chart a storyline beyond plain comparison.'
  - 'Suggestion: varying the line dash per series would add a third channel alongside
    color and marker shape.'
