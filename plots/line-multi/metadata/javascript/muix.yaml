review:
  strengths:
  - Four real cities in distinct climate zones (Reykjavik, Berlin, Dubai, Singapore)
    give very different levels and volatilities — flat tropical Singapore against
    strongly seasonal Dubai — so the comparison the chart exists for reads at a glance
  - Each series carries its own Imprint color (#009E73 first) plus a distinct MUI
    X mark shape (circle, square, diamond, cross), and the legend uses labelMarkType
    "line+mark" so every swatch matches its line and marker exactly
  - monotoneX curves pass smoothly through every monthly value without overshoot,
    and the small x padding keeps the January and December markers whole
  - Chrome is fully theme-adaptive through ANYPLOT_TOKENS (ink, inkSoft, grid); both
    renders are clean and readable, and the series valueFormatter adds the °C unit
    to the HTML tooltips
  weaknesses:
  - 'SC-01 (both): two dashed vertical reference lines labelled "Dubai and Singapore
    cross" and the "· 2 crossovers" subtitle segment form an annotation layer the
    spec neither requires nor offers → remove the ChartsReferenceLine children, the
    crossings computation and the crossover count from the subtitle. Likely cause:
    the crossings loop and crossings.map(<ChartsReferenceLine …>) inside <LineChart>.'
  - 'Suggestion: an optional dashed or dotted line style on one or two series (the
    Notes say "consider") would add a redundant cue alongside color and marker shape.'
  - 'Suggestion: the mandated title at 22 px spans about a third of the width; a slightly
    larger title would give the header more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; 3200x1800 canvas.
      Chrome: bold dark title "line-multi · javascript · muix · anyplot.ai" top-left with a grey subtitle "4 series × 12 months · range 0 to 38 °C · 2 crossovers"; y-axis title "Average temperature (°C)" with ticks 0–40 by 5; x-axis title "Month" with Jan–Dec ticks; subtle horizontal grid; horizontal legend top-right (Reykjavik, Berlin, Dubai, Singapore) with line+mark swatches. All text dark and readable.
      Data: four lines with markers — Reykjavik #009E73 circles (0–13 °C), Berlin purple squares (1–21 °C), Dubai blue diamonds (19–38 °C), Singapore ochre crosses (flat 27–28 °C). Two dashed vertical reference lines at about late March and late October labelled "Dubai and Singapore cross" where Dubai crosses Singapore.
