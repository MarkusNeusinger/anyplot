review:
  strengths:
  - First series is correctly brand green (#009E73); remaining three series (Berlin,
    Dubai, Singapore) follow the canonical Imprint palette order and stay pixel-identical
    between light and dark renders.
  - 'Theme-adaptive chrome is fully wired through window.ANYPLOT_TOKENS — both backgrounds
    match the exact target hex (#FAF8F1 light / #1A1A17 dark), and no text is dark-on-dark
    or light-on-light in either render.'
  - 'Title matches the mandated format exactly: ''line-multi · javascript · muix ·
    anyplot.ai''.'
  - All font sizes are explicitly set (title 22px, axis labels 16px, tick labels and
    legend 14px) and well-proportioned — no overflow, no clipping, balanced X/Y axis
    label sizes.
  - Line thickness (3.5px) and open-circle markers are well-chosen for a sparse 12-point-per-series
    dataset across 4 series.
  - Clean horizontal-only grid, minimal chrome, bottom-centered legend with proper
    spacing — no overlap anywhere in either render.
  - Data is realistic, neutral, and appropriately scaled (0–38°C average monthly temperatures
    for four climatically distinct real cities).
  - 'Idiomatic MUI X usage: xAxis/yAxis config with valueFormatter for °-suffixed
    ticks, slotProps.legend styling, single default-exported component with only used
    imports (LineChart, Box, Typography).'
  weaknesses:
  - Dubai's 'natural' curve interpolation produces a slight visible dip between Jul
    and Aug even though both months have the identical value (38°), which can read
    as a mid-summer cooldown that doesn't exist in the data — consider curve="monotoneX"
    (or "linear") to avoid spline overshoot between equal consecutive points while
    keeping the other segments smooth.
  - The code comment calls out the Dubai/Singapore seasonal crossover (~Apr and ~Nov)
    as the reason this comparison earns a multi-line chart, but nothing in the visual
    design (annotation, marker emphasis, callout) highlights that crossover for the
    viewer — add a light annotation or highlighted marker at the two crossover points
    to sharpen the data storytelling.
  - All four lines are solid with no secondary style differentiation (dash/dot patterns);
    with 4 series this is within the 'color alone is enough' guidance so it's not
    a hard requirement, but the spec explicitly suggests varying line style for additional
    distinction and it would add polish.
  - Library usage stays close to baseline LineChart config — no distinctive MUI X
    capability (e.g. area fill, reference line, highlighted series) is used to differentiate
    this implementation beyond a standard multi-series line chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the #FAF8F1 target — not pure white, not dark.
      Chrome: Title "line-multi · javascript · muix · anyplot.ai" in bold dark ink, clearly readable, centered at top. Y-axis label "Average Temperature (°C)" and X-axis label "Month" both dark and legible. Tick labels (degree-suffixed Y ticks, month abbreviations on X) in a slightly softer dark gray, all readable. Horizontal grid lines subtle and unobtrusive. Legend at bottom-center with color swatches and city names (Reykjavik, Berlin, Dubai, Singapore), fully legible.
      Data: Four lines with open-circle markers — Reykjavik (brand green #009E73), Berlin (lavender), Dubai (blue), Singapore (ochre) — matching canonical Imprint palette order 1→4. Dubai peaks near 38° in Jul/Aug; Singapore stays flat near 27-28° year-round; Reykjavik and Berlin show classic seasonal curves. The Dubai/Singapore lines visibly cross around April and again around November.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the #1A1A17 target — not pure black, not light.
      Chrome: Title in bold off-white/cream ink, clearly readable against the dark surface. Axis labels and tick labels flip to light-gray/off-white tones, fully legible — no dark-on-dark failures anywhere. Grid lines remain subtle. Legend text and swatches equally legible against the dark background.
      Data: Confirmed identical hex values for all four series as the light render (green, lavender, blue, ochre) — only the chrome (background, text, grid) flipped between themes, as required.
      Legibility verdict: PASS
