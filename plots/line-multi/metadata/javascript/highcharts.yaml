review:
  strengths:
  - Imprint palette applied in canonical order (green, lavender, blue, ochre) and
    identical between light and dark renders — only chrome flips.
  - Distinct marker shapes per series (circle, diamond, square, triangle) give a CVD-safe
    secondary encoding beyond color alone.
  - 'Theme-adaptive chrome is correctly threaded through: warm off-white/near-black
    backgrounds, transparent chart background, credits disabled, all title/axis/tick
    text legible in both themes with no dark-on-dark or light-on-light failures.'
  - Title matches the required `{spec-id} · {language} · {library} · anyplot.ai` format
    exactly, and axis titles carry units (°C).
  - Deterministic, realistic, neutral dataset — four US cities' average monthly temperatures,
    hardcoded in-memory with no RNG needed.
  weaknesses:
  - Styling stays very close to the library-guide skeleton with no extra design refinement
    — the spec's 'consider varying line styles (solid, dashed, dotted) for additional
    distinction' suggestion is unused (all four series are solid lines); adding plotOptions.series.dashStyle
    variation per series would raise differentiation and design excellence.
  - No visual hierarchy or focal point — all four lines are given equal visual weight
    with lines crossing repeatedly around Jun–Aug; consider a subtle annotation or
    emphasis (e.g. highlighting Miami's summer plateau) to guide the viewer.
  - Around Jul–Aug, the New York and Chicago lines/markers nearly coincide; marker-shape
    differentiation keeps them distinguishable but a touch more separation (marker
    z-order or slight dash variation) would remove any ambiguity.
  image_description: |-
