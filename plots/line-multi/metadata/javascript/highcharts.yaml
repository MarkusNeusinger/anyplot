      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "line-multi · javascript · highcharts · anyplot.ai" in bold dark ink at top; x-axis title "Month" and y-axis title "Average Temperature (°C)" in medium-soft ink; tick labels (Jan–Dec on x, -10 to 35 by 5 on y) in soft ink; horizontal gridlines subtle light gray; legend at bottom with four labeled swatches (New York, Los Angeles, Chicago, Miami). All text is clearly readable against the light background — no light-on-light issues.
      Data: Four lines with distinct colors and marker shapes — New York (brand green #009E73, circle markers), Los Angeles (lavender/purple, diamond markers), Chicago (blue, square markers), Miami (ochre/amber, triangle markers). First series is correctly the brand green. Lines are smooth, well-separated for most of the year, with New York/Chicago crossing near Jul–Aug but still distinguishable by marker shape.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
