      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "line-multi · javascript · echarts · anyplot.ai" centered at top. Legend with 4 entries (NovaChip, Solaris Energy, Vertex Biotech, Cascade Retail) using color + line-style swatches, positioned below the title with no overlap. Y-axis spine hidden, subtle horizontal-only gridlines. X-axis titled "Trading Day", Y-axis titled "Indexed Price (Day 1 = 100)". A dashed horizontal markLine at y=100 labeled "Day 1 = 100" anchors the baseline. Each series ends with a bold colored endLabel showing its final value (127.9, 111.7, 101.7, 87.0). Verified via pixel crop that the "101.7" end label and "Day 1 = 100" markLine label do not collide.
      Data: Brand-green solid line (NovaChip, ends 127.9), lavender solid (Solaris Energy, 111.7), blue dashed (Vertex Biotech, 87.0), ochre dotted (Cascade Retail, 101.7) — matches Imprint canonical order with brand green first.
