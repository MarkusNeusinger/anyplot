review:
  strengths:
  - Correct Imprint palette in canonical order (brand green first, then lavender,
    blue, ochre) with theme-correct chrome (background, text, grid) in both light
    and dark renders
  - 'Redundant encoding beyond color: distinct line styles (solid, solid, dashed,
    dotted) make series distinguishable even without color, a good accessibility practice'
  - Deterministic, realistic stock-index dataset (4 tech/energy/biotech/retail companies,
    60 trading days) with clearly diverging bull/bear/flat trends and plausible index
    scale
  - 'Clean, idiomatic ECharts snippet: explicit font sizing throughout, animation
    disabled, correct mount-node contract, no extraneous code or dependencies'
  weaknesses:
  - Design Excellence sits at 'good default' level with no device to sharpen the story
    of which company outperformed — add a subtle markLine reference at y=100 (the
    indexing baseline) or an endLabel/markPoint showing each series' final indexed
    value to create a clearer focal point
  - Only line-style variation and emphasis:focus are used as distinctive ECharts features;
    consider a markLine baseline or a highlighted/thicker treatment for the top-performing
    series to raise Library Mastery beyond generic multi-line usage
  - The four lines overlap tightly in the first ~10 trading days (all clustered near
    index 100), making individual series hard to distinguish in that window — acceptable
    given real data behavior, but a slightly higher initial spread or thinner early
    segment would help element visibility
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "line-multi · javascript · echarts · anyplot.ai" centered at top, readable. Legend below title with 4 entries (NovaChip, Solaris Energy, Vertex Biotech, Cascade Retail) using line-swatch + label, all legible in dark ink. X-axis "Trading Day" and Y-axis "Indexed Price (Day 1 = 100)" labels clearly visible in dark ink; tick labels in a slightly softer dark gray, all readable. Subtle horizontal gridlines only, y-axis spine hidden, x-axis spine kept thin.
      Data: First series (NovaChip) is brand green #009E73 solid line; second (Solaris Energy) is lavender/purple solid; third (Vertex Biotech) is blue dashed; fourth (Cascade Retail) is ochre dotted — matches Imprint canonical order (positions 1-4). Lines are moderately thick (3px) and clearly distinguishable via color + line style, except during the first ~10 trading days where all four cluster near index 100.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink (near-white/light-gray), fully legible against the dark background. Gridlines remain subtle and visible. No dark-on-dark text found anywhere (title, legend, axis titles, tick labels all flipped to light ink correctly).
      Data: Data colors are pixel-identical to the light render — green, lavender, blue, ochre — confirming only chrome (not data colors) flips between themes, as required.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
