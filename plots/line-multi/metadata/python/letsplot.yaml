review:
  strengths:
  - 'Full Imprint palette + theme-adaptive chrome compliance across both renders:
    data colors are pixel-identical between light and dark, backgrounds match #FAF8F1/#1A1A17,
    and all text is legible on both surfaces.'
  - Real, functioning interactive tooltips via layer_tooltips() with custom per-series
    formatting, surfaced in the saved HTML — a genuine letsplot-specific feature,
    not decorative fakery.
  - 'Clean, idiomatic ggplot-grammar code: KISS top-to-bottom structure, seeded reproducible
    data, explicit font sizing throughout, no fake UI elements.'
  - Realistic, appropriately-scaled monthly product-line sales data showing three
    genuinely distinct trajectory shapes (steady growth, decline-then-recovery, flat-with-uptick)
    including a natural crossover around June/July.
  weaknesses:
  - Title omits the language segment — currently 'line-multi · letsplot · anyplot.ai'
    instead of the mandated 'line-multi · python · letsplot · anyplot.ai'. The sibling
    matplotlib.py implementation for this same spec-id gets this right (title = 'line-multi
    · python · matplotlib · anyplot.ai') — mirror that pattern.
  - 'Color/emphasis mismatch undercuts the intended data storytelling: the ''hero''
    series (Electronics — thickest line, full opacity, largest markers) renders in
    blue (#4467A3), while the most eye-catching Imprint color (#009E73 green) lands
    on Clothing, the de-emphasized thin/alpha=0.55 series. This happens because scale_color_manual
    inherits the default alphabetical factor order (Clothing, Home Goods, Electronics)
    instead of an order intentional for the emphasis. Fix by ordering the categorical
    levels so Electronics maps to the first (green) palette slot — e.g. `pd.Categorical(df[''Product
    Line''], categories=[''Electronics'', ''Clothing'', ''Home Goods''])` before building
    the scale, or pass `breaks=[''Electronics'', ''Clothing'', ''Home Goods'']` to
    scale_color_manual.'
  - Aesthetic customization is limited to the mandated default Imprint array plus
    alpha/size differentiation — solid and correct, but not distinctive enough yet
    to read as publication-ready design.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-multi · letsplot · anyplot.ai" top-left in dark ink, fully readable. Axis titles "Month" (x) and "Sales (thousands USD)" (y) in dark ink; tick labels (Jan-Dec, 60-220) in medium grey — all clearly legible against the light background. Legend box "Product Line" sits to the right of the plot with a subtly elevated off-white fill and thin border, listing Clothing / Home Goods / Electronics with colored circle swatches, fully readable. No grid lines (panel_grid_major/minor intentionally blanked) — a deliberate minimalist choice, not a defect.
      Data: Three line+marker series. Thick, fully-opaque blue line (Electronics, #4467A3) rising from ~155 to ~220 with the largest markers. Thin, alpha=0.55 green line (Clothing, #009E73) declining from ~120 to ~65 with a late partial recovery. Thin, alpha=0.55 purple line (Home Goods, #C475FD) relatively flat around 85-105 with a mild late rise. First categorical series (Clothing, alphabetically first) is the mandated #009E73 green, satisfying palette compliance, though it lands on the secondary/de-emphasized series rather than the visually "hero" one (see weaknesses).
      Legibility verdict: PASS — no light-on-light issues anywhere.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light off-white ink, standing out clearly against the dark background. Legend box background flips to a lighter dark-elevated tone (~#242420) with a thin border; legend text stays light and readable.
      Data: Line colors are pixel-identical to the light render (same blue/green/purple hues and alpha treatment) — only the chrome (background, text, legend box) flips with the theme, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data remain clearly distinguishable from the near-black background.
