review:
  strengths:
  - 'Real bokeh interactivity: HoverTool with formatted per-point tooltips and click-to-hide
    legend — no fake/simulated UI'
  - 'Deliberate visual hierarchy: the focal series (Electronics) gets full opacity
    and a thicker line while the other three recede at 0.75 alpha, giving the chart
    a clear focal point'
  - Line-dash variation (solid vs dashed) layered on top of the Imprint palette gives
    a CVD-safe secondary channel beyond color alone
  - Theme-adaptive chrome correctly threaded through for both renders — background,
    ink, grid tokens all flip correctly while the four data colors stay identical
    between light and dark
  - Reproducible data generation (seeded) and idiomatic ColumnDataSource + HoverTool
    usage
  weaknesses:
  - Furniture and Groceries both use dashed lines and differ only by color — a minor
    readability compromise; consider a distinct dash pattern (e.g. dotted) for one
    of them
  - Design Excellence is solid but not maximal — a small added touch (e.g. a subtle
    end-of-line value annotation on the focal series) would push the storytelling
    further
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: bold centered title "line-multi · python · bokeh · anyplot.ai" in dark ink, clearly readable. Axis titles "Month" (x) and "Sales (thousands $)" (y) in italic dark ink. Tick labels (Jan-Dec on x, 10-80 on y) in a softer dark gray, all legible. Horizontal gridlines are faint and unobtrusive. Legend sits top-left in an elevated off-white box with a thin border, well clear of the data (nearest line value is far below the legend's bottom edge) — no overlap.
      Data: four lines — Electronics (#009E73 green, solid, thick/full-opacity, trending up from ~48 to ~80, the focal series), Clothing (#C475FD purple, solid, declining then recovering), Furniture (#4467A3 blue, dashed, flat/noisy ~23-28), Groceries (#BD8233 amber, dashed, gently declining ~55 to ~48). All four are clearly distinguishable by color and by solid-vs-dashed pattern. Markers are prominent filled circles at each of the 12 monthly points, appropriately sized for this sparse series count.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: title, axis titles, and tick labels all render in light/off-white ink, clearly visible against the dark background — no dark-on-dark issues. Legend box uses an elevated dark fill with a lighter border and light gray label text, fully readable. Gridlines are faint but present.
      Data: same four colors and same dash pattern in the same positions as the light render — Electronics green, Clothing purple, Furniture blue dashed, Groceries amber dashed — confirming the categorical data colors are identical across themes and only the chrome (background/text/grid/legend frame) flipped.
      Legibility verdict: PASS
