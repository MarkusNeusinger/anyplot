    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at #1A1A17 — matches spec exactly.
      Chrome: Title, axis labels, tick labels, legend, and annotation box all flip to light ink / light elevated surfaces and remain readable — no dark-on-dark failures observed.
      Data: Confirmed pixel-identical to light render (#009E73, #C475FD, #4467A3, #BD8233); only chrome adapted to theme.
      Defects: Same two issues reproduce — title/annotation overlap and the April Home & Garden/Sports marker collision (slightly harder to parse against the dark background).
      Legibility verdict: PASS overall, but FAIL on VQ-02 overlap (same two defects as light render)
