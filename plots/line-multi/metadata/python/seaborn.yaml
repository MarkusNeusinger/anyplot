  strengths:
  - 'Both weaknesses flagged in the previous review are genuinely fixed: the annotation
    callout no longer crosses the title (xytext moved from (9.3, +20) to (9.65, +14)),
    and the April Home & Garden/Sports marker collision is resolved with a real data
    nudge (home_garden[3] -= 6, sports[3] += 4) rather than a cosmetic patch'
  - 'Imprint palette applied in canonical order, Electronics correctly first at #009E73;
    data colors are pixel-identical between light and dark renders'
