review:
  strengths:
  - 'Imprint palette used exactly per spec: Electronics = #009E73 (brand green, always-first
    rule), Clothing/Home & Garden/Sports follow canonical positions 2-4 (#C475FD,
    #4467A3, #BD8233) with identical hexes across both renders.'
  - 'Redundant encoding beyond color: each series also gets a distinct marker shape
    (circle/square/diamond/triangle-up) and line dash (solid/solid/dash/dot), which
    exceeds the style guide''s 3-4-series recommendation and helps CVD accessibility.'
  - 'Theme-adaptive chrome is threaded through completely — title, axis titles, tick
    labels, grid, legend box and annotation callout all flip correctly between the
    #FAF8F1 light and #1A1A17 dark surfaces with no dark-on-dark or light-on-light
    failures.'
  - Direct end-of-line value labels (colored to match each series) plus a callout
    annotation on the Electronics trend add genuine data storytelling value without
    cluttering the chart.
  - Canvas renders at the exact target 3200x1800 landscape size; margins are pinned
    (autosize=False) so nothing drifts.
  - 'Clean, reproducible, KISS-structured code: np.random.seed(42), only used imports,
    no functions/classes, correct write_image/write_html output naming.'
  weaknesses:
  - The 'Electronics up 52% since Jan' callout is computed from the Dec (last) value
    (155.0 -> 235.5 = +52.0%) but the arrow is anchored to the Sep data point (225.7,
    only +45.7% since Jan) — the labeled percentage doesn't match the point it visually
    points at. Either move the annotation to the December endpoint or compute the
    percentage from the Sep value so the number and the anchored point agree.
  - Both xaxis and yaxis have showgrid=True. The style guide's Grid Guidelines call
    for Y-axis-only grid on line/bar charts (both-axis grid is reserved for scatter
    plots) — the vertical gridlines add clutter without encoding extra information
    here; set xaxis showgrid=False.
  - Y-axis range is manually clamped to [30, 300] rather than starting near zero;
    defensible for a trend-focused line chart (all series stay well above 30) but
    worth a second look since it does compress the visual magnitude of differences
    between series.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-multi · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Month" and Y-axis title "Sales (Units)" in dark ink, tick labels (Jan-Dec, 50-300) in softer gray-brown ink, all clearly readable. Grid lines (both horizontal and vertical) are subtle light-gray, present but not competing with data. Legend box (top-left, cream-elevated fill with thin border) lists Electronics/Clothing/Home & Garden/Sports with matching marker+line swatches, fully readable and does not overlap any data line. A bordered callout box reads "Electronics up 52% since Jan" with an arrow pointing to the Electronics line's September point; text is dark ink on the elevated cream fill, legible. Colored end-of-line value labels (236 green, 143 lavender, 116 blue, 72 ochre) sit in the right margin, matching each line's color, not clipped by the canvas edge.
      Data: Four lines with distinct Imprint colors (green #009E73 Electronics, lavender #C475FD Clothing, blue #4467A3 Home & Garden, ochre #BD8233 Sports), each with a distinct marker shape (circle/square/diamond/triangle) and dash pattern (solid/solid/dash/dot). Electronics is first series and is the brand green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all switch to light ink (near-white for primary text, light warm-gray for secondary/tick text) and remain fully legible against the dark surface. Grid lines are a faint light-on-dark rgba, still subtle. Legend box and annotation callout box switch to the dark-elevated fill (#242420-ish) with light text, fully readable, no dark-on-dark failures anywhere. End-of-line value labels are recolored per-series but keep the same hues as the light render, plainly visible against the dark background.
