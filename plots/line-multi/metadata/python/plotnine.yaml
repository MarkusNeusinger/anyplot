  strengths:
  - 'Perfect Imprint palette compliance: brand green first, remaining three series
    in canonical order, identical hex values across both themes'
  - Both light and dark renders are fully legible with correctly-flipped chrome and
    no dark-on-dark/light-on-light failures
  - The thicker brand-line technique and background-colored point-halo stroke show
    genuine design intent beyond library defaults
  - Realistic, neutral data with a real crossover story (Electronics overtaking Clothing,
    Accessories overtaking Furniture/Clothing mid-year)
