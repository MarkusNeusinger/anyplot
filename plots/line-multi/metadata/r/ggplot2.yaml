      Data: Four smoothed lines — Reykjavik (solid, #009E73 green), Berlin (dashed, #C475FD lavender), Marrakech (dotted, #4467A3 blue), Nairobi (dot-dash, #BD8233 ochre) — using the full canonical Imprint order 1-4, no longer skipping lavender.
