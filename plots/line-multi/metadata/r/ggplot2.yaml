review:
  strengths:
  - Correct multi-line comparison plot with 4 clearly distinguished series (Reykjavik,
    Berlin, Marrakech, Nairobi), each with a distinct Imprint color AND a distinct
    linetype (solid/dashed/dotted/dotdash) — redundant encoding that helps CVD readers
    even though the spec only requires 2-6 series.
  - 'First series is correctly the brand green #009E73, confirmed identical between
    light and dark renders (pixel-sampled).'
  - Rolling-mean smoothing (custom roll_mean()) over the raw daily-noise series is
    a nice storytelling choice — it foregrounds the seasonal signal instead of a noisy
    daily series, and is clearly documented with a code comment explaining why.
  - 'Realistic, neutral data: per-city temperature ranges and phase (Reykjavik/Berlin
    winter dip, Marrakech summer peak, Nairobi near-flat equatorial pattern) are all
    plausible.'
  - Custom x-axis breaks/labels (Jan/Apr/Jul/Oct/Dec) instead of raw day-of-year integers
    — good use of scale_x_continuous for readability.
  - 'Both renders pass the theme-readability check: correct #FAF8F1 / #1A1A17 backgrounds
    (pixel-confirmed), all text uses theme-adaptive INK/INK_SOFT tokens, no dark-on-dark
    or light-on-light failures.'
  - Title fontsize formula correctly scales for the 65-char descriptive+mandated title;
    measured title span is ~65% of canvas width, well inside the 50-70% target — no
    overflow.
  - Canvas dimension gate passed (no /tmp/anyplot-canvas-gate.txt), reproducible via
    set.seed(42), clean unused-import-free code, correct ggsave/ragg output pipeline.
  weaknesses:
  - 'Palette order violation (VQ-07): IMPRINT_PALETTE only defines 4 colors — green
    (#009E73, pos 1), blue (#4467A3, pos 3), ochre (#BD8233, pos 4), rose (#954477,
    pos 7) — and skips position 2 (lavender #C475FD) entirely. There is no semantic
    reason (city identity has no color association) to skip position 2, so the style
    guide''s ''use positions 1→N in order by default, don''t cherry-pick'' rule is
    violated. Fix: use IMPRINT_PALETTE[1:4] = c(''#009E73'', ''#C475FD'', ''#4467A3'',
    ''#BD8233'') for the 4 series, in canonical order.'
  - 'Non-subtle gridlines (DE-02 / grid guidelines): panel.grid.major.y is drawn with
    color = INK at full 100% opacity — pixel-sampled at the y=30 gridline in both
    renders returned exactly [26,26,23] (light) and [240,239,232] (dark), i.e. the
    literal INK token with zero blending toward the background. The style guide explicitly
    requires grid opacity 15-25% (''subtle'') and lists ''high-contrast grid'' under
    ''Never''. Fix: use a faint/alpha-reduced tone, e.g. scales::alpha(INK, 0.15)
    or a fixed rgba(''#1A1A1726'') / rgba(''#F0EFE826'') string, not the raw full-opacity
    INK color.'
  - 'CQ-01 KISS structure: the script defines two custom helper functions (seasonal()
    and roll_mean()) instead of the flat Imports → Data → Plot → Save structure the
    criterion expects. While understandable for DRY across 4 series, this deviates
    from the ''no functions/classes'' guidance — consider inlining or accepting the
    KISS deduction.'
  - 'Design Excellence is generic beyond the palette/grid issues: no explicit visual-hierarchy
    device (annotation, callout, or emphasized series) beyond color/linetype and the
    smoothing itself — DE-03 storytelling stays modest.'
  - 'Library Mastery is solid but not exceptional: idiomatic tidyverse+ggplot2 usage
    (pivot_longer, group_by/mutate, scale_*_manual), but no library-distinctive feature
    beyond that (e.g. no facet_wrap small-multiples alternative, no geom_smooth, no
    annotate).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-confirmed #FAF8F1 (matches spec exactly).
      Chrome: Title "Average City Temperatures · line-multi · r · ggplot2 · anyplot.ai" in dark ink at top-left, spans ~65% of canvas width. X-axis "Day of Year" with month tick labels (Jan/Apr/Jul/Oct/Dec); y-axis "Temperature (°C)" with 0/10/20/30 tick labels. Legend titled "City" on the right listing Reykjavik/Berlin/Marrakech/Nairobi with color + linetype swatches. All chrome text renders in dark ink (INK) or soft dark grey (INK_SOFT) against the light background.
      Data: Four lines — Reykjavik (solid green #009E73, dips to ~-1.5°C in winter, peaks ~11°C in Oct), Berlin (dashed blue #4467A3, similar seasonal shape but colder winter/warmer summer than Reykjavik), Marrakech (dotted ochre #BD8233, inverse-ish shape peaking ~30°C in Aug/Sep), Nairobi (dot-dash rose #954477, nearly flat ~18-22°C year-round). Lines are smooth (rolling-mean smoothed), clearly separated by both color and dash pattern.
      Legibility verdict: PASS — all title/axis/tick/legend text is clearly readable against the light background; no light-on-light issues. However, the horizontal y-axis gridlines at 0/10/20/30 are rendered in full-opacity INK (pixel-sampled exactly #1A1A17, not a faded tone), making them noticeably bolder/higher-contrast than the "subtle, 15-25% opacity" style-guide requirement — a real chrome-styling defect, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-confirmed #1A1A17 (matches spec exactly).
      Chrome: Same layout as the light render — title, axis labels, tick labels, and legend now render in light ink (#F0EFE8) / soft light grey (#B8B7B0) against the dark background.
      Data: Same four lines, same colors (#009E73 green, #4467A3 blue, #BD8233 ochre, #954477 rose) and same linetypes as the light render — confirmed pixel-identical data-color values across both themes; only chrome flipped as required.
      Legibility verdict: PASS — all text is clearly readable (light text on dark background), no dark-on-dark failures anywhere (title, axis labels, tick labels, and legend text all use the correct light-theme tokens). Same gridline-opacity defect as the light render: y=30 gridline pixel-sampled at exactly #F0EFE8 (full INK-dark-theme value, zero blending toward background) — same "too bold for a subtle grid" issue, present identically in both themes.
