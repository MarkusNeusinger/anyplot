      Data: Colors pixel-identical to the light render (#009E73/#C475FD/#4467A3/#BD8233) — only chrome flipped, as required.
      Legibility verdict: PASS — all text clearly readable against the dark background, no dark-on-dark failures.

    Both renders inspected via direct pixel sampling (background corners, gridline rows, canvas edges) in addition to visual review; no edge clipping detected on either render.
