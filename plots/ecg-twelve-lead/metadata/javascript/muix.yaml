review:
  strengths:
  - 'Uses the MUI X v9 composition API: ChartsContainer + LinePlot with custom SVG
    layers that read useXScale/useYScale/useDrawingArea, so ruling, calibration pulse
    and labels sit on the chart''s own scales'
  - One px-per-mm scale for every strip keeps the 1 mm cells square and makes 25 mm/s
    and 10 mm/mV measurable; the voltage window snaps to whole bold squares
  - 'Physiologically consistent data: limb leads III, aVR, aVL, aVF derived from I
    and II by Einthoven''s and Goldberger''s equations, giving an inverted aVR and
    a plausible V1-V6 R-wave progression'
  - 'Theme-tuned ruling: Imprint matte red at higher alpha on dark stays visible yet
    subordinate to the green trace; halo-stroked lead labels readable on both surfaces'
  - Standard 3x4 layout with consecutive 2.5 s windows per column plus a full-width
    labeled Lead II rhythm strip, each with a rectangular 1 mV pulse
  weaknesses:
  - 'Suggestion: align the title block''s left edge with the strips'' left edge (title
    at ~25 px, strips at ~88 px in the display scale) for a cleaner vertical alignment.'
  - 'Suggestion: short vertical separator ticks at the column boundaries, as on clinical
    printouts, would mark where one lead''s window ends and the next begins.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1); the four strips carry a faint red paper tint.
      Chrome: bold dark title "ecg-twelve-lead · javascript · muix · anyplot.ai" top-left, grey subtitle "12 leads, 2.5 s each, and a 10 s II rhythm strip · 1000 Hz · 25 mm/s · 10 mm/mV · 1 mV calibration pulse"; bold dark lead labels I/aVR/V1/V4, II/aVL/V2/V5, III/aVF/V3/V6 and II on the rhythm strip, all readable. No numeric axes (permitted).
      Data: green #009E73 traces over light-red 1 mm ruling and stronger 5 mm ruling with square cells; a rectangular 1 mV calibration pulse (two bold squares tall, one wide) at the left of every strip; P-QRS-T complexes with inverted aVR, rS in V1, tall R in V4-V6; full-width Lead II rhythm strip with 13 beats.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black page (#1A1A17) with a faintly red-tinted panel per strip.
      Chrome: title, subtitle and lead labels in light ink, all readable; no dark-on-dark text.
      Data: identical green #009E73 traces and identical layout; the matte-red ruling is deepened/more opaque, visible yet subordinate to the traces.
      Legibility verdict: PASS
