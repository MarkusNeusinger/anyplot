review:
  strengths:
  - Faithful clinical 3x4 layout (I, aVR, V1, V4 / II, aVL, V2, V5 / III, aVF, V3,
    V6) with each column as a consecutive 2.5 s window, plus a full-width 10 s Lead
    II rhythm strip on the same grid and scale
  - One px-per-mm factor for every strip (computed from the canvas) keeps 1 mm cells
    square and the 25 mm/s / 10 mm/mV scale exact, so the 1 mV calibration step spans
    exactly two bold squares in every row
  - Voltage window snapped to whole 5 mm squares so every strip starts and ends on
    a bold ruling line
  - 'ECG paper ruling in the Imprint matte red with theme-dependent opacity: pink-red
    paper on light, a deepened red ruling on dark that stays visible yet subordinate
    to the green traces'
  - 'Idiomatic MUI X v9 composition: ChartsContainer with LinePlot plus custom SVG
    layers driven by useXScale/useYScale/useDrawingArea, null-gapped per-lead series,
    skipAnimation and hidden axes'
  - Lead labels carry a page-coloured halo (paintOrder stroke) so they stay legible
    over the ruling in both themes
  - 'Morphology varies plausibly by lead: inverted aVR, rS in V1 with inverted T,
    tall R in V4-V5'
  weaknesses:
  - 'DQ-03 (code): the per-lead gains break Einthoven''s law — lead III''s R wave
    is 0.55 x 1.0 mV while II − I gives 1.05 − 0.75 = 0.30 mV (+0.25 mV too tall),
    and aVR/aVF are not derived from I and II either, so the limb leads are not mutually
    consistent → derive III = II − I, aVR = −(I + II)/2, aVL = I − II/2, aVF = II
    − I/2 from the generated I and II. Likely cause: independent hand-picked gains
    in the `profile` table for III, aVR, aVL and aVF.'
  - 'Suggestion: a short vertical tick at each column boundary, as on clinical printouts,
    would mark where one lead''s window ends and the next begins.'
  - 'Suggestion: the subtitle''s ''10 s II rhythm strip'' would read more clearly
    as ''10 s Lead II rhythm strip''.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; each of the four strips sits on a faint pink-tinted panel.
      Chrome: bold title "ecg-twelve-lead · javascript · muix · anyplot.ai" top left (~31 % of the width), a grey subtitle with the scale metadata (12 leads, 2.5 s each, 10 s rhythm strip, 1000 Hz, 25 mm/s, 10 mm/mV, 1 mV calibration pulse); dark bold lead labels I, aVR, V1, V4 / II, aVL, V2, V5 / III, aVF, V3, V6 / II at the top-left of each window, all readable. No numeric axes, as permitted.
      Data: green #009E73 traces with P-QRS-T complexes at 75 bpm; 1 mV rectangular calibration pulse at the left of every strip spanning two bold squares; light red 1 mm and bolder red 5 mm ruling, square cells; aVR inverted, V1 rS with inverted T, tall R in V4-V5; full-width Lead II rhythm strip at the bottom.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page with a faint red-tinted panel behind each strip.
