review:
  strengths:
  - 'Builds the lollipop with MUI X v9 composition: ChartsContainer supplies a linear
    value axis and a band category axis, and a custom child component draws the stems
    and dots in the same coordinate space through the useXScale / useYScale hooks,
    because the community package has no lollipop series'
  - 'Stems are 3 px with round caps and the dots have an 11 px radius, so every category
    reads as a dot on a stick. All twelve lollipops are drawn in brand green #009E73
    and start from a zero baseline on an untruncated value axis'
  - Categories are sorted by value from the data, not from a typed order. The horizontal
    orientation keeps 'Literary Fiction' readable, and the axis titles come from the
    role constants
  - All chrome comes from the theme tokens (ink for the title and axis titles, inkSoft
    for ticks and value labels, a grid at half opacity), so both renders are fully
    legible and the data colors are identical
  - Value labels with one decimal sit a fixed 16 px right of each dot, inside the
    right margin reserved for them, and never collide with the marks
  weaknesses:
  - 'Suggestion: a 5-unit x tick step (0, 5, 10, 15, 20) instead of 25 one-unit ticks
    and grid lines would calm the grid. The value labels already carry the exact numbers.'
  - 'Suggestion: a narrower y-axis band (about 130 px instead of 180) would move the
    ''Book genre'' title closer to its tick labels and close the empty strip at the
    left edge.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: the title "lollipop-basic · javascript · muix · anyplot.ai" is centered at the top in dark ink. The y-axis title "Book genre" is rotated on the left, and the x-axis title "Annual sales (millions of units)" sits at the bottom. The genre tick labels and the x ticks 0–24 are dark grey. Thin vertical grid lines appear at every unit, and the left and bottom axis lines are drawn. All text is readable.
      Data: 12 horizontal lollipops, each a thin #009E73 stem from 0 to a large #009E73 dot. They are sorted from Children's (22.1) at the top down to Literary Fiction (6.4). A grey value label sits right of each dot. Nothing overlaps or is clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, axis titles, tick labels and value labels are in light ink and inkSoft. The grid is subtle dark grey but visible, and the axis lines are light. No dark-on-dark text.
      Data: identical #009E73 stems and dots in the same positions as the light render. Only the chrome flipped.
      Legibility verdict: PASS
