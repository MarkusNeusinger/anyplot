review:
  strengths:
  - 'Clean lollipop geometry: 3 px round-capped stems from a true zero baseline to
    r=11 px markers, so each row reads as a dot on a stick'
  - Composes the chart from MUI X primitives (ChartsContainer, ChartsGrid, ChartsXAxis/ChartsYAxis)
    and draws the marks through the useXScale/useYScale hooks, the library's way to
    build a type it does not ship
  - 'Theme tokens threaded through every element: brand green data identical in both
    renders, ink/inkSoft text readable on both surfaces'
  - Horizontal orientation with categories sorted descending gives long genre names
    room and a clear ranking
  - Plausible, neutral scenario (annual book sales by genre) with 12 categories and
    well-spread values
  weaknesses:
  - 'VQ-06 (both): the category axis has no title, so the reader must infer that the
    rows are book genres → title the y axis with the CATEGORY constant ''Book genre''
    (and widen the axis band if needed). Likely cause: yAxis config has no `label`.'
  - 'Suggestion: a coarser value grid (every 2 or 5 units instead of 25 lines at every
    unit) would quiet the background behind the stems, e.g. via `tickInterval` or
    `tickNumber` on the x axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: centered title "lollipop-basic · javascript · muix · anyplot.ai" in dark ink; 12 genre tick labels on the left (Children's to Literary Fiction), x ticks 0-24 at every unit, x-axis title "Annual sales (millions of units)"; no y-axis title. Subtle light-grey vertical grid lines. All text readable.
      Data: horizontal lollipops, one per genre, sorted descending (22.1 down to 6.4); thin #009E73 stems from x=0 to filled #009E73 circular markers, value labels in soft ink right of each marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, tick labels and axis title in light/soft ink, grid lines subtle dark grey but visible; no dark-on-dark text.
      Data: identical brand-green stems and markers at the same positions as the light render; value labels in light soft ink.
      Legibility verdict: PASS
