review:
  strengths:
  - Idiomatic stat_ecdf(geom = 'step', pad = FALSE) draws both ECDFs as true step
    functions at the sample values
  - Redundant color + line-type encoding (solid green vs longdash matte red), merged
    into one legend by matching scale names
  - 'Semantic Imprint mapping: Good Customers in brand green, Bad Customers in matte
    red #AE3030'
  - K-S segment spans exactly the widest gap at score ~613; D and p from ks.test placed
    in empty space clear of both curves
  - All chrome theme-adaptive; both renders fully readable
  weaknesses:
  - 'DE-02 (both): the major grid is drawn in INK_SOFT at full opacity on both axes
    and reads as a high-contrast grid competing with the step lines → the style guide''s
    grid tone, INK at 15 % (alpha(INK, 0.15)) at linewidth 0.3. Likely cause: panel.grid.major
    = element_line(color = INK_SOFT, linewidth = 0.2).'
  - 'Suggestion: drop the legend box frame (the style guide''s decoration checklist)
    for a lighter bottom legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title 'ks-test-comparison · r · ggplot2 · anyplot.ai' top-left (~52 % of width); axis titles 'Credit Score' and 'Cumulative Proportion' in dark ink; tick labels 300-800 and 0 %-100 % in INK_SOFT; left and bottom axis lines; major grid on both axes in full-opacity INK_SOFT, noticeably strong; legend in a framed elevated box at the bottom. All readable.
      Data: Good Customers solid brand green #009E73 step ECDF rising from ~500 to ~850; Bad Customers longdash matte red #AE3030 rising from ~310 to ~860. Black dotdash vertical segment at score ~613 from ~13 % to ~64 %. Label box 'D = 0.536 / p = 8.23e-63' in the empty lower right (~745-820, 13-23 %), clear of both curves.
