review:
  strengths:
  - Correct two-sample K-S statistic and asymptotic p-value calculation (Kolmogorov
    distribution series with the standard Marsaglia/Stephens correction term) — a
    real statistical computation, not a faked/hardcoded number
  - 'Proper ECDF step visualization for both distributions using Chart.js `stepped:
    ''after''`, with clamped/sorted synthetic data'
  - Maximum-divergence point highlighted with a dashed vertical line and end markers,
    with D and p-value surfaced prominently in the subtitle
  - 'Correct Imprint palette usage: first series is brand green `#009E73`, second
    series uses the semantic red anchor for ''Bad customers'' (matches the good=green/bad=red
    semantic-exception rule)'
  - Theme-adaptive chrome is clean and consistent — both light and dark renders are
    fully legible with identical data colors and correctly flipped backgrounds/text/grid
  - 'Deliberate restraint: x-axis grid disabled (y-axis-only grid per style guide),
    and the legend filter hides the redundant third (''Max distance'') entry since
    that value is already in the subtitle'
  weaknesses:
  - Title occupies only ~31% of the canvas width at the standard 22px font size (shorter
    title string than the catalog's typical ~67-char mandated title) — legible but
    visually less prominent than the 'largest, first thing readers see' hierarchy
    the style guide describes; a modest font-size bump for shorter titles like this
    one would give it more visual weight
  - The statistical computation needs several small helper functions (lcg, randNormal,
    clamp, ecdfSteps, ecdfAt, ksPValue) — necessary for a correct K-S implementation,
    but more structure than the KISS baseline ideally wants
  - No chartjs-specific interactive/tooltip customization beyond the library defaults
    — a custom tooltip formatter surfacing the exact ECDF values at a given credit
    score would have shown more distinctive library mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with the required #FAF8F1 plot surface — not pure white.
      Chrome: Title "ks-test-comparison · javascript · chartjs · anyplot.ai" in dark ink at top, subtitle "K-S statistic D = 0.525 · p-value = < 0.001" in a slightly softer gray below it. X-axis titled "Credit Score" (0-850 range, ticks every 50), Y-axis titled "Cumulative Proportion" (0 to 1, ticks every 0.1). Subtle horizontal gridlines on the y-axis only; x-axis has no gridlines. Bottom legend shows two circular swatches: green "Good customers (n=300)" and red "Bad customers (n=250)". All text is dark ink against the light background and is clearly readable.
      Data: Two ECDF step curves — brand green (#009E73) for Good customers, matte red (#AE3030) for Bad customers, both rendered as clean step-after lines with no markers. A dashed amber vertical line with two small dot markers connects the two curves at the credit score where they diverge most (~630), visually anchoring the K-S statistic.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with the required #1A1A17 plot surface — not pure black.
      Chrome: Same title and subtitle text, now rendered in white/light-gray ink; axis titles and tick labels in light gray; gridlines are faint light lines on the dark surface. Legend swatches and text render the same way, now in white/light gray.
      Data: The green and red ECDF curves and the amber dashed highlight line are identical in hue/position to the light render — confirming only chrome (background, text, grid) flipped, not data colors.
      Legibility verdict: PASS — no dark-on-dark issues; all title/axis/tick/legend text is clearly visible against the near-black background.
