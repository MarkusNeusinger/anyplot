review:
  strengths:
  - 'Implements every required spec feature: both ECDF step curves, the K-S statistic
    D and p-value displayed prominently, and the max-divergence point highlighted
    with a dashed vertical line and dual markers.'
  - 'Thoughtful semantic color mapping: Good customers use brand green (#009E73),
    Bad customers use the Imprint matte-red semantic anchor (#AE3030) — matching the
    widely understood good/bad convention while staying inside the Imprint palette.'
  - Clean, deterministic data generation via a seeded LCG + Box-Muller normal sampler,
    with realistic credit-score domain clamping (300-850, FICO-like range).
  - 'Both renders are fully theme-correct: background, text, and grid all flip correctly
    between light (#FAF8F1) and dark (#1A1A17) while data colors stay identical.'
  - 'Correct two-sample K-S computation: efficient binary-search ECDF evaluation and
    a proper asymptotic Kolmogorov p-value series.'
  weaknesses:
  - Design excellence is largely default-level beyond the required annotation — no
    extra visual hierarchy, refined grid/legend styling, or callout treatment; consider
    shading the max-divergence region (e.g. an ECharts markArea between the two curves
    at ksX) or adding a subtle callout box behind the D/p-value text to elevate storytelling.
  - Title occupies only ~33% of the 3200px canvas width, noticeably under the ~50-70%
    guideline for a title this short; a larger title fontsize (e.g. 26-28px instead
    of 22px) would better balance the composition without risking overflow.
  - Library Mastery is generic — only line/step + markPoint are used; consider more
    distinctive ECharts features (visualMap shading, markArea for the divergence band,
    or graphic elements) to make the implementation more than a straightforward line-chart
    adaptation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "ks-test-comparison · javascript · echarts · anyplot.ai" is dark ink, centered, fully readable. Legend ("Good customers (n=400)" / "Bad customers (n=400)") sits below the title with matching swatch colors. Axis labels "Credit score" (x) and "Cumulative probability" (y) and tick labels are dark/soft-dark and clearly legible. Gridlines are thin, light gray, subtle.
      Data: Two step-line ECDFs — Good customers in brand green (#009E73), Bad customers in matte red (#AE3030) — plus a black dashed vertical line with two circular markers at the point of maximum divergence, labeled "D = 0.525" / "p < 0.001" in bold dark text.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, legend, axis labels, and tick labels all render in light/off-white text, clearly visible against the dark background. Gridlines are thin, light-colored at low opacity, subtle but visible. The dashed divergence line and its markers flip to white/light for contrast.
      Data: Same two step-line ECDFs in identical colors to the light render — brand green (#009E73) and matte red (#AE3030) — confirming the palette does not change between themes. The "D = 0.525 / p < 0.001" annotation is bold white text, clearly legible.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
