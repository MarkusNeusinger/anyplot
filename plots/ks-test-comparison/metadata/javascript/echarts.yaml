review:
  strengths:
  - 'Repair fully addressed all three attempt-1 weaknesses: added a shaded markArea
    over the max-divergence band, upgraded the D/p-value label into a bordered callout
    box, and increased the title font size from 22px to 27px.'
  - The shaded divergence band plus dashed connector and callout box now create a
    strong, immediate visual focal point on the K-S statistic — a clear improvement
    in data storytelling over attempt 1.
  - 'Correct two-sample K-S computation: binary-search ECDF evaluation and a proper
    asymptotic Kolmogorov-distribution p-value series, not a hardcoded or fake statistic.'
  - 'Thoughtful semantic color mapping: Good customers use brand green (#009E73),
    Bad customers use the Imprint matte-red semantic anchor (#AE3030) — matching the
    widely understood good/bad convention while staying inside the Imprint palette.'
  - 'Implements every required spec feature: both ECDF step curves, K-S statistic
    D and p-value displayed prominently, max-divergence point highlighted with a dashed
    vertical line, dual markers, and a shaded band.'
  - 'Both renders are fully theme-correct: background, text, grid, and callout-box
    fill all flip correctly between light and dark while the two data series colors
    stay pixel-identical.'
  - Clean, deterministic data generation via a seeded LCG + Box-Muller normal sampler,
    with realistic FICO-like credit-score domain clamping (300-850).
  weaknesses:
  - Title still fills only ~38-40% of the canvas width even after the 22px -> 27px
    bump, noticeably under the ~50-70% guideline; a further increase (e.g. to ~30-32px)
    would balance the composition better without risking overflow.
  - The amber highlight band is semantically reserved for warning/caution in the style
    guide; here it is used purely for visual emphasis of the divergence region. It
    reads fine and isn't a violation, but a theme-adaptive neutral/muted fill would
    be a more literal semantic fit if revisited.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "ks-test-comparison · javascript · echarts · anyplot.ai" is centered in dark ink and fully readable. Legend ("Good customers (n=400)" / "Bad customers (n=400)") sits below the title with hollow-circle line swatches. Axis titles ("Credit score", "Cumulative probability") and tick labels are dark/soft-dark and legible. Gridlines are thin, light grey, and subtle. A bordered callout box reading "D = 0.525 / p < 0.001" sits to the left of a black dashed vertical connector line with two hollow circle markers at the point of maximum divergence; a pale amber-tinted band shades the vertical divergence region behind the connector.
      Data: Good customers ECDF is brand green (#009E73); Bad customers ECDF is Imprint matte red (#AE3030) — first series correctly matches the mandated brand green.
      Legibility verdict: PASS — no light-on-light text observed anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend, axis titles, and tick labels all flip to light/off-white text, clearly visible against the dark surface. Gridlines remain subtle light lines on dark. The callout box now uses a dark elevated fill with light border/text, and the dashed connector flips to white. The amber-tinted divergence band renders as a translucent olive/tan overlay against the dark background (expected alpha-compositing behavior, not a defect).
      Data: Good customers ECDF is the identical brand green (#009E73); Bad customers ECDF is the identical matte red (#AE3030) — confirmed pixel-identical to the light render; only chrome elements changed.
      Legibility verdict: PASS — no dark-on-dark failures observed anywhere.
