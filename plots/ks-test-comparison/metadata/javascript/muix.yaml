      Data: Two step-function ECDF curves — the "Good-standing customers (n=400)" series in Imprint brand green (#009E73) sits to the right (higher scores), the "Bad-standing customers (n=400)" series in Imprint matte red (#AE3030) sits to the left (lower scores). Legend swatches at the top match these colors exactly and use the correct semantic exception (good→green, bad→red). Curves are clearly separated and easy to tell apart.
      Legibility verdict: PASS

