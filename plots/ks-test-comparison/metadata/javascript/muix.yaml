review:
  strengths:
  - 'Correct semantic-exception color mapping: good-standing customers use brand green
    (#009E73), bad-standing customers use the matte-red semantic anchor (#AE3030)
    — exactly matching the ''good→green, bad→red'' convention from the style guide.'
  - 'The K-S statistic is not just mentioned but visually anchored: a theme-adaptive
    ChartsReferenceLine marks the exact location of maximum divergence, and the subtitle
    reports both D and the p-value prominently — directly satisfying every ''Notes''
    bullet in the specification.'
  - Both ECDFs are rendered as true step functions (curve='stepAfter', showMark=false)
    with markers appropriately suppressed given the 400-point sample density.
  - Deterministic, dependency-free data generation (fixed-seed LCG + Box-Muller normal
    sampler, exact two-sample K-S statistic and asymptotic p-value computed in-code)
    — fully reproducible without any external stats library.
  - 'Clean, idiomatic MUI X usage: skipAnimation set, explicit font sizes via sx overrides,
    sensible margins, descriptive legend labels with sample sizes (n=400).'
  weaknesses:
  - Design is thoughtful but still close to a well-configured MUI X default (no custom
    typography or additional refinement beyond grid/margin tuning) — Design Excellence
    has headroom before this reaches true publication-grade polish.
  - The K-S plot could go one step further in storytelling by lightly shading the
    vertical gap between the two curves at the max-divergence point to make the statistic
    even more visually self-evident.
  - '''Credit Score'' axis label has no unit/scale hint (e.g. typical 300-850 range)
    that would help a reader unfamiliar with credit scoring calibrate the numbers
    at a glance.'
  image_description: |-
