review:
  strengths:
  - 'Both ECDFs are drawn as true step functions with the native LineChart `curve:
    "stepAfter"`. Brand green #009E73 marks the good-standing sample and Imprint lavender
    the bad-standing sample, and the y axis holds 0 to 1 with a small pad so the flat
    ends stay visible'
  - 'The maximum distance is located exactly: a dashed ChartsReferenceLine at x =
    626, labelled ''largest gap at 626'', plus a solid ink bar with page-outlined
    endpoint dots that spans the 0.13 to 0.70 gap. The bar is drawn as a custom SVG
    layer through the useXScale/useYScale hooks, so it sits at the data coordinates'
  - 'The three-line header sets a clear hierarchy: the mandated title, then a bold
    ''K-S statistic D = 0.573 · p < 0.001'' line, then a soft-ink caption. The statistic
    is prominent and covers neither curve'
  - The asymptotic two-sample p-value (Kolmogorov series with Stephens' correction)
    and D are computed from the data rather than typed in. The Computation line allows
    a written-out version because MUI X has no stats helpers
  - Theme tokens are threaded through every chrome element, so both renders read cleanly.
    The gap bar flips from ink to light ink in dark mode while the data colors stay
    identical. Hover tooltips and legend interactivity come natively in the HTML
  weaknesses:
  - 'Suggestion: the legend''s ''(n = 400)'' suffixes repeat the caption''s ''n =
    400 and 400''; one of the two could go to lighten the header'
  - 'Suggestion: the caption fragment ''bar: the largest gap between the two ECDFs''
    could read more naturally, e.g. ''solid bar marks the largest gap D'''
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: centered three-line header: the bold title "ks-test-comparison · javascript · muix · anyplot.ai", the bold stat line "K-S statistic D = 0.573 · p < 0.001", and the soft-ink caption "two-sample test, n = 400 and 400 · bar: the largest gap between the two ECDFs". Below it sits a horizontal legend with line glyphs. The y axis is "Cumulative proportion" with ticks 0.0 to 1.0 in 0.1 steps, and the x axis is "Credit score (points)" with ticks 360 to 840 every 20. Subtle horizontal grid lines; left and bottom axis lines only. All text is dark and readable, and nothing is clipped.
      Data: green #009E73 step ECDF for good-standing customers (n = 400) and lavender step ECDF for bad-standing customers (n = 400), both 3 px wide and rising monotonically from 0 to 1. A dashed soft-ink vertical reference line at x = 626 carries the label "largest gap at 626" near the top. A solid dark-ink bar with round endpoint dots spans from the green curve (~0.13) to the lavender curve (~0.70), which is the D = 0.573 gap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, stat line, legend text, axis titles and tick labels are all light ink, and the caption and reference label are a lighter soft grey. Everything is readable, with no dark-on-dark text. The grid is subtle dark grey but visible.
      Data: the green and lavender step lines are identical to the light render. The gap bar and endpoint dots flip to light ink and the dashed reference line to soft light grey, as theme chrome should. Brand green stays clearly visible.
      Legibility verdict: PASS
