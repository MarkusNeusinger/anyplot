review:
  strengths:
  - 'Faithful coverage of every spec-required K-S plot feature: both ECDFs rendered
    as step functions, D-statistic and p-value shown prominently in the subtitle,
    the max-divergence point highlighted with a vertical dotted line plus markers,
    and both distributions clearly labeled in the legend.'
  - 'Correct Imprint palette use with a sensible semantic exception: brand green (#009E73)
    stays the first series (Good Customers), matte red (#AE3030, palette slot 5) is
    deliberately chosen for Bad Customers, matching the style guide''s bad/error semantic
    mapping.'
  - Deterministic, reproducible data pipeline (fixed-seed LCG + Box-Muller normal
    sampler) with a realistic, neutral credit-scoring scenario (FICO-range 300-850
    Good vs Bad customer distributions) that matches one of the spec's own suggested
    applications.
  - Theme-adaptive chrome is correctly threaded through title, subtitle, axis titles/labels,
    legend, and grid tokens — both light and dark renders are fully legible with correctly
    flipped chrome and identical data colors.
  - 'Idiomatic, constraint-aware Highcharts usage: native `step` series type for the
    ECDFs, animation and tooltip explicitly disabled per the mount-node contract,
    and a clever plain-series workaround (dashed line + markers, `enableMouseTracking:
    false`) to fake an annotation without the unavailable annotations module.'
  weaknesses:
  - 'VQ-04: Good Customers (#009E73 green) vs Bad Customers (#AE3030 red) is the classic
    red-green CVD confusion pair. Near x=375-425 and x=800-850 both ECDFs converge
    close to 0 and 1 respectively, where color becomes the primary cue distinguishing
    them. Add a redundant encoding for CVD safety, e.g. a distinct `dashStyle` (e.g.
    "ShortDash") on the Bad Customers series.'
  - 'DE-02: Grid lines are enabled on both the X and Y axes at equal weight. The style
    guide recommends Y-axis-only grid for line charts; the vertical gridlines add
    clutter without adding reading value here. Consider `xAxis.gridLineWidth: 0`.'
  - 'DE-01: The implementation meets spec requirements but stays close to a well-configured
    default rather than showing standout polish — e.g. the legend''s `elevatedBg`
    box is barely distinguishable from the light-theme page background (#FFFDF6 vs
    #FAF8F1), and the max-divergence marker is a plain black/white dot with no additional
    visual weight (e.g. a small callout label with the score value) to make it the
    chart''s clear focal point.'
  - 'Canvas usage: the mandated title only fills roughly 35% of the canvas width at
    22px, leaving generous unused whitespace at the top of the chart. Not a violation,
    but growing the title slightly or adding a short descriptive prefix (e.g. "Credit
    Score Distribution · ks-test-comparison · javascript · highcharts · anyplot.ai")
    would put that space to better use.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "ks-test-comparison · javascript · highcharts · anyplot.ai" in bold dark ink at top center; subtitle "D = 0.540 at score 602 · p < 0.001" directly below in softer gray; axis titles "Credit Score" (x) and "Cumulative Proportion" (y) in medium-gray ink; tick labels in the same softer gray; legend (top right, subtle off-white box) lists "Good Customers (ECDF)", "Bad Customers (ECDF)", and "Max Divergence (D = 0.540)". Thin, subtle gridlines on both axes.
      Data: Good Customers ECDF is a teal-green (#009E73) step line rising from the bottom-left; Bad Customers ECDF is a matte-red (#AE3030) step line rising earlier/faster; a black dotted vertical line with two black dot markers connects the two curves at credit score 602, marking the point of maximum divergence.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle text now rendered in light cream ink; axis titles and tick labels in light gray; legend box uses a slightly lighter dark panel, text in light gray, fully readable; gridlines are faint light lines, subtle but visible.
      Data: Good Customers ECDF is the identical teal-green (#009E73); Bad Customers ECDF is the identical matte-red (#AE3030) — both colors match the light render exactly, confirming only chrome flipped. The max-divergence marker uses white dots and a white dotted line (correctly flipped from black to remain visible on the dark surface) at the same credit score 602 / D = 0.540 location.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly visible against the near-black background.
