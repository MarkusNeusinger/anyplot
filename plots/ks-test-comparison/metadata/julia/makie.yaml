review:
  strengths:
  - 'Complete K-S display: both ECDFs as step functions on a 0-1 axis, dashed vertical
    line plus a thick red gap segment at the maximum-distance x, and D/p-value placed
    in the gap where it covers neither curve'
  - D and the asymptotic p-value fall out of the inline two-sample computation (searchsortedlast
    over the pooled sample); the reported D 0.658 matches the gap read off the axis
  - Theme tokens threaded through every chrome element; both renders are fully readable
    with the Imprint green/lavender pair identical across themes
  - Translucent band! between the curves gives the divergence region a quiet focal
    emphasis without hiding either line
  weaknesses:
  - 'CQ-04 (code): lines 59-71 write out the ECDF step coordinates (the ecdf_step
    helper and its two calls, about 13 lines) → `ecdfplot!(ax, good_scores; color
    = IMPRINT_PALETTE[1], linewidth = 2.5, label = "Good Customers")` and the same
    for bad_scores (Makie). Likely cause: a hand-built step function instead of Makie''s
    ECDF recipe.'
  - 'Suggestion: y-axis ticks at 0.0/0.5/1.0 only; ticks every 0.2 would let a reader
    read both ECDF values at the gap endpoints.'
  - 'Suggestion: the band and the dashed marker share the red of the gap segment;
    a neutral band would leave red to the statistic alone.'
