review:
  strengths:
  - Uses plotnine's native stat_ecdf(geom='step', pad=False) on melted long data,
    so the steps sit exactly at each sample's values
  - K-S statistic and p-value set prominently in a themed label box placed in empty
    space below the green curve, covering neither ECDF
  - 'Clear red focal system: dashed divergence line, bold D label and stats box share
    the bad-customer red; muted italic interpretive line states the conclusion'
  - Semantic Imprint exception (good→green, bad→red) with fully theme-adaptive chrome;
    both renders pass legibility
  - D = 0.730 falls out of scipy.stats.ks_2samp and matches the plotted gap
  weaknesses:
  - 'Suggestion: scipy''s ks_2samp result exposes statistic_location, which could
    replace the all_values/searchsorted search for the divergence x (lines 65-69).'
  - 'Suggestion: the title-shrink lines (85-86) never change the size for this 52-character
    title and could be a fixed 12 pt.'
  - 'Suggestion: give the legend key squares the legend box fill so no faint lighter
    squares show behind the line samples.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title 'ks-test-comparison · python · plotnine · anyplot.ai' in dark ink, top centre; axis titles 'Credit Score (points)' and 'Cumulative Proportion (0–1)'; ticks 250/500/750/1000 and 0.0-1.0; subtle horizontal grid; legend 'Distribution' upper left in an elevated box — all readable
      Data: Good Customers ECDF in #009E73 rising from ~450 to ~985, Bad Customers in #AE3030 rising from ~205 to ~890; dashed red vertical at x≈620 spanning ~0.10-0.83 with bold red 'D = 0.730'; red-outlined box 'K-S Statistic = 0.730 | p-value = 9.54e-78' bottom right; dotted 0.5 reference; muted italic line 'Distributions are highly distinct (D = 0.73) — strong evidence the groups differ' above 1.0
