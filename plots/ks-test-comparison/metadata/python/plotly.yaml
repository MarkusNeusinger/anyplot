review:
  strengths:
  - Both ECDFs drawn as true step functions with line shape='hv' from scipy.stats.ecdf,
    and the test from ks_2samp
  - Vertical dashed line with diamond endpoints sits exactly at the widest gap, so
    the reported D can be read off the plot
  - 'Complete theme adaptation: PAGE_BG, ELEVATED_BG, INK, INK_SOFT, INK_MUTED and
    GRID tokens threaded through title, axes, legend, annotation and hover labels'
  - 'Plotly-native interactivity in the HTML: unified x hover, crosshair spike lines,
    custom hovertemplates and drawline/eraseshape modebar buttons'
  - K-S statistic box placed in the empty lower right with an arrow to the gap, covering
    neither curve
  weaknesses:
  - 'VQ-04 (both): Good and Bad Customers are separated only by green #009E73 against
    red #AE3030, both solid lines at width 3, so red-green is the sole signal → give
    one curve a second cue such as a dashed line style (the Notes allow colors or
    styles). Likely cause: both traces use line dash ''solid''.'
  - 'CQ-04 (code): lines 59–64 concatenate both samples, evaluate both ECDFs and argmax
    their difference to find the x of the maximum gap, which ks_2samp already returns
    → use res = ks_2samp(...) and res.statistic_location, evaluating the two ECDFs
    only there. Likely cause: hand-rolled search instead of the result object''s field.'
  - 'Suggestion: route the annotation arrow so it does not cross the green curve near
    score 56, for example by placing the box a little higher in the empty right area.'
