    % empty frame on the left and 10 % on the right, with the x-axis title pressed
    toward the bottom edge → fill the canvas with balanced margins. Likely cause:
    no plt.tight_layout() before savefig.'
  - 'Suggestion: the max-gap fill_between is drawn over the green line (same zorder),
    tinting the Good curve teal inside the band; zorder=1 for the band would keep
    the line''s color true.'
