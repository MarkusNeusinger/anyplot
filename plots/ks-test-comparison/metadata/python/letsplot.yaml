review:
  strengths:
  - Native geom_step draws both ECDFs as true step functions, rising only at each
    sample's values
  - element_markdown subtitle reports D and the p-value in bold with a muted qualifier,
    clear of both curves
  - Max-divergence location computed from both ECDFs and marked by a dashed vertical
    segment with an arrowed 'D = 0.469' label
  - Theme tokens threaded through every chrome element; both renders fully readable
  - layer_tooltips gives group, score and ECDF on hover in the HTML view
  weaknesses:
  - 'Suggestion: give the divergence band no outline (color=None or a transparent
    outline) so it does not draw dark lines along y = 0 below 360 and y = 1 above
    760 where only one curve exists.'
  - 'Suggestion: derive the ''(highly significant)'' qualifier from p_value instead
    of a fixed string, so it stays true on other data.'
  - 'Suggestion: match the legend key background to the legend box (legend_key=element_rect(fill=ELEVATED_BG))
    so the keys do not sit on visibly different squares.'
