review:
  strengths:
  - Vega-Lite step-after interpolation draws both ECDFs as true step functions directly
    from the sorted samples
  - Redundant strokeDash encoding (solid vs dashed) alongside the semantic green/red
    pair keeps the two groups apart without color
  - The K-S statistic comes from scipy.stats.ks_2samp and the distance line is placed
    at the computed max-gap x, so D can be read off the plot
  - 'Theme tokens threaded through title, subtitle, axes, legend and the D label:
    both renders readable'
  - HTML tooltips report group, score and cumulative proportion per step
  weaknesses:
  - 'Suggestion: the subtitle repeats the legend''s group names; it could carry only
    the K-S statistic and p-value.'
