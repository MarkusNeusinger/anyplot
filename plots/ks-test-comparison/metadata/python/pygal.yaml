review:
  strengths:
  - 'Semantic Imprint mapping: Good Customers on brand green #009E73, Bad Customers
    on matte red #AE3030, with a dash on the red line so the pair is CVD-safe'
  - 'D and p labels themed through value_colors, readable on both #FAF8F1 and #1A1A17'
  - Vertical KS marker with two dots spans exactly the 0.17→0.87 gap at x≈577, matching
    D = 0.700 from scipy.stats.ks_2samp
  - Clean vectorized ECDF and step construction with np.repeat / np.searchsorted;
    tidy df Data block with column constants
  - Native pygal per-point label dicts with print_labels for annotation, plus HTML
    export
  weaknesses:
  - 'VQ-05 (both): an empty band of about 200 px (≈11 % of the height) sits below
    the bottom legend, while the plot area could extend that far → bring the legend
    within ~60 px of the canvas bottom (−100 px margin_bottom). Likely cause: margin_bottom=160
    on top of pygal''s own legend spacing.'
  - 'SC-02 (both): the K-S statistic ''D = 0.700'' is printed at 42 px in regular
    weight beside a dot, the same as the tick labels, so it is not shown prominently
    as the Notes ask → set it clearly larger than the ticks, about 56–66 px (+14 to
    +24 px). Likely cause: value_label_font_size=42 / value_font_size=42 used for
    the printed point labels.'
  - 'Suggestion: the legend''s solid square swatches do not show the red line''s dash;
    pygal cannot draw line samples, so naming the line style in the legend text would
    carry it.'
  - 'Suggestion: lines 84–94 build the good and bad step arrays twice with identical
    code; one loop over the two samples would halve it.'
