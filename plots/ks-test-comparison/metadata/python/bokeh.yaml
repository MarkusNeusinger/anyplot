review:
  strengths:
  - Green Good / red Bad follows the Imprint semantic exception, and the solid-vs-dashed
    line style gives a second cue, so both ECDFs can be told apart in both themes
    and under CVD
  - A Bokeh Band model shades the gap between the two ECDFs around the maximum divergence,
    and diamond markers cap the blue K-S segment, so the D the statistic reports is
    easy to find
  - D and p come from scipy.stats.ks_2samp and are formatted in an f-string; the annotation
    sits on an elevated, theme-adaptive background clear of both curves
  - 'Theme-adaptive chrome is complete: INK/INK_SOFT text, an ELEVATED_BG legend and
    annotation box, and a 0.15-alpha grid that reads in both renders'
  - Column constants and a df-based Data block let the plot section read only df,
    so the file can be adapted to a user's table
  - A HoverTool scoped to the two ECDF renderers gives exact score/proportion readouts
    in the HTML artifact
  weaknesses:
  - 'CQ-04 (code): lines 87–90 interleave repeated x/y arrays by hand to draw the
    steps, and lines 78–84 recompute both ECDFs on the pooled values to locate the
    maximum gap → draw each ECDF with Bokeh''s `p.step(..., mode="after")` on the
    sorted values, and read the location from `ks_2samp(...).statistic_location`.
    Likely cause: hand-built step arrays and a hand-written argmax over pooled ECDFs.'
  - 'Suggestion: the dotted Span at max_x (line_alpha=0.12) is almost invisible beside
    the solid K-S segment; dropping it or giving it a clearly visible alpha would
    remove an element that adds nothing.'
  - 'Suggestion: a second line under the D/p annotation saying what it means (for
    example ''distributions differ'') would give the statistic a reading for non-statisticians.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, with a thin INK_SOFT frame around the plot area.
