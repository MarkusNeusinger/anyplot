review:
  strengths:
  - Green Good / red Bad follows the Imprint semantic exception, and the solid-vs-dashed
    line style gives a second cue, so both ECDFs can be told apart in both themes
    and under CVD
  - A Bokeh Band model shades the gap between the ECDFs around the maximum divergence,
    and diamond markers cap the blue K-S segment, so the reported D is easy to locate
  - D, p and the max-gap location all come from scipy.stats.ks_2samp (statistic_location);
    the annotation sits on an elevated, theme-adaptive background clear of both curves
  - Native p.step(mode='after') on ColumnDataSources draws the ECDFs without hand-built
    step arrays
  - 'Theme-adaptive chrome is complete: INK/INK_SOFT text, ELEVATED_BG legend and
    annotation boxes, and a 0.15-alpha grid that reads in both renders'
  - A HoverTool scoped to the two ECDF renderers gives exact score/proportion readouts
    in the HTML artifact
  weaknesses:
  - 'Suggestion: the dotted Span at max_x (line_alpha=0.12) is almost invisible beside
    the solid K-S segment; dropping it would remove an element that adds nothing.'
  - 'Suggestion: a second line under the D/p annotation saying what it means (for
    example ''distributions differ'') would give the statistic a reading for non-statisticians.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 with a thin INK_SOFT frame around the plot area.
      Chrome: bold dark title "ks-test-comparison · python · bokeh · anyplot.ai" at about half the width; italic axis titles "Credit Score" and "Cumulative Proportion"; INK_SOFT tick labels 300–900 and 0.0–1.0; subtle grid; legend top-left on an elevated box with three entries. All readable.
      Data: solid green #009E73 ECDF for Good Customers (about 485–885) and dashed red #AE3030 ECDF for Bad Customers (about 305–780), both stair steps from 0 to 1; blue #4467A3 vertical K-S segment at x≈593 from y≈0.08 to y≈0.81 with diamond caps; a faint blue band between the curves around the segment; bold blue "D = 0.737,  p < 0.001" label on an elevated box at y≈0.44, clear of both curves.
      Legibility verdict: PASS

