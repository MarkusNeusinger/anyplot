      Data: a solid green #009E73 ECDF for Good Customers (about 485–885) and a dashed red #AE3030 ECDF for Bad Customers (about 305–780), both stair-step functions from 0 to 1; a blue #4467A3 vertical K-S segment at about 593 from y≈0.08 to y≈0.81 with diamond caps; a faint blue band between the curves around the segment; a bold blue "D = 0.737,  p < 0.001" label on an elevated box at y≈0.44, clear of both curves.
      Legibility verdict: PASS

