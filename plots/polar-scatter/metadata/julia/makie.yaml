review:
  strengths:
  - Idiomatic, correctly-configured PolarAxis (N-up, clockwise, compass tick labels,
    unit-formatted radial ticks) that reads immediately as a wind rose
  - 'Theme-adaptive chrome is fully correct in both renders — identical data colors,
    correct #FAF8F1/#1A1A17 backgrounds, all text legible on both surfaces (pixel-verified)'
  - Realistic, well-scaled wind-observation dataset with a genuine directional cluster
    and per-period variation in spread/speed
  - Clean, reproducible, KISS-structured single-file script using the current (non-deprecated)
    Makie API
  weaknesses:
  - 'Confirmed by pixel scan of both PNGs: the dashed ''prevailing direction'' spoke
    (lines!) and its ''prevailing'' text! label never appear in plot-light.png or
    plot-dark.png — searching both images for the INK color used by that code returns
    zero pixels outside the title text. The 12-14 m/s outer ring exists only to host
    this invisible annotation. Either fix the rendering (verify point order / consider
    space=:data or space=:transformed on text!, confirm lines! isn''t being clipped
    by an implicit PolarAxis limit) or remove the dead code and tighten rlimits back
    to the data extent.'
  - Marker size (9px) is on the small side for a 3200x1800 canvas with only ~120 points;
    per the style guide's data-density heuristic, bumping to ~14px would improve visibility
    without hurting the alpha-blended overlap look.
  - Code comment claims rtickangle = pi/4 places radial labels 'near NE,' but they
    render along the N (top) axis in both PNGs — harmless here (no overlap with the
    SW cluster either way) but suggests the angle convention wasn't checked against
    the actual output.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "polar-scatter · julia · makie · anyplot.ai" in dark ink at top; 8 compass tick labels (N, NE, E, SE, S, SW, W, NW) around the rim; radial gridlines/labels (0/5/10/15 m/s) stacked near the top of the circle; borderless legend box to the right listing Morning/Afternoon/Evening/Night. All chrome text is dark-on-cream and clearly readable.
      Data: ~120 points colored by time-of-day (Morning = #009E73 brand green, Afternoon = lavender, Evening = blue, Night = ochre), clustered toward the SW/S sector with increasing spread through the day. A dashed "prevailing direction" spoke and "prevailing" text label are present in the source code but were confirmed (via a full pixel scan for the INK color) to be completely absent from the rendered PNG.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same layout as light render with all chrome flipped to light ink (title, compass labels, radial tick labels, legend text) against the dark background. No dark-on-dark failures found.
      Data: Confirmed identical to light render — same 4 category colors (#009E73, lavender, blue, ochre) at the same positions; only chrome flipped. The prevailing-direction annotation is likewise confirmed absent from this render (pixel scan for the dark-theme INK color found no matches outside the title text).
      Legibility verdict: PASS
