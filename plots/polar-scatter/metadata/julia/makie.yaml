review:
  strengths:
  - Idiomatic PolarAxis usage with correct compass orientation (theta_0 = -pi/2, direction
    = -1), matching real-world bearing convention (N at top, clockwise through NE/E/SE/S/SW/W/NW)
  - Custom rtickformat appends "m/s" units directly onto radial tick labels — self-explanatory
    speed axis
  - Theme-adaptive chrome correctly implemented; the four Imprint category colors
    are pixel-identical between light and dark renders, only chrome tokens flip
  - 'Correct Imprint palette usage: first categorical series (Morning) is exactly
    #009E73, remaining three follow canonical order'
  - Realistic, neutral wind dataset — plausible southwesterly prevailing direction
    with speed and angular spread both increasing across time-of-day categories
  - alpha=0.7 + stroke halo (strokecolor=PAGE_BG) on markers meaningfully improves
    point separation in the dense SW/S cluster versus the previous attempt
  weaknesses:
  - 'The mean-bearing "prevailing direction" indicator (dashed lines! spoke + text!
    label added this attempt to address prior DE-03 feedback) is completely invisible
    in BOTH renders — verified by cropping and zooming along the full length of the
    expected ray from origin to r=max_r*1.1 in both plot-light.png and plot-dark.png;
    no dashed segment and no "prevailing" text exists anywhere in the output. Likely
    cause: the mean bearing (~225°, i.e. the standard SW compass direction) coincides
    almost exactly with the PolarAxis''s own 45°-interval thetagrid spoke, and/or
    the lines!/text! calls are silently producing no visible marks — this is dead
    code that was intended to be this attempt''s headline improvement but delivers
    zero visual value.'
  - Radial axis is scaled 0–15+ m/s via `rticks = 0:5:15`, but the actual data only
    reaches roughly 7–8 m/s at its farthest points — over half the plot's radius (and
    therefore the large majority of its area, since area scales with r²) is empty
    dead space outside the data cluster, wasting canvas real estate and shrinking
    the effective size of the data region.
  - Dense overlap persists in the SW/S cluster where 3-4 categories' points pile on
    top of each other; alpha=0.7 helps but individual points are still hard to distinguish
    in the densest pockets.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-scatter · julia · makie · anyplot.ai" in dark ink, top-center, not clipped. Compass labels (N/NE/E/SE/S/SW/W/NW) ring the perimeter. Radial ticks "0 m/s" through "15 m/s" run up the N spoke. Legend (Morning/Afternoon/Evening/Night) sits at right on a slightly elevated swatch, frameless. All chrome text is clearly legible against the light background.
      Data: ~120 scatter points colored by time-of-day using the Imprint palette (Morning = #009E73 green, Afternoon = lavender, Evening = blue, Night = ochre), each with a thin PAGE_BG stroke halo. Points cluster from roughly NW through SW/S/SE, consistent with a southwesterly prevailing wind, and stay within a radius of ~7-8 m/s even though the axis extends to 15+ m/s, leaving a large empty outer ring. A "prevailing direction" dashed spoke + text label was intended (present in source as lines!/text! calls) but is NOT visible anywhere in the render after close inspection at multiple zoom levels along the expected ray.
      Legibility verdict: PASS (all text) / but the prevailing-indicator element itself is missing entirely — a content-completeness failure, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, compass labels, radial ticks, and legend now rendered in light ink — all legible, no dark-on-dark failures observed.
      Data: Point positions, sizes, and the four Imprint category colors are identical to the light render; only the stroke halo and chrome tokens flip to match the dark surface, as required. Same missing "prevailing" dashed line + text label as the light render — confirmed absent by the same close-crop inspection.
      Legibility verdict: PASS (all text) / same missing-element issue as light render.
