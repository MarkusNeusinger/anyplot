review:
  strengths:
  - 'Idiomatic PolarAxis usage with correct compass orientation (theta_0 = -pi/2,
    direction = -1) that matches real-world bearing convention: N at top, bearings
    increasing clockwise through NE/E/SE/S/SW/W/NW'
  - Custom rtickformat appends 'm/s' units directly onto the radial tick labels, making
    the speed axis self-explanatory without a separate axis title
  - Halo-stroke markers (strokewidth=1, strokecolor=PAGE_BG) cut a visible outline
    around each point, meaningfully improving separation in the dense, overlapping
    SW cluster
  - Theme-adaptive chrome is correctly implemented — identical Imprint data colors
    between light/dark renders, only background/ink/grid tokens flip
  - 'Realistic, neutral wind dataset: bearings cluster around a plausible SW prevailing
    direction (225°) with per-period spread and speed increasing across time-of-day
    categories'
  weaknesses:
  - Dense point overlap in the SW/S cluster reduces individual-point distinguishability
    despite the stroke halo — consider markersize ~10-11 or alpha ~0.7 in that density
    range
  - Design excellence is competent (compass ticks, unit-formatted radial ticks, halo
    markers) but stops short of a strong focal point — e.g. no subtle annotation/wedge
    calling out the prevailing SW direction to sharpen the data story
  - The '0 m/s' radial tick label sits close to the central Morning-category point
    cluster — minor crowding near the plot origin
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: title "polar-scatter · julia · makie · anyplot.ai" in dark ink at top-center, compass labels (N/NE/E/SE/S/SW/W/NW) around the perimeter in soft dark ink, radial ticks "0 m/s"/"5 m/s"/"10 m/s"/"15 m/s" along the N spoke in soft dark ink, legend (Morning/Afternoon/Evening/Night) at right with dark ink text on a slightly elevated off-white swatch, frameless. All chrome text is clearly legible against the light background.
      Data: ~120 scatter points colored by time-of-day category — Morning (brand green #009E73), Afternoon (lavender), Evening (blue), Night (ochre) — each with a thin light-colored stroke halo separating overlapping markers. Points cluster from NW through W/SW/S/SE, consistent with a southwesterly prevailing wind direction, with Night/Evening points reaching further out (higher speed) than Morning points.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: same title now rendered in light ink, compass labels and radial tick labels in soft light ink, grid lines faint but visible, legend text in light ink on a slightly elevated dark swatch. No dark-on-dark or unreadable elements observed.
      Data: identical marker positions, sizes, and colors to the light render (brand green, lavender, blue, ochre) — only the stroke halo color flips to match the dark background, confirming data colors are theme-invariant.
      Legibility verdict: PASS
