review:
  strengths:
  - Hand-built polar frame in plotnine's grammar (geom_path rings, geom_segment spokes,
    geom_text compass labels) with north-up clockwise convention
  - Theme tokens threaded through every chrome element; both renders readable with
    identical data colors
  - Translucent markers let the prevailing clusters read darker while single outliers
    stay visible
  weaknesses:
  - 'VQ-05 (both): canvas is 3600x3600 instead of the canonical 2400x2400 (+1200 x
    +1200 px) → 2400x2400. Likely cause: figure_size=(12, 12) saved at dpi=300; use
    figure_size=(6, 6), dpi=400.'
  - 'SC-04 (both): title ''polar-scatter · plotnine · anyplot.ai'' lacks the language
    segment → ''polar-scatter · python · plotnine · anyplot.ai''. Likely cause: labs(title=...)
    string.'
  - 'VQ-07 (both): the legend runs alphabetically, Afternoon (#C475FD) first and Morning
    (#009E73) last → natural time order with #009E73 as the first entry. Likely cause:
    scale_color_manual(values=colors) without limits.'
  - 'VQ-01 (both): speed ring labels and legend entries are small for the canvas,
    about 5 pt and 7 pt at the canonical 2400 px scale, below the 8 pt reference →
    8 pt equivalent. Likely cause: geom_text(size=10) and legend_text size=14 on a
    12-inch figure at 300 dpi.'
  - 'VQ-02 (both): the ''5'' and ''10'' speed labels on the NNE line are partly covered
    by NE-cluster markers → place the speed-label line in an empty sector (around
    135 deg, SE). Likely cause: label_angle = np.radians(90 - 22.5).'
  image_description: |-
