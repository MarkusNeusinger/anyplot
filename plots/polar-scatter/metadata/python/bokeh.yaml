review:
  strengths:
  - Square 2400×2400 canvas with the polar disc centered and generous padding; the
    radius axis starts at 0 and the 40 m/s rim reaches past the largest observation
    in both renders
  - Ring step computed from the data (1-2-5 nice-step rule) so gridlines stay regular
    for any table, with ring labels placed along the sparse SE spoke where they collide
    with no markers
  - 'Typographic hierarchy on the angular ticks: bold INK cardinal letters at 32 pt,
    softer INK_SOFT intercardinals at 26 pt'
  - Markers at alpha 0.7 with a page-colored 2 px outline keep the NE and SW clusters
    readable while single outliers stay visible
  - Theme tokens threaded through every text element, legend frame and grid line;
    Imprint positions 1-3 identical in both renders
  - Native HoverTool on the scatter renderers shows direction, speed and time of day
    in the HTML output, with brace-wrapped column names read straight from the tidy
    df
  weaknesses:
  - 'SC-03 (both): directions are placed counter-clockwise from east (theta=0° at
    E, 90° at N) while the axis is labelled with compass directions, so a wind direction
    of 90° is drawn at N instead of E → measure bearings clockwise from north (x =
    r·sin θ, y = r·cos θ) so each compass label stands for the degrees it names. Likely
    cause: df[''x''] = speed·cos(theta), df[''y''] = speed·sin(theta) together with
    the COMPASS map {0: ''E'', 90: ''N'', …}.'
  - 'VQ-03 (both): the legend glyphs are dots of about 8 px beside 30 px data markers,
    so the legend swatches read much smaller and fainter than the marks they explain
    → glyphs at about the marker size (+20 px). Likely cause: the scatter legend glyph
    is not sized to the renderer''s size=30; glyph_height/glyph_width=30 only reserve
    the cell.'
  - 'DE-02 (both): spokes are drawn every 30° while the angular labels sit every 45°,
    so NE, NW, SW and SE float between spokes with no gridline under them → align
    spokes with the labelled directions (every 45°). Likely cause: range(0, 360, 30)
    for the spokes vs the 45° COMPASS keys.'
  - 'Suggestion: the ring gridlines could use bokeh''s native circle/annulus glyph
    with a data-unit radius instead of a 200-point p.line per ring.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400×2400 canvas.
      Chrome: centered bold title "polar-scatter · python · bokeh · anyplot.ai" (~48 % width); bold dark N/E/S/W and softer NE/NW/SW/SE labels outside the rim; ring labels 5–40 in INK_SOFT along the SE spoke; "Wind speed (m/s)" centered below the disc; boxed legend "Time of day" top-left. Eight faint concentric rings (5–40) and 12 spokes every 30°. All text dark and readable.
      Data: 120 circles at 30 px, alpha 0.7 with page-colored outline — Morning #009E73 clustered NE, Afternoon #C475FD clustered SW with outliers to ~39, Evening #4467A3 scattered near the center. Legend glyphs are tiny dots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, cardinal letters near-white; intercardinals, ring labels, axis title and legend labels light grey; legend box on #242420. Rings and spokes subtle grey. A faint frame line is visible around the plot area. No dark-on-dark text.
      Data: same three Imprint colors and positions as the light render; outlines flip to the dark page color.
      Legibility verdict: PASS
