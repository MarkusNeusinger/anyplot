      Background: warm off-white #FAF8F1 (a ~30 px transparent margin rings the PNG, an export artifact that shows the page behind)
      Chrome: centered title 'polar-scatter · python · letsplot · anyplot.ai' in dark ink; compass labels N..NW and radius ticks 0-20 in INK_SOFT; 'Wind speed (m/s)' radius title on the left; thin grey rings every 2.5 m/s and spokes every 22.5 deg, lighter than the markers; legend 'Time of day' in an elevated box top right
      Data: 120 markers in #009E73 (Morning), #C475FD (Afternoon), #4467A3 (Evening) at alpha 0.75; clusters W/NW and NE, empty E/SE, outliers to 16 m/s at NW and NE
