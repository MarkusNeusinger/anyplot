review:
  strengths:
  - Clean polar scatter via coord_polar(start=0, direction=1) with compass labels
    from scale_x_continuous breaks/labels, clockwise from north as a wind rose reads
  - Radius axis starts at 0 and is sized from the data (max * 1.08), so every marker
    sits inside the rim
  - Imprint palette in canonical order with identical data colors and correctly flipped
    chrome in both themes
  - Legend placed in the empty top-right corner, letting the square polar panel use
    nearly the full canvas
  - Column constants and a replaceable data block keep the script adaptable; HTML
    export keeps lets-plot's native hover tooltips
  weaknesses:
  - 'DQ-03 (code): the comment ''Weibull-like speeds, stronger from the SW-W side''
    misstates the data: 1 + 0.4*sin(direction - 240 deg) peaks at 330 deg, and the
    render''s fastest winds (13-16 m/s) sit at NW → shift the phase to sin(direction
    - 150) so the peak lands at 240 deg, or correct the comment to NW. Likely cause:
    the sine phase offset of 240 instead of 150.'
  - 'Suggestion: legend text at 9 px sits just under the 10 px legend reference; 10
    px would match the legend title.'
  - 'Suggestion: the hour draw (lines 53-54) only feeds the three-way bucket; drawing
    the time-of-day category directly would be shorter.'
