review:
  strengths:
  - Meteorological compass orientation via set_theta_zero_location('N') and set_theta_direction(-1),
    with N/NE/... labels from set_thetagrids
  - Theme tokens thread through every chrome element, including the polar rim (spines['polar'])
    and the legend frame, so both renders read cleanly
  - Imprint positions 1-3 handed out per group by a groupby loop in the data's own
    order, identical in both themes
  - Translucent markers with a page-colored outline keep the dense center readable
    while single outliers stay visible
  - Square 2400x2400 canvas with fig.subplots_adjust instead of bbox_inches='tight'
  weaknesses:
  - 'Suggestion: the polar gridlines draw over the markers in the central cluster;
    ax.set_axisbelow(True) would keep them behind the data.'
  - 'Suggestion: most observations sit inside 15 m/s, so the 30 m/s rim leaves the
    outer ring empty; a rim nearer the maximum would give the dense center more room.'
