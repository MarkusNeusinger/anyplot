review:
  strengths:
  - Theme tokens threaded through Style; both renders theme-correct with identical
    Imprint data colors
  - Realistic, neutral wind scenario with three prevailing directions by time of day
  - Interactive HTML output keeps pygal's native hover tooltips
  weaknesses:
  - 'SC-01 (both): the plot is a Cartesian scatter of x/y wind components on a square
    grid, not a polar scatter → draw concentric radius rings and angular spokes with
    markers at their angle and radius. Likely cause: pygal.XY used with plain x/y
    axes and guides.'
  - 'SC-02, DQ-01 (both): no radial gridlines, no angular ticks and no degree or compass
    labels, so direction cannot be read (C2, C3) → rings at regular speed steps and
    spokes at 0°, 90°, 180°, 270° or every 45°, labeled in degrees. Likely cause:
    show_x_guides/show_y_guides square grid only.'
  - 'VQ-01 (both): title 28 px, tick labels 18 px and legend 16 px on a 4800x2700
    canvas read small → style-guide sizes for the canvas (about +2x). Likely cause:
    Style font sizes not scaled to the canvas.'
  - 'VQ-03, VQ-05 (both): 8 px dots and a 16 px legend crammed into the top-left corner
    read small on the 4800 px canvas → larger markers and a legend placed with breathing
    room. Likely cause: dots_size=8, default legend position.'
  - 'VQ-06 (both): axis titles ''X Component (m/s)'' / ''Y Component (m/s)'' describe
    derived components, not wind direction and speed → label the radius quantity and
    the angle. Likely cause: x_title/y_title.'
  - 'SC-04 (both): title ''polar-scatter · pygal · anyplot.ai'' lacks the language
    segment → ''polar-scatter · python · pygal · anyplot.ai''. Likely cause: the title
    string.'
  - 'CQ-01, CQ-04 (code): lines 15-27 guard the pygal import with importlib and sys.path
    surgery → a plain import pygal. Likely cause: a filename-shadowing workaround
    left in the script.'
  - 'Suggestion: use the compass convention (0° at the top, clockwise) for wind direction.'
