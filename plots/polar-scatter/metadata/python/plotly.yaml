review:
  strengths:
  - Square 2400x2400 canvas with the polar area centered and filling it, legend placed
    below the chart
  - Compass orientation through plotly's polar angularaxis direction='clockwise' and
    rotation=90, labeled N (0°), NE, E (90°) ... instead of radians
  - Radius axis from 0 to 1.1 x the maximum so every marker lies inside the rim
  - Translucent markers (opacity 0.75) with a page-colored outline keep the NW and
    SE clusters readable while single markers stay visible
  - Theme tokens threaded through title, ticks, grid, axis lines and legend box; both
    renders fully legible
  - 'Imprint palette with #009E73 first, colors looked up by group position from the
    full eight-hue list'
  - 'Adaptable structure: column constants with roles and one Data block binding df'
  weaknesses:
  - 'VQ-02 (both): the radial axis title ''Wind speed (m/s)'' runs across the radial
    tick labels 10 and 15 (and grazes 20), so the numbers sit under the title text
    → the title clear of every tick label by at least a few px. Likely cause: radialaxis.title
    drawn along the axis at angle=22.5, where plotly centers it over the tick labels;
    a shorter title, ticksuffix units or a tick-free stretch for the title fixes it.'
  - 'Suggestion: the legend lists Evening, Morning, Afternoon (order of first appearance);
    listing the periods in their daily order would read more naturally.'
  - 'Suggestion: the legend title ''Time of day'' sits higher than the item labels
    in the horizontal legend; aligning it with them would tidy the box.'
