review:
  strengths:
  - Theme tokens applied throughout; both renders readable
  - 'Imprint colours with #009E73 first and correct page backgrounds'
  - Typed tooltips and .interactive() zoom/pan in the HTML output
  - Wind scenario with two prevailing directions and scattered evening winds
  weaknesses:
  - 'VQ-05 (both): the saved PNG is 5262x4929, neither 3200x1800 nor 2400x2400, and
    the legend is jammed into the top-right corner → 2400x2400 (−2862 × −2529 px).
    Likely cause: .properties(width=1600, height=1600) with scale_factor=3.0 and no
    pad-to-target step.'
  - 'SC-03 (both): wind directions are drawn counter-clockwise from east while the
    labels name compass bearings, so 315° (north-westerly) winds sit under ''SE (315°)''
    and the ''N'' label reads 90° → 0° at north, increasing clockwise. Likely cause:
    x = r·cos(θ), y = r·sin(θ) and the direction_names dict.'
  - 'SC-04 (both): title ''polar-scatter · altair · anyplot.ai'' lacks the language
    segment → ''polar-scatter · python · altair · anyplot.ai''. Likely cause: the
    alt.Title string.'
  - 'VQ-03 (light): rings and spokes at opacity 0.10 nearly vanish on #FAF8F1, so
    the radial gridlines the Notes ask for barely read → about 0.2 (+0.1). Likely
    cause: mark_line(opacity=0.10).'
  - 'CQ-01 (code): no # Data / # Plot zones, no column constants for theta / radius
    / category, and IMPRINT lists 3 of 8 positions → column constants above one Data
    block that binds df, and the full eight-colour list. Likely cause: data generation,
    Cartesian conversion and plotting interleaved.'
  - 'Suggestion: a subtle emphasis on the two prevailing sectors could guide the eye.'
