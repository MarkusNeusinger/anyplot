      Data: Four color-coded angular clusters — Morning (#009E73 green), Afternoon (#C475FD lavender), Evening (#4467A3 blue), Night (#BD8233 ochre) — hollow-stroke circular markers with fill, positioned by wind direction (angle) and speed (radius). First series is the brand green as required.
