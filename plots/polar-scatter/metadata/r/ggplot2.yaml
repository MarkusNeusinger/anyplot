review:
  strengths:
  - Correct compass-convention angular mapping (0°N, 90°E, 180°S, 270°W with clockwise
    direction=1) matching real-world wind-rose conventions
  - Radial axis correctly starts at 0 and auto-scales to 1.15x the max wind speed
    to accommodate all points with padding
  - Realistic, neutral wind-observation dataset with per-time-of-day prevailing direction
    and speed distributions that create a clear visual clustering story
  - Imprint palette applied in canonical order with the brand green as the first series,
    and identical data colors across light/dark themes
  - Explicit theme-adaptive chrome tokens (PAGE_BG, INK, INK_SOFT) correctly threaded
    through panel background, grid, axis text, and legend in both renders
  - Hollow-with-fill marker style (shape=21, PAGE_BG stroke) helps separate overlapping
    points within each category cluster
  weaknesses:
  - library(dplyr) is imported but never used anywhere in the script (only tibble::tibble,
    rnorm, rep, factor, pmax, and scales::alpha are called) — remove the unused import.
  - The radial tick label '0' and the angular tick label '270° W' sit immediately
    adjacent at the panel's left-center, reading almost like one run-on label ('0
    270° W') — add breathing room, e.g. via axis.text.y margin or panel.spacing, so
    the two are visually separated.
  - Within-cluster marker overlap is still fairly heavy for the Morning/Evening groups
    near their angular center of mass — a touch more alpha reduction or a slightly
    smaller point size would improve individual-point readability without losing the
    cluster shape.
  - Design Excellence is at a solid-default level (theme_minimal + palette fills)
    rather than a distinctive polish pass — consider a subtitle noting the prevailing-direction
    pattern, or radial axis styling that ties the tick labels visually to the grid
    circles they label.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "Wind Observations · polar-scatter · r · ggplot2 · anyplot.ai" at top, dark radial-axis title "Wind Speed (m/s)" on the left, soft-gray radial tick labels (0/5/10/15/20/25) and angular compass labels (0° N, 90° E, 180° S, 270° W), light legend box "Time of Day" on the right with four swatches (Morning/Afternoon/Evening/Night). All chrome text is clearly readable against the light background.
      Data: Four color clusters — green (Morning, upper-right/top), lavender (Afternoon, lower-left), blue (Evening, lower-right/bottom), ochre (Night, center-left) — each forming a distinct angular "petal" reflecting a different prevailing wind direction and speed range. First series (Morning) correctly uses #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, radial/angular tick labels, and legend, all recolored to light text (title/axis title near-white, tick/legend text light gray) — clearly readable against the dark background. Legend box uses the darker elevated fill with light text, no dark-on-dark elements observed.
      Data: Same four clusters in the same positions with identical hex values to the light render (green/lavender/blue/ochre) — only the chrome flipped, confirming palette and category identity are preserved across themes.
      Legibility verdict: PASS
