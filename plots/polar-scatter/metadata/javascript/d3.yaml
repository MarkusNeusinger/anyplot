review:
  strengths:
  - 'Every attempt-1 weakness was addressed concretely: per-category angle/speed spreads
    were widened and a deterministic ''every 10th observation is an outlier gust''
    mechanism (1.7x spread multiplier) now gives each time-of-day cluster genuine
    natural variance instead of a tight uniform blob'
  - Marker radius now scales with speed via a clamped linear scale, and outlier gusts
    render slightly larger, more opaque, with a heavier stroke — a real density/emphasis-aware
    hierarchy instead of uniform dots
  - Radial gridlines, angular spokes/compass labels, and the legend were fully rebuilt
    from manual for-loops into idiomatic `selection.data(...).join(...)` D3 patterns,
    matching the main scatter marks
  - 'Correct polar geometry: radians used internally for the theta->(x,y) transform
    while degrees/compass letters (N/NE/E/SE/S/SW/W/NW) are shown for readability,
    exactly per the spec''s Notes'
  - Radial tick labels were relocated from the north spoke to a clear ESE sector specifically
    chosen to avoid colliding with any data cluster — a thoughtful, unprompted layout
    fix
  - Subtle alternating radial bands add a tasteful depth cue without competing with
    the data
  - 'Categorical color mapping uses the Imprint palette in canonical order (first
    series #009E73), pixel-identical between light and dark renders; both themes are
    fully legible with correct #FAF8F1 / #1A1A17 backgrounds'
  - Deterministic, seeded LCG data generation; clean KISS structure with no classes
  weaknesses:
  - domainMax is now rounded to the nearest even number (ceil(maxSpeed/2)*2) instead
    of a multiple of 4, so the quarter-tick radii (domainMax/4, domainMax/2, 3*domainMax/4)
    land on values like 4.5/13.5 m/s that format(.0f) rounds to slightly odd-looking
    labels ('5 m/s', '9 m/s', '14 m/s', '18 m/s' — uneven 4/5/4 spacing) instead of
    clean round numbers; rounding domainMax up to a multiple of 4 would give evenly-spaced,
    cleaner tick labels
  - Even with the new outlier gusts, the bulk of each cluster still sits within roughly
    the inner 60% of the radial domain, so the outer ring still reads a little empty
    outside of the handful of outlier points
  - Design refinement is still additive rather than transformative — no annotation
    or callout marks the outlier gusts as distinct from the main cluster beyond size/opacity,
    so a first-glance viewer may not immediately register them as anomalies
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Title "polar-scatter · javascript · d3 · anyplot.ai" and subtitle in dark ink at top, fully visible, not clipped. Bold compass labels (N/NE/E/SE/S/SW/W/NW) ring the outer domain circle. Softer-gray "m/s" radial tick labels (5/9/14/18) run along a clear ESE sector chosen to avoid data clusters. Bottom legend (Morning/Afternoon/Evening/Night with color swatches) sits comfortably above the canvas edge. Subtle alternating radial bands give a soft depth cue.
      Data: Four color-coded clusters at distinct compass bearings — green (morning, #009E73) near ENE, magenta (afternoon) near SSW, blue (evening) near WSW, ochre/amber (night) near N/NNW. Each cluster now shows clear internal spread with a few larger, more opaque "outlier gust" markers pushing further out along the radius. Marker size scales with speed.
      Legibility verdict: PASS — all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title, subtitle, compass labels, radial ticks, and legend re-rendered in light ink/gray tones. Grid circles, spokes, radial bands, and the outer domain circle remain subtle but visible against the dark surface.
      Data: The four cluster colors are pixel-identical to the light render — only chrome (text, grid, spokes, radial bands) flipped for the dark theme. Outlier markers are equally distinguishable (larger, higher opacity) in this theme.
      Legibility verdict: PASS — no dark-on-dark failures; every title, tick, compass, and legend label reads clearly against the near-black surface.

    Both renders pass the theme-readability check; data colors confirmed identical between themes.
