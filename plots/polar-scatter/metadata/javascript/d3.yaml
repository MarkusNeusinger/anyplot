review:
  strengths:
  - 'Correct polar-scatter geometry: uses radians internally for the theta→(x,y) transform
    (toXY) while displaying degrees/compass labels, exactly as the spec''s Notes section
    requests.'
  - Compass-direction angular ticks (N/NE/E/SE/S/SW/W/NW at 45° spacing) are a domain-appropriate
    alternative to raw degree labels for wind data.
  - Categorical color mapping uses the Imprint palette in canonical order (morning=#009E73,
    afternoon=#C475FD, evening=#4467A3, night=#BD8233), identical across light and
    dark renders.
  - Clean KISS structure with a deterministic seeded LCG (seed=42) for reproducible
    data generation.
  - 'Correct D3 idiom for the core marks: selection.data(data).join(''circle'') data-join
    pattern for the scatter points.'
  - Radial axis correctly starts at 0 and domain is computed from the actual data
    max (ceil to nearest 5), with radial gridlines and unit-labeled ticks ("5 m/s",
    "10 m/s", ...).
  weaknesses:
  - Each time-of-day cluster is a fairly tight, uniform blob (angleSpread 25-40°,
    speedSpread 2-4) — the data lacks the natural variance/outliers real wind observations
    show, so DQ-01 feature coverage suffers; widen spread or add a few genuine outliers
    per category.
  - Most points sit well inside half of the radial domain (0-20 m/s) even though the
    outer half of the polar plot is fully rendered — the chart reads a bit sparse;
    either let the data reach closer to the domain max or size domainMax tighter to
    the actual observed max.
  - Radial gridlines, angular spokes/compass labels, and the legend are built with
    plain for-loops and repeated .append() calls instead of D3's data-join pattern
    (selection.data(...).join(...)) — using joins for these repeated elements would
    be more idiomatic D3 (LM-01).
  - 'Design is solid but not yet publication-grade: markers are uniform circles with
    a single opacity/size regardless of local density, and there is no additional
    visual refinement (e.g. per-cluster density cues) to lift Design Excellence beyond
    a good-default look.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-scatter · javascript · d3 · anyplot.ai" and subtitle in dark ink at the top, both fully visible and not clipped. Compass labels (N/NE/E/SE/S/SW/W/NW) in bold dark text around the outer circle, radial "m/s" tick labels in softer gray along the north spoke, and a bottom legend (Morning/Afternoon/Evening/Night) with color swatches — all clearly legible against the light background.
      Data: Four color-coded clusters of circular markers (fill-opacity 0.75, thin light-colored stroke) — green (morning) near ENE, lavender (afternoon) near SSW, blue (evening) near WSW, and ochre/tan (night) near N/NNW. First series (morning) is #009E73 as required.
      Legibility verdict: PASS — all text is clearly readable, no dark-on-light or light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle, compass labels, radial tick labels, and legend, all re-rendered in light ink/gray tones against the dark background. Grid circles, spokes, and outer domain circle are subtle but visible.
      Data: The four cluster colors (green, lavender, blue, ochre) are pixel-identical to the light render — only the chrome (text, grid, spokes) flipped to light-on-dark.
      Legibility verdict: PASS — no dark-on-dark failures; all title, tick, compass, and legend text is clearly visible against the near-black surface.
