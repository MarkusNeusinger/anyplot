review:
  strengths:
  - Radial scale labels are now clean, evenly-spaced round numbers (6/12/18/24 m/s)
    — the attempt-1 weakness of non-round quarter-step labels is fixed by rounding
    MAX_RADIUS up to a multiple of 4.
  - Overlapping markers within the two dense wind clusters now use 0.85-alpha fills
    with a thin pageBg-colored stroke, meaningfully improving per-point separability
    versus attempt 1 while keeping the color/shape category encoding intact.
  - Correctly implements polar scatter via manual Cartesian projection since highcharts-more/PolarComposition
    is not in the vendored core bundle — the header comment documents the reasoning
    clearly, and real data-bound scatter points preserve hover/tooltip in the interactive
    HTML.
  - Ring value labels are anchored at a fixed 145° angle (SE sector), a spot the two
    wind clusters never occupy at any radius, so scale labels never collide with data.
  - Marker shape AND color both encode the time-of-day category — a redundant, CVD-friendly
    encoding.
  - Data colors are pixel-identical between light/dark renders; every chrome element
    (rings, spokes, labels, tooltip) is threaded through theme tokens correctly.
  - Realistic bimodal wind data (light north-easterly breeze vs. stronger south-westerly
    wind) creates a clear, readable visual story.
  - Deterministic seeded LCG RNG makes the dataset fully reproducible.
  weaknesses:
  - Within the densest core of the SW wind cluster, many markers still overlap heavily
    enough that individual points blur into a mass — the 0.85 alpha and thin stroke
    help at the edges but don't fully resolve the innermost overlap; consider dropping
    fill-opacity a bit further (~0.7) or reducing marker radius slightly in the densest
    regions.
  - Design excellence is solid but still fairly restrained — thin gray rings/spokes
    and a very subtle radial glow, no additional shading, emphasis ring, or bolder
    treatment on the outermost boundary to lift the aesthetic further.
  - 'Data storytelling: two wind-direction clusters compete for attention rather than
    one being visually emphasized as primary — a subtle size, opacity, or annotation
    cue distinguishing the dominant SW regime from the secondary NE regime could sharpen
    the narrative.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-scatter · javascript · highcharts · anyplot.ai" and subtitle "Wind bearing and speed from 130 station observations" in dark ink, clearly legible. Compass labels (N/NE/E/SE/S/SW/W/NW), radial spokes, and radial rings with clean round-number value labels (6 m/s, 12 m/s, 18 m/s, 24 m/s placed in the empty SE sector) all render in subtle dark gray. Legend at the bottom (Morning/Afternoon/Evening/Night) is legible with matching colored, shaped swatches (circle/diamond/square/triangle).
      Data: Two clusters — a lighter, sparser NE cluster (weaker breeze) and a denser, stronger SW cluster. First series (Morning) uses the mandated brand green #009E73 circles; Afternoon is lavender diamonds, Evening is blue squares, Night is ochre triangles — matches Imprint canonical order. Markers use ~0.85 alpha fill with a thin light-colored stroke, which helps distinguish overlapping points inside the dense clusters, though the innermost core of the SW cluster still shows heavy overlap.
      Legibility verdict: PASS — all text is readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, compass labels, radial spokes/rings, and ring value labels all flip to light gray / off-white and remain clearly legible. No dark-on-dark issues found on any text element.
      Data: Cluster layout, marker shapes, and marker colors are pixel-identical to the light render — only chrome (background, text, grid) flipped, confirming the Imprint palette data-color rule is honored.
      Legibility verdict: PASS — all text is readable against the dark background, no dark-on-dark failures.

    Both renders pass the theme-readability check (5c) and no AR-09 edge-clipping is present on title, compass labels, ring labels, or legend in either render.
