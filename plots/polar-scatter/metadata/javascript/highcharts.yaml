review:
  strengths:
  - Correctly implements polar scatter with a manual Cartesian projection because
    highcharts-more/PolarComposition is not in the vendored core bundle — the header
    comment documents the reasoning clearly.
  - Ring value labels are placed at a fixed 145° angle (SE sector), a spot the two
    wind clusters never occupy, so scale labels never collide with data.
  - Marker shape AND color both encode the time-of-day category — a redundant, CVD-friendly
    encoding.
  - Compass labels (N/NE/E/SE/S/SW/W/NW) with radial spokes stand in cleanly for the
    missing native polar axis.
  - Data colors are pixel-identical between light/dark renders; theme tokens are threaded
    through every chrome element (grid, ticks, tooltip, legend).
  - Realistic bimodal wind data (light north-easterly breeze vs. strong south-westerly
    wind) creates a clear, readable visual story.
  - Deterministic seeded LCG RNG makes the dataset fully reproducible.
  weaknesses:
  - Ring value labels come out as non-round numbers (6, 13, 19, 25 m/s) because MAX_RADIUS/4
    fractions get rounded independently — pick a MAX_RADIUS that divides evenly (e.g.
    round up to the nearest multiple of 20) or label with one decimal so the scale
    reads as clean, evenly-spaced values.
  - Within the core of each prevailing-wind cluster, markers overlap heavily and individual
    points become hard to distinguish — a slight opacity reduction (~0.85) or a subtle
    white/pageBg marker outline would improve separability without losing the color/shape
    category encoding.
  - Design excellence is solid but still fairly restrained (thin gray rings/spokes,
    no shading or emphasis) — a subtle radial background tint or slightly bolder ring/spoke
    treatment on the outermost ring could push the aesthetic further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-scatter · javascript · highcharts · anyplot.ai" and subtitle in dark ink, clearly legible. Compass labels (N/NE/E/SE/S/SW/W/NW) in dark gray, radial spokes and rings in a subtle light-gray stroke, ring value labels (6/13/19/25 m/s) in muted gray placed in the empty SE sector. Legend at the bottom (Morning/Afternoon/Evening/Night) in dark-gray text with matching colored/shaped swatches.
      Data: Two dense point clusters — one centered around the NE sector (light breeze, small radius) and one larger cluster around the SW sector (strong wind, larger radius). First series (Morning) uses the mandated brand green #009E73 circles; Afternoon is purple diamonds, Evening is blue squares, Night is amber/brown triangles.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle rendered in light/off-white ink, clearly legible. Compass labels, spokes, rings, and ring labels rendered in light gray, easily visible against the dark background. Legend text is light gray with the same colored/shaped swatches.
      Data: Identical cluster layout and marker colors/shapes to the light render — green circles, purple diamonds, blue squares, amber triangles — confirming data colors did not shift with theme, only chrome flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
