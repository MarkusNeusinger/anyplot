review:
  strengths:
  - 'Polar layout built on MUI X''s own composition API: a ScatterPlot inside ChartsSurface
    with a custom SVG grid drawn from useXScale/useYScale, so native tooltips and
    the HTML legend still work'
  - Angular ticks every 45° in degrees with bold cardinals, 0° at top clockwise, and
    a subtitle that states the convention and units
  - Radius axis computed from the data to a nice 5 m/s step, starting at 0 and closing
    past the 19 m/s maximum so every marker sits inside the rim
  - Fill opacity 0.72 lets the dense Night cluster read darker while single outliers
    stay visible
  - Imprint palette in canonical order with identical data colors across themes; all
    chrome uses theme tokens and reads cleanly in both renders
  - 'Deterministic LCG data tells a clear diurnal story: the prevailing wind rotates
    N → E → S → W through the day and calms at night'
  weaknesses:
  - 'VQ-02 (both): the opaque page-colored pills behind the ''5 m/s'' and ''10 m/s''
    ring labels sit on top of the scatter layer and hide parts of two Morning markers
    near bearing 337° (about half of the marker at ~5.5 m/s and an edge of the one
    at ~10 m/s) → no marker covered by a ring label. Likely cause: <RingLabels />
    rendered after <ScatterPlot /> with fill={t.pageBg}, and the ''emptiest sector''
    bearing (337.5°) still holds Morning points; draw the labels below the markers
    or drop the opaque pill.'
  - 'Suggestion: placing the ring labels on a bearing chosen by distance to the nearest
    marker rather than by sector count would keep them clear without a pill.'
  - 'Suggestion: a slightly larger angular label size (16 px) would hold up better
    in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold dark title "polar-scatter · javascript · muix · anyplot.ai" at top, grey subtitle "Angle: Wind Bearing (°), clockwise from 0° at top · Radius: Wind Speed (m/s)". Four concentric rings (5/10/15/20 m/s, outer rim slightly heavier) and eight spokes in subtle grey; angular labels 0°–315° every 45° outside the rim, cardinals bold; ring labels on page-colored pills along the ~337° bearing. Legend at the bottom: Morning, Afternoon, Evening, Night. All text readable dark-on-light.
      Data: 120 translucent circles — Morning green #009E73 clustered N–NE at 5–10 m/s, Afternoon purple spread E–SE at 8–19 m/s, Evening blue S–SW at 5–15 m/s, Night ochre tightly clustered W–NW at 2–6 m/s. All inside the 20 m/s rim. The 5 m/s and 10 m/s pills cover parts of two Morning markers.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle, angular and ring labels in light grey; rings and spokes subtle dark grey, still visible; ring-label pills in the dark page color. Legend text light. No dark-on-dark text.
      Data: same four hues as the light render (green first), same positions; translucency blends toward the dark page, so markers read slightly deeper but remain clearly distinguishable, brand green clearly visible. The same two Morning markers are partly covered by the ring-label pills.
      Legibility verdict: PASS
