review:
  strengths:
  - 'Community @mui/x-charts has no native polar chart, and the author solved this
    cleanly: a custom SVG polar-grid overlay (rings + spokes + degree/speed labels)
    built with useXScale/useYScale so it stays perfectly aligned with the underlying
    linear scatter at any canvas size — a genuinely MUI X-specific technique, not
    a generic workaround.'
  - Imprint palette applied correctly in canonical order (green/lavender/blue/ochre
    for Morning/Afternoon/Evening/Night), identical data colors between light and
    dark renders, theme-adaptive chrome (grid, ink, ink-soft) via window.ANYPLOT_TOKENS.
  - Title format, legend, radial gridlines with units (m/s), and angular tick marks
    (0/45/.../315°) all match the specification's explicit requirements.
  - Deterministic, reproducible data via a seeded LCG (no network fetch, self-contained
    per the harness contract).
  - skipAnimation set on ChartContainer, correct default-export component contract,
    clean imports (all four imports used).
  weaknesses:
  - The 'Night' group (bearing 190±22.5°, speed 4±2 m/s) renders as a single solid
    blob near the center in both themes — 30 markers stacked with no alpha/opacity
    reduction make individual points indistinguishable. markerSize=8 with full opacity
    is too dense for a cluster this tight; add fillOpacity around 0.6-0.7 (or shrink
    markerSize for the low-radius groups) so overlapping points stay distinguishable
    per the data-density heuristic.
  - All four groups (bearings 190/200/230/255° with spreads 45-70°) sit inside a single
    ~150° arc (roughly WSW through SSE), so over half the polar grid (0°-180° arc,
    i.e. N through E to S) has zero data points in either render. A polar-scatter's
    core value is demonstrating full angular coverage; widen at least one group's
    bearing/spread so the compass rose reads as a rose rather than a wedge, or add
    a few scattered outlier readings across the empty arc to reflect that real wind
    observations are rarely 100% confined to one direction.
  - Because all data sits in one quadrant, the polar grid apparatus (rings/spokes)
    fills the canvas well but the actual data occupies a visibly lopsided fraction
    of it, leaving the opposite half of the circle as pure whitespace — reinforces
    the angular-coverage weakness above rather than reading as an intentional design
    choice.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "polar-scatter · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. Angular tick labels (0°, 45°, 90°, ... 315°) placed around the circle perimeter in soft gray, all legible. Radial ring labels (5/10/15/20 m/s) stacked along the upper vertical spoke, small but legible. Legend at bottom with four circular color swatches + labels (Morning, Afternoon, Evening, Night), all readable. Grid rings and spokes are thin, subtle, light-gray lines that don't compete with the data.
      Data: Four color-coded clusters (green=Morning, lavender=Afternoon, blue=Evening, ochre/brown=Night) all located in the lower-left quadrant of the polar grid (roughly bearings 170°-290°), radii ranging from near-center out to ~18 m/s. The Night (ochre) cluster is a dense, mostly solid blob near mid-radius with heavy marker overlap; the other three groups are looser and their individual points stay distinguishable. Legibility verdict: PASS — all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, angular/radial labels, and legend as the light render, now rendered in light ink/gray tones against the dark background — all clearly legible, no dark-on-dark text anywhere.
      Data: Same four clusters in the same screen positions with identical colors (green/lavender/blue/ochre) as the light render — confirmed only chrome (background, text, grid) flipped between themes, data colors are unchanged. The Night cluster shows the same dense-overlap blob issue as in the light render.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark or light-on-light failures observed.
