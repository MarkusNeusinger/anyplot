review:
  strengths:
  - Builds a genuine polar scatter on top of the community-only @mui/x-charts by drawing
    a custom SVG grid (rings + spokes + labels) via useXScale/useYScale, so the overlay
    stays perfectly aligned with the underlying linear scatter scale at any canvas
    size — a clean way to work within the community-surface constraint instead of
    reaching for Pro/Premium or another library.
  - 'Deterministic, realistic wind-observation dataset (LCG-seeded) with a clear diurnal
    wind-rotation narrative: Morning/Afternoon/Evening/Night bearings are spaced ~90°
    apart, so the four categories visibly occupy distinct compass sectors.'
  - 'Palette compliance is correct: first category (Morning) uses brand green, data
    colors are identical between light and dark renders, and only chrome (background,
    grid, text) flips per theme.'
  - Marker size and alpha (0.7) are tuned per group to keep overlapping points distinguishable;
    ChartsTooltip is wired for per-item detail in the interactive HTML output.
  - 'Clean, idiomatic code: skipAnimation set, sizes from window.ANYPLOT_SIZE, no
    unused imports, no fake interactivity.'
  weaknesses:
  - The '5 m/s' ring label sits directly against/behind a Morning-category marker
    in both renders (visible at the inner ring along the 0° spoke) — move ring labels
    to an unoccupied angular gap (e.g. between two spoke lines away from the densest
    cluster) or give them a small background pill for contrast.
  - The Night (amber) cluster near the center is dense enough that several markers
    fully overlap even at alpha=0.7 — consider a slightly smaller markerSize for that
    group or a touch more jitter/spread so individual observations stay distinguishable.
  - Design excellence is solid but stops at functional refinement — no radial fade,
    no emphasis/callout on one category, no secondary visual hierarchy beyond color
    and position, which caps this a notch below top-tier polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "polar-scatter · javascript · muix · anyplot.ai" is dark ink, centered, fully legible. Radial ring labels (5/10/15/20 m/s) and angular spoke labels (0°, 45°, 90° ... 315°) are dark-gray and legible against the light background. Grid rings and spokes are thin, subtle gray lines — visible but not dominant. Bottom legend (Morning/Afternoon/Evening/Night) is clear with matching color swatches.
      Data: Four color groups — Morning (brand green #009E73), Afternoon (light purple), Evening (indigo/blue), Night (amber) — each occupying a distinct ~90°-wide compass sector, consistent with a diurnal wind-rotation story. First categorical series correctly uses the brand green.
      Legibility verdict: PASS, with one minor caveat — the "5 m/s" ring label sits directly against/behind a nearby Morning marker, a small text/marker overlap (not a legibility failure, all letters remain visible).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title, ring labels, and spoke labels flip to light gray/white text, fully legible against the dark background — no dark-on-dark text anywhere. Grid lines remain subtle but visible. Legend text is light and readable.
      Data: Same four colors as the light render, confirming data colors are identical between themes and only chrome flips.
      Legibility verdict: PASS, same minor "5 m/s" label/marker overlap as in the light render — no dark-on-dark or light-on-light issues.
