review:
  strengths:
  - 'A true polar layout composed in community MUI X: ChartsContainer with hidden
    linear axes, and a custom <PolarGrid /> layer that reads useXScale/useYScale so
    rings, spokes and labels share the scatter''s coordinate system exactly.'
  - Radius axis starts at 0 at the center, with nice 5 m/s rings computed from the
    data up to 20 m/s; every marker sits inside the rim at its own bearing and speed
    (sin/cos conversion from degrees via radians, as the Notes ask).
  - Ring labels carry the unit ("10 m/s") and are placed in the computed least-populated
    45° sector, and the cardinal angles 0/90/180/270 are set in bold above the 45°
    ticks, giving a clear tick hierarchy.
  - 'Four time-of-day groups use the Imprint palette in canonical order (#009E73,
    #C475FD, #4467A3, #BD8233) with 0.72 fill opacity, identical in both themes; the
    data shows a plausible clockwise diurnal rotation of the prevailing wind.'
  - Native MUI X scatter interactivity (hover tooltips and highlighting) carries over
    to the HTML export, and skipAnimation is set.
  weaknesses:
  - 'VQ-02 (both): the "5 m/s" ring label sits under the Morning markers near bearing
    337°: several green dots are drawn over the text, so the label is half covered
    → the ring labels must stay readable on top of every data mark. Likely cause:
    <PolarGrid /> (which draws the label pills) is rendered before <ScatterPlot />
    in ChartsContainer, so the scatter paints over it; render the ring-label group
    after <ScatterPlot />.'
  - 'VQ-05 (both): the polar disc fills only about 66 % of the 2400 px canvas width,
    with an empty band of about 230 px between the title and the 0° label and wide
    side margins → the disc should reach about 80 % of the width (about +14 %). Likely
    cause: DOMAIN_PAD_FACTOR = 1.26 combined with CHART_MARGIN of 36 px and a 70 px
    title band; padding the domain only to fit the angular labels (about 1.15) would
    fix it.'
  - 'VQ-06 (both): the angular axis shows only degree values, so nothing says the
    angle is the wind bearing (direction the wind comes from) → name it once, e.g.
    a ''Wind bearing (°)'' caption or compass letters N/E/S/W next to 0°/90°/180°/270°.
    Likely cause: the BEARING column label is never rendered.'
  - 'CQ-04 (code): lines 115–120 parse each palette hex into r/g/b by hand to build
    an rgba() string, and lines 268–291 build the legend as hand-written HTML → set
    the opacity with sx={{ ''& .MuiScatterChart-marker'': { fillOpacity: 0.72 } }}
    and use the series'' palette color, and render <ChartsLegend /> inside the composition.
    Likely cause: hand-rolled replacements for the native styling and legend APIs.'
  - 'Suggestion: a thin page-colored outline on the markers would separate the stacked
    Night dots more clearly than translucency alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "polar-scatter · javascript · muix · anyplot.ai" at the top; four concentric rings (5/10/15/20 m/s) and eight spokes in subtle grey; degree labels 0°-315° every 45° outside the rim (0/90/180/270 bold); ring labels "5 m/s"…"20 m/s" on pills along the ~337° bearing; HTML legend at the bottom (Morning, Afternoon, Evening, Night). All text dark and readable; the "5 m/s" label is partly covered by green Morning markers.
      Data: 120 translucent circles: Morning #009E73 around 0-60° at 3-10 m/s, Afternoon lavender #C475FD around 60-150° at 7-20 m/s, Evening blue #4467A3 around 155-235°, Night ochre #BD8233 as a tight cluster near 285° at 2-6 m/s. First series is brand green. Disc fills about two thirds of the canvas width, leaving wide empty margins.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, degree and ring labels in light grey, grid rings and spokes in subtle dark grey, legend text light; no dark-on-dark text. The ring-label pills switch to the dark page color, and the "5 m/s" label is again partly covered by Morning markers.
      Data: identical positions and identical palette hues (#009E73, #C475FD, #4467A3, #BD8233) as the light render; only chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
