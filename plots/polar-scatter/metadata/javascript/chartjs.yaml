review:
  strengths:
  - Correctly builds a true continuous polar scatter via a hidden linear x/y scale
    plus custom Chart.js plugin hooks (beforeDraw/afterDraw) — no external library,
    no fake chart type.
  - 'Directly addresses every attempt-1 weakness: radial ring stroke weight/opacity
    now grows with distance, a ''Wind speed (m/s)'' radial-axis caption anchors the
    tick labels, an explicit subtitle (''Prevailing wind direction rotates clockwise
    through the day'') surfaces the directional-shift insight, and the Afternoon period
    is now bimodal (two prevailing directions/spreads) demonstrating a wider range
    of the plot type.'
  - 'Imprint palette applied correctly and identically across both themes: Morning
    = #009E73 (palette[0]), Afternoon = palette[1], Evening = palette[2].'
  - Both renders are fully theme-correct chrome with no dark-on-dark/light-on-light
    failures; square 2400x2400 canvas is exactly on target with no clipping.
  - Deterministic, realistic wind-observation dataset (three period clusters, seeded
    LCG) with clean, idiomatic use of Chart.js's plugin API and a thoughtfully placed
    radial tick label spoke (SE, clear of all data).
  weaknesses:
  - Marker overlap in the densest cluster core (Morning, NE) is still present — a
    touch more transparency or a slightly smaller radius there would sharpen individual-point
    separation.
  - Several small helper functions (lcg, windObservations, toXY, hexToRgba) push CQ-01
    slightly past pure KISS, though they are a reasonable trade-off for a custom polar-projection
    plugin architecture.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "polar-scatter · javascript · chartjs · anyplot.ai" centered at top, italic-toned dark subtitle "Prevailing wind direction rotates clockwise through the day" beneath it, bold dark N/E/S/W cardinal labels at the compass points, 4 radial gridlines with weight/opacity increasing outward, 8 angular spokes every 45 degrees, radial tick labels "5"-"20" plus an italic "Wind speed (m/s)" caption placed along the empty SE spoke, bottom legend with three swatches (Morning/Afternoon/Evening). All text is dark-on-light and clearly readable; no clipping at any edge.
      Data: Three clusters of pale-bordered circular markers — green "Morning" (NE, prevailing ~45°), lavender "Afternoon" (bimodal, S and SW-ish, prevailing ~200° and ~258°), blue-grey "Evening" (NW, prevailing ~285°). First series is brand green #009E73, matching the Imprint palette order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Identical layout to the light render. Title, subtitle, cardinal labels, radial tick labels/caption, and legend text are all rendered in light/off-white tones and are clearly legible against the dark surface — no dark-on-dark failures found. Grid rings and spokes remain subtle without competing with the data.
      Data: Marker colors (green/lavender/blue-grey) are pixel-identical to the light render — only chrome flipped, confirming data color consistency across themes.
      Legibility verdict: PASS
