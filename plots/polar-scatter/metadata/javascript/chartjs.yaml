review:
  strengths:
  - Correctly builds a true polar scatter (continuous theta/radius) that Chart.js
    has no native chart type for, by projecting to a hidden linear x/y scatter scale
    and drawing the polar grid/spokes/cardinal labels/legend via Chart.js's own beforeDraw/afterDraw
    plugin hooks — no external library, no fake functionality.
  - Radial tick labels ('5 m/s' ... '20 m/s') are deliberately placed along the one
    spoke (SE, 135°) that stays clear of all three data clusters — a thoughtful, non-obvious
    layout decision that avoids overlap entirely.
  - 'Imprint palette applied correctly and consistently: first series (Morning) is
    #009E73, Afternoon/Evening follow palette positions 2-3 in canonical order, identical
    hex across both themes.'
  - 'Both light and dark renders are fully theme-correct: warm off-white / near-black
    backgrounds, all chrome (title, cardinal labels, tick labels, legend, grid) readable
    and correctly tokenized, no dark-on-dark or light-on-light failures.'
  - Realistic, neutral wind-observation dataset with three plausible prevailing directions
    and speed ranges per time-of-day period, deterministic via a seeded LCG.
  weaknesses:
  - 'Design Excellence is solid but not exceptional: the plot reads as a well-executed
    default rather than a publication-grade piece — consider a subtle visual touch
    that pushes it further (e.g. slightly varying ring line weight/opacity by distance,
    or a one-line radial axis caption like ''Wind speed (m/s)'' near the tick labels
    instead of relying on the repeated unit suffix alone).'
  - No explicit data-storytelling cue beyond the color-coded clustering itself — a
    short annotation or subtitle calling out the pattern (e.g. 'Wind direction rotates
    clockwise through the day') would lift DE-03 from 'guides the reader' to 'viewer
    immediately sees the insight'.
  - Within each time-of-day cluster, points overlap fairly densely in the tightest
    region (near the cluster core) — pointRadius=7 with backgroundColor alpha=0.8
    is reasonable for ~43-44 points per series, but a touch more transparency or a
    hair smaller radius in the densest sub-clusters would improve individual-point
    separation without losing prominence.
  - 'DQ-01 feature coverage is good but could be pushed further: all three periods
    show a fairly similar spread shape (narrow jitter cone); one period with a noticeably
    wider spread or a bimodal direction (e.g. a squall shifting wind direction) would
    better demonstrate the plot type''s ability to show varied angular distributions.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "polar-scatter · javascript · chartjs · anyplot.ai" centered at top; bold N/E/S/W cardinal labels in dark ink at the four compass points; subtle light-gray radial rings and 8 angular spokes; radial tick labels "5 m/s" / "10 m/s" / "15 m/s" / "20 m/s" placed along the SE spoke, in a clear area away from all data; a bottom legend row with three colored swatches labeled "Morning", "Afternoon", "Evening".
      Data: Three distinct clusters of circular markers with white/pale borders — green (Morning, NE quadrant, tight to center = lower speeds), lavender/purple (Afternoon, S/SW, extending to ~17-18 m/s), blue (Evening, W/NW, mid-range speeds). First series is the brand green #009E73 as required.
      Legibility verdict: PASS — all text (title, cardinal labels, radial ticks, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, cardinal labels (N/E/S/W), radial tick labels, and legend text are all now rendered in light/off-white tones, clearly visible against the dark background. Grid rings and spokes are subtle light-gray at low opacity, still visible but not competing with data.
      Data: Same three clusters in the same positions with identical hex colors to the light render (green/lavender/blue) — confirms only chrome flipped between themes, not data colors.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, cardinal labels, tick labels, legend) is legible. Brand green remains clearly visible on the dark surface.
