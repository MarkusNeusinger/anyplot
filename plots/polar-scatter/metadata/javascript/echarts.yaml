review:
  strengths:
  - Correct polar-scatter implementation using ECharts' native polar coordinateSystem
    + scatter series, with technically correct [radius, angle] data mapping
  - Imprint palette applied in canonical order (green/lavender/blue) and identical
    across light and dark renders
  - Theme-adaptive chrome (ink, inkSoft, grid tokens) correctly threaded through title,
    legend, and both axes — all text legible in both themes
  - Clean, deterministic, KISS code structure with a seeded LCG for reproducibility
  - 'Good data storytelling: the three time-of-day categories form visually distinct
    angular clusters, revealing prevailing wind direction at a glance'
  - Title format and legend labels match the spec conventions exactly
  weaknesses:
  - The radiusAxis name "Wind speed (m/s)" overlaps the angleAxis "0°" tick label
    directly beneath it in both renders — increase radiusAxis.nameGap (or move the
    name position) so the descender of "speed" no longer touches the "0°" glyph
  - 'The circular chart only fills ~39% of the 3200×1800 landscape canvas width, leaving
    large balanced-but-wasted whitespace on both sides — consider the `//# anyplot-orientation:
    square` directive (the style guide''s recommended format for radial/symmetric
    plots) or increase polar.radius to better use the available space'
  - angleAxis has no explicit axis name (e.g. "Wind direction (°)") — it relies only
    on the "{value}°" tick formatter, so it reads less clearly than the labeled radiusAxis
  - Design excellence sits at "well-configured default" level — no distinctive ECharts-only
    touches (e.g. a markLine for mean direction, custom symbol shapes) elevate it
    beyond a standard polar scatter
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white.
      Chrome: title "Wind Observations · polar-scatter · javascript · echarts · anyplot.ai" in dark ink at top, centered; radiusAxis labeled "Wind speed (m/s)" running 0-12 vertically from center; angleAxis ticks at 45° intervals ("0°" ... "315°") in soft grey; legend with 3 swatches (morning/afternoon/evening) centered at the bottom; grid lines subtle rgba grey.
      Data: three color-coded clusters — morning = #009E73 (green), afternoon = #C475FD (lavender), evening = #4467A3 (blue) — first series is the mandated brand green.
      Legibility verdict: PASS, with one minor issue — the "Wind speed (m/s)" radiusAxis name sits directly above and touches the "0°" angleAxis tick label, a small but real text overlap (VQ-02 deduction), not a full legibility failure.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black.
      Chrome: identical layout to the light render; title, legend, and tick text all switch to light grey/off-white — no dark-on-dark text anywhere.
      Data: colors are identical to the light render (green/lavender/blue unchanged), confirming only chrome flips between themes.
      Legibility verdict: PASS, with the same minor "Wind speed (m/s)" / "0°" overlap present identically (a layout issue, not a theme-adaptation issue).
