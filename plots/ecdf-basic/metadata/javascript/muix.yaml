review:
  strengths:
  - 'Native step interpolation via the series option curve: "stepAfter" draws a true
    ECDF staircase that rises by exactly 1/80 at each sorted observation and stays
    flat between them, with no smoothing (lines 39-41, 91)'
  - Y axis pinned to 0-1 with tenths ticks, labeled 'Cumulative proportion'; x axis
    padded 3 % on both sides so the leave-0 step at 39.8 and the reach-1 step at 96.1
    are both visible
  - 'Theme tokens threaded through every chrome element (title ink, subtitle inkSoft,
    tick and axis-line inkSoft, grid token), so both renders read cleanly; data line
    #009E73 identical in light and dark'
  - Realistic, neutral scenario (80 exam scores, normal mean 72 sd 12) with a deterministic
    LCG seed; HTML output keeps MUI X's native axis tooltip for reading exact proportions
  weaknesses:
  - 'Suggestion: the mandated title fills only about 30 % of the width; a slightly
    larger title (about 26 px) would give the header more presence.'
