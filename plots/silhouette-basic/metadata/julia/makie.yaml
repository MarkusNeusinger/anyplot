review:
  strengths:
  - 'Right-side dead space from attempt 1 is fixed: xlims now derive from max(cluster_max_silhouette)
    + 0.18 instead of a fixed 1.3, so the plot area is tightly proportioned to the
    data with no wasted canvas'
  - 'Correct silhouette-plot semantics: samples sorted ascending within each cluster,
    grouped by cluster, dashed reference line at the overall average, and per-cluster
    average annotated to the right'
  - Manual silhouette coefficient computation (a(i)/b(i)) is mathematically correct
    and an appropriate substitute for sklearn.metrics.silhouette_samples given no
    equivalent in the Julia ecosystem
  - Theme-adaptive chrome correctly implemented — data colors (green/lavender/blue)
    are pixel-identical between light and dark renders, only chrome flips; no dark-on-dark
    or light-on-light failures in either render
  - 'Imprint palette correctly applied in canonical order with Cluster 0 mapped to
    brand green #009E73'
  - 'Clean minimalist styling: top/right/left spines hidden, y-ticks hidden in favor
    of direct cluster labels, subtle single-axis gridlines, no legend clutter since
    color-to-cluster mapping is direct'
  - Realistic, plausible synthetic data — mix of strong (avg 0.52, 0.47) and weaker/borderline
    (avg 0.25, with a few negative values) cluster scores matches the spec's request
    for a realistic mix
  weaknesses:
  - Design polish is functional but fairly plain/generic — no additional visual anchor
    (e.g. subtle per-cluster row shading, sample-count callouts) to lift it above
    baseline aesthetic sophistication
  - Minimal use of Makie-distinctive features beyond barplot!/vlines!/text! — no Legend,
    Colorbar, or Label-grid composition to showcase deeper library mastery
  - Y-axis label 'Cluster' plus tick labels 'Cluster 0/1/2' is slightly redundant
    — consider dropping the axis label since the tick labels already say 'Cluster
    N'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "silhouette-basic · julia · makie · anyplot.ai" in bold dark text, clearly readable, centered near top (occupies ~27.5% of canvas width, appropriate for this shorter title without a descriptive prefix). Y-axis shows "Cluster 0/1/2" labels in soft dark gray, x-axis shows "Silhouette Coefficient" label in dark ink with tick labels (-0.25, 0.00, 0.25, 0.50, 0.75) in soft gray. Subtle vertical gridlines at those tick positions. Top/right/left spines hidden; only a bottom axis line is visible.
      Data: Three horizontal bar bands, bottom-to-top: Cluster 0 (brand green #009E73, avg = 0.52), Cluster 1 (lavender #C475FD, avg = 0.47), Cluster 2 (blue #4467A3, avg = 0.25). Each band is composed of many thin stacked horizontal bars sorted ascending within the cluster, most extending from 0 rightward with a handful of bars per cluster dipping slightly below 0 (negative silhouette scores). A dark dashed vertical line marks the overall average silhouette score (~0.41). "avg = X.XX" text annotations sit just past the end of each cluster's longest bar, well within the canvas (rightmost content ~91% of width, no clipping, no leftover dead margin like attempt 1).
      Legibility verdict: PASS — all title, axis, tick, and annotation text is clearly readable against the light background; first categorical series is #009E73 as required.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title in white/light text, clearly readable. Y-axis "Cluster 0/1/2" labels and x-axis "Silhouette Coefficient" label plus tick labels rendered in light gray/off-white, all legible against the dark background. Gridlines are faint light vertical lines. Same spine treatment as the light render (top/right/left hidden, bottom visible).
      Data: Identical bar layout and identical data colors to the light render — green (Cluster 0, avg 0.52), lavender (Cluster 1, avg 0.47), blue (Cluster 2, avg 0.25) — confirming only chrome flipped between themes, not data colors. Dashed average-reference line rendered in light gray/white, clearly visible against the dark surface. "avg = X.XX" annotations rendered in light ink, clearly legible.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text and data elements are clearly distinguishable from the dark background.
