review:
  strengths:
  - Correct Imprint palette in canonical order (green/lavender/blue for the 3 abstract
    k-means clusters), with data colors identical between light and dark renders and
    theme-correct chrome (background, text, grid) in both
  - 'Strong data storytelling: bars sorted descending within each cluster, tinted
    per-cluster background bands, per-cluster average annotated directly on the band,
    and a dashed overall-average reference line — the viewer immediately reads cluster
    quality without needing a legend'
  - 'Full spec coverage: horizontal bars per sample, grouped/colored by cluster, vertical
    average-score reference line, and per-cluster average annotations are all present;
    data shows both well-separated (avg 0.72) and poorly-separated clusters with a
    misclassified negative tail (avg 0.23), matching the spec''s guidance'
  - Deterministic, seeded data generation via a small fixed-seed LCG, appropriate
    since the browser has no native seeded RNG
  - 'Idiomatic Highcharts usage: bar series with plotBands/plotLines for annotations,
    transparent background over the page surface, credits disabled, and animation
    disabled on both chart and series to avoid mid-animation screenshots'
  weaknesses:
  - Cluster labels and tick labels are set at 14px CSS (mount space); at a ~400px
    mobile thumbnail scale these become quite small — consider a touch larger fontsize
    for the per-cluster average labels specifically, since they carry key insight
  - 'Visual refinement is good but not maximal: the y-axis (silhouette coefficient)
    line and tick marks remain at default weight/visibility rather than being further
    softened, leaving a bit of extra chrome versus a fully polished look'
  - The plotBands/plotLines-with-HTML-label pattern, while nicely executed, is a fairly
    generic annotation technique replicable in most charting libraries with modest
    effort — doesn't showcase a feature truly unique to Highcharts
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "silhouette-basic · javascript · highcharts · anyplot.ai" and a gray subtitle ("Iris-like dataset · k-means, k = 3 · samples sorted by silhouette score within cluster") are both clearly legible against the light background. X-axis title "Silhouette coefficient" and rotated y-axis title "Samples (grouped by cluster)" are dark/soft-ink and readable. Vertical gridlines are subtle. Three horizontal cluster bands use faint tinted backgrounds (pale green, pale lavender, pale gray) with a right-aligned label per band reading "Cluster N · avg X.XX" in soft ink on a light callout box — all legible. A dashed vertical reference line marks the overall average (0.50) with a bordered label above it.
      Data: Horizontal bars are grouped into 3 clusters, sorted descending within each cluster. Cluster 0 bars are brand green (#009E73), Cluster 1 bars are lavender/purple, Cluster 2 bars are blue, with a visible negative-value tail in Cluster 2 (samples with silhouette < 0, indicating likely misclassification).
      Legibility verdict: PASS — no light-on-light issues; all text is clearly distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle flip to light/off-white and light-gray text respectively, fully readable against the dark background. Axis titles and cluster-band labels are similarly light-toned and legible. The average-line label box is dark with white text and a light dashed line, readable against the surrounding dark chart area. Gridlines remain subtle but visible.
      Data: The three cluster colors (green, lavender, blue) are pixel-identical to the light render — only the chrome (background, text, grid) has flipped, confirming palette/theme compliance.
      Legibility verdict: PASS — no dark-on-dark failures; all text and reference-line labels remain clearly visible against the near-black surface.
