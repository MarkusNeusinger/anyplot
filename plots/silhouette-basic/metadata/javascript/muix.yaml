review:
  strengths:
  - 'Every required element of the silhouette form is present and readable in both
    themes: one bar per sample from zero, negatives extending left of zero, descending
    sort within each cluster, four color blocks in Imprint order starting with #009E73,
    a dashed ink-colored average line labelled ''Average 0.28'', and a per-cluster
    ''avg'' annotation beside each block clear of the bars'
  - Uses one null-padded series per cluster with a shared stack id so every band holds
    exactly one full-height bar, letting MUI X's native horizontal BarChart draw the
    whole plot without dodge sub-bands; categoryGapRatio 0.04 leaves a hairline separation
    between samples
  - Cluster annotations are a small SVG overlay composed inside the BarChart using
    the useYScale and useDrawingArea hooks, so each label is positioned at its own
    block's midpoint from the chart's actual scale; the swatch + bold name + soft
    'avg' line gives a clear typographic hierarchy
  - Native ChartsReferenceLine draws the overall-average line with labelAlign end,
    placing its label at the bottom clear of every bar
  - Theme tokens (ink, inkSoft, pageBg, palette) are threaded into every hand-set
    text element, so both renders are theme-correct; per-bar tooltips remain available
    in the HTML view
  - Realistic, neutral customer-segmentation scenario (k-means on RFM features, Champions/Loyal/At-Risk/Lost)
    with 80 samples in 4 clusters and deterministic LCG + Box-Muller data
  weaknesses:
  - 'SC-02 (code): the silhouette values are drawn directly from a per-cluster normal
    distribution (mean/spread per segment), so no feature vectors exist and the scores
    are not computed as silhouettes, which the Data section''s `samples` role and
    the Notes bullet on computing per-sample scores ask for → generate 2-D feature
    points per segment and compute s(i) = (b − a) / max(a, b) in a short written-out
    loop (the muix Computation line allows it). Likely cause: the data block samples
    `mean + z * spread` instead of features.'
  - 'Suggestion: the y-axis title sits about 50 px left of the axis line with empty
    space between; a slightly narrower left margin would tie it to the bars.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white cream (#FAF8F1), square 2400x2400 canvas.
      Chrome: bold dark title "silhouette-basic · javascript · muix · anyplot.ai" centered at top (~45% width) with a softer grey subtitle "80 samples in 4 clusters · bars sorted within each cluster"; x-axis "Silhouette coefficient" with ticks -0.4 … 1.0 in dark grey; rotated y-axis title "Samples, sorted within each cluster"; subtle light-grey vertical gridlines; a thin dark x-axis line. All text readable.
      Data: 80 horizontal bars from zero, sorted descending within four contiguous blocks — Champions #009E73 green (top, all positive, up to ~0.90), Loyal lavender (one negative bar at ~-0.10), At-Risk blue (tail down to ~-0.31), Lost ochre (bottom, mostly negative down to ~-0.43). A dashed black vertical line at 0.28 runs through all clusters, labelled "Average 0.28" in bold at its foot, clear of the bars. Right column: swatch + bold cluster name + soft "avg 0.65 / 0.35 / 0.10 / -0.06" beside each block's midpoint.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black (#1A1A17).
      Chrome: title, cluster names and the average label in light ink; subtitle, ticks and avg values in light grey; gridlines dim grey but visible; axis line light. No dark-on-dark text anywhere.
      Data: bar colors identical to the light render (green, lavender, blue, ochre); the average line flips to a white dashed line and stays clearly visible; the hairline separators between bars now read dark.
      Legibility verdict: PASS
