review:
  strengths:
  - 'All required spec features present: bars sorted best-to-worst within each cluster,
    distinct color per cluster, dashed vertical line at the overall average, and per-segment
    average-score annotations'
  - Realistic, neutral business scenario (RFM-style customer segmentation into Champions/Loyal/At-Risk/Lost)
    with plausible score distributions and factually sound ranges
  - 'Data shows the full feature space of a silhouette plot: strongly cohesive segment
    (Champions, mostly 0.5-0.9), a segment dipping negative (Lost, misclassified customers)
    and in-between spread (Loyal, At-Risk)'
  - Correct canonical Imprint palette order applied to abstract cluster categories,
    identical data colors between light/dark renders, correct theme-adaptive background
    and chrome in both renders
  - Deterministic, seeded data generation (fixed-seed LCG) with clean, minimal code
    and no fake interactive elements
  - Idiomatic use of MUI X `ChartsReferenceLine` for both the overall-average line
    and the four per-segment average annotations, colored to match each segment for
    a clear visual hierarchy
  weaknesses:
  - 'In the light render, the ''Loyal'' (lavender #C475FD) and ''Lost'' (ochre #BD8233)
    segment-average annotation text sits directly on the #FAF8F1 background at a contrast
    ratio the style guide flags as below WCAG 3:1 for those two hues — add a thin
    ink-color stroke/text-shadow (per the style guide''s ''Optional outline pattern'')
    or darken those two labels specifically for the light theme so they read as crisply
    as the Champions/At-Risk labels'
  - With 80 stacked samples on a 2400x2400 square canvas, individual bars are fairly
    slender; still readable but a taller landscape canvas or larger categoryGapRatio
    would give each bar a touch more presence
  - Design is a competent, well-organized reference-line composition but doesn't yet
    reach 'publication-ready' sophistication — e.g. no custom legend/typography flourish
    beyond the default MUI X legend
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "silhouette-basic · javascript · muix · anyplot.ai" in dark ink at top-left, clearly legible. X-axis title "Silhouette coefficient" and Y-axis title "Customers (by segment)" (rotated) both in dark ink, legible. Tick labels along the x-axis (-0.6 to 1.0) in soft dark gray, legible. Subtle vertical gridlines. Legend swatches (Champions/Loyal/At-Risk/Lost) at top-center, legible dark text.
      Data: Four horizontal-bar segments stacked top-to-bottom, sorted by descending average silhouette score. Champions = brand green (#009E73, first series, correct), Loyal = lavender, At-Risk = blue, Lost = ochre — matches Imprint canonical order 1-4. A black dashed vertical reference line marks the overall average (0.28), with a bold "Overall avg 0.28" label near the bottom. Each segment has a color-matched dashed horizontal line at its vertical midpoint with an "avg" annotation ("Champions · avg 0.65", etc.) in that segment's color.
      Legibility verdict: PASS overall, with one caveat — the lavender "Loyal" and ochre "Lost" annotation labels are noticeably softer/lower-contrast against the cream background than the green/blue labels; still readable but borderline per the style guide's documented low-contrast hues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all rendered in light ink, clearly legible against the dark background — no dark-on-dark failures observed. Gridlines are subtle. Legend text is light and legible.
      Data: Same four segments in the identical data colors as the light render (green/lavender/blue/ochre unchanged, confirming color-consistency across themes). The overall-average reference line is now white/light dashed instead of black, correctly adapted for the dark surface. Per-segment average labels use the same segment colors, and read comfortably against the dark background (all four, including lavender and ochre, have adequate contrast here since light hues sit well against a near-black surface).
      Legibility verdict: PASS — all text is clearly readable, no dark-on-dark issues.
