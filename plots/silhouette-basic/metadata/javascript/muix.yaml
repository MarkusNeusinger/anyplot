review:
  strengths:
  - Silhouette computed in-file from its definition s = (b − a) / max(a, b) over the
    two RFM features; the overall average 0.35 checks out against the cluster averages
    weighted by size (22·0.61 + 20·0.37 + 19·0.20 + 19·0.19) / 80 ≈ 0.35
  - One stacked series per cluster with nulls outside its block makes every sample
    a full-width band bar on a shared band axis, colored by cluster with no gap needed;
    categoryGapRatio 0.04 leaves hairline separators
  - Native ChartsReferenceLine draws the dashed average line in the ink token, so
    it reads near-black on light and near-white on dark across all four blocks
  - A custom SVG layer built on useYScale/useDrawingArea places each cluster's swatch,
    bold name and soft 'avg' value beside the middle of its own block in a reserved
    right band, clear of the bars
  - 'Theme tokens threaded through every text element: no dark-on-dark or light-on-light
    in either render; the Imprint palette positions 1–4 are identical in both'
  weaknesses:
  - 'Suggestion: the x-axis title sits about 50 px below the tick labels; a smaller
    x-axis band height would tie it closer to its axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400.
      Chrome: bold title "silhouette-basic · javascript · muix · anyplot.ai" (~65% of width) with a soft subtitle "80 samples in 4 clusters · bars sorted within each cluster"; x-axis "Silhouette coefficient" with ticks -0.5 to 1.0 in dark-soft ink; rotated y-axis title "Samples, sorted within each cluster"; subtle vertical grid. All readable.
      Data: 80 horizontal bars from zero, grouped top to bottom as Champions (#009E73 green, 22), Loyal (purple, 20), At-Risk (blue, 19), Lost (ochre, 19), each sorted descending with negative tails to the left (down to about -0.5 in Lost). A near-black dashed vertical line at 0.35 runs across all blocks, labelled "Average 0.35" at the bottom. On the right, beside each block, a swatch with the bold cluster name and "avg 0.61 / 0.37 / 0.20 / 0.19".
      Legibility verdict: PASS

