review:
  strengths:
  - 'Clever stacked-with-null-padding trick renders one horizontally-sorted bar per
    sample while giving every segment its own solid Imprint color, with the first
    segment (Champions) correctly on #009E73'
  - 'Strong data storytelling: segments are ordered top-to-bottom from best to worst
    average silhouette score (Champions → Loyal → At-Risk → Lost), and both an overall-average
    reference line and per-segment average reference lines give the viewer instant
    focal points'
  - 'Thoughtful per-theme contrast handling: a stroke halo is added to the colored
    segment-average labels only in light theme (where pastel violet/blue would otherwise
    sit below WCAG contrast on the cream background), while dark theme is left clean
    since it already reads well'
  - Y-axis tick labels are disabled in favor of direct per-segment labeling, avoiding
    80 unreadable overlapping category ticks — a sensible trade-off for this sample
    count
  - Deterministic, dependency-free data generation via a tiny seeded LCG + Box-Muller
    normal sampler, appropriate for a browser-only environment with no numpy/sklearn
    equivalent
  - Title auto-shrinks proportionally to its own length, and canvas dimensions (2400×2400
    square) pass the pipeline's gate cleanly
  weaknesses:
  - 'The file header is malformed/duplicated: lines 1-9 contain two overlapping ''//
    anyplot.ai'' header blocks (one with a stale ''Quality: 88/100'' and specific
    version pins, one with ''Quality: pending''), and the ''//# anyplot-orientation:
    square'' directive is sandwiched between them on line 4 instead of being the very
    first line as the muix library doc requires — clean up to a single header block
    with the orientation directive at the top.'
  - Segment-average reference-line labels (e.g. 'Champions · avg 0.65') sit directly
    on their own dashed guide line at fairly large font size relative to the ~14px
    CSS row height per sample — comfortably readable in this review but leaves little
    margin; consider a slightly smaller label font or a small vertical offset from
    the line for extra breathing room.
  - Legend swatches and layout rely entirely on MUI X defaults (plain square swatches,
    default spacing beyond itemGap) — a bit more custom legend styling would push
    Design Excellence further above 'strong' into 'publication-ready' territory.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Dark-ink title "silhouette-basic · javascript · muix · anyplot.ai" top-left; dark-ink axis titles "Silhouette coefficient" (x) and "Customers (by segment)" (y, rotated); grey tick labels along the x-axis (-0.6 to 1.0); light vertical gridlines; a black dashed vertical reference line labeled "Overall avg 0.28" near the bottom; four dashed horizontal per-segment reference lines each carrying a bold colored label ("Champions · avg 0.65", "Loyal · avg 0.35", "At-Risk · avg 0.10", "Lost · avg -0.06") with a thin dark stroke halo added around the violet/blue label text for contrast against the cream background. All chrome text is clearly legible; no light-on-light issues observed.
      Data: 80 thin horizontal bars grouped into four color-coded segments — Champions (Imprint green #009E73, positions ~+0.17 to +0.9), Loyal (violet), At-Risk (steel blue, spanning negative to positive), Lost (amber, mostly near zero/negative) — sorted descending within each segment band. First categorical series is the mandated brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, axis titles and tick labels are rendered in light/white ink and clearly legible against the dark background; the overall-average reference line and its label flip to white/light dashed styling; the per-segment reference lines keep the same green/violet/blue/amber label colors but drop the stroke halo (not needed here, since these hues already have sufficient contrast on near-black) — no dark-on-dark failures observed for any text element.
      Data: Bar colors are visually identical to the light render — same green, violet, steel blue, and amber for the four segments, same sort order and same reference-line positions — confirming only chrome (not data colors) changed between themes.
      Legibility verdict: PASS
