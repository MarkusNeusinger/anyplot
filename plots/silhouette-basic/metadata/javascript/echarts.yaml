review:
  strengths:
  - 'Correct plot type: horizontal per-sample bars grouped by cluster with a thin
    gap between cluster blocks, matching the sklearn-style silhouette plot convention.'
  - First categorical series is the mandated brand green (#009E73), and the 3-cluster
    palette follows the canonical Imprint order (green, lavender, blue) exactly.
  - 'Both required annotations from the spec are present and well-placed: a dashed
    vertical line + label at the overall average silhouette score, and a per-cluster
    label with its own average score positioned at the cluster''s vertical midpoint.'
  - Negative silhouette values (potential misclassifications) are visibly rendered
    as bars crossing left of zero, directly supporting the spec's 'identifying poorly
    clustered samples' application.
  - 'Theme handling is clean: chrome (title, axis labels, ticks, gridlines, avg-line
    color) is fully token-driven and correctly adapts between the FAF8F1 light and
    1A1A17 dark surfaces, while data colors stay identical across themes.'
  - Idiomatic, distinctive ECharts usage — `markLine` for the reference average and
    the `graphic` overlay API for cluster labels/annotations, computed from the same
    layout constants as the grid so nothing drifts.
  - Deterministic, dependency-free data generation via a small fixed-seed LCG + Box-Muller
    gaussian, appropriate for the browser-only runtime.
  weaknesses:
  - 'Sort-order glitch at the start of cluster 1 and cluster 2 (both themes): the
    single lowest/most-negative sample of each cluster renders as an isolated bar
    directly above that cluster''s longest (peak) bar, immediately after the gap divider
    — producing a visible notch instead of a smooth monotonic descending curve. Cluster
    0 (which happens to have no near-zero/negative values) does not show this. Likely
    cause: `cluster.values.sort((a, b) => a - b)` sorts ascending, but combined with
    `yAxis.inverse: true` and push order, the smallest element of each non-first cluster
    lands at the top of its block instead of the bottom. Try sorting each cluster
    descending (or reversing the per-cluster push order) so the largest value is pushed
    first and the smallest lands adjacent to the following gap, keeping every cluster''s
    bars in a single monotonic run.'
  - 'Design excellence is solid but still fairly restrained: only the L-shaped axis
    frame plus one dashed reference line and text callouts carry the visual hierarchy
    — a bit more refinement (e.g. subtle background band per cluster, or hiding the
    default x-axis tick marks) would lift it further.'
  - Cluster-average annotation text (13px) is noticeably smaller than the axis label
    sizes (14-16px) and may be borderline at mobile (~400px) scaled previews — consider
    bumping it slightly for consistency.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "silhouette-basic · javascript · echarts · anyplot.ai" is bold dark ink, centered, clearly legible. X-axis "Silhouette coefficient" label and tick labels (-0.4 .. 1) are dark/soft-ink and legible. Subtle vertical gridlines are visible but do not compete with the data. Y-axis tick labels are hidden by design; instead three bold cluster-name labels ("Cluster 0 (setosa-like)", "Cluster 1 (versicolor-like)", "Cluster 2 (virginica-like)") plus their "avg X.XX" sub-labels sit in the reserved left margin, clearly readable.
      Data: Three horizontal-bar blocks, one per cluster, separated by thin blank gaps. Cluster 0 = brand green (#009E73), Cluster 1 = lavender (#C475FD), Cluster 2 = blue (#4467A3) — matches Imprint canonical order with green first. A black dashed vertical line marks the overall average (avg = 0.56), labeled above the plot. Each cluster's bars taper smoothly from long (near the plot top of the block) to short, with one isolated short bar crossing left of zero at the top of the cluster 1 and cluster 2 blocks (see Weaknesses).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis label, tick labels, and cluster/avg text all flip to light ink (near-white/soft-gray) and remain fully legible. The average reference line flips from black to white-ish dashed, still clearly visible against the dark background. Gridlines are faint but present.
      Data: Identical bar colors to the light render — same brand green / lavender / blue for clusters 0/1/2, and the same overall shape (including the same top-of-block negative-bar anomaly in clusters 1 and 2). Confirms data colors are theme-independent as required.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome text and the reference line read clearly against the near-black surface.
