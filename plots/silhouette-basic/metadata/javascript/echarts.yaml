review:
  strengths:
  - 'Correct plot type and complete feature set: horizontal per-sample bars sorted
    ascending within each cluster, distinct cluster colors, a dashed vertical line
    at the overall average silhouette score, and per-cluster average annotations.'
  - 'Both renders are fully legible with correct theme-adaptive chrome; backgrounds
    match #FAF8F1 (light) / #1A1A17 (dark) exactly and text stays readable in both.'
  - Palette order (green -> lavender -> blue) matches canonical Imprint order, appropriate
    since the clusters are abstract k-means groups.
  - 'Minimalist, legend-free design: cluster names and average scores are labeled
    directly next to their bar group instead of a separate legend, a clean storytelling
    choice.'
  - Deterministic fixed-seed LCG data generation, matching the library guidance for
    browser-only reproducibility.
  weaknesses:
  - Graphic text positions (cluster-average labels and the avg-line label) are computed
    from hardcoded pixel constants (1600, 900, 190, 60, 70, 90) duplicated from the
    grid config instead of derived from window.ANYPLOT_SIZE or shared variables --
    works correctly today but is fragile if canvas size or grid margins ever change.
  - Design excellence is solid but still mostly default ECharts bar styling beyond
    the custom annotations -- could push further with more refined typography or subtle
    hierarchy treatments (e.g. slightly bolder emphasis on the avg line/label) for
    extra polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "silhouette-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. X-axis "Silhouette coefficient" label and tick labels (-0.4 to 1) in soft ink, legible. Cluster name + average annotations ("Cluster 0 (setosa-like) avg 0.78", etc.) in soft ink at left, all readable against the light background. Dashed black vertical line marks the overall average (avg = 0.56), with a small label above it.
      Data: Three horizontal bar bands, one per cluster, stacked top to bottom with thin gaps between groups. Cluster 0 is brand green (#009E73), Cluster 1 is lavender (#C475FD), Cluster 2 is blue (#4467A3) -- matches Imprint palette positions 1-3 in canonical order. Bars are sorted ascending within each cluster (a few short bars extend left of zero for negative silhouette scores), mimicking the classic silhouette-plot shape.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Same title now in light/white ink, clearly readable against the dark background. Axis labels and tick labels switch to light ink and remain legible -- no dark-on-dark text anywhere. The dashed average line switches to white for contrast on the dark surface. Cluster annotations are in light-gray ink, fully readable.
      Data: Identical bar colors to the light render (green #009E73, lavender #C475FD, blue #4467A3) -- confirms data colors are held constant across themes and only chrome (background, text, gridlines) flipped.
      Legibility verdict: PASS
