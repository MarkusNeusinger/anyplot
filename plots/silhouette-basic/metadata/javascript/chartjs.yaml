review:
  strengths:
  - Silhouette coefficient is computed with the correct a/b formula (mean intra-cluster
    distance vs. minimum mean inter-cluster distance), matching sklearn's algorithm
    despite having no sklearn available in the browser
  - 'Custom Chart.js plugin (afterDatasetsDraw) faithfully implements both spec requirements
    that have no native chart-type support: a dashed vertical line at the overall
    average silhouette score, and per-cluster average annotations'
  - Deterministic LCG-based PRNG with fixed seed (42) avoids seeded Math.random()
    pitfalls per the chartjs library gotchas
  - 'Categorical colors follow the canonical Imprint palette order (green #009E73
    for cluster 0, lavender for cluster 1, blue for cluster 2), identical between
    light and dark renders'
  - Samples are sorted descending within each cluster and separated by transparent
    spacer rows, giving the classic silhouette-plot 'staircase' shape even with the
    y-axis hidden
  - Theme chrome (background, ink, inkSoft, grid) is correctly threaded through title/axis/ticks;
    both renders are legible with no dark-on-dark or light-on-light issues
  - 'animation: false is set and exactly one canvas is appended to #container per
    the mount-node contract'
  weaknesses:
  - Title occupies only ~33% of the plot width at fontsize 22 on the 3200px-wide canvas
    — bump to ~24-26px for a more commanding presence without risking overflow
  - Three small helper functions (makeLcg, gaussian, distance) reduce KISS simplicity;
    they are justified by the need to compute silhouette scores without sklearn, but
    consider whether the distance() closure can be inlined into the O(n^2) loop to
    reduce indirection
  - The overall-average reference line has no numeric label anywhere on the chart
    (only the per-cluster averages are annotated) — add a small text label near the
    dashed line (e.g. 'avg 0.58') so the reference value is legible without inspecting
    code
  - Cluster average annotations are placed at a fixed x offset (chartArea.left + 14)
    without measuring text width or checking for collisions against bar edges — currently
    fine on this dataset but fragile if a future regeneration shifts cluster sizes;
    consider using ctx.measureText or anchoring against a guaranteed-empty region
  - 'legend: { display: false } means cluster identity relies entirely on the inline
    colored annotation text — consider whether a compact legend or larger color swatches
    next to each annotation would make cluster identity more robust at small preview
    sizes (400px)'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "silhouette-basic · javascript · chartjs · anyplot.ai" is dark and centered at the top, fully visible with no clipping. X-axis title "Silhouette Coefficient" and tick labels (-0.5 to 1.0) are dark gray/black and clearly legible. Y-axis is intentionally hidden (no ticks). A single subtle vertical gridline set is visible at 0.2 intervals.
      Data: Three horizontal cluster bands, each a staircase of sorted bars. Cluster 0 is brand green (#009E73, matches palette[0]), Cluster 1 is lavender/purple, Cluster 2 is blue — matching Imprint palette canonical order. Each band has an inline colored annotation ("Cluster N · avg X.XX") in the same hue as its bars, positioned at the left of the plot area on the off-white background, not overlapping any bar fill. A dashed amber vertical line marks the overall average silhouette score, crossing all three bands. Clusters 1 and 2 both show a short run of negative-valued bars at the bottom of their bands, correctly representing potentially misclassified samples.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlaps observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis title, and tick labels have flipped to light/white text and remain fully legible against the dark background. Gridlines are still subtle but visible. No text is dark-on-dark.
      Data: The three cluster bar colors (green, lavender, blue) and the amber dashed reference line are pixel-identical to the light render — only the chrome (background, text, grid) has flipped, exactly as required. The per-cluster colored annotation text remains legible against the dark background since each cluster's own hue is already saturated enough to read on both surfaces.
      Legibility verdict: PASS — all text and data elements are clearly readable against the dark background, no dark-on-dark failures found.
