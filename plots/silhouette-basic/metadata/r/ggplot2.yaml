review:
  strengths:
  - 'Correct silhouette-plot structure: horizontal bars sorted within cluster, distinct
    Imprint colors per cluster, with per-cluster average silhouette score annotated
    directly on the chart instead of a separate legend'
  - Overall mean silhouette reference line included and labeled, matching the spec's
    'vertical line at average silhouette score' requirement
  - 'Palette compliant: Cluster 1 (first series) is Imprint brand green #009E73, remaining
    clusters follow canonical order, and chrome (background, text, grid) flips correctly
    between light and dark renders while data colors stay identical'
  - 'Realistic, reproducible example: k-means on scaled iris features with set.seed(42),
    computed via cluster::silhouette() rather than fabricated values'
  - Clean, idiomatic ggplot2 code — coord_flip() + geom_col() + layered geom_text()/annotate(),
    no unused imports, correct ragg::agg_png save path
  weaknesses:
  - panel.grid.major.x uses full-opacity INK (the same tone as body text) instead
    of a faint tone, so the vertical grid lines at -0.5/0.0/0.5 are more prominent
    than the style guide's 15-25% opacity guidance — use something like scales::alpha(INK,
    0.15) for the grid color instead of raw INK
  - The smallest annotation ('mean = 0.46', geom size=2.8mm ~= 8pt) becomes hard to
    read once the PNG is scaled down to ~400px mobile width — bump it slightly (e.g.
    size=3.2-3.5) to match the tick-label legibility floor
  - Library usage is fairly generic (coord_flip + geom_col + geom_text is easily replicated
    in other libraries) — no ggplot2-distinctive feature is leveraged
  - Because real k-means-on-iris silhouette values are used, only a thin sliver of
    near-zero/slightly-negative width appears (top of Cluster 3) — the 'poorly clustered
    / misclassified sample' storytelling angle called out in the spec notes is only
    weakly visible; a small callout near the lowest-scoring samples per cluster would
    reinforce it
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "silhouette-basic · r · ggplot2 · anyplot.ai" in dark ink top-left; axis titles "Samples (sorted within cluster)" (vertical) and "Silhouette coefficient" (horizontal) in dark ink; x-axis tick labels (-0.5, 0.0, 0.5) in soft grey; y-axis tick labels hidden by design (samples are unlabeled/sorted). Three cluster labels ("Cluster 3 avg = 0.35", "Cluster 2 avg = 0.39", "Cluster 1 avg = 0.64") rendered in bold text color-matched to each cluster's bars, positioned in the empty space left of x=0. A dashed vertical reference line marks the overall mean (0.46) with a small "mean = 0.46" label near it. Thin vertical grid lines appear at -0.5, 0.0, 0.5.
      Data: Three horizontal bar bands (top to bottom: Cluster 3 = blue #4467A3, Cluster 2 = purple #C475FD, Cluster 1 = green #009E73), each a descending staircase of per-sample silhouette widths sorted within the cluster.
      Legibility verdict: PASS — all text is clearly readable against the light background; no dark-on-light or light-on-light issues. Minor concern: the "mean = 0.46" annotation is quite small and becomes borderline at mobile (~400px) scale.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same layout as the light render — title, axis titles, and tick labels now rendered in light ink (#F0EFE8 primary / lighter grey secondary) against the dark background. The dashed mean-reference line is white/light instead of dark ink, and the "mean = 0.46" label uses the light secondary-text tone. Grid lines are a faint light tone at -0.5/0.0/0.5.
      Data: Identical bar colors to the light render — Cluster 3 blue #4467A3, Cluster 2 purple #C475FD, Cluster 1 green #009E73 — confirming data colors are unchanged between themes; only chrome flipped.
      Legibility verdict: PASS — all title/axis/tick text is light-colored and clearly legible against the dark background; no dark-on-dark failures observed. Same minor mobile-legibility concern as the light render for the smallest annotation text.
