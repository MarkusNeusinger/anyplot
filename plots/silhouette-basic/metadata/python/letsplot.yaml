review:
  strengths:
  - 'All four Notes features present: sorted bars from zero, colored cluster blocks
    with gaps, a dashed average line and per-cluster average annotations'
  - Real iris k-means data with silhouette_samples and silhouette_score
  - Theme tokens threaded through all chrome; both renders theme-correct with identical
    data colors
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700 instead of the canonical 3200x1800 → 3200x1800
    (-1600 x -900). Likely cause: ggsize(1600, 900) with ggsave scale=3 instead of
    ggsize(800, 450) with scale=4.'
  - 'VQ-05 (both): the cluster annotations are about three times the tick-label size
    and dominate the left third of the panel → about the size of the tick labels.
    Likely cause: geom_text size=14 (mm), where the library prompt asks for about
    3-5.'
  - 'SC-04 (both): the title reads ''silhouette-basic · letsplot · anyplot.ai'' without
    the language segment, and the legend title is the raw identifier ''cluster'' →
    ''silhouette-basic · python · letsplot · anyplot.ai'' and a reader title such
    as ''Cluster''. Likely cause: the labs() title string and the lowercase ''cluster''
    column.'
  - 'CQ-04 (code): lines 44-73 build the sorted rows with a hand-written per-cluster
    loop → df.sort_values([cluster, silhouette]) plus pd.factorize for the gaps and
    groupby for the averages. Likely cause: row-by-row data assembly.'
