review:
  strengths:
  - One XY chart carries all 150 per-sample bars (strokes from 0 to the score with
    butt caps, broken by allow_interruptions) plus the vertical dashed average line,
    so the line spans every cluster block natively
  - Bars sorted descending within each cluster, four empty rows separate the blocks,
    and block thickness reads as cluster size (n=30/51/69); the negative tail of cluster
    0 extends left of zero
  - Per-point label dicts with print_labels place an 'avg 0.24 / 0.73 / 0.49' annotation
    beside each block, clear of its bars, in both themes
  - 'Theme tokens threaded through Style and the inline CSS (text-overlay fill = INK),
    so all text is readable on both #FAF8F1 and #1A1A17; Imprint order starts with
    #009E73'
  - Silhouette values computed with sklearn.metrics.silhouette_samples on a KMeans
    clustering, as the Notes ask; the data block ends in a tidy df
  weaknesses:
  - 'VQ-03 (both): legend glyphs are ~10 px squares beside 40 px legend text, and
    the ''Average 0.524'' entry shows a square swatch instead of the dashed line it
    explains → swatches near the text height that match their marks. Likely cause:
    pygal''s default legend box size with legend_font_size=40 and the average series
    added as an ordinary series.'
  - 'VQ-05 (both): the x range runs to 1.0 while the longest bar ends at 0.81 and
    starts at -0.2 while the lowest score is -0.05, leaving about a quarter of the
    plot width empty → tighten to about -0.1…0.9. Likely cause: axis_min subtracts
    an extra 0.1 after flooring and axis_max adds 0.1 after ceiling.'
  - 'DQ-02 (both): the clustering has no domain: columns ''Feature 1'' / ''Feature
    2'' and clusters ''Cluster 0–2'' read as generic → name a plausible measured dataset
    (e.g. flower petal/sepal measurements as the spec''s iris example) and its features.
    Likely cause: the synthetic random blobs in the data block.'
  - 'Suggestion: the dotted x guides almost vanish on the dark background; a slightly
    lighter guide tone would keep the grid subtle but visible.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: title "silhouette-basic · python · pygal · anyplot.ai" centered at top in dark ink; x-axis title "Silhouette coefficient", rotated y-axis title "Samples, grouped by cluster"; tick labels -0.2 … 1 at 0.2 steps; dotted vertical guides visible but subtle; legend row at the bottom with four entries (Cluster 0 n=30 avg 0.24, Cluster 1 n=51 avg 0.73, Cluster 2 n=69 avg 0.49, Average 0.524) with small square swatches. All text readable.
      Data: three blocks of thin horizontal bars from zero, sorted descending within each block, separated by gaps: green #009E73 cluster 0 on top (5 short negative bars to the left of zero), lavender #C475FD cluster 1 (longest bars, to ~0.81), blue #4467A3 cluster 2 (largest block). A dark dashed vertical line at 0.524 runs across all blocks. Annotations "avg 0.24", "avg 0.73", "avg 0.49" sit beside each block, clear of the bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels, legend and annotations all in light ink; no dark-on-dark text. The dotted x guides are very faint on the dark surface.
      Data: identical cluster colors (#009E73, #C475FD, #4467A3) and layout; the average line flips to a light dashed line and stays clearly visible.
      Legibility verdict: PASS
