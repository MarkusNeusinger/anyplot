review:
  strengths:
  - 'Every characteristic of the spec is present: one bar per sample from zero, sorted
    within cluster, color blocks separated by gaps, a dashed average line across all
    clusters, and each cluster''s average beside its own block'
  - Cluster annotations carry the cluster name, average and size in one aligned column
    outside the data, so no legend is needed
  - Real wine-chemistry data with four clusters of clearly unequal size and quality,
    including a negative score
  - Theme tokens threaded through every text element; data colors identical across
    light and dark
  - Clean Data/Plot separation with column constants; sorting and summaries done with
    pandas sort_values and groupby
  weaknesses:
  - 'Suggestion: the x axis starts at -0.1 for a single score near -0.02, leaving
    a narrow empty strip left of zero; tightening the lower expansion would give the
    bars a little more width.'
  - 'Suggestion: drawing each cluster annotation in its cluster''s color (darkened
    for the light theme) would tie the text to its block more directly.'
