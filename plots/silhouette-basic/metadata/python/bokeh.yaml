review:
  strengths:
  - Bars are drawn as a single vectorized p.rect over a ColumnDataSource built per
    cluster with groupby, which keeps the code compact
  - Cluster names and per-cluster statistics are typeset in each cluster's Imprint
    color, directly beside the blocks, so no legend is needed
  - The Span average line and the zero baseline use theme tokens and read clearly
    in both renders
  - 'The y axis is treated as a rank: y ticks and the horizontal grid are removed,
    and the dashed vertical grid stays subtle'
  weaknesses:
  - 'DQ-01 (code): the silhouette values are drawn from beta distributions (lines
    43-45), so no sample has feature vectors and nothing is computed with sklearn.metrics.silhouette_samples,
    as the Notes ask → generate feature vectors (e.g. sklearn.datasets.make_blobs
    or iris), cluster them with KMeans, and compute the values with silhouette_samples.
    Likely cause: simulated scores instead of a clustering.'
  - 'DQ-03 (code): the comment on line 42 says that Cluster 2 is ''ambiguous with
    negatives'', but its smallest value is about 0.05 and no bar crosses zero in either
    render → correct the comment, or let the data contain the negatives it describes.
    Likely cause: the clip and shift of sil2 leave every value above 0.'
  - 'Suggestion: end the x range nearer 1.0 so that the axis does not show a 1.2 tick
    for a coefficient that cannot exceed 1, and keep the statistics labels in the
    right margin.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 with a thin INK_SOFT plot outline
      Chrome: bold title 'silhouette-basic · python · bokeh · anyplot.ai' top left; italic axis titles 'Silhouette coefficient' (x) and 'Cluster (samples sorted by silhouette score)' (y); x ticks 0-1.2 in dark grey; subtle dashed vertical grid; no y ticks. All text readable.
