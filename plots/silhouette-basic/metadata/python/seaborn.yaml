review:
  strengths:
  - Silhouette values come from sklearn silhouette_samples / silhouette_score, so
    the average line at 0.633 and the cluster means fall out of the computation
  - Cluster averages sit in a gutter left of zero in each cluster's own color, clear
    of the bars, and the blocks are separated by a gap scaled to the sample count
  - 'Clusters follow the Imprint order (#009E73, #C475FD, #4467A3) with theme-correct
    chrome in both renders'
  - Customer segmentation on spending, frequency and recency is a real, neutral scenario
    with clusters of unequal size and quality
  weaknesses:
  - 'VQ-01 (dark): the C2 annotation in #4467A3 at 8 pt reads faint on the #1A1A17
    background (about 3:1 contrast) beside the other annotations → a lighter text
    color for that label in the dark theme, e.g. INK text with a cluster-colored marker,
    or a contrast-checked tint. Likely cause: ax.text color=IMPRINT_PALETTE[i] used
    for text on both backgrounds.'
  - 'LM-01 (code): every data mark is drawn with matplotlib ax.barh (lines 85-93);
    seaborn contributes only set_theme and despine → draw the bars from a tidy frame
    of sorted values with a seaborn call (e.g. sns.barplot(data=..., x=silhouette,
    y=row, hue=cluster, orient=''h'', palette=IMPRINT_PALETTE[:n], width=1, native_scale=True,
    ax=ax)). Likely cause: the matplotlib silhouette recipe was ported unchanged.'
  - 'Suggestion: the legend repeats the cluster names already given by the C0–C2 annotations;
    a legend with only the average line would lighten the bottom of the canvas.'
