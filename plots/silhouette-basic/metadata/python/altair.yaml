review:
  strengths:
  - 'Faithful silhouette plot: one rect per iris sample from x=0 (alt.datum(0) as
    x2) to its sklearn silhouette_samples score, sorted within each cluster, with
    a clear gap between the three blocks so block thickness reads as cluster size'
  - 'Each block in its own Imprint colour (#009E73, #C475FD, #4467A3), identical in
    both renders; direct bold labels ''Cluster k · avg 0.xx'' sit beside their own
    block just right of its longest bar, so no legend is needed'
  - Dashed overall-average rule drawn in the INK token runs across all clusters and
    stays clearly visible in both themes, labelled 'Overall avg 0.55' at its foot
  - 'Theme tokens thread through every chrome element: warm off-white and near-black
    surfaces, readable title, axis title and ticks in both renders, subtle x grid
    and no y axis'
  - Native Vega-Lite tooltips (sample, cluster, score to 3 decimals) add per-sample
    inspection in the HTML output
  - 'Data block follows the adaptable-code zones: escaped column constants, real iris
    data clustered with KMeans(random_state=42)'
  weaknesses:
  - 'CQ-04 (code): the configure_legend(...) block (about 9 lines) and the ELEVATED_BG
    token it alone uses style a legend that never renders, because the colour encoding
    sets legend=None → delete both. Likely cause: theme template copied without pruning
    the unused legend config.'
  - 'Suggestion: the x domain runs to 1.1 to make room for the Cluster 1 label; a
    domain capped at 1.0 with the label placed inside the free space would keep every
    tick inside the coefficient''s valid range.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, chart centred with even margins.
      Chrome: dark title "silhouette-basic · python · altair · anyplot.ai" left-anchored at the top (~41% of width); x axis "Silhouette coefficient" in bold dark ink with ticks −0.1 to 1.1 in soft dark grey; subtle vertical grid lines; no y axis. All text readable.
      Data: three stacked blocks of horizontal bars from x=0, sorted within each cluster and separated by gaps: Cluster 0 green #009E73 (bottom, 0.03–0.63), Cluster 1 purple #C475FD (middle, 0.64–0.85), Cluster 2 blue #4467A3 (top, 0.05–0.61). A black dashed vertical line at 0.55 spans all blocks, labelled "Overall avg 0.55" at its foot; bold labels "Cluster 0 · avg 0.42", "Cluster 1 · avg 0.80", "Cluster 2 · avg 0.45" sit right of each block, clear of the bars.
      Legibility verdict: PASS

