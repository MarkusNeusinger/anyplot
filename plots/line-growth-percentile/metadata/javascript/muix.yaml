review:
  strengths:
  - Composes the chart from ChartsContainer + LinePlot/MarkPlot/ChartsGrid/axes and
    draws the filled bands and right-margin percentile labels as custom children through
    the useXScale/useYScale hooks, so bands, curves and labels share one coordinate
    system
  - Graduated band opacity (0.25 / 0.17 / 0.09, symmetric around the median) in Imprint
    blue for a boy's chart, with the P50 line at 2.8 px against 1.3 px for the other
    percentiles and its right-margin label set in bold ink
  - Brand-green patient trajectory with page-coloured marker outlines stands out clearly
    against the muted blue reference in both themes
  - Synthetic reference closely tracks WHO boys weight-for-age (P50 3.3 kg at birth,
    ~9.6 kg at 12 mo, ~14.4 kg at 36 mo; P3 ~2.5 kg at birth), generated deterministically
    from a median curve and z-scores
  - Every chrome element (title, mono subtitle, HTML legend, axis labels, ticks, grid)
    is threaded through ANYPLOT_TOKENS and flips correctly between themes; skipAnimation
    set
  weaknesses:
  - 'SC-02 (dark): the band steps are barely distinguishable on the #1A1A17 page —
    the P25–P75 band at fillOpacity 0.09 and the P10–P25 / P75–P90 bands at 0.17 read
    as almost the same dark slate, so the graduated intensity the spec asks for is
    visible only in the light render → widen the opacity steps (e.g. about 0.12 /
    0.24 / 0.36, +0.03 to +0.11) so each step separates in both themes. Likely cause:
    the BANDS opacity values were tuned on the light background only.'
  - 'Suggestion: the five band paths could come from MUI X''s native stacked area
    series (`stack` + `area: true` with a transparent base series) instead of hand-built
    SVG path strings in BandLayer.'
  - 'Suggestion: the y axis starts at 0 while the lowest reference value is about
    2.5 kg, leaving the bottom ~13 % of the plot empty; letting the lower limit follow
    the data would give the curves more vertical room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "line-growth-percentile · javascript · muix · anyplot.ai" top-left (~34 % width) with a grey mono subtitle summarising the synthetic WHO-like reference and the 12 visits (3.35 kg at 0 mo → 15.90 kg at 36 mo); HTML legend top-right (green dot "Patient weight (kg)", blue line "Median (P50)", blue swatch "Reference bands (P3–P97)"). Y axis "Patient weight (kg)" 0–18, x axis "Age (months)" 0–35, mono tick labels, subtle horizontal grid only, left and bottom axis lines. All text readable.
      Data: seven blue (#4467A3) percentile curves fanning out from ~2.5–4.1 kg at birth to ~11.3–17.5 kg at 36 mo, never crossing; five filled bands with graduated opacity (darker outer, lighter centre), clearly stepped; P50 drawn thicker and more opaque. Right-margin labels P3…P97 beside each curve end, P50 in bold ink. Brand-green (#009E73) patient line with 12 circular markers (page-coloured outline) rising from the median at birth to just above P90 territory at 36 mo, crossing P75.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend text, axis labels in light ink; subtitle and tick labels in light grey inkSoft; grid lines subtle dark grey but visible. No dark-on-dark text; P50 label switches to light ink.
      Data: identical blue curves/bands and identical green patient line and markers (marker outline now the dark page colour). The band steps are much weaker here — the inner P25–P75 band and the adjacent bands read as nearly the same dark slate, only the outermost bands are marginally lighter.
      Legibility verdict: PASS (band-step distinguishability is weak — see SC-02)
