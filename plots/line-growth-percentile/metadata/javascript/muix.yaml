review:
  strengths:
  - Uses MUI X composition (ChartsContainer + ChartsXAxis/ChartsYAxis/ChartsGrid)
    with the useXScale/useYScale hooks to draw a custom SVG layer in the chart's own
    coordinate system, so bands, curves and patient marks share the native axes
  - Graduated band opacity (0.25 outer, 0.17 middle, 0.09 central P25–P75) reads darker
    at the extremes and lighter at the median in both themes, all in one blue Imprint
    tone for a boys' chart
  - Median curve is clearly emphasized (2.8 px vs 1.3 px stroke) and its right-margin
    label is set bold in ink while the other labels sit in the band color beside the
    end of their own curve
  - 'Patient trajectory in brand green #009E73 with page-colored marker outlines contrasts
    cleanly with the blue reference bands in both renders'
  - Reference data closely approximates WHO weight-for-age for boys (median 3.30 kg
    at birth, about 14.4 kg at 36 months; P3 2.5 kg at birth) and is fully deterministic
  - All chrome is threaded through ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg), so
    both themes are readable with identical data colors
  weaknesses:
  - 'DE-02 (both): the grid draws a vertical line at every month (37 lines) plus a
    horizontal line at every kilogram (19 lines), a dense lattice behind the bands
    that the style guide''s line-chart rule (y-axis grid only, very subtle) does not
    allow → horizontal grid only, at fewer ticks. Likely cause: <ChartsGrid horizontal
    vertical /> with every-integer ticks.'
  - 'CQ-04 (code): the seven percentile curves are written out as hand-built SVG path
    strings (lines 163–187) next to a transparent all-null `_anchor` line series (lines
    235–245) that exists only to give the container a series, while MUI X line series
    with showMark: false draw these curves natively → pass the seven percentiles as
    line series and keep the custom layer for the filled bands and labels only. Likely
    cause: the whole chart drawn in GrowthChartLayer instead of through series.'
  - 'Suggestion: start the y-axis near the lowest reference value (about 2 kg) instead
    of 0 kg to give the fan of curves the empty bottom 14 % of the plot.'
  - 'Suggestion: wire the custom paths into MUI X tooltips (or use native line series)
    so the interactive HTML reports percentile values on hover.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: bold dark title "line-growth-percentile · javascript · muix · anyplot.ai" top-left with a monospace subtitle (synthetic WHO-like reference, 12 visits, 3.35 kg at 0 mo → 15.90 kg at 36 mo); an HTML legend top-right (green dot "Patient weight (kg)", blue line "Median (P50)", blue swatch "Reference bands (P3–P97)"). Y-axis "Patient weight (kg)" 0–18, x-axis "Age (months)" 0–36 with monospace ticks; all dark text, readable. Grid at every month and every kilogram, subtle but dense.
      Data: five blue (#4467A3-family Imprint position 3) filled bands between P3–P97, darker outer bands and lightest P25–P75 band; seven thin blue curves, P50 thicker; right-margin labels P3…P97 beside each curve end, P50 bold in ink. Patient series in brand green #009E73: 12 markers with page-colored outlines connected by a thick line, rising from P50 at birth to about P90 at 36 months.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, subtitle, legend text, axis titles and tick labels flip to light ink / soft ink and are all clearly readable; no dark-on-dark text. Grid lines are light and subtle.
      Data: identical colors to the light render — same blue bands (graduation still distinguishable, darker outer bands), same blue curves and labels, P50 label in light ink, patient line and markers in #009E73 with dark marker outlines. Brand green reads well.
      Legibility verdict: PASS
