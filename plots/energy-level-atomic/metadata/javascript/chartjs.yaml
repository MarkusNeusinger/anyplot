review:
  strengths:
  - Custom nonlinear (power-law) energy axis spreads the converging high-n levels
    apart while each line is directly labeled with its exact real eV value, avoiding
    both crowding and the awkwardness of a plain log axis.
  - Transition arrows are colored on the Imprint sequential colormap (t.seq, brand
    green to blue) scaled by transition energy -- a continuous physical quantity correctly
    mapped with a continuous colormap instead of arbitrary categorical colors.
  - All energy level values (-13.6, -3.4, -1.51, -0.85, -0.54, -0.38 eV, matching
    -13.6/n^2) and spectral line wavelengths (Lyman-alpha 121.6 nm, Balmer-alpha 656.3
    nm, etc.) are factually accurate hydrogen-atom physics.
  - Custom Chart.js afterDraw plugin is an idiomatic, distinctive use of the library's
    plugin architecture to build a diagram type outside Chart.js's native chart set,
    rather than reaching for another library.
  - Theme-adaptive chrome is correctly threaded through (t.ink, t.inkSoft) and both
    renders stay fully legible with identical data colors -- only chrome flips between
    themes.
  weaknesses:
  - Only emission (downward) transitions are shown; the spec explicitly calls out
    upward arrows for absorption transitions as a distinct feature to convey -- add
    at least one absorption transition so both arrow directions are represented.
  - The ionization-limit dashed line leaves a small stray dash fragment right where
    the 'Ionization limit' label begins (the borderDash [10,6] pattern does not divide
    evenly into the line length) -- adjust the dash pattern or shorten the line so
    it terminates cleanly before the label.
  - The rotated transition-series labels (13px) become illegible once the PNG is scaled
    down to the ~400px mobile width -- increase to ~15-16px or shorten the label text
    (e.g. drop the redundant 'nm' suffix) so it holds up at small sizes.
  - The energy axis has no independent numeric tick scale (ticks are fully hidden);
    the per-line eV labels substitute for it, but a reader scanning the axis in isolation
    has no scale reference outside the labeled lines.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "energy-level-atomic · javascript · chartjs · anyplot.ai" in dark ink, bold, centered near top. Rotated y-axis title "Energy (nonlinear scale, real eV labeled per line)" in dark ink along the left edge. Six horizontal energy-level lines (n=1..n=6) in dark ink-soft gray, each labeled to its right with quantum number and exact eV value. A dashed ionization-limit line near the top labeled "Ionization limit  0.00 eV". All chrome text is clearly readable against the light background.
      Data: Six emission-transition arrows in the right two-thirds of the canvas, colored on a green-to-blue continuous gradient (t.seq) by transition energy -- Lyman series (n->1) arrows render blue-ish, Balmer series (n->2) arrows render green-ish, each labeled with series name and wavelength in nm. First color anchor is the brand green #009E73.
      Legibility verdict: PASS (one minor cosmetic defect: a stray dash fragment sits immediately before the "Ionization limit" label where the dashed line's border-dash pattern doesn't divide evenly -- not a legibility failure, purely cosmetic).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title and axis title now rendered in light ink (#F0EFE8-equivalent), level lines in light gray, all fully legible against the dark background. No dark-on-dark text anywhere.
      Data: Transition arrow colors are identical to the light render (green-to-blue gradient, brand green anchor) -- confirms only chrome flipped, data colors held constant across themes as required.
      Legibility verdict: PASS (same minor dash-fragment cosmetic artifact as the light render; no theme-adaptation failures).
