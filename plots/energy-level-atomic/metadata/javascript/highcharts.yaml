review:
  strengths:
  - 'Excellent physics accuracy: real hydrogen energy levels (E_n = -13.6/n² eV) and
    correct spectral wavelengths (Ly-α 121.6 nm, Ly-β 102.6 nm, H-α 656.3 nm, H-β
    486.1 nm, Paschen-α 1875 nm) — the reverse-direction absorption arrow correctly
    reuses the 102.6 nm Ly-β wavelength'
  - Correct Imprint palette in canonical order with the brand green (#009E73) on the
    first data series (Lyman), unlike some sibling implementations for this spec that
    used non-Imprint hexes
  - Thoughtful schematic y-axis compression (documented in code comments and subtitle)
    that keeps true energy ordering while giving legible spacing to the levels that
    converge near the ionization limit
  - Clean structural distinction between chrome (ink-colored level lines, dashed ionization
    limit) and data (colored transition arrows), with solid vs. short-dash line style
    giving emission/absorption a redundant non-color encoding
  - Correct title format including the 'javascript' language qualifier, and perfect
    theme adaptation — both renders readable with identical data colors and correctly
    flipped chrome
  weaknesses:
  - Noticeable dead whitespace in the lower-left quadrant of the plot area — the region
    between the n=2 line and the n=1 line is empty except for the two transition arrows
    passing through it. Consider pulling yPos for n=1 up slightly (while keeping it
    clearly the most-separated level) to rebalance canvas utilization.
  - Y-axis title 'Energy (increasing ↑, non-linear scale)' omits units — add '(eV)'
    so the unit is visible without reading the individual per-level data labels.
  - Transitions are colored categorically by series (Lyman/Balmer/Paschen/Absorption)
    rather than by a continuous wavelength/frequency-derived hue as the spec's 'color
    arrows by wavelength or frequency' note suggests; the categorical approach is
    reasonable and matches sibling implementations, but a footnote or legend cue tying
    series color to spectral region (UV/visible/IR) would make the mapping more explicit.
  - Design storytelling is solid but stays at the 'color-coded categories' level —
    no additional visual emphasis (e.g., grouping bracket, subtitle callout, or size/weight
    variation) singles out a focal transition for the viewer.
  - 'Library Mastery is good but not highly distinctive: the marker-as-arrowhead +
    null-separated multi-segment line series technique is clever, but doesn''t leverage
    a feature unique to Highcharts beyond what other libraries could approximate similarly.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — correct light theme surface, not pure white.
      Chrome: Title "energy-level-atomic · javascript · highcharts · anyplot.ai" in bold dark ink, fully visible with margin above. Subtitle in medium-gray ink below it, readable. Y-axis title "Energy (increasing ↑, non-linear scale)" rotated on the left edge in soft ink, readable. Six horizontal level lines (n=1..n=6) in dark ink with bold right-aligned labels giving quantum number and energy in eV (e.g. "n = 1 (-13.60 eV)"). A dashed "Ionization limit (0 eV)" line sits above n=6. Legend at the bottom lists four transition families with color swatches, all readable.
      Data: Vertical transition arrows in Imprint colors — green (Lyman, positions of #009E73), lavender (Balmer), blue (Paschen), ochre/dashed (Absorption) — each with a rotated wavelength label (e.g. "121.6 nm") in soft ink. Arrowheads (triangle markers) mark transition direction; downward for emission, upward for the dashed absorption arrow.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — correct dark theme surface, not pure black.
      Chrome: Title and level labels now render in light ink (near #F0EFE8), subtitle and axis title in the lighter secondary tone, all clearly legible against the dark background. Legend swatches and text remain readable. No dark-on-dark failures observed — every ink-colored chrome element correctly flipped to a light tone.
      Data: Transition arrow colors are pixel-identical to the light render (same green/lavender/blue/ochre), confirming only chrome — not data colors — changed between themes. Ionization dashed line and level lines remain visible in light ink instead of dark ink.
      Legibility verdict: PASS — all text is clearly readable against the dark background; brand green (Lyman arrows) remains vivid on both surfaces.
