review:
  strengths:
  - 'Repair addressed all three Attempt-1 weaknesses: n=1''s yPos was raised from
    -14.4 to -10.6 (shrinking the dead lower-left quadrant), the y-axis title now
    reads "Energy (eV, increasing \u2191, non-linear scale)" with explicit units,
    and the Ly-\u03b1 transition now gets a bold label and a larger marker (radius
    12 vs 9) as a focal-point emphasis'
  - 'Physics is factually correct: E_n = -13.6/n\u00b2 eV hydrogen levels and real
    spectral wavelengths (Ly-\u03b1 121.6 nm, Ly-\u03b2 102.6 nm, H-\u03b1 656.3 nm,
    H-\u03b2 486.1 nm, Paschen-\u03b1 1875 nm), including the absorption arrow correctly
    reusing 102.6 nm in reverse'
  - Correct Imprint palette in canonical order, brand green (#009E73) on the first
    series (Lyman), perfect theme adaptation between light and dark renders
  - Clean structural separation between chrome (ink-colored level lines, dashed ionization
    line, not in legend) and data (colored transition arrows with dash style giving
    emission/absorption a redundant encoding)
  - Level lines correctly span only partial plot width (per spec) and are directly
    labeled with quantum number + real energy value, so the reader gets exact numbers
    without relying on axis ticks
  weaknesses:
  - 'Lower-left quadrant is still the largest gap on the axis: the n=2\u2192n=1 gap
    (yPos -5.9 to -10.6) is roughly 1.8\u00d7 the next-largest gap (n=3\u2192n=2);
    a further nudge of n=1 toward -9 to -9.5 would balance the vertical rhythm without
    losing its "most isolated level" read'
  - Transitions are still colored categorically by series (Lyman/Balmer/Paschen/Absorption)
    rather than by a continuous wavelength-derived hue, so the "color by wavelength/frequency"
    cue from the spec is implicit rather than explicit
  - Rotated wavelength labels (13px) and legend text shrink close to the edge of legibility
    at the ~400px mobile thumbnail size
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: title "energy-level-atomic · javascript · highcharts · anyplot.ai" bold dark ink, fully visible with margin above; subtitle explaining the schematic axis compression readable in inkSoft; y-axis title "Energy (eV, increasing ↑, non-linear scale)" now carries explicit units (fixed from Attempt 1). Six horizontal level lines (n=1..n=6) plus a dashed ionization-limit line, each labeled in bold dark ink with quantum number + real energy value (eV). Legend at the bottom lists the four transition families with theme-adaptive inkSoft text.
      Data: level lines in neutral ink (structural chrome, not data). Transition arrows use Imprint colors — green #009E73 (Lyman, first series), lavender (Balmer), blue (Paschen), dashed ochre (absorption) — each with a rotated wavelength label; the Ly-α transition (121.6 nm) is now bolded and drawn with a larger marker (radius 12 vs 9) as a focal-point emphasis added in this repair.
      Legibility verdict: PASS — no light-on-light issues, all text readable at full size; rotated wavelength labels and legend shrink toward the edge of comfortable legibility at ~400px mobile scale but remain readable.

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: title, subtitle, axis title, level labels, and legend all correctly flip to light ink and remain fully readable — no dark-on-dark failures observed anywhere.
      Data: transition arrow colors are pixel-identical to the light render (green, lavender, blue, ochre) — only chrome flipped, as required. Brand green #009E73 remains vivid against the dark surface.
      Legibility verdict: PASS — theme adaptation is correct and complete; both renders pass the readability check.
