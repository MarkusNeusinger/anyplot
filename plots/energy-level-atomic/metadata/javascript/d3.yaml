review:
  strengths:
  - Physically accurate hydrogen energy levels via the Rydberg formula (E(n) = -13.606/n^2
    eV) and real physical constants (hc = 1239.84 eV·nm) for wavelength conversion
  - Nonlinear (sqrt) y-axis scale correctly spreads the high-n levels that converge
    near the ionization limit, exactly matching the spec's nonlinear-scale suggestion
  - Transition arrows colored by wavelength using the Imprint sequential palette (t.seq)
    with a clear vertical colorbar legend — spectral information conveyed visually
    as required
  - Partial-width level lines labeled with quantum numbers, dashed ionization-limit
    reference line, and series-grouping labels (Absorption / Lyman series / Balmer
    series) beneath the arrows
  - 'Both themes render correctly: identical data colors between light and dark, chrome
    (background, text, grid) properly flips, no legibility failures'
  weaknesses:
  - Large expanse of unused whitespace between the n=X level labels and the wavelength
    colorbar on the right side of the canvas — tightening the right margin or moving
    the colorbar closer would produce a more balanced composition
  - Title occupies well under 50% of canvas width at the current 22px size; could
    be sized slightly larger for stronger visual presence without risking overflow
  - Distinctive-feature usage leans on a fairly standard manual SVG linearGradient
    for the colorbar; a more D3-specific technique (e.g. d3-shape curve interpolation
    for the arrows, or d3.forceSimulation for automatic label collision avoidance)
    would further showcase library mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "energy-level-atomic · javascript · d3 · anyplot.ai" centered at top in dark bold text. Y-axis labeled "Energy (eV)" (rotated) with explicit tick values matching each level's energy (-13.61, -3.40, -1.51, -0.85, -0.54, -0.38, 0 eV). Level lines labeled "n = 1" through "n = 6" to the right in dark text. Dashed "Ionization limit" reference line at 0 eV, italic label. Direction legend "↓ emission ↑ absorption" top-left. Series labels "Absorption", "Lyman series", "Balmer series" in italic below the arrows. All chrome text renders clearly readable against the light background.
      Data: Six horizontal black energy-level lines spanning ~54% of plot width. Transition arrows colored by wavelength on a green-to-blue sequential (Imprint seq) scale: four green arrows (UV, 97-121 nm, Lyman + absorption) and two blue arrows (visible, 486-656 nm, Balmer). Each arrow labeled with its wavelength in nm. A vertical colorbar legend on the right (labeled "Wavelength") shows the green(97nm)-to-blue(656nm) gradient with three tick labels.
      Legibility verdict: PASS — all text and data elements are clearly readable, no light-on-light issues, no clipping at canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis, level labels, ionization line, direction legend, and series labels as the light render, all rendered in light/off-white text (t.ink / t.inkSoft) against the dark background. Level lines and axis domain rendered in light color instead of black.
      Data: Same six horizontal level lines (now light-colored) and the same six wavelength-colored transition arrows — green (97-121 nm) and blue (486-656 nm) — identical hues to the light render, confirming data colors are theme-independent. Colorbar legend unchanged in color, labels rendered in light text.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/label text and the blue transition arrows remain clearly distinguishable against the near-black background.
