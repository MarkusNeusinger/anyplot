review:
  strengths:
  - Physically accurate hydrogen energy levels and spectral wavelengths (Lyman-α/β/γ
    at 121.6/102.6/97.3 nm, Balmer-α/β at 656.3/486.1 nm) match real spectroscopic
    data — excellent factual correctness.
  - 'Idiomatic, expert-level MUI X composition: ChartContainer + useXScale/useYScale/useDrawingArea
    hooks + ChartsReferenceLine build a fully custom energy-level diagram, showcasing
    library depth well beyond a default chart type.'
  - Correct Imprint palette usage (brand green first, canonical order for the remaining
    series) with fully theme-adaptive chrome — both light and dark renders are clean,
    legible, and use identical data colors.
  - Clear grouping via color-coded transition series (Lyman/Balmer/Absorption) with
    a legend, a nonlinear compressed energy scale for convergence near the ionization
    limit, and an ionization-limit reference line — matches every explicit spec requirement.
  weaknesses:
  - Wavelength transition labels (fontSize=11, rotated -90°) are small and tightly
    packed between the colored arrows — increase to ~13-14px or add horizontal spacing
    so they stay legible at reduced/mobile scale.
  - Only 5 energy levels are shown (spec allows 5-15) and sub-levels are only named
    inline (e.g. '2s, 2p') rather than visually grouped by quantum number/angular
    momentum — consider adding another level or splitting a degenerate level to more
    fully cover DQ-01 feature coverage.
  - Only ground-state (n=1) absorption transitions are shown; adding an absorption
    transition from an excited state would better illustrate the spec's general 'absorption
    transitions' note.
  - Title occupies only ~33% of canvas width at fontSize=22 — noticeably smaller than
    the typical anyplot proportion for this mandated title string; could grow slightly
    for better hierarchy/canvas utilization without risking overflow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "energy-level-atomic · javascript · muix · anyplot.ai" in bold dark ink top-left; a
        descriptive subtitle below it explaining the Rydberg formula and compressed axis; a three-item
        legend (Lyman series, Balmer series, Ground-state absorption) with colored swatches; a left-side
        "Energy (eV)" axis title (rotated); y-axis tick labels at 0, -1, -3, -6, -13.6 eV with subtle
        horizontal gridlines; a dashed amber "Ionization limit (E = 0 eV)" reference line at the top of
        the plot area. All text renders in dark ink and is clearly readable against the light background.
      Data: Five thick black horizontal energy-level lines (n=1 through n=5), each labeled on the left with
        quantum-number/orbital text and on the right with the energy value in eV. Seven vertical arrows
        connect levels: three green (Lyman, emission, downward, ending at n=1), two lavender/purple
        (Balmer, emission, downward, ending at n=2), and two blue (ground-state absorption, upward, from
        n=1). Each arrow has a small rotated wavelength label (e.g. "121.6 nm") in its own color. The first
        series color is the brand green #009E73, matching the Imprint palette.
      Legibility verdict: PASS (all title/axis/legend/level text is clearly readable; the small rotated
        wavelength labels are the least legible element but remain readable at full resolution).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title, subtitle, legend, axis title, tick labels, gridlines, and amber dashed ionization
        reference line as the light render, but all text/ink elements have flipped to light color (white/
        off-white) against the dark background. No dark-on-dark or light-on-light failures observed.
      Data: Same five energy-level lines (now white/light strokes) and the same seven colored transition
        arrows (green, lavender/purple, blue) with matching wavelength labels — colors are visually
        identical to the light render, confirming only chrome (not data color) flipped between themes.
      Legibility verdict: PASS (all chrome text is light-colored and clearly readable against the dark
        background; data colors are unchanged from the light render).
