review:
  strengths:
  - All eight transitions are physically correct for hydrogen (Lyman 121.6/102.6/97.3
    nm, Balmer 656.3/486.1/410.2 nm), and the level energies -13.6/n² eV (-13.60,
    -3.40, -1.51, -0.85, -0.54, -0.38) come out of the computation rather than being
    typed in
  - The nonlinear (power-compressed) energy axis keeps the converging upper levels
    apart, and the subtitle plus the tick values at the real level energies make the
    compression clear
  - Emission arrows are grouped on the left and absorption arrows on the right, all
    spread across the level width, so every arrow can be followed from level to level;
    the arrowheads end exactly on their target levels
  - 'Arrows and their wavelength labels are coloured by spectral region (Ultraviolet
    = brand green #009E73, Visible = Imprint lavender #C475FD), with identical data
    colours in both themes'
  - The ionization limit uses MUI X's native ChartsReferenceLine (dashed amber, labelled),
    so it reads as different from the solid level lines
  - Custom SVG is drawn inside ChartsContainer through the useXScale/useYScale/useDrawingArea
    hooks, so levels and arrows sit on the chart's own scales; the wavelength labels
    use a page-coloured paint-order halo
  - Exact energies are repeated on the right end of each level, and the orbital designations
    (1s, 2s/2p, …) are on the left
  weaknesses:
  - 'LM-01 (code): the data lives in two ad-hoc arrays (LEVELS_SPEC, TRANSITIONS_SPEC)
    with no column-role constants and no records-shaped `const data` block, which
    the muix library prompt''s Data block contract requires → declare role constants
    (level, energy, transition from/to, wavelength) and keep records keyed by them
    so ''Use with my data'' can replace the block. Likely cause: data block written
    as named parameters instead of the six-zone layout.'
  - 'Suggestion: the y-axis ticks are rounded to one decimal (-0.4 eV, -1.5 eV), so
    the -0.4 eV grid line runs a few pixels off the n = 6 level line. Ticks at the
    exact level energies, or no grid under the level lines, would remove that near-double
    line.'
  - 'Suggestion: the ↓/↑ glyphs inside the rotated wavelength labels turn sideways
    and repeat what the arrowheads already show; dropping them would make the labels
    cleaner.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "energy-level-atomic · javascript · muix · anyplot.ai" at top left; inkSoft subtitle "Hydrogen atom (Z = 1) (6 bound states, 8 transitions: ↓ emission, ↑ absorption) · compressed energy scale (-13.6 to 0 eV)"; an HTML legend row with Ultraviolet (< 400 nm) and Visible (400–700 nm) swatches; rotated "Energy (eV)" axis title; y ticks 0, -0.4, -1.5, -3.4, -13.6 eV with subtle grid lines. All text dark on light and readable.
      Data: six near-black level lines spanning about 70 % of the width, labelled on the left (n = 1 (1s) — ground state … n = 6 (6s–6h)) and with exact energies on the right (-13.60 … -0.38 eV). Eight vertical arrows: emission arrows on the left (green 121.6/102.6/97.3 nm to n=1; lavender 656.3/486.1 nm to n=2) and absorption arrows on the right (green 102.6/97.3 nm up from n=1; lavender 410.2 nm from n=2 to n=6). Each arrow has a rotated bold wavelength label in its own colour. A dashed amber ionization line at 0 eV, labelled "Ionization limit (E = 0 eV)" at the right. UV arrows are brand green #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, ionization label, level labels and axis title in light ink; subtitle, ticks, energy values and legend text in light inkSoft; grid subtle. No dark-on-dark text anywhere.
      Data: level lines flip to light ink (chrome); arrow colours (#009E73 green, #C475FD lavender) and the amber reference line are identical to the light render.
      Legibility verdict: PASS
