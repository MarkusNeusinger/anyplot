review:
  strengths:
  - Scientifically accurate hydrogen energy levels via the Rydberg formula, with correct
    real-world spectral line wavelengths (Lyman-alpha 121.6 nm, H-alpha 656.3 nm,
    etc.)
  - Thoughtful compressed (power) vertical scale keeps closely-spaced high-n levels
    distinguishable near the ionization limit, matching the spec's nonlinear-scale
    guidance
  - Clear emission (downward arrow) vs. absorption (upward arrow) direction encoding,
    reinforced with explicit arrows in the legend text
  - 'Correct Imprint palette usage: series colors are identical between light and
    dark renders, first series is brand green, canonical ordering preserved'
  - Clean typography hierarchy (title / context subtitle / legend / chart) with generous
    whitespace and minimal chrome (no boxed legend, no unnecessary spines)
  weaknesses:
  - Text becomes largely illegible at the ~400px mobile width — wavelength labels,
    Y-axis tick labels, and legend text shrink below a readable threshold; increase
    baseline font sizes for secondary text (currently 13-15px) so the diagram degrades
    more gracefully on small viewports
  - Three small rendering components (EnergyAxis, EnergyLevels, Transitions) add minor
    structural overhead — justified by MUI X's hook-based custom-layer pattern (useXScale/useYScale/useDrawingArea
    require child components inside ChartContainer), but could be trimmed if a simpler
    approach is found
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "energy-level-atomic · javascript · muix · anyplot.ai" in dark ink, top-left; a context subtitle explaining the Rydberg formula and compressed scale; a 4-item color-swatch legend (Lyman/Balmer/absorption/excited-state absorption) with direction arrows in the labels. Y-axis has manual ticks at 0, -1, -3, -6, -13.6 eV with subtle horizontal gridlines. All chrome text is dark-on-light and clearly readable.
      Data: Six horizontal energy-level lines (n=1..6) in dark ink, spanning a partial width of the plot area and labeled with quantum-number/orbital designations on the left and exact energy values on the right. Eight vertical transition arrows in four colors (green #009E73 Lyman emission, lavender Balmer emission, blue ground-state absorption, ochre excited-state absorption) with rotated wavelength labels alongside each arrow, and arrowheads pointing down (emission) or up (absorption). A dashed amber "Ionization limit (E = 0 eV)" reference line sits at the top.
      Legibility verdict: PASS — all title, subtitle, legend, axis, and data labels are clearly readable against the light background at full resolution. Note: at the ~400px mobile-scaled preview, secondary text (wavelength labels, tick labels, legend) becomes hard to read due to small absolute font sizes — flagged as a weakness, not a pass/fail theme issue.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/subtitle/legend/axis layout as the light render, now rendered in light ink (#F0EFE8-family) — fully legible, no dark-on-dark issues detected. Gridlines are subtle light lines at low opacity.
      Data: Same four transition colors and six energy-level lines, confirmed pixel-identical hues to the light render (green, lavender, blue, ochre) — only the chrome (background, ink, grid) flipped as required. Arrow directions and wavelength labels unchanged.
      Legibility verdict: PASS — all text is clearly visible against the dark background; no near-black-on-near-black or unreadable elements found. Brand green remains vivid on the dark surface. Same mobile-scale caveat as the light render applies (small secondary-text sizes, not a theme failure).
