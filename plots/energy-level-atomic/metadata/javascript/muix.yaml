review:
  strengths:
  - Energies fall out of the computation E = -13.6/n^2 (line 60) and match the right-hand
    readouts (-3.40, -1.51, -0.85, -0.54, -0.38 eV); the wavelengths shown (Lyman
    alpha 121.6, Lyman beta 102.6, Lyman gamma 97.3, H-alpha 656.3, H-beta 486.1,
    H-delta 410.2 nm) are the correct hydrogen lines
  - 'Composes the chart from MUI X building blocks: ChartsContainer with the useXScale/useYScale/useDrawingArea
    hooks drives a custom SVG layer, and the native ChartsReferenceLine draws the
    amber dashed ionization limit with its label'
  - Each arrow's ends sit exactly on the levels it connects; emission arrows point
    down and absorption arrows point up, evenly spread so every arrow can be followed
  - 'Arrows are colored by spectral region (UV #009E73, visible #C475FD), with a matching
    legend, and the wavelength labels have a page-colored halo (paintOrder stroke)
    that keeps them readable where they cross grid lines'
  - The power-compressed energy axis keeps n=2..6 legible next to the -13.6 eV ground
    state; the eV ticks and the per-level energy readouts on the right make the nonlinear
    scale explicit
  - 'Theme tokens are threaded through every element: ink and inkSoft text, grid and
    level lines flip correctly, and the data colors are identical in both renders'
  weaknesses:
  - 'VQ-05 (both): the level lines start at 27 % of the plot width, so about 480 CSS
    px (roughly a quarter of the canvas) between the energy axis and the level labels
    is empty, and the band between the legend and the 0 eV line is empty too → start
    the levels at about 12–15 % of the width (about −12 percentage points) and reduce
    the top padding. Likely cause: LEVEL_X_START_SHARE = 0.27 and the 40 px top margin
    plus Y_TOP_PAD_SHARE = 0.12.'
  - 'VQ-06 (both): the subtitle reads ''compressed energy (ev) scale'': the unit is
    lowercased to ''ev'' → ''eV''. Likely cause: ENERGY_AXIS_TITLE.toLowerCase() in
    the context line (line 291).'
  - 'Suggestion: compute the wavelengths from the level energies (λ = 1239.84 / ΔE
    nm) instead of hard-coding them in TRANSITIONS_SPEC, so the labels follow from
    the data.'
  - 'Suggestion: a native ChartsYAxis on a pow scale with a valueFormatter could replace
    the hand-drawn axis line, ticks and tick labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold title 'energy-level-atomic · javascript · muix · anyplot.ai' at top left; a soft-ink context line (Hydrogen atom, 6 bound states, 8 transitions, compressed energy scale); a legend with green 'Ultraviolet (< 400 nm)' and purple 'Visible (400–700 nm)' swatches; a rotated bold 'Energy (eV)' axis title; tick labels 0, -0.4, -1.5, -3.4, -13.6 eV with subtle grid lines; dark ink level lines labeled n = 1 (1s) — ground state ... n = 6 (6s–6h) on the left, with energy readouts on the right (-13.60 ... -0.38 eV); an amber dashed ionization line at 0 eV labeled 'Ionization limit (E = 0 eV)'. All text readable.
      Data: eight vertical arrows evenly spaced: Lyman emission (121.6, 102.6, 97.3 nm) and absorption (102.6, 97.3 nm ↑) arrows in #009E73, and Balmer 656.3 and 486.1 nm (↓) plus 410.2 nm (↑) in #C475FD, each with a rotated wavelength label. The arrow ends sit on their levels. The left quarter of the plot is empty between the axis and the level labels, and the subtitle's unit reads 'ev'.
      Legibility verdict: PASS

