review:
  strengths:
  - 'Physically correct hydrogen data: levels from E_n = -13.6/n² and wavelengths
    computed from the energy gaps (HC_EV_NM / ΔE), all nine lines match the Lyman,
    Balmer and Paschen values'
  - Symlog energy scale with a labeled tick at every level spreads the converging
    upper levels while keeping the axis readable
  - 'Idiomatic Altair layering: mark_rule with x/x2 for levels and y/y2 for arrow
    shafts, triangle-down mark_point heads, autosize fit filling the canvas exactly'
  - 'Clear hierarchy: thin INK_SOFT level lines recede behind thick Imprint-colored
    arrows; bold level labels and an italic muted wavelength tier'
  - Theme-correct chrome in both renders, Imprint colors identical across themes,
    tooltips on levels and transitions in the HTML
  weaknesses:
  - 'VQ-02 (both): the legend title ''Spectral series'' and the label ''Balmer (Visible)''
    touch the left and right edges of the legend frame, and the ''434 nm'' and ''1875
    nm'' labels start on the n = 3 line → at least 4 px clearance (legend padding
    about +4 px; labels nudged clear of the level line). Likely cause: alt.Legend
    without padding, and wl_beside/wl_below y anchors (y_mid, dy=14) landing on n
    = 3.'
  - 'VQ-05 (both): the y domain''s upper bound df[ENERGY].max() + 1 leaves about a
    quarter of the plot height empty above the 0 eV ionization line → cut the headroom
    to about +0.3 eV so the levels use the height. Likely cause: y_scale domain=[min*1.1,
    max+1].'
  - 'Suggestion: the Paschen wavelength labels hang below their heads while the others
    sit beside the shafts; one consistent placement would make the pairing quicker
    to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: title 'energy-level-atomic · python · altair · anyplot.ai' bold dark and centered, subtitle 'Hydrogen atom emission lines · energy levels: −13.6/n² eV' in INK_SOFT; y title 'Energy (eV)'; ticks at −13.60, −3.40, −1.51, −0.85, −0.54, −0.38, 0.00 on a symlog axis; legend 'Spectral series' top-left on an elevated fill. All readable; the legend title and 'Balmer (Visible)' touch the frame.
      Data: seven partial-width level lines in INK_SOFT with bold labels n = 1 … n = ∞ (n = 4 and n = 6 ends staggered), dashed ionization line at 0 eV; nine downward arrows: Lyman #009E73 (122/103/97 nm), Balmer #C475FD (656/486/434 nm), Paschen #4467A3 (1875/1282/1094 nm), italic muted rotated wavelength labels. Large empty band above the ionization line.
      Legibility verdict: PASS

