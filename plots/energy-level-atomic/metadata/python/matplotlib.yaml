review:
  strengths:
  - 'Lyman series in brand green #009E73 and Balmer arrows in Imprint hues matched
    to their visible wavelengths, with computed wavelengths in the legend'
  - Sqrt-compressed energy axis with real-eV tick labels spreads the converging upper
    levels while staying readable as a nonlinear scale
  - Series labels placed beside their arrow bands, clear of every arrow and level
    line
  - Data computed from E_n = -13.6/n² and hc/ΔE, so every level and wavelength is
    physically correct
  - 'Theme tokens threaded through all chrome: no dark-on-dark text in the dark render'
  weaknesses:
  - 'VQ-01 (dark): the quantum labels n = 1…6 are drawn in Imprint blue #4467A3 at
    8 pt and reach only about 3:1 contrast on #1A1A17, reading dim next to the INK_SOFT
    ticks → a label color with at least 4.5:1 on the dark surface (for example INK_SOFT,
    or a lighter blue in dark mode). Likely cause: ax.text(..., color=LEVEL_COLOR)
    for the level labels.'
  - 'VQ-01 (both): the energy values of the three highest levels (-0.85, -0.54, -0.38
    eV) drop to 7 pt, below the style guide''s 8 pt annotation size → 8 pt (+1 pt),
    keeping the stagger for separation. Likely cause: label_fs = 8 if rank < 3 else
    7.'
  - 'Suggestion: ax.set_yscale(''function'', functions=(fwd, inv)) would let matplotlib
    carry the sqrt compression and its ticks instead of the manual tick mapping.'
  - 'Suggestion: the legend repeats the direct series labels for Lyman; it could carry
    only the Balmer wavelengths.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'energy-level-atomic · python · matplotlib · anyplot.ai' in dark ink at 12 pt, 'Energy (eV)' y label, ticks 0/-0.5/-1/-2/-4/-8/-14 in INK_SOFT, energy values left of each level in muted gray, 'Ionization (0 eV)' label at the dashed top line, legend lower right on an elevated frame. All readable.
      Data: six Imprint-blue level lines (n = 1 bolder) spanning the central ~55 % of the width with 'n = 1…6' labels on the right; five Lyman emission arrows in #009E73 on the left ending at n = 1, four Balmer arrows on the right ending at n = 2 in red (656 nm), cyan (486 nm), lavender (434 nm) and plum (410 nm); italic 'Lyman series (UV)' and 'Balmer series (Visible)' labels beside their bands, clear of arrows.
      Legibility verdict: PASS

