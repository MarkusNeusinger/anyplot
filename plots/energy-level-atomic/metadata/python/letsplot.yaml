review:
  strengths:
  - Power-transformed energy axis spreads the converging n=4..6 levels while the ticks
    carry the true energies (-0.378 ... -13.6 eV)
  - Every arrow starts and ends exactly on its two levels, grouped by series and spread
    horizontally so each can be followed
  - Wavelengths are computed from the level energies (hc/ΔE), so 97.2, 434.1 and 1094.0
    nm fall out of the data
  - 'Imprint palette in canonical order (#009E73 Lyman, #C475FD Balmer, #4467A3 Paschen),
    identical in both themes with fully theme-adaptive chrome'
  - Dashed, labelled ionization limit with a subtle continuum band sets it apart from
    the level lines
  - layer_tooltips() adds level energies and transition wavelengths on hover in the
    HTML output
  weaknesses:
  - 'VQ-02 (both): the y grid lines run straight through the right-side energy labels
    (-0.38 eV … -13.60 eV), the ''0 eV (ionization)'' label and the ''Balmer (Visible)''
    legend text, which sits on the -0.378 grid line → no grid line under text: drop
    the major y grid (the level lines already mark each energy) or stop it before
    the labels. Likely cause: panel_grid_major_y=element_line(color=INK_SOFT, size=0.3)
    drawn at every level break.'
  - 'VQ-03 (both): the right-side energy labels (''-0.38 eV'' … ''-13.60 eV'') repeat
    the values the y-axis ticks already state at the same heights → keep one of the
    two. Likely cause: the energy_label geom_text layer next to scale_y_continuous(breaks=...,
    labels=...) at the same level positions.'
  - 'VQ-03 (both): two wavelength labels sit away from the arrow they name — ''434.1
    nm'' is below the n=2 line under the Balmer arrow tips and ''1094.0 nm'' floats
    between n=3 and n=2 — so a reader cannot tell which transition they belong to
    → place each label beside its own arrow shaft. Likely cause: y_mid = y_to - 0.13
    and x_label = x - 0.03 for every series but the first.'
  - 'DE-02 (both): a four-sided panel frame encloses the diagram and the y grid is
    solid INK_SOFT, short of the style guide''s L-shaped-or-none spines and subtle
    grid (rgba ink at 0.15) → no top and right spines and a 0.15-alpha grid or none.
    Likely cause: the default panel border left on in anyplot_theme and panel_grid_major_y
    color=INK_SOFT.'
  - 'CQ-04 (code): lines 99–112 and 196–204 build each arrowhead by hand from a head_df
    and two extra geom_segment layers (about 20 lines) → `geom_segment(..., arrow=arrow(angle=30,
    length=8, type=''open''))` (lets_plot). Likely cause: arrowheads written out instead
    of the native arrow() parameter.'
  - 'Suggestion: map the series to color with scale_color_manual(values=IMPRINT_PALETTE[:3])
    and a native legend instead of the hand-drawn legend segments and texts.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'energy-level-atomic · python · letsplot · anyplot.ai' with subtitle 'Hydrogen Atom: Lyman, Balmer & Paschen Series' centered in dark ink; y-axis 'Energy (eV)' with ticks -13.6, -3.4, -1.51, -0.85, -0.544, -0.378, 0 on a power-scaled axis; x axis hidden. A gray four-sided panel frame; thin solid gray y grid lines at each level run across the full panel, through the right-side energy labels and the 'Balmer (Visible)' legend text. All text readable.
      Data: six near-black level lines n=1..n=6 over part of the width, bold state labels left, '-13.60 eV' etc. right; dashed ionization line at 0 eV with label and a light continuum band above. Downward emission arrows with V heads ending exactly on their levels: three Lyman in #009E73, three thicker Balmer in #C475FD, three Paschen in #4467A3. Italic wavelength notes 97.2 nm, 434.1 nm, 1094.0 nm. Hand-drawn legend upper right.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
