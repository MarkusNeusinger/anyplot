review:
  strengths:
  - Nonlinear power-scale energy axis with ticks placed at the true level energies,
    so the converging upper levels separate and every tick reads a real eV value
  - Native geom_segment(arrow=arrow(type='open')) arrowheads on every transition
  - Balmer (visible) series drawn thicker than the UV and IR series, giving the diagram
    a focal point
  - 'Clean chrome: no grid and no frame, the level lines and ticks carry the energy
    reading; theme tokens give correct chrome in both renders'
  - 'Physically correct data: E_n = -13.6/n^2 and wavelengths from hc/dE (97.2, 434.1,
    1094.0 nm)'
  - layer_tooltips() adds level energy and transition wavelength hover lines in the
    HTML output
  weaknesses:
  - 'Suggestion: map the series to color with scale_color_manual(values=IMPRINT_PALETTE[:3])
    and a native legend instead of the hand-drawn legend segments and texts.'
  - 'Suggestion: the arrowhead of the short n=4→3 Paschen arrow covers most of its
    shaft; a slightly shorter arrow() length would keep the shaft visible.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no panel frame, no grid.
      Chrome: title 'energy-level-atomic · python · letsplot · anyplot.ai' centered with subtitle 'Hydrogen Atom: Lyman, Balmer & Paschen Series'; y-axis title 'Energy (eV)'; ticks at 0, -0.378, -0.544, -0.85, -1.51, -3.4, -13.6 in dark grey; bold n=1..n=6 labels left of the level lines; '0 eV (ionization)' beside the dashed limit; all readable.
      Data: six near-black level lines on a nonlinear axis, dashed ionization line with a faint tinted continuum band above; three green (#009E73) Lyman arrows to n=1, three thicker purple Balmer arrows to n=2, three blue Paschen arrows to n=3, native open arrowheads; italic grey wavelength labels 97.2 nm, 434.1 nm, 1094.0 nm beside the last arrow of each series; colored legend text at the upper right.
