review:
  strengths:
  - 'Accurate hydrogen physics: levels computed from E_n = -13.6/n² eV, correct Lyman,
    Balmer and Paschen wavelengths'
  - Square-root compressed energy axis with ticks at the ground levels and round energies
    separates the converging upper levels while staying readable in eV
  - Wavelength labels rotated along their own arrows keep every transition legible
    without crossing its neighbours
  - Imprint colors by spectral region (UV, violet, blue, red, IR) on arrows and series
    headers, identical in both themes
  - Bokeh HoverTool on a ColumnDataSource-backed level segment shows level, energy
    and degeneracy in the HTML view
  weaknesses:
  - 'SC-02 (both): arrows stand 2-5 x-units away from the level lines and n=4, n=5,
    n=6 have no grid line, so an arrow''s ends cannot be followed onto the level they
    connect (C2) → extend the level lines (or a faint level guide) under the arrow
    columns so each arrow starts and ends on its level. Likely cause: level_x0, level_x1
    = -1.5, 1.5 while x_cursor places the arrows at -3.5 and 3.2+.'
  - 'VQ-01 (dark): the 20 pt Hγ 434 nm and Hδ 410.2 nm labels in #954477 read dim
    on #1A1A17 → a lighter violet that keeps contrast on both surfaces (for example
    #C475FD for the violet region). Likely cause: SPECTRAL_COLORS violet entry IMPRINT_PALETTE[6].'
  - 'Suggestion: the Balmer header takes the Hα red although the series spans four
    colors; an INK_SOFT header would not imply a single region.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'energy-level-atomic · python · bokeh · anyplot.ai' in dark ink, y-axis 'Energy (eV)' and tick labels (0.0, -0.5, -1.0, -1.5, -3.4, -5.0, -10.0, -13.6) in INK_SOFT, subtle y grid; x axis hidden. Level labels 'n=1 (-13.60 eV)' … 'n=6 (-0.38 eV)' and 'Ionization (0 eV)' readable.
      Data: six #009E73 level lines in the centre on a sqrt-compressed axis; dashed ionization line at 0 eV across the plot. Lyman arrows (purple #C475FD) left, Balmer arrows (red Hα, blue Hβ, violet Hγ/Hδ) and Paschen arrows (#BD8233) right, all pointing down, each with a rotated wavelength label; colored bold series headers on top.
      Legibility verdict: PASS

