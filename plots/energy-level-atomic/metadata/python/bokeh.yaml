review:
  strengths:
  - 'Accurate hydrogen physics: levels computed from E_n = -13.6/n² eV, correct Lyman,
    Balmer and Paschen wavelengths'
  - Square-root compressed energy axis with ticks at the ground levels and round energies
    separates the converging upper levels while staying readable in eV
  - Faint level guides under the arrow columns let every arrow be followed from its
    upper to its lower level
  - 'Imprint colors by spectral region on arrows and series headers, identical in
    both themes; the violet region now uses #C475FD, legible on the dark page'
  - Bokeh HoverTool on a ColumnDataSource-backed level segment shows level, energy
    and degeneracy in the HTML view
  weaknesses:
  - 'VQ-01 (both): the level labels (''n=3  (-1.51 eV)''), the Ionization label (22
    pt) and the rotated wavelength labels (20 pt) are far below the 34 pt reference
    and read small next to the 34 pt ticks → about 30-34 pt (+10 to +12 pt). Likely
    cause: Label text_font_size=''22pt'' / ''20pt''.'
  - 'CQ-04 (code): on_left = series_name == series_names[0] in the transition loop
    is assigned and never used → delete it. Likely cause: a left/right label rule
    that was removed.'
  - 'Suggestion: the Balmer header takes the Hα red although the series spans three
    colors; an INK_SOFT header would not imply a single region.'
  - 'Suggestion: UV (Lyman) and violet (Hγ, Hδ) now share #C475FD; a distinct UV color
    would keep the two regions apart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'energy-level-atomic · python · bokeh · anyplot.ai' in dark ink, y-axis 'Energy (eV)' and ticks 0.0, -0.5, -1.0, -1.5, -3.4, -5.0, -10.0, -13.6 in soft ink, subtle y grid, x axis hidden. Level labels 'n=1 (-13.60 eV)' … 'n=6 (-0.38 eV)' and 'Ionization (0 eV)' readable but small.
      Data: six #009E73 level lines in the centre on a sqrt-compressed axis, with faint green level guides extending under both arrow columns; dotted ionization line at 0 eV. Lyman arrows (#C475FD) left; Balmer arrows (red Hα, blue Hβ, violet #C475FD Hγ/Hδ) and Paschen arrows (#BD8233) right, all pointing down, each ending on a guide and carrying a rotated wavelength label; bold colored series headers on top.
