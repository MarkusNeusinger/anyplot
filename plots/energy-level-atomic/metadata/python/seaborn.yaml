review:
  strengths:
  - Scientifically correct hydrogen data computed from E_n = -13.6/n^2 with correct
    Lyman, Balmer and Paschen wavelengths
  - Series columns with color-matched bold headers and italic spectral-region subtitles
    tie each arrow group to UV, visible or infrared
  - Every wavelength label sits in a page-colored box, readable against arrows in
    both themes
  - Level labels carry quantum number and eV value side by side; dashed ionization
    line is clearly told apart from the solid level lines
  - Theme tokens threaded through sns.set_theme rc; both renders fully readable
  weaknesses:
  - 'VQ-02 (both): the page-colored boxes behind the rotated wavelength labels cut
    gaps into the level lines (486, 434, 1875 nm through n=3; 1875, 1282, 1094 nm
    through n=4; 1094 nm through n=5; 97 nm through n=2) → place each label in the
    open span of its arrow between two levels so no box crosses a level line. Likely
    cause: label y fixed at the arrow midpoint, (y_top + y_bot) / 2, with bbox facecolor=PAGE_BG.'
  - 'SC-02 (both): the energy axis has no scale markings — ax.set_yticks([]) leaves
    only an arrow and ''Energy'', against the Notes'' ''clear scale markings'' and
    the C1/C5 property → an energy axis with eV ticks (on the nonlinear scale, ticks
    that show it). Likely cause: ax.set_yticks([]) and the hand-drawn annotate axis.'
  - 'SC-03 (both): vertical position is the square root of each level''s rank, not
    a function of its energy, so the 10.2 eV gap n=1→n=2 and the 1.9 eV gap n=2→n=3
    get 4.3 and 1.8 plot units → map y from the energy itself (linear, or a monotone
    nonlinear transform of energy such as symlog). Likely cause: levels[''y''] = Y_TOP
    * np.sqrt(levels.index / len(levels)).'
  - 'VQ-01 (both): the italic spectral-region subtitles are 7 pt at alpha 0.75, below
    the 8 pt reference, and read faint, most of all on the dark surface → 8 pt at
    full opacity (+1 pt). Likely cause: fontsize=7, alpha=0.75 on the subtitle ax.text.'
  - 'VQ-05 (both): the diagram and its labels end at about 70 % of the canvas width
    and the right ~30 % is empty → widen the axes so the drawing uses the canvas (subplots_adjust
    right ≈ 0.80, about +0.14). Likely cause: fig.subplots_adjust(right=0.66) with
    xlim up to 1.2.'
  - 'VQ-06 (both): the energy axis is labeled ''Energy'' without a unit while every
    value is in eV → ''Energy (eV)''. Likely cause: the ax.text(..., ''Energy'') label.'
  - 'Suggestion: color each arrow on a continuous wavelength scale rather than per
    series, so the Balmer lines show their spectral spread.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: title 'energy-level-atomic · python · seaborn · anyplot.ai' in dark ink at the top left; level labels 'n=1 (-13.60 eV)' … 'n=6 (-0.38 eV)' and 'Ionization (0.00 eV)' to the right of the lines; a hand-drawn upward arrow with 'Energy' on the left; no ticks. All text readable; the italic region subtitles at 7 pt read faint.
      Data: six black level lines with endpoint dots, a dashed gray ionization line at the top; three tinted columns — Lyman arrows #009E73 (122/103/97 nm, down to n=1), Balmer #C475FD (656/486/434 nm, down to n=2), Paschen #4467A3 (1875/1282/1094 nm, down to n=3); rotated wavelength labels in page-colored boxes that cut small gaps into the level lines; right ~30 % of the canvas empty.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, level labels and eV values in light ink, ionization label and 'Energy' arrow in soft light gray; no dark-on-dark text. Paschen-blue labels and the 7 pt italic subtitles are the dimmest text but readable.
      Data: level lines and dots flip to light ink; arrow colors identical to the light render (#009E73, #C475FD, #4467A3); column tints switch to dark variants; label boxes in the dark page color.
      Legibility verdict: PASS
