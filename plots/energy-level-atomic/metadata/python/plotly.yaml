review:
  strengths:
  - Wavelengths computed from the level energies (λ = 1239.84 / ΔE) and all match
    the published hydrogen lines
  - Wavelength labels set vertically in their arrow's color, Lyman beside the shafts
    and the shorter series on a shared baseline below n=2, so no label touches an
    arrow
  - 'Typographic hierarchy: bold series header over italic spectral region, bold quantum
    label right and energy value left of every resolved level, one shared label for
    the crowded n=4–6'
  - Native plotly arrow annotations in data coordinates (axref/ayref) and invisible
    scatter hover targets that give per-transition tooltips in the HTML
  - Theme-adaptive chrome threaded through every element; both renders readable
  weaknesses:
  - 'SC-02 (both): arrows are colored by an arbitrary categorical hue per transition
    (Hβ 486 nm ochre, Hδ 410 nm lime, Lyman UV purple/rose/blue), neither by wavelength
    nor by spectral region as C3 asks → one color per spectral region, or the imprint_seq
    ramp over wavelength. Likely cause: the per-transition color lists in SERIES.'
  - 'VQ-07 (both): amber #DDCC77 is used as a ninth color slot for Pa-β; the style
    guide reserves the semantic anchors for their role, not as overflow → a palette
    that follows from the region or wavelength mapping above. Likely cause: AMBER
    in the Paschen color list.'
  - 'VQ-03 (both): the two Paschen arrows (gap 0.66 and 0.97 eV) render as arrowheads
    with almost no shaft, so they cannot be followed from n=4 and n=5 down to n=3
    → a smaller arrowhead for short gaps so a shaft shows. Likely cause: arrowsize=1.0
    at arrowwidth 2.5 with gap_pad shortening the arrow further.'
  - 'VQ-01 (both): the amber ''Pa-β 1282 nm'' label is faint on #FAF8F1 (contrast
    about 1.5:1), and the rose ''Ly-β'' and blue ''Ly-γ'' labels read dim on #1A1A17
    → label colors with at least 3:1 on the page. Likely cause: label font color taken
    from colors[k].'
  - 'VQ-02 (both): the ''0 eV'' of the left ionization label runs across the y-axis
    spine → end the label right of the spine. Likely cause: x=LINE_LEFT - 0.02 with
    xanchor=''right'' and a long text.'
  - 'Suggestion: label the n=4, 5, 6 lines individually at their right ends with a
    smaller font instead of one shared label above the limit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'energy-level-atomic · python · plotly · anyplot.ai' centered in dark ink; y-axis 'Energy (eV)' with ticks every 2 eV from −14 to 2; x-axis hidden; subtle horizontal grid. Level labels 'n = 1/2/3' right, energy values '-13.60/-3.40/-1.51 eV' left, combined 'n = 4, 5, 6' and '0 eV Ionization' above the dashed ionization line. All readable; the '0 eV' crosses the y-axis spine.
      Data: six partial-width level lines in INK_SOFT, dashed muted ionization line at 0 eV. Three Lyman arrows (lavender, rose, blue) down to n=1 with vertical labels beside the shafts; four Balmer arrows (red, ochre, cyan, lime) down to n=2 with vertical labels below n=2; two Paschen arrows (green #009E73, amber) to n=3 that show only as arrowheads. Series headers Lyman/Ultraviolet, Balmer/Visible, Paschen/Infrared.
      Legibility verdict: PASS (amber Pa-β label faint)

