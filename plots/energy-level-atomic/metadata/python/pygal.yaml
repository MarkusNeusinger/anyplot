review:
  strengths:
  - 'Every level is a horizontal line at its rank on an upward energy axis. Its tick
    label names both the quantum number and the true energy (n=1: −13.60 eV … n=6:
    −0.38 eV), so the nonlinear scale the Notes allow shows in the ticks and in the
    axis title (''levels evenly spaced'').'
  - Each of the 10 emission arrows starts on its upper level and ends with a filled
    arrowhead on its lower level. The arrows sit in one column per series (Lyman,
    Balmer, Paschen) and are evenly spaced, so every arrow can be followed on its
    own.
  - 'Wavelengths are computed from the level energies (λ = 1239.84 / ΔE) and match
    the textbook values: Ly-α 122 nm, Hα 656 nm, Hβ 486 nm, Pa-α 1875 nm. pd.cut sorts
    them into ultraviolet, visible and infrared, and each region gets a fitting Imprint
    hue: blue for UV, green for visible, matte red for IR.'
  - A bold colored series header ('Balmer series · visible') stands in for a legend
    and names the spectral region, and a muted ink tone for the level lines keeps
    the colored arrows in front.
  - 'The dashed ionization line at the top carries the tick label ''Ionization: 0.00
    eV'', so it reads apart from the solid level lines.'
  - 'Idiomatic pygal: an XY chart with allow_interruptions and None breaks draws all
    level lines as one series, y_labels dicts place tick labels at the levels, print_labels
    with per-point label dicts places the wavelength labels, and targeted inline CSS
    sets stroke widths and the header font. The HTML export keeps pygal''s hover tooltips.'
  weaknesses:
  - 'Suggestion: shortening the level lines so they stop just past the last arrow
    of the outermost column would make it clearer that they span only part of the
    plot width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no frame or grid.
      Chrome: bold dark title 'Hydrogen Atom · energy-level-atomic · python · pygal · anyplot.ai' centred at the top (about 75 % of the width). Rotated y-axis title 'Energy (eV), levels evenly spaced'. Tick labels 'n=1: −13.60 eV' … 'n=6: −0.38 eV' and 'Ionization: 0.00 eV' in dark ink. All readable.
      Data: six muted grey level lines, evenly spaced. A dashed ink ionization line at the top. Ten downward arrows with filled heads ending on their lower levels: three blue Lyman arrows (#4467A3) to n=1, four green Balmer arrows (#009E73) to n=2, three red Paschen arrows (#AE3030) to n=3. Grey wavelength labels ('Hα 656 nm' etc.) above each arrow's tail. Bold colored series headers above the ionization line. No overlaps, nothing clipped.
      Legibility verdict: PASS

