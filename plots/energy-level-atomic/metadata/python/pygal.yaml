review:
  strengths:
  - Each transition is a stem plus a filled arrowhead whose tip sits exactly on its
    lower level, all pointing down for emission; the three series are spread into
    their own columns so every arrow can be followed from level to level
  - Spectral regions mapped to Imprint hues in wavelength order (blue for the ultraviolet
    Lyman series, brand green for the visible Balmer series, matte red for the infrared
    Paschen series), with bold region headers in the matching color acting as the
    legend
  - 'Nonlinear, evenly spaced energy axis is stated in the axis title and every tick
    carries both the quantum number and the true energy (n=1: −13.60 eV … n=6: −0.38
    eV), with a true minus sign'
  - Dashed ionization line at 0.00 eV runs wider than the solid level lines, so the
    limit is told apart by style and extent
  - 'Factually correct data: E = −13.6/n² eV for n=1–6 and the ten line wavelengths
    (Ly-α 122 nm, Hα 656 nm, Pa-α 1875 nm, …) match the hydrogen spectrum'
  - 'Uses pygal idioms well: one XY series per family with None breaks and allow_interruptions,
    dict-valued y_labels, print_labels with dict points, stroke_style dasharray and
    inline css for per-series weights; HTML output keeps tooltips'
  weaknesses:
  - 'VQ-01 (both): the ten wavelength labels ("Hα 656 nm", "Pa-γ 1094 nm", …) are
    set at 36 px, below the 44 px tick labels, and are the smallest text on the chart
    although they carry the transition information → about 44 px (+8 px), keeping
    the labels clear of the neighbouring stems. Likely cause: LABEL_FS = 36 feeding
    value_label_font_size.'
  - 'Suggestion: build the levels and transitions as a tidy DataFrame in the data
    block and derive the pygal lists from it with .tolist(), as the library prompt''s
    data-block convention describes.'
  - 'Suggestion: compute the wavelengths from the level energies (λ = 1239.84 / ΔE
    nm) instead of typing them into the labels, so the labels follow the data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1; no grid, no x-axis (horizontal position is schematic).
      Chrome: bold dark title "Hydrogen Atom · energy-level-atomic · python · pygal · anyplot.ai" at ~75 % width; rotated y-axis title "Energy (eV, levels evenly spaced)"; dark y tick labels "n=1: −13.60 eV" … "n=6: −0.38 eV" and "Ionization: 0.00 eV"; all readable.
      Data: six muted-gray level lines spanning ~68 % of the plot width; a dashed ink ionization line at the top, wider than the levels; ten downward arrows in three columns — Lyman in #4467A3 ending on n=1, Balmer in #009E73 ending on n=2, Paschen in #AE3030 ending on n=3 — each with a soft-ink wavelength label above its upper end; bold colored series headers above the ionization line. No text collisions.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title, axis title and tick labels flip to light ink; wavelength labels in light soft gray; level lines in a light muted gray; dashed ionization line in light ink; no dark-on-dark text anywhere.
      Data: arrow and header colors identical to the light render (#4467A3, #009E73, #AE3030); brand green clearly visible.
      Legibility verdict: PASS
