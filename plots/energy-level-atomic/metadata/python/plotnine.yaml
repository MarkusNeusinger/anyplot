review:
  strengths:
  - Nonlinear sign(E)·sqrt(|E|) transform with ticks at the true eV values spreads
    the converging upper levels, as the Notes allow
  - Arrows colored by spectral region from Imprint (Lyman UV lavender, Balmer visible
    red) with the brand-green dashed ionization line clearly set apart from the level
    lines
  - Leader lines from each level end to the spread right-hand labels keep n = 5 and
    n = 6 legible
  - Wavelengths computed from the energy gaps (hc/ΔE) rather than typed in, and all
    values are physically correct
  - Idiomatic plotnine layering with arrow() on geom_segment and scale_fill_identity
    for the theme-adaptive bands
  weaknesses:
  - 'VQ-01 (both): the level labels (geom_text size 3.5), wavelength labels (3.2)
    and series titles (4) render at roughly 3–4 pt, about half the height of the 8
    pt tick labels, although they carry the diagram''s main content; in dark the #AE3030
    ''Balmer Series (Visible)'' title is also faint at that size → render them at
    about tick-label size (≈8 pt, +4 pt). Likely cause: geom_text size values chosen
    as if in mm, but this plotnine version draws them as points.'
  - 'VQ-05 (both): the x range runs to 1.18 while the level labels end near 1.03,
    leaving about 15 % of the panel width as an empty strip with grid lines running
    into it → end the x range just past the labels (about 1.05, −0.13). Likely cause:
    scale_x_continuous(limits=(0.0, 1.18)).'
  - 'Suggestion: one or two absorption (upward) arrows would show both directions
    the Notes describe.'
