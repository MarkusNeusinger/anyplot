review:
  strengths:
  - 'Physically exact hydrogen data: E_n = -13.6/n^2 eV gives -13.60, -3.40, -1.51,
    -0.85, -0.54 eV, and the labels Lyα 122 nm, Hα 656 nm and Paα 1875 nm match the
    transitions they sit on'
  - The -1/n display scale spreads out the converging upper levels while the tick
    labels give the real energies, so the nonlinear scale shows on the axis
  - Bold, series-colored direct labels below n = 1 act as the key, with italic wavelength
    labels and INK_SOFT quantum labels giving a clear type hierarchy
  - Each wavelength label sits clear of the arrows, so every arrow can be followed
    from level to level
  - 'Idiomatic ggplot2: geom_segment with grid arrow(), scale_y_continuous with custom
    breaks and labels, coord_cartesian(clip = ''off'')'
  weaknesses:
  - 'Suggestion: add one absorption transition (upward arrow) so the diagram also
    shows the absorption direction the Notes describe.'
  - 'Suggestion: extend the levels to n = 6, as in the spec''s example, to show the
    convergence toward the ionization limit more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: title 'Hydrogen Atom · energy-level-atomic · r · ggplot2 · anyplot.ai' in dark ink at about 70 % of the width; y-axis title 'Energy (eV)'; ticks -13.60, -3.40, -1.51, -0.85, -0.54 and 0 eV in INK_SOFT; quantum labels n = 1 … n = 5 on the right; 'Ionization limit (0 eV)' above a dashed line at 0 eV; no x axis. All readable.
      Data: five near-black level lines spanning about 0.08–0.90 of the x range, which now runs to 1.05, so the levels and n labels reach toward the right edge (n labels end near 91 % of the width); seven downward emission arrows: three Lyman in #009E73 ending on n = 1, two Balmer in #C475FD ending on n = 2, two Paschen in #4467A3 ending on n = 3; italic wavelength labels Lyα 122 nm, Hα 656 nm, Paα 1875 nm clear of the arrows; bold series labels in the series colors below n = 1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
