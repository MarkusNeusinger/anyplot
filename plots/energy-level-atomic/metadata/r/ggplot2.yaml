review:
  strengths:
  - 'Physically exact hydrogen data: E_n = -13.6/n^2 eV gives -13.60, -3.40, -1.51,
    -0.85, -0.54 eV, and the wavelength labels Lyα 122 nm, Hα 656 nm and Paα 1875
    nm match the transitions they sit on'
  - The -1/n display scale spreads out the converging upper levels, and the tick labels
    give the real energies at each level, so the nonlinear scale shows on the axis
  - Each wavelength label sits clear of the arrows on both sides, so every arrow can
    be followed from level to level
  - Bold, series-colored direct labels below n = 1 act as the key, with italic wavelength
    labels and INK_SOFT quantum labels giving a clear type hierarchy
  - 'Idiomatic ggplot2: geom_segment with grid arrow(), scale_y_continuous with custom
    breaks and labels, and coord_cartesian(clip = ''off'')'
  weaknesses:
  - 'VQ-05 (both): x limits run to 1.20 while the right-most content (the n labels)
    ends near 1.0, so about 15 % of the canvas width on the right holds only the dashed
    ionization line → tighten the x range to about c(-0.05, 1.05) and let the drawing
    use the width. Likely cause: scale_x_continuous(limits = c(-0.05, 1.20)).'
  - 'Suggestion: add one absorption transition (upward arrow) so the diagram also
    shows the absorption direction the Notes describe.'
  - 'Suggestion: extend the levels to n = 6, as in the spec''s example, to show the
    convergence toward the ionization limit more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: title "Hydrogen Atom · energy-level-atomic · r · ggplot2 · anyplot.ai" in dark ink at about 70 % of the width; y-axis title "Energy (eV)"; tick labels -13.60, -3.40, -1.51, -0.85, -0.54 and 0 eV in INK_SOFT; quantum labels n = 1 … n = 5 on the right; "Ionization limit (0 eV)" above a dashed line at 0 eV; no x axis. All readable.
      Data: five near-black level lines spanning about 0.08–0.90 of the x range; seven downward emission arrows spread across the width: three Lyman arrows in #009E73 ending on n = 1, two Balmer arrows in #C475FD ending on n = 2, two Paschen arrows in #4467A3 ending on n = 3; italic wavelength labels Lyα 122 nm, Hα 656 nm and Paα 1875 nm sit clear of all arrows; bold series labels in the series colors below n = 1. Right ~15 % of the width is empty except the dashed line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
