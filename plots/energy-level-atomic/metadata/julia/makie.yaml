review:
  strengths:
  - 'Correct Imprint order and theme handling: Lyman #009E73, Balmer #C475FD, Paschen
    #4467A3, identical in both renders, with all chrome threaded through INK / INK_SOFT
    / INK_MUTED tokens'
  - 'Physics computed, not typed: E_n = -13.6/n² eV gives the tick labels, and hc/ΔE
    gives the eight wavelength labels (122, 103, 97, 656, 486, 434, 1876, 1282 nm)'
  - Equal-step nonlinear energy axis with the uneven eV values as tick labels keeps
    n = 3..6 apart, as the spec allows, with a dashed muted ionization line set apart
    from the solid levels
  - Native Legend widget built from LineElement glyphs overlaid under n = 1 with tellwidth/tellheight
    = false, and current Makie 0.24 arrows2d! API
  - Data block is a DataFrame keyed by column constants, so the transitions table
    can be swapped for a user's own
  weaknesses:
  - 'Suggestion: the Paschen #4467A3 wavelength labels are the dimmest text on the
    dark background; a slightly heavier font weight for the wavelength labels would
    even out their presence across the three series.'
  - 'Suggestion: one upward absorption arrow (for example 1 -> 2) would exercise the
    spec''s emission/absorption direction distinction.'
