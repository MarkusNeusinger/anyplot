  - 'Adaptable code layout: column constants and a tidy df drive the axis labels and
    limits'
  weaknesses:
  - 'VQ-02 (both): the lower-right legend box covers two Rejected points near credit
    scores 730 and 785 at y≈0 → place the legend where it sits on no data (e.g. loc=''center
    right'', which is empty between the band and the rows). Likely cause: ax.legend(loc=''lower
    right'').'
  - 'Suggestion: the band comes from sqrt(p(1-p)/n)·2, a heuristic that does not depend
    on the distance from the data mean; a delta-method interval from the model''s
    coefficient covariance would be the actual 95% CI of the predicted probability.'
  - 'Suggestion: drawing the class-1 points in a hue other than the fit''s brand green
    would keep the curve as the single green element.'
