  strengths:
  - 'Theme tokens threaded through every chrome element: title, labels, ticks, spines,
    grid, legend frame and the annotation box all flip cleanly between #FAF8F1 and
    #1A1A17'
  - 'All spec features present: y-only jitter with per-class Imprint colors, alpha
