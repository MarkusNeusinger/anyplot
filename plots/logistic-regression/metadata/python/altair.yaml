review:
  strengths:
  - Real maximum-likelihood logistic fit with a 95 % band from the delta method on
    the logit scale, back-transformed so the band encloses the curve and stays inside
    0–1
  - Model layers (curve, band, threshold) in neutral ink tokens and the observations
    in Imprint green/purple, which keeps the fitted model apart from the two classes
    in both themes
  - Legend, axis and threshold-label chrome threaded through INK/INK_SOFT/ELEVATED_BG,
    so every text element reads in both themes
  - 'Idiomatic Altair layering: one shared x encoding across five layers, mark_area
    with y2 for the band, escaped field names with explicit type= and title='
  - Tooltip encoding on the points adds study hours and class to the HTML view
  weaknesses:
  - 'CQ-04 (code): lines 57–73 hand-roll a Newton-Raphson/IRLS logistic fit and a
    delta-method band where statsmodels computes both → `sm.GLM(passed, sm.add_constant(hours),
    family=sm.families.Binomial()).fit()` and `.get_prediction(...).summary_frame(alpha=0.05)`
    (mean, mean_ci_lower, mean_ci_upper). Likely cause: the fit and band written out
    with numpy.'
  - 'Suggestion: the gridlines at every 0.5 h and every 0.1 probability are denser
    than this chart needs; fewer x gridlines would quiet the background behind the
    band.'
  - 'Suggestion: a small annotation of the fitted midpoint (hours at p = 0.5) would
    anchor the threshold crossing, as the Notes allow coefficient annotations.'
