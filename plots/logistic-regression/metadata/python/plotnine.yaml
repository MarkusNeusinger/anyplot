review:
  strengths:
  - Fits the model with statsmodels Logit and draws the 95% band from get_prediction().conf_int(),
    so the band is the real interval of the predicted probability
  - 'Imprint positions taken by index from the full eight-hue list: Renewed #009E73,
    Not renewed #C475FD, curve #4467A3'
  - Per-layer data in a single ggplot() with column names flowing into the axis and
    legend titles
  - Points jittered on y only via position_jitter(width=0, height=0.03), so x stays
    exact
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
