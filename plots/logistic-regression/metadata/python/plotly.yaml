review:
  strengths:
  - Follows the canvas contract exactly (800x450 @ scale 4 = 3200x1800) with pinned
    margins
  - Theme tokens threaded through every chrome element; both renders fully legible
  - Axis ranges and curve span derived from the data; column constants make the data
    block swappable
  - fill='toself' CI polygon and per-trace hovertemplates give useful HTML tooltips
  - sklearn LogisticRegression fit with accuracy shown as an annotation the Notes
    suggest
  weaknesses:
  - 'SC-02 (both): the fitted curve and class-0 points share #009E73, so along y≈0
    (x 100–180) and under the class-1 row at y≈1 the curve''s plateaus disappear beneath
    the point rows (C3: curve not hidden by the points) → draw the curve in a color
    neither class uses (e.g. INK) or the class rows clearly off the curve. Likely
    cause: line color IMPRINT_PALETTE[0] equal to the class-0 marker color.'
  - 'DQ-03 (both): the 95% band is p ± 1.96·sqrt(p(1−p)/n), a binomial sampling error,
    not the confidence interval of the predicted probability, so it pinches to zero
    width at both ends instead of widening where data is sparse → compute the band
    from the model''s coefficient uncertainty (e.g. statsmodels Logit(...).fit().get_prediction(X).conf_int(),
    or the delta method on the logit scale). Likely cause: the se = 1.96 * np.sqrt(y_proba
    * (1 - y_proba) / n) line.'
  - 'Suggestion: the heavy INK_SOFT zero line at probability 0 competes with the dashed
    threshold; a lighter zero line would keep the threshold the only horizontal reference.'
  - 'Suggestion: legend entries ''Disease present = 0/1'' could read ''No disease''
    / ''Disease'' for a reader.'
