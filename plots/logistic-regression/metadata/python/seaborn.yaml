  - 'Theme tokens threaded through sns.set_theme rc (face, edge, label, tick, grid,
    legend colors) so both renders are theme-correct with identical Imprint data colors
    (#009E73 curve/class 0, #C475FD class 1)'
  - 'All five required elements present and legible: alpha-0.6 jittered class rows,
    a smooth prominent fitted curve, a semi-transparent bootstrap 95% band, and a
    dashed p=0.5 threshold subordinate to the curve'
  - Canvas at the canonical 3200x1800 with balanced 12/10/8 pt text hierarchy and
    despined axes
  - 'Data block follows the adapter convention: column constants with role comments,
    one df, and the accuracy/coefficient annotation and axis limits derived from df'
  weaknesses:
  - 'VQ-02 (both): the opaque upper-left legend box sits over about four class-1 observations
    near p=1.0 (x around -2.4 to -1.6), which show only as faint ghosts through it
    → keep the legend clear of the data rows, for example a placement outside the
    top row''s span or a lower legend frame alpha. Likely cause: ax.legend(loc="upper
    left") over the class-1 row.'
  - 'DQ-02 (both): the scenario is abstract — the x axis reads "Predictor variable
    (X)" and the classes "Class 0" / "Class 1" with no domain → a concrete neutral
    context from the spec''s Applications (e.g. credit score vs. loan default, biomarker
    level vs. diagnosis) with matching axis and class labels. Likely cause: the PREDICTOR
    constant and the legend labels.'
  - 'Suggestion: sns.regplot(logistic=True) or sns.scatterplot(hue=...) would showcase
    seaborn''s own logistic fit and hue mapping instead of plain matplotlib calls.'
