review:
  strengths:
  - Every chrome element comes from the theme tokens, including the coefficient/accuracy
    subtitle (INK_SOFT) and a 15 % rgba grid, so both renders read cleanly
  - 'Pass is drawn in brand green #009E73, matching the pass to green semantic, with
    Fail in the second Imprint position'
  - Layer order puts the fitted curve on top of the points and a borderless semi-transparent
    ribbon, so the S curve stays prominent
  - scale_color_manual with explicit breaks pins the legend order Fail / Pass
  - Exports an interactive HTML alongside the PNG, so the HTML view gets lets-plot's
    hover tooltips
  weaknesses:
  - 'DQ-03 (both): the band is not a 95 % confidence interval of the fitted probability:
    se = sqrt(p(1-p)/n) * 2 is a Bernoulli-variance proxy with an arbitrary factor
    2, so the band is widest at p = 0.5 (about ±0.14) and collapses to zero width
    at both ends where the data is sparsest → the delta-method interval on the logit
    scale, for example statsmodels `sm.Logit(y, sm.add_constant(X)).fit().get_prediction(sm.add_constant(grid)).conf_int()`
    or expit(eta ± 1.96·se_eta). Likely cause: the line `se = np.sqrt(prob * (1 -
    prob) / len(observed)) * 2`.'
  - 'DE-02 (both): the panel keeps a four-sided frame (top and right borders visible),
    against the style guide''s spine rule → left and bottom axis lines only. Likely
    cause: the panel border is not set to element_blank() in the theme.'
  - 'Suggestion: give the legend keys the ELEVATED_BG fill (legend_key=element_rect(...))
    so the faint square behind each glyph disappears.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800, panel framed on all four sides
      Chrome: title 'logistic-regression · python · letsplot · anyplot.ai' in dark ink, subtitle 'Coefficient: 1.37 | Accuracy: 90.0%' in soft dark gray, axis titles 'Study hours' / 'Probability', ticks 0-10 and 0-1; subtle 15 % grid; legend 'Class' at right (Fail, Pass). All readable.
      Data: Fail points purple #C475FD jittered around 0, Pass points green #009E73 jittered around 1, alpha 0.6; solid green S curve on top; pale green semi-transparent band widest around x = 5 and pinched at the ends; gray dashed line at 0.5 across the full width
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
