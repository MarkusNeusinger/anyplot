review:
  strengths:
  - Genuine Wald 95% band computed on the logit scale, so it encloses the curve everywhere
    and widens naturally toward the sparse ends
  - Points sit at their exact x values with y-only jitter and alpha 0.6, so dense
    stretches read darker
  - 'Full theme adaptation: all chrome from INK / INK_SOFT tokens, data colors identical
    in both renders'
  - Native varea band and Span threshold bound to ColumnDataSources built from tidy
    frames
  - Text sized for the 3200x1800 canvas with explicit min_border reservations; nothing
    clipped
  weaknesses:
  - 'VQ-03 (both): class-0 points, the fitted curve and the band all use #009E73,
    so between Test Score 20 and 40 the curve''s low tail runs through the class-0
    row and the two read as one green mass; the legend''s class dots are also about
    a third of the 22 px markers → give the curve and band a color no class uses (for
    example INK) and match the legend glyph size to the markers. Likely cause: line_color
    and fill_color=IMPRINT_PALETTE[0] reused for the class loop''s i=0, legend glyph
    size left at default.'
  - 'CQ-04 (code): lines 59-66 write out the Fisher information inverse and the delta-method
    logit SE by hand → statsmodels `sm.Logit(outcome, sm.add_constant(x)).fit()` and
    `.get_prediction(sm.add_constant(x_curve)).conf_int()` compute the same band.
    Likely cause: fitting with sklearn LogisticRegression, which exposes no covariance.'
  - 'Suggestion: a HoverTool on the observations (score, outcome, fitted probability)
    would add value to the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape.
      Chrome: bold title "logistic-regression · python · bokeh · anyplot.ai" top-left in dark INK; italic axis titles "Test Score" and "Probability of Passing"; tick labels 20-80 and 0-1 in INK_SOFT; faint grid; thin outline. Legend mid-left on an elevated panel (95% CI, Class 0 (Failed), Class 1 (Passed), Logistic Curve). Bold "Model Accuracy: 88.5%" upper left, "Decision Threshold (p=0.5)" right-aligned above the dashed line. All readable.
      Data: class-0 points in #009E73 jittered around 0, class-1 points in #C475FD around 1, alpha 0.6 with page-colored outlines; green S-curve (#009E73, thick) inside a light-green semi-transparent band that widens in the middle and narrows at the tails; dashed INK_SOFT line at 0.5 across the full width. Class-0 points share the curve's green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
