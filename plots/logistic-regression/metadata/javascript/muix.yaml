review:
  strengths:
  - 'Every ''A good version shows'' property is met: y-only jitter rows near 0 and
    1, ~0.6 alpha points, a smooth 3 px S-curve, a translucent 95% CI band that encloses
    the curve, and a dashed 0.5 threshold across the whole x range'
  - The fit and the Wald CI are computed from the data (fitted midpoint 54.5 vs generating
    55), and the CI is built on the logit scale so it stays inside [0, 1]
  - useXScale/useYScale hooks feed a custom SVG layer (band, curve, midpoint ring)
    inside the ChartsContainer composition, with ChartsReferenceLine for the threshold
  - 'Curve and band use the ink token so they flip cleanly between themes while class
    colors (green #009E73 / red #AE3030 semantic pair) stay identical'
  - Legend and annotations sit in empty regions of the plot, leaving the data unobstructed
    in both renders
  weaknesses:
  - 'Suggestion: render the legend with the native ChartsLegend (inside ChartsDataProvider)
    for the two class series instead of the hand-built HTML block, keeping only the
    curve entry custom.'
  - 'Suggestion: draw the legend''s class dots with the same ~0.6 alpha as the scatter
    marks so swatch and marks match exactly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "logistic-regression · javascript · muix · anyplot.ai" centred at top; y axis "Probability" with ticks 0.0-1.0, x axis "Customer engagement score" with ticks 0-100; subtle horizontal grid; all text dark and readable. Legend upper-left inside the plot (Not converted / Converted / Fitted probability (95% CI)); inline "Decision threshold (p = 0.5)" label; "Midpoint ≈ 54.5 / Accuracy at p=0.5: 89%" annotation left of the curve.
      Data: ~180 points, red #AE3030 (not converted) jittered around 0, green #009E73 (converted) jittered around 1, both semi-transparent; near-black smooth S-curve with a light grey CI band; dashed threshold line at 0.5; hollow ring at the curve/threshold crossing.
