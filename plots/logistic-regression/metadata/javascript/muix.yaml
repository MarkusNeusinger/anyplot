      Data: Maroon jittered scatter near y=0 (class 0), teal-green jittered scatter near y=1 (class 1), black sigmoid curve (~3px), light-gray 95% CI band, dashed threshold line at p=0.5 with open-circle inflection marker and two-line annotation. First categorical series (Converted) uses #009E73 brand green.
