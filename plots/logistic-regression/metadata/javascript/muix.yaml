review:
  strengths:
  - Fits an actual logistic regression via batch gradient descent and derives a real
    95% Wald confidence interval from the observed Fisher information — not fabricated/hard-coded
    curve data.
  - Custom ConfidenceBand component built with the useXScale/useYScale hooks to draw
    a filled uncertainty band directly in data-to-pixel space — a genuinely MUI-X-specific
    technique, not reachable via the top-level <LineChart>/<ScatterChart> API.
  - 'Thoughtful semantic color mapping: ''Converted'' uses brand green (#009E73) and
    ''Not converted'' uses the matte-red semantic anchor (#AE3030) — matching the
    Imprint style guide''s documented good/bad semantic-exception pattern rather than
    arbitrary ordinal colors.'
  - Deterministic, seeded LCG data generation (no Math.random()), correct for the
    offline browser harness.
  - All font sizes explicitly set (title 22px scaled for length, axis 16px, ticks/legend
    14px) and theme-adaptive chrome (ink/inkSoft) is threaded through every text element
    — both renders are cleanly readable.
  - Correct title format, correct legend labels, dashed p=0.5 decision-threshold reference
    line exactly as the spec requests.
  weaknesses:
  - 'Legend swatches for the two scatter series (''Not converted'', ''Converted'')
    render as thin horizontal bars (itemMarkHeight: 4 applied globally) rather than
    circular dots matching the actual scatter markers — a small mismatch between legend
    iconography and the data it represents; consider per-series markType/legend styling
    so scatter series get round swatches.'
  - 'Design Excellence is only at the ''well-configured default'' tier: the composition
    (curve + band + jittered scatter + dashed threshold) is a fairly standard statistical-plot
    layout without an extra distinguishing visual touch (e.g. a subtle callout of
    the decision midpoint, or emphasis styling on the curve where it crosses p=0.5).'
  - The spec's optional suggestion to display model coefficients or an accuracy metric
    as an annotation was not taken up — a small text annotation near the curve's inflection
    point (e.g. midpoint engagement score, or classification accuracy at the 0.5 threshold)
    would meaningfully strengthen the data-storytelling score.
  - Scatter clusters in the x=40-60 range show moderate overplotting even with jitter
    and alpha=0.6 — a touch more jitter spread or slightly smaller markers in that
    dense band would improve individual point visibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Customer Conversion · logistic-regression · javascript · muix · anyplot.ai" is bold dark text, clearly legible, centered, occupying roughly 60-65% of canvas width. X-axis label "Customer Engagement Score" and y-axis label "Probability" are dark and readable. Tick labels (0, 20, 40, 60, 80, 100 / 0.0-1.0) are medium-gray and readable. Horizontal gridlines are thin and subtle. Legend (top-right, no box frame) reads "Not converted (y = 0)", "Converted (y = 1)", "Fitted probability" and is fully legible.
      Data: Red/matte-red jittered points cluster near y=0 (mostly x<50, some scattered through x=70), green jittered points cluster near y=1 (mostly x>35). A black sigmoid curve rises smoothly from near 0 to near 1, crossing the dashed "Decision threshold (p = 0.5)" line at roughly x=55. A light-gray semi-transparent confidence band surrounds the curve, widening slightly at the edges. First class color (Converted) is #009E73 as required; Not-converted uses the matte-red semantic anchor, a documented semantic exception for a bad/negative outcome.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or overlap issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — reads essentially black on screen but is driven by the correct theme token, not a custom color, and not pure white.
      Chrome: Title, axis labels, and tick labels all render in light/off-white text, clearly legible against the dark background. Gridlines are faint but visible. Legend text is light-colored and fully readable. No dark-on-dark text was found anywhere (title, axis titles, ticks, legend, and the "Decision threshold" label are all rendered in light ink/inkSoft tones).
      Data: Data colors are identical to the light render — same matte-red and brand-green scatter colors, same white/light curve (curve flips to white ink for contrast, band flips to light-gray fill), confirming only chrome flipped and categorical data hues stayed constant.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
