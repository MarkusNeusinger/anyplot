review:
  strengths:
  - Custom SVG overlays (ConfidenceBand, InflectionAnnotation) built with useXScale/useYScale
    hooks demonstrate real MUI X mastery beyond the declarative chart API.
  - 'Every spec-required feature is present: jittered scatter, smooth sigmoid curve,
    95% CI band, dashed p=0.5 threshold line, and a model-summary annotation (midpoint
    + accuracy).'
  - Hand-built legend with per-series accurate swatches (circles for scatter, a stroke
    for the line) instead of MUI's default uniform bar swatches.
  - 'Correct palette/theme handling: brand green for the positive class, identical
    data colors across themes, chrome correctly re-tokenized in dark mode.'
  - Deterministic, self-contained implementation - seeded LCG for data, and a from-scratch
    gradient-descent logistic fit with Wald confidence intervals, no external stats
    dependency needed in the browser.
  weaknesses:
  - The midpoint/accuracy annotation sits partly inside the confidence-band shading
    in both themes, softening contrast slightly - consider anchoring it just above
    the band (e.g. around y=0.85-0.9 at this x).
  - Code carries more helper functions/components (fitLogisticRegression, predictWithCI,
    hexToRgba, ConfidenceBand, InflectionAnnotation) than a minimal KISS script would
    - most are justified by the manual logistic fit and MUI X's hook-based overlay
    pattern, but hexToRgba could be inlined via a template literal.
  image_description: |-
