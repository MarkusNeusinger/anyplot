review:
  strengths:
  - Composes the chart from ChartsContainer + ScatterPlot + ChartsReferenceLine and
    draws the sigmoid and its 95% band as an SVG overlay through useXScale/useYScale,
    so curve, band and points share the axes exactly
  - Confidence band computed properly on the logit scale from the Fisher-information
    covariance and back-transformed, so it stays inside [0,1] and widens toward the
    sparse ends
  - 'Theme-adaptive chrome: the curve and band use t.ink (black on light, white on
    dark) while the class colors stay identical across renders; all text is readable
    in both themes'
  - Points carry ~0.6 alpha with small y-jitter around 0 and 1 at their exact x values,
    and the classes overlap realistically between scores 40 and 70
  - The open circle marking the 50% crossing on the threshold line, with the midpoint
    and accuracy annotation the Notes invite, gives the eye a focal point
  - Plausible marketing-conversion scenario (customer engagement score vs. converted)
    with deterministic LCG data
  weaknesses:
  - 'VQ-05 (both): the legend is squeezed into the top-right corner of the title band,
    its first entry ''Not converted (y = 0)'' sits about 6 CSS px below the canvas
    top edge, far from the plot it explains → give it at least ~16 px top clearance
    (+10 px) or move it into the plot''s empty upper-left area via the chart margin.
    Likely cause: the absolutely positioned legend div at top:50% inside the 64 px
    TITLE_HEIGHT band with three stacked rows.'
  - 'CQ-04 (code): lines 84–106 build a generic outcome-discovery and palette-slot
    allocation loop (outcomeBins, usedPalette, nextSlot) for an outcome that is binary
    by definition and whose two colors are already fixed in SEMANTIC_COLORS → map
    0/1 straight to SEMANTIC_COLORS and the two labels (about 20 lines shorter). Likely
    cause: over-generalised class handling.'
  - 'Suggestion: MUI X''s own ChartsLegend inside the composition would replace the
    hand-built HTML legend and show the library''s legend idiom.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: centered bold title "logistic-regression · javascript · muix · anyplot.ai" in dark ink; x-axis "Customer engagement score" (0–100), y-axis "Probability" with ticks 0.0–1.0; dark-gray tick labels, subtle horizontal gridlines, left and bottom axis lines only. Legend in the top-right corner of the title band (Not converted red dot, Converted green dot, black line "Fitted probability (95% CI)"); its top entry sits very close to the canvas top edge but is not clipped. All text readable.
      Data: ~180 points, red (y = 0) jittered around 0 and brand green #009E73 (y = 1) jittered around 1, both at ~0.6 alpha; a smooth black S-curve (~3 px) with a light-gray semi-transparent 95% band that widens in the transition; dashed gray threshold line at 0.5 labelled "Decision threshold (p = 0.5)"; an open circle at the curve's 0.5 crossing with the annotation "Midpoint ≈ 54.5 / Accuracy at p=0.5: 89%".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles, tick labels, legend and annotations all in light ink; gridlines subtle dark-gray but visible; no dark-on-dark text.
      Data: point colors identical to the light render (red and #009E73); the curve and band flip to white / translucent light gray, the threshold line to light gray dashes. Brand green clearly visible.
      Legibility verdict: PASS
