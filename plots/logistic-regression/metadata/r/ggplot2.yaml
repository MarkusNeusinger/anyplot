review:
  strengths:
  - Confidence band computed on the link scale with predict(type = "link", se.fit
    = TRUE) and back-transformed with plogis, so it stays inside 0..1 and widens naturally
    at the sparse ends
  - 'Curve and band in neutral ink tokens keep the model visually separate from the
    two Imprint class colors (#009E73, #C475FD)'
  - Legend placed inside the panel with legend.position.inside in the empty region
    between the two point rows
  - Points jittered along y only, so every observation keeps its exact x value
  - 'Chrome fully theme-adaptive: 15% ink grid, no spines, readable text in both renders'
  weaknesses:
  - 'VQ-06 (both): the x-axis title ''Biomarker level'' carries no unit → a named
    marker with its unit, e.g. ''CRP (mg/L)''. Likely cause: the BIOMARKER column
    constant.'
  - 'DQ-02 (both): the predictor is the generic ''Biomarker level'' with no named
    marker, so the medical scenario reads abstract → name a real marker (e.g. ''Serum
    CRP'' or ''Troponin''). Likely cause: the BIOMARKER constant and the data comment.'
  - 'DQ-03 (both): biomarker values reach about -1.0 and -0.4 on the x axis, impossible
    for a concentration → strictly positive values, e.g. a log-normal draw (rlnorm)
    or a mean/sd that keeps the range above 0. Likely cause: rnorm(n, mean = 5, sd
    = 2).'
  - 'Suggestion: a small annotation of the fitted coefficients or accuracy, which
    the Notes allow, would add context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no spines, faint 15% ink grid.
      Chrome: title 'logistic-regression · r · ggplot2 · anyplot.ai' top-left in dark ink (~50% width); axis titles 'Biomarker level' and 'Probability' and ticks (0, 4, 8; 0.00-1.00) in dark grey; inside legend 'Status' (No Disease / Disease) on an elevated box upper-left. All readable.
      Data: 150 points in two jittered rows near 0 (green #009E73, No Disease) and 1 (lavender #C475FD, Disease) at alpha 0.6; near-black S-curve rising through 0.5 near x=2.9; light grey 95% band widening at the ends; dashed grey line at 0.5 across the full width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and ticks in light ink; legend box on #242420 with light text; grid faint. No dark-on-dark text.
      Data: point colors identical to the light render; curve flips to light ink #F0EFE8, band to a translucent light grey, dashed line light grey - all clearly visible.
      Legibility verdict: PASS
