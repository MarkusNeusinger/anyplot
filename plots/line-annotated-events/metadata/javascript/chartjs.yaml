review:
  strengths:
  - Custom afterDraw plugin cleanly implements dashed vertical event lines and text
    labels since Chart.js core has no annotation plugin — a native, non-hacky extension
    rather than a workaround.
  - Row-alternating label placement (3 rows, modulo index) avoids overlap even with
    7 tightly spaced events, and the dashed lines are deliberately started below the
    label band so dashes never cross text.
  - Y-axis headroom is computed from the data range (28% padding above max) specifically
    to leave room for the label band — no annotation collides with the price line's
    peak.
  - 'Palette compliance is clean and theme-correct: brand green (#009E73) for the
    price series, lavender (#C475FD, palette[1]) for event markers, both identical
    across light/dark; only chrome (background, dashed line ink, text) flips.'
  - Deterministic fixed-seed LCG produces a realistic, plausible fictional stock trajectory
    with quarterly earnings and other milestones — a neutral, real-world-plausible
    dataset.
  - 'pointRadius: 0 on the 252-point line plus prominent triangle markers on the 7
    event points is well-matched density handling.'
  weaknesses:
  - Legend shows 'Event' before 'Closing Price' because the Event dataset has a lower
    `order` value (1 vs 2), which also reorders the legend — flip so the primary price
    series reads first, matching dataset array order and typical reading expectation.
  - Y-axis gridlines use the plain default grid styling while the event lines get
    a deliberate dashed treatment — consider lightening/thinning the y-grid slightly
    further so the two guide-line systems feel like one cohesive design language (Visual
    Refinement).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light surface, not pure white.
      Chrome: Dark title "line-annotated-events · javascript · chartjs · anyplot.ai" centered at top, legend swatches ("Event" lavender, "Closing Price" green) below it, dark axis titles ("Trading Date", "Closing Price (USD)") and dark tick labels — all clearly legible against the light background. Grey dashed vertical lines mark event dates with dark, bold event-name labels placed in one of three alternating rows above the chart area so none of the 7 labels overlap each other or the legend.
      Data: Green (#009E73) line for the 252-point daily closing-price series, purple/lavender (#C475FD) triangle markers at the 7 event points sitting directly on the line. Y-axis grid is a subtle light-grey horizontal grid; x-axis grid is hidden.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark surface, not pure black.
      Chrome: Title, legend text, axis titles and tick labels all rendered in light/white ink, clearly readable against the dark background — no dark-on-dark issues anywhere. The grey dashed event lines and their bold light-colored labels remain fully legible in the same alternating-row layout as the light render.
      Data: Same green line and lavender triangle markers as the light render — confirmed identical data colors between the two themes; only the background, grid, and text colors flipped.
      Legibility verdict: PASS
