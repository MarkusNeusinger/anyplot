review:
  strengths:
  - Every event is a native ChartsReferenceLine child of LineChart at its own x date,
    with labelAlign="start" and a per-event spacing offset that alternates labels
    between two rows so the closely spaced Service outage / API v2 launch pair never
    collides
  - 'Event markers are dashed inkSoft lines at 1.75 px, clearly distinct from the
    3 px brand-green #009E73 data line and visible on both #FAF8F1 and #1A1A17 without
    overpowering it'
  - An 18 % y headroom computed from the data reserves a band above the series for
    the label rows, so no label covers the data line
  - 'The time axis uses scaleType "time" with a context-aware valueFormatter: short
    month names on ticks, full dates in the HTML tooltip'
  - Data generation ties each event to its effect (lasting steps on launches, a dip
    that halves daily after the outage), so event and trend correlate visibly; seeded
    LCG keeps it deterministic
  - Theme tokens threaded through title, subtitle, tick, axis-label, grid and reference-line
    styles; both renders fully legible
  weaknesses:
  - 'CQ-04 (code): lines 68–73 write out a while loop that builds monthTicks by hand
    → pass tickInterval: (d: Date) => d.getDate() === 1 on the time x axis, which
    MUI X evaluates on the daily data and gives the same month-start ticks. Likely
    cause: tickInterval given an array instead of its filter-function form.'
  - 'Suggestion: the 64 px x-axis band leaves a wide gap between the month ticks and
    the "Date" title; a slightly smaller band would tighten the bottom.'
  - 'Suggestion: a short date in each event label ("Beta launch · Feb 4") would help
    readers place events precisely in the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, 3200x1800.
      Chrome: bold title "line-annotated-events · javascript · muix · anyplot.ai" centred at top in dark ink, grey subtitle "270 days, Jan 1, 2025 – Sep 27, 2025 · 5 events, each a dashed line at its date"; y axis "Daily active users (thousands)" with ticks 40–115, x axis "Date" with month ticks Jan–Sep; subtle horizontal grid. All text dark on light and readable.
      Data: one 3 px #009E73 line rising from ~42k to ~107k in steps; five dashed dark-grey vertical event lines (Beta launch early Feb, Mobile app release early Apr, Service outage mid May with a sharp dip to ~60k, API v2 launch mid Jun, Enterprise tier mid Aug), bold dark labels right of each line alternating between two rows in the headroom above the data; no label overlaps another label or the line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, tick labels, axis titles and event labels in light ink; grid subtle dark grey; no dark-on-dark text anywhere.
      Data: line colour #009E73 identical to light render; event lines flip to light grey dashed, still distinct from the green line and visible; same label layout.
      Legibility verdict: PASS
