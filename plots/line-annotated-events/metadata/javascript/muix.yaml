review:
  strengths:
  - Native ChartsReferenceLine marks each of the 5 events at its exact date with a
    dashed inkSoft stroke, clearly distinct from the brand-green data line and legible
    in both themes
  - Consecutive event labels alternate between two rows (spacing.y offset) inside
    computed y headroom (Y_HEADROOM_SHARE), so close neighbours like Service outage
    and API v2 launch never collide and no label touches the data line
  - 'Data story is coherent: each launch produces a visible step and the outage a
    sharp dip that recovers, so every marker visibly correlates with the series'
  - Time-scale x axis with explicit first-of-month ticks and a context-aware valueFormatter
    (short month on ticks, full date in the tooltip) for the interactive HTML
  - Muted subtitle gives span and event count, a clear two-level header hierarchy
    above the chart
  weaknesses:
  - 'Suggestion: the event label rows could pull a little closer to the top of the
    line''s range to trim the empty headroom above 115.'
  - 'Suggestion: a slightly thinner data stroke (about 2.5 px) would let the step
    changes at each event read as sharper edges.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "line-annotated-events · javascript · muix · anyplot.ai" centred at top (~34% width) with a muted subtitle "270 days, Jan 1, 2025 – Sep 27, 2025 · 5 events, each a dashed line at its date"; y axis "Daily active users (thousands)" 40–115, x axis "Date" with month ticks Jan–Sep; subtle horizontal grid only. All text dark and readable.
      Data: one brand-green #009E73 line rising from ~42 to ~106 with steps at each launch and a dip to ~60 on the outage; five dashed dark-grey vertical lines labelled Beta launch, Mobile app release, Service outage, API v2 launch, Enterprise tier in bold, alternating between two rows in the headroom above the data.
