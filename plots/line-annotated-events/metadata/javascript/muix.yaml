review:
  strengths:
  - Alternating top/bottom + start/end label placement for the 4 reference lines avoids
    any overlap between labels or with the data line
  - Fully explicit font sizing (dynamic title scaling, 14/16px labels) with confirmed
    legibility in both light and dark themes; correct Imprint palette and theme-adaptive
    chrome throughout
  - Deterministic LCG-based data generation produces a realistic product-growth narrative
    where each event date visibly coincides with a step-up in the DAU trend
  - 'Idiomatic MUI X usage: dataset-driven series, valueFormatter, custom tickInterval
    for the time axis, ChartsReferenceLine for event annotations'
  weaknesses:
  - All 4 events are positive step-ups; add at least one event with a negative or
    neutral impact (e.g., an outage or a temporary dip) to fully cover the spec's
    feature range (its own examples include equipment failures/policy changes that
    can decrease the metric)
  - Design reads close to a well-configured MUI X default beyond the required annotations
    - consider a more deliberate visual accent (e.g., a subtle shaded band after an
    event, or varying the reference-line treatment) to lift it above 'correct but
    standard'
