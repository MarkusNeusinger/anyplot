      Background: Warm off-white (#FAF8F1), not pure white, not dark — matches the light chrome spec.
      Chrome: Title "line-annotated-events · javascript · echarts · anyplot.ai" is centered in dark ink text, clearly legible. Y-axis title "Daily Active Users" (rotated) and both axis tick labels (Feb-Dec on x, 0k-30k on y) render in soft dark gray, all readable against the light background. Horizontal gridlines are subtle light gray, vertical gridlines are correctly disabled to reduce clutter (only the 5 dashed purple event lines interrupt the plot area).
      Data: DAU line is Imprint brand green (#009E73), 3px width, no per-point symbols (appropriate for a 252-point dense series). Five event markers are solid violet circles (12px) sitting on dashed violet vertical lines, each paired with a black-ink text label ("v2.0 Launch", "Referral Program", "Mobile App Release", "Premium Tier", "Holiday Campaign") alternating above/below the marker.
      Legibility verdict: PASS — all text is clearly readable, no light-on-light issues; two labels (Referral Program, Premium Tier) sit close to the line/marker but no pixels are obscured or clipped.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light — matches the dark chrome spec.
      Chrome: Title, axis titles, and tick labels all flip to light/off-white ink and remain clearly legible against the dark background — no dark-on-dark failures observed. Gridlines remain subtle but visible as light gray on the dark surface.
      Data: Line and marker colors are pixel-identical to the light render — same brand green trend line, same violet event markers/dashed lines — confirming only chrome (background + text + grid) adapted to the theme, not data colors.
      Legibility verdict: PASS — all text is clearly readable in dark mode, no dark-on-dark text; brand green remains vivid and distinguishable from the violet accent color on the dark surface.
