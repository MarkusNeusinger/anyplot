review:
  strengths:
  - Every event gets a dashed rule from its marker down to the x-axis at its own date,
    coloured by event type, with a legend that explains the three types
  - Alternating marker heights keep all six bold labels apart and clear of the price
    line in both themes
  - 'One shared alt.Color encoding with an explicit domain drives rules, markers and
    legend consistently in Imprint order after the #009E73 line'
  - Tooltips with typed alt.Tooltip fields and .interactive() give the HTML hover
    details and zoom
  weaknesses:
  - 'VQ-03 (both): the legend swatches render paler than the event markers and without
    their ink outline, so the Product swatch in particular reads dim on the dark background
    → swatches at the markers'' full opacity with the same stroke. Likely cause: legend
    symbols inherit the rules'' opacity=0.7 and no symbolStrokeColor/symbolOpacity
    is set in configure_legend.'
  - 'Suggestion: the blue Product rule at opacity 0.7 is the faintest element on the
    dark background; a slightly higher rule opacity would even out the three event
    types.'
