review:
  strengths:
  - Event labels are drawn natively through pygal's per-point value dicts and print_values,
    each in its marker's color and placed beside the top dot of its dashed line
  - Alternating label heights keep the close Mar/Apr pair (CDN migration, Cache rewrite)
    apart
  - pygal.DateTimeLine with real datetimes and month ticks via x_value_formatter;
    no interpolation, so the line passes exactly through the daily values
  - Data built so each deploy produces a readable step change in p95 latency, with
    one no-change release
  - Full theme adaptation through the Style object; Imprint colors identical in both
    renders
  - 'Clean adaptable structure: column constants with role comments, one Data block
    binding df'
  weaknesses:
  - 'VQ-02 (both): the ''v2.4 release'' label sits on the Feb–Mar peaks of the data
    line (text baseline ~360 ms vs peaks at ~358 ms, a few px apart) → keep every
    label clear of the line by at least one text height (≈ +20 ms of head room for
    the lower label row). Likely cause: head_room = max * 1.04 places the lower label
    row (label_heights[0] = 0.0) right on the series maximum.'
  - 'Suggestion: the six-entry legend repeats the five on-chart event labels; a single
    ''Deploy'' key entry (one event type) would be lighter.'
  - 'Suggestion: the y range runs to ~465 ms while the highest label sits at ~415
    ms; trimming y_high would give the data a little more height.'
