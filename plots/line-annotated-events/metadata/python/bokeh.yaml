review:
  strengths:
  - Every event is a dashed Imprint-purple Span at its own date, clearly distinct
    from the solid green data line and visible in both themes without overpowering
    it
  - Labels alternate between two tiers above the data range, so the close Server Upgrade
    / API v2 Release pair never collide and no label covers the line
  - The last label switches to right alignment near the right edge, keeping it inside
    the plot and unambiguously beside its marker
  - Event dots are placed on the line by np.interp and ringed in the page color, so
    the point where each event meets the series reads cleanly
  - Native bokeh annotation models (Span, Label with background fill) and a vline
    HoverTool with a datetime formatter for inspection in the HTML output
  - Theme tokens threaded through title, axes, ticks, grid and label backings; both
    renders are fully legible
  weaknesses:
  - 'Suggestion: a slightly heavier data line (line_width about 6–7) would give the
    series more presence against the five dashed spans in the 400 px thumbnail.'
  - 'Suggestion: the y range tops out around 212 while the data ends at 183; the 200
    gridline sits in the label band and could be dropped by tightening the upper tier
    spacing.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: bold dark title "line-annotated-events · python · bokeh · anyplot.ai" top-left (~55% width); x-axis "Date" with Jan–Nov 2024 ticks, y-axis "Active Users (thousands)" with 100–200 ticks; subtle horizontal grid only, no outline. All readable.
      Data: one green #009E73 daily line rising from ~100 to ~183 over 2024; five dashed purple #C475FD vertical spans at Feb 15, May 1, Jul 20, Sep 10, Nov 25, each with a purple dot on the line; bold dark labels in two alternating tiers above the data (Pricing Change, Feature Update, Server Upgrade, API v2 Release, Mobile App Launch — the last right-aligned to the left of its span).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
