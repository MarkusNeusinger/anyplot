review:
  strengths:
  - Every event is a dashed Imprint-purple Span at its own date with a dot where it
    meets the line, so the markers stand clear of the green data line in both themes
    without overpowering it
  - Labels alternate between two tiers above the data, and the event near the right
    edge flips to a right-aligned label left of its line, so no label covers the line,
    another label or the canvas edge
  - Bold INK event labels on page-coloured plates set a clear hierarchy above the
    INK_SOFT ticks; vertical grid lines are removed so the event spans are the only
    verticals
  - Native bokeh annotation models (Span, Label) and a HoverTool in vline mode with
    a datetime formatter give exact date and value read-outs in the HTML view
  - The y range leaves headroom computed from the data for the label tiers, and the
    data and event tables share one tidy df read through the column constants
  weaknesses:
  - 'DQ-02 (both): the first event, ''Product Launch'' on 2024-02-15, comes after
    the series already shows about 100–112 thousand active users from 1 January, so
    the product had users before it launched → an event that fits an existing product
    (for example ''Pricing Change'' or ''Referral Program''). Likely cause: the EVENT_LABEL
    list in the data block.'
  - 'Suggestion: shade the weeks after one key event (for example the API v2 release
    that precedes the autumn acceleration) to give the chart one focal point.'
  - 'Suggestion: pass the event dates and labels through a ColumnDataSource and add
    a HoverTool on the event dots so the HTML view names each event on hover.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot area and border, no pure white.
      Chrome: bold title "line-annotated-events · python · bokeh · anyplot.ai" top left (about 55 % of the width), italic axis titles "Date" and "Active Users (thousands)", month ticks Jan 2024–Nov 2024 and y ticks 100–200 in dark grey INK_SOFT; subtle horizontal grid only, left and bottom axis lines; all text readable dark on light.
      Data: one #009E73 green line rising from about 100 to 183 thousand over 2024, with a step up after July and an acceleration from October. Five dashed #C475FD purple vertical spans at Feb 15, May 1, Jul 20, Sep 10 and Nov 25, each with a purple dot (page-coloured outline) on the line. Bold dark labels alternate between two heights above the data: Product Launch, Server Upgrade and Mobile App Launch on the lower tier, Feature Update and API v2 Release on the upper tier; Mobile App Launch is right-aligned left of its line. No label touches the line or another label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
