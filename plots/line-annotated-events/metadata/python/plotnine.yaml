review:
  strengths:
  - Event layers (geom_vline, geom_point, geom_text) each take their own data= frame,
    the idiomatic grammar-of-graphics way to overlay annotations
  - Alternating label heights keep all five event labels clear of each other and of
    the data line in both themes
  - Dashed purple event lines are distinct from the green data line without overpowering
    it
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'DE-02 (both): all four spines are drawn as a full box around the panel, which
    a line chart does not need → keep only the left and bottom spines (L-shaped frame)
    per the style guide. Likely cause: panel_border=element_rect(color=INK_SOFT) in
    theme().'
  - 'Suggestion: thousands separators on the y-axis tick labels (50,000) would read
    faster than 50000.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas.
      Chrome: bold title "line-annotated-events · python · plotnine · anyplot.ai" in dark ink, ~63% of width; axis titles "Date" and "Daily Visitors (count)"; y ticks 40000-55000, x ticks Feb-Dec 2024 rotated 45°; subtle grid; full four-sided panel border in INK_SOFT. All text readable.
      Data: green #009E73 daily line with a strong weekly zigzag, seasonal dip into Oct and recovery in Dec; five dashed purple #C475FD vertical lines with diamond markers at alternating heights (~54.6k / ~53.5k) and bold dark labels above each marker: v2.0 Release, Mobile App Launch, API Update, Enterprise Tier, Holiday Campaign. No label overlaps another label or the line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink; tick labels in light grey INK_SOFT; grid subtle; light panel border. No dark-on-dark text.
      Data: green line and purple event lines/diamonds identical to the light render; event labels in light ink, clearly readable.
      Legibility verdict: PASS
