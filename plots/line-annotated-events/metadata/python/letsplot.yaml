review:
  strengths:
  - One brand-green data line with every one of the five launches marked by a dashed
    INK_MUTED vertical line at its own date, clearly distinct from the line in both
    themes
  - Event labels sit just right of their marker with a small diamond anchor and alternate
    between two heights, so Team Workspaces and API v2.0 never collide with their
    neighbours and no label covers the data line
  - Hollow page-filled event points on the series show the value at each launch, and
    the generated step increases make each launch read as a visible jump
  - Native layer_tooltips on both the event lines (event name + date) and the data
    line (date + formatted users) add real inspection value in the HTML output
  - 'Chrome is fully theme-tokenised: warm #FAF8F1 / #1A1A17 surfaces, INK/INK_SOFT
    text, subtle horizontal-only grid, all readable in both renders'
  weaknesses:
  - 'Suggestion: the label text is padded with two leading spaces to clear the diamond;
    geom_text''s nudge_x would express that offset directly.'
  - 'Suggestion: the y-axis headroom above the labels (9,500 to 10,000) is unused;
    trimming the upper limit slightly would give the series more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel.
      Chrome: bold dark title "line-annotated-events · python · letsplot · anyplot.ai" at about 59 % of the width; axis titles "Date" and "Daily active users" in dark ink; tick labels Jan–Jan and 0–10,000 in INK_SOFT; subtle horizontal grid only. All readable.
      Data: one #009E73 line of 365 daily values rising from about 1,000 to 8,000 with visible step jumps; five dashed grey vertical lines (Dark Mode mid-Feb, Team Workspaces end of Apr, Mobile App mid-Jul, API v2.0 early Oct, Partners end of Nov); hollow page-filled circles with dark outline where each line meets the series; bold dark labels with a diamond anchor alternating at about 8,500 and 9,100. No label overlaps another label or the data line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
