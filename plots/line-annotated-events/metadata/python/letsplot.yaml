review:
  strengths:
  - 'Clear annotation hierarchy: green data line against ink-toned dashed event rules,
    diamond pins and bold labels, readable in both themes'
  - Labels alternate between two heights in headroom reserved above the data (y limit
    from the data max), so no label touches the line or another label
  - Hollow ring markers at each event date sit on the series and make the step after
    every launch easy to read
  - Vertical grid removed so the event rules are the only verticals; subtle horizontal
    grid only
  - layer_tooltips() on the event rules and the line give formatted event names, dates
    and values in the HTML output
  weaknesses:
  - 'DQ-02 (both): two of the five launches are labelled ''Feature A'' and ''Feature
    B'', which read as placeholders next to ''Mobile App'', ''API v2.0'' and ''Partners''
    → concrete feature names (e.g. ''Dark Mode'', ''Team Workspaces''). Likely cause:
    the launches dict.'
  - 'Suggestion: use geom_text(nudge_x=...) instead of padding label_text with leading
    spaces to offset labels from their pins.'
  - 'Suggestion: a third label height would leave room for a denser event cluster
    if the data were replaced.'
