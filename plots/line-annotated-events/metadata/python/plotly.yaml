review:
  strengths:
  - 'All seven events get a dashed vertical line at their own date in the second Imprint
    color (#C475FD), clearly distinct from the solid #009E73 price line in both themes'
  - Labels alternate between two heights (0.93 / 0.83 paper) inside a y-range headroom
    computed from the data, so no label covers the price line or a neighbouring label,
    and each dashed line ends just below its own label
  - 'Label boxes use ELEVATED_BG with an event-colored border, threading theme tokens
    through the annotations so they read cleanly on both #FAF8F1 and #1A1A17'
  - Diamond markers at each event's intersection with the series show the price on
    the event day; plotly hovertemplates carry the event name, date and price in the
    HTML
  - Mixes data x-coordinates with paper y-coordinates on add_shape/add_annotation,
    the idiomatic plotly way to anchor event markers independent of the value axis
  weaknesses:
  - 'Suggestion: the ''Event'' legend entry shows a wide gap between its diamond and
    its label; a legend itemwidth or a shorter entry would tighten the key.'
  - 'Suggestion: event label text at 10 px could go to 11 px for the 400 px thumbnail,
    the boxes have room.'
