review:
  strengths:
  - All five event labels sit at alternating axes-fraction heights (0.90/0.80) above
    the data band, each anchored just right of its own dashed marker, so no label
    touches the sales line or another label in either render
  - 'Event labels use white bold text on solid Imprint position-7 (#954477) boxes,
    which reads with high contrast in both themes while the data line keeps brand
    green #009E73'
  - Theme chrome is threaded fully through sns.set_theme rc tokens (page, ink, ink-soft,
    elevated legend background) and sns.despine, with data colors identical across
    themes
  - Tidy df built with column constants and passed to sns.lineplot(data=df, x=DATE,
    y=SALES); events derived from the same frame
  - Canvas is exactly 3200x1800 with default bbox_inches as the library rule requires
  weaknesses:
  - 'VQ-02 (both): the Valentine''s Campaign label box runs about 15 px past the Spring
    Sale dashed line, and the lower-right legend box sits over the lower part of the
    Black Friday event line → keep every label box short of the next event line and
    the legend clear of all event lines. Likely cause: the left-aligned 8 pt bold
    label width at a 0.90 height beside a close neighbour, and legend loc="lower right".'
  - 'Suggestion: shading a short window after each event (e.g. axvspan) would make
    the campaign periods easier to compare.'
  - 'Suggestion: a seaborn-native touch such as sns.lineplot with a rolling-mean overlay
    would show more of the library.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'line-annotated-events · python · seaborn · anyplot.ai' (~55% width), axis labels 'Date' and 'Daily Sales (Units)', ink-soft ticks, subtle y grid, legend lower right; all readable.
      Data: #009E73 daily sales line rising from ~100 to ~185; five dashed #954477 event lines with ink-outlined dots on the line; purple label boxes with white bold text left of each line's right side at alternating heights above the data. Valentine's Campaign box reaches just past the Spring Sale line; legend sits over the lower Black Friday line.
      Legibility verdict: PASS

