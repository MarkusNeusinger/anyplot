review:
  strengths:
  - 'Correct Imprint palette usage: the price line is #009E73 (brand green, position
    1) and the semantic amber anchor (#DDCC77) is reserved for the event markers/rules
    rather than spent from the categorical pool'
  - 'Full theme-adaptive chrome: title, axis labels, tick labels, spines, grid, and
    legend frame all flip correctly between light and dark renders while data colors
    stay identical'
  - All font sizes explicitly set (title 20, axis labels 14, ticks 12, event annotations
    12) and no text is clipped or overlapping in either render
  - Alternating label heights (16/22 offsets) successfully keep all 5 event labels
    clear of the noisy price series across the full year
  - 'Clean, idiomatic Makie code: single seeded script, minimal imports (CairoMakie,
    Colors, Dates, Random all used), high-level API (lines!, vlines!, scatter!, text!,
    axislegend)'
  weaknesses:
  - Single-series legend ('Share price') is redundant per the style guide's decoration-removal
    checklist since there is only one line series — either drop it or repurpose it
    to explain the amber event markers, which are currently only identified by their
    floating text labels
  - Event labels sit 300+ px above their markers (e.g. 'Analyst Downgrade', 'Q4 Earnings
    Beat'), connected only by a thin dashed rule — this avoids overlap but weakens
    the visual link between label and data point; consider a shorter offset or a small
    leader tick near the label end
  - LM-02 (Distinctive Features) is generic — the composition (line + vlines + scatter
    + text annotations) could be reproduced almost identically in matplotlib; leverage
    a Makie-specific touch (e.g. a custom Legend with a glyph for the event markers,
    or GridLayout-based small multiples) to earn distinctive-usage credit
  - X-axis label 'Trading Day (2024)' doesn't match the month-name tick labels (Jan,
    Feb, ...) — 'Date (2024)' would read more consistently with the actual ticks
  - 'DE-03 storytelling is default-level: nothing distinguishes a positive event (earnings
    beat, product launch) from a negative one (earnings miss, downgrade) beyond the
    text itself — color-coding the vline/marker by sentiment (green vs red) would
    sharpen the narrative'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-annotated-events · julia · makie · anyplot.ai" in bold dark ink, axis labels "Trading Day (2024)" / "Share Price (USD)" in dark ink, tick labels in softer gray-ink, subtle 15%-opacity gridlines, L-shaped spine (left+bottom only). A boxed legend top-left reads "Share price" with a green swatch. All chrome clearly readable against the light background.
      Data: A single green (#009E73) daily price line (365 points, Jan-Dec 2024) with visible upward/downward swings. Five vertical amber (#DDCC77) dashed rules mark event dates, each with an amber-filled, ink-stroked circular marker on the line and an amber-adjacent text label ("Q4 Earnings Beat", "Q1 Earnings Miss", "Product Launch", "Q3 Earnings Beat", "Analyst Downgrade") placed clear of the data curve at alternating heights.
      Legibility verdict: PASS — no clipped, overlapping, or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/axis labels now in light ink (#F0EFE8), tick labels in light gray-ink (#B8B7B0), gridlines and spines in the equivalent light-on-dark tone, legend box border and text switched to light ink on a dark elevated fill. No dark-on-dark text found anywhere.
      Data: The price line is the identical #009E73 green and the event markers/rules are the identical #DDCC77 amber as in the light render — only the chrome flipped, confirming theme-adaptive-chrome compliance.
      Legibility verdict: PASS — all text reads clearly against the near-black surface.
