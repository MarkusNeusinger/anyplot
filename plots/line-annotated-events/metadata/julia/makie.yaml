review:
  strengths:
  - Sentiment-coded event markers (amber/red) plus leader ticks visually tether each
    label to its marker without relying on text alone
  - Hand-composed inset Legend cleanly explains both the price line and the two event
    categories in one place
  - Theme-adaptive chrome is threaded consistently through every element (title, axes,
    ticks, spines, grid, legend) in both renders
  - Canvas lands exactly on the 3200x1800 target with comfortable margins and no clipping
  weaknesses:
  - Amber used for "positive event" contradicts its defined semantic role (warning/caution)
    in the style guide - consider IMPRINT_PALETTE[8] (lime, "growth") or another categorical
    slot instead, reserving amber for an actual caution/warning use
  - 'Amber dashed event rules and markers are low-contrast against the light #FAF8F1
    background (amber is one of the palette members that fails WCAG 3:1 on cream)
    - the current strokecolor = PAGE_BG stroke is a background-matching separation
    halo, not a contrast-boosting ink stroke; consider a thin ink-colored stroke on
    the amber elements per the style guide''s "Optional outline pattern"'
  - Five full-height dashed vertical rules add more visual clutter than needed - consider
    shortening them to only span from the axis baseline up to the event's data point
    (a drop line rather than a full-axis rule) to reduce competition with the price
    series
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Bold dark-ink title "line-annotated-events · julia · makie · anyplot.ai", ink-colored axis labels ("Date (2024)", "Share Price (USD)"), soft-ink tick labels, subtle gridlines, L-shaped spines. All clearly readable against the light background.
      Data: Green (#009E73) share-price line; 5 event markers with dashed vertical rules and text labels - amber for positive events (Q4 Earnings Beat, Product Launch), matte red (#AE3030) for negative events (Q1 Earnings Miss, Analyst Downgrade) and Q3 Earnings Beat mislabeled check - colors confirmed correct per code (amber = positive, red = negative). Boxed inset legend top-left.
      Legibility verdict: PASS (amber dashed lines are low-contrast against the cream background, a visibility/accessibility concern, but all TEXT remains legible)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title, axis labels, and tick labels correctly flip to light ink tokens (INK / INK_SOFT), fully legible against the dark background. No dark-on-dark failures observed. Grid and legend box background flip to dark chrome tokens correctly.
      Data: Green price line, amber and matte-red event colors are pixel-identical to the light render, confirming data colors stay constant across themes.
      Legibility verdict: PASS
