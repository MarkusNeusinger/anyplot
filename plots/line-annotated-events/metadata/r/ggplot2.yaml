review:
  strengths:
  - Alternating annotation heights (label_step 1/2) keep all five event labels legible
    with zero overlap against the price line or each other
  - Correct anyplot title format, dollar-formatted y-axis ticks, and clean theme adaptation
    between light/dark renders — data colors (brand green line, matte-red event markers)
    stay identical, only chrome (INK/INK_SOFT/PAGE_BG) flips
  - 'Idiomatic layered ggplot2 grammar: geom_vline + geom_line + geom_segment + geom_point
    + geom_label composed cleanly, KISS script structure with set.seed(42) for reproducibility'
  - Canvas is exactly 3200x1800 via a single dual-theme .R file driven by ANYPLOT_THEME,
    saved with ragg::agg_png as required
  weaknesses:
  - panel.grid.major.y uses raw color = INK at full opacity, rendering as bold solid
    black (light theme) / white (dark theme) horizontal rules — much stronger than
    the style guide's 15-25% subtle target. The ggplot2 library prompt explicitly
    says to 'use a faint INK color' since ggplot2 doesn't expose grid alpha; blend
    INK toward PAGE_BG (e.g. a fixed light/dark gray-ink hex) instead of using the
    full-strength INK token.
  - Event markers, leader lines, and dots all use IMPRINT_PALETTE[5] (#AE3030, the
    semantic 'bad/loss/error' anchor) for every event — including the three positive
    'Earnings Beat' events and the neutral 'New Product Launch'. Spending the semantic-red
    anchor on good-news events breaks the red=bad convention; switch generic event
    markers to a neutral/ink tone or the next ordinal categorical color (lavender,
    position 2) since sentiment isn't being encoded.
  - Annotation label text (geom_label size=3.0) sits right at the same visual weight
    as the axis tick labels — legible at full resolution but leaves little margin
    once scaled to a ~400px mobile width; a slightly larger size would add safety
    margin.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-annotated-events · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly legible. Y-axis "Closing Price" with dollar-formatted ticks ($140-$180), X-axis "Trading Date (2024)" with month ticks (Feb-Dec). Horizontal major gridlines at each $10 tick render as solid dark lines — readable but bolder/higher-contrast than the style guide's subtle 15-25%-opacity target. Five gray dashed vertical lines mark exact event dates; five bordered cream-colored label boxes ("Q4'23 Earnings Beat", "Q1 Earnings Miss", "Q2 Earnings Beat", "New Product Launch", "Q3 Earnings Beat") sit at alternating heights above the line, connected to red dots on the price line via short solid red leader segments.
      Data: Brand-green (#009E73) daily closing-price line, matte-red (IMPRINT_PALETTE[5]) event dots/leader lines/vlines. All text renders in dark ink and is fully readable against the light background — no light-on-light issues.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now render in light ink (white/light-gray), remaining fully legible against the dark background. Gridlines flip to light-colored solid horizontal lines, dashed event-date verticals flip to light gray — same bold-relative-to-target weight as light render but readable and not dark-on-dark.
      Data: Line color and event-marker red are pixel-identical to the light render — only chrome (background, text, grid, label-box fill/border) flipped, confirming correct theme-adaptive token usage.
      Legibility verdict: PASS
