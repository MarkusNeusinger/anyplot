review:
  strengths:
  - Correct theme-adaptive chrome in both light and dark renders, with data colors
    held identical
  - Event markers computed via approx() to sit exactly on the price line rather than
    at an arbitrary y-value
  - Alternating label heights (label_step) cleanly solve label collision for closely
    spaced events
  - Dollar-formatted y-axis and descriptive axis titles
  weaknesses:
  - Data storytelling is functional but not compelling - consider a thin leader/connector
    from each label to its red dot, or subtly emphasizing the price segment following
    each event
  - Distinctive-feature usage stays fairly generic for ggplot2; a library-specific
    flourish (e.g. annotate() with background boxes for label contrast, or ggrepel-style
    avoidance) would raise Library Mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Title "line-annotated-events · r · ggplot2 · anyplot.ai", axis titles "Trading Date (2024)" / "Closing Price", dollar-formatted y-tick labels, month x-tick labels - all dark ink, clearly readable
