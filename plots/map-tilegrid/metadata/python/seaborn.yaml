    for this unipolar share. Likely cause: plt.colormaps[''viridis''].'
  - 'SC-04 (both): title ''Renewable Energy by State · map-tilegrid · seaborn · anyplot.ai''
    lacks the language segment → ''… · map-tilegrid · python · seaborn · anyplot.ai''.
    Likely cause: the set_title string.'
  - 'CQ-04 (code): lines 166-187 draw each tile with mpatches.Rectangle and compute
    a manual luma for the text color, which sns.heatmap(grid, annot=labels, fmt='''',
    mask=grid.isna(), square=True) computes; line 11 inserts a hard-coded venv path
    into sys.path → use the heatmap call and delete the sys.path line. Likely cause:
    hand-rolled tile drawing.'
  - 'LM-01 (code): seaborn contributes only sns.set_theme; the chart itself is raw
    matplotlib patches and text → build the grid with sns.heatmap on a pivoted DataFrame.
    Likely cause: the patch loop.'
  - 'Suggestion: an above/below-average framing of the regional divide would give
    the map a focal point.'
