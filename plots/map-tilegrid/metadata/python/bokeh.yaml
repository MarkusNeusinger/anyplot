review:
  strengths:
  - Correct 2400x2400 square canvas — an appropriate choice for a symmetric, grid-based
    plot type
  - 'imprint_seq colormap (#009E73 to #4467A3) correctly built and identical across
    light/dark renders; only chrome flips'
  - Theme-adaptive chrome fully correct in both renders — background, title, tick
    text, and colorbar all readable with no dark-on-dark or light-on-light failures
  - Thoughtful luminance-based label-color selection (INK vs LABEL_LIGHT per tile)
    keeps region codes legible against every tile shade
  - Clean tile-grid layout with visible PAGE_BG-colored gaps between tiles gives every
    region equal visual weight, the defining trait of this plot type
  - Title format correct with descriptive prefix and correctly scaled fontsize formula
    for the longer mandated string
  - Realistic, neutral dataset (European renewable-energy share) with good value range
    (13-85%) and geographically sensible tile placement
  - Clean KISS code structure, no unused imports, idiomatic ColumnDataSource + LinearColorMapper
    + ColorBar pattern
  weaknesses:
  - No bokeh-distinctive interactive feature used (e.g. HoverTool) — the HTML output
    is a plain static-equivalent render, missing an easy opportunity to leverage bokeh's
    core strength for the interactive detail view
  - Data storytelling relies solely on the color gradient — a brief subtitle or callout
    naming the standout insight (e.g. the Nordic-country cluster leading in renewable
    share) would let the reader land on the insight faster
  - Colorbar is functional but plain — no elevated background/border treatment (ELEVATED_BG
    is defined but unused) to match the polish level of the tile grid itself
  image_description: |-
