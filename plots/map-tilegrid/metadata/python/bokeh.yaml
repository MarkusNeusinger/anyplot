    tick text, and colorbar all readable, no dark-on-dark or light-on-light failures
  - Thoughtful luminance-based label-color selection keeps region codes legible against
    every tile shade
  - Clean tile-grid layout with visible PAGE_BG gaps between tiles gives every region
    equal visual weight, the defining trait of this plot type
