review:
  strengths:
  - Square tiles of identical size at each state's grid row and column, with north
    at the top and a recognisable US outline
  - Bold white abbreviations centred on every tile, legible on all five ramp steps
    in both themes
  - Five quantile steps of imprint_seq with a bottom legend of value ranges; chrome
    flips correctly between themes
  - Per-point dicts in a pygal StackedBar carry each tile's own color and label, with
    pygal's inline CSS used for tile strokes and label weight
  weaknesses:
  - 'VQ-03 (both): vertically stacked tiles touch with no visible gutter, so same-class
    neighbours (WA/OR, MT/ID, VA/PA) merge into one block while columns have ~15 px
    gaps → an equal page-colored gutter on all four sides of each tile. Likely cause:
    the inline `.bar{stroke:…;stroke-width:10px}` rule is overridden by Style(stroke_width=0)
    / pygal''s own stroke CSS, so no page-colored stroke is drawn.'
  - 'VQ-04 (both): adjacent quantile steps of the two-stop ramp (e.g. ''< 25%'' vs
    ''25–36%'', ''36–48%'' vs ''48–60%'') are hard to tell apart, against the style
    guide''s rule that every ordered step stays distinguishable from its neighbours
    → fewer classes or steps spaced so neighbours separate clearly. Likely cause:
    N_BINS=5 evenly sampled on the short #009E73→#4467A3 ramp.'
  - 'VQ-06 (both): the colored metric is never named — neither title nor legend says
    the percentages are the renewable share of electricity → a legend heading or descriptive
    title prefix naming VALUE. Likely cause: VALUE constant not passed to the chart.'
  - 'DQ-02 (both): real state names carry random renewable shares (e.g. OH, IN 36–48
    %, DE 36–48 %, NJ 25–36 %, AZ 48–60 %) that contradict their real profiles → values
    close to the real shares for all 50 states. Likely cause: np.random.uniform(18,
    78) for the states not in the override dict.'
  - 'CQ-04 (code): IMPRINT_PALETTE is defined but never used → delete it. Likely cause:
    leftover constant from the template.'
  - 'Suggestion: a slightly larger gap between each legend swatch and its label text.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title 'map-tilegrid · python · pygal · anyplot.ai' in dark ink centred at top; no axes; legend row at the bottom with five swatches '< 25%', '25–36%', '36–48%', '48–60%', '> 60%' in dark ink. All readable.
      Data: 50 equal square tiles arranged as a US tile grid (AK top-left, ME top-right, HI and FL bottom), colored in five steps from brand green #009E73 to blue #4467A3, each with a bold white state abbreviation. Columns are separated by gutters; vertically stacked tiles touch with no visible gap.
      Legibility verdict: PASS

