review:
  strengths:
  - Current imprint_seq fields stops for each theme, sampled into scale_fill_gradientn
    via the prescribed ramp_color helper
  - Per-tile label ink switched by fill luminance and fed through scale_color_identity,
    so the abbreviation on every dark tile stays readable in both themes
  - Bottom colorbar and tight expand margins let the coord_fixed grid fill the square
    canvas, with the gggrid wrap painting the page color edge to edge
  - 'Recognizable Europe layout: Iceland and the Nordics on top, Iberia at the lower
    left, the Baltics down the east edge'
  weaknesses:
  - 'VQ-01 (light): off-white #F0EFE8 labels on the HR and EE tiles (fill luminance
    right at the threshold, around #12A87E) read at about 2.6:1, where dark ink #1A1A17
    would give about 5.9:1 → dark ink on those fills. Likely cause: np.where(fill_luminance
    > 120, ...) uses a Rec.601 weighted sum with the cut at 120; a cut near 110, or
    a WCAG relative-luminance contrast comparison of both inks, would switch them.'
  - 'Suggestion: label the colorbar''s ends (about 12 % and 78 %) so the extremes
    can be read off directly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, thin INK_SOFT panel border.
      Chrome: title 'Renewable Energy Share · map-tilegrid · python · letsplot · anyplot.ai' in dark ink at the top, about 88 % of the width; no axes (layout grid); horizontal colorbar below in an elevated box with title 'Renewable share (%)' and ticks 20/40/60 in dark ink, all readable.
      Data: 30 equal square tiles in an 8x9 Europe layout, filled pale mint -> brand green #009E73 -> deep blue -> dark violet (IS darkest); bold abbreviations. Off-white labels remain on the darker teal/blue tiles (IS, NO, SE, FI, DK, LV, AT, PT) and on HR and EE, which sit at the threshold and read at about 2.6:1; all other mid-green and pale tiles (DE, CH, RO, LT, GR, BG, SI and the pale ones) carry dark ink.
      Legibility verdict: PASS (two labels with low contrast)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, light-grey panel border, elevated legend box.
      Chrome: title, legend title and ticks in light ink, all readable; no dark-on-dark text.
      Data: same layout; dark-stop ramp dark olive -> brand green -> pale blue (IS, NO, SE, FI pale with dark ink labels), all other tiles carry off-white labels with good contrast.
      Legibility verdict: PASS
