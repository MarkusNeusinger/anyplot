review:
  strengths:
  - Current imprint_seq fields stops for each theme, sampled into scale_fill_gradientn
    via the prescribed ramp_color helper
  - Per-tile label ink switched by fill luminance and fed through scale_color_identity,
    keeping every abbreviation readable on the dark tiles in both themes
  - Bottom legend and tight expand margins let the coord_fixed grid fill the square
    canvas, with the gggrid wrap painting the page color edge to edge
  - 'Recognizable Europe layout: Iceland and the Nordics on top, Iberia at the lower
    left, the Baltics down the east edge'
  weaknesses:
  - 'VQ-01 (light): off-white #F0EFE8 tile labels on the mid-green tiles (GR, BG,
    LT, RO, SI, CH, DE, around #2AB88C) read at roughly 2.5:1 contrast → dark ink
    #1A1A17 on those fills. Likely cause: the luminance threshold 140 in np.where(fill_luminance
    > 140, ...) is too high; around 120-125 would switch them.'
  - 'Suggestion: label the colorbar''s ends (about 12 % and 78 %) so the extremes
    can be read off directly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas, thin INK_SOFT panel border.
      Chrome: title 'Renewable Energy Share · map-tilegrid · python · letsplot · anyplot.ai' in dark ink at the top, ~88% of width; no axes (layout grid); horizontal colorbar legend below with title 'Renewable share (%)' and ticks 20/40/60 in dark ink, all readable.
      Data: 30 equal square tiles in an 8x9 Europe layout, filled pale mint -> brand green #009E73 -> deep blue -> dark violet (IS darkest); bold abbreviations in dark ink on pale tiles, off-white on darker ones. Off-white labels on mid-green tiles (GR, BG, LT, RO) read with low contrast.
      Legibility verdict: PASS (minor low-contrast labels on mid-green tiles)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, light-grey panel border, elevated legend box.
      Chrome: title, legend title and ticks in light ink, all readable; no dark-on-dark text.
      Data: same layout; dark-stop ramp dark olive -> brand green -> pale blue (IS, NO, SE pale with dark ink labels), all other tiles carry off-white labels with good contrast.
      Legibility verdict: PASS
