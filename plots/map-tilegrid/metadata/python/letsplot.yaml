review:
  strengths:
  - Per-tile label ink switches between dark and light by the fill's luminance, so
    every country code stays legible from pale mint to navy in light and from deep
    green to pale blue in dark.
  - imprint_seq fields ramp with each theme's own stops, sampled through ramp_color
    into scale_fill_gradientn as the library prompt prescribes.
  - 'Clean grammar composition: geom_tile + geom_text + scale_color_identity + scale_y_reverse
    + coord_fixed gives equal square tiles with north at the top.'
  - Plausible, neutral European renewable-share data with a wide 12-78 % spread; gggrid
    wrapper paints the whole square canvas in the page color.
  - Library-native interactive HTML export alongside the PNG.
  weaknesses:
  - 'VQ-05 (both): the 8x9 tile grid on the square canvas leaves empty page bands
    of roughly 300 px above the title and below the panel (about a quarter of the
    canvas height unused) → let the grid fill more of the height, e.g. by tightening
    the panel''s expand margins or shrinking the legend''s width so the fixed-aspect
    panel can grow. Likely cause: coord_fixed with a wide right-hand legend narrowing
    the panel, plus default scale expansion.'
  - 'Suggestion: label the colorbar''s ends (about 12 % and 78 %) so the extremes
    can be read off directly.'
  - 'Suggestion: a slightly narrower legend frame would balance the composition.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: dark-ink title 'Renewable Energy Share · map-tilegrid · python · letsplot · anyplot.ai' (~88 % of width), thin INK_SOFT panel border, no axes or grid; legend 'Renewable share (%)' in an elevated #FFFDF6 frame with soft-ink ticks 20/40/60. All readable. Wide empty bands above the title and below the panel.
      Data: 30 equal square tiles of European countries in an approximate geographic grid (IS top, Nordics upper right, Iberia lower left, MT/GR bottom), filled with the light imprint_seq fields ramp (pale mint -> #009E73 -> blue -> navy); bold codes in dark ink on pale tiles and light ink on dark ones.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: light-ink title, light-grey panel border, legend in an elevated #242420 frame with light title and soft-light ticks. No dark-on-dark text.
      Data: same tiles and positions, filled with the dark imprint_seq fields stops (deep green -> #009E73 -> pale blue), as a continuous ramp should; IS/NO/SE/FI codes switch to dark ink on the pale-blue tiles, the rest light ink.
      Legibility verdict: PASS
