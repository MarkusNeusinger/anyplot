review:
  strengths:
  - Per-tile label color is computed from the fill's luminance (imprint_seq gradient)
    so every 2-letter region abbreviation stays legible against green through blue
    tiles, in both themes.
  - 'Correct imprint_seq gradient (#009E73 -> #4467A3) with identical data colors
    across light and dark renders; only chrome (background, border, legend) adapts
    to theme.'
  - Realistic, geographically plausible European renewable-energy-share data (e.g.
    NL~15%, DE~21%, FR~20%, IS~78%) that tracks real-world Eurostat figures closely.
  - 'Idiomatic grammar-of-graphics composition: geom_tile + geom_text + scale_color_identity
    + coord_fixed for equal-area tiles is a clean, distinctly ggplot-family approach.'
  - Balanced canvas utilization with generous, symmetric margins around the tile grid
    and legend.
  weaknesses:
  - Per-tile 2-letter labels become quite small at the ~400px mobile preview width
    -- still legible thanks to the luminance-based contrast, but tight given the 30-tile
    density.
  - Data storytelling relies solely on the color gradient; there's no callout highlighting
    the Nordic outlier cluster (Iceland/Norway/Sweden/Finland at ~52-78%) that would
    make the insight more explicit.
  - The colorbar legend only labels 20/40/60 -- the reader must infer the ~12% minimum
    and ~78% maximum from tile color rather than a labeled tick.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Dark-ink title "Renewable Energy Share · map-tilegrid · python · letsplot · anyplot.ai" is clearly visible at top-left; a thin dark panel border encloses the tile grid; the "Renewable share (%)" legend to the right has dark title text and softer grey tick labels (20/40/60) inside a subtly bordered, lightly elevated box. All chrome text is clearly readable against the light background.
      Data: 30 European-country tiles laid out in an approximate geographic grid (Iceland top, Nordics upper-right, Mediterranean bottom), each filled with a continuous green-to-blue gradient (imprint_seq: #009E73 low -> #4467A3 high) and labeled with a bold 2-letter country code in white or dark text chosen per-tile for contrast against that tile's fill. First-series brand green (#009E73) is used for the lowest values.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Light-ink title and panel border are clearly visible against the dark background; the legend box uses a lighter elevated dark fill with soft-light tick labels and light title text. No dark-on-dark or unreadable elements found.
      Data: Same 30 tiles in the same grid positions with identical imprint_seq fill colors as the light render (confirmed by visual comparison) -- only the background, border, and text chrome flipped to their dark-theme tokens. Per-tile label colors (white/dark) are unchanged from light render, and remain legible against each tile's fill on the dark page background.
      Legibility verdict: PASS
