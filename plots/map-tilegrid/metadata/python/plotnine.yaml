review:
  strengths:
  - Tile grid uses geom_tile with coord_fixed() and page-colored borders, giving 51
    equal squares with even gutters in both themes
  - scale_y_reverse() puts grid row 0 at the top, so the US outline reads north-up
    without altering the data
  - 'imprint_seq ramp (#009E73 → #4467A3) via scale_fill_gradient with a framed colorbar
    on the elevated background, fully theme-adaptive'
  - Subtitle extremes are computed from df, so they stay correct when the data is
    swapped
  - Every state abbreviation is bold and readable on its tile in both renders
  weaknesses:
  - 'CQ-01 (code): lines 108–113 define a `luminance()` helper function to pick label
    colors, and with both ramp ends below 0.5 luminance it returns white for every
    tile → no function: compute the label color inline in the list comprehension,
    or pass `color="#FFFFFF"` to geom_text and drop the helper and `to_rgb` import.
    Likely cause: the `def luminance(rgb)` block.'
  - 'Suggestion: a subtitle that names the regional pattern (the Northwest and northern
    Plains lead) would guide the eye beyond the three extremes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200×1800.
      Chrome: title 'US Renewable Energy Share · map-tilegrid · python · plotnine · anyplot.ai' in dark ink, subtitle 'Highest: WA 74%, OR 72%  ·  lowest: DC 2%' in soft grey; no axes; colorbar 'Renewable energy (%)' with 20/40/60 ticks in a framed off-white box at right. All readable.
      Data: 51 equal square tiles (50 states + DC) in a north-up US grid, AK/HI bottom-left; fill from brand green #009E73 (low, DC/OH/WV) to blue #4467A3 (high, WA/OR/VT/ID); page-colored gutters; bold white abbreviations on every tile.
      Legibility verdict: PASS

