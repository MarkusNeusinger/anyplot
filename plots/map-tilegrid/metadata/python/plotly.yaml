  strengths:
  - Equal square tiles via go.Heatmap with xgap/ygap and a scaleanchor-locked y axis,
    so every state carries the same visual weight
  - 'imprint_seq ramp (#009E73 to #4467A3) with an outline-free colorbar labelled
    with its unit'
  - Bold white abbreviations stay legible on every tile in both themes
  - Data-driven subtitle names the leader (WA) and the laggard (DC)
  - Themed hovertemplate shows state and value in the HTML view
  weaknesses:
  - 'CQ-01 (code): a helper function label_color() computes a luminance threshold
    that returns white for every tile of this ramp → drop the function and set the
    annotation color to white inline. Likely cause: def label_color(value) before
    the annotations list.'
  - 'Suggestion: tick labels at 10, 30, 50, 70 or a colorbar range anchored at 0 would
    make the low end of the ramp easier to read off.'
