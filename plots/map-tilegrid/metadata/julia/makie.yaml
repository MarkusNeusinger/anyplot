review:
  strengths:
  - Factually well-researched renewable-electricity dataset matching real-world country
    energy mixes (Iceland/Norway near 100% hydro-geothermal, Austria/Switzerland high
    hydro, France/Hungary low due to nuclear reliance)
  - Geographic tile layout closely approximates true European positions (Nordic north
    row, Baltic NE diagonal, Iberian/Balkan south rows)
  - Correct imprint_seq sequential colormap for the unipolar renewable-share metric,
    with fully theme-adaptive chrome and identical data colors between light/dark
    renders
  - 'Clear data storytelling: highlighted highest/lowest tiles plus an explicit callout
    annotation give the viewer an immediate focal point'
  - Clean, idiomatic Makie code with explicit theme tokens and no fake interactivity
  weaknesses:
  - Title occupies only ~25-30% of canvas width at the current fontsize, smaller than
    the recommended ~50-70% target; could be nudged larger for stronger visual hierarchy
    against the large colorful grid
  - Colorbar tick labels (12pt) are on the small side; a touch more size would add
    extra margin for mobile-scale legibility
  - Library Mastery usage is solid but fairly generic; could lean further into Makie-distinctive
    features (custom recipes, Label grid elements) beyond the current per-element
    stroke trick
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title "map-tilegrid · julia · makie · anyplot.ai" in dark ink at top; subtitle "Highest: IS (98.0%) · Lowest: HU (16.0%)" in softer ink below it; horizontal colorbar labeled "Renewable Energy Share (%)" with dark/soft-ink ticks below the grid. All readable against the light background.
      Data: 27 European-country tiles arranged in a geography-approximating grid, colored via the imprint_seq green (#009E73) -> blue (#4467A3) sequential colormap by renewable electricity share; the two extreme tiles (IS highest, HU lowest) carry a bold dark highlight stroke; each tile labeled with its 2-letter country code in cream text with a thin dark outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title and subtitle now rendered in light ink; colorbar label/ticks light-colored; highlight stroke on IS/HU flipped to a light/cream outline so it still reads against the dark page. All readable against the dark background, no dark-on-dark failures observed.
      Data: tile fill colors and country-code label styling are identical to the light render — only chrome (background, text, highlight stroke color) flipped as required.
      Legibility verdict: PASS
