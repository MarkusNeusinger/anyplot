review:
  strengths:
  - 'Correct sequential Imprint colormap (`cgrad([#009E73, #4467A3])`) with identical
    data colors between light and dark renders — only chrome flips.'
  - 'Clean minimal-chrome tile-grid design: axis decorations and spines fully hidden,
    tiles separated by thin theme-background-colored gaps for visual separation without
    a heavy grid.'
  - Realistic, well-researched per-country renewable electricity share values (Iceland/Norway
    near 100% hydro/geothermal, Poland/coal-heavy states low) — plausible and politically
    neutral.
  - Canvas lands exactly on the canonical 2400x2400 square target with no clipping
    at title, tiles, or colorbar edges.
  - 'Both themes fully legible: title, tick labels, and tile labels readable at both
    full size and the 400px thumbnail.'
  weaknesses:
  - Tile label styling intends a two-tone effect (TILE_LABEL cream fill on colored
    tile, TILE_OUTLINE dark stroke), but at fontsize=16 with strokewidth=2 the outline
    visually dominates the thin cream fill — labels read as solid dark text with a
    faint rim rather than the intended two-tone look. Still legible on every tile
    color tested, so not a legibility failure, but consider a thinner stroke or larger
    fontsize so the cream fill actually shows.
  - Data storytelling is driven only by the color gradient; no annotation calls out
    the highest/lowest performer (e.g., Iceland vs. Poland) to give the viewer an
    explicit focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "map-tilegrid · julia · makie · anyplot.ai" in dark ink, centered, comfortably sized (~35% of canvas width), fully visible with generous top margin. Horizontal colorbar below the tile grid, labeled "Renewable Energy Share (%)" in dark ink with tick labels (25, 50, 75) in a softer dark-gray tone. No axis ticks/spines on the main tile area (intentionally hidden).
      Data: 27 European countries arranged as equal-sized square tiles in an approximate geographic layout (Nordics top, Baltics/Central Europe middle, Southern Europe bottom). Tiles colored via a sequential green (#009E73, low renewable share) to blue (#4467A3, high renewable share) gradient — e.g. Iceland/Norway render blue (near 100%), Poland/Hungary/Slovakia render green (lower share). Each tile is labeled with its two-letter country code in bold dark text with a thin light outline, legible against every tile color observed. Thin off-white gaps separate adjacent tiles.
      Legibility verdict: PASS — title, colorbar text, and all 27 tile labels are clearly readable; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title text now in light ink (#F0EFE8), colorbar label in light ink, tick labels in a lighter soft-gray tone (#B8B7B0) — both readable against the dark background. Gaps between tiles are now dark (background-colored) rather than off-white, correctly following the theme-flip rule for chrome only.
      Data: Identical tile colors and layout to the light render — verified pixel-for-pixel equivalent gradient endpoints and per-country hues (Iceland/Norway still blue, Poland/Hungary still green). Tile labels remain dark bold text with a thin light outline; contrast holds on every tile color, including the darker blue tiles (IS, NO, SE).
      Legibility verdict: PASS — no dark-on-dark failures; all chrome and tile labels remain legible, data colors confirmed unchanged from the light render.
