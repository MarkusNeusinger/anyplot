      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Dark ink title "US Per-Capita Income by State · map-tilegrid · r · ggplot2 · anyplot.ai" clearly visible top-left; legend title "Per-capita income ($k)" and tick numbers (40-80) in dark/soft-dark ink, clearly legible against the light legend background.
      Data: 51 square tiles (50 states + DC) arranged in a recognizable US map layout, each filled with a sequential green-to-blue gradient (#009E73 low to #4467A3 high) and labeled with bold white state abbreviations. First-stop color is the Imprint brand green #009E73 as required. Tile borders are colored to match the page background, creating clean equal-area separation.
      Legibility verdict: PASS — all text (title, legend, tile labels) reads clearly against the light background; white bold tile labels have strong contrast against every tile fill color observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
