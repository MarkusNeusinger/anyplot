      Data: Same 51 tiles with identical green-to-blue gradient and white bold labels as the light render — confirmed data colors are unchanged between themes, only chrome (background, title ink, legend ink) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; title, legend text, and tile labels are all readable against the near-black background.
