review:
  strengths:
  - 'Correct sequential Imprint gradient (#009E73 to #4467A3) matching the unipolar
    income data, with identical data colors between light and dark renders — only
    chrome flips'
  - Thoughtful predefined tile grid layout mirroring real US state geography (51 tiles
    including DC), with tile borders colored to match the page background for clean
    visual separation
  - Title and legend precisely match spec conventions (mandated title format, legend
    labeled with units '$k')
  - Canvas dimensions, theme tokens, and theme-adaptive chrome (background, title,
    legend) correctly implemented per the style guide in both themes
  weaknesses:
  - Design excellence is competent but conservative — no additional visual hierarchy
    (e.g., callouts for the highest/lowest states, a subtitle giving context) beyond
    the base color gradient to elevate data storytelling
  - Library Mastery is generic ggplot2 usage (geom_tile + geom_text + scale_fill_gradient)
    — could lean on more distinctive ggplot2 features (e.g., ggrepel-free label contrast
    tuning, custom guide styling on the colorbar) to stand out
  - Dense clusters (mid-Atlantic tiles) feel visually tight — slightly larger tile
    gaps or subtle label-weight variation would improve breathing room without changing
    the equal-area principle
  image_description: |-
