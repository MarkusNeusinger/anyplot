review:
  strengths:
  - Correctly emulates a native tile-grid map with a custom Chart.js afterDraw plugin
    over a hidden scatter scale, matching the library's guidance for chart types with
    no native Chart.js support
  - Tile positions approximate real European geography (Iceland top-left, Nordics
    top-right, Mediterranean south) so the layout reads instantly as a map
  - Sequential Imprint palette (t.seq) correctly interpolated per-tile by value, with
    a luminance-based text-color switch so labels stay legible against both light
    and dark tile fills
  - Data is plausible, neutral (renewable electricity share), and spans a believable
    16-98% range across 20 real countries
  weaknesses:
  - 'AR-09 edge clipping: the rotated colorbar unit label (''Renewable Share of Electricity
    (%)'') is drawn at x = barX + barW + 58 ≈ 1212 in the 1200px-wide CSS mount (square
    orientation), i.e. ~12px past the right edge of the canvas — the entire label
    is off-canvas and invisible in BOTH plot-light.png and plot-dark.png. Fix: increase
    options.layout.padding.right from 140 to roughly 190-200 (or shrink the bar/label
    offsets), and keep the rotated text''s full bounding box, including half its font
    height as margin, within padding.right so it never crosses the canvas edge.'
  - The '98%'/'16%' colorbar value labels sit right at the padding edge with almost
    no margin (label_x ≈ 1164, canvas width 1200) — safe today but leaves no room
    for longer values (e.g. 3-digit numbers); widen padding.right so there's real
    breathing room, not a near-miss.
  - Because the colorbar's unit/quantity label never renders, a viewer has no way
    to know the colorbar represents '% renewable electricity' — only the raw min/max
    numbers are visible, which weakens SC-02/SC-04 (value-to-color mapping should
    be self-explanatory).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the Imprint light theme.
      Chrome: Bold dark title "Renewable Energy in Europe · map-tilegrid · javascript · chartjs · anyplot.ai" is fully readable at the top. No axis ticks/labels (scales hidden by design, appropriate for a tile map). A vertical colorbar sits at the far right with "98%" near the top and "16%" near the bottom, both legible. The rotated unit-label that should sit to the right of those numbers (e.g. "Renewable Share of Electricity (%)") is NOT visible anywhere in the frame — it is drawn past the right edge of the canvas (see review_weaknesses.json for the pixel math).
      Data: 20 country tiles arranged in an approximate map of Europe (Iceland top-left, Nordics top-right, Mediterranean bottom), each filled with a green-to-blue sequential gradient (Imprint imprint_seq, first stop #009E73) keyed to renewable-electricity share. Every tile has a bold white region-code label (IS, NO, SE, ...) that is clearly legible against every tile color.
      Legibility verdict: FAIL — the colorbar unit label is completely missing (rendered off-canvas), even though all other text is legible.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the Imprint dark theme.
      Chrome: Same title, now in light text, fully readable against the dark background. Same colorbar with "98%"/"16%" legible in light gray. Same missing rotated unit label as the light render — confirmed off-canvas in both themes (not a theme-adaptation bug, a fixed pixel-offset bug).
      Data: Identical tile colors and layout to the light render — data hues do not shift between themes, only chrome (background, title/label color) flips, as required.
      Legibility verdict: FAIL — same missing colorbar unit label; everything else (title, tick-equivalent colorbar numbers, tile labels) is dark-mode legible with no dark-on-dark issues.
