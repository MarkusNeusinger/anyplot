review:
  strengths:
  - Clever reuse of ScatterChart band scales + a custom scatter slot to draw equal-area
    square tiles, which the MUI X community surface has no native tile-grid/heatmap
    component for
  - Approximate compass-style geographic layout (row 0 = north) with real ISO country
    abbreviations makes the tile positions intuitively readable
  - Continuous Imprint sequential colormap (green→blue) correctly built from tokens.seq,
    identical data colors between light and dark renders
  - Per-tile text color picked from WCAG relative luminance of the actual fill so
    labels stay legible across the whole color range
  - Data is realistic, neutral (renewable electricity share by European country) and
    spans a wide, factually plausible 9%-98% range
  weaknesses:
  - 'AR-09 edge clipping: the continuous color legend''s max-value label "98%" is
    clipped at the canvas''s right border in BOTH plot-light.png and plot-dark.png
    — pixel inspection confirms non-background label ink extends into the very last
    image column (x = width-1), i.e. part of the ''%'' glyph is rendered off-canvas
    and permanently lost. Root cause is almost certainly that LEGEND_RESERVE (170
    CSS px) plus the ContinuousColorLegend''s own label width isn''t enough margin
    for the label text, which is measured/positioned independently of the reserved
    margin box — increase LEGEND_RESERVE (or add explicit right margin/marginRight
    padding) so the legend''s rendered label bounding box, not just its bar, fits
    inside window.ANYPLOT_SIZE.width.'
  - Large uneven whitespace gap between the right edge of the tile grid and the color
    legend (roughly a quarter of canvas width) while the left margin is comparatively
    tight — worth tightening once the clipping fix changes the margin math anyway.
  - Legend only labels the min/max stops (9%/98%) with no visible intermediate scale
    ticks — acceptable for a compact continuous legend, but an additional mid-point
    tick would make the color-to-value mapping easier to read at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "map-tilegrid · javascript · muix · anyplot.ai" and the subtitle are dark ink, clearly legible. The continuous color legend on the right shows "98%" (top) and "9%" (bottom) labels in soft dark ink.
      Data: 28 European countries drawn as equally-sized, rounded-corner square tiles arranged in an approximate compass grid, colored on the Imprint sequential green→blue scale (green = low renewable share, blue = high). Norway (98%) and Iceland (85%) render blue; low-share countries (Hungary 14%, Ukraine 9%) render green. Each tile carries a white/cream country-code label with a thin page-background stroke separating tiles.
      Legibility verdict: FAIL — the legend's top label "98%" is clipped at the canvas's right edge: pixel inspection shows label ink reaching the very last column of the 3200px-wide image, meaning part of the "%" glyph is rendered off-canvas and missing.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title and subtitle render in light ink, clearly legible against the dark surface. Legend labels "98%"/"9%" are in light-gray ink.
      Data: Identical tile layout and identical data colors to the light render (Imprint green→blue gradient unchanged) — only the page background and text/legend chrome flipped to the dark tokens, as required.
      Legibility verdict: FAIL — same AR-09 clipping as the light render: the "98%" legend label's ink reaches the last pixel column of the canvas, confirming the glyph is cut off at the right border in this theme too.
