review:
  strengths:
  - 'Composes the tile map from MUI X community building blocks: ChartsDataProvider
    with linear x/y axes hidden via position: ''none'', a custom Tiles component that
    reads useXScale/useYScale for placement, and a zAxis continuous colorMap consumed
    through useZColorScale, so tiles and colour bar share one scale'
  - ContinuousColorLegend bound to the same zAxis id draws a vertical Imprint sequential
    bar with data-driven min/max labels, so the colour mapping can't drift from the
    tiles
  - Ink switches by relative luminance of each tile fill (getLuminance from @mui/material),
    so labels on the dark-blue high-share tiles turn light and stay legible on every
    tile in both themes
  - Equal square tiles from one shared pitch on both axes; the 28-country layout reads
    as Europe (Nordics on top, Iberia bottom-left, Greece bottom-right), and north
    is at the top
  - Two-level tile label hierarchy (bold abbreviation, smaller value) plus a computed
    subtitle that names the lowest (UA 9%) and highest (IS 99%) countries gives the
    reader the range at a glance
  - Every limit, unit and extreme comes from the data (min/max of the share column,
    the unit parsed from the column name), and animation is off via skipAnimation
  weaknesses:
  - 'DQ-02 (both): real country names carry values that drift from reported renewable-electricity
    shares, e.g. DK 62% (reported around 80–88%) and PL 18% (reported around 25–27%)
    → use figures close to a single published year (e.g. Ember/Eurostat 2023) for
    every country, or keep the countries and state approximate values consistently.
    Likely cause: hand-typed values in the data block.'
  - 'Suggestion: one or two intermediate ticks on the colour bar (e.g. 30%, 60%) would
    let readers place mid-range tiles without reading each value label.'
  - 'Suggestion: the empty strip right of the colour bar could be reclaimed by widening
    the grid pitch slightly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "map-tilegrid · javascript · muix · anyplot.ai" bold dark ink top-left, subtitle "28 countries, one equal tile each · Renewable electricity share (%) from 9% (UA) to 99% (IS)" in soft ink; colour-bar title "Renewable electricity share (%)" in dark ink right of the grid, 99% / 9% end labels readable. No axes (by design).
      Data: 28 equal rounded-square tiles on a 9×7 compass grid (IS, NO, SE, FI top; IE, GB, DK, EE; NL, DE, PL, LT; BE, CZ, SK, UA; FR, CH, AT, HU, RO; PT, ES, IT, HR, RS, BG; GR). Fill from the Imprint sequential ramp: brand green #009E73 at low share (UA, CZ, HU, PL) to blue at high share (IS, NO). Bold abbreviation plus value on each tile; ink switches dark on green/teal tiles and light on blue tiles; all legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, colour-bar title and end labels flip to light ink and are clearly readable; no dark-on-dark text.
      Data: tile fills identical to the light render (same green-to-blue ramp); tile labels keep the same luminance-based ink, so they read the same in both themes. Brand green clearly visible.
      Legibility verdict: PASS
