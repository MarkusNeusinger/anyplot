review:
  strengths:
  - Custom square-tile slot component computes per-tile text color from WCAG relative
    luminance, guaranteeing legible abbreviation labels against every fill color in
    both themes
  - Precise geometry math (cellPitch from available width/height, legend safety strip)
    keeps every tile perfectly equal-area and prevents the continuous colorbar legend
    from clipping against the physical canvas edge
  - 'Idiomatic, advanced use of the community @mui/x-charts surface: band-scale axes
    for the grid, a continuous zAxis colorMap, and ContinuousColorLegend, composed
    correctly within the harness contract (skipAnimation, export default, sizing from
    ANYPLOT_SIZE)'
  - Realistic, geographically-plausible European renewable-electricity-share data
    (Norway/Iceland high, Poland/Hungary lower) placed on a sensible approximate compass
    grid
  weaknesses:
  - 'DE-03: No visual emphasis or annotation calls out standout countries (e.g. Norway
    at 98%) — a subtle highlight would sharpen the storytelling beyond the color scale
    alone'
  - 'CQ-01: Two helper functions (textColorFor, CountryTile) are necessary for the
    custom-slot tile pattern but push slightly past a bare declarative KISS baseline'
  - Legend value labels are set at 13px — on the smaller side; worth double-checking
    they stay legible at the ~400px mobile preview scale
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct and consistent across the whole canvas.
      Chrome: Title "map-tilegrid · javascript · muix · anyplot.ai" and subtitle "Renewable electricity share by country — equal tile weight, not land area" render in dark ink, both fully legible and not clipped. The vertical colorbar legend on the right shows "98%" (top) and "9%" (bottom) in dark gray text, clear of the canvas edge.
      Data: 27 square tiles arranged on an approximate European compass grid (Iceland/Norway/Sweden/Finland along the top, Mediterranean countries at the bottom), each filled with a continuous blue-to-green gradient color keyed to renewable electricity share. Each tile carries a bold two-letter country code; the label ink flips between near-white and near-black per tile so it always reads clearly against that tile's fill (e.g. white text on the darker blue NO tile, dark text on the lighter green HU tile). Rounded tile corners with a thin off-white stroke create clean separation between neighboring tiles.
      Legibility verdict: PASS — all title, subtitle, tile-label, and legend text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct and consistent across the whole canvas.
      Chrome: Title and subtitle render in light ink, fully legible against the dark background. The colorbar legend labels ("98%" / "9%") render in light gray, clearly visible and not clipped at the right edge.
      Data: Same 27 tiles in the same compass layout with an IDENTICAL blue-to-green data gradient to the light render — only the page background and text chrome flipped, confirming the Imprint continuous palette held constant across themes. Per-tile label ink still flips appropriately (white on darker tiles, near-black on the lightest green tiles), so no tile shows dark-on-dark text.
      Legibility verdict: PASS — all chrome and tile-label text is clearly readable against the dark background; no dark-on-dark failures found.
