review:
  strengths:
  - The tile colors and the vertical ContinuousColorLegend share one zAxis continuous
    colorMap (imprint_seq), read through useZColorScale, so the legend always matches
    the tiles
  - The ChartsDataProvider/ChartsSurface composition uses linear x/y axes as the grid
    coordinate system, and one shared pitch keeps every tile square and equal-area
  - The label ink switches on tile luminance, so abbreviations and values stay legible
    on every tile in both themes
  - 'A recognisable Europe with north at the top: Nordics across the top row, Iberia
    in the SW, the Balkans and Greece in the SE'
  - The subtitle is computed from the data and names the extremes (UA 9% to IS 99%)
    and the region count
  weaknesses:
  - 'CQ-04 (code): lines 67-73 parse the fill into RGB channels and write out the
    WCAG relative-luminance formula by hand → replace them with `getLuminance(fill)`
    from `@mui/material/styles`, which accepts both hex and rgb() strings. Likely
    cause: the luminance helper was hand-rolled instead of imported.'
  - 'Suggestion: add one or two intermediate labels (e.g. 50%) to the color bar so
    mid-range tiles can be read off the scale, not only from their printed values.'
  - 'Suggestion: a slightly larger title would give the header more weight against
    the large tile grid.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, measured #FAF8F1.
      Chrome: The bold near-black title 'map-tilegrid · javascript · muix · anyplot.ai' sits top-left, aligned with the grid, over a grey subtitle ('28 countries, one equal tile each · Renewable electricity share (%) from 9% (UA) to 99% (IS)'). The vertical color bar on the right is titled 'Renewable electricity share (%)', with 99% at the top and 9% at the bottom. All of it is readable.
      Data: 28 equal rounded square tiles on a 9x7 grid in the shape of Europe (IS/NO/SE/FI on top, PT/ES at the SW, GR at the bottom). Tile colors run along the imprint_seq ramp from brand green #009E73 (UA 9%, CZ 17%) to blue (IS 99%, NO 98%). Each tile shows a bold abbreviation and its value. The ink is dark on light-green tiles and off-white on darker blue tiles (IS, NO, SE, FI, DK, CH, AT, PT, HR).
