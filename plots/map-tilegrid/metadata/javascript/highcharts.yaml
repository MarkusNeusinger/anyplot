review:
  strengths:
  - Correct, theme-consistent imprint_seq sequential palette applied via hand-rolled
    interpolation (necessary since no colorAxis module is loaded) — identical data
    colors across light/dark
  - Thoughtful discrete-bin legend that turns a continuous scale into a readable colorbar
    substitute, plus a data-driven subtitle calling out the highest/lowest states
  - Clean theme-adaptive chrome throughout — no legibility failures in either render
  - Correct AK/HI conventional detached placement and north-at-top row orientation
  weaknesses:
  - DC's per-capita income value is placed mid-range rather than reflecting its real-world
    outlier-highest status — consider nudging it toward (or above) the top of the
    range for closer real-world alignment
  - The three small numeric-interpolation helper functions (hexToRgb, imprintSeq,
    colorFor) add a bit of structure beyond pure KISS; acceptable given the missing
    colorAxis module, but worth noting
  - Data storytelling relies on the subtitle text rather than an additional visual
    emphasis (e.g., highlighting the extreme tiles) — a nice-to-have, not required
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1
      Chrome: title (dark ink, centered, dynamically shrunk to fit the long mandated string at ~53% width), italic subtitle calling out highest/lowest states, discrete 5-bucket legend with titled units below the grid — all readable
      Data: 51 fixed-size square tiles (50 states + DC) arranged to approximate US geography, colored on the imprint_seq scale (brand green -> blue) by per-capita income, white bold 2-letter abbreviation labels on every tile
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17
      Chrome: title and subtitle flip to light-colored ink, legend text/title flip to light-gray — all readable, no dark-on-dark failures
      Data: tile colors confirmed pixel-identical to light render (only chrome flipped); white tile labels remain fully legible against every saturated tile color; brand green low end of the scale reads well on the dark surface
      Legibility verdict: PASS
