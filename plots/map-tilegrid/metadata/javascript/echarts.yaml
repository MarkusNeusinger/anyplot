review:
  strengths:
  - Renewable-electricity percentages are factually accurate and well-differentiated
    (Norway 98%, Iceland 85%, Austria 80%, down to Hungary 15%, Poland 17%), giving
    the colormap real range to work with.
  - Correct use of the Imprint sequential colormap (t.seq) for this single-polarity
    continuous metric, with identical data colors and theme-correct chrome (background,
    ink) across light and dark renders.
  - Region labels use white text with a dark border/shadow, keeping every abbreviation
    legible regardless of the underlying tile color in both themes.
  - Clean, flat KISS script that follows the mount-node contract correctly — no explicit
    size/DPR passed to echarts.init, animation:false set, in-memory deterministic
    data.
  - Hand-placed grid coordinates approximate real European geography reasonably well
    while keeping every tile equally sized.
  weaknesses:
  - 'Design Excellence is only workmanlike: beyond the mandated palette and rounded
    tile corners, there''s no additional visual hierarchy — e.g. no highlight/outline
    calling out the highest or lowest performer, so the chart doesn''t actively guide
    the viewer to an insight beyond ''read the colors''.'
  - The visualMap legend only shows the words 'Low'/'High' — the actual percentage
    values (15%–98%) are only revealed on hover via the tooltip/formatter, so the
    static PNG never communicates the numeric range. Add explicit min/max value labels
    (e.g. append the formatted % to the 'Low'/'High' text) so the legend is self-contained
    without interaction.
  - The heatmap + continuous visualMap combination is a fairly generic technique for
    a tile-grid map — echarts' custom series (renderItem) or a more distinctive layout
    treatment would showcase more library-specific capability.
  - Greece (GR) sits isolated far below-right of the rest of the cluster with no neighboring
    tiles, leaving a noticeably empty gap in the lower-right area of the canvas —
    reasonable for geographic accuracy but worth a slightly tighter row/col placement
    if it doesn't compromise the real geography.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like cream), not pure white.
      Chrome: Title "Renewable Electricity Share, Europe · map-tilegrid · javascript · echarts · anyplot.ai" in dark ink, centered top, clearly legible. Colorbar legend at bottom-center with "Low" and "High" text labels in soft gray, readable against the cream background.
      Data: ~20 square tiles arranged in a hand-placed grid approximating European geography (Iceland/Nordics top-left/top-right, Central Europe middle, Iberia/Italy/Greece bottom). Tiles colored on the Imprint sequential scale (brand green -> blue), first-glance lowest values (Hungary, Poland, Czechia) rendered green, highest values (Norway, Iceland) rendered blue. Each tile shows a bold white country-code label (e.g. "DE", "FR", "NO") with a dark text border/shadow for contrast. Rounded tile corners with cream-colored gaps between tiles create a clean grid-of-tiles look.
      Legibility verdict: PASS - all text (title, tile labels, legend words) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Same title text now rendered in light/off-white ink, fully legible against the dark background. Legend "Low"/"High" text rendered in a lighter soft-gray tone, still readable on the dark surface.
      Data: Identical tile layout and identical tile colors to the light render (Norway/Iceland still the same blue, Hungary/Poland/Czechia still the same green) - only the page background and text/ink colors flipped, confirming the Imprint data colors are theme-independent. White bordered tile labels remain legible against every tile color.
      Legibility verdict: PASS - no dark-on-dark failures observed; title, tile labels, and legend text are all clearly visible against the near-black surface.
