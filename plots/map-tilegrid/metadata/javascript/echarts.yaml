review:
  strengths:
  - Correct imprint_seq sequential colormap for single-polarity renewable-share data,
    with theme-correct chrome in both renders
  - Bold-outline emphasis on the highest/lowest performers, explicitly called out
    in the subtitle - real data storytelling
  - White text with dark border keeps labels legible regardless of underlying tile
    color
  - Factually plausible European renewable-electricity figures (Norway/Iceland high,
    Poland/Hungary low, France's nuclear-heavy low share)
  - Explicit font sizing throughout, including a length-scaling formula for the mandated
    title
  weaknesses:
  - Noticeable unused whitespace above the tile grid (between subtitle and first row)
    and below the last row (before the legend) - tighten grid.top/grid.bottom or grow
    the tile cells so the layout fills the canvas more evenly
  - Tile cells are rectangular rather than square (cell width approx 2280/7 approx
    326px vs cell height approx 2030/5 approx 406px) - use a single uniform cell size
    (e.g. Math.min(cellWidth, cellHeight)) instead of independent per-axis cell dimensions
