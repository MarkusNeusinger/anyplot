review:
  strengths:
  - Per-bar arm coloring through an ordinal colorMap on the band y axis, the native
    MUI X way to color categories of a single series
  - Event markers drawn as a custom layer using useXScale/useYScale, so each symbol
    sits exactly at its event time in its patient's row
  - Distinct symbols per event type with page-colored halos stay distinguishable on
    both bar colors in both themes
  - Ongoing patients get an ink arrow past the bar end that flips with the theme,
    explained in the legend and the subtitle
  - 'Semantic colors: progression on the matte-red anchor, adverse events on the amber
    warning anchor'
  - Bar tooltip in the HTML view formats the duration with its unit via valueFormatter
  weaknesses:
  - 'Suggestion: the event markers have no tooltip in the HTML view; an onItemClick/tooltip
    slot or SVG <title> per marker would expose event type and week on hover'
  - 'Suggestion: the gap between the header legend and the first bar row could shrink
    slightly to tie the legend closer to the plot'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "swimmer-clinical-timeline · javascript · muix · anyplot.ai" top left, grey subtitle (20 patients, 2 arms, sort order, arrow = ongoing), one-row legend (Targeted Therapy, Chemotherapy swatches; Partial response triangle, Complete response star, Progressive disease diamond, Adverse event dot, Ongoing arrow). Y axis "Patient" with PT IDs, x axis "Time on study (weeks)" 0-60, subtle vertical grid. All readable.
      Data: 20 horizontal bars sorted longest (PT-011, 58 wk) at top to shortest (PT-014, 12 wk); Targeted Therapy in #009E73, Chemotherapy in #C475FD; blue triangles, ochre stars, red diamonds at bar ends, amber dots, black arrows past the ends of 7 ongoing bars.
