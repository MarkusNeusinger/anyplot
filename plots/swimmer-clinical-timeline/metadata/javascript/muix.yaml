review:
  strengths:
  - One horizontal bar per patient (20 patients), sorted with the longest time on
    study at the top, patient IDs on the y axis and a shared week axis from 0, so
    bar length reads directly as time on study
  - 'All five event types have their own symbol (triangle, star, diamond, circle,
    arrow), placed at their event times, with semantic colors: progression in the
    matte-red loss anchor, adverse events in the amber warning anchor, responses in
    Imprint blue and ochre'
  - Ongoing patients end in an ink-colored arrow that flips with the theme (near-black
    on light, near-white on dark), so an ongoing bar is never read as a completed
    one; the subtitle states the arrow's meaning
  - 'Idiomatic MUI X composition: BarChart with layout="horizontal", per-bar arm colors
    through the band axis''s ordinal colorMap, and a custom SVG child layer that places
    event markers with the useXScale/useYScale hooks'
  - Event markers carry a page-colored outline with vectorEffect="non-scaling-stroke",
    which keeps them clear of the green and lavender bar fills in both themes
  - The tooltip's valueFormatter adds the time unit to each bar's duration in the
    HTML view; skipAnimation keeps the harness screenshot stable
  weaknesses:
  - 'SC-01 (both): a ''Longest on study'' bracket and label next to PT-011 and PT-004
    is a callout the spec does not ask for, and it repeats what the sort order already
    shows; it also forces the x axis to run empty from 60 to about 69 weeks → remove
    the bracket and label, and reduce the right padding to what the ongoing arrow
    needs. Likely cause: the FOCUS_COUNT callout path and text in SwimmerLayer, and
    X_PAD_SHARE = 0.2.'
  - 'Suggestion: an optional event label (the spec''s events.label field) could be
    shown in the tooltip of the HTML view.'
  - 'Suggestion: a slightly heavier weight for the y-axis patient IDs would match
    the stronger presence of the x-axis title.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: bold dark title "swimmer-clinical-timeline · javascript · muix · anyplot.ai" top left, a soft-ink subtitle ("20 patients across 2 treatment arms · sorted by time on study (weeks) · arrow = ongoing at data cutoff"), and a one-row legend under it (Targeted Therapy, Chemotherapy swatches; Partial response triangle, Complete response star, Progressive disease diamond, Adverse event circle, Ongoing arrow). Y axis "Patient" with IDs PT-011 to PT-014, x axis "Time on study (weeks)" with ticks 0–60. Subtle vertical grid lines. All text dark and readable. A small "Longest on study" bracket at the top right.
      Data: 20 horizontal bars sorted by duration (58 weeks at top, 12 at bottom), Targeted Therapy in brand green #009E73, Chemotherapy in lavender #C475FD. Blue triangles, ochre stars, matte-red diamonds at bar ends, amber circles, near-black arrows on ongoing bars; markers outlined in the page color.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend text, axis titles and tick labels render in light ink and are clearly readable; grid lines dim but visible; no dark-on-dark text. The "Longest on study" label is light grey.
      Data: bar and event colors identical to the light render (green, lavender, blue, ochre, matte red, amber). The ongoing arrow flips to near-white ink, which is the theme token by design; marker outlines flip to the dark page color.
      Legibility verdict: PASS
