review:
  strengths:
  - Distinctive marker vocabulary (triangle/star/diamond/circle/arrow) makes event
    types instantly scannable and is fully colorblind-safe via redundant shape+color
    encoding.
  - 'Thoughtful semantic color use: matte-red for progression and amber for adverse
    events follow the style guide''s semantic-anchor guidance exactly.'
  - The "Longest on study" bracket annotation adds a genuine narrative focal point
    without cluttering the rest of the chart.
  - Both renders are pixel-consistent in data color and fully theme-correct in chrome,
    with no legibility failures in either theme.
  - Correct, idiomatic use of MUI X's scale hooks to build a live-scale SVG overlay,
    exactly matching how the library intends child-composition to work.
  weaknesses:
  - Legend swatches (bar-color rects) are plain, unrounded rectangles while the actual
    bars use borderRadius=3, a very minor visual mismatch between legend and chart.
  - Several small helper components (marker path builders, overlay, legend helpers)
    push the file past a minimal single-block structure; the three simple polygon-path
    builders (trianglePath/diamondPath/arrowPath) could be consolidated into one parameterized
    helper for further simplification.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (not pure white, not dark).
      Chrome: Title, subtitle, legend, axis label, and tick labels all render in dark ink and are clearly readable; faint vertical gridlines are subtle but visible; "ongoing" arrowheads render in black ink.
      Data: First series (Chemotherapy) is brand green #009E73, second series (Targeted Therapy) is lavender #C475FD; event markers use cyan (partial response), lime (complete response), matte-red (progressive disease, semantic "bad" anchor), and amber (adverse event, semantic "warning" anchor).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (not pure black, not light).
      Chrome: Title, subtitle, legend, axis label, and tick labels all flip to light ink and remain fully readable; no dark-on-dark failures anywhere; gridlines remain faint but visible; "ongoing" arrowheads correctly flip to white ink (theme-adaptive structural marker, not a data color).
      Data: All series and event-marker colors (green, lavender, cyan, lime, matte-red, amber) are pixel-identical to the light render — only chrome flipped, as required.
      Legibility verdict: PASS
