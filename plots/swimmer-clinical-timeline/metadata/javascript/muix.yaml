review:
  strengths:
  - Custom SVG event markers (triangle/star/diamond/circle) give every event type
    a distinct shape, redundant with color — colorblind-safe by construction
  - Progressive disease correctly uses the matte-red semantic anchor and adverse events
    correctly use the amber warning anchor, while treatment arms use canonical Imprint
    positions 1-2 (green, lavender)
  - Ongoing (censored) patients get a clear arrow-tipped bar end as required by the
    spec, rendered in theme-adaptive ink so it stays visible on both bar colors and
    both themes
  - 'Data covers every swimmer-plot feature: multi-event patients, adverse events,
    complete vs partial response, progression, and open-ended (ongoing) bars'
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    text, grid) flips, exactly per the theme-adaptive contract
  - Advanced use of MUI X's useXScale/useYScale hooks to sync a fully custom SVG overlay
    to the BarChart's live band/linear scales — a genuinely distinctive library capability
  weaknesses:
  - Visual refinement is good but not fully polished — grid and axis chrome read as
    lightly-adjusted defaults rather than a deliberately refined look; consider tightening
    grid opacity/spacing or adding a touch more separation between the legend row
    and the plot area
  - Data storytelling is solid (sorted bars + color-coded arms) but stops at 'good'
    rather than 'excellent' — there's no visual emphasis calling out the clearest
    insight (e.g. the two longest-surviving patients both being on Targeted Therapy);
    a subtle highlight or annotation would push this further without violating the
    'no annotations unless spec asks' guidance, since sorting/color already do the
    heavy lifting
  - Event markers (capped at 10px CSS radius) are on the small side for a sparse ~20-patient
    cohort with only up to 3 events per bar — per the data-density heuristic, sparse
    data should get more prominent marks; a slightly larger markerSize would improve
    VQ-03 without crowding
  - The custom SVG overlay/legend (necessary since MUI X has no native swimmer-plot
    primitive) is well done, but leans further from the library's high-level marks
    API than a purely idiomatic MUI X chart would — acceptable given the spec's requirements,
    but leaves some room for tighter integration with MUI X's own legend/tooltip primitives
    where feasible
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "swimmer-clinical-timeline · javascript · muix · anyplot.ai" in dark ink, clearly legible. Subtitle in softer gray ink below it. A horizontal legend row (Chemotherapy/Targeted Therapy swatches, Partial/Complete response, Progressive disease, Adverse event markers, Ongoing arrow) sits under the subtitle, fully readable. X-axis "Time on Study (weeks)" with numeric ticks 0-64 in dark-gray ink; subtle vertical gridlines. Y-axis shows patient IDs (PT-011 down to PT-014) in dark-gray ink, sorted longest-duration-first.
      Data: 20 horizontal bars colored green (#009E73, Chemotherapy) or lavender (#C475FD, Targeted Therapy) — first series is confirmed brand green. Event markers overlay each bar: cyan triangles (partial response), lime stars (complete response), matte-red diamonds (progressive disease), amber circles (adverse events), and black arrow tips on bars for ongoing patients.
      Legibility verdict: PASS — all text and data elements are clearly readable against the light background, no dark-on-light or contrast failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and subtitle now rendered in light/off-white ink, fully legible against the dark background. Legend row also in light text with the same swatches/markers. Axis tick labels and "Time on Study (weeks)" label are light gray, clearly visible. Gridlines are subtle light vertical lines.
      Data: Bar colors (green/lavender) and event marker colors (cyan/lime/red/amber) are visually identical to the light render — only the chrome flipped. The ongoing-patient arrow markers switched from black (light theme) to off-white (dark theme) ink, remaining clearly visible against both bar colors.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly legible against the dark surface, and the brand green remains visible on both surfaces.
