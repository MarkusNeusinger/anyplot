review:
  strengths:
  - Composes the chart from MUI X v9 building blocks (ChartsDataProvider, ChartsWrapper,
    LinePlot, ScatterPlot, two ChartsXAxis) so the scatter markers draw on top of
    the fit line, as the spec asks
  - 'The secondary Temperature (K) axis shares the bottom axis''s scale and uses tickInterval:
    invT with tickLabelInterval, so each measured temperature (338…278 K) sits exactly
    at its 1000/T position and runs opposite to the inverse-temperature axis'
  - The slope note is a small component that reads useXScale/useYScale, so it is anchored
    to the fitted line in data space; it states slope = −Ea/R = −12,694 K, Ea = 105.5
    kJ/mol and R² = 0.9991, all computed from the least-squares fit
  - 'Realistic, neutral scenario: N2O5 first-order decomposition at 11 temperatures
    from 278 to 338 K with Ea = 103 kJ/mol and ln A = 31.53; the recovered 105.5 kJ/mol
    is consistent with the seeded scatter'
  - 'Theme tokens are threaded through every chrome element (ink, inkSoft, grid, pageBg):
    both renders read cleanly and the data colors are identical'
  - Item tooltip with a valueFormatter that reports T in K and ln k for each measurement
    in the HTML view
  weaknesses:
  - 'Suggestion: the slope note could carry a thin leader or sit slightly closer to
    the fit line so its tie to the line reads at a glance in the thumbnail.'
  - 'Suggestion: the 1000/T bottom-axis ticks (3.00…3.60) could use 3 decimals or
    fewer ticks for a finer match to the top temperature ticks.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole canvas, no white plot panel.
      Chrome: bold title "line-arrhenius · javascript · muix · anyplot.ai" at the top center, a secondary-ink subtitle "11 measurements, 278–338 K · least-squares fit of ln k against 1/T", a top axis titled "Temperature (K)" with ticks 338, 332, …, 278 at each measured point, a bottom axis "1000 / T (K⁻¹)" from 3.00 to 3.60, and a y axis "ln(k / s⁻¹)" from −5 to −13. Subtle horizontal grid lines. Two-line slope note right of center: "slope = −Ea/R = −12,694 K" (bold) and "Ea = 105.5 kJ/mol · R² = 0.9991". Legend at the bottom center: "Measured rate constants" (green circle) and "Linear fit" (purple line). All text is dark and readable.
      Data: 11 green #009E73 markers falling from upper left to lower right, drawn on top of a straight lavender #C475FD regression line; the points scatter slightly around the line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
