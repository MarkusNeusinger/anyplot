review:
  strengths:
  - Genuine mixed bar+line Chart.js dataset (dual y-axis) overlays a real Pareto cumulative-share
    curve computed from the actual sorted counts — not a fake decoration, and directly
    answers the spec's 'optional percentage annotations' note with a more sophisticated
    technique than a plain per-bar percentage label.
  - Data is generated by counting raw simulated draws with a seeded LCG (mirrors a
    genuine value_counts()/countplot workflow rather than pre-aggregated bars), then
    sorted descending per the spec's guidance.
  - Custom countLabels plugin draws the exact integer count above every bar with a
    background-colored halo stroke, keeping the numbers legible even where the cumulative-share
    line crosses behind them.
  - 'Explicit font sizes throughout (title 22px, subtitle 14px italic, axis titles
    16px, ticks/legend 14px) with a clear typographic hierarchy; both renders are
    fully readable, theme-correct chrome (#FAF8F1 / #1A1A17 backgrounds verified pixel-exact),
    and no dark-on-dark or light-on-light failures.'
  - 'Correct Imprint palette usage by intent: first series #009E73 (bar), second series
    #C475FD (line/points); title matches the mandated ''count-basic · javascript ·
    chartjs · anyplot.ai'' format exactly; legend labels match the datasets.'
  - Realistic, neutral business scenario (support ticket categories, n=320) with a
    believable skewed frequency distribution across 6 categories — good feature coverage
    for a count plot (clear ranking, meaningful variation in magnitude).
  weaknesses:
  - 'Color-compositing bug: wherever the Cumulative Share line/point crosses the lower
    half of a bar, the rendered color is NOT the specified #C475FD lavender — it comes
    out as a slate blue-teal (measured ~#38939B) in BOTH light and dark renders (confirmed
    by pixel-sampling the Billing and Technical markers). Root cause is almost certainly
    the bar''s gradient bottom stop `${t.palette[0]}99` (60% alpha green) compositing
    over/against the line where they overlap. Fix: make the bar gradient fully opaque
    (drop the alpha channel, use a solid lighter-green bottom stop instead of `99`
    alpha) so no blending can occur regardless of paint order, or alternatively force
    explicit `order` on the two datasets so the line dataset unambiguously paints
    on top of the bar''s semi-transparent region.'
  - Point markers on the cumulative-share line (radius 4) are on the small side for
    a sparse 6-point series — could be bumped to ~5-6px for a more prominent, on-brand
    focal point given how few data points there are.
  - 'CQ-04/DE-02: the color-blend artifact is the kind of detail a final visual pass
    should have caught — otherwise the polish (gradient bars, halo-stroked labels,
    dual-axis Pareto overlay) is a cut above a default implementation.'
  - '''57'' count label for the Account bar sits directly on top of the dashed cumulative-share
    line (the halo stroke keeps it legible, but it''s still a minor text-over-data
    overlap worth tightening, e.g. nudge the label plugin''s y-offset when a line
    point is within a few px of the bar top).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled #FAF8F1 exactly (250,248,241) — matches spec, not pure white.
      Chrome: Title "count-basic · javascript · chartjs · anyplot.ai" in dark ink, centered, fully visible; italic subtitle "n = 320 tickets" below it; legend ("Support Tickets" green swatch, "Cumulative Share" line swatch) centered above the plot; x-axis title "Support Ticket Category", left y-axis title "Count", right y-axis title "Cumulative Share" — all dark/soft-dark ink, all clearly legible against the cream background. Subtle horizontal gridlines only on the left (count) axis.
      Data: Six green (#009E73) vertical bars with a top-to-bottom alpha gradient, sorted descending (Billing 86, Technical 69, Account 57, Shipping 54, Feature Request 34, Other 20), each with a bold count label above it (halo-stroked for legibility). A dashed purple (#C475FD) line with circular markers overlays the cumulative percentage share on a secondary right-hand axis (0–100%), rising from ~25% to 100%. Where the line/markers cross the lower portion of the Billing and Technical bars, they render as a slate blue-teal instead of the intended purple — a compositing artifact (see weaknesses), not a palette-selection error, since the line is unambiguously #C475FD everywhere it's on the cream background.
      Legibility verdict: PASS (all text readable; the one defect is a data-color blend, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled #1A1A17 exactly (26,26,23) — matches spec, not pure black.
      Chrome: Same title/subtitle/legend/axis-title layout as light, now in light ink (#F0EFE8 primary / #B8B7B0 secondary) against the dark background — all clearly legible, no dark-on-dark failures anywhere (title, subtitle, tick labels, axis titles, legend text all confirmed readable).
      Data: Identical bar order, values, and count labels as the light render; bars remain #009E73 green (same gradient), cumulative-share line remains #C475FD purple — colors are identical to the light render as required, only the chrome flipped. The same blue-teal compositing artifact reproduces in the same two locations (Billing, Technical bars) confirming it is a rendering-order/alpha issue independent of theme.
      Legibility verdict: PASS (all text readable; same isolated color-compositing defect as light render).
