  - 'Color-compositing bug from attempt 1 is fixed: the bar gradient''s bottom stop
    now blends toward the page background (mixHex) instead of using alpha transparency,
    so the Cumulative Share line/markers render as pure #C475FD wherever they cross
    a bar in both themes (pixel-verified: (196,117,253) exactly at multiple crossing
    points, only a handful of 1-2px anti-aliasing edge pixels remain).'
  - Point radius on the cumulative-share line increased from 4px to 6px per attempt
    1 feedback, giving the sparse 6-point series a more prominent, on-brand focal
    point.
  - Genuine mixed bar+line Chart.js dataset (dual y-axis) overlays a real Pareto cumulative-share
    curve computed from the actual sorted counts, directly answering the spec's 'optional
    percentage annotations' note with a more sophisticated technique than a plain
    per-bar label.
  - 'Explicit font sizes throughout with a clear typographic hierarchy; both renders
    are fully readable, theme-correct chrome (#FAF8F1 / #1A1A17 backgrounds pixel-exact),
    no dark-on-dark or light-on-light failures.'
  - 'Correct Imprint palette usage: first series #009E73 (bar), second series #C475FD
    (line/points) matching canonical palette order; title matches the mandated ''count-basic
    · javascript · chartjs · anyplot.ai'' format exactly.'
  - Realistic, neutral business scenario (support ticket categories, n=320) with a
    believable skewed frequency distribution across 6 categories, sorted descending
    per the spec's guidance.
  weaknesses:
  - The '57' count label for the Account bar still sits nearly flush against the dashed
    cumulative-share line/dot (halo stroke keeps it legible, and the plugin's near-line
    push-up logic reduces the overlap versus attempt 1, but the label's bottom edge
    still nearly touches the dot in both themes) - a minor VQ-02 deduction, worth
    a slightly larger offset or repositioning the dot when it lands this close to
    a label.
