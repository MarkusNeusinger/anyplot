review:
  strengths:
  - 'Correctly implements a true count plot: 600 raw, uncounted survey responses are
    generated and tallied in-code (not pre-aggregated), matching the spec''s core
    requirement.'
  - 'Clear data storytelling: the leading category is spotlighted via full opacity
    + bold label + a translucent markArea backdrop, while a dashed markLine shows
    the mean count as a reference — the viewer immediately sees the insight.'
  - 'Distinctive, idiomatic ECharts usage: markLine and markArea are native declarative
    features that would require significant manual work to replicate in another library.'
  - 'Theme-correct chrome in both renders: warm off-white / near-black backgrounds,
    all text uses ink/inkSoft tokens, brand green #009E73 identical across themes.'
  - 'Clean, deterministic code: tiny seeded LCG for reproducibility, no fake interactivity,
    correct mount-node contract (animation: false, no explicit init size).'
  weaknesses:
  - Percentage annotations (spec's 'optional' suggestion) only appear in the tooltip,
    not in the static PNG — acceptable per interactive-library fairness rules, but
    a small on-bar '%' label could push Design Excellence further.
  - Visual design, while polished, is still a fairly conventional single-hue ranked
    bar chart — could push further into publication-ready territory with e.g. a more
    distinctive typographic treatment or secondary annotation calling out the gap
    to average.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "count-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, subtitle "600 survey responses, ranked by frequency — leader spotlighted" below it in softer gray. X-axis "Primary Language" and Y-axis "Number of Responses" labels both dark and clearly legible. Tick labels and bar-value labels (146, 139, 100, 89, 62, 33, 31) all render in dark/soft-dark ink, fully readable. Subtle horizontal gridlines only on the y-axis, no x-axis gridlines.
      Data: First bar (JavaScript) full-opacity brand green (#009E73) with a bold "146" label and a light green spotlight band behind it; remaining bars (Python, Java, TypeScript, Go, Rust, C++) render as the same green at ~55% opacity, descending in height per the sort. A dashed gray reference line marks the mean ("avg 86").
      Legibility verdict: PASS — no light-on-light text, all elements clearly distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, axis names, and tick labels all render in light ink (white/light-gray), clearly visible against the dark background — no dark-on-dark failures observed. Gridlines are faint and consistent with the light render.
      Data: Bar colors are identical to the light render — leader bar in full-opacity #009E73 brand green, remaining bars at the same reduced opacity, confirming only chrome (not data color) flipped between themes. The average reference line and its "avg 86" label remain legible in light gray.
      Legibility verdict: PASS — all text and data elements are clearly readable in the dark theme.
