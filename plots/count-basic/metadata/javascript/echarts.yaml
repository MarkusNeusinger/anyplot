review:
  strengths:
  - 'Correctly implements a count plot: raw per-response category data is tallied
    in-code (not pre-aggregated) and the resulting frequencies are sorted descending,
    exactly matching the spec''s recommendation.'
  - Value labels above every bar give precise reading without cluttering the chart,
    and single-series legend is correctly omitted as redundant.
  - 'Full Imprint compliance: first (only) series is #009E73, plot backgrounds and
    all chrome (title, axis labels, ticks, grid) are correctly theme-adaptive and
    legible in both light and dark renders.'
  - 'Clean, minimal chrome: y-axis line and tick marks hidden, only a subtle horizontal
    split-line grid remains, generous margins around the plot.'
  - Realistic, neutral survey-style dataset (primary programming language of 600 respondents)
    with a believable, well-differentiated distribution (JavaScript 146 down to C++
    31).
  weaknesses:
  - 'DE-01/DE-02: the chart reads as a well-configured default — one flat green fill
    with no additional design touch (e.g. bar corner radius via itemStyle.borderRadius,
    a subtle emphasis/hover treatment, or a slightly richer tooltip) to lift it above
    ''correct but plain''.'
  - 'DE-03: sorting descending already creates ranking, but there is no explicit focal
    point calling out the leader — consider a small visual emphasis (e.g. a distinct
    shade, marker, or annotation) on the top bar so the insight (''JavaScript leads'')
    is immediate rather than inferred from height alone.'
  - 'LM-02: nothing distinctive to ECharts is used — the implementation could pass
    for any bar-chart library with minor syntax changes. Consider an ECharts-specific
    touch such as itemStyle.borderRadius on the bar tops, an emphasis/focus state,
    or a richer tooltip formatter to leverage library-specific strengths (static PNG
    will not show interactive-only features, but code quality/mastery is still evaluated
    on the option config).'
  - 'CQ-01: the lcg() helper is a function definition, a mild deviation from strict
    KISS linear structure — acceptable here since the ECharts guide explicitly recommends
    a tiny fixed-seed LCG for browser-side reproducibility (no seeded RNG exists in
    JS), so no action needed unless it can be inlined without hurting readability.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "count-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Primary Language" and Y-axis title "Number of Responses" both dark ink, clearly readable. Tick labels (category names on X, numeric scale 0-150 on Y) are a lighter secondary-ink gray, fully legible against the light background. Subtle horizontal gridlines only, no vertical gridlines, y-axis spine hidden, x-axis baseline kept, tick marks removed.
      Data: Single series of 7 vertical bars in brand green (#009E73), sorted descending: JavaScript 146, Python 139, Java 100, TypeScript 89, Go 62, Rust 33, C++ 31. Each bar has a precise count label in dark ink directly above it.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white and light gray respectively — all clearly legible against the dark background. No dark-on-dark failures observed; gridlines remain subtle and visible.
      Data: Same 7 bars, identical brand green (#009E73) fill and identical values/order as the light render — data colors did not shift between themes, only chrome flipped as expected. Count labels above bars are light-colored and clearly legible.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures.
