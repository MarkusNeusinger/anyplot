review:
  strengths:
  - Correctly implements count-plot semantics (raw records generated, then counted)
    rather than plotting pre-aggregated values
  - 'Clear data storytelling: subtitle states the takeaway, reinforced by the average
    reference line and a bolder leading-bar label'
  - Theme-adaptive throughout — brand green identical across renders, ink tokens correctly
    flip chrome, verified legible down to the 400px thumbnail
  - Idiomatic, fairly advanced MUI X usage (composed ChartsReferenceLine, ownerState-based
    functional slotProps)
  weaknesses:
  - The 'Avg 103' reference-line label (13px) is noticeably smaller than the rest
    of the chrome (15-16px) — could be bumped slightly for better parity, though still
    legible
  - Bar value labels sit mid-bar rather than above the bar tops; fine at the current
    bar heights but worth keeping in mind if data ranges shrink in future edits
  - The yTickFontSize offset-derivation comment is a bit elaborate for what it does
    (reserving axis-label offset space) — functionally correct, just could be simplified
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "count-basic · javascript · muix · anyplot.ai" and subtitle "Technical tickets run 68% above the category average" in dark ink, top-left. Axis labels ("Support Ticket Category", "Number of Tickets") and tick labels in dark/soft ink, all clearly readable. Subtle horizontal gridlines. Dashed average reference line ("Avg 103") in soft ink gray.
      Data: All 6 bars are brand green #009E73 with a thin ink-colored edge stroke. In-bar value labels (174, 147, 114, 95, 55, 35) rendered in dark ink, clearly legible against the green fill; leading "Technical" bar's label is bolder/larger as an emphasis cue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Title, subtitle, axis labels, tick labels, gridlines, and reference line all flip to light ink/gray tones. All fully readable — no dark-on-dark failures.
      Data: Bars remain the identical #009E73 green as the light render — confirmed no data-color drift. In-bar value labels switch to light ink (#F0EFE8-ish), clearly legible against the green fill.
      Legibility verdict: PASS

    Both renders additionally checked at the generated 400px thumbnail (plot-light_400.png / plot-dark_400.png) — all text, including the smallest "Avg 103" reference-line label, remains legible at that scale.
