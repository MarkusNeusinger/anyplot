review:
  strengths:
  - Counts are computed from 620 raw ticket records with a Map tally, then ranked
    by descending frequency, so the chart is a genuine count plot rather than pre-aggregated
    bars; the six counts sum to the stated n = 620
  - 'Uses the MUI X dataset + dataKey API with barLabel: ''value'' and barLabelPlacement:
    ''outside'', so count labels sit just above each bar in bold ink and stay readable
    in both themes'
  - 'Count axis starts at 0 with tickMinStep: 1 and evenly spaced whole-number ticks
    (0–180), with HEADROOM_SHARE leaving room for the top label so nothing clips'
  - 'Single brand green #009E73 for every bar, identical in both renders; chrome (ink,
    inkSoft, grid) threaded from ANYPLOT_TOKENS so both themes are fully legible'
  - 'Typographic hierarchy built with MUI Typography: 600-weight title, inkSoft subtitle
    stating n and category count, bold count labels; axis ticks and axis line on the
    y side disabled for a quiet frame'
  - Native MUI X tooltips and hover highlighting stay available in the HTML output
  weaknesses:
  - 'VQ-05 (both): a dead band of about 100 px (≈9 % of the canvas height) sits between
    the subtitle and the top gridline, because the y domain ends at an unlabeled 191.4
    above the 180 tick and the header adds its own 88 px + 24 px top margin → tighten
    it to about 40–50 px (about −50 px), e.g. a smaller chart top margin or a header
    that ends closer to the plot. Likely cause: margin.top: 24 plus HEADER_H = 88
    with pt/gap padding, on top of the non-tick headroom above 180.'
  - 'Suggestion: percentage annotations (the share of the 620 tickets) next to each
    count would add the relative proportion the Notes allow.'
  - 'Suggestion: a nice-rounded y maximum (e.g. 200) would end the axis on a labeled
    tick instead of an unlabeled 191.'
  image_description: |-
