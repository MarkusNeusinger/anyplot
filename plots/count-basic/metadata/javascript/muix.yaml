review:
  strengths:
  - Bars sorted descending by frequency (174 → 35), giving the chart an immediate,
    legible ranking narrative
  - In-bar value labels (barLabel="value") make exact counts readable without a separate
    data table
  - Data is generated as raw per-ticket observations and counted via a Map, honoring
    the count-plot spec (counting from raw data, not pre-aggregated values)
  - Deterministic LCG-seeded synthetic data (620 support tickets across 6 categories)
    with plausible, neutral real-world framing and sensible category-to-category ratios
  - Clean single-series Imprint green (#009E73) identical between light and dark renders;
    only chrome (background, ink, grid) adapts to theme
  - Horizontal-only grid keeps the plot uncluttered; y-axis headroom (max*1.15) prevents
    the tallest bar's label from touching the plot top
  - Legend correctly hidden for the single-series case since the x-axis label already
    identifies the category dimension
  weaknesses:
  - 'Design Excellence is only moderate: bars are a single flat color with rounded
    corners but no further custom polish (e.g., no subtle value-driven emphasis on
    the top category, no custom axis line removal) — axis lines (MuiChartsAxis-line)
    remain visible on both bottom and left rather than being reduced/removed for a
    more refined look'
  - 'Library Mastery is fairly generic: uses BarChart with band xAxis, barLabel, and
    grid — solid idiomatic usage but doesn''t showcase more distinctive MUI X capabilities
    (e.g., custom bar coloring per threshold, ChartsTooltip customization, ChartsReferenceLine
    for a mean/threshold marker) that would differentiate it further'
  - At the 400px mobile-scale thumbnail, x-axis category tick labels (e.g., "Feature
    Request") are noticeably small and start to compress toward legibility limits,
    though still readable
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface.
      Chrome: Title "count-basic · javascript · muix · anyplot.ai" in dark ink, top-left, clearly readable. X-axis title "Support Ticket Category" and y-axis title "Number of Tickets" in dark ink, both legible. Tick labels (category names and 0-200 y-axis scale) in a slightly softer dark gray, all readable. Horizontal grid lines are subtle light gray, visible but unobtrusive.
      Data: Single series of vertical bars in Imprint brand green (#009E73), sorted descending (Technical 174, Billing 147, Shipping 114, Account 95, Feature Request 55, Other 35). Bold black value labels centered inside each bar, clearly legible against the green fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface.
      Chrome: Title, axis titles, and tick labels have flipped to light/off-white ink, clearly legible against the dark background. Grid lines are subtle dark-gray, visible but unobtrusive. No dark-on-dark or hard-to-read chrome elements observed.
      Data: Same six bars in the identical Imprint green (#009E73) as the light render, with in-bar value labels flipped to white/light text for contrast against the green fill on the dark canvas. Bar heights and order match the light render exactly.
      Legibility verdict: PASS
