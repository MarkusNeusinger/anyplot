review:
  strengths:
  - 'Correctly implements the count-plot concept: simulates 620 raw ticket records
    with a seeded LCG and derives bar heights by counting occurrences, rather than
    plotting pre-aggregated values'
  - Bars sorted descending by frequency per the spec notes, giving a clear, readable
    hierarchy from most to least frequent category
  - Inline value labels (barLabel="value") satisfy the spec's 'count labels on or
    above bars for precise reading' note without extra chart clutter
  - 'Theme-adaptive chrome correctly threaded through window.ANYPLOT_TOKENS: ink/inkSoft
    for axis and grid, first series is Imprint brand green #009E73, identical across
    light and dark renders'
  - Single-series legend correctly suppressed (slotProps.legend.hidden), avoiding
    a redundant legend
  - Clean L-shaped axis presentation with disableTicks and subtle grid.horizontal
    only, matching the style guide's grid/spine guidance
  - Y-axis headroom (max = 1.15x the largest count) prevents the tallest bar's value
    label from crowding the axis ceiling
  weaknesses:
  - Design is competent but fairly plain — a single flat brand-green fill with no
    additional emphasis technique (e.g., highlighting the top category, subtitle,
    or annotation) to strengthen the visual storytelling beyond the sort order
  - No redundant/secondary encoding beyond color+position (e.g., a subtle percentage-of-total
    annotation, which the spec explicitly calls out as optional) — would add polish
    without much complexity
  - Title occupies a comparatively small share of the plot width (~25-30%) versus
    the 50-70% guideline range; not a violation (title is short and not overflowing/squeezed)
    but there is headroom to use a slightly larger title fontsize for stronger visual
    hierarchy
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white surface consistent with #FAF8F1, not pure white.
      Chrome: Title "count-basic · javascript · muix · anyplot.ai" in dark ink at top-left, clearly legible. X-axis label "Support Ticket Category" and Y-axis label "Number of Tickets" in dark ink, both readable. Tick labels (category names, numeric Y ticks 0-200) in a slightly softer dark gray, all legible. Horizontal gridlines are thin and subtle, do not compete with the bars.
      Data: Six vertical bars in Imprint brand green (#009E73), sorted descending: Technical (174), Billing (147), Shipping (114), Account (95), Feature Request (55), Other (35). Each bar carries a bold dark-ink value label near its top-middle, clearly readable against the green fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black surface consistent with #1A1A17, not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/off-white, clearly legible against the dark background. No dark-on-dark text observed anywhere. Gridlines are faint light lines, subtle but visible.
      Data: Same six bars in the identical brand green (#009E73) as the light render — confirms the data color did not shift between themes. Value labels flip to white/light text on the green fill, remaining clearly readable (no white-on-green legibility issue).
      Legibility verdict: PASS
