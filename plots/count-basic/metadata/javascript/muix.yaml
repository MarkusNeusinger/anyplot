review:
  strengths:
  - 'Native MUI X bar labels (`barLabel: "value"`, `barLabelPlacement: "outside"`)
    put each count above its bar, readable in both themes and never colliding'
  - Counts are computed from 620 raw observations and sorted by descending frequency;
    one Imprint green (#009E73) for every bar, as the basic variant asks
  - 'Count axis starts at zero with whole-number ticks (`tickMinStep: 1`) and a headroom
    derived from the top count, not a typed limit'
  - Uses the `dataset` + `dataKey` API and `categoryGapRatio` for even bar width and
    spacing; `skipAnimation` and theme tokens wired through every chrome element
  - 'Typographic header built with MUI Typography: bold title over a soft-ink subtitle
    that states n and the sort order; ticks and the y-axis line are dropped for a
    quiet frame'
  - Library-native tooltips and highlighting remain available in the HTML output
  weaknesses:
  - 'Suggestion: the x-axis title sits about 45 px below the category labels; a tighter
    x-axis band (around 52 px) would tie it to the ticks.'
  - 'Suggestion: optional percentage shares next to the counts (the Notes allow them)
    would show each category''s part of the 620 tickets.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "Support Tickets · count-basic · javascript · muix · anyplot.ai" top-left (~42% of width), soft-ink subtitle "n = 620 observations in 6 categories, sorted by count"; y-axis title "Count", x-axis title "Support ticket category", tick labels 0–180 in steps of 20 and six category names, all dark and crisp; subtle light-grey horizontal grid; dark baseline at zero.
      Data: six vertical bars in #009E73, rounded tops, even width and gaps, sorted descending: Technical 174, Billing 147, Shipping 114, Account 95, Feature Request 55, Other 35; bold dark count labels above each bar.
