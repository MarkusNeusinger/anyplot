review:
  strengths:
  - Counts raw simulated ticket records (deterministic LCG, seed 42) instead of plotting
    pre-computed values, matching the count-plot definition in the spec
  - Bars sorted descending by frequency with in-bar value labels (barLabel="value"),
    exactly matching the spec's 'sort by frequency' and 'consider count labels' notes
  - Mean reference line (ChartsReferenceLine) adds real analytical value, showing
    which categories run above/below average ticket volume
  - Explicit font sizes throughout (title 22px, axis labels 16px, ticks 15px) with
    balanced X/Y proportions and no overlap in either theme
  - Correct Imprint palette (#009E73 first/only series) and theme-correct chrome in
    both renders — cream/near-black backgrounds, light/dark text that flips correctly
  - 'Clean idiomatic MUI X usage: band-scale xAxis, disableTicks/disableLine for a
    minimal-chrome look, horizontal-only grid, skipAnimation set'
  weaknesses:
  - 'Design Excellence is still close to a well-configured default: a single flat
    green fill with no gradient/texture/secondary accent — consider a subtle bar-top
    highlight, alternating opacity for the reference categories, or a callout annotation
    on the top bar to push past ''competent'' into ''publication-ready'''
  - Data storytelling relies only on the sort order + average line; no explicit annotation
    surfaces the takeaway (e.g., 'Technical tickets are 69% above average') — a short
    annotation near the top bar would sharpen the insight
  - 'Y-axis ''tickFontSize: 36'' is used purely as a layout-offset hack (per the code
    comment) to prevent the y-axis label colliding with 3-digit tick values — works
    visually here but is fragile if data ranges change; consider increasing ''left''
    margin instead for a more robust fix'
