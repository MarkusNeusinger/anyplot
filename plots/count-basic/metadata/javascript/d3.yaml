review:
  strengths:
  - Genuinely counts from raw per-respondent data via d3.rollup(surveyResponses, v
    => v.length, d => d) rather than pre-aggregating — matches the spec's core distinction
    between a count plot and a basic bar chart
  - Bars correctly sorted descending by frequency with count labels placed above each
    bar for precise reading, exactly matching the spec's Notes section
  - All font sizes explicitly set (26px title, 17px subtitle, 18px axis titles, 16px
    ticks/labels) and fully legible with no overlap or overflow in both themes
  - 'Imprint palette correctly applied: first series is #009E73, identical between
    light and dark renders; backgrounds are correct #FAF8F1 / #1A1A17 with all chrome
    theme-adaptive'
  - 'Clean, idiomatic D3 v7 patterns: scaleBand/scaleLinear, axisBottom/axisLeft,
    selection.data().join() for both bars and labels, deterministic LCG-seeded data
    generation'
  - Subtitle ('Developer survey · n = 640 respondents · sorted by frequency') adds
    useful context without cluttering the chart, and single-series legend is correctly
    omitted
  weaknesses:
  - 'Design Excellence is capped by a single mandated brand-green fill with no additional
    visual hierarchy device (e.g. a subtle bar-edge stroke per the style guide''s
    ''Bar edges: subtle white or slightly darker edge for definition'', or a highlighted
    focal bar) — plot reads as a well-configured default rather than a distinctive
    design'
  - Data storytelling relies only on descending sort + the subtitle's textual note;
    no visual emphasis (e.g. muted color or reduced opacity on the long tail vs. the
    top language) singles out the actual insight for the viewer
  - d3.rollup is a nice distinctive touch, but the rest of the implementation (bars,
    axes, labels) is generic and could be reproduced near-identically in any bar-chart-capable
    library — leverage one more D3-specific capability (e.g. a custom tick format,
    or a subtly interpolated bar-enter transition state baked into the static frame)
    to raise Library Mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "count-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered top; subtitle "Developer survey · n = 640 respondents · sorted by frequency" in softer grey-ink directly below. Y-axis label "Number of Respondents" (rotated) and X-axis label "Primary Programming Language" in dark ink. Tick labels (Python, JavaScript, TypeScript, Java, Go, Rust, C++ on x; 0-180 on y) in soft dark grey. Subtle light-grey horizontal gridlines only. All text clearly readable against the light background.
      Data: Seven vertical bars in brand green (#009E73), sorted descending: Python 165, JavaScript 154, TypeScript 101, Java 87, Go 65, Rust 36, C++ 32. Bold black count labels sit just above each bar. No axis spines/domain lines, tick marks removed (labels only).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle text now in light off-white / soft light-grey ink, fully legible against the dark surface. Axis titles and tick labels rendered in light tones, gridlines in a faint light-grey. No dark-on-dark text anywhere.
      Data: Identical bar heights, order, and count values as the light render, in the exact same brand green (#009E73) — data color unchanged between themes, only chrome flipped. Count labels above bars rendered in light ink, clearly readable on the dark background.
      Legibility verdict: PASS
