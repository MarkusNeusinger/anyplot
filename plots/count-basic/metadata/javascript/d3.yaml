review:
  strengths:
  - Genuinely counts raw per-respondent observations via d3.rollup instead of pre-aggregating
    — matches the count-basic spec's defining distinction from a basic bar chart
  - Sorted descending by frequency with count labels above each bar, exactly per the
    spec's notes
  - 'Fixed W1 from the previous review: the mean-reference line and its label now
    use the theme-adaptive ink/neutral token instead of amber, so it no longer competes
    semantically with the amber ''Most common'' leader callout'
  - 'Count-label halo (paint-order: stroke with pageBg) keeps digits legible where
    they sit close to the mean line'
  - 'Clean chrome: tick marks removed, axis domains removed, y-axis-only subtle gridlines,
    generous margins'
  - Deterministic LCG-seeded weighted sampling produces realistic, plausible developer-survey
    proportions (Python > JavaScript > TypeScript > Java > Go > Rust > C++)
  - All font sizes explicitly set and legible in both themes; no clipping or overflow
    at the canvas edges
  weaknesses:
  - 'Data-color identity is broken between themes for 5 of the 7 bars: the emphasis
    scale applies fill-opacity (0.6-1.0) to the same palette[0] hex, but that opacity
    composites against the theme''s page background, so e.g. the TypeScript bar renders
    as roughly rgb(48,176,140) — pale mint — on the #FAF8F1 light background and roughly
    rgb(5,133,97) — dark forest green — on the #1A1A17 dark background. These are
    visibly different colors, not just a chrome flip. Fix: keep all bars at fill-opacity
    1 with the single palette[0] hex (matching the spec''s ''one color for all bars''
    requirement) and create emphasis through sort order, a thin ink-colored stroke,
    or a callout instead of opacity blended over the page background.'
  - 'Variant creep on this -basic spec: the dashed mean-reference line (with its ''Mean
    = 91'' label) and the diamond ''Most common'' callout are annotation layers that
    the spec''s Notes (count labels, optional percentage annotations only) and the
    characteristic bullet (''one color for all bars ... no second grouping variable,
    stacking, error bars or cumulative line'') do not ask for. Consider removing these
    two extra layers, or limiting embellishment to what the Notes/characteristics
    explicitly permit, so the basic variant earns its storytelling from data and sort
    order rather than added encodings.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "count-basic · javascript · d3 · anyplot.ai" in bold dark ink at top center, subtitle "Developer survey · n = 640 respondents · sorted by frequency" below it in softer gray. X-axis label "Primary Programming Language" and Y-axis label "Number of Respondents" both in dark ink. Y-axis ticks (0-180 by 20s) and 7 category tick labels (Python, JavaScript, TypeScript, Java, Go, Rust, C++) in soft gray. Subtle horizontal gridlines only, no visible spines. All text is clearly legible against the light background.
      Data: 7 vertical bars in brand green (#009E73), fill-opacity fading from full strength on Python (165) down toward ~0.6 on C++ (32) to create a visual focal point. Black count labels with a light halo sit above each bar (165, 154, 101, 87, 65, 36, 32). A now gray/ink dashed mean line (91) with a "Mean = 91" label sits at the right (recolored from amber in the previous version). An amber diamond marker and "Most common" text sit above the Python bar.
      Legibility verdict: PASS — no overlapping or clipped text, all chrome and data elements readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light ink (white/near-white for title, soft light gray for subtitle) — fully readable against the dark surface. Axis titles in light ink, tick labels in soft light gray. Gridlines remain subtle and visible. No dark-on-dark text found anywhere.
      Data: Bars use the same palette[0] hex and the same fill-opacity gradient as the light render, but composited against the near-black background the faded bars (TypeScript through C++) render as noticeably darker, more saturated greens than their pale-mint counterparts in the light render — the data color is NOT visually identical between the two themes for these 5 bars (confirmed by pixel sampling: TypeScript ≈ rgb(48,176,140) light vs. rgb(5,133,97) dark). Only Python (full opacity) is a true, unshifted #009E73 in both themes. The mean line, its label, the diamond marker, and the "Most common" text are all unchanged in hue and legible on the dark surface.
      Legibility verdict: PASS for text — all title/axis/tick/annotation text uses theme-adaptive light ink tokens correctly; FAIL for strict data-color identity on the 5 opacity-faded bars (see weaknesses).
