review:
  strengths:
  - Genuinely counts raw per-respondent observations with d3.rollup over a 640-element
    response array instead of pre-aggregating, which is exactly the distinction the
    count-basic spec draws against a plain bar chart
  - 'Idiomatic modern D3 7 throughout: selection.join() data-joins for bars, labels
    and gridlines, scaleBand/scaleLinear().nice(), axisBottom/axisLeft with tickSize(0)+tickPadding,
    d3.format(",d") for whole-number count ticks, d3.descending for the sort'
  - All seven bars use a single full-opacity t.palette[0] (#009E73), so the data color
    is pixel-identical between the light and dark renders and only chrome flips
  - 'Clean chrome per the style guide: axis domains removed, tick marks removed, y-axis-only
    gridlines at the subtle t.grid token, generous margins, nothing crowding the canvas
    edge'
  - 'Every font size is set explicitly (title 26px, subtitle 17px, axis titles 18px,
    ticks and count labels 16px in the 1600x900 mount) and every element reads clearly
    on both #FAF8F1 and #1A1A17'
  - Deterministic fixed-seed LCG weighted sampling -- the reproducibility pattern
    the d3 prompt prescribes for a browser runtime with no seeded RNG -- yielding
    a plausible descending language distribution that sums exactly to the stated n
    = 640
  - Count axis starts at zero, is never truncated, and carries whole-number ticks,
    so bar height stays strictly proportional to the count
  - Thin ink stroke at 0.15 opacity gives the bars definition against both surfaces
    without reading as a border
  weaknesses:
  - 'Suggestion: the Notes allow percentage annotations -- a small share figure under
    each count label would let readers read each language''s slice of the 640 respondents
    without arithmetic.'
  - 'Suggestion: the title at 26px against 18px axis titles is a fairly shallow typographic
    step; a slightly larger title would sharpen the hierarchy.'
  - 'Suggestion: the top margin (170 of 900 mount px) leaves a wide band between the
    subtitle and the 180 gridline; tightening it a little would give the bars more
    vertical presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across the full 3200x1800 canvas -- not pure white, not dark. No painted rect over the harness page background.
      Chrome: Bold dark-ink title "count-basic - javascript - d3 - anyplot.ai" centered at the top, with a softer gray subtitle "Developer survey - n = 640 respondents - sorted by frequency" directly beneath it. X-axis title "Primary Programming Language" and rotated Y-axis title "Number of Respondents" both in dark ink. Y tick labels 0/20/.../180 and the seven category tick labels (Python, JavaScript, TypeScript, Java, Go, Rust, C++) in soft gray. Horizontal gridlines only, subtle but clearly visible; no spines, no tick marks. All text is clearly readable against the light background; nothing is light-on-light, nothing overlaps, nothing is clipped at any canvas edge.
      Data: Seven vertical bars, all in the same full-opacity brand green #009E73 (t.palette[0]) with a hairline ink stroke at 0.15 opacity for definition. Equal bar width, even gaps, descending order. Bold dark-ink count labels sit above each bar: 165, 154, 101, 87, 65, 36, 32 (sum = 640, matching the stated n). Bars rise from a zero baseline; no reference line, no highlight, no callout, no second color.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 -- not pure black, not light.
      Chrome: Title and count labels flip to near-white primary ink; subtitle and tick labels to soft light gray; axis titles to light ink. Gridlines remain subtle and visible against the dark surface. No dark-on-dark text anywhere -- every title, axis title, tick label and count label is comfortably readable.
      Data: Identical to the light render. All seven bars are the same full-opacity #009E73; because no fill-opacity is applied there is no compositing against the page background, so the bar green is pixel-identical between the two themes. Same heights, same widths, same gaps, same count labels.
      Legibility verdict: PASS
