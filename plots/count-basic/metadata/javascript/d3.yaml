review:
  strengths:
  - 'Correct count-plot semantics: raw per-respondent observations are counted at
    render time via d3.rollup rather than pre-aggregated, matching the spec''s core
    distinguishing feature'
  - Bars sorted descending by frequency per the spec's Notes, with bold count labels
    above each bar for precise reading
  - 'Opacity-scaled fill (0.6-1.0, driven by count) creates a clear focal point on
    the leading category while staying strictly within the Imprint palette (single
    #009E73 source color, alpha only)'
  - 'Fully theme-adaptive chrome: axis domains removed, subtle y-axis-only gridlines,
    all text explicitly sized and colored from ANYPLOT_TOKENS, fully legible in both
    light and dark renders'
  - Realistic, neutral dataset (developer survey by primary language, n=640) with
    a plausible long-tail distribution across 7 categories
  - 'Clean idiomatic d3: d3.rollup for aggregation, scaleBand/scaleLinear, data joins
    with .join(), no manual DOM manipulation outside the D3 idiom'
  weaknesses:
  - Design still reads as a well-executed standard sorted bar chart; a secondary encoding
    (e.g. a subtle amber reference line/annotation on the leading category) would
    push aesthetic sophistication further toward publication tier
  - Library-mastery usage is centered on d3.rollup for the count aggregation; no other
    d3-distinctive mechanics (custom tick formatting, layered generators, etc.) are
    exercised
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "count-basic · javascript · d3 · anyplot.ai" (bold, dark) and subtitle "Developer survey · n = 640 respondents · sorted by frequency" (softer gray) centered at top; x-axis title "Primary Programming Language" and y-axis title "Number of Respondents" in dark ink; tick labels (Python, JavaScript, TypeScript, Java, Go, Rust, C++ on x; 0-180 on y) in soft gray; all clearly legible against the light background.
      Data: 7 vertical bars sorted descending (165, 154, 101, 87, 65, 36, 32), rendered in #009E73 with fill-opacity scaled from 1.0 (Python, leftmost) down to ~0.6 (C++, rightmost), giving a visible emphasis gradient toward the leading category; bold count labels sit directly above each bar; subtle horizontal gridlines only.
      Legibility verdict: PASS — no light-on-light text, all elements readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-title/tick-label structure, now rendered in white/light-gray tones; all text clearly visible against the dark background, no dark-on-dark failures observed.
      Data: Same 7 bars with identical underlying fill color (#009E73) and the same per-bar opacity values as the light render — the leading bar (Python) remains the most vivid/saturated in both themes, confirming the data-color mapping (fill attribute, not a theme swap) is unchanged between themes; only the alpha-composited appearance shifts naturally with the different background, which is expected and not a theme-based recolor.
      Legibility verdict: PASS — no dark-on-dark text, brand green #009E73 reads clearly on the near-black surface.
