review:
  strengths:
  - Genuinely counts raw per-respondent observations via d3.rollup instead of pre-aggregating
    — matches the count-basic spec's defining distinction from a basic bar chart
  - Sorted descending by frequency with count labels above each bar, exactly per the
    spec's notes
  - 'Adds real analytical value beyond the base requirement: a dashed mean-reference
    line with label, and a diamond-symbol ''Most common'' callout on the leading category'
  - Opacity fade (0.6-1.0) tied to count gives the leading bar a focal point without
    introducing a second data color
  - 'Count-label halo (paint-order: stroke with pageBg) keeps digits legible where
    they sit close to the mean line'
  - 'Clean chrome: tick marks removed, axis domains removed, y-axis-only subtle gridlines,
    generous margins'
  - Deterministic LCG-seeded weighted sampling produces realistic, plausible developer-survey
    proportions (Python > JavaScript > TypeScript > Java > Go > Rust > C++)
  - All font sizes explicitly set and legible in both themes; no clipping or overflow
    at the canvas edges
  weaknesses:
  - The mean-reference line and the 'Most common' callout both use the amber semantic
    anchor; the style guide reserves 'neutral' specifically for baseline/reference
    lines and amber for warning/caution, so the two distinct annotations currently
    read as the same signal type — consider using the theme-adaptive neutral/ink token
    for the mean line and reserving amber for the leader callout
  - The Java count label ('87') sits very close to the amber mean line ('Mean = 91')
    — the halo keeps it readable but the two elements are tight; a touch more vertical
    offset would give it more breathing room
  - 'Library Mastery is strong but not maximal: the emphasis opacity scale and diamond
    annotation are nice touches yet still fairly transferable techniques rather than
    something uniquely D3 (e.g. force/voronoi/hierarchy)'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "count-basic · javascript · d3 · anyplot.ai" in bold dark ink at top center, subtitle "Developer survey · n = 640 respondents · sorted by frequency" below it in softer gray. X-axis label "Primary Programming Language" and Y-axis label "Number of Respondents" both in dark ink. Y-axis ticks (0-180 by 20s) and 7 category tick labels (Python, JavaScript, TypeScript, Java, Go, Rust, C++) in soft gray. Subtle horizontal gridlines only. All text clearly legible against the light background.
      Data: 7 vertical bars in brand green (#009E73), opacity fading from full strength on Python (165) down to ~0.6 on C++ (32), giving the leading bar visual weight. Black count labels with a light halo sit above each bar (165, 154, 101, 87, 65, 36, 32). An amber dashed line marks the mean (91) with a "Mean = 91" label at the right. An amber diamond marker and "Most common" text sit above the Python bar. First series correctly renders in brand green #009E73.
      Legibility verdict: PASS — no overlapping or clipped text, all chrome and data elements readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle now render in light ink (white/near-white for title, soft light gray for subtitle) — fully readable against the dark surface. Axis titles in light ink, tick labels in soft light gray. Gridlines remain subtle and visible.
      Data: Bars are the identical brand green (#009E73) with the same opacity fade as the light render — data colors did not shift between themes. Count labels are light-colored with a dark halo (matching pageBg), remaining legible even close to the amber mean line. The amber mean line, "Mean = 91" label, diamond marker, and "Most common" annotation are unchanged in hue and equally legible on the dark surface.
      Legibility verdict: PASS — no dark-on-dark text found; all title/axis/tick/annotation text uses the theme-adaptive light ink tokens correctly.
