review:
  strengths:
  - Bars are sorted by descending frequency and each carries a direct count + percentage
    label, giving instant precise readability without forcing the viewer to compare
    bar heights.
  - The leading category ('Strongly Agree') is highlighted in full brand green (#009E73)
    while the rest use a lightened tint of the same hue -- a tasteful, CVD-safe focal-point
    technique that avoids misusing the multi-hue categorical palette on ordered Likert
    data.
  - Clean theme_minimal base with vertical gridlines removed, tick marks removed,
    and explicit font sizing throughout (title 12pt, axis titles 10pt, tick labels
    8pt); both light and dark chrome tokens (PAGE_BG, INK, INK_SOFT) are applied consistently
    in both renders.
  - Realistic, neutral 5-point Likert survey scenario (n=480) with proportions that
    check out correctly against the displayed percentages (157/480=33%, 152/480=32%,
    78/480=16%, 64/480=13%, 29/480=6%, summing to 100%).
  weaknesses:
  - Y-axis gridlines use full-opacity INK color (solid, matching axis-line weight)
    instead of a faint/reduced-contrast version -- the ggplot2 library guide itself
    notes there's no grid alpha parameter and recommends 'a faint INK color' specifically
    to avoid this; blend INK toward PAGE_BG (e.g. a ~15% mix) or use a softer grey
    token so gridlines recede behind the bars.
  - Design relies on a single accent technique (leader highlight); still reads as
    a well-executed but fairly standard bar chart -- a touch more visual refinement
    (e.g. subtler grid treatment, per the weakness above) would push it further above
    'well-configured default' territory.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "count-basic · r · ggplot2 · anyplot.ai" in dark ink top-left, clearly legible. Axis titles "Survey Response" (x) and "Count" (y) in dark ink. Tick labels (category names, y-axis numbers) in a medium-gray ink-soft tone, fully readable against the cream background. Horizontal gridlines at 50/100/150 render as solid dark lines -- visible and a bit heavier/higher-contrast than the "faint" treatment the style guide calls for, but not unreadable or overlapping data.
      Data: Five bars for "Strongly Agree", "Agree", "Neutral", "Disagree", "Strongly Disagree" sorted descending by count. Leading bar (Strongly Agree) is solid brand green (#009E73); the other four bars are a lighter minty tint of the same green. Each bar has a "count (pct%)" label directly above it (157 (33%), 152 (32%), 78 (16%), 64 (13%), 29 (6%)). No overlap between labels, bars, or axis text.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title and axis titles render in light off-white ink, clearly legible against the dark background. Tick labels render in a lighter gray-ink-soft tone -- fully readable, no dark-on-dark issue anywhere. Horizontal gridlines flip to a light color at the same full-opacity/solid weight as in the light render -- same subtlety concern as above, but text and lines are all correctly theme-flipped and legible.
      Data: Same five categories, same brand-green leader bar (#009E73, identical hex to the light render) with the same lightened-tint secondary bars -- data colors are unchanged between themes, confirming only chrome flipped.
      Legibility verdict: PASS.
