review:
  strengths:
  - 'Counts are tallied by ggplot2''s own stat engine: geom_bar() plus geom_text(stat
    = "count", aes(label = after_stat(count))) label the bars in one pass, with no
    pre-aggregated summary table feeding the labels -- textbook grammar-of-graphics
    usage'
  - 'Typographic focal point without breaking the basic variant: the most-frequent
    bar''s label renders bold and slightly larger via a computed ifelse() aesthetic
    on after_stat(count), so hierarchy comes from type weight while every bar keeps
    the same #009E73 fill'
  - plot.title.position = "plot" plus an explicit plot.margin puts the title and subtitle
    flush to the full canvas width instead of indenting them to the panel -- a clean,
    deliberate left alignment in both renders
  - 'Chrome is fully theme-adaptive and legible in both renders: #FAF8F1 / #1A1A17
    backgrounds, INK / INK_SOFT text, gridlines blended 15% INK into the page color,
    minor grid and axis ticks removed, only a thin x baseline kept'
  - Every bar carries a count plus a percentage label that matches its share of n
    = 480 (33/32/16/13/6 sums to 100), categories sorted by descending frequency,
    zero baseline with whole-number ticks at 0/50/100/150 -- all four affirmative
    spec bullets satisfied
  - Realistic weighted 5-point Likert distribution with a dominant category, a near-tie
    at the top and a 29-response long tail, so the chart shows the full range a count
    plot is meant to reveal
  weaknesses:
  - 'Bar outline uses two custom hexes that are not Imprint palette members and flip
    with the theme (BAR_EDGE = #00714F light / #00C489 dark). The style guide''s endorsed
    outline pattern is a thin stroke in the theme''s ink/neutral token, and its hard
    rule is ''never introduce custom hex values when the Imprint palette already covers
    the need'' -- switch the stroke to the INK/INK_SOFT token (or drop it) so only
    chrome, never a data mark''s color, depends on the theme.'
  - 'The title block is small for the canvas: at plot.title size = 12 the mandated
    title spans only ~42% of the 3200 px width (guideline is 50-70%), leaving the
    upper right of the canvas empty. Raising plot.title to ~14 and the subtitle to
    ~9.5 would fill the band and help legibility when the PNG is scaled to a ~400
    px thumbnail.'
  - 'scale_y_continuous(expand = expansion(mult = c(0, 0.19))) buys headroom the bold
    top label did not need: the bars now reach ~10% less canvas height than at the
    previous 0.14. A value around 0.15 keeps the label clear of the panel edge while
    giving the data back that height.'
  - Axis tick labels at size = 8 are the smallest text on the canvas; at a ~400 px
    mobile width they land near the readability floor. Consider ~9 for axis.text while
    keeping axis.title at 10.
  - 'Code grew 108 -> 124 lines almost entirely in reviewer-facing justification comments
    (a 10-line block explaining which techniques are ''distinctive''), and the label
    is now a nested sprintf() wrapping scales::comma() and scales::percent() that
    renders exactly the same string as the previous sprintf("%d (%.0f%%)"). Keep the
    scales:: formatters, but let the code carry the explanation instead of the commentary.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white across the whole canvas, consistent with #FAF8F1 -- clearly not pure white. 3200x1800.
      Chrome: Bold dark-ink title "count-basic - r - ggplot2 - anyplot.ai" flush to the left canvas margin, with a smaller regular-weight subtitle "Likert-scale survey responses, n = 480" directly beneath it. Axis titles "Survey Response" (x) and "Count" (rotated, y) in dark ink; tick labels 0/50/100/150 and the five category names in medium-gray ink-soft. Three faint horizontal gridlines at 50/100/150, no vertical grid, no tick marks, a thin gray baseline under the bars. All text reads clearly against the light page -- nothing light-on-light.
      Data: Five bars of identical width and even gaps, all solid brand green #009E73 with a darker-green edge stroke, sorted descending: Strongly Agree 157 (33%), Agree 152 (32%), Neutral 78 (16%), Disagree 64 (13%), Strongly Disagree 29 (6%). Each bar carries its "count (pct%)" label just above it; the top bar's label is bold and slightly larger, the only emphasis in the chart. Bars rise from a zero baseline; heights are proportional to the counts.
      Legibility verdict: PASS -- title, subtitle, axis titles, tick labels and all five data labels are fully readable; no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title flips to light off-white, subtitle and tick labels to light gray, axis titles to light ink; gridlines and the baseline flip to a faint light tone at the same low-contrast weight as the light render. No dark-on-dark anywhere -- every text element sits at high contrast on the near-black page.
      Data: Bar fill is identical to the light render (#009E73), same five bars, same order, same counts and percentages, same bold/larger label on the top bar. One difference beyond chrome: the bar edge stroke is a lighter green in this theme (#00C489) than in the light one (#00714F), so a data mark's outline color -- not only chrome -- depends on the theme.
      Legibility verdict: PASS -- all text readable against the dark background, brand green clearly visible on the near-black surface, no clipping.
