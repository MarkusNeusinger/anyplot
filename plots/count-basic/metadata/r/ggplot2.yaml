review:
  strengths:
  - Idiomatic use of geom_bar() with stat="count" on raw, uncounted survey responses
    — exactly matches the spec's emphasis on automatic tallying rather than pre-aggregated
    bar charts
  - Bars correctly sorted descending by frequency (via factor releveling) with precise
    count labels placed above each bar, per the spec's notes
  - 'Theme-adaptive chrome correctly implemented in both renders: backgrounds match
    #FAF8F1 (light) / #1A1A17 (dark) exactly, data color #009E73 identical across
    themes, all text legible with no dark-on-dark or light-on-light failures'
  - Clean minimal-chrome treatment — vertical gridlines and axis ticks removed, only
    subtle horizontal gridlines retained
  - Correct canvas size (3200×1800 landscape via width=8, height=4.5, dpi=400), no
    clipped or overflowing elements at any edge
  - Reproducible (set.seed(42)), clean imports (dplyr and ragg both actually used),
    correct ggsave/ragg::agg_png API usage
  weaknesses:
  - Design excellence is standard/expected rather than distinctive — the descending
    sort creates hierarchy, but there is no additional focal-point device (e.g. a
    distinct shade or subtle annotation calling out the leading category) to elevate
    the storytelling beyond the baseline
  - 'Redundant theme declaration: `axis.text.x = element_text(color = INK_SOFT, size
    = 8)` on line 73 duplicates the values already set by `axis.text` on line 72 —
    remove for a cleaner KISS structure'
  - The optional percentage-of-total annotation suggested in the spec's notes is not
    present; would add informational depth alongside the raw counts
  image_description: |-
