review:
  strengths:
  - 'Counts are tallied by ggplot2''s own stat engine: geom_bar() plus geom_text(stat
    = "count") with an after_stat(count) label tally and annotate the bars in one
    pass, with no pre-aggregated summary table behind the labels -- textbook grammar-of-graphics
    usage'
  - 'The bar stroke is the theme''s INK token, so the #009E73 fill is the only data
    color in the chart and it is pixel-identical in both renders; the outline flips
    with the chrome exactly as the style guide''s endorsed outline pattern prescribes'
  - after_stat()-driven conditional fontface and size, resolved through scale_size_identity(),
    render the most-frequent bar's label bold and slightly larger -- hierarchy carried
    by type weight alone while all five bars keep the same fill
  - plot.title.position = "plot" with an explicit plot.margin sets the title and subtitle
    flush to the full canvas width instead of indenting them to the panel, a deliberate
    left alignment in both renders
  - 'Chrome is fully theme-adaptive and legible in both renders: #FAF8F1 / #1A1A17
    pages, INK / INK_SOFT text, gridlines blended ~15% INK into the page color, minor
    grid and tick marks removed, only a thin x baseline kept'
  - Every bar carries a count and a percentage matching its share of n = 480 (33/32/16/13/6
    sums to 100), categories run in descending frequency, and the count axis starts
    at zero with whole-number ticks at 0/50/100/150 -- all four affirmative spec bullets
    satisfied
  - scales::comma() and scales::percent() format the stat-computed values idiomatically
    instead of hand-rolled percentage arithmetic
  weaknesses:
  - 'VQ-05 (both): the top expansion leaves a ~19% empty band above the tallest bar,
    more headroom than the bold label needs, so the bars use roughly 10% less panel
    height than the canvas allows -> about 0.15 (-0.04). Likely cause: scale_y_continuous(expand
    = expansion(mult = c(0, 0.19))).'
  - 'VQ-01 (both): axis tick labels at 8 pt are the smallest text on the 3200x1800
    canvas and land near the readability floor when the PNG is scaled to a ~400 px
    thumbnail -> about 9 pt (+1 pt). Likely cause: axis.text = element_text(color
    = INK_SOFT, size = 8).'
  - 'CQ-04 (code): four comment blocks still argue the case to a reviewer instead
    of describing the code ("never a custom hex; a crisp stroke for depth, not a second
    color encoding", "a deliberate breathing-room refinement, not a change to the
    data-to-baseline mapping", "a spacing/typography-only refinement, no new marks
    or color"), and the label wraps scales::comma()/scales::percent() in a sprintf()
    to produce a plain integer and a whole percent -> keep one descriptive line per
    block (about -8 lines). Likely cause: the comments at the BAR_EDGE, geom_bar(),
    scale_y_continuous() and plot.title.position sites.'
  - 'Suggestion: raising plot.title from 12 to about 14 would let the mandated title
    fill more of the top band.'
  - 'Suggestion: naming the survey''s subject in the subtitle would make the scenario
    concrete rather than generically "Likert-scale".'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white across the whole 3200x1800 canvas, consistent with #FAF8F1 -- clearly not pure white, and the panel shares the page color so there is no panel/page seam.
      Chrome: Bold dark-ink title "count-basic · r · ggplot2 · anyplot.ai" flush to the left canvas margin, with a smaller regular-weight subtitle "Likert-scale survey responses, n = 480" directly beneath it. Axis titles "Survey Response" (x) and "Count" (rotated, y) in dark ink; tick labels 0/50/100/150 and the five category names in medium-gray ink-soft. Three faint horizontal gridlines at 50/100/150, no vertical grid, no tick marks, a thin gray baseline under the bars. All text reads clearly against the light page -- nothing light-on-light, nothing clipped at any canvas edge.
      Data: Five bars of identical width with even gaps, all solid brand green #009E73, each outlined by a thin near-black ink stroke; sorted descending -- Strongly Agree 157 (33%), Agree 152 (32%), Neutral 78 (16%), Disagree 64 (13%), Strongly Disagree 29 (6%). Each bar carries its "count (pct%)" label just above it; the top bar's label is bold and slightly larger, the only emphasis in the chart. Bars rise from a zero baseline and heights are proportional to the counts.
      Legibility verdict: PASS -- title, subtitle, axis titles, tick labels and all five data labels are fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title flips to light off-white, subtitle and tick labels to light gray, axis titles to light ink; gridlines and the x baseline flip to a faint light tone at the same low-contrast weight as the light render. No dark-on-dark anywhere -- every text element sits at high contrast on the near-black page.
      Data: Bar fill is identical to the light render (#009E73) -- same five bars, same descending order, same counts and percentages, same bold/larger label on the top bar. The only data-adjacent difference is the outline, which is the theme's INK token and therefore flips to off-white; the fill, the one color that carries data, does not change. Brand green is clearly visible on the near-black surface.
      Legibility verdict: PASS -- all text readable against the dark background, no clipping at any canvas edge.
