review:
  strengths:
  - 'Genuine count-basic semantics: builds a raw per-session device array and manually
    tallies it into a Dict rather than starting from precomputed values'
  - 'Bug fix from the live implementation: the previous bar_colors alpha-differentiation
    branch was dead code (every bar rendered as the identical solid #009E73 despite
    the alpha=0.55 intent); this version drops it and simply uses one honest uniform
    brand-green color for all bars, which is also what the spec''s ''What a good version
    looks like'' section requires (single categorical variable, one color for all
    bars)'
  - Descriptive title prefix ('Device Type Sessions') plus dual count + percentage-of-total
    labels on every bar add real specificity beyond the mandated title/label minimum
  - Correct theme-adaptive chrome in both renders (INK/INK_SOFT/PAGE_BG flip correctly,
    top/right spines hidden, subtle y-only grid), correct descending sort order, correct
    3200x1800 canvas, and thin page-colored bar strokes for definition
  weaknesses:
  - 'Library Mastery is still generic: strokewidth/strokecolor edges and hidespines!
    are used, but no other Makie-distinctive technique (e.g. a Legend, colorbar, or
    layout feature) is demonstrated beyond the basic barplot!/text!/Axis combination'
  - Design excellence relies almost entirely on sort order plus the percentage labels
    for hierarchy; the leading bar carries no restrained visual emphasis (e.g. a slightly
    bolder count-label weight or tick-label treatment on the top category) beyond
    being tallest — any data-level encoding change would violate the basic variant's
    single-color/no-second-variable rule, so keep any future emphasis to typography/label
    treatment, not color or layout
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark-ink title "Device Type Sessions · count-basic · julia · makie · anyplot.ai" comfortably sized and well within plot bounds (~45% width); dark-ink axis titles "Device Type" / "Sessions"; softer-grey tick labels for the five device categories and the 0/500/1000 y-ticks; a subtle horizontal grid at 500 and 1000; left/bottom spines only, top/right hidden.
      Data: Five bars sorted descending (Mobile 1150 / 46.9%, Desktop 820 / 33.5%, Tablet 340 / 13.9%, Smart TV 95 / 3.9%, Wearable 45 / 1.8%), each a solid, uniform brand green (#009E73) with a thin page-colored stroke separating bars, a dark count label centered above each bar and a smaller grey percentage label above that. All bars are the identical color, matching the spec's single-color requirement for the basic variant (no dead/no-op differentiation code left in, unlike the predecessor).
      Legibility verdict: PASS (all title/axis/tick/count/percentage text is clearly readable against the light background).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and axis titles now in light/off-white ink, tick labels in a lighter soft grey, spines and grid flipped to their light-on-dark equivalents.
      Data: Data colors are identical to the light render — every bar is the same #009E73 green in both themes, confirming a chrome-only theme flip. Count and percentage labels remain legible in light-ink / soft-grey against the dark surface, with no dark-on-dark or light-on-light failures.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; all text and bars are clearly distinguishable from the background).
