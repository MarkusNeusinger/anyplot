review:
  strengths:
  - 'Genuine count-plot semantics: builds a raw per-session device array with fill/reduce(vcat),
    shuffles it, and tallies it into a Dict before plotting — the raw-data-to-frequency
    distinction the spec''s Description rests on, rather than plotting pre-computed
    values'
  - 'Correct theme-adaptive chrome in both renders: PAGE_BG/INK/INK_SOFT flip cleanly,
    the #009E73 bar color is identical between light and dark, top/right spines hidden,
    x-grid off and y-grid at 12% ink — a chrome-only theme flip with no dark-on-dark
    or light-on-light element'
  - 'Restrained visual refinement: uniform bar width 0.62 with even gaps, 1.5 px page-colored
    bar strokes for definition, and ylims! headroom that keeps both label tiers clear
    of the top of the axis'
  - Exact 3200x1800 canvas via the prescribed resolution=(1600,900) x px_per_unit=2
    pair, mandated title suffix intact with a permitted descriptive prefix, and count/percentage
    labels that are accurate to the tallies (46.9/33.5/13.9/3.9/1.8% of 2450)
  weaknesses:
  - 'VQ-01 (both): tick labels at 13 pt and the percentage annotations at 11 pt are
    undersized for the 3200x1800 canvas — in the 400 px thumbnail the percentages
    are unresolvable and the y-ticks only barely readable → about 16 pt for tick labels
    (+3 pt) and about 13 pt for the percentage labels (+2 pt). Likely cause: xticklabelsize/yticklabelsize
    = 13 on the Axis and fontsize = 11 on the percentage text! call.'
  - 'DQ-02 (both): every tally is an exact round number (1150 / 820 / 340 / 95 / 45),
    so the chart reads as pre-computed input rather than a count of raw observations
    — the one thing this spec is about → draw the raw session array from the shares
    with noise (e.g. a Poisson or multinomial draw around session_share) so the tallies
    land on unrounded values. Likely cause: session_share is used verbatim as the
    fill(device, n) repeat count.'
  - 'LM-01, LM-02 (code): the count labels are drawn with a hand-rolled text! loop
    although barplot! exposes bar_labels / label_offset / label_size / label_color
    natively for exactly this, and no other Makie-specific API appears → use bar_labels
    for the count tier and keep the manual text! only for the percentage tier. Likely
    cause: the labelling loop was written without checking barplot!''s keyword set.'
  - 'Suggestion: a restrained typographic emphasis on the leading category''s existing
    count label would give the chart a focal point beyond bar height, without touching
    bar color, width or position.'
  - 'Suggestion: raising the title from 20 pt toward the style-guide default would
    let the mandated title occupy more of the canvas width and better anchor the type
    hierarchy.'
  - 'Suggestion: the band of empty space above the tallest bar is wider than the two
    label tiers need; a slightly tighter ylims! factor would balance the vertical
    whitespace.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1 across both the figure and the axis surface — not pure white, not dark. Canvas is 3200x1800.
      Chrome: Bold dark-ink title "Device Type Sessions · count-basic · julia · makie · anyplot.ai" centred at the top, fully inside the canvas (~36% of the width, no clipping). Dark-ink axis titles "Device Type" (bottom) and "Sessions" (rotated, left), visually balanced in size. Soft-grey tick labels: five category names (Mobile / Desktop / Tablet / Smart TV / Wearable) on x, whole-number 0 / 500 / 1000 on y. Left and bottom spines only, top/right hidden; a very subtle horizontal grid at 500 and 1000, x-grid off.
      Data: Five vertical bars, all the identical brand green #009E73, uniform width with even gaps, each separated from the background by a thin page-colored stroke, rising from a zero baseline. Heights descend: Mobile 1150, Desktop 820, Tablet 340, Smart TV 95, Wearable 45. Above every bar sits a dark-ink count label with a smaller soft-grey percentage above it: (46.9%) 1150, (33.5%) 820, (13.9%) 340, (3.9%) 95, (1.8%) 45. All five count labels are set in the same regular weight. First (and only) series is #009E73 as required.
      Legibility verdict: PASS at full size — title, axis titles, tick labels, count labels and percentage labels are all clearly readable dark-on-light with no light-on-light failure. Note: at the 400 px thumbnail the 11 pt percentage labels are no longer resolvable and the 13 pt tick labels are only barely so.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17 across figure and axis surface — not pure black, not light.
      Chrome: Same title, now in light off-white ink and still fully inside the canvas. Axis titles "Device Type" / "Sessions" in the same light ink; tick labels in a lighter soft grey; spines and the 500/1000 grid lines flipped to their light-on-dark equivalents and still subtle but visible. No dark-on-dark anywhere — every piece of chrome is light ink on the near-black surface.
      Data: Data colors are identical to the light render — all five bars are the same #009E73 brand green, confirming a chrome-only theme flip. Bar strokes flip to the dark page color so the bars stay cleanly separated. Count labels are light ink, percentage labels soft grey, both clearly readable.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; brand green #009E73 remains clearly distinguishable from the #1A1A17 surface, and all text is legible at full size. The same small-type caveat as the light render applies at thumbnail scale.
