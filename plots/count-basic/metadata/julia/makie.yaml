review:
  strengths:
  - 'True count-basic semantics: builds a raw per-session array of device labels and
    manually tallies occurrences into a Dict rather than starting from precomputed
    values, correctly demonstrating what differentiates a count plot from a plain
    bar chart.'
  - 'Correct theme-adaptive chrome throughout: title/axis labels use INK, tick labels
    use INK_SOFT, background flips FAF8F1 (light) / 1A1A17 (dark), top/right spines
    removed, y-axis-only grid at low opacity.'
  - Clean sorted-descending bar layout with precise count labels above each bar, and
    the single-series legend is correctly omitted.
  - Correct canvas size (3200x1800) and brand green (#009E73) as the sole data color,
    identical across both themes.
  weaknesses:
  - 'Design Excellence is generic: no descriptive title prefix, no visual emphasis
    distinguishing the leading category, and no distinctive Makie-specific feature
    usage beyond basic barplot!/text!/Axis keyword theming.'
  - Bars lack the subtle stroke/edge the style guide recommends for definition, and
    no percentage-of-total annotations were added even though the spec explicitly
    calls them out as an optional enhancement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "count-basic · julia · makie · anyplot.ai" in bold dark ink, top-left aligned axis labels "Device Type" / "Sessions" in dark ink, tick labels ("Mobile", "Desktop", "Tablet", "Smart TV", "Wearable", and y-axis 0/500/1000) in a slightly softer grey — all clearly legible. Only left/bottom spines are visible; a very subtle horizontal grid appears at 500 and 1000.
      Data: Five vertical bars in brand green (#009E73), sorted descending by count (1150, 820, 340, 95, 45), each with a small dark count label centered just above the bar.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis labels now rendered in light/off-white ink, tick labels in a lighter soft grey, spines and grid inverted to light-on-dark equivalents — all text is clearly readable, no dark-on-dark failures observed.
      Data: Identical brand green (#009E73) bars in the same order and proportions as the light render, confirming data colors are unchanged across themes; count labels above each bar are legible in light grey against the dark background.
      Legibility verdict: PASS
