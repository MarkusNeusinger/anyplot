review:
  strengths:
  - 'Intentional data storytelling: the modal category (5 Stars) is highlighted in
    Imprint brand green #009E73 while all other bars use the adaptive muted anchor,
    giving the chart an immediate focal point without needing a legend.'
  - 'Idiomatic plotnine grammar-of-graphics usage: count and percentage labels are
    both derived natively via stat="count" and after_stat(), with a deliberate aes(group=1)
    override so prop computes share-of-total instead of plotnine''s default share-of-fill-group.'
  - Fully explicit, theme-adaptive styling (font sizes, colors, grid, spines) that
    is correct and consistent in both light and dark renders; canvas is exactly 3200x1800
    as required.
  - Realistic, neutral survey-ratings dataset with percentages that sum exactly to
    100% and a plausible right-skewed satisfaction distribution.
  weaknesses:
  - Axis lines/spines are kept on the left and bottom rather than fully removed, leaving
    slightly more chrome than a fully polished 'spines removed' treatment would (VQ-05/DE-02).
  - The after_stat/prop technique for percentage labels is powerful but is common
    to any grammar-of-graphics library (ggplot2, letsplot); a more plotnine-distinctive
    touch (e.g. coord_flip for a horizontal count plot) would push Library Mastery
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1, not pure white and not dark.
      Chrome: Title "count-basic · python · plotnine · anyplot.ai" is bold dark text, clearly visible. Y-axis title "Number of Responses" with ticks at 0/100/200/300 and faint horizontal gridlines. X-axis title "Rating" with category tick labels "5 Stars".."1 Star". All chrome text is dark-on-light and fully legible.
      Data: Five vertical bars in descending order (285, 198, 142, 89, 56 responses). The modal "5 Stars" bar is rendered in Imprint brand green #009E73; the remaining four bars use the adaptive "muted" grey (#6B6A63 in light theme). Each bar has a bold black count label and a smaller grey percentage label stacked above it (37%, 26%, 18%, 12%, 7% — sums to 100%).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17, not pure black and not light.
      Chrome: Same title and axis titles, now rendered in light/white text, fully legible against the dark background. Gridlines and axis lines remain subtly visible. No dark-on-dark text found anywhere.
      Data: The modal "5 Stars" bar remains the identical brand green #009E73, confirming data-color parity with the light render. The four "Other" bars render in the adaptive lighter grey-muted tone (#A8A79F) — this is the documented theme-adaptive "muted" semantic anchor, not one of the fixed 8 categorical hues, so the shift between themes is expected and compliant rather than a violation. Count labels are bold white, percentage labels are a softer grey, both clearly legible.
      Legibility verdict: PASS
