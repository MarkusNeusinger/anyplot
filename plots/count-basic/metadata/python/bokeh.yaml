      Data: Eight vertical bars in solid Imprint brand green (#009E73) with a subtle darker outline, sorted descending — Electronics (108), Clothing (94), Home & Garden (83), Books (52), Sports (45), Toys (44), Beauty (42), Groceries (32) — each with a black count label directly above it.
      Legibility verdict: PASS — all title, axis, tick, and annotation text is clearly readable against the light background; no light-on-light issues. Minor cosmetic note: rotated tick labels appear to touch their adjacent axis tick mark.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black and not light.
      Chrome: Same bold title now rendered in light/off-white ink, clearly legible against the dark surface. Axis titles in light ink, tick labels in a lighter soft gray — no dark-on-dark failures anywhere. Gridlines remain subtle. The amber callout text keeps the same amber hue and reads clearly against the dark background.
      Data: The same eight bars in the identical brand green (#009E73) as the light render — confirmed unchanged data color, only chrome flipped. Same values, same sort order, same count labels (now in light ink).
      Legibility verdict: PASS — all text is clearly light-colored against the near-black background; no dark-on-dark issues. Same minor tick/label touch-point noted above persists in this render too.
