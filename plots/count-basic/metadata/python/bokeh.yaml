review:
  strengths:
  - 'Correct Imprint palette compliance: the single series is exactly #009E73 in both
    renders, backgrounds are #FAF8F1 (light) / #1A1A17 (dark), and all chrome (title,
    axis labels, ticks, grid) is theme-correct in both themes.'
  - 'Realistic, internally consistent e-commerce order-count data: 8 categories with
    probabilities summing to 1.0, and the displayed counts (108+94+83+52+45+44+42+32)
    sum exactly to the 500-order sample.'
  - 'No clipping or overlap in either render: explicit font sizing throughout (title
    50pt, axis labels 42pt, tick labels 34pt, count labels 32pt) with min_border_*
    reservations that keep every element fully on-canvas.'
  - 'Idiomatic bokeh usage: ColumnDataSource, categorical x_range, LabelSet for on-bar
    count labels, and nonselection_fill_color for interactive/static parity.'
  weaknesses:
  - 'Title omits the required language segment: reads ''count-basic · bokeh · anyplot.ai''
    instead of the spec format ''count-basic · python · bokeh · anyplot.ai''.'
  - 'Design Excellence sits at well-configured-default level: the full 4-sided outline_line_color
    box is kept instead of the style guide''s default L-shaped (top/right removed)
    frame, and the single-series brand-green bar chart has no extra polish beyond
    theme-adaptive coloring and alpha.'
  - Data storytelling relies only on descending sort plus on-bar labels for hierarchy;
    consider a stronger focal cue (e.g., a callout on the leading category's share
    or a muted/amber highlight comparing top vs. tail) to push past baseline ranking.
