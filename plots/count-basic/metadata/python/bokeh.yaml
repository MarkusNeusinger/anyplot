      Data: 8 vertical bars in brand green (#009E73) with a subtle dark outline stroke and 0.85 fill alpha, sorted descending (Electronics 108 → Groceries 32), each with a bold count label centered above it. The leading bar (Electronics) carries an additional amber italic callout "22% of all orders" above its count label — clearly legible, no overlap with the count label or bar. First (only) series correctly uses #009E73.
