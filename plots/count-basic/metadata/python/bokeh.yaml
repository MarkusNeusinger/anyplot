review:
  strengths:
  - Correct Imprint brand green (#009E73) on every bar, identical between light and
    dark renders, with theme-adaptive chrome (background, title, axis, tick, grid
    colors) fully threaded through both themes
  - Bars sorted by frequency descending per the spec's readability guidance, with
    precise count labels above each bar
  - Storytelling callout ('22% of all orders') on the leading category adds a clear
    focal point beyond a plain bar chart
  - All text sizes explicitly set (title 50pt, axis labels 42pt, ticks 34pt) per the
    bokeh sizing guide, legible in both themes
  - 'Idiomatic bokeh usage: ColumnDataSource-driven vbar with categorical x_range,
    HoverTool with descriptive per-category tooltips (count + share of total) for
    the interactive HTML, and a documented LabelSet workaround for annotating a categorical
    axis'
  - Realistic, neutral e-commerce order-category scenario with plausible proportions
    summing correctly to the 500-order sample
  weaknesses:
  - 'Minor tick/label collision: the major tick marks appear to visually merge with
    the end of each rotated x-axis category label (e.g. a small stray mark right after
    ''Electronics'', ''Clothing'', etc.) in both renders — shorten the tick line or
    add a touch more padding between tick and label.'
  - Axis labels ('Product Category', 'Number of Orders') are descriptive but carry
    no explicit unit annotation — acceptable as-is since 'Number of Orders' is self-describing,
    but a unit suffix would be marginally clearer.
  - The amber (#DDCC77) semantic anchor is documented in the style guide for warning/caution
    roles; using it here for a positive 'leading category' callout is a mild semantic
    stretch — consider INK_SOFT/neutral styling for a purely informational callout,
    reserving amber for actual warning states.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white and not dark — matches the light-theme page surface.
