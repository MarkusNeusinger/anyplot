review:
  strengths:
  - 'Now uses lets-plot''s native automatic counting: geom_bar() with default stat=''count''
    on the raw per-observation dataframe, with layer_labels() reading the computed
    ..count.. and ..sumpct.. stat variables directly -- this resolves Attempt 1''s
    core spec-compliance gap and is genuinely idiomatic grammar-of-graphics usage.'
  - The full four-sided panel border from Attempt 1 is gone in both renders -- axis
    treatment now reads as a clean L-shape (bottom + left) consistent with the style
    guide's default spine treatment.
  - Added a dashed reference line at the group average with an 'avg' label, giving
    the chart a genuine focal comparison point (visual hierarchy) beyond raw bar heights
    -- directly addresses the prior 'no visual hierarchy' weakness.
  - 'Both renders remain fully theme-correct: warm #FAF8F1/#1A1A17 backgrounds, INK/INK_SOFT
    tokens threaded through title/axes/ticks/caption, brand green #009E73 pixel-identical
    across themes.'
  - Realistic, neutral customer-satisfaction data (n=210, correct arithmetic), exact
    3200x1800 canvas, clean KISS code structure with no functions/classes.
  weaknesses:
  - Still a single flat brand-green fill with no secondary visual emphasis (e.g. highlighting
    the modal 'Good' bar, or using a second Imprint hue for above/below-average bars)
    -- the design is polished but stops short of a distinctly art-directed, publication-level
    look.
  - The 'avg' annotation (geom_text size=3.0) is noticeably smaller than the rest
    of the chrome; it reads fine at full 3200x1800 resolution but is worth double-checking
    at ~400px mobile width where it could nearly disappear.
  - Count+percentage bar labels and the avg annotation share the same plain typographic
    treatment as the rest of the theme -- no weight/size contrast is used to make
    the labels feel like a deliberate design layer rather than default text.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Bold dark title "count-basic · letsplot · anyplot.ai" top-left, clearly readable. X-axis title "Customer Satisfaction Rating" and Y-axis title "Number of Responses" in dark ink, both readable. Tick labels (Excellent/Good/Average/Poor/Very Poor, and 0-90 y-axis ticks) in a softer gray, readable. Only bottom and left axis lines are visible -- no full rectangular panel border (fixed from Attempt 1). Subtle horizontal gridlines on the y-axis only, no vertical gridlines. A dashed horizontal reference line marks the per-category average, labeled "avg" in soft gray just right of the line. Caption "n = 210 survey respondents" bottom-right in soft gray, fully visible, not clipped.
      Data: Five vertical bars in brand green (#009E73) with a thin cream-colored edge stroke (matches page background), heights varying by category (Excellent=45, Good=78, Average=52, Poor=23, Very Poor=12). Each bar has a two-line count+percentage label centered near the top of the bar (e.g. "78" / "37%") in white, legible against the green fill.
      Legibility verdict: PASS -- all text (title, axis titles, ticks, avg label, caption, in-bar labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (near-white for primary text, light gray for secondary/tick text) -- fully legible against the dark background. Axis lines and dashed avg-reference line render in a light gray consistent with the dark theme's soft-ink token. Caption bottom-right in light gray, fully visible, not clipped.
      Data: Identical brand-green (#009E73) bars, same heights, same edge-stroke treatment (now matching the dark page background instead of light), same white in-bar count+percentage labels. Data colors are pixel-identical to the light render -- only chrome (background, text, axis lines, grid, avg line) flipped.
      Legibility verdict: PASS -- no dark-on-dark failures; all title/axis/tick/label/caption/avg text reads clearly against the near-black surface.
