review:
  strengths:
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    all text uses INK/INK_SOFT tokens, brand green #009E73 identical across themes.'
  - Data labels combine count and share ('78\n37%') directly on each bar, giving precise
    readable values without needing a y-axis grid crutch.
  - Bars are kept in Likert order (Excellent -> Very Poor) rather than sorted by frequency,
    with a code comment explaining the reasoning -- a deliberate, spec-aligned data-presentation
    choice ('sorted by frequency or kept in original order based on context').
  - Realistic, neutral customer-satisfaction survey data (n=210) with a plausible
    right-skewed distribution and correct arithmetic (45+78+52+23+12=210, percentages
    match).
  - Clean KISS structure, explicit font sizes throughout, canvas lands exactly on
    the 3200x1800 target (ggsize(800,450) x scale=4).
  weaknesses:
  - 'Does not use lets-plot''s native automatic counting: geom_bar()''s default stat
    is ''count'', which tallies raw per-observation data directly -- this is the exact
    distinguishing feature the count-basic spec calls out (''unlike a basic bar chart
    that requires pre-computed values, a count plot automatically counts occurrences
    from raw data''). Instead the code pre-aggregates with pandas value_counts()/reindex()
    into a summary dataframe and plots with geom_bar(stat=''identity''), which is
    generic bar-chart code that any library could produce -- it forgoes lets-plot''s
    grammar-of-graphics strength for this specific plot type. Repair: map x=''Response''
    on the raw per-row dataframe with geom_bar() (default stat=''count''), and derive
    the count+percentage label via geom_text(stat=''count'', aes(label=after_stat(...)))
    or a small after_stat expression, instead of manually tallying with value_counts().'
  - 'Full four-sided rectangular panel border is visible in both renders (all four
    spines/box outline), not the style guide''s default L-shaped (left+bottom only)
    treatment -- theme(axis_line=element_text(color=INK_SOFT)) is rendering as a full
    panel border in lets-plot rather than just bottom/left axis lines. Repair: remove
    the panel border explicitly (e.g. panel_border=element_blank()) and re-add only
    bottom/left axis lines if the library exposes axis_line_x/axis_line_y separately.'
  - Single flat brand-green fill with no additional visual hierarchy (e.g. rank-graded
    emphasis, a reference/average line, or highlighting the modal category) -- data
    storytelling relies entirely on the printed labels rather than the chart's visual
    design.
  - Overall aesthetic reads as a well-configured default bar chart rather than a distinctly
    polished, publication-level design -- single hue, no custom typography flourishes
    beyond the theme tokens.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), confirmed by pixel sampling -- not pure white.
      Chrome: Bold dark title "count-basic · letsplot · anyplot.ai" top-left, clearly readable. X-axis title "Customer Satisfaction Rating" and Y-axis title "Number of Responses" in dark ink, both readable. Tick labels (Excellent/Good/Average/Poor/Very Poor, and 0-90 y-axis ticks) in a softer gray, readable. A full rectangular panel border (all four sides, ~#474747) surrounds the plot area. Subtle horizontal gridlines on the y-axis only. Caption "n = 210 survey respondents" bottom-right in soft gray, fully visible with margin (not clipped).
      Data: Five vertical bars in brand green (#009E73) with a thin cream-colored edge stroke (matches page background, creating visual separation), varying height by category (Excellent=45, Good=78, Average=52, Poor=23, Very Poor=12). Each bar has a two-line count+percentage label centered above it (e.g. "78" / "37%") in dark ink.
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), confirmed by pixel sampling -- not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (near-white for primary text, light gray for secondary/tick text) -- fully legible against the dark background. Panel border and gridlines render in a light gray consistent with the dark theme's soft-ink token. Caption "n = 210 survey respondents" bottom-right in light gray, fully visible, not clipped.
      Data: Identical brand-green (#009E73) bars, same heights, same edge-stroke treatment (now matching the dark page background instead of light), same count+percentage labels in light ink. Data colors are pixel-identical to the light render -- only the chrome (background, text, borders, grid) flipped.
      Legibility verdict: PASS -- no dark-on-dark failures; all title/axis/tick/label/caption text reads clearly against the near-black surface.
