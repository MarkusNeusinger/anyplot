review:
  strengths:
  - Modal-bar visual emphasis (full brand green vs. soft tint on the rest) creates
    an immediate focal point without needing a legend or a second Imprint hue
  - Dual geom_text layers (count + share %) give the in-bar labels genuine typographic
    hierarchy (bold/larger vs. lighter/smaller)
  - Dashed 'avg' reference line adds useful comparative context beyond raw bar heights
  - Fully deterministic data construction (fixed dict, no RNG) with a realistic, neutral
    customer-satisfaction survey context
  - Theme-adaptive chrome verified correct in both renders — PAGE_BG/INK/INK_SOFT
    tokens threaded through title, axes, ticks, grid, and caption
  - Canonical 800×450 @ scale=4 canvas, passes the canvas dimension gate
  weaknesses:
  - 'Title omits the ''python'' language segment — reads ''count-basic · letsplot
    · anyplot.ai'' instead of the required ''count-basic · python · letsplot · anyplot.ai''
    (compare sibling implementations plots/count-basic/implementations/python/{bokeh,plotnine,pygal}.py,
    which all include ''· python ·''). Fix: update the labs(title=...) string.'
  - 'BRAND_SOFT = ''#66C4A9'' is a custom hex not present in the Imprint palette or
    its 3 semantic anchors (amber/neutral/muted), used to de-emphasize non-modal bars.
    Style guide: ''Never introduce custom hex values when the Imprint palette already
    covers the need.'' Fix: use the `muted` semantic anchor (#6B6A63 light / #A8A79F
    dark) for non-modal bars, or apply true alpha against PAGE_BG instead of a fixed
    tint hex.'
  - Percentage labels are quite small (geom_text size=3.0mm, ~8.5pt) relative to the
    count labels (size=4.3mm) — legible but close to the lower bound for mobile-width
    readability; consider nudging up slightly.
  - 'LM-02: the stat=''count'' + ''..sumpct..'' computed aesthetic is a standard grammar-of-graphics
    feature shared with plotnine/ggplot2, not something that distinctly showcases
    lets-plot''s own strengths (its native interactivity/tooltips weren''t specially
    customized beyond the default HTML export).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "count-basic · letsplot · anyplot.ai" top-left; axis titles "Customer Satisfaction Rating" (x) and "Number of Responses" (y) in dark ink; grey tick labels; subtle horizontal y-axis-only gridlines; dashed grey "avg" reference line with inline label near y≈42; small grey caption "n = 210 survey respondents" bottom-right. All chrome text is clearly readable against the light background.
      Data: Five vertical bars for Excellent/Good/Average/Poor/Very Poor. Four bars use a soft green tint (#66C4A9); the modal "Good" bar (78, tallest) uses full-strength Imprint brand green (#009E73). Each bar carries a bold white count label and a smaller, semi-transparent white percentage label stacked beneath it, both fully inside the bar with no overlap.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now rendered in light/white bold text; axis titles in light ink; tick labels and caption in light grey; dashed "avg" line and label in light grey, clearly visible against the dark surface. All chrome elements are legible — no dark-on-dark failures observed.
      Data: Identical bar colors to the light render — soft green tint (#66C4A9) for non-modal bars, full brand green (#009E73) for the modal "Good" bar — confirming the Imprint data colors are held constant across themes and only chrome flipped. Count and percentage labels remain white and legible on both the soft-tint and full-brand bars.
      Legibility verdict: PASS.
