review:
  strengths:
  - 'Perfect Imprint palette compliance in both renders: bars use brand green #009E73
    (position 1), the cumulative-share line uses lavender #C475FD (position 2, canonical
    order), and plot backgrounds match #FAF8F1 (light) / #1A1A17 (dark) exactly with
    fully theme-adaptive chrome (title, axis labels, ticks, grid, legend box all flip
    correctly, verified via edge crops).'
  - 'Genuine data storytelling: the Pareto overlay (cumulative-share line + 80% reference
    line) turns a bare count plot into an insight — ''the top 3 languages already
    cover ~66% of responses, 5 cross the 80% Pareto threshold'' — directly leveraging
    the spec''s ''optional percentage annotations'' note rather than just displaying
    raw counts.'
  - 'Idiomatic, library-mastery-grade seaborn usage: sns.countplot() performs the
    automatic frequency counting that is seaborn''s signature feature for this exact
    spec (matplotlib has no direct equivalent), and the cumulative-share connector
    is drawn with sns.pointplot(order=..., errorbar=None) rather than a generic matplotlib
    .plot() call, keeping the categorical positioning seaborn-native end to end.'
  - 'Clean, reproducible, KISS code: np.random.seed(42), no functions/classes, only
    used imports, count labels placed with a collision-avoidance heuristic relative
    to the cumulative line.'
  - No edge clipping or text overlap in either theme; canvas is exactly 3200x1800
    with balanced margins; text remains legible even at the 400px mobile-width render.
  weaknesses:
  - Cumulative-share pointplot markers (markersize=4) are small for only 8 sparse
    categories — per the data-density heuristic, sparse data (<50 points) should get
    more prominent markers; bump to ~8-10 for better visibility at both desktop and
    mobile scale.
  - 'Minor visual-refinement nit: the twin axis''s right spine is kept at full INK_SOFT
    weight while the primary axis''s matching spine was removed — a slightly dimmed
    (lower-alpha) spine on ax2 would fully match the L-shaped-frame minimal-chrome
    convention used elsewhere in the chart.'
