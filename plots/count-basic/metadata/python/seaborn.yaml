  strengths:
  - Creative Pareto overlay (cumulative-share line on a twin axis with an 80% reference
    line) adds genuine data storytelling beyond a plain count plot, directly answering
    the spec's suggestion of optional percentage annotations
  - Bars sorted by descending frequency with precise count labels above each bar,
    per the spec's notes
  - Theme-adaptive chrome threaded consistently through sns.set_theme rc params, twin-axis
    spines, and the annotation colors — both renders pass legibility and Imprint palette
    checks with identical data colors
  - Clean, reproducible, KISS-structured code (seed=42, no functions/classes, correct
    canvas sizing without bbox_inches='tight')
