    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Dark ink title "count-basic · seaborn · anyplot.ai" centered at top; "Programming Language" x-axis label and "Response Count" / "Cumulative Share" y-axis labels in dark ink; tick labels in soft ink; subtle horizontal gridlines. All chrome text is clearly readable against the light background.
      Data: 8 vertical bars in brand green (#009E73) for Python, JavaScript, Java, Go, C++, Rust, TypeScript, Ruby (140/101/86/43/42/33/31/24), sorted descending, each with a count label above it. A lavender (#C475FD) line with circular markers traces the cumulative share on a secondary right-hand axis (0-100%), crossing a dashed 80% reference line between Java and Go. Legend box (top-right area) labels "Responses" (green swatch) and "Cumulative Share" (lavender line+marker).
