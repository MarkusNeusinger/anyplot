review:
  strengths:
  - Rank-graded opacity on the single Imprint brand hue (#009E73) creates clear visual
    hierarchy while staying fully single-series compliant — no second hue introduced.
  - Dashed average-reference line with masked (bbox-punched) crossing labels adds
    genuine data-storytelling context without clutter.
  - Leading category is deliberately emphasized (larger bold value label + path-effect
    stroke) — an immediate, unambiguous focal point.
  - 'Minimalist y-axis: ticks/labels removed and replaced with direct count+percentage
    labels on each bar — elegant information design rather than a redundant axis.'
  - Theme-adaptive chrome is correctly implemented in both renders; the brand green
    and its opacity ramp are pixel-identical between light and dark, only chrome (background,
    text, grid) flips.
  - 'Idiomatic, modern matplotlib usage: Axes-based API throughout, `ax.bar_label`
    for direct labeling, `path_effects.withStroke` for the winner''s stroke — clean
    KISS structure with no functions/classes.'
  weaknesses:
  - No explicit y-axis title (e.g. 'Number of Responses'). The axis was intentionally
    stripped of ticks/labels in favor of direct bar labels, which mostly compensates,
    but a reader skimming only the axis (before reading bar labels) has no explicit
    cue that the values are counts — consider a small axis title even with ticks hidden.
  - The 'avg 40' reference annotation is the smallest text element on the canvas (9pt
    at dpi 400). It reads fine at full 3200px size but is the first candidate to become
    illegible if the plot is scaled down further for a mobile thumbnail — consider
    bumping to 10pt to match the other secondary labels.
