    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis label, and category tick labels now rendered in light ink (white/light-grey), clearly legible against the dark surface. Gridlines and the dashed "avg 40" line are rendered in a lighter muted grey, still subtle but visible.
