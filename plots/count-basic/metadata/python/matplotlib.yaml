review:
  strengths:
  - 'Every bar is the same Imprint brand green #009E73 at full opacity with page-colored
    (1.5 px) bar edges for separation — the basic variant''s single categorical variable
    reads as exactly one series, with no second hue and no per-bar emphasis.'
  - ax.bar_label with a custom labels= list and linespacing=1.3 puts the count and
    its share on two lines above each bar — a matplotlib-native direct-labeling idiom
    that makes every value readable without hunting along an axis.
  - 'Theme-adaptive chrome is complete in both renders: backgrounds #FAF8F1 / #1A1A17,
    title and both axis titles in INK, category tick labels in INK_SOFT, grid derived
    from INK at alpha 0.08 — and the brand green is identical between light and dark.'
  - Categories are sorted by descending frequency at one uniform bar width (0.62)
    with even gaps, so the distribution (69 / 47 / 39 / 33 / 12) reads left-to-right
    at a glance.
  - Idiomatic Axes-based matplotlib throughout (ax.bar, ax.bar_label, ax.yaxis.grid,
    ax.spines, ax.tick_params) with the top/right/left spines removed and only a soft
    bottom spine kept — flat KISS script, seeded, no functions or classes.
  weaknesses:
  - 'SC-02, VQ-06 (both): the count axis carries no whole-number ticks — the five
    gridlines are unlabeled and sit at 0, 22.4, 44.9, 67.3 and 89.7, so a reader cannot
    read a count off the axis even though it is titled ''Number of Responses'' → label
    the y ticks at whole-number counts (e.g. 0 / 20 / 40 / 60) in INK_SOFT at 8 pt.
    Likely cause: ax.set_yticks(np.linspace(0, counts.max() * 1.3, 5)) followed by
    ax.set_yticklabels([]).'
  - 'Suggestion: the category tick labels at 8 pt are the smallest text on the canvas;
    9 pt would hold up better on a ~400 px mobile thumbnail.'
  - 'Suggestion: the two near-identical comment blocks explaining the minimalist y-axis
    (above ax.bar_label and above ax.set_xlabel) could be collapsed into one.'
