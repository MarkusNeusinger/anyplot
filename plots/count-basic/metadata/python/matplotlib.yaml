      Data: Five vertical bars in a single-hue green ramp (full-opacity #009E73 for the leading "Agree" bar at 69/34%, decreasing opacity for lower-ranked bars). Each bar is direct-labeled above with count and percentage; the leading label is bold/larger with a light-colored stroke effect that keeps it crisp against the gridline it crosses.
