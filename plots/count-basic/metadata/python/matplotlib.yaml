review:
  strengths:
  - Rank-graded single-hue opacity fade draws the eye to the leading category while
    staying fully Imprint-palette-compliant (no extra hues for single-series data)
  - Direct value + percentage labels with a background-masked avg reference line are
    a precise, elegant substitute for a y-axis
  - Theme chrome (backgrounds, ink tokens, avg line, masked label boxes) is fully
    correct and identical in structure across both renders
  - Clean, reproducible, KISS-structured code with sensible use of bar_label's returned
    Text artists
  weaknesses:
  - Y-axis is fully removed - a defensible minimalist choice given the direct labels,
    but a very light gridline or tick could give returning readers an extra reference
    point without adding clutter
  - Category tick labels at 9pt are on the smaller side; bumping to 10-11pt would
    improve mobile-scale legibility slightly
  - LM-02 usage is solid but not maximally distinctive to matplotlib - could lean
    further into features harder to replicate elsewhere (e.g. a custom Patch-based
    leader annotation or Bbox-based dynamic label placement)
