review:
  strengths:
  - Idiomatic Altair declarative transform pipeline (transform_aggregate -> transform_joinaggregate
    -> transform_calculate) computes counts and percentages inside the chart spec
    instead of pre-aggregating in pandas
  - Bars sorted descending by frequency with combined count+percentage data labels,
    directly matching the spec's 'sort by frequency' and 'optional percentage annotations'
    notes
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, all text legible, brand green #009E73 identical across themes, L-shaped
    spines via view stroke removal'
  - Real, functional hover selection (alt.selection_point) drives bar opacity in the
    interactive HTML export rather than faking interactivity
  - Canvas padding logic correctly lands the PNG at the exact 3200x1800 target without
    cropping, per the altair library rules
  weaknesses:
  - 'Design Excellence still reads close to a well-configured default: a single flat
    green bar chart with rounded top corners; add more deliberate visual hierarchy
    (e.g. a subtle highlight/stroke on the leading category) to reach publication-level
    polish'
  - Category tick labels are rotated 90 degrees for all five short labels ('Good',
    'Poor', 'Average', 'Excellent', 'Very Poor') even though none are especially long;
    widen the inner view slightly or test horizontal labels so the x-axis reads at
    a glance instead of requiring vertical rotation
  - The bold count+percentage labels above each bar are visually heavier than the
    rest of the minimal chrome; consider a lighter font weight or slightly smaller
    size so the bars remain the strongest visual signal
  - No distinct visual emphasis on the leading category ('Good', 33%) despite it being
    the natural focal point of the story; a slight highlight (border stroke, distinct
    opacity, or annotation) would strengthen data storytelling (DE-03)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like cream), not pure white.
      Chrome: Bold dark title "count-basic · python · altair · anyplot.ai" and a gray subtitle
        "n = 200 survey responses" centered at top. Y-axis title "Number of Responses" (rotated,
        dark bold text) on the left, X-axis title "Survey Response" (dark bold text) at the bottom.
        Tick labels for the y-axis (0-70) are small gray numerals; x-axis category tick labels
        ("Good", "Excellent", "Average", "Poor", "Very Poor") are rotated 90 degrees in gray text.
        A subtle horizontal gridline runs behind each y tick.
      Data: Five vertical bars in a single brand-green hue (#009E73) with rounded top corners,
        sorted descending by height: Good=66 (33%), Excellent=56 (28%), Average=36 (18%),
        Poor=27 (14%), Very Poor=15 (8%). Bold black count+percentage labels sit just above each bar.
      Legibility verdict: PASS - all title, subtitle, axis titles, tick labels, and data labels are
        clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Same title/subtitle layout, now rendered in light/off-white text. Axis titles in bold
        off-white text, tick labels (including the rotated category labels) in light gray text.
        Gridlines are faint light lines against the dark background.
      Data: Same five bars, identical #009E73 green as the light render, same heights and order.
        Data labels above each bar are now bold white text.
      Legibility verdict: PASS - all text is light-colored against the dark background; no
        dark-on-dark failures observed. Data colors are confirmed identical to the light render,
        only chrome (background + text) flipped as expected.
