      Background: Warm off-white, matches #FAF8F1 target -- not pure white, not dark.
      Chrome: Bold dark title "count-basic · python · altair · anyplot.ai" with gray subtitle "n = 200 survey responses" centered at top. X-axis title "Survey Response" and Y-axis title "Number of Responses" both bold and dark. Category tick labels are horizontal (not rotated), all clearly legible. Subtle horizontal gridlines at 12% opacity. All chrome text is dark-on-light and clearly readable.
      Data: Five vertical bars in brand green #009E73, rounded top corners, ordered left-to-right: Average=36 (18%), Excellent=56 (28%), Good=66 (33%), Poor=27 (14%), Very Poor=15 (8%). The "Good" bar (the numeric maximum) has a distinct black stroke outline and full opacity, standing out from the other four bars which sit at ~0.8 opacity with no stroke. Count+percentage labels sit above each bar; the "Good" label is bold/larger, the other four are smaller/lighter gray. First (and only) series color matches Imprint palette position 1.
      Legibility verdict: PASS -- no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target -- not pure black, not light.
      Chrome: Same layout, now rendered with light/off-white text throughout (title, subtitle, axis titles, tick labels). Gridlines are faint light lines against the dark surface, same 12% opacity treatment.
      Data: Bars are the identical #009E73 green, identical heights, identical (alphabetical, not frequency-sorted) order -- only chrome flipped, confirming data-color consistency between themes. The "Good" bar now has a white/light stroke outline instead of black, correctly adapted for dark-mode contrast, still at full opacity with the bold label; the other four bars remain at ~0.8 opacity with muted labels.
      Legibility verdict: PASS -- no dark-on-dark failures; all text is clearly legible against the near-black background.

    Both renders pass the theme-readability check. Data colors (brand green #009E73) are identical between light and dark; only background, text, and stroke-highlight color adapt to theme, as required.
