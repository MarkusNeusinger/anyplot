review:
  strengths:
  - 'Genuine Pareto-style enhancement: secondary-axis cumulative % line adds real
    analytical value beyond a basic count plot, satisfying the spec''s optional percentage-annotation
    note without cluttering the primary bars'
  - 'Theme-adaptive chrome and Imprint palette verified pixel-exact: light bg (250,248,241)=#FAF8F1
    and dark bg (26,26,23)=#1A1A17 match the style guide exactly; brand green #009E73
    used for the sole categorical series; cumulative line correctly uses the theme-adaptive
    neutral/ink token per the semantic-anchor rule for reference/trend lines'
  - 'Correctly implements the spec''s core requirement: bars sorted by frequency descending
    with count labels above each bar'
  - Canvas is pixel-exact 3200x1800 landscape via write_image(width=800,height=450,scale=4)
    with no canvas-gate failure
  - 'Clean, reproducible code: np.random.seed(42), no unused imports, real hover text
    (hovertext/hoverinfo) rather than fake interactivity, dual output (PNG+HTML)'
  weaknesses:
  - 'Title occupies only ~34% of canvas width (1102/3200 px measured), well below
    the ~50-70% target for this canvas. The formula `title_fontsize = round(16 * min(1.0,
    67/len(title_text)))` only scales the font DOWN for titles longer than the 67-char
    baseline; this title is 42 chars (shorter), so it gets capped at the base 16pt
    instead of scaling up, leaving it visually small against the wide landscape canvas.
    Fix: scale up proportionally for shorter titles, e.g. `round(16 * (67/len(title_text)))`
    without the 1.0 cap (clamped to a sane max like 22-24pt).'
  - 'Dual y-axis was built via a manual `yaxis2` overlay dict rather than plotly''s
    more idiomatic `make_subplots(specs=[[{''secondary_y'': True}]])` pattern for
    combo charts — functionally correct and visually fine, but not the textbook-recommended
    API for secondary axes.'
  - No annotation or color emphasis calls out the ~80% cumulative threshold explicitly
    (e.g. a reference line at 80%), which would have strengthened the Pareto storytelling
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at RGB(250,248,241) = #FAF8F1 exactly, matching the style guide. Not pure white.
      Chrome: Title "count-basic · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Product Category" and left Y-axis title "Count (n)" in dark ink; right Y-axis title "Cumulative Share (%)" in dark ink, rotated, fully within canvas bounds (no clipping). Tick labels in softer grey-ink, all readable. Subtle horizontal gridlines on the left axis only (light grey, low alpha) — no visual clutter.
      Data: 7 green (#009E73) bars sorted descending (Electronics 110 → Beauty 2) with black count labels positioned above each bar, no overlap with the line/markers. A black dotted cumulative-% line with circle markers (white-outlined) traces the secondary axis from ~44% to ~100%, clearly distinguishable from the bars. Legend box (cream fill, dark border) bottom-right, does not overlap any bar or data label.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB(26,26,23) = #1A1A17 exactly, matching the style guide. Not pure black.
      Chrome: Title, axis titles, and tick labels all render in light ink (white/light-grey), clearly legible against the dark background — no dark-on-dark failures observed. Gridlines are subtle light grey at low alpha, visible but unobtrusive. Legend box uses the dark elevated-bg fill with light border and light-grey text, fully legible.
      Data: Bars remain the identical #009E73 green (verified colors unchanged from the light render — only chrome flipped). The cumulative line is now white/light-dotted with light markers (black-outlined) for contrast against the dark background, tracing the same cumulative shape as the light render.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures.
