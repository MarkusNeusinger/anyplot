review:
  strengths:
  - Excellent semantic sentiment color-coding (green = positive, matte red = negative,
    muted gray = neutral) tied to real category meaning — a textbook application of
    the Imprint palette's sentiment/polarity semantic exception.
  - 'Distinctive pygal per-bar metadata usage: each bar carries its own {value, color,
    tooltip} dict instead of a flat single-color series — genuine library-specific
    mastery beyond basic chart.add(list) usage.'
  - value_colors pinned to theme-adaptive INK (not pygal's luminance-based default)
    keeps the printed counts legible above every bar in both themes.
  - Clean, deterministic, KISS code with a well-documented workaround for the pygal.py
    / pygal-package filename collision.
  - 'Both renders are fully readable, backgrounds match #FAF8F1/#1A1A17 exactly, and
    nothing is clipped at the canvas edges.'
  weaknesses:
  - 'Title omits the mandated "python" language segment: currently "count-basic ·
    pygal · anyplot.ai", should be "count-basic · python · pygal · anyplot.ai" per
    SC-04''s {spec-id} · {language} · {library} · anyplot.ai format.'
  - Y-axis grid lines render dashed in both PNGs, but the style guide requires solid
    thin lines ("Solid thin lines (not dashed), opacity 15-25%") — check whether pygal's
    Style/CSS API exposes a way to force a solid stroke-dasharray on the guide lines.
  - '"Very Dissatisfied"/"Dissatisfied" share the identical red, and "Satisfied"/"Very
    Satisfied" share the identical green — acceptable under the sentiment semantic
    exception, but a small within-group shade/opacity variation would improve at-a-glance
    differentiation between the two intensity levels without abandoning the semantic
    mapping.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white and not dark.
      Chrome: Title "count-basic · pygal · anyplot.ai" in dark ink at top-center; y-axis title "Number of Responses" rotated at left; x-axis title "Satisfaction Level" below the rotated category ticks. Dashed horizontal y-guides at 0/2/4/.../20. All chrome text is dark ink on the light background and clearly legible.
      Data: 5 vertical bars in x-order Very Dissatisfied (1, matte red), Dissatisfied (5, matte red), Neutral (8, muted gray), Satisfied (21, brand green #009E73), Very Satisfied (15, brand green). Rounded bar corners, integer count printed above each bar in dark ink. X-axis category labels are rotated ~15° and do not overlap each other or the bars.
      Legibility verdict: PASS — no light-on-light text anywhere; grid is subtle; data bars are clearly distinguishable from the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black and not light.
      Chrome: Same title/axis titles now rendered in light ink (near-white) against the dark background; dashed y-guides remain subtle and visible. Rotated x-axis category labels are light-colored and fully readable.
      Data: Same 5 bars, same colors as the light render (matte red ×2, muted gray ×1, brand green ×2) — data colors are pixel-identical to the light render, confirming palette positions 1-8 held constant across themes. Count labels above each bar are rendered in light ink and read clearly against the dark background — no dark-on-dark failure anywhere.
      Legibility verdict: PASS — all title/axis/tick/value text is light-on-dark and fully legible; no chrome element reverted to a dark tone against the dark surface.
