review:
  strengths:
  - 'Full spec compliance: raw categorical responses are counted with collections.Counter
    (not pre-aggregated), count labels are printed above each bar for precise reading,
    and categories are kept in a sensible contextual (Likert) order rather than an
    arbitrary one.'
  - 'Advanced, idiomatic pygal usage: per-point metadata dicts (value/color/tooltip)
    give each bar an individual sentiment color and a rich hover tooltip with percentage
    share, rounded_bars for polish, and guide_stroke_dasharray=''none'' to satisfy
    the style guide''s solid-not-dashed grid rule.'
  - 'Clean, deterministic, minimal code: hardcoded realistic survey data (sums to
    50 responses, plausible skew), no unused imports, correct output API (render_to_png
    + render() to .html per the pygal library rules).'
  - 'Canvas gate passes exactly: both plot-light.png and plot-dark.png measure 3200x1800.'
  - Thoughtful semantic-exception color mapping (positive to green, negative to red,
    neutral to muted) matching the style guide's documented sentiment/polarity exception
    for Likert-style categorical data.
  weaknesses:
  - 'VQ-07 hard-rule violation, pixel-verified: bar fill colors are NOT identical
    between the light and dark renders. Direct pixel sampling: the ''Very Satisfied''
    bar (assigned the literal Imprint hex #009E73) is RGB(50,176,140) in plot-light.png
    but RGB(5,129,95) in plot-dark.png -- a genuinely different composited color,
    not just a different-looking one due to surrounding contrast. The ''Neutral''
    bar shows the same shift (150,148,141) -> (126,125,118). Root cause #1: custom_style
    never sets `opacity` explicitly, so pygal''s default series fill-opacity composites
    literal-hex bar fills against `plot_background`, and since `plot_background` flips
    between themes (#FAF8F1 vs #1A1A17), every solid-hex bar''s rendered color flips
    too. Fix: add `opacity=''1''` to the Style(...) call so literal-hex fills stop
    blending with the background. Root cause #2 (separate, does not go away with the
    opacity fix): the ''Dissatisfied'' and ''Satisfied'' bars use the `_rgba(hex,
    0.6)` helper, which bakes a partial alpha directly into the fill color itself
    -- rgba(0,158,115,0.6) will always alpha-composite against whatever sits behind
    it (the plot background), so these two bars can never be theme-invariant while
    they carry embedded alpha. Measured: tinted red goes from pale salmon RGB(218,164,160)
    in light to dark maroon RGB(88,35,33) in dark; tinted green goes from pale mint
    RGB(145,210,188) in light to deep forest RGB(15,81,61) in dark -- a much larger
    perceptual shift than the literal-hex bars. Fix: replace the two rgba-tinted anchors
    with concrete, precomputed opaque hex values (e.g. a fixed lighter/darker shade
    baked to a literal hex, not left as embedded-alpha rgba), so the same category
    renders the identical hex in both themes.'
  - 'CQ-01 minor: the `_rgba()` helper function is a small deviation from the flat,
    function-free KISS style typical of this catalog''s simplest implementations;
    it is also the mechanism behind the theme-inconsistency weakness above, so resolving
    that fix (baking to literal opaque hexes) would remove this helper entirely.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches spec, not pure white.
      Chrome: Title "count-basic · python · pygal · anyplot.ai" centered at top, dark ink, ~71% of plot width -- within the expected range for the mandated title. X-axis title "Satisfaction Level" and y-axis title "Number of Responses" both dark ink, clearly readable. Rotated (30 deg) category tick labels (Very Dissatisfied, Dissatisfied, Neutral, Satisfied, Very Satisfied) fully visible with no clipping. Y-axis tick labels (0-20, step 2) legible. Horizontal solid gridlines, subtle and non-dominant. Count value labels (1, 5, 8, 21, 15) printed above each bar in dark ink, all readable.
      Data: 5 vertical bars, one per satisfaction category, sentiment-colored -- dark red (Very Dissatisfied), pale tinted red (Dissatisfied), gray (Neutral), pale tinted green (Satisfied), full brand green (Very Satisfied). Rounded bar corners, thin darker stroke outline.
      Legibility verdict: PASS -- all text reads cleanly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches spec, not pure black.
      Chrome: Same title, axis titles and tick labels now in light ink, all clearly legible with no dark-on-dark failures. Gridlines subtle. Value labels above bars are legible in light ink.
      Data: Same 5 bars in the same category order. However, pixel sampling shows the fill colors are NOT byte-identical to the light render: e.g. the "Very Satisfied" bar samples RGB(50,176,140) in light vs RGB(5,129,95) in dark (should be the fixed #009E73 in both); the tinted "Dissatisfied"/"Satisfied" bars shift even more dramatically (pale salmon/mint in light vs dark maroon/forest-green in dark). This is a measurable violation of the "Imprint palette data colors must be identical between light and dark, only chrome flips" rule -- see Weaknesses for root cause and fix.
      Legibility verdict: PASS for text (no dark-on-dark); FAIL for palette-identity (data colors shift between themes, see VQ-07 note).
