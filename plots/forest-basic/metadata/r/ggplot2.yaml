review:
  strengths:
  - 'Correct forest-plot grammar: point estimates, whiskers with end caps, diamond
    for the pooled effect, and a dashed null-effect reference line at OR = 1'
  - Marker size accurately scaled to inverse-variance study weight, giving a real
    visual weighting cue
  - Clean log10 x-scale with well-chosen breaks (0.25/0.5/1/2/4) and 2-decimal label
    formatting
  - Exact canonical canvas (3200x1800), compliant title format, and theme tokens correctly
    threaded through both light and dark renders with identical data color
  - Realistic, neutral RCT meta-analysis dataset (antihypertensive vs. placebo, stroke
    risk) with plausible sample sizes, odds ratios, and CIs
  weaknesses:
  - The panel.grid.major.x line at OR=0.5 sits close in visual weight to the intentional
    dashed null-effect line at OR=1, which could read as a second reference line rather
    than an incidental grid tick — consider a fainter/thinner major-x grid or removing
    it where it collides with a highlighted break
  - Studies are ordered chronologically rather than by effect size; sorting by effect
    size (an option the spec explicitly allows) would make cross-study heterogeneity
    easier to scan at a glance
  - The weight-driven marker size range (3-9pt covering a narrow 4-14% weight spread)
    makes the smallest and largest markers only modestly different in the render —
    a slightly wider size range would make the weighting cue more visible
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "forest-basic · r · ggplot2 · anyplot.ai" in dark ink, clearly legible. Y-axis study labels (Bergstrom (2010) through Kim (2023), plus "Pooled estimate") in soft dark gray, all legible. X-axis title "Odds ratio (stroke, log scale)" and tick labels ("0.50", "1.00") legible in dark ink/soft ink. Legend "Weight (%)" with size-scaled green square swatches (4-14) fully visible, not clipped by the right canvas edge.
      Data: All CI whiskers, point/square markers, and the pooled diamond are brand green (#009E73). A dashed vertical line marks the null effect at OR=1; a thin solid vertical grid line appears at OR=0.5. The pooled diamond has a dark outline for contrast against its own green fill.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, y-axis study labels, x-axis title/tick labels, and the "Weight (%)" legend all render in light ink / soft light-gray, clearly legible against the dark background. No dark-on-dark text anywhere.
      Data: Identical brand green (#009E73) markers, whiskers, and diamond as the light render — confirmed data colors are unchanged between themes; only chrome (background, text, grid, diamond outline color) flipped to light-on-dark.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures observed.
