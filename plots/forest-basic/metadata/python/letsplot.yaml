review:
  strengths:
  - Studies ordered by effect size, each named at its row, with square markers at
    their effect sizes and full-length CI segments; nothing displaced from its value
  - Pooled diamond sits in its own bottom row with tips at the pooled interval bounds,
    drawn in the theme-adaptive neutral ink so it reads apart from the green study
    markers in both themes
  - scale_size_area makes marker area proportional to study weight, keeping the smallest
    (Taylor 2022) visible and the largest inside its row
  - Only the vertical x-grid is kept and the horizontal grid dropped, a grid density
    chosen for a forest plot where rows are labelled directly
  - Theme tokens threaded through every chrome element; both renders are fully legible
    and the data colors are identical across themes
  weaknesses:
  - 'DQ-03 (code): the pooled centre is weighted by the WEIGHT column while its interval
    comes from inverse-variance weights of the CI-derived SEs, and the ''Weight (%)''
    column sums to 105.8 rather than 100 and disagrees with the CIs (e.g. Brown 2020
    has 9.5 % but 7.8 % by inverse variance) → derive the centre and the interval
    from the same inverse-variance weights (centre 0.313 instead of 0.305, -0.007
    visually) and make the weight column the normalized inverse-variance percentages.
    Likely cause: np.average(studies[EFFECT], weights=weights) and the hand-typed
    WEIGHT list.'
  - 'Suggestion: configure geom_point tooltips (layer_tooltips with study, effect,
    CI and weight) so the HTML view exposes the numbers behind each row.'
  - 'Suggestion: fill missing weights before mapping marker size as well, so a table
    with an empty weight cell still renders (the size aesthetic currently receives
    NaN).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel box.
      Chrome: bold near-black title "forest-basic · python · letsplot · anyplot.ai" top left (~48 % width); study names on the y axis in INK_SOFT gray; x tick labels -0.4…1; x title "Log Odds Ratio of 6-month Smoking Abstinence (95% CI)"; subtle vertical grid only; dashed INK_SOFT null line at 0 through all rows and the pooled row. All readable.
      Data: ten green #009E73 square markers sized by weight with green CI segments, sorted by effect size (Johnson 2019 top at -0.12, Taylor 2022 bottom at 0.65); near-black diamond in the "Pooled estimate" row spanning ~0.20–0.41 centred ~0.305.
      Legibility verdict: PASS

