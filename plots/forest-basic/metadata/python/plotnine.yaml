review:
  strengths:
  - 'Classic forest-plot table layout built from the grammar: study names in a left
    text column, each study''s estimate and interval in a right column, the pooled
    row set in bold, all as geom_text layers with their own data frames'
  - 'Pooled diamond computed from the studies: its tips sit at the inverse-variance
    pooled interval (-0.39 to -0.23) derived from the study intervals, not at typed
    numbers'
  - Axis limits and text-column positions follow the data's span, so the layout adapts
    to another table
  - 'Theme tokens threaded through every text layer and the chrome; both renders read
    cleanly with identical #009E73 data marks'
  - scale_size_identity maps study weight to marker size directly; smallest marker
    (Davis 2020) stays visible and the largest stays inside its row
  weaknesses:
  - 'VQ-01 (both): the right-hand estimate column (e.g. "-0.45 [-0.72, -0.18]") is
    set at 6.5 pt, below the 8 pt tick-label reference, and reads small beside the
    7.5 pt study names → 8 pt (+1.5 pt). Likely cause: geom_text(size=6.5) on the
    studies label layer and the pooled_right layer.'
  - 'VQ-06 (both): the x-axis title "Mean Difference (Treatment - Control)" names
    the measure but no outcome or unit, so a value like -0.31 has no scale a reader
    can interpret → name the outcome and its unit, e.g. "Mean Difference in Systolic
    BP (mmHg, Treatment − Control)". Likely cause: the EFFECT column name used as
    axis title.'
  - 'DQ-02 (both): the scenario is a generic "treatment vs control" trial set with
    no named intervention or outcome → name a concrete, neutral intervention and outcome
    (e.g. a lifestyle program vs usual care on blood pressure) in the data comment
    and the effect column. Likely cause: the data block''s generic labels.'
  - 'Suggestion: the y limits (-1, n + 1.5) leave about one and a half empty rows
    above Smith 2018; a tighter upper limit would balance the panel.'
  - 'Suggestion: the pooled effect uses the supplied weights while its standard error
    uses inverse variances; using inverse-variance weights for both would keep the
    diamond''s centre and width from one model.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241); 3200x1800 canvas.
      Chrome: title "forest-basic · python · plotnine · anyplot.ai" centred, ~45% of width, dark ink; x-axis title "Mean Difference (Treatment - Control)" in dark ink; tick labels -0.8 to 0.4 in soft ink; subtle vertical grid; full panel border in INK_SOFT. Left column of study names (Smith 2018 … Anderson 2023) in dark ink, bold "Pooled" row; right column of "estimate [lower, upper]" labels in soft ink, pooled row bold. All text readable.
      Data: ten #009E73 point estimates with capped horizontal CI whiskers, marker size scaled by weight (Davis 2020 smallest, Anderson 2023 largest); translucent #009E73 diamond in its own bottom row spanning -0.39 to -0.23 centred at -0.31; dashed soft-ink null line at 0 through all rows and the diamond row. Four intervals cross zero.
      Legibility verdict: PASS

