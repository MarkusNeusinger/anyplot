review:
  strengths:
  - Pooled estimate computed by inverse-variance weighting from the study intervals;
    diamond tips land at -4.56 and -3.00 around -3.78
  - Study names rendered as y-axis tick labels via a numeric ticker plus major_label_overrides,
    with axis line and ticks removed so they read as row labels
  - Theme tokens threaded through every chrome element; data colors identical in light
    and dark
  - HoverTool scoped to the marker renderer gives study, effect and weight in the
    HTML view
  - Vectorized CI segments and end caps from one ColumnDataSource, columns named by
    constants
  weaknesses:
  - 'SC-02 (both): marker area is not proportional to study weight (C4): the w=5 marker
    has about 46 % of the w=15 marker''s area instead of 33 % → area proportional
    to weight (drop the +10 px offset, about -10 px on every marker). Likely cause:
    studies["size"] = 14 * np.sqrt(w / w.max()) * 2.2 + 10.'
  - 'Suggestion: a slightly heavier weight on the ''Pooled estimate'' row label would
    echo the diamond''s emphasis.'
