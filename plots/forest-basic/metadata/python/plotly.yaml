review:
  strengths:
  - Pooled estimate computed with statsmodels combine_effects (DerSimonian-Laird random
    effects), with each study's variance taken from its 95% interval width, so the
    diamond falls out of the data and is not placed by hand
  - Native asymmetric error_x whiskers plus square markers with sizemode='area' and
    a computed sizeref, so marker area is proportional to study weight and the largest
    marker stays inside its own row
  - Pooled diamond drawn as a fill='toself' polygon in the theme-adaptive neutral
    anchor (ink), with its tips at the pooled interval bounds, in its own row 1.5
    rows below the studies and set apart from the green study squares
  - 'Clear hierarchy: bold pooled row label, muted ''Favors treatment / Favors control''
    direction cues, dashed null line drawn below the data, vertical-only subtle grid
    and no y-axis line'
  - 'Native interactivity in the HTML: per-study hovertemplate fed by customdata (study,
    effect, CI, weight) and hoveron=''fills'' on the diamond'
  - Theme tokens threaded through every chrome element; both renders are fully legible
    and the data colors are identical across themes
  weaknesses:
  - 'Suggestion: ordering the studies by effect size (the other ordering the Notes
    allow) would make the spread around the pooled diamond easier to read than the
    chronological order.'
  - 'Suggestion: the inner plot sits a little left of the canvas center, with spare
    space on the right and at the bottom; the right and bottom margins could be balanced.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: centered title "forest-basic · python · plotly · anyplot.ai" in dark ink (~35% of the width); 12 study names (Smith et al. 2018 ... Robinson et al. 2024, chronological) as dark-grey y tick labels, plus a bold "Pooled (random effects)" label; x ticks −15, −10, −5, 0; x-axis title "Mean difference in systolic blood pressure (mmHg)"; muted "No effect" label above the dashed null line at 0 and "← Favors treatment" / "Favors control →" cues below the axis. Subtle vertical grid lines. All text readable.
      Data: brand-green #009E73 square markers of weight-proportional area with green horizontal whiskers for the 95% CIs; Anderson 2021 and Brown & Davis 2022 cross the null line; a black (ink-neutral) diamond in its own bottom row centered near −7.9 with tips at about −9.2 and −6.5. Dashed null line runs through every row and the diamond row.
