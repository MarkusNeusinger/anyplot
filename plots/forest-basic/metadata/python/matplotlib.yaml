review:
  strengths:
  - The pooled diamond is computed in code by fixed-effect inverse-variance pooling,
    using standard errors recovered from the 95% CIs (it is not typed in). Its tips
    sit at the pooled interval of about −0.51 to −0.31, centered near −0.41, in its
    own row below every study.
  - Weight-sized markers use scatter area proportional to the Weight column. The smallest
    study (6.9 %) is still clearly visible and the largest (11.5 %) stays inside its
    row.
  - Theme tokens reach every chrome element. Both renders read cleanly, and the Imprint
    green studies and purple diamond are identical between themes.
  - The pooled row label is set in bold INK while the study labels use INK_SOFT, so
    the row stands apart through typography and not only through color.
  - 'Clean adaptable structure: column constants, a replaceable data block, data-driven
    limits and ticks, and a NaN-safe pooling mask.'
  weaknesses:
  - 'SC-01 (both): an unrequested annotation layer, the ''← Favors treatment | Favors
    control →'' direction labels at the bottom of the axes, sits on a -basic forest
    plot whose scope lists only the study rows, the pooled diamond, the null line
    and weight-sized markers → remove both annotations. Likely cause: the `for side,
    label, ha in (...)` loop calling ax.annotate near the end of the file.'
  - 'Suggestion: a slightly larger marker range (MAX_MARKER_AREA) would make the weight
    differences between studies easier to read.'
