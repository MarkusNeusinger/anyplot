review:
  strengths:
  - The pooled estimate is computed from the studies (fixed-effect inverse-variance,
    standard errors recovered from the 95% CIs) and drawn as an exact mpatches.Polygon
    diamond whose tips sit at the pooled interval's bounds (about -0.51 to -0.31 around
    -0.41), matching a hand check of the data
  - Vectorised ax.hlines for all ten confidence intervals plus one ax.scatter with
    weight-proportional areas keeps the plot code compact and every marker at its
    data value
  - 'Typographic hierarchy beyond the baseline: study labels in INK_SOFT, the ''Pooled
    estimate'' row label bold in INK, so the summary row reads as the result'
  - 'Chrome chosen for this chart: left spine removed with zero-length ticks so study
    names float beside their rows, x-only vertical grid that supports reading effect
    values, dashed null line through every row including the diamond'
  - Theme tokens threaded through every element; data colors identical in both renders,
    purple Imprint position 2 sets the diamond apart from the green studies
  - Realistic SMD meta-analysis with heterogeneous interval widths and one study (Williams
    2020) crossing the null line, ordered chronologically as the Notes suggest
  weaknesses:
  - 'Suggestion: the weight range (6.9-11.5 %) gives marker areas of 54-90 pt², so
    size differences are subtle; a sample with a wider weight spread would show the
    weight encoding more clearly.'
  - 'Suggestion: the fixed-effect pooling could be expressed through statsmodels.stats.meta_analysis.combine_effects,
    which also reports the random-effects estimate.'
