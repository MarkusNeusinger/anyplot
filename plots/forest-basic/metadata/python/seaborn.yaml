review:
  strengths:
  - Study names are real y-tick labels at each row, with the pooled row's label in
    bold, instead of hand-placed text
  - sns.scatterplot maps marker area to the weight column through size= with a sizes
    range proportional to weight; the lightest study stays visible and the heaviest
    stays inside its row
  - 'Theme tokens threaded through sns.set_theme rc: both renders readable, data colors
    identical across themes'
  - Exact 3200x1800 canvas via figsize and dpi with subplots_adjust, no bbox_inches
    trimming
  weaknesses:
  - 'SC-01 (both): a per-row ''effect [lower, upper]'' value column is an annotation
    layer the -basic spec does not ask for → remove the column. Likely cause: the
    rows_text loop with ax.text at x=0.80 axes fraction.'
  - 'VQ-05 (both): the x-axis runs to about 1.85 to make room for the value column,
    so ticks 1.0 and 1.5 and their gridlines span an empty stretch about 40 % of the
    axis wide with no data → limit the axis to the data range plus a small pad (about
    −1.0 on the upper limit). Likely cause: ax.set_xlim(..., x_hi + 0.90 * span).'
  - 'VQ-01 (both): the value column text is set at 7 pt, below the style guide''s
    8 pt tick reference → 8 pt (+1 pt), or none once the column is removed. Likely
    cause: fontsize=7 in the ax.text loop.'
  - 'DQ-03 (code): the pooled interval uses sqrt(1/Σ(weight/half_width²)) with percent
    weights and half-widths not divided by 1.96, giving a diamond half-width of 0.064
    where inverse-variance pooling of the drawn intervals gives about 0.105 (−0.04)
    → derive each study''s SE as half_width/1.96 and pool with inverse-variance weights.
    Likely cause: the pooled_se line.'
  - 'Suggestion: a slightly taller pooled diamond would give the summary row a little
    more presence beside the large study markers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'forest-basic · python · seaborn · anyplot.ai' centered in dark ink; study names as y-tick labels on the left in dark ink, 'Pooled Estimate' bold; x-axis 'Mean Difference (Treatment - Control)' with ticks -1.0 to 1.5 in soft ink; subtle dashed vertical grid; grey dashed null line at 0; monospace value column 'effect [lo, hi]' at the right edge in soft ink. All readable.
      Data: ten #009E73 circles sized by weight with green whiskers, ordered by effect (Johnson 0.12 top, Brown -0.52 bottom); purple #954477 diamond with dark outline in its own bottom row at -0.31. The x range extends to ~1.85 with no data beyond 0.60.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, study names and x label in light ink, ticks and value column in light soft ink, grid and null line subtle but visible; no dark-on-dark text.
      Data: identical green markers and whiskers and purple diamond (outline flips to light ink).
      Legibility verdict: PASS
