review:
  strengths:
  - Pooled estimate computed from the studies by inverse-variance weighting, so the
    diamond and its interval follow the data
  - Clean layer composition on one shared x scale with x/x2 interval rules and weight-sized
    markers (alt.Size with a range)
  - Theme tokens threaded through title, axis, tick and grid colors; both renders
    fully legible
  - Native formatted tooltips per layer in the HTML export
  weaknesses:
  - 'SC-02 (both): the pooled diamond is a fixed-size point glyph (about -0.40 to
    -0.35 wide) while its interval runs about -0.48 to -0.28 as a separate rule, so
    the diamond''s tips are not at the pooled bounds (C2) → draw the diamond as a
    polygon whose left and right tips sit at the pooled CI bounds (e.g. mark_area/mark_line
    over the four vertices, or a mark_trail/path), dropping the rule on that row.
    Likely cause: mark_point(shape=''diamond'', size=420) plus the pooled row included
    in ci_lines.'
  - 'VQ-07 (both): the pooled diamond is filled with #AE3030, the semantic red anchor
    reserved for bad/loss/error roles, although the pooled estimate carries no such
    meaning → the second Imprint position #C475FD or the brand green with a distinct
    outline. Likely cause: color=IMPRINT_PALETTE[4] in the diamond mark.'
  - 'CQ-01 (code): a helper function tooltip(label) (lines 85-91) breaks the flat
    no-functions structure → inline the tooltip lists in each layer. Likely cause:
    the def tooltip() block.'
  - 'Suggestion: a slightly heavier CI stroke (about 2 px) would give the rows more
    presence on the large canvas.'
