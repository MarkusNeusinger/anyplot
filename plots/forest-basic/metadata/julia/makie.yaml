review:
  strengths:
  - 'Correct forest-plot semantics: point estimates with rangebars! whiskers, diamond
    (poly!) for the pooled estimate, and a dashed vlines! reference line at the null
    (RR = 1.0)'
  - Marker size correctly encodes study weight (14-40px range scaled by inverse-variance
    weight_pct), giving an at-a-glance sense of study influence
  - Studies sorted by effect size, creating a clean visual gradient and making Trial
    J's CI crossing the null line (heterogeneity/non-significance) easy to spot
  - 'Theme-adaptive chrome is correctly threaded through in both renders: PAGE_BG,
    INK, INK_SOFT flip between light/dark while the Imprint green (#009E73) data color
    stays identical'
  - Custom Legend built with MarkerElement/PolyElement idiomatically distinguishes
    'Individual study' vs 'Pooled effect' without relying on default legend styling
  - Clean KISS code structure, Random.seed!(42) for reproducibility, correct save("plot-$(THEME).png",
    fig; px_per_unit=2) API usage
  weaknesses:
  - 'Design Excellence is at the ''well-configured default'' level for a forest plot:
    the layout (dots + whiskers + diamond + dashed null line) is the textbook standard
    rather than a distinctive, custom-polished take — consider a subtle row-banding
    or a highlighted color/weight for the pooled row to raise visual sophistication'
  - No explicit annotation of the key insight (e.g., a text label near the pooled
    diamond stating the pooled RR and CI, or a 'favors treatment / favors control'
    axis annotation) — this would sharpen data storytelling beyond ordering and size
    alone
  - Study naming ('Trial A (2013)' ... 'Trial L (2024)') is generic/abstract rather
    than grounding the meta-analysis in a concrete real-world domain (e.g., naming
    the actual clinical outcome or intervention being compared) — reduces realism
    of the context
  - yticklabelsize/xticklabelsize = 12 follows the style-guide default but is a risk
    point for the 12 short study-name labels at mobile-scaled (~400px) width — verify
    legibility isn't marginal at that scale
  - Legend and distinctive Makie-only features are used competently (rangebars!, custom
    Legend elements) but nothing pushes into truly distinctive library-mastery territory
    (e.g., no annotate! callouts, no per-row background layout)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "forest-basic · julia · makie · anyplot.ai" in bold dark ink, clearly visible. X-axis label "Risk Ratio (95% CI)" and tick labels (0.4-1.2) in dark/soft-dark ink, fully legible. Y-axis shows 12 study labels ("Trial A (2013)" through "Trial L (2024)") plus "Pooled effect", all dark and readable against the light background. Subtle vertical gridlines at each x-tick, spines on top/right removed, left/bottom spines softened.
      Data: All 12 individual studies rendered as green (#009E73) circles with matching green whiskers (rangebars) of varying width (CI), marker size scaled to study weight. A black diamond marks the pooled effect at the bottom. A dashed soft-dark vertical line marks the null effect at RR=1.0. Legend top-right ("Individual study" green dot, "Pooled effect" black square) is fully legible and does not overlap any data.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all render in light ink (near-white/soft-light), fully legible against the dark background. Study labels on the y-axis remain crisp. Gridlines and spines flip to the same soft, subtle appearance as light mode, just lighter-toned.
      Data: Data colors are identical to the light render — same #009E73 green circles/whiskers, same marker-size weighting. The pooled-effect diamond flips from black to an off-white/cream fill (INK token flips with theme), which is expected and correct since it's chrome, not a data-series color. Legend swatches likewise flip appropriately (green dot unchanged, pooled square now light).
      Legibility verdict: PASS — no dark-on-dark failures; all text and chrome elements are clearly visible, and data colors match the light render exactly.
