    for reproducibility, and uses only imports it actually needs (CairoMakie, Colors,
    Random).
  - 'Idiomatic Makie usage: rangebars! for CI whiskers, scatter! sized by inverse-variance
    weight, a hand-built poly! diamond for the pooled estimate, hspan! for row banding,
    and a custom Legend built from MarkerElement/PolyElement rather than relying on
    plot-call auto-legending.'
