review:
  strengths:
  - Custom SVG marks built via useXScale/useYScale/useDrawingArea correctly implement
    a forest plot (point squares, CI whiskers with caps, pooled diamond) that MUI
    X has no native chart type for
  - Marker size scales with study weight (5-11px half-size proportional to inverse-variance
    weight), giving an honest visual read of each study's influence on the pooled
    estimate
  - Diamond for the pooled effect uses the theme-adaptive ink token (not brand green),
    correctly distinguishing it as chrome/summary rather than a categorical data series,
    and flips white-on-dark / black-on-light correctly
  - Right-aligned per-study annotation text (effect, CI, weight%) plus a dashed zero-reference
    line with 'No difference' label give the plot the full clinical-forest-plot information
    density without a redundant legend
  - Studies are ordered chronologically (2019→2023) per the spec's ordering guidance,
    and both CI-crosses-null and CI-excludes-null cases are represented, showing real
    heterogeneity
  - Title font size is computed from title length via a scaling formula, and both
    renders use identical brand-green (#009E73) data color with correctly flipped
    theme chrome
  weaknesses:
  - At the ~400px mobile width, study names and the right-side CI/weight annotations
    become quite small and harder to read — inherent to a dense 8-study forest plot
    with two text columns, but consider nudging tick/annotation font size up slightly
    or trimming the annotation text to help mobile legibility
  - Design is a clean, correct forest plot but fairly textbook — no additional visual
    emphasis (e.g., muted color or lighter weight for the two CIs that cross the null
    line) to help the reader spot statistical significance patterns at a glance beyond
    reading each whisker
  - The composition draws everything as manual SVG through ChartContainer with an
    empty series array, so MUI X's own series rendering is bypassed entirely — correct
    and necessary for this chart type, but leaves headroom for library-native touches
    (e.g. tooltips wired to the custom marks) that weren't attempted
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Systolic BP Reduction · forest-basic · javascript · muix · anyplot.ai" in dark ink, centered and fully visible; subtitle in soft gray explaining marker sizing and diamond meaning; 8 study-name row labels on the left and "Pooled Effect (Random Effects)" label below a thin divider line; x-axis labeled "Mean Difference in Systolic Blood Pressure (mmHg)" with numeric ticks -12 to 3; dashed vertical reference line at x=0 labeled "No difference"; subtle vertical gridlines. All text is dark-on-light and clearly legible.
      Data: All 8 study markers are brand green (#009E73) squares sized by study weight, with horizontal CI whiskers and end caps in the same green; a black diamond spans the pooled effect's 95% CI at the bottom; right-aligned gray text per row gives "effect [lower, upper] · weight%", bold black text for the pooled row.
      Legibility verdict: PASS — all title/axis/tick/annotation text is readable against the light background; only the two-column dense text becomes small when the whole PNG is shrunk to mobile width, which is an inherent density trade-off rather than a dark/light contrast failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, subtitle, study labels, axis label, ticks and dashed reference line, all re-rendered in light ink (white/light-gray) against the dark surface. Gridlines are faint light lines. No element uses a light-mode color left over from the other theme.
      Data: The 8 study squares and whiskers are unchanged brand green (#009E73), identical hue to the light render. The pooled diamond flips from black fill to a light off-white fill (theme-adaptive ink token), which is correct since it represents chrome/summary rather than a categorical series.
      Legibility verdict: PASS — no dark-on-dark text found; every label, tick, and annotation is light-colored and reads clearly against the near-black background; brand green remains highly visible on the dark surface.
