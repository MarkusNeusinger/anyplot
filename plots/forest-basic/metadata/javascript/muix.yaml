review:
  strengths:
  - 'Composes the forest plot from MUI X v9 building blocks: ChartsContainer with
    a linear y axis whose tickInterval/valueFormatter place each study name at its
    own row, ChartsGrid for vertical gridlines and ChartsReferenceLine for the labelled
    null line at 0'
  - Custom SVG marks are drawn through the useXScale/useYScale/useDrawingArea hooks,
    so every square, whisker and the diamond sit exactly at their data values on the
    library's own scales
  - The pooled diamond is computed in code (DerSimonian-Laird random effects from
    the CIs), sits in its own row below a thin divider, and is drawn in the ink token
    so it reads clearly apart from the green study squares in both themes
  - Square area scales with study weight (side ~ sqrt(weight)) with a 5 px floor,
    so the lightest study (Ivanova, 7.9) stays visible and the heaviest stays inside
    its row
  - Studies are ordered chronologically (2019-2023), and the scenario (antihypertensive
    RCTs, SBP mean difference in mmHg) is realistic with intervals on both sides of
    the null line
  - 'Theme tokens are threaded through every element: title in ink, subtitle/ticks/reference
    label in inkSoft, grid at reduced opacity; both renders are fully legible'
  weaknesses:
  - 'Suggestion: the hard-coded ''Study weight'' column (e.g. Ivanova 7.9 %) does
    not match the random-effects weights the code computes for the pooled diamond;
    deriving the marker weights from the same reWeights would keep the square sizes
    and the diamond consistent.'
  - 'Suggestion: adding MUI X tooltips (e.g. a ChartsTooltip on an invisible scatter
    series at the study positions) would expose the exact effect and CI in the HTML
    view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold dark title "Systolic BP Reduction · forest-basic · javascript · muix · anyplot.ai" centered at top (~43 % of width), grey subtitle "Mean difference in SBP (mmHg) · squares sized by Study weight · diamond = pooled effect"; eight study names (Anderson et al. 2019 … Kowalski et al. 2023) as left y tick labels plus "Pooled Effect (Random Effects)"; x ticks −12 to 3 and x-axis title "Mean difference in SBP (mmHg)"; subtle vertical gridlines; dashed null line at 0 labelled "No difference" at its foot. All text readable, nothing clipped.
      Data: green #009E73 squares sized by weight with capped horizontal CI whiskers in green, one row per study, ordered chronologically; Dubois and Ivanova cross the null line. A thin grey divider separates the studies from a near-black diamond centred near −5.6 with tips at about −7.0 and −4.2.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title in light ink, subtitle, tick labels and "No difference" label in light grey; gridlines subtle but visible; x-axis line light. No dark-on-dark text.
      Data: study squares and whiskers in the identical #009E73 green as the light render; the pooled diamond flips to the light ink token (as chrome-style ink, set apart from the green studies). Brand green clearly visible.
      Legibility verdict: PASS
