review:
  strengths:
  - Composes the forest plot from MUI X's ChartsContainer with a custom ForestMarks
    component that reads useXScale/useYScale/useDrawingArea, so every square, whisker
    and the diamond sits exactly on the shared axis scales
  - 'Pooled diamond computed from the data (DerSimonian-Laird random effects): -5.6
    [-7.1, -4.1], I² = 48%, verified independently; tips sit at the pooled bounds'
  - Diamond drawn in the ink token in its own row below a thin divider, clearly set
    apart from the green study squares in both themes
  - Studies in chronological order, null line at 0 via native ChartsReferenceLine
    with a 'No difference' label running through all rows including the diamond
  - 'Theme tokens threaded through all chrome; Imprint #009E73 for study marks identical
    in both renders; skipAnimation set; y-axis band sized explicitly so no study name
    truncates'
  weaknesses:
  - 'SC-01 (both): a right-hand text column of per-study values (''-4.2 [-7.1, -1.3]
    · w = 11.9'' on every row plus the bold pooled value) and an I² heterogeneity
    statistic in the subtitle are an annotation layer the forest-basic spec neither
    requires nor offers → remove the value column and the I²/k statistics from the
    subtitle, and give the freed right margin back to the plot area. Likely cause:
    the <text x={textX}> elements in ForestMarks, MARGIN.right = 256, and the iSquared
    term in the subtitle string.'
  - 'SC-03 (both): marker size is a min-max rescale of weight (half-size 5 + (w -
    min)/(max - min) * 6), so the 7.9-weight square has about 1/5 the area of the
    16.0-weight square while its weight is about 1/2 → make square area proportional
    to weight (side ∝ sqrt(weight), e.g. half = MAX_MARKER_HALF * sqrt(w / maxWeight)),
    keeping the smallest at least ~5 px half-size. Likely cause: the halfSize formula
    in rows.'
  - 'Suggestion: format the right-column and pooled numbers with the same typographic
    minus (−) the axis ticks use, if any numeric text is kept.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full canvas, 3200x1800.
      Chrome: bold dark title "Systolic BP Reduction · forest-basic · javascript · muix · anyplot.ai" (~43% width), soft-ink subtitle "Mean difference in SBP (mmHg) · squares sized by Study weight · diamond = pooled effect (k = 8, I² = 48%)"; eight study names on the y axis (Anderson et al. 2019 … Kowalski et al. 2023, chronological) plus "Pooled Effect (Random Effects)"; x axis −12…3 with title "Mean difference in SBP (mmHg)"; subtle vertical grid only; thin divider above the pooled row; all text dark and readable.
      Data: green #009E73 squares (sized by weight) with capped horizontal CI whiskers per study; black ink diamond spanning −7.1 to −4.1 centered at −5.6 in its own bottom row; dashed soft-ink null line at 0 labelled "No difference" running through all rows; right-hand text column with "effect [lower, upper] · w = …" per row and bold pooled value. Dubois and Ivanova intervals cross the null line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, study names, tick labels, axis title and right-hand value column all flip to light ink and are clearly readable; grid lines and divider subtle but visible; no dark-on-dark text.
      Data: study squares and whiskers in the identical #009E73 green; pooled diamond flips to the light ink token (chrome-like summary mark), still distinct from the green squares; dashed null line in light soft ink.
      Legibility verdict: PASS
