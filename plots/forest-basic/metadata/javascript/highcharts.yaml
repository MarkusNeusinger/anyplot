review:
  strengths:
  - Pooled estimate is mathematically consistent with the weighted average of individual
    study effects (weighted mean ≈ 0.784 vs. stated 0.78) — rare data-quality accuracy
    for a meta-analysis example
  - Diamond marker with theme-adaptive ink color clearly distinguishes the pooled
    estimate from individual green study markers, matching real forest-plot conventions
  - Marker radius scales correctly with study weight (markerRadius helper, range ~12-30px),
    giving an honest visual read of study precision
  - Studies ordered chronologically (2015→2022) per the spec's notes
  - Null-effect reference line (RR = 1) rendered as a labeled dashed plotLine, aiding
    significance assessment at a glance
  - Theme-adaptive chrome is correct and identical data colors across light/dark renders
  - 'Idiomatic Highcharts patterns: chart.inverted for the horizontal layout, scatter+line
    series combination, Highcharts.color().setOpacity() for whisker alpha blending,
    per-point marker radius overrides'
  weaknesses:
  - 'Design Excellence is functional but not distinctive: no CI end-caps on the whiskers,
    no shaded confidence band, no data labels — add a subtle end-cap tick or numeric
    dataLabels (e.g. "0.78 (0.70–0.87)") to strengthen the visual hierarchy toward
    the meta-analysis conclusion'
  - 'Library Mastery is generic beyond the inverted-chart trick: consider using plotOptions.series.dataLabels
    to print exact RR (95% CI) values per study — a real-world forest-plot convention
    Highcharts supports natively'
  - Whisker lineWidth (2.5) doesn't scale with weight the way marker radius does,
    so high-weight studies (e.g. Fischer 2019) have a large marker but a comparatively
    thin CI line
  - Title occupies only ~30% of canvas width given the short spec-id; not a violation,
    but a slightly larger fontsize (~24-26px) would better balance the title against
    the wide 3200px canvas
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white cream, consistent with #FAF8F1 (not pure white).
      Chrome: Title "forest-basic · javascript · highcharts · anyplot.ai" in bold dark ink, fully readable. Y-axis study labels (Chen 2015, Kumar 2016, Silva 2017, Fischer 2019, Tanaka 2020, Okafor 2021, Rossi 2022, Pooled Estimate) rendered in dark/soft ink, all readable. X-axis title "Risk Ratio" and numeric ticks (0.4-1.2) readable. Subtle vertical gridlines every 0.1 units. Dashed vertical reference line at RR=1 labeled "No effect (RR = 1)" in soft ink, positioned near the top-right without overlapping other elements. Legend at the bottom ("Study estimate" green circle, "Pooled estimate" black diamond) is readable and unobstructed.
      Data: Individual study markers are brand-green (#009E73) circles sized proportionally to study weight (Fischer 2019 largest, Silva 2017 smallest); horizontal whiskers in translucent green show each study's CI. The pooled-estimate row uses a black diamond with a gray CI whisker, visually distinct from the individual studies.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title and axis labels now rendered in light off-white / soft-gray tones, fully readable against the dark surface. Gridlines are subtle light-gray. The dashed reference line and its "No effect (RR = 1)" label are rendered in light gray and remain readable. Legend text is light-colored and legible.
      Data: Data colors are identical to the light render — the green markers and whiskers are unchanged (#009E73). The pooled-estimate diamond flips from black to off-white (theme-adaptive ink token), keeping it clearly visible against the dark background; its CI whisker is a light gray.
      Legibility verdict: PASS — no dark-on-dark failures; brand green remains vivid and identical across both themes.
