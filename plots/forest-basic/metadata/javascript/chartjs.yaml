review:
  strengths:
  - 'Correctly assembles a forest plot from Chart.js mixed-chart primitives: a floating
    horizontal bar for the 95% CI whisker, a scatter dataset for study point estimates,
    a line dataset for the null-effect reference, and a rectRot scatter point for
    the pooled-estimate diamond.'
  - Marker size scales with study weight (pointRadius = 5 + weight*0.75), giving an
    immediate visual read of which studies dominate the pooled estimate — exactly
    the spec's 'marker size proportional to weight' requirement.
  - Logarithmic x-axis with a curated tick callback (0.4/0.5/1/2/4 only) keeps the
    odds-ratio scale readable without clutter from unlabeled intermediate log ticks.
  - Theme tokens are threaded through every chrome element; the only data color is
    Imprint brand green (#009E73), with the muted and ink semantic anchors correctly
    reused for the CI whiskers/null-line and the pooled diamond respectively.
  - 'Realistic, neutral RCT meta-analysis data: heterogeneous significance across
    studies (several CIs cross OR=1, several don''t) and weights that sum to ~100%,
    matching real meta-analysis conventions.'
  - Clean single-file KISS structure, deterministic hardcoded data, animation disabled,
    and correct mount-node contract (canvas created and appended once).
  weaknesses:
  - Legend swatches for 'Null effect' and '95% confidence interval' use Chart.js's
    default box glyph rather than previewing the dashed line / thin bar shape, so
    the legend relies on the text label alone to convey the visual encoding.
  - The 'Pooled Effect' y-axis tick label uses the same font weight/size as the individual
    study labels even though it carries outsized visual importance (large diamond
    marker) — a bold or slightly larger label would reinforce the hierarchy already
    established by the marker size.
  - The x-axis domain (0.4-4) leaves a visibly empty margin to the right of the highest
    CI upper bound (~3.65) — narrowing to e.g. 0.4-3.5 would let the data claim slightly
    more of the plot area.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "forest-basic · javascript · chartjs · anyplot.ai" at top, italic muted subtitle below it explaining marker/diamond meaning, dark ink y-axis study labels (Anderson 2014 through Kowalski 2023, then "Pooled Effect"), dark ink x-axis title "Odds Ratio (log scale)", muted tick labels (0.4, 0.5, 1, 2, 4). All chrome text is clearly legible against the light background.
      Data: Grey horizontal whiskers per study (95% CI), green (#009E73) square point estimates sized by study weight, a grey dashed vertical reference line at OR=1, and a large black rotated-square (diamond) for the pooled estimate with its own grey CI whisker. Legend at bottom lists all four encodings in ink-colored text.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title/subtitle/axis titles/tick labels now rendered in light ink (near-white for primary text, light grey for secondary/tick text) against the dark background. Grid lines are subtle and still visible. No dark-on-dark text detected anywhere (title, axis labels, tick labels, legend all readable).
      Data: Identical green (#009E73) square markers and grey whiskers as the light render — data colors unchanged. The pooled-estimate diamond flips from black (light theme's ink token) to white (dark theme's ink token), correctly using the theme-adaptive "neutral" anchor rather than a fixed data color.
      Legibility verdict: PASS.
