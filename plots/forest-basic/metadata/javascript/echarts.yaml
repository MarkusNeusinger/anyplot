review:
  strengths:
  - Marker radius scales with study weight (radius = 8 + weight/maxWeight * 10), giving
    a genuine visual read of study influence rather than uniform dots.
  - Pooled Estimate rendered as a diamond via a custom polygon, distinctly colored
    from individual studies (theme ink vs. brand green) — a real forest-plot convention
    correctly reproduced, not a generic circle-with-bigger-radius hack.
  - Correct null-effect reference line at x=1 (odds ratio scale) rather than x=0,
    showing the spec was read carefully rather than defaulted.
  - Studies stacked chronologically with the pooled row anchored at the bottom, axis
    labeled 'Odds Ratio (95% CI) — Treatment vs Control' with units and comparison
    groups spelled out.
  - Custom renderItem uses api.coord() for correct pixel mapping and echarts markLine
    for the reference line — idiomatic use of ECharts' low-level custom-series API,
    appropriate since ECharts has no built-in forest/whisker series.
  - 'Clean minimal chrome: hidden ticks, subtle vertical-only gridlines, generous
    margins; both themes read cleanly with identical data colors and correctly flipped
    chrome.'
  weaknesses:
  - The pooled diamond and per-study markers are the only two visual elements — no
    legend or annotation calls out the null-effect line's meaning (e.g. 'no effect'),
    leaving first-time readers to infer it from position alone.
  - Whisker end caps are thin (2.5px) relative to the marker circles, and heavier
    studies' cap lines could be visually swallowed by the larger marker at a glance
    — consider a touch more cap prominence for the smallest studies.
  - Aesthetic is competent and correct but fairly conventional for the genre (green
    circles, black diamond, dashed line) — there is room for a more distinctive visual
    signature (e.g. subtle weight-based opacity, or a light shaded confidence band)
    without breaking forest-plot conventions.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches spec.
      Chrome: Title "forest-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Y-axis lists 8 study names ("Chen et al. (2015)" through "Whitfield et al. (2022)") plus "Pooled Estimate" at the bottom, all in soft dark gray, fully readable. X-axis is a value axis from 0.3 to 1.5 labeled "Odds Ratio (95% CI) — Treatment vs Control", tick labels legible. Vertical gridlines are light gray and subtle; a dashed vertical reference line sits at x=1.
      Data: Each study is a green (#009E73) filled circle with a green horizontal whisker (CI) and vertical end caps; circle radius visibly varies with study weight (e.g. Whitfield and Osei markers are noticeably larger than Nguyen's). The Pooled Estimate row shows a black diamond spanning its CI instead of a circle-and-whisker. No text overlaps data or other text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches spec.
      Chrome: Same title, now in light ink, clearly legible against the dark background. Study names and axis tick labels are rendered in light gray, fully readable — no dark-on-dark issues anywhere. Vertical gridlines are a faint dark gray, still visible without dominating. Dashed reference line at x=1 renders in light gray.
      Data: Circles and whiskers are the identical green (#009E73) as the light render — confirmed unchanged. The Pooled Estimate diamond flips to off-white/cream (theme ink), maintaining strong contrast against the dark background while still reading as visually distinct from the green study markers.
      Legibility verdict: PASS
