review:
  strengths:
  - 'Correct forest-plot semantics: point estimates with whiskers, a diamond for the
    pooled estimate, and a dashed null-effect (RR=1) reference line with its own label'
  - Weight-proportional marker sizing via d3.scaleSqrt adds genuine data-driven visual
    encoding beyond a plain scatter
  - Imprint brand green (#009E73) is identical between light and dark renders; all
    chrome (title, axes, diamond fill, reference line) is correctly theme-adaptive
    via ANYPLOT_TOKENS
  - 'Clean, minimalist layout: L-shaped spines only, no gridlines needed, generous
    margins, bold styling on the ''Pooled Estimate'' row for emphasis'
  - Realistic, neutral meta-analysis dataset (antihypertensive therapy vs. stroke
    risk ratio) with genuine heterogeneity — some study CIs cross the null line, others
    don't — and a pooled CI correctly narrower than any individual study's
  weaknesses:
  - Per-study marks are drawn with imperative for-loops and g.append() calls rather
    than D3's idiomatic selection.data(...).join(...) enter/update pattern — functionally
    correct but not the library's recommended data-binding idiom
  - 'Visual storytelling is good but stops short of ''excellent'': consider a subtle
    emphasis (e.g. bolder stroke or color cue) on studies whose CI excludes the null
    line to make statistical significance immediately scannable'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "forest-basic · javascript · d3 · anyplot.ai" centered at top; 14 study labels (chronological, "Chen 2005" .. "Larsson 2019") on the left in dark ink, "Pooled Estimate" bolded below them; x-axis labeled "Risk Ratio (95% CI, log scale)" with log-scale ticks at 0.4/0.5/0.75/1/1.5; a dashed vertical reference line at RR=1 labeled "RR = 1 (no effect)" in muted gray. All text is clearly legible against the light background.
      Data: Each study shown as a green (#009E73) horizontal whisker (95% CI) with end caps and a circular point estimate sized by study weight (scaleSqrt). The pooled estimate is a solid dark diamond spanning its CI. Colors and shapes match the spec's forest-plot requirements.
      Legibility verdict: PASS — no overlap, no clipping, all text readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, study labels, axis label, and reference-line label are now rendered in light/white tones (ink and inkSoft tokens flipped correctly). No dark-on-dark text was found; every label is clearly visible against the dark surface.
      Data: The whiskers, point estimates, and reference-line dashes retain the identical green (#009E73) as in the light render — confirmed unchanged data colors. The pooled-estimate diamond flips to a cream/off-white fill (theme-adaptive ink token), maintaining strong contrast against the dark background.
      Legibility verdict: PASS — all text and data elements read clearly, brand green remains vivid on the dark surface.
