review:
  strengths:
  - 'The requested repair items are all present and well executed: axis-pointer switched
    from bar-chart-style shadow to cross, a per-band vertical gradient fill (echarts.graphic.LinearGradient)
    adds visual depth, and a markArea annotation explicitly labels the Development-stage
    bottleneck.'
  - 'Correct CFD stacking order preserved: earliest stage (Backlog) on top, latest
    (Done) on bottom, matching the spec''s required convention.'
  - 'Imprint palette correctly applied and identical across themes: Backlog (first
    series) is brand green #009E73, remaining stages follow canonical positions 2-5.'
  - 'The bottleneck narrative is now explicit and legible: the shaded markArea window
    aligns with where the Development band visibly widens, and the label text is readable
    in both themes.'
  - Canvas is exactly 3200x1800 with generous, balanced margins; no clipped text on
    any edge in either render.
  - Fully deterministic via a fixed-seed LCG; monotonic non-decreasing cumulative
    counts enforced by construction; realistic Kanban/CFD business scenario.
  weaknesses:
  - The area-fill gradient is subtle at full resolution (sampled RGB shift is only
    ~10 units top-to-bottom within a band) — a slightly wider alpha range (e.g. 0.95
    to 0.4) would make the depth effect read more clearly without hurting legibility.
  - The markArea annotation box uses a very low-contrast fill (t.ink at 5% opacity)
    and inkSoft text, so it functions more as a caption than a strong visual focal
    point — a thin top border or slightly higher-contrast label color would make the
    bottleneck callout pop more on first glance.
  - The Analysis and Testing bands remain sliver-thin for the first 10-15 days (low
    early WIP); this is true to the underlying capacity model and not a defect, but
    keeps two of the five series hard to distinguish from each other in that opening
    stretch.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Centered title "area-cumulative-flow · javascript · echarts · anyplot.ai" in dark ink; legend below it lists Backlog / Analysis / Development / Testing / Done with matching color swatches; Y-axis "Cumulative Items", X-axis "Date" with legible tick labels at ~4-day intervals; subtle horizontal-only gridlines. A shaded markArea box spans roughly Feb 14 through the end of the series with the label "Bottleneck: Development WIP widens as Testing throughput caps it" — text is readable against the light gray box.
      Data: Five stacked bands, bottom to top: Done (matte red, wide and growing), Testing (ochre, thin), Development (blue, wide and visibly widening in the back half — the bottleneck), Analysis (lavender, thin), Backlog (brand green, thin). First series (Backlog) confirmed brand green #009E73. Each band shows a subtle vertical gradient (richer near its own boundary, softer toward the stack), verified via pixel sampling (e.g. RGB(144,162,192) near the top of the Development band fading to RGB(153,169,195) near its bottom).
      Legibility verdict: PASS — all text clearly readable against the light background, no overlap, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels rendered in light/off-white text, clearly readable against the dark surface. The markArea annotation box and its inkSoft-colored label text are legible, though lower-contrast (soft gray text on a near-black tinted box) compared to the light render.
      Data: Band colors and stacking order are pixel-identical to the light render (green/lavender/blue/ochre/red) — only the chrome (background, text, grid) flipped for the theme, confirming Imprint palette compliance.
      Legibility verdict: PASS — no dark-on-dark failures; every title/axis-label/tick/legend/annotation element is visible, though the annotation text contrast is the least-punchy element in either render.
