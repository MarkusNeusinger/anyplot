review:
  strengths:
  - 'Correct CFD stacking order: earliest stage (Backlog) at the top, latest (Done)
    at the bottom, exactly matching the spec''s required convention.'
  - Data generation deliberately engineers a Testing-stage capacity bottleneck, producing
    a widening Development band — the textbook CFD signature the spec calls out, not
    just generic random data.
  - 'Imprint palette correctly applied: Backlog (first stage/series) is brand green
    #009E73, remaining stages use canonical positions 2-5, identical hues across light
    and dark renders.'
  - 'Refined, minimal chrome: hidden y-axis line, hidden tick marks on both axes,
    subtle horizontal-only split lines, transparent background — goes beyond the library
    skeleton''s defaults.'
  - Canvas is exactly 3200x1800 (landscape target), no clipped text on any edge in
    either theme.
  - Fully deterministic via a fixed-seed LCG (no Math.random()), monotonic non-decreasing
    cumulative counts enforced by construction (each stage capped at the previous
    stage's cumulative value).
  weaknesses:
  - Design Excellence is competent but stays close to the prescribed style-guide skeleton
    rather than showing an extra flourish — e.g. a subtle area-opacity gradient per
    band or a slightly heavier top line stroke would add polish (DE-01).
  - The bottleneck story (widening Development band ahead of the Testing gate) lives
    in the data but isn't visually called out — consider a markLine/markArea or small
    text annotation labeling the bottleneck region so the CFD's core analytical takeaway
    is legible at a glance, not just inferable (DE-03).
  - The Analysis and Testing bands are sliver-thin for the first ~10-15 days (low
    early WIP) and border on hard-to-distinguish there; true to the underlying data
    but worth a slightly higher early-period floor so all five stages stay legible
    from day one (VQ-03).
  - 'tooltip.axisPointer uses type: ''shadow'', which is more conventional for bar
    charts; ''cross'' or ''line'' is more idiomatic for a stacked line/area time series
    (LM-02, minor).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the #FAF8F1 target — not pure white.
      Chrome: Title "area-cumulative-flow · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Legend below title lists Backlog / Analysis / Development / Testing / Done with matching color swatches, all legible. Y-axis "Cumulative Items" (rotated) and X-axis "Date" labels both legible in soft ink. Tick labels (0-700 on Y, dates Jan 05-Apr 03 on X) all legible, evenly spaced, no overlap. Horizontal gridlines are subtle; no vertical gridlines (intentional minimal chrome).
      Data: Five stacked bands from top to bottom: Backlog (green #009E73, thin), Analysis (lavender/purple, thin), Development (blue, wide — visibly the largest band from mid-chart onward, showing the WIP bottleneck), Testing (ochre/gold, thin), Done (matte red, wide and growing — the completed-item stock). Band order matches the spec's required earliest-on-top / latest-on-bottom convention. First categorical series (Backlog) is the brand green as required.
      Legibility verdict: PASS — all text clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the #1A1A17 target — not pure black.
      Chrome: Same title, legend, and axis labels render in light ink/off-white text, clearly readable against the dark background. Gridlines remain subtle but visible. No dark-on-dark text anywhere — title, legend, tick labels, and axis names all have sufficient contrast.
      Data: Identical band colors and identical stacking order to the light render (green/lavender/blue/ochre/red) — only the chrome (background, text, grid) flipped for the theme, confirming palette consistency as required.
      Legibility verdict: PASS — all text clearly readable against the dark background, no dark-on-dark failures observed.
