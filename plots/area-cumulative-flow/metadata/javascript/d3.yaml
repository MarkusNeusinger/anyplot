review:
  strengths:
  - Correct stage stacking order — earliest stage (Opened) renders as the topmost
    band, latest stage (Resolved) at the bottom, exactly per the spec's ordering note
  - Deterministic support-ticket data (seeded LCG, weekend-damped arrivals, per-stage
    advance rates) that respects the monotonic-cumulative constraint between adjacent
    stages
  - 'Clean theme-adaptive chrome: y-axis-only subtle gridlines, L-shaped spine, consistent
    explicit font sizing, and a title fontsize correctly scaled via the mandated `round(default
    × 67/len)` formula for the long descriptive+mandated title string'
  - Legend clearly lists all five workflow stages beside the plot with no overlap
  - Both light and dark renders are fully theme-correct with identical data colors
    across themes
  weaknesses:
  - 'VQ-07: The ''Resolved'' stage — the largest, dominant fill band representing
    successfully completed tickets — is colored matte red (#AE3030, palette position
    5) purely by canonical ordinal assignment. Matte red is the Imprint palette''s
    reserved semantic anchor for bad/loss/error roles, so a reader''s first impression
    of the chart is ''a huge wall of red = a huge pile of problems'' when it actually
    represents successful resolutions. Reassign colors so the semantically-loaded
    red slot doesn''t land on a positive-outcome stage — e.g. give ''Resolved'' a
    non-red hue (such as lime #99B314) and use red for a different stage if at all,
    or drop red from the assignment entirely since only 5 of 8 categorical slots are
    needed.'
  - 'DQ-01: The four upstream WIP bands (Opened, Triaged, In Progress, Waiting on
    Customer) stay fairly uniform in thickness for most of the 90-day window and only
    widen modestly in the final ~3 weeks. The spec explicitly calls out identifying
    bottlenecks by ''spotting widening or narrowing bands'' as a primary application
    of this chart type, and the current data doesn''t showcase that dynamic clearly.
    Introduce a deliberate slowdown period (one stage''s advance rate drops for 1-2
    weeks, visibly widening that band) and/or a drain period where a band visibly
    narrows, so the chart demonstrates the CFD''s signature diagnostic use case.'
  - 'LM-01/LM-02: Bands are built by manually computing cumulative boundary arrays
    and feeding y0/y1 into d3.area(), rather than using d3-shape''s dedicated d3.stack()
    (with a reversed key order for the top-to-bottom stage order) — the more canonical
    high-level D3 tool for exactly this ''stacked bands over time'' pattern. Not a
    correctness issue, but it doesn''t showcase D3''s purpose-built stacking module.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Support Ticket Pipeline · area-cumulative-flow · javascript · d3 · anyplot.ai" in bold dark text at top, correctly scaled to avoid overflow. "Date" x-axis label and rotated "Cumulative Ticket Count" y-axis label both in dark ink, fully readable. Tick labels (dates, counts) in a softer dark gray, all legible. Subtle horizontal gridlines only. L-shaped spine (left + bottom axis lines visible, top/right removed). Legend at top-right lists all five stages (Opened, Triaged, In Progress, Waiting on Customer, Resolved) with matching color swatches, dark readable labels, no overlap with the plot.
      Data: Five stacked area bands from a 90-day time series, ordered top-to-bottom Opened (green) → Triaged (lavender) → In Progress (blue) → Waiting on Customer (ochre) → Resolved (matte red, dominant majority fill). First series is #009E73 as required. All bands grow monotonically left to right with mild widening of upstream bands near the right edge.
      Legibility verdict: PASS — all text clearly readable against the light background, no overlaps, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light/white text, clearly visible against the dark background — no dark-on-dark text anywhere. Gridlines remain subtle. L-shaped spine visible in light ink. Legend swatches and labels fully legible in light text on the dark surface.
      Data: Colors are identical to the light render (green/lavender/blue/ochre/red bands in the same stacking order) — confirming only chrome flipped between themes, not data colors.
      Legibility verdict: PASS — all text clearly readable against the dark background, no dark-on-dark failures, brand green and all other data colors read well on the dark surface.
