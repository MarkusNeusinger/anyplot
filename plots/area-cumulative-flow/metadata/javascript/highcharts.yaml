review:
  strengths:
  - Development band is now solidly visible throughout the chart (6-72px thick, data
    WIP min=2/max=60/mean=35) - a real, verified fix for the worst offender flagged
    in attempt 1
  - New dashed xAxis.plotLine with label 'Testing backlog tops 100 items', computed
    from the actual simulated data, directly answers attempt 1's Design Excellence
    feedback and gives the chart a clear narrative focal point
  - 'Correct chart construction retained: stacked area with stacking:''normal'', series
    ordered Backlog to Done so Backlog sits on top and Done on the bottom of the stack,
    matching the spec''s required workflow order'
  - 'WIP-band math remains correct: each series is cumulative[stage] - cumulative[stage+1],
    correctly reconstructing per-stage WIP'
  - 'Both backgrounds measure exactly #FAF8F1 / #1A1A17; first series exactly #009E73;
    data hues pixel-identical between light and dark renders; no dark-on-dark or light-on-light
    chrome failures'
  - 'Clean, idiomatic Highcharts usage retained: animation:false on both chart and
    plotOptions.series, credits.enabled:false, no explicit chart.width/height, deterministic
    in-memory LCG data generation, no imports/CDN/fetch'
  weaknesses:
  - 'The Backlog band fix is incomplete: Backlog has no explicit capacity (CAPACITIES[0]=Infinity)
    and its inflow is capped only indirectly by Analysis''s capacity (11), which sits
    barely above the mean daily arrival rate (~12) with real variance, so Backlog
    WIP fully drains to 0 on 11 of 90 days and stays under 5 items on 32 of 90 days
    (35% of the chart), overwhelmingly in the first ~65% of the timeline. Development
    received the equivalent fix (tightened capacity relative to inflow) and is now
    consistently visible - Backlog needs the same treatment: give it an explicit capacity
    noticeably below the mean arrival rate (not Infinity), or clamp its daily net
    change so it maintains a readable minimum WIP floor throughout.'
  - 'Design Excellence beyond the new plotLine is still generic: default Highcharts
    area styling with token colors swapped in, no other bespoke polish.'
  image_description: |-
    Light render (plot-light.png):
      Background: Measures exact #FAF8F1 (250,248,241) - warm off-white, not pure white.
      Chrome: Bold dark title "area-cumulative-flow · javascript · highcharts · anyplot.ai" centered, no clipping (bbox spans px 1005-2192 of 3200, ~37% width). Y-axis "Cumulative Items" 0-1200; x-axis dates at 14-day intervals. New dashed vertical plotLine labeled "Testing backlog tops 100 items" marks the bottleneck onset day. Legend lists all 5 stages with matching swatches. All text dark-on-light and clearly readable.
      Data: Five stacked bands top-to-bottom: Backlog (green #009E73), Analysis (purple), Development (blue), Testing (ochre), Done (red). Pixel-sampling across x=5%-97%: Development is now consistently visible (6-72px thick) - fixed vs. attempt 1. Backlog is markedly better in the back third (22-37px from ~day 65 on) but still collapses to 0px on 11/90 days and stays under 5 items on 32/90 days, mostly in the first two-thirds of the timeline. First series exactly #009E73.
      Legibility verdict: PASS (all chrome text readable; residual issue is a data band, not text)

    Dark render (plot-dark.png):
      Background: Measures exact #1A1A17 (26,26,23) - warm near-black, not pure black.
      Chrome: Same layout, all text flipped to light-on-dark - title, axis labels, tick labels, legend, and plotLine label all clearly legible. No dark-on-dark failures.
      Data: Confirmed pixel-identical to light render (green/purple/blue/ochre/red match); only chrome flipped as expected. Same Backlog intermittent-zero-band issue present (data-scale issue, independent of theme).
      Legibility verdict: PASS (no dark-on-dark text failures)
