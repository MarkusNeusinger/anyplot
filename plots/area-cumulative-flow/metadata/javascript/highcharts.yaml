review:
  strengths:
  - 'Correct chart construction: stacked area with `stacking: "normal"`, series ordered
    Backlog→Done so Backlog lands on top and Done on the bottom of the stack, exactly
    matching the spec''s required workflow order.'
  - 'WIP-band math is genuinely correct: each series is `cumulative[stage] - cumulative[stage+1]`,
    so stack height reconstructs true per-stage WIP rather than just re-plotting raw
    cumulative counts.'
  - The synthetic data intentionally engineers a Testing bottleneck (undersized exit
    capacity vs. inflow) and it reads clearly in both renders — the Testing (ochre)
    band visibly widens from ~36px to ~344px of vertical extent across the 90-day
    window, which is exactly the story a CFD is supposed to tell.
  - Theme tokens are threaded through every chrome element (title, axes, gridlines,
    legend, tooltip) and both backgrounds measure exactly `#FAF8F1` / `#1A1A17` —
    no hardcoded colors, no white background leaking through.
  - 'First series is exactly `#009E73` and the full `colors: t.palette` array is used
    canonically; data hues are pixel-identical between light and dark renders.'
  - 'Clean, idiomatic Highcharts usage: `animation:false` on both `chart` and `plotOptions.series`,
    `credits.enabled:false`, no explicit `chart.width/height`, deterministic in-memory
    LCG data generation, no imports/CDN/fetch.'
  weaknesses:
  - 'Two of the five stage bands (Backlog and, especially, Development) are near-invisible
    for almost the entire 90-day window. Simulated WIP: Backlog stays in the 0-13
    item range and Development in the 0-8 item range against a y-axis scaled to ~1100
    — pixel-measured band thickness for Development is 0px at most sampled x-positions
    across the chart and never exceeds ~3px; Backlog tops out around 13-17px. The
    Development legend entry is functionally undetectable in the plotted area for
    most of the timeline. Fix by rebalancing CAPACITIES (e.g., tighten Analysis/Development
    capacity relative to arrivals, or loosen Backlog''s unlimited capacity slightly)
    so every stage retains a readable minimum WIP band (aim for each stage to be at
    least ~20-30 units / ~25-35px tall at some point in the series) while still preserving
    the intended Testing bottleneck.'
  - Title renders at only ~37% of the plot width (measured bounding box) — well under
    the 50-70% comfortable range from the style guide — because the shorter spec-id
    (`area-cumulative-flow`, 59-char full title) is rendered at the same 22px fontsize
    used for longer mandated titles. Not a hard violation (no overflow, generously
    readable, correct absolute pixel height ~40px) but leaves a lot of unused whitespace
    above the chart; consider it optional polish, not required for approval.
  - 'Design Excellence is generic: default Highcharts area styling with token colors
    swapped in, but no distinctive touch (e.g., no callout/annotation marking the
    Testing bottleneck onset, no varied line weights to draw the eye to Done vs. the
    upstream bands, no Highcharts-distinctive feature like a plotBand/plotLine flagging
    the point where Testing WIP starts climbing).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured pixel RGB (250,248,241) = exact #FAF8F1 match. Not pure white.
      Chrome: Bold dark title "area-cumulative-flow · javascript · highcharts · anyplot.ai" centered near the top, comfortably clear of the canvas edge. Y-axis titled "Cumulative Items" with tick labels 0-1100 in steps of 100, rendered in soft dark gray. X-axis shows date labels (Jan 12, Jan 26, Feb 9, Feb 23, Mar 9, Mar 23) at 14-day intervals, also soft dark gray. Horizontal gridlines only (subtle, light gray, ~15% opacity) — no vertical gridlines, matching the "Y-axis grid only" guideline. Legend sits below the x-axis with 5 swatches: Backlog (green), Analysis (lavender), Development (blue), Testing (ochre), Done (red). All chrome text is dark-on-light and clearly legible; no clipping observed at any edge (verified by cropping title/left-axis/right-edge/legend regions).
      Data: Five stacked area bands in workflow order top-to-bottom: Backlog (thin green sliver at the very top), Analysis (lavender, grows steadily), Development (blue, essentially a hairline — pixel-sampled column scans found 0px of blue at most x-positions and at most ~3px near the start), Testing (ochre, visibly widens over time — pixel-measured thickness grows from ~36px near the start to ~344px near the end, correctly depicting the intended bottleneck), Done (matte red, the largest band, growing steadily as the terminal cumulative count). First series (Backlog) is exactly #009E73. Data colors read clearly against the light background except for the Development band, which is too thin to perceive as a distinct region for most of the chart.
      Legibility verdict: PASS (all chrome text legible; data-band visibility issue for Development/Backlog is a distinctness/scale problem, not a legibility/contrast problem).

    Dark render (plot-dark.png):
      Background: Warm near-black, measured pixel RGB (26,26,23) = exact #1A1A17 match. Not pure black.
      Chrome: Same layout as the light render with all text flipped to light-on-dark (white/light-gray title, axis labels, tick labels, legend text) — all clearly readable, no dark-on-dark failures observed. Gridlines are light, subtle, and visible against the dark background without dominating.
      Data: Same five stacked bands in the same order and same hex values as the light render — confirmed pixel-identical data colors (green/lavender/blue/ochre/red), only the chrome flipped. Same Development/Backlog thin-band visibility issue persists here as in the light render (it is a data-scale/design issue independent of theme).
      Legibility verdict: PASS (no dark-on-dark text failures; brand green and the rest of the palette read clearly on the dark surface).
