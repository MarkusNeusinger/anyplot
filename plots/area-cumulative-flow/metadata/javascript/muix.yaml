review:
  strengths:
  - 'Stacking order correctly follows the spec''s CFD convention (stack + stackOrder="reverse"):
    earliest stage "New" renders on top, latest stage "Resolved" renders on bottom,
    with each band''s width equal to that stage''s WIP.'
  - 'Palette compliance is exact: first series (New) is brand green #009E73, remaining
    stages use the Imprint palette in canonical order 2-3-4, identical hues in both
    light and dark renders.'
  - 'Both renders are fully legible and theme-correct — warm cream #FAF8F1 background
    with dark ink in light mode, warm near-black #1A1A17 background with light ink
    in dark mode, no dark-on-dark or light-on-light failures.'
  - 'Genuine data storytelling: the Triaged/In Progress bands visibly widen during
    the simulated day 20-42 development capacity crunch and narrow again afterward,
    actually demonstrating the bottleneck-detection value the spec calls out.'
  - Deterministic, self-contained data generation via a realistic queue/capacity simulation
    (arrivals, per-stage daily throughput caps) — no RNG, no network calls.
  - The hand-rotated y-axis label sidesteps a documented MUI X gotcha (the built-in
    axis `label` prop collides with 3-digit tick labels) with a clean, collision-free
    layout.
  weaknesses:
  - Design Excellence is fairly restrained — beyond the data-color palette and the
    custom rotated y-axis label, the chart leans on MUI X defaults (standard horizontal
    grid, flat area fills, default legend swatches); a touch more polish (subtle area
    alpha/gradient, refined spine treatment) would raise DE-01/DE-02.
  - Stage count sits at the minimum of the spec's 4-8 range; an additional upstream
    stage (e.g. a raw "Backlog" queue feeding New) would better showcase the multi-stage
    bottleneck story DQ-01 rewards.
  - Several helper functions (advanceQueue, per-stage capacity closures) add structure
    beyond the KISS ideal for a chart script, even though they're justified by the
    realistic queue simulation they implement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "area-cumulative-flow · javascript · muix · anyplot.ai" in bold dark ink top-left; legend (New/Triaged/In Progress/Resolved swatches) centered above the plot; y-axis label "Cumulative ticket count" hand-rotated on the left; x-axis label "Date" centered below; tick labels on both axes in a lighter dark gray. All fully readable against the light background.
      Data: Four stacked area bands from bottom to top: Resolved (ochre/orange, largest, ~490 at the end), In Progress (blue), Triaged (lavender/purple), New (brand green #009E73, thinnest sliver on top). Bands widen visibly in the Triaged/In Progress region between ~Apr 21 and ~May 15, showing a mid-period bottleneck, then narrow again — matching the simulated capacity crunch in the code.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, axis labels and tick labels as the light render, all rendered in light ink/gray tones. Grid lines are subtle but visible against the dark background. No dark-on-dark elements — every text element has clear contrast against the near-black surface.
      Data: Identical stacking order and identical hues to the light render (green/purple/blue/ochre) — only the chrome (background, text, grid) flipped, confirming theme-adaptive tokens were threaded correctly. The green top sliver and the bottleneck-widening bands read exactly as they do in the light render.
      Legibility verdict: PASS
