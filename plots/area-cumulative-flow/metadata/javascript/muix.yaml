review:
  strengths:
  - 'Correct CFD stacking order: New (earliest) on top, Resolved (latest) on bottom,
    matching the spec''s required band order'
  - 'Data tells a real bottleneck story: the Triaged band visibly narrows around May
    11-15 when dev capacity tightens, then the whole stack accelerates after the staffing
    boost around day 42 - a genuine CFD insight, not a flat trend'
  - Cumulative counts are correctly monotonically non-decreasing via a deterministic
    queue-simulation (advanceQueue), guaranteeing the CFD invariant that an earlier
    stage's cumulative count never dips below a later stage's
  - Imprint palette used in canonical order with brand green first (#009E73 for 'New'),
    identical data colors across both themes, theme-correct chrome (cream/near-black
    backgrounds, adaptive text) in both renders
  - Explicit font sizing throughout (title 22px, axis label 16px, tick/legend 14px)
    plus a documented workaround for MUI X's y-axis label collision with 3-digit ticks
    (hand-rotated Typography label in a flex column)
  - Title format exactly matches the mandated 'area-cumulative-flow · javascript ·
    muix · anyplot.ai' convention, legend labels match the four workflow stages in
    order
  weaknesses:
  - 'Design Excellence is close to a well-configured library default: aside from the
    dashed grid, area fillOpacity, and the rotated y-axis label workaround, the chart
    relies on MUI X''s stock stacked-area look - a custom typography treatment or
    subtler spine/axis-line styling would push this further above ''default'''
  - No explicit annotation or callout marks the bottleneck (Triaged band narrowing
    then the post-staffing-boost acceleration) even though the data was deliberately
    engineered to show it - a viewer has to notice the shape change themselves rather
    than being guided to it
  - 'LM-02 distinctive-feature usage is moderate: stacked area via LineChart''s area+stack+stackOrder
    is correct MUI X API but is also straightforward to replicate in most other charting
    libraries; nothing here is uniquely MUI X beyond the axis-label quirk workaround'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "area-cumulative-flow · javascript · muix · anyplot.ai" top-left, clearly readable. Row legend below title (New / Triaged / In Progress / Resolved) with color swatches. Y-axis has a rotated "Cumulative ticket count" label plus numeric ticks (0-800, step 50); x-axis has "Date" label plus date ticks (Apr 1 - Jun 7) at 2-day intervals. Subtle dashed horizontal gridlines. All text renders in dark ink against the light background - fully legible.
      Data: Four stacked area bands from top to bottom: thin green "New" sliver, lavender "Triaged", blue "In Progress", and the large ochre "Resolved" band at the base. The Triaged (lavender) band visibly narrows around Apr 25-May 11 (dev-capacity bottleneck) before widening again once the backlog clears - clear bottleneck signal in the data. First series (New) is the brand green #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title, legend, axis labels and ticks now rendered in light/off-white text against the dark background - clearly readable, no dark-on-dark issues found. Gridlines remain subtle (light dashed lines at low opacity).
      Data: Same four bands in identical colors to the light render (green, lavender, blue, ochre) - only the chrome (background, text, grid) flipped as expected. The bottleneck narrowing/widening shape in the Triaged band is equally visible.
      Legibility verdict: PASS
