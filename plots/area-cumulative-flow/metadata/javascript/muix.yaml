review:
  strengths:
  - 'Bands come from cumulative counts turned into per-stage WIP differences and stacked
    with MUI X''s native `stack: "flow"` plus `stackOrder: "reverse"`. Each boundary
    sits exactly at its cumulative count, earliest stage (New) on top and Resolved
    on the bottom from a zero baseline.'
  - 'The queue-based data generator guarantees non-decreasing counts and no crossing
    boundaries. The data tells a real flow story: a three-week development slowdown
    widens the Triaged band and drains In Progress to nothing, then a staffing boost
    refills it.'
  - Theme tokens reach every chrome element (axis lines, ticks, grid, legend, title,
    subtitle). Both renders are fully legible, and the data colors are identical across
    themes.
  - A time-scale x axis with a `valueFormatter` gives weekly date ticks, square legend
    marks match the filled bands, and `skipAnimation` is set. The HTML adds native
    MUI X tooltips.
  weaknesses:
  - 'Suggestion: the gap between the x tick labels and the ''Date'' axis title (axis
    band height 64) and the empty strip above the 800 tick could be tightened so the
    plot area fills more of the canvas.'
  - 'Suggestion: the header comment names muix 7.29.1, but the harness pins @mui/x-charts
    9; the workflow rewrites the header, so the generator could write the pinned version.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "area-cumulative-flow · javascript · muix · anyplot.ai" top-left (~36% width), soft-ink subtitle "70 days · 4 stages, earliest on top · widest band: Triaged, 143 on Jun 9"; y-axis "Cumulative tickets" 0–800 in steps of 50, x-axis "Date" with weekly ticks Apr 5 … Jun 7; subtle horizontal grid; legend centered at the bottom with square swatches New / Triaged / In Progress / Resolved. All text is dark and readable.
      Data: four stacked filled bands (fill opacity 0.85, 2.5 px boundary strokes). Bottom to top: Resolved (ochre, rising from 0 to ~493), In Progress (blue, thin early, zero from late April to mid-May, then widening to ~110), Triaged (purple, the widest band, growing to ~143), New (brand green #009E73, nearly a line until the last ~10 days, when it opens slightly to ~10 at the top right). Boundaries never descend or cross.
      Legibility verdict: PASS

