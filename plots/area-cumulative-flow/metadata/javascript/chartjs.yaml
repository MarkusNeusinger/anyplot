review:
  strengths:
  - 'Correct stacking order: Backlog (earliest stage) on top down to Done (latest
    stage) at the bottom, matching the spec''s workflow-order requirement exactly.'
  - 'Uses Chart.js''s fill-to-adjacent-dataset-index technique (fill: 1, fill: 2,
    fill: 3, fill: ''origin'') to render true per-stage WIP bands rather than naive
    additive stacking — a sophisticated, idiomatic solution for a chart type Chart.js
    has no built-in primitive for.'
  - Data generation enforces backlog >= inProgress >= review >= done at every date
    via lag-based derivation, and deliberately widens the Review lag after day 45
    so the 'In Progress' band visibly grows — directly fulfilling the spec's bottleneck-identification
    use case.
  - Correct Imprint palette order (Backlog=#009E73 brand green first) and fully theme-adaptive
    chrome; both light and dark renders are legible with no dark-on-dark or light-on-light
    failures.
  - 'Clean, deterministic, dependency-free code: seeded LCG for reproducibility, no
    functions/classes, follows the mount-node contract exactly with animation disabled.'
  weaknesses:
  - No annotation or callout marks the bottleneck onset (~day 45) despite the spec
    explicitly calling out bottleneck identification as a key use case — the widening
    band is visible but unexplained to the viewer.
  - Title and legend text feel modest relative to the mandated title's available width
    (~33% of canvas width used at fontsize 22) — could be sized closer to the style
    guide's upper range for stronger visual hierarchy.
  - 'Lower-contrast palette members used for critical WIP bands (lavender #C475FD
    ''In Progress'', ochre #BD8233 ''Done'') skip the optional 1px ink-stroke outline
    the style guide recommends for series carrying critical information on the cream
    background.'
  - No redundant encoding (e.g. subtle hatching or stage-order legend ordering emphasis)
    beyond color for the 4 stacked bands, though color alone is acceptable at n=4
    per the style guide's series-count guidance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-equivalent), not pure white and not dark — matches the required light-theme surface.
      Chrome: Title "area-cumulative-flow · javascript · chartjs · anyplot.ai" in bold dark ink at top center, clearly legible. Legend below the title with 4 swatches (Backlog/In Progress/Review/Done) in dark ink text, all readable. X-axis "Date" title and rotation-free date tick labels (2024-03-01 through 2024-05-21 at even intervals) in soft dark gray, all legible. Y-axis "Cumulative Items" title and numeric ticks (0-350) in soft dark gray, legible. Subtle horizontal gridlines only (no vertical gridlines), consistent with the style guide's "Y-axis grid only" rule.
      Data: Four stacked area bands from top to bottom: green (Backlog, #009E73), lavender/purple (In Progress), blue (Review), ochre/brown (Done). Bands trend upward from day 0 (near zero) to day 90 (~318 cumulative), with the "In Progress" (purple) band visibly widening in the back half of the chart, consistent with the intended bottleneck simulation. All data boundaries are clearly distinguishable from each other and from the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-equivalent), not pure black and not light — matches the required dark-theme surface.
      Chrome: Title and legend text render in light/white ink, clearly legible against the dark background — no dark-on-dark failures. X-axis and Y-axis titles and tick labels render in soft light gray, fully legible. Gridlines remain subtle (horizontal only), correctly inverted for dark-theme contrast.
      Data: Same four bands in the identical colors as the light render (green, lavender, blue, ochre) — confirmed the four data hues are pixel-identical between themes; only the chrome (background, text, grid) flipped as required. The widening "In Progress" band bottleneck signal remains equally visible on dark.
      Legibility verdict: PASS
