review:
  strengths:
  - 'Explicit bottleneck-onset annotation now added: a dashed reference line + ''Bottleneck
    onset'' label at day 45, drawn via a native Chart.js afterDraw plugin hook (no
    external annotation plugin) — directly resolves the prior review''s top weakness
    and gives the widening ''In Progress'' band an explained focal point.'
  - 'Correct stacking order: Backlog (earliest stage) on top down to Done (latest
    stage) at the bottom, matching the spec''s workflow-order requirement exactly,
    via fill-to-adjacent-dataset-index chaining (fill: 1, fill: 2, fill: 3, fill:
    ''origin'') — an idiomatic solution for a chart type Chart.js has no built-in
    stacked-area primitive for.'
  - Data generation enforces backlog >= inProgress >= review >= done at every date
    via lag-based derivation, and deliberately widens the Review lag after day 45
    so the WIP band visibly grows — directly fulfilling the spec's bottleneck-identification
    use case.
  - Correct Imprint palette order (Backlog=#009E73 brand green first) and fully theme-adaptive
    chrome; both light and dark renders are legible with no dark-on-dark or light-on-light
    failures, and data colors are pixel-identical across themes.
  - Title enlarged and bolded (22px -> 25px bold) with added top/bottom padding, and
    legend switched to rounded point-style swatches with more padding — a modest but
    real visual-refinement pass in response to feedback.
  - 'Clean, deterministic, dependency-free code: seeded LCG for reproducibility, no
    functions/classes beyond the idiomatic plugin object, follows the mount-node contract
    exactly with animation disabled.'
  weaknesses:
  - Title still renders narrower than the style guide's expectation for this mandated
    ~67-char title format (roughly 40% of canvas width even at the enlarged 25px)
    — could grow further toward the 70-85% range typical for this title length for
    stronger visual hierarchy.
  - 'Lower-contrast palette members used for critical WIP bands (lavender #C475FD
    ''In Progress'', ochre #BD8233 ''Done'') still skip the optional 1px ink-stroke
    outline the style guide recommends for series carrying critical information on
    the cream background.'
  - The bottleneck annotation marks the onset day with a line and label but doesn't
    explicitly name the insight (e.g. a short callout like 'Review lag widens here')
    — a reader has to infer the WIP-growth story from the band width themselves.
  - No redundant encoding (e.g. subtle hatching) beyond color for the 4 stacked bands,
    though color alone is acceptable at n=4 per the style guide's series-count guidance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-equivalent), not pure white and not dark — matches the required light-theme surface.
      Chrome: Title "area-cumulative-flow · javascript · chartjs · anyplot.ai" in bold dark ink at top center, clearly legible, now larger (25px) than the prior attempt. Legend below the title with 4 rounded-swatch entries (Backlog/In Progress/Review/Done) in dark ink text, all readable. A dashed vertical reference line crosses the plot near day 45 (2024-04-15) with a "Bottleneck onset" label in soft ink at the top of the plot area — clearly visible, does not overlap the legend or axes. X-axis "Date" title and date tick labels (2024-03-01 through 2024-05-21 at even intervals, no rotation) in soft dark gray, all legible. Y-axis "Cumulative Items" title and numeric ticks (0-350) in soft dark gray, legible. Subtle horizontal gridlines only, consistent with the "Y-axis grid only" rule.
      Data: Four stacked area bands from top to bottom: green (Backlog, #009E73), lavender/purple (In Progress), blue (Review), ochre/brown (Done). Bands trend upward from near zero at day 0 to ~318 cumulative by day 90, with the "In Progress" (purple) band visibly widening after the marked bottleneck-onset line — the annotation now makes this bottleneck story explicit rather than merely visible. All band boundaries are clearly distinguishable from each other and from the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-equivalent), not pure black and not light — matches the required dark-theme surface.
      Chrome: Title and legend text render in light/white ink, clearly legible against the dark background — no dark-on-dark failures. The dashed bottleneck-onset reference line and its label render in a light soft-ink tone, fully legible against the dark background. X-axis and Y-axis titles and tick labels render in soft light gray, fully legible. Gridlines remain subtle (horizontal only), correctly inverted for dark-theme contrast.
      Data: Same four bands in identical colors to the light render (green, lavender, blue, ochre) — confirmed the four data hues are pixel-identical between themes; only the chrome (background, text, grid, annotation ink) flipped as required. The widening "In Progress" band and its now-labeled bottleneck onset remain equally visible on dark.
      Legibility verdict: PASS
