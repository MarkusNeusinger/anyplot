review:
  strengths:
  - 'Correct CFD semantics: the lead()-based ymin/ymax construction on geom_ribbon
    reproduces the exact spec-mandated stacking (Backlog on top, Done on bottom) and
    represents each stage''s WIP as the vertical gap between adjacent cumulative curves,
    rather than a naive geom_area stack that would sum values incorrectly.'
  - 'Palette matches the Imprint canonical order exactly (Backlog=#009E73 first, then
    #C475FD, #4467A3, #BD8233, #AE3030); both renders are theme-correct with warm
    off-white/near-black backgrounds and fully legible chrome in both themes.'
  - 'Data tells the story the spec asks for: capacity tightens down the pipeline (8/7/6/5
    throughput lambda), so the Backlog band visibly widens over the 90-day series
    in the render itself, not just in code comments — a genuine, visible bottleneck.'
  - Canvas is exactly 3200x1800, title matches the mandated format, all five imports
    (ggplot2/dplyr/tidyr/scales/ragg) are used, and set.seed(42) makes the run reproducible.
  weaknesses:
  - Axis text/title sizing is on the conservative side (axis.text=8, base_size=7)
    — a slightly larger axis.text (~9-10) would strengthen legibility at thumbnail/mobile
    scale without crowding the layout.
  - Design excellence is solid but stops at 'clean and correct' — no subtitle or annotation
    calling out the widening-Backlog bottleneck the data already encodes, which would
    push the storytelling from implicit to explicit.
  - The right-side legend consumes a fair share of canvas width; direct end-of-band
    labels near the right edge would be a more distinctive, space-efficient alternative
    and is worth exploring in a future revision (not a blocking issue).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "area-cumulative-flow · r · ggplot2 · anyplot.ai" top-left, dark axis titles ("Date", "Cumulative Items"), soft dark-grey tick labels, subtle horizontal-only gridlines. All chrome is clearly readable against the light background.
      Data: Five stacked ribbon bands from bottom to top: Done (matte red, widest/lowest, anchored at 0), Testing (ochre), Development (blue), Analysis (lavender), Backlog (brand green #009E73, topmost). Thin light-colored borders separate the bands. The Backlog (green) band visibly widens from left to right, showing a growing bottleneck over the 90-day series. Legend "Stage" at right lists all five stages in top-to-bottom stacking order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: White/light title and axis titles, light-grey tick labels, subtle light horizontal gridlines — all clearly legible against the dark background. No dark-on-dark text found.
      Data: Same five bands in identical colors and stacking order as the light render (Done red at bottom through Backlog green at top), separated by thin dark borders (matching the page background, per geom_ribbon(color = PAGE_BG)). Brand green Backlog band remains highly visible and widens over time exactly as in the light render.
      Legibility verdict: PASS
