review:
  strengths:
  - Correct stacking order via geom_ribbon(ymin/ymax) rather than relying on geom_area's
    automatic stack order — the right idiom for the spec's "earliest stage on top"
    requirement
  - 'Clean theme-adaptive chrome: identical data colors between light/dark, only chrome
    (background, ink, grid) flips'
  - Data generation is genuinely well thought out — a capacity-constrained pipeline
    simulation that produces a realistic, monotonically widening CFD signature, with
    clear code comments explaining the WIP logic
  - Canvas, title format, and legend all match spec/style-guide requirements exactly
  weaknesses:
  - All five bands widen in lockstep since capacity decreases uniformly down the pipeline
    (8/7/6/5); varying the capacity profile per stage (e.g. one stage recovering mid-series)
    would make the "identifying bottlenecks" use case from the spec's Applications
    section more vivid
  - No additional refinement layer (e.g. a subtle geom_line tracing the top boundary
    of the Backlog band, or a light annotation calling out the growing WIP) to push
    Design Excellence and Library Mastery further
