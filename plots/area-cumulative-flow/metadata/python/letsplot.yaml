review:
  strengths:
  - 'Correct CFD semantics: geom_area(position=''identity'') layered by reversed factor
    order produces properly nested bands, so each band''s width equals the WIP of
    exactly that stage, matching the spec''s WIP-band definition precisely.'
  - Stage capacity throttling (19/15/11/8 items/day per downstream stage) produces
    a realistic, escalating bottleneck — the Machining and Assembly bands visibly
    widen over the 90-day window, directly demonstrating the spec's bottleneck-identification
    use case.
  - Imprint palette applied in exact canonical order (Raw Materials=#009E73, Machining=#C475FD,
    Assembly=#4467A3, Quality Check=#BD8233, Shipped=#AE3030), consistent and identical
    across both light and dark renders.
  - 'Theme-adaptive chrome fully threaded through: backgrounds, axis/tick/legend text
    colors, and legend box fill all flip correctly between light (#FAF8F1) and dark
    (#1A1A17) with no dark-on-dark or light-on-light failures.'
  - Canvas lands at the exact 3200x1800 target with generous, balanced margins; legend
    sits close to the plot rather than floating isolated.
  weaknesses:
  - Data only demonstrates widening WIP bands (growing bottleneck); the spec's other
    named behavior -- narrowing bands when a stage 'drains faster than it fills' --
    is never shown. Vary the capacity/intake ratio partway through the 90-day window
    (e.g. a mid-period capacity increase or intake dip) so at least one band visibly
    narrows, for fuller feature coverage.
  - panel_grid_major_y uses the solid INK token (full-opacity text color) rather than
    the style guide's translucent RULE token (rgba(...,0.15)). It reads acceptably
    here, but drifts from the documented grid-styling convention -- switch to an alpha/rgba
    grid line for consistency.
  - Data storytelling is implicit only -- the viewer has to notice the widening bottleneck
    bands unaided. A slightly bolder treatment of the widest band (Machining/Assembly
    congestion), or a small direct emphasis, would push the story from 'visual hierarchy
    present' to 'insight immediately obvious'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "area-cumulative-flow · python · letsplot · anyplot.ai" is dark, bold, and fully visible at the top with margin above it. X-axis "Date" and y-axis "Cumulative Items" labels are dark and clearly legible. Weekly date ticks (Apr 01 ... Jul 01) and y-axis count ticks (0-1,800) are readable in a softer dark gray. Subtle horizontal gridlines run at each y-tick. Legend titled "Stage" sits to the right of the plot with a light elevated box and all five stage names fully legible.
      Data: Five stacked/layered areas in Imprint order -- Raw Materials (#009E73 green, thin top band), Machining (#C475FD lavender), Assembly (#4467A3 blue), Quality Check (#BD8233 ochre), Shipped (#AE3030 red, largest base band). Bands are separated by thin background-colored borders, giving clean edges. Bands visibly widen from left to right, showing growing WIP/bottleneck in Machining and Assembly.
      Legibility verdict: PASS -- all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis titles, and legend title render in light off-white and remain fully legible. Tick labels and legend entries render in a softer light gray, still clearly readable. Gridlines are faint light-gray horizontal lines at each y-tick, subtle but visible. Legend box uses a dark elevated fill (#242420) with a soft border.
      Data: Same five bands in the same colors and same relative widths as the light render -- Raw Materials green through Shipped red are pixel-identical hues to the light version, confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS -- no dark-on-dark failures; every title, label, tick, and legend entry is clearly legible against the dark background.
