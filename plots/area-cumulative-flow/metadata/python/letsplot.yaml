      Background: Warm near-black (#1A1A17), matching the required dark-theme token — not pure black, not light.
      Chrome: Title, axis titles, and legend title render in light off-white; tick labels and legend entries render in a softer light gray — all clearly legible. Gridlines are faint light-gray, subtle but visible, same relative weight as the light render's gridlines. The annotation label uses a dark-on-light box (elevated background token) that remains legible against the dark plot background.
