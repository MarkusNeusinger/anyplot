      Data: Five nested area bands in exact Imprint canonical order, from top to bottom: Raw Materials (#009E73, green), Machining (#C475FD, purple), Assembly (#4467A3, blue), Quality Check (#BD8233, amber), Shipped (#AE3030, red) — matching the legend order top-to-bottom. The Machining band visibly widens through mid-May, peaks near the annotation, then narrows sharply through early June (demonstrating the spec's "narrowing band" behavior) while the other bands continue to widen steadily. Legend "Stage" sits in a light elevated box to the right with all five labels legible.
      Legibility verdict: PASS — no light-on-light issues anywhere.

