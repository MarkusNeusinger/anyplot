review:
  strengths:
  - 'All three Attempt-1 weaknesses are fully resolved: a mid-window Assembly capacity
    surge (days 50-70) now visibly narrows the Machining band alongside the pre-existing
    widening bands, satisfying the spec''s ''narrowing bands indicate stages draining
    faster than they fill'' requirement.'
  - panel_grid_major_y now uses the style guide's translucent RULE rgba token instead
    of the previous solid INK token, matching the documented grid-styling convention
    exactly.
  - A geom_label annotation ('Machining congestion peak') now explicitly calls out
    the bottleneck focal point, turning an implicit visual pattern into an immediately
    obvious data story.
  - 'Correct CFD semantics preserved: geom_area(position=''identity'') layered by
    reversed factor order produces properly nested bands so each band''s width equals
    exactly that stage''s WIP, matching the spec''s band-width definition precisely.'
  - Imprint palette applied in exact canonical order (Raw Materials=#009E73, Machining=#C475FD,
    Assembly=#4467A3, Quality Check=#BD8233, Shipped=#AE3030), pixel-identical between
    light and dark renders; theme-adaptive chrome (backgrounds, axis/tick/legend colors)
    flips correctly with no dark-on-dark or light-on-light failures.
  - Canvas lands at the exact 3200x1800 target with balanced margins; legend sits
    close to the plot in workflow order matching the top-to-bottom band order.
  weaknesses:
  - 'LM-02 still short of full marks: the identity-position/reversed-factor-order
    area layering technique is shared across the whole ggplot2 family (also usable
    in R ggplot2 or plotnine), not something distinctive to lets-plot specifically.
    A lets-plot-specific feature (e.g. its native interactive tooltip customization,
    geom_text/geom_label mm-based sizing nuance beyond the default, or bistro/GGBunch
    composition) would push this higher.'
  - The Machining band narrows sharply during the days 50-70 surge but stays thin
    through the end of the series rather than re-widening once the surge ends (the
    code comment implies it should); not a spec violation since the narrowing requirement
    is already satisfied, but the post-surge behavior doesn't fully match the code's
    own stated intent.
