review:
  strengths:
  - 'Semantic color mapping: Done is Imprint green (#009E73, reads as ''complete'')
    and Backlog is red (reads as ''pending/attention''), reinforcing the workflow
    story rather than following canonical order blindly'
  - Theme tokens (PAGE_BG, INK, INK_SOFT, ELEVATED_BG) are threaded consistently through
    plot/panel background, axis text, gridlines, and legend box for both renders —
    no dark-on-dark or light-on-light failures
  - L-shaped axis frame (bottom + left only) with a single subtle y-axis grid and
    no panel border is a deliberate, well-executed refinement over library defaults
  - The '← bottleneck' annotation is placed inside the Development band so it stays
    legible in both themes (band color doesn't change), and correctly draws attention
    to the widest/most bottlenecked stage
  - 'Data tells a coherent Kanban story: cumulative counts are monotonically non-decreasing,
    WIP bands genuinely widen and narrow over time (Development is the visible bottleneck),
    and stage order matches the spec (earliest stage visually on top, latest on bottom)'
  - Clean KISS structure with explicit theme(), seeded RNG, and only imports that
    are actually used
  weaknesses:
  - 'Design Excellence is good but not yet publication-ready: the plot reads as a
    well-executed, thoughtfully colored default rather than a genuinely distinctive
    editorial piece — consider one more deliberate flourish (e.g. a subtle stroke/shadow
    at band boundaries beyond the current PAGE_BG-colored separators, or a slightly
    bolder title/legend hierarchy) to push DE-01 past ''strong design'' into ''publication-ready''.'
  - Data storytelling relies on a single small italic annotation ('← bottleneck')
    to carry the insight; the widening Development band is real and correct, but nothing
    in the chart (e.g. a light shaded background span, a bolder callout, or a secondary
    label showing peak WIP) makes the bottleneck impossible to miss at a glance —
    strengthen the visual hierarchy so the insight lands without reading the annotation
    text.
  - 'Library Mastery is generic: geom_area(position=''stack'') + scale_fill_manual
    + scale_x_datetime is standard grammar-of-graphics usage that any ggplot2-family
    library (or even matplotlib''s stackplot) could replicate with minor syntax changes
    — no plotnine-distinctive feature (e.g. computed aesthetics via after_stat, coord_cartesian
    tuning, or a second geom layer) is used to earn extra Library Mastery credit.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "area-cumulative-flow · python · plotnine · anyplot.ai" at top, clearly readable against the light background. Axis titles "Date" (x) and "Cumulative Items" (y) in dark ink, tick labels ("Jan 01"..."Mar 25", "0"..."125") in a softer dark gray — all legible. Only a bottom x-axis line and left y-axis line are drawn (L-shaped frame); a subtle horizontal-only grid is visible at low opacity. Legend box ("Stage": Backlog, Analysis, Development, Testing, Done) sits to the right of the plot with a light elevated background and visible border, text fully readable.
      Data: Five stacked bands from top to bottom — Backlog (red #AE3030), Analysis (gold/ochre #BD8233), Development (blue #4467A3), Testing (purple #C475FD), Done (green #009E73) — separated by thin off-white strokes matching the page background. The Development band visibly widens around the midpoint of the series where a small white italic annotation "← bottleneck" is placed inside the band. All cumulative boundaries rise monotonically left to right.
      Legibility verdict: PASS — all text is clearly readable, no dark-on-light or light-on-light failures, no clipping at any canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now rendered in light/off-white ink, clearly readable against the dark background. Axis titles and tick labels are in light gray tones, fully legible; the L-shaped axis frame and subtle grid persist at the same low opacity. Legend box now has a dark elevated background with a light border, text in light gray, fully readable — no dark-on-dark failures anywhere.
      Data: Same five bands in the identical colors as the light render — Backlog red, Analysis gold, Development blue, Testing purple, Done green (#009E73) — confirming data colors are unchanged between themes; only the chrome (background, text, grid, legend box) flipped. The bottleneck annotation remains legible (white text on the unchanged blue Development band).
      Legibility verdict: PASS — all text is clearly readable against the dark background, brand green #009E73 remains vivid and identical to the light render, no clipping at any canvas edge.
