    buildup and drain'
  - 'Idiomatic matplotlib usage: ax.stackplot for the area layers, mdates.WeekdayLocator/DateFormatter
    for clean biweekly date ticks, tick_params(length=0) to drop tick marks while
    keeping labels, and a manually reversed legend order that matches the visual top-to-bottom
    stacking'
  - Realistic, well-scaled 90-day Kanban dataset with monotonically non-decreasing
    cumulative counts, a widening-then-narrowing Testing bottleneck, a steady Development
    buffer, and a growing Backlog — covers the plot type's key analytical features
  weaknesses:
  - 'Title is missing the required language field: renders as ''Sprint Kanban Board
    · area-cumulative-flow · matplotlib · anyplot.ai'' but the mandated format is
    ''{Descriptive Title} · {spec-id} · {language} · {library} · anyplot.ai'' — insert
    ''python'' between ''area-cumulative-flow'' and ''matplotlib''. The corrected
    string is longer (~78 chars incl. the descriptive prefix); re-check it against
    the title_fontsize = max(8, round(12 * 67 / len(title))) scaling rule so it stays
    within the ~70-85% width band for a prefixed mandated title instead of overflowing.'
  - The ax.axvspan bottleneck-highlight (alpha=0.07, lavender COLORS[1]) is barely
    visible in the light render but reads as a much more prominent, hard-edged translucent
    block in the dark render, because the same alpha/hex blended over a much darker
    background raises perceived contrast far more — creates a visual inconsistency
    between themes. Use a theme-adaptive alpha (lower on dark) or drive the tint from
    INK/ELEVATED_BG rather than a categorical data color so the highlight reads with
    similar visual weight in both themes.
  - With 5 adjacent stacked bands (including the perceptually close lavender-Testing
    / blue-Development pair), no boundary stroke separates the layers. Since the entire
    analytical value of a CFD is reading the vertical distance between two adjacent
    band boundaries (WIP), a thin ink-colored stroke between layers (per the style
    guide's 'Optional outline pattern') would sharpen boundary legibility, especially
    under CVD simulation.
