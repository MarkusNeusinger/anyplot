review:
  strengths:
  - Idiomatic bokeh varea_stack for the stacked-area cumulative flow, with the correct
    stacking order (Backlog on top, Done at the bottom) matching the spec's workflow-order
    requirement exactly.
  - 'Genuine data-driven bottleneck story: Development is deliberately throttled downstream
    (10-day lag, 75% throughput into Testing) so its WIP band visibly widens over
    the 90 days, reinforced with higher fill-alpha (0.95 vs 0.68) for a real focal
    point rather than a cosmetic trick.'
  - 'Thoughtful semantic color mapping: brand green (#009E73) assigned to ''Done''
    (good/pass association) while the remaining four stages use the next Imprint palette
    positions in order.'
  - Theme-adaptive chrome is correct in both renders — text, grid, legend box, and
    axis tokens all flip appropriately with no dark-on-dark or light-on-light failures.
  - All font sizes explicitly set per the bokeh style-guide defaults (title 50pt,
    subtitle 26pt, axis labels 42pt, ticks/legend 34pt) with min_border reservations
    sized correctly — nothing clipped at any canvas edge, ~78% canvas area utilization.
  weaknesses:
  - Plot keeps bokeh's default four-sided outline frame (p.outline_line_color) rather
    than the style guide's preferred L-shaped bottom+left spine treatment — minor
    visual refinement deduction, not a hard rule violation for bokeh.
  - Grid line alpha is set to 0.10, the very bottom of the style guide's 10-15% subtle-grid
    range — barely perceptible at full resolution; nudging to ~0.12-0.15 would aid
    orientation without competing with the data.
  - The stage-boundary stroke lines between stacked bands use line_alpha=0.40, subtle
    enough that band separation relies almost entirely on color contrast — fine today
    with 5 well-separated Imprint hues, but worth strengthening if a future variant
    adds more stages.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark headline "area-cumulative-flow · python · bokeh · anyplot.ai" (~49% of canvas width, no clipping) sits above a lighter gray subtitle "Five delivery stages, 90 days of cumulative Kanban flow". Italic "Date" and "Cumulative Items" axis labels, dark tick labels, subtle 10%-alpha gridlines, and a top-left legend (box with elevated cream fill and thin border) listing Backlog/Analysis/Development/Testing/Done from top to bottom. All chrome elements are clearly visible against the light background.
      Data: Five stacked area bands from bottom (Done, brand green #009E73) to top (Backlog, matte red #AE3030), with Analysis (ochre), Development (blue, rendered near-opaque as the bottleneck focal point), and Testing (lavender) in between. Thin ink-colored boundary lines separate each band. Bands grow left-to-right over the 90-day span with the Development band visibly thicker on the right, showing WIP buildup.
      Legibility verdict: PASS — no overlap, no clipping, no light-on-light text found anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same headline/subtitle hierarchy now rendered in light ink (white bold title, light-gray subtitle) and light-gray tick/axis labels, fully readable against the dark surface. Legend box uses the dark elevated fill (#242420-ish) with light text and a soft border — no dark-on-dark failures anywhere (title, axis labels, tick labels, and legend text were individually checked).
      Data: Identical five-color stack (Done green, Testing lavender, Development blue, Analysis ochre, Backlog red) in the same bottom-to-top order and same hex values as the light render — only the chrome (background, text, grid, legend box) flipped, confirming palette-invariance across themes.
      Legibility verdict: PASS — every text element remains legible; no dark-on-dark or unreadable elements detected.
