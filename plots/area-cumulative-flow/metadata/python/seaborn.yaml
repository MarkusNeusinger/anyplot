review:
  strengths:
  - Idiomatic use of seaborn's modern objects interface (so.Plot/so.Area/so.Stack)
    for the stacked-area CFD, rather than the legacy stackplot API
  - 'Stack order matches CFD convention exactly: Backlog (earliest stage) on top,
    Done (latest stage) on bottom, and the custom legend mirrors that same visual
    order top-to-bottom'
  - 'Smart semantic color use: Done mapped to brand green (#009E73) and Backlog mapped
    to matte red (#AE3030) reads instantly as ''complete'' vs ''bottleneck'', on top
    of satisfying the canonical first-series-is-green rule'
  - The 'Backlog bottleneck' annotation correctly identifies and points at the widening
    band, giving the chart a clear focal point and story
  - Full theme-adaptive chrome (background, ink tokens, grid, legend) correctly threaded
    through sns.set_theme rc params for both light and dark renders
  - 'Clean, flat, reproducible script: single explicit figure, no functions/classes,
    fixed np.random.seed(42), only used imports'
  weaknesses:
  - 'Title is ''area-cumulative-flow · seaborn · anyplot.ai'' but the mandated format
    is ''{spec-id} · {language} · {library} · anyplot.ai'' — the ''python'' language
    segment is missing entirely. Fix: ax.set_title("area-cumulative-flow · python
    · seaborn · anyplot.ai", ...).'
  - 'Two of the five legend entries — Development and Testing — are effectively invisible
    bands: they show a thin sliver only in the first ~2 weeks (Jan 15-29) and then
    vanish completely for the remaining ~75 days in both renders. The data-generation
    logic feeds dev_wip/testing_wip from independent np.random.poisson(4) draws with
    the SAME rate as done_wip''s generator, so np.minimum() collapses their WIP to
    ~0 almost immediately — those two stages never show meaningful queue buildup or
    drain, which undercuts the CFD''s core teaching point (every band''s width = WIP
    in that stage) for 40% of the workflow stages. Fix: give Development and Testing
    distinctly lower throughput rates than their upstream stage (e.g. poisson(3.5)
    and poisson(3.2) vs Analysis''s poisson(5)) so each maintains a visibly nonzero,
    non-trivial band width across the full date range, or shape the WIP with a slower-draining
    function rather than same-rate independent Poisson walks.'
  - Because Development/Testing WIP collapses to near-zero for most of the series,
    the implied real-world scenario is inconsistent — a Kanban stage with zero cycle
    time for 75+ consecutive days is not a plausible dev/test process, undercutting
    the realism of the synthetic data.
  - Legend uses a visible box frame (framealpha=0.9 + explicit edgecolor) which the
    style guide's decoration-removal checklist lists as a candidate for removal on
    minimal/clean layouts — a borderless or lighter-weight legend would read cleaner,
    though this is a minor polish item next to the two issues above.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correctly not pure white.
      Chrome: Title "area-cumulative-flow · seaborn · anyplot.ai" (dark ink, centered), axis labels "Date" / "Cumulative Items" (dark ink), tick labels in softer gray (rotated x-axis date labels: Jan 15, Jan 29, Feb 12, Feb 26, Mar 11, Mar 25, Apr 08), boxed legend (upper-left) listing Backlog/Analysis/Development/Testing/Done with color swatches, "Backlog bottleneck" annotation with arrow pointing into the red band near the end of the series. All text is clearly readable against the light background — no light-on-light issues.
      Data: 5-band stacked area chart, bottom to top: Done (large green #009E73 area, ~0 to ~350 by day 90), Testing (thin lavender sliver, visible only in the first ~2 weeks then vanishes), Development (thin blue sliver, same pattern as Testing), Analysis (ochre #BD8233 band, moderate and growing), Backlog (red #AE3030 band at top, visibly widening toward the end — this is the annotated bottleneck). Only 3 of the 5 bands (Done, Analysis, Backlog) are visually distinguishable for the bulk of the 90-day range; Development and Testing read as an essentially flat line after ~Jan 29.
      Legibility verdict: PASS (all text readable), but Element Visibility is a FAIL for the Development/Testing bands specifically (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correctly not pure black.
      Chrome: Same title/axis labels/ticks now in light ink (#F0EFE8 primary, #B8B7B0 secondary) against the dark background — all clearly legible, no dark-on-dark failures. Legend box uses the elevated dark surface (#242420) with light text, annotation arrow and text rendered in light ink, fully readable.
      Data: Identical band colors and identical shapes to the light render — Done green, Testing lavender, Development blue, Analysis ochre, Backlog red are pixel-for-pixel the same hues as light mode, confirming only chrome (not data colors) flips between themes. Same Development/Testing near-invisibility issue reproduces identically in dark mode (it's a data-generation issue, not a theme-adaptation issue).
      Legibility verdict: PASS (all text/chrome readable, correct theme adaptation), but same Element Visibility concern as light render carries over.
