review:
  strengths:
  - Correct stage stacking order per spec — Backlog (earliest) on top, Done (latest)
    on bottom — with legend traceorder set to 'reversed' so the legend visually matches
    the on-canvas stack order top-to-bottom.
  - 'Deliberate bottleneck narrative baked into the synthetic data: the Testing WIP
    band visibly widens during a modeled QA capacity dip (days 30-64) and narrows
    again during a catch-up burst (days 65-84) — exactly the analytical signal a CFD
    exists to surface.'
  - Theme-adaptive chrome fully threaded through title, axis titles, tick labels,
    gridlines, legend box (bg/border/font) and font color for both light and dark
    renders — no dark-on-dark or light-on-light failures.
  - 'Correct Imprint palette assignment: first trace (Done) is #009E73, remaining
    stages follow canonical order (#C475FD, #4467A3, #BD8233, #AE3030).'
  - hovermode='x unified' with a custom per-stage hovertemplate (stage name, formatted
    date, WIP count) — a genuinely useful interactive touch for a CFD's detail view.
  - Custom biweekly tick marks keep the 90-day date axis readable instead of relying
    on auto-ticks that would either crowd or under-label the axis.
  weaknesses:
  - Each go.Scatter trace passes mode='none' but also sets a 'line' dict (width/color)
    — with mode='none' no stroke is drawn, so the line config is inert/dead code;
    either drop it or switch to a mode that actually renders the boundary stroke if
    a visible band border is intended.
  - The mid-project bottleneck (widening Testing band) is a strong story but has no
    annotation calling it out — a small text annotation or shaded x-range over days
    30-64 would sharpen the data-storytelling focal point further (optional polish,
    not a defect).
