review:
  strengths:
  - 'Stacking order is spec-correct and verified: Backlog (earliest stage) on top,
    Done (latest stage) on bottom, confirmed by re-deriving each band from the cumulative
    arrays.'
  - Exact 3200×1800 canvas confirmed by re-running the script and measuring the output
    PNG.
  - 'Imprint palette compliance verified by pixel sampling: the first series (Done)
    resolves to base color #009E73 under the fill opacity, and the underlying data
    hues are pixel-identical between light and dark renders — only the background
    blend differs.'
  - 'The ''QA capacity crunch'' annotation is genuine data storytelling, not decoration:
    its anchor point is computed as the actual day-of-max Testing-band width (np.argmax),
    placed via chart.margin_box/chart.view coordinate math, with a leader line and
    marker that land exactly on the widened band — directly visualizes the CFD''s
    core purpose (bottleneck identification).'
  - Bolded stroke on the Testing series (stroke_style width=6 vs. default) creates
    deliberate visual hierarchy pointing at the bottleneck stage without cluttering
    the other bands.
  - 'Data integrity verified programmatically: all five cumulative stage arrays are
    monotonically non-decreasing and all five stacked band values are non-negative
    across all 90 days — no rendering artifacts from invalid data.'
  - 'No AR-09 edge clipping: pixel-scanned all four canvas edges on both renders,
    every edge pixel is pure background.'
  - Legible at the 400px mobile thumbnail scale in both themes — title, axis labels,
    legend, and the annotation box text all remain readable.
  weaknesses:
  - 'CONFIRMED BUG — dark-theme grid lines are invisible: custom_style never sets
    guide_stroke_color / major_guide_stroke_color, so pygal.style.Style''s class default
    of ''black'' is used for the y-axis guide lines in both themes. Verified via the
    rendered CSS (`.axis .guide.line{stroke:black}`) and pixel sampling: on plot-dark.png
    the guide dashes are RGB(9,9,8) against a #1A1A17 (RGB 26,26,23) background —
    a contrast delta of only ~17/255, effectively invisible. This is a chrome-must-flip-between-themes
    violation (only the light render''s guide lines are actually visible). Note: prompts/library/pygal.md''s
    ''Grid Opacity'' section is inaccurate — foreground_subtle does NOT drive `.axis
    .guide.line` stroke color in pygal 3.1.3; only the dedicated guide_stroke_color
    / major_guide_stroke_color Style attributes do. Fix: add `guide_stroke_color=INK_MUTED,
    major_guide_stroke_color=INK_MUTED` to the Style(...) call.'
  - 'Minor: the PYGAL_KEEP_STATE comment overstates its necessity. Checked against
    the installed pygal 3.1.3 source (graph/base.py): BaseGraph.teardown() only clears
    self.state when the env var is unset — chart.margin_box and chart.view (used for
    the annotation''s coordinate math) are set at construction time and are never
    torn down regardless of PYGAL_KEEP_STATE. Not a functional bug, just an inaccurate
    code comment.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (verified by pixel sample: RGB 250,248,241).
      Chrome: Title "area-cumulative-flow · python · pygal · anyplot.ai" in dark ink, clearly visible, ~55% of plot width. "Date" x-axis title and "Cumulative Item Count" y-axis title both dark, readable. X tick labels (every 15th day, rotated 30°) and y tick labels (every 20 units) dark and legible. Horizontal dashed guide lines render as a muted dark gray (~RGB 89,88,86) against the light background — subtle but clearly visible. Legend at bottom in one row of 5 items, all readable.
      Data: Five stacked bands bottom-to-top: Done (green, #009E73 base), Testing (purple), Development (blue), Analysis (tan/brown), Backlog (red) — matches the Imprint palette in canonical order, first series confirmed #009E73 by pixel math. A callout box "QA capacity crunch" with a dashed leader line and dot marker sits in empty space above the ramp-up, pointing at the widest point of the Testing band (~day 62), correctly landing in the gap between the Testing/Done boundary and the Analysis/Backlog bands above — no overlap with text or bands.
      Legibility verdict: PASS — all text and data are readable against the light background; no dark-on-dark or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (verified by pixel sample: RGB 26,26,23).
      Chrome: Title, axis titles, tick labels, and legend all render in light ink (near-white), clearly readable against the dark background — no dark-on-dark text failures. HOWEVER: the horizontal dashed guide lines FAIL to adapt — they render as literal black (RGB ~9,9,8) rather than the theme's muted light gray, producing a contrast delta of only ~17/255 against the #1A1A17 background. This is effectively invisible and is a genuine chrome-adaptation bug (see weaknesses) — the y-axis guide lines are the one chrome element that does not flip between themes.
      Data: Confirmed pixel-identical hues to the light render (e.g. the Done band resolves to the same #009E73 base color once the differing background-blend opacity is accounted for) — only the surrounding chrome changed, as required. The annotation box and leader line remain fully legible (white text on a near-black translucent box with a light border).
      Legibility verdict: PASS for all text/data; FAIL for grid-line theme-adaptation only (does not affect text or data readability, but the grid contrast requirement is not met — scored under VQ-07).
