review:
  strengths:
  - 'Stacking order matches the spec exactly: earliest stage (Backlog) is on top,
    latest stage (Done) is on the bottom, and the bottom-up legend order (Done, Testing,
    Development, Analysis, Backlog) mirrors the visual stack.'
  - All pygal Style font sizes are set explicitly (title, axis label, tick label,
    legend, value) and are well-balanced between light and dark renders.
  - 'Palette compliance is perfect: first series (Done) is #009E73, subsequent series
    follow the canonical Imprint order, and the data colors are pixel-identical between
    the light and dark renders — only chrome (background FAF8F1/1A1A17, text, grid)
    flips.'
  - 'The synthetic data tells a real story: a deliberately engineered QA-capacity
    bottleneck produces a visibly widening Testing band mid-period that narrows again
    as capacity recovers, directly demonstrating the spec''s ''widening bands indicate
    bottlenecks'' feature while keeping every cumulative series monotonically non-decreasing.'
  - Clean KISS script structure with np.random.seed(42), only-used imports, and correct
    theme-suffixed output files (plot-{theme}.png/.html).
  weaknesses:
  - 'Design Excellence tops out at a well-configured-default look: colors and font
    sizes follow the mandated palette/style-guide values but nothing pushes past that
    into distinctive, publication-level polish (e.g. no unique typographic treatment,
    no annotation calling out the bottleneck period).'
  - Grid and margins follow style-guide defaults (dashed horizontal guides, margin=80)
    with no extra refinement beyond that baseline — visually correct but not standout.
  - The Testing-band bottleneck is legible from the widening shape alone but is not
    reinforced with an annotation/label (e.g. 'QA capacity crunch'), which would sharpen
    the data-storytelling focal point further.
  - Library Mastery is solid but generic pygal usage (StackedLine + fill, x_labels_major)
    rather than leaning on a feature that is clearly hard to replicate in another
    library.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "area-cumulative-flow · python · pygal · anyplot.ai" is dark, bold, and centered, occupying roughly 60% of the canvas width (well within the 50-70% target). X-axis title "Date" and Y-axis title "Cumulative Item Count" are dark and legible. Tick labels (0-180 on Y, "Jan 02" ... "Mar 17" rotated ~30° on X) are dark and clearly readable. Dashed horizontal gridlines are subtle. Legend sits at the bottom in a single row of 5 entries (Done, Testing, Development, Analysis, Backlog), each with a colored square swatch, fully legible and not overlapping the plot.
      Data: Five stacked bands from bottom to top: Done (green #009E73), Testing (light purple #C475FD), Development (blue #4467A3), Analysis (ochre #BD8233), Backlog (red #AE3030). The Testing band visibly widens from late January through late February/early March (a QA bottleneck) before narrowing again — a clear, legible bottleneck signal. All bands are monotonically non-decreasing with no visual glitches or crossovers.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white text, fully legible against the dark background. Gridlines remain subtly visible. Legend swatches and text at the bottom are light-colored and legible, matching the light render's layout exactly.
      Data: Same five bands in the same order and identical hex colors (#009E73, #C475FD, #4467A3, #BD8233, #AE3030) as the light render — confirmed pixel-for-pixel consistent data coloring; only the chrome (background/text/grid) flips.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly readable against the near-black background.
