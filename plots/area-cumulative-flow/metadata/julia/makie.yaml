review:
  strengths:
  - 'Perfect Imprint palette compliance: first series is #009E73, remaining stages
    follow the canonical order (#C475FD, #4467A3, #BD8233, #AE3030), and data colors
    are pixel-identical between light and dark renders — only chrome flips.'
  - 'Correct CFD semantics: bands are stacked with the earliest stage (Backlog) on
    top and the latest (Done) at the bottom per the spec''s ordering note, and every
    downstream curve is a clamped/shifted copy of the upstream one, guaranteeing the
    monotonic non-decreasing property the spec requires.'
  - 'Thoughtful data engineering: a time-varying dwell ("hiring crunch") drives the
    Development band to widen mid-range and narrow later, giving the chart a genuine
    bottleneck signal instead of uniform bands.'
  - 'Clean, idiomatic Makie code: band! for the stacked areas, thin page-background
    lines! strokes to crisp the boundaries between bands, Legend(fig[1,2], ax, "Stage")
    pulled straight from the axis, and theme tokens threaded through every chrome
    element (spines, grid, ticks, legend).'
  - All font sizes explicitly set (titlesize=20, xlabelsize/ylabelsize=14, tick label
    sizes=12); both renders are fully legible with no overlap, no clipping, and balanced
    X/Y axis label sizing.
  weaknesses:
  - Title reads noticeably small relative to the plot/canvas — at titlesize=20 it
    spans only ~30-35% of the plot width, well under the ~50-70% comfortable range
    for a non-prefixed title. Bumping titlesize to ~22-24 would improve visual hierarchy
    and presence without risking overflow on this short title string.
  - 'Design Excellence is solid but still reads close to a well-configured default
    rather than publication-grade: the daily-granularity band edges have a visible
    sawtooth/jagged look. A light smoothing (e.g. a short rolling mean on the underlying
    cumulative curves, or interpolated line drawing) would give the fills a more polished,
    less noisy silhouette.'
  - The deliberate 'hiring crunch' bottleneck bulge in the Development band (the whole
    diagnostic point of a CFD) is subtle and easy to miss at a glance. Consider strengthening
    the visual emphasis — e.g. a slightly larger dwell amplitude, a subtle vspan!/text!
    callout on the widening window, or a bolder boundary stroke on that band — so
    the viewer immediately sees the bottleneck signal the spec calls out.
  - Library Mastery usage is correct but fairly standard for a Makie area/band chart;
    layering in one more Makie-distinctive touch (e.g. vspan! to shade the bottleneck
    window, or a text! annotation anchored to data coordinates) would better demonstrate
    library-specific capability beyond the base band! primitive.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "area-cumulative-flow · julia · makie · anyplot.ai" centered at top, clearly readable. "Date" x-axis label and "Cumulative Items" y-axis label (rotated) in dark ink, both legible. Tick labels (Mar 03, Mar 18, Apr 02, Apr 17, May 02, May 17 on x; 0/100/200/300 on y) in a softer dark gray, all readable. Subtle horizontal gridlines only, no vertical gridlines, top/right spines removed. Legend titled "Stage" sits to the right of the plot with five color swatches (Backlog, Analysis, Development, Testing, Done), no overlap with the plot.
      Data: Five stacked bands from top to bottom — green (Backlog), lavender (Analysis), blue (Development), ochre (Testing), and matte red (Done, widest, reaching down to the x-axis/zero baseline). Thin off-white separator strokes crisp the boundary between each band. Backlog cumulative count rises from 0 to ~360 over the 90-day span; the Development (blue) band visibly widens mid-chart and narrows again toward the end, showing the intended bottleneck signal. First series (Backlog) renders in #009E73 brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-dark or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light/off-white ink, clearly legible against the dark background. Gridlines remain subtle. Legend box uses the dark elevated background token with light label text, fully readable, no overlap with the plot.
      Data: Identical band colors and stacking order to the light render — green (Backlog), lavender (Analysis), blue (Development), ochre (Testing), matte red (Done) — confirming only chrome (background, text) flips between themes while data colors stay fixed. The same Development-band bottleneck bulge is visible in the same location.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and tick text is light-colored and clearly visible against the near-black background.
