review:
  strengths:
  - 'Full Imprint palette + theme compliance in both renders: first series #009E73,
    canonical order for the remaining four stages, identical data colors across light/dark,
    theme-correct chrome (backgrounds, text, grid, legend box) in both'
  - 'Repair round directly resolved every Attempt 1 weakness: titlesize raised 20→24
    for stronger hierarchy, a 5-day centered moving average (smooth_curve) removed
    the daily-noise jaggedness from band edges, and a vspan!+text! callout now gives
    the bottleneck window an explicit, immediately visible label'
  - 'Correct CFD semantics: stages stacked earliest-on-top/latest-on-bottom per spec,
    cumulative counts monotonically non-decreasing, and the time-varying Analysis→Development
    dwell realistically shows WIP piling up upstream during a capacity crunch — exactly
    how a downstream bottleneck manifests on a single-column-per-stage CFD'
  - 'Clean, idiomatic Makie code: band! for stacked areas, page-background separator
    strokes between bands for crisp boundaries, an axis-derived Legend, and colsize!/grid
    layout — all explicit and theme-token-driven'
  - All font sizes explicitly set, fully legible at full resolution in both themes,
    no overlap, no clipping, legend sits close to the plot
  weaknesses:
  - smooth_curve is a defined function, which strictly violates the KISS Imports→Data→Plot→Save
    (no functions/classes) structure — could be inlined as a broadcasted comprehension
    instead
  - DE-01 aesthetic sophistication is strong but not yet top-tier publication-ready
    — a deeper typographic or fill-treatment pass would push it further
  - 'LM-02: vspan!+text! annotation is a nice touch but not deeply Makie-unique (axvspan/text
    equivalents exist in most static libraries); band! plus the grid-based Figure/colsize!
    layout is the more genuinely distinctive part of this implementation'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "area-cumulative-flow · julia · makie · anyplot.ai" centered at top (titlesize=24, clearly more prominent than Attempt 1's 20pt). "Date" x-axis label and "Cumulative Items" y-axis label both legible in dark ink; tick labels legible in softer dark gray. Subtle horizontal-only gridlines at 100/200/300, top/right spines removed, L-shaped frame. A light grey vspan shades the "Development bottleneck window" behind the bands with a centered caption in soft ink — fully legible, no overlap with data or legend.
      Data: Five smoothly-edged stacked bands top-to-bottom — green Backlog (#009E73), lavender Analysis (#C475FD), blue Development (#4467A3), ochre Testing (#BD8233), matte red Done (#AE3030, widest, reaching the zero baseline) — separated by thin off-white boundary strokes. The Analysis band visibly widens through the shaded crunch window as items queue up waiting for Development capacity, then narrows again toward the end — a realistic depiction of a downstream Development bottleneck on a single-column-per-stage CFD. Legend titled "Stage" sits immediately right of the plot, frameless, all five labels matching the band order.
