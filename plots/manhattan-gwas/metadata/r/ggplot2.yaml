review:
  strengths:
  - Cumulative genomic position (bp_cum) built correctly via cumsum offsets, with
    chromosome tick labels centered on their region via chr_axis center
  - Genome-wide (dashed, red) and suggestive (dotted, amber) threshold lines both
    included per spec, at the correct -log10 values (~7.3 and 5)
  - 'Density-aware marker sizing: small semi-transparent points (size 0.6, alpha 0.65)
    for the ~9,000 background SNPs vs. large opaque red markers (size 2.2) for genome-wide
    significant hits, avoiding overplotting while making true positives pop'
  - Peak simulation includes realistic LD-like decay (-log10 p decreasing with distance
    from the lead SNP) rather than uniform noise, giving plausible peak shapes
  - Theme-adaptive chrome correctly threaded through (background, ink, ink_soft) with
    both renders passing the light/dark legibility check; data colors (green/blue/red)
    identical across themes
  - Proper -log10(p) axis label typeset via expression() with subscript and italic
    p
  - Title format matches the mandated convention exactly
  weaknesses:
  - X-axis chromosome tick labels for 19-22 are tightly packed at fontsize 6.5pt,
    closer together than the rest of the axis - consider nudging fontsize down slightly
    further or using a discontinuous label pattern (e.g. only every other chromosome
    number for 20+) for extra breathing room
  - No lead-SNP or peak annotation (e.g. geom_text/ggrepel label on the top hit per
    locus) - spec calls this optional but it would add a stronger data-storytelling
    focal point and align with real-world GWAS Manhattan plots
  - 'Visual refinement is solid but could go one step further: axis.line is still
    drawn on both axes (theme_minimal default carryover) - dropping it in favor of
    relying purely on grid + ticks would look more polished for this catalog''s minimalist
    chrome standard'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "manhattan-gwas · r · ggplot2 · anyplot.ai" in dark ink, clearly legible. Axis titles "Chromosome" and "-log10(p-value)" (with proper subscript/italic typesetting) in dark ink, legible. Y-axis tick labels (4/8/12/16) legible. X-axis chromosome number labels (1-22) legible, though 19-22 are tightly spaced. Horizontal gridlines at major y-breaks are subtle dark gray, visible but not dominant. Vertical gridlines removed.
      Data: Background SNP cloud alternates green (#009E73, odd chromosomes) and blue (#4467A3, even chromosomes) at small size with partial transparency. Genome-wide significant hits (p < 5e-8) are highlighted in matte red (#AE3030), larger and fully opaque, forming clear peaks on chromosomes 3, 8, 14, and 19. Dashed red genome-wide significance line at ~7.3 and dotted amber suggestive line at 5 are both visible and distinguishable from the data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, axis titles, and tick labels all rendered in light ink (near-white), clearly legible against the dark background. No dark-on-dark issues found on any text element. Gridlines are a light, subtle line at the same major y-breaks, correctly flipped from the light render's dark gridlines.
      Data: Green/blue/red data colors are pixel-identical to the light render - only the chrome (background, text, gridlines) flipped as required. Threshold lines (red dashed, amber dotted) are equally visible against the dark background.
      Legibility verdict: PASS
