review:
  strengths:
  - Cumulative genomic x axis computed with a groupby/cumsum offset, chromosome labels
    centred under each region via scale_x_continuous breaks
  - 'Alternating #009E73/#C475FD chromosomes plus red #AE3030 significant SNPs and
    a matching dashed genome-wide line make the hits stand out in both themes'
  - Theme tokens threaded through every chrome element; both renders read cleanly
  - scale_color_identity with a precomputed colour column keeps the layering simple;
    the HTML export keeps lets-plot's native tooltips
  weaknesses:
  - 'DQ-02 (both): the 15 genome-wide hits on chromosomes 2, 6, 11 and 17 are placed
    at random indices across the whole chromosome, so each ''peak'' spans ~200 Mb
    instead of a locus → place each chromosome''s hits around one or two loci within
    a few Mb, with neighbouring SNPs at intermediate -log10 p. Likely cause: np.random.choice(n_snps_per_chrom,
    size=15) picks indices over the whole chromosome.'
  - 'Suggestion: label the top SNP of each peak with its id (the Notes allow labels
    for significant SNPs).'
  - 'Suggestion: a lets-plot tooltip layout (layer_tooltips) with chromosome, position
    and p-value would enrich the HTML view.'
