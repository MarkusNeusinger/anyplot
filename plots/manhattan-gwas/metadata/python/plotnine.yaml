review:
  strengths:
  - 'Imprint alternation #009E73/#C475FD is identical in both renders and reads cleanly
    on both surfaces'
  - 'Genome-wide threshold drawn in the semantic red #AE3030 and the suggestive threshold
    as a neutral dotted rule, so the two lines rank themselves'
  - Cumulative offsets computed with groupby().max().cumsum().shift() and chromosome
    labels placed at computed midpoints via scale_x_continuous breaks
  - Exact 3200x1800 canvas with theme tokens threaded through every chrome element
  weaknesses:
  - 'VQ-01 (both): chromosome tick labels at 6 pt, below the style guide''s 8 pt reference,
    read small beside the 8 pt y ticks → 8 pt (+2 pt), or 7 pt if 20/21/22 would touch.
    Likely cause: axis_text_x=element_text(size=6).'
  - 'DQ-03 (both): null p-values are drawn from uniform(0.001, 1), so the unassociated
    band stops at exactly -log10 = 3.0 with an artificial empty gap up to 5 → uniform(0,
    1) (or 1e-12 floor) so the null tail reaches ~4-4.5 as in real GWAS of this size.
    Likely cause: rng.uniform(0.001, 1, n_snps).'
  - 'Suggestion: cluster each chromosome''s hits around one locus position so the
    significant signals form the classic towers instead of points scattered along
    the whole chromosome.'
