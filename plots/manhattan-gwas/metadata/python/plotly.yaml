review:
  strengths:
  - 'Faithful Manhattan layout: about 115k variants on a cumulative genomic axis,
    with each chromosome label centered under its own region via tickvals at the computed
    chromosome centers'
  - Alternating Imprint green/blue chromosome bands read the boundaries without separators,
    and significant variants stand out as lavender diamonds with an ink outline, identical
    in both themes
  - Genome-wide (dashed) and suggestive (dotted) threshold lines span all chromosomes
    and carry right-aligned in-place labels with properly typeset p-values (5×10⁻⁸,
    10⁻⁵)
  - Uses go.Scattergl (WebGL) for the 22 dense background traces and customdata-driven
    hovertemplates showing chromosome, bp position and -log₁₀(p) in the HTML
  - Theme tokens threaded through every chrome element; both renders fully readable
  weaknesses:
  - 'VQ-01 (both): x-axis tick labels are set to 9 px, smaller than the 10 px y-axis
    ticks, and the narrow chromosomes 19–22 crowd together at that size, blurring
    in the 400 px thumbnail → 10 px to match the y-axis (+1 px). Likely cause: xaxis
    tickfont size=9.'
  - 'DQ-02 (both): each association peak is an isolated column of 6–10 SNPs jumping
    from the ~2 background straight to -log₁₀(p) 7.5–13, with no flanking variants
    at intermediate significance as linkage disequilibrium produces at a real locus
    → give each peak a tower of neighbouring SNPs whose -log₁₀(p) decays with distance
    from the lead SNP. Likely cause: the peak block overwrites only pvalues[peak_idx-5:peak_idx+5]
    with uniform extreme values.'
  - 'CQ-01 (code): a `p_label()` helper function formats the two threshold labels
    → write the two label strings inline in the threshold list (e.g. "p = 5×10⁻⁸",
    "p = 10⁻⁵"). Likely cause: the def p_label(p) block before the threshold loop.'
  - 'Suggestion: labelling the lead SNP of each peak with a SNP id (the spec''s optional
    snp_id column) would tie the highlight to named loci.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 for paper and plot area.
      Chrome: title "manhattan-gwas · python · plotly · anyplot.ai" centered in dark ink; y-axis "-log₁₀(p-value)" with ticks 0–12, x-axis "Chromosome" with labels 1–22 centered under each chromosome region; subtle horizontal grid, no x grid; legend box top-left with "Significant SNPs" lavender diamond; threshold labels "Genome-wide significance (p = 5×10⁻⁸)" and "Suggestive threshold (p = 10⁻⁵)" in muted gray, right-aligned above their lines. All readable; x ticks at 19–22 are close but legible.
      Data: dense band of small points alternating Imprint green #009E73 / blue #4467A3 per chromosome (0–~4), solid overplotted base (permitted); dashed line at 7.3, dotted line at 5; lavender #C475FD diamonds with dark outline at peaks on chr 2 (~9–12), chr 8 (~7.5–9.5), chr 15 (~9.5–13).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink, ticks in light soft gray, grid faint light lines, legend box on elevated dark background with light border, threshold lines and labels in light muted gray. No dark-on-dark text.
      Data: identical green/blue alternation and lavender diamonds (outline flips to light ink); same positions as light render.
      Legibility verdict: PASS
