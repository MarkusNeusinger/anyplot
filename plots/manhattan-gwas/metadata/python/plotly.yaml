review:
  strengths:
  - Cumulative genomic layout computed from the data (groupby max + cumsum offsets)
    with chromosome labels centered under each region via tickvals/ticktext
  - 'Alternating Imprint green #009E73 and blue #4467A3 chromosomes stay distinct
    in both themes; data colors identical across light and dark renders'
  - Genome-wide (dashed) and suggestive (dotted) threshold lines span all chromosomes
    in INK_MUTED, distinguishable by dash style, named in a horizontal legend above
    the plot so no peak runs into a label
  - Significant SNPs drawn once as lavender diamonds with an INK outline, standing
    out clearly at the three peaks; band of ~117k null variants at size 3 / opacity
    0.7 does not clot the peaks
  - Scattergl (WebGL) for the dense background band plus customdata-driven hovertemplates
    showing chromosome, base-pair position and -log10(p) in the HTML output
  - LD-style signal decay around each lead SNP gives realistic stacked columns at
    associated loci; seeded and deterministic
  weaknesses:
  - 'VQ-02 (both): the tick labels ''20'', ''21'' and ''22'' at the right end of the
    x axis sit almost edge to edge (gap under one character width), so ''21 22'' nearly
    reads as one number → keep a visible gap of at least half a character between
    adjacent chromosome labels, e.g. tick font about 9 px for the axis (−1 px) or
    a slightly wider canvas share for the axis via a smaller left margin. Likely cause:
    xaxis tickfont size=10 with the narrow chromosomes 19–22 (47–64 Mb each).'
  - 'Suggestion: the legend''s ''Significant SNPs'' entry has a wide gap between the
    diamond glyph and its text compared with the line entries; a fixed legend itemwidth
    would even out the spacing.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 for paper and plot area, not pure white.
      Chrome: title "manhattan-gwas · python · plotly · anyplot.ai" centered at top in near-black; horizontal legend above the plot at right (dashed "Genome-wide (p = 5×10⁻⁸)", dotted "Suggestive (p = 10⁻⁵)", lavender diamond "Significant SNPs"); y-axis "-log₁₀(p-value)" 0–13 with subtle horizontal grid; x-axis "Chromosome" with labels 1–22 centered under each region. All text dark and readable; labels 20/21/22 are tightly packed at the right end.
      Data: ~117k variants at size 3, alternating #009E73 green and #4467A3 blue per chromosome, dense band below ~2 with scattered points to ~4.8; tall columns at chr 2, 8 and 15 with significant SNPs as lavender (#C475FD) diamonds with dark outline above the dashed line at 7.3 (top at ~13 on chr 15). Dotted suggestive line at 5. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
