review:
  strengths:
  - Chromosome names sit on the real x axis via FixedTicker + major_label_overrides
    at each chromosome's center, rather than hand-placed labels
  - 'Clear hierarchy of marks: 4 px translucent background SNPs against 11 px opaque
    plum genome-wide hits, with a dashed 7.3 line and a dotted suggestive line distinguishable
    from each other'
  - 'Theme tokens threaded through every chrome element: both renders are fully legible
    with identical Imprint data colors'
  - HoverTool with formatted chromosome, position and -log10(p) for per-SNP inspection
    in the HTML output
  - Vectorized cumulative positions via groupby max + cumsum shift; compact three-group
    plotting loop
  weaknesses:
  - 'DQ-02 (both): the genome-wide significant SNPs are drawn at random indices across
    whole chromosomes (chr2 hits span about 130 Mb, chr6 about 60 Mb) instead of clustering
    at a locus, and the null p-values are floored at 0.001 so nothing lies between
    -log10 3 and 7.3 → cluster each peak''s hits within ~1 Mb of one locus with p-values
    decaying away from the lead SNP, and draw null p-values from Uniform(0, 1). Likely
    cause: np.random.choice over all indices and np.random.uniform(0.001, 1.0).'
  - 'Suggestion: a small text label naming the lead SNP of each peak (the Notes allow
    labeling significant SNPs) would make the hits identifiable in the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area
      Chrome: bold title 'manhattan-gwas · python · bokeh · anyplot.ai' at top left (~50% width), italic axis titles '-log₁₀(p-value)' and 'Chromosome', y ticks 0-12 and chromosome labels 1-22 centered under each region, all in dark ink and readable; subtle horizontal grid only; legend top right on an elevated panel
      Data: ~44,000 SNPs in a dense band up to -log10 ~3, alternating #009E73 (odd) and #C475FD (even) chromosomes; 38 genome-wide significant SNPs in plum #954477 at 8-12 on chromosomes 2, 6, 11, 17; dashed genome-wide line at 7.3 and dotted suggestive line at 5, each labelled at the right ('p = 5×10⁻⁸', 'p = 1×10⁻⁵')
