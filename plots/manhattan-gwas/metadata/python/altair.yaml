review:
  strengths:
  - Cumulative genomic layout from real chromosome lengths with labels centered below
    each region
  - Threshold rules at 7.3 and 5 computed from the p-values
  - Formatted tooltips in the HTML output
  weaknesses:
  - 'VQ-05 (both): canvas is 5058x3000, not the 3200x1800 landscape target → 3200x1800
    (−1858 × −1200). Likely cause: width=1600, height=850 at scale_factor=3.0 without
    the pad-to-target block.'
  - 'VQ-07 (dark): vertical grid lines render as bright near-opaque light lines across
    the data on #1A1A17 → subtle grid from the INK token at ~10 % opacity, or no x
    grid. Likely cause: gridColor/gridOpacity set only on the y axis; x axis uses
    vega defaults.'
  - 'SC-02 (both): chromosomes cycle through six Imprint colors instead of two alternating
    ones (C3) → two alternating colors, #009E73 and #4467A3. Likely cause: color_mapping
    uses IMPRINT[i % 6].'
  - 'SC-04 (both): title is ''Manhattan Plot: GWAS Results'' → ''manhattan-gwas ·
    python · altair · anyplot.ai'', optionally prefixed by a descriptive title. Likely
    cause: the alt.Title text.'
  - 'CQ-04 (code): lines 85-94 append one dict per variant in a Python loop, and ELEVATED_BG,
    RULE and configure_legend are unused with no legend → build columns with vectorized
    pandas (groupby/cumsum offsets) and delete the unused tokens. Likely cause: row-wise
    data assembly.'
  - 'Suggestion: label the top SNP of each genome-wide peak, which the Notes allow.'
