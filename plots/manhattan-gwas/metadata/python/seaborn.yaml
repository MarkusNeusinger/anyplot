review:
  strengths:
  - Uses sns.scatterplot with data=plot_df, hue on chromosome parity and an Imprint
    palette slice counted from the data — the idiomatic seaborn path
  - Chromosome offsets computed vectorized (groupby max, cumsum, shift) so every point
    sits at its base-pair position on the cumulative axis
  - Crowded labels of the small chromosomes are staggered onto a second line, keeping
    all 22 labels centered and readable
  - Significant variants marked with a larger ink-edged point and counted in the legend
    (n = 705); threshold lines differ by dash and weight
  - Theme tokens threaded through set_theme rc; both renders theme-correct on the
    canonical 3200x1800 canvas
  weaknesses:
  - 'DQ-02 (both): every variant inside each 10 Mb peak window is replaced with an
    elevated p-value, so the towers on chromosomes 2, 6 and 11 have a flat floor at
    5.5, 7 and 6 and leave an empty notch in the background band below them, unlike
    a real locus → keep background p-values in the window and elevate a subset with
    a decay from the lead SNP. Likely cause: p_values[peak] = 10 ** (-np.random.uniform(...))
    over the whole window.'
  - 'Suggestion: draw the highlighted significant variants in a color distinct from
    both alternating chromosome colors, so they also stand out on the green chromosome
    11.'
  - 'Suggestion: label the lead SNP of each peak with its snp_id, which the spec offers
    as optional.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
