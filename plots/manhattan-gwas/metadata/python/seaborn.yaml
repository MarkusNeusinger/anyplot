      Data: ~115k variants alternating #009E73 / #C475FD by chromosome; towers on chr 2 (to ~8), chr 6 (to ~12) and chr 11 (to ~9); variants above 7.3 drawn larger in #009E73 with a dark edge; dashed genome-wide line at 7.3, dotted suggestive line at 5.
