review:
  strengths:
  - Cumulative genomic layout built with pandas groupby + cumsum on the chromosome
    end positions, so every variant sits at its own base-pair offset and the 22 chromosomes
    run end to end in order
  - Chromosome tick labels at each region's median position; labels of the narrow
    chromosomes 18, 20 and 22 drop to a second row so every label stays readable without
    overlapping
  - 'Alternating Imprint positions 1 and 2 (#009E73 / #C475FD) read clearly as chromosome
    blocks on both backgrounds, with s=4 and alpha 0.6 for the ~102,000 dense variants'
  - Genome-wide (dashed) and suggestive (dotted) thresholds drawn as distinct theme-adaptive
    axhline layers with a legend; genome-wide hits enlarged with an INK_SOFT ring
    so the peaks stand out above the band
  - Exact 3200x1800 canvas via figsize=(8, 4.5) at dpi=400 without bbox_inches, and
    every chrome element threaded through theme tokens
  weaknesses:
  - 'Suggestion: format the legend thresholds as 5×10⁻⁸ and 1×10⁻⁵ instead of the
    programmer notation 5e-08 / 1e-05.'
  - 'Suggestion: the genome-wide hits on green chromosomes (e.g. 11) share the chromosome''s
    own green; a highlight color distinct from both alternating colors would separate
    them more clearly.'
