review:
  strengths:
  - Correct genome-wide (~7.30) and suggestive (5.0) threshold lines with distinct
    dash styles and clear, descriptive legend labels
  - Theme-adaptive chrome is fully correct in both renders — backgrounds, ink tokens,
    and the RGBAf-based grid alpha all flip correctly while data colors (green/blue
    chromosome alternation, amber highlight) stay identical between light and dark
  - Significant SNPs are visually distinguished with a larger amber marker and a subtle
    ink stroke, immediately drawing the eye to genome-wide hits
  - Baseline SNP marker size (4) and alpha (0.75) reduce overplotting appropriately
    for the dense point cloud
  - Clean removal of top/right spines, subtle horizontal-only grid, and a frameless
    legend consistent with the style guide's minimalism principles
  - Chromosome tick labels are correctly centered under their cumulative-position
    region via chrom_centers
  weaknesses:
  - Total SNP count (~42,400 = sum of chromosome lengths ~3,029 Mb x 14 SNPs/Mb) is
    well below the spec's stated typical GWAS scale of 100,000-1,000,000+ variants
    — increase snps_per_mb (e.g. to ~35-40) to land near or above 100k variants, retuning
    markersize/alpha if the denser cloud needs it
  - X-axis tick labels for the short chromosomes (18, 19, 20, 21, 22, X) are tightly
    packed at the right edge of the axis — double-check legibility at ~400px mobile
    width once the point density increases, and reduce xticklabelsize slightly if
    they start to crowd
  - The spec calls out that significant SNPs may optionally be labeled by snp_id —
    none are labeled here; adding a direct text label for the single strongest hit
    per peak chromosome would sharpen data storytelling (DE-03) and feature coverage
    (DQ-01) without simulating any interactive functionality
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "manhattan-gwas · julia · makie · anyplot.ai" centered at top, clearly legible; "Chromosome" x-axis title and "-log10(p-value)" y-axis title in dark ink; tick labels (chromosome numbers 1-22, X; y-axis 0/5/10) in a softer dark gray, all readable; top-left legend box (semi-opaque cream) lists "Genome-wide significant SNP", "Suggestive (p < 1x10^-5)", "Genome-wide significance (p < 5x10^-8)" in dark, readable text.
      Data: Baseline SNP cloud alternates green (#009E73-style) and blue by chromosome; amber/khaki markers highlight genome-wide-significant hits at chromosomes 2, 6, 9, 17, and X; dotted gray suggestive line at y=5; dashed amber genome-wide threshold line at y~7.3.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light/off-white tones and remain clearly legible; legend box background flipped to a dark elevated tone with light text, still fully readable; grid lines are subtle light-on-dark.
      Data: Same alternating green/blue chromosome coloring and same amber highlight color as the light render — data colors are identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly visible against the near-black background.
