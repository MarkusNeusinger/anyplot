review:
  strengths:
  - 'Correct Manhattan-plot structure: cumulative genomic position on the x-axis,
    -log10(p) on the y-axis, alternating chromosome colors, and both the genome-wide
    (p<5e-8) and suggestive (p<1e-5) threshold lines are all present and correctly
    positioned.'
  - Deterministic LCG + Box-Muller PRNG with a fixed seed produces reproducible data;
    injected peaks on chromosomes 2, 6, 11, and 17 create a realistic, legible pattern
    of significant loci above the genome-wide threshold.
  - Theme-adaptive chrome (t.ink, t.inkSoft, t.grid) is threaded through title, axis
    labels, ticks, and legend, and reads correctly in both the light and dark renders.
  - Custom afterBuildTicks callback plus a tick-label callback correctly centers each
    chromosome's label under its cumulative-position midpoint range - non-trivial,
    idiomatic Chart.js usage combining scatter and line dataset types in one chart.
  - Title exactly matches the mandated `manhattan-gwas · javascript · chartjs · anyplot.ai`
    format, and legend labels clearly describe each series (even/odd chromosome bands,
    significant hits, both threshold lines).
  weaknesses:
  - 'Palette order deviates from the Imprint canonical sequence without a real-world
    semantic justification: the even-chromosome series uses palette[2] (blue #4467A3)
    instead of palette[1] (lavender #C475FD), skipping a slot for aesthetic reasons.
    Chromosome parity has no inherent color association, so the style guide''s ''use
    positions 1->N in order, don''t cherry-pick'' rule applies - switch the odd/even
    bands to palette[0]/palette[1].'
  - The dense background scatter (~4,600 points across 23 chromosomes) uses a fixed
    pointRadius of 2.5 with no reduced opacity. Per the data-density heuristic, datasets
    above ~500 points should pair small markers with alpha < 1 to reduce visual clutter,
    especially in the vertically stacked peak regions.
  - 'Design Excellence lands close to a well-configured default: styling is clean
    but there is no strong additional focal point (e.g., a labeled top hit, or heavier
    visual emphasis on the most significant peak) to sharpen the data-storytelling
    beyond color + threshold lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "manhattan-gwas · javascript · chartjs · anyplot.ai" in bold dark ink at top, fully visible and not clipped. Y-axis title "-log10(p-value)" and x-axis title "Chromosome" in dark ink, both clearly legible. Chromosome tick labels (1-22, X) centered below their respective bands, legible at this size. Y-axis grid lines are subtle horizontal light-gray lines; x-axis has no grid (by design). Legend at the bottom with 5 entries (Chr (even), Chr (odd), Genome-wide significant, Genome-wide (p < 5e-8), Suggestive (p < 1e-5)) in soft dark text, fully readable.
      Data: First series (Chr even) renders in brand green #009E73, second series (Chr odd) renders in blue #4467A3 (note: this skips the canonical palette[1] lavender slot), significant hits render in matte red #AE3030, matching the dashed genome-wide threshold line color. Four clear peaks rise above the genome-wide dashed red line on chromosomes 2, 6, 11, and 17, exactly matching the peaks injected in code. Background noise points are small and cover 0-4 on the y-axis with light overlap.
      Legibility verdict: PASS - all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title and both axis titles render in light/off-white ink, clearly visible against the dark background. Tick labels and legend text render in a lighter soft gray, fully legible. Grid lines are subtle light-toned horizontal lines on the y-axis, matching the light render's grid placement.
      Data: Data colors are pixel-identical to the light render - brand green, blue, and matte red for the three point series, with the same dashed/dotted threshold-line colors (matte red genome-wide line, off-white suggestive line, which correctly flips to a light tone for dark-theme visibility). The same four peaks are visible in the same x-positions as the light render, confirming positional consistency between renders.
      Legibility verdict: PASS - no dark-on-dark failures observed; all title, axis, tick, and legend text is clearly visible against the near-black background.
