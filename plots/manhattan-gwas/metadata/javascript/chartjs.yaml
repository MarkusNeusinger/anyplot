review:
  strengths:
  - 'Correct Manhattan-plot structure: cumulative genomic position on the x-axis,
    -log10(p) on the y-axis, alternating chromosome colors, and both the genome-wide
    (p<5e-8) and suggestive (p<1e-5) threshold lines are present and correctly positioned.'
  - 'Palette order now follows the canonical Imprint sequence: even-chromosome points
    use palette[0] (#009E73 green) and odd-chromosome points use palette[1] (#C475FD
    lavender) - directly resolves the prior review''s VQ-07 deduction (previously
    palette[2] blue was used for the second series).'
  - New 'Top hit — Chr 17' star marker + text-callout plugin (afterDatasetsDraw, clamped
    inside chartArea) creates a clear focal point and visual hierarchy, directly resolving
    the prior review's DE-03 data-storytelling weakness.
  - Dense background scatter (~4,600 points across 23 chromosomes) now uses alpha-reduced
    markers (hexToRgba at 0.65) at a small 2.5px radius, appropriately combating overplotting
    per the data-density heuristic - resolves the prior VQ-03 note.
  - Theme-adaptive chrome (t.ink, t.inkSoft, t.grid) is threaded through title, axis
    labels, ticks, and legend, and reads correctly in both light and dark renders
    with pixel-identical data colors.
  weaknesses:
  - DE-01 is strong but still short of full publication-level polish - consider a
    slightly more refined typographic hierarchy (e.g., lighter tick-label weight relative
    to bold axis titles) to push past 'strong design' into top-tier territory.
  - Significant hits and the genome-wide threshold line both use palette[4] (#AE3030
    red), which is a reasonable semantic choice (danger/significance) but skips palette[2]/[3]
    in the strict sequential order - acceptable as a semantic exception, but worth
    a second look if future review passes want strict canonical sequencing across
    all series.
  - The y-axis-only grid is subtle and appropriate, but in the dark render it could
    be dialed a touch further toward the background for an even more publication-ready
    feel.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "manhattan-gwas · javascript · chartjs · anyplot.ai" in bold dark ink at top, fully visible, not clipped. Y-axis title "-log10(p-value)" and x-axis title "Chromosome" in dark ink, both clearly legible. Chromosome tick labels (1-22, X) centered below their respective bands. Y-axis grid lines are subtle horizontal light-gray lines; x-axis has no grid (by design). Legend at the bottom with 6 entries (Chr (even), Chr (odd), Genome-wide significant, Genome-wide (p < 5e-8), Suggestive (p < 1e-5), Top hit (Chr 17)) in soft dark text, fully readable.
      Data: First series (Chr even) renders in brand green #009E73 (palette[0]), second series (Chr odd) renders in lavender #C475FD (palette[1]) - correct canonical order, resolving the prior review's palette-order weakness. Significant hits and the genome-wide dashed line render in matte red (palette[4], semantic "danger" exception). A gold/amber star marker with a black outline marks the single top hit on chromosome 17, with a "Top hit — Chr 17" text callout placed just above it, clamped within the plot area and not overlapping any other element. Background noise points (~4,600, alpha 0.65) are small and cover 0-4 on the y-axis with light, expected overlap.
      Legibility verdict: PASS - all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title and both axis titles render in light/off-white ink, clearly visible against the dark background. Tick labels and legend text render in lighter soft gray, fully legible. Grid lines are subtle light-toned horizontal lines on the y-axis, matching the light render's placement. The suggestive-threshold line correctly flips from dark gray to an off-white dashed line for dark-mode visibility.
      Data: Data colors are pixel-identical to the light render - brand green, lavender, and matte red for the three point series, plus the same amber/black-outlined star for the top hit and its text callout (rendered in light ink here). The same four peaks (chromosomes 2, 6, 11, 17) are visible at the same x-positions, confirming positional consistency between renders.
      Legibility verdict: PASS - no dark-on-dark failures observed; all title, axis, tick, legend, and callout text is clearly visible against the near-black background.
