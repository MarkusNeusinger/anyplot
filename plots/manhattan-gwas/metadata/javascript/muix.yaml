review:
  strengths:
  - 'Cumulative genomic x axis built natively: tickInterval at the 22 chromosome centers
    with a valueFormatter that maps each center to its chromosome label, so every
    label sits centered under its own region'
  - Alternating brand green / lavender per chromosome reads chromosome boundaries
    without separators, identical in both themes; significant variants take Imprint
    blue at a larger marker size and stand clearly above the null band
  - 'Both thresholds drawn with ChartsReferenceLine and clearly distinguished: genome-wide
    line in ink with a long dash at 7.30, suggestive line in soft ink with a fine
    dot at 5.0, each with an end-aligned label'
  - Lead-SNP labels are drawn in a custom SVG layer positioned with the useXScale/useYScale
    hooks, sitting exactly above each locus peak
  - Library-native tooltips via the series valueFormatter (SNP, chromosome, p-value)
    add inspection in the HTML output; disableHitArea and skipAnimation keep the static
    render clean
  - Theme tokens threaded through every chrome element; all text readable in both
    renders
  weaknesses:
  - 'Suggestion: a denser simulated genome (closer to the 100,000+ variants the Data
    section calls typical, with a smaller marker) would show the characteristic clotted
    null band of a real GWAS.'
  - 'Suggestion: the gap between the chromosome tick labels and the x-axis title could
    shrink by lowering the x-axis band height slightly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white plot panel.
      Chrome: dark bold title "manhattan-gwas · javascript · muix · anyplot.ai" top-left with a soft-ink subtitle (1,090 variants, 68 significant, lead SNP labelled); y axis "−log₁₀(P-value)" 0–16, x axis "Chromosome" with labels 1–22 centered under each region; subtle horizontal grid. All text readable.
      Data: alternating #009E73 green and #C475FD lavender points per chromosome (alpha 0.75, small), three association columns on chr 6, 11, 17 whose points above 7.3 are larger #4467A3 blue; dashed ink genome-wide line at 7.3 labelled "Genome-wide significance, p < 5.0e-8", dotted soft-ink suggestive line at 5 labelled "Suggestive, p < 1.0e-5"; bold lead labels "rs5476441 · p = 1.3e-15", "rs7567057 · p = 7.0e-11", "rs9784377 · p = 5.3e-13" above each peak.
