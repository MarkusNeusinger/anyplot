review:
  strengths:
  - Realistic, deterministic simulated GWAS data with chromosome lengths that closely
    track real human chromosome proportions (chr1≈248Mb down to chr22≈50Mb)
  - Three distinct association peaks (chr6, chr11, chr17) with proper distance-based
    signal decay around each locus, plus a borderline point near the suggestive-only
    threshold on chr11 — good coverage of null/suggestive/significant regimes
  - Correct genome-wide significance (-log10(5e-8)≈7.3) and suggestive (-log10(1e-5)=5)
    threshold reference lines, both clearly labeled with their p-value convention
  - Theme-correct rendering in both light and dark renders — no dark-on-dark or light-on-light
    failures, no clipping at any canvas edge (title, axis ticks, legend, and threshold
    labels all comfortably inside bounds)
  - 'Idiomatic MUI X usage: ChartsReferenceLine for thresholds, custom tickInterval
    + valueFormatter mapping cumulative position to chromosome labels, disableVoronoi
    and skipAnimation correctly set per the harness contract'
  weaknesses:
  - 'VQ-07: the ''Even chromosomes'' series uses t.palette[2] (blue #4467A3) instead
    of the canonical t.palette[1] (lavender #C475FD) — skips a palette position out
    of canonical order. Odd/even chromosome parity is an abstract binary category
    (like anonymous groups A/B), not a real-world color cue (grass=green, blood=red),
    so the semantic-exception carve-out doesn''t apply here. Fix: use t.palette[1]
    for the second series, or use the canonical order.'
  - 'VQ-03: with ~1000 total points (high-density regime per the style guide), the
    dense association-peak clusters on chr6/chr11/chr17 have markers overlapping with
    no transparency, making individual points hard to distinguish within the peaks.
    Add alpha (e.g. ~0.7-0.8) via marker opacity to combat overplotting in the peaks
    while keeping the sparse baseline scatter fully opaque, or use per-point opacity.'
  - 'VQ-01/DE-01: the title measures only ~31% of canvas width at the current 22px
    size, well under the ~50-70% guideline (or ~70-85% expected for this length of
    mandated title string) — a modest fontsize increase would strengthen visual hierarchy
    without risking overflow (there''s ample headroom before the 90% overflow limit).'
  - 'DE-01/DE-02: overall polish is clean but close to MUI X''s configured defaults
    — consider a stronger visual accent distinguishing genome-wide-significant points
    (e.g. a third highlight color or larger marker for points above the genome-wide
    threshold) to sharpen the data storytelling around the actual GWAS hits.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "manhattan-gwas · javascript · muix · anyplot.ai" centered at top; a top-center legend with "Odd chromosomes" (green swatch) and "Even chromosomes" (blue swatch); Y-axis "-log10(p-value)" from 0-16 with subtle horizontal gridlines; X-axis "Chromosome" with tick labels 1-22 centered under each chromosome's cumulative-position span. Two labeled horizontal dashed reference lines: an amber line at ~7.3 ("Genome-wide significance (p < 5×10⁻⁸)") and a dark dashed line at 5 ("Suggestive (p < 1×10⁻⁵)"). All text is dark ink on the light background and clearly legible; no clipping at any canvas edge (verified via pixel crop of title, bottom axis, left axis, and right-edge threshold labels).
      Data: Alternating green (#009E73, odd chromosomes) and blue (#4467A3, even chromosomes) scatter points arranged by cumulative genomic position. A dense baseline cloud sits near y=0-2 across the whole genome; three clear association peaks rise well above the genome-wide threshold on chr6 (blue, tallest point ~16), chr11 (green, ~11.5), and chr17 (green, ~12.3), with one borderline chr11 point just below the significance line. Peak clusters show visible point overlap with no alpha applied.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis labels, now rendered in light/white text — clearly readable against the dark background, no dark-on-dark failures observed anywhere (title, legend, axis titles, tick labels, and both threshold-line labels all confirmed legible). Gridlines are subtle light lines at low opacity. The amber genome-wide-significance line keeps its amber color (reads well on dark); the suggestive line switches from dark-gray to a light dashed line so it stays visible against the dark background.
      Data: Green (#009E73) and blue (#4467A3) data points are visually identical to the light render — same hues, same positions, same peak shapes on chr6/chr11/chr17. Only the chrome (background, text, gridlines, one threshold-line color) adapted to the theme, confirming the palette is theme-independent as required.
      Legibility verdict: PASS.
