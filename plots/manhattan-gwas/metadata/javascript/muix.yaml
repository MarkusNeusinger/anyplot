review:
  strengths:
  - 'Fixed all three attempt-1 weaknesses: ''Even chromosomes'' now uses the canonical
    t.palette[1] (lavender) instead of skipping to palette[2]'
  - Added 80% alpha (MARKER_ALPHA = "CC") to all series to combat overplotting in
    the dense association-peak clusters
  - New dedicated amber-highlighted 'Genome-wide significant' series (larger markerSize=5
    vs 3) creates a clear, immediate focal point on the actual GWAS hits, directly
    sharpening the data storytelling
  - Realistic, deterministic simulated GWAS data with chromosome lengths tracking
    real human chromosome proportions, three distinct association peaks with proper
    distance-based signal decay, plus a borderline suggestive-only point
  - Theme-correct in both renders — no dark-on-dark/light-on-light issues, no edge
    clipping
  - 'Idiomatic MUI X usage: ChartsReferenceLine for both threshold lines, custom tickInterval
    + valueFormatter for chromosome-center labels, disableVoronoi + skipAnimation
    per the harness contract'
  weaknesses:
  - 'VQ-01: title still measures only ~37% of canvas width — improved from ~31% in
    attempt 1 but still under the ~50-70% guideline; a further fontsize bump has headroom
    before overflow'
  - 'DE-02: grid and spine styling are minimal-but-default MUI X chrome; still room
    for further visual refinement polish'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "manhattan-gwas · javascript · muix · anyplot.ai" centered at top (fontSize 26, explicit). Top-center legend with three swatches: green "Odd chromosomes", lavender "Even chromosomes", amber "Genome-wide significant". Y-axis "-log10(p-value)" 0-16 with subtle horizontal-only gridlines; X-axis "Chromosome" with tick labels 1-22 centered under each chromosome's cumulative-position span. Two labeled dashed reference lines: amber "Genome-wide significance (p < 5×10⁻⁸)" at ~7.3, muted-ink dashed "Suggestive (p < 1×10⁻⁵)" at 5.
      Data: First series green (#009E73) = odd chromosomes, second series lavender (#C475FD, palette[1]) = even chromosomes, third series amber = genome-wide-significant hits (larger markers, alpha ~80%). Dense baseline cloud near y=0-2 across the full genome, plus three clear amber-highlighted association peaks on chr6 (~16), chr11 (~11.5), chr17 (~12.3), and one borderline point just under/over the significance line on chr11.
      Legibility verdict: PASS — all text dark-on-light and clearly readable, no clipping at any canvas edge, no overlap between reference-line labels and data/legend.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, and axis labels now rendered in light ink — clearly legible, no dark-on-dark failures anywhere. Gridlines are subtle light lines at low opacity. The amber threshold line keeps its color; the suggestive line switches to a light dashed style to stay visible against the dark background.
      Data: Green (#009E73), lavender (#C475FD), and amber significant-hit markers are pixel-identical in hue and position to the light render — only chrome (background, text, grid) adapted to the theme, exactly as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues; brand green and amber remain clearly visible on the dark surface.
