review:
  strengths:
  - Chromosome lengths approximate real GRCh38 values (chr1=248.9Mb, chr2=242.2Mb,
    etc.), and cumulative genomic position is correctly computed with chromosome tick
    labels centered on each region.
  - 'Both required threshold lines present and correctly labeled: genome-wide significance
    (p=5x10^-8, ~7.3) in semantic matte-red, plus the optional suggestive threshold
    (p=1x10^-5, =5) in muted grey.'
  - First alternating color is brand green (#009E73) per the Imprint hard rule; the
    second color is blue (#4467A3), which matches the spec's own 'e.g., blue/gray'
    suggestion for adjacent-chromosome alternation.
  - 'Full theme adaptivity: background, title, axis labels, tick labels, grid, and
    threshold-line labels all flip correctly between light (#FAF8F1) and dark (#1A1A17)
    with no dark-on-dark or light-on-light failures.'
  - Marker size (r=2.2) and opacity (0.85) are well-tuned for the ~5.7k-point density,
    keeping the null-distribution 'sea of points' band readable without heavy overplotting.
  - 'Idiomatic D3 usage: data-join with .join(''circle''), scaleLinear/scaleOrdinal,
    and axisBottom with custom tickValues/tickFormat mapped to chromosome midpoints.'
  - Deterministic LCG (seed=42) for reproducible data; title format exactly matches
    'manhattan-gwas . javascript . d3 . anyplot.ai'.
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level rather than publication-ready:
    no visual emphasis distinguishes genome-wide-significant SNPs from the rest of
    the data beyond the shared chromosome banding color -- consider a subtle outline,
    size bump, or label on points crossing the genome-wide threshold to sharpen the
    focal point (spec explicitly allows this: ''Significant SNPs above threshold may
    be labeled or highlighted with different color'').'
  - No annotation calls out the strongest peak(s) (e.g. an SNP id or chromosome:position
    label near the chr6 or chr2 peaks) -- a single well-placed callout would turn
    this from 'data displayed' into a clear guided insight (DE-03).
  - Point count (~5,700 variants) is far below the 100k-1M typical GWAS scale noted
    in the spec; while a full-scale SVG render would be too heavy for the browser
    harness, consider increasing the background-noise density somewhat (e.g. 5-10x)
    to make the null band read more like a dense GWAS scan and less like a sparse
    scatter.
  - 'Library Mastery is generic-D3: the implementation could lean on a more distinctive
    D3-only technique (e.g. d3-quadtree/hexbin for the dense null band, or a d3.forceSimulation-based
    label layout to avoid future overlap when adding SNP callouts) to better showcase
    D3''s low-level flexibility versus a higher-level charting library.'
  - Threshold-line labels are relatively small (13px) and the suggestive-threshold
    line/label (muted grey) is quite low-contrast against the background -- intentional
    per its 'secondary' semantic role, but worth confirming it stays legible at mobile
    scale (~400px width).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "manhattan-gwas · javascript · d3 · anyplot.ai" in bold dark ink, centered near top. Y-axis label "−log₁₀(p-value)" rotated at left, "Chromosome" x-axis label centered below tick labels. Subtle horizontal gridlines (light grey, low opacity). Tick labels (1–22, X) all legible and evenly spaced under their chromosome regions. All text is dark ink against the light background — fully readable.
      Data: Points alternate between brand green (#009E73) and blue (#4467A3) by chromosome, correctly starting with green on chromosome 1. Five distinct peaks rise above the background noise on chromosomes 2, 6, 9, 11, and 17, several crossing the red dashed genome-wide-significance line (~7.3) and one (chr9) staying near the grey suggestive line (5). Genome-wide threshold line/label in semantic matte red (#AE3030); suggestive threshold line/label in muted grey — both clearly distinguishable from data colors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title now rendered in light/near-white ink, fully legible. Axis labels and tick labels switch to light grey/white tones, gridlines switch to a faint light-grey overlay. Threshold labels: genome-wide line stays a similar red hue that reads clearly against the dark background; suggestive line/label switches to a light grey that is visible (not dark-on-dark).
      Data: Same green/blue alternating chromosome coloring, pixel-identical to the light render — confirms data colors are constant across themes. Peaks at the same chromosomes/heights.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; brand green remains clearly visible on the dark surface.
