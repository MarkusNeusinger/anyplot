review:
  strengths:
  - Full chromosome vocabulary (1-22, X, Y, MT) with Mb-proportional region widths,
    addressing the prior review's missing-X/Y/MT weakness
  - Density-scaled SNP count (~15/Mb, ~46k points total) produces a realistic background
    cloud, a large jump from the ~4,400 flat-per-chromosome points in the previous
    attempt
  - Subtle alternating plotBands per chromosome region reinforce boundaries beyond
    point color alone, directly addressing the prior DE-01 feedback
  - Both required threshold lines present (genome-wide 5x10-8 dashed, suggestive 1x10-5
    dotted) with color-matched, right-anchored labels kept clear of peaks via 5% x-axis
    headroom
  - Genome-wide-significant SNPs pulled into a separate series with larger marker
    radius and top z-index, giving a size + position cue redundant with color (mitigates
    red/green colorblind ambiguity)
  - Theme tokens threaded correctly end-to-end -- data colors identical between light/dark
    renders, only chrome flips
  - 'turboThreshold: 0 correctly set for large array-of-arrays series data; deterministic
    LCG (seed 42) makes the browser-side data reproducible without a native RNG seed'
  weaknesses:
  - Total point count (~46k, from 15 SNPs/Mb) is still below the spec's stated 100k-1M
    'typical' GWAS scale; this is a reasonable, documented tradeoff for un-boosted
    SVG scatter rendering given the library rule against add-on modules (Boost included),
    not a simple parameter fix
  - Design Excellence still leans mainly on the mandated Imprint tokens (green/blue/red/amber)
    plus alpha-blending and the new plotBands as the main differentiators from a default
    chart
  - At small (400px) card-preview scale the 25 x-axis chromosome tick labels become
    nearly illegible -- an inherent tradeoff of a Manhattan plot's category count
    at that width rather than a specific font-sizing defect
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark-ink title "manhattan-gwas · javascript · highcharts · anyplot.ai" centered at top, ~55-60% of plot width. Axis titles "Chromosome" (x) and "-log10(p-value)" (y) in soft dark-gray, tick labels for all 25 chromosome groups (1-22, X, Y, MT) legible along the x-axis, numeric y-axis ticks 0-14 legible. Subtle horizontal-only gridlines; alternating light/darker vertical plotBands mark chromosome region boundaries. Legend at bottom lists "Odd chromosomes", "Even chromosomes", "Genome-wide significant" with matching color swatches, fully readable.
      Data: Odd chromosomes render in Imprint brand green (palette[0], ~0.6 alpha), even chromosomes in a blue-violet (palette[2], ~0.6 alpha) forming a dense null-distribution cloud below the thresholds; five clear peaks (chromosomes ~2, 6, 11, 15, 19) rise above the red dashed genome-wide-significance line (~7.3) and are recolored solid red with a larger marker radius. A dotted gold "Suggestive" line sits at y=5. Threshold labels are right-anchored and never collide with a peak. First categorical series confirmed = brand green #009E73.
      Legibility verdict: PASS -- all title, axis, tick, legend, and threshold-label text reads clearly against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same layout; title and axis/tick text flip to white/light-gray, fully legible. Alternating plotBands now show as subtle darker/lighter charcoal stripes marking the same chromosome boundaries. Legend text flips to light-gray and remains legible.
      Data: Colors are pixel-identical to the light render (brand green odd, blue-violet even, red significant, gold suggestive line, red genome-wide line) -- confirms only chrome flipped, not data colors.
      Legibility verdict: PASS -- no dark-on-dark failures found; every text element (title, axis titles, tick labels, threshold labels, legend) is clearly visible against the dark surface. Brand green remains clearly visible on the dark background.
