review:
  strengths:
  - 'Correct Manhattan-plot construction: cumulative genomic position on the x-axis,
    alternating odd/even chromosome colors, and a tickPositions + formatter combo
    that maps each chromosome''s midpoint back to its label'
  - Both required threshold lines present — genome-wide significance (5x10^-8, dashed)
    and the optional suggestive line (1x10^-5, dotted) — each with an inline label
    color-matched to its line
  - Significant SNPs are pulled into a separate series with a distinct color (palette[4])
    and a larger marker radius, creating a clear visual hierarchy above the threshold
  - 'turboThreshold: 0 correctly set to allow large point arrays per series, and Highcharts.color().setOpacity()
    is used to alpha-blend overlapping background points'
  - 'Theme tokens threaded correctly end-to-end: identical data colors in light/dark,
    only chrome (background, ink, grid) flips, background is transparent over the
    correct page color'
  - Approximate real human autosome lengths (in Mb) used for chromosome region widths,
    giving the x-axis realistic proportions
  weaknesses:
  - Dataset covers only chromosomes 1-22 (no X/Y/MT) and totals ~4,400 points (200/chromosome),
    far below the spec's stated 100k-1M variant scale for GWAS - the background noise
    cloud reads noticeably sparser than a real Manhattan plot. Consider raising snpsPerChrom
    (e.g. 2,000-5,000/chromosome) if render performance allows.
  - Design Excellence leans mostly on the mandatory Imprint palette plus the significance
    highlight; there's no additional refinement (e.g. subtle alternating background
    shading per chromosome region, or a lighter treatment for the dense null-distribution
    cloud vs. the peaks) to push the storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct chrome tone.
      Chrome: Title "manhattan-gwas · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible. Axis titles ("Chromosome", "−log10(p-value)") and tick labels in soft dark gray, all readable. Horizontal gridlines subtle. Genome-wide significance line (red dashed) and suggestive line (gold dotted) each carry an inline label in matching color, both legible against the light background.
      Data: Odd chromosomes in teal-green (#009E73, first categorical series), even chromosomes in blue-violet, both at ~0.75 alpha to soften overlap in the dense null cloud near y=0. Genome-wide-significant SNPs in a saturated red/crimson, clustered as peaks on chromosomes 2, 6, 11, 15, and 19.
      Legibility verdict: PASS - all text and data reads clearly on the light surface.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct chrome tone.
      Chrome: Title in white/light ink, clearly legible. Axis titles and tick labels in light gray, all readable against the dark background - no dark-on-dark issues found. Gridlines subtle but visible. Threshold-line labels (red and gold) remain legible on the dark surface.
      Data: Same teal-green, blue-violet, and red hues as the light render - data colors are identical between the two themes, confirming only chrome flipped.
      Legibility verdict: PASS - no dark-on-dark or contrast failures observed.
