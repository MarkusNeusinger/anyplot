review:
  strengths:
  - 'Correct Imprint palette application: brand green and lavender alternate by chromosome,
    matte red is used semantically for genome-wide significant SNPs, and both renders
    keep data colors identical across themes'
  - Density-adaptive marker sizing (symbolSize 6 / opacity 0.75 for the ~500k background
    SNPs vs. symbolSize 8 / opacity 0.95 for significant hits) creates immediate visual
    hierarchy that highlights the peaks
  - Idiomatic use of ECharts' markLine to draw and label both the genome-wide (7.3)
    and suggestive (5) threshold lines directly on the chart
  - Clever use of customValues + formatter on a value-type xAxis to center chromosome
    tick labels over their cumulative-position region without a category axis
  - Realistic, factually grounded simulated GWAS data (approximate GRCh38 chromosome
    lengths, varied peak heights/widths including a suggestive-only peak) covering
    the full feature set the spec asks for
  - Theme-adaptive chrome (ink/inkSoft/grid tokens) correctly threaded through title,
    axes, and markLine labels in both themes
  weaknesses:
  - No legend ties the red 'Genome-wide significant' points or the two alternating
    chromosome colors to a label; the meaning is inferable from convention and the
    markLine labels, but an unfamiliar reader has no explicit key for the point colors
  - markLine threshold labels use fontSize 13, slightly under the ~14px tick-label
    baseline used elsewhere in the chart — legible but could be bumped for consistency
  - Visual design is strong but stays close to a standard textbook Manhattan-plot
    layout without extra distinguishing polish (e.g. no labeling of the top SNP per
    peak, which the spec lists as optional)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "manhattan-gwas · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Y-axis name "-log10(p)" top-left, x-axis name "Chromosome" centered below tick labels. Tick labels (0-18 on y, chromosome numbers 1-22/X on x) all legible in soft dark-gray ink. Two dashed threshold lines labeled "Genome-wide (p<5×10⁻⁸)" and "Suggestive (p<1×10⁻⁵)" are readable and do not collide with tick labels or data.
      Data: Dense scatter of SNPs alternating brand green (#009E73) and lavender (#C475FD) by chromosome, with matte red (#AE3030) points marking genome-wide-significant hits above the 7.3 threshold line — six visible peaks of varying height/width, one suggestive-only peak on chr12 that stays below the genome-wide line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis names, and tick labels now rendered in light ink/soft-gray, clearly readable against the dark background. No dark-on-dark text anywhere. Threshold-line labels remain legible.
      Data: Data point colors (green, lavender, matte red) are identical to the light render — only the chrome (background, text, grid, threshold-line hue readability) adapted to the dark theme.
      Legibility verdict: PASS
