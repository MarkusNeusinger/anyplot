review:
  strengths:
  - 'Correct Manhattan-plot structure: cumulative genomic position on the x-axis,
    alternating brand-green/blue chromosome colors, and dual dashed threshold lines
    (genome-wide p<5e-8 and suggestive p<1e-5) with inline labels via markLine'
  - Deterministic LCG-based synthetic GWAS data with realistic Gaussian LD-decay peaks
    across six chromosomes (including one suggestive-only peak on chr12) rather than
    uniform noise everywhere
  - 'Density-appropriate marker sizing: 6px @ 0.75 alpha for the background SNP cloud
    vs. 8px @ 0.95 alpha for genome-wide-significant hits, correctly combating overplotting
    on a large point count'
  - Theme-adaptive chrome (title, axis labels, ticks, grid) correctly threaded through
    window.ANYPLOT_TOKENS; data colors are pixel-identical between light and dark
    renders, only chrome flips
  - 'Idiomatic ECharts usage: customValues + formatter render chromosome-name ticks
    on a continuous value axis, and markLine implements both threshold lines with
    inline labels in the pattern used throughout the catalog'
  weaknesses:
  - Second alternating-chromosome color uses t.palette[2] (blue, canonical position
    3) instead of t.palette[1] (lavender, position 2) with no semantic justification
    for skipping a position — contradicts the style guide's 'use positions 1→N in
    order by default' rule
  - Total simulated variant count is roughly 7,000 (lengthMb * 2.3 per chromosome),
    well short of the spec's noted '100,000 - 1,000,000+ variants typical' — the scatter
    reads visibly sparser than a real GWAS skyline; consider raising per-Mb density
  - No legend distinguishes the three series (odd chromosome / even chromosome / genome-wide
    significant) — acceptable under Manhattan-plot convention since colors are inferable
    from the x-axis chromosome ticks and the adjacent threshold-line label, but a
    first-time viewer must infer the red = 'significant' mapping solely from proximity
    to the genome-wide line
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "manhattan-gwas · javascript · echarts · anyplot.ai" centered top in dark ink, clearly legible. Y-axis unit label "-log10(p)" sits above the axis top-left, legible. X-axis label "Chromosome" centered below the tick row, legible. Chromosome tick labels (1-22, X) all legible along the x-axis. Horizontal grid lines are thin, light gray, subtle but visible. Two dashed threshold lines (matte red "Genome-wide (p<5x10^-8)" and amber "Suggestive (p<1x10^-5)") have inline labels that are fully readable and don't collide with data points.
      Data: First series (odd chromosomes) is brand green #009E73; second series (even chromosomes) is blue (palette position 3); genome-wide-significant SNPs above the red threshold line are matte red and rendered slightly larger/more opaque. All three data colors are clearly distinguishable from the cream background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, "-log10(p)" unit label, "Chromosome" axis label, and all chromosome tick labels render in light ink/soft-ink tones and are clearly visible against the dark background. Grid lines are thin and subtle. Threshold-line labels (genome-wide in red, suggestive in amber) remain fully legible with no dark-on-dark issues anywhere.
      Data: Green, blue, and red data colors are visually identical to the light render (only the chrome — background, text, grid — flips), confirming the Imprint categorical colors are theme-independent as required.
      Legibility verdict: PASS
