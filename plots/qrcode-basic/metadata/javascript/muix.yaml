review:
  strengths:
  - 'The hard-coded module matrix is a real QR encoding: unmasking it (mask 1) and
    reading the data region yields byte mode, length 18, "https://anyplot.ai"; the
    format bits decode to EC level M, mask 1 with a valid BCH checksum, matching the
    caption and the source comment'
  - Three intact finder patterns (UL, UR, LL), timing patterns, the version-2 alignment
    pattern at (18,18) and the dark module are all in place; the fourth corner is
    free
  - A 4-module quiet zone is part of the symbol tile, so the dark render shows a clean
    off-white tile behind the code with blank margin on every side
  - Whole-pixel module size (Math.floor) plus shapeRendering="crispEdges" gives square,
    equal, sharp-edged modules with no gradient or transparency
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with hidden
    axes, skipAnimation, and a custom SVG layer that reads its box from useDrawingArea()'
  - The caption derives version and module count from the matrix and the recovery
    percentage from the EC level, so it tells the reader what the code holds and at
    which settings
  weaknesses:
  - 'Suggestion: the mandated title spans only about 38 % of the width; a slightly
    larger title would give the header more presence above the large symbol.'
  - 'Suggestion: the module matrix only matches CONTENT as long as both are edited
    together; a note in the data block showing the exact segno call that regenerates
    SYMBOL_ROWS (already partly there) is the right place to keep it discoverable.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas; the symbol tile is the same #FAF8F1, so the 4-module quiet zone merges with the page.
      Chrome: bold title "qrcode-basic · javascript · muix · anyplot.ai" centred at the top in dark ink; caption at the bottom in softer ink: "Encodes “https://anyplot.ai” · error correction M (15 %) · version 2, 25 × 25 modules". Both readable; no axes, ticks, grid or legend (expected).
      Data: a 25x25 version-2 QR symbol in near-black #1A1A17 modules, square, equal-sized, crisp edges; finder patterns upper-left, upper-right, lower-left; alignment pattern near the lower right; timing patterns visible. No categorical palette applies.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; the symbol sits on an off-white #FAF8F1 tile that includes the quiet zone, so the code stays black on white (permitted by the spec).
      Chrome: title in light ink and caption in soft light ink, both clearly readable on the dark page; no dark-on-dark text.
      Data: identical module pattern and colors to the light render; only the page chrome flips.
      Legibility verdict: PASS
