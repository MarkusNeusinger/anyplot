review:
  strengths:
  - 'The module pattern is a real ISO/IEC 18004 encoding: decoding the light render
    independently gives version 2, level M, mask 2, byte mode, 18 bytes "https://pyplots.ai",
    and all 16 Reed-Solomon syndromes are zero, so a standard reader will scan it'
  - All three finder patterns are intact nested squares in the upper left, upper right
    and lower left; the version-2 alignment pattern sits in the lower-right area and
    the fourth corner has no finder
  - A 4-module quiet zone sits on a near-white tile that stays dark-on-light in both
    themes, while only the page and title flip with the theme
  - go.Heatmap with a two-stop colorscale, scaleanchor/scaleratio=1 and ranges pinned
    to the padded matrix gives square, sharp, equal modules with no gradient or gaps
  - The HTML hovertemplate reports each module's (x, y) coordinate, a plotly-native
    way to inspect the grid
  weaknesses:
  - 'VQ-05 (both): the code tile sits off-centre vertically, with about 180 px of
    page between the title and the tile but about 600 px below it, so the lower third
    of the square canvas is empty → balance the space above and below the tile (bottom
    margin about −70 px, or matching top and bottom margins). Likely cause: margin
    b=150 against t=80.'
  - 'Suggestion: the title''s font family asks for Arial Black, but the render falls
    back to a regular-weight sans; name a family the renderer has, or drop the family,
    so the code matches the output.'
  - 'Suggestion: once a QR package (qrcode or segno) is in the runner''s dependencies,
    the roughly 100-line hand-written encoder could become a single library call,
    as the spec''s Notes recommend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page, with a slightly lighter near-white #FFFDF6 tile carrying the code.
      Chrome: title "qrcode-basic · python · plotly · anyplot.ai" centred at the top in dark ink, about 48% of the width, fully readable. No axes, ticks or grid (as the spec permits).
      Data: a 25×25 version-2 QR code in near-black #1A1A17 modules on the white tile with a 4-module quiet zone; three intact finder patterns (upper left, upper right, lower left), the alignment pattern near the lower right, and timing rows visible. The modules are square, equal-sized and sharp-edged. The tile sits high on the canvas, leaving a large empty band below it. No Imprint data colors apply (black-on-white is mandated).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; the code keeps its near-white tile (the spec permits a white tile behind the code in the dark theme).
      Chrome: the title is in light ink #F0EFE8 and clearly readable; no dark-on-dark text anywhere.
      Data: the module matrix, tile and quiet zone are identical to the light render; only the page and title flipped.
      Legibility verdict: PASS
