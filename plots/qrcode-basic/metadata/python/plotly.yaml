review:
  strengths:
  - 'The module matrix is a real ISO/IEC 18004 encoding: sampling the 25×25 grid from
    both renders and decoding it gives a matching format-information pair (level M,
    mask 2), byte mode, length 18, the payload "https://pyplots.ai", and all 16 Reed–Solomon
    syndromes equal to zero, so a standard reader scans it'
  - All three finder patterns (upper left, upper right, lower left) are intact nested
    squares, the version-2 alignment pattern and the timing rows are in place, and
    the fourth corner has no finder
  - A 4-module quiet zone of blank tile surrounds the code on all sides, and the code
    stays dark on a white tile in both themes, so the dark render scans exactly like
    the light one (the module matrix is identical in both renders)
  - go.Heatmap with scaleanchor/scaleratio=1, constrain='domain' and a reversed y
    range gives square modules of one size with sharp edges, a native Plotly idiom
    for drawing a matrix
  - The mask is chosen by the standard's four penalty rules and the format bits are
    computed with the BCH remainder, so the output follows the encoding and is not
    a hand-drawn fill
  - 'Theme tokens drive all chrome: the title and caption text are light on #1A1A17
    and dark on #FAF8F1, and the canvas is exactly 2400×2400'
  weaknesses:
  - 'SC-01 (both): on a -basic spec the code is wrapped in layers the spec does not
    ask for: a green accent frame around the tile, a dotted green divider, a bold
    green URL caption and a metadata line ("Error Correction: M (15%) · Version 2
    · 25×25 modules") → remove the frame, the divider and both captions so only the
    title, the tile and the code remain. Likely cause: the fig.add_shape(type="rect"),
    fig.add_shape(type="line") and the two fig.add_annotation calls.'
  - 'Suggestion: once the captions are gone, reduce the 150 px bottom margin so the
    code sits centered on the canvas.'
  - 'Suggestion: set MODULE_LIGHT to pure #FFFFFF so the tile is strictly the white
    the Notes describe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; the code sits on a slightly lighter #FFFDF6 tile framed by a thin translucent green (#009E73) rectangle.
      Chrome: centered title "qrcode-basic · python · plotly · anyplot.ai" in dark ink at the top; below the tile a dotted green divider, a bold green "https://pyplots.ai" caption and a soft-gray metadata line "Error Correction: M (15%) · Version 2 · 25×25 modules". All text clearly readable. No axes, ticks or grid.
      Data: a 25×25 version-2 QR code in near-black #1A1A17 modules on the white tile: three intact finder patterns (upper left, upper right, lower left), timing rows, one alignment pattern near the lower right, and a 4-module quiet zone. Modules are square, one size, sharp-edged. The matrix decodes to "https://pyplots.ai" (level M, mask 2, RS check passes).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; the white #FFFDF6 tile with the same QR code stands out, framed by the green rectangle (reads darker green on the dark page).
      Chrome: title in light #F0EFE8 text, the green URL caption and the metadata line in light gray #B8B7B0 — all readable, no dark-on-dark text.
      Data: the module matrix is identical to the light render (0 of 625 modules differ); the code stays dark-on-white, as the spec permits, and scans the same way.
      Legibility verdict: PASS
