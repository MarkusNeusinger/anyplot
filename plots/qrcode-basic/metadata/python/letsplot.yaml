review:
  strengths:
  - 'Real, scannable encoding: the rendered light PNG decodes back to byte-mode ''https://pyplots.ai''
    at level M, mask 2, with all 16 Reed-Solomon syndromes zero, so module positions
    follow from the encoding, never from a random fill'
  - 'Correct QR anatomy in both renders: three intact finder patterns (upper left,
    upper right, lower left), timing rows, the version-2 alignment pattern in the
    lower right, and a 4-module quiet zone'
  - 'Idiomatic lets-plot raster: geom_raster with scale_fill_identity, coord_fixed
    and theme_void draws one cell per module with no axes, ticks or legend'
  - Module colors are fixed constants independent of the theme, so the dark render
    keeps dark-on-light modules on a light tile that scanners can read, while title,
    subtitle and caption follow the INK/INK_SOFT/INK_MUTED tokens
  - 'Clear three-level typography: a bold title, a softer subtitle naming the content
    and error-correction level, and a muted caption with version and module count'
  - Version selection is computed from the payload length (18 bytes do not fit version
    1-M, so version 2 is used), not hard-coded
  weaknesses:
  - 'SC-02 (both): module edges are not sharp: each dark/light boundary fades over
    about 8 px of grey ramp (≈1/7 of a 58 px module), visible as soft, slightly uneven
    edges at full size, against the ''sharp edges and no gradient'' property → hard
    one-pixel edges. Likely cause: geom_raster''s bitmap is interpolated when ggsave(scale=4)
    upsamples it; draw the modules with geom_tile(width=1, height=1) (vector rects)
    instead.'
  - 'CQ-01 (code): MASKS is a list of eight lambda functions, which the no-functions
    rule excludes → eight boolean numpy expressions over rr, cc (for example (rr +
    cc) % 2 == 0) built once the grid is defined. Likely cause: the mask table written
    as callables.'
  - 'Suggestion: the 11 pt caption and 12 pt subtitle shrink to about 7–8 px in the
    400 px thumbnail; a point or two more would keep them readable there.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400×2400 canvas; the quiet zone is the same off-white, so the code sits centred with generous blank margins.
      Chrome: bold dark title "qrcode-basic · python · letsplot · anyplot.ai" at the top, a dark-grey subtitle "Encoded: https://pyplots.ai | Error Correction: M (15%)" below it, and a muted caption "Version 2 · 25×25 modules · ECC Level M" at the bottom. No axes, ticks, grid or legend. All text is clearly readable.
      Data: a 25×25 version-2 QR symbol in near-black #1A1A17 modules on off-white, with three finder patterns (upper left, upper right, lower left), timing patterns, the alignment pattern in the lower right, and a 4-module quiet zone free of marks. Module edges show a slight grey ramp (about 8 px) instead of a hard edge. The symbol decodes to "https://pyplots.ai" (level M, mask 2, RS syndromes all zero).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page, with a large off-white #FAF8F1 tile behind the code (code plus quiet zone), as the spec permits.
      Chrome: title in light #F0EFE8, subtitle in light grey, caption in muted grey; all clearly readable on the dark page, no dark-on-dark text.
      Data: the module pattern is identical to the light render (same dark modules on the same light field), only the page around the tile flipped.
      Legibility verdict: PASS
