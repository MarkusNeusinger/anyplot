review:
  strengths:
  - 'Real ISO/IEC 18004 byte-mode encoding with Reed-Solomon error correction, mask
    selection by penalty and format bits: the light render decodes to https://pyplots.ai
    (format M, mask 2, all 16 RS syndromes zero), so the code is scannable and every
    module position follows from the encoding'
  - All three finder patterns intact in the upper left, upper right and lower left,
    timing patterns and the version-2 alignment pattern in place, fourth corner free
  - A 4-module quiet zone on all sides, free of text and marks; in the dark theme
    the code sits on an off-white tile exactly 33 modules wide, keeping dark-on-light
    contrast for scanners
  - geom_raster with scale_fill_identity and coord_fixed draws one square, sharp-edged
    module per cell, with theme_void removing axes, grid and legend
  - 'Three-tier text hierarchy: bold INK title, INK_SOFT subtitle stating the encoded
    content and the error-correction level, INK_MUTED caption with version and module
    count'
  - 'Theme chrome flips correctly: #FAF8F1 page in light, #1A1A17 in dark, all text
    readable in both'
  weaknesses:
  - 'VQ-01 (both): the subtitle at 10 pt and the caption at 9 pt in INK_MUTED shrink
    to about 5-6 px in the 400 px thumbnail and blur → subtitle about 12 pt, caption
    about 11 pt (+2 pt each). Likely cause: plot_subtitle element_text(size=10), plot_caption
    element_text(size=9).'
  - 'CQ-01 (code): three helper functions (reed_solomon, with_format, penalty) break
    the flat Imports → Data → Plot → Save structure → inline them as loops (RS remainder
    per block inside the block loop, format and penalty inside a loop over the eight
    masks keeping the lowest-penalty symbol). Likely cause: the encoder was written
    as reusable helpers.'
  - 'Suggestion: segno or qrcode would replace the roughly 150-line hand-written encoder
    if either is ever added to the CI environment; neither is installed today.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold near-black title "qrcode-basic · python · letsplot · anyplot.ai" centered at the top (~65 % width), grey subtitle "Encoded: https://pyplots.ai | Error Correction: M (15%)", lighter grey caption "Version 2 · 25×25 modules · ECC Level M" at the bottom. No axes, ticks, grid or legend. All text readable.
      Data: a 25x25 version-2 QR code in near-black #1A1A17 modules on #FAF8F1, centered, ~62 % of the width; three finder patterns (UL, UR, LL), timing rows, alignment pattern near the lower right, 4-module quiet zone merging into the page. Decoded from the PNG: "https://pyplots.ai", ECC M, mask 2, RS syndromes all zero. No Imprint series colors (none needed; code is black on white per spec).
