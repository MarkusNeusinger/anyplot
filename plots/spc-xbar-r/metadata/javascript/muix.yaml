review:
  strengths:
  - 'Composed ChartsContainer pair: X-bar panel on top with its x axis hidden (position:
    "none") and the R panel below on the same linear sample domain, so every sample
    lines up vertically across both panels'
  - 'Control limits computed from the data with the standard constants (A2 = 0.577,
    D4 = 2.114, D3 = 0 for n = 5): CL 25.000 / UCL 25.070 / LCL 24.930 and R-bar 0.122
    / UCL 0.257 / LCL 0.000 match an independent recomputation'
  - 'Clear limit hierarchy: control limits dashed in full ink with bold right-gutter
    labels, warning limits thinner short-dash in inkSoft at reduced opacity, center
    line solid — all readable in both themes'
  - Out-of-control points (samples 8, 16, 22 on X-bar; 12 on R) are drawn larger and
    in the Imprint red with a page-colored ring, so the signal does not rely on hue
    alone
  - Custom ControlLayer uses the library's useXScale/useYScale/useDrawingArea hooks
    to place markers and gutter labels exactly on the chart's scales; ChartsReferenceLine
    draws the limits natively
  - Theme tokens threaded through every element (pageBg, ink, inkSoft, grid); data
    colors identical between light and dark
  weaknesses:
  - 'Suggestion: the shared sample axis could carry a faint tick row under the X-bar
    panel too, so readers of the top panel need not look down to the bottom axis to
    read sample numbers.'
  - 'Suggestion: the in-header legend markers could carry the same page-colored ring
    as the plotted markers so the swatches match the marks exactly.'
  image_description: |-
