review:
  strengths:
  - Correct stacked X-bar/R layout
  - Standard constants A2=0.577, D3=0, D4=2.114 for n=5; limits computed from the
    data
  - Out-of-control points encoded redundantly by fill, size and semantic red
  - Clear limit hierarchy - solid center line, dashed control limits, dotted warning
    limits - labeled directly
  - layer_tooltips() gives sample, value and status on hover in the HTML export
  weaknesses:
  - 'VQ-07 (both): the gggrid composite paints pure-white strips (~24 px) around the
    canvas and a white seam between the panels, glaring on the dark render → page
    color #FAF8F1 / #1A1A17 everywhere. Likely cause: no theme(plot_background=...)
    on the gggrid composite itself.'
  - 'VQ-02 (both): the ''CL'' label of the X-bar panel is half covered by the sample-30
    marker → label clear of the last point by a few px. Likely cause: label x placed
    at last + 0.5 with hjust=0 next to a size-5 marker.'
  - 'SC-02 (both): sample positions do not line up across the panels - sample 1 sits
    about 18 px further right in the X-bar panel (C1) → identical x positions (0 px
    offset). Likely cause: gggrid aligns plot boxes, not panels; use align=True.'
  - 'VQ-06 (both): y title renders ''X (Sample Mean, mm)'' and the R center label
    ''R'' - the combining macron is dropped → ''X-bar'' / ''R-bar'' in a form that
    renders. Likely cause: U+0304 combining macron in the labels.'
  - 'CQ-01 (code): column names are typed inline with no column constants and no separated
    Data block → one string constant per column role above a Data block that ends
    by binding df. Likely cause: data and plot code interleaved.'
  - 'CQ-04 (code): invisible alpha=0.01 duplicate point layers exist only to carry
    tooltips (lines 247-262) → tooltips on the visible geom_point layers. Likely cause:
    tooltips added after the fact.'
  - 'Suggestion: larger limit labels (size 5-6) would balance the axis titles.'
  image_description: |-
    Light render (plot-light.png):
      Background: #FAF8F1 inside the panels, but the 2400x2400 composite is framed by pure-white strips at every edge and a white seam between the two panels.
      Chrome: bold dark title, y titles 'X (Sample Mean, mm)' and 'R (Sample Range, mm)' (macron lost), x title 'Sample Number', INK_SOFT ticks; readable.
      Data: X-bar panel over R panel; green line with hollow green circles; filled red circles at samples 8, 19, 25 and 12 (R); solid center lines, dashed UCL/LCL, dotted warning limits; small bold UCL/CL/LCL labels at the right, 'CL' half covered by the last marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: #1A1A17 inside the panels, framed by the same pure-white strips and seam, glaring against the dark surface.
      Chrome: light cream title and axis titles, light gray ticks; no dark-on-dark text.
      Data: identical green and red marks; limit lines in light gray.
      Legibility verdict: PASS
