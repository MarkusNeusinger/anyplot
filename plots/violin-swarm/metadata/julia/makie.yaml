review:
  strengths:
  - Custom beeswarm algorithm ties point offsets to local KDE density (scaled to the
    same bandwidth logic as the violin), so swarm points stay inside the violin outline
    and cluster where the density is actually highest — a technically correct solution
    to the tricky boundary requirement.
  - Alpha 0.4 translucent violins with ink-colored, stroke-outlined swarm points give
    strong contrast against every hue in both themes, per the spec's transparency
    and contrast guidance.
  - 'Theme-adaptive chrome is fully correct: backgrounds, spines, gridlines, tick/axis
    colors all flip between light and dark while data colors (violin fill/stroke)
    stay identical.'
  - 'Imprint palette used in canonical order starting with brand green #009E73 across
    all 4 categories.'
  - Realistic, neutral caffeine-dose/reaction-time scenario with a plausible inverted-U
    dose-response pattern (reaction time improves then the 300 mg group shows wider
    spread from overstimulation).
  weaknesses:
  - 'CQ-01: Three helper functions (kde_bandwidth, kde_density, beeswarm_offsets)
    break the KISS imports->data->plot->save structure. Justified by the algorithmic
    need (Makie has no native beeswarm primitive) but still scored down per the strict
    no-functions rubric.'
  - 'LM-02: The swarm layout is a fully manual/generic offset algorithm rather than
    something distinctive to Makie/CairoMakie — it could be ported to any plotting
    library with the same math, so it doesn''t earn library-specific credit.'
  - 'VQ-03: In the densest bins (0 mg and 100 mg central columns) several swarm markers
    touch/nearly merge — tighten bin spacing or shrink markersize slightly in the
    highest-density bins so individual points stay distinguishable.'
  - 'DE-01/DE-03: Reads as a well-executed, technically correct default rather than
    a plot with a strong focal point — consider a subtle visual cue (e.g., emphasize
    the 300 mg group''s wider spread or the U-shaped trend) to sharpen the story.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "violin-swarm · julia · makie · anyplot.ai" in dark ink, centered, fully visible with no clipping. X-axis label "Caffeine Dose" and Y-axis label "Reaction Time (ms)" in dark ink, both legible. Tick labels (0 mg / 100 mg / 200 mg / 300 mg on x; 200/400/600 on y) render in a slightly softer dark gray, clearly readable. Subtle horizontal gridlines at y=200/400/600. Top and right spines removed; left/bottom spines a soft neutral tone.
      Data: Four violins in Imprint order — #009E73 (0 mg), #C475FD (100 mg), #4467A3 (200 mg), #BD8233 (300 mg) — each at ~0.4 alpha with a solid stroke outline in the same hue. Individual reaction-time trials are overlaid as small black-filled, light-stroked dots that stack in a beeswarm pattern within each violin's boundary, widest where the violin body is widest.
      Legibility verdict: PASS — all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels renders in light ink (near-white), fully visible with no clipping. Tick labels render in a lighter soft gray, clearly legible against the dark background — no dark-on-dark failures observed. Gridlines are subtle and visible. Spines match the light-render treatment (top/right hidden, left/bottom in a muted light tone).
      Data: The four violin fill/stroke colors are pixel-identical to the light render (#009E73, #C475FD, #4467A3, #BD8233) — only the chrome flipped. Swarm points are white-filled with dark strokes (inverted from the light render) so they remain visible against every violin hue on the dark background.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark issues.

    Both renders pass the theme-readability checklist. Canvas dimensions confirmed at 3200x1800 (landscape target) for both PNGs — no canvas gate warning was present.
