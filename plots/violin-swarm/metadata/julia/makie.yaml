review:
  strengths:
  - Custom beeswarm algorithm ties point offsets to local KDE density (same bandwidth
    logic as the violin), so swarm points stay inside the violin outline and cluster
    where density is actually highest.
  - New dashed group-median trend line gives the plot a clear focal point/story (the
    inverted-U dose-response), directly addressing the prior round's DE-03 weakness.
  - show_median is now used as a genuine native Makie violin feature rather than a
    manual overlay, partially addressing the prior LM-02 weakness.
  - Theme-adaptive chrome is fully correct in both renders; Imprint palette in canonical
    order starting with brand green.
  - Realistic, neutral caffeine-dose/reaction-time scenario with a plausible inverted-U
    pattern.
  weaknesses:
  - Title renders at only ~24% of the plot width -- noticeably smaller than the ~50-70%
    target for a title this length; increase titlesize for stronger hierarchy.
  - Two swarm points still visibly merge into a single blob just below the median
    in the 0 mg violin -- tighten the beeswarm step size or add basic pairwise collision
    resolution in the densest bins.
  - 'CQ-01: two helper functions still break KISS structure (unresolved from the prior
    round; algorithmically necessary but still scored down).'
  - 'LM-02: swarm placement remains a generic, library-agnostic offset algorithm --
    no Makie-specific technique for the beeswarm layout itself.'
  - Sample size is fixed at 50 across every group; varying it per category would better
    exercise DQ-01 Feature Coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "violin-swarm · julia · makie · anyplot.ai" in bold dark ink, centered, fully visible with no clipping. X-axis label "Caffeine Dose" and Y-axis label "Reaction Time (ms)" in dark ink, both legible. Tick labels (0 mg/100 mg/200 mg/300 mg on x; 200/400/600 on y) render in a softer dark gray, clearly readable. Subtle horizontal gridlines at y=200/400/600. Top and right spines removed; left/bottom spines in a soft neutral tone.
      Data: Four violins in Imprint order -- #009E73 (0 mg), #C475FD (100 mg), #4467A3 (200 mg), #BD8233 (300 mg) -- each at ~0.4 alpha with a solid stroke outline in the same hue, plus a solid ink median line and a new dashed ink-soft trend line connecting the four group medians. Individual reaction-time trials are overlaid as small ink-filled, light-stroked dots that stack in a beeswarm pattern within each violin's boundary.
      Legibility verdict: PASS -- all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title and axis labels render in light ink (near-white), fully visible with no clipping. Tick labels render in a lighter soft gray, clearly legible against the dark background -- no dark-on-dark failures observed. Gridlines are subtle and visible. Spines match the light-render treatment (top/right hidden, left/bottom in a muted light tone).
      Data: The four violin fill/stroke colors are pixel-identical to the light render (#009E73, #C475FD, #4467A3, #BD8233) -- only the chrome flipped. Swarm points are white-filled with dark strokes (inverted from the light render) so they remain visible against every violin hue on the dark background.
      Legibility verdict: PASS -- all text is clearly readable against the dark background, no dark-on-dark issues.

    Both renders pass the theme-readability checklist. Canvas dimensions confirmed at 3200x1800 (landscape target) for both PNGs -- no canvas gate warning was present.

    Residual issue noted in both renders: two swarm points in the 0 mg violin merge into a single overlapping blob just below the median line; title text measures ~24% of plot width (left spine to right spine), below the ~50-70% proportional target.
