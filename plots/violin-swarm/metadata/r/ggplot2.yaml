review:
  strengths:
  - 'A true swarm: each point''s sideways offset is capped by the violin''s own density
    half-width (same density() bandwidth as geom_violin), so every point stays centred
    and inside the outline'
  - Theme tokens threaded through every chrome element; both renders read cleanly
    and data colors are identical
  - Text sizes follow the ggplot2 reference (12/10/8 pt) on the canonical 3200x1800
    canvas
  - Column constants and .data[[...]] make the data block swappable as the adaptable-code
    zones require
  weaknesses:
  - 'CQ-01 (code): the swarm layout is wrapped in a swarm_offsets() helper plus a
    half_width_at() closure redefined inside the per-category loop, against the Imports
    → Data → Plot → Save flow without functions → inline the placement loop over the
    sorted values per category, no named helpers. Likely cause: swarm_offsets <- function(...)
    and half_width_at <- function(v) in the plot block.'
  - 'Suggestion: a darker or outlined point color (e.g. a thin INK_SOFT stroke via
    shape 21) would lift the green points off the same-green violin fill, as the Notes''
    contrasting-color hint invites.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "violin-swarm · r · ggplot2 · anyplot.ai" top-left in dark ink; axis titles "Experimental condition" and "Reaction time (ms)" in dark ink; tick labels (Control, Treatment A-C; 200/300/400) in soft gray; horizontal y-grid only. All readable.
      Data: four width-scaled violins in #009E73 at alpha 0.35 with a gray outline; 60 #009E73 points per violin laid out as a centred beeswarm, all inside the outlines. Control shows a long lower tail to 200 ms, Treatment A an upper tail to ~440 ms.
