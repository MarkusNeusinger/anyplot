      Data: Four violins in brand green (#009E73, alpha ~0.4) with purple/lavender swarm points (#C475FD) overlaid, spread horizontally within each violin's density outline. Low Dose violin has an amber outline and an amber "Bimodal response" text callout above it, correctly flagging the deliberately bimodal distribution.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Same title, legend, and axis labels now rendered in light ink/off-white, fully visible against the dark background. Gridlines remain subtle. No layout differences from the light render other than the chrome flip.
      Data: Violins remain the same brand green, swarm points remain the same lavender/purple, and the amber Low Dose outline/callout is unchanged — confirms data colors are identical between themes, only chrome flipped.
