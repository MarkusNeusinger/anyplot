review:
  strengths:
  - Genuine violin+swarm hybrid built with ECharts' custom series `renderItem` for
    the violin polygon plus a native scatter series for the beeswarm — an idiomatic,
    technically sophisticated ECharts pattern rather than a workaround.
  - Density-adaptive swarm layout (binned offsets with a size/opacity ratio) keeps
    points inside the violin boundary and legible even in the most crowded bins.
  - The 'Bimodal response' callout on Low Dose gives the chart a clear storytelling
    focal point and uses the amber semantic anchor correctly for an annotation role.
  - Correct Imprint palette usage — brand green `#009E73` violin fill, lavender `#C475FD`
    swarm points — with theme-correct chrome (background, text, grid) in both light
    and dark renders.
  - Deterministic LCG + Box-Muller data generation keeps the plot fully reproducible
    without any external RNG dependency.
  weaknesses:
  - The between-group reaction-time effect (Placebo mean ~340ms vs. High Dose mean
    ~205ms, a ~135ms swing) is implausibly large for a caffeine-dosage effect — real
    caffeine studies on simple reaction time typically show ~10-30ms improvements,
    not a ~40% reduction. Narrow the per-category mean gap (e.g. ~300/275/260/245ms)
    to stay factually plausible (DQ-03).
  - Swarm points inside the densest violin (Placebo, 55 points) visibly touch/overlap
    despite the density-aware spacing — tighten MAX_POINT_SPACING or lower the minimum
    size/opacity ratio for the most crowded bins so individual observations stay distinguishable.
  - The KDE/quantile/beeswarm helper functions push the code past the 'no functions'
    KISS baseline expected for the JS libraries — understandable given the custom-series
    technique, but worth consolidating where possible.
