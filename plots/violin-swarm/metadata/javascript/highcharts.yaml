review:
  strengths:
  - Correctly builds a violin shape from scratch (mirrored area series with Gaussian
    KDE) since Highcharts core has no native violin type — a genuine library-mastery
    workaround, not a fallback to another library.
  - Swarm layout algorithm bins points by value and scales offsets to the locally
    interpolated violin half-width, so points visibly stay inside the violin silhouette
    at every height instead of a naive fixed jitter.
  - Violin fillOpacity (0.4) sits inside the spec's recommended 0.3-0.5 range and
    keeps swarm points clearly visible through the fill.
  - First categorical series is the brand green (#009E73) with a contrasting blue-purple
    swarm color (palette[2]), matching the spec's suggestion of a contrasting point
    color.
  - Deterministic LCG + Box-Muller sampler with a fixed seed (42) gives full reproducibility
    with no external RNG dependency.
  - Theme chrome (title/axis/tick/legend colors, transparent chart background, gridline
    color) is correctly threaded from window.ANYPLOT_TOKENS in both renders, and chart+series
    animation is disabled for the screenshot harness.
  - 'Realistic, non-controversial dataset: log-normal IL-6 biomarker concentrations
    with varying sample sizes (45-60) across four dose groups showing a plausible
    dose-response trend.'
  weaknesses:
  - Swarm points in the Medium Dose and High Dose groups overlap fairly heavily near
    the density peak — the violin narrows there but point count stays high, so individual
    observations become harder to distinguish; consider slightly smaller marker radius
    or a tighter SWARM_STEP for the narrower groups.
  - The x-axis (category) has no axis title — only the tick labels ('Placebo', 'Low
    Dose', ...) identify the grouping variable; an explicit axis title (e.g. 'Treatment
    Group') would remove any ambiguity, though the category labels alone are self-explanatory
    here.
  - Legend only shows two generic entries ('Density estimate', 'Individual trial')
    without per-group color coding, which is expected since violin fill color doesn't
    vary by group — acceptable, but a subtitle or annotation noting per-group N would
    add clarity for varying sample sizes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-swarm · javascript · highcharts · anyplot.ai" in bold dark ink, centered top. Y-axis title "IL-6 Concentration (pg/mL)" rotated on the left in soft ink. Numeric y-axis ticks (2-22) and four x-axis category labels (Placebo, Low Dose, Medium Dose, High Dose) in soft grey. Subtle horizontal gridlines only. Legend ("Density estimate", "Individual trial") centered below the plot. All text is clearly readable against the light background — no light-on-light issues.
      Data: Four violin shapes in Imprint brand green (#009E73) with ~40% fill opacity and a solid green outline, each overlaid with individual trial points in a contrasting blue-purple (palette[2]). Violins shrink and shift downward in value from Placebo to High Dose, showing a clear dose-response trend. Points are visibly spread horizontally within each violin's silhouette, staying inside the violin boundary.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/soft-grey tones against the dark background. Gridlines are faint but visible. Legend text is light grey and readable.
      Data: Violin fill and swarm point colors are the same underlying Imprint values as the light render (green fill, blue-purple points) — only the chrome (background, text, gridlines) has flipped; the violin fill visually reads as a deeper green due to alpha blending over the dark background, which is expected and not a color deviation. No dark-on-dark text failures observed — every label remains legible.
      Legibility verdict: PASS
