review:
  strengths:
  - Fully custom-built violin shape (KDE + mirrored area-series pairs) and a hand-rolled
    swarm layout algorithm, since Highcharts' core bundle has no native violin/boxplot
    module — solid engineering to make this plot type feasible at all.
  - Deterministic LCG-based data generation producing a realistic right-skewed, log-normal
    dose-response biomarker dataset (IL-6 concentration across 4 treatment groups).
  - Where the layout isn't broken (Low Dose, Medium Dose), the swarm points form a
    clean, legible diamond-shaped point cloud that stays inside the violin silhouette
    with no overlap.
  - Correct theme-adaptive chrome in both renders (title/axis/tick colors from tokens,
    transparent chart background, Imprint palette), correct mandated title format,
    and legend labels matching series names.
  weaknesses:
  - 'CONFIRMED BY PIXEL INSPECTION (both plot-light.png and plot-dark.png): the yAxis''s
    explicit min/max (`min: -0.5, max: groups.length - 0.5`, i.e. -0.5..3.5) is not
    actually honored at render time — the plotted extent snaps to [0, 3] instead.
    Scanning plot-light.png rows y=800-1050 (the Placebo violin''s widest section)
    shows the green fill starting at x=139 with zero gap from the axis line at x=136-137
    — the left half of the Placebo violin (index 0) is entirely clipped off, not just
    naturally thin. The mirror case happens on the High Dose violin (index 3): its
    right half is clipped flush against the plot''s right edge, and swarm points crowd
    right up against that cut boundary. Low Dose and Medium Dose (the two interior
    categories) are unaffected because their +/-0.42 half-width footprint stays inside
    [0,3].'
  - 'Direct consequence: for Placebo and High Dose, every swarm point that the algorithm
    assigned a negative local offset (`group.index - rawOffsets`) falls outside the
    rendered plot area and never appears — roughly half of each of those two groups''
    ''Individual trial'' points are missing from the chart entirely, not just visually
    crowded.'
  - This violates the spec's explicit requirement to overlay swarm points 'centered
    within the violin shape' and to preserve full data transparency ('showing exactly
    how many observations exist at each level') — for 2 of 4 groups, only ~half the
    observations are visible.
  - 'Suggested fix: add `startOnTick: false, endOnTick: false` to the yAxis config
    (Highcharts'' default tick-snapping is the likely reason the explicit -0.5/3.5
    min/max isn''t being respected), and re-verify pixel-for-pixel that Placebo and
    High Dose render the same symmetric, both-sides-visible violin shape that Low
    Dose/Medium Dose already show.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "violin-swarm · javascript · highcharts · anyplot.ai" in dark ink, bold, clearly legible. Y-axis (rendered vertically due to chart.inverted) titled "IL-6 Concentration (pg/mL)" in soft dark gray with numeric ticks 2-22, all legible. Category labels (Placebo, Low Dose, Medium Dose, High Dose) rendered horizontally at the bottom, dark and legible. Legend at bottom ("Density estimate" green swatch, "Individual trial" blue dot) legible. Subtle horizontal gridlines on the value axis only.
      Data: Violin fill/outline uses brand green (#009E73, palette position 1) at ~0.4 opacity; swarm points use a blue-purple (palette position 3) with a thin light edge. BUG: the Placebo violin (leftmost) shows only its right half — the fill starts immediately flush against the vertical axis line with zero gap even at the violin's widest section (pixel-verified at rows y=800-1050), meaning the left half of the violin and roughly half of Placebo's individual points are not rendered. The High Dose violin (rightmost) shows the mirrored defect: only its left half is visible, cut flush at the right, with swarm points crowded against that cut edge. Low Dose and Medium Dose render correctly as full, symmetric violins with well-distributed interior swarm points.
      Legibility verdict: PASS (text/theme legibility is fine — the defect is a data/shape clipping bug, not a text-contrast issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light off-white, axis title and tick labels in light gray, all clearly legible against the dark background. No dark-on-dark issues found. Category labels and legend legible.
      Data: Same green violin / blue-purple point colors as the light render — data colors are identical between themes, confirming only chrome flipped. The SAME clipping bug reproduces identically: Placebo's violin is missing its left half (fill flush against the axis line, no gap, at the same pixel rows as the light render) and High Dose is missing its right half, with swarm points cut off at the same boundary. Low Dose and Medium Dose are correct.
      Legibility verdict: PASS for text/contrast; FAIL for data completeness (see weaknesses — this is a structural rendering bug reproduced identically in both themes, not a theme-specific defect).
