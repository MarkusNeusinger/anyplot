review:
  strengths:
  - 'Idiomatic, sophisticated D3 usage: a force-simulation beeswarm clamped to a per-value
    interpolated violin half-width (halfWidthAt), instead of a fixed rectangular lane'
  - Per-category local density grid (own bandwidth-sized support window per violin)
    avoids the common spurious-tail artifact from sampling a shared global grid
  - Correct violin fill alpha (0.38) within the spec's 0.3-0.5 guidance, keeping swarm
    points visible through the fill
  - Exact Imprint canonical palette order (green/lavender/blue/ochre) and correct
    theme-adaptive chrome in both light and dark renders
  - Deterministic seeded LCG + Box-Muller normal sampling gives reproducible data
    with no network dependency
  weaknesses:
  - Swarm points share the same hue as their violin fill, differentiated only by a
    thin pageBg stroke; the spec suggests a contrasting color for points vs. violin
    fill for better data/context separation — consider a neutral/ink-toned point fill
  - In the densest bands (e.g. Tactile ~350-410ms, Auditory ~260-300ms), points pack
    tightly enough that individual observations partially merge into a solid mass,
    working against the 'reveal actual observations' goal of the swarm layer — consider
    a smaller point radius or looser collision padding in high-density categories
  - Several small helper functions (kernelEpanechnikov, kde, halfWidthAt, rand/randNormal)
    push the script past a strict linear KISS structure; justified by the KDE/beeswarm
    math but worth noting for CQ-01
  image_description: |-
    Light render (plot-light.png):
      Background: Warm cream off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-swarm · javascript · d3 · anyplot.ai" bold dark ink, centered top. Y-axis title "Reaction Time (ms)" and x-axis title "Stimulus Condition" in dark ink. Tick labels dark and crisp. Horizontal gridlines subtle light-gray, visible but not dominant.
      Data: Four violins (Visual, Auditory, Tactile, Multimodal) colored green/lavender/blue/ochre in canonical Imprint order; first series is #009E73 green. Each violin has a translucent (~38% opacity) fill with a solid-color outline, and individual swarm dots (same hue as the violin, thin pale stroke) layered inside, confined to the violin's smoothed outline via force-simulation collision.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and both axis titles render in light/off-white ink, fully legible. Tick labels are light and crisp. Gridlines are faint light lines, still visible without overpowering the plot.
      Data: Same four violins, identical hues and opacity to the light render (green/lavender/blue/ochre) — only the chrome (background, text, grid, axis lines, point stroke color) flips between themes. Swarm dots keep their pageBg-colored stroke, which is now dark, giving a subtle separating halo against the fill in both themes.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed.
