review:
  strengths:
  - 'Violin outlines are hand-built from a Silverman-bandwidth KDE rendered as two
    Chart.js line datasets with fill: ''-1'' — a native, plugin-free technique fully
    compliant with chartjs.md''s "no workarounds" rule.'
  - Beeswarm jitter algorithm clips point offsets to the local violin half-width,
    so swarm points spread outward but never escape the violin boundary, matching
    the spec's explicit containment requirement.
  - 'Correct Imprint canonical palette order across all 4 categories (green -> lavender
    -> blue -> ochre), identical hues in both themes, with theme-correct #FAF8F1 /
    #1A1A17 backgrounds.'
  - Deterministic mulberry32-seeded PRNG produces reproducible data with no external
    RNG dependency.
  - Scatter marker stroke uses t.pageBg (theme-adaptive) instead of a hardcoded white
    edge, giving clean point separation on both light and dark surfaces.
  - Tooltip is filtered to the scatter dataset only, with a readable category + ms
    label callback — useful interactivity for the HTML detail view without cluttering
    the static PNG.
  - 'animation: false and the mount-node contract (single canvas appended to #container,
    no fixed width/height) are followed exactly.'
  weaknesses:
  - In the densest bins (e.g. Placebo and Low-Dose Caffeine near their medians), swarm
    points sit close enough to visually touch — widen the jitter spacing constant
    or increase binCount slightly for more breathing room while staying inside the
    violin.
  - No color legend; the category-to-color mapping relies solely on the x-axis tick
    labels beneath each violin. Acceptable given the categorical x-axis carries the
    same labels, but a cropped/zoomed view of just the plot area would lose the color
    key.
  - Data storytelling relies entirely on the natural spread/position contrast between
    categories — no secondary emphasis device (e.g. a subtle median tick or annotation)
    reinforces the comparison.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "violin-swarm · javascript · chartjs · anyplot.ai" bold and dark, clearly readable. X-axis title "Experimental Condition" and Y-axis title "Reaction Time (ms)" both dark ink, legible. Tick labels (category names on x, ms values on y) are medium-gray, clearly legible against the light background. Subtle horizontal gridlines on the y-axis only.
      Data: Four violins (Placebo, Low-Dose Caffeine, High-Dose Caffeine, Sleep-Deprived) in canonical Imprint order — green, lavender, blue, ochre. Each violin outline is filled at ~40% alpha with individual jittered swarm points (same hue, page-bg-colored stroke) overlaid inside the violin boundary. First series (Placebo) is the brand green #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all switch to light ink tones and remain clearly readable against the dark background. Gridlines are still subtle but visible.
      Data: Same four violins, identical hues to the light render (green, lavender, blue, ochre) — only the chrome (background, text, grid) flipped, exactly as required. No dark-on-dark or light-on-light failures observed anywhere (title, axis labels, tick labels all pass contrast).
      Legibility verdict: PASS
