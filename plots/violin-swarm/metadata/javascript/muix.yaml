review:
  strengths:
  - Custom SVG violin+swarm composition (KDE density, beeswarm collision-avoidance
    packing, median tick) built entirely on the community `@mui/x-charts` surface
    via the documented useXScale/useYScale hook composition pattern — the community
    package has no native violin/swarm chart type.
  - Bimodality detection with a valley-depth check correctly finds and callouts the
    genuine second mode in the Sleep-deprived condition, without false-flagging shoulder
    noise in the unimodal conditions — real data storytelling, not decoration.
  - Theme-adaptive swarm points and median tick (fill/stroke driven by t.ink / t.pageBg)
    keep full contrast in both light and dark renders with zero extra branching.
  - Deterministic fixed-seed LCG with four distinctly-shaped per-condition samplers
    (normal, bimodal mixture, right-skewed) gives the swarm points real structure
    to reveal.
  - Violin alpha (0.38) sits inside the spec's recommended 0.3-0.5 range, and swarm
    point offsets are capped by the violin's local density envelope so points never
    escape the violin boundary.
  weaknesses:
  - The 'second mode' annotation text is set at fontSize=11 (CSS px in the 1600px
    mount) — noticeably smaller than the 14px tick / 16px axis-label baseline, and
    likely to become hard to read once scaled down to the ~400px mobile srcset variant.
  - The horizontal grid (ChartsGrid, opacity 0.2) is only barely visible in both renders
    — still technically present and not a legibility failure, but on the faint edge
    of 'subtle but visible'.
  - The implementation leans on several small helper functions (lcg, kdeAt, findPeaks,
    layoutSwarm, stdOf, bandwidthOf) to hand-roll KDE, peak-finding, and beeswarm
    packing — justified by MUI X's lack of a built-in violin/swarm type, but it is
    function-heavy relative to the KISS ideal for simpler chart types.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-swarm · javascript · muix · anyplot.ai" top-left in dark ink, fully visible with clear margin above it (verified via crop — no clipping). Y-axis label "Reaction Time (ms)" rotated along the left edge, dark and readable. X-axis category labels (Baseline, Caffeine, Sleep-deprived, Dual-task) dark, fully visible with clear margin below (verified via crop). Tick labels dark and legible. Horizontal grid lines present but very faint (opacity 0.2) — subtle, still visible on close inspection.
      Data: Four violins in Imprint palette order — Baseline = brand green #009E73, Caffeine = lavender, Sleep-deprived = blue (desaturated toward slate-grey by the 0.38 fill alpha, as expected), Dual-task = ochre. Dark-ink swarm points with light (page-bg) stroke sit inside each violin, tightly packed via beeswarm layout with no visible overlap. A light (page-bg-colored) median bar crosses each violin. The Sleep-deprived violin carries a dashed leader + "second mode" label pointing at its secondary density hump.
      Legibility verdict: PASS — all title/axis/tick text reads clearly against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis label, and category labels now rendered in light ink, fully visible with the same clear top/bottom margins (re-verified via crop on this render). Grid lines equally faint but present.
      Data: Same four violin colors as the light render (green/lavender/blue/ochre) — confirmed identical data hues, only chrome flipped. Swarm points are now light-filled with a dark (page-bg) stroke — correctly re-derived from the theme tokens rather than hardcoded, so contrast against the mid-toned violin fill holds in both directions. The median bar is now a dark stripe against each violin, still clearly visible. The "second mode" annotation and leader line remain legible in the lighter secondary-text tone.
      Legibility verdict: PASS — no dark-on-dark failures; every chrome element (title, axis label, ticks, category labels, annotation) is clearly readable against the near-black background.
