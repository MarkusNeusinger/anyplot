review:
  strengths:
  - Builds the violin and swarm as a custom SVG layer inside ChartsContainer, reading
    the chart's own band and linear scales through useXScale/useYScale, so violins
    and points share MUI X's axes, grid and layout instead of a parallel coordinate
    system
  - Swarm offsets are capped per point by the violin's own density at that value (maxOffset
    from valueDensity), so every point keeps its exact value and stays inside the
    violin outline in all four groups
  - Violins are normalized to their own peak and the grid ends two bandwidths past
    each group's range, so tails end near the data and the shared value axis (280-680
    ms) is not forced to zero
  - 'Data scenario exercises the plot type well: a symmetric baseline, a tighter shifted
    caffeine group, a bimodal sleep-deprived group and a right-skewed dual-task group,
    50 deterministic LCG-seeded trials each'
  - 'Theme handling is complete: violin fills at 0.38 opacity in palette positions
    1-4 identical in both renders, swarm points in ink with a page-colored outline,
    median bars knocked out in the page color, all chrome from ANYPLOT_TOKENS'
  weaknesses:
  - 'CQ-04 (code): a density-mode detection pass (lines 82-101, about 20 lines with
    three tuning constants PEAK_MIN_HEIGHT, PEAK_MIN_SEPARATION, PEAK_VALLEY_RATIO)
    plus the leader/label block (lines ~190-205) exists only to draw the ''second
    mode'' callout, which the spec does not request → remove the mode detection, the
    callout and the subtitle clause that describes it. Likely cause: an annotation
    layer added beyond the spec''s scope.'
  - 'Suggestion: the x-axis band of 72 px leaves a wide empty gap between the category
    tick labels and the ''Condition'' axis title; a band of about 50 px would tighten
    the bottom of the chart.'
  - 'Suggestion: in the Baseline lower tail two points near 350 ms partly overlap
    because the violin is narrow there; a marker radius of 4 px would let the swarm
    separate them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "violin-swarm · javascript · muix · anyplot.ai" top-left (~30% width) with a soft-ink subtitle "200 observations in 4 groups · bar: median · dashed leader: second density mode"; y-axis "Reaction time (ms)" with ticks 280-680 every 20; x-axis "Condition" with Baseline, Caffeine, Sleep-deprived, Dual-task; subtle horizontal grid. All text dark on light and readable.
      Data: four translucent violins (fill ~0.38) with same-hue outlines - Baseline #009E73 green, Caffeine purple, Sleep-deprived blue, Dual-task ochre - each with 50 near-black swarm points with thin page-colored outlines, centered and spread sideways inside the outline; a page-colored median bar across each violin; a dashed leader and "second mode" label to the right of the Sleep-deprived violin at ~583 ms.
      Legibility verdict: PASS

