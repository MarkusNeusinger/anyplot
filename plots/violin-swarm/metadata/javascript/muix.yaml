review:
  strengths:
  - Composes ChartsContainer with a custom SVG layer driven by useXScale/useYScale,
    so violins and swarm share MUI X's band and linear scales, grid and axes instead
    of a hand-built coordinate system
  - Per-category Gaussian KDE (Silverman bandwidth) with tails ending two bandwidths
    past each group's data, so every violin tapers near its own range on a shared,
    non-zero value axis
  - Beeswarm places every point at its exact value and offsets it sideways only within
    the violin's outline at that value; all 200 points stay individually visible
  - Data scenario gives each condition its own shape (normal baseline, faster caffeine,
    bimodal sleep-deprived lapses, right-skewed dual-task), so the violins genuinely
    show why density plus raw points matter
  - 'Theme-adaptive points and median bar: ink-filled points with a page-colored halo
    and a page-colored median bar read on both surfaces while the Imprint fills stay
    identical across themes'
  weaknesses:
  - 'Suggestion: the x-axis title ''Condition'' sits about 60 px below the tick labels;
    a smaller x-axis band height would tie it to its axis.'
  - 'Suggestion: an interactive tooltip on the swarm points (value per trial) would
    add value in the HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold title "violin-swarm · javascript · muix · anyplot.ai" top-left with a soft-ink subtitle "200 observations in 4 groups · bar: median"; y-axis "Reaction time (ms)" with ticks 280-680 every 20 ms; x-axis "Condition" with Baseline, Caffeine, Sleep-deprived, Dual-task. Subtle horizontal grid. All text dark and readable.
      Data: four translucent violins in Imprint order (green #009E73 Baseline, lilac Caffeine, blue Sleep-deprived, ochre Dual-task) with matching outlines; 50 near-black swarm points per violin with thin page-colored outline, centered on each violin's axis; white median bar per violin. Sleep-deprived shows a clear second mode near 600 ms, Dual-task a long upper tail.
