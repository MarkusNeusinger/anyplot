review:
  strengths:
  - 'Sophisticated from-scratch violin+swarm composition via ChartContainer/useXScale/useYScale:
    a real Gaussian KDE with Silverman bandwidth, and each violin''s density grid
    is clipped to its own local support (data range ± 3 bandwidths) rather than the
    shared Y range, avoiding the pinched-hairline artifact a naive shared-grid approach
    would produce.'
  - Beeswarm packing resolves collisions in on-screen pixel space and caps horizontal
    offset by the violin's own density envelope at that value, so points spread for
    readability but never cross the violin boundary — confirmed visually in a zoomed
    crop, no overlapping markers.
  - 'Correct Imprint palette usage: first series is brand green, canonical order for
    the 4 abstract condition categories, identical data colors between light and dark
    renders, both chrome themes fully readable with no dark-on-dark or light-on-light
    issues, no edge clipping on either render.'
  - Data setup closely matches the spec's own example (4 experimental conditions,
    50 trials each, reaction time in ms) and gives each condition a distinct distribution
    shape (normal, bimodal via a lapse-probability mixture, right-skewed dual-task)
    so the swarm overlay is genuinely informative rather than decorative.
  weaknesses:
  - 'LM-02: the entire chart body (violin path + swarm circles) is hand-drawn SVG;
    only the grid and axes come from native MUI X components. This is the documented,
    correct workaround for a chart type the community package doesn''t ship, but it
    means no distinctive native MUI X feature (tooltip formatter, legend, native marker/animation
    API) is actually exercised — limits the Library Mastery score even though the
    composition technique itself (LM-01) is idiomatic.'
  - 'DE-03: visual hierarchy relies entirely on the plot type''s inherent structure
    (density shape + raw points); nothing calls extra attention to the most interesting
    distributional feature already present in the data (e.g. the bimodal split in
    Sleep-deprived, visible as two point bands around 480ms and 580-620ms). A subtle
    annotation or emphasis there would turn a technically correct chart into a stronger
    data story.'
  - 'DE-01: solid but not maximal aesthetic sophistication — consider a small refinement
    like a thin median/quartile tick inside each violin (a common violin-plot embellishment)
    to add one more layer of information without breaking the clean layered-SVG approach
    already in place.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "violin-swarm · javascript · muix · anyplot.ai" top-left in dark ink, clearly legible. Y-axis label "Reaction Time (ms)" rotated on the left, dark and readable. X-axis category labels (Baseline, Caffeine, Sleep-deprived, Dual-task) legible at the bottom. Horizontal grid lines are subtle (opacity 0.2), visible but not dominant. No vertical gridlines (y-axis-only grid, matches style guide guidance).
      Data: Four violins, each a distinct Imprint hue in canonical order — Baseline is brand green (#009E73), Caffeine is lavender, Sleep-deprived is blue, Dual-task is ochre — all at ~0.38 fill opacity with a matching-color 1.75px stroke outline. Swarm points are dark ink-filled circles with a thin light stroke, clearly visible against every violin fill and against each other (verified via a zoomed crop of the densest cluster — points are well separated, no overlapping circles). Points visibly widen where the violin is wide and narrow near the tails, confirming they respect the local density envelope.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no light-on-light issues; no clipping at any canvas edge (checked title and the tallest violin peak, which stays well clear of the top border).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title, y-axis label, tick labels, and category labels all render in light/white text, fully legible against the dark background — no dark-on-dark failures observed anywhere. Grid lines remain subtle and visible.
      Data: Same four violin hues as the light render — green, lavender, blue, ochre — confirming the data colors are identical between themes and only chrome flipped. Swarm point fill flips from dark ink to a light/cream ink (following the theme-adaptive `t.ink` token), keeping strong contrast against the colored violin fills in this theme too.
      Legibility verdict: PASS — all text and data elements are clearly readable in dark mode; no theme-adaptation failures found.
