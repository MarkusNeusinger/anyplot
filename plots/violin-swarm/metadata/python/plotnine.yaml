review:
  strengths:
  - Theme tokens threaded through every chrome element; both renders readable with
    identical Imprint data colors
  - Translucent violin fill (alpha 0.35) keeps every point visible in both themes
  - Shared value axis not forced to zero; plotnine's trimmed violins end at each group's
    data range
  - Data shows four distinct shapes, including a bimodal and a wide skewed group
  weaknesses:
  - 'SC-02 (both): points are placed with random geom_jitter (width 0.15) instead
    of a swarm layout, so several land outside the violin outline (Control at ~535
    ms left of the body, Treatment B at ~343 ms and ~630 ms, Treatment C at ~481 ms
    and ~520 ms right of the thin upper tail) → compute swarm offsets per category
    that stay within the violin''s half-width at each value (numeric x position +
    offset, e.g. density-scaled beeswarm via scipy.stats.gaussian_kde). Likely cause:
    geom_jitter(position=position_jitter(width=0.15)).'
  - 'DE-02 (both): a full four-sided panel border frames the plot, where the style
    guide asks for an L-shaped frame (left and bottom) or none → remove panel_border
    and keep axis_line on the left and bottom only. Likely cause: panel_border=element_rect(color=INK_SOFT,
    ...).'
  - 'DQ-02 (both): the conditions are labelled ''Treatment A'', ''Treatment B'', ''Treatment
    C'', which read as placeholders → name the conditions (e.g. ''Caffeine'', ''Sleep-deprived'',
    ''Dual-task''). Likely cause: the conditions list.'
  - 'Suggestion: a median tick or marker inside each violin would give the eye a reference
    point beside the raw points.'
