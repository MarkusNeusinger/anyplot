review:
  strengths:
  - 'True swarm layout: each point takes the smallest sideways offset clear of its
    neighbours, so all 50 observations per group stay individually visible while sitting
    at their exact values'
  - Violins are evaluated only one bandwidth past each group's own range, so tails
    end near the data and the shared y axis is not forced to zero
  - Translucent violins (opacity 0.4) with opaque, page-outlined points read clearly
    in both themes, with identical Imprint colours
  - 'Native Altair layering: mark_area(orient=''horizontal'') with x/x2 for mirrored
    violins and labelExpr for category labels on a quantitative axis'
  - Tooltips with condition and value on every swarm point in the HTML view
  - 'Adaptable structure: column constants, one Data block, and the plot code reads
    only df'
  weaknesses:
  - 'SC-02 (both): in Condition D''s widest rows (about 400-420 ms) the outermost
    swarm points sit on or past the violin outline, half their disc outside the fill,
    against C2 (staying inside the violin''s outline) → every point inside the outline
    (about -0.05 category units at the widest row). Likely cause: swarm offsets are
    not checked against the KDE half-width at that value; VIOLIN_HALF_WIDTH 0.4 is
    too narrow for POINT_SIZE 40 at 50 points.'
  - 'DQ-02 (both): the groups are labelled ''Condition A''-''Condition D'', which
    read as placeholders → named conditions of a reaction-time study (e.g. ''Control'',
    ''Dual task'', ''Sleep deprived'', ''Caffeine''). Likely cause: the label list
    in the Data block.'
  - 'Suggestion: a sample size per group (n = 50) under the category labels would
    make the transparency claim of the plot explicit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800, chart centred with page-coloured padding.
      Chrome: title 'violin-swarm · python · altair · anyplot.ai' bold dark at top centre; y-axis title 'Reaction time (ms)' with ticks 200-700; x-axis title 'Condition' with labels Condition A-D; subtle horizontal grid; left and bottom domain lines in INK_SOFT. All text dark and readable.
      Data: four translucent violins (green #009E73, purple #C475FD, blue #4467A3, ochre #BD8233) at opacity 0.4, each with 50 opaque swarm points in the same hue with a thin off-white outline; A normal around 310, B right-skewed with a tail to 700, C bimodal at about 290 and 400, D tight around 410. Points spread sideways in packed rows; in D's widest rows the outermost points touch or cross the violin outline.
