review:
  strengths:
  - Swarm points are darker shades of each violin's own Imprint hue with a thin theme-ink
    edge, so every point set reads as belonging to its violin and stays visible on
    the translucent fill in both themes
  - cut=0 ends each violin at its data range, so tails do not imply values that were
    never observed
  - 'Idiomatic seaborn: hue=+legend=False, inner=None, sns.swarmplot''s native beeswarm
    layout, sns.despine and set_theme rc tokens for both themes'
  - Data shows a bimodal Oligodendrocyte group and a long upper tail in Microglia,
    exercising the density-plus-points combination
  weaknesses:
  - 'VQ-06 (both): the y-axis title ''Expression Level'' has no unit → add one, e.g.
    ''Expression Level (a.u.)''. Likely cause: EXPRESSION column constant used verbatim
    as the y label.'
  - 'Suggestion: a subtle median tick inside each violin could anchor comparison across
    groups.'
