review:
  strengths:
  - Swarm dots in one theme-ink color contrast with every translucent Imprint violin
    and flip cleanly between themes
  - Separate fill and stroke-only outline series with an inline CSS rule remove pygal's
    baseline-closing stroke, giving clean violin edges
  - Swarm placement keeps every point at its value and inside 92 % of the local violin
    half-width
  - 'Bimodal 50 °C group shows what the violin+swarm combination is for: the waist
    and the two dot clusters agree'
  - 'Correct canonical 3200x1800 canvas with style-guide font sizes and Imprint order
    starting at #009E73'
  - pygal HTML export gives native hover tooltips on every swarm point
  weaknesses:
  - 'VQ-05 (both): the y tick "50" renders at about 44 px while the other y ticks
    (10, 20, 30, 40, 60) render at about 56 px, so one tick label reads smaller than
    its neighbours → one size for all tick labels (set label_font_size and major_label_font_size
    equal, e.g. both 44, −12 px on the minor ticks). Likely cause: Style(label_font_size=56,
    major_label_font_size=44); pygal draws the major tick 50 with the major size.'
  - 'CQ-04 (code): lines 58–63 hand-roll a Gaussian KDE with Silverman''s bandwidth
    that an available call computes → scipy.stats.gaussian_kde(values, bw_method="silverman")(grid).
    Likely cause: density written out by hand.'
  - 'Suggestion: the dark render''s dotted y guides are very faint against #1A1A17;
    a slightly stronger guide color would help reading values across the violins.'
