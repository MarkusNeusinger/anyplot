      Data: four translucent violins (Control #009E73, Low Dose #C475FD, Medium Dose #4467A3, High Dose #BD8233) with dark-grey outlines, 50 jittered points each in the same hue; High Dose bimodal; a few tip points sit just outside the trimmed violin tips
