review:
  strengths:
  - 'Points and violins share the Imprint hue per category (scale_fill_manual + scale_color_manual),
    Control first in #009E73'
  - Translucent violin fill (alpha 0.4) keeps every point visible in both themes
  - trim=True ends each violin at its data range on a shared, non-zero y-axis
  - Points sit at their exact values (height=0), with only categorical sideways offset
  - Interactive HTML export with lets-plot tooltips alongside the PNG
  weaknesses:
  - 'DE-02 (both): a full four-sided panel frame encloses the plot → L-shaped frame
    (left and bottom axis lines only), as the style guide''s Spines rule asks. Likely
    cause: theme_minimal() plus axis_line, with a panel border still drawn; set panel_border=element_blank().'
  - 'SC-02 (both): points use random geom_jitter, so they do not spread to avoid overlap
    as the Notes ask, and points at the trimmed tips (e.g. Control ~578 and ~333 ms,
    Medium Dose ~583 and ~231 ms) sit beside the violin outline instead of inside
    it (C2) → a swarm-style offset that scales with the local density so points stay
    inside the outline. Likely cause: geom_jitter(width=0.1) with a fixed width independent
    of the density.'
  - 'VQ-03 (dark): the violin outline is lets-plot''s default dark grey and reads
    weakly against #1A1A17 → outline in the theme''s INK_SOFT token. Likely cause:
    geom_violin(size=0.8) without a color argument.'
  - 'Suggestion: lighter violin outlines (thinner stroke) would let the fills carry
    the shape.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, full four-sided dark-grey panel frame, subtle grey major grid
