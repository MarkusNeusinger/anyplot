review:
  strengths:
  - Hand-laid beeswarm keeps every point at its exact glucose value and spreads only
    sideways, centred on each violin (C1, C2)
  - go.Violin with spanmode='hard' ends each density at its data range on one shared,
    non-zero value axis (C5)
  - 'Translucent #009E73 violins with #C475FD points outlined in the page color stay
    distinct in both themes'
  - Data shows narrow, right-skewed, bimodal and wide groups, so the violins differ
    visibly in shape
  - Per-group hovertemplate gives exact values in the HTML view
  weaknesses:
  - 'VQ-02, SC-02 (both): at the outer ends of the Healthy and Pre-diabetic violins
    several swarm points are clamped onto the same x and pile on top of each other,
    and their markers straddle the violin outline → each point stays separate and
    inside the outline, by thinning the swarm there with a smaller marker or by matching
    the clamp width to the drawn violin. Likely cause: np.clip(xs, -0.9 * half_width,
    0.9 * half_width) after the collision pass, with half_width taken from a scipy
    gaussian_kde whose bandwidth differs from the KDE plotly draws.'
  - 'Suggestion: a light median tick inside each violin could anchor comparison across
    groups.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'violin-swarm · python · plotly · anyplot.ai' centred in dark ink; y-axis 'Fasting glucose (mg/dL)' 75-265 with ticks 100/150/200/250 and subtle horizontal grid; x-axis 'Clinical group' with Healthy, Pre-diabetic, Type 2, untreated, Type 2, treated. Left and bottom axis lines only, no tick marks. All text readable.
      Data: four translucent #009E73 violins with a green outline, cut at each group's data range; violet #C475FD swarm points with off-white outlines centred on each violin. Healthy is a narrow flat lens near 90, Pre-diabetic a flat lens near 105 with a thin upper tail to 137, Type 2 untreated a tall bimodal violin (modes ~150 and ~215, outlier 263), Type 2 treated a rounded violin near 120. At the ends of the Healthy and Pre-diabetic lenses a few points stack on each other and touch the outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels in light ink, clearly readable; grid subtle light lines; no dark-on-dark text.
      Data: identical #009E73 violins (fill darker-looking through translucency on the dark page) and identical #C475FD points, now outlined in the near-black page color; same positions as the light render.
      Legibility verdict: PASS
