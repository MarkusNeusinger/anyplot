review:
  strengths:
  - Violin tails end about 10% of the data range past each group's extremes (pad =
    0.1 * ptp), so every violin hugs its data on one shared value axis not forced
    to zero
  - Sideways point offsets are bounded by the KDE outline at each value, so every
    point stays inside its violin and at its true value
  - 'Theme tokens threaded through every chrome element: both renders are fully readable,
    data colors identical'
  - HoverTool exposes condition and reaction time per observation in the HTML view
  weaknesses:
  - 'SC-02 (both): the points are spread by uniform random jitter (rng.uniform(-limit,
    limit)), so they scatter at random instead of forming a swarm that spreads sideways
    to avoid overlap; a few pairs touch (Medium Dose near 232 ms, Low Dose near 296
    ms) → a beeswarm layout that places each point at the nearest free sideways offset
    within the violin outline. Likely cause: the random offset line in the swarm loop.'
  - 'Suggestion: draw the points in a contrasting chrome color (INK outline or INK_SOFT
    fill) so they stand out more against the green violin fill in the dark render,
    as the Notes allow.'
  - 'Suggestion: use bokeh''s native categorical offsets (factor, offset) tuples instead
    of the hand-computed i + 0.5 positions.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on the full 3200x1800 canvas
      Chrome: bold title 'violin-swarm · python · bokeh · anyplot.ai' top left; italic axis titles 'Experimental condition' and 'Reaction time (ms)'; tick labels Control / Low Dose / Medium Dose / High Dose and 150-450; thin outline box; subtle grid. All dark text, readable
      Data: four translucent #009E73 violins (alpha 0.4, 4-px green outline), each centred on its category tick, with 50 green points (alpha 0.75, grey outline) scattered inside each outline; Control highest (~230-460), High Dose lowest (~170-375), Low Dose with a thin lower tail to ~185
      Legibility verdict: PASS

