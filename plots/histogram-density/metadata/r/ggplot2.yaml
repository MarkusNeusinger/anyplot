review:
  strengths:
  - Clean, idiomatic ggplot2 density histogram using the current API (`aes(y = after_stat(density))`),
    not the deprecated `..density..` syntax
  - Bar borders are colored to match PAGE_BG, creating crisp bin separation that adapts
    correctly between light and dark themes
  - Fitted normal PDF overlay directly visualizes goodness-of-fit against the empirical
    distribution, addressing the spec's suggested 'theoretical PDF overlay' feature
    and giving the plot a clear analytical narrative
  - Legend is generated via an aes(color=) mapping trick and placed inside the plot
    area, which is compact and avoids wasting canvas space
  - 'Both renders are fully theme-correct: backgrounds match the spec hex values,
    all text is legible, and data colors (green bars, blue curve) are identical across
    themes'
  - Realistic, neutral dataset (simulated adult height, n=800) is an appropriate,
    classic choice for demonstrating a density histogram against a fitted normal curve
  weaknesses:
  - 'The fitted-curve series uses IMPRINT_PALETTE[3] (blue, canonical position 3)
    instead of canonical position 2 (lavender #C475FD) for the second series, with
    no strong semantic justification for skipping position 2 — per the Imprint canonical-order
    rule, default to position 2 unless the category has a widely-shared real-world
    color association (a theoretical/reference curve arguably fits the ''neutral''
    semantic anchor better than an arbitrary jump to blue).'
  - '`library(dplyr)` is imported but never used anywhere in the script (data prep
    only uses `tibble::tibble`, `rnorm`, and `dnorm`) — remove the unused import.'
  - The mandated title occupies only ~40-45% of the canvas width, noticeably more
    modest than typical implementations of the same bare `{spec-id} · {lang} · {lib}
    · anyplot.ai` format — consider bumping `plot.title` size slightly (e.g. 12 ->
    14) for better visual prominence on the 3200x1800 canvas without hurting legibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the expected #FAF8F1 — not pure white.
      Chrome: Title "histogram-density · r · ggplot2 · anyplot.ai" in dark ink at top-left, fully visible with no clipping. X-axis label "Height (cm)" and Y-axis label "Density" in dark ink, clearly legible. Tick labels (160-200 on x, 0.00-0.06 on y) in a slightly softer dark gray, all readable. Only horizontal (y) gridlines are drawn, subtle and unobtrusive. Legend "Normal density" sits inside the plot's top-right, over empty space where the histogram has already tapered to near-zero, so it doesn't collide with any bars.
      Data: Histogram bars are solid Imprint brand green (#009E73) with thin off-white (PAGE_BG-colored) borders separating bins, forming a clear right-skewed-then-symmetric near-normal bell shape peaking around 174-175 cm. A smooth blue (#4467A3) line traces the fitted normal PDF closely following the bar heights. No text overlaps data or other text.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the expected #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light ink/off-white and near-white respectively, all clearly legible against the dark background. Gridlines are now a faint light color, still subtle. Legend text "Normal density" is light-colored and readable in the same top-right in-plot position.
      Data: Bars remain the identical Imprint brand green (#009E73), now with dark (PAGE_BG-colored) borders instead of light ones, still crisply separating the bins. The fitted-curve line remains the identical blue (#4467A3) as in the light render — confirms the data colors are unchanged between themes and only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; every text element is clearly visible against the near-black surface.
