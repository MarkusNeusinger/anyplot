review:
  strengths:
  - Density normalisation via np.histogram(density=True) so bar areas sum to 1, on
    a y axis labeled 'Density (probability per unit)'
  - Normal PDF fitted from the sample (μ and σ computed and shown in the legend) drawn
    over the bars in Imprint position 2 with a 6 px line
  - Theme tokens threaded through every chrome element; both renders readable, data
    colors identical
  - Correct 3200x1800 canvas via toolbar_location=None and the CDP viewport override;
    interactive HTML saved alongside the PNG
  weaknesses:
  - 'DQ-03 (both): np.random.normal(75, 12) puts test scores up to about 122, with
    bars beyond 100 on what reads as a 0–100 test-score scale → keep every generated
    score within 0–100 (for example a smaller σ around 8 or a lower mean, or scores
    bounded in the generator). Likely cause: unbounded np.random.normal(loc=75, scale=12,
    size=500).'
  - 'Suggestion: scipy.stats.norm.pdf(x_pdf, mu, sigma) could replace the written-out
    normal PDF formula.'
