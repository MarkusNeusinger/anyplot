  strengths:
  - Native histnorm='probability density' with bargap=0 gives contiguous bars whose
    areas sum to 1 without manual normalization
  - 'KDE overlay in Imprint #C475FD sits on the same density scale and contrasts clearly
    with the #009E73 bars, named in the legend'
  - Theme tokens threaded through title, axes, grid and legend; both renders fully
    readable with identical data colors
  - Bimodal test-score data makes the density curve informative, and the 5-point bins
    show both modes and the tails
  - Custom hovertemplates expose score range and density in the interactive HTML
  weaknesses:
  - 'Suggestion: set yaxis rangemode=''tozero'' so the x-axis line meets the zero
    baseline instead of sitting a small strip below it.'
  - 'Suggestion: a fitted two-component normal mixture would add a theoretical PDF
    alongside the empirical KDE.'
