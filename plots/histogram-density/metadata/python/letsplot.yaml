review:
  strengths:
  - 'Density bars come straight from lets-plot''s computed stat (aes(y="..density..")),
    so the bar areas sum to 1 by construction and the y axis reads as density: the
    0.040 peak matches the fitted normal''s 1/(σ√2π) ≈ 0.0395 for σ = 10.1.'
  - Contiguous bins with thin page-colored seams (color=PAGE_BG) keep the 25 bars
    separable without gaps, in both themes.
  - Normal fit drawn over the bars in the high-contrast INK token, identified by a
    legend entry that carries the fitted μ and σ, inset in the empty upper-right corner
    on the elevated surface.
  - 'The bimodal exam-score mixture (main group plus a high-performer cluster near
    88) makes the spec''s goodness-of-fit use case visible: the bars rise above the
    normal curve at 85–90 and fall below it at 80–85.'
  - 'Clean theme threading: PAGE_BG, INK, INK_SOFT, RULE and ELEVATED_BG drive every
    chrome element, the x grid is removed for the bar chart and the y grid kept at
    15 % ink, and y ticks share one fixed precision.'
  - Native lets-plot HTML export alongside the PNG gives hover tooltips on bars and
    the curve in the interactive view.
  weaknesses:
  - 'Suggestion: the x-axis tick ''40'' sits close to the y-axis ''0.000'' label in
    the lower-left corner; trimming the x expansion on the left (no data below 44)
    would give the corner more air.'
  - 'Suggestion: a thin dashed or slightly lighter rendering of the fit line could
    separate the theoretical curve from the empirical bars a little more without losing
    contrast.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel, 3200x1800 landscape.
      Chrome: bold near-black title "histogram-density · python · letsplot · anyplot.ai" top-left at about 55 % width; x-axis title "Test score (points)", y-axis title "Density (per point)" in INK; tick labels 40–105 and 0.000–0.040 in dark grey INK_SOFT; subtle horizontal grid only; solid x-axis line. All readable.
      Data: 25 contiguous brand-green #009E73 bars (alpha 0.9) with thin off-white seams, rising from 0 to a 0.040 peak at 72–77, a second bump near 88, empty bins near 48 and 53 in the left tail. A thick near-black normal-fit curve (μ = 76.1, σ = 10.1) overlays the bars. Legend inset top-right on an #FFFDF6 box: line sample + "Normal fit / μ = 76.1, σ = 10.1".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light #F0EFE8, ticks in light grey, faint light grid lines; no dark-on-dark text anywhere. Legend box on #242420 with light text.
      Data: bars in the identical #009E73 green with dark page-colored seams; the normal-fit curve flips to light ink and stays high-contrast. Data positions identical to the light render.
      Legibility verdict: PASS
