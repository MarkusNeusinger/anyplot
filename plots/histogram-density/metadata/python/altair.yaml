review:
  strengths:
  - True density normalization via np.histogram(density=True) with a y-axis titled
    'Density (probability per ms)', so bar areas sum to 1 and the tick values follow
    from the ms unit
  - Contiguous bars over 25 consistent bins rise from a zero baseline; page-colored
    0.6 px bar strokes separate bins without opening gaps
  - Bimodal reaction-time scenario (baseline vs. fatigued trials) gives the overlaid
    KDE a visible second mode and a long right tail to track
  - Dashed KDE curve on the shared density scale contrasts with the green bars in
    both themes (INK in light, light ink in dark)
  - 'Idiomatic Altair layering: alt.layer with shared x/y scales and transform_calculate
    series labels feeding one color legend'
  - Native Vega-Lite tooltips on each bin (start, end, density) in the HTML output
  - Theme tokens threaded through title, axes, grid and legend; both renders fully
    readable
  weaknesses:
  - 'VQ-03 (both): the legend draws the ''Kernel density estimate'' entry as a filled
    square swatch, while the mark it explains is a dashed 2.5 px line → show a dashed
    line sample for the KDE entry (square swatch only for the histogram). Likely cause:
    one shared alt.Color legend with default symbolType across both layers; encode
    strokeDash on the line layer or give the line layer its own legend with symbolType=''stroke''
    and symbolDash=[6, 3].'
  - 'Suggestion: compute the KDE with Altair''s transform_density on the raw values
    to keep the density curve inside the Vega-Lite spec.'
  - 'Suggestion: a short subtitle naming the two populations (baseline vs. fatigued
    trials) would explain the second mode.'
  image_description: |-
    Light render (plot-light.png):
