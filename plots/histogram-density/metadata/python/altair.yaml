review:
  strengths:
  - Contiguous rect bars over 25 consistent bins drawn with np.histogram(density=True),
    so the bar areas sum to 1 and the y axis reads 'Density (probability per ms)',
    a real per-unit density, not counts
  - The KDE overlay sits on the same density scale, drawn over the bars as a dashed
    theme-neutral line (INK) that contrasts with the brand-green bars in both themes
  - Two-component reaction-time mixture (alert baseline plus a fatigued tail) gives
    a right-skewed, bimodal outline that the 25-bin choice resolves without breaking
    into spikes
  - Each layer gets its own legend (square swatch for the bars, dashed stroke for
    the curve), so every legend glyph matches its mark
  - Bin separators in the page colour and a y-only grid keep the bars contiguous but
    countable in both themes
  - Tooltips with bin start, bin end and density add inspection to the HTML output
  - 'Theme tokens are threaded through the axes, title, legend and view: no dark-on-dark
    or light-on-light text'
  weaknesses:
  - 'Suggestion: bin and normalise in Vega-Lite (transform_bin plus a joinaggregate
    density, or transform_density for the curve) so the HTML chart stays data-driven
    instead of plotting precomputed numpy arrays.'
  - 'Suggestion: anchor the legends with orient=''top-right'' instead of fixed legendX/legendY
    pixel offsets, so they follow the view if its width changes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and view, with centred padding to 3200x1800.
      Chrome: centred bold title "histogram-density · python · altair · anyplot.ai" (~45 % of the width) in dark ink; y axis "Density (probability per ms)" with ticks 0.000–0.011; x axis "Reaction Time (ms)" with ticks 160–500; a subtle horizontal-only grid; left and bottom axis lines in INK_SOFT. All text is readable.
      Data: 25 contiguous brand-green (#009E73, opacity 0.85) bars with thin page-coloured separators, rising from 0 to a main peak of ~0.0103 at 255–270 ms, then a long right tail with a secondary bump at ~380 ms. A dashed near-black KDE curve follows the outline on the same scale. Top-right legend: green square "Histogram (area = 1)" and dashed stroke "Kernel density estimate".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 for the canvas and view.
      Chrome: title and axis titles in light ink (#F0EFE8), tick and legend labels in light grey (INK_SOFT); the grid is subtle but visible. No dark-on-dark text.
      Data: the same #009E73 bars (they look deeper only because of the 0.85 opacity over the dark page), with dark separators; the KDE curve flips to a light dashed stroke; the legend glyphs match. The data layout is identical to the light render.
      Legibility verdict: PASS
