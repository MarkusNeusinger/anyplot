review:
  strengths:
  - Native seaborn normalization via histplot(stat="density") guarantees bar areas
    sum to 1, with the KDE on the same density scale
  - Theme tokens threaded through sns.set_theme rc give correct chrome in both renders;
    Imprint positions 1 and 2 for bars and curve
  - Bimodal test-score sample with 25 bins shows skew, two clusters and sparse tails
    without spiking
  - Thin page-colored bar edges keep the bins contiguous yet legible in both themes
  weaknesses:
  - 'SC-03 (both): the KDE curve extends from about 22 to about 111 points, past the
    0–100 range the scores are clipped to, so it draws density at scores that cannot
    exist and widens the x axis to ~17–115 → end the curve at the data range (0–100
    or the observed min/max). Likely cause: sns.kdeplot without cut=0 or clip=(0,
    100).'
  - 'Suggestion: a theoretical normal-mixture PDF instead of (or next to) the empirical
    KDE would show the goodness-of-fit use the spec''s Applications describe.'
