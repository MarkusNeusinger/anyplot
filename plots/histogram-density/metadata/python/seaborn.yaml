review:
  strengths:
  - 'Native seaborn statistics: histplot(stat=''density'') normalizes bar area to
    1 and kdeplot(cut=0) overlays a density curve on the same scale without manual
    computation'
  - Bimodal two-cohort test-score data makes skew, two clusters and thin tails visible
    at a well-chosen 25 bins
  - Page-colored bar outlines separate the bins crisply in both themes while keeping
    the bars contiguous
  - Theme tokens threaded through set_theme rc; both renders fully legible with identical
    data colors
  weaknesses:
  - 'VQ-06 (both): the y-axis label reads ''Probability Density'' without a unit,
    although a density''s unit follows from the x axis → ''Probability Density (per
    point)''. Likely cause: ax.set_ylabel("Probability Density").'
  - 'Suggestion: the Notes suggest a theoretical PDF; a fitted normal-mixture curve
    (scipy.stats.norm) would show goodness of fit instead of a second empirical estimate.'
  - 'Suggestion: list the histogram before the KDE in the legend so its order matches
    the drawing order.'
