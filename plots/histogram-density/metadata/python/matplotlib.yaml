review:
  strengths:
  - Native ax.hist(density=True) normalizes the bars so their areas sum to 1, with
    contiguous 30-bin bars separated only by thin page-colored edges
  - Log-normal density fitted from the sample's log mean and log SD is drawn over
    the bars on the same density scale in contrasting Imprint purple, and the legend
    states the fitted parameters
  - Right-skewed delivery-time data shows a peak, a long tail and an isolated late
    delivery near 110 min; the mean line sits right of the fitted mode and makes the
    skew readable
  - Y-axis title carries the density unit (1/minute) that follows from the x unit,
    so the values cannot be read as counts
  - Theme tokens threaded through title, labels, ticks, spines, grid and legend frame;
    both renders fully legible on the 3200×1800 canvas
  weaknesses:
  - 'Suggestion: the hand-written log-normal formula on line 39 could be `scipy.stats.lognorm.pdf(x_pdf,
    s=sigma, scale=np.exp(mu))`, a one-line change in readability only.'
  - 'Suggestion: a slightly lower bar alpha (about 0.7) would let the fitted curve
    read more clearly where it crosses the tallest bars.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and axes, 3200×1800.
      Chrome: title "histogram-density · python · matplotlib · anyplot.ai" in dark ink at about half the width; axis titles "Delivery time (minutes)" and "Probability density (1/minute)" in dark ink; tick labels 0–100 and 0.000–0.035 in soft gray; subtle horizontal grid; top/right spines removed; legend upper right on an elevated light frame with three entries. All readable.
      Data: 30 contiguous brand-green #009E73 bars (alpha 0.8) forming a right-skewed distribution peaking at about 0.038 near 27 min, long tail to ~110 min with a lone bar there; purple #C475FD log-normal fit curve over the bars peaking at ~0.034 near 24 min; dark gray dashed mean line at 32.6 min.
