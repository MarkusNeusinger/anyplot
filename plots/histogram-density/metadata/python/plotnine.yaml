review:
  strengths:
  - 'Idiomatic grammar-of-graphics layering: geom_histogram with aes(y=after_stat("density"))
    normalizes the bars to unit area, and geom_density sits on the same density scale'
  - The KDE curve is mapped to a color aesthetic and named through scale_color_manual,
    so plotnine builds a real legend that identifies the curve ("Kernel density estimate")
  - 'Theme tokens threaded through every chrome element: correct #FAF8F1 / #1A1A17
    backgrounds, INK titles, INK_SOFT ticks, elevated legend box; both renders read
    cleanly'
  - Bar edges drawn in PAGE_BG give contiguous bars thin separators that adapt to
    the theme, and the x major grid is removed so only the y grid supports reading
    density values
  - Bimodal test-score mixture (n=500, 30 bins) shows the two modes, the dip between
    them and both tails
  weaknesses:
  - 'VQ-03 (both): the legend key for the density curve is a hollow square outline,
    not a line sample, so it does not match the line mark it explains → a horizontal
    line key in #C475FD. Likely cause: geom_density draws a polygon key glyph; draw
    the curve with stat_density(geom="line") or geom_line(stat="density").'
  - 'DQ-03 (both): the right tail runs to about 103 points (bar at 101–103), past
    the 100-point maximum a test score implies → keep every generated score at or
    below 100 (−3 points). Likely cause: np.random.normal(85, 6, 250) unbounded; lower
    the upper mode''s mean or spread, or clip to 100.'
  - 'Suggestion: a normal-mixture PDF instead of (or beside) the KDE would show the
    theoretical overlay the Notes mention.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 landscape canvas.
      Chrome: title "histogram-density · python · plotnine · anyplot.ai" in dark INK centered at top (~55% width); axis titles "Test score (points)" and "Density" in dark ink; tick labels in soft gray; subtle horizontal grid, faint minor grid; INK_SOFT panel border; legend box (elevated #FFFDF6 fill) at top right reading "Kernel density estimate". All text readable.
      Data: 30 contiguous #009E73 bars (alpha 0.8) with thin page-colored separators, bimodal with peaks near 65 and 85 points, density 0–0.036; purple #C475FD KDE curve over the bars. Legend key is a hollow purple square rather than a line sample.
