review:
  strengths:
  - Uses pygal's native Histogram chart with (density, start, end) tuples, so bars
    sit on their true bin edges on a continuous score axis
  - Bars are contiguous from a zero baseline and np.histogram(density=True) makes
    the bar areas sum to 1
  - Bin count from 1.6·√n (25 bins for 250 scores) shows the two clusters and both
    tails without breaking into spikes
  - Font sizes set explicitly at the library prompt's canvas values; all text readable
    in both themes
  - 'Axis titles are reader text with units: ''Test score (points)'', ''Density (probability
    per point)'''
  - Adaptable data block ending in a tidy df with a named column constant
  weaknesses:
  - 'VQ-07 (dark): the horizontal y guides render near-black (about #0C0C0B) on the
    #1A1A17 background, a dark-on-dark grid that barely shows → a light grid tone,
    the dark theme''s rgba(240,239,232,0.15). Likely cause: Style guide_stroke_color
    / major_guide_stroke_color not set, so pygal keeps its black default.'
  - 'Suggestion: a theoretical normal-mixture density curve over the bars would let
    readers compare the empirical shape with a model, as the Notes suggest.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241).
      Chrome: title 'histogram-density · python · pygal · anyplot.ai' dark at top centre (~59% width); y title 'Density (probability per point)' rotated left; x title 'Test score (points)'; y ticks 0–0.032 step 0.004 and x ticks 40–100 step 10, all dark and readable; dotted grey horizontal guides, subtle and visible.
      Data: 25 contiguous bars in #009E73 at pygal's 0.7 fill opacity (renders 75,185,152) with a thin darker green edge; bimodal distribution with peaks near 67 and 74–86, an empty bin near 42 and short tails to 39 and 100.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
