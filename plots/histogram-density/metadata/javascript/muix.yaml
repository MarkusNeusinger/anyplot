review:
  strengths:
  - Composes BarPlot, LinePlot, ChartsGrid and both axes inside a v9 ChartsContainer,
    so the bar and line series share one band x axis and one density y axis without
    a second chart instance
  - Density is computed correctly as count / (n * binWidth), so the bar areas sum
    to 1 and the y axis reads in 1/g; the fitted Normal PDF uses the sample mean and
    SD and sits on the same scale
  - Subtitle states n = 400, the bin width (1.98 g), the mean and the SD, giving the
    reader the scale facts needed to read a density axis
  - 18 bins for 400 observations show the bell shape and both tails without breaking
    into spikes; categoryGapRatio 0.02 keeps the bars contiguous
  - Theme tokens threaded through every text and chrome element; both renders are
    fully legible, and tickLabelInterval thins the x tick labels to every other bin
  weaknesses:
  - 'LM-01 (code): the series legend is hand-built from MUI Box and Typography elements
    (swatch divs plus labels) instead of the community ChartsLegend, which the library
    prompt names for a composed chart → render <ChartsLegend /> inside ChartsDataProvider/ChartsWrapper
    above the ChartsSurface and style it with slotProps.legend.sx. Likely cause: the
    custom legend Box block above ChartsContainer.'
  - 'Suggestion: x tick labels sit at bin centers (484.0, 487.9, 491.9 …), which read
    as odd values; ticks at bin edges or round grams would be easier to read.'
  - 'Suggestion: the subtitle repeats the unit inside nested parentheses (''Package
    weight (g) (n = 400, …)''); a plain ''Package weight · n = 400 · …'' would read
    more cleanly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "histogram-density · javascript · muix · anyplot.ai" top-left (~40% width), soft-ink subtitle with n, bin width, mean and SD, an HTML legend (green swatch "Observed density (18 bins)", lavender line "Fitted Normal PDF"). Y axis "Probability Density (1/g)" with ticks 0.000–0.075 at 0.005 steps; x axis "Package weight (g)" with every other bin center labelled (484.0 … 515.7). Subtle light grey horizontal grid. All text readable.
      Data: 18 contiguous brand-green #009E73 bars from a zero baseline, separated by hairline page-coloured edges, peaking at ~0.068 around 501.8 g; a 3.5 px lavender #C475FD fitted Normal curve drawn over the bars, peaking ~0.065 at 499.8 g, tails falling toward ~0.002.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all flip to light ink and read cleanly; grid lines dark grey and subtle. No dark-on-dark text.
      Data: identical green bars and lavender curve; bar edges now in the dark page colour. Data colours match the light render exactly.
      Legibility verdict: PASS
