review:
  strengths:
  - 'Correct density-histogram normalization: bin heights are counts divided by (N
    × bin width), so bar area sums to 1 as required by the spec.'
  - Combo bar+line chart overlays a fitted Normal PDF sampled at the bin centers,
    directly fulfilling the spec's 'consider a theoretical PDF overlay' note and giving
    the chart a clear statistical story.
  - Realistic, neutral data context (filling-line package weights, 500g nominal, SD=6g)
    with an appropriate sample size (N=400) squarely inside the spec's 50-1000 recommendation.
  - 'Imprint palette used correctly and canonically: bars use palette[0] (#009E73),
    fitted curve uses palette[1]; colors are identical between light and dark renders,
    only chrome flips.'
  - Deterministic, dependency-free data generation via a fixed-seed LCG + Box-Muller
    transform, appropriate for the browser render harness.
  - 'Both renders pass the theme-readability check: warm off-white/near-black backgrounds,
    fully legible ink/inkSoft text, subtle horizontal-only grid.'
  weaknesses:
  - Visual design leans heavily on MUI X defaults beyond the palette swap and combo-series
    choice — no additional refinement such as bar corner rounding, softened axis lines,
    or a subtitle/annotation calling out the fit quality; limits Design Excellence
    relative to a genuinely polished statistical chart.
  - Title occupies only ~44% of canvas width (well under the 50-70% guideline) because
    the title-scaling formula assumes a fixed 67-char reference length but this title
    has no descriptive prefix and is only 49 chars — not a hard fault, but a short
    descriptive prefix (e.g. 'Package Weight Distribution · ...') would fill the band
    better and add storytelling value.
  - The fitted Normal PDF line is sampled only at the 18 bin centers rather than a
    finer x-grid, so the curve looks subtly polygonal/segmented near the peak instead
    of smooth — a denser sample grid (e.g. 80-100 points) would read as a proper continuous
    PDF while still sharing the same x-domain.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matching the required light-theme surface.
      Chrome: Title "histogram-density · javascript · muix · anyplot.ai" in dark ink, top-left, comfortably sized and fully within canvas bounds. X-axis label "Package Weight (g)" and y-axis label "Density" both in dark ink, legible. Tick labels (every other x-tick shown to avoid crowding, e.g. 484, 488, 492...) in a slightly softer dark grey. Legend top-right with two swatches ("Observed density" green, "Fitted Normal PDF" purple) in dark text. Thin horizontal grid lines, subtle but visible.
      Data: 18 teal-green (#009E73) bars forming a roughly bell-shaped density histogram peaking around 500g, overlaid with a smooth purple/lilac line tracing the fitted Normal PDF that closely follows the bar peaks. First series is the mandated brand green.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matching the required dark-theme surface.
      Chrome: Same title, now in light/white ink, fully legible. Axis labels and tick labels rendered in light ink/soft-light grey, clearly visible against the dark background — no dark-on-dark failures observed. Legend text also switches to light ink. Grid lines remain subtle but visible as faint light-grey horizontal lines.
      Data: Bars remain the identical teal-green (#009E73) and the fitted-PDF line remains the identical purple — confirming data colors are unchanged between themes; only chrome (background, text, grid) flipped as required.
      Legibility verdict: PASS — all text is clearly legible on the dark surface; brand green and purple both read well against the near-black background.
