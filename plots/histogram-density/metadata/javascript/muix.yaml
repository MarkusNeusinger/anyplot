review:
  strengths:
  - 'Correct density normalization: each bar is count / (n × bin width), so the 18
    bar areas sum to 1 and the y axis reads ''Probability Density (1/g)'' with values
    that follow from the gram unit'
  - 'Fitted normal PDF (sample mean and SD) drawn on the same density scale in Imprint
    lavender #C475FD over brand-green bars, identified in the legend with a line glyph
    against the square bar glyph (labelMarkType)'
  - 'Composed MUI X v9 chart: ChartsDataProvider + ChartsWrapper with an HTML ChartsLegend
    outside ChartsSurface, BarPlot and LinePlot sharing one band axis, skipAnimation
    set throughout'
  - Subtitle carries n, bin width, mean and SD in inkSoft under the ink title, giving
    a clear typographic hierarchy that explains the normalization
  - 'Theme-correct in both renders: chrome from ANYPLOT_TOKENS (ink, inkSoft, grid,
    pageBg), identical data colors, thin page-colored bar separators that keep the
    bars contiguous'
  - Realistic quality-control scenario (400 packages around a 500 g target, SD 6 g)
    with a deterministic LCG + Box-Muller generator
  weaknesses:
  - 'SC-03 (both): the x axis is a categorical band scale, so tick marks sit on bin
    edges while the labels name bin centers with irregular decimals (484.0, 487.9,
    491.9 …), and a value cannot be read off a tick position → a continuous weight
    scale with round ticks at the bin edges (e.g. every 4 g). Likely cause: xAxis
    scaleType "band" with data binCenters and valueFormatter toFixed(1).'
  - 'Suggestion: evaluate the fitted PDF on a finer grid that spans the full bin range
    so the curve reaches the outer bar edges instead of stopping at the first and
    last bin centers.'
  - 'Suggestion: drop the doubled parentheses in the subtitle (''Package weight (g)
    (n = 400 …'') by writing the unit once.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold near-black title "histogram-density · javascript · muix · anyplot.ai" top-left (~40 % of the width), inkSoft subtitle "Package weight (g) (n = 400, bin width = 1.98 g) · Mean 500.2 g, SD 6.1 g", horizontal HTML legend below it, y-axis label "Probability Density (1/g)" with ticks 0.000–0.075, x-axis label "Package weight (g)" with every other bin center labelled (484.0 … 515.7). Subtle horizontal grid lines, thin grid-colored axis lines. All text readable.
      Data: 18 contiguous brand-green #009E73 bars separated by hairline page-colored gaps, rising from zero; lumpy bell shape peaking at ~0.068; a lavender #C475FD fitted normal curve (peak ~0.065) drawn over the bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend, axis labels and tick labels all flip to light ink / inkSoft and read clearly; grid lines subtle dark grey; no dark-on-dark text.
      Data: identical green bars and lavender curve as the light render; only the chrome and bar separators (now dark) flip.
      Legibility verdict: PASS
