review:
  strengths:
  - Genuine MUI X combo chart built from ChartContainer primitives (BarPlot + LinePlot
    sharing one band x-axis) rather than a manual overlay hack
  - Descriptive subtitle with computed sample mean/SD adds real quantitative context
    and storytelling
  - Theme-correct, pixel-identical data colors between light and dark renders; all
    chrome properly theme-adaptive
  - Realistic, neutral packaging-QC scenario with a plausible process SD
  weaknesses:
  - Axis lines/ticks are recolored to the grid token but not removed - a fully pared-back
    L-shaped (or spineless) frame would read as more refined per the style guide's
    top Visual-Refinement tier
  - Data storytelling relies on the subtitle text and curve overlay alone; an explicit
    visual callout (e.g. a shaded +/-1 SD band or a goodness-of-fit annotation) would
    push Design Excellence further
  - The bar+line combo pattern, while implemented idiomatically for MUI X, is also
    straightforward in other JS charting libraries - a more MUI-X-distinctive touch
    (e.g. gradient fills, custom axis highlight) would raise Library Mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "Package Weight Distribution · histogram-density · javascript · muix · anyplot.ai" in dark ink at top-left; soft-gray subtitle "Mean 500.2 g · SD 6.1 g — fitted Normal PDF overlay" below it; axis labels "Package Weight (g)" and "Density" both clearly visible; tick labels (484-518 on x, 0.000-0.075 on y) readable; legend top-right with "Observed density" / "Fitted Normal PDF" swatches; faint horizontal grid lines.
      Data: 18 green (#009E73) bars forming a bell-shaped density histogram, overlaid with a smooth lavender (#C475FD) line (fitted Normal PDF) tracking the bar heights closely.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title/subtitle text now in light ink/gray; axis labels and tick labels in light gray, clearly readable; legend rendered with light text; faint light-colored horizontal grid lines. No dark-on-dark issues observed anywhere.
      Data: Bar color (#009E73) and line color (#C475FD) are identical to the light render - confirmed unchanged, only chrome flipped.
      Legibility verdict: PASS
