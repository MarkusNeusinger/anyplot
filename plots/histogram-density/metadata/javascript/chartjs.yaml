review:
  strengths:
  - Correctly normalizes the histogram so total bar area equals 1 (density = counts
    / (n * binWidth)), matching the spec's core requirement
  - Overlays a theoretical Normal PDF for goodness-of-fit comparison, exactly the
    'consider adding a theoretical PDF overlay' suggestion from the spec notes
  - 'Imprint palette applied correctly: empirical density bars use #009E73 (brand
    green, position 1), PDF line uses #C475FD (lavender, position 2), identical across
    both themes'
  - Bars merged with categoryPercentage/barPercentage = 1.0 for a proper continuous
    histogram silhouette (no gaps between bins)
  - Deterministic reproducibility via a fixed-seed LCG plus Box-Muller transform —
    no external RNG dependency
  - All font sizes explicitly set (title 22px, legend 16px, ticks 14px, axis titles
    18px); axis labels carry units (bpm); y-axis-only grid per style guide; both renders
    theme-correct with fully readable text
  weaknesses:
  - 'DE-01: Reads as a well-configured Chart.js default — legend swatches are plain
    rectangles (including a boxed outline for the line series rather than a line-style
    swatch), and typography beyond font-size is untouched. Consider `legend.labels.usePointStyle`
    with a line-shaped key for the PDF series, or other typographic refinement.'
  - 'DE-02: No visual refinement beyond applying the base theme tokens — grid and
    spacing are clean but generic, nothing distinguishes this from a stock Chart.js
    mixed chart.'
  - 'DE-03: The empirical-vs-theoretical overlay implies a goodness-of-fit story but
    nothing calls attention to it — e.g. no annotation/shaded band highlighting where
    the empirical histogram deviates from (or tightly tracks) the theoretical curve,
    no callout on the peak.'
  - 'LM-02: The bar+line mixed chart is a fairly common Chart.js technique; lean further
    into something more distinctive (e.g. a gradient fill under the PDF curve, scriptable
    per-bin styling, or a custom tooltip surfacing z-scores) to raise Library Mastery.'
  - Title spans only ~33% of the canvas width — legible and explicitly sized, but
    on the narrow side relative to the 50-70% guideline; a touch larger would balance
    the composition better (minor, not a legibility problem).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-density · javascript · chartjs · anyplot.ai" in bold dark text at top, clearly legible. Legend below the title with two entries: an outlined lavender rectangle for "Normal PDF (theoretical)" and a filled green rectangle for "Empirical density," both dark-text labels, fully readable. Y-axis title "Density" (rotated) and X-axis title "Resting Heart Rate (bpm)" in dark ink, both descriptive with units. Tick labels on both axes in a slightly softer dark gray, clearly visible. Horizontal gridlines only, subtle and unobtrusive.
      Data: Green histogram bars (#009E73, brand green, first series) form a bell-shaped, unimodal, roughly symmetric distribution of resting heart rate; bars touch with no gaps. A lavender line (#C475FD, palette position 2) traces the theoretical Normal PDF closely overlaying the histogram's shape, confirming a good empirical/theoretical match.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, legend) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, clearly legible. Legend entries render the same way with light-colored text labels. Axis titles and tick labels are rendered in light gray/white tones, fully legible against the dark background. Gridlines remain subtle (light, low-opacity horizontal lines).
      Data: Bar and line colors are identical to the light render (#009E73 green bars, #C475FD lavender PDF line) — only the chrome (background, text, grid) flips as expected; no unauthorized color shift.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, axis, and tick text is clearly visible against the dark surface.

    Both renders confirm data colors are identical between themes and only chrome adapts, satisfying the theme-adaptive chrome requirement.
