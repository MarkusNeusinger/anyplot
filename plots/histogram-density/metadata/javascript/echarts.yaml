review:
  strengths:
  - Correct density normalization (bar area sums to 1) with consistent binning, plus
    a theoretical normal PDF overlay evaluated from the sample mean/std for a genuine
    goodness-of-fit check.
  - Theme tokens are threaded through every chrome element (title, legend, axis names,
    tick labels, grid, axis line) and both renders are fully legible with no dark-on-dark
    or light-on-light failures.
  - 'First series uses Imprint brand green #009E73; the overlay curve uses the ink/neutral
    token, an appropriate semantic choice for a reference-line role.'
  - Deterministic, seeded LCG + Box-Muller random generation gives full reproducibility
    with no external dependencies.
  - 'Clean, minimal chrome: no top/right/left spines, subtle horizontal-only gridlines,
    generous margins, well-balanced canvas utilization.'
  weaknesses:
  - 'The ''Normal fit'' legend swatch renders as a green dot (ECharts'' auto-assigned
    palette color for the line series'' default legend icon), but the actual overlay
    line is drawn in ink color (black in light theme, white in dark theme) via lineStyle.color.
    Set itemStyle: { color: t.ink } on the line series so the legend icon matches
    the rendered line color.'
  - X-axis carries 26 bin-center tick labels packed close together; legible but crowded.
    Consider a slightly coarser bin count or axisLabel interval so labels breathe
    more.
  - 'Design Excellence sits at the well-configured-default tier: green bars + a single
    dashed reference line follow the token system correctly but don''t go beyond it.
    Consider a subtle area-fill under the fitted curve, refined legend styling, or
    an annotation marking the sample mean/std to add a bit more visual sophistication.'
  - Library Mastery is generic — a bar+line combo chart is easily replicated in any
    charting library. Consider leveraging an ECharts-distinctive feature (e.g. markLine
    for the mean, areaStyle gradient under the PDF curve, or markArea for a ±1 std
    band) to showcase library-specific strengths.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: title "histogram-density · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Legend below title shows a green swatch for "Observed density" and a dashed line + circle marker for "Normal fit". Axis names "Reaction Time (ms)" (x) and "Density" (y) in dark ink; tick labels (bin centers 402–907, density values 0.000–0.006) in soft ink. All readable.
      Data: green (#009E73) bars form a unimodal, roughly bell-shaped histogram of reaction times, overlaid with a black dashed curve (fitted normal PDF) that tracks the bar heights closely.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: title, legend text, and axis labels render in light ink (white/near-white) and are clearly legible against the dark surface. Grid lines are faint horizontal lines, subtle but visible. No dark-on-dark text found.
      Data: bars remain the identical Imprint green (#009E73) — confirmed identical to the light render. The normal-fit overlay curve switches from black to white dashed, preserving contrast against the dark surface.
      Legibility verdict: PASS

    Note: the "Normal fit" legend icon renders as a green dot in both themes even though the actual line is ink-colored — a minor legend/rendering inconsistency (see weaknesses), not a legibility failure.
