review:
  strengths:
  - Correct probability-density normalization (count / (N * binWidth)), verified to
    integrate to 1
  - Thoughtful area-fill-under-PDF-curve technique that visually communicates goodness-of-fit,
    not just a bare overlay line
  - Manual equal-width binning deliberately chosen over d3.bin() to avoid its sliver-edge-bin
    heuristic — a documented, library-aware judgment call
  - Clean theme-adaptive chrome; both light and dark renders are fully legible with
    identical data colors
  weaknesses:
  - Design Excellence could go further with a stronger visual hierarchy or a brief
    callout (e.g., annotating mean/std) — not required by spec but would add polish
  - Distinctive-feature usage is solid but not maximal; a further d3-idiomatic touch
    could push Library Mastery higher
