review:
  strengths:
  - Correct density normalization (bar area sums to 1) with a theoretical Normal PDF
    overlay for goodness-of-fit, matching the spec's suggested feature
  - 'Theme-adaptive colors handled correctly: brand green (#009E73) bars are pixel-identical
    between light and dark, while the PDF overlay uses t.ink so it flips from black
    to white for contrast on each background'
  - Idiomatic column-based histogram workaround (pointRange/pointPadding/groupPadding=0,
    linear xAxis with bin centers) given the core Highcharts bundle has no native
    histogram series
  - 'Subtle bar borders (borderColor: t.pageBg) create clean separation between bins
    without adding visual noise'
  - Deterministic, seeded data generation (mulberry32 PRNG + Box-Muller) with a realistic,
    neutral manufacturing-tolerance context (bolt diameter)
  weaknesses:
  - Library mastery is modest — no use of Highcharts-specific extras (e.g. plotLines
    for the mean, zones, or annotations) that would showcase more distinctive features
    beyond the dashed overlay line
  - Styling is competent but conservative — no gradient/area-shading under the curve
    or callout annotation to further elevate aesthetic sophistication (DE-01/DE-02)
  - SD=0.05mm against a mean of 10mm is a fairly tight manufacturing tolerance — plausible
    but toward the optimistic end of realistic process variability
  - Three helper functions (mulberry32, nextNormal, normalPdf) add minor structural
    overhead versus a flatter script; justified by the lack of a built-in seeded PRNG
    in the browser, but worth noting against strict KISS scoring
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white and not dark.
      Chrome: Title "histogram-density · javascript · highcharts · anyplot.ai" in bold dark ink text, clearly visible; x-axis title "Bolt Diameter (mm)" and y-axis title "Density" in soft dark ink, readable; tick labels dark and legible; subtle light-gray horizontal gridlines only, no dominant grid; legend at bottom ("Empirical density" green marker, "Normal PDF (fit)" dashed line) fully readable.
      Data: Bars filled in Imprint brand green (#009E73), thin cream-colored borders separating bins; black dashed Normal PDF overlay curve tracks the histogram shape closely (fit slightly right-of-peak vs. empirical mode, expected for finite-sample data).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black and not light.
      Chrome: Title in bold white/light text, clearly visible; axis titles and tick labels rendered in light gray, readable against the dark background; gridlines subtle and still visible; legend readable with same layout as light render.
      Data: Bars are the identical brand green (#009E73) as the light render — confirmed unchanged; the Normal PDF overlay line correctly flips from black (light) to white (dark) via the t.ink token, remaining clearly visible against the dark background — no dark-on-dark failures observed anywhere (title, axis labels, ticks, legend, or data curve).
      Legibility verdict: PASS
