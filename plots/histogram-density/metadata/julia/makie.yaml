review:
  strengths:
  - 'First categorical series is exact Imprint brand green #009E73 (rgb(0,158,115)
    confirmed by pixel sampling) in both themes'
  - Correct canvas (3200x1800), correct mandated title format, theme-adaptive chrome
    (INK/INK_SOFT) verified to swap correctly with warm off-white/near-black backgrounds
  - Clean L-shaped spine removal, subtle y-axis-only grid at low opacity, frameless
    legend placed without overlapping data
  - Realistic, neutral manufacturing QC context (cereal box net weight around a 500
    g nominal fill) with a properly area-normalized density histogram
  - Reproducible via Random.seed!(42); histogram + normal-fit PDF overlay (the one
    pair of layers that does render) directly satisfies the spec's 'consider a theoretical
    PDF overlay' note
  weaknesses:
  - 'Three of the five coded plot layers never appear in either PNG: the density!()
    KDE stroke (IMPRINT_PALETTE[3] blue, strokewidth=4, dashed), the vlines!() nominal-fill
    reference line at x=500 (INK, dashed), and the dotted callout line + ''Out-of-spec
    box'' text!() annotation. Confirmed by pixel sampling: zero pixels of color (68,103,163)
    anywhere in either 3200x1800 render, and no INK-colored vertical line crossing
    the bars at the x=500 column in either theme. The legend also only shows 2 of
    the 4 labeled series (''Observed boxes'', ''Normal fit'') — ''Smoothed density
    (KDE)'' and ''Nominal fill (500 g)'' are missing from the legend too, meaning
    the plot objects are not being registered/drawn at all, not just rendered too
    faintly.'
  - Because those three layers are invisible, the intended data storytelling (comparing
    KDE vs parametric fit, flagging the nominal fill target, calling out the out-of-spec
    box) never reaches the viewer — the shipped chart is just a histogram + one fit
    line, weaker than what the code implies.
  - 'Repair guidance: don''t just retune colors/alpha — first verify each of density!(),
    vlines!(), lines!()+text!() actually draws in isolation on a minimal script with
    this Makie/CairoMakie version. Likely suspects: the color=:transparent fill trick
    on density!() suppressing the stroke too (try a low-alpha solid fill instead of
    :transparent), or the vlines!()/annotation calls being added after some limits-locking
    step. Confirm via axislegend showing all 4 entries and via direct pixel inspection
    before resubmitting.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (page surface), not pure white.
      Chrome: Title "Cereal Box Net Weight · histogram-density · julia · makie · anyplot.ai" in dark ink, clearly legible; x-axis "Net Weight (g)" and y-axis "Density" labels in dark ink, legible; tick labels in soft grey ink, legible; subtle horizontal gridlines only; L-shaped spine (bottom + left only); legend box top-right, frameless, with two entries ("Observed boxes", "Normal fit") in soft grey text.
      Data: Green (#009E73) histogram bars with a light bg-colored stroke between bars, bell-shaped distribution centered near 500 g with one isolated outlier bar far to the right (~540 g); a lavender/purple smoothed curve ("Normal fit") overlaid on top of the bars, peaking near the histogram mode. No other overlay is visible — pixel sampling confirms there is no dashed line at x=500 (nominal fill), no blue KDE stroke anywhere in the image, and no annotation text/dotted leader line near the outlier bar, even though the code defines all three.
      Legibility verdict: PASS (everything that is actually drawn is clearly readable; the missing layers are a rendering-completeness bug, not a legibility bug).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title/axis/tick text now in light ink (#F0EFE8) / soft light grey (#B8B7B0), fully legible against the dark background — no dark-on-dark failures observed. Spines and grid flip to light-on-dark equivalents correctly.
      Data: Histogram bars and the normal-fit curve use the identical data colors as the light render (green #009E73, purple fit line) — confirmed unchanged. As in the light render, the KDE stroke, nominal-fill reference line, and outlier annotation are absent from the pixels (verified by the same sampling: no blue-family pixels anywhere, no light-ink vertical line crossing the bars at x=500 beyond the title-text rows).
      Legibility verdict: PASS for what is drawn; same missing-layers defect carries over identically to the dark theme, confirming it's a code/rendering bug rather than a theme-specific contrast problem.
