review:
  strengths:
  - Correct PDF normalization (normalization = :pdf in hist!) producing a true density
    histogram whose bar area integrates to 1, matching the spec's core requirement.
  - Theoretical normal-fit overlay (mean/std computed via Statistics, analytic Gaussian
    PDF drawn with lines!) directly satisfies the spec's suggestion to overlay a theoretical
    PDF for goodness-of-fit context.
  - Theme-adaptive bar stroke (strokecolor = PAGE_BG) creates a clean 'cutout' separation
    between bars that automatically matches the surface color in both light and dark
    renders.
  - 'Clean chrome: top/right spines removed, y-axis-only gridlines at low opacity,
    legend framed transparently, all text explicitly sized and legible in both themes.'
  - Realistic, neutral manufacturing QC scenario (cereal box net weight, 500 g nominal
    fill, 15 g sd) with sensible real-world scale.
  weaknesses:
  - 'Design Excellence is solid but generic: bars + a single fitted-curve overlay
    is the standard density-histogram treatment achievable in any plotting library.
    Consider a more distinctive storytelling touch — e.g. a subtle fill under the
    fitted curve, a callout/annotation on the isolated outlier bin (~545 g) framing
    it as an out-of-spec box, or a vertical reference line at the nominal 500 g fill
    target.'
  - 'Library Mastery is generic: only hist! and lines! are used, both trivially replicable
    in matplotlib/seaborn/ggplot2. Leverage a more Makie-distinctive feature to raise
    LM-02, e.g. density! for a smoothed KDE overlay alongside the histogram, or Makie''s
    Figure/Axis layout system for a secondary inset/marginal panel.'
  - With bins = 25 over 450 points, a few adjacent bars show noticeable jaggedness
    (large height swings between neighboring bins) around the peak — consider tuning
    the bin count slightly or using explicit bin edges for a smoother visual read
    of the underlying distribution.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Cereal Box Net Weight · histogram-density · julia · makie · anyplot.ai" in bold dark ink, fully visible, not clipped. Axis labels "Net Weight (g)" and "Density" in dark ink, tick labels in a softer grey-brown. Subtle horizontal (y-axis only) gridlines. Top/right spines removed; left/bottom spines in soft grey. Legend top-right, frameless, transparent background, labels in soft grey.
      Data: Green (#009E73) histogram bars with theme-matching (light) thin strokes between them, forming a roughly bell-shaped unimodal distribution peaking near 500 g with one isolated outlier bar near 545 g. A purple/lavender (#C475FD) smooth curve overlays the bars as the fitted normal PDF, closely tracking the bulk of the distribution.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in white/off-white ink, fully visible. Axis labels and tick labels rendered in light tones (white / light grey) against the dark background. Gridlines subtle and light-toned. Spines and legend styling mirror the light render's structure, appropriately flipped to light-on-dark.
      Data: Histogram bars are the identical #009E73 green, with dark (near-black) strokes between them that blend into the dark background instead of the light strokes seen in the light render — correct theme-adaptive behavior. The fitted normal curve remains the identical #C475FD purple, confirming data colors are unchanged from the light render.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, and tick text is clearly readable against the near-black background. Brand green and lavender both remain vivid on the dark surface.

    Both renders confirm identical data colors (green bars, purple fit line) with only chrome (background, text, gridlines, bar-edge stroke color) flipping between themes, as required.
