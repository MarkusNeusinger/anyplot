review:
  strengths:
  - Native geom_density() with semi-transparent fill and geom_rug() ticks give the
    KDE + rug pairing directly from the grammar
  - Theme tokens from ANYPLOT_THEME flip all chrome correctly; data colours identical
    in both renders
  - Text sizes follow the style guide exactly (12/10/8 pt) on the correct 3200x1800
    canvas
  - Bimodal web response-time sample shows clusters, a trough and sparse tails that
    the curve matches
  weaknesses:
  - 'SC-01 (both): dashed reference lines at 150 and 250 ms with ''Peak 1''/''Peak
    2'' text labels are an unrequested reference-line and annotation layer; ''Peak
    2'' even sits at 250 while the curve peaks near 268 ms → remove both geom_vline()
    layers and both annotate() calls. Likely cause: the geom_vline()/annotate(''text'')
    blocks.'
  - 'CQ-04 (code): the second geom_density(fill = NA, linewidth = 1.1) layer redraws
    the outline the first layer already draws, and both pass a redundant stat = ''density''
    → one geom_density(fill = IMPRINT[1], color = IMPRINT[1], alpha = 0.35, linewidth
    = 1.1, bw = 20), about −10 lines. Likely cause: a leftover two-layer approach.'
  - 'LM-01 (code): the data block uses data.frame(value = ...) with a bare aes(x =
    value) and a typed x label instead of the library prompt''s column constant, tibble::tibble(!!RESPONSE_TIME
    := ...) and .data[[RESPONSE_TIME]] with labs(x = RESPONSE_TIME) → follow the adaptable-code
    zones. Likely cause: data block written without the column-constant pattern.'
  - 'Suggestion: let the density tails taper (e.g. a wider x range via geom_density(bounds)
    or expand) instead of ending in vertical walls at the outermost ticks.'
  - 'Suggestion: a lighter grid (a faint INK mix rather than full INK) would let the
    fill and rug carry more weight.'
