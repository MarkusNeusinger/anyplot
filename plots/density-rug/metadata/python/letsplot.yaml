review:
  strengths:
  - Filled semi-transparent KDE with rug ticks at the foot of the curve, short (about
    6% of the peak) and transparent so clusters read darker
  - Rug height derived from the data's spread (0.04 / std) instead of a hard-coded
    density value
  - Theme tokens threaded through background, title, axis titles, ticks and axis lines;
    both renders readable
  - Interactive HTML export alongside the PNG gives lets-plot's native hover tooltips
    on the density
  weaknesses:
  - 'VQ-07 (both): grid lines drawn in full-opacity INK_SOFT (#4A4A44 / #B8B7B0) plus
    a minor grid read as a dense dark mesh that competes with the fill → the style
    guide''s grid token at 15% opacity (rgba(26,26,23,0.15) light / rgba(240,239,232,0.15)
    dark) and no minor grid. Likely cause: panel_grid_major=element_line(color=INK_SOFT,
    size=0.3) and panel_grid_minor set.'
  - 'DE-02 (both): the panel has a frame on all four sides instead of the style guide''s
    default L-shaped left and bottom axes → drop the top and right lines. Likely cause:
    theme_minimal plus axis_line/panel border drawing a full box.'
  - 'Suggestion: rug ticks in a slightly darker or ink-toned stroke would separate
    them more clearly from the same-green fill in the dark render.'
  - 'Suggestion: fewer y ticks (e.g. every 0.001) would lighten the four-decimal tick
    column.'
  image_description: |-
