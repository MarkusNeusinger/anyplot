review:
  strengths:
  - Rug drawn with plotly's native line-ns marker symbol at 60% alpha, so each observation
    is a thin tick at its exact value and clusters read darker in both themes
  - Filled KDE (fill='tozeroy', 35% alpha) from scipy's gaussian_kde with a range
    padded by half the data's spread, so the curve agrees with the rug and the gridlines
    stay visible through the fill
  - Theme tokens threaded through every chrome element; data colours identical in
    light and dark
  - 'Adaptable structure: one column constant, a Data block binding df, a Plot block
    reading only df'
  - Hovertemplates with units on both traces for the interactive HTML view
  weaknesses:
  - 'Suggestion: a slightly tighter top margin would bring the plot area closer to
    the title and reduce the empty band above it.'
  - 'Suggestion: the vertical gridlines could be dropped so the horizontal density
    gridlines alone carry the reading.'
