review:
  strengths:
  - 'Layered Altair chart: mark_area with a line overlay for the KDE and mark_tick
    for the rug share one x scale, so every tick sits at its exact value'
  - Rug height derived from a pixel size (16 px) on a density axis that starts at
    zero, so the ticks sit at the foot of the curve and stay far shorter than it
  - Translucent fill (0.35) and rug (0.5) keep gridlines and overlapping ticks readable
    in both themes
  - Canvas lands exactly on 3200x1800 through the pad-only block; text at the style-guide
    sizes
  - HTML output gets zoom and pan through .interactive()
  weaknesses:
  - 'Suggestion: an x grid every 40 ms instead of every 20 ms would quiet the background
    behind the rug.'
