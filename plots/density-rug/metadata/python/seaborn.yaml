  strengths:
  - Axes-level sns.kdeplot(fill=True, alpha=0.35) with sns.rugplot driven by data=df
    and the column constant, so the axis title comes from the column name
  - Exact 3200x1800 canvas with style-guide text sizes (12/10/8 pt) and correct theme
    tokens in both renders
  - Rug ticks are thin and slightly transparent, so dense clusters near 0-30 μm read
    darker while isolated tail ticks stay visible, and the curve agrees with the rug
  weaknesses:
