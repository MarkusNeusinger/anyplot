  strengths:
  - Correct 3200x1800 canvas with toolbar_location=None, min_border_* reservations
    and the CDP viewport pin, so the x axis, its label and the full rug sit inside
    the saved PNG in both themes
  - KDE drawn as a semi-transparent patch (fill_alpha 0.35) with a solid line on top;
    the rug and the gridlines stay visible through the fill
  - 'Rug drawn with one vectorised segment glyph from a ColumnDataSource: one tick
    per observation hanging just below the zero baseline, alpha 0.5 so the 100-140
    ms cluster reads darker'
  - 'Bimodal latency data with a sparse slow tail and an isolated outlier near 335
    ms exercises every characteristic: dense bands, gaps and tail ticks the curve
    agrees with'
  - Theme tokens threaded through every chrome element; title, axis labels and ticks
    are readable in both renders and the brand green is identical across them
  weaknesses:
  - 'Suggestion: lines 46-49 write out the Gaussian KDE sum; scipy.stats.gaussian_kde(values,
    bw_method=bandwidth / np.std(values, ddof=1))(x_range) computes the same curve.'
  - 'Suggestion: the patch already strokes the curve at line_width 3, so the separate
    p.line at line_width 5 only thickens it; a single stroked patch would do.'
