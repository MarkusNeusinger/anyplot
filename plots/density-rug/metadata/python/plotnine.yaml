review:
  strengths:
  - Native geom_density + geom_rug(sides='b', length=0.04) combination with a semi-transparent
    fill that keeps the rug and grid visible
  - 'Theme-adaptive chrome threaded through theme() tokens: all text readable on both
    #FAF8F1 and #1A1A17'
  - River-flow data (lognormal base flow plus flood days) shows a skewed bulk, an
    empty gap and isolated tail ticks, so the rug and the curve visibly agree
  - Column constant for the values role, so plotnine titles the x axis from the column
    name directly
  weaknesses:
  - 'Suggestion: the left end of the density curve stops in a vertical wall at the
    lowest observation; a slight range extension (e.g. geom_density(trim=False) or
    expanded limits) would let the tail taper toward zero.'
  - 'Suggestion: a slightly shorter or thinner rug in the densest 10–30 m³/s band
    would let individual ticks separate more.'
