      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "density-rug · julia · makie · anyplot.ai" is bold dark ink, centered, fully visible with no clipping. X-axis label "Reaction Time (ms)" and y-axis label "Density" are dark ink, clearly readable. Tick labels (0.000/0.002/0.004 on y; 200/400/600 on x) are a softer dark gray, legible. A subtle horizontal-only grid is visible at low opacity. Top and right spines are removed; left and bottom spines are a soft gray.
      Data: A single KDE curve filled in translucent brand green (#009E73 at ~35% opacity) with a solid green stroke outline, right-skewed with a peak near 300-350ms and a small secondary bump near 550-600ms. Rug ticks (thin green vertical lines, more opaque) run along the axis baseline, dense in the 250-450ms range and sparser in the tail — first/only series correctly uses #009E73.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-dark or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-light gray, all clearly legible against the dark background — no dark-on-dark failures observed. Grid line remains subtle. Spines flip to a light-gray tone, top/right still removed.
      Data: Same KDE shape and rug pattern, with the fill still brand green (#009E73) at the same opacity and the stroke/rug ticks in the same green — confirmed identical to the light render; only the chrome (background, text, grid, spine colors) has flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background, brand green remains vivid and distinguishable from the near-black surface.
