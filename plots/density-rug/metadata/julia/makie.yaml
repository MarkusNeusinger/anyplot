review:
  strengths:
  - Correct combination of a semi-transparent KDE fill (density!) with axis-relative
    rug ticks (vlines! with ymin/ymax as axis fractions), matching the spec's core
    request precisely.
  - 'Theme-adaptive chrome is correctly implemented in both renders: Imprint brand
    green (#009E73) is pixel-identical between light and dark, backgrounds read as
    warm off-white / warm near-black, and all text/tick/spine colors flip correctly
    with no dark-on-dark or light-on-light failures.'
  - 'Clean visual refinement: top/right spines removed, subtle single-axis (y-only)
    grid at low opacity, generous whitespace, no overlap, no edge clipping.'
  - 'Realistic, domain-appropriate data: right-skewed reaction-time distribution (~150-650ms)
    generated via a log-normal transform, reproducible via Random.seed!(42).'
  - 'Clean, idiomatic Makie code: KISS top-to-bottom structure, only used imports,
    explicit font sizes throughout, correct save API (plot-$(THEME).png with px_per_unit=2).'
  weaknesses:
  - 'Design storytelling is minimal (DE-03): the plot shows the raw KDE shape with
    no explicit visual hierarchy or emphasis technique — the small secondary bump
    around 550-600ms (the ''slow-response outliers'' mentioned in the code comment)
    isn''t highlighted in any way (no accent color, annotation, or contrast) so the
    viewer has to find that insight unaided.'
  - Aesthetic treatment is a single flat green fill with no additional refinement
    beyond the mandated defaults (DE-01) — consider a subtle accent (e.g. a slightly
    different tone or opacity for the rug ticks vs. the fill, or a light annotation
    marking the secondary mode) to lift it above a 'well-configured default' look.
  - Rug ticks overplot into a near-solid band in the busiest region (~250-450ms) where
    most of the 220 observations concentrate, losing individual-tick legibility (VQ-03)
    — the spec explicitly suggests jittering vertically or reducing tick weight/alpha
    to combat this; consider linewidth ~1.0-1.2 and/or a touch more transparency (alpha
    ~0.3) in that dense zone.
  - Data is essentially unimodal with only a faint secondary bump (DQ-01) — it doesn't
    strongly demonstrate the combo's storytelling value for revealing gaps or multimodality;
    a slightly more pronounced second cluster or a deliberate low-density gap in the
    raw data would better showcase what rug marks add on top of the KDE.
  - The mandated title renders quite small relative to the canvas (~20% of plot width)
    given how short 'density-rug · julia · makie · anyplot.ai' is — bumping titlesize
    up slightly (e.g. 22-24) would give it more visual weight without risking overflow.
