review:
  strengths:
  - Composes custom rug marks as an SVG child of LineChart using the useXScale and
    useDrawingArea hooks, so every tick sits at its exact value on the chart's own
    linear scale (lines 63-82)
  - Semi-transparent KDE fill (fillOpacity 0.2) keeps the gridlines and the rug visible
    through the area in both themes, and the 0.7-opacity rug ticks merge darker in
    the dense clusters near 4.2 and 6.6 cm
  - Bandwidth computed with Silverman's robust rule (0.9 min(sd, IQR/1.34) n^-1/5)
    on a 240-point grid; the curve is high where ticks crowd, dips to 0.09 across
    the 5.0-5.8 gap and ends just past the outermost ticks
  - Subtitle states n, kernel and the computed bandwidth with its unit, giving a clear
    title/subtitle hierarchy
  - Theme tokens threaded through every chrome element (ink, inkSoft, grid); data
    colors are identical in both renders
  - x domain locked to the KDE grid (min/max) so the curve fills the plot width without
    padding; skipAnimation set and v9 CSS classes (.MuiLineChart-area/-line) used
    correctly
  weaknesses:
  - 'Suggestion: the curve is cut at the plot edge while still slightly above zero
    on the right (about 0.007 at 8.2 cm); extending KDE_CUT to about 3 bandwidths
    would let both tails settle onto the baseline.'
  - 'Suggestion: the header''s ''Library: muix 7.29.1'' line names an old major; the
    code is written against the pinned v9 API.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "density-rug · javascript · muix · anyplot.ai" top-left with a soft-ink subtitle "n = 140 · Gaussian kernel, bandwidth 0.42 cm (Silverman's robust rule) · one rug tick per observation"; y-axis "Probability density" with ticks 0.00-0.40, x-axis "Petal length (cm)" with ticks 2.5-8.0; subtle horizontal gridlines; all text dark and readable.
      Data: brand-green #009E73 bimodal KDE curve (3 px) with a light translucent green fill; peaks ~0.38 at 4.2 cm and ~0.30 at 6.6 cm, valley ~0.09 at 5.45 cm; 140 short green rug ticks (~26 px) along the baseline, denser and darker in the two clusters, isolated ticks at 3.1, 5.45 and 5.6 cm. Gridlines visible through the fill.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and labels in light ink, ticks in light soft ink, gridlines subtle grey; no dark-on-dark text.
      Data: identical #009E73 curve, fill (reads as deep green at 0.2 opacity) and rug ticks; rug still clearly visible against the dark fill.
      Legibility verdict: PASS
