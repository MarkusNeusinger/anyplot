review:
  strengths:
  - 'Rug marks and the bimodal KDE curve tell one coherent story: the marks visibly
    thin out in the 4.8-5.2 and 5.6-5.8 valley exactly where the density dips, making
    the two-population narrative concrete rather than just a smoothed abstraction'
  - Correct, idiomatic use of MUI X's children/hooks pattern (useXScale + useDrawingArea)
    to composite a custom rug-mark layer onto the LineChart's own coordinate system
    - a genuinely library-specific technique
  - 'Both renders are theme-correct with no legibility failures: warm off-white/near-black
    backgrounds, fully readable ink-toned text, identical brand-green data color in
    both themes'
  - Title format, axis labels with units, single-series legend correctly omitted,
    and generous margins all match spec and style guide exactly
  - Deterministic, seeded, dependency-free data generation (LCG + Box-Muller) and
    a from-scratch Gaussian KDE with a documented bandwidth choice narrower than Silverman's
    rule to keep the two populations visually distinct
  weaknesses:
  - 'Rug marks are not vertically jittered (spec: ''consider jittering ... if using
    thick ticks'') - a minor optional enhancement, not required since the current
    1.5px ticks are thin enough that overplotting reads as intentional density signal
    rather than clutter'
  - 'Design Excellence is solid but not exceptional: styling relies mostly on opacity/curve-smoothing
    tweaks over an otherwise fairly standard MUI X LineChart look rather than deeper
    custom typography or layout flourishes'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "density-rug · javascript · muix · anyplot.ai" top-left; axis labels "Petal Length (cm)" (x) and "Density" (y, rotated) in dark ink; tick labels along both axes in a slightly softer dark tone; subtle horizontal grid lines only. All clearly visible against the light background.
      Data: A bimodal KDE curve (brand green #009E73 stroke) with a semi-transparent green fill under it, showing two peaks (~4.2 and ~6.7 on the x-axis) separated by a shallow valley near 5.4. A dense band of short green rug tick marks sits along the x-axis baseline, clustering under each peak and thinning out in the valley - directly echoing the density shape.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis labels and tick labels rendered in light/off-white ink, clearly legible; grid lines subtle and still visible against the dark surface. No dark-on-dark text anywhere.
      Data: Same brand-green stroke color as the light render; the fill reads as a slightly darker desaturated green against the black background (expected, since a semi-transparent fill over a dark backdrop naturally looks darker than over a light one - the underlying fill color and opacity are identical). Rug marks are the same green, same density pattern as light render, fully visible.
      Legibility verdict: PASS
