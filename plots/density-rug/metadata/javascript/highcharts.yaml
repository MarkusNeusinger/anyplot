review:
  strengths:
  - Correctly implements a Gaussian-kernel KDE from scratch (Silverman bandwidth rule)
    rather than faking a smooth curve, and the bimodal reaction-time distribution
    (fast group ~320ms, slow tail ~485ms) is clearly resolved in the curve shape
  - 'Rug marks are genuinely distinct from the density curve: thin (pointWidth 2),
    semi-transparent (~45% opacity via alpha-suffixed hex) to handle overlap, and
    separated from the fill by a plotLine at y=0 as the spec''s ''preserve transparency
    about where actual observations fall'' calls for'
  - Axis extents (gridMin/gridMax = data range ± 3*bandwidth) avoid clipping the curve
    tails while keeping the rug band tight and readable
  - 'Theme handling is clean: identical brand-green (#009E73) data color in both renders,
    only chrome (background, ink, grid) flips, background colors correctly warm off-white
    / near-black'
  - Deterministic, dependency-free implementation (custom seeded LCG + Box-Muller)
    with no fake interactivity or workaround libraries
  weaknesses:
  - Y-axis tick labels use a formatter hard-coded to `toFixed(3)`, but Highcharts'
    auto tick interval here is finer than 0.001 (roughly 0.0004-0.0005 density units
    apart). Consecutive ticks round to the same displayed string, producing visibly
    duplicated labels top-to-bottom (0.006, 0.006, 0.005, 0.005, 0.004, 0.004, 0.004,
    0.003, 0.003, 0.002, 0.002, 0.001, 0.001) in both renders. Fix by increasing formatter
    precision to toFixed(4)/toFixed(5), or by setting an explicit yAxis.tickInterval
    so labeled ticks are spaced far enough apart to be visually distinct.
  - Legend is disabled entirely; with two named series ('Estimated density', 'Observations')
    a one-line caption or subtitle clarifying that the lower ticks are individual
    observations would help viewers unfamiliar with rug plots, though the plot is
    still interpretable without it.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "density-rug · javascript · highcharts · anyplot.ai" in bold dark ink, centered, fully visible with no clipping. X-axis title "Reaction Time (ms)" and y-axis title "Density" (rotated) in medium-gray ink, both legible. X tick labels (150-675, step 25) are evenly spaced and dark-on-light. Y tick labels are readable but show a rounding artifact: several consecutive labels display the same rounded value (e.g. "0.006" appears twice in a row, "0.004" appears three times in a row) because the toFixed(3) formatter can't resolve the fine auto tick interval. Grid lines are subtle horizontal gray lines, clearly visible but not dominant.
      Data: Density curve and fill are brand green (#009E73), clearly bimodal with a tall peak near 320ms and a smaller shoulder near 475ms. Rug marks below the y=0 baseline are thin, semi-transparent green ticks showing the individual reaction-time observations, visually separated from the density fill by a thin horizontal baseline.
      Legibility verdict: PASS (the duplicate y-axis labels are a clarity nit, not an unreadability failure — every character is crisp and dark-on-light).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels, now rendered in light ink/inkSoft tones against the dark background — all clearly legible, no dark-on-dark text anywhere. Grid lines are subtle light-gray, visible without dominating.
      Data: Density fill/line and rug ticks are the identical brand green (#009E73) as the light render — only the chrome (background/text/grid) flipped, confirming color-token discipline.
      Legibility verdict: PASS (same duplicate-label rounding artifact as the light render, otherwise fully readable).
