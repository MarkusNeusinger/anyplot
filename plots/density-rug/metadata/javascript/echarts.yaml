review:
  strengths:
  - Correct, consistent use of the Imprint palette (#009E73) across the KDE line,
    fill, and rug marks in both light and dark renders
  - Theme-adaptive chrome (title, legend, axis labels, ticks, axis lines) correctly
    threaded through ANYPLOT_TOKENS in both themes — no dark-on-dark or light-on-light
    failures
  - 'Genuinely idiomatic ECharts solution: a custom series with renderItem + api.coord
    implements the rug marks, a chart type ECharts has no built-in support for'
  - Realistic, neutral reaction-time dataset (fast vs. slow responders) that visibly
    demonstrates the KDE's bimodal capability while the rug confirms real data clustering
    and gaps
  - Deterministic, reproducible data generation via a fixed-seed LCG
  weaknesses:
  - The densest cluster (~300-350 ms) causes rug ticks to visually merge into a near-solid
    block, losing per-point resolution — the spec explicitly warns about this overplotting
    risk and suggests 'jittering rug marks vertically... to reduce overplotting',
    which was not applied. Reduce rug opacity/linewidth further and/or add small vertical
    jitter to the tick y-position.
  - Title renders at only ~28-30% of the plot width, well under the ~50-70% guideline
    range for a title this short — increase title fontSize (e.g. 22 -> 26-28) for
    stronger visual hierarchy.
  - KDE/data-generation logic is split across several standalone helper functions
    (makeLcg, gaussianSample, gaussianKernel, densityAt) rather than a flatter Imports
    -> Data -> Plot structure; some helper logic is unavoidable for a from-scratch
    KDE in vanilla JS, but consider inlining where feasible.
  - Design reads as competent and well-configured rather than genuinely distinctive
    — e.g. no secondary accent (subtle baseline rule at y=0, refined legend styling)
    to further separate the KDE region from the rug band beyond the plain color/opacity
    contrast.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "density-rug · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable but modest in size relative to plot width. Legend ("KDE density", "Individual trials (rug)") sits directly below the title, readable dark text with a teal line/dot swatch and a teal filled swatch. X-axis "Reaction time (ms)" and Y-axis "Density" labels are dark and legible; tick labels (124, 200, 300, ... 672 on x; 0.0000-0.0054 on y) are soft gray and legible. No grid lines are drawn (deliberately minimal).
      Data: A single teal-green (#009E73) KDE curve with matching semi-transparent fill shows a clear bimodal distribution (peaks near ~330 ms and ~480 ms, valley near ~410 ms). Below the zero baseline, a dense band of thin teal-green vertical rug ticks (semi-transparent) marks each of the 180 individual observations, echoing the two-cluster shape of the KDE and showing visible gaps at the low (~150-230 ms) and high (~550-600 ms) tails. In the single densest region (~300-350 ms) many ticks visually merge into a near-solid block.
      Legibility verdict: PASS — all title, legend, and axis text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in light/off-white ink, clearly readable against the dark background. Axis labels and tick labels are rendered in a lighter soft-gray tone, legible throughout. No grid lines, matching the light render's minimal-chrome choice.
      Data: The KDE curve, fill, and rug ticks use the identical teal-green (#009E73) as the light render — confirmed unchanged data colors between themes, only the chrome (background, text color) flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text remains clearly visible against the dark background.
