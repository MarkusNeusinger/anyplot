      Data: Single brand-green (#009E73) KDE curve with matching semi-transparent green fill under the curve, clearly bimodal (peak near 2.7 min, smaller peak near 6.1 min). Rug marks are thin green tick marks along the x-axis baseline, denser in the two peak regions (visually merging into solid-looking blocks there) and sparser in the trough/tails — first series color correctly matches the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now in light/white text, clearly legible against the dark background; axis titles in light ink; tick labels in a lighter soft-gray-white, all legible; same subtle y-only gridlines, now light-colored at low opacity, visible but unobtrusive.
      Data: Same brand-green (#009E73) curve and fill — confirmed identical hue and shape to the light render, with the fill reading as a darker semi-transparent green wash against the black background. Rug marks in the same green, same density pattern as the light render.
      Legibility verdict: PASS (no dark-on-dark issues found — all chrome text uses the light ink token)
