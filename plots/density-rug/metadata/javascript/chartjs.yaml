      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "density-rug · javascript · chartjs · anyplot.ai" centered at top, clearly legible dark ink; x-axis title "First Response Time (minutes)" and y-axis title "Density" in the same dark ink; tick labels (0, 2, 4, 6, 8, 11.2 on x; 0.05-0.35 on y) in a lighter soft-gray ink, all clearly readable against the light background. Subtle horizontal gridlines only (y-axis), x-axis has just a thin bottom border, no vertical gridlines. Two new dashed vertical guide lines drop from just below the title down to the KDE curve at its two peaks (~2.7 min and ~6.1 min), each topped with a small soft-gray label reading "Auto-triaged" and "Needs a human" respectively — both fully legible and non-overlapping with any other element.
      Data: Single brand-green (#009E73) KDE curve with matching semi-transparent green fill under the curve, clearly bimodal. Rug marks are thin green tick marks along the x-axis baseline, denser in the two peak regions and sparser in the trough/tails; tick heights are now slightly jittered rather than uniform, so the two dense clusters read as a differentiated cluster of ticks rather than a single solid block. First series color correctly matches the brand green.
