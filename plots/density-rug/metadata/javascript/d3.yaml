review:
  strengths:
  - Bimodal KDE (Silverman bandwidth, Gaussian kernel via d3.mean) is correctly implemented
    from scratch and the two regimes are explicitly named ('Fast trials' / 'Slow trials')
    with peak markers — genuine data storytelling, not just a curve
  - Vertical gradient fill (denser green at baseline, airier near the peak) built
    via an SVG linearGradient adds real depth within the Imprint hue without introducing
    a second color
  - Rug marks use a deterministic per-point vertical jitter within the rug band, exactly
    the spec's own suggestion for reducing overplotting of overlapping ticks
  - Identical brand green (#009E73) and warm off-white/near-black backgrounds across
    both themes; all chrome (title, axis text, ticks, grid) correctly threaded through
    ANYPLOT_TOKENS with no dark-on-dark or light-on-light failures
  - Title matches the exact mandated format, deterministic LCG-seeded data generation
    (seed 42), clean idiomatic d3 data-join for the rug marks
  weaknesses:
  - Rug marks cluster tightly under both peaks (especially 280-350ms and 450-520ms)
    and read as near-solid dark bands rather than individually distinguishable ticks
    despite the jitter — a touch more transparency or slightly shorter ticks in the
    densest zones would preserve the 'exact observation location' transparency the
    spec calls for
  - Only a single hue is used throughout (fill, line, peaks, rug) — appropriate for
    a single-series KDE, but the chart relies entirely on shape/position rather than
    any secondary visual encoding for hierarchy, capping Design Excellence just short
    of top marks
  - Several small free-standing helper functions (lcg, randomNormal, kernelGaussian,
    kernelDensityEstimator, findTwoPeaks) push the file structure past pure top-to-bottom
    KISS script style — justified here since D3 has no built-in KDE, but worth being
    aware of for CQ-01
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "density-rug · javascript · d3 · anyplot.ai" in bold dark ink centered at top; x-axis label "Reaction Time (ms)" and y-axis label "Density" in dark ink; tick labels dark and legible; thin subtle horizontal gridlines at each y-tick; italic "Fast trials" / "Slow trials" annotation labels in dark ink above each peak marker.
      Data: Single brand-green (#009E73) KDE curve (stroke-width ~3.5) over a bimodal distribution, filled underneath with a vertical green gradient (lighter/more transparent near the peak, denser toward the baseline); two small green peak-marker dots; a dense band of short green rug tick marks along the x-axis baseline showing individual reaction-time observations.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, peak annotations) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and peak annotations now rendered in light/off-white ink, fully legible; tick labels light-colored; gridlines subtle and still visible against the dark surface.
      Data: Identical brand-green (#009E73) curve, gradient fill, peak markers, and rug marks as the light render — confirmed pixel-for-pixel consistent data coloring; the green reads clearly and with good contrast against the near-black background.
      Legibility verdict: PASS — no dark-on-dark failures; all title/label/tick/annotation text is clearly visible against the dark background.
