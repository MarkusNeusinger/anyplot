review:
  strengths:
  - 'Correct, idiomatic KDE implementation from scratch: Gaussian kernel + Silverman''s
    rule bandwidth, computed over 300 x-ticks and rendered with d3-shape''s area/line
    generators and curveBasis smoothing.'
  - Rug marks are properly implemented as a real d3 data join (`.data(reactionTimes).join("line")`),
    semi-transparent (stroke-opacity 0.35) and thin (1.5px) — exactly the 'exact observation
    locations' the spec asks for.
  - Realistic, neutral bimodal dataset (easy vs. hard reaction-time trial conditions,
    150-700ms) that gives the KDE curve genuine two-mode shape to reveal, which a
    rug-only or histogram-only view would obscure.
  - 'Imprint palette and theme-adaptive chrome correctly threaded end-to-end: first
    series is #009E73 in both renders, axis/tick/grid colors pull from ANYPLOT_TOKENS,
    backgrounds read as warm off-white / warm near-black.'
  - Single-series legend correctly omitted; deterministic seeded LCG (seed=42) makes
    the data fully reproducible.
  weaknesses:
  - 'Design Excellence is at ''well-configured default'' level (DE-01): a single flat
    green fill + line with no added design flourish — no gradient/shading variation,
    no distinguishing typographic choice beyond the standard title/axis hierarchy.'
  - 'No deliberate data-storytelling technique (DE-03): the bimodal shape is a property
    of the dataset, not something the implementation emphasizes — consider a subtle
    annotation or differential emphasis calling out the two reaction-time regimes
    (e.g. ''fast'' / ''slow'' trial clusters) to give the viewer an immediate takeaway.'
  - Rug marks visually merge into solid dark blocks in the two densest regions (~300ms
    and ~480ms) in both renders — the spec explicitly suggests 'jittering rug marks
    vertically... to reduce overplotting'; a small vertical jitter or density-graduated
    opacity would keep individual observations distinguishable there (VQ-03).
  - Title occupies only ~30% of plot width at 26px — noticeably narrower than the
    typical 50-70% target; since spec-id and library name are short here this isn't
    a legibility problem, but a slightly larger title size would give it more visual
    presence without risking overflow (VQ-01, minor).
  - Four small helper functions (lcg, randomNormal, kernelGaussian, kernelDensityEstimator)
    are used for the KDE math — justified by the technique and idiomatic for D3, but
    it moves away from a strict linear KISS structure (CQ-01, minor).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "density-rug · javascript · d3 · anyplot.ai" centered at top; dark axis labels "Reaction Time (ms)" (x) and "Density" (y, rotated); dark tick labels on both axes; subtle horizontal gridlines at y-axis tick positions; thin dark domain lines on bottom/left axes only (no top/right spines drawn).
      Data: A single bimodal KDE curve in brand green (#009E73) with a semi-transparent green fill under it, peaking near x≈310 and a smaller second peak near x≈480, with a shallow trough around x≈410-430. Below the curve, along the x-axis, hundreds of thin vertical green rug tick marks mark each individual reaction-time observation, denser under the two peaks and sparser in the trough and tails.
      Legibility verdict: PASS — all title, axis-label, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light/white text against the dark background; gridlines are faint light horizontal lines; axis domain lines are light-colored.
      Data: Identical KDE curve shape and rug-mark pattern as the light render, same brand green (#009E73) stroke, with the fill appearing as a darker desaturated green-black blend against the black background (which is expected — the fill's opacity is unchanged, only the background behind it darkens). Data colors are unchanged from the light render.
      Legibility verdict: PASS — all title, axis-label, and tick text is clearly readable against the dark background; no dark-on-dark failures observed.
