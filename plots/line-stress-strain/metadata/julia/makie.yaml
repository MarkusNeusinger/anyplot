review:
  strengths:
  - 'Physically accurate mild-steel stress-strain curve: elastic rise, Luders (yield)
    plateau with realistic serration noise, strain-hardening curvature, and necking
    softening all present with plausible MPa/strain values'
  - Region shading (vspan!) with a semantic red tint for the necking zone communicates
    the approach to fracture without needing a legend
  - Direct point labeling (Yield point, UTS, Fracture) replaces a legend entirely,
    keeping the chart clean; markers differ by both color AND shape (amber circle,
    blue circle, red xcross) for CVD accessibility beyond color alone
  - 'Correct theme-adaptive chrome: data colors are pixel-identical between light
    and dark renders, only chrome (background, ink, grid) flips; spines removed, grid
    subtle'
  - 0.2% offset construction line correctly implemented per the standard ASTM yield-determination
    method, parallel to the true elastic slope
  weaknesses:
  - The elastic segment is compressed to a near-vertical line at the y-axis given
    the E=200GPa vs. UTS=420MPa scale disparity — physically correct, but it means
    the required 'visible slope line' for the elastic modulus is barely perceptible
    as a slope; consider a zoomed/broken strain-axis inset for the elastic region
    in a future iteration so the modulus line is genuinely visible
  - The annotation cluster around the yield point (offset-line label above, yield-point
    label below, marker, dashed construction line, and the Luders plateau wiggle all
    within a narrow strain range) is visually crowded — pull the 'Yield point (0.2%
    offset)' label further right/down or use a leader line to reduce crowding
  - Design polish leans entirely on the provided Imprint palette plus the amber accent
    without additional custom refinement beyond spec defaults (e.g., no extra typographic
    or annotation-style flourishes)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Mild Steel Tensile Test · line-stress-strain · julia · makie · anyplot.ai" in bold dark ink, clearly readable. X-axis label "Engineering Strain" and Y-axis label "Engineering Stress (MPa)" in dark ink, fully legible. Tick labels (0, 0.1, 0.2, 0.3 on x; 0, 200, 400 on y) in a softer gray, readable. Top and right spines removed; left/bottom spines subtle gray. Horizontal gridlines at 200/400 are faint but visible.
      Data: Green stress-strain curve (#009E73, first Imprint series) rises near-vertically through the elastic region, shows a serrated Luders plateau at yield, curves through strain hardening to a rounded peak (UTS, blue-purple marker), then descends through necking to a red xcross fracture marker. A dashed gray 0.2% offset construction line and an amber yield-point marker sit near the origin. Two background bands (light green tint = elastic+hardening, light red tint = necking) subdivide the plot area, each labeled "Elastic", "Plastic (strain hardening)", "Necking" in muted gray text near the top.
      Legibility verdict: PASS — all text and annotations are clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels flip to light ink/off-white and remain fully legible. Region-band tints flip to darker green/red variants appropriate for the dark surface. Spines and gridlines are appropriately subtle on the dark background.
      Data: The green curve, amber yield marker, blue-purple UTS marker, and red xcross fracture marker are visually identical in hue/position to the light render — confirming only chrome (not data color) changed between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all text (title, axis labels, tick labels, region labels, point annotations) reads clearly against the dark background.
