review:
  strengths:
  - The elastic-modulus slope, flagged as imperceptible in attempt 1 (near-vertical
    line against the y-axis at this MPa/strain scale), is now genuinely visible via
    a dedicated 'Elastic region (zoomed)' inset placed in the axis's empty bottom-right
    quadrant — the modulus reads as an actual slope, not just a text annotation
  - The yield-point annotation cluster near the origin, flagged as crowded in attempt
    1, is now resolved with vertical leader lines dropping from each marker to open
    space below the curve before placing label text — no overlap between the offset-line
    label, yield-point label, and the Luders plateau serration
  - 'Physically accurate mild-steel stress-strain curve: elastic rise, serrated Luders
    (yield) plateau, strain-hardening curvature, and necking softening all present
    with plausible MPa/strain values consistent with real mild steel'
  - 'Correct theme-adaptive chrome: data colors (brand green curve, amber yield marker,
    blue UTS marker, red xcross fracture marker) are pixel-identical between light
    and dark renders; only background/text/grid chrome flips'
  - Direct point labeling (Yield point, UTS, Fracture) replaces a legend; markers
    differ by both color AND shape (amber circle, blue circle, red xcross) for CVD
    accessibility beyond hue alone
  - 0.2% offset construction line correctly implemented per the standard ASTM yield-determination
    method, parallel to the true elastic slope, and mirrored inside the inset for
    consistency
  weaknesses:
  - 'Aesthetic sophistication (DE-01) is strong but stops short of full publication-ready:
    the palette usage is correct but relatively conservative (Imprint palette + amber
    accent only), without further custom refinement beyond spec defaults'
  - In the main panel the elastic segment itself is still a near-vertical line against
    the y-axis (physically correct, but the modulus story now lives almost entirely
    in the inset rather than the main curve) — acceptable given the inset fix, but
    a broken-axis treatment on the main panel could tell the story even more directly
  - Annotation fontsize (13-14pt at the 3200x1800 canvas) is on the smaller side for
    the amount of text used; still readable but leaves little margin when the PNG
    is scaled down for mobile/thumbnail previews
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — correct light-theme surface.
      Chrome: Title "Mild Steel Tensile Test · line-stress-strain · julia · makie · anyplot.ai" in bold dark ink, clearly visible near the top. Axis labels "Engineering Strain" / "Engineering Stress (MPa)" and tick labels are dark/soft-gray, all fully legible. Horizontal gridlines at 200/400 MPa are subtle, not dominant. Region-band labels ("Elastic", "Plastic (strain hardening)", "Necking") sit in muted gray, readable against the tinted bands. The new bottom-right inset ("Elastic region (zoomed)") has its own light-themed spines/ticks/title, fully legible at smaller scale.
      Data: Green stress-strain curve (#009E73) rises near-vertically through the elastic region, shows a serrated Luders plateau at yield (amber circle marker with leader line to "Yield point (0.2% offset)"), curves through strain hardening to a rounded peak (blue circle marker, "UTS" label), then descends through necking to a red xcross "Fracture" marker. The dashed 0.2% offset construction line is visible near the origin with its own leader-labeled line. The inset repeats the elastic segment and offset line at zoomed scale with an "E ≈ 200 GPa" text annotation, making the modulus slope genuinely visible instead of just described.
      Legibility verdict: PASS — no light-on-light issues, no overlapping text, leader lines keep the origin-area annotations clear of each other.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — correct dark-theme surface.
