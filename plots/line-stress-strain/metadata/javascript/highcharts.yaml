review:
  strengths:
  - 'All spec-mandated annotations present: labeled elastic/plastic(strain-hardening)/necking
    regions via plotBands, yield (0.2% offset)/UTS/fracture critical points via a
    dedicated scatter series with dataLabels, a visible elastic-modulus slope line
    from the origin, and a parallel 0.2% offset construction line'
  - Data colors are pixel-identical between light and dark renders (green curve, violet
    offset line, red fracture marker) while chrome (elastic-modulus line, ink, backgrounds,
    plot band tints) correctly flips via ANYPLOT_TOKENS
  - Realistic, physically-plausible Ramberg-Osgood model for Al 6061-T6 (E=69 GPa,
    sigma_y=276 MPa, UTS=310 MPa, fracture=235 MPa at ~11% strain) — deterministic,
    no RNG
  - 'Clean idiomatic Highcharts usage: plotBands with inline labels, plotLines for
    region boundaries, mixed line+scatter series, custom tooltip pointFormat and dataLabels
    formatter, credits disabled, animation disabled on chart and series'
  - Canvas gate passed (3200x1800), no clipped text, no overlapping elements in either
    render
  weaknesses:
  - 'Dark render: the italic plotBand region labels (''Elastic'', ''Plastic (strain
    hardening)'', ''Necking'') use t.inkMuted and read noticeably low-contrast against
    the near-black background — still legible but the faintest text element in the
    chart; consider bumping toward t.inkSoft for the dark theme.'
  - The 'Critical points' legend swatch is drawn in a single ink color even though
    the fracture point renders in palette[4] (red) on the chart itself — a minor mismatch
    between legend and rendered marker color for that one point.
  - Design relies entirely on the stock Imprint categorical palette with no additional
    custom color/gradient treatment beyond the plot-band opacity tint — solid but
    not maximally distinctive.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Al 6061-T6 tensile test · line-stress-strain · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible. X-axis title "Engineering strain (mm/mm)" and Y-axis title "Engineering stress (MPa)" in medium-gray ink, readable. Tick labels on both axes dark and crisp. Italic plotBand region labels ("Elastic", "Plastic (strain hardening)", "Necking") in muted gray, readable against the light background. Subtle horizontal gridlines and faint vertical dotted boundary lines at the yield/UTS strain values, visible but unobtrusive. Legend at bottom with 4 entries (curve, elastic modulus, 0.2% offset, critical points), all legible.
      Data: Primary stress-strain curve in Imprint green (#009E73), 3.5px line width, smooth from origin through yield, strain-hardening plateau, and necking down to fracture. Black dashed elastic-modulus line from origin to the yield point. Violet/purple long-dash 0.2% offset construction line parallel to the elastic line, correctly offset along the strain axis. Three triangular critical-point markers: yield and UTS in ink-black, fracture in red, each with a text data label reporting the stress value. First categorical series confirmed as #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels rendered in light/white ink, clearly legible against the dark surface. Gridlines and boundary dotted lines still visible at reduced contrast, as expected. Legend text light-colored and legible. The italic plotBand region labels ("Elastic", "Plastic (strain hardening)", "Necking") are present but rendered quite faint/dim (muted dark-gray-green) against the near-black background — legible on close inspection but the lowest-contrast text element in the chart; not a hard dark-on-dark failure (letters are not black-on-black) but worth tightening.
      Data: Curve color and offset-line color are identical to the light render (Imprint green curve, violet offset line, red fracture marker) — only the elastic-modulus reference line flips from black to white and chrome flips as expected. No other color drift observed.
      Legibility verdict: PASS (with a minor low-contrast note on the muted region labels, not severe enough to constitute a legibility failure)
