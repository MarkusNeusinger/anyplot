      Data: Green stress-strain curve, red fracture marker, and yield/UTS ink-colored markers are identical in hue/position to the light render; only the two dashed reference lines and the critical-point marker outlines flip from black to white (correct chrome-only adaptation) — confirms data colors did not change between themes.
