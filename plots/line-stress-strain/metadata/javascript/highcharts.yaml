review:
  strengths:
  - 'All spec-required elements present: labeled elastic/plastic/necking regions via
    plotBands, yield (0.2% offset), UTS, and fracture critical points with data labels,
    an elastic-modulus slope line, and the 0.2% offset construction line'
  - Realistic, domain-accurate data for Al 6061-T6 (E ≈ 69 GPa, yield ≈ 276 MPa, UTS
    ≈ 310 MPa, ~11% elongation to fracture) generated deterministically via a Ramberg-Osgood
    model plus a plausible necking tail — no RNG, fully reproducible
  - 'Clean theme adaptation: green data curve identical between renders, chrome (ink/inkSoft/inkMuted/grid
    tokens) correctly flips, backgrounds match #FAF8F1 / #1A1A17, no dark-on-dark
    or light-on-light failures'
  - Idiomatic Highcharts usage — plotBands for region labeling, dataLabels formatter
    for critical points, dash-styled reference lines with enableMouseTracking:false,
    transparent chart background, credits disabled, animation disabled on both chart
    and series
  - Correct title format with a fitting descriptive prefix, and font-size auto-scaling
    logic to keep the long mandated title from overflowing
  weaknesses:
  - 'The elastic-modulus line (dashStyle: Dash) and the 0.2% offset line (dashStyle:
    LongDash) are both thin, same-color (t.ink) lines that nearly overlap near the
    origin — at a glance they''re hard to tell apart without checking the legend.
    Consider giving the offset line a distinct color (e.g. t.palette[1] or t.inkSoft)
    or a heavier/lighter weight so the two references read independently of the legend.'
  - 'The elastic region (strain 0–0.006) is visually the busiest part of the chart:
    the steep curve, both dashed reference lines, the yield marker, and its data label
    all cluster in a narrow band. Nothing overlaps outright, but a touch more breathing
    room (e.g. nudge the yield label further right/up, or extend the x-axis min slightly
    negative) would make the offset construction easier to read.'
  - The 'Critical points' legend swatch renders as a green triangle (the series' default
    palette color), while the actual on-chart markers use per-point overrides (t.ink
    for Yield/UTS, palette[4] for Fracture) — the legend symbol doesn't visually match
    what's plotted. Setting an explicit neutral `color` on the 'Critical points' series
    (matching one of the marker colors, or grey) would make the legend swatch consistent
    with the chart.
  - 'Region-label plotBands use `color: ''transparent''`, so there''s no subtle tint
    to visually delineate where elastic ends and plastic/necking begin — a reader
    has to rely solely on the italic labels at the top; a very light alternating tint
    or a thin vertical separator at the transition strains would reinforce the boundaries.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "Al 6061-T6 tensile test · line-stress-strain · javascript · highcharts · anyplot.ai" is fully readable at the top; dark-gray axis titles ("Engineering strain (mm/mm)", "Engineering stress (MPa)") and tick labels are clearly legible; subtle horizontal-only gridlines; italic region labels "Elastic", "Plastic (strain hardening)", "Necking" sit near the top in muted gray and read fine; legend at the bottom (green line, two black dashed lines, green triangle swatch) is fully legible.
      Data: Green (#009E73) stress-strain curve is the clear focal point — steep elastic rise, curved strain-hardening plateau peaking at "UTS: 310 MPa", then descending necking region to "Fracture: 235 MPa" (red triangle marker). Two thin black dashed reference lines (elastic modulus slope, 0.2% offset construction) cross near the yield point (black triangle, "Yield (0.2% offset): 276 MPa" label).
      Legibility verdict: PASS — no light-on-light text found; all labels readable against the off-white surface.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
