review:
  strengths:
  - Correct Imprint palette usage with well-chosen semantic exceptions — amber for
    the yield/warning point, matte-red for the fracture/failure point, theme-adaptive
    muted ink for the 0.2% offset construction line and labels
  - Dual-panel design (full curve + zoomed elastic/yield detail) effectively tells
    the 0.2% offset yield-determination story required by the spec
  - All three required critical points (yield via 0.2% offset method, UTS, fracture)
    plus the three region labels (elastic, plastic/strain hardening, necking) are
    present and clearly placed
  - Physically accurate mild-steel tensile data — E ≈ 200 GPa, yield ≈ 250 MPa, UTS
    ≈ 400 MPa, fracture at ~30% strain with realistic Lüders plateau and necking-driven
    engineering-stress softening
  - Clean, deterministic in-memory data generation via a seeded LCG, no external dependencies
  - Theme-adaptive chrome correctly threaded through both Chart.js instances and the
    custom afterDraw plugin annotations
  - Distinct marker shapes (circle / crossRot / triangle) give the highlighted points
    redundant encoding beyond color alone
  weaknesses:
  - Main-panel y-axis top tick renders as "460.0" while every other tick shows a round
    integer ("50", "100", ...) — add a ticks.callback on that axis to format consistently
    (e.g. Math.round)
  - The "Fracture" text callout (dx:-14, dy:-14, align:"right") sits close enough
    to the red crossRot marker that the last letter touches the marker in both renders
    — increase the offset (e.g. dy:-20) for clear separation
  - Legend swatches for the point-only datasets ("Ultimate Tensile Strength (UTS)",
    "Fracture Point") render as plain rectangular color boxes instead of reflecting
    the actual point styles (circle/cross) — a known Chart.js default-legend limitation;
    a pointStyle-aware legend (labels.generateLabels/usePointStyle) would polish this
    further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) across both panels, matching the light-theme spec.
      Chrome: Dark ink (#1A1A17-family) title "line-stress-strain · javascript · chartjs · anyplot.ai", dark axis titles ("Engineering Strain", "Engineering Stress (MPa)", "Strain", "Stress (MPa)"), softer dark tick labels and region labels ("Elastic", "Plastic (strain hardening)", "Necking") — all clearly legible against the light surface. Grid lines are thin and subtle.
      Data: Main curve is Imprint brand green (#009E73) rising from 0, showing a proportional elastic rise, a slightly noisy Lüders plateau near 250 MPa, a power-law strain-hardening rise to a dark circular UTS marker (~400 MPa at ~22% strain), then a softening necking region down to a red crossRot "Fracture" marker (~320 MPa at ~30% strain). The right zoom panel repeats the green curve for the elastic/early-plastic region with a dashed muted-ink 0.2% offset line and an amber triangular "Yield (0.2% offset)" marker at their intersection, plus "E ≈ 200 GPa" and "0.2% offset" text callouts. Legend at the bottom of the main panel lists all three main-panel series.
      Legibility verdict: PASS — all text is readable on the light background; the "Fracture" label sits close to its marker but no pixels are missing or unreadable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) across both panels, matching the dark-theme spec.
      Chrome: Light ink (#F0EFE8-family) title, axis titles, and region labels; softer light-gray tick/legend labels. All chrome flipped correctly with no dark-on-dark or light-on-light failures. Grid lines remain thin and subtle.
      Data: Identical green (#009E73) main curve, identical amber yield marker, identical red fracture marker, and identical dashed muted offset line as the light render — only the chrome (background, text, grid, legend box) changed, confirming theme-adaptive data-color consistency.
      Legibility verdict: PASS — all text is readable on the dark background; no dark-on-dark issues detected.
