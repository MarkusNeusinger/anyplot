  strengths:
  - 'Complete coverage of every spec-required annotation: elastic/strain-hardening/necking
    phase labels, yield (0.2% offset), UTS, and fracture markers, plus a Young''s
    modulus text annotation'
  - 'Correct theme-adaptive chrome — warm off-white/near-black backgrounds, all text
    readable in both renders, first series is brand green #009E73'
  - Deterministic, realistic data via a seeded LCG piecewise curve builder (elastic
    Hooke's-law segment, Luders plateau, eased hardening, eased necking) with plausible
    steel/aluminum values
  - Optional multi-material comparison overlay (aluminum alloy) adds real analytical
    value without cluttering the primary steel curve's annotations
  - Idiomatic, non-fake use of ECharts markPoint — including invisible label-only
    points for phase text — with no simulated interactivity
  weaknesses:
  - The "Yield ≈ 250 MPa (0.2% offset)" annotation text visibly overlaps/crosses the
    mild-steel curve line immediately to its right in both light and dark renders
    (confirmed by close crop) — nudge the label further right/up or increase label
    distance so it clears the curve
  - Aluminum alloy series uses palette[2] (#4467A3 blue) instead of the canonical
    next slot palette[1] (#C475FD lavender) with no semantic justification — style
    guide requires using positions 1→N in order unless a real-world color association
    applies
