review:
  strengths:
  - 'Comprehensive spec coverage: labels all four required regions (elastic, yield,
    strain hardening, necking), marks yield/UTS/fracture critical points, draws the
    0.2% offset construction line, and annotates the elastic modulus — nothing from
    the spec is missing.'
  - 'Factually accurate mild-steel tensile data: E=200 GPa, yield=250 MPa, UTS=450
    MPa, ~26% elongation at fracture, and the correct post-UTS engineering-stress
    drop from necking — all realistic and internally consistent.'
  - 'Sophisticated, idiomatic MUI X usage: leverages the useXScale/useYScale hooks
    to place custom ChartsText labels and SVG point markers in data coordinates, layered
    on top of ChartsReferenceLine — a genuinely library-distinctive pattern.'
  - Deterministic fixed-seed LCG generates a realistic Lüders-band serration on the
    yield plateau instead of a flat line, adding visual authenticity without any external
    randomness dependency.
  weaknesses:
  - Y-axis label 'Engineering stress, σ (MPa)' visually collides with the '250' tick
    label near the vertical center of the axis, in both light and dark renders — the
    rotated axis title and the numeric tick merge into overlapping, hard-to-read glyphs.
    Increase the left margin (currently margin.left=100) or offset the yAxis label
    further from the tick-label column so they no longer share the same horizontal
    band.
  - 'Color assignment skips Imprint palette positions 2 and 4 (lavender #C475FD, ochre
    #BD8233): ''Strain hardening'' uses palette[2] (blue) and ''Necking'' uses palette[4]
    (red) instead of canonical 1→N order. The necking→red choice is a reasonable semantic
    exception (failure/danger), but skipping lavender for ''Strain hardening'' isn''t
    backed by a strong semantic cue — use palette[1] (lavender) for that series and
    keep palette[4] red reserved for the semantically-justified ''Necking'' series.'
  - 'The elastic region (strain 0–0.02, ~7% of the plotted x-range) is visually cramped:
    the yield reference line, the 0.2% offset line, the ''Yield ≈ 250 MPa'' label,
    and the ''E ≈ 200 GPa'' annotation all compete for the same narrow vertical strip.
    Consider a small inset/zoom panel for the elastic region, or spread the offset-line/yield
    annotations further apart to reduce crowding.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching the required #FAF8F1 surface — not pure white, not dark.
      Chrome: Title "line-stress-strain · javascript · muix · anyplot.ai" is centered at top in dark ink, clearly legible. Axis titles ("Engineering strain, ε (mm/mm)" / "Engineering stress, σ (MPa)") and tick labels render in dark/soft-dark ink against the light background — legible everywhere EXCEPT one spot: the rotated y-axis title visually collides with the "250" y-tick label near the vertical center of the axis, producing merged/overlapping glyphs there. Legend (top right) lists four series with color swatches, fully readable. Dashed reference lines mark Yield/UTS/Fracture with adjacent text labels; these labels plus the elastic-modulus annotation and the 0.2% offset line are all packed into the narrow elastic-region strip near x=0.
      Data: First series ("Elastic + yield") renders in brand green (#009E73) with a visible Lüders-plateau serration. "Strain hardening" is blue (palette[2]) and "Necking" is red (palette[4]) — palette positions 2 (lavender) and 4 (ochre) are skipped rather than used in canonical order. The 0.2% offset line is black/ink-colored (neutral anchor), appropriate for a construction/reference line. Solid circular markers highlight the yield, UTS, and fracture points.
      Legibility verdict: FAIL (localized) — everything is readable except the y-axis-label/"250"-tick collision described above, which is a real, reproducible overlap defect.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching the required #1A1A17 surface — not pure black, not light.
      Chrome: Same layout as light render; title, axis titles, and tick labels flip to light ink (near-white/soft-light) and remain legible against the dark background. No dark-on-dark failures observed. The same y-axis-label/"250"-tick collision reproduces identically here (it's a layout/positioning issue independent of theme).
      Data: Colors are confirmed identical to the light render — brand green (#009E73) for "Elastic + yield," blue (palette[2]) for "Strain hardening," red (palette[4]) for "Necking," and light-ink-colored offset line (correctly following the theme-adaptive neutral anchor). Only the chrome flipped; data hues did not shift.
      Legibility verdict: FAIL (localized) — same isolated axis-label/tick overlap as the light render; all other text is clearly legible against the dark surface.
