review:
  strengths:
  - Comprehensive, physically realistic stress-strain curve with distinct elastic,
    Lüders-plateau (with authentic serration noise), strain-hardening, and necking
    regions, all clearly color-coded and labeled to match the spec's required regions
  - Correct 0.2% offset construction line paired with a marker exactly at its intersection
    with the yield plateau, demonstrating the offset method rather than just labeling
    a number
  - Thoughtful use of MUI X hooks (useXScale/useYScale/useDrawingArea) for custom
    data-space overlays (region labels, point markers, hand-rolled Y-axis title) that
    shows deep familiarity with the library beyond basic chart props
  - 'Correct Imprint palette usage: brand green first, with a well-justified semantic
    exception (matte red) for the necking/failure region'
  - Deterministic seeded LCG for the Lüders-band noise, clean imports, and correct
    harness contract (skipAnimation, ANYPLOT_SIZE sizing, export default)
  weaknesses:
  - '"Fracture ≈ 300 MPa" reference-line label overlaps its own dashed vertical line
    in BOTH light and dark renders — the letters "Pa" are bisected by the line. Caused
    by combining labelAlign="start" with a conflicting textAnchor: "end" override
    in labelStyle on that one ChartsReferenceLine (muix.tsx ~lines 241-248); the Yield
    and UTS reference lines use labelAlign="start" without the anchor override and
    render cleanly clear of their lines. Fix: drop the textAnchor: "end" override
    (or switch consistently to labelAlign="end") so the fracture label clears the
    dashed line like the other two.'
  - The 0.2% offset construction line and the Yield reference line sit so close together
    near the origin (they diverge by only a few pixels over the full stress range)
    that they read as one doubled dashed line rather than two distinct construction
    lines — consider a distinct color for the offset line (instead of t.ink, which
    matches the reference-line family visually) or a lower opacity so the offset construction
    is easier to isolate from the yield marker line.
  - Axis tick marks (small perpendicular dashes) are still visible on both axes; the
    style guide's decoration-removal checklist prefers dropping them when only the
    tick labels are needed.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Centered title "line-stress-strain · javascript · muix · anyplot.ai" in dark ink. Y-axis title "Engineering stress, σ (MPa)" rotated along the left edge, fully visible with generous margin. X-axis title "Engineering strain, ε (mm/mm)" centered below the tick row. Tick labels (0-500 MPa, 0.00-0.27 strain) in medium-gray ink, all legible. Legend top-right lists four series with color swatches: "Elastic + yield" (green), "Strain hardening" (purple), "Necking" (red), "0.2% offset" (black dashed). Three vertical dashed reference lines mark Yield/UTS/Fracture with adjacent gray labels.
      Data: Green line rises steeply (elastic region) then plateaus with small serrated noise (Lüders band) to a green dot at (yield strain, 250 MPa); a lavender/purple curve continues upward through strain hardening to a purple dot at (0.20, 450 MPa, UTS); a dark-red curve descends through necking to a red dot at (0.26, 300 MPa, fracture). A thin black dashed diagonal line (the 0.2% offset construction) runs near the origin, nearly parallel to but diverging slightly from the vertical Yield reference line. Region text labels ("Elastic + Yield", "Plastic (Strain Hardening)", "Necking") are placed in each curve's own color, plus a gray "E ≈ 200 GPa (elastic modulus)" note near the top-left. First data series is confirmed brand green #009E73.
      Legibility verdict: PASS overall, with one localized defect - the "Fracture ≈ 300 MPa" reference-line label is bisected by its own dashed line (the "P" of "MPa" has the line running through it), while the Yield and UTS labels sit cleanly clear of their lines. All other text is fully readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same layout as the light render with all text flipped to light ink (near-white title/labels, light-gray tick labels and reference-line labels) - fully legible against the dark background. No dark-on-dark text anywhere; the white-ish dashed reference lines and the white-dashed "0.2% offset" legend swatch are clearly visible.
      Data: Identical curve shapes and identical data colors to the light render - green (#009E73) for elastic+yield, lavender for strain hardening, dark red for necking, confirming the palette is theme-invariant as required. Only the chrome (background, axis lines, tick/label colors, reference-line color) has flipped to the dark-theme tokens.
      Legibility verdict: PASS overall, with the same localized defect as the light render - the "Fracture ≈ 300 MPa" label is crossed by its dashed line ("P" of "MPa" bisected). No dark-on-dark failures; everything else reads clearly.
