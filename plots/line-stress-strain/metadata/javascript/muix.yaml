review:
  strengths:
  - 'Every characteristic the spec asks for is present and sits where it belongs:
    elastic, plastic (strain hardening) and necking labels at their stretches of the
    curve; yield, UTS and fracture marked at the offset crossing, the peak stress
    and the last sample; the 0.2% offset line dashed in inkSoft from strain 0.002,
    parallel to the elastic slope, clearly distinct from the green curve.'
  - 'Critical values are computed from the data rather than typed: E is a least-squares
    fit through the origin over the elastic samples (200,000 MPa), yield is the interpolated
    first crossing of the curve under the offset line (251 MPa), UTS is the stress
    maximum (450 MPa) and fracture is the last sample (300 MPa, 26.0% elongation).'
  - 'Idiomatic MUI X v9 composition: the annotation overlay is a child component of
    LineChart that draws in the chart''s own coordinate space through the useXScale/useYScale
    hooks, and the series keeps a valueFormatter so the HTML tooltip reads stress
    with its unit.'
  - 'Clear typographic hierarchy beyond the baseline: region labels in ink at weight
    500, point labels in inkSoft, critical-point markers with a page-coloured halo
    ring, faint dotted drop lines to the strain axis, and a data-driven subtitle summarising
    sample count, fit window, method and elongation.'
  - Theme tokens threaded through every custom element (ink, inkSoft, grid, pageBg,
    palette[0]); both renders are fully legible and the green curve is identical in
    both.
  weaknesses:
  - 'Suggestion: the mandated title fills only about a third of the width at 22 px;
    a descriptive prefix such as ''Mild Steel Tensile Test · '' would give the header
    more presence.'
  - 'Suggestion: the x-axis title sits about 50 px below the tick labels; a slightly
    smaller x-axis band (height ≈ 52) would tighten the bottom whitespace.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel painted.
      Chrome: title "line-stress-strain · javascript · muix · anyplot.ai" in bold dark ink top-left with a grey data-driven subtitle (168 samples, E fitted over 6 samples, 0.2% offset method, elongation 26.0%); y-axis "Engineering stress (MPa)" 0–500 in 50 MPa steps, x-axis "Engineering strain (mm/mm)" 0.00–0.26 in 0.02 steps; subtle horizontal grid only; all text dark on light and readable.
      Data: one brand-green (#009E73) line, thick: near-vertical elastic rise to 250 MPa, serrated yield plateau to strain 0.02, smooth hardening to the UTS at ~0.20/450 MPa, necking fall to fracture at 0.26/300 MPa. Green halo-ringed markers at yield (251 MPa), UTS (450 MPa) and fracture (300 MPa) with inkSoft labels and dotted drop lines to the strain axis. Dashed inkSoft 0.2% offset line rises from 0.002 to ~326 MPa, labelled "0.2% offset line, slope E". Region labels "Elastic · E = 200,000 MPa", "Plastic (strain hardening)" and "Necking" beside their stretches. No overlaps, no clipping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels in light ink/inkSoft, all clearly readable; grid lines subtle dark grey but visible; no dark-on-dark text anywhere.
      Data: the curve and markers are the same #009E73 as in the light render; the offset line and drop lines flip to light inkSoft and stay visible; all annotations in the same positions.
      Legibility verdict: PASS
