review:
  strengths:
  - 'Factually accurate Al 6061-T6 material properties: Young''s modulus ~69 GPa,
    yield strength ~270 MPa, UTS 310 MPa, and ~14% fracture strain all sit squarely
    in the real-world range for this alloy.'
  - 'Full spec coverage: elastic/strain-hardening/necking regions labeled, yield (0.2%
    offset), UTS, and fracture points marked with direct on-chart labels, the 0.2%
    offset construction line drawn, and the elastic modulus annotated.'
  - 'Distinctive engineering-grade implementation: a custom Fritsch-Carlson monotone
    Hermite interpolation generates the curve from control points, and a bisection
    search locates the true yield point where the offset line meets the modeled curve
    — genuine library-agnostic technical depth, not a canned curve fit.'
  - Clean theme-adaptive chrome; data colors (brand green curve, semantic matte-red
    fracture X) are identical between light and dark renders, and all text/grid/spines
    correctly use theme tokens.
  - Direct point labeling instead of a legend is the right call for a single-series
    curve with named critical points — avoids a redundant legend box.
  weaknesses:
  - '"Yield (0.2% offset)" label overlaps the rising elastic curve on its right edge
    — at the label''s x-position (centered on the yield marker), the curve reaches
    the label''s stress height a short distance to the right, so the curve line crosses
    through part of the text (around "offset)" / near "270 MPa"). Reposition the label
    (shift left with text-anchor "end", or move further above) so it clears the curve
    path.'
  - The elastic-modulus dashed tangent line is only drawn out to `PROP_LIMIT_STRAIN
    * 1.3` (roughly 2% of the plot width), making it visually indistinguishable from
    the actual curve at full canvas size — the code comment itself acknowledges the
    segment is 'only a few px wide.' Extend the dashed reference line further along
    the elastic slope (e.g. out to strain ~0.02-0.03) so it visibly diverges from
    the actual curve and reads as a distinct construction line, the way the 0.2% offset
    line already does.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Al 6061-T6 Tensile Test · line-stress-strain · javascript · d3 · anyplot.ai" centered top in dark ink, clearly readable. Axis titles "Engineering strain (mm/mm)" (x) and "Engineering stress (MPa)" (y) in dark ink with units. Tick labels in soft dark gray, evenly spaced, no overlap with each other. Subtle horizontal gridlines only. Region labels ELASTIC / STRAIN HARDENING / NECKING across the top in soft gray, separated by thin dashed vertical dividers at the yield and UTS strains.
      Data: Single stress-strain curve in brand green (#009E73), rising steeply through the elastic region, curving over a broad strain-hardening plateau, then declining through necking to a red (semantic matte-red) X marker at fracture. Yield point and UTS point are marked with green filled circles with light-colored strokes, each with a bold label and an MPa value beneath. A dashed 0.2% offset construction line runs from (0.002, 0) up to the yield point, labeled "0.2% offset". A short, low-opacity dashed line near the origin plus the text "E ≈ 69 GPa (elastic slope)" annotate the elastic modulus.
      Legibility verdict: PASS overall — all text is readable against the light background. One defect noted: the "Yield (0.2% offset)" label's right portion visually touches/crosses the rising curve line at that x-position (see weaknesses), a proximity/overlap issue rather than a legibility issue.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, tick labels, and region labels as the light render, but flipped to light-colored ink (white/light gray) against the dark background — all clearly legible, no dark-on-dark occurrences anywhere (title, ticks, region labels, and annotation text all confirmed light-on-dark).
      Data: Curve color, yield/UTS marker fill, and fracture X color are identical to the light render (#009E73 green curve, matte-red fracture marker) — only the chrome (background, text, grid, dashed divider color) flipped for the theme, exactly as required.
      Legibility verdict: PASS — all text and data are readable against the dark background. Same yield-label/curve overlap defect as the light render (chrome-independent, so it reproduces identically in both themes).
