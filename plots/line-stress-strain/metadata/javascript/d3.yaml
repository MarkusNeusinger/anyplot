review:
  strengths:
  - 'Factually accurate Al 6061-T6 material properties: Young''s modulus ~69 GPa,
    yield strength ~270 MPa, UTS 310 MPa, and ~14% fracture strain all sit squarely
    in the real-world range for this alloy.'
  - 'Full spec coverage: elastic/strain-hardening/necking regions labeled, yield (0.2%
    offset), UTS, and fracture points marked with direct on-chart labels, the 0.2%
    offset construction line drawn, and the elastic modulus annotated with both a
    slope line and text.'
  - 'Distinctive engineering-grade implementation: a custom Fritsch-Carlson monotone
    Hermite interpolation generates the curve from control points, and a bisection
    search locates the true yield point where the offset line meets the modeled curve.'
  - Clean theme-adaptive chrome; data colors (brand green curve, semantic matte-red
    fracture X) are identical between light and dark renders, and all text/grid/spines
    correctly use theme tokens.
  - The attempt-1 fix successfully resolved the previously flagged 'Yield (0.2% offset)'
    label/curve overlap by moving the label further above the marker — the label no
    longer touches the rising curve in either theme.
  - Direct point labeling instead of a legend is the right call for a single-series
    curve with named critical points.
  weaknesses:
  - The 'Yield (0.2% offset)' label is centered on the yield marker's x-position,
    which sits very close to the y-axis — the label's leading 'Y' glyph is bisected
    by the solid y-axis domain line in both light and dark renders. Right-align the
    label (text-anchor 'end' with a small left offset) or nudge it right so it clears
    the axis stroke.
  - 'The attempt-1 fix that lengthened the elastic-modulus tangent line (to PROP_LIMIT_STRAIN
    * 1.6) made it nearly geometrically coincident with the separate 0.2% offset construction
    line — both use the same dash pattern (''6,4'') and a similar muted-gray tone,
    so at render scale they merge into what reads as a single dashed line instead
    of two distinct annotations. This defeats the spec''s intent of showing the offset
    construction as visually distinct from the modulus slope. Differentiate them:
    use a clearly different dash pattern or a more contrasting stroke color for one
    of the two lines, or introduce a deliberate small visual offset between them so
    both remain legible as separate constructs in both themes.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Al 6061-T6 Tensile Test · line-stress-strain · javascript · d3 · anyplot.ai" centered top in dark ink, clearly readable, fontsize correctly scaled down for the descriptive-prefixed title length. Axis titles "Engineering strain (mm/mm)" (x) and "Engineering stress (MPa)" (y) in dark ink with units. Tick labels in soft dark gray, evenly spaced, no overlap with each other. Subtle horizontal gridlines only. Region labels ELASTIC / STRAIN HARDENING / NECKING across the top in soft gray, separated by thin dotted vertical dividers at the yield and UTS strains.
      Data: Single stress-strain curve in brand green (#009E73), rising steeply through the elastic region, curving over a broad strain-hardening plateau, then declining through necking to a red (semantic matte-red) X marker at fracture. Yield point and UTS point are marked with green filled circles with light-colored strokes, each with a bold label and an MPa value beneath. A dashed construction line runs from near the origin through the yield region — on close zoom, this is actually two near-coincident lines (the elastic-modulus tangent and the 0.2% offset line) that render as one due to matching dash style and very similar slope/position at this scale. A text annotation "E ≈ 69 GPa (elastic slope)" sits in the open plateau area below the curve, and "0.2% offset" sits near the x-axis.
      Legibility verdict: PASS overall — all text is readable against the light background. Two defects noted (see weaknesses): the "Yield (0.2% offset)" label's leading glyph is bisected by the y-axis domain line, and the modulus/offset construction lines visually merge into one.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, tick labels, and region labels as the light render, but flipped to light-colored ink (white/light gray) against the dark background — all clearly legible, no dark-on-dark occurrences anywhere (title, ticks, region labels, and annotation text all confirmed light-on-dark).
      Data: Curve color, yield/UTS marker fill, and fracture X color are identical to the light render (#009E73 green curve, matte-red fracture marker) — only the chrome (background, text, grid, dashed divider color) flipped for the theme, exactly as required.
      Legibility verdict: PASS — all text and data are readable against the dark background. Same axis-line/label overlap and merged-construction-line defects reproduce identically (chrome-independent, geometry-driven issues).
