review:
  strengths:
  - 'Excellent spec coverage: elastic, yield (0.2% offset method), strain hardening,
    necking, and fracture regions are all labeled and the four mechanical milestones
    are individually annotated'
  - Distinctive lets-plot layering — geom_rect region bands, geom_segment connector
    lines from data points to labels, and interactive layer_tooltips() all sharing
    a single scale_fill_manual across geom_rect and geom_point
  - Direct labeling (region bands + connector-line annotations) replaces a legend
    entirely, keeping the reading path close to the data
  - 'Physically plausible mild-steel values: E ≈ 210 GPa, yield 250 MPa, UTS 400 MPa,
    ~35% elongation with realistic necking-driven engineering-stress drop to fracture'
  - 'Clean theme-adaptive chrome: horizontal-only grid, spines/ticks removed, both
    renders keep #FAF8F1/#1A1A17 backgrounds with fully legible text'
  - Title matches the mandated `line-stress-strain · python · letsplot · anyplot.ai`
    format exactly
  weaknesses:
  - 'Imprint position 1 (#009E73, the mandated first-series green) is never used anywhere
    in the chart — the main curve and the Elastic region band both use IMPRINT_PALETTE[2]
    (blue) instead. Recolor the primary data series (the stress-strain curve itself)
    to #009E73 and shift the other role colors (regions, yield/UTS/fracture markers)
    down the palette so the first series is Imprint green.'
  - The Fracture point marker and its 'Fracture' label are colored with INK_SOFT,
    a theme-adaptive chrome token, so they visibly change color between plot-light.png
    (dark grayish) and plot-dark.png (light gray) — data-element colors must stay
    identical across themes, only chrome (background/text/grid) should flip. Assign
    the fracture point/label a fixed Imprint palette color instead.
  - The 0.2% offset construction line (color_offset = INK_SOFT) has the same theme-flip
    issue as the fracture point — give it a fixed neutral hex instead of a theme token.
  - 'The elastic region (strain 0–0.015) is visually crowded: the near-vertical main
    curve, the dashed 0.2% offset line, the ''E = 210 GPa'' annotation, and the yield-point
    label all cluster in a narrow horizontal band, making that area harder to parse
    than the rest of the plot'
  - The 'Necking' region label sits close to the descending curve near the right edge
    of that band — nudge it up or increase its y-offset slightly to guarantee clear
    separation from the line in all renders
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "line-stress-strain · python · letsplot · anyplot.ai" at top, dark axis titles ("Engineering Strain" / "Engineering Stress (MPa)"), dark-gray tick labels on both axes, subtle horizontal-only gridlines. All chrome text is clearly readable against the light background.
      Data: Three pastel-alpha region bands (blue "Elastic", tan "Strain Hardening", mauve "Necking") sit behind a thick blue (#4467A3) stress-strain curve. Key points are marked with white-ringed filled circles: lavender "Yield Point (250 MPa)", red "UTS (400 MPa)", and a dark-ink "Fracture" point, each connected to its text label by a thin dotted segment. A dashed near-vertical line marks the 0.2% offset construction line near the origin, with a small italic "E = 210 GPa" annotation. First-series Imprint green (#009E73) is not used anywhere in the chart.
      Legibility verdict: PASS (all text readable; the elastic-region cluster near the origin is a bit dense but still legible).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and axis titles render in off-white/light text, tick labels in light gray, gridlines subtle light gray on dark. No dark-on-dark failures — all chrome text is clearly legible against the dark background.
      Data: Main curve, region bands, Yield-Point marker/label (lavender), and UTS marker/label (red) are pixel-identical in hue to the light render, confirming the categorical data colors do not shift with theme. However, the Fracture point marker and label flip from a dark ink tone in the light render to a light gray tone here, and the 0.2% offset dashed line similarly lightens — both are bound to the theme-adaptive INK_SOFT token rather than a fixed Imprint color, so they are NOT identical between renders (a real palette-compliance issue, noted in weaknesses).
      Legibility verdict: PASS (no dark-on-dark text; only the two flagged data elements change color between themes, chrome itself is fully theme-correct).
