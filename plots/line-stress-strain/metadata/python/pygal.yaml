review:
  strengths:
  - Hand-drawn SVG inset panel (spliced into both the PNG and HTML output) elegantly
    solves the previously-flagged illegibility of the elastic-modulus/0.2%-offset
    construction -- a creative, well-executed workaround for pygal's lack of a native
    inset-axes primitive.
  - Ultimate Tensile Strength marker is now differentiated with a distinct Imprint
    hue (#BD8233) from the neutral-ink Yield Point marker, fixing the previous at-a-glance
    ambiguity while keeping the semantic red exception for the fracture point.
  - 'Theme handling remains correct and complete: identical data colors between light/dark
    renders, chrome flips correctly between #FAF8F1 and #1A1A17, canvas gate passes
    at 3200x1800, and all text -- including the new inset''s small-font labels --
    stays legible in both themes.'
  - Physically realistic, deterministic mild-steel tensile data (np.random.seed(42))
    with clearly labeled elastic/plastic/necking regions and all three critical points
    (yield, UTS, fracture) called out with computed MPa values directly in the legend.
  weaknesses:
  - The reserved top gutter (margin_top=500) leaves a large empty band to the right
    of the inset panel -- the inset occupies only the top-left corner of the reserved
    space, and the remaining ~60% width x full height of the gutter reads as unbalanced
    negative space rather than intentional whitespace. Widen the inset to use more
    of the gutter, or shrink margin_top and re-anchor the inset (e.g. centered under
    the title, or paired with a short text callout stating the computed offset yield
    strain/stress) to avoid the awkward empty rectangle.
  - On the main-scale axes the elastic segment and 0.2% offset construction are still
    compressed to a ~2px sliver at x=0 -- fully unreadable without the inset. A thin
    leader line or bracket connecting the inset to the compressed region on the main
    plot would make the zoom relationship explicit at a glance instead of relying
    on the viewer to infer it from the shared title.
  - The three inset-drawing helper functions (_inset_point, _inset_polyline, _build_offset_inset_svg)
    push the script away from a flat, top-to-bottom KISS structure -- justified here
    by the raw-SVG-splicing requirement, but worth keeping minimal if the inset technique
    is reused elsewhere.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "line-stress-strain · python · pygal · anyplot.ai" centered at top in dark ink, fully visible, not clipped, occupying ~58% of plot width (well within the 50-70% guideline). Y-axis title "Engineering Stress (MPa)" (wrapped, rotated) and x-axis title "Engineering Strain (mm/mm)" are both dark and clearly readable. Tick labels (0-400 MPa on y, 0-0.3 on x) are dark and legible. A new inset panel top-left, titled "Zoom: Elastic Modulus & 0.2% Offset Region," has its own small dark-ink axis labels/ticks, all legible at native resolution. Horizontal-only grid lines are subtle dotted gray, visible but not dominant. Legend sits below the x-axis title in a 3-column, 3-row grid; all 8 entries readable with no overlap.
      Data: First series (Elastic) is brand green #009E73, second (Plastic/Strain Hardening) is lavender #C475FD, third (Necking) is blue #4467A3 -- canonical Imprint order for the first three categorical series. Construction lines (Elastic Modulus tangent, 0.2% Offset Line) are dashed neutral/muted ink tones. Yield Point marker is a neutral-ink dot; UTS marker is now a distinct amber (#BD8233) dot; Fracture Point marker is matte red #AE3030 (semantic exception, appropriate). On the main axes the elastic/offset construction is still a compressed sliver near x=0, but the inset panel reproduces the same geometry at a legible scale, with the tangent and offset lines clearly diverging and the yield-point dot marked.
      Legibility verdict: PASS (all text readable in both the main chart and the inset; no clipping or overlap observed).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, axis titles, tick labels, and the inset panel's labels all render in light/white ink, clearly visible against the dark background -- no dark-on-dark failures anywhere. Grid lines remain subtly visible on dark. Legend text is light-colored and fully legible.
      Data: Colors are identical to the light render -- green Elastic, lavender Plastic, blue Necking, amber UTS, red Fracture -- confirming only chrome flipped between themes. The inset panel's border, gridlines, and construction-line dashes switch to light-on-dark tones (INK_MUTED becomes the lighter #A8A79F) while preserving the same series colors, so the zoomed offset geometry is equally legible here as in the light render.
      Legibility verdict: PASS (all text readable in dark theme; no dark-on-dark issues in the main chart or the inset).
