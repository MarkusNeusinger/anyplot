review:
  strengths:
  - 'Well-executed semantic color exception: the fracture point is rendered in matte
    red (#AE3030) per the ''bad/error/fail -> red'' convention, while non-primary
    construction/reference elements (elastic-modulus tangent, 0.2% offset line, yield/UTS
    markers) use neutral ink tones instead of burning through extra palette slots
    -- a deliberate, sophisticated color hierarchy.'
  - 'Theme handling is correct and complete: identical data colors in both renders,
    chrome (background/text/grid) flips correctly between #FAF8F1 and #1A1A17, all
    text legible in both themes, and the canvas gate passes at 3200x1800.'
  - Clean, idiomatic pygal usage -- a single Style object carries all theme tokens,
    dasharray stroke_style differentiates construction lines from data curves, dots_size
    isolates critical-point markers, x_labels_major_count plus a custom x_labels list
    controls the tick set, and truncate_legend avoids legend clipping.
  - Physically grounded, realistic mild-steel tensile data (E ~ 200 GPa, yield 250
    MPa, UTS 400 MPa, fracture 330 MPa) with distinct elastic/plateau/hardening/necking
    regions, generated deterministically via np.random.seed(42).
  weaknesses:
  - The elastic region and the entire 0.2% offset construction -- both explicitly
    required by the spec as a 'visible slope line' -- are compressed into roughly
    the leftmost 1% of the plot width, because engineering strain at yield (~0.0013)
    is tiny next to the fracture strain (~0.30) on a linear x-axis. The two parallel
    offset lines end up only ~15-20px apart at native resolution and read as a single
    blurred hairline against the y-axis rather than an illustrative construction.
    Consider a zoomed inset panel (a second small pygal.XY chart placed in a corner)
    for the elastic/offset region, or a leader-line/text callout pointing at the compressed
    region, so the offset method is actually legible rather than just technically
    present in the data.
  - Yield Point and Ultimate Tensile Strength markers both use the same neutral ink
    color (ANYPLOT_NEUTRAL), so without reading the legend text a viewer cannot tell
    them apart by color alone -- differentiate at least one marker color (e.g. keep
    UTS on a palette hue) for at-a-glance identification.
  - 'DQ-03 (appropriate scale) tension: the underlying data is realistic, but the
    resulting chart doesn''t clearly communicate the elastic-modulus/offset construction
    it was asked to illustrate -- this should be the primary fix target for the next
    attempt.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "line-stress-strain · python · pygal · anyplot.ai" centered at top in dark ink, fully visible and not clipped. Y-axis title "Engineering Stress (MPa)" and x-axis title "Engineering Strain (mm/mm)" both dark and clearly readable. Tick labels (0-400 on y, 0-0.3 on x) are dark and legible. Horizontal grid lines are subtle dashed gray, visible but not dominant. Legend sits below the x-axis title in a 3-column grid, all 8 entries readable with no overlap.
      Data: First series (Elastic) is brand green #009E73, second series (Plastic/Strain Hardening) is lavender #C475FD, third series (Necking) is blue #4467A3 -- matches canonical Imprint order. Construction lines (Elastic Modulus tangent, 0.2% Offset Line) are dashed neutral/muted ink tones. Yield Point and UTS markers are dark dots; Fracture Point marker is matte red #AE3030 (semantic exception for failure, appropriate). The elastic region and the offset construction are compressed into a very narrow sliver near x=0 (strain ~0-0.0035 against a 0-0.33 axis range), making the parallel-offset geometry hard to distinguish at normal viewing size.
      Legibility verdict: PASS (all text readable; the compressed elastic/offset region is a data-scale/design issue, not a text-legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light/white ink, clearly visible against the dark background. Grid lines are subtle dashed gray, still visible on dark. Legend text is white and fully legible, no dark-on-dark failures observed anywhere (title, axes, ticks, legend all pass).
      Data: Colors are identical to the light render -- green Elastic, lavender Plastic, blue Necking, red Fracture marker -- confirming only chrome flipped between themes. Yield Point and UTS markers are white/light dots (still both the same color as each other). The same elastic/offset compression issue from the light render is present here.
      Legibility verdict: PASS (all text readable in dark theme; no dark-on-dark issues; same compression weakness as the light render).
