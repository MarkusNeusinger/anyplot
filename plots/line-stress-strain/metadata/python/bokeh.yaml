review:
  strengths:
  - 'Idiomatic, feature-rich bokeh usage: HoverTool with formatted per-region tooltips,
    BoxAnnotation for the necking zone, Span reference lines, an Arrow/VeeHead leader,
    and a manually constructed Legend/LegendItem'
  - 'Thoughtful semantic color mapping beyond canonical order: brand green for the
    curve, amber for the yield threshold, matte red for the fracture point (matches
    the style guide''s bad/failure semantic anchor), lavender for UTS'
  - 'All spec-required features present: labeled elastic / strain-hardening / necking
    regions, 0.2%-offset yield point, UTS, fracture point, Young''s modulus text annotation,
    and an offset line correctly parallel to the elastic slope'
  - The necking region is subtly shaded as an underlay band, creating a clear focal
    point that guides the eye toward the fracture outcome (good data storytelling)
  - Key points use distinct marker shapes (circle / triangle / square) in addition
    to color, giving redundant encoding
  - Clean KISS-structured, deterministic code; correct theme-adaptive chrome in both
    renders; PNG + HTML artifacts saved per the library convention
  weaknesses:
  - The 'Elastic Slope (E)' reference line (dashed, in the legend) is drawn almost
    exactly on top of the real near-vertical elastic segment and is very short, so
    it is practically invisible as its own element in the rendered PNG despite having
    a dedicated legend entry — extend it further past the curve or offset it slightly
    so both lines read as distinct.
  - 'Light-theme contrast: the amber ''Yield Point (250 MPa)'' label (~1.5:1 against
    #FAF8F1) and the lavender ''UTS (400 MPa)'' label (~2.7:1) both fall well under
    the WCAG 3:1 threshold for large text — exactly the amber/lavender-on-cream gap
    called out in the style guide. Since both mark a critical threshold, add the recommended
    thin ink-color stroke/halo to the text on the light render (dark-theme contrast
    is already fine).'
  - The gray leader arrow from the 'Elastic' label to the curve is drawn at an arbitrary
    shallow slope with no physical meaning; since it is far more visually prominent
    than the (barely visible) actual elastic-slope reference line, a reader could
    mistake the arrow itself for a slope indicator. Consider a shorter, clearly pointer-style
    arrow so it reads unambiguously as a label leader.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "line-stress-strain · python · bokeh · anyplot.ai" in dark ink, fully visible with generous top margin. Axis titles "Engineering Strain (mm/mm)" / "Engineering Stress (MPa)" in dark ink, tick labels in a softer gray. Subtle gridlines at ~15% alpha. Legend box (cream elevated fill, thin gray border) sits inside the necking-shaded region at lower right, near the fracture point it explains.
      Data: Brand-green (#009E73) stress-strain curve rising steeply (elastic), curving through strain hardening, peaking at the lavender UTS triangle (400 MPa), then descending through the rose-tinted necking band to the red fracture square. Amber circle marks the yield point (250 MPa) with a dashed amber 0.2%-offset line parallel to the elastic segment. A short dashed green "Elastic Slope (E)" reference line sits almost exactly on top of the real curve near the origin — hard to see as a separate element. A gray leader arrow with "Elastic" text points at the near-vertical segment. Region labels ("Elastic", "Strain Hardening", "Necking") and point labels ("Yield Point", "UTS", "Fracture", "E = 210 GPa") are placed with no overlap.
      Legibility verdict: PASS overall. The amber and lavender annotation text (Yield Point / UTS labels) have low mathematical contrast against the cream background (~1.5:1 and ~2.7:1, both under WCAG's 3:1) but remain visually parseable at this bold weight/size — flagged as a weakness rather than a hard failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title and axis titles now in light ink (#F0EFE8), tick labels in a lighter soft gray, gridlines at ~15% alpha against the dark surface. Legend box uses the dark elevated fill (#242420) with a light-gray border; fully legible.
      Data: All data colors are pixel-identical to the light render — same brand-green curve, same amber/lavender/red markers and offset/reference lines, same rose-tinted necking band (now reads as a warm dark-maroon tint against the near-black background). Only the chrome flipped.
      Legibility verdict: PASS. No dark-on-dark failures — every title, axis label, tick label, and annotation is clearly readable against the near-black surface. The amber and lavender annotation text actually have good contrast here (~11:1 and ~6.5:1) since they're light colors against a dark background, so the light-theme contrast weakness does not apply in this render.
