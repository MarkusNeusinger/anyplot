review:
  strengths:
  - Correct Imprint palette with semantically meaningful color assignments (brand
    green main curve, amber for yield/warning, lavender for UTS, red for fracture/failure)
    — theme-correct in both light and dark renders with identical data colors.
  - 'All required spec features present: region labels (Elastic, Strain Hardening,
    Necking), critical point markers (Yield, UTS, Fracture) with distinct shapes,
    0.2% offset line, and Young''s modulus text annotation.'
  - 'Idiomatic bokeh 3.x usage: ColumnDataSource, unified scatter(marker=...) API,
    HoverTool with vline mode for interactive strain/stress/region inspection, Span
    for reference lines, custom Legend/LegendItem construction.'
  - 'Clean theme-adaptive chrome: subtle grid (alpha=0.15), spines/outline removed,
    elevated semi-transparent legend box, correct background colors (#FAF8F1 / #1A1A17)
    in both themes with fully readable text.'
  - Realistic, factually sound mild-steel tensile test data (E=210 GPa, yield=250
    MPa, UTS=400 MPa) with clean KISS code structure and clean imports.
  weaknesses:
  - '"Elastic" region label is positioned at strain≈0.11, deep in the strain-hardening
    x-range, while the actual elastic region is compressed to strain 0–0.0012 (essentially
    against the y-axis). This mismatches the label with the curve segment it names
    — reposition the "Elastic" label close to the y-axis (or add a short leader line/arrow
    pointing to the near-vertical elastic segment) so the correspondence is unambiguous.'
  - Design is professionally correct but visually conservative — no dedicated slope-reference
    line for the elastic modulus (only a text annotation), and grid/legend styling
    stays close to a 'good default' rather than showing distinctive art-directed flourishes.
    Consider a subtle dashed reference line extending the elastic slope, or additional
    visual hierarchy (e.g., a lightly shaded necking zone) to elevate Design Excellence.
  - Interactive features used (HoverTool, Span, custom Legend) are solid but fairly
    standard bokeh patterns; consider a more distinctive feature such as a Band/Whisker
    annotation around the offset-line region or a CustomJSHover for richer tooltip
    formatting to better showcase bokeh-specific strengths.
