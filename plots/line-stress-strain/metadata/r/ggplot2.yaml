review:
  strengths:
  - 'All spec-required elements are present: elastic/plastic(strain-hardening)/necking
    regions labeled, yield (0.2% offset) / UTS / fracture critical points marked,
    elastic modulus annotated (E ≈ 70 GPa text) and the 0.2% offset construction line
    drawn parallel to the elastic slope.'
  - Direct-labeling of regions and critical points instead of a legend is a clean,
    idiomatic ggplot2 choice that avoids clutter for a single-series chart.
  - Realistic, physically-plausible aluminum-alloy tensile data (E ≈ 70 GPa, yield/UTS/fracture
    stresses and strains all in sensible ranges) generated with a piecewise elastic
    → hardening → necking model plus smoothed measurement noise.
  - 'Thoughtful micro-details: size hierarchy across the three critical-point markers
    (yield < UTS < fracture), semantic use of matte red (#AE3030) reserved only for
    the fracture/failure point, and white-edge (shape 21, PAGE_BG stroke) markers
    for definition against the ribbon fill.'
  - 'Theme-adaptive chrome is correctly threaded through: backgrounds, ink tones,
    and grid color all flip between light/dark while the brand-green line and semantic-red
    fracture marker stay identical.'
  - 'Clean code: single-purpose script, only the packages it uses, reproducible via
    set.seed(42), saves plot-{THEME}.png via ragg as required.'
  weaknesses:
  - 'Repeated text/element overlap (VQ-02), identical in both themes: the dotted region-boundary
    vlines at e_proportional and e_uts run directly through the ''Elastic'' and ''UTS''
    annotation text (the line crosses through the letters rather than stopping above/below
    the label). Nudge the ''Elastic'' and ''UTS'' annotate() y-positions (or the vline
    endpoints) so the dotted lines terminate at the label''s edge instead of crossing
    through it.'
  - The 'Fracture' label sits directly on top of the green data line — the line visibly
    cuts through 'racture' in both renders. Move the label further above/right of
    the line (e.g. increase the y-offset or right-shift x so the text clears the curve)
    rather than centering it on the line path.
  - The elastic-modulus annotation ('E ≈ 70 GPa') is text-only; consider making the
    steep elastic segment's slope more visually distinct (e.g. a short reference guide
    line) since the spec calls out 'a visible slope line or text annotation' and the
    current implementation relies solely on the text half of that either/or.
  - The ribbon fill under the whole curve (down to y=0) is decorative rather than
    meaningful for a stress-strain curve — it doesn't represent a real quantity (unlike,
    say, toughness/energy which would need integration to fracture only). Consider
    limiting it to a clearer semantic use or dropping it for a cleaner read.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white.
      Chrome: Title "Aluminum Alloy Tensile Test · line-stress-strain · r · ggplot2 · anyplot.ai" in dark ink, clearly legible, occupies roughly 70-75% of plot width (expected for the mandated long title). Axis titles "Engineering Strain" / "Engineering Stress (MPa)" and tick labels are dark/soft-dark and clearly readable. Y-axis gridlines are subtle horizontal lines only. No spines/tick marks visible (theme_minimal + explicit removal).
      Data: Single brand-green (#009E73) curve with a light green ribbon fill beneath it, tracing elastic → yield → strain-hardening → necking → fracture. Region labels "Elastic", "Plastic (strain hardening)", "Necking" sit above the curve; two dotted gray vertical lines mark region boundaries (at proportional-limit and UTS strain) but run directly through the "Elastic" and "UTS" label text rather than stopping short of it. A dashed gray 0.2% offset line runs parallel to the elastic slope. Yield and UTS points are marked with dark-filled circles with light edges; the fracture point is a distinct matte-red (#AE3030) circle, and its "Fracture" label overlaps the green curve line beneath it (the line visibly crosses through the letters).
      Legibility verdict: PASS overall (all text is readable against the background and against the curve color), but FLAG two repeated text/line overlaps described above — a VQ-02 deduction, not a legibility (VQ-01) failure since every character remains distinguishable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black.
      Chrome: Same title, now in light ink (#F0EFE8), fully legible against the dark background. Axis titles and tick labels rendered in light/soft-light tones, clearly readable, no dark-on-dark issues found. Gridlines subtle and visible.
      Data: Data colors are pixel-identical to the light render — same brand-green curve/ribbon and same matte-red fracture marker — confirming only chrome (background, text, grid, marker edge color which flips to the dark PAGE_BG) changed between themes. Yield/UTS point fills flip to a light ink tone (correct theme-adaptive INK token) with dark-background-colored edges.
      Legibility verdict: PASS overall (no dark-on-dark or light-on-light failures), with the same two overlap issues (dotted vlines through "Elastic"/"UTS" text; data line through "Fracture" text) reproduced identically, confirming this is a fixed-layout issue rather than a theme-specific rendering bug.
