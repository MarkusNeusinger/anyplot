review:
  strengths:
  - 'Excellent spec compliance — every required feature is present: elastic/plastic/necking
    region labels, yield (0.2% offset), UTS, and fracture point markers, the 0.2%
    offset construction line, and an elastic-modulus text annotation.'
  - Strong data storytelling — phase labels and critical-point markers guide the viewer
    through the material's mechanical behavior progression without needing a legend.
  - 'Correct, theme-adaptive Imprint palette usage: brand green (#009E73) for the
    curve, semantic matte red (#AE3030) for the fracture point, and the theme-adaptive
    ink/neutral token for the yield and UTS reference markers.'
  - Realistic, well-scaled aluminum-alloy tensile-test data — E ≈ 70 GPa, yield ≈
    280 MPa, UTS ≈ 310 MPa closely track real 6061-T6-like properties, with plausible
    fracture strain.
  - 'Both renders are theme-correct: identical data colors, correctly flipped chrome
    (background, text, gridlines, and marker fill/stroke swap appropriately).'
  weaknesses:
  - Y-axis major gridlines render at full INK opacity (color = INK, linewidth = 0.25)
    rather than the style guide's soft 15-25% opacity look — they read as more assertive
    solid lines than the intended subtle grid. Since ggplot2 has no per-element alpha
    for grid lines, blend a faint gray/INK_MUTED-derived hex instead of full INK to
    soften them.
  - 'Design Excellence is solid but not yet publication-tier: color and marker treatment
    are correct but fairly restrained — consider a touch more visual refinement (e.g.
    a slightly softer secondary tone for the guide lines, or refined marker sizing
    hierarchy) to lift aesthetic sophistication further.'
  - The `material_curve()` helper function (and its reuse inside `uniroot()`) deviates
    from the strict KISS 'no functions' structure — understandable given it's reused
    for both the data curve and the offset-intersection solve, but flagged for the
    repair loop to consider inlining if it can be done cleanly.
  - Library Mastery is fairly generic ggplot2 layering (geom_line/geom_point/geom_vline/annotate)
    — none of it is distinctive to ggplot2 specifically; consider leveraging a more
    library-distinctive technique (e.g. a stat layer or scale transform) to strengthen
    LM-02.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) plot and panel background, matching the light theme surface.
      Chrome: Title "Aluminum Alloy Tensile Test · line-stress-strain · r · ggplot2 · anyplot.ai" in dark ink at the top, clearly readable. X-axis label "Engineering Strain" and Y-axis label "Engineering Stress (MPa)" in dark ink, tick labels in a softer gray. Subtle solid horizontal gridlines at 0/100/200/300 MPa. Region labels ("Elastic", "Plastic (strain hardening)", "Necking") and point labels ("Yield (0.2% offset)", "UTS", "Fracture") render in dark/soft-dark tones, all legible against the light background.
      Data: Green (#009E73) tensile curve rising steeply through the elastic region, plateauing through strain hardening, then descending through necking to a red (#AE3030) fracture point. Yield and UTS points are filled with dark ink and a light stroke. A dashed gray 0.2% offset line and two dotted vertical guide lines mark region boundaries.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) plot and panel background, matching the dark theme surface.
      Chrome: Title, axis labels, and tick labels render in light ink/soft-light tones, clearly visible against the dark background. Gridlines render as light horizontal lines. Region and point labels use the same light-ink tokens and remain legible.
      Data: Identical green (#009E73) curve and red (#AE3030) fracture point as the light render — data colors are unchanged between themes. Yield and UTS markers flip to a light fill (matching the ink token) with a dark stroke, consistent with the correct theme-adaptive marker treatment. Offset line and guide lines remain a muted gray, visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all text and gridlines are clearly visible against the dark background.
