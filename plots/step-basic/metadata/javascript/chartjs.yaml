review:
  strengths:
  - 'Correct Imprint palette compliance: brand green #009E73 is identical across light
    and dark renders, and theme-adaptive chrome (title, ticks, grid, marker halo)
    is correctly sourced from ANYPLOT_TOKENS in both themes.'
  - 'Correct step semantics: stepped: "after" matches the spec''s ''post'' style (value
    holds from the current point until the next), and markers are placed exactly at
    each scaling event.'
  - 'Realistic, plausible dataset: 11-point auto-scaling timeline (4-30 instances)
    with a full mix of up and down transitions, clean deterministic in-memory data,
    no RNG needed.'
  - 'Clean, minimal code: KISS structure, only the mount-node contract + Chart.js
    global, animation disabled, no fake interactivity or over-engineering.'
  - 'Nice refinement touch: pointBorderColor set to the page background creates a
    halo around markers so they stay legible against the step line in both themes.'
  - No overlapping or clipped text in either render; title format exactly matches
    the required 'step-basic · javascript · chartjs · anyplot.ai' convention.
  weaknesses:
  - 'Design Excellence is generic: a competently theme-mapped default, but nothing
    elevates it beyond that — e.g. no subtle area fill under the step line, no gradient,
    no emphasis technique.'
  - 'No data storytelling / visual hierarchy: every step segment has equal visual
    weight. Consider a subtle callout or color/size emphasis on the daily peak (30
    instances around 09:30) or the overnight trough to give the viewer a focal point.'
  - 'Library Mastery is only moderate: stepped: "after" is the standard, expected
    way to build a Chart.js step chart — nothing distinctive to Chart.js is used beyond
    the base line config (e.g. segment-level styling, scriptable colors/gradients,
    or a fill).'
  - 'Minor layout tightness: the rightmost x-axis tick (00:00 at hour 24) sits close
    to the canvas edge — not clipped, but could use a touch more right padding for
    breathing room.'
