review:
  strengths:
  - 'Repair directly resolved attempt-1 weaknesses: a plotBand with ''Peak scaling
    window'' label now calls out the 10-instance plateau (hours 11-13), and a light
    Imprint-green area fill under the step line adds visual hierarchy beyond a bare
    line'
  - 'Correct idiomatic step semantics: `area` + `step: "right"` matches the spec''s
    ''post'' style (value holds from the current point until the next), with an accurate
    in-code comment explaining the choice'
  - 'Both renders are theme-correct: canvas exactly 3200x1800, backgrounds match #FAF8F1/#1A1A17,
    and the #009E73 series/fill color is identical across light and dark while chrome
    (ink/inkSoft/grid tokens) flips correctly'
  - Realistic, neutral dataset (auto-scaling web service instance count over 24h)
    clearly demonstrates step-plot semantics with rising, plateau, and falling segments
  - Markers at every hour highlight exact change moments per the spec's guidance,
    without cluttering the sparse 24-point series
  - 'Clean, deterministic, KISS code: no imports, hard-coded in-memory arrays, animation
    disabled on both chart and series per the harness contract'
  - 'Prior redundant per-series color declaration was removed — colors are now set
    once via the top-level `colors: t.palette`'
  weaknesses:
  - 'Design Excellence is improved but still moderate: the plotBand + area fill are
    the only distinctive touches — no dataLabels at the transition points, no tooltip
    customization, no secondary accent to further sharpen hierarchy'
  - '''Peak scaling window'' plotBand label renders at 12px, notably smaller than
    the 14px tick labels — legible but slightly under-weighted relative to the rest
    of the chrome scale; consider 13-14px for better visual balance'
  - 'Library Mastery still has headroom: only one Highcharts-distinctive feature (plotBands)
    is showcased — dataLabels, a custom tooltip formatter, or plotLines at key hours
    would demonstrate more of the library''s toolkit'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white and not dark — matches Imprint light chrome.
