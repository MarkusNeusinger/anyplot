      Data: Single Imprint-green (#009E73) step line (step: "right" / post-style) with circular markers at every hour, plus a light semi-transparent green area fill beneath it. The step rises from 2 instances overnight to a plateau of 10 around hours 11-13 (inside the highlighted band), then steps back down to 2 by hour 21 — a clean, legible "post" step pattern.
