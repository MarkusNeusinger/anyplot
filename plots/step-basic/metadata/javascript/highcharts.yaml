review:
  strengths:
  - 'Correct idiomatic Highcharts step implementation (type: "line" + plotOptions.line.step:
    "right") matching the spec''s ''post'' step semantics, with an accurate in-code
    comment explaining the choice'
  - 'Both renders are theme-correct: canvas exactly 3200x1800, backgrounds match #FAF8F1/#1A1A17,
    and the #009E73 series color is identical across light/dark while chrome (ink/inkSoft/grid
    tokens) flips correctly'
  - Realistic, neutral dataset (auto-scaling web service instance count over 24h)
    clearly demonstrates step-plot semantics with both rising and falling steps and
    a flat plateau
  - Markers at every data point highlight the exact change moments per the spec's
    guidance, without cluttering the sparse 24-point series
  - 'Clean, deterministic, KISS code: no imports needed, hard-coded in-memory arrays,
    animation disabled on both chart and series per the harness contract'
  weaknesses:
  - 'Design Excellence is generic: relies entirely on the library-guide token mapping
    with no additional refinement (e.g. no annotation calling out the 10-instance
    plateau, no subtle area fill or accent to add visual hierarchy beyond the single
    green line)'
  - No Highcharts-distinctive features used beyond core step/line/marker options (no
    plotBands to mark scaling windows, no custom dataLabels, no tooltip customization)
    — a missed opportunity to showcase library-specific capabilities
  - 'Redundant color declaration: both top-level colors: t.palette and per-series
    color: t.palette[0] are set for the same single series — harmless but unnecessary'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "step-basic · javascript · highcharts · anyplot.ai" in bold dark ink, centered near top, occupying roughly 30% of plot width (well within safe bounds, no overflow). "Hour of Day" x-axis title and "Active Instances" y-axis title in medium-grey ink-soft, both legible. Tick labels (0-22 on x, 0-11 on y) in matching grey, all readable. Horizontal gridlines are faint and subtle, aiding value tracing without dominating.
      Data: Single step-line series in Imprint green (#009E73) with circular markers (radius 5) at every hour. Step direction is "right" (post-style): the line holds flat from each point until the next, rising from 2 instances overnight to a plateau of 10 around hours 11-13, then stepping back down to 2 by hour 21. Line and markers are clearly distinguishable against the light background.
