      Data: The step line, markers, and area fill are the identical #009E73 green — confirming only chrome flipped, not data color — reading with strong contrast against the near-black background. No dark-on-dark issues anywhere; no near-black text on the near-black surface.
      Legibility verdict: PASS — all text and data elements are clearly readable, no dark-on-dark failures observed.
