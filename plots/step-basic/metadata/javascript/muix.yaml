review:
  strengths:
  - Both renders are pixel-clean with identical Imprint data colors and fully theme-adaptive
    chrome — no clipping, no overlap, no light-on-light/dark-on-dark failures anywhere
    on the canvas
  - 'Effective data storytelling: the two largest restock jumps (day 9, day 17) get
    larger filled markers so the chart''s narrative reads at a glance instead of a
    uniform row of dots'
  - Idiomatic, distinctive MUI X usage within the community surface — ChartsReferenceLine
    for the reorder threshold, a custom slots.mark component for event emphasis, and
    an area fill under the stepAfter line
  - Realistic, neutral warehouse-inventory scenario with genuine step-up AND step-down
    transitions across 24 days, including a threshold breach that gives the reorder-point
    line real meaning
  - All font sizes explicitly set (title 22px, axis label 16px, ticks 14px) and well
    balanced between X/Y axes; the manual rotated y-axis-label workaround is documented
    and solves a real MUI overlap issue
  weaknesses:
  - Small default tick marks remain on both axes alongside the tick labels — the style
    guide's decoration checklist prefers keeping only the tick labels and removing
    the marks themselves for a cleaner L-shaped frame
  - The 22 non-event markers are a uniform small size; since this is a sparse 24-point
    series, slightly larger base markers (beyond the two emphasized event points)
    would read even better at a glance
  - Design Excellence is strong but not yet at publication-tier polish — e.g. a short
    data-label/annotation calling out the two restock magnitudes (+270, +240 units)
    would push the storytelling further given the chart already has room for it
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "step-basic · javascript · muix · anyplot.ai" centered at top in bold dark ink, fully visible. Rotated "Units in Stock" y-axis label at left, "Day of Month" x-axis label at bottom, both dark ink and clearly legible. Tick labels on both axes in a softer dark grey. Horizontal grid lines only, subtle and non-competing. Amber dashed "Reorder Point" reference line at y=500 with matching amber label, right-aligned, fully within canvas bounds.
      Data: Brand-green (#009E73-family) stepAfter line with a light green area fill beneath it. Small hollow green-stroked circle markers at every data point; two larger filled green circles (day 9 and day 17) highlight the biggest restock jumps. First (and only) series correctly uses the brand green.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, reference-line label) is clearly readable against the light background, no overlap or clipping anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-light grey, fully legible against the dark surface. Grid lines subtle and visible. "Reorder Point" dashed line and label still amber and clearly visible on dark background.
      Data: Line, area fill, and marker colors are identical to the light render (brand green unchanged) — only the chrome flipped as expected. No dark-on-dark text anywhere; every label element uses a light-toned token.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements; text and data are both fully legible against the dark surface.
