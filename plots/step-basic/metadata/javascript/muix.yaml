review:
  strengths:
  - 'Uses MUI X''s native `curve: "stepAfter"` interpolation for a true post-step
    line: every value is held flat until the next day and every change is a vertical
    jump at the data''s x value, matching the inventory semantics stated in the data
    comment'
  - 'Hollow circular markers (`showMark: true`, `shape: "circle"`) sit exactly on
    each daily reading and stay small enough that the plateaus still read as lines'
  - 'Theme tokens threaded through title, axis labels, ticks, axis lines and grid
    (`t.ink`, `t.inkSoft`, `t.grid`); brand green #009E73 is identical in both renders'
  - Horizontal-only grid chosen to trace stock levels across the plateaus, without
    vertical lines competing with the step risers
  - 'Axis bands sized explicitly (`height: 64`, `width: 80`) per the v9 sizing rule,
    so no tick label is truncated; `skipAnimation` set and the HTML output keeps MUI
    X''s native hover tooltip'
  weaknesses:
  - 'Suggestion: the zero baseline leaves the band below 400 units empty (about 40
    % of the plot height); a y range starting near the minimum stock would give the
    plateau differences more vertical resolution, if the empty-warehouse reference
    is not meant to be part of the reading.'
  - 'Suggestion: a slightly larger title (about 26 px) would carry more presence at
    the top of the 1600 px canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: bold dark title "step-basic · javascript · muix · anyplot.ai" centered at top; y-axis title "Units in stock" (rotated) and x-axis title "Day of month" in dark ink; tick labels 0–800 (step 100) and 2–24 (step 2) in soft dark grey; left and bottom axis lines in inkSoft; faint horizontal grid lines only. All readable, nothing clipped.
      Data: a single #009E73 post-style step line over days 1–24, values 410–820, with hollow circle markers (page-colored fill, green ring) on every daily reading; risers at days 3, 6, 9 (big jump to 680), 12, 14, 17 (jump to 820), 19, 22, 24. No sloped connections.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17 — not pure black.
