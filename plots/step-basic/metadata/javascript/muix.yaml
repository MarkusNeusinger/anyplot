review:
  strengths:
  - Correct, idiomatic use of MUI X's `curve="stepAfter"` on <LineChart>, matched
    to a plausible restock/shipment narrative (comment explicitly justifies the choice)
  - 'First and only series is brand green #009E73; identical across light/dark; page
    backgrounds are correctly #FAF8F1 / #1A1A17'
  - All font sizes explicitly set (title 22px, axis labels 16px, tick labels 14px)
    and readable in both themes with no dark-on-dark/light-on-light failures
  - Y-axis label handled with a manually positioned, rotated <Typography> to avoid
    a real MUI X ChartsYAxis label/tick collision at 3-digit values -- the code comment
    explains the workaround clearly
  - Data shows both upward and downward step changes across a 24-day series, giving
    a realistic and varied warehouse-inventory scenario
  - Single-series legend correctly hidden (`slotProps.legend.hidden`), horizontal-only
    grid, L-shaped spines -- clean minimal chrome
  weaknesses:
  - Data markers (showMark circles) are on the small side for a sparse 24-point series
    -- per the data-density heuristic, sparse data should have larger, more prominent
    markers; consider increasing marker radius via slotProps/sx for better visibility
    at a glance
  - 'Design Excellence is at library-default level: no color/size emphasis or annotation
    calls out the two most notable events (the day-9 jump from 410->680 and the day-17
    jump from 580->820) -- a highlighted marker, callout, or subtle reference line
    at these points would turn a correct chart into a story'
  - Aesthetic polish is functional but generic -- consider a slightly heavier line
    weight or a subtle area fill under the step line (still within community `@mui/x-charts`)
    to add visual sophistication beyond the plain line-with-circles default
  - 'Distinctive-feature usage is fairly light: beyond `curve="stepAfter"`, the implementation
    doesn''t lean into other MUI X-specific capabilities (e.g. `ChartsReferenceLine`,
    gradient defs, or an axis threshold band) that would showcase more of the library''s
    community-tier richness'
  image_description: |-
