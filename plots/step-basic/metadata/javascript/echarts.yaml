review:
  strengths:
  - 'Correct step semantics: step: "end" holds each setpoint constant until the next
    scheduled change, matching the spec''s ''post'' style definition exactly'
  - 'Markers rendered only at actual change points (symbolSize: isChange ? 14 : 0)
    — a precise implementation of the spec''s suggestion to highlight where changes
    occur, without cluttering flat segments'
  - Explicit, well-proportioned font sizing across the hierarchy (title 22px, axis
    names 16px, ticks 14px) with balanced X/Y treatment and no overlap
  - 'Clean theme-adaptive chrome: y-axis spine removed, x-axis spine kept subtle,
    y-axis-only split lines, both renders read correctly (#FAF8F1 light / #1A1A17
    dark, identical #009E73 data color)'
  - Realistic, neutral thermostat-schedule scenario with plausible setpoints (17-22°C)
    and varied hold durations that clearly demonstrate step-function behavior
  - Deterministic, dependency-free data generation; single small helper function keeps
    the script linear and easy to follow
  - Thoughtful x-axis tick thinning (every 3rd hour) avoids label crowding across
    25 categories without losing readability
  weaknesses:
  - Design stays close to a well-configured library default (single accent color,
    8% area fill) rather than showing distinctive aesthetic sophistication — no secondary
    visual device (e.g. subtle period shading, direct labeling of the schedule phases)
    to lift it beyond competent minimalism
  - No annotation or direct labeling of what each held segment represents (e.g. 'night
    setback', 'evening occupied') — the schedule is legible but the viewer has to
    infer meaning from time-of-day alone rather than the chart telling the story
  - Per-point marker sizing via the {value, symbol, symbolSize} object syntax is a
    light ECharts idiom but is easily replicated in most other charting libraries
    — doesn't showcase a feature genuinely unique to ECharts
  - X-axis spine (axisLine) is still shown while the y-axis spine was removed — an
    inconsistency in chrome refinement
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "step-basic · javascript · echarts · anyplot.ai" centered at top in bold dark ink, clearly legible. X-axis title "Time of Day" and Y-axis title "Setpoint Temperature (°C)" both in dark ink, readable. Tick labels (hour marks every 3h, temperature values 15-24) in a softer dark gray, all legible against the light background. Horizontal gridlines are subtle light gray, visible but not dominant; vertical gridlines are off (splitLine: show:false on x-axis), keeping the chart clean.
      Data: Single step line in Imprint green (#009E73) with a light 8%-opacity green area fill beneath it. Circular markers (14px) appear only at the 5 points where the setpoint actually changes (00:00, 06:00, 09:00, 16:00, ~22:00); flat segments have no markers, keeping the plot uncluttered. The step pattern clearly shows: 17°C night setback -> 21°C morning -> 19°C daytime away -> 22°C evening -> 17°C night setback again.
      Legibility verdict: PASS — all text is dark and clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light/white text, clearly legible against the dark background. Gridlines are a subtle dark gray, visible but unobtrusive. No dark-on-dark text anywhere — every label, tick, and title is unambiguously readable.
      Data: Step line and markers remain identical Imprint green (#009E73), matching the light render exactly; area fill again uses a subtle green tint that reads well on the dark surface. The green is highly legible on the near-black background.
      Legibility verdict: PASS — all text is light-colored and clearly readable against the dark background; no dark-on-dark failures found.
