review:
  strengths:
  - Correct use of d3.curveStepAfter to implement the spec's 'post' step style (value
    holds from the current reading until the next), matching the specification's guidance
    precisely.
  - 'Both renders are theme-correct: warm off-white (#FAF8F1) and warm near-black
    (#1A1A17) backgrounds, all text legible, and the data color (#009E73) is identical
    between light and dark — only chrome flips.'
  - Hollow-marker technique (circle fill = t.pageBg, stroke = palette color) creates
    a clean, non-cluttered highlight at each of the 24 hourly readings without obscuring
    the step line.
  - Y-axis-only gridlines with the axis domain removed on the grid group, per the
    style guide.
  - Realistic, neutral dataset (hourly warehouse inventory with two restock events
    at hour 8 and 16) that clearly exercises the step-plot form — the abrupt vertical
    jumps read unambiguously as restocking events.
  - 'Clean KISS structure: no functions/classes, deterministic hardcoded data, only
    the required d3 global — nothing to flag on reproducibility or imports.'
  weaknesses:
  - Design excellence is largely generic beyond the token-driven baseline — the two
    restock events (the most narratively interesting feature of the data) get no visual
    emphasis (e.g. a subtle annotation or callout), so the story of 'inventory resets
    twice a day' isn't reinforced beyond what the raw step shape already shows.
  - Axis domain (baseline) lines are kept on both axes at full inkSoft weight rather
    than lightened/removed, which is a common refinement at this design tier for a
    more minimal, spine-free look.
  - Distinctive-feature usage is modest — relies on standard d3-shape/d3-axis primitives
    (scaleLinear, axisBottom/Left, curveStepAfter) required by the spec itself; no
    additional d3-specific flourish beyond the hollow-marker treatment.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — clearly not pure white, not dark.
      Chrome: Title "step-basic · javascript · d3 · anyplot.ai" in bold dark text, centered top. Y-axis label "Warehouse Inventory (units)" rotated at left, X-axis label "Hour of Day" centered below. Tick labels (0:00, 4:00, 8:00... and 300-650 in steps of 50) in a soft dark gray. Subtle horizontal gridlines only. All chrome text is dark-on-light and clearly legible.
      Data: Single teal/green (#009E73) step line using post-style steps (curveStepAfter) tracing 24 hourly inventory readings, with two sharp upward jumps (restocks) at hour 8 (365→600) and hour 16 (425→620), then gradual declines between restocks. Hollow circular markers (fill matches page background, teal stroke) mark each of the 24 readings.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — clearly not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light/white text against the dark background — all clearly legible, no dark-on-dark issues observed anywhere (title, axis labels, tick labels, axis domain lines all use a light ink token). Gridlines remain subtle but visible.
      Data: Identical teal (#009E73) step line and hollow markers as the light render — confirms data colors are unchanged between themes, only chrome (background/text/grid) flips as required.
      Legibility verdict: PASS
