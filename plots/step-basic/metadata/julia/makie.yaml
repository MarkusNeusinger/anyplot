review:
  strengths:
  - Correct 'post' step style matching the spec's semantics ('value applies from current
    point until next'), explained in a clear code comment
  - Distinctive band!() area fill under the step curve gives the data visual weight,
    a Makie-idiomatic compositional technique
  - Peak staffing level highlighted with a larger marker, creating a subtle focal
    point without extra chrome
  - Both themes correctly implement the Imprint palette and theme-adaptive chrome;
    all text legible in both light and dark renders
  - Realistic, neutral retail-staffing scenario with sensible values across a full
    day cycle, including both increasing and decreasing steps
  - Clean KISS structure, explicit font sizes throughout, correct plot-$(THEME).png
    output naming
  weaknesses:
  - Data storytelling relies only on a subtle marker-size difference (16 vs 24) to
    flag the daily peak — an explicit annotation would make the focal point unmistakable
  - band!() + stairs!() is a nice combination but not deeply distinctive to Makie;
    a more library-unique feature would raise Library Mastery further
  - Grid is limited to horizontal lines at major ticks only — fine per spec, but gridlines
    at each step boundary would make value-tracing marginally easier
  image_description: |-
