review:
  strengths:
  - Correct 'post' step semantics via stairs!(..., step = :post), matching the spec's
    guidance that the value applies from the current point until the next
  - 'Full theme-adaptive chrome: title/labels use INK, ticks use INK_SOFT, grid uses
    a theme-derived RGBAf with 0.15 alpha — both renders are legible and theme-correct'
  - 'First (and only) categorical series is exactly Imprint #009E73, identical between
    light and dark renders'
  - Markers at every data point (per spec note 'highlight where changes occur') with
    theme-matched stroke color for clean separation from the line
  - 'Realistic, neutral scenario (retail checkout lane staffing) with a full daily
    arc: ramp-up, midday plateau/dip, evening peak, wind-down to 0'
  - Clean KISS structure, deterministic data (no seed needed), only used imports (CairoMakie,
    Colors)
  - Title correctly follows '{Descriptive Title} · step-basic · julia · makie · anyplot.ai'
    format; single-series legend correctly omitted
  weaknesses:
  - Design Excellence is at the 'well-configured default' level — a single flat green
    stairs! line with no fill, no annotation, no callout on the peak (18:00-20:00)
    or the closing drop to 0. Consider a subtle band!/fill under the step to add visual
    weight, or a small annotate!() callout marking the peak staffing window.
  - No visual hierarchy beyond the natural data shape — nothing distinguishes the
    peak or the closing period from the rest of the line. A light fill, a highlighted
    marker at the peak, or an annotation would push Data Storytelling beyond the default.
  - 'Library Mastery is generic: stairs! + scatter! is the minimum idiomatic pairing
    for a step plot but doesn''t showcase a Makie-distinctive feature (e.g. band!
    for a shaded step-area, or text!/annotate-style callouts) that would set the implementation
    apart from a matplotlib step() equivalent.'
