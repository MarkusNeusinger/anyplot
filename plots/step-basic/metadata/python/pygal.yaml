review:
  strengths:
  - 'Genuine step-chart semantics: the implementation manually constructs true vertical/horizontal
    segments via pygal.XY coordinate injection (prev-value hold → point → forward
    hold), correctly implementing ''post'' step style per the spec Notes rather than
    faking it with a diagonal line chart.'
  - 'Correct theme-adaptive chrome and Imprint palette in both renders: first series
    is #009E73 in both, plot backgrounds match #FAF8F1 (light) / #1A1A17 (dark) exactly,
    and all title/axis/tick text stays readable in both themes with no dark-on-dark
    or light-on-light failures.'
  - 'Data-driven storytelling: peak month-on-month growth (November, +$73K) is computed
    from the data itself and highlighted with an enlarged marker (r=20 vs r=10) rather
    than a hardcoded annotation.'
  - 'Rich per-point tooltip labels via pygal''s node ''label'' dict give the interactive
    HTML export real added value beyond the static PNG (e.g. ''★ Peak growth — Nov:
    +$73K → $562K cumulative'').'
  - Clean KISS code structure with deterministic hardcoded data, all font sizes explicitly
    set (title/axis/tick/legend/value), and correct current API usage (render_to_png
    + render() for HTML).
  weaknesses:
  - 'DE-03: The peak-growth story (November''s larger dot) is only explained via the
    HTML hover tooltip — in the static PNG a viewer sees a bigger green dot with no
    visible reason why. Consider adding a small value/text label near the peak point
    (e.g. via pygal''s value_font_size / print_values, or a lightweight annotation)
    so the insight reads on the static image too.'
  - 'DE-01/DE-02: Solid but still reads as a well-configured default rather than fully
    publication-ready — e.g. no accent styling beyond the single fill+line+dots combo.
    A subtle refinement (softer fill opacity gradient, a defined stroke on the peak
    marker, or a touch more typographic hierarchy) would push this further.'
  - 'VQ-01: Tick labels get noticeably small once the PNG is scaled to the ~400px
    mobile thumbnail — a modest bump to major_label_font_size would improve mobile
    legibility.'
  - 'VQ-03: With only 12 sparse data points, the standard dot radius (r=10) could
    be scaled up further relative to the 3200x1800 canvas for stronger visual prominence,
    consistent with the sparse-data marker guidance.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the mandated #FAF8F1 surface — not pure white.
      Chrome: Title "step-basic · pygal · anyplot.ai" in dark ink, centered top, in a monospace face; x-axis title "Month" and y-axis title "Cumulative Sales ($K)" both dark and clearly readable; tick labels (Jan-Dec on x, 0-700 in 100s on y) are dark and legible; subtle dashed horizontal (Y-axis only) gridlines in a muted tone that doesn't compete with the data.
      Data: Single series in Imprint brand green (#009E73) — a true step line (vertical rises + horizontal holds) with a light-green fill under the curve, small dots at each of the 12 monthly data points, and one visibly larger dot at November marking the month of peak month-over-month growth.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the mandated #1A1A17 surface — not pure black.
      Chrome: Same title/axis/tick layout as the light render, now rendered in light-toned text (off-white/light-grey) that reads clearly against the dark background; gridlines are a subtle light-toned dashed line at low opacity.
      Data: The step line, fill, and dots are rendered in the identical #009E73 green as the light render — confirming the data color is theme-invariant and only chrome (background + text + grid) flipped.
      Legibility verdict: PASS — all text is clearly light-on-dark; no dark-on-dark failures found. Brand green remains highly visible against the dark surface.
