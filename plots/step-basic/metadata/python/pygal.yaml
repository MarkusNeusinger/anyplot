review:
  strengths:
  - 'Genuine step-chart semantics: true vertical/horizontal segments via pygal.XY
    coordinate injection, correctly implementing "post" step style per the spec Notes
    rather than faking it with a diagonal line.'
  - 'Correct theme-adaptive chrome and Imprint palette in both renders: first series
    #009E73 in both, backgrounds #FAF8F1/#1A1A17 exactly, all text readable in both
    themes.'
  - The peak-growth insight (November, +$73K) now reads directly off the static PNG
    via an enlarged, ring-stroked marker plus a visible text label — fixes the exact
    weakness flagged in attempt 1.
  - Rich per-point tooltip labels via pygal's node label dict add real value to the
    interactive HTML export.
  - Clean, deterministic data; all font sizes explicitly set; correct current API
    usage; sparse-data markers appropriately sized up (r=14, peak r=26).
  weaknesses:
  - Title is missing the required {language} token — currently 'step-basic · pygal
    · anyplot.ai', should be 'step-basic · python · pygal · anyplot.ai' per SC-04's
    mandated format.
  - Design Excellence still reads as "well-configured" rather than fully publication-ready
    — a touch more typographic hierarchy would push DE-01 further.
  - The _blank() helper is a function purely for a formatter callback; a lambda inline
    (matching the pattern already used for the peak's formatter) would keep the script's
    flat KISS structure.
  - Tick labels remain on the smaller side at ~400px mobile thumbnail scale.
