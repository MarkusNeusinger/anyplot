review:
  strengths:
  - 'Genuine letsplot-distinctive interactive feature: layer_tooltips() on geom_point
    provides a real hover tooltip in the HTML export (Month + Cumulative sales), not
    a fake/simulated interaction'
  - Layered composition (geom_area + geom_step + geom_point + geom_text) reads cleanly
    as a single cohesive stair-step story with a shaded fill that hugs the step shape
    via a hand-built hv-interpolated area_df
  - Correct Imprint brand green (#009E73) used consistently for line, markers, and
    fill across both themes; backgrounds are the correct warm off-white / near-black
    surfaces
  - Theme-adaptive chrome correctly threaded through INK / INK_SOFT / RULE tokens
    - all text is readable in both light and dark renders with no dark-on-dark or
    light-on-light failures
  - 'Realistic, neutral data: monthly sales figures cumulating to a plausible $822K
    annual total, matching the spec''s suggested ''monthly cumulative sales'' example
    exactly'
  - 'Clean KISS structure: no functions/classes, only used imports, explicit np.random.seed(42)
    for reproducibility, correct plot-{theme}.png/.html output naming'
  weaknesses:
  - 'The ''Year-end total: $822K'' annotation uses geom_text(size=13) which, per lets-plot''s
    mm-based sizing for geom_text, renders at roughly 37pt - visibly larger than the
    16pt plot_title and the largest text element on the whole chart. This inverts
    the intended typography hierarchy (title should be the largest, annotations/tertiary
    text the smallest). Reduce geom_text size to ~4-5 (mm) to sit clearly below the
    title and axis-label sizes.'
  - The panel keeps a full four-sided border (top, right, bottom, left all visible
    as a boxed frame) in both renders instead of the style guide's default L-shaped
    frame (spines removed on top/right). Add a theme() override to hide/blank the
    top and right panel border for a cleaner, more modern look.
  - Only ascending steps are shown (inherent to a cumulative-sum series) - fine given
    the spec's own 'cumulative sales' example, but it means the step plot never demonstrates
    a flat-then-down or larger/smaller step-size contrast beyond the naturally increasing
    pattern.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "step-basic · letsplot · anyplot.ai" top-left in dark ink, fully visible with clear margin above/around it. Axis titles "Month" (x) and "Cumulative Sales ($K)" (y) in dark ink, comparable sizes. Tick labels (1-12 on x; 0-900 by 100s on y) in a softer grey, comparable sizes on both axes, none clipped. Subtle horizontal (y-axis only) gridlines, barely visible, not competing with data. A dark grey annotation "Year-end total: $822K" sits top-right, clear of the data line.
      Data: Brand green (#009E73) step line (direction="hv"), matching green circular markers at each of the 12 monthly points, and a light green semi-transparent area fill that hugs the stair shape underneath the line.
      Legibility verdict: PASS - all text is clearly readable against the light background. The only issue is proportional, not legibility: the annotation text is noticeably larger than the title, which looks slightly off-hierarchy but is not a readability failure.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Title, axis titles, and tick labels all rendered in light ink/grey tones, clearly legible against the dark surface - no dark-on-dark failures observed anywhere (title, axis labels, ticks, and the "Year-end total" annotation are all light-colored and easy to read). Gridlines are faint light lines, still visible but subtle.
      Data: Same #009E73 green for line, markers, and area fill as the light render - data colors are identical between themes, only the chrome (background/text/grid) flipped as expected.
      Legibility verdict: PASS - every text element reads clearly on the dark background; no black-on-black or unreadable elements found.
