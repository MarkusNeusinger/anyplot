review:
  strengths:
  - 'Both attempt-1 weaknesses are fixed: the ''Year-end total'' annotation now uses
    geom_text(size=4.5) (~12-13pt), correctly subordinate to the 16pt title, and the
    panel border is now a clean L-shape (panel_border=element_blank() + explicit axis_line_x/axis_line_y)
    instead of a four-sided box — pixel inspection confirms only a left and bottom
    line remain, no full box, no tick marks'
  - 'Genuine letsplot-distinctive interactive feature: layer_tooltips() on geom_point
    provides a real hover tooltip in the HTML export, not a fake/simulated interaction'
  - Layered composition (geom_area + geom_step + geom_point + geom_text) reads as
    a cohesive stair-step story, with a shaded fill hand-built via an hv-interpolated
    area_df so it hugs the step shape instead of cutting a diagonal
  - Correct Imprint brand green (#009E73) used consistently across both themes; backgrounds
    are the correct warm off-white / near-black surfaces with no dark-on-dark or light-on-light
    failures
  - 'Realistic, neutral data: monthly sales cumulating to a plausible $822K annual
    total, matching the spec''s own suggested example'
  - Clean KISS structure, reproducible, correct output naming/API
  weaknesses:
  - Only ascending steps are shown (inherent to a cumulative-sum series) — reasonable
    given the spec's own 'cumulative sales' example, but the chart never demonstrates
    a down-step or a stronger contrast in step sizes
  - np.random.seed(42) is set but never consumed (all data values are hardcoded arrays,
    not drawn from a random call) — harmless but slightly vestigial; either use it
    to generate the monthly values or drop the seed call
