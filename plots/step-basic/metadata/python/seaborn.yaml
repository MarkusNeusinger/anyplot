      Data: Two step series — green (#009E73) "Wireless Earbuds" and lavender (#C475FD) "Bluetooth Speakers" — both drawn as post-step lines with circular markers with light halos at each of the 13 weekly checkpoints. A very faint gray fill shades the area between the two curves. A "Restock" annotation with a thin leader line points at the week-4 jump in the green series.
