review:
  strengths:
  - 'Correct canonical Imprint palette: Wireless Earbuds in brand green #009E73, Bluetooth
    Speakers in lavender #C475FD, identical across both themes'
  - Theme tokens threaded correctly through sns.set_theme rc dict — both light and
    dark renders are fully readable, no dark-on-dark or light-on-light failures
  - drawstyle='steps-post' on sns.lineplot correctly implements step semantics per
    the spec's 'post' style guidance, with markers at every data point to highlight
    the discrete restock events
  - Restock annotation plus a contextual subtitle create genuine narrative framing
    without any fake-interactivity tricks (no AR-08 risk)
  - Low-alpha fill_between(step='post') between the two step curves is a tasteful
    touch that highlights the stock differential without competing with the data lines
  - Canvas gate passed (3200x1800), no edge clipping, no overlap between legend, annotation,
    and data
  weaknesses:
  - 'Title omits the mandated language token: renders as ''step-basic · seaborn ·
    anyplot.ai'' instead of the required ''step-basic · python · seaborn · anyplot.ai''
    (SC-04) — add '' · python'' between the spec-id and the library name in the fig.text
    title call'
  - 'Design Excellence is solid but not exceptional: the legend still uses a plain
    default-style frame rather than a more refined/minimal treatment, and the data-storytelling
    emphasis (annotation + subtitle) is good but stops short of a stronger focal point
    on the single largest jump (Wireless Earbuds week 7→8, +220 units)'
  image_description: |-
