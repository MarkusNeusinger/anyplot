review:
  strengths:
  - 'Genuine bokeh interactivity: HoverTool surfaces exact month/value pairs on the
    scatter markers, a real (not simulated) interactive feature in the HTML output.'
  - Target reference line (Span + text annotation) gives the chart a clear storytelling
    focal point, showing exactly when cumulative sales crossed the 150-unit milestone
    between months 9 and 10.
  - Markers use a page-background-colored halo (line_color=PAGE_BG, line_width=3)
    that cleanly separates each marker from the step line -- a nice polish detail.
  - 'Clean theme-adaptive chrome: identical brand-green (#009E73) data color and correctly
    flipped ink/background tokens in both renders, with no dark-on-dark or light-on-light
    legibility failures.'
  - min_border_* values correctly reserved so title, axis labels, and ticks are fully
    contained within the 3200x1800 canvas with no clipping.
  weaknesses:
  - 'Title omits the required {language} segment (SC-04): reads ''step-basic · bokeh
    · anyplot.ai'' instead of ''step-basic · python · bokeh · anyplot.ai''.'
  - Design Excellence is competent but stays close to Imprint defaults -- besides
    the target-line annotation, there is little additional art direction (e.g. no
    secondary annotation, no varied emphasis) to push DE-01/DE-02 further.
  - 'Library Mastery: uses Span + HoverTool but doesn''t reach for other bokeh-distinctive
    features (e.g. range tools, CustomJS, linked interactions) that would differentiate
    it further from a generic implementation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme page background -- not pure white.
      Chrome: Bold dark title "step-basic · bokeh · anyplot.ai" top-left, fully visible with no clipping. Italic axis labels "Month" (x) and "Cumulative Sales (units)" (y) in dark ink. Soft dark-gray tick labels on both axes. Subtle light vertical/horizontal gridlines (alpha 0.10). All chrome text is clearly legible against the light background.
      Data: Single step series (post/after mode) in brand green (#009E73), 4px line width, with 14px green markers outlined in the page-background color at each of the 12 monthly data points. A dashed soft-ink horizontal reference line marks "Target: 150 units", crossed between months 9 and 10.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme page background -- not pure black.
      Chrome: Bold off-white title, fully visible with no clipping. Italic light-ink axis labels, soft light-gray tick labels on both axes. Subtle light gridlines against the dark background. No dark-on-dark or light-on-light failures anywhere -- all chrome text reads cleanly.
      Data: Same brand-green (#009E73) step line, markers, and dashed target-line color/position as the light render -- confirms data colors are identical and only chrome (background, ink, grid) flipped between themes.
      Legibility verdict: PASS
