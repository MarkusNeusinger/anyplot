review:
  strengths:
  - Correct post-style step (direction="hv") matches the cumulative-sales semantics
    — value holds until the next month then jumps
  - 'Target reference line (geom_hline) + annotation gives the plot an immediate story:
    sales cross the 100k target in November'
  - 'Distinct colors for the step line (Imprint #009E73) vs. the change-point markers
    (#C475FD) plus a muted dashed target line create clear visual hierarchy without
    breaking palette rules'
  - Clean theme_minimal() base with subtle major-only gridlines (alpha=0.15) and only
    left/bottom axis lines — no clutter
  - Explicit font sizes for every text role (title 12pt, axis titles 10pt, axis text
    8pt, annotation) and both themes are fully readable
  - Fully deterministic, realistic monotonic cumulative-sales data with varied step
    sizes and flat plateaus
  weaknesses:
  - Data is monotonic non-decreasing throughout (only flat or up steps) — a small
    down-tick (e.g. an inventory-style correction) would demonstrate more of the step
    plot's range of behavior, though it is not required for this sales scenario
  - Layered composition (step + point + hline + annotate) is idiomatic ggplot2/plotnine
    grammar but not a feature that is difficult to replicate in another library —
    a more distinctive plotnine-only touch (e.g. faceting, a custom scale, or geom_step's
    direction parameter called out more deliberately) would raise Library Mastery
    further
  - Visual refinement is good but stops at a subtle grid tweak — no further polish
    such as a lighter/removed axis line or a secondary label near the target line's
    right edge to reinforce the story
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "step-basic · python · plotnine · anyplot.ai" centered at top; y-axis title "Cumulative Sales (thousands)" rotated on the left; x-axis title "Month" below; Jan-Dec tick labels along the bottom in dark gray; subtle horizontal gridlines at 25-unit intervals; only left and bottom axis lines drawn (no full box). Dashed gray horizontal line at y=100 with "Annual target: 100k" label in muted gray text near the top-left.
      Data: Green (#009E73) step line running post-style (horizontal-then-vertical) through 12 monthly points, with purple (#C475FD) circular markers at every data point marking the exact month-to-month values. Steps rise from 12k in January to 120k in December, crossing the 100k target line in November.
      Legibility verdict: PASS — all title, axis, and tick text is clearly dark-on-light and easily readable; annotation text has sufficient contrast against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light — title, axis titles, and tick labels all rendered in light off-white/gray tones; gridlines and dashed target line rendered in light gray, still subtle but visible against the dark background; annotation text in a slightly dimmer light-gray tone.
      Data: Step line and markers use the identical #009E73 green and #C475FD purple as the light render — confirmed unchanged across themes.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (title, axis labels, ticks, annotation) is light-colored and clearly legible against the near-black background.
