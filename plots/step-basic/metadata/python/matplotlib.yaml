review:
  strengths:
  - Correct, idiomatic use of ax.stairs (matplotlib >=3.4) for both the filled area
    and the outline, rather than the older ax.step
  - 'Milestone annotation adds a genuine data-storytelling focal point tied to the
    actual data (verified: cumulative sales first cross 500 in September)'
  - Theme-adaptive chrome is fully correct in both renders - identical data colors,
    properly flipped background/text/grid/legend/annotation colors, no dark-on-dark
    or light-on-light failures
  - Clean spec-compliant title/legend, correct canvas size, no clipping
  weaknesses:
  - Remove the unused np.random.seed(42) call - the sales data is a hardcoded array,
    not randomly generated, so the seed has no effect and reads as leftover boilerplate
  - Hollow 'Monthly Totals' markers filled with the page background color can look
    like cut-outs against the green fill area, especially in the dark render - consider
    a solid or semi-opaque fill for better prominence at small/thumbnail sizes
  - Milestone-annotation text is the same 8pt size as tick labels; consider verifying
    it stays legible when the card scales down for gallery thumbnails
  - Only one storytelling annotation; a secondary callout (e.g., largest single-month
    jump) could strengthen the narrative further, though not required by spec
