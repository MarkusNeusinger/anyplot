review:
  strengths:
  - Correct step interpolation ('hv'/post-style) with markers at every change point,
    matching the spec's notes
  - Theme-adaptive chrome is threaded correctly through every element (title, axes,
    ticks, grid, reference line) - both renders are clean and legible
  - The dotted year-total reference line + annotation is a nice storytelling touch
    that gives the chart a clear focal point beyond the raw step data
  - Clean KISS code with a reproducible seed and correct output API (write_image +
    write_html, correct filenames)
  weaknesses:
  - The 'Year total $375,467' annotation sits with almost no vertical gap above the
    December marker - in both renders the marker nearly touches the bottom of the
    '$' glyph. Increase the annotation's y-offset above the dashed line, or shift
    it left so it no longer crowds the endpoint marker.
  - Library Mastery is generic - the plotly-specific touches used (add_hline, add_annotation,
    hovertemplate) are common patterns; more distinctive use of the library (e.g.
    a subtle area fill under the step, or emphasis on the first/last points) would
    raise both Design Excellence and Library Mastery.
