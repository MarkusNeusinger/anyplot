      Chrome: Title "step-basic · python · plotly · anyplot.ai" centered in dark ink; axis titles "Cumulative Sales ($)" and "Month" dark and clearly visible; tick labels softer dark gray; horizontal (y-axis only) grid subtle; dotted gray reference line + "Year total $375,467" annotation near top-right.
