      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Central Bank Policy Rate · step-basic · r · ggplot2 · anyplot.ai" renders fully in dark ink, not clipped. Y-axis tick labels (4.5%-5.5%) and rotated (~30°) X-axis date labels (Feb 2023 ... Nov 2024) render in soft dark grey, clearly legible. "Meeting Date" / "Policy Rate" axis titles in darker ink. Subtle horizontal-only grid lines at ~15% opacity. NOTE: the "Cycle peak: 5.50%" text annotation that the source code adds via annotate() at the Nov 2023 peak is NOT visible anywhere in the image — it is clipped outside the panel's expanded y-range.
      Data: Single brand-green (#009E73) step line in "hv" (post) style, with circular markers (size increased to 3.8 in this attempt) placed only at the 8 points where the policy rate actually changed.
      Legibility verdict: PASS (all rendered chrome and data are readable; the missing annotation is a rendering bug, not a legibility failure, since the element simply never appears)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now in light/off-white ink, fully visible. Tick labels and axis titles render in light grey, clearly legible against the dark surface — no dark-on-dark failures. Grid lines remain subtle and horizontal-only. Same as light render, the "Cycle peak: 5.50%" annotation is completely absent — confirmed via the same y-position math (5.68 vs. panel limit 5.66), so this is a rendering bug consistent across both themes, not a theme-specific legibility issue.
      Data: Step line and change-markers use the identical #009E73 green as the light render — only chrome (background, text, grid) flipped, confirming data-color consistency.
      Legibility verdict: PASS (no dark-on-dark issues; all rendered elements readable; missing annotation is a clipping bug affecting both themes equally)
