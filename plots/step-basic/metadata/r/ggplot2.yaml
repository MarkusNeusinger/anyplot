review:
  strengths:
  - Correct geom_step usage with direction="hv" and markers placed precisely at rate-change
    points only (not every month), giving the reader a clear visual cue for when the
    policy actually moved
  - 'Theme-adaptive chrome (INK/INK_SOFT/PAGE_BG) is threaded consistently through
    title, axes, grid and background; both light and dark renders are fully legible
    with identical #009E73 data color'
  - Title format, single-series legend omission, and y-axis grid-only styling match
    spec and style-guide requirements exactly
  weaknesses:
  - Styling stays close to theme_minimal defaults with only grid/axis-line tweaks
    - a stronger design touch (e.g. an annotate() callout on the largest rate move)
    would lift perceived sophistication
  - Change markers (size=2.8) are modest for a sparse 24-point series with only 8
    visible change points - bump to ~3.5-4 for more prominence per the data-density
    heuristic
  - Y-axis label "Policy Rate" could spell out the unit (e.g. "Policy Rate (%)") for
    extra clarity, though the percent-suffixed tick labels already make it unambiguous
