review:
  strengths:
  - Acceptance probabilities come from the binomial CDF computed in the data block
    (P(X ≤ c) for X ~ Binomial(n, p)); the labelled values α = 26.4 % at AQL 2 % and
    β = 3.4 % at LTPD 10 % for n = 50, c = 1 match an independent binomial calculation
    exactly
  - Three plans (n = 50/c = 1, n = 100/c = 2, n = 200/c = 4) in Imprint order show
    clearly how a larger sample steepens the curve and tightens discrimination
  - Producer's risk is drawn as the gap between certain acceptance and the curve at
    AQL, consumer's risk as the curve's height at LTPD, both as plan-colored bars
    with a labelled point, exactly as the spec's characteristic section describes
  - Native ChartsReferenceLine for AQL/LTPD and a custom SVG layer composed inside
    LineChart via useXScale/useYScale keep the risk marks on the chart's own scales
  - 'curve: monotoneX keeps the smooth lines from overshooting the computed probabilities;
    x axis limited to 0–15 % so the falling part fills the plot'
  - 'Theme tokens threaded through every text element: both renders fully legible,
    data colors identical across themes'
  - A subtitle states which plan carries the risk marks and why (the weakest consumer
    protection), giving the reader a clear focal plan
  weaknesses:
  - 'Suggestion: the producer''s-risk bar at AQL is drawn on top of the dashed AQL
    reference line from 74 % to 100 %, so the dashed line disappears there; a small
    horizontal offset or a translucent bar would keep both visible.'
  - 'Suggestion: a thin, subtle horizontal grid at 20 % steps could make the acceptance
    probabilities of the other two plans easier to read off at AQL and LTPD.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: centered bold title "Incoming Inspection · curve-oc · javascript · muix · anyplot.ai" (~40 % width), a soft-ink subtitle naming the risk plan, a horizontal legend at the top (n = 50, c = 1 / n = 100, c = 2 / n = 200, c = 4), y axis "Probability of acceptance (%)" 0–100, x axis "Fraction defective (%)" 0–15, no grid, dark text throughout — all readable.
      Data: three smooth S-shaped OC curves in #009E73 (n = 50), #C475FD lavender (n = 100), #4467A3 blue (n = 200), all starting at 100 % and falling monotonically; dashed soft-ink reference lines at AQL 2 % and LTPD 10 % with bold labels at the top; a thick green bar from 100 % down to the n = 50 curve at AQL with a dot and "Producer's risk α = 26.4 %", and a short green bar from 0 to 3.4 % at LTPD with "Consumer's risk β = 3.4 %".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
