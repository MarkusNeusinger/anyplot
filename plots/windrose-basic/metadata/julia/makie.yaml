review:
  strengths:
  - 'Layout imbalance from attempt 1 is fully resolved: the radial grid no longer
    pads a spare ring past the data extent (n_rings = ceil(r_max_data / ring_step),
    no ''+1''), and pixel-measured content is now centered within 3px of true canvas
    center horizontally (1197 vs 1200) versus the ~109px offset previously flagged'
  - 'The ''5%'' radial tick label no longer sits on top of the NE wedge fill — it
    is now placed at the sector-boundary gap with the least combined frequency (argmin
    over adjacent-pair totals), verified by cropping the region: the label sits cleanly
    on background between two small wedges'
  - Title size was increased from 20 to 27 as specifically requested, growing from
    ~32% to ~43% of canvas width — better proportioned for the 2400x2400 canvas without
    overflowing
  - 'Correct polar stacked wind rose with proper north-up meteorological convention
    and realistic SW-prevailing wind climatology (verified: identical binning/stacking
    logic to the approved attempt 1 data)'
  - 'Theme-adaptive chrome verified pixel-exact: background is exactly #FAF8F1 (light)
    / #1A1A17 (dark), and all four data colors are pixel-identical between renders
    (e.g. purple hub sample (196,117,253) matches in both) — only chrome flips'
  - 'First categorical series (0-5 m/s) uses Imprint brand green #009E73; no edge
    clipping — legend, title, and direction labels all measured within canvas bounds
    with healthy margins'
  - Canvas is exactly 2400x2400 (square target, passes the canvas-dimension gate)
  - Clean, correctly labeled legend ('Wind Speed' with matching speed-range labels)
    placed in the sparse NE quadrant, using empty space productively rather than floating
    isolated
  weaknesses:
  - Script still defines three small helper functions (compass_to_screen, wedge_points,
    speed_bin_of) instead of a flat Imports -> Data -> Plot -> Save structure; largely
    unavoidable since CairoMakie has no native wind-rose recipe, but still a KISS
    deviation worth noting
  - Title at ~43% of canvas width is legible and well-set (titlesize=27, explicit),
    but still sits below the ~50-70% band that reads as fully 'comfortable' for a
    title of this length on a square canvas — a further nudge to ~30-32pt would tighten
    the proportion without risking overflow
  - Color assignment to speed bins follows the canonical Imprint palette order (green,
    purple, blue, ochre) rather than a deliberate cool-to-warm progression the spec
    calls out as traditional; compliant and CVD-safe, but not a distinctive design
    choice beyond the required palette order
