review:
  strengths:
  - Correct polar stacked wind rose with proper north-up meteorological convention,
    verified by checking the compass-to-screen angle mapping against the rendered
    label positions
  - 'Data is realistic: a prevailing SW wind (40% weight, Gaussian around 225°) blended
    with a uniform background (60%) — pixel-level measurement of each sector''s wedge
    radius confirms all 8 directions carry frequencies matching the expected statistical
    distribution (e.g. SW ~23%, S/W ~17%, SE/NW ~10%, N/E ~7%, NE ~7%), so the binning
    and stacking logic is correct'
  - 'Theme-adaptive chrome is implemented correctly: measured background hex values
    are exactly #FAF8F1 (light) and #1A1A17 (dark), and the four data colors are pixel-identical
    between renders — only chrome flips'
  - 'First categorical series (0-5 m/s) uses Imprint brand green #009E73 as required'
  - No edge clipping — programmatically verified zero non-background pixels touch
    any of the four canvas borders in either render
  - Canvas is exactly 2400×2400 (square target, passes the canvas-dimension gate)
  - Clean, correctly-labeled legend ("Wind Speed" with matching speed-range labels
    and swatches)
  - Uses the current Makie API (`Figure(size = ...)`) rather than the deprecated `resolution
    =` kwarg
  - Custom polar geometry (wedge_points, compass_to_screen) is a legitimate, well-executed
    use of raw Makie primitives (poly!, lines!, text!) since CairoMakie has no native
    wind-rose recipe
  weaknesses:
  - 'Significant unused canvas space: the radial grid autoscales rings out to 30%
    (n_rings = ceil(r_max_data/ring_step) + 1) while most sectors (N, NE, E, SE, NW)
    only reach 7-10%, so the NE/E/SE quadrant of the circle is almost entirely empty
    faint grid with no data. Combined with the axis being drawn off-center within
    its column (measured hub center ~px(1091,1236) vs. true canvas center px(1200,1200)),
    the whole chart reads visually unbalanced — all the colorful content is crowded
    into the bottom-left while the right two-thirds of the canvas is dead space. Fix:
    drop the extra `+ 1` padding ring (or cap r_axis_max closer to r_max_data), and
    rebalance colsize!/Legend placement so the polar chart is centered and fills more
    of the square canvas.'
  - The radial '%' tick labels are placed at angle 1.5*sector_width, i.e. directly
    in the narrow 4° gap between the NE and E sectors. At small radii (the '5%' label)
    this gap is very thin and the label sits partly over the NE wedge's purple fill,
    reducing contrast. Move the tick labels to the sector boundary with the least
    data (e.g. compute the gap bracketing the two smallest total-frequency sectors)
    or push them further outward past all wedge extents.
  - Title is only ~32% of the canvas width on the very large 2400×2400 canvas — reads
    a little small/underweight relative to the available space. Increase titlesize
    modestly (e.g. from 20 to ~26-28) for better proportion at this canvas size.
  - Script defines four small helper functions (compass_to_screen, wedge_points, circle_points,
    speed_bin_of) rather than a flat Imports → Data → Plot → Save structure. This
    is understandable since Makie has no native wind-rose/polar-stacked-bar recipe,
    but it's still a deviation from the KISS single-script convention worth minimizing
    where possible.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 exactly (pixel-verified).
      Chrome: Dark title "windrose-basic · julia · makie · anyplot.ai" at top, clearly legible; 8 dark compass-direction labels (N, NE, E, SE, S, SW, W, NW) around the outer ring, all legible; lighter gray-brown "%" radial tick labels (5%, 10%, ... 30%) mostly on clear background, though the "5%" label sits partly over the NE wedge's purple fill (minor contrast reduction, not illegible); subtle 15%-alpha grid rings/spokes.
      Data: Stacked polar wedges — one per compass direction, segments colored green (#009E73, 0-5 m/s) → purple (#C475FD, 5-10 m/s) → blue (#4467A3, 10-15 m/s) → gold (#BD8233, 15+ m/s), with thin PAGE_BG strokes separating segments. A clear dominant SW/S/W wind pattern is visible (largest wedges, gold-tipped), with smaller wedges toward N/NE/E/SE/NW. The right (NE-E-SE) portion of the circular grid is mostly empty, and the whole polar plot sits left-of-center within the canvas.
      Legibility verdict: PASS (all text readable; the "5%" label overlap is a minor legibility deduction, not a failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 exactly (pixel-verified).
      Chrome: Same title and labels rendered in light ink (#F0EFE8 title/direction labels, #B8B7B0 for tick labels) — all clearly legible against the dark background, no dark-on-dark failures observed.
      Data: Identical wedge geometry and colors to the light render — pixel comparison confirms the four data colors (green/purple/blue/gold) are unchanged between themes; only the chrome (background, ink, grid) flipped as required.
      Legibility verdict: PASS (no dark-on-dark text; all chrome elements readable).

    Both renders share the same layout imbalance (dead space in the NE/E/SE quadrant, off-center axis) since that is a geometry issue independent of theme.
