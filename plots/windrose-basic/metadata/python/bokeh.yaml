review:
  strengths:
  - Switched from manual polygon math to bokeh's native annular_wedge() glyph — directly
    addresses the previous review's LM-01/LM-02 feedback and produces cleaner, genuinely
    idiomatic bokeh code
  - Title now includes the python language token, matching the required '{spec-id}
    · {language} · {library} · anyplot.ai' format
  - Grid line alpha reduced to 0.15-0.2 on circles/spokes, now within the style guide's
    15-25% subtle-grid band (was 0.3-0.4)
  - Added a deliberate dominant-direction accent ring (p.arc around the W sector)
    — a genuine data-storytelling emphasis technique beyond the size variation that
    naturally falls out of the data
  - 'Both renders are fully theme-correct: no dark-on-dark or light-on-light failures
    anywhere, and the five speed-bin colors are pixel-identical across themes'
  - Realistic, neutral coastal wind-station dataset (n=5000, Weibull-distributed speeds,
    directional weighting favoring SW/W/NW) with clear directional and speed variation
  - Clean KISS structure, seeded RNG (np.random.seed(42)), correct plot-{theme}.png/.html
    output naming via the Selenium screenshot pattern
  weaknesses:
  - The '5%' radial tick label sits directly against/overlaps the ochre (9-12 m/s)
    band of the small NE-direction wedge in both light and dark renders — increase
    the label offset (e.g. x=[radius+1.2] instead of radius+0.5) or skip a tick label
    whose radius falls inside a wedge's angular+radial footprint for that direction
  - Legend box's right border sits very close to the canvas edge (~9px margin on a
    2400px canvas) — not clipped, but tighter than ideal; add a touch more right margin
    or trim legend padding
  - Design Excellence is strong but not yet publication-grade — the new dominant-sector
    highlight ring is a good addition but subtle; a slightly bolder treatment (thicker
    ring, or a small value callout on the dominant sector) would push the storytelling
    further
