review:
  strengths:
  - 'Correct Imprint palette in canonical order with brand green #009E73 for the calmest
    bin and matte red reserved for the >12 m/s extreme bin — a defensible semantic
    use, not just ordinal luck'
  - 'Both renders are fully theme-correct: #FAF8F1/#1A1A17 backgrounds, no dark-on-dark
    or light-on-light failures anywhere (title, compass labels, tick %, legend, subtitle
    all readable)'
  - Clean, boxed legend directly adjacent to the wheel with color swatches matching
    the wedge colors exactly
  - 'Realistic, neutral coastal wind-station data: direction weights favor SW/W/NW,
    Weibull-distributed speeds, n=5000 observations — shows clear feature variation
    across sectors'
  - No edge clipping and no text/data overlap in either render; radial % labels sit
    cleanly in empty grid space
  - KISS script structure, np.random.seed(42), clean imports, correct plot-{theme}.png/html
    output naming
  weaknesses:
  - Title omits the mandated {language} token — currently "windrose-basic · bokeh
    · anyplot.ai", should be "windrose-basic · python · bokeh · anyplot.ai" per the
    SC-04 title format.
  - Wedges are built by manually computing ~30-point polygons via trigonometry and
    drawing them with p.patches(), instead of using bokeh's purpose-built p.annular_wedge()
    glyph (inner_radius/outer_radius/start_angle/end_angle) — the single most idiomatic
    and distinctive bokeh tool for exactly this stacked-radial chart type. Switching
    to annular_wedge would simplify the code and demonstrate real library mastery.
  - Grid line alpha (0.3-0.4 on circles/spokes) runs above the style guide's recommended
    15-25% subtle-grid band — still readable but slightly heavier than ideal.
  - 'Design Excellence is solid but not exceptional: no deliberate emphasis technique
    (e.g. subtly higher opacity or a thin highlight ring on the dominant SW/W sector)
    beyond the size difference that naturally falls out of the data — would strengthen
    the storytelling focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "windrose-basic · bokeh · anyplot.ai" centered at top, clearly readable; bold dark compass labels (N, NE, E, SE, S, SW, W, NW) around the wheel; muted dark-gray radial "5%/10%/15%/20%/25%" tick labels sitting cleanly in empty grid space along the E axis with no overlap; subtle gray concentric circles and direction spokes beneath the data; muted-gray "Wind Speed (m/s)" subtitle below the wheel; boxed legend at right with cream fill, thin border, and dark-gray label text.
      Data: Stacked radial wedges per direction, colored bottom-to-top in Imprint canonical order (#009E73 green for 0-3 m/s, lavender #C475FD for 3-6, blue #4467A3 for 6-9, ochre #BD8233 for 9-12, matte red #AE3030 for >12 m/s), each segment separated by a thin background-colored gap. SW/W/NW sectors dominate in both frequency and top speed bin, N/NE/E/SE are visibly smaller — clear directional pattern.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, compass labels rendered in light/cream text, clearly legible against the dark background; radial % tick labels in light gray, still legible and non-overlapping; subtle light-gray grid circles/spokes; legend box uses the dark elevated fill (#242420-ish) with light-gray text and border — fully readable; no dark-on-dark text anywhere.
      Data: Identical wedge colors to the light render (green/lavender/blue/ochre/red in the same canonical order and positions) — only the chrome (background, text, grid, legend box) flipped, confirming data-color consistency.
      Legibility verdict: PASS
