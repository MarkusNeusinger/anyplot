review:
  strengths:
  - 'Correct wind rose construction: 8 direction sectors, 5 stacked wind-speed-bin
    colors, North at top matching meteorological convention (verified via the angle
    mapping: N=90°/top, E=0°/right, S=-90°/bottom, W=180°/left)'
  - 'Imprint palette used in correct canonical order (#009E73, #C475FD, #4467A3, #BD8233,
    #AE3030) with the brand green as the first (calmest) series, identical across
    both themes'
  - Theme-adaptive chrome correctly implemented — background, title, compass labels,
    grid, and legend all flip appropriately between light and dark with no dark-on-dark
    or light-on-light failures
  - 'Sophisticated layered composition for a chart type altair has no native primitive
    for: grid circles, radial spokes, stacked wedges, compass labels, percentage labels,
    and a rotated axis title all correctly layered and ordered'
  - 'Realistic, neutral data: Weibull-distributed wind speeds with a plausible prevailing
    SW/W directional bias, matching the spec''s ''hourly wind measurements over one
    year'' example'
  - Canvas lands exactly on the 2400×2400 square target with no clipped text at any
    edge
  weaknesses:
  - The rotated 'Frequency (%)' radial axis title directly overlaps the '20%' and
    '15%' percentage gridline labels in both renders — the '(%)' characters render
    on top of the '20%' digits. Both pct_label_data and axis_title_data are placed
    along the same 115° angle (pct labels at each circle_radii, axis title at max_freq*0.7),
    which puts them on a collision course. Move the axis title to a different angle
    (e.g. 100° or 130°, away from the percentage label column) or push it further
    out beyond the outermost label.
  - Title is 'windrose-basic · altair · anyplot.ai', missing the required language
    segment — should be 'windrose-basic · python · altair · anyplot.ai' per the mandated
    {spec-id} · {language} · {library} · anyplot.ai format.
  - Wedge/label geometry is built with a Python for-loop over df.iterrows() (wedge_data,
    circle_points) rather than vectorized numpy — works correctly but is not the most
    idiomatic/altair-native approach and is slower than necessary for this data size.
  - The three smallest sectors (E, NE, SE) are quite thin at this direction-weight
    distribution, making their individual speed-bin bands hard to distinguish at a
    glance — acceptable given the realistic data skew, but worth noting.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold black title "windrose-basic · altair · anyplot.ai" at top, clearly readable. Compass direction labels (N, NE, E, SE, S, SW, W, NW) in bold black around the polar grid, all readable. Radial percentage gridlines (5%, 10%, 15%, 20%, 25%) in dark gray, readable. Rotated "Frequency (%)" axis title in black — readable on its own, but its "(%)" characters directly overlap the "20%" gridline label where their paths cross (see weaknesses). Legend "Wind Speed" box top-right with black title and gray labels, all readable, box fill is the elevated cream tone with a soft border.
      Data: Stacked polar wedges radiating from center, one per direction sector, colored by wind-speed bin. First (innermost, calmest 0-3 m/s) band is Imprint brand green #009E73, followed by lavender, blue, ochre, and matte red for increasing speed bins — all wedges separated by thin cream-colored strokes. SW and W sectors are visibly the longest/dominant, NE/E/SE the shortest, consistent with the prevailing-wind data generation.
      Legibility verdict: PASS (one minor localized text-on-text overlap between axis title and percentage labels, not a legibility blocker elsewhere)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, compass labels, and axis title now rendered in light off-white/cream, clearly readable against the dark background. Percentage gridlines in light gray, legend box now uses the dark elevated fill with light text — all legible, no dark-on-dark failures anywhere. The same "Frequency (%)" / "20%" overlap reproduces identically here (expected, since it's a fixed-geometry issue, not a theme issue).
      Data: Data colors are pixel-identical to the light render — brand green, lavender, blue, ochre, matte red in the same canonical order and same wedge shapes/sizes. Only the chrome (background, text, grid, legend frame, wedge separator stroke color) flipped to the dark-theme tokens.
      Legibility verdict: PASS (same localized overlap as light render; no dark-on-dark text)
