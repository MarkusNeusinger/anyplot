review:
  strengths:
  - 'Correct wind-rose chart type: 8-sector polar stacked histogram with a realistic
    prevailing-SW wind pattern (secondary NE lobe) and Weibull-distributed speeds
    per direction'
  - Imprint categorical palette applied in exact canonical order across all 5 speed
    bins, identical hues in light and dark renders, with fully theme-correct chrome
    (background, ticks, legend, grid) in both themes
  - 'Genuine data storytelling: alpha emphasis (0.90 vs 0.65) highlights the dominant
    >75th-percentile sectors, and the seaborn kdeplot inset adds real distributional
    context beyond the rose itself — an idiomatic, distinctive seaborn feature'
  - 'Clean, reproducible, KISS-structured code: seed set, only used imports, correct
    f''plot-{THEME}.png'' save API, no bbox_inches=''tight'', exact mandated title
    string'
  - Exact 2400x2400 canvas with no edge clipping on N/S/W/E labels or the outer circle
  weaknesses:
  - 'The NW compass label is completely hidden behind the opaque ''Speed distribution''
    KDE inset panel (fig.add_axes at (0.05, 0.72, 0.24, 0.20) with an opaque PAGE_BG
    facecolor, added after the polar axes so it draws on top and occludes whatever
    tick label sits underneath). The SE compass label is likewise crowded out / hidden
    by the radial % tick labels (rlabel_position=112.5deg, which sits almost exactly
    at the SE bearing) and the adjacent ''Wind Speed'' legend box occupying the same
    lower-right corner. Confirmed by pixel-cropping both corners: neither ''NW'' nor
    ''SE'' text is visible in either theme, even though N/NE/E/S/SW/W all render cleanly.
    2 of the 8 required compass directions are effectively erased — the code''s comments
    assume these corners are ''empty'' but they still carry the fixed compass-label
    ring around the full circle. Reposition the inset/legend/rlabel spoke (e.g. shrink
    further into the true corner past the label radius, or explicitly check clearance
    against the tick-label ring, not just the data wedges) so no compass label is
    ever covered.'
  - The KDE inset's own tick/label text (fontsize 6-7pt) is noticeably smaller than
    the rest of the chart's typography and risks becoming illegible at ~400px mobile
    width — bump to ~8-9pt or simplify the tick count.
  - No explicit radial-axis title (e.g. 'Frequency (%)') — the '%' suffix on the tick
    labels implies it, but an explicit label would remove any ambiguity about what
    the radius encodes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec, not pure white.
      Chrome: Title "windrose-basic · python · seaborn · anyplot.ai" in dark ink at top-left of the polar area, compact and fully readable. Compass labels N (top), NE (upper-right), E (right), S (bottom), SW (lower-left), W (left) all render clearly in dark ink against the cream background. Radial percentage ticks (5%-35%) legible in soft grey. Legend "Wind Speed" box (cream fill, dark border) bottom-right, all 5 entries readable.
      Data: Stacked polar bars — brand green (0-3 m/s) innermost, then lavender (3-6), blue (6-10), ochre (10-15), matte red (15+ m/s, outermost) — matching Imprint canonical order with #009E73 first. Dominant SW-S sector reaches ~30-35%, secondary N-NE sector reaches ~12-15%, other sectors near-empty. KDE inset (top-left) shows a right-skewed green density curve for overall wind speed.
      Legibility verdict: FAIL — pixel-cropping the top-left and lower-right corners confirms the "NW" compass label is completely hidden underneath the opaque KDE inset panel, and the "SE" compass label is hidden/crowded out by the radial tick-label cascade and the adjacent legend box. All other text is readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec, not pure black.
      Chrome: Title and all visible compass labels (N, NE, E, S, SW, W) render in light ink (#F0EFE8), clearly legible against the dark background — no dark-on-dark failures observed. Radial ticks and legend box use theme-adaptive dark-elevated fill (#242420) with light text, fully readable. Grid lines subtle and visible.
      Data: Identical hues to the light render — brand green, lavender, blue, ochre, matte red in the same canonical order and same stacking — confirms only chrome flipped between themes, not data colors.
      Legibility verdict: FAIL — same NW/SE compass-label occlusion issue as the light render (KDE inset panel and legend/radial-label cluster cover the same angular positions in both themes, since geometry is theme-independent). All other chrome is theme-correct and legible.
