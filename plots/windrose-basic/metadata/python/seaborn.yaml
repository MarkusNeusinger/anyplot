review:
  strengths:
  - Sectors centered on their compass points (wind_dir + sector_width/2), so every
    spoke sits under its N/NE/... label
  - pd.cut + pd.crosstab(normalize=True) compute the speed/direction frequency table
    in two calls
  - Ring step derived from the data (1/2/5 x 10^n), giving clean 5 % rings from zero
  - Ring labels at 112.5 degrees in the empty quadrant, clear of every spoke
  - Theme tokens threaded through sns.set_theme rc, legend and ticks; both renders
    fully readable
  - Correct 2400x2400 canvas with explicit figsize x dpi and no bbox_inches='tight'
  weaknesses:
  - 'VQ-07, SC-02 (both): the five ordered speed bins use the categorical Imprint
    hues (green, purple, blue, ochre, red) that neither form one ramp nor run cool
    to warm, so the bin order is hidden → discrete steps of one Imprint ramp (imprint_seq)
    in bin order, calm to strong. Likely cause: colors = IMPRINT_PALETTE[: len(speed_order)].'
  - 'VQ-02 (both): the ''45%'' ring label sits exactly on the outer polar spine, which
    runs through its glyphs → keep the outermost ring label off the spine (e.g. limit
    the ring labels to rings inside the rim or set ylim one step above the top ring).
    Likely cause: max_freq equals the top tick, so the last yticklabel is drawn on
    the spine.'
  - 'CQ-01 (code): the missing_number smoke perturbation fails with ValueError: ''vertices''
    must be 2D ... shape (0,) at line 141 → a NaN frequency must leave its segment
    out instead of breaking the draw. Likely cause: NaN handling below the Data block
    — table.fillna(0) fills a drawn value with zero (against prompts/adaptable-code.md)
    while the stacking and the ring computation are not NaN-safe.'
  - 'Suggestion: a light radial axis note such as ''Frequency (%)'' near the ring
    labels would name the radial quantity explicitly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, polar spine in INK_SOFT
