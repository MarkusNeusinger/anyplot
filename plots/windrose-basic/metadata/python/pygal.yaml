review:
  strengths:
  - Custom pygal Style fully themed (background, foreground, foreground_subtle, colors)
    and font sizes explicitly set for both light and dark renders, with correct theme-adaptive
    chrome in both PNGs
  - 'First categorical series is #009E73 and the remaining three speed bins use Imprint
    palette members in canonical order, with identical data colors between light and
    dark renders'
  - Stacked cumulative construction (frequencies -> cumulative dict) correctly produces
    proper nested-area stacking for 4 speed bins across 8 direction sectors
  - Realistic, neutral meteorological scenario (8760 hourly observations, prevailing
    SW/W wind with an exponential speed decay per cluster) with np.random.seed(42)
    for reproducibility
  - Title format exactly matches the mandated `windrose-basic · python · pygal · anyplot.ai`
    convention and legend labels are descriptive with units (e.g. "5-10 m/s")
  weaknesses:
  - 'Compass directions are mirrored/reversed: pygal''s Radar plots category index
    0 at the top and proceeds COUNTER-clockwise (verified by rendering the SVG and
    reading text-anchor coordinates), but x_labels = [''N'',''NE'',''E'',''SE'',''S'',''SW'',''W'',''NW'']
    assumes clockwise placement. The result is a left-right-mirrored compass: NW renders
    in the true-NE position, SW renders in the true-SE position, W renders in the
    true-E position (and vice versa). This breaks the spec''s explicit ''North should
    be at the top ... following meteorological convention'' requirement, which implies
    standard clockwise N-NE-E-SE-S-SW-W-NW layout. Fix: reorder both the direction-sector
    loop and x_labels to [''N'',''NW'',''W'',''SW'',''S'',''SE'',''E'',''NE''] (i.e.
    keep N first, then walk the remaining sectors counter-clockwise in degrees: 315,
    270, 225, 180, 135, 90, 45) so the label at each spoke position matches true compass
    bearing. Verified fix by rendering a test chart with this label order and confirming
    NE lands top-right, SW lands bottom-left, etc.'
  - Speed-bin color assignment doesn't follow the spec's own guidance that 'colors
    traditionally progress from cool (calm) to warm (strong) for speed bins' — here
    the calmest bin (0-5 m/s) is amber/brown and the strongest bin (15+ m/s) is green,
    which isn't a cool-to-warm progression. Consider reassigning Imprint palette members
    so calm reads cooler (e.g. blue) and strong reads warmer (e.g. red/amber) while
    keeping the first-series-green rule for the highest-frequency series if that's
    prioritized.
  - Direction sectors other than SW/W/S carry almost no visible area (NE, E, SE, N
    collapse near the center), so the chart doesn't clearly demonstrate stacking/speed-bin
    contrast for most of the compass — feature coverage leans on a single dominant
    cluster.
  - pygal has no native stacked polar-bar/wedge chart, so Radar's smooth line-interpolated
    polygon reads more like a star chart than the 'polar stacked histogram' described
    in the spec, where discrete direction sectors should be visually separated wedges
    rather than interpolated between spokes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "windrose-basic · python · pygal · anyplot.ai" is fully visible at top in dark ink, spans ~70% of canvas width. Compass labels (N, NE, E, SE, S, SW, W, NW) surround the polar grid, radial tick labels (8, 16, 24, 32) run up the N spoke, y_title "Frequency (%)" is rotated on the left edge, legend with 4 swatches (15+ m/s green, 10-15 m/s purple, 5-10 m/s blue, 0-5 m/s amber) sits top-left. All chrome text is dark-on-light and clearly legible.
      Data: Four nested/stacked polygons (amber innermost, blue, purple, green outermost) bulge heavily toward the bottom-right quadrant of the chart (the spokes labeled SW and W), tapering to nearly nothing at the labels N/NE/E/SE/NW. First (innermost, dominant-frequency) series color is #009E73 green matching Imprint rule.
      Legibility verdict: PASS — all text is readable, no overlap, no clipping. NOTE: the compass geometry itself is mislabeled/mirrored (see Weaknesses) — this is a data-mapping defect, not a text-legibility defect.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same layout as light render; title, compass labels, tick labels, y_title, and legend text are all rendered in light ink (#F0EFE8/#A8A79F) and clearly readable against the dark background. No dark-on-dark failures observed anywhere (title, ticks, legend, spoke labels all confirmed legible).
      Data: Identical four-color stacked polygons in the identical bottom-right-skewed shape, same hex values as the light render (#009E73 green outermost/highest series, purple, blue, amber innermost) — data colors are unchanged between themes, confirming only chrome flipped as required.
      Legibility verdict: PASS — all text is readable in the dark theme, no dark-on-dark failures.
