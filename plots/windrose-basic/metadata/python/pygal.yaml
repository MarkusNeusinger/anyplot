      Data: Four nested/stacked polygons (green outermost/15+ m/s, lavender/10-15 m/s, blue/5-10 m/s, ochre innermost/0-5 m/s) bulge heavily toward the SW/W/S spokes, tapering to near-nothing at N/NE/E/SE. First (drawn-first, highest-speed) series is #009E73 green per the Imprint brand rule.
      Legibility verdict: PASS — all text readable, no overlap, no clipping at the canvas border.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB(26,26,23) = #1A1A17 exactly, not pure black.
      Chrome: Identical layout to the light render; title, compass labels, tick labels, y_title, and legend text all render in light ink (#F0EFE8 / #A8A79F) and are clearly legible against the dark background. No dark-on-dark failures found on any element (title, compass labels, tick labels, legend all confirmed legible).
      Data: Same four-color stacked polygons in the identical SW/W/S-skewed shape; swatch color-sampled and confirmed unchanged from the light render (only chrome — background, text, grid tone — flips between themes, as required).
      Legibility verdict: PASS — all text readable in the dark theme, no dark-on-dark failures.
