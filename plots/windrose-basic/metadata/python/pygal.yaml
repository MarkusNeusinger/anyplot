review:
  strengths:
  - 'Compass direction fix confirmed correct: N is at top, and going clockwise the
    labels read N, NE, E, SE, S, SW, W, NW exactly matching true meteorological bearing
    (verified visually) — this resolves the attempt-1 mirrored-compass defect completely'
  - 'Custom pygal Style is fully themed for both renders with explicit font sizes
    (title 66, label 56, major_label 44, legend 44); pixel-sampled backgrounds match
    the spec exactly (#FAF8F1 light, #1A1A17 dark) with no theme-adaptation failures
    in either render'
  - First categorical series renders in Imprint brand green (#009E73) and the remaining
    three speed bins use the next three Imprint palette members in canonical order,
    with identical data hues between light and dark renders
  - Correct stacked-cumulative construction (frequencies -> cumulative dict, added
    strongest-to-calmest) produces proper nested-area stacking across 8 direction
    sectors and 4 speed bins with no rendering artifacts
  - Realistic, neutral meteorological dataset (8760 simulated hourly observations,
    prevailing SW/W wind with per-cluster exponential speed decay, np.random.seed(42));
    title format and legend labels match the mandated convention exactly
  weaknesses:
  - 'Speed-bin color assignment still doesn''t follow the spec''s own note that ''colors
    traditionally progress from cool (calm) to warm (strong)'' — the calmest bin (0-5
    m/s) renders in warm ochre/brown while the strongest bin (15+ m/s) renders in
    green. This is optional guidance (not a hard requirement, and the mandatory ''first
    series = #009E73'' rule constrains the choice), so no score deduction was applied,
    but consider reassigning palette members so calm reads cooler and strong reads
    warmer if that hierarchy matters more than which bin gets the brand color.'
  - Direction sectors N, NE, E, and SE still collapse to almost no visible area in
    both renders — only SW, W, and S show a meaningful stacked shape, so the full
    8-sector x 4-speed-bin grid the spec describes isn't well demonstrated across
    the compass.
  - pygal's Radar chart still interpolates a smooth straight-line polygon between
    the 8 direction points rather than rendering discrete pie-like wedge sectors,
    so the result reads more like a star/radar chart than the 'polar stacked histogram'
    the spec describes. This is a pygal API limitation (no native windrose/stacked-polar-bar
    chart) rather than a coding mistake, and Radar remains the closest available substitute.
