review:
  strengths:
  - 'Correct wind rose construction: polar stacked bar chart with North at top and
    clockwise compass orientation (N, NE, E, SE, S, SW, W, NW), matching meteorological
    convention.'
  - 'Speed bins use the canonical Imprint palette in the documented positional order
    (#009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD) and the colors are pixel-identical
    between the light and dark renders.'
  - 'Clear visual hierarchy / data storytelling: the dominant W/NW wind sectors are
    immediately obvious against the smaller sectors, giving the chart a clear focal
    point.'
  - Canvas target hit exactly (ggsize(600, 600) + scale=4 -> 2400x2400 square) with
    no clipped text or elements.
  - Legend clearly labeled 'Wind Speed' with unit-bearing range labels (e.g. '0-3
    m/s'), placed outside the plot area with no overlap.
  - Reproducible via np.random.seed(42); realistic Weibull-based speed distribution
    and direction-weighted sampling produce plausible, neutral meteorological data.
  weaknesses:
  - 'Grid is not theme-adaptive: panel_grid_major/minor are left at theme_minimal()
    defaults instead of being set from INK_SOFT, so the radial/angular gridlines render
    as bold, high-contrast white lines against the near-black dark background while
    staying subtle grey against the light background. Add panel_grid_major=element_line(color=INK_SOFT,
    size=0.2-0.3) (and panel_grid_minor similarly, lower alpha/size) inside the existing
    theme() call so grid intensity is consistently subtle in both themes.'
  - 'Title is missing the required language segment: current title is ''windrose-basic
    · letsplot · anyplot.ai'' but SC-04 requires ''{spec-id} · {language} · {library}
    · anyplot.ai'' -> should read ''windrose-basic · python · letsplot · anyplot.ai''.'
  - 'Dead code: `direction_labels` (the 16-name compass list) is built but never used
    anywhere -- the actual tick labels passed to scale_x_continuous are a separate
    hardcoded 8-item list. Remove the unused variable or use it to derive the labels.'
  - The PIL alpha-compositing step to flatten the transparent margin left by coord_polar()'s
    layout pass is a functional but non-idiomatic workaround bolted on after ggsave;
    fine as a stopgap but worth revisiting if lets-plot exposes a cleaner way to set
    the polar plot's outer margin/background natively.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "windrose-basic · letsplot · anyplot.ai" centered at top in dark ink, clearly legible. Compass tick labels (N, NE, E, SE, S, SW, W, NW) and radial frequency ticks (0, 5, 10, 15) rendered in soft dark grey, legible against the light surface. "Frequency (%)" y-axis title in dark ink, rotated along the left edge, legible. Grid: subtle light-grey concentric circles and radial spokes, visible but unobtrusive. Legend "Wind Speed" box (elevated off-white background, thin border) sits outside the plot on the right with six unit-labeled swatches (0-3 m/s ... 15+ m/s), all legible.
      Data: Stacked polar bars per compass sector, six-color stack in canonical Imprint order -- green (#009E73, 0-3 m/s), purple (3-6 m/s), blue (6-9 m/s), brown/tan (9-12 m/s), dark red (12-15 m/s), cyan (15+ m/s). Dominant sectors are NW and W (largest radial extent, reaching past the "10" ring), decreasing smoothly toward N/E/SE, consistent with the "prevailing westerlies" data-generation logic. First series is confirmed #009E73 green.
      Legibility verdict: PASS -- all text is readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title, compass labels, and radial tick labels are rendered in light ink/grey and remain clearly legible against the dark surface -- no dark-on-dark failures. Legend box uses an elevated dark background with a light border; swatches and text all legible. However, the polar grid (concentric circles + radial spokes) renders as bold, high-contrast white/light-grey lines -- noticeably more prominent here than the subtle grey grid in the light render, because panel_grid colors were not set from the INK_SOFT theme token and fall back to the theme_minimal() default.
      Data: Same six-color stack as the light render -- green, purple, blue, brown, dark red, cyan -- confirmed pixel-identical to the light render; only chrome (background, grid, text) changed between themes as expected, aside from the grid-intensity issue noted above.
      Legibility verdict: PASS for text (all readable, no dark-on-dark text failures); grid styling is a refinement issue (too prominent), not a legibility failure.
