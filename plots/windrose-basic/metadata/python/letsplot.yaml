review:
  strengths:
  - Correct stacked polar bar wind rose via geom_bar(stat='identity', position='stack')
    + coord_polar with 16 equal sectors
  - layer_tooltips() adds compass direction, speed band and formatted frequency on
    hover in the HTML export
  - Realistic direction-dependent Weibull speeds give a clear prevailing NW/W pattern;
    seeded and reproducible
  weaknesses:
  - 'SC-02, SC-03 (both): the rose is rotated 11.25° clockwise: the N label and the
    N spoke sit half a sector right of the top, so every direction is drawn off its
    compass bearing → N centered at the top (−11.25°). Likely cause: coord_polar(start=0)
    with x limits [-0.5, 15.5]; set coord_polar(start=-np.pi / 16).'
  - 'VQ-07 (both): the ordered speed bins are colored with unrelated categorical hues
    (green, lavender, blue, ochre, red, cyan), which hides their calm-to-strong order
    → discrete steps of the imprint_seq marks ramp with each theme''s stops (style
    guide, Ordered Categories). Likely cause: colors = the first six Imprint categorical
    hues.'
  - 'DE-02 (both): grid rings and spokes drawn in INK_SOFT at full opacity read bold,
    most visibly on light → a subtle grid at about 15 % ink. Likely cause: panel_grid_major/minor
    color=INK_SOFT without alpha.'
  - 'CQ-03 (code): from lets_plot import * with noqa F403/F405 markers → explicit
    imports of the names used. Likely cause: star import.'
  - 'CQ-04 (code): a PIL alpha-composite pass (about 5 lines and the PIL import) flattens
    coord_polar''s transparent margins → wrap the plot in a one-panel gggrid carrying
    the page color, as the library prompt names. Likely cause: post-processing the
    saved PNG.'
  - 'Suggestion: tighten the space around the legend card so it sits closer to the
    rose.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole canvas.
      Chrome: title 'windrose-basic · python · letsplot · anyplot.ai' dark and centered; radial ticks 0/5/10/15 and 'Frequency (%)' at the left; compass labels N…NW around the rim (N sits about 11° right of the top); 'Wind Speed' legend in an elevated card. Grid rings and spokes drawn in dark ink at full opacity and read bold. All text readable.
      Data: 16 stacked polar spokes with white outlines; speed bins 0-3 #009E73, 3-6 lavender, 6-9 blue, 9-12 ochre, 12-15 red, 15+ cyan; longest spokes NW, W, NNW.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, ticks, compass labels and legend text in light ink, all readable; no dark-on-dark text; light grid lines.
      Data: same six categorical hues as the light render; white outlines around every segment and legend swatch.
      Legibility verdict: PASS
