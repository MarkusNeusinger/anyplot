review:
  strengths:
  - Idiomatic go.Barpolar stacked wind rose with a subtle polar donut hole (hole=0.06)
    instead of a naive full-disc chart
  - Thoughtful radial-axis angle rotation (112.5°) that places the frequency ticks
    over the sparsest sector (between N and NW) instead of colliding with the dominant
    SW/W bars
  - 'Correct use of the Imprint sequential colorscale (imprint_seq, #009E73 -> #4467A3)
    via sample_colorscale to encode the ordinal speed bins, with the brand green anchoring
    the calmest bin as required'
  - 'Realistic, well-reasoned coastal wind climatology: Weibull(2, 6 m/s)-distributed
    speeds and a weighted prevailing SW/W direction distribution, both plausible for
    a 3-year daily-average record'
  - Full theme-adaptive chrome (background, ink, grid, legend box) correctly threaded
    through both light and dark renders
  - Clean, reproducible, KISS-structured code (seeded RNG, no functions/classes, only
    used imports)
  weaknesses:
  - Title omits the mandated "python" language segment - it reads "windrose-basic
    · plotly · anyplot.ai" instead of the required "windrose-basic · python · plotly
    · anyplot.ai"
  - Landscape 3200×1800 canvas leaves a large empty gap between the circular chart
    and the isolated legend column on the right; either tighten the legend's x position/margins
    or switch to the square 2400×2400 canvas, which is the better native fit for a
    symmetric polar chart
  - The outermost ">12 m/s" speed band totals only ~0.9% of observations and renders
    as a near-invisible hairline ring in most sectors - realistic, but a small minimum
    visual width (or a slightly heavier marker_line_width) would keep it perceptible
    at a glance
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "windrose-basic · plotly · anyplot.ai" in dark ink, clearly readable; compass labels (N, NE, E, SE, S, SW, W, NW) dark and legible; radial "Frequency (%)" axis (rotated ~112.5°, placed between N and NW) in dark ink with subtle gridlines at 5/10/15/20/25%; legend box "Wind Speed" in an elevated cream box with dark border and dark text. All chrome text is clearly readable against the light background.
      Data: Eight stacked polar wedges, one per compass direction. Innermost segment (0-3 m/s) is brand green #009E73, transitioning through teal and blue tones to a thin dark-blue outer rim (>12 m/s), separated by thin cream-colored dividers. SW and W wedges are visibly the longest (dominant directions), N is the shortest. Colors read clearly against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title, compass labels, radial axis ticks/title, and legend text all render in light/off-white ink, clearly legible against the dark background. Legend box uses the elevated dark surface (#242420) with a light border. Gridlines are subtle light strokes at low opacity.
      Data: Same stacked wedge structure and identical data colors as the light render (brand green inner segment through to blue outer segment) - confirms the Imprint categorical/continuous colors do not shift between themes. No dark-on-dark or light-on-light failures observed; all text and data remain distinguishable from the near-black surface.
      Legibility verdict: PASS
