review:
  strengths:
  - All 8 compass sectors render with 5 stacked speed bins each (verified by zooming
    into the raw PNG) — full spec feature coverage, not just the two tallest N/S petals
    visible at a glance
  - Data-driven subtitle ('N–S corridor carries 37% of observations...') is computed
    directly from the plotted frequencies rather than being a generic caption
  - Cool→warm speed-bin ramp (blue→cyan→green→amber→red) matches the spec's meteorological
    convention and every color is a valid Imprint/amber token
  - Clean minimal chrome (blank axis ticks/lines/text, subtle dashed radial gridlines,
    generous whitespace) with no dark-on-dark or light-on-light failures in either
    theme
  - Legend clearly labeled 'Wind Speed (m/s)' with all 5 ranges; background/border
    correctly adapts between light and dark surfaces
  weaknesses:
  - Frequencies across all 8 directions x 5 speed bins sum to only ~41.8%, not the
    ~100% expected for a complete wind-frequency distribution, with no 'calm' or omitted-category
    annotation explaining the missing >50% — rescale the frequencies dict so the total
    is close to 100% (or explicitly document a calm percentage) for DQ-03 credibility
  - The '5%' radial gridline label (freq_label_df) is positioned at an angle only
    ~11.5 degrees off the N spoke, landing inside the N wedge's 10-15 m/s (green)
    segment instead of in clear background — legible but overlaps colored data; move
    it further toward a low-frequency direction (e.g., along E or W) where it won't
    sit on top of a wedge
  - np.random.seed(42) is set but never used — every value in `frequencies` is a hardcoded
    literal and no np.random.* call exists anywhere in the script; remove the dead
    seed call or actually drive the data generation from it
  - 'Library mastery is generic: the wind rose is built entirely from geom_polygon/geom_path
    primitives available in any ggplot-style API, with no plotnine-distinctive feature
    (e.g. after_stat, faceting) showcased'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white, not dark.
      Chrome: Bold dark title "windrose-basic · python · plotnine · anyplot.ai" at top, italic gray subtitle below it naming the N-S corridor share. Compass labels (N, NE, E, SE, S, SW, W, NW) in large bold dark text ring the outside of the rose, all clearly legible against the light background. Dashed radial gridlines at 5%/10%/15% with dark-gray percentage labels; the "5%" label sits on top of the N wedge's green segment but remains readable. A "Frequency (%)" italic label sits above the N label. Bottom legend "Wind Speed (m/s)" with 5 labeled color swatches, elevated cream background, thin border.
      Data: Stacked wedges for all 8 compass directions (confirmed via close crop — 6 of the 8 look small at first glance but are genuinely present, not merged into a blank center), colored navy (0-5) -> cyan (5-10) -> green (10-15) -> amber (15-20) -> red (20+) from inner to outer ring. N and S petals are visibly the tallest, consistent with the "N-S corridor" narrative. First data color at innermost stack is Imprint blue, not #009E73, but this is a deliberate cool-to-warm speed-domain ordering rather than a generic categorical series (matches the spec's own convention).
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black, not light.
      Chrome: Same title/subtitle now in white/light-gray text, clearly visible. Compass labels flip to bold white/off-white text, fully legible against the dark background. Gridlines remain subtle dashed gray, still visible but unobtrusive. Percentage labels ("5%", "10%", "15%") are light gray/white and readable, including the one overlapping the green wedge. Legend background flips to a dark elevated panel with a visible border; legend text is light gray, readable.
      Data: Identical wedge colors and stacking to the light render (navy/cyan/green/amber/red) — confirmed the data palette does not shift between themes, only chrome (background, text, gridlines, legend panel) changes.
      Legibility verdict: PASS — no dark-on-dark failures found; all title, direction labels, gridline labels, and legend text remain clearly visible against the near-black background.
