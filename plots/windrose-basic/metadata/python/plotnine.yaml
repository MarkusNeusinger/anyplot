      Data: Stacked wedges for all 8 compass directions, colored navy (0-5) -> cyan (5-10) -> green (10-15) -> amber (15-20) -> red (20+) from inner to outer ring. N and S petals are visibly the tallest, consistent with the "N-S corridor" narrative and the underlying frequency values. First data color at innermost stack is Imprint blue rather than #009E73, but this is a deliberate cool-to-warm speed-domain ordering matching the spec's own convention, not a generic categorical series.
