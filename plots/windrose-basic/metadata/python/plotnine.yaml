review:
  strengths:
  - Frequencies now sum to ~100.1% across all 8 directions x 5 speed bins (verified
    by direct calculation), resolving the prior DQ-03 deduction and giving the distribution
    real-world credibility
  - The '5%'/'10%'/'15%' radial gridline labels were repositioned into the narrow
    angular gap between the E and NE wedges, no longer overlapping the N wedge's colored
    segment
  - Dead np.random.seed(42) call (never used since all data is a hardcoded literal)
    was removed, resolving the CQ-04 code elegance deduction
  - Data-driven subtitle ('N-S corridor carries 37% of observations...') is computed
    directly from the plotted frequencies rather than being a generic caption
  - Cool-to-warm speed-bin ramp (blue to cyan to green to amber to red) matches the
    spec's meteorological convention and every color is a valid Imprint/amber token
  - Clean minimal chrome (blank axis ticks/lines/text, subtle dashed radial gridlines,
    generous whitespace) with no dark-on-dark or light-on-light failures in either
    theme
  - Legend clearly labeled 'Wind Speed (m/s)' with all 5 ranges; background/border
    correctly adapts between light and dark surfaces
  weaknesses:
  - 'Library mastery remains generic: the wind rose is still built entirely from geom_polygon/geom_path/geom_text
    primitives available in any ggplot-style API, with no plotnine-distinctive feature
    (e.g. after_stat, faceting, geom_rect with coord_polar) showcased — this was flagged
    in the prior review and not addressed in this attempt'
  - Manual polygon construction (20-point arcs per wedge, per-segment stacking loop)
    is a defensible workaround for plotnine's lack of a robust polar bar geometry,
    but it means the implementation doesn't demonstrate idiomatic plotnine stacking
    (e.g. geom_col + coord_polar) even where that might have been feasible
