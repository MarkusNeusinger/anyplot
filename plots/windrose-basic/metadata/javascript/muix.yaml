review:
  strengths:
  - 'Custom annular-sector geometry (annularSectorPath) is a mathematically correct
    polar-stacked-histogram, not faked chrome — north-up, clockwise compass convention
    verified: the dominant wedge sits exactly at the SW label for PREVAILING_DEG=225.'
  - 'Speed bins use the true imprint_seq (brand green -> blue) continuous gradient
    anchored at #009E73 for the calmest bin, and the gradient is byte-identical across
    both renders — only chrome flips.'
  - Compass label typographic hierarchy (bold cardinal, semi-bold intercardinal, regular
    secondary) plus tucking the percent reference axis into the low-data NE/ENE gap
    shows real design intentionality rather than library defaults.
  - Fixed-seed mulberry32 PRNG gives full reproducibility, code stays single-purpose
    with no fake interactive chrome, and skipAnimation is set correctly.
  weaknesses:
  - 'Library Mastery is weak: ChartContainer + useDrawingArea are only used for sizing/margin
    scaffolding (series=[] is empty) — every wedge, ring, tick and legend entry is
    raw hand-drawn SVG rather than any real MUI X chart surface. Consider layering
    MUI X''s native <ChartsLegend> and/or <ChartsTooltip> on top of the manual polar
    geometry so the implementation shows more genuine library-native usage (this also
    strengthens LM-01/LM-02 and counts as a real interactive feature even if invisible
    in the static PNG).'
  - The lowest-frequency direction sectors (E, ENE, NE, ESE, SE) render as very thin
    slivers where the 5 stacked speed-bin colors become hard to individually distinguish
    at full resolution — consider a small minimum-radius floor for near-zero sectors
    so calm-direction segments stay legible.
  - The synthetic dataset produces one clearly dominant SW peak with only a minor
    secondary bump elsewhere; a touch more spread or a distinct secondary regime (e.g.
    a smaller NW gust pattern) would better demonstrate DQ-01 feature coverage for
    a wind rose.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "windrose-basic · javascript · muix · anyplot.ai" in bold dark ink at top, fully visible, not clipped. 16 compass labels (N/NNE/NE/... /NNW) ring the polar plot with a clear bold-cardinal > semi-bold-intercardinal > regular-secondary size hierarchy, all dark and legible. Percent reference axis (5%/10%/15%/20%) is a dashed diagonal line placed in the low-data NE/ENE gap, with tick labels on small off-white pill backgrounds for contrast. Grid rings are thin and subtle (outer ring slightly bolder/solid). Legend at the bottom shows 5 swatches labeled "0-2 m/s" through "8+ m/s", all dark text, clearly readable.
      Data: Stacked annular sectors per direction, colored on the imprint_seq gradient (#009E73 green for the calmest bin progressing to blue for 8+ m/s), identical hue set in both themes. A clearly dominant wedge cluster sits at SW/WSW/SSW (matching the coded 225° prevailing direction), with much smaller wedges elsewhere and near-invisible slivers on the low-frequency E/NE/SE side.
      Legibility verdict: PASS — all text elements (title, compass labels, percent ticks, legend) are clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, compass labels, dashed percent-axis and legend, all now rendered in light ink (title/compass in near-white, tick/legend text lighter secondary tone) — fully legible against the dark surface. Tick-label pill backgrounds correctly switch to the dark elevated tone so the black-on-dark contrast issue does not occur. Grid rings remain subtle and visible against the dark background.
      Data: Same annular sector geometry and same dominant SW cluster; segment colors are pixel-identical to the light render (confirmed — the imprint_seq green-to-blue progression does not shift with theme), only the chrome (background, text, grid, tick pill fill) flips.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, compass labels, tick labels, legend) reads clearly against the near-black surface.
