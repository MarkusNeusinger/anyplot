review:
  strengths:
  - 'Correct meteorological convention: North at the top with a clockwise compass
    layout (N/NNE/NE.../NNW), verified geometrically via the -90deg SVG offset and
    confirmed visually in both renders.'
  - 'Genuine MUI X composition instead of fake chrome: real (unrendered) `bar` series
    drive the native <ChartsLegend> and <ChartsTooltip>, and useInteractionItemProps
    wires the hand-drawn wedges into MUI X''s own interaction system — a faithful
    workaround for the community package''s lack of a native polar chart.'
  - 'Deterministic, realistic wind climatology: mulberry32-seeded 3-regime model (prevailing
    SW, secondary NW, background noise) produces a clear multi-modal wind rose with
    all 5 speed bins represented across all 16 directions.'
  - 'Correct Imprint sequential palette (brand green -> blue) for the continuous speed
    dimension, identical data colors across themes, and theme-correct chrome (backgrounds
    #FAF8F1/#1A1A17, ink, grid) confirmed in both renders.'
  - Thoughtful typographic hierarchy on compass labels (cardinal bold 20px > intercardinal
    semibold 16px > secondary 13px) and a dashed frequency-tick axis placed in the
    empty NE/ENE gap so it never collides with a data wedge.
  weaknesses:
  - Secondary/tertiary compass labels (13px CSS, non-cardinal/intercardinal directions)
    are on the small side and may lose legibility once the PNG is scaled to a ~400px
    mobile width; a bump to ~14-15px would add margin.
  - The MIN_SLICE_PCT floor gives near-zero direction/speed cells a visible sliver
    for legibility, which slightly exaggerates their apparent radius relative to true
    frequency (legend/tooltip values stay honest, but a viewer reading bar length
    alone could overestimate very rare combinations) — consider a lower floor or a
    distinct lower-opacity treatment for floored slivers.
  - The file carries nine small helper functions (mulberry32, randNormal, hexToRgb,
    lerpHex, annularSectorPath, toRad, plus the three components) — justified by the
    custom polar geometry MUI X community can't express natively, but more structure
    than the KISS ideal; worth a light pass to see if any can be inlined.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (not pure white).
      Chrome: Bold black title "windrose-basic · javascript · muix · anyplot.ai" centered at top (~50% of canvas width). 16 compass labels (N at top, clockwise through NNE/NE/.../NNW) with clear typographic hierarchy (cardinal bold/largest, intercardinal semibold/medium, secondary regular/smallest) — all dark ink, fully legible. Radial grid rings at 5/10/15/20% with a dashed reference axis and percent tick labels in the empty NE/ENE gap, each on a subtle pill background so they stay readable over the grid. Legend at the bottom shows 5 swatches (0-2, 2-4, 4-6, 6-8, 8+ m/s) with dark labels.
      Data: Stacked annular wedges concentrated toward SW (largest, dominant regime) and a secondary cluster toward NW, tapering to thin slivers toward the calm NE/ENE/E/ESE/SE arc. Colors run from brand green (#009E73, calmest bin) through teal to steel-blue (strongest bin), separated by thin white strokes; consistent within every wedge.
      Legibility verdict: PASS — all text (title, compass labels, tick labels, legend) is clearly readable against the light background; no light-on-light issues found; no clipping at any canvas edge (verified via close crops of all four borders).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (not pure black).
      Chrome: Same title and compass-label layout, now rendered in light ink (#F0EFE8 primary / lighter gray secondary) against the dark background — fully legible, no dark-on-dark failures observed. Grid rings and dashed reference axis are the theme-adaptive light-on-dark grid color; percent-tick pill backgrounds correctly swap to the dark elevated tone. Legend text and swatches are readable at the bottom.
      Data: Identical wedge geometry and identical data colors to the light render (green -> teal -> steel-blue sequential ramp), confirming the Imprint palette data hues are held constant across themes; only chrome (background, text, grid) flips as required.
      Legibility verdict: PASS — all text is clearly readable in the dark theme; no dark-on-dark text found in title, compass labels, tick labels, or legend.
