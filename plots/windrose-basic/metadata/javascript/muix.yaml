review:
  strengths:
  - 'Correct 16-sector wind rose: north at the top, compass order clockwise, equal
    sector widths, sectors centred on their compass points (Math.round binning)'
  - Speed bins of a round width (2.5 m/s) derived from the 90th percentile of the
    speeds, giving four meaningful classes with an open-ended ≥ 7.5 m/s top class
  - Speed classes colored in four discrete steps of imprint_seq interpolated from
    the theme tokens, identical in both renders, with a legend that gives each range
  - Three-level compass typography (cardinal bold ink, intercardinal semibold ink,
    secondary regular ink-soft) gives the rim a clear hierarchy
  - Frequency ring labels are placed along the sector boundary with the fewest observations
    and carry a page-colored halo, so they never collide with spokes
  - Page-colored separators between stacked segments and small sector gaps keep every
    segment readable in both themes
  - Uses the ChartsContainer + useDrawingArea custom-layer pattern the library prompt
    recommends for a chart type MUI X community lacks, with skipAnimation and all
    chrome threaded through ANYPLOT_TOKENS
  weaknesses:
  - 'Suggestion: the legend repeats the unit in every entry although its title already
    says (m/s); bare ranges (0–2.5, 2.5–5, …) would read lighter.'
  - 'Suggestion: the 2.5–5 and 5–7.5 m/s steps are close in hue; a slightly lighter
    first or darker last step within imprint_seq would widen the middle contrast.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole square 2400x2400 canvas.
      Chrome: title "windrose-basic · javascript · muix · anyplot.ai" bold dark ink at top centre, ink-soft subtitle "4,380 observations · 16 sectors of 22.5° · spoke length: share of all observations (%)"; 16 compass labels around the rim (N/E/S/W bold, NE/SE/SW/NW semibold, secondary points regular ink-soft); four light-grey frequency rings labelled 5 %, 10 %, 15 %, 20 % along the quiet ENE–NE boundary; HTML legend at the bottom "Wind speed (m/s)" with four swatches. All text readable.
      Data: 16 stacked spokes, longest at SW (~17 %), then SSW and WSW, a secondary NW/WNW lobe, near-empty E/NE sectors; segments step from brand green #009E73 (0–2.5 m/s) through teal and slate to blue #4467A3 (≥ 7.5 m/s), separated by thin page-colored strokes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, compass labels, ring labels and legend text flip to light ink / light ink-soft; rings are subtle dark-grey; no dark-on-dark text anywhere.
      Data: segment colors identical to the light render (same four imprint_seq steps); separators now in the dark page color.
      Legibility verdict: PASS
