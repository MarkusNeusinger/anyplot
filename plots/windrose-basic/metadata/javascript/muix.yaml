review:
  strengths:
  - 'Builds a real polar stacked histogram on the community package: a custom SVG
    layer inside ChartsContainer reads useDrawingArea() and draws 16 equal-width annular
    wedges, north at the top and clockwise in compass order'
  - Speed bins and frequency rings are computed from the data (nice step from the
    90th speed percentile, ring step from the largest spoke), giving meaningful 0–2.5
    / 2.5–5 / 5–7.5 / ≥ 7.5 m/s classes and 5 % rings from zero at the center
  - 'Ordered speed bins use four discrete steps of imprint_seq (#009E73 → #4467A3)
    in natural order, identical in both themes, with a legend that names each range'
  - Compass labels carry a three-level hierarchy (bold cardinals, semibold intercardinals,
    soft-ink secondary points), and wedges are separated by page-colored strokes and
    small sector gaps
  - Ring labels sit along the quietest sector boundary with a page-colored halo, so
    they never collide with data
  - Chrome is threaded from ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg), and both
    themes read cleanly
  weaknesses:
  - 'VQ-01 (both): ring labels ("5 %" … "20 %") and the secondary compass points (NNE,
    ENE, …) at 14–15 px in soft ink shrink to about 5 px in the 400 px thumbnail and
    blur into the grid → about 17–18 px (+3 px). Likely cause: ring label fontSize={15}
    and the secondary rank of [16, 15, 14] in WindRoseLayer.'
  - 'Suggestion: a tooltip on each wedge (direction, speed bin, share) would add value
    to the HTML view.'
  - 'Suggestion: the two middle ramp steps (2.5–5 and 5–7.5 m/s) are close in lightness;
    interpolating in a perceptual space instead of RGB would separate them a little
    more.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: title "windrose-basic · javascript · muix · anyplot.ai" bold dark ink centered at top, a soft-ink subtitle (4,380 observations · 16 sectors of 22.5° · spoke length: share of all observations (%)); four subtle grey frequency rings labelled 5 % – 20 % along the NE/ENE boundary; 16 compass labels around the rim (bold N/E/S/W, semibold NE/SE/SW/NW, soft secondary points); legend band at the bottom "Wind speed (m/s)" with four swatches. All text is readable.
      Data: 16 equal-width stacked wedges, north at top, clockwise. Prevailing SW/SSW spokes reach about 17 %, a secondary NW/WNW lobe reaches about 10–12 %, and the east side is almost empty. Speed bins use the imprint_seq steps: brand green #009E73 (0–2.5), teal, steel teal, blue #4467A3 (≥ 7.5), separated by thin page-colored strokes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, cardinal labels and legend text in light ink; subtitle, ring labels and secondary compass points in light soft ink; rings dark grey but visible. No dark-on-dark text.
      Data: wedge geometry and the four bin colors are identical to the light render; only the separator stroke flips to the dark page color. Brand green stays clearly visible.
      Legibility verdict: PASS
