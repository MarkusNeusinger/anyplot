review:
  strengths:
  - 'Correct meteorological convention: North at top, directions ordered clockwise
    (N, NE, E, SE, S, SW, W, NW)'
  - 'Perfect Imprint palette compliance — first speed bin is #009E73, remaining bins
    follow canonical order 2-4, identical data colors in both themes, theme-correct
    #FAF8F1/#1A1A17 chrome'
  - 'Realistic, well-scaled offshore wind-farm data: sectors sum to 100%, clear SW/W/NW
    prevailing-wind pattern typical of Northern Hemisphere mid-latitude sites'
  - 'Thoughtful polish: pageBg-colored strokes separate stacked speed segments, small
    padAngle gaps between direction wedges improve readability, explicit font sizes
    throughout'
  - Clean, deterministic, dependency-free code that correctly follows the D3 mount-node
    contract with no animations
  weaknesses:
  - 'Design Excellence is competent but not yet publication-grade: the chart reads
    as a well-executed standard wind rose without an added layer of visual sophistication
    or a highlighted focal point (e.g. a subtle annotation or emphasis calling out
    the dominant SW/W/NW pattern) that would push DE-01/DE-03 higher'
  - Stacking is computed with a manual cumulative sum instead of D3's idiomatic d3.stack()
    layout generator — using d3.stack() would better demonstrate D3's high-level stacking
    API and raise Library Mastery (LM-01)
  - The technique (scaleLinear + arc with manually cumulative offsets) is solid but
    fairly generic for D3 — leaning on a more distinctive D3-specific feature (e.g.
    d3.stack() keyed accessors, or a custom radial axis via d3-axis) would raise LM-02
    beyond 'competent but replicable'
  - Title spans only ~40% of plot width, on the low end for legibility hierarchy —
    a slightly larger title fontsize would give it more visual presence without risking
    overflow
  image_description: |-
