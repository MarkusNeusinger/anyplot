      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "windrose-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center, fully visible with no clipping (verified via crop of top edge). Compass direction labels (N, NE, E, SE, S, SW, W, NW) in bold dark text around the polar rim, clearly legible and well clear of the canvas edge (verified via crop of left edge — "W" label sits with generous margin from the left border). Radial percentage grid rings at 10%/20%/30% with matching tick labels in soft ink, placed in the low-value NNE gap where they don't collide with any wedge. Legend at the bottom with 4 color swatches and labels ("0-5 m/s", "5-10 m/s", "10-15 m/s", "15+ m/s").
      Data: Stacked polar wedges per direction, using Imprint colors #009E73 (green, calm 0-5 m/s), #C475FD (lavender, 5-10 m/s), #4467A3 (blue, 10-15 m/s), #BD8233 (ochre, 15+ m/s) — first series is the mandated brand green. Clear dominant pattern: W, SW, and NW wedges are much larger than N/NE/E/SE, correctly conveying a prevailing wind direction. White/pageBg strokes separate stacked segments and thin gaps separate direction sectors.
