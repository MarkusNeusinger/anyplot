review:
  strengths:
  - Idiomatic d3.stack() keyed layout now drives the stacking (replacing the prior
    manual cumulative-sum approach), directly addressing the Attempt 1 Library Mastery
    weakness
  - 'Strong data storytelling: a subtle dominant-sector highlight halo (d3.arc with
    rounded corners, low-opacity ink) plus an explicit subtitle (''Prevailing winds
    from the W sector — 28.6% of observations'') give the chart a clear focal point
    without annotations feeling forced'
  - Title fontsize increased to fill ~55-60% of plot width (up from ~40% in Attempt
    1), landing well inside the target proportion while staying fully clear of the
    canvas edges in both themes
  - 'Perfect Imprint palette compliance: first speed bin is #009E73, remaining bins
    follow canonical order 2-4, identical data colors in both themes, theme-correct
    #FAF8F1/#1A1A17 backgrounds and chrome'
  - Correct meteorological convention (North at top, clockwise N/NE/E/SE/S/SW/W/NW),
    sector frequencies sum to ~100%, and the SW/W/NW prevailing pattern is realistic
    for a mid-latitude offshore site
  - Clean, deterministic, dependency-free code with no animation, correctly following
    the D3 mount-node contract
  weaknesses:
  - Speed-bin color assignment (green→lavender→blue→ochre) follows Imprint canonical
    order rather than the spec's 'traditionally cool-to-warm' suggestion for speed
    bins — acceptable since the palette hard rule takes precedence, but a future iteration
    could consider whether a semantic order communicates speed progression more intuitively
  - d3.arc() polar-stack technique, while now idiomatic, is a moderately common D3
    pattern; a more distinctive library-specific flourish (e.g. a custom d3-axis-based
    radial scale, or interactive-ready hover state wired for the HTML output) would
    push Library Mastery (LM-02) further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "windrose-basic · javascript · d3 · anyplot.ai" in bold dark ink at top-center, fully visible with no clipping (verified via edge crop). Subtitle "Prevailing winds from the W sector — 28.6% of observations" in soft ink directly below. Compass direction labels (N, NE, E, SE, S, SW, W, NW) in bold dark text around the polar rim, clearly legible with generous margin from the canvas edges (verified via left/right edge crops — no text near the border). Radial percentage grid rings at 10%/20%/30% with matching tick labels in soft ink, placed in the low-value NNE gap where they don't collide with any wedge. A subtle rounded-rectangle highlight halo (low-opacity ink) sits behind the dominant W wedge, reinforcing the storytelling subtitle without competing with the data. Legend at the bottom with 4 color swatches and labels ("0-5 m/s", "5-10 m/s", "10-15 m/s", "15+ m/s"), comfortably clear of the bottom edge.
      Data: Stacked polar wedges per direction, using Imprint colors #009E73 (green, 0-5 m/s), #C475FD (lavender, 5-10 m/s), #4467A3 (blue, 10-15 m/s), #BD8233 (ochre, 15+ m/s) — first series is the mandated brand green, remaining bins in canonical Imprint order. Clear dominant pattern: W, SW, and NW wedges are much larger than N/NE/E/SE, correctly conveying a prevailing wind direction. pageBg-colored strokes separate stacked segments and thin padAngle gaps separate direction sectors.
