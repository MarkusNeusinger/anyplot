review:
  strengths:
  - Clever use of Chart.js's single-series polarArea type to fake a true stacked wind
    rose via cumulative sums per direction plus intentional dataset draw order (documented
    in code comments), producing an honest stacked-ring visualization Chart.js doesn't
    natively support.
  - Radial percentage tick labels stay legible even where they sit over colored wedges,
    via showLabelBackdrop plus z:1 to draw ticks above the data layer.
  - Custom generateLabels legend correctly maps the 4 speed-bin colors/labels (instead
    of Chart.js's default per-direction legend), with a working show/hide toggle via
    onClick.
  - Correct Imprint palette usage (green -> lavender -> blue -> ochre) applied identically
    in both themes, with fully theme-adaptive chrome (background, title, ticks, grid,
    legend).
  - 'Data is realistic and factually sound: all frequencies sum to exactly 100%, with
    a clear dominant SW/W wind pattern and a secondary NW lobe narrated in the code
    comments.'
  weaknesses:
  - Low-frequency direction sectors (NE, E, SE) produce quite thin/narrow color bands,
    making the four speed-bin boundaries harder to distinguish at a glance in those
    sectors -- purely a rendering-density observation, the underlying data is correct.
  - Grid/spoke styling is functional but fairly plain (standard token grid color/opacity)
    -- could push Design Excellence further with e.g. varied opacity between minor/major
    rings.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "windrose-basic · javascript · chartjs · anyplot.ai" in dark ink at top, centered, fully visible, no overflow/clipping. Subtitle "Frequency of observations (%)" in soft grey below it. Compass point labels (N, NE, E, SE, S, SW, W, NW) in dark ink around the circle's rim. Radial percentage ticks (5%, 10%, 15%, 20%, 25%) sit on light backdrop chips so they stay readable even where they cross colored wedges. Legend at the bottom lists the 4 speed bins ("0-5 m/s", "5-10 m/s", "10-15 m/s", "15+ m/s") with matching color swatches.
      Data: Stacked polar rings per direction -- green (0-5 m/s) innermost, lavender/purple (5-10 m/s), blue (10-15 m/s), ochre/brown (15+ m/s) outermost. First series is Imprint brand green #009E73. Clear dominant lobes toward SW/W/NW (reaching close to the 20-25% rings), small thin wedges toward NE/E/SE.
      Legibility verdict: PASS -- all title, axis/compass labels, tick labels, and legend text are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title and subtitle flip to light-colored text (white/light grey), fully legible. Compass labels are light-colored against the dark background. Radial tick labels keep dark backdrop chips (elevated-bg token) with light text, remaining legible over both the dark page background and the colored wedges. Legend text is light-colored and clearly readable.
      Data: Identical wedge colors and layout to the light render -- green, lavender, blue, ochre bands in the same directions and proportions. Only the chrome (background, text, grid, tick backdrops) flipped to the dark theme.
      Legibility verdict: PASS -- no dark-on-dark failures found; all chrome elements are clearly visible against the near-black background.
