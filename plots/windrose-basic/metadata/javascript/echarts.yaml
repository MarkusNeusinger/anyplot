review:
  strengths:
  - 'Correct meteorological construction: 16-sector polar stacked bar chart with North
    placed exactly at top via the computed startAngle offset, clockwise compass ordering
    (N-E-S-W).'
  - 'Fully Imprint-compliant color usage: the 5 stacked speed bins are sampled from
    the imprint_seq gradient (brand green to blue), pixel-identical across light and
    dark renders, with the calmest bin correctly landing on #009E73.'
  - Theme-adaptive chrome is threaded correctly through title, angleAxis/radiusAxis
    labels, gridlines, and legend in both renders - no dark-on-dark or light-on-light
    failures.
  - Thin borderColor stroke (using the theme page-background as separator) between
    stacked segments now clearly delineates the 5 speed bands even in the smallest
    sectors (E/ENE/ESE/SE) - directly resolves the Attempt 1 VQ-03 weakness.
  - Bold formatting on the dominant-direction (SW) axis label creates a genuine focal
    point that reinforces the bar-length encoding - directly resolves the Attempt
    1 DE-03 weakness.
  - Title fontsize increased (22 -> 26) giving stronger visual hierarchy, and the
    four small color-math helper functions from Attempt 1 were inlined, tightening
    the script to a single flat, KISS-compliant pass - resolves both the Attempt 1
    title-weight and CQ-01 weaknesses.
  - 'Clean, deterministic, in-memory data generation (no RNG) with a realistic coastal-station
    wind pattern: prevailing SW/WSW/SW lobe plus a distinguishable secondary N lobe,
    with speed-bin composition shifting between strong and calm directions.'
  weaknesses:
  - Title now spans ~49% of canvas width (up from ~40% in Attempt 1) - much improved
    but still just under the 50-70% guideline; a small further fontsize bump (~28-30px)
    would fully close the gap.
  - The radial "15%" outer tick label sits directly on the outer axis-line stroke
    in both renders (touching, not clipped) - nudging the radiusAxis label margin
    outward slightly would give it cleaner separation.
  - The right-hand quadrant (NE/E/SE) remains visually sparse/empty due to the realistic
    prevailing-SW data distribution - expected given DQ realism, but a minor overall
    balance nitpick versus the dense left half.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "windrose-basic · javascript · echarts · anyplot.ai" centered at top (~49% of canvas width, up from ~40% pre-repair). 16 compass direction labels (N, NNE, NE, ... NNW) in gray around the circle, with SW rendered bold to flag the dominant direction. Radial gridlines and %-labels (6%/9%/12%/15%) are subtle but legible; the "15%" label touches the outer axis-line stroke without being clipped. Legend at bottom lists all 5 speed bins ("0-3 m/s" ... "12+ m/s") with matching color swatches.
      Data: Green-to-blue sequential gradient (imprint_seq) stacked across the 5 speed bins per direction sector, calmest bin = brand green #009E73. A thin cream-colored stroke now separates each stacked segment, keeping the bins visually distinguishable even in the smallest sectors (E/ENE/ESE/SE). Longest bars point SW/WSW/SW (prevailing wind) with a secondary lobe at N.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, direction labels, radial %-labels, and legend text all render in light tones and remain clearly legible. Gridlines are faint but visible. The bold SW label and "15%"/outer-line touch behave identically to the light render.
      Data: Colors are pixel-identical to the light render (same green-to-blue gradient, same segment strokes) - only chrome (background, text, grid) flips between themes, confirming the required light/dark data-color parity.
      Legibility verdict: PASS - no dark-on-dark failures found; all text is readable against the dark background.
