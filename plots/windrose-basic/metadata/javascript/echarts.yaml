review:
  strengths:
  - 'Correct meteorological windrose construction: 16-sector polar stacked bar chart
    with North placed exactly at top via the startAngle offset formula.'
  - 'Fully Imprint-compliant color usage: speed bins sampled from the imprint_seq
    gradient (brand green -> blue), identical across light and dark renders, with
    the calmest bin correctly landing on #009E73.'
  - Theme-adaptive chrome correctly threaded through title, angleAxis/radiusAxis labels,
    gridlines, and legend in both renders - no dark-on-dark or light-on-light failures.
  - Realistic, neutral coastal wind dataset showing a clear prevailing SW/WSW/SW pattern
    plus a distinguishable secondary N lobe, with speed-bin composition shifting between
    strong and calm directions.
  - Clean, deterministic, in-memory data generation with explicit font sizes, animation
    disabled, and correct mount-node / echarts.init usage per the library contract.
  weaknesses:
  - Title occupies only ~40% of the canvas width even though it is the long mandated
    `windrose-basic · javascript · echarts · anyplot.ai` string - fontsize 22 leaves
    the header looking under-weighted relative to the generous whitespace around it;
    a modest fontsize bump would improve visual hierarchy and canvas utilization.
  - The smallest direction sectors (E, ENE, ESE, SE, each ~1.8-2.4% frequency) produce
    very thin stacked bars where the 5 speed-bin color bands become hard to individually
    distinguish - consider a thin ink/white stroke between stacked segments to help
    delineate bins at low radii.
  - Design storytelling relies solely on bar-length contrast to show the prevailing
    SW pattern; a subtle callout or emphasis on the dominant sector (e.g. a highlighted
    arc or label) would push data storytelling further.
  - Four small helper functions (hexToRgb, rgbToHex, seqColor, speedShape) add more
    structure than a strictly KISS script needs - inlining or simplifying the gradient-sampling
    logic would tighten the code.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Bold dark title "windrose-basic · javascript · echarts · anyplot.ai" centered at top, clearly readable. 16 compass direction labels (N, NNE, NE, ... NNW) around the circle in medium-gray, all legible and non-overlapping. Radial gridlines at 6%/9%/12%/15% with light-gray percentage labels sitting in the angular gap between the N and NNW sectors (no overlap with the data bars). Legend at bottom center lists all 5 speed bins ("0-3 m/s" through "12+ m/s") with matching color swatches, fully readable.
      Data: Stacked polar bars, one per 16 compass directions, using a green-to-blue sequential gradient (imprint_seq) across the 5 speed bins - calmest bin (0-3 m/s) is brand green #009E73, transitioning through teal to blue for 12+ m/s. Longest bars point SW/WSW/SW (prevailing wind), with a distinguishable secondary, shorter lobe at N.
      Legibility verdict: PASS - all text is readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title, direction labels, radial percentage labels, and legend text all rendered in light gray/off-white and are clearly visible against the dark background. Gridlines are faint but visible. No dark-on-dark text found anywhere (title, ticks, legend all confirmed legible).
      Data: Same green-to-blue gradient as the light render, pixel-identical hues confirmed for both the brand-green calmest bin and the blue strongest bin - only the chrome (background, text, grid) flips between themes.
      Legibility verdict: PASS - all text is readable against the dark background.
