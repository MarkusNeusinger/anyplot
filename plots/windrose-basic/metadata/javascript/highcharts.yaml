review:
  strengths:
  - 'Correct spec compliance: 16 direction sectors, 4 meaningful speed bins, North
    at top, legend with speed-range colors, radial frequency axis'
  - 'imprint_seq (brand green → blue) correctly applied to the ordered speed-bin stack,
    anchored at #009E73 for the calmest bin'
  - Theme-adaptive chrome is fully correct in both renders — chrome flips, data colors
    stay pixel-identical
  - Real, invisibly-marked, data-bound scatter series recovers genuine hoverable tooltips
    in the HTML output on top of the renderer-drawn wedges
  - 'Realistic coastal wind climatology: 16 direction totals sum to 100%, smooth angular
    taper around a WSW prevailing wind, speed mix shifts toward stronger bins where
    frequency is higher'
  - Clean, deterministic, dependency-free code that follows the mount-node/animation
    contract correctly
  - Intercardinal direction-label fontsize bumped from 12px to 13px in this attempt,
    slightly improving balance against the 16px cardinal and 14px legend text
  weaknesses:
  - Entirely renderer-primitive implementation (chart.renderer.arc/circle/path/text)
    instead of native Highcharts series/axis/legend/tooltip components — necessary
    given the core-only bundle lacks polar support, but caps Library Mastery credit
  - The innermost 3% radial grid ring and its '3%' label sit at zIndex 1, below the
    stacked wedge arcs at zIndex 2, so the ring and label are painted over by data
    in nearly every sector except the one direction whose total happens to stay under
    3% — raise the ring/label zIndex above the arcs (or place the label at the angle
    of the smallest-total direction) so all four radial scale values stay legible
  - Intercardinal direction labels (13px) remain noticeably smaller than cardinal
    labels (16px) and legend text (14px) — legible but still slightly tight at small
    preview sizes
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Bold dark title "windrose-basic · javascript · highcharts · anyplot.ai" at the top, comfortably sized. 16 compass-direction labels ring the plot (N/E/S/W bold at 16px, intercardinals lighter at 13px). Radial grid rings labeled 6%/9%/12% in soft gray sit outside the data; the innermost 3% ring/label is hidden under the wedges in almost every sector. Legend below the plot shows 4 color chips (0-5, 5-10, 10-15, 15+ m/s) with dark, readable text.
      Data: Stacked polar wedges for all 16 directions ramp from brand green (#009E73, calm/innermost) through teal to blue (15+ m/s, outermost); wedges toward WSW/SW/W are clearly dominant, showing the prevailing wind.
      Legibility verdict: PASS (all title/label/tick/legend text is readable against the light background; only the occluded 3% ring label is a minor, non-blocking issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title and cardinal direction labels render in near-white/light ink; intercardinal and grid-ring percentage labels render in lighter gray — both legible. Grid rings/spokes are subtle thin light-gray lines. Legend chips and text at the bottom are legible in light gray.
      Data: Confirmed pixel-identical to the light render (green → teal → blue ramp) — only chrome flipped between themes.
      Legibility verdict: PASS (no dark-on-dark failures anywhere — title, direction labels, ring labels, and legend text are all light-colored on the dark surface).
