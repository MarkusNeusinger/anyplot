review:
  strengths:
  - 'Correct spec compliance: 16 direction sectors, 4 meaningful speed bins (0-5,
    5-10, 10-15, 15+ m/s), North at top, legend with speed-range colors, radial frequency-percentage
    axis'
  - 'Imprint sequential palette (`imprint_seq`, brand green -> blue) applied correctly
    for the continuous/ordinal speed-bin data, anchored at #009E73 for the calmest
    bin'
  - 'Theme-adaptive chrome is fully correct in both renders: background, title, tick
    labels, and grid all flip appropriately while the four data colors stay pixel-identical'
  - 'Clever technique: the static polar wedges are drawn with the SVG renderer, but
    a real, invisibly-marked scatter series is data-bound at the same coordinates,
    so the HTML output gets genuine hoverable tooltips despite the renderer-overlay
    approach'
  - 'Realistic, plausible coastal wind climatology: 16 direction totals sum to 100%,
    prevailing wind out of WSW with a smooth angular taper, and the speed-bin mix
    shifts toward stronger bins in the higher-frequency directions'
  - 'Clean, deterministic, dependency-free code that correctly follows the mount-node/animation
    contract (`animation: false`, no explicit width/height, `credits: false`)'
  weaknesses:
  - Implementation is built entirely from low-level `renderer.arc/circle/path/text`
    primitives rather than any native Highcharts series or component (axis, legend,
    tooltip are all hand-rolled) -- necessary given the core-only bundle has no polar
    support, but it caps idiomatic-usage credit
  - Intercardinal direction labels (NNE, ENE, ESE, ...) are set at 12px, noticeably
    smaller than the cardinal labels (16px bold) and the legend text (14px) -- still
    legible in both renders, but slightly tight at small preview sizes
  - Speed-bin color ramp goes brand-green -> blue (`imprint_seq`, per style guide)
    rather than the spec Notes' suggested meteorological cool-to-warm convention --
    this is the mandated platform behavior and not a defect, but flagged for visibility
    since it's an intentional deviation from the spec's own wording
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "windrose-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top, clearly readable. 16 compass-direction labels ring the plot (N/E/S/W bold and larger, intercardinals lighter/smaller). Radial grid rings labeled 6%/9%/12% in soft gray, subtle but visible against the light background. Legend below the plot with 4 color chips (0-5, 5-10, 10-15, 15+ m/s) and dark, readable text.
      Data: Stacked polar wedges for all 16 directions, colors ramping from brand green (#009E73, calm bin, innermost) through teal to blue (15+ m/s, outermost). Clear dominant wedges toward WSW/SW/W showing the prevailing wind. All text is readable against the light background -- no light-on-light issues observed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title and cardinal direction labels render in near-white/light ink, clearly legible. Intercardinal labels and grid-ring percentage labels render in a lighter gray, still readable against the dark background. Grid rings and spokes are subtle thin light-gray lines, visible without dominating. Legend text and chips at the bottom are legible with light gray text.
      Data: Same stacked-wedge geometry and identical data colors (green -> teal -> blue ramp) as the light render -- confirmed pixel-identical data colors, only chrome flipped. No dark-on-dark failures: no black/near-black text sits on the near-black background anywhere (title, cardinal labels, intercardinal labels, ring labels, and legend text are all light-colored).
      Legibility verdict: PASS
