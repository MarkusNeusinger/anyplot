review:
  strengths:
  - 'Correct meteorological convention: North at top, sectors offset by -pi/16 so
    compass labels align with sector centers rather than sector edges'
  - position_stack(reverse = TRUE) correctly orders speed bins with calm winds innermost
    and strong winds outermost, matching the spec's cool-to-strong convention
  - 'Clean theme_minimal execution: subtle gridlines (alpha 0.18), no panel border/ticks,
    generous margins, legend clearly separated below the plot'
  - Fully theme-adaptive chrome with data colors identical between light and dark
    renders (verified visually)
  - 'Realistic, well-scaled synthetic data: Weibull speed distribution, plausible
    SW-prevailing flow with variable background, n=4380 within the spec''s recommended
    500-50000 range'
  - tidyr::complete(sector, speed_bin) guarantees all 16x5 combinations exist even
    at zero count, avoiding missing-wedge artifacts in sparse directions
  weaknesses:
  - The 5-10 and 10-15 m/s speed-bin colors (interpolated stops from colorRampPalette(c('#009E73','#4467A3')))
    are visually close in hue/saturation, making adjacent stacked segments hard to
    distinguish in thin sectors — consider interpolating in a perceptual color space
    (e.g. via `colorspace::lighten`/HCL blending) or inserting a wider intermediate
    anchor so the 5 bins are more evenly discriminable.
  - Outermost speed bins (15-20, 20+) render as very thin rings in most non-prevailing
    directions, close to the edge of visibility at small sizes (confirmed tight-but-readable
    at the 400px thumbnail) — consider a minimum visible arc thickness or slightly
    heavier border stroke to keep them legible when scaled down.
  - Styling is professional and on-brand but doesn't go much beyond applying the required
    Imprint palette and theme_minimal defaults — e.g. an annotation calling out the
    dominant SW direction/frequency would strengthen the data storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "windrose-basic · r · ggplot2 · anyplot.ai" centered at top in dark ink, fully visible with clean margin above and below. 16 compass direction labels (N, NNE, NE, ... NNW) ring the plot in medium-gray text, all legible. Radial percentage ticks (0%, 5%, 10%, 15%, 20%) run along the W spoke in the same gray, subtle but readable. Legend "Wind Speed (m/s)" sits below the plot on an elevated off-white card with 5 labeled color swatches (0-5, 5-10, 10-15, 15-20, 20+), all text dark and legible.
      Data: Stacked polar bars per 16-sector compass direction, colors progressing from brand green (#009E73, calm/0-5) through teal shades to steel blue (strong/20+), calm innermost and strong outermost per position_stack(reverse=TRUE). A clear dominant SW/WSW/SSW lobe extends toward ~18-20%, with much smaller bars in all other directions — a realistic prevailing-wind pattern.
      Legibility verdict: PASS — all text (title, compass labels, radial ticks, legend) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title, compass labels, and radial ticks now rendered in light gray/off-white, clearly visible against the dark background. Legend card uses a slightly elevated dark surface with light gray text, fully readable.
      Data: Identical color progression and identical bar geometry to the light render — brand green innermost through steel blue outermost, same dominant SW/WSW/SSW lobe. Confirmed the data colors are unchanged between themes; only background/text/grid chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data segments are clearly distinguishable from the near-black background.
