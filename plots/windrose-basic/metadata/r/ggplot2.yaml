review:
  strengths:
  - 'Polar LCh (Lab-space) color interpolation properly fixes the attempt-1 VQ-04
    weakness: the 5-10 and 10-15 m/s speed bins are now clearly discriminable from
    each other and from their neighbors in both themes, instead of collapsing toward
    a muddy middle hue'
  - 'Correct meteorological convention: North at top, sectors offset by -pi/16 so
    compass labels align with sector centers rather than edges'
  - position_stack(reverse = TRUE) correctly orders speed bins with calm winds innermost
    and strong winds outermost, matching the spec's cool-to-strong convention
  - Fully theme-adaptive chrome with data colors verified identical between light
    and dark renders
  - 'Realistic, well-scaled synthetic data: Weibull speed distribution, plausible
    SW-prevailing flow with variable background, n=4380 within the spec''s recommended
    500-50000 range'
  - tidyr::complete(sector, speed_bin) guarantees all 16x5 combinations exist even
    at zero count, avoiding missing-wedge artifacts
  weaknesses:
  - Low-magnitude sectors (N, NNE, NE, ENE, ESE, SE, SSE, NNW) still render as extremely
    thin arc slivers, especially their outer speed-bin segments — near the edge of
    visibility at mobile widths despite the improved color separation. Not addressed
    by this repair pass; consider a minimum visible arc angle/stroke for near-zero
    segments so 'present but rare' reads clearly distinct from 'absent'.
  - No annotation or callout marks the dominant SW/WSW/SSW direction — data storytelling
    still relies solely on implicit color/size cues, carried over unaddressed from
    the attempt-1 feedback.
  - Styling is professional and on-brand (custom LCh color engineering is a genuine
    plus) but the overall layout/typography is largely unchanged from attempt 1 —
    still reads as 'well-executed default' rather than a visually distinctive composition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "windrose-basic · r · ggplot2 · anyplot.ai" centered at top in dark ink, fully visible with clean margin above and below, spans roughly half the plot width. 16 compass direction labels (N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW, SW, WSW, W, WNW, NW, NNW) ring the plot in medium-gray text, all legible and non-overlapping. Radial percentage ticks (0%, 5%, 10%, 15%, 20%) run along the W spoke in the same gray, subtle but readable against the cream background. Legend "Wind Speed (m/s)" sits below the plot on a slightly elevated off-white card with 5 labeled color swatches (0-5, 5-10, 10-15, 15-20, 20+), all text dark and legible.
      Data: Stacked polar bars per 16-sector compass direction. Colors progress from brand green (#009E73, calm/0-5) through teal and cyan-blue shades to a slate blue (strong/20+), calm innermost and strong outermost per position_stack(reverse=TRUE). The perceptual (LCh) interpolation now keeps the 5-10 and 10-15 m/s stops visually distinct from each other, an improvement over the earlier RGB-blend version. A clear dominant SW/WSW/SSW lobe extends to roughly 18-20%, while most other directions (N, NNE, NE, ENE, ESE, SE, SSE, NNW) show only thin slivers near the center that are difficult to make out at small sizes.
      Legibility verdict: PASS — all text (title, compass labels, radial ticks, legend) reads clearly against the light background; no light-on-light issues. Element visibility of the smallest sectors is a lingering, non-text weakness (see VQ-03).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title, compass labels, and radial ticks now rendered in light gray/off-white, clearly visible against the dark background. Legend card uses a slightly elevated dark surface with light gray text, fully readable. No dark-on-dark text was found.
      Data: Identical color progression and identical bar geometry to the light render — brand green innermost through slate blue outermost, same dominant SW/WSW/SSW lobe, same thin slivers in low-frequency sectors. Confirmed the data colors are unchanged between themes; only background/text/grid chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data segments are as distinguishable from the near-black background as their light-theme counterparts.
