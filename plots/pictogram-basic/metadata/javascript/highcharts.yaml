review:
  strengths:
  - Clever scatter + dataLabels technique produces authentic pictogram/isotype icons
    using only the core Highcharts bundle, since the add-on pictogram module isn't
    loaded
  - Partial-icon fractional remainders are rendered via reduced dataLabel opacity
    plus an ink-color textOutline stroke, keeping faint partial icons visible against
    the light background
  - Category labels embed both name and value+unit ("Apples — 47k t"), doubling as
    descriptive axis labels without a separate legend
  - Alternating row plotBands add subtle visual rhythm beyond icon count/opacity,
    without competing with the data
  - Data sorted descending with a larger dataLabel font on the top category creates
    a clear visual hierarchy / focal point
  - Correct Imprint palette in canonical order with brand green as the first series;
    chrome (background, text, grid) is theme-correct in both light and dark renders
  - Clean, deterministic, KISS-structured code with no imports needed and animation
    disabled per the harness contract
  weaknesses:
  - 'Header comment block is missing the required `// License: Highcharts — commercial
    license, free for non-commercial use (highcharts.com/license)` line mandated by
    prompts/library/highcharts.md for every Highcharts snippet — restore it.'
  - Partial-icon opacity formula (0.45 + 0.15 × remainder) compresses to a narrow
    0.48–0.57 range across all rows, so a 20%-full icon and an 80%-full icon look
    almost identical — widen the range (e.g. 0.25 + 0.65 × remainder) so fractional
    magnitude reads more clearly at a glance.
  - Icon dataLabel sizing is comparatively modest for such sparse rows (max 10 icons
    per category); per the data-density heuristic (<50 points → larger, prominent
    markers) a slightly larger font would give the icons more pictogram-like visual
    weight.
  - No per-category icon differentiation beyond color (spec explicitly allows a single
    default icon type, so this is acceptable, but distinct icon glyphs per fruit would
    strengthen the isotype metaphor further — optional enhancement, not a requirement).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "pictogram-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top, clearly legible. Category labels ("Apples — 47k t", "Bananas — 38k t", "Oranges — 29k t", "Grapes — 21k t", "Strawberries — 14k t") on the left in soft dark gray, all readable. Caption at bottom-left ("Each ● represents 5,000 tons of annual fruit production") in smaller soft-gray italic-weight text, readable. Alternating light-grey plotBands behind the Bananas and Grapes rows for rhythm.
      Data: Each category is a left-aligned row of colored dot icons (●), one dot per 5k tons, with a final partially-transparent dot for the fractional remainder plus a thin dark outline for contrast. Apples = brand green (#009E73, first series), Bananas = lavender, Oranges = blue, Grapes = ochre, Strawberries = matte red — canonical Imprint palette order.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now rendered in light/off-white ink, clearly legible. Category labels rendered in light soft-gray, fully readable. Caption text also light-colored and legible. plotBands now render as a slightly lighter dark-grey band, still subtle.
      Data: Same dot-icon layout and counts as the light render. Colors are pixel-identical to the light render (green/lavender/blue/ochre/red) — only the chrome (background, text, band fill) flipped to the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures; all title/label/caption text is clearly visible against the near-black background, and the brand green remains vivid on both surfaces.
