review:
  strengths:
  - Mandated title renders exactly as `pictogram-basic · javascript · highcharts ·
    anyplot.ai` and is fully legible in both themes with no clipping.
  - Rows are sorted descending by value and left-aligned, so icon-row length doubles
    as a ranking story (Apples > Bananas > Oranges > Grapes > Strawberries) without
    any extra chrome.
  - Caption clearly states the icon-to-unit mapping (`Each ● represents 5,000 tons
    of annual fruit production`), satisfying the spec's legend requirement.
  - 'First series correctly uses Imprint brand green #009E73; all five category colors
    are identical between plot-light.png and plot-dark.png — only chrome (background,
    text) flips.'
  - Code is dependency-free, deterministic (hardcoded data, no RNG needed), and contains
    no fake interactivity.
  weaknesses:
  - Partial-icon opacity formula `0.3 + 0.7 * remainder` compresses high remainders
    toward full opacity (e.g. remainder=0.8 -> opacity=0.86), making large partial
    icons nearly indistinguishable from full icons at a glance — widen the mapping
    (e.g. cap partial opacity at ~0.6) or switch to a more literal partial-fill technique
    (half-circle wedge, smaller radius) so fractional icons read unambiguously.
  - 'In plot-light.png, the trailing partial icon on the Apples row (opacity 0.58,
    brand green) visually blends into the #FAF8F1 background and is hard to notice
    without close inspection — increase the minimum opacity floor or add a thin ink-colored
    stroke to partial icons so they stay visible in the light theme.'
  - The `buildIcons()` helper function breaks the flat Imports -> Data -> Plot ->
    Save script structure the KISS criterion expects — inline the full/remainder math
    into the row-mapping expression instead of a named function.
  - Design is a plain dot-grid with no additional visual hierarchy beyond icon count/opacity
    — consider a subtle per-row value label, alternating row background banding, or
    emphasis on the top category to lift aesthetic sophistication and visual refinement.
  - Using Highcharts scatter + dataLabels formatted as a bullet character is a reasonable
    workaround for the missing native pictogram type, but is generic rather than distinctive
    to Highcharts — consider leveraging Highcharts-specific features (e.g. per-point
    data label formatter callbacks, bubble sizing) for stronger Library Mastery credit.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "pictogram-basic · javascript · highcharts · anyplot.ai" in bold dark ink at top, clearly readable. Five row labels on the left ("Apples — 47k t", "Bananas — 38k t", "Oranges — 29k t", "Grapes — 21k t", "Strawberries — 14k t") in soft dark gray, all legible. Caption at bottom-left in smaller soft-gray text explains the icon unit. No axis lines, ticks, or grid — intentionally minimal chrome.
      Data: Each row is a horizontal line of filled circles in a single Imprint color per category (green for Apples, lavender for Bananas, blue for Oranges, ochre for Grapes, red for Strawberries), representing whole units, with one fainter (partially transparent) circle at the end of each row representing the fractional remainder. The Apples row's final partial circle (very light green) is noticeably faint against the cream background — borderline hard to notice at a glance.
      Legibility verdict: PASS (all text readable; the one faint partial-icon is a visibility nit, not a text-legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and row labels render in light ink/off-white tones, clearly readable against the dark background — no dark-on-dark text anywhere. Caption remains legible in muted light gray.
      Data: Same five Imprint colors as the light render, confirmed identical (green, lavender, blue, ochre, red) — only the chrome (background/text) flipped. The partial icons are actually easier to spot in this theme since the reduced-opacity dot still contrasts against the dark surface more evenly than against the light surface.
      Legibility verdict: PASS (all text and data elements clearly readable, no dark-on-dark failures).
