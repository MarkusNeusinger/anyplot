review:
  strengths:
  - 'Clever, correct pictogram construction: circles are rendered via a custom MUI
    X scatter slot with a clipPath-based partial-fill technique for fractional remainders,
    matching the spec''s ''partial icons represent fractional remainders'' requirement
    precisely.'
  - Exact per-category values ('35 t', '22 t', ...) are aligned in a clean right-hand
    column, plus a legend subtitle stating the icon-to-unit ratio ('● = 5 tons of
    fruit'), satisfying the spec's unit-legend requirement.
  - 'Theme handling is clean: icons are identical brand green (#009E73) in both renders,
    and title/labels/background are correctly theme-adaptive with no dark-on-dark
    or light-on-light failures.'
  - Rows are left-aligned per category exactly as the spec requests, mirroring a horizontal
    bar chart layout with category labels on the y-axis and no unnecessary x-axis
    chrome.
  weaknesses:
  - Missing `skipAnimation` prop on <ScatterChart> — prompts/library/muix.md mandates
    it on every chart component as a second belt against mid-tween screenshots; relying
    solely on the harness's prefers-reduced-motion emulation is a spec violation even
    though this run happened to render cleanly.
  - Legend indicator '●' in the subtitle ('● = 5 tons of fruit') is rendered in the
    muted secondary ink color instead of the brand green (#009E73) used for the actual
    icons — the bullet glyph doesn't visually match what it explains.
  - Categories are not sorted by value (Apples 35, Oranges 22, Bananas 18, Mangoes
    27, Grapes 14) — sorting descending would strengthen the at-a-glance comparison
    typical of ISOTYPE-style pictograms.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Title "Weekly Fruit Harvest · pictogram-basic · javascript · muix · anyplot.ai" in bold dark ink, centered at top; subtitle "● = 5 tons of fruit" in muted gray beneath it; category labels (Apples, Oranges, Bananas, Mangoes, Grapes) on a thin left-hand axis line; per-row value labels ("35 t", "22 t", "18 t", "27 t", "14 t") aligned in a right-hand column. All text is dark on the light surface and clearly readable.
      Data: Five rows of brand-green (#009E73) filled circles, one circle per 5 tons, with a clipped partial circle (outlined remainder) representing the fractional leftover for Oranges, Bananas, Mangoes, and Grapes. Rows are left-aligned for easy row-to-row comparison, matching a horizontal-bar-chart layout.
      Legibility verdict: PASS — no overlap, no clipping, all text crisp against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Same title and subtitle layout, now in light ink (#F0EFE8 title / lighter gray subtitle) against the dark surface; category and value labels are light-colored and fully legible; the thin y-axis line is visible but subtle.
      Data: Icons are the identical brand green (#009E73) as the light render — confirmed unchanged data color, only chrome flipped. Partial-icon outlines remain visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark text, no unreadable elements; all chrome correctly inverted for the dark surface.
