review:
  strengths:
  - 'Uses MUI X''s composition API the way it is meant to be used: ChartsContainer
    with a band y-axis (''fruit'') and a hidden linear x-axis (''slots''), with custom
    SVG icon marks placed through the useYScale and useDrawingArea hooks inside the
    container, so rows follow the library''s own band layout.'
  - Partial icons are a full-size outline ring with a fill clipped in proportion to
    the remainder, so 4.4, 3.6, 5.4 and 2.8 icons read as part of one icon rather
    than a smaller whole one.
  - The icon value is derived from the data (the smallest nice step that keeps the
    longest row within 8 icons), so the legend's '= 5 tons' and the row lengths stay
    consistent when the data block is replaced.
  - The legend uses the same green circle as the rows, in inkSoft text below the ink
    title, which keeps a clear hierarchy in both themes.
  - 'Value axis, ticks and axis line are dropped (disableTicks/disableLine, position:
    ''none''), as the spec permits, so the icon count carries the value.'
  weaknesses:
  - 'Suggestion: sorting the rows by harvest (Apples, Mangoes, Oranges, Bananas, Grapes)
    would let row lengths compare like a ranked bar chart.'
  - 'Suggestion: the 140 px y-axis band leaves a wide gap between the ''Fruit'' axis
    title and the category labels; a narrower band would tie them together.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "Weekly Fruit Harvest · pictogram-basic · javascript · muix · anyplot.ai" centred at the top (~45 % of the width); below it a legend line with a green circle "= 5 tons · a cut icon shows the remainder" in a softer grey ink; category labels Apples, Oranges, Bananas, Mangoes, Grapes right-aligned on the left in dark ink, with the rotated axis title "Fruit" at the far left. There is no value axis, ticks or grid, as the spec permits.
      Data: five rows of large brand-green (#009E73) circles, all one size and left-aligned at one pitch: Apples 7 full; Oranges 4 full plus one ~40 % cut icon; Bananas 3 plus ~60 %; Mangoes 5 plus ~40 %; Grapes 2 plus ~80 %. Each partial icon is a green outline ring with a fill clipped from the left. The longest row reaches near the right edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and category labels in light ink, legend text in a lighter grey, axis title "Fruit" in light ink; no dark-on-dark text anywhere.
      Data: identical #009E73 circles and counts as the light render; the partial-icon outline rings render as a dimmer green on the dark page but stay clearly visible, and the unfilled part shows the page color.
      Legibility verdict: PASS
