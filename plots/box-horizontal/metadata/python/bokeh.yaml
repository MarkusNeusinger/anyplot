review:
  strengths:
  - 'Clean ColumnDataSource-driven layout: one hbar call each draws all boxes, whiskers,
    caps and medians from a single box-statistics frame, with the category column
    on a FactorRange y axis'
  - Median line drawn in the theme-adaptive INK token, so it reads as near-black on
    the green box in light mode and near-white in dark mode
  - Categories sorted by median, so the five services step up from Cache Layer to
    File Storage along one shared value axis
  - Outliers computed from the 1.5 × IQR fences and plotted at their exact values,
    with whiskers ending at the furthest in-fence observation
  - Text sized for the 3200 × 1800 canvas (50 pt title, 42 pt axis titles, 34 pt ticks);
    fully legible in both themes
  - Realistic, neutral scenario (service response times in ms) with deterministic
    data via np.random.seed(42)
  weaknesses:
  - 'Suggestion: a HoverTool on the boxes showing Q1, median, Q3 and whisker ends
    would add value to the interactive HTML view.'
  - 'Suggestion: varying the whisker and outline weight slightly below the box edge
    would give the boxes more visual hierarchy over the whiskers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area; 3200x1800.
      Chrome: title "box-horizontal · python · bokeh · anyplot.ai" in bold dark ink top-left; x-axis "Response time (ms)" with ticks 0–300, y-axis "Service type" with five horizontal category labels in dark grey; subtle vertical x-grid only; thin INK_SOFT frame. All text readable.
      Data: five horizontal boxes in #009E73 (alpha 0.75) with dark grey outline, near-black median lines, dark grey whiskers with caps; outliers as green circles (Cache Layer 1 low, API Gateway 1 high, Authentication 4 high, Database Query 1 low + 2 high). Sorted by median from Cache Layer (bottom) to File Storage (top).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles in light ink, tick labels in light grey; grid faint but visible; no dark-on-dark text.
      Data: same #009E73 boxes and outliers as the light render (identical hue); median lines flip to near-white and whiskers/outlines to light grey, as theme chrome should.
      Legibility verdict: PASS
