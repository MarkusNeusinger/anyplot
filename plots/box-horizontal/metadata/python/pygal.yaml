review:
  strengths:
  - 'Theme tokens threaded through Style: correct backgrounds and readable text colors
    in both renders'
  - 'Imprint palette with #009E73 first'
  - Native box_mode='tukey' computes quartiles and whiskers
  - Plausible, neutral salary-by-job-title data, seeded
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2700 and two quartile boxes run past the bottom
    canvas edge → 3200x1800 with every box inside the plot area. Likely cause: width=4800,
    height=2700 and the untransposed box rects.'
  - 'VQ-01 (both): title 28 px, ticks 18 px and legend 16 px on a 4800 px canvas read
    tiny → the style guide''s 66/56/44/44 px on a 3200 px canvas. Likely cause: the
    Style font sizes.'
  - 'VQ-02 (both): all five quartile boxes pile onto the bottom Software Engineer
    row and cover the x tick labels around 0-100000 → one box per category row, clear
    of the axis. Likely cause: HorizontalGraph transposes pygal''s lines but not the
    box rect nodes.'
  - 'VQ-03 (both): the legend sits as a tiny list in the top-left corner and the boxes
    are detached from their whiskers → boxes drawn with their whiskers and a legend
    at the style-guide size. Likely cause: untransposed rects and legend_font_size=16.'
  - 'SC-01 (both): the quartile boxes are not drawn horizontally on their categories,
    so the chart does not read as a horizontal box plot → each rect transposed onto
    its category row. Likely cause: the bare type(''HorizontalBox'', (HorizontalGraph,
    Box), {}) mixin.'
  - 'SC-02 (both): C2 missed — no box spans Q1-Q3 around its median, and outlier circles
    sit off their rows → boxes around the medians, outliers at their values on their
    rows. Likely cause: rect and circle coordinates not swapped.'
  - 'SC-03 (both): the value axis is forced to start at 0 and the boxes sit at wrong
    salary values (one at 0-25000) → a shared axis around the data range (about 60k-220k)
    with each box at its quartiles. Likely cause: Box''s zero default and the untransposed
    rects.'
  - 'SC-04 (both): the title reads ''box-horizontal · pygal · anyplot.ai'' without
    the language segment and the legend truncates ''Software Engin…'' → ''box-horizontal
    · python · pygal · anyplot.ai'' and full legend labels. Likely cause: the title
    string and the narrow top-left legend column.'
  - 'CQ-01 (code): a type()-built HorizontalBox class breaks the flat Imports → Data
    → Plot → Save structure → no class in the script beyond what pygal needs. Likely
    cause: pygal ships no HorizontalBox.'
  - 'LM-01 (code): HorizontalGraph is mixed into Box without handling the rect and
    circle nodes it does not transpose, which produces the broken render → transpose
    those nodes or use a pygal pattern that renders horizontally. Likely cause: the
    empty attribute dict of the type() call.'
  - 'Suggestion: sorting the categories by median would make the ranking read at a
    glance.'
