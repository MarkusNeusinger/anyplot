  strengths:
  - Single ax.boxplot call styles every artist through the *props dicts with patch_artist,
    using the current orientation='horizontal' and tick_labels API
  - Median line drawn in the INK token, so it reads against the green box in both
    themes (black on light, near-white on dark)
