review:
  strengths:
  - 'Native Chart.js has no boxplot type, so the implementation cleverly uses a floating
    bar (data: [q1, q3]) for the IQR box plus an afterDatasetsDraw plugin drawing
    whiskers, caps, a median divider, and per-row outlier points directly on the canvas
    — a genuinely idiomatic use of the Chart.js plugin API'
  - 'Correct box-plot statistics: proper quantile interpolation, IQR-fence outlier
    detection (1.5*IQR), and whisker endpoints computed from the in-range data rather
    than raw min/max'
  - Categories are sorted ascending by median per the spec's own suggestion, creating
    a clear visual hierarchy from fastest to slowest endpoint
  - Data colors are identical between light and dark renders; only chrome (background,
    grid, text) adapts, matching the Imprint theme-adaptive chrome rules
  - x-axis max is computed with headroom above the largest outlier so no data point
    is clipped, and axis labels carry units (Response Time (ms))
  - Realistic, neutral dataset (API endpoint response-time distributions) with plausible
    per-endpoint means/variances and appropriately-sized samples (45-70 per endpoint)
  weaknesses:
  - Whisker caps (capHalf = bar.height * 0.3) render fairly thin/small relative to
    the box height in both renders — slightly more prominent caps would improve element
    visibility (VQ-03) at a glance
  - Design polish (spine handling, grid subtlety) is solid but fairly close to library
    defaults beyond the custom plugin work — a touch more visual refinement (e.g.
    slightly softer grid, more generous inter-category spacing) would push Design
    Excellence further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-horizontal · javascript · chartjs · anyplot.ai" is bold dark ink, clearly legible; x-axis title "Response Time (ms)" and y-axis title "Endpoint" are dark ink and legible; tick labels (category names on y-axis, numeric ticks on x-axis) are soft dark gray and clearly readable against the light background; a subtle vertical gridline exists at each x tick.
      Data: Six horizontal box-and-whisker rows, one per endpoint, sorted by ascending median (User Authentication API fastest at top, Legacy Report Generation slowest at bottom). Each box uses a distinct Imprint palette color (green, lavender, blue, ochre, red, cyan) with a black outline, a background-colored vertical divider marking the median inside the box, black whiskers with end caps, and colored outlier dots with a light stroke. First box (User Authentication API) is Imprint brand green #009E73, matching the "first series always green" rule.
      Legibility verdict: PASS — no text is light-on-light; all chrome elements are clearly visible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all switch to light ink/off-white tones and remain fully legible against the dark surface; whisker/median strokes switch appropriately (median divider now dark background color, whiskers now white/light for contrast) with no dark-on-dark elements.
      Data: Same six rows in the same order, with box and outlier colors identical to the light render (green, lavender, blue, ochre, red, cyan) — confirming the categorical data palette is theme-invariant while chrome flips.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black background.
