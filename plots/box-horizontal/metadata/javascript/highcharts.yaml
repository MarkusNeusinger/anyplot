review:
  strengths:
  - 'Elegant technical workaround for the core bundle''s missing boxplot series: two
    stacked bar series (invisible floor + colored IQR box) plus two null-separated
    line series for whiskers/median, layered by series order so the median mark sits
    on top of the box fill.'
  - Categories sorted by descending median (per the spec's ordering note) with a dashed
    org-wide median reference line and inline label, giving the chart an immediate,
    clear insight — which roles sit above/below the typical salary — rather than a
    flat data dump.
  - Categorical colors follow the canonical Imprint order exactly (green, lavender,
    blue, ochre, matte red, cyan, rose) across all 7 categories, identical between
    light and dark renders; outlier markers reuse each row's series color for visual
    consistency.
  - 'Both renders are pixel-verified theme-correct: light background samples exactly
    #FAF8F1, dark background samples exactly #1A1A17, with no edge clipping on title
    or axis labels.'
  - Deterministic LCG-seeded data generation produces realistic, varied salary distributions
    (different spreads, some categories with outliers and some without) for a neutral,
    plausible business scenario.
  - Custom tooltip pointFormatter surfaces the full five-number summary (min/Q1/median/Q3/max)
    per category — a distinctive, Highcharts-idiomatic touch that adds real value
    in the HTML detail view.
  weaknesses:
  - Minor unused whitespace on the right side of the value axis (data maxes out around
    $265K but the axis extends to $300K) — a tighter maxPadding or explicit max would
    tighten canvas utilization slightly.
  - Several small pure helper functions (lcg, randNormal, quartile, boxStats) sit
    above the chart config rather than a flatter linear script — necessary for the
    statistical computation a box plot requires, but a stricter KISS reading would
    inline more of this.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled exactly #FAF8F1 (250,248,241) in all four corners — matches the light chrome spec.
      Chrome: Title "box-horizontal · javascript · highcharts · anyplot.ai" in bold dark ink at top, fully visible (first non-background pixel row 22, no top clipping). Seven long job-title category labels ("VP of Engineering" ... "Junior Financial Analyst") run down the left y-axis in dark ink, all fully legible with no truncation or overlap. X-axis is labeled "0K"–"300K" with the axis title "Annual Salary ($K)" below it in medium-gray ink. A dashed vertical reference line reads "Org-wide median: $105K" near the top of the plot, clear of the boxes. Subtle vertical gridlines are visible but unobtrusive.
      Data: Seven horizontal box-and-whisker rows, one per role, colored in canonical Imprint order top-to-bottom — brand green, lavender, blue, ochre, matte red, cyan, rose — each with a white median tick, thin whisker lines with end caps, and colored outlier dots (radius ~6.5px) with a light outline for contrast (Data Science Team Lead, Senior Software Engineer, and Customer Success Associate each show one or two outliers). First series (VP of Engineering) is #009E73 as required.
      Legibility verdict: PASS — all text (title, category labels, tick labels, axis title, reference-line annotation) is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled exactly #1A1A17 (26,26,23) in all four corners — matches the dark chrome spec.
      Chrome: Same layout as the light render with all chrome flipped to light-colored ink — white/light-gray title, category labels, tick labels, axis title, and the dashed reference-line label, all clearly legible. Gridlines are subtle light gray, visible but not dominant.
      Data: Box colors, outlier colors, and box ordering are pixel-identical to the light render (green, lavender, blue, ochre, matte red, cyan, rose in the same canonical order) — only the chrome (background, text, grid) flipped, as required. First series is still #009E73.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, axis labels, ticks, annotation) reads clearly against the #1A1A17 background.
