review:
  strengths:
  - 'Clever, well-documented workaround for the missing core-bundle boxplot series:
    an invisible floor bar up to Q1, a visible IQR box, a null-separated whisker/cap
    line series, and a page-bg-colored median line layered on top for a clean notch
    effect.'
  - 'Correct Imprint palette usage — first series (VP of Engineering) is #009E73,
    remaining categories follow canonical positions 2-7 in order, identical across
    light/dark renders.'
  - Categories sorted by descending median per the spec's own suggestion, giving the
    chart a clear, readable visual hierarchy (highest-paid role reads first).
  - Theme-adaptive chrome is fully threaded through (ink/inkSoft/grid tokens, transparent
    chart background), with subtle vertical-only gridlines appropriate for a value
    x-axis.
  - Rich native tooltip content (full box-stats breakdown per category, distinct outlier
    tooltip) adds real value in the HTML detail view without needing to be visible
    in the static PNG.
  - Deterministic LCG-seeded data generation with a realistic, neutral salary-by-job-title
    dataset and plausible value ranges.
  - No AR-08/AR-09 violations — long category labels (the whole point of a horizontal
    box plot) and title are fully visible with no clipping in either render.
  weaknesses:
  - 'Outlier markers (marker.radius: 4.5 in mount-space CSS px) read as small, faint
    dots relative to the box sizes — given the very sparse per-category outlier count
    (1-2 points), increase to ~6-7 for better prominence per the data-density heuristic.'
  - 'Design Excellence is solid but not exceptional: the per-row coloring and sort-by-median
    give some hierarchy, but there''s no additional storytelling device (e.g. a reference
    line for the overall median salary, or a callout highlighting the highest/lowest
    paid role) to sharpen the focal point.'
  - Four small helper functions (lcg, randNormal, quartile, boxStats) add more structure
    than a typical KISS one-shot script — justified by the need to compute box statistics
    client-side, but keep an eye on further growth.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-horizontal · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible at top-center. Y-axis category labels (job titles: VP of Engineering, Data Science Team Lead, Senior Software Engineer, Product Marketing Manager, UX Research Specialist, Customer Success Associate, Junior Financial Analyst) are dark, fully legible, and not clipped despite being long strings. X-axis "Annual Salary ($K)" title and tick labels (0K-300K) are soft dark gray, clearly readable. Vertical gridlines are subtle and don't compete with data.
      Data: Seven horizontal boxes, one per category, each a distinct Imprint palette color starting with brand green (#009E73) for VP of Engineering, followed by lavender, blue, ochre, matte red, cyan, and rose in canonical order. Each box shows a light/near-background colored median line, whisker caps extending to 1.5*IQR fences, and small outlier dots for the two categories that have them (Data Science Team Lead, Senior Software Engineer, Customer Success Associate).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, y-axis category labels, x-axis title, and tick labels all render in light ink/inkSoft tones and remain fully legible against the dark background. No dark-on-dark text was observed anywhere (titles, ticks, and category labels are all clearly lighter than the surface).
      Data: Same seven Imprint palette colors as the light render, unchanged (green, lavender, blue, ochre, matte red, cyan, rose) — confirms the categorical data colors are identical across themes and only chrome flipped. The median line (drawn in the page-background color) now appears as a dark notch inside each box, mirroring the light render's effect.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures detected.
