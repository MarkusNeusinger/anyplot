review:
  strengths:
  - Categories sorted ascending by median (per the spec's own suggestion), so the
    fastest services read at the top and latency risk increases down the chart — a
    genuine readability win over an unsorted list
  - 'Correct statistics: Q1/median/Q3 via d3.quantile, whiskers computed as 1.5×IQR
    fences with points outside classified as outliers and drawn separately'
  - Deterministic mulberry32 PRNG + Box-Muller normal sampler gives fully reproducible
    per-service distributions without any external dependency
  - Idiomatic D3 v7 join pattern throughout (selectAll(...).data(...).join("g")),
    including a nested join for per-group outlier circles
  - 'Realistic, varied dataset: six services with escalating mean/spread (Image CDN
    ~42ms to Recommendation Engine ~218ms) and outliers concentrated on the higher-latency,
    higher-variance services — matches how real API latency tails behave'
  weaknesses:
  - 'VQ-07: The box body uses fill-opacity 0.72 on top of the theme page background,
    so the composited box color is a noticeably lighter mint-green on the light render
    (#FAF8F1 backdrop) versus a noticeably deeper forest-green on the dark render
    (#1A1A17 backdrop) — even though the underlying fill token (t.palette[0]) and
    stroke are identical in both. Raise fill-opacity closer to 1 (or pre-mix a fixed
    opaque tint) so the box reads as the same green regardless of theme, keeping only
    chrome theme-adaptive.'
  - 'DE-02: The x-axis still draws default d3.axisBottom tick marks (small perpendicular
    lines in t.inkSoft) even though the y-axis already has its tick lines removed
    (yAxis.selectAll("line").remove()) — remove the x-axis tick lines too (keep only
    the tick labels and the gridline layer) for a cleaner, more consistent, decoration-free
    look.'
  - 'LM-02: The implementation is solid but the box-from-primitives technique (manual
    rect/line marks driven by computed quantiles) is generic and could be replicated
    in any SVG-capable library with only minor syntax changes. Consider leaning further
    into a genuinely D3-specific feature (e.g. d3.brush for a coordinated range-selection
    affordance in the accompanying HTML, since interactivity is fair game there) to
    raise distinctiveness beyond the current baseline.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "box-horizontal · javascript · d3 · anyplot.ai" centered at top, clearly readable against the light background. Y-axis category labels (Image CDN, Auth Service, Notification Queue, Payment Gateway, Search API, Recommendation Engine, sorted ascending by median) render in a dark ink-soft tone, fully legible. X-axis tick labels ("0 ms" … "800 ms") and the "Response Time (ms)" axis label are dark and legible. Subtle light-gray vertical gridlines at each 100ms tick, visible but not competing with the data.
      Data: Six horizontal boxes in brand green (#009E73 stroke, translucent fill), a solid dark median line inside each box, thin whisker lines with end caps, and green outlier dots (visible on Notification Queue, Payment Gateway, Search API, Recommendation Engine) with a light ring matching the page background for separation from the box/whisker lines behind them.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, y-axis category labels, x-axis tick labels, and the "Response Time (ms)" label all render in light/white tones, clearly legible against the dark background. Gridlines are subtle light lines at low opacity, visible but unobtrusive. No dark-on-dark text anywhere.
      Data: Same six services in the same order, same green (#009E73) stroke and outlier dots — the outlier rings now match the dark page background instead of light. The median line renders as a light/white line (theme-adaptive ink) inside each box, still clearly distinguishable from the box body. One notable difference from the light render: the box body's composited fill looks like a visibly deeper, more saturated forest-green than the lighter mint-green fill seen on the light render — an artifact of the 0.72 fill-opacity compositing against a much darker backdrop, not a change in the underlying color token.
      Legibility verdict: PASS — all text is fully readable against the dark background; only the box interior fill tone (not the stroke/median/outliers) shifts visibly between themes, which is a VQ-07 note rather than a legibility failure.
