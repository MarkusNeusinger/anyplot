review:
  strengths:
  - 'Correct Imprint palette application: the first category (Customer Support Representative,
    lowest median) renders in brand green #009E73, and the remaining five categories
    follow canonical positions 2–6 in order.'
  - Theme-adaptive chrome is fully correct in both renders — no dark-on-dark or light-on-light
    failures; background, grid, and text all match the required tokens.
  - Categories are sorted ascending by median per the spec's explicit guidance, making
    cross-group comparison immediate.
  - Distinctive hollow-box styling (elevated-surface fill + colored 3px border) reads
    as a deliberate design choice rather than a library-default filled box.
  - Deterministic LCG-seeded data generation with varied group sizes/std and multiple
    genuine outliers demonstrates full boxplot feature coverage (different spreads
    AND outliers) in a realistic salary-by-role scenario.
  - Canvas dimension gate passed; mandated title format exact; mount-node contract
    (animation:false, no explicit init size/devicePixelRatio) followed correctly.
  weaknesses:
  - 'LM-01: Quartiles/outliers are computed manually (percentile() + IQR filtering)
    instead of using ECharts'' built-in echarts.dataTool.prepareBoxplotData() helper,
    the library-recommended pattern for boxplot series — switching would drop the
    custom statistics code and be more idiomatic.'
  - 'LM-02: The boxplot+scatter-outlier overlay is the standard documented ECharts
    boxplot pattern rather than something distinctive to this library — consider a
    more distinctive touch, e.g. a markLine for the overall median or a richer tooltip/visualMap
    visible in the HTML export.'
  - 'DE-03: Visual hierarchy currently comes mostly from the spec-mandated median
    sort; consider an explicit callout (markLine/markPoint) labeling the highest-paid
    role or largest spread to push storytelling beyond the baseline sort.'
  - 'VQ-05/VQ-03 (minor): the single Software Engineer outlier (~$214k) stretches
    the x-axis out to 250, leaving a fairly empty band from ~170–250 on both renders
    — consider whether that trade-off is worth it or whether a tighter axis max would
    improve canvas utilization.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "box-horizontal · javascript · echarts · anyplot.ai" in dark ink, centered, clearly legible. X-axis title "Annual Salary ($1,000s)" and tick labels (0/50/100/150/200/250) in soft dark gray, fully readable. Y-axis category labels (job titles, longest is "Customer Support Representative") render in soft dark gray, fully readable and not truncated. Vertical gridlines are faint and unobtrusive; axis lines/tick marks are hidden (minimal-chrome look).
      Data: Six horizontal boxes, one per job title, sorted ascending by median salary bottom-to-top. Box fill is the light elevated surface color with a 3px colored border; whisker caps and median line share the border color. Outlier points appear as filled colored dots for Customer Support Representative, UX Researcher, and Product Manager. Colors follow Imprint canonical order: green (Customer Support Rep, bottom/lowest), lavender (Marketing Specialist), blue (UX Researcher), ochre (Data Scientist), red (Product Manager), cyan (Software Engineer, top/highest). First series is #009E73 as required.
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlap between any text or data elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis title, and tick/category labels all render in light ink/soft-light gray, clearly legible against the dark background — no dark-on-dark failures anywhere. Gridlines remain faint and unobtrusive.
      Data: Identical box positions, widths, and outlier placements as the light render. Box fill switches to the dark elevated surface color while the colored borders stay pixel-identical to the light render (green #009E73, lavender, blue, ochre, red, cyan) — confirms data colors are constant across themes and only chrome flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark or light-on-light issues detected.
