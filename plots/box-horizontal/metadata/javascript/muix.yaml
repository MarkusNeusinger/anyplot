review:
  strengths:
  - Uses MUI X composition (ChartsContainer + useXScale/useYScale hooks) to draw box-and-whisker
    marks on the library's own band and linear scales, since the community package
    has no box series
  - 'All statistical elements are present and correct: Q1-Q3 boxes, a thick median
    line visible against the 30 % fill in both themes, capped 1.5xIQR whiskers, and
    open outlier circles at their values'
  - Categories sorted by median with long job titles reading horizontally beside their
    boxes; shared value axis not forced to zero
  - Realistic salary-by-job-title data with varied spreads, skewed medians and outliers
    on both sides
  - Theme tokens threaded through title, subtitle, axes and grid; Imprint palette
    in canonical order identical across both renders
  weaknesses:
  - 'Suggestion: color carries no information beyond the y position here; a single
    brand-green hue (or a highlight of one group) would let the median ordering read
    as one story instead of seven unrelated colors.'
  - 'Suggestion: the y-axis band of 240 px leaves a wide gap between the ''Job title''
    axis label and the shorter category names; a narrower band (about 200 px) would
    tighten the left edge.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "box-horizontal · javascript · muix · anyplot.ai" centered at top, grey subtitle "83 observations · 7 groups (Job title), sorted by median · Whiskers at 1.5×IQR"; y-axis label "Job title" (rotated), seven job-title tick labels, x-axis "Annual base salary ($k)" with ticks 40-200; dashed vertical grid lines, subtle. All text readable.
      Data: seven horizontal boxes sorted by median top to bottom (Senior Software Engineer #009E73, Data Scientist lavender, Product Manager blue, DevOps Engineer ochre, UX/UI Designer matte red, Marketing Analyst cyan, Customer Success Manager rose); 30 % fills, thick median lines, capped whiskers, open outlier circles (206 for Senior SWE, ~98 Data Scientist, ~95 DevOps, ~123 UX/UI, ~86 Customer Success).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle, tick labels and axis titles in light/soft ink, axis lines light; grid dashed and faint but visible. No dark-on-dark text.
      Data: identical hues and positions to the light render; box fills read as dark tints of each hue, strokes and medians stay bright and visible; outlier circles filled with the dark page color.
      Legibility verdict: PASS
