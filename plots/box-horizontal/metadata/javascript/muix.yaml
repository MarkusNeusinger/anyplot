review:
  strengths:
  - 'Uses the MUI X v9 composition API idiomatically: ChartsContainer with linear/band
    axes, ChartsGrid, ChartsXAxis/ChartsYAxis and a custom BoxWhiskers SVG layer that
    draws through the useXScale/useYScale hooks, so every box sits exactly on the
    library''s own scales'
  - 'All statistical elements of a box plot are present and correct: interpolated
    Q1/median/Q3, whiskers to the last value inside 1.5×IQR, hollow outlier circles
    at their values, on both sides of boxes (Data Scientist and DevOps low, Senior
    Software Engineer, UX/UI Designer and Customer Success Manager high)'
  - Categories sorted by median, long job titles read horizontally beside their boxes
    on one shared salary axis that starts near the data (≈30k) rather than at zero
  - 'Refined mark styling: translucent tinted box fill with a saturated outline, a
    heavier median stroke that stays visible against the fill in both themes, rounded
    box corners and outlier circles filled with the page color'
  - 'Theme threading is complete: title, subtitle, axis labels, ticks, axis lines
    and the dashed vertical-only grid all come from ANYPLOT_TOKENS and read cleanly
    on #FAF8F1 and #1A1A17'
  - Realistic, neutral salary scenario with plausible ranges per role, generated deterministically
    with a fixed-seed LCG and Box–Muller
  weaknesses:
  - 'CQ-04 (code): lines 58–62 build the category list with a manual loop and `includes`
    check → `const rawCategories = [...new Set(data.map((row) => String(row[CATEGORIES])))];`,
    the order-preserving form the muix library prompt names. Likely cause: hand-written
    dedupe loop.'
  - 'Suggestion: the mandated title fills only about 35 % of the width; a slightly
    larger title (≈26 px) would give the header more presence against the wide plot.'
  - 'Suggestion: the wide gap between the rotated ''Job title'' axis label and the
    tick labels could be tightened by reducing the y-axis band width a little.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white.
      Chrome: bold dark title "box-horizontal · javascript · muix · anyplot.ai" centered at top with a soft-ink subtitle "83 observations · 7 groups (Job title), sorted by median · Whiskers at 1.5×IQR". Y axis lists seven job titles (Senior Software Engineer at top down to Customer Success Manager) with rotated axis label "Job title"; x axis "Annual base salary ($k)" with ticks 40–200. Dashed, faint vertical grid lines only. All text dark on light, fully readable.
      Data: seven horizontal boxes, one per role, in Imprint order — brand green #009E73 first (Senior Software Engineer), then lavender, blue, ochre, matte red, cyan, rose. Tinted translucent fills, saturated outlines, thick median lines visible inside each box, whiskers with caps on both sides, hollow outlier circles (e.g. ≈206k for Senior SWE, ≈98k for Data Scientist, ≈95k for DevOps, ≈123k for UX/UI, ≈86k for Customer Success). Nothing clipped or overlapping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black.
      Chrome: title in light ink, subtitle and tick labels in soft light ink, axis lines light, grid dashed and faint but visible. No dark-on-dark text anywhere.
      Data: identical hues and positions to the light render; only the box fill tint reads darker because the translucent fill blends with the dark page. Median lines and outlier circles (filled with the page color) remain clearly visible; brand green reads well.
      Legibility verdict: PASS
