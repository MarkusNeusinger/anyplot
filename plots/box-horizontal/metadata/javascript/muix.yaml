review:
  strengths:
  - Correctly implements a box-and-whisker overlay from scratch via useXScale/useYScale
    hooks, cleanly working around the community package's missing BoxPlot component
    without reaching into Pro/Premium
  - Deterministic LCG-based data generation with realistic per-role salary distributions
    and two intentionally injected outliers clearly demonstrates the outlier feature
  - Categories sorted by descending median, matching the spec's 'consider sorting
    by median' guidance and creating a clear top-to-bottom narrative
  - Canonical Imprint palette used in order with correct brand-green first series;
    both renders are fully theme-correct in backgrounds and chrome
  - 'Thoughtful visual hierarchy beyond generic defaults: rounded box corners, bolder
    median line, hollow-donut outlier markers'
  weaknesses:
  - Y-axis has no descriptive axis title (e.g. 'Job Title'); the role names are self-explanatory
    so this is minor, but adding one would fully satisfy VQ-06
  - ChartsGrid opacity is set to 0.55 on top of the default grid token, higher than
    the style guide's suggested subtle 10-25% range — it reads fine in the renders
    thanks to the dashed pattern, but worth re-checking the compounded opacity
  - Outlier markers (r=5 CSS px) are on the smaller side; bumping to ~6-7px would
    improve visibility at mobile widths
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-horizontal · javascript · muix · anyplot.ai" top-left in dark ink; x-axis title "Annual Salary ($k)" and tick labels (30-220) in dark ink; 7 y-axis category labels (job titles, sorted by descending median: Senior Software Engineer, Data Scientist, Product Manager, DevOps Engineer, UX/UI Designer, Marketing Analyst, Customer Success Manager) all clearly legible. Subtle dotted vertical gridlines.
      Data: 7 horizontal box-and-whisker plots, one per role, each using a distinct Imprint categorical color in canonical order (green, lavender, blue, ochre, red, cyan, rose) — first series (Senior Software Engineer) is brand green #009E73. Boxes show translucent fills with solid-color strokes, whisker caps, a bold median line, and hollow (background-fill) outlier circles on 4 of 7 rows.
      Legibility verdict: PASS — all title, axis, and tick text reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis title, tick labels, and category labels now in light ink, fully legible against the dark surface. Gridlines flip to a light, low-opacity dotted style.
      Data: Same 7 box plots in identical position/order. Data colors (stroke hues) are identical to the light render — green/lavender/blue/ochre/red/cyan/rose per role in the same order. Only the chrome (background, text, grid) flips; the translucent box fills appear perceptually richer against the dark backdrop purely from alpha compositing, which is expected and not a color-identity violation.
      Legibility verdict: PASS — no dark-on-dark failures; all text remains clearly readable, and brand green stays visible on the dark surface.
