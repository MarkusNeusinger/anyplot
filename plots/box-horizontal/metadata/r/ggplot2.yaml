review:
  strengths:
  - 'Both attempt-2 bugs are fixed: the stat_summary() mean-diamond now renders centered
    in every box (orientation = "y" was the correct fix), and the plot.caption explaining
    the diamond symbol is fully visible above the canvas bottom edge in both themes'
  - Categories remain sorted descending by median salary (Data Scientist at top, Customer
    Support Rep at bottom), creating a clear staircase that guides comparison and
    demonstrates data storytelling
  - All required statistical elements (median line, IQR box, whiskers, outliers) plus
    the new mean marker are present and correctly rendered in both themes
  - 'Theme-adaptive chrome is threaded correctly: INK/INK_SOFT/PAGE_BG flip between
    renders while the brand-green data color (#009E73) and the mean-marker styling
    stay pixel-identical in role'
  - Correct canvas size (3200x1800 landscape), correct mandated title format, x-axis
    has units, clean/reproducible/KISS-structured code
  - The caption doubles as an informal legend, explaining both the diamond (mean)
    and the box (median/IQR) without needing a separate legend box
  weaknesses:
  - 'Aesthetic sophistication is still moderate rather than exceptional: box fill
    is a single flat brand-green alpha blend, with no further stylistic layering (e.g.
    varying box width by group sample size, subtle emphasis on the top/bottom performer)
    beyond the mean-marker addition'
  - 'Library Mastery is solid but not exceptional: stat_summary(orientation = "y")
    plus a custom diamond shape is a nice touch, but it''s a fairly common ggplot2
    pattern rather than something that showcases a truly distinctive capability of
    the grammar-of-graphics layer system'
  - Y-axis category-label font (9pt) is very slightly larger than the x-axis tick-label
    font (8pt) — a minor asymmetry, not a legibility problem
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "box-horizontal · r · ggplot2 · anyplot.ai" in dark ink at top; y-axis category labels (7 job titles, sorted ascending bottom-to-top by median salary) and x-axis tick labels (60/90/120/150) all dark-on-light and fully readable; x-axis title "Annual Salary (thousands USD)" present with units; caption "◆ marks the mean; box marks the median and interquartile range" is fully visible below the x-axis title, not clipped.
      Data: Boxes filled brand green (#009E73) at ~75% alpha with dark ink borders and a dark median line; a white diamond with dark outline (mean marker) is now clearly visible centered inside every box; whiskers are thin dark horizontal lines; 3 outlier points (Data Scientist, Product Manager, Customer Support Rep rows) render as small green dots.
