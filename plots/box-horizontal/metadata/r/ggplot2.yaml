review:
  strengths:
  - Categories remain sorted descending by median salary (Data Scientist at top, Customer
    Support Rep at bottom), keeping cross-category comparison immediate
  - All four required statistical elements (median line, IQR box, whiskers, outliers)
    are present and correctly rendered in both themes
  - 'Theme-adaptive chrome is threaded correctly: INK/INK_SOFT/PAGE_BG flip between
    renders while the brand-green data color (#009E73) stays pixel-identical'
  - Outlier points are now visibly bolder (outlier.size=2.6, outlier.alpha=0.85 vs.
    the previous attempt's 1.8/0.6), improving at-a-glance visibility
  - Correct canvas size (3200x1800 landscape), correct mandated title format, x-axis
    has units, clean/reproducible/KISS-structured code
  weaknesses:
  - 'The new stat_summary(fun = mean, geom = "point", shape = 23, ...) mean-marker
    layer does not render anywhere in either theme. Pixel-level inspection of every
    box in both plot-light.png and plot-dark.png shows the median line''s width is
    perfectly uniform (11px, unchanged) across the box''s full vertical extent, with
    zero additional gap or bulge -- no diamond is drawn. Likely cause: stat_summary()
    defaults to summarizing y-over-x (vertical orientation); since this is a horizontal
    boxplot (continuous x = salary_k, discrete y = job_title), the call needs an explicit
    orientation = "y" argument, otherwise the per-category mean is computed against
    the wrong axis and the resulting point never appears where expected. Fix: add
    orientation = "y" to stat_summary() and visually confirm a diamond appears centered
    in each box before resubmitting.'
  - 'The new plot.caption ("◆ marks the mean; box marks the median and interquartile
    range") is completely absent from both renders -- not partially clipped, entirely
    missing, checked all the way to the canvas''s bottom edge. plot.margin has b =
    12, too small to fit the caption''s 7pt text plus its margin(t = 10) below the
    x-axis title, so the caption row gets squeezed out of the saved PNG entirely.
    Fix: increase plot.margin(b = ...) substantially (e.g. b = 40) or otherwise free
    vertical space so the caption actually prints in the saved image.'
  - Because neither the mean marker nor its explanatory caption render, this repair
    attempt did not deliver the distinctive-feature / aesthetic-sophistication improvement
    requested by the previous review -- Library Mastery (LM-02) and Design Excellence
    (DE-01/DE-03) remain at the same low baseline as attempt 1, and the caption bug
    is a net-new regression versus attempt 1's clean layout.
  - With both new elements invisible, the stat_summary + caption code currently has
    zero visual effect -- it is effectively dead code until the orientation and margin
    issues above are fixed.
  image_description: |-
