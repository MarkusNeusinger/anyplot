  strengths:
  - Categories sorted by median salary (bottom-to-top ascending), exactly matching
    the spec's suggestion 'Consider sorting categories by median value for easier
    comparison' — creates a clear visual hierarchy
  - Long job-title category labels rendered horizontally and fully legible, demonstrating
    the actual stated benefit of a horizontal box plot over a vertical one
  - 'Correct theme-adaptive chrome: PAGE_BG/INK/INK_SOFT tokens threaded through Figure,
    Axis, spines, gridlines, and boxplot strokes/whiskers; data color (#009E73) identical
    between light and dark renders'
  - 'Idiomatic Makie usage: native boxplot! recipe with orientation=:horizontal, explicit
    strokecolor/mediancolor/whiskercolor/outliercolor separation, custom (position,
    label) yticks tuple for the sorted category mapping'
  - Canvas exactly 3200x1800 (landscape), clean single-file script with no functions/classes,
    Random.seed!(42) for reproducibility, only used imports (CairoMakie, Colors, Random,
    Statistics)
  weaknesses:
  - Vertical whitespace between box-plot rows is quite generous (width=0.6 boxes on
    6 evenly-spaced y positions across the full 1800px canvas height) — a slightly
    larger box width or tighter row spacing would use the canvas more densely without
    hurting legibility
  - Library Mastery is solid but not distinctive beyond the core boxplot! recipe —
    no Makie-specific feature beyond standard styling kwargs and the (color, alpha)
    tuple syntax
