review:
  strengths:
  - Categories sorted bottom-to-top by ascending median salary, exactly matching the
    spec's suggestion to sort by median for easier comparison
  - Right-of-whisker median-value annotations (139, 125, 120, 101, 82, 68) add a precise
    numeric anchor to the visual ranking without ever colliding with box, whisker,
    or outlier geometry — genuinely improves data storytelling over attempt 1
  - Box width increased from 0.6 to 0.78, fixing the previously flagged overly generous
    vertical whitespace between rows while keeping labels and outliers uncluttered
  - 'Correct theme-adaptive chrome: PAGE_BG/INK/INK_SOFT tokens threaded through Figure,
    Axis, spines, gridlines, boxplot strokes/whiskers, and the new annotation text;
    data color (#009E73) identical between light and dark renders'
  - 'Idiomatic Makie usage: native boxplot! recipe with orientation=:horizontal, explicit
    strokecolor/mediancolor/whiskercolor/outliercolor separation, custom (positions,
    labels) yticks tuple for the sorted category mapping'
  - Canvas exactly 3200x1800 (landscape gate passed), clean single-file script with
    no functions/classes, Random.seed!(42) for reproducibility, only used imports
    (CairoMakie, Colors, Random, Statistics)
  weaknesses:
  - Library Mastery is still capped by a lack of Makie-distinctive features — the
    implementation relies on the standard boxplot! recipe, styling kwargs, and a generic
    text! annotation, none of which showcase something unique to Makie's grammar (e.g.
    combining recipes, Layoutable-driven small multiples, or a custom Makie theme
    object)
  - Aesthetic sophistication is clean and professional but stays within a fairly conventional
    box-plot form — there is limited visual differentiation beyond the median-value
    annotation trick, which is a relatively common technique across libraries
