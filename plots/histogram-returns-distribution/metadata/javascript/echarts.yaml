      Data: Bar green, tail amber, and normal-curve lavender are visually identical to the light render — only the surrounding chrome (background, text, box fill, grid) flipped. Stats box uses a dark elevated fill with light text, and remains fully legible — no dark-on-dark text failures observed anywhere (title, axis labels, tick labels, legend, and stats box all pass contrast).
