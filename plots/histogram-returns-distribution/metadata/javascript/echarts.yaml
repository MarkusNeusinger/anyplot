      Data: Histogram bars are Imprint brand green (#009E73); bars beyond |z|>2 are amber/gold, matching the "Tail region (|z| > 2)" legend swatch in the stats box. The smooth normal-fit curve is a light purple/lavender (Imprint palette[1], #C475FD). Stats box (top right, rounded rect, light elevated fill) lists Observations, Mean, Std dev, Skewness, Kurtosis in dark text — fully readable, no overlap with the histogram.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
