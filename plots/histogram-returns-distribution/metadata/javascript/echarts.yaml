review:
  strengths:
  - Correct density-normalized histogram with a properly fitted normal-distribution
    overlay curve, exactly as the spec requires
  - Statistics callout box (Observations, Mean, Std dev, Skewness, Kurtosis) is a
    native ECharts graphic panel with rounded corners and elevated-surface styling,
    not a fake UI element
  - Tail region beyond |z| > 2 is highlighted in the semantic amber anchor color with
    a matching legend swatch, correctly distinguishing it from the categorical palette
    pool
  - 'First categorical series is the mandated brand green #009E73; Imprint palette
    and theme-adaptive chrome (background, text, grid) are correct and identical data
    colors across both light and dark renders'
  - Y-axis-only subtle grid with the y-axis line hidden gives a clean, minimalist
    L-shaped-equivalent look per the style guide's grid guidelines
  - Realistic, neutral finance scenario (equity ETF daily returns, ~0.11% mean, ~1.46%
    std dev, negative skew, fat tails) with factually plausible magnitudes for daily
    equity volatility
  - Title fontsize correctly scales down via the length-based formula so the long
    mandated title string doesn't overflow or clip in either render
  weaknesses:
  - 'Legend/data color mismatch: the ''Normal fit'' legend swatch renders as purple/lavender
    (ECharts'' default series-index color, palette[1]) while the actual curve drawn
    on the chart is blue (lineStyle.color explicitly set to palette[2]). Set itemStyle.color:
    t.palette[2] on the line series (in addition to lineStyle.color) so the legend
    icon matches what''s actually rendered — visible in both plot-light.png and plot-dark.png.'
  - The tail-region highlighting is done by manually recoloring individual histogram
    bars based on a threshold check; ECharts' markArea (for the two tail bands) or
    markLine (for the mean ± 2 std-dev boundaries) would be a more idiomatic, distinctive
    use of the library and would read more clearly as an explicit threshold annotation
    rather than a per-bar color hack.
  - Only two data series are used (bar + line) but the line skips palette position
    2 (lavender) and jumps to palette position 3 (blue) — using palette[1] for the
    line instead would keep the categorical assignment contiguous and would have avoided
    the legend color-index mismatch entirely.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Equity ETF Daily Returns · histogram-returns-distribution · javascript · echarts · anyplot.ai" in dark ink at top, clearly legible; legend below title with two entries ("Daily returns" green square, "Normal fit" purple/lavender dot+dash icon); x-axis "Daily return" and y-axis "Density" labels dark and readable; tick labels (percent values, 0/0.1/0.2/...) in softer gray-ink, all readable; subtle horizontal grid lines on y-axis only.
      Data: Histogram bars mostly brand green (#009E73), with several bars near both tails recolored amber (#DDCC77-ish) to flag |z|>2 regions; a smooth blue curve (~#4467A3) overlays the histogram as the normal fit; a statistics callout box (elevated cream panel, rounded corners, thin border) sits top-right with Observations/Mean/Std dev/Skewness/Kurtosis plus an amber swatch labeled "Tail region (|z| > 2)".
      Legibility verdict: PASS. All text is clearly readable against the light background. Note: the "Normal fit" legend icon is purple/lavender while the actual overlay curve is blue — a color-assignment bug, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, legend text, axis labels/titles, and tick labels all switch to light ink (near-white/light-gray) and remain clearly legible; the statistics box becomes a dark elevated panel (~#242420) with light text, still fully readable; grid lines remain subtle.
      Data: Data colors are pixel-identical to the light render — same brand-green bars, same amber tail bars, same blue normal-fit curve — confirming only chrome flipped, not data colors. The same purple/blue legend-vs-line mismatch is reproduced identically in this theme.
      Legibility verdict: PASS. No dark-on-dark or light-on-light failures observed; every text element has strong contrast against the near-black surface.
