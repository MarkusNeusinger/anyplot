review:
  strengths:
  - Tail regions (|z| > 2) are highlighted with distinct amber coloring per-bar, directly
    serving the spec's fat-tail/skewness analysis purpose
  - Density-normalized histogram and normal PDF overlay are on comparable scales,
    exactly as the spec recommends
  - Custom rounded stats box (graphic API) cleanly surfaces mean, std dev, skewness,
    and kurtosis without cluttering the plot area
  - Deterministic fixed-seed LCG data generation includes a realistic downside-skewed
    volatility-cluster shock, producing plausible negative skew and excess kurtosis
    for an equity ETF
  - 'Minimal chrome: x-axis split lines and tick marks hidden, y-axis-only subtle
    grid, matching the style guide''s grid guidelines'
  - First categorical series is Imprint brand green (#009E73), normal-fit line uses
    palette[1] (#C475FD), both confirmed identical across light/dark renders
  - Title font size scales down for the long mandated title, avoiding overflow while
    staying centered and fully legible
  weaknesses:
  - Stats box and tail-region legend swatch styling, while clean, reuse standard echarts
    graphic primitives rather than pushing further into distinctive echarts-only features
    (e.g. markArea/markLine for the tail bands) — LM-02 headroom remains
  - x-axis tick label interval (every 3rd bin) is a reasonable density tradeoff but
    could use markLine to annotate the +/-2 std tail boundaries directly on the axis
    for extra clarity
  image_description: |-
