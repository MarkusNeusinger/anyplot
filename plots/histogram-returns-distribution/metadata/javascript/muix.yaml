review:
  strengths:
  - Two-tone stacked histogram (green core / amber tail) clearly separates the ±2σ
    regions per the spec's tail-highlighting requirement, using the amber token in
    its correct semantic 'warning/caution' role rather than as an arbitrary extra
    color.
  - Overlaid normal-fit curve on a density-normalized histogram lets viewers directly
    compare empirical vs. theoretical shape, and the realistic negative skew (-1.49)
    / excess kurtosis (6.66) makes the fat left tail the spec calls for visibly obvious
    (empirical peak well above the fitted curve).
  - Live-computed stats box (mean, std dev, skewness, kurtosis) plus a dashed mean
    reference line gives a fast, self-contained read without needing the raw data.
  - Idiomatic MUI X composition via ChartContainer + BarPlot/LinePlot/ChartsReferenceLine/ChartsGrid
    rather than the basic <BarChart> wrapper, showing real command of the library's
    composable API surface.
  - 'Both renders are theme-correct: chrome (curve color, reference line, ticks, legend
    swatches) flips between ink-on-cream and ink-on-near-black while the data colors
    (green core, amber tail) stay identical between themes.'
  weaknesses:
  - The 'Mean' reference-line label sits directly on the solid green bar fill in both
    themes (brownish-on-green in light, pale-gray-on-green in dark), giving borderline
    contrast — nudge the label above the bar top or add a small background chip so
    it isn't printed on data fill.
  - Visual refinement is solid but modest beyond the horizontal-only grid — no other
    distinguishing chrome treatment (e.g. subtle bar edge stroke) pushes it into top-tier
    polish.
  - n=252 sits at the exact floor of the spec's '252+ observations recommended' —
    fine, but a slightly larger sample (e.g. 400-500) would make the tail bins read
    a bit more robustly.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-range), correct light-theme surface, not pure white.
      Chrome: Dark ink title "histogram-returns-distribution · javascript · muix · anyplot.ai" centered top, fully legible. Axis titles "Daily Return (%)" and "Density" in dark ink, tick labels in a slightly softer ink, all clearly readable. Horizontal grid lines are subtle light-gray, visible but not dominant. Legend top-right ("Within ±2σ", "Beyond ±2σ (tail)", "Normal fit") reads clearly in dark text. Stats box top-left (Mean/Std dev/Skewness/Kurtosis) has a light card background with dark text, fully legible.
      Data: First/core series is the mandated brand green (#009E73); tail bins beyond ±2σ use the amber warning token; the normal-fit curve is drawn in dark ink (black) with a dashed "Mean" reference line labeled in soft ink directly over a green bar (readable but lower contrast than surrounding chrome text).
      Legibility verdict: PASS (minor exception: the "Mean" label sitting on the green bar fill has reduced but still readable contrast).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-range), correct dark-theme surface, not pure black.
      Chrome: Title and axis titles/tick labels render in light ink against the dark background, fully legible — no dark-on-dark failures observed. Grid lines are subtle light gray, visible without dominating. Legend and stats box both use light text on the dark/elevated background, fully readable.
      Data: Bar colors (green core, amber tail) are pixel-identical to the light render, confirming only chrome flipped. The normal-fit curve and legend swatch for "Normal fit" flip to white (ink token), consistent with the theme. The "Mean" label again sits on a green bar with pale-gray text — readable but the lowest-contrast element in the render.
      Legibility verdict: PASS (same minor "Mean" label contrast note as the light render; no dark-on-dark chrome failures).
