review:
  strengths:
  - 'Tail coloring done the MUI X way: core and tail densities as two bar series sharing
    stack ''bins'', so each bin carries exactly one color with no overdraw'
  - Density normalization (count / (n·binWidth)) puts bars and the fitted normal curve
    on one scale, making the tall central peak and the fat left tail directly readable
    against the curve
  - Monospace numerals in the stats card, subtitle and ticks against a sans title
    give a clean typographic hierarchy, and every text element uses theme tokens so
    both renders read cleanly
  - 'Subtitle quantifies the story: 252 periods, 8 tail periods, and the exact ±2σ
    thresholds (-2.72 % / +2.82 %)'
  - Stats card sits on the elevated token over the empty upper-left region, covering
    neither bars nor curve
  weaknesses:
  - 'SC-01 (both): an unrequested dashed mean reference line with a ''Mean (+0.05%)''
    label runs through the central bars; the spec asks for no reference line and the
    mean is already in the stats box → remove the line and its label. Likely cause:
    the MeanReferenceLineLayer component and its <MeanReferenceLineLayer /> child.'
  - 'Suggestion: tick labels are bin centers every third bin (-3.8 %, -1.3 %, 1.2
    %, plus a forced ''0.0%''), which read as irregular steps; a linear x axis with
    round percentage ticks would read more easily.'
  - 'Suggestion: the header legend is hand-built HTML; MUI X''s own ChartsLegend inside
    ChartsDataProvider/ChartsWrapper would show the library''s native legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "histogram-returns-distribution · javascript · muix · anyplot.ai" top left with a mono subtitle (252 periods, 2025-01-02 to 2025-12-19, 8 tail periods beyond ±2σ, -2.72% / +2.82%); header legend top right (green swatch "Within ±2σ", purple swatch "Beyond ±2σ (tail)", black line "Normal fit"); y axis "Probability density" 0.00-0.45, x axis "Daily return (%)" with mono ticks -7.5% … 2.4%; subtle horizontal grid; all text dark and readable.
      Data: 26 contiguous density bars, central bins #009E73 green, tail bins (four on the far left near -7.5/-6.5/-6.3/-3.1 %, one at the right edge) purple; black fitted normal curve peaking near 0.29 below the 0.42 central bar; dashed black mean line at +0.05 % with label; "Return statistics" card on the elevated cream fill in the empty upper left (mean 0.05%, std 1.38%, skew -1.49, excess kurtosis 6.66).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles, mean label and stats heading in light ink, ticks/subtitle/stats rows in light-grey soft ink; grid subtle; stats card on the dark elevated fill; no dark-on-dark text anywhere.
      Data: bar colors identical to light (same green and purple); normal curve and mean line flip to light ink as theme chrome.
      Legibility verdict: PASS
