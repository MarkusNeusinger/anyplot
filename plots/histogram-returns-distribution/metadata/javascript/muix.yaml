review:
  strengths:
  - Composes the chart from ChartsContainer with BarPlot and LinePlot, so the density
    bars and the fitted normal curve share one band x axis and one density y axis
    and compare directly
  - 'Tail coloring is done natively by splitting the density into two stacked bar
    series (core #009E73, tail Imprint position 2), with the boundary at the bin nearest
    ±2σ on both sides'
  - The statistics card (mean, std dev, skewness, excess kurtosis) sits in the empty
    upper-left region and covers neither bars nor curve; monospace numerals align
    the values
  - 'Theme threading is complete: ink/inkSoft/grid/elevatedBg tokens drive all chrome,
    and the normal curve uses ink so it flips dark→light while the data colors stay
    identical'
  - Axis bands are sized explicitly (x height 60, y width 84), so no tick label is
    truncated at 14 px; skipAnimation set on the container and on each plot
  - valueFormatter on every series gives readable tooltips in the interactive HTML
  weaknesses:
  - 'CQ-04 (code): lines 187–232 hand-build the legend (swatch spans and labels in
    a flex div, ~45 lines) although every series already carries a label → render
    the native `<ChartsLegend />` (inside ChartsDataProvider/ChartsWrapper, styled
    through slotProps.legend.sx) and delete the HTML block. Likely cause: the header
    legend was written by hand instead of using the library legend.'
  - 'Suggestion: tick labels sit at every third bin center and read as unround values
    (-6.3 %, -3.8 %, -1.3 %, 1.2 %); a linear x axis with ticks at whole percents
    would read faster.'
  - 'Suggestion: dashed vertical markers at the two ±2σ values would make the tail
    boundary readable without the subtitle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; stats card on a slightly lighter elevated surface with a thin grid-colored border.
      Chrome: title "histogram-returns-distribution · javascript · muix · anyplot.ai" bold dark ink top-left (~45 % width), monospace subtitle "252 periods (2025-01-02 to 2025-12-19) · 8 tail periods beyond ±2σ (-2.72% / +2.82%)", legend top-right (Within ±2σ, Beyond ±2σ (tail), Normal fit). X axis "Daily return (%)" with monospace ticks -7.5% … 2.4%, y axis "Probability density" 0.00–0.45; subtle horizontal grid. All text dark and readable.
      Data: 26 near-contiguous density bars, central ones in #009E73, tail bins (three isolated bars near -7.5/-6.5 %, one at -2.9 %, one at +2.75 %) in Imprint purple; black normal-fit curve peaking ~0.29 under a taller 0.42 central bar; negative skew and fat left tail visible. Stats card top-left: Mean 0.05 %, Std dev 1.38 %, Skewness -1.49, Excess kurtosis 6.66.
      Legibility verdict: PASS

