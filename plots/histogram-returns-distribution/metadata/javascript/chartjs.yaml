review:
  strengths:
  - Correct histogram plus fitted normal curve overlay with density normalization,
    exactly matching the specification's core requirement
  - Tail regions beyond +/-2 standard deviations are highlighted with the Imprint
    semantic red anchor, directly satisfying the 'highlight tail regions' requirement
  - Custom Chart.js canvas plugin renders a polished on-chart stats box (mean, std
    dev, skewness, kurtosis) using afterDraw and roundRect
  - Deterministic fixed-seed LCG data generation with a blended fat-tail mixture produces
    genuine skew/kurtosis rather than a pure Gaussian, matching the risk-analysis
    narrative
  - Theme-adaptive chrome (title, subtitle, ticks, grid, stats box) is correctly threaded
    through ANYPLOT_TOKENS and is legible in both light and dark renders
  weaknesses:
  - Legend swatch for 'Daily Returns' renders matte-red (Chart.js uses the first backgroundColor
    array entry as the legend color) even though the vast majority of bars are brand
    green -- misleading at a glance. Force the swatch via plugins.legend.labels.generateLabels
    to use t.palette[0], or otherwise decouple the legend color from the per-bar tail-highlight
    array.
  - 'Tail-vs-body bar coloring relies on red vs. green hue alone; the luminance gap
    between #AE3030 and #009E73 is modest, so colorblind readers get limited redundant
    signal beyond bar position. Consider a thin ink-color edge stroke on the tail
    bars for redundant encoding.'
  - The fitted normal curve uses t.palette[2] (blue), skipping canonical position
    2 (t.palette[1], lavender) without a strong semantic justification -- the style
    guide says to use positions 1-to-N in order by default unless a semantic exception
    applies.
  - Stats box lines are not vertically aligned into columns (label vs. value) since
    the text is not tabular-formatted, giving a slightly ragged right edge to the
    numbers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Title "histogram-returns-distribution · javascript · chartjs · anyplot.ai" in dark ink, clearly readable; italic gray subtitle "Matte-red bars mark returns beyond ±2σ (tail risk)" readable; top legend with two swatches ("Normal (Fitted)" hollow blue-outlined box, "Daily Returns" solid red box) in dark text; x-axis "Daily Return (%)" ticks from -4.6% to 2.8%+ in soft ink; y-axis "Density" ticks 0 to 0.45 in soft ink; stats callout box (Mean/Std Dev/Skewness/Kurtosis) top-right with a light elevated-bg fill and thin border, dark text.
      Data: Histogram bars mostly brand green (#009E73) across the central bulk of the distribution, with matte-red (#AE3030) bars at the outer bins beyond +/-2 sigma on both tails; a smooth blue (#4467A3) fitted normal curve overlays the bars, peaking slightly left of the tallest green bar (reflecting the fat-tail/negative-skew data).
      Legibility verdict: PASS -- all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title and subtitle render in light/off-white text, clearly readable; legend text is light-colored and readable; axis tick labels and axis titles are light gray/off-white and readable; stats box uses a dark elevated fill with a thin light-ish border and light text, fully legible; grid lines are faint and subtle.
      Data: Same brand-green body bars, matte-red tail bars, and blue fitted curve as the light render -- data colors are identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS -- no dark-on-dark failures; all title/axis/tick/legend/stats-box text is clearly visible against the dark background.
