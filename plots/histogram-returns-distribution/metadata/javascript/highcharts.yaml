review:
  strengths:
  - 'Correct plot type: density-normalized histogram with a fitted normal distribution
    overlay'
  - 'All spec features present: stats box (mean, std dev, skewness, kurtosis), distinct
    ±2σ tail coloring with dashed sigma reference lines, 30 bins for 252 observations,
    density normalization'
  - 'Perfect Imprint palette compliance: primary series is #009E73, tail highlight
    uses the semantic amber anchor appropriately, backgrounds are theme-correct (#FAF8F1
    light / #1A1A17 dark) with identical data colors across both renders'
  - Deterministic seeded data (LCG) produces a realistic negative-skew, fat-left-tail
    return distribution that clearly demonstrates the spec's risk-analysis use case
  - Title format and legend labels are exactly correct; no text overlap or clipping
    in either render
  - All font sizes explicitly set and legible in both themes, including the stats
    box and small ±2σ line labels
  weaknesses:
  - 'Design Excellence is close to library-default: gridlines, axis styling, and the
    stats-box border rely on straightforward token colors with little extra refinement
    (e.g. no subtle shadow/elevation on the stats box, no secondary typographic hierarchy)
    — push past ''well-configured default'' toward a more deliberately art-directed
    look.'
  - Data storytelling is present but modest — the ±2σ tail highlight and stats box
    state the facts, but nothing visually emphasizes the negative skew as the chart's
    central insight (e.g. a callout/annotation pointing at the fat left tail, or a
    subtitle stating the skew finding).
  - The ±2σ line labels ('-2σ' / '+2σ') are set at only 12px, noticeably smaller than
    every other label on the chart — bump to ~13-14px to match the rest of the type
    scale and stay legible when the PNG is scaled to mobile widths.
  - Code deviates from strict KISS with three helper functions (makeLcg, randNormal,
    normalPdf) ahead of the data section — acceptable for the LCG/PDF math but could
    be tightened or commented as the reason for the deviation.
  - Library Mastery is solid (renderer.label stats box, plotLines with labels, spline
    overlay) but stays within fairly common Highcharts patterns — consider leaning
    further into a distinctive Highcharts-only capability (e.g. gradient fills via
    linearGradient on the tail series, or dataLabels on the tail bins) to stand out
    more.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-returns-distribution · javascript · highcharts · anyplot.ai" in bold dark text, clearly readable. Axis titles "Daily Return (%)" (x) and "Density" (y) in dark ink-soft text, tick labels dark and legible. A stats box in the top-left (elevated off-white fill, thin border) lists Mean, Std Dev, Skewness, Kurtosis in dark text — fully readable. Two thin dashed vertical lines mark -2σ/+2σ with small rotated labels near the top; text is small (~12px) but not clipped and fully visible (verified via zoomed crop). Legend at the bottom ("Within ±2σ", "Beyond ±2σ (tail)", "Normal Distribution") in dark text, readable.
      Data: Primary histogram bars are Imprint green (#009E73); bins beyond ±2σ render in the semantic amber tail color; a black dashed spline traces the fitted normal curve. Distribution is visibly left-skewed with a fat left tail, matching the reported skewness of -0.66.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/white text, clearly readable against the dark background. Axis titles and tick labels are light-colored and legible. The stats box uses a dark elevated fill with a light border and light text — no dark-on-dark issue. The ±2σ dashed lines and their small labels are light-colored and visible. Legend text is light-colored and readable.
      Data: Bar colors are identical to the light render — same Imprint green for the body series, same amber for the tail bins, same dashed curve shape (rendered in light color instead of black to stay theme-adaptive). No color drift between themes.
      Legibility verdict: PASS

    Both renders pass the theme-readability check; no dark-on-dark or light-on-light failures were found, and no title/axis/legend text is clipped at the canvas edges (verified the ±2σ labels specifically via a zoomed crop — fully visible, well clear of the title).
