      Data: Histogram bars are brand green (#009E73) for the bulk of the distribution and amber/gold for bins beyond ±2σ, correctly matching the Imprint brand-green-first rule and the amber semantic-warning anchor. A black dashed normal-fit curve overlays the histogram, clearly visible against the bars and background.
