review:
  strengths:
  - Histogram uses density=True with 35 equal-width bins and a scipy.stats.norm.pdf
    overlay fitted to the sample mean and standard deviation, so bars and the dashed
    normal curve compare directly on one scale
  - Tail bins beyond ±2σ are recolored per patch in Imprint position 2 (#C475FD),
    with the color boundary at the nearest bin edge to the dotted ±2σ lines, exactly
    as the spec's characteristic section asks
  - Tail-count labels sit on a blended x-data/y-axes transform (ax.get_xaxis_transform())
    at 14 % of the axes height, centered in the empty tail zones, clear of every bar,
    the curve and the threshold lines in both renders
  - Statistics box (mean, std dev, skewness, kurtosis, tail share vs normal) in monospace
    on the ELEVATED_BG token sits in the empty upper right, covering neither bars
    nor curve
  - 'Full theme-token chrome: #FAF8F1 / #1A1A17 surfaces, INK/INK_SOFT text, bar edges
    in PAGE_BG so adjacent bars separate cleanly in both themes; categorical colors
    identical across renders'
  - 'Adaptable-code layout: column constants with role comments, one Data block ending
    in a tidy df, everything below derived from df'
  weaknesses:
  - 'Suggestion: the stats-box line ''Fat tails: 2.8% (norm: 4.6%)'' calls a tail
    share below the normal expectation ''fat tails''; a neutral label such as ''Beyond
    ±2σ: 2.8% (normal: 4.6%)'' would not contradict its own numbers.'
  - 'Suggestion: the stats box is right-aligned line by line, so its labels form a
    ragged left edge; multialignment=''left'' with the box still anchored at the upper
    right would line the labels up in a column.'
  - 'Suggestion: the dotted −2σ line and the left tail tint show through the upper-left
    legend frame; a fully opaque legend frame would keep the legend panel clean.'
