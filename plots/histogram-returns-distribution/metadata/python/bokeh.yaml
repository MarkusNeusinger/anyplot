      Data: 30 contiguous density bars in #009E73 with page-colored edges, tail bars in #C475FD (one at -3.7, two at -3.0/-2.75 on the left; 3.4, 3.75, 4.05 and an isolated 5.65 on the right), fitted normal curve in #4467A3 at 5 px peaking about 0.275 beside the 0.37 central bar.
      Legibility verdict: PASS

