review:
  strengths:
  - Density-normalized histogram (np.histogram density=True) and a normal curve fitted
    to the sample mean and std on the same scale, so bars and curve compare directly
  - BoxAnnotation half-open bands mark both 2σ tail regions across the full height,
    in both themes
  - HoverTool scoped to the bars with numeral formatters gives per-bin range and density
    in the HTML output
  - Stats box on an elevated surface sits in empty space above the left tail, covering
    neither bars nor curve
  - 'Theme chrome threaded through tokens: every text element readable on #FAF8F1
    and #1A1A17'
  - Tidy df with column constants feeds a single ColumnDataSource; flat, seeded, reproducible
    script
  weaknesses:
  - 'SC-02 (both): the lower tail coloring starts at the bin edge about -2.90 %, so
    the bar from about -2.90 % to -2.58 % is purple although the -2σ boundary (-2.85
    %) lies 0.05 % from its left edge and its nearest bin edge is -2.90 % — that bar
    should be green; the purple band boundary at -2.85 % and the bar coloring disagree
    → color a bar as tail only when its center lies beyond ±2σ (C3). Likely cause:
    is_tail = (edges[:-1] < lower_tail) | (edges[1:] > upper_tail).'
  - 'SC-04 (both): the green body vs purple tail coloring has no key or direct label;
    the legend explains only the normal curve → give the tail bars (and body bars)
    a legend entry such as ''Beyond ±2σ''. Likely cause: legend_label set only on
    p.line.'
  - 'VQ-03 (both): the legend''s line sample is about 16 px long beside the 34pt (about
    45 px) label, too short to read as the curve → about 40 px (+24 px). Likely cause:
    p.legend.glyph_width / glyph_height not set, as bokeh.md''s legend block requires.'
  - 'VQ-02 (both): the stats-box text touches its frame — ''Mean'', ''Std Dev'', ''Kurtosis''
    start on the left border and ''Skewness: 0.300'' ends on the right border → about
    12–16 px inner padding (+12 px). Likely cause: Label without padding=.'
  - 'VQ-07 (dark): a 1 px light line (rgb 197,197,196) runs along the top and left
    canvas edge on the #1A1A17 page → page color all the way to the edge. Likely cause:
    the Selenium block omits the document background script bokeh.md prescribes (documentElement/body
    background = PAGE_BG).'
  - 'Suggestion: scipy.stats.skew(returns), scipy.stats.kurtosis(returns) and scipy.stats.norm.pdf(x_norm,
    mean_return, std_return) reproduce the three hand-written formulas in fewer characters.'
  - 'Suggestion: label the fourth statistic ''Excess kurtosis'', since the value is
    kurtosis − 3.'
  image_description: |-
