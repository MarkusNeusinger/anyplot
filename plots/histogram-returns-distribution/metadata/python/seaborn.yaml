review:
  strengths:
  - One sns.histplot(stat='density') call over the whole DataFrame, then per-patch
    recoloring of the tail bins, keeps a single density normalization so the tails,
    bars and normal fit share one scale
  - Tail boundary falls at the bin edge nearest to the dashed ±2σ lines on both sides,
    as the spec asks
  - Negatively skewed hedge-fund monthly series (skew -1.13, excess kurtosis 2.97)
    makes the heavy left tail visibly depart from the normal fit — the chart's purpose
  - Stats box (8 pt, elevated surface, header rule) sits in the empty upper left and
    covers neither bars nor curves
  - 'Theme tokens threaded through all chrome: both renders fully legible, categorical
    colors identical'
  - Column constants and a marked Data block make the script adaptable to a real returns
    table
  weaknesses:
  - 'VQ-03 (both): the dotted Empirical KDE is drawn in #009E73 over bars filled with
    the same green, so inside the bars it nearly vanishes (worst in the dark render,
    where the dots merge with the alpha-blended #077A58 fill) → a curve color that
    contrasts with the bar fill, e.g. INK or a darker/lighter stroke, so the KDE reads
    across the whole range. Likely cause: sns.kdeplot(color=IMPRINT[0]).'
  - 'Suggestion: pass cut=0 to kdeplot so the x axis ends near the data instead of
    leaving an empty 5.5–7.8 % strip on the right.'
  - 'Suggestion: give the legend''s tail patch the same alpha (0.85) as the recolored
    tail bars so swatch and bars match exactly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title "histogram-returns-distribution · python · seaborn · anyplot.ai" in dark ink (~63% width); x label "Monthly return (%)", y label "Density"; ticks -10 … 7.5 and 0.00 … 0.25 in INK_SOFT; y-only hairline grid; top/right spines removed; stats box (upper left, elevated #FFFDF6 fill, rounded border) with "Statistics" header, rule and Mean 0.462 %, Std Dev 2.080 %, Skewness -1.129, Kurtosis 2.970; frameless legend lower left (Returns ±2σ, Tail regions >2σ, Empirical KDE, Normal fit). All readable.
      Data: 30 equal-width density bars in #009E73 (alpha 0.7) between the dashed ±2σ lines at about -3.7 and 4.6; tail bars in #C475FD — a sparse heavy left tail down to -8 and one bar at the right edge; solid #4467A3 normal fit, dotted green KDE peaking above the normal at the centre and showing a bump near -7.5. The dotted KDE is hard to follow inside the green bars.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels, ticks, stats box text (on #242420) and legend text all light; dashed boundary lines and grid subtle but visible. No dark-on-dark text.
      Data: same #009E73 / #C475FD / #4467A3 hexes as the light render (the alpha blend reads darker on the dark page); white bar edges. The dotted green KDE nearly merges with the green bar fill.
      Legibility verdict: PASS
