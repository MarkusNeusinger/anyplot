review:
  strengths:
  - Native pygal.Histogram (height, xmin, xmax) tuples for bars, tails and the curve
  - Curve made translucent through pygal's inline CSS hook, so every bar stays readable
    under the fitted normal
  - Moments from pandas (.std, .skew, .kurt) and labelled correctly as excess kurtosis
  - Fat-tailed, skewed Student-t sample makes the tail coloring and the gap to the
    normal curve meaningful
  - Theme-adaptive Style with dashed muted y-guides readable in both themes; HTML
    output keeps pygal's hover tooltips
  weaknesses:
  - 'SC-02 (both): the mean, std, skew and kurtosis sit in a second title line, not
    in a text box on the plot (C4) → a text box in the empty upper-left plot area
    (about -5 % to -3 %, density 0.3-0.5) that covers neither bars nor curve. Likely
    cause: stats_text appended to the title string.'
  - 'Suggestion: the curve''s legend swatch is drawn fully opaque while the curve
    fill is at 0.3 opacity; matching the swatch''s opacity would tie it to the pale
    mark more directly.'
  - 'Suggestion: the 300 thin bins give the curve a vertical hatched texture; a pygal.XY
    line overlay is not available inside Histogram, so a thinner stroke on the curve
    bins could smooth it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: two-line title (mandated title, then 'Mean: -0.144% | Std: 1.117% | Skew: -0.72 | Excess kurtosis: 2.14'), y title 'Probability density', x title 'Daily return (%)', ticks -5..3 and 0..0.5, dashed muted y-guides, legend of three entries at the bottom; all dark text, all readable.
      Data: green #009E73 central bars (peak ~0.52 near 0), purple #C475FD tail bars at -5.3, -3.6..-2.5 and 2.0..3.1, blue #4467A3 fitted normal drawn as a translucent filled bell (300 thin bins) over the bars; bars below the curve show through as teal.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, stats line, axis titles, ticks and legend in light ink, all readable; grid dashed and subtle; no dark-on-dark text.
      Data: same green, purple and blue as the light render; the translucent curve reads as a darker navy over the page and lets the green bars show through.
      Legibility verdict: PASS
