review:
  strengths:
  - pd.cut tail classification mapped to the fill aesthetic, so the ±2σ tails are
    colored per observation and the cut falls at the bar boundary
  - Fitted normal overlay on the bars' count scale makes the peaked center and fat
    tails directly visible
  - Stats box via annotate('label') on the ELEVATED_BG token, placed in empty space
    clear of bars and curve
  - Theme tokens on every chrome element; both renders fully legible with identical
    Imprint data colors
  weaknesses:
  - 'CQ-04 (code): the normal curve is scaled with bin_width = (max - min) / 30, but
    geom_histogram(bins=30) draws bins of (max - min) / 29, so the curve sits about
    3 % lower than the bars → compute one binwidth and pass it to both geom_histogram(binwidth=...)
    and the curve scaling, or use y=after_stat(''density'') with the unscaled pdf.
    Likely cause: the bin_width line feeding normal_scaled.'
  - 'Suggestion: Left Tail and Right Tail share one color, so a single ''Tail (beyond
    ±2σ)'' legend entry would read more directly than two identical swatches.'
  - 'Suggestion: the code comment calls the palette ''Okabe-Ito'' and the tails ''vermillion''
    while they are Imprint purple; align the comment with the code.'
  image_description: |-
