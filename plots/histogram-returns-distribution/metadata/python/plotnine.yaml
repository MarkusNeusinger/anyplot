      Background: warm off-white #FAF8F1, correct light surface.
      Chrome: title "histogram-returns-distribution · python · plotnine · anyplot.ai" in dark INK, about 63 % of the width; axis titles "Daily Returns (%)" and "Frequency" dark; tick labels in INK_SOFT; L-shaped axis lines, faint major grid. Stats box (Mean 0.01 %, Std Dev 1.82 %, Skewness 0.25, Exc. Kurtosis 3.61) on an elevated off-white fill in the empty upper right. Legend "Region" at right in an INK_SOFT frame with Left Tail / Center / Right Tail at 8 pt.
      Data: 30-bin histogram, center bars #009E73 with page-colored outlines, tail bars beyond ±2σ in #C475FD purple; blue #4467A3 normal curve peaking near 31 against a 47-count central bar; black dashed mean line at 0, purple dotted lines at about ±3.6 %. Isolated tail bars out to about ±8.5 %.
