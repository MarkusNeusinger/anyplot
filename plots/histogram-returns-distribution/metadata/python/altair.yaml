review:
  strengths:
  - 'All four characteristic properties met: percentage x axis, normal curve fitted
    to the returns'' mean and std on the density scale, tails beyond ±2σ in purple
    at the nearest bin edge, and a stats block in the empty upper-right region clear
    of bars and curve'
  - 'Idiomatic Altair: pre-binned bars via bin=''binned'' + x2, alt.layer composition,
    and one shared alt.Scale domain that yields a single legend covering bars, tail
    bars and the line layer'
  - AutoSizeParams(type='fit') sizes the chart to the 3200x1800 canvas directly, filling
    it with balanced margins
  - Theme tokens threaded through title, axes, legend and annotation; both renders
    fully readable with identical Imprint colors
  - HTML output carries bin tooltips (bin start, density) for inspection
  weaknesses:
  - 'VQ-03 (both): the ''Normal dist.'' legend entry shows a filled square swatch
    while its mark is a 3 px dashed line, so the key does not match the curve it explains
    → a stroke glyph with the same dash. Likely cause: one shared color legend from
    the bar layer (symbolType square) covers the line layer; give the line its own
    legend with symbolType=''stroke'' and symbolStrokeDash, or set the legend''s symbolType
    per series.'
  - 'DQ-01 (both): np.clip at the 1st/99th percentile truncates the fat tails the
    chart exists to show and piles about 3 observations each onto the clip values
    (the isolated bars at about -4.0% and +5.2%), lowering the shown kurtosis → keep
    the raw t(5) returns and let the extreme bars stand (the spec permits isolated
    extreme bars). Likely cause: the np.clip line in the Data block.'
  - 'Suggestion: drop the trailing ''.0'' from the integer x ticks (format=''.0f''
    or tickMinStep) for a quieter axis.'
  - 'Suggestion: a light frame or elevated fill behind the stats block would read
    more clearly as the text box the Notes name.'
