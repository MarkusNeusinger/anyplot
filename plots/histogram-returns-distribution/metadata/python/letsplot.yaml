review:
  strengths:
  - Native lets-plot layer_tooltips() on the histogram, referencing the computed ..density..
    variable with a |.4f format, gives per-bin inspection in the HTML output
  - 'Theme tokens reach every chrome element: title, axis titles, ticks, legend box
    (ELEVATED_BG) and statistics box all read cleanly on #FAF8F1 and #1A1A17, and
    the normal curve flips from INK to light ink'
  - Both tails beyond 2 sigma are colored in Imprint purple against the brand-green
    central bars, with the same categorical colors in both themes
  - Summary statistics and tail thresholds computed from the data; tail bins fall
    wholly on either side of the ±2 sigma boundaries
  weaknesses:
  - 'SC-02, SC-03 (both): the histogram density is computed separately per fill group
    because fill=Region splits the bin stat, so every single tail return draws a bar
    at about 0.19 instead of its true density of about 0.008 (about 24x too tall),
    the central bars are inflated by about 252/241, and bars and the fitted normal
    curve no longer compare on one scale (C2) -> one density over all 252 returns,
    single-return bins at about 0.008. Likely cause: aes(y=''..density..'') in geom_histogram
    with fill mapped to REGION; precompute np.histogram(..., density=True) over all
    returns and draw the bins with geom_bar(stat=''identity'') (or geom_rect), colored
    by bin.'
  - 'VQ-02, SC-02 (both): the statistics box spans about +3.4 to +7.5 % and density
    0.20 to 0.36 and covers the upper parts of the right-tail bars at +3.5, +4, +5
    and +6 %, so the box covers bars (C4) -> place it in empty space above the bars,
    clear of bars and curve. Likely cause: geom_label(x=upper_tail + 2.5, y=normal_pdf.max()
    * 0.90).'
  - 'VQ-05 (both): the statistics box text is drawn at geom_label size=10 (mm, about
    28 pt), larger than the 16 pt title and the 12 pt axis titles, so the box dominates
    the upper right of the chart -> size about 4-5 (-5 to -6 mm), per the library
    prompt''s annotation-size rule. Likely cause: geom_label(size=10).'
  - 'Suggestion: left-align the four statistics with a monospace face so their values
    line up in a column.'
