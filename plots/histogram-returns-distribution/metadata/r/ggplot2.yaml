review:
  strengths:
  - Per-bin tail coloring through aes(fill = tail) with scale_fill_manual relabelling
    the logical levels as 'Within ±2σ' / 'Beyond ±2σ'
  - Every chrome element threaded through theme tokens; both renders read cleanly,
    stats box on the ELEVATED_BG surface
  - Realistic two-year daily equity return series with injected fat tails; statistics
    formatted with explicit signs and units
  - Normal curve fitted to the sample mean and sd on the density scale, directly comparable
    with the bars
  weaknesses:
  - 'SC-02 (both): bars drawn at 90 % of the bin width with page-colored outlines
    leave visible gaps, so the histogram is not contiguous bars over equal-width bins
    (C1) → full bin width with no gap. Likely cause: geom_col(width = bin_w * 0.90,
    color = PAGE_BG).'
  - 'DE-02 (both): the grid is drawn in INK_SOFT at full opacity on both axes, so
    dark vertical lines cross every bar and the grid competes with the data → y-axis
    grid only, at the style guide''s 15 % ink opacity. Likely cause: panel.grid.major
    = element_line(color = INK_SOFT) without alpha and no panel.grid.major.x = element_blank().'
  - 'CQ-04 (code): lines 37–47 precompute the histogram with hist(), build a bin data
    frame and hand-sample dnorm into df_norm (about 11 lines) → geom_histogram(aes(y
    = after_stat(density), fill = after_stat(abs(x - mean_ret) > 2 * sd_ret)), breaks
    = h$breaks) plus geom_function(fun = dnorm, args = list(mean = mean_ret, sd =
    sd_ret)) (ggplot2). Likely cause: the per-bin tail fill was computed outside the
    stat.'
  - 'CQ-05 (code): annotate("label", label.size = 0.3) uses an argument deprecated
    in ggplot2 4 → linewidth = 0.3. Likely cause: the 3.x label border API.'
  - 'Suggestion: a subtitle carrying the fat-tail reading (e.g. excess kurtosis vs
    the normal) would give the chart a focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'histogram-returns-distribution · r · ggplot2 · anyplot.ai' top-left in dark ink; 'Daily Return (%)' and 'Density' axis titles, -4%..6% and 0.0..0.4 ticks in INK_SOFT, all readable; grid in full-opacity gray on both axes, fairly prominent; legend at the bottom on an elevated box.
      Data: ~40 density bars, body in #009E73, tails beyond ±2σ in #C475FD, small gaps between bars; blue #4467A3 normal curve; purple dashed lines at ±2σ (~-2.3% and +2.4%); stats box top-right (Mean +0.022%, Std Dev 1.172%, Skewness +0.26, Ex. Kurt +1.33) at text size in proportion with the title, clear of bars and curve.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
