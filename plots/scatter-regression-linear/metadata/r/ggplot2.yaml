review:
  strengths:
  - geom_smooth(method = "lm", se = TRUE) correctly renders both the regression line
    and the 95% CI band in one idiomatic call
  - Regression equation and R² are displayed prominently via annotate("label", ...)
    placed in the sparse top-left corner, avoiding any overlap with data
  - Point stroke uses PAGE_BG as the outline color, which visually separates overlapping
    markers in dense clusters without extra code complexity
  - 'Both renders are theme-correct: backgrounds, ink, and grid tokens flip correctly
    while the Imprint palette data colors (green points, blue regression line) stay
    identical'
  - Title, axis labels, and tick labels are fully legible in both light and dark themes
    with no clipping at canvas edges
  - Realistic, neutral synthetic data (advertising spend vs. sales revenue) with an
    appropriate noise level for a clear but not artificially perfect R² = 0.886
  weaknesses:
  - 'Design Excellence is solid but conventional: aside from the point-stroke halo
    trick and the CI band, there is no distinctive visual flourish (e.g., emphasizing
    outliers, refining the panel grid further) that would lift it from ''good execution''
    to ''publication-grade polish'''
  - The CI band (fill = IMPRINT_PALETTE[3], alpha = 0.18) sits close in visual weight
    to the panel grid in some regions, slightly softening the line/band's visual hierarchy
    against the background
  - With n = 150 points, moderate marker overlap remains in dense clusters (e.g.,
    around x = 10-15, y = 40-50) - the PAGE_BG stroke helps but a small size/alpha
    tune could further sharpen density handling
  - Library Mastery is good (idiomatic geom_smooth + geom_point) but doesn't showcase
    additional ggplot2-distinctive grammar beyond the basics - e.g. no stat_ecdf,
    no facet, no custom stat layer - to fully justify top marks in LM-02
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold dark title "Advertising Spend vs Sales Revenue · scatter-regression-linear · r · ggplot2 · anyplot.ai" at top, fully visible with no clipping. Axis titles "Advertising Spend ($ thousands)" and "Sales Revenue ($ thousands)" in dark ink, tick labels (10-50 on x, 50-150 on y) in a softer dark gray. Subtle light gridlines (major only) are visible without dominating.
      Data: ~150 green (#009E73) points with a light-colored stroke that separates overlapping markers, a bold blue (#4467A3) regression line with a semi-transparent blue confidence band, and a top-left annotation box (equation "y = 2.33x + 19.30" and "R² = 0.886") on an elevated cream background with dark text.
      Legibility verdict: PASS - all title/axis/tick/annotation text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Title and axis titles render in light ink (#F0EFE8), tick labels in a lighter gray-white (#B8B7B0), all clearly legible. Gridlines are faint but visible against the dark background. The annotation box uses a dark elevated background (#242420) with light text, readable and not blending into the surrounding page background.
      Data: Point and regression-line colors are identical to the light render (green #009E73 points, blue #4467A3 line/band) — only the chrome (background, ink, grid) has flipped, as required.
      Legibility verdict: PASS - no dark-on-dark or light-on-light failures observed; every text element is legible.
