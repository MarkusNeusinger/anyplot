review:
  strengths:
  - geom_smooth(method = "lm", se = TRUE) idiomatically renders both the regression
    line and the 95% CI band, now with stronger contrast (alpha 0.18→0.22, linewidth
    1.2→1.4) so the band reads clearly against the panel grid
  - New geom_rug() marginal ticks on both axes add a distinctive ggplot2 touch that
    shows the univariate density of ad spend and revenue without cluttering the main
    scatter
  - Regression equation and R² annotation now has a visible border (label.size = 0.25)
    and generous padding, giving it a polished, elevated-surface callout look in both
    themes
  - 'Both renders are fully theme-correct: backgrounds, ink, and grid flip correctly
    while Imprint palette data colors (#009E73 points, #4467A3 line/band) stay identical'
  - Title, axis labels, and tick labels are fully legible in both themes with no edge
    clipping
  - Realistic, neutral synthetic data (ad spend vs. sales revenue) with appropriate
    noise (R² = 0.886, not artificially perfect)
  weaknesses:
  - 'Design Excellence is strong but not yet publication-grade: beyond the rug marks
    and boxed annotation there is no further layout innovation (e.g., a secondary
    summary panel or emphasized outlier callout)'
  - With n = 150 points, moderate marker overlap remains in the densest clusters (e.g.
    x = 10-15, y = 40-50 and x = 45-49, y = 110-150) — a small further alpha/size
    tune could sharpen density handling
  - Regression line/band uses Imprint position 3 (#4467A3) rather than position 2
    (#C475FD); acceptable for a statistical overlay but worth a semantic note for
    future consistency
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Advertising Spend vs Sales Revenue · scatter-regression-linear · r · ggplot2 · anyplot.ai" at top, fully visible with no clipping. Axis titles ("Advertising Spend ($ thousands)", "Sales Revenue ($ thousands)") in dark ink, tick labels in softer gray. Subtle horizontal-only gridlines. New marginal rug ticks along both axes in translucent green.
      Data: ~150 green (#009E73) points with a light (PAGE_BG-colored) stroke separating overlapping markers, a bold blue (#4467A3) regression line with a more visible semi-transparent CI band (alpha 0.22, up from 0.18), and a bordered top-left annotation box (equation + R² = 0.886) on an elevated cream background.
      Legibility verdict: PASS — all text clearly readable against the light background, no overlap.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light ink, tick labels in light gray, all legible. Gridlines faint but visible. The annotation box uses a dark elevated background with a visible border and light text — readable, no blending into the page. Rug ticks visible in the same translucent green.
      Data: Point and line/band colors are identical to the light render — only chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text and data elements remain distinguishable.
