review:
  strengths:
  - Regression line uses geom_smooth(method='lm') while the annotation is computed
    from an independent closed-form OLS calculation, so the displayed equation and
    R² exactly match the drawn line and CI band.
  - Confidence band and regression line both use the Imprint palette position-2 color
    (#C475FD) at a restrained fill_alpha=0.15, staying visually subordinate to the
    primary green scatter points.
  - 'Theme customization goes beyond defaults: panel border removed, only x/y axis
    lines kept, grid reduced to subtle major-only lines — a deliberate minimal aesthetic
    rather than library defaults.'
  - layer_tooltips() adds real, well-formatted HTML interactivity (formatted ad-spend/sales
    values, fitted value + CI range) without faking anything in the static PNG — correctly
    not penalized per the interactive-library fairness rule.
  - 'Both renders are theme-correct: backgrounds match #FAF8F1/#1A1A17 tokens exactly,
    chrome (title/axis/ticks/annotation box) flips appropriately, and data colors
    (green points, purple line/band) are pixel-identical across themes.'
  weaknesses:
  - Point alpha is 0.75, slightly above the spec's suggested 0.6-0.7 range — lower
    it marginally to better reveal density in the x=15-20 and x=78-80 clusters where
    points visibly overlap.
  - Design excellence is solid but not distinctive beyond the theme cleanup — consider
    a stronger focal device (e.g. residual-based point shading, marginal rug, or annotated
    outlier callout) to lift it further above baseline.
  - Library mastery leans on one standout feature (layer_tooltips); could showcase
    more of lets-plot's distinctive surface (e.g. interactive brushing, geom_smooth
    confidence customization, or ggmarginal) to strengthen LM-02.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white, not dark.
      Chrome: Title "scatter-regression-linear · letsplot · anyplot.ai" in dark ink, top-left, comfortably sized (~40% width). Axis titles "Advertising Spend ($K)" / "Sales Revenue ($K)" in dark ink. Tick labels in softer grey-ink. Grid lines are faint horizontal/vertical off-black at low opacity — subtle but visible. Annotation box (top-left, "y = 2.37x + 56.7" / "R² = 0.888") sits on a near-white elevated card, dark text, clearly readable and not overlapping any data points.
      Data: Scatter points are Imprint green (#009E73) with a light cream stroke, alpha ~0.75, clearly distinguishable from background and from the regression elements. Regression line is a solid purple/magenta (#C475FD), visually distinct in color and higher opacity than the points. 95% CI band is the same purple at low fill alpha, forming a soft translucent envelope around the line.
      Legibility verdict: PASS — all title/axis/tick/annotation text reads cleanly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black, not light.
      Chrome: Title and axis titles render in light off-white ink, clearly visible. Tick labels in a softer light-grey ink, readable. Grid lines are faint light lines at low opacity, visible without dominating. Annotation box uses a dark elevated card (slightly lighter than the plot background) with light text — readable, no dark-on-dark failure.
      Data: Scatter points are the same Imprint green (#009E73), regression line and CI band are the same purple (#C475FD) at the same alpha values as the light render — confirmed pixel-identical data colors, only chrome (background/text/grid/annotation box) flipped for the theme.
      Legibility verdict: PASS — no dark-on-dark text, all chrome elements clearly legible against the near-black background, brand green and CI purple both remain vivid.
