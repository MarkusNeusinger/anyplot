review:
  strengths:
  - Canvas is now exactly on-contract (3200×1800 confirmed by direct PNG measurement)
    after correcting ggsize(1600,900)/scale=3 to ggsize(800,450)/scale=4, with font
    sizes retuned to match.
  - Edge-highlighted markers (shape=21, BRAND fill, PAGE_BG-colored stroke) give points
    a light halo that keeps overlapping clusters (x≈15-20, x≈78-80) readable instead
    of muddying into solid blobs.
  - geom_smooth(method='lm') draws the fitted line/CI while the annotation text is
    computed independently via closed-form OLS, so the displayed equation and R² match
    the drawn line exactly.
  - layer_tooltips() is enriched on both geom_point (formatted spend/sales) and geom_smooth
    (fitted value + 95% CI range) — genuine, working interactivity that adds real
    value in the HTML output without faking anything in the PNG.
  - 'Both renders are theme-correct: backgrounds match the #FAF8F1/#1A1A17 tokens
    exactly, chrome (title/axis/ticks/annotation box/grid) flips appropriately, and
    data colors (green points, purple line/band) are pixel-identical across themes.'
  weaknesses:
  - The ggmarginal("tr", size=0.09, layer=geom_density(...)) layer added this round
    to showcase a distinctive lets-plot feature does not render at all — confirmed
    absent from both plot-light.png/plot-dark.png (direct pixel crop of the top and
    right panel edges shows a plain rectangular border, no density strip) and from
    plot-light.html/plot-dark.html (zero occurrences of "marginal" or "density" in
    the exported spec). This is dead code that claims a feature the shipped artifact
    does not have.
  - Design storytelling is still the standard fit-line + CI + equation pattern; the
    one device meant to push past that (the marginal density) isn't functioning, so
    DE-03 stays at baseline.
  - Library Mastery leans entirely on layer_tooltips() as the working distinctive
    feature — the ggmarginal attempt intended to add a second one does not count since
    it produces no visible output.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white, not dark.
      Chrome: Title "scatter-regression-linear · letsplot · anyplot.ai" in dark ink, top-left. Axis titles "Advertising Spend ($K)" / "Sales Revenue ($K)" in dark ink. Tick labels in softer grey-ink. Grid lines are faint dark lines at low opacity — subtle but visible. Annotation card (top-left, "y = 2.37x + 56.7" / "R² = 0.888") sits on a near-white elevated card, dark text, clearly readable and clear of any data points. Direct pixel crop of the top edge and right edge of the panel confirms a plain rectangular border with NO marginal density strip present, despite the code adding ggmarginal("tr", ...).
      Data: 100 scatter points, Imprint green (#009E73) fill with a light cream (page-bg colored) stroke ring, alpha 0.65 — clearly distinguishable from background and readable even in dense clusters (x≈15-20, x≈78-80). Regression line is solid purple/magenta (#C475FD) at higher opacity than the points; the 95% CI band is the same purple at low fill alpha, forming a soft translucent envelope.
      Legibility verdict: PASS — all title/axis/tick/annotation text reads cleanly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black, not light.
      Chrome: Title and axis titles render in light off-white ink, clearly visible. Tick labels in a softer light-grey ink, readable. Grid lines are faint light lines at low opacity. Annotation card uses a dark elevated background (slightly lighter than the plot bg) with light text — readable, no dark-on-dark failure. Same pixel-crop check on the dark render's top/right panel edges confirms the marginal density strip is likewise absent (plain rectangular border, zero "marginal"/"density" references in plot-dark.html).
      Data: Scatter points and regression line/CI band are pixel-identical in color/alpha to the light render — confirming only chrome flipped for the theme. Brand green and CI purple both remain vivid against the near-black surface.
      Legibility verdict: PASS — no dark-on-dark text, all chrome elements clearly legible, brand green and CI purple both readable.
