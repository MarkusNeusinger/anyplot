review:
  strengths:
  - 'Idiomatic Altair layering: alt.layer() combines the CI band, regression line,
    scatter, and two text annotations into one declarative chart, and the regression
    fit itself uses Altair''s native transform_regression instead of a manual polyfit'
  - 'All spec-required features present: scatter points, a visually distinct regression
    line, a semi-transparent 95% CI band, and both the equation and R² rendered as
    on-plot annotations'
  - Point opacity (0.65) matches the spec's explicit 'alpha ~0.6-0.7' guidance exactly
  - 'Correct Imprint palette and theme-adaptive chrome: brand green #009E73 for data,
    #C475FD for the regression line/band, identical across themes; all text and grid
    tokens flip correctly between light and dark with no legibility failures'
  - Clean KISS script, deterministic via np.random.seed(42), and correct canvas handling
    (vl-convert render + PAD-only-to-target block, no cropping)
  - Realistic, neutral temperature-vs-energy-consumption scenario with a physically
    sensible positive slope and honest (moderate, noisy) R²
  weaknesses:
  - No legend or inline label identifies what the purple line and shaded band represent
    ('Regression Line' / '95% CI') — the viewer has to infer it from the equation/R²
    annotation. Compare plots/scatter-regression-linear/implementations/python/matplotlib.py,
    which adds explicit legend labels ('Regression Line', '95% CI') for the same elements.
    Add a small legend or a short inline label near the band.
  - Marker size=70 / opacity=0.65 is on the conservative side for a 100-point scatter
    (style-guide density table suggests noticeably more prominent markers for 30-100
    point density); consider bumping mark_point size to roughly 90-110 for a bit more
    visual presence.
  - Design Excellence is solid but standard — reads as a tasteful, well-configured
    chart rather than an exceptional publication-grade composition; a touch more visual
    hierarchy (e.g. a slightly bolder regression line relative to the band, or de-emphasized
    grid) would push it further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "scatter-regression-linear · python · altair · anyplot.ai" in dark ink at top-left, ~48% of plot width, not clipped. Axis titles "Temperature (°F)" / "Energy (kWh)" in bold dark ink, both readable and similarly sized. Tick labels in a softer dark gray, evenly spaced, no overlap. A bold two-line annotation ("y = 0.54x + 807.5" / "R² = 0.355") sits in the upper-left of the plot area in dark ink, clear of any data points. Subtle light-gray gridlines on both axes, visible but not competing with data.
      Data: ~100 green (#009E73) scatter points with white-free fill and moderate transparency, a solid lavender/purple (#C475FD) regression line running through the point cloud, and a semi-transparent purple confidence band around it.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Same title, axis titles, and equation/R² annotation, now rendered in light/white ink, all clearly legible against the dark background — no dark-on-dark failures observed anywhere (title, axis titles, tick labels, and annotation text all switched to light color correctly). Gridlines rendered in a light, low-opacity tone, subtle but visible.
      Data: Same green (#009E73) scatter points and lavender (#C475FD) regression line/band as the light render — data colors are identical between themes; only the chrome (background, text, grid) flipped as expected.
      Legibility verdict: PASS — all text is clearly readable against the dark background; brand green and the regression purple both remain visible and distinguishable from the near-black surface.
