review:
  strengths:
  - Exam-score data is now clipped to a realistic 0-100 range, matching the '(%)'
    axis label — fixes the Attempt 1 DQ-03 finding.
  - Regression is now computed with np.polyfit instead of manual sum-of-squares algebra
    — cleaner and fixes the Attempt 1 CQ-04 finding.
  - Legend and equation-callout boxes no longer carry a heavy border, giving a cleaner,
    less chartjunk-adjacent look — fixes the Attempt 1 DE-02 finding.
  - Marker opacity reduced to 0.55 with a thin background-colored edge added to each
    point, meaningfully reducing overplotting in the dense x≈8.1-8.5 cluster flagged
    in Attempt 1.
  - 'Correct Imprint palette: brand-green (#009E73) data points as the primary series,
    lavender (#C475FD) regression line as the accent — identical across both themes.'
  - 'All spec-required features present and legible: 95% CI band, visually distinct
    regression line, R² shown in both the legend and a callout annotation, fitted
    equation displayed.'
  - Theme-adaptive chrome threaded through consistently — title, axis labels, ticks,
    gridlines, legend and annotation boxes all readable in both light and dark renders.
  weaknesses:
  - Still doesn't leverage plotly's own distinctive regression shortcut (px.scatter(...,
    trendline='ols')) — building the trendline manually with go.Figure is functionally
    correct but misses a chance to showcase a library-unique feature (LM-02).
  - Point opacity (0.55) sits slightly below the spec's suggested 0.6-0.7 range —
    a minor nudge upward would still be fine now that the background-colored marker
    edge helps separate overlapping points.
  - Data remains a fairly generic textbook study-hours-vs-exam-score scenario with
    no genuine outliers to visually stress-test the regression fit.
