review:
  strengths:
  - 'Correct Imprint palette usage: data points render in brand green #009E73 and
    the regression line in lavender #C475FD (canonical position 2), identical across
    both themes.'
  - 'All spec-required features present: 95% CI band, visually distinct regression
    line, R² shown both in the legend and as a callout annotation, and the fitted
    equation y = mx + b.'
  - Theme-adaptive chrome is threaded through consistently — title, axis labels, tick
    labels, gridlines, legend box, and annotation box all flip correctly between the
    light and dark renders with no illegible text.
  - Good use of plotly-specific interactivity (hover spikelines, custom hovertemplate)
    that adds value in the HTML detail view without harming the static PNG.
  - Explicit font sizing throughout (title 16px, axis labels 12px, ticks 10px), reproducible
    via a fixed random seed, and a clean top-to-bottom KISS script structure.
  weaknesses:
  - Exam scores reach ~135 while the y-axis is labeled 'Exam Score (%)' — a percentage
    score above 100 is not realistic for a standard exam; clip the synthetic data
    to a plausible 0-100 range or drop the '%' and relabel as a raw point score with
    a higher ceiling (e.g. out of 150).
  - Legend and annotation boxes both use a bordered box (bordercolor + borderwidth)
    — the style guide's decoration-removal checklist recommends removing box frames
    around legends/callouts for a cleaner look; consider a borderless or more subtle
    treatment.
  - Regression stats are computed manually via raw sum-of-squares algebra instead
    of a concise `np.polyfit`/`scipy.stats.linregress` call — functionally fine but
    more verbose than necessary (CQ-04).
  - The implementation doesn't leverage plotly's own distinctive regression shortcut
    (`px.scatter(..., trendline='ols')`), instead building the trendline manually
    with go.Figure — using the library-native trendline API would raise Library Mastery
    (LM-02).
  - Marker overlap is noticeably dense in the x≈8.1–8.5 cluster (many overlapping
    points around y=104-121); a touch more transparency or a slightly smaller marker
    size would reduce overplotting there.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Title "scatter-regression-linear · python · plotly · anyplot.ai" centered top in dark ink; x-axis label "Study Hours per Day" and y-axis label "Exam Score (%)" both in dark ink; tick labels in a slightly softer dark gray; thin subtle gridlines on both axes; legend box (top-left, cream elevated fill, thin border) lists "95% CI", "Data points", "Linear Regression (R² = 0.875)"; annotation box (bottom-right, cream elevated fill) shows "y = 8.04x + 47.6" and "R² = 0.875".
      Data: Brand-green (#009E73) scatter markers with a semi-transparent green confidence band and a lavender (#C475FD) regression line cutting through the point cloud.
      Legibility verdict: PASS — all title/axis/tick/legend/annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-light gray tones, clearly visible; gridlines are faint and subtle; legend and annotation boxes use the elevated dark fill (#242420) with light text — no dark-on-dark drop-outs found anywhere.
      Data: Confirmed identical data colors to the light render — brand-green markers and CI band, lavender regression line unchanged; only the chrome (background, text, grid, box fills) flipped for the theme.
      Legibility verdict: PASS — no dark-on-dark or unreadable elements observed; brand green and lavender both remain clearly visible against the dark surface.
