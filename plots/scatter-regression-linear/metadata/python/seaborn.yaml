review:
  strengths:
  - Idiomatic use of sns.regplot combining scatter, linear fit, and 95% CI band in
    a single high-level call — genuinely seaborn-native rather than manually composed
  - CI band recolored to brand green (#009E73) instead of the line-color default,
    so it visually reads as 'uncertainty around the data' rather than 'uncertainty
    around the fit line'
  - Marginal rug plots on both axes add a seaborn-specific density cue without cluttering
    the main scatter
  - Regression equation and R² are displayed prominently in a theme-adaptive annotation
    box, satisfying the spec's statistical-transparency requirement
  - 'Theme-adaptive chrome correctly threaded through sns.set_theme rc params — both
    renders are fully readable, backgrounds match #FAF8F1/#1A1A17 exactly, canvas
    is exactly 3200×1800 with no clipping'
  - 'Realistic, well-distributed data: study hours 2-20, exam scores 30-100 with natural
    noise producing a strong but imperfect R²=0.802 fit'
  weaknesses:
  - 'Title is ''Study Hours vs Exam Score — Linear Regression'' and completely omits
    the mandated ''{spec-id} · {language} · {library} · anyplot.ai'' format — compare
    matplotlib.py in the same spec folder, which correctly uses ''scatter-regression-linear
    · matplotlib · anyplot.ai''. Fix: set the title to something like ''Study Hours
    vs Exam Score · scatter-regression-linear · python · seaborn · anyplot.ai'', shrinking
    fontsize if needed to avoid overflow.'
  - Scatter marker size (s=45) is slightly below the recommended 50-100 range for
    this 100-point density bucket — increase to ~55-70 for a touch more prominence.
  - The y-axis marginal rug plot forms a dense, overlapping gray smudge in high-density
    score ranges (50-60, 90-100) rather than distinct individual ticks — lower the
    rug alpha further or shorten rug height to keep it a subtle accent.
