review:
  strengths:
  - 'Full spec coverage in one composition: scatter + regression line + 95% CI band
    (Band model) + R²/equation annotation, all clearly legible in both themes'
  - Outliers (|residual| > 2σ) get a redundant, CVD-safe encoding (matte-red IMPRINT[4]
    + larger size 17px + heavier ink outline) instead of relying on red-vs-green color
    alone
  - Confidence band correctly derived from the regression standard error (t-distribution
    critical value applied per-point), not a cosmetic fixed-width shade
  - Subtitle ('n = 80 study sessions · linear fit with 95% confidence band') adds
    genuine context without cluttering the mandated title
  - 'Idiomatic bokeh: separate ColumnDataSource per series (normal/outlier/line/band),
    Band model for the CI ribbon, HoverTool exposing computed residual field, legend
    click_policy=''hide'' for interactive toggling in the HTML view'
  - Theme tokens threaded through every chrome element (title, subtitle, axis labels,
    ticks, grid, legend, annotation box) — both renders pass the light/dark legibility
    check with identical data colors
  - Reproducible (np.random.seed(42)), clean flat script with no unused imports or
    fake UI
  weaknesses:
  - p.outline_line_color draws a full four-sided box around the plot area in both
    renders — the style guide's default is an L-shaped (or fully removed) frame; consider
    dropping the outline or only keeping bottom/left to reduce chartjunk
  - Regression-line color (IMPRINT[1] lavender) and outlier color (IMPRINT[4] matte
    red) skip palette positions 2–4 by using them as semantic picks — defensible (outlier=semantic
    red anchor, regression line as a secondary reference series) but worth a one-line
    code comment confirming the semantic-exception reasoning so future regen doesn't
    'fix' it back to canonical order incorrectly
  image_description: |-
