      Background: Warm off-white, matches #FAF8F1 target — not pure white, not dark.
      Chrome: Bold dark title "scatter-regression-linear · bokeh · anyplot.ai" top-left, gray italic subtitle "n = 80 study sessions · linear fit with 95% confidence band" beneath it. Italic axis titles "Study Hours" (x) and "Exam Score (%)" (y) in dark ink, gray tick labels on both axes. Grid lines are faint horizontal/vertical off-white-on-cream lines, subtle but present. All chrome text is clearly legible against the light background.
      Data: 80 scatter points, most in Imprint green (#009E73) with ~5-6 flagged outliers recolored matte red (#AE3030); a light-purple (#C475FD) regression line runs through the cloud with a pale green semi-transparent 95% CI band around it. An annotation box (off-white fill, dark border) in the upper-left shows "y = 5.28x + 43.34" and "R² = 0.836". Legend bottom-right lists "Linear Regression" (purple swatch) and "Data Points" (green swatch) — no separate entry for the red outlier points.
      Legibility verdict: PASS — all title/axis/tick/legend/annotation text is readable against the light surface; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black, not light.
      Chrome: Title and subtitle flip to white/light-gray, axis titles are white italic text, tick labels are light gray — all clearly visible against the dark background. Grid lines are faint light-on-dark, subtle but present. Legend and annotation boxes use the elevated dark surface (#242420) with light text and a soft border, fully readable.
      Data: Same green/red/purple data colors as the light render — the Imprint green scatter points, red-flagged outliers, purple regression line, and green CI band (rendered slightly darker/richer against the dark backdrop but the same hues) are unchanged, confirming only chrome flipped between themes.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, subtitle, axis labels, ticks, legend, annotation) remains legible on the near-black surface.
