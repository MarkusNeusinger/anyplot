review:
  strengths:
  - 'Full statistical treatment: regression line, 95% confidence band, R², and the
    fitted equation are all present and clearly rendered'
  - Theme-adaptive chrome is executed correctly — both light and dark renders are
    legible, and data colors are held identical across themes
  - 'Idiomatic bokeh patterns: ColumnDataSource, a Band model for the CI shading,
    HoverTool with formatted tooltips, and a layered Title for the subtitle'
  - Canvas is exactly 3200×1800 with generous min_border reservations — no clipping
    at any edge
  - Clean, reproducible, KISS-structured code with an explicit seed and current bokeh
    3.9 API (p.scatter, not the deprecated p.circle)
  weaknesses:
  - Outlier points are recolored to matte red (#AE3030) against the green (#009E73)
    baseline points, but the legend still shows a single 'Data Points' entry — there
    is no legend entry or annotation explaining what the red points mean, so viewers
    cannot decode the color. Red-vs-green is also the classic color-vision-deficiency
    confusion pair, making this the sole (and inaccessible) signal for an important
    piece of information. Either add a legend entry / caption naming the outlier highlighting,
    or drop the two-color scheme and render all points in the single Imprint green.
  - If the outlier highlighting is kept, add a redundant channel (e.g. a distinct
    marker outline or slightly larger size for outliers) so the distinction survives
    when red/green cannot be resolved.
