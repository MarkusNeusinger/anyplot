review:
  strengths:
  - 'First categorical series is exactly #009E73 and the Imprint palette + theme-adaptive
    chrome (background, ink, ink_muted) is applied consistently and identically across
    light and dark renders.'
  - R² is folded prominently into the title and the fit equation into the regression-line
    legend label — a creative solution given pygal's lack of a free-text annotation
    API (explicitly documented in code comments).
  - Scatter alpha (dot_opacity=0.65) matches the spec's requested moderate transparency
    (~0.6-0.7).
  - The 95% CI band is implemented as a single closed polygon (upper boundary + reversed
    lower boundary) — a clever workaround for pygal's lack of a native fill-between/regression-band
    primitive.
  - Title font size is computed via an explicit formula scaled off the 67-char mandated-title
    baseline, avoiding overflow for the longer descriptive-prefixed title.
  - Clean KISS-structured code, seeded reproducible data (np.random.seed(42)), only-used
    imports.
  weaknesses:
  - 'VQ-05: The left margin has a large dead-space column (~20-25% of canvas) below
    the legend, running from the bottom of the legend down to the bottom-left corner,
    while the scatter data crowds right up to the right canvas edge. Margins read
    as imbalanced rather than centered/balanced. Consider narrowing the legend column
    or adding matching right-side margin so the plot doesn''t read as pinned to the
    right.'
  - 'SC-02: The 95% CI band''s boundary stroke is quite thick and dark because it
    inherits the global stroke_width=6 token (set high so the regression line reads
    as bold) — this makes the band read more like a bold outlined ribbon than the
    soft semi-transparent shading the spec asks for. Consider a dedicated lower stroke
    width or higher fill-alpha specifically for the CI polygon so it reads as gentler
    shading.'
  - 'DE-01/DE-02: Overall polish is solid but still close to a well-configured default
    rather than genuinely distinctive publication-grade design — consider more deliberate
    visual-hierarchy choices (e.g., de-emphasizing the CI-band outline, tightening
    the left-column whitespace) to push past ''good'' into ''excellent''.'
  - Title spans ~87% of canvas width — comfortably under the clipping threshold but
    close to the ~90% ceiling; if the descriptive prefix grows in a future edit, revisit
    the font-scaling formula.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "Advertising Spend vs. Revenue (R² = 0.954) · scatter-regression-linear · python · pygal · anyplot.ai" in dark ink, fully visible, spans ~87% of canvas width, not clipped. X-axis title "Advertising Spend ($K)" and y-axis title "Revenue ($K)" in dark ink, clearly readable. Tick labels on both axes dark and legible. Dotted grid lines are subtle gray, visible but not dominant. Legend (top-left) lists "Data Points" (green swatch), "95% CI Band" (gray swatch), "Regression Line (y = 4.73x + 30.6)" (purple swatch), all in dark, readable text.
      Data: Scatter dots in Imprint green #009E73 at moderate transparency, showing a clear positive linear trend with realistic noise/spread and a few mild outliers. A gray semi-opaque confidence band (with a fairly thick/dark outline) surrounds a solid purple/lavender regression line running through the point cloud.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, fully legible against the dark background. Grid lines remain subtle, muted gray-toned dashes, visible without dominating. Legend in the same top-left position with the same three entries, text rendered in light ink and fully readable.
      Data: Scatter dots remain the identical Imprint green #009E73, the regression line remains the identical purple/lavender, and the CI band remains the identical muted gray fill/outline as the light render - only the chrome (background + text + grid) flipped, confirming palette consistency across themes.
      Legibility verdict: PASS - all text is clearly readable against the dark background; no dark-on-dark failures observed.
