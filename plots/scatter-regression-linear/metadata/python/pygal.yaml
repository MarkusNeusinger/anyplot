review:
  strengths:
  - The attempt-2 CI-band rendering bug (thick stray vertical bar at the band's left
    cap) is fully fixed — rebuilt as two independent open-curve fills (upper-bound
    fill + page-background erase layer) instead of one hand-closed polygon, and both
    renders now show a clean diagonal-capped band with no artifact.
  - The 95% CI band now reads as genuine soft translucent shading (fill-opacity 0.3,
    thin 1.5px low-opacity boundary stroke) rather than the bold opaque ribbon of
    earlier attempts, resolving the SC-02 note from Review 1 and 2.
  - 'Attempt-1''s VQ-05 margin imbalance stays fixed: the 3-column legend sits centered
    below the x-axis title with balanced left/right margins and no dead-space column.'
  - 'First categorical series is exactly #009E73, backgrounds are correctly #FAF8F1
    (light) / #1A1A17 (dark), and data colors are pixel-identical across both renders
    — only chrome flips.'
  - R² is folded prominently into the title and the fit equation into the regression-line
    legend label, a well-documented workaround for pygal's lack of a free-text annotation
    API.
  - 'Clean, reproducible, KISS-structured code: single seed, only-used imports, no
    fake interactivity, correct plot-{THEME}.png/.html outputs.'
  weaknesses:
  - 'Overall design polish is solid and workmanlike but still short of publication-tier:
    the y-axis boundary line and chart chrome remain close to pygal defaults beyond
    the custom Style tokens, and the CI band, while now soft, doesn''t clearly let
    grid lines show through it in dense crossing regions.'
  - The mandated title plus the added R² clause spans roughly 85% of canvas width
    — well within the no-clipping/no-overflow bound, but there is little headroom
    left if the title needs to grow further; keep an eye on the char-count-based font-scaling
    formula.
  - The per-series opacity/stroke overrides depend on injected raw CSS with !important
    to beat pygal's own scoped .reactive rule — functionally correct and clearly commented,
    but a workaround rather than a first-class pygal styling API, so it's fragile
    to future pygal version changes to its generated CSS class names.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Title "Advertising Spend vs. Revenue (R² = 0.954) · scatter-regression-linear · python · pygal · anyplot.ai" renders fully in dark ink across ~85% of canvas width, not clipped at any edge. Axis titles "Advertising Spend ($K)" / "Revenue ($K)" and all tick labels are dark, legible, and proportionate. Subtle dashed gridlines on both axes. The 3-column legend ("95% CI Band" gray swatch, "Data Points" green swatch, "Regression Line (y = 4.73x + 30.6)" purple swatch) sits centered below the x-axis title with balanced margins on both sides - no left dead-space column.
      Data: 90 green (#009E73) scatter points at moderate transparency (dot_opacity=0.65) showing a clear, realistic positive linear trend with noise. A soft translucent gray 95% CI band (fill-opacity 0.3, thin low-opacity boundary) hugs a solid light-purple regression line running through the cloud. The band's left cap now closes cleanly with a diagonal edge - the thick stray vertical-bar artifact from the previous attempt is gone (verified by cropping/zooming into the band's left cap and the region where it crosses a gridline).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now in light ink, fully legible, not clipped top or bottom. Same balanced 3-column legend, light-ink text, fully readable. No dark-on-dark issues anywhere.
      Data: Colors are pixel-identical to the light render (green dots, purple regression line, gray CI band) - only chrome flipped. The same left-cap region was cropped and checked: band closes cleanly with no artifact, matching the light render.
      Legibility verdict: PASS
