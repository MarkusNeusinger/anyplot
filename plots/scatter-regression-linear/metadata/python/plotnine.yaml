review:
  strengths:
  - 'Correct Imprint palette: brand green #009E73 for scatter points, position-2 lavender
    #C475FD for the regression line and CI band, identical across light and dark renders'
  - Theme-adaptive chrome (PAGE_BG/INK/INK_SOFT tokens) correctly threads through
    title, axis text, grid, and annotation — fully legible in both themes with no
    dark-on-dark or light-on-light failures
  - Canvas gate passed cleanly at 3200x1800 with balanced margins, no clipping or
    overflow
  - 'Idiomatic ggplot-grammar composition: geom_point + geom_smooth(method=''lm'',
    se=True) + annotate, single fluent expression, no boilerplate'
  - Realistic, neutral educational dataset (study hours vs. exam score) with genuine
    noise (R²=0.871, not a suspiciously perfect fit) and scores clipped to valid [0,100]
    bounds
  - Reproducible (np.random.seed(42)), clean imports, KISS structure with no functions/classes
  weaknesses:
  - Annotation text (equation + R²) uses size=3.5 (~10pt), close to tick-label scale
    and smaller than the axis title — readable at full 3200x1800 resolution but risks
    becoming illegible when the PNG is scaled to ~400px mobile width; since the spec
    asks for R² to be displayed 'prominently', bump the annotation size to ~4.5-5mm
    or add slight weight/emphasis.
  - Design Excellence mostly executes the prescribed style-guide defaults (grid alpha,
    L-shaped spines, standard theme_minimal typography) rather than adding distinctive
    polish — consider a subtle callout box behind the equation/R² text, a bolder title
    weight, or refined typography to lift aesthetic sophistication.
  - A handful of near-duplicate points (e.g. around x=6.4-6.5 and x=9.6-9.7) stack
    almost exactly and read as slightly darker blobs — a thin white edge on markers
    (per the style guide's 'Data Element Styling' recommendation) would help separate
    overlapping points.
  - geom_smooth(method='lm') is the standard ggplot-family regression pattern (shared
    with ggplot2/letsplot) rather than a plotnine-distinctive flourish — Library Mastery
    would score higher with a feature more unique to plotnine specifically.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark — matches the required light-theme surface.
      Chrome: Title "scatter-regression-linear · python · plotnine · anyplot.ai" in dark ink, centered, ~72% of plot width, fully legible. Axis titles "Study Hours" and "Exam Score (%)" in dark ink, clearly readable. Tick labels in soft gray ink, readable. Grid lines faint vertical/horizontal lines at major ticks, subtle and non-competing.
      Data: Scatter points in Imprint brand green (#009E73) at alpha ~0.7, showing a clear upward linear trend with realistic noise. Regression line in Imprint position-2 lavender (#C475FD), solid and visually distinct from the green points. Semi-transparent lavender confidence band surrounds the line. Text annotation "y = 5.26x + 43.53" / "R² = 0.871" in dark ink, positioned top-left inside the plot area, small but readable at full resolution.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light — matches the required dark-theme surface.
      Chrome: Title in light/off-white ink, fully legible against the dark background. Axis titles in light ink, readable. Tick labels in soft light-gray ink, readable. Grid lines faint, subtle, visible without competing with data.
      Data: Scatter points remain the identical brand green (#009E73) — confirmed unchanged from the light render. Regression line remains the identical lavender (#C475FD), clearly visible against the dark background. Confidence band renders as a semi-transparent dark-purple wash around the line, still legible. Annotation text renders in light ink, readable — no dark-on-dark failure detected.
      Legibility verdict: PASS
