review:
  strengths:
  - Rug plot along the bottom axis (via blended_transform_factory) adds the marginal
    x-distribution — a sophisticated matplotlib transforms technique that goes beyond
    a basic scatter+regression.
  - Confidence-interval band uses a correct t-distribution standard-error formula
    and renders as a clean, semi-transparent lavender fill that never obscures the
    underlying points.
  - 'Correct Imprint palette usage: brand green (#009E73) scatter points with the
    regression line in palette position 2 (#C475FD, lavender) — identical data colors
    across both themes.'
  - 'Theme-adaptive chrome is fully threaded through: title, axis labels, ticks, grid,
    spines, legend frame, and the equation/R² annotation box all flip correctly between
    light and dark with no legibility issues.'
  - Realistic, neutral educational dataset (study hours vs. exam scores) with sensible
    score clipping (20-100) producing a plausible R² = 0.848.
  - Equation and R² annotation is clearly rendered in a theme-adaptive callout box,
    directly satisfying the spec's request to display the regression fit prominently.
  weaknesses:
  - 'Title omits the required language segment: currently "scatter-regression-linear
    · matplotlib · anyplot.ai" but the mandated format is "{spec-id} · {language}
    · {library} · anyplot.ai" — fix to "scatter-regression-linear · python · matplotlib
    · anyplot.ai".'
  - Scatter marker size (s=100) sits at the floor of the recommended 100-200 range
    for this 80-point density; a few overlapping clusters (e.g. around x≈6.3-6.5,
    y≈70-75) blur into blobs — bump to ~120-140 for cleaner point separation.
  - Library Mastery is solid but not exceptional — beyond the rug-plot transform trick,
    the rest of the implementation (scatter, fill_between, polyfit) is fairly generic
    matplotlib/numpy usage; consider a distinctive touch such as ax.annotate with
    an arrow pointing at a notable outlier.
