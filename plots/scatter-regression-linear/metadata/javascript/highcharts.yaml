review:
  strengths:
  - Genuine SVG-path rendering of the 95% CI band via chart.events.render + axis.toPixels,
    sidestepping the forbidden highcharts-more arearange module with a real (not faked)
    redraw-safe technique — strong library mastery.
  - R² and the fitted regression equation (y = mx + b) are displayed prominently in
    the subtitle, exactly as the spec requests.
  - Scatter marker alpha (0.65) and CI band alpha (0.18) match the spec's density/transparency
    guidance precisely.
  - Deterministic seeded data generation (fixed-seed LCG + Box-Muller normal noise)
    gives full reproducibility with no external RNG dependency.
  - Theme-adaptive chrome is correctly threaded through title/subtitle/axes/legend/tooltip;
    both renders are legible with identical data colors and only chrome flipping.
  weaknesses:
  - Title uses only the mandated boilerplate without the optional descriptive prefix;
    the spec explicitly asks for 'a descriptive title mentioning the regression analysis'
    — consider prefixing with something like 'Ad Spend vs. Sales Revenue · ' before
    the mandated 'scatter-regression-linear · javascript · highcharts · anyplot.ai'
    suffix.
  - The '95% Confidence Interval' legend entry borrows the circular point-marker icon
    from its placeholder empty column series, which visually reads like a data point
    rather than a shaded band — consider a legend symbol/icon override so the icon
    reads as a translucent rectangle matching the actual band fill.
  - Two small helper functions (lcg, randNormal) are used purely for deterministic
    data generation; reasonable given JS has no seeded-RNG standard library, but strict
    KISS scoring still notes function usage beyond a flat script.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Dark bold title "scatter-regression-linear · javascript · highcharts · anyplot.ai" at top center, gray subtitle "R² = 0.836 · y = 3.48x + 20.9" beneath it, top-left legend with three entries (Observations, Regression fit, 95% Confidence Interval) in soft dark-gray text, dark-gray axis titles ("Advertising Spend ($k)", "Sales Revenue ($k)") and tick labels, subtle horizontal gridlines. All chrome text is clearly readable against the light background.
      Data: ~160 semi-transparent green (Imprint #009E73) scatter points showing a clear positive linear trend, a solid blue/indigo regression line running through the cloud, and a light gray semi-transparent confidence band hugging the line. First categorical series is the Imprint brand green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: White bold title, light-gray subtitle with the same R²/equation text, top-left legend in light-gray text, light-gray axis titles and tick labels, subtle horizontal gridlines visible against the dark surface. No dark-on-dark text anywhere — all chrome reads clearly.
      Data: Same green scatter points and same blue/indigo regression line color as the light render (only chrome flipped, as required); the CI band renders as a subtle dark-blue-gray translucent shape appropriate for the dark surface.
      Legibility verdict: PASS
