review:
  strengths:
  - Manually computed OLS regression with a proper t-distribution 95% confidence band
    (Cornish-Fisher t-quantile), not a canned/fake fit
  - 'Correct Imprint palette application: first series #009E73 for scatter points,
    palette[1] consistently reused for both the regression line and the CI band tint'
  - Equation + R² annotation rendered as a theme-adaptive bordered callout box, verified
    readable in both light and dark renders
  - 'Idiomatic echarts technique: stacked-area composition (invisible lower-bound
    line + stacked area) to render the confidence band'
  - 'Full theme correctness — both renders use the correct #FAF8F1 / #1A1A17 backgrounds
    with all chrome (title, legend, ticks) readable'
  weaknesses:
  - Design excellence stays close to the library skeleton defaults — axis lines are
    kept at full visibility rather than minimized, and the grid/legend styling doesn't
    push meaningfully beyond token mapping; consider a subtler axisLine or y-axis-only
    split lines for more visual refinement
  - The dense point cluster around x=14-15 has several overlapping markers; a touch
    more opacity variance or slightly smaller symbolSize in that range would help
    distinguish individual observations
  - The regression line and the CI band both derive from the same palette[1] hue with
    no additional tonal differentiation (only opacity), so the line has to do all
    the work of standing out from its own band edge
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Ad Spend vs Sales Revenue · scatter-regression-linear · javascript · echarts · anyplot.ai" centered top in dark ink, clearly legible. Legend below title ("Weekly observations", "Linear fit", "95% confidence band") in soft dark gray, all readable. X-axis "Advertising Spend ($1,000s)" and Y-axis "Weekly Sales Revenue ($1,000s)" labels dark and legible with visible units. Tick labels soft gray, subtle horizontal/vertical gridlines visible but unobtrusive. Equation callout box bottom-right ("y = 4.86x + 34.1 · R² = 0.866") uses a near-white elevated background with bold dark text and a thin border — fully legible.
      Data: ~70 green (#009E73) scatter points at alpha ~0.65 showing a clear positive linear trend with realistic noise; a solid purple regression line (palette[1]) cuts through the cloud; a semi-transparent purple confidence band (opacity ~0.18) surrounds the line, widening slightly at the extremes as expected for OLS prediction intervals.
      Legibility verdict: PASS — no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title now in light/white ink, clearly legible against the dark background. Legend text light gray, fully readable. Axis titles and tick labels light-colored and legible; gridlines subtle but visible. Equation callout box uses a darker elevated background (distinct from the page background) with light bold text and a thin border — no dark-on-dark failure; the box remains clearly distinguishable from the surrounding chart area.
      Data: Data colors are pixel-identical to the light render — same green scatter points, same purple regression line and CI band hue (only the band's fill reads slightly more saturated against the dark backdrop, which is an expected consequence of the shared opacity value, not a color change).
      Legibility verdict: PASS — all chrome elements read clearly against the dark surface; brand green remains vivid.
