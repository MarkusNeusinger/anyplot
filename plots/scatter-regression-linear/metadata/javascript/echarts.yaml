review:
  strengths:
  - 'Repair loop fixes are real and visible: axis lines were dimmed from t.inkSoft
    to the softer t.grid token, the x-axis vertical splitlines were removed, and the
    confidence band gained a distinct dashed border (opacity 0.4, width 1) — directly
    resolving the Review 1 weakness that axis lines stayed at full visibility and
    the band/line shared one undifferentiated hue.'
  - Manual OLS regression with a proper t-distribution 95% confidence band (Cornish-Fisher
    t-quantile expansion), not a canned or fake fit.
  - 'Correct Imprint palette application: first series #009E73 for scatter points,
    palette[1] consistently reused across the regression line, the CI band fill, and
    its new border.'
  - Equation + R² annotation rendered as a theme-adaptive bordered callout box, legible
    in both renders and positioned so nothing clips at the canvas edge.
  - 'Full theme correctness — both renders use the correct #FAF8F1 / #1A1A17 backgrounds
    with all chrome (title, legend, ticks) readable.'
  weaknesses:
  - Design excellence still reads as a fairly plain two-color composition; DE-01 would
    benefit from an additional refinement layer (e.g. a subtle marker edge stroke
    or a secondary accent) to move further past a well-configured library skeleton.
  - The dense cluster of overlapping points around x=14-15 still visually merges into
    a single blob even after the symbolSize (14→12) and alpha (0.65→0.55) reduction
    — a thin white marker stroke (per the style guide's 'white edge' scatter recommendation)
    would help separate overlapping observations.
  - 'LM-02: the stacked-area CI band trick is a genuine echarts idiom but a fairly
    common one; leaning on a more distinctive feature (e.g. visualMap, markArea, or
    graphic-layer emphasis) would push Library Mastery higher.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Ad Spend vs Sales Revenue · scatter-regression-linear · javascript · echarts · anyplot.ai" centered top in dark ink, clearly legible, comfortably sized (~40% of canvas width, no clipping). Legend below title ("Weekly observations", "Linear fit", "95% confidence band") in soft dark gray, fully readable. X-axis "Advertising Spend ($1,000s)" and Y-axis "Weekly Sales Revenue ($1,000s)" labels dark and legible with visible units. Tick labels soft gray. Horizontal gridlines are subtle; vertical splitlines have been removed, giving a cleaner look than the previous attempt. Axis lines are now the dimmer grid-token color rather than full-strength ink. Equation callout box bottom-right ("y = 4.86x + 34.1 · R² = 0.866") uses a near-white elevated background with bold dark text and a thin border, positioned well clear of the canvas edge.
      Data: ~70 green (#009E73) scatter points at alpha ~0.55 showing a clear positive linear trend with realistic noise; a solid purple regression line (palette[1]) cuts through the cloud; a semi-transparent purple confidence band (opacity ~0.16) surrounds the line, now with a visible dashed purple border along its edge that gives the band a distinct silhouette from the solid fit line. A small cluster of overlapping points remains around x=14-15 but is still individually distinguishable.
      Legibility verdict: PASS — no light-on-light text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title now in light/white ink, clearly legible against the dark background. Legend text light gray, fully readable. Axis titles and tick labels light-colored and legible; gridlines subtle but visible; vertical splitlines absent as in the light render. Equation callout box uses a darker elevated background (distinct from the page background) with light bold text and a thin border — no dark-on-dark failure.
      Data: Data colors are identical to the light render — same green scatter points, same purple regression line, and the same dashed-border confidence band treatment (reads slightly more saturated against the dark backdrop, an expected consequence of shared opacity, not a color change).
      Legibility verdict: PASS — all chrome elements read clearly against the dark surface; brand green remains vivid.
