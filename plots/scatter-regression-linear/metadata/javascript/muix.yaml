review:
  strengths:
  - 'All required statistical elements present: regression line, 95% CI band, R²/r,
    and the fitted equation, matching every bullet in the spec''s Notes section.'
  - Confidence band correctly uses the theme-adaptive "muted" anchor (per the style
    guide's documented confidence-band-fill role), so it looks appropriate in both
    themes without a custom hex.
  - Advanced, idiomatic use of MUI X's useXScale/useYScale hooks to render a custom
    band overlay — real library mastery, not a generic default chart.
  - Canvas is exactly on-target (3200x1800) with generous margins; no clipping anywhere
    in either render.
  - Data colors are identical between light and dark; only chrome flips, exactly as
    required.
  weaknesses:
  - Regression line color (t.palette[2], blue) skips t.palette[1] (lavender) without
    a documented semantic justification — use the next ordinal palette position (t.palette[1])
    for the second series, or make the semantic case explicit if blue is intentional.
  - Scatter markers (size 7, alpha ~0.6) are solid but could be a touch more prominent
    given the point count is on the lower-density side (90 points, well under the
    500-point 'reduce size' threshold) — a marginal size bump would sharpen the cloud
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-regression-linear · javascript · muix · anyplot.ai" is dark and centered, fully readable. Axis labels ("Advertising Spend ($k)", "Sales Revenue ($k)") and tick labels are dark and crisp. Equation annotation ("y = 3.59x + 16.4 · R² = 0.828 · r = 0.910") and confidence-band caption are gray but legible. Horizontal-only gridlines are subtle.
      Data: ~90 semi-transparent brand-green (#009E73-based) scatter points, a solid blue regression line, and a light-gray shaded 95% confidence band. Clear upward linear trend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels flip to light/white text, fully readable. Equation and confidence-band caption text dims slightly but remains legible — no dark-on-dark failure.
      Data: Same brand-green points and blue regression line as the light render (colors identical between themes, only chrome flipped). Confidence band renders as a visible lighter-gray tint against the near-black surface via the theme-adaptive "muted" anchor.
      Legibility verdict: PASS
