review:
  strengths:
  - Composes the chart from ChartsDataProvider + ChartsSurface and draws the confidence
    band and fit statistics as custom SVG components that read the chart's own scales
    through useXScale/useYScale/useDrawingArea, so band, line and points share one
    coordinate system
  - 'Statistically correct band: 95% CI for the mean response from the residual standard
    error and a t critical value (df = 88), visibly narrowest at the x mean and widening
    toward both ends'
  - 'Clear typographic hierarchy: bold 22 px R² in the empty top-left corner with
    a softer equation beneath it, and a three-tier header that explains the fit (n,
    r) and what the shaded band is, standing in for a legend'
  - 'Fully theme-adaptive chrome: ink regression line (dark on light, light on dark),
    muted band fill and page-coloured marker outlines flip with the theme while the
    brand-green points stay identical'
  - Deterministic LCG data with a plausible advertising-spend vs. sales-revenue scenario;
    sign of r and slope agree with the rising line
  weaknesses:
  - 'Suggestion: a descriptive title prefix such as ''Ad Spend vs. Sales Revenue Regression
    · '' would name the regression analysis in the title itself, not only via the
    spec id and subtitle.'
  - 'Suggestion: x ticks every 2 $k (23 vertical grid lines) make the grid busier
    than the data needs; a 5 $k step would quieten the background.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
