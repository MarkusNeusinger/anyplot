review:
  strengths:
  - 'Full spec compliance: fitted regression line, 95% confidence band, R² and r annotated
    prominently, explicit regression equation, and point alpha (~0.6) all match the
    spec''s notes.'
  - 'Correct Imprint palette usage: first series is brand green #009E73, the regression
    line uses a distinct blue from the palette, and the confidence band correctly
    reaches for the theme-adaptive ''muted'' anchor for its fill — data colors are
    identical between light and dark renders.'
  - 'Advanced, idiomatic MUI X composition: uses ChartContainer with independent ScatterPlot/LinePlot
    layers plus useXScale/useYScale hooks to hand-draw the confidence-band SVG path
    — a genuinely library-distinctive technique.'
  - Realistic, neutral dataset (advertising spend vs. sales revenue) with plausible
    scale, natural noise, and a believable R² (0.828).
  - Deterministic seeded LCG data generation, correct skipAnimation handling, and
    clean adherence to the harness's default-export/mount contract.
  weaknesses:
  - 'CRITICAL (VQ-02, both themes): the y-axis title ''Sales Revenue ($k)'' collides
    directly with the ''140'', ''120'', and ''100'' tick labels — the rotated axis-title
    letters visibly strike through the tick digits, making both hard to read at that
    spot. Root cause is insufficient clearance between the y-axis label and 3-digit
    tick labels at the current margin.left=104 with tickLabelStyle fontSize=14 / labelStyle
    fontSize=16. Fix: increase margin.left (e.g. to ~140-150) and/or push the y-axis
    label further out from the tick labels (e.g. via a `sx` override on `.MuiChartsYAxis-label`
    translateX, or by widening the axis'' reserved label space) so the two never overlap
    in either theme.'
  - Design Excellence is solid but not yet publication-ready — typography and color
    choices work but read as a well-executed default rather than a distinctive, highly
    polished composition.
  - No legend distinguishes observed points from the fitted line; readers unfamiliar
    with the green-points/blue-line convention have to infer it from the equation
    annotation alone — a small inline legend or direct labels would remove the ambiguity
    (minor, optional).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Bold dark title "scatter-regression-linear · javascript · muix · anyplot.ai" centered at top, readable. Equation annotation "y = 3.59x + 16.4 · R² = 0.828 · r = 0.910" and the confidence-band note sit clearly above the plot area, fully readable, no clipping. X-axis label "Advertising Spend ($k)" and tick labels (6-50) are clean and legible with no overlap. However, the Y-axis label "Sales Revenue ($k)" (rotated) is positioned directly on top of the "140", "120", and "100" tick labels — the axis-title letters visibly cross through the tick digits, making both partially hard to read at that spot.
      Data: First/only categorical series renders in brand green #009E73 (with ~0.6 alpha) for the 90 scatter points; the regression line is a contrasting blue; the confidence band is a soft grey (muted anchor) semi-transparent fill. Colors read clearly against the light background.
      Legibility verdict: FAIL (y-axis label overlaps 3 tick labels — see chrome notes above; everything else passes)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, equation annotation, and x-axis label/ticks all render in light ink and are clearly legible against the dark background — no dark-on-dark failures anywhere else. Same y-axis label/tick-label overlap defect reproduces identically here: "Sales Revenue ($k)" collides with "140"/"120"/"100" tick labels.
      Data: Scatter points and regression line use the identical colors as the light render (brand green #009E73 points, blue regression line, muted-grey confidence band) — only the chrome (background, text, grid) flipped as expected.
      Legibility verdict: FAIL (same y-axis label/tick overlap as the light render; all other text passes)
