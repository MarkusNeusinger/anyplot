review:
  strengths:
  - 'Perfect Imprint palette compliance: first series is #009E73 green, regression
    line and CI band use Imprint blue, and both renders have theme-correct chrome
    (cream/near-black backgrounds, correctly flipped text)'
  - 'All spec-required features present: R² and r shown prominently in a callout box,
    regression equation annotation, semi-transparent 95% CI band, and scatter points
    at the spec-recommended alpha (~0.65)'
  - 'Clean, idiomatic d3 usage: d3-scale/d3-axis/d3-shape (area + line generators)
    combined with a manual OLS + confidence-interval calculation, seeded deterministic
    data generation, and a proper `.data().join()` pattern'
  - 'Legible, well-balanced layout: no clipped or overlapping elements, legend clearly
    placed near the plot, custom legend correctly documents all three visual encodings
    (data, fit, CI band)'
  weaknesses:
  - 'Redundant/confusing axis units: both axis titles already say "($ thousands)"
    but the tick formatters also append a "K" suffix (e.g. y-tick shows "$1,400K").
    Read literally, "($ thousands)" plus a "K"-suffixed tick implies the value is
    in thousands-of-thousands, which is not the intent. Fix: either drop "($ thousands)"
    from the axis titles (since the ticks already show "$20K" / "$1,400K" including
    the unit) or strip the "K" from the tick formatter and keep the parenthetical
    unit only.'
  - 'Design Excellence is solid but not exceptional: grid, spines, and callout box
    follow the recommended defaults competently but don''t yet show a distinctive
    aesthetic flourish (e.g. a more refined stat-box treatment, subtler axis domain
    lines, or additional visual hierarchy beyond line + band + annotation).'
  - 'Library Mastery is generic: the regression/CI computation and rendering approach
    here could be replicated in most other libraries with only minor syntax changes.
    Consider leaning further into a d3-only capability in a future iteration.'
  - Double-check that `t.palette[2]` truly resolves to the identical hex in both theme
    renders — the regression line reads slightly more saturated/lighter in the dark
    render than in the light render; likely just background-contrast perception, but
    worth a token check.
