      Data: ~70 semi-transparent green (#009E73) scatter points with white/cream stroke, a solid blue (Imprint palette position 3) regression line, and a light gray 95% confidence band. A callout box top-left in a lighter elevated cream shows "R² = 0.84 (r = 0.92)" and "y = 12.2x + 243" in dark text, clearly readable.
      Legibility verdict: PASS — all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light/white ink, clearly visible against the dark background. Tick labels in light gray, readable. Gridlines are subtle light-gray-on-dark. Legend box bottom-right uses the same light text, fully legible. Callout box top-left uses a darker elevated panel (~#242420) with light text for the R²/equation annotation — clearly readable, no dark-on-dark failure.
      Data: Same green (#009E73) scatter points, same blue regression line, same light gray CI band — colors are visually identical to the light render; only the chrome (background/text/grid/legend frame) flipped as required.
