review:
  strengths:
  - 'Palette fix applied correctly: regression line now uses canonical position 2
    (#C475FD lavender) instead of skipping to position 3'
  - New annotation callout (leader line + anchor dot + rounded box) directly visualizes
    the regression equation on the fit line, addressing both the DE feedback and the
    spec's annotation note
  - Callout box is correctly theme-adaptive (t.elevatedBg fill, t.grid border, t.ink
    text) and legible in both renders
  - 'All spec-required features remain present: R² in subtitle, visually distinct
    regression line, semi-transparent 95% CI band, alpha-0.65 scatter points'
  - Both renders remain correctly theme-adapted with no dark-on-dark/light-on-light
    failures; data colors are identical across themes
  - Canvas is exactly 3200x1800 landscape with no clipped or overflowing chrome text
  weaknesses:
  - The callout box's top-right rounded corner overlaps/clips the top portion of a
    nearby data point in both light and dark renders; the box's collision-avoidance
    logic does not account for nearby scatter points
  - Design excellence is improved but still moderate - most of the chart (legend,
    axis styling, grid) remains close to library/token defaults; the callout is currently
    the only bespoke visual element
  - Helper functions (lcg, randNormal, withAlpha) plus the new calloutPlugin object
    keep the file a step above pure KISS single-block style, though largely justified
    by the lack of a browser-native seeded RNG and the plugin API's requirements
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches spec.
      Chrome: Dark-ink title "scatter-regression-linear · javascript · chartjs · anyplot.ai", softer-ink subtitle "R² = 0.817", legend ("95% Confidence Interval", "Linear regression", "Observations") and axis titles/ticks all in dark ink / soft gray - all clearly readable.
      Data: ~70 semi-transparent brand-green (#009E73) points with pale page-colored edge stroke; solid lavender (#C475FD, canonical palette position 2) regression line; light-gray 95% CI band; new annotation callout box "y = 1.97x + 12.3" connected via a thin lavender leader line to a point on the regression line.
      Legibility verdict: PASS. Minor non-legibility issue: the callout box's rounded corner clips the top portion of one nearby data point (VQ-02 deduction, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches spec.
      Chrome: Same title/subtitle/legend/axis text now rendered in light ink - clearly legible, no dark-on-dark failures. Gridlines dim but visible.
      Data: Colors pixel-identical to the light render (green points, lavender regression line, lavender leader line); only the CI-band fill, callout box fill/border, and chrome adapt to the dark surface.
      Legibility verdict: PASS. Same minor callout/data-point overlap present as in the light render.
