review:
  strengths:
  - 'All spec-required features present: R² and regression equation shown prominently
    in the subtitle, visually distinct blue regression line, semi-transparent 95%
    CI band, and moderately transparent (alpha 0.65) scatter points'
  - Confidence-band fill correctly uses the theme-adaptive 'muted' semantic anchor
    per the style guide rather than an arbitrary gray or a categorical palette slot
  - 'Clever idiomatic Chart.js technique: two zero-width line datasets with fill:
    ''-1'' compose the CI band, with legend.filter hiding the empty-label helper dataset
    so only three clean legend entries show'
  - Both renders are correctly theme-adapted — background, ink, grid, and legend colors
    all flip correctly with no dark-on-dark or light-on-light failures, and data colors
    (green points, blue line) are identical across themes
  - Deterministic, seeded LCG-based data generation (n=70, within the 30-300 recommended
    range) with a realistic, neutral ad-spend-vs-revenue scenario and plausible value
    ranges
  - Canvas is exactly 3200×1800 landscape with comfortable margins — no clipped or
    overflowing text in either render
  weaknesses:
  - Regression line uses t.palette[2] (#4467A3 blue, canonical position 3), skipping
    canonical position 2 (#C475FD lavender) — the style guide's hard rule is to use
    positions 1→N in order without cherry-picking; switch to t.palette[1] for the
    line color
  - 'Design excellence is only moderately above baseline: aside from the R²/equation
    subtitle and the muted CI-band fill, there''s little additional visual hierarchy
    or refinement (e.g. no callout/annotation box for the equation, no accent styling
    to draw the eye to the trend beyond the line itself)'
  - Three small helper functions (lcg, randNormal, withAlpha) push slightly past pure
    KISS single-block style, though this is largely justified by the lack of a browser-native
    seeded RNG
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-regression-linear · javascript · chartjs · anyplot.ai" in bold dark ink, subtitle "R² = 0.817 · y = 1.97x + 12.3" in softer gray ink beneath it, legend row ("95% Confidence Interval", "Linear regression", "Observations") in dark ink, axis titles "Monthly Ad Spend ($1,000s)" / "Monthly Sales Revenue ($1,000s)" in dark ink, tick labels in a lighter soft-ink gray. All fully legible against the light background. Light gray gridlines are visible but subtle.
      Data: ~70 semi-transparent brand-green (#009E73) points with a light-toned border, a solid blue regression line, and a light gray shaded confidence band behind the line. Clear upward linear trend with realistic scatter/noise.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle/legend/axis text now rendered in light ink (near-white for title/legend/axis titles, softer light-gray for tick labels and subtitle) — clearly readable against the dark background, no dark-on-dark failures observed. Gridlines are a dim, subtle gray, visible without dominating.
      Data: Same brand-green points and blue regression line as the light render — colors are pixel-identical between themes. Confidence band fill uses a lighter, theme-adaptive muted gray so it still reads as a subtle band against the dark surface.
      Legibility verdict: PASS
