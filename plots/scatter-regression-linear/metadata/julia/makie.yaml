review:
  strengths:
  - Theme-adaptive chrome is correctly threaded through every element (title, axis
    labels, ticks, spines, grid, legend, and the equation card background) in both
    light and dark renders
  - First categorical series is the correct Imprint brand green (#009E73); regression
    line/band use Imprint blue (#4467A3), identical between themes
  - Equation callout is a genuinely refined layered card (drop-shadow rect + bordered
    panel) rather than bare floating text, giving the R²/slope readout a clear focal
    point
  - 'All required spec elements present: visually distinct regression line, semi-transparent
    95% CI band, prominent R², and the regression equation as annotation'
  - Clean KISS structure with explicit font sizes throughout, reproducible via Random.seed!(42),
    and idiomatic Makie composition (band!/scatter!/lines! layering plus a proper
    Legend in its own grid column)
  - Realistic, neutral data scenario (temperature vs. energy consumption) with sensible
    real-world scale and a believable positive correlation
  weaknesses:
  - Scatter point alpha is 0.55, slightly below the spec's recommended 0.6-0.7 moderate-transparency
    range — bump to ~0.65 for closer compliance
  - Design is solid but fairly standard for the plot type beyond the equation card;
    a stronger typographic hierarchy or subtle emphasis on the trend (e.g. highlighting
    the fit direction) would push Aesthetic Sophistication further toward publication-ready
  - Legend/card layout uses Makie's grid system competently but doesn't reach for
    a more distinctive Makie-only capability (e.g. a custom recipe or theme) that
    would be harder to replicate in another library
  image_description: |-
