  strengths:
  - 'Correct plot type: scatter with linear regression fit and 95% confidence interval
    band, matching the spec exactly'
  - Regression equation (y = mx + b) and R² prominently annotated top-left, readable
    in both themes
  - Theme-adaptive chrome correctly implemented — identical data colors, correctly
    flipped background/text/grid between light and dark renders
  - 'Clean, idiomatic Makie code: KISS single-script structure, explicit font sizes
    throughout, correct Imprint palette usage (brand green for points, palette blue
    for fit line/band)'
  - Realistic, neutral data scenario (temperature vs. energy consumption) with plausible
    real-world scale and slope
  weaknesses:
  - Design Excellence is generic — the implementation closely follows library/style-guide
    defaults without additional visual sophistication, custom flourishes, or storytelling
    emphasis (DE-01, DE-02 both mid-range)
  - No legend or inline label identifies the shaded region as the “95% CI” band —
    relies on the reader recognizing the convention; a small annotation or legend
    entry would remove ambiguity
  - 'LM-02: the scatter + fit-line + band + text-annotation pattern is generic and
    directly portable to matplotlib/plotly/ggplot2 with only syntax changes — no Makie-distinctive
    feature (e.g. a Makie recipe, layout composition, or Observable-driven element)
    is used'
  - Minor marker overplotting in the densest x≈ 27–29 °C cluster — slightly lower
    alpha or smaller markersize in that region would improve density readability without
    losing signal
