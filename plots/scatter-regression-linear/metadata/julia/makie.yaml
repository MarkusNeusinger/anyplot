      Data: First series (scatter points) renders in Imprint brand green (#009E73) at moderate transparency; the linear fit line and 95% CI band render in Imprint blue (#4467A3); legend on the right lists "Observed data", "Linear fit", "95% CI band" matching the visual encoding.
      Legibility verdict: PASS — all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light/white tones, clearly legible against the dark background; spines and gridlines follow the same subtle treatment as the light render; the equation card flips to a dark elevated panel with light text, fully legible with no dark-on-dark failures.
      Data: Scatter points remain Imprint brand green (#009E73), identical to the light render; fit line and CI band remain Imprint blue (#4467A3), identical to the light render — only the chrome (background, text, grid, card, legend box) flipped.
      Legibility verdict: PASS — all text and data elements read clearly against the dark background; no dark-on-dark or contrast failures observed.
