review:
  strengths:
  - Correct 10x10 waffle with genuinely square cells via match_aspect=True and even
    page-colored gaps
  - 'Imprint palette in canonical order with #009E73 first; data colors identical
    across themes, chrome flips correctly'
  - Legend names each category with its percentage at 34pt with 60px swatches matching
    the squares
  - Squares derived directly from the tidy df with df.index.repeat, filled row by
    row from the bottom
  - HoverTool tooltips expose category and share in the interactive HTML
  weaknesses:
  - 'VQ-05 (both): the legend sits about 550 px right of the grid, 40 px from the
    right canvas edge, while about 570 px of empty page sits left of the grid, so
    the legend floats isolated and the whitespace is unbalanced → place the legend
    next to the grid (gap under ~100 px) and balance the margins around the grid+legend
    group. Likely cause: match_aspect=True centers the square grid inside a ~2600
    px wide frame while the legend is laid out in the separate ''right'' panel.'
  - 'VQ-05 (dark): a 1 px pale line (about #535350) outlines the plot frame at x=60
    and a near-white 1 px line runs along the canvas edge, visible on #1A1A17 → no
    frame or edge line. Likely cause: a seam at the frame/border-fill boundary and
    the HTML page background (default white body) showing at the canvas edge; set
    the document/body background to PAGE_BG or shrink the frame so no seam renders.'
  - 'Suggestion: the title sits only about 15 px above the top row of squares; a little
    more breathing room would ease the top edge.'
