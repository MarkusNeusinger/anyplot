review:
  strengths:
  - Clever repurposing of sns.heatmap with a ListedColormap and manual grid construction
    to render a native seaborn waffle chart, since the library has no dedicated waffle
    function
  - Floating-grid effect (linecolor=PAGE_BG, linewidths=2.5) with all spines removed
    gives clean square separation without a heavy frame
  - Deliberate bottom-to-top 'filling a glass' fill order anchors the dominant category
    (Very Satisfied, 42%) at the base, giving the grid a visual hierarchy beyond a
    flat category dump
  - 'Correct Imprint categorical palette in canonical order with brand green #009E73
    first, identical across both theme renders'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink/soft-ink text, no dark-on-dark or light-on-light failures'
  - Legend cleanly lists each category with its percentage, satisfying the spec's
    requirement to identify categories with their percentages
  - Deterministic, KISS-structured code with clean imports and no fake interactivity
  weaknesses:
  - 'Title omits the mandated language segment: it renders ''waffle-basic · seaborn
    · anyplot.ai'' but the required format is ''{spec-id} · {language} · {library}
    · anyplot.ai'' -> should read ''waffle-basic · python · seaborn · anyplot.ai''.
    Fix the fig.text() string literal on the title line.'
  - 'Design Excellence is solid but not exceptional: the composition is clean yet
    fairly minimal (flat color blocks, no secondary emphasis like a callout on the
    largest segment) - stops short of publication-grade polish.'
  - 'Library Mastery is only moderate: sns.heatmap is being used as a workaround for
    a chart type seaborn doesn''t natively support, which is a smart trick but still
    a generic underlying primitive rather than a seaborn-distinctive feature.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white and not dark.
      Chrome: Bold dark title "waffle-basic · seaborn · anyplot.ai" at top, clearly legible; muted-gray caption "Each square = 1% of 500 survey respondents" below it, also legible; a 10x10 grid of colored squares with thin off-white gutters between them (no axes, no spines); a two-row legend below the grid with color swatches and category + percentage labels in dark ink.
      Data: Five colors fill the grid — brand green (#009E73, Very Satisfied 42%), lavender (#C475FD, Satisfied 31%), blue (#4467A3, Neutral 15%), ochre (#BD8233, Dissatisfied 8%), matte red (#AE3030, Very Dissatisfied 4%) — first series is confirmed brand green, and the fill runs bottom-up so the majority category anchors the base.
      Legibility verdict: PASS — all text (title, caption, legend) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black and not light.
      Chrome: Same title now rendered in light ink, caption in muted light gray, legend text in light ink — all clearly legible against the dark surface.
      Data: Identical five colors (green/lavender/blue/ochre/red) in the identical grid layout — confirms the Imprint data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, caption, legend) remains fully legible on the near-black background.
