review:
  strengths:
  - Correct 10x10 waffle grid built with a single go.Heatmap trace and a hand-crafted
    discrete colorscale, avoiding 100+ individual scatter/shape traces
  - 'First categorical series is #009E73 and the remaining 4 categories follow the
    canonical Imprint order (#C475FD, #4467A3, #BD8233, #AE3030), identical across
    both themes'
  - Colorbar repurposed as an annotated legend with per-category "Category — value%"
    tick text, avoiding a separate redundant legend element
  - Categories are filled in descending-value order (35/25/22/12/6), producing a natural
    size-based visual hierarchy in the grid
  - Fully deterministic, KISS-structured script with only used imports and clean numpy
    vectorized grid construction (np.repeat + reshape)
  - Theme-adaptive chrome (background, ink, colorbar box/outline/tick colors) correctly
    threaded through both light and dark renders
  - Hover metadata (customdata + hovertemplate) mirrors the grid so every square reports
    its own category and share in the interactive HTML export
  weaknesses:
  - 'Vertical whitespace is a bit generous: the wide right margin (r=220) reserved
    for the colorbar forces the scaleanchor-locked square grid to shrink to fit the
    available width, leaving a ~440px empty band between the title and the grid top
    on the 2400px canvas. Tightening the right margin or lengthening/thickening the
    colorbar to reclaim that vertical space would improve canvas utilization.'
  - 'Design Excellence is solid but not yet publication-grade: the grid + colorbar
    layout is clean but visually plain (flat squares, no additional hierarchy cues
    like a subtle border/shadow or callout on the dominant category) — consider a
    small emphasis technique (e.g., bolding the top category''s legend row, or a subtle
    outline on the largest segment) for a stronger focal point.'
  - go.Heatmap-as-waffle is a sensible pattern for plotly but not the most idiomatic/discoverable
    approach for a first-time reader; a brief code comment already explains the choice,
    which helps, but consider whether a direct grid-of-go.Scatter-with-square-markers
    (still single-trace via marker arrays) could read as more obviously 'plotly-native'
    if revisited.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "waffle-basic · python · plotly · anyplot.ai" centered at top in dark ink, clearly legible. No axis labels/ticks (hidden by design, appropriate for a waffle grid). Colorbar legend on the right with dark tick text ("Operations — 35%", "Marketing — 25%", "R&D — 22%", "HR — 12%", "Other — 6%") on a slightly lighter elevated-background swatch column with a thin dark outline — fully readable.
      Data: 10x10 grid of squares with small gaps between them. Colors read top-to-bottom / largest-to-smallest: brand green (#009E73, Operations, 35%, 3.5 rows), lavender (#C475FD, Marketing, 25%), blue (#4467A3, R&D, 22%), ochre (#BD8233, HR, 12%), matte red (#AE3030, Other, 6%). First series is confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now rendered in light ink (near-white), clearly legible against the dark surface. Colorbar legend tick text now light gray on a slightly-elevated dark swatch column with a light-gray outline — no dark-on-dark issue found, fully readable.
      Data: Identical colors and grid layout to the light render — green/lavender/blue/ochre/red bands in the same order and proportions, confirming the categorical data colors do not shift between themes (only chrome flipped).
      Legibility verdict: PASS
