review:
  strengths:
  - Cumulative-edge rounding (edges.diff) gives whole squares that always fill the
    100-square grid, robust to any shares
  - Fixed-aspect waffle wrapped in a one-panel gggrid at the canonical 800x450 canvas
    painted in the page color in both themes
  - Legend labels carry the percentages and follow the data order through an ordered
    Categorical
  - Theme tokens threaded through title, legend title, legend text and legend fill;
    identical Imprint data colors in both renders
  - Interactive HTML export with lets-plot's native tile tooltips
  weaknesses:
  - 'DE-02 (both): a four-sided box frame in INK_SOFT encloses the waffle grid where
    nothing requires it, short of the style guide''s ''remove spines / no box frames''
    baseline → no frame (the grid needs no enclosure). Likely cause: the panel/plot
    border lets-plot draws by default; set panel_border=element_blank() (and plot_background
    color=PAGE_BG on the inner plot) in anyplot_theme.'
  - 'Suggestion: a slightly larger legend (14 pt entries) would balance the large
    square grid.'
  - 'Suggestion: placing the legend closer to the grid would tighten the right side
    of the canvas.'
