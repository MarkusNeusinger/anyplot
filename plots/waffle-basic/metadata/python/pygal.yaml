review:
  strengths:
  - Cumulative rounding gives exactly 100 whole squares (42/28/18/12) in contiguous
    row-by-row blocks
  - Imprint positions 1-4 at full opacity, identical in both themes, with theme-correct
    chrome threaded through pygal's Style object
  - Legend built from the data names each category with its computed percentage
  - Rounded corners and an even gap give the grid a clean, countable rhythm
  weaknesses:
  - 'CQ-01 (code): line 32 `class Waffle(Graph)` holds the whole drawing of the plot
    in its `_plot` method → draw the squares at the top level without a class (for
    example with pygal''s own chart types such as an XY or Dot chart driven from a
    top-level loop). Likely cause: a custom Graph subclass.'
  - 'VQ-03 (both): the legend swatches are about 16 px squares beside 44 px legend
    text and the 130 px waffle squares, so the category key reads as dots → swatches
    near the text height, about 40 px (+24 px). Likely cause: pygal''s default legend_box_size
    left unset in the Style.'
  - 'VQ-05 (both): the legend sits about 15 px under the grid''s last row while about
    170 px stay empty below it, and its four columns span the full canvas width so
    ''Operations'' starts at the far left edge, far from the centered grid → balance
    the bottom margin and keep the legend under the grid. Likely cause: margin_bottom=170
    with legend_at_bottom_columns=4 over the full width.'
  - 'Suggestion: tooltips with each category''s square count in the HTML would add
    value in the interactive view.'
