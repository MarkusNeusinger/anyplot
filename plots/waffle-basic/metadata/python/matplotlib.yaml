review:
  strengths:
  - Largest-remainder rounding guarantees exactly 100 whole squares regardless of
    the input values, and np.repeat builds the row-by-row fill order in one call
  - Legend title 'Response (1 square = 1%)' states the unit key, and the legend is
    centered under the grid in two columns
  - 'Theme tokens threaded through title, legend frame and text: both renders fully
    readable'
  - FancyBboxPatch rounded squares with page-colored edges give even gaps on both
    backgrounds
  weaknesses:
  - 'VQ-07 (both): the ordered Likert levels Strongly Agree, Agree, Neutral, Disagree
    are drawn in the categorical palette (#009E73, #C475FD, #4467A3, #BD8233) as if
    unrelated groups → discrete steps of imprint_div in their natural order, brand
    green #009E73 on the agree pole, the muted anchor for Neutral and matte red #AE3030
    on the disagree side. Likely cause: facecolor=IMPRINT_PALETTE[category_idx].'
  - 'Suggestion: name the survey question in the descriptive title prefix so the reader
    knows what was agreed with.'
