  strengths:
  - 'Correct Imprint palette applied in canonical order (categories mapped 1:1 to
    positions 1-4), first series is #009E73'
  - 'Excellent theme-adaptive chrome: verified pixel margins (69px top/bottom, 315px
    left/right, symmetric) and no dark-on-dark or light-on-light failures in either
    render'
  - Creative use of matplotlib patches (FancyBboxPatch rounded corners + patheffects
    drop shadow) to build a waffle chart that matplotlib has no native geometry for
  - 'Thoughtful emphasis technique: the dominant category gets an ink-toned outline
    instead of a background-blended one, creating a visual hierarchy without adding
    overlapping text'
  - Clean KISS-structured, deterministic code with correct theme-driven output naming
    (plot-{THEME}.png)
  - No edge clipping on either render (AR-09 clear) - confirmed via pixel-level margin
    analysis on both PNGs
  weaknesses:
  - Left/right margins (~315px each, ~26% of canvas width combined) are noticeably
    larger than the top/bottom margins, leaving vertical content fill at ~94% vs ~74%
    horizontal - widen the grid slightly (or tighten ax.set_position side margins)
    so both dimensions land closer to the 50-80% target band together
  - 'Design Excellence is good but not yet publication-tier: consider reinforcing
    the dominant-category emphasis with a direct percentage callout near/on the green
    block (in addition to the legend) to sharpen the data-storytelling focal point'
  - 'Typography hierarchy is fairly flat: subtitle and legend text share the same
    INK_SOFT weight/tone - a slightly bolder or larger legend category label vs. the
    percentage figure would add more editorial polish'
