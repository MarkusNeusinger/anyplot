review:
  strengths:
  - Largest-remainder rounding (np.floor + argsort) guarantees exactly 100 whole squares
    for any input shares
  - Grid positions computed vectorized with np.repeat and modulo arithmetic, filled
    row by row as contiguous blocks
  - 'scale_fill_manual with limits from the data keeps the data order, so Housing
    gets #009E73, and labels carry the percentages'
  - coord_equal keeps tiles square, and page-colored tile borders give even gaps that
    flip correctly with the theme
  weaknesses:
  - 'Suggestion: a slightly heavier legend title would anchor the legend box against
    the large grid.'
