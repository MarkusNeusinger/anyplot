review:
  strengths:
  - Correct, idiomatic workaround for Chart.js's missing native waffle type — draws
    the 10x10 grid in a plugin's afterDraw hook anchored to chart.chartArea, so the
    built-in title plugin still reserves its own space above the grid.
  - Data sums exactly to 100%, so every square maps to exactly 1% with no rounding
    drift, and categories are sorted in descending order, giving the grid a natural
    size-based reading order from top-left to bottom-right.
  - 'Full Imprint palette compliance — canonical order starting at brand green #009E73,
    data colors identical between light and dark renders, and both plot backgrounds
    match the theme spec (#FAF8F1 / #1A1A17) exactly.'
  - 'Clean, self-contained, deterministic code: no unnecessary functions/classes beyond
    the required plugin object, no unused imports, animation: false set correctly
    so the harness doesn''t screenshot mid-draw.'
  - Legend combines swatch + label + percentage, vertically centered next to the grid,
    fully readable in both themes with no overlap.
  weaknesses:
  - 'Layout: a large, unbalanced blank strip (roughly the bottom third of the canvas)
    sits below the grid+legend group — the group is confined to the upper ~66% of
    the 2400x2400 canvas instead of being vertically centered in chart.chartArea.
    Likely cause: the dummy type:"bar" host chart auto-generates default x/y cartesian
    scales (even with empty labels/datasets), and their reserved tick space shrinks
    the usable chartArea passed to the plugin. Fix: explicitly set scales: { x: {
    display: false }, y: { display: false } } (or drop to a scale-less chart type)
    so chartArea spans the full area below the title and the grid+legend group centers
    with balanced whitespace top and bottom.'
  - 'Design Excellence: styling is functional but plain — default sans-serif throughout,
    minimal typographic hierarchy between title and legend beyond font size, and no
    emphasis technique beyond the inherent descending sort. Once the canvas layout
    is fixed, consider tightening legend row spacing and adding subtle weight/size
    contrast to reinforce the largest-category focal point.'
  - 'Library Mastery: the plugin-based canvas drawing is competent but fairly generic
    2D canvas usage. Leaning further into Chart.js-specific mechanisms (e.g. a custom
    `generateLabels`-driven legend via the legend plugin, or scriptable options) would
    make the case for distinctive library usage stronger.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the #FAF8F1 target — not pure white.
      Chrome: Title "waffle-basic · javascript · chartjs · anyplot.ai" is bold, dark, centered at the top and fully legible. The legend (six rows: swatch, category label, "— XX%") sits to the right of the grid, vertically centered against it, with dark ink text on the light background.
      Data: A 10x10 grid of 100 squares in the top-left/center-left area of the canvas. Colors read top-to-bottom, largest-to-smallest share: green (Digital ads, 32%), lavender/purple (Content & SEO, 24%), blue (Events, 18%), ochre (Sponsorships, 14%), matte red (Email & CRM, 8%), cyan (Other, 4%). First series is Imprint #009E73 green as required; subsequent series follow the canonical Imprint order.
      Layout note: the grid + legend group occupies roughly the top two-thirds of the square canvas; there is a large, unused blank strip along the bottom ~30% of the canvas, so vertical whitespace is not balanced (all the slack sits below the content rather than being distributed above/below).
      Legibility verdict: PASS (all text clearly readable; the layout imbalance is a VQ-05 canvas-utilization issue, not a legibility issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the #1A1A17 target — not pure black.
      Chrome: Title and legend text render in light/off-white ink, clearly readable against the dark background. No dark-on-dark text anywhere — title, legend labels, and percentages are all legible.
      Data: Identical square colors and grid layout to the light render — green/lavender/blue/ochre/red/cyan swatches are pixel-identical hues to the light version, confirming only chrome (background + text color) flipped between themes.
      Layout note: same imbalance as the light render — grid + legend confined to the upper ~66% of the canvas, large empty band at the bottom.
      Legibility verdict: PASS (all text clearly readable in dark theme; no dark-on-dark failures).
