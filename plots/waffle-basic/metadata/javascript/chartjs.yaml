review:
  strengths:
  - 'Correctly fixed the previous bottom-heavy layout bug: hiding the dummy bar chart''s
    x/y scales reclaims the full chart.chartArea below the title, and the grid+legend
    group is now properly vertically centered rather than pinned to the top.'
  - Added a deliberate focal-point technique to the legend (bold, slightly larger
    text for the largest category), strengthening data storytelling with no extra
    clutter.
  - 'Full Imprint palette compliance -- canonical order starting at brand green #009E73,
    identical data colors between light/dark renders, theme-correct backgrounds (#FAF8F1
    / #1A1A17) in both.'
  - Data sums exactly to 100%, so every square maps to exactly 1% with zero rounding
    drift; categories sorted descending gives the grid a natural size-based reading
    order.
  - 'Clean, self-contained, deterministic code -- no unused imports, no unnecessary
    functions, animation: false set correctly, correct mount-node contract usage.'
  weaknesses:
  - 'Layout: fixing the scale-hiding bug increased the available chartArea height,
    but gridSize = Math.min(gridBoxW, areaH) is still capped by gridBoxW (canvas width
    minus legend column minus gutter), which is now the binding constraint on a square
    canvas. The result: roughly 40% of the canvas height sits empty (split above and
    below the centered grid+legend group). Fix: reduce the legend''s width footprint
    so gridBoxW grows closer to areaH, or stack the legend below/above the grid instead
    of beside it in square orientation, or scale up the whole grid+legend composition
    as a unit so its bounding box''s larger dimension matches areaH.'
  - 'Design Excellence: styling is still functional-but-plain outside of the one focal-weight
    legend touch -- no distinctive typographic hierarchy, color texture, or spacing
    refinement beyond that.'
  - 'Library Mastery: the plugin-based drawing is competent Chart.js usage (correct
    API for an unsupported chart type) but the actual cell/legend rendering is generic
    canvas 2D work; leaning further into Chart.js-specific mechanisms would strengthen
    the distinctive-feature case.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Bold dark title "waffle-basic · javascript · chartjs · anyplot.ai" centered at top, fully legible. Legend labels (dark ink) fully readable. Grid+legend group is vertically centered in the canvas but occupies only ~55-60% of canvas height, leaving ~40% empty margin split top/bottom.
      Data: 10x10 grid of 100 squares, colored by category in descending share order: green (Digital ads, 32%, first series = required #009E73), lavender (Content & SEO, 24%), blue (Events, 18%), ochre (Sponsorships, 14%), matte red (Email & CRM, 8%), cyan (Other, 4%). Legend shows swatch + label + percentage, with the first (largest) entry bold-weighted as a focal point.
      Legibility verdict: PASS (all text readable; layout has unused canvas space but is not a legibility issue)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Title and legend render in light/off-white ink, fully legible against the dark background, no dark-on-dark failures anywhere. Same centered-but-undersized composition and same top/bottom whitespace as the light render.
      Data: Identical colors to light render, confirming only chrome flips between themes.
      Legibility verdict: PASS
