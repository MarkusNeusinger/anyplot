review:
  strengths:
  - Legend font size increase (16px to 19px) directly fixes the attempt-1 legibility
    weakness and now balances well against the title.
  - 'Grid math remains exactly correct: 100 cells, values sum to 100, row-major assignment.'
  - Drop-shadow filter (feDropShadow) and dashed decade-band guide lines are genuine
    D3-specific additions (SVG filter defs, data-bound line elements) that show real
    attempt to lift the design.
  - Legend now greedy-wraps into centered rows, avoiding the single-row-overflow risk
    of attempt 1.
  - Data colors identical between light/dark renders; only chrome adapts, exactly
    as required.
  weaknesses:
  - The leading-category emphasis stroke (stroke-opacity 0.3) on the largest category's
    cells/swatch is visually indistinguishable from the drop-shadow edge already applied
    to every cell -- zooming 2-3x on the PNG shows no discernible difference between
    the emphasized green cells and the unemphasized cells. Raise the stroke opacity/width
    enough to actually read as emphasis.
  - The dashed decade-band guide lines are only visible on a close crop; at normal
    viewing size they blend into the existing cell gaps and don't yet deliver a noticeable
    fifths-of-the-total rhythm.
  - Design Excellence is still close to a standard waffle grid -- beyond the shadow
    and (currently imperceptible) emphasis, there's no strong focal point guiding
    the viewer to the largest category.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "waffle-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered at top. Legend wraps into two centered rows below the grid with five rounded color swatches and labels ("Digital Advertising (32%)", "Content Marketing (24%)", "Events & Sponsorships (18%)", "Public Relations (14%)", "Tools & Software (12%)") at 19px, rendered in dark ink. All text is clearly legible against the light background.
      Data: A 10x10 grid (100 cells with gaps, rounded corners, and a subtle drop shadow) filled in row-major order: green (#009E73, Digital Advertising), lavender (Content Marketing), blue (Events & Sponsorships), ochre (Public Relations), matte red (Tools & Software), in descending-value order. A faint dashed guide line crosses the grid every 2 rows. Cell counts visually match each category's percentage.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Same title and two-row legend layout as the light render, now rendered in light ink/off-white text against the dark surface. Title and all five legend labels are clearly readable with no dark-on-dark text.
      Data: Identical five data colors and identical cell layout/order/shadow/band-guides as the light render -- only the background and text color flipped, confirming theme-adaptive chrome without touching data colors.
      Legibility verdict: PASS
