review:
  strengths:
  - 'Grid math is exactly correct: 10x10 = 100 cells, values 32+24+18+14+12 sum to
    100, and cells are assigned in clean row-major reading order.'
  - Legend is dynamically centered as a group using getComputedTextLength() measurement
    per item, a distinctly D3 DOM-measurement technique rather than a hardcoded offset.
  - 'Data colors (Imprint palette, first series #009E73) are identical between light
    and dark renders; only chrome (background, title, legend text) adapts per theme,
    exactly as required.'
  - Categories are pre-sorted descending by value, giving the grid a natural top-left-heavy
    visual hierarchy that makes proportions easy to scan.
  - Rounded corners (rx=3) on both waffle cells and legend swatches add a small but
    consistent polish detail.
  weaknesses:
  - Design Excellence is largely generic for the chart type — beyond rounded corners
    and sorted ordering there is no additional storytelling device (e.g. a subtle
    10-cell decade separator, or emphasis on the largest category) to lift it above
    a standard waffle grid.
  - Legend label text (16px) reads a little small relative to the 2400px canvas and
    the 22px title — a modest bump (e.g. 18-20px) would balance the hierarchy better.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "waffle-basic · javascript · d3 · anyplot.ai" in bold dark ink, centered at top. Legend below the grid with five rounded color swatches and labels ("Digital Advertising (32%)", "Content Marketing (24%)", "Events & Sponsorships (18%)", "Public Relations (14%)", "Tools & Software (12%)"), rendered in a softer dark ink. All text is clearly legible against the light background.
      Data: A 10x10 grid (100 cells with small gaps and rounded corners) filled in row-major order: green (#009E73, Digital Advertising), purple/violet (Content Marketing), blue (Events & Sponsorships), ochre/gold (Public Relations), and red (Tools & Software), in that descending-value order. Cell counts visually match each category's percentage.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend layout as the light render, now rendered in light ink/off-white text against the dark surface. Title and all five legend labels are clearly readable with no dark-on-dark text.
      Data: Identical five data colors and identical cell layout/order as the light render — only the background and text color flipped, confirming theme-adaptive chrome without touching data colors.
      Legibility verdict: PASS
