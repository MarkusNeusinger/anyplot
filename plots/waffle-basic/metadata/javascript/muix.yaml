review:
  strengths:
  - 'Clever, correct technique for a chart type MUI X doesn''t natively support: ScatterPlot''s
    slots.scatter is overridden with a custom WaffleSquares component that draws rounded
    rects on band/band x/y scales — a genuine, non-fake solution rather than a workaround.'
  - 'Correct Imprint palette handling: brand green is first, the remaining categories
    follow canonical order (lavender, blue, ochre), and "Other" correctly uses the
    theme-adaptive muted anchor instead of the next ordinal palette slot.'
  - Both renders are fully legible with correctly flipped chrome (dark ink on cream
    / light ink on near-black) while all data colors — including the muted anchor's
    light/dark variants — stay correctly mapped.
  - Careful margin math keeps the 10x10 grid a perfect square regardless of the reserved
    legend width, and small rounded corners on each cell add a refined touch over
    plain squares.
  - Deterministic, realistic budget-allocation dataset summing exactly to 100 with
    one square per percentage point, matching the spec's canonical waffle-chart mapping.
  weaknesses:
  - The waffle grid is width-constrained by the reserved legend column and then top-aligned,
    leaving a visibly empty band across the bottom of the square canvas (roughly the
    bottom fifth of the frame) — the composition reads bottom-heavy. Vertically center
    the grid+legend block as a whole within the canvas (or grow PAD / cell size to
    consume the extra height) instead of top-aligning purely against the title.
  - Legend swatches and text sit noticeably above the vertical midpoint of the actual
    grid once the dead space below is counted, reinforcing the imbalance — re-deriving
    the legend's vertical centering from the true visual center of the composition
    (grid + surrounding padding) rather than just the grid's own center would tighten
    this up.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "waffle-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Legend on the right lists "Engineering — 34%", "Sales — 21%", "Marketing — 17%", "Operations — 16%", "Other — 12%" in dark text with matching color swatches, all clearly readable against the cream background. No axis lines/ticks are rendered (appropriate for a waffle chart).
      Data: A 10x10 grid of rounded squares filled row-major in contiguous blocks: green (Engineering), lavender (Sales), blue (Marketing), ochre (Operations), gray (Other). First series is the brand green #009E73 as required; remaining categories follow the canonical Imprint order; "Other" correctly uses the muted anchor instead of the next ordinal palette color.
      Legibility verdict: PASS — all text is clearly readable, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and legend text render in light/white and remain clearly legible against the dark surface. Legend swatches keep the same size/position as the light render.
      Data: Grid colors are identical to the light render (green, lavender, blue, ochre) — only the "Other" muted anchor shifts from dark gray (#6B6A63) to a lighter gray (#A8A79F), which is the documented theme-adaptive muted-anchor behavior, not an inconsistent data color.
      Legibility verdict: PASS — no dark-on-dark failures; all text and swatches are clearly distinguishable from the near-black background.
