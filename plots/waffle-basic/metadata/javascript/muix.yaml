review:
  strengths:
  - 'Correct 10x10 waffle: 100 equal rounded squares with even gaps, no axes or grid
    lines, one contiguous block per department filled row by row from the top left'
  - Largest-remainder rounding guarantees the blocks fill exactly 100 squares with
    no partly filled square, and the legend percentages are computed from the data
    rather than typed in
  - 'Idiomatic MUI X composition: ChartsContainer with two hidden band axes and a
    custom layer that positions every square through useXScale/useYScale, so the gap
    and sizing come from the library''s band scales'
  - Imprint palette in canonical order (brand green first, lavender, blue, ochre)
    with the catch-all 'Other' in a neutral, data colors identical between light and
    dark
  - Plausible, neutral budget-allocation scenario ordered largest share first, legend
    titled 'Department' with each category and its percentage, readable in both themes
  weaknesses:
  - 'VQ-07 (both): the ''Other'' block is filled with the secondary-text chrome token
    inkSoft (#4A4A44 light / #B8B7B0 dark), which is not one of the Imprint colors
    or anchors → use the ''muted'' anchor the style guide reserves for other/rest
    (#6B6A63 light / #A8A79F dark). Likely cause: SEMANTIC = { Other: t.inkSoft }.'
  - 'Suggestion: the legend text at 16 CSS px is small in the 400 px thumbnail; 18
    px would read better there while still fitting on one row.'
  - 'Suggestion: the header line reads ''muix 7.29.1'' while the code is written against
    the pinned MUI X 9 API; keep the header version in step with the harness.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: centered bold title "waffle-basic · javascript · muix · anyplot.ai" in dark ink, a soft-ink subtitle "100 squares, one per 1 % of the total · shares rounded to whole squares", and a single-row legend below the grid ("Department" in bold, then Engineering 34 %, Sales 21 %, Marketing 17 %, Operations 16 %, Other 12 %) in dark ink. No axes or grid lines. All text readable.
      Data: a 10x10 grid of equal rounded squares with even gaps, filled row by row: 34 brand green #009E73 (Engineering), 21 lavender #C475FD (Sales), 17 blue #4467A3 (Marketing), 16 ochre #BD8233 (Operations), 12 dark gray #4A4A44 (Other). Each block contiguous; counts match the legend.
