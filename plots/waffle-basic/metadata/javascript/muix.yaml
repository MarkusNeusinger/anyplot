review:
  strengths:
  - 'Composes the waffle from MUI X building blocks: a ChartsContainer with two hidden
    band axes (position: "none") and a custom layer that reads useXScale/useYScale,
    so square size and the even 12 % gaps come from the library''s band scales rather
    than hand-computed coordinates'
  - Largest-remainder rounding (lines 50–58) turns the shares into whole squares that
    always fill the 10 × 10 grid exactly, with no partial squares
  - One contiguous block per category, filled row by row from the top left in data
    order, so each share can be counted
  - 'Imprint palette in canonical order (#009E73, #C475FD, #4467A3, ochre), and the
    ''Other'' rest category takes the theme-adaptive muted anchor (#6B6A63 / #A8A79F)
    as the semantic exception allows; data colors are identical in both themes'
  - Legend names every department with its percentage under a bold 'Department' title,
    with swatches clearly visible on both backgrounds
  - Square canvas sized from ANYPLOT_SIZE, theme tokens on all chrome, skipAnimation
    set, and a plausible, neutral budget-allocation scenario
  weaknesses:
  - 'Suggestion: for the HTML view, a per-square <title> or MUI tooltip showing the
    department and its share would add hover inspection without changing the static
    render.'
  - 'Suggestion: the legend row could sit a little closer to the grid to tighten the
    vertical rhythm at the bottom of the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled #FAF8F1 (250,248,241).
      Chrome: bold dark title "waffle-basic · javascript · muix · anyplot.ai" centered at the top, with a soft-ink subtitle "100 squares, one per 1 % of the total · shares rounded to whole squares" below it; a bottom legend with a bold "Department" title and five entries (Engineering 34 %, Sales 21 %, Marketing 17 %, Operations 16 %, Other 12 %). No axes or grid lines. All text is dark and readable.
      Data: a 10 × 10 grid of rounded squares with even gaps, filled row by row: 34 green (#009E73), 21 lavender (#C475FD), 17 blue (#4467A3), 16 ochre and 12 muted grey (#6B6A63) for Other. Each block is contiguous and the grid is completely filled.
