review:
  strengths:
  - 'Fixed the attempt-1 composition imbalance: the grid+legend block is now vertically
    centered in the square canvas (vPad = max(TITLE_SPACE, (H-grid)/2)), so the dead
    space that previously collected at the bottom is largely gone.'
  - 'Clever, correct technique for a chart type MUI X doesn''t natively support: ScatterPlot''s
    slots.scatter is overridden with a custom WaffleSquares component drawing rounded
    rects on band/band x/y scales.'
  - 'Correct Imprint palette handling: brand green first, canonical order for the
    rest, and ''Other'' correctly uses the theme-adaptive muted anchor instead of
    the next ordinal palette slot.'
  - Both renders are fully legible with correctly flipped chrome and identical data
    colors (including the muted anchor's documented light/dark variants).
  - Deterministic, realistic budget-allocation dataset summing exactly to 100, one
    square per percentage point.
  weaknesses:
  - A thin band of empty space still remains below the grid+legend block (roughly
    ~15-18% of canvas height) — the vertical centering formula uses (H - grid) / 2
    for top padding but the legend's own centering offset means the block doesn't
    perfectly split the leftover height top/bottom. Minor — no further action required
    unless pursuing a 90+ score.
  - Data storytelling is limited to descending sort order; no additional focal point
    (e.g., emphasizing the largest or smallest category) is used to guide the reader
    beyond the legend percentages.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "waffle-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Legend on the right lists each category with its percentage ("Engineering — 34%", "Sales — 21%", "Marketing — 17%", "Operations — 16%", "Other — 12%") in dark text with matching color swatches, all readable.
      Data: 10x10 grid of rounded squares filled row-major in contiguous blocks: green (#009E73, Engineering), lavender (Sales), blue (Marketing), ochre (Operations), gray (Other/muted anchor). First series is confirmed brand green. Grid is vertically centered in the canvas with modest, roughly balanced whitespace above and below (small residual excess below, not severe).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and legend text render in light/near-white and are clearly legible against the dark surface. No dark-on-dark failures.
      Data: Grid colors identical to light render (green, lavender, blue, ochre) — only the "Other" muted anchor shifts from dark gray to a lighter gray, which is the documented theme-adaptive muted-anchor behavior (INK_MUTED), not an inconsistency.
      Legibility verdict: PASS
