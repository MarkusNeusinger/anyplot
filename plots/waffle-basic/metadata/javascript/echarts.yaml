review:
  strengths:
  - Imprint palette used in exact canonical order (green, lavender, blue, ochre, matte
    red) with brand green first and identical data colors between light and dark renders
  - Clean 10x10 grid built via the standard scatter+rect waffle trick, with subtle
    grout borders (borderColor = pageBg/token) giving a genuine waffle texture
  - Legend labels precisely satisfy the spec note 'include a legend identifying categories
    with their percentages' (e.g. 'Product Development — 32%')
  - Deterministic, realistic budget-allocation dataset that sums exactly to 100, so
    every square maps to exactly 1%
  - Theme-adaptive chrome correctly threaded through title/legend text colors and
    transparent background for both renders
  - Square canvas orientation directive matches the visual aspect of a square grid
  weaknesses:
  - 'Misleading code comment: ''Fill a 10x10 grid bottom-to-top, left-to-right'' does
    not match the actual algorithm — row = GRID-1-Math.floor(cursor/GRID) against
    a non-inverted value y-axis fills the grid top-to-bottom (green occupies the top
    rows, not the bottom). Either fix the comment to describe the real fill order
    or invert the row calculation to match it.'
  - Design excellence is solid but fairly generic beyond the grout-line squares —
    no extra distinctive touch (e.g. a subtle callout/annotation on the largest category)
    to elevate data storytelling beyond the implicit descending-order hierarchy.
  - No echarts-specific feature beyond the standard scatter+rect waffle workaround
    is showcased (acceptable since it's the correct idiomatic approach for a chart
    type echarts has no native support for, but nothing distinctive is added on top).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "waffle-basic · javascript · echarts · anyplot.ai" in dark ink, centered top, clearly readable. Legend at bottom center lists all 5 categories with inline percentages ("Product Development — 32%", "Marketing — 24%", "Sales Operations — 18%", "Customer Support — 14%", "Research & Development — 12%") in a softer dark gray, all legible.
      Data: A clean 10x10 grid of 100 colored squares with thin off-white grout lines between them. Colors read top-to-bottom in descending value order: green (32 squares), lavender (24), blue (18), ochre (14), matte red (12). First series color is #009E73 (brand green), matching the Imprint canonical order.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light ink, clearly readable against the dark background. Legend text switches to a lighter soft gray, fully legible; no dark-on-dark issues anywhere.
      Data: Identical square grid and identical data colors (green/lavender/blue/ochre/red) to the light render — only the chrome (background, text) and the grout border color (now near-black instead of off-white) flip, exactly per the theme-adaptive chrome contract.
      Legibility verdict: PASS
