review:
  strengths:
  - 'Correct Imprint palette in canonical order — first series is #009E73, remaining
    series follow the canonical sequence, and chrome (background, text, legend) is
    theme-correct in both renders'
  - 'Clean 10x10 waffle grid: page-background-colored borders separate squares without
    introducing a visible grid color, reading well in both light and dark'
  - '"Largest share — 32%" callout anchored via markPoint in data space adds a clear
    focal point and a touch of data storytelling beyond a bare grid'
  - Legend combines category name and percentage ("Product Development — 32%"), directly
    satisfying the spec's request for a legend identifying categories with their percentages
  - Deterministic, realistic budget-allocation data that sums exactly to 100, so every
    square legitimately represents 1%
  weaknesses:
  - Design Excellence is solid but close to a standard grid-plus-legend treatment;
    a bolder hierarchy device (e.g. subtle emphasis/opacity on the highlighted category,
    more distinctive callout styling) would push it toward top-tier polish
  - All five categories sit in a fairly narrow 12-32% band; adding a smaller minority
    category (a single-square sliver, 1-3%) would better demonstrate the 'each square
    = 1%' granularity called out in the spec notes
  - The scatter+rect+markPoint approach is effective but is a fairly common cross-library
    pattern for waffle charts; leaning further into an ECharts-distinctive feature
    (e.g. emphasis states, graphic elements) would raise Library Mastery
