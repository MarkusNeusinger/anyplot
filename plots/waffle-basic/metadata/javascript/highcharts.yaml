review:
  strengths:
  - 'Correct Imprint palette use: first series is brand green #009E73, remaining 4
    departments follow canonical positions 2-5 (lavender, blue, ochre, matte red),
    identical across light and dark renders'
  - 'Theme chrome fully threaded through tokens: title/subtitle/legend text and page
    background are correct and readable in both #FAF8F1 and #1A1A17 renders, no dark-on-dark
    or light-on-light failures'
  - Data sums exactly to 100 (34+22+18+15+11) and is rendered as a clean 10x10 grid
    of 100 equal squares, matching the spec's core requirement
  - Legend labels bake in category name and percentage ("Engineering — 34%") directly
    into the series name, satisfying the spec's "legend identifying categories with
    their percentages" requirement without extra chart junk
  - Departments ordered largest-to-smallest, creating a clear reading hierarchy from
    the top-left block down to the smallest at bottom-right
  - Clean, deterministic, KISS-structured code with no fake interactivity and explicit
    font sizes for every text element
  weaknesses:
  - 'DE-01/DE-02: The grid reads as flat, well-configured default styling — 100 solid-color
    squares with a thin page-bg gap between them and no additional polish (no subtle
    rounding, depth, or texture). Consider a small refinement like symbolRadius rounding
    on the squares, a subtle inner highlight/shadow, or slightly refined spacing to
    lift it above a generic scatter-as-waffle look.'
  - 'LM-02: Using scatter markers with symbol:''square'' to fake a waffle grid is
    a generic cross-library trick, not something distinctive to Highcharts. Consider
    leveraging a Highcharts-specific strength — e.g. dataLabels rendering the percentage
    inside each department''s first square, or a tooltip/point-level interaction that
    showcases the library''s interactivity in the HTML output — to make the implementation
    feel more idiomatically Highcharts.'
  - Legend items currently only differentiate departments by hue; with 5 categories
    sitting at the borderline of CVD distinguishability (ΔE_CVD ~13.7-10.7 per the
    style guide), a redundant cue (e.g. small pattern or the percentage value directly
    on the largest square of each block) would make the mapping more robust for colorblind
    readers even though the legend text already labels each block.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "waffle-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Annual budget allocation by department — each square = 1%" in softer grey, both clearly legible. Legend sits centered below the grid with 5 entries ("Engineering — 34%", "Marketing — 22%", "Operations — 18%", "Sales — 15%", "Support — 11%") in dark-grey text with small square swatches.
      Data: A 10x10 grid of 100 equal square cells, filled contiguously in blocks by department in descending size order (34 green, 22 lavender, 18 blue, 15 ochre, 11 red). First series renders in brand green #009E73. Squares have a thin page-background gap between them giving a tile-mosaic look.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle flip to light ink/grey and remain fully readable against the dark surface; legend text is light grey, swatches unchanged.
      Data: Same 100-square grid in the same block layout and order; the five data colors (green, lavender, blue, ochre, red) are pixel-identical to the light render — only the surrounding chrome (background, text) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed in either render.
