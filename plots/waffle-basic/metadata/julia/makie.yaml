review:
  strengths:
  - Correct 10x10 = 100-square waffle grid with squares assigned to categories in
    exact proportion to their percentages (32+22+18+16+12 = 100)
  - 'Imprint palette used correctly: Housing is brand green #009E73 (first series),
    remaining categories follow the canonical order (lavender, blue, ochre, matte
    red)'
  - 'Both renders are theme-correct: warm off-white (#FAF8F1) / warm near-black (#1A1A17)
    backgrounds, ink text flips appropriately, data colors are pixel-identical between
    light and dark'
  - Clean horizontal legend below the grid with category + percentage labels ("Housing
    (32%)", etc.), no frame, centered
  - Square grid built from first-principles Rect2 polygons with DataAspect() and a
    small inter-square gap (square_gap = 0.12) rather than a bar-chart hack — an idiomatic,
    low-level use of Makie's poly! for a technique that doesn't have a built-in Makie
    recipe
  - Canvas lands exactly on the 2400x2400 square target with no gate failure
  - Deterministic script (hardcoded category/percentage data, no randomness needed)
    and clean imports (only CairoMakie + Colors, both used)
  weaknesses:
  - The subtitle Label at fig[2,1] ("Housing leads the budget at 32%") never actually
    renders — the allocated 40pt row between the title and the grid is completely
    blank in both plot-light.png and plot-dark.png. The intended data-storytelling
    callout is invisible; only an unexplained gap remains. Verify the Label call actually
    draws (e.g. check tellwidth/tellheight interaction with the Fixed() row size,
    or whether it's being clipped) and either fix the rendering or remove the dead
    code and reclaim the vertical space for the grid/legend.
  - The focal-square 'anchor' highlight described in the code comment (squares_focal
    drawn with strokewidth=5, strokecolor=INK to visually call out the largest category)
    is not visible in either render — the Housing squares have the same thin background-colored
    gap stroke as every other square. The poly! call for squares_focal is not producing
    a distinguishable outline; either the stroke needs to be more prominent to survive
    antialiasing at this square size, or the second poly! call isn't overdrawing as
    intended.
  - Because neither the subtitle nor the focal outline render, the chart currently
    has no explicit visual hierarchy or focal point beyond the implicit grid ordering
    — Design Excellence (data storytelling) suffers even though the code clearly intended
    one.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "waffle-basic · julia · makie · anyplot.ai" centered at top, clearly readable dark-on-light. Below the title there is a blank band where a subtitle ("Housing leads the budget at 32%") was intended but does not actually render — no text is visible there, just empty background. The horizontal legend below the grid (5 swatches + "Category (XX%)" labels) is fully readable in dark ink.
      Data: 10x10 grid of gapped squares. First 32 squares (top-left, reading row-major) are brand green (#009E73, Housing), followed by 22 lavender (#C475FD, Food), 18 blue (#4467A3, Transportation), 16 ochre (#BD8233, Savings), and 12 matte red (#AE3030, Entertainment) — matches the legend and sums to 100. No visible thicker outline on the Housing squares despite the code intending one.
      Legibility verdict: PASS for the title and legend; the intended subtitle text is simply absent (not a legibility failure, but a rendering failure — nothing to misread, nothing there).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now in light ink, clearly readable light-on-dark. Same blank band where the subtitle should be — confirmed missing in this theme too, so it's a rendering bug rather than a light-theme-only glitch. Legend text renders in light ink, fully readable against the dark background.
      Data: Identical square-for-square color assignment and grid layout as the light render — data colors (green/lavender/blue/ochre/red) are pixel-identical between themes, only the chrome (background, title/legend ink color) flipped, as required. No dark-on-dark or light-on-light failures found; no focal-square outline visible here either.
      Legibility verdict: PASS — all rendered text (title, legend) is legible; no dark-on-dark issue. The missing subtitle/outline is a functional bug, not a theme-contrast bug.
