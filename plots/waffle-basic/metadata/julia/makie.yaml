review:
  strengths:
  - 'Data mapping is exact: percentages (32/22/18/16/12) sum to 100, and every one
    of the 100 squares is assigned to the correct category with a clean row-major
    fill order.'
  - 'Both renders are theme-correct: #FAF8F1/#1A1A17 backgrounds, ink/ink-soft chrome
    tokens threaded through title and legend, and data colors (Imprint palette, brand
    green first) identical between themes.'
  - 'Canvas discipline is exemplary: explicit rowsize!/colsize!/Fixed layout allocation
    guarantees the 2400x2400 square target with no overflow or clipping, and holds
    up at 400px thumbnail scale.'
  - 'Idiomatic Makie layout usage: DataAspect(), hidespines!/hidedecorations! for
    a clean waffle surface, poly! with a per-cell color vector, and a manually constructed
    Legend with PolyElement swatches.'
  weaknesses:
  - Title occupies only ~30% of the plot width at fontsize=26 — well under the ~50-70%
    guideline for a square canvas; bump titlesize a few points for stronger visual
    hierarchy against the 2400px canvas.
  - No storytelling emphasis beyond the descending fill order — e.g. no annotation
    calling out the largest or a goal-relevant category, so Data Storytelling stays
    close to baseline.
  - 'Square-grid styling is competent but plain: uniform stroke gaps and flat fills
    with no additional refinement (e.g. subtle corner rounding or a highlighted focal
    category) to lift it above a generic waffle chart.'
  image_description: |-
