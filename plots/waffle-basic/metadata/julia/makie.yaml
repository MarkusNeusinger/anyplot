      Chrome: Title "waffle-basic · julia · makie · anyplot.ai" in bold dark ink, centered top; horizontal legend below the grid with five colored swatches and "Category (NN%)" labels in dark ink. All fully readable.
      Data: 10x10 grid of 100 squares with small uniform gaps. Colors top-to-bottom/left-to-right: green (#009E73, Housing 32%), lavender (#C475FD, Food 22%), blue (#4467A3, Transportation 18%), ochre (#BD8233, Savings 16%), red (#AE3030, Entertainment 12%) — first series is brand green as required, order matches the canonical Imprint sequence.
