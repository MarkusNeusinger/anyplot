review:
  strengths:
  - Unused `library(dplyr)` import from attempt 1 has been removed
  - Second legend row (Sales, R&D) now independently centered under the grid via measured
    label widths, fixing the prior alignment asymmetry
  - 'Correct Imprint palette in canonical order, first series #009E73, identical data
    colors across both renders'
  - Theme-adaptive chrome correctly implemented — both renders pass the light/dark
    readability check with no dark-on-dark or light-on-light failures
  - Canvas is exactly 2400×2400 (square), matching the canonical size
  - 'Data mapping is pixel-accurate: tile counts per department (32/24/19/15/10) exactly
    match the waffle grid and legend percentages'
  weaknesses:
  - 'Critical: the new `annotate("text", x = 5.5, y = callout_row, label = paste0(budget$share[1],
    "%"), color = "#FFFFFF", ...)` callout added this attempt to emphasize the largest
    category (Engineering, 32%) never appears in either render — a full-image pixel
    scan of both plot-light.png and plot-dark.png finds zero white/near-white pixels
    anywhere in the file, confirming the text layer produces no visible output despite
    ~15 lines of supporting position logic (`top_full_rows`, `callout_row`). This
    was the exact feature added to address attempt 1''s DE-03/LM-02 feedback, so the
    intended improvement was not actually delivered.'
  - Because the callout is invisible, Design Excellence / Library Mastery gained no
    real benefit over attempt 1 despite the added code complexity.
  - Legend still uses a hand-rolled geom_point/geom_text construction rather than
    ggplot2's native guide_legend — acceptable but not a distinctive ggplot2 feature.
