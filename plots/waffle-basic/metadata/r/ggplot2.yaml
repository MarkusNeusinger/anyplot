review:
  strengths:
  - 'Correct Imprint palette in canonical order with first series #009E73, identical
    data colors across light and dark renders'
  - Theme-adaptive chrome correctly implemented in both renders — warm off-white/near-black
    backgrounds, all text readable, no dark-on-dark or light-on-light failures
  - Categories sorted largest-to-smallest (Engineering to R&D), giving the waffle
    a natural visual hierarchy and a clear focal point at top-left
  - Tiles separated by PAGE_BG-colored strokes with theme_void() chrome removal —
    a clean, purpose-built waffle look with no stray axes/gridlines
  - Legend clearly lists each category with its exact percentage, matching the underlying
    data
  - Canvas is exactly 2400x2400 (square), matching the canonical size gate
  weaknesses:
  - Unused `library(dplyr)` import — no dplyr verb is called anywhere in the script
    (only `tibble::tibble()`, base `rep()`/`paste0()`/`round()` are used); remove
    the import for clean imports (CQ-03).
  - Second legend row (Sales, R&D) starts flush-left instead of being centered under
    the grid, creating a slight visual asymmetry against the first row of three items
    — center each legend row for better balance (DE-02/VQ-05).
  - Design Excellence is solid but stops at 'good default' — consider a stronger focal
    point (e.g. a subtle callout on the largest category) or extra polish to push
    into publication-ready territory (DE-01).
  - Library Mastery is generic — geom_tile + coord_equal is the standard, library-agnostic
    approach to a waffle grid; consider a ggplot2-distinctive touch (custom legend
    key glyphs, annotate() emphasis, or grob-based rounded tiles) to better leverage
    the grammar-of-graphics strengths (LM-02).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "Company Budget Allocation · waffle-basic · r · ggplot2 · anyplot.ai" in dark ink, clearly legible at the top; legend below the grid in two rows (3 items, then 2 items) with soft gray text — all legible against the light background.
      Data: A 10x10 grid of squares forming a waffle chart, read top-to-bottom in rows of 10. Colors in order: green (#009E73, Engineering 32%), lavender (#C475FD, Marketing 24%), blue (#4467A3, Operations 19%), ochre (#BD8233, Sales 15%), red (#AE3030, R&D 10%) — this matches the canonical Imprint palette order with the first series correctly green. Squares are separated by thin background-colored strokes for a clean grid look.
      Legibility verdict: PASS — all text (title, legend labels) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Same title now rendered in light/off-white text, clearly legible against the dark background; legend text in light gray, also fully readable. No dark-on-dark failures observed.
      Data: Identical waffle grid and identical five data colors (green, lavender, blue, ochre, red) as the light render — only the background/chrome flipped, confirming theme-adaptive color handling is correct.
      Legibility verdict: PASS — all text readable against the dark background, brand green remains vivid and distinguishable on both surfaces.
