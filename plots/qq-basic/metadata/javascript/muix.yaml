review:
  strengths:
  - Theoretical quantiles carry the sample's own mean and sd (Blom positions through
    Acklam's inverse normal), so the y = x reference line is exact and the right-skewed
    log-normal sample shows the characteristic bowed pattern with both tails above
    the line
  - Composes the chart from MUI X building blocks (ChartsDataProvider, ChartsWrapper,
    ChartsSurface, LinePlot + ScatterPlot) to mix a line series and a scatter series
    on shared axes, with the dashed reference styled through a data-series sx selector
  - 'Both themes are correct: chrome comes from the ink/inkSoft/grid tokens, the dashed
    inkSoft reference line stays clearly visible on both surfaces, and the #009E73
    markers carry a page-colored outline'
  - Equal x and y domains computed from all quantiles keep both tails inside the plot
    area, and the axis bands are sized explicitly so no tick label is truncated
  - Library-native tooltips on the scatter points add per-observation inspection in
    the HTML view
  weaknesses:
  - 'Suggestion: both axes share the same unit and range, so matching tick intervals
    (for example every 5 h on both) would make the y = x comparison easier to read
    than 2 h on x against 5 h on y.'
  - 'Suggestion: the subtitle''s mean and sd could move into the x-axis title (for
    example ''Theoretical quantiles, normal(32.5, 10.6) (hours)'') to keep the header
    lighter.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "qq-basic · javascript · muix · anyplot.ai" centered at top, a soft-ink subtitle "Order fulfillment time (hours): n = 60 against a normal distribution with the sample's mean 32.5 and sd 10.6", a centered horizontal legend (green dot "Observations (n = 60)", dash "Reference line y = x"), y-axis "Sample quantiles (hours)" with ticks 5–60 every 5, x-axis "Theoretical quantiles, fitted normal (hours)" with ticks 6–62 every 2, subtle grid on both axes. All text dark on light and readable; no truncation or clipping.
      Data: 60 #009E73 markers with thin page-colored outline; a dark dashed y = x line spans the full plot diagonally. The points bow above the line in the lower tail (12 h at theoretical 8), dip slightly below it in the middle (26–38), and rise well above it in the upper tail (58–60 h at theoretical 51–57), the right-skew signature.
      Legibility verdict: PASS

