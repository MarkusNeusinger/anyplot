review:
  strengths:
  - 'Change request applied: sixth roots of unity plus two operands with their computed
    sum and product, each category with its own Imprint color and marker shape (circle,
    diamond, square)'
  - Each point carries one two-line annotation block (name over a+bi) placed outward
    along its direction, so every annotation reads as belonging to one point
  - arrows2d! draws clear arrowheads ending at each point; DataAspect keeps the dashed
    unit circle circular with the roots exactly on it
  - Theme tokens threaded through every text, spine, tick and legend element; both
    renders read cleanly
  - 'Adaptable data block: column constants, a DataFrame, categories and colors from
    unique(...) over the data'
  weaknesses:
  - 'SC-02 (both): the real and imaginary axes through the origin are drawn as plain
    hlines!/vlines! without tick marks; ticks and labels sit only on the frame spines
    → tick marks with labels on the origin axes (for example short tick segments along
    the origin lines, or spines moved to the origin). Likely cause: hlines!/vlines!
    used for the origin axes while xticks/yticks stay on the bottom/left spines.'
  - 'Suggestion: the optional polar form (r ∠ θ) beside each a+bi would tie the arrows''
    length and direction to numbers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
