      Data: dashed grey unit circle; six green #009E73 arrows to circle markers on the circle (z0..z5, sixth roots), two lavender #C475FD arrows to diamonds a=1.2+0.8i and b=-1.0+0.6i, two blue #4467A3 arrows to squares a+b=0.2+1.4i and a·b=-1.68-0.08i; each point labelled with its name over its a+bi form, placed outward.
