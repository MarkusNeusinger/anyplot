review:
  strengths:
  - 'Complete Argand diagram: dashed unit circle with the three roots of unity exactly
    on it, arrows from the origin ending at each point, equal ±3 domain on a square
    view'
  - Axes through the origin carry tick marks and whole-number labels, plus italic
    Re/Im axis-end labels
  - Full triangle arrowheads pulled back by the marker radius in screen pixels, so
    each head is visible and ends at its point
  - Rotation arc with a computed π/4 label (Fraction.limit_denominator) shows multiplication
    by e^(iπ/4) geometrically
  - 'Altair-native interactivity: legend-bound selection_point highlights a category,
    tooltips with real/imaginary values, .interactive() zoom/pan'
  - Theme tokens threaded through every chrome element; both renders fully legible
  weaknesses:
  - 'VQ-02 (both): the dashed unit circle runs through the origin-axis tick labels
    ''1'' and ''-1'' on both axes (it passes through (±1, 0) and (0, ±1), and the
    labels sit only 0.17 units off the axis), and the real-axis ''1'' sits half under
    the ω0 marker → tick labels clear of the circle and the markers by a few px. Likely
    cause: the fixed -0.17 offset of tick_labels, which ignores the unit circle and
    any point on an axis.'
  - 'VQ-02 (both): the z₁ vector grazes the tail ''0.8i'' of the ''z = 1.5+0.8i''
    label → the label clear of the vector by a few px. Likely cause: the placement
    cost counts sampled line points inside the label box with a small margin, so a
    box edge on a vector still wins at low cost.'
  - 'Suggestion: the polar form (r∠θ), which the Notes offer as optional, could go
    beside the rectangular labels or in the tooltip.'
