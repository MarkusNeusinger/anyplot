review:
  strengths:
  - 'Complete Argand diagram: dashed unit circle with the three roots of unity exactly
    on it, vectors from the origin, equal ±3 domain on a square view'
  - Labeled 0.5-step ticks on both axes plus italic Re/Im axis-end labels make every
    coordinate readable
  - Rotation arc with a computed π/4 label (Fraction.limit_denominator) shows multiplication
    by e^(iπ/4) geometrically
  - Legend placed inside the empty lower-left quadrant on an elevated panel, keeping
    the view square and the canvas filled
  - 'Altair-native interactivity: legend-bound selection_point highlights a category,
    tooltips with real/imaginary values, .interactive() zoom/pan'
  - Theme tokens threaded through every chrome element; both renders fully legible
  weaknesses:
  - 'VQ-02 (both): five annotations are crossed by lines — the z₂ vector runs through
    ''ω1'', the z₁ vector through the ''z'' of ''z = 1.5+0.8i'', the z₄ vector through
    ''ω2 = -0.5-0.87i'', the dashed unit circle through ''ω0 = 1.0+0.0i'', and the
    z·e^(iπ/4) vector touches ''π/4'' → every label clear of all vectors and the circle
    by a few px. Likely cause: the radial/near-axis label offsets (lines 70-83) only
    avoid the point''s own vector, not neighbouring vectors or the unit circle.'
  - 'VQ-03 (both): the arrowheads (size 300, pulled back only 0.08 units) sit mostly
    underneath the 220-size point markers, so each head shows as a lopsided sliver
    beside the point instead of a clear triangle ending at it → pull the head back
    by about the marker radius so the full triangle is visible just before the point.
    Likely cause: back = 0.08 / magnitude at line 99.'
  - 'SC-02 (both): the real and imaginary axes drawn through the origin carry no tick
    marks; the labeled ticks sit only on the left/bottom frame → tick marks (and labels)
    on the axes through the origin, as the Notes ask. Likely cause: the axis_line_data
    mark_line layer has no tick layer; ticks come only from the frame axes in axis_cfg.'
  - 'Suggestion: the polar form (r∠θ), which the Notes offer as optional, could be
    added beside the rectangular labels or in the tooltip.'
