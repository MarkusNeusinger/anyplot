  strengths:
  - Labels placed with textcoords='offset points' along each point's radial direction
    and ha/va picked per direction, so every three-line a+bi / polar box hangs clear
    of its marker
  - Vectors drawn with annotate arrowprops (shrinkA=0, shrinkB=7) so each arrow starts
    at the origin and stops at its marker
  - Roots of unity and arbitrary numbers separated by both color and marker shape,
    keyed in a legend whose glyphs match the marks in both themes
  - Polar values computed with abs() and np.angle rather than typed, and limits derived
    from the data
  weaknesses:
  - 'Suggestion: typeset the legend entry ''e^(2πi/5)'' with mathtext ($e^{2\pi i/5}$)
    instead of caret notation.'
  - 'Suggestion: the dotted argument arcs (radius 0.19, alpha 0.45) overlap into one
    faint ring at the origin; either give a single arc presence or drop them.'
