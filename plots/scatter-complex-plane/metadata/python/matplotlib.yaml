  strengths:
  - 'All five ''A good version shows'' properties met: origin axes with ticks, dashed
    circular unit circle with the roots exactly on it, an arrow to every point, rectangular
    + polar annotation per point, color + marker per category'
  - Annotation values computed from the data (abs, np.angle), checked correct for
    ω, z₁ and z₂
  - Theme tokens threaded through every element; Imprint green/lavender identical
    in both renders
  - Idiomatic matplotlib vectors via annotate arrowprops with shrinkA/shrinkB, Arc
    patches for the arguments
  weaknesses:
  - 'VQ-02 (both): the annotation boxes of z₁, ω² and ω³ (alpha 0.88 fill) cover about
    half of their own markers — the z₁ diamond''s right half, the top of ω² and the
    bottom of ω³ → each box clear of its marker by a few points. Likely cause: xytext
    at only 0.45 data units along the radius with ha/va=''center'', so the three-line
    box reaches back over the point.'
  - 'VQ-03 (dark): the legend glyphs carry a white line segment and a white marker
    edge that the plotted marks (no line, PAGE_BG edge) do not have → glyphs that
    match the marks. Likely cause: Line2D(..., color=''w'') without linestyle=''none''
    and markeredgecolor=PAGE_BG.'
  - 'Suggestion: typeset the legend entry ''e^(2πi/5)'' with mathtext ($e^{2\pi i/5}$)
    instead of caret notation.'
  - 'Suggestion: the dotted argument arcs (alpha 0.45, radius 0.19) all pile up at
    the origin and are barely visible; either give one arc presence or drop them.'
