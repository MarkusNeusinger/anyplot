review:
  strengths:
  - sns.JointGrid with per-category marginal kdeplot is a seaborn-specific layout
    on the square canvas
  - sns.scatterplot with hue + style maps categories to Imprint colors and distinct
    markers (diamond / X / circle), so roots of unity stand out in both themes
  - Theme tokens threaded through rc, ticks, legend and annotation boxes — both renders
    fully readable
  - Roots of unity lie exactly on the dashed unit circle with equal aspect, and their
    sum is computed rather than placed
  - Annotation boxes are placed radially outward along each vector, computed from
    the data instead of hand-tuned offsets
  weaknesses:
  - 'VQ-02 (both): the ω₀ annotation box sits on z₁''s arrow and touches the z₁ marker
    by about 10 px, the Σωₖ box covers the unit circle and z₃''s arrow, and the ω₂
    box covers z₆''s arrow → keep every box clear of other points'' markers and arrows.
    Likely cause: the fixed 20 pt radial offset with the 45° rotation for unit-circle
    points ignores neighbouring vectors.'
  - 'SC-02 (both): no arrowhead is visible — each ''->'' head ends at the point''s
    centre under a 150–450 size marker drawn at zorder 5, so the vectors read as plain
    lines (C3) → the head visible at the point''s edge. Likely cause: arrowprops without
    shrinkB matching the marker radius, arrows below the markers.'
  - 'SC-02 (both): the Σωₖ label (0.0+0.0i) sits directly below the ω₀ diamond, about
    1 unit from the origin, so it reads as ω₀''s label rather than the origin''s (C4)
    → beside the origin X. Likely cause: the (0.7, −0.7) fallback direction for the
    zero-modulus point at a 20 pt offset.'
  - 'SC-04 (both): marker size encodes |z| (sizes=(150, 450)) but the size entries
    were dropped from the legend, so the size channel has no key → a size key, or
    a constant marker size. Likely cause: the legend filter keeps only categories
    and Unit Circle.'
  - 'VQ-03 (light): the legend''s Sum of Roots glyph is a thin small lavender ''x''
    that barely reads and does not match the bold X mark at the origin → a glyph with
    the mark''s weight. Likely cause: the size-scaled legend handle for the zero-magnitude
    point.'
  - 'VQ-05 (both): axis limits at 1.6× the largest coordinate (±4.8 for data within
    ±3) leave wide empty bands on every side of the joint panel → limits about 1.25×
    the extent of points plus labels. Likely cause: limit = max(...) * 1.6.'
  - 'Suggestion: marginal KDEs of three roots and seven arbitrary points say little
    about a complex-plane diagram; a plain square axes would give the diagram the
    whole canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas, joint panel and marginals.
      Chrome: title 'scatter-complex-plane · python · seaborn · anyplot.ai' in dark ink at top; Re(z) / Im(z) axis titles and ticks −4…4 in dark gray; legend upper right (Roots of Unity, Sum of Roots, Arbitrary Points, Unit Circle) on an elevated box — all readable.
      Data: green #009E73 diamonds for the three roots of unity on a dashed gray unit circle joined by a translucent green triangle; lavender #C475FD X at the origin for the sum; blue #4467A3 circles for z₁–z₇ in all quadrants; translucent arrows from the origin to every point (heads hidden under markers); each point has a rounded box with its LaTeX label and a+bi form placed radially outward. Top and right marginal KDEs per category. Axes span ±4.8, leaving empty bands around the data.
      Legibility verdict: PASS

