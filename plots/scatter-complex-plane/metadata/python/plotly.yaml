review:
  strengths:
  - Equal aspect via scaleanchor/scaleratio keeps the dashed unit circle circular,
    with all 8 roots exactly on it
  - Data-coordinate arrow annotations (axref/ayref) end at each root, so length and
    direction read as modulus and phase
  - Two categories told apart by color and shape (green circles vs. purple diamonds),
    identical in both themes
  - Hover shows rectangular and polar form of each point in the HTML — Plotly-native
    interactivity
  - 'Complete theme adaptation: all chrome from tokens, both renders fully readable'
  weaknesses:
  - 'VQ-02 (both): the labels of the four points on the axes collide with the zero
    lines — ''i'' at the top is almost fully hidden by the imaginary axis, the minus
    of ''−1'' and ''−i'' merges into the axis line, ''1'' sits on the real axis →
    keep the on-axis labels off the 2 px zero lines (offset them diagonally or draw
    them with a page-colored background box). Likely cause: the 90°/180°/270°/0° sector
    anchors shift the label straight along the axis.'
  - 'SC-02 (both): no point carries its rectangular form a+bi (C4) — roots show only
    symbolic names (1, ω, i …) and the 12 spiral points carry no annotation at all
    → annotate each point with a+bi (polar optional). Likely cause: the label annotations
    use only the display name and loop over the roots only.'
  - 'SC-02 (both): only the 8 roots have arrows from the origin; the 12 spiral points
    have none (C3) → draw a vector to every point. Likely cause: the arrow loop iterates
    over the roots only.'
  - 'Suggestion: thinner, lighter arrows for the spiral points would keep the origin
    readable once every point has its vector.'
  image_description: |-
