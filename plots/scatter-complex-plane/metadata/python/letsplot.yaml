review:
  strengths:
  - Unit circle is a dashed path over a faint Imprint-green disc, circular thanks
    to coord_fixed, with all five roots exactly on it
  - 'Two-level annotation hierarchy: bold category-colored point name above the soft-ink
    rectangular form'
  - Hollow page-filled markers let the vectors visibly terminate at each point while
    keeping the data color
  - layer_tooltips exposes category, rectangular and polar forms in the interactive
    HTML version
  - Theme tokens carried through every chrome element; both renders read cleanly
  weaknesses:
  - 'VQ-05 (both): coord_fixed narrows the plot box and leaves transparent strips
    about 250 px tall across the top and bottom of the 2400x2400 canvas → the whole
    canvas in the page color. Likely cause: no one-panel gggrid([plot]) + ggsize(600,
    600) + theme(plot_background=PAGE_BG) wrapper around the fixed-aspect plot.'
  - 'VQ-02 (both): the vector to z3 runs through the ''0.31+0.95i'' label of omega1,
    the vector to z2 through ''-0.81−0.59i'' of omega3, and omega2''s ''-0.81+0.59i''
    touches z6''s ring → labels clear of vectors and markers. Likely cause: the hand-rolled
    repulsion only separates labels from each other, not from vectors or points.'
  - 'SC-02 (both): the open arrowheads end inside the hollow markers and are covered
    by them, showing only as small ticks around each ring, so the vectors do not read
    as arrows (C3) → heads visible at the point''s edge. Likely cause: geom_segment
    ends at the exact point while geom_point size=5 with stroke 2 draws over the head.'
  - 'VQ-03 (both): every legend key shows a stray letter ''a'' over the circle glyph
    → plain circle-and-line keys. Likely cause: the two geom_text layers mapped to
    color contribute to the legend; set show_legend=False on them.'
  - 'CQ-04 (code): lines 65–86 hand-write an O(n²) 20-pass label repulsion loop →
    geom_text_repel (lets-plot 4) places the labels next to their points. Likely cause:
    manual label_x/label_y offsets instead of the library''s repel geom.'
  - 'Suggestion: show the polar form (r, θ) beside the rectangular form, the Notes''
    option, for the roots of unity.'
