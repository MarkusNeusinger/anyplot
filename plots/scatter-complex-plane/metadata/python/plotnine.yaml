review:
  strengths:
  - 'Every spec element present: axes through the origin, dashed unit circle kept
    circular by coord_fixed, closed-head arrows from the origin, a+bi annotations,
    category colors'
  - Imprint palette in canonical order with brand green on the roots of unity; chrome,
    label boxes and legend frame fully theme-adaptive
  - Visual hierarchy through scale_size_identity / scale_alpha_identity and a translucent
    halo layer on the roots of unity
  - 'Idiomatic plotnine layering: geom_segment with arrow(), geom_label with matplotlib
    boxstyle, guide_legend override_aes'
  weaknesses:
  - 'VQ-01 (both): the eleven a+bi point labels (geom_label size=3.8) render at about
    half the height of the 8 pt tick labels, below the style guide''s 8 pt reference
    for annotation text → about 8 pt, geom_label size=8 (+4.2). Likely cause: geom_label
    size=3.8, which plotnine passes to matplotlib as a font size in points.'
  - 'VQ-02 (both): the rotated ''∣z∣ = 1'' label sits exactly on the dashed unit circle,
    so the dashes run through its letters → place it just outside the circle (radius
    about 1.12). Likely cause: annotate x=cos(50°), y=sin(50°) at radius 1.'
  - 'VQ-03 (both): every legend key draws a thick colored bar behind the dot, a glyph
    that matches neither the thin vectors nor the points → a dot (or dot plus thin
    line) like the marks. Likely cause: override_aes size=3.5 applied to the geom_segment
    key as well as the point key.'
  - 'SC-02 (both): the a+bi labels float 0.46 units out along each ray, so ω2''s label
    sits directly above the z₂ point and ω1''s beside the z₁+z₂ arrow; C4 asks that
    every annotation read as belonging to one point → a smaller offset (about 0.2)
    so each label touches its own point. Likely cause: label_radius=0.46.'
  - 'Suggestion: the polar form r∠θ beside each rectangular label, which the Notes
    allow, would teach the Euler link.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title 'scatter-complex-plane · python · plotnine · anyplot.ai' at about 84% width; Re(z) / Im(z) axis titles and -2..2 ticks in dark ink; faint grid; bottom legend 'Category' in an ELEVATED_BG frame. Axes drawn through the origin. Italic '∣z∣ = 1' at 50° on the circle, now readable in INK_SOFT. The eleven a+bi labels in rounded boxes are small (about half the tick height).
      Data: six #009E73 roots of unity with halos on the dashed unit circle, four #C475FD arbitrary points, one larger #4467A3 sum point at (0.6, 1.7); translucent arrows from the origin in category colors. Legend keys show a thick bar behind each dot.
      Legibility verdict: PASS (point labels small but legible)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend in light ink; label boxes switch to a dark fill with light text; no dark-on-dark text. Unit circle and '∣z∣ = 1' in light grey, visible.
      Data: same green / lavender / blue as the light render; arrows dimmer on dark but visible.
      Legibility verdict: PASS
