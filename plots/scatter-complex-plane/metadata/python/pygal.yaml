review:
  strengths:
  - 'Arrowheads drawn inside each vector series by retracing tip-barb-tip with per-point
    node overrides ({''r'': 0}), so every vector ends in a visible head at its point'
  - 'Theme handling complete: annotations in INK via value_colors and grid from INK_MUTED,
    so every label reads in both themes'
  - 'Mathematically exact data: 3rd roots of unity on the unit circle and z1+z2 computed
    and plotted at 0.7+2.5i, all labels in rectangular a+bi form'
  - Computed vector sum set apart with a dashed, heavier stroke and a larger dot
  - Interactive HTML saved alongside the PNG
  weaknesses:
  - 'SC-02 (both): the plot area is not equal-aspect: about 230 px per unit along
    x vs about 210 px per unit along y, so the unit circle renders as an ellipse roughly
    9 % wider than tall → equal pixels per unit on both axes (shrink the x pixel span
    by ~9 % or grow the y span). Likely cause: the square 2400x2400 canvas with the
    bottom legend, x_title and margins taking more height than width, leaving a non-square
    plot area for identical range/xrange.'
  - 'VQ-02 (both): the omega1 annotation ''-0.5+0.9i'' is crossed by the dashed z1+z2
    vector and the unit circle, and the omega2 annotation sits on the unit circle''s
    dashed line → annotations clear of strokes. Likely cause: pygal''s fixed label
    offset below-right of each dot; choose sample points/label text so no vector passes
    through a label, or shorten the labels.'
  - 'VQ-03 (both): vector shafts and arrowhead barbs render only about 2-3 px wide
    on the 2400 px canvas (barbs about 0.28 units long), and the dashed blue sum vector
    nearly fades on the dark page → shafts about 5-6 px as the stroke_style widths
    intend (+3 px). Likely cause: the stroke_style width not taking effect over Style(stroke_width=2.5);
    raise stroke_width in the Style.'
  - 'Suggestion: the optional polar form (r∠θ) beside each a+bi label would connect
    the vectors to magnitude and phase.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'scatter-complex-plane · python · pygal · anyplot.ai' in dark ink, axis titles 'Real Axis' / 'Imaginary Axis', ticks -3..3 on both axes, subtle dashed grid, darker zero lines through the origin; bottom legend in two rows (Roots of Unity (3rd), Sample Points, z1+z2 (Vector Sum), Unit Circle, Origin). All readable.
      Data: three green #009E73 root vectors ending on the dashed ochre unit circle, four lavender #C475FD sample vectors, one dashed blue #4467A3 sum vector to 0.7+2.5i, each with two short arrowhead barbs at the tip; red origin dot; dark a+bi annotations below-right of each point. The unit circle is slightly wider than tall (~230 vs ~210 px per unit). omega1/omega2 labels touched by the circle and the sum vector.
      Legibility verdict: PASS

