review:
  strengths:
  - 'Every spec feature present: axes through the origin, dashed unit circle kept
    circular by coord_equal, an arrow from the origin to each point, a+bi labels,
    category colors'
  - 'Label placement driven by data columns: outward nudge along each vector''s angle,
    direction-dependent hjust mapped as an aesthetic, and a lift for points on the
    real axis so no label touches a line'
  - 'Correct Imprint palette (#009E73, #C475FD) identical in both themes, with fully
    theme-adaptive chrome'
  - Roots of unity computed from cos/sin(2πk/5), deterministic and exact on the unit
    circle
  weaknesses:
  - 'SC-03 (both): the axes run to ±2.5 (≈±2.75 with expansion) while the points span
    Re −0.81…1.30 and Im −1.40…0.95 and the labels reach Re≈2.6, leaving empty bands
    above Im≈1.2, below Im≈−1.7 and left of Re≈−1.9 → limits a little outside the
    points and labels (about −0.8 on ylim, −0.6 on the left xlim), derived from the
    data. Likely cause: coord_equal(xlim = c(-2.5, 2.5), ylim = c(-2.5, 2.5)) typed
    as symmetric constants.'
  - 'Suggestion: drop the legend box frame (legend.background color = NA), as the
    style guide''s decoration checklist suggests.'
  - 'Suggestion: the a+bi formatter lambda is written twice; one shared function would
    remove the duplicate.'
