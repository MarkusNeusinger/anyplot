      Data: A dashed dark-gray unit circle is centered at the origin. Five green (#009E73) vectors with arrowheads radiate from the origin to points evenly spaced on the unit circle, each labeled with its rectangular (a+bi) and polar (r, θ) form in a light callout box. Three purple/lavender (#C475FD) vectors point to arbitrary points outside the circle, each labeled with only its rectangular form. All text is fully readable against the light background — no light-on-light issues.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now rendered in light/near-white ink, clearly readable. Axis titles and tick labels are in a light gray tone, fully legible against the dark background. Origin crossing lines are a lighter gray, gridlines subtle but visible. Legend text is light-colored and readable, with the same green/purple triangle markers.
      Data: Same green (#009E73) vectors and roots-of-unity annotations, same purple (#C475FD) vectors and arbitrary-point annotations — colors are pixel-identical to the light render, confirming only chrome flipped. Callout label boxes use a dark elevated background with light text, readable, no dark-on-dark failures observed anywhere (title, axis labels, ticks, legend, and data-label boxes are all clearly visible).
