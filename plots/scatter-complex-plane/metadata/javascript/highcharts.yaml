review:
  strengths:
  - Correctly enforces equal aspect ratio dynamically by comparing plotWidth/plotHeight
    scale factors and calling setExtremes, so the unit circle renders as a true circle
    in both light and dark renders.
  - Custom SVG arrowhead rendering via chart.renderer.path (using axis.toPixels for
    exact pixel mapping) compensates for Highcharts core having no vector/quiver series,
    delivering genuine directional vectors from the origin.
  - Rich per-point annotations combine rectangular (a+bi) and polar (r, theta) forms
    for the roots of unity, directly supporting the spec's Euler's-formula / rectangular-vs-polar
    teaching goal.
  - Clear categorical distinction (Imprint color + legend + marker shape) between
    the 5th-roots-of-unity series and the arbitrary-points series.
  - 'Imprint palette applied correctly (brand green #009E73 first, lavender second),
    identical across both themes; background, text, and grid chrome are theme-correct
    in both renders with no dark-on-dark or light-on-light issues.'
  weaknesses:
  - 'Design Excellence stays close to a well-configured default: the overall visual
    hierarchy and typography are competent but plain — consider a stronger focal treatment
    (e.g. subtle unit-circle fill/shading, or a bolder line-style distinction between
    the two vector categories) to move beyond ''library default'' territory.'
  - The '2.40 + 1.20i' data-label sits close to the top-right canvas edge in both
    renders — give it a bit more margin or nudge its offset so it doesn't crowd the
    border (not clipped, but tight).
  - The circular scatter markers (radius 7) are visually redundant with the custom-drawn
    arrowhead triangles at the same points/colors — consider disabling or shrinking
    the underlying scatter marker since the arrowhead tip alone already marks the
    point, or differentiate them intentionally.
  - Several small helper functions (formatRect, labelPosition, vectorSegments, drawArrowhead)
    are all functionally necessary for the vector-drawing approach, but for KISS structure
    consider inlining the trivial ones (e.g. labelPosition) to keep the script closer
    to a flat data-then-chart script.
