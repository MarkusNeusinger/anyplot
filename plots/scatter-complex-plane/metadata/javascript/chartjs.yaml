review:
  strengths:
  - 'Faithfully implements every requirement in the spec''s Notes: real/imaginary
    axes through the origin with labeled ticks, a dashed unit circle, arrowed vectors
    from the origin to each point, and dual rectangular + polar annotations per point.'
  - Actively enforces equal aspect ratio with a two-pass afterRender re-scaling routine
    (pxPerUnitX vs pxPerUnitY reconciliation) so the unit circle renders as a true
    circle instead of an ellipse — a real Chart.js-specific challenge handled correctly.
  - 'Data is mathematically correct and verifiable: cube roots of unity (1, ω, ω²)
    computed via cos/sin of 120° increments, and z1+z2 sum displayed matches the arithmetic
    exactly.'
  - Correct, idiomatic use of Chart.js's plugin lifecycle (beforeDatasetsDraw / afterDatasetsDraw
    / afterRender) to extend the library for Argand-diagram furniture — the right
    approach given the library's 'no workarounds/plugins' constraint, since chartjs
    ships no annotation/arrow plugin.
  - 'Theme-adaptive chrome is clean in both renders: Imprint palette in correct canonical
    order (green then lavender), backgrounds and text correctly flip light/dark with
    no dark-on-dark or light-on-light failures, and data colors are pixel-identical
    between themes.'
  weaknesses:
  - 'The x-scale and y-scale each independently render a ''0'' tick label at the origin,
    and because both axes are centered (position: {x:0}/{y:0}), the two ''0'' labels
    land on/overlapping the same pixel — suppress one of them (e.g. a ticks.callback
    on one axis that returns '''' for value 0, since the origin is already implied
    by the axis crossing).'
  - Grid lines read a bit more prominent than the style guide's 'subtle, 15-25% opacity'
    target, especially in the light render — consider lowering grid alpha slightly
    so it recedes further behind the vectors and unit circle.
  - 'Design Excellence is solid but not yet publication-ready: the parallelogram-law
    relationship between z1, z2, and z1+z2 is only conveyed through separate vectors
    — a subtle dashed guide connecting z1 to z1+z2 (completing the parallelogram)
    would sharpen the storytelling without adding clutter.'
  - Only one arbitrary-vector transformation (addition) is demonstrated; the spec's
    Applications section also calls out rotation/scaling by multiplication as a core
    teaching use case for this plot type — not required by the Notes checklist, but
    an easy way to broaden feature coverage in a future pass.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-complex-plane · javascript · chartjs · anyplot.ai" in dark ink, clearly visible at top. "Real" and "Imaginary" axis-end labels in bold dark ink, both readable. Tick labels (-3..3 on both axes) in muted gray, legible. Legend at bottom ("Cube roots of unity" green circle, "Arbitrary points & sum" purple diamond) fully readable. Grid lines subtle but slightly more visible than ideal.
      Data: First series (cube roots of unity: 1, ω, ω²) rendered in brand green #009E73 as circles with arrows from the origin; second series (z1, z2, z1+z2) rendered in lavender/purple (#C475FD, Imprint position 2) as rotated-square diamonds with arrows. Each point is annotated with its rectangular form (e.g. "1.80 + 1.20i") and polar form (e.g. "r=2.16, θ=34°"). A dashed unit circle centered at the origin is visible and reads as a true circle (equal aspect ratio confirmed).
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; only minor issue is the x-axis and y-axis "0" tick labels coincide at the origin (see weaknesses), which is an overlap concern, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, "Real"/"Imaginary" labels, and tick labels all render in light ink (off-white/light-gray), clearly visible against the dark background — no dark-on-dark failures found. Legend text is light-colored and readable. Grid lines are faint but visible white-ish lines.
      Data: Data colors are pixel-identical to the light render — brand green #009E73 for the roots-of-unity series and lavender #C475FD for the arbitrary-points series — confirming only chrome flipped between themes, not data colors. Unit circle, vectors, and annotations all remain clearly legible against the dark surface.
      Legibility verdict: PASS — all text and data elements are clearly readable in the dark theme; brand green and lavender both read well against the near-black background.
