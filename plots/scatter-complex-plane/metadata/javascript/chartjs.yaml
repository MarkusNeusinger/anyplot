review:
  strengths:
  - 'Faithfully implements every requirement in the spec''s Notes: real/imaginary
    axes through the origin with labeled ticks, a dashed unit circle, arrowed vectors
    from the origin to each point, and dual rectangular + polar annotations per point.'
  - 'Directly resolved all three fixable weaknesses from the attempt-1 review: the
    duplicate origin ''0'' tick label is now suppressed via a ticks.callback on the
    y-axis, the grid alpha was pushed down further (softGrid at 0.09), and a new dashed
    parallelogram-law guide (z1→sum, z2→sum) now visually connects the addition relationship
    instead of leaving it as three separate vectors.'
  - Actively enforces equal aspect ratio with a two-pass afterRender re-scaling routine
    so the unit circle renders as a true circle instead of an ellipse in both renders
    — a real Chart.js-specific challenge handled correctly.
  - Correct, idiomatic use of Chart.js's plugin lifecycle (beforeDatasetsDraw / afterDatasetsDraw
    / afterRender) to extend the library for Argand-diagram furniture, the right approach
    given the library's 'no workarounds/plugins' constraint since chartjs ships no
    annotation/arrow plugin.
  - 'Theme-adaptive chrome is clean in both renders: Imprint palette in correct canonical
    order (green then lavender), backgrounds and text correctly flip light/dark with
    no dark-on-dark or light-on-light failures, and data colors are pixel-identical
    between themes.'
  weaknesses:
  - Only one arbitrary-vector transformation (addition) is demonstrated; the spec's
    Applications section also calls out rotation/scaling by multiplication as a core
    teaching use case for this plot type — not required by the Notes checklist, but
    an easy way to broaden feature coverage in a future pass.
  - The per-point annotation text (rectangular + polar form, three lines per point)
    becomes quite small and dense at mobile-width scaling (~400px) — consider slightly
    larger annotation fontsize or fewer decimal places if mobile legibility of the
    detail text becomes a priority.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-complex-plane · javascript · chartjs · anyplot.ai" in dark ink, clearly visible at top. "Real" and "Imaginary" axis-end labels in bold dark ink, both readable. Tick labels (-3..3 on both axes) in muted gray, legible, and the origin now shows only a single "0" (the y-axis duplicate is suppressed). Legend at bottom ("Cube roots of unity" green circle, "Arbitrary points & sum" purple diamond) fully readable. Grid lines are now very subtle, receding behind the vectors and unit circle.
      Data: First series (cube roots of unity: 1, ω, ω²) rendered in brand green #009E73 as circles with arrows from the origin; second series (z1, z2, z1+z2) rendered in lavender/purple (#C475FD, Imprint position 2) as rotated-square diamonds with arrows. Each point is annotated with its rectangular form (e.g. "1.80 + 1.20i") and polar form (e.g. "r=2.16, θ=34°"). A dashed unit circle centered at the origin reads as a true circle (equal aspect ratio confirmed), and a new dashed parallelogram guide connects z1→(z1+z2) and z2→(z1+z2), visually completing the addition-law parallelogram.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no overlap or clipping observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, "Real"/"Imaginary" labels, and tick labels all render in light ink (off-white/light-gray), clearly visible against the dark background — no dark-on-dark failures found. Legend text is light-colored and readable. Grid lines are faint but visible.
      Data: Data colors are pixel-identical to the light render — brand green #009E73 for the roots-of-unity series and lavender #C475FD for the arbitrary-points series — confirming only chrome flipped between themes, not data colors. Unit circle, vectors, parallelogram guide, and annotations all remain clearly legible against the dark surface.
      Legibility verdict: PASS — all text and data elements are clearly readable in the dark theme; brand green and lavender both read well against the near-black background.
