review:
  strengths:
  - 'Correct Argand-diagram fundamentals: real/imaginary axes through the origin with
    labeled ticks, dashed unit-circle reference, and arrows from the origin to every
    point'
  - Equal aspect ratio genuinely enforced (square canvas, identical x/y domains) so
    the unit circle renders as a true circle, not an ellipse
  - Rich per-point annotations combining both rectangular (a+bi) and polar (r ∠ θ°)
    forms, with hand-tuned label offsets that keep every label clear of vectors, axes,
    and each other
  - 'Correct Imprint palette assignment (brand green #009E73 for the primary ''Cube
    roots of unity'' category, lavender #C475FD for ''Arbitrary points''), with identical
    data colors and fully theme-correct chrome across both renders'
  - Deterministic, clean data (verified cube roots of unity) and a legitimate MUI
    X composition technique (ChartContainer + useXScale/useYScale) to draw the custom
    overlay
  weaknesses:
  - 'LM-01: The implementation never populates ChartContainer''s `series` prop (series=[])
    — it uses the library purely for scale computation and draws every mark (vectors,
    markers, ticks, legend) as raw SVG. This is a legitimate MUI X pattern for custom
    overlays, but it forgoes the library''s native scatter/line series, built-in legend,
    and tooltip machinery, so it reads as a lower-level approach rather than idiomatic
    high-level API usage.'
  - 'DE-01/DE-02: Solid, functional design but stops short of exceptional editorial
    polish — e.g. the arrowheads and unit circle are correct but plain; a subtle shadow/depth
    cue or varied line weight between primary/secondary vectors could push the hierarchy
    further.'
  - 'DQ-01: The six points cover two clear categories (roots of unity vs. arbitrary
    points) but a 4th/5th root or a point placed exactly on an axis would round out
    the geometric variety even further.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-complex-plane · javascript · muix · anyplot.ai" in bold dark ink at top; black "Re"/"Im" axis lines crossing at the origin with tick marks at -2,-1,1,2 (real) and -1i,-2i,1i,2i (imaginary); subtle gray gridlines at unit spacing; dashed gray unit circle centered at the origin; top-left legend with green "Cube roots of unity" and purple "Arbitrary points" swatches. All chrome text renders in dark ink and is clearly legible against the cream background.
      Data: Three green vectors/markers (z1=1+0i, z2=-0.5+0.87i, z3=-0.5-0.87i — the cube roots of unity, symmetric on the unit circle) and three purple vectors/markers (w1=1.7+1.0i, w2=-1.4+1.8i, w3=0.9-1.9i — arbitrary points outside the circle). Each point is annotated with both its rectangular and polar form in dark text. First series color is #009E73 (brand green) as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Identical composition to the light render — title, axis lines, tick marks, gridlines, dashed unit circle, and legend — all rendered in light cream/white ink. No dark-on-dark issues: every text element (title, tick labels, axis labels, annotations, legend) is clearly legible against the dark background.
      Data: Same green (#009E73) and purple (#C475FD) vectors/markers/annotations as the light render — data colors are pixel-identical between the two themes, confirming only chrome flipped.
      Legibility verdict: PASS
