review:
  strengths:
  - Composes the chart from MUI X v9 building blocks (ChartsDataProvider, ChartsWrapper,
    ChartsSurface, ScatterPlot, ChartsGrid, ChartsLegend) and draws the unit circle,
    axes through the origin and vectors as custom SVG layers positioned with the useXScale/useYScale/useDrawingArea
    hooks, so every element shares the chart's own scales
  - 'One symmetric extent on both axes plus a square drawing area keeps px per unit
    equal: the dashed unit circle is round and the three cube roots of unity sit exactly
    on it'
  - Arrowheads are per-group SVG markers ending at the marker rim, so each vector
    visibly terminates at its point and length/direction read as magnitude/phase
  - Two-level annotation typography (bold rectangular form in ink, polar form in inkSoft)
    with a page-colored halo keeps the a+bi and r∠θ forms readable where they cross
    the grid or circle, in both themes
  - 'Typographic care: true minus signs everywhere, imaginary ticks suffixed with
    i, unit-circle tick labels nudged off the circle, the origin''s 0 placed in the
    quadrant clearest of vectors'
  - Native series legend distinguishes 'Cube roots of unity' (#009E73) from 'Arbitrary
    points' (#C475FD), identical in both themes; scatter series keep MUI X hover tooltips
    in the HTML output
  - 'Polar values check out against the data: |1.7+1i| = 1.97 ∠ 30°, |−1.4+1.8i| =
    2.28 ∠ 128°, |0.9−1.9i| = 2.10 ∠ −65°, roots at ∠ 0°/120°/−120°'
  weaknesses:
  - 'VQ-02 (both): the dashed unit circle runs straight through three annotations
    — the ''1.00'' digits of both rows of z1''s label, the ''120°'' of z2''s polar
    row and the trailing ''i'' of z3''s rectangular row — the halo thins the dashes
    but they still cut glyphs → the annotation candidates should also score their
    room to the unit circle (|distance − radius|), like they already do for vectors
    and axes. Likely cause: the candidate `room` in the `annotations` block (lines
    122–159) ignores the circle.'
  - 'VQ-01 (both): the polar rows at 14 px and the tick labels at 15 px (CSS, on a
    1200 px mount) shrink to about 5 px in the 400 px thumbnail and blur → about 16–17
    px (+2 to +3 px). Likely cause: fontSize={14} on the polar <text> and fontSize={15}
    in TickLabels.'
  - 'CQ-04 (code): the label-placement search (lines 97–159: 24 candidates per point,
    each sampled at 18 points against every vector) plus the zeroQuadrant search (lines
    101–121) is about 60 lines for six labels → a fixed outward offset along each
    point''s phase angle (anchor from cos θ) covers the same placement in a few lines.
    Likely cause: a generic declutter search instead of using the radial geometry
    of the plot.'
  - 'Suggestion: the header comment reads ''muix 7.29.1'' while the harness pins @mui/x-charts
    9.16; the metadata version line could match the runtime.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: bold dark title "scatter-complex-plane · javascript · muix · anyplot.ai" centred at top (~46% of width); HTML legend below it ("Cube roots of unity", "Arbitrary points"); solid ink real and imaginary axes through the origin with tick marks, tick labels −2, −1, 1, 2 and −2i, −1i, 1i, 2i in inkSoft, "0" at the origin, bold axis titles "Real part" (right end) and "Imaginary part" (top end); subtle grid at each tick. All text dark on light and readable.
      Data: dashed inkSoft unit circle, round; three green #009E73 points (z1, z2, z3) on the circle at 0°, 120°, −120° and three lavender #C475FD points (w1, w2, w3) outside, each with a same-colored arrow from the origin whose head ends at the marker rim; each point annotated with bold "zk = a ± bi" and a soft "|z| = r ∠ θ°" row. The dashed circle crosses the z1, z2 and z3 annotations (haloed).
      Legibility verdict: PASS

