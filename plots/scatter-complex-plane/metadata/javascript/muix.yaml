review:
  strengths:
  - Built on the MUI X composition API (ChartsDataProvider → ChartsWrapper → ChartsSurface
    with ChartsLegend and ChartsGrid). The custom SVG layers read the real scales
    through useXScale/useYScale/useDrawingArea, so the axes through the origin, the
    dashed unit circle and the vectors line up exactly with the native ScatterPlot
    markers.
  - 'One symmetric extent on both axes plus a square drawing area keeps px per unit
    equal: the unit circle is round and z1, z2 and z3 sit exactly on it.'
  - Each annotation has a bold rectangular row (a+bi) over a softer polar row (|z|
    ∠ θ), placed outward along the point's phase. A page-coloured halo keeps it readable
    where the grid or the circle passes.
  - Arrowheads end at the marker rim, so the head stays visible and length still reads
    as magnitude. Tick labels at ±1 are nudged off the circle, and the '0' label goes
    into the free quadrant.
  - 'Typographic minus signs are used throughout, and the computed values are correct:
    cube roots −0.50 ± 0.87i at |z| = 1.00 ∠ ±120°; w1 1.97 ∠ 30°, w2 2.28 ∠ 128°,
    w3 2.10 ∠ −65°.'
  - 'Theme tokens are threaded through every element: ink and inkSoft text, the grid
    token and page-coloured marker outlines. Both themes are fully legible and the
    data colors are identical in both.'
  weaknesses:
  - 'VQ-01 (both): at the 400 px thumbnail the tick labels and the polar rows (17
    CSS px on the 1200 px canvas) shrink to about 6 px and blur, though the bold rectangular
    rows stay readable → about 20 CSS px for the ticks and polar rows (+3 px). Likely
    cause: fontSize={17} on the TickLabels texts and on the polar row in Annotations.'
  - 'Suggestion: the vector-crossing push in the annotation placement (lines 107–114)
    could be dropped if a simpler outward offset gives the same render for this data.'
  - 'Suggestion: a slightly larger title (about 26 px) would better match the square
    canvas width.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400×2400 canvas.
      Chrome: the title "scatter-complex-plane · javascript · muix · anyplot.ai" is centred at the top in dark ink, with a horizontal legend below it ("Cube roots of unity" green, "Arbitrary points" lavender). Dark real and imaginary axes run through the origin with tick marks and labels −2, −1, 1, 2 and −2i, −1i, 1i, 2i, plus a "0" at the origin. The bold axis titles "Real part" and "Imaginary part" sit at the axis ends. The grid is subtle, and all text is readable.
      Data: a dashed grey unit circle is centred at the origin. The three cube roots (#009E73) sit on the circle at 0°, 120° and −120°. Three lavender (#C475FD) arbitrary points w1–w3 lie outside it. Arrows run from the origin to each point in the group colour, with heads at the marker rim. Each point has a two-row annotation: bold a+bi over a softer |z| ∠ θ.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, legend, axis titles and tick labels flip to light ink and the axes to light lines. The grid is subtle but visible. There is no dark-on-dark text.
      Data: the green and lavender markers, vectors and arrowheads are identical to the light render. The unit circle is light grey dashed, and the annotations are in light ink with soft-light polar rows.
      Legibility verdict: PASS
