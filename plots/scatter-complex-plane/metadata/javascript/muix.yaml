review:
  strengths:
  - 'Correct equal-aspect Argand diagram: origin-crossing Re/Im axes, dashed unit
    circle, and per-category arrow vectors, exactly matching the spec''s core requirements.'
  - Every point is annotated with BOTH rectangular (a+bi) and polar (r ∠ θ°) forms,
    with hand-tuned per-point label offsets that avoid any overlap in either theme.
  - 'Palette and theme handling are correct: first category (roots of unity) uses
    brand green #009E73, second category (arbitrary points) uses the next Imprint
    color, data colors are identical between light/dark, and chrome (background, grid,
    ticks, legend) correctly flips to FAF8F1/1A1A17.'
  - Deterministic, mathematically meaningful data (cube roots of unity + contrasting
    arbitrary points) with clean imports and a correctly-followed harness contract
    (skipAnimation, sizing from window.ANYPLOT_SIZE, square orientation directive,
    both PNG+HTML outputs present).
  weaknesses:
  - series=[] is passed to ChartContainer and every visual element (axes, ticks, legend,
    markers) is hand-drawn raw SVG driven only by useXScale/useYScale — understandable
    given the origin-crossing-axis requirement, but the implementation doesn't exercise
    any of MUI X's actual series/axis/legend components, which limits how much idiomatic
    MUI X usage it demonstrates.
  - Design is polished but fairly conventional for a reference-diagram layout; a stronger
    focal-point technique (e.g. visually emphasizing that the roots of unity sit exactly
    on the unit circle) would lift Design Excellence further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "scatter-complex-plane · javascript · muix · anyplot.ai" is centered at top in bold dark ink. Re/Im axis labels sit at the axis ends, tick labels (-2, -1, 1, 2, 2i, 1i, -1i, -2i, 0) are dark gray and clearly legible. Legend (top-left) shows "Cube roots of unity" (green swatch) and "Arbitrary points" (purple swatch). Grid lines are subtle light-gray verticals/horizontals at integer positions.
      Data: Green vectors/markers for z1=1+0i, z2=-0.5+0.87i, z3=-0.5-0.87i (the three cube roots, sitting exactly on the dashed unit circle); purple vectors/markers for w1, w2, w3 (arbitrary points outside the circle). Each point has a two-line annotation: rectangular form in bold dark ink, polar form in lighter gray beneath it. First series color is #009E73 brand green as required.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlaps between labels, vectors, or the unit circle.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same title, axis labels, and legend as the light render, now rendered in light/white ink against the dark background — fully legible, no dark-on-dark issues. Grid lines are subtle light-gray, still visible but unobtrusive.
      Data: Green and purple vector/marker colors are pixel-identical to the light render (only chrome flipped), confirming the Imprint data palette is theme-invariant as required.
      Legibility verdict: PASS — all text, ticks, and legend entries are clearly readable against the dark background; no dark-on-dark or light-on-light failures observed.
