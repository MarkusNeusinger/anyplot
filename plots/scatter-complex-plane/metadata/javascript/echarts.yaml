      Data: Four green circular markers (1+0i, 0+1i, -1+0i, 0-1i) on the unit circle, each with a green origin vector. Five purple diamond markers (1.8+1.2i, -1.5+0.9i, 0.7-1.9i, -0.9-2.2i, 2.1-0.4i) outside the circle, each with a purple origin vector and rectangular-form label. First series #009E73 (brand green), second series canonical Imprint purple.
      Legibility verdict: PASS. The Attempt-1 defect (0+1i / 0-1i labels bisected by the vertical axis line) is fixed — both labels are now offset right of the axis with no overlap.

