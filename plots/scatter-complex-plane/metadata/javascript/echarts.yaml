review:
  strengths:
  - 'Correct, idiomatic use of ECharts'' `lines` series with `symbol: ["none","arrow"]`
    to draw true origin-to-point vectors — an elegant, library-native solution for
    the Argand-diagram vector requirement.'
  - Unit circle rendered as a dashed reference line, with an invisible-scatter trick
    to place the "|z| = 1" label cleanly on the circle without cluttering it.
  - Equal aspect ratio correctly enforced via matching axis min/max (-2.5 to 2.5)
    on a square canvas, so the unit circle renders as a true circle, not an ellipse.
  - Distinct color (Imprint green/purple, canonical order) AND marker shape (circle
    vs. diamond) for the two point categories — solid redundant encoding beyond color
    alone.
  - 'Theme-adaptive chrome is fully correct: identical data colors between light and
    dark renders, correct page backgrounds, and all axis/tick/legend/title text uses
    ink/inkSoft tokens appropriately.'
  weaknesses:
  - The `0+1i` and `0-1i` point labels (points lying exactly on the imaginary axis)
    are visually bisected by the vertical Real/Imaginary axis line — the label's centered
    x-position sits exactly on x=0, so the axis stroke cuts through the middle of
    the text (e.g. through the '+' in '0+1i'). Offset these labels horizontally away
    from x=0, or nudge the axis-crossing points' label position, so the axis line
    no longer overlaps the annotation text.
  - 'The top-level `subtitle: {...}` option (intended to render "4th Roots of Unity
    and Arbitrary Points in the Argand Plane" beneath the title) never appears in
    either render — ECharts has no independent `subtitle` component; the equivalent
    is `title.subtext` (or a second `title` instance). This is dead code today; wire
    the descriptive line through `title.subtext` or remove the unused object.'
  - Only 7 total points (4 roots of unity + 3 arbitrary) are shown, near the low end
    of the spec's 5-50 range — consider adding a summed vector (e.g. the sum of the
    roots of unity, which is 0) or a couple more points to more fully demonstrate
    vector operations per the spec's example.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-complex-plane · javascript · echarts · anyplot.ai" in dark ink at top; legend below with green circle "Roots of unity" and purple circle "Arbitrary points"; y-axis name "Imaginary (Im)" centered above the plot, x-axis name "Real (Re)" at the far right of the horizontal axis line. All chrome text renders in dark ink, clearly legible against the light background. Real/imaginary axes are drawn as solid dark lines crossing through the origin, with a dashed gray unit circle labeled "|z| = 1".
      Data: Four green circular markers (roots of unity: 1+0i, 0+1i, -1+0i, 0-1i) sit on the unit circle, each connected to the origin by a green vector arrow and labeled with its rectangular form. Three purple diamond markers (1.8+1.2i, -1.5+0.9i, 0.7-1.9i) sit outside the unit circle, each connected to the origin by a purple vector arrow and labeled with its rectangular form. First series color is #009E73 (brand green) as required; second series uses the canonical Imprint purple.
      Legibility verdict: PASS, with one caveat — the "0+1i" and "0-1i" labels are visually bisected by the vertical imaginary-axis line (the axis stroke runs through the middle of the text). Numerals remain legible but this is a real overlap defect, noted in weaknesses.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Identical layout to the light render; all chrome text (title, legend, axis names, tick labels, "|z| = 1" label) flips to light ink (near-white/light-gray) and reads clearly against the dark background. Axis lines and grid lines are lighter gray, still subtle. No dark-on-dark failures observed anywhere.
      Data: Same green/purple markers, vectors, and labels as the light render, in identical colors and positions — confirms the Imprint rule that only chrome flips between themes, not data colors.
      Legibility verdict: PASS, with the same "0+1i"/"0-1i" axis-line-through-label caveat as the light render — the defect is theme-independent (present in both renders identically).
