review:
  strengths:
  - 'Palette compliance now correct: the two categories use consecutive canonical
    Imprint indices (palette[0] green, palette[1] lavender) with no ordinal skip'
  - Computed label-offset direction per vector angle keeps rectangular + polar annotations
    legible and non-overlapping across all 8 points, including the near-horizontal
    z0 case which now clears the x-axis tick band
  - Custom per-category arrowhead markers (SVG marker defs) correctly colored to match
    each vector's category
  - True equal-aspect-ratio square plot area (side = min(availW, availH)) keeps the
    unit circle perfectly circular as the spec requires
  - Full Imprint token theming carried through grid, axis, and ink colors — both renders
    are clean and legible with identical data colors
  - Mathematically meaningful, spec-aligned dataset (5th roots of unity + arbitrary
    points) that directly demonstrates the applications listed in the spec
  weaknesses:
  - z0 = 1+0i sits exactly on the x=1 tick. The full-height reference grid line for
    that integer (drawn by the manual grid loop) passes straight through the '1.0'
    tick-label text beneath the marker, partially cutting the '1' glyph in both renders
    — visible in a tight crop around (x=1, y=0). Skip drawing the reference grid line
    at any x/y value that coincides with a data point's coordinate, or add a small
    local gap/halo behind axis tick labels so grid lines never overlap tick text.
  - Design excellence stays close to the library-rules skeleton — the previous round's
    feedback to add more typographic contrast between the rectangular (primary) and
    polar (secondary) annotation lines, or a subtler grid opacity, was not yet applied
    this round.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "5th Roots of Unity · scatter-complex-plane · javascript · d3 · anyplot.ai" and "Re"/"Im" axis end-labels render in dark ink; legend shows a green circle "5th roots of unity" and a lavender square "Arbitrary points" (now palette[1], the canonical second Imprint slot). Faint reference grid at integer real/imaginary values, dashed unit circle reference.
      Data: Five green (#009E73) circles sit exactly on the dashed unit circle at 72° spacing (5th roots of unity, z0..z4); three lavender (#C475FD) squares (magnitudes 1.9-2.1) sit outside the circle (w1..w3). Colored vectors with arrowheads run from the origin to every point; each point carries a rectangular-form annotation (e.g. "z1 0.31+0.95i") plus a smaller italic polar-form annotation ("r=1.00, θ=72°") beneath it.
      Legibility verdict: PASS overall, with one minor defect — the "1.0" x-axis tick label directly beneath the z0 marker (z0 = 1+0i lies exactly on that tick) has the vertical reference grid line for x=1 drawn straight through the "1" glyph, partially cutting it. Every other text element (title, legend, axis end-labels, all 8 point annotations, remaining tick labels) is cleanly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, axis labels, and tick labels now rendered in light ink against the dark surface; grid switches to a dark-appropriate subtle tone.
      Data: Marker/vector colors (green #009E73, lavender #C475FD) are pixel-identical to the light render — confirmed only chrome flipped. Same dual-form annotations, fully legible in light text against the dark background.
      Legibility verdict: PASS overall, same single defect as the light render — the "1.0" x-tick label has the x=1 reference grid line crossing through it beneath the z0 marker. No dark-on-dark failures; no other overlap or legibility issues observed.
