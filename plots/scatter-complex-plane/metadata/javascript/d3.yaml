review:
  strengths:
  - Computed label-offset direction per vector angle keeps rectangular + polar annotations
    legible and non-overlapping across all 8 points
  - Custom per-category arrowhead markers (SVG marker defs) correctly colored to match
    each vector's category
  - True equal-aspect-ratio square plot area (side = min(availW, availH)) keeps the
    unit circle perfectly circular as the spec requires
  - Full Imprint token theming carried through grid, axis, and ink colors — both renders
    are clean and legible with identical data colors
  - Mathematically meaningful, spec-aligned dataset (5th roots of unity + arbitrary
    points) that directly demonstrates the applications listed in the spec
  weaknesses:
  - Second category ('Arbitrary points') uses t.palette[2], skipping t.palette[1],
    with no evident semantic reason — canonical order should use consecutive Imprint
    indices for a simple two-category legend; switch to palette[1] or document the
    semantic exception
  - The z0 annotation text ('z0 1.00+0.00i') sits very close to the '2.0' x-axis tick
    label since z0 = 1+0i lies exactly on a grid line — increase the label offset
    or bias the annotation placement so it clears the tick text
  - Design excellence stays close to the library-rules skeleton (standard theme-token
    grid/axis treatment) — could push further with a more refined typographic hierarchy
    between primary (rectangular) and secondary (polar) annotation text, or a subtler
    grid opacity
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct — not pure white.
      Chrome: Title "5th Roots of Unity · scatter-complex-plane · javascript · d3 · anyplot.ai" in dark ink at top; legend with green circle "5th roots of unity" and blue square "Arbitrary points"; "Re" and "Im" axis end-labels in dark ink; tick labels ("-3.0" .. "3.0" and "-3i" .. "3i") in soft ink; faint integer reference grid. All text is clearly readable against the light background.
      Data: 5 green circles (5th roots of unity) sit exactly on a dashed unit circle at 72° spacing; 3 blue squares (arbitrary points, magnitudes 1.9-2.1) sit outside the circle. Green and blue vectors with arrowheads run from the origin to every point. Each point is annotated with its rectangular form (e.g. "z1 0.31+0.95i") in bold ink and its polar form ("r=1.00, θ=72°") in soft ink beneath it. First categorical series is #009E73 (green) as required.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct — not pure black.
      Chrome: Same title, legend, axis end-labels, and tick labels now rendered in light ink/soft-light tones against the dark background; grid lines switch to a dark-theme-appropriate subtle tone.
      Data: Same green (#009E73) and blue marker/vector colors as the light render — confirmed identical data colors, only chrome flipped. Same rectangular/polar annotations, now in light text, fully legible against the dark background.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all titles, ticks, and annotation text are clearly visible in both themes.
