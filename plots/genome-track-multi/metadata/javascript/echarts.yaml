review:
  strengths:
  - 'Excellent multi-track alignment: shared vertical gridlines tie gene exon positions,
    coverage peaks, and variant calls together across all four tracks, creating genuine
    visual storytelling for a genome-browser use case.'
  - Strand direction correctly encoded via directional chevrons between exons (rightward
    chevrons for GeneA '+', leftward for GeneB '-'), plus a thin intron backbone line
    per gene — faithfully reproduces real genome-browser conventions from the spec
    Notes.
  - Lollipop variant markers combine a stem (bar) and a circle (scatter) sized by
    quality score, correctly split into SNP vs. Indel series.
  - 'Theme-adaptive chrome is clean in both renders: backgrounds are correct warm
    off-white/near-black, all title/axis/track-label text is legible, and pixel-sampling
    confirms GeneA is exactly brand green #009E73 and GeneB/Coverage exactly match
    Imprint palette positions 2 and 3.'
  - No AR-09 edge clipping — comfortable margins on all four sides in both renders,
    including the rightmost x-axis tick label and the right-aligned 'Depth'/'Qual'
    unit labels.
  weaknesses:
  - 'Legend swatches for ''SNP'' and ''Indel'' render in ECharts'' default-theme colors
    (lime-green ~#B6D634 and slate-navy ~#454A68) instead of the Imprint colors actually
    used on the markers (ochre #BD8233 for SNP, matte-red #AE3030 for Indel) -- confirmed
    identical, wrong-colored in both light and dark renders. Root cause: the option
    passed to chart.setOption(...) never sets the top-level `color: t.palette` array
    required by prompts/library/echarts.md (''Set ECharts'' top-level color array
    to the Imprint palette... Never use ECharts'' default palette''); per-datum itemStyle
    colors the bars/points correctly, but the legend swatch is derived from series-level
    color which falls back to ECharts defaults. Fix: add `color: t.palette` at the
    top level of the option (or set `itemStyle: { color: variantColor.SNP }` / `variantColor.Indel`
    at the series level, not only per-datum) so the legend matches the chart.'
  - In the rightmost Regulatory cluster (~140,718,500-140,719,900 bp) the 'Promoter'
    and 'Enhancer' text labels sit almost flush against each other with no visible
    gap -- not clipped or truly overlapping, but tight enough to misread as one run-on
    label at normal viewing size; nudge the second label a few px right or reduce
    to abbreviated forms when spacing is this tight.
  - The small (12px) 'Depth' / 'Qual' value-axis unit labels tucked into the top-right
    corner of the Coverage and Variants tracks are easy to miss against the track's
    own data at a glance; a slightly larger size or a subtle background chip would
    improve discoverability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the required #FAF8F1 (pixel-sampled) -- not pure white.
      Chrome: Title "genome-track-multi · javascript · echarts · anyplot.ai" is centered, dark, and fully readable. Four left-side track labels (Genes, Coverage, Variants, Regulatory) are bold dark text, clearly legible. X-axis tick labels (140,700,000 ... 140,720,000) and the "chr7 position (bp)" axis title are legible dark-grey text. Small "Depth"/"Qual" unit labels top-right of their tracks are legible but small. Vertical alignment gridlines are subtle light-grey, visible without dominating.
      Data: GeneA exons are brand green (#009E73, confirmed by pixel sampling), with right-pointing chevrons between exons (correct for "+" strand) and a thin green intron backbone. GeneB exons are lavender/purple (#C475FD, confirmed), left-pointing chevrons (correct for "-" strand). Coverage track is a blue (#4467A3, confirmed via alpha-blended sample) filled area line showing read-depth peaks that visibly align with gene exon positions via the shared vertical guides. Variants track shows lollipop markers (stem + circle, size scaled by quality) in ochre for SNP and dark red/maroon for Indel. Regulatory track shows cyan "Promoter" and rose/maroon "Enhancer" rectangles with matching-colored name labels above. Legend chips in the top-right read "SNP" (lime-green swatch) and "Indel" (slate-navy swatch) -- these swatch colors do NOT match the ochre/maroon colors actually used on the variant markers below (see Weaknesses).
      Legibility verdict: PASS (all text readable; the legend-color mismatch is a correctness/palette-compliance issue, not a legibility issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the required #1A1A17 -- not pure black.
      Chrome: Title and all four track labels are light/off-white text, fully readable against the dark background. X-axis tick labels and axis title are legible light-grey. No dark-on-dark text found anywhere -- title, track labels, tick labels, and unit labels all flip correctly to light ink.
      Data: All data colors (GeneA green, GeneB lavender, Coverage blue, SNP ochre, Indel maroon, Promoter cyan, Enhancer rose) are visually identical to the light render -- confirmed only chrome (backgrounds, text, gridlines) changed between renders, as required. The same legend-swatch mismatch (lime-green/slate-navy chips vs. actual ochre/maroon marker colors) is present and identical to the light render, confirming it is a data-independent rendering bug rather than a theme-specific one.
      Legibility verdict: PASS (all text readable in dark theme; no dark-on-dark failures).
