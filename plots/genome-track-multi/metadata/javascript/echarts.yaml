review:
  strengths:
  - All four tracks (Genes, Coverage, Variants, Regulatory) share a single pixel-accurate
    x-mapping and are tied together with subtle vertical alignment guides, so a reader
    can trace an exon straight down to its coverage bump and nearby variants/regulatory
    elements — genuinely useful genome-browser storytelling.
  - Gene track correctly distinguishes exons (blocks), introns (thin backbone line),
    and strand direction (chevrons pointing + for GeneA, - for GeneB), matching the
    spec's explicit encoding guidance.
  - Coverage depth is generated with a realistic exon-associated bump (insideExon())
    rather than pure noise, so the coverage track visually correlates with the gene
    structure above it — thoughtful synthetic-data design.
  - Variant track combines bar (lollipop stem) + scatter (lollipop head, symbolSize
    scaled to quality score) to encode both position and quality/effect size, exactly
    as the spec recommends.
  - 'Imprint palette used correctly and consistently: palette[0] (#009E73) on the
    primary GeneA series, canonical ordinal positions for GeneB/Coverage/SNP/Regulatory,
    with the matte-red anchor (palette[4]) reserved for Indel (a defensible severity-flavored
    use) — verified against prompts/default-style-guide.md.'
  - 'Both renders pass the theme-readability check: warm off-white / near-black backgrounds,
    all chrome text readable, and data colors identical between light and dark — verified
    via pixel crops of tick labels, axis unit labels, and the tight Promoter/Enhancer
    label pair (close but not overlapping).'
  - 'Title format matches the required ''{spec-id} · {language} · {library} · anyplot.ai''
    pattern exactly, and previous review feedback (missing top-level `color: t.palette`
    and explicit itemStyle on the SNP/Indel bar series) was correctly fixed in this
    attempt.'
  - 'Deterministic LCG PRNG (no Math.random) satisfies the browser-harness reproducibility
    requirement; mount-node contract followed correctly (no explicit width/height
    or devicePixelRatio on echarts.init, animation: false set).'
  weaknesses:
  - The two rightmost Regulatory-track labels ('Promoter' and 'Enhancer' near chr7:140,718,500-140,719,900)
    sit very close together with only a few pixels of gap — not an actual overlap
    today, but there is little margin; consider nudging the second label right or
    dropping the color-coded rect width slightly if the region is ever made denser.
  - Alternating track-shading is only applied to the Genes and Regulatory bands (graphicEls
    rect fills), not to Coverage/Variants — the spec's 'consider subtle background
    shading to visually separate adjacent tracks' note is only partially followed;
    adding a matching elevatedBg rect behind the Variants band would make the 4-track
    separation fully consistent.
  - Several small coordinate-mapping helpers (xPix, yPixGene, yPixReg, insideExon)
    are necessary for this custom multi-track layout, but a plain array of gene/regulatory
    pixel-rect objects built once (instead of recomputing yPixGene/yPixReg per element)
    would trim a little repetition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec — not pure white.
      Chrome: Title "genome-track-multi · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. Legend (SNP amber swatch, Indel red swatch) top-right, legible. Four bold track labels on the left ("Genes", "Coverage", "Variants", "Regulatory") in dark ink, all readable. Right-side y-axis tick numbers (50/25/0 for Depth, 60/30/0 for Qual) and small "Depth"/"Qual" unit labels are legible and do not collide (verified via pixel crop). Bottom x-axis shows genomic-position tick labels (140,700,000 … 140,720,000) plus the axis title "chr7 position (bp)", fully visible with margin below — not clipped at the canvas edge (verified via pixel crop of the bottom band).
      Data: GeneA exons/backbone/strand-chevrons in Imprint green (#009E73, palette[0], correct first-series color); GeneB in palette[1] lavender; Coverage filled area in palette[2] blue; SNP lollipops in palette[3] ochre; Indel lollipops in palette[4] matte red; Promoter/Enhancer rectangles in palette[5]/palette[6] cyan/mauve. All colors trace back to the Imprint palette, no custom hexes. Vertical guide lines at each 5,000 bp tick run through all four tracks, visually linking gene/coverage/variant/regulatory alignment.
      Legibility verdict: PASS — no light-on-light text, no clipped elements, no overlapping text found in close inspection (title, legend, track labels, axis labels/ticks, and the tightly-spaced "Promoter"/"Enhancer" label pair all checked at full resolution).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec — not pure black.
      Chrome: Same title/legend/track-label/axis structure as the light render, all rendered in light ink tones (white/light-gray text) that are clearly readable against the dark background — no dark-on-dark failures observed anywhere (title, legend text, "Genes"/"Coverage"/"Variants"/"Regulatory" labels, Depth/Qual unit labels, x-axis position ticks and "chr7 position (bp)" label all confirmed legible).
      Data: Identical hex values to the light render for every series (GeneA green, GeneB lavender, Coverage blue, SNP ochre, Indel red, Promoter cyan, Enhancer mauve) — only the chrome (background, text, grid guide lines) flipped to the dark-theme tokens, exactly as required.
      Legibility verdict: PASS — all text and data elements read clearly against the near-black surface; no theme-adaptation failures found.
