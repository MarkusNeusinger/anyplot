review:
  strengths:
  - Excellent use of Highcharts' multi-pane stacked yAxis technique to build a genuine
    4-track genome browser sharing one x-axis (top/height percentages per axis) —
    an idiomatic, non-trivial application of the library's panel system.
  - 'Correct biological semantics: coverage peaks (Gaussian bumps) align precisely
    under exon positions, giving the plot an inherent, readable story without needing
    annotations.'
  - 'Full Imprint palette compliance: first series (Exon) is #009E73, remaining tracks
    use the canonical palette order, and data colors are identical between light and
    dark renders.'
  - Both themes are fully readable — chrome (background, text, grid) flips correctly,
    no dark-on-dark or light-on-light failures.
  - Alternating background shading (Genes/Variants tracks tinted, Coverage/Regulatory
    not) cleanly separates adjacent tracks per the spec's 'subtle background shading'
    note.
  - Gene model correctly distinguishes exons (thick square-capped segments) from introns
    (thin segments) with strand-direction chevrons, matching the spec's rendering
    guidance.
  weaknesses:
  - Two small helper functions (gaussianBump, trackAxis) are used rather than a strictly
    flat imports->data->plot script; reasonable given the four-track repetition, but
    deviates from the ideal KISS structure.
  - Coverage and Variants track gridlines use a fairly plain default 1px style — could
    be made more subtle (thinner/lower-opacity) for a more polished, less 'default
    library' look.
  - No visual cue links the two Enhancer regulatory elements as the same category
    beyond color/legend (e.g. no shared border style) — minor, does not affect readability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "genome-track-multi · javascript · highcharts · anyplot.ai" is dark and clearly legible at top center. Four track labels ("Genes", "Coverage", "Variants", "Regulatory") sit at the top-left of each track in bold dark-grey text. Axis tick labels (position numbers, y-axis values) are dark grey and readable. X-axis title "Genomic Position — chr7 (bp)" is legible. Legend row at the bottom (Exon, Intron, Read Depth, SNP, Indel, Promoter, Enhancer) is fully readable, dark text on light background.
      Data: Genes track shows a green (#009E73) gene model — thick square exon blocks connected by thin intron lines with small right-pointing chevrons indicating + strand. Coverage track is a lavender/purple filled area with six Gaussian peaks aligned exactly under the six exons. Variants track shows blue circle (SNP) and orange diamond (Indel) lollipops of varying height (quality score). Regulatory track shows one cyan rectangle (Promoter) and two maroon rectangles (Enhancer). First categorical series (Exon) is confirmed #009E73 green.
      Legibility verdict: PASS — all text clearly readable against the light background, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and all four track labels render in light/white text, clearly legible against the dark background. Tick labels and axis titles are light grey, easily readable. Legend text is light-colored and readable at the bottom.
      Data: Data colors are identical to the light render — green gene model, purple coverage area, blue/orange variant lollipops, cyan/maroon regulatory rectangles — confirming only chrome (not data) flips between themes. No dark-on-dark issues detected anywhere (all labels, ticks, and the title use light-colored text against the near-black surface).
      Legibility verdict: PASS — all text clearly readable against the dark background, no dark-on-dark failures.
