review:
  strengths:
  - Faithful custom genome-track geometry (exon boxes, intron backbone, strand chevrons)
    implemented via Chart.js beforeDraw/afterDatasetsDraw plugin hooks, since Chart.js
    ships no native genome-track chart type
  - 'Correct Imprint palette application: first series (Exon) is #009E73, remaining
    tracks use canonical palette positions, intentionally skipping the semantic-red
    anchor since no error/bad category is present'
  - Excellent theme-adaptive chrome — the gene backbone lines and strand chevrons
    use the neutral ink token and flip from black to white correctly between light
    and dark renders
  - Clear alternating band shading separates adjacent tracks (Genes/Coverage shaded,
    Regulatory/Variants plain) with subtle divider rules, matching the spec's 'subtle
    background shading' request
  - 'Realistic, internally consistent data: coverage depth is enriched exactly over
    exon spans, promoters/enhancers sit near gene starts, variant quality scores span
    a plausible range, and lollipop stem height/marker size directly encode that quality
    per the subtitle'
  - Legend cleanly maps all six categories (Exon, Promoter, Enhancer, Coverage depth,
    SNP, Indel) to their track colors via color-only proxy datasets
  weaknesses:
  - Coverage and Variants tracks encode magnitude (read depth, quality score) purely
    through height with no numeric scale reference (e.g. a '0-70x' or '0-100' range
    annotation) — a minor genome-browser convention gap, not a hard requirement
  - Y-axis has no formal axis title beyond the track name ticks (Genes/Regulatory/Coverage/Variants)
    — acceptable for this genome-browser layout but a small 'Track' label would add
    polish
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "genome-track-multi · javascript · chartjs · anyplot.ai" and italic dark-gray subtitle both clearly legible; four dark bold track labels (Genes, Regulatory, Coverage, Variants) on the left are readable; x-axis title "Genomic Position — chr7 (Mb)" and Mb tick labels are dark and readable; bottom legend text is readable dark-gray.
      Data: First series (Exon) renders in #009E73 brand green as required. Regulatory boxes use lavender (promoter) and blue (enhancer); coverage area fill is ochre; variant lollipops use cyan (SNP) and rose/purple (indel). Gene backbone lines and strand chevrons render in dark ink (NEUTRAL token).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle render in white/light-gray and are clearly legible; track labels, x-axis title, tick labels and legend all switch to light-gray/white text with no dark-on-dark elements found.
      Data: Colors are identical to the light render — #009E73 exons, lavender/blue regulatory boxes, ochre coverage fill, cyan/rose variant lollipops — confirming only chrome flipped. Gene backbone lines and strand chevrons correctly flip from black to white via the NEUTRAL token.
      Legibility verdict: PASS
