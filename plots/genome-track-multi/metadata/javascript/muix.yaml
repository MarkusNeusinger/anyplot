review:
  strengths:
  - Composes the tracks inside ChartsContainer and draws them through the useXScale/useDrawingArea
    hooks, so every exon, regulatory element, coverage sample and variant shares the
    one native MUI X linear position axis and features line up exactly across tracks
  - 'Gene track follows the genome-browser idiom: exon rectangles joined by thin intron
    lines with repeated chevrons pointing in each gene''s strand direction, and the
    strand repeated in the gene label'
  - Coverage area rises from its own zero baseline with exon-driven peaks, variants
    are lollipops measured from the track baseline, and alternating elevatedBg bands
    separate the tracks subtly in both themes
  - Region identifier folded into the x-axis title (Position (bp) — chr7:140,700,000-140,712,000)
    with thousands-separated tick labels via valueFormatter
  - All chrome reads from ANYPLOT_TOKENS, so ink, grid and band shading flip correctly
    between the light and dark renders while data colors stay identical
  weaknesses:
  - 'VQ-07 (both): Indel is drawn in #AE3030, the matte-red semantic anchor, only
    because it is the fifth feature type in order; an indel is not a bad/loss/error
    role → the next non-anchor Imprint position, cyan #2ABCCD. Likely cause: featureColor
    maps discreteTypes to t.palette[i] by index, so slot 5 is reached ordinally.'
  - 'VQ-01 (both): x tick labels, legend entries and gene labels at 13 CSS px sit
    below the 14–16 px the muix prompt sets for axis and legend text and blur in the
    400 px thumbnail → about 15 px (+2 px). Likely cause: tickLabelStyle fontSize
    13, legend Typography fontSize 13, gene <text> fontSize 13.'
  - 'DQ-02 (both): the genes are labelled GENE1 and GENE2, which read as placeholders
    → gene-style symbols that fit the scenario. Likely cause: the symbol fields in
    the genes list of the data block.'
  - 'CQ-01 (code): beyond the component the harness needs, the file adds the `present`
    and `trackKind` helper functions (lines 157–170) plus a TRACK_RENDERERS dispatch
    table → remove the heuristic classifier and select each track''s renderer directly
    from its rows inside GenomeTracks. Likely cause: a generic renderer-dispatch design.'
  - 'LM-01 (code): the variant stem scale uses the typed limit MAX_QUALITY = 60 although
    the muix prompt says limits come from the data → derive the maximum from the variant
    rows'' values. Likely cause: the MAX_QUALITY constant.'
  - 'Suggestion: a small max-value label (e.g. depth and quality) on the coverage
    and variant tracks would let the reader read the heights, which the spec permits
    as a per-track scale.'
  - 'Suggestion: start the chevrons inside introns only, so the one at about 7,850
    bp is not half-hidden by the edge of GENE2''s second exon.'
