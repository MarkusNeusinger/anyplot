review:
  strengths:
  - Composes the chart from ChartsContainer + ChartsXAxis and draws every track inside
    it with the useXScale / useDrawingArea hooks, so all tracks share the library's
    single linear x scale and line up exactly.
  - 'Every spec element is present: exon rectangles joined by intron lines with strand
    chevrons, a coverage area from its own zero baseline, quality-encoded lollipops
    from the track baseline, and promoter/enhancer rectangles named in a legend.'
  - Theme tokens are threaded through every hand-drawn element (ink, inkSoft, grid,
    elevatedBg), so both renders read cleanly; the palette skips the red anchor slot
    deliberately.
  - Deterministic data via a fixed-seed LCG; data block follows the role-constant
    / records contract.
  weaknesses:
  - 'DQ-02 (both): real gene symbols AGK and BRAF carry invented exon structures (BRAF
    drawn with 5 exons over 5 kb; the real gene has 18 exons over ~190 kb) → use fictional
    gene symbols for the synthetic locus, or real coordinates for the real genes.
    Likely cause: the `genes` list in the data block.'
  - 'CQ-01 (code): four helper components (GenesTrack, RegulatoryTrack, CoverageTrack,
    VariantsTrack) plus a heuristic renderer dispatch add structure beyond the one
    hook-using component that the composition API needs → draw the four tracks inline
    in GenomeTracks, branching on the track rows. Likely cause: per-track component
    split.'
  - 'Suggestion: skip chevron offsets that fall on or inside an exon — the BRAF chevron
    at 7,900 bp is half hidden behind the exon edge.'
  - 'Suggestion: the coverage area uses the same green as the Exon legend swatch;
    a neutral or second hue would keep "Exon" from reading as the coverage key.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; Regulatory and Variants bands carry subtle elevated shading
      Chrome: title, HTML legend row (Exon, Promoter, Enhancer, SNP, Indel), left track labels (Genes, Regulatory, Coverage, Variants), comma-formatted ticks 0–12,000 bp and axis title "Position (bp) — chr7:140,700,000-140,712,000" — all dark text, readable
      Data: green #009E73 exons for AGK (+) and BRAF (-) joined by intron lines with strand chevrons; purple promoters and blue enhancers; translucent green coverage area peaking over exons; amber SNP and cyan Indel lollipops with quality-encoded heights; 2,000 bp vertical grid through all tracks
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 with slightly lighter elevated bands
      Chrome: all text in light ink and readable; intron lines and chevrons light grey; no dark-on-dark
      Data: colors identical to the light render; only chrome flips
      Legibility verdict: PASS
