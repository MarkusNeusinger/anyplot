      Data: Genes track with GENE1 (+) four green #009E73 exons and right-pointing chevrons, GENE2 (-) five exons with left-pointing chevrons; Regulatory track with lavender promoters and blue enhancers; Coverage as a translucent green filled area from a zero baseline with peaks over exons; Variants as ochre (SNP) and red (Indel) lollipops of varying heights.
