review:
  strengths:
  - Uses the shared genomic x-scale (useXScale + useDrawingArea) so all four tracks
    stay perfectly coordinate-aligned along the same base-pair axis, exactly as a
    real genome browser needs
  - Gene track correctly renders exons as rectangles, introns as thin connecting lines,
    and strand-direction chevrons that only surface in intron gaps (occluded by exon
    rectangles drawn on top), which is a subtle and correct z-order choice
  - All four notes-recommended track types are present, including the optional regulatory-elements
    track (promoters/enhancers) and quality-encoded lollipop variant markers
  - Deterministic in-memory data via a fixed-seed LCG, with realistic RNA-seq-style
    coverage boosts inside exons and plausible Phred-like variant quality values
  - Alternating subtle background shading correctly separates adjacent tracks (Regulatory
    and Variants) without overwhelming the page background, matching the spec's separation
    guidance
  - 'Correct Imprint palette usage: exons use the mandatory brand green t.palette[0],
    data colors are identical between light and dark renders, and only chrome (background/text/grid)
    flips'
  - Title and custom legend match the spec-mandated format exactly, and every legend
    swatch color matches the corresponding track element
  weaknesses:
  - Coverage and Variants tracks encode magnitude (read depth, variant quality) purely
    by relative height with no numeric y-scale reference anywhere on the chart — a
    viewer can compare peaks to each other but can't read an actual depth or quality
    value. Consider a small max-value label per track (e.g. 'depth (max 76x)' near
    the Coverage label) for quantitative context.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the Imprint light theme.
      Chrome: Title "genome-track-multi · javascript · muix · anyplot.ai" in dark ink, top-left. A custom 5-item legend (Exon/Promoter/Enhancer/SNP/Indel) with color swatches below the title. Four left-side track labels ("Genes", "Regulatory", "Coverage", "Variants") in dark ink, right-aligned before the plot area. X-axis tick labels (0 to 12,000, comma-formatted) and axis title "Position (bp) — chr7:140,700,000-140,712,000" in soft ink, all clearly legible.
      Data: Exons rendered as brand-green (#009E73) rectangles connected by thin gray lines with directional chevrons (rightward for GENE1 (+), leftward for GENE2 (-)). Regulatory track shows purple promoter boxes and blue enhancer boxes. Coverage track is a green filled-area plot with peaks aligned under exons. Variants track shows red (SNP) and cyan (indel) lollipop markers with stem height encoding quality score. Alternating subtle gray-cream band shading distinguishes the Regulatory and Variants tracks from Genes/Coverage.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable, no overlaps, no clipped elements.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the Imprint dark theme.
      Chrome: Same title, legend, and track labels now rendered in light/white text against the dark background — fully legible, no dark-on-dark issues anywhere.
      Data: All data colors (brand green exons/coverage, purple promoters, blue enhancers, red SNPs, cyan indels) are pixel-identical to the light render — only the chrome (background, text, grid, band shading) has flipped to the dark palette, exactly per the theme-adaptive requirement.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all chrome elements and data marks are clearly distinguishable from the near-black background.
