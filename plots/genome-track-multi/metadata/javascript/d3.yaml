review:
  strengths:
  - Correct Imprint palette in canonical order (green genes, lavender coverage, blue
    variants, ochre regulatory), identical data colors across both themes with theme-correct
    chrome
  - 'Comprehensive feature coverage: gene structure with exons/introns/strand chevrons,
    coverage area, SNP vs. indel variants with quality-encoded height, and optional
    regulatory elements — every feature named in the spec is present'
  - Shared vertical alignment guides spanning all four tracks let a reader trace one
    genomic position across gene structure, coverage, variants, and regulation at
    once — a genuine storytelling touch that serves the spec's 'single coordinated
    view' goal
  - Alternating subtle track-lane shading plus per-track caption text (encoding key)
    substitute cleanly for a formal legend without cluttering the chart
  - 'Deterministic, realistic synthetic data: plausible exon/intron sizes, VCF-like
    variant quality scores, a fictional gene name that avoids implying real clinical
    data'
  weaknesses:
  - Title occupies a fairly modest share of canvas width for the mandated long-title
    format — could be sized a touch larger for more visual presence (cosmetic, not
    a rule violation)
  - Variant markers (circle r=8, small rotated-square indels) are on the small side
    given only 10 sparse features across the track — slightly larger markers would
    better follow the sparse-data prominence guideline
  - The shared x-axis keeps a solid domain line while every other axis/spine is stripped
    to minimal — a fully spine-free treatment (or a matching minimal treatment) would
    push visual refinement further
  - The variants track has no numeric y-axis reference for the quality encoding —
    only the descriptive caption 'height ∝ quality' — a few faint tick labels would
    remove ambiguity about exact values
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "GENEA-201 Locus · genome-track-multi · javascript · d3 · anyplot.ai" centered at top. Four stacked track labels ("Genes", "Coverage", "Variants", "Regulatory") in bold dark ink on the left, each with a lighter grey caption describing its encoding (e.g. "solid = exon · line = intron · chevrons = strand"). X-axis at the bottom reads "Genomic position — chr7 (bp)" with comma-formatted tick labels (140,500,000 … 140,520,000). All text is dark-on-light and clearly legible.
      Data: Genes track shows a green backbone line with chevron arrows (strand direction) and 6 solid green exon rectangles, plus an italicized gene label "GENEA-201 (+ strand)". Coverage track is a lavender/purple filled area plot with small "0/20/40" y-axis tick labels, peaking over the exon positions. Variants track shows blue lollipop stems with circles (SNPs) and small rotated squares/diamonds (indels), height proportional to quality. Regulatory track shows three ochre/tan rectangles labeled "Promoter" and "Enhancer" beneath them. First categorical series (genes) is the brand green #009E73; remaining tracks follow the Imprint palette in canonical order (lavender, blue, ochre).
      Legibility verdict: PASS — all title, track labels, captions, and tick labels are clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout and text content as the light render, but title, track labels, and captions render in light ink (near-white/light-grey) against the dark background; x-axis tick labels and the "Genomic position" caption are light grey. Track lane shading uses a slightly lighter dark tone (elevated background) for the alternating tracks, and is visible without competing with data.
      Data: All data colors are identical to the light render — the same green exons/backbone, lavender coverage fill, blue variant markers, and ochre regulatory blocks appear in the exact same palette hexes, only the chrome (background, text, grid) flipped. No color drift observed between themes.
      Legibility verdict: PASS — no dark-on-dark text found; all chrome elements (title, labels, ticks, captions) use light-colored ink that reads clearly against the dark surface.
