review:
  strengths:
  - Horizontal intervals use ggplot2 4's geom_errorbar(orientation = "y") rather than
    the deprecated geom_errorbarh(), so the layer renders without deprecation warnings
  - Significance is mapped once to both color and fill with matching scale_*_manual()
    names, so ggplot2 merges them into one legend whose glyphs (point plus interval
    line) match the marks in both themes
  - Rows are ordered by absolute coefficient size via a factor built from the arranged
    data, so the largest effect (Square Footage) anchors the bottom row and the two
    non-significant terms sit together at the top
  - 'Non-significant terms use the theme-adaptive INK_SOFT neutral while significant
    terms carry brand green #009E73, so the zero-crossing intervals recede in both
    renders'
  - Canvas is exactly 3200x1800 in both themes via ggsave(width = 8, height = 4.5,
    dpi = 400) with ragg
  weaknesses:
  - 'DQ-03 (both): the model carries both Age (-0.15) and Year Built (+0.12) as separate
    predictors, but in a housing price regression age is the sale year minus the year
    built, so the two are perfectly collinear and a fitted model cannot estimate both
    → replace one of them with an independent predictor (for example Neighborhood
    Crime Rate or Kitchen Renovated). Likely cause: the variable list in the data
    block.'
  - 'Suggestion: the major grid is solid INK at 0.1 mm, so each horizontal gridline
    runs right through its interval line; drawing the grid at about 15 % opacity (or
    dropping panel.grid.major.y) would let the intervals stand out from the rows.'
  - 'Suggestion: the data block could follow the library prompt''s column-constant
    form (tibble with !!COL := and .data[[...]]) so readers can swap in their own
    coefficient table.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; canvas 3200x1800.
      Chrome: title "coefficient-confidence · r · ggplot2 · anyplot.ai" top-left in dark ink at about 48 % of the width; y-axis title "Predictor Variable", x-axis title "Coefficient Estimate" in dark ink; tick labels (variable names, -0.5/0.0/0.5/1.0) in dark soft gray; thin dark major grid; solid soft-gray zero line, slightly heavier than the grid. Bottom legend "Statistically Significant" with No (gray point + line) and Yes (green point + line). All text readable.
      Data: 10 coefficients as points with capped horizontal CI bars; 8 significant in #009E73, 2 non-significant (Property Tax Rate, Year Built) in #4A4A44 gray, both crossing zero. Ordered by |coefficient|: Square Footage (0.85) at the bottom, Property Tax Rate (-0.08) at the top; effects on both sides of zero.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17; canvas 3200x1800.
