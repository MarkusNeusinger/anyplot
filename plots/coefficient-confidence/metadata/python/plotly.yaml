review:
  strengths:
  - 'Significance is double-encoded (solid #009E73 vs hollow neutral ring), so it
    reads in both themes and under colour-vision deficiency'
  - Hollow markers are filled with the page colour, so the interval line breaks cleanly
    behind the estimate
  - Rows ordered by coefficient via categoryorder='array'; the axis range is derived
    from the CI extremes rather than typed in
  - customdata + hovertemplate expose each estimate with its 95% CI in the interactive
    HTML
  - Full-height dashed INK zero line stands clearly apart from the subtle grid in
    both renders
  weaknesses:
  - 'Suggestion: the per-row interval traces could become one trace per significance
    group with native error_x (array/arrayminus), which also draws the caps'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across paper and plot area, 3200x1800.
      Chrome: title 'coefficient-confidence · python · plotly · anyplot.ai' centred in near-black; framed horizontal legend below it ('Significant (CI excludes zero)', 'Not significant'); y-axis 'Predictor variable' with 12 variable names in soft ink; x-axis 'Coefficient estimate (standardized)' with ticks -0.4..0.6; subtle grid; left and bottom axis lines only. All text readable.
      Data: 12 rows ordered by coefficient (Square Footage top, Distance to City Center bottom); six significant estimates as solid #009E73 dots with green intervals and caps, six non-significant as hollow dark-grey rings with grey intervals; dashed near-black zero line runs the full height.
      Legibility verdict: PASS

