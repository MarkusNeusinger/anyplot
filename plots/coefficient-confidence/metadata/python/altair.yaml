review:
  strengths:
  - Intervals are drawn natively as mark_rule with x/x2 encodings, layered with the
    point estimates through alt.layer, and both layers share one Y and Color encoding
  - Significance is computed from whether the interval clears zero and mapped to brand
    green against the theme-adaptive muted anchor; the legend labels state the rule,
    so the key explains itself
  - The dashed full-height zero line in INK is clearly distinct from the faint solid
    gridlines in both themes
  - Rows are sorted by coefficient with the largest on top, and every variable is
    named in full
  - Tooltips carry the estimate, both CI bounds and the significance label in the
    HTML view
  - The housing-price scenario uses plausible magnitudes, 95% intervals computed as
    estimate ± 1.96·SE, and coefficients on both sides of zero
  weaknesses:
  - 'Suggestion: a slightly wider inner view (about 620 px instead of 560 px) would
    use more of the landscape canvas, which now has generous side margins.'
