review:
  strengths:
  - Clean horizontal coefficient plot on the canonical 3200x1800 canvas, ordered by
    |coefficient| with the largest effect at the top
  - Significance computed from whether the 95% CI excludes zero and encoded green
    (#009E73) vs. a theme-adaptive neutral, with a legend that states the rule
  - 'Idiomatic Bokeh: ColumnDataSource per significance group, vectorised p.segment
    intervals, categorical y_range from the data and a Span zero line'
  - HoverTool limited to the point renderers with formatted estimate and CI for the
    HTML view
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'VQ-01 (both): legend labels at 28pt and tick labels at 30pt sit below the bokeh
    reference 34pt and read small beside the 36pt axis titles → 34pt (+6pt legend,
    +4pt ticks). Likely cause: p.legend.label_text_font_size=''28pt'', major_label_text_font_size=''30pt''.'
  - 'VQ-03 (both): legend glyphs render as ~15px dots while the plotted markers are
    32px, so the legend does not match the marks it explains → legend glyphs at the
    marker size (+~17px). Likely cause: scatter legend glyph scaling with glyph_width/height=40
    only; set a larger legend glyph size or use a LegendItem with matching marker
    size.'
  - 'Suggestion: a subtle muted band or lighter weight for the non-significant intervals
    could push them further behind the significant ones.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800
      Chrome: bold title 'coefficient-confidence · python · bokeh · anyplot.ai' top-left; y-axis title 'Predictor variable', x-axis title 'Coefficient estimate (standardized)' in italic dark ink; tick labels in soft ink; subtle dashed grid; dashed dark zero line; legend box top-left on elevated cream. All readable.
      Data: ten rows ordered by |coefficient| (Square Footage top, Property Tax Rate bottom); seven significant rows in #009E73 with 7px intervals and 32px points, three non-significant (Bedrooms, Garage Size, Property Tax Rate) in dark grey crossing zero.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title and axis titles in light ink, tick labels in light soft ink, zero line light dashed, legend on #242420 with light text; no dark-on-dark.
      Data: identical #009E73 for the significant rows; non-significant rows flip to light grey (theme-adaptive neutral); positions identical.
      Legibility verdict: PASS
