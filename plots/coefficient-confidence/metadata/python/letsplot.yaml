      Data: 12 point ranges ordered by estimate (Square Footage top, Crime Rate Index bottom); 8 significant in #009E73, 4 non-significant (Has Pool, Number of Bedrooms, Garage Spaces, Has Fireplace) in near-black; dashed near-black zero line through the full height.
