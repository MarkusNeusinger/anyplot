review:
  strengths:
  - geom_pointrange + coord_flip gives one point per estimate with its 95% CI and
    predictors down the vertical axis
  - Full-height dashed zero line in INK, clearly distinct from the INK-15% gridlines
    in both themes
  - Significance computed from the CI and shown in brand green vs theme-adaptive neutral,
    with a self-explanatory legend
  - Theme tokens threaded through every chrome element; both renders read cleanly
  - Rows ordered by coefficient via an ordered Categorical, so axis and legend follow
    the data
  weaknesses:
  - 'DE-02 (both): the panel is boxed on all four sides (thin border along the top
    and right edges) where a coefficient plot needs no enclosure -> keep only the
    left/bottom axis lines or none. Likely cause: theme_minimal() panel border / axis_line
    drawn as a full frame; set panel_border=element_blank().'
  - 'Suggestion: layer_tooltips() showing the CI bounds would make the HTML version
    richer.'
  - 'Suggestion: ordering by absolute magnitude would group the strongest effects
    of either sign at the top.'
  image_description: |-
