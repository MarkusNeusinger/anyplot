  strengths:
  - Interval lines colored per row to match their point's significance, so green and
    gray rows read as one unit in both themes
  - 'Canvas, font sizes and grid color follow the pygal sizing block: 3200x1800, 66/44
    px text, INK_MUTED guides visible on both pages'
  - Rows sorted by estimate with full variable names via pygal's dict y_labels; the
    dashed zero line spans every row
  - Native pygal HTML output keeps per-point tooltips for inspection
  weaknesses:
  - 'VQ-03 (both): legend swatches are ~12 px squares beside 44 px labels, and the
    Zero Reference swatch is a gray square rather than the dashed line it explains
    → swatches that match their marks (a line sample for the zero reference). Likely
    cause: pygal''s default legend box for the stroke-only Zero Reference series.'
  - 'CQ-04 (code): point_colors and series_colors (lines 62–65) build a Style colors
    tuple that every chart.add() then overrides with color= → keep one mechanism and
    delete the other. Likely cause: two coloring approaches kept side by side.'
  - 'Suggestion: drop the unused IMPRINT_PALETTE positions 2–8 and keep only the brand
    green constant.'
