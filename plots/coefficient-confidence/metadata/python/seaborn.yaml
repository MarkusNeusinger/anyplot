review:
  strengths:
  - Points and interval lines share the significance color, and sns.scatterplot's
    hue/palette dict produces a legend whose glyphs match the marks in both themes
  - Variables sorted by coefficient so the largest effect sits at the top, each named
    in full at its own row
  - Significance is derived from whether the interval crosses zero, and the legend
    labels say exactly that
  - Exact 3200x1800 canvas with style-guide font sizes; chrome fully theme-adaptive
  weaknesses:
  - 'DE-02 (both): all four spines are drawn, a closed box around the plot, against
    the style guide''s default L-shaped frame → remove the top and right spines. Likely
    cause: sns.set_theme(style="ticks") without sns.despine() or ax.spines[''top''/''right''].set_visible(False).'
  - 'Suggestion: sns.pointplot with errorbar=None or a native interval drawn by seaborn
    would lean more on seaborn than ax.hlines.'
