review:
  strengths:
  - 'Every chrome element threads the theme tokens: both renders are theme-correct,
    with the dashed INK_SOFT zero line distinct from the gridlines'
  - Significance is computed from whether each interval crosses NULL_VALUE, and non-significant
    rows drop to neutral ink so the significant effects lead
  - Row order and legend order are set through scale_y_discrete(limits=) and scale_color_manual(limits=),
    the idiomatic plotnine way, without mutating the data
  - 'Grid density chosen for the chart: value gridlines a step stronger than the faint
    row guides, minor grid off'
  weaknesses:
  - 'Suggestion: a slightly larger legend title gap to the right canvas edge would
    give the legend more breathing room.'
  - 'Suggestion: a short note under the legend stating the confidence level (for example
    95 % CI) would make the intervals self-explanatory.'
