review:
  strengths:
  - 'Correct horizontal coefficient plot with 95% CI bars, a dashed zero-reference
    line, and semantic color-coding (Imprint brand green #009E73 for significant coefficients,
    theme-adaptive muted gray for non-significant) that exactly matches the spec''s
    stated requirements.'
  - Clever, idiomatic use of Chart.js floating-bar ranges ([ciLower, ciUpper] pairs)
    for the confidence-interval whiskers and capsule-shaped point markers (narrow
    range + borderRadius), combined with a line-type zero-reference dataset in a single
    mixed chart.
  - 'Full theme-adaptive chrome: title/axis/tick colors and the semantic muted anchor
    correctly branch on window.ANYPLOT_THEME, data colors are pixel-identical between
    light and dark renders, and both surfaces use the correct warm off-white / near-black
    backgrounds.'
  - Realistic, neutral housing-regression dataset sorted by |coefficient| descending,
    covering both positive and negative effects and both significant and non-significant
    cases (full DQ-01 feature coverage).
  weaknesses:
  - Title occupies only roughly a third of the canvas width at the current 22px size
    — well under the 50-70% target for a title this length; a slightly larger title
    fontsize would give it more visual weight without any overflow risk.
  - CI bars and the significant/not-significant point markers use flat fills with
    no edge highlight; the style guide recommends a subtle white/ink edge on bar and
    marker elements for definition, especially where the CI band and point marker
    overlap.
  - The significant/not-significant split is implemented as two parallel bar datasets
    with null-masking (significantEstimates / notSignificantEstimates) rather than
    a single dataset with per-point scriptable backgroundColor — functionally correct
    but a more idiomatic Chart.js pattern would use one dataset with a scriptable
    color callback keyed on row.significant.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "coefficient-confidence · javascript · chartjs · anyplot.ai" in dark ink, centered top. Y-axis shows 8 variable-name labels (Square Footage, Distance to City Center (mi), Bathrooms, Age of Home (years), Garage Spaces, Lot Size (acres), Bedrooms, Renovated Kitchen) in dark text, left-aligned. X-axis title "Coefficient Estimate ($1,000s per unit, standardized)" and numeric ticks (-40 to 50) in soft dark gray. Legend at bottom center with 4 entries: "95% Confidence Interval" (light gray swatch), "Zero effect" (dashed line icon), "Significant (95% CI excludes 0)" (green swatch), "Not significant" (gray swatch). Vertical gridlines subtle, dashed black zero-reference line at x=0. All text is clearly readable against the light background — no light-on-light issues.
      Data: Each row shows a thin gray horizontal bar for the 95% CI, with a small rounded-capsule marker at the point estimate — green (#009E73) for the 6 significant coefficients (Square Footage, Distance to City Center, Bathrooms, Age of Home, Garage Spaces, Lot Size), muted gray for the 2 non-significant ones (Bedrooms, Renovated Kitchen) whose CIs cross zero.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis titles, tick labels, and legend, now rendered in light ink (#F0EFE8) / soft light gray, fully legible against the dark background. Zero-reference line switches to a light dashed line (still dashed white, correctly inverted from black on light). Gridlines remain subtle.
      Data: Confidence-interval bars and significance markers are unchanged in color from the light render — same brand green #009E73 for significant points and the same muted-gray hue class (now #A8A79F per the theme-adaptive MUTED constant) for non-significant points and CI fill. No dark-on-dark or light-on-light failures detected anywhere (title, axis labels, tick labels, legend text, y-axis category labels all clearly legible).
      Legibility verdict: PASS
