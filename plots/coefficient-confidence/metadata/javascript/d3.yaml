review:
  strengths:
  - 'Correct coefficient-plot form: horizontal error bars with point estimates, variables
    on the y-axis, values on the x-axis, exactly as the spec''s ''preferred for long
    variable names'' guidance requests'
  - Variables ordered by |coefficient| descending, matching the spec's 'typically
    ordered by coefficient magnitude' note
  - Dashed vertical zero-reference line correctly signals the null-hypothesis threshold
  - Significant vs. non-significant coefficients are cleanly distinguished with brand
    green (#009E73) vs. the theme-adaptive `muted` semantic anchor — a textbook use
    of the semantic-exception rule (status encoding), not an arbitrary color choice
  - 'Both renders verified theme-correct: `#FAF8F1`/`#1A1A17` backgrounds, all chrome
    (title, ticks, axis label, legend) uses theme-adaptive ink tokens, and the data
    colors are pixel-identical between light and dark'
  - 'Idiomatic D3: proper `.data(data).join(...)` pattern, `scaleBand`/`scaleLinear`,
    `d3.axisBottom`/`d3.axisLeft`, `d3.format(''+.2f'')` for signed tick labels'
  - Axis label states the effect measure with notation and units ('Standardized Coefficient
    (β) with 95% Confidence Interval')
  - Title format and legend labels are exactly correct; legend text spells out the
    statistical meaning ('95% CI excludes 0') rather than a bare 'Yes/No'
  - 'Realistic, factually coherent housing-regression data: signs and relative magnitudes
    (crime rate and age negative, square footage/bathrooms/garage positive) all match
    real-world expectations'
  - Clean, deterministic, KISS-structured code with no functions/classes and no fake
    interactivity
  weaknesses:
  - Design Excellence is solid but not yet distinctive — every marker/error-bar is
    styled identically regardless of magnitude or significance; a subtle visual hierarchy
    (e.g. slightly larger markers for the top few |coefficient| rows, or a faint shaded
    band around the zero line marking the 'practically negligible' zone) would push
    this from 'good default' to 'publication-ready'
  - No annotation calls out the effect-size ranking or highlights the single largest
    positive/negative driver — the viewer has to scan all 12 rows to find the story
    instead of being guided to it
  - Confidence-interval caps are plain, uniform crossbars — a small refinement (rounded
    caps, or a lighter alpha on the whisker vs. the point) would add polish consistent
    with a 'perfect visual refinement' bar
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "coefficient-confidence · javascript · d3 · anyplot.ai" in bold dark ink, centered top. X-axis tick labels (+0.60 … -0.40) and y-axis variable names (square_footage … has_pool) in dark-grey ink, clearly legible. Axis label "Standardized Coefficient (β) with 95% Confidence Interval" in dark ink below the x-axis. Legend top-right with two circular swatches ("Significant (95% CI excludes 0)" in green, "Not significant" in grey) — fully readable against the light background. Dashed zero-reference line in soft dark grey.
      Data: First 7 rows (square_footage through lot_size_acres) render in brand green #009E73 with green error bars and point markers; the remaining 5 rows (renovated through has_pool) render in muted grey. All markers have a thin light-colored stroke that matches the page background, giving a clean "cut-out" look.
      Legibility verdict: PASS — no light-on-light or hard-to-read text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light off-white ink, centered top. Axis tick labels and y-axis variable names render in light grey, clearly visible against the dark background. Axis label in light ink below the x-axis. Legend renders identically positioned with the same two swatches, text in light grey. Dashed zero-reference line in light grey, subtle but visible.
      Data: Significant rows are the identical #009E73 green as the light render; non-significant rows use the dark-theme muted anchor (light grey), which is appropriately different from the light-theme muted grey since `muted` is theme-adaptive by design — this is expected, not a violation, since only the categorical data colors (green) must stay fixed, not the semantic 'muted' anchor. Marker strokes match the dark page background.
      Legibility verdict: PASS — no dark-on-dark failures; every title, tick label, axis label, and legend entry is clearly legible against the near-black surface.
