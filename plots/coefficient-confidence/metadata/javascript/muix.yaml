review:
  strengths:
  - 'Native MUI X composition: ChartsContainer with ScatterPlot, ChartsGrid, ChartsXAxis/ChartsYAxis
    and a custom ConfidenceWhiskers layer that reads useXScale/useYScale, so every
    interval sits exactly on the axis scale of its point estimate'
  - Built-in ChartsReferenceLine at x=0 runs the full height of the rows, dashed and
    in the ink-soft token, clearly distinct from the fainter dashed grid in both themes
  - 'Significance is computed from whether each interval excludes zero and encoded
    as brand green #009E73 vs the theme-adaptive soft neutral; the legend names both
    classes and agrees with every row'
  - Coefficients sorted by absolute magnitude with the largest effect (Square Footage)
    at the top; all eleven predictor names are shown in full and right-aligned against
    the plot
  - Realistic housing-price regression with standardized betas on both sides of zero,
    mixing significant and non-significant intervals of varied width
  - 'Typography hierarchy beyond the baseline: bold title, a subtitle that states
    11 predictors · 6 significant, and an italic ''No effect (0)'' label on the reference
    line'
  - 'Theme tokens threaded through every chrome element: no text is unreadable in
    either render, and data colors are identical between light and dark'
  - skipAnimation set and the chart sized from window.ANYPLOT_SIZE; native scatter
    tooltips stay available in the HTML output
  weaknesses:
  - 'Suggestion: the x axis carries 28 ticks and gridlines at 0.05 steps; a tickInterval
    or tickNumber of about 0.1 would quiet the grid and the tick row without losing
    precision.'
  - 'Suggestion: the subtitle''s ''(95% CI lower to 95% CI upper)'' strings two column
    names together; ''95% confidence intervals'' reads more naturally.'
  - 'Suggestion: the three whisker <line> elements per row repeat the same stroke
    props; one <path> per interval would shorten ConfidenceWhiskers.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "coefficient-confidence · javascript · muix · anyplot.ai" centered at the top (~34% of the width), soft-ink subtitle "11 predictors · 6 significant (95% CI lower to 95% CI upper)"; eleven predictor names right-aligned on the y axis (Square Footage at the top down to Proximity to Highway); x ticks from −0.60 to 0.75 every 0.05 with the label "Coefficient estimate (standardized β)"; subtle dashed vertical grid; dashed dark zero reference line spanning all rows with an italic "No effect (0)" label; HTML legend below the axis. All readable.
      Data: six significant coefficients (Square Footage, School Rating, Distance to City Center, Crime Rate, Age of Home, Number of Bathrooms) as brand green #009E73 dots with capped horizontal interval lines; five non-significant ones (Renovated, Lot Size, Garage Spaces, Number of Bedrooms, Proximity to Highway) in the dark soft neutral, each crossing the zero line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, predictor names, tick labels, axis label, legend text and the "No effect (0)" label all render in light ink; the zero line flips to a light dashed line; the grid is a faint dark dashed line. No dark-on-dark text.
      Data: the significant series keeps the identical #009E73 green; the non-significant series uses the theme-adaptive light soft neutral (#B8B7B0-like), as a neutral anchor should. Layout identical to light.
      Legibility verdict: PASS
