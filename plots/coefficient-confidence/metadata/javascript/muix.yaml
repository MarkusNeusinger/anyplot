review:
  strengths:
  - Custom ConfidenceWhiskers component built on useXScale/useYScale is a sophisticated,
    correct use of MUI X's low-level hooks to render error bars the library has no
    built-in series type for
  - Correct semantic use of the muted anchor color (not an arbitrary gray) for the
    'not significant' category, matching the style guide's neutral/disabled convention
  - 'Clean minimal chrome: y-axis line/ticks disabled, only labels remain; subtle
    vertical gridlines; no unnecessary borders'
  - Title font-size scaling formula (TITLE_SIZE) keeps long titles proportionate
  weaknesses:
  - CI widths are fairly uniform across all 11 variables (~0.13-0.17) rather than
    varying with standard error/sample characteristics - a small realism nit, not
    a functional issue
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 target.
      Chrome: Title "Housing Price Regression · coefficient-confidence · javascript · muix · anyplot.ai" centered at top in dark ink, comfortably sized, no clipping. X-axis labeled "Coefficient Estimate (Standardized β)" with ticks every 0.05 from -0.65 to 0.75, evenly spaced and unbunched. Y-axis shows 11 variable names, no axis line/ticks (disabled by design). Dashed zero-reference line with italic "No effect (β = 0)" label. Bottom legend with two swatches. All chrome text is dark and clearly readable.
      Data: 11 rows, point + horizontal CI whisker each. 6 significant rows colored brand green #009E73 (first series, correct per palette rule). 5 non-significant rows colored the "muted" semantic anchor gray.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 target.
      Chrome: Same title, axis labels, ticks, legend, and reference-line annotation, all flipped to light-colored text/lines. No dark-on-dark issues found anywhere, including the small italic zero-line label near the bottom axis.
      Data: Colors identical to light render (#009E73 green for significant rows; theme-adaptive muted anchor gray for non-significant rows, which is the expected/documented behavior for that semantic token, not a data-identity violation).
      Legibility verdict: PASS
