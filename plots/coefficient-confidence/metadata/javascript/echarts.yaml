review:
  strengths:
  - 'Statistically sound data: the significant/not-significant flag matches whether
    each confidence interval crosses zero for all 10 rows, and coefficients are ordered
    by absolute magnitude descending as the spec requests.'
  - Idiomatic ECharts custom-series renderItem builds the horizontal whisker (cap-line-cap)
    primitives from api.coord, a genuinely distinctive technique beyond basic scatter/bar
    usage.
  - Significance is encoded through two independent channels (color AND whisker line
    width), not color alone, which helps color-vision-deficient readers.
  - Dashed zero-reference line via markLine communicates the null-hypothesis threshold
    clearly, reinforcing the plot's storytelling purpose.
  - 'Theme-adaptive chrome is correct in both renders: warm off-white / near-black
    backgrounds, all text legible, brand green #009E73 identical between light and
    dark.'
  - Title format and legend labels match spec conventions exactly; axis label states
    the effect measure with units ("Coefficient Estimate (percentage points)").
  weaknesses:
  - Legend swatches only show dots, not the whisker line-width distinction used in
    the plot body, so the color/weight double-encoding isn't previewed in the legend
    itself — minor, doesn't affect the plot area.
  - Design excellence is solid but fairly conventional for a forest/coefficient plot
    (no extra polish like alternating row bands or effect-size annotations) — room
    to push aesthetic sophistication further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Website Conversion Drivers · coefficient-confidence · javascript · echarts · anyplot.ai" centered at top in dark ink, fully legible. Legend below title with two swatches ("Significant" green, "Not significant" gray). Y-axis lists 10 variable names in dark-gray text, x-axis "Coefficient Estimate (percentage points)" label below tick row. Subtle vertical gridlines at -9/-6/-3/0/3/6/9. Dashed vertical reference line at x=0.
      Data: 10 rows, each a filled circle (18px) with a horizontal whisker (cap-line-cap) showing the confidence interval. First categorical series (significant) is the brand green #009E73 with a thicker whisker; non-significant rows are dark gray with a thinner whisker. Rows ordered by |coefficient| descending, matching the spec.
      Legibility verdict: PASS — all title/legend/axis/tick text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend, now rendered in white/light-gray text, fully legible. Gridlines and dashed zero-reference line switch to light tones appropriate for the dark surface. Axis labels and tick labels are light gray, clearly visible.
      Data: Significant-row color is identical #009E73 green to the light render (confirmed). Non-significant rows switch from dark gray to a light gray tone (ink-soft chrome token, not a palette color) so they remain visible against the dark background — this is expected theme-adaptive chrome, not a data-color violation, since the only data-palette color in use is palette[0] (green).
      Legibility verdict: PASS — no dark-on-dark failures; all text and markers are clearly distinguishable from the near-black background.
