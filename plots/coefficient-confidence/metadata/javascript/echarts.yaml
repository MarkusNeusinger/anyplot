review:
  strengths:
  - 'Correct plot type: horizontal coefficient plot with categorical y-axis, ordered
    by absolute coefficient magnitude descending, exactly as the spec recommends for
    long variable names'
  - Dashed reference line at x=0 clearly marks the null-hypothesis threshold
  - 'First categorical series correctly uses Imprint brand green #009E73, and title/legend/axis-label
    format all match spec requirements with explicit units ("Coefficient Estimate
    (percentage points)")'
  - Data is a realistic, neutral business scenario (e-commerce conversion drivers)
    with a good mix of positive/negative coefficients and varying CI widths, including
    a near-zero-crossing example (Popup Ads)
  - Idiomatic use of ECharts' custom series `renderItem` to hand-draw whisker caps
    — a technique genuinely distinctive to ECharts
  weaknesses:
  - 'Critical rendering bug: the code reads `t.muted` (lines 102, 126) for the "Not
    significant" whisker stroke and marker fill, but `window.ANYPLOT_TOKENS` (see
    automation/js-render/render.mjs themeTokens()) only defines pageBg, elevatedBg,
    ink, inkSoft, grid, palette, amber, seq, div — there is no `muted` key. `t.muted`
    is `undefined`, so `stroke: undefined` in whiskerRenderItem makes the confidence-interval
    whisker lines for every non-significant coefficient invisible. Visible in both
    plot-light.png and plot-dark.png: rows "Popup Ads" through "Loyalty Points Program"
    (6 of 10 coefficients) show only a dot, with no error-bar caps or line at all,
    even though the underlying data has ciLower/ciUpper values for all of them. This
    breaks the plot''s core purpose (a coefficient plot exists specifically to show
    whether the CI crosses zero) for the majority of the data. Fix: replace `t.muted`
    with a real token, e.g. `t.inkSoft`, or hardcode the style-guide''s theme-adaptive
    muted anchor (`#6B6A63` light / `#A8A79F` dark) branching on `window.ANYPLOT_THEME`.'
  - As a direct consequence, the "Not significant" marker color is not driven by an
    intentional theme-adaptive token either — it currently renders via ECharts' silent
    default-palette fallback (since itemStyle.color is also `undefined`), which is
    not part of the documented Imprint palette or its semantic anchors and does not
    shift between light/dark the way a real theme token would.
  - With the whiskers gone for 6/10 rows, color hue becomes the only signal distinguishing
    significant from non-significant coefficients — a fragile, non-redundant encoding
    once the intended whisker-presence/absence hierarchy collapses.
  - 'Design Excellence and Data Storytelling are held back by the same bug: the plot''s
    intended story ("insignificant coefficients have CIs that cross zero") is unverifiable
    for most rows since no CI is drawn for them at all.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Website Conversion Drivers · coefficient-confidence · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Legend ("Significant" / "Not significant") centered below the title with green and slate-gray swatches. X-axis labeled "Coefficient Estimate (percentage points)" with tick labels -9..9; y-axis shows 10 variable names, all legible dark-gray text against the light background. Vertical gridlines are faint. A dashed vertical reference line marks x=0.
      Data: Top 4 rows ("Mobile Optimization Score", "Checkout Steps", "Free Shipping Offer", "Page Load Speed") are green (#009E73) dots each with a clearly visible horizontal whisker (line + end caps) showing the confidence interval. The remaining 6 rows ("Popup Ads" through "Loyalty Points Program") show only a slate/purple-gray dot each — NO whisker line or end caps are visible at all, even though these rows have their own ci_lower/ci_upper values in the source data. This is a rendering defect (see weaknesses), not a design choice.
      Legibility verdict: PASS (all text is readable), but the plot has a data-completeness defect — CI whiskers are entirely missing for 6 of 10 coefficients.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis structure as the light render, now rendered in light ink/text (#F0EFE8-ish) against the dark background — clearly readable, no dark-on-dark issues. Gridlines are faint light lines.
      Data: The green (#009E73) marker color and its whiskers are identical to the light render for the 4 significant rows, as required. The "Not significant" dot color again looks like the same slate/purple-gray as in the light render (i.e. it does NOT visibly shift the way a true theme-adaptive "muted" token should), and the same 6 rows are again missing any whisker line entirely.
      Legibility verdict: PASS (all text and the green series are readable and theme-correct), but the same whisker-visibility defect as the light render is present, and the non-significant marker color is not actually a theme token (see weaknesses — `t.muted` does not exist in ANYPLOT_TOKENS).
