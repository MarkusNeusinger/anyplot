review:
  strengths:
  - 'Correct forest/coefficient plot structure: rangebars! for horizontal CIs, scatter!
    for point estimates, dashed zero-reference line'
  - Coefficients ordered by |magnitude| descending, exactly per spec guidance
  - 'Clear semantic color-coding (Imprint brand green #009E73 = significant, muted
    gray = not significant) with a matching custom MarkerElement legend'
  - Inline value labels anchored outward from each CI (away from the zero line) so
    they never collide with the dashed reference line or the bars
  - 'Theme-adaptive chrome correct in both renders: FAF8F1/1A1A17 backgrounds, all
    chrome text legible, data colors identical across themes'
  - Idiomatic Makie usage — rangebars! is the right primitive for precomputed interval
    bounds, plus a hand-built MarkerElement legend and vlines! for the reference line
  weaknesses:
  - Y-axis tick label for the top row renders as 'Square Footage' instead of the full
    'Square Footage (per 100 sq ft)' defined in the `variables` array — confirmed
    by pixel-cropping both plot-light.png and plot-dark.png; there is ample unused
    margin left of the label, so the suffix is not being clipped at the canvas edge
    (not AR-09), it is simply not drawn. This leaves the real-world scale of the largest,
    most prominent coefficient (45.2) ambiguous to a reader. Investigate CairoMakie's
    y-tick-label protrusion sizing for this specific (longest) label string — try
    a shorter unit phrasing (e.g. 'Square Footage (/100 sq ft)') or explicitly size
    the left protrusion/yticklabelspace so the full string renders in both themes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold centered title "coefficient-confidence · julia · makie · anyplot.ai" fully visible near the top with clear margin. X-axis title "Coefficient Estimate (Δ Sale Price, $ thousands)" and tick labels (-20, 0, 20, 40, 60) are dark and legible. Y-axis category labels (variable names) are dark gray and legible against the light background, EXCEPT the top-row label which reads only "Square Footage" instead of the full "Square Footage (per 100 sq ft)" — confirmed by pixel crop, the unit suffix is silently dropped even though there is unused margin to its left (not edge clipping). A dashed vertical reference line marks zero. Legend ("Significant (95% CI excludes zero)" / "Not significant") sits bottom-right near the plot, on a slightly elevated off-white panel, not floating in empty space.
      Data: Horizontal range bars show each coefficient's 95% CI, with a point marker at the estimate. Significant coefficients (CI excludes zero) are brand green (#009E73); non-significant ones are muted gray. Compact "+NN.N"/"-NN.N" value labels sit just outside each CI, colored to match significance.
      Legibility verdict: PASS (all chrome text is legible; the one issue above is a content-completeness bug on a single tick label, not a contrast/legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis title, and tick labels all render in light ink tones (near-white/light-gray) and are clearly readable against the dark background — no dark-on-dark failures observed. The same "Square Footage" truncation (missing "(per 100 sq ft)") reproduces identically here, confirmed by pixel crop.
      Data: Data colors are identical to the light render — brand green for significant, muted gray for non-significant, dashed zero line, value labels in matching colors. No hue shift between themes.
      Legibility verdict: PASS (all chrome text legible in dark mode; same single-label completeness bug as light mode, not a legibility/contrast issue).
