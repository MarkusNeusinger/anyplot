review:
  strengths:
  - 'All spec-required features present: zero reference line, variables ordered by
    |coefficient| magnitude, significant vs. non-significant coloring, horizontal
    layout, and an axis label naming the effect measure with units'
  - Correct theme-adaptive Imprint palette usage, including a proper semantic use
    of the 'muted' anchor (not an arbitrary gray) for non-significant coefficients
  - 'Idiomatic Makie API: errorbars!(direction=:x) for horizontal CIs, vlines! for
    the zero threshold, and a custom axislegend built from MarkerElement handles'
  - 'Nice refinement: marker strokecolor set to PAGE_BG creates a clean halo effect
    where markers cross the CI whiskers'
  - Clean KISS structure, reproducible via Random.seed!(42), correct plot-$(THEME).png
    output at px_per_unit=2
  weaknesses:
  - 'DQ-03: ''Square Footage'' coefficient of 45.2 implies a $45,200 sale-price change
    per 1-unit (1 sq ft) increase, which is unrealistic for a hedonic housing model
    (real per-sqft coefficients are typically $50-200, not $45k) - rescale the predictor
    (e.g. ''per 100 sq ft'') or reduce the coefficient magnitude so it aligns with
    the other, plausible coefficients'
  - 'VQ-01/DE-01: title occupies only ~30% of plot width at titlesize=20, well below
    the ~50-70% guideline for a short mandated title - bump titlesize to ~22-24 for
    stronger visual presence'
  - 'DE-03: ordering + color coding gives some hierarchy, but there are no compact
    value/CI annotations near each point, so the reader still has to read the axis
    to get exact magnitudes - consider small text labels for the point estimates'
  - 'LM-02: relies on errorbars!/axislegend, which are solid but not deeply distinctive
    to Makie - could better showcase library mastery with a more Makie-specific technique'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "coefficient-confidence · julia · makie · anyplot.ai" centered at top, fully readable; x-axis label "Coefficient Estimate (Δ Sale Price, $ thousands)" in dark ink below the axis; y-axis tick labels are the nine variable names in a softer dark gray, all legible; thin vertical gridlines at 15% opacity; dashed vertical reference line at x=0; legend box in bottom-right with soft cream fill and two labeled entries.
      Data: Nine horizontal error-bar + point rows, ordered by |coefficient| (Square Footage at top, Age at bottom). Five rows (Square Footage, Bathrooms, School Rating, Distance to Downtown, Garage Spaces) are brand green (#009E73) circles with matching error bars - these are the "significant" coefficients whose CI excludes zero. Four rows (Renovated, Lot Size, Bedrooms, Age) are muted warm-gray circles/bars - CIs cross zero. Markers have a thin cream stroke that reads as a halo against the whiskers.
      Legibility verdict: PASS - all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title, axis label, and y-axis variable names all render in light off-white / soft light-gray tones, fully legible against the dark surface; gridlines and reference line flip to light, low-opacity strokes; legend box flips to a dark elevated fill with light text.
      Data: Same nine rows, in the same order, with the identical brand green (#009E73) for the five significant coefficients and the same muted tone (now the dark-theme muted value) for the four non-significant ones - data colors are unchanged from the light render, only chrome flipped.
      Legibility verdict: PASS - no dark-on-dark failures; every title, axis label, tick label, and legend entry is clearly readable against the near-black background.
