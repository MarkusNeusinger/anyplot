review:
  strengths:
  - Composes the dial from MUI X's GaugeContainer and the useGaugeState hook, so the
    zone arcs, needle and value label are positioned from the container's own cx/cy/innerRadius/outerRadius
    in both renders
  - Color zones change exactly at the threshold values 30 and 70, in matte red / amber
    / brand green, the traffic-light convention the Notes ask for, with the scale
    labelled at 0, 30, 70 and 100
  - The needle points at 72 (about 53° right of vertical on the 240° sweep) and the
    large centered value 72 agrees with it; the value takes the color of the zone
    it falls in
  - Thresholds and range are read from the data record, not typed into the plot code;
    all chrome uses ANYPLOT_TOKENS (ink, inkSoft, pageBg), and both themes read cleanly
  - skipAnimation is set and the component sizes itself from window.ANYPLOT_SIZE,
    as the harness contract requires
  weaknesses:
  - 'VQ-05 (both): the secondary label ''out of 100'' is drawn at about 0.13 × outerRadius
    (≈45 CSS px), roughly 2.5× the 18 px title and nearly half the height of the 72
    it qualifies, so a short helper label dominates the lower dial → about 20–24 CSS
    px (about −20 px). Likely cause: fontSize: outerRadius * 0.13 on the ''out of
    N'' text in NeedleAndLabel.'
  - 'CQ-04 (code): NeedleAndLabel recomputes the needle angle from START_RAD, TOTAL_RAD
    and the value fraction (lines ~118–121) although useGaugeState already returns
    valueAngle for the same value and scale → read valueAngle from useGaugeState()
    and drop the manual fraction/angle arithmetic. Likely cause: angle math copied
    from ZoneArcs instead of the hook''s computed value.'
  - 'Suggestion: start the needle polygon at the hub (base at the center) so the pointer
    reads as one piece; it currently floats about 0.35 × innerRadius away from the
    hub circle.'
  - 'Suggestion: tick labels at 16 CSS px are small next to the dial; 18–20 px would
    hold up better in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400×2400 square canvas.
      Chrome: centered bold title "Customer Satisfaction Score · gauge-basic · javascript · muix · anyplot.ai" in dark ink, about 53 % of the width; scale labels 0, 30, 70, 100 in soft dark ink outside the arc at the ends and thresholds; a zone legend below the dial (Needs Work (0–30), Developing (30–70), Excellent (70–100)) with rounded swatches. All text readable.
      Data: a 240° dial (−120° to +120°) split into three bands with thin gaps at the thresholds: matte red #AE3030 for 0–30, amber #DDCC77 for 30–70, brand green #009E73 for 70–100. A dark ink tapered needle points at 72, just inside the green band; a separate dark hub circle sits at the center. Below the hub a very large bold "72" in brand green and a large soft-ink "out of 100".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, scale labels and legend text in light soft ink, all clearly readable; no dark-on-dark text. Needle and hub flip to light ink and stand out against the dark page.
      Data: zone colors (red, amber, green) and the green "72" are identical to the light render; only the chrome, the needle and the hub flip.
      Legibility verdict: PASS
