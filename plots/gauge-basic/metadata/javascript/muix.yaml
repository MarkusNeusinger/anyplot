review:
  strengths:
  - Composes the gauge with MUI X's GaugeContainer and reads cx, cy, radii, value
    and valueAngle from useGaugeState, so the needle angle comes from the library's
    own value-to-angle mapping rather than a re-derived formula
  - 'Zones change exactly at 30 and 70 and follow the traffic-light convention with
    the Imprint semantic anchors: matte red #AE3030 (poor), amber #DDCC77 (fair),
    brand green #009E73 (good)'
  - The current value 72 is the dominant element, centered under the hub in the color
    of the zone it falls in, with a quiet 'out of 100' subline in the inkSoft token
  - 'Chrome is fully theme-adaptive: title in ink, tick labels and legend in inkSoft,
    needle and hub in ink, so both renders read cleanly while the data colors stay
    identical'
  - Thresholds, limits and value come from the data record, and the zone legend states
    each range, so the gauge rebuilds from any record without edits; skipAnimation
    is set
  weaknesses:
  - 'VQ-05 (both): the dial-plus-legend block fills only the middle ~67 % of the square
    canvas height, leaving empty bands of ~16 % above the title and ~17 % below the
    legend → let the gauge take most of the free height (about 0.75–0.8 of it instead
    of 0.62). Likely cause: GaugeContainer height = height * 0.62 inside a justifyContent:
    center column.'
  - 'CQ-04 (code): the file carries two header blocks (lines 1–4 and 6–9), the second
    a stale copy naming muix 7.29.1 and a different date, split by the //# anyplot-orientation
    directive on line 5 → move the directive to line 1 and keep one header block.
    Likely cause: the orientation directive was not on the very first line, so the
    header rewrite added a new block above it instead of replacing the old one.'
  - 'Suggestion: the needle starts at 0.35 × innerRadius and floats free of the hub
    circle; joining it to the hub would read more like a single pointer.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400×2400 canvas.
      Chrome: bold dark-ink title "Customer Satisfaction Score · gauge-basic · javascript · muix · anyplot.ai" at ~54 % width; scale labels 0, 30, 70, 100 in inkSoft gray at the arc ends and zone boundaries; legend row "Needs Work (0–30)", "Developing (30–70)", "Excellent (70–100)" with rounded swatches; "out of 100" subline in gray. All readable.
      Data: 240° dial split into three thick annular zones with small gaps at the thresholds — matte red (0–30), amber #DDCC77 (30–70), brand green #009E73 (70–100). A dark-ink tapered needle points just past the 70 boundary into the green zone (72). Dark hub circle at the center; large bold green "72" directly beneath it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, tick labels, legend text and "out of 100" in light gray inkSoft; needle and hub flip to light ink and stand out clearly. No dark-on-dark text.
      Data: zone colors (red, amber, green) and the green "72" are identical to the light render; only chrome and needle/hub flip.
      Legibility verdict: PASS
