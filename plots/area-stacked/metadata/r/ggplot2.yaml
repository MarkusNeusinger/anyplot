review:
  strengths:
  - Baseline correctly starts at zero and series are ordered largest-at-bottom (Industrial
    > Transportation > Residential > Commercial > Agriculture), exactly matching the
    spec's notes
  - Semi-transparent fills (alpha=0.88) with thin PAGE_BG-colored strokes between
    stacked areas give clean edge definition between layers, doubling as the style
    guide's recommended WCAG outline pattern for the lower-contrast lavender/ochre/cyan
    palette members
  - Theme-adaptive chrome (PAGE_BG/INK/INK_SOFT) is threaded through every text and
    grid element consistently; both light and dark renders are fully legible with
    no dark-on-dark or light-on-light failures
  - Legend order is reversed via guide_legend(reverse = TRUE) so it reads top-to-bottom
    in the same order the stack visually appears, an intuitive touch
  - 'Minimal, polished chrome: top/right spines removed (L-shaped axis.line), tick
    marks removed, only a subtle Y-axis grid retained, legend background/key blank
    with no box frame'
  - All font sizes explicitly set (title, axis title, axis text, legend) and well-proportioned
    at full resolution with no overlap or overflow
  - Correct title format and legend labels matching the data categories exactly
  - Data tells a plausible energy-transition story (industrial share declining, transportation/residential
    share rising) via the trend_twh vector, adding realistic variation rather than
    flat series
  weaknesses:
  - 'VQ-07: Palette assignment isn''t canonical order and has no stated semantic justification
    — position 3 (#4467A3 blue) is used for the 2nd series (Transportation) instead
    of position 2 (#C475FD lavender), and position 5 (#AE3030 red) is skipped in favor
    of position 6 (#2ABCCD cyan) for the 5th series (Agriculture). Either apply canonical
    order 1→5 (green, lavender, blue, ochre, red) across Industrial→Transportation→Residential→Commercial→Agriculture,
    or add a code comment explaining the semantic reassignment if intentional.'
  - 'CQ-03: `library(tidyr)` is imported but never used anywhere in the script (no
    pivot_longer/pivot_wider/gather/spread calls) — remove the unused import.'
  - 'DE-03: Beyond the spec-mandated largest-at-bottom ordering, there is no additional
    visual emphasis or focal point (e.g., a callout on the industrial-to-transportation
    share shift) to give the chart a stronger story — consider a subtle annotation
    or color/weight emphasis on the most interesting trend.'
  - 'VQ-06 (minor, not penalized this round): the y-axis title ''Energy Consumption''
    doesn''t include units itself — units only appear via the tick-label suffix ''
    TWh''. Consider ''Energy Consumption (TWh)'' for extra clarity if touching this
    area during repair.'
