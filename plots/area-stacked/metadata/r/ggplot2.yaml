review:
  strengths:
  - 'Correct chart type: geom_area with position_stack(reverse=TRUE) and a zero baseline,
    matching the spec''s stacked-area requirement'
  - Canonical Imprint palette order 1-5, with the brand green (#009E73) correctly
    assigned to the largest sector (Industrial)
  - 'Thoughtful data storytelling touch: legend order is reversed to visually mirror
    the top-to-bottom stacking order in the chart'
  - Theme-adaptive chrome correctly threaded through both renders - no dark-on-dark
    or light-on-light legibility failures
  - 'Clean, minimal chrome: no panel border, only a subtle major-y gridline, spines
    removed via theme_minimal'
  - Canvas dimensions correct (3200x1800 landscape), no clipped text or elements at
    any edge
  - Reproducible (set.seed(42)), clean imports, idiomatic ggplot2 (scale_fill_manual,
    guide_legend, scales::label_number)
  weaknesses:
  - The alpha differentiation on Transportation (0.97 vs 0.82 for the other four sectors)
    intended to create a subtle focal point is nearly imperceptible in the final render
    - the visual hierarchy goal from the code comment doesn't come through; either
    drop it or use a more visible technique (e.g. a slightly bolder stroke or direct
    label) if emphasis on Transportation's growth trend is meant to be readable.
  - Because the area alpha is below 1.0, the horizontal reference gridlines (200/400/600
    TWh) faintly show through the fills as thin lines cutting across the color bands
    in both themes - a minor textured artifact; verify this is the intended look or
    bump area alpha closer to 1.0 for fully flat fills.
  - DE-01/DE-03 polish is solid but incremental over the baseline theme_minimal look
    - no additional refinement (e.g., direct end-of-line value labels, a callout for
    the Transportation growth trend) was added to push the storytelling further.
