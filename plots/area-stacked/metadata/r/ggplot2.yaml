review:
  strengths:
  - 'Correct Imprint palette usage: Industrial (largest, bottom of stack) is #009E73,
    remaining sectors follow canonical positions 2-5 in order, identical across both
    themes'
  - Series stacked largest-to-smallest bottom-to-top per the spec's notes, and guide_legend(reverse
    = TRUE) flips the legend to match the visual stacking order top-to-bottom — a
    thoughtful, non-default touch
  - geom_area(color = PAGE_BG) draws a background-matched separator stroke between
    bands instead of a harsh black outline, keeping the stack readable without adding
    visual noise
  - Baseline starts at zero (scale_y_continuous with expansion(mult = c(0, 0.05))),
    x-axis has zero expansion so the stack fills the plot area edge-to-edge without
    clipping
  - 'Both renders theme-correct: warm off-white / near-black backgrounds, all text
    readable, canvas is exactly 3200x1800'
  - Clean KISS structure, reproducible via set.seed(42), only imported packages are
    used, ggsave uses the ragg device as required
  weaknesses:
  - The Transportation series is given a bolder separator stroke (linewidth = 1.0
    vs 0.3 for the others) intended to create a focal point for its growth trend,
    but at rendered scale this is nearly imperceptible next to the other band boundaries
    — the intended storytelling emphasis doesn't land visually
  - panel.grid.major.y uses the full INK color (not a reduced-opacity/soft token)
    at linewidth = 0.15 — mostly moot since the filled areas hide the grid, but the
    small headroom sliver above the stack renders a slightly harder line than the
    style guide's 'subtle, 15% opacity' grid guidance implies
  - Design polish is solid but conventional for an area chart (no annotation, callout,
    or stronger color/size emphasis beyond the ordinal stacking) — leaves room for
    a clearer 'insight-first' read for a 95+ execution
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "area-stacked · r · ggplot2 · anyplot.ai" in dark ink, top-left, fully visible and not clipped. Axis titles "Year" (x) and "Energy Consumption (TWh)" (y) in dark ink. Tick labels (years 2010-2024 by 2, TWh values 0-600 by 200) in a softer gray-ink tone. Legend titled "Sector" on the right with 5 color swatches (Agriculture, Commercial, Residential, Transportation, Industrial, top to bottom) and clearly readable dark labels. All chrome elements are clearly legible against the light background.
      Data: Five stacked bands from bottom to top: Industrial (#009E73 green, largest), Transportation (#C475FD lavender), Residential (#4467A3 blue), Commercial (#BD8233 ochre), Agriculture (#AE3030 matte red, smallest) — matches Imprint canonical palette order 1-5, first series correctly #009E73. Thin background-colored separator strokes divide the bands. Baseline sits at y=0 with no gap.
      Legibility verdict: PASS — no light-on-light text, no overlap, no clipped elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/off-white and soft light-gray tones respectively, fully readable against the dark background. Legend swatches and text also flipped to light text, still clearly legible. Layout, position, and proportions identical to the light render — only chrome flipped.
      Data: Same five bands in the same order with identical hex colors as the light render (#009E73, #C475FD, #4467A3, #BD8233, #AE3030) — confirmed unchanged between themes; only the separator-stroke color (which matches page background) differs between renders, which is expected and correct.
      Legibility verdict: PASS — no dark-on-dark failures; every title/axis label/tick/legend entry is clearly visible against the near-black background.
