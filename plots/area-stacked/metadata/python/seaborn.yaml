review:
  strengths:
  - 'Repair directly addressed all Attempt 1 feedback: sns.lineplot now traces the
    cumulative total (a genuine seaborn call, not raw ax.plot), the legend is borderless
    via sns.move_legend, and a growth-callout annotation gives the chart an explicit
    focal insight'
  - Series order matches the spec requirement exactly — largest (Industrial) at bottom
    rising to smallest (Agriculture) at top
  - First series correctly uses Imprint brand green (#009E73), remaining series follow
    canonical Imprint order, identical across both themes
  - Per-sector seasonal shapes are now differentiated (flat baseload sine for Industrial
    vs. a cubed wave for weather-driven Residential) rather than uniform amplitude
    across all five sectors
  - Theme-adaptive chrome via sns.set_theme(rc=...) with no dark-on-dark or light-on-light
    failures; background-colored edges cleanly separate stacked bands in both themes
  - Baseline pinned to zero, x-margins removed, canvas exactly 3200×1800 with no clipped
    text at any edge
  weaknesses:
  - The growth-callout annotation arrow sweeps in a long, smooth arc from near the
    start of the x-axis to the final data point, tracing a shape that does not follow
    the actual (much choppier) total line — a viewer could mistake the smooth arc
    for a second, contradictory trend line rather than a decorative pointer. Consider
    a shorter, more localized arrow anchored closer to its text.
  - The core stacking geometry still relies on matplotlib's ax.stackplot() rather
    than a seaborn-native call, since seaborn has no built-in stacked-area API — the
    repair added genuine seaborn touches (lineplot, move_legend, despine, set_palette)
    around it, but Library Mastery is capped by this structural constraint
  - Fill opacity (alpha=0.92) is only marginally transparent; a slightly lower alpha
    would better honor the spec's 'semi-transparent fills' suggestion, though it is
    not required since bands don't overlap
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "area-stacked · python · seaborn · anyplot.ai" renders in dark ink, centered, well within canvas bounds. "Month" and "Consumption (GWh)" axis labels are dark and legible; rotated (40°) month/year tick labels and horizontal y-axis ticks are dark-gray and fully readable, none clipped at any edge. A borderless legend ("Sector") sits to the right with five color swatches, fully inside the canvas. A dotted dark line traces the cumulative total across the top of the stack, and a smooth gray annotation arrow with "+13% growth over two years" text points from the upper-left area toward the final data point.
      Data: Five stacked bands in canonical Imprint order bottom-to-top: Industrial (#009E73), Residential (#C475FD), Commercial (#4467A3), Transport (#BD8233), Agriculture (#AE3030), separated by thin off-white edge lines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light ink/gray and are clearly legible against the dark background; the legend uses light text with no border. The dotted total-trend line and the growth-annotation arrow both render in light tones and stay visible against the dark red top band. Band-separator edge lines flip to dark, matching the theme.
      Data: Colors are identical to the light render — Industrial #009E73, Residential #C475FD, Commercial #4467A3, Transport #BD8233, Agriculture #AE3030 — only chrome (background, text, grid, legend, edge lines) flips to dark-theme tokens.
      Legibility verdict: PASS — no dark-on-dark failures detected anywhere.
