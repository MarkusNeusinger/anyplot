review:
  strengths:
  - Series order matches the spec requirement exactly — largest (Industrial) at bottom
    rising to smallest (Agriculture) at top, aiding readability.
  - 'First series correctly uses Imprint brand green (#009E73), with the remaining
    four series following the canonical Imprint order (#C475FD, #4467A3, #BD8233,
    #AE3030) — identical across both themes.'
  - Explicit theme-adaptive chrome via sns.set_theme(rc=...) — all text, spines, and
    legend frame use correct light/dark tokens with no dark-on-dark or light-on-light
    failures.
  - Background-colored edges between stacked bands add clean visual separation without
    extra chrome, and the dotted ink total-trend overlay adds a secondary layer of
    insight.
  - Baseline pinned to zero and x-margins removed — accurate, undistorted proportions
    per the spec's 'avoid misleading proportions' note.
  - No canvas clipping — title, legend, and rotated x-tick labels all sit comfortably
    within the 3200×1800 canvas with generous margins.
  weaknesses:
  - 'LM-01/LM-02: The stacking geometry is drawn with pure-matplotlib ax.stackplot();
    seaborn itself is only used for sns.set_theme()/sns.despine() styling, not any
    seaborn-specific plotting API — leverage more seaborn-idiomatic constructs (e.g.,
    a seaborn palette-driven overlay, or sns.lineplot for the total trace) to raise
    Library Mastery.'
  - 'DE-02: Refinement is solid (subtle y-grid, despined, edge-highlighted bands)
    but stops short of exceptional — e.g., the legend frame is a plain bordered box;
    consider a lighter/borderless legend treatment or tighter title-typography alignment.'
  - 'DE-03: The dotted total-line adds hierarchy, but there''s no explicit callout
    of the key insight (e.g., which sector dominates or grew fastest) — a small annotation
    or highlighted band could sharpen the story further.'
  - 'DQ-01: Seasonal amplitude is fairly uniform in shape across the five sectors
    — varying the seasonal pattern per sector a bit more (e.g., a sharper winter peak
    for Residential vs. a flatter Industrial curve) would better showcase composition
    dynamics.'
