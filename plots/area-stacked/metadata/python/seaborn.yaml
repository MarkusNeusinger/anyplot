review:
  strengths:
  - Idiomatic use of the seaborn.objects interface (so.Plot + so.Area + so.Stack)
    for a genuinely seaborn-native stacked area implementation, rather than falling
    back to matplotlib's ax.stackplot
  - Series ordered largest-to-smallest bottom-to-top per the spec notes, with the
    baseline correctly pinned to zero via ax.set_ylim(bottom=0)
  - 'Thoughtful design details: background-colored band edges for crisp separation
    between stacked series, a dotted cumulative-total overlay, and a growth-callout
    annotation that gives the chart a clear focal point'
  - Full theme-adaptive chrome verified across both renders — data colors are pixel-identical
    between light and dark, only chrome (background, ink, grid) flips
  - Custom outside-right legend built with mpatches.Patch to avoid the muddier translucent-swatch
    look of so.Area's own legend proxies, positioned via sns.move_legend so it never
    occludes the fully-filled stacked area
  weaknesses:
  - The dotted cumulative-total line has no legend entry of its own — it's only explained
    indirectly via the growth-callout annotation; an explicit 'Total' label near the
    line (or in the legend) would remove any ambiguity
  - Title fontsize (13pt) sits at the upper end of the style guide's suggested starting
    range (12pt) — still within the acceptable ~70-85% width band for the mandated
    title, but a touch of extra breathing room would be safer margin
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "area-stacked · python · seaborn · anyplot.ai" in dark ink, centered, spans ~77% of plot width (expected for the long mandated title). "Month" and "Consumption (GWh)" axis labels in dark ink. X-axis tick labels (Feb 2024 ... Nov 2025, quarterly) rotated ~40° in soft dark grey. Y-axis tick labels (0-160) in soft dark grey. Legend titled "Sector" with 5 color swatches (Industrial/Residential/Commercial/Transport/Agriculture) sits outside the plot area at right, fully within canvas bounds, no clipping. All chrome elements are clearly readable against the light background.
      Data: 5 stacked area bands from bottom to top — Industrial (#009E73 teal, largest), Residential (violet/purple), Commercial (blue), Transport (amber/brown), Agriculture (red, smallest) — ordered largest-to-smallest per spec. Baseline starts at 0. A dotted ink-colored line traces the cumulative total along the top edge. An annotation "+13% growth over two years" with a short arrow points at the final data point. First series is confirmed #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-light grey, clearly legible against the dark background. Legend swatches and "Sector"/series labels are light-colored text on the dark elevated background, fully visible, no clipping at the right edge (verified via pixel crop).
      Data: Same 5 stacked bands in the identical hex colors as the light render (Industrial #009E73 teal first, then violet, blue, amber, red) — confirmed pixel-identical data colors, only chrome flipped. Dotted total line now renders in light grey/white for contrast against the dark fill. Growth annotation text and arrow are in light ink, clearly readable — no dark-on-dark failures anywhere (title, axis labels, ticks, legend, and annotation all checked).
      Legibility verdict: PASS
