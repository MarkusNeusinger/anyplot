review:
  strengths:
  - 'Correct Imprint palette in canonical order with first series #009E73; chrome
    (background, text, grid, legend) is theme-correct and identical data colors across
    both renders'
  - 'Idiomatic bokeh: purpose-built varea_stack() derives the stacking bounds from
    a ColumnDataSource, and HoverTool''s $name variable resolves per-band tooltips
    without a manual loop'
  - Thoughtful total-revenue dashed trend line + "Total +23% over 2 years" callout
    gives the composition a clear focal point beyond the implicit stacking story
  - All font sizes explicitly set (50pt/42pt/34pt), fully readable at full size in
    both themes, no edge clipping on any element (verified title, axes, legend, tick
    labels at all four canvas edges)
  - Series ordered largest-to-smallest bottom-to-top (Electronics > Clothing > Home
    & Garden > Sports) per spec Notes, baseline starts at zero
  - Clean KISS structure, reproducible via np.random.seed(42), no unused imports,
    no fake interactivity
  weaknesses:
  - Design reads as a well-executed configuration rather than truly distinctive (DE-01)
    — a more custom typographic treatment or fully removed grid would push polish
    further toward publication-ready
  - Only one explicit annotation (the growth callout); a second, subtler emphasis
    (e.g. labeling the fastest-growing category) would strengthen the data-storytelling
    beyond the single total-line overlay
  - LM-02 relies on varea_stack + $name hover, which are useful but not maximally
    distinctive to bokeh — a CustomJS-driven interaction or Span/BoxAnnotation reference
    would showcase more bokeh-unique capability
