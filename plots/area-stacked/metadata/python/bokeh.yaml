    value, legend clearly identifies all four categories
  - Clean KISS script structure with np.random.seed(42) for reproducibility and only
    used imports
  weaknesses:
  - 'Title is ''area-stacked · bokeh · anyplot.ai'' but the mandated format is ''{spec-id}
    · {language} · {library} · anyplot.ai'' — the ''python'' language segment is missing.
    Fix: title = "area-stacked · python · bokeh · anyplot.ai".'
  - Stacking is done manually (cumsum loop + one p.varea() call per series) instead
    of bokeh's purpose-built p.varea_stack(stackers=[...], source=source) helper,
    which exists specifically for this chart type in bokeh 3.9.2 and would also auto-populate
    the $name hover variable per stacked band. Not incorrect, but misses the library's
    idiomatic high-level API for a stacked area chart.
