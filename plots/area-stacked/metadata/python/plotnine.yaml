review:
  strengths:
  - Theme-adaptive chrome is threaded correctly through INK/INK_SOFT tokens — both
    light and dark renders are fully legible with no dark-on-dark or light-on-light
    failures
  - The dashed 'Total' line + label overlay explicitly surfaces the cumulative-traffic
    story the specification calls out, going beyond a bare stacked area
  - 'Correct Imprint palette in canonical order (#009E73, #C475FD, #4467A3, #BD8233),
    identical data colors across both themes'
  - 'Idiomatic plotnine grammar-of-graphics usage: geom_area(outline_type=''upper'')
    gives a distinctive edge highlight, layered with geom_line/geom_text and scale_fill_manual'
  - Baseline correctly starts at zero (expand=(0, 0, 0.08, 0)), avoiding the misleading-proportions
    pitfall the spec warns about
  - Clean, deterministic, reproducible code (np.random.seed(42)), no over-engineering,
    no fake interactivity
  weaknesses:
  - 'Series stacking order is inverted relative to the spec: ''Organic Search'' (the
    largest series) renders at the TOP of the stack and ''Social Media'' (the smallest)
    at the very bottom — the opposite of the spec''s ''Order series by size (largest
    at bottom) for easier reading'' note. The code comment claims position_stack(reverse=True)
    puts Organic Search at the bottom, but the rendered output shows the opposite;
    flip the reverse flag (or drop it) and re-check the resulting fill order against
    source_order to fix this.'
  - Legend keeps a visible box border/frame (legend_background border=INK_SOFT) —
    the style guide's decoration-removal checklist suggests dropping box frames around
    legends for a more polished look.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1, not pure white.
      Chrome: bold dark title "area-stacked · python · plotnine · anyplot.ai" at top; axis titles "Month" (x) and "Monthly Visitors (thousands)" (y) in dark ink; rotated 45° date tick labels (Jan 2023 ... Jan 2025) in soft dark gray; thin subtle horizontal gridlines only; bordered legend box "Traffic Source" at right listing Organic Search / Direct / Referral / Social Media with color swatches.
      Data: four stacked bands from bottom to top — Social Media (ochre #BD8233), Referral (blue #4467A3), Direct (lavender #C475FD), Organic Search (green #009E73) — each with a subtle ink outline on its upper edge; a dashed dark "Total" trend line runs along the top of the stack with a "Total" text label at the right end.
      Legibility verdict: PASS (title, axis titles, tick labels, and legend text are all clearly readable against the light background; no overlap or clipping observed).

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17, not pure black.
      Chrome: title, axis titles, and tick labels flip to light/off-white and soft light-gray tones; gridlines remain subtle; legend box background lightens to the elevated dark tone with a light-gray border; the dashed "Total" line and label render in off-white instead of dark ink.
      Data: identical four-color stack (Social Media ochre, Referral blue, Direct lavender, Organic Search green) — same hex values as the light render, confirming only chrome flipped.
      Legibility verdict: PASS (all text is light-colored against the dark background; no dark-on-dark failures observed; brand green remains clearly visible).
