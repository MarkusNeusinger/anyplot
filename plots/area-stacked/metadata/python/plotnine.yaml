review:
  strengths:
  - Correct Imprint categorical palette applied consistently and identically across
    light/dark themes, with brand green (#009E73) as the first series
  - Theme-adaptive chrome correctly threaded through INK/INK_SOFT tokens — all text
    legible in both themes, no dark-on-dark or light-on-light failures
  - Adds a dashed cumulative 'Total' overlay line with label, going beyond the base
    stacked-area requirement to surface the overall trend the spec calls out
  - Baseline correctly pinned to zero, comma-formatted y-axis tick labels, subtle
    single-axis gridlines, and a refined bordered legend box
  - Realistic, neutral 'website traffic sources over time' dataset that matches one
    of the spec's own example applications directly
  weaknesses:
  - 'Stack order violates the spec''s explicit ''Order series by size (largest at
    bottom) for easier reading'' note (and contradicts the code''s own comment claiming
    the same intent): the largest series (Organic Search) renders at the TOP of the
    stack while the smallest (Social Media) sits at the bottom. This happens because
    plotnine/ggplot2''s default position_stack() reverses the legend order when stacking,
    so listing source_order largest-to-first actually puts the largest band on top.
    Fix: reverse the categorical order passed to pd.Categorical (or add position_stack(reverse=True)
    to geom_area) so Organic Search — the largest series — ends up as the bottom band,
    and re-verify visually after the change.'
  - 'Minor label overlap at the plot origin in both renders: the y-axis ''0'' tick
    label overlaps the rotated ''Jan 2023'' x-axis tick label. Nudge the y-axis zero
    label or add a touch of x-axis expansion / hjust adjustment on the first date
    tick to separate them.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "area-stacked · python · plotnine · anyplot.ai" centered at top, clearly readable. X-axis "Month" label and 45°-rotated monthly date ticks (Jan 2023 ... Jan 2025) are dark and legible. Y-axis "Monthly Visitors (thousands)" label and comma-formatted tick labels (0, 20, 40, 60) are dark and legible. A bordered legend box "Traffic Source" sits to the right of the plot with four color swatches and labels (Organic Search, Direct, Referral, Social Media). One localized overlap: the y-axis "0" tick label overlaps the rotated "Jan 2023" x-axis tick label at the plot origin.
      Data: Four stacked color bands from bottom to top — ochre/brown (Social Media), blue-gray (Referral), lavender/purple (Direct), and brand green (Organic Search) on top — plus a dashed dark "Total" cumulative line traced along the top of the stack with a "Total" text label at the right end. First series color is #009E73 as required.
      Legibility verdict: PASS (all text readable; only the "0"/"Jan 2023" overlap noted above, which does not block reading either label from context)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all render in light/off-white tones, clearly visible against the dark background — no dark-on-dark failures. Legend box uses an elevated dark surface with light border and light text, fully legible. Same origin-corner "0"/"Jan 2023" overlap as in the light render.
      Data: Same four-band color stack (ochre, blue-gray, lavender, brand green) and dashed "Total" line — colors are pixel-identical to the light render, confirming only chrome flipped between themes.
      Legibility verdict: PASS (all text readable in both themes; no dark-on-dark or light-on-light issues found)
