review:
  strengths:
  - 'Imprint palette applied in canonical order with the first series correctly at
    #009E73, and both renders keep the four data colors identical while only chrome
    (background, ink, grid) flips between light and dark.'
  - Baseline at zero and series ordered largest-at-bottom (Organic Search) exactly
    as the spec's 'Notes' section requests, making the stack easy to read.
  - Adds a dashed cumulative 'Total' trend line plus an end-of-series label — goes
    beyond the spec's minimum requirements to make the composition-vs-total story
    explicit, a genuine data-storytelling win.
  - 'Clean theme-adaptive chrome: PAGE_BG/INK/INK_SOFT tokens threaded through plot/panel
    background, title, axis text, and legend correctly for both themes.'
  - Subtle upper-edge outline on the area bands plus a near-invisible y-only grid
    and no spines gives a polished, uncluttered look.
  - Single-script KISS structure, seeded (np.random.seed(42)) for reproducibility,
    correct 8x4.5in / 3200x1800px landscape canvas, and clean imports with nothing
    unused.
  weaknesses:
  - Legend frame renders as a solid black border in BOTH the light and dark renders
    (legend_background=element_rect(fill=ELEVATED_BG, color=None) falls back to matplotlib's
    default black edge instead of a theme-derived color) — the chrome doesn't actually
    adapt between themes here. Set the legend border explicitly from INK_SOFT (or
    make it fully transparent) so it matches the rest of the theme-adaptive elements.
  - The 'Total' geom_text label uses size=7, which in plotnine's geom_text is mm-based
    (~2.845x factor, so ~20pt) — notably larger than the 8pt axis tick text it sits
    next to. It reads fine in the render but is inconsistent with the annotation sizing
    guidance (annotation size should be ~2.5-4mm, not on the same numeric scale as
    element_text). Reduce to ~3-4 for visual consistency.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light-theme spec, not pure white.
      Chrome: Bold dark title "area-stacked · python · plotnine · anyplot.ai" clearly readable at top. Rotated (45deg) dark-gray x-axis tick labels (month/year) are legible. Y-axis title "Monthly Visitors (thousands)" (rotated) and dark axis titles are crisp. A near-invisible horizontal grid (y-only, low alpha) is present but not distracting. Legend box "Traffic Source" with 4 swatches and black text sits at the right, fully readable, though its border renders solid black (see weaknesses).
      Data: Four stacked bands bottom-to-top: Organic Search (#009E73, first series correct), Direct (#C475FD), Referral (#4467A3), Social Media (#BD8233) — canonical Imprint order, largest series (Organic Search) at the bottom per spec. A dashed dark line traces the running total across the top of the stack, with a small "Total" label at the right end. Baseline starts at 0.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark-theme spec, not pure black.
      Chrome: Title, axis titles, and tick labels all render in light ink/off-white and are clearly readable against the dark background — no dark-on-dark failures observed. Grid remains subtle. Legend text is light-colored and readable against the dark elevated legend background, though the legend border is still solid black in this render too — not obviously wrong (readable), but not theme-adaptive either.
      Data: Same four band colors, same stacking order, same dashed "Total" line and label as the light render — confirmed identical data colors, only chrome flipped as required.
      Legibility verdict: PASS
