review:
  strengths:
  - Per-layer alpha hierarchy (0.88→0.70) plus thin edge-stroke boundaries visually
    reinforces the spec's "order series by size, largest at bottom" requirement
  - 'Clear data storytelling: arrow-annotated "+19% total consumption over 3 years"
    callout gives the viewer an immediate, unambiguous focal insight'
  - 'Distinctive matplotlib-only technique: Path-based clip_path + imshow gradient
    overlay to visually "heat up" the fastest-growing band — not easily replicated
    in other libraries'
  - Theme-adaptive chrome (background, title/axis/tick text, grid, spines, borderless
    legend) is correctly implemented and readable in both plot-light.png and plot-dark.png
  - Realistic, neutral data scenario (grid electricity consumption by sector) with
    genuine seasonal cycles per sector, a steady growth trend, zero baseline, and
    correct mandated title format
  weaknesses:
  - 'VQ-07: Per-layer fill alpha (0.70–0.88) composites each Imprint color against
    the page background, so the rendered data color visibly shifts between themes
    — e.g. the Transportation ochre #BD8233 renders as a washed-out light tan on the
    #FAF8F1 light background but a much darker, richer brown on the #1A1A17 dark background
    (a ~65/255-per-channel RGB shift for the worst layer). The style guide requires
    Imprint data colors to be identical across themes, with only chrome flipping.
    Fix: render fills at alpha=1.0 (fully opaque) and express the scale hierarchy
    purely through the edge-stroke/line-weight technique already in place, or pre-compute
    a fixed, theme-independent tint/shade of each palette color in code instead of
    relying on canvas alpha-over-background compositing.'
  - 'CQ-01: Defines a small helper function (`month_add`) for date arithmetic, breaking
    the KISS imports→data→plot→save structure; `pandas.date_range` or `numpy.datetime64`
    arithmetic would produce the same month grid without introducing a function.'
  - 'LM-01: Uses manual `ax.fill_between` + `ax.plot` in a loop instead of the library''s
    dedicated high-level `ax.stackplot()` API for this exact chart type; the manual
    approach was chosen specifically to enable the per-layer alpha that in turn causes
    the VQ-07 cross-theme color-parity issue above.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white).
      Chrome: Title "area-stacked · python · matplotlib · anyplot.ai" in dark ink, clearly visible at the top. X-axis label "Month" and y-axis label "Electricity Consumption (GWh)" in dark ink, both readable. Tick labels and legend text (Industrial/Commercial/Residential/Transportation) in a softer dark grey, all legible. Subtle horizontal y-axis gridlines barely visible against the cream background. Left/bottom spines visible in soft grey, top/right spines removed.
      Data: Four stacked bands from bottom to top: Industrial (brand green #009E73, largest, most opaque), Commercial (lavender), Residential (blue), Transportation (ochre, thinnest, most transparent). A "+19% total consumption over 3 years" annotation with an arrow points to the final data point in the top-right. All bands visually distinct with thin edge strokes at each boundary.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black).
      Chrome: Title, axis labels rendered in light off-white ink; tick labels and legend text in a lighter grey — all clearly legible against the dark background. Gridlines subtle but visible in light grey. Spines in soft light grey, top/right removed. No dark-on-dark failures observed.
      Data: Same four-band stack and same layer order (Industrial/Commercial/Residential/Transportation) with the identical "+19%" annotation and arrow, positioned identically to the light render.
      Legibility verdict: PASS for chrome/text — however, the DATA COLORS themselves are NOT fully identical to the light render: because each band is filled with alpha < 1 (0.70–0.88) composited against the very different page backgrounds, the effective on-canvas color of each band (especially Residential and Transportation, the lower-alpha layers) is visibly darker/richer here than the lighter/washed-out version seen in plot-light.png. This is flagged as a VQ-07 weakness — see review_weaknesses.json.
