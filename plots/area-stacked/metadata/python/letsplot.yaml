review:
  strengths:
  - Correct stacked area chart with series ordered largest-at-bottom (Organic Search,
    Direct, Social Media, Referral) as the spec recommends, and baseline anchored
    at zero to avoid misleading proportions
  - 'Distinctive lets-plot feature: layer_tooltips() builds a richer per-band tooltip
    (channel, formatted visits) in the HTML output, going beyond a generic ggplot2-style
    port'
  - 'Effective data storytelling: a dashed vline + annotation marks the paid social
    campaign launch, giving the viewer a clear narrative anchor tied to the visible
    inflection in the Social Media band'
  - Full theme-adaptive chrome (background, ink, ink_soft, rule tokens) correctly
    threaded through plot/panel background, titles, axis text, gridlines, and legend
    for both renders
  - Imprint palette used in canonical order with brand green first; area boundaries
    stroked in the page-background color for clean separation between stacked bands
  - Clean, reproducible, single-pass script (np.random.seed(42)), correct output filenames
    (plot-{theme}.png at scale=4, plot-{theme}.html), and exact mandated title format
  weaknesses:
  - Annotation text ('Paid social campaign launch') renders noticeably smaller than
    the legend/tick-label chrome around it (geom_text size=3.4mm ≈ 9.7pt vs. axis_text
    10pt) — bump slightly (e.g. size=4.0-4.2) so it holds up at mobile widths
  - 'Design excellence is solid but not exceptional: the campaign-launch vline uses
    a plain muted gray dashed line — consider the amber semantic anchor (#DDCC77)
    for the event marker to visually distinguish it from ordinary chrome/grid elements'
  - Only one distinctive lets-plot capability is demonstrated (layer_tooltips); library
    mastery could be strengthened further with another idiomatic lets-plot touch (e.g.
    interactive legend, gggrid composition) without adding clutter
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "area-stacked · python · letsplot · anyplot.ai" top-left, clearly readable. Y-axis title "Website Visits (Thousands)" and x-axis title "Month" in dark ink, both readable. Tick labels (0-200 on y; Jan 2023/Jul 2023/Jan 2024/Aug 2024 on x) in softer dark gray, readable. Subtle horizontal-only gridlines barely visible against the cream background. A dashed muted-gray vertical line marks the campaign-launch month, paired with a small dark annotation "Paid social campaign launch" — legible against the light background. Legend on the right ("Acquisition Channel") with four color swatches and dark text labels, all readable.
      Data: Four stacked bands from bottom to top — brand green "Organic Search" (largest, ~90-108k), lavender "Direct", steel blue "Social Media" (visibly widens after the campaign-launch line), and ochre "Referral" (thinnest band). Bands are separated by thin cream-colored strokes. Baseline sits at 0 on the y-axis.
      Legibility verdict: PASS — no light-on-light or unreadable text found anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light/off-white tones (title bold near-white, axis text light gray) — clearly visible against the dark background. Gridlines are subtle light-on-dark hairlines. The campaign-launch vline is a light dashed line and the "Paid social campaign launch" annotation renders in light text, fully legible against the black background — no dark-on-dark failure. Legend swatches and text on the right are light-colored and readable.
      Data: Same four bands in the same order and same hex values as the light render — brand green, lavender, steel blue, ochre — confirming data colors are held constant across themes; only the chrome (background, text, gridlines, strokes) flipped. Area boundary strokes now render in the dark page-background color, giving clean separation against the light-bordered bands.
      Legibility verdict: PASS — all text remains legible on the near-black surface; no dark-on-dark or unreadable elements observed.
