review:
  strengths:
  - Correct stacked area chart with series ordered largest-at-bottom and a zero-anchored
    baseline, avoiding misleading proportions
  - Annotation font size was bumped to size=4.1 per attempt-1 feedback, now reads
    at parity with surrounding tick/legend chrome in both renders
  - 'Pixel-verified: legend swatches and area-fill colors are byte-identical between
    light and dark renders (#009E73/#C475FD/#4467A3/#BD8233), confirming correct canonical
    Imprint order and full theme-adaptive chrome'
  - 'Distinctive lets-plot touch: layer_tooltips() builds a richer per-band tooltip
    (bolded channel title + formatted visits) in the HTML output, beyond a generic
    ggplot2-style port'
  - 'Effective data storytelling: dashed vline + annotation cleanly marks the paid
    social campaign launch, tied to the visible inflection in the Social Media band,
    with no overlap against gridlines or tick labels'
  - Clean, reproducible, single-pass KISS script (np.random.seed(42), no functions/classes,
    only used imports) with correct plot-{theme}.png/.html output and exact mandated
    title format
  weaknesses:
  - 'Persistent from attempt 1: the campaign-launch vline still renders as a neutral
    gray dashed line, not the amber semantic anchor. Pixel-sampled both renders (region
    x=1795-1812, y=150-300) — dominant stroke color is RGB(126,126,120) in light and
    RGB(137,136,130) in dark, not the expected ~RGB(224,208,131)/(...) blend of #DDCC77
    at alpha=0.9. The code is correct (color=AMBER, AMBER="#DDCC77", used exactly
    once, no override) so this looks like a lets-plot rendering quirk with geom_vline(linetype="dashed",
    color=..., alpha=...) rather than a code defect. For the next repair attempt,
    try isolating the variable: (a) set alpha=1.0 to rule out alpha-compositing on
    a dashed stroke, (b) try linetype="solid" to see if dashing is the trigger, or
    (c) switch to geom_segment with explicit y0/y1 at the campaign_start x-position
    as a workaround if geom_vline continues to ignore the literal color.'
  - Library Mastery still shows only one distinctive lets-plot capability (layer_tooltips);
    attempt-1 feedback asked for a second idiomatic touch and none was added — e.g.
    an interactive legend behavior or another lets-plot-specific configuration would
    strengthen LM-02 without adding clutter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled RGB(250,248,241) — matches #FAF8F1, not pure white.
      Chrome: Bold dark title "area-stacked · python · letsplot · anyplot.ai" top-left; y-axis title "Website Visits (Thousands)" and x-axis title "Month" in dark ink; tick labels (0-200 / Jan 2023...Aug 2024) in a softer dark gray; subtle horizontal-only gridlines (no vertical gridlines). All chrome text is clearly readable against the light background.
      Data: Four stacked bands bottom-to-top: brand-green Organic Search (#009E73, largest, ~90-108k), lavender Direct (#C475FD), steel-blue Social Media (#4467A3, widens sharply after the campaign-launch marker), ochre Referral (#BD8233, thinnest, at top). Bands are stroked in the page-background color for clean separation. A dashed vline plus annotation text ("Paid social campaign launch") marks the inflection point, positioned cleanly between gridlines with no overlap. Legend on the right ("Acquisition Channel") with four color swatches whose pixel values exactly match the area-fill colors.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled RGB(26,26,23) — matches #1A1A17, not pure black.
      Chrome: Title, axis titles, tick labels, legend text, and the vline annotation all render in light/off-white tones (INK / INK_SOFT tokens correctly threaded through); no dark-on-dark failures found anywhere.
      Data: Legend swatches are pixel-identical to the light render (#009E73/#C475FD/#4467A3/#BD8233 confirmed via direct RGB sampling of the legend key rectangles) — only chrome (background, text, gridlines, area-boundary strokes) flips between themes, as required.
      Legibility verdict: PASS

    Note: the campaign-launch dashed vline is intended to use the amber semantic accent (#DDCC77, alpha=0.9) per the code, but pixel-sampling shows it actually renders as a neutral gray in both themes (RGB ~126,126,120 light / ~137,136,130 dark) — visually still legible and unobtrusive, but not the intended amber. See review_weaknesses.json for detail; this does not affect the PASS legibility verdicts above.
