      Data: The four area colors are pixel-identical to the light render (#009E73 / #C475FD / #4467A3 / #BD8233), confirming only chrome (background, text, grid, legend box) flips between themes. Brand green #009E73 reads well on the dark surface.
      Legibility verdict: PASS overall, with the same borderline-contrast caveat on the annotation text as the light render (now measured against the darker blended area fills, ~3.6-3.8:1).

    Both renders pass the theme-readability check (no light-on-light or dark-on-dark failures); the annotation contrast is a minor polish item, not a legibility failure.
