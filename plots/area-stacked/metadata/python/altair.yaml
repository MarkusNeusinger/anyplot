review:
  strengths:
  - Correct Imprint palette in canonical order (Software=#009E73, Hardware=#C475FD,
    Services=#4467A3, Support=#BD8233), identical across both themes
  - Theme-adaptive chrome is fully correct in both renders — warm off-white/near-black
    backgrounds, readable text, no dark-on-dark or light-on-light failures
  - Layered composition (stacked areas + dashed total-revenue trace + decline annotation)
    adds real data storytelling beyond a bare stacked area chart
  - Explicit stack order via Order encoding with series sized largest-at-bottom, matching
    the spec's readability guidance
  - Baseline correctly starts at zero (stack='zero'), avoiding misleading proportions
    per spec
  - Subtle back-to-front opacity gradient (0.80-0.95) gives gentle band separation
    without looking gimmicky
  - 'Clean, idiomatic Altair grammar-of-graphics usage: mark_area + mark_line + mark_point
    + mark_text layered via alt.layer, proper Scale/Axis/Legend configuration'
  - Interactive HTML export includes well-formatted tooltips for all layers, correctly
    not penalized in the static PNG review
  - Canvas correctly padded to exact 3200x1800 target with no clipping at any edge
    (title, ticks, legend, annotation all fully visible)
  weaknesses:
  - Annotation text 'Revenue decline begins' at fontSize=10 is a touch small given
    its prominence as the chart's key callout — could go to 11-12pt for more visual
    weight
  - Example data shows one gentle decline trend but no additional feature variety
    (e.g. a seasonal bump or a category reordering event) that would fully exercise
    DQ-01 feature coverage
  - Design is polished but stops short of full publication-level distinctiveness (DE-01)
    — e.g. the legend swatches and layout are still fairly standard Altair defaults
    beyond the opacity gradient
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "area-stacked · python · altair · anyplot.ai" in bold dark ink, fully visible with generous top margin. X-axis "Month" and Y-axis "Revenue ($ thousands)" labels dark and readable. Rotated (-45°) month tick labels (Jan 2023 ... Nov 2024) are dark gray, legible, no overlap. Legend "Product Category / ordered by size" (two-line title) with 4 swatches (Software/Hardware/Services/Support) all readable in dark text, positioned near the top-right of the plot area, not isolated. Subtle horizontal gridlines only, opacity ~12%.
      Data: Four stacked bands — Software (bottom, green #009E73), Hardware (purple #C475FD), Services (blue #4467A3), Support (top, ochre #BD8233) — with a dark dashed total-revenue line traced along the top of the stack, plus a solid dark point and bold "Revenue decline begins" annotation label near March 2024 where the total starts a sustained decline. Annotation text (black) reads clearly against the ochre band beneath it.
      Legibility verdict: PASS — all text elements readable, no clipping at any canvas edge (verified via top/bottom/left/right crops), no overlap between annotation and other elements.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/off-white and light gray respectively — fully legible against the dark background, no dark-on-dark failures anywhere (title, axis titles, tick labels, legend text, annotation text all confirmed light-colored via pixel crops). Legend swatches and text mirror the light render's layout, fully readable.
      Data: Identical band colors to the light render (#009E73 green bottom band confirmed unchanged, same purple/blue/ochre bands above it) — only the chrome (background, text, dashed total line color which is theme-ink) flips. The decline-annotation point is now a light/cream filled circle (was dark in light mode) consistent with using the theme INK token, and its bold callout text is light-colored and clearly readable against the ochre band.
      Legibility verdict: PASS — no dark-on-dark text found in any of the four edge crops (top/bottom/left/right) or the annotation close-up; brand green remains vivid and distinguishable on the dark surface.
