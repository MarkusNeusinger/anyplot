review:
  strengths:
  - Correct chart type (pygal.StackedLine with fill=True) with all four series stacked
    largest-at-bottom (Industrial > Residential > Commercial > Transportation) as
    the spec's Notes recommend
  - 'Imprint palette used correctly: first series Industrial is #009E73, remaining
    series follow the canonical order, and plot backgrounds are the exact #FAF8F1
    / #1A1A17 theme tokens'
  - Both renders are fully legible — theme tokens (INK, INK_SOFT, INK_MUTED) are threaded
    through title, axis labels, ticks and legend with no dark-on-dark or light-on-light
    failures
  - 'Thoughtful pygal-specific configuration: value_formatter with thousands separator
    and unit suffix, legend_at_bottom, x_labels_major_count=8 to thin 15 year labels,
    show_minor_x_labels=False, opacity=.85 for the semi-transparent fills the spec
    suggests'
  - Clean, reproducible, deterministic KISS script with only used imports and no fake
    interactivity
  weaknesses:
  - 'Y-axis baseline does NOT start at zero, directly violating the spec''s explicit
    Notes requirement (''Ensure baseline starts at zero to avoid misleading proportions'').
    Measuring the rendered PNG: the ''1,300 TWh'' and ''600 TWh'' gridlines sit 826px
    apart (118px per 100 TWh), and the bottom axis line for the rightmost (2024) column
    sits at only ~365 TWh on that scale, not 0 TWh — StackedLine has no `range` kwarg
    set, so pygal auto-scaled the y-axis to the data span instead of anchoring at
    zero. Fix: pass `range=(0, 1400)` (or similar headroom above the max stacked total
    of ~1305 TWh) to `pygal.StackedLine(...)`.'
  - 'Design Excellence is close to library defaults: no explicit visual hierarchy,
    focal point, or annotation calling out the 2020 dip/rebound — DE-01/DE-02/DE-03
    all near baseline.'
  - LM-02 (Distinctive Features) is only lightly used — no interpolation, secondary
    axis, or other pygal-distinctive technique beyond formatter/legend/label tuning.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "area-stacked · pygal · anyplot.ai" in dark ink, centered, ~55-60% of plot width. X-axis title "Year" and rotated y-axis title "Electricity Consumption (TWh)" both dark and readable. Tick labels (years, TWh values) dark and legible. Subtle horizontal dashed gridlines at 100 TWh intervals. Legend at bottom in a 2x2 grid (Industrial, Residential / Commercial, Transportation) with color swatches matching the stack.
      Data: Four stacked areas from bottom to top — Industrial (#009E73 green, largest), Residential (#C475FD purple), Commercial (#4467A3 blue), Transportation (#BD8233 orange) — at ~0.85 opacity, no dots, smooth interpolation between the 15 yearly points (2010-2024). A visible dip across all bands around 2020.
      Legibility verdict: PASS — all text reads clearly against the light background.
      Note: the visible y-axis gridlines only go down to "500 TWh" and the colored stack's bottom edge sits noticeably above where a true zero baseline would be (confirmed by pixel measurement — see Weaknesses), i.e. the chart does not start its baseline at zero as the spec requires.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all rendered in light ink (#F0EFE8-equivalent), clearly visible against the dark background. Gridlines are faint but present. Legend text and swatches equally legible.
      Data: Same four data colors as the light render (#009E73, #C475FD, #4467A3, #BD8233) — confirmed identical, only chrome (background/text/grid) flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures; every label, tick, and legend entry is clearly readable against the near-black surface.
