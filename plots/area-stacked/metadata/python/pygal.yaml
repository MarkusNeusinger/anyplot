review:
  strengths:
  - Imprint palette applied in correct canonical order (green, lavender, blue, ochre)
    which also happens to match the spec's 'largest series at bottom' ordering requirement
    — nice alignment of brand order and data semantics.
  - 'Theme-adaptive chrome is fully correct in both renders: identical data colors
    between light/dark, correct #FAF8F1/#1A1A17 backgrounds, all title/axis/tick/legend
    text legible with no dark-on-dark or light-on-light failures.'
  - 'Realistic, engaging dataset: visible 2020 dip (COVID-19) across all sectors and
    an accelerating Transportation share from 2020-2024 (EV adoption narrative) —
    creates a genuine story without needing annotations.'
  - Baseline correctly pinned to zero (range=(0,1400)) and semi-transparent fills
    (opacity=.85) as the spec's notes recommend.
  - 'Distinctive pygal usage beyond generic defaults: cardinal/hermite interpolation,
    custom value_formatter, legend_at_bottom_columns, truncate_legend.'
  - Clean KISS code structure, deterministic hardcoded data, correct plot-{THEME}.png/.html
    output naming.
  weaknesses:
  - 'Title is missing the required language segment: currently ''area-stacked · pygal
    · anyplot.ai'' but the spec format is ''{spec-id} · {language} · {library} · anyplot.ai''
    — should be ''area-stacked · python · pygal · anyplot.ai''.'
  - Grid lines render as pygal's default dashed style rather than the style guide's
    'solid thin lines (not dashed)' — the Style object doesn't override the guide
    stroke-dasharray, so gridlines look slightly busier than intended. Consider a
    CSS override to force solid, subtle gridlines.
  - Hermite/cardinal interpolation smooths between single annual data points, which
    can visually imply sub-year fluctuation that doesn't exist in the underlying yearly
    measurements — consider linear interpolation (or no interpolation) for this annual-cadence
    dataset, or keep only if the smoothing is an intentional stylistic choice.
  - Title occupies only ~40% of the plot width at the current fontsize (66) — smaller
    than the 70-85% typically expected for this long mandated title string; not an
    overflow issue, but a slightly larger fontsize would strengthen the title's visual
    hierarchy as 'the first thing readers see'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "area-stacked · pygal · anyplot.ai" in dark ink at top, centered; rotated y-axis title "Electricity Consumption (TWh)" on the left; x-axis title "Year" below the tick labels; horizontal y-guides (dashed, light gray) at each 100 TWh increment; bottom legend with 4 color swatches (Industrial, Residential, Commercial, Transportation) in a single row of 4 columns. All text renders in dark ink (#1A1A17-family tones) and is clearly readable against the light background.
      Data: Stacked area chart with 4 bands from a zero baseline: Industrial (green #009E73, bottom, largest), Residential (lavender #C475FD), Commercial (blue #4467A3), Transportation (ochre #BD8233, top). Bands are smoothly interpolated (hermite) across 2010-2024, with a visible dip around 2019-2020 and Transportation's band widening noticeably after 2020. First series is confirmed brand green.
      Legibility verdict: PASS — no overlap, no clipping, all text readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Same title/axis/legend layout as the light render, all text rendered in light ink (#F0EFE8-family tones) — clearly readable against the dark background. No dark-on-dark or light-on-light failures observed. Dashed gridlines still present, same subtle light-gray-on-dark tone.
      Data: Identical 4-band stack and identical hex colors to the light render (green/lavender/blue/ochre) — only the chrome (background, text, gridlines) flipped, exactly as required. Same dip and Transportation growth pattern visible.
      Legibility verdict: PASS — no dark-on-dark issues, all text and data bands clearly distinguishable.
