review:
  strengths:
  - 'Imprint palette is pixel-verified correct: sampled band colors match #009E73/#C475FD/#4467A3/#BD8233/#AE3030
    at alpha 0.88 blended over the exact theme background in both renders, with data
    hues identical across light/dark — only chrome flips.'
  - 'Backgrounds are pixel-exact: (250,248,241)=#FAF8F1 light, (26,26,23)=#1A1A17
    dark — no pure white/black.'
  - Canvas is exactly 3200×1800 (landscape target, verified via PIL) — no drift, no
    repair-gate trigger.
  - No edge clipping in either render (verified by scanning all four borders for non-background
    pixels) — title, legend, and axis labels sit fully within the canvas.
  - 'Idiomatic Makie usage: `band!` is the correct high-level primitive for stacked
    areas (not a manual polygon hack), `Legend(fig[1,2], ax)` auto-derives from series
    labels, and `colsize!(fig.layout, 1, Relative(0.82))` shows deliberate grid-layout
    control.'
  - 'Nice custom touch beyond the library-prompt skeleton: theme-background-colored
    `lines!` strokes between cumulative bands create a ridge/separator effect that
    improves band boundary legibility in both themes and helps CVD accessibility independent
    of hue.'
  - 'Full spec compliance: baseline pinned to zero (`ylims!(ax, 0, ...)`), series
    ordered largest-at-bottom, legend labels match category names exactly, semi-transparent
    fills used.'
  - Realistic, neutral dataset (website traffic sources over 18 months) with genuine
    variety across series — some growing (organic search, social media), one declining
    (referral), one flat (email) — good feature coverage for the plot type.
  - 'Clean code: KISS structure, `Random.seed!(42)` for reproducibility, only used
    imports (CairoMakie, Colors, Random), correct `save("plot-$(THEME).png", fig;
    px_per_unit=2)` API.'
  weaknesses:
  - 'Design Excellence is solid but not yet publication-tier: the axis/spine/grid
    styling closely mirrors the library-prompt''s baseline skeleton rather than adding
    distinctive custom polish (typography is default Makie font, legend keeps a standard
    bordered box). Consider a more minimal legend frame or a subtle depth/shadow treatment
    on the topmost band to lift DE-01/DE-02.'
  - No visual storytelling beyond the inherent stacking hierarchy — there is a genuine
    story here (organic search's share visibly accelerating from ~month 10 onward,
    referral gently declining) that isn't called out. Consider a light-touch annotation
    or a slightly bolder stroke/label on the Organic Search band to draw the eye to
    the acceleration.
  - 'Library Mastery is correct but generic (`band!` + `Legend` is the expected minimum):
    consider a feature more distinctive to Makie specifically, e.g. `text!` for direct
    end-of-line labeling instead of relying solely on the legend, or leveraging Makie''s
    `Mixed`/`GridLayout` more expressively.'
  - Y-axis gridline is very sparse (only one line near the 100 mark reads clearly)
    — a touch more visible (still subtle, within the 15-25% opacity band) would help
    readers estimate intermediate values without adding clutter.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at (250,248,241) = exact #FAF8F1 match, not pure white.
      Chrome: Title "area-stacked · julia · makie · anyplot.ai" in bold dark ink, clearly visible at top-center; axis labels "Month" (x) and "Website Visits (thousands)" (y) in dark ink, both readable; tick labels (month names on x, 0/50/100 on y) in a softer dark gray, all legible; left/bottom spines kept in soft ink, top/right spines removed; legend box (bordered, off-white elevated fill) on the right listing Organic Search, Direct, Referral, Social Media, Email with color swatches matching the bands.
      Data: Five stacked bands from bottom to top — green (Organic Search), lavender (Direct), blue (Referral), ochre (Social Media), red (Email) — separated by thin off-white stroke lines matching the page background, creating a ridge effect between bands. First series confirmed #009E73 (brand green) at the base, baseline pinned to zero.
      Legibility verdict: PASS — no text is light-on-light; all chrome elements read clearly against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at (26,26,23) = exact #1A1A17 match, not pure black.
      Chrome: Title, axis labels, and tick labels all rendered in light ink (confirmed light gray/off-white text throughout), fully legible against the dark background; spines follow the same soft-ink/removed-spine pattern as light; legend box uses the dark elevated fill (#242420-family) with light text and a visible border.
      Data: Same five bands in the same stacking order and identical underlying hues — pixel-sampled band colors confirm the same #009E73/#C475FD/#4467A3/#BD8233/#AE3030 source colors (differences in sampled RGB are fully explained by alpha=0.88 blending against the darker background, not by a color change). Separator strokes between bands now render in the dark background color instead of off-white, preserving the ridge effect on the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures found; every title/label/tick is clearly legible, and brand green remains vivid on the dark surface.
