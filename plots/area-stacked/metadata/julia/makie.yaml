review:
  strengths:
  - 'Imprint palette used in exact canonical order (positions 1-4: brand green, lavender,
    blue, ochre), identical data hues between light and dark renders — only chrome
    flips'
  - Theme-adaptive chrome (INK/INK_SOFT tokens) is threaded through title, axis labels,
    tick labels, spines, and grid; both renders are fully legible with no dark-on-dark
    or light-on-light failures
  - Series correctly ordered largest-to-smallest bottom-to-top per the spec's guidance,
    and ylims!(ax, 0, nothing) forces a true zero baseline so proportions aren't misleading
  - 'Clean visual refinement: L-shaped spine (top/right removed), subtle y-axis-only
    grid at 15% opacity, frameless legend — matches the style guide''s minimalism
    principles'
  - band! fills combined with lines! boundary overlays give crisp, readable seams
    between the four stacked bands
  - Canvas saved at exactly 3200x1800 (landscape gate passes) via the documented resolution=(1600,900)/px_per_unit=2
    pattern
  weaknesses:
  - 'Title hierarchy is modest: titlesize=20 vs body text at 14 is only a ~1.4x ratio,
    so the title doesn''t dominate as ''the first thing readers see'' — since the
    title text is short (41 chars, well under the 67-char benchmark) there''s plenty
    of headroom to bump titlesize to ~24-26 without risking overflow'
  - No data-storytelling focal point beyond the size-ordering convention — nothing
    calls out the accelerating overall growth or the dominant Electronics contribution
    (e.g. a subtle end-of-line annotation or emphasized final-value labels)
  - Boundary line width (linewidth=1.5) is on the thin side for four stacked bands;
    nudging to ~2 would sharpen the seams slightly, especially at mobile scale
  - 'Library-mastery ceiling: relies on the standard band!+lines! combination without
    any Makie-distinctive touch (e.g. text! value callouts, Observables-driven micro-annotation)
    that would elevate it beyond a competent baseline'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "area-stacked · julia · makie · anyplot.ai" centered at top; "Revenue ($ thousands)" y-axis label and "Month" x-axis label in dark ink; y-tick numbers (0/50/100/150) in soft dark gray; rotated x-tick date labels (Jan 2024 ... Oct 2025) in soft dark gray; frameless legend top-left listing Electronics/Home Goods/Apparel/Sporting Goods with color swatches. Subtle horizontal gridlines at ~15% opacity. All text is clearly readable against the light background.
      Data: Four stacked bands from bottom to top — brand green (#009E73, Electronics, largest), lavender (#C475FD, Home Goods), blue (#4467A3, Apparel), ochre (#BD8233, Sporting Goods, smallest) — each with a thin same-color boundary line. Baseline sits at zero; stack trends upward with seasonal wobble from ~105 to ~145 over 24 months.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in light/white text, clearly visible; axis labels in light ink; tick labels in a lighter soft gray; legend text now light-colored and fully readable against the dark surface. Gridlines remain subtle. No dark-on-dark failures — every chrome element flipped correctly.
      Data: Identical four band colors and boundary lines as the light render (green/lavender/blue/ochre) — confirms data hues are constant across themes, only chrome adapted.
      Legibility verdict: PASS
