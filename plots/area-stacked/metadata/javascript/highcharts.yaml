review:
  strengths:
  - Correct, theme-adaptive chrome across both renders — no dark-on-dark or light-on-light
    failures
  - 'Zero baseline maintained (yAxis.min: 0), avoiding misleading proportions as required
    by the spec'
  - Realistic, neutral, well-scaled data (US energy consumption by sector) with a
    natural 2020 dip that adds visual interest
  - 'Clean, minimal, KISS-compliant code with proper animation: false handling for
    the screenshot harness'
  weaknesses:
  - Stacking order is inverted relative to the spec's explicit guidance ("Order series
    by size (largest at bottom) for easier reading") — Agriculture (smallest series,
    ~2.5) sits at the bottom while Industrial (largest series, ~32) sits at the top.
    Reorder the series array so the largest series renders at the bottom of the stack
    and the smallest at the top.
  - Design Excellence is close to library-skeleton defaults — no distinctive Highcharts
    feature (e.g. yAxis.stackLabels, a threshold line, or dataLabels on a key series)
    is used to add polish or reinforce the story beyond the basic stacked-area rendering.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (not pure white, not dark)
      Chrome: Bold dark title centered at top (~55% width, no clipping), medium-gray axis titles ("Year", "Energy Consumption (quadrillion BTU)"), subtle horizontal gridlines, legend at bottom with 5 entries. All clearly readable against the light background.
      Data: Five stacked area bands from bottom to top: dark-red (Agriculture, thin), gold (Commercial), steel-blue (Residential), lavender/purple (Transportation), green #009E73 (Industrial, top). First series (Industrial) correctly uses the brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 (not pure black, not light)
      Chrome: Same title now in light/white text, light-gray axis titles and tick labels, subtle gridlines, legend text in light color. All clearly readable against the dark background; no dark-on-dark issues found.
      Data: Same five band colors as the light render (green, purple, steel-blue, gold, dark-red) — confirmed only chrome flipped, data colors identical.
      Legibility verdict: PASS
