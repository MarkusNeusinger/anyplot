review:
  strengths:
  - 'First series is #009E73 and the remaining four series follow the Imprint palette
    in canonical order; both light and dark renders keep the data colors identical
    and flip only the chrome'
  - Stacking order matches the spec's guidance (largest series, Industrial, at the
    base, smallest, Agriculture, at the top), and the legend order mirrors it
  - yAxis stackLabels showing the yearly total is a nice touch of data storytelling
    — it draws the eye to the 2020 dip without any fake/simulated interactivity
  - 'Realistic, neutral, factually plausible data: total US-style energy consumption
    hovers near ~100 quadrillion BTU/year with a genuine COVID-era dip in 2020, not
    a flat/generic series'
  - Explicit font sizing throughout (title 22px, axis titles 16px, ticks/legend 14px,
    stack labels 12px), baseline at zero, semi-transparent fills (fillOpacity 0.8),
    generous canvas utilization with balanced margins
  weaknesses:
  - Design excellence still reads close to a well-configured default rather than a
    custom, publication-grade composition — no additional visual hierarchy beyond
    the stack-label totals (e.g. muting older years or annotating the 2020 anomaly)
  - The Agriculture band (~2.5-2.8 of ~100 total) is correctly proportioned but visually
    near-invisible at a glance; a direct callout or thicker minimum stroke would help
    readers notice the smallest series exists
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "area-stacked · javascript · highcharts · anyplot.ai" in bold dark ink at top-center (~40% of canvas width, well clear of any overflow). Y-axis title "Energy Consumption (quadrillion BTU)" and x-axis title "Year" in soft dark gray, both legible with units. Tick labels on both axes are dark/soft-dark and readable. Horizontal gridlines are thin and subtle. Legend sits below the plot with five swatches (Industrial, Transportation, Residential, Commercial, Agriculture) in readable dark text. Small gray total labels (e.g. "101", "104", "96", "105") sit above the stack peak at each year.
      Data: Five stacked area bands from bottom to top: green (Industrial, largest), lavender/purple (Transportation), blue (Residential), ochre (Commercial), and a thin red band (Agriculture, smallest) — matching Imprint palette canonical order with #009E73 as the first/base series. Baseline starts at 0, y-axis extends to 120. A clear dip across all bands is visible at 2020.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/off-white bold text, clearly visible. Axis titles and tick labels render in light gray tones, fully legible against the dark background. Gridlines remain subtle but visible. Legend text is light gray/white and readable. The small total labels above each year's peak are pale and readable against the dark background.
      Data: Identical five-color stack (green/lavender/blue/ochre/red) in the same order and same hex values as the light render — only the chrome (background, text, grid) flipped to the dark theme; the data colors did not shift.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, legend, and stack-total text is clearly visible against the near-black surface.
