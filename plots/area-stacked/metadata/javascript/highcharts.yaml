review:
  strengths:
  - 'Correct Imprint palette assignment: canonical positions 1→5 mapped smallest-to-largest,
    so Industrial (largest, bottom of stack) correctly gets brand green #009E73, identical
    between light and dark renders.'
  - Deterministic, realistic, neutral data (US energy consumption by sector, 2015-2024)
    generated in-memory with no randomness, sized within spec range (10 points, 5
    series).
  - 'Genuine data storytelling: the pandemic-era dip is called out via a plotBand
    + label rather than just left implicit, and per-year stack-total labels let the
    viewer read both composition and aggregate trend without extra effort.'
  - Both renders are fully legible with correctly threaded theme tokens (ink/inkSoft/grid)
    — no dark-on-dark or light-on-light failures, no clipped text at any edge (verified
    via corner crops).
  - 'Clean, idiomatic Highcharts config: stacking:''normal'', animation disabled on
    both chart and series, credits disabled, transparent background, no white/black
    background violations.'
  - Title format and legend fully spec-compliant; legend order is reversed to visually
    match the top-to-bottom stack order.
  weaknesses:
  - Agriculture band is only ~2.5-2.8 out of a ~100 total (under 3% share) and is
    visually near-invisible against the Commercial band above it for every year except
    the last, which is the only point carrying a direct callout label — consider a
    callout on the first point too, or a thin outline stroke on the band, so the series
    stays identifiable across the whole timeline, not just at the end.
  - Design Excellence is solid but close to the theme-adaptive-chrome reference template
    (default axis lines, default grid) rather than pushing further into a distinctive
    look — e.g. no spine removal beyond the token-colored line, no varied stroke widths
    between the stack outlines and the pandemic plotBand.
  - Library Mastery features used (stackLabels, plotBands with label, per-point dataLabels)
    are useful but fairly common Highcharts capabilities — no distinctive/less-common
    feature (e.g. series.zones, gradient fills, crosshair) is showcased.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark.
      Chrome: Dark title "area-stacked · javascript · highcharts · anyplot.ai" in bold, centered, clearly readable. "Year" x-axis title and rotated "Energy Consumption (quadrillion BTU)" y-axis title in soft dark gray, both readable. Tick labels (years 2015-2024, values 0-120) in soft gray, all legible. A light-gray shaded plotBand column marks 2020 with a "pandemic-era dip" label above it, readable. Per-year stack-total labels (101, 101, 102, 104, 103, 96, 101, 103, 104, 105) sit just above each stack peak in soft gray, no overlap with data or each other. A direct "Agriculture" callout label sits beside the final data point, checked at full zoom against the "105" total label and the canvas edge — no clipping, no overlap. Legend at bottom with 5 color swatches + labels (Industrial, Transportation, Residential, Commercial, Agriculture), fully legible.
      Data: Five stacked area bands bottom-to-top: Industrial (brand green #009E73), Transportation (lavender), Residential (blue), Commercial (ochre), Agriculture (matte red, thin sliver at top). Colors follow Imprint canonical order 1→5, largest series first per spec guidance.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light.
      Chrome: Title, axis titles, and tick labels all render in light gray/off-white tones, clearly readable against the dark background — no dark-on-dark failures found anywhere (title, axis labels, tick labels, stack totals, plotBand label, legend all checked). The pandemic-era plotBand renders as a slightly lighter charcoal column with a legible label. Stack-total labels and the "Agriculture" callout remain legible in light gray, same positions as the light render, no clipping at the right edge (verified via corner crop).
      Data: Same five bands in the identical hex colors as the light render (green/lavender/blue/ochre/red) — confirmed pixel-identical data colors; only chrome (background, text, grid, plotBand shading) flips between themes.
