review:
  strengths:
  - Correct Imprint palette in canonical order (green Industrial, lavender Transportation,
    blue Commercial, ochre Residential, red Agriculture), identical data colors between
    light and dark renders
  - Series correctly ordered largest-at-bottom to smallest-at-top per the spec, with
    baseline anchored at zero
  - 'Distinctive D3 touch: end-of-series value labels and the growth-insight callout
    are computed directly from the d3.stack() layer data rather than a separate lookup,
    which is genuinely idiomatic low-level D3 usage'
  - Data-storytelling callout box (total growth '1,180 -> 1,462 TWh (+24%)' plus top-growing
    sector) gives the chart an immediate, clear takeaway
  - Exact mandated title format, correct legend labels matching the data categories,
    explicit font sizing throughout, strong canvas utilization (~70-80%), no edge
    clipping in either render
  - Theme-adaptive chrome (background, grid, axis text, legend, callout box) correctly
    threaded through both light and dark renders
  - Clean KISS code structure, deterministic hard-coded data, current D3 v7 API (d3.stack,
    d3.area, scaleOrdinal, selection.join)
  weaknesses:
  - 'The color-matched end-of-series value labels (505/384/273/221/79) fill with the
    raw series color and have no outline. Computed contrast against their background
    falls below WCAG readability thresholds for several: lavender #C475FD and ochre
    #BD8233 on the light #FAF8F1 background (~2.7:1 and ~3.1:1), and red #AE3030 on
    the dark #1A1A17 background (~2.7:1) -- all below the ~4.5:1 needed for 13px bold
    text. Since these labels carry critical numeric data, add a thin ink-colored stroke/outline
    per the style guide''s ''Optional outline pattern'' section, or switch the label
    fill to the theme-adaptive ink/inkSoft token instead of the raw series color.'
  - The code comment describes the dataset as 'global energy consumption by sector'
    but the totals (1,180-1,462 TWh across all five sectors) are country/regional
    scale -- real global energy consumption runs in the tens of thousands of TWh per
    year. Either rescale the values to a genuinely global magnitude or reframe the
    context to a specific country/region so the labeled scope matches the numbers.
  - All five sectors grow smoothly and monotonically at fairly similar rates across
    the 15 years -- a touch more variation (a flatter or dipping sector, or a one-year
    plateau) would better showcase feature coverage for a stacked-area chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "area-stacked · javascript · d3 · anyplot.ai" in bold dark text at top, clearly visible. Y-axis title "Energy Consumption (TWh)" (rotated) and x-axis title "Year" in dark ink, both readable. Tick labels on both axes in a softer dark gray, readable. A single faint horizontal gridline near the 1,600 tick is visible in the whitespace above the data; elsewhere gridlines are hidden behind the filled areas by design. A callout box (light elevated cream fill, thin border) in the top-left reads "Total energy consumption / 1,180 -> 1,462 TWh (+24%) / Industrial led the gain: +85 TWh (+20%)" in dark text -- fully legible. A legend at the right lists Industrial/Transportation/Commercial/Residential/Agriculture with color swatches, in dark gray text -- legible.
      Data: Five stacked area bands from bottom to top: Industrial (brand green #009E73, largest), Transportation (lavender), Commercial (blue), Residential (ochre), Agriculture (red, thinnest at top). Thin light-colored strokes separate each band. Color-matched end-of-series numeric labels (505, 384, 273, 221, 79) sit just left of the legend. The lavender "384" and ochre "221" labels are noticeably paler/lower-contrast against the cream background than the blue and red labels, though still distinguishable given their bold weight.
      Legibility verdict: PASS overall, with a caveat -- the lavender and ochre end-value labels read as low-contrast against the light background (computed ~2.7-3.1:1, below the ~4.5:1 target for text this size).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis titles, and tick labels all flip to light-colored text and remain clearly readable against the dark background -- no dark-on-dark failures observed. The callout box uses a dark elevated fill with light text, fully legible. Legend text is light gray and legible against the dark background.
      Data: Same five stacked bands in the identical colors as the light render (Industrial green, Transportation lavender, Commercial blue, Residential ochre, Agriculture red) -- data colors confirmed unchanged between themes, only chrome flipped. Band separators now render as thin dark strokes (matching the dark page background) instead of light ones. The color-matched end-of-series labels are present again; here the red "79" label (Agriculture) is the low-contrast one against the dark background (computed ~2.7:1), while lavender/ochre/blue/green read comfortably against the dark surface.
      Legibility verdict: PASS overall, with the same caveat mirrored to the opposite series -- the red end-value label is low-contrast against the dark background.
