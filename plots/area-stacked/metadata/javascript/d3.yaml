review:
  strengths:
  - Idiomatic use of d3.stack() + d3.area() with curveMonotoneX for smooth, correctly-computed
    stacked layers
  - Canonical Imprint palette order (green, lavender, blue, ochre, matte red) with
    brand green as the base layer, identical data colors across light and dark
  - Y-axis-only subtle gridlines, L-shaped spines (domain kept on bottom/left, gridline
    group's own domain removed), and generous margins produce clean, minimalist chrome
  - Series ordered largest-to-smallest from bottom to top per the spec's 'order by
    size' note, with baseline starting at zero
  - Thin pageBg-colored strokes between stacked layers add definition without adding
    visual noise
  - Both renders are fully theme-adaptive — no dark-on-dark or light-on-light legibility
    failures, and chrome flips correctly while data colors stay fixed
  weaknesses:
  - Title occupies only ~25-30% of plot width at 22px — well under the ~50-70% guideline
    (not an overflow violation, but a slightly larger fontsize would give the title
    more top-of-hierarchy visual weight)
  - Design execution is clean but conventional — no annotation or emphasized end-value
    labels call out the key takeaway (e.g. total energy consumption growth from ~1,180
    to ~1,462 TWh over the period)
  - 'LM-02: relies on the standard d3.stack + d3.area + curveMonotoneX combination
    — competent and idiomatic, but doesn''t showcase distinctive D3 capabilities beyond
    the expected baseline for this chart type (e.g. custom stack order/offset, direct
    end-of-line labels instead of a legend)'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white and not dark.
      Chrome: Title "area-stacked · javascript · d3 · anyplot.ai" is bold, dark, centered, and fully readable. "Year" x-axis label and "Energy Consumption (TWh)" rotated y-axis label are dark ink and clearly legible. Tick labels (years 2010-2024, values 0-1,600) are legible secondary-grey text. Legend (right side, 5 swatches: Industrial, Transportation, Commercial, Residential, Agriculture) is fully readable with rounded color swatches. Y-axis-only horizontal gridlines are faint and subtle, not competing with data.
      Data: First series (Industrial, bottom layer) is Imprint brand green #009E73; subsequent layers use lavender, blue, ochre, and matte red in canonical Imprint order. Thin light-colored strokes separate each stacked band for definition. Baseline starts at 0 and stacking rises smoothly to ~1,462 TWh at 2024.
      Legibility verdict: PASS — no light-on-light issues, all text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black and not light.
      Chrome: Title, axis labels, and tick labels have flipped to light/off-white text, fully readable against the dark background. Legend text and swatches remain legible. Gridlines are faint but visible against the dark surface.
      Data: Data colors are identical to the light render (same green/lavender/blue/ochre/red sequence) — only the chrome (background, text, gridlines, inter-layer stroke) adapted to the dark theme. No dark-on-dark failures observed; every text element has clear contrast against the near-black surface.
      Legibility verdict: PASS — no dark-on-dark issues, all text is clearly readable against the dark background.
