review:
  strengths:
  - Direct end-of-series value labels (color-matched per layer, read straight off
    the d3.stack() datum) give an immediate per-sector reading without relying solely
    on the legend
  - Growth-total callout ("1,180 → 1,462 TWh (+24%)") gives the viewer an immediate
    takeaway — directly addresses the prior review's data-storytelling feedback
  - Title fontsize increased from 22px to 28px for stronger top-of-hierarchy visual
    weight, per prior review feedback
  - Idiomatic d3.stack() + d3.area() + curveMonotoneX for smooth, correctly-computed
    stacked layers; canonical Imprint palette order with brand green as the base layer,
    identical across themes
  - Y-axis-only subtle gridlines, L-shaped spines, thin pageBg separator strokes between
    layers — clean, minimalist chrome with no overlap between the new end-labels and
    the legend
  - Both renders are fully theme-adaptive with no dark-on-dark or light-on-light legibility
    failures
  weaknesses:
  - Title still occupies only ~34% of canvas width (~38% of plot width) at 28px —
    under the ~70-85% expected for the long mandated title string; not a clipping/overflow
    violation, but the title reads smaller than its hierarchy role suggests on a 3200px-wide
    canvas
  - Growth callout only states the aggregate total; it doesn't call out which sector
    drove the growth (e.g., Industrial +85 TWh vs. Agriculture +19 TWh), leaving a
    secondary layer of insight on the table
  - End-of-series labels and legend swatches are both present but visually redundant
    for identifying series — could consolidate into direct labels only, freeing legend
    space for a secondary annotation
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "area-stacked · javascript · d3 · anyplot.ai" centered at top, fully legible at 28px. "Year" (x-axis) and rotated "Energy Consumption (TWh)" (y-axis) labels are dark ink, clearly readable. Tick labels (years 2010-2024, values 0-1,600 with comma formatting) are legible secondary-grey text. Legend on the right (Industrial, Transportation, Commercial, Residential, Agriculture) uses rounded color swatches with readable labels, no overlap with the new end-of-series value labels. A callout box top-left reads "Total energy consumption / 1,180 → 1,462 TWh (+24%)" on an elevated cream card.
      Data: Bottom-to-top stacked bands in Imprint brand green, lavender, blue, ochre, matte red (canonical order), separated by thin light strokes, rising smoothly from a zero baseline. Color-matched end-of-series value labels (505, 384, 273, 221, 79) sit just right of the stack, before the legend.
      Legibility verdict: PASS — all text readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, tick labels, legend text, and the callout box have all flipped to light/off-white on a dark elevated card and remain fully readable. Gridlines are faint but visible.
      Data: Colors are identical to the light render (brand green, lavender, blue, ochre, matte red) — only chrome (background, text, gridlines, inter-layer strokes, callout fill) adapted to the theme. End-of-series labels remain color-matched and legible.
      Legibility verdict: PASS — no dark-on-dark failures; every text element has clear contrast against the near-black surface.
