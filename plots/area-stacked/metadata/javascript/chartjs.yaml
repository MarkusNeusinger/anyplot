review:
  strengths:
  - 'CQ-04 duplication from the prior review is fully resolved: both callouts now
    share a single parameterized makeCallout(id, pointIndex, text) factory instead
    of duplicated drawing logic'
  - Elevated legend card gained a drop shadow plus a hairline border (t.grid stroke)
    on top of the rounded fill, pushing the 'callout card' treatment further from
    generic toward a genuine Imprint elevated-surface component
  - 'Correct Chart.js stacked-area technique: line datasets with fill:''origin''/''-1'',
    y.stacked, beginAtZero all combine into a proper zero-anchored stacked area'
  - 'Full Imprint palette compliance in both themes: brand green #009E73 first, canonical
    order for the remaining three series, data colors verified pixel-identical between
    light and dark renders'
  - Two annotated callouts (holiday traffic bump, Organic Search +71% growth) give
    the chart genuine narrative hierarchy beyond a raw data dump
  - Deterministic LCG-seeded data (seed=42), realistic neutral website-traffic scenario,
    sensible scale, and the largest-at-bottom stacking order (Direct > Organic Search
    > Referral > Social) holds across all 24 months
  weaknesses:
  - pointRadius:0 still leaves no marker affordance anywhere on the four lines other
    than the two annotation dots — a carry-over from attempt 1 that wasn't addressed
    in this repair
  - Both callout dots anchor to chart.getDatasetMeta(series.length - 1), i.e. the
    top of the total stack, even though the second callout's text is specifically
    about Organic Search's own growth — the dot doesn't sit on Organic Search's own
    boundary line, which is a minor mismatch between what the marker visually indicates
    and what the label claims
  - The elevated legend card is a full-width strip rather than a tightly-wrapped card
    sized to its content; the new border/shadow help, but a narrower, content-hugging
    card would read more intentional
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled ~#FAF8F1 — not pure white, not dark.
      Chrome: Bold dark-ink title "area-stacked · javascript · chartjs · anyplot.ai" centered at top, fully visible with no clipping. Legend sits inside a rounded elevated card (now with a subtle drop shadow and a hairline border on the card edge) with four swatches: Direct (green), Organic Search (lavender/purple), Referral (blue-gray), Social (ochre/tan). Axis titles "Website Visits (thousands)" / "Month" and tick labels render in dark/soft-gray ink — all legible. Subtle y-axis-only horizontal grid.
      Data: Four areas stacked bottom-to-top from a zero baseline: Direct (largest, green, #009E73) -> Organic Search (lavender) -> Referral (blue-gray) -> Social (ochre, smallest), matching the spec's "largest at bottom" guidance and the canonical Imprint palette order. Two dashed-leader annotations ("Holiday traffic bump" near Nov '23, "Organic Search +71% since Jan '23" near the right side) sit cleanly above the stack apex with no overlap with other text or data.
      Legibility verdict: PASS — no light-on-light issues, no clipping at any canvas edge (checked all four corners + top strip).

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled ~#1A1A17 — not pure black, not light.
      Chrome: Title and axis text render in near-white/light-gray ink, fully legible. The legend card flips to its dark elevated fill with the same rounded/shadow/border treatment; card border and shadow are visible against the dark background. Grid lines stay subtle but visible.
      Data: Swatch and fill colors are pixel-verified identical to the light render (green/lavender/blue-gray/ochre) — only chrome (background, text, card fill, grid) flipped, consistent with the theme-adaptive requirement. Both annotation callouts remain legible in light ink with no dark-on-dark failures.
      Legibility verdict: PASS — no dark-on-dark text, no clipping at any canvas edge (checked all four corners + top strip).

    Both renders pass the theme-readability check (5c) and the edge-clipping check (AR-09) with no issues. Canvas dimensions verified at 3200x1800 for both renders (canvas gate file absent — gate passed).
