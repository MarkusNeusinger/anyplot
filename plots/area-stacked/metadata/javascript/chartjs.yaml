review:
  strengths:
  - 'Correct Chart.js stacked-area technique: line datasets with fill:''origin''/''-1''
    and y.stacked:true, beginAtZero true — baseline anchored at zero as the spec requires'
  - 'Full Imprint palette compliance across both renders: brand green #009E73 first,
    canonical positions 1-4 for the 4 series, data colors identical between light
    and dark, only chrome flips'
  - 'Genuine data storytelling: two annotated callouts (holiday traffic bump, Organic
    Search +71% growth) built via custom afterDatasetsDraw plugins give the chart
    a clear narrative instead of leaving patterns for the viewer to infer'
  - 'Distinctive library usage: custom elevatedLegendBg plugin (beforeDraw) draws
    a proper Imprint ''callout card'' behind the legend instead of a bare default
    legend row — goes beyond basic Chart.js config'
  - Series correctly ordered largest-to-smallest bottom-to-top (Direct > Organic Search
    > Referral > Social) per the spec's 'largest at bottom' guidance, verified consistent
    from Jan '23 through Dec '24
  - Deterministic LCG-seeded synthetic data (seed=42), realistic and neutral web-traffic-by-source
    scenario, sensible thousands-visits scale
  - Theme-adaptive chrome correctly threaded via ANYPLOT_TOKENS in both renders; grid
    guideline followed (x-axis grid off, y-axis grid subtle only)
  - Title format exactly matches 'area-stacked · javascript · chartjs · anyplot.ai';
    axis titles descriptive with units ('Website Visits (thousands)', 'Month')
  weaknesses:
  - holidayCallout and organicGrowthCallout plugins duplicate the same dashed-leader/dot/label
    drawing logic almost verbatim — refactor into a single parameterized callout plugin
    (index, text) to avoid the copy-paste (CQ-04).
  - The elevatedLegendBg card is a nice touch but stays fairly generic (plain rounded
    rect + soft shadow) — a subtle border or tighter typographic pairing with the
    legend text would push it further from 'good default' toward distinctive (DE-01).
  - pointRadius:0 hides all markers on the top stack line, so only the two annotation
    dots mark actual data points — acceptable for a smooth area chart but slightly
    reduces the sense of discrete monthly readings (VQ-03).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "area-stacked · javascript · chartjs · anyplot.ai" in bold dark ink, clearly readable. Legend sits inside a rounded elevated card (white-ish fill, soft shadow) with four swatches: Direct (green), Organic Search (lavender), Referral (blue), Social (ochre). Y-axis title "Website Visits (thousands)" and X-axis title "Month" both dark ink, fully legible. X tick labels (Jan '23 ... Nov '24) and Y tick labels (0-4,000) in soft gray, readable. Subtle horizontal grid lines only (x-axis grid disabled per style guide). Two dashed-leader annotations ("Holiday traffic bump" near Nov '23, "Organic Search +71% since Jan '23" near Aug '24) in soft ink, positioned above the stack apex with no overlap on data or other text.
      Data: Four stacked areas from bottom to top: Direct (#009E73 brand green, largest), Organic Search (#C475FD lavender), Referral (#4467A3 blue), Social (#BD8233 ochre, smallest) — matches canonical Imprint palette order 1-4. Areas are semi-transparent (alpha 0.75) with solid 2px borders. Stack baseline sits at zero. Series ordering (largest at bottom) holds consistently across the full 24-month range.
      Legibility verdict: PASS — all title, axis, tick, legend, and annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title in bold near-white ink, clearly readable. Legend card now uses the dark elevated fill (#242420-ish) with the same rounded-rect + shadow treatment, swatches and light-gray text fully legible. Axis titles in light ink, tick labels in soft light-gray, all readable. Grid lines subtle and visible against the dark surface. Both annotation callouts render in light ink with the same dashed leaders and dot markers, fully legible with no dark-on-dark text.
      Data: Same four stacked areas in the same colors and same relative order as the light render (#009E73, #C475FD, #4467A3, #BD8233) — confirmed identical to light render; only the chrome (background, text, legend card fill, grid) flipped to the dark tokens.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome and annotation text reads clearly against the near-black background.
