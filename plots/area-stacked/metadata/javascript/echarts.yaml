review:
  strengths:
  - Correct Imprint palette in canonical order (green → lavender → blue → ochre) with
    theme-correct chrome (background, text, grid) in both light and dark renders
  - Largest-to-smallest stacking order (Residential > Commercial > Industrial > Transportation)
    matches the spec's readability guidance
  - 'Effective data storytelling: the ''EV adoption accelerates'' markLine annotation
    at 2018 combined with a bolder stroke on the Transportation band draws the eye
    to the ~23x EV-charging growth story'
  - 'Baseline correctly anchored at zero (yAxis min: 0), avoiding misleading proportions
    per spec notes'
  - Explicit font sizing throughout (title 28px, axis names 16px, tick/legend 14px)
    with a clean, balanced layout — no overlap or clipping in either theme
  weaknesses:
  - '"Regional utility service area" framing sits awkwardly against ~2,100 TWh total
    by 2024 — that magnitude reads closer to a small country''s total consumption
    than a single region''s; either scale the values down or adjust the narrative
    framing'
  - Data trends are directionally similar (all sectors flat-to-rising) apart from
    Transportation; a touch more variation (e.g. a dip in one sector during a downturn
    year) would strengthen DQ-01 feature coverage
  - 'LM-02: uses one distinctive ECharts feature (markLine) but is otherwise a fairly
    standard stacked-line-as-area configuration; leaning further into ECharts-specific
    capabilities would raise library mastery'
