review:
  strengths:
  - 'Correct idiomatic ECharts stacked-area pattern: type: "line", stack: "total",
    areaStyle, boundaryGap: false'
  - 'Imprint palette in canonical order with first series #009E73, identical data
    colors across light/dark renders'
  - Y-axis baseline fixed at 0 (no misleading proportions) and series ordered largest-to-smallest
    bottom-to-top per spec
  - Semi-transparent area fills (opacity 0.82) keep stacked bands readable without
    hiding the boundary lines
  - Y-axis label includes units ("Electricity Consumption (TWh)"); theme-adaptive
    chrome correctly threaded through ANYPLOT_TOKENS
  - Deterministic, hard-coded data; clean KISS top-to-bottom structure with no functions/classes
  weaknesses:
  - 'Design storytelling is generic: every series shares identical line width/opacity,
    so the standout Transportation growth trend (8 -> 156 TWh) isn''t visually emphasized
    despite being the most interesting insight in the data — consider a bolder stroke,
    callout, or subtle highlight on that series.'
  - 'Data proportions drift from real-world US EIA sector figures: Industrial is shown
    as the largest sector and Residential second, but in reality Residential and Commercial
    are typically the top two US electricity-consuming sectors; total consumption
    (~1,470 TWh by 2024) is well below the real US total (~3,900-4,000 TWh); Transportation
    reaching 156 TWh by 2024 is far above real EV-charging load (~30-40 TWh) — rescale
    toward real EIA sector totals or reframe as a clearly-labeled regional/illustrative
    subset.'
  - Title occupies only ~28% of the plot width at fontSize 22 — well under the comfortable
    50-70% range — a modest fontsize increase would give it more visual presence without
    risking overflow.
  - 'Library Mastery is only lightly distinctive: emphasis.focus:"series" and smooth
    interpolation are nice but generic touches — a dataZoom slider, markLine/markArea
    milestone, or visualMap would better showcase ECharts-specific strengths in the
    interactive HTML view.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "area-stacked · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. X-axis "Year" and Y-axis "Electricity Consumption (TWh)" labels are dark and legible. Tick labels (years 2010-2024, values 0/300/600/900/1200/1500) are in a softer dark grey, all readable. A subtle horizontal grid line sits only at the 1,500 gridline area (light, non-competing). Legend at the bottom (Industrial, Residential, Commercial, Transportation) with colored line+dot swatches, readable dark-grey text.
      Data: Four stacked area bands from bottom to top: Industrial (brand green #009E73, largest and flattest ~480-512 TWh), Residential (lavender #C475FD, second largest ~385-430 TWh), Commercial (blue #4467A3, third ~310-372 TWh, growing steadily), Transportation (ochre/amber #BD8233, smallest but expanding dramatically from ~8 to ~156 TWh, visibly widening toward the right edge). First series is confirmed brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, tick labels, and legend text all rendered in light/off-white tones, clearly legible against the dark background. No dark-on-dark text found. Grid line at 1,500 is faint but visible against the dark background.
      Data: Same four stacked bands in identical colors to the light render — Industrial green, Residential lavender, Commercial blue, Transportation ochre — confirming data colors are unchanged between themes; only the chrome (background/text/grid) flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures observed.
