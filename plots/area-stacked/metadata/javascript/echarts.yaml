review:
  strengths:
  - 'Idiomatic ECharts stacked-area pattern: type: "line" + stack: "total" + areaStyle,
    which is the correct high-level approach since ECharts has no dedicated area-chart
    type'
  - 'Deliberate data storytelling: bolder line weight and full opacity on the Transportation
    series pulls focus to the EV-adoption growth story, reinforced by a markLine ("EV
    adoption accelerates") and a markArea ("2020 downturn") that give the viewer immediate
    context'
  - Correct Imprint palette in canonical order (green/lavender/blue/ochre), identical
    across both themes, with fully theme-adaptive chrome (title, axis, ticks, grid,
    legend) — both plot-light.png (#FAF8F1) and plot-dark.png (#1A1A17) are clean
    and legible
  - 'Realistic, factually-grounded dataset: ~185 TWh multi-sector utility footprint,
    directionally varied 2020 pandemic dip (commercial/industrial down, residential
    up from WFH), and a ~30x Transportation/EV growth curve — not a uniform trend
    line'
  - 'Clean, minimal chrome: y-axis line hidden, x-axis split lines hidden, subtle
    single-axis grid, generous margins, series stacked largest-to-smallest per the
    spec''s ordering guidance'
  weaknesses:
  - 'smooth: 0.2 curve interpolation on a yearly categorical x-axis slightly implies
    sub-year curvature that isn''t in the underlying data — a straight-segment stacked
    area (smooth: 0 or omitted) would read as more literal for discrete yearly points'
  - Legend uses the ECharts default line+circle icon style rather than a swatch matched
    to the filled-area look of the series, a small missed opportunity for extra polish
  - Annotation text ("EV adoption accelerates", "2020 downturn") is set at 12px and
    becomes hard to make out at the ~400px mobile-preview scale, even though it remains
    legible at full resolution
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "area-stacked · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. X-axis "Year" and Y-axis "Electricity Consumption (TWh)" axis titles readable in dark ink. Tick labels (years 2010-2024, values 0-210) readable in medium-gray ink. Subtle horizontal gridlines only on the y-axis. Legend at bottom (Residential, Commercial, Industrial, Transportation) readable in soft-gray text with color-matched line+circle icons. A dashed vertical annotation line at 2018 labeled "EV adoption accelerates" (rotated text) and a shaded rectangular markArea spanning 2019-2021 labeled "2020 downturn" are both legible.
      Data: Four stacked areas, bottom-to-top: Residential (brand green #009E73), Commercial (lavender #C475FD), Industrial (blue #4467A3), Transportation (ochre #BD8233, bold outline for emphasis). First series is confirmed brand green, colors follow Imprint canonical order.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, fully legible against the dark background. Gridlines remain subtle. Legend text is light-gray and readable. The markLine ("EV adoption accelerates") and markArea ("2020 downturn") annotation text remain legible — no dark-on-dark failures observed.
      Data: Same four stacked areas in identical hex values to the light render (green/lavender/blue/ochre) — confirms data colors are constant across themes; only chrome (background, text, grid) flipped.
