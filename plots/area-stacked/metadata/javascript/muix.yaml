review:
  strengths:
  - 'Native MUI X stacking (`stack: "traffic"` with `area: true`) produces contiguous
    layers from a zero baseline, ordered largest at the bottom, with the y axis reaching
    past the 10.8k peak total'
  - 'Imprint palette in canonical order (#009E73 organic search first) with identical
    data colors across themes; chrome flips correctly on #FAF8F1 and #1A1A17'
  - monotoneX curves smooth the monthly series without overshooting the data values
  - 'Correct v9 API throughout: skipAnimation, axis band sizing via height/width,
    slotProps.legend.sx, `.MuiLineChart-*` and `[data-series]` selectors'
  - Designed header row and a 3 px Social stroke with a computed +114% caption give
    the chart a clear focal series
  - Interactive HTML keeps MUI X's native axis tooltip for per-month inspection of
    every layer
  weaknesses:
  - 'CQ-01 (code): the sample lives in four separate per-series arrays plus a `dates`
    array, with no role constants and no single `const data` records array, so the
    plot code cannot be pointed at other data → one `// Data` block ending in `const
    data` (one record per month and source, keyed by MONTH / SOURCE / VISITS constants)
    and series built below `// Plot` from `new Set(data.map(d => d[SOURCE]))`. Likely
    cause: the data block written per series instead of following the muix prompt''s
    "Data block" section.'
  - 'CQ-04 (code): `colors={t.palette.slice(0, 4)}` is a literal slice sized to the
    four sample series, which the style guide forbids → `colors={t.palette}` (MUI
    X hands out the first n in order). Likely cause: palette sized to the sample instead
    of passed whole.'
  - 'Suggestion: the y-axis zero tick reads "0k"; formatting it as "0" would read
    more cleanly.'
  - 'Suggestion: the growth caption sits in the header far from the Social layer;
    tying it visually to the layer (for example aligning it to the right edge at the
    Social band) would strengthen the focal point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "Website Traffic Sources · area-stacked · javascript · muix · anyplot.ai" top-left (~47% of width); a light elevated chip top-right with an ochre dot reading "Social: fastest-growing channel, +114% since Jan 2024"; y axis "Monthly Visits" 0k–11k, x axis "Month" with ticks Jan 2024 … Oct 2025 every quarter; subtle horizontal grid; dashed ink-soft "Avg total: 9.4k" reference line; bottom-centered legend (Organic Search, Direct, Referral, Social). All text dark and readable.
      Data: four stacked semi-transparent areas: Organic Search #009E73 at the base (~4.1k → 5.6k), Direct lavender #C475FD (~2k–2.5k), Referral blue #4467A3 (~1.2k–1.4k), Social ochre #BD8233 on top (~0.6k → 1.3k); total rises from ~8.1k to ~10.8k. Layers contiguous, 2 px boundary strokes, Social stroke thicker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels, legend text and the chip text all light ink and clearly readable; chip on a dark elevated fill; grid subtle but visible; reference line and label in light ink-soft. No dark-on-dark text.
      Data: same four palette colors in the same order and positions as the light render (the 0.82 fill opacity blends slightly toward each background, but the series colors are identical); brand green clearly visible.
      Legibility verdict: PASS
