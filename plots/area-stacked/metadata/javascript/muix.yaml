review:
  strengths:
  - 'Correct stacked area chart: LineChart + area:true + stack (the idiomatic MUI
    X pattern, since there is no separate AreaChart component) with all 4 series ordered
    largest-to-smallest so Organic Search anchors the base, matching the spec''s ordering
    guidance.'
  - 'Genuine storytelling beyond a generic area chart: a dashed ''Avg total: 9.4k''
    ChartsReferenceLine plus a derived-from-data callout (''Social: fastest-growing
    channel, +114% since Jan 2024'') give the chart a clear analytical focal point.'
  - 'Full Imprint palette compliance: brand green (#009E73) first, canonical positions
    1-4 for the remaining series, identical data colors between light/dark, and correctly
    theme-flipped chrome (background, ink, grid) in both renders.'
  - Deterministic, in-memory data via a fixed-seed LCG (browser has no seeded RNG);
    clean imports; correct MUI X component contract (default export, skipAnimation,
    sized to window.ANYPLOT_SIZE).
  - 'Baseline starts at zero (yAxis min: 0) avoiding misleading proportions, per spec
    notes; legend clearly identifies all 4 series.'
  weaknesses:
  - 'The ''Avg total: 9.4k'' reference-line label sits directly over the Social (ochre)
    fill near the right edge with fairly small text (12px) and no background pad —
    readable but visually crowded against the busy area fill; consider a small background
    chip or repositioning above the line.'
  - No horizontal gridlines are rendered, only y-axis ticks at 1k increments across
    an 11k range — a subtle gridline would make precise value reading easier without
    adding visual noise.
  - Design Excellence is mostly carried by the two storytelling annotations; beyond
    that the chart relies on MUI X defaults (no additional grid/background styling),
    so overall visual refinement is good but not exceptional.
  - 'Header comment block (''// Library: muix 7.29.1 | JavaScript 22.23.2'') deviates
    from the documented header style in prompts/library/muix.md (which includes a
    License line and ''MUI X Charts | React | Node 22'' format) — cosmetic only, gets
    rewritten by impl-review anyway.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Website Traffic Sources · area-stacked · javascript · muix · anyplot.ai" top-left in dark ink, bold; growth callout top-right ("Social: fastest-growing channel, +114% since Jan 2024") with a matching orange dot; y-axis "Monthly Visits" (0k-11k) and x-axis "Month" (Jan 2024-Jan 2026) labels clearly visible in dark ink; legend centered at bottom with 4 labeled swatches (Organic Search, Direct, Referral, Social).
      Data: Four stacked areas bottom-to-top: green (Organic Search, #009E73), lavender (Direct), blue (Referral), ochre (Social) — matches Imprint canonical positions 1-4. Dashed reference line labeled "Avg total: 9.4k" crosses the chart. Baseline starts at 0.
      Legibility verdict: PASS — all title, axis, tick, legend, and annotation text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as light render with ink flipped to light/white — title, axis labels, tick labels, legend text, and the reference-line label are all light-colored and clearly legible against the dark background. No dark-on-dark failures observed.
      Data: Area fill colors are pixel-identical to the light render (green, lavender, blue, ochre) — confirms only chrome flips between themes, not data colors.
      Legibility verdict: PASS — all text reads clearly against the dark background; brand green remains vivid and distinguishable from the dark surface.
