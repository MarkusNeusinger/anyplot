review:
  strengths:
  - Correct, idiomatic MUI X stacked-area pattern (LineChart + area:true + stack),
    matching the library's documented approach for this chart type
  - 'Full Imprint palette compliance: colors pulled directly from t.palette.slice(0,4),
    first series is #009E73, identical data colors across light/dark renders'
  - Explicit font sizing throughout (21px title, 16px axis label, 14px tick/legend)
    with clean legibility in both themes — no dark-on-dark or light-on-light issues
    found
  - Deterministic seeded LCG (seed 42) for reproducible data generation; realistic,
    neutral 'website traffic sources' business scenario with plausible per-channel
    growth and seasonality
  - Title format, legend labels, X/Y data mapping, and zero baseline (yAxis min:0)
    all correctly implemented per spec
  - Series ordered largest-at-bottom (Organic Search -> Direct -> Referral -> Social)
    per the spec's explicit ordering note; semi-transparent fills (fillOpacity 0.82)
    aid overlap readability at band boundaries
  - Clean margins, no clipping or overlap issues in either render, legend positioned
    close to the plot, good canvas utilization (~90%+ width, ~80%+ height used by
    the chart)
  weaknesses:
  - DE-03 Data Storytelling is at baseline — the chart displays the four channels
    without any added narrative or visual-emphasis technique; consider a subtle spotlight
    on the fastest-growing channel (Social) or a light total-visits reference to give
    the viewer an immediate takeaway beyond raw composition
  - DE-01/DE-02 read close to a well-configured library default rather than a genuinely
    art-directed chart — consider a small typographic hierarchy tweak (e.g. slightly
    heavier title weight) or a subtle gradient/edge treatment on the area fills to
    lift aesthetic sophistication above the current baseline
  - LM-02 Distinctive Features is moderate — the sx slot-class overrides (MuiAreaElement-root,
    MuiLineElement-root) and 'stack' grouping are used, but no truly MUI X-unique
    capability (e.g. ChartsReferenceLine for a total/average line, custom tooltip
    formatting) is showcased that would set this apart from a generic stacked-area
    implementation in another library
  - 'Minor/no-deduction note: the title occupies only ~40% of canvas width (measured),
    below the ~50-70% expected range for a custom-prefixed title — not a legibility
    problem (fully readable, no overflow) but leaves headroom unused; a slightly larger
    title fontsize would better balance the layout'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Website Traffic Sources · area-stacked · javascript · muix · anyplot.ai" in dark ink, clearly visible at the top-left. X-axis label "Month" and Y-axis label "Monthly Visits" (rotated) both in dark ink, fully legible. Tick labels ("Jan 2024" .. "Jan 2026" on X; "0k".."11k" on Y) are dark and crisp against the light background. Legend at the bottom center reads "Organic Search / Direct / Referral / Social" with small colored line swatches, all legible.
      Data: Four stacked area bands from bottom to top — Organic Search (brand green #009E73, largest), Direct (light purple/orchid), Referral (medium blue), Social (amber/ochre, smallest at start, grows over time). Bands are separated by thin 2px boundary strokes, fills are semi-transparent (~0.82 opacity), all clearly distinguishable by hue. Baseline starts at 0k as required.
      Legibility verdict: PASS — all text readable, no overlap, no clipping observed at either canvas edge.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, tick labels, and legend all rendered in light/off-white text, fully legible against the dark background. No dark-on-dark failures found — checked axis ticks, Y-axis rotated label, and legend text specifically via cropped close-ups.
      Data: Same four bands in identical colors to the light render (green, purple, blue, amber) — confirmed only chrome (background/text) flips between themes, data colors are unchanged.
      Legibility verdict: PASS — all text readable, no dark-on-dark issues, brand green remains clearly visible against the dark surface.
