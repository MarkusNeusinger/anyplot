review:
  strengths:
  - 'Correct canonical Imprint palette order: Organic Search #009E73 (brand green),
    Direct #C475FD, Referral #4467A3, Social #BD8233 — identical across both themes'
  - 'Genuine data storytelling: dashed average-total reference line plus a callout
    box calling out the fastest-growing channel (Social, +114%), with the callout
    swatch color matched to the Social series'
  - Series ordered largest-to-smallest at the base (Organic Search > Direct > Referral
    > Social) per the spec's readability guidance, with y-axis pinned to zero
  - Both light and dark renders are fully legible — theme-adaptive chrome (title,
    axis ticks, grid, legend) with no dark-on-dark or light-on-light failures
  - 'Idiomatic MUI X usage: LineChart with area+stack, ChartsReferenceLine for the
    average annotation, targeted sx overrides on MUI class selectors (.MuiAreaElement-root,
    .MuiLineElement-series-social) to emphasize the Social series with a thicker stroke'
  - Deterministic, realistic data (monthly website traffic sources over 24 months)
    with seasonal variation and a plausible fastest-growing channel narrative
  weaknesses:
  - Vertical axis lines (left/bottom spines) are kept rather than fully removed —
    a slightly more minimal axis treatment (tick marks only, no continuous axis line)
    would push Visual Refinement further
  - Y-axis label 'Monthly Visits' is descriptive but doesn't carry an explicit unit
    qualifier (e.g. 'Monthly Visits (count)') — minor, doesn't affect readability
  - The average-total reference line and callout are a good storytelling start, but
    the insight could be pushed further with a direct in-chart annotation pointing
    at the specific month where Social visibly accelerates
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Bold dark title "Website Traffic Sources · area-stacked · javascript · muix · anyplot.ai" top-left, clearly readable. Top-right callout box on a slightly elevated card background reads "Social: fastest-growing channel, +114% since Jan 2024" with an amber swatch — fully legible. Y-axis "Monthly Visits" (0k–11k) and x-axis "Month" (Jan 2024–Jan 2026, quarterly ticks) labels and tick labels are dark and crisp against the light background. Horizontal grid lines are subtle grey, visible but not dominant. A dashed reference line labeled "Avg total: 9.4k" cuts across the chart with a light halo behind the text for contrast against the underlying area fill. Legend at the bottom lists Organic Search / Direct / Referral / Social with matching color swatches.
      Data: Four stacked area bands from bottom to top — Organic Search (#009E73 brand green, largest), Direct (light violet/purple), Referral (blue), Social (amber/ochre, thickest stroke to draw attention as the highlighted series). Areas use ~0.82 fill opacity with a slightly darker stroke outline per band, smoothly curved (monotoneX).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Title renders in white/light text, fully readable. Callout box background and amber swatch remain legible on the dark surface. Axis labels, tick labels, and the "Avg total: 9.4k" reference-line label all render in light-colored text with sufficient contrast — no dark-on-dark failures observed. Grid lines are subtle light grey, visible without dominating.
      Data: Same four bands in identical colors to the light render — Organic Search #009E73 green at the base, then violet Direct, blue Referral, and amber/ochre Social — confirming data colors are unchanged and only chrome (background/text/grid) flipped for the theme.
      Legibility verdict: PASS — all text remains clearly readable against the dark background; brand green and the amber accent both read well on the dark surface.
