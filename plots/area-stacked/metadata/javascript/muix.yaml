review:
  strengths:
  - 'Native MUI X stacking: four `area: true` series share `stack: "traffic"`, so
    each layer starts exactly where the one below ends with no gaps and the top edge
    reads as the total'
  - Series are sorted by their summed visits from the records (Organic Search at the
    bottom, Social on top), so the Notes' largest-at-bottom order holds at every month
    without a typed list
  - 'Zero baseline (`min: 0`) on a value axis that runs to 11k, just past the highest
    total of about 10.8k'
  - 'Imprint palette in canonical order (#009E73, #C475FD, #4467A3, #BD8233), identical
    in both renders, with theme tokens threaded through the title, callout pill, grid
    and reference-line label so both themes read cleanly'
  - Crisp full-opacity boundary strokes over 0.82-opacity fills keep neighboring layers
    distinct in both themes
  - Time-scale x axis with a `valueFormatter` ("Jan 2024") and a compact `k` formatter
    on the y axis, with axis bands sized explicitly so nothing truncates
  - Plausible website-traffic scenario with differing growth rates and seasonal phases,
    so the composition visibly shifts toward Social and Organic Search over two years
  - Interactive HTML keeps MUI X's native axis tooltip for per-month inspection of
    every layer
  weaknesses:
  - 'VQ-03 (both): the legend shows thin 2 px line samples for layers drawn as filled
    areas, so the glyphs do not carry the marks'' fill → filled square swatches in
    each series'' color. Likely cause: line series default to the `line` legend mark;
    set `labelMarkType: "square"` on each series.'
  - 'Suggestion: the y-axis bottom tick reads "0k"; a formatter that prints "0" for
    zero would read cleaner.'
  - 'Suggestion: the dashed "Avg total" line cuts through the Referral and Social
    layers and can read as a layer boundary; a lighter stroke or dropping it would
    keep the stack edges unambiguous.'
  - 'Suggestion: the 13 px callout pill in the top-right is small next to the 22 px
    title; a size closer to the 14 px tick labels would balance the header.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 (not pure white).
      Chrome: bold dark title "Website Traffic Sources · area-stacked · javascript · muix · anyplot.ai" top-left (~47% of width); top-right a pale pill with an ochre dot and "Social: fastest-growing channel, +114% since Jan 2024". Y axis "Monthly Visits" with ticks 0k–11k, x axis "Month" with quarterly ticks Jan 2024 … Oct 2025. Subtle horizontal grid. Dashed ink-soft line at ~9.45k labelled "Avg total: 9.4k". Bottom-centered legend: Organic Search, Direct, Referral, Social with thin line samples. All text dark and readable.
      Data: four stacked filled areas (0.82 opacity) with crisp boundary strokes — Organic Search #009E73 at the bottom (~4.1k rising to ~5.6k), Direct #C475FD (~2–2.5k), Referral #4467A3 (~1.2–1.4k), Social #BD8233 on top (~0.6k growing to ~1.3k). Total rises from ~8.1k to ~10.8k. Layer order constant, zero baseline, no gaps.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 (not pure black).
      Chrome: title, axis titles, tick labels and legend text in light ink; the callout pill uses the elevated dark surface with light soft text; grid lines subtle dark grey; the avg-total line and label in light ink-soft. No dark-on-dark text.
      Data: same four Imprint colors in the same order as the light render (fills look deeper only because the 0.82 opacity blends with the dark page); boundary strokes identical; brand green clearly visible.
      Legibility verdict: PASS
