review:
  strengths:
  - Row overlap is exactly 60% ((RIDGE_HEIGHT-ROW_STEP)/RIDGE_HEIGHT), matching the
    spec's '50-70% overlap' guidance precisely and explicitly commented in code
  - Y-axis correctly shows categorical month labels instead of numeric density values,
    as the spec requires
  - Proper Gaussian KDE per group with Silverman's rule bandwidth selection, not a
    shortcut histogram or fake smoothing
  - Deterministic fixed-seed LCG random generator gives full reproducibility despite
    the browser having no seeded RNG
  - Back-to-front z-order draw with a background-colored stroke on each ridge cleanly
    separates overlapping mounds, aiding readability
  - Theme-adaptive chrome (title, axis label, ticks, group labels) is correctly threaded
    through window.ANYPLOT_TOKENS; data colors are identical between light and dark
    renders
  - Realistic, physically plausible monthly temperature progression for a temperate
    city that visually tells a clear seasonal story
  weaknesses:
  - 'Ridge color uses a continuous d3.scaleSequential(interpolateRgbBasis(t.seq))
    gradient keyed to group index, but ''group'' (month) is a categorical variable
    per the spec, and the style guide reserves imprint_seq for continuous/intensity
    data rather than categorical identity; this is a defensible adaptation for 12
    ordered groups exceeding the 8-slot categorical palette (and it does correctly
    anchor the first ridge to brand green #009E73), but it''s a palette-compliance
    gray area worth tightening in a future pass'
  - Gaussian KDE tails never truly reach zero, so several ridges trail a faint but
    visible near-flat sliver of fill across most of the plot width beneath the main
    hump; clip density below roughly 0.5-1% of each group's peak before building the
    area path so ridges taper to a clean point instead of a flat shelf
  - Library Mastery is solid but conventional — the implementation follows a well-known
    joyplot recipe without showcasing more distinctive d3-specific capabilities
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "ridgeline-basic · javascript · d3 · anyplot.ai" centered at top; y-axis lists Jan-Dec descending in dark-gray text; x-axis is a plain domain line with tick labels (-10, 0, 10, 20, 30) and the axis title "Average Daily Temperature (°C)" beneath it. All chrome text is clearly legible against the light background.
      Data: 12 overlapping mound-shaped KDE density ridges, stacked with ~60% vertical overlap, colored on a continuous gradient from brand green (#009E73, Jan, top) through teal to blue (Dec, bottom). Each ridge has a thin background-colored stroke that cleanly separates it from the ridge behind it where they overlap. The stack visually narrates the seasonal temperature arc: cold, left-shifted mounds in winter months, sliding right and widening/narrowing plausibly through spring into a warm summer peak (Jun-Aug, far right), then sliding back left into autumn/winter.
      Legibility verdict: PASS — no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now rendered in light/white text; y-axis month labels and x-axis tick labels rendered in light gray, both clearly readable against the dark surface. Axis domain line and grid-adjacent elements are visible but subtle.
      Data: Identical green-to-blue gradient and identical ridge shapes/positions as the light render, confirming only chrome (not data color) flipped between themes. The white-on-light-render stroke separators appropriately render as a near-black stroke here, still cleanly separating overlapping ridges.
      Legibility verdict: PASS — no dark-on-dark failures found; all text and data remain clearly distinguishable from the near-black background.
