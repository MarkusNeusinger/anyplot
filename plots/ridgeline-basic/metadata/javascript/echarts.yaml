review:
  strengths:
  - 'Correct Imprint palette in canonical order with brand green #009E73 always first'
  - Y-axis shows group (region) labels instead of numeric density values, per spec
  - Ridges ordered meaningfully by ascending mean wait time, creating a clear visual
    narrative down the chart
  - Correct ~50% overlap construction (bandStep/ridgeHeight ratio) with z-ordering
    so each ridge visually occludes the one above it, matching the classic ridgeline
    look
  - 'Deterministic: seeded LCG + Box-Muller for synthetic data, manual Gaussian KDE
    with Silverman''s rule, no external RNG dependency'
  - Theme-adaptive chrome correctly threaded through ink/inkSoft tokens; both light
    and dark renders are fully legible
  - Clean, idiomatic ECharts multi-grid/multi-axis technique (the standard community
    approach for ridgelines, since ECharts has no native ridgeline series type); animation
    disabled per library gotcha
  weaknesses:
  - X-axis ticks are unevenly spaced near the end (0, 3, 6, 9, 12, 15, 17) because
    X_MAX=17 isn't a multiple of the auto tick interval — use a round X_MAX (e.g.
    18) or an explicit axis interval so tick spacing stays uniform
  - 'Grid lines are fully disabled on both axes (splitLine: show false everywhere)
    — the style guide calls for grid lines to be subtle but visible, not entirely
    removed; a faint horizontal splitLine on the bottom-most x-axis would help orientation
    without cluttering the ridges'
  - Overlap zones (e.g. Pacific/South/Atlantic cluster) blend into noticeably darker
    compound colors from the 0.78 area opacity stacking — a slightly lower opacity
    (~0.65-0.7) would keep individual ridge colors more distinguishable where three
    curves overlap
  - Library Mastery is solid but relies entirely on the standard multi-grid workaround;
    no ECharts-distinctive extra (e.g. a subtle visualMap-driven gradient per ridge)
    to push it further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Call Center Wait Times · ridgeline-basic · javascript · echarts · anyplot.ai" is dark ink text, centered top, fully readable. Region labels (North, East, Pacific, South, Atlantic, Central, West, Mountain) run down the left side in dark text, all legible. X-axis "Wait Time (minutes)" title and tick labels (0, 3, 6, 9, 12, 15, 17) are medium-gray (inkSoft), clearly visible against the light background.
      Data: 8 overlapping density ridges, one per region, ordered top-to-bottom by ascending mean wait time. First series (North) is Imprint brand green #009E73; subsequent ridges follow the canonical Imprint order (lavender, blue, ochre, matte red, cyan, rose, lime). Each ridge is a smoothed KDE line with semi-transparent area fill, drawn with later (lower) ridges layered on top of earlier ones so each mountain partially occludes the one above — the intended ridgeline silhouette effect.
      Legibility verdict: PASS — no text collides with data or other text, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in light/white ink, fully readable against the dark background. Region labels are light-colored text, all legible. X-axis title and tick labels are light gray (inkSoft on dark), clearly visible — no dark-on-dark failures observed anywhere.
      Data: Identical ridge colors and shapes to the light render — same green-first canonical Imprint sequence, same overlap/z-ordering, confirming only chrome (background/text) flipped between themes.
      Legibility verdict: PASS — all text remains legible, brand green and the rest of the palette read clearly against the dark surface.
