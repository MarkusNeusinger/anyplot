review:
  strengths:
  - 'Correct spec compliance: KDE-based ridgeline stacked chronologically Jan (bottom)
    through Dec (top), y-axis shows month labels rather than numeric values'
  - Deterministic LCG-seeded Gaussian sampling (seed=42) with a hand-rolled Box-Muller
    KDE - fully reproducible, no library RNG needed
  - Thoughtful semantic diverging color mapping (t.div, red=hot / blue=cold) keyed
    to each month's mean temperature - an explicitly endorsed style-guide semantic
    exception that adds a second data dimension beyond ridge position
  - This attempt's fix (increased SPACING 35->40, reduced fill alpha 0.55->0.45, added
    clipToSignificant) measurably improved both hot-cluster readability and tail clutter
    vs. the prior attempt
  - Both light and dark renders are fully legible with correct theme backgrounds and
    chrome tokens; data colors identical between themes; no AR-08/AR-09 violations
  weaknesses:
  - The Jun-Sep hot cluster still blends somewhat due to similar red hues packed closely
    - a further spacing bump or distinguishing outline stroke on adjacent same-hue
    ridges would help
  - Flat near-baseline border tails are still visible on several ridges (Sep, Aug,
    Nov) even after clipping - consider tightening the clipToSignificant threshold
    (e.g. 5% instead of 2% of peak density) or lowering border opacity in the tails
  - File has grown to seven small helper functions across repairs; consider consolidating
    the color helpers (hexToRgb/lerpRgb/divergingColor) into one function if this
    file is touched again
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "ridgeline-basic · javascript · chartjs · anyplot.ai" in bold dark ink, clearly readable. Y-axis shows month labels (Jan at bottom through Dec at top) instead of numeric values, per spec. X-axis shows "Temperature (°C)" with ticks from -15 to 35. Subtle vertical gridlines only; no horizontal gridlines. No legend (correctly omitted given 12 series; y-axis labels serve as the group key).
      Data: 12 overlapping KDE ridges stacked bottom-to-top in chronological order with clear vertical overlap. Colors follow a diverging red-blue gradient keyed to each month's mean temperature (cold winter months = blue, hot summer months = red), a documented semantic exception for temperature. Front-to-back stacking (lower months drawn last, in front) handled correctly via the "order" property.
      Legibility verdict: PASS - all title, axis, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title, axis labels, and tick labels have flipped to light ink and are clearly readable against the dark background. Gridlines remain subtle. Layout is otherwise identical to the light render.
      Data: Ridge fill/border colors are visually identical to the light render (same red-blue diverging gradient per month) - only the chrome (background, text, grid) flipped, consistent with the "data colors constant / chrome adaptive" rule.
      Legibility verdict: PASS - no dark-on-dark failures found; all text and data elements are distinguishable from the near-black surface.
