review:
  strengths:
  - Composes the ridges as a custom SVG layer inside ChartsContainer, reading the
    shared linear scales through useXScale/useYScale, so the ridges sit on the native
    MUI X axes rather than on a hand-drawn coordinate system
  - Y axis uses tickInterval at the integer baselines plus a valueFormatter that maps
    each baseline to its month, so every group label sits exactly at its ridge's baseline
    with no numeric density values
  - Ridge peak at 1.6 row spacings gives about 60 % overlap; drawing later (lower)
    ridges on top with a 2 px page-colored outline keeps every ridge's outline traceable
    against the one behind in both themes
  - Months colored in twelve ordered steps of imprint_seq (t.seq) from brand green
    to blue in chronological order, identical between themes
  - Realistic continental-climate daily highs with wider winter spread show the seasonal
    sweep and the narrowing summer distributions; Gaussian KDE with Silverman bandwidth,
    normalized per group
  - 'Clean chrome: no grid, y axis line and ticks disabled, explicit font sizes, all
    text theme-token colored and readable in both renders'
  weaknesses:
  - 'Suggestion: interpolating the ramp in a perceptual space instead of raw RGB would
    make the step from month to month more even, especially in the green half.'
  - 'Suggestion: a tick every 4 °C instead of every 2 °C would lighten the x axis
    without losing precision.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no grid.
      Chrome: centered bold title "ridgeline-basic · javascript · muix · anyplot.ai" at top; y-axis title "Month" rotated on the left with month tick labels Jan..Dec (Jan at top) at each ridge baseline; x axis with ticks −16..36 every 2 and title "Daily high temperature (°C)". All text dark and readable.
      Data: 12 filled density ridges stacked top-to-bottom, colored in steps from brand green #009E73 (Jan) to Imprint blue (Dec); ~60 % overlap, each lower ridge drawn in front with a thin page-colored outline so contours stay traceable. Ridges sweep right toward Jul/Aug (~28–30 °C) and back left in winter.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, month labels and x ticks rendered in light ink; x axis line light; no dark-on-dark text.
      Data: identical ridge colors to the light render (green → blue ramp); outlines switch to the dark page color and still separate the ridges.
      Legibility verdict: PASS
