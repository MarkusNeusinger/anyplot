review:
  strengths:
  - Correct ridgeline construction via MUI X's low-level composition API (ChartContainer
    + useXScale/useYScale/useDrawingArea) — the library has no native ridgeline chart
    type, so this is the idiomatic way to build one while staying inside the theme-aware
    coordinate system
  - 'Theme-adaptive ridge separators: each ridge''s outline stroke uses t.pageBg,
    so overlap boundaries render as cream lines in light mode and near-black lines
    in dark mode automatically — a subtle but correct detail'
  - Deterministic Gaussian KDE per month via a seeded LCG (seed 42), with Silverman's-rule
    bandwidth and peak-normalization so ridge height compares shape rather than raw
    sample count
  - Realistic, well-scaled seasonal data (temperate continental climate, winter mean/std
    wider than summer) with all 12 months distinctly shaped, none flat or identical
  - 'Full spec compliance: chronological Jan→Dec ordering, group labels replace the
    numeric Y-axis, partial vertical overlap between ridges, redundant color+position
    encoding of month order'
  - 'Clean theme/palette handling: first ridge (Jan) is exactly #009E73, gradient
    built from the Imprint imprint_seq stops (t.seq), identical data colors between
    light/dark renders, only chrome flips'
  - No grid, no y-axis spine, generous margins — minimal, uncluttered chrome that
    lets the ridges read clearly
  weaknesses:
  - Title (~49 chars, no descriptive prefix) renders at only ~28-30% of plot width
    at the default 22px size — well under the 50-70% guidance for a short title; growing
    the title fontsize slightly (e.g. to ~26-28px) would give it more visual weight
    without risking overflow
  - The per-ridge stroke (t.pageBg, 2px) creates visible crossing lines where adjacent
    ridges overlap (most noticeable Jan/Feb and Jun-Sep) — attractive as a separation
    technique, but in the densely-packed middle months it reads slightly busy/wireframe-like;
    consider a thinner stroke (1-1.5px) or lower peak-height overlap in that band
  - The green-to-blue color gradient tracks month index (Jan=green...Dec=blue), which
    is fully redundant with the existing vertical position encoding and adds no new
    information (e.g. it does not track actual temperature) — mapping the gradient
    to mean temperature instead would give the color a second, non-redundant storytelling
    job
  - Adjacent ridges in the May-Sep range land on visually similar mid-gradient teal
    shades, making it slightly harder to tell exactly which color belongs to which
    ridge from color alone (position/labels still disambiguate, so this is a soft
    VQ-04 nit, not a defect)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "ridgeline-basic · javascript · muix · anyplot.ai" centered at top, clearly readable. Y-axis shows month labels (Jan-Dec, top to bottom) in soft dark-gray text instead of numeric ticks, per spec. X-axis is labeled "Daily High Temperature (°C)" with dark tick labels from -18 to 38. No grid, no y-axis spine — minimal chrome.
      Data: 12 overlapping density "ridges," one per month, ordered chronologically top (Jan) to bottom (Dec). Jan is #009E73 (Imprint brand green); color interpolates through teal to #4467A3 (Imprint blue) for Dec, i.e. the imprint_seq gradient tied to month order. Ridges show a partial vertical overlap with a thin outline (colored to match the page background) where a lower ridge paints over the tail of the one above it, creating the classic mountain-ridge look. Winter months (Jan/Feb/Dec) show visibly wider, flatter distributions; summer months (Jun-Aug) show narrower, taller peaks — consistent with real seasonal temperature variance.
      Legibility verdict: PASS — title, axis title, tick labels, and all 12 month labels are clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light/white text, fully readable. Month labels on the Y-axis and the "Daily High Temperature (°C)" X-axis title/ticks all render in light gray — no dark-on-dark failures observed anywhere (including the ridge-separator strokes, which correctly switch from a white line in light mode to a near-black line in dark mode, since the stroke color is theme-token-driven).
      Data: Same 12 ridges, same #009E73-to-#4467A3 gradient as the light render — data colors are pixel-for-pixel identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS — all text and data remain fully legible; brand green stays vivid against the dark surface.
