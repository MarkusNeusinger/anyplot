review:
  strengths:
  - Real Gaussian KDE evaluated on a shared temperature grid, with per-month Silverman
    bandwidth — a genuine statistical technique rather than a hard-coded bump shape
  - 'Chronological color gradient built from the two official imprint_seq tokens (seq[0]
    -> seq[1]), keeping the first ridge (Jan) exactly #009E73 and identical across
    light/dark renders'
  - 'Faithful ridgeline construction: ~70% vertical overlap via threshold-offset area
    series, y-axis shows only group (month) labels rather than numeric values, groups
    ordered chronologically — all match the spec''s notes'
  - Deterministic LCG-based data generation (seed=42), fully reproducible, no external
    RNG dependency
  - 'Both renders are theme-correct: warm off-white/near-black backgrounds, all title/axis/tick
    text legible, no clipping at any canvas edge, credits watermark disabled'
  weaknesses:
  - Title occupies only ~33% of the 3200px canvas width (measured ~1056px) at the
    documented 22px default — notably narrower than the ~50-70% guideline for a shorter
    custom-length mandated title; a slightly larger title fontsize (~26-28px) would
    improve top-of-canvas balance without risking overflow
  - Adjacent mid-sequence months (roughly Apr-Jul) land on similar teal hues from
    the seq[0]->seq[1] tween, slightly reducing at-a-glance color distinctiveness
    between neighboring ridges — the y-axis month labels fully compensate, but a touch
    more hue separation would help
  - Applying the continuous imprint_seq gradient across 12 ordinal category rows (rather
    than cycling the discrete 8-color Imprint categorical palette) is a reasonable
    and well-justified deviation given brand-green-first is preserved end to end,
    but worth noting as a non-default choice for future consistency checks
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "ridgeline-basic · javascript · highcharts · anyplot.ai" centered at top, clearly readable (measured ~1056px / 33% of the 3200px canvas width, narrower than typical but not clipped). Y-axis shows month labels Jan (top) through Dec (bottom) in dark-gray text, no numeric y-axis. X-axis title "Temperature (°C)" with units, tick labels from -12 to 34 in steps of 2, all in soft dark-gray. Subtle light-gray vertical gridlines. No legend (not needed — labels already identify each ridge).
      Data: 12 overlapping density "ridges", one per month, filled with a smooth green-to-blue gradient (Jan = #009E73 brand green, transitioning through teal to blue by Dec). Peaks visibly shift right (warmer) through mid-year and back left (colder) toward Dec, tracing the seasonal temperature cycle. Ridges overlap ~65-70% vertically with each row's outline drawn in the same hue as its fill.
      Legibility verdict: PASS — title, axis labels, tick labels, and month labels are all clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title now in white/light text, fully readable. Month labels and axis text rendered in light gray. Gridlines subtle but visible against the dark surface. Same layout and structure as the light render.
      Data: Identical green-to-blue gradient and ridge shapes/positions as the light render — Jan is the same #009E73 green, Dec the same blue; only the chrome (background, text, grid) flipped for the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/month text is clearly visible against the near-black background, and the data colors read well on the dark surface.
