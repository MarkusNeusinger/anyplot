review:
  strengths:
  - Native density-based ridgeline construction (geom_ribbon + dplyr::reframe with
    density()) faithfully recreates the classic ggridges look despite the package
    being unavailable, with correct z-ordering (factor(month, levels = rev(months)))
    so each ridge properly occludes the ones behind it.
  - 'The Imprint imprint_seq gradient (#009E73 -> #4467A3) is used to encode the chronological
    month sequence, reinforcing the mountain-range reading while staying fully compliant
    with the brand palette in both themes.'
  - Theme-adaptive chrome (PAGE_BG/INK/INK_SOFT) is correctly threaded through plot
    background, title, axis text, and even the ridge separator outline color, producing
    two fully legible, theme-correct renders.
  - Realistic, neutral seasonal-temperature dataset with plausible per-month means
    and variances (cold winters, warm summers, gradually varying spread).
  - 'Clean KISS-style script: seed set, no functions/classes, explicit font sizes
    matching the style-guide defaults, correct ragg::agg_png save call.'
  weaknesses:
  - '`library(tidyr)` is imported but never used anywhere in the script (no pivot_longer/pivot_wider/unnest/complete
    calls) — remove the unused import.'
  - The y-axis has no axis title (labs(y = NULL)); acceptable since month labels are
    self-explanatory, but a subtle 'Month' label could add clarity for first-time
    viewers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface — not pure white.
      Chrome: Title "Monthly Temperatures · ridgeline-basic · r · ggplot2 · anyplot.ai" in dark ink, clearly readable, spanning ~65% of canvas width. Y-axis shows month abbreviations (Jan-Dec) in soft dark gray, evenly spaced. X-axis "Temperature (°C)" label and tick labels (-10 to 30) in dark/soft-dark ink, fully legible. No grid lines (intentional minimal design). Only a thin bottom axis line remains, top/right/left spines removed.
      Data: 12 overlapping density "mountain" ridges, one per month, ordered Jan (bottom) to Dec (top). Fill colors form a smooth Imprint imprint_seq gradient from brand green #009E73 (Jan) through teal to blue #4467A3 (Dec), with white/background-colored outline strokes separating each ridge from the one behind it. Ridges clearly show the seasonal cycle: narrow/cool distributions in Jan-Mar, widening and shifting right (warmer) through Jun-Aug, then narrowing back left through Sep-Dec.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface — not pure black.
      Chrome: Title in light/off-white ink, clearly readable. Y-axis month labels in light gray, evenly spaced and legible. X-axis label and tick labels in light gray/off-white, fully legible against the dark surface. Same minimal no-grid, bottom-axis-only styling as the light render.
      Data: Same 12 ridges with an identical green-to-blue imprint_seq gradient (#009E73 -> #4467A3) as the light render — confirmed data colors are unchanged between themes. Ridge separator outlines are now dark (matching PAGE_BG), giving the same "cutout" occlusion effect appropriate for the dark surface.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed (title, axis labels, and tick labels all use light ink tokens).
