review:
  strengths:
  - 'Correct ridgeline construction: per-month Gaussian KDE (Silverman bandwidth)
    normalized to a shared ridge height, drawn back-to-front (Dec first, Jan last)
    so nearer ridges correctly occlude farther ones, matching the classic joyplot
    depth effect'
  - Y-axis uses month labels via the `yticks = (baselines, months)` tuple instead
    of numeric offsets, exactly as the spec requires
  - 'Full theme-adaptive chrome: PAGE_BG/INK/INK_SOFT tokens correctly flip between
    light and dark saves, spines reduced to a single bottom spine, subtle 15%-alpha
    vertical gridlines only (appropriate since Y is categorical)'
  - First (bottom, Jan) ridge renders in Imprint brand green `#009E73`, and the sequential
    `imprint_seq`-style green-to-blue gradient (`cgrad(["#009E73", "#4467A3"])`) is
    used to give each of the 12 ordinal months a unique, non-recycled color instead
    of falling back to an 8-color categorical palette that would have to repeat
  - 1.3px ink-colored outline stroke on every ridge crest gives clean edge definition
    between heavily overlapping bands in both themes
  - 'Data is realistic and appropriately scaled: monthly mean/std pairs plausibly
    match a temperate (Berlin-like) climate, with distinct spread as well as position
    per month'
  - Canvas saved at the exact canonical 3200x1800 landscape target via `size=(1600,900)`
    + `px_per_unit=2`, using the modern `size=` kwarg rather than the deprecated `resolution=`
  weaknesses:
  - '`using ColorSchemes` (line 8) appears to be an unused import — `cgrad` and `get(gradient,
    x)` are provided by Makie''s own re-export of PlotUtils, not by ColorSchemes.jl.
    Remove the import if a check confirms nothing from ColorSchemes is actually referenced.'
  - The ridge color gradient is keyed to month index (`(m-1)/11`), not to the actual
    mean temperature — Jan and Dec (the two coldest, most similar months) end up maximally
    far apart in color (green vs. blue) while July (the hottest) sits in the visually
    unremarkable middle of the gradient. Keying the gradient to `mean_temp[m]` instead
    (min-max normalized) would let color reinforce the seasonal temperature story
    instead of just re-encoding the month order that the Y-axis position already shows.
  - All 12 KDEs are symmetric/unimodal (pure `randn()` per month) — distribution *shape*
    is identical across every ridge, only mean and spread vary. A touch more feature
    diversity (e.g. one or two months with a slight skew or a secondary cold-snap/heat-spike
    bump) would better demonstrate the ridgeline's ability to reveal shape differences,
    not just shift/spread differences.
  - Ridge overlap is fairly aggressive (ridge_height=2.3 vs. row step=1.0, i.e. each
    peak can rise ~2.3 rows), beyond the spec's suggested "typically 50-70% overlap"
    — still readable thanks to the ink outlines and z-ordering, but a repair pass
    could verify legibility holds if any further tuning happens elsewhere in the figure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "ridgeline-basic · julia · makie · anyplot.ai" is bold dark text, clearly legible near the top. X-axis label "Temperature (°C)" and tick labels (-10, 0, 10, 20, 30) render in dark/soft-dark ink, fully readable. Y-axis shows month labels Jan-Dec (soft dark gray) instead of numeric ticks, as the spec requires. Bottom spine visible in soft ink; top/right/left spines removed. Subtle vertical gridlines at ~15% opacity.
      Data: 12 overlapping KDE ridges stacked bottom (Jan) to top (Dec), each filled with a color sampled from a green-to-blue sequential gradient and outlined with a thin dark stroke. Jan (bottom-most, first series) renders in Imprint brand green #009E73. Colors monotonically shift toward blue (#4467A3) as month index increases toward Dec.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or overlap issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis label, and tick labels now render in light ink (#F0EFE8 / #B8B7B0), clearly legible against the near-black background. No dark-on-dark text found anywhere (title, axis labels, tick labels, month labels are all light-colored). Gridlines and bottom spine use the light-ink token at low opacity, still subtle but visible.
      Data: The 12 ridge fill colors are visually identical to the light render — same green-to-blue gradient, Jan still #009E73, only the chrome (background, text, grid, spine) flipped to the dark tokens. Ink outline strokes on ridge crests remain dark (#1A1A17-ish) in both renders, which still reads fine against the colored fills in dark mode since they sit on top of saturated ridge colors, not the page background.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no unreadable or dark-on-dark elements found.
