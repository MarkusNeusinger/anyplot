review:
  strengths:
  - 'Ridge fill color is now keyed to actual mean temperature (min-max normalized
    `temp_norm`), not month index — the gradient itself visually reinforces the warm/cold
    seasonal story instead of duplicating the Y-axis''s chronological ordering; Jan
    (coldest) renders brand green #009E73, Jul (warmest) renders the gradient''s blue
    endpoint'
  - Jan and Jul now include a secondary minority component (a cold-snap and a heat-spike
    bump respectively) layered onto the base Gaussian, producing genuinely asymmetric/bimodal
    KDE shapes — the ridgeline now demonstrates distribution *shape* differences,
    not just shift/spread differences, directly answering the attempt-1 DQ-01 note
  - Unused `using ColorSchemes` import removed; all four imports (CairoMakie, Colors,
    Random, Statistics) are actually used
  - 'Correct ridgeline construction preserved: per-month Gaussian KDE (Silverman bandwidth)
    normalized to a shared ridge height, drawn back-to-front (Dec first, Jan last)
    so nearer ridges correctly occlude farther ones'
  - Y-axis uses month labels via `yticks = (baselines, months)` instead of numeric
    offsets, exactly as the spec requires
  - 'Full theme-adaptive chrome: PAGE_BG/INK/INK_SOFT tokens correctly flip between
    light/dark saves, including the ridge-crest outline stroke color (dark ink in
    light theme, light ink in dark theme) — confirmed visually in both renders'
  - Canvas saved at the exact canonical 3200x1800 landscape target via size=(1600,900)
    + px_per_unit=2
  - 'Data is realistic and appropriately scaled: monthly mean/std pairs plausibly
    match a temperate (Berlin-like) climate, and the cold-snap/heat-spike bumps are
    physically plausible magnitudes'
  weaknesses:
  - Ridge overlap remains aggressive (ridge_height=2.3 vs. row step=1.0, i.e. well
    beyond the spec's suggested 'typically 50-70% overlap') — still fully readable
    thanks to the ink outlines and back-to-front z-ordering, so this is a minor polish
    note rather than a defect
  - LM-01/LM-02 usage stays close to the library-prompt skeleton (manual band!+lines!
    loop, cgrad/get gradient sampling) rather than reaching for a more distinctive
    Makie-specific mechanism; not a deduction-worthy issue on its own but the ceiling
    for Library Mastery
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "ridgeline-basic · julia · makie · anyplot.ai" reads clearly at the top. X-axis label "Temperature (°C)" and tick labels (-10, 0, 10, 20, 30) render in dark ink and are fully legible. Y-axis shows month labels Jan-Dec (bottom to top) instead of numeric ticks, per spec. Only the bottom spine is kept; subtle ~15%-alpha vertical gridlines. Ink-colored (dark) outline strokes trace every ridge crest for edge definition.
      Data: 12 overlapping KDE ridges stack bottom (Jan) to top (Dec). Fill color is a green-to-blue gradient keyed to each month's actual mean temperature (not month index): Jan (coldest, bottom) is Imprint brand green #009E73, Jul (warmest, middle) is the gradient's blue endpoint, and intermediate months interpolate smoothly by temperature rather than by chronological position. Jan's ridge shows a distinct extra shoulder/bump toward the cold end (~-10 to -15°C) and Jul's ridge shows an extra shoulder toward the hot end (~27-30°C) — both are visibly asymmetric/bimodal versus the other ten symmetric ridges, demonstrating genuine shape variation.
      Legibility verdict: PASS — all text (title, axis label, tick labels, month labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis label, and tick/month labels now render in light ink (#F0EFE8 / #B8B7B0), clearly legible against the dark surface — no dark-on-dark text anywhere. Ridge-crest outline strokes now render in light ink (flipped from dark in the light render), correctly following the theme-adaptive INK token, and remain visible against the saturated ridge fills.
      Data: The 12 ridge fill colors are pixel-identical to the light render (Jan still #009E73 brand green, Jul still the gradient's blue endpoint, same temperature-keyed gradient) — only chrome (background, text, grid, spine, outline stroke) flipped. The Jan cold-snap bump and Jul heat-spike bump are equally visible in this render.
      Legibility verdict: PASS — no unreadable or dark-on-dark elements found; both renders pass the theme-readability check.
