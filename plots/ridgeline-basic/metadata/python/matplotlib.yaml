review:
  strengths:
  - 'Elegant use of a custom LinearSegmentedColormap built directly from the mandated
    imprint_seq definition (#009E73 -> #4467A3) to encode the 12 ordered months --
    January anchors exactly at the required first-series brand green, and the gradient
    reinforces the calendar sequence as a storytelling device'
  - 'Idiomatic manual joyplot construction: gaussian_kde + fill_between with correct
    z-order (bottom-drawn-first, so nearer ridges properly occlude the ones behind
    them), subtle baseline shelf lines, and PAGE_BG-colored edge strokes for a crisp
    cutout look'
  - Clean theme-adaptive chrome -- spines removed, subtle x-axis-only grid, INK/INK_SOFT
    tokens consistently applied; both renders pass the legibility and background checks
    with identical data colors across themes
  - Realistic, neutral dataset (Northern Hemisphere monthly temperatures) with per-month
    variance that plausibly widens in transitional months (Apr/May/Oct/Nov)
  - Canvas is the exact 3200x1800 landscape target, correct save call (no bbox_inches='tight'),
    fully reproducible via fixed seed
  weaknesses:
  - Adjacent months land on closely related colormap shades (e.g. June/July, August/September)
    that are hard to tell apart by color alone -- fully mitigated by the y-axis month
    labels, but a slightly wider hue spread would make the gradient carry more signal
    on its own
  - No annotation or visual emphasis calls out the seasonal extremes (coldest/warmest
    month) -- a subtle highlight on the January or July ridge would sharpen the data-storytelling
    focal point
  - 'Library-mastery ceiling: the kde+fill_between recipe is competent and correctly
    ordered, but matplotlib offers no ridgeline-specific API, so there isn''t a truly
    library-distinctive feature beyond the manual construction itself'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Title "ridgeline-basic · matplotlib · anyplot.ai" in dark ink, centered near top, clearly readable (~61% of plot width). Y-axis shows the 12 month names as labels aligned to each ridge baseline, in soft dark-gray ink. X-axis shows "Temperature (°C)" with ticks at -10, 0, 10, 20, 30, 40, all in dark/soft-dark ink. Subtle vertical gridlines at each major x tick, alpha ~0.15.
      Data: 12 overlapping (~60%) KDE density ridges stacked vertically, colored in a smooth green-to-blue gradient (January green #009E73 at top, fading through teal to blue #4467A3 at December, bottom). Each ridge has a thin PAGE_BG-colored edge stroke creating a crisp cutout separation from the ridge behind it. First series (January) is exactly the mandated brand green.
      Legibility verdict: PASS -- all text (title, month labels, x tick labels, axis label) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Same title, same layout, now rendered in light/cream ink, clearly legible against the dark backdrop. Month labels and x-axis tick labels in soft light-gray, fully readable. Gridlines remain subtle but visible.
      Data: Same green-to-blue gradient ridges as the light render -- confirmed the data colors are identical between themes; only chrome (background, text, gridlines) flips.
      Legibility verdict: PASS -- no dark-on-dark failures detected; all title/label/tick text is clearly visible against the near-black background.
