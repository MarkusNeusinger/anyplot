review:
  strengths:
  - Idiomatic use of lets-plot's dedicated geom_area_ridges (with scale=1.2 overlap
    and alpha=0.85) instead of hand-rolling ridges from geom_density — a genuinely
    library-distinctive choice
  - Ridge border color is set to the page background, which produces a clean separation
    line between overlapping ridges in both themes without any extra annotation code
  - Theme-adaptive chrome (INK / INK_SOFT / PAGE_BG tokens) is threaded through axis
    text, titles, and grid consistently — both renders are fully legible with no dark-on-dark
    or light-on-light issues
  - Correct canvas (ggsize(800, 450) + scale=4 -> 3200x1800), correct mandated title
    format with a sensible descriptive prefix, and both PNG/HTML outputs saved per
    theme
  - 'Realistic, well-parameterized synthetic data: 12 months with a plausible Northern
    Hemisphere seasonal mean/std pattern (wider spread in winter, tighter in summer)
    and a fixed seed for reproducibility'
  - Y-axis correctly shows group labels (month names) rather than numeric density
    values, and the legend is deliberately omitted since the axis labels already identify
    every group
  weaknesses:
  - 'VQ-07: 12 groups exceed the 8-slot Imprint categorical palette. Instead of following
    the style guide''s ''Color Restraint'' guidance for 9+ series (''use small multiples,
    never recycle colors''), the implementation builds a continuous per-month gradient
    interpolated between the two imprint_seq endpoints (#009E73 -> #4467A3) and assigns
    one discrete stop per group. It stays within the Imprint color family and is a
    defensible call for a chart type that structurally needs every group visible at
    once, but it is a literal deviation from the categorical-palette rule — worth
    flagging explicitly rather than treating as a silent exception.'
  - 'DE-02: All four panel spines are kept (a full rectangular frame) rather than
    the style guide''s L-shaped default (top/right removed). Spine visibility is listed
    as an AI-discretion choice, so this isn''t a hard violation, but an L-shaped or
    borderless frame would read as more refined for this chart type.'
  - 'DE-02: The vertical gridlines (panel_grid_major_x, color=INK, size=0.3) read
    a bit stronger than the ''subtle, 15-25% opacity'' guidance since no explicit
    alpha is set — they''re solid full-opacity ink at a thin width rather than a soft
    tint.'
  - 'DE-01/DE-03: The color progression tracks month order rather than an explicit
    narrative (e.g. tying hue more directly to temperature intensity or emphasizing
    a specific extreme month) — pleasant but not a strong storytelling hook.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme surface — not pure white.
      Chrome: Title "Monthly Temperature Distribution · ridgeline-basic · python · letsplot · anyplot.ai" is dark ink, large, and fully visible near the top with comfortable margin (no clipping). X-axis title "Temperature (°C)" and tick labels (-10 to 30) are dark/soft-grey and clearly legible. Y-axis shows the 12 month names (January at top through December at bottom) in soft dark grey, none overlapping the panel border or the ridge curves. Thin vertical gridlines are visible but not overpowering. A full rectangular panel border frames the plot.
      Data: 12 overlapping ridge curves (geom_area_ridges) stacked top (January) to bottom (December), colored with a green-to-blue gradient built from the two Imprint imprint_seq stops (#009E73 -> #4467A3); January starts at the brand green #009E73. Each ridge has a background-colored border that creates a clean pale separation line where ridges overlap (clearly visible around June/July/August). Distribution shapes plausibly track a Northern Hemisphere seasonal pattern (wide/cool in winter, narrower/warmer in summer).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme surface — not pure black.
      Chrome: Title is light/off-white and fully visible with the same margin as the light render, no clipping. Axis title and tick labels are light grey and clearly readable against the dark background — no dark-on-dark failures observed anywhere (title, axis text, and month labels all use the light INK/INK_SOFT tokens correctly). Gridlines and panel border are visible in a lighter grey, appropriately subdued.
      Data: Same 12 ridge curves in the identical green-to-blue gradient colors as the light render (confirmed identical hex progression, only chrome flipped) — the ridge border again matches the page background (near-black here), producing the same clean separation effect.
      Legibility verdict: PASS
