review:
  strengths:
  - 'Smart handling of 12 groups (above the 8-slot categorical palette limit) by mapping
    ordinal month position to the imprint_seq continuous gradient (#009E73 -> #4467A3),
    keeping January anchored at brand green and avoiding color recycling — matches
    the style guide''s ''9+ series'' guidance'
  - 'Genuinely idiomatic multi-layer grammar-of-graphics composition: a separate geom_text()
    layer with its own dataframe and inherit_aes=False, plus annotate(''segment'',
    ...) as an independent leader line, layered on top of the geom_ribbon ridges'
  - Theme-adaptive chrome correctly threaded through PAGE_BG/INK/INK_SOFT tokens —
    both light and dark renders are legible with correctly flipped backgrounds and
    text colors
  - Clean KISS structure, explicit np.random.seed(42), and explicit font sizes set
    on every theme element
  - Realistic, neutral seasonal-temperature data with correct polarity and scale for
    a Northern Hemisphere temperate climate (winter ~2-4°C, summer ~24-25°C)
  weaknesses:
  - 'Every one of the 12 ridges shows a solid full-width horizontal baseline line
    (the geom_ribbon ymin edge, stroked at color=INK_SOFT with no reduced alpha on
    the outline) that extends across the entire x_range including the near-zero-density
    tails — visible in both renders as gray streaks cutting through other ridges (e.g.
    around x=30-40 near the Peak annotation). This undercuts the ''mountain ridge''
    aesthetic the spec calls for. Fix: trim each month''s rows to where density_scaled
    exceeds a small threshold (e.g. > 0.02 * ridge_scale) before building ridge_df,
    or drop/lighten the ribbon outline (color=None or a much lower alpha) so only
    the top density curve reads as a line.'
  - Monthly distributions are fairly uniform in shape and spread (similar bell curves,
    same std range 3-5) — showing a bit more variation (e.g. tighter winter spread
    vs. wider transitional-month spread, or slight skew) would demonstrate DQ-01 feature
    coverage more richly.
  - LM-02 distinctive-feature usage is present (independent-data geom_text layer,
    annotate segment) but stays fairly safe — leaning further into plotnine-specific
    grammar (e.g. stat_density directly, or geom_ribbon with a fill legend/colorbar
    styled to the theme) would push Library Mastery higher.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "ridgeline-basic · python · plotnine · anyplot.ai" and gray subtitle "Monthly temperature distributions — Northern Hemisphere temperate climate" both clearly legible. Y-axis shows month labels (Jan at bottom through Dec at top) in dark gray, X-axis "Temperature (°C)" in dark ink, "Month" axis title rotated on the left. Subtle vertical major gridlines at ~10% opacity. All chrome elements readable, no clipping at any canvas edge.
      Data: 12 overlapping KDE ridge curves colored via a continuous green-to-blue gradient (imprint_seq) keyed to month order — January is the brand green #009E73, December the blue #4467A3, with intermediate months smoothly interpolated. A small bold green "Peak: Jul ≈ 25°C" annotation with a thin diagonal leader line points from the July ridge's crest toward a label placed clear of other curves on the right side of the plot. Notable defect: every ridge's baseline is drawn as a solid horizontal line spanning the full plot width (an artifact of the ribbon's constant-ymin edge being stroked even where density is near zero), visible as gray streaks crossing through other ridges, most noticeably in the upper-right area near the Sep/Aug/Jul rows.
      Legibility verdict: PASS (all text readable; the baseline-line artifact is a visual/design flaw, not a legibility failure)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle rendered in light ink (near-white / light gray) and clearly legible against the dark background. Y-axis month labels and X-axis "Temperature (°C)" label are light gray, tick labels visibly lighter/softer than the title as intended by the secondary-text token. No dark-on-dark text anywhere. Subtle gridlines still visible at low opacity.
      Data: Data colors are identical to the light render — same green (#009E73, January) to blue (#4467A3, December) gradient, same "Peak: Jul ≈ 25°C" annotation in the same brand green with the same leader-line geometry. Only the chrome (background, text, grid) flipped between themes as required.
      Legibility verdict: PASS (no dark-on-dark failures found; same baseline-line artifact present as in the light render, carried over identically since it is a data/geometry issue, not a theme issue)
