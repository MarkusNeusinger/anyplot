review:
  strengths:
  - Correctly implements a ridgeline plot with 12 chronologically ordered monthly
    KDE curves and clear 50-70% vertical overlap per the spec.
  - 'Uses the Imprint sequential gradient (imprint_seq: #009E73 -> #4467A3) to color
    the ridges, correctly anchoring January at brand green rather than picking colors
    arbitrarily.'
  - 'Showcases plotnine''s layered grammar distinctively: a separate geom_text data
    layer with inherit_aes=False plus an annotate(''segment'', ...) leader line to
    create a focal-point callout on the July peak.'
  - Theme-adaptive chrome is threaded correctly end-to-end (INK/INK_SOFT tokens, PAGE_BG)
    -- both light and dark renders are fully legible with matching data colors.
  - 'Thoughtful KDE post-processing: walks outward from each month''s density peak
    to keep only the contiguous visible run, avoiding stray near-zero-density slivers
    stretching across the full x-range.'
  - Canvas is exactly 3200x1800 with generous margins; no clipped text at any edge.
  weaknesses:
  - 'The ''Peak: Jul ~= 25C'' annotation''s leader line (the annotate(''segment'',
    ...) call) terminates almost exactly at the right-aligned label''s text box, so
    the green line visibly cuts through the label (through the tilde/approx symbol)
    in BOTH light and dark renders -- shorten xend/yend so the segment stops clearly
    short of the text, or add extra x-margin between the label anchor (x=34.5) and
    the segment''s xend (currently 33.5).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Bold dark title "ridgeline-basic · python · plotnine · anyplot.ai" top-left, grey subtitle below it, dark "Month" y-axis title (rotated) and light-grey-brown "Temperature (°C)" x-axis title, both clearly readable. Y-axis tick labels (Jan-Dec) and x-axis tick labels (0/10/20/30) are dark/soft-grey and fully legible. A faint vertical gridline is visible at each major x tick.
      Data: 12 stacked, partially-overlapping KDE ridges running bottom (Jan) to top (Dec), colored on the imprint_seq gradient from brand green (#009E73, Jan) through teal/blue to blue (Dec) -- confirms first series is the brand green. Ridge outlines are a soft dark stroke. A green annotation "Peak: Jul ≈ 25°C" sits near the July/August ridges with a diagonal green leader line pointing at the July peak; the leader line visibly crosses through the middle of the annotation text.
      Legibility verdict: PASS (one annotation legibility nit noted above, not a blocking failure -- title/axis/tick text is all clean).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title/subtitle now in light cream/grey, y/x axis titles and tick labels rendered in light tones, all clearly readable against the dark background -- no dark-on-dark failures observed. Ridge outline stroke switches to a light grey so it stays visible against the darker ridge fills.
      Data: Same 12 ridges, same green-to-blue gradient identical to the light render -- confirms data colors are unchanged between themes, only chrome flipped. Same "Peak: Jul ≈ 25°C" annotation with the same leader-line-through-text issue reproduced identically.
      Legibility verdict: PASS (same annotation nit as light render; all core text legible).
