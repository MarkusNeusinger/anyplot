review:
  strengths:
  - 'Correct use of the Imprint sequential gradient (imprint_seq: #009E73 -> #4467A3)
    keyed to a continuous month_idx, with January anchored exactly at the brand green
    #009E73 as required'
  - 'Genuine multi-layer plotnine grammar: geom_ribbon for the ridges, a separate
    geom_line for the top stroke, a geom_text layer from an independent peak_df with
    inherit_aes=False, and an annotate(''segment'') leader line -- showcases the library''s
    layered composition rather than a single geom call'
  - 'Clear data storytelling: the ''Peak: Jul ~ 25 C'' annotation with diagonal leader
    line gives the chart a focal point, and the chronological Jan-to-Dec ordering
    (bottom to top) is meaningful rather than arbitrary'
  - Theme-adaptive chrome is threaded correctly through both renders -- title, subtitle,
    axis text, and tick labels all use INK/INK_SOFT tokens and remain legible in both
    light and dark, with no dark-on-dark or light-on-light failures
  - Legend correctly omitted (legend_position='none') since the y-axis month labels
    already disambiguate the ridges, avoiding a redundant colorbar
  - 'Realistic, neutral synthetic data: monthly temperature means/stds plausible for
    a temperate Northern Hemisphere climate, reproducible via np.random.seed(42)'
  - Canvas at the correct 3200x1800 landscape target with no clipping of title, axis
    labels, or annotation in either render
  weaknesses:
  - 'Every one of the 12 ridges shows a spurious, near-flat horizontal line stretching
    across almost the full plot width at its baseline (y=0..11), visible in BOTH plot-light.png
    and plot-dark.png, using the same INK_SOFT stroke as the legitimate ridge-top
    line. Root cause: the `visible = density_scaled > 0.05 * ridge_scale` mask that
    trims each month''s KDE before building ridge_df is not guaranteed contiguous
    -- gaussian_kde''s tail estimate can ripple back above/below a lenient 5%-of-peak
    threshold far from the mode, especially for the wider-std months. geom_line(aes(y=''ymax''))
    then simply connects every remaining row in x-order for that group, including
    far-apart low-density points, drawing a near-flat stroke that bridges the gap
    and reads as an unintended full-width baseline/grid line competing directly with
    the data (violates the style guide''s ''grid that never competes with data'' rule).
    Fix: after computing `visible`, keep only the single contiguous run of True values
    that contains the density argmax per month (e.g. via scipy.ndimage.label and selecting
    the region containing the peak index, or a manual left/right walk from the peak
    until density first drops below threshold) instead of every point above the threshold
    anywhere in the range.'
  - The same artifact is more visually prominent in the dark render (light-gray stroke
    against near-black background) than in the light render, making the clutter worse
    on dark theme specifically -- worth re-checking after the mask fix that no residual
    stray segments remain in dark mode.
  - 'DQ-01: a small colorbar or a one-line caption clarifying that ridge color encodes
    month/season (in addition to the y-axis) would round out feature coverage, though
    not required since the y-axis already disambiguates.'
  - 'LM-02: the ridgeline itself is hand-built from geom_ribbon/geom_line rather than
    a dedicated ggridges-style geom (expected, since plotnine has no native ridgeline
    geom), but the implementation could lean further into plotnine-distinctive features
    (e.g. faceting or stat_density) to differentiate itself further from a generic
    stacked-area chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "ridgeline-basic . python . plotnine . anyplot.ai" at top-left, medium-weight gray subtitle "Monthly temperature distributions -- Northern Hemisphere temperate climate" beneath it. Y-axis lists months Jan (bottom) through Dec (top) in dark-gray text; x-axis "Temperature (C)" with ticks at -10, 0, 10, 20, 30, 40. Subtle vertical gridlines at the x-tick positions (low alpha). All title/axis/tick text is clearly readable against the light background -- no light-on-light issues.
      Data: 12 overlapping KDE ridges, one per month, filled with a green-to-blue gradient (Jan ~#009E73 brand green, progressing toward blue #4467A3 for Dec) via scale_fill_gradient keyed to month index -- consistent partial (~50-70%) vertical overlap creates the intended mountain-ridge look. A green "Peak: Jul ~ 25C" annotation with a diagonal leader line points to July's density peak near x=25. However, every ridge row also shows a thin, near-flat horizontal line running almost the full width of the plot at that row's baseline -- this is an unintended artifact (see weaknesses), not part of the visible density curve, and it visually crosses through neighboring ridges.
      Legibility verdict: PASS (all text legible), but data-clarity is reduced by the baseline-line artifact described above.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title/subtitle in light off-white and soft-gray tones, fully readable against the dark background. Y-axis month labels and x-axis tick labels are light-colored and legible; no dark-on-dark failures anywhere. Vertical gridlines are subtle and theme-correct.
      Data: Identical green-to-blue gradient and data shapes as the light render -- confirms the categorical/continuous data colors are unchanged between themes, only chrome flipped, as required. The "Peak: Jul ~ 25C" annotation and its leader line remain in the same brand green and are clearly visible against the dark surface. The same spurious near-full-width horizontal baseline line appears at every month row here too, and is if anything MORE visually prominent in this theme (light-gray stroke reads more strongly against the near-black background than the equivalent dark stroke does against the light background).
      Legibility verdict: PASS (all text legible), same baseline-line artifact concern as the light render, slightly worse contrast-wise.
