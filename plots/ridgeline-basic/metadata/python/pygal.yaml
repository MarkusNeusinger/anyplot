  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (verified by pixel sampling at (10,10) region equivalent).
      Chrome: Title "Monthly Temperature Distributions · ridgeline-basic · python · pygal · anyplot.ai" sits at the top with clear margin, dark ink text (#1A1A17), fully legible. Y-axis shows month labels Jan-Dec top to bottom in the same dark ink. X-axis shows "Temperature (°C)" with tick labels -10/0/10/20/30, dark ink, fully readable. A single vertical reference line at x=0 is present (pygal's default zero-line for XY charts).
      Data: 12 overlapping density "ridges", one per month, drawn as opaque filled polygons. Color flows from brand green (#009E73) for the coldest months (Jan/Dec, ~2-4°C) through teal to blue (#4467A3) for the warmest months (Jun/Jul, ~22-25°C) and back to green toward year-end — a continuous imprint_seq gradient keyed to each month's mean temperature. Ridges overlap roughly 60%, drawn back-to-front from Dec to Jan so the topmost (Jan) ridge is fully unoccluded.
      Legibility verdict: PASS — all text is clearly readable against the light background; no overlap between text elements or between text and data.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (pixel-verified).
      Chrome: Same title, month labels, and axis title/ticks, now in light ink (#F0EFE8), clearly legible against the dark background. No dark-on-dark text found anywhere — all chrome flipped correctly.
      Data: Identical green-to-blue gradient as the light render — pixel-sampled at matching coordinates confirms exact color equality (e.g. Jul ridge = (68,103,163) = #4467A3 in both renders), i.e. only chrome flipped, data colors held constant as required.
      Legibility verdict: PASS — all text readable against the dark background; no dark-on-dark or light-on-light failures observed.

    Additional pixel-level checks performed:
      - No data or text pixels touch the canvas border in either render (no AR-09 edge clipping).
      - 12 full-width horizontal lines were detected via pixel scan (spacing ~97-98px, present even in pure-background columns) — these are unintended artifacts of the opaque ridge polygons' flat bottom edges, not a deliberate grid (show_x_guides/show_y_guides are both False in the source). See weaknesses.
      - Each month's y-axis label is positioned ~73px above its own ridge's baseline line but only ~24px below the preceding month's baseline line, i.e. closer to the wrong line. See weaknesses.
