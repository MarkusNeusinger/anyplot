review:
  strengths:
  - Correct ridgeline construction via manual gaussian_kde density estimation with
    proper ~50% vertical overlap and back-to-front (December-to-January) layering
    so nearer ridges correctly occlude farther ones
  - Y-axis tick positions are precisely aligned to each ridge's baseline instead of
    relying on a legend, giving a clean month-to-ridge mapping
  - 'Theme-adaptive chrome (background, ink, grid, line-edge colors) is correctly
    threaded through PAGE_BG/INK/INK_SOFT/GRID tokens in both renders; backgrounds
    match #FAF8F1 (light) and #1A1A17 (dark) exactly'
  - Correct canvas dimensions (3200x1800), correctly formatted mandated title, and
    reproducible output via np.random.seed(42)
  - hovertemplate adds genuine interactive value (per-month temperature readout) without
    faking anything in the static PNG
  weaknesses:
  - Each of the 12 ridge traces draws its flat baseline across the FULL plot width
    (fill="toself" closing back through x_range[0]/x_range[-1]), producing 12 full-width
    horizontal lines that cut across neighboring ridges' fills and add visual clutter;
    consider making the baseline segment invisible (e.g. a separate non-outlined fill
    trace plus a visible line only over the density curve) so only the curve outline
    is drawn.
  - Title occupies only ~35-40% of the plot width at fontsize 16 -- there is headroom
    to increase to ~18-19pt for stronger top-of-page hierarchy without risking overflow
    on this canvas.
  - The green-to-blue gradient encodes month order (January=green, December=blue)
    rather than temperature magnitude, so the warmest months (June-August) do not
    read as visually 'hot' -- valid as an ordinal-sequence choice per the spec's gradient
    allowance, but a temperature-mapped gradient would reinforce the seasonal story
    more intuitively.
  - 'The gradient only ever samples the two Imprint anchor colors (#009E73 -> #4467A3)
    rather than using the full canonical 8-color categorical palette -- acceptable
    given the spec''s ''color gradients... to differentiate ridges'' guidance, but
    worth confirming this reads as intentional rather than a missed categorical-palette
    case.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "ridgeline-basic · python · plotly · anyplot.ai" centered at top in dark ink text, clearly readable. X-axis title "Temperature (°C)" and tick labels (-10 to 40) in soft dark grey, fully legible. Y-axis shows 12 month labels (January at the bottom rising to December at the top), each aligned to its ridge's baseline, in soft dark grey and clearly readable. Subtle vertical gridlines visible without dominating.
      Data: 12 overlapping density ridges in a green-to-blue gradient -- January is Imprint brand green (#009E73), progressing through teal/blue tones toward December (~#4467A3). Ridges shift right and widen through the warmer months (June-August) and narrow back left through winter, correctly telling the seasonal-temperature story. Thin dark edge lines outline each ridge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title now rendered in light/white text, clearly visible against the dark background. Axis title, tick labels, and month labels are in light grey and fully legible -- no dark-on-dark issues observed anywhere (title, axis, or tick text). Gridlines are subtle light grey, visible but unobtrusive.
      Data: Ridge fill and edge colors are pixel-identical to the light render (same green-to-blue gradient, same per-month assignment), confirming only chrome (background/text/grid) flipped between themes as required.
      Legibility verdict: PASS
