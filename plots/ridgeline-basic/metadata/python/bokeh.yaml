review:
  strengths:
  - Excellent custom imprint_seq sequential colormap (brand green -> blue) mapped
    to mean monthly temperature, with an explicit ColorBar that makes the color encoding
    legible instead of purely decorative
  - Real Gaussian KDE computed manually with Silverman's bandwidth rule rather than
    a canned shortcut, keeping the implementation self-contained and mathematically
    transparent
  - 'Both themes are fully readable: explicit min_border_* reservations and theme-adaptive
    INK/INK_SOFT tokens threaded through title, axes, grid, and ColorBar'
  - 'Idiomatic, distinctive Bokeh usage: HoverTool tooltips (month + mean temp) and
    a categorical FactorRange y-axis with float offsets driving the ridge-stacking
    technique'
  - x_range is tied to the actual data support (with a small margin) instead of an
    arbitrary wide range, avoiding wasted canvas on both sides
  weaknesses:
  - 'Title omits the mandated {language} token: reads ''ridgeline-basic · bokeh ·
    anyplot.ai'' instead of ''ridgeline-basic · python · bokeh · anyplot.ai'''
  - Adjacent high-temperature months (Jun/Jul/Aug) render in very similar blue shades
    from the imprint_seq gradient, making them harder to tell apart by color alone
    -- the y-axis label and outline stroke are doing most of the disambiguation work
  - Each ridge's zero-baseline draws a full-width horizontal stroke across the entire
    canvas, even under regions with no density, creating faint grid-like clutter that
    competes visually with the ridges themselves
  - X-axis keeps visible major tick marks while y-axis ticks were removed -- inconsistent
    minimalism; the style guide's decoration-removal checklist recommends dropping
    tick marks (keep labels) where possible
  - All 12 monthly distributions share the same spread (std=3, only the mean shifts)
    -- varying spread/skew across a few months would better showcase the ridgeline's
    ability to reveal shape differences, not just mean shifts
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "ridgeline-basic · bokeh · anyplot.ai" top-left; italic "Month" y-axis label and "Temperature (°C)" x-axis label in dark ink; Jan-Dec category tick labels on the y-axis and numeric 0/10/20/30 ticks on the x-axis in softer dark gray; a vertical ColorBar on the right labeled "Mean °C" with ticks 5/10/15/20/25. All chrome elements are clearly visible against the light background.
      Data: 12 partially overlapping density ridges (Jan at top, Dec at bottom), each filled with a color from a custom green-to-blue sequential gradient keyed to that month's mean temperature (cold months green near #009E73, hot months blue near #4467A3), each ridge outlined with a thin dark stroke. Ridges show ~65-70% vertical overlap, consistent with a mountain-ridge silhouette.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black, not light.
      Chrome: Title and axis labels render in light/white ink; tick labels in a softer light gray; ColorBar title and ticks also light-colored and fully legible. No dark-on-dark or light-on-light failures spotted anywhere.
      Data: Same 12 ridges, same green-to-blue gradient — colors are pixel-for-pixel consistent with the light render (confirmed by comparing Jan's green and Aug's blue in both images); only the chrome (background, text, grid, stroke color implied by INK/INK_SOFT tokens) flips to the dark theme.
      Legibility verdict: PASS
