review:
  strengths:
  - 'Idiomatic Altair technique: transform_density (declarative KDE) combined with
    alt.Row faceting and negative configure_facet(spacing=-13) is the canonical, distinctive
    way to build a ridgeline plot in this library — hard to replicate this concisely
    in another library'
  - 'Imprint sequential gradient (#009E73 → #4467A3) correctly applied across the
    12 chronologically-ordered ridges, with the first ridge (Jan) exactly #009E73
    as required'
  - Canvas gate passes exactly at 3200×1800; verified all four edges (title, tick
    labels, month row labels, x-axis title) render with generous margins and zero
    clipping
  - Theme-adaptive chrome (INK / INK_SOFT / PAGE_BG tokens) is threaded through axis,
    row-header, title, and view configuration consistently — both light and dark renders
    are fully legible with no dark-on-dark or light-on-light failures
  - Realistic monthly temperature data with per-month variation in both mean (2–25°C)
    and spread (std 3–5), giving each ridge a distinct silhouette rather than uniform
    copies
  weaknesses:
  - Ridge overlap is roughly 46% (spacing=-13 vs row height=28), slightly below the
    spec's 'typically 50-70%' guidance — tightening spacing further (e.g. -16 to -18)
    would give a more classic joy-plot silhouette where peaks visibly poke into the
    row above
  - The green-to-blue color gradient is decorative/redundant with row order (no legend
    or caption ties it to a meaning) — a one-line note or subtle color-mapped tick
    could reinforce that it encodes month progression
  - Design stays fairly minimal/flat overall; a small refinement like a subtle alternating
    row background or a mean-value tick per ridge would push Aesthetic Sophistication
    further above 'strong design' toward 'publication-ready'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target — not pure white.
      Chrome: Title "Monthly Temperature Distribution · ridgeline-basic · altair · anyplot.ai" in bold dark ink, centered, fully visible with margin above and below. Twelve row labels (Jan-Dec) in medium-gray ink, right-aligned to the left of each ridge, all legible. X-axis "Temperature (°C)" title and tick labels (-15 to 40) in dark/soft-dark ink at the bottom, fully visible with generous margin to the canvas edge (verified via edge crops — no clipping on any side).
      Data: 12 stacked, partially-overlapping density curves (KDE via transform_density), one per month, ordered chronologically top-to-bottom. Fill color runs as a smooth Imprint-sequential gradient from brand green #009E73 (Jan) to blue #4467A3 (Dec), each ridge outlined with a thin soft-ink stroke for definition. Ridge shapes vary sensibly with the seasonal cycle (coldest/left-shifted in Jan/Dec, warmest/right-shifted in Jul/Aug).
      Legibility verdict: PASS — all text reads clearly against the light background, no overlaps, no edge clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target — not pure black.
      Chrome: Same title and axis text, now rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary) — clearly legible against the dark surface, no dark-on-dark failures anywhere (title, row labels, tick labels, and axis title all confirmed readable).
      Data: Identical 12-ridge gradient from #009E73 to #4467A3 — data colors are pixel-identical to the light render; only the chrome (background, text, baseline strokes) flipped for the dark theme, as required.
      Legibility verdict: PASS — all text and data elements are clearly readable against the dark background, no dark-on-dark or light-on-light issues detected.
