review:
  strengths:
  - 'Idiomatic use of seaborn''s official FacetGrid ridgeline recipe: negative hspace
    overlap plus a dual-layer kdeplot (filled density + elevated-bg outline stroke)
    that keeps overlapping ridges visually separated in both themes.'
  - 'Semantically meaningful color gradient (Imprint green -> blue) mapped to the
    ordinal task-complexity ordering, with the first series exactly #009E73 per brand
    rule.'
  - 'Clean, refined chrome: spines and y-ticks removed, subtle baseline hairlines,
    generous whitespace, and theme tokens (PAGE_BG/INK/INK_SOFT) threaded consistently
    through both renders.'
  - Realistic, appropriately scaled synthetic data (gamma-distributed, right-skewed
    reaction times, 281ms -> 950ms mean progression matching real UI-interaction complexity).
  - Per-ridge mu annotations add quantitative grounding without cluttering the chart.
  weaknesses:
  - 'PIPELINE ISSUE (not an implementation defect): the plot_images/plot-light.png
    and plot-dark.png supplied for this review were stale — rendered from a revision
    that predates the ''fix(seaborn): address review feedback'' commit (3a2cd1b) already
    on this branch, so the title read ''ridgeline-basic · seaborn · anyplot.ai'' (missing
    the language segment). Re-running plots/ridgeline-basic/implementations/python/seaborn.py
    directly at the exact reviewed commit (both ANYPLOT_THEME=light and =dark) confirms
    the current source already renders the correct title ''ridgeline-basic · python
    · seaborn · anyplot.ai'' in both themes. This review is scored against the freshly-regenerated,
    correct images. Flagging so the workflow can be checked for artifact-caching/staleness
    between the repair commit and the image-capture step.'
  - The label() helper mapped via g.map() is required by seaborn's canonical FacetGrid
    ridgeline idiom for per-facet text placement, so it's justified here, but it is
    technically a function definition and a strict CQ-01 (KISS, no functions/classes)
    read dings it slightly.
  - 'The per-group hue uses a sampled LinearSegmentedColormap (imprint_seq) rather
    than the discrete IMPRINT_PALETTE list; this is a defensible, spec-encouraged
    choice for these 9 ordinally-ordered groups (first swatch lands exactly on #009E73)
    but is worth a second look in future audits of the categorical-palette rule.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec target.
      Chrome: Title "ridgeline-basic · python · seaborn · anyplot.ai" in bold dark ink at top, comfortable gap above the tallest ridge. Nine group labels ("Single Tap" through "Multi-Step Form") run down the left margin in a green-to-blue gradient matching each ridge's fill color, each paired with a smaller "μ ≈ X ms" annotation in soft ink. X-axis "Reaction Time (ms)" label and numeric ticks (0-2500) at the bottom, dark-on-light and clearly legible. No y-axis ticks/label (by design — group identity is carried by the row labels).
      Data: Nine overlapping filled density curves (gamma-distributed reaction times) stacked with ~50-60% vertical overlap, each with a white/elevated-bg outline stroke that keeps adjacent ridges visually distinct even where they cross. First (topmost, "Single Tap") ridge is #009E73 Imprint green; colors shift smoothly toward Imprint blue (#4467A3) for "Multi-Step Form," tracking the rising task-complexity order. A thin dark baseline runs under each ridge.
      Legibility verdict: PASS — all text (title, group labels, mu annotations, axis label, tick labels) is clearly readable against the light background; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec target.
      Chrome: Same title text now in light ink, same gradient-colored group labels (still readable — the green/teal/blue swatches hold contrast against the dark surface), mu annotations in light soft-ink gray. X-axis label and tick labels rendered in light gray, clearly visible. Baselines and outline strokes switch to the dark elevated-bg tone so ridge separation still reads correctly.
      Data: Identical curve shapes, identical per-group colors to the light render (verified by eye — same green-to-blue progression, same relative densities and modes) — only the chrome (background, ink, outline color) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; every title/label/tick/annotation is clearly visible against the near-black background.

