review:
  strengths:
  - Idiomatic seaborn FacetGrid + kdeplot ridgeline construction (the canonical library
    recipe), executed cleanly with a second outline-stroke kdeplot pass for row separation
  - 'Ordinal task complexity encoded via imprint_seq (brand green → blue) applied
    thoughtfully across 9 ordered task categories — sidesteps the 8-slot Imprint categorical
    limit while keeping the first series exactly #009E73'
  - Row overlap (hspace=-0.5, ~50%) matches the spec's ‘typically 50-70% overlap’
    guidance precisely
  - Y-axis shows group labels instead of numeric values, ordered meaningfully by rising
    task complexity / mean reaction time, exactly as the spec requests
  - Per-ridge μ ≈ X ms annotations add quantitative detail directly on the chart,
    reinforcing the visual story
  - Theme-correct chrome in both renders; canvas is exactly 3200×1800 (figsize=(8,4.5)
    @ dpi=400), no bbox_inches='tight' drift
  - Realistic, neutral UX-research dataset (UI task reaction times) with plausible
    right-skewed (gamma) shapes and sensible 280–950ms scale
  weaknesses:
  - 'Title is "ridgeline-basic · seaborn · anyplot.ai" — missing the mandated {language}
    segment. Fix: g.figure.suptitle("ridgeline-basic · python · seaborn · anyplot.ai",
    ...) per the required {spec-id} · {language} · {library} · anyplot.ai format.'
  - μ ≈ X ms annotations are set at fontsize=8, already at the style-guide tick-label
    floor — at ~400px mobile width this text shrinks close to illegible; consider
    bumping to 9-10pt or shortening the string.
  - label() is a module-level helper function required by FacetGrid.map(); acceptable
    given the library idiom (matches seaborn's own gallery pattern) but technically
    deviates from the pure Imports→Data→Plot→Save KISS structure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Bold dark title "ridgeline-basic · seaborn · anyplot.ai" at top, clearly visible. Nine bold task labels (Single Tap ... Multi-Step Form) down the left side in colors matching each ridge, with smaller gray "μ ≈ X ms" annotations beneath each. X-axis "Reaction Time (ms)" with tick labels 0-2500, dark and legible. All text renders in dark ink against the light surface.
      Data: Nine stacked, partially overlapping (~50%) KDE density ridges colored on a green-to-blue gradient (imprint_seq), first (top) ridge exactly brand green #009E73. Each ridge has a white/cream outline stroke separating it from the ridge behind it, plus a dark horizontal baseline. Distributions are right-skewed and widen/shift right as task complexity increases (Single Tap fastest/tightest -> Multi-Step Form slowest/most spread).
      Legibility verdict: PASS - all text readable; μ-annotation text is small (fontsize=8) but still legible at full resolution.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Title and all task labels/tick labels flip to light-colored text (INK / INK_SOFT tokens), clearly readable against the dark surface. No dark-on-dark text observed anywhere - tick labels, axis label, task labels, and μ annotations are all light enough to read.
      Data: Same green-to-blue gradient ridges as the light render, identical hues confirmed (only chrome flipped). Outline strokes now use the dark ELEVATED_BG (#242420) tone for separation, still effective.
      Legibility verdict: PASS - no dark-on-dark failures; all text and data elements clearly distinguishable from the background.
