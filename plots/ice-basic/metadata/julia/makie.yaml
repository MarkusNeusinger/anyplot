    of the plot width, well under the 50-70% guideline for a short mandated title
    — increase titlesize modestly (e.g. to 24-26) to give it more visual presence
    relative to the 3200px canvas.
  - With 80 overlapping semi-transparent lines plus the IQR band, the responder mass
    in the lower/middle region reads as a dense solid haze where individual curves
    are hard to trace — acceptable for an ICE plot's intent but slightly reduces per-line
    Element Visibility; consider dropping line alpha slightly further (e.g. 0.12)
    or thinning linewidth marginally to let the band show through more.
  - Non-responder color uses IMPRINT_PALETTE[3] (#4467A3, blue) rather than the canonical
    second slot IMPRINT_PALETTE[2] (#C475FD, lavender) — the code comments the choice
    as an intentional CVD-safe contrast decision, which is reasonable, but it is a
    minor deviation from strict canonical palette ordering worth noting for consistency
    across the catalog.
