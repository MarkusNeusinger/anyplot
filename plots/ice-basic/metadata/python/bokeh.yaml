review:
  strengths:
  - 'Idiomatic bokeh usage: ColumnDataSource + a single multi_line() call batch-renders
    all 80 ICE curves instead of looping p.line() calls per observation.'
  - Canvas is exactly 3200x1800 in both renders, toolbar disabled, and min_border
    reservations prevent any clipping of the 50pt title / 42pt axis labels / 34pt
    ticks.
  - Theme-adaptive chrome is correctly threaded through title, axis labels, ticks,
    grid, legend, and outline in both themes; Imprint brand green (#009E73) for the
    ICE lines is pixel-identical between light and dark.
  - The PDP average line correctly uses the style guide's 'neutral' semantic-anchor
    token (ink-colored, same hex as text/gridlines) rather than an arbitrary custom
    hex, so it intentionally flips black-on-light / white-on-dark as a structural
    reference line rather than a categorical series.
  - Rug plot along the x-axis (an optional spec suggestion) is implemented cleanly
    via a single vectorized segment() call and adds real distributional context without
    competing with the ICE/PDP lines.
  - Realistic synthetic data with a genuine square-footage x house-age interaction
    baked into the price generator, so the ICE curves show real heterogeneity (fan-out
    at higher square footage) rather than parallel identical lines.
  - 'Density-appropriate styling: alpha=0.25 for 80 overlapping individual lines plus
    a bold width=5 PDP overlay creates a clear focal point, matching exactly what
    an ICE plot needs to communicate (individual variability vs. average trend).'
  weaknesses:
  - 'LM-02: No HoverTool or other bokeh-native interactivity is added — the plot.html
    output is functionally static (only pan/zoom removed via toolbar_location=None).
    Adding a HoverTool showing observation_id/feature_value/prediction on the ICE
    lines would showcase bokeh''s distinctive interactive strength in the HTML detail
    view without affecting the PNG.'
  - Spec's suggested centered-ICE (c-ICE) variant and color-coding lines by a second
    feature are both skipped (both optional 'consider' notes) — either would add another
    dimension of insight the spec explicitly calls valuable for comparing effect shapes
    across observations.
  - Legend swatch for 'Average effect (PDP)' is a thin dash that doesn't visually
    echo the bold 5px line width actually used for that series in the plot area —
    a slightly thicker legend line would make the key more representative at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold black title "ice-basic · python · bokeh · anyplot.ai" top-left, fully visible with no clipping. Italic axis labels "Square Footage" (x) and "Predicted Price ($k)" (y) in dark ink, clearly readable. Tick labels in a softer dark gray, legible at both axes. A subtle horizontal-only grid (y-axis grid at low alpha, x-grid hidden) is visible without dominating. Legend box top-left ("Individual houses (ICE)", "Average effect (PDP)") has a light elevated background and dark text, fully readable, and does not overlap any data (data in that x/y region sits well below the legend box).
      Data: ICE lines rendered in translucent brand green (#009E73, alpha 0.25), showing density/overlap of 80 individual house curves. The PDP average line is bold and near-black (ink-colored, matching the style guide's neutral/reference-line token), standing out clearly as the focal point. A rug plot of thin gray vertical ticks runs along the bottom, showing the distribution of observed square-footage values.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels all render in light/white tones and are clearly visible against the dark background — no dark-on-dark failures. Grid and outline remain subtle. Legend box has a dark elevated background with light text, fully readable, positioned identically to the light render with no overlap.
      Data: ICE lines are the same translucent brand green (#009E73) as in the light render — confirmed pixel-identical hue, only chrome (background/text/grid/legend) has flipped. The PDP average line is now bold near-white (again the theme-adaptive neutral/reference-line token), maintaining the same strong focal-point contrast against the dark surface. Rug plot ticks are a lighter gray, still visible but appropriately subtle.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark issues detected.
