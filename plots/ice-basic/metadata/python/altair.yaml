review:
  strengths:
  - 'Correct Imprint palette compliance: ICE curves use brand #009E73, PDP overlay
    uses the canonical second series color #C475FD, and both renders use the correct
    theme-adaptive backgrounds (#FAF8F1 light / #1A1A17 dark) with identical data
    colors.'
  - 'Real interactivity, not faked: alt.selection_point(on=''pointerover'') drives
    the opacity condition so hovering a curve highlights it in the HTML export, while
    the default (unselected) branch matches the static PNG state exactly.'
  - Rug plot along the x-axis showing the observed square-footage distribution, directly
    implementing one of the spec's suggested enhancements.
  - 'Clear visual hierarchy: thin, low-alpha (0.10) ICE lines form a density band
    while the bold, opaque PDP line plus a matching text annotation reinforce the
    average-effect message.'
  - Canvas lands exactly on 3200x1800 via the mandated pad-only approach with no clipped
    text on either render.
  - Reproducible (np.random.seed(42), random_state=42) and a clean single-script structure
    with no wrapper functions.
  weaknesses:
  - Centered ICE (c-ICE) variant suggested in the spec notes was not implemented —
    shifting all lines to start at zero would make the heterogeneity in effect *shape*
    (vs. baseline level) easier to compare.
  - No second-feature color-coding of the individual curves, so potential interaction
    effects (e.g. curves that respond differently by bedroom count) stay hidden inside
    the uniform green band.
  - 'Design stops short of exceptional: axis domain lines remain visible rather than
    stripped to a fully minimal-chrome look, and the annotation duplicates the legend''s
    ''Partial Dependence'' label without adding further insight (e.g. calling out
    a specific divergent observation).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "ice-basic · altair · anyplot.ai" centered above the plot; dark bold axis titles "Square Footage (sq ft)" and "Predicted Price ($K)"; medium-gray tick labels on both axes; subtle light-gray gridlines at 10% opacity; white legend box (top-right) with "ICE Curves" / "Partial Dependence" entries; all elements clearly visible against the light background.
      Data: ~100 individual ICE curves in translucent brand green (#009E73) forming a density band that widens with square footage; a bold, fully opaque purple (#C475FD) Partial Dependence line running through the middle of the band; a matching purple "Partial Dependence" text annotation floating in open space mid-chart; a gray rug plot along the x-axis marking observed square-footage values. First series is the brand green as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis titles render in light/white text, clearly legible; tick labels in light gray; gridlines subtle but visible on the dark surface; legend box uses a dark elevated fill with a light border and light text — no dark-on-dark failures anywhere.
      Data: Same brand green ICE band and purple PDP line/annotation as the light render — data colors are identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS
