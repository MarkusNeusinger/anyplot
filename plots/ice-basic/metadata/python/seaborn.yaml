      Data: ICE lines retain the identical green-to-blue gradient and the PDP line the identical purple (#C475FD) as the light render — confirming only chrome flipped, data colors unchanged. The annotation text and arrow are rendered in light ink/grey, fully legible against the dark background. Rug tick marks are light grey and clearly visible against the dark background.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or light-on-light failures detected in either render, and no edge clipping on any element.
