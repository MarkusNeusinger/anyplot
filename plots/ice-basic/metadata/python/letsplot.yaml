review:
  strengths:
  - Quantified annotation ("Urban premium ≈ $53K at max size") turns the color-coded
    divergence into a legible insight instead of leaving the viewer to infer it
  - PDP overlay correctly uses the theme-adaptive INK/neutral token rather than a
    fixed color, so the baseline reference line reads as chart structure in both themes
  - Individual ICE lines use low alpha (0.15) plus thin size (0.8) to create a density
    band while the 100-line count stays fully within the spec's 50-200 observation
    range
  - Color-coding by neighborhood (a second feature) directly implements the spec's
    optional interaction-effect guidance and is exactly why the Urban/Suburban divergence
    is visible
  - 'First categorical series is #009E73 (Suburban), second is Imprint position 2
    (#C475FD, Urban) — fully compliant categorical order'
  - layer_tooltips customizes the PDP line's hover content (Sqft / Avg. Price) while
    individual lines are set to tooltips="none" to avoid tooltip clutter across 100
    overlapping lines — a thoughtful lets-plot-specific interactivity choice
  - Explicit font sizes throughout (axis_title=12, axis_text=10, plot_title=16, legend
    text/title=10) with the geom_text annotation size correctly scaled to match (3.5mm
    ≈ 10pt)
  weaknesses:
  - Optional spec suggestions (centered c-ICE variant, rug plot along the x-axis for
    observed feature-value distribution) were not implemented — would have added further
    depth but are explicitly optional in the spec
  - Legend keeps a full box frame (fill + INK_SOFT border) rather than the minimal-chrome
    borderless legend the style guide's decoration-removal checklist favors — a small
    refinement opportunity, not a defect
  - layer_tooltips is only distinctive to lets-plot at a moderate level (other interactive
    libraries offer comparable per-series tooltip customization via different APIs),
    capping Library Mastery below a full score
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "ice-basic · python · letsplot · anyplot.ai" in dark ink at top-left, clearly readable. Axis titles "Square Footage (sq ft)" (x) and "Predicted Price ($K)" (y) in dark ink, tick labels in a softer gray — both readable. Y-axis-only horizontal gridlines are subtle light gray, not competing with data. Legend "Location" with Suburban/Urban swatches sits near the top-right of the plot inside a lightly bordered box.
      Data: ~100 individual ICE lines fan out from ~$150K to ~$650K as square footage grows from 800 to 3500 sq ft, colored green (Suburban, #009E73) below and lavender-purple (Urban, #C475FD) above, each at low alpha so overlapping lines form a soft density band. A bold black PDP line runs through the middle showing the average prediction. A dashed leader line and text callout ("Urban premium ≈ $53K at max size") sit in open space above the bands, pointing at the gap between the two location bands at the right edge — no overlap with the dense line region.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, legend, annotation) is clearly dark-on-light and readable at full size.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light ink (cream/light-gray) and remain fully readable against the dark background. Gridlines are a subtle dark-on-dark tone, still faintly visible. Legend box background and border flipped to the dark elevated-surface tokens with light text.
      Data: Same ICE-line fan and PDP structure as the light render. The Suburban/Urban data colors (#009E73 green, #C475FD lavender) are pixel-identical to the light render — only the chrome flipped. The PDP line, which uses the theme-adaptive INK token, correctly switched from black (light theme) to near-white (dark theme) so it still reads as a bold reference line against the dark surface. The annotation text and dashed leader line switched to a light gray tone and remain legible in the same position as the light render.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and the PDP reference line remain clearly visible against the near-black background.
