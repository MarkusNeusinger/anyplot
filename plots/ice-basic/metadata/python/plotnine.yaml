      Data: Identical colors to the light render — brand green (#009E73) for individual ICE curves and lavender (#C475FD) for the PDP overlay — confirming the categorical data palette is theme-invariant; only chrome (background, text, grid) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures found; all title/axis/tick/annotation text is clearly legible against the near-black background, and the "model split" and "PDP (avg effect)" annotations remain fully readable.
