review:
  strengths:
  - 'Correct ICE plot semantics: one translucent line per observation (alpha 0.18)
    plus a bold, opaque PDP overlay showing the average effect — exactly the ''individual
    detail behind the average'' distinction the spec calls for'
  - Deterministic in-memory data generation via a fixed-seed LCG, with a physically
    plausible per-house saturation model (quality-driven decay) that produces genuinely
    heterogeneous curve shapes rather than parallel copies
  - 'Theme-adaptive chrome correctly threaded through title, legend, ticks, axis titles
    and gridlines via window.ANYPLOT_TOKENS; first data series is the mandated #009E73
    and is identical between light and dark renders'
  - Canvas gate passes (3200x1800 landscape), no clipping/overflow on either render,
    legend duplicate labels correctly suppressed via the filter callback
  - Y-axis uses a clean $Xk currency callback; both axis titles are descriptive with
    units implied
  weaknesses:
  - 'None of the three optional-but-suggested enhancements from the spec notes were
    implemented: a centered ICE (c-ICE) variant, a rug plot of observed feature values
    along the x-axis, or color-coding lines by a second feature to reveal interaction
    effects — the last one is directly relevant since the spec''s ''Applications''
    section calls out detecting subgroup/interaction effects, and this implementation
    already has a natural second feature (house quality) that could have driven line
    color'
  - X-axis uses a category scale fed by a `labels` array of raw grid values instead
    of a linear scale with {x, y} point data; this produces non-round, slightly awkward
    tick labels (800, 1180, 1559, 1939, 2319, 2698, 3078, 3458) instead of clean round
    numbers a linear scale would auto-generate
  - Styling is fairly close to defaults beyond the alpha hierarchy — no custom typography,
    spacing, or additional refinement distinguishing it as highly polished beyond
    the theme tokens
  - Library usage is competent but not distinctive — a 70-line-plus-1 line chart doesn't
    showcase any Chart.js-specific capability (e.g. scriptable per-point styling,
    custom tooltip callbacks, gradient fills) beyond the legend filter trick
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white, not dark.
      Chrome: Title "ice-basic · javascript · chartjs · anyplot.ai" in dark ink, centered top, fully legible. Legend below title with two entries ("Individual houses (ICE)" with a faint pale-green swatch, "Average effect (PDP)" with a bold dark swatch) — both labels clearly readable. X-axis title "Square Footage" and Y-axis title "Predicted Sale Price" in dark ink, both legible. Tick labels (x: 800-3458; y: $100k-$550k) in medium-gray ink, clearly visible against the light background. Grid lines are light gray, subtle but visible.
      Data: ~70 translucent green (#009E73 at low alpha) individual ICE curves fanning from a tight cluster near ($800, $170k) out to a wide spread near ($3600, $440k-$510k), overlaid by one bold black PDP curve tracing the average trend through the middle of the bundle. Data clearly distinguishable from background and from each other via the alpha blending.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black, not light.
      Chrome: Title and legend text rendered in light/white ink, clearly legible against the dark background. Legend swatches flip appropriately (ICE swatch reads as a darker teal-on-dark box, PDP swatch as a light outlined box). Axis titles and tick labels are light gray/white, clearly readable against the dark background — no dark-on-dark failures observed. Grid lines are a subtle dark gray, visible without dominating.
      Data: Same ~70 individual curves in the same green hue (#009E73, low alpha) as the light render — confirmed the data color is unchanged, only the chrome (background, text, grid, legend frame) flipped. The bold PDP overlay flips to white/light ink for contrast against the dark plot background, tracing the same average trend shape as in the light render.
      Legibility verdict: PASS — all text is clearly legible with light-on-dark contrast; brand green data lines remain visible and consistent with the light render.
