review:
  strengths:
  - One MUI X line series per house (70 × 55 grid values) at 30 % alpha baked into
    the series colour, so dense stretches read darker and the legend swatches match
    the lines
  - 'The partial dependence line is computed from the curves themselves (mean at each
    grid value), drawn last at 4 px in the ink token, and stands out from every ICE
    line in both themes: near-black on cream, near-white on dark'
  - 'The optional colour by a second feature is used well: the pre-1960 houses flatten
    and turn down at large floor areas while newer houses keep rising, so the heterogeneity
    ICE exists to show is visible at a glance'
  - 'Axis bands sized explicitly (x height 64, y width 84), a tight linear x domain
    at the grid ends, k-formatted price ticks and thousands-separated square footage:
    no truncated tick labels'
  - 'Native MUI X idioms: data-series CSS selectors for the PDP stroke, labelMarkType
    line legend marks, item tooltips in the HTML output, skipAnimation'
  weaknesses:
  - 'VQ-07 (both): ''Year built'' is an ordered age band (Before 1960 < 1960 or later)
    but takes the categorical positions 1 and 2 (#009E73 green, #C475FD lavender),
    which present it as unordered groups → two ordered steps of one Imprint ramp (imprint_seq,
    older → newer). Likely cause: color `t.palette[segments.indexOf(c.segment)]` instead
    of steps between t.seq[0] and t.seq[1].'
  - 'VQ-03 (dark): the ''Before 1960'' legend swatch, brand green at the 30 % series
    alpha (#009E734D), is barely visible against #1A1A17, and the green ICE lines
    are faint against it → a legend glyph at full opacity, or a higher line alpha
    (about 45 %, +15 points) on the dark render. Likely cause: ICE_ALPHA_HEX = "4D"
    baked into the series colour that the legend mark reuses.'
  - 'Suggestion: a rug of observed square-footage values along the x axis, which the
    Notes allow, would show where the grid is backed by data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no pure white.
      Chrome: title "House Price Predictions · ice-basic · javascript · muix · anyplot.ai" bold dark ink centred (~43 % of width), soft-ink subtitle "70 ICE curves × 55 grid values · coloured by year built · bold line: partial dependence"; top-right horizontal legend (Year built: Before 1960 / Year built: 1960 or later / Partial dependence (mean of all curves)); y axis "Predicted Price (USD)" 150k–800k, x axis "Square Footage (sq ft)" 1,000–3,800; subtle horizontal grid only. All text readable.
      Data: 70 translucent ICE lines — brand green #009E73 for pre-1960 houses (flattening/bending down past ~2,800 sq ft), lavender #C475FD for newer houses (steadily rising to 450k–780k); overlap blends darker; a bold near-black partial dependence line runs from ~208k to ~558k on top of them.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, no pure black.
      Chrome: title, subtitle, legend text, axis titles and ticks all flip to light ink; grid lines subtle grey. No dark-on-dark text.
      Data: identical green and lavender line colours and alpha as the light render; the partial dependence line flips to near-white ink and stands out clearly. The green pre-1960 lines and especially their 30 %-alpha legend swatch are faint against the dark page.
      Legibility verdict: PASS (text); legend swatch for "Before 1960" weak
