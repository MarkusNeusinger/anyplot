review:
  strengths:
  - 'Correctly implements the core ICE-plot contract: 70 low-alpha individual prediction
    curves (within the spec''s 50-200 observation range) overlaid with a bold, opaque
    PDP average line rendered via the theme-adaptive `neutral`/ink token, matching
    the style guide''s sanctioned semantic use for reference/baseline lines.'
  - 'Deterministic, seeded (mulberry32(42)) synthetic data encodes a genuine feature
    interaction: a ~25% ''luxury'' subgroup with distinct curvature produces a real
    fan-out divergence at high square footage, giving the plot actual interpretability
    value instead of near-identical parallel lines.'
  - 'Handles a known MUI X layout gotcha cleanly: the rotated y-axis label is rendered
    in a dedicated column instead of relying on MUI X''s fixed-offset native label,
    which the code comments correctly identify as colliding with wide ''$800k''-style
    tick labels.'
  - 'Both renders are pixel-verified at exactly 3200x1800 with theme-correct backgrounds
    (#FAF8F1 / #1A1A17), zero edge clipping on any side, and an identical data-series
    hue between light and dark — only chrome adapts.'
  - Title, legend, and axis labels follow the mandated format and are unit-labeled
    ('Square Footage (sq ft)', 'Predicted Price ($)').
  weaknesses:
  - Title occupies only ~39% of the plot width (measured via pixel scan), well below
    the ~70-85% expected for a title of this length (68 chars, mandated format + descriptive
    prefix). TITLE_FONT_SIZE = round(22 * min(1, 67/TITLE.length)) barely scales down
    at length 68 vs the hardcoded 67 reference, but the actual MUI X render is much
    narrower than the generic formula assumes — increase the title fontsize (try ~30-34px)
    so it reads with proper visual presence rather than looking undersized relative
    to the 3200px canvas.
  - 'Design Excellence is only moderately above library defaults: a single accent
    hue (green fan + ink PDP line) with no additional typographic hierarchy or annotation.
    Consider a subtle callout/annotation near the divergent ''luxury'' subgroup fan-out
    to explicitly name the interaction effect the spec highlights as the ICE plot''s
    key value (''detecting when a feature''s effect varies across the population'').'
  - 'Optional-but-valuable ICE enhancements from the spec''s notes are unused: no
    rug plot along the x-axis showing the feature_value distribution, and no color-coding
    of the ~25% luxury subgroup by a second feature — both are explicitly suggested
    in the spec and would make the interaction effect explicit rather than only inferable
    from line divergence.'
  - 'Library Mastery is solid but generic: the sx CSS-selector override for the PDP
    line''s stroke width is a clever escape hatch but not a headline MUI X-distinctive
    capability (e.g. ChartsReferenceLine, axis highlighting, per-series curve interpolation)
    that would set this apart from a generic line-chart implementation.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, pixel-sampled at RGB(250,248,241) — matches #FAF8F1 exactly.
      Chrome: Title "House Price Predictions · ice-basic · javascript · muix · anyplot.ai" in dark ink, top-left, fully readable but occupies only ~39% of canvas width (measured left/right extent of non-background pixels in the title row) — smaller than the ~70-85% expected for a title this long. A single legend entry "Average prediction (PDP)" with a dark square swatch sits centered near the top, not overlapping any data. Subtle horizontal gridlines only (no vertical clutter). Y-axis title "Predicted Price ($)" rendered rotated in a dedicated left column (a deliberate workaround for MUI X's native label collision with wide "$800k"-style tick labels); x-axis title "Square Footage (sq ft)" below the plot. All chrome text is dark-on-light and clearly legible; no clipping detected at any of the four canvas edges (verified via pixel scan of the outermost 3px border on all sides — pure background throughout).
      Data: ~70 individual translucent green (#009E73-based, alpha 0.18) prediction curves fan out from a tight cluster near (900 sqft, $210k) to a wide spread at (3800 sqft, roughly $290k-$780k), visually revealing a divergent "luxury" subgroup among the majority trend. A bold, opaque black PDP curve (ink token, 3.5px stroke) cuts through the middle of the fan, clearly showing the average effect against the individual noise.
      Legibility verdict: PASS — all text readable, no light-on-light or overlap issues; only the title's proportional size is smaller than the style-guide expectation (a VQ-05/VQ-01 soft-check note, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black, pixel-sampled at RGB(26,26,23) — matches #1A1A17 exactly.
      Chrome: Title, axis labels, and tick labels render in light/cream text, fully readable against the dark surface — no dark-on-dark failures found anywhere. The legend swatch flips to a light/cream square (matching the PDP line's flipped ink color), remaining fully legible. Gridlines are faint but visible. No clipping detected at any of the four canvas edges (same pixel-scan verification as the light render).
      Data: The individual ICE curves render in the same brand-green hue as the light version — the underlying RGBA data color is unchanged, only its visual appearance against the darker backdrop differs, which is expected and correct (data colors must stay identical; only chrome flips). The PDP curve renders in the light/cream ink token, correctly flipped for contrast — this matches the style guide's sanctioned "neutral" semantic-anchor rule for reference/baseline lines (theme-adaptive by design, same hex as text/gridlines).
      Legibility verdict: PASS — no dark-on-dark text, brand green remains visible on the dark surface, data colors confirmed identical to the light render aside from the intentional, sanctioned ink-token flip on the PDP reference line.
