review:
  strengths:
  - Per-series styling through MUI X's data-series selector ('& .MuiLineChart-line[data-series="pdp"]')
    makes the partial dependence line 4 px and opaque while the 70 ICE curves stay
    1.5 px at 0.5 stroke opacity, so dense stretches read darker and the swatches
    in the legend keep full colour
  - Partial dependence line drawn in the theme ink token (near-black on light, near-white
    on dark), last in the series list so it sits on top, and distinct from both segment
    colours in both themes
  - 'The color by year built, which the Notes allow, uses two ordered steps of the
    Imprint sequential ramp in natural order (oldest first) and brings out a believable
    subgroup: pre-1960 houses with diminishing returns that bend away from the average'
  - Axis bands sized explicitly (x height 64, y width 84) with en-US thousands formatting
    and a 'k' formatter on prices, so no tick label is truncated
  - 'Library-native tooltip (trigger: item) gives per-curve inspection in the HTML
    output; skipAnimation is set and the chart is sized from window.ANYPLOT_SIZE'
  weaknesses:
  - 'Suggestion: in the dark render the 0.5-opacity curves, especially the pre-1960
    greens, sit fairly dim against #1A1A17; a slightly higher stroke opacity in the
    dark theme would lift them without losing the density effect.'
  - 'Suggestion: the subtitle repeats what the legend already says (''bold line: partial
    dependence''); dropping that clause would tighten the header.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "House Price Predictions · ice-basic · javascript · muix · anyplot.ai" centered (~43% width), grey subtitle "70 ICE curves × 55 grid values · coloured by year built · bold line: partial dependence"; horizontal legend top-right (green "Year built: Before 1960", blue "Year built: 1960 or later", black "Partial dependence (mean of all curves)"); y axis "Predicted Price (USD)" 150k–800k, x axis "Square Footage (sq ft)" 1,000–3,800; subtle horizontal grid lines. All text dark and readable, nothing clipped.
      Data: 70 thin semi-transparent ICE lines — about a quarter green (pre-1960, concave, flattening near 300k–470k) and the rest Imprint blue (near-linear, fanning to 450k–780k); overlap reads darker in the bulk. Bold opaque black partial dependence line from ~208k to ~558k runs through the middle of the bundle.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend text, axis titles and tick labels all flip to light ink and are clearly readable; grid lines subtle grey; no dark-on-dark text.
      Data: the same green and blue segment colors as in the light render (only chrome flips); the translucent curves read somewhat dimmer on the dark surface but stay visible; the partial dependence line flips to near-white ink and stands out strongly. Brand green visible.
      Legibility verdict: PASS
