review:
  strengths:
  - 'Faithful ICE implementation: 60 individual house curves rendered at low alpha
    (0.18) with a bold, opaque Average-prediction (PDP) overlay drawn in the theme-adaptive
    ink/neutral token — matches the spec''s core ICE-vs-PDP requirement and the style
    guide''s semantic use of the neutral anchor for baseline/reference lines.'
  - Includes a rug plot along the x-axis showing the distribution of observed square
    footage, directly satisfying an optional Notes item from the spec ('A rug plot
    along the x-axis can indicate the distribution of observed feature values').
  - 'Good data storytelling: the ICE curves fan out increasingly as square footage
    grows, visually communicating heterogeneous, non-linear effects across observations
    — the central interpretability insight ICE plots are meant to reveal.'
  - All font sizes explicitly set (title 22px, legend 15px, axis names 16px, tick
    labels 14px), clean L-shaped axis chrome, Y-axis-only subtle grid per the style
    guide's grid guidelines.
  - 'Deterministic seeded LCG data generation, KISS code structure, no fake interactivity,
    correct mount-node contract usage (no explicit width/height on echarts.init, animation:
    false set).'
  weaknesses:
  - 'Legend swatches render in ECharts'' default palette colors instead of the actual
    Imprint data colors: the ''Individual houses (ICE)'' icon shows a blue circle
    (~#5470c6, ECharts default series 1) and the ''Average prediction (PDP)'' icon
    shows a yellow-green circle, neither of which matches the real rendered line colors
    (Imprint green #009E73 for ICE, ink/neutral for PDP). Confirmed identically in
    both plot-light.png and plot-dark.png via pixel-level crop. Root cause: the top-level
    `color: t.palette` array required by prompts/library/echarts.md is never set on
    the option, and neither iceSeries nor pdpSeries sets an explicit `itemStyle.color`
    (only `lineStyle.color`), so ECharts falls back to its built-in default palette
    for legend icon fills. Fix: add `color: t.palette` to the top-level chart.setOption()
    call, and/or set `itemStyle: { color: t.palette[0] }` on the ICE series and `itemStyle:
    { color: t.ink }` on the PDP series so legend icons match the actual data colors.'
  - 'Library Mastery is generic: the implementation is essentially many overlaid line
    series plus one scatter series, a pattern replicable in almost any charting library
    with minor syntax changes. No ECharts-distinctive feature is used (e.g. a tailored
    tooltip.formatter to avoid 60 duplicate-named tooltip entries under trigger: ''item'',
    or a graphic/visualMap element) to showcase what ECharts specifically brings to
    this plot.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — correct.
      Chrome: Title "House Price ICE · ice-basic · javascript · echarts · anyplot.ai" in dark ink, centered top, clearly legible. Legend below title reads "Individual houses (ICE)" and "Average prediction (PDP)" in dark text, both legible. X-axis "Square Footage (sq ft)" and Y-axis "Predicted Price ($)" labels legible with dark-ink text; tick labels ($100k-$600k, 800-4,000) in soft ink, clearly readable. Subtle horizontal-only grid lines, visible but not competing with data. However: legend icon swatches do NOT match actual data colors — the ICE swatch renders as a blue circle and the PDP swatch renders as a yellow-green circle, neither matching the real green ICE lines or ink PDP line (confirmed via pixel crop of the legend region).
      Data: ~60 individual house prediction curves in translucent brand green (#009E73, alpha ~0.18) fanning out from a common low-price region near 800 sqft to a wide spread near 4,000 sqft. A bold, opaque near-black PDP average curve overlays the fan. A rug of small muted-gray tick marks sits along the x-axis baseline showing the distribution of observed square footages. First series color is correctly #009E73.
      Legibility verdict: PASS (all text readable; the legend icon color mismatch is a color-compliance defect, not a legibility defect).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — correct.
      Chrome: Same title and legend text now rendered in light/white ink, fully legible against the dark background — no dark-on-dark failures observed. Axis labels and tick labels rendered in light soft-ink tone, clearly legible. Grid lines subtle and visible. Same legend icon color-mismatch bug reproduces identically (blue and yellow-green circles rather than matching data colors).
      Data: ICE curves rendered in the same #009E73 green (now reading as a darker/richer green against the black background — same hex, only perceived differently due to background, which is expected and correct). PDP line now renders in a light/white ink tone (theme-adaptive neutral token, correctly flipped for dark theme) instead of black, remaining bold and clearly the focal curve. Rug tick marks in muted lavender-gray, visible. Data colors are otherwise identical to the light render as required.
      Legibility verdict: PASS (no dark-on-dark issues; same legend-icon color defect as light render).
