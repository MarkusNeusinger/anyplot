review:
  strengths:
  - Term energies come from a real eigen-decomposition of the Tanabe-Sugano symmetry
    blocks — the ³T₁g block [[6Dq, 4Dq], [4Dq, 15B]] plus the two singlet 2×2 blocks,
    `eigvals(Symmetric(...))` broadcast over 320 Δ_o/B samples with the +12Dq ground-term
    shift — so the ³T₁g(F)/³T₁g(P) pair repels instead of crossing by construction,
    exactly as the Notes demand rather than hand-fitted curves.
  - Makie's `rich` / `superscript` / `subscript` markup typesets every term symbol
    with a true superscript multiplicity and true subscript Mulliken label, drawn
    at the right-hand curve end in that curve's own Imprint color; the x-axis title
    uses the same markup for Δₒ, so direct labeling fully replaces a legend.
  - Two-tier line encoding (linewidth 6 solid for the spin-allowed triplets, 3 dashed
    for the spin-forbidden singlets) separates the two classes at a glance in both
    themes, and the subtitle carries the d⁸ (Ni²⁺) configuration, C/B = 4.71 and the
    solid/dashed key.
  - Chrome is fully tokenized (`PAGE_BG` / `INK` / `INK_SOFT`), top and right spines
    are dropped and the grid sits at 15 % ink, so both renders are theme-correct while
    the Imprint data colors stay identical across themes in canonical order starting
    at `#009E73`.
  - Canvas is the canonical 2400×2400 square via `Figure(size = (1200, 1200))` + `px_per_unit
    = 2` — matching the spec's near-square plot area — using the current `size =`
    keyword rather than the deprecated `resolution =`.
  - The ground term is drawn as a visible green line at E/B = 0 with `limits` starting
    at −2.2, so it reads as a curve along the axis instead of being collapsed into
    the bottom spine, as the Notes require.
  weaknesses:
  - 'VQ-01 (both): on the 1200-unit square figure the 20 pt tick labels and 20 pt
    axis titles scale to roughly 7 px once the 2400 px render is shown at a 400 px
    mobile width, where they stop being comfortably readable while the 26 pt title
    still holds → about 24 pt (+4 pt each). Likely cause: `xticklabelsize`/`yticklabelsize`
    = 20 and `xlabelsize`/`ylabelsize` = 20 on the Axis.'
  - 'Suggestion: y ticks every 20 and x ticks every 10 leave a coarse grid for a chart
    readers slide a ruler across; a finer light grid would make band-ratio reading
    easier.'
  - 'Suggestion: the upper eigenvalues of the ¹Eg, ¹T₂g and ¹A₁g blocks are already
    computed and then discarded — drawing one of them would put a second same-symmetry
    pair on the chart.'
  - 'Suggestion: a d⁶ or d³ configuration would additionally exercise the high-spin/low-spin
    crossover line and the slope kink the spec highlights for d⁴–d⁷.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across both the figure and the axis area — not pure white, not dark. Canvas is the square 2400×2400.
      Chrome: bold near-black title "line-tanabe-sugano · julia · makie · anyplot.ai" centred over a soft-grey subtitle "d⁸ (Ni²⁺), octahedral field, C/B = 4.71 · solid = spin-allowed, dashed = spin-forbidden". X-axis title "Δ_o/B — reduced ligand-field strength" with a true subscript o, ticks 0/10/20/30/40; y-axis title "E/B — reduced term energy", ticks 0/20/40/60/80. Only the left and bottom spines are drawn, in INK_SOFT; grid lines sit at ~15 % ink behind the curves. All chrome is clearly readable against the light background; nothing is light-on-light and no element is clipped at any canvas edge.
      Data: eight term curves rising from the left. Flat brand-green #009E73 ³A₂g ground term along E/B = 0 (first series = brand green, confirmed); lavender #C475FD ³T₂g rising linearly to 40; blue #4467A3 ³T₁g(F) curving to ~51; ochre #BD8233 ³T₁g(P) climbing to ~85 — all four thick and solid. Matte-red #AE3030 ¹Eg flattening near 17.5, cyan #2ABCCD ¹T₂g to ~57, rose #954477 ¹A₁g flattening near 32, lime #99B314 ¹T₁g to ~61 — all four thin and dashed. Each curve carries its typeset term symbol at its right-hand end in its own colour inside a dedicated label gutter (x 40–47); no label collides with another or with a curve. No crossover line — correct for d⁸.
