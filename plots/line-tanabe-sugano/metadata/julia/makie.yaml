review:
  strengths:
  - Term energies come from a real eigen-decomposition of the Tanabe-Sugano symmetry
    blocks (`eigvals(Symmetric(...))` broadcast over the 320 Delta_o/B samples, ground
    term subtracted via the +12Dq shift), so the 3T1g(F)/3T1g(P) pair avoids crossing
    by construction rather than by hand-fitting - exactly what the Notes ask.
  - Makie's `rich` / `superscript` / `subscript` markup typesets every term symbol
    with a true superscript multiplicity and true subscript Mulliken label, placed
    at the right-hand curve end in the curve's own Imprint color, which replaces a
    legend with direct labeling.
  - Two-tier line encoding (linewidth 6 solid for the spin-allowed triplets, linewidth
    3 dashed for the spin-forbidden singlets) separates the two classes at a glance
    in both themes, and the subtitle carries the d-n configuration, the C/B ratio
    and the solid/dashed key.
  - 'Chrome is fully tokenized (PAGE_BG / INK / INK_SOFT), top and right spines are
    dropped and the grid sits at 15 % ink, so both renders are theme-correct with
    identical Imprint data colors in canonical order starting at #009E73.'
  - Canvas is the canonical 2400x2400 square via `Figure(size = (1200, 1200))` plus
    `px_per_unit = 2` - matching the spec's near-square plot area - and uses the current
    Makie `size =` keyword rather than the deprecated `resolution =`.
  - The ground term is drawn as a visible green line at E/B = 0 just above the bottom
    spine (limits start at -2.2) instead of being collapsed into the axis, as the
    Notes require.
  weaknesses:
  - 'VQ-01 (both): the right-edge term labels (fontsize 17), the subtitle (16) and
    the tick labels (16) sit on a 1200-unit square figure, so they scale to roughly
    5-6 px in the 400 px thumbnail and are unreadable there while the title stays
    legible -> about 22 pt for the term labels and 20 pt for ticks and subtitle (+5
    pt each). Likely cause: `fontsize = 17` on the `text!` call, `subtitlesize = 16`
    and `x/yticklabelsize = 16` on the Axis.'
  - 'Suggestion: y ticks every 20 and x ticks every 10 give a coarse grid for a chart
    readers slide a ruler across; light minor gridlines would make band-ratio reading
    easier.'
  - 'Suggestion: the upper eigenvalues of the 1Eg, 1T2g and 1A1g blocks are already
    computed and then discarded - drawing one of them would put a second same-symmetry
    pair on the chart.'
  - 'Suggestion: a d6 or d3 configuration would additionally exercise the high-spin/low-spin
    crossover line and the kink the spec highlights for d4-d7.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across both figure and axis area — not pure white, not dark. Canvas 2400x2400 (square target, gate file absent).
      Chrome: bold near-black title "line-tanabe-sugano · julia · makie · anyplot.ai" centred at the top, grey subtitle "d⁸ (Ni²⁺), octahedral field, C/B = 4.71 · solid = spin-allowed, dashed = spin-forbidden" beneath it. X label "Δ_o/B — reduced ligand-field strength" (with a true subscript o), Y label "E/B — reduced term energy". Ticks 0/10/20/30/40 on x and 0/20/40/60/80 on y in soft grey; only left and bottom spines, grid lines at ~15 % ink sit clearly behind the curves. All text readable; nothing light-on-light, nothing clipped at any edge.
      Data: eight term curves rising from the left. First series — the flat ³A₂g ground term along E/B = 0 — is Imprint brand green #009E73, drawn thick and solid just above the bottom spine. Then lavender ³T₂g (straight, to 40), blue ³T₁g(F) (concave, to 51), ochre ³T₁g(P) (to 85) all thick solid; red ¹Eg (near-flat at ~17), cyan ¹T₂g (to 57), rose ¹A₁g (flattening at ~32) and lime ¹T₁g (to 61) thin and dashed. Each curve carries its term symbol at the right-hand end in its own color, with superscript multiplicity and subscript Mulliken label; no label collides with another. No crossover line — correct for d⁸ and explicitly permitted by the spec.
      Legibility verdict: PASS at full size. At the 400 px thumbnail the term labels, subtitle and tick labels fall to ~5-6 px and are no longer readable (flagged under VQ-01).

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 on both figure and axis area — not pure black, not light.
      Chrome: title in near-white #F0EFE8, subtitle and tick labels in soft light grey #B8B7B0, axis titles in #F0EFE8 — all clearly readable. No dark-on-dark anywhere: every text element flipped to the light ink tokens. Grid lines are faint light strokes, visible but subordinate to the curves.
      Data: colors are identical to the light render (same IMPRINT_PALETTE constants, no theme branch on data color) — brand green #009E73 ground term, lavender, blue, ochre, matte red, cyan, rose, lime in canonical order. Line weights and dash patterns unchanged. The matte red ¹Eg dashed line is the lowest-contrast mark on the dark surface but stays clearly distinguishable; brand green remains vivid.
      Legibility verdict: PASS at full size, same 400 px thumbnail caveat as the light render.
