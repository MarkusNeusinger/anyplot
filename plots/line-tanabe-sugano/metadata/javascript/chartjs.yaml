review:
  strengths:
  - Term energies come from the literature d² Tanabe-Sugano matrices diagonalised
    exactly — the ³T₁g block [[-5B-8Dq, 6B], [6B, 4B+2Dq]], the ¹A₁g, ¹Eg and ¹T₂g
    2×2 blocks and the 1×1 ³T₂g/³A₂g/¹T₁g terms, all with the Racah A dropped and
    C/B = 4.42 — so the ³T₁g(F)/³T₁g(P) pair stays a genuine avoided crossing (lower
    and upper root) instead of two lines that cross and swap identity.
  - 'The ground term is drawn as a real curve: the ³T₁g(F) stroke in brand green #009E73
    runs flat along E/B = 0, and the per-dataset `clip: 8` keeps its full 6 px stroke
    visible instead of letting the axis boundary shave half of it off.'
  - Spin-allowed triplets at 6 px solid versus spin-forbidden singlets at 3 px dashed
    separates the two classes at a glance in both themes, and the subtitle states
    the configuration, the C/B ratio and the line-weight convention in one line.
  - A custom `afterDatasetsDraw` Chart.js plugin labels every curve at its right-hand
    end in that curve's own colour, using `scales.y.getPixelForValue` and `chartArea.right`
    with a 28 px vertical de-collision pass — this replaces a legend with direct per-series
    labels, which is exactly the redundant encoding the style guide requires at n
    = 8.
  - Theme chrome is threaded through `ANYPLOT_TOKENS` end to end (ink for title and
    axis titles, inkSoft for subtitle and ticks, grid for gridlines and the axis border).
    Pixel sampling of both PNGs confirms the eight Imprint data colours are byte-identical
    between the renders — only background, ink and grid flip.
  - 'Idiomatic Chart.js 4: a `type: "line"` chart with a linear x scale and {x, y}
    point objects, `pointRadius: 0` for 321 samples per curve, `borderDash` for the
    forbidden terms, the native subtitle plugin, `animation: false` and layout padding
    reserving the right gutter for the term labels.'
  weaknesses:
  - 'Suggestion: a d⁵–d⁷ configuration (d⁶, Fe²⁺, is the other classic textbook case)
    would additionally exhibit the high-spin/low-spin crossover line and the kink
    it puts in every curve, which d² inherently cannot show.'
  - 'Suggestion: the ¹T₂g end-label is pushed about 2 E/B below its own curve by the
    28 px de-collision against the near-coincident ¹Eg label; a short leader line
    from label to curve end would tie each of the two flat dashed curves to its symbol
    without relying on colour alone.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas (sampled; 5.48 M px of
        the image are exactly #FAF8F1). Not pure white, not dark.
      Chrome: title "line-tanabe-sugano - javascript - chartjs - anyplot.ai" in dark ink across the top,
        spanning roughly half the canvas width; grey subtitle "d2 (V3+) in Oh, C/B = 4.42 - solid:
        spin-allowed triplets - dashed: spin-forbidden singlets" directly below it. Y-axis title
        "E/B - term energy above ground term" rotated on the left, x-axis title "Do/B - reduced
        ligand-field strength" centred at the bottom (both with true subscripts in the Unicode text).
        Y ticks 0-80 in steps of 10, x ticks 0-40 in steps of 5, all in soft ink. Grid #D8D7D0 - clearly
        visible but well behind the curves. Plot area is near-square with both axes starting at 0.
        All text readable; nothing light-on-light, nothing clipped at any canvas edge.
      Data: eight term curves, Imprint palette in canonical order. Four thick solid spin-allowed
        triplets - 3T1g(F) brand green #009E73 flat along E/B = 0, 3T2g lavender #C475FD rising to ~37.7,
        3T1g(P) blue #4467A3 from ~15 to ~50.4, 3A2g ochre #BD8233 from 0 to ~77.7 - and four thin
        dashed spin-forbidden singlets - 1Eg matte red #AE3030 and 1T2g cyan #2ABCCD both starting at
        ~13.8 and flattening to ~15.5, 1T1g rose #954477 from ~21 to ~58, 1A1g lime #99B314 from ~21
        curving to ~34.5. First series is #009E73 as required. Each curve carries its term symbol at the
        right edge in its own colour; no crossover line, correct for d2. Widest label "3T1g(P)" ends
        ~160 px short of the right canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full 2400x2400 canvas (sampled; 5.49 M px exactly
        #1A1A17). Not pure black, not light.
      Chrome: identical layout. Title and axis titles now in #F0EFE8, subtitle and tick labels in the
        soft light ink #B8B7B0, gridlines #3A3A36 - subtle but visible against the near-black surface.
        No dark-on-dark anywhere: every title, subtitle, axis title and tick label is light text on the
        dark ground, and the axis border likewise flips to the dark-theme grid token.
      Data: the eight data colours are unchanged - pixel-count comparison of the two PNGs gives the same
        #009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD, #954477, #99B314 with near-identical pixel
        counts in both renders, so only chrome flipped. Brand green #009E73 remains clearly visible as
        the flat ground term along the x axis. The colour-matched term labels at the right edge all read
        cleanly against the dark background, including the matte-red 1Eg label.
      Legibility verdict: PASS
