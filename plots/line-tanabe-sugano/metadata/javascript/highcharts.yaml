review:
  strengths:
  - 'Term energies are genuine Tanabe-Sugano eigenvalues, not hand-fitted curves:
    the strong-field matrices for ⁴T₁g, ²Eᵍ, ²T₁g and ²T₂g are diagonalized per field-strength
    sample, so the avoided crossing between ⁴T₁g(F) and ⁴T₁g(P) falls out of the physics
    and the terms never swap identity'
  - 'Factually exact at the limits a chemist checks first: ⁴T₂g and ⁴T₁g(F) start
    degenerate with the ⁴A₂g ground term at Δₒ/B = 0, ⁴T₁g(P) at the free-ion 15B,
    and all four ²G-derived doublets at 17.5B for C/B = 4.5, with ⁴T₂g rising at exactly
    slope 1'
  - 'Highcharts-native direct labelling replaces a legend: per-point `dataLabels`
    on each series'' last point with `crop: false` / `overflow: "allow"` push the
    term symbols into the reserved `marginRight`, each tinted with its own curve color'
  - '`useHTML` markup typesets the term symbols properly — multiplicity as a true
    superscript, the numeral and g as true subscripts — in the labels, the subtitle
    and the axis title (Δₒ/B)'
  - 'Spin emphasis is encoded redundantly and reads in both themes: lineWidth 4 solid
    for the spin-allowed quartets against 2.2 ShortDash for the spin-forbidden doublets,
    with the key spelled out in the subtitle alongside the d³ configuration and C/B
    ratio'
  - 'Interactive HTML view is configured deliberately: an HTML tooltip with sub/superscript
    markup and Δₒ/B / E /B readouts, plus `states.inactive.opacity: 1` so hovering
    one term does not dim the other seven'
  - Theme tokens are threaded through every chrome element — transparent chart background
    over the page surface, `t.ink` title, `t.inkSoft` ticks and axis titles, 15 %-alpha
    `t.grid` gridlines — and the eight Imprint data colors are pixel-identical between
    the two renders
  weaknesses:
  - 'CQ-01 (code): the script defines two helper arrow functions where the rubric
    asks for a straight Data → Plot body; `termEnergies` (lines 58–96) is called once
    per sample and folds into the sweep loop at lines 112–115 → one function, the
    `eigenvalues` solver the browser has no call for (−1 helper). Likely cause: the
    per-sample energy block was factored out alongside the solver.'
  - 'Suggestion: the Notes allow an example complex''s Δₒ/B marker with arrows from
    the ground term up to the excited terms — a vertical line at the Cr(NH₃)₆³⁺ value
    would show how the diagram is read in reverse.'
  - 'Suggestion: the cyan ²T₁g and lime ²A₁g labels sit at the faint end on the cream
    page; a slightly heavier weight or a thin ink outline would lift them without
    breaking the color match to their curves.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas (sampled: 5.52 M px of exactly #FAF8F1) — not pure white, not dark. Gridlines on both axes at #D8D7D0 (15 %-alpha ink), subtle and clearly behind the curves.
      Chrome: bold near-black title "line-tanabe-sugano · javascript · highcharts · anyplot.ai" (#1A1A17) spanning ~53 % of the canvas width; grey subtitle "d³ (Cr³⁺), octahedral · C/B = 4.5 · solid = spin-allowed, dashed = spin-forbidden" (#4A4A44) with real superscripts; y-axis title "Term energy E/B" rotated at left, x-axis title "Ligand-field strength Δ_o/B" centred below with a true subscript o; tick labels 0–90 in steps of 10 on y and 0–40 in steps of 5 on x, all #4A4A44. Every piece of chrome is dark on the light surface and fully readable; nothing is light-on-light, nothing is clipped at any canvas border.
      Data: eight term curves, first series ⁴A₂g the brand green #009E73 drawn as a visible flat line along E/B = 0; then ⁴T₂g lavender #C475FD, ⁴T₁g(F) blue #4467A3, ⁴T₁g(P) ochre #BD8233 (all four thick solid = spin-allowed), and ²Eg matte red #AE3030, ²T₁g cyan #2ABCCD, ²T₂g rose #954477, ²A₁g lime #99B314 (all four thin dashed = spin-forbidden). Each curve is labelled at its right-hand end in its own color, outside the plot area in the reserved right margin, with superscript multiplicity and subscript Mulliken label (⁴T₁g(P), ²A₁g, ⁴T₁g(F), ⁴T₂g, ²T₂g, ²T₁g, ²Eg, ⁴A₂g top to bottom). The two converging labels ²T₁g and ²Eg are separated vertically and do not touch. No markers, no legend box, no annotation boxes.
      Legibility verdict: PASS. The cyan ²T₁g and lime ²A₁g labels are the faintest elements on the cream page (the known sub-3:1 Imprint/WCAG tension the style guide accepts) but remain legible at full size.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the same 2400x2400 canvas (sampled: 5.52 M px of exactly #1A1A17) — not pure black. Gridlines at #3A3A36 (15 %-alpha light ink), subtle and visible.
      Chrome: title now #F0EFE8, subtitle and all axis titles and tick labels #B8B7B0 — every text element is light on the near-black surface. No dark-on-dark failure anywhere: no title, axis title, tick label or curve label renders in a near-black ink. Layout is identical to the light render, nothing clipped.
      Data: identical to the light render, verified by pixel sampling — #009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD, #954477, #99B314 all appear with the same pixel counts in both PNGs, so only chrome flipped. The brand green ⁴A₂g ground line stays clearly visible along the axis, and all four dashed spin-forbidden curves remain distinguishable from the background.
      Legibility verdict: PASS.
