review:
  strengths:
  - 'Term energies come from diagonalizing the d3 strong-field Tanabe-Sugano matrices
    with a short cyclic-Jacobi solver, not from fitted splines: 4T2g is exactly Delta_o/B,
    4T1g(P) starts at 15 B, and the four 2G-derived doublets start together at 17.5
    B for C/B = 4.5 - the textbook Cr3+ diagram.'
  - 'Every curve is labelled at the right edge by a single-point `dataLabels` entry
    with `useHTML`, `crop: false` and `overflow: "allow"`, so the term symbols carry
    true <sup> multiplicities and <sub> subscripts and are coloured to match their
    curve, replacing a legend entirely.'
  - 'Spin-allowed quartets at `lineWidth: 4` solid versus spin-forbidden doublets
    at 2.2 `ShortDash` make the two classes separable at a glance in both themes,
    with the convention spelled out in the subtitle together with the configuration
    and C/B ratio.'
  - 'Theme handling is exact: `chart.backgroundColor: "transparent"` over the harness
    page, chrome from `t.ink` / `t.inkSoft` / `t.grid`, and the Imprint palette identical
    in both renders (sampled #009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD,
    #954477, #99B314 in light and dark alike).'
  - 'Highcharts-native interactivity is configured without touching the static render:
    a `useHTML` tooltip reporting Delta_o/B and E/B per term and `states.inactive.opacity:
    1` so hovering one curve does not dim the rest in the HTML output.'
  weaknesses:
  - 'Suggestion: the Notes allow a vertical marker at a real Cr3+ complex''s Delta_o/B
    with arrows from the ground term up to the excited terms - it would tie the curves
    to measured UV-Vis bands.'
  - 'Suggestion: slightly larger tick labels would keep the axis numbers legible in
    the 400 px gallery thumbnail.'
  - 'Suggestion: `termEnergies` currently returns only the lowest root of each doublet
    block; exposing the second root of the 2T1g or 2T2g block would show an avoided
    crossing explicitly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled #FAF8F1 (250,248,241) across the page and the plot area; square 2400x2400 canvas, plot area very nearly square.
      Chrome: bold near-black title "line-tanabe-sugano · javascript · highcharts · anyplot.ai" centred at the top, grey subtitle "d3 (Cr3+), octahedral · C/B = 4.5 · solid = spin-allowed, dashed = spin-forbidden" with true superscripts; y-axis title "Term energy E/B" rotated at the left, x-axis title "Ligand-field strength Delta_o/B" with a subscript o at the bottom; ticks 0-40 every 5 on x and 0-90 every 10 on y, all dark grey and clearly readable; grid lines are faint 15 %-alpha ink, visible but sitting behind the curves; no legend box and no credits watermark.
      Data: eight term curves. Four spin-allowed quartets are thick and solid - 4A2g brand green #009E73 flat along E/B = 0, 4T2g lavender rising linearly to 40, 4T1g(F) blue curving to 51, 4T1g(P) ochre from 15 up to 84. Four spin-forbidden doublets are thinner and short-dashed - 2Eg matte red and 2T1g cyan both nearly flat near 21-22, 2T2g rose levelling at 33, 2A1g lime rising straight to 58. All four doublets start together at 17.5 at Delta_o/B = 0. Every curve carries its term symbol at the right edge in its own colour with the multiplicity as a superscript and the numeral plus g as subscripts; the 2Eg and 2T1g labels are offset vertically so they stay apart where the curves converge. First categorical series is #009E73 as required.
      Legibility verdict: PASS - title, subtitle, both axis titles, every tick label and all eight term labels are dark on the off-white surface with ample contrast; nothing is clipped at any canvas edge and no text overlaps text or data.

    Dark render (plot-dark.png):
      Background: warm near-black, sampled #1A1A17 (26,26,23); same square 2400x2400 canvas and same layout.
      Chrome: title now light cream on the near-black surface, subtitle in soft light grey, axis titles and all tick labels light grey - no dark-on-dark anywhere; grid lines flip to 15 %-alpha light ink and remain subtle but visible.
      Data: identical to the light render. Pixel sampling of the label/curve strip returns exactly the same hexes in both files - #009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD, #954477, #99B314 - so only the chrome flipped. Line weights, dash pattern, curve shapes and label positions are unchanged; the brand green 4A2g ground line is clearly visible along the axis.
      Legibility verdict: PASS - all chrome text is light on dark, every curve including the thinner dashed doublets stays distinguishable from the background, and the term labels keep their curve colours.
