review:
  strengths:
  - 'Curve energies are genuine eigenvalues of the d2 strong-field blocks, not fitted
    splines: at delta_o/B = 0 every curve lands exactly on its free-ion term (3F -8B,
    3P 7B, 1D -3B+2C, 1G 4B+2C, 1S 14B+7C at C/B = 4.42), and the -12/-2/+8 Dq coefficients
    reproduce the t2g^2 / t2g eg / eg^2 10Dq spacings, so terms sharing symmetry and
    multiplicity repel instead of crossing.'
  - Term symbols are typeset into tspan runs with per-run dy and a 0.72x size (typeset(),
    lines 21-32), giving true superscript multiplicities and true subscript Mulliken
    indices on all 13 labels plus the axis title and subtitle - raw SVG text control
    that is distinctive to d3.
  - 'The two-class hierarchy follows the Notes exactly: spin-allowed terms thick,
    solid and in Imprint positions 1-4, spin-forbidden terms thin, dashed and in the
    theme-adaptive muted anchor, with a two-entry key that names the rule (Spin-allowed
    / Spin-forbidden).'
  - Idiomatic d3 throughout the drawing layer - margin convention, selection.data().join()
    for grid lines and curve paths, d3.line() shape generator, d3.scaleLinear/d3.axisBottom
    with tickSize(0), and a clipPath that trims the two curves leaving the top of
    the frame without moving them off their data values.
  - The ground term 3T1g(F) is drawn as a visible brand-green line along E/B = 0 rather
    than omitted, and the right-edge labels are de-collided by pushing the text apart
    (lines 164-167) while the curves themselves stay on their data values.
  weaknesses:
  - 'VQ-01 (both): the term-symbol labels at 18 px, whose super/subscripts drop to
    13 px, are the smallest type in the chart and dissolve into grey smudges at the
    400 px mobile width, while the 152 px right margin still holds about 60 px of
    free space -> about 22 px with proportional super/subscripts (+4 px). Likely cause:
    `LABEL_PX = 18`.'
  - 'VQ-03 (both): the curves sit at the thin end for a 2400 px canvas - spin-forbidden
    strokes at width 2 (4 source px) nearly vanish in the 400 px thumbnail and spin-allowed
    at 4 (8 source px) read lighter than the catalogue norm -> about 3 and 5.5 (+1
    to +1.5 px), keeping the two classes clearly apart. Likely cause: `.attr("stroke-width",
    (curve) => (curve.allowed ? 4 : 2))` on the curve join.'
  - 'LM-01 (code): the 11 term labels (lines 168-179) and the two key entries (lines
    205-222) are appended one at a time in `for` / `forEach` loops, while the grid
    lines and the curve paths in the same file use the data join -> `svg.selectAll("text.term").data(labels).join("text")`
    plus `.each(function (d) { typeset(d3.select(this), d.symbol, LABEL_PX); })`,
    and the same join for the key. Likely cause: the per-label `typeset()` call, which
    works unchanged inside `.each()`.'
  - 'Suggestion: the two labels drawn inside the frame sit roughly 100 px left of
    the curve they name; placing them along the curve''s slope would tie each one
    to its line more tightly.'
  - 'Suggestion: the HTML output is a static SVG - a hover that highlights one term
    and dims the rest would make the detail view earn its interactivity.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas, no white rect
        painted over the page surface, no pure white anywhere.
      Chrome: bold dark title "line-tanabe-sugano - javascript - d3 - anyplot.ai" centred at the top,
        spanning about 55% of the canvas width; a softer subtitle below it reading "d2 ion (V3+) in an
        octahedral field - C/B = 4.42" with a true superscript 2 and 3+. X axis title "Reduced
        ligand-field strength delta_o/B" (o as a true subscript) at the bottom, rotated Y axis title
        "Reduced term energy E/B" at the left. Tick labels 0,5,...,40 on x and 0,10,...,80 on y in soft
        dark grey, tick marks removed, an L-shaped spine, and a very light grid on both axes that sits
        behind every curve. A two-entry key at the top left of the plot area: a thick green sample
        labelled "Spin-allowed (delta-S = 0)" and a thin dashed grey sample labelled "Spin-forbidden".
        All of it is clearly readable dark-on-light; nothing is light-on-light.
      Data: eleven term curves on a near-square plot area (936 x 980 CSS px), both axes starting at 0.
        Four spin-allowed triplets are thick and solid in Imprint order - 3T1g(F) the flat ground term
        in brand green #009E73 along E/B = 0, 3T2g in lavender #C475FD, 3T1g(P) in blue #4467A3 and
        3A2g in ochre #BD8233, with 3A2g crossing 3T1g(P) near delta_o/B = 13.5. Seven spin-forbidden
        singlets are thin dashed lines in the muted anchor #6B6A63. Every curve carries its term symbol
        with a true superscript multiplicity and true subscript Mulliken index: nine at the right edge
        (3A2g, 1T1g, 1T2g(G), 3T1g(P), 3T2g, 1A1g(G), 1Eg(D), 1T2g(D), 3T1g(F)), coloured to match its
        curve, and two (1A1g(S), 1Eg(G)) placed inside the frame where those curves leave the top.
        First categorical series is #009E73 on the ground term. No text overlaps text or data, and no
        element is clipped at any canvas edge.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the full square canvas - not pure black, not light.
      Chrome: the same title, subtitle, axis titles, tick labels and key, all flipped to light ink
        (#F0EFE8 primary, #B8B7B0 secondary) and plainly readable against the near-black surface. No
        dark-on-dark element anywhere: every tick label, the subtitle, the key text and both axis
        titles are light. The grid flipped to the light 15%-alpha rule colour and stays subtle.
      Data: identical data colours to the light render - brand green #009E73 on the ground term,
        lavender, blue and ochre on the other three triplets, all visibly the same hues as in light.
        The only colour that moves is the theme-adaptive `muted` anchor on the spin-forbidden set
        (#6B6A63 light -> #A8A79F dark), which the style guide defines as adaptive by design for the
        "other / rest" role. Curve geometry, labels, label positions and the key are unchanged; the
        green ground-term line is still clearly visible sitting on the x axis.
      Legibility verdict: PASS
