review:
  strengths:
  - 'Term energies come from diagonalizing the real Tanabe-Sugano d3 matrices at C/B
    = 4.5 by cyclic Jacobi rotation (lines 19-147), not from fitted splines: 4T2g
    rises as exactly Delta_o/B (40 at x=40), 4T1g(P) starts at 15 B, the doublets
    at ~17 B, and 4T1g(F) sits near 51 at x=40 - the textbook d3 diagram.'
  - ECharts `endLabel` with a `rich` formatter typesets each term symbol at the curve
    end with a true superscript multiplicity and true subscript Mulliken label (4A2g,
    4T1g(F), 2Eg), in the curve's own color - a distinctive ECharts line-series feature
    that replaces a legend for 8 series and is exactly the redundant encoding the
    style guide requires at n = 8.
  - The two 4T1g curves are the two eigenvalues of one 2x2 block, so the same-symmetry/same-multiplicity
    pair can never cross or swap identity by construction, as the Notes require.
  - 'Spin classes are separated twice over: solid 4.5 px for the spin-allowed quartets
    against dashed 2.4 px for the spin-forbidden doublets, with the subtitle stating
    both the key and the configuration plus C/B ratio.'
  - 'Chrome is fully tokenized from `window.ANYPLOT_TOKENS` (ink, inkSoft, grid) while
    `color: t.palette` keeps the Imprint data colors byte-identical between the two
    renders, with the 4A2g ground term on brand green #009E73.'
  - 'Square orientation via the `//# anyplot-orientation: square` directive gives
    a near-square 960x948 plot area with both axes starting at 0 and a subtle 15 %-opacity
    grid behind the curves - exactly the reading geometry the Notes ask for.'
  - 'Mount-node contract handled correctly: `echarts.init` with no explicit size and
    no devicePixelRatio, `animation: false`, one chart on #container, and generous
    grid margins (left 104 / right 136) that keep every end label inside the canvas.'
  weaknesses:
  - 'VQ-01 (both): the rich-text super/subscripts of the end labels render at fontSize
    13 against the 20 px core glyph - the smallest text in the chart, and the first
    element to become unreadable when the square canvas is scaled to a ~400 px mobile
    width (the multiplicity on ''2T1g'' and ''2Eg'' closes up first) -> about 15 px
    (+2 px). Likely cause: `rich: { s: { fontSize: 13 }, b: { fontSize: 13 } }` in
    the series endLabel.'
  - 'CQ-01 (code): the script is carried by three helper arrow functions (`symmetric`
    line 19, `eigenvalues` line 30, `termEnergies` line 67) instead of the flat Data
    -> Plot order the criterion asks for; `termEnergies` has a single call site, in
    the sampling loop -> inline its body into that loop (lines 161-168) and keep `eigenvalues`,
    which nothing in the browser replaces. Likely cause: the per-sample computation
    was factored out together with the eigensolver.'
  - 'Suggestion: a `tooltip: { trigger: ''axis'' }` would let a reader of the HTML
    output read E/B for all eight terms at one Delta_o/B at once - the reverse reading
    (matching band ratios) the spec describes, and something the static PNG cannot
    offer.'
  - 'Suggestion: the 2Eg end label is pushed 17 px below its curve end to clear 2T1g;
    a smaller offset would tie it to its line more tightly while still separating
    the pair.'
  image_description: |-
    Light render (plot-light.png), 2400x2400 square:
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel, no frame.
      Chrome: centered title "line-tanabe-sugano · javascript · echarts · anyplot.ai" in near-black ink at the top, two subtitle lines under it in soft grey ("d³ (Cr³⁺) in an octahedral field · C/B = 4.5" and "solid = spin-allowed (quartet) · dashed = spin-forbidden (doublet)"). X axis "Δₒ / B   ligand-field strength" with ticks 0,5,…,40; Y axis "E / B   term energy above ground" rotated at the left with ticks 0,10,…,90. L-shaped axis lines only, no tick marks, a faint grey grid on both axes sitting behind the curves. All chrome text is dark on the light background and fully readable; nothing touches or crosses the canvas border.
      Data: eight term curves, first series = brand green #009E73 drawn as a thick flat ⁴A₂g ground line along E/B = 0. Spin-allowed quartets are thick solid lines — lavender ⁴T₂g rising linearly to 40, blue ⁴T₁g(F) curving up to ~51, ochre ⁴T₁g(P) the steepest at ~84.5; spin-forbidden doublets are thinner dashed — matte-red ²E_g and cyan ²T₁g almost flat at 21–22, rose ²T₂g bending up to ~33, lime ²A₁g rising to ~57.5. Every curve carries its term symbol at the right end in its own color with a true superscript multiplicity and subscript Mulliken label (⁴A₂g, ⁴T₂g, ⁴T₁g(F), ⁴T₁g(P), ²E_g, ²T₁g, ²T₂g, ²A₁g). The two ⁴T₁g curves never cross.
      Legibility verdict: PASS — background is warm off-white (not pure white), all titles/labels/ticks are dark on light, the grid is visible but subtle, and every curve is clearly separable from the page.

    Dark render (plot-dark.png), 2400x2400 square:
      Background: warm near-black #1A1A17, not pure black; identical layout and geometry to the light render.
      Chrome: same title in light ink #F0EFE8, both subtitle lines in soft light grey #B8B7B0, axis names and all tick labels light on dark. The grid flips to rgba(240,239,232,0.15) and stays subtle. No dark-on-dark element anywhere — title, subtitles, axis names, both tick rows and the axis lines all read cleanly; no element is clipped at any border.
      Data: colors are identical to the light render — the HTML tokens confirm the same Imprint array ["#009E73","#C475FD","#4467A3","#BD8233","#AE3030","#2ABCCD","#954477","#99B314"] in both themes, so only chrome flips. The brand green ground line at E/B = 0 remains clearly visible on the dark surface; the thin dashed doublets (matte red, cyan, rose, lime) keep enough contrast to be followed, and the end labels are drawn in their curve colors and stay readable.
      Legibility verdict: PASS — warm near-black background, light chrome text throughout, no dark-on-dark failure, brand green clearly visible.
