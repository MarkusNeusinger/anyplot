      Data: ground term 4A2g as a thick green (#009E73) line at E/B = 0; 4T2g (lavender) and 4T1g(F)/(P) (blue) thick solid; 2Eg roots red, 2T1g blue, 2T2g lavender, 2A1g ochre, 2A2g green, all dashed and thinner. 4T1g(P) starts at 15. Right-edge typeset labels with leaders; six curves that exit at E/B = 90 are labeled above the ceiling. Dashed marker at Δo/B = 24.9 for [Cr(H2O)6]3+ with ν1 and ν2 arrows from 0 to 4T2g and 4T1g(F).
