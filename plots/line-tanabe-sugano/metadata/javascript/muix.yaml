review:
  strengths:
  - The spin-allowed quartet block is a real 2×2 diagonalization in closed form (diagonal
    1.8·Δ and 15 + 1.2·Δ, coupling 0.4·Δ), so ⁴T₁g(F) and ⁴T₁g(P) bend away from each
    other as an avoided crossing and ⁴T₁g(P) starts at E/B = 15 at Δo/B = 0 (check
    value 1, computed, not placed)
  - 'Composed MUI X chart: ChartsContainer + LinePlot + ChartsReferenceLine + ChartsGrid,
    with a custom SVG layer that reads useDrawingArea/useXScale/useYScale so the direct
    labels, the example-complex annotation and the ν₁/ν₂ arrows sit exactly in data
    coordinates'
  - Term labels are typeset with real SVG tspan superscripts and subscripts (multiplicity
    up, numeral and g down), colour-matched to their curves in the right margin, so
    no legend is needed
  - Spin-allowed vs spin-forbidden encoding through per-series sx selectors on data-series
    (4.2 px solid vs 2.4 px dashed) reads clearly in both themes
  - The optional [Cr(H₂O)₆]³⁺ marker at Δo/B = 24.9 with ν₁ → ⁴T₂g and ν₂ → ⁴T₁g(F)
    arrows anchored on the curves shows how the diagram is read in practice
  - Axis tooltip (trigger="axis") gives every term's E/B at a field strength in the
    HTML view
  weaknesses:
  - 'DQ-03, SC-02 (both): the two doublet curves are hard-coded constants, not diagonalized:
    ²Eg is a flat line at 9 + 3·C/B = 22.5 across the whole axis and ²T₂g a flat line
    at 15 + 3·C/B = 28.5. At Δo/B = 0 every doublet from ²G must start at the free-ion
    ²G energy 4B + 3C = 17.5 (²Eg observed 22.5, delta −5.0), and in the strong-field
    limit ²T₂g(t₂g³) approaches 15B + 5C = 37.5 (observed 28.5, delta +9.0) → compute
    the doublet energies by diagonalizing the d³ doublet Tanabe-Sugano matrices at
    C/B = 4.5 and subtract the ⁴A₂g energy at each Δo/B, as the Notes require. Likely
    cause: the `9 + 3 * C_OVER_B` and `15 + 3 * C_OVER_B` entries in the energies
    array.'
  - 'DQ-01, SC-02 (both): only 2 of the doublet terms that fall inside the plotted
    0–84 E/B range are drawn; ²T₁g (from ²G, nearly coincident with ²Eg), ²A₁g and
    the higher ²T₁g / ²T₂g / ²Eg roots from ²H, ²P, ²D are missing, so the diagram
    does not show one curve per term in range and loses the doublet avoided crossings
    the spec asks to keep → include every doublet root of each symmetry block that
    falls below the top of the y-axis. Likely cause: TERM_SPECS lists six terms and
    the doublet blocks are never built.'
