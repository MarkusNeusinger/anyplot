review:
  strengths:
  - Curve energies come from the real weak-field Tanabe-Sugano 4T1g block (18Dq and
    15B+12Dq on the diagonal, 4Dq off-diagonal, lines 32-37), so the 4T1g(F)/4T1g(P)
    avoided crossing is produced by diagonalizing the matrix rather than by a fitted
    spline, exactly as the Notes demand; at Do/B = 0 the eigenvalues land on 0 and
    15B, the free-ion 4F and 4P positions.
  - Term symbols are typeset as real SVG <tspan> runs with per-run dy and fontSize
    (lines 64-76), giving true superscript multiplicities and true subscript Mulliken
    labels in the curve labels, the subtitle and the complex annotation - the library's
    own text markup, as the Notes ask.
  - Six direct per-curve labels in each series' own color replace a legend entirely,
    and the spin classes carry redundant encoding (4.2 px solid quartets against 2.4
    px dashed doublets via sx on .MuiLineElement-series-{id}) - the double encoding
    the style guide calls for at six series.
  - 'Idiomatic MUI X community composition: ChartContainer with LinePlot, ChartsXAxis,
    ChartsYAxis, ChartsGrid and ChartsReferenceLine as children, plus useDrawingArea/useXScale/useYScale
    hooks to place the custom SVG overlays in the chart''s own coordinate space.'
  - ChartsTooltip trigger="axis" gives the HTML detail view a cross-series read-out
    of all six term energies at one Do/B - exactly the operation a chemist performs
    on this diagram (static PNG unaffected, 5e).
  - 'Data is real literature chemistry: Cr3+ d3 at C/B = 4.5 with [Cr(H2O)6]3+ placed
    at Do = 17 400 cm-1 against B = 700 cm-1, and the two drawn bands are that complex''s
    actual nu1 and nu2 d-d transitions.'
  - 'Theme handling is exact and verified by pixel sampling: backgrounds are #FAF8F1
    and #1A1A17, and the six data colors (#009E73, #C475FD, #4467A3, #BD8233, #AE3030,
    #2ABCCD) are byte-identical between the two renders - only chrome flips.'
  weaknesses:
  - 'SC-02 (both): the nu1 and nu2 transition arrows are drawn at x +/- 12 px from
    the example line but terminate at each term''s energy at the exact Do/B = 24.9,
    so the nu1 head pokes about 12 px (0.5 E/B) above the 4T2g curve and the nu2 head
    stops about 12 px short of 4T1g(F) instead of landing on it -> evaluate each term
    at the arrow''s own x (about Do/B 24.4 and 25.4) so both heads touch their curve.
    Likely cause: `yScale(term.energy(EXAMPLE_FIELD))` in `ExampleComplex` (lines
    132 and 136) ignores the `dx` offset applied to x1/x2.'
  - 'VQ-01 (both): the subtitle carries the whole solid-vs-dashed encoding key (''spin-allowed
    quartets solid, spin-forbidden doublets dashed'') at fontSize 15 on the 1200 px
    mount, the same size as the tick labels, so the key is the first thing to go in
    the 400 px srcset preview -> about 17 px (+2 px) and a clearer step below the
    22 px title. Likely cause: the subtitle `<text ... fontSize={15}>` on line 198.'
  - 'Suggestion: the comment above `t1gEigenvalues` claims the matrix ''keeps a 12B
    gap at d = 9''; the two diagonal elements 1.8d and 15 + 1.2d are closest at d
    = 25, where the eigenvalue gap is 2 x 0.4 x 25 = 20B - worth correcting so the
    comment matches the matrix it documents.'
  - 'Suggestion: with the 15 %-ink grid already providing the ruler the Notes ask
    for, the 7 px tick marks on both axes could go, per the style guide''s decoration-removal
    checklist.'
  - 'Suggestion: a third spin-forbidden doublet (2T1g) would push the curve count
    off the 6-curve floor of the spec''s 6-12 range and fill the sparse upper-left
    of the panel.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled at exactly #FAF8F1 (250, 248, 241) across the panel and the margins; no pure white anywhere, and the chart surface is transparent so the mount color shows through as intended.
      Chrome: title "line-tanabe-sugano · javascript · muix · anyplot.ai" in bold near-black (t.ink) centred over the panel; a single subtitle line "d³ (Cr³⁺) in an octahedral field · C/B = 4.5 · spin-allowed quartets solid, spin-forbidden doublets dashed" in soft grey (t.inkSoft) with d³ and Cr³⁺ as true superscripts; x-axis title "Ligand-field strength Δ_o / B" with a true subscript o, y-axis title "Term energy E / B" rotated on the left; tick labels 0/5/.../40 and 0/10/.../90 in soft grey; a very faint solid grid on both axes at roughly 15 % ink, clearly behind the curves. A dashed grey vertical line at Δ_o/B ≈ 24.9 with the rotated annotation "[Cr(H₂O)₆]³⁺ · Δ_o / B = 24.9" running up its left side, and two thin grey arrows labelled ν₁ and ν₂ rising from the baseline. All chrome text is clearly readable against the light background; no light-on-light anywhere.
      Data: six term curves, first series brand green #009E73 (verified by pixel sample) as the flat ⁴A₂g ground term lying visibly along E/B = 0; then lavender #C475FD ⁴T₂g rising linearly to 40, blue #4467A3 ⁴T₁g(F) rising with visible curvature to ~50.7, ochre #BD8233 ⁴T₁g(P) from 15 at zero field to ~84 — the two ⁴T₁g curves bend away from each other and never cross. The two spin-forbidden doublets are thinner dashed lines: matte red #AE3030 ²Eg at 22.5 and cyan #2ABCCD ²T₂g at 28.5. Every curve carries its term symbol in its own color just outside the right edge, with true superscript multiplicity and subscript Mulliken label. Spin-allowed strokes are visibly thicker (4.2 px) than spin-forbidden (2.4 px).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, sampled at exactly #1A1A17 (26, 26, 23); not pure black.
      Chrome: identical layout. Title now in light ink #F0EFE8, subtitle, tick labels, the reference line, the ν₁/ν₂ arrows and the rotated complex annotation in the dark-theme soft ink #B8B7B0, axis titles in #F0EFE8. Grid flips to rgba(240,239,232,0.15) and stays subtle but visible. No dark-on-dark failure anywhere — every title, axis title, tick label, arrow label and annotation reads cleanly against the near-black surface. Tick marks and the L-shaped axis lines are visible but restrained.
      Data: data colors are identical to the light render — pixel sampling along the same column returns exactly #009E73, #C475FD, #4467A3, #BD8233, #AE3030 and #2ABCCD in both PNGs, so only chrome flipped. Brand green #009E73 for the ⁴A₂g ground line reads strongly against the dark page. Curve labels use the same six hues; the #4467A3 ⁴T₁g(F) and #AE3030 ²Eg labels are the lowest-contrast of the six but remain legible at their rendered 40 device px, and each sits directly beside the curve it names, so identification never rests on color alone.
      Legibility verdict: PASS
