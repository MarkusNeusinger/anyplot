review:
  strengths:
  - Energies come from a real diagonalization of all d3 Tanabe-Sugano blocks at C/B
    = 4.5; free-ion limits (4P 15, 2G 17.5, 2P/2H 22.5, 2D 24.9/60.1, 2F 37.5) all
    land correctly
  - Term symbols are typeset as SVG tspans with a true superscript multiplicity and
    subscript numeral and g, bold for spin-allowed and regular for spin-forbidden
  - Right-edge labels are de-collided with colored leader lines, and curves that leave
    through the ceiling are labeled where they exit
  - Composes ChartsContainer, LinePlot, ChartsGrid and ChartsReferenceLine with a
    custom layer driven by the useXScale/useYScale hooks
  - Optional example complex [Cr(H2O)6]3+ with ν1/ν2 arrows reproduces the observed
    band ratio of about 1.40
  weaknesses:
  - 'Suggestion: the example complex''s dashed marker at Δo/B = 24.9 reads like a
    crossover line at first glance; a short label at its top end (or a dotted rather
    than dashed style) would tell it apart on a d3 diagram.'
  - 'Suggestion: the ν1/ν2 arrows sit about ±0.3 Δo/B units either side of the marker;
    drawing them closer to the marker would keep the ν2 tip exactly on the 4T1g(F)
    curve.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas with a near-square plot area.
