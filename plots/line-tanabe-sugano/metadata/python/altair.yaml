review:
  strengths:
  - Term energies come from np.linalg.eigvalsh on the actual d2 Tanabe-Sugano 2x2
    blocks at C/B = 4.42 (lines 32-84), so the 3T1g(F)/3T1g(P) and 1T2g(D)/1T2g(G)
    pairs repel as genuine avoided crossings, the three triplet terms converge correctly
    to E/B = 0 at zero field, and 3T1g(P) starts at the textbook 15B separation -
    no hand-fitted curves anywhere, exactly as the Notes demand
  - Idiomatic altair encodes the spin class three ways at once - color, strokeDash
    and strokeWidth on spin_class:N - while detail='term:N' keeps the nine curves
    as separate lines, and Vega merges the color and strokeDash legends into one two-entry
    key whose glyphs match the marks in both themes
  - Direct right-edge term labels as a layered mark_text in each curve's own color
    (lines 147-156) replace what would otherwise be a nine-entry legend, with the
    x-scale padded to 47 to open a dedicated label gutter
  - Per-point alt.Tooltip on term, delta_o/B and E/B makes the HTML export readable
    curve by curve - real added value in the interactive detail view that the PNG
    cannot show
  - Theme tokens are threaded through every non-data element (page and view fill,
    grid, ticks, axis and title ink, elevated legend fill), and the pad-only PIL block
    lands the file exactly on 2400x2400 without cropping
  weaknesses:
  - 'VQ-01 (both): the right-edge term labels are the chart''s primary reading aid
    but render at fontSize 11 (~44 source px), one notch above the tick labels and
    smaller than the axis titles, and the lavender #C475FD labels sit below 3:1 contrast
    on the #FAF8F1 page, so the spin-forbidden symbols blur first when the 2400 px
    square is scaled to the 400 px mobile variant → about 13 px (+2 px). Likely cause:
    mark_text(align=''left'', baseline=''middle'', fontSize=11, dx=7) in term_labels.'
  - 'Suggestion: the 1Eg block is a 2x2 but only its lower eigenvalue is drawn, while
    both 1T2g roots are, so the singlet set is slightly asymmetric; drawing both 1Eg
    roots would make the term list uniform.'
  - 'Suggestion: the x-domain runs to 47 while the last tick is at 40, leaving a stretch
    of unlabelled axis line under the label gutter; a slightly tighter domain would
    tidy that edge.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas; plot view fill matches the page, no frame box, only the left and bottom axis domain lines in soft ink.
      Chrome: bold near-black title "line-tanabe-sugano · python · altair · anyplot.ai" top-left, two softer subtitle lines ("d² octahedral ion (V³⁺) at C/B = 4.42", "E/B measured from the ³T₁g(F) ground term"); y-axis title "E/B — reduced term energy" rotated at left, x-axis title "Δₒ/B — reduced ligand-field strength" centered at the bottom; ticks 0/20/40/60/80 and 0/10/20/30/40 in soft grey; horizontal + vertical grid lines at about 15% opacity, clearly behind the curves. A small elevated-cream legend box sits top-left inside the plot with a thick green line sample ("Spin-allowed (ΔS = 0)") and a thin dashed lavender sample ("Spin-forbidden (ΔS ≠ 0)"). All chrome text is dark on light — readable, nothing light-on-light.
      Data: nine term curves for the d² ion. Four thick solid brand-green #009E73 curves (spin-allowed): ³T₁g(F) flat along E/B = 0, ³T₂g rising to about 38, ³T₁g(P) to about 51, ³A₂g steepest to about 77; three triplets leave the origin together at zero field. Five thinner dashed lavender #C475FD curves (spin-forbidden): ¹T₂g(D) and ¹Eg near-coincident around E/B ≈ 15, ¹A₁g bending from 21 to about 34, ¹T₂g(G) to 55 and ¹T₁g to 58. Each curve carries its term symbol in its own color in the right-hand gutter, with Unicode superscript multiplicity and subscript numerals. First series colour is #009E73 as required.
      Legibility verdict: PASS (the lavender term labels at fontSize 11 are the lowest-contrast text on the cream page and the first thing to go at the 400 px thumbnail width, but every element is legible at full size).

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black; identical layout and canvas size.
      Chrome: title in near-white #F0EFE8, subtitles and tick labels in the lighter secondary ink #B8B7B0, axis titles light against the dark page; grid lines are pale ink at ~15% and stay subtle but visible; the legend box flips to the elevated #242420 fill with light label text. No dark-on-dark anywhere — every title, subtitle, axis title and tick label flips to light ink.
      Data: colors are identical to the light render — the same #009E73 for the four spin-allowed curves and the same #C475FD for the five spin-forbidden dashed curves, same dash pattern and stroke widths, same right-edge term labels in matching colors. Only the chrome flipped. Brand green remains clearly visible on the near-black surface.
      Legibility verdict: PASS
