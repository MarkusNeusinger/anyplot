review:
  strengths:
  - Diagonalises the Tanabe-Sugano 2×2 symmetry blocks with np.linalg.eigvalsh broadcast
    over all 301 field strengths (lines 32–70), so the ³T₁g(F)/³T₁g(P) and ¹T₂g(D)/¹T₂g(G)
    pairs repel by construction and same-symmetry curves can never cross or swap identity
    — the Notes' "no hand-fitted splines" requirement satisfied at the source rather
    than by eyeballing.
  - 'Idiomatic Vega-Lite grammar: detail="term:N" splits a single mark_line into nine
    curves while color, strokeDash and strokeWidth all key off spin_class, and Vega-Lite
    merges the colour and dash channels into one two-row legend — a result a per-term
    Python loop could not produce.'
  - Right-edge term labels are a layered text mark coloured from the same spin_class
    scale, so each symbol carries its curve's hue and stays attributable even where
    ¹Eg and ¹T₂g(D) run nearly coincident at E/B ≈ 15.
  - 'Theme chrome threaded end to end through PAGE_BG / ELEVATED_BG / INK / INK_SOFT:
    both renders sit on the correct surfaces (#FAF8F1 / #1A1A17 verified at the pixel
    level), the Imprint green #009E73 and lavender #C475FD are identical between themes,
    and the elevated legend fill reads on both.'
  - Native tooltip channel (term, Δₒ/B, E/B) turns the HTML export into the lookup
    tool a chemist actually uses a Tanabe-Sugano diagram for — matching band ratios
    against curves — without costing the static PNG anything.
  - Canvas lands exactly 2400×2400 via the pad-only block with the fail-loud SystemExit
    guard (lines 203–214), never a crop, and both PNG and HTML are saved per the altair
    output contract.
  weaknesses:
  - 'VQ-01 (both): legend labels and axis tick labels are set at fontSize 10, which
    lands at roughly 7 px once the 2400 px square is scaled to the 400 px gallery
    thumbnail — below the mobile-readable floor, while the term labels next to them
    sit at 13 → about 12 for both (+2). Likely cause: configure_legend(labelFontSize=10)
    on line 193 and configure_axis(labelFontSize=10) on line 184.'
  - 'DQ-01 (both): no avoided crossing is actually visible — the ¹T₂g(D)/¹T₂g(G) pair
    reach closest approach at Δₒ/B ≈ 1 already about 7 E/B apart and the ³T₁g(F)/³T₁g(P)
    pair diverge straight from the origin, so the curved near-touch the Notes single
    out never appears in the drawn window → pick a configuration or root selection
    where one same-symmetry pair closes to within about 2 E/B inside 0–40. Likely
    cause: the d² singlet blocks'' off-diagonal 2√3 (lines 39, 51) and the ¹Eg / ¹A₁g
    upper roots left out of term_energies (lines 74–84).'
  - 'Suggestion: drawing the upper ¹Eg and ¹A₁g roots would make the singlet set complete,
    at the cost of a taller E/B window.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, pixel-sampled at #FAF8F1 (250, 248, 241) — not pure white, not dark. Canvas exactly 2400x2400 (square target).
      Chrome: bold near-black title "line-tanabe-sugano · python · altair · anyplot.ai" at the top left spanning about 57% of canvas width, with a two-line soft-ink subtitle "d² octahedral ion (V³⁺) at C/B = 4.42" and "E/B measured from the ³T₁g(F) ground term". Y-axis title "E/B — reduced term energy" rotated at the left, x-axis title "Δₒ/B — reduced ligand-field strength" centred at the bottom; ticks 0/20/40/60/80 and 0/10/20/30/40 in soft grey. Horizontal and vertical grid lines are present at the tick values at low opacity, clearly behind the curves. A legend box with an elevated off-white fill sits inside the plot at the top left, carrying a thick solid green line sample labelled "Spin-allowed (ΔS = 0)" and a thinner dashed lavender sample labelled "Spin-forbidden (ΔS ≠ 0)". All text is readable against the light background; nothing is light-on-light, nothing is clipped at any canvas edge.
      Data: nine term curves for the d² ion. Four spin-allowed triplets in Imprint green #009E73 drawn thick and solid — ³T₁g(F) flat along E/B = 0 on the x-axis, ³T₂g rising from the origin to about 38, ³T₁g(P) starting at 15 and rising to about 50, ³A₂g rising from the origin to about 78. Five spin-forbidden singlets in Imprint lavender #C475FD drawn thinner and dashed — ¹Eg and ¹T₂g(D) nearly coincident and almost flat at about 14–15, ¹A₁g and ¹T₁g and ¹T₂g(G) starting near 21 and fanning up to about 34, 58 and 55. Every curve is labelled at the right edge with its term symbol in its own series colour, multiplicity as a Unicode superscript and the numeral as a Unicode subscript, g on the baseline. First series colour is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, pixel-sampled at #1A1A17 (26, 26, 23) — not pure black, not light. Canvas exactly 2400x2400.
      Chrome: identical layout. Title and y/x axis titles render in light ink (#F0EFE8), subtitle and tick labels in the softer #B8B7B0 — all clearly readable against the near-black surface. No dark-on-dark anywhere: no title, subtitle, axis title, tick label, legend label or term label is drawn in a near-black ink. Grid lines flip to a faint light stroke, still subtle and still behind the curves. The legend box flips to the elevated #242420 surface and both its line samples remain plainly visible.
      Data: colours are identical to the light render — the four spin-allowed curves are the same Imprint green #009E73 and the five spin-forbidden curves the same lavender #C475FD, at the same stroke widths and the same dash pattern; only the chrome flipped. Brand green #009E73 reads strongly on the dark surface, including the ground-term line sitting on the x-axis. Right-edge term labels keep their series colours and stay readable.
      Legibility verdict: PASS
