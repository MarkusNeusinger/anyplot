review:
  strengths:
  - 'Term energies come from diagonalizing the d7 Tanabe-Sugano matrices with np.linalg.eigvalsh
    rather than from fitted splines, and the free-ion limit comes out right: the three
    4F-derived terms are degenerate at E/B = 0 at zero field, 4T1g(P) starts at 15
    B, and the lowest doublet starts near 17.6 B (4B + 3C at C/B = 4.633).'
  - Ascending eigenvalues per symmetry block guarantee the structural requirement
    that terms of the same symmetry and multiplicity never cross but only approach,
    visible as the near-touch of the two doublets around E/B = 19 in both renders.
  - 'Idiomatic seaborn: a single sns.lineplot with units="term", estimator=None and
    hue/style/size all mapped to the spin class draws all nine curves plus a correct
    two-entry legend in one call, with dashes= and sizes= dicts giving the spec''s
    thick-solid / thin-dashed split.'
  - 'The crossover is handled end to end: the ground term switches from high-spin
    4T1g(F) to low-spin 2Eg at Delta_o/B = 21.7 (computed with np.interp, not hard-coded),
    every curve kinks exactly at the annotated dashed line, and 2Eg takes over the
    flat E/B = 0 baseline there.'
  - 'Theme tokens are threaded through sns.set_theme(rc=...) so both renders are fully
    theme-correct (#FAF8F1 / #1A1A17 backgrounds measured exactly, light chrome on
    dark) while the Imprint data colors #009E73 and #C475FD stay identical between
    themes; right-edge term labels are mathtext and colored by spin class.'
  - 'Visual hierarchy reads immediately: thick brand-green quartets against thin dashed
    violet doublets, a subtle 0.15-alpha grid behind the curves, top and right spines
    removed, and a near-square axes box as the Notes ask.'
  weaknesses:
  - 'VQ-01 (both): the crossover annotation at 8 pt in INK_MUTED and the right-edge
    term labels at 9 pt are the first elements to go when the 2400x2400 canvas is
    scaled to the 400 px mobile preview - the mathtext super/subscripts of the term
    symbols smear and the annotation''s second line is barely readable -> 10 pt for
    both (+2 pt on the annotation, +1 pt on the labels) and INK_SOFT instead of INK_MUTED
    for the annotation. Likely cause: fontsize=8, color=INK_MUTED on the ax.text at
    lines 169-178 and fontsize=9 on the term labels at lines 186-189.'
  - 'Suggestion: the Notes'' optional example-complex marker - a second vertical line
    at a real Co(II) complex''s Delta_o/B with arrows from the ground term up to the
    excited quartets - would show how the diagram is read in practice.'
  - 'Suggestion: a slightly wider right margin would let the 2T2g and 2T1g labels
    sit at their own curve ends instead of being pushed apart by the 2.6-unit minimum
    spacing.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, measured #FAF8F1 at the canvas corner (RGB 250,248,241) - not pure white. Canvas 2400x2400 px (square target, gate passed). Near-square axes box (~1848x2016 px), ink bounds cols 68-2289 / rows 49-2340, so nothing touches a canvas edge.
      Chrome: title "Co^2+ d^7, C/B = 4.63 . line-tanabe-sugano . python . seaborn . anyplot.ai" in dark ink at the top, spanning 83% of the canvas width (measured) - inside the 70-85% band expected for the mandated title. X label "Ligand-field strength Delta_o/B" and Y label "Term energy above ground term E/B" in dark ink, visually balanced in size. Tick labels 0-30 (step 5) on x and 0-70 (step 10) on y in soft dark grey, balanced between the two axes. Light grid at alpha 0.15 sits behind the curves. Top and right spines removed; legend box top-left on the elevated #FFFDF6 surface with a grey frame, two entries ("spin-allowed (quartet)" thick green line sample, "spin-forbidden (doublet)" thin dashed violet line sample) - both glyphs clearly visible and matching their curves. A grey dashed vertical line at Delta_o/B = 21.7 carries the right-aligned two-line annotation "high-spin -> low-spin / Delta_o/B = 21.7" at the top; it sits clear of the legend and of every curve.
      Data: nine term curves. Four spin-allowed quartets in Imprint brand green #009E73 as thick solid lines - 4T1g(F) flat along E/B = 0 up to the crossover then rising to ~8, 4T2g to 36, 4T1g(P) to 49, 4A2g to 66. Five spin-forbidden doublets in Imprint position-2 violet #C475FD as thinner dashed lines - 2Eg descending from ~17.6 to 0 exactly at the crossover and then running flat along the axis as the new ground term, 2T1g and 2T2g near-touching around E/B = 19, 2A1g to 54, 2A2g to 74. Every curve kinks at the dashed crossover line. Each curve is labeled at the right edge with a mathtext term symbol (true superscript multiplicity, true subscript numeral + g), colored by spin class; all labels are fully inside the canvas with no clipping and no overlap.
      Legibility verdict: PASS - title, both axis titles, all tick labels, legend text, the crossover annotation and all nine term labels are clearly readable against the off-white background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: warm near-black, measured #1A1A17 at the canvas corner (RGB 26,26,23) - not pure black. Same 2400x2400 canvas and identical ink bounds as the light render.
      Chrome: identical layout. Title, axis titles and tick labels all flip to light ink (#F0EFE8 / #B8B7B0) and read cleanly against the near-black surface - no dark-on-dark anywhere, including the tick labels, which are the usual failure point. Grid is a faint light grey at alpha 0.15, subtle but visible. The legend box sits on the elevated #242420 surface with a light grey frame and light text; both line-sample glyphs are visible. The crossover dashed line and its annotation flip to light grey #A8A79F and remain readable.
      Data: colors are identical to the light render - spin-allowed quartets still #009E73 (brand green reads well on the dark surface), spin-forbidden doublets still #C475FD; line widths, dash pattern, curve shapes, crossover position and right-edge mathtext labels are unchanged. Only the chrome flipped.
      Legibility verdict: PASS - no dark-on-dark text; every text element and both data colors are clearly distinguishable from the background.
