review:
  strengths:
  - 'Term energies come from diagonalizing the 2x2 Tanabe-Sugano blocks with np.linalg.eigvalsh
    rather than hand-fitted curves, so the same-symmetry roots stay ordered and the
    d2 physics is right: 3T2g and 3A2g both leave the origin, 3T1g(P) starts at E/B
    = 15, and 3A2g reaches E/B = 77.7 at the right edge, all measured from the 3T1g(F)
    ground term.'
  - The ground term is drawn as a visible thick green line along E/B = 0 instead of
    being omitted as a baseline, exactly as the Notes ask.
  - Spin-allowed triplets read as thick solid brand-green lines and spin-forbidden
    singlets as thin dashed lavender ones (scale_linetype_manual + scale_size_manual
    on the same variable), so the two classes are separable by weight, dash and hue
    in both themes.
  - Mapping color, linetype and size to one variable collapses them into a single
    two-entry plotnine legend, and geom_text on a right-edge subset labels all nine
    curves directly, so no nine-entry legend is needed.
  - Mathtext labels typeset the multiplicity as a true superscript and the numeral
    and g as true subscripts, both on the curve labels and in the axis titles (Delta_o/B,
    E/B) and the subtitle (V^3+ d^2, C/B = 4.42).
  - Theme tokens are threaded through plot_background, panel_background, grid, axis
    lines, titles and the elevated legend fill, so the dark render flips only chrome
    and keeps the Imprint data colors identical.
  - Square 2400x2400 canvas with both axes starting at 0 and a 15 % ink grid behind
    the curves matches the near-square, ruler-friendly layout the Notes ask for.
  - No functions or classes, deterministic (no RNG at all), every import used, and
    the save call writes plot-{THEME}.png at the canonical 6 in x 6 in / 400 dpi.
  weaknesses:
  - 'SC-02 (both): the 1Eg(D) and 1T2g(D) curves both end at E/B = 15.2 but their
    labels are pushed +2.2 and -2.2 away from that value, so neither label sits on
    the curve it names and a reader cannot tell which dashed line is which -> set
    each label at its own curve''s end value, or label this pair along the curve near
    Delta_o/B = 3 where the two are still visibly apart (the Notes allow along-curve
    labels where the plot is crowded). Likely cause: the `nudge` map applied to `curve_ends`
    in lines 87-95.'
  - 'VQ-01 (both): the right-edge term labels lose their superscripts and subscripts
    once the square render is scaled to the 400 px thumbnail - 1T2g(D) and 1A1g(G)
    blur into a single glyph run -> about size=10 (+2). Likely cause: geom_text(...,
    size=8) on line 102.'
  - 'DQ-01 (both): the window filter drops 1Eg(G) and 1A1g(S) entirely, so every singlet
    drawn is a lone lower root and the diagram never shows a same-symmetry avoided-crossing
    near-touch, even though the 2x2 blocks already compute both roots -> keep the
    upper partners and let the y window clip them where they leave the frame. Likely
    cause: `terms = terms.loc[:, terms.max() <= 80]` on line 75.'
  - 'Suggestion: the Notes'' optional example-complex marker - a vertical line at
    a measured V3+ complex''s Delta_o/B with arrows from the ground term up to the
    excited terms - would connect the curves to a real UV-Vis spectrum.'
  - 'Suggestion: current plotnine spells line thickness `linewidth` (with scale_linewidth_manual);
    `size` on geom_line is the older alias.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across both the panel and the outer canvas, no pure white; a 2400x2400 square canvas.
      Chrome: title "line-tanabe-sugano · python · plotnine · anyplot.ai" in near-black ink at the top left, spanning about 72 % of the width; subtitle "V3+ d2 in an octahedral field, C/B = 4.42" below it in softer grey with true superscripts; y-axis title "Term energy E/B" and x-axis title "Ligand-field strength Delta_o/B" both in dark ink with mathtext symbols; tick labels 0-40 by 5 on x and 0-80 by 10 on y in grey, all crisply readable; thin L-shaped axis lines, no tick marks, faint grey grid at roughly 15 % ink on both axes. A two-row legend box sits inside the empty upper-left area on an elevated #FFFDF6 fill, labelled "Spin-allowed (triplet)" (thick green solid sample) and "Spin-forbidden (singlet)" (thin lavender dashed sample). All text is readable; nothing is light-on-light and nothing is clipped at any canvas edge.
      Data: nine curves. Four thick solid brand-green #009E73 triplets - 3T1g(F) flat along E/B = 0, 3T2g and 3A2g rising from the origin to about 37.7 and 77.7, and 3T1g(P) from 15 to 50.4 - and five thin dashed lavender #C475FD singlets: 1Eg(D) and 1T2g(D) near-coincident just above E/B = 15 across the whole width, 1A1g(G) flattening toward 34.6, and 1T2g(G) and 1T1g(G) climbing to about 55 and 58.5. Curves of different symmetry cross freely (3A2g over the singlets near Delta_o/B = 13-21); the same-symmetry pairs never cross. Each curve is labelled at the right edge in its own series color. First series is #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 on panel and canvas, not pure black; same square 2400x2400 canvas.
      Chrome: title and axis titles flip to light ink #F0EFE8, subtitle, tick labels and legend text to #B8B7B0 - every one of them clearly readable against the near-black surface, no dark-on-dark anywhere. Grid lines become faint light rules at the same low alpha, still subtle but visible; axis lines are soft grey. The legend box sits on the elevated #242420 fill with its frame blending into that fill, and both legend samples (thick green solid, thin lavender dashed) are plainly visible. No element is clipped at any edge.
      Data: identical to the light render - the same nine curves at the same positions, same #009E73 green for triplets and #C475FD lavender for singlets, same line weights and dash patterns, same right-edge labels in their series colors. Only chrome flipped; brand green reads well on the dark surface.
      Legibility verdict: PASS
