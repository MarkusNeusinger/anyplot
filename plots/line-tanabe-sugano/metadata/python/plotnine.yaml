review:
  strengths:
  - 'Term energies come from the real d2 Tanabe-Sugano matrices rather than hand-fitted
    splines: at Delta_o/B = 0 the eigenvalues reproduce the free-ion terms exactly
    (3F = -8B, 3P = +7B, 1D = -3B + 2C, 1G = 4B + 2C, 1S = 14B + 7C), and np.linalg.eigvalsh
    on each 2x2 same-symmetry block (lines 54-69) keeps every pair an avoided crossing
    that never swaps identity.'
  - All eleven terms of the d2 configuration are drawn (3F -> 3T1g/3T2g/3A2g, 3P,
    1D -> 1Eg/1T2g, 1G -> 1A1g/1Eg/1T1g/1T2g, 1S), with the ground 3T1g(F) a visible
    thick line along E/B = 0 rather than an omitted baseline.
  - 'Mapping color, linetype and size to the same `spin` factor is the plotnine/ggplot
    merged-guide idiom: the single bottom legend draws a thick solid #009E73 key and
    a thin dashed #C475FD key that match the curves exactly, in both themes.'
  - Theme tokens are threaded through plot background, panel background, major grid,
    axis line, axis titles, tick text, title, subtitle and legend, so both renders
    are theme-correct with identical data colors and only the chrome flipping.
  - Term labels are typeset with matplotlib mathtext through geom_text, so the multiplicity
    is a true superscript and the Mulliken numeral and g a true subscript; the two
    near-coincident 1D-derived curves and the two window-leaving upper partners are
    labelled along the curve instead of in the right gutter, each resting on the line
    it names.
  weaknesses:
  - 'VQ-01 (both): axis tick labels are the smallest text on the 2400x2400 canvas
    at 8 pt and fall to roughly 7 px in the 400 px thumbnail, below the 9-10 pt the
    rest of the chrome sits at -> about 9-10 pt (+1 to +2 pt). Likely cause: axis_text=element_text(size=8)
    in the theme block (line 140).'
  - 'Suggestion: the x-axis line runs about 7.5 Delta_o/B past the last tick at 40
    into the empty label gutter; ending it at the last tick would tidy the lower right.'
  - 'Suggestion: the band of empty space between the x-axis title and the legend box
    is generous even for this style; a smaller legend_margin would tighten the lower
    third of the square canvas.'
  - 'Suggestion: a more distinctive plotnine idiom - for example coord_fixed() to
    lock the near-square panel aspect the Notes ask for, instead of leaning on figure_size
    alone - would show more of the library.'
  image_description: |-
    Light render (plot-light.png): 2400x2400 px square canvas.
      Background: warm off-white #FAF8F1 across both the plot background and the panel — not pure white, not dark. Major grid only, drawn in INK at alpha 0.15, so it stays clearly behind the curves; no minor grid, no panel border.
      Chrome: title "line-tanabe-sugano · python · plotnine · anyplot.ai" in near-black at the top left, spanning roughly 67 % of the canvas width; subtitle "V³⁺ d² in an octahedral field, C/B = 4.42" below it in soft ink. Axis titles "Ligand-field strength Δ_o/B" (x) and "Term energy E/B" (y) in near-black, visually balanced in size; tick labels 0,5,…,40 and 0,10,…,80 in soft grey. Thin left and bottom axis lines, no ticks. A faint elevated-surface legend box at the bottom centre with two keys: a thick solid green line "Spin-allowed (triplet)" and a thin dashed purple line "Spin-forbidden (singlet)". All text is clearly readable against the light background; nothing is light-on-light and nothing is clipped at any canvas edge.
      Data: eleven term curves. The four triplets are thick solid #009E73 (Imprint position 1, the first series): the ground ³T₁g(F) flat along E/B = 0 the full width of the panel, ³T₂g and ³A₂g both rising from the origin to about 37.8 and 77.5, and ³T₁g(P) from 15 to about 50. The seven singlets are thin dashed #C475FD (Imprint position 2): ¹A₁g(S) from 53 and ¹Eg(G) from 21 both leaving the top of the window, ¹T₁g(G) and ¹T₂g(G) converging near 55–58 at the right, ¹A₁g(G) flattening to about 34.7, and the near-coincident ¹Eg(D)/¹T₂g(D) pair holding at about 15. Same-symmetry pairs curve around each other as avoided crossings and never swap. Each curve carries its term symbol in its own series colour — seven in the right-hand gutter past Δ_o/B = 40, four along the curve — with the multiplicity as a true superscript and the Mulliken numeral and g as true subscripts.
      Legibility verdict: PASS

    Dark render (plot-dark.png): 2400x2400 px square canvas.
      Background: warm near-black #1A1A17 across plot and panel — not pure black, not light. Grid drawn in the light ink token at alpha 0.15, subtle but visible; legend box on the slightly lighter #242420 elevated surface.
      Chrome: title and axis titles in #F0EFE8, subtitle, tick labels and legend text in #B8B7B0 — every one of them clearly readable against the near-black background. No dark-on-dark failure anywhere: no title, axis title, tick label, subtitle or legend label renders in a near-black ink. Nothing clipped at any edge.
      Data: identical to the light render — triplets in #009E73, singlets in #C475FD, same line weights (thick solid vs. thin dashed), same curve geometry, same label positions and same label colours. Only the chrome flipped. The brand green reads strongly on the dark surface and the purple stays clearly separable from it.
      Legibility verdict: PASS
