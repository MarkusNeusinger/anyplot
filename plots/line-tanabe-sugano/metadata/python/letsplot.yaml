      Data: colors are identical to the light render — #009E73 for the four solid spin-allowed curves (legend key sampled (0,158,115), same as light) and #C475FD for the six dashed spin-forbidden curves. Brand green reads clearly against the dark surface, as does the purple. Only chrome flipped; no data color changed.
      Legibility verdict: PASS
