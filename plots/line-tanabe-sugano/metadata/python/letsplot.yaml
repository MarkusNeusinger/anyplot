review:
  strengths:
  - Term energies come from `np.linalg.eigvalsh` applied to the Tanabe-Sugano blocks
    (lines 66-85); because eigvalsh returns eigenvalues in ascending order per block,
    same-symmetry/same-multiplicity pairs (3T1g(F)/3T1g(P), 1Eg(D)/1Eg(G), 1T2g(D)/1T2g(G))
    can never swap identity and their avoided crossings stay curved near-touches by
    construction, exactly as the Notes demand instead of hand-fitted splines.
  - Uses lets-plot's LaTeX text markup (`\(^{3}A_{2g}\)`) in `geom_text`, `labs` title/subtitle
    and both axis titles, so every term symbol carries a true superscript multiplicity
    and true subscript Mulliken label, and the subtitle renders d8 and Ni2+ correctly
    - the markup feature the spec asks for and a genuine lets-plot capability.
  - 'Spin class is triple-encoded: Imprint green #009E73 solid at size 1.9 for spin-allowed
    against lavender #C475FD dashed at size 0.9 for spin-forbidden, so the two classes
    stay separable by hue, dash pattern and weight in both themes and under CVD.'
  - Direct right-edge labels with `geom_segment` leader lines into a dedicated gutter
    replace a 10-entry legend; the label y-positions are spread to a minimum gap so
    every term is readable, and the ground term 3A2g is drawn as a visible flat line
    along E/B = 0 rather than omitted as a baseline.
  - Every chrome element is driven from the ANYPLOT_THEME tokens (plot and panel background,
    grid, axis line, title, subtitle, tick text, legend frame fill and border), while
    the two Imprint data colors are pixel-identical between the light and dark renders.
  weaknesses:
  - 'VQ-05 (both): the panel runs to Delta_o/B = 36.5 while the curves stop at 30,
    so the bottom axis line and the horizontal gridlines continue about 18 % past
    the last tick into the empty label gutter - the 40-gridline runs straight through
    the ''3T1g(F)'' label - leaving a bare axis tail under the term labels -> stop
    the axis line and the grid at the data edge (about -6.5 x-units of bare rule).
    Likely cause: `scale_x_continuous(limits=(0.0, 36.5))` widened to make room for
    the right-edge labels.'
  - 'DQ-03 (both): Delta_o/B is sampled only to 30 while the spec''s Data bullet asks
    for 0-40, so the chart stops short of the field strengths the spec''s domain covers
    -> extend the sampling to 40 (+10 x-units). Likely cause: `DELTA_MAX = 30.0` on
    line 51.'
  - 'Suggestion: configuring `tooltips=layer_tooltips().line(''^group'').format(...)`
    on the two `geom_line` layers would let the interactive HTML name the term, Delta_o/B
    and E/B under the cursor.'
  - 'Suggestion: drawing the leader segments at a lower alpha than the curves would
    make the label gutter read as chrome rather than as a continuation of the data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across both plot and panel, no pure white anywhere; 2400x2400 square canvas.
      Chrome: title "line-tanabe-sugano · python · letsplot · anyplot.ai" top-left in near-black #1A1A17 at ~65% of canvas width; subtitle "d8 ion (Ni2+) in an octahedral ligand field · C/B = 4.5" below it in soft ink #4A4A44 with d8 as a true superscript and Ni2+ typeset with superscript charge; y-axis title "Reduced term energy E/B" rotated at left, x-axis title "Reduced ligand-field strength Delta_o/B" centred below with a true subscript o; ticks 0/5/10/15/20/25/30 on x and 0/20/40/60/80 on y in soft ink; tick marks removed, L-shaped axis lines only, warm grey grid #D8D7D0 subtle and well behind the curves; framed legend at the bottom on the elevated #FFFDF6 surface showing a solid green line sample "Spin-allowed (ΔS = 0)" and a dashed lavender sample "Spin-forbidden (ΔS ≠ 0)". All text is clearly readable against the light background; nothing is light-on-light and nothing is clipped at any canvas edge.
      Data: ten term curves. Four thick solid brand-green #009E73 curves (spin-allowed triplets) - 3A2g flat along E/B = 0, 3T2g and 3T1g(F) fanning up from the origin, 3T1g(P) starting at E/B = 15 and rising to ~64 - and six thinner dashed lavender #C475FD curves (spin-forbidden singlets) from 1Eg(D) nearly flat at ~17 up to 1T2g(G) at ~81. First series is #009E73 as required. Each curve ends in a short leader segment into a right-edge gutter carrying its term symbol with superscript multiplicity and subscript Mulliken label (3A2g, 3T2g, 3T1g(F), 3T1g(P), 1Eg(D), 1A1g(G), 1T2g(D), 1T1g(G), 1Eg(G), 1T2g(G)), label colored to match its class. Same-symmetry pairs bundle tightly in the lower-left but never cross.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across plot and panel, not pure black; same 2400x2400 square canvas.
      Chrome: identical layout; title and axis titles flipped to light ink #F0EFE8, subtitle, tick labels and legend text to #B8B7B0, grid to #3A3A36, axis lines to the soft light ink, legend frame on the elevated #242420 surface with a grey border. Every chrome element is clearly readable - no dark-on-dark anywhere: the title, subtitle, both axis titles, all ticks and both legend entries sit in light ink on the near-black field, and the legend box is visible as a slightly lighter panel. No clipping at any edge.
      Data: the data colors are identical to the light render - spin-allowed curves are the same brand green #009E73 at the same 1.9 weight, spin-forbidden curves the same lavender #C475FD dashed at 0.9, and the right-edge term labels and their leader segments carry the same two colors. Only chrome flipped. Both hues remain clearly distinguishable from the near-black background.
      Legibility verdict: PASS
