review:
  strengths:
  - Curve energies come from diagonalizing the real d8 Tanabe-Sugano blocks with np.linalg.eigvalsh
    (lines 83-86) rather than hand-fitted splines, and taking the eigenvalues in ascending
    order per block keeps 1Eg(D)/1Eg(G) and 1T2g(D)/1T2g(G) from swapping identity,
    so their avoided crossings stay as near-touches exactly as the Notes require.
  - Term symbols are typeset with lets-plot's LaTeX markup - the regex at line 115
    turns the plain-text keys into \(^{3}T_{1g}\)(P) and the labs() strings carry
    \(d^{8}\), \(Ni^{2+}\) and \(\Delta_{o}/B\) - so multiplicities render as true
    superscripts and the numeral plus g as true subscripts, a lets-plot-specific capability
    the spec's label bullet asks for.
  - The right-hand label gutter (scale_x_continuous(limits=(0, 48.5))) with a per-curve
    leader segment and a 4.2-unit minimum label spacing keeps all ten term labels
    attached to one curve each, even where 1T2g(G) and 1Eg(G) run within 0.15 E/B
    of each other over the whole domain.
  - 'The spin classes carry three redundant encodings at once - #009E73 solid at size
    1.9 against #C475FD dashed at size 0.9 - so the distinction survives greyscale
    and every CVD type, and the ground term 3A2g is drawn as a visible thick line
    along E/B = 0 instead of an omitted baseline.'
  - 'Theme tokens are threaded through every chrome element and the data colors are
    measurably identical between renders (#009E73 and #C475FD sampled in both PNGs);
    only background, ink, grid and legend frame flip, and the dark render has no dark-on-dark
    text anywhere.'
  - Interactive HTML is exported alongside the PNG (ggsave(plot, f'plot-{THEME}.html')),
    so the detail view keeps lets-plot's hover inspection of the individual term curves
    that the static preview cannot show.
  weaknesses:
  - 'DQ-01 (both): the 1A1g(S) term is dropped from the diagram entirely by the ENERGY_MAX
    = 100 filter, although it runs inside the frame from E/B = 53.5 at Delta_o/B =
    0 and only leaves the panel top at Delta_o/B = 30.5 - about 76 % of the plotted
    domain - so the chart shows 10 of the 11 d8 terms where a textbook d8 diagram
    lets that curve exit the top edge instead. Likely cause: the `if (energy - ground).max()
    <= ENERGY_MAX` guard in the pd.concat comprehension (lines 100-101) filters the
    whole series rather than clipping it to the panel.'
  - 'DE-02 (both): each legend glyph sits on a key patch painted in the page color
    (#FAF8F1 light / #1A1A17 dark) against the elevated legend card (#FFFDF6 / #242420),
    so two rectangles one shade off the card are visible behind the line samples ->
    match the card fill. Likely cause: `legend_key` is never set in the theme() block
    (lines 151-168); add legend_key=element_rect(fill=ELEVATED_BG, color=ELEVATED_BG).'
  - 'Suggestion: an optional descriptive prefix on the title ("Tanabe-Sugano diagram
    · line-tanabe-sugano · python · letsplot · anyplot.ai") would name the chart type
    for readers arriving from the gallery.'
  - 'Suggestion: the Notes allow a vertical marker at an example complex''s Delta_o/B
    with arrows from the ground term up to the excited terms; Ni(H2O)6^2+ at Delta_o/B
    around 8.5 would show how chemists read the diagram in reverse.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled (250,248,241)) across both plot and panel — not pure white, not dark. Canvas 2400x2400 (square target, gate passed).
      Chrome: title "line-tanabe-sugano · python · letsplot · anyplot.ai" in near-black #1A1A17 at the top left, spanning roughly 63% of the canvas width; subtitle "d^8 ion (Ni^2+) in an octahedral ligand field · C/B = 4.5" below it in soft ink #4A4A44 with true superscripts. Y-axis title "Reduced term energy E/B" rotated at the left, x-axis title "Reduced ligand-field strength Delta_o/B" centred at the bottom with a true subscript o. Tick labels 0/20/40/60/80/100 on y and 0/10/20/30/40 on x in #4A4A44. A single light y-axis rule at x=0; no bottom rule, no ticks. Grid: faint #D8D7D0 horizontal segments at each y break stopping at Delta_o/B = 40, plus vertical rules at the x breaks — subtle, clearly behind the curves. Legend band at the bottom on an elevated #FFFDF6 card: green solid line sample "Spin-allowed (ΔS = 0)", purple dashed sample "Spin-forbidden (ΔS ≠ 0)". All text is dark on light and fully readable; nothing is light-on-light. Nothing is clipped — the rightmost label ends ~115 px inside the canvas and the legend card's bottom border sits ~9 px above the edge with every pixel present.
      Data: four thick solid curves in brand green #009E73 (sampled (0,158,115) in the legend key) — the ground term 3A2g flat along E/B = 0, then 3T2g, 3T1g(F) and 3T1g(P) rising to 40, 51 and 84. Six thinner dashed curves in Imprint position 2 #C475FD — 1Eg(D) nearly flat at ~17, 1A1g(G) at ~31, 1T2g(D) at ~57, 1T1g(G) at ~61, and the near-coincident 1T2g(G)/1Eg(G) pair reaching ~98. Each curve ends in a short leader segment into a right-hand gutter carrying its typeset term symbol with superscript multiplicity and subscript Mulliken label. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled (26,26,23)) — not pure black, not light. Same 2400x2400 canvas.
