review:
  strengths:
  - 'Term energies come from the real d⁷ Tanabe-Sugano matrices: each symmetry/multiplicity
    block is assembled as a stack of symmetric matrices and diagonalized with np.linalg.eigvalsh
    over all 321 field samples at once, so levels within a block are ascending by
    construction and same-symmetry terms never cross or swap identity — exactly what
    the Notes ask for, with no hand-fitted splines'
  - Bokeh's native LaTeX/MathText support in the Label model typesets every term symbol
    with a true superscript multiplicity and true subscript Mulliken label (⁴T₁g(P),
    ²E_g); each label is color-matched to its curve at the right edge, which is the
    direct-labelling the style guide requires at n=8 series instead of a legend
  - 'The crossover is computed, not hard-coded: np.interp finds where the quartet
    and doublet ground levels meet (Δₒ/B = 21.7, matching the textbook d⁷ value) and
    a Span at level="underlay" draws it as a dashed rule behind the curves, annotated
    in tertiary ink with its value — every curve visibly kinks exactly there'
  - 'A second Title model added via add_layout(..., "above") carries the configuration,
    the C/B ratio and the solid/dashed key (d⁷ octahedral (Co²⁺), C/B = 4.63 · solid:
    spin-allowed quartets · dashed: spin-forbidden doublets), giving a two-level typographic
    hierarchy and replacing a legend box entirely'
  - 'Theme adaptation is exact and measured: backgrounds are #FAF8F1 / #1A1A17, chrome
    flips #1A1A17→#F0EFE8 and #4A4A44→#B8B7B0, and all eight Imprint data colors appear
    with pixel-identical counts in both renders — only chrome changes'
  - 'Follows the bokeh library prompt precisely: 2400×2400 square canvas, toolbar_location=None,
    explicit min_border_* reservations for the 34–42 pt label stack, and the CDP setDeviceMetricsOverride
    viewport pin — the saved PNG measures exactly 2400×2400 with no clipped element'
  - 'Realistic, accurate chemistry: Co²⁺ at C/B = 4.633 is the free-ion Racah ratio,
    the ⁴P term starts at 15B and the doublets at 4B + 3C ≈ 18B above the ⁴F ground
    term, and the ground term is drawn as a visible flat curve along E/B = 0 rather
    than an omitted baseline'
  weaknesses:
  - 'VQ-01 (both): the subtitle that carries the required dⁿ configuration and C/B
    ratio plus the solid/dashed key is set at 30 pt, below the 34 pt secondary-text
    size the tick labels use, and it goes soft in the 400 px thumbnail → 34 pt (+4
    pt). Likely cause: Title(text="d⁷ octahedral …", text_font_size="30pt") in the
    add_layout(..., "above") call.'
  - 'Suggestion: a HoverTool reporting the term symbol and E/B at the cursor would
    give the interactive HTML artifact something the static PNG cannot show.'
  - 'Suggestion: the example-complex marker the Notes list as optional — a vertical
    line at a measured Co²⁺ complex''s Δₒ/B with arrows from the ground term up to
    the excited terms — would tie the diagram to a real UV-Vis spectrum.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled at exactly #FAF8F1 across the border and the plot area (the most common pixel value, 5.40 M of 5.76 M). Not pure white. Canvas 2400x2400 (valid square target).
      Chrome: bold near-black title "line-tanabe-sugano - python - bokeh - anyplot.ai" top-left in #1A1A17, spanning about 55% of the canvas width; a #4A4A44 subtitle under it reading "d7 octahedral (Co2+), C/B = 4.63 - solid: spin-allowed quartets - dashed: spin-forbidden doublets"; axis titles "Ligand-field strength delta_o / B" (bottom, centered) and "Term energy E / B" (left, rotated) in #1A1A17 at 42 pt; tick labels 0/5/10/15/20/25/30 on x and 0..70 on y in #4A4A44 at 34 pt; a solid grid on both axes in #1A1A17 at alpha 0.15 (measured #D8D7D0), subtle but readable; no outline frame, L-shaped axis lines only. All text is clearly readable against the light background; nothing is light-on-light and nothing is clipped at any canvas edge (longest right-edge label ends ~95 px inside the frame).
      Data: eight term curves of a d7 Tanabe-Sugano diagram, E/B against delta_o/B from 0 to 30 on a near-square plot area. First series is the ground term 4T1g(F) in brand green #009E73, drawn as a thick flat line exactly along E/B = 0 up to the crossover and then rising to ~8. The other seven follow the Imprint palette in canonical order: 4T2g lavender #C475FD, 4A2g blue #4467A3 (steepest, reaching 66), 4T1g(P) ochre #BD8233 (starts at 15, ends at 49), 2Eg matte red #AE3030 (descends from 18 to 0 at the crossover, then flat at 0 as the low-spin ground term), 2T1g cyan #2ABCCD, 2T2g rose #954477, 2A1g lime #99B314. Spin-allowed quartets are solid at 12 px, spin-forbidden doublets dashed at 7 px. A grey dashed vertical Span at delta_o/B = 21.7 marks the high-spin/low-spin crossover, annotated above it in #6B6A63; every curve kinks exactly at that line. Each curve is labelled at the right edge with its term symbol typeset by MathJax (true superscript multiplicity, true subscript Mulliken label), in the curve's own color.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, sampled at exactly #1A1A17 (5.40 M pixels). Not pure black. Canvas 2400x2400.
      Chrome: title now #F0EFE8, subtitle and tick labels #B8B7B0, axis titles #F0EFE8, grid #F0EFE8 at alpha 0.15 (measured #3A3A36), crossover Span and its annotation in the light-ink tokens. Every title, axis title, tick label, subtitle and annotation is clearly light-on-dark; there is NO dark-on-dark text anywhere, and the brand green #009E73 ground-term line remains plainly visible on the near-black surface.
      Data: pixel-count comparison confirms the data colors are identical to the light render — #009E73 (22016 vs 22032 px), #4467A3 (28532 vs 28537), #BD8233 (24194 vs 24204), #C475FD (23679 vs 23685), #AE3030 (8682 vs 8681), #2ABCCD (7916 vs 7992), #954477 (8848 vs 8857), #99B314 (9751 vs 9815). Only chrome flipped. Line weights, dash patterns, term labels and the crossover rule are placed identically.
      Legibility verdict: PASS
