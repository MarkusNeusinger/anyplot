review:
  strengths:
  - 'Term energies come from diagonalizing the d³ Tanabe-Sugano matrices at every
    field strength with `np.linalg.eigvalsh` (lines 89–96), not from fitted splines
    as the Notes forbid: the four ²G-derived doublets all converge on E/B ≈ 17.5 at
    Δₒ/B = 0 and ⁴T₁g(F) / ⁴T₁g(P) separate as a genuine avoided crossing of the quartet
    block.'
  - 'Direct curve labeling with pygal''s native `print_labels` plus the per-point
    `{"value": …, "label": …}` dict (lines 177–181) replaces a legend entirely, and
    the ²Eg label is anchored at Δₒ/B = 30 instead of 40 so it does not pile onto
    the converged right edge.'
  - 'Spin-allowed and spin-forbidden terms carry two independent cues — per-series
    `stroke_style={"dasharray": "26, 20"}` and a thinner stroke — so the two classes
    are told apart without relying on color, and the ⁴A₂g ground term sits as a visible
    brand-green line along E/B = 0 exactly as the Notes ask.'
  - 'Theme handling is complete: one `Style` object carries every token and pygal''s
    `css=["file://style.css", "file://graph.css", "inline:…"]` hook (lines 116–123,
    155) overrides the hard-coded black label fill. Sampled pixels confirm the data
    colors are byte-identical across renders (#009E73, #C475FD, #4467A3, #BD8233,
    #AE3030, #2ABCCD, #954477, #99B314) while only the chrome flips between #FAF8F1
    and #1A1A17.'
  - Both `plot-{theme}.png` and `plot-{theme}.html` are written, so the HTML detail
    view keeps pygal's native per-point tooltips over all 241 samples of every curve.
  weaknesses:
  - 'SC-02 (both): pygal drops every curve label below its anchor point, so the ²T₁g
    label at Δₒ/B = 40 lands about 25 px under the red ²Eg curve rather than beside
    its own cyan curve (the two curve ends are only ~17 px apart), and the label reads
    as belonging to the wrong term → anchor ²T₁g where the two curves separate (around
    Δₒ/B = 8–12) or lift it with the same `transform:translate` trick used for the
    ground term. Likely cause: `label_at = 40.0` for ²T₁g in `term_curves` with no
    entry in the lift CSS.'
  - 'VQ-03 (both): the spin-forbidden curves are pinned to `stroke-width:5` against
    the spin-allowed 11, so at the 400 px preview width they fall below one device
    pixel and the dashes read as faint grey hairlines → about 7 (+2), which still
    keeps them clearly thinner than the solid quartets. Likely cause: `stroke-width:5
    !important` in `extra_css` (line 120).'
  - 'DQ-01 (both): only the lowest eigenvalue of each doublet block is drawn (`doublet_e[:,
    0]`, `doublet_t1[:, 0]`, `doublet_t2[:, 0]`), so no pair of same-symmetry doublets
    is on the chart and the near-touch the diagonalization exists for is never shown
    — the four doublet curves simply fan out → add the second branch of the ²T₁g and
    ²T₂g blocks, which keeps the curve count at 10, inside the spec''s 6–12. Likely
    cause: `term_curves` (lines 101–110) takes index 0 of every block.'
  - 'Suggestion: tick labels and curve term symbols sit at 44 and 46 units on the
    2400 px canvas; a couple of units more on the term symbols would hold up better
    in the 400 px gallery thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 canvas and the plot area alike (sampled: #FAF8F1 is the dominant pixel value). Square canvas, near-square plot area, both axes starting at 0.
      Chrome: title "Cr3+ d3, C/B = 4.5 - line-tanabe-sugano - python - pygal - anyplot.ai" centred at the top in near-black #1A1A17, spanning about 70% of the canvas width with clear air above it. Y-axis title "E / B (reduced term energy)" rotated at the left, x-axis title "D_o / B (reduced ligand-field strength)" centred at the bottom with all descenders fully inside the canvas. Tick labels 0..40 step 5 on x and 0..90 step 10 on y, dark grey, all readable. Grid lines are pale warm grey, visible but clearly behind the curves. Nothing clipped at any edge.
      Data: eight term curves rising from the left. Four thick solid spin-allowed quartets - 4A2g flat on E/B = 0 in brand green #009E73, 4T2g linear to 40 in #C475FD, 4T1g(F) curving to 51 in #4467A3, 4T1g(P) from 15 to 84 in #BD8233 - and four thin dashed spin-forbidden doublets: 2Eg #AE3030, 2T1g #2ABCCD, 2T2g #954477, 2A1g #99B314, all four converging on E/B ~ 17.5 at the left axis. First series is #009E73. Each curve carries its term symbol in Unicode super/subscripts (pygal has no text markup, so the g stays on the baseline, which the spec permits); seven labels sit in the right margin, 2Eg is anchored inside the plot at D_o/B = 30.
      Legibility verdict: PASS - every piece of text is dark on the off-white surface and readable at full size; no overlap and no overflow.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the whole canvas and the plot area (sampled: #1A1A17 is the dominant pixel value). Not pure black.
      Chrome: identical layout. Title, axis titles, tick labels and all eight curve labels render in light ink #F0EFE8 - the hard-coded black pygal label fill is overridden by the inline CSS, so there is no dark-on-dark text anywhere. Grid lines are faint light grey on the dark surface: subtle but still visible.
      Data: colors are identical to the light render, confirmed by pixel sampling - #009E73, #C475FD, #4467A3, #BD8233, #AE3030, #2ABCCD, #954477, #99B314 appear with the same pixel counts in both files. Only the chrome flips. Brand green #009E73 on E/B = 0 stays clearly visible. The dimmest marks are the thin dashed #AE3030 (2Eg) and #954477 (2T2g) lines, which are still legible at full size but thin.
      Legibility verdict: PASS - no dark-on-dark failure; every label, tick and axis title is light ink against the near-black background.
