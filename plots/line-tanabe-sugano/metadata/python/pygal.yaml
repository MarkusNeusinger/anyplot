review:
  strengths:
  - Real Tanabe-Sugano matrices for d³ are built per symmetry block and diagonalized
    at every field strength with np.linalg.eigvalsh, so ⁴T₁g(F) and ⁴T₁g(P) stay a
    genuine avoided crossing instead of two straight lines that swap identity — exactly
    the construction the Notes ask for and the opposite of a hand-fitted spline.
  - 'The spin-allowed / spin-forbidden distinction is carried by two native pygal
    routes at once: per-series stroke_style={''dasharray'': ''26, 20''} for the doublets,
    plus a targeted ''inline:'' sheet appended to the css= list that overrides .serie-N
    .line stroke-width (11 → 5), giving thick solid quartets against thin dashed doublets
    in both themes.'
  - 'Direct curve labelling uses pygal''s per-point dict form {''value'': ..., ''label'':
    term} with print_labels=True instead of a legend, and the companion ''.text-overlay
    text {fill: INK}'' rule threads the theme token through pygal''s hard-coded black
    label fill so the term symbols flip correctly on the dark surface.'
  - The interactive HTML output carries pygal's per-point tooltips of (Δₒ/B, E/B)
    for all eight term curves — real value in the detail view for reading ratios off
    the diagram, which is exactly how the chart type is used.
  - 'Both renders are theme-correct and palette-correct: the Imprint data colors are
    pixel-identical light↔dark with only chrome flipping, #009E73 carries the ⁴A₂g
    ground term as the first series, and the remaining seven terms follow canonical
    Imprint order.'
  - 'Spec framing is complete: the configuration and Racah ratio are stated in the
    title (''Cr³⁺ d³, C/B = 4.5''), the ground term is drawn as a visible flat line
    along E/B = 0 rather than omitted, and both axes start at 0 on a near-square 2400×2400
    canvas with a light grid behind the curves.'
  weaknesses:
  - 'VQ-02 (both): the ⁴A₂g curve label sits about 18 px right of the ''40'' x-tick
    label at the bottom-right corner and the two read as one run, ''40 ⁴A₂g'' → clear
    the tick label by at least ~60 px. Likely cause: the label anchor label_at=40.0
    for ⁴A₂g places it at the last sample, outside the plot area beside the tick;
    the ground term is flat, so anchoring it near Δₒ/B ≈ 32 keeps the label on its
    own curve and away from the axis ticks.'
  - 'VQ-05 (both): about 230 px of empty canvas sits below the x-axis title against
    only ~120 px above the chart title, so the plot area rides high in the square
    canvas → balance the two margins (margin_bottom about 200 → 120, or raise margin_top
    by the same amount). Likely cause: margin_bottom=200 paired with margin_top=120.'
  - 'Suggestion: colouring each term label in its own series colour would make the
    ²T₁g and ²Eg labels unambiguous in the band where the cyan and red dashed curves
    run near-coincident.'
  - 'Suggestion: value_font_size=44 in the Style is dead config while print_values=False
    — only value_label_font_size drives the term labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas, chart
        area and surround alike — not pure white, not dark. Grid: pale warm-grey lines at
        every labelled tick (x every 5, y every 10), subtle but visible, sitting behind the
        curves with no frame or spines around the plot area.
      Chrome: title "Cr³⁺ d³, C/B = 4.5 · line-tanabe-sugano · python · pygal · anyplot.ai"
        centred at the top in dark ink, spanning ~68% of canvas width, fully inside the
        canvas (no clipping of ascenders or descenders). X-axis title "Δₒ / B (reduced
        ligand-field strength)" below the ticks; rotated y-axis title "E / B (reduced term
        energy)" at the left. X ticks 0,5,…,40 and y ticks 0,10,…,90 all in dark ink,
        crisp and readable. Eight term-symbol labels in dark ink: ⁴T₁g(P), ²A₁g, ⁴T₁g(F),
        ⁴T₂g, ²T₂g, ²T₁g stacked down the right margin beside their curve ends, ²Eg placed
        along its curve at Δₒ/B ≈ 30, and ⁴A₂g at the bottom-right beside the "40" tick.
        The Unicode superscripts/subscripts render as expected for pygal (plain SVG text,
        no markup, g on the baseline) — the spec permits this for a library without markup.
      Data: eight curves, no legend (direct labelling instead). Four thick solid
        spin-allowed quartets — ⁴A₂g flat along E/B = 0 in brand green #009E73 (first
        series, confirmed), ⁴T₂g a straight purple #C475FD line to 40 at Δₒ/B = 40,
        ⁴T₁g(F) blue #4467A3 curving up to ~51, ⁴T₁g(P) ochre #BD8233 from 15 at zero
        field up to ~84. Four thin dashed spin-forbidden doublets — ²Eg dark red #AE3030,
        ²T₁g cyan #2ABCCD, ²T₂g plum #954477, ²A₁g olive #99B314, all starting ~17.5–19.5
        at zero field. ⁴T₁g(F) and ⁴T₁g(P) (same symmetry and multiplicity) never cross —
        they bend apart as an avoided crossing. ²Eg and ⁴T₂g cross near Δₒ/B ≈ 21, the
        textbook ruby crossing, and the different-symmetry crossings elsewhere are the
        ones the spec permits. No crossover line, correct for d³.
      Legibility verdict: PASS — every title, axis title, tick label and term label is
        dark ink on the off-white surface and fully readable; nothing is light-on-light,
        nothing is clipped at a canvas edge. The only crowding is ⁴A₂g sitting ~18 px from
        the "40" tick label, where both glyph runs are still individually readable.

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the full canvas — not pure black, not
        light. Grid flips to a pale warm-grey at low opacity, still subtle but visible
        behind the curves.
      Chrome: the same title, both axis titles, all x and y tick labels and all eight term
        symbols render in light ink (#F0EFE8 / #B8B7B0 tone) against the near-black
        surface. NO dark-on-dark failures — the term labels in particular flipped
        correctly, because the implementation overrides pygal's hard-coded black label
        fill with ".text-overlay text {fill: INK}". Layout, positions, font sizes and the
        title's ~68% width are identical to the light render.
      Data: the data colors are identical to the light render — #009E73 ground term,
        #C475FD, #4467A3, #BD8233 solid quartets, #AE3030, #2ABCCD, #954477, #99B314
        dashed doublets, same stroke widths (thick quartets, thin dashed doublets) and the
        same dash pattern. Only chrome flipped. Brand green #009E73 on the flat ⁴A₂g
        baseline is clearly visible on the dark surface, as are all four dashed doublets.
      Legibility verdict: PASS — all chrome is light-on-dark and clearly readable, all
        eight curves are clearly distinguishable from the background and from each other,
        and no element is clipped at a canvas edge.
