review:
  strengths:
  - Term energies come from `np.linalg.eigvalsh` on the stacked 2x2 Tanabe-Sugano
    matrices at C/B = 4.5 (lines 30-38), with the ground term subtracted per sample,
    so the 3T1g(P), 1T2g and 1A1g branches are genuine eigenvalues rather than hand-fitted
    splines and 3T1g(F) sits exactly on E/B = 0 as the Notes require; the endpoints
    check out (3A2g = 12dq - ground = 77.7 at delta/B = 40).
  - 'Spin class is encoded three ways at once - Imprint #009E73 solid at 3.0 px for
    the spin-allowed triplets, #C475FD dashed at 1.8 px for the spin-forbidden singlets
    - so the two classes stay separable in both themes and for CVD readers, and a
    subtitle line spells the convention out.'
  - Plotly's HTML text markup (`<sup>`/`<sub>`) typesets every term symbol properly
    - 3T1g(F), 1A1g(G), d2 (V3+) - in the curve labels, the subtitle and the hover
    name, instead of printing the plain-text key.
  - Curves are labelled directly in the right margin through paper-referenced annotations
    (`xref='paper'`, x=1.015) with `showlegend=False`, which keeps the near-square
    plot area free of a legend box while every curve still carries its identity.
  - 'Theme tokens thread through paper and plot background, title, axis titles, tick
    labels, grid and annotation ink: the light render measures exactly #FAF8F1 and
    the dark one exactly #1A1A17, with identical data colours between them.'
  - The interactive HTML companion is written alongside the PNG (`write_html`, `include_plotlyjs='cdn'`),
    so the detail view keeps plotly's hover readout of the exact delta_o/B and E/B
    per term (5e).
  weaknesses:
  - 'VQ-01 (both): the right-margin term labels and the two-line subtitle are set
    at 11 pt, below the 12 pt axis titles, although the labels carry every curve''s
    identity (there is no legend); in the 400 px thumbnail the subtitle''s second
    line is no longer legible and the term labels are barely so -> 13-14 pt for the
    term labels and 12-13 pt for the subtitle (+2 pt each). Likely cause: `font=dict(size=11,
    ...)` on both `add_annotation` calls (lines 78 and 93).'
  - 'Suggestion: a d3 or d6 configuration - the spec''s named textbook examples -
    would put more of the diagram''s character on screen; once the d2 ground term
    is subtracted the remaining curves are close to straight lines, and d6 would additionally
    exercise the high-spin/low-spin crossover line.'
  - 'Suggestion: `hovermode=''x unified''` with `xaxis.showspikes=True` would give
    the HTML view exactly the ruler-slide reading the Notes describe, at no cost to
    the static render.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, sampled at exactly #FAF8F1 (250, 248, 241) across paper and plot area — not pure white. Canvas 2400x2400 (square target, gate passed); all ink is bounded within x 114-2208, y 98-2312, so nothing touches or crosses the canvas border.
      Chrome: centred title "line-tanabe-sugano · python · plotly · anyplot.ai" in near-black #1A1A17 at ~55% of the canvas width. X-axis title "Δo/B  (reduced ligand-field strength)" with a true subscript o; y-axis title "E/B  (reduced term energy)" rotated on the left. Tick labels 0/10/20/30/40 and 0-80 by tens in soft ink #4A4A44. Grid lines are a faint warm grey, clearly visible but well behind the curves. A two-line subtitle sits inside the upper-left of the plot area: "d² (V³⁺) in an octahedral field, C/B = 4.5" over "solid: spin-allowed (triplet) · dashed: spin-forbidden (singlet)". All text is readable against the light background; no light-on-light anywhere. The subtitle's second line and the 11 pt right-margin term labels are the smallest text and the first to suffer when the image is scaled to the 400 px thumbnail.
      Data: nine term curves for d². Four spin-allowed triplets in Imprint position 1 #009E73, solid and thick — ³T₁g(F) flat along E/B = 0, ³T₂g rising to ~37.5, ³T₁g(P) starting at 15 and bending to ~50, ³A₂g climbing steeply to ~77.7. Five spin-forbidden singlets in Imprint position 2 #C475FD, dashed and thinner — ¹T₂g(D) and ¹Eg(D) nearly coincident around E/B ≈ 15.5, ¹A₁g(G) flattening to ~35, ¹T₂g(G) to ~55, ¹T₁g(G) to ~59. Every curve carries its term symbol in the right margin with the multiplicity as a true superscript and the numeral plus g as true subscripts. First series is #009E73. No crossover line, correct for d² (outside d⁴–d⁷).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, sampled at exactly #1A1A17 (26, 26, 23) across paper and plot area — not pure black. Same 2400x2400 canvas and the same ink bounding box as the light render.
      Chrome: title, axis titles and the spin-allowed term labels flip to light ink #F0EFE8; tick labels, the subtitle and the spin-forbidden term labels to #B8B7B0. Grid lines flip to a translucent light grey and stay subtle. No dark-on-dark failure anywhere: every title, axis title, tick label, subtitle line and margin label is clearly readable against the near-black surface, and the axis lines are visible.
      Data: colours are identical to the light render — #009E73 for the four solid triplet curves (including the ground ³T₁g(F) line along E/B = 0, which reads clearly against the dark background) and #C475FD for the five dashed singlet curves. Line widths, dash patterns, curve positions and label placement are unchanged; only chrome flipped. Brand green #009E73 remains clearly visible.
      Legibility verdict: PASS
