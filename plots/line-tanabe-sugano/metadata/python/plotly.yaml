    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across both paper and plot area — not pure white, not dark. Square 2400x2400 canvas with a near-square plot area.
      Chrome: Centred title "line-tanabe-sugano · python · plotly · anyplot.ai" in near-black #1A1A17 at the top, spanning roughly 55% of the canvas width — clearly readable, no clipping. X-axis title "Δo/B  (reduced ligand-field strength)" below the axis, Y-axis title "E/B  (reduced term energy)" rotated at the left — both dark and fully legible. Tick labels 0/10/20/30/40 on x and 0/10/.../80 on y in muted #4A4A44; readable at full size, small but still legible at the 400 px preview. A two-line caption inside the upper-left of the plot area reads "d² (V³⁺) in an octahedral field, C/B = 4.5" and "solid: spin-allowed (triplet) · dashed: spin-forbidden (singlet)" in the same muted ink, overlapping nothing. Grid lines at 10-unit intervals are faint and sit behind the curves. No tick marks; left and bottom axis lines only.
      Data: Nine term curves. Four spin-allowed (triplet) terms in Imprint position 1 #009E73, solid, thick: ³T1g(F) flat at E/B = 0 along the x-axis, ³T2g rising to ~38, ³T1g(P) from 15 at Δo/B = 0 to ~50, ³A2g steepest to ~78. Five spin-forbidden (singlet) terms in Imprint position 2 #C475FD, dashed, thinner: ¹T2g(D) and ¹Eg(D) near-flat around 14–16, ¹A1g(G) curving from 21 to ~35, ¹T2g(G) and ¹T1g(G) rising to ~55 and ~59. First categorical series is #009E73. Every curve is labelled in the right margin with a typeset term symbol (true superscript multiplicity, true subscript Mulliken label), spin-allowed labels in dark ink and spin-forbidden in soft ink. All nine labels sit fully inside the canvas with margin to spare — no clipping.
