review:
  strengths:
  - Term energies come from diagonalizing the Tanabe-Sugano 2x2 matrices with np.linalg.eigvalsh
    over a stacked (N,2,2) array (lines 30-38), so the avoided crossing inside the
    1T2g pair emerges from the physics instead of a hand-fitted spline, exactly as
    the Notes demand; the numbers check out against the textbook d2 diagram (3P-3F
    gap is exactly 15 B at delta_o/B = 0, 3A2g reaches 58 at delta_o/B = 30).
  - 'Spin class is encoded three times over and CVD-safely: spin-allowed terms are
    Imprint #009E73 solid at width 3.0, spin-forbidden #C475FD dashed at width 1.8,
    and the in-plot caption names the convention, so the two classes are separable
    in both themes without relying on hue alone.'
  - Direct right-margin labelling via paper-referenced annotations (xref='paper',
    lines 70-79) with plotly's <sup>/<sub> markup typesets true term symbols (3T1g(F),
    1A1g(G)) and removes the need for a legend box sitting over the curves.
  - Theme chrome is fully tokenised (PAGE_BG / INK / INK_SOFT / GRID, lines 14-18),
    so the two renders carry identical data colours and flip only background, text,
    grid and axis lines - the dark render has no dark-on-dark element anywhere.
  - The interactive HTML companion keeps plotly's native hover and zoom, which is
    how this diagram is actually used - matching observed band-energy ratios against
    the curves to read off delta_o and B (5e).
  - Square 2400x2400 canvas with a near-square plot area, x anchored at 0 and the
    ground term 3T1g(F) drawn as a visible flat line along E/B = 0 rather than an
    omitted baseline, as the Notes ask.
  weaknesses:
  - 'VQ-01 (both): axis tick labels sit at size 10 against 12 pt axis titles and 13
    pt term labels, and in the 400 px preview the x ticks ''10''/''20''/''30'' are
    barely legible -> about 12 (+2). Likely cause: tickfont=dict(size=10) on both
    xaxis and yaxis (lines 107, 118).'
  - 'Suggestion: hovermode=''x unified'' would let a reader pick one delta_o/B in
    the HTML view and see every term''s E/B at once - the exact reading operation
    the Description describes.'
  - 'Suggestion: a hovertemplate naming the term and the two reduced coordinates would
    make the HTML hover label as informative as the printed diagram, since showlegend=False
    means the trace name is the only hover text today.'
