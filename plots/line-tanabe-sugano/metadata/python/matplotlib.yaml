review:
  strengths:
  - 'Term energies come from np.linalg.eigvalsh on stacked 2x2 symmetry blocks (lines
    32-58), so the avoided crossings are genuine eigenvalue repulsions: the 1Eg, 1T2g
    and 1A1g pairs bend away from each other and never cross or swap identity, exactly
    what the Notes ask for instead of hand-fitted splines.'
  - 'Zero-field degeneracies come out physically correct: the four 1G-derived singlets
    all start at E/B = 21, the two 1D-derived ones at 14, and the three F-derived
    triplets converge at 0 with 3T1g(F) flat along the x-axis as the drawn ground
    term.'
  - Native matplotlib ax.annotate leader lines park every term symbol in a dedicated
    right-hand gutter (xlim 46.5 against a 0-40 data range), and the two curves that
    leave the frame get their labels at the exit point instead - no label collides
    with a curve or with the legend in either render.
  - mathtext typesets each term symbol with a true superscript multiplicity and true
    1g/2g subscripts, so the labels read as proper term symbols rather than as the
    plain-text key.
  - Line2D proxy handles build a two-entry legend that explains the thick-solid (spin-allowed)
    / thin-dashed (spin-forbidden) encoding without producing eleven legend rows;
    the glyphs match the drawn curves in width, dash pattern and color in both themes.
  - 'Theme tokens are threaded through title, subtitle, tick labels, spines, grid
    and the legend frame; the Imprint data colors #009E73 and #C475FD are identical
    between the two renders and only the chrome flips, on the exact 2400x2400 square
    canvas with both axes anchored at 0.'
  weaknesses:
  - 'VQ-01 (both): on the 6x6 in square canvas the legend text at 8 pt and the term-symbol
    callouts at 9 pt lose their superscript/subscript detail in the 400 px thumbnail
    - ''Spin-forbidden (singlet)'' and the (G)/(D)/(P) qualifiers are no longer resolvable
    there -> about 10 pt legend and 11 pt callouts (+2 pt each). Likely cause: fontsize=9
    in the ax.annotate call (line 96) and fontsize=8 in ax.legend (line 133).'
  - 'Suggestion: a minor-tick grid (x every 5, y every 10 via ax.set_xticks(..., minor=True)
    plus ax.grid(which=''minor'')) would support the ruler-sliding read the Notes
    describe; the current 4 gridlines per axis are coarse for reading ratios off the
    chart.'
  - 'Suggestion: the optional example-complex marker from the Notes - a vertical line
    at a real V(III) complex''s delta_o/B with arrows from the ground term up to 3T2g,
    3T1g(P) and 3A2g - would give the chart a focal point and show how chemists actually
    use the diagram.'
  - 'Suggestion: wrapping the Mulliken letters in \mathrm{} would render them upright
    instead of mathtext-italic, matching term-symbol typesetting convention.'
