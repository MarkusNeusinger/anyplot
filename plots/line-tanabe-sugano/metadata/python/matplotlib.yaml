      Data: identical to the light render — the same #009E73 brand green for the four triplets (including the flat 3T1g(F) ground line, which stays clearly visible on top of the dark bottom spine) and the same #C475FD lavender for the seven dashed singlets, at the same linewidths and dash pattern. Only the chrome flipped; no data color changed.
      Legibility verdict: PASS
