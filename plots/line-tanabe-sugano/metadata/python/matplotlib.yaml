      Chrome: title "line-tanabe-sugano · python · matplotlib · anyplot.ai" in near-black #1A1A17, centred, spanning roughly 70% of canvas width. Soft-grey subtitle below it reads "d² (V³⁺) in an octahedral field, C/B = 4.5". Axis titles "Ligand-Field Strength Δ_o/B" (bottom) and "Term Energy E/B" (left, rotated) in the same near-black. Tick labels 0/10/20/30/40 on x and 0/20/40/60/80 on y in soft grey #4A4A44. Top and right spines removed; left and bottom spines soft grey. Faint warm-grey grid at alpha 0.15 sits behind every curve. Legend box at lower right on the #FFFDF6 elevated surface with a soft-grey frame: a thick solid green sample "Spin-allowed (triplet)" and a thin dashed lavender sample "Spin-forbidden (singlet)". All text is readable against the light background; nothing is light-on-light. A pixel scan found no non-background pixel on any canvas border — content clears every edge by at least 44 px, so nothing is clipped.
      Data: eleven term curves. Four spin-allowed triplets in Imprint position 1 brand green #009E73 at linewidth 2.8 solid — ³T₁g(F) drawn as a visible flat line lying along the x-axis at E/B = 0, plus ³T₂g and ³A₂g rising from 0 and ³T₁g(P) starting at exactly 15. Seven spin-forbidden singlets in Imprint position 2 lavender #C475FD at linewidth 1.4 with a 5/3 dash — ¹E_g(D) and ¹T₂g(D) coincident at 14 at zero field and near-coincident across the whole range, ¹A₁g(G) bending from 21 and flattening toward 34.9, and ¹T₁g, ¹T₂g(G), ¹E_g(G), ¹A₁g(S) climbing more steeply. Every curve carries its term symbol as mathtext with a true superscript multiplicity and true 1g/2g subscripts, parked in the right-hand gutter on a thin leader line; the two curves that leave the frame at E/B = 80 (¹A₁g(S), ¹E_g(G)) are labelled at their exit point inside the plot instead. Avoided-crossing pairs bend away from each other and never cross. First series is #009E73 as required.
