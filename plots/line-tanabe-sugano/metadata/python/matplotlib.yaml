review:
  strengths:
  - 'Term energies come from np.linalg.eigvalsh applied to stacked 2x2 symmetry blocks
    (lines 32-58), so the avoided crossings are genuine eigenvalue repulsions rather
    than hand-fitted splines: the 1Eg, 1T2g and 1A1g pairs bend away from each other
    and never cross or swap identity, and both roots of every block are drawn.'
  - 'Zero-field degeneracies fall out of the diagonalization and land exactly where
    the free-ion terms put them: 3T1g(P) at E/B = 15 B above the ground term (spec
    check value 1), the four 1G-derived singlets at 21, the two 1D-derived ones at
    14 and 1A1g(S) at 53.5, with 3T1g(F), 3T2g and 3A2g converging at 0.'
  - Native matplotlib ax.annotate leader lines park every term symbol in a dedicated
    right-hand gutter (xlim 46.5 against a 0-40 data range with ticks stopping at
    40); the two curves that leave the frame at E/B = 80 get their label at the exit
    point inside the plot instead, so all eleven labels sit clear of every curve and
    of the legend in both renders.
  - mathtext typesets each term symbol with a true superscript multiplicity and true
    1g/2g subscripts, so the labels read as proper term symbols rather than as the
    plain-text key.
  - Line2D proxy handles build a two-row legend that explains the thick-solid (spin-allowed)
    / thin-dashed (spin-forbidden) encoding instead of eleven per-curve rows, and
    the glyphs match the drawn curves in color, width and dash pattern in both themes.
  - 'Theme tokens are threaded through title, subtitle, axis titles, tick labels,
    spines, grid and the legend frame; the Imprint data colors #009E73 and #C475FD
    are byte-identical between the two renders and only the chrome flips, on the exact
    2400x2400 square canvas with both axes anchored at 0.'
  weaknesses:
  - 'DQ-03 (both): check value 3 is missed at the right edge — 1A1g(G) ends at E/B
    = 28.9 at Δ_o/B = 40 where the Notes give 34.9 for C/B = 4.5 (signed delta -6.0);
    its Δ_o/B = 0 intercept of 21 = 12 + 2·C/B is correct, so only the field dependence
    is wrong. The 2Δ_o belongs on the e_g² diagonal entry (8 + 4·C/B), not on the
    t₂g² entry (10 + 5·C/B) → write the block as [[8 + 4·C/B + 2·Δ, √6·(2 + C/B)],
    [√6·(2 + C/B), 10 + 5·C/B]], which reproduces 34.9. Likely cause: line 50, the
    two diagonal entries of the 1A1g block are swapped.'
  - 'Suggestion: a minor-tick grid (x every 5, y every 10 via ax.set_xticks(..., minor=True)
    plus ax.grid(which=''minor'')) would support the ruler-sliding read the Notes
    describe; four gridlines per axis are coarse for reading ratios off the chart.'
  - 'Suggestion: a d⁶ or d⁷ configuration, which the Notes say they prefer, would
    bring the high-spin/low-spin crossover line and the kink in every curve that make
    the diagram instantly recognizable.'
  - 'Suggestion: wrapping the Mulliken letters in \mathrm{} would render them upright
    instead of mathtext-italic, matching term-symbol typesetting convention.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 2400x2400 square canvas and across the axes face; not pure white, not dark. Near-square plot area, both axes anchored at 0, a right-hand gutter from x = 40 to 46.5 that carries no ticks.
      Chrome: title "line-tanabe-sugano · python · matplotlib · anyplot.ai" in near-black #1A1A17, centred, spanning roughly 72% of canvas width with clear margins both sides. Soft-grey subtitle below it reads "d² (V³⁺) in an octahedral field, C/B = 4.5". Axis titles "Ligand-Field Strength Δ_o/B" (bottom) and "Term Energy E/B" (left, rotated) in the same near-black. Tick labels 0/10/20/30/40 on x and 0/20/40/60/80 on y in soft grey #4A4A44. Top and right spines removed, left and bottom spines soft grey. Faint warm-grey grid at alpha 0.15 behind every curve. Legend box at lower right on the #FFFDF6 elevated surface with a soft-grey frame: a thick solid green sample "Spin-allowed (triplet)" and a thin dashed lavender sample "Spin-forbidden (singlet)". All text is readable against the light background; nothing is light-on-light, nothing is clipped at any canvas edge — the rightmost term label ends well short of the frame.
      Data: eleven term curves. Four spin-allowed triplets in Imprint position 1 brand green #009E73 at linewidth 2.8 solid — 3T1g(F) as a visible flat line lying along the x-axis at E/B = 0, plus 3T2g and 3A2g rising from 0 and 3T1g(P) starting at 15. Seven spin-forbidden singlets in Imprint position 2 lavender #C475FD at linewidth 1.4 with a 5/3 dash — 1Eg(D) and 1T2g(D) nearly coincident near E/B 15, 1A1g(G) bending from 21 up to about 29, and 1T1g, 1T2g(G), 1Eg(G), 1A1g(S) climbing more steeply. Every curve carries its term symbol as mathtext with a true superscript multiplicity and true 1g/2g subscripts, parked in the right-hand gutter on a thin leader line; the two curves that leave the frame at E/B = 80 (1A1g(S), 1Eg(G)) are labelled at their exit point inside the plot instead. Avoided-crossing pairs bend away from each other and never cross. First series is #009E73 as required.
