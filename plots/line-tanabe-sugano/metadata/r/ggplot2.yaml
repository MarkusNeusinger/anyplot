review:
  strengths:
  - 'The term energies come from the real d2 Tanabe-Sugano secular blocks rather than
    fitted splines: at Delta_o/B = 0 the roots reproduce the free-ion separations
    exactly (3F at -8B, 3P at +7B giving the 15B gap, 1D at -3B+2C, 1G at +4B+2C,
    1S at +14B+7C with C/B = 4.42), and 3T1g(F), 3T2g and 3A2g correctly emanate together
    from E/B = 0 because all three descend from 3F.'
  - plotmath direct labels (`parse = TRUE` on `geom_text` with `coord_cartesian(clip
    = "off")` and a reserved right margin) typeset every term symbol with a true superscript
    multiplicity and true subscript Mulliken index and g parity - the R/ggplot2-distinctive
    answer to the spec's text-markup requirement.
  - One variable drives three matched manual scales (`scale_color_manual` + `scale_linetype_manual`
    + `scale_linewidth_manual`), so spin-allowed versus spin-forbidden is encoded
    redundantly by Imprint color, dash pattern and line weight and still merges into
    a single legend.
  - 'Chrome is fully theme-tokenised: both renders are theme-correct (#FAF8F1 / #1A1A17),
    the Imprint data colors #009E73 and #C475FD are pixel-identical across themes,
    and the grid at alpha(INK, 0.15) with linewidth 0.25 stays behind the curves in
    both.'
  - The 2x2 secular blocks are solved in closed form (centre +/- split) and vectorised
    with `expand_grid` over all 321 field-strength samples - no loop, no per-row `eigen()`
    call.
  weaknesses:
  - 'VQ-03 (both): the "Spin-forbidden (singlet)" legend key draws as one solid lavender
    segment because the 0.55 cm key is shorter than a single `longdash` period at
    linewidth 0.8, so the legend never shows the dash pattern that tells the two classes
    apart -> widen the key to about 1.2 cm (+0.65 cm). Likely cause: `legend.key.width
    = unit(0.55, "cm")`.'
  - 'VQ-05 (both): the margins are lopsided - the rotated y-axis title "Term energy
    E/B" starts about 2 % from the left canvas edge (all pixels visible, but no breathing
    room) while about 7 % of empty canvas sits to the right of the term labels ->
    raise the left margin to about 20 pt and trim the right to about 50 pt. Likely
    cause: `plot.margin = margin(t = 10, r = 62, b = 6, l = 8)`.'
  - 'Suggestion: a d6 configuration (the spec''s other classic textbook example) would
    additionally exercise the high-spin/low-spin crossover line and the slope kinks
    that d2 cannot show.'
  - 'Suggestion: the curve labels at `size = 4.1` mm (about 11.7 pt) sit above the
    10 pt axis titles in the type hierarchy; about 3.6 mm would place them just under.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas and the panel - not pure white, no separate panel fill.
      Chrome: bold near-black title "line-tanabe-sugano · r · ggplot2 · anyplot.ai" at ~66 % of canvas width; grey subtitle "d2 octahedral field, V3+, C/B = 4.42" with the 2 and 3+ as true superscripts; axis titles "Ligand-field strength Delta_o/B" (bottom) and "Term energy E/B" (rotated, left); grey tick labels 0-40 by 5 on x and 0-80 by 10 on y; very faint grid on both axes; thin L-shaped axis lines, no tick marks; a bottom legend with two line samples, "Spin-allowed (triplet)" and "Spin-forbidden (singlet)". All of it is clearly readable against the light background; nothing is light-on-light and nothing is clipped at the canvas border.
      Data: nine term curves. Five spin-allowed triplets in brand green #009E73, thick and solid: 3T1g(F) flat along E/B = 0, 3T2g and 3A2g rising straight out of the origin to ~38 and ~78, and 3T1g(P) from 15 to ~50. Four spin-forbidden singlets in Imprint lavender #C475FD, thinner and long-dashed: 1T2g(D) and 1Eg(D) near-coincident and almost flat at ~14-15, 1T1g(G) and 1T2g(G) rising from ~20.8 to ~59 and ~55, and 1A1g(G) bending from ~20.8 up to a flat ~34.5. Every curve carries a plotmath term symbol outside the right panel edge with superscript multiplicity and subscript index/g. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across canvas and panel - not pure black.
      Chrome: title in near-white #F0EFE8, subtitle and tick labels in the soft grey #B8B7B0, axis titles in #F0EFE8, grid lines a faint light rule on the dark surface, axis lines mid-grey, legend text light grey. Every text element is readable; there is no dark-on-dark failure anywhere - no near-black title, label, tick or legend entry on the near-black surface.
      Data: identical to the light render - the same #009E73 green for the five triplets and the same #C475FD lavender for the four singlets, same dash patterns, same line weights, same curve positions and the same plotmath labels. Only the chrome flipped.
      Legibility verdict: PASS
