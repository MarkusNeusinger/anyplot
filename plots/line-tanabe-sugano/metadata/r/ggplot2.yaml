review:
  strengths:
  - 'Curve energies come from the authentic d2 Tanabe-Sugano secular blocks rather
    than fitted splines: the 3T1g(F)/3T1g(P) block ([-5B, 6B; 6B, 4B + Delta]) puts
    3P exactly 15B above 3F, and the 1T2g, 1Eg and 1A1g blocks carry the textbook
    2*sqrt(3)*B and sqrt(6)*(2B + C) off-diagonals, so the avoided crossings emerge
    from the diagonalization itself and the same-symmetry pairs never cross.'
  - Term labels use ggplot2's native plotmath via geom_text(parse = TRUE), giving
    true superscript multiplicities and true subscript Mulliken/g indices (e.g. 3T1g(F))
    instead of printing the plain-text key.
  - Spin class is encoded three times over - scale_color_manual, scale_linetype_manual
    and scale_linewidth_manual on the same variable - so thick solid spin-allowed
    versus thin dashed spin-forbidden survives both themes and colour-vision deficiency,
    and the bottom legend collapses to a single two-entry guide.
  - coord_cartesian(clip = 'off') with a widened right plot margin places the direct
    curve labels outside the panel without any clipping, which also removes the need
    for a nine-entry colour legend.
  - 'Canvas is exactly the 2400x2400 square target at dpi 400 via ragg::agg_png, and
    the backgrounds sample exactly to #FAF8F1 and #1A1A17 with data colours identical
    between themes.'
  - Deterministic by construction - closed-form 2x2 roots over a fixed seq(0, 40,
    length.out = 321) grid, no RNG involved.
  weaknesses:
  - 'VQ-01 (both): the right-edge term labels are the smallest text on the 2400 px
    canvas at geom_text(size = 3.2) (~9 pt), and the stacked super/subscripts of 1T2g(D)
    and 1Eg(D) blur together at the 400 px thumbnail -> about 4.0-4.2 mm (+0.8 to
    +1.0 mm). Likely cause: geom_text(..., size = 3.2) in the label layer.'
  - 'Suggestion: the Notes offer an optional vertical marker at a real V(III) complex''s
    Delta_o/B with arrows from the ground term to the excited terms, which would show
    how the diagram is read in reverse.'
  - 'Suggestion: a slightly larger label_y offset for the 1Eg(D)/1T2g(D) pair would
    make the two strong-field near-coincident curves easier to attribute at thumbnail
    size.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas (sampled corner pixel = 250,248,241); panel and page share the same surface, no pure white anywhere.
      Chrome: bold near-black title "line-tanabe-sugano · r · ggplot2 · anyplot.ai" top-left spanning ~75% of the width (expected for the mandated title); grey subtitle "d2 octahedral field, V3+, C/B = 4.42" with true superscripts; y-axis title "Term energy E/B" rotated at left, x-axis title "Ligand-field strength (Delta_o)/B" centred below; tick labels 0-40 by 5 on x and 0-80 by 10 on y in soft grey; faint grey major grid only, no minor grid, no tick marks, thin axis lines on left and bottom. All chrome is clearly readable against the light background.
      Data: nine term curves. Five thick solid brand-green (#009E73) spin-allowed triplets: the ground term 3T1g(F) drawn as a visible flat line exactly along E/B = 0, plus 3T2g and 3A2g fanning up from the origin and 3T1g(P) starting at E/B = 15. Four thinner long-dashed lavender (#C475FD) spin-forbidden singlets: 1T2g(D) and 1Eg(D) near-coincident around E/B = 14-15, 1T2g(G) and 1T1g(G) rising from ~21, and 1A1g(G) flattening toward ~34. Each curve carries a plotmath term symbol in its own series colour just outside the right panel edge, with the multiplicity as a true superscript and the Mulliken index and g as true subscripts; all labels sit inside the canvas with no clipping (content bounds x 44-2331, y 53-2321). Two-entry bottom legend with visible solid-green and dashed-lavender line samples. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled corner pixel = 26,26,23), not pure black, same square canvas.
      Chrome: title now light ink (#F0EFE8) and bold, subtitle and tick labels in soft light grey (#B8B7B0), axis titles light — no dark-on-dark anywhere; grid lines are a faint light grey, subtle but visible; axis lines visible. Every title, axis title and tick label is clearly readable.
      Data: identical to the light render — same brand green #009E73 for the five spin-allowed curves (including the flat ground term at E/B = 0) and the same lavender #C475FD for the four dashed spin-forbidden curves, same linewidths (1.4 vs 0.8) and the same longdash pattern. The right-edge plotmath labels keep their series colours and stay fully legible on the dark surface; the green reads well on #1A1A17 as expected. Legend glyphs match the curves they explain. Only chrome flipped.
      Legibility verdict: PASS
