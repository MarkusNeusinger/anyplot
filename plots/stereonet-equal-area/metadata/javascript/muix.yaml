review:
  strengths:
  - 'Projection geometry is correct for all four populations: Bedding (dip 24° toward
    118°) plots as a gentle arc near the ESE rim with its poles near the centre on
    the WNW side; the steep Joint set (78° toward 048°) runs almost straight through
    the centre with its poles at the SW rim; Foliation and Fault poles sit opposite
    their dip directions at sqrt(2)·sin(dip/2)'
  - Kamb density (exponential kernel) contoured in ink at 6σ / 12σ / 18σ with line
    width and opacity rising by level, clipped to the primitive, and clearly distinct
    from the Imprint feature colours
  - 'Composes the stereonet inside ChartsContainer: custom SVG net, contour and perimeter
    layers read the chart''s useXScale/useYScale hooks, the poles are native ScatterPlot
    series, and ChartsTooltip (item trigger) gives per-pole inspection in the HTML'
  - 'Perimeter hierarchy: minor ticks every 10°, longer ticks with labels every 30°,
    bold N/E/S/W cardinals in ink against soft-ink degree labels; graticule in the
    grid token stays behind the data in both themes'
  - 'Theme tokens threaded through every element (ink, inkSoft, grid, pageBg); data
    colours identical in light and dark, first series Bedding in #009E73'
  weaknesses:
  - 'VQ-03 (dark): the individual great circles at strokeOpacity 0.15 nearly vanish
    on #1A1A17 for the darker hues — Foliation (blue) and Joint set (purple) arcs
    read as a faint haze rather than countable arcs → raise the per-plane arc opacity
    to about 0.25–0.3 (+0.1 to +0.15) so each plane''s arc stays visible in the dark
    render. Likely cause: PLANE_ARC_OPACITY = 0.15 shared by both themes.'
  - 'Suggestion: the 12σ contour of the Fault cluster is a tiny polygon a few pixels
    across; a 4σ level step would give the Fault and Foliation clusters more nested
    rings.'
  - 'Suggestion: the great-circle projection loop is written out three times (planeArcs,
    meanPlanes, netCurves); one shared point generator would shorten the file.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: title "stereonet-equal-area · javascript · muix · anyplot.ai" bold dark ink at top centre, soft-ink subtitle (n = 144 planes, Schmidt net, Kamb contours every 6σ); primitive circle in ink; bold N/E/S/W cardinals; degree labels 30°…330° every 30° with ticks every 10°; equal-area graticule in thin light grey lines; HTML legend at bottom (dot + line swatch for Bedding, Joint set, Foliation, Fault, and ink line for Kamb density 6σ/12σ/18σ). All text readable.
      Data: Bedding #009E73 poles clustered near centre-WNW with three nested Kamb contours, bold mean arc near the ESE rim; Joint set purple poles at the SW rim, mean arc nearly straight NW–SE through centre; Foliation blue poles in the SE, mean arc NE–SW bowed NW; Fault ochre poles in the NNE, mean arc WNW–ESE bowed SSW. Faint per-plane arcs at 15 % opacity behind. Contours dark ink, clipped at primitive.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, cardinals, degree labels and legend in light ink; primitive circle light; graticule subtle grey. No dark-on-dark text.
      Data: identical feature colours and positions to the light render; contours flip to light ink and remain clear. The faint individual Foliation/Joint-set arcs at 15 % opacity almost disappear against the dark surface; the bold means and poles stay clear. Brand green visible.
      Legibility verdict: PASS
