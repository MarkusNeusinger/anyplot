review:
  strengths:
  - 'Projection math is correct and checkable in the render: Bedding (dip 24°, dip
    direction 118°) poles sit about 0.29 primitive radii from the centre toward 298°,
    Joint-set poles (dip 78°) lie near the SW rim opposite their near-straight NW-SE
    arcs, Foliation poles plot SE and Fault poles NE, each on the side opposite its
    dip direction'
  - Every plane gets its own great circle at low opacity, running strike-to-strike
    and bowed toward its dip direction, so the many crossing arcs stay legible behind
    the poles
  - Kamb density (exponential kernel) contours close around each pole cluster, are
    clipped to the primitive circle, drawn in ink so they read apart from the feature
    colours, and step up in stroke weight and opacity with each sigma level
  - Full Schmidt net graticule (great and small circles every 10°) in the thin theme
    grid token, behind all data, with 10° perimeter ticks, 30° azimuth labels and
    bold N/E/S/W cardinals
  - Composes custom SVG layers inside ChartsContainer through the useXScale/useYScale
    hooks, with the poles as a native ScatterPlot series and ChartsTooltip for item
    hover in the HTML output
  - 'Both themes correct: identical Imprint data colours (Bedding #009E73 first),
    chrome flips cleanly to light ink on #1A1A17'
  weaknesses:
  - 'Suggestion: the 12σ level around the Fault cluster closes as a tiny few-pixel
    polygon; a finer density grid (DENSITY_GRID above 80) would draw it as a smoother
    small ring.'
  - 'Suggestion: a strike/dip readout per pole in the tooltip formatter would make
    the HTML hover more useful to a geologist than raw x/y projection coordinates.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas.
      Chrome: centred bold title "stereonet-equal-area · javascript · muix · anyplot.ai" with a softer subtitle (n = 144 planes, projection, Kamb contours every 6σ); a black primitive circle with tick marks every 10°, azimuth labels every 30° (30°, 60°, 120°, ...), bold N/E/S/W cardinals; HTML legend at the bottom (Bedding, Joint set, Foliation, Fault, each a dot plus a line swatch, and "Kamb density, 6σ / 12σ / 18σ"). All text dark and readable.
      Data: Schmidt net graticule in thin light grey; faint per-plane great circles and bold mean great circles per feature; poles as filled dots — Bedding #009E73 near the centre NW of it, Joint set purple near the SW rim, Foliation blue SE, Fault ochre NE; grey ink Kamb contours closing around each cluster, darker/thicker for higher levels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, cardinals, degree labels and legend text in light ink; primitive circle drawn light; graticule a subtle dark grey, still visible. No dark-on-dark text.
      Data: same Imprint colours as the light render for poles and arcs (green, purple, blue, ochre); Kamb contours flip to light ink and stay distinct from the feature colours; faint arcs dimmer but visible.
      Legibility verdict: PASS
