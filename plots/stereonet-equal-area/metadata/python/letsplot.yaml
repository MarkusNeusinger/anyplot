review:
  strengths:
  - 'Poles projected correctly in the lower-hemisphere Lambert equal-area net: each
    pole trends dip_direction + 180 and plunges 90 - dip, so the steep Joint poles
    sit at the W rim opposite their nearly straight N-S arcs and the gentle Foliation
    poles sit just S of the centre opposite their N-bowed arcs'
  - Kamb density computed on the sphere (exponential-smoothing Kamb counts against
    the uniform expectation, in standard deviations) and contoured with geom_contour
    at 1-sigma steps from 2 sigma; every contour closes inside the primitive, and
    the steep Joint cluster splits across the W and E rims as it should
  - Great circles computed correctly, each from strike end to strike end, bowed toward
    its dip direction and clipped to the primitive; thin and translucent so the poles
    and contours stay readable
  - Round, undistorted net via coord_fixed with a heavy primitive ring, 10-degree
    ticks (longer every 30 degrees) and bold N/E/S/W labels
  - 'Imprint palette in canonical order with #009E73 first; categorical colours identical
    across themes, only chrome flips (ink, contour grey, legend box)'
  - layer_tooltips gives feature type, strike and dip per pole in the HTML output
  - Seeded, script-style code with column constants and a Data block that ends in
    one tidy df
  weaknesses:
  - 'CQ-04 (code): the mean-pole labels are drawn by a loop that adds one geom_text
    layer per row (lines 251-262) only because each row carries its own nudge → add
    nudge_x/nudge_y to the label coordinates in mean_df and draw all four labels with
    one geom_text layer. Likely cause: nudge_x/nudge_y passed as layer parameters
    instead of folded into the data.'
  - 'Suggestion: state the Kamb contour interval (for example ''Kamb contours: 2 sigma
    and up, 1 sigma steps'') in a caption or subtitle so a reader can read the density
    levels.'
  - 'Suggestion: give the legend key area the legend''s own fill so the swatches do
    not sit on a separate rectangle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 square canvas (no canvas-gate file).
      Chrome: bold dark mandated title centred at the top; heavy dark primitive circle with 10-degree ticks (longer every 30 degrees); bold N/E/S/W outside the ring; dashed rule-coloured N-S/E-W reference cross; italic dark mean annotations (Bedding 43/33, Joint 356/78, Fault 151/55, Foliation 268/28) placed clear of the poles; legend 'Feature Type' in the lower-right corner on an elevated box, clear of the net. All text readable.
      Data: 70 poles - Bedding #009E73 NW of centre, Joint #C475FD at the W rim, Fault #4467A3 NE, Foliation #BD8233 just S of centre, each on the side opposite its dip direction; great circles in the same hues at alpha 0.35 (Bedding arcs bowed SE, Joint arcs nearly straight N-S bowed E, Foliation arcs near the N rim); grey Kamb contours at 1-sigma steps close around each cluster and stay inside the primitive (the Joint cluster wraps to the E rim); black diamond mean poles and pale confidence ellipses. First series is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title, cardinals, primitive ring, ticks and italic annotations in light ink; reference cross in the dark rule colour; legend on #242420 with light text and a light frame. No dark-on-dark text.
      Data: categorical hues identical to the light render; contours flip to a lighter grey, mean diamonds to near-white; Fault arcs are dimmer on the dark page but still traceable; poles fully visible.
      Legibility verdict: PASS
