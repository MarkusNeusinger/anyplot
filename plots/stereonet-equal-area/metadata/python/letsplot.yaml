review:
  strengths:
  - Great circles computed correctly in the Lambert equal-area lower-hemisphere projection,
    bowed toward their dip directions, gentle Foliation planes near the N rim and
    steep Joints nearly straight
  - Primitive circle with 10-degree ticks (longer every 30 degrees) and bold N/E/S/W
    labels; round, undistorted net via coord_fixed
  - 'Imprint palette in canonical order with #009E73 first; data colours identical
    across themes, only chrome flips'
  - Whole canvas carries the page colour through the page-coloured gggrid wrapper
    the library rule prescribes
  - Column constants and a Data block ending in one tidy df; seeded, script-style
    code
  - layer_tooltips gives strike and dip per pole in the HTML output
  weaknesses:
  - 'SC-03, SC-02 (both): every pole is plotted on the dip-direction side, mirrored
    through the centre (Foliation dipping N has its poles about 0.4 R north instead
    of south; Joints dipping E sit at the E rim instead of the W rim) → the pole at
    azimuth dip_direction + 180 with plunge 90 - dip, on the side opposite each plane''s
    arc (C3). Likely cause: pole_x_3d/pole_y_3d use +sin(dip)*sin/cos(dip_direction);
    negate both.'
  - 'SC-02 (both): the outer Joint density contours run outside the primitive circle
    at E (out to about 1.2 R) → contours kept inside the primitive (C5). Likely cause:
    the annular mask polygons do not cover the geom_density2d lines; compute the density
    on a grid and clip it to r <= 1, or contour only inside the primitive.'
  - 'SC-02 (code): density contours are a gaussian KDE of projected coordinates, not
    the Kamb contours the Notes ask for → Kamb counts (expected count within a counting
    circle, contoured in multiples of sigma). Likely cause: geom_density2d(kernel=''gaussian'').'
  - 'VQ-02 (both): a Bedding pole sits under the ''43/33'' annotation and breaks the
    text → annotation clear of the poles. Likely cause: the fixed nudge_y=-0.20 below
    the mean marker inside the Bedding cluster''s spread.'
  - 'VQ-05 (both): an empty band of about 230 px between the title and the N label
    leaves the net at about 63 % of the canvas width → net enlarged by about 10-15
    %. Likely cause: scale limits of ±1.32 around a net of radius 1.'
  - 'Suggestion: give the legend key area the legend''s own fill so the swatches do
    not sit on a separate rectangle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: bold dark title centred at top; heavy dark primitive circle with 10-degree ticks (longer every 30 degrees); bold N/E/S/W; dashed light-grey N-S/E-W reference cross; italic dark mean annotations (Foliation 268/28, Joint 356/78, Fault 151/55, Bedding 43/33); legend 'Feature Type' lower right on an elevated box. All text readable.
      Data: poles Bedding #009E73 (SE), Joint #C475FD (E rim), Fault #4467A3 (SW), Foliation #BD8233 (N of centre); great circles in the same hues at alpha 0.35, clearly visible; grey density contours around each cluster, the outer Joint contours spill past the primitive at E; black diamond mean poles; pale confidence ellipses. A Bedding pole sits under '43/33'.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title, cardinals, primitive ring, ticks and annotations in light ink; legend on #242420 with light text. No dark-on-dark text.
      Data: identical categorical hues to the light render; contours lighter grey; mean diamonds flip to near-white; great circles remain visible.
      Legibility verdict: PASS
