review:
  strengths:
  - Both panels share one identical band axis 0..30 (PACF lag 0 is a null gap), so
    every lag lines up vertically across ACF and PACF in both renders
  - ChartsReferenceLine draws the symmetric ±1.96/√N dashed bounds and a softer zero
    baseline, with the built-in end-aligned '95% CI' label instead of a separate legend
  - 'Correlations are computed from the series (sample ACF plus Durbin–Levinson PACF)
    and the render shows the textbook AR(2) signature: slow ACF decay, PACF cut-off
    after lag 2'
  - Chrome is threaded from ANYPLOT_TOKENS (ink for titles, inkSoft for ticks, axis
    lines and dashed bounds), so both themes read cleanly with identical brand-green
    stems
  - Y limits come from the data and the CI band, padded by Y_PAD, leaving room for
    negative correlations and the lower bound in both panels
  weaknesses:
  - 'VQ-01 (both): tick labels on all four axes at 12 px CSS read small against the
    15 px axis titles and blur in the 400 px thumbnail → 14 px (+2 px), the library
    prompt''s 14–16 px axis range. Likely cause: tickStyle fontSize: 12.'
  - 'DQ-02 (both): the series is labelled only as an abstract ''AR(2) Process'' with
    the value column ''Observation Value'', a generic synthetic context → name a real
    neutral series with the same dynamics, e.g. ''Daily Temperature Anomaly (°C)''
    and a matching title prefix. Likely cause: the VALUE constant and the title prefix.'
  - 'CQ-01 (code): acfAt, computePACF and paddedLimits are helper functions in the
    plot zone, outside the data block → inline the ACF and Durbin–Levinson loops at
    module level and compute the two limit objects directly. Likely cause: function-based
    structure for the computation.'
  - 'Suggestion: a faint horizontal grid at the 0.2 ticks in the ACF panel would make
    reading the stem heights against the bounds easier.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: centered bold title "AR(2) Process · acf-pacf · javascript · muix · anyplot.ai" (~36% of width) in dark ink; y titles "ACF" (top) and "PACF" (bottom) rotated on the left, x title "Lag" under the bottom panel; tick labels 0–30 under both panels and y ticks −0.2…1.0 (ACF) / −0.2…0.8 (PACF) in inkSoft; left and bottom axis lines only, no grid. All text readable.
      Data: thin brand-green (#009E73) stems per lag from a soft zero baseline. ACF: lag 0 = 1.0, then 0.72, 0.59, 0.49 … decaying, inside the bounds after lag 10, small negative stems at lags 26–30. PACF: starts at lag 1 (0.72), lag 2 ≈ 0.13 just outside the bound, all later stems inside. Dashed grey horizontal lines at about ±0.113 span all lags in both panels, labelled "95% CI" at the right end of the ACF upper line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, ticks and axis lines in light inkSoft, dashed bounds light grey; no dark-on-dark text anywhere.
      Data: stems identical #009E73 at identical heights; only chrome flipped.
      Legibility verdict: PASS
