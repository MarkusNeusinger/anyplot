review:
  strengths:
  - Both panels share the same 0-30 band axis with a null at PACF lag 0, so every
    lag lines up vertically and the PACF starts at lag 1 as the spec asks
  - categoryGapRatio 0.9 turns MUI X bars into thin stems from the zero baseline,
    each ending at its computed correlation
  - ChartsReferenceLine draws the ±1.96/sqrt(N) dashed bounds and a fainter zero hairline,
    with the native label/labelAlign tagging the band as '95% CI'
  - 'AR(2) temperature-anomaly data shows the textbook signature: slowly decaying
    ACF and a PACF that cuts off after lag 2'
  - Chrome threads ink/inkSoft tokens through ticks, axis lines and titles, so both
    themes are fully readable with identical brand-green stems
  weaknesses:
  - 'VQ-01 (both): the in-panel ''95% CI'' reference-line label is set at 11 px, well
    below the 14 px ticks, and blurs into an unreadable smudge in the 400 px thumbnail
    → about 13-14 px (+2 to +3 px). Likely cause: labelStyle={{ fontSize: 11 }} on
    the ACF ChartsReferenceLine.'
  - 'Suggestion: hide the tick labels on the ACF panel''s x axis so the lag numbers
    appear only once, under the PACF panel, which would read more clearly as one shared
    axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: bold dark title "Daily Temperature Anomaly · acf-pacf · javascript · muix · anyplot.ai" centered at top (~45% width); y-axis titles "ACF" (top) and "PACF" (bottom), x-axis title "Lag" under the bottom panel; tick labels 0-30 under both panels and -0.2..1.0 / -0.2..0.8 on the y axes in soft dark ink, all readable. Small "95% CI" label at the right end of the upper ACF bound (11 px, small).
      Data: thin #009E73 stems. ACF: lag 0 at 1.0, then 0.72, 0.59, 0.49 ... decaying inside the bounds by lag 11, small negative stems at lags 26-30. PACF: no stem at lag 0, 0.72 at lag 1, ~0.13 at lag 2, all later lags inside the bounds. Gray dashed lines at about ±0.113 span all lags in both panels; a faint solid zero line.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and tick labels flip to light ink and are clearly readable; dashed CI lines and the zero line flip to light gray and stay visible; no dark-on-dark text.
      Data: stems identical #009E73 at identical positions and heights as the light render; only chrome flipped.
      Legibility verdict: PASS
