review:
  strengths:
  - 'Significance encoding carries the reading: brand green #009E73 stems (width 3)
    and size-12 markers for lags outside the band against muted-ink stems (width 2)
    and size-9 markers inside it make the AR(2) signature — ACF spike at lag 1, PACF
    cutoff after lag 2 — legible at a glance in both renders'
  - 'Idiomatic plotly: make_subplots(rows=2, shared_xaxes=True, subplot_titles=...)
    with the None-separator multi-segment line trick, so all stems of one significance
    class ride in a single go.Scatter trace instead of 36 traces, and the confidence
    band is a fill=''toself'' polygon with a dashed border'
  - 'Library-native interactivity that adds value in the HTML detail view without
    costing anything in the PNG: hovertemplate ''Lag %{x}<br>Correlation: %{y:.3f}<extra></extra>''
    on the marker traces, hoverinfo=''skip'' on the chrome traces, and spikemode=''across''
    spike lines that track one lag across both panels; plot-{theme}.html is exported
    alongside the PNG'
  - 'Computes with the runtime''s libraries: statsmodels.tsa.stattools.acf and pacf(method=''ldb'')
    instead of a written-out Durbin-Levinson recursion, and conf_bound = 1.96/sqrt(n_obs)
    matches the spec''s stated bound'
  - 'Complete theme adaptation of title, subtitle, subplot titles, axis titles, tick
    labels, grid (15 % opacity), legend frame and the confidence-band fill/border,
    with the #009E73 data color identical on both surfaces'
  - 'Clean KISS script: no functions or classes, np.random.seed(42) for a deterministic
    AR(2) draw, every import used, autosize=False with width=800/height=450/scale=4
    for the exact 3200x1800 canvas'
  weaknesses:
  - 'VQ-07, DE-02 (both): the x-axis zeroline is left at the plotly_white default
    #EBF0F8 and draws a cool near-white vertical line at lag 0 through both panels
    (sampled at x=518-525 px in both renders) — on the #1A1A17 dark surface it is
    the brightest element in the figure and outshines the title → suppress it the
    way the y-axis zeroline already is. Likely cause: the update_xaxes block at lines
