review:
  strengths:
  - 'sns.lineplot(units="Lag", estimator=None) renders every lag as its own vertical
    segment: seaborn''s long-form statistical-unit pattern turned into a stem plot,
    for a chart type seaborn has no native function for.'
  - ACF and PACF come from statsmodels.tsa.stattools with the estimators that match
    the plot — acf(..., fft=False) for the full-sample ACF and pacf(..., method="ldb")
    for the Levinson-Durbin PACF — so the numbers behind the stems are library-computed
    rather than written out.
  - 'Theme chrome is threaded once through sns.set_theme(rc={...}) instead of being
    patched artist by artist: backgrounds, spines, ticks, text and the legend box
    all flip correctly between #FAF8F1 and #1A1A17, while the #009E73 data color is
    pixel-identical in both renders.'
  - 'Every Notes bullet of the spec is met: ACF on top including lag 0, PACF below
    from lag 1, shared x-axis, stem lines rather than filled bars, dashed 95% bounds
    at 1.96/sqrt(200) = 0.139, 35 lags, and the mandated "Lag" / "ACF" / "PACF" labels.'
  - sns.despine plus a 15% y-only grid and INK_SOFT spines keep the chrome quiet,
    and the amber CI band fill at alpha 0.07 reads as a region without competing with
    the stems in either theme.
  - 'The legend glyphs match the marks they explain in both themes — the green dot,
    the theme-adaptive muted dot and the amber dashed sample are all clearly visible
    on the #242420 elevated legend face in the dark render.'
  weaknesses:
  - 'CQ-01 (code): the make_stem_df helper at lines 97-104 makes the script Imports
    -> Data -> def -> Plot -> Save instead of the flat KISS order the criterion asks
    for -> inline the paired-row frame, e.g. `pd.concat([acf_df.assign(y=0.0), acf_df.assign(y=acf_df["Correlation"])])`.
    Likely cause: the stem pairing was factored out so the two panels could share
    it.'
  - 'VQ-01 (both): the 8 pt y-tick labels, legend text and annotations measure about
    5 px once the PNG is scaled to a ~400 px mobile width and blur into unreadable
    mush there, while the 12 pt title and 10 pt axis titles still hold -> about 10
    pt for ticks and annotations (+2 pt). Likely cause: tick_params(labelsize=8),
    legend(fontsize=8) and annotate(fontsize=8).'
  - 'Suggestion: the ARMA(1,1)-with-seasonality series is named "airline passenger
    residuals" only in a code comment, so the render itself carries no domain context;
    the optional `{Descriptive Title} · ` title prefix would put it in front of the
    viewer.'
  - 'Suggestion: the seasonal term (period 12, strength 0.3) never surfaces as visible
    ACF bumps at lags 12 and 24 — a stronger seasonal component would let the example
    data demonstrate that diagnostic pattern as well as the AR decay.'
  - 'Suggestion: hspace=0.3 leaves a wide gap between two panels that share an x-axis;
    tightening it would let the ACF/PACF pair read as one diagnostic unit and give
    the stems more vertical room.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across figure and both axes faces — not pure white. 3200x1800 px.
      Chrome: Title "acf-pacf · python · seaborn · anyplot.ai" centred at the top in dark ink (12 pt), fully inside the canvas with clear air above and below. Y-axis titles "ACF" (top panel) and "PACF" (bottom panel) and the x-axis title "Lag" (bottom) in dark ink at 10 pt. Tick labels in INK_SOFT dark grey at 8 pt; the ACF panel shares the x-axis so only the PACF panel carries the 0/5/10/.../35 lag labels. L-shaped spines (top and right despined) in INK_SOFT, horizontal grid at 15% alpha. Legend box top-right of the ACF panel on the #FFFDF6 elevated face with an INK_SOFT border: green dot "Significant", grey dot "Within CI", amber dashed sample "95% CI". Two grey annotations with thin arrows: "Gradual decay → AR process" pointing at ACF lag 4 and "Spike at lag 1 → AR(1) order" pointing at PACF lag 1. Nothing is clipped at any canvas edge; no element overflows its axis.
      Data: Two vertically stacked stem panels. Top (ACF): lag 0 at 1.00 then a geometric decay 0.79, 0.52, 0.35, 0.27, 0.26, 0.23, 0.15, with lags 0-7 above the upper bound drawn in #009E73 green (stem + dot) and lags 8-35 inside the band drawn in the theme-adaptive muted anchor #6B6A63. Bottom (PACF): a dominant green spike at lag 1 (0.79), a significant negative green spike at lag 2 (-0.26), a further green lag 5 (0.15), the rest muted grey and inside the band. Amber #DDCC77 dashed 95% bounds at +/-0.139 in both panels, with a 7%-alpha amber fill between them. First and only categorical series is #009E73 as required.
      Legibility verdict: PASS at canvas size — every text element is dark on the warm off-white surface with ample contrast, no light-on-light anywhere, no text/text or text/data collision. At a scaled-down ~400 px mobile width the title, "Lag" and the axis titles survive, but the 8 pt y-tick labels, legend entries and annotations degrade into unreadable mush (VQ-01 deduction, not a theme failure).

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 across figure and both axes faces — not pure black. 3200x1800 px, same layout as light.
      Chrome: Title in light cream #F0EFE8 — clearly visible. Axis titles "ACF", "PACF", "Lag" in the same light ink; tick labels in the light INK_SOFT #B8B7B0. Spines and grid flip to the light tokens and stay subtle. Legend box sits on the #242420 elevated face with a light INK_SOFT border; all three glyphs (green dot, light-grey dot, amber dashed sample) and their labels are plainly readable. Annotations render in the light muted token #A8A79F with matching arrows. NO dark-on-dark failure anywhere — every title, axis label, tick label, legend entry and annotation is light text on the near-black surface.
      Data: #009E73 green for the significant stems and dots is identical to the light render (verified pixel-for-pixel), as is the #DDCC77 amber of the CI bounds and band. The only color that changes is the "Within CI" grey, which moves from #6B6A63 to #A8A79F — that is the style guide's theme-adaptive `muted` semantic anchor behaving as designed, not a palette drift. Stem heights, marker positions and the +/-0.139 bounds are identical to the light render.
      Legibility verdict: PASS at canvas size — brand green #009E73, the amber bounds and the light muted dots all separate cleanly from the warm near-black background. Same ~400 px mobile caveat as the light render for the 8 pt text.
