review:
  strengths:
  - Both panels live in one pygal.XY chart with the ACF shifted up by a computed offset,
    so every lag lines up vertically on one shared lag axis, and each panel gets its
    own y tick labels (1, 0.5, 0, -0.5) through dict-valued y_labels
  - Thin stems drawn as interrupted XY line segments (allow_interruptions with None
    breaks) from each panel's zero baseline to the value, with a small dot at each
    head; ACF includes lag 0 at 1.0 and PACF starts at lag 1
  - ACF and PACF are computed with statsmodels acf/pacf, and the 1.96/sqrt(N) bound
    is computed and printed in the axis title (±0.139 for N=200)
  - Stems outside the 95% bounds are brand green and stems inside are muted ink, a
    hierarchy that makes the significant lags (seasonal oscillation in ACF, cutoff
    after lag 11 in PACF) read at a glance
  - Theme tokens are threaded through Style and the injected CSS (zero baselines in
    INK, guides in RULE), so both renders are fully legible; the HTML export keeps
    per-point tooltips with signed values via a custom formatter
  weaknesses:
  - 'SC-02 (both): the y axis carries one shared title ''Correlation'' and the panels
    are named only by bold corner labels, while the spec asks for y axes labeled ACF
    and PACF respectively → make each panel''s y labeling read ACF / PACF (for example
    drop the generic ''Correlation'' y_title and fold the panel name into the y labeling
    of each panel, such as ''ACF'' and ''PACF'' as the panel''s axis label text at
    its zero line). Likely cause: y_title=''Correlation'' with the panel names only
    in print_labels.'
  - 'Suggestion: the gap between the ACF''s lowest stem (about -0.62) and the PACF
    label is wider than the gap above the ACF; a slightly smaller GAP would tighten
    the two panels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no pure white.
      Chrome: bold dark title "acf-pacf · python · pygal · anyplot.ai" centered at top (~42% width); y-axis title "Correlation" rotated at left; x-axis title "Lag (months) · dashed lines: 95% confidence bounds ±0.139" at bottom; x ticks 0–36 every 6; per-panel y ticks (1, 0.5, 0, -0.5 for ACF; 0.5, 0, -0.5 for PACF); bold "ACF" and "PACF" labels at each panel's top right. Subtle horizontal guides, dark zero baselines, black dashed 95% bound lines in both panels. All text dark and readable.
      Data: thin vertical stems with small head dots; stems outside the bounds in #009E73, inside the bounds in muted gray #6B6A63. ACF starts at 1.0 at lag 0 and oscillates with a 12-month period (peaks near lags 12, 24, 36, troughs near 6, 18, 30); PACF starts at lag 1 (~0.83), negative spikes at lags 2–4, positive at 6–11, then inside the bounds.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles, tick labels and panel labels in light ink; zero baselines light; dashed bound lines light; guides subtle but visible. No dark-on-dark text anywhere.
      Data: stem colors identical to the light render (#009E73 significant); only the muted insignificant stems flip to the theme's light muted tone (#A8A79F), as the INK_MUTED chrome token does. Same layout and values.
      Legibility verdict: PASS
