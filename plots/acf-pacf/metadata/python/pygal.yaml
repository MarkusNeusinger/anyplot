review:
  strengths:
  - Computes ACF and PACF with statsmodels (acf with fft, pacf with method='ywm')
    and the bound as 1.96/sqrt(N) = ±0.139, so every stem ends at its computed value
    and the dashed bounds sit symmetrically about zero in both panels
  - Builds two stacked panels on one pygal XY chart sharing a single lag axis, so
    each lag lines up vertically between ACF (lag 0 to 36, lag 0 = 1.0) and PACF (lag
    1 to 36), with the panel names ACF and PACF placed as the y labels at each zero
    line
  - 'Thin stems drawn as one interrupted series per color (allow_interruptions with
    None breaks) plus small head dots, with stems outside the bounds in brand green
    #009E73 and those inside in muted ink, a hierarchy that makes the significant
    lags and the 12-month seasonal pattern read at a glance'
  - 'Theme tokens threaded through Style and inline CSS: warm backgrounds, light ink
    in dark mode, and dashed bounds readable in both renders; vertical guides and
    the x-axis line are switched off so nothing cuts through the lag-0 stem'
  - 'Library-native interactivity: per-point formatters show the un-offset correlation
    value (for example +0.833) in the HTML tooltips'
  weaknesses:
  - 'Suggestion: the ACF and PACF panels share one y-axis track, so each panel''s
    zero tick is replaced by its name; a small ''0'' beside the panel name would keep
    the zero line labelled numerically.'
  - 'Suggestion: the x-axis title carries the bound value as well as the lag unit;
    a shorter ''Lag (months)'' with the ±0.139 note in a subtitle would leave the
    axis title lighter.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, 3200x1800 landscape.
      Chrome: bold dark title "acf-pacf · python · pygal · anyplot.ai" centered at top (about 42% of the width); y tick labels 1, 0.5, -0.5 for the ACF panel and 0.5, -0.5 for the PACF panel in dark ink, with "ACF" and "PACF" as the labels at each panel's zero line; x ticks 0 to 36 every 6 lags; x-axis title "Lag (months) · dashed lines: 95% confidence bounds ±0.139". Subtle horizontal guides. All text readable.
      Data: top panel ACF lags 0-36 as thin vertical stems with head dots, lag 0 at 1.0, a sinusoidal 12-month pattern with peaks near lags 12, 24, 36 and troughs near 6, 18, 30; bottom panel PACF lags 1-36, lag 1 about 0.83, lags 2-3 near -0.48, then significant stems through lag 11 and small stems inside the bounds afterwards. Stems outside the bounds are #009E73 green, those inside muted grey. Black dashed lines at ±0.139 in each panel, a solid zero baseline per panel.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, tick labels, panel names and x-axis title in light ink (#F0EFE8 / #B8B7B0) on the dark surface; dashed bounds and zero lines flip to light; guides subtle but visible. No dark-on-dark text.
      Data: identical stems and dots, the same #009E73 green for significant lags; insignificant stems use the lighter muted token so they stay visible. Layout identical to the light render.
      Legibility verdict: PASS
