review:
  strengths:
  - 'Theme-adaptive chrome is executed perfectly: both renders are fully readable
    with only background/text/grid flipping, and the brand green #009E73 is byte-identical
    across light and dark.'
  - 'Statistically sound additive decomposition implemented from scratch in deterministic
    vanilla JS: centered 2x12 moving average for trend, mean-centered monthly seasonal
    index, and a residual computed consistently from both.'
  - Shared time axis across all four panels is reinforced with matching vertical gridlines
    at the same month positions in every panel, directly satisfying the spec's 'consistent
    x-axis for easy comparison' requirement.
  - 'Excellent canvas utilization: four panels plus title fill nearly the entire 3200x1800
    canvas with balanced, minimal padding and no wasted whitespace.'
  - Residual panel adds a dashed zero-reference line, a thoughtful interpretive aid
    that helps the viewer judge whether noise is centered without needing a legend.
  - Realistic, neutral data scenario (monthly retail sales with a holiday-season seasonal
    bump) with plausible scale and growth rate.
  weaknesses:
  - 'Mobile-scale legibility risk: stacking four panels vertically means subtitle
    labels (17pt) and tick/axis-title text (14-16pt) shrink to a fraction of their
    size when the 3200x1800 PNG is scaled to a ~400px-wide thumbnail. Consider nudging
    subtitle/axis-title font sizes up slightly, or giving the ''Original'' panel a
    taller share of vertical space, to keep small-viewport legibility comfortable.'
  - 'Design Excellence has room to grow: the four panels are visually uniform in treatment
    (same line weight, no depth cues). A subtle area fill (Chart.js ''fill: true''
    with low alpha) under the Original or Trend line, or a light highlight band over
    one notable seasonal cycle, would add visual depth and a stronger focal point
    without any plugin dependency.'
  - Library Mastery is generic Chart.js line/scatter usage; no distinctive Chart.js-only
    capability (e.g. built-in fill/gradient, or scale-linked crosshair via core interaction
    options) is demonstrated beyond the multi-instance layout trick.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark. Consistent across all four stacked panels.
      Chrome: Centered top title "timeseries-decomposition · javascript · chartjs · anyplot.ai" in dark ink, clearly readable. Each panel has a bold dark subtitle in the top-left ("Original", "Trend", "Seasonal", "Residual"). Only the bottom panel shows x-axis tick labels (2018-01 ... 2025-05) and the "Month" axis title; all four panels show a y-axis title with units ("Sales ($k)" / "Effect ($k)") and tick labels in a softer dark gray. Thin vertical gridlines line up at the same months across all panels, and a subtle horizontal divider separates each panel. No horizontal gridlines clutter the plot area.
      Data: Single green (#009E73) line/point series per panel — solid line for Original/Trend/Seasonal, discrete points for Residual, plus a dark dashed zero-reference line in the Residual panel. All data clearly visible against the light background.
      Legibility verdict: PASS — all title, subtitle, axis, and tick text is fully legible against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light. Consistent across all four panels.
      Chrome: Same title and per-panel subtitles now rendered in light/white text, fully legible against the dark background. Axis titles and tick labels are in a lighter soft-gray tone, and the zero-reference dashed line in the Residual panel is rendered in a light color instead of dark ink so it remains visible. Vertical gridlines and panel dividers are still present but subtle.
      Data: The green data line/points are pixel-identical in hue to the light render (#009E73) — only the chrome (background, text, grid, reference-line color) adapted to the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and the dashed reference line are clearly visible against the near-black background.
