review:
  strengths:
  - Four cleanly stacked panels (Original, Trend, Seasonal, Residual) share one continuous
    time axis, with only the bottom panel showing x tick labels to avoid repetition
    while thin dividers keep each panel legible
  - Classical additive decomposition (centered 2x12 moving average + monthly seasonal
    index, mean-centered) is implemented correctly and matches the spec's suggested
    method
  - Original panel uses an idiomatic Chart.js canvas-gradient fill (fading brand green)
    to give the headline series visual weight, while Trend/Seasonal use plain lines
    and Residual uses scattered points with a dashed zero-reference line - a sensible
    per-component visual encoding
  - 'Imprint palette compliance is perfect: brand green #009E73 identical in both
    themes, backgrounds/text/grid correctly theme-adaptive, no clipping or overlap
    in either render'
  - Deterministic, self-contained data generation via a fixed-seed LCG + Box-Muller
    gaussian, appropriate given the browser has no seeded RNG
  weaknesses:
  - Series count is 96 months, just under the spec's stated 100-1000 point range (still
    comfortably covers 8 full seasonal cycles, well above the 2-cycle minimum, so
    this is a minor deviation only)
  - The Residual panel's dashed zero-reference line has no visible label (legend is
    globally disabled) - relies on the reader inferring it aligns with the y=0 gridline
  - Helper functions (uniformRandom, gaussianNoise, hexToRgba) push the script slightly
    past a flat KISS Imports->Data->Plot structure, though this is largely unavoidable
    for LCG-based randomness and gradient color math in browser JS
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white.
      Chrome: Title "timeseries-decomposition · javascript · chartjs · anyplot.ai" in dark ink at top, fully visible, not clipped. Each of the four panels (Original, Trend, Seasonal, Residual) has a bold dark subtitle top-left. Y-axis titles ("Sales ($k)", "Effect ($k)") and the shared "Month" x-axis title (bottom panel only) are dark and legible. Tick labels are a slightly softer dark gray, clearly readable. Thin light-gray vertical gridlines run through all four panels at the same x positions, aiding cross-panel comparison.
      Data: All four series render in brand green #009E73. Original panel has a green line with a fading gradient area fill beneath it (denser near the line, near-transparent near the bottom) showing steady growth with an annual holiday-season bump. Trend panel is a smooth green line rising steadily from ~130 to ~225. Seasonal panel is a repeating green sawtooth cycle (peak ~+15 in Dec, trough ~-12 in Jan) identical every year. Residual panel shows small green dots scattered around a black dashed zero-reference line, with no obvious pattern - consistent with white noise.
      Legibility verdict: PASS - all text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black.
      Chrome: Same title and subtitle text, now rendered in light/off-white color, fully legible against the dark background. Axis titles and tick labels are also light-colored (primary vs. slightly dimmer secondary tone), matching the theme-adaptive chrome rules. Gridlines are faint light lines, subtle but visible. The zero-reference dashed line in the Residual panel is rendered in light ink (not black), remaining visible against the dark background.
      Data: The green line/fill/points are pixel-identical in hue to the light render (#009E73) - only the chrome (background, text, grid, dashed reference line color) flips. Gradient fill in the Original panel is still visible and reads well against the dark background.
      Legibility verdict: PASS - no dark-on-dark failures; all titles, subtitles, axis labels, and tick labels are clearly legible against the near-black background.
