review:
  strengths:
  - Correct 4-panel stacked decomposition (Original, Trend, Seasonal, Residual) sharing
    a common time axis, exactly matching the spec structure
  - Mathematically sound additive decomposition (centered moving average + seasonal
    averaging), a legitimate D3-only substitute for statsmodels in the browser
  - 'Appropriate density-aware encoding: continuous monotone lines for Original/Trend/Seasonal
    vs. a stem+dot plot for the noisy Residual component'
  - 'Correct Imprint palette usage: brand green (#009E73) on the Original series,
    colors identical between light and dark renders, theme-adaptive chrome threaded
    via ANYPLOT_TOKENS throughout'
  - Exact mandated title format; deterministic seeded LCG data generation appropriate
    for the offline browser runtime
  - Shared vertical gridlines across all four panels make it easy to trace a single
    date through the whole decomposition, satisfying the spec's 'light grid lines'
    requirement
  - Dashed zero-reference line on the signed Seasonal/Residual panels aids reading
    positive/negative deviations
  weaknesses:
  - No y-axis value label/units anywhere (e.g. 'Sales ($)') — only numeric tick values
    and the panel name ('Trend', 'Seasonal') are shown, so the reader never learns
    the unit of the measured quantity
  - 'Design Excellence is good but not exceptional: typography hierarchy and grid
    styling are solid but generic-safe — add a stronger deliberate touch (e.g. slightly
    bolder trend line, a subtle callout on the Nov/Dec holiday spike) to push storytelling
    from ''good'' to ''excellent'''
  - Panels are drawn with a plain `panels.forEach(...)` loop instead of a D3 data-join
    (`svg.selectAll('.panel').data(panels).join('g')...`) — works fine but is less
    idiomatic D3 for a repeated multi-panel layout
  - Trend uses an accelerating quadratic term (`0.9 * i * i`) producing ever-increasing
    growth over 10 years; real mature retail trends usually decelerate/saturate rather
    than accelerate — a gentler or saturating trend would read as more factually grounded
  - Title occupies only ~35% of the 3200px canvas width at 22px — a bit small/light
    relative to the large canvas; slightly larger fontsize or weight would balance
    the composition better
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "timeseries-decomposition · javascript · d3 · anyplot.ai" and grey subtitle at top, four bold dark panel labels ("Original", "Trend", "Seasonal", "Residual"), dark-ink y-axis tick labels, grey "Date" x-axis label at the bottom under year ticks (2015-2024). All chrome text is clearly legible against the light background.
      Data: Original line in brand green (#009E73), Trend line in blue, Seasonal line in lavender/purple, Residual shown as grey stems with dots. Subtle vertical gridlines run through all four panels; a dashed grey zero-reference line appears in the signed Seasonal and Residual panels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/panel-labels/axis text, now rendered in light ink (near-white/light-grey) against the dark background. Gridlines and axis domain lines rendered in a lighter, low-contrast tone appropriate for dark chrome.
      Data: Original (green), Trend (blue), Seasonal (lavender), Residual (grey stems/dots) — colors are pixel-identical to the light render; only the chrome (background, text, gridlines) flipped. No dark-on-dark or light-on-light failures observed anywhere; every title, panel label, tick label, and axis label is clearly readable.
      Legibility verdict: PASS
