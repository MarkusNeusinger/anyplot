review:
  strengths:
  - 'All three Attempt-1 fixes are cleanly applied: an explicit "Sales ($)" shared
    y-axis unit label now exists, the four panels are built via a proper D3 data-join
    (`svg.selectAll(''.panel'').data(panels).join(''g'')`) instead of a plain forEach,
    and the trend now uses a decelerating `log1p` growth curve instead of the previous
    unrealistic accelerating quadratic.'
  - New "Holiday peak" callout (amber circle + label) on the Seasonal panel gives
    the chart a clear focal point and directly answers the prior storytelling feedback.
  - Correct 4-panel stacked additive decomposition (Original, Trend, Seasonal, Residual)
    sharing one time axis, mathematically sound centered-moving-average + seasonal-averaging
    implementation — a legitimate D3-only substitute for statsmodels in the browser.
  - 'Density-appropriate encoding: continuous curveMonotoneX lines for Original/Trend/Seasonal
    vs. a stem+dot plot for the noisy Residual component, plus a dashed zero-reference
    line on the signed panels.'
  - Theme-adaptive chrome threaded via ANYPLOT_TOKENS is verified pixel-identical
    for data colors between light and dark renders; both are fully legible.
  weaknesses:
  - Title still occupies only ~43% of the 3200px canvas width at 27px — a slightly
    larger/bolder title would balance the composition better against the large multi-panel
    canvas.
  - Series color order breaks strict Imprint canonical order (Original=palette[0],
    Trend=palette[2], Seasonal=palette[1] instead of 0,1,2) for abstract categories
    with no real-world color association — not a violation since all hues remain Imprint-sourced
    and CVD-safe, but canonical order would be the stricter choice.
  - Residual series uses an ad-hoc custom gray hex (`#6B6A63` light / `#A8A79F` dark)
    rather than an existing ANYPLOT_TOKENS value (e.g. `inkSoft`) — visually fine
    but introduces an off-token value not defined in the Imprint style guide.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "timeseries-decomposition · javascript · d3 · anyplot.ai" and a grey subtitle at top. Four vertically stacked panels labeled "Original", "Trend", "Seasonal", "Residual" in dark ink, each with dark tick labels on a warm off-white surface. Shared "Date" x-axis label at bottom and rotated "Sales ($)" y-axis unit label on the far left. Subtle vertical gridlines trace one date through all four panels; a dashed zero-reference line marks the signed Seasonal/Residual panels. An amber "Holiday peak" callout (circle + label) highlights a December seasonal spike.
      Data: Original = brand green (#009E73), Trend = blue, Seasonal = lavender, Residual = grey stem+dot plot. First series correctly uses the brand green.
      Legibility verdict: PASS — all title, panel-label, axis-label, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, subtitle, panel labels, "Date"/"Sales ($)" axis labels, and holiday-peak callout now render in light ink/amber against the dark surface; gridlines and axis domain lines shift to a lighter, low-contrast tone appropriate for dark chrome.
      Data: Original/Trend/Seasonal/Residual colors are pixel-identical to the light render (green/blue/lavender/grey) — only chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures found; every text element (title, subtitle, panel labels, tick labels, axis labels, callout label) is clearly legible against the near-black background.
