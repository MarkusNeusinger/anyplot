review:
  strengths:
  - Panel colors now follow the canonical Imprint 1->N order top to bottom (Original=#009E73,
    Trend=#C475FD, Seasonal=#4467A3, Residual=#BD8233), fixing the previous swap/theme-flip
    issues.
  - Every panel now carries an explicit '$k' units label via a hand-drawn rotated
    Typography box, addressing the earlier missing-units weakness without colliding
    with tick numbers.
  - Creative simulation of native faceting (which MUI X community lacks) via four
    stacked LineChart panels sharing consistent left/right margins and the same time
    domain, so panels stay visually aligned.
  - Deterministic in-browser LCG (no seeded Math.random available) produces a realistic
    quadratic trend, a strong annual seasonal cycle with a holiday spike, and bounded
    noise that reconstruct into a plausible additive original series.
  - Clear per-panel component labels plus dashed zero-reference lines on Seasonal/Residual
    make the decomposition easy to read at a glance; monotoneX curve smoothing avoids
    distracting sharp kinks.
  weaknesses:
  - Title occupies only ~34% of canvas width at fontsize=22 -- well under the ~70-85%
    naturally expected for the ~59-char mandated title -- which makes it noticeably
    small when the PNG is scaled down to a ~400px mobile thumbnail. Consider growing
    the title fontsize slightly (e.g. 26-28px CSS) for better mobile legibility, as
    long as it still fits the 46px title bar without clipping.
  - Panel labels ('Original', 'Trend', 'Seasonal', 'Residual') and the '$k' unit label
    are quite small at mobile thumbnail scale, an inherent trade-off of splitting
    the canvas into 4 stacked panels -- worth a minor bump in fontsize if headroom
    allows.
  - '''$k'' is a minimal unit label; a slightly more descriptive axis label (e.g.
    ''Revenue ($k)'') on at least the Original panel would remove any residual ambiguity
    about what is being decomposed.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "timeseries-decomposition · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible and not clipped (measured ~34% of canvas width). Each of the four stacked panels (Original, Trend, Seasonal, Residual) has a bold dark-ink label at its top-left, and each now also has a small rotated "$k" units label on the far left that does not collide with the y-axis tick numbers. Y-axis tick numbers and the shared bottom x-axis month/year ticks (Jan 2015 .. Jan 2025) are dark and clearly legible. Horizontal grid lines are thin and subtle, visible but not dominant.
      Data: Original is brand green (#009E73), Trend is lavender/purple (#C475FD), Seasonal is blue (#4467A3), Residual is ochre/orange (#BD8233) -- this now matches the canonical Imprint 1->N order top to bottom. Dashed zero-reference lines appear on the Seasonal and Residual panels. All lines are clearly distinguishable from the cream background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, now in light text, fully visible and not clipped. Panel labels are light-colored and legible against the dark background. The "$k" units label uses the theme-adaptive inkSoft token so it renders as light gray, readable but intentionally secondary. Y-axis and x-axis tick labels are light and clearly readable -- no dark-on-dark text anywhere. Horizontal grid lines are faint but visible light lines.
      Data: Original (green), Trend (lavender), Seasonal (blue), and Residual (ochre) are the identical hex colors as the light render -- only the chrome (background/text/grid) flipped, as required. This fixes the prior review's flagged issue where Residual used the theme-flipping inkSoft token for its line color; Residual is now a fixed Imprint hex identical across both themes.
      Legibility verdict: PASS
