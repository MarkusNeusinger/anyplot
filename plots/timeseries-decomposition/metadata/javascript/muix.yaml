review:
  strengths:
  - Four vertically stacked panels in spec order, each on its own y scale, so the
    ±24 seasonal and ±18 residual components are not flattened by the 220-575 original
    range
  - One shared time axis (identical min/max on every panel, x axis drawn only on the
    last) with year-aligned vertical grid lines, so a date reads straight down through
    all four panels
  - 'Correct classical additive decomposition: centred 2x12 moving average, normalised
    seasonal indices, trend/residual left as null gaps at the unestimated edges via
    connectNulls: false'
  - Informative subtitle naming the quantity, observation count, date span and method
    (additive, period 12)
  - 'Clean theme threading: ink/inkSoft/grid tokens on all chrome, Imprint positions
    1-4 identical in both renders'
  - 'Idiomatic MUI X v9: scaleType ''time'' with valueFormatter, explicit axis bands,
    position ''none'', skipAnimation; native tooltips in the HTML view'
  weaknesses:
  - 'Suggestion: the x-axis title ''Month'' sits about 40 px below the tick labels;
    a smaller x-axis band would tie it to the axis.'
  - 'Suggestion: naming the quantity on the y axes (''Sales (thousand USD)'') instead
    of the bare unit would let each panel read without the subtitle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "timeseries-decomposition · javascript · muix · anyplot.ai" centred at the top, grey subtitle "Retail sales (thousand USD) · 120 observations, Jan 2015 – Dec 2024 · additive, period 12". Four stacked panels labelled Original, Trend, Seasonal, Residual in bold dark text at their top-left; each has a rotated "thousand USD" y-axis title and its own ticks (200–600, 200–600, −40–40, −20–20). A single x axis at the bottom with yearly ticks Jan 2015 … Jan 2024 and the title "Month". Subtle grey horizontal and year-aligned vertical grid in every panel; dashed zero lines in the Seasonal and Residual panels. All text readable.
      Data: Original in brand green #009E73 rising from ~220 to ~575 with December spikes; Trend in purple (Imprint 2), smooth, starting mid-2015 and ending mid-2024; Seasonal in blue (Imprint 3) repeating a sawtooth with a December peak every year; Residual in ochre (Imprint 4), irregular within ±18, also starting/ending at the unestimated edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and panel names in light ink, ticks/axis titles/subtitle in light grey inkSoft, grid lines dim grey but visible, dashed zero lines light grey. No dark-on-dark text anywhere.
      Data: green, purple, blue and ochre lines identical to the light render; only chrome flipped.
      Legibility verdict: PASS
