review:
  strengths:
  - Creative simulation of a native subplot/facet layout (which MUI X community lacks)
    via four stacked LineChart panels sharing consistent left/right margins and the
    same date domain, so the panels stay visually aligned on the shared time axis.
  - Deterministic in-browser LCG (no seeded Math.random available) produces a realistic
    quadratic trend, a strong annual seasonal cycle with a holiday spike, and bounded
    noise that reconstruct into a plausible additive original series.
  - Clear per-panel component labels ('Original', 'Trend', 'Seasonal', 'Residual')
    plus dashed zero-reference lines on Seasonal/Residual make the decomposition easy
    to read at a glance; monotoneX curve smoothing avoids distracting sharp kinks.
  - Correct brand-green-first rule for the primary Original series; 120 monthly points
    (10 years, 10 seasonal cycles) comfortably exceeds the spec's 2-cycle minimum.
  weaknesses:
  - 'Panel color order deviates from the canonical Imprint 1→N assignment without
    a semantic reason: Trend uses palette[2] (blue) while Seasonal uses palette[1]
    (lavender) — the two are swapped relative to their top-to-bottom appearance. Assign
    Trend = palette[1] and Seasonal = palette[2] to follow position order, or document
    the semantic justification if intentional.'
  - No panel exposes a units/axis label (e.g. 'Revenue ($k)') — only raw numeric ticks
    are shown, so a viewer can't tell what scale the values represent without reading
    the source code.
  - Residual is drawn in the theme-adaptive `inkSoft` token rather than a fixed Imprint
    color, so its line color visibly flips between light and dark renders (dark gray
    in light mode, light gray in dark mode) — this technically breaks the 'data colors
    identical across themes' rule even though the intent (de-emphasizing noise as
    non-categorical) is reasonable. Consider a fixed neutral hex outside the categorical
    palette that doesn't flip with theme.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "timeseries-decomposition · javascript · muix · anyplot.ai" in dark ink, top-left, fully visible and not clipped. Each of the four stacked panels (Original, Trend, Seasonal, Residual) has a bold dark-ink label at its top-left. Y-axis tick numbers and the shared bottom x-axis month/year ticks (Jan 2015 .. Jan 2025) are dark and clearly legible. Horizontal grid lines are thin and subtle, visible but not dominant.
      Data: Original is brand green (#009E73), Trend is blue, Seasonal is lavender/purple, Residual is dark gray. Dashed zero-reference lines appear on the Seasonal and Residual panels. All lines are clearly distinguishable from the cream background and from each other.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light/white text, fully visible and not clipped. Panel labels are light-colored and legible against the dark background. Y-axis and x-axis tick labels are light gray/white and clearly readable — no dark-on-dark text anywhere. Horizontal grid lines are faint but visible light lines.
      Data: Original (green), Trend (blue), and Seasonal (lavender) are the identical hex colors as the light render — only the chrome (background/text/grid) flipped, as required. Residual is rendered in a light gray (the theme-adaptive `inkSoft` token), which is a color reversal versus the light render's dark gray — flagged separately as a weakness, but it does not hurt legibility since it still contrasts well against the dark background.
      Legibility verdict: PASS
