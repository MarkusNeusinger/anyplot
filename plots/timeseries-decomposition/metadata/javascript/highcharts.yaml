review:
  strengths:
  - 'Both attempt-1 weaknesses were addressed directly and effectively: pane titles
    now carry real typographic hierarchy (bold/17px "Original" vs. 13px/500-weight
    secondary panes), and the new "One full seasonal cycle" plotBand gives the chart
    a concrete analytical focal point'
  - Correct classical additive decomposition (centered 2x12 moving average trend,
    monthly seasonal averaging, deseasonalized residual) - methodologically sound
    and matches the spec's suggested approach
  - 'Idiomatic Highcharts multi-pane technique: stacked yAxis array with percentage
    heights is the correct native way to build a 4-panel shared-x-axis decomposition
    chart'
  - Imprint palette correctly applied - Original = brand green (palette[0]), Trend
    = blue (palette[2]), Seasonal = lavender (palette[1]); Residual uses a deliberate
    muted grey to de-emphasize noise versus signal
  - Both themes render correctly with no dark-on-dark or light-on-light failures;
    the highlight band's low opacity works identically well on both surfaces
  - Deterministic fixed-seed LCG data generation; clean single-file procedural code
    with no fake interactivity
  weaknesses:
  - Pane y-axes still carry no unit context (e.g. "Index") - a small unit hint alongside
    the pane titles would round out axis clarity, though this is a minor polish item,
    not a blocker
  - The last x-axis tick renders as a truncated "Jan..." due to Highcharts' automatic
    datetime-label collision handling - cosmetic only, no pixels are clipped at the
    canvas edge
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Title "timeseries-decomposition · javascript · highcharts · anyplot.ai" and subtitle "Additive decomposition · 12-month centered moving average" render in dark ink, clearly legible. Four stacked pane titles (Original bold/17px, Trend/Seasonal/Residual lighter 13px/500-weight secondary style) all readable. Shared datetime x-axis (Jan 2017 - Jan 2025) at the bottom, subtle light grid lines throughout.
      Data: Original = brand green line (palette[0], #009E73), Trend = blue line (palette[2]), Seasonal = lavender line (palette[1]), Residual = muted-grey columns. A low-opacity (5%) vertical band spans all four panes over Jan 2020-Jan 2021, labeled "One full seasonal cycle."
      Legibility verdict: PASS - all text clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title/subtitle/pane-title hierarchy, rendered in light/off-white ink, clearly legible against the dark surface. Subtle dark-grey grid lines. Seasonal-cycle highlight band and label carry over correctly.
      Data: Identical colors to light render (green/blue/lavender/muted-grey) - confirms only chrome flipped, not data.
      Legibility verdict: PASS - no dark-on-dark failures; all text and the highlight-band label read clearly.
