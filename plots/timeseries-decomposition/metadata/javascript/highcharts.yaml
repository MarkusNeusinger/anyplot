review:
  strengths:
  - Correct classical additive decomposition (centered 2x12 moving average trend,
    monthly seasonal averaging, deseasonalized residual) — methodologically sound
    and matches the spec's suggested approach.
  - 'Idiomatic Highcharts multi-pane technique: stacked yAxis array with percentage
    heights is the correct native way to build a 4-panel shared-x-axis decomposition
    chart.'
  - Imprint palette correctly applied — Original uses brand green (palette[0]), Trend
    uses blue (palette[2]), Seasonal uses lavender (palette[1]); Residual uses a deliberate
    muted grey to visually de-emphasize noise versus signal.
  - 'Both themes render correctly: warm off-white / near-black backgrounds, all text
    legible, no dark-on-dark or light-on-light failures.'
  - Deterministic fixed-seed LCG data generation; clean single-file procedural code
    with no fake interactivity.
  weaknesses:
  - Design excellence is solid but generic — no visual accent or annotation gives
    the chart an analytical focal point (e.g. highlighting one full seasonal cycle
    or the growth-trend slope). A subtle highlight would strengthen data storytelling
    (DE-03).
  - The four pane labels (Original/Trend/Seasonal/Residual) share identical typographic
    weight and size — a touch more hierarchy (e.g. slightly bolder/larger label on
    the primary 'Original' series) would sharpen aesthetic sophistication (DE-01).
  - Pane y-axes carry no unit context (e.g. 'Index'); a small unit hint alongside
    the pane titles would round out axis clarity, though not a hard spec requirement
    here.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark.
      Chrome: Title "timeseries-decomposition · javascript · highcharts · anyplot.ai" and subtitle "Additive decomposition · 12-month centered moving average" render in dark ink, clearly legible. Four pane titles (Original, Trend, Seasonal, Residual) are bold dark-grey text at top-left of each pane, fully readable. X-axis month/year tick labels along the bottom and Y-axis tick labels for each of the 4 panes are dark-grey on the light surface, all legible. Grid lines are light grey and subtle but visible.
      Data: Original = brand green line (#009E73), Trend = blue line (palette[2]), Seasonal = lavender line (palette[1]), Residual = muted grey columns. Colors are clearly distinguishable from the off-white background and from each other.
      Legibility verdict: PASS — no light-on-light issues found; verified at full size and at the 400px thumbnail export.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light.
      Chrome: Title and subtitle render in light/off-white ink, clearly legible against the dark surface. Pane titles (Original, Trend, Seasonal, Residual) are light-grey bold text, fully readable. X/Y tick labels are light-grey on the dark surface, all legible. Grid lines are subtle dark-grey, visible without dominating.
      Data: Same brand green, blue, lavender, and muted grey as the light render — data colors are identical between themes; only the chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures found; all text and data series read clearly against the near-black background.
