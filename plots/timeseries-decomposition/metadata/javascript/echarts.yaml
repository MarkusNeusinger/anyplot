review:
  strengths:
  - Correct classical additive decomposition (centered 12-month moving average for
    trend, seasonal-index averaging, residual = original - trend - seasonal) implemented
    from scratch and deterministically via a fixed-seed LCG.
  - Multi-grid ECharts layout with axisPointer link produces a synced crosshair/tooltip
    across all four stacked panels — a genuinely distinctive ECharts capability that
    would be hard to replicate cleanly in most other libraries.
  - 'Correct Imprint palette usage: brand green (#009E73) for Original, canonical
    palette order for Trend/Seasonal/Residual, identical data colors across light/dark,
    and theme-correct chrome (ink/inkSoft/grid tokens) in both renders.'
  - Currency-formatted y-axis ticks and a dashed zero-reference markLine in the Residual
    panel aid interpretation of the decomposition.
  weaknesses:
  - No explicit axis-title text (e.g. 'Revenue (USD)' or 'Year') — only the bold panel
    labels ('Original', 'Trend', 'Seasonal', 'Residual') and $-formatted ticks stand
    in for axis labels; add a dedicated y-axis title per panel (or a shared one) to
    fully satisfy descriptive-axis-labels-with-units.
  - Design Excellence sits at 'well-configured default' level — consider a design
    touch that visually foregrounds an insight (e.g. annotate the strongest holiday-season
    peak in the Seasonal panel, or callout the largest Residual outlier) to push Data
    Storytelling beyond a plain 4-panel display.
  - Code relies on several small helper functions (makeXAxis, makeYAxis, makePanelLabel,
    dollarFormatter) rather than a flat Imports -> Data -> Plot script; understandable
    for 4-panel DRY reuse, but a more KISS-aligned structure would inline more of
    this.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "timeseries-decomposition · javascript · echarts · anyplot.ai" centered top in dark ink, clearly readable. Four bold dark panel labels ("Original", "Trend", "Seasonal", "Residual") sit top-left of each subplot, not overlapping the $-formatted y-axis ticks below them. X-axis year ticks (2014-2023) appear only under the bottom (Residual) panel; light gray vertical/horizontal grid lines are subtle but visible across all four panels.
      Data: First series (Original) renders in Imprint brand green #009E73; Trend in lavender/purple (#C475FD); Seasonal in blue (#4467A3); Residual in ochre/brown (#BD8233) with a dashed dark zero-reference line. All colors match Imprint canonical order.
      Legibility verdict: PASS — all text (title, panel labels, tick labels) is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Title and all four panel labels render in light/white text, clearly readable. Tick labels are light gray (inkSoft token), grid lines are faint light gray, appropriately subtle on the dark surface.
      Data: Data colors are identical to the light render — same brand green, lavender, blue, and ochre lines; the dashed zero-reference line in Residual is rendered in the dark-theme ink token (light color), consistent with the theme.
      Legibility verdict: PASS — no dark-on-dark failures; every title, panel label, and tick label is clearly visible against the near-black background.
