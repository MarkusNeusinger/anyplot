review:
  strengths:
  - 'Both attempt-1 weaknesses fully resolved: explicit unit-labeled y-axis titles
    on every panel, and two storytelling annotations ("Peak season", "Largest outlier")
    giving clear visual focal points'
  - Correct classical additive decomposition (centered 12-month moving average trend,
    seasonal-index averaging, residual) implemented from scratch and deterministically
    via a fixed-seed LCG
  - Multi-grid ECharts layout with linked axisPointer produces a synced crosshair/tooltip
    across all four stacked panels - a genuinely distinctive ECharts capability
  - Correct Imprint palette in canonical order (green/lavender/blue/ochre), identical
    across light/dark, with theme-correct chrome in both renders
  weaknesses:
  - Aesthetic sophistication is solid/professional but not yet visually distinctive
    beyond currency formatting and per-panel color coding
  - Still relies on several small helper functions (makeXAxis, makeYAxis, makePanelLabel,
    dollarFormatter) rather than a fully flat script, though reasonably justified
    by 4-panel DRY reuse
