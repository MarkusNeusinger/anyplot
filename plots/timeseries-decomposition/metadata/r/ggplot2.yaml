review:
  strengths:
  - All four required decomposition components (Original, Trend, Seasonal, Residual)
    are displayed as clean vertically stacked facets sharing a continuous time axis,
    exactly per spec
  - Theme-adaptive chrome is correctly threaded through plot/panel backgrounds, strip
    labels, axis text, and title — both renders pass the light/dark legibility check
    with identical data colors
  - 'Thoughtful touches: dashed zero-reference line on the Residual facet, free_y
    per-facet scaling so each component''s shape is readable at its own scale, and
    a title-fontsize formula that adapts to the square canvas'
  - Realistic, neutral synthetic dataset (10 years of monthly retail sales with growth
    trend plus biannual/annual seasonality and noise), reproducible via set.seed(42)
  - Clean, idiomatic ggplot2 code using base R decompose() — no unnecessary dependencies,
    no functions/classes, canvas dimensions match the square target exactly
  weaknesses:
  - 'Palette order breaks the canonical rule: Trend uses IMPRINT_PALETTE[3] (blue)
    and Seasonal uses IMPRINT_PALETTE[4] (ochre), skipping position 2 (lavender).
    Original/Trend/Seasonal/Residual are abstract decomposition categories with no
    real-world color association, so canonical order should apply — reassign Trend
    to IMPRINT_PALETTE[2] (#C475FD, lavender) and Seasonal to IMPRINT_PALETTE[3] (#4467A3,
    blue).'
  - Grid lines are rendered at full INK strength (panel.grid.major.y color=INK, no
    alpha) rather than a faint tone — they read as fairly solid horizontal lines in
    both themes instead of the 'very subtle' 15-25% opacity the style guide calls
    for. Since ggplot2 doesn't expose grid alpha, blend INK toward PAGE_BG manually
    to produce a genuinely faint line color.
  - Title is tight against the square canvas — it spans roughly ~95% of the plot panel
    width, right at the edge of the acceptable proportion. Trim the title fontsize
    a bit further (or tighten the square_baseline formula) so it sits comfortably
    inside the panel with more breathing room.
  - Residual scatter markers (size=1.6) are on the small side for ~120 points spread
    across a wide facet; bumping to ~2.0-2.2 would improve visibility without causing
    overplotting.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the plot area and the four facet strip bands, which use a slightly lighter elevated tone for the "Original" / "Trend" / "Seasonal" / "Residual" strip labels.
      Chrome: Bold dark title "timeseries-decomposition · r · ggplot2 · anyplot.ai" at top-left, dark bold strip labels, dark "Date" x-axis title and rotated "Retail Sales (thousands $)" y-axis title, medium-grey tick labels on all four facets. All chrome text is clearly legible against the light background.
      Data: Original = brand green (#009E73) rising sawtooth-with-growth line; Trend = blue (#4467A3) smooth monotonic line; Seasonal = ochre (#BD8233) repeating cyclical line; Residual = muted grey scatter points with a dashed zero-reference line. Horizontal grid lines are present at every major tick and are fairly solid dark-grey (not fully alpha-faded), which is a bit stronger than the "very subtle" style-guide target but does not obscure any text or data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the plot area, with darker-elevated strip bands for the facet labels.
      Chrome: Title, strip labels, axis titles, and tick labels all render in light/white tones, clearly readable against the dark background — no dark-on-dark failures observed anywhere (title, axis text, tick labels, strip text all confirmed legible).
      Data: Identical brand green / blue / ochre / muted-grey data colors as the light render — only the chrome (background, text, grid, strip fills) flipped, confirming theme-adaptive tokens were used correctly. Horizontal grid lines again render as fairly solid light-grey/white lines against the dark background, matching the light render's boldness (a shared minor weakness, not a theme-specific one).
      Legibility verdict: PASS
