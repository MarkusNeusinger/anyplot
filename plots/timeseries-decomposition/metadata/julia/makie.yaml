      Background: Warm off-white (#FAF8F1-consistent) across the figure and all four stacked panel backgrounds.
      Chrome: Bold dark title "Monthly Retail Sales · timeseries-decomposition · julia · makie · anyplot.ai" centered at top, fully readable (measured ~43.5% of canvas width). Each of the four panels ("Original", "Trend", "Seasonal", "Residual") has a left-aligned bold dark panel title. Y-axis tick labels are soft dark gray and readable on every panel; x-axis year tick labels (2019-2027) appear only on the bottom Residual panel via the shared/linked x-axis. A single rotated "Sales (thousand USD)" label spans the left side of all four panels, fully visible with no left-edge clipping.
      Data: Original = green (#009E73) line; Trend = lavender line (correctly starts/ends short of the full range due to moving-average edge NaNs); Seasonal = blue repeating sinusoidal cycle; Residual = neutral gray stem/scatter around a dashed zero line, with 108 points now densely but still legibly plotted.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the figure and all four panels.
      Chrome: Title and panel titles render in light/white ink, clearly legible. Tick labels use a lighter soft gray, fully readable — no dark-on-dark failures anywhere.
      Data: Colors (green/lavender/blue/gray) are pixel-identical to the light render, confirming only chrome flips between themes, not data color.
      Legibility verdict: PASS

    Both renders pass legibility; no theme-adaptation failures found. No AR-08 (fake interactivity) or AR-09 (edge clipping) violations observed in either render.
