review:
  strengths:
  - 'Physically accurate classical additive decomposition: centered 2xN moving-average
    trend correctly leaves NaN at the series edges, seasonal component is a proper
    deseasonalized-average cycle, and residual = original - trend - seasonal — a technically
    faithful reproduction of seasonal_decompose logic in pure Julia.'
  - 'Idiomatic use of Makie''s GridLayout: linkxaxes! for a shared time axis, x-tick
    labels shown only on the bottom (Residual) panel to avoid redundant clutter, and
    a Label spanning fig[1:4, 0] for a single shared y-axis title.'
  - Residual panel is a thoughtful stem/scatter plot with a dashed zero-reference
    line rather than a plain reused line style, which better represents noise as discrete,
    unpredictable values than a continuous line would.
  - 'Theme-adaptive chrome is correctly implemented: data colors (green/blue/lavender)
    are pixel-identical between light and dark renders, only background/text/grid/spine
    tokens flip, and both renders are legible.'
  weaknesses:
  - Data size is 72 monthly points (6 years), below the specification's recommended
    100-1000 point range (it does satisfy the 'minimum 2 seasonal cycles' requirement
    with 6 cycles). Consider extending to ~9-10 years of monthly data, or using a
    finer granularity (e.g. weekly) to land within the recommended range while keeping
    several full seasonal cycles.
  - 'Component-to-palette assignment skips canonical order: Original=palette[1] (green,
    correct), Trend=palette[3] (blue), Seasonal=palette[2] (lavender) — using palette[2]
    for Trend and palette[3] for Seasonal would follow the canonical 1-2-3 sequence
    more closely. Minor/soft issue since the first-series-green rule is satisfied
    and all colors stay within the Imprint set.'
  - Auto-scaled title fontsize (~17px for the ~78-char mandated+descriptive title)
    leaves the title occupying only ~40% of canvas width, below the comfortable 50-70%
    range. Not an overflow problem, but a slightly bolder base fontsize would give
    the page title more presence without risking overflow.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent) across the figure and all four panel backgrounds.
      Chrome: Bold dark title "Monthly Retail Sales · timeseries-decomposition · julia · makie · anyplot.ai" centered at top, clearly readable. Each of the four stacked panels ("Original", "Trend", "Seasonal", "Residual") has a left-aligned bold panel title in dark ink. Y-axis tick labels are soft dark gray and readable on every panel; x-axis year tick labels (2019-2024) appear only on the bottom Residual panel (shared/linked x-axis), avoiding redundant labels. A single rotated "Sales (thousand USD)" label spans the left side of all four panels. Subtle vertical gridlines mark year boundaries; top/right spines are hidden.
      Data: Original = green (#009E73) line; Trend = blue line (starts/ends short of the full range due to correct moving-average edge NaNs); Seasonal = lavender repeating sinusoidal cycle; Residual = neutral gray stem/scatter plot around a dashed zero line.
      Legibility verdict: PASS — all title, panel-title, and tick text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent) across the figure and all four panel backgrounds.
      Chrome: Title and all panel titles render in light/white ink, clearly legible against the dark background. Y-axis and x-axis tick labels use a lighter soft gray, fully readable, no dark-on-dark failures. Gridlines remain subtle but visible; spines styled consistently with the light render (top/right hidden).
      Data: Original (green), Trend (blue), Seasonal (lavender), and Residual (gray stems) are pixel-identical in hue to the light render — confirms only chrome, not data color, flips between themes.
      Legibility verdict: PASS — no dark-on-dark or illegible elements found in either panel titles, tick labels, or the shared y-axis label.
