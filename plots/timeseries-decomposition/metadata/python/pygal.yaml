review:
  strengths:
  - Panels composed from pygal's own SVG output as nested <svg> elements, so the PNG
    stays vector-sharp and the HTML keeps pygal's native hover tooltips per panel
  - Computed per-panel left margins put every plot area on the same x, so a date lines
    up from the original down to the residual
  - Each panel has its own fitted y range with a 12% pad and four major levels, so
    seasonal and residual are not flattened
  - Imprint positions 1-4 assigned one per component, with theme-correct chrome in
    both renders
  - Date ticks shown only under the bottom panel, keeping the upper panels uncluttered
  weaknesses:
  - 'VQ-01 (both): tick labels at 30 and axis titles (''ppm'', ''Date'') at 30 sit
    below the pygal references 44 and 56 and read small beside the 60 px main title
    → tick labels about 40-44 (+10 to +14), axis titles about 44-56 (+14 to +26),
    shrinking panel padding if the four 422 px panels need the room. Likely cause:
    Style(label_font_size=30, major_label_font_size=30).'
  - 'DQ-01 (code): the series has 72 monthly observations, below the spec''s 100-1000
    points → at least 100 observations, e.g. 120 months (+48). Likely cause: n_months
    = 72.'
  - 'Suggestion: a consistent horizontal axis line across all four panels (the top
    two draw one, the lower two do not) would make the stack read more uniformly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas.
      Chrome: bold dark title "timeseries-decomposition · python · pygal · anyplot.ai" (~58% of the width) above four stacked panels titled Original series, Trend, Seasonal, Residual; each has a "ppm" y title and four y tick levels; date ticks (2020-01 … 2025-07, every 6 months) and "Date" only under the bottom panel. Dashed muted y guides only. All text dark and readable.
      Data: original #009E73, trend #C475FD (stops short at both ends, as the moving average leaves the edges unestimated), seasonal #4467A3 repeating six identical cycles, residual #BD8233 irregular. Plot areas share the same left and right x across all panels.
