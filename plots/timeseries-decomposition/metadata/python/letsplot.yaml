review:
  strengths:
  - statsmodels seasonal_decompose (additive, period 12) drives all four components
    in the required order, each panel labelled
  - Each panel's y scale fits its component, with readable 'Temperature (°C)' titles
    and several ticks per panel
  - gggrid() composes the panels natively; HTML output keeps lets-plot tooltips
  - Imprint palette in canonical order, identical in both themes
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2700 instead of 3200x1800 → 3200x1800 (−1600
    × −900). Likely cause: ggsize(1600, 900) with ggsave(scale=3) instead of ggsize(800,
    450) with scale=4.'
  - 'VQ-01, VQ-07 (dark): the main title is drawn in #F0EFE8 on a pure #FFFFFF title
    band and is nearly unreadable → title on the #1A1A17 page surface. Likely cause:
    the final gggrid theme sets only plot_title; add plot_background=element_rect(fill=PAGE_BG,
    color=PAGE_BG).'
  - 'VQ-07, DE-01 (both): outer canvas, title band, margins and gaps between panels
    are pure #FFFFFF instead of #FAF8F1 / #1A1A17 → PAGE_BG everywhere. Likely cause:
    anyplot_theme reaches only the sub-plots; the gggrid container keeps the default
    white background.'
  - 'SC-02 (both): C2 broken — Trend and Residual cover only Jul 2019–Jun 2023 but
    are stretched to the same width as Original and Seasonal (Jan 2019–Dec 2023),
    so a date does not line up vertically, and the only x labels are month names without
    years → one shared date range in every panel and year labels. Likely cause: no
    shared scale_x_datetime(limits=...), dropna() per panel, default month-only date
    format.'
  - 'SC-04 (both): the title ''timeseries-decomposition · letsplot · anyplot.ai''
    lacks the language segment → ''timeseries-decomposition · python · letsplot ·
    anyplot.ai''. Likely cause: the ggtitle string.'
  - 'DQ-03 (code): the trend rises from 15 to 18 °C over 60 months (0.6 °C per year),
    tens of times faster than real climate warming, while the comment calls it gradual
    → a slope plausible for the domain. Likely cause: np.linspace(15, 18, n_months).'
  - 'CQ-04 (code): four near-identical ggplot blocks (lines 74–112) differ only in
    data, color and title, and the comment ''Okabe-Ito palette'' sits over Imprint
    hexes → one loop over the components and a correct comment. Likely cause: copy-pasted
    panel blocks.'
  - 'DE-02 (both): every panel has a four-sided frame and a dense major+minor grid
    at size 0.5 → L-shaped axes and a lighter major-only grid. Likely cause: default
    panel border and minor grid kept.'
  - 'Suggestion: 60 monthly points sit below the spec''s 100–1000 size; ten years
    of months would give the trend more to show.'
  image_description: |-
