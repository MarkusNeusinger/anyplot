      Data: Original #009E73, Trend #C475FD, Seasonal #4467A3, Residual #BD8233. Trend and Residual are stretched over the full width although they cover Jul 2019–Jun 2023 only, so their dates do not line up with Original and Seasonal (Jan 2019–Dec 2023).
