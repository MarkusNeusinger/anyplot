review:
  strengths:
  - Statsmodels seasonal_decompose drives the four components, so trend, seasonality
    and residual are computed, not drawn by hand
  - make_subplots with shared_xaxes gives one date axis that lines up all four panels
    while each keeps its own fitted y scale
  - Theme tokens reach every chrome element, including the zero line switched off,
    so both renders read cleanly
  - 'Imprint positions 1-4 in canonical order, #009E73 on the original series'
  - hovertemplate with month-formatted dates gives exact component values in the HTML
    view
  weaknesses:
  - 'VQ-06 (both): the top y-axis title reads ''Passengers'' because the code strips
    the unit from ''Passengers (thousands)'' → keep the unit, ''Passengers (thousands)''.
    Likely cause: PASSENGERS.split(" (")[0] in the y-axis title loop.'
  - 'Suggestion: the y-axis titles of rows 2-4 repeat the panel labels; showing the
    unit there instead, or dropping the repeat, would declutter the left margin.'
