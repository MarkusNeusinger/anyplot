review:
  strengths:
  - Four panels in the order the spec asks (Original, Trend, Seasonal, Residual),
    each with its own y scale, so the seasonal and residual components are not flattened
    by the original's range
  - plt.subplots(sharex=True) gives one shared time axis, so a date lines up vertically
    through all four panels
  - Decomposition computed with statsmodels seasonal_decompose (additive, period 12)
    instead of being hand-rolled
  - 'Theme tokens threaded through labels, ticks, spines and grid: both renders are
    fully readable, data colors identical across themes'
  - Exact 3200x1800 canvas via figsize (8, 4.5) at dpi 400 and subplots_adjust, no
    bbox trimming
  weaknesses:
  - 'DQ-03 (both): the original series runs at 100–200 ''Sales (USD)'' per month,
    an implausibly small turnover for a retail sales series → label the unit as thousands
    (''Sales (thousand USD)'') or scale the values to a realistic store level. Likely
    cause: the SALES constant and the y labels built from ''(USD)''.'
  - 'Suggestion: the seasonal panel could mark the December holiday bump so the viewer
    finds the pattern the data was built around.'
  - 'Suggestion: a dedicated matplotlib touch such as mdates.YearLocator with minor
    month ticks would let readers count the seasonal period off the shared axis.'
  image_description: |-
