review:
  strengths:
  - 'Idiomatic plotnine grammar: long-format data with an ordered Categorical drives
    facet_wrap(ncol=1, scales=''free_y''), giving each component its own fitted y
    scale on one shared date axis'
  - statsmodels seasonal_decompose with period 7 produces a clean weekly seasonal
    and a slow trend; injected campaign, outage and viral-post spikes stand out in
    the residual panel
  - 'Theme tokens threaded through every chrome element: both renders are fully readable
    with identical brand-green data'
  - Daily website sessions with busy weekdays and quiet weekends is a realistic, neutral
    scenario at plausible scale
  weaknesses:
  - 'VQ-02 (both): the y tick labels of the short Trend panel (4000-6500 in six 500-steps),
    and likewise Original and Residual, sit edge to edge with no gap between neighbouring
    labels → at least a few px of clear space between labels (fewer breaks or taller
    panels). Likely cause: each data panel is only about 180 px tall, so five or six
    default breaks per panel stack 8 pt labels flush.'
  - 'VQ-05 (both): the four strip bands take about 45% of each panel''s height and
    blank gaps of similar size sit between the panels, so the data areas fill only
    about 40% of the canvas height → data panels at least about 60% of the height
    (smaller strip padding, smaller panel_spacing_y). Likely cause: strip_text without
    a reduced margin plus panel_spacing_y=0.04.'
  - 'Suggestion: a slightly heavier line for the Original panel would set it apart
    as the input the other three panels decompose.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panels, 3200x1800.
      Chrome: bold dark title "timeseries-decomposition · python · plotnine · anyplot.ai" centred at about 67% width; four facet strips (Original, Trend, Seasonal, Residual) on #FFFDF6 with dark outline and bold dark text; shared y title "Daily website sessions", x title "Date", x ticks Feb-Oct 2024 every two months; soft-grey y tick labels per panel that sit flush against each other in the short panels; faint grid in every panel. All text readable.
      Data: single #009E73 line in every panel - original with weekly sawtooth and upward drift (3,000-7,500), trend from about 4,000 to 6,500 starting and ending three days in, seasonal 7-day pattern from -1,000 to +600 repeated 39 times, residual noise with spikes near Feb, early Jul and late Jul.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, strips on #242420 with light-grey outline.
      Chrome: title, strip labels and axis titles in light ink, tick labels in light grey; no dark-on-dark text; grid faint but visible.
      Data: identical #009E73 lines and shapes to the light render; only chrome flipped.
      Legibility verdict: PASS
