review:
  strengths:
  - Decomposition computed with statsmodels seasonal_decompose (additive, period 12)
  - Shared x_range links all four panels for synchronized pan and zoom in the HTML
  - Each panel labelled with its component name and drawn on its own y scale
  - Imprint positions 1-4 in canonical order with theme-correct text in both renders
  weaknesses:
  - 'VQ-05 (both): the canvas is 4800x2561 instead of the canonical 3200x1800 (+1600
    x +761 px) → 3200x1800. Likely cause: total_width = 4800, panel_height = 650 and
    W, H = 4800, 2700 without the CDP Emulation.setDeviceMetricsOverride that pins
    the viewport.'
  - 'VQ-01 (both): tick labels at 16 pt and axis titles at 20 pt on a 4800 px canvas
    read small beside the 26 pt panel titles (reference 34 pt ticks, 42 pt axis titles
    at 3200 px) → about 22-24 pt ticks on a 3200 px canvas. Likely cause: major_label_text_font_size
    = ''16pt'' with an oversized canvas.'
  - 'VQ-06 (both): the y titles of panels 2-4 read ''Trend'', ''Seasonal'', ''Residual''
    without a unit → ''Passengers (thousands)'' or a component title with the unit.
    Likely cause: y_label arguments in the create_themed_figure calls.'
  - 'VQ-07 (both): 1 px seams in an off-theme color run between the panels and along
    the top/left canvas edge, light gray on the dark page → the page color. Likely
    cause: the browser-default document background showing through the column layout
    gaps.'
  - 'CQ-01 (code): lines 60-113 define a helper create_themed_figure, and the file
    has no Data/Plot zone markers or column constants → a flat loop over the panels
    with DATE/VALUE constants above a single Data block. Likely cause: helper-function
    structure.'
  - 'CQ-04 (code): line 25 defines ELEVATED_BG, never used, and the comment on line
    29 calls the Imprint hexes ''Okabe-Ito'' → remove the constant and correct the
    comment. Likely cause: leftovers from an older palette.'
  - 'Suggestion: a HoverTool showing date and component value would add value to the
    HTML view.'
