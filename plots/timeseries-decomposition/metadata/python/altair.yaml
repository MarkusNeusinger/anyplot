review:
  strengths:
  - Idiomatic long-form facet(row=...) with bold left row headers labels each component
  - resolve_scale(y='independent') gives the seasonal and residual panels their own
    scales with readable ticks
  - Uses statsmodels seasonal_decompose directly; edge-unestimated trend and residual
    shown honestly
  - HTML output keeps tooltips and zoom/pan via interactive()
  weaknesses:
  - 'VQ-01 (dark): the title, x tick labels and the ''Date'' axis title are drawn
    in light ink on a pale frame outside the panels and are nearly invisible → the
    whole canvas on #1A1A17 so the light ink reads. Likely cause: no chart background
    set; add .properties(background=PAGE_BG).'
  - 'VQ-07 (both): the area around the panels (title band, axis margins) stays the
    renderer''s pale default instead of #FAF8F1 / #1A1A17 → page colour across the
    whole canvas. Likely cause: only configure_view(fill=PAGE_BG) is set, no chart
    background.'
  - 'VQ-05 (both): the canvas is 5034x3054, neither 3200x1800 nor 2400x2400 → 3200x1800
    (-1834 × -1254). Likely cause: width=1600, height=200 per panel at scale_factor=3.0
    and no pad-to-target step.'
  - 'SC-02 (both): the Original and Trend panels start at 0, so the trend sits as
    a nearly flat line in the top third of its panel (C3) → scales fitted to each
    component. Likely cause: alt.Scale(zero=True) default on y.'
  - 'SC-04 (both): the title reads ''timeseries-decomposition · altair · anyplot.ai''
    without the language → ''timeseries-decomposition · python · altair · anyplot.ai''.
    Likely cause: the title string.'
  - 'VQ-06 (both): no y axis names the value or its unit → name passengers (thousands)
    once, e.g. on the Original panel. Likely cause: y title=''''.'
  - 'CQ-01 (code): no # Data / # Plot zone markers and no column constants for the
    date and value roles → one Data block binding df and one constant per column role
    above it. Likely cause: column names typed inline.'
  - 'CQ-04 (code): lines 11-15 rewrite sys.path with hard-coded interpreter paths
    and force noqa: E402 on every import, and configure_legend styles a legend the
    chart does not have → delete both. Likely cause: an environment workaround left
    in the script.'
