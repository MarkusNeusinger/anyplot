      Data: Original #009E73, Trend #C475FD (with a dip-and-recover hook in the last ~6 months), Seasonal #4467A3 (12-month twin-peaked cycle repeating 8x), Residual #BD8233 (irregular +/-300); dashed zero lines in seasonal and residual.
