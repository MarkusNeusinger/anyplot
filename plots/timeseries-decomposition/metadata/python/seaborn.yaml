review:
  strengths:
  - Theme chrome threaded through sns.set_theme rc tokens; no dark-on-dark text, data
    colors identical in both themes
  - Four panels share one date axis and each keeps its own y scale
  - 'Imprint palette in canonical order with #009E73 on the original series'
  - Comfortable text sizes at the style guide's proportions
  weaknesses:
  - 'VQ-02 (both): adjacent y-labels collide on the left edge — ''Original (kWh)''
    runs into ''Trend (kWh)'' and ''Seasonal (kWh)'' overlaps ''Residual (kWh)'' →
    each label within its own panel''s height. Likely cause: 20 pt y-labels on panels
    squeezed by hspace=0.25 with tight_layout.'
  - 'VQ-05 (both): canvas is 4747x2695 instead of 3200x1800 → figsize=(8, 4.5), dpi=400
    without bbox_inches=''tight''. Likely cause: figsize=(16, 9), dpi=300 and bbox_inches=''tight''
    in savefig.'
  - 'SC-04 (both): title ''timeseries-decomposition · seaborn · anyplot.ai'' lacks
    the language segment → ''timeseries-decomposition · python · seaborn · anyplot.ai''.
    Likely cause: the suptitle string.'
  - 'SC-02 (both): C4 partly missed — the trend dips by about 200 kWh around 2023-08
    to 2023-10 and climbs back because partial edge windows pick up the seasonal swing
    → a monotonically rising trend (or one that stops short of the edges, which C6
    permits). Likely cause: rolling(window=period, center=True, min_periods=1).'
  - 'CQ-04 (code): lines 75–78 hand-roll a decomposition that statsmodels.tsa.seasonal.seasonal_decompose
    computes, lines 88–133 repeat one panel block four times, and INK_MUTED/RULE (lines
    21–22) are never used → seasonal_decompose plus one loop over the components,
    delete the unused tokens. Likely cause: copy-paste panel construction.'
  - 'LM-01 (code): sns.lineplot receives bare index and array vectors (x=df.index,
    y=df[''consumption'']) instead of a tidy DataFrame with data=, x=, y= column names,
    and spine/tick colors are set per axis although the theme rc already sets them
    → build a long df of components and pass data=. Likely cause: vector-style lineplot
    calls.'
  - 'Suggestion: a shared ''kWh'' unit label would remove the repeated component names
    from the y-labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, but the canvas is 4747x2695 instead of 3200x1800.
