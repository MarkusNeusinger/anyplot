review:
  strengths:
  - 'Light render is flawless: entry cells are the fixed cream #FFFDF6 and blocking
    cells the fixed near-black #1A1A17, exactly matching the constants defined in
    code, with correct theme-adaptive chrome (page background, title, grid lines)
    layered on top.'
  - 180-degree rotational block symmetry is guaranteed by construction (seeding only
    the upper half and mirroring each seed) rather than hand-typed, so the classic
    newspaper-crossword pattern is structurally guaranteed correct.
  - Word-start numbering logic correctly scans left-to-right/top-to-bottom and numbers
    a cell only when it starts an across and/or down entry — numbers are legible,
    bold, and cleanly top-left aligned in every cell with no overlap.
  - 'Nice design touches beyond a bare grid: a double-ruled ''matted'' outer border
    (heavy ink rule + thin inset accent) gives a print-puzzle-book feel, and DataAspect()
    guarantees perfect 1:1 square cells as the spec requires.'
  - Clean, minimal, fully deterministic code (no randomness needed for a fixed puzzle
    layout), only the two necessary imports (CairoMakie, Colors), current idiomatic
    Makie API (poly!, linesegments!, hidedecorations!/hidespines!, GridLayout).
  weaknesses:
  - 'CRITICAL — dark render inverts the crossword''s data encoding. Pixel-sampled
    all 225 cells: in plot-dark.png every entry cell (should stay the fixed CELL_ENTRY
    = #FFFDF6, identical to light) instead renders as (36,36,32) ≈ #242420, which
    is the theme-adaptive ELEVATED_BG dark token, and every blocked cell (should stay
    fixed CELL_BLOCKED = #1A1A17) instead renders as (240,239,232) ≈ #F0EFE8, the
    theme-adaptive INK dark token. The light render is 100% correct against the fixed
    constants, so this is not sampling noise — the dark PNG was produced with the
    block/entry fill swapped for chrome tokens, reversing which color means ''write
    here'' vs ''blocked'' relative to the light render and to the traditional convention
    the spec requires (''white cells for letter entry, black cells for blocking'').
    Fix: verify at render time that the `poly!` call for `plot-dark.png` actually
    receives `CELL_BLOCKED`/`CELL_ENTRY` (the two hard-coded, non-theme-conditional
    constants) and not `INK`/`ELEVATED_BG` — regenerate the dark PNG and re-diff pixel
    values against light before resubmitting.'
  - The intended subtitle ('15 × 15 grid · N across · M down', built via `Label(fig[2,1],
    ...)` with `rowsize!(fig.layout, 2, Fixed(50))`) does not appear anywhere in either
    rendered PNG — scanned every pixel below the outer grid frame (y > 2312 in both
    renders) and found zero non-background pixels, i.e. the row is fully blank. The
    GridLayout row is likely being pushed outside the 1200x1200 canvas because the
    DataAspect()-constrained Axis in row 1 claims the full available height first.
    Either fix the layout so row 2 actually renders inside the canvas, or remove the
    dead Label/counter code (it currently computes n_across/n_down for nothing).
  - Title occupies only ~40% of the plot width (title x-range 722–1675 of 2400px)
    — below the ~50–70% comfortable range from the style guide for a title this length;
    a couple of points of titlesize would improve balance (not a hard violation, but
    noticeably small relative to the square canvas).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "crossword-basic · julia · makie · anyplot.ai" is dark ink, bold, centered, fully readable. No axis labels/ticks (correctly hidden via hidedecorations!). Grid lines are a soft dark gray, subtle but clearly separate every cell. A heavier dark outer frame plus a thin inset accent line frame the whole grid.
      Data: 15×15 grid of square cells (DataAspect enforced). Blocking cells are near-black (#1A1A17), entry cells are warm white (#FFFDF6) — pixel-verified against all 225 cells with zero mismatches. 180°-symmetric block pattern. Bold numbers (fontsize 19) sit top-left in every cell that starts an across/down entry, in a soft dark gray, fully legible with no overlap.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title is light cream ink, bold, centered, fully readable — correctly flipped from the light render.
      Data: CRITICAL ISSUE — the black/white cell encoding is NOT identical to the light render as required. Pixel-sampled all 225 cells: every cell that is an entry cell in the light render (fixed white #FFFDF6) instead shows a dark fill (36,36,32 ≈ #242420, the dark-theme ELEVATED_BG token), and every blocked cell (fixed black #1A1A17 in light) instead shows a light fill (240,239,232 ≈ #F0EFE8, the dark-theme INK token). The result is a grid whose entry/blocking meaning is effectively swapped/theme-dependent rather than the fixed, theme-invariant monochrome pattern the spec and the code's own constants (CELL_BLOCKED/CELL_ENTRY) call for. The numbers themselves stay legible (light-gray digits show adequate contrast against whichever fill they land on), but the plot conveys the WRONG structural information in dark mode relative to light mode.
      Legibility verdict: FAIL — data colors are not theme-invariant; the core crossword encoding is inconsistent between the two renders (see VQ-07/VQ-03 in the score, and top weakness).
