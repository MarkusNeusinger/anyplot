review:
  strengths:
  - Correct 180-degree rotational symmetric black-cell construction by seeding only
    the upper half and mirroring, rather than a hand-typed matrix
  - Clue numbering logic correctly follows the standard across/down word-start convention
  - Smart theme-adaptive ink mapping keeps blocked-vs-entry contrast strong in both
    themes without blocked cells washing out against the near-black dark background,
    while the grid's data identity stays constant
  - Canvas exactly matches the square 2400x2400 target with balanced margins
  weaknesses:
  - Clue numbers are on the small side for a 2400x2400 canvas with only ~40 of them
    - sizing them up would improve legibility at desktop and mobile widths
  - 'Design Excellence is close to default: consider subtle refinement (frame/gridline
    contrast, minor emphasis) to add visual polish beyond a plain grid'
  - Library Mastery usage is generic Makie primitives (poly!, linesegments!, text!)
    - leveraging a more distinctive Makie feature could raise LM-02
