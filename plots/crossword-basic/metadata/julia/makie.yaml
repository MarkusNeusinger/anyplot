review:
  strengths:
  - Symmetric black-cell placement is guaranteed programmatically by seeding only
    the upper half and mirroring each seed, rather than hand-verifying a hardcoded
    180-degree-symmetric matrix.
  - Word-start numbering correctly derives from across/down adjacency checks (left-to-right,
    top-to-bottom scan) instead of a hardcoded numbers dict.
  - Double-ruled outer border (heavier ink rule plus a thin inset accent drawn entirely
    in the margin) gives the grid a refined 'matted' printed-puzzle-book feel.
  - Data-encoding colors (black blocked cells, white entry cells) are intentionally
    held constant across light/dark themes per style-guide convention, with clear
    code comments explaining the rationale.
  - Subtitle row ('15 x 15 grid - 43 across - 37 down') adds a small data-storytelling
    touch beyond the bare grid, using an explicit fixed row height so the DataAspect-constrained
    grid above doesn't squeeze it away.
  - Clean, minimal imports (CairoMakie, Colors only); no randomness needed since the
    layout is deterministically hand-crafted, satisfying reproducibility without an
    explicit seed.
  weaknesses:
  - 'In the dark render, blocked (black) cells use the exact same hex color as the
    page background (#1A1A17), so they read as ''gaps''/voids in the grid rather than
    solid black squares -- only the thin INK_SOFT grid lines delineate their boundaries.
    Consider a very slightly distinct shade for blocked cells in dark mode (e.g. a
    hair lighter or darker than #1A1A17) so they remain visually distinct filled cells
    rather than blending into the surrounding chrome.'
  - Clue numbers (fontsize=19, bold) are legible but modestly sized relative to the
    generous cell size on the 2400x2400 canvas; a slightly larger size would give
    them a bit more presence, especially at mobile scaling.
  - Data storytelling beyond the subtitle is minimal (inherent to the crossword-grid
    genre) -- an optional touch like subtly differentiating across-only vs. down-only
    start cells could add a bit more visual hierarchy, though this is not required
    by the spec.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "crossword-basic · julia · makie · anyplot.ai" in bold dark text at top, clearly
        readable. Subtitle caption "15 × 15 grid · 43 across · 37 down" below the grid in muted
        gray, clearly readable. Grid frame drawn as a heavier dark ink rule with a thin inset
        accent line just outside it (double-ruled "matted" border).
      Data: 15x15 grid of square cells. White/cream entry cells and solid black blocking cells
        arranged in a symmetric pattern (180-degree rotational symmetry confirmed by inspection).
        Bold gray numbers sit in the top-left corner of every cell that starts an across and/or
        down entry (1 through 73, matching the "43 across · 37 down" caption). Thin gray grid
        lines separate every cell, including between adjacent black cells.
      Legibility verdict: PASS -- all text (title, subtitle, clue numbers) is clearly readable
        against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title now rendered in light/off-white text, clearly readable against the dark
        background. Subtitle caption also flips to light gray and stays readable. Grid frame and
        inset accent line render in light ink, clearly visible around the puzzle.
      Data: Entry cells remain the same fixed off-white fill as the light render (by design, since
        the black/white cell pattern is the plot's data and must stay theme-invariant). Clue
        numbers remain the same soft-gray color sitting on the (still light) entry cells, so they
        stay legible. Blocked cells are filled with the same fixed dark hex value used in the light
        render, which happens to equal the dark theme's page background color -- so blocked cells
        read as voids/gaps rather than distinct solid squares, though the thin light-colored grid
        lines still trace every cell boundary (including blocked ones), so the grid structure and
        symmetry remain fully legible on close inspection.
      Legibility verdict: PASS -- no dark-on-dark text failures; all title/subtitle/number text
        sits on light-toned surfaces (dark chrome background or white entry cells), never on the
        black cells themselves. The blocked-cell/background color coincidence is a minor visual
        design smell (noted in weaknesses) but not a text-legibility failure.

    Data colors are confirmed identical between the two renders (black/white cell fill, numbers'
    relative tone) -- only the chrome (title, subtitle, border, grid-line color) flips between
    themes, matching the Imprint theme-adaptation convention.
