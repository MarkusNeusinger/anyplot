review:
  strengths:
  - Symmetric 15x15 block pattern generated by seeding only the upper half and mirroring
    each seed, guaranteeing the required 180-degree rotational symmetry by construction
    rather than a hand-checked matrix
  - Correct across/down word-start numbering algorithm, numbers placed top-left of
    each entry cell in standard left-to-right, top-to-bottom scan order
  - Distinctive double-ruled outer border (heavier ink frame plus a thin inset accent
    line in the margin) gives a print-book feel beyond a flat single outline
  - DataAspect() correctly enforces the spec's required 1:1 square cell aspect ratio
  - 'Light-mode render is fully theme-correct: white entry cells, black blocking cells,
    legible bold numbering, correct title format'
  weaknesses:
  - 'Entry/blocked cell fill colors use theme-flipping chrome tokens (INK for blocked
    cells, ELEVATED_BG for entry cells) instead of fixed data-encoding colors. In
    dark mode this fully inverts the puzzle''s core black/white convention: entry
    cells render near-black (#242420, RGB 36,36,32 -- barely distinguishable from
    the #1A1A17 page background) and blocked cells render near-white (#F0EFE8-ish,
    RGB 240,239,232) -- the opposite of the light render and of the spec''s ''white
    cells for letter entry, black cells for blocking'' requirement. Per the style
    guide, only chrome (title, ticks, grid, legend fill) may flip between themes --
    the grid''s block/entry pattern IS the plot''s data and must use identical colors
    in both renders. Fix: introduce two fixed, theme-invariant colors for cell fills
    (e.g. a constant near-black for blocked cells and a constant near-white/off-white
    for entry cells, unaffected by ANYPLOT_THEME), and reserve INK/ELEVATED_BG for
    the chrome roles they were designed for (text, legend fill).'
  - The '{N} x {N} grid · {n_across} across · {n_down} down' subtitle (Label in fig[2,1])
    never appears in either render -- the Axis in fig[1,1] with DataAspect() consumes
    almost the entire 1200x1200 figure (grid border reaches y~2310 of 2400px), leaving
    under 90px of margin with no visible text. Either reserve a fixed height for the
    label row (e.g. rowsize!(fig.layout, 2, Fixed(40))) so the subtitle actually renders,
    or remove the dead code -- as written the intended data-storytelling addition
    delivers no visible value in either theme.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1 page background), grid drawn on top with a warm near-white eggshell fill (#FFFDF6) for entry cells.
      Chrome: Title "crossword-basic · julia · makie · anyplot.ai" centered at top in dark ink, clearly readable. 15x15 grid with thin gray rule lines between all cells and a heavier dark double-ruled outer border. Clue numbers in bold gray-ink text sit in the top-left corner of numbered entry cells and are all legible. No subtitle text is visible below the grid -- the grid border sits almost flush with the bottom canvas edge.
      Data: Blocking cells render near-black (#1A1A17), entry cells render near-white (#FFFDF6), following the traditional newspaper-crossword convention correctly. Symmetric block pattern is clearly visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black page background (#1A1A17). Title and clue numbers use light-toned ink and remain fully readable against the dark background -- no dark-on-dark text failures.
      Chrome: Grid rule lines and outer border correctly flip to a lighter tone for visibility against the dark page. No subtitle text is visible below the grid, same as the light render.
      Data: The cell fill colors are NOT identical to the light render -- they are inverted. Entry cells now render near-black (RGB ~36,36,32), almost indistinguishable from the #1A1A17 page background, while blocking cells now render near-white (RGB ~240,239,232). This is the opposite of the light render's black-blocked/white-entry convention and violates the rule that data-encoding colors must stay identical across themes (only chrome may flip). The puzzle pattern is still readable via the grid rule lines, but the black/white semantic is reversed and entry-cell fill contrast against the page background is very low.
      Legibility verdict: FAIL (cell fill color inversion; low entry-cell/background contrast)
