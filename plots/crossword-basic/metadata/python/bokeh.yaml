review:
  strengths:
  - 'Exact 2400x2400 square canvas in both themes: the CDP device-metrics override
    pins the viewport, so the full grid, frame and margins are captured'
  - Clue numbers are computed from the grid (across/down starts) and rise 1-67 in
    reading order, placed in the top-left corner of each starting cell
  - Black-cell pattern has verified 180-degree rotational symmetry, generated by mirroring
    half the positions
  - 'Idiomatic Bokeh: ColumnDataSource per cell type, vectorized rect glyphs, LabelSet
    batched from a source'
  - HoverTool scoped to numbered cells gives clue lookup in the interactive HTML
  - Heavy outer frame against thin inner cell lines gives a clean printed-puzzle hierarchy
  weaknesses:
  - 'VQ-01 (dark): clue numbers render in INK_SOFT #B8B7B0 on pure-white #FFFFFF entry
    cells, about 2:1 contrast, and read faint → a dark ink on the white cells in both
    themes (for example #4A4A44, above 4.5:1). Likely cause: LabelSet text_color=INK_SOFT,
    a page-chrome token, used on cells that stay white in dark mode.'
  - 'SC-02 (both): entry cell in row 8, column 8 (the grid center) is enclosed by
    black cells on all four sides, so the entry cells do not form one connected area
    (C4) → every entry cell reachable from the others; e.g. drop (7, 6) or (6, 7)
    from black_positions and re-check the symmetry. Likely cause: black_positions
    (6, 7), (7, 6), (7, 8) and their mirror (8, 7) box in the center.'
  - 'Suggestion: in dark mode, the entry cells could use the same warm white #FFFDF6
    as the light render for a consistent print look.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the 2400x2400 canvas.
      Chrome: bold title "crossword-basic · python · bokeh · anyplot.ai" in dark ink, centered and fully visible; no axes, ticks or legend (correct for a crossword). A heavy dark perimeter frame bounds the 15x15 grid.
      Data: warm-white entry cells (#FFFDF6) with thin gray cell lines and near-black (#111110) blocking cells in a 180-degree symmetric pattern; bold gray clue numbers 1-67 in the top-left corners of word-start cells. The center cell (row 8, col 8) is boxed in by black cells on all four sides.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink #F0EFE8, clearly readable; light perimeter frame around the grid. No dark-on-dark text.
      Data: entry cells pure white, blocking cells the same #111110 as light, grid lines show as dark gaps between white cells. Clue numbers are light gray #B8B7B0 on the pure-white cells, about 2:1 contrast: present and decipherable, but faint.
      Legibility verdict: PASS with a deduction (clue numbers low-contrast in dark)
