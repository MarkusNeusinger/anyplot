review:
  strengths:
  - Clue numbers are computed from the grid (across/down start test), so every word
    start is numbered in reading order and no other cell is
  - 180-degree rotational symmetry is built into the data by mirroring each black
    cell, and the entry cells form one connected area
  - Cell fills follow the theme (white/near-black in light, light grey/black in dark)
    so black cells stay darker than entry cells in both renders
  - Heavier outer frame against thin inner cell lines gives the grid a clear edge
  weaknesses:
  - 'SC-02 (both): the clue numbers are drawn in brand green #009E73 while the Notes
    and C5 ask for a monochrome design optimised for printing → the numbers in the
    INK token. Likely cause: NUM_COLOR = "#009E73".'
  - 'DQ-02 (both): the black-cell pattern leaves 9 one-letter and 8 two-letter entries
    (e.g. the single cells between the blocks of row 8, and 38 Across with two letters)
    that a newspaper-style grid never has → a pattern whose every run is at least
    3 cells. Likely cause: the black_cells list.'
  - 'Suggestion: draw the cells with a single pcolormesh or PatchCollection instead
    of 225 individual Rectangle patches.'
