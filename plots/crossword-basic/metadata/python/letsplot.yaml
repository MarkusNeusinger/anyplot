review:
  strengths:
  - Clue numbers sit in the top-left corner of each starting cell via position_nudge
    with hjust=0/vjust=1, readable in both themes
  - Square grid fills the square canvas; one-panel gggrid paints the page color across
    the whole canvas in both themes
  - Single geom_tile with fill mapped through as_discrete + scale_fill_manual and
    scale_y_reverse for reading order
  - Numbering computed once per cell from the across/down word-start rules, rising
    in reading order
  - layer_tooltips() report cell type and Across/Down direction in the HTML output
  weaknesses:
  - 'SC-02 (both): the entry cell in row 8, column 8 (0-based (7, 7)) is walled in
    by black cells on all four sides, so the grid''s entry cells split into two parts
    (184 cells + 1 isolated cell) and break C4 → drop one of the four blocks around
    it, or make it black, keeping the 180-degree symmetry. Likely cause: black_positions
    contains (6, 7), (7, 6) and (7, 8), whose mirrors (8, 7) close the fourth side.'
  - 'Suggestion: slightly larger clue numbers would read better at full size while
    still leaving room for a letter.'
