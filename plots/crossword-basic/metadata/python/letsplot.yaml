review:
  strengths:
  - Black cell pattern has exact 180-degree rotational symmetry, generated by mirroring
    each listed position
  - Clue numbering computed from the grid, rising 1–69 in reading order on exactly
    the across/down word starts
  - coord_fixed(ratio=1) keeps cells square and theme_void drops axes the crossword
    does not need
  - Theme tokens thread through the title and page background in both renders
  - layer_tooltips() adds cell type and Across/Down direction to the HTML output —
    library-native interactivity
  weaknesses:
  - 'VQ-01 (dark): the right-column clue numbers 13, 38 and 62 run past the grid''s
    right edge, and their second digit, drawn in #1A1A17, vanishes on the #1A1A17
    page (dark on dark), so they read as "1", "3" and "6" → every number fully inside
    its white cell. Likely cause: geom_text x=c+0.05 with hjust=0 starts each label
    at the tile''s center (tiles are centered on c and span c±0.49), so a two-digit
    label in column 14 spills outside the grid.'
  - 'VQ-02, SC-02 (both): the clue numbers start at the middle of their cells, not
    the top-left corner, and every two-digit number (14, 17, 24, 30 … 67) runs across
    the vertical grid line into the next cell, breaking C2 → the label''s left edge
    about 0.05 cell from the cell''s left edge (shift about −0.5 cell). Likely cause:
    the label x is c + 0.05 instead of c − 0.45.'
  - 'VQ-05 (both): the right-column numbers overflow the grid frame, and a grey border
    drawn around the plot background boxes the whole chart → numbers inside the grid
    and no frame around the canvas. Likely cause: the label offset above, and element_rect(fill=PAGE_BG)
    without color=PAGE_BG (or element_blank border) for plot_background.'
  - 'VQ-07 (both): a strip about 32 px wide on the left and right edge of the canvas
    is transparent instead of the page color #FAF8F1 / #1A1A17 → page color across
    the full canvas. Likely cause: plot_background does not reach the canvas edge
    under coord_fixed with ggsize(600, 600); set the page color on the whole figure
    (e.g. theme(plot_background=element_rect(fill=PAGE_BG, color=PAGE_BG)) plus a
    matching expand so the panel fills the width).'
  - 'CQ-04 (code): the starts_across / starts_down tests are written out twice, in
    the numbering loop and again in the tooltip loop → compute them once and store
    the direction with the number. Likely cause: the second loop over numbers.items()
    recomputes lines 59–60.'
  - 'Suggestion: a thinner outer border or slightly lighter interior grid lines would
    give the grid a printed-newspaper finish.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page, with transparent strips about 32 px wide at the left and right canvas edges and a grey frame around the plot background.
      Chrome: bold title "crossword-basic · python · letsplot · anyplot.ai" in dark ink, centred, about 70 % of the width; no axes (theme_void).
      Data: 15x15 grid of white entry cells and solid black blocking cells with black grid lines; bold clue numbers 1–69 in #1A1A17. The numbers start at the centre of each cell rather than the top-left corner, two-digit numbers cross the vertical grid line into the next cell, and 13, 38 and 62 in the last column spill past the grid's right edge onto the page.
      Legibility verdict: PASS (all text readable, but the number placement is off).

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page, same transparent edge strips and grey frame.
      Chrome: title in light ink #F0EFE8, clearly readable.
      Data: identical monochrome grid (white entry cells, black blocks) — data colours unchanged from light. Clue numbers stay #1A1A17 and read well on the white cells, but the second digit of 13, 38 and 62 spills onto the #1A1A17 page and disappears (dark on dark), so they read as 1, 3 and 6.
      Legibility verdict: FAIL — clue numbers 13, 38, 62 partly invisible.
