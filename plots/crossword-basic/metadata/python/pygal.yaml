review:
  strengths:
  - 'Theme-stable puzzle paper: entry cells stay light (#FFFDF6) and blocking cells
    stay solid black in both renders (#0B0B09 on the dark page), so the grid reads
    as a printed crossword in light and dark'
  - 'Correct 15x15 data: 33 blocking cells with exact 180-degree rotational symmetry
    (checked programmatically), one connected entry area, and 67 clue numbers computed
    from across/down word starts in reading order'
  - Square 140 px cells filling a 2100x2100 plot area with equal 150 px margins, uniform
    grid lines and clue numbers inset in the top-left corner with room for a letter
  - Uses pygal's Style, render pipeline and SVG node API (self.svg.node) to draw a
    chart type pygal has no built-in for, producing both the PNG via cairosvg and
    pygal's SVG/HTML output
  weaknesses:
  - 'CQ-01 (code): lines 105-148 define a CrosswordGrid subclass of pygal''s Graph
    with five overridden methods (_compute, _compute_x_labels, _compute_y_labels,
    _draw, _plot) to draw the cells → the Imports → Data → Plot → Save flow without
    a class definition. Likely cause: pygal has no cell-grid chart type, so the cells
    are drawn by overriding Graph._plot.'
  - 'Suggestion: the gap between the title and the grid (about 140 px) is larger than
    the side margins; a slightly smaller top margin would tie the title to the puzzle.'
  image_description: |-
