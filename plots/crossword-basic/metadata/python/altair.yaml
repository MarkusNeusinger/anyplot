review:
  strengths:
  - 'Dark-theme cell tokens keep a printed-puzzle look: paper-gray entry cells, charcoal
    blocks and dark number ink stay legible instead of a naive inversion'
  - 'Idiomatic Altair layering: mark_rect cells plus mark_text numbers on shared ordinal
    encodings, with scale=None passing cell colors straight through'
  - Clue numbering is computed from the grid (across/down word starts), so numbers
    rise in reading order and appear only where words start
  - Exact 2400x2400 square canvas via pad-only post-processing, grid centred with
    even margins
  weaknesses:
  - 'Suggestion: a slightly heavier outer border than the inner grid lines would frame
    the puzzle like a printed newspaper grid.'
