  strengths:
  - Clue numbers are drawn in a fixed dark ink (#1A1A17) because the cells are white
    in both themes, so every number reads clearly in the light and the dark render
  - Clue numbering is computed from the grid (across/down word starts), giving 78
    numbers in strict reading order and only in word-start cells
  - Black-cell pattern is mirrored programmatically, so the 180-degree rotational
    symmetry holds by construction and the 184 entry cells form one connected area
  - Square cells pinned with Plotly's scaleanchor/scaleratio on a 2400x2400 canvas,
    with a heavier outer frame over 1.5 px internal grid lines
  - 'Theme chrome (title, frame and grid lines from INK/INK_SOFT) adapts correctly
    to #FAF8F1 and #1A1A17'
  weaknesses:
  - 'SC-01 (both): word-start cells are filled pure #FFFFFF while plain entry cells
    are #FAFAFA, a faint tint that highlights the numbered cells, which the basic
    variant excludes (C5: no tinted or highlighted cells) → one white fill for every
    entry cell. Likely cause: the CELL_NUMBERED / CELL_ENTRY branch in the cell loop.'
  - 'VQ-05 (both): an empty band of about 190 px (of 2400) sits between the one-line
    title and the top of the grid, so the grid sits low with uneven top and bottom
    space → top margin about 50–60 px (−30 to −40 px), per the plotly rule that t
    is only as tall as the title needs. Likely cause: margin t=90.'
  - 'CQ-04 (code): the CELL_ENTRY comment calls #FAFAFA a ''slightly warm off-white'',
    but #FAFAFA is a neutral grey-white → correct the comment, or remove it with the
    second entry fill. Likely cause: the comment on the CELL_ENTRY line.'
  - 'Suggestion: the grid has two-letter entries (37 across and its mirror); newspaper
    grids usually keep every entry at three letters or more.'
