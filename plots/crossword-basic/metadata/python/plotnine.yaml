review:
  strengths:
  - 'Idiomatic plotnine composition: geom_tile with a dict-valued scale_fill_manual
    and a geom_text layer with inherit_aes=False, ha/va corner justification and coord_fixed(ratio=1)
    for square cells'
  - Numbering computed from the grid itself (across/down word starts in reading order)
    and the black pattern generated by mirroring, so symmetry and numbers stay correct
    by construction
  - Theme-adaptive chrome while the monochrome cells stay identical across themes;
    grid fills the panel with expand=(0, 0)
  weaknesses:
  - 'SC-02 (both): the top-right 3x4 block of entry cells (rows 1–3, columns 12–15)
    is sealed off by the black column 11 and the black bar in row 4, and its 180-degree
    mirror at the bottom left likewise, so the entry cells form three separate areas
    instead of one connected area (C4) → one connected area (open at least one wall
    cell, e.g. drop (2, 10) or (3, 11) from black_positions; the mirror follows).
    Likely cause: black_positions entries (0, 10), (1, 10), (2, 10) together with
    (3, 11)–(3, 14).'
  - 'CQ-04 (code): the subtitle string hard-codes ''79 numbered positions'' instead
    of deriving the count from numbers_df, so it goes stale whenever the grid changes
    → compute it (f"... {len(numbers_df)} numbered positions"). Likely cause: the
    literal subtitle in labs().'
  - 'Suggestion: the grid''s 2-letter entries are unusual for newspaper grids; a pattern
    with only 3+ letter words would feel more authentic.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page, correct light surface; square canvas.
      Chrome: title 'crossword-basic · python · plotnine · anyplot.ai' in regular-weight dark text (~65 % width) at the top; no subtitle, axes, ticks or legend. All readable.
      Data: 15x15 grid nearly filling the canvas width: pure white entry cells and solid near-black blocking cells separated by uniform dark-gray grid lines; clue numbers 1–79 in dark gray in the top-left corner of each word-start cell, rising in reading order. Pattern is 180-degree symmetric; the top-right and bottom-left 3x4 corner blocks are sealed off by black cells.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
