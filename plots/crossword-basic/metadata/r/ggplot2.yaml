review:
  strengths:
  - 'Square cells guaranteed by coord_fixed(ratio = 1) on geom_tile, with uniform
    #333333 grid lines'
  - Black cell pattern has exact 180-degree rotational symmetry
  - Clue numbers computed from the grid and rising in reading order 1-53, top-left
    with room for a letter
  - Monochrome cells identical in both themes while chrome flips via INK/INK_SOFT
    tokens
  weaknesses:
  - 'SC-02 (both): the entry cells at row 7 col 4 and row 7 col 10 are enclosed by
    black cells on all four sides, so the entry area splits into three parts (137
    + 1 + 1 cells), missing the spec''s one-connected-area property (C4) → open each
    pocket into the grid (for example make row 7 col 3 and its mirror row 7 col 11
    entry cells), keeping 180-degree symmetry. Likely cause: the row 7 pattern in
    grid_data.'
  - 'DQ-03 (both): the subtitle reads ''53 entries'', but the grid has 60 entries
    (29 across + 31 down); 53 is the count of numbered cells → state 60 entries, or
    compute the count from the across/down flags (delta +7). Likely cause: subtitle
    text set to the clue_n count.'
  - 'Suggestion: a slightly heavier outer frame than the 0.3 mm inner lines, matched
    in both themes, would read more like a printed puzzle.'
  image_description: |-
