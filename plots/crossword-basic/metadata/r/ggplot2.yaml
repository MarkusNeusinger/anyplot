      Data: 13x13 grid of pure white entry cells and solid black blocking cells separated by #333333 lines; clue numbers 1-53 in small black text in the top-left of word-start cells, in reading order. Black pattern is 180-degree symmetric. Two single white cells in row 7 (cols 4 and 10) are fully enclosed by black cells.
