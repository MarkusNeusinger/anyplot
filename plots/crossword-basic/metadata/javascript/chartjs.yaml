review:
  strengths:
  - 'Correct 180-degree rotational symmetry: black cells are built from a primary
    half-list plus an automatically-derived mirror partner, matching real newspaper-crossword
    conventions.'
  - Standard clue-numbering algorithm (across/down start detection with run-length
    checks) matches how real crosswords number cells.
  - Custom Chart.js plugin (afterLayout + afterDatasetsDraw) forces a true square
    chart area and re-runs scale.configure() so cell fills, grid lines, and numbers
    all share one synced pixel mapping.
  - Deliberate, well-commented design choice to keep the puzzle board monochrome/paper-like
    across both themes (matching the spec's 'optimized for printing' note) while still
    correctly theming the title and outer canvas background.
  - Clean, deterministic, in-memory data generation; correct mount-node contract;
    animation disabled; no stray imports or fake interactivity.
  - Invisible hit-target scatter points give the HTML detail view working tooltips
    (row/col + clue number) without affecting the static PNG.
  weaknesses:
  - Clue numbers are sized at cellSize*0.24 (~35px on the 2400px canvas) — legible
    at full resolution, but on this fine 15x15 grid they become very small once scaled
    to a ~400px mobile thumbnail. Consider bumping to ~0.30 of cell size or a heavier
    font weight for small-scale legibility.
  - The outer board frame stroke reuses PAPER_BLOCK (#1A1A17), which is nearly the
    same hex as the dark-theme canvas background — harmless visually since the cream/black
    cell contrast already defines the edge, but the explicit outer stroke is functionally
    redundant in dark mode.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills the canvas outside the puzzle board, matching the required light-theme page surface.
      Chrome: Title "crossword-basic · javascript · chartjs · anyplot.ai" is centered at the top in dark ink, clearly readable against the cream background. No axis labels, ticks, or legend are shown — correctly omitted, since this is a grid, not a cartesian chart.
      Data: A 15x15 crossword grid fills most of the canvas — cream entry cells, solid near-black blocking cells, a crisp black outer frame, and subtle pale-gray grid lines separating every cell. Bold clue numbers sit in the top-left corner of each cell that starts an across or down entry (verified via a zoomed crop — numbers are crisp and unambiguous at full resolution). The black-cell pattern shows clear 180-degree rotational symmetry (e.g. the block at row 0/col 3 is mirrored at row 14/col 11). No clipping, overlap, or overflow at the canvas edges (verified via zoomed crops of the top-left and bottom-right corners and the title band).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the canvas outside the puzzle board, matching the required dark-theme page surface.
      Chrome: Title is rendered in light ink, clearly readable against the near-black background — no dark-on-dark issue.
      Data: The puzzle board itself is intentionally rendered identically to the light render (same cream/black cells, same grid lines and numbers, pixel-identical via zoomed-crop comparison) — a deliberate design choice explained in code comments, since the spec calls for a "monochrome design optimized for printing" (a physical newspaper crossword page doesn't invert for dark mode). Only the chrome (title, surrounding canvas background) adapts to theme; the puzzle grid itself is treated as the "data" layer and stays fixed, analogous to how Imprint palette data colors don't flip with theme.
      Legibility verdict: PASS
