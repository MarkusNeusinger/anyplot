      Data: A 13x13 crossword grid with symmetric black blocking cells (fixed near-black fill) and white entry cells (fixed off-white fill), verified programmatically to have exact 180-degree rotational symmetry and no isolated/unchecked single-letter cells.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title renders in light text, clearly readable against the dark background. Outer frame is a light stroke, visible against the dark page.
      Data: Blocked cells and entry cells now use the SAME fixed hex fills as the light render (#1A1A17 blocked / #FAF8F1 entry) — the puzzle's black/white identity no longer inverts between themes, resolving the attempt-1 defect. Clue numbers remain dark-gray on the fixed off-white entry-cell fill (not theme-flipped), so they stay legible on both surfaces. Verified at the 400px mobile thumbnail size — the grid, blocks, and numbers all remain crisp and distinguishable against the dark page background.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures; cell-fill identity now matches the light render as required).
