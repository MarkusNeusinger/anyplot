review:
  strengths:
  - Exact 180-degree rotational symmetry achieved via point-reflection construction
    (bottom half derived from the top half) rather than manually mirrored coordinates
    — symmetry is correct by construction.
  - 'Correct standard newspaper-crossword numbering algorithm: checks both across-start
    and down-start conditions and increments in reading order.'
  - Idiomatic D3 data-join pattern (selectAll().data().join()) used for both the grid
    cells and the clue numbers.
  - Explicit font sizing (26px title, 15px clue numbers) and exactly correct mandated
    title text.
  - Deterministic, hand-authored data with no randomness — fully reproducible.
  - Square 2400x2400 canvas format is the right choice for a symmetric grid plot.
  weaknesses:
  - 'Blocked cells fill with t.ink and entry cells fill with t.elevatedBg -- both
    theme-adaptive chrome tokens -- so the crossword''s black/white cell identity
    inverts between themes: in the dark render, ''blocking'' cells render as light/bright
    squares and ''entry'' cells become dark, blending into the page background. This
    breaks the spec''s fixed ''white cells for entry, black cells for blocking'' rule
    in the dark render and treats the puzzle pattern (which is data, like the Imprint
    palette data colors) as if it were theme chrome. Fix: give blocked and entry cells
    fixed, theme-independent fills (a constant near-black and a constant off-white/cream)
    so the pattern reads identically in both themes, and let only the stroke/frame
    color follow the theme token.'
  - In the dark render, entry cells (fill = elevatedBg, close in luminance to the
    page background) have low value-contrast against the page -- cell boundaries are
    legible mainly via the thin stroke lines, which could look washed out at mobile/thumbnail
    scale.
  - 'LM-02: no D3-distinctive feature is used beyond the basic data-join grid build
    (no d3-scale, d3-hierarchy, etc.) -- mastery beyond basic API usage is limited.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Bold dark title "crossword-basic · javascript · d3 · anyplot.ai" centered at top, clearly readable. Grid clue numbers (small dark-gray digits) sit in the top-left corner of word-start cells, clearly readable. Outer frame is a solid dark stroke.
      Data: A 13x13 crossword grid with symmetric black blocking cells (dark/near-black fill) and white entry cells (off-white fill), separated by thin gray grid lines. The block pattern shows clean 180-degree rotational symmetry as specified.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title renders in light text, clearly readable against the dark background. Clue numbers render as light-gray digits inside entry cells, readable. Outer frame is a light stroke, visible.
      Data: The block/entry cell identity INVERTS relative to the light render -- cells that were black (blocked) in the light render now render as light/bright squares, and cells that were white (entry) in the light render now render as dark cells that blend closely with the page background (distinguishable mainly via the thin stroke lines and the light-colored numbers they contain). The grid shape and symmetry are still visible and each render is internally consistent/readable, but the black-cells-for-blocking / white-cells-for-entry semantics from the spec are not preserved across themes -- this is a real defect, not just a stylistic difference. No text is dark-on-dark or light-on-light; every glyph is legible.
      Legibility verdict: PASS (text legible), but the cell-fill inversion is a spec-compliance defect flagged in weaknesses.
