review:
  strengths:
  - Correct 180-degree rotational symmetry in the blocked-cell pattern, matching real
    newspaper crossword construction conventions
  - Faithful numbering algorithm — numbers every cell that starts an across or down
    entry, in reading order, exactly as constructors do
  - Creative, technically sound repurposing of MUI X's ScatterChart (band-scale axes
    + a custom `slots.scatter` renderer) to build a grid chart type MUI X doesn't
    natively offer
  - Theme-adaptive chrome (title, page background) correctly follows ANYPLOT_THEME
    while intentionally keeping the puzzle grid monochrome per the spec's 'optimized
    for printing' requirement — the tradeoff is documented in code comments
  - Perfectly square canvas with a centered board and even margins on both axes; canvas
    dimension gate passed
  - Clean grid lines, no overlapping elements, and the mandated title format used
    exactly
  weaknesses:
  - Clue numbers (fontSize = cellW*0.26 inside a 15x15 grid) are quite small relative
    to the full canvas and risk becoming illegible when the image is scaled down to
    smaller thumbnail sizes (e.g. ~400px wide) — consider a slightly larger minimum
    number size or bolder weight for small-scale legibility.
  - Title occupies only ~45% of the plot width, on the low end of the expected 50-70%
    range — a modest fontsize increase would give it more visual presence without
    risking overflow.
  - The chart never touches the Imprint accent color (fully monochrome by design,
    which is spec-justified) — an optional subtle brand-green touch (e.g. the outer
    board border) could tie it closer to the site's visual system without breaking
    the 'print-ready monochrome' intent.
  - Repurposing ScatterChart via band scales + a custom slot renderer is a creative
    solution to MUI X's lack of a native grid/heatmap component, but it is a step
    removed from ScatterChart's idiomatic point-marker usage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white page (#FAF8F1-consistent), with the title centered at the top in dark ink text.
      Chrome: Title "crossword-basic · javascript · muix · anyplot.ai" is fully legible in dark gray/black text against the light page. No axis ticks/labels are shown (intentionally hidden — appropriate for a crossword grid, which has no numeric axes).
      Data: A 15x15 crossword grid centered in a square canvas. Paper-white (open) cells and solid black (blocked) cells form a symmetric pattern; thin dark gridlines (1.5px) separate every cell and a thicker dark border (3px) frames the whole board. Small black clue numbers sit in the top-left corner of cells that start an across or down entry, in correct reading-order sequence (1, 2, 3, 4, 5, ... 66). The black/blocked cells show clear 180-degree rotational symmetry (e.g. blocks at row 1 columns 5 and 11 mirror blocks at row 15 columns 11 and 5).
      Legibility verdict: PASS — title and numbers are all readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black page, with the title centered at the top in light/white text.
      Chrome: Title is fully legible in light text against the dark page — no dark-on-dark issue on the chrome.
      Data: The crossword grid itself (paper-white open cells, solid black blocked cells, dark gridlines, clue numbers) is rendered IDENTICALLY to the light render — same colors, same symmetric block pattern, same numbering. This is intentional per the implementation's code comment: the puzzle pattern is treated as fixed "data" (like a categorical data color), matching the spec's explicit "monochrome design optimized for printing" requirement, so only the surrounding page and title chrome flip with the theme.
      Legibility verdict: PASS — title readable on dark background; the grid's own black cells remain black-on-white-cell (not dark-on-dark) since the puzzle grid keeps its own paper-white cell backgrounds regardless of page theme, so clue numbers stay dark-on-white and fully legible.
