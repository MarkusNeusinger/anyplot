review:
  strengths:
  - Clue numbers are computed from the grid in one reading-order pass (open cell,
    closed or edge before, open after), so numbers appear exactly on word starts and
    rise 1–67
  - The board is a series-less ChartsContainer with zero-gap band axes; a custom SVG
    layer reads cell geometry from the useXScale/useYScale hooks, so cells stay square
    and aligned
  - Monochrome print board keeps paper and ink identical in both themes, with an inkSoft
    frame that separates edge blocks from the dark page
  - 'Grid is valid newspaper style: 180-degree symmetric, one connected entry area,
    no words shorter than 3 letters'
  weaknesses:
  - 'Suggestion: the inner rule colour #4A4A44 at 1.5 px reads slightly heavy next
    to the bold numbers; a lighter grey rule would give the numbers and future letters
    more contrast against the grid.'
  - 'Suggestion: the header comment still names muix 7.29.1 while the harness pins
    @mui/x-charts 9.16; the review rewrite replaces it, but the generator could emit
    the pinned version.'
