review:
  strengths:
  - Builds the entire crossword grid from a single scatter series with square markers
    plus dataLabels — a clever, spec-compliant workaround for the fact that no heatmap/tilemap
    add-on module is loaded in the core Highcharts bundle.
  - Correct 180-degree rotational symmetry, generated programmatically by mirroring
    a half-list of blocked cells to (N-1-row, N-1-col) — matches the traditional newspaper
    crossword convention the spec requires.
  - 'Smart theme-adaptive handling: both the blocked-cell fill and the clue-number
    color derive from t.ink, so the blocked/entry contrast stays legible in both light
    and dark renders instead of collapsing to near-invisible black-on-near-black in
    dark mode.'
  - Correct standard crossword numbering algorithm (numbers a cell when it starts
    an across and/or down entry), and precise 1:1 cell aspect ratio achieved via fixed
    pixel margins independent of Highcharts' auto-layout.
  weaknesses:
  - Clue numbers are quite small (11px CSS / ~22px native) relative to the dense 15x15
    grid; scaled down to a ~400px mobile width they risk becoming hard to read — consider
    bumping to ~13-14px CSS if it still fits without overlapping adjacent cells.
  - The design is necessarily plain/monochrome per spec, leaving little room for extra
    design flourish beyond the uniform grid lines — acceptable given the spec's explicit
    'monochrome design optimized for printing' requirement, not a defect to fix.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "crossword-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable, comfortably sized above the grid. No axis labels/ticks (correctly omitted — not applicable to a puzzle grid). Thin, subtle light-gray grid lines separate every cell uniformly.
      Data: A 15x15 crossword grid with black-filled square cells for blocked positions and cream/background cells for letter-entry positions. Small dark clue numbers appear in the top-left corner of cells that start an across or down word. The blocked-cell pattern is visibly 180-degree rotationally symmetric.
      Legibility verdict: PASS — title and clue numbers are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title text now in light/off-white ink, clearly readable against the dark background. Grid lines remain thin and subtle. No axis labels/ticks, consistent with the light render.
      Data: The same 15x15 grid structure. Blocked cells now render as light/off-white squares (ink color flipped for theme contrast) while entry cells show the dark page background — an intentional inversion that preserves strong blocked/entry contrast rather than a literal black-cells-stay-black approach (which would have made blocked cells nearly invisible against the near-black page background). Clue numbers render in light ink, clearly visible on the dark entry cells.
      Legibility verdict: PASS — no dark-on-dark failures; all text and the blocked/entry distinction remain clearly legible.
