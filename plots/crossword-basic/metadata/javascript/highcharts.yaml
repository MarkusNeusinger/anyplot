review:
  strengths:
  - Builds the entire crossword grid from a single scatter series with square markers
    plus dataLabels — a clever, spec-compliant workaround for the fact that no heatmap/tilemap
    add-on module is loaded in the core Highcharts bundle.
  - Correct 180-degree rotational symmetry, generated programmatically by mirroring
    a half-list of blocked cells to (N-1-row, N-1-col) — matches the traditional newspaper
    crossword convention the spec requires.
  - Correct standard crossword numbering algorithm (numbers a cell when it starts
    an across and/or down entry), and precise 1:1 cell aspect ratio achieved via fixed
    pixel margins independent of Highcharts' auto-layout.
  - Clue-number font size was bumped from 11px to 13px since the previous attempt,
    improving legibility in the dense 15x15 grid.
  weaknesses:
  - 'Blocked-cell fill color is derived from the theme-dependent t.ink token, so the
    black/white crossword semantic inverts between renders: in plot-light.png blocked
    cells are near-black (correct), but in plot-dark.png blocked cells become near-white/cream
    while entry cells go dark — a photonegative of the puzzle rather than a chrome
    flip. This violates the style-guide rule that data encoding must stay identical
    between themes (only chrome flips) and diverges from every other implementation
    of this exact spec (e.g. plots/crossword-basic/implementations/python/plotly.py
    hardcodes CELL_BLOCK = ''#1A1A17'' with the comment ''Crossword cell colors —
    fixed regardless of theme (contrast IS the data)''; matplotlib.py keeps CELL_BLACK
    dark and CELL_WHITE light in both themes too). Fix: give the ''Blocked cells''
    series a fixed dark fillColor (e.g. a constant near-#1A1A17, not t.ink) so blocked
    squares stay black in both light and dark renders; if entry-cell contrast against
    a dark page background is a concern, add an explicit light fill to the entry cells
    (a third scatter series or a plotBands/annotation layer) rather than letting the
    block color flip.'
  - Clue numbers at 13px CSS are still quite small relative to the dense 15x15 grid
    — legible at full resolution but hard to read once scaled down to the ~400px responsive
    thumbnail; consider bumping slightly further (14-15px) if it still fits without
    overlapping adjacent cells.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "crossword-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly readable, comfortably sized above the grid. No axis labels/ticks (correctly omitted — not applicable to a puzzle grid). Thin, subtle light-gray grid lines separate every cell uniformly.
      Data: A 15x15 crossword grid with black-filled square cells for blocked positions and off-white/background cells for letter-entry positions — matches the traditional black-blocks/white-entries crossword convention. Small dark clue numbers (13px) appear in the top-left corner of cells that start an across or down word. The blocked-cell pattern is visibly 180-degree rotationally symmetric.
      Legibility verdict: PASS — title and clue numbers are clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title text now in light/off-white ink, clearly readable against the dark background. Grid lines remain thin and subtle. No axis labels/ticks, consistent with the light render.
      Data: Same 15x15 grid structure and symmetric pattern, BUT the blocked/entry cell colors are inverted relative to the light render: blocked cells now render as light/cream squares and entry cells render as near-black (matching the dark page background). This is not a valid "chrome flip" — the actual data (which cells are blocked vs. entry) reads as its own photonegative on this render, contradicting the spec's fixed "black cells for blocking, white cells for entry" convention and diverging from every other library's implementation of this same spec. Clue numbers render in light ink and are readable against the (now dark) entry cells.
      Legibility verdict: PASS for text readability (no dark-on-dark text failures), but FAIL for data-color consistency — the blocked/entry encoding is not identical between the two renders.
