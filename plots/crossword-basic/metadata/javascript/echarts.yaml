review:
  strengths:
  - Correct 180-degree rotational symmetry built programmatically from a mirrored
    top-half, guaranteeing the traditional newspaper-style black-cell pattern by construction
    rather than by hand-tuning.
  - The word-numbering algorithm correctly implements the standard across/down word-start
    scan (blocked-neighbor + open-neighbor checks).
  - Thoughtful, explicitly documented design decision to keep the puzzle card's paper/ink
    tones fixed across themes (it's plot content, not chrome) instead of naively flipping
    black↔white with ANYPLOT_THEME, which would invert and break the crossword metaphor.
  - Clean, idiomatic use of ECharts' 'custom' series with renderItem + api.coord/api.size
    for per-cell rect+text composition — the correct advanced pattern for this kind
    of grid rendering.
  - Fully deterministic, no external dependencies, no fake interactivity, correct
    mount-node contract (no explicit size/devicePixelRatio passed to echarts.init).
  weaknesses:
  - Cell numbers are fontSize 12 on a 2400px canvas; scaled to the ~400px mobile width
    these shrink to ~2px and become illegible — since word-start numbers are a core
    spec-required feature, increase to ~14-16px (cell size ~147px comfortably fits
    it).
  - 'Design Excellence is at the ''well-configured default'' level: a plain uniform-weight
    grid with no typographic hierarchy between the outer frame and inner cell dividers.
    A slightly bolder outer border than inner lines (a common convention in professional
    printed crosswords) would add polish without adding chartjunk.'
  - No visual emphasis beyond the baseline puzzle structure (DE-03 default) — consider
    a subtle framing treatment or slightly stronger contrast on the numbered cells
    to strengthen hierarchy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "crossword-basic · javascript · echarts · anyplot.ai" in dark ink, centered, clearly legible. No axes, legend, or tick labels present (none needed for a grid puzzle).
      Data: A 15x15 crossword grid rendered as a monochrome print card — white/cream entry cells with dark grid dividers, solid near-black blocking cells, and small dark clue numbers in the top-left corner of word-start cells. Symmetric black-cell pattern visible (180-degree rotational symmetry).
      Legibility verdict: PASS — title and grid content are all clearly readable against the light page background. Cell numbers are small (12px) but legible at full resolution; likely too small once scaled to mobile width (~400px) — flagged as a weakness, not a legibility failure at native size.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title in light ink, clearly legible against the dark page background — correctly theme-adaptive.
      Data: The crossword card itself is rendered identically to the light version — same cream entry cells, same near-black blocking cells, same dark clue numbers on white cells. This is intentional (documented in code): the puzzle grid is treated as fixed print content rather than theme-adaptive chrome, so it does not invert with the page theme.
      Legibility verdict: PASS — no dark-on-dark issue: numbers sit on white entry cells (dark text on white, unaffected by page theme), and the title correctly follows the theme. No text is unreadable in this render.
