review:
  strengths:
  - Cell numbers were increased from 12px to 15px per the previous review's feedback,
    landing squarely in the recommended 14-16px range and reading clearly at native
    resolution in both themes.
  - Correct 180-degree rotational symmetry, built programmatically by mirroring the
    authored top half rather than hand-tuning, guaranteeing the traditional newspaper-style
    black-cell pattern by construction.
  - The word-numbering algorithm correctly implements the standard across/down word-start
    scan (blocked-neighbor + open-neighbor checks).
  - Thoughtful, explicitly documented decision to keep the puzzle card's entry/blocked
    cell fills fixed across themes as print content rather than chrome, correctly
    preserving the black/white crossword metaphor instead of naively inverting it
    with ANYPLOT_THEME.
  - Idiomatic, clean use of ECharts' 'custom' series with renderItem + api.coord/api.size
    for per-cell rect+text composition -- the correct advanced pattern for this kind
    of grid rendering.
  - Fully deterministic, no external dependencies, no fake interactivity, correct
    mount-node contract (no explicit size/devicePixelRatio passed to echarts.init).
  weaknesses:
  - 'REGRESSION: the new outer-frame graphic added to give the grid a bolder border
    (echarts.js, `outerFrameStroke = "#1A1A17"`, drawn via the `graphic` rect around
    line 155-160) is hardcoded and not theme-adaptive. In the dark render this hex
    is IDENTICAL to the dark page background (`#1A1A17`), so the entire outer border
    vanishes on all four edges. Confirmed by pixel sampling: in plot-light.png, column
    x=250 shows a solid near-black band from y=255 to y=265 (the 5px frame) sitting
    on the `#FAF8F1`-derived cell background; in plot-dark.png the same y-range has
    zero color transition -- the frame pixels are pixel-identical to the surrounding
    page background. This is a dark-on-dark chrome failure (the frame is structural
    chrome providing the card''s typographic hierarchy, not the print-content cell
    fills, so it must flip with theme). Fix: derive outerFrameStroke from the theme
    token, e.g. `const outerFrameStroke = t.ink;` (which is `#1A1A17` in light and
    `#F0EFE8` in dark) so the border always contrasts against the page background
    in both themes, while keeping entryFill/blockedFill/cellStroke fixed as intentional
    print content.'
  - DE-03 (Data Storytelling) still shows no visual emphasis beyond the base grid
    -- unchanged from the previous review. Acceptable as a default for this plot type,
    but a subtle treatment on the numbered starter cells could add polish if pursued
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "crossword-basic · javascript · echarts · anyplot.ai" in dark ink, centered, clearly legible. No axes, legend, or tick labels present (correctly omitted for a grid puzzle). A bold 5px near-black outer frame clearly bounds the 15x15 grid on all four sides, visually distinct from the thinner (1.5px) inner cell-divider lines -- confirmed by pixel sampling (solid near-black band from y=255-265 at the top edge, versus the #FAF8F1-derived surrounding page).
      Data: A 15x15 crossword grid rendered as a monochrome print card -- off-white entry cells with dark grid dividers, solid near-black blocking cells, and dark clue numbers (15px, up from a previously-flagged 12px) in the top-left corner of word-start cells. Symmetric black-cell pattern visible (180-degree rotational symmetry).
      Legibility verdict: PASS -- title, grid content, and the outer frame are all clearly readable against the light page background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title in light ink, clearly legible against the dark page background -- correctly theme-adaptive. HOWEVER, the outer frame border is NOT visible: it is hardcoded to #1A1A17, which is pixel-identical to the dark page background. Sampling the same column/row range that shows a clear frame band in the light render (y=255-265) shows zero color transition in the dark render -- the frame simply is not there. The puzzle card has no defined boundary on any edge in this theme.
      Data: The crossword card content itself renders identically to the light version -- same off-white entry cells, same near-black blocking cells, same dark clue numbers on white cells. This is intentional and documented in the code (the puzzle grid is treated as fixed print content, not theme-adaptive chrome), and it works correctly for the cell fills. Interior cell-divider lines (#4A4A44) remain visible against the dark background since that gray has enough contrast against #1A1A17.
      Legibility verdict: FAIL (frame only, not text) -- no dark-on-dark issue for any text (numbers sit on white entry cells, title follows the theme correctly), but the outer frame is a dark-on-dark chrome failure: its hardcoded stroke color exactly matches the page background, so the intended bold-border typographic hierarchy from the previous review's feedback is completely absent in this theme.
