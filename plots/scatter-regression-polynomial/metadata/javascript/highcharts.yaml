review:
  strengths:
  - Polynomial fit computed correctly via normal equations + Gaussian elimination
    (deterministic LCG seed, no external stats library needed) and R²/equation displayed
    prominently in the subtitle directly under the title
  - 'First series correctly uses Imprint brand green #009E73 with alpha-blending (0.65)
    matching the spec''s recommended 0.6-0.7 range; fit curve uses palette position
    2 (#C475FD/lavender), clearly distinct in both hue and line weight (width 3, no
    markers)'
  - 'Theme chrome fully threaded through tokens (t.ink, t.inkSoft, t.grid) — both
    renders are legible, backgrounds match #FAF8F1/#1A1A17, and data colors are identical
    across themes'
  - Realistic, neutral agronomic scenario (fertilizer dose vs. crop yield) with a
    genuine diminishing-returns quadratic pattern plus Gaussian noise — not an abstract
    or synthetic-looking dataset
  - Title format exactly matches the mandated `{spec-id} · {language} · {library}
    · anyplot.ai` pattern; legend labels ("Field Trials", "Quadratic Fit") are descriptive
    and match the data
  weaknesses:
  - 'Design Excellence is at the ''well-configured default'' level rather than publication-ready:
    no visual technique elevates the curve-fit story beyond a line drawn over points
    — consider a subtle semi-transparent confidence band around the fit (spec explicitly
    lists this as an optional enhancement) using the `muted` semantic anchor, which
    would raise both DE-01 and DE-03 by giving the chart a clearer focal point.'
  - 'Library Mastery is generic: the implementation could be replicated with near-identical
    visual output in any charting library (scatter + spline). Consider leveraging
    a Highcharts-distinctive touch — e.g. a custom `tooltip.pointFormatter` for the
    fit line, or `plotOptions.scatter.marker.states.hover` styling — to demonstrate
    library-specific capability (note: this only helps if it doesn''t rely on interactivity
    being visible in the static PNG).'
  - Data Storytelling is adequate but passive — the diminishing-returns plateau (fertilizer
    > ~150 kg/hectare) is the most interesting insight in the data but isn't visually
    emphasized (e.g. via a subtle shaded region or annotation marking the point of
    diminishing returns) beyond what the curve shape alone conveys.
