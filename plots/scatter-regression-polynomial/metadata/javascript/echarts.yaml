review:
  strengths:
  - 'Palette compliance fixed: curve and confidence band now use canonical Imprint
    position 2 (#C475FD lavender) instead of skipping to position 3, matching the
    brand-green (#009E73) first series.'
  - 'Added a markLine + markPoint at the fitted parabola''s vertex ("Optimum: 115
    kg/ha"), a distinctive ECharts-only feature that also sharpens the data story
    around the agronomic optimum.'
  - Tick marks removed (axisTick show:false) on both axes for a more refined, minimal
    look while keeping tick labels legible.
  - Confidence band (±1.5σ) implemented via ECharts' stacked-area idiom (hidden lower
    series + width series) — a correct, idiomatic ECharts trick.
  - R² and the fitted quadratic equation are displayed prominently in a well-styled
    graphic callout box, directly satisfying the spec's notes.
  - Quadratic least-squares regression computed from scratch via normal equations
    (no hard-coded coefficients), with a deterministic fixed-seed LCG for reproducibility.
  - Realistic, neutral agronomic scenario (nitrogen vs. crop yield) shows the full
    parabola — rise, peak, and fall — with n=90 plots.
  - 'Both renders are theme-correct: identical data colors, no dark-on-dark or light-on-light
    failures, and no clipped text at any canvas edge.'
  weaknesses:
  - 'CQ-01: from-scratch helper functions (nextRandom, gaussianNoise, fitDegree2,
    det3) still push past strict KISS structure, though they are largely necessary
    since there is no math/stats library available in the browser render harness.'
  - 'DE-02 nuance: the outer plot grid''s top and right split-lines coincide with
    the axis maxima, producing a faint box-like frame rather than a purely L-shaped
    spine — very subtle, not a real deduction on its own but worth a look if further
    polish is desired.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "scatter-regression-polynomial · javascript · echarts · anyplot.ai" is bold dark ink, centered at top, fully visible with no clipping. Legend ("Fertilizer trial plots" / "±1.5σ band" / "Quadratic fit (degree 2)") sits centered just below the title. Axis titles "Nitrogen Applied (kg/hectare)" and "Crop Yield (tons/hectare)" plus all tick labels render in dark ink and are clearly legible; grid lines are faint warm-gray and subtle. A callout box (elevated cream background, dark border) shows "Quadratic Regression", "R² = 0.749", the fitted equation "y = -0.00025x² + 0.058x + 5.93", and "n = 90 plots" — all crisp and readable. A dashed vertical reference line labeled "Optimum: 115 kg/ha" (rotated, soft-ink text) marks the parabola's vertex with no overlap against data or gridlines.
      Data: Brand-green (#009E73) scatter points at ~65% opacity with a subtle pageBg-colored edge, tracing a clear rise-peak-fall parabola across ~90 fertilizer trial plots. A solid lavender (#C475FD) quadratic fit curve runs through the point cloud with a small circular marker at the peak, and a light translucent lavender ±1.5σ band surrounds the curve.
      Legibility verdict: PASS — no light-on-light or illegible text anywhere; nothing clipped at canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, legend, axis titles, tick labels, callout box, and "Optimum" reference line now render in light/soft-white ink — fully legible against the dark surface, no dark-on-dark failures anywhere. The callout box uses the elevated dark surface (#242420-like) with a light border, keeping strong contrast against its text.
      Data: Colors are identical to the light render — same brand-green scatter (#009E73), same lavender curve/band (#C475FD) — confirming only chrome flipped, not data colors. The band's translucency renders as a deep plum tint against the black background, still clearly distinguishable from the curve and points.
      Legibility verdict: PASS — all text reads clearly against the dark background; no dark-on-dark or clipping issues observed.
