review:
  strengths:
  - Confidence band (±1.5σ) implemented via ECharts' stacked-area idiom (hidden lower
    series + width series) — a correct, idiomatic ECharts trick, not a hack.
  - R² and the polynomial equation are displayed prominently in a well-styled callout
    box built with the `graphic` API, directly satisfying the spec's 'display R² prominently'
    and 'annotate with the polynomial equation' notes.
  - Quadratic least-squares regression is computed from scratch via normal equations
    (no hard-coded coefficients) — a real fit, appropriate given there is no stats
    library available in the browser runtime.
  - Realistic, neutral agronomic scenario (crop yield vs. nitrogen fertilizer) shows
    the full parabola — rise, peak, and fall — giving genuine feature coverage for
    a degree-2 fit rather than a partial curve.
  - Theme-adaptive chrome (axis lines, ticks, callout box, tooltip) is threaded through
    correctly; both renders are legible with data colors identical between light and
    dark.
  - Scatter marker alpha (0.65) matches the spec's 'moderate transparency ~0.6-0.7'
    recommendation exactly, with a pageBg-colored border for definition in the denser
    mid-region overlaps.
  weaknesses:
  - 'VQ-07: the confidence band and fit curve use `t.palette[2]` (blue, canonical
    position 3) instead of `t.palette[1]` (lavender, position 2) — skips a canonical-order
    slot without a clear semantic justification (blue has no strong ''regression line''
    color association). Use palette[1] for the second visual element, or keep palette[2]
    only if a semantic reason is stated in a comment.'
  - 'DE-02/DE-03: refinement is solid but not exceptional — axis lines, tick marks,
    and grid are close to a well-configured default; consider removing tick marks
    (keep tick labels) or adding a subtle marker/markArea at the curve''s peak to
    sharpen the ''optimum nitrogen rate'' story.'
  - 'CQ-01: quite a few helper functions for a KISS-scored implementation (nextRandom,
    gaussianNoise, fitDegree2 with nested det3/withColumn, predict, eqSign) — largely
    necessary for from-scratch regression/RNG in the browser, but the 3x3 Cramer''s-rule
    solve could be simplified or the intent commented more tersely.'
  - 'LM-02: the stacked-band trick and `graphic` callout are good ECharts idioms but
    stop short of a signature ECharts feature — e.g. a `markLine`/`markArea` at the
    curve''s peak (optimum nitrogen rate) would be a very idiomatic, more distinctive
    touch.'
