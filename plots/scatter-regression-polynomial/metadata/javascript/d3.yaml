  strengths:
  - 'Full spec feature set: R² prominently displayed, polynomial equation annotated,
    95% confidence band, correct ~0.65 scatter alpha'
  - Title now fills ~72% of canvas width (42px, up from 26px) for strong visual hierarchy,
    resolving the prior attempt's weak-title finding
  - RNG helper inlined (randNormal removed) leaving only the three functions genuinely
