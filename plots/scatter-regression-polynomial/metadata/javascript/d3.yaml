    pattern for the HTML detail view, addressing the prior Library Mastery gap
  - 'Deterministic and reproducible: fixed-seed LCG + inlined Box-Muller noise + hand-rolled
    least-squares polyfit'
  - 'Correct Imprint palette (green #009E73 points, lavender #C475FD curve/band) and
    full theme-adaptive chrome across both renders'
  - No clipping or overlap in either render; axes start at 0 with nice() padding;
    canvas gate passes at exact 3200x1800
  weaknesses:
  - 'DE-03: the hover-guide interactivity and title-size fix add hierarchy, but the
    static render''s visual storytelling is still driven mainly by the annotation
    box rather than a stronger compositional focal point'
  - 'LM-02: the bisector-based hover guide is a solid, genuinely d3-specific touch
    but is a fairly standard tutorial pattern (d3 official ''nearest point on line
    hover'' example) rather than a truly novel showcase of the library'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: bold dark title "scatter-regression-polynomial · javascript · d3 · anyplot.ai" now at 42px, spanning ~72% of canvas width (measured 2300/3200 px) — a clear improvement over the prior attempt's ~44%; gray subtitle "Diminishing returns: crop yield vs. fertilizer application" below it; dark "Fertilizer Application (kg/hectare)" and "Crop Yield (tons/hectare)" axis labels with units; soft gray tick labels; subtle light gridlines on both axes. All chrome clearly readable against the light background.
      Data: 85 green (#009E73) scatter points at ~0.65 fill-opacity with thin cream strokes tracing a rise-then-plateau-then-slight-decline curve; solid lavender (#C475FD) polynomial regression line with a semi-transparent lavender 95% confidence band (opacity now 0.11, slightly subtler than the prior attempt's 0.15); rounded cream callout box top-left shows "R² = 0.836", the fitted equation "y = -0.0003x² + 0.101x + 1.46", and "Degree-2 (quadratic) fit, 95% band" in dark/gray text.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black (#1A1A17-consistent), not pure black.
      Chrome: identical title/subtitle/axis-label/tick text now rendered in light ink against the dark surface at the same larger 42px title size; faint light gridlines. No dark-on-dark issues found anywhere.
      Data: colors unchanged from the light render — identical green scatter points, lavender curve, and lavender confidence band (only chrome flipped, as required). The callout box flips to a dark elevated fill with light text, fully readable.
      Legibility verdict: PASS

    Both renders pass legibility, no clipping (AR-09 clear), no overlap. Canvas gate passed (exact 3200x1800, no /tmp/anyplot-canvas-gate.txt file present).
