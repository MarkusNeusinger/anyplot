review:
  strengths:
  - Excellent idiomatic use of MUI X's composable ChartContainer API (layered LinePlot
    + ScatterPlot with ChartsGrid/ChartsXAxis/ChartsYAxis) rather than a monolithic
    chart component — a genuinely distinctive MUI X pattern
  - 'Correct Imprint palette usage: brand green (#009E73) for observations, canonical
    lavender (position 2) for the regression fit, identical across both themes with
    fully theme-adaptive chrome'
  - Strong data storytelling — the bold, stroke-outlined R² annotation and equation
    callout create a clear focal point drawing the eye to goodness-of-fit
  - Physically realistic projectile-motion data (correct gravity constant, plausible
    launch velocities/height) produces a genuinely curved, non-linear relationship
    as required by the spec
  - Deterministic LCG + Box-Muller RNG with fixed seed gives full reproducibility
    without any external dependency
  - Scatter alpha (~0.67 via the 'aa' hex suffix) matches the spec's moderate-transparency
    guidance for density
  weaknesses:
  - 'yAxis config sets both `tickFontSize: 28` and `tickLabelStyle: { fontSize: 14
    }` — tickFontSize appears to have no effect (rendered Y-axis ticks match the 14px
    tickLabelStyle, not 28px), leaving dead/confusing leftover code. Remove the unused
    tickFontSize prop.'
  - No legend distinguishing the scatter 'observations' series from the regression
    line — the convention (dots=data, line=fit) is inferable and the equation/R² callout
    helps, but an explicit legend would make the two series unambiguous, especially
    for accessibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white cream, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-regression-polynomial · javascript · muix · anyplot.ai" bold and dark, fully visible near top-center. Equation "h(x) = -0.0153x² + 0.788x + 1.16" in muted gray and "R² = 0.989" in bold lavender with a thin ink stroke sit in the top-left margin, both fully readable. Axis labels "Horizontal Distance (m)" / "Height (m)" and all tick labels render in dark ink, clearly legible. Grid lines subtle (both axes), L-shaped spine (left+bottom only).
      Data: Scatter points are semi-transparent brand green (#009E73 @ ~67% alpha), regression curve is lavender (Imprint position 2) with a thin ink drop-shadow for contrast against overlapping points — both exactly as specified.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
