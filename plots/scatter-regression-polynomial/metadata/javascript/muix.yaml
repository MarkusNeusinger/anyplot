review:
  strengths:
  - Accurate least-squares quadratic regression computed from scratch and displayed
    with a visible R² (0.989) and equation annotation (h(x) = -0.0153x² + 0.788x +
    1.16), directly fulfilling the spec's 'display R² prominently' and 'annotate equation'
    notes.
  - Realistic, factually-grounded projectile-trajectory scenario using correct kinematic
    constants (g=9.81, plausible launch velocities), producing a believable parabolic
    scatter with sensor-style noise.
  - 'Clean theme-adaptive chrome — both renders pass legibility checks, backgrounds
    correctly flip to #FAF8F1/#1A1A17, text flips to theme-correct ink, and data colors
    (green points, blue curve) stay identical across themes.'
  - Idiomatic ChartContainer composition (ScatterPlot + LinePlot + custom SVG text
    annotations) is the correct MUI X pattern for combining a scatter series with
    a fitted curve, which a single high-level chart wrapper could not achieve.
  - Marker size and alpha (~0.67) are well matched to the 85-point density per the
    style guide's data-density heuristic.
  weaknesses:
  - 'VQ-07: The regression line uses t.palette[2] (blue #4467A3, canonical position
    3) instead of t.palette[1] (lavender #C475FD, canonical position 2). There is
    no strong semantic cue here (not water/sky data) that justifies skipping position
    2 — follow the canonical Imprint order for the second series, or if blue is kept
    deliberately, note the semantic reasoning.'
  - 'CQ-01: The file departs significantly from KISS structure with 6 helper functions
    (makeLcg, randNormal, solveLinearSystem, polyFit, evalPoly, formatSigned) before
    the main data/chart flow. Even though a from-scratch fit is required in-browser,
    consider consolidating (e.g., fold solveLinearSystem directly into polyFit, drop
    the separate formatSigned helper) to reduce the surface area.'
  - 'DE-01/DE-02: Styling relies on only two colors (brand green + one accent blue)
    with default MUI X spine/tick treatment beyond the grid opacity override — there
    is room for more deliberate typographic hierarchy or a subtler secondary-line
    treatment to reach publication-ready polish.'
  - Title occupies only ~40% of canvas width — not a violation, but given the strong
    equation/R² focal point already established, a slightly larger title would better
    match the visual hierarchy the rest of the chart establishes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "scatter-regression-polynomial · javascript · muix · anyplot.ai" centered at top, clearly legible. Top-left annotation block shows the fitted equation "h(x) = -0.0153x² + 0.788x + 1.16" in soft dark gray and "R² = 0.989" in bold blue below it. X-axis "Horizontal Distance (m)" (0-54) and Y-axis "Height (m)" (-1 to 12) both labeled with units and readable tick labels. Grid lines are faint and subtle.
      Data: ~85 green (#009E73) scatter points with light edges tracing a clear upward-then-downward parabolic arc from (~1, 2.4) through a peak near (26, 11.3) down to (~53, 0). A solid blue (#4467A3) regression curve tracks the point cloud closely, consistent with the high R².
      Legibility verdict: PASS — all text (title, equation, R², axis labels, tick labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now rendered in light/white text, centered top, fully legible. Equation text in light gray, "R² = 0.989" in the same bold blue (still reads well against the dark surface). Axis labels and tick labels rendered in light ink, fully legible. Grid lines faint light-on-dark.
      Data: Scatter points remain the identical green (#009E73) and the regression curve remains the identical blue (#4467A3) as the light render — confirms data-color parity between themes; only chrome (background/text/grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all chrome text is clearly visible against the near-black background.
