review:
  strengths:
  - 'Correct Imprint palette: scatter points are #009E73 (brand green), the fitted
    curve uses palette position 2 (#C475FD lavender), and both backgrounds/chrome
    are theme-correct (#FAF8F1 light, #1A1A17 dark) with identical data colors across
    renders'
  - 'Genuine computed regression, not a canned/fake fit: normal-equations least-squares
    via Gaussian elimination with partial pivoting, live R² and equation values driven
    straight from the fitted coefficients'
  - Realistic, well-chosen dataset (advertising spend vs. revenue lift) that traces
    a true inverted-U shape — the kind of curve a linear fit could not capture — giving
    the quadratic regression genuine narrative purpose
  - 95% prediction band correctly derived from residual standard deviation and layered
    behind the points/curve for correct z-order
  - 'Full spec-note coverage: R² badge prominent, equation annotated, degree-2 default,
    point alpha 0.65, solid contrasting curve color, optional prediction band included,
    descriptive axis labels with units'
  - Deterministic LCG-seeded data generation — fully reproducible across runs
  weaknesses:
  - 'Design Excellence relies mostly on theme-token defaults (standard grid, standard
    legend, standard axes) with only the equation/R² badge as a custom flourish —
    push refinement further: lighter/dashed gridlines, tighter top-region whitespace
    (title + legend + badge currently crowd the top ~20% of the canvas), more deliberate
    visual hierarchy between the band, points, and curve'
  - Title spans only ~40% of canvas width at font size 22 — notably narrower than
    the ~70-85% expected for the mandated `{spec-id} · {lang} · {lib} · anyplot.ai`
    string; a slightly larger title font (e.g. 24-26px) would give it more presence
    without risking overflow
  - The '95% prediction band' legend swatch renders at the same low alpha (0.18) as
    the band fill itself, making the swatch chip hard to distinguish in the legend
    row even though the band is clearly visible on the chart — consider a higher-opacity
    swatch-only color or an outline
  - 'Library Mastery is solid but not maximal: beyond the afterDraw plugin badge,
    the implementation is a fairly standard combination of scatter + line datasets;
    a more distinctive Chart.js-specific technique (e.g. an interactive tooltip callback
    surfacing per-point residuals, or toggling the band via the legend) would push
    this further'
  - CQ-01 (KISS structure) is diluted by five free-standing helper functions (lcg,
    gaussian, polyfit, hexToRgba, signedTerm) — the regression math and seeded RNG
    genuinely require some helper logic in JS, but polyfit's Gaussian elimination
    could be trimmed or the equation-formatting helpers consolidated
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-regression-polynomial · javascript · chartjs · anyplot.ai" in bold dark ink at top center; legend row directly below with three entries (gray "95% prediction band" swatch, green "Ad campaigns (spend vs. revenue lift)" dot, lavender-outlined "Quadratic fit (degree 2)" swatch); x-axis title "Advertising Spend ($ thousands)" and y-axis title "Revenue Lift ($ thousands)" both in dark ink; tick labels in a slightly softer dark gray; subtle light-gray gridlines. All chrome text is clearly readable against the light background.
      Data: Scatter points rendered in #009E73 (brand green) at ~0.65 alpha showing an inverted-U trend from low spend/low lift up through a peak around spend≈55-60 and back down; a solid lavender (#C475FD) quadratic curve threads through the point cloud; a semi-transparent gray 95% prediction band envelopes the curve. A rounded equation badge in the top-right shows "y = -0.0435x² + 5.0562x + 17.1705" and "R² = 0.892" in bold dark text on a light elevated panel with a thin border — fully legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis titles now rendered in light/white ink; tick labels in a lighter soft gray; gridlines subtle and still visible against the dark surface. No dark-on-dark text found anywhere — title, axis titles, tick labels, legend text, and the equation badge text are all clearly legible.
      Data: Scatter points remain #009E73 (identical to light render), the curve remains #C475FD lavender (identical), and the prediction band remains the same semi-transparent gray, just visually sitting against the dark backdrop — confirms data colors are unchanged between themes, only chrome flipped. The equation badge uses a dark elevated panel background with light text, fully readable.
      Legibility verdict: PASS
