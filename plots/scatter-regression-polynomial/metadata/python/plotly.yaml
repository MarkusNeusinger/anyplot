review:
  strengths:
  - 'Correct plot type: scatter with a degree-2 polynomial fit overlaid, exactly matching
    the spec''s primary requirement'
  - R² (0.9633) and the polynomial equation are displayed prominently in a callout
    box, as required by the spec
  - 'Realistic, neutral, domain-plausible data: building energy consumption vs. outdoor
    temperature forms a genuine U-shaped (heating+cooling) curve, not a synthetic-looking
    parabola'
  - 'Theme-adaptive chrome is correctly implemented — both renders use the correct
    #FAF8F1/#1A1A17 backgrounds, and all text (title, axis labels, ticks, legend,
    annotation) is legible in both themes with no dark-on-dark or light-on-light failures'
  - 'Imprint palette correctly applied: first series (scatter) is #009E73, the regression
    line uses the next canonical position (#C475FD lavender), identical across both
    themes'
  - Marker opacity (0.65) matches the spec's recommended 0.6-0.7 range for showing
    density
  - Title fontsize is explicitly scaled via a length-based formula so the long mandated
    title plus descriptive prefix doesn't overflow or clip
  - Clean, reproducible KISS-structured code with np.random.seed(42), only necessary
    imports, and correct output naming (plot-{THEME}.png/.html)
  weaknesses:
  - 'Polynomial equation annotation has a double-sign artifact: f"y = {a:.4f}x² +
    {b:.2f}x + {c:.1f}" renders as ''y = 0.1215x² + -3.63x + 56.3'' because b is negative
    — branch on the sign of b (and c) so it reads ''y = 0.1215x² - 3.63x + 56.3'''
  - Legend and R²/equation callout both use a visible bordered rectangle (borderwidth=1)
    — the style guide's Decoration Removal Checklist calls for removing box frames
    around legends/callouts for a cleaner look; consider a borderless elevated-bg
    fill instead, or a much lighter border opacity
  - 'Design Excellence is only moderate: the plot is well-configured but doesn''t
    yet reach publication-level polish — e.g. no visual emphasis on the curve''s minimum
    (the actual ''optimal temperature'' insight), which would elevate the data storytelling'
  - 'Mandated title''s optional descriptive prefix (''Building Energy Consumption'')
    doesn''t itself reference ''polynomial regression'' — the spec asks for a title
    that mentions polynomial regression; today that only comes from the spec-id substring.
    Consider a prefix like ''Energy vs. Temperature: Quadratic Fit'' to make the descriptive
    portion self-explanatory'
  - With ~100 points, some markers visibly cluster/overlap in the mid-curve trough
    region — a slightly smaller marker size or slightly lower opacity there would
    keep the density read cleaner without losing prominence
