review:
  strengths:
  - First-series color exactly matches the Imprint brand green (#009E73); the trend
    curve uses the palette's second color (#C475FD), giving strong, deliberate contrast
    against the scatter cloud.
  - 'All spec-mandated features are present: a prominent R² annotation, an explicit
    polynomial equation (y = ax² + bx + c), a semi-transparent confidence band around
    the fit, and moderate point alpha (0.65) that reveals density in the crowded lower-x
    region.'
  - The x-axis rug plot is a tasteful, library-idiomatic addition that adds marginal-distribution
    context without cluttering the primary scatter/curve story.
  - Canvas gate passes (3200×1800), the title matches the mandated '{spec-id} · plotnine
    · anyplot.ai' pattern exactly, and both light/dark renders are fully theme-correct
    with no edge clipping.
  - Realistic, neutral marketing-spend-vs-revenue diminishing-returns scenario with
    a sensible business scale ($5K–$200K spend, up to ~$360K revenue).
  weaknesses:
  - Axis labels ('Marketing Spend', 'Revenue') don't state units in the label text
    itself — currency is only conveyed indirectly via the $K tick formatting; consider
    'Revenue ($)' / 'Marketing Spend ($)' for extra clarity.
  - 'Design excellence is strong but leaves a little on the table for a 10/10: the
    confidence band uses a neutral gray fill (INK_MUTED) rather than a tint of the
    trend color, and there''s no callout/annotation marking the curve''s inflection
    or saturation point, which would deepen the diminishing-returns narrative.'
  - Library mastery could go further — only geom_point/geom_rug/geom_smooth/annotate
    are used; a plotnine-distinctive layer such as geom_smooth confidence styling
    via stat_smooth parameters or facet-free but theme-driven secondary annotation
    would showcase more of the grammar-of-graphics toolkit.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface, not pure white.
      Chrome: Title "scatter-regression-polynomial · plotnine · anyplot.ai" is centered at the top in dark ink, fully visible with no clipping. Axis titles "Marketing Spend" (x) and "Revenue" (y) and $-formatted tick labels ($0K-$200K, $100K-$300K+) are dark/soft-ink and clearly legible against the light background. Grid lines are faint horizontal/vertical off-white-adjacent lines, subtle but present. A thin dark axis line runs along the left and bottom.
      Data: Points are Imprint brand green (#009E73) circles at alpha ~0.65, showing a concave (diminishing-returns) scatter from low-spend/low-revenue to high-spend/plateauing-revenue. A purple (#C475FD) quadratic trend line runs through the cloud with a light gray semi-transparent confidence band hugging it closely. A rounded white annotation box in the lower-right displays the fitted equation "y = -0.0084x² + 3.414x + 10.59" and "R² = 0.982" in large, bold dark text. A green rug plot along the x-axis marks the marginal spend distribution.
      Legibility verdict: PASS — all text (title, axis labels, ticks, equation box) is clearly readable with no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface, not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light ink/off-white and remain fully legible against the dark background. Grid lines are faint light-on-dark lines, subtle but visible. Axis line is a light soft-ink stroke along left/bottom.
      Data: Point and trend-line colors are pixel-identical to the light render — green (#009E73) points at the same alpha, purple (#C475FD) trend curve, and the same light gray confidence band (rendered against the dark chrome it reads as a muted band around the curve). The equation annotation box has flipped to a dark elevated-surface fill with light text, fully legible. Rug plot marks remain the same brand green.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element (title, axis labels, ticks, equation box) is clearly readable, and data colors are confirmed identical to the light render (only chrome flipped).
