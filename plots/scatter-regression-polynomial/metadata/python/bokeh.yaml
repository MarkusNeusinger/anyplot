review:
  strengths:
  - 'Directly addresses the attempt-1 feedback: a shaded ''Diminishing returns'' zone
    (BoxAnnotation + Label) derived from the curve''s own marginal-gain math gives
    the plot a genuine focal point and storytelling hook tied to the spec''s economics
    application, not just a generic band+annotation baseline'
  - New live marginal-gain readout (Span crosshair + Label + js_on_event(MouseMove,
    CustomJS)) is a real bokeh-distinctive feature — the HTML detail view lets a reader
    probe dy/dx = 2ax+b anywhere along the curve, something a static-image library
    cannot offer
  - 'All spec-required and optional features present: prominent R² annotation, visible
    polynomial equation, degree-2 curve visually distinct in Imprint lavender against
    the green scatter, and a semi-transparent 95% prediction band with a subtle dashed
    edge for a defined silhouette'
  - 'Theme handling is correct and complete in both renders: identical data colors
    (#009E73 scatter, #C475FD curve), only chrome (background, text, grid, legend,
    annotation boxes) flips, and all text — including the two new annotations — remains
    legible against both the light and dark backgrounds'
  - Canvas dimension gate passed (3200x1800), title follows the exact required format,
    deterministic data generation (np.random.seed), clean ColumnDataSource usage,
    current bokeh API (p.scatter, not deprecated p.circle)
  weaknesses:
  - Visual refinement is still close to style-guide defaults beyond the new band dashed-edge
    treatment — grid alpha, legend frame, and plot outline are unchanged from a standard
    baseline recipe; a subtler outline or refined legend frame would lift DE-02 further
  - 'The ''Marginal gain: 0.84%/$k at $35k (hover to probe)'' label sits directly
    over the semi-transparent confidence band, giving it slightly lower effective
    contrast than the rest of the chrome text in both themes — still legible, but
    worth nudging to a clearer patch of background or adding a small background_fill
    on the Label'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "scatter-regression-polynomial · bokeh · anyplot.ai" fully visible at top. Italic dark axis titles "Investment (thousands $)" / "Efficiency Gain (%)". Tick labels in softer muted ink. Faint gridlines. Legend (top-left, "Data Points" / "Polynomial Fit (degree 2)") on a light elevated background with a thin border. New elements: a faintly shaded "Diminishing returns" zone (right portion of the plot) with an italic gray label at the top, and a dashed vertical crosshair line near x=35 with a "Marginal gain: 0.84%/$k at $35k (hover to probe)" label beneath it. All chrome text is clearly readable against the light background, including the new annotations.
      Data: Green (#009E73) scatter points trace a clear diminishing-returns curve; a lavender (#C475FD) polynomial curve overlays a soft gray confidence band with a faint dashed lavender edge. R²/equation annotation box ("R² = 0.9765", "y = -0.0047x² + 1.17x + 20.07") sits in open space above the curve on the right, background-filled so it doesn't visually collide with any point.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light/off-white ink, tick labels in soft light gray, legend on a dark elevated background — all clearly legible, no dark-on-dark failures. The diminishing-returns shading and marginal-gain crosshair/label are present and legible in the same positions as the light render, with light-gray/white text against the dark surface.
      Data: Scatter and curve colors identical to the light render (#009E73 / #C475FD confirmed unchanged — only chrome flipped). Confidence band fill and R²/legend/annotation boxes use theme-adaptive elevated dark backgrounds with light-ink text, fully readable.
      Legibility verdict: PASS
