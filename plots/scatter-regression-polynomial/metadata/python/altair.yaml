review:
  strengths:
  - Confidence band, regression curve, and R²/equation annotation are all present
    and correctly derived from the same np.polyfit(x, y, 2) fit — exactly matching
    the spec's 'display R² prominently' and 'annotate with the polynomial equation'
    notes.
  - Scatter uses moderate transparency (opacity 0.65 base, 0.95 on hover) matching
    the spec's alpha 0.6-0.7 recommendation, plus a live hover-selection encoding
    (size/opacity condition) that adds real interactive value in the HTML output without
    hurting the static PNG.
  - 'First-series color is Imprint #009E73 and the regression curve/band correctly
    use the second Imprint color (#C475FD) — clear visual separation between data
    and fit as the spec requires.'
  - 'Both light and dark renders are fully theme-correct: warm off-white / near-black
    backgrounds, no dark-on-dark or light-on-light text, identical data colors between
    themes (only chrome flips).'
  - Deterministic data generation via np.random.seed(42); clean KISS script with no
    functions/classes and only used imports.
  weaknesses:
  - Chart title is 'scatter-regression-polynomial · altair · anyplot.ai' — missing
    the required {language} token. Per SC-04 the mandated format is '{spec-id} · {language}
    · {library} · anyplot.ai', so it should read 'scatter-regression-polynomial ·
    python · altair · anyplot.ai'.
  - y is clipped with np.clip(y, 1, 30), which stacks a visibly artificial row of
    points flush against y=30 across most of the plateau region (x ≈ 4.2 to 9.2) —
    reads as a data-generation ceiling rather than natural variance. Either raise
    the clip ceiling well above the curve's max, or reduce the noise/skew so clipping
    rarely triggers.
  - Design execution is solid but fairly standard for this stage of the catalog (band
    + curve + annotation + hover is now a common recipe across altair regression specs)
    — no distinctive typographic hierarchy, custom tick formatting, or focal-point
    emphasis beyond the default annotation text; consider bolding/sizing the curve
    peak or adding a subtle marker at the vertex to strengthen the storytelling.
  - Hover-driven size/opacity condition is a nice idiomatic altair touch but is the
    only distinctly 'altair-flavored' technique used — no faceting, no scale/legend
    customization beyond the theme tokens, so Library Mastery reads as competent rather
    than showcasing altair-specific strengths.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-regression-polynomial · altair · anyplot.ai" in bold dark ink, centered at top. X-axis labeled "Fertilizer (kg/ha)" (0.0-10.0), Y-axis labeled "Crop Yield (tons/ha)" (0-35). Subtle light-gray gridlines. Tick labels in soft dark gray. All chrome clearly visible against the light background.
      Data: Green (#009E73) scatter points with a thin light-colored stroke, forming a clear rising-then-plateauing-then-falling arc (fertilizer vs. crop yield). A solid purple (#C475FD) regression curve overlays the scatter, with a semi-transparent purple confidence band around it. Bold black "R² = 0.853" annotation and a lighter gray "y = -0.50x² + 6.42x + 9.39" equation annotation sit in the upper-left of the plot area, not overlapping any data.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, annotations) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in white/light text, centered at top. Axis titles and tick labels rendered in light gray, clearly visible against the dark background. Gridlines are faint and subtle but still visible.
      Data: Same green (#009E73) scatter points and same purple (#C475FD) regression line/band as the light render — colors are identical between themes, only the chrome (background, text, grid) has flipped. The purple band appears more luminous against the dark backdrop, which is an expected perceptual effect of the same hex value on a different background, not an actual color change. R² and equation annotations are rendered in white/light-gray and remain fully legible.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data markers are clearly distinguishable from the near-black background.
