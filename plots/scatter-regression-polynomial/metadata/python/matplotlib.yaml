review:
  strengths:
  - 'Directly addressed every attempt-1 weakness: scatter markers bumped s=100/alpha=0.7
    -> s=140/alpha=0.8 (now inside the 100-200pt density band), annotation-box fontsize
    raised 8 -> 9pt, and a matplotlib-distinctive patheffects halo was added to lift
    the fit line off the scatter cloud in both themes'
  - New vertex/'Peak return' callout gives the chart a concrete focal point that names
    the diminishing-returns insight the spec asks for, meaningfully raising data storytelling
    over attempt 1
  - 'Correct Imprint palette usage: brand green (#009E73) for scatter as position
    1, lavender (#C475FD) as position 2 for band/curve, identical data colors across
    light and dark renders'
  - 'Both renders are fully theme-correct: background, title, axis labels, tick labels,
    grid, legend frame, and annotation box all flip correctly with no dark-on-dark
    or light-on-light failures'
  - 'Clean KISS script: reproducible seed, only necessary imports, exact canvas dims
    via figsize/dpi with no bbox_inches=''tight'', mathtext-typeset equation annotation'
  - 'All spec-required features present: quadratic fit, R² displayed prominently,
    equation annotation, semi-transparent confidence band, moderate scatter alpha'
  weaknesses:
  - Confidence band uses a single constant residual-std width across the whole x-range
    instead of x-dependent uncertainty (naturally wider near the data extremes) —
    a minor statistical simplification for an 'approximate' band, but a true prediction-interval
    formula would be more rigorous
  - Legend still reserves ~32% of canvas width on the right; an inside-axes or bottom-anchored
    legend could reclaim horizontal space for the data area without new collisions
  - Design Excellence is improved but still short of publication-tier — e.g. the confidence-band
    fill and scatter alpha are uniform rather than emphasizing the higher-density/lower-variance
    core of the curve
