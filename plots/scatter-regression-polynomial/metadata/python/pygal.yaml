review:
  strengths:
  - Fitted quadratic curve tracks the parabolic trend cleanly and is visually distinct
    from the scatter (solid lavender line, 2.5px stroke, vs. semi-transparent green
    dots)
  - R² and the full polynomial equation are both surfaced by folding them into the
    fit series' legend label — a working solution to pygal's known limitation that
    empty-data series never render
  - Points use opacity=0.7 as the spec recommends, keeping density visible without
    muddying the curve
  - Theme tokens (PAGE_BG/INK/INK_SOFT/INK_MUTED) are threaded consistently through
    the Style object; both light and dark renders are fully legible with identical
    data colors and only chrome flipping
  - 'Canvas is exactly 3200×1800, first series correctly uses Imprint #009E73, deterministic
    via np.random.seed(42)'
  weaknesses:
  - Title is 'scatter-regression-polynomial · pygal · anyplot.ai' — missing the mandated
    {language} segment. Per SC-04 it must read 'scatter-regression-polynomial · python
    · pygal · anyplot.ai' (optionally with a descriptive prefix).
  - R² and the equation are only readable via the bottom legend text (font_size=44,
    smaller than the title) rather than a prominent on-canvas annotation near the
    curve itself — spec asks for R² 'prominently on the plot'. Consider a larger annotation
    near the curve apex in addition to (or instead of) the legend label.
  - 'Design Excellence is generic: off-white/near-black background and default gridlines
    with no additional refinement (no annotation callouts, no shaded confidence band,
    no distinctive visual hierarchy beyond the curve overlay itself) — the optional
    confidence band from the spec would meaningfully raise DE-01/DE-03.'
  - Library Mastery is baseline pygal.XY usage; no distinctive pygal-specific feature
    (e.g. print_values, tooltips content customization, range/secondary axis) is demonstrated
    beyond the Style token customization already expected by every implementation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec target.
      Chrome: Title "scatter-regression-polynomial · pygal · anyplot.ai" in dark ink, large and centered at top. X-axis title "Sunlight Exposure (hours)" and y-axis title "Plant Growth (cm)" in dark ink, clearly readable. Tick labels (2-14 on x, 10-130 on y) dark and legible. Dotted gridlines subtle grey, visible but not dominant. Legend at bottom-left with two entries: green square "Data Points" and lavender square "Fit: y = -2.36x² + 42.92x - 75.20 (R²=0.886)".
      Data: ~80 green (#009E73) scatter points with visible transparency (opacity 0.7) tracing a clear parabolic arc from (2, ~5) up to a peak near (9, 120) and back down to (14, ~36). A solid lavender/purple fit curve (Imprint palette position 2, #C475FD) overlays the scatter, closely tracking the parabola's shape.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec target.
      Chrome: Same title, axis titles, and tick labels now rendered in light/off-white ink, clearly legible against the dark background. Gridlines remain subtle (muted light-grey dotted lines), visible without dominating. Legend text also switches to light ink and stays readable.
      Data: Identical green (#009E73) scatter points and lavender (#C475FD) fit curve as the light render — confirmed the data colors are unchanged between themes, only the chrome (background/text/grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly visible against the near-black background, and the brand green remains vivid on the dark surface.
