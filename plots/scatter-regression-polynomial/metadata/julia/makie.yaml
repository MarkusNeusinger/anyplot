review:
  strengths:
  - R² (0.982) and the full quadratic equation are annotated prominently in the bottom-right,
    directly satisfying the spec's 'display R² prominently' and 'annotate with the
    polynomial equation' notes.
  - 95% confidence band is included around the fit curve (the spec's optional enhancement),
    correctly alpha-blended and pixel-verified identical base colors between light
    and dark renders.
  - 'Clean, idiomatic implementation: closed-form Vandermonde least-squares quadratic
    fit with no external ML dependency, flat single-script structure, Random.seed!(42)
    for reproducibility, and theme tokens threaded consistently through every Axis
    kwarg.'
  - 'Both renders are theme-correct: backgrounds measured exactly #FAF8F1 (light)
    and #1A1A17 (dark), all text legible in both themes, subtle gridlines, top/right
    spines removed.'
  - Physically plausible projectile-motion dataset (90 points, parabolic arc, moderate
    Gaussian noise) at a realistic scale for the domain.
  weaknesses:
  - Title occupies only ~37% of canvas width (measured 1193/3200 px), well below the
    50-70% comfortable target — the dynamic fontsize formula `round(Int, 20 * 67 /
    length(title_str))` overcorrects for this 78-char title and shrinks it too far;
    increase the multiplier (or floor the shrink ratio) so the title reads with more
    visual presence.
  - The regression-fit line uses Imprint palette position 3 (#4467A3, blue) for the
    second series instead of the canonical position 2 (#C475FD, lavender) — a generic
    regression fit line has no real-world color association that qualifies as a semantic
    exception, so this breaks the 'use positions 1→N in order' hard rule from the
    style guide.
  - 'Design Excellence is solid but not fully realized: the legend/annotation styling
    is functional rather than distinctive, and Library Mastery could lean further
    into Makie-specific idioms (e.g. richer text/Label composition) beyond band!/scatter!/lines!/text!.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured RGB (250,248,241) = #FAF8F1 exactly as required.
      Chrome: Title "Projectile Motion · scatter-regression-polynomial · julia · makie · anyplot.ai" is bold dark text, clearly visible but occupies only ~37% of canvas width (smaller than the comfortable 50-70% target). Axis labels "Horizontal Distance (m)" / "Height (m)" and tick labels are dark/soft-ink and fully legible. Grid lines are subtle light gray, visible but not dominant.
      Data: Scatter points are Imprint brand green (#009E73, alpha 0.65 with light-bg-colored stroke), forming a clear parabolic arc. Fit line is Imprint position-3 blue (#4467A3, solid, linewidth 3). A light gray 95% confidence band hugs the fit line. Equation "ŷ = -0.0275x² + 1.974x + 0.14, R² = 0.982" is annotated bottom-right in dark ink, fully readable, no overlap with data or legend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, measured RGB (26,26,23) = #1A1A17 exactly as required.
      Chrome: Title, axis labels, and tick labels flip to light ink and remain clearly legible against the dark background — no dark-on-dark failures observed. Grid lines remain subtle.
      Data: Scatter/fit-line base hex colors verified pixel-identical to the light render (green #009E73 and blue #4467A3); the differing on-screen tone of the alpha-blended scatter fill (green composited over dark vs. light background) is expected alpha-compositing behavior, not a palette violation — the underlying hue and the solid (non-alpha) fit line are unchanged. Confidence band and equation annotation remain legible.
      Legibility verdict: PASS
