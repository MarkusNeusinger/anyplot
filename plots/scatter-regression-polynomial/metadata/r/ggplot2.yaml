review:
  strengths:
  - 'Both attempt-1 weaknesses resolved: unused library(dplyr) removed, panel.grid.major
    now uses INK_SOFT instead of full INK'
  - Idiomatic geom_smooth(method="lm", formula = y ~ poly(x, 2, raw = TRUE), se =
    TRUE) delivers fitted curve and confidence band in one call
  - R² and polynomial equation annotated prominently and legibly in both themes with
    no overlap
  - 'Correct Imprint palette usage: brand green points, blue curve, identical across
    light/dark renders; clean theme-adaptive chrome'
  - Title fontsize correctly scaled down for the long descriptive+mandated title,
    avoiding overflow
  - Realistic, neutral synthetic data (nitrogen fertilizer vs. corn yield) with genuine
    diminishing-returns quadratic pattern, R²=0.919
  weaknesses:
  - Design polish is solid but conventional (DE-01) - relies mostly on ggplot2 defaults
    for point shape/layering
  - Data storytelling (DE-03) could be stronger - no explicit marker of the yield-maximizing
    fertilizer rate at the curve peak
