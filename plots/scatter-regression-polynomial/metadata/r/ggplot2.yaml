review:
  strengths:
  - Idiomatic geom_smooth(method="lm", formula = y ~ poly(x, 2, raw = TRUE), se =
    TRUE) delivers both the fitted curve and the spec's optional confidence band in
    one call.
  - R² and the polynomial equation are annotated prominently and legibly in both themes,
    satisfying the spec's 'display R² prominently' and 'consider annotating the equation'
    notes.
  - 'Correct Imprint palette usage: brand green (#009E73) for points, blue (#4467A3)
    for the curve, identical across light/dark renders.'
  - Realistic, neutral synthetic data (nitrogen fertilizer vs. corn yield) that produces
    a genuine diminishing-returns quadratic pattern rather than a contrived shape.
  - Theme-adaptive chrome is clean and fully legible in both renders; canvas is exactly
    3200×1800 with no clipping.
  weaknesses:
  - 'library(dplyr) is imported but never used anywhere in the script (no dplyr verbs
    or dplyr:: calls) — remove the unused import.'
  - panel.grid.major uses the full INK color (not INK_SOFT) at linewidth 0.15, giving
    a slightly more visible/prominent gridline than an ideal subtle grid — consider
    INK_SOFT or a fainter weight for a cleaner look.
  - Design polish is solid but not exceptional — the plot relies on ggplot2 defaults
    for point shape and layering; a touch more visual hierarchy (e.g. slightly larger
    curve/point size contrast) would push this from good to great.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "Corn Yield vs. Nitrogen Fertilizer · scatter-regression-polynomial · r · ggplot2 · anyplot.ai" clearly readable at top-left. Axis titles ("Nitrogen Fertilizer (kg/ha)", "Corn Yield (t/ha)") and tick labels are dark/soft-dark and fully legible. Grid lines are gray, visible but not overpowering. Left and bottom axis lines present, no border box.
      Data: Green (#009E73) scatter points at alpha ~0.65 showing an upward-then-plateauing trend from ~0 to ~300 kg/ha fertilizer; a solid blue (#4467A3) polynomial curve with a light semi-transparent confidence ribbon overlays the points, clearly distinct from the point color. Equation "y = -0.00019x² + 0.078x + 2.22" and "R² = 0.919" are annotated top-left in dark text, fully readable and not overlapping any data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels render in light/white tones and are clearly legible against the dark background — no dark-on-dark issues observed. Grid lines are light gray, subtle but visible.
      Data: Same green (#009E73) points and blue (#4467A3) curve/ribbon as the light render — data colors are identical between themes, confirming only chrome flipped. Annotation text is white and fully readable, no overlap with data.
      Legibility verdict: PASS
