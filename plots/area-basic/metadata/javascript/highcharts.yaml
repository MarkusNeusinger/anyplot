review:
  strengths:
  - Clean, idiomatic Highcharts area chart with a proper gradient fill (Highcharts.color().setOpacity()
    from 45% to 2%), giving strong visual weight to the "volume" emphasis the spec
    calls for.
  - 'Correct Imprint palette usage — #009E73 brand green identical across both themes
    — with theme-adaptive chrome fully threaded through title, subtitle, axis labels,
    and gridlines; no dark-on-dark or light-on-light failures.'
  - Deterministic seeded LCG produces a realistic, plausible daily CPU-utilization
    curve (low overnight, single afternoon peak, natural noise) — good domain realism.
  - Explicit font sizing throughout (title 22px, subtitle 14px, axis titles 16px,
    tick labels 14px) with balanced X/Y axis label and tick sizing, no overlap or
    clipping in either render.
  - Single-series legend correctly omitted per style guide.
  weaknesses:
  - Design Excellence is still close to a "well-configured default" — beyond the gradient
    fill there's little custom aesthetic sophistication (e.g. no annotation/callout
    on the peak, no secondary visual emphasis) to lift it into publication-ready territory.
  - 'No explicit storytelling emphasis: the ~79% afternoon peak — the single most
    interesting data point — isn''t called out via annotation, marker, or color emphasis;
    the viewer has to find it themselves.'
  - 'Markers are fully disabled (marker.enabled: false) even for a hover-only reveal;
    with only 48 sample points (just under the "sparse" <50 threshold), a subtle prominent
    marker at the peak or a light marker on the whole series would improve element
    visibility per the data-density heuristic.'
  - Library Mastery is fairly generic — the gradient fill via Highcharts.color().setOpacity()
    is a nice touch but doesn't leverage a more distinctive Highcharts capability
    (e.g. plotLines/plotBands for a threshold reference, or dataLabels on the peak)
    that would set this implementation apart from what other JS libraries could produce
    with minor syntax changes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "area-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Web server CPU utilization, 24-hour sample" in soft gray beneath it. X-axis "Time of Day (UTC)" with HH:MM tick labels every 4 hours; Y-axis "CPU Utilization (%)" with 0/20/40/60/80/100% ticks and subtle horizontal gridlines only. All chrome text is clearly dark-on-light and fully readable.
      Data: Single green (#009E73) line with a vertical gradient area fill (opaque near the line, fading to near-transparent at the baseline) tracing a daily CPU-utilization curve — low (~20%) overnight, ramping up through the morning, peaking around ~79% in the early afternoon (~14:00), then declining back down by evening. No legend (correctly omitted for a single series).
      Legibility verdict: PASS — all text is clearly readable against the light background, no overlap, no clipping at the canvas edges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle and axis labels, now rendered in light ink/soft-gray tones. Gridlines and axis lines are faint and theme-appropriate. No dark-on-dark text anywhere.
      Data: Identical green (#009E73) line and the same gradient-fill area shape/values as the light render — confirms data colors are held constant across themes; only the chrome (background, text, grid) flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark or light-on-light failures observed.
