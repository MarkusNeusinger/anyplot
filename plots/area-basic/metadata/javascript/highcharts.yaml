review:
  strengths:
  - The peak call-out (highlighted marker + "Peak 79%" dataLabel) and the amber "Elevated
    load" plotBand above 70% together create a clear, immediate focal point — the
    exact fix requested after attempt 1, and it lands well without adding chartjunk.
  - 'Correct Imprint palette usage — #009E73 brand green identical across both themes
    — with theme-adaptive chrome fully threaded through title, subtitle, axis labels,
    gridlines, and the new plotBand label; no dark-on-dark or light-on-light failures
    in either render.'
  - Clean, idiomatic Highcharts area chart with a proper gradient fill (Highcharts.color().setOpacity()
    from 45% to 2%), giving strong visual weight to the "volume" emphasis the spec
    calls for.
  - Deterministic seeded LCG produces a realistic, plausible daily CPU-utilization
    curve (low overnight, single afternoon peak, natural noise) — a neutral, comprehensible
    scenario.
  - Explicit font sizing throughout with balanced X/Y axis label and tick sizing,
    no overlap or clipping in either render; single-series legend correctly omitted
    per style guide.
  weaknesses:
  - Design Excellence is stronger than attempt 1 but still short of full publication-ready
    polish — the plotBand and peak label are the main custom touches beyond the gradient
    fill; axis spines/baseline are still fully present rather than minimized.
  - Library Mastery is solid but not maximal — plotBands with a label plus a per-point
    marker/dataLabel override are good idiomatic Highcharts constructs, but the implementation
    doesn't reach for a feature that's uniquely Highcharts (e.g. a second series,
    plotLines with dashStyle, or zone-based coloring).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "area-basic · javascript · highcharts · anyplot.ai" in bold dark ink; subtitle "Web server CPU utilization, 24-hour sample" in soft gray beneath. X-axis "Time of Day (UTC)" with HH:MM tick labels every 4 hours; Y-axis "CPU Utilization (%)" with 0-100% ticks and subtle horizontal gridlines. All chrome text is dark and clearly readable against the light background.
      Data: Single green (#009E73) line with a vertical gradient area fill (opaque near the line, fading to near-transparent at the baseline) traces a daily CPU-utilization curve — low (~20%) overnight, ramping through the morning, peaking at 79% near 14:00 (highlighted with a filled dot and a "Peak 79%" dataLabel), then declining into the evening. An amber-tinted plotBand spans 70-100% labeled "Elevated load" in the upper right, giving the chart a clear semantic threshold. No legend (correctly omitted for a single series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle and axis labels, now rendered in light ink / soft-gray tones — no dark-on-dark text anywhere, including the "Elevated load" plotBand label and the "Peak 79%" dataLabel (rendered in white/light ink).
      Data: The green line, gradient fill, peak marker, and plotBand position are identical to the light render — only the chrome (background, text, grid, plotBand tint) flipped for the theme.
      Legibility verdict: PASS
