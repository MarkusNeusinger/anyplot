review:
  strengths:
  - 'Idiomatic D3: scaleTime and scaleLinear, axisBottom and axisLeft with d3.timeWeek.every(2)
    and d3.format(''~s''), and area and line generators with d3.curveMonotoneX under
    a separate line for a crisp top edge.'
  - 'Theme chrome threaded through window.ANYPLOT_TOKENS (ink, inkSoft, grid): both
    renders pass the legibility check, and the Imprint green is identical in both
    themes.'
  - A vertical gradient (0.55 to 0.05 opacity) keeps the gridlines visible through
    the area in both themes and the solid top edge distinct.
  - 'Realistic data: 90 days of documentation-site traffic with a growth trend, weekend
    dips and seeded noise, on a value axis that starts at zero.'
  weaknesses:
  - 'LM-01 (code): the data is built as {date, visitors} literals in a loop and the
    axis titles are typed strings, not the role constants and records keyed by them
    that the d3 prompt''s Data block prescribes → declare DATE and VISITORS constants,
    build `const data` keyed by them, and read the axis titles from the constants.
    Likely cause: the data block was written before the column-constant convention.'
  - 'Suggestion: a slightly heavier axis-title weight would separate the axis titles
    from the tick labels more clearly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, about #FAF8F1; not pure white.
      Chrome: semibold dark title 'area-basic · javascript · d3 · anyplot.ai' centred at the top; x ticks Mar 08 to May 17 every two weeks and y ticks 0 to 10k in soft dark ink; axis titles 'Date (2026)' and 'Daily visitors' (rotated) in dark ink; subtle horizontal gridlines visible through the fill. All readable.
      Data: one #009E73 line drawn as a monotone curve through the 90 daily values, with rounded turns at each peak and dip, rising from about 3.2k in early March to about 8.4k at the end of May with weekly dips; a vertical green gradient fill from about 55 % opacity at the top to about 5 % at the zero baseline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, about #1A1A17; not pure black.
      Chrome: title, ticks and axis titles in light ink, all clearly readable; no dark-on-dark text. Gridlines subtle and visible through the darker fill.
      Data: the same #009E73 line and gradient as the light render; only the chrome flips.
      Legibility verdict: PASS
