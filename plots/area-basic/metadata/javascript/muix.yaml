review:
  strengths:
  - 'Native MUI X area series (LineChart with area: true, baseline: 0, curve: monotoneX)
    gives a smoothed top edge that never overshoots the daily values, on a y axis
    pinned to min: 0'
  - 'Gradient fill injected as an SVG <defs> child of LineChart and wired through
    the v9 .MuiLineChart-area class: 0.55 at the line fading to 0.04 at the baseline,
    so the solid 3 px edge stays distinct and the gridlines show through the fill
    in both themes'
  - Time-scale x axis with an en-US short-date valueFormatter and a compact k-formatter
    on the y ticks keep both axes clean and untruncated thanks to explicit axis bands
    (height 68, width 84)
  - 'Realistic, neutral data: 60 days of website visitors with a growth trend, a weekend
    dip and seeded LCG noise (deterministic)'
  - 'All chrome threaded through ANYPLOT_TOKENS: correct page backgrounds, ink/inkSoft
    text, grid token; brand green #009E73 identical in both renders'
  weaknesses:
  - 'SC-01 (both): a dashed ''Avg 5.0k'' mean reference line (ChartsReferenceLine)
    is drawn across the area on a -basic spec whose characteristic section rules out
    reference and mean lines → remove the line, its label, and the avgVisitors/knownVisitors
    computation and ChartsReferenceLine import that only feed it. Likely cause: the
    <ChartsReferenceLine y={avgVisitors} …/> child of LineChart.'
  - 'Suggestion: the ''0.0k'' bottom tick could read ''0'' via the formatter for a
    cleaner baseline label.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "Website Visitors · area-basic · javascript · muix · anyplot.ai" top-left (~46 % of width); y-axis label "Daily Visitors" (rotated) with ticks 0.0k–6.5k every 0.5k; x-axis label "Date" with ticks Jan 11 … Mar 1; subtle horizontal gridlines. All text dark and readable.
      Data: one #009E73 line (3 px, monotone smoothing) over 60 daily points rising from ~4.1k to ~6.4k with weekly weekend dips; area below filled with a green gradient fading toward the baseline, gridlines visible through it. A grey dashed horizontal "Avg 5.0k" line with a small label at the right end crosses the area.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels and tick labels flip to light ink and are clearly readable; gridlines subtle but visible; no dark-on-dark text.
      Data: same #009E73 line and gradient fill as the light render (identical data color), gradient darkening toward the baseline; the dashed light-grey "Avg 5.0k" line is also present.
      Legibility verdict: PASS
