review:
  strengths:
  - 'Correct, idiomatic area-chart construction using MUI X LineChart with area: true
    and baseline: 0 rather than faking an area with a custom shape'
  - Custom SVG linear gradient fill (line-to-baseline fade) directly implements the
    spec's suggested "gradient fill from bottom to line for visual appeal"
  - ChartsReferenceLine average annotation adds a genuine focal point and light data
    storytelling beyond the raw trend
  - Deterministic seeded LCG data generation with realistic weekday/weekend seasonality
    and a gradual growth trend
  - 'Both renders are theme-correct: warm cream / near-black backgrounds, all chrome
    text legible, and the brand green (#009E73) is identical between light and dark'
  - Legend correctly omitted for the single-series chart per the style guide's redundant-legend
    rule
  - Y-axis uses a unit-labeled k-suffix valueFormatter instead of raw four-digit numbers
  weaknesses:
  - yAxis.tickFontSize is set to 40 purely as a hack to widen the auto-computed label
    offset (per the code's own comment referencing MUI X's internal labelRefPoint.x
    formula), while the actually rendered tick font comes from tickLabelStyle.fontSize=14
    — this relies on an undocumented internal layout formula instead of a supported
    margin/width API and is fragile to future MUI X changes; reserve the offset via
    an explicit margin.left value instead.
  - The gradient fill's top stop opacity (stopOpacity=0.55) exceeds the spec's suggested
    semi-transparent range of alpha 0.3-0.5 (Notes section) — bring the peak stop
    down into that band.
  - Beyond the gradient and the reference line, most chrome (grid, spines, margins)
    relies on MUI X defaults rather than deliberate refinement — a bit more intentional
    grid/spine treatment would raise the visual sophistication further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light-theme surface.
      Chrome: Title "Website Visitors · area-basic · javascript · muix · anyplot.ai" is bold dark ink, top-left, fully readable. Y-axis label "Daily Visitors" (rotated) and X-axis label "Date" are dark ink, clearly readable and similarly sized. Tick labels (0.0k-6.5k on Y, Jan 4-Mar 8 on X) are dark gray, legible. Horizontal gridlines are thin and subtle, not competing with the data.
      Data: Single series filled with a green gradient (opaque brand green near the line, fading to near-transparent near the baseline), 3px brand-green (#009E73) line on top. A dashed gray "Avg 5.0k" reference line with label sits near the right edge, legible against the cream background.
      Legibility verdict: PASS — no light-on-light issues anywhere.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark-theme surface.
      Chrome: Same title text now rendered in light/white ink, fully readable. Axis labels and tick labels are light gray / off-white, clearly legible against the dark background. Gridlines are subtle light lines, visible but not dominant.
      Data: Same brand-green (#009E73) line and gradient fill as the light render — data colors are identical between themes, only chrome flipped. The "Avg 5.0k" dashed reference line and label render in light gray/white, clearly visible — no dark-on-dark failures observed.
      Legibility verdict: PASS — all text and data elements are clearly distinguishable from the dark background.
