review:
  strengths:
  - 'Correct theme-adaptive chrome in both renders: warm off-white #FAF8F1 background
    with dark ink text in light mode, warm near-black #1A1A17 background with light
    text in dark mode, all axis labels/ticks/title clearly legible in both.'
  - 'Palette compliance is exact: first (and only) series uses Imprint brand green
    #009E73, identical between light and dark, with no drift into the default MUI
    X category palette.'
  - 'Deterministic, realistic data generation: seeded LCG (seed=42) produces 60 days
    of website visitor data with a believable weekday/weekend seasonality dip plus
    a gradual upward trend.'
  - 'Idiomatic MUI X usage: LineChart + area/baseline for the area-chart pattern,
    scaleType: "time" on the x-axis, tickNumber to prevent overcrowding, and a valueFormatter
    that renders y-ticks as "4.5k"-style shorthand.'
  - Canvas exactly matches the 3200x1800 landscape target with balanced margins; no
    clipping or overflow of title, axis labels, or tick labels in either render.
  - Semi-transparent fill (fillOpacity 0.4) matches the spec's suggested alpha range
    (0.3-0.5) and a subtle horizontal-only grid aids value estimation without competing
    with the data.
  weaknesses:
  - 'Design Excellence is at library-default level: a single flat-opacity fill and
    stroke with no additional polish (e.g. a subtle top-to-bottom gradient on the
    area fill, as the spec explicitly suggests considering ''for visual appeal'')
    — currently reads as a well-configured default rather than a publication-ready
    design.'
  - No visual hierarchy or storytelling device beyond the inherent trend line — nothing
    calls out the overall growth story (e.g. a subtle reference/average line, or emphasis
    on the final upswing) so the viewer has to find the insight unaided.
  - 'Library Mastery is generic: only the baseline area/line + time-axis feature set
    is used; no MUI X-distinctive touch (e.g. a highlighted band, custom mark, or
    reference line) that would be harder to replicate in another library.'
  - Title ('Website Visitors · area-basic · javascript · muix · anyplot.ai') renders
    comfortably small at roughly 38% of canvas width — well under the ~50-70% comfortable
    range for a custom-prefixed title; consider a slightly larger title fontsize (e.g.
    24-26px) to better anchor the chart.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Website Visitors · area-basic · javascript · muix · anyplot.ai" in bold dark ink top-left; x-axis labeled "Date" with date ticks (Jan 4 - Mar 8) rotated 0deg; y-axis labeled "Daily Visitors" with "0.0k"-"6.5k" ticks; subtle light-gray horizontal gridlines only. All text renders in dark ink and is clearly readable against the light background.
      Data: Single filled area series in Imprint brand green (#009E73), semi-transparent fill (~0.4 alpha) below a solid green line (stroke width 3, monotone curve) tracing daily visitor counts from ~4.1k up to ~6.5k with weekday/weekend seasonality sawtooth pattern.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels as the light render, all rendered in light/off-white ink, clearly legible against the dark background. Gridlines are subtle light-gray at low opacity, visible but not dominant. No dark-on-dark text found anywhere (title, ticks, axis labels all confirmed legible).
      Data: Same Imprint green (#009E73) fill and line, confirmed pixel-identical hue to the light render — only the chrome (background/text/grid) flips as expected.
      Legibility verdict: PASS
