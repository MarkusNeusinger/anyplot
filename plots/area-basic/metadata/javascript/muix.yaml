review:
  strengths:
  - 'Native MUI X area: LineChart series with area: true and baseline: 0, plus a value
    axis pinned at min: 0, so the fill height stays proportional to visitors in both
    themes'
  - 'curve: "monotoneX" smooths the top edge without overshooting any daily value,
    which keeps the single line honest to the data'
  - 'SVG <linearGradient> passed as a child of LineChart and wired via the v9 .MuiLineChart-area
    class: fill fades from 0.55 to 0.04 under a solid 3 px brand-green edge, and the
    horizontal gridlines stay visible through it in both themes'
  - 'Theme tokens drive all chrome (ink title, inkSoft ticks and axis lines, grid
    token); light and dark renders are both fully legible with identical #009E73 data
    colour'
  - Realistic 60-day visitor series with a weekday/weekend cycle and an upward trend,
    generated by a seeded LCG
  - 'Correct v9 API: skipAnimation, hideLegend for the single series, sized x/y axis
    bands (height 68, width 84) so no tick label is truncated; library-native tooltips
    in the HTML output'
  weaknesses:
  - 'Suggestion: the zero tick reads "0.0k" and round ticks carry a redundant ".0"
    ("4.0k"); a formatter printing "0", "4k", "4.5k" would read cleaner.'
  - 'Suggestion: a slightly lighter top stop (about 0.45 instead of 0.55) would sit
    inside the Notes'' 0.3–0.5 alpha range at the line edge too.'
  - 'Suggestion: the x domain starts on Jan 5 with the first tick on Jan 11; domainLimit:
    "nice" or a tick on the first day would anchor the start of the series.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the full 3200x1800 canvas, no white chart box.
      Chrome: left-aligned bold title "Website Visitors · area-basic · javascript · muix · anyplot.ai" in dark ink (~45% width); y-axis label "Daily Visitors" (rotated) and x-axis label "Date" in dark ink; y ticks 0.0k–6.5k every 0.5k and x ticks Jan 11 … Mar 1 weekly, in soft dark ink; subtle horizontal gridlines only; left and bottom axis lines. All readable.
      Data: single #009E73 line (3 px) joining 60 daily values with a monotone curve, weekly weekend dips and an upward trend from ~4.1k to ~6.4k; area filled to zero with a green gradient fading from mid-green under the line to near-transparent at the baseline; gridlines visible through the fill. No legend (single series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels in light ink, ticks in soft light grey; gridlines subtle dark grey and visible through the fill; no dark-on-dark text anywhere.
      Data: same #009E73 line and green gradient as the light render (fill reads as deep green over the dark surface) — data colours identical, only chrome flipped.
      Legibility verdict: PASS
