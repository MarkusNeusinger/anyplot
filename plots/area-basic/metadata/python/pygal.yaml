review:
  strengths:
  - 'Straight segments with fill=True and range=(0, max*1.1) give an honest area chart:
    top edge at the data values, fill from a true zero baseline'
  - Theme tokens threaded through pygal's Style, including guide_stroke_color, so
    the dashed y grid stays visible through the fill on both surfaces
  - Axis titles come from the column constants and carry units ('Visitors (per day)')
  - x_labels_major and value_formatter give clean 5-day ticks and thousands-separated
    values; tooltip_fancy_mode adds hover detail in the HTML
  weaknesses:
  - 'Suggestion: a slightly heavier top-edge stroke would separate the line from the
    fill a little more in the dark render.'
