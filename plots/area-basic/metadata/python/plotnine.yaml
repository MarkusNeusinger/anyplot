review:
  strengths:
  - Brand-green line over a 0.35-alpha fill with theme tokens threaded through all
    chrome
  - Descriptive axis titles with units
  - scale_x_datetime(date_labels='%b %d') gives clean weekly date ticks
  weaknesses:
  - 'SC-01, SC-02 (both): a blue LOWESS trend line, a ''Trend (LOWESS)'' label and
    ''Peak: 8,213'' / ''Maintenance: 3,242'' callouts are drawn on a -basic spec whose
    C4 bullet asks for a single filled series without trend lines or callouts → remove
    them. Likely cause: the geom_smooth(method=''lowess'') layer and the three annotate(''text'')
    calls.'
  - 'SC-03, SC-02 (both): the value axis and the fill floor start at about 3,000 instead
    of 0, so the fill height is not proportional to visitors (C2) → axis and fill
    from 0 (+3,000 down to 0). Likely cause: y_min floored from the data minimum,
    used as df[''y_floor''] and the scale_y_continuous lower limit.'
  - 'Suggestion: the italic subtitle could go along with the callouts it introduces.'
