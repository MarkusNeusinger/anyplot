review:
  strengths:
  - 'Clean basic area chart: geom_area at alpha 0.35 under a solid 1.0 geom_line in
    Imprint #009E73, with the value axis anchored at zero via data-derived limits
    (df max * 1.06), so fill height stays proportional to the value'
  - 'Theme tokens thread through every chrome element: warm #FAF8F1 / #1A1A17 pages,
    INK titles, INK_SOFT ticks, and an rgba INK-at-15% grid that stays visible through
    the fill in both renders'
  - 'Idiomatic lets-plot: scale_x_datetime(format=''%b %d'') for readable weekly date
    ticks and layer_tooltips().line() for a custom hover line in the HTML export'
  - 'Adaptable-code layout: column constants (DATE, VISITORS) drive aes() and axis
    titles, the data block is self-contained, and np.random.seed(42) makes it reproducible'
  - 'Realistic, neutral scenario: 30 days of website visitors with a weekly cycle
    and an upward trend, values 4,300 to 7,700 per day'
  weaknesses:
  - 'DE-02 (both): the panel is enclosed by all four spines; top and right borders
    are drawn although nothing in an area chart requires them → keep only the left
    and bottom axis lines (style guide ''Spines''). Likely cause: theme_minimal()
    plus axis_line=element_line(...) leaves a panel border; set panel_border=element_blank()
    and keep axis_line for the x and y axes only.'
  - 'Suggestion: tighten the x-axis expansion so the area ends closer to the right
    panel edge (scale_x_datetime(expand=[0, 0.5]) or similar).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: title "area-basic · python · letsplot · anyplot.ai" in dark INK at top-left, ~40% of width; y-axis title "Daily visitors", x-axis title "Date" in INK; tick labels (0 to 8,000 in 1,000 steps with separators; Jan 01, Jan 08, Jan 15, Jan 22, Jan 29) in INK_SOFT; subtle horizontal gridlines visible through the fill; the panel is enclosed by a four-sided dark border.
      Data: one #009E73 line joining 30 daily values (about 4,300 to 7,700) with a pale semi-transparent green fill down to the zero baseline at every x; no markers, no annotations, no legend (single series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title and axis titles in light #F0EFE8, tick labels in light grey #B8B7B0, all clearly readable; no dark-on-dark text; gridlines faint but visible through the fill; same four-sided border in a mid grey.
      Data: identical #009E73 line and same fill (alpha 0.35, reading as dark green on the dark page); brand green stays clearly visible.
      Legibility verdict: PASS
