review:
  strengths:
  - Per-cell text color computed from the fill's actual relative luminance keeps annotations
    legible across the entire diverging range in both themes.
  - 'Theme-adaptive diverging midpoint (MIDPOINT = PAGE_BG) correctly threads through
    both renders while data colors stay pixel-identical between themes (verified by
    sampling — diagonal cell is exactly RGB(68,103,163) / #4467A3 in both light and
    dark PNGs).'
  - Clean 2400x2400 square canvas suits the symmetric matrix layout; verified via
    edge crops that title, tick labels, and colorbar have generous margins with zero
    clipping on any edge in either theme.
  - Weather-variable correlation matrix is realistic, neutral, and plausibly distributed
    across the full [-1, 1] range with a proper cor() computation.
  - All spines and default grid removed for a minimal, focused presentation; DataAspect()
    keeps cells perfectly square.
  - Title format, colorbar labeling, and axis tick labels are exactly spec-compliant.
  weaknesses:
  - 'Diagonal de-emphasis does not render: the code sets display_matrix[i,i]=NaN and
    passes nan_color=NEUTRAL_FILL to heatmap!, but pixel-sampling the saved PNG shows
    the diagonal cells are solid RGB(68,103,163) — the exact #4467A3 blue endpoint
    of ANYPLOT_DIV, identical to a real value=1.0 cell, not the intended muted near-transparent
    fill. This is the same ''redundant diagonal dilutes hierarchy'' issue flagged
    in the attempt-1 review and remains completely unresolved visually, in both themes.
    The nan_color heatmap! keyword is not taking effect in this CairoMakie setup —
    replace it with an approach verified to change pixel output, e.g. draw an opaque
    poly!/Rect2f in NEUTRAL_FILL over each diagonal cell AFTER the heatmap! call,
    rather than relying on NaN + nan_color.'
  - 'The |r| >= 0.5 strong-correlation highlight (poly! outline with strokecolor=INK/strokewidth=2.5,
    plus bold text) does not render at all: cropping the Humidity x Visibility cell
    (value -0.60, which should trigger is_strong) shows zero visible border in either
    theme, and the annotation text weight is indistinguishable from ordinary cells.
    This is the same ''no visual hierarchy for strong correlations'' issue flagged
    in attempt-1 — unresolved. Debug why poly!(Rect2f(i-0.5, j-0.5, 1, 1); color=:transparent,
    strokecolor=INK, strokewidth=2.5) produces no visible stroke (check draw order
    / z-order relative to the heatmap and text, or that Rect2f from GeometryBasics
    isn''t being shadowed) — or replace it with a more reliably-rendered primitive
    such as lines! tracing the cell''s closed rectangle path.'
  - 'The subtle cell-boundary grid (hlines!/vlines! at INK_SOFT alpha=0.15) is imperceptible
    in the saved PNG: cropping adjacent near-zero-correlation cells in the Wind Speed
    row (-0.04 next to 0.01) shows no visible separator at all, and in the dark render
    these cells are nearly indistinguishable from both each other and the page background.
    This reproduces the exact ''near-zero cells blend into background, especially
    dark mode'' VQ-03 weakness from attempt-1. 15% alpha is too subtle for a line
    sitting between two similarly-toned heatmap fills (as opposed to a line against
    a plain background) — raise the alpha to ~0.3-0.4 or increase linewidth, or check
    whether heatmap! itself supports a strokewidth/strokecolor kwarg for per-cell
    borders as a more robust alternative to a separate hlines!/vlines! overlay.'
  - Because all three targeted fixes from the attempt-1 review are visually non-functional,
    the rendered plot is pixel-for-pixel unchanged in intent from attempt 1 despite
    added code complexity — the extra NaN-masking, poly! stroke loop, and grid overlay
    logic currently cost lines of code without any corresponding visual benefit.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — confirmed via pixel sampling (250,248,241 in the margins).
      Chrome: Title "heatmap-annotated · julia · makie · anyplot.ai" in bold dark ink, centered at top, comfortably clear of the top edge (crop-verified, no clipping). X-axis tick labels (8 weather variables) rotated 45°, fully visible above the bottom canvas edge with generous margin. Y-axis tick labels horizontal on the left, fully visible with margin. Colorbar on the right labeled "Correlation" with ticks -1.0 to 1.0, fully visible, no clipping at the right edge. All chrome text is dark ink/soft-ink against the light background — clearly readable, no light-on-light issues.
      Data: 8x8 correlation matrix filled with the Imprint diverging colormap (matte-red -> cream midpoint -> blue), annotated with 2-decimal values. First categorical/continuous mapping correctly uses imprint_div (#AE3030 <-> #4467A3). BUG: diagonal cells (self-correlation = 1.00) render as solid full-intensity blue RGB(68,103,163), pixel-identical to the colormap's +1.0 endpoint — the intended NaN + nan_color muted-fill masking does not take visible effect. BUG: cells with |r| >= 0.5 (e.g. Humidity x Visibility = -0.60) show no stroke outline and no bold-text distinction despite the code attempting both. BUG: the subtle inter-cell grid lines are imperceptible — adjacent near-zero cells (e.g. -0.04 and 0.01 in the Wind Speed row) have no visible separator.
      Legibility verdict: PASS (all text readable) but with unresolved visual-hierarchy defects noted above.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — confirmed via pixel sampling.
      Chrome: Same title/tick-label/colorbar layout, chrome flipped to light ink (#F0EFE8 / #B8B7B0), clearly legible against the dark background with generous margins on all four edges (crop-verified, no clipping). No dark-on-dark failures.
      Data: Data colors are pixel-identical to the light render (diagonal cell sampled at the exact same RGB(68,103,163) in both themes, confirming only chrome flips as required). Same three bugs as the light render: diagonal still solid blue instead of muted fill, no outline/bold on strong (|r|>=0.5) cells, and near-zero cells (e.g. -0.04 / 0.01) are now nearly indistinguishable from both each other and the near-black page background since the intended separator grid does not render.
      Legibility verdict: PASS (text itself readable) but the near-zero-correlation cell separation defect is more severe here than in light mode due to lower background contrast.
