review:
  strengths:
  - Per-cell text color is computed from the fill's actual relative luminance rather
    than a fixed threshold, keeping annotations legible across the entire diverging
    range in both themes
  - Theme-adaptive diverging midpoint (MIDPOINT = PAGE_BG) correctly threads through
    both renders while keeping data colors identical between themes
  - Clean 2400x2400 square canvas matches the symmetric-plot guidance for heatmaps
    -- no clipping or overflow on either render
  - Weather-variable correlation matrix is realistic, neutral, and plausibly distributed
    across the full [-1, 1] range
  - All spines/grid removed for a minimal, focused presentation; DataAspect() keeps
    cells perfectly square
  weaknesses:
  - Near-zero-correlation cells blend visually with the page background (especially
    in dark mode) because the diverging colormap's midpoint equals the theme background
    -- consider a thin, subtle cell stroke (e.g. INK_SOFT at ~15% alpha) so weak-correlation
    cells stay visually separated from the canvas
  - The redundant diagonal (self-correlation = 1.00) dilutes the visual hierarchy
    -- consider masking the diagonal or using a neutral/muted fill for i == j cells
    to sharpen focus on the genuinely informative off-diagonal relationships
  - No visual emphasis (outline, bold text, subtle highlight) calls out the strongest
    relationships (|r| >= 0.5) -- every cell currently competes equally for attention
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "heatmap-annotated · julia · makie · anyplot.ai" in bold dark ink, centered, ~55% of plot width. X-tick labels rotated 45 degrees, y-tick labels horizontal, both in soft-ink gray. Colorbar on the right labeled "Correlation" with ticks -1.0 to 1.0. All chrome fully readable against the light background.
      Data: 8x8 correlation matrix, Imprint diverging colormap (matte-red #AE3030 -> cream midpoint -> blue #4467A3). Each cell annotated with a 2-decimal value; annotation text color switches between dark ink and light cream based on the cell fill's computed luminance, so contrast holds across the whole range. Diagonal reads 1.00 in solid blue.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title and tick labels, chrome flipped to light ink (#F0EFE8 primary / #B8B7B0 secondary) -- fully legible against the dark background, no dark-on-dark failures found (verified via direct top/bottom edge crops).
      Data: Confirmed pixel-identical data colors to the light render (e.g. Humidity/Visibility cell -0.60 is the same deep red, Wind Speed diagonal is the same blue 1.00) -- only chrome changed between themes. One soft note: near-zero-correlation cells (e.g. Wind Speed row) are close in color to the dark page background since the diverging colormap's midpoint is theme-adaptive to match it, making cell boundaries faint there -- but annotation text remains legible throughout.
      Legibility verdict: PASS
