review:
  strengths:
  - Per-cell text contrast is computed from the actual rendered colormap luminance
    (im.cmap(im.norm(value))) rather than a fixed value threshold — this stays correct
    across the entire imprint_div range and adapts automatically per theme, since
    the diverging colormap's midpoint is set to PAGE_BG.
  - 'Magnitude-driven visual hierarchy: bold weight for |r| >= 0.5 and font size scaling
    (9 + 3*|value|) draw the eye to the strongest correlations (Salinity-Pressure
    0.81, Density-Conductivity 0.77) without any extra annotation clutter — genuine
    data storytelling.'
  - Correct choice of imprint_div (diverging) colormap for signed correlation data,
    matching both the spec's explicit recommendation and the library rules; theme-adaptive
    midpoint keeps light/dark chrome correct while the data-driving colors stay identical.
  - Square 2400x2400 canvas is the right call for a symmetric correlation matrix per
    the library's canvas rules, and passes the canvas dimension gate cleanly.
  - Realistic, neutral domain data (laboratory measurement correlations) with hand-tuned
    realistic correlations (Temperature-pH, Density-Conductivity, Salinity-Pressure,
    etc.) rather than pure random noise, giving the matrix genuine visual patterns
    to discover.
  - 'Clean KISS structure: single flat script, np.random.seed(42) for reproducibility,
    only used imports, correct axes-method API (ax.imshow, ax.text) and correct savefig
    call with no bbox_inches=''tight''.'
  weaknesses:
  - Cell border spines are left at matplotlib defaults (full black/ink frame) rather
    than being intentionally restyled — a subtle INK_SOFT-colored or removed outer
    frame would read as slightly more refined against the theme-adaptive chrome elsewhere
    in the plot.
  - No explicit visual callout (e.g., a subtle box or outline) on the single strongest
    correlation (Salinity-Pressure, 0.81) beyond bold/size scaling shared by all |r|>=0.5
    cells — an optional stronger single focal point could push data storytelling further.
  - Colorbar tick labels at 8pt are on the small side; still legible at 2400px but
    worth checking they hold up when the image is scaled down to ~400px for mobile/thumbnail
    views.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-annotated · python · matplotlib · anyplot.ai" centered at top in dark ink, clearly legible. X-axis label "Laboratory Measurements" below the rotated (45°) tick labels (Temperature, pH, Viscosity, Density, Turbidity, Conductivity, Salinity, Pressure), y-axis label "Laboratory Measurements" rotated 90° on the left with matching row tick labels. Colorbar on the right titled "Correlation Coefficient" with ticks from -1.00 to 1.00. All chrome text renders in dark ink/soft-ink tones, clearly readable against the light background.
      Data: 8x8 symmetric correlation matrix using the imprint_div diverging colormap — red for negative correlations, warm off-white near zero, blue for positive correlations, matching the spec's "diverging colormap for +/- data" recommendation. Each cell has a numeric value to 2 decimal places; text color is computed per-cell from the actual rendered luminance so it's always dark on light cells and light on dark/saturated cells. Diagonal cells (all 1.00) are solid blue with bold white text. Values with |r| >= 0.5 render in bold, slightly larger font, creating a clear visual hierarchy toward the strongest relationships (e.g., Salinity-Pressure 0.81, Density-Conductivity 0.77, Turbidity-Conductivity -0.62).
      Legibility verdict: PASS — no title/axis/tick/cell text is unreadable; no light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels as the light render, now rendered in light ink (#F0EFE8 / #B8B7B0 tones) against the dark background — all clearly legible, including the rotated x tick labels and the colorbar's white-on-transparent style ticks.
      Data: The imprint_div colormap's midpoint shifts to the dark background color, so near-zero cells (e.g., -0.04, 0.08, 0.13) render as very dark maroon/navy tones nearly blending into the background chrome, while stronger correlations (0.77, -0.68, 0.81) remain vivid red/blue — confirmed identical to the light render's data hues (only the chrome and near-zero midpoint shifted, as expected). Per-cell text color again adapts to the rendered luminance: cells near the dark midpoint get the fixed light "CELL_LIGHT_TEXT" color rather than the theme's INK, so no dark-on-dark failures occur even for the darkest, near-zero cells.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures; every cell's numeric label remains legible against its own background color.
