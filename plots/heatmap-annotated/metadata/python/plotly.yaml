review:
  strengths:
  - Contrast-aware per-cell annotation coloring (LIGHT_TEXT vs INK, switched at |value|
    > 0.5) keeps every value label legible against the diverging colormap in both
    themes.
  - Correlation matrix is derived from physically-motivated synthetic weather relationships
    (temperature -> humidity/pressure/cloud cover -> precipitation/visibility) rather
    than a generic random block-correlated matrix, giving factually plausible signs
    and magnitudes.
  - Theme-adaptive imprint_div diverging colorscale correctly uses each theme's own
    page background as the midpoint stop, matching prompts/library/plotly.md exactly.
  - Clean, idiomatic go.Heatmap + add_annotation construction (deliberately avoiding
    figure_factory) that keeps full control over colorbar styling, hovertemplate,
    and the square aspect via scaleanchor.
  - Correct square 2400x2400 canvas choice for a symmetric 8x8 matrix, with balanced
    margins and no edge clipping in either render.
  weaknesses:
  - 'No explicit visual focal point: the strongest correlations (e.g. Cloud Cover
    vs Visibility -0.59, Temperature vs Humidity -0.55) are only discoverable by scanning
    the grid. Consider a subtle emphasis (outline/border on the top |correlation|
    off-diagonal cell(s), or a one-line subtitle calling out the strongest relationship)
    to add a clear focal point.'
  - Both axis titles read 'Metric' on x and y, which is generic and somewhat redundant
    since the tick labels already name each metric explicitly; consider a more specific
    label or omitting the axis titles to reclaim vertical space.
  - Library Mastery is only 'correct usage' level (go.Heatmap + add_annotation loop)
    — consider a more plotly-distinctive touch, e.g. hierarchical-clustering reordering
    of rows/columns to group correlated metrics, to push past generic annotated-heatmap
    territory.
  - The gap between the title and the top of the heatmap (~8% of canvas height) is
    slightly loose relative to the otherwise tight composition; tightening the top
    margin a bit would read as more deliberate/polished.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Weather Metrics Correlation · heatmap-annotated · python · plotly · anyplot.ai" in dark ink, fully visible, no clipping. Y-axis metric labels (Temperature, Humidity, Wind Speed, Precipitation, Pressure, UV Index, Cloud Cover, Visibility) horizontal and readable. X-axis metric labels rotated 45°, readable, no overlap with each other or the grid. "Metric" axis titles on both axes, dark ink, legible. Colorbar on the right titled "Correlation" with ticks 1, 0.5, 0, -0.5, -1, all legible.
      Data: 8x8 correlation matrix rendered with the imprint_div diverging colorscale (matte red for negative, near-background near zero, blue for positive). Diagonal cells are 1.00 (saturated blue). Each cell has a numeric value (2 decimals) whose text color switches between near-white (saturated cells) and dark ink (near-neutral cells) for contrast — all 64 values are legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title in light cream text, fully visible. Y-axis and X-axis metric labels in light gray, readable against the dark background — no dark-on-dark failures observed. Colorbar title/ticks in light text, legible. Axis line/spine in soft light gray.
      Data: Same 8x8 correlation values as the light render, same imprint_div scale (red negative / blue positive), confirming the data colors are identical between themes — only chrome (background, text) flips. Near-zero cells blend toward the dark page background (correct theme-adaptive midpoint) and their value labels switch to light text, remaining legible; saturated red/blue cells also use light text and are legible.
      Legibility verdict: PASS
