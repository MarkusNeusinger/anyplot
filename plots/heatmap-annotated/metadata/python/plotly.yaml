review:
  strengths:
  - 'Explicit visual focal point: the strongest off-diagonal correlation cell (Cloud
    Cover vs Visibility, r = -0.59) is outlined and named in a subtitle, directly
    resolving the attempt-1 ''no storytelling focal point'' weakness.'
  - Hierarchical-clustering reorder (scipy average-linkage on 1 - correlation) groups
    metrics with similar correlation profiles into adjacent blocks, giving the matrix
    a genuinely plotly/scipy-distinctive technique that resolves the attempt-1 Library
    Mastery weakness.
  - Generic 'Metric' x/y axis titles were removed, relying cleanly on the tick labels
    themselves - resolves the attempt-1 VQ-06/DE-02 redundancy weakness without losing
    information.
  - Top margin tightened (t=95) with the added subtitle still fitting snugly above
    the matrix, producing a more deliberate, less loose composition than attempt 1.
  - Contrast-aware per-cell text coloring (near-white above |r|>0.5, ink otherwise)
    is retained and keeps all 64 value labels legible in both themes; theme-adaptive
    imprint_div colorscale with theme-matched midpoint stop is implemented exactly
    per the style guide.
  - Correlation data is derived from physically-motivated synthetic weather relationships
    (not a generic random block-correlated matrix), giving factually plausible signs
    and magnitudes.
  weaknesses:
  - DE-01 still reads as a well-executed but fairly standard annotated-heatmap layout
    overall; pushing further into publication-tier polish (e.g. a more distinctive
    typographic treatment for the subtitle/colorbar title) would help close the gap
    to a 'could appear in Nature/Science' composition.
  - The distinctive technique added (hierarchical clustering) comes from scipy rather
    than a plotly-native capability; a plotly-specific interactive touch in the HTML
    output (e.g. custom hover formatting beyond the current template, or a range-selector)
    would strengthen Library Mastery further.
  - Per-cell annotation font (13pt) is on the smaller side relative to the generous
    2400x2400 canvas headroom; a slightly larger size would improve legibility when
    the image is scaled down to mobile widths.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white, not dark.
      Chrome: Title "Weather Metrics Correlation · heatmap-annotated · python · plotly · anyplot.ai" in dark ink, fully visible with no clipping. Subtitle "Strongest relationship: Cloud Cover vs Visibility (strongest negative, r = -0.59)" in soft dark-grey ink beneath it. Y-axis metric labels (Pressure, Humidity, Precipitation, Cloud Cover, Wind Speed, Visibility, Temperature, UV Index - now clustering-reordered) are horizontal and readable; X-axis labels are the same set rotated 45° with no overlap. No generic axis titles are present (removed from attempt 1), which is intentional and appropriate since tick labels already name each metric. Colorbar on the right titled "Correlation" with ticks 1/0.5/0/-0.5/-1, fully legible.
      Data: 8x8 correlation matrix uses the Imprint diverging colorscale (matte red #AE3030 for negative, page-background midpoint at zero, blue #4467A3 for positive), diagonal cells at 1.00 in saturated blue. Each cell carries a 2-decimal numeric label whose text color switches between near-white and dark ink depending on cell saturation - all 64 values legible. The strongest off-diagonal cell (Cloud Cover vs Visibility, -0.59) is outlined with a bold dark rectangle and its value is bolded.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title and subtitle render in light cream/soft-grey text, fully legible against the dark surface - no dark-on-dark failures observed anywhere (title, tick labels, colorbar all clearly readable). The focal-point outline switches to a light stroke color, remaining clearly visible against the dark cell fills.
      Data: Correlation values and colorscale are pixel-identical in hue to the light render (same reds/blues, same magnitudes, same clustering order) - only the chrome (background, text, outline stroke) flips, confirming theme-adaptive tokens are threaded through correctly. Near-zero cells blend toward the dark page background (correct theme-adaptive midpoint for imprint_div) and their labels switch to light ink, remaining legible.
      Legibility verdict: PASS
