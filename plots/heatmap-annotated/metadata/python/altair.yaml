review:
  strengths:
  - Diverging colormap midpoint uses the theme's own page background (PAGE_BG), exactly
    matching the imprint_div style guide spec and making near-zero correlations recede
    naturally on both themes.
  - Conditional per-cell text color (alt.condition) keeps every annotation readable
    regardless of underlying cell color, in both light and dark renders.
  - Canvas lands exactly on the 2400x2400 target with no cropping, and the correlation
    data is internally consistent (symmetric matrix, sensible magnitudes).
  weaknesses:
  - Design styling stays close to Altair defaults beyond the midpoint-background trick
    -- consider a more deliberate visual hierarchy to lift Design Excellence.
  - Tick label fontsize (10) is workable but modest for a 7x7 grid; consider nudging
    it up slightly to strengthen mobile-width legibility.
  - The x/y axis titles are identical ("Business Metrics") -- accurate for a symmetric
    matrix, but a small distinguishing note could sharpen clarity (minor/optional).
  image_description: |-
