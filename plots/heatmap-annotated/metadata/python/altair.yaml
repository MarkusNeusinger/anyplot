      Data: Cell colors identical to light render (matte-red, blue, and gradient steps match); only the diverging midpoint itself shifts to near-black per the theme-adaptive imprint_div design. Cell text remains readable: white on strong cells, light ink-soft gray on near-background (low-correlation) cells.
      Legibility verdict: PASS
