review:
  strengths:
  - Diverging colormap correctly implements imprint_div with a theme-adaptive midpoint
    (PAGE_BG), matching the style guide's continuous-data rule exactly
  - Text annotation color is conditional on |correlation| > 0.5 (white vs. INK_SOFT),
    keeping every label readable across the full red-to-blue range in both themes
  - Annotation font size scales with |correlation| via alt.Size, creating a clear
    visual hierarchy that draws the eye to the strongest relationships first
  - Square canvas is the right call for a symmetric grid-based plot; padding logic
    lands exactly on 2400x2400 with no clipping or overflow in either render
  - Rotated -45deg x-axis tick labels avoid overlap while keeping labels legible;
    axis label typography is balanced between x and y
  - Realistic, plausible correlation structure between named business metrics (Revenue/Marketing/R&D/Support/Profit/Growth/Efficiency)
    via seeded synthetic data
  weaknesses:
  - The identity diagonal (always 1.00) gets no distinct visual treatment beyond its
    color — a subtle outline or corner marker would make the diagonal instantly recognizable
    and sharpen the data-storytelling read
  - Legend/colorbar mastery is solid but generic to Altair's default Legend API; no
    distinctive library-specific feature (e.g. interactive selection/highlight wired
    into the HTML export) is used to push Library Mastery further
  - Right-hand whitespace next to the legend on the square canvas is a little generous;
    tightening legend placement or padding would let the matrix itself claim slightly
    more of the canvas
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the light-theme page surface — not pure white.
      Chrome: Title "heatmap-annotated · python · altair · anyplot.ai" is bold dark ink, centered, fully visible with no clipping. Both axis titles ("Business Metrics") are dark and legible; x-axis tick labels are rotated -45deg and don't overlap each other or the axis title; y-axis tick labels are horizontal and clearly readable. The "Correlation" legend title and its 1.0/0.5/0.0/-0.5/-1.0 tick labels sit inside an elevated cream box with a soft ink border, fully legible.
      Data: 7x7 correlation matrix rendered as mark_rect cells with a red (#AE3030) <-> cream midpoint <-> blue (#4467A3) diverging scale (imprint_div). Numeric values are overlaid via bold mark_text, with font size scaling by |correlation| so strong relationships (e.g. Revenue/Profit = 0.95) read larger than near-zero ones (e.g. Efficiency/Support = -0.01). Text color flips to white on strongly saturated cells (|r| > 0.5) and to soft ink on weak/near-white cells — no low-contrast pairing observed anywhere in the grid.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the dark-theme page surface — not pure black.
      Chrome: Title, axis titles, and tick labels all render in light ink (#F0EFE8 / #B8B7B0) and are clearly visible against the dark background — no dark-on-dark occurrences. The legend box uses the dark elevated fill (#242420) with a light border and light text, fully legible.
      Data: Same red-to-blue diverging scale and cell positions as the light render; the interpolated midpoint hue differs from light (since the diverging scale's midpoint is intentionally theme-adaptive — #1A1A17 on dark vs #FAF8F1 on light, per the style guide's continuous-data rule), but the two saturated end colors (#AE3030 red, #4467A3 blue) match exactly between renders. Near-zero cells (e.g. the Efficiency row) sit very close to the page background but the muted-ink text overlaid on them (e.g. "-0.01", "0.05") remains legible at close inspection — verified via pixel crop, no dark-on-dark text failure.
      Legibility verdict: PASS
