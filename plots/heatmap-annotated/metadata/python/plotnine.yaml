review:
  strengths:
  - 'Diverging colormap exactly matches the Imprint imprint_div spec (#AE3030 -> theme-adaptive
    midpoint -> #4467A3), with the midpoint correctly swapped per theme (#FAF8F1 light
    / #1A1A17 dark)'
  - Per-cell text color adapts to its own tile via a computed text_color column +
    scale_color_identity() (|value| > 0.5 -> light text, else INK) — a genuinely distinctive
    plotnine technique for solving the classic annotated-heatmap contrast problem
  - coord_fixed(ratio=1) keeps every tile square regardless of the 8x8 grid, matching
    the 2400x2400 canvas exactly
  - Zero clipping at any canvas edge (title, both axis label sets, rotated tick labels,
    and the colorbar were all verified fully visible with no chopped pixels)
  - 'Clean minimal theme: grid, panel border, and axis ticks all removed; tile borders
    painted in PAGE_BG create a subtle separating grid without extra gridline elements'
  - 'Both renders confirmed theme-correct: identical data colors between light/dark,
    only chrome (background, ink, grid) flips'
  - Realistic, neutral correlation-matrix dataset (8 economic indicators) built via
    a proper symmetric correlation construction (A·Aᵀ normalized, forced symmetric,
    unit diagonal) with a fixed seed
  weaknesses:
  - Design Excellence is competent but not exceptional beyond the contrast-text trick
    — no additional storytelling device (e.g. subtle callout/annotation on the strongest
    correlation pair, or reordering variables by cluster) to give the viewer an explicit
    focal point beyond the self-evident diagonal
  - Library Mastery is solid and idiomatic (geom_tile + geom_text + scale_fill_gradient2
    + coord_fixed) but doesn't reach for a second distinctive plotnine feature beyond
    the contrast-text pattern (e.g. facet_wrap for a small-multiples angle, or a custom
    legend/guide tweak) to push it further above generic usage
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-annotated · python · plotnine · anyplot.ai" centered at top in dark ink, ~67% of plot width, fully visible with no clipping. Both axis titles ("Economic Indicator") in dark ink. X-axis tick labels (8 indicator names) rotated 45° with right alignment, fully visible above the bottom canvas edge. Y-axis tick labels horizontal, fully visible left of the left canvas edge. Colorbar titled "Correlation" sits at the right with 1.0/0.5/0.0/-0.5/-1.0 tick labels, fully within the canvas.
      Data: 8x8 tile grid using the Imprint diverging scale (#AE3030 red -> near-neutral -> #4467A3 blue), diagonal cells are solid dark blue (1.00, self-correlation). Each cell is annotated with its correlation value to 2 decimals; text is light/white on saturated (|r|>0.5) cells and dark ink on near-neutral cells — all values read clearly against their own cell.
      Legibility verdict: PASS — title, both axis titles, both sets of tick labels, colorbar labels, and every one of the 64 cell annotations are readable against their local background; no light-on-light instances found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/soft-gray, clearly legible against the dark background. Colorbar and its tick labels also flip to light-on-dark and remain fully legible.
      Data: Identical tile colors to the light render — same #AE3030/#4467A3 diverging scale and identical correlation values per cell, confirming only chrome (not data color) changed between themes. Near-zero-correlation cells blend closer to the dark background by design (their fill approaches the theme's own PAGE_BG midpoint), which is an intentional and correct diverging-scale behavior, not a rendering bug.
      Legibility verdict: PASS — no dark-on-dark instances; text color logic (text_color column driven by |value| > 0.5) correctly keeps light text on saturated cells and ink-toned text on near-neutral cells in both themes.
