review:
  strengths:
  - Correct diverging Imprint colormap (imprint_div) chosen appropriately for signed
    correlation data, with the midpoint set to the theme background so zero-correlation
    cells read as neutral in both renders
  - Automatic contrast-aware annotation text (black/white per cell) keeps every correlation
    value legible against both light and dark cell backgrounds
  - Canvas confirmed exactly 2400×2400 px, matching the square format recommended
    for symmetric matrix plots
  - Theme-adaptive chrome fully threaded through title, axis labels, tick labels,
    spines, and colorbar — no dark-on-dark or light-on-light failures in either render
  - 'Clean idiomatic seaborn code: single sns.heatmap() call, reproducible via np.random.seed(42),
    no unused imports, no fake interactivity'
  - Enclosed four-spine grid is a deliberate, spec-sanctioned style exception for
    heatmaps, executed with thin theme-matched edge color and width
  weaknesses:
  - Annotation font (11pt bold) is only modestly sized for a 7x7 matrix — bump to
    ~12-13pt for extra headroom at ~400px mobile scale
  - Data storytelling is minimal — color + number encoding only, with no emphasis
    (e.g. highlighting the strongest correlations) to sharpen the narrative
  - Doesn't use the common seaborn corr-heatmap idiom of masking the redundant symmetric
    half (np.triu mask) to reduce visual repetition — not spec-required, but would
    read as more distinctive
  - X-axis and Y-axis labels are both literally 'Asset Class' — correct but generic
    for a self-correlation matrix; consider omitting one for a cleaner look
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) plot background, confirmed correct — not pure white.
      Chrome: Bold black title "heatmap-annotated · seaborn · anyplot.ai" centered above the matrix. Axis labels "Asset Class" on both X and Y in dark ink. X-axis tick labels (asset names) rotated 45°, right-aligned; Y-axis tick labels horizontal. Colorbar on the right labeled "Correlation" with ticks -1.0 to 1.0, secondary tick color slightly softer gray. All spines visible (enclosed 4-sided grid), thin and theme-matched. Grid separator lines between cells match the page background.
      Data: 7x7 symmetric correlation matrix (Stocks, Bonds, Gold, Real Estate, Crypto, Commodities, Cash). Cells colored via the Imprint diverging colormap (matte red -> cream midpoint -> blue), diagonal cells = 1.00 in deep blue. Each cell annotated with a 2-decimal correlation value; text color automatically flips between black and white per cell for contrast (e.g. white "0.65" on medium blue, black "0.10" on near-neutral cell).
      Legibility verdict: PASS — all title, axis, tick, and annotation text is clearly readable against the light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) plot background, confirmed correct — not pure black.
      Chrome: Same title now in light/white text, axis labels in light ink, tick labels in softer light gray. Colorbar retains the "Correlation" label and same -1.0 to 1.0 ticks, now light-colored. Spines and grid lines rendered in the same theme-adaptive soft tone as the light render's equivalents, just inverted for the dark surface.
      Data: Identical data colors and layout to the light render — the diverging colormap's red/blue endpoints (#AE3030 / #4467A3) are unchanged; only the midpoint shifted to match the dark background, exactly as intended for a theme-adaptive diverging scale. Annotation text again auto-contrasts per cell (white numerals on darker/near-background cells, black numerals on lighter blue cells), with no dark-on-dark failures spotted — even the near-zero-correlation cells (whose color is closest to the background) keep clearly legible white text.
      Legibility verdict: PASS — all title, axis, tick, and annotation text is clearly readable against the dark background; no dark-on-dark failures found.
