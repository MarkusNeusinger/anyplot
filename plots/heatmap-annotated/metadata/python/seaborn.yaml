review:
  strengths:
  - Seaborn's native per-cell contrast handling makes every annotation readable regardless
    of background luminance in both themes
  - 'Correct theme-adaptive Imprint diverging colormap (imprint_div: matte-red ↔ theme
    midpoint ↔ blue) appropriately chosen for signed correlation data'
  - 'Thoughtful data storytelling: a bordered rectangle highlights the strongest off-diagonal
    correlation (Stocks-Crypto, 0.65), giving the plot a clear focal point without
    faking interactivity'
  - Enclosed four-spine heatmap grid is the correct style-guide exception, styled
    thin and theme-adaptive, with subtle background-colored cell gridlines that keep
    the grid unobtrusive
  - Realistic, neutral financial correlation dataset (7 asset classes) with plausible
    directional relationships (e.g., Stocks-Bonds negative, Bonds-Cash positive)
  weaknesses:
  - Title omits the mandated language segment — currently 'heatmap-annotated · seaborn
    · anyplot.ai', should be 'heatmap-annotated · python · seaborn · anyplot.ai' per
    the SC-04 title format
  - No y-axis label is set (only ax.set_xlabel('Asset Class') is called) — the y-axis
    carries no label, creating an axis-label imbalance
  - Data doesn't exercise the full negative range of the diverging colormap — the
    weakest correlation is only -0.25 on a [-1, 1] scale, so the red end of imprint_div
    stays pale in both renders; a moderately-strong negative correlation (e.g., -0.5
    to -0.7) would better demonstrate the diverging encoding
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white matching #FAF8F1, not pure white.
      Chrome: Bold dark-ink title "heatmap-annotated · seaborn · anyplot.ai" at top (missing the "python" language segment). X-axis label "Asset Class" at bottom in dark ink; rotated 45° tick labels (Stocks, Bonds, Gold, Real Estate, Crypto, Commodities, Cash) on both axes in soft grey ink. Colorbar on the right labeled "Correlation" with ticks -1 to 1, thin theme-adaptive outline. All chrome clearly readable against the light background.
      Data: 7x7 correlation matrix. Diagonal cells (1.00) render in the strongest blue; off-diagonal cells range from pale red (weak negative, e.g. -0.25) through near-background (near zero) to strong blue (strong positive, e.g. 0.65). Each cell has a bold numeric annotation whose text color automatically switches between black and white for contrast against its own cell's background. The strongest off-diagonal correlation (Stocks-Crypto, 0.65) is boxed with a black-edged highlight rectangle.
      Legibility verdict: PASS — no light-on-light or unreadable text observed.

    Dark render (plot-dark.png):
      Background: Warm near-black matching #1A1A17, not pure black.
      Chrome: Same title and axis label, now rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary for ticks). Colorbar label and ticks legible in light grey against the dark background. The highlight rectangle's edge color switches to the light-ink token, remaining visible against the dark cell fills.
      Data: Identical cell colors and values to the light render — diagonal blue at 1.00, same red/blue diverging spread for off-diagonal correlations, same per-cell auto-contrast annotation text (white on darker cells, near-black on lighter cells). Confirms the diverging colormap's data-color anchors are unchanged between themes; only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, and colorbar text remain clearly visible against the near-black surface.
