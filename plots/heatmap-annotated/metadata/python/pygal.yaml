review:
  strengths:
  - Text color switches with each cell's luminance (dark on pale cells, light on deep
    ones), so every value stays legible at both ends of the ramp in both themes
  - imprint_div fields ramp centered on 0 with the theme's page color as midpoint,
    so near-zero correlations read as page and the sign stands out
  - Rounded tiles with page-colored gaps and no axis chrome give a clean, tiled matrix
  - 'Native SVG output: the HTML file carries the same vector chart as the PNG'
  weaknesses:
  - 'CQ-01 (code): line 70 `class AnnotatedHeatmap(Graph)` holds the whole drawing
    (cells, labels and colorbar in `_plot`), so the file cannot be read top to bottom
    and the agent chat''s validator refuses it → no class: build the cells, labels
    and colorbar at the top level and splice them into the rendered chart''s SVG.
    Likely cause: the Graph subclass used to reach pygal''s `_plot` hook.'
  - 'SC-03 (both): the colorbar is labelled only at the data''s min, midpoint and
    max (-0.18, 0.41, 1.00), not at round values, so a value cannot be read off a
    color and the diverging midpoint 0 carries no tick → round ticks across the bar
    (for example -0.25, 0.00, 0.25, 0.50, 0.75, 1.00, about +3 ticks). Likely cause:
    the colorbar tick loop over (max_val, (min_val + max_val) / 2, min_val) at lines
    185-193.'
  - 'Suggestion: tighten the gap between the title and the top row so the grid gains
    height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: title 'heatmap-annotated · python · pygal · anyplot.ai' in dark ink at the top; bold dark row labels on the left, bold column labels rotated 45 degrees below the grid; colorbar on the right titled 'Correlation' with ticks 1.00 / 0.41 / -0.18. All readable.
      Data: 6x6 correlation matrix as rounded tiles with page-colored gaps, the grid starting about 150 px below the title; imprint_div fields ramp, deep blue #4467A3 on the diagonal, pale blue for weak positives, pale red-tinted page tone for the negatives -0.18 and -0.12. Values printed bold with 2 decimals: light text on deep blue cells, dark text on pale cells. No categorical series.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, row/column labels, colorbar title and ticks in light ink #F0EFE8; no dark-on-dark text.
      Data: same layout; ramp with the dark page as midpoint, so weak correlations recede into dark slate and negatives into dark maroon, the diagonal stays #4467A3. All values in light text and legible on every cell.
      Legibility verdict: PASS
