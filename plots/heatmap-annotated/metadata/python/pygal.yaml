  strengths:
  - Correct imprint_div fields ramp (red / page-colored midpoint / blue) centered
    on zero over the full -1..1 correlation domain, via the library prompt's ramp_color
    helper
  - 'Per-cell text switches between #1A1A17 and #FAF8F1 by the fill''s brightness,
    so every value stays legible on pale and saturated cells in both themes'
  - Rounded tiles with page-colored gaps and no axis chrome give a clean, tiled matrix
