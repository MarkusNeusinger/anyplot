    own square table (passes the adaptability check)
  - Drawing through pygal's svg.node API keeps the output native SVG in the HTML view
  weaknesses:
  - 'CQ-01 (code): line 70 `class AnnotatedHeatmap(Graph)` holds the whole drawing
    — cells, labels and colorbar in `_plot` — so the file cannot be read top to bottom
    and the agent chat''s validator refuses it → no class: draw the cells, labels
    and colorbar at the top level (for example build the SVG elements at the top level
    and add them to the rendered chart''s SVG tree). Likely cause: the Graph subclass
    pattern used to reach pygal''s `_plot` hook.'
  - 'Suggestion: tighten the ~150 px gap between the title and the top row so the
    grid gains height.'
  - 'Suggestion: round colorbar ticks (0.00, 0.50, 1.00) would read more easily than
    the min/mid/max values -0.18 / 0.41 / 1.00.'
