review:
  strengths:
  - Correct annotated-heatmap plot type with automatic contrast-aware text color (white/dark)
    per cell, matching the spec's readability requirement
  - Colorbar present with min/mid/max value labels and a clear 'Correlation' title,
    satisfying the spec's colorbar-legend requirement
  - 2-decimal value formatting matches the spec's correlation-formatting note
  - Theme-adaptive chrome (background, ink, grid stroke) correctly threaded through
    the custom Style and cell rendering; both renders are readable with no dark-on-dark
    or light-on-light failures
  - Canvas dimensions correct at 2400x2400 (square format, appropriate for a matrix
    visualization); no edge clipping in either render
  - Rounded cell corners, subtle theme-matched cell strokes, and clean sans-serif
    typography give the matrix a polished, intentional look beyond a bare grid
  - Custom Graph subclass with Style-token theming follows the established repo pattern
    for pygal heatmaps (pygal has no native heatmap chart type)
  weaknesses:
  - 'Diverging colormap is normalized to the data''s own min/max (0.28-1.00) instead
    of the correlation domain''s true zero-anchored range: _interpolate_color computes
    normalized = (value - min_val) / (max_val - min_val), so the ''neutral'' midpoint
    color lands at an arbitrary value (~0.64, the middle of the observed range) rather
    than at 0 (no correlation). Because MIDPOINT is set to PAGE_BG itself, any cell
    near that arbitrary midpoint (e.g. Revenue/Satisfaction=0.65, Marketing/Customers=0.68)
    renders a color nearly identical to the canvas background, especially in the dark
    render where the midpoint IS #1A1A17 - the cell fill visually vanishes into the
    page and only the text annotation reveals its presence. Fix: normalize against
    a fixed, semantically meaningful range (e.g. normalized = (value + 1) / 2 for
    a -1..1 correlation domain), the same approach already used in plots/heatmap-correlation/implementations/python/pygal.py.'
  - Sample correlation matrix contains only positive values (0.28 to 1.00) - no negative
    correlations are shown, so the diverging colormap's red end is never tied to a
    real negative relationship and the 'diverging' rationale is not demonstrated.
    Compare plots/heatmap-correlation/implementations/python/pygal.py, which includes
    several negative correlation pairs (e.g. -0.15, -0.22, -0.08) to properly exercise
    the full diverging scale. Add 1-2 plausible negative correlations (e.g. R&D Spend
    vs. a metric with a weak/inverse relationship) to improve feature coverage.
  - numpy is imported and np.random.seed(42) is called, but the correlation matrix
    is a hardcoded Python list of lists - numpy is never used for any array operation,
    so the import and seed call are dead code with no functional effect.
  - Sizable empty gap between the title and the top of the matrix, and an empty bottom-left
    corner beneath the row labels (rotated column labels only occupy the area under
    the grid) - layout could use tighter, more evenly balanced margins.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct theme token applied.
      Chrome: Title "heatmap-annotated · pygal · anyplot.ai" in bold dark ink, clearly visible above the matrix. Row labels (Revenue, Marketing, R&D Spend, Customers, Satisfaction, Retention) at left and matching column labels rotated 45 degrees below the grid, both in dark, bold, readable text. Colorbar on the right with "Correlation" title and min (0.28) / mid (0.64) / max (1.00) labels in dark text.
      Data: 6x6 symmetric correlation matrix, diagonal = 1.00 in deep blue, off-diagonal cells colored via a red-neutral-blue diverging gradient. Every cell shows its value to 2 decimals in auto-contrast text (white on dark cells, dark gray on pale cells). Mid-range cells (~0.55-0.70, e.g. Revenue/Satisfaction=0.65, Marketing/Customers=0.68) render very pale, close to the page background color, since the diverging colormap's neutral midpoint is defined as PAGE_BG itself and the data's midpoint (0.64) sits almost exactly there - text remains legible but the cell fill nearly disappears into the surrounding canvas.
      Legibility verdict: PASS for text/labels (all readable); FLAG for data-element visibility - several mid-range cells are hard to distinguish from the background by color alone.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct theme token applied.
      Chrome: Title, row/column labels, and colorbar labels all rendered in light cream ink (#F0EFE8), clearly visible against the dark background - no dark-on-dark failures.
      Data: Identical correlation values and identical color endpoints (matte-red #AE3030, blue #4467A3) to the light render - only chrome flips as required. However, because the diverging midpoint is theme-adaptive and equals #1A1A17 on this render, the same mid-range cells (Revenue/Satisfaction=0.65, Marketing/Customers=0.68) render nearly the exact color of the dark canvas - the cell rectangles are effectively invisible except for their white value text, which is a more severe version of the same issue seen in the light render.
      Legibility verdict: PASS for text (all titles/labels/values readable, no dark-on-dark text); FAIL for data-element visibility on the affected mid-range cells - their fill color is indistinguishable from the page background.
