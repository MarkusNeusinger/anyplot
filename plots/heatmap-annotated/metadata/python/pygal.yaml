      Data: 6x6 symmetric correlation matrix as rounded tiles with page-colored gaps; diagonal 1.00 in Imprint blue #4467A3, positives in lighter blues, the -0.18 and -0.12 cells pale red near the page-colored midpoint. Values with 2 decimals, white on saturated blue cells and near-black on pale cells. No categorical series (continuous imprint_div fields ramp).
