review:
  strengths:
  - Correlation colormap normalization is now correctly fixed-anchored to the -1..1
    domain via normalized = (value + 1) / 2, replacing the prior data-min/max normalization
    bug from attempt 1 -- mid-range and near-zero cells now render semantically correct
    pale/near-neutral colors (appropriate for weak correlations) instead of arbitrarily
    vanishing, and clearly-correlated cells (0.65-0.88) are now visibly saturated
    blue.
  - Data now includes genuine negative correlations (Marketing/R&D Spend = -0.18,
    R&D Spend/Satisfaction = -0.12) with a plausible business narrative in the code
    comment, properly exercising the red end of the diverging colormap that was unused
    in attempt 1.
  - The dead numpy import and unused np.random.seed(42) call from attempt 1 have been
    removed; the correlation matrix is a plain hardcoded, fully reproducible list
    of lists.
  - Auto-contrast text color per cell (white on dark fills, dark gray on pale fills)
    keeps every value readable regardless of where it falls on the diverging fill.
  - Theme-adaptive chrome (background, ink, cell strokes, colorbar) is threaded through
    cleanly; both renders are theme-correct with no dark-on-dark or light-on-light
    failures.
  - Colorbar with min/mid/max value labels and a 'Correlation' title, plus the custom
    color-interpolation function, contrast-aware text logic, and direct pygal SVG-node/view-coordinate
    manipulation demonstrate genuine pygal-internals mastery that isn't easily replicated
    in another library.
  weaknesses:
  - Layout still has a sizable empty gap between the title and the top of the matrix,
    and an unused blank area in the bottom-left corner beneath the row labels (to
    the left of the rotated column labels) -- tighten margins so the grid better fills
    the 2400x2400 canvas.
  - Row/column label and value font sizes are capped at fixed maxima (44px labels
    / 42px values via min(44, cell_height*0.55) etc.) that bind well below what the
    generous cell size on this large square canvas could support -- text is legible
    but not using the full available legibility headroom.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), correct light theme token applied.
      Chrome: Title "heatmap-annotated · pygal · anyplot.ai" in bold dark ink, clearly visible above the matrix. Row labels (Revenue, Marketing, R&D Spend, Customers, Satisfaction, Retention) at left and matching column labels rotated 45 degrees below the grid, both in dark, bold, readable text. Colorbar on the right with "Correlation" title and min (-0.18) / mid (0.41) / max (1.00) labels in dark text, fully within the canvas.
      Data: 6x6 symmetric correlation matrix, diagonal = 1.00 in deep blue. Off-diagonal cells now correctly follow a fixed -1..1-anchored diverging gradient: strongly positive cells (0.65-0.88, e.g. Customers/Retention=0.88) render clearly saturated blue, and the two negative cells (Marketing/R&D Spend=-0.18, R&D Spend/Satisfaction=-0.12) render pale pink/near-neutral since they sit close to zero correlation -- this near-background tone is now semantically correct (weak correlation = near-neutral color) rather than an artifact of a broken normalization. Every cell shows its value to 2 decimals in auto-contrast text (white on dark cells, dark gray on pale cells), so all values stay legible even on the palest cells.
      Legibility verdict: PASS -- all text and all data-cell fills are readable and distinguishable from the background and from each other.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), correct dark theme token applied.
      Chrome: Title, row/column labels, and colorbar labels all rendered in light cream ink (#F0EFE8), clearly visible against the dark background -- no dark-on-dark failures.
      Data: Identical correlation values and identical color endpoints (matte-red #AE3030, blue #4467A3) to the light render -- only chrome flips as required. The near-zero negative cells (-0.18, -0.12) render as a dark maroon rather than vanishing into the page background, staying visually distinct from the near-black canvas even though their color is close to the diverging midpoint.
      Legibility verdict: PASS -- all titles/labels/values are readable, no dark-on-dark text, and the near-neutral cells remain visually distinguishable from the canvas.
