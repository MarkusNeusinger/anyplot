    midpoint -> #4467A3) applied to the correlation fill, with theme-correct chrome
    (background, title, axis, legend) in both renders.'
  - 'Smart contrast-aware annotation text color: cell labels switch between white
    and ink based on |value| > 0.5, keeping every annotation readable regardless of
    cell saturation.'
  - 'Genuine data storytelling: a second `geom_tile` layer with a bold border highlights
    the single strongest off-diagonal correlation (Finance-Consumer, 0.68), correctly
    computed and drawn on both mirrored cells — a clear focal point beyond a plain
    grid dump.'
  - 'Clean, idiomatic lets-plot/grammar-of-graphics code: layered geoms, `scale_color_identity()`
    for direct color mapping of precomputed text colors, KISS structure, reproducible
    via `np.random.seed(42)`.'
  - 'Correct matrix conventions: y-axis categories reversed so the diagonal reads
    top-left to bottom-right, all 8x8 cells populated and labeled.'
  weaknesses:
  - 'Design Excellence still has room to grow beyond a solid-but-not-exceptional level:
    cell border weight (`geom_tile(color=INK_SOFT, size=0.3)`) and legend box framing
    are fairly standard — consider slightly more refined borders/whitespace or an
    added visual accent to push polish further.'
  - The negative extreme (-0.57) is still noticeably less saturated than the positive
    extreme (diagonal 1.00 and several 0.6+ off-diagonal values), so the diverging
    scale reads slightly asymmetric — not a hard failure, but a wider negative tail
    (e.g. one pair around -0.75 to -0.85) would make the diverging nature fully symmetric.
