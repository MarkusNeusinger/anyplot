review:
  strengths:
  - 'Correct imprint_div diverging colormap built exactly per the style guide: matte-red
    -> theme-adaptive midpoint -> blue, verified pixel-identical data colors between
    light and dark renders'
  - Per-cell text color is computed dynamically from the actual rendered fill luminance
    rather than a fixed light/dark split, so contrast holds even where the diverging
    midpoint equals the page background
  - 'Theme-adaptive chrome verified pixel-exact: light background #FAF8F1 (250,248,241),
    dark background #1A1A17 (26,26,23), all title/axis/tick/colorbar text branches
    correctly on ANYPLOT_THEME'
  - Canvas measured at exactly 2400x2400 with the heatmap grid occupying a well-balanced
    ~62% of the canvas area and zero pixels clipped at any of the four edges
  - HoverTool adds genuine interactive value (row metric, column metric, exact Pearson
    correlation) without faking anything in the static PNG - correctly exempted from
    AR-08
  - 'Realistic, factually-consistent correlation matrix: symmetric, diagonal = 1.00,
    values properly bounded in [-1, 1], derived from shared latent financial factors
    rather than arbitrary noise'
  weaknesses:
  - Title omits the mandated 'python' language segment. Format must be '{spec-id}
    · {language} · {library} · anyplot.ai'; current title renders 'heatmap-annotated
    · bokeh · anyplot.ai' instead of 'heatmap-annotated · python · bokeh · anyplot.ai'.
  - All negative correlations are weak (minimum is Debt/ROI at -0.29), so the diverging
    colormap's red end is barely exercised - only pale pinks appear, no cell approaches
    the deep matte-red used near -1. Strengthen one relationship (e.g. push Debt vs
    ROI or Debt vs Profit further negative) so the render demonstrates the full -1..+1
    range.
  - In dark mode, near-zero correlation cells (fill color converges on the theme-adaptive
    midpoint, which equals the page background) become nearly indistinguishable from
    the surrounding canvas - text stays legible but the 8x8 grid structure partially
    disappears for weakly-correlated cells. Consider a slightly stronger cell border
    or a non-background-matching floor tint for |value| < 0.05 in dark mode.
  - Three small helper functions (_lerp_hex, _luminance, _value_to_hex) deviate from
    the ideal flat imports -> data -> plot -> save script structure (CQ-01); largely
    unavoidable boilerplate for building the Imprint diverging ramp, but worth trimming
    if a simpler inline approach is possible.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, measured pixel (250,248,241) - matches #FAF8F1 exactly.
      Chrome: Bold black title "heatmap-annotated · bokeh · anyplot.ai" centered at top, italic "Financial Metric" axis label (shown above the grid via x_axis_location="above") directly beneath it, rotated (~40 deg) column headers (Revenue, Profit, Assets, Debt, Growth, ROI, Market Cap, Volume), horizontal row labels on the left, and a right-side ColorBar titled "Pearson Correlation" with ticks from 1 to -1. All chrome text is dark ink (#1A1A17 title / #4A4A44 secondary) and clearly legible against the light background.
      Data: 8x8 symmetric correlation matrix rendered as colored rect cells with centered numeric labels (e.g. "1.00", "0.82", "-0.29"). Diagonal cells are saturated blue (value=1.00) with white text; strongly positive off-diagonal cells (Revenue/Profit = 0.82) are medium blue with white text; near-zero cells are pale cream with dark text; weakly negative cells (Debt row, max magnitude -0.29) are pale pink with dark text. Cell colors come from the imprint_div diverging ramp (#AE3030 -> page-bg midpoint -> #4467A3).
      Legibility verdict: PASS - all text (title, axis labels, tick labels, cell values, colorbar) reads cleanly against the light surface, no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, measured pixel (26,26,23) - matches #1A1A17 exactly.
      Chrome: Same layout as the light render with all chrome inverted to light tokens - white/off-white bold title, light-gray italic "Financial Metric" label, light-gray rotated column headers and row labels, light colorbar tick labels and "Pearson Correlation" title. All chrome is clearly legible against the dark background; no dark-on-dark failures found on the title, axis labels, tick labels, or colorbar.
      Data: Confirmed pixel-identical data colors to the light render (diagonal blue, Revenue/Profit=0.82 medium blue, Debt row pale/near-neutral pink) - only the chrome flipped, exactly as required. One notable but spec-compliant side effect: near-zero cells (e.g. Assets/Revenue = -0.01) render with a fill so close to the page background that the cell boundary is nearly invisible in the dark theme (the diverging colormap's midpoint is intentionally set to match PAGE_BG per the style guide) - text inside those cells stays fully legible (light text on the near-black fill) but the grid pattern is harder to perceive for weakly-correlated pairs.
      Legibility verdict: PASS - all text remains readable; the near-invisible cell boundaries for near-zero values are a design/contrast nuance, not a legibility failure (flagged as a weakness for repair, not a hard fail).
