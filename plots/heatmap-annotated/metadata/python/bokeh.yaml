review:
  strengths:
  - 'All three attempt-1 weaknesses were addressed precisely and without regressions:
    title now includes the python language segment, the Debt/ROI correlation was strengthened
    to -0.77 so the diverging colormap''s red end is genuinely demonstrated, and near-zero
    cells now carry a subtle floor-line border to keep grid structure perceivable
    in dark mode'
  - 'Correct imprint_div diverging colormap built exactly per the style guide: matte-red
    -> theme-adaptive midpoint -> blue, verified pixel-identical data colors between
    light and dark renders'
  - Per-cell text color computed dynamically from actual rendered luminance (not a
    fixed light/dark split), so contrast holds even where the diverging midpoint equals
    the page background
  - 'Theme-adaptive chrome verified pixel-exact: light background #FAF8F1, dark background
    #1A1A17, all title/axis/tick/colorbar text branches correctly on ANYPLOT_THEME;
    title fully visible with zero clipping in both renders'
  - Canvas measured at exactly 2400x2400 with the heatmap grid well-balanced and zero
    pixels clipped at any edge
  - HoverTool adds genuine interactive value (row metric, column metric, exact Pearson
    correlation) without faking anything in the static PNG
  - 'Realistic, factually-consistent correlation matrix: symmetric, diagonal = 1.00,
    values properly bounded in [-1, 1], derived from shared latent financial factors,
    now spanning a wider and more demonstrative range'
  weaknesses:
  - Near-zero cells in dark mode (e.g. the Growth row, all |r| < 0.1) still read as
    a near-uniform dark band - the floor-line border is a real improvement over attempt
    1 but the boundary is only visible on close inspection, not at a casual glance;
    this is an inherent tension of the theme-adaptive diverging midpoint equaling
    the page background rather than an implementation bug, and text remains fully
    legible throughout
  - Three small helper functions (_lerp_hex, _luminance, _value_to_hex) still deviate
    from the ideal flat imports -> data -> plot -> save structure - acceptable given
    they implement the mandated Imprint diverging ramp, but worth noting
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Bold title "heatmap-annotated · python · bokeh · anyplot.ai" (language segment now present, fixed from attempt 1), italic "Financial Metric" subtitle, rotated column headers, horizontal row labels, right-side ColorBar titled "Pearson Correlation". All chrome text clearly readable against the light background.
      Data: 8x8 symmetric correlation matrix as colored rect cells with centered numeric labels. Diagonal cells saturated blue (1.00, white text). Strongly correlated pairs (Revenue/Profit=0.82, Debt/ROI=-0.77) show clearly saturated blue/red. Near-zero cells (Growth row) are pale cream with dark text, distinguishable via subtle color tint even at r≈0.03. First data application uses the Imprint imprint_div diverging colormap (matte-red -> theme-adaptive midpoint -> blue), not a library-native cmap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Same layout with all chrome correctly inverted to light tokens - title, axis labels, tick labels, colorbar text all light-colored and legible. No dark-on-dark failures; title fully visible top edge, zero clipping.
      Data: Confirmed pixel-identical data colors to light render (only chrome flipped). Negative range now well exercised (Debt/ROI = -0.77, clearly saturated red, vs. only -0.29 in attempt 1). Near-zero cells (Growth row) render close to the page background since the diverging midpoint is theme-adaptive and equals PAGE_BG by design, but the newly added floor-line cell borders (faint INK_SOFT-tinted stroke for |value| < 0.05) keep individual cell boundaries perceivable under close inspection - a real, if modest, improvement over attempt 1 where boundaries fully vanished into the canvas.
      Legibility verdict: PASS
