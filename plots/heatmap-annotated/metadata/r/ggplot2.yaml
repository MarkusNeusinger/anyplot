review:
  strengths:
  - 'Correct diverging color scale using the exact imprint_div stops (#AE3030 → theme-adaptive
    midpoint → #4467A3) with midpoint = 0, properly encoding both positive and negative
    correlations.'
  - 'Thoughtful data prep: mtcars columns renamed to human-readable labels (MPG, Cylinders,
    Displacement, Horsepower, Rear Axle, Weight, Quarter Mile) instead of raw column
    codes like mpg/cyl/disp.'
  - coord_fixed() keeps every cell perfectly square; tile borders colored to match
    the page background create clean, minimal-chrome gaps between cells.
  - Colorbar legend labeled "Correlation" with a clear -1 to 1 scale, matching the
    spec's colorbar requirement.
  - Canvas size (2400×2400 square, well-suited to a symmetric heatmap), title format,
    and theme-adaptive chrome (page background, ink colors) are all correctly implemented
    and consistent between the light and dark renders.
  weaknesses:
  - 'Text-color contrast bug: `text_color = ifelse(abs(value) > 0.35, LIGHT_TEXT,
    INK)` flips to near-white text too early. In the LIGHT render, cells with |correlation|
    roughly in the 0.35-0.7 range (e.g. 0.42, -0.43, -0.59, -0.45, 0.66) still have
    pale/medium-saturation backgrounds (blend of the #FAF8F1 midpoint with the red/blue
    endpoint), so the bold white text has an estimated contrast ratio of only ~1.9-2.5:1
    against those cells — below the 3:1 WCAG minimum for large bold text. The same
    0.35 threshold works fine in the DARK render because the midpoint is already near-black
    there, so cells darken quickly and white text reaches ~11:1 contrast at the same
    values — the bug is theme-asymmetric, visible only in light mode. Fix: raise the
    light-theme white-text threshold to roughly |value| > 0.65-0.7 (or better, branch
    the threshold on THEME, or compute per-cell luminance/contrast instead of one
    fixed cutoff shared by both themes).'
  - Title ("Car Performance Correlations · heatmap-annotated · r · ggplot2 · anyplot.ai",
    77 chars) spans roughly 90%+ of the plot width at plot.title size = 11, right
    at/over the ~90% overflow guideline for the long mandated title with a descriptive
    prefix. Shrink slightly toward the formula value (round(12 × 67/77) ≈ 10pt) to
    restore breathing room on both sides.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme page background.
      Chrome: Title "Car Performance Correlations · heatmap-annotated · r · ggplot2 · anyplot.ai" in dark ink, centered, spans nearly full plot width (~90%+). Diagonal (30°) column tick labels across the top (MPG, Cylinders, Displacement, Horsepower, Rear Axle, Weight, Quarter Mile) and horizontal row tick labels down the left side, both in soft dark gray. Colorbar legend on the right titled "Correlation" with ticks from -1.0 to 1.0.
      Data: 7x7 grid of square tiles colored on a red (#AE3030, negative) - near-white midpoint (0) - blue (#4467A3, positive) diverging scale, with the numeric correlation value (2 decimals, bold) printed inside every cell. Diagonal cells are all "1.00" in deep blue. First-glance pattern reading works well (weight/displacement cluster in blue, MPG relationships in red).
      Legibility verdict: FAIL for a subset of cells — most tick labels, title, and legend text are clearly readable, and cells with |value| > ~0.7 (deep, saturated red/blue) or |value| ≤ 0.35 (near-white, dark text) read cleanly. However, medium-magnitude cells (|value| ≈ 0.35-0.7, e.g. 0.42, -0.43, -0.59, -0.45, 0.66) use bold white text on pale/medium-saturation backgrounds, producing visibly washed-out, low-contrast numerals (~1.9-2.5:1 estimated contrast, below the 3:1 large-bold-text minimum).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme page background.
      Chrome: Same title, now in light ink (#F0EFE8), fully readable against the dark background. Diagonal column labels and row labels in light gray, both clearly legible. Colorbar legend readable with light tick labels.
      Data: Identical correlation values and identical red/blue endpoint hues to the light render — only the chrome and the near-zero midpoint blend color (now near-black instead of near-white) changed, as required. Diagonal "1.00" cells remain the same deep blue.
      Legibility verdict: PASS — no dark-on-dark issues. Because the theme-adaptive midpoint is already near-black in this theme, medium-magnitude cells darken quickly with correlation magnitude, so the same 0.35 white-text threshold that fails in the light render produces excellent contrast here (~11:1 estimated) — confirming the bug is specific to the light theme rather than a shared-across-themes problem.
