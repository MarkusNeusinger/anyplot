review:
  strengths:
  - 'Correct Imprint imprint_div diverging colormap for the correlation matrix, with
    the theme-adaptive midpoint from window.ANYPLOT_TOKENS.div — endpoint colors (blue
    #4467A3 at r=1.00, red toward r=-1) verified pixel-identical between light and
    dark renders'
  - Dynamic per-cell text contrast via a proper WCAG relative-luminance calculation
    (textColor/luminance), confirmed correct in both themes down to near-neutral cells
    that sit close to the light/dark contrast threshold
  - Bold font-weight applied to the diagonal and to |r| > 0.6 cells creates a genuine
    visual hierarchy that draws the eye to the strongest correlations (Cloud Cover/UV
    Index -0.65, Rainfall/Visibility -0.63, Humidity/Rainfall 0.65)
  - Cell font size scales with computed cell bandwidth (clamped 13-22px), and the
    manually-built SVG gradient legend correctly mirrors the cell color scale with
    matching axis ticks
  - Realistic, internally-consistent weather correlation matrix (symmetric, unit diagonal,
    plausible signs/magnitudes for every pair) built deterministically via a seeded
    LCG
  - Square canvas format is the right call for a symmetric 8x8 matrix; grid occupies
    ~63% of the canvas with balanced margins and the legend sits close to the grid
    rather than floating isolated
  weaknesses:
  - Design Excellence is strong but not at the absolute publication-ready ceiling
    — e.g. no single explicit callout/annotation pointing to the strongest correlation,
    and the legend swatch/typography is clean but standard rather than editorial
  - Three small helper functions (lcg, luminance, textColor) deviate from a strict
    flat KISS Imports->Data->Plot->Save structure, though they are justified here
    (seeded RNG is mandated by the library guide's reproducibility rule, and WCAG-based
    contrast text is mandated by the spec's 'sufficient contrast' requirement)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "heatmap-annotated · javascript · d3 · anyplot.ai" and a gray subtitle "Pearson correlation between weather variables" are both crisp and fully readable against the light background. Row labels (Temperature...Visibility) sit to the left in dark gray; column labels are rotated -35° below the grid, evenly spaced with no overlap between adjacent labels or with the last data row. The colorbar on the right is labeled "r" with ticks at 1.0/0.5/0.0/-0.5/-1.0, all legible.
      Data: 8x8 correlation matrix, diagonal cells (r=1.00) render as a medium blue (#4467A3), strongly negative cells (e.g. -0.65, -0.63) render as a saturated red, near-zero cells render as a muted rose/lavender blend toward the light page background (the documented theme-adaptive midpoint behavior of imprint_div). Per-cell text color automatically switches between near-black and near-white depending on the luminance of the cell's fill, and stays legible in every cell I sampled. Bold weight is used on the diagonal and on |r| > 0.6 cells to draw the eye to the strongest relationships.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light/off-white, subtitle in a softer gray, both fully legible against the dark background. Row/column labels and colorbar tick labels are rendered in a light gray tone that reads clearly against the dark surface — no dark-on-dark text found anywhere, including on the near-neutral cells whose fill is itself quite dark.
      Data: The diagonal blue (r=1.00) cells sample to the exact same RGB (68,103,163 / #4467A3) as in the light render, confirming the positive/negative endpoint hues of imprint_div are identical across themes as required. Near-zero cells blend toward the dark page background instead of the light one (by design — the div token's midpoint is theme-adaptive per window.ANYPLOT_TOKENS.div), so those specific cells look darker/more saturated than their light-theme counterparts while the extreme (|r| near 1) cells stay pixel-identical. Text contrast per cell is correctly recomputed per theme and remains readable throughout.
      Legibility verdict: PASS
