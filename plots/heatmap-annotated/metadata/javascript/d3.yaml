review:
  strengths:
  - WCAG-luminance-based automatic text-contrast function ensures every cell's numeric
    annotation is legible against its background color in both themes
  - Bold font-weight on the diagonal and on |r| > 0.6 cells creates a clear visual
    hierarchy that draws the eye to the strongest relationships
  - 'Correct Imprint diverging palette (imprint_div: matte-red to blue with a theme-adaptive
    neutral midpoint) — data colors are identical between light and dark renders,
    and chrome correctly flips to #FAF8F1 / #1A1A17'
  - 'Full spec coverage: colorbar legend labeled ''r'', 2-decimal number formatting,
    diverging colormap for signed correlation data, and cell-size-relative dynamic
    font sizing'
  - Clean, KISS-structured code with a deterministic seeded LCG for reproducible data
    and no fake interactivity
  weaknesses:
  - 'Heatmap cells are not square: margin = {top:150, right:230, bottom:130, left:190}
    on the 1200x1200 mount yields iw=780 vs ih=920 (~18% taller than wide) even though
    x and y share the same 8-item domain — make iw equal ih (e.g. symmetric top/bottom
    vs left/right spacing, or size the grid off min(iw, ih)) so the correlation matrix
    reads as a proper square grid.'
  - Correlation values are generated from an unconstrained LCG without domain calibration,
    producing some physically implausible pairs for the chosen weather variables (e.g.
    Temperature vs UV Index = -0.95, though these typically move together; Humidity
    vs Rainfall = 0.99, unrealistically near-perfect for real weather data) — bias
    the generator toward more moderate, domain-plausible magnitudes.
  - The right margin is tightly tuned to exactly fit the colorbar + axis ticks + 'r'
    label with little slack — worth a bit more breathing room so it doesn't get fragile
    if tick text ever grows.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "heatmap-annotated · javascript · d3 · anyplot.ai" in bold dark text at top; subtitle
        "Pearson correlation between weather variables" in softer gray beneath it. Row labels (Temperature,
        Humidity, Wind Speed, Pressure, Rainfall, Cloud Cover, UV Index, Visibility) run down the left side;
        the same 8 labels repeat rotated -35° along the bottom as column labels. A vertical colorbar sits to
        the right of the grid, labeled "r" above it, with tick labels from 1.0 down to -1.0.
      Data: 8x8 correlation matrix. Cells are colored on the Imprint diverging scale — dark blue for strongly
        positive r, dark matte-red for strongly negative r, pale neutral lavender-gray near r=0. Each cell shows
        its value to 2 decimal places, with automatic dark/light text chosen per-cell for contrast, and bold
        weight on the diagonal (r=1.00) and any |r| > 0.6 cell to highlight the strongest relationships.
      Legibility verdict: PASS — every title, label, tick, and cell value is clearly readable against the light
        background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title/subtitle now rendered in light/off-white text; row and column labels in light gray;
        colorbar and its "r" label and tick text also in light color. Layout is otherwise identical to the
        light render.
      Data: Cell colors are pixel-identical to the light render (same blue/red diverging scale, same values),
        confirming only chrome — not data color — flips between themes. Text-contrast toggling still applies
        per-cell (dark text on the palest cells, light text on saturated cells).
      Legibility verdict: PASS — no dark-on-dark failures found; all title, axis, tick, and cell-value text
        reads clearly against the near-black surface.
