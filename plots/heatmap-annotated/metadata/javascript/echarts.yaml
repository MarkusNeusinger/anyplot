review:
  strengths:
  - 'Repair directly addressed the prior review''s DE-03 weakness: the strongest off-diagonal
    correlation (Temperature ↔ UV Index, 0.81) is now computed in code and surfaced
    via a subtitle callout plus a bold ink-colored border on both symmetric cells,
    giving the matrix a clear focal point'
  - Per-cell label color is derived by interpolating the same imprint_div gradient
    the visualMap uses and computing luma, so every cell's annotation text stays contrast-safe
    against its own background in both themes -- no fixed light/dark threshold that
    could fail on a specific value
  - Diverging imprint_div colormap correctly chosen for signed correlation data (-1
    to +1), with a labeled continuous visualMap colorbar
  - Title format is exact, all 8x8 cells are populated with 2-decimal annotations,
    and the data (weather metric correlations) is realistic, symmetric, with diagonal
    = 1.00 as expected
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    title/tick ink, border color on the highlighted cell) adapts to theme
  weaknesses:
  - Six small color-math helpers (hexToRgb, lerpRgb, divergingRgb, luma, contrastColor,
    isStrongestPair) add real surface area beyond a minimal top-to-bottom script;
    justified here since ECharts has no built-in per-cell contrast-aware label API,
    but it keeps CQ-01 shy of full marks
  - Beyond the single highlighted pair, the rest of the 8x8 grid is still a standard
    correlation matrix layout -- there is no secondary structuring (e.g. row/column
    reordering by cluster) that would push the layout itself toward publication-grade
    sophistication
  - The visualMap colorbar shows only numeric -1.00/1.00 endpoints with no 'Correlation'
    label, which is a minor descriptiveness gap even though the axis category labels
    make the matrix content self-evident
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Dark-ink title "heatmap-annotated · javascript · echarts · anyplot.ai" centered near the top, occupying a comfortable width with no clipping. A secondary-ink subtitle beneath it reads "Strongest link: Temperature ↔ UV Index (0.81)". Row labels (8 weather metrics) run horizontally down the left edge; the same 8 labels repeat rotated ~40° along the bottom with no overlap or clipping. A vertical continuous colorbar (visualMap) sits at the right, labeled 1.00 at top and -1.00 at bottom.
      Data: 8x8 symmetric correlation matrix. Diagonal cells (value 1.00) render deep blue; off-diagonal cells span deep red (strong negative) through near-white (near zero) to blue (strong positive) via the imprint_div diverging gradient. Each cell is annotated with its 2-decimal value; text color auto-switches between near-black and near-white based on that specific cell's background luminance, and stays legible on every cell inspected. The Temperature/UV Index cell pair (0.81) is outlined with a bold black border and bold-weight label, clearly distinguishing it as the callout referenced in the subtitle.
      Legibility verdict: PASS -- all title, subtitle, tick, and cell-annotation text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title, subtitle, and axis tick labels flip to light ink and remain fully legible with no clipping. The visualMap colorbar text and gradient endpoints are equally readable. The highlighted Temperature/UV Index cell now shows a bold near-white border (ink token flipped for the theme), still standing out from the surrounding grid.
      Data: Cell background colors are pixel-identical to the light render (only chrome flipped, as required) -- the diverging red/blue scale and every numeric value are unchanged. Per-cell annotation text colors (derived from the theme-independent data color, not the page background) remain readable on every cell; no dark-on-dark or light-on-light failures observed anywhere in the grid.
      Legibility verdict: PASS -- no dark-on-dark or light-on-light failures found; the theme-adaptive border on the highlighted cell is a nice touch that keeps the focal point visible in both themes.
