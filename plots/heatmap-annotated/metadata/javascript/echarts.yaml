review:
  strengths:
  - Correct diverging correlation encoding with the Imprint imprint_div gradient,
    negative values reading red and positive reading blue via t.div, identical data
    colors between light and dark renders.
  - Per-cell label color is computed from the actual interpolated cell background
    luminance (hexToRgb/lerpRgb/luma helpers) rather than a single global threshold,
    so every annotation stays legible regardless of how saturated that specific cell
    is.
  - Believable, symmetric 8x8 weather-metric correlation matrix (diagonal = 1.00,
    plausible pairs like Temperature/UV Index = 0.81, Cloud Cover/UV Index = -0.65)
    that reads identically in both themes.
  - Clean square 2400x2400 canvas with correct orientation directive, calculable visualMap
    colorbar labeled -1.00 to 1.00, generous margins and no clipped text on either
    edge.
  weaknesses:
  - Design excellence is mostly standard heatmap layout beyond the contrast-color
    technique — no visual hierarchy or emphasis (e.g. highlighting the strongest correlations,
    sorting/clustering rows) to guide the reader toward a focal point.
  - Six small helper arrow functions (hexToRgb, lerpChannel, lerpRgb, divergingRgb,
    luma, contrastColor) push the file past a minimal KISS structure; justified by
    the per-cell contrast requirement, but still adds code surface for what is fundamentally
    a static data + option object.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "heatmap-annotated · javascript · echarts · anyplot.ai" is dark ink, centered, comfortably sized (~60-65% of plot width). Row labels (Temperature, Humidity, Wind Speed, Pressure, Rainfall, Cloud Cover, UV Index, Visibility) run horizontally on the left in soft ink; column labels repeat the same metrics rotated ~40° along the bottom, fully visible with no clipping. The visualMap colorbar on the right shows a red-to-blue vertical gradient labeled -1.00 to 1.00 in soft ink.
      Data: 8x8 symmetric correlation matrix, diagonal cells = 1.00 in deep blue, off-diagonal cells span from deep red (e.g. Cloud Cover/UV Index = -0.65) through near-white (near-zero values) to blue (e.g. Temperature/UV Index = 0.81). Each cell shows a numeric value (2 decimals) whose text color automatically switches between near-black and near-white based on that cell's own background luminance — every label is readable.
      Legibility verdict: PASS — all title, axis tick labels, cell annotations, and colorbar labels are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, now in light ink, centered and equally proportioned. Row and column tick labels flip to light-gray ink, fully legible and un-clipped. The visualMap colorbar retains the same red-to-blue gradient and range labels, now rendered in light-gray text.
      Data: Cell background colors are pixel-for-pixel identical to the light render (same red-to-blue diverging scale, same values) — only the chrome (background, tick labels, title, colorbar text) flipped to the dark palette, as required. Cell text colors are unchanged from the light render since they are computed from the (theme-independent) data color, and remain readable on every cell — no dark-on-dark or light-on-light failures observed.
      Legibility verdict: PASS — all chrome and data annotations remain clearly readable against the dark background.
