review:
  strengths:
  - 'The requested data-storytelling fix from attempt 1 landed cleanly: amber-outlined
    focal cells plus a two-clause caption (''Strongest link... / Sharpest divide...'')
    give the reader an immediate takeaway beyond raw color scanning.'
  - 'Correct diverging Imprint colormap (imprint_div: matte-red -1, theme-adaptive
    page-bg midpoint 0, blue +1), with a luminance-based per-cell text-color function
    that keeps every annotation high-contrast in both themes.'
  - Explicit, well-proportioned typography throughout (18px cell values, 14px axis
    labels, 13px caption/colorbar text) with a title font size dynamically scaled
    to the 67-char baseline so the long mandated title fits without overflow or clipping.
  - 'Realistic, internally consistent macroeconomic correlation data: symmetric matrix,
    diagonal = 1.00, and economically plausible relationships (e.g. unemployment vs.
    GDP growth at -0.71, consistent with Okun''s law).'
  - Correct title format with descriptive prefix, and a clearly labeled diverging
    colorbar ('Correlation (r)', ticks at -1/0/1) serving as the legend the spec requires.
  weaknesses:
  - 'Because the core highcharts bundle doesn''t include the heatmap module, the implementation
    forgoes Highcharts'' native series/data model entirely (series: []) in favor of
    manual SVG drawing via chart.renderer — a documented, necessary workaround, but
    it means the plot can''t showcase the library''s high-level heatmap API and keeps
    Library Mastery capped.'
  - The colorbar is still built from 40 discrete rect segments rather than a true
    SVG linearGradient fill; not visually banded at this size, but a native gradient
    would be a more idiomatic Highcharts renderer technique.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matching #FAF8F1 — not pure white, not dark.
      Chrome: Title "Macroeconomic Indicator Correlations · heatmap-annotated · javascript · highcharts · anyplot.ai" in bold dark ink, fully legible, spanning roughly 70-75% of plot width (expected for the long mandated title format). Subtitle "Pairwise Pearson correlation across 7 quarterly macroeconomic indicators" in soft gray beneath it. A new caption line ("Strongest link: GDP Growth ↔ Consumer Conf. (+0.74) · Sharpest divide: Unemployment ↔ GDP Growth (-0.71)") sits between the subtitle and the matrix, clearly readable and not colliding with either. Row labels (Inflation, Unemployment, Interest Rate, GDP Growth, Consumer Conf., Stock Index, Housing Starts) right-aligned left of the matrix; column labels rotated -40° below it — both fully legible with no clipping. Colorbar on the right labeled "Correlation (r)" with endpoints 1 / 0 / -1, all legible.
      Data: 7x7 diverging heatmap — blue cells for positive correlation, red cells for negative, near-background pale cells near zero, diagonal uniform deep blue (1.00). Each cell shows its value to 2 decimal places in dark or off-white text chosen per-cell for contrast. Two symmetric cell pairs (GDP Growth/Consumer Conf. and Unemployment/GDP Growth) are outlined in amber, matching the caption above.
      Legibility verdict: PASS — every text element (title, subtitle, caption, row/column labels, cell values, colorbar labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, and caption rendered in light ink/gray, fully legible against the dark background. Row and column labels are light-gray, matching the light render's layout and rotation exactly. Colorbar labels and "Correlation (r)" title remain legible in light gray.
      Data: Same 7x7 matrix with pixel-identical cell fill colors to the light render — confirming only chrome (background, text) flips between themes, as required. The diverging midpoint is theme-adaptively swapped from #FAF8F1 to #1A1A17 per the style guide's explicit allowance. Cell value text stays high-contrast, and the same two cell pairs are outlined in amber, matching the caption.
      Legibility verdict: PASS — no dark-on-dark failures; every title, label, caption, and cell value is clearly distinguishable from the near-black surface.
