review:
  strengths:
  - Correctly worked around the missing heatmap module — the core Highcharts bundle
    doesn't ship modules/heatmap, so the implementation draws cells, annotations,
    and the colorbar manually via chart.renderer, exactly per the library's guidance.
  - 'Diverging color scale follows the style guide precisely: #AE3030 (negative) →
    theme-adaptive midpoint (#FAF8F1 light / #1A1A17 dark) → #4467A3 (positive), with
    a WCAG relative-luminance function picking black vs. off-white text per cell for
    guaranteed contrast.'
  - 'Both renders are clean and theme-correct: warm off-white/near-black backgrounds,
    identical data colors between themes (only chrome and the theme-adaptive midpoint
    flip), no clipping, no overlap.'
  - Custom diverging colorbar with correct labeled endpoints (1 / 0 / -1) and a 'Correlation
    (r)' title communicates the scale clearly alongside the per-cell values.
  - Realistic, neutral 7×7 macroeconomic correlation matrix with plausible signs and
    magnitudes (e.g. GDP Growth vs. Unemployment strongly negative, Consumer Conf.
    vs. GDP Growth strongly positive).
  weaknesses:
  - No visual emphasis or storytelling device beyond the raw diverging color (e.g.
    highlighting the strongest positive/negative pair, or clustering rows/columns
    by similarity) — the matrix is left in a fixed alphabetical-ish order rather than
    grouped by correlation structure, which is a common heatmap technique to strengthen
    the takeaway.
  - 'The implementation forgoes Highcharts'' series/data model entirely (empty series:
    []) in favor of full manual SVG drawing via chart.renderer — necessary given the
    missing heatmap module, but it means axis/tooltip/legend infrastructure that Highcharts
    would normally provide is reimplemented by hand, adding surface area (multiple
    helper functions) for what the criteria consider a KISS-scored plot.'
  - Colorbar is built from 40 discrete rect segments rather than a true SVG gradient
    — at this size banding is not visually obvious, but a linearGradient fill would
    be smoother and is a native Highcharts renderer capability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Macroeconomic Indicator Correlations · heatmap-annotated · javascript · highcharts · anyplot.ai" in bold dark ink, clearly legible, spans roughly 70-75% of the plot width. Subtitle "Pairwise Pearson correlation across 7 quarterly macroeconomic indicators" in lighter gray, fully legible below the title. Row labels (Inflation, Unemployment, Interest Rate, GDP Growth, Consumer Conf., Stock Index, Housing Starts) right-aligned to the left of the matrix in dark-gray ink, fully readable. Column labels rotated -40° below the matrix, same styling, fully readable with no clipping. Colorbar on the right labeled "Correlation (r)" with endpoints "1" / "0" / "-1", all legible.
      Data: 7×7 diverging heatmap, blue cells for positive correlation (#4467A3-derived), red cells for negative correlation (#AE3030-derived), near-background pale cells near zero. Diagonal is uniform deep blue (1.00). Each cell shows its numeric value to 2 decimal places, rendered in dark text on light cells and off-white text on dark/saturated cells — contrast is well chosen throughout via the luminance-based text-color function.
      Legibility verdict: PASS — all text (title, subtitle, row/column labels, cell values, colorbar labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle rendered in light ink/gray, clearly legible against the dark background. Row and column labels also light-gray, fully readable, matching light-render positions and rotation. Colorbar labels and "Correlation (r)" title legible in light gray.
      Data: Same 7×7 matrix with identical cell fill colors as the light render (blue/red saturation for each value is pixel-for-pixel the same) — confirming only chrome (background, text colors) flips between themes, as required. The diverging midpoint color is theme-adaptively swapped from #FAF8F1 to #1A1A17 per the style guide's explicit allowance for diverging-colormap midpoints. Cell value text remains high-contrast in both cases.
      Legibility verdict: PASS — no dark-on-dark failures; every title, label, and cell value is clearly distinguishable from the near-black surface, and the brand-adjacent blue/red data colors read well on the dark surface.
