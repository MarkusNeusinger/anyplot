review:
  strengths:
  - Correct diverging Imprint colormap (imprint_div) built from t.div[0..2] with a
    theme-adaptive midpoint, matching the style guide exactly, and identical red/blue
    anchors across both renders
  - Auto-contrast annotation text (luminance-based) keeps every cell value readable
    regardless of cell color, verified working correctly in both light and dark renders
  - Idiomatic, distinctive use of MUI X's compositional API (ChartContainer + useXScale/useYScale/useDrawingArea)
    to build a fully custom heatmap — a chart type the community package has no built-in
    component for
  - Realistic, neutral wellness-metrics correlation dataset with a full spread of
    correlation strengths (-0.71 to 1.00) and directionally sensible relationships
  - Well-labeled diverging colorbar legend ('Pearson r', ticks from -1 to 1) placed
    close to the plot, with theme-adaptive chrome throughout
  weaknesses:
  - Colorbar tick labels (fontSize 12-13 CSS px) are the smallest text in the chart
    — could be nudged closer to the 14px used for the main axis ticks for better mobile-scale
    legibility
  - No explicit axis titles beyond the variable-name tick labels; acceptable for a
    correlation matrix but a small axis or figure caption ('Variables') would add
    clarity
  - Visual design is clean and functional but does not go beyond the diverging color
    intensity for storytelling — no highlight/annotation calls out the strongest relationships
    (e.g. Exercise-Steps 0.82, Stress-Mood -0.71)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "heatmap-annotated · javascript · muix · anyplot.ai" centered at top in dark ink (#1A1A17-family), fully visible with headroom above it. X-axis tick labels (Sleep, Exercise, Screen Time, Stress, Water, Steps, Mood) below the grid and mirrored Y-axis tick labels on the left, both in medium-gray ink, evenly sized and not overlapping. Diverging colorbar legend on the right labeled "Pearson r" with ticks from -1.0 to 1.0, fully inside the canvas with margin to spare.
      Data: 7x7 correlation matrix with rounded-corner cells colored via the Imprint diverging scale (matte red for negative, near-background midpoint near zero, blue for positive). Diagonal cells (self-correlation = 1.00) are deep blue. Each cell shows its numeric value to 2 decimals; text automatically switches between dark ink on pale cells and off-white ink on saturated cells, and every value is legible.
      Legibility verdict: PASS — all title, tick label, and colorbar text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now in light ink, fully visible with headroom above it. Axis tick labels now render in light gray, same relative sizing and spacing as the light render. Colorbar legend text is light-colored and fully legible, positioned identically to the light render.
      Data: Same 7x7 matrix with identical cell hues at the -1 (matte red) and +1 (blue) extremes as the light render — only the near-zero midpoint blends toward the dark background instead of the light one, which is the documented theme-adaptive behavior for imprint_div. Diagonal cells remain deep blue. Cell value text again auto-contrasts correctly — dark cells get light text, the few pale cells near zero get dark text — no dark-on-dark failures observed.
      Legibility verdict: PASS — all title, tick label, and colorbar text is clearly readable against the dark background; no dark-on-dark text found.
