review:
  strengths:
  - 'Builds the heatmap the community way: a custom layer inside ChartsContainer reads
    the band scales through useXScale/useYScale and useDrawingArea, so cells sit exactly
    on the MUI X axes without the Pro-only Heatmap'
  - Diverging Imprint map built from t.div with the theme-adaptive midpoint, centered
    at 0 on the fixed −1…1 Pearson scale; the color bar spans the full grid height
    with ticks at −1, −0.5, 0, 0.5, 1
  - 'Cell text switches between #1A1A17 and #FAF8F1 by the computed luminance of each
    cell, so every number is legible at both ends of the map in both themes'
  - Consistent two-decimal format, bold 20 px values centered in rounded cells with
    even gaps; clean title/subtitle hierarchy
  - Plausible, neutral wellness-correlation scenario (sleep, exercise, screen time,
    stress, mood) with a believable mix of signs and strengths
  weaknesses:
  - 'Suggestion: center the cell values with dominantBaseline="central" instead of
    the fixed +7 px y offset, so the centering survives a font-size change.'
  - 'Suggestion: the library prompt asks for limits that come from the data; for a
    non-correlation dataset the typed ±1 domain would need deriving (e.g. a symmetric
    max |value|), while for Pearson r the full −1…1 scale is fine as is.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400×2400 canvas.
      Chrome: bold dark title "heatmap-annotated · javascript · muix · anyplot.ai" centered (~52% width), soft subtitle "Pearson r matrix (7 × 7)"; row labels left and column labels below (Sleep, Exercise, Screen Time, Stress, Water, Steps, Mood) in dark inkSoft text; color bar on the right titled "Pearson r" with ticks −1.0 … 1.0. All readable.
      Data: 7×7 symmetric correlation matrix of rounded-corner cells; imprint_div red (#AE3030) ↔ cream midpoint ↔ blue (#4467A3); diagonal 1.00 cells deep blue with light text, strongest negative −0.71 (Stress–Mood) red with light text, pale cells carry dark text. Values in two decimals. No first-series green applies (continuous map).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle/ticks/row and column labels in light inkSoft, color bar labels light — no dark-on-dark text anywhere.
      Data: same red ↔ blue map with the theme-adaptive dark midpoint (#1A1A17), so near-zero cells are dark and the poles keep the same red/blue anchors as in light; all cell numbers switch to light text and stay legible on every cell, including the darkest near-zero ones.
      Legibility verdict: PASS
