review:
  strengths:
  - 'Repair correctly addressed both attempt-1 weaknesses: cells now use inset rounded
    rects (CELL_GAP/CELL_RADIUS) instead of edge-to-edge flat fills, and off-diagonal
    confusion noise was rebalanced onto visually/behaviorally similar species pairs
    (Cat/Dog, Bird/Rabbit, Dog/Horse), removing the arbitrary Bird<->Fish 6% cross-confusion'
  - Custom Chart.js plugin (beforeDatasetsDraw/afterDatasetsDraw) correctly builds
    an annotated heatmap that Chart.js has no native chart type for -- idiomatic use
    of the plugin hook system rather than reaching for an unsupported library
  - WCAG relative-luminance-based per-cell text color selection keeps all 36 count
    annotations readable regardless of how saturated the imprint_seq fill is
  - Diagonal outline highlighting correctly classified predictions, now rendered as
    rounded strokes matching the cell radius, creates a clean focal point for the
    confusion matrix
  - imprint_seq correctly chosen for single-polarity count data (0-100); data colors
    confirmed identical between light and dark renders, only chrome (title, ticks,
    diagonal outline, colorbar tick labels) flips
  - Title fontsize-scaling formula correctly avoids overflow for the ~89-char mandated
    title with descriptive prefix
  - Square orientation is the right call for a 6x6 grid-based plot; verified legible
    even at the 400px thumbnail render
  weaknesses:
  - Cell fills remain flat single-color rounded rects; no further gradient/texture
    refinement within a cell to push Design Excellence further
  - Diagonal focal treatment (outlined stroke) is still a fairly standard confusion-matrix
    convention rather than something that leans further into Chart.js-specific capabilities
  - Colorbar + luminance-based text contrast is a solid but fairly generic cross-library
    pattern rather than a distinctively Chart.js feature beyond the plugin hook itself
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Dark-ink title "Wildlife-camera Species Classifier · heatmap-annotated · javascript · chartjs · anyplot.ai" at top, clearly readable. "Predicted Species" (x) and "True Species" (y) axis titles in dark ink, balanced in size; species tick labels (Cat/Dog/Bird/Fish/Rabbit/Horse) legible on both axes. Colorbar ticks (0/25/50/75/100) and rotated "Test images (of 100)" label sit fully inside the canvas at the right, no clipping.
      Data: 6x6 confusion matrix cells are rounded, inset rects using imprint_seq (green #009E73 at low counts -> blue #4467A3 at high counts); all 36 cells carry a white/dark numeric annotation (contrast picked by luminance) readable against either fill. The 6 diagonal cells (correct predictions, 82-97) are outlined with a dark 3px rounded stroke, forming a clear focal point.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis titles, tick labels, and the diagonal outline all flip to light-colored tokens and remain fully readable; colorbar ticks and rotated label are likewise light and unclipped.
      Data: Cell colors confirmed identical to the light render (same green->blue gradient, same diagonal positions, same values) -- only chrome flipped as required. No dark-on-dark failures observed; no black text or hidden elements against the near-black surface.
      Legibility verdict: PASS
