review:
  strengths:
  - Custom Chart.js plugin (beforeDatasetsDraw/afterDatasetsDraw) correctly builds
    an annotated heatmap that Chart.js has no native chart type for -- idiomatic use
    of the plugin hook system rather than reaching for an unsupported library
  - WCAG relative-luminance-based per-cell text color selection keeps all 36 count
    annotations readable regardless of how saturated the imprint_seq fill is
  - Correctly applies the style guide's title fontsize-scaling formula for the ~86-char
    mandated title, avoiding overflow
  - Diagonal outline highlighting correctly classified predictions creates a clear
    focal point -- genuine data storytelling for a confusion matrix
  - imprint_seq colormap correctly chosen for single-polarity count data (0-100);
    data colors confirmed identical between light and dark renders
  - Square orientation is the right call for a 6x6 grid-based plot
  weaknesses:
  - 'Design excellence is competent but not exceptional: flat solid-fill cells with
    only a hairline grid and no additional refinement (e.g. subtle cell padding/rounding)
    -- more deliberate polish would lift DE-01/DE-02'
  - Bird<->Fish cross-confusion (6% each direction) is a bit arbitrary for visually
    dissimilar animal classes on a camera classifier -- slightly weakens realism,
    though not disqualifying
  - The colorbar + luminance-based text contrast is a solid but fairly generic cross-library
    pattern rather than something that leans further into Chart.js-specific capabilities
    beyond the plugin hook itself
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Dark ink title "Wildlife-camera Species Classifier · heatmap-annotated · javascript · chartjs · anyplot.ai" at top, clearly readable. "Predicted Species" (x) and "True Species" (y) axis titles in dark ink, balanced in size. Species tick labels (Cat/Dog/Bird/Fish/Rabbit/Horse) on both axes in medium-gray ink-soft, legible and similarly sized on both axes. Colorbar on the right with tick labels (0/25/50/75/100) in ink-soft and a rotated "Test images (of 100)" label in ink, fully within the canvas with no clipping.
      Data: 6x6 confusion-matrix grid, cells colored via imprint_seq (green #009E73 at low counts -> blue #4467A3 at high counts). All 36 cells carry a white-on-fill numeric annotation, readable against both the green and blue fills. The 6 diagonal cells (correct predictions, 82-93) are outlined with a dark 3px border, creating a clear focal point against the lower off-diagonal counts.
      Legibility verdict: PASS -- no light-on-light issues; all text and data are clearly distinguishable from the #FAF8F1 background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Title, axis titles, and tick labels have all flipped to light-colored ink/ink-soft tokens and remain fully readable. The diagonal outline flips from dark to a light stroke, still standing out clearly against the surrounding cell fills. Colorbar ticks and the rotated axis label are light-colored and legible, with no clipping at the right edge.
      Data: Cell fill colors are identical to the light render (green #009E73 -> blue #4467A3 gradient; diagonal cell values unchanged) -- only chrome flipped, as required. The white cell-number annotations remain the same and stay readable on both fills.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all chrome elements are clearly visible against the #1A1A17 background.
