review:
  strengths:
  - Correct dual-wave epidemic shape (sharp point-source peak followed by a broader
    propagated wave) matching the spec's outbreak-pattern guidance
  - Canonical Imprint stacking order (Confirmed=#009E73, Probable=lavender, Suspect=blue)
    with a clean matching legend
  - Intervention event lines (Lockdown Start, Vaccination Campaign) placed and labeled
    without overlapping the data
  - Secondary-axis cumulative-cases overlay with gridlines correctly suppressed on
    that axis to avoid double-grid clutter
  - Deterministic LCG-based synthetic data, clean theme-adaptive chrome, both renders
    fully legible
  weaknesses:
  - Annotation label font (13px) is a touch smaller than the rest of the chrome (14-16px)
    - bump to ~14px for consistent hierarchy
  - Design composition leans on Highcharts' standard chart layout; a shaded plotBand
    between the two intervention lines would reinforce the 'during-intervention' period
    and lift Design Excellence further
  - Library Mastery features used (dual-axis, plotLines) are idiomatic but common;
    no standout Highcharts-specific technique beyond that
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title, subtitle, axis titles ("Onset Date", "New Cases", "Cumulative Cases"), tick labels, and legend are all dark ink and clearly readable. Event-line labels ("Lockdown Start", "Vaccination Campaign") are readable and don't overlap bars.
      Data: Stacked columns — Confirmed (#009E73 brand green, first series), Probable (lavender), Suspect (blue) — canonical Imprint order. Amber dashed vertical lines mark intervention events. A black cumulative-cases line rides the secondary right y-axis.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, axis titles, tick labels, and legend all switched to light ink and remain fully legible. No dark-on-dark failures. Event-line labels remain readable against the dark surface.
      Data: Confirmed/Probable/Suspect bar colors identical to the light render (only chrome changed). Cumulative line switched from black to a light/white tone to stay visible against the dark background — correct theme-adaptive behavior for a semantic "neutral" line.
      Legibility verdict: PASS
