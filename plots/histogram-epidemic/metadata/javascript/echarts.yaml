review:
  strengths:
  - 'Attempt-1 palette-order violation is fully fixed: Probable and Suspect bars now
    use t.palette[1] and t.palette[2] (canonical order) instead of the previously
    skipped-ahead t.palette[3]/[5], with Confirmed correctly on t.palette[0] (#009E73).'
  - 'The ''Advisory issued'' markLine label no longer collides with the cumulative
    line: the new cumulativeMax headroom (1.2x final total, rounded to 50) plus the
    added label distance:6 keeps the annotation clear of the line''s inflection point
    in both renders.'
  - The post-intervention tail now tapers its noise term to zero over ~25 days (noiseScale),
    so the resolved outbreak reads as genuinely over instead of showing sporadic near-zero
    background noise indefinitely.
  - 'Implements every spec-notes feature at once: daily bins for a <3-month outbreak,
    case-type stacking (confirmed/probable/suspect) in distinct colors, an annotated
    intervention markLine, appropriate x-axis tick spacing, and a secondary-axis cumulative-case
    line overlay.'
  - 'Both renders are fully theme-adaptive: data colors are pixel-identical between
    light and dark, chrome (title, legend, ticks, grid, axis lines) flips correctly,
    and the ink-toned cumulative line correctly turns white in dark mode as a semantic
    (non-categorical) token.'
  - 'Clean, idiomatic single-option echarts config: deterministic LCG-seeded data,
    no imports, correct mount-node contract (no explicit size/devicePixelRatio, animation:
    false).'
  weaknesses:
  - 'Minor tick-label size inconsistency: x-axis ticks are fontSize 13 while y-axis
    ticks are fontSize 14 — barely perceptible but not perfectly balanced.'
  - Design is solid but stops short of a fully 'publication-ready' treatment — e.g.
    no subtle shading to visually group the pre-/post-intervention periods, which
    would sharpen the story beyond the single dashed marker line.
  - The scenario shows a single clean point-source wave; DQ-01 feature coverage would
    be even stronger with a secondary smaller wave or plateau segment to demonstrate
    more of the epi-curve pattern vocabulary described in the spec (point-source vs.
    propagated vs. continuous), though this is not a required feature.
  - 'LM-02: markLine + dual-axis are used correctly but are fairly standard echarts
    patterns — a more distinctive touch (e.g. a custom tooltip formatter, graphic/markArea
    shading for the intervention window) would better showcase echarts-specific strengths.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (verified by pixel sample) - not pure white, not dark.
      Chrome: Title "histogram-epidemic · javascript · echarts · anyplot.ai" is centered, dark ink text, fully legible. Legend (Confirmed / Probable / Suspect / Cumulative cases swatches) sits directly below the title in dark text. Left y-axis "New cases" and right y-axis "Cumulative cases" labels are dark/soft-ink and fully legible, not clipped at either edge. X-axis "Symptom onset date" label and date tick labels (3/1 ... 4/25) are legible and evenly spaced with no overlap. Horizontal gridlines are subtle. The dashed amber "Advisory issued" markLine with its rotated label sits clear of the cumulative line's inflection point (verified via close crop) — no overlap.
      Data: Stacked bars - Confirmed = brand green #009E73 (first series, correct), Probable = lavender (palette[1]), Suspect = blue (palette[2]) - canonical Imprint order, all clearly distinguishable from the warm background and each other. Cumulative line renders in dark ink (theme-neutral, correct semantic choice for a non-categorical series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black, not light.
      Chrome: Title, legend, axis names, and tick labels all render in light/soft-white text, fully legible against the dark surface. No dark-on-dark failures anywhere. Gridlines remain subtle. The dashed amber markLine and "Advisory issued" label are legible and, as in light mode, do not overlap the cumulative line's inflection point.
      Data: Confirmed/Probable/Suspect bar colors are pixel-identical to the light render (green/lavender/blue) - only chrome flipped as required. The cumulative line correctly switches from dark ink to white/light ink (a theme-adaptive chrome token, not a data color, so this is expected and correct).
      Legibility verdict: PASS
