review:
  strengths:
  - Correct stacked-bar epi curve with case-type classification (Confirmed/Probable/Suspect),
    matching the spec's core plot-type requirement.
  - Dual y-axis with a cumulative-case line overlay exactly as suggested in the spec
    notes, using the theme-neutral ink token (not a categorical color) for the totals
    line — a good semantic choice.
  - markLine annotation marks the public-health advisory intervention, matching the
    'mark key intervention events' requirement.
  - 'Both renders are fully theme-adaptive: data colors are identical between light
    and dark, chrome (title, ticks, grid, axis lines) flips correctly, no dark-on-dark
    or light-on-light failures.'
  - 'Clean, idiomatic single-option echarts config; deterministic LCG-seeded data
    generation; no imports; correct mount-node contract (no explicit size/devicePixelRatio,
    animation: false).'
  weaknesses:
  - 'Palette order violation (VQ-07): Probable and Suspect series use t.palette[3]
    (ochre) and t.palette[5] (cyan) instead of the canonical t.palette[1] (lavender)
    and t.palette[2] (blue). Case-type categories (confirmed/probable/suspect) don''t
    carry a strong universal color convention that would justify the semantic exception
    — switch to t.palette[1] and t.palette[2] to follow the ''use positions 1→N in
    canonical order'' hard rule.'
  - The 'Advisory issued' markLine label overlaps the dashed vertical line and touches
    the cumulative line's inflection point in both themes, slightly hurting legibility
    — reposition the label (e.g. move it above the plot area with an offset, or shorten/relocate
    it) so it doesn't visually merge with the line strokes.
  - The long sporadic tail of near-zero case reports from ~4/1 through 4/29 reads
    slightly unrealistic for a resolved point-source foodborne outbreak — consider
    tapering fully to zero a few days after the intervention, or note the noise as
    unrelated background surveillance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) — not pure white, not dark. Matches the required light surface.
      Chrome: Title "histogram-epidemic · javascript · echarts · anyplot.ai" is centered, dark ink text, fully legible. Legend below the title (Confirmed / Probable / Suspect / Cumulative cases swatches) is dark text, readable. Left y-axis "New cases" and right y-axis "Cumulative cases" labels are dark/soft-ink, legible and not clipped at either edge. X-axis "Symptom onset date" label and rotated date tick labels (3/1 … 4/29) are legible. Horizontal gridlines are subtle, non-competing. Vertical dashed amber markLine with rotated "Advisory issued" label is readable, though it visually overlaps the cumulative line's inflection point.
      Data: Stacked bars — Confirmed = brand green #009E73 (first series, correct), Probable = ochre, Suspect = cyan, all clearly distinguishable from the warm background and from each other. Solid black cumulative line (ink-neutral token, not a categorical color) rises then plateaus, correctly plotted on the secondary axis.
      Legibility verdict: PASS (all title/axis/tick/legend text reads clearly against the light background; no light-on-light).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) — not pure black, not light. Matches the required dark surface.
      Chrome: Title, legend, and both y-axis titles/tick labels flip to light ink and are fully legible against the dark background. Grid lines remain subtle. The amber dashed markLine and "Advisory issued" label remain visible and legible (same overlap issue as in light, not a legibility failure).
      Data: Confirmed/Probable/Suspect bar colors are pixel-identical to the light render (green/ochre/cyan) — only chrome flipped, as required. The cumulative line switches from black to off-white (ink token), correctly theme-adaptive, and remains clearly visible against the dark background.
      Legibility verdict: PASS (no dark-on-dark text; all chrome elements readable; brand green #009E73 reads well on the dark surface).
