review:
  strengths:
  - 'Correct Imprint palette usage: Confirmed=#009E73, Probable and Suspect follow
    canonical order 2/3, and the cumulative line correctly uses the theme-adaptive
    neutral ink anchor (a totals/baseline series, per the style guide) rather than
    a categorical color'
  - 'Both renders are theme-correct: backgrounds match #FAF8F1/#1A1A17, all text (title,
    ticks, axis labels, legend, annotation) stays legible with no dark-on-dark or
    light-on-light failures, and data colors are identical across themes'
  - 'Faithfully implements the spec''s suggested secondary-axis feature: a genuine
    dual-axis combo (stacked daily bars + cumulative case line) with correctly labeled
    left/right axes'
  - Intervention annotation (lockdown line + label) is cleanly separated from the
    bars with no overlap, using the amber semantic anchor appropriately for a 'warning/event'
    marker
  - Deterministic seeded LCG data generation produces a realistic, single-wave outbreak
    curve with plausible confirmed/probable/suspect proportions
  - Explicit font sizing throughout (14-22px), canvas is exactly 3200x1800 with no
    clipping, and the plot remains readable even scaled down to ~400px mobile width
  - 'Clean, idiomatic D3: d3.stack for the stacked series, d3.scaleBand/scaleLinear,
    curveMonotoneX for the cumulative line, no fake interactivity, no unused imports'
  weaknesses:
  - 'Design Excellence is solid but not maximal: only horizontal gridlines and subtle
    axis domain lines are used for refinement; a peak-value callout or subtler grid
    could push the storytelling further'
  - Library Mastery is good but generic relative to D3's full toolkit — the same visual
    could be approximated in a higher-level charting library; nothing uses a feature
    that is uniquely D3 (e.g. custom interpolation, voronoi, or force layout) beyond
    d3.stack
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "COVID-19 Outbreak by Symptom Onset · histogram-epidemic · javascript · d3 · anyplot.ai" in bold dark text, clearly readable. Left y-axis "Daily New Cases" and right y-axis "Cumulative Cases" both rotated and readable. X-axis date ticks (Mar 01 ... Apr 26) at weekly intervals, dark-gray tick labels, all legible. Legend (Confirmed / Probable / Suspect / Cumulative cases) sits directly below the title, no overlap with data. Amber dashed "Lockdown announced" annotation line and label sit clearly above the tallest bars with a visible gap — no overlap.
      Data: Stacked bars — green (Confirmed, #009E73), lavender (Probable), blue (Suspect) — rising to a peak around Mar 17-19 then declining after the lockdown line, consistent with a controlled point-source outbreak. Solid near-black cumulative-case line (theme-adaptive neutral ink) climbs smoothly on the right-hand scale to ~1,800.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and all axis labels/ticks render in light/white text, fully readable against the dark background. Legend text is light-colored and legible. The amber "Lockdown announced" line and label remain visible and legible on the dark surface — no dark-on-dark issues found anywhere (title, ticks, axis titles, legend, annotation all checked).
      Data: Confirmed/Probable/Suspect bar colors are pixel-identical to the light render (green/lavender/blue), confirming the categorical data palette does not flip with theme. The cumulative line flips from near-black to near-white (the theme-adaptive neutral anchor, not a categorical color), correctly implementing chrome-only flipping for this baseline/total series.
      Legibility verdict: PASS
