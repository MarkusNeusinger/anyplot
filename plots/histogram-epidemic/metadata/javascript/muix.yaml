review:
  strengths:
  - Uses the ChartContainer composition API (BarPlot + LinePlot + dual ChartsYAxis)
    to cleanly combine stacked daily bars with a secondary cumulative-cases axis,
    exactly matching the spec's Notes section
  - Two overlapping Gaussian waves plus per-day noise produce a realistic propagated-transmission
    epi curve shape, with the case-type split (confirmed/probable/suspect) always
    summing back to the daily total
  - ChartsReferenceLine annotations mark the lockdown and vaccination-campaign events
    with dashed amber lines and readable labels in both themes
  - Grid lines, axis lines, and tick/label colors are correctly threaded from window.ANYPLOT_TOKENS
    (t.grid, t.inkSoft, t.ink) so chrome flips properly between light and dark
  - A documented, deliberate slotProps.axisLabel offset fix prevents the rotated 'Cumulative
    cases' label from colliding with the 3-digit right-axis tick numbers
  - Deterministic fixed-seed LCG data generation with no external dependencies
  weaknesses:
  - Reference-line annotation text ('Lockdown start', 'Vaccination campaign') and
    axis tick labels become quite small once the chart is scaled to the ~400px mobile
    preview — a slightly bolder weight would help legibility at that size
  - Data colors are pulled directly from the Imprint token order with no additional
    custom accents beyond the reference-line amber, so the palette work is competent
    but not distinctive
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "histogram-epidemic · javascript · muix · anyplot.ai" is centered, fully visible, dark ink text. A top-center legend lists Confirmed (green), Probable (violet), Suspect (blue-gray), Cumulative cases (black swatch matching the line). Left y-axis "Daily new cases" (0-50) and right y-axis "Cumulative cases" (0-1,200) both render in dark ink with visible tick marks; x-axis "Onset date" shows weekly-interval date labels (Jan 1, Jan 8, ... Feb 26). Horizontal grid lines are thin and subtle. Two dashed amber vertical reference lines are labeled "Lockdown start" and "Vaccination campaign" in dark text, positioned clear of the bars behind them.
      Data: Stacked bars (green/violet/blue-gray) show two overlapping epidemic waves peaking around Jan 15 and Feb 11-13; a smooth black cumulative-cases line rises steeply through the outbreak and plateaus after the vaccination campaign marker, reaching ~1,190 total.
      Legibility verdict: PASS — all title, axis, legend, and reference-line text is clearly readable against the light background; no overlap between reference-line labels, bars, or the cumulative line was found on close inspection.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Same title, legend, and axis layout as the light render, now rendered in light/off-white ink. The "Cumulative cases" legend swatch and the cumulative line itself flip from black to off-white, correctly following the ink token rather than staying a fixed color. Reference-line labels ("Lockdown start", "Vaccination campaign") render in light text and remain fully readable, with no dark-on-dark failures anywhere (title, axis ticks, axis titles, legend text, reference-line labels all confirmed legible).
      Data: Bar colors (green/violet/blue-gray) are pixel-identical to the light render — only the line/legend chrome color changed as expected. Wave shape and cumulative curve match the light render exactly.
      Legibility verdict: PASS — no dark-on-dark or light-on-light issues found in either render.
