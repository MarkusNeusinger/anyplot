review:
  strengths:
  - 'Correct Imprint palette: confirmed bars use #009E73 (brand green) first, then
    canonical lavender/blue for probable/suspect, identical across both themes'
  - 'Data tells a real epidemiological story: two overlapping Gaussian waves model
    a propagated-transmission outbreak, with lockdown/vaccination reference lines
    and a cumulative-cases overlay for total-burden context'
  - 'Full spec feature coverage: daily bins, stacked case-type classification, annotated
    intervention lines, dual y-axis with cumulative line overlay, all present and
    correctly mapped'
  - Idiomatic, non-trivial MUI X composition using ChartContainer + BarPlot/LinePlot/ChartsReferenceLine
    rather than the single high-level <BarChart>, leveraging the library's composable
    architecture
  - Deterministic seeded LCG data generation, clean KISS code structure, skipAnimation
    set correctly
  weaknesses:
  - 'Severe text overlap on the right (cumulative) y-axis: the rotated ''Cumulative
    cases'' axis label is rendered directly on top of its own tick labels (700, 600,
    500 all visibly merged with the label letters) in BOTH light and dark renders,
    making those tick values essentially unreadable. This is a genuine layout bug,
    not a proximity issue — the right ChartsYAxis needs more separation between its
    label and tick text (increase margin.right further and/or offset the axis label
    away from the tick column, e.g. via the axis label''s style/position props), unlike
    the left ''Daily new cases'' axis which has correct spacing.'
  - 'Visual Refinement is at library-default level: MUI X''s default axis lines/spines
    and grid are largely untouched — remove or lighten unnecessary axis lines and
    tighten whitespace for a more polished look.'
  - Aesthetic sophistication is at 'well-configured default' level rather than publication-ready
    — consider more deliberate typography hierarchy and chrome refinement beyond the
    default MUI X look.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — correct light theme surface.
      Chrome: Title "histogram-epidemic · javascript · muix · anyplot.ai" is centered, dark ink, fully legible. Left y-axis "Daily new cases" and x-axis "Onset date" labels/ticks are dark ink on the light background and clearly readable with good spacing from their tick numbers. However, the RIGHT y-axis title "Cumulative cases" is rendered directly overlapping its own tick labels (700, 600, 500 are visually merged with the rotated label text) — this is a real overlap defect, confirmed by pixel-level zoom, not a false positive.
      Data: Two overlapping bell-shaped waves of stacked bars (Confirmed = #009E73 brand green, Probable = lavender/purple, Suspect = blue), plus a black cumulative-cases line and two amber dashed reference lines ("Lockdown start", "Vaccination campaign"). First series is correctly brand green.
      Legibility verdict: FAIL — the right-axis tick labels (700/600/500 at minimum) are overlapped by the axis title and effectively unreadable at those points.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — correct dark theme surface.
      Chrome: Title and left-axis text are correctly rendered in light ink (near-white) and fully readable against the dark background. The cumulative line correctly flips to a light/white color for contrast (theme-adaptive "neutral" role, appropriate for a totals overlay). Same right-axis overlap defect reproduces here: "Cumulative cases" label overlaps 700/600/500 tick labels identically to the light render, confirmed by pixel zoom — no dark-on-dark issue otherwise.
      Data: Colors identical to the light render (bars: green/lavender/blue, amber dashed reference lines) — only chrome flipped correctly.
      Legibility verdict: FAIL — same right-axis tick-label overlap as the light render.
