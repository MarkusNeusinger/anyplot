review:
  strengths:
  - Composes the epi curve natively from ChartsContainer + BarPlot + LinePlot with
    two y-axes (daily cases left, cumulative right), so the stacked daily bars and
    the never-falling cumulative line share one date band axis without being mistakable
    for each other
  - 'Daily bins over a 63-day outbreak with bars stacked Confirmed/Probable/Suspect
    in the same order in every bar, colored Imprint positions 1-3 (#009E73, #C475FD,
    #4467A3) identically in both themes'
  - Interventions drawn with native ChartsReferenceLine on the band axis, dashed in
    the amber anchor and annotated 'Lockdown start' / 'Vaccination campaign' in ink
    at the top of the plot, clear of bars and the cumulative line
  - tickLabelInterval places a date tick every 7 days (Jan 1, Jan 8, ...) so bars
    are located in time without crowding the axis; axis bands sized explicitly (height
    60, widths 80/92) so no tick label truncates
  - Data-derived subtitle (63 days, total 1,182 cases, peak 46/day on Jan 14) gives
    the reader the outbreak's headline numbers above a clear title > subtitle > legend
    hierarchy
  - Plausible two-wave outbreak with a lockdown after the first peak and a vaccination
    campaign during the second wave's decline; deterministic LCG data
  - Theme chrome threaded from ANYPLOT_TOKENS (ink, inkSoft, grid, pageBg) — all text
    readable in both renders; skipAnimation set on container and plots; tooltips available
    in the HTML output
  weaknesses:
  - 'Suggestion: the amber (#DDCC77) dashed intervention lines are pale against the
    #FAF8F1 page in the light render; a slightly heavier stroke would give them more
    presence there.'
  - 'Suggestion: the legend is hand-built from Box/Typography; MUI X''s native ChartsLegend
    (inside ChartsDataProvider/ChartsWrapper) would derive it from the series labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: bold dark title "histogram-epidemic · javascript · muix · anyplot.ai" centered at top, grey subtitle "63 days (Jan 1–Mar 3) · Total 1,182 cases, peak 46/day on Jan 14", one-row legend (Confirmed, Probable, Suspect swatches + black line "Cumulative cases (right axis)"). Left axis "Daily New Cases" 0–50, right axis "Cumulative Cases" 0–1,200, x-axis "Symptom Onset Date" with weekly ticks Jan 1 … Feb 26. Subtle horizontal grid. All text dark and readable.
      Data: 63 adjacent daily bars (hairline separators) stacked green #009E73 (Confirmed) / lavender #C475FD (Probable) / blue #4467A3 (Suspect); first wave peaking at 46 on Jan 14, second wave ~31 around Feb 9–11, thin tail to Mar 3. Black monotone cumulative line rising to ~1,182. Two amber dashed vertical lines labelled "Lockdown start" (Jan 21) and "Vaccination campaign" (Feb 15) at the top; the amber is pale but visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, legend text, axis titles and tick labels in light ink/soft-ink, all clearly readable; no dark-on-dark text. Grid lines subtle dark grey, visible.
      Data: bar colors identical to light render (green / lavender / blue); cumulative line flips to light ink as the neutral anchor; amber dashed event lines and their light labels clearly visible. Brand green reads well.
      Legibility verdict: PASS
