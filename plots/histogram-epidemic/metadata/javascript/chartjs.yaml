review:
  strengths:
  - 'Faithfully implements every spec requirement: case-type stacking, intervention
    annotation lines, and a secondary-axis cumulative overlay.'
  - Intervention markers are implemented natively via a Chart.js afterDraw plugin
    hook -- no forbidden external annotation plugin.
  - 'Both themes are fully legible: warm off-white/near-black backgrounds, all chrome
    text readable, and the three categorical bar colors are pixel-identical across
    light and dark.'
  - Realistic, neutral epidemiological narrative (point-source peak followed by a
    broader propagated wave, rising lab-confirmation share over time).
  - Deterministic, reproducible data generation via a tiny seeded LCG.
  weaknesses:
  - The cumulative-cases line dataset is colored with the chrome token t.ink, so it
    renders black in the light theme and white in the dark theme -- this violates
    the rule that data colors must be identical between light and dark, only chrome
    flips. Recolor the 4th series with a fixed Imprint palette color (e.g. t.palette[3])
    so it stays consistent across themes while remaining visually distinct from the
    stacked bars.
  - Data-generation and plugin code use a handful of small helper functions (nextRand,
    gaussian, interventionMarkerPlugin.afterDraw) rather than fully flat script code
    -- acceptable given the plugin requirement, but worth flattening where easy.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "histogram-epidemic · javascript · chartjs · anyplot.ai" in dark bold text, fully readable. Legend (Confirmed/Probable/Suspect/Cumulative cases) in dark text with clear swatches. Axis titles "Symptom onset date", "New cases per day", "Cumulative cases" all dark and legible. Two amber dashed intervention lines with dark, non-overlapping labels ("Contaminated batch recalled", "Contact-tracing expanded"). Horizontal gridlines subtle but visible.
      Data: Stacked daily bars show a sharp point-source peak (~Apr 13-15) followed by a broader propagated wave (peaking mid-May); first series (Confirmed) is #009E73 brand green, Probable is magenta/purple, Suspect is blue-gray. Cumulative-cases line (black) overlaid on secondary right-hand y-axis, rising monotonically to ~1650.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Title, legend text, axis titles, and tick labels render in light/cream color, all clearly legible against the dark surface. Intervention labels remain legible (dark amber dashed lines, light text). No dark-on-dark or light-on-light failures found.
      Data: The three stacked bar colors (green, magenta, blue-gray) are visually identical to the light render, as required. The cumulative-cases line and its legend swatch flip from black (light) to white/cream (dark) because the code colors that series with the chrome token t.ink rather than a fixed palette color -- this is a data series adopting chrome-adaptive coloring, flagged as a weakness (VQ-07).
      Legibility verdict: PASS
