review:
  strengths:
  - 'Correct pygal StackedBar epi curve: 90 daily bins stacked Confirmed/Probable/Suspect
    in Imprint order, first series #009E73, same order in every bar'
  - Grid guides colored from INK_MUTED, so the event guides and the y grid stay a
    muted, visible tone in the dark render as well
  - Tick, major-label and legend fonts all at 44 px, so both axes read at one size
  - Per-value tooltip dicts carry the date, day total and the intervention name in
    the interactive HTML
  - Tidy long table with column constants, pivoted into series, so the code adapts
    to a user's own data
  weaknesses:
  - 'SC-02 (both): only two date ticks (Jan 15, Apr 13) remain because every intervention
    tick replaces its date with the event name, so the bars and events cannot be placed
    in time (C2) → date ticks at a regular interval, e.g. weekly or every two weeks,
    alongside the event markers. Likely cause: major_idx built from the interventions
    plus the first and last day only, and the event label replacing the date string.'
  - 'SC-02 (both): the intervention lines are the ordinary thin dotted x grid guides,
    drawn behind the bars, so through the waves they are hidden and read as grid rather
    than events (C4) → event lines distinct from the grid and visible against the
    bars. Likely cause: show_x_guides at the major labels standing in for event lines.'
  - 'VQ-05 (both): about the bottom 13% of the canvas (~230 px) is empty below the
    legend while the plot area is squeezed → reclaim it for the plot (about −150 px).
    Likely cause: margin_bottom=180 on top of the bottom legend.'
  - 'Suggestion: a cumulative case line on a secondary axis (chart.add(..., secondary=True))
    would add total-burden context the Notes suggest.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title "Epidemic Curve (Respiratory Outbreak) · histogram-epidemic · python · pygal · anyplot.ai" in dark ink, ~80% width; y-axis title "New Cases (Daily)", x-axis title "Date of Symptom Onset"; y ticks 10-60, x major labels rotated 45°: Jan 15, ▼ Cluster Identified, ▼ Contact Tracing, ▼ Quarantine Order, ▼ Vaccination Drive, ▼ Outbreak Contained, Apr 13, all at 44 px. Dotted muted grid on y and at the major x labels. Legend at the bottom in three columns. About 13% of the canvas empty below the legend.
      Data: 90 daily stacked bars, Confirmed #009E73 (bottom), Probable #C475FD, Suspect #4467A3; two waves peaking ~39 (early Feb) and ~55 (mid March) with a long thin tail.
      Legibility verdict: PASS

