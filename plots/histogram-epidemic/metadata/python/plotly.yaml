review:
  strengths:
  - Right-axis title and ticks colored to match the ochre cumulative line
  - Imprint palette in canonical order with theme-correct chrome in both renders
  - Idiomatic Plotly stacked bars with a yaxis2 overlay and paper-referenced intervention
    shapes and annotations
  - hovermode='x unified' with spike lines and per-trace hovertemplates in the HTML
  - Realistic, seeded two-season ILI surveillance data with weekly bins
  weaknesses:
  - 'VQ-02, VQ-05 (both): the horizontal legend box sits over the x-axis area, covering
    the middle date tick labels and the x-axis title ''Week of Symptom Onset'' → place
    the legend above the plot (yanchor=''bottom'', y≥1.02 with matching top margin)
    so the axis is clear. Likely cause: legend placement interacts with the bottom
    margin and rotated ticks.'
  - 'VQ-02 (both): the left ''Flu vaccine rollout'' annotation box covers the tops
    of the tallest first-season bars → keep it clear of the data with case-axis headroom
    or a label above the plot area. Likely cause: annotation y=0.85 paper while the
    bars reach the plot top.'
  - 'VQ-01, SC-02 (both): five of eight rotated quarterly date ticks lose their leading
    letters (''pr 2023'', ''ul 2023''), so the date axis is crowded and partly unreadable
    (C2) → horizontal ticks (tickangle=0) clear of the legend. Likely cause: tickangle=-30
    under the legend box.'
  - 'VQ-05 (both): a wide empty band separates the title from the plot area → let
    the plot start just under the title. Likely cause: margin t=90 with the title
    at y=0.93 and the legend moved below.'
  - 'SC-02 (both): the weekly bars are separated by visible gaps, so the curve reads
    as a bar chart rather than adjacent bins (C1) → bargap=0. Likely cause: bargap=0.15.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 — correct.
      Chrome: centered dark title 'histogram-epidemic · python · plotly · anyplot.ai'; left axis 'Weekly New Cases' 0–350, right ochre axis 'Cumulative Cases' 0/5k/10k/15k; quarterly date ticks rotated -30°. The boxed horizontal legend sits at the bottom over the x-axis area: it covers the middle date tick labels ('pr 2023', 'ul 2023', 'ct 2023', 'an 2024', 'pr 2024' remain) and the x-axis title 'Week of Symptom Onset' runs through its lower edge. A wide empty band separates the title from the plot.
      Data: 104 weekly stacked bars with small gaps, Confirmed #009E73, Probable #C475FD, Suspect #4467A3; two winter waves (~370 and ~330); ochre #BD8233 cumulative line rising to ~16k; red #AE3030 and cyan #2ABCCD dash-dot vaccine-rollout lines with boxed labels, the left box covering the tops of the tallest first-season bars.
      Legibility verdict: FAIL — several date tick labels and the x-axis title are partly hidden by the legend.

