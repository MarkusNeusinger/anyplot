      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title 'histogram-epidemic · python · bokeh · anyplot.ai' at about 55 % width; italic axis titles 'Date of symptom onset', 'New cases (per day)', 'Cumulative cases' (right); date ticks Jan 15 … Apr 15 with 2024, count ticks 0–80, cumulative ticks 0–1,500; legend panel titled 'Case classification' top right. All dark text, readable.
