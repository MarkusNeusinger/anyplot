review:
  strengths:
  - vbar_stack over one ColumnDataSource stacks Confirmed/Probable/Suspect in the
    same order in every daily bin, with the bin width derived from the data so bars
    sit edge to edge
  - Cumulative burden on its own labeled secondary axis (extra_y_ranges + LinearAxis),
    drawn as a muted ink line that cannot be mistaken for the daily counts and stays
    clear of the legend
  - Intervention events as dashed Spans with bold Labels, the source event in matte
    red and the response in neutral ink, visible in both themes
  - 'Theme chrome threaded through every element: both renders readable, data colors
    identical across themes'
  - HoverTool in vline mode shows date, daily total and running cumulative in the
    HTML artifact
  weaknesses:
  - 'Suggestion: a slightly heavier cumulative line (line_width about 4–5) would give
    the secondary series more presence at full canvas size.'
  - 'Suggestion: concrete event labels (for example the implicated venue closed) would
    tell more than the generic ''Intervention Began''.'
