review:
  strengths:
  - Secondary axis spine, ticks and label colored to the cumulative series, so the
    second scale reads as belonging to the red line
  - withStroke halos keep the intervention labels readable over bars and grid in both
    themes
  - Idiomatic twinx + mdates.WeekdayLocator/DateFormatter and a combined legend built
    from both axes' handles
  - Realistic two-wave outbreak with plausible classification shares and a monotone
    cumulative line on its own labeled axis
  - Full Imprint palette fed to set_prop_cycle, so the classifications take positions
    1-3 in canonical order
  weaknesses:
  - 'SC-02 (both): bars are drawn 0.8 day wide on daily bins, leaving a visible gap
    between every pair of adjacent bars, so the curve misses C1 (adjacent bars with
    no gaps) → bar width equal to the 1-day bin (+0.2 day). Likely cause: bar_width
    = 0.8 in ax.bar.'
  - 'SC-03 (both): the secondary Cumulative Cases axis runs below zero to about -110,
    so its 0 tick and the cumulative fill sit above the bar baseline and a count that
    cannot be negative gets a negative range → start the axis at 0 (+110). Likely
    cause: auto limits on ax2 with no ax2.set_ylim(bottom=0).'
  - 'Suggestion: a slightly lighter cumulative fill (or none) would let the bars carry
    the page alone.'
