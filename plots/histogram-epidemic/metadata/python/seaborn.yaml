review:
  strengths:
  - sns.histplot reads the tidy table directly with weights=CASE_COUNT, hue and multiple='stack'
    over explicit weekly date bin edges — no row expansion
  - Weekly bins start on the first onset date and are derived from the data range;
    bars adjacent from zero in a consistent Confirmed/Probable/Suspect order
  - Cumulative line on its own labeled secondary axis in a muted tone, never falling
    and clearly distinct from the weekly bars
  - Intervention labels now at 8pt, left-aligned beside their dashed lines and clear
    of the legend
  - Theme tokens threaded through all chrome; both renders readable, Imprint colors
    identical across themes
  weaknesses:
  - 'VQ-02 (both): the cumulative line runs through the ''aign'' of the ''Vaccination
    Campaign'' label, and the opaque ''Travel Restrictions'' box covers the body of
    the Mar 4 peak bar → place each label where neither the cumulative line nor a
    bar passes (e.g. a label height chosen per event from the line and bar heights
    at that date). Likely cause: both labels at the fixed height y_max * 0.86, with
    ax2 (the line) drawn above ax''s annotations.'
  - 'SC-03 (both): the secondary axis runs down to about -400 cumulative cases, so
    its 0 sits above the bar baseline and shows impossible negative counts → start
    it at 0 level with the bar baseline. Likely cause: ax2 keeps matplotlib''s default
    margins; ax2.set_ylim(bottom=0).'
  - 'SC-04 (both): the amber peak-period shading has no key and no label, so a reader
    cannot tell what it marks → add a ''Peak period'' entry to the combined legend
    (or drop the band). Likely cause: the axvspan has no label and no handle in the
    legend.'
  - 'Suggestion: a sns.move_legend call could place the combined legend without rebuilding
    it by hand.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title "histogram-epidemic · python · seaborn · anyplot.ai" in dark ink at ~75 % of the width; x label "Date of Symptom Onset", left y label "New Cases (Weekly)", right y label "Cumulative Cases" in INK_SOFT; 2-week Monday ticks Jan 15 – May 20 rotated 45°; subtle horizontal grid; boxed legend upper left (Confirmed, Probable, Suspect, Cumulative Cases). All readable.
      Data: 17 adjacent weekly stacked bars — Confirmed #009E73, Probable #C475FD, Suspect #4467A3 — peaking at ~1180 in the week of Mar 4, a second small wave late April. Dark-grey cumulative line to ~8700 on the right axis (which extends to about -400). Faint amber band over the three peak weeks. Dashed grey lines at Feb 20 and Mar 25 with boxed semibold 8pt labels "Travel Restrictions" and "Vaccination Campaign"; the cumulative line crosses the bottom of "Campaign", and the Travel box sits over the Mar 4 bar body.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels and ticks in light tones (#F0EFE8 / #B8B7B0); legend and label boxes on the #242420 elevated surface with light text. No dark-on-dark text.
      Data: bar colors identical to the light render; bar edges in the page color; light-grey cumulative line; amber band reads as a dim olive zone; dashed lines visible against bars. Same line-through-'Campaign' crossing as in light.
      Legibility verdict: PASS
