review:
  strengths:
  - sns.histplot with weights=CASE_COUNT, hue_order and explicit weekly date bin edges
    draws the stacked epi curve straight from the tidy table
  - Intervention labels are placed in axes coordinates in a reserved headroom band,
    so they never collide with bars or the cumulative line
  - Cumulative line on a secondary axis that starts at 0 on the bar baseline, in a
    muted ink tone that keeps it subordinate to the counts
  - Data-derived peak period shading is keyed in the single combined legend
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'Suggestion: the 120-day series ends on May 13, so the last weekly bin holds 1
    of 7 days and its ~30-case bar reads as a sharp drop; a series that ends on a
    week boundary (119 or 126 days) avoids the partial bin.'
  - 'Suggestion: anchoring the two y-axes to a shared gridline step would let the
    right-hand ticks line up with the left grid.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
      Chrome: title 'histogram-epidemic · python · seaborn · anyplot.ai' centered in dark ink; axis titles 'Date of Symptom Onset', 'New Cases (Weekly)' and right 'Cumulative Cases'; rotated bi-weekly date ticks Jan 15 – May 20; all readable.
      Data: 18 adjacent weekly stacked bars, Confirmed #009E73, Probable #C475FD, Suspect #4467A3, peaking at ~1180 in the week of Mar 4 with a second hump around Apr 22; dark-gray cumulative line rising to ~8700 on the right axis (0 to ~10900, zero on the baseline); amber peak band Mar 4 – Mar 25; dashed intervention lines at Feb 20 and Mar 25 with 'Travel Restrictions' and 'Vaccination Campaign' boxes at the top of the axes, clear of bars and line; legend upper left with five entries.
