review:
  strengths:
  - 'Daily stacked epi curve with width=1.0 geom_col: adjacent bars over 90 equal
    daily bins, stacked Confirmed (bottom, #009E73) / Probable (#C475FD) / Suspect
    (#4467A3) in the same order in every bar'
  - Intervention lines drawn idiomatically from the data via geom_vline(data=events,
    aes(xintercept=...)) and labelled from the same rows with geom_text, so a user's
    own event table drives both
  - 'Clear typographic hierarchy for the annotations: muted italic intervention labels,
    bold ink peak labels, and the cumulative total set in the line''s own ochre so
    it reads as that line''s label'
  - Frameless legend on the elevated surface with legend_key matched to it, y-only
    subtle grid and an L-shaped axis frame; chrome fully theme-adaptive and readable
    in both renders
  - Realistic two-wave outbreak (peaks of 70 and 43 cases/day, 2,217 total) with stack
    order and fill limits taken from the data rather than typed
  weaknesses:
  - 'VQ-01 (both): the intervention labels (''Lockdown'', ''Vaccination campaign'',
    muted italic) and the peak and cumulative annotations are set at 6 pt, below the
    8 pt tick-label reference, and the muted italic intervention labels read small
    beside the 8 pt ticks → 8 pt (+2 pt). Likely cause: geom_text/annotate size=6.'
  - 'SC-02 (both): the cumulative case line (C5) is rescaled onto the daily case-count
    axis, so the 2,217-case total is drawn at the height of 70 cases/day and has no
    labeled axis of its own; only the end label names its value → give the cumulative
    line a scale of its own a reader can read (labeled round cumulative totals along
    the line) or leave the optional line out. Likely cause: cumulative_scaled = cumulative
    / max_cumulative * max_daily, since plotnine has no secondary axis.'
  - 'Suggestion: the legend sits a little far above the panel; tightening legend_box_spacing
    would bring it closer to the bars it explains.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Bold dark title "histogram-epidemic · python · plotnine · anyplot.ai" centred at the top (~55 % of width). Frameless legend "Case Classification: Confirmed, Probable, Suspect" on the elevated off-white surface below the title. Axis titles "Date of Symptom Onset" and "Number of New Cases (per day)" in dark ink; tick labels in INK_SOFT (dates every two weeks Jan 15 to Apr 08, rotated 45°; counts 0-80). Subtle y-only grid, L-shaped axis lines. All readable.
      Data: 90 adjacent daily stacked bars, Confirmed #009E73 at the bottom, Probable #C475FD, Suspect #4467A3 on top; two waves peaking at 70 and 43 cases/day. Ochre #BD8233 cumulative line rising monotonically to the right end with an ochre bold italic label "Cumulative: 2,217 cases →". Two dashed INK_SOFT vertical lines at Feb 10 and Mar 01 with muted italic labels "Lockdown" and "Vaccination campaign" to their right; bold "Wave 1 peak 70 cases/day" and "Wave 2 peak 43 cases/day" labels above the peaks. Annotation text at 6 pt is smaller than the 8 pt ticks but legible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title, axis titles and peak labels in light #F0EFE8; tick labels and legend text in #B8B7B0; intervention labels in #A8A79F; legend on the #242420 elevated surface. No dark-on-dark text anywhere; dashed event lines light grey and visible against bars and background.
      Data: Bar colours (green, purple, blue) and the ochre cumulative line identical to the light render; only chrome flips. Brand green clearly visible.
      Legibility verdict: PASS
