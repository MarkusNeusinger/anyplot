review:
  strengths:
  - 'Daily stacked epi curve with width=1.0 geom_col: adjacent bars over 90 equal
    daily bins, Confirmed (#009E73, bottom) / Probable / Suspect in the same order
    in every bar, stack order taken from the data'
  - 'Cumulative line carries its own readable scale: round totals 500-2,000 marked
    with dots and labels on the line plus the 2,217 total, all in the line''s ochre,
    so it is not mistaken for the daily counts'
  - Intervention lines and labels drawn from the same events rows via geom_vline(data=events)
    and geom_text, now at the tick-label size
  - 'Clear typographic hierarchy: muted italic event labels, bold ink peak labels,
    bold ochre cumulative labels; chrome fully theme-adaptive and readable in both
    renders'
  weaknesses:
  - 'VQ-02 (both): the ochre cumulative line runs through the ''1,'' of its own ''1,500''
    tick label, which sits on the steepest part of the line → clear the line by a
    few px (label higher, e.g. nudge_y about +3 instead of +1.5, or va placement away
    from the line''s slope). Likely cause: geom_text nudge_y=1.5 with va=''bottom''
    on a line rising faster than the label''s offset.'
  - 'Suggestion: the ''Wave 2 peak'' label is shifted about 18 days right of its peak
    and floats over the Mar 25 bars; placing it nearer the peak, clear of the line,
    would tie it to the bars it names.'
  - 'Suggestion: the legend sits a little far above the panel; tightening legend_box_spacing
    would bring it closer to the bars it explains.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Bold dark title "histogram-epidemic · python · plotnine · anyplot.ai" centred at the top (~60 % of width). Frameless legend "Case Classification: Confirmed, Probable, Suspect" on the elevated off-white surface below the title. Axis titles "Date of Symptom Onset" and "Number of New Cases (per day)" in dark ink; tick labels in INK_SOFT (dates every two weeks Jan 15 to Apr 08, rotated 45°; counts 0-80). Subtle y-only grid, L-shaped axis lines. All readable.
      Data: 90 adjacent daily stacked bars, Confirmed #009E73 at the bottom, Probable #C475FD, Suspect #4467A3 on top; two waves peaking at 70 and 43 cases/day. Ochre #BD8233 cumulative line rising monotonically, with dots and bold ochre labels at 500, 1,000, 1,500, 2,000 and an italic end label "Cumulative cases: 2,217 →". The line runs through the "1," of the 1,500 label. Two dashed INK_SOFT vertical lines at Feb 10 and Mar 01 with muted italic labels "Lockdown" and "Vaccination campaign"; bold "Wave 1 peak 70 cases/day" above the first peak and "Wave 2 peak 43 cases/day" set right of the second peak. Annotations at tick-label size.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title, axis titles and peak labels in light #F0EFE8; tick labels and legend text in #B8B7B0; intervention labels in #A8A79F; legend on the #242420 elevated surface. No dark-on-dark text; dashed event lines light grey and visible against bars and background.
      Data: Bar colours (green, purple, blue) and the ochre cumulative line and its labels identical to the light render; only chrome flips. Brand green clearly visible.
      Legibility verdict: PASS
