review:
  strengths:
  - 'Clever engineering workaround: MUI X community has no contour/decision-region
    primitive, so the implementation rasterizes classifier predictions into an off-screen
    canvas region-fill image and overlays a genuine SVG boundary trace (via useDrawingArea)
    computed from the same mesh grid — a real decision-boundary visualization, not
    a simulated one.'
  - Misclassified training points are distinctly highlighted in the amber semantic-warning
    anchor via honest leave-one-out KNN evaluation (predicting each point against
    a set excluding itself), giving the plot a genuine analytical story instead of
    just displaying raw data.
  - 'Imprint palette used correctly and consistently: first class (Setosa) is #009E73,
    subsequent classes follow canonical order, and colors are identical across light/dark
    themes with only chrome flipping.'
  - Deterministic, seeded data generation (fixed-seed LCG + Box-Muller) with realistic
    iris-like petal measurements showing genuine class overlap near the Versicolor/Virginica
    boundary.
  - Clean use of MUI X's compositional API (ScatterChart children + useDrawingArea)
    to align a custom SVG overlay with the chart's internal coordinate system — a
    technique fairly distinctive to this library's architecture.
  weaknesses:
  - Title occupies only ~44% of the plot width — narrower than the 50-70% guideline
    range (not a violation, just leaves the fontsize slightly conservative for a title
    this short); could grow the title fontsize slightly for stronger visual hierarchy.
  - Misclassified points are distinguished only by color (amber), not by a different
    marker shape as the spec suggests ('different marker styles to highlight correctly
    vs incorrectly classified points') — a shape distinction would add redundant encoding
    beyond color alone.
  - The decision boundary is rendered as a visible staircase (grid-resolution artifact)
    rather than a smoothed curve — an honest representation of the underlying mesh,
    but a finer GRID resolution or light smoothing could make it look more polished.
  - Right-hand side of the canvas has noticeably more whitespace than the left/top
    margins, since the legend sits in a fixed 200px margin column with empty space
    beyond it — slightly unbalanced canvas utilization.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "contour-decision-boundary · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. Axis labels "Petal length (cm)" / "Petal width (cm)" in dark ink, tick labels in a softer gray — all legible. Legend at right (Setosa / Versicolor / Virginica / Misclassified) with color swatches, fully readable.
      Data: Three region fills (green/Setosa, lavender/Versicolor, blue/Virginica) partition the feature space, each with a subtle staircase boundary line. Training points overlay as filled circles in matching class colors; 4 misclassified points render in amber/gold, clearly distinguishable from the surrounding correctly-classified points. First class series is #009E73 (brand green) as required.
      Legibility verdict: PASS — no light-on-light issues, all text and data elements clearly visible.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light/off-white text, clearly visible against the dark background. Tick labels use a lighter gray, still legible. Legend text is light-colored and readable. Boundary line renders as a light gray stroke, visible against the darker region fills.
      Data: Region-fill and point colors are identical to the light render (green/lavender/blue for the three classes, amber for misclassified) — only the chrome (background, text, boundary-line color, region opacity blending against the darker base) has adapted to the theme, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick/legend text is clearly legible against the near-black surface.
