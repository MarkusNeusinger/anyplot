review:
  strengths:
  - Region layer drawn through useXScale/useYScale inside ChartsSurface, so the predicted-class
    fills share the scatter's exact scales instead of a separate image overlay
  - Marching triangles over the distance-weighted k-NN vote margin on a 200 x 200
    mesh give smooth, interpolated boundaries without grid stair-steps, outlined in
    the inkSoft token
  - Training points keep their true-class Imprint color with a page-colored outline,
    so they stay the strongest marks on every region in both themes
  - The misclassified point (leave-one-out) is marked by a hollow ink ring over its
    true-color dot and explained in the legend with a matching hollow glyph via data-series
    selectors
  - Opaque fills inside one translucent group avoid seams between mesh triangles;
    chrome threads pageBg/ink/inkSoft tokens so both themes read correctly
  - skipAnimation, ChartsDataProvider + ChartsWrapper + ChartsLegend composition follows
    the v9 API
  weaknesses:
  - 'Suggestion: the x axis carries 35 tick labels at a 0.2 cm step; a 0.5 cm step
    would read more calmly next to the y axis''s 0.2 cm step over a shorter range.'
  - 'Suggestion: the header leaves about 40 px of empty space above the plot area
    that could go to the plot height.'
