review:
  strengths:
  - 'Composition API used as intended: ChartsDataProvider + ChartsSurface with a custom
    RegionLayer that reads useXScale/useYScale, so the region polygons share the exact
    scales of the native ScatterPlot and axes'
  - Region fills are drawn opaque inside one translucent group (opacity 0.24), so
    the mesh triangles show no seams and the training points stay the strongest marks
    in both themes
  - Marching triangles over the k-NN vote margin interpolate the boundary between
    mesh nodes, and the boundary is stroked in INK_SOFT so it reads on every region
    in both themes
  - Misclassified points get a hollow ink ring around their true-class marker, and
    the legend glyph is styled to match, so a misclassified point reads as one class
    lying on another class's region
  - Leave-one-out classification keeps each training point from voting for itself,
    so the 3 flagged points are honest misclassifications rather than an artefact
  - Synthetic iris-like petal measurements are plausible and neutral; the subtitle
    states n, k, mesh size and misclassified count computed from the data
  - Theme tokens threaded through every chrome element; Imprint positions 1-3 identical
    in both renders; skipAnimation set
  weaknesses:
  - 'Suggestion: the x axis carries 35 tick labels at 0.2 cm steps; a 0.5 cm step
    would read calmer and match the y axis density in the 400 px thumbnail.'
  - 'Suggestion: the class-region boundary between Versicolor and Virginica is stroked
    twice (once per class''s cuts); drawing each boundary once would make the line
    weight uniform.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; plot area fully tinted by the three predicted class regions.
      Chrome: bold dark title "Iris Species by k-NN · contour-decision-boundary · javascript · muix · anyplot.ai" (~52% width), grey subtitle with n=160, k=13, 180×180 mesh, 3 misclassified; axis titles "Petal length (cm)" / "Petal width (cm)", dark-grey ticks (0.6–7.4 and 0.0–2.6), right-side vertical legend. All readable.
      Data: regions in light tints of #009E73 (Setosa, left), #C475FD (Versicolor, middle band), blue (Virginica, right) separated by a dark grey interpolated boundary with mild k-NN raggedness; training points as filled circles in full class colours with a page-coloured outline; 3 misclassified points ringed in dark ink near the Versicolor/Virginica boundary. Legend: Setosa, Versicolor, Virginica, Misclassified (leave-one-out) with hollow ring glyph.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; regions are dark tints of the same three hues.
