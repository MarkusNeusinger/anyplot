      Data: Three contourf-filled, alpha-blended (0.35) decision regions in pastel green / lavender / blue-gray tones, separated by a thin soft-ink boundary line, sit behind ~150 scattered training points. Points are colored circles (green = setosa, lavender = versicolor, blue = virginica) with a white stroke for correctly-classified points, and larger X-cross markers (colored fill, dark stroke) for leave-one-out misclassified points. First series (setosa) confirmed #009E73 Imprint brand green; versicolor/virginica follow the next two canonical Imprint positions. Zoomed inspection of the cluster near Petal Length≈5.0, Petal Width≈1.5-1.8 confirms the previously-overlapping circle/xcross pair is now cleanly separated by a small deterministic jitter — both markers are individually legible with no hybrid "target" glyph.
