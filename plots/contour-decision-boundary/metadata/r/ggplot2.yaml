review:
  strengths:
  - Decision-boundary shading reuses the exact same Imprint palette colors as the
    training-point species colors, creating an intuitive, immediate visual link between
    predicted region and true class.
  - Misclassified vs. correctly classified points are distinguished by shape (circle
    vs. X), directly implementing the spec's suggestion to highlight misclassification
    — computed honestly via leave-one-out cross-validation (knn.cv), not faked.
  - Real iris dataset (petal length/width, 3 species) driving an actual k-NN classifier
    on a 150x150 mesh grid — a genuine ML workflow rather than a synthetic decoration.
  - Theme tokens (PAGE_BG, INK, INK_SOFT) are threaded consistently through plot/panel
    background, axis text, titles, and legend chrome; both light and dark renders
    stay fully legible with identical data colors.
  - Canvas size, mandated title format (with descriptive prefix), and dual legends
    (Species + Prediction) all match the spec and style guide exactly.
  weaknesses:
  - Decision-region background is built with geom_tile() over the dense 150x150 mesh
    grid, which produces faint but visible horizontal seam/streak artifacts across
    the solid-colored regions in both renders (most noticeable in the mid-tone versicolor/virginica
    areas). Switch to geom_raster() for a regular mesh-grid fill — it rasterizes without
    inter-cell seams and is faster for this data shape.
  - panel.grid is fully removed (element_blank()) — a reasonable call given the colored
    background, but a very faint reference grid (low-alpha INK line) would help readers
    read off precise petal length/width values without competing with the region fills.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme background.
      Chrome: Bold dark title "Iris Species by Petal Size · contour-decision-boundary · r · ggplot2 · anyplot.ai" at top-left, fully visible, not clipped. Axis titles "Petal Length (cm)" / "Petal Width (cm)" and numeric tick labels (0/2/4/6, 0/1/2) render in dark ink, clearly legible. Two legend boxes on the right ("Prediction": circle/X, "Species": color swatches) sit inside a light elevated panel with visible borders, fully within canvas bounds.
      Data: Three shaded decision-region bands (green/lavender/blue-gray, alpha ~0.32) fill the plot area, with training points overlaid as green/lavender/blue-purple dots (first series #009E73 = setosa). A handful of points near the versicolor/virginica boundary are marked with X instead of a dot, flagging leave-one-out misclassifications. Faint horizontal seam lines are visible within the solid-colored regions (geom_tile rendering artifact) — a minor blemish, not a legibility problem.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme background.
      Chrome: Same title, now in light ink, fully visible against the dark background — no dark-on-dark issues. Axis titles and tick labels render in soft light gray, clearly readable. Legend boxes use the elevated dark panel background with visible borders; legend text is light and readable.
      Data: Same three decision-region colors (deep green/muted purple/slate blue at same alpha), and the same point colors as the light render — confirmed identical to light render, only chrome (background/text/legend panel) flipped. Same misclassification X markers in the same positions. The same faint geom_tile seam artifact is visible in the dark regions, consistent with the light render.
      Legibility verdict: PASS
