review:
  strengths:
  - Class colors shared between regions and point fills, so misclassified triangles
    read as one class sitting on the other's region
  - Native shape legend for Correct/Incorrect via resolve_scale independent, alongside
    the decision-region legend
  - Points outlined in INK_SOFT stay the strongest marks on both translucent regions
    in both themes
  - Region rects centred on the mesh nodes with x2/y2 and nice=False domains fill
    the plane edge to edge
  - Tooltips with feature values, class and status in the HTML output
  weaknesses:
  - 'SC-02 (both): the diagonal boundary at lower left (X1 -1.0 to -0.5, X2 -1.4 to
    -0.6) shows the mesh as visible stair-steps about 15 px tall, violating C4 → a
    finer mesh, 200 cells per axis (+50). Likely cause: MESH_SIZE = 150.'
  - 'DQ-02 (both): classes labelled ''Class A''/''Class B'' and axes ''Feature X1''/''Feature
    X2'' read as generic → name a plausible two-feature scenario and its classes.
    Likely cause: the label strings in the data block and column constants.'
  - 'Suggestion: a slightly lower region opacity in the dark theme would let the green
    points separate more from the dark green region.'
