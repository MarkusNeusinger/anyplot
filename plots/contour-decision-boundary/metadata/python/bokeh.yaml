review:
  strengths:
  - Region raster and training points share Imprint colours, so misclassified points
    read at once as one class lying on the other's region
  - Ink-coloured outlines (theme token) keep every point visible on both regions in
    both themes
  - Misclassified points carry an X overlay that is explained in the legend and is
    a non-colour cue
  - Native p.image with LinearColorMapper draws the 400-column prediction mesh as
    one raster glyph
  - HoverTool scoped to the point renderers shows true and predicted class in the
    HTML output
  weaknesses:
  - 'SC-02 (both): the diagonal class boundary in the lower left and along the right
    flank shows the mesh cells as visible stair-steps (cells about 8 px wide on the
    3200 px canvas) → a finer mesh so the curved boundary reads smooth (about double
    MESH_POINTS, +400). Likely cause: MESH_POINTS = 400 rendered with nearest-neighbour
    p.image.'
  - 'DQ-02 (both): the axes and classes are labelled Feature 1, Feature 2, Class 0
    and Class 1, which read as generic → name the features and classes for a concrete
    scenario (e.g. two sensor readings and two part types). Likely cause: the FEATURE_1/FEATURE_2
    constants and the f"Class {c}" labels.'
  - 'Suggestion: the legend glyphs are smaller than the plotted points; matching their
    size would tie legend and marks together more directly.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page around the plot; the plane is filled with translucent Imprint green (class 0, upper left) and translucent Imprint purple (class 1, lower right) prediction regions separated by a curved KNN boundary
      Chrome: bold title "contour-decision-boundary · python · bokeh · anyplot.ai" top-left (~55% width), italic axis titles Feature 1 / Feature 2, tick labels in soft dark ink, subtle grid, legend in an elevated panel top-right; all readable
      Data: 200 training points, #009E73 green and #C475FD purple with near-black outlines; 14 misclassified points carry a dark X; legend lists Class 0 (true), Class 1 (true), Misclassified
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; regions render as deep green and deep purple translucent fills
      Chrome: title, axis titles and tick labels in light ink, clearly readable; legend panel #242420 with light labels; no dark-on-dark text
      Data: point fills identical to the light render (#009E73, #C475FD); outlines and X markers flip to light ink and stay visible on both regions
      Legibility verdict: PASS
