review:
  strengths:
  - Region fill and point color share the same Imprint hue per class, so a misclassified
    point clearly reads as one class on the other's region in both themes
  - Correct vs. incorrect encoded by shape (filled circle vs. cross) with its own
    legend, as the Notes suggest
  - 250x250 mesh gives smooth KNN boundaries without visible grid stair-steps
  - Theme tokens threaded through all chrome; both renders theme-correct
  - Interactive HTML output from lets-plot alongside the PNG
  weaknesses:
  - 'SC-02 (both): the predicted-region tiles end about 0.1 data units inside the
    panel on every side, so a page-colored band frames the feature plane instead of
    the whole plotted plane being filled (C1) → regions reaching the panel edges.
    Likely cause: default axis expansion around geom_tile; set scale_x_continuous(expand=[0,
    0]) and scale_y_continuous(expand=[0, 0]).'
  - 'VQ-03 (dark): the Classification legend''s circle and cross glyphs are drawn
    in default dark grey (~#444) on the #242420 legend panel and are barely visible
    → glyphs in INK_SOFT. Likely cause: shape legend inherits the default point color;
    pass guide_legend(override_aes={''color'': INK_SOFT}) on scale_shape_manual.'
  - 'DQ-02 (both): class labels "Class 0" / "Class 1" and axes "Feature X1" / "Feature
    X2" read as generic placeholders → name the two moons and the features after a
    plausible context (e.g. two measured properties). Likely cause: the label list
    and the X1/X2 column constants.'
  - 'CQ-01 (code): lines 61-63 define a helper function mesh_axis() → inline the two
    np.linspace calls for the mesh axes. Likely cause: the padding logic wrapped in
    a def.'
  - 'Suggestion: a thin page-colored outline on the markers would lift same-class
    points off their own region further.'
