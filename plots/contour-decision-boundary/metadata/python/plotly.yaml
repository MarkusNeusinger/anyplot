review:
  strengths:
  - Translucent probability fill between the two class colours keeps the outlined
    training points the strongest marks in both themes
  - Second go.Contour trace with contours start=end=0.5 draws the decision boundary
    as a single isoline
  - Class shape redundancy (circle / diamond) on top of colour, with page-coloured
    outlines that keep points visible on both regions
  - 'Adaptable structure: column constants with role comments, a separate Data block,
    and a plot section reading only df'
  - Hover templates expose feature values and predicted probability across the plane
    in the HTML output
  weaknesses:
  - 'VQ-07 (both): the dashed decision boundary renders in plotly''s default-colorscale
    yellow #FDCA26, a colour outside Imprint, instead of the INK_SOFT the code asks
    for → INK_SOFT (#4A4A44 light / #B8B7B0 dark) or another Imprint/semantic anchor.
    Likely cause: contours.coloring=''lines'' colours the isoline from the trace''s
    default colorscale and ignores line.color; set colorscale=[[0, INK_SOFT], [1,
    INK_SOFT]] on the boundary trace.'
  - 'Suggestion: the Notes'' option of a distinct marker style for misclassified training
    points would make the errors read at a glance.'
  - 'Suggestion: a legend entry for the dashed line (''Decision boundary, P = 0.5'')
    would explain the isoline without the colorbar.'
