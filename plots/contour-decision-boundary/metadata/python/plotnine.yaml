review:
  strengths:
  - Point outlines are drawn in the INK token, so they flip from near-black on the
    light render to near-white on the dark one and every training point stays clear
    of both regions in both themes
  - 'The Notes'' option is used and explained: correctly classified points are circles,
    misclassified ones are larger diamonds, and the ''Training point'' legend explains
    both shapes, so every misclassified point reads as one class lying on the other
    class''s region'
  - Regions are translucent (alpha 0.32) while the points carry the full Imprint color,
    so the points stay the strongest marks and a point's class matches its region
    by shared hue; the fill legend is titled 'Class (region and point)' to say so
  - 'Grammar-native construction: geom_raster for the mesh with show_legend=False,
    guide_legend(override_aes=...) to give the fill legend square swatches and the
    shape legend a visible INK_SOFT fill, scale limits taken from the data order so
    the first class gets #009E73'
  - scale_*_continuous(expand=(0, 0)) with coord_cartesian on the mesh extent makes
    the predicted regions fill the whole panel edge to edge, with no page-colored
    gutter
  - 'Adaptable code: the SVC falls back to a DummyClassifier for a single class, and
    the plot block reads only df and the column constants'
  weaknesses:
  - 'SC-02 (both): the curved class boundary shows the mesh as stair-steps of about
    12 px (one 200x200 cell), clearly visible at full size along the near-vertical
    boundary at X1 = 1.8 and the lower-left boundary near X1 = -0.9, which violates
    the spec''s ''mesh fine enough that a curved boundary does not show the grid as
    stair-steps'' → a smooth boundary edge. Likely cause: geom_raster draws the hard
    predicted labels cell by cell, so the color edge follows the cell edges; bilinear
    interpolation only blurs each step. Drawing the regions from the continuous clf.decision_function
    on the mesh (for example a filled contour split at 0) instead of the per-cell
    labels gives an edge that follows the boundary between cells.'
  - 'DQ-02 (both): the labels are abstract only, ''Class 0'' / ''Class 1'' and ''Feature
    X1'' / ''Feature X2'', so the chart reads as a bare make_moons demo with no comprehensible
    scenario → name the classes and features for a neutral context (for example two
    plant varieties over two measured leaf traits with units), keeping the synthetic
    make_moons geometry. Likely cause: np.where(y == 0, ''Class 0'', ''Class 1'')
    and the FEATURE_1 / FEATURE_2 constants.'
  - 'Suggestion: only three y ticks (-1, 0, 1) span the panel; a 0.5 step would make
    point positions easier to read off.'
  - 'Suggestion: the ''Correctly classified'' legend label sits within a few pixels
    of the legend frame''s right edge; a little more legend padding would let it breathe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel; legend on the slightly lighter elevated surface with a thin INK_SOFT frame.
      Chrome: title 'contour-decision-boundary · python · plotnine · anyplot.ai' centered at about 60 % of the width, dark ink; axis titles 'Feature X1' / 'Feature X2' and tick labels (-1..2 on x, -1/0/1 on y) in dark grey, all readable; no grid, left and bottom axis lines only; legend 'Class (region and point)' with square Class 0 (green) / Class 1 (purple) swatches and 'Training point' with a circle (Correctly classified) and a diamond (Misclassified), both in a grey fill.
      Data: the whole panel is filled with a translucent green region (Class 0, #009E73 at alpha 0.32) and a translucent lilac region (Class 1, #C475FD) separated by a curved SVM boundary following the two moons; 200 training points drawn as full-color circles with a near-black outline, misclassified points as larger diamonds (purple diamonds in the green region, green diamonds in the purple region). The boundary edge shows small cell-sized stair-steps at full size. First class is #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page and panel; legend on the #242420 elevated surface with a light-grey frame.
      Chrome: title and axis titles in near-white, tick labels and legend labels in light grey, all readable; no dark-on-dark text anywhere; axis lines light grey.
      Data: point colors identical to the light render (#009E73 green, #C475FD purple); the translucent regions now read as deep green and deep plum over the dark page; point outlines flip to near-white so every point stands out on both regions; misclassified diamonds identical in shape and position. Brand green clearly visible.
      Legibility verdict: PASS
