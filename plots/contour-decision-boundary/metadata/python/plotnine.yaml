review:
  strengths:
  - Region edges are contoured from the SVM margin with contourpy, so the curved boundary
    is smooth with no mesh stair-steps
  - Region fill at alpha 0.32 with ink-outlined points keeps the training points the
    strongest marks on both regions in both themes
  - Shared fill scale across region and point layers plus the legend title 'Cultivar
    (region and point)' make misclassified points read immediately
  - Matching limits on scale_shape_manual and scale_size_manual merge correct/misclassified
    into one legend; override_aes keeps every glyph visible
  - expand=(0,0) with coord_cartesian makes the predicted regions fill the whole plotted
    plane
  weaknesses:
  - 'Suggestion: the Rosea region in the light render is quite pale; a slightly higher
    alpha (about 0.38) would balance the two regions'' visual weight.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel.
      Chrome: centered title "contour-decision-boundary · python · plotnine · anyplot.ai" in dark ink, axis titles "Leaf length (cm)" / "Leaf width (cm)", soft-ink tick labels, left and bottom axis lines, no grid; legend on the right on an elevated box: "Cultivar (region and point)" with Alba (green) and Rosea (lavender) squares, "Training point" with circle = Correctly classified and diamond = Misclassified. All readable.
      Data: the whole panel is filled with a translucent green Alba region (left/top) and lavender Rosea region (right/bottom) separated by a smooth S-shaped boundary; 200 training points as ink-outlined circles in #009E73 and #C475FD; about 14 misclassified points as larger diamonds (green diamonds on the Rosea region, purple diamonds on the Alba region).
