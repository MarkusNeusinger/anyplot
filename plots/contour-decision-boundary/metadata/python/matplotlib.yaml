review:
  strengths:
  - Misclassified points made the focal layer with larger X markers and a full-ink
    outline, so errors along the boundary read at once in both themes
  - Training points keep their true-class color and get a page-colored outline, so
    they read on both regions
  - Region levels and palette are derived from the class list, so the code generalises
    to any number of classes
  - 'Clean adaptable structure: column constants, a Data block ending in df, and a
    plot that reads only df'
  - Theme tokens threaded through title, labels, ticks, spines, grid and legend frame
  weaknesses:
  - 'SC-02 (both): the decision boundary steps along the mesh cells on the curved
    left flank (x about -0.9 to -0.3) and along the near-vertical right edge (x about
    1.45), missing C4 → a smooth boundary that hides the grid. Likely cause: contour/contourf
    drawn on the integer predict() labels, whose 0/1 jumps contour can only trace
    cell by cell; contour classifier.decision_function on the mesh at level 0 instead.'
  - 'Suggestion: the boundary could be drawn from decision_function with the margin
    levels -1 and +1 as faint dashed lines to show the SVM''s margin.'
