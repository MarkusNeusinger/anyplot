review:
  strengths:
  - Theme tokens threaded through all chrome; both renders readable
  - Translucent class regions keep the points the strongest marks
  - SVM accuracy gives the reader a headline number
  weaknesses:
  - 'VQ-05 (both): canvas is 4748x2653 px, neither canonical size → 3200x1800 (−1548
    × −853). Likely cause: figsize=(16, 9) at dpi=300 with bbox_inches="tight" instead
    of figsize=(8, 4.5), dpi=400 and the default bbox.'
  - 'SC-04 (both): title reads ''contour-decision-boundary · seaborn · anyplot.ai'',
    missing the language segment → ''contour-decision-boundary · python · seaborn
    · anyplot.ai''. Likely cause: the ax.set_title string.'
  - 'SC-02 (both): misclassified points are drawn as uniform orange (#BD8233) hollow
    rings, so their true class cannot be read and matched to a region (C2, C3) → keep
    the true-class color and change only the marker shape. Likely cause: separate
    ax.scatter with facecolors="none", edgecolors="#BD8233".'
  - 'SC-02 (both): the boundary shows the mesh as visible stair-steps, most clearly
    on the near-vertical stretches left and right (C4) → a finer mesh (e.g. 400–500
    steps) or contourf on decision_function values. Likely cause: 200-step mesh of
    hard predict() labels.'
  - 'DQ-02, VQ-06 (both): axes ''Feature 1 (Normalized)'' / ''Feature 2 (Normalized)''
    and classes ''Class 0'' / ''Class 1'' are abstract → a real domain with named
    quantities, units and class names. Likely cause: make_moons data with generic
    labels.'
  - 'VQ-03 (dark): legend point glyphs carry a white line stroke through the marker
    that the plotted points do not have → linestyle none. Likely cause: Line2D([0],[0],
    color="w") handles.'
  - 'CQ-01 (code): no column-0 # Data block and no column constants for the X1, X2
    and y roles → one Data block binding df and one string constant per role. Likely
    cause: data generated and used inline as arrays.'
  - 'CQ-04 (code): lines 77–122 build a five-entry legend by hand from Patch/Line2D
    → sns.scatterplot(data=df, hue=class, style=prediction) produces it. Likely cause:
    correct and misclassified points plotted in separate calls with legend=False.'
  - 'Suggestion: a lighter boundary line weight would let the points stay the strongest
    marks.'
