  strengths:
  - Training points keep their true class colors on translucent class regions, so
    misclassified points read against the other class's region
  - Theme tokens applied to all text and outlines; both renders readable
  - Clear make_moons + RBF SVC example with a curved boundary
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700, off the canonical sizes → 3200x1800 landscape.
    Likely cause: width=4800, height=2700.'
  - 'VQ-01, DE-01 (both): title at 28 px fills about 17% of the width and sits below
    the 48 px axis titles in the hierarchy → about 64 px (+36 px). Likely cause: title_font_size=28.'
  - 'SC-04 (both): title is ''contour-decision-boundary · pygal · anyplot.ai'', missing
    the language → ''contour-decision-boundary · python · pygal · anyplot.ai''. Likely
    cause: the title string.'
  - 'SC-02 (both): the curved boundary shows the 0.02 mesh as visible stair-steps
    → a finer mesh or merged cells so the curve is smooth. Likely cause: h = 0.02
    with one rect per cell.'
  - 'VQ-07 (both): misclassified ring and X drawn in #E53935, not an Imprint color
    → #AE3030. Likely cause: hard-coded stroke color.'
  - 'VQ-03 (both): the Misclassified legend glyph has a grey INK_MUTED fill while
    the marks it explains are class-colored → a ring/X glyph without a misleading
    fill. Likely cause: fill=INK_MUTED in the legend circle.'
  - 'CQ-01 (code): a data_to_svg helper function → inline the mapping. Likely cause:
    lines 96-99.'
  - 'CQ-04, LM-01 (code): axes, ticks, axis titles and legend hand-drawn as SVG (lines
    167-252) with a dummy series, bypassing pygal''s x_title, y_title, xrange/range
    and legend; clf.predict called per point in a loop → use pygal''s native axes
    and legend and one vectorized clf.predict(X). Likely cause: show_legend=False
    and show_x_labels=False with custom SVG.'
  - 'Suggestion: lighter region fill would let the points stand out more.'
