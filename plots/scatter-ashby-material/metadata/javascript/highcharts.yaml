review:
  strengths:
  - Custom convex-hull family regions computed in pixel space from axis.toPixels(),
    correctly reflecting the log-log point cloud rather than raw-value hulls
  - Automatic distinct marker shapes per family (circle, diamond, square, triangle-up,
    triangle-down) layered on top of the Imprint palette colors, giving CVD-safe redundant
    encoding
  - Guide line for constant performance index (k/cost) is rotated to match its on-screen
    slope and placed with a legible italic label — a genuine Ashby-chart convention,
    correctly implemented as an optional bonus feature from the spec
  - Direct family labels with textOutline halo replace a traditional legend entirely,
    staying legible over the hull fills in both themes
  - Data colors are pixel-identical between light and dark renders; only chrome (background,
    grid, ink) flips as required
  - Realistic, domain-plausible property ranges per family (e.g. metals k=15-400 W/m·K,
    foams k=0.02-0.09 W/m·K) sourced from real thermal-conductivity/cost trade-offs
    for heat-exchanger material selection
  - Deterministic LCG-seeded data generation, no network/CDN calls, correct mount-node
    contract with both animation flags disabled
  weaknesses:
  - Guide-line label ('k / cost = 2 W·kg / (m·K·$)') is set at 13px italic, noticeably
    smaller than the 15px family labels — bump to ~14-15px for visual consistency
  - Convex-hull and padding math (convexHull, padHull) pulls the snippet away from
    a flat KISS structure toward small utility functions; justified by the geometry
    requirement but worth flagging under CQ-01
  - No legend and no direct in-plot units/count callout for how many materials sit
    in each family region — a small data-label or tooltip hint on hover would strengthen
    the interactive HTML view (PNG is fine as-is)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Thermal Conductivity vs. Cost · scatter-ashby-material · javascript · highcharts · anyplot.ai" is fully visible at the top, dark ink text, not clipped at any edge. X-axis title "Cost (USD / kg)" and y-axis title "Thermal Conductivity (W / m·K)" are legible in soft-ink gray. Tick labels (0.6, 0.8, 1, 2, 4 ... 1k on x; 0.01 ... 1k on y) are all fully visible with no leftmost/rightmost digit chopped. Grid lines are thin and subtle, visible but not dominant.
      Data: Six convex-hull family regions (Metals, Ceramics, Composites, Polymers, Elastomers, Foams) each filled with a translucent tint of its own Imprint palette color and outlined with a slightly stronger stroke of the same color; first series (Metals) uses the mandated brand green #009E73. Each region carries a direct color-matched text label with a halo outline, legible against both the fill and the off-white background. A dashed diagonal guide line with a rotated italic label ("k / cost = 2 W·kg / (m·K·$)") cuts across the plot. Markers use distinct shapes per family (circle/diamond/square/triangle-up/triangle-down) in addition to color.
      Legibility verdict: PASS — all title, axis, tick, and family-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now render in light ink/soft-ink tones, fully legible against the dark background. Grid lines remain subtle. The guide line and its label flip to a light color (from t.ink) so they stay visible against the dark background.
      Data: Confirmed identical hue values for all six family fills/strokes/markers/labels as in the light render — only the chrome (background, grid, ink) flips, matching the "identical categorical data colors" requirement. Cropped close-up of the Polymers/Elastomers/Foams cluster shows all three family labels (including the darker maroon "Elastomers") remain legible against the near-black background thanks to the halo outline and inherently saturated palette hues — no dark-on-dark failures observed.
      Legibility verdict: PASS — no unreadable text in either theme; brand green (Metals region) reads clearly on both surfaces.
