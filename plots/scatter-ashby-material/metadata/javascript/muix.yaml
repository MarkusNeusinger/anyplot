review:
  strengths:
  - 'Both axes are true MUI X log scales (scaleType: ''log'') with decade ticks from
    tickInterval and labels like 1,000 and 0.0001; each axis is labeled with its property
    and units, and every one of the 82 materials sits at its handbook density and
    modulus'
  - Every family is a convex hull computed in log-log space, pushed 15 px past its
    points, with a 10 % fill and a 75 % stroke in its Imprint color. Where Metals,
    Ceramics and Composites overlap, all three outlines and every point stay visible
    in both themes
  - Family labels pair a color swatch with ink text that carries a page-colored halo,
    so they stay readable in both themes. They are placed beside their own envelopes,
    clear of markers, other labels and other regions
  - The constant E/rho guides (10^-1, 10^-3, 10^-5 GPa/(kg/m³)) are straight, parallel,
    dashed, softer than the regions, and labeled along their own slope with a superscript
    exponent
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + ChartsSurface with custom
    SVG layers driven by useXScale/useYScale/useDrawingArea, ScatterPlot for the marks,
    and an item-triggered ChartsTooltip whose valueFormatter names each material in
    the HTML'
  weaknesses:
  - 'CQ-01 (code): insidePolygon (lines 121–125) and distanceToPolygon (lines 127–135)
    are free-standing helper functions next to the hook and the layer components that
    composition needs → fold them into the one component that uses them, or inline
    them where they are called. Likely cause: the geometry for placing the labels
    was factored out as utilities.'
  - 'Suggestion: Plywood, wood, bamboo and laminated veneer sit under Composites,
    and balsa and cork under Foams. A separate Natural Materials family would match
    the classic Ashby grouping and keep the across-grain wood point from stretching
    the Composites hull down to 0.6 GPa.'
  - 'Suggestion: the Foams label sits about 1.5 decades above its envelope''s upper
    edge. A spot closer to the region would tie it more tightly to the region.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 over the whole canvas; no pure white.
      Chrome: the bold title "scatter-ashby-material · javascript · muix · anyplot.ai" is centered, with a soft subtitle "82 materials in 6 families · dashed lines hold the ratio ...". Log x axis "Density (kg/m³)" runs from 10 to 10,000; log y axis "Young's modulus (GPa)" runs from 0.0001 to 1,000. Ticks, axis titles and the subtle vertical and horizontal grid are all dark on light and readable.
      Data: 82 circular markers in six translucent convex-hull envelopes. Metals #009E73 (first series), Polymers lavender, Ceramics blue, Composites ochre, Elastomers matte red, Foams cyan. Each family has a bold label with a color swatch beside its region (Ceramics and Composites at the top, Metals below its hull, Polymers below its hull, Elastomers above its hull, Foams upper left). Three dashed gray guide lines, labeled 10^-1, 10^-3 and 10^-5 GPa/(kg/m³), run parallel across the chart. Metals, Ceramics and Composites overlap, and every outline and point stays visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; no pure black.
      Chrome: the title, subtitle, ticks, axis titles and family labels are light on dark and fully readable, with no dark-on-dark text. The grid is subtle but visible, and the guide lines and their labels are soft gray and readable.
      Data: the family colors, markers, hulls and layout are identical to the light render; only the chrome flips. Brand green Metals reads clearly, and region fills stay faint while the outlines stay distinct.
      Legibility verdict: PASS
