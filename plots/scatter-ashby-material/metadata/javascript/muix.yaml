review:
  strengths:
  - 'All three attempt-1 weaknesses were addressed: material-specific density/modulus
    sub-ranges for Tungsten/Tungsten Carbide/PTFE, reduced hull fill opacity and margin
    to cut visual clutter, and a rebalanced right margin matching the left'
  - Convex-hull family envelopes with direct color-matched, halo-stroked labels exactly
    match the spec's 'colored bubble regions or convex-hull envelopes' requirement
    and remove the need for a separate legend
  - Optional E/rho specific-stiffness guide lines (dashed, rotated to match slope,
    labeled inline) add genuine Ashby-chart analytical value beyond the spec minimum
  - Full Imprint palette compliance in canonical order with theme-correct chrome in
    both light and dark renders
  - Deterministic LCG-seeded data generation, focused single-purpose helper functions,
    no fake interactivity
  weaknesses:
  - Ceramics and Metals convex-hull regions still overlap substantially across their
    shared boundary (density ~2,000-3,500 kg/m^3, modulus ~50-450 GPa), producing
    a blended teal zone -- reflects genuine overlap in real material property space
    so the data itself is not wrong, but a further opacity reduction or slight vertical
    offset between the two hulls in that shared band would read cleaner
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white.
      Chrome: Bold dark title "scatter-ashby-material · javascript · muix · anyplot.ai" centered at top with gray subtitle below; dark axis titles and medium-gray decade tick labels clearly legible; subtle light-gray grid. Right margin now balanced (105px) against left (110px) -- Metals hull/label have clear breathing room from the canvas edge.
      Data: Six convex-hull family regions (Metals=green #009E73, Polymers=lavender, Ceramics=blue, Composites=ochre, Elastomers=matte red, Foams=cyan) filled at low opacity (0.07) with solid colored border and color-matched halo-stroked text label; scatter markers match family color; two dashed E/rho guide lines with inline rotated labels.
      Legibility verdict: PASS

