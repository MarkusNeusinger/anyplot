review:
  strengths:
  - Convex-hull family envelopes with direct color-matched, halo-stroked labels exactly
    match the spec's "colored bubble regions or convex-hull envelopes" requirement
    and remove the need for a separate legend
  - Optional E/ρ specific-stiffness guide lines (dashed, rotated to match slope, labeled
    inline) add genuine Ashby-chart analytical value beyond the spec minimum
  - 'Full Imprint palette compliance in canonical order (Metals=green #009E73 first,
    then lavender/blue/ochre/red/cyan) with theme-correct chrome in both light and
    dark renders'
  - 'Idiomatic MUI X composition: ChartContainer + useXScale/useYScale hooks layer
    custom SVG overlays (hulls, guide lines) directly inside the chart''s coordinate
    system — a genuinely library-distinctive technique'
  - Deterministic LCG-seeded data generation, focused single-purpose helper functions
    (convexHull, clipIsoline, decadeTicks), no fake interactivity
  weaknesses:
  - Named materials get log-uniform random properties from a shared per-family range
    rather than individually accurate values, so specific well-known materials can
    land far from their real properties — e.g. "Tungsten Carbide" (real density ≈
    15,800 kg/m³) and "Tungsten" (≈ 19,300 kg/m³) can render inside the Ceramics/Metals
    family box capped at 4,200/11,400 kg/m³, and "PTFE" (≈ 2,150-2,200 kg/m³) can
    land inside the Polymers box capped at 1,500 kg/m³. Either tighten per-material
    sub-ranges for outlier-density materials or rename the generic materials list
    to avoid specific real-world alloys whose properties are common knowledge.
  - The Ceramics/Metals/Composites convex-hull regions overlap heavily near their
    shared boundary (roughly density 2,000-3,000 kg/m³, modulus 100-300 GPa), creating
    a muddled blended-color zone — reduce HULL_MARGIN or fillOpacity in that area,
    or nudge the family boxes apart slightly so regions stay visually distinct.
  - Right margin (60px) is noticeably tighter than the left margin (110px) and the
    Metals hull/label sit close to the canvas's right edge — widen the right margin
    or compress the x-domain padding for a more balanced layout.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "scatter-ashby-material · javascript · muix · anyplot.ai" centered at top, dark-gray subtitle below it. Dark axis titles ("Density (kg/m³)", "Young's Modulus (GPa)") and medium-gray decade tick labels (100, 1,000, 10,000 on x; 0.001–1,000 on y) are all clearly legible against the light background. Grid is a subtle light-gray line grid, visible but not competing with data.
      Data: Six convex-hull family regions (Metals=green #009E73, Polymers=lavender, Ceramics=blue, Composites=ochre, Elastomers=matte red, Foams=cyan) each filled at low opacity with a solid colored border and a color-matched, halo-stroked text label near the hull apex. Scatter markers inside each hull are colored to match their family. Two dashed gray guide lines (E/ρ = 1 and E/ρ = 100) run diagonally across the plot with inline rotated labels. First series (Metals) is confirmed brand green #009E73.
      Legibility verdict: PASS — all text is clearly readable; the halo-stroke behind family/guide labels keeps them legible even where they cross hull fills or the grid.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels all render in light gray/off-white and remain clearly visible against the dark background — no dark-on-dark text observed. Grid lines are a subtle light-gray, still visible but unobtrusive.
      Data: Same six hull regions and scatter markers as the light render, with identical hex colors (Metals green #009E73 confirmed unchanged, other five family colors unchanged) — only the chrome (background, text, grid, halo-stroke color behind labels) flips to the dark-theme tokens. Guide lines and their labels remain legible with the theme-adaptive halo stroke.
      Legibility verdict: PASS — no dark-on-dark failures; brand green and all other data colors read clearly on the dark surface.
