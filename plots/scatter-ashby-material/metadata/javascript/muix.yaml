review:
  strengths:
  - Family envelopes are true convex hulls computed in log-log space and inflated
    15 px, so every point sits inside its region and the Metals/Ceramics overlap keeps
    both outlines and all points visible in both themes
  - Direct family labels in bold ink with a color swatch and a page-colored halo stay
    readable on fills and points; placement keeps each label nearest its own envelope
  - Constant E/ρ guides are straight, parallel, dashed in inkSoft at 0.6 opacity (lighter
    than the regions) and labeled along their slope with superscript exponents and
    units
  - Native MUI X log axes with decade-only tickInterval and comma-formatted tick labels;
    item-trigger ChartsTooltip names each material with its two values in the HTML
  - 'Clean theme threading: background, ink, inkSoft and grid tokens flip; Imprint
    data colors are identical in both renders'
  weaknesses:
  - 'DQ-03 (code): named materials receive random values from their family box that
    contradict their known properties — Mild Steel 2868 kg/m³ / 49.1 GPa (real ≈7850
    / 210), Magnesium Alloys 5887 / 297 (≈1740 / 45), Lead Alloys 9918 / 317 GPa (≈11340
    / 16), Zinc Alloys 2332 / 365 (≈7100 / 100), Concrete 224 GPa (≈30), Cermet 651
    kg/m³ (≈6000+) → give each named material a tight box around its published values,
    as the overrides already do for Tungsten, Tungsten Carbide and PTFE. Likely cause:
    the overrides map covers only three materials; all others sample log-uniformly
    across the whole family box.'
  - 'VQ-02 (both): the "10^-2 GPa/(kg/m³)" guide label crosses the Composites envelope''s
    lower-left outline around 1,000 kg/m³ / 10 GPa → keep the label at least ~8 px
    clear of any envelope. Likely cause: the guide label is centered at the geometric
    midpoint of the clipped line with no check against the hulls.'
  - 'Suggestion: the hull-inflation block is duplicated in FamilyRegions and FamilyLabels;
    computing the inflated pixel hulls once would remove ~8 lines.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold near-black title "scatter-ashby-material · javascript · muix · anyplot.ai" with an inkSoft subtitle (82 materials in 6 families, dashed lines hold E/ρ constant); axis titles "Density (kg/m³)" and "Young's modulus (GPa)"; decade ticks 100–10,000 and 0.001–1,000; subtle grid at decades. All readable.
      Data: log-log scatter of 82 materials in six convex-hull envelopes (0.1 fill, 0.75 outline): Metals #009E73 (first), Polymers lavender, Ceramics blue, Composites ochre, Elastomers matte red, Foams cyan. Metals and Ceramics overlap at upper right with both outlines and all points visible. Bold family labels with color swatch dots beside each region. Three dashed gray guide lines 10^-2, 10^-4, 10^-6 GPa/(kg/m³), labeled along their slope; the 10^-2 label touches the Composites outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, family labels and axis titles in light ink, subtitle and ticks in light inkSoft, grid subtle but visible; no dark-on-dark text.
      Data: identical hues and positions to the light render; envelope fills darker-tinted but outlines and points clearly visible; brand green Metals reads well.
      Legibility verdict: PASS
