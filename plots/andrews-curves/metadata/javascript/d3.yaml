review:
  strengths:
  - 'Correct Andrews curve formula matching the spec exactly: x1/sqrt(2) + x2*sin(t)
    + x3*cos(t) + x4*sin(2t)'
  - Variables are z-score normalized before the Fourier transform, exactly as the
    spec's normalization note requires
  - Alpha transparency (stroke-opacity 0.45) is used to reveal density patterns, per
    the spec's guidance to use alpha < 0.5 for many curves
  - 'Color-by-category applied with the Imprint palette in canonical order (green/lavender/blue),
    first series correctly #009E73'
  - 'Idiomatic modern D3: scaleOrdinal + scaleLinear, d3.line() path generator, .join()
    enter pattern, d3.mean/d3.deviation/d3.extent from d3-array'
  - Custom pi-fraction tick labels (-π, -π/2, 0, π/2, π) on the x-axis add a nice
    domain-specific touch
  - Theme-adaptive chrome correctly threaded through ink/inkSoft/grid tokens; both
    renders are legible with identical data colors and only chrome flipping
  - Canvas matches the landscape target exactly with generous margins; no clipped
    text in either render
  - Legend, title, and axis labels are cleanly positioned with no overlap
  weaknesses:
  - Heavy curve overlap in the central t-range makes it hard to distinguish individual
    Versicolor curves from Virginica where their bands cross — a slightly lower alpha
    (e.g. 0.35) or thinner stroke for those two closer-clustered species would improve
    separation
  - Data storytelling relies solely on color separation; a subtle emphasis technique
    (e.g. a slightly bolder mean curve per species, or a brief annotation calling
    out the Setosa cluster's clean separation) would strengthen the visual hierarchy
    further
  - Only 4 of the recommended 4-8 dimensions are used — an extra variable or two (e.g.
    a 5th/6th Fourier term) would make fuller use of the Andrews curve technique's
    capacity to reveal multivariate structure
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "andrews-curves · javascript · d3 · anyplot.ai" centered at top, clearly legible. Axis titles "t (Fourier parameter)" (x) and "f(t)" (y, rotated) in dark ink. Tick labels use symbolic pi fractions (-π, -π/2, 0, π/2, π) on x and numeric values (-4..4) on y, both in soft dark gray. Subtle horizontal gridlines only, low-contrast and non-competing. Legend at right lists Setosa/Versicolor/Virginica with rounded color swatches, no box frame.
      Data: 90 semi-transparent overlapping wave curves — green (Setosa), lavender (Versicolor), blue (Virginica) — forming characteristic Andrews-curve bands. First series is #009E73 (brand green) as required.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink (off-white/light gray), clearly legible against the dark surface. Gridlines remain subtle. Legend swatches and text also flip to light-readable tones.
      Data: Curve colors are identical to the light render (same green/lavender/blue hues) — only the chrome (background, text, grid) flips, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS — no dark-on-dark failures observed; every title, axis label, tick label, and legend entry is clearly visible.
