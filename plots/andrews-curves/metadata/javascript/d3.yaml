review:
  strengths:
  - Correct Andrews curve / Fourier formula generalized cleanly to 6 dimensions
  - 'Directly addresses all 3 attempt-1 weaknesses: added a bold per-species mean
    curve for visual hierarchy, reduced stroke-opacity from 0.45 to 0.35 to improve
    distinguishability in the dense overlap band, and expanded from 4 to 6 variables
    (within the spec''s 4-8 recommendation)'
  - Variables z-score standardized before the Fourier transform, exactly as the spec's
    normalization note requires
  - 'Correct Imprint palette in canonical order with first series #009E73, identical
    data colors between light and dark renders'
  - 'Idiomatic modern D3: scaleOrdinal + scaleLinear, d3.line() path generator, .join()
    enter pattern, d3.mean/d3.deviation/d3.extent/d3.range'
  - Custom pi-fraction tick labels (-π, -π/2, 0, π/2, π) add a nice domain-specific
    touch
  - Theme-adaptive chrome correctly threaded through ink/inkSoft/grid tokens; both
    renders pass the theme-readability check with no dark-on-dark or light-on-light
    issues
  - Canvas matches the landscape target exactly with no edge clipping
  weaknesses:
  - The legend labels species colors but doesn't visually distinguish the bold mean
    curve from the thin individual curves, so the visual-hierarchy technique isn't
    self-explanatory to a first-time viewer
  - In the busiest overlap band (t ≈ -π/2 to 0), individual thin Versicolor and Virginica
    strands still blend together despite the alpha reduction to 0.35 — largely inherent
    to the technique's density with 90 curves, not a implementation defect
  - Library Mastery usage remains fairly standard D3 (scales, axis generators, line
    generator, array helpers plus the pi-tick customization) without reaching for
    a more distinctive D3 module or technique
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "andrews-curves · javascript · d3 · anyplot.ai" centered at top; axis titles "t (Fourier parameter)" (x) and "f(t)" (y, rotated) in dark ink; x tick labels use symbolic pi fractions (-π, -π/2, 0, π/2, π); y tick labels are plain numbers. Subtle horizontal (y-axis only) gridlines. Legend at right with rounded color swatches and no frame. All text is clearly readable against the light background — no light-on-light issues.
      Data: Ninety semi-transparent (stroke-opacity 0.35) overlapping wave curves in green (Setosa) / lavender (Versicolor) / blue (Virginica), plus one bold, opaque (stroke-opacity 0.9, width 3) mean curve per species drawn on top for visual hierarchy. First series is #009E73 as required, canonical Imprint order (green, lavender, blue).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink, clearly legible against the dark surface; gridlines remain subtle but visible. No dark-on-dark failures — every title, axis label, tick label, and legend entry is clearly visible.
      Data: Curve colors (green/lavender/blue, both thin individual curves and bold mean curves) are identical to the light render — only chrome (background, text, grid) flips, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS
