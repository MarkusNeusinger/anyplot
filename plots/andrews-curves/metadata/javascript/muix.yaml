review:
  strengths:
  - The Andrews transform is computed from z-scored variables (f(t) = x1/√2 + x2·sin
    t + x3·cos t + …) over a 121-sample t grid from −π to π, so all 60 curves are
    smooth, sit at their computed values and differ in shape rather than in offset
  - The translucent curves (stroke-opacity 0.4) make the Setosa, Versicolor and Virginica
    bundles read as denser bands, and the groups separate clearly around t ≈ 0 and
    t ≈ 2 while merging near ±π, exactly as the spec's characteristic section describes
  - 'MUI X idioms used well: an explicit tickInterval array plus a location-aware
    valueFormatter gives −π…π tick labels on the axis and ''t = 1.23'' in the tooltip,
    data-series attribute selectors in sx style the observation and group lines separately,
    and the legend lists only the labelled series so 60 observations collapse into
    three entries'
  - 'Theme tokens are applied to every chrome element (title, subtitle, ticks, axis
    lines, grid, legend), and colors are taken by position from t.palette in canonical
    Imprint order with #009E73 first; both renders are fully legible'
  - Iris-like data drawn per species with a fixed-seed LCG and Box–Muller gives deterministic,
    realistic measurements (sepal and petal lengths and widths in cm) and keeps a
    natural outlier curve straying from the Setosa bundle
  weaknesses:
  - 'Suggestion: the y tick labels use an ASCII hyphen (''-2.0'') while the x ticks
    use a typographic minus (''−π''); a valueFormatter that emits U+2212 would make
    both axes consistent.'
  - 'Suggestion: in the dark render the translucent Virginica curves (#4467A3 at 40
    % opacity) are the dimmest bundle; a slightly higher stroke opacity for dark mode
    only would give that bundle the same presence as the other two.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold near-black title "andrews-curves · javascript · muix · anyplot.ai" top left (about a third of the width), grey subtitle "60 observations · 4 variables, z-scored · bold line: mean curve per species"; y axis "Andrews function f(t)" with ticks from -4.0 to 4.5 in steps of 0.5, x axis "Fourier parameter t" with ticks −π, −π/2, 0, π/2, π; subtle horizontal grid only; centered bottom legend Setosa / Versicolor / Virginica. All text is dark on light and readable.
      Data: 60 smooth translucent Andrews curves, 20 per species: Setosa in #009E73 (first series), Versicolor in lavender #C475FD, Virginica in blue #4467A3, each with a bold mean curve on top. Setosa dips at t ≈ 0.5 and peaks near t ≈ 2.2, Virginica does the opposite, Versicolor stays flat near 0; groups merge near ±π. One Setosa curve strays up to about 4.2.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle, ticks, axis lines and axis titles in light soft ink, grid lines dim but visible; legend text light. No dark-on-dark text anywhere.
      Data: identical colors and curves to the light render (green, lavender, blue at the same opacity and stroke widths); only the chrome flipped. Translucent Virginica curves are the dimmest bundle but still distinguishable; brand green reads well.
      Legibility verdict: PASS
