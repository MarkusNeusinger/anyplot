review:
  strengths:
  - Correct Andrews-curve Fourier expansion (f(t) = x1/√2 + x2·sin(t) + x3·cos(t)
    + x4·sin(2t)) over t ∈ [-π, π] as specified
  - Z-score normalization applied across all four variables before transformation,
    exactly matching the spec note about preventing a dominant variable from skewing
    the curve shapes
  - Deterministic per-species LCG RNG produces realistic Iris-like measurements (means/std-devs
    approximate the real species), giving reproducible, plausible data
  - Clean per-species legend (only the first curve of each species carries a `label`)
    instead of dumping 60 individual legend entries
  - Correct Imprint palette assignment in canonical order (Setosa=#009E73 green, Versicolor=lavender,
    Virginica=blue), identical data colors across both themes
  - Both light and dark renders are fully readable with correct theme-adaptive chrome
    (background, title, axis labels, tick labels, subtle horizontal grid)
  - Alpha-blended, natural-interpolated lines with no markers make the 60-curve overplot
    legible and reveal genuine species clustering — exactly the analytical payoff
    the spec calls for
  weaknesses:
  - Series alpha is 0.55, slightly above the spec's suggested <0.5 for dense multi-curve
    overplotting — a touch more transparency would separate the Setosa/Virginica overlap
    regions further
  - X-axis renders a tick label every 0.20 (about 33 labels) which is denser than
    needed for a parameter axis — thinning to ~0.40-0.80 steps would reduce visual
    clutter without losing readability
  - Aesthetic sophistication is solid but fairly close to a standard MUI X line chart
    look (DE-01) — a subtle touch like a slightly muted background band or emphasis
    on one representative curve per species could push the storytelling further
  - Distinctive MUI X features are used only modestly (LM-02) — natural curve interpolation
    and custom legend are nice touches, but no axis highlighting, custom tooltip formatting,
    or other library-specific flourishes beyond the basics
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) as required — not pure white.
      Chrome: Title "andrews-curves · javascript · muix · anyplot.ai" in bold dark ink, top-left. X-axis label "t (Fourier Parameter)" and Y-axis label "f(t)" in dark ink, tick labels in slightly softer dark gray. Subtle light-gray horizontal grid lines only. Legend at the bottom center with three swatches: Setosa (green), Versicolor (lavender), Virginica (blue).
      Data: 60 individual Andrews curves (20 per species) drawn as smooth, alpha-blended wavy lines spanning t = -π to π and f(t) roughly -4 to 4.5. First series color is #009E73 (brand green, Setosa), Versicolor is lavender/purple, Virginica is blue. A visible clustering pattern emerges: green (Setosa) curves rise distinctly on the right side, blue (Virginica) curves peak in the left-center, and purple (Versicolor) curves sit more centrally/flatter — demonstrating the technique's clustering value.
      Legibility verdict: PASS — all title, axis label, and tick text is clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) as required — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink (near-white) against the dark background, fully legible. Grid lines are a subtle light gray, visible but unobtrusive. Legend text is light-colored and readable at the bottom.
      Data: Identical curve colors and shapes to the light render — green (Setosa), lavender (Versicolor), blue (Virginica) — confirming the data-color/chrome-only-flips rule is honored. No markers, same alpha-blended overlap pattern and clustering visible.
      Legibility verdict: PASS — no dark-on-dark failures; every text element (title, axis labels, tick labels, legend) reads clearly against the near-black background.
