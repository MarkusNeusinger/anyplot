review:
  strengths:
  - Mathematically correct Andrews-curve implementation with accurate Fourier coefficients
    and t-range
  - Individual-curve-cloud + bold-mean-curve layering keeps the legend readable (3
    entries instead of 60) while still surfacing per-observation density
  - Iris species means/std-devs are close to the real dataset's statistics
  - 'Both renders pass every edge check: no clipped title, axis labels, tick labels,
    or legend entries at any canvas edge'
  - Palette and theme chrome are fully compliant in both light and dark renders
  weaknesses:
  - No deliberate outlier observation is included; the spec calls out outlier detection
    as a use case, and the current data doesn't demonstrate an anomalous curve visually
    diverging from its cluster
  - Data storytelling could go one step further with a light annotation or subtitle
    noting the clearest cluster separation, to earn 'excellent' rather than 'good'
    on DE-03
