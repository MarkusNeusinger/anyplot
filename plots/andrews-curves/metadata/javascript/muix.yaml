review:
  strengths:
  - Correct Andrews transform f(t) = x1/√2 + x2·sin t + x3·cos t + … over z-scored
    variables, sampled at 121 points on [−π, π] so every curve is smooth and at its
    computed values
  - Per-series styling through v9 CSS selectors on data-series ids ('obs-' prefix
    at strokeOpacity 0.4, 'mean-' prefix at 3.5 px) keeps 63 series configurable without
    63 style blocks
  - 'x axis uses tickInterval with a location-aware valueFormatter: π-fraction tick
    labels in the static render, exact ''t = 0.52'' values in the HTML tooltip'
  - Imprint palette in canonical order (green, lavender, blue) identical in both renders;
    chrome threaded through ink/inkSoft/grid tokens so both themes read cleanly
  - Iris-like data generated deterministically with a seeded LCG and Box-Muller, 60
    observations × 4 variables inside the spec's recommended range
  weaknesses:
  - 'Suggestion: y tick labels use an ASCII hyphen (-1.5) while the x ticks use a
    true minus (−π); a valueFormatter emitting U+2212 would make both axes typographically
    consistent.'
  - 'Suggestion: the gap of about 50 px between the x tick labels and the ''Fourier
    parameter t'' title could shrink (x axis height 64 → about 48) to tighten the
    lower band.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold dark title "andrews-curves · javascript · muix · anyplot.ai" top-left with a grey subtitle "60 observations · 4 variables, z-scored · bold line: mean curve per species"; y axis "Andrews function f(t)" with ticks -4.0 … 4.5; x axis "Fourier parameter t" with ticks −π, −π/2, 0, π/2, π; subtle horizontal grid; legend Setosa / Versicolor / Virginica centered at the bottom. All text dark and readable.
      Data: 60 translucent smooth curves (Setosa #009E73, Versicolor #C475FD, Virginica #4467A3) plus a bold mean curve per species. Setosa clearly separates (low around −π/2 and 0, high near 3π/4); Versicolor stays near zero; Virginica peaks near π/4. Curves cross and merge near ±π as the spec permits.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, tick labels, axis titles and legend text all flip to light ink; grid lines subtle grey; x axis line light. No dark-on-dark text.
      Data: identical colors and curves to the light render; translucent bundles read as denser bands, bold mean curves stand out; brand green clearly visible, Virginica blue dimmer but distinguishable.
      Legibility verdict: PASS
