review:
  strengths:
  - Correct Andrews curve Fourier transform (x1/√2 + x2·sin(t) + x3·cos(t) + x4·sin(2t))
    with per-column z-score standardization, exactly as the spec's Notes section recommends.
  - 'First categorical series is brand green #009E73 (Cluster A), with Cluster B/C
    following the Imprint palette in canonical order.'
  - 'Both themes render correctly: background, title, subtitle, axis labels, ticks,
    grid, and legend all use theme-adaptive tokens; data colors are pixel-identical
    between light and dark renders.'
  - Title matches the mandated `andrews-curves · javascript · highcharts · anyplot.ai`
    format exactly; legend labels (Cluster A/B/C) map clearly to the color-coded groups.
  - Realistic, neutral iris-like flower measurement data (sepal/petal length & width)
    with plausible real-world ranges and three distinguishable clusters.
  - Deterministic via a fixed-seed LCG (seed=42) since the browser has no seeded RNG
    — matches the highcharts.js library guidance.
  - 'Nice domain-specific touch: custom π-formatted x-axis ticks (-π, -π/2, 0, π/2,
    π) instead of raw decimals.'
  - Uses transparency (opacity 0.45) as the spec's Notes section recommends for revealing
    density patterns among many overlapping curves.
  weaknesses:
  - Design Excellence reads as a well-configured default rather than a distinctive
    treatment (DE-01) — consider a deliberate touch such as a bolder/opaque representative
    (median or centroid) curve per cluster to anchor the eye, or a slightly refined
    typographic hierarchy between title/subtitle.
  - Visual refinement is decent but not exceptional (DE-02) — the axis lines/spines
    are plain default; consider trimming to a cleaner L-shape or removing the axis
    line entirely since gridlines already anchor the scale.
  - Data storytelling is only moderate (DE-03) — Cluster B (lavender) overlaps heavily
    with both other clusters and reads as the least visually distinct group; consider
    a brief annotation or subtitle callout pointing at where the clusters separate
    most clearly (e.g. near t≈±π where Cluster A and Cluster C diverge most) to guide
    the viewer to the insight.
  - Axis labels 't' and 'f(t)' are minimal/generic (VQ-06) — while these are the conventional
    Andrews-curve notation, consider a small parenthetical, e.g. 't (Fourier parameter,
    -π to π)' and 'f(t) (curve value)', to score full marks on descriptiveness.
  - In the densest overlap band (roughly -π/2 to π/2) the 60 overlapping 1.5px lines
    at 0.45 opacity braid together and individual curves become hard to trace (VQ-03)
    — a slightly thinner lineWidth (~1) or marginally lower opacity would improve
    legibility without losing the density-pattern effect.
  - Library Mastery usage is solid but generic (LM-02) — the π-tick formatter and
    selective legend/mouse-tracking dedup are nice touches, but nothing here is uniquely
    hard to replicate in another charting library; consider a Highcharts-distinctive
    feature such as chart.zoomType for interactive range exploration (core option,
    no add-on module needed).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "andrews-curves · javascript · highcharts · anyplot.ai" in bold dark text at top; subtitle "Standardized flower measurements as Fourier curves — similar observations trace similar shapes" in medium-gray below it; x-axis title "t" and y-axis title "f(t)" in gray; tick labels (-π, -π/2, 0, π/2, π on x; -5..5 on y) in gray; subtle horizontal gridlines only; legend with three color swatches (Cluster A/B/C) centered at the bottom. All chrome elements are clearly legible against the light background.
      Data: Three sets of ~20 overlapping wave-like curves each. Cluster A is brand green (#009E73), Cluster B is lavender/purple (#C475FD), Cluster C is steel blue (#4467A3) — matches Imprint palette positions 1, 2, 3 in canonical order, with the brand green correctly assigned to the first series. Curves braid together most densely in the t≈-π/2..π/2 band and separate more toward the ±π edges.
      Legibility verdict: PASS — no light-on-light issues, all text and data clearly distinguishable from the background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-title/tick-label/legend structure, now rendered in light gray/white text against the dark background. Gridlines remain subtle and visible. No dark-on-dark failures observed — every text element (title, subtitle, axis titles, tick labels, legend) is clearly legible.
      Data: Cluster A/B/C use the identical green/lavender/blue hues as the light render — confirmed pixel-identical data colors, only chrome (background + text) flipped as required. Brand green (#009E73) remains clearly visible against the dark surface.
      Legibility verdict: PASS — no dark-on-dark failures, all chrome and data elements read clearly.
