review:
  strengths:
  - Bold per-cluster centroid curves (lineWidth 3, zIndex 5) now sit on top of the
    faint individual traces — a deliberate visual anchor that directly fixes the attempt-1
    'well-configured default' critique and makes Cluster B's separation legible.
  - Individual-curve density tuned (opacity 0.45→0.3, lineWidth 1.5→1) — the densest
    overlap band around t≈0 is noticeably easier to trace than attempt 1 while still
    reading as a texture of density.
  - Axis titles now carry full descriptive parentheticals ('t (Fourier parameter,
    -π to π)', 'f(t) (curve value)') instead of bare 't'/'f(t)' notation.
  - 'Axis lines removed (lineWidth: 0 on both axes) for a cleaner, gridline-anchored
    look, addressing the attempt-1 ''plain default axis lines'' note.'
  - 'chart.zoomType: ''x'' added — a genuine Highcharts-distinctive interactive feature
    for range exploration in the HTML output, directly responding to the LM-02 feedback.'
  - Correct Andrews curve Fourier transform (x1/√2 + x2·sin(t) + x3·cos(t) + x4·sin(2t))
    with per-column z-score standardization, exactly matching the spec's Notes.
  - 'First categorical series is brand green #009E73 (Cluster A); Cluster B/C follow
    the Imprint palette in canonical order, identical across both themes.'
  - 'Both renders are fully theme-correct: warm off-white / near-black backgrounds,
    no dark-on-dark or light-on-light failures, all data colors pixel-identical between
    themes.'
  - Realistic, neutral iris-like flower measurement data (three clusters, plausible
    sepal/petal ranges) with a deterministic fixed-seed LCG (seed=42), matching the
    highcharts.js browser-RNG guidance.
  - 'Legend deduplicated to only the 3 centroid series (showInLegend: false on the
    60 individual curves) — avoids legend clutter while still conveying group identity.'
  weaknesses:
  - 'Mouse tracking is fully disabled (enableMouseTracking: false) on every series,
    including the 3 bold centroid curves, and tooltip is off entirely — zoomType is
    now the only interactive feature left; consider re-enabling tooltip + mouse tracking
    on just the 3 centroid series for a lightweight hover layer without reintroducing
    clutter from the 60 individual curves.'
  - The densest overlap band (t ≈ -π/2..π/2) is improved over attempt 1 but still
    shows moderate visual crowding among the faint individual curves — inherent to
    Andrews curves with 60 observations, but a slightly lower opacity (e.g. 0.25)
    would help further.
  - Only 4 of the spec's recommended 4-8 dimensions are used (the minimum of the recommended
    range) — a 5th-6th variable would exercise more of the Fourier expansion and demonstrate
    deeper feature coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "andrews-curves · javascript · highcharts · anyplot.ai" at top, gray subtitle below, gray "t (Fourier parameter, -π to π)" / "f(t) (curve value)" axis titles, gray tick labels (-π, -π/2, 0, π/2, π on x; -5..5 on y), subtle horizontal-only gridlines, bottom-centered legend with three swatches (Cluster A/B/C). All chrome text is clearly readable against the light background.
      Data: Three families of curves in brand green (#009E73, Cluster A), lavender/magenta (Cluster B), and steel blue (Cluster C). ~60 faint individual curves (opacity 0.3, lineWidth 1) establish a density texture, braiding most heavily near t≈0 and separating cleanly toward ±π; a bold centroid curve per cluster (lineWidth 3) sits on top and is clearly traceable for all three groups, including Cluster B which was hard to distinguish in attempt 1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Identical structure with all chrome (title, subtitle, axis titles, tick labels, legend) rendered in light gray/white — no dark-on-dark failures anywhere.
      Data: Data colors (green/lavender/blue, both faint individual curves and bold centroids) are pixel-identical to the light render; only the chrome flipped, as required. Brand green and the bold centroid curves remain clearly visible against the dark surface.
      Legibility verdict: PASS
