review:
  strengths:
  - 'Fixed the attempt-1 palette-order issue: setosa/versicolor/virginica now map
    cleanly to palette[0]/[1]/[2]'
  - Raised feature dimensionality from 4 to 6 (added derived sepal-area, petal-area)
    per the attempt-1 feedback, better showcasing the technique
  - New representative-curve-per-cluster technique (closest-to-centroid curve drawn
    bolder, more opaque, and on top via z) meaningfully sharpens cluster storytelling
    amid 45 overplotted curves
  - Curve opacity tuned to 0.42 for non-representative curves, within the spec's alpha<0.5
    recommendation
  - Correct Andrews curve math with z-score standardization per variable
  - Custom pi/pi-2 axis-tick formatter improves readability over raw radians
  - Deterministic seeded PRNG (mulberry32, seed 42)
  - Both renders fully legible with correct theme backgrounds and identical data colors
    between themes
  weaknesses:
  - Beyond the representative-curve emphasis and pi-tick formatter, styling still
    relies on largely default line/grid treatment - limited further visual sophistication
  - 'ECharts-distinctive feature usage remains modest: only z-ordering and a custom
    axisLabel.formatter go beyond baseline API; the interactive HTML view isn''t used
    to add any distinctive tooltip/highlight behavior'
  - 'Considerable vertical whitespace between title and legend (top: 30 vs top: 90)
    could be tightened slightly for a more compact plot-area proportion'
