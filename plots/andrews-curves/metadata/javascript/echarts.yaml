review:
  strengths:
  - Correct Andrews curve math (z1/√2 plus sin/cos harmonics) with z-score standardization
    per variable, matching the spec's normalization note
  - Deterministic seeded PRNG (mulberry32, seed 42) drives all synthetic data generation
    for reproducibility
  - Clear color-coded cluster separation between the three species — setosa dips strongly
    negative, virginica peaks positive, versicolor stays central — visually demonstrating
    the clustering the spec calls for
  - Custom π / π/2 tick-label formatter on the x-axis is a nice idiomatic touch that
    improves readability over raw decimal radians
  - 'Both light and dark renders are fully legible with correct theme background colors
    (#FAF8F1 / #1A1A17) and identical data colors between themes'
  weaknesses:
  - 'Palette order deviates from canonical series order: versicolor (2nd series in
    legend) uses palette[2] (blue #4467A3) instead of palette[1] (lavender #C475FD),
    and virginica (3rd series) uses palette[1] instead of palette[2] — no semantic
    reason for the swap since species names don''t imply real-world colors. Fix: map
    setosa→palette[0], versicolor→palette[1], virginica→palette[2] in canonical order.'
  - Curve opacity (0.55) is slightly above the spec's recommended alpha < 0.5 for
    dense multi-curve overplotting (45 curves total); drop to ~0.4-0.45 to better
    reveal density patterns in the heavily-overlapping region near t=0.
  - Only 4 dimensions used (sepal length/width, petal length/width) — spec recommends
    4-8; adding 1-2 more standardized variables would better showcase the technique's
    multivariate capability.
  - Design is largely default line styling — aside from the π-formatted ticks there's
    little visual sophistication; consider emphasizing one representative curve per
    cluster with higher opacity/width, or adding a light annotation, to sharpen the
    data storytelling.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 (light imprint surface), not pure white.
      Chrome: Title "Iris Species Clustering · andrews-curves · javascript · echarts · anyplot.ai" is dark, centered, and clearly legible. Legend (setosa, versicolor, virginica) sits below the title with readable dark text and small line+dot swatches. X-axis name "t (Fourier parameter)" and y-axis name "f(t)" are dark and legible; tick labels (-π, -π/2, 0, π/2, π and numeric y-ticks) are a slightly softer gray but still clearly readable against the light background. Grid lines are subtle light gray, visible but not dominant.
      Data: 45 wavy Andrews curves in three colors — green (setosa, palette[0], correctly first/brand color), blue (versicolor), and lavender/purple (virginica). Curves overlap heavily near t≈0, which is expected/inherent to Andrews curves overplotting, not a text-overlap issue. Setosa (green) clusters distinctly in the negative-to-lower region, virginica (purple) trends toward higher positive values, versicolor (blue) stays central — cluster separation is visually apparent.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black.
      Chrome: Title, legend text, and axis names/tick labels all render in light/white tones and are clearly legible against the dark background — no dark-on-dark failures observed. Grid lines are a subtle light gray, visible without dominating. Axis lines (crossing at zero) are light and visible.
      Data: Curve colors are identical to the light render (same green/blue/lavender hues), confirming data-color consistency across themes as required — only chrome (background, text, grid) flipped.
      Legibility verdict: PASS
