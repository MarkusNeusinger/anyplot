review:
  strengths:
  - Bold, fully-opaque per-region mean curves now overlay the 60 translucent individual
    curves, giving the chart an explicit focal point instead of an undifferentiated
    wall of lines
  - Subtitle explicitly narrates the insight ("Rioja's lower tannin visibly separates
    its curve from Bordeaux and Chianti"), turning the chart into a guided story rather
    than a raw data dump
  - Fifth chemistry variable (tannin) added, bringing dimension count to 5 (within
    the spec's 4-8 recommended range) and enriching the Fourier expansion so cluster
    separation reads more clearly
  - Individual-curve alpha lowered to 0.32 and borderWidth to 1.1 (from 0.45 / 1.5
    in attempt 1), reducing mid-band clutter while the bold mean curves stay fully
    legible
  - Chart.js `order` property correctly layers translucent individual curves beneath
    the bold mean curves, and the legend `filter` callback is re-targeted to pick
    up the solid mean-curve swatch instead of a faint individual one
  - Z-score standardization of all five wine-chemistry variables before curve construction,
    exactly matching the spec's normalization note
  - Deterministic fixed-seed LCG + Box-Muller PRNG gives fully reproducible synthetic
    data
  - Imprint palette applied in canonical order (Bordeaux=#009E73, Rioja=#C475FD, Chianti=#4467A3),
    identical between light and dark renders; theme chrome (background, text, grid)
    correctly flips in both
  - Realistic, neutral wine-chemistry scenario across three real wine regions with
    plausible value ranges for acidity, sugar, alcohol, pH, and tannin
  - Custom π/π-2 tick-label callback on the x-axis makes the radian domain immediately
    legible in both themes
  weaknesses:
  - 'Design Excellence is strong but not yet publication-tier: typography still relies
    on the default font stack (no custom font family or weight variation beyond bold/italic),
    so DE-01 caps below the top band'
  - Visual refinement is good but not maximal — grid and whitespace are subtle library-token
    defaults rather than a bespoke refinement pass; a touch more legend/title spacing
    or a hairline divider under the subtitle would push DE-02 higher
  - CQ-01 (KISS Structure) still uses several helper functions (uniform, normal, andrewsCurve,
    withAlpha) rather than flat imports->data->plot->save script structure — acceptable
    given the math involved, but not the purest KISS form
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white.
      Chrome: Bold dark title "andrews-curves · javascript · chartjs · anyplot.ai" at top, italic gray subtitle beneath it ("Bold lines trace each region's average wine — Rioja's lower tannin visibly separates its curve from Bordeaux and Chianti"), a three-entry legend (Bordeaux, Rioja, Chianti) with ring-style point markers directly below the subtitle. X-axis "t (radians)" with π-based tick labels (-π, -π/2, 0, π/2, π); y-axis "Andrews curve f(t)" with numeric ticks (-6..6). Subtle light gridlines. All chrome text is clearly dark and fully readable against the light background — no light-on-light issues.
      Data: 60 translucent individual wine curves in brand green (#009E73), lavender (#C475FD), and blue (#4467A3) at low alpha (~0.32), overlaid by 3 bold, fully-opaque region-mean curves in the same three hues (borderWidth 3.5). The bold Rioja curve visibly separates from the overlapping Bordeaux/Chianti bold curves in the mid-band, matching the subtitle's claim. First categorical series (Bordeaux) is #009E73 as required.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black.
      Chrome: Same title, subtitle, legend, and axis labels, now rendered in light ink (title/axis in near-white, subtitle/ticks in soft light gray) — clearly legible against the dark surface. Gridlines remain faint but visible. No dark-on-dark failures observed; every text element (title, subtitle, legend, tick labels, axis titles) is light-colored against the dark background.
      Data: The three curve hues (green, lavender, blue) and their alpha/boldness treatment are pixel-identical to the light render — only the background, text, and grid color flipped, confirming theme-independent data colors. Brand green #009E73 remains clearly visible on the dark surface.
      Legibility verdict: PASS
