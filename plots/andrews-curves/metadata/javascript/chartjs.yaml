review:
  strengths:
  - Mathematically correct Andrews curve formula (x1/√2 + x2·sin(t) + x3·cos(t) +
    x4·sin(2t)) evaluated over the full -π..π domain as the spec requires
  - Z-score standardization of all four wine-chemistry variables before curve construction,
    exactly matching the spec's normalization note
  - Deterministic fixed-seed LCG + Box-Muller PRNG gives fully reproducible synthetic
    data across runs
  - Density-appropriate transparency (alpha 0.45, borderWidth 1.5) across 60 overlapping
    curves keeps the plot readable instead of turning into a solid smear
  - 'Clever legend-dedup callback (`filter: (item, data) => data.datasets.findIndex(...)
    === item.datasetIndex`) collapses 60 per-wine datasets into a clean 3-entry legend
    — a genuine Chart.js-specific pattern'
  - Custom π/π/2 tick-label callback on the x-axis makes the radian domain immediately
    legible instead of showing raw decimals
  - Imprint palette applied in canonical order (green/lavender/blue) and identical
    between light and dark renders; theme chrome (background, title, axis, tick, grid
    colors) correctly flips via ANYPLOT_TOKENS in both renders
  - Realistic, neutral data scenario (Bordeaux/Rioja/Chianti wine chemistry) with
    plausible real-world value ranges for acidity, sugar, alcohol, and pH
  weaknesses:
  - 'Design Excellence is at library-default level: no custom font family, no deliberate
    visual hierarchy beyond the required category coloring — add a subtle typographic
    or emphasis touch (e.g. slightly bolder title weight, a highlighted representative
    curve per region, or a short annotation calling out the clearest cluster separation)
    so the chart tells more of a story than ''here are 60 lines''.'
  - With 60 overlapping curves the middle band (roughly f(t) in [-1, 1]) is quite
    dense and the Chianti (blue-gray) curves become hard to distinguish from Bordeaux
    (green) where they cross at low alpha — consider a slightly lower per-curve alpha
    (e.g. 0.35) or thinner borderWidth (1.0-1.2) to reduce mid-band clutter without
    losing the cluster read at the outer envelopes.
  - Only 4 of the spec's recommended 4-8 dimensions are used (acidity, sugar, alcohol,
    pH) — adding one more chemistry variable (e.g. tannin or residual-sugar proxy)
    would enrich the Fourier expansion and make cluster separation more pronounced,
    per DQ-01 feature coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "andrews-curves · javascript · chartjs · anyplot.ai" in bold dark ink, clearly legible; legend (Bordeaux/Rioja/Chianti) with color swatches sits just below the title; x-axis labeled "t (radians)" with tick labels -π, -π/2, 0, π/2, π; y-axis labeled "Andrews curve f(t)" with numeric ticks -5..5; faint horizontal/vertical gridlines visible but subtle.
      Data: 60 overlapping wavy curves in three hues — brand green (Bordeaux), lavender/purple (Rioja), and slate blue-gray (Chianti) — all alpha-blended at ~0.45. First categorical series (Bordeaux) is the Imprint brand green #009E73. Rioja's purple and Chianti's blue read correctly against the cream background.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the light background with no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, legend, and axis labels now rendered in light ink (near-white), clearly visible against the dark background; gridlines are faint light lines, still subtle; tick labels for both axes are legible.
      Data: The same three curve colors (green, purple, blue-gray) appear at identical hues and identical alpha to the light render — only the chrome (background, text, grid) has flipped, confirming the Imprint palette data colors are theme-independent.
      Legibility verdict: PASS — no dark-on-dark failures; all text elements (title, legend, axis labels, tick labels) are clearly visible against the near-black background.
