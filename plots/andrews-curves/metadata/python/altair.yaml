review:
  strengths:
  - Correct Andrews transformation computed vectorized (np.tile/np.repeat into one
    tidy long DataFrame), evaluated at 200 points so every curve is smooth with no
    corners
  - Variables z-scored before the transform, so the three species differ in curve
    shape rather than in an offset set by one dominant variable
  - 'Idiomatic Altair encoding: one mark_line with the per-observation detail channel
    and a nominal color channel on the Imprint palette (Setosa #009E73, Versicolor
    #C475FD, Virginica #4467A3), identical in both themes'
  - x scale clamped to exactly one period [-π, π] with nice=False, so every curve
    spans the full plotting area
  - Legend glyphs set opaque and thick (symbolOpacity=1, symbolStrokeWidth=3) so the
    swatches read clearly even though the curves are drawn at opacity 0.4
  - Canvas lands exactly on 3200x1800 via the pad-only block; title, legend and axis
    titles all sit with comfortable margins in both themes
  weaknesses:
  - 'Suggestion: an Altair tooltip (species and observation) on the lines would make
    individual straying curves identifiable in the HTML view.'
  - 'Suggestion: Virginica (#4467A3) at opacity 0.4 reads noticeably dimmer than the
    other two bundles on the dark background; a slightly higher opacity would balance
    the three bundles there.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas.
      Chrome: title "andrews-curves · python · altair · anyplot.ai" bold dark ink, centered above the plot; x-axis title "t (radians)", y-axis title "Andrews curve value", both dark ink; tick labels in INK_SOFT (-3.0 to 3.0 by 0.5; -5 to 6 by 1). Subtle grid. Legend "Species" in an elevated box at the upper right with thick opaque swatches. All text readable.
      Data: 150 translucent Andrews curves over t = -π..π. Setosa #009E73 forms a separate bundle (low around t=-2 and t=0.7, high around t=2.3); Versicolor #C475FD and Virginica #4467A3 overlap near 0 on the left and separate partly around t=0.7 and t=2.5. Darker bands show where similar curves bundle.
      Legibility verdict: PASS

