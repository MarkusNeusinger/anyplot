review:
  strengths:
  - 'Correct Andrews transform: StandardScaler normalization, then one basis matrix
    (1/sqrt2, sin t, cos t, sin 2t, ...) and a single matrix product over 400 samples
    of t in [-pi, pi], so every curve is smooth and at its computed values'
  - 'Idiomatic bokeh: one multi_line renderer per species fed by a ColumnDataSource,
    with an explicit Legend model titled from the SPECIES constant'
  - 'Theme tokens threaded through every chrome element; data colors identical in
    both renders, first series #009E73'
  - HoverTool on the multi_line renderers reports the species of a curve in the HTML
    output
  - 'Adaptable layout: column constants, all eight Imprint positions, plot code that
    reads only df'
  weaknesses:
  - 'VQ-05 (both): the legend, placed outside the plot on the right, ends about 10
    px from the right canvas edge while the left margin is about 180 px → at least
    40 px of clearance on the right (+30 px). Likely cause: min_border_right=50 does
    not account for the legend added with add_layout(legend, ''right''); raise min_border_right
    or reduce the legend''s padding.'
  - 'Suggestion: a slightly wider legend glyph-to-label spacing (label_standoff) would
    separate the line samples from the species names.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: bold dark title 'andrews-curves · python · bokeh · anyplot.ai' top-left; italic axis titles 't (radians)' and 'f(t)'; soft-gray ticks -3..3 and -4..4; subtle grid; legend 'Species' (Setosa, Versicolor, Virginica) on an elevated panel outside the plot at the top right, close to the right canvas edge. All text readable.
      Data: 150 smooth curves at alpha 0.4, width 3: Setosa #009E73 forms a low bundle on the left and a high one near t=2.3; Versicolor #C475FD and Virginica #4467A3 overlap but separate near t=0.8.
      Legibility verdict: PASS

