review:
  strengths:
  - Variables are z-scored before the Fourier transform, so the three species differ
    in curve shape, not only in offset
  - Dense sampling (200 points along t from -π to π) keeps every curve smooth, with
    no visible corners
  - Theme tokens thread through one pygal Style object; both renders are legible with
    identical Imprint data colors
  - Font sizes and canvas follow the 3200x1800 library defaults, with a three-column
    bottom legend naming the species
  - Interactive HTML output carries pygal's native hover and legend toggling
  weaknesses:
  - 'SC-03, SC-02 (both): each species series is one continuous SVG path, so 14 straight
    retrace segments per species (42 in all) run from the end of one curve at t=π
    back to the start of the next at t=−π, drawing near-flat lines across the whole
    plot at values no observation has (violates C1, every curve at its computed values)
    → 0 retrace segments, one separate curve per observation. Likely cause: the None
    separators are ignored because pygal.XY is built without allow_interruptions=True.'
  - 'SC-02 (both): curve opacity is 0.7, above the Notes'' alpha < 0.5 for many curves,
    so the 45 overlapping curves read as a tangle more than as darker bundles → alpha
    about 0.35–0.45 (−0.25 to −0.35). Likely cause: CURVE_ALPHA = 0.7.'
  - 'CQ-04 (code): with_alpha() (the rgba hex conversion) hand-builds per-color transparency
    that pygal''s Style(opacity=...) applies natively → delete the helper and pass
    colors=IMPRINT_PALETTE with Style(opacity=CURVE_ALPHA). Likely cause: the with_alpha()
    helper.'
  - 'CQ-01 (code): two helper functions, andrews() and with_alpha(), break the flat
    script structure → compute the Andrews values inline (for example a harmonic matrix
    built with numpy and a matrix product) and drop with_alpha() as above. Likely
    cause: def andrews and def with_alpha.'
  - 'Suggestion: drawing all 50 observations per species at a lower alpha would let
    the bundles carry more of the density story.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "andrews-curves · python · pygal · anyplot.ai" centered at the top in dark ink; x-axis title "t (radians)", y-axis title "f(t), standardized variables"; x ticks -3.14, -1.57, 0.00, 1.57, 3.14, y ticks -3 to 3; dotted muted grid in both directions; legend at the bottom (Setosa, Versicolor, Virginica) with colored swatches. All text dark and readable.
      Data: 45 Andrews curves (15 per species) at alpha 0.7: Setosa in #009E73, Versicolor in #C475FD lavender, Virginica in #4467A3 blue. Setosa swings wide (troughs near -3.4, peaks near 3.3 around t≈2.4); Versicolor and Virginica overlap more. Many near-straight lines span the full width (around y 0.2–1.0 for Setosa, -1.7–0.2 for the others) — retrace segments joining the end of one curve at t=π to the start of the next at t=−π.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and legend text in light ink, all readable; grid subtle dark dotted; no dark-on-dark text.
      Data: same three colors at the same alpha as in the light render; only chrome flipped. Virginica blue reads dimmer on the dark surface but stays visible; the same full-width retrace lines appear.
      Legibility verdict: PASS
