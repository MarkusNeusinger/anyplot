review:
  strengths:
  - 'Vectorized Andrews transform: the Fourier basis is built once and applied with
    one matrix product, 120 samples per curve give smooth curves'
  - Variables standardized with StandardScaler before the transform, so curves differ
    in shape rather than offset
  - Legend glyphs drawn opaque and thicker via guides(color=guide_legend(override_aes=...)),
    readable against the translucent curves in both themes
  - t axis labelled in π fractions over exactly one period, -π to π
  - 'Theme tokens threaded through all chrome; data colors identical in light and
    dark, Imprint order with #009E73 first'
  - Canonical 3200x1800 canvas and correct mandated title
  weaknesses:
  - 'Suggestion: a slightly lower alpha (about 0.3) for the virginica blue would let
    its denser core read darker against the dark background.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and panel.
      Chrome: title 'andrews-curves · python · letsplot · anyplot.ai' top left in dark INK; x-axis 'Parameter t (radians)' with ticks -π, -π/2, 0, π/2, π; y-axis 'Andrews function value (standardized features)' with integer ticks -5..5; subtle grid; legend 'Species' at right on an elevated off-white box. All text dark and readable.
