review:
  strengths:
  - Correct Andrews transformation computed as one matrix product of the standardized
    data with a densely sampled Fourier basis, so all 150 curves are smooth and at
    their computed values
  - x axis clamped to exactly one period with π-fraction tick labels, so the curves
    span the plot edge to edge
  - Theme tokens threaded through title, ticks, spines, grid and legend; both renders
    fully readable with identical Imprint data colors
  - Variables normalized with StandardScaler and curves drawn at alpha 0.4, so species
    bundles read as darker bands
  weaknesses:
  - 'Suggestion: a slightly heavier linewidth for the Virginica curves would lift
    the blue bundle on the dark background, where #4467A3 at alpha 0.4 reads dimmer
    than the other two species.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and axes.
      Chrome: title 'andrews-curves · python · matplotlib · anyplot.ai' in dark ink at the top centre (about half the width); x label 't (radians)', y label 'f(t)'; ticks -π, -π/2, 0, π/2, π and -4..4 in soft grey; subtle horizontal grid; top/right spines removed; legend titled 'Species' upper right on an elevated frame. All readable.
      Data: 150 translucent curves; Setosa #009E73 forms a low band on the left and a high hump near 3π/4; Versicolor #C475FD and Virginica #4467A3 overlap in the middle and separate around t≈0.5-1 where Virginica peaks. Smooth, no corners; curves run edge to edge from -π to π.
