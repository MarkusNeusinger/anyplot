review:
  strengths:
  - 'Correct, vectorized Andrews transform: z-score normalization, the 1/√2, sin t,
    cos t, sin 2t basis evaluated at 400 points, applied with one matrix product'
  - 'Seaborn-native layering: units= with estimator=None draws every observation,
    estimator=''mean'' with errorbar=None draws the per-species mean curve from the
    same long-form table'
  - Two-tier line hierarchy (faint 0.9 lw observations under 3.2 lw means) makes the
    three species read as separate bundles at a glance
  - Exact 3200×1800 canvas, style-guide text sizes, and theme tokens threaded through
    every chrome element in both renders
  weaknesses:
  - 'VQ-02 (both): the legend box at upper right (framealpha 0.95) covers the peaks
    of the setosa bundle near t≈2.5, f(t)≈3–4 → a legend clear of every curve, for
    example outside the axes on the right (bbox_to_anchor=(1.01, 1), loc=''upper left'').
    Likely cause: ax.legend(loc=''upper right'') inside the data area.'
  - 'Suggestion: a dataset other than Iris (wine cultivars, penguin species) would
    set this version apart from the other libraries'' renders.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200×1800.
      Chrome: title 'andrews-curves · python · seaborn · anyplot.ai' in dark ink, axis labels 't' and 'f(t)', π-labelled x ticks (-π … π) and numeric y ticks in INK_SOFT, subtle grid, top/right spines removed, legend 'Species (bold = mean)' on an elevated panel at upper right. All readable.
      Data: 150 faint Andrews curves (lw 0.9, alpha 0.3) colored setosa #009E73, versicolor #C475FD, virginica #4467A3, with a bold 3.2 lw mean curve per species. Setosa separates clearly below zero for t<π/2 and peaks near t≈2.5; versicolor and virginica overlap, virginica swinging higher mid-range. The legend box covers the top of the setosa peaks.
