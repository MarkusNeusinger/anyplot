review:
  strengths:
  - Andrews transform with the standard x1/√2 + x2 sin t + x3 cos t + x4 sin 2t basis
    over 100 samples on [-π, π]; curves are smooth
  - StandardScaler normalization before the transform, so curves differ in shape
  - Long-format data with group=observation draws all 150 curves in one geom_line
    layer
  - alpha=0.4 makes species bundles read as darker bands
  - Theme tokens applied to every chrome element; both renders theme-correct with
    identical Imprint data colors
  weaknesses:
  - 'SC-04 (both): the title reads ''andrews-curves · plotnine · anyplot.ai'' and
    lacks the language segment → ''andrews-curves · python · plotnine · anyplot.ai''.
    Likely cause: the labs(title=...) string.'
  - 'VQ-05 (both): canvas is 4800×2700 instead of 3200×1800 (+1600 × +900) → 3200×1800.
    Likely cause: figure_size=(16, 9) with plot.save(dpi=300) → figure_size=(8, 4.5)
    and plot.save(dpi=400, width=8, height=4.5, units=''in''), font sizes halved accordingly.'
  - 'Suggestion: build the long frame with np.tile/np.repeat over a basis matrix instead
    of appending one dict per point.'
  - 'Suggestion: place the x breaks at multiples of π/2 with π labels so the full
    period reads directly off the axis.'
