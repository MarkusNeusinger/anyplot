review:
  strengths:
  - Correct Andrews curve Fourier transform (x1/sqrt(2) + x2*sin(t) + x3*cos(t) +
    ...), built cleanly via a vectorized basis-matrix multiplication rather than a
    manual per-term loop.
  - Real-world mtcars dataset with 5 normalized performance/weight features, grouped
    and colored by cylinder count — produces clearly visible cluster separation (green
    4-cyl high, blue 8-cyl low, lavender 6-cyl in between) that directly demonstrates
    the spec's clustering use-case.
  - 'Both renders are correctly theme-adaptive: chrome (background, ink, grid, legend
    frame) flips between light and dark while the three Imprint data colors stay pixel-identical;
    first categorical series is brand green #009E73.'
  - Legend is manually constructed with representative proxy lines, positioned top-right
    with zero overlap against the data curves in either theme; clean minimal-chrome
    axis styling (top/right spines removed, subtle 0.15-alpha gridlines).
  weaknesses:
  - Curve alpha is 0.55, slightly above the spec's guidance of alpha < 0.5 for revealing
    density patterns with many overlapping curves — reducing to ~0.4 would make the
    densely overlapping middle region (t near 0) easier to parse.
  - No annotation or emphasis is used to anchor the spec's 'outlier detection' use
    case (e.g., highlighting one distinctly different curve) — the plot demonstrates
    clustering well but not outlier identification specifically.
  - Library usage is idiomatic but generic — no distinctive Makie-specific feature
    (e.g. Observables, a custom recipe, or per-curve annotation) is used beyond standard
    lines!/Axis/axislegend calls.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "andrews-curves · julia · makie · anyplot.ai" in bold dark ink, clearly visible; x-axis label "t (radians)" with custom -π/-π/2/0/π/2/π ticks and y-axis label "f(t)" both dark and legible; tick labels in a softer dark gray, fully readable; top/right spines removed, subtle light-gray gridlines visible without dominating; legend box ("Cylinders": 4-cylinder/6-cylinder/8-cylinder) sits top-right on a near-white elevated panel with a soft border, fully inside the canvas and not overlapping any curve.
      Data: ~32 overlapping wave-like curves in three colors — green (#009E73, 4-cylinder), lavender (#C475FD, 6-cylinder), and blue (#4467A3, 8-cylinder) — at alpha ≈0.55, with visible density buildup where curves cross near t=0. Colors match the canonical Imprint order (green first).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and custom π-tick labels now in light ink/off-white, clearly legible against the dark background; tick labels in a softer light gray, fully readable; grid lines subtle but visible; legend box uses a dark elevated panel with light text and a soft border, fully inside the canvas, no overlap with curves.
      Data: Identical green/lavender/blue curve colors and alpha as the light render — only the chrome (background, text, grid, legend panel) flipped, confirming theme-adaptive chrome was implemented correctly.
      Legibility verdict: PASS — no dark-on-dark text found; brand green remains clearly visible against the dark surface.
