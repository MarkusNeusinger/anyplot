review:
  strengths:
  - Correct, textbook Andrews-curve Fourier transform with proper per-feature z-score
    normalization before the expansion
  - Real, neutral mtcars dataset with genuine multi-feature (5-dimension) coverage
    and visible cluster separation by cylinder class
  - Theme-adaptive chrome implemented correctly and completely — both renders pass
    the light/dark readability check with zero dark-on-dark or light-on-light failures,
    and data colors are pixel-identical across themes
  - 'Correct canonical Imprint palette order with first series #009E73'
  weaknesses:
  - 'Outlier highlight doesn''t render: the code draws an ink halo (lines!(...; color=(INK,
    0.5), linewidth=6.0)), a full-opacity outlier line, a stroked scatter marker,
    and a text!(...; text="Outlier: $(outlier_model)", ...) annotation intended as
    the plot''s focal point — but pixel analysis of both plot-light.png and plot-dark.png
    finds zero ink-colored pixels anywhere in the plot data area (outside title/axis-label/legend
    bands). Verify the text! call lands within the final axis limits (draw before
    axislegend''s layout pass, or set limits! explicitly), confirm the (INK, 0.5)
    alpha-tuple color syntax renders in this CairoMakie version, and check the scatter
    strokewidth=1.5 ring survives downsampling.'
  - With all three groups' curves at alpha=0.4 crossing near the center, the middle
    of the plot is visually dense — consider a lower alpha or thinner linewidth for
    non-highlighted curves so the (once-fixed) outlier stands out more
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "andrews-curves · julia · makie · anyplot.ai" bold and dark, fully legible. Axis labels "t (radians)" and "f(t)" dark and legible. Tick labels (-π, -π/2, 0, π/2, π on x; -4..4 on y) legible in softer ink tone. Legend box top-right ("Cylinders") with 3 entries, readable.
      Data: ~32 overlapping Andrews-curve traces at alpha≈0.4 in three Imprint colors — green (#009E73, 4-cylinder), lavender (#C475FD, 6-cylinder), blue (#4467A3, 8-cylinder). Pixel analysis found no visible ink-colored halo, scatter marker stroke, or "Outlier: <model>" text label anywhere in the plot area — the code's outlier-highlight block does not render.
      Legibility verdict: PASS (all chrome text readable; no light-on-light issues)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels flip to light ink tones (F0EFE8 / B8B7B0) and remain fully legible. Legend box and text flip correctly too.
      Data: Same three curve colors as light render — confirmed pixel-identical (only chrome flips). Same pixel-level check confirms the outlier halo/marker/text annotation is not visible here either.
      Legibility verdict: PASS (no dark-on-dark failures found)
