review:
  strengths:
  - Mathematically correct Andrews curve Fourier basis (x1/√2 + x2 sin(t) + x3 cos(t)
    + x4 sin(2t) + ...), verified term-by-term against the standard formula.
  - 'Follows the spec''s data-prep notes precisely: z-score normalization via scale()
    before transformation, and alpha=0.35 (< 0.5) for the dense overlapping curves.'
  - Both themes render correctly with proper token-driven chrome flip; data colors
    (green/lavender/blue for setosa/versicolor/virginica) are identical between light
    and dark.
  - 'Palette compliance: first categorical series is #009E73, canonical Imprint order
    used for the 3-species mapping.'
  - Clean KISS-structured code — no functions/classes, only used imports, correct
    ggsave/ragg output as plot-{THEME}.png.
  - Custom π-based x-axis tick labels (-π, -π/2, 0, π/2, π) match the domain convention
    the spec calls out.
  weaknesses:
  - Panel grid uses the full INK color (not a softened/desaturated token) at linewidth=0.15
    — in the light render the gridlines read slightly more prominent than a truly
    subtle grid; consider a fainter grey token.
  - With 150 overlapping observations across 3 species and alpha=0.35, the plot becomes
    a dense hairball in the t≈0 overlap region — inherent to the technique, but a
    slightly lower alpha (~0.25) or thinner lines would improve clarity in the busiest
    zone.
  - 'Design Excellence is at default/generic level: theme_minimal + Imprint palette
    with no distinctive ggplot2-specific technique (e.g. facet_wrap by species to
    make the per-cluster shape comparison easier) to lift it beyond a standard treatment.'
  - Axis labels are bare math notation ('t', 'f(t)') with no units/description — acceptable
    given this is the domain-standard notation for Andrews curves, but a caption noting
    the Fourier-transformed nature would aid a first-time viewer.
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: title "andrews-curves · r · ggplot2 · anyplot.ai" in dark ink at top-left, fully visible, not clipped. Axis titles "t" (x) and "f(t)" (y) and tick labels (-π, -π/2, 0, π/2, π on x; -5.0 to 5.0 on y) render in dark/soft-dark ink, all legible. Grid lines are thin dark lines, visible but not overly dominant. Legend "Species" with entries setosa/versicolor/virginica on the right, dark text, fully within canvas.
      Data: three color groups — setosa in brand green #009E73, versicolor in lavender #C475FD, virginica in blue #4467A3 — matching the Imprint palette canonical order (first series = green). ~150 semi-transparent (alpha 0.35) overlapping Fourier curves per observation, colored by species, forming distinguishable wave-band clusters (setosa low/negative band, virginica upper band, versicolor central/flatter band) with overlap in the middle.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: title in light/near-white ink, fully visible, not clipped. Axis titles and tick labels render in light ink, all legible against the dark background. Grid lines are thin light lines, visible but subtle. Legend "Species" with the same three entries, light text, fully within canvas, no dark-on-dark failures observed.
      Data: identical colors to the light render — green (#009E73, setosa), lavender (#C475FD, versicolor), blue (#4467A3, virginica) — confirming only chrome flipped between themes, not data colors. Same curve density and alpha as the light render.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or unreadable elements found.
