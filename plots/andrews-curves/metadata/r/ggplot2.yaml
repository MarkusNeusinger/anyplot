review:
  strengths:
  - facet_wrap(~species) now actually renders as three side-by-side panels in both
    plot-light.png and plot-dark.png, resolving the critical mismatch flagged in the
    prior review attempt — setosa's distinct double-hump shape is now clearly separated
    from versicolor's and virginica's more overlapping patterns.
  - Correct Andrews-curves Fourier basis construction (x1/sqrt(2), sin/cos harmonics
    via basis matrix multiplication), matching the specification's math exactly.
  - Variables are z-score normalized (scale()) before the Fourier expansion, exactly
    as the specification's Notes section requires to avoid one dimension dominating.
  - Theme-adaptive chrome (title, axis text, tick text, grid, strip labels, legend)
    is threaded through consistently; both renders pass the legibility check with
    no dark-on-dark or light-on-light failures.
  - 'Imprint palette correctly applied — setosa (first factor level) gets #009E73,
    and light/dark renders share identical data colors with only chrome flipping between
    #FAF8F1 and #1A1A17.'
  - Clean idiomatic tidyverse pipeline (pivot_longer, dplyr chain) and correct ragg::agg_png
    save at the mandated 8x4.5in/400dpi landscape canvas.
  weaknesses:
  - The versicolor and virginica facet panels remain fairly dense (many crossing curves),
    so individual-curve tracing is still hard there even with facets and alpha=0.3
    — a minor residual of the density the faceting fix was meant to address; consider
    a touch more transparency (alpha ~0.25) or slightly thinner lines in those denser
    panels.
  - Design execution stays close to theme_minimal defaults with straightforward overrides
    — no additional refinement like a y-axis-only grid or more distinctive strip-label
    treatment was attempted beyond what facet_wrap itself provides.
  - Axis labels 't' and 'f(t)' are the correct domain-standard notation for Andrews
    curves but offer no hint to unfamiliar readers of what the transform represents;
    an optional one-line subtitle could aid comprehension (not required by spec, so
    not scored down elsewhere).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — correct, not pure white, not dark.
      Chrome: Title "andrews-curves · r · ggplot2 · anyplot.ai" in dark ink top-left. Three facet panels side by side, each with a bold strip label ("setosa", "versicolor", "virginica") above it. X-axis labeled "t" with tick labels -π, -π/2, 0, π/2, π repeated under each panel; y-axis labeled "f(t)" with ticks -5.0 to 5.0 shown once on the shared left axis. A "Species" legend sits to the right of the panels, listing setosa/versicolor/virginica with matching line-color swatches. All chrome text is dark ink on the light surface and clearly readable. Grid lines are subtle, faint horizontal/vertical rules that don't compete with the data.
      Data: ~150 semi-transparent curves (alpha≈0.3) split across the three facet panels by species — setosa green (#009E73) showing a distinct double-hump shape with a tight, well-separated bundle; versicolor lavender (#C475FD) showing a flatter, more overlapping bundle; virginica blue (#4467A3) showing the tallest peak with more density/crossing than the other two. First categorical series is confirmed brand green.
      Legibility verdict: PASS (all chrome text readable in both facet strips and axes; no light-on-light failures).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — correct, not pure black, not light.
      Chrome: Identical layout to the light render — title, three facet strip labels, axis labels/ticks, and the "Species" legend — now rendered in light ink (#F0EFE8 primary / #B8B7B0 secondary) against the dark surface. Strip labels and tick labels are clearly legible; no dark-on-dark failures observed anywhere (title, axis text, tick text, legend text all contrast well against #1A1A17).
      Data: Same green/lavender/blue curve colors and same per-species shapes as the light render, confirming data colors are held constant across themes — only chrome (background, text, grid) flipped, as required.
      Legibility verdict: PASS (all chrome text readable; no dark-on-dark failures).

    Cross-render note: facet_wrap(~species, nrow = 1) now renders correctly in BOTH images as three genuine side-by-side panels — this resolves the critical mismatch flagged in the previous (attempt 2) review, where the shipped PNGs showed a single overlaid panel despite facet_wrap being present in the source code. The per-species cluster-legibility fix the previous review requested has now actually landed in the rendered output.
