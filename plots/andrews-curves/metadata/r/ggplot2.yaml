review:
  strengths:
  - Correct Andrews-curves Fourier basis construction (x1/sqrt(2), sin/cos harmonics)
    via a clean matrix multiplication, matching the specification's math.
  - Variables are z-score normalized (scale()) before the Fourier expansion, exactly
    as the specification's 'Notes' section requires to avoid one dimension dominating.
  - 'Correct Imprint palette mapping — setosa (first factor level) gets #009E73, and
    light/dark renders share identical data colors with only chrome (background, grid,
    ink) flipping between #FAF8F1 and #1A1A17.'
  - Theme-adaptive chrome is threaded through consistently (title, axis text, tick
    text, grid, legend) and both renders are fully legible with no dark-on-dark or
    light-on-light failures.
  - Idiomatic tidyverse data pipeline (pivot_longer, dplyr chain) and correct ragg::agg_png
    save at the mandated 8x4.5in/400dpi landscape canvas.
  weaknesses:
  - 'CRITICAL MISMATCH: the committed script (plots/andrews-curves/implementations/r/ggplot2.R,
    from commit 32ef711a2 ''fix(ggplot2): address review feedback'') adds `facet_wrap(~species,
    nrow = 1)` plus a comment claiming it ''splits the overlaid Fourier bands into
    per-species small multiples'' to fix the previous attempt''s cluster-legibility
    feedback. But BOTH plot-light.png and plot-dark.png show a single overlaid panel
    — one shared x-axis, one legend, no per-species strip labels, no panel-spacing
    gaps. The faceting that this fix commit was specifically written to add is not
    present in the rendered artifacts. Either the images shipped for this review are
    stale (not regenerated from the current script) or facet_wrap is silently failing
    to apply — either way the previous review''s requested fix did not actually land
    in the shipped output. This must be resolved (force a clean re-render and confirm
    3 side-by-side per-species panels appear) before this can be trusted for the catalog.'
  - Without the facets actually rendering, the dense overlap zone (t roughly 0 to
    pi/2 where all three species' curves cross) remains a busy hairball — color alone
    only partially resolves cluster separation there, which is the exact problem the
    fix commit was meant to solve.
  - The code comment above the facet_wrap call describes a visual effect (small-multiples
    cluster legibility) that the shipped PNGs do not exhibit, which is misleading
    for future maintainers reading the script next to the rendered output.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — correct, not pure white.
      Chrome: Title "andrews-curves · r · ggplot2 · anyplot.ai" in dark ink top-left; x-axis labeled "t" with tick labels -π, -π/2, 0, π/2, π; y-axis labeled "f(t)" with ticks -5.0 to 5.0; a "Species" legend on the right listing setosa/versicolor/virginica. All text is dark ink on the light surface and clearly readable. Grid lines are subtle, faint horizontal/vertical rules.
      Data: ~150 semi-transparent curves colored by species — setosa green (#009E73), versicolor lavender (#C475FD), virginica blue (#4467A3) — all overlaid in a SINGLE panel (no faceting despite facet_wrap(~species) being present in the source code).
      Legibility verdict: PASS (all chrome text readable; no light-on-light).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — correct, not pure black.
      Chrome: Same title, axis labels, tick labels, and legend, now in light ink (#F0EFE8 primary / #B8B7B0 secondary) against the dark surface. All clearly legible, no dark-on-dark failures.
      Data: Same green/lavender/blue curve colors as the light render, confirming data colors are held constant across themes — only chrome flipped, as required.
      Legibility verdict: PASS (all chrome text readable; no dark-on-dark).

    Cross-render note: Both renders show ONE overlaid panel, not the three per-species facet panels that the current committed script's facet_wrap(~species, nrow = 1) call is supposed to produce. This is flagged as a critical weakness — the rendered artifacts do not appear to reflect the fix that was specifically written to address the prior review's cluster-legibility feedback.
