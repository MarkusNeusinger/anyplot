review:
  strengths:
  - 'Continuous wind speed mapped with imprint_seq (#009E73 → #4467A3), identical
    in both themes, with a labelled colorbar covering every point''s value'
  - Thin INK_SOFT outline (0.4 pt) and alpha 0.85 keep both colormap ends and overlapping
    cluster points visible on both backgrounds
  - Exact 3200x1800 canvas with style-guide type sizes (12/10/8 pt) and full theme-token
    chrome, including the colorbar ticks and outline
  - Column constants and a tidy DataFrame drive every label, so the axis titles carry
    units straight from the data
  weaknesses:
  - 'DQ-02 (both): the station coordinates are plotted with latitude on x and longitude
    on y, so the scatter reads as a transposed map of North America (east is up, north
    is right) → longitude on x and latitude on y. Likely cause: ax.scatter(df[LATITUDE],
    df[LONGITUDE], …) and the x/y role comments on the LATITUDE / LONGITUDE constants.'
  - 'Suggestion: an outline in the page color rather than INK_SOFT on the light render
    would let the green low end read slightly crisper in the dense western cluster.'
