  strengths:
  - 'Imprint sequential ramp (#009E73 -> #4467A3) through scale_fill_gradient on shape-21
    points; data colors identical in both renders'
  - Thin INK_SOFT outline keeps both ends of the ramp visible on the light and the
    dark page
  - Colorbar titled with the variable and unit, range covering every value; axis titles
    with units come straight from the column names
  - layer_tooltips() gives formatted x, y and temperature lines in the HTML export
  - Correct 3200x1800 canvas, mandated title format, theme tokens threaded through
    all chrome
  weaknesses:
  - 'DE-02 (both): the panel is framed on all four sides (top and right frame lines
    drawn) → an L-shaped frame with only the left and bottom axis lines, per the style
    guide''s spine rule. Likely cause: theme_minimal() plus axis_line draws a full
    panel frame in this lets-plot version; blank the panel border (panel_border=element_blank())
    and keep axis_line for x and y.'
  - 'DQ-03 (both): temperature spans about 13–44 °C across sensors less than 100 m
    apart, a 30 °C gradient no real site shows at that distance → coordinates in km,
    or a temperature span of a few °C. Likely cause: coordinates generated on a 0–100
    scale labelled (m) with temperature = 15 + 0.2·x + 0.15·y.'
  - 'Suggestion: the grid at full-opacity INK_SOFT reads stronger than the style guide''s
    15 % grid token in the light render; a softer grid color would let the points
    lead.'
