quality_score: 84
review:
  strengths:
  - Uses the Imprint sequential colormap (imprint_seq) with reversescale so the cold
    northern readings sit at the blue end and the warm southern readings at the brand-green
    end, a temperature-intuitive orientation
  - Colorbar titled 'Temperature (°F)' with units, slim (thickness 14, len 0.85, no
    outline), and its range taken from the data (cmin/cmax) so every point's value
    is covered
  - Theme-adaptive thin marker outline (INK_SOFT) keeps both ends of the colormap
    visible against the page in light and dark
  - 'Mild opacity 0.85 at size 10 for 150 points: colors still match the colorbar
    and nothing hides'
  - go.Scatter hovertemplate reads %{marker.color} so the HTML view shows longitude,
    latitude and temperature per station; hover label styled with theme tokens
  - All chrome threads the theme tokens; both renders are fully readable
  weaknesses:
  - 'DQ-03 (code): the generated temperatures run from about 15 °F at 50 °N to about
    40–48 °F at 25 °N, so stations at southern-Florida and Gulf latitudes read near
    freezing; real winter means there are about 60–70 °F (about +20 °F at the warm
    end) → raise the intercept and steepen the latitude gradient so the range spans
    roughly 15–70 °F. Likely cause: `temperature = 40 - 0.6 * (latitude - 25) + ...`.'
  - 'Suggestion: sampling coordinates only over land (or naming a few real station
    regions) would make the geographic scenario read less like a uniform random box.'
  - 'Suggestion: a slightly smaller top margin would tighten the gap between the title
    and the plot area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on both paper and plot area.
      Chrome: centered title "scatter-color-mapped · python · plotly · anyplot.ai" in dark ink (~45% width); axis titles "Longitude (°)" and "Latitude (°N)" in dark ink; tick labels -120…-70 and 25…50 in INK_SOFT; subtle grid; left and bottom axis lines; vertical colorbar on the right titled "Temperature (°F)" with ticks 20–45. All readable.
      Data: 150 circular markers (size 10, opacity 0.85, thin dark-grey outline) colored on the Imprint green→blue ramp, blue (cold, ~15–25 °F) dominating the north and green (warm, ~40–48 °F) the south; no meaningful overlap.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles and colorbar title in light ink, tick labels in light grey; grid subtle but visible; no dark-on-dark text.
      Data: identical marker colors and positions to the light render; outline flips to light grey so blue points stay visible against the dark page; brand green clearly visible.
      Legibility verdict: PASS
