review:
  strengths:
  - One go.Scatter trace maps Temperature (°F) onto a native marker colorscale with
    an attached colorbar; cmin/cmax come from the data, so the bar's range covers
    every point
  - Uses the mandated imprint_seq ramp with reversescale so cold northern stations
    read blue and warm southern stations green, a mapping the reader decodes without
    the legend
  - 'Thin INK_SOFT outline (0.8 px) and mild 0.85 opacity keep 10 px markers at both
    colormap ends visible on both the #FAF8F1 and #1A1A17 surfaces while the fills
    still match the colorbar'
  - 'Colorbar is tuned for the canvas: thickness 14, len 0.85, outline removed and
    the title set on the right side, so it sits quietly beside the plot'
  - Custom hovertemplate reads %{marker.color} to show longitude, latitude and temperature
    per station in the HTML view
  - All chrome is threaded through theme tokens (INK, INK_SOFT, GRID, PAGE_BG, ELEVATED_BG
    for hover labels); both renders are fully legible
  - Data block uses column constants and a single df, and passes all adaptability
    smoke tests
  weaknesses:
  - 'CQ-04 (code): IMPRINT_PALETTE (line 22) is defined but never used; the plot uses
    only imprint_seq → delete the unused constant. Likely cause: palette block copied
    from the template without trimming.'
  - 'Suggestion: plotly express px.scatter(df, x=LONGITUDE, y=LATITUDE, color=TEMPERATURE,
    color_continuous_scale=imprint_seq) would title axes and colorbar from the column
    constants in fewer lines.'
  - 'Suggestion: the band between the title and the plot top is roomy; a slightly
    smaller top margin would give the data more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on paper and plot area.
      Chrome: centered title "scatter-color-mapped · python · plotly · anyplot.ai" in dark ink (~44 % of width); axis titles "Longitude (°)" and "Latitude (°N)" in dark ink, ticks −120…−70 and 25…50 in INK_SOFT; subtle dark grid on both axes; left and bottom axis lines only. Vertical colorbar on the right titled "Temperature (°F)" (side right), ticks 20–70, no outline. All readable.
      Data: 150 circular markers (10 px, 0.85 opacity, thin dark-grey outline) colored on the imprint_seq ramp, reversed: blue #4467A3 for cold northern points (~lat 45–50), brand green #009E73 for warm southern points (~lat 25–30), teal in between. Noisy latitude gradient clearly visible; no harmful overlap.
