review:
  strengths:
  - 'Idiomatic seaborn: sns.scatterplot over a tidy df with a continuous hue, hue_norm
    and the imprint_seq Colormap as palette, matched by a ScalarMappable colorbar
    on the same norm so the bar covers every point'
  - Theme-adaptive marker outline (INK_SOFT) keeps both ends of the green-to-blue
    ramp visible on both backgrounds
  - 'Chrome threaded through sns.set_theme rc tokens: no dark-on-dark text in the
    dark render'
  weaknesses:
  - 'DQ-03 (both): the x-axis label reads ''Longitude (°W)'' while the ticks run from
    −130 to −65, so −130 °W would mean 130 °E → either ''Longitude (°)'' with the
    signed values or ''°W'' with positive values 65–130. Likely cause: the LONGITUDE
    constant on line 45.'
  - 'Suggestion: use a seaborn-specific layer such as sns.set_context or a rugplot
    of the color variable to show more of the library.'
