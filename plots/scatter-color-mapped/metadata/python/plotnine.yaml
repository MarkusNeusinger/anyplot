review:
  strengths:
  - 'Fill mapped to Temperature (°C) through scale_fill_gradient with the two imprint_seq
    stops (#009E73 → #4467A3), identical in both renders'
  - 'Thin theme-adaptive outline (color=INK, stroke=0.3) keeps every point, including
    the green low end, visible on #FAF8F1 and #1A1A17'
  - guide_colorbar(nbin=100) gives a smooth, tall color bar whose 20–46 °C range covers
    every point; the column name supplies the bar title with its unit
  - Column constants feed aes() directly, so the axes and the color bar are titled
    from the data with units and no extra labs() calls
  - '150 points at size 3.2 with alpha 0.9: markers large enough for their color to
    be read, colors still match the bar'
  - Seeded data generation, clean imports, plot.save at 3200×1800 for both themes
  weaknesses:
  - 'Suggestion: most readings fall in the 28–38 °C middle of the ramp; a wider spatial
    gradient in the generated data would let both ends of the color bar show more
    points.'
  - 'Suggestion: the color bar''s tick marks draw as light dashes across the bar;
    shortening them or matching them to INK_SOFT would read cleaner in the light render.'
