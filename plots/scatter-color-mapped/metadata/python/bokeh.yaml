review:
  strengths:
  - 'Imprint sequential ramp (#009E73 → #4467A3) through a LinearColorMapper shared
    by the glyph fill and the ColorBar, so marker colors match the bar exactly'
  - Fully theme-threaded chrome including the ColorBar panel, labels, ticks and outline;
    readable in both renders
  - Thin INK_SOFT outline at alpha 0.6 keeps both colormap ends visible on both backgrounds
  - HoverTool with formatted X/Y/Intensity tooltips adds value-level inspection in
    the HTML output
  - Clean six-zone layout with column constants; canvas exactly 3200x1800
  weaknesses:
  - 'DQ-02 (both): the axes and color variable read as generic placeholders, ''X coordinate
    (m)'', ''Y coordinate (m)'', ''Intensity (a.u.)'' → name a concrete measurement,
    e.g. ''Easting (m)'', ''Northing (m)'', ''Soil moisture (%)'' or ''Radiation dose
    (µSv/h)''. Likely cause: the column constants X, Y, INTENSITY.'
  - 'DQ-03 (both): the color bar runs down to about -5 for a quantity labeled intensity,
    which cannot be negative → keep the variable non-negative (min ≥ 0). Likely cause:
    rng.normal(0, 3) noise added to a distance in intensity_values without clipping.'
  - 'Suggestion: a ColorBar with a few more major ticks (e.g. BasicTicker(desired_num_ticks=8))
    would make reading individual point values off the bar easier.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 for page and plot area; 3200x1800.
      Chrome: bold title "scatter-color-mapped · python · bokeh · anyplot.ai" top-left (~55% width); italic axis titles "X coordinate (m)" and "Y coordinate (m)"; tick labels 30-80 / 30-70 in INK_SOFT; subtle grid; vertical ColorBar on the right titled "Intensity (a.u.)" with ticks 0-30 on a matching page-colored panel. All readable.
      Data: 150 circular markers, size 26, filled on the imprint_seq ramp from #009E73 (center, low intensity) to #4467A3 (outer, high intensity), alpha 0.85, thin dark-grey outline. Positive x-y correlation, radial color gradient from the (50,50) center.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 for page, plot area and colorbar panel.
      Chrome: title and axis titles in light INK, tick and colorbar labels in light INK_SOFT; grid subtle but visible; no dark-on-dark text.
      Data: identical marker positions and colors to the light render; outline flips to light grey so the blue high end stays visible on the dark page.
      Legibility verdict: PASS
