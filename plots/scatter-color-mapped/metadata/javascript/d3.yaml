review:
  strengths:
  - Correct use of the Imprint imprint_seq colormap (green -> blue via d3.interpolateRgbBasis
    on t.seq) with an accurately labeled vertical colorbar, matching the spec's requirement
    for a continuous colormap + reference scale
  - 'Theme-adaptive chrome is threaded through consistently: title, axis labels, tick
    labels, gridlines, and colorbar ticks all read cleanly on both the light (#FAF8F1)
    and dark (#1A1A17) surfaces with identical data colors'
  - 'Clean, idiomatic modern D3 v7 code: join() pattern, scaleSequential/scaleLinear,
    manual SVG linearGradient defs for the colorbar, deterministic LCG data generation,
    no functions/classes'
  - Realistic, neutral dataset (urban heat island monitoring stations) with sensible
    scale (24-34 degrees C, +/-12 km) and appropriate marker sizing/opacity (r=9,
    fill-opacity 0.85) for a 180-point medium-density scatter
  - Title exactly matches the mandated format and canvas gate passes with no clipped
    elements in either render
  weaknesses:
  - 'Design excellence is competent but not distinctive: the gridlines drawn at the
    exact domain extremes (x/y .nice() bounds) form an unintentional full box-frame
    around the plot instead of the cleaner L-shaped or gridless minimal look anyplot
    favors -- consider dropping the outermost gridline or clipping gridlines to stop
    just short of the axis extents'
  - No visual hierarchy or storytelling device calls out the heat-island pattern (warmer
    temps clustering nearer the city center) -- the pattern is present in the data
    but reads as a uniform scatter at a glance; consider a subtle center marker/annotation,
    or slightly larger/more opaque markers for the warmest stations to create a focal
    point
  - Colorbar and axis tick label font sizes (13px/14px) are on the smaller end for
    legibility once the 3200px canvas is scaled down to a 400px mobile thumbnail --
    bumping to 14-15px would improve small-scale readability without crowding the
    chart
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white.
      Chrome: Title "scatter-color-mapped · javascript · d3 · anyplot.ai" is bold dark text, clearly visible. Axis labels ("Distance East of City Center (km)", "Distance North of City Center (km)") and tick labels are dark/soft-dark and fully legible against the light background. Both-axis gridlines are subtle (thin, low-opacity). Colorbar on the right is labeled "Surface Temperature (°C)" with tick labels 24°-34°, all readable.
      Data: ~180 circular markers in a green-to-blue continuous colormap (imprint_seq), each with a thin light stroke for edge definition. First-series brand green (#009E73) appears at the low end of the color scale as expected for a continuous (non-categorical) mapping.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black.
      Chrome: Title, axis labels, and tick labels flip to light/off-white and soft-light tones, fully legible against the dark background. Gridlines remain subtle. Colorbar labels and ticks are light-colored and legible. No dark-on-dark text was found anywhere (title, axes, colorbar all checked at full resolution and in crops of the title band and colorbar column).
      Data: Same ~180 points in the identical green-to-blue colormap as the light render -- confirmed data colors are unchanged between themes, only chrome (background, text, grid) flipped.
      Legibility verdict: PASS
