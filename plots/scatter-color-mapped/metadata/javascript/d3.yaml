review:
  strengths:
  - Correct imprint_seq (brand green → blue) sequential colormap for the single-polarity
    temperature variable, with identical data colors across light and dark renders
  - 'Clear data storytelling: dashed ''Urban core'' reference ellipse plus larger/more-opaque
    markers for the top-quartile-hot stations create an immediate focal point that
    surfaces the heat-island pattern'
  - Fully theme-adaptive chrome in both renders — title, axis labels, tick labels,
    gridlines, and colorbar axis all readable with no dark-on-dark or light-on-light
    failures
  - 'Clean idiomatic D3: scaleSequential + interpolateRgbBasis for the color scale,
    manual linearGradient colorbar, L-shaped gridlines (domain-extreme ticks skipped)
    to avoid a boxed frame'
  - 'Realistic, physically plausible urban heat-island scenario: ~24 km city extent,
    0.55°C/km radial temperature decay plus noise, deterministic LCG-seeded data'
  - Axis and colorbar labels are descriptive with units (km, °C)
  weaknesses:
  - Title occupies only ~35% of canvas width — noticeably below the 50-70% guideline;
    a slightly larger title fontsize would give it more visual weight without risking
    overflow
  - Hot-vs-normal marker size distinction (r=12 vs r=8) is subtle at full canvas resolution
    — a larger delta would sharpen the visual hierarchy already established by the
    annotation
  - The manually-built linear-gradient colorbar and dashed annotation ellipse are
    solid D3 techniques but not deeply distinctive to D3 specifically — could be pushed
    further with e.g. a d3-contour density overlay or brush-driven annotation for
    stronger library-mastery signal
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white.
      Chrome: Bold dark title "scatter-color-mapped · javascript · d3 · anyplot.ai" centered at top; dark axis labels "Distance East of City Center (km)" / "Distance North of City Center (km)"; dark-gray tick labels on both axes; subtle light-gray gridlines on both axes (L-shaped, no boxed frame); a dashed gray ellipse annotation labeled "Urban core" in italic gray text near the plot center.
      Data: ~180 scatter points colored via the Imprint sequential colormap (brand green #009E73 for cooler ~23-25°C stations, transitioning to blue #4467A3 for the hottest ~33-34°C stations near the city core); a vertical colorbar on the right labeled "Surface Temperature (°C)" with tick labels 24°-34°; top-quartile-hot stations render larger (r=12) and more opaque (0.95) than cooler stations (r=8, 0.75), creating a clear focal cluster inside the "Urban core" ellipse.
      Legibility verdict: PASS — all text (title, axis labels, tick labels, colorbar labels, annotation) is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black.
      Chrome: Title, axis labels, and tick labels all rendered in light color, fully readable against the dark background; gridlines are subtle light-gray at low opacity; the "Urban core" annotation text and dashed ellipse remain visible in a soft light-gray tone — no dark-on-dark failures observed.
      Data: Marker colors are identical to the light render (same green-to-blue gradient, same size/opacity emphasis on hot stations), confirming only chrome flipped between themes.
      Legibility verdict: PASS — no unreadable text in either theme.
