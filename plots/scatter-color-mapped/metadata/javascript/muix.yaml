review:
  strengths:
  - 'Spatial data tells a genuine story: temperature decays outward from a synthetic
    warm-core current near (0°E, 40°N), giving the color mapping real meaning instead
    of random noise.'
  - Colorbar (ContinuousColorLegend) has clear units and explicit min/max value labels,
    and correctly uses the Imprint imprint_seq sequential palette (t.seq) rather than
    a default/named colormap like viridis.
  - Deterministic LCG-seeded data generation, clean minimal imports, and correct use
    of skipAnimation + window.ANYPLOT_SIZE sizing per the muix harness contract.
  - 'Title fontsize dynamically scales with title length; both canvases verified pixel-exact
    at 3200x1800 with correct theme backgrounds (#FAF8F1 light / #1A1A17 dark, confirmed
    via pixel sampling).'
  weaknesses:
  - 'Dark-render markers at the high-temperature end of the scale (t.seq[1], indigo-blue,
    sampled ~rgb(44,104,130) at alpha 0.85) measure only ~2.7-2.8:1 contrast against
    the #1A1A17 background — below the WCAG 3:1 non-text-contrast guideline for meaningful
    graphical objects. Slightly raise the alpha or lighten the top-of-scale sequential
    stop specifically for dark mode.'
  - Densely overlapping clusters (e.g. near 9-10°E/32°N and -14°E/44°N) rely solely
    on alpha blending with no marker stroke, making it slightly harder to count exact
    overlap depth in the thickest clusters — a subtle stroke/border would help separate
    stacked points.
  - Distinctive MUI X usage is limited to zAxis colorMap + ContinuousColorLegend;
    no further library-specific differentiators (e.g. custom tooltip valueFormatter,
    series highlightScope) are leveraged beyond the required continuous color-mapping
    set.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, sampled exactly rgb(250,248,241) = #FAF8F1, matching spec.
      Chrome: Bold dark title "scatter-color-mapped · javascript · muix · anyplot.ai" centered at top, clearly legible. "Longitude (°E)" / "Latitude (°N)" axis titles and tick labels (with ° suffix formatter) are dark ink on the light background, fully readable. Subtle horizontal gridlines only. Colorbar label "Sea-surface temp (°C)" plus "23.0°C" / "15.4°C" min/max labels sit in the right margin, legible against the light background.
      Data: ~160 circular markers scattered across a longitude/latitude grid (-14° to 12°E, 30° to 52°N), colored along a green-to-blue sequential (imprint_seq) gradient. Markers near (0°E, 40-42°N) skew toward the blue/high-temperature end, consistent with the coded "warm core" spatial pattern; outlying markers skew green/low-temperature. Colors read clearly against the light background.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, sampled exactly rgb(26,26,23) = #1A1A17, matching spec (not pure black, not light).
      Chrome: Title, axis titles, and tick labels flip to light ink and remain fully readable against the dark background — no dark-on-dark failures observed. Gridlines and colorbar labels are likewise legible.
      Data: Same ~160 markers in the same positions with the identical green-to-blue color gradient as the light render (colors unchanged, only chrome flipped, as required). Pixel-sampled marker colors confirm the data palette is unchanged between renders.
      Legibility verdict: PASS, with one caveat — the darkest/most-blue markers (highest temperature, e.g. rgb(44,104,130)) measure only ~2.7-2.8:1 luminance contrast against the #1A1A17 background, below the WCAG 3:1 non-text-contrast guideline; they remain visible but are the least distinguishable element in the dark render.
