review:
  strengths:
  - 'Uses MUI X''s native continuous color pipeline: a zAxis with a continuous colorMap
    built from the Imprint seq stops (#009E73 → #4467A3), paired with the ContinuousColorLegend
    slot bound to the same z axis, so marks and colorbar share one scale'
  - Alpha is baked into both colorMap stops, so the colorbar gradient matches the
    translucent markers exactly instead of drifting from them
  - Degree-suffixed tick formatters on both axes and a 1° grid read like a map graticule
    for the longitude/latitude scenario
  - '160 stations at markerSize 9 keep every point''s color readable with essentially
    no overlap; both colormap ends stay visible on #FAF8F1 and #1A1A17'
  - Chrome is threaded through theme tokens (ink, inkSoft, grid) for title, axis labels,
    ticks, axis lines and colorbar labels, so both renders are legible
  - Deterministic fixed-seed LCG data, skipAnimation set, data block keyed by role
    constants per the adaptable-code zones; tooltips remain available in the HTML
    via the z valueFormatter (°C)
  weaknesses:
  - 'SC-02 (both): the color bar runs 15.4–23 because min/max are rounded with toFixed(1),
    which excludes the observed extremes 15.39 °C and 23.02 °C, and its end labels
    read "23" and "15.4" with inconsistent precision → a range that covers every value
    (floor the min, ceil the max to 0.1 °C, e.g. 15.3–23.1) with matching one-decimal
    labels. Likely cause: Number(Math.min(...).toFixed(1)) / Number(Math.max(...).toFixed(1))
    on lines 53–54.'
  - 'DQ-02 (both): the ''ocean buoy'' grid spans 14°W–12°E × 30–52°N, which is mostly
    land (Iberia, France, Morocco, the Alps), and the ''warm core'' sits on the Spanish
    coast with water cooling toward the Sahara → place the stations over open ocean
    (e.g. a North Atlantic box such as 40–20°W × 25–50°N) so the coordinates match
    the sea-surface scenario. Likely cause: the longitude/latitude ranges on lines
    31–33.'
  - 'CQ-01 (code): a `withAlpha` hex-to-rgba helper function (lines 56–62) adds a
    function to the flat script → drop it and write the stops as 8-digit hex (`${t.seq[0]}E0`,
    `${t.seq[1]}E0`). Likely cause: the helper written for the colorMap alpha.'
  - 'Suggestion: intermediate color-bar labels (e.g. 17, 19, 21 °C) would let readers
    decode mid-range points more precisely than two end values do.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold dark title "scatter-color-mapped · javascript · muix · anyplot.ai" centered at top (~34% of width); x-axis "Longitude (°E)" with ticks -14° … 12° every 1°, y-axis "Latitude (°N)" with ticks 30°–52° every 2°; thin subtle grid on both axes; all text dark ink / ink-soft and fully readable. No clipping at any edge.
      Data: 160 round markers (~18 CSS px diameter) colored on the Imprint seq gradient from brand green #009E73 (cool, 15.4) to blue #4467A3 (warm, 23); bluer points cluster around 0°E 38–42°N, greener toward the left/right edges. Vertical color bar at the right edge, labeled "23" top and "15.4" bottom, rotated title "Sea-surface temperature (°C)". Both colormap ends clearly visible.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title, axis titles, tick labels and color-bar labels flip to light ink / ink-soft and are clearly readable; grid lines subtle light gray; no dark-on-dark text.
      Data: marker positions and gradient colors identical to the light render (same #009E73 → #4467A3 colormap with 0.88 alpha); both ends remain visible against the dark page.
      Legibility verdict: PASS
