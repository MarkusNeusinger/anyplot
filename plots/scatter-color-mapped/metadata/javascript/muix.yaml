review:
  strengths:
  - 'Correct Imprint continuous colormap: imprint_seq (brand green → blue) used for
    the single-polarity temperature magnitude, matching the style guide''s sequential-vs-diverging
    rule.'
  - 'Idiomatic MUI X pattern: zAxis colorMap + ContinuousColorLegend is the library''s
    recommended approach for a color-mapped scatter, with custom min/max °C label
    formatters.'
  - 'Theme-adaptive chrome is correctly threaded through: title/labels use t.ink /
    t.inkSoft, both renders keep identical data colors while only chrome flips.'
  - 'Realistic, neutral data story: an oceanographic buoy network with a simulated
    warm-core current gives the color mapping a plausible spatial pattern rather than
    pure noise.'
  - All font sizes are explicitly set (labelStyle, tickLabelStyle, ChartsText, legend
    labelStyle), and the title fontsize-scaling formula is present even though not
    triggered at this title length.
  weaknesses:
  - Several buoy markers visibly overlap (e.g. clusters near 44°N/-13°E, 33°N/-4°E,
    32°N/9-10°E) and are drawn fully opaque, so overlapping points hide each other.
    Add moderate transparency (e.g. fillOpacity/alpha ~0.85) on the scatter series
    to preserve information at overlaps, as the spec's own notes suggest.
  - Visual design leans on largely default MUI X chart chrome (default grid weight/box-like
    frame from combined vertical+horizontal grid). Consider trimming the grid to something
    subtler or removing the implied top/right frame lines for a more polished, less
    default-library look.
  - The warm-core spatial pattern in the data is present but subtle at a glance —
    the color story doesn't immediately pop. Consider slightly larger markers or a
    tighter color range clamp to make the spatial temperature gradient read faster
    as a focal insight.
  - The temperature model (radial falloff from a single point at 0°E/40°N) is a simplified
    physical stand-in for a real current; it's plausible but not a fully accurate
    SST determinant (real SST is primarily latitude-driven) — minor realism deduction.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "scatter-color-mapped · javascript · muix · anyplot.ai" is bold, dark, centered at top and fully visible. X-axis label "Longitude (°E)" and Y-axis label "Latitude (°N)" are dark and readable with units. Tick labels (degree values) are dark gray, legible. Grid lines (vertical + horizontal) are light gray and subtle. The "Sea-surface temp (°C)" caption and the "23.0°C" / "15.4°C" min/max colorbar labels are smaller, medium-gray, and readable.
      Data: ~160 circular markers scattered across the longitude/latitude grid, colored on a continuous green→blue gradient (imprint_seq) keyed to sea-surface temperature. Markers cluster more toward blue near the mid-latitude band (roughly 30–44°N, -2° to 6°E) and are greener toward the edges, consistent with the "warm core" data story.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now render in light/off-white tones, clearly visible against the dark background. Grid lines are subtle light gray at low opacity. The colorbar caption and min/max labels are light gray and legible.
      Data: Identical marker positions and identical green→blue color gradient as the light render — the data colors did not shift between themes, only the chrome (background, text, grid) flipped as expected.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick text is clearly visible against the dark background, and the brand green end of the gradient remains visible.
