review:
  strengths:
  - 'Native MUI X continuous color pipeline: a zAxis with a continuous colorMap (min/max
    from the data) drives the marker fill, and the ContinuousColorLegend slot (axisDirection
    ''z'', vertical, middle/end) draws the color bar from the same axis, so bar and
    markers cannot drift apart'
  - 'imprint_seq is built from the harness tokens (t.seq[0] #009E73 to t.seq[1] #4467A3)
    with the same ~0.88 alpha on both stops, so the color bar matches the translucent
    markers exactly, and data colors are identical in light and dark'
  - 'Plausible, neutral scenario: 160 ocean buoys in a North Atlantic survey box,
    sea-surface temperature 15.4 to 23.3 °C around a warm-core eddy near 30°W 36°N,
    generated with a fixed-seed LCG'
  - 'Reader-oriented axes: degree-suffixed tick labels (via valueFormatter), descriptive
    axis titles with units, and explicitly sized axis bands (height 68, width 84),
    so nothing is truncated'
  - Chrome is themed through tokens (ink, inkSoft, grid) and readable in both renders;
    skipAnimation and disableHitArea are set for a clean static capture while the
    HTML keeps MUI's tooltips
  weaknesses:
  - 'Suggestion: the color bar shows only its min and max labels (15.4 °C, 23.3 °C);
    one or two intermediate values would make mid-range markers easier to read off.'
  - 'Suggestion: the vertical color-bar title sits about 50 px right of the endpoint
    labels; placing it closer to the bar would tie it to the scale more visibly.'
  - 'Suggestion: the longitudes are all west of Greenwich, so a ''(°W)'' axis with
    positive values may read more naturally to an oceanographer than negative ''°E''
    values.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 (sampled 250,248,241), 3200x1800.
      Chrome: bold dark title "scatter-color-mapped · javascript · muix · anyplot.ai" centered at the top; axis titles "Longitude (°E)" and "Latitude (°N)" in dark ink; degree-suffixed ticks -40° to -20° and 24° to 50° in soft ink; subtle gray grid in both directions; all readable.
      Data: 160 round markers at about 0.88 opacity, colored on imprint_seq from brand green #009E73 (cool, 15.4 °C) to blue #4467A3 (warm, 23.3 °C); bluer points cluster around 30°W 36°N, greener ones toward the edges. On the right is a vertical color bar with endpoint labels 15.4°C and 23.3°C and a rotated title "Sea-surface temperature (°C)".
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 (sampled 26,26,23).
      Chrome: title, axis titles, tick labels, color-bar labels and title all in light ink; grid lines subtle but visible; no dark-on-dark text.
      Data: marker colors and the color-bar gradient are identical to the light render; both ends of the ramp (green and blue) stand out clearly against the dark page.
      Legibility verdict: PASS
