review:
  strengths:
  - Hand-built colorbar plugin (afterDraw) with measureText-based right-padding calculation
    avoids guessed dead space and keeps min/max tick labels + rotated axis title fully
    on-canvas
  - 'Continuous color mapping uses the correct imprint_seq (#009E73 -> #4467A3) tokens,
    min-max normalized, identical between light and dark renders'
  - 'Data is realistic and tells a coherent spatial story: temperature rises to the
    east and falls to the north, visibly readable in the color gradient across the
    scatter'
  - Theme-adaptive chrome (ink / inkSoft / grid tokens) applied consistently to title,
    axis titles, ticks, borders, and the custom colorbar text/border
  - Deterministic LCG-seeded data generation, no imports beyond the Chart.js global,
    animation disabled per harness contract
  weaknesses:
  - Colorbar tick/axis-label font is 14px at the 3200px canvas width; at the 400px
    gallery thumbnail scale this shrinks to near-illegible size — consider bumping
    colorbar font a couple points relative to the main axis fonts
  - Design storytelling is limited to the raw spatial gradient; no annotation or emphasis
    calls out the north-cool/east-warm trend explicitly for a viewer skimming the
    thumbnail
  - Legend is disabled (correct, since a single continuous series doesn't need one),
    but there is no title-adjacent caption reinforcing what the color encodes beyond
    the colorbar label
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "scatter-color-mapped · javascript · chartjs · anyplot.ai" centered at top, clearly legible. Axis titles "Distance East (km)" / "Distance North (km)" in dark ink, tick labels in a softer gray-brown, both fully readable. Grid lines are light and subtle, visible without dominating. Vertical colorbar on the right with "27.3°C" / "15.1°C" tick labels and a rotated "Temperature (°C)" axis label, all fully inside the canvas with comfortable margin (verified via a cropped close-up of the right edge — no clipping).
      Data: ~180 circular markers colored on a continuous green-to-blue gradient (imprint_seq: #009E73 -> #4467A3), consistent with a temperature encoding. Markers cluster warmer (blue) toward low-north/high-east and cooler (green) toward high-north, a visible and plausible spatial trend. Point size (~7.5px radius) and alpha (~0.78) are appropriate for a moderately dense 180-point scatter, no severe overplotting.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis titles render in light/white ink, clearly legible against the dark background. Tick labels use a lighter soft-gray tone, also legible — no dark-on-dark text anywhere. Grid lines are subtly visible. The colorbar's tick labels and rotated axis title also flip to light ink and remain fully on-canvas (confirmed via the same right-edge crop as the light render).
      Data: Same green-to-blue gradient and same point positions/colors as the light render — the data-color mapping is unchanged between themes, only chrome (background, text, grid) flipped, as required.
      Legibility verdict: PASS
