review:
  strengths:
  - Custom colorbar plugin (gradient bar + tick labels) is a thoughtful, idiomatic
    way to express continuous color mapping in Chart.js, which has no built-in colorbar
  - Colors correctly use imprint_seq for the continuous temperature variable, verified
    pixel-identical between light and dark renders — only chrome flips
  - Deterministic LCG-seeded data generation with a realistic, plausible sensor/temperature
    scenario (15-27C range, cooler north / warmer east gradient)
  - Chrome (title, axis titles, ticks, grid) is fully theme-adaptive and legible in
    both renders; animation:false and canvas dimensions (3200x1800) are correct
  - Measures tick-label text width up front to size the right padding — good instinct,
    undermined by an offset arithmetic bug
  weaknesses:
  - 'AR-09: Colorbar axis label ''Temperature (°C)'' is rendered almost entirely outside
    the canvas in both light and dark renders — pixel scan of the rightmost columns
    of plot-light.png finds only ~6 faint anti-aliased pixels at the very last column
    (x=3199 of 3200), meaning the label text is drawn past the canvas edge and lost.
    Root cause: colorbarSpace (used as layout.padding.right) omits the barGap offset
    that is already applied when computing barX from chartArea.right, so the label''s
    x-anchor algebraically resolves to canvasWidth + 6 regardless of tick-label width.
    Fix: colorbarSpace = barGap + axisLabelOffset + rightMargin (and add clearance
    for the label''s own text height) so the full label bounding box sits inside the
    canvas.'
  - After fixing the padding math, re-verify the tick label vertical centering ('27.3°C'/'15.1°C')
    at the bar top/bottom still looks correct once the right-padding value changes
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — PASS
      Chrome: Title, X/Y axis titles, and tick labels all rendered in dark ink, clearly legible. Grid lines subtle light gray. Colorbar tick values "27.3°C" and "15.1°C" are visible and legible.
      Data: 180 scatter points colored on an imprint_seq green-to-blue gradient by temperature, first-series-adjacent brand green visible at the low end as expected; markers have a subtle ink border ring.
      Colorbar axis label: "Temperature (°C)" is NOT visible — pixel scan of the rightmost 30 columns of the 3200px-wide PNG found only 6 non-background anti-aliased pixels, all in the last column (x=3199), around y=787-824. The label is rendered almost entirely outside the saved canvas (AR-09 edge clipping).
      Legibility verdict: FAIL (colorbar axis label clipped off-canvas; all other text passes)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — PASS
      Chrome: Title, axis titles, and tick labels rendered in light ink, clearly legible against the dark background — no dark-on-dark issues. Colorbar tick values "27.3°C"/"15.1°C" visible in light text.
      Data: Marker colors confirmed identical to the light render (verified against source — same rgba values from imprint_seq gradient); only chrome flipped as required.
      Colorbar axis label: Same AR-09 failure as the light render — "Temperature (°C)" clipped off the right edge of the canvas, not visible.
      Legibility verdict: FAIL (colorbar axis label clipped off-canvas; all other text passes)
