review:
  strengths:
  - Correct Imprint continuous colormap (imprint_seq, brand green to blue) built from
    theme tokens, identical across both renders
  - Hand-built colorbar plugin (Chart.js afterDraw hook) provides a clearly labeled
    reference scale with min/max values and a rotated axis title, which Chart.js has
    no native support for
  - 'Theme-adaptive chrome is threaded correctly throughout: title, axis labels, ticks,
    grid, and colorbar all use ANYPLOT_TOKENS, and both plot backgrounds match the
    required off-white/near-black surfaces'
  - 'Meaningful data storytelling: temperature is deterministically modeled as decreasing
    with distance north and increasing with distance east, so the scatter shows a
    real, readable spatial gradient rather than pure noise'
  - Deterministic LCG-seeded data generation, clean single-file KISS structure, no
    unused code
  weaknesses:
  - Noticeable unused whitespace to the right of the colorbar's rotated 'Temperature
    (°C)' label before the canvas edge — tighten layout.padding.right (currently 150)
    or move the colorbar/label closer together to improve canvas utilization
  - 'Design excellence is close to library-default level: grid and spine treatment
    come from Chart.js''s own defaults rather than an intentional customization on
    top of them (e.g. no marker edge stroke, no grid opacity tuning beyond the plain
    t.grid token) — add a deliberate refinement pass to lift it above ''well-configured
    default'''
  - pointRadius=9 for 180 points is workable but a few nearby points touch/overlap
    slightly (e.g. around x=43-45, y=12) — consider pointRadius ~7-8 or alpha ~0.75
    to further reduce overplotting in denser clusters
  - The spatial temperature pattern (cooler north, warmer east) is present but subtle
    under the added noise — slightly reducing noise amplitude or adding a light contour/trend
    cue would make the story more immediately legible
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Title "scatter-color-mapped · javascript · chartjs · anyplot.ai" in dark ink at top-center, comfortably within canvas bounds. X-axis title "Distance East (km)" and Y-axis title "Distance North (km)" both in dark ink, similar size/weight. Tick labels in a softer gray. Subtle light-gray gridlines on both axes. Only left/bottom axis lines are drawn (no full box), matching the L-shaped spine convention. Colorbar to the right of the plot uses the same imprint_seq gradient (green at bottom/14.7°C to blue at top/27.7°C), with dark-ink numeric labels and a rotated "Temperature (°C)" label, all fully visible with no clipping.
      Data: ~180 circular markers scattered across the 0-100 x 0-100 grid, colored on a green-to-blue continuous scale matching the colorbar exactly (first/low end is the brand green #009E73-family, high end is the Imprint blue). A visible spatial pattern emerges: points near the top of the chart (high "Distance North") skew green/cooler, points near the bottom skew blue/warmer, consistent with the underlying data-generation formula.
      Legibility verdict: PASS — all title, axis, tick, and colorbar text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, matching the required dark surface, not pure black.
      Chrome: Title, axis titles, and colorbar numeric labels have flipped to light/off-white ink, fully readable against the dark background. Tick labels use a lighter soft-gray tone appropriate for dark chrome. Gridlines are faint and still visible without competing with the data. The rotated "Temperature (°C)" colorbar label is light-colored and fully visible, not clipped.
      Data: Same ~180 markers in the identical green-to-blue imprint_seq gradient as the light render — colors are pixel-identical between themes, only the chrome (background, text, grid) flipped as required. The same top-cooler/bottom-warmer spatial pattern remains visible.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text and data markers are clearly distinguishable from the near-black background.
