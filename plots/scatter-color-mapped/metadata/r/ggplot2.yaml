review:
  strengths:
  - Continuous color scale uses the exact Imprint sequential stops (low=#009E73, high=#4467A3)
    as specified in the ggplot2 library rules, with a clearly labeled colorbar ("Temperature
    (\u00b0C)")
  - 'Theme-adaptive chrome is correctly threaded: background, ink, and grid tokens
    flip between light and dark while the data gradient stays identical between renders'
  - 'Realistic, neutral synthetic data: temperature decreases with latitude (colder
    toward the north) across a plausible European longitude/latitude bounding box,
    giving the color channel a genuine spatial signal rather than pure noise'
  - Title follows the mandated format with a sensible descriptive prefix, and title
    fontsize is dynamically scaled to the title length
  - Reproducible via set.seed(42), single-file script with no unnecessary abstraction
  weaknesses:
  - library(dplyr) is imported but never used anywhere in the script (no %>%, mutate,
    filter, etc. — data is built with tibble::tibble directly) — remove the unused
    import
  - 'Design excellence is generic: theme_minimal() with token-color overrides but
    no additional visual hierarchy or storytelling device (e.g. no annotation calling
    out the warmest/coldest stations, no subtitle framing the spatial trend)'
  - With 320 points at size=3/alpha=0.8 in a bounded lon/lat box, overlapping clusters
    (e.g. around 40\u00b0N, 45\u00b0N) blend colors together and make individual station
    values harder to read — a slightly smaller size or lower alpha would reduce clutter
    in dense areas
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "Weather Station Temperatures · scatter-color-mapped · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly readable. Axis titles "Longitude (°)" / "Latitude (°)" in dark ink, tick labels in a softer gray-brown, all legible against the light surface. Grid lines are faint horizontal/vertical off-white-adjacent lines, subtle but visible. Colorbar legend on the right titled "Temperature (°C)" with ticks at 15/20/25, legible dark text.
      Data: ~320 circular points scattered across a longitude range of roughly -9° to 9° and latitude 36°-54°, colored on a continuous gradient from teal-green (#009E73, cooler-latitude/warmer temps... actually low end of scale) through teal to blue (#4467A3) representing temperature. First-series green anchors the low end of the gradient as required. Points in the south (lower latitude) skew green/teal (warmer), points in the north (higher latitude) skew blue... (visually the gradient runs green→blue with green points concentrated at high latitude/cooler temps per the data-generation formula, consistent with the colorbar legend). Points are alpha-blended (0.8) so overlaps darken/blend, which is visible but not illegible.
      Legibility verdict: PASS — no light-on-light text, all chrome elements readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title in light/off-white ink, clearly readable against the dark surface. Axis titles in light ink, tick labels in a lighter soft gray, all legible. Grid lines are faint light-gray lines on the dark background, subtle but visible. Colorbar legend on the right with the same "Temperature (°C)" label and 15/20/25 ticks, legible light text — no dark-on-dark failures observed anywhere (title, axis labels, tick labels, legend text all use light ink correctly).
      Data: Same ~320 points in the same positions with the identical teal-green-to-blue gradient as the light render — confirmed the data colors are unchanged between themes; only the chrome (background/ink/grid) flipped.
      Legibility verdict: PASS — no dark-on-dark text, all chrome elements readable, brand green end of the gradient still reads clearly against the near-black background.
