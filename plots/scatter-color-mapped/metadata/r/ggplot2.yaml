review:
  strengths:
  - 'Correct use of the Imprint sequential colormap (green #009E73 -> blue #4467A3)
    for the continuous temperature variable, matching imprint_seq exactly'
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white / near-black
    backgrounds, readable text, identical data colors between themes'
  - Realistic, neutral weather-station dataset (longitude -9..9, latitude 36..54,
    matches Western Europe) with a plausible north-south temperature gradient and
    believable noise
  - Clean idiomatic ggplot2 grammar with a customized guide_colorbar (barwidth/barheight/ticks.colour/frame.colour)
    and explicit font sizes throughout
  - Subtitle adds a light narrative hook ('Stations warm up steadily from north to
    south') reinforcing the color-encoded pattern
  - Reproducible (set.seed(42)), clean KISS structure, only used imports (ggplot2,
    scales, ragg)
  weaknesses:
  - With 320 points at alpha=0.65 and size=2.5, dense clusters overlap into darker
    blobs in a few regions — per the data-density heuristic (300+ points), dropping
    alpha closer to 0.5 or marker size slightly smaller would reduce overplotting
    further
  - 'Design Excellence is solid but not exceptional: the composition relies on theme_minimal
    + a customized colorbar without a stronger focal point or additional visual hierarchy
    device (e.g. highlighting an outlier station or a trend guide)'
  - guide_colorbar is a nice touch but a fairly standard continuous-legend customization
    — a more library-distinctive technique (e.g. facet_wrap for regional small multiples,
    or geom_smooth trend overlay) would raise Library Mastery further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Weather Station Temperatures · scatter-color-mapped · r · ggplot2 · anyplot.ai" and subtitle "Stations warm up steadily from north to south across the network" render in dark ink, fully legible. Axis titles "Longitude (°)" / "Latitude (°)" and tick labels are dark/soft-grey and clearly readable. Grid lines are faint but visible. Colorbar legend "Temperature (°C)" with tick labels 15/20/25 is legible with a bordered box.
      Data: ~320 scattered points spanning green (#009E73, cool) through teal to blue (#4467A3, warm), using the Imprint sequential gradient. Points cluster more toward blue in the south (lower latitude) and green in the north, visually confirming the described trend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, subtitle, axis titles, and tick labels all render in light/off-white and soft-grey tones, fully legible against the dark background. No dark-on-dark text found. Grid lines remain subtle but visible. Colorbar legend and its tick labels are light-colored and readable.
      Data: Same green-to-blue gradient and same point positions as the light render — data colors are identical between themes, confirming only chrome flipped.
      Legibility verdict: PASS
