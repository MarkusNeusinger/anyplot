review:
  strengths:
  - No native Highcharts series type supports floating time-ranged bars, so the implementation
    correctly identifies this and builds the piano roll from chart.renderer.rect()
    calls positioned via xAxis.toPixels()/yAxis.toPixels() against an invisible anchor
    scatter series — a legitimate, well-documented Highcharts technique rather than
    a workaround or a NOT_FEASIBLE cop-out.
  - Black/white key row shading (BLACK_KEY_CLASSES-driven plotBands) faithfully mirrors
    real piano keyboard layout, including the two-consecutive-white-key exceptions
    at E/F and B/C.
  - 'Three-tier grid hierarchy: subtle per-beat gridlines, medium-weight lines at
    every measure boundary, and heavier lines every two measures — reads clearly without
    competing with the note data.'
  - Compact inline velocity legend (gradient bar + soft/loud labels) is placed inside
    the plot area without overlapping any notes in either theme.
  - 'Data is musically coherent: a sustained low-register chord pad (C major / G major
    / A minor / F major) plus a scale-wise melody with a sine-shaped velocity curve,
    spanning ~3 octaves and multiple note durations (0.5, 1, 2, 8 beats).'
  - Theme-adaptive chrome is correctly threaded through title, axis titles, tick labels,
    legend text, and stroke colors; both renders are fully legible with matching data
    colors.
  weaknesses:
  - Velocity is a single-polarity intensity measure (soft→loud, no meaningful zero/midpoint),
    which per the style guide should map to imprint_seq. The implementation instead
    uses imprint_div (t.div) to achieve the spec's explicit blue-soft/red-loud convention
    — a reasonable domain-convention call, but it is technically a wrong-polarity
    use of the diverging colormap. If revisited, consider building a two-stop imprint_seq-derived
    blue→red scale (or documenting why div's neutral midpoint is intentionally meaningless
    here) to fully satisfy VQ-07.
  - Velocity legend text is set at 12px, slightly under the ~14px baseline the highcharts
    prompt recommends for legend/tick labels — legible but could be bumped for consistency.
  - Chord-pad notes within a single chord all share one flat velocity (48), so the
    'loud' end of the color scale is only exercised by the melody — full-range velocity
    variation isn't shown within the sustained-chord layer.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white.
      Chrome: Bold dark title "piano-roll-midi · javascript · highcharts · anyplot.ai" centered at top, clearly readable. "Beat" (x-axis) and "Pitch" (y-axis) titles in medium-gray secondary ink, clearly readable. Y-axis tick labels show note names (F5 down to E2) for white keys only; x-axis tick labels show beat numbers at every measure (0, 4, 8, ... 32). All text renders crisp and dark-on-light — fully legible.
      Data: Notes drawn as colored horizontal bars — soft notes (low velocity) render pale/light blue, medium notes pale pink, loud notes deep red, following the diverging blue→red velocity scale. Sustained chord-pad notes appear as long blue/lavender-tinted bars in the low register (G2-G3 area); a melodic line arcs through the mid-upper register (C4-E5) with color intensifying toward louder peaks. Faint alternating gray bands mark piano black-key rows. Vertical lines mark beat divisions (subtle) with stronger dark lines at each measure boundary. A compact gradient legend ("Velocity: soft" → "loud") sits in the top-right corner of the plot area, not overlapping any notes.
      Legibility verdict: PASS — all text and data are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black.
      Chrome: Title, axis titles, and tick labels all render in light/off-white text, clearly legible against the dark background — no dark-on-dark failures observed. Grid lines and measure markers remain subtly visible without dominating.
      Data: Same note layout and colors as the light render — soft notes navy/dark-blue, loud notes deep red — confirming the data palette is identical across themes; only the chrome (background, text, grid) has flipped. The gradient legend text is light-colored and reads clearly here too.
      Legibility verdict: PASS — all text and data elements are clearly readable against the dark background; no dark-on-dark or light-on-light issues found.
