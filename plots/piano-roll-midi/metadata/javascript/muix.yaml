review:
  strengths:
  - Composed ChartsContainer with a custom SVG overlay drawn through useXScale/useYScale/useDrawingArea,
    so notes, keyboard rows and beat lines share the axes' exact scales
  - Velocity mapped onto imprint_seq with a compact gradient legend in the title row
    whose ends read Soft (58) and Loud (109)
  - Piano-keyboard row shading at low opacity and measure lines weighted above beat
    lines, all drawn behind the notes and readable in both themes
  - Realistic C-Am-F-G progression with sustained bass, chord pads, eighth-note melody
    and a crescendo, so chords, short notes, repeats and rests all appear
  - Axis valueFormatter turns beats into M1-M8 measure labels and pitches into note
    names; pitch range auto-fits with a small margin
  weaknesses:
  - 'SC-02 (both): the pitch axis labels only the three C rows (C3, C4, C5), so the
    other 30 rows, including every melody note, cannot be named → a note name on every
    white-key row (or every row), as the Notes'' ''C4, D4, etc.'' asks. Likely cause:
    yAxis tickInterval: octaveTicks (only semitone === 0 pushed).'
  - 'VQ-06 (both): the y-axis title reads ''Pitch (MIDI note)'' but the ticks show
    note names and no MIDI number appears → a title that matches the ticks, e.g. ''Pitch
    (note)'', or ticks like ''C4 (60)''. Likely cause: label: PITCH with the column
    constant ''Pitch (MIDI note)''.'
  - 'CQ-04 (code): lines 178-185 parse the two seq hex colors by hand with bit shifts
    → hexToRgb/decomposeColor from @mui/material/styles give the channels in one call
    each. Likely cause: hand-rolled hex parsing.'
  - 'Suggestion: label the closing barline (beat 32) so the last measure''s extent
    reads at a glance.'
