review:
  strengths:
  - Composes the piano roll from ChartsContainer with the useXScale / useYScale /
    useDrawingArea hooks, so every note, row shade and beat line sits on MUI X's own
    linear scales and the native ChartsXAxis / ChartsYAxis draw the ticks
  - Notes sit exactly at their onset and duration in beats on a continuous x scale,
    with pitch rows centred on integer MIDI numbers; nothing is snapped or stretched
    to the grid
  - Pitch axis is fitted to the data (F#2 to G#5, 3 semitones of margin) and labels
    the white keys with note names via tickInterval + valueFormatter, as a DAW keyboard
    does
  - Black-key rows are shaded with the ink token at 5 % opacity, so the keyboard pattern
    reads in both themes and stays behind the notes
  - Beat lines in the grid token with stronger ink measure lines, drawn before the
    notes, and measure ticks labelled M1–M8 instead of raw beat numbers
  - Velocity maps onto the Imprint sequential ramp (t.seq) with a Soft (58) → Loud
    (109) gradient bar beside the title that names both ends
  - Realistic I–vi–IV–V progression in C with a sustained bass, block chords, a moving
    melody and a velocity crescendo across the eight measures
  weaknesses:
  - 'VQ-05 (both): the black-key rows at the range edges (G#5 at the top, F#2 at the
    bottom) are drawn as full rows centred on the axis limits, so half of each shade
    band sticks out past the plot area, above the top of the y axis and below the
    x-axis line (about 12 px each) → clip the shading to the drawing area so no band
    extends past the axes. Likely cause: the row <rect> uses yScale(p + 0.5) / yScale(p
    - 0.5) for p at pitchAxisMin/Max without clamping to drawingArea.top / drawingArea.top
    + drawingArea.height.'
  - 'VQ-01 (both): the pitch tick labels are 13 px, smaller than the 14 px x-axis
    ticks and below the library''s 14–16 px axis guidance, and they are the smallest
    text in the 400 px thumbnail → 14 px (+1 px) to match the x ticks. Likely cause:
    yAxis tickLabelStyle fontSize: 13.'
  - 'Suggestion: the header block could carry the library prompt''s License line ("@mui/x-charts
    — MIT (community)").'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1; black-key pitch rows shaded a slightly darker cream band, alternating in keyboard pattern.
      Chrome: title "piano-roll-midi · javascript · muix · anyplot.ai" bold dark ink top-left; velocity gradient bar top-right labelled "Velocity: Soft (58)" … "Loud (109)"; y axis "Pitch (note)" with white-key names G2…G5; x axis "Time (measures)" with ticks M1–M8. Thin beat lines and stronger grey measure lines. All text dark on light, readable. The edge black-key bands (G#5, F#2) poke about half a row past the top of the y axis and below the x-axis line.
      Data: 96 rounded note bars from #009E73 green (soft) through teal to blue (loud): sustained bass notes (C3, A2, F3, G3), half-note block chords, short melody notes in the C5–F5 range; the colour drifts green→blue across the crescendo.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; black-key rows a slightly lighter band, still distinguishable.
      Chrome: title, legend labels, axis titles and tick labels all in light ink; beat and measure lines visible in light grey; no dark-on-dark text.
      Data: note colours identical to the light render (same green→teal→blue ramp); every note stands out from both row shades.
      Legibility verdict: PASS
