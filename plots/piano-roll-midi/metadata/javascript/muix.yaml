review:
  strengths:
  - Custom piano-roll rendering built correctly on MUI X's compose API (ChartContainer
    + useXScale/useYScale/useZColorScale/useDrawingArea) — the right approach since
    no built-in MUI X chart type covers a piano roll, and it stays entirely within
    the community @mui/x-charts surface
  - Alternating black/white key row shading and beat/measure grid lines (with stronger
    measure-boundary lines) both faithfully implement the spec's piano-roll conventions
  - 'Velocity color-coded with the correct imprint_seq continuous gradient (#009E73
    -> #4467A3), identical between light and dark renders, with a clean ContinuousColorLegend
    (Soft/Loud) placed near the plot'
  - Deterministic, musically coherent example data (I-vi-IV-V progression with bass/comping/melody
    layers) that builds a visible crescendo in velocity across the 8 measures, giving
    the plot a real visual storyline without relying on annotations
  - Pitch axis auto-fits to the data range with a small margin and note-name tick
    labels (C3/C4/C5), rather than showing the full 0-127 MIDI range
  - All font sizes explicitly set (title 22px, tick labels 14px, axis labels 15px,
    legend 14px) and legible in both themes, including at the ~400px mobile-scaled
    preview
  weaknesses:
  - ChartContainer does not set skipAnimation — the muix library rules require it
    as a mandatory 'belt' alongside the harness's prefers-reduced-motion emulation;
    current renders happen to land on the final frame, but add skipAnimation to ChartContainer
    for robustness.
  - Visual refinement is good but still fairly close to MUI X axis defaults (visible
    axis lines/ticks) rather than a fully custom, spines-removed treatment — a touch
    more chrome reduction (e.g. thinner/lighter axis lines) would push Design Excellence
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white and not dark.
      Chrome: Title "piano-roll-midi · javascript · muix · anyplot.ai" in dark bold text top-left, "Pitch" y-axis label and "Time (measures)" x-axis label in dark gray, C3/C4/C5 tick labels on the y-axis, M1-M8 tick labels on the x-axis, a green->blue "Soft"/"Loud" continuous legend bar top-right. All chrome text is clearly dark-on-light and fully readable.
      Data: Horizontal rounded rectangles (notes) positioned by pitch (y) and time (x), width encoding duration. Fill color runs from brand green (#009E73, soft/low velocity) to blue (#4467A3, loud/high velocity) via the imprint_seq gradient — first/softest notes are green, loudest notes near measures 7-8 are blue. Subtle gray bands alternate behind the notes to mark piano black-key rows; vertical grid lines mark beats, with a stronger line at each measure boundary.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black and not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light gray/white text on the dark background. Legend and its "Soft"/"Loud" labels are light-colored and clearly visible. Grid lines and measure lines are subtle but visible against the dark background.
      Data: Note colors are pixel-identical to the light render (green #009E73 -> blue #4467A3 gradient) — only the chrome (background, text, grid) flipped as expected. No dark-on-dark or light-on-light failures anywhere; every text element is legible against its background.
      Legibility verdict: PASS
