review:
  strengths:
  - geom_path() keeps the true temporal order (not sorted by x like geom_line), so
    the loops of the Phillips curve read correctly
  - A single continuous color aesthetic on both the path and the points carries the
    Imprint sequential green-to-blue gradient through time, and its light end shows
    on both pages
  - Year labels on the start, the end and each decade sit clear of the path, the markers
    and each other in both renders
  - Historical-looking Phillips-curve data with the 1980s disinflation and the 2009
    recession excursion shows loops and reversals that the plot type is built for
  - 'Fully theme-adaptive chrome: title, ticks, labels and legend box flip correctly
    between #FAF8F1 and #1A1A17'
  weaknesses:
  - 'VQ-03 (both): the start arrow''s head (0.18 cm) is drawn underneath the 1981
    marker, so only a sliver of it shows and the direction cue nearly disappears →
    keep the head visible beside the marker, e.g. draw the segment above geom_point
    or end it short of the 1981 point. Likely cause: geom_segment ends at exactly
    (7.6, 10.3) and is layered before geom_point(size = 3.5).'
  - 'VQ-07 (both): the major grid is drawn in opaque INK_MUTED (#6B6A63 / #A8A79F)
    and reads as a medium-gray lattice, heavier than the style guide''s grid token
    → rgba ink at 15 % (#1A1A17 / #F0EFE8 at alpha 0.15). Likely cause: panel.grid.major
    = element_line(color = INK_MUTED).'
  - 'Suggestion: a short muted note or larger weight on the 2009 excursion could give
    the chart a focal point beyond the decade labels.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold title "Phillips Curve Dynamics · scatter-connected-temporal · r · ggplot2 · anyplot.ai" in near-black ink across ~76% of the width; axis titles "Unemployment Rate" / "Inflation Rate" in dark ink; % tick labels (4%-10%, 0%-15%) in INK_SOFT; L-shaped axis lines; medium-gray major grid on both axes; bottom "Year" colorbar on an elevated #FFFDF6 box with 1980, 1990, 2000, 2010, 2019 breaks. All text readable.
      Data: 40 markers joined by a straight path, colored from brand green #009E73 (1980, top right at 13.5%) to blue #4467A3 (2019, left at 3.5%). Green arrow from 1980 toward 1981, its head mostly hidden under the 1981 marker. Bold year labels 1980, 1990, 2000, 2010, 2019; 2019 sits below-left of its marker, clear of 2000 and of the path.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles and year labels in light ink #F0EFE8; ticks in #B8B7B0; light-gray grid; colorbar box #242420 with light text. No dark-on-dark text.
      Data: path, markers, arrow and gradient identical to the light render (#009E73 -> #4467A3); the green start reads well on the dark page.
      Legibility verdict: PASS
