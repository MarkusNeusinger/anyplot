review:
  strengths:
  - Every month is a marker at its exact (volume, price) value, joined in time order
    by straight LineCollection segments carrying the imprint_seq gradient
  - sns.scatterplot with continuous hue, hue_norm and the imprint_seq palette keeps
    marker colors in lockstep with the path gradient and the colorbar
  - Colorbar ticks relabelled as 'Mon YYYY' so the legend speaks the same language
    as the in-plot labels
  - Key-point labels pick the story's turning points (start, Aug 2023 volume spike,
    Dec 2023, Aug 2024 peak, end) and sit beside their points with curved leaders
  - Theme tokens threaded through every chrome element; both renders read cleanly
  weaknesses:
  - 'VQ-02 (both): the final ''3'' of the ''Dec 2023'' label touches the May→Jun 2024
    path segment that passes just below-right of it → clear the segment by a few pixels
    (e.g. offset (-40, 16) or place the label left of the point). Likely cause: key_points
    offset (-34, 14) for index 11.'
  - 'Suggestion: the faint KDE contours are not asked for by the spec and run off
    the axes as open curves at the top and right; dropping them would quiet the background.'
  - 'Suggestion: segments could be built as np.stack([points[:-1], points[1:]], axis=1)
    instead of the list comprehension.'
