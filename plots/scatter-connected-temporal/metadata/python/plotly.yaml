review:
  strengths:
  - 'imprint_seq gradient (#009E73 -> #4467A3) applied to both segments and markers,
    with a Year colorbar, makes the direction of time readable at a glance; the light
    end stays visible on both backgrounds'
  - Realistic US Phillips-curve data 1990-2023 with the 2009 recession loop and the
    2022 inflation spike, giving the path a real story
  - 'Year labels on ELEVATED_BG boxes with leader lines and full theme-token coverage:
    every text element is readable in light and dark'
  - customdata hovertemplate gives per-year unemployment/inflation tooltips in the
    interactive HTML
  weaknesses:
  - 'VQ-02, VQ-03 (both): the ''1999'' label box overlaps the lower half of the 2023
    marker at (3.6, 4.1), and the two grey arrowheads (about 60 px wide) sit on top
    of the 2003 marker at (6.0, 2.3) and the 2020 marker at (8.1, 1.2) → year boxes
    and arrowheads clear of every marker by at least a few px. Likely cause: key_points
    offset (-50, -40) for 1999, and arrowsize=2 / arrowwidth=2.5 on arrows that end
    exactly on a marker.'
  - 'SC-02 (both): the direction arrows run as straight chords from 2000 to 2003 and
    from 2017 to 2020, cutting across three segments each, so they read as extra path
    segments rather than arrows along the path (C2) → arrows that follow single segments
    of the path. Likely cause: the (start_idx, end_idx) pairs (10, 13) and (27, 30)
    in the arrow loop.'
  - 'Suggestion: the ''2000s'' and ''2010s'' decade labels sit beside points of other
    decades (the 2000s label is next to the 2015-2016 segment); placing each next
    to its own decade''s stretch would make the regime labels more precise.'
  - 'Suggestion: the band between the title and the plot top is mostly empty; a slightly
    smaller top margin would give the data more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: centered title 'scatter-connected-temporal · python · plotly · anyplot.ai' (~50% width), axis titles 'Unemployment Rate (%)' and 'Inflation Rate (%)', INK_SOFT tick labels, dotted subtle grid, 'Year' colorbar 1990-2023 on the right; all readable.
      Data: 34 markers (size 14, page-colored rim) joined chronologically by alpha-0.6 segments, gradient from brand green #009E73 (1990) to blue #4467A3 (2023). Bold year labels 1990, 1999, 2009, 2020, 2022, 2023 in boxes with leader lines; italic muted decade labels 1990s/2000s/2010s/2020s; two large grey chord arrows (2000->2003, 2017->2020). The 2000s label now sits at x=6.4 clear of the 2020 box. The 1999 box overlaps the lower half of the 2023 marker; arrowheads cover the 2003 and 2020 markers.
      Legibility verdict: PASS

