review:
  strengths:
  - geom_path keeps time order instead of geom_line's x-sorting, so the Phillips loop
    is drawn correctly
  - imprint_seq green→blue gradient on path and markers encodes time, identical in
    both themes
  - Page-colored marker outlines keep every marker distinct where segments cross
  - Real, neutral US unemployment/inflation data 1990–2020 with a clear regime break
    in 2009
  weaknesses:
  - 'VQ-01 (both): the year labels 1990/2000/2010/2020 and the ''2009 Recession''
    label render at about 3.5 pt, unreadable in the 400 px thumbnail → about 9 pt
    bold (+5.5 pt), between tick and axis-title size. Likely cause: geom_text/annotate
    size=3.5 treated as mm while plotnine renders it as points.'
  - 'VQ-02 (both): the last letter of ''2009 Recession'' touches the 2008→2009 path
    segment → label clear of the segment by a few px. Likely cause: annotate offset
    (−0.9, +0.75) from the 2009 point.'
  - 'VQ-03 (both): the four direction arrowheads end at the next marker''s centre
    and are hidden under it, leaving only fragments → arrowheads visible in full beside
    the marker. Likely cause: geom_segment xend/yend equal to the next point.'
  - 'SC-02 (both): the ''2020'' label sits about equally far from the 2011 marker
    (8.1, 2.1) and the 2020 marker (8.1, 1.2), so the end of the path is ambiguous
    (C3) → place it unambiguously next to the 2020 marker. Likely cause: label_config
    offset (0.42, 0.55) for 2020.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title in the mandated format (~70% width), axis titles 'Unemployment Rate (%)' / 'Inflation Rate (%)', soft-ink ticks, subtle grid, no spines, framed Year colorbar 1990–2020. Axis and legend text readable; the year labels 1990/2000/2010/2020 and the '2009 Recession' label are only ~3.5 pt and barely readable at full size, illegible in the thumbnail.
      Data: 31 markers joined in time order with a #009E73→#4467A3 gradient, page-colored marker outlines, small arrowhead fragments next to four markers, red ring around the 2009 point (9.3, −0.4).
      Legibility verdict: FAIL for the annotation labels (too small), PASS for all other chrome

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, axis titles and ticks in light ink, legend on #242420 with light text; no dark-on-dark. Year and recession labels equally tiny.
      Data: gradient, markers and red ring identical to the light render; only chrome flips.
      Legibility verdict: FAIL for the annotation labels (too small), PASS for all other chrome
