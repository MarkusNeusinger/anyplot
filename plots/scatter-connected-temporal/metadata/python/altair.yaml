review:
  strengths:
  - order:Q encoding drives the path in chronological order with straight segments,
    so loops and crossings read as time, not as an x-sorted line
  - 'imprint_seq gradient (#009E73 -> #4467A3) on the markers encodes time direction,
    with an identical gradient in both renders'
  - Theme tokens thread through axis, legend, title and mark_text colors; both renders
    pass the legibility check
  - Formatted Vega-Lite tooltips (year, unemployment, inflation) and .interactive()
    pan/zoom add inspection in the HTML output
  weaknesses:
  - 'VQ-02 (both): the "2015" label is drawn over the path segments between about
    (3.3, 0.4) and (3.8, 0.3) → place it clear of the path and markers. Likely cause:
    nudge 2015 (0.30, -0.38) combined with mark_text dy=-15.'
  - 'SC-02 (both): the "2010" label floats about 0.65 inflation points above its marker
    at (6.9, 1.8), directly under the 1990s markers at (6.8, 2.8) and (6.3, 2.6),
    so it reads as labelling a 1990s point (C2, C3) → put it within about 0.2 units
    of its own marker. Likely cause: nudge 2010 (-0.22, +0.35) stacked with dy=-15.'
  - 'VQ-05 (both): the y domain runs to 6.2 while inflation peaks at 3.9 and the x
    domain to 8.5 while unemployment peaks at 7.8, leaving about 30 % of the plot
    height and a right strip empty → about [-0.8, 4.4] and [2.5, 8.1]. Likely cause:
    the hard-coded x_scale / y_scale domains.'
  - 'DQ-03 (both): np.clip floors unemployment at 3.0, so 7 of the 2011–2023 years
    sit at exactly 3.0 % on one vertical line, which no real labour market shows →
    generate a path that stays inside a plausible 3.5–10 % range without pinning to
    the floor. Likely cause: the random walk with negative drift plus np.clip(…, 3.0,
    10.5).'
  - 'Suggestion: a small arrowhead at the 2023 end would make direction readable inside
    the dense late cluster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, legend box on #FFFDF6 with an INK_SOFT stroke
