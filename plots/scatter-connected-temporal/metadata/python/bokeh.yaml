review:
  strengths:
  - Real US unemployment vs CPI inflation 1990–2023, values match published annual
    figures; the path shows the 2009 jump, the flat 2010s and the 2020→2022 excursion
  - 'Time encoded three ways: imprint_seq colour ramp (LinearColorMapper + transform)
    with a Year ColorBar, plus segment width and alpha growing with time'
  - Start and end labelled with direction glyphs ('1990 ▸', '◂ 2023') so the direction
    of time reads without the colour bar
  - 'Idiomatic Bokeh: ColumnDataSource throughout, vectorised multi_line with per-segment
    colour/width/alpha columns, ColorBar via add_layout'
  - 'Both themes correct: #FAF8F1 / #1A1A17 surfaces, INK/INK_SOFT chrome, identical
    data colours'
  weaknesses:
  - 'VQ-02, SC-02 (both): path segments cross three year labels — ''2015'' sits on
    the 2015→2016 segment, ''2020'' on the 2008→2009 segment, and the 1999→2000 segment
    cuts through the ''1'' of ''1999'' → each label clear of every segment by at least
    ~8 px (C3). Likely cause: the fixed x_offset/y_offset pairs in the annotations
    dict (e.g. 2015 at (15, 12), 2020 at (15, −18), 1999 at (−20, 18)) were not chosen
    against the outgoing segment directions; place 2015 below-left, 2020 below-right
    further down, 1999 above-left.'
  - 'VQ-03 (dark): the 1990–1993 segments (2 px, alpha 0.45, #009E73 end of the ramp)
    almost disappear on #1A1A17, so the start of the path is hard to follow → raise
    the minimum to about 3 px / alpha 0.65 (+1 px, +0.2). Likely cause: line_widths
    = 2.0 + … and line_alphas = 0.45 + … floors.'
  - 'Suggestion: a HoverTool on the scatter (year, unemployment, inflation) would
    make the unlabelled years inspectable in the HTML artifact.'
  - 'Suggestion: small arrowheads (bokeh.models.Arrow with VeeHead) on a few long
    segments would reinforce direction where the gradient is subtle.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and border; no pure white.
      Chrome: title 'US Phillips Curve Dynamics (1990–2023) · scatter-connected-temporal · python · bokeh · anyplot.ai' in bold dark ink, ~68% of the width; axis titles 'Unemployment Rate (%)' / 'Inflation Rate (%)' and tick labels in dark ink-soft, all readable; subtle grid; vertical Year colour bar 1990–2020 on the right with readable labels; bold year labels 1990 ▸, 1999, 2009, 2015, 2020, 2022, ◂ 2023.
      Data: 34 markers (size 20, dark outline) coloured by year from #009E73 (1990) to #4467A3 (2023), joined chronologically by straight segments that get wider and more opaque over time; the 2015, 2020 and 1999 labels are crossed by path segments.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
