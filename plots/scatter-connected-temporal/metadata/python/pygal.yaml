review:
  strengths:
  - 'The path is split into five consecutive eras, each coloured by a discrete step
    of imprint_seq (#009E73 to #4467A3). Each era runs into the first point of the
    next, so the line stays unbroken and the green-to-blue gradient shows the direction
    of time in both themes.'
  - The start (1980) and end (2023) points get enlarged 22 px markers in the first
    and last era colours. Together with the '(start)'/'(end)' text, they make the
    reading direction obvious at a glance.
  - Six evenly spaced time labels are placed off the path by a clearance search over
    the sampled segments. Every label sits clear of markers, segments and the other
    labels, and the marks themselves stay at their data values.
  - 'Native pygal idioms: an XY chart with a fully themed Style object, x_value_formatter/value_formatter
    for the % and decimal ticks, print_labels with per-point label dicts, legend_at_bottom_columns,
    and an inline css rule to centre the label text. The HTML output keeps pygal''s
    hover tooltips.'
  - 'Theme tokens are threaded through every chrome element; the data colours are
    identical in both renders and all text is readable on #FAF8F1 and #1A1A17.'
  - Plausible demographic scenario (fertility falling from 5.5 to 2.9 while urbanisation
    rises from 29% to 63%) with a seeded 2000–2003 migration stall and a 2015–2017
    pronatalist rebound that make the path double back.
  weaknesses:
  - 'DQ-01 (both): the path is an almost monotone diagonal from upper left to lower
    right; only the short 2000–2003 kink and the small 2015–2017 rebound show the
    doubling back and regime changes this plot type exists to reveal (Description:
    cyclical patterns, regime changes) → make the seeded stall and rebound move further,
    for example a multi-year rebound that turns the path back on itself in x or y,
    so at least one clear turn or loop reads in the render. Likely cause: urban_step[20:24]
    and fertility_step[35:38] perturbations are too small relative to the steady trend.'
  - 'Suggestion: add a few pixels of space between each legend swatch and its era
    text; at the moment the labels sit directly against the squares.'
  - 'Suggestion: the empty band below 2.8 on the y-axis (range starts at 2.5) could
    be trimmed so the path fills more of the plot area.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "Fertility vs Urbanization · scatter-connected-temporal · python · pygal · anyplot.ai" centred at top (~65% width), dark ink; y-axis title "Fertility rate (births per woman)" rotated, x-axis title "Urban population (% of total)", ticks 2.8–6.0 and 30%–60% in dark ink; subtle grid lines; legend at bottom with five era swatches (1980–1988 … 2016–2023). All readable.
      Data: 44 connected markers running from upper left (29%, 5.54) to lower right (63%, 2.87), coloured in five steps from brand green #009E73 to blue #4467A3; a kink around 46% / 4.1–3.9 (2000–2003 stall) and a small rebound near 57% / 3.25 (2015–2017); enlarged start and end markers; time labels 1980 (start), 1989, 1997, 2006, 2014, 2023 (end) clear of the path.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
