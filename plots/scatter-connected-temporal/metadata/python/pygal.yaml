review:
  strengths:
  - 'Temporal direction is readable at a glance: an imprint_seq gradient from #009E73
    to #4467A3 across five eras, bracketed by an oversized red start (▶ 1980) and
    blue end (2023) marker'
  - Year labels are threaded to the INK token through an inline SVG style, so they
    read light-on-dark in the dark render and dark-on-light in the light render
  - Three-tier marker hierarchy (12 px path markers, 20 px key years, 26 px start/end)
    with a 5 px round-capped path keeps every observation visible
  - Plausible demographic-transition data (fertility 5.5→2.8, urbanization 29→63 %)
    with a migration stall that makes the path double back and a pronatalist rebound
    that reverses it
  - 'Idiomatic pygal: XY chart with per-point value/label/color dicts, per-series
    stroke_style overrides and native hover tooltips in the HTML output'
  weaknesses:
  - 'VQ-02, SC-02 (both): the ''1990'' year label is printed on the path, covering
    the 1991 and 1992 markers and the segment between them at about 41–42 % / 4.65;
    the ''2020'' label covers the 2021 marker at about 61 % / 3.0, and ''2010'' and
    the ''▶'' glyph touch the path → every year label clear of the path and the markers
    by at least 10 px (C3). Likely cause: pygal print_labels draws each label at a
    fixed down-right offset from its point, which is the direction this path runs;
    shorten the label offset side or attach the labels to points where the path turns
    away.'
  - 'SC-03 (both): the ''● 2023'' end label draws a solid ink-colored dot at about
    63.8 % / 2.77, below and right of the real 2023 marker at 63 % / 2.87, so the
    plot shows an extra observation where there is none → drop the ''●'' glyph from
    the label text (label ''2023''). Likely cause: label string ''● 2023'' on the
    End series.'
  - 'VQ-01, VQ-05 (both): the y tick ''5.6'' renders about 1.3× larger than the other
    y tick labels and gets its own lighter guide → all y ticks at one size. Likely
    cause: y_labels_major_count=8 promotes 5.6 to a major label, drawn at a different
    size from the minor ticks (label_font_size=56 vs major_label_font_size=44); set
    y_labels_major_count to cover every tick or make the two sizes equal.'
  - 'CQ-01 (code): _patch_label_colors (lines 170–178) wraps a single re.sub in a
    function with a nested closure, used once → inline the substitution at the call
    site. Likely cause: helper-function structure.'
  - 'Suggestion: placing key-year labels at the 2000–2003 stall and the 2015–2017
    rebound instead of round decades would tie the labels to the turns the path shows.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across canvas and plot area.
      Chrome: Title "Fertility vs Urbanization · scatter-connected-temporal · python · pygal · anyplot.ai" in dark ink, ~68 % of width. Axis titles "Urban Population (% of total)" and "Fertility Rate (births per woman)" dark and readable; x ticks 30 %–60 %, y ticks 2.8–6.0 (the 5.6 tick is drawn larger than the rest). Dashed muted guides. Bottom legend in 3 columns, 8 entries, all readable.
      Data: 44 annual points 1980–2023 joined by a 5 px path running from upper-left (29 %, 5.53) to lower-right (63 %, 2.87), colored in five eras from #009E73 to #4467A3. Hairpin around 45 % / 3.9–4.1 (2000–2003 stall) and a bump to 3.25 near 57 % (2015–2017 rebound). Amber #DDCC77 dots with labels 1990, 2000, 2010, 2020; red #AE3030 start dot with "▶ 1980", blue end dot with "● 2023". The 1990 and 2020 labels sit on the path/markers; the "●" glyph draws a black dot off the path next to the end marker.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17.
      Chrome: Title, axis titles, tick labels and legend text all in light ink and readable; guides subtle dark-dashed. No dark-on-dark text: year labels and the ▶/● glyphs render light.
      Data: Path, era colors, amber key-year dots, red start and blue end markers identical to the light render; only chrome flipped. The brand green first era reads clearly.
      Legibility verdict: PASS
