review:
  strengths:
  - Path drawn in strict year order with straight segments and a marker at every observation,
    so the 2000-2004 reversal visibly doubles back and crosses itself
  - Five-step imprint_seq gradient from brand green to blue, explained by a one-row
    era legend, makes the direction of time readable at a glance in both themes
  - Enlarged start and end markers plus six time labels placed on the clear side of
    the path, none touching a marker, segment or another label
  - Uses pygal's print_labels on value dicts with an inline CSS anchor rule for the
    time labels, and keeps native SVG tooltips in the HTML output
  weaknesses:
  - 'Suggestion: the middle eras (1989–1997, 1998–2006) are close teal steps, so the
    direction inside the self-crossing loop is hard to follow; a small arrowhead on
    a segment of the loop would make it explicit.'
  - 'Suggestion: a small gap between each legend swatch and its text would make the
    bottom legend breathe.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "Fertility vs Urbanization · scatter-connected-temporal · python · pygal · anyplot.ai" in dark ink at the top, about 68 % of the width; x-axis "Urban population (% of total)" with ticks 28%-60%, y-axis "Fertility rate (births per woman)" with ticks 3.6-5.4; subtle grid in both directions; bottom legend of five era swatches 1980–1988 … 2016–2023. All readable.
      Data: 44 markers joined by straight segments in year order, coloured in five steps from brand green #009E73 (1980s) to blue #4467A3 (2016–2023); enlarged start marker at 29 %/5.47 and end marker at 58 %/3.52; the path falls steadily, doubles back around 41–46 % / 4.1–4.4 (2000–2004 reversal) and shows a rebound peak at about 52.5 %/3.95. Labels 1980 (start), 1989, 1997, 2006, 2014, 2023 (end) sit clear of the path.
