review:
  strengths:
  - 'Imprint imprint_seq gradient (#009E73 -> #4467A3) encodes time along both path
    and markers, with a terminal closed arrow making the direction of time readable'
  - Start and end observations emphasised with enlarged markers and a theme-adaptive
    ink ring
  - 'Full theme adaptation: all chrome threaded through PAGE_BG / INK / INK_SOFT /
    ELEVATED_BG tokens; both renders legible'
  - letsplot-native layer_tooltips() with formatted year, unemployment and inflation
    lines for the HTML view
  - Markers at every observation with page-colored outlines remain visible on the
    line in both themes
  weaknesses:
  - 'VQ-02, SC-02 (both): the ''2007'' year label is drawn across the path segment
    between the ~(5.35, 2.58) and ~(5.81, 1.52) markers → place it clear of the path
    (C3), e.g. on the open side of its point. Likely cause: nudge_map entry 2007:
    (0.35, -0.7) pushes the label onto the following segment.'
  - 'SC-02 (both): the ''2009'' and ''2000'' labels float about 0.6-0.7 axis units
    from any marker in empty space, so which point they name is ambiguous (C3: labels
    on the key time points) → keep each label adjacent to its marker (offset about
    0.2-0.3 units) or join it with a short leader. Likely cause: nudge_map offsets
    of ±0.55-0.7 on label_x/label_y.'
  - 'DQ-03 (code): the regime comments contradict the generated data: ''# 2008 crisis''
    builds indices 20-22, i.e. years 2010-2012, so the 10% unemployment peak lands
    in 2012 and the annotated ''2009'' turning point sits at 4.1% unemployment → align
    the segment lengths with the years they name (e.g. crisis segment covering 2008-2009)
    so the labelled years fall on the turning points. Likely cause: the np.linspace
    segment lengths 10/4/6/3/11.'
  - 'DE-02 (both): a four-sided frame encloses the panel (dark in light, grey in dark),
    against the style guide''s spine rule (L-frame or none) → drop the top and right
    sides or the whole frame. Likely cause: the lets-plot panel frame is not disabled;
    panel_border=element_blank() does not remove it here, check axis_line / panel_border
    placement after theme_minimal().'
  - 'Suggestion: an alpha ramp along time_idx could make the 1990s loop easier to
    follow under the later path.'
  - 'Suggestion: label the crisis peak (10% unemployment) as a key turning point.'
