review:
  strengths:
  - SVG linearGradient with gradientUnits='userSpaceOnUse' anchored to the 1992 and
    2021 coordinates grades the single path stroke from Imprint green to blue, so
    the direction of time reads from the picture
  - Marker fills interpolate along the same Imprint seq stops via d3.interpolateRgb,
    keeping markers and path in one temporal encoding, identical in both themes
  - 'Clear hierarchy: enlarged r=9 endpoint markers with bold ink labels for 1992
    and 2021 against regular inkSoft labels for intermediate years'
  - Page-colored halo on every marker keeps the 30 positions visible on the path in
    both themes
  - Compact gradient legend with 'Temporal direction →' and year endpoints sits in
    the right margin, clear of the data
  - 'Full token threading (pageBg, ink, inkSoft, grid, seq): both themes pass the
    readability check'
  weaknesses:
  - 'VQ-01 (both): intermediate year labels (2000, 2007, 2009, 2015, 2020) at 12px
    are below the library''s 14px floor and blur in the 400 px thumbnail → 14px (+2
    px). Likely cause: font-size ''12px'' for non-endpoint labels in the year-label
    loop.'
  - 'VQ-02, SC-02 (both): the ''2007'' label is drawn on the 2007→2008 segment directly
    beside the 2008 marker, so it reads as the 2008 point''s label and touches the
    path (C3) → place it clear of the path on the 2007 marker''s own side, e.g. below-right
    of (39.8, 78.2). Likely cause: labelConfig entry {year: 2007, dx: 10, dy: -13}.'
  - 'VQ-02 (both): the Financial Crisis dashed leader line starts at (x−8, y+12) of
    the 2009 marker and runs into the end of the ''2009'' label → start the leader
    clear of the label''s bounding box (at least 4 px gap). Likely cause: the leader
    x1/y1 offsets overlap labelConfig {year: 2009, dx: -46, dy: 19}.'
  - 'Suggestion: a small arrowhead at the 2021 end of the path would reinforce direction
    alongside the gradient (the Notes allow arrows).'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white rect.
      Chrome: bold title 'GDP & Life Expectancy · scatter-connected-temporal · javascript · d3 · anyplot.ai' (~72% width), axis titles in ink at 16px, ticks '$20k'–'$55k' and '75 yrs'–'80 yrs' in inkSoft at 14px, italic 13px captions 'Financial Crisis' and 'COVID-19' with dashed leaders, gradient legend 'Temporal direction →' 1992–2021 in the right margin. Subtle grid on both axes; only left and bottom axis lines. All text readable.
      Data: 30 markers joined in year order by one path stroked with an Imprint seq gradient from #009E73 (1992, lower left) to blue (2021, upper right); endpoints enlarged with bold labels; year labels at 2000, 2007, 2009, 2015, 2020. '2007' sits beside the 2008 marker on the segment; the Financial Crisis leader touches '2009'.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and axis titles in light ink, ticks, year labels and captions in light inkSoft; no dark-on-dark text; grid subtle.
      Data: path and marker colors identical to the light render (green → blue); markers haloed in the dark page color; the green start stays visible.
      Legibility verdict: PASS
