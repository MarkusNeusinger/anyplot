review:
  strengths:
  - 'Temporal gradient built from imprint_seq (t.seq: brand green #009E73 → blue #4467A3)
    with per-point scriptable pointBackgroundColor arrays — direction of time readable
    in both themes'
  - 'Chart.js plugin API used natively: afterDatasetsDraw + getDatasetMeta places
    year labels at the rendered point positions'
  - Built-in subtitle plugin carries the color key instead of a misleading single-series
    legend
  - Start (1970) and end (2020) enlarged to radius 11 as focal anchors; page-colored
    marker outlines separate points from the path
  - Real CO₂-vs-temperature data 1970–2020 with accurate Mauna Loa values; path doubles
    back as the spec expects
  - Theme tokens (t.ink, t.inkSoft, t.grid, t.pageBg) threaded through every chrome
    element; both renders pass the readability check
  weaknesses:
  - 'VQ-02, SC-02 (both): the descending 1998→2000 path segment runs through the left
    half of the ''2000'' year label, so the label is not clear of the path (C3) →
    place the label clear of the segment, e.g. below the 2000 point or offset to its
    right. Likely cause: temporalLabels draws every label at pt.y − 14 directly above
    its point regardless of the neighbouring segment.'
  - 'CQ-01 (code): two helper functions hexToRgb and lerpColor (lines 41–58) break
    the flat Data → Plot structure → inline the interpolation in the pointColors map.
    Likely cause: color math factored into helpers.'
  - 'Suggestion: a slightly brighter connecting line on the dark render (alpha 0.45
    green reads dim on #1A1A17) would strengthen the path.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Bold dark title 'scatter-connected-temporal · javascript · chartjs · anyplot.ai' (~39% width), soft-ink subtitle 'Color encodes time: 1970 (green) → 2020 (blue)', axis titles 'CO₂ Concentration (ppm)' and 'Temperature Anomaly (°C)' in ink, tick labels in soft ink, subtle grid, thin L-shaped axis border lines (left and bottom) from the scale defaults. Bold year labels 1970/1980/1990/2000/2010/2020 above their points; the 1998→2000 segment crosses the left of the '2000' label.
      Data: 26 markers joined by a semi-transparent green straight-segment path; markers shade from #009E73 (1970, enlarged) to #4467A3 (2020, enlarged) with page-colored outlines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title, subtitle, axis titles, ticks and year labels all in light ink and readable; no dark-on-dark text. Grid subtle, thin L-shaped axis border lines (left and bottom) from the scale defaults.
      Data: Marker colors identical to the light render (green → blue); path is the same green at 0.45 alpha, dimmer on dark but visible. Brand green clearly visible.
      Legibility verdict: PASS
