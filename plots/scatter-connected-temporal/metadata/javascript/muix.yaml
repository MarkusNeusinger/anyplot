review:
  strengths:
  - 'Real US Phillips-curve data (1970–2009, unemployment vs CPI inflation) with values
    that check out (1980: 7.1 % / 13.5 %, 2009: 9.3 % / −0.4 %), so the loops of the
    stagflation era and the 2009 deflation dive tell a genuine story'
  - Decades take ordered steps of the Imprint sequential ramp (t.seq[0] → t.seq[1])
    in time order, with a redundant marker shape per decade so neighbouring steps
    stay apart where the loops cross
  - Each period series also carries the previous period's last point, so the path
    stays one unbroken chronological line through every colour change
  - 'Composed MUI X v9 chart: ChartsDataProvider + ChartsWrapper + ChartsSurface,
    a custom mark slot (LargeMark around MarkElement) and a TemporalLayer that reads
    useXScale/useYScale/useDrawingArea to draw labels and chevrons in data space'
  - Time labels carry a page-colour halo and are placed clear of the path, the markers
    and each other; all ten labels are readable in both themes
  - Theme tokens threaded through every chrome element; both renders pass the readability
    check, and skipAnimation is set on the provider and on each plot
  weaknesses:
  - 'VQ-03 (both): the 2000s direction chevron sits on the 2004→2005 segment inside
    the dense cluster around x≈5.1, y≈3 (overlapping 1994/2001/2002 markers) and can
    barely be told apart from the marks around it → place it on a segment with clear
    space around it, for example the longest segment of the period. Likely cause:
    the arrows block picks members[Math.floor((members.length - 1) / 2)], the period''s
    middle point, regardless of local crowding.'
  - 'Suggestion: the 14 px time labels could go up to 15–16 px with weight 600 so
    the key years read more strongly in the 400 px thumbnail.'
  - 'Suggestion: the vertical grid at every unemployment tick together with the horizontal
    grid adds a lot of lines; a horizontal-only grid would quiet the background behind
    the crossing path.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold title "scatter-connected-temporal · javascript · muix · anyplot.ai" centred at top, grey subtitle "Inflation rate (%) against Unemployment rate (%), 1970–2009, joined in time order"; horizontal legend top right (1970s circle, 1980s square, 1990s triangle, 2000s diamond); x axis "Unemployment rate (%)" ticks 4–10, y axis "Inflation rate (%)" ticks 0–14; subtle grid both ways. All dark text, all readable.
      Data: 40 annual points joined in time order by straight segments; 1970s in brand green #009E73 (circles), 1980s teal (squares), 1990s blue-teal (triangles), 2000s blue (diamonds) — steps of the Imprint sequential ramp. Markers have a thin page-colour outline. Year labels 1970, 1973, 1979, 1980, 1989, 1990, 1999, 2000, 2008, 2009 with halos, clear of the path. Small open chevrons in the line colour mark direction, one per decade; the 2000s chevron near (5.1, 3) is lost in the cluster.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels flip to light ink and are all clearly readable; no dark-on-dark text. Grid lines subtle grey, axis lines light.
      Data: decade colours and shapes identical to the light render; brand green 1970s clearly visible; year labels in light ink with a dark halo.
      Legibility verdict: PASS
