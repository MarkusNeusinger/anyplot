review:
  strengths:
  - 'Real US Phillips-curve data (1970-2009), checked against the known figures: the
    1970s stagflation loop, the 1980 peak and the 2009 jump all read clearly'
  - Decades take ordered steps of the Imprint sequential ramp starting at brand green,
    with a per-decade marker shape as a second cue
  - Time labels have a page-colored halo and a placement that looks for room around
    the path; all 10 stay free of text collisions
  - 'Idiomatic MUI X v9 composition: the useXScale/useYScale hooks drive a custom
    SVG arrow and label layer inside ChartsSurface, and the null-gapped series keep
    the path unbroken across decades'
  - 'Both themes are correct: the chrome flips through the tokens while the data colors
    stay identical'
  weaknesses:
  - 'VQ-02 (both): the ''2008'' label is placed below its diamond at (5.8, 3.8), about
    where the 1972 marker at (5.6, 3.2) sits, so it reads as belonging to either point
    → place it on the side away from neighbouring markers, not just away from the
    path. Likely cause: the placement score in TemporalLayer (pathRoom) checks distance
    to segments and to other labels but not to other markers.'
  - 'VQ-03 (both): the direction arrowheads are 12 px CSS on a 2.5 px line and almost
    vanish in the dense 1990s/2000s cluster (for example the 1990s arrow near (5.85,
    2.7)) → about 16-18 px (+4 to +6 px). Likely cause: the marker''s markerWidth/markerHeight={12}.'
  - 'Suggestion: the 1980s and 1990s steps of the ramp are close in hue; the shapes
    carry the difference, but a slightly larger mark size would make the shapes easier
    to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page, no white panel.
      Chrome: bold title "scatter-connected-temporal · javascript · muix · anyplot.ai" centered at the top, with a grey subtitle "Inflation rate (%) against Unemployment rate (%), 1970–2009, joined in time order" below it. The axis titles "Unemployment rate (%)" (x, 4–10) and "Inflation rate (%)" (y, 0–14) and the tick labels are dark ink. A subtle grid in both directions. A horizontal legend at the top right shows 1970s, 1980s, 1990s and 2000s with their line and mark glyphs.
      Data: 40 yearly points joined by straight segments. The 1970s are brand green #009E73 circles, the 1980s teal squares, the 1990s blue-teal triangles and the 2000s blue diamonds, in ramp order. A small arrowhead sits mid-decade on each path. Dark labels with a halo mark 1970, 1973, 1979, 1980, 1989, 1990, 1999, 2000, 2008 and 2009. The 1970s loop up to 11–13.5 % inflation, the path falls into the low-inflation band in the 1990s/2000s, and a long segment jumps to 2009 (9.3, −0.4).
      Legibility verdict: PASS

