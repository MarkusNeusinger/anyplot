review:
  strengths:
  - Real US Phillips-curve data 1970–2009 that matches BLS annual averages, with genuine
    loops and the 2009 regime break
  - 'MUI X composition: TemporalOverlay uses useXScale/useYScale to draw year labels
    and arrows in data coordinates inside the LineChart SVG'
  - Custom slots.mark renderer with page-colored halos keeps every marker visible
    where lines cross
  - Null-masked decade series with shared boundary points give a seamless path coloured
    by decade
  - Theme-correct chrome and identical Imprint data colours in both renders
  weaknesses:
  - 'VQ-02, SC-02 (both): year labels sit on the path — the green 1973→1974 segment
    runs through ''1973'', the purple 1979→1980 segment through ''1979'', the purple
    1987→1988 segment through ''2008'', the 1988→1989 segment through ''1989'', and
    ''1970'' butts against the 1973 marker so it reads as that point''s label → place
    each label on the side of its marker away from both adjoining segments, at least
    ~6 px clear of any line. Likely cause: fixed dx/dy offsets in KEY_POINTS chosen
    without checking segment directions.'
  - 'SC-02, VQ-03 (both): direction arrows are drawn at the midpoint of the chord
    from point i-1 to i+1, not on the path — the 1970s arrow floats in the empty middle
    of its loop at about (6.6, 8.4), the 1980s arrow sits beside the blue line, and
    the 2000s arrowhead lands on the 1995/2004 markers where it is barely visible
    → place each arrow on an actual segment (midpoint of i→i+1, oriented along it)
    on a segment that no marker covers. Likely cause: ARROWS geometry uses unemployment[i-1]/[i+1]
    instead of [i]/[i+1].'
  - 'Suggestion: a light-to-dark ramp within each decade would let the direction of
    time read even where arrows are absent.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1.
      Chrome: title 'Phillips Curve · scatter-connected-temporal · javascript · muix · anyplot.ai' in dark ink centred at top (19 px, about 38% of the width); axis titles 'Unemployment Rate (%)' and 'Inflation Rate (%)', ticks 4–11 and -2–14, legend 1970s/1980s/1990s/2000s top-right; faint grid; left and bottom axis lines only. Year labels in soft ink. All readable.
      Data: four decade paths — 1970s #009E73, 1980s #C475FD, 1990s #4467A3, 2000s #BD8233 — with r=6 halo markers at all 40 years and small arrowheads per decade. Labels 1973, 1979, 1989, 2008 are crossed by path segments; the 1970s arrow floats inside its loop; the 2000s arrowhead sits on markers near (5.5, 2.8).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17.
      Chrome: title, axis titles, ticks, legend and year labels in light ink; grid subtle; no dark-on-dark text.
      Data: colours identical to the light render; only chrome flips. Same label collisions and arrow placement.
      Legibility verdict: PASS
