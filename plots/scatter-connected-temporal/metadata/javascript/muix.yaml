review:
  strengths:
  - Real US Phillips-curve data 1970–2009 (unemployment vs CPI inflation) whose loops
    show the 1970s stagflation spiral, the 1980 peak at 13.5 %, the Volcker disinflation
    and the 2009 jump to 9.3 % / −0.4 %
  - Decades are colour-stepped along the Imprint sequential ramp (t.seq) in time order
    and get a second cue through per-series marker shapes, so the direction of time
    reads even where loops cross
  - Each decade series also carries the previous decade's last point, so the path
    stays one unbroken straight-segment line while the colour changes; showMark as
    a function marks only the decade's own points
  - 'Composed MUI X v9 API: ChartsDataProvider + ChartsWrapper + ChartsSurface with
    LinePlot, MarkPlot, ChartsGrid and a custom SVG layer that reads useXScale/useYScale/useDrawingArea
    for the arrows and year labels'
  - Year labels carry a page-coloured halo (paintOrder stroke) and sit clear of the
    path, the markers and each other in both themes; skipAnimation is set on the provider
    and plots
  weaknesses:
  - 'VQ-03 (both): with only 40 sparse points the line markers are drawn at the MUI
    default size (about 5–6 CSS px, the 1980s squares the smallest) and read as small
    beads on the 2.5 px line, especially in the dense lower-left 1990s/2000s cluster
    → about 8–10 CSS px (+3 to +4 px). Likely cause: no markerSize / mark size set
    on the line series or the .MuiLineChart-mark style.'
  - 'Suggestion: the 1980s and 1990s ramp steps are close teals; a slightly wider
    spread between neighbouring decades would make the crossing loops in the lower-left
    easier to follow.'
  - 'Suggestion: the subtitle repeats the axis titles; a shorter line naming the regime
    (e.g. the stagflation loop) would add context instead.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: bold dark title "scatter-connected-temporal · javascript · muix · anyplot.ai" centred at top, grey subtitle below; axis titles "Unemployment rate (%)" and "Inflation rate (%)", tick labels 4–10 and 0–14 in soft ink; subtle grey grid; horizontal legend top right (1970s circle, 1980s square, 1990s triangle, 2000s diamond). All text readable.
      Data: 40 yearly points joined by straight segments in time order; colour steps along the Imprint sequential ramp from brand green #009E73 (1970s) through teals to blue (2000s); one arrowhead per decade on its middle segment; year labels 1970, 1973, 1979, 1980, 1989, 1990, 1999, 2000, 2008, 2009 in dark ink with a page halo, clear of the path. Dense lower-left cluster for the 1990s/2000s as expected.
      Legibility verdict: PASS

