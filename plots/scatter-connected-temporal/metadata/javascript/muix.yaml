review:
  strengths:
  - Real, neutral US Phillips-curve data (unemployment vs CPI inflation, 1970–2009)
    whose loops and the 1973/1979–80/2008–09 regime shifts tell the plot type's story
  - Every observation carries a marker at its exact (x, y), joined by straight linear
    segments in time order; the path is never sorted or smoothed
  - Decades take ordered steps of the Imprint sequential ramp (green → blue) in time
    order, doubled by a per-decade marker shape so neighbouring ramp steps stay apart
    where the loops cross
  - Time labels on start, end, decade boundaries and notable years, placed clear of
    the path, the markers and each other with a halo in the page colour
  - 'Composed MUI X v9 API: ChartsDataProvider + ChartsSurface with useXScale/useYScale/useDrawingArea
    hooks for a custom SVG layer, a custom mark slot, per-point showMark function
    and labelMarkType line+mark legend'
  - Theme tokens threaded through title, subtitle, axes, grid, legend and label halos;
    both renders fully readable
  weaknesses:
  - 'VQ-03 (both): the filled direction arrowheads (17 px triangles) are the same
    colour and about the same size as the 1990s triangle markers, so the 1980s arrow
    near (7.35, 4.0) and the 1990s/2000s arrows inside the dense 5–6 % cluster read
    as extra data points rather than direction cues → make the heads clearly differ
    from every marker shape (e.g. an open chevron head, or a head clearly smaller
    than the marks). Likely cause: the filled `M0,0 L10,5 L0,10 Z` marker path with
    ARROW_HEAD = 17.'
  - 'Suggestion: a slightly larger title would balance the wide plot area; at about
    38 % of the width it reads small next to the legend row.'
  - 'Suggestion: the 1980s and 1990s ramp steps are close in hue; the shapes carry
    the distinction, but a wider step spacing would help in the thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
