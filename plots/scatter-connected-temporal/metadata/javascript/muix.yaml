review:
  strengths:
  - Decades take ordered steps of imprint_seq (green 1970s to blue 2000s), each paired
    with its own marker shape, so time progression reads both by colour and by shape
    and survives colour-vision deficiency
  - One arrowhead per decade plus labels on the start, the end, the decade boundaries,
    1973 and 2008 make the direction of the path unambiguous, and the labels sit clear
    of the path and markers with a page-coloured halo
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider/ChartsWrapper/ChartsSurface
    with LinePlot and MarkPlot, a showMark callback that keeps the path unbroken across
    decade boundaries, and useXScale/useYScale driving the custom arrow and label
    layer'
  - 'Real US Phillips-curve data 1970–2009 shows the full repertoire of the type:
    the stagflation loops of the 1970s, the 1980s disinflation, and the 2009 jump
    to 9.3 % unemployment and -0.4 % inflation'
  - 'Both themes are correct: chrome flips from ink on #FAF8F1 to light ink on #1A1A17,
    data colours identical, legend glyphs filled and outlined like the marks'
  weaknesses:
  - 'Suggestion: the 2000s arrowhead falls in the densest tangle around 5–5.5 % unemployment
    and 3 % inflation, next to 1990s triangles of similar size; putting each decade''s
    arrow on its longest segment (for the 2000s, 2008→2009) would make it easier to
    pick out.'
  - 'Suggestion: the square and diamond markers read slightly smaller than the circles
    at the same mark size; a touch more mark size would give the sparse 40 points
    more presence.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold title "scatter-connected-temporal · javascript · muix · anyplot.ai" centred at the top with a grey subtitle "Inflation rate (%) against Unemployment rate (%), 1970–2009, joined in time order"; horizontal legend top right (1970s, 1980s, 1990s, 2000s with line+mark glyphs); x axis "Unemployment rate (%)" 4–10, y axis "Inflation rate (%)" 0–14; subtle grey grid both ways; left and bottom axis lines only. All text dark and readable.
      Data: 40 markers joined by straight segments in year order; 1970s brand green #009E73 circles, 1980s teal squares, 1990s steel-teal triangles, 2000s blue #4467A3 diamonds. One arrowhead per decade on the path. Year labels 1970, 1973, 1979, 1980, 1989, 1990, 1999, 2000, 2008, 2009 with page-coloured halos sit beside their markers, clear of the path. The 1970s/1980s loops rise to 13.5 % inflation in 1980; the 1990s/2000s tangle at 4–6 % / 2–4 %; the path ends with the long jump to 2009 at 9.3 % / -0.4 %.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, legend text, axis titles and tick labels all in light ink and clearly readable; grid lines a subtle dark grey, still visible; no dark-on-dark text.
      Data: identical colours, shapes, arrows and label positions to the light render; the 2000s blue stays visible against the dark page, brand green reads well.
      Legibility verdict: PASS
