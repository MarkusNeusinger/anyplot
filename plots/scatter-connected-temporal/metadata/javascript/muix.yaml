      Data: a 40-point connected path, decades coloured in ramp steps from brand green #009E73 (1970s) through teals to blue (2000s), markers with page-colour outline at every point, four filled arrowheads mid-decade, year labels 1970, 1973, 1979, 1980, 1989, 1990, 1999, 2000, 2008, 2009 clear of the path. 1970s loop rises to 11 %, 1980 peak at 13.5 %, 2009 drops to -0.4 % at 9.3 % unemployment. Arrowheads look similar to the triangle markers.
