review:
  strengths:
  - Real US Phillips-curve data 1970–2009 (unemployment vs CPI inflation) with labels
    on the decade boundaries plus the 1973 oil shock and the 2008 crisis; the 1970s
    stagflation loop and the 2009 jump read clearly
  - 'Decades take ordered steps of the Imprint sequential ramp (#009E73 → #4467A3)
    in time order, with a per-decade marker shape as a redundant CVD-safe cue; legend
    shows line+mark glyphs filled like the data marks'
  - A marker at every observation, joined by straight unsorted segments; each decade
    series carries the previous decade's last point so the path stays unbroken where
    the colour changes
  - 'Uses MUI X v9 composition idiomatically: ChartsDataProvider + ChartsWrapper +
    ChartsSurface with LinePlot/MarkPlot, a custom mark slot for larger symbols, and
    a TemporalLayer built on useXScale/useYScale/useDrawingArea'
  - Year labels carry a page-coloured halo and are placed clear of the path, the markers
    and each other; chrome uses theme tokens, so both renders are fully legible
  - Interactive HTML keeps MUI X tooltips and legend highlighting
  weaknesses:
  - 'VQ-03 (both): the direction chevrons have 7 px arms in the line''s own 2.5 px
    stroke, so they nearly vanish on the 1600 px-wide plot and disappear entirely
    in the 400 px thumbnail → about 11–12 px arms (+4 to +5 px), still unfilled and
    below marker size. Likely cause: CHEVRON_ARM = 7.'
  - 'Suggestion: the 1980s and 1990s ramp steps are close teal tones; a slightly wider
    luminance spread between steps would separate the tangled lower-left stretch further.'
  - 'Suggestion: the y-axis title sits far from its tick labels; a narrower y-axis
    band would tighten it.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: bold title "scatter-connected-temporal · javascript · muix · anyplot.ai" with a grey subtitle; axis titles "Unemployment rate (%)" and "Inflation rate (%)", grey tick labels 4–10 and 0–14, subtle grid on both axes, horizontal legend top-right (1970s circle, 1980s square, 1990s triangle, 2000s diamond). All dark text readable.
      Data: 40 annual points joined in time order; 1970s in brand green #009E73 circles, stepping through teal to blue #4467A3 diamonds for the 2000s. The 1970s stagflation loop reaches 11 %, 1980 peaks at 13.5 %, 1982–83 swings right to 9.7 % unemployment, the 1990s/2000s tangle at low inflation, and 2009 drops to 9.3 % / −0.4 %. Ten year labels (1970, 1973, 1979, 1980, 1989, 1990, 1999, 2000, 2008, 2009) clear of the path; small chevrons per decade on the path, barely visible.
      Legibility verdict: PASS

