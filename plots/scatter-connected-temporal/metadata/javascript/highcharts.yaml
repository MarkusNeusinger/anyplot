review:
  strengths:
  - Scatter series with lineWidth connects points in data-array order, the idiomatic
    Highcharts way to draw a connected scatter without x-sorting
  - Start (triangle) and end (diamond) symbols plus five-year labels make the direction
    of time readable without a legend
  - The 1980 stagflation climax is an enlarged amber marker with a bold callout, a
    clear focal point
  - Real US unemployment/CPI data 1960-1995 matching BLS annual values
  - Theme tokens threaded through all chrome; both renders readable, data colors identical
  - HTML tooltip formatter shows year, unemployment and inflation on hover
  weaknesses:
  - 'VQ-02, SC-02 (both): the ''1970'' label sits on the 1973 marker at (4.9 %, 6.2
    %) and the 1973→1974 segment, and the ''1995'' label covers the 1972 marker at
    (5.6 %, 3.2 %) → labels clear of every marker and segment (C3). Likely cause:
    the fixed dataLabels y: -16 offset for all labeled years; place those two labels
    below/left (per-point dataLabels align/x/y).'
  - 'VQ-01 (light): the ''★ Stagflation Peak'' label in amber #DDCC77 on #FAF8F1 has
    about 1.5:1 contrast and reads faint → ink-colored label text (t.ink) with the
    amber kept on the marker. Likely cause: dataLabels style color: t.amber.'
  - 'Suggestion: a light-to-dark green gradient along the path (Notes allow it) would
    make the direction of time readable along the middle years too.'
  - 'Suggestion: label 1980 with its year as well (e.g. ''1980 ★ Stagflation Peak'')
    so the timeline labels stay continuous.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: title 'scatter-connected-temporal · javascript · highcharts · anyplot.ai' in dark ink, subtitle 'US Phillips Curve, 1960 → 1995 · path traces chronological order' in soft ink, axis titles 'Unemployment Rate (%)' / 'Inflation Rate (%)', % tick labels 3.5-9.5 % and 0-15 %, subtle grid; all readable. Year labels 1960/1965/1970/1975/1985/1990/1995 in soft ink with page halo; '1970' sits on the 1973 marker and '1995' on the 1972 marker. The amber '★ Stagflation Peak' label is readable but faint on the cream page.
      Data: 36 #009E73 circles (radius 7, page-colored rims) joined by a 2 px green path in year order; 1960 is a triangle, 1995 a diamond, 1980 an enlarged amber #DDCC77 circle at (7.1 %, 13.5 %). The path loops, crosses itself and makes the stagflation excursion up to the 1980 peak.
      Legibility verdict: PASS (amber callout faint)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black
      Chrome: title in light ink, subtitle, axis titles, ticks and year labels in light soft ink; no dark-on-dark text; grid subtle. Same label collisions at 1970 and 1995. Amber callout reads well here.
      Data: identical green #009E73 path and markers and amber peak; only chrome flipped.
      Legibility verdict: PASS
