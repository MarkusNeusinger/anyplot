review:
  strengths:
  - visualMap with dimension:2 maps the time index of each [x, y, t] tuple onto the
    Imprint sequential ramp, an ECharts-native way to encode temporal progression
  - markLine with an arrow end symbol on the final segment makes the direction of
    time readable at a glance
  - Key years 1980/2000/2010/2023 are enlarged and labeled with per-point positions
    that keep every label clear of the path and markers
  - All chrome threads through ANYPLOT_TOKENS; both renders are fully readable
  - Factually accurate CO₂ vs. temperature-anomaly series (Mauna Loa / GISTEMP values)
    in a neutral science context
  - Flat, deterministic code with no helpers; tooltip-ready data names add value in
    the HTML view
  weaknesses:
  - 'VQ-03 (both): the temporal gradient shows only in the 1.5 px outlines of the
    markers, whose fills are ECharts'' default white emptyCircle; in the dark render
    the markers read as white dots and the green-to-blue progression is barely visible
    → fill each marker with its visualMap color and keep the page-colored ring. Likely
    cause: line series default symbol ''emptyCircle'' (set symbol: ''circle'').'
  - 'VQ-05 (both): the forced axis extents add off-step edge ticks (x: 334 and 426
    beside a 20-ppm step; y: 1.3 and -0.1 beside a 0.3 step), giving uneven tick spacing
    at both ends → extents on the tick step (e.g. x 330–430 with interval 20, y -0.3–1.2
    or 0–1.2 with interval 0.3). Likely cause: xAxis min 334/max 426 and yAxis min
    -0.1/max 1.3.'
  - 'VQ-01 (both): tick labels at 13 px read small next to the 15 px axis names and
    blur in the 400 px thumbnail → about 15 px (+2 px). Likely cause: axisLabel fontSize:
    13 on both axes.'
  - 'Suggestion: the markLine arrow redraws the 2022→2023 segment as a dashed overlay
    on top of the solid path; an arrow symbol alone (e.g. line series endLabel or
    a shorter markLine stub) would avoid the doubled stroke.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1.
      Chrome: bold dark title "Temperature Anomaly vs CO₂ · scatter-connected-temporal · javascript · echarts · anyplot.ai" centered at top (~44% of width); axis names "Atmospheric CO₂ (ppm)" and "Global Temperature Anomaly (°C)" in dark ink; gray tick labels (x 334, 340…420, 426; y -0.1, 0.0…1.2, 1.3) with uneven edge steps; subtle gray grid both directions, no axis lines.
      Data: 44 hollow circle markers (11 px, key years 18 px) whose outlines run from brand green #009E73 (1980) to blue (2023), joined in time order by a translucent blue-lavender path; bold muted year labels 1980 (left), 2000 (top), 2010 (top), 2023 (right); a blue arrow on the 2022→2023 segment points at the 2023 marker. The path climbs from lower-left to upper-right with year-to-year zigzags.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title and axis names in light ink, tick labels in light gray, grid subtle; no dark-on-dark text anywhere.
      Data: same outline colors (green to blue), path and arrow as the light render; marker fills render white, so the markers read as white dots with thin colored rings; year labels in light gray, all clear of the path.
      Legibility verdict: PASS
