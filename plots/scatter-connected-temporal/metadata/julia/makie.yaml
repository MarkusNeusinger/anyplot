review:
  strengths:
  - 'Two-stop imprint_seq gradient (cgrad #009E73 → #4467A3) on both the segments
    and the markers, with a Trading day colorbar, makes the direction of time readable
    across the whole path'
  - Markers carry a page-colored stroke, so every observation stays distinguishable
    where the path crosses itself
  - Theme tokens (INK, INK_SOFT, PAGE_BG) reach every chrome element; both renders
    read cleanly
  - Colorbar placed as a Makie GridLayout cell (fig[1, 2]) with colgap! instead of
    an inset legend
  weaknesses:
  - 'VQ-02 (both): the ''Day 40'' label at (12.0 M, 101 USD) is crossed by a segment
    of the late-session cluster that runs through the text, and ''Day 10'' sits on
    the segment just beneath it → each key label clear of the path by at least 4 px.
    Likely cause: every text! uses the same align=(:center, :bottom), offset=(0, 8),
    regardless of where the neighbouring segments run.'
  - 'CQ-04 (code): lines 77–83 draw the path as 39 separate lines! calls in a loop
    to color it per segment → one `lines!(ax, volume, price; color = t_norm, colormap
    = ANYPLOT_SEQ, linewidth = 2.5)`, which Makie colors per vertex. Likely cause:
    per-segment loop instead of the per-vertex color attribute.'
  - 'Suggestion: the start arrow (arrowsize 16) sits among the crossing early segments
    next to the day-2 marker and is easy to miss; a larger arrowhead would make the
    direction cue read faster.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white
      Chrome: bold title 'Price vs Volume · scatter-connected-temporal · julia · makie · anyplot.ai' in dark ink; axis labels 'Trading Volume (million shares)' and 'Closing Price (USD)'; soft-ink tick labels; subtle grid; top/right spines removed; colorbar 'Trading day' 1–40 on the right; labels Day 1, 10, 20, 30, 40 in dark ink
      Data: 40 markers joined by straight segments in time order, colored green #009E73 (day 1) to blue #4467A3 (day 40); tangled low-price band for days 1–20, run-up to ~100 USD, plateau at the top; small green arrow at the start; 'Day 40' label crossed by a segment
