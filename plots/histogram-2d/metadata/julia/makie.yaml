review:
  strengths:
  - Marginal histograms (top/right), linked to the main axes via linkxaxes!/linkyaxes!,
    add valuable univariate context per the spec's optional suggestion, with hidden
    decorations/spines for a clean look.
  - NaN-as-background trick for empty bins avoids a solid-block look and lets the
    true density shape read clearly against the page background.
  - Correlated equity/bond-returns dataset (20,000 points, correlation 0.65) is realistic,
    neutral, and appropriately scaled for a financial 2D histogram use case.
  - Theme tokens (PAGE_BG/INK/INK_SOFT) are threaded consistently through the main
    axis, both marginal axes, and the colorbar; both renders are fully legible.
  - Data colors (Imprint green-to-blue sequential heatmap, brand green marginals)
    are identical between light and dark; only chrome flips as required.
  weaknesses:
  - Heatmap shows scattered background-colored gaps within the density lobes (visible
    near the upper lobe around x=0-1, y=1.8-2.3 and the lower-left tail around x=-4..-1,
    y=-1.8..-2.2) from low per-bin counts at 42x42 resolution — creates a patchy/checkerboard
    look instead of a smooth gradient. Consider slightly coarsening the grid (e.g.
    ~30-32 bins) or smoothing sparse-count cells.
  - Spec explicitly suggests a log color scale when density varies widely; counts
    here span roughly 1 to 170+ (two orders of magnitude), but the colormap is mapped
    linearly, which compresses the sparse outer regions into a single flat green.
    A log-scaled `colorrange`/colormap would reveal structure in the tails.
  - Colorbar tick labels ('50', '100', '150') are noticeably smaller than the axis
    tick labels — verify they stay legible when the plot is scaled down to ~400px
    for mobile/thumbnail views.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec target.
      Chrome: Title "histogram-2d · julia · makie · anyplot.ai" in bold dark ink, clearly visible top-center. X-axis label "Equity Daily Return (%)" and y-axis label "Bond Daily Return (%)" in dark ink; tick labels in a softer gray-brown, all fully readable. Colorbar labeled "Count" on the right with tick labels 50/100/150, readable but noticeably smaller than the main axis ticks.
      Data: Main panel is a 42x42-bin 2D histogram heatmap of correlated bivariate-normal data, brand green (#009E73) at low counts fading to blue (#4467A3) at the density peak near the origin; empty bins render as page background (not colormap low-end), creating a "petal"-shaped cloud with some scattered gaps/holes in the sparser outer lobes. Marginal histograms above (x) and to the right (y) of the main panel, both filled in brand green, share axes with the main panel via linked scales. No axis frame on the marginal panels (decorations/spines hidden); main panel keeps only left/bottom spines.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec target.
      Chrome: Same title, now in light ink, clearly visible against the dark background. Axis labels in light ink, tick labels in a lighter soft gray, all readable — no dark-on-dark text anywhere. Colorbar label and ticks likewise flipped to light tones and legible.
      Data: Identical green-to-blue heatmap coloring and identical brand-green marginal histograms as the light render — only the chrome (background, text, spines) flipped. Same scattered gaps in the sparse outer lobes are visible here too.
      Legibility verdict: PASS
