review:
  strengths:
  - 'Idiomatic geom_bin2d usage with the correct Imprint sequential gradient (#009E73
    → #4467A3), fully theme-adaptive chrome, and identical data colors between light
    and dark renders'
  - Realistic, well-scaled financial dataset (correlated equity vs. bond daily returns)
    with a sqrt count transform that reasonably handles the wide density range without
    a forbidden colormap
  - Title/axis/legend formatting matches spec exactly, canvas is a correct 2400×2400
    square with no clipping or overflow
  weaknesses:
  - Swiss-cheese pattern of zero-count 'holes' punched through the density cloud in
    both renders — bins=28 combined with the tight correlated ellipse leaves many
    isolated empty bins inside the visually continuous cloud, reading as a rendering
    glitch rather than a smooth density surface. Try coarser bins (e.g. 18-20) so
    the cloud reads as continuous.
  - The stat_density_2d contour overlay (color=INK_SOFT, alpha=0.5, linewidth=0.25)
    is essentially invisible against the fill gradient in both renders — it adds code
    without visible payoff; either raise its contrast (darker/higher-alpha line) so
    it reads as a distinct feature, or remove it.
  - No clearly visible distinguishing flourish beyond the base geom_bin2d fill — since
    the density-contour overlay doesn't read visually, the implementation currently
    looks like a default binned heatmap.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-2d · r · ggplot2 · anyplot.ai" in dark ink top-left, fully readable. Axis titles "Equity Daily Return (%)" / "Bond Daily Return (%)" in dark ink, tick labels (-3, 0, 3 / -2..3) in a softer gray — all clearly legible against the light background. Legend "Count" with tick labels 50/100 readable.
      Data: Elongated diagonal cloud of square bins running from bottom-left to top-right (positive equity/bond correlation), colored from #009E73 (green, low count) through to #4467A3 (blue, high count) at the dense center — matches the required Imprint sequential ramp. Scattered small background-colored gaps ("holes") appear within the cloud, giving a mottled/moth-eaten look rather than a smooth density surface.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, and tick labels rendered in light/cream ink, fully readable against the dark background — no dark-on-dark failures observed.
      Data: Same diagonal cloud shape and same green-to-blue gradient as the light render (data colors identical, only chrome flipped, as required). The same speckled hole pattern is present, confirming it's a data/binning artifact rather than a theme-flip regression.
      Legibility verdict: PASS
