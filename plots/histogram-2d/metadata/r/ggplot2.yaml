review:
  strengths:
  - 'Correct Imprint sequential gradient (#009E73 to #4467A3) applied to the count/density
    fill scale, with theme-correct chrome (background, text, legend) in both light
    and dark renders and no edge clipping.'
  - Clean KISS code structure with an explicit reproducible seed (set.seed(42)), correct
    output naming (plot-{theme}.png via ggsave + ragg::agg_png), and no unused imports.
  - Realistic, neutral financial dataset (correlated equity vs. bond daily returns)
    with correctly unit-labeled axes and the mandated title format exactly matching
    the spec-id/language/library convention.
  weaknesses:
  - geom_bin2d(bins = 45) over n = 20000 points produces many near-empty bins that
    render as background-colored holes throughout the density blob, giving a speckled/noisy
    texture rather than a smooth density gradient. Reduce bins (e.g. ~25-30) or apply
    a sqrt/log color transform (scale_fill_gradient(trans = "sqrt")) to both smooth
    the appearance and better reveal the density variation the spec calls out ('consider
    log scale for color mapping when density varies widely').
  - 'Design excellence is solid but not exceptional: the linear count scale compresses
    most of the plot into a near-uniform green wash with only a small dark-blue peak
    at the center, muting the visual hierarchy. A log/sqrt fill transform or a subtle
    contour overlay would sharpen the storytelling.'
  - 'Library mastery is generic: geom_bin2d + scale_fill_gradient is correct and idiomatic
    but doesn''t showcase anything distinctive to ggplot2 beyond the baseline 2D-histogram
    approach (e.g., custom breaks, marginal histograms via patchwork, or a contour
    overlay).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "histogram-2d · r · ggplot2 · anyplot.ai" in dark ink, fully visible, ~60% of canvas width, not clipped. Axis titles "Equity Daily Return (%)" (x) and "Bond Daily Return (%)" (y) in dark ink, balanced sizes. Tick labels (-3, 0, 3 on x; -2 to 3 on y) in softer grey, all fully visible with no leftmost/rightmost digits cut off. "Count" legend title and tick labels (50, 100) in dark/soft ink, fully readable, positioned near the plot (not isolated).
      Data: Elongated diagonal cluster of rectangular bins running from bottom-left to top-right, showing the positive correlation between the two return series. Color fill runs from #009E73 (green, sparse bins) to #4467A3 (blue, dense center) — first/only data-color anchor matches the mandated brand green. Many small background-colored "holes" appear within the blob where individual bins have very low/zero counts, giving a somewhat speckled texture.
      Legibility verdict: PASS — all title, axis, tick, and legend text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light ink (#F0EFE8-ish), fully visible and not clipped. Axis titles in light ink, tick labels in a lighter grey — no dark-on-dark failures observed; all chrome flipped correctly relative to the light render.
      Data: Same diagonal cluster and gradient — the green (#009E73) to blue (#4467A3) fill is visually identical to the light render; only the chrome (background, text) flipped, exactly as required. The same speckled/hole pattern from bin sparsity is present, unrelated to theme.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark or light-on-light issues.
