review:
  strengths:
  - 'Uses the mandated imprint_seq ramp (#009E73 → #4467A3) for the counts; the lowest-count
    bins stay clearly distinct from the page in both themes'
  - Truncates the example ages to 18–75 instead of clipping, so no pile-up bins appear
    at the edges; the tilted joint distribution reads cleanly at 32 bins
  - 'Idiomatic seaborn: JointGrid with axes-level histplot on data=df and column constants,
    one shared N_BINS for heatmap and marginals'
  - Exact 3200×1800 canvas, correct title format and a colorbar labeled 'Customers
    per bin (count)'
  weaknesses:
  - 'SC-02, VQ-05 (both): the top marginal histogram is wider than the heatmap (its
    age 20–70 ticks span about 1,130 px of the 2000-px view against about 900 px for
    the heatmap), so its bars drift right of the bins they summarize by up to ~14
    years at age 70, breaking C4; the colorbar sits wedged between the heatmap and
    the right marginal → the heatmap and the top marginal share the same pixel width
    and the colorbar sits outside the JointGrid (offset 0 px). Likely cause: histplot(cbar=True,
    ax=g.ax_joint) steals width from the joint axes only; pass cbar_ax=g.figure.add_axes([...])
    to the right of g.ax_marg_y.'
  - 'VQ-07 (both): the marginal bars render as a light green (~#3FB58F) on the light
    page and a dark green (~#06775A) on the dark page, so a data color differs between
    themes → solid #009E73 in both. Likely cause: seaborn histplot''s default bar
    alpha (0.75) in marginal_style; add alpha=1.'
  - 'CQ-04 (code): the colorbar label is set twice, in cbar_kws (line 74) and again
    with cbar.set_label (line 94) → set it once. Likely cause: cbar_kws label kept
    after the explicit set_label was added.'
  - 'Suggestion: the change request asked for a different data domain (e.g. wind speed
    vs turbine output or body height vs weight); the new version keeps customer age
    vs spending.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800.
      Chrome: title 'histogram-2d · python · seaborn · anyplot.ai' at top center, axis labels 'Customer age (years)' and 'Annual spending (USD)', ticks 20-70 and 1000-5000, colorbar 'Customers per bin (count)' 0-50; all dark text, clearly readable.
      Data: 32x32 rectangular bins in imprint_seq from #009E73 (1 customer) to #4467A3 (~55), showing a tilted band rising from ~$1,500 at age 20 to ~$4,000 at age 70; empty bins blank. Marginal green histograms on top and right; the top one is wider than the heatmap because the colorbar sits between the heatmap and the right marginal, so the top bars drift right of their bins.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis labels and colorbar label in light ink, ticks in soft light grey; no dark-on-dark text.
      Data: heatmap colors identical to the light render; the marginal bars are darker green than in light (seaborn's default alpha blends with the page); same layout and marginal misalignment.
      Legibility verdict: PASS
