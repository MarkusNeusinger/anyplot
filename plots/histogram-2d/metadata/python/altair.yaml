review:
  strengths:
  - Binning and counting are declared in the encoding (alt.Bin(maxbins=24) on both
    axes with count()), the idiomatic Altair 2D histogram
  - 'The imprint_seq ramp (#009E73 to #4467A3) shows a clear density gradient from
    the sparse green fringe to the blue core, identical in both themes'
  - '24 bins per axis fit 6000 points: the tilt of the rho=0.7 ellipse and the dense
    core read as a smooth gradient with no interior holes'
  - Binned tooltips report each bin's range and count in the interactive HTML output
  - Theme chrome (backgrounds, ink tokens, elevated legend fill) is correct in both
    renders and the PNG is padded, never cropped, to 3200x1800
  weaknesses:
  - 'VQ-06 (both): the axis titles read ''Variable X'' and ''Variable Y'', generic
    names with no unit → descriptive quantity names with units (for example ''Asset
    A daily return (%)''). Likely cause: the VARIABLE_X / VARIABLE_Y column constants.'
  - 'DQ-02 (both): the columns are labelled ''Variable X'' and ''Variable Y'', which
    reads as an abstract textbook sample rather than a real-world pair → rename them
    to a plausible domain pair from the spec''s Applications (for example two asset
    returns), keeping the correlated normal data. Likely cause: the column constants.'
  - 'Suggestion: a log color scale, which the Notes suggest, would separate the fringe
    bins (counts 1 to about 40) that currently share nearly the same green.'
  - 'Suggestion: a few intermediate colorbar labels between 1 and 306 would make individual
    bin counts easier to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white; 3200x1800 canvas with the chart centered.
      Chrome: title "histogram-2d · python · altair · anyplot.ai" in dark ink, centered; axis titles "Variable X" / "Variable Y" bold dark; tick labels -4.0..4.0 (x) and -3.5..4.5 (y) in soft dark ink; thin soft-ink frame around the view; colorbar box on #FFFDF6 titled "Count" with labels 1 and 306. All text readable.
      Data: a 24-bin-per-axis grid of rectangles (0.5 wide) forming a tilted ellipse from lower left to upper right; fringe bins in brand green #009E73, shading through teal to blue #4467A3 at the dense core near (0, 0); two isolated outlier bins at the top right. No interior holes; empty bins outside the ellipse are left blank.
      Legibility verdict: PASS

