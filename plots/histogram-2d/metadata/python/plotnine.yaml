review:
  strengths:
  - 'Uses the Imprint sequential ramp (#009E73 to #4467A3) through scale_fill_gradient
    for the count fill, identical in both renders'
  - 'Theme-adaptive chrome threaded through every theme element: all text readable
    in both renders'
  - Native geom_bin2d does the binning; the 28-bin grid shows the tilted correlated
    cloud while the dense core reads as a gradient
  - Column constants double as axis titles, so plotnine labels the axes from the data
    without a labs() override
  weaknesses:
  - 'VQ-05 (both): the colorbar title ''Count'' sits flush against the legend frame''s
    top-left corner with no padding, crowding the frame → leave at least ~4 px of
    padding between the title and the frame (or drop the frame). Likely cause: legend_background=element_rect(...,
    color=INK_SOFT) drawn with plotnine''s default zero legend margin; add legend_margin
    or legend_box_margin.'
  - 'Suggestion: marginal 1D histograms on the top and right edges, as the Notes allow,
    would add univariate context.'
  - 'Suggestion: a log-scaled fill (trans=''log10'') would separate the many low-count
    fringe bins that now share nearly the same green.'
