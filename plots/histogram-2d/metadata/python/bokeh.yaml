review:
  strengths:
  - 'Counts mapped with the Imprint sequential ramp (#009E73 -> #4467A3) through a
    LinearColorMapper, identical in both renders'
  - Empty bins drawn transparent via nan_color and the mapper starting at 1, so every
    occupied bin reads clearly against both page colours
  - Colour bar fully themed (page background, INK title, INK_SOFT labels and ticks)
    and titled 'Count per bin'
  - Exact 3200x1800 canvas with explicit min_border reservations; all text sized and
    readable in both themes
  - HoverTool reports each bin's count from the image glyph in the interactive HTML
  weaknesses:
  - 'Suggestion: drop missing values row-wise (df.dropna(subset=[TECH, COMMODITY]))
    before np.histogram2d, so x and y stay paired when a user''s table has gaps.'
  - 'Suggestion: keep a small pan/wheel-zoom/reset toolset for the HTML (toolbar_location=None
    already keeps it out of the PNG) so readers can zoom into the dense core.'
  - 'Suggestion: a log colour scale (LogColorMapper), which the Notes allow, would
    separate the many 1–5 count fringe bins that now share nearly the same green.'
