review:
  strengths:
  - Native geom_bin2d computes the 25x25 binning; the bin count shows the positive
    tilt as a smooth gradient without salt-and-pepper noise
  - 'Imprint sequential ramp (#009E73 -> #4467A3) for the count, identical in both
    themes, with low-count bins clearly visible on both pages'
  - Column constants drive the axis titles directly ('Customer age (years)', 'Annual
    spending ($k)') and the colorbar reads 'Customers (count)'
  - Theme tokens thread through every chrome element; all text readable in both themes
    on the canonical 3200x1800 canvas
  - HTML export keeps lets-plot's native hover tooltips for per-bin counts
  weaknesses:
  - 'Suggestion: a log-scaled fill (trans="log10"), which the Notes suggest, would
    spread the many 1-5 count fringe bins across more of the green-to-blue ramp.'
  - 'Suggestion: optional marginal histograms on the top and right edges would add
    univariate context.'
