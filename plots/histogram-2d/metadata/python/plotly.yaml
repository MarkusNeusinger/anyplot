review:
  strengths:
  - Native go.Histogram2d binning with make_subplots shared axes for top and right
    marginals that sit over the bins they summarize
  - Gap-free heatmap with the color bar sized to the heatmap panel and titled Count
  - 'Theme-token chrome readable in both renders; marginals in brand green #009E73'
  - Neutral, plausible customer age vs annual purchases scenario with descriptive
    axis titles
  weaknesses:
  - 'VQ-07 (both): the heatmap uses the Viridis colorscale, outside the allowed imprint_seq/imprint_div
    → imprint_seq [[0, ''#009E73''], [1, ''#4467A3'']]. Likely cause: go.Histogram2d(colorscale=''Viridis'').'
  - 'VQ-05 (both): canvas is 4800×2700, not a canonical size → 3200×1800 (−1600 ×
    −900). Likely cause: write_image(width=1600, height=900, scale=3) instead of width=800,
    height=450, scale=4.'
  - 'SC-04 (both): title ''histogram-2d · plotly · anyplot.ai'' omits the language
    segment → ''histogram-2d · python · plotly · anyplot.ai''. Likely cause: the title
    text string.'
  - 'DQ-03 (both): np.clip pushes every out-of-range draw onto the boundary, creating
    artificial pile-ups in the first age bin at 18 and the first purchases bin at
    0 in both marginals → no boundary spike; draw from a distribution that respects
    the bounds instead of clipping. Likely cause: np.clip(data[:, 0], 18, 85) and
    np.clip(data[:, 1], 0, 80).'
  - 'Suggestion: slightly narrower marginal panels (0.2 → ~0.15) would give the heatmap
    more room.'
