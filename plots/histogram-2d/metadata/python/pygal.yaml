review:
  strengths:
  - Counts colored along the theme's imprint_seq field stops, so the dense core reads
    dark purple on the light page and pale lavender on the dark page, with low-count
    bins clearly off the page in both
  - Correlated bivariate normal (rho = 0.5) makes the positive stock-bond tilt visible
    across the heatmap
  - Top and right marginal histograms sit bin-for-bin over the heatmap columns and
    rows
  - Gapless tiling via zero series margins with page-colored seams; empty fringe bins
    drawn blank with a faint outline
  - Per-value pygal style and label dicts give each bin its color and an 'N days'
    tooltip in the HTML
  - 'Straight-line script: np.histogram2d binning, one Style, no classes'
  weaknesses:
  - 'Suggestion: the 64 colorbar segments show thin seams between them; fewer segments
    or a single gradient rect would read as a smooth bar.'
  - 'Suggestion: x-axis ticks fall on bin edges at -3.8, -2.3, -0.8 …; round return
    values would be quicker to read.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold title 'histogram-2d · python · pygal · anyplot.ai' centered top; y-axis 'Bond market daily return (%)' with bin-center ticks -1.23 … 1.16; x-axis 'Stock market daily return (%)' with ticks -3.8 … 3.7; colorbar header 'Days' with ticks 0/11/22/33/44 — all dark text, readable.
      Data: 20x20 gapless heatmap; counts run mint #66E2B2 -> #009E73 -> navy -> dark purple at the peak near (0.1, 0.15); empty fringe bins blank with a faint outline; a visible positive tilt. Top and right marginal histograms in #009E73 aligned with the columns and rows.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, ticks and colorbar labels in light ink; no dark-on-dark text.
      Data: same bins and marginals; the continuous ramp uses the dark field stops (olive #404C02 -> #009E73 -> lavender #CDD9FF), so the low-count bins stay visible on the page and the core reads brightest. Marginals keep #009E73, identical to the light render.
      Legibility verdict: PASS
