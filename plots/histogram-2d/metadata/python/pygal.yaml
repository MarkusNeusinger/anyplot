review:
  strengths:
  - 'Heatmap built from pygal chart classes: a gapless HorizontalStackedBar whose
    per-value style dicts color each bin, with per-bin tooltip labels ("N days")'
  - 'Imprint sequential ramp #009E73 -> #4467A3 with a matching segmented colorbar
    labelled Days; empty bins left blank with a faint outline, readable in both themes'
  - Top and right marginal histograms share the heatmap's bins and sit exactly over
    the rows and columns they summarize
  - 'Theme tokens threaded through one Style factory; all chrome flips correctly between
    #FAF8F1 and #1A1A17'
  weaknesses:
  - 'DQ-01 (both): the shared factor adds covariance of only about 0.002, so the stock-bond
    correlation is about r = 0.005 and the joint distribution shows no tilt, though
    the spec''s example is a correlated bivariate normal → a visible correlation (about
    r = 0.4-0.6). Likely cause: common_factor sd 0.15 scaled by 0.5 and 0.2 against
    independent noise of sd 1.2 and 0.4; draw x and y from rng.multivariate_normal
    with a correlation term.'
  - 'CQ-01 (code): five helper functions (ramp, cell_style, axis_ticks, make_style,
    inner) and two classes split a linear script → inline them as straight-line code
    (a comprehension for the ramp, one Style object). Likely cause: helper-based composition
    of the four pygal charts.'
  - 'CQ-04 (code): class TiledStackedBar is defined and never used → delete it. Likely
    cause: a vertical-bar variant left over from an earlier layout.'
  - 'Suggestion: the 64 colorbar segments show thin seams between them; fewer segments
    or a pygal-free gradient rect would read as a smooth bar.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas
