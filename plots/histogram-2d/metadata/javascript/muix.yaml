review:
  strengths:
  - Composes the chart from ChartsDataProvider, ChartsWrapper and ChartsSurface, with
    a custom mark layer that reads useXScale, useYScale and useZColorScale, so the
    bins sit exactly in data coordinates and use the library's own z-axis color map.
  - The zAxis continuous colorMap uses the Imprint imprint_seq stops on log counts
    and is paired with the native ContinuousColorLegend. The color bar labels its
    ends in back-transformed counts (1 and 196) and has a title naming the log scale.
  - The bins tile a regular grid with no gaps. Bin strokes match their fills, so no
    seams show, and empty fringe bins show the page in both themes.
  - 'The data is realistic: 8,000 seeded, correlated daily fund returns (rho = 0.65,
    sample r = 0.64), with volatilities that fit the domain.'
  - Theme tokens drive all the chrome. Both renders are fully legible, and the data
    colors are identical in both.
  weaknesses:
  - 'SC-04 (both): the title reads "Correlated Fund Returns ·histogram-2d · …". It
    is missing the space after the first separator → "Correlated Fund Returns · histogram-2d
    · javascript · muix · anyplot.ai". Likely cause: the TITLE string literal.'
  - 'Suggestion: one or two intermediate count ticks on the log color bar (for example
    10 and 50) would make the mid-range colors easier to read.'
  - 'Suggestion: optional marginal histograms on the top and right edges would add
    univariate context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1
      Chrome: bold dark title "Correlated Fund Returns ·histogram-2d · javascript · muix · anyplot.ai" with a muted subtitle (n = 8,000 · 26 × 18 bins · Pearson r = 0.64). Axis titles carry units (%), tick labels in soft ink, L-shaped axes, no grid. A horizontal color bar at the bottom center is titled "Points per bin (log scale)" with end labels 1 and 196. All text is readable.
      Data: a 26x18 grid of rectangular bins with no gaps, from brand green #009E73 (low count) to blue #4467A3 (196 points) in the core of the tilted elliptical cloud. Empty bins are blank.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17
      Chrome: title, subtitle, axis titles, ticks and color-bar labels render in light ink. No text is dark on dark.
      Data: bin colors and color-bar gradient are identical to the light render. Low-count green bins stand out clearly from the page.
      Legibility verdict: PASS
