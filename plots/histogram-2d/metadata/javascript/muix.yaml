review:
  strengths:
  - 'Genuine binning implementation: raw points are aggregated into per-cell counts
    (a real 2D histogram), not a disguised scatter plot'
  - Custom rectangular marker via the documented `slots.scatter` override matches
    the established codebase convention for MUI X heatmaps (same pattern as hexbin-basic)
  - Continuous Imprint sequential palette (t.seq) is applied correctly and is pixel-identical
    between light and dark renders; only chrome flips
  - Canvas is exactly 3200x1800 with no clipped text in either render, and the title
    follows the `{Descriptive Title} · {spec-id} · {language} · {library} · anyplot.ai`
    convention
  - Deterministic seeded data generation (mulberry32, seed=42) produces a realistic,
    neutral bivariate-correlated dataset (correlated daily stock returns)
  weaknesses:
  - Colorbar labels are inconsistently formatted — minLabel renders as a bare '0'
    while maxLabel renders as '196 points'; make both consistent (either both bare
    numbers or both suffixed with 'points')
  - Overall aesthetic is fairly plain beyond the palette and disabled gridlines —
    no additional visual refinement (e.g. legend swatch styling, extra breathing room)
    to lift Design Excellence
  - The optional marginal 1D histograms mentioned in the spec notes are not included;
    adding them on the top/right edges would strengthen univariate context and Library
    Mastery
  - The bottom-right colorbar leaves a large empty gutter to its left under the chart;
    centering it or extending its length would balance the layout better
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Correlated Stock Returns · histogram-2d · javascript · muix · anyplot.ai" in dark ink, centered, fully visible. Axis titles "Stock A Daily Return (%)" / "Stock B Daily Return (%)" and tick labels render in dark/soft-dark ink, all clearly legible. Colorbar legend at bottom-right with "0" and "196 points" labels, readable.
      Data: Rectangular density bins forming a diagonal elongated cloud consistent with positively correlated bivariate data. Colors run from Imprint brand green (#009E73, low count) through teal to a darker blue (high count) at the density peak near the center. Sparse edge bins are correctly omitted, leaving background showing through.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title now in light/white ink, fully visible against the dark background. Axis titles and tick labels render in light ink, all clearly legible. No dark-on-dark failures observed. Colorbar legend labels readable in light text.
      Data: Same green-to-blue density gradient and identical bin geometry as the light render — confirms data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS
