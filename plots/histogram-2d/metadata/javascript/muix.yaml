review:
  strengths:
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + ChartsWrapper + ChartsSurface,
    with the bins drawn as a custom mark that reads useXScale/useYScale/useZColorScale,
    so the bins share the axes'' data coordinates exactly'
  - The zAxis continuous colorMap built from the Imprint sequential stops (t.seq)
    drives both the bins and the native ContinuousColorLegend, whose endpoint labels
    are exp-formatted back to real counts (1 and 196)
  - Log color scale as the Notes suggest, with the color bar titled 'Points per bin
    (log scale)', so the steep fall-off from the core to the tails stays readable
  - A 26 × 18 regular grid tiles without gaps (the fill-matched 0.5 px stroke removes
    anti-alias seams); the dense core reads as a smooth gradient and the 0.64 tilt
    shows clearly
  - 'Lowest-count bins in brand green #009E73 stay clearly separate from both #FAF8F1
    and #1A1A17, and empty fringe bins are left transparent'
  - Theme-correct chrome in both renders, explicit font sizes (22/16/15/14 px), and
    a subtitle that reports the computed n, bin grid and Pearson r
  - Deterministic, seeded data generation and clean data/plot zones keyed by the X/Y
    role constants
  weaknesses:
  - 'DQ-02 (both): the axes are labelled ''Stock A Daily Return (%)'' and ''Stock
    B Daily Return (%)'', which read as placeholders → descriptive, fictional-but-concrete
    series names (e.g. ''Tech Sector Fund Daily Return (%)'' and ''Semiconductor Fund
    Daily Return (%)''), with no real tickers. Likely cause: the X and Y column constants.'
  - 'Suggestion: the color bar labels only its endpoints (1 and 196); a few intermediate
    log ticks (e.g. 3, 10, 30, 100) would let readers read off counts for the middle
    of the ramp.'
  - 'Suggestion: x-axis ticks carry one decimal (−5.0, 4.5) while y ticks are integers;
    matching the tick formats would make the two axes look more consistent.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: bold dark title "Correlated Stock Returns · histogram-2d · javascript · muix · anyplot.ai" centred at the top (~73% of the width), with a soft-ink subtitle "n = 8,000 · 26 × 18 bins · Pearson r = 0.64" below it. Y-axis title "Stock B Daily Return (%)" is rotated on the left, with ticks −7 to 5; x-axis title "Stock A Daily Return (%)" sits below ticks −5.0 to 4.5. Only the left and bottom axis lines are drawn, with no grid. A horizontal color bar at the bottom centre is titled "Points per bin (log scale)" and labelled 1 and 196. All text is dark and readable.
      Data: a 26 × 18 grid of rectangular bins forms a tilted ellipse rising from the lower left to the upper right. The tails are brand green #009E73 and the core shades through teal to blue (#4467A3), so the dense region reads as a smooth gradient. Empty fringe bins are transparent, and a few isolated green bins sit at the edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: the title, subtitle, axis titles, ticks, axis lines and color-bar labels flip to light ink. No text renders dark on dark, and everything is clearly readable.
      Data: the bin colors are identical to the light render (green #009E73 tails to blue core). Brand green is clearly visible against the dark page, and empty bins show the page.
      Legibility verdict: PASS
