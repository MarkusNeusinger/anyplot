review:
  strengths:
  - 'Correct plot type: faithfully implements the 2D histogram-heatmap with optional
    marginal histograms on top and right for univariate context'
  - Clever sqrt-compressed color scale that matches exactly between the heatmap cells
    and the manually-built colorbar gradient stops, taming the long-tailed count distribution
    without hitting a log(0) singularity on sparse bins
  - Correct theme-adaptive chrome throughout; data colors (Imprint imprint_seq gradient,
    palette[0] marginal bars) are identical between light and dark renders, only chrome
    flips
  - 'Idiomatic D3 usage: data joins with .selectAll().data().join(''rect''), d3.scaleLinear/scaleSequential,
    d3.axisBottom/Left/Right modules, deterministic seeded RNG (mulberry32) for reproducible
    Box-Muller sampling'
  - Realistic, neutral finance scenario (tech vs. energy stock daily returns) with
    a plausible 0.65 correlation and sensible return magnitudes
  weaknesses:
  - 'Heatmap shows a pronounced ''swiss cheese'' pattern: with only 4000 points spread
    across a 36x36 bin grid (~1296 cells), many interior bins have zero count and
    render as bare background, breaking the smooth density impression the spec asks
    for. Fix by increasing N_POINTS (e.g. to 8000-10000) and/or reducing N_BINS to
    ~24-28 so the correlated cloud reads as a continuous density surface instead of
    a perforated one.'
  - The bin fragmentation caps overall visual polish (Design Excellence) even though
    the underlying technique (sqrt color compression, linked marginals) is sound —
    tightening the binning would raise this further.
  - Colorbar tick labels ('40/30/20/10') sit fairly close to the canvas' right edge
    (not clipped, but tight); a little extra right margin would give more breathing
    room.
  - Data storytelling is generic (color gradient + marginals only, no explicit annotation
    of the correlation) — optional given the spec doesn't require it, but a subtle
    callout would strengthen the focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "histogram-2d · javascript · d3 · anyplot.ai" is bold, dark, centered, well within canvas bounds. Axis titles "Tech Stock Daily Return (%)" and "Energy Stock Daily Return (%)" are dark and clearly readable. Tick labels on both axes and the colorbar are dark-grey and legible. "Point count" colorbar label is readable.
      Data: Main heatmap uses the Imprint imprint_seq gradient (brand green → blue) mapped via a sqrt-compressed scale, correctly matched to the colorbar gradient. Top and right marginal histograms are rendered in Imprint palette[0] (#009E73) green at 0.55 opacity. The joint density forms a diagonal, positively-correlated elliptical cloud with a dark-blue-shaded high-density core, fading to green at the edges. Multiple empty (background-colored) bins are visible throughout the periphery and scattered through parts of the interior, giving a "swiss cheese" texture rather than a fully smooth density gradient.
      Legibility verdict: PASS (all text is clearly readable against the light background; only the bin-fragmentation issue is a data/visual density concern, not a text-legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and axis titles render in light off-white text, clearly legible against the dark background. Tick labels (light grey) on both axes and colorbar are readable; no dark-on-dark text found anywhere (title, axis labels, ticks, colorbar label all correctly flipped to light ink).
      Data: Heatmap and marginal-histogram colors are visually identical to the light render (same green-to-blue gradient, same green marginal bars) — only the chrome (background, text, gridline/domain colors) flipped as expected. The same bin-fragmentation "swiss cheese" pattern is present, unchanged from the light render (a data-binning characteristic, not a theme issue).
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures observed; all chrome elements correctly theme-adapted).
