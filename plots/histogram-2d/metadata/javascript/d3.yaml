review:
  strengths:
  - 'Correct Imprint palette usage: sequential seq gradient for density, first-series
    green consistent with brand, both themes correctly adapt chrome while keeping
    data colors identical'
  - Optional spec feature (marginal 1D histograms on top/right) implemented, adding
    real univariate context
  - Thoughtful sqrt-compression of the count-to-color mapping to tame the long right
    tail without hitting a log(0) singularity on sparse bins, with a colorbar gradient
    generated by matching math so the legend stays truthful
  - Manual 2D binning correctly works around d3-array's 1D-only bin() limitation
  - Deterministic, seeded data generation; clean, idiomatic d3 code with no fake interactivity
  weaknesses:
  - Aesthetic polish is on the plain side for the amount of layout complexity present
    - consider subtle cell strokes or refined panel spacing to lift Design Excellence
  - The 8px gap between the top marginal histogram and the main heatmap panel is tight
    on a 3200px-wide canvas; a larger gap (e.g. 16-20px) would read cleaner
  - 'Marginal-histogram bars use opacity: 0.55, which makes the same underlying fill
    look visually different between light (mint) and dark (forest green) themes due
    to alpha compositing over different backgrounds - consider a flat, non-transparent
    fill (or a theme-derived alpha) for more consistent cross-theme appearance'
  - Colorbar label/tick text at 13px is the smallest text element in the chart; verify
    legibility when the plot is scaled down for mobile/thumbnail previews
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "histogram-2d · javascript · d3 · anyplot.ai" centered at top (~55-60% width); dark ink axis titles ("Tech Stock Daily Return (%)", "Energy Stock Daily Return (%)") and tick labels are all clearly readable.
      Data: Main heatmap uses the Imprint sequential scale (light mint-green -> teal -> deep blue) for bin density; first-series green matches #009E73. Top and right marginal histograms rendered in light mint-green at opacity 0.55. Colorbar on the right labeled "Point count" with ticks 0/50/100/150.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis titles, tick labels, and colorbar text all flipped to light ink and are clearly readable against the dark background. No dark-on-dark failures observed.
      Data: Main heatmap cell colors are identical to the light render (same fill values, sqrt-compressed Imprint seq gradient). Marginal-histogram bars use the same base color but appear as a darker forest-green due to alpha (0.55) compositing over the darker page background — an alpha-blend artifact, not a change in the underlying data-color value.
      Legibility verdict: PASS
