review:
  strengths:
  - 'Interior "checkerboard holes" issue from attempt 1 substantially resolved: tripling
    SAMPLE_SIZE (6000 -> 16000) and reducing BIN_COUNT (28 -> 20) produced a much
    more contiguous, solid density cloud in both renders'
  - Added a correlation-callout subtitle ("Older customers purchase more often --
    sample correlation r = 0.50") that gives the chart a clear narrative focal point
    (DE-03)
  - Custom tooltip formatter surfaces the bin's age/purchase-frequency/count for the
    interactive HTML output, and ink-colored hover emphasis adds a touch of ECharts-specific
    polish beyond the plain heatmap
  - Theme-adaptive chrome, Imprint imprint_seq colormap, and the mandated title format
    are all correct and consistent across both light and dark renders
  - Clean, deterministic, KISS-structured code (fixed-seed LCG, no unused imports,
    correct mount-node/animation:false contract)
  weaknesses:
  - A handful of isolated zero-count bins still puncture the density cloud (e.g. near
    the top of the populated region and a couple near the tails) -- much improved
    from attempt 1's checkerboard but not fully eliminated; consider flooring near-zero
    bins at a minimum visible shade, or further tuning BIN_COUNT/SAMPLE_SIZE, for
    a fully smooth surface
  - 'Library Mastery is still fairly generic for ECharts: heatmap + continuous visualMap
    + a tooltip formatter is an improvement but doesn''t showcase distinctive ECharts
    capabilities (e.g. dataZoom to explore the dense center, roam/zoom, or brush selection)
    that would add real value in the interactive HTML view'
  - 'Design Excellence remains at ''well-configured, not exceptional'': the new subtitle
    adds a narrative touch, but the visualMap legend and overall composition are still
    close to library defaults; more visual hierarchy (e.g. emphasizing the densest
    cluster) would elevate the polish further'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark.
      Chrome: Title "histogram-2d · javascript · echarts · anyplot.ai" is bold dark text, centered, fully readable, with a soft-gray subtitle below it ("Older customers purchase more often — sample correlation r = 0.50") that is also fully legible. X-axis label "Customer Age (years)" and Y-axis label "Purchases per Year" are dark ink, clearly legible and similar in size. Tick labels (19/31/42/53/65 on X; 0.5/4.1/7.6/11.2/14.8 on Y, interval-skipped to avoid crowding) are soft gray and fully legible. The "Point count" visualMap legend on the right (0-370) is small but legible gray text with clear spacing from the heatmap.
      Data: A dense, mostly contiguous cloud of square heatmap cells spans diagonally from lower-left to upper-right, colored on the Imprint imprint_seq scale — brand green (#009E73) for low counts fading to blue (~#4467A3) for the densest bins near the center-right. A few small zero-count gaps remain within the cloud (bare cream background), but the cloud reads as a solid density surface overall, a clear improvement over the scattered holes of the previous attempt.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light.
      Chrome: Title, subtitle, axis labels, and tick labels have all flipped to light/off-white tones and remain fully readable against the dark background — no dark-on-dark failures observed anywhere. The visualMap legend text is likewise light and legible.
      Data: The same diagonal heatmap cloud appears with identical green-to-blue data colors and identical cell positions as the light render, confirming Imprint palette and layout consistency across themes. The same small handful of zero-count gaps appear as near-black squares, slightly better hidden against the dark background than in light mode.
      Legibility verdict: PASS — all title/subtitle/axis/tick text is clearly readable in the dark theme; no dark-on-dark issues found.
