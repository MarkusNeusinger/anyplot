review:
  strengths:
  - Correct plot type (2D histogram rendered as an ECharts heatmap) with the density
    colormap correctly built from Imprint's imprint_seq (brand green -> blue), matching
    the single-polarity nature of a count/density metric
  - Title matches the mandated format exactly ('histogram-2d · javascript · echarts
    · anyplot.ai'), and axis labels ('Customer Age (years)', 'Purchases per Year')
    are descriptive with units
  - Theme-adaptive chrome is fully correct in both renders — title, axis labels, tick
    labels, and the visualMap legend text all use theme tokens and remain legible
    on both the cream and near-black backgrounds
  - Realistic, neutral business scenario (customer age vs. purchase frequency) drawn
    directly from the spec's own 'Applications' list, with a plausible positive correlation
    and sensible value ranges (ages 18–75, 0–17 purchases/year)
  - Deterministic LCG-seeded data generation and clean, KISS-structured code with
    no functions/classes and no fake interactivity
  weaknesses:
  - Zero-count bins render as bare background rather than the lowest sequential color,
    producing a scattered 'checkerboard' of holes inside the populated region — most
    visible in the light render where cream squares punch through the green/blue cloud;
    consider flooring rendered bins at a minimum visible shade, lowering BIN_COUNT
    slightly, or increasing SAMPLE_SIZE so fewer bins fall to zero, for a smoother
    density surface
  - 'Design Excellence is only at the ''well-configured default'' level: no subtitle
    or annotation calls out the correlation strength/trend, and the visualMap legend
    is plain — add a touch of visual hierarchy (e.g. a subtle note on the correlation,
    or emphasis on the densest region) to elevate storytelling (DE-03)'
  - 'Library Mastery is generic for ECharts: only ''heatmap'' + a continuous visualMap
    are used, nothing distinctive to ECharts (e.g. tooltip formatter surfacing bin
    counts, dataZoom for exploring the dense center, or roam) — since this is an interactive
    library, adding a tooltip formatter would add real value to the HTML output without
    hurting the static PNG'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark.
      Chrome: Title "histogram-2d · javascript · echarts · anyplot.ai" is bold dark text, centered, fully readable. X-axis label "Customer Age (years)" and Y-axis label "Purchases per Year" are dark ink, clearly legible and similar in size. Tick labels (19/27/35/.../67 on X; 0.3/2.9/.../15.7 on Y) are soft gray, legible, and spaced without overlap (interval=3 skip avoids crowding). The "Point count" visualMap legend on the right (with 71/0 endpoints) is small but legible gray text.
      Data: A diagonal cloud of square heatmap cells spans from lower-left to upper-right, colored on the Imprint imprint_seq scale — brand green (#009E73) for low counts fading to blue (~#4467A3) for the densest bins near the center. Several bins within the cloud show 0 count and appear as bare cream background, creating a mild checkerboard/hole pattern inside the data region.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light/white tones and remain fully readable against the dark background — no dark-on-dark failures observed. The visualMap legend text is likewise light and legible.
      Data: The same diagonal heatmap cloud appears with identical green-to-blue data colors as the light render (positions unchanged) — confirming Imprint palette consistency across themes. The zero-count "holes" inside the cloud now appear as near-black squares, blending more with the background than in the light render but still visible as gaps in the density surface.
      Legibility verdict: PASS — all title/axis/tick text is clearly readable in the dark theme; no dark-on-dark issues found.
