review:
  strengths:
  - Correctly works around the missing heatmap/colorAxis modules by rendering the
    2D histogram as a scatter series with square markers colored per-point on a log1p-scaled
    Imprint sequential ramp — exactly the fallback the library prompt calls for.
  - Custom colorbar built with the core SVGRenderer (gradient rect + text) is a creative,
    idiomatic use of Highcharts' lower-level API given no colorAxis module is available.
  - Realistic, business-neutral financial-returns scenario (correlated daily asset
    returns, rho=0.65, n=4,000) with a log-scaled color mapping that directly matches
    the spec's own recommendation for skewed density data.
  - Theme-adaptive chrome is threaded consistently through title, subtitle, axes,
    tooltip, and the custom colorbar; data colors (green-to-blue sequential) are identical
    between light and dark renders.
  - Deterministic seeded LCG produces reproducible data with no external RNG dependency.
  weaknesses:
  - The custom colorbar renders as a plain linear gradient labeled only with the two
    endpoints ('1' at the bottom, the max count e.g. '80' at the top), but colorForCount()
    maps data to color via a log1p ratio. A reader will assume the bar is linear (count=40
    sits at the vertical midpoint), when the true log-scaled position for count=40
    sits much closer to the top. Add 2-3 intermediate tick labels at their real (log-spaced)
    count values, or otherwise indicate the scale is logarithmic, so the colorbar
    communicates the mapping it actually uses.
  - Optional marginal 1D histograms on the top/right edges (explicitly called out
    as optional in the spec) are not implemented — would strengthen univariate context
    but is not required.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-2d · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Simulated daily returns · rho ~ 0.65 · n = 4,000" in softer gray beneath it. Axis titles "Asset A Daily Return (%)" / "Asset B Daily Return (%)" and tick labels (-10..10) render in dark/soft-dark text, all clearly legible against the light surface. Subtle light-gray gridlines at 0/±5/±10. Custom colorbar top-right labeled "Count", with "80" near the top and "1" near the bottom, rendered in soft-dark text.
      Data: A diagonal, elongated cluster of square bins running from bottom-left to top-right (reflecting the positive rho ≈ 0.65 correlation), colored on a green-to-blue sequential ramp — brand green (#009E73) for the sparsest bins (count=1), shifting toward blue for the densest bins near the center. No red/green-only encoding.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis titles/tick labels now rendered in light ink/soft-light gray, fully legible against the dark surface. Gridlines are faint light lines at the same reference values. Colorbar labels ("Count", "80", "1") also render in light-gray text, clearly visible against the dark background — no dark-on-dark failures observed.
      Data: Identical diagonal density cluster and identical green-to-blue color mapping as the light render — data colors are unchanged between themes, confirming only chrome flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark text found.
