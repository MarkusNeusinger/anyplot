review:
  strengths:
  - Chart.js has no native 2D-histogram/heatmap chart type, and the implementation
    solves this cleanly via the public plugin API (afterDatasetsDraw + afterDraw hooks
    on a near-invisible scatter chart) instead of reaching for an unpinned community
    plugin like chartjs-chart-matrix — exactly the intended 'no workarounds' pattern
    from the library rules.
  - Custom hand-rolled colorbar (linear gradient + min/max labels + rotated axis title)
    is well integrated into the layout via reserved right-side padding, so it never
    collides with the plot area.
  - 'Density coloring correctly uses imprint_seq (#009E73 -> #4467A3) with a log1p
    scale, appropriate for the widely-varying bin counts, and the palette is pixel-identical
    between light and dark renders — only chrome (background, ink, grid) adapts.'
  - Deterministic LCG-seeded data generation (seed 42) produces a realistic correlated
    bivariate return distribution (rho=0.65) with plausible daily-return magnitudes.
  - Theme-adaptive chrome is threaded consistently through title, axis labels, ticks,
    and the custom-drawn colorbar text/border (t.ink / t.inkSoft / t.grid), and both
    renders pass the light/dark legibility check with no dark-on-dark or light-on-light
    failures.
  - Title matches the mandated format exactly, and the single-series legend is correctly
    omitted since the colorbar already encodes the data dimension.
  weaknesses:
  - Title fontsize (22px) leaves the mandated title occupying only ~30% of canvas
    width instead of the ~70-85% that's typical/expected for this title length — not
    a legibility problem, but a slightly under-scaled visual anchor; consider bumping
    title font-size a few px for better hierarchy.
  - Binning with N_BINS=26 over a correlated elliptical distribution leaves several
    isolated empty (white) cells inside the occupied density region, giving a mild
    'swiss cheese' look rather than a smooth density field — a slightly coarser or
    finer bin count, or a minimum-count threshold merge, would read cleaner.
  - The colorbar only labels its two endpoints (0 and max count); one or two intermediate
    tick labels would make the density scale easier to read at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "histogram-2d · javascript · chartjs · anyplot.ai" is bold dark text, fully visible and not clipped. Axis titles "Asset A Daily Return (%)" and "Asset B Daily Return (%)" are dark ink, clearly readable. Tick labels are soft gray, legible against the light background. No axis grid is drawn (grid disabled), which reads clean for this dense heatmap.
      Data: A diagonal elliptical density cloud of colored square bins running from bottom-left to top-right, consistent with positively correlated returns. Colors run from brand green (#009E73, low density) to blue (#4467A3, high density), concentrated in the center of the cloud. A custom-drawn colorbar sits to the right of the plot with a green-to-blue gradient, "0" and "114" endpoint labels, and a rotated "Point count" axis title.
      Legibility verdict: PASS — all text (title, axis titles, tick labels, colorbar labels) is clearly readable against the light background with no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels have flipped to light-colored text (ink/ink-soft tokens), still clearly legible. The colorbar border and text also flipped to light tones against the dark background.
      Data: The same diagonal elliptical cloud of green-to-blue bins, colors visually identical to the light render (brand green low density, blue high density) — confirming only chrome flipped, not data colors. The gradient bar's green-to-blue fill is unchanged from the light render.
      Legibility verdict: PASS — no dark-on-dark failures; title, axis labels, tick labels, and colorbar text are all clearly visible light-colored text against the dark surface.
