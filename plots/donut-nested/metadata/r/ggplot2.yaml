review:
  strengths:
  - Consistent color families per parent business unit — each parent's children are
    tinted from the same base hue via colour_ramp(), directly satisfying the spec's
    'same hue, varying lightness' requirement
  - 'Clear data-driven hierarchy: parent segments carry bold, larger percentage labels
    while children use smaller regular labels, giving the chart an immediate focal
    point without extra annotation'
  - Ring segments are aligned by cumulative sum so child wedges line up precisely
    with their parent wedge, with a radial gap plus background-colored stroke separating
    the two rings cleanly
  - Legend built for below-threshold children via an invisible geom_point + scale_color_manual/override.aes
    trick — a genuinely idiomatic ggplot2 solution to a problem the library has no
    native shortcut for
  - 'Both light and dark renders are fully theme-correct: warm off-white/near-black
    backgrounds, all chrome readable, and Imprint data colors identical across themes'
  weaknesses:
  - 'Label/data overlap: the ''State/Local'' child label (Public Sector ring, upper-left)
    is partially covered by the SMB ring segment above it — the trailing ''l'' is
    obscured behind the ochre wedge. Labels near the 12 o''clock position are horizontally
    centered rather than angle-aware, so part of the text swings back over the ring;
    nudge CHILD_LABEL_X outward or angle-adjust labels near the top of the circle.'
  - Legend entries render as bare child names ('Europe', 'Latin America') even though
    the source builds legend_label = paste(level_1, level_2, sep = ' · '), which should
    produce 'SMB · Europe' / 'Consumer · Latin America'. Either the reviewed PNGs
    are stale relative to this commit or the prefix is being dropped at render time
    — re-generate the images from this exact script to confirm, since a bare 'Europe'
    legend entry is ambiguous against the already-labeled Enterprise-Europe wedge
    on the same chart.
  - 'Vertical whitespace is unbalanced: the gap between the title and the top of the
    donut is noticeably larger than the gap between the ring and the legend below
    it — tightening the top margin would let the donut read as more centered and use
    the canvas more confidently.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Revenue by Business Unit · donut-nested · r · ggplot2 · anyplot.ai" in dark ink, clearly visible at top-left. Parent-ring labels (e.g. "Enterprise 34%") are bold dark ink; child-ring labels (e.g. "North America") are lighter gray-brown, both fully readable against the light background. Legend box "Smaller segments" at bottom has a thin dark border with legible dark text and two color swatches labeled "Europe" and "Latin America".
      Data: Nested donut — inner ring shows 4 parent business units (Enterprise green #009E73, Consumer lavender, Public Sector blue, SMB ochre), outer ring shows regional children in lighter tints of the same parent hue. First categorical series (Enterprise, largest share) is confirmed #009E73. Segments are separated by thin cream-colored strokes matching the page background.
      Legibility verdict: PASS, with one localized defect — the "State/Local" child label (upper-left, Public Sector ring) has its trailing characters partially covered by the adjacent SMB ring segment, a text/data overlap rather than a legibility-against-background failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light cream/off-white ink, clearly legible against the dark background. Parent labels are bold light text, child labels are lighter gray, both readable — no dark-on-dark failures observed. Legend box uses an elevated dark fill (#242420-like) with a lighter border and light text, fully legible. Ring separator strokes switch from cream to near-black, still providing clean segment separation.
      Data: Colors are identical to the light render — Enterprise green #009E73, Consumer lavender, Public Sector blue, SMB ochre, with the same lightness-tinted children per parent family. No hue or saturation drift between themes.
      Legibility verdict: PASS. Same "State/Local" label/ring overlap present as in the light render (a data-layout issue, not a theme-adaptation issue) — no additional dark-mode-specific problems.
