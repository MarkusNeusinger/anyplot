review:
  strengths:
  - 'Correct nested-donut idiom: geom_rect + coord_polar + scale_fill_identity — ggplot2
    has no native donut/pie geom, and this is the standard, accepted way to build
    one.'
  - 'Faithfully implements every spec note: same-hue color families per parent tinted
    via colour_ramp(), cumulative sums keep parent/child ring boundaries angularly
    aligned, threshold-based direct labeling (>=6% of total) with legend fallback
    for smaller slices, deliberate radial gap between rings, and hierarchy limited
    to 2 levels.'
  - Clever dummy-legend technique (invisible geom_point + scale_color_manual + guide_legend
    override.aes) surfaces a real legend even though the fill channel is driven by
    scale_fill_identity.
  - 'Correct Imprint palette application: parents ordered by descending total value
    so the largest (Enterprise) gets #009E73, remaining parents follow canonical order;
    data colors are identical between light/dark, only chrome (background, ink, legend
    box) flips.'
  - Clean theme-adaptive chrome tokens (PAGE_BG/INK/INK_SOFT/ELEVATED_BG), square
    2400x2400 canvas is the right choice for a circular chart, correct ggsave/ragg
    device usage.
  weaknesses:
  - The bold 'Public Sector' parent label sits very close to the 'Federal' child label
    directly beneath it in both renders (Public Sector only has 2 children, so its
    arc/labels are compressed) — increase the vertical/radial offset between PARENT_LABEL_X
    and CHILD_LABEL_X, or nudge label y-positions, for parents with few children.
  - Legend entry 'Europe' (SMB's small Europe slice) shares its text with the directly-labeled
    'Europe' segments on the Enterprise and Consumer rings — a reader matching the
    legend swatch to a wedge could pick the wrong one. Qualify small-segment legend
    labels with their parent category, e.g. 'SMB - Europe', to disambiguate.
  - tint_family() is a small custom helper function — acceptable given it's a legitimate
    color-ramp utility, but purists would inline it for stricter KISS compliance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches spec.
      Chrome: Title "Revenue by Business Unit · donut-nested · r · ggplot2 · anyplot.ai" in dark ink, top-left, fully legible. Bold parent labels (Enterprise 34%, Consumer 33%, Public Sector 18%, SMB 15%) in near-black ink; thinner child labels (North America, Europe, Asia-Pacific, Federal, State/Local) in a softer gray. Legend box "Smaller segments" bottom-center with a light border and slightly elevated off-white background, containing "Europe" (tan swatch) and "Latin America" (lavender swatch).
      Data: Two concentric rings around a hollow center. Inner ring = 4 parent business units (Enterprise=green, Consumer=lavender/purple, Public Sector=navy blue, SMB=ochre/tan); outer ring = regional children, each a lighter tint of its parent's hue, separated by thin off-white strokes. First (largest) series Enterprise correctly uses #009E73.
      Legibility verdict: PASS. All chrome text reads clearly against the light background. One minor spacing concern: the bold "Public Sector" label sits very close to the "Federal" child label directly below it (not full overlap, but tight) — flagged as a weakness.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches spec.
      Chrome: Same title now in light ink, fully legible against the dark background. Parent labels in bright off-white, child labels in a lighter warm gray — both clearly readable, no dark-on-dark failures observed. Legend box now uses the darker elevated background with a visible border; legend text is light and readable.
      Data: Ring colors are pixel-identical to the light render — Enterprise green, Consumer lavender, Public Sector blue, SMB ochre, with matching lighter tints on the outer ring — only the chrome (background, ink colors, stroke color between segments, legend box) flipped to dark-theme tokens, as required.
      Legibility verdict: PASS. No dark-on-dark or light-on-light issues. Same "Public Sector"/"Federal" label tightness observed as in the light render.
