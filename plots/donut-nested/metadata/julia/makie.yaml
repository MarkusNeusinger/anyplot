review:
  strengths:
  - Same-hue, varying-lightness color families for each department's child segments
    — directly implements the spec's core styling note and makes parent-child membership
    legible at a glance without a legend lookup
  - Outer-ring boundaries are computed from the exact same cumulative math as the
    inner ring, so child wedges align precisely under their parent wedge with no drift
  - Per-wedge text color is chosen from each wedge's own HSL lightness (not from the
    theme), guaranteeing readable contrast on every segment regardless of how light
    or dark that hue-family variant is
  - Threshold-based split between direct in-wedge labels (>=6% share) and a compact
    legend for smaller slices keeps the chart uncluttered while still labeling everything
  - Center 'Total $1365K' callout adds a genuinely useful summary value that a plain
    nested donut would lack
  - Theme-adaptive chrome (background, ink, stroke colors) is correctly wired to ANYPLOT_THEME,
    while all Imprint data colors stay pixel-identical between light and dark renders
  - First categorical series (Engineering) correctly uses Imprint position 1 (#009E73
    brand green), with the remaining departments following canonical palette order
  weaknesses:
  - '`using Random; Random.seed!(42)` is inert — all data is hardcoded literals with
    no `rand()`/`randn()` call anywhere in the script, so the seed has no effect.
    Harmless but dead code; either use it for a data value or drop the import.'
  - The bottom legend groups child segments by color swatch only ('Tooling', 'Travel',
    'Utilities', ...) without restating which department each belongs to — a reader
    has to mentally match hue families back to the inner-ring labels rather than reading
    it directly off the legend.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "donut-nested · julia · makie · anyplot.ai" is bold dark ink, clearly visible at top. Inner-ring department labels (Engineering, Sales & Marketing, Operations, Customer Support) and outer-ring category labels (Salaries, Cloud Infra, Advertising, Events, Facilities, Staffing) are set in either white or near-black text depending on the wedge's own lightness, and all are legible. The center "Total / $1365K" callout is dark text on the off-white hole, clearly readable. The bottom legend ("Smaller expense categories": Tooling, Content, Travel, Logistics, Utilities, Software, Training) uses dark labels on the off-white background, all legible.
      Data: Four hue families (brand green for Engineering, lavender/purple for Sales & Marketing, blue for Operations, ochre/brown for Customer Support), each spanning a lightness gradient from the inner department wedge to its outer child wedges. First series (Engineering) is Imprint brand green #009E73.
      Legibility verdict: PASS — no light-on-light or illegible text found anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light/off-white ink, clearly visible against the dark background. All inner- and outer-ring wedge labels keep the same per-wedge light/dark text logic as the light render and remain legible (e.g. white text on the dark-green Salaries wedge, near-black text on the pale lavender Events wedge). Center "Total / $1365K" callout is light text on the near-black hole, clearly readable. Bottom legend text is light gray/off-white on the dark background, legible throughout.
      Data: Colors are pixel-identical to the light render — same four hue families and lightness gradients (verified by direct visual comparison of every wedge and legend swatch). Only the chrome (background, stroke color between wedges, ink tokens) flips between themes.
      Legibility verdict: PASS — no dark-on-dark failures; every label, tick, and legend entry is clearly readable against the near-black surface.
