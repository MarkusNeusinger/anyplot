review:
  strengths:
  - 'Nested-donut angular alignment is exact: both series sum to the same 1,740 total,
    so every outer segment''s arc stays geometrically nested inside its parent unit''s
    wedge'
  - Per-unit color families (Imprint hue lightened by a fixed ratio per child index)
    give an immediately readable parent/child relationship without leaving the Imprint
    palette
  - Center overlay ("$1.74B / TOTAL REVENUE") uses the donut hole productively as
    a genuine focal point, not just empty space
  - arcLabelMinAngle correctly suppresses labels on the one segment too thin to hold
    text (Training, 14.5°) while the legend still covers it — matches the spec's "labels
    on larger segments, legend for smaller" guidance
  - paintOrder stroke halos on arc labels and pageBg-colored strokes between wedges
    keep text legible against every hue/tint without extra contrast work
  - Both renders are pixel-identical in data color and differ only in theme chrome
    (background, ink, legend text) — correct theme handling throughout
  weaknesses:
  - 'Layout balance: the donut sits left-of-center (MARGIN.right=320 vs left=50) so
    the legend column floats in a much larger empty right/top/bottom margin than the
    whitespace on the donut''s own side — rebalance margins or widen the chart so
    the whitespace reads as intentional rather than leftover.'
  - Outer-ring arc labels are set to 13px vs 18px on the inner ring — legible now,
    but at the small end for a nested donut with 10 outer segments; consider nudging
    to ~14-15px for extra mobile-scale safety margin.
  - Design excellence is solid (tinted hierarchy, center callout, refined stroke halos)
    but stops short of a truly distinctive focal point — e.g. no visual emphasis calling
    out the single largest segment or unit beyond its size, so the story stays at
    "here is the breakdown" rather than "here is the insight".
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "donut-nested · javascript · muix · anyplot.ai" centered at top, clearly readable. Inner-ring labels (Software, Hardware, Services, Consulting) in bold dark text with a light stroke halo sit inside their own wedges. Outer-ring labels (Enterprise SaaS, SMB Subscriptions, Developer Tools, Enterprise Devices, Consumer Devices, Managed Support, Professional Services, Strategy Advisory, Implementation) are smaller dark text, also haloed, all fully contained within their wedges — no clipping. Legend on the right lists all 10 outer-segment labels in dark-gray text with matching color swatches. Center donut-hole overlay shows "$1.74B" in large bold dark text and "TOTAL REVENUE" in smaller uppercase gray text.
      Data: Inner ring uses Imprint palette positions 1-4 (green Software, lavender Hardware, blue Services, ochre Consulting — first series is #009E73 green). Outer ring uses lightened tints of the same hue per parent unit, giving a clear parent/child color family per branch.
      Legibility verdict: PASS — every title, arc label, legend entry, and center overlay is clearly readable against the light background; no light-on-light text.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now in light text, clearly visible. Inner- and outer-ring arc labels keep the same layout and halo treatment, now with dark-toned stroke against the lighter wedge tints so they stay readable on both the darker green/purple/blue base hues and the lightened child tints. Legend text is light gray, clearly legible against the dark background. Center overlay "$1.74B / TOTAL REVENUE" renders in light text, fully readable.
      Data: All wedge hues (business-unit hues and their child tints) are pixel-identical to the light render — only the chrome (background, title, tick/legend text, arc-label stroke) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all text elements (title, arc labels, legend, center overlay) are clearly visible against the near-black background.
