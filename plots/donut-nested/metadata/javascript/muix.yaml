review:
  strengths:
  - 'Repair fully addressed the attempt-1 margin imbalance: measuring the rendered
    PNGs, the previous MARGIN.right=320/left=50 split (legend floating in a much larger
    empty area) is now MARGIN.right=260/left=90 plus a slightly larger outerRadius
    (400→420), and the chart+legend group now reads as a well-balanced composition
    centered on the canvas'
  - Outer-ring arc-label fontSize was bumped 13→15px as requested, giving the 10 customer-segment
    labels extra mobile-scale safety without introducing any new overlap
  - 'Nested-donut angular alignment remains exact: both series total 1,740 so every
    outer segment''s arc stays geometrically nested inside its parent unit''s wedge'
  - 'Per-unit color families (Imprint hue lightened by a fixed ratio per child index)
    give an immediately readable parent/child relationship without leaving the Imprint
    palette; first series is #009E73 in canonical order'
  - Center overlay ("$1.74B / TOTAL REVENUE") productively uses the donut hole as
    a genuine focal point
  - arcLabelMinAngle correctly suppresses the one segment too thin to hold text (Training,
    14.5°) while the legend still covers it
  - paintOrder stroke halos on arc labels keep text legible against every hue/tint
    in both themes
  - Both renders are pixel-identical in data color and differ only in theme chrome
    (background, text, stroke direction) — correct theme handling throughout
  weaknesses:
  - There is still a sizeable pure-whitespace gap between the title and the donut
    (measured ~351px of the 2400px canvas height, vs. only 45px on the right and 50px
    above the title) — the PieChart's own vertical margin box (top=130/bottom=50 CSS)
    leaves more room than the outerRadius=420 circle actually needs, so the ring sits
    noticeably lower than the title. Not severe enough to cap the score, but tightening
    MARGIN.top slightly (or growing outerRadius a touch further) would make the composition
    read as fully intentional rather than slightly top-empty.
  - Design storytelling still stops at the two-tier label hierarchy + center total;
    no visual emphasis singles out the single largest segment/unit (e.g. a subtle
    stroke weight bump or radius nudge on Enterprise SaaS / Software) — this was a
    suggested nice-to-have in the attempt-1 review and remains unaddressed, though
    it is not required by the spec
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 (confirmed by pixel sample at [5,5] = RGB(250,248,241)) — not pure white.
      Chrome: Bold dark title "donut-nested · javascript · muix · anyplot.ai" centered near the top. Inner ring (Software/Hardware/Services/Consulting) carries bold 18px haloed labels; outer ring (10 customer-segment wedges) carries 15px haloed labels (bumped from 13px in attempt 1) — all fully readable, no clipping, no overlap. Legend on the right lists all 10 outer-segment names with color swatches in dark-gray text. Center donut-hole overlay shows "$1.74B" / "TOTAL REVENUE" in dark text.
      Data: First/largest inner wedge (Software) renders in #009E73 (Imprint position 1); Hardware/Services/Consulting follow canonical Imprint order (positions 2-4). Outer-ring segments use lightened tints of their parent hue, stepping toward white per child index — consistent hue families throughout.
      Legibility verdict: PASS — all text (title, inner/outer arc labels, legend, center overlay) is clearly readable against the light background; no light-on-light failures.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 (confirmed by pixel sample at [5,5] = RGB(26,26,23)) — not pure black.
      Chrome: Identical layout to the light render; title, arc labels, legend text, and center overlay all render in light tones (light gray/white) against the dark background, with the label-halo stroke direction flipped appropriately for dark chrome.
      Data: All wedge hues — both the four unit colors and their child tints — are pixel-identical to the light render (verified: same content bounding box, same colors); only the chrome (background, text) flips, exactly as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; every text element is clearly legible against the near-black background.

    Layout measurement (both renders, identical geometry): content bounding box spans x=192-2355 (90% of 2400px width) and y=50-2117 (86% of 2400px height). Left margin 192px (8%) vs. right margin 45px (1.9%) — noticeably tighter on the right but not clipped (legend never touches the canvas edge). A vertical gap of ~351px sits between the title (ends y=91) and the donut ring (starts y=442), larger than the 283px bottom margin — a minor top-heavy imbalance, not severe enough to be a defect but flagged in weaknesses for future polish.
