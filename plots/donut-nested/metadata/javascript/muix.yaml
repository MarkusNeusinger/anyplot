review:
  strengths:
  - Children are tints of their parent's Imprint hue, computed from the palette token,
    and both rings align segment boundaries exactly because the outer ring is built
    in the inner ring's order
  - Arc-label ink is chosen per segment from WCAG relative luminance, so labels stay
    readable on the saturated parents and the pale outer tints in both themes
  - Location-aware label function hides the parents from the legend (they carry arc
    labels) while arcLabelMinAngle hands thin slices (Training, Implementation) to
    the legend, as the Notes ask
  - useDrawingArea composes a center readout inside the PieChart's SVG, and valueFormatter
    gives the HTML tooltips units
  weaknesses:
  - 'Suggestion: the per-segment ink rules index arc labels with :nth-of-type; if
    a future MUI X version stops emitting placeholder nodes for labels under arcLabelMinAngle,
    the inks would shift by one, so setting the label fill per data item would be
    sturdier.'
  - 'Suggestion: a focal emphasis on the dominant Software / Enterprise SaaS share
    would give the chart a clearer entry point.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no grid or axes.
      Chrome: dark title "donut-nested · javascript · muix · anyplot.ai" centered at top; two-row horizontal legend at the bottom listing the ten customer segments with colored dots; center readout "TOTAL / 1,740 / million USD" in ink tokens. All readable.
      Data: inner ring with Software (#009E73, ~147°), Hardware (#C475FD), Services (#4467A3, white label), Consulting (#BD8233); outer ring of children in tints of each parent, aligned with the parent arcs; page-colored separators and an even gap between rings; Training and Implementation unlabeled, named in the legend. First series is brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, legend text and center "1,740" in light ink; "TOTAL" and "million USD" in soft light ink; no dark-on-dark text. Separators and ring gap now in the dark page color.
      Data: segment colors identical to the light render; arc-label inks unchanged (dark on pale/saturated tints, light on the blue Services segments).
      Legibility verdict: PASS
