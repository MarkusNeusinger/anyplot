review:
  strengths:
  - Correct idiomatic d3.hierarchy() + d3.partition() + d3.arc() pattern for a nested
    donut — child segments are guaranteed to align exactly under their parent's arc
    boundaries because angles are derived from the same hierarchy, not recomputed
    per ring.
  - Consistent per-department hue families in canonical Imprint order (Engineering=green
    pos.1, Marketing=lavender pos.2, Sales=blue pos.3, Operations=ochre pos.4), with
    children rendered as lightened variants of the parent hue — directly matches the
    spec's 'consistent color families per parent category' note.
  - Luminance-based adaptive label ink color (labelInkFor) keeps every segment label
    legible regardless of how light/dark its individual shade is, in both themes.
  - 'Thoughtful hybrid labeling strategy: inline labels for segments large enough
    to hold text, legend for the remaining small slivers — precisely matches the spec''s
    ''Include labels on larger segments, use legend for smaller ones'' guidance.'
  - Center 'Total Budget $1,660K' callout gives the chart a clear focal point beyond
    the raw ring data.
  - 'Both themes render correctly: identical data hues in light/dark, theme-adaptive
    chrome (background, ink, legend text) sourced from ANYPLOT_TOKENS.'
  weaknesses:
  - 'Mobile legibility failure: at the ~400px preview width, the inline segment labels
    (13 labeled slices) and the entire ''Smaller categories'' legend column become
    blurry/illegible — only the title, subtitle, and center total (''$1,660K'') survive
    the downscale. Increase the segment-label and legend font sizes (or the stroke/weight)
    so secondary text degrades gracefully at mobile width, e.g. bump segment labels
    from 15px/13px to ~18px/15px and legend text from 14px to ~16px.'
  - 'Layout balance: the donut is anchored left-of-center (cx=440 of a 1200 CSS mount)
    to make room for the legend, but the legend only fills 4 short rows in the top-right,
    leaving a large empty region across the bottom-right quadrant of the canvas —
    rebalance by centering the donut more, enlarging the legend block (bigger swatches/text
    per weakness #1), or vertically centering the legend against the donut''s full
    height.'
  - Legend swatches are quite small (16x16 px) relative to the 2400x2400 canvas —
    enlarging them alongside the font-size fix would help both desktop polish and
    mobile visibility.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "donut-nested · javascript · d3 · anyplot.ai" and gray subtitle "Annual budget by department and expense category" both clearly readable at the top. Center hole shows "Total Budget" / "$1,660K" in dark ink, fully legible. "Smaller categories" legend header and its 4 rows sit at the right in dark/gray text, readable at full resolution.
      Data: Inner ring = 4 department segments (Engineering green #009E73, Marketing lavender, Sales blue, Operations ochre — matches Imprint canonical order positions 1-4). Outer ring = per-department child categories rendered as lightened shades of the same hue, consistent color families per the spec note. Segment labels use luminance-adaptive ink so both light-on-dark and dark-on-light labels stay legible on every shade. Thin slivers (Training, Tools, Software, Insurance) are omitted from inline labels and listed in the side legend instead.
      Legibility verdict: PASS at full resolution / desktop width. FAIL at ~400px mobile preview width — segment labels and legend text become illegible blur (see plot-light_400.png); only title, subtitle, and center total remain readable at that scale.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title and subtitle flip to light text (white/light-gray), clearly readable against the dark background. Center "Total Budget $1,660K" text is light-colored and legible. Legend header/text flips to light gray, legible at full resolution. No dark-on-dark failures observed.
      Data: Segment hues are pixel-identical to the light render (green/lavender/blue/ochre families) — only chrome (background, ink, legend text) flipped, confirming theme-adaptive tokens were threaded through correctly. Per-segment label ink still adapts to each shade's own luminance (independent of page theme), so labels remain legible on every ring segment.
      Legibility verdict: PASS at full resolution — same caveat as light render regarding mobile downscale (not spot-checked separately for dark, but font sizes are identical so the same mobile-legibility weakness applies).
