review:
  strengths:
  - 'Genuine hierarchical aggregation: inner-ring department totals are computed by
    summing outer-ring category values (not hardcoded twice), so the two rings are
    always mathematically consistent.'
  - Custom color-family algorithm (echarts.color.lift with lightness steps [0, 0.22,
    0.42]) gives each department a shared hue and each of its categories a distinct
    lightness — a direct, well-executed answer to the spec's 'consistent color families
    per parent category' note.
  - Label contrast is computed per-segment via relative luminance (WCAG formula) rather
    than a fixed color, so inner-ring labels stay readable regardless of which palette
    color they land on.
  - Rings are radially aligned and gapped (inner 0-30%, outer 40-68%, padAngle on
    both) exactly per the spec's alignment and spacing notes, and the gap gives clear
    part-to-whole separation.
  - 'Sensible label strategy: larger outer segments get external labels with leader
    lines, `minShowLabelAngle: 12` + `labelLayout.hideOverlap` suppress labels on
    tiny slices (CRM Tools) in favor of the legend, matching the spec''s ''labels
    on larger segments, legend for smaller ones'' guidance.'
  - First categorical series is Imprint green (#009E73), data colors are pixel-identical
    between light and dark renders, and only chrome (background, borders, label ink)
    flips with theme — correct token usage throughout.
  - Title auto-scales font size to the descriptive-prefixed length, keeping it within
    a well-proportioned ~55% of plot width instead of overflowing.
  weaknesses:
  - The lightest color-family shades (CRM Tools in the Sales/blue family, IT Support
    in the Operations/tan family) sit fairly close in lightness to the warm off-white
    light-theme background (#FAF8F1) — still distinguishable via the border gap, but
    contrast margin is tighter than the rest of the palette. Consider capping the
    max lightness step slightly lower than 0.42 so the lightest wedge never approaches
    page-background luminance.
  - Several small pure helper functions (relativeLuminance, labelColorFor, departmentColor,
    categoryColor) are justified by the luminance-contrast logic but push slightly
    past a minimal KISS structure — could be inlined or reduced if a future pass wants
    a leaner script.
  - Visual hierarchy is correct but fairly neutral (no single emphasized department/category);
    a subtle emphasis technique (e.g. slightly larger radius or bolder label on the
    largest department) could sharpen the storytelling focal point.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Operating Budget by Department · donut-nested · javascript · echarts · anyplot.ai" in bold dark ink, clearly legible, ~55% of canvas width. Outer-ring leader-line labels and legend text render in a softer gray-brown ink, fully legible against the light background. Thin cream borders separate every wedge and cleanly split the inner and outer rings.
      Data: Inner ring shows 4 department wedges (Engineering = Imprint green #009E73, Marketing = purple, Sales = blue, Operations = amber) each with a bold white/dark label sized for legibility per computed luminance contrast. Outer ring shows 11 category wedges, each a lighter tint of its parent department's hue, arranged so categories align radially under their parent. Legend at the bottom lists all 11 outer-ring category names in two rows, swatches match wedge colors.
      Legibility verdict: PASS — no dark-on-dark or light-on-light collisions observed; the lightest tint wedges (CRM Tools, IT Support) have a somewhat tight contrast margin against the background but remain distinguishable via wedge borders.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title renders in white/light ink, clearly legible. Outer-ring labels and legend text render in light gray, legible against the dark background. Wedge borders flip to near-black (following the theme's pageBg token), maintaining the same ring-separation effect seen in the light render.
      Data: All wedge colors (department base hues and category tint shades) are pixel-identical to the light render — confirmed the same green/purple/blue/amber families and lightness gradations are used, only chrome flipped as required. Inner-ring labels remain legible against their respective fills via the same luminance-based contrast logic.
      Legibility verdict: PASS — no dark-on-dark failures; all title, label, tick, and legend text is clearly readable against the near-black surface.
