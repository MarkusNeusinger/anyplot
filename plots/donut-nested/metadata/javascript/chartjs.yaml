review:
  strengths:
  - Correct nested-donut structure via Chart.js's two-dataset `weight` property, with
    departments as the inner ring and expense categories as the outer ring; children
    are grouped and ordered by parent so arc boundaries align radially between rings.
  - Consistent color families per department (parent hue, rising child lightness via
    HSL math) directly implements the spec's 'use consistent color families per parent
    category' note.
  - Direct on-arc labels (department name + $ total) via a custom afterDatasetsDraw
    plugin, with the legend covering the finer category breakdown — matches the spec's
    'labels on larger segments, legend for smaller' guidance.
  - 'First categorical series correctly uses Imprint #009E73; remaining departments
    cycle through palette positions 2-4 in canonical order; data colors are identical
    between light and dark renders.'
  - Both renders are fully readable — white text with a subtle dark stroke on ring
    labels holds contrast against every department color in both themes.
  - Realistic, neutral company-budget scenario with plausible relative department
    sizes ($33M Engineering down to $13M Operations).
  weaknesses:
  - The donut sits flush against the left canvas edge (~0px margin) in both renders
    while the legend column leaves a comfortable margin on the right — unbalanced
    whitespace. Add explicit `layout.padding` (or otherwise re-center the chart area)
    so left/right margins are roughly equal.
  - Sub-department '$XXM' labels (17px CSS / 34 source px) are noticeably smaller
    than the department name above them and risk becoming hard to read once the PNG
    is scaled to a ~400px mobile thumbnail — consider bumping to ~19-20px for extra
    headroom.
  - 'Data storytelling is capped by the layout: the plot organizes and labels the
    hierarchy clearly but doesn''t create additional emphasis beyond the direct labels
    (e.g., the donut''s empty center hole could carry a ''Total: $91M'' label, or
    the largest department could be visually emphasized).'
  - 'CQ-01 (KISS structure) note: hexToHsl/hslToHex/childShade plus the ringLabels
    plugin object add four functions beyond the plain imports-data-plot shape. Justified
    here by the spec''s explicit color-family requirement, but avoid adding further
    abstraction in repair.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "donut-nested · javascript · chartjs · anyplot.ai" in dark ink, clearly readable. Right-side legend lists all 11 outer-ring category labels in a soft dark-gray, each with a color swatch matching its wedge. Inner-ring department labels (name + $ total) render in bold white text with a subtle dark stroke, legible against every department color.
      Data: Two concentric rings — inner ring (Engineering, Marketing, Sales, Operations) in the four Imprint hues (green, lavender, blue, ochre); outer ring (11 expense categories) in matching hue families at rising lightness per parent. First series (Engineering/R&D family) is Imprint brand green #009E73. Segments are separated by thin page-background borders.
      Legibility verdict: PASS. All text is readable; the only visual defect is that the donut is pushed flush against the left canvas edge with almost no left margin, while the legend area has a comfortable right margin — an unbalanced layout, not a legibility failure.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light ink, clearly readable against the dark background. Legend text switches to a light gray, readable. Inner-ring labels keep the same white-text/dark-stroke treatment, which continues to read well against the (now darker-toned) department colors. No dark-on-dark text found anywhere.
      Data: Same two-ring structure and identical data colors to the light render — only the background, title, legend text, and segment border color (now page-background dark) flipped; the categorical palette values (green/lavender/blue/ochre families) are unchanged, confirming theme-adaptive chrome without touching data colors.
      Legibility verdict: PASS. No dark-on-dark or light-on-light failures. Same left-edge margin imbalance as the light render (chart layout, not a theme-specific issue).
