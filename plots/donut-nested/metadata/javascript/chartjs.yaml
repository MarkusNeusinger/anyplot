review:
  strengths:
  - 'The repair fully resolved the attempt-1 layout complaint: the doughnut now sits
    with balanced left/right padding (layout.padding 50/50) instead of flush against
    the left canvas edge.'
  - The repair also addressed the data-storytelling gap by adding a center-hole "Total
    Budget $91M" label, turning the empty donut hole into a headline figure tying
    both rings together.
  - Correct nested-donut structure via Chart.js's two-dataset weight property, with
    departments as the inner ring and expense categories as the outer ring; children
    are grouped and ordered by parent so arc boundaries align radially between rings.
  - Consistent color families per department (parent hue, rising child lightness via
    HSL math) directly implements the spec's 'use consistent color families per parent
    category' note.
  - Direct on-arc labels (department name + $ total, now at a slightly larger 20-21px)
    via a custom afterDatasetsDraw plugin, with the legend covering the finer category
    breakdown - matches the spec's 'labels on larger segments, legend for smaller'
    guidance.
  - 'First categorical series correctly uses Imprint #009E73; remaining departments
    cycle through palette positions 2-4 in canonical order; data colors are identical
    between light and dark renders.'
  - Both renders are fully readable - white text with a subtle dark stroke on ring
    labels holds contrast against every department color in both themes, and legend/chrome
    text flips correctly between light and dark tokens.
  - Realistic, neutral company-budget scenario with plausible relative department
    sizes ($33M Engineering down to $13M Operations) and values that aggregate exactly
    (children sum to parent totals).
  weaknesses:
  - 'CQ-01: hexToHsl/hslToHex/childShade plus the ringLabels plugin object add four
    functions beyond the plain imports-data-plot shape. Justified by the spec''s explicit
    color-family requirement, but avoid adding further abstraction.'
  - Sub-department "$XXM" labels are still a touch smaller than the department name
    above them; fine at full resolution but keep an eye on mobile-thumbnail legibility
    if this pattern is reused elsewhere.
  - Color differentiation between children of the same department relies on lightness
    steps within one hue family, which is a slightly finer distinction under color-vision-deficiency
    simulation than distinct hues - acceptable here since the white/dark stroke and
    radial position provide redundant cues.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - not pure white.
      Chrome: Title "donut-nested · javascript · chartjs · anyplot.ai" in dark ink at top, clearly readable. Right-side legend lists the 11 expense-category labels in secondary dark-gray text with color-matched swatches. Inner-ring direct labels (department name + $ total) use white text with a dark stroke, readable against every department color.
      Data: Inner ring = 4 departments (Engineering #009E73 green, Marketing lavender/purple, Sales blue, Operations ochre) in canonical Imprint order. Outer ring = 11 expense categories, each a lighter shade of its parent's hue, with arc boundaries aligned to the parent ring. Center hole now shows "Total Budget / $91M" tying both rings together (added in this repair). Doughnut has balanced left/right padding around the canvas - no longer flush against the left edge as in attempt 1.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - not pure black.
      Chrome: Title and legend text flip to light ink / light gray and remain fully readable against the dark surface. Ring labels keep the same white-text/dark-stroke treatment and still read cleanly; center "Total Budget $91M" label uses theme-adaptive ink tokens and is legible.
      Data: Department and category colors are pixel-identical to the light render (green/lavender/blue/ochre families) - only chrome (background, title, legend text, borders) flipped, as required. No dark-on-dark or light-on-light failures found.
      Legibility verdict: PASS
