review:
  strengths:
  - Outer ring is built with flatMap in the exact same business-unit order as the
    inner ring, so slice boundaries line up perfectly between rings — the spec's alignment
    requirement is met precisely.
  - 'Consistent color families per parent via Highcharts.color(unit.color).brighten(offset):
    same hue, varying lightness for children, which also leans on luminance rather
    than hue for intra-family distinction — helpful for CVD readers.'
  - Deliberate radius gap between rings (64%–68%) gives clean visual separation between
    hierarchy levels, matching the spec's optional suggestion.
  - 'Fully theme-adaptive palette and chrome: data colors (green/lavender/blue/ochre,
    canonical Imprint order) are identical between light and dark, and all text/legend/background
    tokens map correctly in both renders.'
  - Deterministic, clean data derivation — inner-ring values are correctly rolled
    up from children via reduce(), matching the spec's aggregation requirement.
  weaknesses:
  - The largest outer-ring segment ('Compute', 42/210 ≈ 20% of total revenue) gets
    no direct data label — only the four inner-ring parent categories are labeled,
    so a segment this large is pushed into the legend alongside the smallest slices,
    which only partially follows the spec's 'labels on larger segments, legend for
    smaller ones' guidance.
  - 'Tooltips are fully disabled (tooltip: { enabled: false }) — for an interactive
    library this forfeits a native Highcharts strength in the HTML detail view for
    no static-render benefit; enabling tooltips would add real value without touching
    the PNG.'
  - 'Design Excellence is solid but not yet publication-grade: no additional polish
    elements (e.g. subtle segment hover states in HTML, a highlighted focal callout
    on the top business unit) push it from ''good'' to ''exceptional''.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "donut-nested · javascript · highcharts · anyplot.ai" in bold dark ink at ~40% of canvas width (well within bounds, no overflow). Subtitle "Revenue by Business Unit and Product Line ($M)" in soft grey beneath it. Legend row of 11 product-line entries (Compute, Storage, Networking, Servers, Laptops, Peripherals, Enterprise, SMB, Implementation, Training, Support) sits below the donut in dark-grey text with colored swatches, evenly spaced, no overlap.
      Data: Two concentric rings. Inner ring: 4 business-unit slices (Cloud Services = brand green #009E73, Hardware = lavender, Software Licensing = blue, Consulting = ochre) — matches canonical Imprint order with green first. Outer ring: 11 product-line slices, each tinted around its parent's hue (varying lightness) so the family membership is visually obvious. White dividing lines separate all slices; white-outlined dark text labels ("Cloud Services", "Hardware", "Software Licensing", "Consulting") sit inside the inner ring.
      Legibility verdict: PASS — all text (title, subtitle, inner-ring labels, legend) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and subtitle render in light ink/grey, clearly legible against the dark surface. Legend text is light grey, fully readable. Segment divider lines switch from white to the dark background color, and inner-ring data-label text outlines adapt so the labels stay legible on the dark surface.
      Data: Same two-ring structure and identical slice colors as the light render (green Cloud Services first, then lavender Hardware, blue Software Licensing, ochre Consulting for the inner ring; same tint families for the 11 outer-ring product lines) — confirms data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title, legend, and data-label text is clearly visible against the near-black background.
