review:
  strengths:
  - Outer ring built with flatMap in the exact same business-unit order as the inner
    ring, so slice boundaries line up perfectly between rings — meets the spec's alignment
    requirement precisely.
  - 'Consistent color families per parent via Highcharts.color(unit.color).brighten(offset):
    same hue, varying lightness — also CVD-friendly since it leans on luminance, not
    hue.'
  - Deliberate radius gap between rings (64%→68%) gives clean visual separation between
    hierarchy levels, matching the spec's optional suggestion.
  - 'Fully theme-adaptive palette and chrome: data colors are identical between light/dark;
    all text/legend/background tokens map correctly, and both renders pass the theme-readability
    check.'
  - Tooltip re-enabled with a descriptive pointFormat (name, value, percentage), restoring
    a native Highcharts strength in the HTML detail view that was disabled in the
    previous attempt.
  weaknesses:
  - 'New defect from this repair: the outer-ring direct data labels for the two slices
    that now pass the 15% threshold (''Compute'' and ''Enterprise'') render OUTSIDE
    the donut''s outer edge, floating on the plain background with no leader/connector
    line — they read as detached from any segment rather than labeling their slice.
    Verified in both plot-light.png and plot-dark.png at identical pixel positions.
    The outer series uses innerSize:''68%''/size:''96%'' with dataLabels.distance:-20,
    which should pull the label 20px inward from the slice''s own outer radius, but
    for these two large-angle slices the label lands past the 96% radius in the background
    instead of inside the 68%-96% band. Likely cause: Highcharts'' pie label overlap-avoidance
    (softenLabelOverlap) shifting the label outward for wide slices, or the distance
    being computed against the wrong reference radius for a nested multi-series pie.
    Fix: pull the label further inward (e.g. distance around -60 to -90, or a percentage-based
    offset relative to the band''s own thickness) and re-render both themes to confirm
    the label text sits fully inside the colored band for every slice that crosses
    the label threshold, not just the smaller ones that happened to fit.'
  - Because the two largest, most prominent outer segments now carry a visually broken
    label, the spec's 'labels on larger segments' guidance is only nominally satisfied
    — the feature exists in code but doesn't read correctly on screen.
  - Design Excellence is solid but not yet publication-grade — no additional polish
    elements push it from 'good' to 'exceptional' (e.g. a subtle focal callout on
    the top business unit).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "donut-nested · javascript · highcharts · anyplot.ai" centered near the top, well within canvas bounds (no clipping). Soft-grey subtitle "Revenue by Business Unit and Product Line ($M)" beneath it. An 11-item legend (Compute, Storage, Networking, Servers, Laptops, Peripherals, Enterprise, SMB, Implementation, Training, Support) sits below the donut in dark-grey text with color swatches, fully inside the canvas with generous clearance from the bottom edge. All chrome text is clearly readable against the light background.
      Data: Two concentric rings. Inner ring: 4 business-unit slices (Cloud Services = brand green #009E73 first, Hardware = purple, Software Licensing = blue, Consulting = ochre/brown), each with a bold, white-outlined dark-text label sitting inside its own band, fully legible. Outer ring: 11 product-line slices tinted around their parent's hue (same hue family, varying lightness), aligned to their parent's angular boundaries. Two outer slices ("Compute" and "Enterprise") carry a direct text label per the >15%-of-ring threshold, but BOTH of these labels render outside the outer ring's edge, floating on the cream background with no line connecting them back to their slice — a real placement defect, not merely tight margins. All other data is otherwise clearly distinguishable and colors match the Imprint palette.
      Legibility verdict: PASS for contrast/readability of every text element; FAIL for correct *placement* of the "Compute" and "Enterprise" outer-ring data labels (floating off their slice, ambiguous attribution).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light ink/soft-grey and remain clearly legible; legend text is light-grey on the dark background with no dark-on-dark issues; nothing clipped at any edge.
      Data: Ring structure and all data colors (green/purple/blue/ochre inner families; matching tint families for the outer ring) are pixel-identical to the light render — only chrome adapted, as required. The same "Compute" and "Enterprise" outer-ring label placement defect reproduces at the identical pixel position as the light render (floating on the dark background outside the ring, disconnected from its slice).
      Legibility verdict: PASS for contrast/readability of every text element; FAIL for correct placement of the same two outer-ring data labels as in the light render — this is a deterministic layout bug, not a theme-specific contrast failure.
