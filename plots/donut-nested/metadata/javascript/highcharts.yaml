review:
  strengths:
  - 'The Attempt-2 label-placement bug is fixed: ''Compute'' and ''Enterprise'' now
    render at distance:-55, landing cleanly inside the outer ring''s 68%-96% band
    in both themes instead of floating outside on the background.'
  - Outer ring built with flatMap in the exact same business-unit order as the inner
    ring, so slice boundaries line up perfectly between rings, matching the spec's
    alignment requirement.
  - 'Consistent color families per parent via Highcharts.color(unit.color).brighten(offset):
    same hue, varying lightness — CVD-robust since it leans on luminance, not hue.'
  - Deliberate radius gap between rings (64%→68%) gives clean visual separation between
    hierarchy levels, matching the spec's optional suggestion.
  - 'Fully theme-adaptive palette and chrome: data colors are pixel-identical between
    light/dark; both renders pass the theme-readability check.'
  - Threshold-based direct labels (>15% of ring total) correctly identify the two
    largest outer segments while the other nine fall back to the 11-item legend, satisfying
    the spec's 'labels on larger segments, legend for smaller' guidance.
  - Deterministic, clean data derivation with correct value roll-up from children
    to parent via reduce().
  weaknesses:
  - Design Excellence is solid but not yet publication-grade — no additional polish
    element (e.g. a small focal callout on the top business unit, extra typography
    refinement) pushes it from 'good' to 'exceptional'; this has been static across
    all three attempts.
  - Only 2 of the 4 parent categories have children counts at the upper half of the
    spec's 2-5 range (3-3-2-3 split) — a wider spread (e.g. one parent with 5 children)
    would more fully exercise the spec's stated 2-5 children range.
  - 'LM-02 remains generic-plus: Highcharts.color().brighten() and the tooltip pointFormat
    are nice touches but the nested-donut-via-two-pie-series approach itself is replicable
    in most charting libraries with minor syntax changes.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Bold dark title "donut-nested · javascript · highcharts · anyplot.ai" centered near the top, comfortably within canvas bounds. Soft-grey subtitle "Revenue by Business Unit and Product Line ($M)" beneath it with units. 11-item legend in dark-grey text with color swatches sits below the donut, evenly spaced, no overlap, clear of the canvas edge.
      Data: Two concentric rings. Inner ring: 4 business-unit slices — Cloud Services = brand green #009E73 (first series, correct), Hardware = lavender, Software Licensing = blue, Consulting = ochre — canonical Imprint order, each with a white-outlined dark-text label inside its own band. Outer ring: 11 product-line slices tinted around their parent's hue (same hue, varying lightness), visually grouping children under their parent. The two qualifying large slices ("Compute" ~20% and "Enterprise" ~15.7% of the outer ring total) now carry direct inline labels that render fully inside the 68%-96% outer band — the Attempt-2 floating-label defect is resolved. Slice boundaries between inner and outer rings align at identical angles, and a thin background-colored gap separates the two rings for visual clarity.
      Legibility verdict: PASS — all text (title, subtitle, ring labels, legend) is clearly readable against the light background, no overlaps.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title, subtitle, and legend all render in light ink/grey and remain clearly legible; segment divider strokes and label outlines correctly flip to dark-appropriate tones. No dark-on-dark failures anywhere.
      Data: All data colors (green/lavender/blue/ochre inner ring; matching tint families in the outer ring) are pixel-identical to the light render — only chrome (background, text, legend) adapted, as required. The "Compute" and "Enterprise" labels reproduce at the same corrected inward position as in the light render, confirming the fix is theme-independent.
      Legibility verdict: PASS — all text is clearly visible against the near-black background, no dark-on-dark issues.
