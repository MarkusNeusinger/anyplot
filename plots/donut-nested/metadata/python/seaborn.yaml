review:
  strengths:
  - 'Nested-donut geometry is precisely aligned: outer category wedges line up exactly
    under their parent region wedge because both rings share the same startangle and
    region-ordered value sequence, satisfying the spec''s alignment requirement.'
  - Dynamic per-wedge label color (_luminance/_label_color computing WCAG relative
    luminance) automatically picks dark ink vs. white text so every in-wedge label
    stays legible on both dark (green, blue) and light (lavender tint, ochre tint)
    wedges in both themes.
  - sns.light_palette tint families give each region's outer category wedges a consistent
    same-hue/varying-lightness treatment, directly matching the spec's 'consistent
    color families per parent category' note while the inner ring keeps canonical
    Imprint order (#009E73 first).
  - Dual-legend structure (Regions inner / Categories outer) plus direct in-wedge
    labels on the single largest category per region matches the spec's 'label larger
    segments, legend for smaller' guidance exactly.
  - Center 'Total Budget $370M' annotation gives an immediate top-line total that
    reinforces the part-to-whole story at a glance.
  weaknesses:
  - Latin America's inner-ring label ('Latin America $50M') sits close to its own
    outer-ring label ('Salaries $18M') since Latin America is the smallest region
    wedge (50/370 ≈ 13.5%) — increase INNER_LABEL_R/OUTER_LABEL_R radial separation
    or trim the wedge-label fontsize slightly for narrow segments to add breathing
    room.
  - In-wedge label fontsize (7pt) is on the small side — bumping to 8-9pt would strengthen
    legibility at ~400px mobile scale for the two-line region/category direct labels.
  - The donut is visibly shifted left (CX=0.31) to balance the two left-side legends,
    leaving a noticeably wider empty margin on the canvas's right edge than the left
    — could tighten CX slightly for better left/right whitespace balance.
  - seaborn has no native pie/donut primitive, so the ring geometry itself is drawn
    with matplotlib's ax.pie(); seaborn's contribution is limited to sns.set_theme()
    chrome and sns.light_palette() tinting — an inherent library constraint rather
    than a code defect, but it caps how idiomatic/distinctive the seaborn usage can
    score.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "donut-nested · python · seaborn · anyplot.ai" in bold dark ink, centered top, fully visible with no clipping. Two boxed legends ("Regions (Inner)" top-left, "Categories (Outer) (N. Am. shades)" bottom-left) with dark ink text on an elevated off-white box, soft ink-toned borders — all clearly readable.
      Data: Nested donut with 4 inner region wedges (North America #009E73 green, Europe lavender, Asia Pacific blue, Latin America ochre — canonical Imprint order, first series green as required) and 16 outer category wedges rendered as same-hue tints of their parent region color. Center hole shows "Total Budget $370M" in bold dark ink. Direct in-wedge labels give each region's name+value on the inner ring and each region's largest category name+value on the outer ring; label text color automatically switches between dark ink (on light tints) and white (on the saturated green/blue) for contrast.
      Legibility verdict: PASS — all title, legend, and in-wedge text is clearly readable against the light background. Latin America's inner label sits close to its own outer "Salaries" label (smallest wedge) but is still legible, not overlapping-illegible.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and legend text render in light ink (#F0EFE8/near-white), legend boxes use the dark elevated fill (#242420) with soft light-toned borders — all readable against the dark surface, no dark-on-dark failures observed.
      Data: Identical wedge colors to the light render — North America #009E73 green first, same lavender/blue/ochre region hues and their tinted outer-ring families — confirming only chrome (background, text, legend box) flipped between themes, not data colors. Center "Total Budget $370M" text renders in light ink, clearly visible on the dark hole. In-wedge label colors again adapt per-wedge luminance (dark text stays dark-appropriate on light tints, white stays white on saturated hues), so contrast holds in this theme too.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures in either the chrome or the in-wedge labels; brand green #009E73 remains clearly visible on the dark surface.
