review:
  strengths:
  - Correct nested-donut structure with a visible spacing ring between inner and outer
    rings, satisfying the spec's 'consider adding spacing' note
  - Idiomatic use of sns.light_palette to build a tint family per parent region —
    expresses hierarchy through consistent hue families as the spec requires
  - 'Data aggregates correctly: each region''s outer segment values sum exactly to
    its inner value (120/95/105/50 = $370M total)'
  - Both renders keep the four Imprint categorical data colors visually identical;
    only chrome (background, legend surface, text ink) flips with theme
  - Center 'Total Budget' annotation plus polar-math-placed inner-ring labels give
    a clear focal point without any fake/simulated interactivity
  weaknesses:
  - Outer-ring (category) segments have no direct labels — the spec explicitly asks
    to 'include labels on larger segments, use legend for smaller ones,' but every
    outer wedge relies solely on legend + position, even large segments like Salaries
    (~45M for North America). Add value/percentage labels to at least the single largest
    outer wedge per region.
  - 'White label text on the Europe inner wedge (#C475FD) has noticeably lower contrast
    (~2.9:1) than the other three inner-ring labels, which sit on darker Imprint colors
    (#009E73, #4467A3, #BD8233) — darken the label color conditionally per-wedge luminance,
    or add a subtle text outline, so ''Europe $95M'' reads as clearly as the others.'
  - The 'Categories (Outer)' legend box (bbox_to_anchor=(-0.15, 0.0)) sits close enough
    to the donut's lower-left arc that the R&D outer wedge visibly touches/overlaps
    the legend's top-right corner in both renders — increase the negative x-offset
    or shrink the pie radius slightly for clear separation.
  - 'The outer-ring legend only shows the North America shade family (''shade family
    shown: N. America'') — for the other three regions, viewers can only infer which
    category a wedge is via angular position parity, not color, since e.g. Europe''s
    outer ring uses purple shades that never appear in the legend. Worth a bolder
    visual cue (e.g. hatching or per-region mini-legends) if this ambiguity matters.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches the required #FAF8F1 surface — not pure white, not dark.
      Chrome: Title "donut-nested · seaborn · anyplot.ai" in bold dark ink, centered top, comfortably within canvas bounds, not clipped. Two legend boxes (top-left "Regions (Inner)", bottom-left "Categories (Outer) / shade family shown: N. America") in a warm off-white elevated surface with dark ink text and soft outlines — both fully readable. Center annotation "Total Budget $370M" in bold dark ink, clearly legible against the cream donut hole.
      Data: Inner ring uses the four canonical Imprint colors in order — #009E73 (North America), #C475FD (Europe), #4467A3 (Asia Pacific), #BD8233 (Latin America) — with white bold value labels placed via polar-coordinate math. Outer ring uses four light-shade tints per region (via sns.light_palette), aligned angularly with their parent wedge, separated by a thin cream-colored gap ring between the two rings and thin cream wedge borders. First categorical series is #009E73 as required.
      Legibility verdict: PASS overall, with one caveat — the white "Europe $95M" label on the lighter #C475FD purple wedge has visibly lower contrast than the labels on the darker green/blue/orange wedges (still readable, but weaker). The "Categories (Outer)" legend box's top-right corner touches/slightly overlaps the R&D outer wedge.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches the required #1A1A17 surface — not pure black, not light.
      Chrome: Title now in light cream ink, clearly visible against the dark background. Legend boxes use a dark elevated surface with light cream text and soft light-gray outlines — fully readable, no dark-on-dark failures. Center "Total Budget $370M" text is light cream, clearly legible against the near-black donut hole. Wedge border strokes (which use PAGE_BG as edgecolor) correctly switched to the dark background color, keeping ring separation visible.
      Data: All four Imprint data colors are pixel-identical to the light render (verified positions and hues) — only chrome elements changed as required. Same white inner-ring value labels, same outer-ring tint families.
      Legibility verdict: PASS overall, same caveat as light — the white "Europe $95M" label reads slightly weaker on the purple wedge than the other three labels, and the same legend/wedge overlap corner is visible.
