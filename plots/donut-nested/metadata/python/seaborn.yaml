review:
  strengths:
  - 'Correct nested-donut structure: inner ring (regions) and outer ring (categories)
    aggregate correctly — every region total and the $370M center total match the
    sum of the underlying data.'
  - Consistent color families per parent category via sns.light_palette, producing
    same-hue/varying-lightness outer shades that directly follow the spec's styling
    guidance.
  - 'Imprint palette used in canonical order with first series #009E73; theme-adaptive
    chrome (background, legend fill, text) correctly flips between light and dark
    while data wedge colors stay pixel-identical across themes.'
  - Direct on-wedge labels (region totals on the inner ring, largest category per
    region on the outer ring) plus a center 'Total Budget' annotation add a real visual
    hierarchy beyond relying solely on the legend.
  - Deterministic hardcoded data (fully reproducible) and a clean, flat script structure.
  weaknesses:
  - 'Title is missing the mandated language segment: it renders as ''donut-nested
    · seaborn · anyplot.ai'' instead of the required ''donut-nested · python · seaborn
    · anyplot.ai'' (SC-04) — fix the ax.set_title string to insert ''python'' between
    the spec-id and library name.'
  - In both renders, the inner-ring 'Asia Pacific $105M' label sits immediately against
    the center 'Total Budget $370M' text with almost no whitespace between them, reading
    as a near-merged block — increase INNER_LABEL_R (or reduce the center-text font
    size) so every inner-ring label clears the center annotation at every angle.
  - 'Canvas composition is asymmetric: the donut and legends are weighted toward the
    left/center, leaving a noticeably empty top-right/bottom-right region of the square
    canvas — recenter the donut or rebalance legend placement so whitespace is distributed
    more evenly.'
  - The single 'largest outer segment' direct label always highlights 'Salaries' because
    it is the top category in all four regions, so the feature never actually varies
    — consider adjusting the data so at least one region's largest category differs,
    giving the direct-label feature real differentiation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "donut-nested · seaborn · anyplot.ai" in bold dark text at top (note: missing the "python" language segment vs. the mandated format). Two boxed legends at left ("Regions (Inner)" upper box, "Categories (Outer) / shade family shown: N. America" lower box) with cream fill, dark border, and dark readable text.
      Data: Inner ring shows 4 region wedges — North America (#009E73 green), Europe (purple), Asia Pacific (blue), Latin America (ochre) — each with a bold white/dark direct label showing region name + total ($M), color chosen via luminance-based contrast logic. Outer ring shows lighter tint families of each parent hue for the 4 expense categories, with only the single largest category per region directly labeled ("Salaries $XXM" in every region). Center shows "Total Budget $370M" in bold dark text.
      Legibility verdict: FAIL on one specific element — the inner "Asia Pacific $105M" label sits immediately adjacent to/overlapping the center "Total Budget $370M" text with almost no gap between them (still individually decipherable, but visually merged). All other title/legend/label text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and legend layout, now rendered in light/cream text and dark-elevated legend fill for contrast against the dark background — no dark-on-dark failures found; all chrome text is clearly legible.
      Data: Confirmed identical wedge colors to the light render (same green/purple/blue/ochre families for inner and outer rings) — only chrome (background, text, legend box) flipped, as required. Center "Total Budget $370M" text is light-colored and readable.
      Legibility verdict: FAIL on the same specific element — the "Asia Pacific $105M" / center-text overlap persists identically in this render (same geometry issue, theme-independent). All other text is clearly readable against the dark background.
