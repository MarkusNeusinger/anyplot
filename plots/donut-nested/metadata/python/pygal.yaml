review:
  strengths:
  - Uses pygal's native dual-series Pie feature to build a genuine two-level nested
    donut (no faked/simulated hierarchy)
  - Consistent hue-per-department color families for child segments via lerp_hex tinting,
    matching the spec's 'same hue, varying lightness' requirement
  - 'Canonical Imprint palette order with brand green (#009E73) correctly assigned
    to the first series; both renders are theme-correct (#FAF8F1 light / #1A1A17 dark
    backgrounds, adaptive ink tokens)'
  - Deterministic, hardcoded budget data with correct parent/child aggregation (child
    values sum exactly to each department total)
  - Clean KISS script structure, correct output files (plot-{theme}.png and plot-{theme}.html)
    via the shared SVG markup
  - Title correctly formatted and font-size scaled for the mandated string; legend
    accurately lists the 4 department names
  weaknesses:
  - 'Two of the four department-level (level_1) aggregate value labels are completely
    hidden: only Engineering ($1300K) and Marketing ($580K) totals are visible, while
    Operations ($540K) and Sales ($600K) totals are fully covered by the manually-punched
    donut-hole overlay. Measured from the SVG: all four big-slice value labels anchor
    at radius ~460-480px from the wedge center, but hole_radius = outer_radius * 0.55
    = ~517px, so every label''s anchor point falls inside the hole; Engineering/Marketing
    only partially escape because their text-anchor=''left'' string happens to run
    rightward, away from the hole on those two wedges. Fix: reposition all four big-slice
    value labels outward past the hole radius via the same SVG post-processing already
    used to punch the hole (or reduce the hole radius, or drop print_values on the
    aggregate series and show totals only via a separate consistent callout/legend)
    so all four departments render their total consistently.'
  - 'Roughly half of the 16 child-category (level_2) labels never render, even though
    the code assigns a non-empty label to the top-3-of-4 categories per department
    (only the smallest is intentionally left blank to dodge a pygal big_slice mislabel
    bug). Only 7 labels actually appear in the PNG (Salaries, Cloud Infrastructure,
    Digital Advertising, Events & Trade Shows, Facilities, Logistics, Commissions);
    R&D Equipment, Software Licenses, Content Production, Marketing Analytics, Equipment
    Maintenance, Safety & Compliance, Travel, and CRM Tools are silently dropped by
    pygal''s own label placement, and there is no legend for the child level to fall
    back on -- those categories are completely unidentifiable in the chart. Fix: add
    a persistent legend/callout for the outer ring''s larger-but-currently-unlabeled
    categories, or manually place the dropped labels via SVG post-processing (same
    technique as the hole punch), or reduce categories per department so all intended
    labels fit.'
  - The lightest tint step (TINT_STEPS[3] = 0.75 toward the elevated background) makes
    each department's smallest category very low-contrast against the page background,
    especially in light theme -- combined with the missing-label issue above, that
    data point becomes nearly invisible with no way to identify it. Cap the tint at
    a smaller max fraction (e.g. 0.55-0.6) to preserve contrast against the page background.
  - 'No radial spacing/gap between the inner aggregate ring and the outer category
    ring (spec note: ''Consider adding spacing between rings for visual separation'')
    -- minor and optional, but a thin gap would sharpen the two-level hierarchy read.'
  - The donut-hole punch relies on regex-scraping pygal's rendered SVG internals (specific
    'big_slice' path structure) to locate the wedge center/radius -- functional but
    brittle across pygal versions, and is the root cause of the hidden-total bug above.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "donut-nested · python · pygal · anyplot.ai" renders in dark ink at the top, clearly legible. Legend at the bottom lists the four departments (Engineering, Marketing, Operations, Sales) with matching color swatches, also legible. No grid/axes needed for a donut chart.
      Data: Two concentric rings around a punched-out center hole. Inner ring = 4 departments in canonical Imprint order (Engineering #009E73 green, Marketing #C475FD lavender, Operations #4467A3 blue, Sales #BD8233 ochre). Outer ring = child expense categories in lighter tints of the same parent hue. Value labels ($850K, $220K, $280K, $150K, $260K, $150K, $380K) appear on 7 of the larger child segments; the remaining 9 smaller child segments carry no label and no legend entry, making them unidentifiable. In the inner ring, only Engineering ($1300K) and Marketing ($580K) show their department total -- Operations' and Sales' totals are rendered but fall entirely inside the punched hole and are invisible.
      Legibility verdict: FAIL for completeness -- all visible text is crisp and correctly contrasted (no light-on-light), but roughly half the intended value labels (2 of 4 department totals, 9 of 16 child-category labels) never reach the viewer at all, which is a content-loss defect rather than a contrast defect.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title and legend, rendered in light ink (#F0EFE8-family), clearly legible against the dark surface. No dark-on-dark failures observed.
      Data: Identical hex colors to the light render for every department and tint step (only chrome flipped, as required). Same subset of labels visible and the same Operations/Sales total-hiding and 9-of-16 child-label-dropping issues persist unchanged from the light render.
      Legibility verdict: FAIL for completeness -- same content-loss defect as light render; theme-adaptation of chrome itself is correct.
