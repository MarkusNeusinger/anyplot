review:
  strengths:
  - All four department totals ($1300K/$580K/$540K/$600K) and all 8 top-category child
    labels now render correctly — both the hidden-total and dropped-label bugs flagged
    in the previous review are fully fixed via the self-computed overlay geometry.
  - 'The spec''s ‘labels on larger segments, legend for smaller ones’ requirement
    is now fully satisfied: the top-2 categories per department get on-ring labels,
    the other 8 get a clean two-row callout legend with color-matched swatches.'
  - Consistent hue-per-department color families (lerp_hex tinting) with the lightest-tint
    cap tightened to 0.60 (from 0.75 in the prior attempt), fixing the previous low-contrast
    smallest-category issue.
  - A new white/black ring-gap stroke visually separates the inner department ring
    from the outer category ring, addressing the spec's ‘spacing between rings’ suggestion.
  - 'Canonical Imprint palette order with brand green #009E73 on the first series;
    both renders are theme-correct (#FAF8F1 light / #1A1A17 dark backgrounds, adaptive
    ink tokens).'
  - Deterministic budget data with correct child-to-parent aggregation and a correctly
    formatted, title-length-aware scaled title.
  weaknesses:
  - 'Minor label collision: ''Events & Trade Shows ($150K)'' and ''Digital Advertising
    ($280K)'' child labels overlap where they meet near the Marketing wedge''s angular
    midpoint — the closing ''$150K)'' collides with the ''D'' of ''Digital Advertising'',
    visible in both light and dark renders. Both remain legible with effort but should
    be repositioned (stagger radius or nudge angularly, or shrink font slightly for
    long adjacent labels) to remove the collision.'
  - The two-row callout legend for the 8 smaller categories becomes quite small at
    mobile/thumbnail scale (~400px wide) — still technically legible but tight; consider
    a larger font or fewer columns to improve mobile readability.
  - The label-placement approach still regex-scrapes pygal's rendered SVG internals
    (the 'big_slice' path structure and the plot-group translate) to recover wedge
    geometry — functional and now correct, but brittle across pygal versions, same
    underlying technique flagged as a risk in the previous review.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "donut-nested · python · pygal · anyplot.ai" renders in dark ink at the top, clearly legible and comfortably within the canvas. Department legend row (4 swatches) and a two-row, 8-entry callout legend for smaller categories sit below the chart, all in dark ink, legible.
      Data: Two concentric rings around a punched-out center hole, separated by a thin theme-colored gap stroke. Inner ring = 4 departments in canonical Imprint order (Engineering #009E73 green, Marketing #C475FD lavender, Operations #4467A3 blue, Sales #BD8233 ochre), each with a bold centered department name + total ($1300K/$580K/$540K/$600K -- all four now visible, unlike the prior attempt). Outer ring = child expense categories in lighter tints of the parent hue (tint capped at 0.60). The top-2 categories per department are labeled directly on the ring (8 labels total: Salaries, Cloud Infrastructure, Digital Advertising, Events & Trade Shows, Facilities, Logistics, Commissions, Travel); the remaining 8 smaller categories are covered by the callout legend below. One minor overlap: "Events & Trade Shows ($150K)" and "Digital Advertising ($280K)" labels collide where they meet near the Marketing wedge boundary -- both still readable but visually crowded.
      Legibility verdict: PASS overall (all content now reaches the viewer, no light-on-light) with one minor overlap noted above; callout-legend text is small at mobile scale but readable at full size.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title, department legend, and callout legend, rendered in light ink (#F0EFE8-family), clearly legible against the dark surface. No dark-on-dark failures observed.
      Data: Identical hex colors to the light render for every department and tint step (only chrome flipped, as required, including the ring-gap stroke switching to a dark tone). Same label placement and the same minor "Events & Trade Shows" / "Digital Advertising" overlap persists unchanged from the light render.
      Legibility verdict: PASS overall, same minor overlap as the light render; theme-adaptation of chrome itself is fully correct.
