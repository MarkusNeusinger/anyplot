review:
  strengths:
  - Per-segment, luminance-computed label ink (not theme-based) keeps every label
    legible on every fill across both themes, since data colors never change
  - Consistent hue-family color stepping (same hue, increasing lightness) per parent
    category, exactly matching the spec's Notes guidance
  - Explicit shared sort_order field applied to all 4 layers prevents arc/label layers
    from rotating out of sync
  - Clean, spec-compliant canvas-padding logic (pads, never crops) matching the altair
    library's canvas discipline
  - Deterministic, realistic, well-scaled business data with correct child-to-parent
    aggregation
  weaknesses:
  - 'The "Software Licenses" label on the Americas outer ring overlaps the divider
    stroke into the neighboring "Consulting" wedge in both renders - the leading "S"
    reads as clipped. Likely cause: mark_text renders labels horizontally regardless
    of the wedge''s angular position, so a long label near a region where the wedge
    narrows tangentially can bleed into the adjacent segment. Shorten/wrap long outer
    labels, nudge the label radius outward, or suppress the label (falling back to
    legend/tooltip) when the wedge''s angular width at that radius is too small for
    the text.'
  - No legend fallback for unlabeled small segments (spec explicitly recommends "use
    legend for smaller ones") - Asia's "Training" segment (140) has no visible identifier
    anywhere in the static PNG. Add a compact legend (or leader-line labels) so every
    segment is identifiable without relying on the interactive tooltip.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1
      Chrome: Title "donut-nested · altair · anyplot.ai" bold and dark, clearly readable. No axis chrome (donut chart). Divider strokes between segments render as thin off-white lines.
      Data: Inner ring - Americas (#009E73, brand green, bold white label), EMEA (#C475FD, lavender, bold black label), Asia (#4467A3, blue, bold white label) - matches canonical Imprint order with first series #009E73. Outer ring - stepped-lightness tints of each parent hue for children, with per-segment computed label ink (dark or light chosen from that segment's own luminance). One defect: "Software Licenses" label (Americas outer ring) overlaps the divider stroke shared with "Consulting", the leading "S" appears clipped.
      Legibility verdict: PASS (with one localized label-overlap defect noted above; all other text fully readable)

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17
      Chrome: Title renders in light ink, clearly readable against the dark background. Divider strokes render as thin dark lines (theme-flipped from light render).
      Data: Identical fill colors to light render - Americas #009E73, EMEA #C475FD, Asia #4467A3 for inner ring, same stepped-lightness outer-ring tints. Per-segment label ink logic is independent of page theme, so every label that was legible in light remains legible in dark - no dark-on-dark failures. The same "Software Licenses"/"Consulting" label overlap reproduces identically in this render, confirming it is a geometry issue, not a theme issue.
      Legibility verdict: PASS (with the same localized label-overlap defect as the light render; no theme-specific legibility failures)
