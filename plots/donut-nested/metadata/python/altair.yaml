review:
  strengths:
  - Geometry-aware _label_fits check (validates both outer-radius overshoot and angular-boundary
    overshoot for both ends of the label) fully resolves the attempt-1 'Software Licenses'/'Consulting'
    boundary-overlap defect - verified fixed in both renders.
  - New invisible-mark legend-carrier layer gives every previously-unlabeled segment
    (including Asia's 'Training' wedge) a visible identifier, satisfying the spec's
    'use legend for smaller ones' requirement.
  - Per-segment, fill-luminance-computed label ink keeps every label legible on every
    color family in both themes, independent of page background.
  - Explicit shared sort_order applied across all 5 layers (inner ring, outer ring,
    inner labels, outer labels, legend) keeps arc/label/legend layers from rotating
    out of sync.
  - Clean, spec-compliant canvas-padding logic with a fail-loud SystemExit guard against
    overshoot instead of silently cropping.
  weaknesses:
  - The new _label_fits helper function deviates from the strict CQ-01 'no functions/classes'
    ideal - justified here since inlining the same per-row geometry check in a lambda
    would hurt readability, but it is a deviation from the KISS default.
  - Only 3 parent categories are used (spec range is 3-6) - valid but on the low end,
    understating the hierarchy depth the chart type can show.
  - The conservative _label_fits geometry check suppresses inline labels on some sizeable
    segments (e.g. Americas 'Software Licenses' at value 280) in favor of legend-only
    identification - correct and safe, but a slightly more permissive fit check could
    recover a few more inline labels.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 - correct, not pure white.
      Chrome: Bold dark title "donut-nested · altair · anyplot.ai" centered above the donut, clearly legible. No axes (donut chart). A horizontal legend bar sits below the chart with 4 swatch+label entries ("Americas: Software Licenses", "EMEA: Support Services", "Asia: Cloud Services", "Asia: Training"), rendered in dark text with a light box outline - fully readable.
      Data: Inner ring shows 3 parent wedges in canonical Imprint order - Americas (#009E73 green, bold white "Americas" label), EMEA (#C475FD lavender, bold dark "EMEA" label), Asia (#4467A3 blue, bold white "Asia" label). Outer ring shows each region's product-line children as stepped-lightness tints of the parent hue, with inline text labels ("Cloud Services", "Consulting", "Hardware", "Software Licenses") on segments that are both large enough and geometrically wide enough to hold the text; each label's ink color is chosen per-segment from that segment's own fill luminance. The previously-reported "Software Licenses"/"Consulting" boundary overlap on the Americas outer ring is gone - that segment is now correctly left unlabeled and identified via the legend instead. Asia's "Training" segment, unlabeled in attempt 1 with no fallback, now has a legend entry.
      Legibility verdict: PASS - no overlapping, clipped, or illegible text found anywhere in the render.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 - correct, not pure black.
      Chrome: Title renders in light/off-white text, clearly legible against the dark background. Legend box uses a dark fill with light text and a light outline - fully readable, no dark-on-dark failures.
      Data: All ring fill colors (green/lavender/blue inner ring, tinted outer-ring children) are pixel-identical to the light render - only the page background, divider strokes, and title/legend chrome flip. Label ink is computed from each wedge's own fill (not the page theme), so every data label - including "EMEA" in dark ink on its lavender wedge - remains just as legible here as in the light render. No dark-on-dark or light-on-light instances found. Brand green (#009E73, Americas) reads clearly on the dark surface.
      Legibility verdict: PASS - both renders are theme-correct and fully legible.
