review:
  strengths:
  - Native lets-plot geom_pie draws both rings with a shared start angle and direction,
    so child boundaries align with parent boundaries
  - Hue families per department with children lightened in value-rank order
  - Every segment carries a direct label inside its own wedge with no collision
  - Theme-adaptive title and center total readable in both themes
  weaknesses:
  - 'VQ-07 (both): strips at the left and right canvas edges (about 25 px) are left
    unpainted and show in a non-page color, not #FAF8F1 / #1A1A17 → paint the full
    canvas in the page color. Likely cause: coord_fixed without the one-panel gggrid
    wrap the library prompt prescribes.'
  - 'SC-02 (dark): the white default spacer lines between wedges cross the dark ring
    gap and stick out past the outer ring edge, so the spacing between rings is not
    even all the way around (C5) → spacer in the page color. Likely cause: geom_pie
    spacer_color left at its default.'
  - 'SC-02 (both): the two lightest Operations children, Logistics and IT Support,
    are near-identical lavenders and separable only by the stroke (C3) → visibly distinct
    lightness steps per child. Likely cause: lighten step 0.14 capped at 0.88 on #C475FD.'
  - 'VQ-05 (both): a four-sided grey frame encloses the plot area and leaves a wide
    empty band around the donut; the style guide keeps all four spines only where
    the plot type needs them → no frame, donut enlarged into the freed space. Likely
    cause: panel_border / panel_background color not blanked.'
  - 'VQ-01 (both): outer-ring labels in #4A4A44 on saturated fills reach only about
    1.6:1 (''Product Dev'' on #4467A3) to 2.7:1 (''Advertising'', ''Field Sales'')
    → at least 4.5:1, e.g. light ink on the darker fills. Likely cause: fixed DATA_LABEL_INK_SOFT
    for all outer labels.'
  - 'CQ-01 (code): two helper functions (lighten, with_mid_angle) instead of flat
    script code → inline as top-level statements. Likely cause: function-based structure.'
  - 'Suggestion: show each segment''s value (e.g. ''$18M'') under the outer labels
    for direct read-off.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 inside the plot, with thin unpainted strips at the left and right canvas edges and a four-sided grey frame around the plot area.
      Chrome: Title in dark ink at the top, center total 'Total $100M' in bold dark ink; no axes or grid.
      Data: Inner ring of 4 departments (Marketing #009E73, Operations #C475FD, R&D #4467A3, Sales #BD8233), outer ring of 10 lighter child tints; white strokes and a ring gap. Outer labels in soft grey, low contrast on the darker fills.
      Legibility verdict: PASS (with low-contrast outer labels noted)

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17 inside a grey frame, with lighter unpainted strips at the left and right canvas edges.
      Chrome: Title and center total in light ink, readable; no dark-on-dark chrome.
      Data: Same fills as light; white spacer lines between wedges cross the dark ring gap and protrude past the outer ring edge.
      Legibility verdict: PASS (with low-contrast outer labels noted)
