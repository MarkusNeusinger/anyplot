review:
  strengths:
  - Native geom_pie usage (lets-plot's distinctive donut/pie geom, no ggplot2 equivalent)
    draws two perfectly angle-aligned concentric rings sharing a start angle and total.
  - 'Consistent hue-family coloring: each department''s children lighten from the
    parent hue in value-ranked order, giving a second visual cue for the size hierarchy
    the wedge angles already encode.'
  - Clean, refined chrome — axes, ticks, grid, and legend fully removed; a generous
    ring gap and a bold 'Total $100M' center label anchor the visual hierarchy.
  - 'Correct Imprint palette compliance (first series #009E73, canonical color order)
    and theme-correct backgrounds/text/labels in both light and dark renders.'
  - Every wedge, including the smallest ('Inside Sales', $4M), is labeled directly
    on the segment, keeping the chart self-contained without needing a legend.
  weaknesses:
  - Two small helper functions (lighten, with_mid_angle) add structural complexity
    beyond the KISS 'no functions' ideal, though justified by the color-lightening
    and label-angle math they encapsulate.
  - The spec suggests using a legend for smaller segments; the implementation labels
    every segment directly instead, which reads well visually but deviates from the
    literal suggestion.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "donut-nested · python · letsplot · anyplot.ai" in dark ink, top-left aligned, fully readable. No axes, ticks, or grid lines (all blanked). Center label "Total $100M" in bold dark ink on the page background. Thin off-white strokes separate wedges and rings.
      Data: Two concentric rings — inner ring shows 4 departments (Marketing green #009E73, Operations purple, R&D blue, Sales amber), outer ring shows each department's expense-category children in a progressively lighter tint of the parent hue. Inner-ring labels are bold dark text directly on the wedges; outer-ring labels are soft dark-grey text on the lighter wedges. First series (Marketing) correctly uses Imprint green #009E73.
      Legibility verdict: PASS — all title, center label, and per-segment text is clearly readable against both the page background and the colored wedges.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title in light/white ink, fully readable against the dark background. Center label "Total $100M" in bold white text on the dark background. Wedge-separating strokes are now dark (matching PAGE_BG), producing a visible near-black gap between the two rings — an intentional design choice, not a rendering artifact.
      Data: Same four department hues and child tints as the light render — data colors are identical, only chrome (title, center label, stroke color) flips with the theme. Inner-ring labels remain bold dark text and outer-ring labels remain soft dark-grey text, both directly on the colored wedges (not on the page background), so they stay legible in both themes by design.
      Legibility verdict: PASS — no dark-on-dark failures; title and center label properly flip to light ink, and on-wedge labels retain sufficient contrast against their fixed-hue backgrounds in both themes.
