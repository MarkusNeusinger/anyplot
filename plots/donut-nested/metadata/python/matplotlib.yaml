    edge more tightly than the donut hugs the left. Minor -- not a rejection-level
    issue, but nudging bbox_to_anchor / right slightly inward would perfect the composition.'
  - Design Excellence is still capped by generic pie/donut geometry -- the alpha-ramp
    hue families and halo labels are a nice touch, but there is no additional focal
    emphasis (e.g. a single 'largest spend' callout) to push Data Storytelling beyond
    a default two-tier hierarchy.
