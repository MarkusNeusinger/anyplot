review:
  strengths:
  - 'Correct Imprint palette usage: departments map to canonical positions 1-4 (#009E73,
    #C475FD, #4467A3, #BD8233), first series is brand green as required'
  - Outer ring reuses each department's hue with a linear alpha ramp, giving a genuine
    'same hue family' relationship between parent and child segments in both themes
  - 'Clean two-tier data storytelling: bold, larger department labels in the inner
    ring vs. smaller category labels in the outer ring creates a clear visual hierarchy'
  - Halo path effect (pe.withStroke) keeps every wedge label crisp regardless of underlying
    segment color, in both light and dark renders
  - 'Correct theme-adaptive chrome: backgrounds, ink tokens, legend frame, and edge
    colors all flip correctly between plot-light.png and plot-dark.png with no dark-on-dark
    or light-on-light failures'
  - Canvas is exactly 2400x2400 (square, appropriate for a symmetric donut) with bbox_inches
    left at default, matching the hard canvas rule
  - Custom legend correctly enumerates every department:category pair with department-colored
    swatches, matching the actual counterclockwise wedge order
  - Labeling threshold (>= $100K) avoids clutter on small segments while still surfacing
    them via the legend
  - Realistic, neutral budget-allocation dataset with plausible dollar magnitudes
    across 4 departments and 3 categories each
  weaknesses:
  - 'Significant unbalanced whitespace: the donut+legend cluster occupies only the
    top ~60% of the square canvas (subplots_adjust bottom=0.30 vs top=0.88 gives a
    ~288px top margin but a ~720px empty bottom margin at 2400px canvas height), leaving
    roughly a third of the canvas visibly empty below the chart in both renders. Fix:
    shrink the bottom margin (e.g. bottom~0.08-0.12) or vertically center the axes
    bbox within the figure so top/bottom margins are symmetric, so the donut fills
    the square canvas more completely.'
  - Department label fontsize (11pt bold) and category label fontsize (7.5pt) work
    well now, but with the layout fix above there will be more room to scale the whole
    cluster up slightly, which would also improve legibility at small (400px) thumbnail
    sizes.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) across the full canvas — not pure white, not dark.
      Chrome: Title "donut-nested · python · matplotlib · anyplot.ai" centered at top in dark ink, fully readable. Legend box (top-right) has an off-white/elevated card background with a soft ink-toned border; legend text is dark and legible against it.
      Data: Nested donut with 4 department wedges in the inner ring (Engineering=green #009E73, Marketing=purple #C475FD, Operations=blue #4467A3, Sales=amber/brown #BD8233) and 12 category wedges in the outer ring using the same hue family per department at increasing alpha (lighter near the inner boundary, fuller opacity further out). Bold white-haloed labels ("Engineering $650K", etc.) sit in the inner ring; smaller haloed labels ("Salaries $450K", etc.) sit on outer segments >= $100K. First categorical series (Engineering) is Imprint green as required.
      Layout: The donut + legend cluster is pushed toward the upper ~60% of the square canvas; the bottom ~30-35% of the canvas is empty background with no content.
      Legibility verdict: PASS (all title, legend, and wedge-label text is clearly readable against the light background; no light-on-light issues).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) across the full canvas — not pure black, not light.
      Chrome: Title in light ink, clearly visible. Legend card uses the elevated dark background with a lighter border; legend text is light gray and legible.
      Data: Same wedge colors and alpha ramp as the light render — Imprint palette data colors are identical between the two themes, confirming only chrome changed. The narrow gap between inner and outer ring (edgecolor stroke) now renders as dark instead of light, correctly following the page background token.
      Layout: Same asymmetric layout as the light render — donut + legend occupy the upper ~60% of the canvas, with a large empty region at the bottom.
      Legibility verdict: PASS (title, legend, and wedge-label text are all light-colored and clearly readable against the dark background; no dark-on-dark failures found — the white halo behind wedge text keeps labels crisp against every segment shade).
