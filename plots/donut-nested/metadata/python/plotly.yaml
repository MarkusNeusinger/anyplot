review:
  strengths:
  - 'All three attempt-1 weaknesses are demonstrably fixed: a clear radial gap now
    separates the inner and outer rings (domain shrunk to [0.3776, 0.6624] vs. outer
    [0.16, 0.88]), the legend was pulled in (x=0.84) tightening the dead whitespace,
    and the largest segments (Engineering inner, Salaries outer) now carry an explicit
    focal-point treatment via bold text and a subtle pull-out.'
  - Precise domain math still aligns the inner ring's outer edge with the outer ring's
    inner boundary per parent segment, so child wedges visually nest exactly under
    their parent instead of drifting.
  - 'Consistent color families per parent (precomputed literal tints of each department''s
    Imprint hue) satisfy the spec''s hierarchy-coloring note while keeping the first
    series on brand green #009E73 in canonical Imprint order.'
  - Threshold-based labeling (>=5) places direct labels only on segments large enough
    to hold text, deferring small categories (Tools, Content, Training, IT Support)
    to the legend exactly per the spec's guidance.
  - Values aggregate correctly and verifiably from children to parents (e.g. Salaries
    22 + Infrastructure 12 + R&D 8 + Tools 3 = Engineering 45 = 45% of the $100M center
    annotation).
  - The lighten_hex() helper from attempt 1 was replaced with a precomputed literal
    color list, bringing the code back to a clean imports->data->plot->save KISS structure.
  - Full theme-adaptive chrome correctly threaded through INK/INK_SOFT/PAGE_BG/ELEVATED_BG
    tokens with identical data colors across both renders.
  weaknesses:
  - The Tools wedge (value=3, the smallest outer-ring slice) is still visually very
    thin next to its neighbors — acceptable since it correctly defers to the legend
    rather than a direct label, but it's the one slice where the tint is hard to distinguish
    at a glance.
  - A modest whitespace band still remains between the donut's right edge and the
    legend column (~9% of canvas width) — narrower than attempt 1 but could be tightened
    a touch further by nudging the outer domain right edge or legend x closer together.
  - The focal-point pull-out (0.04) on the Engineering/Salaries wedges is subtle at
    this radius; the bold text weight is what actually carries the emphasis — a slightly
    larger pull would make the pull-out itself more perceptible.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white, not dark — correct light-theme surface.
      Chrome: Dark-ink title "Company Budget Allocation · donut-nested · python · plotly · anyplot.ai" is crisp and fully visible at top, not clipped. Outer-ring category labels (Salaries, Infrastructure, R&D, Advertising, Events, Commissions, Travel, Facilities) sit outside the ring in dark ink and are clearly readable; smaller categories (Tools, Content, Training, IT Support) correctly defer to the legend instead of a direct label. Center annotation "$100M / Total Budget" is bold dark text, clearly legible in the donut hole. Legend on the right lists all 16 entries (4 departments + 12 categories) in dark-ink text on an elevated off-white panel with a visible border.
      Data: Inner ring = 4 departments in Imprint colors (Engineering #009E73 green, Marketing purple, Sales blue, Operations amber), each with white "name + percent" text. Outer ring = 12 expense categories rendered as progressively lighter tints of their parent department's hue, radially aligned with the parent boundaries. A clear radial gap now separates the inner and outer rings (visible white band), and the largest segments (Engineering inner, Salaries outer) are bolded and slightly pulled outward as a focal point. First series is confirmed #009E73.
      Legibility verdict: PASS — no light-on-light issues anywhere; all text (title, outer labels, center annotation, legend, inner-ring wedge text) reads cleanly against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black, not light — correct dark-theme surface.
      Chrome: Same title, same layout, now rendered in light/off-white ink and fully legible against the dark surface. Outer-ring labels, center annotation ("$100M / Total Budget" in light text), and legend entries all flip to light-on-dark correctly, with no dark-on-dark failures. Legend panel background flips to the dark elevated tone with a visible border, text stays legible.
      Data: Confirmed identical to the light render — Engineering green #009E73, Marketing purple, Sales blue, Operations amber on the inner ring, and the same tint families on the outer ring. Only chrome (background, text ink, legend panel, ring separator stroke) flipped; the wedge fill colors themselves are pixel-identical between the two renders. The same inner/outer ring gap and Engineering/Salaries focal-point treatment (bold text + pull) are preserved.
      Legibility verdict: PASS — no dark-on-dark failures found; inner-ring wedge text stays fixed white (by design) which reads fine on both saturated fills regardless of theme, and all chrome text uses the correct light-on-dark ink.
