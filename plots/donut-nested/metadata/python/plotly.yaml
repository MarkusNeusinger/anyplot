review:
  strengths:
  - Precise domain math aligns the inner ring's outer edge exactly with the outer
    ring's inner edge (hole=0.30/0.58 on domain [0.246,0.594] vs hole=0.58 on [0.12,0.72]),
    so parent/child boundaries line up cleanly instead of the common mismatched-hole
    artifact.
  - 'Consistent color families per parent (lighten_hex tints of the department''s
    Imprint hue for each child category) directly satisfies the spec''s hierarchy-coloring
    note while keeping the first series on brand green #009E73.'
  - Threshold-based labeling (outer_label_threshold=5) places direct labels only on
    segments large enough to hold text, deferring small categories (Tools, Content,
    Training, IT Support) to the legend — avoids crowding per the spec's guidance.
  - Values aggregate correctly and verifiably from children to parents (e.g. Salaries
    22 + Infrastructure 12 + R&D 8 + Tools 3 = Engineering 45), and the center annotation
    reinforces the $100M total.
  - Full theme-adaptive chrome (title, legend box, annotation, hover) correctly threaded
    through INK/INK_SOFT/PAGE_BG/ELEVATED_BG tokens with identical data colors across
    both renders.
  weaknesses:
  - No gap between the inner and outer rings — they touch directly (only a thin PAGE_BG-colored
    stroke separates them); the spec explicitly suggests 'consider adding spacing
    between rings for visual separation', and a small radial gap (e.g. inner hole/outer
    hole delta) would sharpen the two-level hierarchy read.
  - Noticeable dead whitespace between the donut and the legend column (roughly a
    quarter of the canvas width) while the legend sits flush near the right canvas
    edge — pull the legend closer to the chart or widen the plot domain to use that
    space, per VQ-05 balanced-whitespace guidance.
  - Data storytelling is purely structural (ring hierarchy + label threshold) with
    no emphasis distinguishing the standout category (Engineering/Salaries, the largest
    slice at 45%/22M) from the rest — a subtle stroke, pull-out, or bolder label weight
    on the top segment would sharpen the focal point.
  - The lighten_hex() helper function is a minor deviation from the KISS imports->data->plot->save
    structure (no functions/classes) — could be replaced with a precomputed literal
    color list without losing the tinting effect.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Dark-ink title "Company Budget Allocation · donut-nested · python · plotly · anyplot.ai" centered at top, clearly legible. Outer-ring category labels (Salaries, Infrastructure, R&D, Advertising, Events, Facilities, Travel, Commissions) render in dark ink around the donut, all readable. Bold dark "$100M / Total Budget" annotation sits centered in the donut hole, fully legible. Legend box (bordered, off-white "elevated" fill) on the right lists all 16 entries (4 departments + 12 categories) in dark-gray text, all legible.
      Data: Inner ring shows 4 departments — Engineering (green #009E73, 45%), Marketing (lavender #C475FD, 25%), Sales (blue #4467A3, 18%), Operations (ochre #BD8233, 12%) — matching Imprint canonical positions 1-4, with white "label + percent" text inside each wedge. Outer ring shows 12 expense categories as progressively lighter tints of their parent department's hue, aligned radially with the parent boundaries. Thin white strokes separate all wedges.
      Legibility verdict: PASS — no text is light-on-light; all chrome and data labels are clearly readable against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, outer-ring category labels, center "$100M / Total Budget" annotation, and legend text all render in light/off-white ink, clearly legible against the dark background. Legend box uses the dark "elevated" fill (#242420) with a soft border, text fully readable.
      Data: Same Imprint colors as the light render — Engineering green, Marketing lavender, Sales blue, Operations ochre for the inner ring, and matching lighter tints for the outer ring — confirming positions 1-8 stay theme-independent. Inner-ring wedge text stays fixed white (as in light render), which reads fine on both themes since it sits on saturated color fills, not on the page background.
      Legibility verdict: PASS — no dark-on-dark failures found; every title/label/tick/legend element uses the light INK/INK_SOFT tokens correctly.
