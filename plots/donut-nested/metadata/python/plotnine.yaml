review:
  strengths:
  - Correct nested-donut structure with two rings (parent region / child product line),
    value+share inner-ring labels, and per-parent tonal color families for children
    (consistent hue, varying lightness) matching the spec's guidance
  - 'Canonical Imprint palette (first ring = #009E73, canonical ordinal order for
    the abstract region category) with correct theme-adaptive backgrounds (#FAF8F1
    light / #1A1A17 dark) and CVD-safe categorical hues'
  - Small-share inner-ring segments (Latin America, Middle East & Africa) get dedicated
    angle-nudging and smaller-font handling to avoid label collisions — good attention
    to detail, though the same care was not extended to the outer ring where it was
    actually needed
  - Legend correctly reserved for outer-ring segments below the label threshold, matching
    the spec's 'labels on larger segments, use legend for smaller ones' guidance
  - Clean chrome (no axis/grid), correct mandated title format, fully deterministic
    code with no randomness needed
  weaknesses:
  - 'SEVERE (both light and dark renders): in the Asia Pacific outer ring, the ''Consulting''
    label directly crosses and overlaps the neighboring ''Cloud Services'' label —
    the two texts collide diagonally and are unreadable at the intersection. Outer-ring
    label placement (mid-angle at label_radius) doesn''t account for text width versus
    the narrow angular width of adjacent segments. Fix: extend the small-share font/threshold
    treatment already used on the inner ring to the outer ring (smaller font or legend
    fallback for narrow neighbors), or nudge mid-angles apart the same way small-share
    inner segments are nudged.'
  - 'Europe: the outer-ring ''Cloud Services'' label overlaps the Europe inner-ring
    value label (''$760M · 23%'') — both occupy the same pixel region. Worst in the
    dark render, where the similar light-toned text colors blend into an unreadable
    smudge; still visibly crowded in the light render. Inner-ring value-label positions
    and outer-ring segment-label positions are computed independently with no collision
    check between rings. Fix: shift Europe''s value label or the Cloud Services outer
    label radially/angularly apart.'
  - 'North America outer ring: the ''Cloud Services'' label is visibly clipped at
    both ends in the DARK render only (reads as ''oud Service'', missing leading ''Cl''
    and trailing letters) while the identical position renders fully legible in the
    light render. This looks like a theme-specific compositing/z-order issue (segment
    border stroke appearing to cut through the text) rather than a missing color token
    — investigate whether the polygon border (color=BORDER_COLOR) is drawing above
    the text layer in dark mode, or shrink the label so it no longer spans the segment
    boundary stroke.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct light-theme surface.
      Chrome: Title "donut-nested · python · plotnine · anyplot.ai" centered at top, dark ink, fully legible. No axis, no grid (intentional for a donut chart). Inner-ring parent labels (North America, Asia Pacific, Europe, Latin America, MEA) in bold dark text plus a lighter "$XXXM · XX%" value line beneath each — all legible. A manual legend (color swatch + text) sits in the lower-left margin for the three sub-threshold outer segments (Asia Pacific·Support, MEA·Cloud Services, MEA·Support) — legible.
      Data: Inner ring = 5 regions in canonical Imprint hues (North America #009E73 green, Asia Pacific purple, Europe blue, Latin America amber, MEA red). Outer ring = product-line children in lighter tonal tints of each parent's hue, separated by a thin gap/border from the inner ring. Two defects found: (1) Asia Pacific's outer "Consulting" label visibly overlaps/crosses the neighboring "Cloud Services" label — both unreadable at the collision; (2) Europe's outer "Cloud Services" label visibly crowds/touches Europe's inner "$760M · 23%" value label.
      Legibility verdict: FAIL — two outer-ring label collisions are present even in the light render (see above), independent of theme.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct dark-theme surface.
      Chrome: Same title, now in light ink, fully legible against the dark background. Inner-ring parent labels and value lines are in light/soft-gray ink, all legible. Legend text/swatches in the lower-left margin are legible against the dark background.
      Data: Data colors are identical to the light render (same Imprint hues and tonal tints for both rings) — only chrome (background/text) flipped, as required.
      Legibility verdict: FAIL — the same two label collisions from the light render are present and are worse here (Europe's "Cloud Services" vs. "$760M · 23%" become a barely-legible smudge because both texts use similarly light, low-contrast ink colors that blend together). Additionally, North America's outer "Cloud Services" label is clipped at both ends in this render only (reads "oud Service"), a theme-specific artifact not present in the light render.
