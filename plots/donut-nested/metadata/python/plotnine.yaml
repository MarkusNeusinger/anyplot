review:
  strengths:
  - Genuine nested donut built natively in plotnine via layered geom_polygon rings
    (no matplotlib workaround) — a real demonstration of grammar-of-graphics mastery
    for a chart type the library has no built-in geom for.
  - 'Correct Imprint palette: first parent segment is #009E73, remaining parents follow
    canonical order, and each parent''s children use lightened tonal shades of the
    same hue — exactly matching the spec''s ''consistent color families per parent,
    same hue varying lightness'' requirement.'
  - 'Both renders are fully theme-correct: FAF8F1/1A1A17 backgrounds, ink colors adapt
    via INK/INK_SOFT tokens, and data colors are pixel-identical between light and
    dark.'
  - Child values aggregate correctly to parent totals (verified arithmetic, e.g. North
    America 420+260+240+130=1050), and inner-ring labels pair value + percentage share
    for clear at-a-glance context.
  - Clean, deterministic, KISS-adjacent code with the correct canonical title format
    and correct plot-{THEME}.png output naming.
  weaknesses:
  - Spec explicitly calls for 'labels on larger segments, use legend for smaller ones,'
    but legend_position='none' plus scale_fill_identity() means the implementation
    has no legend at all — smaller outer-ring segments below the $100M label_threshold
    (e.g. Cloud Services and Support in Middle East & Africa) render as unlabeled
    colored wedges with no way to identify them.
  - Outer-ring segment labels are always colored INK_SOFT regardless of the underlying
    wedge's tint lightness — on the palest tonal tints (the most-lightened child shade
    in each family) this produces borderline-low contrast in both themes; text color
    should adapt to the specific wedge fill rather than a single global token.
  - Inner-ring label pairs for the two smallest adjacent parent segments (Latin America
    10% and Middle East & Africa 9%) sit close together with little breathing room
    between the two segments' name/value text blocks — increase label_dy or the label
    radius for segments below a share threshold to give them more separation.
  - Two custom helper functions (lighten_hex, create_annular_segment) depart from
    the pure KISS 'imports → data → plot → save' structure, though the geometry math
    genuinely needs the reuse.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "donut-nested · python · plotnine · anyplot.ai" in dark ink, centered top, fully readable. No axis lines, ticks, or grid (intentionally blanked, appropriate for a donut chart). Inner-ring labels (region name bold + "$XXXM · XX%" value) and outer-ring labels (product line names on larger segments) render in dark ink / soft gray respectively, both legible against the light background.
      Data: Nested rings — inner ring shows 5 regions (North America teal #009E73, Asia Pacific purple, Europe blue, Latin America ochre, Middle East & Africa red), outer ring shows product-line children in lighter tonal tints of each parent's hue. First categorical series is confirmed #009E73.
      Legibility verdict: PASS — all text is readable against the light background; minor crowding between the Latin America and Middle East & Africa label pairs (both small segments) but not unreadable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and inner-ring bold region names switch to light/white ink, clearly visible. Value and outer-ring labels use a lighter soft-gray token, readable against the dark page background. No dark-on-dark failures against the page background itself.
      Data: Same 5-region / tonal-tint color scheme as the light render — data colors are identical across themes, only chrome (background, ink) flips as expected.
      Legibility verdict: PASS overall — no dark-on-dark failures against the page background; flagged as a weakness (not an outright fail) that outer-ring labels use a single INK_SOFT gray regardless of the underlying wedge tint, which is borderline low-contrast on the very palest tonal wedges in this theme.
