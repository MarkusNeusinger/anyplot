review:
  strengths:
  - Inner-ring department labels now use the wedge-luminance-aware contrast_ink()
    helper (previously only applied to the outer ring), giving high-contrast text
    on both saturated (Engineering, Sales) and pastel (Marketing, Operations) wedges
    in BOTH themes
  - A compact legend now covers every outer segment below the 0.25-radian label-angle
    threshold (Content, Tools, Utilities), so no wedge is left unidentifiable in the
    static PNG
  - Genuine same-hue tint families built via HLS interpolation per department, keeping
    department identity readable while cleanly distinguishing children
  - Emphasis bump on the largest department (Engineering) creates a clear visual focal
    point without annotation clutter
  - Elevated center disc + "Total $2010K" callout, plus real inner/outer radius gaps,
    satisfy the spec's ring-separation note
  - Distinctive, idiomatic bokeh usage (annular_wedge, per-glyph HoverTool, LabelSet)
    with genuinely functional (not faked) hover tooltips in the HTML export
  weaknesses:
  - Four small helper functions (hex_to_rgb01, rgb01_to_hex, tint_family, contrast_ink)
    push this past pure KISS single-script style, though the color-science they implement
    (same-hue tint families, per-wedge contrast ink) is genuinely justified rather
    than gratuitous abstraction
  - Data storytelling relies on the emphasis bump + center total as the only hierarchy
    signal — no secondary visual device (e.g. ordering by value, subtle radial gridlines)
    reinforces the part-to-whole story further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), not pure white — correct.
      Chrome: Bold dark title "donut-nested · python · bokeh · anyplot.ai" centered at top, fully readable, ~53% of canvas width (well within the 50-70% guideline). No clipping at any edge — checked top, left, right margins directly, all have generous empty margin around the donut and legend.
      Data: Inner ring shows four departments (Engineering #009E73, Marketing #C475FD, Sales #4467A3, Operations #BD8233) in canonical Imprint order, first series = #009E73 as required. Outer ring shows same-hue tint families per department for expense categories. Engineering (largest, $800K) is nudged outward via the emphasis bump. Center shows "Total / $2010K" on an elevated off-white disc. A compact 3-row legend in the bottom-left corner covers the three below-threshold outer segments (Marketing·Content $60K, Sales·Tools $45K, Operations·Utilities $55K) with color swatches + labels.
      Legibility verdict: PASS — all department and category labels are clearly readable against their wedge fill; verified by direct pixel crop that "Marketing $430K" (pale purple wedge) uses dark ink and "Operations $330K" (mid-tone ochre wedge) uses light ink, both high-contrast.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), not pure black — correct.
      Chrome: Title renders in light ink, fully legible. Legend text uses the light INK token against the dark background, legible. Wedge separator lines flip to dark, as expected.
      Data: All wedge fill colors are pixel-identical to the light render — only chrome (background, title ink, legend ink, separator lines) flipped, confirming data colors never change per theme.
      Legibility verdict: PASS — this is the exact regression flagged in Attempt 1 (inner-ring department labels used the fixed theme INK token, causing ~2.5:1 contrast on the Marketing/Operations wedges) and it is now fixed. Direct pixel-crop verification: "Marketing $430K" still renders in dark ink on the pale purple wedge (luminance-based decision is theme-independent, matching the light render exactly) and "Operations $330K" still renders in light ink on the ochre wedge — both clearly legible, no dark-on-dark or light-on-light anywhere.
