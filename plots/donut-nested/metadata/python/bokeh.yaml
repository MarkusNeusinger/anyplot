review:
  strengths:
  - Genuine same-hue tint families built via HLS interpolation per department, keeping
    department identity readable while cleanly distinguishing children — a much more
    sophisticated palette approach than arbitrary per-child colors
  - Emphasis bump on the largest department (Engineering) creates a clear visual focal
    point/hierarchy without annotation clutter
  - Elevated center disc + 'Total $2010K' callout gives the donut a grounding focal
    point, and the inner/outer radius gaps create real ring separation per the spec's
    'consider adding spacing between rings' note
  - Distinctive, idiomatic bokeh usage (annular_wedge, per-glyph HoverTool, LabelSet)
    with genuinely functional hover tooltips in the HTML export — not fake/simulated
  weaknesses:
  - Inner-ring department labels use the fixed theme INK token instead of the per-wedge
    contrast_ink() helper already used for outer labels — in plot-dark.png, light
    INK text on the Marketing (#C475FD lavender) and Operations (#BD8233 ochre) wedges
    drops to roughly 2.5:1 contrast, below the 3:1 WCAG large-text minimum. Apply
    contrast_ink() to all four inner LabelSet entries, matching the outer-ring approach.
  - The smallest Marketing category ('Content', $60K, ~10.7 degree wedge) falls below
    the 0.25-radian label threshold and gets no on-chart label, and no legend exists
    anywhere in the chart — a static-PNG viewer has no way to identify that wedge.
    The spec explicitly notes 'use legend for smaller ones'; add a compact legend
    or leader-line callout for segments below the label threshold.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Bold dark title "donut-nested · python · bokeh · anyplot.ai" centered at top, clearly visible. Inner-ring department labels (Engineering, Marketing, Sales, Operations) and outer-ring category labels (Salaries, Equipment, Training, Cloud, Advertising, Events, Salaries, Travel, Facilities, IT Support) render in dark ink and are readable against both the saturated wedge colors and the pale tint wedges. Center "Total / $2010K" sits on a lighter elevated disc.
      Data: First/largest ring segment (Engineering) is Imprint brand green #009E73; Marketing is lavender #C475FD, Sales is blue #4467A3, Operations is ochre #BD8233 — canonical Imprint order. Outer-ring children use same-hue tints of their parent. Engineering wedge is nudged outward (emphasis bump) as the largest department.
      Legibility verdict: PASS — all visible text is readable in the light render.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title renders in light ink, clearly visible. Data-wedge colors are pixel-identical to the light render (green/lavender/blue/ochre), confirming only chrome flipped. Outer-ring category labels use a per-wedge computed ink color (contrast_ink()) and remain legible on both pale and saturated tints. However, the four INNER-ring department labels (Engineering/Marketing/Sales/Operations) use the fixed theme INK token (light text) rather than a contrast-aware color — on the Marketing (lavender) and Operations (ochre) wedges this produces noticeably reduced contrast (light text on a light/mid-tone saturated fill, approx. 2.5:1), a softer version of the "dark-on-dark" failure mode called out in the review instructions. Text is still legible to the eye (bold, large) but is a real accessibility/contrast regression versus the outer ring's own handling.
      Data: Confirmed identical to light render — only background/text/lines flipped.
      Legibility verdict: PASS with a flagged weakness — text is legible but contrast on 2 of 4 inner-ring labels falls below the 3:1 WCAG large-text threshold; see Weaknesses.
