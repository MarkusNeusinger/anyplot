review:
  strengths:
  - Correct theme-adaptive chrome — light and dark renders confirmed with identical
    data colors and properly flipped background/text/spine tokens.
  - 'Realistic, creative, neutral data scenario: gearbox vibration signal combining
    a shaft-speed chirp with a localized bearing-fault burst, directly reflecting
    the spec''s vibration-monitoring/fault-detection application.'
  - Clean compliance with canvas size, Imprint sequential palette, mandated title
    format, and axis labeling; colorbar clearly labeled with power units (dB).
  - Manual STFT implementation is a well-documented, reasonable workaround given no
    FFT package is available in the Julia CI runtime.
  weaknesses:
  - The -30 dB clamp floor combined with a clean low-noise signal produces a near-binary
    two-color heatmap (solid green background, thin blue ridges) with little visible
    gradation — widen the dynamic range (e.g. clamp at -50 or -60 dB) so the continuous
    colormap shows more textural nuance in the noise floor.
  - Beyond the baseline heatmap + Colorbar recipe, the implementation doesn't showcase
    distinctive Makie features (e.g. an annotation marking the fault burst, or custom
    colorbar tick formatting) to reinforce the vibration-monitoring narrative.
  - Title occupies only ~25-30% of the plot width, below the usual 50-70% guideline
    — not a clipping/overflow issue, but a slightly larger titlesize would better
    balance the composition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "spectrogram-basic · julia · makie · anyplot.ai" is dark charcoal and fully legible; "Time (s)" / "Frequency (Hz)" axis labels and tick labels are clearly visible in dark/muted-gray tones; colorbar on the right is labeled "Power (dB)" with legible ticks at 0, -10, -20, -30; top/right spines removed, no grid lines.
      Data: Heatmap dominated by a solid Imprint-green (#009E73) field representing the -30 dB noise floor, with a diagonal blue-toned ridge (toward #4467A3) tracking the rising shaft chirp from ~60 Hz to ~340 Hz, plus a small blue burst blob near t≈3s representing the bearing-fault event at ~620 Hz.
      Legibility verdict: PASS — no light-on-light or illegible text.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and axis labels render in light/white tone, clearly legible; tick labels and colorbar ticks render in light gray, clearly visible against the dark background; no dark-on-dark failures observed.
      Data: Same green field / blue chirp ridge / blue fault burst as the light render, confirming data colors are identical between themes and only chrome (background, text, spine colors) flipped.
      Legibility verdict: PASS — no dark-on-dark failures.
