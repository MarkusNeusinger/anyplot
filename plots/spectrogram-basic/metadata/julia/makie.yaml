review:
  strengths:
  - 'Correct STFT pipeline: Hann-windowed manual DFT, dB power scaling, clamped colorrange,
    and a properly labeled Colorbar with power units'
  - Distinctive fault-burst annotation (open circle + "bearing fault" text) that highlights
    the specific transient event — a genuine Makie touch beyond a bare heatmap
  - 'Theme chrome correctly threaded through Axis and Colorbar in both renders: spines/grid
    removed, INK/INK_SOFT tokens applied to title, labels, ticks, and annotation text'
  - 'Imprint sequential colormap (#009E73 to #4467A3) used correctly for the continuous
    power data, with identical data colors between light and dark renders'
  - Realistic, neutral gearbox-vibration scenario (rising shaft speed chirp + brief
    bearing-fault impact burst) with physically sensible sample rate, duration, and
    frequency values
  weaknesses:
  - Heatmap noise floor is fairly grainy/mottled across most of the canvas, which
    slightly dilutes the visual pop of the chirp and fault features against the background
  - Axis and colorbar tick density is a bit sparse (only 0/500/1000 Hz on the frequency
    axis, 10 dB steps on the colorbar) — a couple more tick marks would aid precise
    reading
  - Frequency axis stays linear; the spec suggests considering a log scale when a
    signal spans multiple octaves (optional here since the chirp stays within roughly
    one octave, but worth a note)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent with the light theme spec.
      Chrome: Title "spectrogram-basic · julia · makie · anyplot.ai" is bold dark text, clearly visible; "Time (s)" and "Frequency (Hz)" axis labels and 0/500/1000 and 1/2/3/4 tick labels render in dark ink and soft dark gray respectively, all legible; colorbar labeled "Power (dB)" with ticks from 0 to -50 in steps of 10, all readable; top/right spines removed, no gridlines, clean minimalist frame.
      Data: Heatmap uses a green (#009E73, low power/noise floor) to blue (#4467A3, high power) gradient — a rising diagonal chirp streak runs from ~40 Hz at t=0 to ~340 Hz at t=5s, and a short horizontal burst near 620 Hz around t=3s is circled and labeled "bearing fault" in dark ink. Colors match the described Imprint sequential palette.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent with the dark theme spec.
      Chrome: Same title, axis labels, tick labels, and colorbar label now render in light ink (#F0EFE8) / soft light gray (#B8B7B0), clearly visible against the dark background; no dark-on-dark text observed anywhere, including the "bearing fault" annotation text which flips to light ink.
      Data: Heatmap gradient (green to blue) and the diagonal chirp streak / fault-burst circle are visually identical in position, shape, and hue to the light render — confirms data colors did not change between themes, only chrome flipped.
      Legibility verdict: PASS
