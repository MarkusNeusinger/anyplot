  strengths:
  - STFT via scipy.signal.spectrogram with power in dB; the chirp ridge stands out
    strongly over the noise floor
  - Theme tokens on title, axes, ticks and color bar; data colors identical across
    themes
  - Color bar titled Power (dB), axes labelled with units
  weaknesses:
  - 'VQ-01, VQ-07 (dark): the caption renders near-black on the #1A1A17 background
    and cannot be read → INK_SOFT text, or drop the caption. Likely cause: plot_caption
    not set in the theme(), so it keeps the default black.'
  - 'VQ-05 (both): canvas is 4800x2700, not a canonical size → 3200x1800 (-1600 x
    -900). Likely cause: figure_size=(16, 9) with dpi=300 instead of 8x4.5 in at dpi=400.'
  - 'VQ-07 (both): the tiles use viridis, a colormap the style guide forbids → imprint_seq,
    scale_fill_gradient(low=''#009E73'', high=''#4467A3''). Likely cause: scale_fill_cmap(cmap_name=''viridis'').'
  - 'SC-04 (both): title ''spectrogram-basic · plotnine · anyplot.ai'' lacks the language
    segment → ''spectrogram-basic · python · plotnine · anyplot.ai''. Likely cause:
    the labs(title=...) string.'
  - 'DQ-01 (both): the sweep reads as a staircase of coarse blocks (64 ms x 7.8 Hz
    cells) instead of a continuous track (C4) → e.g. nperseg=256, noverlap=224. Likely
    cause: nperseg=128, noverlap=nperseg // 2.'
  - 'CQ-04 (code): the sys.path filter (line 12) and the noqa: E402 comments on every
    import have no effect on the render → delete them and import normally. Likely
    cause: a local workaround left in the script.'
  - 'Suggestion: tighter tile extents (expand=(0, 0)) would remove the empty band
    between the tiles and the panel border.'
