review:
  strengths:
  - scipy.signal.spectrogram with 75% overlap resolves the sweep as a continuous track
  - The chirp track stands out strongly against the noise field
  - Theme tokens threaded through all chrome; text readable in both themes
  - HTML export keeps lets-plot's native tile tooltips
  weaknesses:
  - 'VQ-05 (both): canvas is 4800x2700, not one of the canonical sizes → 3200x1800
    (-1600 x -900). Likely cause: ggsize(1600, 900) with ggsave scale=3 instead of
    ggsize(800, 450) with scale=4.'
  - 'VQ-07 (both): the power is drawn with viridis, which the style guide forbids
    → imprint_seq, scale_fill_gradient(low=''#009E73'', high=''#4467A3''). Likely
    cause: scale_fill_viridis.'
  - 'SC-04 (both): title ''spectrogram-basic · letsplot · anyplot.ai'' lacks the language
    segment → ''spectrogram-basic · python · letsplot · anyplot.ai''. Likely cause:
    the labs(title=...) string.'
  - 'CQ-01 (code): no column-0 # Data marker and no column constants for the signal
    and sample_rate roles → one marked Data block binding df, with one string constant
    per column role above it. Likely cause: column names typed where they are used.'
  - 'Suggestion: a slightly smaller window would make the track''s steps finer.'
