review:
  strengths:
  - scipy.signal.spectrogram with nperseg=256 / noverlap=200 resolves the 500 Hz burst
    as a narrow horizontal ridge and the chirp as a continuous track
  - imprint_seq colormap with percentile-clipped vmin/vmax keeps the noise floor visible
    beside the strong components
  - Color bar labeled Power/Frequency (dB/Hz) with themed ticks and outline; all chrome
    threaded through INK / INK_SOFT in both themes
  - Exact 3200x1800 canvas via figsize/dpi and subplots_adjust, no bbox_inches trimming
  weaknesses:
  - 'Suggestion: raising vmin toward the noise-floor median would push the background
    to the green end and give the blue chirp and burst ridges more contrast within
    imprint_seq.'
  - 'Suggestion: rasterized=True has no effect on a PNG-only output and could be dropped.'
  image_description: |-
