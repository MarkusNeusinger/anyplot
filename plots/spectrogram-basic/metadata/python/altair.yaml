review:
  strengths:
  - Correct Imprint sequential ramp (imprint_seq) for magnitude with a clamped dB
    domain at the 2 % quantile, so the noise floor shows beside the chirp instead
    of collapsing to one color
  - Idiomatic Altair heatmap via mark_rect with x/x2 and y/y2 bin edges, so every
    cell sits at its own time and frequency
  - Fully theme-adaptive chrome in both renders, legend on the elevated surface, canvas
    padded (never cropped) to 3200x1800
  - Native Altair tooltips with time, frequency and power for inspection in the HTML
    output
  weaknesses:
  - 'CQ-04 (code): lines 55-63 write the short-time Fourier transform out by hand
    (frame stacking, Hann window, np.fft.rfft, frame-centre times) → `freqs, times,
    Sxx = scipy.signal.spectrogram(signal, fs=fs, window=''hann'', nperseg=WINDOW,
    noverlap=WINDOW - HOP)` then 10*log10. Likely cause: hand-rolled STFT instead
    of the available SciPy call.'
  - 'Suggestion: a slightly finer y tick step (every 50 Hz) would make the chirp''s
    slope easier to read off.'
