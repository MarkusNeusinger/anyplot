  strengths:
  - 'imprint_seq built as the two-stop #009E73 -> #4467A3 ramp with a percentile color
    range, so the weaker 200-1200 Hz chirp stays visible beside the strong one'
  - scipy.signal.spectrogram with a window derived from the signal length resolves
    both sweeps as continuous tracks
  - Theme tokens threaded through every drawn text and line; the data colors are identical
    in both renders
  - Canvas exactly 3200x1800 with explicit, balanced font sizes
  weaknesses:
  - 'CQ-01 (code): six helper functions (lerp_hex, color_at, add_text, add_line, draw_spectrogram,
    set_cell_box, lines 25-160) structure what the KISS criterion asks to be flat
    script code → inline the cell, tick and color-bar loops into one drawing hook
    and keep at most the one function pygal''s plot hook needs. Likely cause: helper
    functions added for each SVG primitive.'
  - 'Suggestion: frequency ticks at round values (0, 400, 800, 1200, 1600, 2000 Hz)
    would read faster than the bin values 403, 806, 1194, 1597.'
