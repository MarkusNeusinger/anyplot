  strengths:
  - 'Imprint sequential ramp (#009E73 to #4467A3) mapped through bokeh''s LinearColorMapper
    and a native ColorBar titled Power (dB)'
  - Theme tokens threaded through every chrome element, including the color-bar panel,
    so both renders read cleanly
  - scipy.signal.spectrogram with a 256-sample window and 75% overlap resolves the
    linear chirp as a smooth continuous track
  - Canvas exactly 3200x1800 with min_border reservations, so no axis or title text
    is clipped
  weaknesses:
  - 'CQ-04 (code): IMPRINT_PALETTE (line 28) is defined but never used; only the sequential
    ramp is drawn → delete the constant. Likely cause: the categorical palette block
    copied from the library template.'
  - 'Suggestion: set the color mapper''s low end near the noise floor (for example
    a low percentile of Sxx_db) so the ridge separates more strongly from the background
    on the two-stop ramp.'
  - 'Suggestion: a HoverTool reporting time, frequency and dB would add value in the
    HTML view.'
