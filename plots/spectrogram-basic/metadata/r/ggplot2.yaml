review:
  strengths:
  - 'Technically correct STFT pipeline: Hann window, 128-sample hop (75% overlap),
    dB power scaling with a 60 dB dynamic-range clip, matching the spec''s guidance
    on window/overlap trade-offs.'
  - 'Full Imprint palette compliance: sequential fill gradient (#009E73 -> #4467A3)
    as required for continuous data, correct light/dark chrome tokens, and exact background
    colors (#FAF8F1 / #1A1A17) in both renders.'
  - Idiomatic geom_raster usage on a genuinely regular time-frequency grid, minimal
    chrome (no grid lines, no tick marks), generous whitespace, and canvas exactly
    3200x1800 as required.
  - Chirp trace (100 Hz -> 800 Hz over 4 s) reads clearly as the focal point in both
    themes; title format and axis labels (with units) are fully spec-compliant.
  weaknesses:
  - 'Design Excellence is only generic-plus: the mandated Imprint sequential gradient
    plus theme_minimal is the expected baseline, not an intentional design choice
    on top of it. Add a small deliberate touch (e.g. a subtitle noting FFT window/hop
    parameters, or a slightly refined legend treatment) to raise DE-01.'
  - The random noise floor renders as visually busy small-square speckles scattered
    across the whole panel, competing with the diagonal chirp trace for attention.
    Consider a mild smoothing pass or a slightly tighter dynamic-range floor (e.g.
    45-50 dB instead of 60 dB) to quiet the background without erasing real noise-floor
    structure, sharpening the visual hierarchy (VQ-03, DE-03).
  - Only one core geom (geom_raster) carries the whole plot; no other library-distinctive
    feature was attempted (e.g. a contour overlay tracing the ridge, or an annotation
    marking the chirp start/end frequency) to lift LM-02 beyond baseline heatmap usage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), consistent across the full canvas including the area behind the legend.
      Chrome: Title "spectrogram-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left, fully visible, not clipped. Axis titles "Time (s)" / "Frequency (Hz)" and tick labels (0-4 on x, 0-1000 on y) in dark/soft-dark ink, clearly legible. Legend "Power (dB)" with dashed ticks at 0/20/40 in a white-bordered elevated box, text legible.
      Data: Continuous raster fill using the Imprint sequential gradient — green (#009E73, low power) transitioning to blue (#4467A3, high power). A clear diagonal blue-green ridge rises from ~100 Hz at t=0 to ~800 Hz at t≈3.8s (the chirp), against a green-teal noise floor with scattered small darker/lighter speckles from the additive Gaussian noise.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), consistent across the full canvas including the area behind the legend.
      Chrome: Same title, axis titles, tick labels, and legend content as the light render, now rendered in light ink (#F0EFE8 for title/axis-titles/legend-title, #B8B7B0 for tick/axis text) against the dark background. Legend box uses an elevated dark fill (#242420) with a light-gray border.
      Data: Identical green-to-blue raster fill and diagonal chirp ridge as the light render — confirmed the data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark failures observed (title, axis text, and legend text all use light ink tokens, not dark ones).
