review:
  strengths:
  - Real short-time Fourier transform (Hann window, 512-sample window, 128-sample
    hop / 75% overlap) computed from an actual synthetic chirp signal, not a fabricated
    matrix
  - 'Correct use of the imprint_seq continuous gradient (#009E73 -> #4467A3) via scale_fill_gradient,
    matching the house rule that overrides the spec''s viridis/inferno suggestion'
  - Theme-adaptive chrome correctly threaded through plot.background, panel.background,
    axis text/title, legend background and text for both light and dark renders
  - Subtitle communicates STFT parameters (window size, hop, overlap %, dynamic range)
    which adds real analytical context beyond the minimum spec requirement
  - Dynamic range compression (48 dB floor) keeps the colorbar meaningful instead
    of being dominated by a few outlier bins
  - Clean axis labeling with units (Time (s), Frequency (Hz)) and a correctly formatted
    mandated title
  weaknesses:
  - The ridge-trace line (peak-power frequency per time step) is drawn in INK color
    at alpha=0.55/linewidth=0.35 directly on top of the already-blue high-power diagonal
    band, so it is barely distinguishable from the raster underneath and adds little
    visible storytelling value versus the effort of computing it — consider a higher-contrast/dashed
    treatment or a lighter color so it visibly traces the ridge as a distinct layer
  - The ridge-trace layer has no legend entry or annotation explaining what the thin
    line represents, so a reader has no way to know it's a computed peak-frequency
    trace rather than a rendering artifact
  - The noise-floor speckle (scattered small blotches across the green background)
    is realistic STFT output but reads as slightly busy/textured versus the catalog's
    usual clean minimal look — the existing 3-tap smoothing helps but doesn't fully
    quiet it; a slightly wider smoothing kernel or one more pass would tidy this without
    losing the ridge sharpness
  - smooth_1d() is a small custom helper function, which is a minor deviation from
    the KISS 'no functions' default even though it's a reasonable, narrowly-scoped
    data-prep utility used twice
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the anyplot light-theme spec, not pure white.
      Chrome: Title "spectrogram-basic · r · ggplot2 · anyplot.ai" in dark ink at top-left, clearly legible. Axis titles "Time (s)" and "Frequency (Hz)" in dark ink, tick labels (0,1,2,3 / 0,200,...,1000) in softer grey, all readable. Legend box "Power (dB)" sits at right with an off-white/elevated fill and a thin border, tick marks at 0/20/40 clearly legible.
      Data: Full-canvas raster heatmap. Background noise floor renders as a teal-green field (low power, near #009E73) with a diagonal band trending from ~100 Hz to ~800 Hz in blue (~#4467A3) tracing the chirp's rising instantaneous frequency — matches the imprint_seq gradient. Scattered faint speckle across the green field reflects the STFT noise floor. A thin ridge-trace overlay line sits on the diagonal but is hard to distinguish from the blue band beneath it.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the anyplot dark-theme spec, not pure black.
      Chrome: Title and axis titles render in light off-white ink, tick labels in a lighter grey — good contrast against the dark background, no dark-on-dark issues. Legend box fill is the dark "elevated" tone with a light border, "Power (dB)" text and tick numbers (40/20/0) clearly legible.
      Data: Identical raster content and colors to the light render — same green noise floor and blue chirp ridge (#009E73 -> #4467A3), confirming data colors are unchanged across themes; only the chrome (background, text, legend fill) flipped as required.
      Legibility verdict: PASS
