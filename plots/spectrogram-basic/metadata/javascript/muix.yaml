review:
  strengths:
  - Correctly implements the Imprint sequential colormap (t.seq[0] to t.seq[1]) as
    a custom two-stop gradient for the heatmap cells and colorbar, with data colors
    identical between light and dark renders.
  - Builds a genuine time-frequency heatmap via ChartContainer + useXScale/useYScale/useDrawingArea
    hooks (MUI X community has no native heatmap component) backed by a real deterministic
    STFT (Cooley-Tukey FFT, Hann window, seeded LCG signal) rather than faked/randomized
    cell data.
  - 'Theme-adaptive chrome is correct in both renders: warm off-white / near-black
    backgrounds, dark-on-light and light-on-dark text all readable, no clipped elements
    at any canvas edge.'
  - The chirp signal against the noise floor gives an immediate, legible focal point
    that matches the spec's description of a spectrogram.
  - Axes and colorbar are labeled with units (Time (s), Frequency (Hz), Power (dB))
    and the title follows the exact mandated format.
  weaknesses:
  - Colorbar shows only the two endpoint labels (-6 dB / -66 dB) with no intermediate
    tick marks — a scientific dB colorbar benefits from 3-5 graduated labels so readers
    can map color to value without interpolating by eye.
  - Axis tick labels (the numeric values along X/Y) rely on MUI X's default font size
    — only the title, axis labels, and colorbar text have an explicit fontSize — so
    the implementation doesn't earn full marks for fully explicit sizing.
  - The X-axis renders 25 tick labels at 0.1 s spacing, which reads a bit dense/busy;
    thinning to every 0.2-0.5 s would give a cleaner look.
  - Example data shows a single clean chirp only; a faint secondary harmonic or brief
    amplitude dip would better demonstrate the range of features a spectrogram can
    reveal.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark — matches the required light-theme surface.
      Chrome: Title "spectrogram-basic · javascript · muix · anyplot.ai" centered at top in dark ink, fully visible with no clipping. "Frequency (Hz)" rotated label on the far left, "Time (s)" centered below the x-axis, "Power (dB)" rotated label to the right of the colorbar. All chrome text renders in dark ink against the light background and is clearly legible; grid lines are absent (clean, minimal chrome) and axis ticks are dark and readable.
      Data: A time-frequency heatmap using a two-stop Imprint sequential gradient — brand green (#009E73-family) for low power (noise floor, most of the canvas) blending to blue-purple for high power (the chirp ridge). A single diagonal streak rises from ~150 Hz at t=0 to ~1600 Hz at t=2.4s, clearly visible against the textured green noise-floor background. Colorbar on the right shows the gradient from -6 dB (top, blue) to -66 dB (bottom, green).
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light — matches the required dark-theme surface.
      Chrome: Same title, axis labels, and colorbar text, now rendered in light/off-white ink against the dark background. All chrome elements (title, "Frequency (Hz)", "Time (s)", "Power (dB)", axis ticks, colorbar dB labels) are clearly legible — no dark-on-dark failures observed anywhere, including near the canvas edges.
      Data: Same diagonal chirp heatmap; the green-to-blue-purple gradient colors are visually identical to the light render (only the page/chrome flipped), confirming the data palette does not change between themes.
      Legibility verdict: PASS — all text is clearly readable against the dark background, no dark-on-dark failures.
