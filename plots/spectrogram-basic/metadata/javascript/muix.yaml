review:
  strengths:
  - 'The spectrogram is built inside MUI X''s composition API: ChartsContainer with
    linear axes, and a custom SVG cell layer that reads useXScale/useYScale so every
    STFT cell sits at its frame-centre time and its bin frequency'
  - The Hann window of 256 samples (64 ms, 15.6 Hz bins) with 75 % overlap resolves
    the 150→1600 Hz chirp as a narrow, continuous diagonal track, with no coarse blocks
  - Power is calibrated to dB re full scale (coherent-gain normalisation) over a 60
    dB dynamic range, so the noise floor shows as visible texture instead of a flat
    field
  - Uses the imprint_seq gradient (t.seq) for both the cells and the colour bar, with
    chrome (ink/inkSoft) taken from theme tokens; readable in both themes
  - A subtitle states the analysis parameters (sample count, rate, window, hop, bin
    width) in a softer ink below the mandated title, which gives a clear typographic
    hierarchy
  - skipAnimation is set and the component is sized to window.ANYPLOT_SIZE; the noise
    comes from a deterministic fixed-seed LCG
  weaknesses:
  - 'Suggestion: the colour bar is hand-drawn as an SVG gradient; check whether a
    zAxis colorMap with MUI X''s community ContinuousColorLegend can express it natively.'
  - 'Suggestion: a second steady tone in the example signal would also show the ''narrow
    horizontal ridge'' case the spec describes.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white page (#FAF8F1) around a full-bleed spectrogram image; not pure white.
      Chrome: bold dark title "spectrogram-basic · javascript · muix · anyplot.ai" centred at top (~32 % width), grey subtitle with the STFT parameters below it; y axis "Frequency (Hz)" 0–2,000, x axis "Time (s)" 0.2–2.4, vertical colour bar on the right labelled "Power (dB re full scale)" with ticks -60 to -10. All text is dark on light and readable.
      Data: about 153×129 STFT cells in the imprint_seq gradient; the noise floor sits near brand green #009E73 with a mottled teal texture, and the linear chirp is a continuous narrow blue (#4467A3) diagonal track from ~170 Hz at 0 s to ~1,590 Hz at 2.47 s. No overlays.
      Legibility verdict: PASS

