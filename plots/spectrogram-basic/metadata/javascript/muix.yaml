review:
  strengths:
  - 'Clever library-mastery workaround: since MUI X community has no native heatmap
    component, the implementation combines ChartContainer with useXScale/useYScale
    hooks and a hand-rolled radix-2 Cooley-Tukey FFT + Hann-windowed STFT to render
    a genuine time-frequency heatmap — a distinctive technique well beyond basic chart
    usage.'
  - 'Correct Imprint palette compliance: continuous power data uses the imprint_seq
    (green→blue) gradient exactly as specified, both renders show theme-correct #FAF8F1/#1A1A17
    backgrounds with theme-adaptive chrome, and a custom colorbar clearly labels the
    dB scale and units.'
  - Deterministic reproducibility via a seeded LCG noise generator (no Math.random),
    spec-compliant title format, and correct data mapping (time on x, frequency on
    y, full signal duration and Nyquist-bounded frequency range both shown).
  weaknesses:
  - STFT resolution is coarse — WINDOW=64 yields only 32 frequency bins across the
    0-2000 Hz range, and HOP=150 yields ~67 time frames across 2.5 s — giving the
    heatmap a visibly blocky/pixelated look rather than a smooth continuous spectrogram.
    Increase WINDOW (e.g. 256-512) and reduce HOP relative to WINDOW for finer time-frequency
    resolution and smoother visual gradation along the chirp trace.
  - Design Excellence is solid but not fully refined — the noise floor covers the
    entire background in a fairly uniform green with no additional visual hierarchy
    beyond the chirp trace and colorbar; consider a subtle dB dynamic-range adjustment
    or slightly higher contrast between noise floor and signal to sharpen the focal
    point.
  - The hand-drawn colorbar and y-axis label are precisely positioned but rely on
    fixed pixel offsets (e.g. `top - 46`, `left - 68`) rather than measured text metrics
    — fine at the current title/label lengths, but worth a note for future regeneration
    robustness if the title or axis label text ever grows.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "spectrogram-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. X-axis "Time (s)" labeled 0.0-2.5 s, Y-axis "Frequency (Hz)" labeled 0-2000 Hz (rotated label at far left). Colorbar at right labeled "Power (dB)" with "-6 dB" at top and "-61 dB" at bottom. All chrome text renders in dark ink against the light background.
      Data: Heatmap cells go from teal-green (low power / noise floor) to blue-purple (high power). A clear diagonal band rises from ~150 Hz at t=0 to ~1600 Hz at t=2.5s, showing the linear chirp. First/only continuous-data series correctly uses the imprint_seq (green→blue) gradient, not the categorical palette.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels, and colorbar as the light render, but rendered in light ink/off-white text against the dark background. Fully legible, no dark-on-dark issues.
      Data: Identical green-to-blue heatmap coloring and diagonal chirp trace as the light render — confirms data colors are held constant across themes while only chrome (background + text color) flips.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no black-on-black or otherwise illegible elements found.
