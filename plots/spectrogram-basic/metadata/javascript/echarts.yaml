review:
  strengths:
  - Hand-rolled STFT (Hann window + radix-2 FFT) with a deterministic LCG noise generator
    produces a textbook linear-chirp spectrogram entirely in-memory, with no RNG and
    no external DSP dependency.
  - Correct use of the Imprint sequential colormap (t.seq, brand green → blue) via
    visualMap, with data colors identical between the light and dark renders and fully
    theme-correct chrome (background, title, axis, tick colors) in both.
  - Evenly-sampled, non-overlapping axis tick labels (Time in seconds, Frequency in
    Hz) with clear units, avoiding the classic spectrogram problem of cluttered time/frequency
    ticks.
  - Idiomatic ECharts heatmap + continuous visualMap pattern (the library's documented
    approach for time-frequency plots), plus progressive rendering for the large heatmap
    dataset.
  weaknesses:
  - The visualMap colorbar overlaps the heatmap's right edge — its '0 dB' and '-80
    dB' text labels render on top of heatmap data pixels instead of sitting cleanly
    in the margin. Increase grid.right (currently 40) and/or move the visualMap further
    right / shrink it so the colorbar and its labels sit fully outside the plot area.
  - 'Design Excellence sits at ''well-configured default'': the plot is technically
    correct but doesn''t go beyond a plain heatmap + colorbar. Consider a small storytelling
    touch (e.g. a markLine tracing the chirp ridge, or a subtitle distinguishing the
    chirp band from the noise floor) to create a clearer focal point.'
  - 'Library Mastery is generic: heatmap + visualMap is the standard idiomatic ECharts
    pattern (good), but the implementation doesn''t lean on a feature distinctive
    to ECharts beyond `progressive`. Consider something like a custom tooltip formatter
    for dB values or dataZoom, which ECharts makes easy but the static PNG can still
    hint at.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "spectrogram-basic · javascript · echarts · anyplot.ai" centered at top, clearly readable. "Time (s)" axis title centered below the x-axis, "Frequency (Hz)" axis title rotated along the y-axis, both in dark ink. Tick labels (0.00-2.80s on x, 0-3719 Hz on y) are evenly sampled, non-overlapping, and rendered in a slightly lighter ink than the axis titles. A vertical visualMap colorbar sits at the far right labeled "0 dB" (top) and "-80 dB" (bottom) with a green-to-blue gradient swatch; its labels overlap slightly onto the heatmap's right edge instead of sitting fully in the margin.
      Data: The heatmap fills most of the canvas with a speckled teal-green field (broadband noise floor) crossed by a smooth blue-violet diagonal band rising from low frequency at t=0 to ~2900 Hz near t=2.9s — a clean linear chirp. The noise-floor color matches the low end of the sequential palette (green, #009E73) and the ridge trends toward the high end (blue, #4467A3), consistent with the mandated imprint_seq colormap.
      Legibility verdict: PASS (title, axis titles, and tick labels are all clearly readable against the light background; the only issue is the visualMap labels landing on the heatmap edge, which is an overlap/layout note, not an illegibility issue).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render, but title and axis titles now render in light ink (~#F0EFE8) and tick labels / colorbar text in a softer light gray (~#B8B7B0). No dark-on-dark text was found anywhere in the render.
      Data: The teal-green noise floor and blue-violet chirp ridge are visually identical to the light render — only the chrome (background, text) flipped, confirming the sequential data colors are theme-independent as required.
      Legibility verdict: PASS (all title, axis, and tick text is clearly legible against the dark background; same minor visualMap-label overlap onto the heatmap edge as in the light render, not a legibility failure).
