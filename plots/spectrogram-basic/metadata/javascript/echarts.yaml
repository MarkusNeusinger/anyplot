review:
  strengths:
  - 'The Review 1 blocking issue is fully fixed: the visualMap colorbar and its "0
    dB"/"-80 dB" labels now sit cleanly in the right margin (grid.right widened, visualMap
    moved to right: 20), with zero overlap onto the heatmap in either theme.'
  - New subtitle ("Linear chirp 200 Hz → 3000 Hz rising through a broadband noise
    floor") adds a storytelling anchor that names what the viewer is looking at, lifting
    Design Excellence above a bare heatmap+colorbar.
  - Hand-rolled STFT (Hann window + radix-2 Cooley-Tukey FFT) with a deterministic
    LCG noise generator produces a textbook linear-chirp spectrogram entirely in-memory,
    with no RNG and no external DSP dependency.
  - Correct use of the Imprint sequential colormap (t.seq, brand green → blue) via
    visualMap, with data colors identical between the light and dark renders and fully
    theme-correct chrome in both.
  - Evenly-sampled, non-overlapping axis tick labels (Time in seconds, Frequency in
    Hz) with clear units and a well-balanced canvas fill (~65-70%).
  weaknesses:
  - 'Design Excellence is still close to a well-configured default: the layout/coloring
    itself wasn''t restyled this round, only the subtitle was added and the margin
    bug was fixed. A markLine or thin annotation tracing the chirp ridge would push
    Data Storytelling further.'
  - The chirp signal is clean but the only feature shown is a single rising tone plus
    flat broadband noise; a second overlapping harmonic or a brief amplitude modulation
    would demonstrate more of what a spectrogram can reveal (Feature Coverage).
  - Library Mastery is still generic beyond the idiomatic heatmap+visualMap pattern
    (progressive rendering aside); no ECharts-distinctive feature (e.g. custom tooltip
    formatter for dB values, markLine/markArea) has been added yet.
  - fft() and nextNoise() are necessary helper functions for a from-scratch STFT,
    but they remain a deviation from the flat import→data→plot KISS script structure
    expected elsewhere in the catalog.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "spectrogram-basic · javascript · echarts · anyplot.ai" centered at top, with a lighter dark-ink subtitle "Linear chirp 200 Hz → 3000 Hz rising through a broadband noise floor" beneath it. "Time (s)" axis title below the x-axis, "Frequency (Hz)" rotated along the y-axis, both in dark ink. Evenly-sampled, non-overlapping tick labels (0.00–2.80 s / 0–3719 Hz). The visualMap colorbar sits cleanly in the right margin, fully clear of the heatmap, labeled "0 dB" (top) / "-80 dB" (bottom) with a green-to-blue-violet gradient swatch — no overlap onto plot data (Review 1's blocking issue is fixed).
      Data: Speckled teal-green noise floor (Imprint sequential low end) crossed by a smooth blue-violet diagonal chirp ridge (Imprint sequential high end) rising from ~200 Hz at t=0 to ~2900 Hz at t≈2.9 s — exactly matching the described chirp.
      Legibility verdict: PASS — all title, subtitle, axis, tick, and colorbar text is clearly readable against the light background; no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as the light render, with title/subtitle/axis titles now in light ink and tick/colorbar text in a softer light gray. Colorbar remains cleanly clear of the heatmap in the right margin.
      Data: The teal-green noise floor and blue-violet chirp ridge are visually identical to the light render (verified by direct crop comparison of the colorbar region) — only chrome flipped, confirming the sequential data colors are theme-independent.
      Legibility verdict: PASS — no dark-on-dark text anywhere; all chrome elements are clearly legible against the near-black background.
