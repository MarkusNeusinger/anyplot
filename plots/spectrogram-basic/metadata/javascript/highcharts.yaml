review:
  strengths:
  - Colorbar now labels four dB values (0, -20, -40, -60) instead of only the two
    endpoints from Attempt 1 — the requested repair was applied cleanly and readers
    can now estimate intermediate values along the gradient.
  - Manual heatmap rendering via the SVG renderer (r.rect) combined with an invisible,
    matched-axis scatter overlay recovers a genuine native Highcharts tooltip — a
    legitimate, non-faked workaround for the core bundle's missing heatmap module
    rather than a shortcut to another library.
  - Real Hann-windowed direct-DFT STFT computed over a deterministic swept-sine chirp
    signal; the diagonal frequency ramp reads instantly and is a textbook-appropriate
    example for the spec.
  - Correct imprint_seq (green->blue) continuous colormap for single-polarity dB power
    data, matching the style guide's continuous-data rule.
  - Theme-adaptive chrome threaded correctly through title, subtitle, axis labels,
    tick labels, and colorbar text from window.ANYPLOT_TOKENS; both renders fully
    legible with identical data colors.
  weaknesses:
  - The hand-rolled heatmap still needs several small helper functions (hexToRgb,
    lerp, powerFill, frameTime, binFreq, clearDrawn/drawAll) to draw cells, axis text,
    and the colorbar manually — justified by the missing heatmap module, but a touch
    more structural complexity than a basic spec ideally needs.
  - Design excellence is still close to a functional/engineering-driven look rather
    than a polished editorial one; a subtle focal annotation near the ridge's peak
    amplitude or a slightly refined colorbar frame would push aesthetic sophistication
    further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "Swept-Sine Test Tone · spectrogram-basic · javascript · highcharts · anyplot.ai" with a gray subtitle describing the chirp parameters below it. "Frequency (Hz)" axis title top-left, "Time (s)" axis title bottom-center, dark tick labels along both axes (0-1,607 Hz; 0.01-1.98 s). Vertical "Power" colorbar on the right now labeled with FOUR dB values (0, -20, -40, -60 dB), up from only the two endpoints in Attempt 1. All chrome elements clearly readable against the light background.
      Data: Dense grid of green-to-blue cells forms a diagonal band rising from lower-left to upper-right — the chirp's instantaneous frequency sweep. Colors run from #009E73 (quiet) to a blue (#4467A3, loud), matching the Imprint imprint_seq stops.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title/subtitle/axis-title/tick-label/colorbar layout, now in light cream/gray text — all crisp and legible, no dark-on-dark occurrences. Colorbar again shows four dB tick labels.
      Data: The green-to-blue diagonal heatmap band and colorbar gradient are pixel-identical to the light render, confirming only chrome flipped between themes.
      Legibility verdict: PASS
