review:
  strengths:
  - Manual heatmap rendering via the SVG renderer (r.rect) combined with an invisible,
    matched-axis scatter overlay recovers a genuine native Highcharts tooltip — a
    legitimate, non-faked workaround for the core bundle's missing heatmap module
    rather than a shortcut to another library.
  - Real Hann-windowed direct-DFT STFT computed over a deterministic swept-sine chirp
    signal; the diagonal frequency ramp reads instantly and is a textbook-appropriate
    example for the spec.
  - Correct imprint_seq (green→blue) continuous colormap for single-polarity dB power
    data, matching the style guide's continuous-data rule — no viridis/inferno substitution
    despite the spec text suggesting it.
  - Theme-adaptive chrome threaded correctly through title, subtitle, axis labels,
    tick labels, and colorbar text from window.ANYPLOT_TOKENS; both light and dark
    renders are fully legible with identical data colors.
  - Colorbar with dB units, axis titles with units (Time (s), Frequency (Hz)), and
    the mandated '{title} · spectrogram-basic · javascript · highcharts · anyplot.ai'
    format are all present and correct.
  weaknesses:
  - Colorbar only labels its two endpoints (0 dB / -60 dB) with no intermediate ticks
    — add 1-2 mid-scale labels (e.g. -20 dB, -40 dB) so readers can estimate values
    along the gradient instead of just the extremes.
  - The hand-rolled heatmap needs several small helper functions (hexToRgb, lerp,
    powerFill, frameTime, binFreq, clearDrawn/drawAll) to draw cells, axis text, and
    the colorbar manually — justified by the missing heatmap module, but a touch more
    structural complexity than a 'basic' spec ideally needs; a short comment tying
    CHART_MARGIN/CELL_W/CELL_H together would help future maintenance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white surface, consistent with #FAF8F1 (not pure white, not dark).
      Chrome: Bold dark title "Swept-Sine Test Tone · spectrogram-basic · javascript · highcharts · anyplot.ai" at top, medium-gray subtitle describing the chirp parameters below it. "Frequency (Hz)" axis title top-left, "Time (s)" axis title bottom-center, dark tick labels along both axes (0, 321, 643, 964, 1,286, 1,607 Hz; 0.01–1.98 s), and a vertical "Power" colorbar on the right labeled "0 dB" / "-60 dB". All chrome text is clearly readable against the light background — no light-on-light issues.
      Data: A dense grid of green-to-blue cells forms a diagonal band rising from lower-left (low freq, early time) to upper-right (high freq, late time) — the chirp's instantaneous frequency sweep. Quiet background cells are the brand green #009E73; the loud diagonal ridge is blue #4467A3, matching the imprint_seq gradient described in the code.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black surface, consistent with #1A1A17 (not pure black, not light).
      Chrome: Same title/subtitle/axis-title/tick-label/colorbar layout, now rendered in light cream/gray text against the dark background. Title and subtitle are crisp and legible; axis tick labels and colorbar dB labels are clearly visible with no dark-on-dark occurrences anywhere.
      Data: Identical green-to-blue diagonal heatmap band and colorbar gradient as the light render — data colors are unchanged between themes, confirming only chrome flipped.
      Legibility verdict: PASS
