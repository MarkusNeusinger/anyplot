review:
  strengths:
  - Mathematically correct windowed STFT (Hann window + precomputed twiddle factors)
    drives a real spectrogram, not a simulated heatmap
  - 'Repair correctly targeted the prior review''s VQ-03 weakness: narrowing dynamicRangeDb
    from 60 to 45 dB makes the fainter 2x bearing-fault harmonic band clearly visible
    near the top-right of both renders without changing anything else'
  - Colorbar and heatmap cells share the exact same dB-to-color mapping function,
    so the legend and data are always consistent
  - Chart.js has no native heatmap type; the implementation stays within core chart
    types (uses `scatter` purely as a canvas host) and adds a custom afterDatasetsDraw/afterDraw
    plugin to draw cells and a hand-built colorbar with ticks and a rotated axis label
    — an idiomatic, no-workaround solution per the library's own guidance
  - 'Realistic, neutral domain scenario: machinery vibration chirp (fundamental ramp
    20->150 Hz) plus a 2x bearing-fault harmonic and noise floor, a textbook spectrogram
    feature-coverage case'
  - Theme-adaptive chrome (title, axis titles/ticks, colorbar labels/stroke) correctly
    threaded through window.ANYPLOT_TOKENS; data colors (imprint_seq green->blue)
    are pixel-identical between light and dark renders
  - Reproducible via a fixed-seed LCG, the correct approach given the browser has
    no seeded RNG
  - 'Clean canvas layout: no clipping at any edge, generous colorbar spacing via layout.padding,
    well-balanced margins'
  weaknesses:
  - colorForDb/mixHex still interpolates the seq[0]->seq[1] gradient in raw sRGB space;
    this matches the style guide's literal two-stop build recipe, but a perceptually-uniform
    blend would make the harmonic band's midtones read even more distinctly against
    the noise floor
  - mixHex + colorForDb plus a two-hook plugin object add more structure than the
    KISS 'no helper functions' ideal; justified by the need to hand-roll a heatmap,
    but still worth noting
  - Frequency axis stays linear despite spanning 0-355 Hz with both the fundamental
    and its 2x harmonic; the spec suggests considering a log frequency axis for multi-octave
    spans (optional per spec wording, not a compliance failure)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white.
      Chrome: Bold dark title "spectrogram-basic · javascript · chartjs · anyplot.ai" centered at top, ~55% of plot width. "Frequency (Hz)" and "Time (s)" axis titles and their tick labels render in dark ink / soft dark gray. Colorbar on the right labeled "Power (dB)" (rotated) with tick values from "11 dB" down to "-34 dB", all in the same soft ink tone. No grid lines (deliberately omitted for a clean heatmap).
      Data: Heatmap fills the plot area with a green-to-blue gradient (#009E73 for low power up to #4467A3 for high power). A prominent diagonal band rises from ~20-40 Hz at t=0 to ~150 Hz at t=2.8s (the chirp fundamental of a simulated machinery speed ramp-up). A second, fainter diagonal band is visible in the upper-right region (roughly 250-300 Hz at t>2s) — the 2x bearing-fault harmonic, now clearly readable after the repair narrowed dynamicRangeDb from 60 to 45 dB.
      Legibility verdict: PASS. All text is readable against the light background; no clipping at any canvas edge (verified via pixel crops of all four sides).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black.
      Chrome: Same title, axis titles, tick labels and colorbar labels now render in light ink / soft light gray, clearly legible against the dark background. No dark-on-dark failures observed anywhere (title, axes, ticks, colorbar all correctly flipped).
      Data: Heatmap and colorbar data colors are identical to the light render (#009E73 -> #4467A3) — only chrome (background, text, colorbar stroke) flips between themes, as required. Same rising fundamental band and the now-visible fainter 2x harmonic band appear in the same positions as the light render.
      Legibility verdict: PASS. All text is readable against the dark background; no clipping at any canvas edge.
