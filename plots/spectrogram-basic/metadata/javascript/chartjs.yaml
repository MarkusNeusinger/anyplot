review:
  strengths:
  - Mathematically correct windowed-DFT/STFT (Hann window + precomputed twiddle factors)
    producing an accurate spectrogram, not a fake/simulated heatmap
  - Colorbar and heatmap cells share the exact same dB-to-color mapping function,
    with a correctly ordered gradient (low power = green, high power = blue) matching
    between chart and legend
  - Chart.js has no native heatmap type; the implementation stays within core chart
    types (uses 'scatter' purely as a canvas host) and adds a custom afterDatasetsDraw/afterDraw
    plugin to draw cells and a hand-built colorbar — an idiomatic, no-workaround solution
  - 'Realistic, domain-appropriate signal: chirp fundamental + 2x bearing-fault harmonic
    + noise, modeling a machinery vibration speed-ramp-up; the rising diagonal band
    (and a fainter 2x harmonic band) is visible in both renders'
  - Theme-adaptive chrome correctly threaded throughout (title/axis titles use t.ink,
    ticks/colorbar text use t.inkSoft) while data colors stay identical between light
    and dark renders
  - Reproducible via a fixed-seed LCG, appropriate since the browser has no seeded
    RNG
  - 'animation: false set, single canvas mounted cleanly, no stray DOM nodes'
  weaknesses:
  - colorForDb/mixHex interpolates the seq[0]->seq[1] gradient in raw sRGB space rather
    than a perceptually-uniform space, so the gradient's midtones read slightly duller/muddier
    than a true CAM02-UCS imprint_seq blend would
  - The secondary bearing-fault harmonic band (2x fundamental) is present in the underlying
    data but quite faint against the noise floor at the current color contrast/dynamic
    range — consider narrowing dynamicRangeDb or boosting contrast slightly so the
    harmonic story is more visually obvious
  - mixHex + colorForDb plus a two-hook plugin object add more structure than the
    KISS 'no helper functions' ideal; reasonably justified by the need to hand-roll
    a heatmap, but still worth noting
  - Frequency axis stays linear despite spanning a fairly wide range (0-355 Hz, chirp
    20-150Hz plus its 2x harmonic to ~300Hz); the spec suggests considering a log
    frequency axis for multi-octave spans
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white, not dark. Correct.
      Chrome: Bold dark title "spectrogram-basic · javascript · chartjs · anyplot.ai" centered at top, clearly readable. Y-axis "Frequency (Hz)" and X-axis "Time (s)" labels in dark ink, ticks in a softer dark gray — all legible against the light background. Colorbar on the right labeled "Power (dB)" with tick values from 11 dB (top) down to -49 dB (bottom), all readable.
      Data: Heatmap fills the full plot area with a green-to-blue gradient (first/base color #009E73 brand green for low power, blending to #4467A3 blue for high power). A diagonal blue band rises from ~20 Hz at t=0 to ~150 Hz at t≈2.8s (the chirp fundamental, matching the "machinery speed ramp-up" scenario), with a fainter second diagonal band visible higher up (the modeled 2x bearing-fault harmonic). Background noise floor shows a subtle green speckle texture consistent with the added random noise term.
      Legibility verdict: PASS — all title/axis/tick/colorbar text is clearly readable against the light background, no light-on-light text found.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black, not light. Correct.
      Chrome: Same title, axis titles, and tick labels now rendered in light ink/soft-light gray, clearly legible against the dark background. Colorbar labels and "Power (dB)" text also switch to light chrome and remain fully readable — no dark-on-dark failures observed.
      Data: Heatmap and colorbar gradient are pixel-identical to the light render (#009E73 -> #4467A3), confirming only chrome flips between themes, not data colors. Same rising diagonal chirp band and fainter harmonic band visible.
      Legibility verdict: PASS — all chrome text reads clearly against the dark background; no dark-on-dark or light-on-light legibility failures in either render.
