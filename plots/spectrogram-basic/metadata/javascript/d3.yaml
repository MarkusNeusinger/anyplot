review:
  strengths:
  - Real from-scratch STFT pipeline (Hann window, radix-2 FFT, dB conversion relative
    to peak) rather than a canned/faked spectrogram — demonstrates genuine library
    and DSP mastery.
  - Y-axis correctly spans the full Nyquist range (0-2000 Hz for a 4000 Hz sample
    rate) and the x-axis matches the actual analyzed duration, so no data is hidden
    or cropped.
  - Colorbar is properly labeled with units ("Power (dB)") and its gradient/scale
    direction matches the data scale (0 dB at top, -70 dB floor at bottom) exactly.
  - Deterministic LCG-seeded noise makes the chirp signal fully reproducible with
    no external dependencies, in line with the offline-browser constraint.
  - Uses only Imprint sequential tokens (t.seq) for the continuous color scale and
    correct theme-adaptive chrome (ink/inkSoft/grid) — palette compliant in both themes.
  weaknesses:
  - 'Visible seam/mesh artifact between every single heatmap cell in BOTH renders
    — thin lighter/darker hairlines outline each rect across the entire plot area,
    giving the whole spectrogram a distracting ''graph paper'' look instead of a smooth
    continuous color field. This is the classic D3 adjacent-rect anti-aliasing seam.
    Fix: give each cell a small sub-pixel overlap (e.g. `.attr(''width'', cellWidth
    + 0.5).attr(''height'', cellHeight + 0.5)`) or set `shape-rendering: crispEdges`
    on the heatmap group, and verify at full 3200x1800 resolution that no hairlines
    remain between cells.'
  - 'Element Visibility (VQ-03) and Visual Refinement (DE-02) are both held back by
    this seam pattern: the actual signal (the diagonal chirp trace) has to compete
    visually with a uniform noise-flecked grid texture covering the whole canvas,
    which is a real quality regression from an otherwise clean implementation.'
  - Consider a log-frequency axis (spec explicitly suggests it for signals spanning
    multiple octaves) or slightly larger colorbar tick labels (currently 13px) for
    a bit more polish, though neither is a hard requirement here.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct light-theme surface.
      Chrome: Title "spectrogram-basic · javascript · d3 · anyplot.ai" centered top in dark bold text; "Time (s)" x-axis label and "Frequency (Hz)" y-axis label in dark ink; tick labels (0-2,000 Hz on y, 0.0-2.5 s on x) rendered in soft dark gray. A right-side colorbar is labeled "Power (dB)" with ticks from "0 dB" (top) to "-70 dB" (bottom). All chrome text is clearly readable against the light background.
      Data: A diagonal band of purple/blue cells rising from ~200 Hz at t=0 to ~1500 Hz at t≈2.9s (the linear chirp) stands out against a teal/green noise-floor background, matching the two-stop Imprint sequential palette. However, a fine grid-like seam pattern (thin hairlines) is visible between every adjacent heatmap cell across the whole plot area — a rendering anti-aliasing artifact, not part of the data.
      Legibility verdict: PASS (all text readable; the seam artifact is a visual-quality issue, not a legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct dark-theme surface.
      Chrome: Same title, axis labels, and tick labels now rendered in light/soft-white ink against the dark background — all clearly legible, no dark-on-dark issues. Colorbar labels and ticks are equally legible.
      Data: Same diagonal chirp trace, same teal/green-to-blue/purple sequential colors as the light render — data colors are confirmed identical between themes, only chrome (background/text/grid) flipped as required. The same cell-seam mesh artifact from the light render is present here too (visible as slightly darker hairlines outlining each cell), confirming it is a rendering issue independent of theme.
      Legibility verdict: PASS (no dark-on-dark text; the seam artifact is the same visual-quality issue noted in the light render).
