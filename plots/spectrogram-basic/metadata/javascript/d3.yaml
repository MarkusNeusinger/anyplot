review:
  strengths:
  - 'The attempt-1 fix (sub-pixel cell overlap + shape-rendering: crispEdges) fully
    eliminated the hairline seam artifact - verified by pixel-level zoomed crops of
    both renders at native 3200x1800 resolution; the heatmap now reads as a smooth,
    continuous color field.'
  - Real from-scratch STFT pipeline (Hann window, radix-2 FFT, dB conversion relative
    to peak) rather than a canned/faked spectrogram.
  - Y-axis correctly spans the full Nyquist range (0-2,000 Hz for a 4,000 Hz sample
    rate); x-axis matches the actual analyzed duration.
  - Colorbar is properly labeled with units (Power (dB)) and its scale direction matches
    the data (0 dB at top, -70 dB floor at bottom).
  - Deterministic LCG-seeded noise makes the signal fully reproducible with no external
    dependencies.
  - Correct theme-adaptive chrome and Imprint sequential palette in both themes -
    no clipping at any canvas edge.
  weaknesses:
  - Chrome stays close to the library-skeleton defaults (standard D3 axis domain lines,
    no extra visual-refinement flourishes) - a bit more restraint/polish on axis styling
    could lift DE-02 further.
  - Log-frequency axis (spec's "consider" suggestion, given the chirp spans ~3 octaves)
    was not used - not a hard requirement, but would improve DQ-01/feature coverage.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Title "spectrogram-basic · javascript · d3 · anyplot.ai" centered top in dark bold text; "Time (s)" and "Frequency (Hz)" axis labels and tick labels (0-2,000 Hz, 0.0-2.5+ s) in dark/soft-dark ink; colorbar labeled "Power (dB)" with ticks 0 dB to -70 dB. All readable, no clipping at any edge (checked via zoomed crops of title, colorbar, bottom axis, left axis).
      Data: Diagonal band of blue-violet cells rising from ~200 Hz to ~1,500 Hz across the signal duration (the linear chirp) against a teal/green noise floor, using the Imprint seq (2-stop) sequential scale. Zoomed native-resolution crops confirm no hairline seams between adjacent heatmap cells (the attempt-1 defect is fixed) - color field reads as smooth and continuous.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Same title, axis labels, tick labels, and colorbar now in light ink - all clearly legible. No dark-on-dark issues found.
      Data: Same diagonal chirp trace, identical teal-to-blue-violet data colors as light render (only chrome flipped, as required). Zoomed crops confirm no seam artifact here either.
      Legibility verdict: PASS
