review:
  strengths:
  - 'Composes the quiver from MUI X v9 building blocks: ChartsDataProvider with linear
    x/y axes, a custom SVG mark layer that reads useXScale/useYScale, and a zAxis
    continuous colorMap read through useZColorScale, so arrows, axes and color bar
    share one scale system'
  - 'ContinuousColorLegend bound to the same zAxis gives a native color bar titled
    ''Magnitude (m/s)'' in imprint_seq (#009E73 to #4467A3), identical in both themes'
  - One length scale for the whole field (longest vector = 0.85 grid spacing) and
    a square drawing area with one span on both axes, so directions and relative lengths
    read true and no arrow reaches its neighbor
  - Tail-anchored arrows with heads that scale down for short vectors; the zero vector
    at the center is drawn as a small dot, which the spec permits
  - 'Rankine-vortex data (solid-body core inside 3.2 km, 1/r decay outside) produces
    a visible ring of strongest winds; checked: the maximum grid speed 22 * sqrt(10)
    / 3.2 = 21.7 m/s matches the subtitle and the color-bar maximum'
  - Two-level typographic hierarchy (22 px semibold title, 15 px inkSoft subtitle
    stating grid size and length scale) with theme tokens throughout; skipAnimation
    set
  weaknesses:
  - 'Suggestion: the gap between the subtitle and the top of the drawing area (about
    90 CSS px) is larger than the gap below the x-axis title; shifting the square
    up slightly would balance the vertical whitespace.'
  - 'Suggestion: a key arrow (for example 10 m/s) beside the color bar would give
    the arrow length an explicit scale, which the spec allows.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1; no pure white.
      Chrome: dark semibold title "Cyclonic Wind Field · quiver-basic · javascript · muix · anyplot.ai" (~57% of width), grey subtitle "225 grid points 1 km apart · arrow length proportional to magnitude, longest 21.7 m/s", left and bottom axis lines only, no grid, y title "North of storm center (km)", x title "East of storm center (km)", ticks -7..7 on both axes. All readable.
      Data: 15x15 grid of tail-anchored arrows rotating counterclockwise around the origin; a dot at the center, longest arrows on the ring at r about 3 in #4467A3 blue, weaker outer and inner arrows in green-teal toward #009E73. A vertical color bar at the right, titled "Magnitude (m/s)", runs from 0 (green) to 21.7 (blue).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, consistent with #1A1A17; no pure black.
      Chrome: title, subtitle, axis titles, tick labels and axis lines flip to light ink/inkSoft; no dark-on-dark text anywhere; color-bar labels light.
      Data: arrow colors and color bar identical to the light render (imprint_seq green to blue); only chrome flips. Brand green end clearly visible.
      Legibility verdict: PASS
