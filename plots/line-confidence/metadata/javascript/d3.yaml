review:
  strengths:
  - Confidence band correctly built with d3.area + curveMonotoneX and fill-opacity
    0.25, squarely inside the spec's suggested 0.2-0.4 alpha range
  - 'Palette compliant: first series is the mandated #009E73 from window.ANYPLOT_TOKENS,
    band and line share the same hue (satisfies the spec''s ''contrasting but related
    colors'' guidance via opacity contrast)'
  - Legend clearly and separately labels the central line ('Forecast') and the shaded
    band ('90% Prediction Interval')
  - Y-axis-only gridlines and undecorated left/bottom axis domains keep the chrome
    minimal and uncluttered
  - Title exactly matches the mandated 'line-confidence · javascript · d3 · anyplot.ai'
    format
  - Both themes render correctly with identical data colors and only chrome (background,
    ticks, text) flipping - no dark-on-dark or light-on-light failures
  - No edge clipping in either render; canvas is exactly 3200x1800 (landscape target)
  - Deterministic fixed-seed LCG for the synthetic forecast noise, clean flat procedural
    code with no unused imports
  weaknesses:
  - Title font is a modest 30px, giving the mandated title string noticeably less
    visual weight/width (~40% of plot width) than the style guide's expected ~70-85%
    for a title this length - consider ~38-44px for stronger hierarchy without risking
    overflow
  - Design excellence is competent but generic for this chart type - no additional
    device (e.g. an annotation calling out the widening uncertainty over time, or
    subtle markers at key inflection points) reinforces the data story beyond the
    band shape itself
  - Legend swatch for the band is a flat rectangle with no border - a thin outline
    matching the band's edge would tie it more clearly to the shaded region on both
    themes
  - Distinctive D3 features are limited to curveMonotoneX smoothing and area/line
    composition; nothing further differentiates a hand-authored D3 solution from a
    generic sparkline-with-band chart (e.g. no gradient fill, no clip-path reveal,
    no HTML-side hover readout of interval bounds)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
      Chrome: Bold centered title "line-confidence · javascript · d3 · anyplot.ai" in dark ink at the top; "Month" x-axis label and rotated "Units Sold (forecast)" y-axis label in dark ink; tick labels (Jan '25 ... Oct '26 on x, 400-800 on y) in a softer dark gray; subtle horizontal gridlines only on the y-axis. Legend top-left with a green line swatch labeled "Forecast" and a light-green rectangle swatch labeled "90% Prediction Interval". All text is clearly readable against the light background - no light-on-light issues.
      Data: A single prominent teal-green trend line (#009E73-family) tracing a rising-with-seasonal-wobble forecast from ~480 to ~680 units, surrounded by a semi-transparent light-green confidence band that visibly narrows around month ~8 and widens substantially toward month ~15-18, communicating growing forecast uncertainty.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light/white-ish tones against the dark background; gridlines are a subtle dark-gray, still visible but unobtrusive. Legend uses the same layout with light text labels, clearly legible.
      Data: The trend line and confidence band use the identical underlying green hue as the light render (only appearing visually brighter due to the dark surround, which is expected color-perception contrast, not a different color value) - band shape and line path are pixel-identical to the light render.
      Legibility verdict: PASS - no dark-on-dark failures observed; all text and data elements are clearly distinguishable from the near-black background.
