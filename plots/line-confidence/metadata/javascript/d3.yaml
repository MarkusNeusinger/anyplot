review:
  strengths:
  - Custom gradient-fill confidence band that visually reinforces growing forecast
    uncertainty over time — a distinctive D3 technique using a linearGradient tied
    to the x-axis
  - Clear annotation explicitly calling out the widening-interval insight, directly
    guiding the reader to the storytelling point
  - 'Clean minimal chrome: y-axis-only gridlines, no unnecessary spines/box, generous
    whitespace, explicit font sizing throughout'
  - Correct Imprint palette usage identical across themes; both light and dark renders
    are fully readable with proper theme-adaptive chrome
  - Legend cleanly identifies both the central line and the confidence band with custom-built
    swatches placed near the plot
  weaknesses:
  - Confidence-band gradient opacity dips to 0.12 at the start of the series, below
    the spec's suggested 0.2-0.4 alpha range — clamp the low end to >=0.2 so the band
    stays clearly visible near the origin
  - Margins are asymmetric (left 110 vs right 60, top 110 vs bottom 90); while partly
    justified by the rotated y-axis label, tightening the imbalance would improve
    visual balance
  - The dashed annotation connector line is very short and subtle — a slightly longer
    or bolder connector would draw the eye more effectively to the exact widening
    region
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "line-confidence · javascript · d3 · anyplot.ai" centered at top, clearly readable. X-axis labeled "Month" with quarterly tick labels (Jan '25, Apr '25, ... Oct '26); Y-axis labeled "Units Sold (forecast)" with numeric ticks 400-800. Subtle horizontal gridlines only. Legend top-left shows a green line swatch labeled "Forecast" and a translucent green box swatch labeled "90% Prediction Interval". An italic annotation "Interval widens as the forecast horizon grows" with a short dashed connector sits above the band on the right side.
      Data: Central forecast line in solid #009E73 (Imprint green), rising from ~480 to ~750 over 24 months with a seasonal wave. Confidence band in the same green hue with opacity that increases left-to-right (gradient fill), visually showing the growing uncertainty.
      Legibility verdict: PASS — all text (title, axis labels, ticks, legend, annotation) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same layout as light render, but title, axis labels, tick labels, legend text and annotation are all rendered in light/white tones, clearly legible against the dark background. Gridlines remain subtle.
      Data: Central line and band use the identical #009E73 green data color as the light render (only chrome — background, text, grid — flips); the band appears as a darker, muted green fill because the same opacity values sit over a near-black backdrop, which is expected alpha-blending behavior, not a data color change.
      Legibility verdict: PASS — no dark-on-dark failures observed; all text is clearly legible, and the brand green line/band remain visible and consistent with the light render.
