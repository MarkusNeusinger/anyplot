review:
  strengths:
  - Y-axis now zoomed to the data range (3,800–6,000) instead of starting at 0, making
    the trend and the widening confidence band far more visually prominent — directly
    resolves the prior review's VQ-05/DE-02 wasted-space weakness
  - New dashed 'Forecast begins' markLine at day 30 visualizes the previously-invisible
    observed/forecast split, giving Data Storytelling (DE-03) a clear focal point
    that was computed in code but never rendered before
  - Idiomatic stacked-area confidence-band trick (transparent 'Lower Bound' + 'Prediction
    Interval' series) remains correctly bounded; legend and tooltip formatter still
    correctly exclude the invisible helper series
  - 'Both themes remain fully theme-correct: identical brand-green (#009E73) data
    color, correct #FAF8F1/#1A1A17 backgrounds, all chrome legible in both renders
    with no dark-on-dark or light-on-light failures'
  - Deterministic seeded LCG data generation retained; flat KISS script structure
    with no functions beyond the tiny RNG helper
  weaknesses:
  - Confidence band still uses the same brand-green hue as the trend line, distinguished
    only by opacity (0.25) rather than a distinct-but-related Imprint hue (e.g. a
    blue-toned band) — the spec explicitly suggests 'contrasting but related colors';
    opacity-only differentiation is an accepted idiom but a second Imprint hue would
    read more clearly at a glance, especially in dark mode where the band blends toward
    near-black
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark.
      Chrome: Title "Daily Active Users Forecast · line-confidence · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible, correctly proportioned for the long title (no overflow, no clipping). Legend below title with two rounded swatches ("Predicted Active Users" solid green, "Prediction Interval" pale green). Y-axis name "Daily Active Users" top-left in soft ink; y-axis now ranges 3,800–6,000, tightly framing the data instead of starting at 0. X-axis shows date labels (Jan 1, Jan 6, ... Feb 25) at readable size with no overlap. A vertical dashed line labeled "Forecast begins" marks day 30 (Jan 31), clearly separating the observed window from the forecast horizon. Horizontal grid lines only, subtle gray, no vertical gridlines.
      Data: Bold brand-green (#009E73) trend line with a pale semi-transparent green band around it; band visibly widens after the "Forecast begins" marker, consistent with prediction intervals growing with lead time.
      Legibility verdict: PASS — all text (title, legend, axis labels, tick labels, markLine label) is clearly readable against the light background. The prior zero-baseline whitespace issue is resolved; the plot area now fills the majority of the canvas.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light.
      Chrome: Same title, legend, axis labels, tick labels, and "Forecast begins" markLine, now in light ink/soft-gray tones, fully legible against the dark background. No dark-on-dark text anywhere.
      Data: Identical brand-green (#009E73) trend line color to the light render; band renders as a darker teal fill due to alpha-blending with the dark background — expected theme-adaptive behavior, not a data-color change.
      Legibility verdict: PASS — no dark-on-dark or illegible elements found. Same well-utilized layout as the light render.
