review:
  strengths:
  - Uses the idiomatic ECharts stacked-area trick (transparent 'Lower Bound' + 'Prediction
    Interval' band) to render a real, correctly-bounded confidence band rather than
    an approximation
  - Confidence band genuinely widens across the forecast horizon (days 30-59), matching
    the 'prediction intervals grow with lead time' behavior described in the code's
    own comment
  - Clean legend with rounded swatches that correctly excludes the invisible lower-bound
    helper series; tooltip formatter also filters it out
  - Both themes fully readable — warm off-white/near-black backgrounds correctly rendered,
    all text and data legible, data colors identical between renders
  - Deterministic seeded LCG data generation; title format matches the mandated '{Descriptive
    Title} · spec-id · language · library · anyplot.ai' convention
  weaknesses:
  - Y-axis starts at 0 while data sits in a narrow ~3,900-6,000 band, wasting roughly
    two-thirds of the vertical plot area — zooming the y-axis closer to the data range
    (e.g. min ~3500) would make the trend and the widening confidence band much more
    visually prominent
  - The code computes a distinct 'observed' (days 0-29) vs 'forecast' (days 30-59)
    horizon via horizonFactor, but this distinction is invisible in the render — no
    vertical marker or dashed-line style change separates history from forecast, so
    viewers can't tell where the forecast actually begins
  - Trend line and band both use the same brand green at different opacities; a slightly
    more distinct but still Imprint-compliant hue for the band would better match
    the spec's 'contrasting but related colors' suggestion, though opacity variation
    is an accepted idiom
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-like), not pure white, not dark.
      Chrome: Title "Daily Active Users Forecast · line-confidence · javascript · echarts · anyplot.ai" centered at top in dark ink, fully visible, not clipped. Legend below title with two rounded swatches ("Predicted Active Users" solid green, "Prediction Interval" pale green). Y-axis name "Daily Active Users" top-left in soft ink. X-axis shows date labels (Jan 1, Jan 6, ... Feb 25) at readable size with no overlap. Horizontal grid lines only, subtle gray, no vertical gridlines.
      Data: Bold brand-green (#009E73) trend line with a pale semi-transparent green band around it, band visibly widens toward the right (forecast horizon), consistent with the "prediction intervals grow with lead time" design intent.
      Legibility verdict: PASS — all text (title, legend, axis labels, tick labels) is clearly readable against the light background. One layout concern: the y-axis starts at 0 while data only spans ~3,900-6,000, leaving roughly the bottom two-thirds of the plot area empty.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-like), not pure black, not light.
      Chrome: Same title, legend, axis labels and tick labels, now in light ink/soft-gray tones, fully legible against the dark background. No dark-on-dark text anywhere — all chrome elements read clearly. Grid lines subtle and visible.
      Data: Identical brand-green (#009E73) trend line color to the light render; band renders as a darker teal fill due to blending with the dark background at the same alpha — this is expected theme-adaptive behavior, not a data-color change.
      Legibility verdict: PASS — no dark-on-dark or illegible elements found. Same y-axis zero-baseline whitespace concern applies equally to this render.
