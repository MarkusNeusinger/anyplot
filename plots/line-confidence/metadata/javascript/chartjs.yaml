review:
  strengths:
  - 'Correct Chart.js idiom for confidence bands: transparent-border helper dataset
    + fill: ''-1'' to shade the area between two series'
  - Legend filters out the internal 'Lower Bound' helper dataset, leaving exactly
    the two entries the spec asks for
  - 'Theme tokens fully threaded through: background, ink, inkSoft, and grid all mapped
    correctly; data colors (palette[0] green, band alpha) are identical between light
    and dark renders'
  - Deterministic fixed-seed LCG data generation, no external dependencies, clean
    canvas mount contract, animation disabled
  - Confidence band visibly widens toward the forecast horizon, giving the chart a
    legitimate data-storytelling element
  weaknesses:
  - 'Central line uses pointRadius: 0 with only 24 (sparse) data points — a subtle
    point marker on the trend line would improve per-observation precision per the
    density guideline'
  - 'X-axis grid is disabled (grid: { display: false }) while the spec calls out grid
    lines to aid readability — consider a subtle x-axis grid to match the y-axis treatment'
  - Design execution is competent but generic — standard Chart.js defaults with no
    additional visual flourish (e.g. an annotation calling out the current point or
    the widening-uncertainty trend) beyond the required band
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matching the required light-theme surface.
      Chrome: Title "line-confidence · javascript · chartjs · anyplot.ai" in bold dark ink at top; legend below title with two swatches ("95% Confidence Interval", "Predicted Revenue"); x-axis "Month" with rotated-free month/year tick labels (Jan 2025 ... Nov 2026); y-axis "Revenue ($K)" with numeric ticks 400-650; subtle horizontal grid lines on the y-axis only.
      Data: Central trend line in solid brand green (#009E73, palette[0]), 3.5px wide, smoothly interpolated (tension 0.3); confidence band in the same hue at ~25% alpha, visibly widening from roughly ±15 near Jan 2025 to ±90 near Nov 2026, correctly conveying growing forecast uncertainty.
      Legibility verdict: PASS — all text (title, legend, axis titles, tick labels) is clearly readable dark-on-light with no overlap or clipping.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matching the required dark-theme surface.
      Chrome: Same title and legend layout, now in light/white ink; axis titles and tick labels rendered in a soft light gray; grid lines remain subtle on the y-axis.
      Data: Central trend line and confidence band use the identical brand-green hue and alpha as the light render — only the chrome (text, grid, background) has flipped, exactly as required.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; all text is legible against the near-black background, and the green line/band remain clearly distinguishable from the surface.
