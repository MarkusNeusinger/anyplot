review:
  strengths:
  - 'Correctly works around a known MUI X quirk: the library derives an area''s fill
    from `d3Color(color).brighter(0.5).formatHex()`, which drops any alpha in the
    series `color` — the implementation overrides `fill`/`fillOpacity` directly on
    `.MuiAreaElement-series-band` to get a genuinely semi-transparent band (alpha
    0.22, within the spec''s 0.2-0.4 range), and documents why in a code comment.'
  - 'Drop-shadow halo (`filter: drop-shadow(...)` using the page background color)
    on the central line cleanly separates it from the underlying band in both themes,
    improving VQ-03 element visibility without adding a stroke that would fight the
    palette.'
  - 'Full theme correctness: identical `#009E73` data color in both renders, correct
    `#FAF8F1`/`#1A1A17` backgrounds, all chrome (title, axis labels, ticks, legend)
    readable in both light and dark with no dark-on-dark or light-on-light failures.'
  - 'Title fontsize scaling formula (`title.length > 67 ? round(22*67/title.length)
    : 22`) is correctly applied for the long mandated+descriptive title, keeping it
    comfortably within canvas bounds.'
  - The confidence band widens naturally with the forecast horizon (1.96*sigma growing
    linearly with day index) — a realistic, well-executed rendition of the spec's
    core forecast-uncertainty idea, plus weekly seasonality in the central trend.
  weaknesses:
  - X-axis shows ~13 date tick labels across the 3200px canvas; at the ~400px mobile
    width these will compress substantially and risk crowding — consider a coarser
    `tickInterval` or fewer ticks for better small-viewport legibility.
  - '`yAxis[0].tickFontSize: 30` is not a real @mui/x-charts axis option (tick font
    size is controlled via `tickLabelStyle.fontSize`, already set to 14 on the same
    axis) — it''s silently ignored dead code; remove it to avoid signaling uncertainty
    about the API surface.'
  - The confidence band is built via a hidden 'lower' stacked series as a scaffold
    to fake a range-area — functional and correctly hidden from the legend, but it's
    a workaround rather than a first-class API; a brief comment on *why* stacking
    was chosen (no native range-area component in community MUI X) would help future
    maintainers.
  - Design excellence is solid but not exceptional beyond the halo/fillOpacity fix
    — no additional storytelling elements (e.g. an annotation marking where the forecast/uncertainty
    regime changes) that would lift it further above baseline.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "Active User Forecast · line-confidence · javascript · muix · anyplot.ai" in dark ink, clearly visible at top-left. Legend below title with two swatches ("95% confidence interval" light-green, "Forecast (mean)" solid green), both readable in dark text. Y-axis label "Daily active users" (rotated) and X-axis label "Date" in matching dark ink, similar sizing. Tick labels (dates on x, "10k"-"19k" on y) in slightly softer dark gray, all legible. Subtle horizontal grid lines only.
      Data: Central trend line in brand green (#009E73) with a thin light halo separating it from the band; semi-transparent light-green confidence band beneath/around it, widening steadily from left to right. First (and only) series color is confirmed brand green.
      Legibility verdict: PASS — no light-on-light issues, all text crisp against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
      Chrome: Title, legend text, and axis labels/ticks all rendered in light/white ink, clearly visible against the dark background. Grid lines subtle but visible as faint light horizontal strokes.
      Data: Central line and legend swatch use the identical #009E73 green hex as the light render (confirmed same underlying data color); the confidence band renders as a deeper, more saturated-looking green due to alpha blending against the black background, but this is expected alpha-over-dark behavior, not a color-value change — the band remains clearly distinguishable from the background and the line remains distinguishable from the band via its bright color and drop-shadow separation.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data elements read clearly.
