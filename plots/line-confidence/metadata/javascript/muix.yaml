  strengths:
  - 'Central line (3.5 px, #009E73) drawn over a 0.24-opacity band of the same hue:
    the band clearly belongs to its line and gridlines remain visible through it in
    both themes'
  - Legend names both elements and states what the band is ('95 % prediction interval'),
    with swatches matching the line and the band opacity
  - 'Idiomatic MUI X v9 composition: ChartsDataProvider + LinePlot + ChartsGrid with
