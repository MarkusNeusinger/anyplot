review:
  strengths:
  - Correctly builds the confidence band with the idiomatic MUI X stacked-area technique
    (hidden 'lower' baseline series + visible 'band' series), a legitimate library-specific
    pattern for a chart type MUI X has no native range-area component for.
  - Central line and confidence band both derive from the Imprint brand green (#009E73),
    keeping palette identity consistent, and both are pixel-identical between light
    and dark renders — only chrome flips as required.
  - Fully deterministic, seed-free data generation (sinusoidal seasonality + linearly
    growing 1.96*sigma half-width) producing a realistic, neutral daily-active-users
    forecast scenario.
  - Title format is correct (`{Descriptive Title} · line-confidence · javascript ·
    muix · anyplot.ai`), axis labels are descriptive, and the legend clearly names
    both series ('Forecast (mean)' and '95% confidence interval').
  - Horizontal-only grid is subtle and appropriate for a line/area chart; both themes
    render with correct warm off-white / warm near-black backgrounds and theme-adaptive
    text.
  weaknesses:
  - Y-axis title 'Daily active users' visually overlaps the '11k' tick label in both
    renders — the rotated axis title runs into the tick text and garbles legibility.
    Add left margin / axis spacing (e.g. yAxis margin or slotProps) so the label clears
    the tick labels.
  - The confidence band renders as a strongly saturated, near-opaque green in both
    PNGs, while the legend swatch for '95% confidence interval' shows a much paler
    mint tone — the rendered band doesn't visually match its own legend swatch and
    doesn't read as 'semi-transparent' per the spec's alpha 0.2-0.4 guidance. Lower
    the alpha (e.g. ~0.2) and confirm the hidden 'lower' series isn't compositing
    under the visible band and inflating perceived opacity.
  - 'Low contrast between the central trend line and the confidence band: both use
    the same green hue (t.palette[0]) so the line nearly disappears into the fill
    instead of reading as the ''solid, prominent line'' the spec calls for. Use a
    more distinct treatment (darker/ink stroke, white outline halo, or a lighter/muted
    band tone) so the line pops against the band.'
  - Y-axis auto-scales from 0 even though all data sits between ~10.5k and ~19k, compressing
    the actual story (a widening uncertainty band) into under half the available vertical
    space. A tighter y-domain (e.g. starting near 9k-10k) would make the widening
    band read more dramatically.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — correct, not pure white.
      Chrome: Title "Active User Forecast · line-confidence · javascript · muix · anyplot.ai" in dark ink, fully readable. X-axis date ticks (Jan 1 .. Feb 27) and Y-axis "k"-formatted ticks (0k..19k) are dark and legible. Y-axis title "Daily active users" is rotated along the left edge but visually collides with the "11k" tick label, making that region hard to parse cleanly. Legend at top shows a pale mint swatch for "95% confidence interval" and a solid dark-green swatch for "Forecast (mean)", both readable.
      Data: The confidence band renders as a strongly saturated green area (not clearly semi-transparent, and notably darker than its own legend swatch) running from ~10.5k to ~19k, widening over the 60-day horizon. A central trend line is present inside the band but is low-contrast against the fill (same hue), making it hard to visually separate from the band edges.
      Legibility verdict: FAIL (y-axis title / "11k" tick overlap; central line low-contrast against band)

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — correct, not pure black.
      Chrome: Title, axis labels, and tick labels are light-colored and clearly readable against the dark background — no dark-on-dark issues. Same y-axis title / "11k" tick overlap present as in the light render (identical layout, only chrome color flips).
      Data: Confidence band and central line colors are identical to the light render (#009E73-derived), correctly holding constant across themes. Same band-opacity and line-contrast issues as the light render.
      Legibility verdict: FAIL (same overlap and low-contrast issues as light render; theme-chrome itself is correctly readable)
