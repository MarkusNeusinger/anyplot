review:
  strengths:
  - Clever stacked invisible-base + area technique renders the confidence band without
    highcharts-more's forbidden arearange module — a correct workaround for a genuine
    core-bundle limitation, not a hack.
  - Confidence band is a realistic bowtie shape (narrowest near the mean fertilizer
    rate, widening toward both extremes), reflecting real prediction-interval statistics
    rather than a naive constant-width band.
  - 'Theme-adaptive chrome is fully correct: data colors (line + band) are pixel-identical
    between light and dark, only background/text/grid tokens flip, and both renders
    stay legible.'
  - 'All spec-mandated features present: prominent solid trend line, semi-transparent
    band within the 0.2-0.4 alpha range, legend identifying both series, and readable
    gridlines.'
  weaknesses:
  - Center line has no markers despite a sparse 41-point series; light markers at
    intervals would reinforce the underlying sample density (minor — defensible since
    this is a fitted/regression curve, not raw scatter).
  - Title occupies only ~35% of plot width, leaving the header visually sparse compared
    to the body — a touch more typographic weight or size would sharpen the hierarchy
    (DE-01).
  - Styling otherwise leans on largely default Highcharts chrome (standard axis lines,
    legend swatches); a bit more custom refinement (e.g. trimmed axis lines) would
    push Design Excellence higher.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the theme spec.
      Chrome: Title "line-confidence · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle in softer grey below it, both axis titles ("Fertilizer Application Rate (kg/ha)", "Predicted Crop Yield (t/ha)") and tick labels in soft dark grey, legend at bottom with two labeled entries. All clearly readable against the light background.
      Data: Solid dark-green (#009E73) spline for "Predicted yield" with a light semi-transparent green band for the "95% confidence interval" beneath/around it. Band narrows near x≈100 (mean fertilizer rate) and widens toward both extremes — a correct prediction-interval bowtie shape.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the theme spec.
      Chrome: Title and subtitle rendered in light/off-white text, axis titles and tick labels in light grey, legend text light-colored — all clearly readable against the dark background. No dark-on-dark issues observed.
      Data: Same #009E73-based green spline and band as the light render — the band renders as a darker, deeper green fill against the near-black background but the underlying hue and line color are identical to the light render, confirming only chrome flipped.
      Legibility verdict: PASS
