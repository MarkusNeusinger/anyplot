review:
  strengths:
  - 'Reproducibility fixed: the seeded RNG (`Random.seed!(42)`) is now actually consumed
    via `noise = randn(...) .* 15`, and the previously-unused `using Random` import
    is now justified.'
  - 'Legend order fixed: `axislegend` is now called with explicit `[line_plot, band_plot]`
    handles and `["Predicted DAU", "95% prediction interval"]` labels, so the trend
    line reads first regardless of plotting order.'
  - Theme-adaptive chrome remains fully threaded through — background, title, axis
    labels, tick labels, spines, and legend box all flip correctly between the exact
    `#FAF8F1` light and `#1A1A17` dark tokens, with no dark-on-dark or light-on-light
    failures.
  - Confidence band still uses brand green at alpha 0.25 (within spec's 0.2-0.4 range)
    with the first series correctly at Imprint position 1 (`#009E73`) in both themes,
    and data colors are identical across themes.
  - 'Realistic, neutral synthetic data: a saturating DAU-growth curve with a prediction
    interval that widens over the forecast horizon, now with added seeded noise for
    realism.'
  weaknesses:
  - 'UNRESOLVED from attempt 1: vertical (X-axis) gridlines are still rendered at
    every x-tick position (0, 10, 20, 30, 40, 50, 60) in BOTH plot-light.png and plot-dark.png,
    spanning the full height of the plot area, even though the code now sets `xgridvisible
    = false` and `xminorgridvisible = false` on the Axis. The code change did not
    produce the requested Y-axis-only grid (style guide: ''Y-axis grid only for bar/line
    charts''). Verified by cropping both PNGs around x=20 and across the top margin
    — the line is a full-height gridline, not a tick mark or spine. The repair attempt
    should investigate why `xgridvisible = false` is not suppressing the vertical
    grid (check for a theme-level default being applied after Axis construction, a
    stale/incorrect CairoMakie call, or explicitly force it post-construction with
    `ax.xgridvisible = false`) rather than re-applying the same kwarg that already
    appears in the source but is not taking visual effect.'
  - Design excellence is still generic beyond the theme handling — no additional visual
    hierarchy, callout, or emphasis (e.g., annotating the current/final predicted
    value, or highlighting a milestone) to elevate DE-01/DE-03 beyond a competent
    baseline.
