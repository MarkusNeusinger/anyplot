review:
  strengths:
  - 'Theme-adaptive chrome is threaded through completely — background, title, axis
    labels, tick labels, spines, and grid all flip correctly between the exact #FAF8F1
    light and #1A1A17 dark tokens, with no dark-on-dark or light-on-light failures.'
  - Confidence band uses brand green at alpha 0.25 (within the spec's 0.2-0.4 range),
    giving a clear central trend line with a legible, non-competing uncertainty region
    — first series correctly uses Imprint position 1 (#009E73) in both themes.
  - 'Realistic, neutral synthetic data: a saturating DAU-growth curve with a prediction
    interval that widens over the forecast horizon, matching real-world forecast behavior
    described in the spec.'
  - Canvas gate passed (3200x1800 verified) and idiomatic Makie API usage (band!,
    lines!, axislegend with theme tokens, top/right spines removed).
  weaknesses:
  - Grid is drawn on both X and Y axes (xgridcolor and ygridcolor both set); the style
    guide calls for Y-axis-only grid on line charts — drop xgridcolor/xgridvisible
    to reduce visual noise.
  - '`using Random` and `Random.seed!(42)` are present but never used — predicted_dau,
    interval_margin, lower_bound, and upper_bound are all fully deterministic formulas
    with no rand()/randn() call. Either remove the unused import/seed or use the seeded
    RNG to add a small amount of realistic noise to the forecast.'
  - Legend entry order is 'reversed' — the confidence-band label ('95% prediction
    interval') appears above the line label ('Predicted DAU') because band! is called
    before lines!; conventional reading order would list the central-trend line first.
    Reorder the plotting calls (lines! before band!) or pass explicit legend entries
    if the visual z-order of band-under-line must be preserved.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "line-confidence · julia · makie · anyplot.ai" is bold dark ink, clearly visible top-center. Axis labels "Days Since Launch" / "Daily Active Users" and tick labels are dark/soft-dark ink, all legible. Subtle grid lines (both axes) at low opacity, do not compete with data. Top/right spines removed; left/bottom spines present in soft ink. Legend sits top-left in an off-white elevated box with a thin border, listing "95% prediction interval" (green swatch) then "Predicted DAU" (green line).
      Data: Brand-green (#009E73) solid line for the central trend, with a semi-transparent brand-green band (alpha ~0.25) around it showing the widening prediction interval as days increase.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels are rendered in light ink (near-white / soft light gray), clearly readable against the dark background — no dark-on-dark failures observed. Grid lines are subtle light-on-dark at low opacity. Legend box uses the dark elevated surface (#242420) with light text, fully legible.
      Data: Same brand-green line and band colors as the light render — confirmed identical data colors, only chrome (background, text, grid, legend frame) flipped.
      Legibility verdict: PASS
