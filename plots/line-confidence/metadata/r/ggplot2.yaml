review:
  strengths:
  - Confidence band alpha (0.25) sits well inside the spec's 0.2-0.4 range and stays
    readable in both themes
  - Band width correctly grows with forecast horizon (sqrt-of-horizon uncertainty),
    giving an honest visual cue of increasing forecast risk
  - Theme tokens are threaded through consistently - data colors identical between
    light/dark, only chrome flips
  - 'Clean, uncluttered layout: spines removed, only horizontal gridlines retained,
    comma-formatted y-axis ticks'
  weaknesses:
  - Design storytelling is fairly generic - consider a subtle vertical marker or annotation
    calling out where the forecast begins, or a brief callout on the widening trend,
    to sharpen the focal point
  - Library mastery is safe/standard; a more distinctive ggplot2 touch (e.g. geom_smooth
    for a secondary reference, or annotated seasonality peaks) would raise this further
  image_description: |-
