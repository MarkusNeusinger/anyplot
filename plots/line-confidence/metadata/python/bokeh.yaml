review:
  strengths:
  - Native varea glyph draws the band between the lower and upper bound at every x,
    with the line rendered after it so the solid 5 px Imprint green line sits on top
    as the strongest mark
  - 'Band and line share #009E73 (band at fill_alpha 0.3), so the band reads as a
    lighter tone of its own line rather than a second series; gridlines stay visible
    through it in both themes'
  - Explicit bokeh Legend model names both the forecast line and the '95% confidence
    interval' band, styled with the ELEVATED_BG/INK_SOFT tokens in both themes
  - HoverTool bound to the line shows week, forecast and the formatted CI range in
    the HTML output
  - Realistic, neutral sales-forecast scenario whose interval widens over the horizon,
    with descriptive axis titles carrying units
  - All chrome is threaded through theme tokens; no dark-on-dark or light-on-light
    text in either render
  weaknesses:
  - 'DE-02 (both): the plot area is enclosed by a four-sided INK_SOFT outline frame
    although nothing about a line chart requires all four spines → L-shaped or no
    frame (drop the top and right sides). Likely cause: p.outline_line_color = INK_SOFT;
    set p.outline_line_color = None and keep the x/y axis lines.'
  - 'Suggestion: a slightly darker line tone than the band (or a thin page-colored
    halo under the line) would lift the central line further off the band in the light
    render.'
  - 'Suggestion: start the x range at week 1 (data-driven) to remove the empty strip
    between 0 and 1.'
