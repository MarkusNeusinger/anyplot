review:
  strengths:
  - Native varea glyph draws the 95% band exactly from the lower to the upper bound
    at every x, with the line rendered on top at line_width=5 as the strongest mark
    in both themes
  - 'A single Imprint hue #009E73 for the line and a fill_alpha=0.3 band: the band
    reads as a lighter tone of its line, never as a second series, and stays distinct
    from both page colors'
  - A bokeh Legend model names both the line and the band and says what the band is
    (95% confidence interval), on a theme-aware elevated background
  - HoverTool bound to the line renderer with formatted tooltips that report the prediction
    and the CI range in the HTML output
  - 'Every chrome element is threaded from the theme tokens; all text is readable
    on #FAF8F1 and #1A1A17'
  weaknesses:
  - 'VQ-06 (both): the axis titles are ''Time (units)'' and ''Predicted Value'': ''(units)''
    is a placeholder rather than a unit, and the y-axis title carries no unit → name
    a real quantity with its unit on both axes (for example ''Week'' and ''Daily demand
    (MWh)''). Likely cause: the TIME and PREDICTION column constants.'
  - 'DQ-02 (both): the scenario is generic: a polynomial trend called ''Predicted
    Value'' over ''Time (units)'' with no domain → rename the columns and the legend
    entry to a concrete neutral forecast (for example energy demand or sales with
    its unit). Likely cause: the TIME / PREDICTION / LOWER / UPPER constants and the
    ''Prediction'' legend label.'
  - 'Suggestion: a thin line on the band''s upper and lower edges in a lighter tone
    could sharpen its outline in the dark render, where the 0.3-alpha green sits close
    to the page.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the canvas and the plot area; a thin INK_SOFT outline frames the plot.
      Chrome: bold dark title "line-confidence · python · bokeh · anyplot.ai" top left (~43% of width); italic axis titles "Time (units)" and "Predicted Value" in dark ink; tick labels 0–10 and 0–20 in soft gray, all readable; faint grid visible.
      Data: a #009E73 line (50 points, rising from ~2 to ~16 with short-term noise) on top of a light green 0.3-alpha band that widens from ~±1.6 to ~±4.6 toward x=10; legend top-left on an elevated off-white box lists "Prediction" (line sample) and "95% confidence interval" (swatch). No overlap, nothing clipped.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; plot outline in light soft gray.
