review:
  strengths:
  - 'Band is a lighter tint of the line''s own #009E73 with a thin same-hue edge,
    so it clearly belongs to the line and is not mistakable for a second series'
  - Central line is drawn on top of the band as the strongest mark, widened through
    pygal's css= inline CSS hook
  - Correct 3200x1800 canvas with text sized for it; all chrome readable in both themes
  - Semi-transparent band (opacity 0.28) keeps the grid visible through it; widening
    interval communicates forecast uncertainty
  - Adaptable data block ending in a tidy df with column-name constants, and native
    interactive HTML output
  weaknesses:
  - 'VQ-03 (both): the ''Predicted mean'' legend glyph is a ~16 px pale square in
    the band''s 0.28-opacity tint, identical in look to the band''s glyph, while the
    line it explains is a thick saturated #009E73 stroke → a glyph that matches the
    line (solid #009E73, line-like). Likely cause: Style opacity=0.28 applied to every
    series'' legend square; the line series is not given full opacity or a legend_box_size/CSS
    rule for .serie-1.'
  - 'CQ-04 (code): stroke width is set three conflicting ways — Style stroke_width=2,
    stroke_style={''width'': 1} / {''width'': 12} on chart.add, and inline CSS 2px
    / 10px !important — and only the CSS wins → keep one mechanism and delete the
    others. Likely cause: stroke_style values left in after the CSS override was added.'
  - 'Suggestion: the y-axis major labels 1000 and 1500 render at major_label_font_size
    44 while the other ticks use 52; matching them would give an even tick column.'
  - 'Suggestion: the two legend entries are spread to the far left and the centre
    of the bottom row; legend_at_bottom_columns=2 or a narrower layout would keep
    them together.'
