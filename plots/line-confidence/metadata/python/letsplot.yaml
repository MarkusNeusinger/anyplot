review:
  strengths:
  - 'Canonical lets-plot layering: geom_ribbon(ymin/ymax) under a 1.5-wide geom_line,
    so the central line is the strongest mark and sits on top of the band in both
    renders'
  - 'Band at alpha 0.25 in a lighter tone of the line''s own #009E73, so it reads
    as the line''s uncertainty and not as a second series; gridlines stay visible
    through it in both themes'
  - Legend names both layers and says what the band is ('95% prediction interval'
    / 'Forecast'), driven by scale_color_manual/scale_fill_manual on a mapped series
    column
  - Plausible, neutral 48-hour PM2.5 forecast with a diurnal cycle and an interval
    that widens with the horizon; axis titles come from the column constants with
    units (µg/m³)
  - Correct canvas (ggsize(800, 450) + scale=4 = 3200x1800) and theme tokens threaded
    through every chrome element; HTML export keeps lets-plot's native hover tooltips
  weaknesses:
  - 'DE-02 (both): the panel is enclosed by all four spines (a full box frame around
    the plot area), which a line chart does not require → keep only the left and bottom
    axis lines (or none). Likely cause: the panel border is not set to element_blank();
    add panel_border=element_blank() to theme() and keep axis_line for the L-shape.'
  - 'VQ-03 (both): the ''95% prediction interval'' legend swatch is solid #009E73
    at full opacity with an INK_SOFT outline, while the band itself is drawn at alpha
    0.25 without outline, so the key does not match the mark it explains → swatch
    at the band''s alpha 0.25, no outline. Likely cause: the fill guide inherits no
    alpha; add guides(fill=guide_legend(override_aes={''alpha'': 0.25})) or set the
    legend key styling.'
  - 'Suggestion: limit the grid to y-axis lines only, as the style guide prefers for
    line charts.'
  - 'Suggestion: a tick at 48 h would close the x axis at the end of the forecast
    horizon.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 across canvas and panel; 3200x1800 landscape.
      Chrome: Title "line-confidence · python · letsplot · anyplot.ai" top-left in dark ink (~45% width). Y axis "PM2.5 forecast (µg/m³)" with ticks 5–40, x axis "Hour from now" with ticks 0–42 every 6 h, all dark-grey text, readable. Subtle grid on both axes. Legend on top in an elevated off-white box: "95% prediction interval" (solid green square swatch with grey outline) and "Forecast" (green line). The panel is framed by all four spines.
      Data: Solid #009E73 line (48 hourly points) with a diurnal cycle peaking around hour 13 and hour 35, over a pale mint band (#009E73 at alpha 0.25) that widens from ±1.6 at hour 0 to about ±8 at hour 47. Line on top of band; band encloses the line at every x.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title, axis titles in light #F0EFE8; tick labels and legend text in light grey #B8B7B0, all readable, no dark-on-dark. Grid faint light rules; four-spine frame in light grey. Legend box on #242420 elevated surface.
      Data: Same #009E73 line and #009E73 band at alpha 0.25 (reads as deep green on the dark page) — data colors identical to light render, only chrome flipped. Brand green clearly visible.
      Legibility verdict: PASS
