review:
  strengths:
  - Native geom_boxplot computes quartiles, 1.5*IQR whiskers and outliers; the outliers
    (two low in Engineering, two high in Marketing) are drawn as individual points
    at their values
  - median.colour = INK with median.linewidth = 1.4 makes the median line the strongest
    mark in every box, dark on the light render and near-white on the dark one
  - Theme tokens threaded through every chrome element; data colors identical across
    themes, Imprint positions 1-5 in canonical order
  - 'Adaptable-code structure: column constants, one tibble data block keyed by them,
    plot code reading only df through .data[[...]]'
  - Shared value axis not forced to zero, with label_dollar(scale = 0.001, suffix
    = 'k') ticks
  weaknesses:
  - 'Suggestion: draw outlier points in their box''s fill color (outlier.colour) so
    each one reads as belonging to its department at a glance.'
