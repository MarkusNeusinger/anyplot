review:
  strengths:
  - 'First categorical series is exactly #009E73 and the remaining classes follow
    the Imprint canonical order (lavender, blue, ochre, matte red) in both renders,
    with data colors identical across themes.'
  - 'Genuine box-and-whisker construction: a custom afterDatasetsDraw plugin draws
    real whiskers, caps, a page-bg-contrast median line, and individually plotted
    outlier points on top of a floating-bar Q1-Q3 box — Chart.js has no native boxplot
    type, so this is real engineering, not a fake.'
  - 'Data storytelling: ''Highest median'' and ''Widest spread (IQR)'' callouts are
    computed from the actual data (reduce over medians / IQRs) and placed above the
    relevant box, giving the viewer an immediate takeaway instead of a flat data dump.'
  - Theme-adaptive chrome is threaded correctly everywhere (title/axis text via t.ink,
    ticks via t.inkSoft, grid via t.grid, whisker/cap strokes via t.ink, median line
    and outlier strokes via t.pageBg) and remains fully legible in both the light
    and dark renders.
  - 'Data quality: five classes with distinct mean/SD/n combinations (n=50-90, within
    the spec''s 20-500 range) produce genuinely different spreads and two categories
    show real outliers beyond the 1.5*IQR fence.'
  - Deterministic LCG + Box-Muller sampling with a fixed seed (42) makes the dataset
    fully reproducible, and quantile()/IQR-fence logic is computed directly from the
    sorted sample rather than hard-coded.
  weaknesses:
  - The mandated title only reaches ~32% of canvas width at font size 26 — well under
    the 50-70% comfort band for a title this length (45 chars). It reads fine, but
    a slightly larger title (e.g. 30-32px) would balance better against the wide 3200px
    canvas.
  - Only Class A and Class B show outliers; Class C/D/E display none, so the outlier-rendering
    path is only exercised twice across five categories — one more engineered outlier
    in a low-variance class (e.g. Class D) would demonstrate the feature more fully.
  - Legend is intentionally disabled since the x-axis already labels each class, which
    is a reasonable call, but a 1-line note in code comments confirming that reasoning
    would help future maintainers avoid 're-adding' a redundant legend.
  - outlier marker radius (6px) and whisker-cap half-width (0.3 * bar width) are hard-coded
    constants rather than densitya-adapted values; with only 1-2 outliers per class
    this reads fine, but the sizes don't scale with n the way the box width does.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-basic · javascript · chartjs · anyplot.ai" in bold dark ink, centered near the top with generous headroom (verified no clipping via pixel crop). Axis titles "Class" (x) and "Exam Score (0-100 pts)" (y) in dark ink; tick labels in a slightly softer gray-brown. Subtle horizontal gridlines only on the y-axis. All chrome elements are clearly readable against the light background.
      Data: Five floating bar-boxes (Q1-Q3) in Imprint palette order — Class A brand green #009E73, Class B lavender, Class C blue, Class D ochre, Class E matte red. Each box has a white/near-page-bg median line for contrast, thin dark whiskers with caps extending to 1.5*IQR fences, and individually plotted outlier dots (Class A and Class B) styled in the series color with a light stroke. Two text callouts ("Highest median" over Class D, "Widest spread (IQR)" over Class E) sit comfortably above their respective boxes without overlapping the axis or other text.
      Legibility verdict: PASS — no dark-on-light or missing text; title, axis text, tick labels, and callouts fully readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis titles now render in light off-white ink; tick labels in a lighter secondary gray. Gridlines remain subtle. Box borders switch to a light stroke (matching t.ink flipping to the light token), keeping the boxes well-defined against the dark background.
      Data: Same five box colors as the light render, confirmed pixel-identical (green/lavender/blue/ochre/red) — only chrome flipped. The median line strokes with the dark page-bg token; cropped close-ups over the blue, ochre, and red boxes confirm the dark median line remains visibly distinct from each fill color thanks to line weight and the light box border, so it does not blend into the dark canvas outside the box. Outlier dots keep their series color with a dark stroke, clearly visible against the near-black background.
      Legibility verdict: PASS — no dark-on-dark failures found; all text and the median line remain legible against both the canvas background and the saturated box fills.
