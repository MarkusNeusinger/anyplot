review:
  strengths:
  - Correct box-plot construction via a custom Chart.js canvas plugin (afterDatasetsDraw
    drawing whiskers, caps, median line, outliers) — a legitimate workaround since
    Chart.js has no native boxplot type and community plugins are off-limits.
  - 'Perfect Imprint palette compliance: Class A is #009E73 and Classes B-E follow
    the canonical order (#C475FD, #4467A3, #BD8233, #AE3030) exactly.'
  - Theme-adaptive chrome is correct in both renders — warm cream/near-black backgrounds,
    readable ink/inkSoft text, subtle y-axis-only grid; data colors identical between
    themes.
  - Reproducible, deterministic data via a seeded LCG + Box-Muller normal sampler
    feeding a proper quartile/IQR/outlier computation.
  - Clean single-file structure, correct 1.5*IQR whisker fencing, outliers rendered
    as individual stroked points, median line contrasts against each box fill.
  - 'Realistic, neutral data: exam scores across 5 classes with varied means/spreads
    and visible outliers in two of the five categories.'
  weaknesses:
  - Design Excellence is at the 'well-configured default' tier — the chart is clean
    and correct but doesn't yet create a clear focal point or visual hierarchy (e.g.
    Class D's strong performance or Class C's wide spread aren't emphasized beyond
    their raw color/position).
  - Y-axis title 'Exam Score' is descriptive but has no unit/scale context (e.g. '(0-100
    pts)') — bump VQ-06 to full marks by adding it.
  - Title 'box-basic · javascript · chartjs · anyplot.ai' renders comfortably legible
    but only fills roughly a quarter of the canvas width, well under the ~50-70% guideline
    for a short title — consider a modestly larger title fontsize for stronger visual
    presence without risking overflow.
  - No annotation or subtle emphasis calls out the story in the data (e.g. best/worst
    class, or notably wide spread) — not required by the spec, but would raise Data
    Storytelling (DE-03) above the default tier.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-basic · javascript · chartjs · anyplot.ai" in bold dark ink, centered top. "Class" (x) and "Exam Score" (y) axis titles in dark ink. Tick labels in a softer dark gray. Subtle horizontal (y-axis only) gridlines. All chrome elements are clearly legible against the light background.
      Data: Five box-and-whisker groups (Class A-E) using the Imprint categorical palette in canonical order — Class A brand green (#009E73), Class B lavender, Class C blue, Class D ochre, Class E matte red. Each box shows a white median line, black whiskers with caps extending to 1.5*IQR, and colored circular outlier points (visible for Class A and Class B) stroked in the page background color for contrast.
      Legibility verdict: PASS — every text element is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title and axis titles now rendered in light ink (near-white), tick labels in a lighter soft gray, subtle light-on-dark horizontal gridlines. All chrome text is clearly legible against the dark background — no dark-on-dark failures observed.
      Data: Identical box colors and positions to the light render (green/lavender/blue/ochre/red data series unchanged), confirming data colors are constant across themes. Whiskers and caps flip to white/light for contrast on the dark surface; median lines and outlier strokes use the (now dark) page-background color, which still reads clearly against each box's saturated fill.
      Legibility verdict: PASS — all text and data elements remain clearly readable on the dark surface; no theme-adaptation failures found.
