review:
  strengths:
  - 'First series correctly uses brand green #009E73, and the remaining four classes
    follow the canonical Imprint order (lavender, blue, ochre, matte red) exactly'
  - Real box-plot statistics (quartiles, 1.5*IQR fences, outliers) are computed from
    generated per-class score distributions rather than faked, and the custom SVG
    overlay is positioned via useXScale/useYScale — exactly the technique the muix.md
    library guide prescribes for the missing community BoxPlot component
  - 'Data shows genuine variety: different spreads across classes (tight Class C vs.
    wide Class B) and deliberate, deterministic outliers in two classes, satisfying
    DQ-01''s ''outliers AND different spreads'' bar'
  - 'Subtle design polish beyond library defaults: rounded box corners, alpha-blended
    fills, a bolder stroke + soft drop-shadow highlighting the tightest/highest-scoring
    class as a data-driven focal point'
  - 'Both renders are theme-correct: identical data colors between light/dark, warm
    off-white / near-black backgrounds, fully legible chrome in both themes, exact
    mandated title string, no clipping at any edge'
  weaknesses:
  - Grid lines use strokeDasharray '2 5' (dashed); the default style guide's Grid
    Guidelines call for solid thin lines at 15-25% opacity — consider a solid line
    at lower opacity for closer style-guide alignment
  - Outlier marker radius (r=5 CSS px) is only modestly prominent given how sparse
    the outliers are (1 per affected class) — bumping to r=7-8 would read more confidently
    as a deliberate data point rather than visual noise
  - Helper functions (lcg, randomNormal, quantile) add more structure than the KISS
    'no functions' ideal, though this is largely unavoidable given muix's React component
    contract and the need to compute real quartile/IQR statistics
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "box-basic · javascript · muix · anyplot.ai" top-left in dark ink; "Class" and "Exam Score (%)" axis labels and 0-100 tick labels all dark and clearly legible; horizontal dashed gridlines are subtle and don't compete with the data.
      Data: Five box-and-whisker glyphs for Class A-E in Imprint canonical order — brand green, lavender, blue, ochre, matte red. Each shows a median line, IQR box, whiskers, and (for Class A, B, D) a single hollow-circle outlier below the lower whisker. Class C's box has a visibly bolder stroke and soft drop-shadow, marking it as the tightest/highest-scoring distribution (focal point).
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink against the dark surface, fully readable; no dark-on-dark text anywhere; gridlines remain subtle.
      Data: Same five box glyphs in the identical five colors as the light render (green, lavender, blue, ochre, red) — confirmed unchanged; only the chrome (background, text, grid) flipped to the dark theme. Class C retains its focal bolder-stroke treatment.
      Legibility verdict: PASS.
