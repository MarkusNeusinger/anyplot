review:
  strengths:
  - 'Correct box-plot statistics implemented by hand: Q1/median/Q3 via linear-interpolation
    quantiles, whiskers clamped to the 1.5*IQR fences, and true outlier detection
    — not a fake/simplified box.'
  - Imprint palette applied in exact canonical order across the 5 abstract categories
    (green, lavender, blue, ochre, matte-red), with the brand green correctly on the
    first series.
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, readable ink-colored title/axis/tick text in both themes, subtle
    horizontal-only grid, no dark-on-dark or light-on-light failures.'
  - No edge clipping or overlap in either render; generous, well-balanced margins
    (top 20 / right 40 / bottom 64 / left 80) fill the canvas without cramming or
    wasting space.
  - Deterministic LCG-seeded data generation (seed 42) with per-class mean/std variation
    that produces visibly different spreads across classes.
  - skipAnimation set on ChartContainer and outlier markers rendered as hollow circles
    (fill = t.pageBg) so they read correctly against both theme backgrounds.
  weaknesses:
  - 'Design Excellence is at the well-configured-default level: no intentional focal
    point, callout, or emphasis beyond the required per-category coloring — consider
    highlighting the class with the tightest/highest distribution or annotating a
    notable outlier to give the chart a clearer story.'
  - Only Class A shows an outlier point; the other four classes have none, so the
    outlier-marker feature is demonstrated only once. Nudging one or two more class
    std-devs/means would surface outliers in at least 2-3 classes for a stronger feature-coverage
    showcase.
  - The box-and-whisker marks are necessarily hand-drawn SVG (via useXScale/useYScale)
    since the community package has no BoxPlot component — a reasonable and well-documented
    workaround, but it means the implementation can't lean on any MUI X mark-level
    API (e.g. ChartsReferenceLine for a class-average marker, or ChartsTooltip wiring
    for the custom layer) to show deeper library-specific richness beyond the axis/grid/container
    composition already used.
  - Grid and spine treatment (horizontal-only grid, L-shaped frame) comes mostly from
    MUI X defaults (ChartsGrid horizontal, standard axis lines) rather than additional
    deliberate refinement — fine as-is, but there's room for more visual polish (e.g.
    finer grid opacity tuning, box corner treatment) to move past 'good default' into
    'refined'.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-basic · javascript · muix · anyplot.ai" top-left in dark ink, fully visible and unclipped. Y-axis label "Exam Score (%)" rotated on the left, X-axis label "Class" centered below the tick row. Tick labels (0-100 in steps of 5 on Y; Class A-E on X) all dark and clearly readable. Horizontal grid lines only, subtle (~15% opacity), do not compete with the data.
      Data: Five box-and-whisker plots for Class A-E. Colors follow the Imprint categorical palette in canonical order: Class A = brand green (#009E73), Class B = lavender, Class C = blue, Class D = ochre, Class E = matte red. Each box shows a visible median line, a filled IQR box (semi-transparent), whiskers extending to the 1.5*IQR fence, and one hollow outlier circle below Class A's lower whisker. Distributions are visually distinct: Class C is tight and high (best scores), Class B is wide with a long lower tail, Class D has the lowest median.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light/off-white ink, fully legible against the dark surface. Grid lines are the same subtle horizontal treatment, rendered in a light low-opacity stroke so they remain visible without dominating.
      Data: Same five boxes in the same hue positions and same underlying hex values as the light render (green/lavender/blue/ochre/red) — only the box fill's blended appearance shifts slightly because the semi-transparent fill (28% opacity) is composited over a different background, which is expected alpha-blending behavior, not a color change. Stroke colors, median lines, whiskers, and the single outlier circle for Class A are unchanged from the light render.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, and tick label is clearly visible in light ink against the near-black background, and the brand green on Class A reads well on both surfaces.
