review:
  strengths:
  - 'Correct box statistics computed from the records: linear-interpolated quartiles,
    whiskers at the most extreme values inside 1.5×IQR, and every value beyond the
    fences drawn as an individual hollow point at its value'
  - 'Idiomatic MUI X v9 composition for a chart type the community surface lacks:
    ChartsContainer with band and linear axis configs, ChartsGrid, ChartsXAxis/ChartsYAxis,
    and a custom SVG layer positioned through the useXScale/useYScale hooks'
  - Shared value axis derived from the data range with padding, not forced to zero,
    so medians and spreads compare directly
  - 'Imprint palette taken whole from window.ANYPLOT_TOKENS in canonical order (Calculus
    I in #009E73); data colors identical in both renders, chrome threaded through
    ink/inkSoft/grid tokens'
  - 'Refined marks beyond the baseline: 30 % tinted box fill with a solid outline,
    a heavier 3.5 px median stroke, rounded box corners, narrower whisker caps and
    page-filled outlier rings'
  - Plausible, neutral scenario (exam scores in five math courses, 55–74 students
    each) with visibly different spreads, skew and a few outliers; deterministic LCG
    + Box-Muller data
  weaknesses:
  - 'Suggestion: in the dark render the Probability median (blue on a dark-blue tinted
    fill) has the least contrast of the five; a slightly lower fill opacity would
    make every median pop equally.'
  - 'Suggestion: the header''s Library line reads ''muix 7.29.1'' although the code
    targets the pinned v9 composition API; keep the header version in sync with the
    vendored package.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, no white panel.
      Chrome: bold dark title "box-basic · javascript · muix · anyplot.ai" centred at top with a soft-ink subtitle ("317 observations · Course section: 5 · Whiskers at 1.5×IQR · 3 outliers"); y-axis "Exam score (%)" with ticks 20–100, x-axis "Course section" with five category ticks; dashed subtle horizontal grid; left and bottom axis lines only. All text dark and readable.
      Data: five boxes in Imprint order — Calculus I #009E73, Linear Algebra purple, Probability blue, Differential Equations ochre, Numerical Analysis red — 30 % tinted fills, solid outlines, heavier median line, capped whiskers; hollow outlier rings at ~59 (Calculus I), ~18 (Linear Algebra) and ~24 (Differential Equations). Y axis starts near 12, not at zero.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles and tick labels flip to light ink and read clearly; grid dashes are subtle but visible; no dark-on-dark text.
      Data: identical hues to the light render; tinted fills now read as dark shades of each hue, medians and outlines remain clearly visible (Probability median lowest contrast but distinct). Brand green clearly visible.
      Legibility verdict: PASS
