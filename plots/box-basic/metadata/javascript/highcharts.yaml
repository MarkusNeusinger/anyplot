review:
  strengths:
  - 'Clean, well-reasoned engineering workaround for the missing native boxplot series:
    stacked invisible-floor + IQR column (colorByPoint) with two null-separated line
    series for whiskers/caps and the median, all documented with clear header comments
    explaining the layering rationale.'
  - Median line uses t.pageBg as its stroke color, which self-adapts to a light or
    dark cutout groove against any box color in either theme without needing a separate
    contrast token.
  - Correct Imprint canonical color order across all 5 categories (green, lavender,
    blue, ochre, red), identical between light and dark renders; only chrome flips.
  - Whiskers correctly computed at 1.5*IQR with outliers rendered as separate scatter
    points colored to match their category.
  - 'Realistic, varied data: different means/stds/n per class produces genuinely different
    spreads and medians, with outliers present in 3 of 5 categories.'
  - Explicit font sizing throughout (title 22px, axis titles 16px, tick labels 14px)
    and both renders are fully legible with no dark-on-dark or light-on-light failures.
  weaknesses:
  - 'Design Excellence is solid but short of publication-grade polish (DE-01 6/8):
    box borders, whisker caps, and outlier markers are functional but fairly plain
    — slightly refined stroke weights or subtler cap styling would elevate it further.'
  - Visual refinement (DE-02 4/6) is good but still close to library defaults — grid
    lines and the box border weight could be softened a touch more for a more premium
    feel.
  - Data storytelling (DE-03 4/6) relies only on per-category color to differentiate
    groups; there's no visual emphasis calling out the most notable pattern (e.g.
    Geometry's unusually wide spread and low outlier, or Algebra II's tight, high
    distribution) — a subtle highlight or annotation would strengthen the narrative.
  - 'Library Mastery (LM-02 3/5): stacking, colorByPoint, and the custom tooltip pointFormatter
    are solid Highcharts idioms but not deeply distinctive — leaning further into
    Highcharts-unique capabilities would raise this.'
  - Helper functions (lcg, randNormal, quartile, boxStats) push CQ-01 (KISS Structure)
    to 2/3 — necessary here since Highcharts' core bundle has no native boxplot stats,
    but still a deviation from the ideal flat imports→data→plot→save structure.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Dark bold title "box-basic · javascript · highcharts · anyplot.ai" clearly readable at top center; axis titles "Class" (x) and "Final Exam Score (%)" (y) in a soft dark gray, fully legible; tick labels (class names, percentage values) dark and crisp against the light background; horizontal gridlines are subtle, light gray, visible but not dominant.
      Data: 5 box-and-whisker groups (Algebra I, Geometry, Algebra II, Precalculus, Calculus) each in a distinct Imprint palette color in canonical order — green (#009E73), lavender, blue, ochre, red. Each box has a dark 1.5px border, a white median line crossing it, thin gray whisker lines with end caps, and colored outlier dots below the lower whisker for 3 of 5 categories. All elements are clearly distinguishable from the background and from each other.
      Legibility verdict: PASS.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Title now rendered in light/white text, fully legible against the dark background; axis titles and tick labels rendered in a light warm-gray, fully readable; gridlines are subtle light gray on the dark surface, visible without dominating.
      Data: Same 5 categories in the identical Imprint colors as the light render (green, lavender, blue, ochre, red) — confirmed unchanged data-color mapping. Box borders switch to a light/near-white stroke for contrast against the dark background, median line renders as a near-black cutout line inside each colored box (still clearly visible against every box color), whiskers in light gray, outlier dots colored to match their category. No dark-on-dark or light-on-light failures observed anywhere.
      Legibility verdict: PASS.
