review:
  strengths:
  - 'Data-driven storytelling now added: xAxis.plotBands (with computed widestIdx/tightestIdx)
    shade and label the classes with the widest spread and the tightest, most consistent
    distribution — directly fixes Attempt 1''s DE-03 gap and stays correct if the
    underlying data changes.'
  - Box border, whisker caps, and outlier markers were visibly softened (borderColor
    ink to inkSoft, borderWidth 1.5 to 1.25, borderRadius 2 added, whisker linecap
    round, outlier fillOpacity 0.85) — a genuine polish pass over Attempt 1, addressing
    the DE-01/DE-02 feedback.
  - 'Clean, well-documented engineering workaround for the missing native boxplot
    series: stacked invisible-floor + IQR column (colorByPoint) plus two null-separated
    line series for whiskers/caps and the median.'
  - Median line uses t.pageBg as its stroke color, self-adapting to a light or dark
    cutout groove against any box color in either theme without a separate contrast
    token — confirmed legible on every box color in both renders.
  - Correct Imprint canonical color order across all 5 categories, identical between
    light and dark renders — only chrome flips.
  - Whiskers correctly computed at 1.5*IQR with outliers rendered as separate scatter
    points colored to match their category; realistic varied data (different means/stds/n
    per class) with outliers in 3 of 5 categories.
  - Explicit font sizing throughout, fully legible in both themes with no theme-adaptation
    failures; canvas dimension gate passed (3200x1800).
  weaknesses:
  - Grid line weight/opacity is unchanged from Attempt 1 — still close to library
    defaults; a touch more restraint would push Visual Refinement further.
  - Helper functions (lcg, randNormal, quartile, boxStats) still push KISS structure
    down slightly — necessary here since Highcharts' core bundle has no native boxplot
    stats, but a deviation from a flat imports to data to plot to save structure.
  - Library Mastery is solid (plotBands storytelling, colorByPoint, custom tooltip
    pointFormatter) but could lean further into Highcharts-unique capabilities (e.g.
    dataLabels or zones) for a top Library Mastery score.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white and not dark.
      Chrome: Bold dark title "box-basic · javascript · highcharts · anyplot.ai" clearly readable at top center. Axis titles "Class" (x) and "Final Exam Score (%)" (y) render in soft dark gray, fully legible. Tick labels (class names, percentage values 40-100) are dark and crisp. Horizontal gridlines are subtle but visible. Two shaded xAxis.plotBands with italic labels "Widest spread" (over Geometry) and "Most consistent" (over Algebra II) are legible and unobtrusive.
      Data: Five box-and-whisker groups (Algebra I, Geometry, Algebra II, Precalculus, Calculus) each use a distinct Imprint color in canonical order — green #009E73, lavender, blue, ochre, red. First series confirmed brand green. Each box has a softened dark-gray border, a near-white median line that reads as a cutout groove against every box color, thin gray whiskers with rounded end caps, and colored outlier dots (3 of 5 categories have outliers).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black and not light.
      Chrome: Title renders in light/white text, fully legible. Axis titles and tick labels render in light warm-gray, fully readable. Gridlines remain subtle on the dark surface. The same two plotBands ("Widest spread" over Geometry, "Most consistent" over Algebra II) are legible with light-gray italic labels.
      Data: The five boxes use identical Imprint colors to the light render (green, lavender, blue, ochre, red) — confirmed unchanged data-color mapping; only the box border and median-line strokes flip to a near-black cutout groove that stays visible against every box color. No dark-on-dark or light-on-light failures observed anywhere. Brand green remains clearly visible.
      Legibility verdict: PASS
