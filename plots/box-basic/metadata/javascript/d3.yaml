      Data: Five box-and-whisker plots in canonical Imprint order - Class A green (#009E73), Class B lavender (#C475FD), Class C blue (#4467A3), Class D ochre (#BD8233), Class E matte red (#AE3030). Each box shows a semi-transparent fill, a colored median line, whisker caps, and outlier circles below/above the whiskers for Class A, Class B, and Class D.
      Legibility verdict: PASS - all text is clearly readable, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, not pure black.
