review:
  strengths:
  - Correct box-plot statistics (Q1/median/Q3, whiskers at 1.5*IQR, outlier detection)
    computed by hand and rendered accurately in both themes.
  - 'Canonical Imprint palette applied correctly across the 5 categories, first series
    is brand green #009E73, and data colors are identical between light and dark renders.'
  - 'Clear data storytelling: dashed overall-mean markLine with label plus a ''Widest
    spread (IQR ...)'' callout on the highest-variance class, with that box''s border
    thickened to match.'
  - Clean theme-adaptive chrome — hidden x-axis line/ticks, subtle horizontal-only
    gridlines, both renders fully legible with no dark-on-dark or light-on-light issues.
  - Deterministic data generation via a seeded LCG + Box-Muller transform, appropriate
    given the browser has no built-in seeded RNG.
  weaknesses:
  - Class D's high outlier marker (~100%) sits touching/overlapping the upper whisker
    cap in both themes — a small nudge to symbol size or z-order would clean up that
    crowding.
  - Data storytelling relies on a single annotation + mean line; no secondary hierarchy
    device (e.g. ordering categories by median, muted color for non-highlighted boxes)
    reinforces the focal point further.
  - Outliers are rendered via a secondary generic scatter series overlay (necessary
    since ECharts' boxplot series doesn't auto-plot outliers) rather than a distinctive
    library-specific feature — correct but not a showcase of something unique to ECharts.
  - Several helper functions (makeLcg, randNormal, percentile) add structure beyond
    the simplest possible script — justified by the need for deterministic RNG and
    quartile math in the browser runtime, but still more complex than a minimal KISS
    implementation.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, fontsize 24. Y-axis title "Test Score (%)" in dark ink, rotated, mid-left. X-axis category labels (Class A-E) and Y-axis tick labels (0-100) in a slightly softer dark gray. A dashed horizontal markLine labeled "Overall mean: 78.9%" crosses near y=79. An annotation "Widest spread (IQR 13.2)" sits above Class C's box. All text is clearly legible against the light background.
      Data: Five box-and-whisker plots, one per class, each with a distinct colored border (green, lavender/purple, blue, ochre, red — canonical Imprint order) and a light/elevated fill interior. Median line visible inside each box. Individual outlier points shown as filled circles in the matching series color below/above several boxes (Class A, B, C, D, E all show at least one outlier). Class C's box has a visibly thicker border, matching the widest-spread annotation. First series (Class A) is the brand green #009E73.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black, not light.
      Chrome: Same title, axis title, and tick labels now rendered in light/white ink against the dark background — fully readable, no dark-on-dark issues. The dashed mean line and "Overall mean: 78.9%" label render in a light gray, clearly visible. The "Widest spread (IQR 13.2)" annotation is in white/light text, clearly visible above Class C's box.
      Data: Same five box plots with identical border/outlier colors to the light render (green, lavender, blue, ochre, red) — box interiors use a dark elevated fill instead of the light one, consistent with theme-adaptive chrome. Data colors are confirmed identical between light and dark renders; only chrome (background, text, grid) flips.
      Legibility verdict: PASS
