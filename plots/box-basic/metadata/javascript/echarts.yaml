review:
  strengths:
  - Idiomatic ECharts boxplot + scatter overlay to render outliers separately — matches
    the library's official recommended pattern since boxplot series alone doesn't
    auto-render outlier points
  - 'Full Imprint canonical palette used correctly across all 5 classes, first series
    is #009E73, identical data colors between light and dark renders'
  - 'Theme-adaptive chrome verified correct in both renders — no dark-on-dark or light-on-light
    failures, backgrounds match #FAF8F1/#1A1A17'
  - Deterministic LCG-seeded data generation with realistic per-class distributions
    (different means/std) and genuine outliers computed via 1.5*IQR fences
  - Title format exactly matches the mandated convention; y-axis label is descriptive
    with units ("Test Score (%)")
  - Refined custom box styling — elevated-bg fill with colored border plus subtly-ringed
    outlier markers — shows deliberate design thought beyond library defaults
  weaknesses:
  - 'Data Storytelling is default-level: distributions vary and outliers are shown,
    but there''s no visual emphasis (color/opacity/annotation) calling out which class
    has the widest spread or most outliers — add a subtle focal point so the viewer
    sees the insight immediately'
  - 'Aesthetic polish could go further: the bottom x-axis line is kept while the y-axis
    line is hidden, an inconsistent partial-spine look — either remove both for a
    fully clean frame or keep a consistent L-shape (left+bottom)'
  - Library Mastery is generic beyond the boxplot+scatter combo — no use of other
    ECharts-distinctive features (e.g. markLine for a mean/threshold reference, custom
    tooltip formatter, or emphasis states) that would showcase more of the library's
    unique capabilities
  - Mandated title occupies a noticeably small proportion of canvas width (~25-30%)
    at fontSize 22 — not a hard violation since the title text itself is short, but
    a slightly larger size would give it stronger visual hierarchy relative to the
    3200px canvas
  - Outlier marker size (11) and box border width (2.5) are adequate but modest —
    could be bumped slightly for stronger visual prominence at full resolution, especially
    for the more sparse outlier points
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "box-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Y-axis label "Test Score (%)" rotated along the left edge in dark ink. X-axis category labels (Class A-E) and Y-axis tick labels (0-100) in soft gray ink, all legible. Horizontal gridlines are subtle and don't compete with data.
      Data: Five box-and-whisker plots, one per class, each using a distinct Imprint palette color as the box border/whisker/outlier color (green, lavender, blue, ochre, red — canonical order, first series is #009E73). Box interiors are a near-white elevated fill, giving a clean unfilled-box look. Median line visible inside each box in the category color. Outliers rendered as filled dots below/above the whiskers for Class A, B, C, D, and E, with varying counts confirming genuine distribution differences.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis label, and tick labels all render in light/off-white text, clearly visible against the dark background. Gridlines remain subtle. No dark-on-dark text failures observed anywhere (title, axis label, tick labels, category labels all pass).
      Data: Same five box plots with identical border/whisker/outlier colors as the light render (green, lavender, blue, ochre, red) — confirming the Imprint data colors are constant across themes. Box fill is now a dark elevated gray, providing contrast against both the near-black page background and the colored borders.
      Legibility verdict: PASS — all text remains fully readable in the dark theme; no dark-on-dark or unreadable elements found.
