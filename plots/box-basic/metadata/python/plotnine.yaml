  strengths:
  - Theme tokens applied to all chrome; both renders readable with correct backgrounds
  - 'Imprint palette in canonical order with #009E73 first'
  - $20k y-axis breaks make whisker ends and outliers easy to read off
  - geom_boxplot draws 1.5*IQR whiskers and individual outliers natively
  weaknesses:
  - 'SC-01 (both): three annotation layers the -basic spec excludes (C4: no callouts)
    sit on the chart: a Support-to-Engineering gap bracket with its title, a ''Senior
    hires above market rate'' callout with connector, and a ''Narrow spread (σ ≈ $8k)''
    note → remove all three. Likely cause: the annotate(''text''/''segment''/''label'')
    calls at lines 84-122.'
  - 'SC-01 (both): a diamond point drawn on every median is an extra layer that duplicates
    the median line → remove it. Likely cause: stat_summary(fun_y=np.median, geom="point",
    shape="D") at line 80.'
  - 'Suggestion: ordering the departments by their computed median would give the
    boxes a clean ascending reading order (Marketing currently precedes the lower-median
    Sales).'
