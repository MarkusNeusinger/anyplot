  strengths:
  - Median line, box outline and whiskers drawn in the INK token over the Imprint
    fill, so the median stands out against every box in both themes
  - go.Box with boxpoints='outliers' computes quartiles, 1.5xIQR fences and outlier
    points natively instead of by hand
  - 'Fully theme-adaptive chrome: INK/INK_SOFT/GRID tokens flip cleanly; Imprint positions
    1-5 identical in both renders'
  - 'Clean -basic scope: one box per department, no callouts, bands or reference lines;
    redundant legend dropped since the x axis names every box'
  - hovertemplate with dollar-formatted salary for the HTML view
  - Column constants and a single tidy df make the data block easy to swap
  weaknesses:
  - 'Suggestion: a slightly lighter whisker or outline weight (e.g. 2 px) in the dark
    render would let the colored fills carry more of the visual weight against the
    bright ink lines.'
