  strengths:
  - Whiskers styled through mark_boxplot's rule sub-mark in INK_SOFT, so they read
    on both the light and the dark surface
  - Shared salary axis with zero=False and $ formatting lets medians and spreads compare
    directly
  - 'Canonical Imprint order with Engineering in #009E73 and identical category colors
    across themes'
  - Aggregate tooltips (median, Q1, Q3) give exact values in the HTML view
  - 'Clean adaptable structure: column constants, escaped fields, plot reads only
    df'
  weaknesses:
  - 'Suggestion: the outlier circles at opacity 0.75 read dimmer on the dark surface
    (Sales, Engineering); full opacity would give them more presence.'
