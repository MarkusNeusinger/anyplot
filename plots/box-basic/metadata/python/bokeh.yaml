review:
  strengths:
  - Whiskers computed as the most extreme values within 1.5 x IQR and drawn with bokeh's
    native Whisker annotation; every value beyond them is an open circle at its value
  - Explicit Range1d fitted to the data (not forced to zero) keeps every whisker and
    outlier on one shared value axis
  - Median line in the INK token stands out on every box fill in both themes (near-black
    on light, cream on dark)
  - 'factor_cmap maps the four classes to the first four Imprint positions in canonical
    order, starting with #009E73; colors identical across themes'
  - 'Clean theme threading: page, ink and soft-ink tokens drive background, title,
    labels, ticks, grid, whisker stems and caps'
  weaknesses:
  - 'Suggestion: drawing the whiskers at level ''annotation'' or the boxes at full
    opacity would stop the whisker stem showing faintly through the box fill.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; no frame around the plot area.
      Chrome: title "box-basic · python · bokeh · anyplot.ai" top left in near-black, about 40 % of the width; italic axis titles "Class" and "Test score (points)" in dark ink; tick labels (30–100, 9A Biology … 9D History) in soft dark grey, all readable; subtle horizontal grid only.
