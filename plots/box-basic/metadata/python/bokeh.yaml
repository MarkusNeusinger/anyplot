review:
  strengths:
  - Whiskers computed as the most extreme values within 1.5 x IQR and drawn with bokeh's
    native Whisker annotation; every value beyond them is plotted as an open circle
    at its value
  - Explicit Range1d fitted to the data (not forced to zero) so the full Class C whisker
    down to 30 and the 122 outlier both stay on the shared value axis
  - Median line drawn in the INK token stands out on every box fill in both themes
    (near-black on light, cream on dark)
  - 'factor_cmap maps the four classes to the first four Imprint positions in canonical
    order, starting with #009E73; colors identical across themes'
  - 'Clean theme threading: page, ink and soft-ink tokens drive background, title,
    axis labels, ticks and the 15 % y-grid; no wrong-theme text'
  weaknesses:
  - 'VQ-03 (dark): the whisker caps render in bokeh''s default black on the #1A1A17
    background and almost vanish, while the stems are soft ink → caps in the INK_SOFT
    token like the stems. Likely cause: whisker.upper_head / lower_head line_color
    not set (TeeHead defaults to black).'
  - 'DQ-02 (both): the classes are labelled Class A–D, which reads generic → named
    classes (e.g. 9A Biology, 9B Chemistry, …). Likely cause: the keys of the scores
    dict.'
  - 'DQ-03 (both): a test score axis in points shows values above 100 (Class C outlier
    at about 122, Class C whisker at about 100, Class D outliers at 100 and 102) with
    no stated maximum above 100 → keep generated scores within a plausible 0–100 range
    or state a larger maximum in the label. Likely cause: np.random.normal tails and
    the injected 100/102 outliers not clipped to 100.'
  - 'Suggestion: drawing the whiskers at level ''annotation'' or the boxes at full
    opacity would stop the whisker stem showing faintly through the box fill.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; no frame around the plot area.
      Chrome: title "box-basic · python · bokeh · anyplot.ai" top left in near-black, about 40 % of the width; italic axis titles "Class" and "Test score (points)" in dark ink; tick labels (40–120, Class A–D) in soft dark grey, all readable; subtle horizontal grid only.
      Data: four boxes — Class A #009E73 green, Class B #C475FD lavender, Class C #4467A3 blue, Class D #BD8233 ochre — at 0.85 alpha with thin grey outlines; black median line in each; grey whisker stems with black caps; open circle outliers (A: 1 low; B: 1 high, 3 low; C: 1 at ~122; D: 2 high, 2 low). Class C's lower whisker reaches ~30 and is fully on the axis.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17.
      Chrome: title, axis titles and tick labels in light cream/grey tones, all readable; grid subtle; no dark-on-dark text.
      Data: same four categorical colors as the light render (identical hues); median lines switch to cream and stand out on every fill; whisker stems light grey, but the whisker caps stay black and nearly disappear on the dark background; outlier circles have light grey outlines and are visible.
      Legibility verdict: PASS (text); whisker caps weak in dark
