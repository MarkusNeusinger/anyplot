review:
  strengths:
  - 'Clean basic box plot: median line, 1.5*IQR whiskers and outliers as points, nothing
    the basic variant excludes'
  - Median line flips between INK and light ink so it stands out against every box
    fill in both themes
  - Imprint positions 1-5 in canonical order with fully theme-adaptive chrome
  - Idiomatic ax.boxplot with patch_artist and per-part prop dicts, plus patheffects.withStroke
    framing each translucent box
  - Data block ends in one tidy DataFrame with column constants, so the plot reads
    only df
  weaknesses:
  - 'Suggestion: the whisker lines show through the translucent (alpha 0.75) box edges
    as short stubs; a slightly higher box alpha or whisker zorder below the boxes
    would give cleaner box ends.'
  - 'Suggestion: the fill-colored edge inside the INK_SOFT stroke reads as a double
    outline; a single edge stroke would look crisper.'
