review:
  strengths:
  - 'Clean basic box plot: median line, 1.5*IQR whiskers, outliers as points and one
    Imprint color per department, with nothing the basic variant excludes'
  - Box outlines, whiskers and median lines drawn in the theme's INK token, so the
    median stands out against every fill in both light and dark renders
  - as_discrete(order_by='..middle..') orders the departments by their computed median,
    a letsplot-native way to rank groups
  - layer_tooltips() exposes Q1, median, Q3, min and max per box in the HTML output
  - Column constants and a self-contained Data block make the script easy to point
    at a real table
  weaknesses:
  - 'VQ-03 (both): the outlier circles at outlier_size=2.5 (~60 px across at full
    size) overlap so far that Sales'' two values near $130k merge into one mark and
    Engineering''s lowest outlier sits on its whisker cap, hiding a value → about
    1.5 (−1), or a translucent fill, so each outlier reads as its own point. Likely
    cause: geom_boxplot outlier_size=2.5.'
  - 'Suggestion: a slightly thinner box outline (size≈0.9) would let the fills carry
    more of the color.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: bold dark title "box-basic · python · letsplot · anyplot.ai" top-left with a grey subtitle "Salary distributions by department, ordered by median"; axis titles "Department" and "Annual Salary (USD)" in dark ink; dollar-formatted y ticks $20,000-$140,000 and department ticks in soft dark grey; thin horizontal grid lines only; L-shaped axis lines. All readable.
      Data: five boxes ordered by median left to right — HR ochre #BD8233, Marketing lavender #C475FD, Sales blue #4467A3, Finance red #AE3030, Engineering green #009E73 — with near-black outlines, whiskers and thick median lines; large filled outlier circles above and below the whiskers. Sales' two outliers near $130k overlap almost completely.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: title, subtitle, axis titles and ticks flip to light ink and are clearly readable; no dark-on-dark text anywhere; grid lines subtle grey.
      Data: same five fill colors in the same order as the light render; outlines, whiskers and median lines flip to light ink #F0EFE8 and stand out against every fill; outlier circles keep their category fills with a light grey rim. Same outlier overlap at Sales.
      Legibility verdict: PASS
