review:
  strengths:
  - Native geom_pie explode aesthetic pulls out the smallest slice (OPPO) while the
    other slices stay joined
  - Slice labels take their color from the fill via layer_labels().inherit_color()
    and scale_color_identity, readable on every slice in both themes
  - Imprint palette in canonical order with the theme-adaptive muted anchor for the
    Others rest category
  - Page-colored spacers separate the slices cleanly in both themes
  - layer_tooltips gives brand and share on hover in the HTML export
  weaknesses:
  - 'Suggestion: the subtitle calls the ''Others'' remainder the dominant player;
    naming the largest brand (Apple, 23.1%) would keep the sentence about companies.'
  - 'Suggestion: a slightly smaller gap between the pie and the caption would tighten
    the lower third.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the square 2400x2400 canvas.
      Chrome: bold dark title 'pie-basic · python · letsplot · anyplot.ai', soft-ink subtitle "OPPO's 8.8% slice is the smallest — 'Others' dominate at 35%", muted caption 'Global smartphone market share, 2024', legend 'Brand' at right on an elevated off-white box with outlined circle glyphs. All text dark and readable.
      Data: flat pie, Apple #009E73 23.1%, Samsung #C475FD 19.4%, Xiaomi #4467A3 13.7%, OPPO #BD8233 8.8% (exploded), Others muted #6B6A63 35.0%; page-colored spacers. Labels white on green, blue, ochre and grey, near-black on lavender.
