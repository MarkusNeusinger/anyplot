review:
  strengths:
  - Native geom_pie explode aesthetic pulls out the smallest slice (OPPO) while the
    other slices stay joined
  - Page-colored spacer and stroke between slices give clean separations in both themes
  - Imprint palette in canonical order with the theme-adaptive muted anchor for the
    Others rest category
  - layer_tooltips gives brand and share on hover in the HTML export
  weaknesses:
  - 'VQ-01 (both): the percentage labels keep lets-plot''s white default on every
    fill and read faintly on the light ones, about 2.3:1 on the dark render''s muted
    Others slice (#A8A79F) and about 2.7:1 on Samsung''s lavender #C475FD → a label
    color that follows the fill (INK #1A1A17 on the lavender and dark-theme muted
    slices, white on the green, blue, ochre and light-theme muted slices), at least
    4.5:1. Likely cause: layer_labels() without a .color() and no per-slice label
    color.'
  - 'Suggestion: the subtitle calls the ''Others'' remainder the dominant player;
    naming the largest brand (Apple, 23.1%) would keep the sentence about companies.'
  - 'Suggestion: a slightly smaller gap between the pie and the caption would tighten
    the lower third.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole square 2400x2400 canvas.
      Chrome: bold dark title 'pie-basic · python · letsplot · anyplot.ai' at top, soft-ink subtitle "OPPO's 8.8% slice is the smallest — 'Others' dominate at 35%", muted caption 'Global smartphone market share, 2024' at bottom, legend 'Brand' at right on an elevated off-white box. All chrome text is dark and readable.
      Data: full flat pie, Apple #009E73 (23.1%), Samsung lavender #C475FD (19.4%), Xiaomi blue #4467A3 (13.7%), OPPO ochre #BD8233 (8.8%, exploded), Others muted #6B6A63 (35.0%); page-colored spacers between slices. White percentage labels inside each slice; the one on lavender reads with low contrast.
      Legibility verdict: PASS (lavender slice label faint, see VQ-01)

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, subtitle and caption in soft/muted light ink, legend on elevated #242420 box with light text. No dark-on-dark text.
      Data: categorical colors identical to the light render; the Others rest slice switches to the adaptive muted #A8A79F, as designed. White percentage labels; '35.0%' on the light grey Others slice and '19.4%' on lavender have low contrast.
      Legibility verdict: PASS (two slice labels faint, see VQ-01)
