review:
  strengths:
  - A single flat pie with the largest slice (AWS, 31 %) pulled out by explode computed
    from the data (df[SHARE] == max), so the emphasis follows the data rather than
    a typed index
  - Every slice carries a bold percentage label from autopct at pctdistance=0.72,
    all clear of each other, including the 4 % Alibaba Cloud sliver
  - Wedge edges in the page color (wedgeprops edgecolor=PAGE_BG) separate neighbouring
    slices cleanly in both themes
  - 'Theme tokens threaded through all chrome: title and slice names in INK, legend
    frame on ELEVATED_BG with INK_SOFT entries, readable in both renders'
  - 'Imprint positions 1-5 in canonical order, AWS on brand green #009E73, identical
    across themes'
  - 'Idiomatic matplotlib: the wedges returned by ax.pie are reused as legend handles,
    and the returned autotexts are styled directly; legend title read from the column
    constant'
  weaknesses:
  - 'Suggestion: the percentage labels could take the dark ink on the lighter lavender
    slice (#C475FD) for a little more contrast than white gives there.'
  - 'Suggestion: the legend swatches inherit the 2 pt page-colored wedge edge, which
    shows as a faint box around each swatch on the dark legend frame; a thinner handle
    edge would look cleaner.'
