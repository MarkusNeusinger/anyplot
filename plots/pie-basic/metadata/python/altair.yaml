review:
  strengths:
  - 'Slice angles come from explicit start/end fields on one shared theta scale (theta
    + theta2), so every layer, including the exploded one, places its slice at the
    true share: AWS 31 %, Azure 24 %, Others 27 % close the full circle'
  - 'Native Altair explode: radiusOffset on the largest slice''s arc and its label,
    chosen from the data (exploded = value == max) rather than a hard-coded category'
  - Percentage labels drawn in theme ink (alt.value(INK) / INK_SOFT), readable in
    both renders; the 3 % and 4 % slivers get a separate, farther and smaller label
    layer
  - Correct canvas via width=600, height=600 with autosize fit and padding=10; theme-adaptive
    chrome and the Imprint palette in canonical order
  - Tooltips with provider and share in the HTML output
  weaknesses:
  - 'SC-02 (both): the 3 % and 4 % labels float about 60 view-px beyond their narrow
    Oracle and Alibaba slices with no leader line, as the spec''s label bullet asks
    for narrow slices → a short leader line from each sliver''s edge to its label,
    or the label pulled close to the slice. Likely cause: labels_small at radius=230
    against an outerRadius of 170 with no rule layer.'
  - 'VQ-05 (both): the legend box sits left of centre (about x 35–1383 of 1932) under
    a centred pie and title → centre it under the pie. Likely cause: orient="bottom"
    legend with fixed columns, no legend direction/anchor that centres it (e.g. legendX
    or orient none with legendX at the view centre, or a narrower columns setting).'
  - 'CQ-05 (code): the mandatory fit-to-canvas block from the altair library prompt
    is missing after the PNG save → add the inline PIL block (TW, TH = 2400, 2400).
    Likely cause: the block was dropped because the chart already fits.'
  - 'Suggestion: a slightly smaller pie radius ratio to the label ring would bring
    the outer labels closer to their slices.'
  image_description: |-
