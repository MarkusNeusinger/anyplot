review:
  strengths:
  - Slice angles come from explicit start/end fields on one shared theta scale (theta
    + theta2), so every layer, the exploded one included, sits at its true share and
    the six slices close the full circle
  - 'Native Altair explode: radiusOffset on the largest slice''s arc and its label,
    picked from the data (exploded = value == max) rather than a hard-coded category'
  - Percentage labels in theme ink via alt.value(INK) / INK_SOFT, readable in both
    renders; the 3 % and 4 % slivers get their own smaller, softer label layer
  - Legend centred under the pie as an elevated horizontal box (orient='none' with
    legendX/legendY, titleOrient top), theme-adaptive in both renders
  - autosize fit with padding=10 plus the mandated PIL fit-to-canvas block; tooltips
    with provider and share in the HTML output
  weaknesses:
  - 'SC-02 (both): the 3 % and 4 % labels sit about 30 view-px beyond their narrow
    Oracle and Alibaba slices with no leader line, which the spec''s label bullet
    asks for where a slice is narrow → a short leader line (a mark_rule or a second
    arc-radius text anchor) from each sliver''s edge to its label. Likely cause: labels_small
    at radius=200 against outerRadius=170 with no leader layer.'
  - 'Suggestion: the band between the subtitle and the top of the pie (about 270 px)
    is wider than the gap between the 24 % label and the legend; nudging legendY down
    or the pie up would even the vertical rhythm.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, not pure white.
      Chrome: title "pie-basic · python · altair · anyplot.ai" in dark ink, subtitle "Global Cloud Infrastructure Market Share" in INK_SOFT, both centred; a centred elevated legend box "Provider" with six horizontal entries under the pie. All text readable.
      Data: flat, round pie of six slices in canonical Imprint order — AWS #009E73 (31 %, pulled out to the upper right), Azure #C475FD (24 %), Google Cloud #4467A3 (11 %), Alibaba #BD8233 (4 %), Oracle #AE3030 (3 %), Others #2ABCCD (27 %); page-coloured separators. Bold percentage labels in dark ink outside each slice; 3 % and 4 % smaller in INK_SOFT beside their slivers, no leader lines. No axes or grid.
      Legibility verdict: PASS

