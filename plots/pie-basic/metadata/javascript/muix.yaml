review:
  strengths:
  - Clever dual-series technique (transparent slice in the main series + an offset
    single-item overlay series) achieves a true exploded slice while keeping the pie's
    overall proportions and cumulative angles correct.
  - Per-slice arc-label fill colors (LABEL_FILLS) were deliberately chosen for contrast
    against each Imprint palette color, rather than relying on a single default text
    color.
  - 'Legend ordering bug from the previous review attempt is fixed: the exploded slice''s
    legend entry now leads the legend in the pie''s clockwise order instead of trailing
    at the end.'
  - Imprint palette used in canonical order with brand green (#009E73) on the largest,
    exploded slice; data colors are identical between light and dark renders, only
    chrome flips.
  - Realistic, neutral dataset (website traffic sources summing cleanly to 100%) with
    a sensible category count (6, within the 3-8 spec range).
  - Clean explode gap with no label overlap or edge clipping in either theme; percentage
    labels are legible even on the smallest 4% slice.
  weaknesses:
  - LABEL_FILLS is applied via '.MuiPieArcLabel-root:nth-child(1..6)' selectors, but
    the DOM likely renders 7 arc-label elements (6 from the main series + 1 from the
    exploded overlay series) — the exploded slice's own label isn't explicitly covered
    by a numbered rule and currently only reads correctly by coincidence of MUI's
    default fill. Prefer an explicit per-item color (e.g. driving fill from the same
    LABEL_FILLS/CATEGORIES data via arcLabel styling or a valueFormatter) instead
    of sibling-index CSS selectors tied to render order.
  - Title spans only ~45% of the plot width, comfortably under the 50-70% guideline
    — not a defect, but there's a little headroom to size it up slightly for better
    use of the square canvas.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with the required #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "pie-basic · javascript · muix · anyplot.ai" centered at the top with generous clearance from the canvas edge. Bottom legend row lists all 6 categories (Organic Search, Direct, Social Media, Referral, Paid Search, Email) with colored swatches and dark text, in the same clockwise order as the pie slices.
      Data: Six wedges in Imprint palette canonical order (green, lavender, blue, ochre, red, cyan). The largest slice, Organic Search (38%, brand green #009E73), is popped outward from the pie's center with a clean gap on both sides — no overlap with neighboring slices. Each slice carries a bold percentage label (38%, 22%, 16%, 12%, 8%, 4%) in a fill color chosen per-slice for contrast (black on green/lavender/ochre/cyan, white on blue/red); all are legible, including the small 4% cyan slice.
      Legibility verdict: PASS — all title, legend, and arc-label text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with the required #1A1A17 — not pure black, not light.
      Chrome: Title and legend text render in light/white against the dark background (theme-adaptive via the MUI ThemeProvider). Legend order and content are identical to the light render.
      Data: Slice colors and arc-label fill colors are pixel-identical to the light render (verified: green, lavender, blue, ochre, red, cyan wedges and their percentage labels are unchanged) — only the page background and text chrome flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; title, legend, and all six arc labels remain clearly legible.
