review:
  strengths:
  - 'Exploded largest slice (Organic Search, 38%) is built from native MUI X series
    options: a one-item overlay series with startAngle/endAngle and an offset cx/cy
    along the bisector, while the main series keeps data order and drives the legend;
    the other five slices stay joined'
  - Percentage labels via arcLabel plus a custom pieArcLabel slot that picks dark
    ink or white per slice fill, so all six labels (including the 4% sliver) read
    clearly on every Imprint color in both themes
  - Slice separators stroke in t.pageBg, so the gaps follow the theme (cream in light,
    near-black in dark) and adjacent slices stay distinct
  - Data sorted descending from 12 o'clock and the percentages are computed from the
    records (38/22/16/12/8/4 of a total of 100), with a plausible web-traffic-source
    scenario
  - Native HTML legend at the bottom in data order, sized at 18 px and themed by the
    harness ThemeProvider; tooltips are available in the interactive HTML
  weaknesses:
  - 'VQ-07 (both): the fifth category, Paid Search, is drawn in matte red #AE3030,
    the deferred semantic anchor for bad/loss/error, although nothing about paid search
    is a loss → skip slot 5 for a neutral category, e.g. the cyan #2ABCCD for Paid
    Search and rose #954477 for Email. Likely cause: color: t.palette[i] maps the
    sixth category straight onto the ordinal positions 1–6.'
  - 'CQ-04 (code): lines 45–56 write out the WCAG relative-luminance formula and the
    contrast-ratio comparison by hand, which @mui/material/styles computes with getContrastRatio
    (or getLuminance) → replace luminance/labelInk with getContrastRatio(fill, DARK_INK)
    > getContrastRatio(fill, ''#FFFFFF'') ? DARK_INK : ''#FFFFFF''. Likely cause:
    the contrast helper written from scratch instead of importing the MUI color utility.'
  - 'Suggestion: the gap between the title and the top of the pie (about 170 px) is
    larger than the gap above the legend; trimming MARGIN.top would let the pie grow
    a little and balance the vertical whitespace.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, matches #FAF8F1; no pure white.
      Chrome: title "pie-basic · javascript · muix · anyplot.ai" centered at the top in dark bold ink, about 40 % of the width; horizontal legend at the bottom (Organic Search, Direct, Social Media, Referral, Paid Search, Email) with colored dots and dark text. No axes or grid, as expected for a pie. All text readable.
      Data: 6-slice flat pie starting at 12 o'clock, clockwise in data order: Organic Search 38 % (#009E73 brand green, exploded outward along its bisector with a clear gap), Direct 22 % (lavender #C475FD), Social Media 16 % (blue #4467A3), Referral 12 % (ochre #BD8233), Paid Search 8 % (matte red #AE3030), Email 4 % (cyan #2ABCCD). Slices separated by cream page-colored strokes. Bold percentage labels on every slice: dark ink on green, lavender, ochre, cyan; white on blue and red — all legible, the 4 % label fits inside the cyan sliver.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black, matches #1A1A17; not pure black.
      Chrome: title and legend text flip to light ink and are clearly readable; no dark-on-dark text anywhere. Slice separators flip to the near-black page color.
      Data: slice colors identical to the light render (green, lavender, blue, ochre, red, cyan); the same exploded green slice and the same per-slice label inks (dark on light fills, white on blue/red), all readable.
      Legibility verdict: PASS
