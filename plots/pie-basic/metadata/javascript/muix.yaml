review:
  strengths:
  - Correct Imprint palette in canonical order with the brand green (#009E73) on the
    largest slice, identical hues across both themes
  - Explode effect on the largest slice (Organic Search) directly satisfies the spec's
    'slightly explode the largest or smallest slice for emphasis' requirement
  - Per-slice arc-label fill colors are individually chosen for WCAG contrast against
    each Imprint hue, keeping every percentage label legible
  - Realistic, neutral business dataset (website traffic sources) with well-differentiated
    values from 4% to 38%
  - 'Theme-adaptive chrome via ANYPLOT_TOKENS with correct backgrounds (#FAF8F1 light
    / #1A1A17 dark) in both renders'
  - skipAnimation set, deterministic hardcoded data, single clean import — no stray
    dependencies
  weaknesses:
  - Legend lists 'Organic Search' last even though it is the largest/exploded slice
    drawn first in the pie — an artifact of splitting it into a second overlay series.
    Reorder the legend (or set explicit legend item order) so it matches the pie's
    clockwise slice order and keeps the exploded, most-important category visually
    first.
  - Legend label font size relies on MUI X defaults rather than an explicit size (only
    itemMarkWidth/Height and spacing are set in slotProps.legend) — set an explicit
    labelStyle fontSize for full text-legibility credit.
  - The explode offset is computed by manually re-deriving MUI X's internal d3 pie-generator
    angle convention (startAngle 0 at 12 o'clock, clockwise, no padding) — correct
    today but fragile if the library's internal defaults ever change; worth a comment
    noting the coupled assumption or a more robust approach.
  - Design Excellence is solid (rounded corners, theme-matched stroke separators)
    but stays close to a well-configured baseline rather than pushing into standout
    publication-level polish.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with the #FAF8F1 Imprint light-theme page color — not pure white.
      Chrome: Bold centered title "pie-basic · javascript · muix · anyplot.ai" in dark ink, clearly readable. Legend sits below the pie with dark-ink labels ("Direct", "Social Media", "Referral", "Paid Search", "Email", "Organic Search") and matching color swatches — all legible.
      Data: Six-slice pie, largest slice (Organic Search, 38%) rendered in brand green (#009E73) and offset outward (exploded) with a visible gap from its neighbors. Remaining slices proceed clockwise in canonical Imprint order: Direct (lavender, 22%), Social Media (blue, 16%), Referral (ochre, 12%), Paid Search (red, 8%), Email (cyan, 4%). Percentage labels are printed inside each slice with per-slice contrast-tuned fill (black or white) so every label is readable against its background hue. Thin light-colored strokes separate slices.
      Legibility verdict: PASS — all title, legend, and in-slice text is clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with the #1A1A17 Imprint dark-theme page color — not pure black.
      Chrome: Same title now rendered in light/cream ink, clearly readable against the dark background. Legend labels are light-colored and fully legible; swatches are unchanged from the light render.
      Data: Same six slices in the same colors, same proportions, and the same exploded Organic Search slice — data colors are identical to the light render as required; only chrome (background, text, slice-separator stroke color) has flipped. No dark-on-dark or light-on-light failures observed anywhere.
      Legibility verdict: PASS — all title, legend, and in-slice text is clearly readable against the dark background; brand green remains vivid and identical to the light render.
