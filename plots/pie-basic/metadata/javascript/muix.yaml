review:
  strengths:
  - Exploded largest slice (Organic Search, 38%) is pulled out along its bisector
    by an overlay series that redraws the exact arc with startAngle/endAngle and an
    offset cx/cy, while the main series keeps every slice and drives the legend in
    data order; the other five slices stay joined
  - Arc-label ink is chosen per slice through MUI's own getContrastRatio inside a
    slots.pieArcLabel override of PieArcLabel, so 38%/22%/12%/8% read in dark ink
    and 16%/4% in white, legible on every Imprint fill in both themes
  - 'Slice separators are 3 px strokes in the page token (t.pageBg), so the slices
    separate cleanly on #FAF8F1 and #1A1A17 alike without a foreign outline color'
  - 'Categorical pool drops Imprint slot 5 (matte red) so no traffic source reads
    as a loss, and brand green #009E73 leads as the first slice'
  - Plausible, neutral scenario (website traffic sources summing to 100%) with one
    dominant slice and a thin 4% sliver, square 2400x2400 canvas, skipAnimation set
    and native hover tooltips in the HTML output
  weaknesses:
  - 'Suggestion: the file carries two header comment blocks (the rewritten one above
    the //# anyplot-orientation directive and the original one below it); keeping
    only one would tidy the top of the file.'
  - 'Suggestion: the legend at 18 px could go a step larger to balance the 22 px slice
    labels in the 400 px thumbnail.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas, no axes or grid.
      Chrome: bold dark title "pie-basic · javascript · muix · anyplot.ai" centered at the top (~40% of width); horizontal legend centered at the bottom with six circular swatches (Organic Search, Direct, Social Media, Referral, Paid Search, Email) in dark ink — all readable.
      Data: one round, undistorted pie with six slices in data order clockwise from 12 o'clock: Organic Search #009E73 (38%, pulled out to the right with a clear page-colored gap), Direct #C475FD (22%), Social Media #4467A3 (16%), Referral #BD8233 (12%), Paid Search #2ABCCD (8%), Email #954477 (4%). Bold percentage labels sit inside every slice, dark ink on light fills and white on the blue and rose slices; no collisions. Slices separated by thin page-colored strokes.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title and legend text flip to light ink and are clearly readable; no dark-on-dark text.
      Data: slice colors identical to the light render; separators and the explode gap now show the dark page color; arc label inks unchanged (chosen against the slice fill), all readable. Brand green clearly visible.
      Legibility verdict: PASS
