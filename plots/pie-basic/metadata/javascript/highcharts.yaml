review:
  strengths:
  - 'Genuinely Highcharts-distinctive touch: a custom `chart.renderer.text()` label
    drawn into the donut hole via the `events.render` hook, re-measured with `getBBox()`
    and re-centered every render — not a generic pattern available as a one-line option
    in most other libraries'
  - 'Data storytelling is now reinforced at three levels that all agree: the exploded/selected
    green slice, the bold name+percentage data label on that slice, and the center
    KPI callout ("Market leader / Nimbus Cloud / 31.4%") sitting in the chart''s strongest
    focal position'
  - '`connectorShape: "crookedLine"` + `crookDistance` is a Highcharts-specific dataLabels
    feature, used correctly for the smaller slices'' leader lines'
  - 'Correct Imprint palette compliance held from attempt 1: brand green `#009E73`
    is both the largest slice and the exploded one; theme-adaptive chrome (background,
    ink, subtitle, legend, center label) flips correctly with identical data colors
    across both renders'
  - Clean, deterministic, KISS-structured code; realistic neutral market-share data
    summing to 100% with a sensible "Others" long-tail bucket
  weaknesses:
  - The subtitle ("Nimbus Cloud leads at 31.4%") now duplicates the center-label callout
    verbatim — with the donut center already telling that story, the subtitle could
    carry a different, complementary fact (e.g. combined top-3 share) instead of repeating
    the same number a third time
  - innerSize is a fixed 55% — a small nod to the center-label's exact text footprint
    (measured via getBBox but not fed back into ring sizing) would tighten the composition
    further, though current spacing is already clean
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "pie-basic · javascript · highcharts · anyplot.ai" in bold dark ink; subtitle "Cloud infrastructure market share by vendor — Nimbus Cloud leads at 31.4%" in softer gray; legend row of 6 items below the donut in gray text. All clearly readable against the light background.
      Data: Donut chart, six slices in canonical Imprint palette order — brand green (Nimbus Cloud 31.4%, exploded), lavender (Vertex Systems 22.8%), blue (Halcyon Labs 18.5%), ochre (Ferro Dynamics 12.9%), matte red (Quinta Networks 8.7%), cyan (Others 5.7%). Percentage data labels in dark ink with thin connector leader lines for the smaller slices; the leading slice's label is bold and includes the company name. A center callout inside the donut hole reads "MARKET LEADER / Nimbus Cloud / 31.4%" with the percentage rendered in brand green.
      Legibility verdict: PASS — no light-on-light text, all elements crisp.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, legend, and data labels all render in light/white tones; the center callout's "MARKET LEADER" micro-label sits in muted gray, "Nimbus Cloud" in bold white, and "31.4%" in the same brand green as the light render.
      Data: Slice colors are pixel-identical to the light render — only chrome (background, text, slice separator strokes) flips as expected. No dark-on-dark failures — every text element (title, subtitle, legend, data labels, center callout) is clearly legible against the near-black surface.
      Legibility verdict: PASS — theme-adaptive chrome confirmed correct in both renders.
