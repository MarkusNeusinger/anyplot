review:
  strengths:
  - 'Correct Imprint palette compliance: brand green #009E73 is the largest slice
    and also the one exploded per the spec''s ''emphasize largest slice'' requirement'
  - Theme-adaptive chrome works correctly across both renders — background, title,
    subtitle, legend, and data-label ink all flip appropriately with identical data
    colors
  - Clean, deterministic, KISS-structured code using idiomatic Highcharts pie config
    (dataLabels with connector distance, tooltip pointFormat, plotOptions.pie)
  - Realistic, neutral market-share data that sums to exactly 100% with a sensible
    'Others' long-tail bucket, avoiding real company names for neutrality
  weaknesses:
  - Design excellence leans on standard Highcharts pie defaults (explode + bg-matched
    borders) without a distinctive polish moment — consider something like a refined
    data-label connector treatment, subtle innerSize/donut variant, or bolder typographic
    contrast for the leading slice to reach publication-level sophistication
  - 'Library mastery is generic: explode/colorByPoint/tooltip are available in nearly
    every charting library with minor syntax changes — exercise a Highcharts-distinctive
    capability (e.g. a custom dataLabels formatter function, half-donut startAngle/endAngle,
    or the accessibility module) to demonstrate real library-specific depth'
  - Data storytelling relies only on descending slice order plus the single exploded
    wedge — a stronger focal emphasis (e.g. contrasting subtitle framing or bolding
    the leader's data label) would make the 'market leader' insight more immediate
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "pie-basic · javascript · highcharts · anyplot.ai" in bold dark ink, subtitle "Cloud infrastructure market share by vendor" in softer gray, legend row of 6 items below the pie all in dark/gray text. All clearly readable against the light background.
      Data: Six slices in Imprint palette order — brand green #009E73 (Nimbus Cloud, 31.4%, exploded/emphasized), lavender (Vertex Systems, 22.8%), blue (Halcyon Labs, 18.5%), ochre (Ferro Dynamics, 12.9%), matte red (Quinta Networks, 8.7%), cyan (Others, 5.7%). Percentage data labels are dark ink, with connector leader lines for the smaller slices and inline labels for the two largest. Slice borders match the page background, creating clean separation between wedges.
      Legibility verdict: PASS — all text is clearly legible, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, subtitle, and legend text all render in light/white tones, clearly visible against the dark background. Data labels are also light-colored (theme-adaptive ink), matching the dark chrome.
      Data: Identical six colors and slice proportions to the light render — confirms data colors are constant across themes; only chrome (background, text) flips as expected. Slice borders match the dark page background, preserving the same clean separation effect.
      Legibility verdict: PASS — no dark-on-dark failures; all text and data labels are clearly readable against the near-black surface.
