review:
  strengths:
  - 'Full theme-adaptive chrome: INK, INK_SOFT, PAGE_BG and ELEVATED_BG threaded through
    title, legend and slice dividers'
  - 'Imprint palette in canonical order with R&D (largest) on #009E73 via a named
    scale_fill_manual vector'
  - Pie built idiomatically with geom_rect + coord_polar(theta = "y") on precomputed
    cumulative extents
  - Pie fills the square canvas well beside a compact legend
  weaknesses:
  - 'SC-02 (both): the 4 % IT slice carries no percentage label, so one slice of six
    is unlabeled (C2) → label it outside the rim in theme ink. Likely cause: if_else(pct
    >= 5, ..., "") blanks the label instead of moving it outside.'
  - 'SC-02 (both): the ''explode'' enlarges the R&D slice''s radius by 12 % (xmin/xmax
    + 0.12) instead of shifting it outward, so R&D bulges past the circle and leaves
    a notch at the pie''s center (C1, C4) → translate the slice radially with its
    radii unchanged. Likely cause: exploding by xmin/xmax in coord_polar, which changes
    radius, not position.'
  - 'Suggestion: page-colored dividers read as gaps on the dark surface; a thin INK_SOFT-tinted
    divider would be an alternative.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: bold dark title "pie-basic · r · ggplot2 · anyplot.ai" centered at top; legend "Department" on the right in an #FFFDF6 box with INK_SOFT frame listing R&D, Marketing, Operations, Sales, HR, IT; no axes or grid. All text readable.
      Data: six slices clockwise from 12 o'clock: IT #2ABCCD, HR #AE3030 (10 %), Sales #BD8233 (14 %), Operations #4467A3 (18 %), Marketing #C475FD (22 %), R&D #009E73 (32 %). R&D drawn with a larger outer radius and a notch at the center. Bold off-white percentage labels inside five slices; the IT sliver has no label. Pie fills ~46 % of the canvas width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title in light #F0EFE8; legend box #242420 with light frame and light labels; no dark-on-dark text.
      Data: slice colors identical to the light render; dividers show as near-black gaps that still separate slices. Same center notch and unlabeled IT sliver.
      Legibility verdict: PASS
