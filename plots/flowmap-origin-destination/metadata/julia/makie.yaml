review:
  strengths:
  - Dual-encodes flow magnitude via both arc linewidth and the imprint_seq green-to-blue
    color gradient, so major corridors (Delhi-Dubai, Mexico City-Los Angeles) are
    immediately visible in two dimensions at once
  - Node markers sized by total in/out flow highlight hub cities without adding extra
    chrome or a second legend
  - Custom stylized continent silhouettes give geographic context with no external
    geodata dependency, alpha-blended tastefully into the theme-adaptive land fill
  - 'Full theme-adaptive chrome: background, ink tokens, and colorbar tick colors
    all flip correctly between light/dark while data colors (brand-green nodes, green-blue
    arc gradient) stay pixel-identical'
  - Canvas lands exactly on 3200x1800 with no clipped or crowded elements; colorbar
    column is proportionally sized via colsize!(fig.layout, 2, Relative(0.05))
  weaknesses:
  - No city-name labels on origin/destination nodes -- with 24 cities and 30 overlapping
    arcs, viewers cannot tell which corridor connects which specific cities without
    an external reference; consider small text labels on just the largest hub nodes
    to avoid clutter
  - The cluster of crossing arcs converging over the Middle East / South Asia region
    is visually dense; widening the curvature spread slightly or lowering alpha a
    touch further in that region would help disentangle the busiest corridors
  - Land silhouettes are highly simplified stylized polygons rather than real coastline
    data -- acceptable given the in-code disclaimer, but a minor realism gap
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full canvas.
      Chrome: Title "flowmap-origin-destination · julia · makie · anyplot.ai" in bold dark ink, ~50% of plot width, fully visible with generous top margin, no clipping. Colorbar on the right labeled "Flow volume (thousands / year)" in dark ink with gray tick labels (50/100/150/200), all fully inside the canvas with margin to spare. No x/y axis ticks/spines (intentionally hidden, appropriate for a map).
      Data: Stylized light-gray continent silhouettes with subtle darker outline. Curved arcs connect city nodes, colored on a green (#009E73) to blue (#4467A3) gradient by flow magnitude and widened proportionally to flow (alpha ~0.6). City nodes are solid brand-green (#009E73) circles sized by total connected flow (largest near Delhi/Dubai hub). The thickest, bluest arcs (Delhi-Dubai, Mexico City-Los Angeles) are the two highest-flow corridors and stand out clearly.
      Legibility verdict: PASS -- all text (title, colorbar label, tick labels) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the full canvas.
      Chrome: Same title, now in white/light-ink bold text, same size and position, fully visible. Colorbar label and tick labels rendered in light gray/white, fully legible against the dark background. Continent silhouettes render as a slightly lighter charcoal fill with a faint outline, keeping geographic context visible on dark.
      Data: Arc and node colors are pixel-identical to the light render (same green-to-blue gradient, same brand-green nodes) -- only the chrome (background, text, land fill) flipped, exactly as required.
      Legibility verdict: PASS -- no dark-on-dark failures observed; title, colorbar label, and tick labels are all clearly readable against the near-black background.
