review:
  strengths:
  - Top-5 hub cities (London, Los Angeles, Dubai, Delhi, Mumbai) are now labeled directly
    on the map, letting a viewer identify the major corridors without an external
    reference -- this directly resolves attempt 1's main weakness
  - Dual-encodes flow magnitude via both arc linewidth and the imprint_seq green-to-blue
    color gradient, so major corridors (Delhi-Dubai, Mexico City-Los Angeles) are
    immediately visible in two dimensions at once
  - The crowded Middle East / South Asia hub cluster now gets a wider curvature spread
    and a lower alpha (0.5 vs 0.6) specifically for hub-to-hub arcs, measurably reducing
    visual tangling in the busiest corridor cluster
  - Node markers sized by total in/out flow highlight hub cities without adding extra
    chrome or a second legend
  - 'Full theme-adaptive chrome: background, ink tokens, and colorbar tick colors
    all flip correctly between light/dark while data colors (brand-green nodes, green-blue
    arc gradient) stay pixel-identical'
  - Canvas lands exactly on 3200x1800 with no clipped or crowded elements; colorbar
    column is proportionally sized via colsize!(fig.layout, 2, Relative(0.05))
  weaknesses:
  - The mandated title renders at only ~30% of plot width (smaller than the typical
    50-70% target) -- not a defect, but there is headroom to size it up slightly for
    stronger visual presence
  - The Dubai/Delhi/Mumbai/London hub cluster is still visually dense with many crossing
    arcs behind the new city labels -- legible, but a further alpha reduction or slightly
    wider spread in that specific region would help even more
  - Land silhouettes are highly simplified stylized polygons rather than real coastline
    data -- acceptable given the in-code disclaimer, but a minor realism gap
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), consistent across the full canvas.
      Chrome: Title "flowmap-origin-destination · julia · makie · anyplot.ai" in bold dark ink, roughly 30% of plot width, fully visible with generous margins, no clipping. Colorbar on the right labeled "Flow volume (thousands / year)" in dark ink with gray tick labels (50/100/150/200), fully inside the canvas. No x/y axis ticks/spines (intentionally hidden, appropriate for a map). Five hub-city labels (London, Los Angeles, Dubai, Delhi, Mumbai) render in bold dark text directly above their nodes.
      Data: Stylized light-gray continent silhouettes with subtle darker outline. Curved arcs connect city nodes, colored on a green (#009E73) to blue (#4467A3) gradient by flow magnitude and widened proportionally to flow (alpha ~0.5-0.6). City nodes are solid brand-green (#009E73) circles sized by total connected flow (largest at Dubai). The thickest, bluest arcs (Delhi-Dubai, Mexico City-Los Angeles) are the two highest-flow corridors and stand out clearly.
      Legibility verdict: PASS -- all text (title, colorbar label, tick labels, city labels) reads clearly against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), consistent across the full canvas.
      Chrome: Same title, now in white/light-ink bold text, same size and position, fully visible. Colorbar label and tick labels rendered in light gray/white, fully legible against the dark background. The five hub-city labels render in bold white text, clearly readable. Continent silhouettes render as a slightly lighter charcoal fill with a faint outline, keeping geographic context visible on dark.
      Data: Arc and node colors are pixel-identical to the light render (same green-to-blue gradient, same brand-green nodes) -- only the chrome (background, text, land fill) flipped, exactly as required.
      Legibility verdict: PASS -- no dark-on-dark failures observed; title, colorbar label, tick labels, and city labels are all clearly readable against the near-black background.
