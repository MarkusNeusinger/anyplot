review:
  strengths:
  - Native geom_curve() with x/y/xend/yend aesthetics draws one curved arc per flow
    whose ends sit exactly on the airport coordinates, with linewidth mapped to flow
    so LHR–DXB (6.5M) and DXB–SIN (5.8M) visibly dominate the 2.3M SIN–SYD arc
  - Arcs at alpha 0.65 keep the thin LHR–TYO and LHR–HKG arcs readable where they
    run beside the thick European corridors to DXB
  - The hand-built coastline basemap is drawn in INK_MUTED at linewidth 0.2, clearly
    quieter than the arcs in both themes, so the flow pattern leads
  - 'Color by origin region is explained by an ''Origin Region'' legend (Americas
    #009E73 first, Imprint order), so the reader knows the color encodes the direction''s
    origin; the width legend uses override.aes to draw neutral INK_SOFT samples tied
    to flow values'
  - IATA code labels sit in open space with thin leader lines back to their airports,
    keeping the dense LHR/AMS/CDG/FRA cluster legible in both themes
  - 'All chrome threads the theme tokens: warm #FAF8F1 / #1A1A17 backgrounds, elevated
    legend and label boxes, readable ink in both renders'
  weaknesses:
  - 'VQ-02 (both): the CDG label box sits on top of the purple NYC→CDG arc at about
    (-13, 40), hiding a stretch of that arc''s line → place the CDG label anchor clear
    of every arc path (for example south-west of Paris over the Bay of Biscay, around
    lon -12, lat 45, or over the Mediterranean). Likely cause: airports$label_lon/label_lat
    for CDG set to (-14, 40), which lies on the NYC–CDG curve.'
  - 'DQ-02 (both): the network names real airport pairs (LHR–DXB, NYC–LHR, DXB–SIN
    …) and attaches invented passenger volumes to them, which reads as published route
    statistics despite the ''Illustrative'' subtitle → use volumes sourced from published
    route statistics or present the hubs as a clearly fictional network. Likely cause:
    the flow vector in flows_raw.'
  - 'Suggestion: the destination arrowheads at 0.008 npc are barely visible; a slightly
    larger arrow() length would make flow direction readable without the legend.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across plot and panel; legend boxes in the slightly lighter elevated tone with a soft ink border.
      Chrome: bold title "Global Air Passenger Flows · flowmap-origin-destination · r · ggplot2 · anyplot.ai" at ~80% width, grey subtitle "Illustrative network: LHR–DXB is the busiest corridor at 6.5M pax/yr", axis titles Longitude / Latitude, ticks -100…150 and -40…60, subtle grid. All dark text, fully readable.
      Data: simplified coastlines (North America, Eurasia, Africa, SE Asia, Australia) drawn as thin muted grey outlines; 15 curved arcs between 10 hub airports colored by origin region — Americas #009E73 (NYC), Europe #C475FD (LHR/CDG/AMS/FRA), Middle East #4467A3 (DXB), Asia Pacific #BD8233 (SIN/HKG/TYO/SYD); widths scale with flow (thickest LHR→DXB and DXB→SIN). Filled airport circles with page-colored outline, bold IATA code labels in boxes joined by leader lines. Right side: "Origin Region" legend (4 entries) and "Flow (M pax/yr)" width legend (3–6). The CDG label box covers part of the NYC→CDG arc.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend and label boxes in the elevated #242420 tone with light border.
      Chrome: title, subtitle, axis titles and tick labels in light ink, all clearly readable; grid subtle; no dark-on-dark text anywhere.
      Data: arc and point colors identical to the light render (green, purple, blue, amber); coastlines in muted grey remain visible but quiet; the blue Middle East arcs are darker against the dark page but still clearly distinguishable. Width-legend samples flip to light grey and remain visible.
      Legibility verdict: PASS
