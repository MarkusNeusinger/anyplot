review:
  strengths:
  - Native geom_curve() with curvature = -0.3 draws one smooth Bezier-style arc per
    flow whose ends sit exactly on the airport coordinates, and the grid arrow() head
    at the destination encodes flow direction without an extra channel
  - Arc width maps flow through scale_linewidth_continuous(range = c(0.4, 2.8)) with
    a 3/4/5/6 M pax/yr key whose glyphs use guide_legend(override.aes = list(color
    = INK_SOFT, alpha = 1)), so the key reads in both themes and LHR–DXB, DXB–SIN
    and TYO–HKG stand out as the major corridors
  - Arcs at alpha 0.65 (within the spec's 0.4–0.7) keep thin flows such as DXB–TYO
    and SIN–SYD visible beside the thick ones
  - Hand-built coastline basemap drawn in INK_MUTED at linewidth 0.2 stays clearly
    quieter than the arcs, so the flow pattern leads
  - 'Origin-region color follows the Imprint order (Americas #009E73, Europe #C475FD,
    Middle East #4467A3, Asia Pacific #BD8233), the factor levels keep the legend
    in palette order, and color and fill share one merged ''Origin Region'' legend'
  - IATA labels in ELEVATED_BG boxes with thin INK_SOFT leader lines sit in open space,
    which keeps the dense European cluster readable; the subtitle names the busiest
    corridor (LHR–DXB, 6.5M pax/yr), which matches the data maximum
  - 'All chrome is threaded through theme tokens: both renders are theme-correct,
    with readable text and identical data colors'
  weaknesses:
  - 'VQ-03, SC-02 (both): three of the 15 flows (LHR→AMS 2.5, FRA→AMS 3.8, AMS→CDG
    2.9) span only a few degrees and are hidden under the size-3.5 airport markers
    of the European cluster, so no arc can be seen for them and the ''one curved arc
    per flow'' property is lost for a fifth of the data → each flow''s arc must be
    visible clear of the markers: use flow pairs that are not neighbours inside the
    cluster, or smaller markers (about size 2.5, −1). Likely cause: the short intra-Europe
    pairs in flows_raw combined with geom_point(size = 3.5).'
  - 'DQ-02 (code): the flows are invented (''Synthetic international air passenger
    flows'') but are attributed to real airport pairs as route volumes, for example
    LHR–DXB at 6.5M pax/yr, which the subtitle presents as fact → real airport names
    carrying invented numbers; either use published route volumes or label the network
    as illustrative in the subtitle and the comment. Likely cause: the flow vector
    in flows_raw.'
  - 'Suggestion: coord_cartesian() stretches latitude about 1.5× relative to longitude
    (about 5.7 px per degree of longitude against about 8.6 px per degree of latitude),
    so Africa and Europe look tall; coord_quickmap() would give the basemap correct
    proportions and is a distinctive ggplot2 map coordinate system.'
  - 'Suggestion: the labels mix city codes (NYC, TYO) and airport codes (LHR, CDG,
    DXB); JFK and HND would be consistent with the coordinates used.'
  - 'Suggestion: the typed coord_cartesian limits and label anchor coordinates could
    be derived from the airport table, as the library prompt asks, so the plot adapts
    to other data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the plot and panel; legend boxes on the slightly lighter elevated surface with a thin INK_SOFT frame.
      Chrome: bold dark title "Global Air Passenger Flows · flowmap-origin-destination · r · ggplot2 · anyplot.ai" at about 80 % of the width; grey subtitle "LHR–DXB is the busiest corridor at 6.5M pax/yr"; axis titles "Longitude" / "Latitude" in dark ink; tick labels −100…150 and −40…60 in soft grey; very faint grid. Legends on the right: "Origin Region" (Americas, Europe, Middle East, Asia Pacific) and "Flow (M pax/yr)" (3, 4, 5, 6 with grey line-plus-arrow glyphs of rising width). All text readable.
      Data: thin grey hand-drawn coastlines (Americas, Europe, Africa, Asia, Australia, islands) under 15 translucent curved arcs with small arrowheads, colored by origin region: green from NYC (to LHR, CDG, DXB), lavender from Europe (thick LHR→DXB, LHR→TYO over the north), blue from DXB (thick DXB→SIN, thin DXB→TYO, DXB→FRA), ochre in Asia Pacific (SIN→HKG, SIN→TYO, thick TYO→HKG, thin SIN→SYD). First series is #009E73. Airport dots in their region color with a page-colored outline; boxed bold IATA labels on leader lines. The LHR–AMS, FRA–AMS and AMS–CDG arcs are hidden under the clustered European dots.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; legend boxes on the #242420 elevated surface with a light frame.
      Chrome: title in near-white, subtitle and tick labels in light grey, axis titles light; grid faint but visible; coastlines in muted grey remain visible and quiet. Label boxes flip to a dark fill with light bold text. No dark-on-dark text anywhere.
      Data: arc, dot and legend colors are identical to the light render (green, lavender, blue, ochre); only the translucent arcs blend darker against the dark page. The width key glyphs flip to light grey and stay visible.
      Legibility verdict: PASS
