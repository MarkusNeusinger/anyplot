review:
  strengths:
  - Per-pair deterministic curvature jitter (hash-based) now fans arcs apart near
    busy hubs (Rotterdam, Shanghai, Jebel Ali) instead of bundling them into one bowed
    band — directly fixes the prior review's convergence complaint.
  - Top-4 hub ports (Rotterdam, Shanghai, Jebel Ali, Singapore) are now direct-labeled
    with textOutline for contrast, so major corridors are identifiable in the static
    PNG without hovering.
  - 'Axis bounding box removed (xAxis/yAxis lineWidth: 0) while keeping subtle gridlines
    — the chart now reads as a geographic canvas rather than a generic scatter frame.'
  - Manual legend font sizes raised to 14-15px, matching the 14px tick-label baseline
    used elsewhere in the chart.
  - Hand-built basemap (continent silhouettes via chart.renderer.path with Chaikin
    polygon smoothing) is genuine library mastery given the core bundle has no highmaps
    module.
  - Port bubble radius is sqrt-scaled (area-proportional) against total throughput,
    and flow arc color/width both encode magnitude via a correct imprint_seq gradient
    — no Imprint palette violations across either theme.
  - Realistic, neutral container-shipping dataset (22 flows between 11 major world
    ports) with plausible relative magnitudes and clear hub structure.
  weaknesses:
  - The thinnest arcs (1.5px, ~58 kTEU flows) are still comparatively faint against
    the ocean basemap even after the curvature jitter fans them apart from hub clusters
    — a touch more minimum width or opacity would help.
  - 'CQ-01 KISS Structure remains modest: multiple helper functions (smoothPolygon,
    drawContinents, hashStr, curvatureFor, arcPoints, lerpColor, drawLegend) are needed
    because core Highcharts lacks a highmaps/flow-map module — justified, but still
    a departure from a flat imports-data-plot script.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills the outer chart margin, as required.
      Chrome: Plot area is overlaid with a light-blue "ocean" basemap (#CFE3EF) and beige "land" continent silhouettes (#E4E0D2) — intentional geographic chrome, exempt from the Imprint data-color rule per the code's own comment. Title, subtitle, "Longitude (°)"/"Latitude (°)" axis titles, tick labels, and the manually drawn legend box text are all dark and fully legible against both the cream margin and the light-blue ocean. Hub port labels (Rotterdam, Shanghai, Jebel Ali, Singapore) render in dark text with a light text-outline, staying readable over both land and ocean.
      Data: Port bubbles are solid #009E73 green with a light outline; flow arcs use a continuous green-to-blue gradient (imprint_seq) keyed to flow magnitude, with line width also scaling by magnitude. No light-on-light issues found.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the outer margin, as required.
      Chrome: Plot area flips to a dark-navy ocean (#16222E) and dark-olive land (#33332C). Title, subtitle, axis titles, tick labels, and the legend all flip to light tones and remain clearly legible against both the near-black margin and the dark-navy plot area. Hub labels keep their dark-background text outline, still legible. No dark-on-dark failures observed anywhere.
      Data: Port bubble green and the arc color gradient are pixel-identical to the light render — only chrome (background, land/ocean chrome, text) changed between themes, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS
