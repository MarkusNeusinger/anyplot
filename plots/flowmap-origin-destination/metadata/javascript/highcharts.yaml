review:
  strengths:
  - Hand-built basemap (continent silhouettes via chart.renderer.path with Chaikin-style
    polygon smoothing) is genuine library mastery given the core bundle has no highmaps
    module — no forbidden add-on modules used.
  - Great-arc flow lines are quadratic-Bezier polylines sampled into native `line`
    series, all bowed with a consistent rotational sense so the whole network reads
    coherently rather than as random noodles.
  - Port bubble radius is sqrt-scaled (area-proportional) against total throughput,
    which is the correct visual encoding for a magnitude-to-area mapping.
  - Manually constructed legend (renderer.rect + renderer.path + renderer.text) clearly
    explains both encodings — arc color/width for flow, bubble size for port throughput
    — since core Highcharts has no built-in gradient/width legend widget.
  - 'Imprint palette compliance is correct: port markers use `t.palette[0]` (#009E73)
    exactly, flow arcs use a `t.seq[0]->t.seq[1]` continuous gradient (correct choice
    for the continuous flow-magnitude variable), and data colors are identical between
    light/dark — only chrome (ocean/land basemap colors, backgrounds, text) flips.'
  - Realistic, neutral dataset (container-shipping TEU volumes between 11 major world
    ports) with plausible magnitudes and a sensible flow count (22, within the 20-200
    range).
  - Hover tooltips correctly surface exact origin→destination flow values and port
    totals — good use of JS-library interactivity that doesn't need to show up in
    the static PNG.
  weaknesses:
  - Manual legend text is undersized relative to the rest of the chrome (13px title,
    12-13px line labels vs. the 14px tick-label baseline used everywhere else) — bump
    to at least 13-14px for the labels and 14-15px for the legend title so it doesn't
    read as an afterthought.
  - All flow arcs share one fixed CURVATURE (0.16) and rotational sense, so near the
    busy Rotterdam/Hamburg/Shanghai hubs many arcs converge and overlap almost on
    top of each other right at the port bubble, making individual corridors hard to
    trace — vary curvature slightly per-arc (e.g. small deterministic jitter keyed
    on origin/dest pair) to fan them apart near shared endpoints.
  - Port names (Shanghai, Rotterdam, etc.) are only revealed on hover; for the static
    PNG preview that most viewers will see first, add small direct text labels next
    to the 3-4 largest hub bubbles so the major corridors are identifiable without
    interaction.
  - The xAxis/yAxis still render as a full bounding box with visible lineColor and
    a regular 30° grid, which reads more like a generic scatter-plot frame than a
    refined geographic canvas — consider a lighter/no axis line box (keep only the
    subtle gridlines) to lean further into the map-like presentation and lift DE-02.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1) fills the outer chart margin; the plot area itself is overlaid with a light-blue "ocean" basemap color (#CFE3EF) and beige "land" continent silhouettes (#E4E0D2) — this is intentional geographic chrome, not the theme background, and is explicitly exempted from the Imprint palette rule in the code comments.
      Chrome: Title "flowmap-origin-destination · javascript · highcharts · anyplot.ai" is bold dark text, fully legible. Subtitle in medium-gray is legible. Longitude/Latitude axis titles and tick labels are dark/soft-dark text, clearly readable against the light background. Gridlines at 30° intervals are subtle but visible over both ocean and land. The manual legend box (bottom-left, translucent off-white panel) has fully legible dark text and correctly rendered line-width/color samples.
      Data: First-drawn categorical series (port bubbles) use #009E73 green exactly. Flow arcs use a continuous green-to-blue gradient keyed to flow magnitude (thinner/lighter = smaller flow, thicker/bluer = larger flow), consistent with imprint_seq usage for continuous data.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17) fills the outer chart margin (visible at edges/behind legend); the plot area is overlaid with a dark navy "ocean" (#16222E) and dark-olive "land" (#33332C) — same intentional basemap-chrome exemption as the light render.
      Chrome: Title and subtitle flip to light text (white/light-gray), fully legible against both the dark margin and the dark-navy plot area. Axis titles, tick labels, and gridlines flip to light/soft tones and remain clearly readable — no dark-on-dark failures observed. The legend box flips to a dark elevated-surface panel with light text, fully legible.
      Data: Port bubble green (#009E73) and the flow-arc gradient colors are pixel-identical to the light render — only the basemap and text chrome changed, confirming correct theme-adaptive implementation.
      Legibility verdict: PASS
