review:
  strengths:
  - Custom hand-traced continent silhouettes (clipped to the drawing area via useXScale/useYScale)
    give real geographic context without a mapping/basemap library
  - Quadratic-Bezier arcs with rotated arrowheads correctly render curved origin-destination
    paths and clearly show flow direction
  - Flow magnitude is double-encoded (stroke width AND an imprint_seq color gradient),
    a CVD-safe redundant encoding that goes beyond the spec's minimum ask
  - Port circle radius encodes total throughput, adding a meaningful second data dimension
    (hub identification) on top of the required flow arcs
  - 'Imprint palette used correctly: ports in brand green #009E73, continuous flow-volume
    gradient built from imprint_seq (single-polarity, matching the data''s polarity)
    — no custom hexes'
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    chrome (title, axis, tick labels, legend, caption) readable in both themes, data
    colors identical across themes'
  - Manual label nudging (labelNudge map) prevents the closely clustered European
    ports (RTM/HAM/PIR) from colliding, while markers stay at their true coordinates
  weaknesses:
  - 'No hover tooltips on flow arcs or port circles: series={[]} means MUI X''s native
    tooltip system is never wired to the custom SVG overlay, so the interactive HTML
    has zero hover interactivity despite the spec explicitly asking for ''hover tooltips
    showing exact flow values and location names'' for interactive libraries — add
    onMouseEnter-driven tooltip state (or per-element MUI <Tooltip>) surfacing origin/destination
    names and the flow volume'
  - With ~21 arcs converging on hub ports (RTM, SIN, SHA), lines pile up and cross
    directly over/through the hub circles, creating visual clutter right at the plot's
    focal points — consider tuning bow curvature per cluster or lowering opacity further
    for arcs passing near large hub circles
  - Grid lines on both axes (horizontal + vertical) add reference lines that compete
    somewhat with the arc/basemap composition once the continent silhouettes already
    establish geographic context — a lighter or axis-only grid would read cleaner
  - Typography leans on a single weight/size scheme throughout (port codes, axis ticks,
    legend text all sit close together in visual weight) — a touch more hierarchy
    (e.g. slightly bolder/larger hub labels for SHA/SIN/RTM/LAX) would sharpen the
    storytelling
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "flowmap-origin-destination · javascript · muix · anyplot.ai" centered at top in dark ink, ~55% of canvas width, clearly readable. Longitude/Latitude axis with degree-formatted tick labels in soft gray-brown ink, both fully legible. A bottom-left gradient legend ("Flow volume (thousand TEU/year)" with 260/1450 endpoint labels) and a bottom-right caption ("Circle size = port throughput · arrows show flow direction") are both readable.
      Data: 14 port circles in brand green (#009E73), sized by throughput (Shanghai, Singapore, Rotterdam largest). 21 curved arcs connect ports, colored along an imprint_seq green-to-blue gradient and widened proportional to flow volume, with small triangular arrowheads showing direction. Light-gray continent silhouettes sit behind the arcs for geographic context. First data series (ports) is confirmed #009E73.
      Legibility verdict: PASS — all text readable against the light background, no dark-on-light or light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title, now in light ink (#F0EFE8-ish), clearly readable. Axis tick labels rendered in light gray, legible. Legend and caption text both switched to light color and remain fully readable against the dark background — no dark-on-dark failures found.
      Data: Port circles remain the identical brand green #009E73 as the light render. Arc gradient colors (green-to-blue) are unchanged from the light render — only the chrome (background, text, grid, continent fill) flipped to the dark theme, exactly as required. Continent silhouettes render as a subtle darker gray, still faintly visible for context.
      Legibility verdict: PASS — all text and data remain legible in the dark theme, brand green is still clearly visible.
