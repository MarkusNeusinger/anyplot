review:
  strengths:
  - Hover tooltips are now wired via onMouseEnter/onMouseLeave on both flow arcs and
    port circles, surfacing origin/destination names and exact flow volume in the
    interactive HTML — fixes the prior review's SC-02 gap where series={[]} left the
    overlay with zero interactivity
  - Grid narrowed to horizontal-only (ChartsGrid horizontal), removing the vertical
    grid that previously competed with the arc/basemap composition
  - Hub ports (top 4 by throughput) now get bolder, larger typographic treatment (fontWeight
    700 / fontSize 16 vs 500 / 14), sharpening the visual hierarchy between major
    and minor nodes
  - Hand-traced continent silhouettes rendered through useXScale/useYScale/useDrawingArea
    and clipped to the drawing area give real geographic context without a mapping
    library
  - Flow magnitude is double-encoded via stroke width AND an imprint_seq color gradient
    — a CVD-safe redundant encoding beyond the spec's minimum ask
  - Port circle radius encodes total throughput, adding a meaningful second data dimension
    (hub identification) on top of the required flow arcs
  - 'Imprint palette used correctly: ports in brand green #009E73, continuous flow-volume
    gradient built from imprint_seq (single-polarity, matching the data''s polarity)
    — no custom hexes'
  - 'Both renders are theme-correct: warm off-white / near-black backgrounds, all
    chrome (title, axis, tick labels, legend, caption) readable in both themes, data
    colors identical across themes'
  - Manual label nudging (labelNudge map) prevents the closely clustered European
    ports (RTM/HAM/PIR) from colliding while markers stay at their true coordinates
  weaknesses:
  - With ~21 arcs converging on hub ports (RTM, SIN, SHA), lines still pile up and
    cross directly over/through the hub circles, creating visual clutter right at
    the plot's focal points — the per-arc bow tuning helps but doesn't fully resolve
    the hairball at the busiest hubs
  - Typography hierarchy is now applied to hub vs. non-hub port codes, but axis ticks,
    legend text, and non-hub labels still sit close together in visual weight — a
    touch more contrast there would sharpen it further
  - Each city pair only shows a single directional flow; the spec calls out 'directional
    imbalances' as a use case, and a bidirectional pair (e.g. reciprocal flows between
    the same two ports with different volumes) would demonstrate that more explicitly
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 -- not pure white.
      Chrome: Title "flowmap-origin-destination · javascript · muix · anyplot.ai" centered at top in dark ink, comfortably narrow relative to canvas width, clearly readable. Longitude/Latitude axes with degree-formatted tick labels in soft gray-brown ink, both fully legible. A bottom-left gradient legend ("Flow volume (thousand TEU/year)" with 260/1450 endpoint labels) and a bottom-right caption ("Circle size = port throughput · arrows show flow direction") are both readable and stay within the canvas margins. Only horizontal grid lines are present, subtle and non-competing.
      Data: 14 port circles in brand green (#009E73), sized by throughput (Shanghai, Singapore, Rotterdam largest, rendered with bold/larger code labels as the top-4 hubs). 21 curved arcs connect ports, colored along an imprint_seq green-to-blue gradient and widened proportional to flow volume, with small triangular arrowheads showing direction. Light-gray continent silhouettes sit behind the arcs for geographic context. First data series (ports) confirmed #009E73.
      Legibility verdict: PASS -- all text readable against the light background, no light-on-light failures observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 -- not pure black.
      Chrome: Same title, now in light ink, clearly readable. Axis tick labels rendered in light gray, legible. Legend and caption text both switched to light color and remain fully readable against the dark background -- no dark-on-dark failures found.
      Data: Port circles remain the identical brand green #009E73 as the light render. Arc gradient colors (green-to-blue) are unchanged from the light render -- only the chrome (background, text, grid, continent fill) flipped to the dark theme, exactly as required. Continent silhouettes render as a subtle darker gray, still faintly visible for context.
      Legibility verdict: PASS -- all text and data remain legible in the dark theme, brand green is still clearly visible against #1A1A17.
