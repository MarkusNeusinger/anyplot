review:
  strengths:
  - Composes a custom flow layer inside ChartsContainer through useXScale / useYScale
    / useDrawingArea, so arcs, nodes and continents share MUI X's linear lon/lat axes
    and grid instead of a separate coordinate system
  - One quadratic Bezier arc per flow with both ends exactly on the origin and destination
    coordinates; width (2.2-9.2 px) and imprint_seq color both scale with volume,
    so the Shanghai-Los Angeles corridor stands out at once
  - Arc opacity 0.4-0.75 keeps the thin Colombo, Piraeus and Vancouver flows visible
    where they pass beside the thick Asia-Europe corridors, and arcs are drawn smallest-first
    so thick flows sit on top
  - Mid-arc arrowheads oriented along the curve tangent make direction readable in
    the static PNG; the gradient key at bottom-left states that color encodes container
    flow
  - Lon/lat ranges are derived from the data and corrected by cos(mean latitude) so
    the map is not stretched; hub labels are bolder and carry a page-colored halo
    that keeps them readable over arcs in both themes
  - Real hover tooltips for every arc (origin → destination, flow value) and every
    port (throughput) via React state in the HTML output
  weaknesses:
  - 'SC-02 (both): the basemap is five hand-typed continent polygons that misplace
    the coast. Rotterdam (4.5°E, 51.9°N) and Hamburg (10°E, 53.6°N) sit north of the
    Europe outline in open water, the Asia and Africa polygons overlap with a double-shaded
    wedge around 30-40°E, and Australia, Japan and the British Isles are missing.
    The A good version shows: basemap bullet asks for recognizable coastlines → denser
    outlines (more vertices per continent, with the ports'' coasts placed correctly
    and the overlap removed). Likely cause: the coarse CONTINENT_OUTLINES strings
    (lines 32-38).'
  - 'VQ-02 (both): the bold ''Shanghai'' label sits directly on the Shanghai-Rotterdam
    and Shanghai-Los Angeles arcs and one arrowhead, and the ''Piraeus'' and ''Jebel
    Ali'' labels are drawn over the converging Rotterdam-Asia arcs; the halo keeps
    them readable but the text still covers data → choose label slots that avoid arc
    paths as well as node boxes. Likely cause: the label candidate search scores overlap
    only against node and label boxes (lines 193-285), not against the arc geometry.'
  - 'Suggestion: a small width key (three reference strokes at 260 / 850 / 1,450)
    beside the color bar would tie arc thickness to values directly.'
  - 'Suggestion: the southern half of the map (-10° to -45°) holds only Santos; tightening
    the lower latitude padding would give the dense Asia-Europe cluster more room.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white plot panel.
      Chrome: bold dark title "flowmap-origin-destination · javascript · muix · anyplot.ai" centered at top (~37% of width), grey subtitle "21 flows across 14 locations · total Container flow (thousand TEU/year): 11,890"; y axis "Latitude (°)" with ticks -40° to 70°, x axis "Longitude (°)" with ticks -140° to 150°, subtle horizontal grid lines; bottom-left gradient key "Container flow (thousand TEU/year)" green-to-blue with 260 and 1,450, bottom-right note "Node size = total throughput · arrowheads indicate flow direction". All text dark on light and readable.
      Data: five pale grey continent silhouettes; 21 curved Bezier arcs colored from brand green #009E73 (small flows) to blue #4467A3 (Shanghai → Los Angeles, 1,450), widths scaling with volume, translucent, with mid-arc arrowheads; 14 green #009E73 port circles sized by throughput (Rotterdam, Shanghai, Singapore, Los Angeles largest) with a page-colored outline, labelled with bold names with halo. 'Shanghai', 'Piraeus' and 'Jebel Ali' labels sit over arcs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels, legend title and note all switch to light ink and are clearly readable; grid lines subtle grey; no dark-on-dark text.
      Data: arc and node colors identical to the light render (green → blue gradient, #009E73 nodes); continent silhouettes become a slightly lighter warm grey; port outlines now in the dark page color; thin green arcs at low opacity remain visible against the dark surface; label halos switch to the dark page color.
      Legibility verdict: PASS
