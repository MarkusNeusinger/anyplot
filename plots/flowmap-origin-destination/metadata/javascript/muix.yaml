review:
  strengths:
  - Composes a custom SVG flow layer inside ChartsContainer and places it with MUI
    X's useXScale/useYScale/useDrawingArea hooks, so arcs, ports and coastlines share
    the chart's own linear lon/lat axes, ChartsGrid and tick formatting
  - Quadratic Bezier arcs end exactly on the origin and destination coordinates; stroke
    width (2.2-9.2 px) and the imprint_seq green-to-blue gradient both scale with
    container flow, and a titled gradient bar (260 to 1,450) explains the colour
  - Arcs are translucent (0.40-0.75) and drawn thinnest-first, so thin feeder flows
    stay visible beside the dominant Shanghai-Los Angeles and Shanghai-Rotterdam corridors
  - Even-odd filled coastline basemap at 12 % inkSoft stays quieter than the arcs
    in both themes, and the lon/lat window is aspect-corrected by cos(mean latitude)
    so continents are not stretched
  - Port labels carry a page-coloured halo (paintOrder stroke) and bold hub weights,
    staying readable over arcs and land in both renders
  - Library-native React state drives hover tooltips for every arc (origin -> destination,
    flow) and every port (throughput) in the HTML output
  weaknesses:
  - 'VQ-03 (dark): the thinnest arcs (260-360 thousand TEU, e.g. Santos -> Rotterdam,
    Vancouver -> Singapore) are 2.2 px green at strokeOpacity 0.40 and fade into the
    #1A1A17 page, much fainter than in the light render → keep them clearly visible
    on dark, about 0.55 minimum opacity or 3 px minimum width (+0.15 opacity or +0.8
    px). Likely cause: strokeOpacity = 0.4 + ratio * 0.35 and MIN_ARC_WIDTH = 2.2
    shared by both themes.'
  - 'Suggestion: a small width key (two or three reference strokes) next to the gradient
    bar would tie the arc thickness to flow values as directly as the colour.'
  - 'Suggestion: the node-size note at the bottom right could move next to the flow
    legend so both keys read as one block.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, no white panel.
      Chrome: title "flowmap-origin-destination · javascript · muix · anyplot.ai" centred in dark ink, grey subtitle "21 flows across 14 locations · total Container flow (thousand TEU/year): 11,890"; y axis "Latitude (°)" with -40° to 70° ticks, x axis "Longitude (°)" with -140° to 150° ticks; subtle horizontal grid; gradient legend "Container flow (thousand TEU/year)" 260-1,450 bottom left and a note "Node size = total throughput · arrowheads indicate flow direction" bottom right. All text readable.
      Data: light grey filled coastlines (Americas, Europe, Africa, Asia, Australia) as a quiet basemap; 21 curved translucent arcs from green (#009E73, small flows) to blue (largest flows, Shanghai-Los Angeles and Shanghai-Rotterdam), width growing with flow, small arrowheads at each arc's midpoint; 14 green port circles sized by throughput with white outline, bold labels with halos (Rotterdam, Shanghai, Singapore, Los Angeles largest).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, tick labels, axis titles, legend text and note all in light ink / light grey; grid subtle; no dark-on-dark text.
      Data: identical arc gradient, node green #009E73 and blue top corridor as the light render; coastlines darker grey fill. The thinnest arcs (Santos-Rotterdam, Vancouver-Singapore) are noticeably fainter than in light but still traceable. Port labels in light ink with dark halos.
      Legibility verdict: PASS
