review:
  strengths:
  - Direction is encoded twice — a per-arc SVG linear gradient (brand green origin
    fading to blue destination) plus an arrowhead — while magnitude is encoded independently
    via stroke width and opacity, so direction and volume never fight for the same
    visual channel.
  - Washington, D.C. reads immediately as a hub thanks to multiple thick converging
    arcs, and asymmetric pairs (São Paulo↔Buenos Aires, Delhi↔Dhaka) clearly show
    directional imbalance — the plot delivers on the spec's core promise of revealing
    corridors and imbalances.
  - Real hover interactivity (mouseenter/mousemove/mouseleave with a genuine tooltip
    div showing city names and flow value) — not a static-library fake, appropriately
    leverages the interactive-library allowance.
  - City markers sized by total connected volume via a sqrt scale, with a greedy getBBox()-based
    label-collision pass that nudges only the top-8 city labels down when they'd overlap
    — a genuinely D3-specific technique.
  - 'First categorical series is #009E73, gradient stops and node fill are identical
    between light/dark renders, and both plot backgrounds/chrome match the theme tokens
    correctly — full Imprint palette compliance.'
  - Deterministic, hardcoded, in-memory data (no network fetch, no RNG) with a plausible
    non-controversial migration/travel scenario.
  weaknesses:
  - 'Oversized arrowhead markers on high-flow arcs: the <marker> uses the SVG default
    markerUnits="strokeWidth", so markerWidth=6/markerHeight=6 scales with each arc''s
    own stroke-width. On the thickest arcs (Mexico City→Washington flow=480, Washington→London
    flow=210, Toronto→Washington flow=150, stroke-width near the 6px max) the arrowhead
    balloons into a large solid blue wedge that partly covers the destination city
    circle (visible at Washington, D.C., London, Berlin, and the Delhi/Dhaka pair
    in both renders). Fix: set marker markerUnits="userSpaceOnUse" with a small fixed
    pixel size (e.g. 8-10px) independent of arcWidth(d.flow), or clamp the marker''s
    own scale so it doesn''t grow past ~2x the thinnest-line reference.'
  - City node circles overlap at several close-together pairs — most visibly London/Paris
    and Washington, D.C./Toronto — where the sqrt radius scale (7-17px) plus real-world
    geographic proximity makes one marker partially cover the other. Reduce the max
    node radius, or add a thin contrasting stroke / slight offset so overlapping markers
    stay individually legible.
  - The five hand-authored landmass polygons are very coarse (blocky, low-vertex-count
    blobs) and read more as an abstract backdrop than recognizable continents (e.g.
    the Eurasia+Africa shapes visually fuse into one undifferentiated grey mass).
    This is an understandable compromise given the no-network-fetch constraint, but
    a few more control points per ring (or lower fill-opacity, currently 0.22) would
    make the geographic context read more clearly without adding real-world coastline
    data.
  - 'Design Excellence is capped by the above: the arrow/marker glitch and the node
    overlaps are the kind of ''every detail polished'' misses that keep this from
    publication-ready polish despite the strong overall concept (gradient legend,
    hub storytelling, sizing).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the Imprint light surface — not pure white.
      Chrome: Title "flowmap-origin-destination · javascript · d3 · anyplot.ai" (bold, dark ink) and subtitle "Population movement between major world cities (thousands per year)" both render crisply centered at top; a light graticule grid (20° lon/lat) sits under five coarse grey landmass silhouettes; city name labels (dark ink) are placed below their markers for the 8 top-volume cities; a right-side legend panel ("Direction" gradient bar, "Flow volume" width key, "City, sized by..." key) is fully visible and clearly attached to the plot. All text is readable against the light background.
      Data: 18 green (#009E73) city circles sized by total connected volume, connected by 26 curved (quadratic-Bezier) arcs whose stroke fades from brand green (origin) to blue (#4467A3, destination) and whose width/opacity scale with flow magnitude. Washington, D.C. is visibly the busiest hub (multiple thick converging arcs). A clear defect: on the thickest arcs (into Washington, D.C., London, Berlin, and one of the Delhi/Dhaka arcs) the blue arrowhead marker balloons far larger than the arc it terminates, forming a chunky wedge that partially overlaps the destination city circle. London/Paris and Washington/Toronto node circles also overlap each other due to real-world geographic proximity at this scale.
      Legibility verdict: PASS (all text legible; the arrowhead/overlap issue is a visual-polish defect, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the Imprint dark surface — not pure black.
      Chrome: Title and subtitle render in light ink (#F0EFE8 / #B8B7B0-ish), fully legible against the dark background; landmass silhouettes and graticule remain visible at reduced contrast; city labels and the right-side legend text are all light-colored and readable; no dark-on-dark text anywhere.
      Data: Identical green (#009E73) → blue (#4467A3) gradient arcs and node fills as the light render — the Imprint data colors are unchanged between themes, confirming only chrome flips. The same oversized-arrowhead and node-overlap issues reproduce identically in this render (confirmed via a cropped close-up of the Delhi/Dhaka pair), so this is a code-level marker/scale issue, not a theme-specific regression.
      Legibility verdict: PASS (all text legible in both themes; no dark-on-dark or light-on-light failures).
