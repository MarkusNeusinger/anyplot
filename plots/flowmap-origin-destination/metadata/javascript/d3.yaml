review:
  strengths:
  - 'The arrowhead-ballooning defect flagged in attempt 1 is fully fixed: markerUnits
    is now userSpaceOnUse with a fixed 8x8 px size independent of arcWidth(d.flow),
    so even the thickest arcs (Mexico City to Washington D.C. at flow=480) terminate
    in a small, consistent arrowhead instead of a wedge covering the destination city
    circle.'
  - Direction is encoded twice (per-arc SVG linear gradient from brand green origin
    to blue destination, plus the now-correctly-sized arrowhead) while magnitude is
    encoded independently via stroke width and opacity, so direction and volume never
    compete for the same visual channel.
  - Washington, D.C. reads immediately as a hub thanks to multiple thick converging
    arcs, and asymmetric pairs (Sao Paulo <-> Buenos Aires, Delhi <-> Dhaka) clearly
    show directional imbalance.
  - Real hover interactivity (mouseenter/mousemove/mouseleave with a genuine tooltip
    div showing city names and flow value) on both arcs and city markers, not a static-library
    fake.
  - City markers sized by total connected volume via a sqrt scale (now tightened to
    a 6-12 px range), with a greedy getBBox()-based label-collision pass that nudges
    only the top-8 city labels down when they would overlap.
  - 'First categorical series is #009E73, gradient stops and node fill are identical
    between light/dark renders, and both plot backgrounds/chrome match the theme tokens
    correctly.'
  - Deterministic, hardcoded, in-memory data (no network fetch, no RNG) with a plausible,
    non-controversial migration/travel scenario.
  weaknesses:
  - 'City node circles still overlap at the closest geographic pairs even after the
    max node radius was reduced from 7-17px to 6-12px: London/Paris and Washington,
    D.C./Toronto circles still touch and partially overlap in both renders. The existing
    pageBg-colored stroke keeps each circle individually distinguishable, but a small
    positional nudge (or drawing overlapping nodes back-to-front by radius) would
    fully resolve it.'
  - The five hand-authored landmass polygons remain very coarse (blocky, low-vertex-count
    blobs) and read more as an abstract grey backdrop than recognizable continents;
    the Eurasia+Africa shapes still visually fuse into one undifferentiated mass.
    A few more control points per ring would make the geographic context read more
    clearly without needing real coastline data.
  - Only the top 8 by connected volume are labeled, so 10 of 18 cities (e.g. Toronto,
    Sao Paulo, Buenos Aires, Lagos, Nairobi, Jakarta, Manila, Sydney) are visible
    only as unlabeled dots in the static PNG - a reasonable clarity tradeoff, but
    worth a footnote or smaller-caption acknowledgment since the spec lists origin_name/dest_name
    as available fields.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the Imprint light surface -- not pure white, not dark.
      Chrome: Title "flowmap-origin-destination · javascript · d3 · anyplot.ai" (bold, dark ink) and subtitle "Population movement between major world cities (thousands per year)" render crisply centered at top; a subtle 20-degree graticule grid sits under five coarse grey landmass silhouettes; dark-ink city name labels are placed below their markers for the 8 top-volume cities; a fully visible right-side legend ("Direction" gradient bar, "Flow volume" width key, "City, sized by..." key) sits attached to the plot. All text is clearly readable against the light background; no light-on-light failures.
      Data: 18 green (#009E73) city circles sized by total connected volume, connected by 26 curved (quadratic-Bezier) arcs whose stroke fades from brand green (origin) to blue (#4467A3, destination) and whose width/opacity scale with flow magnitude. Washington, D.C. is visibly the busiest hub (multiple thick converging arcs). The previously reported oversized-arrowhead defect is fixed: every arrowhead is now a small, fixed 8x8px wedge regardless of the arc's stroke width, including on the thickest Mexico City -> Washington D.C. arc. A residual, minor overlap remains between the London/Paris node pair and the Washington, D.C./Toronto node pair, though the pageBg-colored stroke around each circle keeps them individually distinguishable.
      Legibility verdict: PASS (all text legible; only cosmetic node-overlap remains, not a legibility failure).

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the Imprint dark surface -- not pure black, not light.
      Chrome: Title and subtitle render in light ink, fully legible against the dark background; landmass silhouettes and graticule remain visible at reduced contrast; city labels and the right-side legend text are all light-colored and clearly readable. No dark-on-dark text anywhere.
      Data: Identical green (#009E73) -> blue (#4467A3) gradient arcs and node fills as the light render, confirming only chrome flips between themes. The fixed-size arrowheads and the same minor London/Paris and Washington/Toronto node overlaps reproduce identically here, confirming this is a code-level geometry issue rather than a theme-specific regression.
      Legibility verdict: PASS (all text legible in both themes; no dark-on-dark or light-on-light failures).
