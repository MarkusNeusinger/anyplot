review:
  strengths:
  - Genuinely idiomatic ECharts flow-map built on the 'lines' series with curveness,
    directional arrow symbols, and a continuous visualMap-driven color gradient (imprint_seq)
    for flow volume — a technique that is hard to replicate as cleanly in other libraries.
  - 'Port marker size scales with total throughput and line width/opacity scale with
    flow share, giving the chart real visual hierarchy: major corridors (Shanghai-LA,
    Shanghai-Rotterdam) and hub ports (Rotterdam, Shanghai, Singapore) are immediately
    visible.'
  - Thoughtful per-port label placement ('left'/'right'/'top'/'bottom') to keep city
    names from colliding in dense clusters (Rotterdam/Hamburg, Shanghai/Busan).
  - 'Clean theme-adaptive chrome throughout: title, subtitle, axis names, tick labels,
    grid, and visualMap legend all read tokens; both renders pass the light/dark legibility
    check with no dark-on-dark or light-on-light failures.'
  - 'First categorical series (ports) is the mandated #009E73 brand green, and continuous
    flow-volume data correctly uses imprint_seq (single-polarity) rather than a categorical
    palette or forbidden colormap.'
  - 'Realistic, neutral, well-scaled dataset: 14 real container ports, 24 routes with
    plausible corridor volumes (600-3800k TEU), transparency (0.4-0.7) applied per
    spec''s guidance for overlapping arcs.'
  - 'Honest engineering workaround for a hard library constraint: comments explicitly
    document that no bundled world GeoJSON or network fetch is available offline,
    so the custom-rendered polygon basemap is a deliberate, disclosed approximation
    rather than a fake/misleading map.'
  weaknesses:
  - The hand-built continent silhouettes (NORTH_AMERICA, SOUTH_AMERICA, EURASIA, AFRICA,
    AUSTRALIA arrays) are low-vertex and visibly rough/blocky compared to real coastlines
    — a viewer familiar with world geography will notice the imprecise shapes, which
    caps Design Excellence below 'publication-ready'. Consider adding a few more vertices
    at major capes/peninsulas (e.g. Scandinavia, the Iberian/Italian peninsulas, Baffin
    Island) to reduce the low-poly look without needing a full GeoJSON.
  - Rotterdam and Hamburg's port markers overlap heavily (Hamburg's circle is largely
    occluded behind Rotterdam's larger circle) because both are geographically close
    at this global zoom. Consider a small deterministic offset for closely-spaced
    port pairs, or reducing marker opacity slightly at overlap zones, so both throughput
    circles stay individually readable.
  - The world 'map' is really a cartesian lon/lat grid with axis ticks in degrees
    rather than a true equirectangular projection — functionally fine and clearly
    labeled, but slightly more 'scientific scatter plot' than 'stylized flow map'
    in feel. Not a spec violation, just a minor polish opportunity (e.g. hiding the
    axis ticks/gridlines in favor of a cleaner map frame) for a future pass.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Global Trade Flows · flowmap-origin-destination · javascript · echarts · anyplot.ai" and subtitle are dark ink, clearly legible; "Longitude"/"Latitude" axis names and degree-formatted tick labels (e.g. "150°W", "30°N") are soft dark gray, all readable against the cream background; horizontal/vertical graticule lines are subtle light gray, visible without competing with data; the "Low volume"/"High volume" visualMap legend text at the bottom is legible dark-gray.
      Data: Continent silhouettes render as light-gray filled polygons with a soft outline, giving geographic context. Port markers are solid brand green (#009E73) circles sized by throughput (Rotterdam/Shanghai/Singapore largest), each labeled with the city name in dark ink. Flow arcs are curved lines colored on a green-to-blue sequential gradient (thin/light-green for low-volume routes like Durban corridors, thick/blue for high-volume routes like Shanghai-Los Angeles), with directional arrowheads at the destination end.
      Legibility verdict: PASS — all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title and subtitle render in light off-white ink, clearly legible; axis names and tick labels are light gray, easily readable against the dark background; graticule lines are subtle light-gray at low opacity, visible but not dominant; visualMap legend text at the bottom is legible light-gray.
      Data: Continent polygons are dark-gray fills with a lighter stroke, still distinguishable from the near-black page background. Port markers remain the identical brand green (#009E73) as the light render, sized identically by throughput. Flow arcs use the identical green-to-blue sequential gradient and arrowheads as the light render — confirmed pixel-for-pixel consistent data colors between themes.
      Legibility verdict: PASS — no dark-on-dark failures; all title, axis, tick, and legend text is clearly visible against the near-black background, and the brand green remains highly visible on the dark surface.
