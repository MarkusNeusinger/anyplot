review:
  strengths:
  - Correct continuous Imprint sequential colormap (green -> blue) for flow-volume
    magnitude via visualMap, plus brand green (#009E73) for all port nodes — full
    VQ-07 palette compliance in both themes.
  - 'Thoughtful overlap resolution: Rotterdam/Hamburg markers are nudged apart with
    symbolOffset (true coordinates untouched) and each port''s label position (top/bottom/left/right)
    is hand-picked so labels for close neighbors (Shanghai/Busan, Rotterdam/Hamburg)
    diverge instead of colliding.'
  - Arc line width and opacity scale with flow share (1.5-7.5px, alpha 0.4-0.7) exactly
    per spec, with alternating curveness so parallel routes into the same hub stay
    visually separable.
  - Fully theme-adaptive chrome end-to-end (axis lines, tick labels, grid, land-mass
    fill/stroke, title/subtitle) with no clipping and no dark-on-dark/light-on-light
    failures in either render.
  - Deterministic, realistic dataset — 14 real container ports, 24 plausible trade
    routes with sensible TEU volumes — and a well-engineered workaround (cartesian2d
    + custom renderItem land polygons) for the lack of echarts-gl/GeoJSON in the offline
    harness.
  weaknesses:
  - Hand-simplified continent polygons omit recognizable features geography-literate
    viewers expect (India's peninsula, the Arabian Peninsula's shape, Japan/UK/Indonesia
    as islands) — acceptable given the offline-harness constraint but a step down
    from a real coastline dataset.
  - All four axis sides keep a full value-axis frame (axisLine on all sides) rather
    than the style guide's default L-shaped/spine-reduced look — a reasonable choice
    for a geographic reference grid, but less refined than the house style.
  - The faintest arcs (lowest flow share, ~0.4 opacity, ~1.5px width) are hard to
    pick out where they cross the dense Shanghai/Singapore/Jebel Ali cluster — could
    use a touch more contrast or z-ordering there.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — matches the required light-theme page surface.
      Chrome: Title "Global Trade Flows · flowmap-origin-destination · javascript · echarts · anyplot.ai" and subtitle are dark ink, clearly legible; longitude/latitude axis tick labels (dark gray) and gridlines (very subtle light gray) are all readable against the light background; the "Low volume / High volume" visualMap legend text at the bottom is legible.
      Data: 14 green (#009E73) port-throughput circles sized by volume, connected by curved arcs colored on a green-to-blue continuous scale (imprint_seq) and widened for higher-volume routes; continents render as pale gray-green filled polygons behind the arcs for geographic context.
      Legibility verdict: PASS — no light-on-light text found; all labels, ticks, and legend read cleanly against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — matches the required dark-theme page surface.
      Chrome: Title and subtitle render in light ink (#F0EFE8-ish), axis tick labels and gridlines switch to light-gray tones, and the continent polygons switch to a darker gray fill with a lighter stroke — all remain clearly distinguishable from the near-black background.
      Data: Port circles and arc colors are visually identical to the light render (same green nodes, same green-to-blue continuous arc scale) — only the chrome (background, text, grid, land fill) flipped, as required.
      Legibility verdict: PASS — no dark-on-dark failures; every title, axis label, tick, port label, and legend string stays legible against the near-black surface.
