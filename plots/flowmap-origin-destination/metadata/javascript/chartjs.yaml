      Background: Warm near-black, matches #1A1A17
      Chrome: Same layout, title/legend/axis/tick text flips to light ink, fully legible; no dark-on-dark failures observed. Basemap outline still faintly visible.
      Data: Colors identical to light render (#009E73 / lavender / blue) -- only chrome flipped. Callout box correctly flips to dark card with white text (theme tokens, not hardcoded).
      Legibility verdict: PASS
