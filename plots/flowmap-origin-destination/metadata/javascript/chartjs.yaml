review:
  strengths:
  - 'Genuinely idiomatic Chart.js solution: a custom flowArcsPlugin uses beforeDatasetsDraw
    + the chart''s own scales to draw quadratic-Bezier flow arcs beneath the scatter
    markers, rather than reaching for a disallowed geo/flow plugin.'
  - Line width scales with flow magnitude via a clean min-max widthFor() mapping,
    and arcs use alpha=0.5 to handle overlap exactly as the spec's Notes suggest.
  - 'Imprint palette applied in correct canonical order across all three hubs (#009E73,
    #C475FD, #4467A3), identical between light and dark renders; all chrome (title,
    axis, ticks, legend, grid) is theme-correct in both.'
  - Hub markers (larger diamonds) vs. destination markers (smaller circles) create
    a clear two-tier visual hierarchy that reads instantly as 'hub and its network'.
  - Deterministic LCG-seeded data generation with realistic, neutral US logistics
    scenario (real city coordinates, plausible crates/week volumes).
  weaknesses:
  - Spec's Notes section asks to 'include a basemap with country boundaries or coastlines
    for geographic context' — the plot is a bare lon/lat scatter with no coastline
    or border reference, so viewers can't anchor the three clusters to actual US geography
    without prior knowledge. Given chartjs.md forbids reaching for geo plugins, consider
    at least a light reference frame or noting the limitation, but as delivered this
    is a real spec gap (SC-02).
  - Axis labels 'Longitude' / 'Latitude' are descriptive but carry no units (a degree
    symbol or '(°)' suffix would fully satisfy VQ-06).
  - All flows are one-directional (hub → destination only); no hub-to-hub flows or
    return trips are shown, so the spec's called-out 'directional imbalances in movement
    between places' isn't demonstrated (DQ-01).
  - Visual refinement is solid but not exceptional — the three clusters read clearly
    but there's no explicit emphasis (e.g., a callout on the single heaviest corridor)
    to turn the layout into a stronger data story (DE-03).
  - No color gradient encodes flow direction/magnitude (spec lists this as an optional
    enhancement) — current single-hue-per-hub arcs are legible but leave that dimension
    of the data spec unused.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), not pure white — correct.
      Chrome: Title "flowmap-origin-destination · javascript · chartjs · anyplot.ai" in bold dark ink at top-left, comfortably under the 90% width guard. Legend top-right lists "Memphis Hub", "Columbus Hub", "Reno Hub" with diamond swatches in dark ink text. Axis titles "Longitude"/"Latitude" and tick labels in dark/soft-dark ink, all clearly legible. Subtle light-gray gridlines at both axes, not competing with data.
      Data: Three hub clusters — Memphis (green #009E73, US South/Midwest destinations), Columbus (lavender #C475FD, Northeast/Midwest destinations), Reno (blue #4467A3, West Coast/Mountain destinations). Each hub is a larger diamond marker with curved arcs (varying thickness = flow volume) fanning out to smaller circular destination markers in the same hue. Arcs use ~50% alpha so overlapping curves near each hub remain distinguishable.
      Legibility verdict: PASS — all text reads clearly against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), not pure black — correct.
      Chrome: Same title and legend text now rendered in light ink (near-white), clearly visible against the dark background. Axis titles and tick labels also flipped to light/soft-light tones. Gridlines are a subtle light-on-dark tint.
      Data: Identical hub colors and arc geometry to the light render (green #009E73, lavender #C475FD, blue #4467A3) — confirmed unchanged, only chrome flipped as required.
      Legibility verdict: PASS — no dark-on-dark failures observed; all title/axis/tick/legend text is clearly readable against the near-black surface.
