  strengths:
  - Curved Bezier arcs whose ends sit on the real port coordinates, with width proportional
    to flow
  - Real major container ports and plausible lane volumes
  - Theme-adaptive chrome, basemap and legend in both renders
  - Line2D legend handles reproduce the arcs' width and color
  weaknesses:
  - 'VQ-05 (both): the render is 3160×1760, off the 3200×1800 canvas by −40 × −40
    px → 3200×1800. Likely cause: savefig(..., bbox_inches=''tight'').'
  - 'VQ-07 (both): the arcs use matplotlib''s Blues colormap, which the style guide
    forbids for continuous data → imprint_seq with the theme''s marks stops. Likely
    cause: plt.cm.Blues(0.4 + normalized * 0.5).'
  - 'VQ-02 (both): the ''Rotterdam'' label overlaps its own marker and the arcs leaving
    it, ''Hamburg'' and ''Rotterdam'' stack tight, ''Busan''/''Shanghai'' crowd, and
    ''Los Angeles'' and ''Santos'' sit on their markers → each label clear of every
    marker and other label. Likely cause: hand-tuned label_offsets of a few points.'
  - 'VQ-01 (both): port labels at 7 pt, below the 8 pt of the ticks and legend → 8
    pt (+1 pt). Likely cause: annotate fontsize=7.'
  - 'VQ-06 (both): axis titles ''Longitude'' and ''Latitude'' have no unit → ''Longitude
    (°)'' / ''Latitude (°)''. Likely cause: set_xlabel/set_ylabel strings.'
  - 'SC-02 (code): arc alpha reaches 0.8, above the Notes'' 0.4–0.7 range → at most
    0.7 (−0.1). Likely cause: alpha = 0.45 + normalized * 0.35.'
  - 'Suggestion: a short note could point out the Shanghai–Los Angeles corridor as
    the busiest lane.'
