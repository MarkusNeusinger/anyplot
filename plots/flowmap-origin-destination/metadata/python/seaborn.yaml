review:
  strengths:
  - Arcs use the Imprint imprint_seq marks ramp with the theme's own stops, matched
    by a colorbar, so magnitude reads in both color and width in both themes
  - Quadratic Bezier arcs end exactly on the city coordinates and bow sideways, so
    reciprocal pairs (New York-Paris, Dubai-Mumbai) separate
  - sns.scatterplot size semantic sizes hubs by incoming flow, and sns.move_legend
    restyles that legend with theme tokens
  - 'Clean tidy-table structure: role-named columns, df-only plotting block, exact
    3200x1800 canvas'
  weaknesses:
  - 'VQ-02 (both): in the Europe cluster the ''London'' label sits beside the Frankfurt
    node and the ''Frankfurt'' label above-left of the London node, so the two read
    swapped, and ''Los Angeles'' runs over the New York-Los Angeles and New York-Sao
    Paulo arcs → each label next to its own node and clear of the arcs. Likely cause:
    the candidate-offset loop accepts the first spot clear of other labels and node
    centres but tests neither the distance to a neighbouring node nor overlap with
    arc paths.'
  - 'Suggestion: drop the unused np.random.seed(42); the data is fully hard-coded.'
  - 'Suggestion: a lighter coastline outline in the light theme would let the thinnest
    arcs lead even more.'
