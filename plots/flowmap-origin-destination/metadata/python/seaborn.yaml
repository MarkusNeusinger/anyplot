      Background: warm off-white #FAF8F1.
      Chrome: title 'flowmap-origin-destination · python · seaborn · anyplot.ai' in dark ink, axis titles 'Longitude (°)' / 'Latitude (°)', ticks in INK_SOFT, colorbar 'Flow volume (thousand people)' on the right (green -> deep blue -> dark violet), 'Incoming flow' size legend lower left on an elevated panel. All readable.
      Data: taupe simplified continents with dark outlines, dashed equator and prime meridian; 18 quadratic Bezier arcs 1-5 wide at alpha 0.65 colored green (low) to dark violet (high), New York-London and New York-Los Angeles thickest; 12 #009E73 city nodes sized by incoming flow with page-colored edges; bold city labels each beside its own node with a thin leader line (London left, Paris below-right, Frankfurt above-right), Los Angeles below-left clear of the arcs.
