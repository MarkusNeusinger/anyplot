review:
  strengths:
  - Arcs use the Imprint imprint_seq marks ramp with the theme's current stops, matched
    by a colorbar, so magnitude reads in both color and width in both themes
  - Quadratic Bezier arcs end exactly on the city coordinates and bow sideways, so
    reciprocal pairs (New York-Paris, Dubai-Mumbai) separate
  - Every city label sits beside its own node with a thin leader line, clear of the
    other labels and of the major arcs, including the tight London/Paris/Frankfurt
    cluster
  - sns.scatterplot size semantic sizes hubs by incoming flow, and sns.move_legend
    restyles that legend with theme tokens
  - Tidy role-named columns and a df-only plotting block on the exact 3200x1800 canvas
  weaknesses:
  - 'Suggestion: drop the unused np.random.seed(42); the data is fully hard-coded.'
  - 'Suggestion: `- dy / length * length * ARC_BEND` reduces to `- dy * ARC_BEND`
    (same for dx), which makes `length` unnecessary.'
  - 'Suggestion: a lighter coastline outline in the light theme would let the thinnest
    arcs lead even more.'
  image_description: |-
