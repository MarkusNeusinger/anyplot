review:
  strengths:
  - Theme-adaptive ocean/land basemap stays quieter than the arcs in both renders
  - Width and color both encode magnitude, so the Mumbai-Dubai and Lagos-London corridors
    lead
  - Colorbar ties arc colors to migrant counts
  weaknesses:
  - 'VQ-07 (both): arc colors come from scale_color_cmap(cmap_name=''viridis''), a
    non-Imprint continuous map → color flow magnitude with imprint_seq (marks stops)
    or use Imprint categorical colors. Likely cause: scale_color_cmap(''viridis'')
    on line 208.'
  - 'VQ-02 (both): the ''London'' label runs into the Berlin dot and label, and ''Toronto''
    touches the New York dot → keep each label clear of neighbouring dots and labels.
    Likely cause: LABEL_NUDGE offsets of only 2-3° (lines 113-119).'
  - 'CQ-04 (code): arc points and continent outlines are appended row by row as dicts
    (lines 105-108, 156-187, six repeated loops) → build each DataFrame directly from
    the arrays (pd.DataFrame({''x'': curve_x, ''y'': curve_y, ...})). Likely cause:
    per-point list-of-dicts construction.'
  - 'Suggestion: hollow endpoint markers would read more like a map legend.'
