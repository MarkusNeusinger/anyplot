review:
  strengths:
  - 'Native Altair geo stack: alt.topo_feature() TopoJSON basemap with mark_geoshape(),
    one shared Mercator .project() across all layers, and detail + order channels
    that split one long table into ordered per-flow polylines'
  - Arc width scaled 0.5-6 px to flow plus a 'Flow volume' gradient legend on the
    color channel (C2, C4)
  - Opposite bend directions for the two directions of a city pair keep bidirectional
    corridors visually separate
  - autosize type=fit sizes the whole layered chart to exactly 3200x1800 and the zoomed
    projection lets Western Europe fill the canvas
  - 'Full theme threading: page, map fill, country borders, ink, legend frame and
    fill all flip; brand-green markers with page-colored rings read on both surfaces'
  - HTML output carries tooltips with origin, destination and formatted flow value,
    as the Notes ask for interactive libraries
  - Page-colored text halo under every city label keeps the names readable where arcs
    pass beneath them
  weaknesses:
  - 'VQ-07 (both): the arc ramp SEQ_MARKS uses non-guide stops — light (0 #009E73,
    0.338 #4467A3, 1 #002850), dark (0 #007755, 0.32 #009E73, 1 #CDD9FF) → the style
    guide''s imprint_seq marks stops: light (0 #009E73, 0.687 #024582, 1 #351E45),
    dark (0 #6F7E20, 0.21 #009E73, 1 #CDD9FF). Likely cause: hand-typed SEQ_MARKS
    lists instead of the library prompt''s.'
  - 'Suggestion: the library prompt''s canvas-check block after chart.save() is missing;
    this chart fits exactly, but the block is the safeguard for other data.'
  - 'Suggestion: a unit in the legend title (for example ''Migrants per year'') would
    tell the reader what the flow volume counts.'
