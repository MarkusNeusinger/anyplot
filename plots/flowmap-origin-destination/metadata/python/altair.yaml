review:
  strengths:
  - 'Native Altair geo stack: alt.topo_feature() TopoJSON basemap with mark_geoshape(),
    one shared Mercator .project() across all layers, and detail + order channels
    that split one long table into ordered per-flow polylines'
  - Arc width scaled 0.5-6 px to flow plus a 'Flow volume' gradient legend on the
    color channel (C2, C4)
  - Opposite bend directions for the two directions of a city pair keep bidirectional
    corridors visually separate
  - Arc ramp uses the style guide's imprint_seq marks stops per theme (green to deep
    blue to dark violet on light, olive to green to pale blue on dark)
  - 'Full theme threading: page, map fill, borders, ink, legend frame and fill all
    flip; brand-green markers with page-colored rings read on both surfaces'
  - Page-colored text halo under every city label keeps names readable where arcs
    pass beneath
  - HTML output carries tooltips with origin, destination and formatted flow value,
    as the Notes ask for interactive libraries
  weaknesses:
  - 'Suggestion: a unit in the legend title (for example ''Migrants per year'') would
    tell the reader what the flow volume counts.'
  - 'Suggestion: a small width key (two or three sample strokes) would tie arc widths
    to flow values directly.'
