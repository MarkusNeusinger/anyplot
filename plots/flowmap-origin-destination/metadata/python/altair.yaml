review:
  strengths:
  - 'Native Altair geo stack: alt.topo_feature() TopoJSON basemap with mark_geoshape(),
    a shared Mercator .project() across all layers, and detail + order channels that
    split one long table into ordered per-flow polylines'
  - Arc color uses the Imprint imprint_seq marks ramp with the theme's own stops and
    interpolate="rgb", explained by a 'Flow volume' gradient legend (C4), alongside
    strokeWidth scaled to flow (C2)
  - Opposite bend directions for the two directions of a city pair keep bidirectional
    corridors visually separate
  - autosize type=fit sizes the whole chart to exactly 3200x1800; the zoomed Mercator
    projection lets Western Europe fill the canvas
  - 'Full theme threading: page, map fill, country borders, ink, legend frame and
    fill all flip; brand-green city markers with page-colored rings read on both surfaces'
  - HTML output carries tooltips with origin, destination and formatted flow value,
    as the spec's Notes ask for interactive libraries
  weaknesses:
  - 'VQ-02 (both): the city labels sit on top of arcs: ''Brussels'' is printed across
    the London/Paris–Berlin arc bundle below its marker, and ''Paris'' and ''Vienna''
    are crossed by the thick London–Paris and Berlin–Vienna arcs, so the label strokes
    merge with the lines → labels clear of the arcs, or a page-colored text halo so
    every letter separates from the lines beneath. Likely cause: LABEL_OFFSET / mark_text
    without a stroke halo (stroke=PAGE_BG, strokeWidth around 3 on a duplicate text
    layer under the labels).'
  - 'Suggestion: the library prompt''s canvas-check block after chart.save() is missing;
    this chart fits exactly, but the block is the prompt''s safeguard for other data.'
  - 'Suggestion: a unit in the legend title (for example ''Migrants per year'') would
    tell the reader what the flow volume counts.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; Mercator basemap of Western/Central Europe in #D8D6CE with thin page-colored country borders, zoomed so the ten cities span most of the 3200x1800 canvas.
      Chrome: bold dark title "flowmap-origin-destination · python · altair · anyplot.ai" top-left; bold dark city labels (Dublin, London, Amsterdam, Brussels, Paris, Berlin, Vienna, Rome, Madrid, Lisbon); "Flow volume" gradient legend bottom-right on an elevated #FFFDF6 box with a soft frame, labels 2,189 and 49,732. All readable.
      Data: 30 curved quadratic Bezier arcs at opacity 0.65 with round caps, width 0.5–6 scaled to flow, colored on the imprint_seq light marks ramp (brand green #009E73 low → blue #4467A3 → navy #002850 high); city markers #009E73 with page-colored rings. Labels Brussels, Paris and Vienna are crossed by arcs.
