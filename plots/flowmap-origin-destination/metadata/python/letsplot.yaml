review:
  strengths:
  - geom_curve with curvature=-0.3 and alpha=0.6 draws one translucent arc per flow
    whose ends sit exactly on the hub points
  - Arc width and color both encode volume with the current Imprint SEQ_MARKS stops
    per theme, so the Shanghai-Los Angeles and Shanghai-Rotterdam corridors stand
    out
  - layer_tooltips() on the arcs gives origin → destination titles and formatted volumes
    in the HTML
  - Quiet continent fill and border tokens per theme keep the basemap behind the flows
  weaknesses:
  - 'VQ-02 (both): the thick Rotterdam-Singapore arc passes through the ''Dubai''
    label below its hub, so the city name is crossed by data → put the label clear
    of every arc (e.g. left of the point, west of the Rotterdam-Singapore corridor).
    Likely cause: label_offsets[''Dubai''] = (3, -13).'
  - 'DQ-03 (code): single lanes carry 15-85 M TEU a year, while Shanghai, the world''s
    busiest port, handles about 47 M TEU in total → scale the lane volumes to plausible
    values (about 0.5-5 M TEU per lane) or relabel the unit. Likely cause: the volumes
    in the flows list.'
  - 'Suggestion: merge the color bar and the width key into one ''Trade Volume (M
    TEU)'' legend so the identical titles do not repeat.'
  - 'Suggestion: the continent polygons are very coarse; a finer coastline outline
    would give more geographic context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel with a thin dark frame.
      Chrome: title "flowmap-origin-destination · python · letsplot · anyplot.ai" centered in dark ink (~70% width); ten city labels in INK_SOFT at ~11 pt; two right-hand legends on the elevated off-white box, both titled "Trade Volume (M TEU)": a color bar 20-80 and a width key 20-80. All text readable.
      Data: 18 curved translucent arcs over coarse light-grey continent polygons, colored with the Imprint marks ramp (#009E73 green for low flows through deep blue to dark violet for the Shanghai-Los Angeles corridor) and widened by flow; ten near-black hub points. The Rotterdam-Singapore arc crosses the 'Dubai' label.
