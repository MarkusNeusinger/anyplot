review:
  strengths:
  - geom_curve with curvature=-0.3 and alpha=0.6 draws one translucent arc per flow
    whose ends sit exactly on the hub points
  - Arc width and color both encode volume with the Imprint SEQ_MARKS stops per theme,
    so the Shanghai-Los Angeles and Shanghai-Rotterdam corridors stand out
  - layer_tooltips() on the arcs gives origin → destination titles and formatted volumes
    in the HTML
  - Quiet continent fill and border tokens per theme keep the basemap behind the flows
  weaknesses:
  - 'VQ-02 (both): the thin Singapore→Sydney arc runs through the ''ga'' of the ''Singapore''
    label and the thick Sydney→Singapore arc touches its ''re'' → place the label
    clear of both arcs, e.g. left of the hub (about −10° lon, −3° lat). Likely cause:
    label_offsets[''Singapore''] = (4, -5).'
  - 'VQ-03 (dark): the width key''s line samples are drawn in a fixed dark grey (about
    #4A4A4A) on the #242420 legend box and read faint → draw them in INK_SOFT so they
    stand out like the arcs. Likely cause: the size legend''s glyph color is not set;
    guides(size=guide_legend(override_aes={''color'': INK_SOFT})).'
  - 'Suggestion: merge the color bar and the width key into one ''Trade Volume (M
    TEU)'' legend so the identical titles do not repeat.'
  - 'Suggestion: the continent polygons are very coarse; a finer coastline outline
    would give more geographic context.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page and panel with a thin dark frame.
