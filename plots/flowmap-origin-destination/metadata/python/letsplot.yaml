review:
  strengths:
  - Continuous flow volume uses the Imprint SEQ_MARKS ramp with separate light and
    dark stops, so thick corridors read dark navy on the light page and pale blue
    on the dark page
  - Arc width and color both encode volume, with a color bar and a width key, so the
    Shanghai-Los Angeles and Shanghai-Rotterdam corridors stand out from the thin
    flows
  - geom_curve with curvature=-0.3 and alpha=0.6 draws one translucent arc per flow
    whose ends sit exactly on the hub points
  - Quiet continent fill and border tokens per theme keep the basemap behind the flows
  weaknesses:
  - 'VQ-02 (both): the Dubai label sits under the Rotterdam-Dubai and Dubai-Singapore
    arcs and the Shanghai label is crossed by the Los Angeles-Shanghai and Shanghai-Dubai
    arcs, so both city names collide with data → place both labels clear of the arcs
    (Dubai below-right of its point, Shanghai further below) or draw the labels above
    the arcs on a page-colored backing. Likely cause: label_offsets for Dubai (4,
    2) and Shanghai (-4, -7).'
  - 'VQ-05 (both): city labels drawn with geom_text size=8 (mm, about 23 pt) are larger
    than the 16 pt title and twice the 10 pt legend text → about size=4-5 (-3 to -4
    mm), the library prompt''s annotation range. Likely cause: geom_text(size=8).'
  - 'VQ-06 (both): the legend title ''Trade Volume'' gives no unit for the 15-85 values
    → name the unit, e.g. ''Trade Volume (M TEU)''. Likely cause: scale_size/scale_color_gradientn
    name.'
  - 'SC-02 (code): the Notes ask interactive libraries for hover tooltips with exact
    flow values and location names; the arcs carry only lets-plot''s default tooltip
    without origin/destination names → add layer_tooltips() on geom_curve with origin_name,
    dest_name and flow. Likely cause: geom_curve without tooltips=.'
  - 'Suggestion: merge the color bar and the width key into one ''Trade Volume'' legend
    so the two identical titles do not repeat.'
  - 'Suggestion: the continent polygons are very coarse; a finer coastline outline
    would give more geographic context.'
  image_description: |-
