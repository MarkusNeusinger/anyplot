      Data: 18 curved arcs over coarse light-grey continent polygons, colored with the Imprint sequential marks ramp (green #009E73 for low flows through blue to navy #002850 for high) and widened by flow; the thick Shanghai-Los Angeles and Shanghai-Rotterdam corridors are dark navy. Ten near-black hub points. Dubai and Shanghai labels are crossed by arcs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page and panel, thin grey frame.
      Chrome: title in light ink; city labels in light grey (#B8B7B0); legends on the #242420 elevated box with light text. No dark-on-dark text.
      Data: same arcs and widths, the continuous ramp switched to its dark stops (dark green #007755 for low flows through #009E73 to pale blue #CDD9FF for high), as intended for a continuous ramp. Hub points flip to light ink. Dark-grey continents stay quieter than the arcs. Same Dubai/Shanghai label collisions.
      Legibility verdict: PASS
