review:
  strengths:
  - Idiomatic go.Scattergeo on a natural earth geo subplot with theme-tuned basemap
    colors that stay quieter than the arcs
  - Arc width and opacity both scale with volume, so the major corridors lead while
    thin flows stay visible
  - Plotly's native 'arrow' marker symbol, rotated to the Bezier tangent, shows flow
    direction
  - Hover tooltips in the HTML give route and volume per arc
  weaknesses:
  - 'VQ-07 (both): arcs are drawn in Okabe-Ito blue #0072B2, which is not an Imprint
    color → Imprint position-3 blue #4467A3. Likely cause: ARC_RGB = ''0, 114, 178''.'
  - 'VQ-02 (both): the ''Dubai'' label sits on the Mumbai node, the bottom caption
    collides with the lower edge of the map frame, and the Panama City and Hong Kong
    labels sit over arcs → place Dubai''s label away from Mumbai (top left) and lower
    the caption clear of the frame. Likely cause: label_positions ''Dubai'': ''bottom
    right''; caption y=-0.04 with margin t=80.'
  - 'Suggestion: a small width key with sample flow values would let readers read
    volumes off the static PNG.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1 paper; full natural earth ellipse with light blue ocean, beige land and thin grey borders, Antarctica along the bottom.
      Chrome: Title in dark ink, 15 city labels in dark soft ink, caption 'Line width proportional to trade volume (millions of tons)' in muted ink at the bottom edge of the map frame. All readable.
      Data: 25 translucent Bezier arcs in Okabe-Ito blue #0072B2, 2-10 px wide, with arrowheads near the destination; green #009E73 port nodes sized by total volume. The 'Dubai' label sits on the Mumbai node; Panama City and Hong Kong labels touch arcs.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
