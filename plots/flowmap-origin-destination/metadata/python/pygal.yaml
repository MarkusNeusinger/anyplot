review:
  strengths:
  - Coastlines in neutral INK_SOFT keep the basemap quieter than the data arcs
  - 'Imprint palette starting at #009E73 with correct backgrounds in both themes'
  - Native pygal per-point tooltip labels name each route and value in the HTML
  weaknesses:
  - 'SC-02 (both): every arc renders at the same ~2.5 px width, so arc width does
    not encode flow magnitude (C2) → per-tier or per-flow widths that actually render.
    Likely cause: stroke_style widths overridden by pygal''s .reactive stroke-width
    CSS rule.'
  - 'SC-03 (both): straight lines join consecutive arcs and coastline segments (e.g.
    Lisbon→Piraeus along lat 38, a diagonal coastline line across France to Italy),
    drawing flows and coasts that do not exist → break each series between segments.
    Likely cause: {''value'': (None, None)} separators without allow_interruptions=True.'
  - 'VQ-03 (both): all arcs at ~2.5 px read hairline-thin on the 3200 px canvas, so
    the High corridors barely stand out → visible widths of about 6–28 px. Likely
    cause: the overridden stroke_style widths.'
  - 'VQ-01 (both): y tick labels 40 and 50 render smaller than the other ticks → one
    tick size (+12 px). Likely cause: major_label_font_size=44 vs label_font_size=56.'
  - 'DQ-02 (both): flow values are labelled in generic ''units'' → a real unit (e.g.
    thousand TEU). Likely cause: the tier and tooltip label strings.'
  - 'CQ-01 (code): helper function make_bezier_curves breaks the flat structure →
    inline the loop. Likely cause: def make_bezier_curves.'
  - 'CQ-04 (code): np.random.seed(42) with no random draw and stroke_style widths
    with no visible effect → remove the seed and make the widths render. Likely cause:
    leftover seed line and CSS override.'
  - 'Suggestion: suppressing the full box frame would make the map read less like
    a generic XY chart.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1.
