      Data: grey coastlines and hairline Bezier arcs in #009E73, #C475FD and #4467A3 between 14 amber port dots; all arcs render at the same ~2.5 px width; straight connector lines join consecutive arcs (e.g. Lisbon to Piraeus along lat 38) and coastline segments (a diagonal across France to Italy).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
