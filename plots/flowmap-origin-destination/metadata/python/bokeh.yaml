  strengths:
  - Theme-adaptive CartoDB light/dark basemap tiles through WMTSTileSource
  - Arc width proportional to volume with 0.65 alpha; dominant Shanghai corridors
    stand out
  - Separate HoverTools for arcs and ports
  weaknesses:
  - 'AR-09, VQ-05 (both): the screenshot is 3600×1661 instead of 3200×1800; the x-axis
    tick labels are chopped at the bottom edge, the Longitude title is off the canvas,
    and a blank pure-white strip fills the right ~400 px → screenshot at the figure''s
    3200×1800 with the color bar inside the figure width. Likely cause: W, H = 3600,
    1800 window without a device-metrics override.'
  - 'VQ-06 (both): the x-axis title ''Longitude'' is not visible because it falls
    below the cut-off bottom edge → keep it inside the 1800 px canvas. Likely cause:
    the window/viewport mismatch above.'
  - 'VQ-07 (both): arcs are colored with Viridis256, a colormap the style guide forbids,
    and the dark render has a pure-white strip at the right → imprint_seq marks stops
    (SEQ_MARKS) sampled with ramp_color; page-colored body. Likely cause: from bokeh.palettes
    import Viridis256.'
  - 'VQ-03, SC-02 (both): the reverse-direction pairs Singapore↔Dubai and Rotterdam↔New
    York share one identical curve, so the thinner flow is hidden inside the thicker
    one (C3) → bow opposite flows to opposite sides of the chord. Likely cause: ctrl_y
    always above the midpoint.'
  - 'VQ-03 (both): port markers at size 20 and the ''Ports'' legend glyph, a dot of
    a few pixels, read small on the 3600 px render → markers about 26 px and a legend
    glyph of about 40 px. Likely cause: scatter size=20 and default legend glyph size.'
  - 'DQ-03 (both): flows of 260–850 TEU on the busiest trunk lanes are under one ship''s
    load → state thousand TEU per year or scale the values. Likely cause: the flow
    values with a plain ''TEU'' unit.'
  - 'Suggestion: drop the grid over the basemap; the coastlines already give the geographic
    reference.'
