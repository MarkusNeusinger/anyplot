review:
  strengths:
  - Correct Mollweide projection written out in R (no projection package is available)
    with real world boundaries from maps::map_data
  - 'Tissot indicatrices on a regular 30°×60° grid show the equal-area behaviour:
    tall at the equator, sheared and stretched toward the edges and high latitudes'
  - Theme-adaptive ocean/land pair (light blue / beige, navy / olive) keeps land clearly
    set apart from sea in both renders
  - Ocean fill clipped to the projection ellipse with a clean outline; theme_void
    and coord_fixed keep the map undistorted
  - Title and subtitle use INK / INK_SOFT tokens and read cleanly on both surfaces
  weaknesses:
  - 'SC-02 (both): the equator and prime meridian (linewidth 0.35, alpha 0.70) are
    drawn heavier than the coastlines and borders (linewidth 0.10, alpha 0.55), and
    the 30° graticule (0.18 / 0.45) reads as strong as them, so the graticule is not
    lighter than the coastlines (C2) → coastlines about 0.25 linewidth at alpha 0.8,
    every graticule line including equator and prime meridian ≤ 0.15 at alpha ≤ 0.45.
    Likely cause: the linewidth/alpha of the three geom_path layers.'
  - 'CQ-01 (code): two named helper functions solve_theta and mollweide (lines 23–48)
    break the Imports → Data → Plot → Save structure → stack every lon/lat point (world,
    graticule, Tissot, equator, prime meridian) into one data frame with a layer column
    and project it once with an inline vectorised Newton loop (theta <- theta - f/f''
    over the whole vector). Likely cause: projecting each layer through a helper.'
  - 'Suggestion: a 2×2 patchwork of Mollweide, Robinson-like, Mercator and orthographic
    views with the same Tissot grid would show the contrast between projections the
    description emphasises.'
  - 'Suggestion: a row of Tissot indicatrices at ±75° would show the strongest shape
    distortion near the poles.'
