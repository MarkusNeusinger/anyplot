review:
  strengths:
  - Correct Mollweide equal-area projection with real world boundaries from maps::map_data,
    every layer stacked into one table and projected once with a vectorised Newton
    loop
  - 'Tissot indicatrices on a regular 30°×60° grid show the equal-area behaviour:
    tall at the equator, flattened and sheared toward high latitudes and the edges'
  - 'Line hierarchy reads correctly: coastlines and borders (0.25 / alpha 0.80) clearly
    heavier than the 30° graticule (0.12 / alpha 0.40)'
  - Theme-adaptive ocean/land pair (light blue/beige, navy/olive) keeps land set apart
    from sea in both renders; ocean clipped to the ellipse with a clean outline
  - Title and subtitle use INK / INK_SOFT tokens and read cleanly on both surfaces
  weaknesses:
  - 'Suggestion: a 2×2 patchwork of Mollweide, Robinson-like, Mercator and orthographic
    views with the same Tissot grid would show the contrast between projections the
    description emphasises.'
  - 'Suggestion: a row of Tissot indicatrices at ±75° would show the strongest shape
    distortion near the poles.'
