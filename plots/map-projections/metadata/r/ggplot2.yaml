      Data: world land in neutral beige #D4C9A8 with thin grey country borders; 30° graticule in translucent grey, equator and prime meridian drawn darker; 30 brand-green #009E73 Tissot ellipses on a 5×6 grid, tall at the equator and sheared/flattened toward the edges and ±60°.
