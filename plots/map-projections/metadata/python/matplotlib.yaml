review:
  strengths:
  - Four projection families (Mercator, Robinson, Mollweide, Orthographic) side by
    side with identical world and styling, so only the projection differs
  - 'Cartopy''s ax.tissot() shows distortion faithfully: circles stay round and grow
    poleward on Mercator, keep area while stretching on Robinson/Mollweide, foreshorten
    toward the Orthographic limb'
  - 'Gridspec width ratios matched to the maps'' aspect ratios: the square Mercator
    and Orthographic maps take full-height columns, the two 2:1 maps stack in the
    middle'
  - Graticule at 30° drawn lighter and dashed under solid coastlines, curved by each
    projection; theme-adaptive land, sea and chrome readable in both renders
  weaknesses:
  - 'Suggestion: the latitude labels vary between panels (60° labels missing on Mollweide,
    30°N missing on Orthographic); a consistent label set would ease the comparison.'
  - 'Suggestion: a short property subtitle per panel (conformal, compromise, equal-area,
    perspective) would guide the comparison.'
