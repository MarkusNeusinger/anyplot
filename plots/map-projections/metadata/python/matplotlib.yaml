review:
  strengths:
  - Four projection families (Mercator, Robinson, Mollweide, Orthographic) side by
    side with identical world and styling, so only the projection differs
  - 'Cartopy''s ax.tissot() shows distortion faithfully: circles grow toward the poles
    on Mercator and keep area while stretching on Mollweide'
  - Graticule at 30° drawn lighter and dashed under solid coastlines, curved by each
    projection
  - Theme-adaptive land/sea and chrome; all text readable in both renders
  weaknesses:
  - 'VQ-05 (both): the aspect-locked Mercator and Orthographic panels fill only about
    half the width of their grid cells, leaving wide empty bands beside them → size
    the cells to the maps'' aspect ratios so each map uses its cell. Likely cause:
    equal 2×2 add_subplot cells with subplots_adjust(wspace=0.04).'
  - 'VQ-07 (both): the Tissot indicatrices, the plot''s only data overlay, are drawn
    in matte red #AE3030 with an off-palette #7B1117 edge instead of the first Imprint
    color → brand green #009E73 fill and edge. Likely cause: TISSOT_COLOR and edgecolor=''#7B1117''
    (the comment also mislabels #AE3030 as position 3; it is slot 5).'
  - 'CQ-04 (code): three try/except Exception blocks swallow errors around ax.set_global(),
    ax.gridlines() and ax.tissot(), all of which work on the four projections used
    → call them directly and delete the fallbacks. Likely cause: defensive wrappers
    around set_global (lines 49–52), gridlines (from line 63) and tissot (80–93).'
  - 'Suggestion: a short property subtitle per panel (conformal, compromise, equal-area,
    perspective) would guide the comparison.'
  image_description: |-
