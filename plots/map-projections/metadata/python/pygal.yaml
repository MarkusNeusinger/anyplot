review:
  strengths:
  - Ordered distortion zones take discrete steps of the imprint_seq fields ramp with
    each theme's own stops (mint→navy on light, dark green→pale periwinkle on dark),
    in natural order with the legend in the same order
  - Title prefix 'Mercator' names the projection, as the single-projection path of
    the spec asks
  - Native pygal_maps_world World choropleth with per-country hover values in the
    HTML output
  - 'Theme tokens threaded through pygal Style: chrome flips correctly, no dark-on-dark
    text'
  - Tidy df with role constants and a ramp_color helper make the data block replaceable
  weaknesses:
  - 'VQ-03, SC-04 (both): pygal_maps_world scales each country''s fill opacity by
    its value inside its series, so the lowest country of a zone washes out and no
    longer matches its legend swatch (light: Russia 3.5x reads pale grey-blue beside
    the navy ''60°+'' swatch and lighter than the US at 1.9x; India and Australia
    read paler than their steps) → every country of a zone in its zone''s full color,
    as its swatch shows. Likely cause: each zone added with its distortion values
    as the dict values instead of one constant value per zone.'
  - 'SC-02 (both): no graticule — the C2 bullet and the Notes ask for latitude/longitude
    lines at regular intervals, transformed by the projection and lighter than the
    coastlines → draw meridians and parallels every 30°. Likely cause: pygal_maps_world
    World has no graticule layer; none added.'
  - 'SC-02, DQ-01 (both): only about 100 of the ~200 countries carry a value; the
    rest (Libya, Central America, Uruguay, Zimbabwe, Kyrgyzstan, …) render blank,
    white on the light page and page-colored on the dark one, so that land is not
    set apart from sea (C1) → a value for every country of the world dataset. Likely
    cause: the hand-typed country_distortion dict.'
  - 'DQ-03 (code): the factors are typed by hand and do not follow the sec^2(latitude)
    the comment states: Norway 2.8 (65°N → 5.6, −2.8), Finland 2.4 (64°N → 5.2, −2.8),
    Canada 3.0 (60°N → 4.0, −1.0), US 1.9 (38°N → 1.61, +0.29); the legend bounds
    disagree too (30°–60° gives 1.33–4.0x, not 1.2–2.4x) → compute each factor as
    1/cos²(latitude) from a latitude column and derive the zone bounds from the same
    formula. Likely cause: literal values in the data dict and ZONE_LABELS.'
  - 'Suggestion: the legend entries never say what the ''x'' measures; a subtitle
    such as ''area exaggeration vs true size'' would make the zones self-explanatory.'
  - 'Suggestion: the Tissot indicatrices the Notes allow would show the distortion
    geometrically, not only by color.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'Mercator · map-projections · python · pygal · anyplot.ai' centered at the top in dark ink; legend of four zones across the bottom ('0°–15° · <1.1×' … '60°+ · ≥2.4×') in dark ink; dark grey country outlines; no axes. All readable.
      Data: pygal world map (Mercator-like, Antarctica stretched along the bottom). Countries filled in four imprint_seq field steps: mint (equatorial South America, Central Africa, SE Asia), green (Egypt, Arabia, southern Africa), slate blue (US, Europe, Kazakhstan), navy (Greenland). Per-value opacity washes the lowest country of each zone out: Russia and Canada pale grey-blue, India/Mexico/Sahel pale mint, Australia and China pale grey, so these no longer match their swatches. About half the countries (Libya, Central America, Uruguay, Kyrgyzstan) are blank white, nearly indistinguishable from the sea. No graticule.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: title and legend in light ink, light grey country outlines; no dark-on-dark text.
      Data: same layout; zone steps use the dark stops (dark green → green → grey-teal → pale periwinkle Greenland), as an ordered ramp should. Russia/Canada appear muted grey-lavender, Australia/China dark grey-teal (opacity scaling); countries without a value are page-colored and read as sea except for their outlines. No graticule.
      Legibility verdict: PASS
