review:
  strengths:
  - Six named projections (Mercator, Robinson, Mollweide, Orthographic, Equal Earth,
    Natural Earth) side by side with identical styling, so only the projection differs
  - Graticule every 30° transformed by each projection and kept at 20 % opacity, lighter
    than the coastlines
  - Plotly's built-in geo base layers (land, ocean, lakes, countries) with projection_type
    per subplot, no external shapefile
  - 'Complete theme adaptation: coastline and border tone flips per theme so borders
    stay legible on the land fill in both renders'
  - HTML export keeps the geo panels interactive (zoom, pan, rotatable orthographic
    globe)
  weaknesses:
  - 'SC-02 (both): land is filled with the saturated brand green #009E73 although
    no value is mapped, so C1''s neutral land color is missed → a neutral land tone
    (e.g. a warm grey such as the muted anchor #6B6A63-light/#A8A79F-dark, or a pale
    beige), keeping land clearly apart from the sea. Likely cause: LAND_COLOR = "#009E73".'
  - 'VQ-05 (both): the maps are width-limited in their cells and leave an empty band
    of about 13 % of the height under the bottom row plus about 12 % unused width
    at the left edge → larger panels that fill the canvas (about +10 % map width).
    Likely cause: margin l=80/r=40 reserved for axes the geo panels do not have, and
    horizontal_spacing/vertical_spacing leaving the cells wider than tall.'
  - 'Suggestion: Tissot indicatrices (allowed by the Notes) via Scattergeo circles
    at regular positions would make the distortion explicit.'
  - 'Suggestion: subplot labels in full INK at a slightly larger size would give the
    projection names more presence.'
