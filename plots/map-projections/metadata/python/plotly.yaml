      Data: 2x3 grid of world maps; land #009E73 with dark-green #006B4F coastlines and borders, sea light blue #C8E0F0, 30° graticule in 20 % ink, curved in Robinson/Mollweide/Equal Earth/Natural Earth, straight in Mercator, a hemisphere on the Orthographic globe. Maps are width-limited; empty band below the bottom row.
