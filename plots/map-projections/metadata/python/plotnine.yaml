review:
  strengths:
  - 2x2 facet_wrap small multiples with the same world, graticule and styling in each
    panel, so only the projection differs (C3)
  - 'Graticule at 30-degree intervals transformed by each projection, drawn thinner
    and more transparent than coastlines (C2): straight in Mercator, curved in Robinson,
    elliptical in Mollweide'
  - 'Theme-adaptive ocean fill (#D0E8F5 light / #0F1F2D dark) separates land from
    sea clearly in both themes (C1)'
  - 'Correct projection mathematics: Mercator log-tan, Robinson table interpolation
    with its standard scale factors, Mollweide via Newton iteration'
  - 'All chrome threads INK / INK_SOFT / ELEVATED_BG tokens; land #009E73 identical
    in both renders'
  weaknesses:
  - 'SC-01 (both): an annotation layer the spec does not request — a property note
    in every panel (''equidistant cylindrical'', ''conformal · area-distorting'',
    ''compromise · balanced'', ''equal-area pseudocylindrical'') → remove it; the
    strip label names each projection as the spec asks. Likely cause: the PROJ_NOTES
    / df_annot block and its geom_text layer.'
  - 'DQ-01 (both): the world is a coarse hand-traced continent outline: Greenland,
    the British Isles, Japan, Indonesia, Madagascar and New Zealand are missing and
    the ''country borders'' are about a dozen disconnected fragments instead of the
    ~200 countries the Data asks for → trace the missing major islands and closed
    national borders. Likely cause: the continents_raw and _borders_raw coordinate
    lists.'
  - 'CQ-01 (code): lines 94–101 define a `_mollweide` helper function → inline the
    Newton iteration into the projection loop (no functions). Likely cause: the PROJ_FNS
    dispatch needing a callable for Mollweide.'
  - 'Suggestion: the per-panel notes sit on the southern tip of South America in every
    panel; if kept, place them in open ocean.'
  - 'Suggestion: Tissot indicatrices (allowed by the Notes) would make the area-vs-shape
    trade-off visible instead of stated.'
