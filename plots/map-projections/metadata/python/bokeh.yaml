review:
  strengths:
  - Four projections (Equirectangular, Mercator, Sinusoidal, Mollweide) side by side,
    each with its own panel title and identical world styling so only the projection
    differs
  - Real Natural Earth 110m country boundaries in a neutral INK_SOFT fill, clearly
    set apart from the sea in both themes
  - Graticule at 30° intervals transformed through each projection; its curvature
    in the Sinusoidal and Mollweide panels shows how each bends the globe
  - Per-panel Legend built from LegendItem with projection-specific notes (grows poleward,
    equal-area) plus a subtitle that explains how to read the Tissot rings
  - NaN-separated multi-segment lines for graticule and Tissot rings, and gridplot
    + column + Div composition, are idiomatic Bokeh
  - 'Theme tokens threaded through every chrome element; brand green #009E73 identical
    in both renders'
  weaknesses:
  - 'VQ-02 (both): each panel''s bottom-right legend box covers the 90°E longitude
    label (fully hidden in Mercator and Sinusoidal, half hidden as ''90°I'' / ''90°E''
    in Equirectangular and Mollweide) and the Tissot ring at 60°S 150°E; the 60°N
    / 30°N labels at 175°W sit on the 150°W Tissot rings in the Equirectangular and
    Mercator panels → legend and labels clear of labels and rings. Likely cause: Legend
    location=''bottom_right'' inside the frame and lat labels placed at x=radians(-175).'
  - 'VQ-01 (both): lat/lon labels at 22pt and legend labels at 24pt are well below
    the Bokeh reference of 34pt for tick and legend text and read small beside the
    30pt panel titles → about 28–30pt (+6 to +8pt). Likely cause: text_font_size=''22pt''
    and label_text_font_size=''24pt''.'
  - 'VQ-03 (both): the legend glyphs are short hairline stubs; the graticule sample
    is nearly invisible, especially on the dark background → longer, thicker glyphs.
    Likely cause: default Legend glyph_width/glyph_height with no override.'
  - 'SC-02 (both): the Tissot indicatrices are drawn as circles of 8° in longitude
    and latitude, not as geodesic circles, so on the conformal Mercator they appear
    as flattened ellipses at the equator and egg shapes at 60° instead of circles
    that only change size, and on the Equirectangular they stay round where a true
    indicatrix widens east-west (C4) → build each ring as a small circle on the sphere
    (lon offset scaled by 1/cos(lat)) before projecting. Likely cause: clons = lon_d
    + tissot_r*cos(a) without a 1/cos(lat) factor.'
  - 'CQ-01 (code): five helper functions (_moll_theta, _country_patches_equirect/_mercator/_sinusoidal/_mollweide)
    break the flat Imports → Data → Plot → Save structure → inline the projection
    formulas in the data step. Likely cause: the per-projection helpers.'
  - 'CQ-04 (code): the Mollweide Newton iteration is written out three more times
    inline (lines 407–410, 416–418, 429–431, 467–470) although _moll_theta computes
    it, and the four panel blocks repeat the same figure styling verbatim → one projection
    step and one styling pass. Likely cause: copy-pasted panel blocks.'
  - 'Suggestion: an equal-area projection that is not pseudocylindrical-sinusoidal
    (Equal Earth or Lambert Cylindrical) would contrast more clearly with Mercator
    than Sinusoidal does next to Mollweide.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas, including behind the centered title block.
      Chrome: centered bold title "map-projections · python · bokeh · anyplot.ai" with a grey subtitle explaining the Tissot rings; four bold panel titles (Equirectangular (Plate Carrée), Mercator, Sinusoidal, Mollweide) in a 2x2 grid with thin INK_SOFT frames; grey lat (60°N…60°S) and lon (90°W, 0°, 90°E) labels; each panel has a bottom-right legend on an elevated off-white box. All text readable dark-on-light. The legends hide the 90°E label in every panel and the lat/lon labels are small next to the panel titles.
      Data: neutral grey land fill with grey country borders, grey 30° graticule curved per projection, Tissot rings in brand green #009E73 (first series). Mercator rings are flattened at the equator and egg-shaped at 60°; Sinusoidal/Mollweide rings shear toward the edges.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 over the whole canvas, no white strip.
      Chrome: title and panel titles in light INK, subtitle, lat/lon labels and legend text in light grey INK_SOFT; legend boxes on #242420. No dark-on-dark text. The graticule legend glyph is barely visible.
      Data: Tissot rings in the same #009E73 as the light render; land is a lighter grey fill on dark with light borders; graticule visible and subtle.
      Legibility verdict: PASS
