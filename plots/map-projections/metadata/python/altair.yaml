  strengths:
  - 'Idiomatic Altair geo primitives: alt.sphere(), alt.graticule(step=[30, 30]) and
    alt.topo_feature() layered with + and projected once with .project()'
  - Four projection families side by side (conformal Mercator, compromise Natural
    Earth, equal-area Equal Earth, azimuthal Orthographic) with identical styling
    so only the projection differs
  - Property subtitles under each projection name tell the reader what each projection
    preserves or distorts
  - 'Theme-adaptive chrome and sphere fill; land #009E73 identical in both renders'
  - Equal-height panels fill the 3200×1800 canvas evenly
  - HTML output saved alongside the PNG
  weaknesses:
  - 'CQ-01 (code): a make_panel() helper function wraps the four panels, against the
    no-functions structure → build the layered base once and call .project(type=...).properties(...)
    inline per panel. Likely cause: make_panel() definition on lines 28-55.'
  - 'CQ-04 (code): the comment ''Mercator clips naturally at height=145'' contradicts
    the code, which uses height=165 for every panel → correct or remove the comment.
    Likely cause: stale comment above the panel calls.'
  - 'Suggestion: Tissot indicatrices on the Mercator and Equal Earth panels would
    make the size-versus-shape distortion directly visible.'
