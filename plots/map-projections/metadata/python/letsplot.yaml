review:
  strengths:
  - 'Tissot indicatrices are computed as true 8° spherical circles at regular 30°/60°
    graticule crossings, so Mercator''s conformal growth is measured, not drawn: the
    60° circles are about twice the equatorial diameter (1/cos 60° = 2) and the 30°
    ones about 1.15×, both checked in the render'
  - Uses lets-plot's native coord_map() so land, borders, graticule and circles all
    go through the same Mercator transform, with hemisphere-labelled ticks (60°N,
    120°W) placed on the graticule
  - Country borders in the page color on translucent neutral land separate land from
    sea in both themes, and a border that overshoots the simplified coast vanishes
    at sea
  - The caption states the reading ('Equal circles on the globe stay round in Mercator
    but grow toward the poles') and credits Natural Earth, and the title prefix names
    the projection as the spec asks
  - 'The chrome flips cleanly between themes, with an identical #009E73 hue for the
    circles; the legend keys use override_aes so they match the translucent marks'
  weaknesses:
  - 'Suggestion: the 1.4° Ramer-Douglas-Peucker simplification makes coastlines visibly
    angular (British Isles, Japan, Scandinavia); a finer tolerance would read more
    like a real coastline at this 2400 px size.'
  - 'Suggestion: over the dark sea the translucent circles fall to a deep green that
    reads weaker than over land; a slightly higher fill alpha in the dark theme would
    even them out.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, including the margins flattened by PIL.
      Chrome: the bold title "Mercator Projection · map-projections · python · letsplot · anyplot.ai" is dark ink, centred, at about 84% of the width; "Longitude (°)" and "Latitude (°)" axis titles; hemisphere tick labels (180°, 120°W … 180°; 60°S … 60°N) in soft ink; a thin panel frame; the legend at the bottom (Land, Tissot indicatrix (8° radius)); a two-line caption. All readable.
      Data: neutral grey translucent land with page-colored country borders; a subtle graticule every 30° that shows through the land; Mercator to ±85° with Antarctica and Greenland strongly inflated; 30 #009E73 translucent Tissot circles at lat -60..60 by 30 and lon -150..150 by 60, which stay round and double in diameter at ±60°.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels, legend and caption in light ink, all clearly readable; no dark-on-dark text. The frame and graticule are lighter grey and subtle.
      Data: identical geometry; the Tissot circles are the same #009E73 hue with a bright green outline (deeper green over sea, lighter over land, from alpha blending); land is mid-grey with dark page-colored borders.
      Legibility verdict: PASS
