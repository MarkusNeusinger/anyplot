review:
  strengths:
  - 'Tissot indicatrices are computed as true 8° spherical circles at regular 30°/60°
    graticule crossings, so Mercator''s conformal growth is measured, not drawn: the
    60° circles are about twice the equatorial diameter, the 30° ones about 1.15x'
  - lets-plot's native coord_map() puts land, borders, graticule and circles through
    the same Mercator transform, with hemisphere-labelled ticks (60°N, 120°W) on the
    graticule
  - Page-colored country borders on translucent neutral land set land apart from sea
    in both themes, and a border that overshoots the simplified coast vanishes at
    sea
  - The caption states the reading and credits Natural Earth; the title prefix names
    the projection as the spec asks
  - 'The chrome flips cleanly between themes with an identical #009E73 hue for the
    circles, and the legend keys use override_aes so they match the translucent marks'
  weaknesses:
  - 'Suggestion: the 1.4° Ramer-Douglas-Peucker simplification makes coastlines visibly
    angular (British Isles, Japan, Scandinavia); a finer tolerance would read more
    like a real coastline at 2400 px.'
  - 'Suggestion: over the dark sea the translucent circles fall to a deep green that
    reads weaker than over land; a slightly higher fill alpha in the dark theme would
    even them out.'
  - 'Suggestion: the five-line PIL pass that flattens the transparent margins could
    be the one-panel gggrid wrapper the library prompt prescribes for a fixed aspect,
    which paints the canvas inside lets-plot.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas, margins included (flattened to the page color with PIL).
      Chrome: bold dark title "Mercator Projection · map-projections · python · letsplot · anyplot.ai", centred at about 84% of the width; "Longitude (°)" and "Latitude (°)" axis titles; hemisphere tick labels (180°, 120°W … 180°; 60°S … 60°N) in soft ink; a thin panel frame; legend at the bottom (Land, Tissot indicatrix (8° radius)); a two-line caption. All readable.
      Data: neutral grey translucent land with page-colored country borders; a subtle 30° graticule showing through the land; Mercator to ±85° with Antarctica and Greenland strongly inflated; 30 #009E73 translucent Tissot circles at lat -60..60 by 30 and lon -150..150 by 60, round everywhere and about twice the equatorial diameter at ±60°.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title, axis titles, tick labels, legend and caption in light ink, all clearly readable; no dark-on-dark text. Frame and graticule in a subtle lighter grey.
      Data: identical geometry; the circles keep the same #009E73 hue and outline (deeper over sea, lighter over land from alpha blending); land is mid-grey with dark page-colored borders.
      Legibility verdict: PASS
