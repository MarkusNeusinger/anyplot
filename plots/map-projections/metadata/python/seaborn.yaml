review:
  strengths:
  - Four projections side by side (orthographic globe, Aitoff, Hammer, Lambert cylindrical
    equal-area), each with a two-line title naming the projection and the property
    it preserves, over the same Natural Earth world and styling so only the projection
    differs
  - Aitoff and Hammer panels use matplotlib's native projection axes with set_longitude_grid
    / set_latitude_grid, so the 30° graticule and the elliptical outline come from
    the projection itself
  - Country rings densified to 1° per edge, so coastlines and borders follow each
    projection's curvature, and the orthographic panel clips back-side vertices onto
    the horizon so no spurious land wedges appear
  - Theme-specific ocean, land and border tokens keep land clearly set apart from
    sea in both renders, with the graticule lighter than the coastlines
  weaknesses:
  - 'VQ-05 (both): the orthographic globe sits in a square axis inside a one-third-width
    cell, leaving an empty gap of about 18 % of the canvas width between it and the
    Aitoff panel in the top row → let the top-row panels fill the row (cell widths
    that match the globe''s square and the ellipse''s 2:1 aspect). Likely cause: gs[0,
    0:2] for the equal-aspect globe next to gs[0, 2:6] in a 6-column gridspec.'
  - 'CQ-01 (code): an ortho() helper function is defined (lines 87–97) → inline the
    orthographic formulas in the panel loop. Likely cause: the def ortho block.'
  - 'LM-01 (code): no seaborn plotting call draws anything; every mark is ax.fill,
    ax.plot or ax.grid, and seaborn only sets the theme → draw the graticule and outline
    lines through sns.lineplot(data=..., x=..., y=..., units=..., estimator=None,
    sort=False). Likely cause: plain matplotlib loops for every layer.'
  - 'Suggestion: a conformal panel such as Mercator would contrast more with the equal-area
    ones than Aitoff, which looks nearly identical to Hammer.'
  - 'Suggestion: the orthographic axis corners outside the globe could take the page
    color instead of the ocean color, so only the globe reads as sea.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; map interiors in pale blue ocean.
      Chrome: suptitle 'map-projections · python · seaborn · anyplot.ai' in dark ink at the top; four bold two-line panel titles (Orthographic / globe perspective, 20°N 20°E; Aitoff / compromise, elliptical; Hammer / equal-area, elliptical; Lambert Cylindrical / equal-area, squashed poles) in dark ink; no ticks; grey spines follow the globe circle, the two ellipses and the Lambert rectangle. All text readable.
      Data: Natural Earth 110m countries in sage land with dark-green borders through four projections; grey 30° graticule curved per projection, meridians converging at the poles; orthographic globe centered on north Africa with clean horizon clipping. Layout: bottom row fills the width; top row leaves an empty gap between the small globe and the Aitoff ellipse.
      Legibility verdict: PASS

