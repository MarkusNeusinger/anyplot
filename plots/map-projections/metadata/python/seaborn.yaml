review:
  strengths:
  - Four-panel comparison (orthographic, Aitoff, Hammer, Lambert cylindrical) with
    identical world data and styling so only the projection differs
  - Real Natural Earth 110m boundaries render clean coastlines and country borders
    through every projection, with a 30-degree graticule lighter than the coastlines
  - Panel subtitles state what each projection preserves (equal-area, compromise,
    globe perspective)
  - Theme-specific ocean, land and border tokens and a horizon circle on the globe
    panel; chrome correct in both themes
  weaknesses:
  - 'SC-03 (both): in the orthographic panel, country polygons that cross the horizon
    are filled across the NaN gap, painting spurious land wedges east of Siberia and
    along the left edge near South America → only the visible part of each polygon
    is filled. Likely cause: ax.fill() on rings whose back-side points were set to
    NaN instead of clipping each ring to the visible hemisphere.'
  - 'SC-01, SC-04 (both): six green city dots are a layer the spec neither requires
    nor offers, and nothing says what they mark → remove the city layer. Likely cause:
    the cities DataFrame and the sns.scatterplot call.'
  - 'VQ-03 (dark): land #2A3D26 on ocean #192837 has little contrast and the #3A5534
    country borders are near-invisible, so land barely separates from sea → a lighter
    land fill and border token for the dark theme. Likely cause: the dark LAND and
    LAND_EDGE values.'
  - 'VQ-05 (both): an empty band of about 12 % of the canvas height sits between the
    suptitle and the panels and the orthographic panel is small with empty space either
    side → panels that fill the canvas height. Likely cause: tight_layout(rect=[0,
    0, 1, 0.955]) with equal-aspect axes in an even 2x2 grid; use gridspec width ratios
    that match the panel aspects.'
  - 'CQ-01 (code): a project() helper function is defined → inline the projection
    formulas in the panel loop. Likely cause: the def project block.'
  - 'CQ-04 (code): the Aitoff and Hammer formulas (project() branches) are written
    out although matplotlib computes them with plt.subplot(projection=''aitoff''/''hammer'')
    → use the built-in projections for those panels. Likely cause: the hand-written
    projection branches.'
  - 'Suggestion: a Mercator panel would show conformal distortion next to the equal-area
    ones.'
