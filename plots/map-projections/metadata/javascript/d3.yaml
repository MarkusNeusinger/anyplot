review:
  strengths:
  - Three side-by-side projections (Mercator, Orthographic, Equal Earth), each with
    a caption naming its distortion trade-off
  - Tissot indicatrices correctly implemented via d3.geoCircle — equal angular-radius
    circles visibly change shape/size per projection to demonstrate distortion
  - Antarctica is rendered with per-projection-appropriate geometry (huge, inflated
    band in Mercator vs. a thin true-size fringe in Equal Earth) — a genuinely instructive
    detail about polar-area distortion rather than a generic reused shape
  - 'Clean theme handling: Tissot green is pixel-identical across light/dark, backgrounds
    match #FAF8F1/#1A1A17, and a subtle three-tier tonal hierarchy (page bg / ocean
    elevatedBg / land) is used consistently across all three panels'
  - Fully deterministic, hand-authored coastline data with antimeridian-safe ring
    winding via a signed-geoArea check, avoiding the classic d3-geo "inverted polygon"
    bug
  weaknesses:
  - 'No country-level boundaries: the spec''s Data section calls for ~200 countries
    with a `country` identifier, but this implementation renders only continent-level
    silhouettes — there are no interior country borders anywhere'
  - Mercator panel's Antarctica polygon occupies roughly 40% of the panel height,
    visually dominating and unbalancing that panel compared to the cleaner Orthographic
    and Equal Earth panels, even though it correctly illustrates Mercator's polar-area
    inflation
  - Panel caption italic subtext (~12px at 3200px canvas width) is on the small side
    — double check legibility once the preview is scaled down to the ~400px thumbnail
    size
  - No optional choropleth/value-based coloring is demonstrated (spec lists this as
    optional; land uses a flat neutral fill only)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1-consistent), not pure white. Each of the three map panels sits on a slightly distinct "ocean" tone (elevatedBg) with a thin soft-ink border, giving a subtle page/ocean/land tonal hierarchy.
      Chrome: Bold dark title "World Map Projections Compared · map-projections · javascript · d3 · anyplot.ai" at top, dynamically shrunk to avoid overflow; italic gray subtitle below it explaining the Tissot-indicatrix concept. Each panel has a bold caption (Mercator / Orthographic / Equal Earth) and an italic note describing that projection's distortion trade-off. All text renders as dark ink on the light background — clearly legible.
      Data: Landmasses fill in a neutral muted gray-brown (not a data-driven color, matches spec's "neutral color scheme" requirement). Tissot indicatrix circles are brand green (#009E73) at partial opacity, forming a 7×5 lon/lat grid of equal-angular-radius circles that visibly change size and shape per projection — small near the panel center, large/stretched near panel edges and poles (most dramatic in Mercator, where the ~-63° to -82° Antarctica band is inflated to nearly 40% of the panel). Graticule lines (30° grid) are thin and subtle in gray, visible under the land without competing with it.
      Legibility verdict: PASS — no light-on-light text found anywhere; all titles, captions, and notes are clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17-consistent), not pure black. Same three-tier tonal hierarchy as light mode, chrome flipped to dark tones.
      Chrome: Title and panel captions render in light/white text against the dark background; subtitle and italic notes render in a softer light-gray ink. Graticule lines remain thin and subtle, visible against the dark land fill without disappearing.
      Data: Tissot circles are the identical brand green (#009E73) as the light render — confirmed pixel-consistent placement, size, and hue. Land fill uses a lighter muted gray-brown tuned for the dark background (theme-adaptive chrome color, not a data series, so this is expected and consistent with the spec's "neutral, non-data" land treatment).
      Legibility verdict: PASS — no dark-on-dark failures; every title, caption, and tick-equivalent label is clearly readable against the near-black background, and the green Tissot markers remain vivid on both surfaces.
