review:
  strengths:
  - Excellent three-panel comparative layout (Mercator, Orthographic, Equal Earth)
    with clear per-panel captions explaining each projection's distortion property
  - Tissot indicatrices (equal angular-radius circles at a 7x5 lon/lat grid) are a
    genuinely distinctive and correct technique to visualize area/shape distortion,
    and they visibly grow toward the edges in Orthographic while staying uniform in
    Equal Earth -- real data storytelling
  - 'Idiomatic, sophisticated d3-geo usage: fitExtent, clipExtent, geoGraticule, geoCircle,
    and a geoArea-based ring-winding normalization helper'
  - 'Palette and theme chrome are fully correct: Tissot fill/stroke is the brand green
    #009E73 identical in both renders, backgrounds are the correct warm off-white/near-black,
    all text is theme-adaptive and legible in both themes'
  - Deterministic, hand-authored, in-memory geographic data -- no fetch/CSV/network
    calls, fully reproducible
  - Title format is correct with a natural descriptive prefix, and title/subtitle
    font sizes are explicitly set and well-proportioned
  weaknesses:
  - 'SEVERE RENDERING BUG in the Mercator panel: a large gray polygon (almost certainly
    the ANTARCTICA ring, which encloses the south pole) fills roughly the bottom third
    of the panel south of a wavy coastline-shaped edge, instead of rendering as the
    small Antarctic cap seen correctly in the Orthographic and Equal Earth panels.
    This obscures Australia entirely and hides the southern tips of Africa and South
    America. Root cause: d3.geoMercator() + .clipExtent() has no azimuthal pole-handling
    (unlike .clipAngle() on Orthographic), so a ring that encloses the south-pole
    singularity renders inverted/complemented once clipped to a finite rectangle,
    even though the ring''s winding order is correct for the other two projections.
    Fix: do not feed the full pole-enclosing ANTARCTICA ring into the Mercator path
    -- truncate/clip its southern edge at the same latitude as mercatorBounds (-82
    degrees) before projecting for the Mercator panel specifically (e.g. build a Mercator-only
    variant of the ring clamped to lat >= -82, or clip the datum with d3.geoClipRectangle/d3.geoBounds
    pre-processing), so it never encloses the pole under that projection.'
  - Because of the bug above, the Mercator panel fails to show all continents (Australia
    is completely hidden), which is also a Data/Spec issue beyond the visual defect.
  - 'Visual Refinement is undercut by the bug: an otherwise clean, minimal-chrome
    comparison layout is marred by this large incorrect gray mass, which reads as
    sloppy/broken in an otherwise polished design.'
  - 'Minor: consider adding a thin white/ink stroke or slightly higher alpha to the
    Tissot ellipses in the Orthographic panel where they overlap densely near the
    limb, to keep individual ellipses distinguishable at small preview sizes.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, correct -- not pure white.
      Chrome: Title "World Map Projections Compared - map-projections - javascript - d3 - anyplot.ai" in bold dark ink, clearly readable; italic subtitle below in softer ink, readable; panel captions (bold projection name + italic distortion note) below each panel, all readable against the light background.
      Data: Three side-by-side panels -- Mercator (left, rectangular with vertical graticule lines), Orthographic (center, globe with radial graticule), Equal Earth (right, elliptical pseudo-cylindrical shape). Landmasses are neutral muted gray, matching the spec's "neutral color scheme when not showing data values." Tissot indicatrices are brand green (#009E73) ellipses/circles at a 7x5 lon/lat grid, correctly showing minimal distortion near the Equal Earth panel's center and increasing distortion toward the edges/limb in Mercator and Orthographic. However, the Mercator panel has a severe rendering bug: a large gray polygon (the pole-enclosing Antarctica ring, mis-rendered by Mercator's clipExtent) fills roughly the bottom third of the panel, obscuring Australia and the southern tips of Africa and South America.
      Legibility verdict: PASS (all text) but the map data itself has a major correctness defect (see weaknesses).

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17, correct -- not pure black.
      Chrome: Title and subtitle render in light cream text, clearly readable against the dark background; panel captions likewise readable; no dark-on-dark failures detected.
      Data: Identical layout and identical green Tissot indicatrix color (#009E73) to the light render -- data colors correctly did not change between themes; only chrome (background, text) flipped as expected. Landmass gray fill uses the adaptive muted tone and remains distinguishable from the near-black background. The same Mercator-panel Antarctica rendering bug is present identically in this render, confirming it is a data/projection-clipping defect rather than a theme-specific issue.
      Legibility verdict: PASS (all text) but same underlying map rendering defect as the light render.
