review:
  strengths:
  - Three genuinely distinct hand-rolled projections (Mercator, Mollweide, Orthographic)
    implemented as real spherical math, not a single equirectangular map re-skinned
    three times
  - Tissot indicatrices (great-circle destination-point formula) give a real, self-explaining
    distortion story — the same reference circles visibly change area/shape across
    panels, which is exactly the spec's educational goal
  - Each panel is sized to its own projection's natural aspect ratio (fitDomain +
    boundaryAspect) instead of forcing a shared box, so the Mollweide ellipse and
    Orthographic globe both fill their frame without internal letterboxing
  - 'Clean theme handling: land fill, graticule, borders, and Tissot green are all
    pulled from window.ANYPLOT_TOKENS and read identically correct in both renders'
  - Honest scope-limiting comments (e.g. only two non-disputed country borders, 'not
    survey-accurate' outline) show deliberate avoidance of disputed-boundary and factual-accuracy
    pitfalls rather than silently faking precision
  weaknesses:
  - Row 2 (Orthographic) is centered under a two-panel row of the same height, so
    the globe's row uses only ~20% of the canvas width — leaving large equal-height
    empty margins left and right of the globe. Consider giving the Orthographic panel
    more visual weight (scale it up to use more of the leftover row height/width,
    or rebalance the two rows so the single panel isn't dwarfed by side whitespace)
    — VQ-05 deduction.
  - Only 2 of ~200 real country borders are drawn (US-Canada, US-Mexico); the spec
    asks for 'clean coastlines and country borders with appropriate styling' — the
    continent-level fill is a reasonable proxy but the border layer barely registers
    at this scale (minor SC-02 deduction).
  - 'LM-02: the implementation uses MUI X purely as a linear-scale/theme provider
    (useXScale/useYScale) for a custom SVG overlay — no native MUI X chart feature
    (tooltips, legend, animation, multi-series) is exercised, so the library''s own
    distinctive capabilities aren''t showcased beyond plumbing.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "map-projections · javascript · muix · anyplot.ai" centered at top in dark ink, clearly legible. Each of the three panels (Mercator, Mollweide, Orthographic) has a bold dark headline and a lighter gray descriptive subtitle beneath it, both fully readable. Bottom caption text (explaining the Tissot indicatrices) is smaller but still legible against the light background.
      Data: Continents rendered as flat muted-gray silhouettes with a thin gray outline; two dashed country-border lines (US-Canada, US-Mexico) are visible in dark ink; graticule lines are faint gray; Tissot indicatrix circles are brand green (#009E73) with translucent fill — clearly the first/only data series and correctly colored.
      Legibility verdict: PASS — no text is light-on-light, all titles/subtitles/caption readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and panel headlines render in light off-white text, panel subtitles in a softer light gray — both clearly visible against the dark background. Caption text at the bottom is a muted light gray, still readable. Graticule lines are faint light-gray, consistent with theme-adaptive grid treatment.
      Data: Continents are a mid-gray fill (theme-adaptive INK_MUTED) distinguishable from the near-black background; Tissot circles remain the identical brand green (#009E73) as the light render, confirming data colors are held constant across themes.
      Legibility verdict: PASS — no dark-on-dark failures; all chrome elements (title, headlines, subtitles, caption, tick-free graticule) are clearly visible.

    Both renders show identical geometry and identical Tissot/land colors; only background, text, and grid colors flip between themes as expected.
