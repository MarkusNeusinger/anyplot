review:
  strengths:
  - Three projections (Mercator, Mollweide, Orthographic) rendered side-by-side with
    per-panel titles and one-line distortion descriptions, directly matching the spec's
    suggested comparative layout.
  - 'Tissot indicatrices at a 5x6 lat/lon grid convincingly demonstrate each projection''s
    area/shape distortion: uniform near the Mercator equator but ballooning toward
    the poles, stretched into ellipses at the Mollweide''s outer edge, and varying
    with angular distance from the orthographic''s center.'
  - 'Genuine spherical math: latitude-clipped Mercator, an iteratively-solved Mollweide
    theta, a great-circle destination formula for the Tissot circles, and orthographic
    far-side culling -- not faked.'
  - Data colors are pixel-identical between light/dark renders; only chrome flips,
    matching the Imprint theme contract.
  - 'Fully deterministic and self-contained: hand-coded continent coordinates, no
    RNG, no network/geo-library dependency.'
  weaknesses:
  - 'Large dead space: the map row + headers occupy roughly the top half of the canvas,
    leaving a big blank gap (~40%+ of total height) between the maps and the footer
    caption. mapAreaH is capped by a 1.3 aspect ratio that is well below the available
    panelsRowH, so the freed height just collects as an oversized empty band instead
    of being used. Fix by growing the panels to consume more of the available vertical
    space (e.g. relax the aspect cap, enlarge panelW/mapAreaH together, or reduce
    OUTER_PAD/GAP) or by vertically centering the map row + caption as a group instead
    of anchoring the row to the top.'
  - Only continent-level outlines are shown -- no individual country borders -- even
    though the spec's Data section explicitly lists 'country' as a field and the Notes
    call for 'clean coastlines and country borders'. Reasonable given MUI X has no
    geo primitives, but it under-delivers on that explicit ask.
  - 'Low library mastery: ChartContainer/useXScale/useYScale are used purely as a
    linear-scale utility to place custom SVG paths; none of @mui/x-charts''s built-in
    series types, legends, or tooltips are exercised, so the community surface''s
    richer capabilities go unused.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1) across the full canvas.
      Chrome: Title "map-projections · javascript · muix · anyplot.ai" centered at top in dark ink; each of the three panels has a bold dark headline (Mercator/Mollweide/Orthographic) and a lighter gray subtitle line; footer caption in muted gray at the very bottom. All text is dark-on-light and clearly readable.
      Data: Continents rendered as muted gray filled polygons with darker gray outlines; graticule lines are light gray and subtle; Tissot indicatrices are Imprint green (#009E73) semi-transparent circles/ellipses -- the first (and only) data series, correctly matching the mandated brand green.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17) across the full canvas.
      Chrome: Same title/headline/subtitle/caption text, now light-on-dark (light gray/white ink) -- fully legible, no dark-on-dark failures anywhere.
      Data: Continents still muted gray fills (lighter shade suited to the dark surface) with gray outlines; graticule lines are dim gray and subtle; Tissot circles remain the identical Imprint green (#009E73) as in the light render -- only chrome flipped, data color unchanged as required.
      Legibility verdict: PASS

    Shared observation (both renders): the three map panels plus their headers occupy only the top ~55% of the canvas height; a large blank band separates them from the footer caption near the bottom edge. This is a layout issue, not a legibility one, and is scored under VQ-05/DE-02 below.
