review:
  strengths:
  - 'Three projections side by side cover the three distortion families: Mercator
    (conformal), Mollweide (equal-area) and Orthographic (azimuthal). Each panel''s
    subtitle names the property it preserves and its italic note names the distortion.'
  - 'The Tissot indicatrices behave correctly: on Mercator they stay circular and
    roughly double in radius at ±60° (sec φ), on Mollweide they keep their area and
    shear into ellipses toward the limb, and on the globe they foreshorten toward
    the horizon.'
  - 'The orthographic clipping is careful work: lines are cut at the horizon and land
    rings are closed along the limb arc instead of a chord, so the hemisphere reads
    cleanly with no fill artefacts.'
  - 'The line-weight hierarchy is clear: a faint 30° graticule, a dashed equator and
    prime meridian, thin country borders, firmer coastlines and a framed outline.
    The graticule sits visibly lighter than the coastlines, as the spec asks.'
  - 'Uses the MUI X composition API: ChartsContainer with hidden linear axes supplies
    the coordinate system, and a custom child component draws the geometry through
    useXScale/useYScale.'
  - 'Theme handling is clean: every chrome element comes from ANYPLOT_TOKENS (ink,
    inkSoft, elevatedBg, pageBg), the Tissot green is t.palette[0] in both renders,
    and skipAnimation is set.'
  weaknesses:
  - 'VQ-03 (both): the legend glyphs do not match the marks they explain. The ''Land
    & coastline'' swatch is filled at opacity 0.45, noticeably darker than the 0.26
    land fill on the maps. The Tissot swatch applies opacity 0.6 to the whole element,
    so it reads as a dull solid disc (especially on #1A1A17) instead of a 0.3 translucent
    fill with a full-strength outline → use the same fill alpha and outline as the
    map marks (backgroundColor at fillOpacity 0.26 / 0.3 with an opaque border, no
    element-level opacity). Likely cause: LegendItem swatch styles at lines 775 and
    780 use `opacity` instead of the GeoOverlay fill values.'
  - 'CQ-01 (code): about ten module-level helper functions (densify, mollweideTheta,
    orthoVec, limbPoint, limbArc, projectLine, projectRing, outlineOf, LegendItem,
    plus the GeoOverlay component). GeoOverlay is needed for the hooks and the projection
    math has no library call, but outlineOf (used once) and LegendItem (four uses
    of a 3-line span) are helpers a flat structure does not need → inline outlineOf
    into the bundles map and write the four legend spans directly. Likely cause: helper-function
    decomposition beyond what the React component contract requires.'
  - 'Suggestion: an equal-area Equal Earth or Robinson panel could replace one view
    to show a compromise projection, which the spec lists among its examples.'
  - 'Suggestion: the empty band below the legend (about 12 % of the canvas) is larger
    than the band above the title; nudging the block down would balance the vertical
    whitespace.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page. Each map interior is filled with the slightly lighter elevated surface, framed by a soft inkSoft outline (rectangle for Mercator, ellipse for Mollweide, circle for Orthographic).
      Chrome: bold centered title "map-projections · javascript · muix · anyplot.ai" in dark ink with a grey subtitle beneath. Each panel has a bold title (Mercator (Cylindrical), Mollweide (Pseudocylindrical), Orthographic (Azimuthal)), a property subtitle and an italic distortion note under the map. A one-row legend at the bottom: Land & coastline, Country border, Tissot indicatrix (550 km radius), 30° graticule. All text is dark on light and fully readable; nothing is clipped.
      Data: grey translucent land with darker coastlines and thin country borders. The faint graticule curves with each projection, with a dashed equator and prime meridian. Brand-green #009E73 translucent Tissot circles sit at 30° intervals: circular and growing toward ±60° on Mercator, sheared equal-area ellipses on Mollweide, foreshortened toward the limb on the globe (centered 20°N, 0°E). Antarctica is a wide band at the bottom of the Mercator map (clipped at 85°).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page with a slightly lifted elevated surface inside each map outline. The outlines are drawn in light inkSoft.
      Chrome: title in light ink, subtitles, panel subtitles, notes and legend in light grey. No dark-on-dark text anywhere; all text readable.
      Data: Tissot fill and outline are the same #009E73 as in the light render. Land is light grey at low alpha with light coastlines and borders, and the graticule is faint light grey. Only the chrome flipped.
      Legibility verdict: PASS
