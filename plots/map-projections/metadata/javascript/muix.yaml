review:
  strengths:
  - Three projections from three families (cylindrical Mercator, pseudocylindrical
    Mollweide, azimuthal Orthographic) side by side with the same landmasses, graticule
    and Tissot set, so only the projection differs.
  - 'The projections are computed correctly in the code (Mercator ln tan, Mollweide
    Newton iteration on 2θ + sin 2θ = π sin φ, orthographic with a back-hemisphere
    cull): Tissot circles stay round and grow toward the poles in Mercator and shear
    but keep their size in Mollweide, as the spec''s characteristic bullet asks.'
  - Each panel carries a bold projection name, a property subtitle (conformal / equal-area
    / globe centre) and a one-line distortion note, giving a clear typographic hierarchy
    below the mandated title.
  - Equator and prime meridian are drawn dashed and stronger than the 30° graticule,
    which sits lighter than the coastlines, and each map is clipped to and outlined
    by its own projection boundary.
  - 'Idiomatic MUI X composition: each map is a ChartsContainer with hidden linear
    axes acting as the projected coordinate system, and a custom GeoOverlay component
    draws through useXScale/useYScale; skipAnimation is set.'
  - 'Theme threading is complete: page, map interior, ink and soft-ink tokens flip
    between renders while the Imprint green of the Tissot indicatrices stays identical.'
  weaknesses:
  - 'SC-02, SC-03 (both): in the Orthographic panel, landmasses that cross the horizon
    (Asia/Russia at top right, North America and Greenland at top left) are closed
    with straight chords from where they leave the visible hemisphere to where they
    re-enter, so false triangular land slivers appear (e.g. the narrow wedge from
    the top limb down to Scandinavia and the straight edge across Siberia) → clip
    each polygon against the horizon and close it along the limb arc. Likely cause:
    the projection loop drops back-hemisphere vertices and each run is closed with
    `Z` in GeoOverlay''s continentsD builder.'
  - 'DQ-01 (both): country borders exist only as 11 short dashed sketch lines (Canada–US,
    Sahara South, India–China, …) and coastlines are 5–35-vertex outlines, so the
    ''coastlines and country borders'' the Notes and the first ''A good version shows:''
    bullet ask for read as continent sketches without countries → a denser landmass
    and border dataset (per-country outlines, even simplified) so borders cover the
    land. Likely cause: the hand-written `data` block of 13 landmasses and 11 border
    polylines.'
  - 'VQ-05 (both): the maps fill only the middle ~40 % of the canvas height, with
    about 200 CSS px of empty band above and below every panel, and the per-panel
    notes sit ~200 px under their maps next to the footer → shrink the vertical slack
    so the maps grow (about +40 % height) and the notes sit directly beneath them.
    Likely cause: mapH = rowHeight − header − footer while the panel width, not height,
    limits the map scale, and the flex column pins the note to the bottom of a full-height
    panel.'
  - 'CQ-04 (code): lines 518–573 repeat the same `for` loop over runs building an
    SVG path string six times (continents, borders, graticules, equator, meridian,
    Tissot) → one `runs.map(r => r.map(([x, y], i) => `${i ? "L" : "M"}${xScale(x)},${yScale(y)}`).join("")).join(close)`
    expression per layer, saving about 40 lines. Likely cause: copy-pasted path builders.'
  - 'Suggestion: an equal-area projection with a smoother outline (Equal Earth or
    Robinson) instead of, or next to, Mollweide would show the trade-off between compromise
    and equal-area projections.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; each map interior is the slightly lighter elevated tone, outlined in soft ink.
      Chrome: bold dark title "map-projections · javascript · muix · anyplot.ai" centred at top; three panel headings (Mercator (Cylindrical), Mollweide (Pseudocylindrical), Orthographic (Azimuthal)) with soft-ink subtitles; distortion notes under each panel near the bottom; a footer legend (landmasses swatch, green Tissot circle, dashed graticule). All text dark on light and readable.
      Data: grey translucent landmasses with darker outlines and faint dotted country-border sketches; light grey 30° graticule, dashed equator and prime meridian; Tissot indicatrices in Imprint green #009E73 (translucent fill, solid outline) — round and growing toward the poles in Mercator, sheared but similar-sized in Mollweide, foreshortened toward the limb in the Orthographic globe centred at 20°N 0°E. The Orthographic panel shows straight-chord land slivers where polygons cross the horizon (top left and top right). Maps occupy only the middle ~40 % of the height, with large empty bands above and below.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page with slightly lighter map interiors and light outlines.
      Chrome: title, headings, subtitles, notes and footer legend all in light ink tokens; no dark-on-dark text. Graticule lines subtle but visible.
      Data: same geometry; Tissot green identical to the light render; landmasses mid-grey with light outlines, borders light dotted. Brand green reads well on the dark surface.
      Legibility verdict: PASS
