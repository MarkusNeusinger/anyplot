review:
  strengths:
  - Sophisticated custom projection math (Mercator, Mollweide via Newton iteration,
    Orthographic) implemented correctly from spherical trigonometry, matching real-world
    distortion behavior
  - 'Effective data storytelling: identical Tissot indicatrices become visibly distorted
    differently in each panel (inflating near Mercator poles, elongating near Mollweide
    edges, compressing into ellipses toward the Orthographic limb), directly demonstrating
    each projection''s distortion character'
  - Creative, well-documented use of MUI X's useXScale/useYScale hooks plus ChartContainer
    as a coordinate-transform host for custom SVG geo paths, working around the community
    package's lack of a native geo/basemap primitive
  - 'Consistent theme handling: Imprint tokens used throughout, identical Tissot green
    (#009E73) and neutral land fill across both themes, only chrome flips'
  - Deterministic, fully in-memory data (hand-traced continent point lists, no fetch/network)
    satisfying reproducibility requirements
  weaknesses:
  - 'Vertical whitespace: each panel''s map fills only roughly 40-50% of its allocated
    vertical box, leaving large blank bands above and below the map within each panel
    — a side effect of fitting a ~2:1-aspect world map into a much taller-than-wide
    per-panel box while preserving equal-aspect scaling. Consider shrinking mapAreaH
    (e.g. reduce PANEL_HEADER_H or the outer vertical allotment) so the panel box
    aspect ratio sits closer to the projected map''s own aspect ratio, letting the
    maps fill more of their panels.'
  - Land masses are drawn as ~8 hand-traced continent silhouettes rather than the
    individual country boundaries / country-level choropleth data called out in the
    spec ('World country boundaries... ~200 countries', 'value (numeric, optional)
    for choropleth coloring', 'clean coastlines and country borders'). This is a reasonable,
    disclosed simplification given MUI X's lack of a geo primitive, but no per-country
    distinction or choropleth use case is demonstrated.
  - Smallest text (panel subtitle ~12.5px, caption ~13px in CSS space) is on the small
    side for mobile/thumbnail (~400px) legibility — consider nudging these up 1-2px.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, not pure white and not dark.
      Chrome: Centered title "map-projections · javascript · muix · anyplot.ai" in dark ink at the top; three panel headers ("Mercator", "Mollweide", "Orthographic") in bold dark text with a muted-gray subtitle line under each explaining the projection's distortion trade-off; a muted-gray caption at the bottom explaining the Tissot indicatrices. All text is clearly readable against the light background — no light-on-light issues.
      Data: Continents rendered as neutral muted-gray silhouettes with a subtle border in the same muted tone; a light graticule grid at 30-degree spacing; green (#009E73) semi-transparent Tissot indicatrix circles/ellipses overlaid at fixed lat/lon anchors — clearly the brand-green first-series color, consistent across all three panels.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, not pure black and not light.
      Chrome: Same title, panel headers, subtitles and caption, now rendered in light ink/inkSoft tones against the dark background — all clearly legible, no dark-on-dark failures observed.
      Data: Continent silhouettes, graticule, and Tissot circles use the identical colors and opacities as the light render (same muted gray land fill, same #009E73 green circles) — only the page/chrome flipped, confirming the palette-identity requirement.
      Legibility verdict: PASS
