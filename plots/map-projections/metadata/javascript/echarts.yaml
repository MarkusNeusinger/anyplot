    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and both panel subtitles switch to light ink and remain fully readable against the dark background — no dark-on-dark failures observed. Graticule lines are a lighter, still-subtle gray, visible against the dark panels. The ocean fill inside both panel borders is a slightly lighter dark gray than the page background, giving faint but sufficient panel definition.
      Data: Landmass color is identical #009E73 green to the light render — confirmed unchanged, only chrome (background, text, grid, ocean tint) flipped for the dark theme.
