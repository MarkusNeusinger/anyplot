    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "map-projections · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly readable. Two bold panel subtitles ("Mercator — conformal (shape-true, area-distorted)" and "Mollweide — equal-area (area-true, shape-distorted)") sit above each panel in dark ink, fully legible. Thin graticule lines (meridians/parallels every 30°) are subtle gray, visible without competing with the landmasses. The Mercator panel has a thin bordered square and the Mollweide panel a thin bordered ellipse, both filled with a barely-off-background "ocean" tint.
