review:
  strengths:
  - Genuinely custom implementation of orthographic-projection spherical trigonometry
    from scratch (correct horizon clip at cosC<=0.02, densified great-circle segments
    for a smooth limb) rather than relying on a plugin the runtime doesn't have.
  - Tissot indicatrices use the correct orthographic scale factors (h=cosC radially,
    k=1 tangentially), so the ellipses visibly elongate toward the limb -- a textbook-accurate
    demonstration of the spec's core teaching point about projection distortion.
  - Distinctive use of Chart.js's plugin API (afterDatasetsDraw) to draw custom canvas
    shapes on top of the chart, a technique that would look completely different in
    any other charting library.
  - 'Theme-adaptive chrome is clean: Imprint green (#009E73) is identical between
    light and dark renders, and background/ink/grid tokens flip correctly.'
  - Mandated title format is correct, with a well-chosen descriptive prefix ("Orthographic
    Projection"), and the square canvas orientation is the right call for a circular
    globe composition.
  weaknesses:
  - Significant real landmass that falls inside the visible hemisphere for this view
    (centered 20E/5N) is missing entirely -- e.g. the Arabian Peninsula and India
    are well within the ~90-degree horizon (angular distance ~roughly 50-60 degrees)
    but no coastline is drawn there, so a large swath of what should be land renders
    as empty background. Add at least a simplified Middle East/India/western-Asia
    outline (same densify+projectLine approach already used for AFRICA/EUROPE/SOUTH_AMERICA)
    so the visible hemisphere doesn't read as mostly ocean.
  - Landmasses are drawn as bare outlines with no fill, so land is only distinguishable
    from ocean by tracing the border -- the spec explicitly asks for 'a neutral color
    scheme for land masses when not showing data values'. Fill each continent polygon
    with a subtle neutral tone (e.g. t.muted at low alpha, or t.palette[0] at ~0.08-0.12
    alpha) so land vs. ocean is legible at a glance.
  - The plot shows only continent-level silhouettes with no country-level boundaries,
    while the spec's Data section frames the dataset as world country boundaries (~200
    countries, keyed by a `country` field) -- acceptable as a pragmatic simplification
    given Chart.js has no bundled GeoJSON/geo plugin, but worth at least a code comment
    noting the deliberate simplification so reviewers don't mistake it for an oversight.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (#FAF8F1), matches the required light-theme surface -- not pure white.
      Chrome: Title "Orthographic Projection · map-projections · javascript · chartjs · anyplot.ai" rendered in dark ink at the top, fully visible with no clipping. Graticule (meridian/parallel lines every 30 degrees) rendered as light gray lines against the cream background; equator rendered as a bold dashed dark line; globe horizon rendered as a solid dark circle outline. Simplified coastline outlines for Africa, Europe, and part of South America rendered as thicker dark-gray strokes.
      Data: Tissot indicatrix ellipses filled with translucent Imprint green (#009E73 at ~22% alpha) with a thin soft-ink stroke, positioned at 30-degree lat/lon grid intersections; ellipses near the globe's limb are visibly compressed/elongated radially, correctly showing orthographic distortion increasing away from the center.
      Legibility verdict: PASS -- title, graticule, coastlines, and Tissot ellipses are all clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black (#1A1A17), matches the required dark-theme surface -- not pure black.
      Chrome: Same title text now rendered in light ink (#F0EFE8-class token), fully visible with no clipping. Graticule lines rendered as subtle light-gray strokes on the dark background; equator dashed line rendered in light ink; globe horizon rendered as a solid light-colored circle outline. Coastline outlines rendered as lighter gray strokes, clearly distinguishable from the near-black background.
      Data: Tissot ellipses use the identical Imprint green fill and alpha as the light render -- data color is unchanged between themes, confirming only chrome flipped.
      Legibility verdict: PASS -- no dark-on-dark or light-on-light failures observed; all chrome elements (title, graticule, coastlines, horizon) are clearly visible against the near-black surface.
