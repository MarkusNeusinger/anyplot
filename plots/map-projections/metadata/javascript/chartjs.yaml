review:
  strengths:
  - Hand-rolled orthographic projection (spherical trig with horizon clipping) implemented
    via Chart.js custom plugins, working around the library's lack of a native geo/GeoJSON
    API
  - Tissot indicatrices convincingly show projection distortion — ellipses grow visibly
    more elongated and compressed radially toward the horizon edge, telling the core
    cartographic story at a glance
  - Theme-adaptive chrome and Imprint palette are correctly threaded through custom
    canvas drawing (land fill, Tissot ellipses) as well as the standard Chart.js options,
    and stay consistent between light and dark renders
  - Dashed equator, subtle low-alpha graticule, and a clean hidden-axis composition
    keep the globe uncluttered while remaining cartographically legible
  weaknesses:
  - Only continent-level silhouettes are modeled (Africa, Europe, Middle East/India,
    a South America sliver) rather than the ~200 individual country boundaries the
    specification's data model calls for — a real feature gap versus the spec, even
    though it's a documented consequence of Chart.js shipping no geo plugin
  - A few Tissot ellipses (e.g. over northern Africa / the Arabian peninsula) visually
    bisect the coastline outline beneath them, creating minor clutter where the ellipse
    edge crosses a coastline vertex
  - No caption or annotation explains what the green ellipses represent — a viewer
    unfamiliar with Tissot's indicatrix would see decorative circles rather than a
    distortion metric
  - The single orthographic view is a spec-sanctioned choice, but a small subtitle
    naming the projection's headline distortion trade-off (e.g. 'preserves angles
    near center, distorts area near the limb') would sharpen the storytelling further
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "Orthographic Projection · map-projections · javascript · chartjs · anyplot.ai" in bold dark ink at top-left, clearly readable. Globe outline, graticule (meridians/parallels every 30°), and dashed equator all render in dark/soft ink tones against the light background.
      Data: Land masses (Africa, Europe, Middle East/India, a sliver of South America at the left edge) fill in a soft neutral gray, distinguishing them from the white ocean. Tissot indicatrix ellipses render in the brand green (#009E73) at low alpha, larger and near-circular close to the view center (over Africa/the equator) and progressively thinner/more elongated toward the horizon edge, visually demonstrating orthographic distortion.
      Legibility verdict: PASS — all text and graphic elements are clearly readable against the light background.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title now in light/off-white ink, fully legible. Globe outline and graticule switch to light-toned strokes against the dark background; the equator dash is now white.
      Data: Land masses fill in a slightly lighter dark gray than the ocean background, keeping the same distinguishable contrast as the light render. Tissot ellipses remain the identical brand green (#009E73) as in the light render — only the chrome (background, text, grid, land-fill tone) flips; the data-color identity is preserved.
      Legibility verdict: PASS — no dark-on-dark or light-on-light failures observed; title, graticule, and coastlines are all clearly visible.
