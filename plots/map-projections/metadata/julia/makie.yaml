review:
  strengths:
  - Four projection families (conformal Mercator, equal-area Mollweide and Equal Earth,
    perspective Orthographic) implemented with correct formulas, including the Mollweide
    Newton solve and the Equal Earth polynomial coefficients
  - Land is set apart from sea with a neutral tint derived from INK_SOFT and the page
    color, readable in both themes
  - Graticule in faint INK_SOFT sits clearly below the coastlines and lets the green
    Tissot indicatrices read as the primary layer
  - Tissot indicatrices on a regular 60 x 30 degree grid visibly grow toward the poles
    on Mercator and shear but keep area on Mollweide and Equal Earth
  - Each map framed by its own projection outline (rectangle, ellipse, Equal Earth
    boundary) and titled with its projection and property
  - Theme tokens threaded through all chrome; no dark-on-dark or light-on-light failures
  weaknesses:
  - 'SC-03 (both): the Mercator and Orthographic panels are drawn with unequal x/y
    scales — the Mercator data box (about 6.7 x 6.8 units) is squashed into a 2:1
    panel and the orthographic disk renders as a 2:1 ellipse, so equatorial Mercator
    Tissot circles appear as flat ellipses although a conformal projection keeps them
    circular (C4) → equal data units on both axes (aspect 1:1). Likely cause: the
    Axis has no aspect = DataAspect() while xlims!/ylims! fix unequal ranges.'
  - 'SC-03 (both): polygon artifacts draw land the data does not contain — dropping
    back-hemisphere vertices in the orthographic panel closes North America and Eurasia
    with long chords across the globe (top left and right edge), the Antarctica closure
    points at -89.9 deg are clamped to -85 deg in Mercator and fill a diagonal wedge,
    and the Australia ring retraces its south coast, leaving a thin spike west of
    the continent → clip polygons at the horizon instead of dropping vertices, close
    Antarctica along the bottom edge, and remove the duplicated Australia vertices.
    Likely cause: draw_continents! filtering NaN points, the (90,-89.9),(0,-89.9),(-90,-89.9)
    closure, and the repeated tail of the Australia polygon.'
  - 'SC-02 (both): only seven continent outlines are drawn, no country borders, although
    the Notes and C1 ask for coastlines and country borders → draw country borders
    inside the land masses. Likely cause: CONTINENT_POLYS holds continent rings only.'
  - 'DQ-01 (both): the world data omits major landmasses — British Isles, Japan, Madagascar,
    Indonesia, New Zealand, the Arctic archipelago — so a world map shows an incomplete
    world → add these polygons to the world data. Likely cause: CONTINENT_POLYS is
    limited to seven hand-typed rings.'
  - 'CQ-01 (code): eleven helper functions (draw_lines_nan!, draw_continents!, draw_graticule!,
    draw_tissot!, boundary_* and others) replace the flat Data → Plot → Save structure
    → keep the projection math and inline the drawing loops. Likely cause: helper-function
    structure.'
  - 'CQ-04 (code): draw_lines_nan! (lines 134-149) splits lines at NaN by hand, which
    lines! already does natively → call lines!(ax, xs, ys) on the NaN-containing arrays
    directly. Likely cause: hand-rolled segment splitting.'
  - 'Suggestion: a small caption under the Tissot layer explaining that equal-area
    panels keep ellipse area while Mercator keeps them round would help readers new
    to indicatrices.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 page; inside each projection outline a slightly brighter elevated fill (#FFFDF6) marks the ocean.
      Chrome: main title "map-projections · julia · makie · anyplot.ai" in dark ink at top center; four bold panel titles ("Mercator — Conformal", "Mollweide — Equal-Area", "Orthographic — Perspective", "Equal Earth — Equal-Area"), all dark and readable. No axes or ticks. Projection outlines in dark grey.
      Data: 2x2 grid. Continents in a warm grey land tint with thin grey coastlines, clearly set apart from the ocean; faint grey graticule every 30 degrees, curved in Mollweide/Equal Earth/Orthographic. #009E73 Tissot ellipses (translucent fill, solid stroke) on a regular grid, growing toward the poles in Mercator and shearing at high latitudes in the equal-area maps. The Mercator panel is squashed vertically (equatorial Tissot circles appear as flat ellipses) and the orthographic disk is drawn as a 2:1 ellipse. Orthographic shows chord artifacts (strips of North America/Eurasia along the top-left and right rim); Mercator Antarctica is a sawtooth band closing in a diagonal wedge; a thin spike sits west of Australia. Only continent outlines, no country borders; British Isles, Japan, Madagascar, Indonesia, New Zealand missing.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 page; ocean inside the outlines in #242420.
      Chrome: main and panel titles in light ink, clearly readable; projection outlines in light grey. No dark-on-dark text.
      Data: same layout; land tint is a mid grey clearly brighter than the ocean; graticule faint light grey; Tissot ellipses in the same #009E73 as the light render (only chrome flipped). Same aspect and polygon artifacts as in the light render.
      Legibility verdict: PASS
