review:
  strengths:
  - All three MACD components (line, signal, histogram) present with a zero reference
    line, and standard parameters (12, 26, 9) are surfaced directly in the legend
    labels
  - 'Correct semantic color use: histogram bars map Positive/Negative to the finance-convention
    green/red (#009E73 / #AE3030) per the style guide''s semantic-exception rule,
    while MACD/Signal lines use distinct blue/ochre (#4467A3 / #BD8233)'
  - 'Theme-adaptive chrome correctly threaded through: both renders use the right
    warm off-white/near-black backgrounds, ink tokens for text, and identical data
    colors across themes'
  - Clean L-shaped spine treatment (top/right removed), Y-axis-only grid, and a single
    merged top legend combining the line and fill scales without redundant boxes
  - Canvas gate passed (3200x1800 landscape), correct ggsave/ragg device usage, set.seed(42)
    for reproducibility
  weaknesses:
  - 'library(dplyr) is imported but never used in the script (no dplyr:: calls or
    pipes) — drop the unused import'
  - panel.grid.major.y uses the full-strength INK token rather than a faint/alpha-reduced
    tone, so the horizontal gridlines read a bit more prominent than the style guide's
    '15-25% opacity, very subtle' guidance
  - The explicit zero-reference geom_hline is barely distinguishable from the regular
    y=0 gridline underneath it — consider a slightly heavier or differently-styled
    zero line so crossover signals pop more
  - 'Design excellence is solid but not distinctive: no annotation or emphasis calls
    out a specific bullish/bearish crossover, so the ''signal moment'' the indicator
    exists for isn''t visually highlighted'
