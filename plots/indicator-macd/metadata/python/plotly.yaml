review:
  strengths:
  - 'Histogram follows the spec''s green/red sign semantics with Imprint #009E73 and
    #AE3030, identical across themes'
  - Zero reference line drawn with add_hline(layer='above') so it stays visible over
    the bars in both themes
  - MACD, signal and histogram computed from real 12/26/9 EMAs via pandas ewm, with
    the warm-up rows dropped
  - 'Parameters stated twice: in the legend labels and in a quiet paper-anchored annotation'
  - Theme tokens threaded through title, axes, ticks, legend box and annotation; readable
    in both renders
  - Hover and zoom in the HTML output let a reader inspect each day's values
  weaknesses:
  - 'VQ-03 (both): the Histogram legend swatch is drawn only in red #AE3030 although
    most bars are green, so the legend explains just the negative bars → a swatch
    that shows both signs, e.g. two legend-only bar traces ''Histogram > 0'' (#009E73)
    and ''Histogram < 0'' (#AE3030) with the real bar trace''s showlegend=False. Likely
    cause: plotly takes the legend glyph from the first element of the marker.color
    array, and the first bar is negative.'
  - 'Suggestion: a price panel above the MACD panel (make_subplots with shared_xaxes)
    would show what the oscillator reacts to, as the Notes allow.'
