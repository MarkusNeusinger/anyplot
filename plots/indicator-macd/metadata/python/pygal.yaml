review:
  strengths:
  - 'Imprint palette applied semantically: green #009E73 for positive and red #AE3030
    for negative histogram, blue and ochre for the two lines, identical in both themes'
  - Theme tokens threaded through pygal Style (background, plot_background, foreground)
    so chrome flips correctly
  - MACD computed from a price series with pandas ewm(12/26/9), warm-up periods dropped,
    parameters named in the legend
  - Font sizes follow the pygal canvas guidance; landscape 3200x1800 canvas
  - pygal HTML export keeps native hover tooltips for the detail view
  weaknesses:
  - 'VQ-03 (both): the MACD and signal lines render about 2-3 px wide on the 3200
    px canvas, thin against the filled histogram, and the blue #4467A3 MACD line reads
    faint on the dark page → primary lines clearly heavier (about 6-8 px). Likely
    cause: the per-series stroke_style width=8 is not reaching the rendered paths;
    set Style stroke_width or check the series config.'
  - 'SC-02 (both): the histogram is drawn as two filled line areas, a continuous silhouette,
    instead of bars from zero per period as C2 asks → one bar per period from zero
    to the histogram value. Likely cause: hist series added to pygal.Line with fill=True
    instead of a bar layer.'
  - 'VQ-01 (both): the ''0'' y tick is drawn at the major-label size 44, visibly smaller
    than the other y ticks at 56 → same size as the other ticks. Likely cause: major_label_font_size=44
    applies to the zero tick.'
  - 'Suggestion: drop the ''Zero'' legend entry; the dashed baseline needs no legend
    key.'
