review:
  strengths:
  - 'All spec Notes met: green/red histogram bars that change sign exactly at the
    MACD/signal crossings, a dashed zero reference line visible in both themes, distinct
    blue and ochre lines, and the 12/26/9 parameters noted in a subtitle'
  - 'MACD values are computed, not placed: pandas ewm(12) - ewm(26), signal ewm(9),
    with a 35-day warmup dropped so every plotted value is filled'
  - 'Clean theme adaptation: Imprint data colors identical in both renders while background,
    text, grid and legend frames flip via the PAGE_BG/INK/INK_SOFT/ELEVATED_BG tokens'
  - Text sized at the style-guide reference (16/12/10 px at scale 4) on the canonical
    3200x1800 canvas
  weaknesses:
  - 'SC-03 (both): the x axis maps an integer ''Trading Day'' index 0–119 instead
    of the spec''s date column, so the reader cannot tell when any crossover happened
    → map x to the DATE column on a date scale (scale_x_datetime). Likely cause: df[''day'']
    = np.arange(len(df)) used as x in both geom_bar and geom_line.'
  - 'DE-02 (both): all four spines frame the panel, where nothing in a MACD chart
    requires an enclosed box → left and bottom axis lines only (L-shaped), or none.
    Likely cause: the panel border kept from the theme; set panel_border=element_blank()
    and keep axis_line for the left and bottom axes.'
  - 'CQ-04 (code): the mappings use typed column names (''day'', ''direction'', ''line'',
    ''value'') while the library prompt requires the column constants, and the DATE
    constant is defined but never mapped → name the derived columns with constants
    and map them through those. Likely cause: the derived columns added in lines 53–56
    without constants.'
  - 'Suggestion: a price panel above the MACD panel, sharing the date axis, would
    give the oscillator its usual context (the Notes allow it).'
