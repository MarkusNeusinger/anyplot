review:
  strengths:
  - 'Histogram bars follow the spec exactly: Imprint green #009E73 above zero, Imprint
    red #AE3030 below, changing sign where the MACD and signal lines cross, identical
    in both themes'
  - The parameters are noted where the reader needs them, in the legend labels 'MACD
    (12, 26)' and 'Signal (9)', computed from the FAST_SPAN/SLOW_SPAN/SIGNAL_SPAN
    constants
  - MACD, signal and histogram are computed with pandas ewm(adjust=False) and the
    warm-up rows are dropped, so the lines start only once the averages are filled
  - 'Theme tokens threaded through sns.set_theme rc: correct #FAF8F1 / #1A1A17 surfaces,
    readable ink, subtle y-grid and a visible INK_SOFT dashed zero line in both renders'
  - Exact 3200x1800 canvas (figsize 8x4.5 at dpi 400, no bbox_inches='tight') with
    style-guide font sizes (12/10/8 pt)
  weaknesses:
  - 'Suggestion: the ConciseDateFormatter leaves the first tick as a bare ''15'' and
    the offset reads ''2024-Jun'', so February is never named; a locator that labels
    each month start would make the date range obvious.'
  - 'Suggestion: sns.barplot cannot place bars on a datetime axis, so the histogram
    stays on ax.bar; a seaborn-native touch elsewhere (for example sns.set_context
    for the text scale) would show more of the library.'
  image_description: |-
