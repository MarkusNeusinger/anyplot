review:
  strengths:
  - Histogram, both lines and the zero line composed as separate layers with their
    own data frames, the grammar-of-graphics way
  - scale_x_datetime with monthly breaks and '%b %Y' labels reads more cleanly than
    default ISO dates
  - Parameters 12, 26 and 9 are carried in the legend labels, so the chart notes them
    without an extra annotation
  - Theme tokens threaded through every chrome element; both renders are fully readable
  - EMAs, signal and histogram computed with pandas ewm from a seeded price series
  weaknesses:
  - 'VQ-02 (both): the legend entry ''MACD (12, 26)'' runs up to and touches the legend
    frame''s right edge, its closing parenthesis on the border → keep at least ~4
    px of padding inside the frame. Likely cause: legend_position=(0.02, 0.97) with
    default legend box margin; set legend_box_margin / legend_margin or a slightly
    smaller legend_text.'
  - 'Suggestion: a price panel above the MACD panel sharing the date axis would place
    the oscillator in its usual context.'
