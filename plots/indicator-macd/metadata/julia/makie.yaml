review:
  strengths:
  - 'All three MACD elements are present and clearly rendered: MACD line, signal line,
    and green/red histogram, plus a dashed zero reference line for spotting crossovers'
  - Standard parameters (12, 26, 9) are explicitly noted right in the legend labels
    ('MACD (12, 26)', 'Signal (9)'), satisfying the spec's requirement elegantly without
    cluttering the title
  - Theme-adaptive chrome is correctly implemented — both renders pass the light/dark
    legibility check, with identical data colors and only chrome (background, ink,
    grid) flipping
  - 'Clean visual refinement: top/right spines hidden, subtle horizontal-only gridlines,
    frameless legend'
  - Reproducible synthetic data (seeded at 42) with a plausible cumulative price walk
    + sinusoidal trend that exercises multiple full positive/negative MACD cycles,
    giving the chart real pattern variety
  weaknesses:
  - 'MACD_COLOR and GAIN_COLOR are both #009E73 (identical brand green) — the MACD
    line and the positive histogram bars share the exact same hue, which hurts distinguishability
    where the line runs directly along the tops of the green bars (e.g. trading days
    ~60-80 and ~115-120). The spec itself suggests ''distinct colors (e.g., blue and
    orange)'' for the MACD/signal lines precisely to avoid this. Recommend changing
    MACD_COLOR to the Imprint blue (#4467A3, palette position 3) so the line reads
    independently from the green/red gain/loss histogram semantic, while keeping the
    signal line lavender.'
  - X-axis uses a plain 1:120 'Trading Day' integer index rather than the spec's `date`
    (datetime) field — consider generating an actual date range (e.g. via a formatted
    date string on a subset of ticks) so the axis maps more literally to the spec's
    data schema. Minor, optional polish.
  - Library Mastery is generic (LM-02) — only basic barplot!/lines!/hlines! primitives
    are used; no Makie-distinctive feature (e.g. band! for a shaded MACD-signal spread,
    or a custom tick formatter) is demonstrated.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "indicator-macd · julia · makie · anyplot.ai" is bold dark text, clearly visible top-center. "Trading Day" (x-axis) and "MACD Value" (y-axis) labels are dark ink, clearly legible. Tick labels are a slightly softer dark gray, clearly legible against the light background. A frameless legend at top-left lists "MACD (12, 26)" in green and "Signal (9)" in lavender. Horizontal gridlines are subtle light gray, visible but not dominant. Top/right spines are hidden; left/bottom spines are a soft gray.
      Data: First series (MACD line) is brand green #009E73, second series (signal line) is lavender #C475FD — both clearly distinguishable from each other and from the background. The histogram is rendered as green (positive) / red (negative) bars around a dashed zero reference line, correctly encoding financial gain/loss semantics. All data elements are visually separable from the light surface.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels ("Trading Day", "MACD Value") render in near-white ink, clearly legible against the dark background. Tick labels are a lighter soft-gray tone, clearly legible — no dark-on-dark issue found. Legend text is near-white and readable. Gridlines are subtle and still visible without dominating. Spines match the same soft-gray treatment as the light render, appropriately dimmed for dark mode.
      Data: MACD line (#009E73 green) and signal line (#C475FD lavender) are pixel-identical to the light render — only the chrome (background/ink/grid) flipped, as required. Histogram green/red bars are unchanged from the light version and remain clearly visible against the dark surface.
      Legibility verdict: PASS

    Cross-theme note: Data colors confirmed identical between renders; only chrome tokens differ, per the theme-adaptive chrome contract. One recurring visual concern across BOTH renders (not a theme bug): the MACD line and the histogram's positive bars share the identical green hue (#009E73 used for both MACD_COLOR and GAIN_COLOR), which reduces separability where the line traces along the top of tall green bar clusters — see weaknesses for the fix recommendation.
