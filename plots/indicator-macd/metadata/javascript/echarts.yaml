review:
  strengths:
  - All three required MACD components (MACD line, signal line, histogram) are present
    with a dashed zero-reference line, directly supporting the spec's crossover/momentum-signal
    use case.
  - Uses semantically correct trading colors (green/red histogram polarity, blue/orange
    MACD/signal lines) drawn from Imprint tokens, matching the spec's explicit color
    guidance.
  - Standard 12/26/9 parameters are called out in the subtitle, deterministic seeded
    data generation, and theme-adaptive chrome (title/axis/tick colors) correctly
    threaded through both renders.
  - Canvas dimensions and mount-node contract (animation disabled, no explicit width/height
    on init) are correct.
  weaknesses:
  - 'The "Histogram" legend swatch is colored with the ink token (black in light theme,
    near-white in dark theme) instead of either of the two colors actually used for
    the bars (green/red) — the legend icon fails to represent what''s plotted. Fix:
    drop the itemStyle override on the legend entry, or set it to one of the semantic
    bar colors.'
  - Library mastery is fairly generic beyond the single markLine — no distinctive
    ECharts features (e.g., visualMap, custom tooltip formatting, emphasis/highlight
    states) that would differentiate this from a minimal reference implementation.
  - Design polish is functional but plain — appropriate for a technical-indicator
    chart, but there's room to visually emphasize crossover points or shade divergence
    zones to strengthen the storytelling further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Centered bold title "indicator-macd · javascript · echarts · anyplot.ai" with subtitle noting 12/26/9 parameters and "MSFT daily close" context; legend (MACD, Signal, Histogram) below title; dark ink text throughout; rotated x-axis date labels; y-axis labeled "MACD value". All text clearly readable against the light background.
      Data: MACD line in blue (palette[2]), Signal line in orange (palette[3]), Histogram bars in green (positive, palette[0]) / red (negative, palette[4]), dashed zero-reference line. First categorical series is not the brand green because the spec explicitly requests conventional trading colors (green/red polarity, blue/orange lines) — a semantic-exception case.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Same layout as light render; title/subtitle/legend/axis text flip to light-colored ink and remain fully legible. No dark-on-dark issues detected.
      Data: MACD (blue), Signal (orange), Histogram (green/red) colors are pixel-identical to the light render — only chrome adapted. One inconsistency observed in both renders: the "Histogram" legend swatch uses the ink token (black in light, near-white in dark) rather than a data color, so it doesn't visually match the plotted green/red bars.
      Legibility verdict: PASS
