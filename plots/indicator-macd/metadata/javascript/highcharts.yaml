review:
  strengths:
  - 'Correct MACD structure: histogram (green/red), MACD line, signal line, and a
    dashed zero reference line are all present and clearly distinguishable in both
    themes.'
  - Semantic green/red histogram coloring for bullish/bearish momentum directly satisfies
    the spec's explicit request and reads intuitively without relying on hue alone
    (position above/below zero reinforces the signal).
  - Subtitle '12/26/9 EMA parameters' cleanly satisfies the spec's requirement to
    note the standard parameters on the chart.
  - 'Deterministic seeded data (LCG + EMA-derived MACD/signal) produces realistic
    multi-cycle price momentum: a strong bull run, a deep bear run, small oscillations,
    and several line crossovers — good coverage of the indicator''s behavior space.'
  - 'Theme-adaptive chrome correctly implemented: both renders pass the light/dark
    legibility check, backgrounds match #FAF8F1/#1A1A17, and data colors (green histogram,
    blue MACD line, ochre signal line) are identical across themes.'
  - 'Idiomatic Highcharts config: plotLines for the zero line, negativeColor for conditional
    bar coloring, tight pointPadding/groupPadding for a near-continuous histogram
    look, animation disabled on chart and series.'
  weaknesses:
  - 'Design Excellence is only modestly above a well-configured library default (DE-01):
    the visual treatment relies mostly on required tokens (Imprint palette, theme
    chrome) plus a subtitle, zero line, and negativeColor bars — consider a more distinctive
    touch (e.g. a subtle shaded band over the deepest bearish stretch, or emphasis
    on the most recent crossover) to lift it toward publication quality.'
  - No visual callout marks a specific bullish/bearish crossover even though the spec
    calls out crossovers as the key trading signal (DE-03) — a small marker or label
    at one clear MACD/signal crossover would strengthen the storytelling without adding
    clutter.
  - negativeColor-based bar coloring (LM-02) is a fairly common cross-library pattern
    (Chart.js/D3 can replicate it with a per-point color callback) rather than something
    distinctive to Highcharts — leveraging a more Highcharts-specific mechanism (e.g.
    zones, or a dataLabels formatter on the latest point) would raise Library Mastery.
  - MACD line and signal line use blue/ochre (Imprint positions 3-4), skipping position
    2 (lavender) in the canonical order — the semantic override (green/red for the
    histogram) justifies deviating from strict ordinal order, but note this explicitly
    next time so reviewers don't read it as an accidental skip.
