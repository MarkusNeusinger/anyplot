review:
  strengths:
  - 'Idiomatic Chart.js mixed-chart composition: one bar dataset (histogram) plus
    three line datasets (zero reference, MACD, signal) sharing a single canvas/scale
    — exactly the library''s combo-chart strength.'
  - 'Semantic color mapping follows the Imprint palette''s finance exception correctly:
    histogram uses palette[0] #009E73 for positive bars and the palette[4] semantic-red
    anchor #AE3030 for negative bars, while MACD/signal use palette[2] blue and palette[3]
    ochre — canonical order preserved, not cherry-picked.'
  - Standard MACD parameters (12, 26, 9) are surfaced twice — in the subtitle and
    in the legend labels ('MACD (12, 26)', 'Signal (9)') — satisfying the spec's 'should
    be noted in the chart' requirement without cluttering the plot.
  - Deterministic reproducibility via a small fixed-seed LCG (seed=42) plus a real
    EMA computation chain (emaFast/emaSlow/macdLine/signalLine/histogram) instead
    of hard-coded arrays.
  - 'Both renders are fully theme-correct: warm off-white/near-black backgrounds,
    all text readable, and the four data colors are pixel-identical between light
    and dark — only chrome flips as required.'
  - 'Data shows genuine feature coverage for the indicator: multiple bullish and bearish
    crossovers of varying magnitude (small chop near 4/20-4/30 and 6/1-6/9, and strong
    trends early March and mid-April/late-June), not a single repeated pattern.'
  weaknesses:
  - 'The mandatory zero reference line (''Include a zero reference line to highlight
    crossover signals'') is styled with borderColor: t.grid — the exact same faint
    token used for the horizontal gridlines — so it is nearly indistinguishable from
    the ambient grid rather than a distinct crossover cue. Give it a slightly stronger
    token (e.g. t.inkSoft) or thicker dash so it reads as an intentional reference
    line, not background noise.'
  - Design Excellence is competent but stops at 'clean and correct' — there is no
    visual emphasis on any specific crossover moment (e.g. no marker/annotation on
    the biggest bullish crossover in mid-March or the sharpest bearish reversal in
    late April) to guide the viewer to the chart's key insight, so it reads as data
    display rather than data storytelling.
  - Y-axis title 'MACD Value' is descriptive but omits a unit qualifier (e.g. 'MACD
    Value ($)') even though the value is a price-difference quantity derived from
    the underlying close price — a minor VQ-06 gap.
  - 'Library Mastery is generic beyond the base mixed-chart pattern: no distinctly
    Chart.js-only feature (e.g. a custom tooltip callback surfacing the three component
    values together, or the annotation plugin marking a crossover) is used to push
    past ''correct usage'' into ''showcases the library''.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "indicator-macd · javascript · chartjs · anyplot.ai" in dark ink, ~65% of plot width, clearly legible. Italic grey subtitle "12-day / 26-day EMA convergence-divergence, 9-day signal EMA" beneath it. Legend row (Histogram / MACD (12, 26) / Signal (9)) in dark text with colored point swatches. X-axis "Trading Date" and Y-axis "MACD Value" titles in dark ink; tick labels in a softer grey. Horizontal gridlines are subtle. All text is clearly readable against the light background — no light-on-light issues.
      Data: Histogram bars alternate #009E73 green (positive) and matte red (negative); MACD line is blue, Signal line is ochre — matches the mandated Imprint palette assignment (palette[0], palette[4], palette[2], palette[3]).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, subtitle, legend, and axis titles now rendered in light/off-white and soft-grey tones; all clearly visible against the dark background. No dark-on-dark failures observed — tick labels, axis titles, and legend text are all light-colored and legible.
      Data: Histogram green/red, MACD blue, and Signal ochre are pixel-identical to the light render — only the chrome (background, text, gridlines) flipped, as required.
      Legibility verdict: PASS

    Both renders pass the theme-readability checklist; no dark-on-dark or light-on-light failures found. The zero reference line (dashed, grid-colored) is present in the code but visually very faint in both renders — flagged as a weakness, not a legibility failure, since bar polarity already carries the crossover signal redundantly.
