review:
  strengths:
  - 'Careful, spec-aware palette usage: gain/loss histogram correctly uses the documented
    finance semantic exception (green/matte-red), while MACD/signal lines use blue/ochre
    honoring the spec''s "blue and orange" suggestion'
  - Data colors are pixel-identical between light and dark renders; only chrome adapts
  - Clean, deterministic data generation (fixed-seed LCG) producing a realistic, multi-cycle
    MACD pattern that exercises both bullish and bearish histogram states
  - Dynamically spaced legend computed via getBBox() rather than hard-coded offsets
  weaknesses:
  - 'Design Excellence is only "solid," not distinctive: no annotation/callout marking
    a specific MACD/signal crossover to actively guide the reader''s eye, and the
    axis domain lines/zero line use fairly plain default treatment'
  - No especially distinctive D3-only technique beyond standard scale/axis/line idioms
