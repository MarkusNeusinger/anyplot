review:
  strengths:
  - 'Correct Imprint palette usage: MACD line uses brand green #009E73 (always-first
    rule), Signal line uses canonical position 2 (#C475FD lavender), and the histogram''s
    green/red bullish-bearish split is a well-justified semantic exception (finance
    profit/loss) explicitly endorsed by the style guide.'
  - Both themes render pixel-identical data colors with fully theme-adaptive chrome
    (title, axis labels, tick labels, grid, zero-reference line) — no dark-on-dark
    or light-on-light legibility failures found in either render.
  - 'Idiomatic and distinctive MUI X composition: a dedicated ''value-hist'' y-axis
    carries a piecewise colorMap to conditionally color histogram bars by sign, while
    sharing the same numeric domain as the ''value'' axis so bars and lines stay visually
    comparable.'
  - All spec data fields (date, macd, signal, histogram) are present; the synthetic
    120-day dataset shows a full uptrend-to-downtrend-to-uptrend cycle with clear
    bullish and bearish histogram regions and a visible dashed zero-crossing reference
    line.
  - Deterministic, self-contained data generation via a fixed-seed LCG — no network
    fetch, reproducible across renders.
  weaknesses:
  - Standard MACD parameters (12, 26, 9) only surface via the interactive tooltip's
    series labels ('MACD (12, 26)', 'Signal (9)') — the static legend below the chart
    just reads 'MACD Line' / 'Signal Line' with no parameter values, so the spec's
    'standard parameters ... should be noted in the chart' isn't visible in the PNG.
    Add '(12, 26)' / '(9)' to the visible legend text or a small title/subtitle annotation.
  - Y-axis label 'MACD Value' has no unit even though MACD is derived from the underlying
    closing price (same unit) — consider 'MACD Value ($)' or similar for full VQ-06
    credit.
  - Histogram bullish/bearish bars rely on green/red hue with only bar position (above/below
    zero) as redundant encoding — for stronger CVD safety, consider a subtle edge
    stroke or slightly higher contrast between the two hues near the zero line where
    bars are shortest.
  - MACD and Signal line strokeWidth is left at the LinePlot default rather than explicitly
    set — with only two lines on the chart, bumping stroke width to ~2.5-3 CSS px
    would give them more visual prominence.
  - Design excellence is solid but still reads as a well-configured MUI X default
    beyond the palette choice — consider removing the visible axis line entirely or
    adding a subtle callout on the most recent crossover to push past 'good' into
    genuinely distinctive design.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "indicator-macd · javascript · muix · anyplot.ai" centered at top, clearly readable. "MACD Value" y-axis label and "Trading Date" x-axis label in dark ink, both legible. Tick labels (dates on x, numeric values -3.5 to 4.0 on y) rendered in a soft gray, subtle but readable. Horizontal grid lines are faint and don't compete with the data. A dashed black zero-reference line runs across the plot to mark the MACD/signal crossover baseline.
      Data: MACD line in brand green (#009E73), Signal line in lavender/purple (#C475FD) — both clearly distinguishable from each other and from the background. Histogram bars flip between green (above zero, bullish) and matte red (below zero, bearish), tracking the sign of the MACD-minus-signal difference. A bottom legend row (MACD Line / Signal Line / Histogram bullish / Histogram bearish) matches the plotted colors exactly.
      Legibility verdict: PASS — all text is dark-on-light and clearly readable; no light-on-light issues found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Title, axis labels, and tick labels have all flipped to light/off-white text, clearly visible against the dark background. Grid lines are faint light gray, still subtle. The zero-reference dashed line has flipped to a light/white dash, remaining visible against the dark plot area.
      Data: MACD line, Signal line, and histogram bar colors are pixel-identical to the light render (green #009E73, lavender #C475FD, green/red histogram split) — only the chrome (background, text, grid, reference line) changed as expected.
      Legibility verdict: PASS — no dark-on-dark failures found; every title/label/tick is clearly legible against the near-black surface.
