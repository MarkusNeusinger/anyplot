review:
  strengths:
  - Histogram coloring by sign uses MUI X's piecewise colorMap with threshold 0 on
    a hidden second y axis, so bars turn green/red natively while the MACD and signal
    lines keep their own colors
  - 'Imprint semantic green #009E73 / red #AE3030 for bullish/bearish bars, Imprint
    purple and blue for MACD and signal; data colors identical in both themes, all
    chrome theme-adaptive'
  - Parameters (12, 26, 9) are noted in the subtitle and the legend labels, and the
    subtitle's crossover count is computed from the histogram sign changes
  - Signed monospace tick labels (+0.5 / -0.5) and a dashed zero line make the oscillator's
    sign easy to read
  - EMA computation is correct (k = 2/(n+1)) and seeded, and the histogram changes
    sign exactly where the lines cross
  weaknesses:
  - 'Suggestion: replace the hand-built HTML legend with the native ChartsLegend inside
    ChartsDataProvider/ChartsWrapper as the library prompt describes, for example
    by splitting the histogram into positive and negative bar series so each sign
    gets a native legend entry.'
  - 'Suggestion: the ''Latest crossover'' reference line is an annotation the spec
    does not request; dropping it keeps the panel focused on the three required components.'
  - 'Suggestion: an optional price panel above the MACD panel, as the Notes allow,
    would show what the oscillator lags.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold dark title "indicator-macd · javascript · muix · anyplot.ai" top-left, grey monospace subtitle "MACD (12, 26, 9) over 120 periods (Jan 2 to Jun 18, close $147.7 → $154.7) · 3 signal crossovers"; y-axis "MACD value ($)" with signed mono ticks -3.0 … +3.5; x-axis "Trading date" with ticks Jan 2 … Jun 5 every 10 trading days; subtle horizontal grid; dashed dark zero line; dotted vertical "Latest crossover (May 20)" marker; bottom HTML legend with four entries. All text readable.
      Data: histogram bars green #009E73 above zero and matte red #AE3030 below, changing sign where the lines cross (mid Jan, early Mar, May 20); MACD line purple #C475FD, signal line blue #4467A3, both continuous. MACD rises to ~+3.4 late Feb, falls to ~-2.6 mid May, recovers to ~+0.4.
