review:
  strengths:
  - 'Faithful stem-plot construction: geom_hline baseline + geom_segment stems + geom_point
    markers exactly matches the spec''s structural notes (thin stems from y=0, clearly
    visible circular markers, consistent sizing throughout).'
  - Data is a realistic damped, decaying oscillator (exp(-0.09n)*cos(0.55n) + noise)
    — the canonical signal-processing example explicitly named in the spec's Applications
    section, with plausible amplitude scale.
  - 'Theme handling is correct: the brand-green data color (#009E73) is identical
    between light and dark renders, and all chrome (title, axis text, gridlines, marker
    stroke) flips via INK/INK_SOFT/PAGE_BG tokens with no dark-on-dark or light-on-light
    failures.'
  - Canvas matches the landscape target exactly (8x4.5in @ 400dpi = 3200x1800), and
    the title follows the exact mandated format with the legend correctly omitted
    for a single series.
  weaknesses:
  - Major gridlines (panel.grid.major.y) are drawn in full-strength INK color instead
    of a faded/reduced-opacity tone, so the horizontal grid reads nearly as bold as
    the axis text/baseline in both renders — the style guide calls for grid at ~15-25%
    opacity (rgba(26,26,23,0.15) light / rgba(240,239,232,0.15) dark). Fade the grid
    line color toward the page background (or blend INK with PAGE_BG) so it recedes
    behind the data.
  - '`library(dplyr)` is imported but never used anywhere in the script (no dplyr
    verbs or %>% pipes) — remove the unused import.'
  - Stem linewidth is 0.9 for a sparse series (40 points, well under the <50-point
    'thicker lines' density guidance) — could go slightly thicker (~1.1-1.3) for a
    touch more prominence relative to the markers.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "stem-basic · r · ggplot2 · anyplot.ai" top-left, clearly readable. "Sample index n" x-axis label and "Amplitude" y-axis label (rotated) in dark ink, both legible. Tick labels (0/5/10/.../35 on x; -0.5/0.0/0.5/1.0 on y) in a softer grey, still readable. Horizontal gridlines at each major y-tick are solid and fairly dark — more prominent than the "subtle" style-guide target, though not to the point of illegibility.
      Data: 40 stems in brand green (#009E73) — thin vertical segments from a y=0 baseline to circular markers with a light cream stroke. Damped oscillation clearly visible: large stems near n=0-8 tapering to near-zero by n=35+. No overlapping text or clipped elements.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title and axis labels render in light off-white ink, clearly visible against the dark background. Tick labels in a lighter grey, readable. Gridlines flip to a light tone at similar (still somewhat bold) weight as the light render — no dark-on-dark failures anywhere.
      Data: Same 40 green (#009E73) stems and markers as the light render, confirmed pixel-identical in hue/pattern — only chrome (background, text, grid, marker stroke color) changed between themes. Marker stroke flips from cream to a dark ink tone appropriate for the dark surface.
      Legibility verdict: PASS
