review:
  strengths:
  - Idiomatic stem-plot construction via geom_segment (stems) + geom_point (markers)
    + geom_hline (baseline) — the correct grammar-of-graphics approach since plotnine
    has no native stem geom.
  - Decay-envelope reference curve (dashed, INK_SOFT, alpha=0.5) adds real data storytelling
    value by making the amplitude decay visually explicit, without competing with
    the brand-green data series.
  - 'Both renders are fully theme-correct: warm off-white / near-black backgrounds,
    correct ink tokens for text, identical brand-green (#009E73) data color in both
    themes.'
  - Consistent marker size (3.0) and stem width (1.0) across all 30 points, appropriately
    prominent for a sparse dataset.
  - Clean single-series color use — correct Imprint palette position 1 (#009E73),
    no unused imports, no fake interactivity, deterministic data generation.
  weaknesses:
  - 'Title omits the mandated language token: renders as ''stem-basic · plotnine ·
    anyplot.ai'' instead of the required ''stem-basic · python · plotnine · anyplot.ai''
    — fix the literal string passed to labs(title=...).'
  - Design excellence is solid but still fairly conservative — consider dropping the
    redundant left axis_line spine (the geom_hline baseline already anchors the plot
    at y=0) for an even cleaner minimal-chrome look.
  - Library mastery could go further — e.g. leveraging plotnine-specific scale/coord
    helpers or a subtle annotation calling out the peak amplitude — to move beyond
    the already-good layered-geom composition.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), matches the required light-theme surface.
      Chrome: Title "stem-basic · plotnine · anyplot.ai" in dark ink, clearly readable; axis titles "Sample Index" / "Amplitude (normalized)" in dark ink; tick labels in soft dark gray — all legible. Subtle horizontal gridlines visible but unobtrusive. A solid gray baseline at y=0 and a thin left axis line frame the plot.
      Data: 30 green (#009E73) stems (vertical segments from y=0) topped with filled green circle markers, alternating above/below the baseline as the damped cosine signal decays. A dashed gray envelope curve (±exp(-t/12)) traces the amplitude decay.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), matches the required dark-theme surface.
      Chrome: Title and axis titles in light off-white ink, tick labels in light gray — all clearly legible against the dark background. Gridlines and baseline rendered in appropriately lighter tones, still subtle.
      Data: Same 30 green (#009E73) stems and markers, identical color and layout to the light render — only the chrome (background, text, grid, axis line colors) flipped, as required. Dashed envelope curve rendered in light gray, still visible against the dark background.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly readable against the near-black background.
