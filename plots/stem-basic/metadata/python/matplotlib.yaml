review:
  strengths:
  - 'Semantic color exception applied correctly: positive-amplitude stems use Imprint
    position 1 (#009E73) and negative-amplitude stems use the semantic red anchor
    (#AE3030), matching the style guide''s sentiment/polarity exception, and this
    split is identical across both themes.'
  - Custom baseline handling (basefmt=" " plus a manual ax.axhline at y=0 in INK_SOFT)
    is a more polished stem-plot pattern than the library-default dashed baseline.
  - Marker edge-halo (markeredgecolor=PAGE_BG, markeredgewidth=2) gives each stem
    marker visual separation from overlapping stems, a deliberate refinement beyond
    stock ax.stem() output.
  - Data (damped, noisy discrete oscillation with np.random.seed(42)) exercises both
    signal polarities and a decay envelope, a realistic and neutral signal-processing
    example that matches the spec's suggested use case.
  - Clean KISS script structure, explicit font sizes/marker sizes per the style guide,
    correct L-shaped spines, subtle y-axis-only grid, and theme-correct chrome in
    both renders (verified visually).
  weaknesses:
  - Design Excellence is still close to 'well-configured default' — the color-split
    and marker halo are nice but the plot lacks a stronger focal point (e.g., a subtle
    dashed exponential envelope over the peaks, or a light annotation calling out
    the peak amplitude at n=0) that would push it from 'good' to 'publication-ready'.
  - 'Library Mastery is generic: ax.stem() is the expected baseline feature for a
    stem-basic spec in matplotlib, so it doesn''t yet demonstrate a matplotlib-distinctive
    technique beyond what any stem implementation would use — consider something matplotlib-specific
    like per-stemline LineCollection styling variation, an inset zoom on the first
    few samples, or annotating the decay envelope.'
  - Title occupies roughly 75-80% of the axis width at fontsize=12 for a comparatively
    short ~46-char string; not overflowing or clipped (no deduction taken), but there
    is headroom to tighten slightly if the repair pass touches typography.
