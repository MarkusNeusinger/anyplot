      Data: 30 stems from n=0..29. Positive-amplitude stems (roughly the first ~10 samples and a few scattered later ones) are rendered in Imprint brand green (#009E73) with a large circular marker with a light-colored edge halo. Negative-amplitude stems are rendered in the semantic red anchor (#AE3030), same marker style. A thin horizontal baseline at y=0 in a muted ink tone. Stems clearly show a damped oscillation: large amplitude near n=0 decaying toward ~0 by n≈25-29, with small noise-driven zig-zagging between positive/negative.
