      Data: Single series in Imprint green (#009E73). Circular markers of varying radius mark each of the 30 data points at a decaying oscillatory amplitude. However, instead of isolated vertical stems from baseline to each marker, the render shows a continuous zig-zag/sawtooth line: after each marker there is a diagonal line descending to the x-axis baseline at the NEXT sample index before rising again to that next marker - stems are NOT visually disconnected from one another.
      Legibility verdict: PASS (all text readable), but visual-quality FAIL on the core plot-type semantic (see weaknesses - stems are connected, not discrete).

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 - correct.
      Chrome: Same title and axis titles now rendered in light ink (near-white), fully legible against the dark background. Tick labels are light-colored and readable - no dark-on-dark failures observed. Gridlines use the same subtle muted tone, appropriately dimmed for the dark surface.
      Data: Series color is identical #009E73 green, confirming palette consistency between themes. Same diagonal connector-line defect as the light render is present here too (identical geometry, just re-themed chrome).
      Legibility verdict: PASS (all text readable in both themes, no dark-on-dark or light-on-light issues), but the same stem-connection defect persists.
