review:
  strengths:
  - 'Correct Imprint palette: single series renders as #009E73, identical between
    light and dark renders'
  - 'Theme-correct chrome in both renders: #FAF8F1 light background with dark ink
    text, #1A1A17 dark background with light ink text, no dark-on-dark or light-on-light
    failures'
  - All font sizes explicitly set (title/axis/tick/legend), title fits without clipping,
    canvas well utilized with no cut-off elements
  - Title format matches the mandated 'stem-basic · pygal · anyplot.ai' exactly
  - Realistic, well-scaled decaying-oscillation signal-processing example (impulse
    response) with np.random.seed(42) for reproducibility
  - Clean KISS script structure with only necessary imports (numpy, pygal), correctly
    saves plot-{THEME}.png and plot-{THEME}.html per pygal's interactive-library convention
  weaknesses:
  - 'CRITICAL - broken stem separation: the raw SVG path in plot-light.html proves
    all 30 stems are rendered as ONE continuous connected path (<path d="M x0,base
    L x0,peak x1,base x1,peak x2,base x2,peak ...">) because the `None` sentinel placed
    between stem groups in `stem_data` does NOT create a break in pygal''s XY line
    rendering. This produces spurious diagonal connector lines running from the top
    of each stem down to the baseline of the next stem (e.g. a visible diagonal from
    the peak at n=1, y≈1.25, down to the baseline at n=2, then a vertical rise to
    the peak at n=2, y≈1.62), which destroys the ''discrete, unconnected stems'' visual
    that defines this plot type. Fix: pygal''s `None` entry does not reliably break
    XY line strokes here — add each stem as its own independent series instead (e.g.
    loop `chart.add(f''n={i}'', [(xi, 0.0), (xi, yi)])` for each of the 30 points,
    or another break mechanism verified against the actual rendered SVG/PNG, not assumed
    from pygal docs) so each stem is visually isolated with no line connecting it
    to its neighbors.'
  - Spec Notes explicitly state 'Consistent marker size and stem width throughout
    the plot', but the implementation intentionally varies marker radius (9–17) and
    fill-opacity (0.5–1.0) by |amplitude| emphasis — this directly contradicts the
    spec's explicit guidance. Use one constant marker radius and opacity for all stems.
  - Once the stem-break fix is applied, re-verify the r=0 baseline anchor points don't
    leave any stray artifacts (e.g. tiny visible dots or leftover connector fragments)
    now that each stem is its own series.
  image_description: |-
