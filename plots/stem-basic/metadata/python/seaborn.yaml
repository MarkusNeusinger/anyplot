review:
  strengths:
  - 'Theme-adaptive chrome is implemented correctly and consistently in both renders
    — correct #FAF8F1/#1A1A17 backgrounds, correct ink/ink-soft text tokens, and the
    brand green #009E73 stays identical across themes.'
  - The dashed decay-envelope traces add genuine signal-processing storytelling context
    (the |exp(-0.1n)| bound) beyond a bare stem plot.
  - The 'Peak amplitude' annotation with a leader line creates a clear focal point
    and guides the viewer through the decay narrative.
  - sns.scatterplot's statistical size mapping (size='Magnitude', sizes=(30,140))
    is a distinctive seaborn feature, redundantly encoding amplitude magnitude through
    marker size.
  - Clean KISS code structure, explicit font sizes throughout, reproducible via np.random.seed(42),
    and correct plot-{THEME}.png output with facecolor set.
  weaknesses:
  - 'Title is missing the required language token: current title is ''stem-basic ·
    seaborn · anyplot.ai'' but the mandated format is ''{spec-id} · {language} · {library}
    · anyplot.ai'' — fix ax.set_title(...) to read ''stem-basic · python · seaborn
    · anyplot.ai''.'
  - Marker sizes vary by magnitude (sizes=(30, 140) via size='Magnitude'), but the
    specification's Notes explicitly require 'Consistent marker size and stem width
    throughout the plot.' Either switch to a single uniform marker size to match the
    spec literally, or if the size-encoding is kept intentionally for storytelling,
    at least document/justify the deviation clearly.
  - Some near-zero-amplitude samples render at the low end of the size range (30),
    noticeably smaller than the VQ-03 density guideline of ~200-400 for sparse (<30)
    point counts — increase the overall size scale (e.g. sizes=(80, 220)) so even
    the smallest markers stay prominent at full resolution and when scaled down for
    mobile.
