review:
  strengths:
  - 'Correct stem-plot construction: a thin, zero-padded column series (pointWidth:
    3, groupPadding/pointPadding: 0) paired with a scatter series produces genuine
    thin stems with a circular marker at the tip — a faithful reproduction of the
    classic stem/lollipop form using only the core Highcharts bundle.'
  - 'First (and only) series is exactly Imprint brand green #009E73, identical between
    light and dark renders; only chrome (background, ink, grid) flips per theme.'
  - Baseline made explicit via a yAxis plotLine at y=0 in inkSoft, so stems visibly
    anchor to the zero line rather than floating.
  - 'Marker definition: `lineColor: t.pageBg` gives each marker a thin page-colored
    stroke, a nice edge-highlighting touch that keeps overlapping/adjacent markers
    crisp.'
  - Realistic, neutral dataset — a damped discrete-time impulse response (exponential
    decay × cosine) — is a textbook, non-controversial signal-processing example that
    genuinely benefits from stem-plot presentation, with 40 samples inside the spec's
    10-100 range.
  - Deterministic data generation (closed-form formula, no RNG), single un-nested
    script, only imports the Highcharts global — clean and reproducible.
  - 'enableMouseTracking: false on the column series avoids a duplicate/confusing
    tooltip on the invisible stem series, tooltip.valueDecimals keeps hover values
    readable in the HTML detail view.'
  - 'Both renders pass the theme-readability checklist: warm off-white / near-black
    backgrounds, dark-on-light and light-on-dark chrome text, subtle horizontal-only
    gridlines, no clipping at any edge.'
  weaknesses:
  - 'Design Excellence is generic beyond the stem-plot mechanics themselves: no distinguishing
    visual hierarchy or focal point beyond default coloring (e.g., no callout/annotation
    marking the peak sample, no subtle alpha fade for near-zero tail samples) — the
    decay pattern is present in the data but nothing in the styling helps the eye
    find it.'
  - 'Library Mastery is workaround-only: the column+scatter combo is the documented
    pattern for lack of a native stem series, but the implementation doesn''t otherwise
    showcase a Highcharts-distinctive feature (e.g., dataLabels on the peak marker,
    a subtle drop-shadow/gradient module-free polish, or zone-based coloring for the
    positive/negative regions) that would differentiate it from a bare recreation.'
  - Marker size (radius 6 CSS px) is only marginally above the library's baseline
    default of ~5 for this sparse (40-point) dataset — the data-density heuristic
    calls for 'larger, prominent markers' for <50 points, so radius 7-8 would read
    more confidently as the focal element at the tip of each stem.
  - 'xAxis padding (min: -1, max: sampleCount) leaves a full extra sample-width of
    empty margin on the right beyond the last real data point (n=39) with no data
    there — mostly harmless but slightly asymmetric compared to a tighter fit.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "stem-basic · javascript · highcharts · anyplot.ai" in bold dark ink, clearly visible top-center at ~35% of plot width. Axis titles "Sample Index (n)" (x) and "Amplitude" (y) in medium-gray ink, both legible. Tick labels (0-40 on x in steps of 2, -0.8 to 1.2 on y in steps of 0.2) are small, gray, and fully readable. Horizontal gridlines only, very subtle. A thin horizontal baseline rule sits at y=0.
      Data: Single series in Imprint brand green (#009E73) — 40 thin vertical stems rising/falling from the y=0 baseline to a small filled circular marker at each sample's value, showing a damped oscillating impulse response (large positive spike near n=0-2, decaying oscillation settling toward 0 by n≈35-39). No legend (correctly omitted for a single series).
      Legibility verdict: PASS — no text is light-on-light, all chrome reads clearly against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in off-white ink, clearly visible. Axis titles and tick labels rendered in light gray, fully legible against the dark background. Gridlines are faint light horizontal lines, subtle but present. Baseline rule at y=0 visible in light ink.
      Data: Identical green (#009E73) stems and markers as the light render — same 40 sample points, same decay pattern, confirming data colors are unchanged between themes; only the chrome (background/text/grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all text and gridlines are clearly visible against the near-black surface, and the green data remains highly visible on both surfaces.
