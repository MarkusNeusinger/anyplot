review:
  strengths:
  - 'Clever mixed-chart-type solution: a thin `bar` dataset (barThickness=5) draws
    the stems while a `showLine: false` line dataset draws the markers — a genuinely
    idiomatic Chart.js workaround since the library has no native stem/lollipop type.'
  - Marker size (pointRadius=9) is well-proportioned for the 20-point sparse dataset,
    clearly visible on both renders.
  - 'Realistic, neutral data: a Poisson PMF (lambda=6, k=0..19) framed as ''emails
    received per hour'', computed deterministically in-memory with no RNG — factually
    correct probabilities that sum sensibly and show the full rise-and-decay shape
    of the distribution.'
  - 'Theme tokens correctly threaded through title, axis titles, tick labels, and
    grid; both renders are legible with matching data color (#009E73) and correct
    theme-adaptive chrome (#FAF8F1 light / #1A1A17 dark backgrounds).'
  - Legend correctly hidden since there is only one series and the label would be
    redundant with the axis titles.
  - Clean KISS structure — no functions/classes, only used tokens/globals, no stray
    imports.
  weaknesses:
  - 'Design Excellence is generic: only the default single-green palette and library-default
    typography are used — no intentional color/hierarchy choice beyond the required
    brand green, and DE-01/DE-02 read as ''well-configured default'' rather than distinctive.'
  - No visual storytelling or emphasis — the peak values (k=5, k=6, both ~0.161) aren't
    called out in any way (e.g., a subtle annotation or focal-point styling), so the
    viewer has to find the story themselves.
  - Title occupies only ~28% of the plot width at fontsize 22 — noticeably smaller
    than the ~70-85% expected for the mandated title string; growing it slightly would
    improve visual hierarchy and canvas utilization without risking overflow.
  - Y-axis tick label callback formats every value to 2 decimals (e.g. '0.00'), which
    is fine, but the axis title 'P(X = k)' is mathematical notation rather than a
    plain-language description with units — a short clarifying word (e.g. 'Probability')
    would raise clarity further.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "stem-basic · javascript · chartjs · anyplot.ai" centered at top, clearly readable. X-axis title "Emails Received per Hour (k)" and Y-axis title "P(X = k)" in dark ink, both legible. Tick labels (0-19 on x, 0.00-0.18 on y) in a softer gray, all readable. Horizontal grid lines subtle and visible; vertical grid disabled (clean look).
      Data: 20 thin green (#009E73) stems from baseline y=0 rising to green circular markers with a light-colored border ring, forming the classic Poisson PMF shape peaking at k=5 and k=6 (~0.161) and decaying toward k=19. First (only) series correctly uses the brand green.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis titles, and tick labels all rendered in light/white tones, clearly legible against the dark background — no dark-on-dark failures observed. Grid lines subtle but visible.
      Data: Stems and markers are the identical #009E73 green as the light render (only the marker border ring, drawn in the page background color, flips from light to dark) — confirms data-color consistency across themes.
      Legibility verdict: PASS — no dark-on-dark text, no unreadable elements.
