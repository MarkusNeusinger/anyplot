review:
  strengths:
  - 'Correctly implements a stem plot in Chart.js using an idiomatic mixed-dataset
    technique: a thin bar dataset (barThickness=5) as the stems plus a point-only
    line dataset (showLine=false, pointRadius=9) for the markers — a real, documented
    Chart.js pattern (mixed chart types), not a fake/simulated stem.'
  - 'Markers use pointBorderColor: t.pageBg with a 2px border, creating a subtle halo
    that visually separates each marker from its stem and from neighboring stems —
    a thoughtful refinement beyond the library defaults.'
  - Data is a genuine, deterministic closed-form Poisson PMF (lambda=6 emails/hour,
    k=0..19) — fully reproducible with no RNG, realistic and neutral context, and
    a great domain fit for the spec's called-out application of 'discrete probability
    distributions.'
  - Redundant single-series legend correctly suppressed (legend.display=false) since
    both datasets share the same 'Probability' label.
  - Y-axis correctly starts at zero (beginAtZero) establishing the baseline the spec
    requires, with a clean 2-decimal tick formatter.
  - 'Theme-adaptive chrome fully threaded through: title/axis titles use t.ink, tick
    labels use t.inkSoft, grid uses t.grid, only y-axis grid shown (x grid off) per
    the style guide''s ''y-axis grid only for bar/line'' rule.'
  - Canvas renders at the exact required 3200×1800 landscape size with no edge clipping
    in either theme.
  weaknesses:
  - Both the bar dataset and the point-only line dataset are labeled 'Probability'
    — harmless with the legend hidden, but in the interactive HTML detail view, hovering
    a stem would show two stacked 'Probability' tooltip rows for the same value; consider
    giving the point dataset an empty/omitted label or merging tooltip callbacks to
    avoid the duplicate.
  - Data storytelling is minimal beyond the shape of the distribution itself — no
    emphasis (e.g. a subtle highlight or annotation) draws attention to the twin-peak
    mode at k=5/6, though this is a minor nice-to-have rather than a spec requirement.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "stem-basic · javascript · chartjs · anyplot.ai" in bold dark ink at top, comfortably clear of the top edge. X-axis title "Emails Received per Hour (k)" and Y-axis title "P(X = k)" in dark ink, both readable. Tick labels (0-19 on x, 0.00-0.18 on y) in a softer gray, fully legible. Subtle horizontal gridlines only (no vertical gridlines) that don't compete with the data.
      Data: 20 discrete stems in brand green (#009E73) — thin vertical lines from the y=0 baseline up to a circular marker with a light halo border matching the page background. Distribution is a Poisson PMF with a twin peak at k=5 and k=6 (~0.161), tapering off toward k=19.
      Legibility verdict: PASS — no light-on-light text, all chrome elements clearly readable.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, same axis titles now in light/off-white ink, tick labels in a lighter gray — all clearly legible against the dark surface. Gridlines remain subtle and visible without dominating.
      Data: Same brand green (#009E73) stems and markers, identical values and positions to the light render — only chrome (background, text, grid) flipped, confirming palette consistency between themes. Marker halo border now matches the dark page background.
      Legibility verdict: PASS — no dark-on-dark text, no illegible elements; green data reads clearly on the near-black surface.
