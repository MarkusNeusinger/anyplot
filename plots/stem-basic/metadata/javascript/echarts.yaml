review:
  strengths:
  - Peak-sample halo (soft glow + page-colored border ring) gives the chart a genuine
    visual-hierarchy focal point, directly fixing the previous review's flagged Design
    Excellence gap, while keeping the marker at the same 16px size as every other
    point (spec's consistent marker size requirement still holds).
  - Custom tooltip formatter surfaces 'Sample n = ...' / 'Amplitude = ...' from the
    axis-triggered pointer -- a real ECharts-specific tooltip pattern rather than
    a default field dump.
  - Bar (barWidth 3, barGap -100%) + scatter + markLine combo remains a clean, idiomatic
    workaround for ECharts' lack of a native stem/lollipop chart type.
  - Data is a genuinely on-spec damped second-order impulse response (signal-processing
    example straight from the spec's own Applications list), fully deterministic (closed-form,
    no RNG), 40 points within the 10-100 range.
  - Theme-adaptive tokens (t.ink, t.inkSoft, t.grid, t.palette[0], t.pageBg) are threaded
    through every chrome element; both renders are fully legible with pixel-identical
    data color.
  - Title fontSize increased from 22px to 26px versus the previous attempt, tightening
    the previously-flagged width headroom without overflowing.
  weaknesses:
  - Title still occupies only ~30-35% of canvas width -- below the 50-70% comfortable
    target (not a deduction per the style guide's overflow/squeeze rule, but still
    headroom for a stronger visual anchor).
  - The two series names ('stem', 'sample value') remain unused in the UI (no legend,
    not referenced in the tooltip text) -- acceptable for a single conceptual series,
    but a small missed polish opportunity.
  - 'LM-02 remains fairly standard: the itemStyle glow and markLine are competent
    but not a showcase of a truly ECharts-exclusive capability (e.g. custom graphic
    elements, dataZoom, or a bespoke symbol path).'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Title "stem-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible (26px). X-axis title "Sample Index (n)" and Y-axis title "Amplitude" both in dark ink, matched font sizes (18px). Tick labels (0, 5, 10 ... 35 on x; -0.6 to 1.2 on y) in a softer gray-ink tone, all readable (14px). Horizontal-only gridlines are subtle. A thin horizontal baseline line sits exactly at y=0.
      Data: 40 stems in brand green (#009E73) -- thin vertical bars from the y=0 baseline to each sample value, each topped with a solid green circular marker (16px). The n=0 peak sample carries an added soft glow halo and page-colored border ring, creating a deliberate focal point while remaining the same 16px marker size as every other point. Clear damped-oscillation shape decaying toward zero.
      Legibility verdict: PASS -- all title/axis/tick text is clearly dark-on-light and readable at full size.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title and axis titles now rendered in light/off-white ink, clearly visible against the dark surface. Tick labels in a lighter soft-gray tone, all legible. Gridlines are a faint light gray, visible but unobtrusive. The y=0 baseline line is visible in the dark theme's chrome tone.
      Data: Same 40 green (#009E73) stems and markers, pixel-identical in color and position to the light render, including the peak-sample glow halo -- only the chrome (background, text, gridlines) has flipped; the data colors did not change.
      Legibility verdict: PASS -- no dark-on-dark issues; all text is light-on-dark and clearly readable. Brand green data markers and the peak halo read strongly against the near-black background.
