review:
  strengths:
  - 'Clever workaround for ECharts'' lack of a native stem/lollipop type: a narrow
    bar (barWidth: 3) as the stem plus a scatter marker on top, tied together with
    z-ordering so the marker sits above the stem.'
  - Explicit theme-adaptive markLine at y=0 gives a real baseline reference instead
    of relying on the axis line, which correctly sits at the data minimum, not zero,
    for a value axis with negative data.
  - Data is a genuinely on-spec signal-processing example (damped second-order impulse
    response, y[n] = exp(-decay*n) * cos(omega*n)), fully deterministic with no RNG,
    and shows the discrete/individual-measurement character stem plots are meant for.
  - Consistent marker size (16px) and stem width (3px) across all 40 points, matching
    the spec's explicit consistency requirement.
  - 'First (only) series correctly uses Imprint brand green #009E73 in both bar and
    scatter series, identical across light and dark renders; chrome (background, ink,
    grid) correctly flips per theme.'
  - Title exactly matches the mandated `stem-basic · javascript · echarts · anyplot.ai`
    format; x/y axis titles and tick labels are explicitly sized and balanced (18px
    / 14px respectively) in both axes.
  - 'x-axis tick interval (interval: 4) keeps 40 category labels from crowding, and
    animation: false / no explicit init size or devicePixelRatio correctly follow
    the ECharts mount-node contract.'
  weaknesses:
  - 'Design excellence is competent but plain: single-hue palette with no additional
    visual hierarchy device (e.g. highlighting the peak stem, an envelope curve, or
    subtle emphasis on the largest-amplitude samples) to give the chart a clear focal
    point beyond the data''s natural decay shape.'
  - No legend is shown for the two series ('stem' and 'sample value'), which is fine
    for a single conceptual series, but the series names are otherwise unused anywhere
    in the chart (not even in the tooltip formatter) — a small missed opportunity
    for polish.
  - The bar+scatter+markLine combination, while a valid and idiomatic workaround,
    is a fairly standard ECharts pattern rather than a showcase of a truly distinctive
    ECharts-only feature (e.g. custom symbol paths, graphic elements, or a tailored
    tooltip formatter for sample index/amplitude).
  - Title occupies only ~28% of canvas width at the default 22px fontSize — well under
    the ~50-70% comfortable range (not a defect per the style guide's overflow/squeeze
    rule, but there is visual headroom to grow the title slightly and better balance
    the top of the composition).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "stem-basic · javascript · echarts · anyplot.ai" centered at top in dark ink, clearly legible. X-axis title "Sample Index (n)" and Y-axis title "Amplitude" both in dark ink, matched font sizes. Tick labels (0, 5, 10, ... 35 on x; -0.6 to 1.2 on y) in a softer gray-ink tone, all readable. Horizontal gridlines are subtle light gray, evenly spaced; no vertical gridlines. A thin horizontal baseline line sits exactly at y=0, distinguishing positive from negative stems.
      Data: 40 stems in brand green (#009E73) — thin vertical bars from the y=0 baseline to each sample value, each topped with a solid green circular marker (16px). Clear damped-oscillation shape: largest positive stem at n=0 (~1.0), decaying with sign alternation (visible troughs around n=5-8, smaller ripples continuing to ~n=25) before flattening near zero.
      Legibility verdict: PASS — all title/axis/tick text is clearly dark-on-light and readable at full size.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title and axis titles now rendered in light/off-white ink, clearly visible against the dark surface. Tick labels in a lighter soft-gray tone, all legible. Gridlines are a faint light gray, visible but unobtrusive. The y=0 baseline line is visible in the same soft-ink tone as the dark theme's chrome.
      Data: Same 40 green (#009E73) stems and markers, pixel-identical in color and position to the light render — only the chrome (background, text, gridlines) has flipped; the data colors did not change.
      Legibility verdict: PASS — no dark-on-dark issues; all text (title, axis titles, tick labels) is light-on-dark and clearly readable. Brand green data markers read strongly against the near-black background.
