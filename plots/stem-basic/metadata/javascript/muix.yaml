review:
  strengths:
  - 'Correct stem-plot semantics: thin stems run from the y=0 baseline to each marker,
    with clearly visible circular markers and consistent stem width/marker size throughout'
  - Custom SVG stem rendering via useXScale/useYScale hooks inside ChartContainer
    — an idiomatic, advanced MUI X composition pattern for a chart type the community
    package has no built-in primitive for
  - 'Theme-adaptive chrome is correct in both renders: brand green (#009E73) is identical
    light/dark, backgrounds match #FAF8F1/#1A1A17, and all text is legible in both
    themes'
  - Explicit ChartsReferenceLine at y=0 makes the baseline unambiguous
  - Realistic, deterministic damped-sinusoid impulse-response signal (40 samples,
    within the spec's 10-100 range) — a textbook signal-processing use case for stem
    plots
  - skipAnimation set and margins tuned so axis labels/ticks aren't clipped at the
    canvas edges
  weaknesses:
  - 'Duplicated/malformed header comment block (lines 1-10): two ''anyplot.ai'' banners,
    two ''Library:'' lines, and conflicting Quality values (''88/100'' vs ''pending'');
    the ''//# anyplot-orientation: landscape'' directive is buried mid-block instead
    of at the very top of the file. Collapse to a single header per the muix.md ''Header
    Style'' skeleton — since landscape is already the default orientation, the directive
    line can simply be dropped.'
  - X-axis shows every single integer tick (-1 through 40, 42 labels) which is denser
    than needed and adds visual clutter — show every 4th-5th tick (or use a tick formatter/interval)
    for a cleaner, more breathable axis consistent with the whitespace guideline.
  - Design excellence is minimal beyond the required elements — no additional visual
    hierarchy or emphasis (e.g. highlighting the peak sample, subtle callout on the
    decay envelope) to give the chart more storytelling value beyond the raw data
    shape.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "stem-basic · javascript · muix · anyplot.ai" centered at top in dark ink, clearly readable. Y-axis label "Amplitude" (rotated) and X-axis label "Sample Index (n)" both in dark ink, clearly legible. Tick labels on both axes in a slightly softer dark grey, all legible. Horizontal grid lines are subtle and do not compete with the data. A thin horizontal reference line marks the y=0 baseline.
      Data: First (only) series rendered in brand green (#009E73) — 40 stems (thin vertical lines with strokeLinecap round) rising/falling from the y=0 baseline to circular markers at each sample's amplitude, showing a damped decaying oscillation starting at 1.0 and settling toward 0 by sample ~30. Markers are clearly visible and proportionally sized for this sparse (40-point) dataset.
      Legibility verdict: PASS — no text is light-on-light; all chrome reads cleanly against the cream background.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis labels, and tick labels now rendered in light ink/soft-light grey, clearly visible against the dark background. Grid lines remain subtle. The y=0 reference line is visible in a soft light tone.
      Data: The stem/marker colors are identical brand green (#009E73) to the light render — only the chrome (background, text, grid, reference line) flipped tone, as required.
      Legibility verdict: PASS — no dark-on-dark failures; all tick labels, axis labels, and the title are clearly legible against the near-black surface, and the green data reads well on both surfaces.
