review:
  strengths:
  - Stems are drawn as a custom SVG layer inside ChartsContainer using the useXScale/useYScale
    hooks, so every stem starts at the y=0 baseline and ends exactly at its ScatterPlot
    marker in data coordinates
  - Single Imprint brand-green (#009E73) series for all stems and markers, identical
    in both renders; chrome (title, ticks, axis line, grid, baseline) flips cleanly
    via ink/inkSoft/grid tokens
  - Damped-oscillator impulse response gives 40 samples with long and short stems,
    negative values pointing down and near-zero samples sitting on the baseline, which
    covers every aspect of a stem plot
  - Axis bands sized explicitly (x height 64, y width 72) so no tick label is truncated;
    padding derived from the data range keeps the extreme markers clear of the frame
  - skipAnimation set and the component default-exported per the harness contract;
    native MUI X tooltips on the scatter markers add value in the HTML view
  weaknesses:
  - 'Suggestion: the mandated title spans only about 27 % of the width at 22 px; a
    slightly larger size would give it more presence above the wide plot area.'
  - 'Suggestion: the headroom between the 1.0 marker and the top of the plot (about
    0.15 units) could be tightened so the y range ends closer to the tallest stem.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, not pure white.
      Chrome: bold dark title "stem-basic · javascript · muix · anyplot.ai" centered at the top; y-axis title "Amplitude (normalized)" (rotated) and x-axis title "Sample index (n)" in dark ink; tick labels -0.6…1.0 and 0…35 in soft dark gray; subtle horizontal grid lines; left and bottom axis lines; dark 0.0 baseline line. All readable.
      Data: 40 brand-green #009E73 circular markers on thin green stems from the y=0 baseline; stems point up for positive and down for negative values, decaying from 1.0 at n=0 to near zero by n=39; one marker size, one stem width.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
