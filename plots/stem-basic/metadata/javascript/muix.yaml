review:
  strengths:
  - Custom SVG stems layer built with useXScale/useYScale hooks — a correct, idiomatic
    workaround for a plot type MUI X has no native chart for, drawn under the ScatterPlot
    so markers sit cleanly on top of each stem
  - ChartsReferenceLine anchors the y=0 baseline with subtle inkSoft styling, clearly
    demarcating the zero-crossing that stem plots depend on
  - Data (40-sample damped-sinusoid impulse response) is a realistic, neutral signal-processing
    example that matches the spec's 'Applications' section precisely
  - Both themes read cleanly with identical Imprint green data color, correctly flipped
    chrome, and a subtle horizontal-only grid
  - skipAnimation set on ChartContainer and fully deterministic in-memory data generation
    (no RNG, no seed needed)
  weaknesses:
  - Title occupies only ~25% of plot width at fontsize 22 — comfortably readable but
    visually timid relative to the 3200px canvas; a touch more presence (e.g. 24-26px)
    would anchor the composition better
  - Design excellence is fairly generic beyond the stems technique itself — no added
    emphasis (e.g. highlighting the peak sample or the decay envelope) to actively
    guide the eye; hierarchy relies entirely on the natural data shape
  - Grid, while correctly horizontal-only, could be even more whisper-thin for a more
    polished, publication-ready feel
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1.
      Chrome: Title "stem-basic · javascript · muix · anyplot.ai" in dark ink, centered top, clearly legible. X-axis label "Sample Index (n)" and Y-axis label "Amplitude" in dark ink, both readable. Tick labels (-1 to 40 on x, -0.6 to 1.1 on y) in slightly softer ink, all legible with no overlap. Horizontal grid lines subtle and visible without dominating. A darker horizontal baseline line marks y=0.
      Data: 40 discrete samples (damped sinusoid) rendered as thin green stems (#009E73-class Imprint green) from the y=0 baseline up/down to green circular markers at each sample's amplitude. First (and only) series correctly uses the brand green. Markers are prominent and clearly distinguishable from the background and from each other given the sparse (40-point) dataset.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17.
      Chrome: Title, axis labels, and tick labels rendered in light/off-white ink, clearly legible against the dark background. Horizontal grid lines are subtle light-gray, visible but unobtrusive. The y=0 baseline line remains visible in a muted light tone.
      Data: Stems and markers use the identical Imprint green as the light render — confirmed unchanged data color between themes, only chrome (background, text, grid) flipped.
      Legibility verdict: PASS — no dark-on-dark failures; all title/axis/tick text is clearly visible against the near-black background.
