    the low-information near-zero tail as requested
  - Clean KISS script structure with all font sizes explicitly set, correct 3200x1800
    canvas, no overlap or clipping in either theme
  weaknesses:
  - 'The decay-envelope lines! calls and the peak-highlight scatter!+text! calls added
    in this attempt do not actually render in either PNG -- verified via pixel-level
    crops near the peak (n=2, amplitude~0.74) and the troughs (n=5, n=6): no dashed
    envelope curve is visible anywhere (checked near n=0 where the envelope would
    be at its most visible value of 1.0, and near the troughs where it should hug
    the data closely), no translucent halo around the peak marker, and no ''peak:
    0.74'' text label. The requested explicit storytelling device from the previous
    review is present in source but has zero visual effect, so Design Excellence did
    not actually improve -- debug why these draw calls produce nothing (check axis
    autolimits vs the envelope''s y=1.0 value at n=0, check that RGBAf alpha channel
    is honored, check draw order/z-index) or remove the dead code'
  - Design Excellence is still close to a well-configured library default -- no visible
    custom polish beyond spine/grid theme tokens
  - Library Mastery usage is solid but generic-ish -- beyond stem!'s trunk/stem color
    split, nothing showcases a Makie-distinctive capability
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1, not pure white.
      Chrome: Title "stem-basic · julia · makie · anyplot.ai" bold dark ink, centered top. Axis labels "Sample Index (n)" / "Amplitude" and tick labels in dark/soft-dark ink, all clearly legible. Subtle y-axis-only gridlines at low opacity; top/right spines removed, left/bottom spines in soft ink.
      Data: 30 stems (n=0..29) in brand green #009E73 -- circular markers atop thin vertical stems, all rooted to a horizontal baseline trunk at y=0. Amplitude rises to two large positive peaks (~0.62, ~0.74) around n=1-2, dips to large negative troughs (~-0.35, -0.40) around n=5-6, then oscillates with decaying amplitude toward near-zero by n~20-29. No decay-envelope curve and no peak-highlight halo/label are visible anywhere on the canvas, despite being present in the source code (confirmed via pixel-level crops at the peak and at the troughs).
