review:
  strengths:
  - Idiomatic, well-parameterized use of CairoMakie's stem! recipe (color, stemcolor,
    marker, markersize, trunkcolor, trunkwidth all explicitly tuned)
  - 'Perfect Imprint palette compliance — brand green #009E73 identical across both
    renders, fully theme-adaptive chrome (background, text, grid, spines) in both
    light and dark'
  - Realistic, physically-motivated DSP data (damped second-order impulse response)
    that is deterministic and shows positive, negative, and near-zero stems
  - Clean KISS script structure with all font sizes explicitly set, correct 3200x1800
    canvas, no overlap or clipping in either theme
  - Baseline trunk line and marker styling clearly distinguish stem-plot semantics
    (thin stems, visible circular markers, consistent sizing)
  weaknesses:
  - Design Excellence is close to the library prompt's own skeleton example rather
    than a distinctive, intentionally-composed look — add deliberate refinements (e.g.
    subtle marker edge treatment, more refined grid opacity, stronger title/label
    weight contrast) to move beyond a 'well-configured default' feel
  - No explicit visual-hierarchy device beyond the natural decay of the signal — consider
    a subtle envelope curve or a highlighted peak stem to give the plot a clearer,
    more deliberate focal point (DE-03)
  - Roughly the second half of the 40 samples (n≈20-39) is visually flat/near-zero,
    which lowers information density across nearly half the plot — a slightly faster
    decay rate or fewer samples (e.g. n=0:29) would keep all stems visually meaningful
  - Library Mastery usage is solid but generic-ish — beyond stem!'s trunk/stem color
    split, nothing showcases a capability that's hard to replicate in another library
    (e.g. Makie's Figure/layout system, custom recipes, or CairoMakie-specific rendering
    tricks)
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 — not pure white.
      Chrome: Title "stem-basic · julia · makie · anyplot.ai" in bold dark ink, centered top; axis labels "Sample Index (n)" / "Amplitude" and tick labels in dark/soft-dark ink; subtle horizontal (y-axis only) gridlines at low opacity; top/right spines removed, left/bottom spines kept in a soft ink tone.
      Data: 40 stems in brand green (#009E73) — circular markers atop thin vertical stem lines, all rooted to a horizontal baseline trunk at y=0. Amplitude starts at 0, rises sharply to two large positive peaks (~0.62, ~0.74) around n=1-2, dips to large negative troughs (~-0.35, -0.40) around n=5-6, then oscillates with decaying amplitude, converging to near-zero by n≈25-39.
      Legibility verdict: PASS — all text is clearly readable against the light background, no dark-on-light or light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 — not pure black.
      Chrome: Same title/axis labels/tick labels now rendered in light ink (#F0EFE8 / #B8B7B0), spines in a soft light-gray tone, gridlines in a subtle light-on-dark low-opacity line — no dark-on-dark elements found.
      Data: Identical brand-green (#009E73) stems, markers, and trunk baseline shape/positions as the light render — confirms data colors are unchanged between themes, only chrome flipped.
      Legibility verdict: PASS — title, axis labels, and tick labels are all clearly legible against the dark background; no black-on-black or unreadable elements detected.
