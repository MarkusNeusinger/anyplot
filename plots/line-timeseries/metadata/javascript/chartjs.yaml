review:
  strengths:
  - 'Correctly solves the "no bundled date adapter" limitation by hand-building month-boundary
    ticks with year-at-boundary labels via afterBuildTicks + a tick callback — genuinely
    intelligent date formatting per the spec, not just a type: ''time'' scale'
  - Realistic trading-calendar data generation (skips weekends) with a deterministic
    seeded LCG
  - 'Y-axis ticks formatted with $ prefix, appropriate pointRadius: 0 for 252-point
    density, clean and fully theme-adaptive chrome'
  weaknesses:
  - Design Excellence is default/generic — line has no area fill, accent annotation,
    or emphasis on the more interesting moves in the series (e.g., the Aug rally /
    Sep pullback) to build a stronger visual focal point
  - Library Mastery is fairly basic Chart.js usage beyond the custom tick logic already
    credited — no distinctive additional features (e.g., custom tooltip formatting,
    gradient fill) demonstrated
