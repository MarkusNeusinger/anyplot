review:
  strengths:
  - 'Directly solves the spec''s hardest requirement — MUI X community has no built-in
    multi-scale date formatter, so a custom DayBoundaries overlay (useXScale/useDrawingArea)
    composes a two-tier axis: fine %H:%M ticks every 6 hours nested under a coarser
    weekday/date row, which is exactly the ''intelligent date formatting that adapts
    to the time range'' the spec calls for.'
  - 'Realistic, well-modeled synthetic data: an 8°F diurnal sine cycle, a gentle 0.7°F/day
    week-long warm-up, and small hourly sensor noise — a genuinely plausible rooftop-sensor
    scenario rather than abstract noise.'
  - Deterministic LCG-seeded data generation, clean imports, correct Imprint brand-green
    data color, and theme-correct chrome in both renders (verified — see Image Description).
  - 'Thoughtful chrome refinement: reduced-opacity axis lines and grid strokes, dashed
    day-boundary dividers, and a dynamically computed title font size that shrinks
    to fit the long mandated title string.'
  weaknesses:
  - 'X-axis hour-tick row is too dense to survive downscaling: 28 fine ''%H:%M'' ticks
    (every 6h across 7 days) are readable at full 3200x1800 resolution but collapse
    into an unreadable smear at the ~400px mobile preview (plot-light_400.png) — thin
    the fine-tick interval (e.g. only midnight and noon, or only midnight) so the
    row stays legible when the PNG is scaled down for thumbnails/mobile.'
  - 'Design Excellence is still close to a well-configured default: a single green
    line on a plain grid with no visual emphasis on the clearest story in the data
    (the day-over-day warming trend visible from peak-to-peak). A subtle area fill
    under the line, or a highlighted/annotated peak-trend, would push this from ''good''
    to ''polished''.'
  - The custom DayBoundaries helper component is justified (documented MUI X composition
    pattern for marks the community axis API can't express) but adds a second function
    beyond the mandatory default-exported Chart component — keep an eye on further
    complexity creep if repaired.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Title "Rooftop Sensor Temperature · line-timeseries · javascript · muix · anyplot.ai" is dark, bold, centered, and comfortably fits (~45% of canvas width, well under the 90% clip threshold). Y-axis label "Temperature (°F)" is rotated and dark. Fine hour tick labels (00:00/06:00/12:00/18:00) sit directly under the axis in a medium-dark tone; a second, bolder row of weekday/date labels (Mon, 6/3 ... Sun, 6/9) sits further below, separated by dashed vertical day-boundary lines. Horizontal and vertical gridlines are subtle but visible.
      Data: Single continuous line in Imprint brand green (#009E73), 168 hourly points, no markers (appropriate for dense hourly data) — the diurnal cycle (7 peaks/troughs) and a gentle week-long warm-up (each day's peak roughly 0.5-1°F higher than the last) are both clearly visible.
      Legibility verdict: PASS at full resolution — all text is clearly readable against the light background at native size; however, the dense fine-tick row becomes illegible once the image is downscaled to mobile width (see plot-light_400.png), which is flagged as a weakness under VQ-01.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Same title, axis labels, tick labels and day-boundary rows as the light render, all re-rendered in light/white tones. No dark-on-dark or light-on-light failures observed — every text element is clearly legible against the dark surface, including the fine hour-tick row and the bolder weekday row.
      Data: The line color is identical #009E73 green to the light render — only the chrome (background, text, grid, axis-line opacity) flipped, as required.
      Legibility verdict: PASS — no theme-adaptation failures in either chrome or data color.
