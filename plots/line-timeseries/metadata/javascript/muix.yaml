review:
  strengths:
  - 'True time axis (scaleType: "time") with 168 hourly readings at their own timestamps,
    ticks at regular 12-hour calendar intervals'
  - 'Span-adaptive tick formatting: a valueFormatter keyed on context.location shows
    HH:MM on ticks and a full weekday/date/time string in the HTML tooltip'
  - 'Two-tier date axis built with the useXScale/useDrawingArea hooks: bold weekday/date
    labels centred under each day give the week context the hour ticks lack'
  - Y axis padded 10 % around the data range rather than forced to zero, so the diurnal
    swing and the gradual warm-up fill the plot
  - Subtitle summarises count, date range and value range in the inkSoft token; theme
    tokens threaded through every text and line so both renders are clean
  - Null-safe series (present filter, null-aware formatter) so explicit gaps would
    break the line instead of bridging
  weaknesses:
  - 'VQ-02 (both): the dashed day-separator lines are drawn on top of the x-axis tick
    row and strike through the colon of every "00:00" tick label (6 labels) → stop
    the separator at the axis line and resume below the tick labels, or draw it behind
    the tick text. Likely cause: DayRow''s <line> runs continuously from y1={top}
    to y2={bottom + 62} and is rendered as a LineChart child after the axis, so it
    paints over the tick text.'
  - 'Suggestion: the x-axis title "Timestamp" is the column name; "Time (local)" would
    tell the reader more.'
  - 'Suggestion: the gap of about 45 px between the day-label row and the x-axis title
    could be narrowed by reducing X_AXIS_H, giving the plot area a little more height.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas.
      Chrome: bold dark title "Rooftop Sensor Temperature · line-timeseries · javascript · muix · anyplot.ai" (~50 % width) with a muted subtitle "168 readings · Jun 3, 2024 to Jun 9, 2024 · 52.6 to 73.8 °F"; y axis "Air temperature (°F)" with ticks 52–74; x axis "Timestamp" with 00:00/12:00 ticks and a bold day row (Mon, Jun 3 … Sun, Jun 9); subtle grey grid on both axes; dashed day separators at midnight, which cross the "00:00" tick labels. All text readable.
      Data: one #009E73 line, 3 px, no markers, showing seven diurnal cycles with a gradual warm-up.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, ticks, axis titles and day labels all flip to light ink; grid and dashed separators subtle but visible; no dark-on-dark text. Same separator strike-through on "00:00" labels.
      Data: identical #009E73 line, same shape.
      Legibility verdict: PASS
