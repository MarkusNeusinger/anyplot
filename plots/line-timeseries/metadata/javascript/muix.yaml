review:
  strengths:
  - Two-tier date axis (fine "%H:%M" ticks every 12 hours nested under a coarser weekday/date
    row drawn via useXScale/useDrawingArea) elegantly solves the spec's "intelligent
    date formatting that adapts to the time range" requirement, since MUI X community
    has no built-in multi-scale date formatter
  - Deterministic LCG-seeded data models a realistic diurnal cycle plus a gentle week-long
    warm-up, giving the line genuine temporal structure instead of pure noise
  - 'Correct Imprint palette usage (first series = #009E73, identical across themes),
    theme-adaptive chrome via window.ANYPLOT_TOKENS, subtle area fill, and clean community-only
    @mui/x-charts API usage with skipAnimation set'
  weaknesses:
  - X-axis has no explicit axis title (e.g. a subtle "Date" label) — the temporal
    axis is only communicated through tick/day-row formatting; adding a small axis
    label would fully satisfy VQ-06
  - Title auto-shrinks to ~19px (occupying only ~42% of canvas width) once the descriptive
    "Rooftop Sensor Temperature" prefix is added to the mandated suffix — there is
    room to size it slightly larger while staying within the 50-70% guideline
  - 'The custom dashed day-boundary lines and the built-in vertical grid lines serve
    overlapping purposes; consider dropping the built-in vertical grid (grid={{ vertical:
    true }}) since the day-boundary overlay already marks the meaningful x-axis divisions'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Rooftop Sensor Temperature · line-timeseries · javascript · muix · anyplot.ai" centered at top in dark bold text, clearly readable. Y-axis label "Temperature (°F)" rotated on the left, dark ink. Y tick labels (50°-76° in steps of 2°) and X tick labels (00:00/12:00 every 12 hours) in a slightly softer dark gray, all legible. Below the axis, a second row of bold weekday/date labels (Mon 6/3 ... Sun 6/9) with dashed vertical guide lines marking day boundaries. Horizontal grid lines are subtle light gray, visible but not dominant.
      Data: Single line series in Imprint green (#009E73) with a light green area fill beneath it (alpha ~0.12), tracing seven clear diurnal humps that rise slightly night over night (week-long warm-up). Line and area are clearly distinguishable from the cream background.
      Legibility verdict: PASS — all text (title, axis labels, ticks, day labels) is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, now in light/white bold text, clearly readable. Y-axis label and tick labels rendered in light gray/white, fully legible against the dark surface. Day-boundary dashed lines and weekday/date labels below the axis are equally legible in light text. Horizontal grid lines are a subtle darker-than-surface tone, still visible.
      Data: The same Imprint green (#009E73) line and area fill — colors are identical to the light render; only the chrome (background, text, grid) has flipped to the dark theme.
      Legibility verdict: PASS — no dark-on-dark failures observed; title, axis labels, tick labels, and day labels are all clearly visible against the near-black background, and the green line/fill remain highly visible on both surfaces.
