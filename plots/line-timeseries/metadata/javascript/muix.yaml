review:
  strengths:
  - 'Two-tier date axis: 12-hour time ticks (00:00 / 12:00) on a true `scaleType:
    "time"` axis with a bold weekday+date row beneath, built as a custom SVG child
    of LineChart via the `useXScale` and `useDrawingArea` hooks, so day labels and
    dashed midnight separators sit at exact scale positions'
  - Span-adaptive tick format (times of day up to 14 days, month/day up to two years,
    years beyond) chosen from the data span, matching the spec's intelligent-formatting
    note
  - Location-aware `valueFormatter` (`context.location === "tick"`) keeps ticks terse
    while the HTML tooltip shows the full weekday, date and time, and the series formatter
    appends the unit parsed from the column name
  - Theme tokens threaded through every chrome element (ink, inkSoft, grid); both
    renders read cleanly and the brand-green line is identical across themes
  - Y domain derived from the data with 10 % padding, not forced to zero, so the diurnal
    cycle and the gentle warm-up fill the plot
  - Subtitle summarises reading count, date range and value range computed from the
    data, giving a clear title hierarchy
  - Deterministic LCG data in the six-zone adaptable layout with role constants; linear
    curve avoids spline overshoot
  weaknesses:
  - 'Suggestion: the x-axis band (X_AXIS_H = 112) leaves about 40 px of empty space
    between the day-label row and the "Timestamp" axis title; a slightly shorter band
    would tighten the bottom of the chart.'
  - 'Suggestion: a lighter or thinner stroke for the dashed midnight separators would
    let them read as structure rather than doubling the 00:00 grid lines they sit
    on.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole canvas, no white panel.
      Chrome: bold dark title "Rooftop Sensor Temperature · line-timeseries · javascript · muix · anyplot.ai" top-left (~57 % width) with a soft-ink subtitle "168 readings · Jun 3, 2024 to Jun 9, 2024 · 52.6 to 73.8 °F"; y axis "Air temperature (°F)" rotated with ticks 52–74 every 2; x axis ticks 00:00 / 12:00 every 12 h, a bold row of day labels "Mon, Jun 3" … "Sun, Jun 9" centred under each day, dashed midnight separators broken at the tick row, axis title "Timestamp". Subtle grid on both axes. All text readable, no overlap, nothing clipped.
      Data: one 3 px brand-green (#009E73) line over 168 hourly readings, linear segments, a clear diurnal cycle with a warm-up from ~69 °F to ~74 °F peaks; no markers, no legend (single series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, subtitle, axis titles, tick labels and day labels flip to light ink and are all clearly readable; grid and dashed separators are subtle light-grey lines, visible but subordinate. No dark-on-dark text.
      Data: the same #009E73 line, identical to the light render; only chrome changed.
      Legibility verdict: PASS
