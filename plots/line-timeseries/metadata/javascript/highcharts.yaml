review:
  strengths:
  - 'Perfect Imprint palette compliance: first (only) series renders as #009E73 identically
    in both themes, with theme-correct backgrounds (#FAF8F1 light / #1A1A17 dark)
    and no dark-on-dark or light-on-light text failures'
  - All font sizes explicitly set per the style guide (title 22px, axis titles 16px,
    ticks 14px) and well-balanced between X and Y axes, producing a clean, fully readable
    chart in both themes
  - Realistic, deterministic full-year daily-temperature dataset (366 points, Date.UTC-based,
    fixed-seed LCG) that clearly shows a seasonal sine-shaped trend plus day-to-day
    noise
  - Highcharts datetime x-axis auto-adapts tick labels to monthly granularity (Jan
    2024 … Jan 2025) exactly as the spec's 'intelligent date formatting' note asks
    for, with grid lines on both axes
  - Markers correctly disabled for a dense 366-point daily series, keeping the 2.5px
    line clearly visible without clutter or overplotting
  weaknesses:
  - 'Design Excellence is default-level: a single flat-colored line with no fill,
    no gradient, and no typographic flourish beyond the mandated title — reads as
    a well-configured default rather than a polished, publication-ready chart (DE-01).'
  - 'No visual hierarchy or storytelling device: the seasonal peak (~Jul 2024) and
    trough (~Jan/Dec 2024) are visually present but not called out — consider a subtle
    annotation on the max/min point, a dashed annual-average reference line, or `series.zones`/`plotBands`
    to color-code seasons (DE-03).'
  - Library usage is generic — nothing here couldn't be replicated near-identically
    in Chart.js or ECharts. Consider a Highcharts-distinctive touch such as `series.zones`
    for threshold-based coloring, a `plotLine`/`plotBand` for the annual mean, or
    a light area-line hybrid to leverage Highcharts' idiomatic styling options (LM-02).
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "line-timeseries · javascript · highcharts · anyplot.ai" in bold dark ink at top center, comfortably sized (~33% of canvas width, no clipping or overflow). X-axis title "Date" and Y-axis title "Avg. Temperature (°C)" in medium-soft ink, both 16px and well balanced against each other. Tick labels (month/year on x, numeric °C on y) in soft ink, 14px, evenly spaced with no overlap. Thin, subtle horizontal and vertical grid lines visible but unobtrusive.
      Data: Single line series in Imprint brand green (#009E73), 2.5px width, no markers (correctly appropriate for 366 dense daily points). Line traces a clear seasonal sine-shaped rise from ~0°C in January to a ~24°C peak around July, then falls back to ~1-4°C by December, with realistic day-to-day noise superimposed.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title, axis titles, and tick labels now rendered in light/soft off-white ink, fully legible against the dark background. Grid lines are still visible but subtle (light gray on dark). No dark-on-dark failures anywhere — title, both axis titles, and every tick label are clearly legible.
      Data: The line series is rendered in the identical #009E73 green as the light render — confirmed unchanged data color, only chrome (background + text + grid) flipped for the theme.
      Legibility verdict: PASS — all text is clearly readable against the dark background; no dark-on-dark or contrast failures observed.
