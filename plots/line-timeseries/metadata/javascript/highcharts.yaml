review:
  strengths:
  - True datetime x axis with automatic monthly 'Jan 2024' tick formatting that fits
    the one-year span, no manual tick hacks
  - Peak label placed above the maximum and Low label below the minimum (softMin headroom),
    so the noisy line never runs through either label
  - Gradient fill built with Highcharts.color().setOpacity() from the same brand-green
    token, identical in both themes
  - Theme tokens threaded through every text element and palette.colorScheme pinned
    to the theme; deterministic fixed-seed LCG data
  weaknesses:
  - 'SC-01 (both): the series is a Highcharts area (line plus gradient fill to the
    baseline) rather than the line plot the spec names → a plain line series. Likely
    cause: chart.type "area" and plotOptions.area.fillColor.'
  - 'Suggestion: the ''Annual avg'' plot-line label at 13px is slightly smaller than
    the tick labels; matching 14px would balance it.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white #FAF8F1, not pure white.
      Chrome: Title "line-timeseries · javascript · highcharts · anyplot.ai" bold dark at top centre; axis titles "Date" and "Avg. Temperature (°C)" and ticks (Jan 2024 … Jan 2025 monthly; -4 to 26 in steps of 2) in dark inkSoft gray, all readable. Subtle gray grid on both axes. Dashed dark "Annual avg: 12°C" line with right-aligned label.
      Data: One #009E73 line of 366 daily temperatures tracing a seasonal arc (0.1 °C in early January to 23.8 °C in early July), with a green gradient fill fading to transparent. Two green markers with dark outlines: "Peak: 23.8°C" label above the maximum, "Low: 0.1°C" label below the minimum; the line crosses neither label.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black #1A1A17, not pure black.
      Chrome: Title, axis titles, ticks, avg label and callout labels in light ink/inkSoft, all readable; no dark-on-dark text. Grid subtle but visible; the dashed avg line is light gray.
      Data: Identical #009E73 line and gradient fill as the light render; callout markers green with a light outline. Only chrome flipped.
      Legibility verdict: PASS
