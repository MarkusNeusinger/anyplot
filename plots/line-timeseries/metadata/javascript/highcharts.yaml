review:
  strengths:
  - Peak/trough callout points with dataLabels and a dashed plotLines average reference
    line turn a plain time series into a small data story.
  - Gradient area fill built correctly via Highcharts.color(...).setOpacity(...),
    using the same brand-green token so light/dark data colors stay identical.
  - Clean, idiomatic datetime axis with automatic month-level tick formatting - no
    manual tick-locator hacks needed.
  - Fully deterministic in-browser data generation via a fixed-seed LCG, as required
    for this runtime.
  weaknesses:
  - Chart type is area (line + gradient fill) rather than a plain line series - matches
    the spirit of the spec but is a stylistic deviation from 'time series line plot';
    consider whether a thinner/lighter fill (or no fill) reads closer to the spec's
    literal ask.
  - '''Low: 0.1°C'' callout label sits close to its marker near the bottom-left of
    the plot area - a touch more vertical offset would give it clearer breathing room.'
  - Visual refinement beyond the gradient/plot-line is fairly close to library defaults;
    a bit more custom polish (e.g., refined tick density, subtler grid) would lift
    Design Excellence.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 - not pure white, not dark.
