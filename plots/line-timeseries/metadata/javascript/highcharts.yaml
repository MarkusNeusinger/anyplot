      Data: Single series in #009E73 teal-green line with a matching gradient area fill beneath it (opacity fading to 0 toward the baseline). Callout markers at peak and trough use the same green fill with a dark outline.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
