  strengths:
  - Peak, trough, and average markLine/markPoint annotations add genuine data storytelling
    beyond a plain line — the trough label correctly uses an explicit position/offset
    to avoid overlap
  - Time axis with native ECharts date formatting cleanly adapts tick density across
    the full year (2025, Mar, May, Jul, Sep, Nov) with no rotation needed
  - 'Theme-adaptive chrome is fully correct in both renders: warm off-white/near-black
    backgrounds, ink/inkSoft text tokens, subtle grid opacity, first series is Imprint
    #009E73'
  - Deterministic fixed-seed LCG generates a realistic seasonal temperature curve
    (trend + noise) with a plausible 0-24°C annual range
  - 'Clean idiomatic ECharts usage: single flat setOption call, dataZoom (inside),
    animation disabled, no explicit width/height/devicePixelRatio on init'
  weaknesses:
  - 'Peak annotation overlap: the markPoint circle for the peak (23.9°C) renders directly
    on top of the label text (overlapping the decimal point), visible identically
    in both light and dark renders — the trough markPoint already sets an explicit
    label `position: "right", offset: [8, 0]` to avoid exactly this; apply the same
    (or `position: "top"`) to the peak''s markPoint data entry so the dot no longer
    sits inside the text.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Title "Outdoor Temperature · line-timeseries · javascript · echarts · anyplot.ai" is centered, bold, dark ink, fully legible. "Temperature (°C)" y-axis name sits top-left (ECharts default end-location), "Date" x-axis name centered below — both dark ink, clearly readable. Tick labels (0-25 y-axis, month labels 2025/Mar/May/Jul/Sep/Nov on x-axis) are soft dark gray, legible, evenly spaced with no overlap. Grid lines are subtle, visible but not competing with data. Dashed "Avg 12°C" reference line and label sit comfortably inside the right margin (confirmed via pixel crop — not clipped).
