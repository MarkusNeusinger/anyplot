      Chrome: Title, axis names, and tick labels all render in light ink tones (confirmed via crop — "Avg 12°C" label is light gray, fully legible against the dark background). No dark-on-dark failures found anywhere. Grid lines subtle and visible.
      Data: Line and marker colors are pixel-identical to the light render — brand green #009E73 unchanged, confirming only chrome flipped between themes. The same peak-label/marker overlap present in light also appears here identically.
      Legibility verdict: PASS (no dark-on-dark issues; same isolated peak-annotation overlap as light render).
