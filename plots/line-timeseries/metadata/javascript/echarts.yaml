review:
  strengths:
  - 'Uses ECharts'' native `xAxis: { type: "time" }` for smart date formatting that
    auto-adapts tick granularity across the range (year label at the start, month
    abbreviations thereafter) — directly satisfies the spec''s core ''intelligent
    date formatting'' requirement without any manual locator logic.'
  - 'Correct Imprint palette usage: single series rendered in brand green `#009E73`,
    identical between light and dark renders — only chrome flips.'
  - 'Both themes are correctly chrome-adapted: warm off-white `#FAF8F1` / near-black
    `#1A1A17` backgrounds, readable ink-toned title/axis text, subtle theme-adaptive
    grid lines, no dark-on-dark or light-on-light failures.'
  - Grid lines present on both axes per the spec's explicit note ('Include grid lines
    on both axes for improved readability').
  - Single-series legend correctly omitted, keeping the chart uncluttered.
  - Deterministic, seeded data generation (fixed-seed LCG) producing a realistic seasonal
    outdoor-temperature curve with plausible daily noise.
  - 'Clean, minimal code with no fake interactivity, correct mount-node contract (`animation:
    false`, no explicit size/devicePixelRatio), canvas dimensions pass the 3200×1800
    gate.'
  weaknesses:
  - Data spans only ~300 days (Jan–Oct 2025); the seasonal arc never completes its
    cycle back down through winter, so the chart implies but doesn't fully show a
    year-over-year pattern — extending to a full 365 days would make the temporal
    story more complete.
  - No distinctive ECharts features beyond the basic time-axis line (e.g. `markLine`/`markPoint`
    to call out the seasonal peak/trough, or a `dataZoom` control that would add real
    value in the interactive HTML view) — the implementation is idiomatic but not
    exploiting the library's differentiators.
  - 'Visual refinement is minimal: default axisLine/tick styling is kept as-is rather
    than deliberately refined (e.g. removing tick marks, tuning grid opacity) beyond
    the baseline theme tokens — acceptable but generic.'
  - No explicit x-axis title (e.g. 'Date'); relying solely on the time-axis tick labels
    to convey the temporal dimension is acceptable here but a short axis name would
    make SC-04/VQ-06 unambiguous at a glance.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold centered title "Outdoor Temperature · line-timeseries · javascript · echarts · anyplot.ai" in dark ink, clearly legible. "Temperature (°C)" y-axis name top-left in dark ink. Y-axis tick labels (0/5/10/15/20/25) and x-axis tick labels (2025, Feb, Mar, ... Oct) in medium-gray, all clearly readable against the light background. Subtle light-gray gridlines on both horizontal and vertical axes, visible but not competing with the data.
      Data: Single continuous line in brand green (#009E73), tracing a seasonal arc rising from ~1°C in January to a peak of ~24°C around July, then declining to ~7°C by October, with realistic daily noise throughout. No markers (appropriate for ~300 daily points), consistent line weight, clearly distinguishable from the background.
      Legibility verdict: PASS — no light-on-light or illegible text found.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same title text rendered in light/off-white ink, clearly legible against the dark background. "Temperature (°C)" y-axis name in light ink. Tick labels on both axes in light gray, all readable. Gridlines rendered as subtle light-gray/white lines at low opacity, visible without dominating.
      Data: Identical brand-green (#009E73) line shape, position, and values as the light render — confirms data colors are unchanged between themes and only chrome flipped.
      Legibility verdict: PASS — no dark-on-dark failures found; all title/axis/tick text is clearly visible against the near-black surface, and the brand green line reads well on the dark background.
