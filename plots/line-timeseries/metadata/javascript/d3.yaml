review:
  strengths:
  - Rolling 30-day average overlay computed via d3.cumsum prefix sums adds real analytical
    value, giving the viewer a smoothed trend beyond the noisy daily series
  - Theme-adaptive semantic color (t.ink) correctly used for the reference/trend line,
    matching the style guide's 'neutral' anchor role for baseline/reference series
  - Subtle area fill under the daily-close line (fill-opacity 0.12) emphasizes price
    magnitude without competing with the line or the dashed average
  - Relies on d3's native time-scale tick formatting instead of a custom multi-format
    function, correctly matching the spec's 'intelligent date formatting' requirement
  - Clean, idiomatic use of d3-shape (curveMonotoneX), d3-scale, and d3-array; deterministic
    LCG-seeded random walk for reproducibility
  weaknesses:
  - Code comment calls the series 'one trading year' but Array.from({length:365})
    iterates every calendar day rather than ~252 trading sessions — either adjust
    the comment to 'calendar year' or skip weekends for stricter factual accuracy
  - Title occupies only ~30% of plot width at the fixed 22px size; not an overflow
    violation, but since this title is much shorter than the ~67-char mandated maximum,
    a slightly larger fontsize would give it more visual presence as the primary focal
    point
  - 'Design refinement is solid but not yet publication-grade: axis domain lines remain
    visible on both axes (default L-shape) and the legend has no elevated-background
    box, so it reads as ''good default'' rather than fully polished'
  - Legend text is set to 13px, slightly smaller than the 14px tick labels — harmonize
    secondary-text sizes for a tidier typographic hierarchy
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white.
      Chrome: Bold dark title "line-timeseries · javascript · d3 · anyplot.ai" centered at top, clearly readable. Y-axis label "Closing Price (USD)" rotated, dark ink, readable. X-axis label "Date" below the tick row, dark ink, readable. Tick labels (dollar amounts on Y, month names on X) rendered in a soft dark gray, all legible against the light background. Subtle light-gray gridlines on both axes, visible but not competing with data. Legend top-right with two entries ("Daily close", "30-day avg"), text in soft dark gray, fully readable.
      Data: First (and only categorical) series is the brand green #009E73 for the daily-close line and its light area fill; the 30-day rolling average is a dashed near-black line (theme-adaptive ink token), correctly used as a semantic reference-line color rather than a second categorical hue.
      Legibility verdict: PASS — all text is clearly readable against the light background, no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black.
      Chrome: Title, axis labels, and tick labels all flipped to light/white tones, clearly readable against the dark background. Gridlines are subtle light hairlines, visible but unobtrusive. Legend text is light gray, fully readable.
      Data: Daily-close line and area fill remain the identical brand green #009E73 as in the light render — confirmed unchanged. The 30-day average dashed line flips from near-black to near-white (correctly following the theme-adaptive ink token), which is the expected behavior for a chrome/reference element, not a data-color violation.
      Legibility verdict: PASS — no dark-on-dark failures; every title/label/tick is clearly visible, and the brand green remains visible against the dark surface.
