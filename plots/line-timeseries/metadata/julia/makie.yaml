review:
  strengths:
  - 'Correct Imprint palette: the line renders in exactly #009E73 in both themes,
    and theme-adaptive chrome (background, title, axis labels, ticks, spines, grid)
    flips cleanly between light (#FAF8F1) and dark (#1A1A17) while the data color
    stays identical.'
  - Explicit theme tokens (PAGE_BG / INK / INK_SOFT) are applied consistently to every
    chrome element, so nothing reads as dark-on-dark or light-on-light in either render.
  - 'Realistic, neutral synthetic dataset: a full year of daily average temperatures
    built from a sinusoidal seasonal cycle plus Gaussian noise, with a physically
    plausible amplitude (~-1.5C to 30C) for a temperate climate.'
  - 'Clean KISS script: seeded RNG (Random.seed!(42)), only the imports actually used,
    correct plot-$(THEME).png output via px_per_unit=2.'
  - 'Sensible idiomatic workaround for CairoMakie''s lack of a native datetime axis:
    day-offset numeric data mapped to custom xticks positioned exactly at month starts
    and labeled with abbreviated month names.'
  weaknesses:
  - 'Title occupies only ~40% of the plot width in both renders, well below the ~70-85%
    expected for the mandated ''{Descriptive Title} · {spec-id} · {lang} · {lib} ·
    anyplot.ai'' format at this length (79 chars). The ''n_chars > 67 ? round(20*67/n_chars)
    : 20'' scaling formula (calibrated for matplotlib''s pt-to-px conversion) renders
    noticeably smaller in Makie/CairoMakie -- raise the base fontsize (e.g. to ~24-26
    before applying the length scaling) so the title carries appropriate visual weight.'
  - 'Design Excellence / storytelling is minimal: the chart shows the raw seasonal
    series with no visual hierarchy, emphasis, or focal point (e.g. a subtle marker/annotation
    on the seasonal peak/trough) -- currently a straightforward default presentation
    of the data.'
  - Small default tick marks still protrude from the axis spines in both themes; per
    the style guide's decoration-removal checklist, consider hiding them (keep only
    the tick labels) for a cleaner minimalist look.
  - 'SC-02: the spec''s ''intelligent date formatting that adapts to time range''
    is only exercised at one scale (daily data over a full year -> monthly ticks);
    nothing in the code demonstrates how the tick locator would adapt for a much shorter
    (e.g. one week) or much longer (multi-year) span.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 -- not pure white, not dark.
      Chrome: Bold dark title "Average Daily Temperature (2024) · line-timeseries · julia · makie · anyplot.ai" centered at top, clearly readable but occupies only ~40% of the canvas width. "Month" (x-axis) and "Temperature (°C)" (y-axis, rotated) labels are dark and legible. Tick labels (Jan-Dec, 0/10/20/30) are medium-gray and legible. Grid lines are faint horizontal/vertical lines, subtle but visible. Only left and bottom spines are drawn (top/right removed).
      Data: Single continuous line in Imprint brand green (#009E73), tracing a clear seasonal arc from ~2°C in January, rising with daily noise to a ~30°C peak around late June/early July, then descending back to near 0°C / slightly negative by December.
      Legibility verdict: PASS -- all text is clearly readable against the light background; no light-on-light issues.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 -- not pure black, not light.
      Chrome: Same title, now rendered in light/off-white text, fully legible against the dark background. Axis labels and tick labels are light gray / off-white and clearly legible. Grid lines are faint light lines on the dark surface, subtle but visible. Same L-shaped spine treatment (top/right removed).
      Data: Same green (#009E73) line, identical shape and values to the light render -- confirms only chrome (not data color) changed between themes.
      Legibility verdict: PASS -- no dark-on-dark failures observed; all title/axis/tick text is clearly visible against the dark surface.
