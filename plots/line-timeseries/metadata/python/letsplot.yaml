  strengths:
  - True datetime axis with one tick per calendar month formatted '%b %Y', matching
    the one-year span
  - Theme tokens threaded through title, axis titles, ticks and backgrounds; both
    renders fully readable
  - Annual maximum and minimum enlarged as markers give the reader two focal points
  - Clean six-zone layout with column constants; the data block can be swapped for
    a CSV
  - Native geom_smooth LOESS stat and interactive HTML export
  weaknesses:
  - 'VQ-07 (both): the LOESS curve is drawn in #D4A574 (light) / #8B7355 (dark), a
    non-Imprint tan whose hex changes between themes, while data colors must stay
    identical → an Imprint position or the theme-adaptive neutral token at reduced
    alpha. Likely cause: geom_smooth(color=ACCENT_SOFT).'
  - 'SC-02, DE-02 (both): grid lines are solid INK_SOFT at full opacity and compete
    with the data line instead of staying subordinate (C3) → ink at about 15 % opacity
    per the style guide''s grid token. Likely cause: panel_grid_major=element_line(color=INK_SOFT,
    size=0.25).'
  - 'DE-02 (both): the panel is enclosed by a four-sided frame, top and right spines
    included → keep only the left and bottom axis lines. Likely cause: the default
    panel border left in place; set panel_border=element_blank().'
  - 'Suggestion: the 45-degree month labels may fit horizontally at this width; flat
    labels would read faster.'
