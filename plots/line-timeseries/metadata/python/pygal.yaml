review:
  strengths:
  - 'Canvas, typography and stroke width are sized for the 3200x1800 canvas: title,
    axis titles and ticks all read clearly in both themes and at thumbnail size'
  - 'Theme tokens threaded through the pygal Style object: chrome flips cleanly between
    #FAF8F1 and #1A1A17 while the #009E73 line stays identical'
  - Month-year tick labels at calendar month starts via x_labels_major, rotated 45
    degrees so none collide
  - y axis spans the data (about 142-270 USD) rather than being forced to zero, so
    the trend and the drawdowns stay visible
  - 'Adaptable-code layout: column constants with role comments and one Data block
    ending in a tidy df, lists built below it with .tolist()'
  - Interactive HTML output with pygal's native hover tooltips for each daily value
  weaknesses:
  - 'SC-02 (light): show_x_guides draws a dashed vertical guide for each of the 365
    daily x labels, so the light render is covered by a dense grey hatch that competes
    with the data line instead of staying subordinate (C3); the dark render hides
    it only because the dashes are near-black → vertical guides at the 12 month starts
    only, with the y guides unchanged. Likely cause: show_x_guides=True with an x_labels
    entry (an empty string) for every day; pygal.DateTimeLine with month-start x_labels
    draws one guide per month.'
  - 'VQ-05 (both): tick labels are unbalanced: the y minor ticks (160, 170, ...) render
    at 56 px while the x month ticks and the y major ticks 150/200/250 render at 44
    px, so the major ticks look smaller than the minor ones → one tick size on both
    axes, about 44-48 px (y minor −8 to −12 px). Likely cause: label_font_size=56
    vs major_label_font_size=44 in Style.'
  - 'Suggestion: pygal.DateTimeLine with (datetime, value) points would give a true
    date axis, so uneven spacing in the data would show as uneven spacing along the
    axis.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, correct.
      Chrome: title 'line-timeseries · pygal · anyplot.ai' centred at the top in dark ink; y title 'Stock Price (USD)' rotated on the left, x title 'Date' at the bottom; y ticks 150-270 in steps of 10 (150/200/250 noticeably smaller than the others); x ticks 'Jan 2024' ... 'Dec 2024' rotated 45 degrees. All text dark on light and readable. The 365 daily vertical guides plus the y guides form a dense dashed grey hatch over the whole plot area.
      Data: one #009E73 line about 5 px wide, 365 daily prices rising from about 150 to 270 USD with a February dip to about 142 and a September peak about 263; no legend (single series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, correct.
      Chrome: same title, axis titles and ticks in light ink (#F0EFE8 / muted), all readable; no dark-on-dark text. The daily guides are near-black dashes and read only as a faint texture; the y guides are faint but visible.
      Data: the same #009E73 line, identical to the light render.
      Legibility verdict: PASS
