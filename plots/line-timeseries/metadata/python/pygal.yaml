review:
  strengths:
  - 'Uses pygal.DateTimeLine, a true date axis: each of the 262 business-day closes
    sits at its own timestamp, so weekend gaps show as uneven spacing as the spec
    asks'
  - Tick labels are placed at calendar month starts (pd.date_range freq='MS') and
    formatted by a span-dependent rule (%b %d / %b %Y / %Y) through x_value_formatter,
    which is the intelligent date formatting the Notes request
  - 'Theme tokens are threaded through the Style object: warm off-white and near-black
    surfaces, INK text and a 15 % ink guide color keep every label readable and the
    grid subordinate in both renders'
  - Grid lines on both axes (show_x_guides and show_y_guides) drawn solid instead
    of pygal's default dashes, subtle in both themes
  - The y axis spans the data (about 140 to 295) instead of being forced to zero,
    so the trend and the drawdowns stay legible
  - allow_interruptions=True makes explicit missing values break the line, and the
    HTML output keeps pygal's native hover tooltips for each close
  weaknesses:
  - 'Suggestion: repeat the year only on the January tick ("Jan 2024", then "Feb",
    "Mar", …) so the month labels fit without rotation.'
  - 'Suggestion: a ticker-like series name in the y title (for example "ACME close
    (USD)") would make the scenario read less generic.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area, not pure white.
      Chrome: title "line-timeseries · python · pygal · anyplot.ai" centered at the top, about 56 % of the width, dark ink; y-axis title "Stock Price (USD)" rotated, x-axis title "Date"; y ticks 150–290 in steps of 10, x ticks "Jan 2024" … "Dec 2024" at month starts, rotated 30°, no collisions. Solid subtle grid on both axes; left and bottom axis lines. All text readable, nothing clipped.
      Data: a single #009E73 line, about 5 px, of 262 business-day closes rising from ~150 in January through a dip to ~142 in mid-February to ~295 in late December; no markers, no legend (single series).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17, not pure black.
      Chrome: same layout; title, axis titles and tick labels in light ink (#F0EFE8), clearly readable; grid lines faint light ink, visible but subordinate. No dark-on-dark text.
      Data: identical #009E73 line, same shape and position as the light render; only the chrome flipped.
      Legibility verdict: PASS
