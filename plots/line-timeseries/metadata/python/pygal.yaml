review:
  strengths:
  - Uses pygal's native DateTimeLine, so every observation sits at its own timestamp
    on a true date axis and uneven spacing would show as uneven spacing
  - Tick labels at calendar month starts with a span-adaptive strftime formatter (%b
    %d / %b %Y / %Y) passed through x_value_formatter, matching the spec's intelligent
    date formatting
  - allow_interruptions=True makes explicit missing values break the line instead
    of bridging them, and the y axis spans the data (about 142-270) rather than being
    forced to zero
  - 'Theme tokens threaded through Style: warm off-white / near-black backgrounds,
    readable ink text and subtle guides on both axes in both renders'
  - Library-native interactivity in the HTML output (hover tooltips with formatted
    dates and values)
  weaknesses:
  - 'VQ-07 (both): the data line renders as rgb(50,176,140) on the light page and
    rgb(5,131,97) on the dark page instead of #009E73 (0,158,115) in both, so the
    brand green differs between themes → a fully opaque stroke so both renders show
    exactly #009E73. Likely cause: pygal''s default Style opacity (~0.8 stroke-opacity
    on series) blends the line with the background; set opacity=''1'' and opacity_hover=''1''
    in Style.'
  - 'DQ-02 (both): daily ''Stock Price (USD)'' closes are generated for all 365 calendar
    days of 2024, including weekends and holidays when no exchange trades → business-day
    dates only (about 252 trading days, e.g. pd.bdate_range). Likely cause: datetime(2024,
    1, 1) + timedelta(days=i) for i in range(365).'
  - 'Suggestion: a slightly heavier stroke or a subtle area fill under the line would
    give the single series more presence on the large canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across canvas and plot area.
      Chrome: title "line-timeseries · python · pygal · anyplot.ai" centered at top (~55% width), y title "Stock Price (USD)" rotated, x title "Date", y ticks 150-270 in steps of 10, x ticks "Jan 2024" … "Dec 2024" at month starts rotated 30°; all dark text clearly readable; thin light-grey guides on both axes.
      Data: a single green line (rendered rgb(50,176,140), a translucent #009E73) for 365 daily prices climbing from ~150 to ~270 with a dip in February and a peak in mid-September; no markers, no legend.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: same title, axis titles and ticks in light ink (#F0EFE8 / #B8B7B0), all clearly readable; no dark-on-dark text; subtle light guides on both axes.
      Data: same line and shape, but the line reads as a darker green rgb(5,131,97) because the stroke is semi-transparent over the dark page — not pixel-identical to the light render.
      Legibility verdict: PASS
