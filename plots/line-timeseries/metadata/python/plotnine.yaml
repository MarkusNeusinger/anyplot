review:
  strengths:
  - 'True datetime axis via scale_x_datetime(date_breaks=''1 month'', date_labels=''%b''):
    twelve regular monthly ticks that fit without rotation'
  - Theme tokens threaded through every chrome element; text and grid read cleanly
    in both the light and dark render
  - Y axis spans the data range instead of being forced to zero, so the trend and
    the short-term noise stay visible
  - Adaptable layout with DATE/PRICE column constants above the Data block; plotnine
    titles the y axis from the column name
  weaknesses:
  - 'DE-02 (both): panel_border draws all four sides of the panel, a closed box the
    line chart does not need → keep only the left and bottom axis lines (or none).
    Likely cause: panel_border=element_rect(color=INK_SOFT, fill=None).'
  - 'DQ-02 (both): the data is labelled as Bitcoin prices in 2023 but follows an invented
    sine-shaped path (peak ~36k in April, ~6k in October) that contradicts the real
    asset''s history → a scenario whose values need not match a real record (e.g.
    a fictional token or a sensor/traffic series), or values that follow the named
    asset. Likely cause: the ''Bitcoin price (USD)'' label with dates starting 2023-01-01
    on a synthetic trend + noise generator.'
  - 'Suggestion: mark the year on the January ticks (e.g. ''Jan\n2023'', ''Jan\n2024'')
    so the two ''Jan'' labels are told apart.'
  - 'Suggestion: thousands separators on the y tick labels (30,000) would read faster.'
