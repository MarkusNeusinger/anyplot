review:
  strengths:
  - 'True date axis via scale_x_date(date_breaks = "1 month", labels = scales::label_date("%b")):
    182 daily observations at their own timestamps, with month-abbreviation ticks
    at regular calendar intervals that fit a six-month span and sit horizontally because
    they do not collide'
  - Grid lines on both axes (monthly verticals, 10 °C horizontals) drawn at 15 % ink
    alpha, subordinate to the data line and visible on both surfaces
  - y axis spans the data (about −15 °C to 19 °C) with a °C suffix on every tick via
    scales::label_number(suffix = "°C"), not forced to zero
  - 'Theme tokens thread through every chrome element: title, axis titles, tick labels
    and axis lines are readable in both renders, and the #009E73 line is identical
    in both'
  - 'Adaptable structure: column constants with role comments, one Data block building
    a tibble with !!DATE := …, and a Plot block that reads only df through .data[[...]]
    and titles the axes from the constants'
  weaknesses:
  - 'Suggestion: the dashed loess line (linewidth 0.8) is mostly hidden under the
    2 mm data line, so it reads as stray dashes at the edges; either give it more
    presence or drop it.'
  - 'Suggestion: name a place in the axis title or data context (for example a weather
    station) so the series reads as a concrete measurement rather than a generic temperature.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white, consistent with #FAF8F1; not pure white, not dark.
      Chrome: bold near-black title "line-timeseries · r · ggplot2 · anyplot.ai" top-left (about 46 % of the width); axis titles "Date" and "Outdoor Temperature (°C)" in dark ink; horizontal month ticks Jan–Jul and y ticks -10°C/0°C/10°C/20°C in soft gray ink; faint grid on both axes (monthly verticals, 10 °C horizontals); left and bottom axis lines only, no tick marks. All readable.
      Data: one thick #009E73 line of 182 daily readings rising from about -10 °C in January to about 17 °C in late June, with weekly wobble and day-to-day noise; a thin dashed muted-gray loess curve runs underneath and peeks out mostly at the ends.
