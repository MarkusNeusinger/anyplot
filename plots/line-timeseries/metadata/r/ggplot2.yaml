review:
  strengths:
  - Mandated title format is exact ("line-timeseries · r · ggplot2 · anyplot.ai")
    and the single-series legend is correctly omitted
  - Intelligent monthly x-axis date formatting (scale_x_date + label_date("%b")) with
    rotated (30°) tick labels avoids overlap across a 6-month span
  - Grid lines present on both axes at a subtle, theme-adaptive opacity; brand green
    (#009E73) is identical across light and dark renders and both renders are theme-correct
  - All font sizes explicitly set (title 12pt, axis.title 10pt, axis.text 8pt); L-shaped
    spine cleanup (top/right removed, tick marks removed) is a deliberate refinement
    beyond theme_minimal defaults
  - Clean KISS structure with set.seed(42) for reproducibility
  weaknesses:
  - 'DQ-03: The seasonal sine (4 + 14*sin(2*pi*(day-10)/365)) peaks around day ~101
    (mid-April) and has already fallen back to ~6°C by day 182 (~July 1) — a real
    Northern Hemisphere temperate outdoor-temperature cycle peaks around June/July
    and is still rising or near its peak by early July, not crashing back toward winter
    values. Shift the phase so the peak lands near day ~200 (mid-July) instead.'
  - 'VQ-06: Y-axis label "Outdoor Temperature" carries no unit even though tick labels
    show "°C" via label_number(suffix="°C") — rename to "Outdoor Temperature (°C)"
    for full unit disclosure on the axis title itself.'
  - 'VQ-03 / DE-01: geom_line(linewidth = 1.1) is only ~2x the ggplot2 default (0.5)
    for a single, sole-focus series; the style guide recommends ~2.5-3.5 for a primary
    line and thicker lines when there are few series — bump to ~1.8-2.2 for more visual
    prominence against the noisy daily data.'
  - 'CQ-03: `library(dplyr)` is imported but never used anywhere in the script (no
    dplyr:: calls, no pipes) — remove the unused import.'
  - 'DE-01/DE-03: The plot is a well-configured single default line with no visual
    hierarchy or emphasis (e.g. no highlight of the seasonal peak/trough, no smoothed
    trend overlay) — data is displayed but not interpreted for the viewer.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1 — not pure white, not dark.
      Chrome: Bold dark title "line-timeseries · r · ggplot2 · anyplot.ai" top-left; "Date" (x) and
        "Outdoor Temperature" (y) axis titles in dark ink; rotated (~30°) monthly tick labels
        (Jan-Jul) in a lighter soft-ink gray; y tick labels show "5°C"-"20°C" with degree suffix.
        Faint grid lines visible on both axes (vertical at month ticks, horizontal at 5°C steps).
        Only left and bottom axis lines are drawn (top/right spines removed, tick marks removed).
      Data: A single jagged green (#009E73) line tracing daily outdoor temperature from ~3°C in
        January, rising with weekly wobble and sensor noise to a peak of ~21°C around early April,
        then oscillating and declining back down to ~6°C by the end of June/start of July.
      Legibility verdict: PASS — all title, axis, and tick text is clearly readable against the
        light background; no light-on-light issues observed.

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17 — not pure black, not light.
      Chrome: Same layout as the light render — bold off-white/cream title, off-white axis titles,
