review:
  strengths:
  - 'Mirrored step semantics chosen per side with the series-level curve option: curve
    ''stepBefore'' on bids and ''stepAfter'' on asks, so each plateau holds its cumulative
    quantity from its own price level outward and both staircases are lowest at the
    center and never fall away from it'
  - Cumulative depth accumulated from the best bid downward and the best ask upward
    with a running sum over price-sorted rows, aligned on one shared linear price
    axis via null-padded series (connectNulls false), leaving the 10 USD spread as
    an empty gap
  - Native ChartsReferenceLine composed as a child of LineChart draws the dashed mid-price
    line with its 'Mid 60,000 USD · spread 10 USD' label at the gap, top-aligned where
    the areas are near zero, so it covers no data
  - x-axis domain set symmetrically around the mid price (min/max from halfRange)
    and the y-axis pinned at 0, so the two areas mirror each other
  - 'Two-line HTML title block: the mandated title plus a soft-ink subtitle stating
    the level counts and total bid vs ask depth (140.1 vs 137.2 BTC), a summary of
    the book imbalance at a glance'
  - Synthetic book with two large resting walls per side produces the characteristic
    tall single steps (bid walls near 59,925 and 59,840, ask walls near 60,060 and
    60,190)
  - 'Current MUI X v9 API throughout: per-chart CSS classes (.MuiLineChart-area/-line),
    axis height/width bands, tickLabelStyle/labelStyle, slotProps.legend direction/position/sx,
    skipAnimation; theme tokens threaded into every chrome element; interactive tooltip
    available in the HTML output'
  weaknesses:
  - 'Suggestion: a light hover-free emphasis on the largest wall per side (e.g. a
    slightly heavier stroke on that step) could make the support/resistance reading
    faster, though the walls already read clearly from the data.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white (#FAF8F1), not pure white.
      Chrome: bold dark title "BTC/USD Order Book · depth-order-book · javascript · muix · anyplot.ai" top-left (~47% width), soft-ink subtitle "50 bid and 50 ask levels · bid depth 140.1 BTC · ask depth 137.2 BTC", centered horizontal legend (green "Bids (buy orders)", red "Asks (sell orders)"). X-axis "Price (USD)" with ticks 59,750 … 60,250 every 50; y-axis "Quantity (BTC), cumulative from the mid price" with ticks 0–150 every 10. Subtle horizontal grid only. All text dark and clearly readable.
      Data: green (#009E73) semi-transparent step area on the left, rising from ~1 BTC at 59,995 to ~140 BTC at 59,750 with tall wall steps near 59,925 (+23) and 59,840 (+50); matte-red (#AE3030) semi-transparent step area on the right rising from ~0.5 BTC at 60,005 to ~137 BTC at 60,250 with walls near 60,060 (+24) and 60,190 (+45). Solid matching outlines. Dashed vertical mid line at 60,000 with label "Mid 60,000 USD · spread 10 USD" at its top; narrow empty spread gap visible at the center.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black (#1A1A17), not pure black.
      Chrome: title, subtitle, legend, tick labels, axis titles and the mid-line label all render in light ink and are clearly readable; no dark-on-dark text. Grid lines subtle but visible; dashed mid line in light soft ink.
      Data: identical green and red stroke colors and identical geometry to the light render; the 30% fills read as darker tints on the dark surface but both areas remain clearly distinguishable from the background and from each other.
      Legibility verdict: PASS
