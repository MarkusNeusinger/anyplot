review:
  strengths:
  - Row dendrogram leaves sit exactly on their gene rows (leaf y ≈ tick y within 2
    px) and merge heights are readable in both themes
  - Imprint diverging ramp centered on zero with domainMid=0 and a theme-adaptive
    midpoint, plus a color bar titled with its unit, 'Expression (log2 ratio)'
  - 'Idiomatic Altair dendrograms: mark_rule with x2/y2 segments from scipy''s icoord/dcoord
    and a reversed scale domain so the row tree grows left'
  - 'Native Altair interactivity in the HTML output: tooltips with gene, sample, and
    expression to two decimals, plus zoom and pan via .interactive()'
  weaknesses:
  - 'SC-02 (both): the column dendrogram''s leaves stand about 256 px (≈3.2 columns)
    left of their columns: leaves at x≈360–1462 while the cell centers run x≈615–1719,
    so the leftmost leaves hang over the gene-label gutter and no leaf sits on its
    own sample (spec C1) → each leaf centered over its column (+256 px). Likely cause:
    hconcat(corner, col_dendro_chart) gives the corner only DENDRO=70 view px while
    the heatmap''s y-axis labels and ''Genes'' title add about 64 view px left of
    the cells; lay the four views out as one aligned grid (alt.concat(corner, col_dendro_chart,
    row_dendro_chart, heatmap, columns=2)) or widen the corner by the y-axis extent.'
  - 'VQ-01 (both): axis tick labels (Gene_xx, Sample_xx) at labelFontSize=9, below
    the 10 px altair reference, read smaller than the 10 px color-bar labels → 10
    px (+1). Likely cause: labelFontSize=9 in both alt.Axis calls.'
  - 'DQ-02 (both): rows and columns are labelled Gene_01…Gene_20 and Sample_01…Sample_15,
    placeholders that read generic → real-looking gene symbols and sample or condition
    names. Likely cause: the f-string label lists in the DataFrame constructor.'
  - 'CQ-01 (code): a branches() helper function (lines 68–76) breaks the Imports →
    Data → Plot → Save, no-functions structure → build the two segment tables inline.
    Likely cause: the helper wrapping the icoord/dcoord loop.'
  - 'Suggestion: row or column color strips for the four gene groups, which the Notes
    allow, would name the clusters the dendrograms reveal.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 on a 2400x2400 square canvas, padded evenly; no pure white.
      Chrome: bold title "heatmap-clustered · python · altair · anyplot.ai" in near-black at top center; axis titles "Genes" (rotated) and "Samples" in INK; gene and sample tick labels in dark grey INK_SOFT, sample labels rotated -45°; color bar on an elevated #FFFDF6 panel with a thin grey frame, title "Expression (log2 ratio)", ticks -4…6. All readable.
      Data: 20x15 matrix of rect cells in the Imprint diverging ramp (matte red #AE3030 for negative values, off-white at 0, blue #4467A3 for positive values, with Vega's HCL interpolation giving tan and teal in between). Four co-expression blocks emerge after reordering. Row dendrogram on the left in INK_SOFT 1.5 px rules, leaves aligned with the gene rows. Column dendrogram on top, but its leaves sit about 3 columns left of the cells they belong to.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17; no pure black.
      Chrome: title and axis titles in light #F0EFE8; tick labels in light grey #B8B7B0; color bar panel #242420 with a light frame, title and labels light. No dark-on-dark text.
      Data: the same red and blue endpoints; the ramp's midpoint is the dark page color, so near-zero cells fade into the background and strong values read as teal or blue and orange or red. Dendrograms in light grey are clearly visible, with the same column-dendrogram offset as in the light render.
      Legibility verdict: PASS
