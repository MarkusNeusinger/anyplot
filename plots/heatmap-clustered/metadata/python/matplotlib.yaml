review:
  strengths:
  - 'Clustermap layout built with a 2×2 gridspec: the column dendrogram above and
    the row dendrogram on the left line up leaf for leaf with the 12 sample columns
    and 15 gene rows, and the row axis is inverted so the dendrogram reads top-down
    like the imshow rows'
  - 'Rows and columns are reordered by Ward/Euclidean linkage from scipy, and the
    reorder shows clear blocks: the normal samples (N1/N2) split from the tumour samples
    (T1/T2), and the cell-cycle, metabolism and immune gene groups each form their
    own block'
  - 'Imprint diverging colormap (#AE3030 ↔ page color ↔ #4467A3) is centred on zero
    with symmetric vmin/vmax from the data, and the colorbar spans exactly the heatmap
    height with a clear ''Expression (z-score)'' label'
  - Cell gaps drawn as page-colored minor-tick grid lines, gene labels moved to the
    right with yaxis.tick_right() like a clustermap, and thin INK_SOFT dendrogram
    lines with no spines give a clean, theme-consistent finish in both renders
  - 'All chrome is threaded through the INK/INK_SOFT/PAGE_BG theme tokens: the dark
    render has no dark-on-dark text, and the data colors are identical across both
    themes'
  weaknesses:
  - 'Suggestion: the lowest merges in the immune-gene branch of the row dendrogram
    crowd into about 30 px, so their heights are hard to tell apart; a slightly wider
    row-dendrogram column (width_ratios) would spread them.'
  - 'Suggestion: an optional sample-group color strip (tumour vs normal), explained
    by a legend, would make the column split easier to read at a glance.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole square 2400×2400 canvas.
      Chrome: centred title "heatmap-clustered · python · matplotlib · anyplot.ai" in dark ink at about 75 % of the width; 15 gene labels (IL6 … ENO1) on the right and 12 rotated sample labels (N1_B … T1_B) below, in dark grey; colorbar on the right with ticks −2…2 and the label "Expression (z-score)". All of it is readable.
      Data: a 15×12 heatmap in the Imprint diverging ramp (matte red → cream → blue) with cream gaps between the cells; a column dendrogram on top and a row dendrogram on the left, both in thin dark-grey lines, each leaf aligned with its column or row. The clustering splits N vs T samples, and the cell-cycle genes form a strong red/blue block. This is continuous data, so there is no categorical series.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title in light ink, tick labels and colorbar ticks in light grey #B8B7B0, colorbar label in light ink. Nothing is dark-on-dark.
      Data: the same red and blue anchors, with the ramp midpoint flipped to the dark surface as the style guide requires; near-zero cells fade into the background by design. Cell gaps are drawn in the page color, and the dendrogram lines are light grey and clearly visible.
      Legibility verdict: PASS
