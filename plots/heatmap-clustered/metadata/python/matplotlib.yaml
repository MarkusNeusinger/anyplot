review:
  strengths:
  - 'Clustermap layout built with a 2×2 gridspec: column dendrogram on top, row dendrogram
    on the left, gene labels on the right, and both dendrograms'' leaves aligned cell
    by cell with the heatmap (xlim/ylim set to 10 × leaf count)'
  - Ward linkage on Euclidean distances via scipy, rows and columns reordered by the
    dendrogram leaves; the reordering reveals clear tumor/normal and cell-cycle/metabolism/immune
    blocks
  - imprint_div colormap with a theme-adaptive midpoint, centered on zero through
    symmetric vmin/vmax, with a colorbar labelled 'Expression (z-score)' sized to
    the heatmap's height
  - Thin page-colored cell separators drawn with a minor-tick grid give the matrix
    a clean tiled look in both themes
  - Realistic gene-expression scenario with real gene symbols (CDK1, GAPDH, IL6, …)
    and tumor/normal sample replicates
  weaknesses:
  - 'VQ-03 (both): in the row dendrogram, the low-level merges of the cell-cycle and
    metabolism clusters crowd into a band about 30 px wide near the leaves, where
    the 1.4 pt vertical branch lines overlap and merge into thick bars (for example
    PKM/GAPDH/ENO1 and AURKA/BUB1/CDK1/PLK1) → thinner branch lines of about 0.8–1.0
    pt (−0.4 to −0.6 pt), so that neighboring merge heights stay apart. Likely cause:
    line.set_linewidth(1.4) on the dendrogram collections.'
  - 'Suggestion: near-zero cells take the imprint_div midpoint, which is the page
    color, so with page-colored separators a few cells (N1_B in PKM and GAPDH) read
    like gaps; a separator in a slightly different tone, such as INK at a low alpha,
    would keep every cell outlined.'
  - 'Suggestion: optional group color strips (tumor vs normal over the columns, gene
    module beside the rows), with a legend, would make the cluster agreement explicit.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the figure and every panel.
      Chrome: title "heatmap-clustered · python · matplotlib · anyplot.ai" in dark ink at the top, about 72 % of the width; the gene labels (IL6 … ENO1) are on the right of the heatmap, and the sample labels (N1_B … T1_B) are rotated 45° below it, all in dark-grey INK_SOFT; the colorbar on the right is labelled "Expression (z-score)" with ticks −2…2. All text is readable.
      Data: a 15×12 heatmap in the imprint_div palette (red #AE3030 → page color → blue #4467A3) with thin page-colored cell separators; the column dendrogram on top splits the normal (N1/N2) samples from the tumor (T1/T2) samples; the row dendrogram on the left splits the immune genes from the cell-cycle and metabolism genes. The leaves line up with the cells. The dendrogram lines are dark grey; the low-level merges in the row dendrogram crowd together near the leaves. This is a continuous plot, with no categorical series.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title is in light ink, the tick labels and colorbar ticks in light grey #B8B7B0, and the colorbar label is light. No dark-on-dark text; everything is readable.
      Data: the same layout and clustering; the colormap endpoints (#AE3030 red and #4467A3 blue) are identical to the light render, and only the midpoint flips to the dark surface, so near-zero cells read as near-black. The dendrogram lines are light grey and clearly visible.
      Legibility verdict: PASS
