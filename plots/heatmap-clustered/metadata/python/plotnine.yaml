      Data: 24x12 heatmap in imprint_div (matte red #AE3030 negative, off-white midpoint, blue #4467A3 positive) with hairline gaps; dark-grey column dendrogram on top and row dendrogram on the left, leaves aligned with cells; three row blocks (blue on basket/premium/order/loyalty, blue on coupon/return/discount/cart, blue on app/weekend/support) emerge clearly
      Legibility verdict: PASS

