review:
  strengths:
  - Uses the imprint_div ramp through scale_fill_gradient2 with a theme-adaptive midpoint
    and symmetric ±max limits, so zero sits at the colorbar centre in both themes
  - Dendrogram leaves line up exactly with their rows and columns, and Ward clustering
    on scipy's linkage produces clear blocks for the three customer segments
  - Colorbar uses plotnine 0.15's per-guide theme (legend_title_position='top') in
    an elevated frame spanning the matrix width
  - Customer-segmentation scenario with named behaviour metrics reads as a real analysis
    and fits the spec's Applications
  weaknesses:
  - 'CQ-01 (code): lines 104–131 wrap the dendrogram-to-segment conversion in a `branches()`
    function, and line 156 places the lower y-limit by the literal -6.2 → inline the
    conversion as one loop over the two trees, and name the column-label margin in
    # Constants. Likely cause: the segment conversion written as a helper, and the
    label margin tuned by hand.'
  - 'Suggestion: row color strips for the three segments, aligned with the rows and
    explained by a legend, would show how well the clustering recovers them (the Notes
    allow them).'
  - 'Suggestion: the band between the rotated column labels and the colorbar could
    be tightened so the matrix takes more of the canvas.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas
