review:
  strengths:
  - Heatmap and both dendrograms share one coordinate system (geom_tile plus geom_segment
    in a single ggplot), so every leaf of the row and column trees lines up exactly
    with its row or column of cells in both renders
  - Rows and columns reordered by Ward linkage via scipy.cluster.hierarchy.linkage/dendrogram;
    the three planted gene × sample blocks emerge as clear red/blue blocks
  - 'Diverging fill follows imprint_div exactly: scale_fill_gradient2 from #AE3030
    through the theme''s page color to #4467A3 with midpoint=0, plus a color bar titled
    ''Expression (z-score)'''
  - 'Theme tokens are applied throughout: #FAF8F1 / #1A1A17 page, INK/INK_SOFT text
    and dendrogram lines, ELEVATED_BG legend frame; all text is readable in both renders'
  - Dendrogram depth is scaled to 22 % of the matrix side, so merge heights can be
    told apart while the matrix stays dominant; gene labels sit on the right via position='right'
    clear of the row tree
  weaknesses:
  - 'VQ-05 (both): a thin INK-colored panel frame encloses the matrix and both dendrograms,
    and the column tree''s root merge runs into its top edge → no frame around the
    dendrogram area (blank the panel border), leaving the root clear of any line.
    Likely cause: panel_background=element_rect(fill=PAGE_BG) without color=PAGE_BG,
    so the panel border keeps the default rect color.'
  - 'DQ-02 (both): rows labelled Gene_01…Gene_20 and columns Sample_A…Sample_O read
    as placeholder ids → plausible gene symbols (e.g. CD3E, MKI67, COL1A1) and sample
    names (e.g. Tumor_01, Normal_03). Likely cause: the index and columns list comprehensions
    in the data block.'
  - 'CQ-01 (code): a helper function dendro_segments (lines 63–68) breaks the imports
    → data → plot → save structure → inline its list comprehension where col_seg and
    row_seg are built. Likely cause: the def block.'
  - 'Suggestion: row or column color strips for the three planted groups, which the
    spec''s Notes invite, would make the cluster blocks easier to name.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 3200x1800 canvas.
      Chrome: bold title "heatmap-clustered · python · letsplot · anyplot.ai" top-left in near-black; axis titles "Samples" (bottom) and "Genes" (right, vertical) in INK; rotated sample tick labels below and gene tick labels on the right in dark grey INK_SOFT; color bar "Expression (z-score)" in an elevated cream frame on the right. All text readable. A thin dark panel frame encloses the matrix and both dendrograms.
      Data: 20 genes x 15 samples, reordered by Ward clustering; red (#AE3030) for negative, page-colored midpoint at 0, blue (#4467A3) for positive. Three blocks stand out (Genes 01–07 high in Samples A–E, Genes 08–14 high in F–J, Genes 15–20 high in K–O). Row dendrogram on the left and column dendrogram on top in dark grey lines, each leaf aligned with its row/column.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17 across the whole canvas.
      Chrome: title and axis titles in light INK, tick labels in light grey INK_SOFT, legend in a #242420 elevated frame with light text; no dark-on-dark text. Dendrogram lines in light grey are clearly visible.
      Data: same red and blue anchors as the light render; the midpoint follows the dark page, as imprint_div prescribes, so near-zero cells read dark and the blocks show as red/blue against them.
      Legibility verdict: PASS
