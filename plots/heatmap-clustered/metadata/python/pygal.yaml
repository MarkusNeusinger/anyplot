      Data: 12x10 matrix in the Imprint diverging field ramp (#AE3030 red → page color → #4467A3 blue), 2 px page-colored cell gaps; row dendrogram on the left and column dendrogram above in #4A4A44, leaves at the cell centres; chemotherapy and targeted drug blocks visible as red regions
      Legibility verdict: PASS

