review:
  strengths:
  - Both dendrograms come from SciPy Ward linkage on Euclidean distances, and each
    leaf sits at the centre of its row or column of cells; the column dendrogram above
    the matrix and the row dendrogram on its left follow the clustermap layout
  - 'Rows and columns reordered by the clustering: the chemotherapy drugs form a red
    block over HCT116/SW480/A549/HT29 and the targeted drugs a red block over U87/KHOS,
    so the planted structure reads at a glance'
  - 'Imprint diverging field ramp #AE3030 → page color → #4467A3 with the theme''s
    own midpoint, centered on zero by a symmetric ±max limit, with a matching 80-step
    colorbar'
  - Theme tokens threaded through every text, stroke and cell gap, so both renders
    read cleanly with light-on-dark and dark-on-light ink
  - 2 px page-colored gaps between cells give a tiled matrix without grid lines; drug
    and cell-line names are real and plausible
  - Drawing goes into pygal's own SVG tree, so the PNG and the interactive HTML share
    one drawing
  weaknesses:
  - 'CQ-01 (code): line 99 `class ClusteredHeatmap(Graph)` holds the whole drawing
    (dendrograms, cells, labels, colorbar) in its `_plot()` method, and the agent
    chat''s validator refuses every class definition → draw the matrix and dendrograms
    at the top level without a Python class (for example a pygal chart whose cells
    and branches are plain series, or an SVG string assembled top-down). Likely cause:
    the Graph subclass carried over from the previous version.'
  - 'Suggestion: colorbar ticks at round values (−2, −1, 0, +1, +2) would let a reader
    read a cell value off more easily than the ±2.3 extremes alone.'
  - 'Suggestion: the two overlapping horizontal merge segments of the column dendrogram
    above SW480/A549 sit only a few pixels apart; a slightly taller column dendrogram
    would separate them.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, 3200x1800 canvas
