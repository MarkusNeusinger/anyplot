review:
  strengths:
  - Row and column dendrograms from SciPy Ward linkage, leaves aligned with the matrix
  - Real drug and cell-line names with class and lineage blocks
  - Graph subclass draws into pygal's SVG tree, shared by PNG and HTML
  weaknesses:
  - 'AR-09 (both): colorbar title ''Sensitivity (log IC50)'' is cut at the right canvas
    edge, showing only ''Sensitivity (log IC'' → keep it fully inside the canvas,
    e.g. rotate it beside the bar. Likely cause: centred text at cb_title_x with colorbar_width=180
    leaves no room on the right.'
  - 'VQ-05 (both): canvas is 4800x2700 → 3200x1800 or 2400x2400. Likely cause: ClusteredHeatmap(width=4800,
    height=2700).'
  - 'VQ-07 (both): diverging map uses Material blues/reds with a fixed near-white
    midpoint → imprint_div #4467A3 ↔ page color ↔ #AE3030. Likely cause: the diverging_colormap
    list.'
  - 'VQ-01 (both): title at 28 px and column labels at 30 px on the large canvas read
    tiny → pygal references 66 / 44 px. Likely cause: title_font_size=28 and col_font_size=min(30,
    …).'
  - 'VQ-02 (both): colorbar title overlaps the top-right SKOV3 cells, and ''5-Fluorouracil''/''Gemcitabine''
    touch the row dendrogram leaves → clear both by at least 10 px. Likely cause:
    cb_title_y and label_margin_left too small for the longest label.'
  - 'SC-04 (both): title ''heatmap-clustered · pygal · anyplot.ai'' lacks the language
    → ''heatmap-clustered · python · pygal · anyplot.ai''. Likely cause: the title
    string.'
  - 'CQ-04 (code): sys.path removal hack and the unused show_values/_get_text_color
    branch add about 25 lines without visible effect → delete them. Likely cause:
    leftovers from earlier versions.'
  image_description: |-
