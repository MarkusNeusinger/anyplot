review:
  strengths:
  - One sns.clustermap call with method='ward', metric='euclidean' produces both dendrograms,
    the reordering and the colorbar; Immune, Metabolic and Signaling rows and Control/Treatment
    columns fall into clean blocks with every gene and sample label at its own row
    or column
  - Diverging Imprint cmap centered on zero with symmetric vmin/vmax from the data's
    absolute maximum, so 0 sits exactly at the page-colored midpoint
  - Row and column color strips use Imprint hues that deliberately skip the cmap's
    blue and red poles, are aligned cell by cell and are explained by two figure legends
    (Gene group, Condition)
  - tree_kws in INK_SOFT keeps the dendrogram branches visible on both backgrounds,
    and dendrogram_ratio=0.14 keeps them a minor share of the figure; merge heights
    are distinguishable
  - Realistic, neutral gene-expression scenario with real gene symbols and opposing
    immune/metabolic responses to treatment; seeded and reproducible
  - 'Theme chrome threaded through sns.set_theme rc and explicit tick/label colors:
    all text readable in both renders; canvas exactly 2400x2400 without bbox_inches=''tight'''
  weaknesses:
  - 'VQ-01 (both): colorbar tick labels at 6 pt and the colorbar title at 7 pt are
    the smallest text on the canvas and blur in the 400 px thumbnail → about 8 pt
    for the ticks and 9 pt for the title (+2 pt). Likely cause: g.cax.tick_params(labelsize=6)
    and g.cax.set_title(..., fontsize=7).'
  - 'Suggestion: in the dark render the near-zero cells of the Signaling block nearly
    merge with the #1A1A17 page; a slightly lighter cell linecolor (e.g. INK at low
    alpha) would keep the grid of cells legible there.'
  - 'Suggestion: the tight lower merges of the row dendrogram crowd against the color
    strip; a slightly larger row dendrogram_ratio would spread the within-group merge
    heights.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1 across the whole 2400x2400 canvas.
      Chrome: title "heatmap-clustered · python · seaborn · anyplot.ai" centered at top in dark ink (~70% width); axis titles "Samples" (bottom) and "Genes" (right); 30 gene tick labels on the right, 20 rotated sample tick labels below; colorbar "Expression (z-score)" top-left with ticks -2, 0, 2; legends "Gene group" (Immune/Metabolic/Signaling) bottom-left and "Condition" (Control/Treatment) bottom-right. All text dark on light and readable; colorbar ticks are small.
      Data: 30x20 heatmap in the blue (#4467A3) → page → red (#AE3030) diverging ramp, thin page-colored cell borders; column dendrogram on top splits Trt-* from Ctrl-*, row dendrogram on the left splits Immune, Metabolic and Signaling; row strip green #009E73 / purple #C475FD / amber #BD8233, column strip plum #954477 (Treatment) / cyan #2ABCCD (Control). Dendrogram lines in dark grey INK_SOFT. Clear blocks: Immune red in Treatment, Metabolic red in Control, Signaling mixed.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: title, axis titles, tick labels, colorbar title and legend text all in light ink (#F0EFE8 / #B8B7B0) and readable; no dark-on-dark text. Dendrogram lines light grey, clearly visible.
      Data: identical cmap anchors and identical annotation strip colors as the light render; only the cmap midpoint flips to the dark page color, so near-zero cells read near-black (style-guide behavior); brand green #009E73 strip clearly visible.
      Legibility verdict: PASS
