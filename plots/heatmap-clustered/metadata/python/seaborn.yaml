review:
  strengths:
  - Uses sns.clustermap natively with method="ward" and metric="euclidean", so the
    reordering and both dendrograms come from the library in one call, each leaf aligned
    with its row or column of cells
  - row_colors and col_colors give gene-group and condition strips, aligned cell by
    cell and explained by two figure legends; the strips confirm that the clusters
    recover the planted groups
  - The Imprint diverging colormap has a theme-adaptive midpoint and symmetric vmin/vmax
    around zero, and the annotation strips skip the two diverging end hues so the
    strips cannot be confused with the value scale
  - 'Layout is tuned with dendrogram_ratio, colors_ratio, cbar_pos and tree_kws: the
    dendrograms stay slim, their lines read in both themes, and the color bar sits
    in the otherwise empty top-left corner'
  - Thin page-colored cell separators (linewidths=0.3, linecolor=PAGE_BG) define the
    grid without adding ink in either theme
  weaknesses:
  - 'VQ-01 (both): row and column tick labels at 6 pt get very small in the 400 px
    thumbnail (about 5 px high) → about 7 pt (+1 pt); the 30 rows leave room for it.
    Likely cause: tick_params labelsize=6 on g.ax_heatmap.'
  - 'DQ-02 (both): the genes are labelled I01–I10, M11–M20 and S21–S30, and the samples
    C01/T11, so the gene-expression scenario reads as generic codes → plausible gene
    symbols per group (for example IL6, CXCL8 for Immune; PFKM, HK2 for Metabolic)
    and sample ids such as Ctrl-1 / Trt-1. Likely cause: the f"{g[0]}{i + 1:02d}"
    label generation.'
  - 'Suggestion: the gap between the ''Samples'' axis title and the bottom legends
    is large; moving the legends up slightly would tighten the layout.'
  image_description: |-
    Light render (plot-light.png):
      Background: warm off-white #FAF8F1, square 2400x2400 canvas.
      Chrome: title "heatmap-clustered · python · seaborn · anyplot.ai" centered at the top, dark ink, about 70% of the width; the axis titles "Samples" (bottom) and "Genes" (right) and the 6 pt tick labels (I03 … S29, T12 … C10) are dark gray and readable; the color bar sits top-left with the title "Expression (z-score)" and ticks −2/0/2; the legends "Gene group" (Immune, Metabolic, Signaling) bottom-left and "Condition" (Control, Treatment) bottom-right. Everything is readable.
      Data: a 30×20 heatmap in the Imprint diverging map (blue #4467A3 → page → red #AE3030) with thin page-colored cell borders; the dark-gray column dendrogram on top splits Treatment from Control at a high merge; the row dendrogram on the left splits Immune from Metabolic and Signaling. Row strips are green #009E73 (Immune), purple #C475FD (Metabolic) and amber #BD8233 (Signaling); column strips are plum #954477 (Treatment) and cyan #2ABCCD (Control). Clear blocks: Immune is red in Treatment and blue in Control, Metabolic is the opposite, Signaling is mixed and near neutral.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: warm near-black #1A1A17.
      Chrome: the title, axis titles and color-bar title are light ink, the tick labels light gray; the dendrogram lines are light gray (#B8B7B0) and clearly visible; the legend glyphs have light outlines. No dark-on-dark text.
      Data: the same strip colors and diverging end hues as the light render; only the colormap midpoint flips to #1A1A17, so near-zero cells sink toward the background as the theme-adaptive midpoint intends, while the red and blue blocks stay distinct. The cell borders are page-colored.
      Legibility verdict: PASS
