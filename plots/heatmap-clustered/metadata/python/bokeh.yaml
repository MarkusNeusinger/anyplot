review:
  strengths:
  - Dendrogram leaves are mapped exactly onto the cell centers by sharing x_range/y_range
    Range1d objects between the dendrogram and heatmap figures
  - Ward/Euclidean clustering via scipy.cluster.hierarchy reorders both axes; tumor/normal
    and gene-family blocks emerge clearly
  - The Imprint diverging ramp has a theme-adaptive midpoint and symmetric limits
    derived from the data; theme chrome is correct in both renders
  - HoverTool exposes the gene, sample and value per cell in the HTML output
  weaknesses:
  - 'Suggestion: the Gene axis title reads top-to-bottom while the color bar title
    reads bottom-to-top; one orientation for both would read more calmly.'
  - 'Suggestion: a tumor/normal column color strip with a small legend (allowed by
    the Notes) would label the dominant column split directly.'
