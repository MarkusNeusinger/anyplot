review:
  strengths:
  - 'Clustermap layout built natively with make_subplots: column dendrogram above,
    row dendrogram left, a gene-cluster strip and the matrix share axes, so every
    dendrogram leaf lines up with its row or column of cells in both renders'
  - Ward/Euclidean clustering reorders rows and columns so tumor (T1/T2) and normal
    (N1/N2) samples split into two clear blocks and the immune genes separate from
    the cell-cycle genes
  - Imprint diverging scale with zmid=0 and symmetric zmin/zmax, theme-adaptive midpoint,
    colorbar with a wrapped title
  - 'Gene-cluster color strip cut from the row dendrogram with fcluster, colored in
    Imprint order starting at #009E73 and explained by a titled legend group'
  - Hover templates with customdata name gene, sample and z-score in the HTML output;
    dendrogram traces skip hover
  weaknesses:
  - 'SC-02 (both): in the upper row cluster (PLK1 to BRCA1) and in the column dendrogram
    near N2_A/N2_B and T1_A/T1_B the low merges are squeezed into a few pixels, so
    their merge heights cannot be told apart and the short horizontal segments draw
    almost on top of each other → give the row dendrogram panel more width (about
    0.13 → 0.18 of the figure) and the column dendrogram more height so the inner
    merges spread out. Likely cause: make_subplots column_widths[0]=0.13 and row_heights[0]=0.15
    with linear dcoord scaling dominated by the top merge.'
  - 'Suggestion: the ''Gene'' axis title floats alone between the tick labels and
    the color bar; placing it closer to the gene labels or dropping it in favour of
    the tick labels would tidy the right side.'
  - 'Suggestion: the legend leaves a wide gap between each cluster swatch and its
    label; a tighter itemwidth would make the legend more compact.'
