review:
  strengths:
  - Both dendrograms are drawn from scipy's dendrogram coordinates mapped onto cell
    indexes, so every leaf lines up with its row or column and the tumor/normal split
    reads at a glance
  - imprint_div with a theme-adaptive midpoint, zmid=0 and symmetric limits, plus
    1 px page-colored cell gaps that keep near-zero cells separable in the dark render
  - Gene-cluster strip cut from the row dendrogram, aligned row by row and explained
    by a legend in canonical Imprint order
  - Rich hovertemplate with customdata (gene, sample, z-score) for the HTML view
  weaknesses:
  - 'Suggestion: the Gene axis title sits closer to the colorbar than to the gene
    labels; standoff or a left-side placement would tie it to its labels.'
  - 'Suggestion: the low merges inside cluster 4 crowd into about 30 px of the row
    dendrogram; a square-root distance axis would spread them.'
