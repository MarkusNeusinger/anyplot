review:
  strengths:
  - Manual dendrogram construction via geom_segment (row + column) is a genuinely
    distinctive ggplot2 technique — the library has no native clustermap geom, and
    the merge-height/leaf-position math is correctly derived from hclust() output
  - Rows and columns are correctly reordered by hierarchical clustering (Ward's linkage),
    and the reordering visibly recovers the latent Up/Down/Stable gene programs and
    Control/Treatment sample groups as clean blocks
  - Column group annotation strip (Control/Treatment, Imprint green + lavender) plus
    its text labels add a clear extra layer of interpretability beyond a bare heatmap
  - Correct diverging color scale (AE3030 -> mid -> 4467A3) matching the library's
    approved continuous stops, with the midpoint tied to the actual zero of the z-scored
    data
  - Clean theme-token handling — title/subtitle/axis text/legend text all flip correctly
    between light and dark with no legibility failures in either render
  - Square 2400x2400 canvas hit exactly via ggsave(width=6,height=6,dpi=400); no edge
    clipping on title, tick labels, or legend in either theme
  - 'Minimal, reproducible code: single seed, only ggplot2 + ragg imported, no functions/classes
    despite the nontrivial dendrogram geometry'
  weaknesses:
  - No row-side color/group annotation for the latent gene module (Up/Down/Stable)
    — the spec explicitly suggests row AND column color bars for a full 'clustermap
    style' plot, and only the column strip (Control/Treatment) was implemented
  - The diverging scale's midpoint color is set to the page background (DIV_MID =
    PAGE_BG) in both themes, so near-zero z-score tiles fade almost fully into the
    surrounding canvas (visible around Gene 20 / Gene 19 rows in both renders) — consider
    a distinct near-white/near-black-but-not-identical mid tone so zero-valued cells
    stay visually part of the grid
  - Rotated x-axis sample labels (size 8) and y-axis gene labels (size 7) are slightly
    imbalanced in scale — minor, both remain legible
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, applied to both plot.background and panel.background.
      Chrome: Bold dark title "heatmap-clustered · r · ggplot2 · anyplot.ai" top-left, grey subtitle below it. A column dendrogram sits above a green/lavender Control/Treatment annotation strip, which sits above the 20-gene x 14-sample tile grid; a row dendrogram runs down the left edge; gene labels run down the right edge; rotated sample labels run along the bottom; a horizontal "Z-score" diverging legend (red -1 to blue +1) sits below the plot. All text is dark-on-light or grey-on-light and clearly readable; no light-on-light failures.
      Data: Tiles are colored on a red (negative z-score) to near-white (zero) to blue (positive z-score) diverging scale; first categorical annotation color is Imprint green (#009E73) for Control, lavender (#C475FD) for Treatment. Clear red/blue block structure recovers the synthetic Up/Down gene programs against Control/Treatment groups.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, applied consistently to plot and panel background.
      Chrome: Same title/subtitle now rendered in light ink and soft light grey, both clearly legible against the dark surface. Dendrogram lines rendered in light grey, clearly visible against black. Annotation strip labels ("Control"/"Treatment") are light grey and legible above the still-green/lavender strip. Legend text and title are light and readable against the dark legend background.
      Data: Colors are identical to the light render — same green/lavender annotation colors, same red-to-blue diverging tile scale with the same block pattern preserved. No dark-on-dark text failures were found anywhere (title, axis labels, ticks, legend all pass).
      Legibility verdict: PASS
