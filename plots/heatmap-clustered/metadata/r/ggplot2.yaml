review:
  strengths:
  - Row-side group annotation strip for the gene module (Up/Down/Stable) is now implemented
    alongside the existing column strip (Control/Treatment), completing the spec's
    clustermap-style requirement for row AND column color bars
  - DIV_MID is now set to ELEVATED_BG (distinct from PAGE_BG) in both themes, so near-zero
    z-score tiles stay visually part of the grid instead of fading into the canvas
    — directly fixes the previous review's main VQ-03 weakness
  - Manual dendrogram construction via geom_segment (row + column), with merge-height/leaf-position
    math correctly derived from hclust() output, remains a genuinely distinctive ggplot2
    technique the library has no native geom for
  - Rows and columns are correctly reordered by Ward's-linkage clustering, visibly
    recovering the latent Up/Down/Stable gene programs and Control/Treatment sample
    groups as clean blocks in both renders
  - Row and column annotation colors are drawn from non-overlapping Imprint palette
    slots that also avoid the red/blue used by the diverging heatmap scale, preventing
    cross-encoding color confusion in a plot with three simultaneous color channels
  - 'Correct diverging color scale (#AE3030 -> theme-adaptive mid -> #4467A3) with
    the midpoint tied to the actual zero of the z-scored data'
  - Clean theme-token handling — title, subtitle, both annotation strips' labels,
    dendrogram lines, axis text, and legend all flip correctly between light and dark
    with no legibility failures
  - Exact square 2400x2400 canvas via ggsave(width=6, height=6, dpi=400); no edge
    clipping on title, tick labels, row/column labels, or legend in either theme
  - 'Minimal, reproducible code: single seed, only ggplot2 + ragg imported, no functions/classes
    despite the nontrivial dendrogram and dual-annotation geometry'
  weaknesses:
  - Rotated x-axis sample labels (size 8) and y-axis gene labels (size 7) remain slightly
    imbalanced in scale — minor, both stay legible in both renders
  - Row-group annotation palette skips Imprint positions 2/3/5 (uses 4, 6, 7) to avoid
    reusing colors already spent on the column strip and the diverging heatmap scale
    — a reasonable design call, but worth a code comment documenting the reasoning
    for future maintainers
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, consistent with #FAF8F1, applied to both plot.background and panel.background.
      Chrome: Bold dark title "heatmap-clustered · r · ggplot2 · anyplot.ai" top-left, grey subtitle below it. A column dendrogram sits above a green/lavender Control/Treatment annotation strip with text labels, which sits above the 20-gene x 14-sample tile grid. A row dendrogram runs down the left edge, followed by a cyan/ochre/rose Up/Down/Stable annotation strip with rotated text labels ("Down", "Up", "Stable"). Gene labels run down the right edge; rotated sample labels run along the bottom; a horizontal "Z-score" diverging legend (red -1 to blue +1) sits below the plot. All text is dark-on-light or grey-on-light and clearly readable; no light-on-light failures.
      Data: Tiles are colored on a red (negative z-score) to near-white (zero) to blue (positive z-score) diverging scale, and near-zero tiles remain visually distinct from the page background (no fading, unlike the prior attempt). First categorical annotation color is Imprint green (#009E73) for Control, lavender (#C475FD) for Treatment; row-group strip uses ochre (#BD8233) for Up, cyan (#2ABCCD) for Down, rose (#954477) for Stable. Clear red/blue block structure recovers the synthetic Up/Down gene programs against Control/Treatment groups, and the new row strip visibly aligns with the row dendrogram's three leaf clusters.
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, consistent with #1A1A17, applied consistently to plot and panel background.
      Chrome: Same title/subtitle rendered in light ink and soft light grey, clearly legible against the dark surface. Both dendrograms render in light grey, clearly visible against black. Both annotation strips' text labels ("Control"/"Treatment" and "Down"/"Up"/"Stable") are light grey and legible against the dark background. Legend text and title are light and readable against the dark legend background.
      Data: Colors are identical to the light render — same green/lavender column-strip colors, same ochre/cyan/rose row-strip colors, same red-to-blue diverging tile scale with the same block pattern preserved. The diverging midpoint is now a distinct near-black tone (ELEVATED_BG) rather than pure PAGE_BG, so near-zero z-score tiles (e.g. Gene 19/20 rows) remain visible as part of the grid instead of vanishing into the canvas. No dark-on-dark text failures were found anywhere (title, axis labels, ticks, legend all pass).
      Legibility verdict: PASS
