review:
  strengths:
  - Fully custom Ward's-method hierarchical clustering and dendrogram geometry implemented
    from scratch in native Julia, correctly reordering both rows and columns.
  - 'Correct theme-adaptive imprint_div usage: identical data colors between light/dark
    renders, only chrome (backgrounds, text, dendrogram ink) flips.'
  - Well-composed multi-panel GridLayout combining column dendrogram, row dendrogram,
    heatmap, and colorbar with sensible relative sizing (colsize!, rowsize!).
  - Realistic synthetic gene-expression data with four distinct latent modules that
    the clustering meaningfully recovers.
  - All font sizes explicitly set; rotated tick labels are clean and don't overlap
    or clip.
  weaknesses:
  - In the dark render, near-zero-valued heatmap cells (colored at the theme-adaptive
    midpoint, which equals the page background) blend into each other and into the
    surrounding canvas because the heatmap has no grid lines or outer frame — add
    a subtle cell stroke or a light spine/box around the heatmap axis (theme-adaptive
    INK_SOFT at low alpha) so the block structure and heatmap boundary stay legible
    regardless of theme.
  - The spec's optional suggestion to add row/column color bars annotating the Ctrl/TreatA/TreatB
    groups was not implemented — this would reinforce the clustering story and is
    worth adding given the extra space available in the current layout.
  - Clustering logic relies on several helper functions rather than a flat top-to-bottom
    script; understandable given no clustering package is available in the Julia CI
    runtime, but could use brief inline comments explaining the Ward's-linkage update
    step for readability.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1.
      Chrome: Bold dark title "heatmap-clustered · julia · makie · anyplot.ai" at top; column dendrogram above the grid; row dendrogram to the left; sample tick labels rotated 45deg below the grid; gene tick labels on the right; colorbar labeled "Expression (row z-score)" on the far right. All chrome text readable.
      Data: Imprint diverging colormap (matte red -> off-white midpoint -> blue) applied to row z-scored expression; first/only continuous scale, no categorical series. Rows/columns reordered by clustering, revealing clear block structure (4 gene modules x 3 conditions).
      Legibility verdict: PASS

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17.
      Chrome: Same layout with title, dendrogram lines, and tick labels flipped to light ink/off-white. All chrome text readable, no dark-on-dark title/label/tick failures.
      Data: Colors identical to light render at the extremes (matte red / blue), confirming only chrome flipped. However, because the diverging colormap's midpoint equals the dark page background, near-zero cells render as near-black tiles that visually merge with each other and with the surrounding canvas in several regions (e.g., TreatB columns for several genes), since there are no grid lines or an outer frame around the heatmap to preserve cell/block boundaries.
      Legibility verdict: PASS (text); flagged data-visibility caveat for near-zero cells blending into background (see weaknesses).
