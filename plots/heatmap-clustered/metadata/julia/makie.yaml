review:
  strengths:
  - Custom from-scratch Ward's-method hierarchical clustering (with correct Lance-Williams
    distance updates) applied independently to rows and columns, correctly reordering
    both dendrograms to reveal the genuine four-module block structure in the synthetic
    data.
  - Diverging Imprint colormap (imprint_div) correctly theme-adapts its midpoint stop
    to the page background, and a thin theme-adaptive cell grid keeps near-zero cells
    visually separated from each other and the canvas in both themes.
  - Title, axis tick labels, and colorbar label are legible and correctly styled in
    both light and dark themes with no dark-on-dark or light-on-light failures.
  - 45-degree-rotated column tick labels avoid overlap despite 12 densely-packed sample
    labels.
  weaknesses:
  - 'The ''Group'' swatch legend (Legend(fig[2,3], ...), showing Ctrl/TreatA/TreatB
    colors) is completely invisible in both renders. Verified by direct pixel inspection:
    none of the three Imprint swatch colors (#009E73, #C475FD, #4467A3) appear anywhere
    in either PNG. Likely root cause: Colorbar(fig[4,3], hm; width = 18, ...) sets
    a fixed narrow pixel width on GridLayout column 3, and since Legend shares that
    same column at a different row, the whole column collapses to that fixed width,
    squeezing the legend down to nothing. Fix by moving the legend out of the shared
    column - e.g. place it in its own row (fig[1, 1:3] alongside/under the title,
    horizontal orientation) or give it a dedicated column with its own colsize!, rather
    than sharing column 3 with the fixed-width Colorbar.'
  - The column group-color annotation strip (col_group_ax at fig[3,2], meant to show
    the Ctrl/TreatA/TreatB colors under the column dendrogram) is invisible in both
    renders. rowsize!(fig.layout, 3, Relative(0.02)) squeezes it to near-zero pixel
    height - confirmed by pixel scan showing pure background color across that entire
    row band, no strip pixels at all. Increase row 3 to roughly Relative(0.05)-Relative(0.06)
    and rebalance rows 2/4 accordingly (e.g. row2=0.13, row3=0.05, row4=0.70) so the
    strip renders at a visible ~25-30 px height.
  - Since the legend currently points to nothing visible on the canvas, either fix
    both elements together (legend + strip, so the legend has something to explain)
    or remove both if they can't be made to render reliably - a legend for content
    that isn't there is more confusing than no legend at all.
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white, matches #FAF8F1 target.
      Chrome: Bold dark-ink title "heatmap-clustered · julia · makie · anyplot.ai" top-center. Column dendrogram (dark grey lines) across the top showing three major sample clusters. Row dendrogram (dark grey, reversed) to the left of the heatmap showing four gene clusters. Row labels (Gene 01-Gene 16, reordered) on the right; column labels (Ctrl-N/TreatA-N/TreatB-N, reordered) rotated 45 degrees along the bottom, none clipped. Colorbar labeled "Expression (row z-score)" at bottom-right. All text is dark ink on cream background, clearly legible.
      Data: 16x12 heatmap using the diverging Imprint colormap (red negative / cream midpoint / blue positive) for row z-scores; thin theme-adaptive grid separates cells.
      Legibility verdict: PASS for all rendered/visible elements.
      DEFECT (verified by pixel inspection, not a legibility issue but a rendering bug): the "Group" swatch legend (Ctrl/TreatA/TreatB colors, coded at fig[2,3]) and the column group-color annotation strip (coded at fig[3,2], meant to sit between the column dendrogram and heatmap) are both completely invisible - scanning the full image for the three Imprint palette swatch colors (#009E73, #C475FD, #4467A3) found zero matching pixels, and the row band reserved for the strip is flat background color.

    Dark render (plot-dark.png):
      Background: Warm near-black, matches #1A1A17 target.
      Chrome: Title, dendrogram lines, tick labels, and colorbar label all correctly flipped to light-colored ink on the dark background; all clearly readable. No dark-on-dark failures found anywhere.
      Data: Confirmed identical data colors/positions to the light render (same reordered red/white/blue cell pattern) - only chrome flipped, as required.
      Legibility verdict: PASS for all rendered/visible elements.
      Same DEFECT persists: the Group legend and column group-color strip are equally invisible here (layout bug, independent of theme).
