review:
  strengths:
  - Correct hand-rolled Ward's-method hierarchical clustering (Lance-Williams update)
    reorders both rows and columns, matching the required clustermap style and revealing
    the four latent gene modules as clean blocks.
  - 'Diverging Imprint colormap (#AE3030 -> theme background midpoint -> #4467A3)
    is centered on zero exactly as the spec requires, with the midpoint correctly
    swapped per theme so near-zero cells stay legible in both light and dark.'
  - Thin theme-adaptive gridlines between heatmap cells keep near-zero (background-colored)
    cells visually separated without adding visual noise; all axis spines are hidden
    for a clean clustermap look.
  - Realistic, neutral gene-expression scenario (control + two treatments, four replicates)
    with genuine module structure and per-cell noise, giving the clustering something
    real to recover.
  - Title format, colorbar placement/labeling, and theme chrome (background, ink,
    tick colors) are all correct and consistent between the light and dark renders.
  weaknesses:
  - The 'Group' Legend (fig[2,3]) and the Ctrl/TreatA/TreatB color annotation strip
    (fig[3,2], col_group_ax/image!) are built in code but render as nothing in BOTH
    plot-light.png and plot-dark.png -- pixel-sampled the exact cell regions and found
    only the page background color, no legend swatches and no annotation-strip colors
    anywhere on the canvas. Investigate the GridLayout sizing (rowsize!/colsize! interaction
    between row 2/3 and the Legend/image! axis) so these elements actually get drawn,
    or remove the dead code if the layout can't be fixed -- right now it wastes canvas
    space and the intended per-column group annotation never reaches the viewer.
  - Because the group legend never renders, SC-04 (title & legend) and the optional
    row/column color-bar feature from the spec are only partially delivered -- column
    group membership is only recoverable from the 'Ctrl-N/TreatA-N/TreatB-N' tick
    labels, not from the intended visual annotation.
  - Colorbar label and tick text rely on Makie's default sizing (no explicit labelsize/ticklabelsize
    passed to Colorbar), unlike the heatmap's own tick labels which are explicitly
    sized -- set these explicitly for consistency.
  - 'CQ-01 KISS Structure is heavily bent: four helper functions (pairwise_sqdist,
    ward_linkage, collect_leaves!, dendrogram_segments) implement clustering/dendrogram
    layout from scratch. Understandable given no clustering package is available in
    this Julia runtime, but worth a comment noting why, since reviewers will flag
    the function-heavy structure.'
  image_description: |-
    Light render (plot-light.png):
      Background: Warm off-white (~#FAF8F1), correct for light theme.
      Chrome: Bold dark title "heatmap-clustered · julia · makie · anyplot.ai" centered at top, fully visible, not clipped. Column tick labels (Ctrl-1..TreatB-4 style) rotated ~45 deg below the heatmap, fully readable, no overlap. Row tick labels ("Gene 01".."Gene 16") on the right edge of the heatmap, all legible. Colorbar on the far right labeled "Expression (row z-score)" with ticks -2..2, fully visible and not clipped. Column and row dendrograms render correctly above and to the left of the heatmap respectively, in soft dark-gray lines, showing three clear column clusters and multiple row clusters. HOWEVER: the intended "Group" legend (Ctrl/TreatA/TreatB color key) and the colored group-annotation strip beneath the column dendrogram are both entirely absent -- pixel-sampled that exact screen region and found only page-background color, no swatches, no strip. All other text is legibility PASS.
      Data: Heatmap cells use a red (#AE3030) - near-background - blue (#4467A3) diverging scale, correctly centered at zero (white/near-background at 0). Three visible column super-clusters correspond to Ctrl / TreatB / TreatA groups (confirmed via tick labels since the color strip is missing). Colors are clearly distinguishable cell-to-cell thanks to the added thin grid separators.
      Legibility verdict: PASS (all rendered text is legible; the missing legend is a completeness/functionality defect, not a legibility one).

    Dark render (plot-dark.png):
      Background: Warm near-black (~#1A1A17), correct for dark theme.
      Chrome: Title renders in light/white bold text, fully legible against the dark background. Column and row tick labels render in a light gray (INK_SOFT), clearly legible, no dark-on-dark issues anywhere. Dendrogram lines render in light gray, clearly visible against the black background. Colorbar ticks and label are light-colored and legible. Same missing-legend / missing-annotation-strip defect as the light render: sampled the same screen coordinates and found only the page background color -- no group swatches, no colored strip.
      Data: Data colors are pixel-identical to the light render (#AE3030 / midpoint / #4467A3 diverging scale) -- only the chrome (background, text, grid) flips, exactly as required. No hue shift between themes was found in the heatmap cells.
      Legibility verdict: PASS (no dark-on-dark or light-on-light failures found; same missing-legend defect carries over from the light render).
